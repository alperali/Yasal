  <mvz-madde no="36" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>17.7.1964 tarihli ve 506 sayılı Kanunun Geçici 20 nci maddesine göre, bankalar, sigorta ve reasürans şirketleri, ticaret odaları, sanayi odaları, borsalar veya bunların teşkil ettikleri personeli için kurulmuş bulunan sandıklardan; 25.4.1985 tarihli ve 3182 sayılı Bankalar Kanununa göre birleştiren, bir başka bankaya devredilen veya bankacılık faaliyetleri sona eren bankaların personeline ait olanlar ile mali durumları üyelerinin sosyal güvenlik yardımlarını sürdürmeye elverişli olmadığı anlaşılanların yetkili organlarının ilgili mevzuat hükümlerine göre fesih ya da devir için alacakları karar üzerine, bütün aktif ve pasifleriyle birlikte Sosyal Sigortalar Kurumuna devredilmesine Cumhurbaşkanı yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Sandıkların devri sırasında yapılacak aktüeryal hesaplamalar sonunda tespit olunacak fiili ve teknik açıklar, bu sandıkların iştirakçilerini istihdam eden kuruluşlardan tahsil edilmek üzere, Cumhurbaşkanının karar tarihinden itibaren 3 ay içinde Hazinece Sosyal Sigortalar Kurumuna nakden ve defaten ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Devredilen sandıklardan yararlanan personelin hizmet yılları ve primleri ödenmek veya ödenmiş olmak suretiyle, 17/7/1964 tarihli, 506 Sosyal Sigortalar Kanununa göre emsallerine uygun olarak intibaklarının yapılması da dahil olmak üzere, devire ilişkin usul ve esaslar Maliye Bakanlığı, Sanayi ve Ticaret Bakanlığı, Hazine ve Dış Ticaret Müsteşarlığı ile Çalışma ve Sosyal Güvenlik Bakanlığınca müştereken belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Söz konusu sandıklar ile Sosyal Sigortalar Kurumu Başkanlığı sandıkların mal varlıklarının devri ile ilgili tüm işlemler nedeniyle doğacak her türlü vergi, resim ve harçlardan muaftır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu maddenin yürürlüğe girdiği tarihten sonra kurulacak sandıklar yukarıdaki hükümlerden yararlanamazlar.</template>
    </mvz-fıkra>
  </mvz-madde>

  <mvz-madde no="20" başlık="Bankalar, sigorta şirketleri, ticaret ve sanayi odaları ve borsalar" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bankalar, sigorta ve reasürans şirketleri, ticaret odaları, sanayi odaları, borsalar veya bunların teşkil ettikleri birlikler personelinin malûllük, yaşlılık ve ölümlerinde yardım yapmak üzere, bu kanunun yayımı tarihine kadar tesis veya dernek olarak kurulmuş bulunan sandıklar, bu kanunun yayımı tarihinden itibaren en geç altı ay içinde:</template>
      <mvz-bent no="a">
        <template>ilgili bulundukları banka, sigorta şirketi, reasürans şirketi, ticaret odası, sanayi odası, borsa veya bunların birliklerinin bütün personelini kapsayacak,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bu personelin, iş kazalariyle meslek hastalıkları, hastalık, analık, malûllük, yaşlılık ve ölüm, eşlerinin analık, eş ve çocuklarının hastalık hallerinde, en az bu kanunda belirtilen yardımları sağlayacak,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Sandıkların statülerine tabi personelin bu madde şümulüne giren banka, sigorta şirketi, reasürans şirketi, ticaret odası, sanayi odası, borsa veya bunların birliklerinden birinden diğerine geçmesi halinde bu gibi personelin kendi sandıklarındaki müktesep haklarının da diğer ilgili sandığa veya aralarında kuracakları müşterek bir sandığa intikalini temin edecek,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Birer tesis haline getirildiği ve bunu tevsik eden statülerini, bu kanunun yayımı tarihinden en geç altı ay içinde Çalışma Bakanlığına verdikleri takdirde, bu teşekküllerin ve sandıkların personeli işbu kanunun uygulanmasında sigortalı sayılmazlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Şu kadar ki, bu sandıkların statüleri ve statü değişiklikleri Çalışma Bakanlığınca onaylanmak suretiyle tekemmül eder. Mali durumları da Çalışma, Maliye ve Ticaret Bakanlıklarınca müşterek kontrol ve murakabe edilir. Mali durumlarının kontrol ve murakabesi sonunda alınmasına bu Bakanlıklarca müştereken lüzum gösterilecek tedbirleri, sandıklar ve ilgili bulundukları teşekküller yerine getirmekle yükümlüdür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Sözü edilen sandıkların mevzuatına tabi olarak geçen hizmetler ile emekli sandıkları kanunlarına veya malûllük, yaşlılık ve ölüm sigortalarına tabi olarak geçen hizmetler yazılı istek halinde, 5/1/1961 tarihli 228 sayılı kanunun aylık bağlanmasına ilişkin esasları dairesinde birleştirilerek tahsis yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Birinci fıkranın (b) bendinin uygulanmasında, yardımların sağlanması ve bağlanması yönünden alt sınırın belirlenmesinde muadil miktar karşılaştırması esas alınır. Ancak, gelir ve aylıkların artırılmasında 506 sayılı Kanuna göre bağlanan gelir ve aylıkların artırımına ilişkin hükümler devir tarihine kadar uygulanmaz. 5510 sayılı Kanunun geçici 20 nci maddesinin onikinci fıkrasında yer alan sınırlama dâhilinde sandıkların kuruluş senetlerinde yer alan hükümler ve sandıkların uygulamaları saklıdır. Bu hüküm, yürürlüğe girdiği tarihten önceki artışlarda ve görülmekte olan davalar hakkında da uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
