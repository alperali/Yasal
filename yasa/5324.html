  <mvz-künye tür="kanun" no="5324" başlık="KOZMETİK KANUNU"
             tarih="24/3/2005" rgazete-tarih="30/3/2005" rgazete-sayı="25771"
             düstur-tertip="5" düstur-cilt="44" />
    
  <mvz-madde no="1" başlık="Amaç">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı; kozmetik ürünlerin topluma güvenli, etkili ve kaliteli şekilde ulaşmasını temin etmek üzere ürünlerin piyasaya arz edilmesinden önce bildirimde bulunulması, piyasa gözetim ve denetiminin yapılması ile bu ürünlerin üretim yerlerinin denetimi konularındaki esasları belirlemektir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanun, insan vücudunun epiderma, tırnaklar, kıllar, saçlar, dudaklar ve dış genital organlar gibi değişik dış kısımlarına, dişlere ve ağız mukozasına uygulanmak üzere hazırlanmış, tek veya temel amacı bu kısımları temizlemek, koku vermek, görünümünü değiştirmek ve/veya vücut kokularını düzeltmek ve/veya korumak veya iyi bir durumda tutmak olan bütün preparatları veya maddeleri kapsar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Bildirim ve denetim">
    <mvz-fıkra no="1">
      <template>Kozmetik ürünün piyasaya ilk kez arz edilmesinden önce Sağlık Bakanlığına bildirimde bulunulması zorunludur. Bildirimden sonra üründe veya üreticide meydana gelen değişikliklerin de bildirilmesi zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun hükümlerine göre eksik bilgi ve belge ihtiva eden bildirim, yapılmış sayılmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Piyasaya arz edilen kozmetik ürünlerin üretim yerlerinin denetimi ile piyasa gözetim ve denetimi Sağlık Bakanlığı tarafından yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Üretici ve yükümlülükleri">
    <mvz-fıkra no="1">
      <template>Bir kozmetik ürünü üreten, imal eden, ıslah eden veya ürüne adını, ticarî markasını veya ayırt edici işaretini koymak suretiyle kendini üretici olarak tanıtan gerçek veya tüzel kişi; üreticinin Türkiye dışında olması halinde, üretici tarafından yetkilendirilen temsilci veya ithalatçı; ayrıca, ürünün tedarik zincirinde yer alan veya faaliyetleri ürünün güvenliğine ilişkin özelliklerini etkileyen gerçek veya tüzel kişi, bu Kanunun uygulanması bakımından üretici sayılır. Üreticinin yükümlülükleri aşağıda belirtilmiştir:</template>
      <mvz-bent no="a">
        <template>Sağlık Bakanlığına bildirimde bulunulmaksızın kozmetik ürün üretmek, ambalajlamak, ithalat müessesesi açmak veya işletmek veya ilk bildirimden sonra yapılan değişiklikleri bildirmeksizin bir müessesenin faaliyet sahasını genişletmek yasaktır.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bu müesseseler sorumlu teknik eleman ile hizmetin gerektirdiği nitelikte personel istihdam edilmeden işletilemez.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Herhangi bir kozmetik ürün, ürün güvenlik bilgileri Sağlık Bakanlığı Zehir Araştırma Merkezine bildirilmeden piyasaya arz edilemez.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Kozmetik ürün, normal ve üretici tarafından önerilen şartlar altında uygulandığında veya ürünün sunumu, etiketlenmesi, kullanımına dair açıklamalara veyahut üretici tarafından sağlanan bilgiler dikkate alınarak öngörülecek kullanım şartlarına göre uygulandığında, insan sağlığına zarar vermeyecek nitelikte olmak zorundadır.</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Muhtevasında hiç veya belirli limit ve şartların dışında bulunmaması gereken maddeler içeren kozmetik ürünler piyasaya arz edilemez.</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Kozmetik ürünlerin ambalaj ve etiket bilgilerinin yönetmelikte belirtilen esaslara uygun olması zorunludur.</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Kozmetik üretim yerinin Sağlık Bakanlığınca belirlenen esaslara uygun olması zorunludur.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="İdarî para cezaları">
    <mvz-fıkra no="1">
      <template>Bu Kanunun;</template>
      <mvz-bent no="a">
        <template>3 üncü maddesinin birinci fıkrasında belirtilen yükümlülüklerinden herhangi birini ihlal eden üreticiye yirmibin Türk Lirası,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>4 üncü maddesinin;</template>
        <mvz-altbent no="1">
          <template>(a) bendinde belirtilen yasaklardan herhangi birine uymayan üreticiye yirmibin Türk Lirası,</template>
        </mvz-altbent>
        <mvz-altbent no="2">
          <template>(b) bendinde belirtilen personeli istihdam etmeyen ve (c) bendi uyarınca bildirimde bulunmayan üreticiye onbin Türk Lirası,</template>
        </mvz-altbent>
        <mvz-altbent no="3">
          <template>(d) bendine aykırı hareket eden kozmetik ürünün üreticisine ellibin Türk Lirası,</template>
        </mvz-altbent>
        <mvz-altbent no="4">
          <template>(e) bendine göre muhtevasında hiç bulunmaması gereken maddeler içeren kozmetik ürünleri piyasaya arz eden üreticiye yirmibin Türk Lirası, muhtevasında belirli limit ve şartların dışında maddeler içeren kozmetik ürünleri piyasaya arz eden üreticiye onbeşbin Türk Lirası,</template>
        </mvz-altbent>
        <mvz-altbent no="5">
          <template>(g) bendinde belirtilen yükümlülüğü ihlâl eden üreticiye yirmibin Türk Lirası,</template>
        </mvz-altbent>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>idarî para cezası Sağlık Bakanlığınca verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanuna göre idarî para cezasını gerektiren fiilin tekrarı hâlinde idarî para cezaları iki kat olarak uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu maddeye göre idarî para cezası verilmiş olması, ihlâl edilen yükümlülüğün niteliğine göre gereken diğer idarî tedbirlerin ve müeyyidelerin uygulanmasına engel olmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Diğer idarî müeyyideler ve tedbirler">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümleri ile bu Kanuna göre yürürlüğe konulan yönetmelik ve diğer düzenlemelerde belirlenen esaslara uygun olmadığı tespit edilen kozmetik ürünler ile ilgili uyarı, piyasadan toplatma ve imha için gereken işlemler ile kozmetik ürün üretim yerinin ıslahı ve gerektiğinde kapatılması ile ilgili bütün tedbirleri almaya ve uygulamaya Sağlık Bakanlığı yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun ile bu Kanuna göre çıkarılan mevzuata uygunluğu belgelenmiş olsa dahi, bir ürünün genel sağlık yönünden güvenli olmadığına dair kesin belirtilerin bulunması halinde, bu ürünün piyasaya arzı, kontrol yapılıncaya kadar Sağlık Bakanlığınca geçici olarak durdurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kontrol sonucunda ürünün genel sağlık yönünden güvenli olmadığının tespit edilmesi halinde, masrafları üretici tarafından karşılanmak üzere Sağlık Bakanlığı;</template>
      <mvz-bent no="a">
        <template>Ürünün piyasaya arzının yasaklanmasını,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Piyasaya arz edilmiş olan ürünlerin piyasadan toplanmasını,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Ürünlerin, güvenli hale getirilmesinin imkânsız olduğu durumlarda, taşıdıkları risklere göre kısmen ya da tamamen imha edilmesini,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>(a), (b) ve (c) bentlerinde belirtilen önlemler hakkında gerekli bilgilerin, ülke genelinde dağıtımı yapılan iki gazete ile ülke genelinde yayın yapan iki televizyon kanalında ilanı suretiyle risk altındaki kişilere duyurulmasını,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Sağlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Risk altındaki kişilerin yerel yayın yapan gazete ve televizyon kanalları vasıtasıyla bilgilendirilmesinin mümkün olduğu durumlarda, bu duyuru yerel basın ve yayın organları yoluyla, risk altındaki kişilerin tespit edilebildiği durumlarda ise bu kişilerin doğrudan bilgilendirilmesi yoluyla yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Türk Ceza Kanunu hükümleri saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Yönetmelik">
    <mvz-fıkra no="1">
      <template>Kozmetik ürünlerin teknik niteliklerine, ambalaj bilgilerine dair şartlara, bildirimlerine, piyasaya arz edilmelerine, piyasa gözetim ve denetimlerine, üretim yeri denetimlerine, analiz metotlarına, tedbirlere ve ilgili diğer hususlara ilişkin usûl ve esaslar, bu Kanunun yayımı tarihinden itibaren bir ay içinde Sağlık Bakanlığı tarafından hazırlanarak yürürlüğe konulacak bir yönetmelik ile düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Yürürlükten kaldırılan mevzuat">
    <mvz-fıkra no="1">
      <template>23.2.1994 tarihli ve 3977 sayılı Kozmetik Kanunu yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunda öngörülen yönetmelik yürürlüğe girinceye kadar mevcut yönetmeliklerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Yürürlük">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Yürütme">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
