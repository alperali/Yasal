<mvz-künye tür="kanun" no="4722" başlık="TÜRK MEDENİ KANUNUNUN YÜRÜRLÜĞÜ VE UYGULAMA ŞEKLİ HAKKINDA KANUN"
             tarih="3/12/2001" rgazete-tarih="8/12/2001" rgazete-sayı="246007"
             düstur-tertip="5" düstur-cilt="41" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-b1 no="A" başlık="Geçmişe etkili olmama kuralı">
      <mvz-madde no="1" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun yürürlüğe girdiği tarihten önceki olayların hukukî sonuçlarına, bu olaylar hangi kanun yürürlükte iken gerçekleşmişse kural olarak o kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türk Medenî Kanununun yürürlüğe girdiği tarihten önce yapılmış olan işlemlerin hukuken bağlayıcı olup olmadıkları ve sonuçları, bu tarihten sonra dahi, yapıldıkları sırada yürürlükte bulunan kanunlara göre belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Türk Medenî Kanununun yürürlüğe girdiği tarihten sonra gerçekleşen olaylara, Kanunda öngörülmüş ayrık durumlar saklı kalmak kaydıyla, Türk Medenî Kanunu hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Geçmişe etkili olma">
      <mvz-b2 no="I" başlık="Kamu düzeni ve genel ahlâk">
        <mvz-madde no="2" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Medenî Kanununun kamu düzeni ve genel ahlâkı bağlamaya yönelik kuralları, haklarında ayrık bir hüküm bulunmayan bütün olaylara uygulanır. Bu bakımdan, eski hukukun Türk Medenî Kanununa göre kamu düzeni ve genel ahlâka aykırı olan kuralları, bu Kanun yürürlüğe girdikten sonra hiçbir suretle uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="İçeriği kanunla belirlenen ilişkiler">
        <mvz-madde no="3" başlık="">
          <mvz-fıkra no="1">
            <template>İçerikleri tarafların istek ve iradeleri gözetilmeksizin doğrudan doğruya kanunla belirlenmiş işlem ve ilişkilere, bunlar Türk Medenî Kanununun yürürlüğe girmesinden önce kurulmuş olsalar bile, bu Kanun hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Kazanılmamış haklar">
        <mvz-madde no="4" başlık="">
          <mvz-fıkra no="1">
            <template>Eski hukuk yürürlükte iken gerçekleşmiş olup da Türk Medenî Kanununun yürürlüğe girdiği sırada henüz herhangi bir hak doğurmamış olaylara, bu Kanun hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Kişiler Hukuku">
    <mvz-b1 no="A" başlık="Fiil ehliyeti">
      <mvz-madde no="5" başlık="">
        <mvz-fıkra no="1">
          <template>Fiil ehliyeti, Türk Medenî Kanunundaki hükümlere tâbidir. Ancak, Türk Medenî Kanunu yürürlüğe girdiği tarihte eski hukuka göre fiil ehliyetine sahip olup da, bu Kanuna göre sahip olamayanların ehliyetleri devam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Gaiplik kararı">
      <mvz-madde no="6" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Kanunu Medenîsi yürürlükte iken verilmiş olan gaiplik kararları, Türk Medenî Kanununun yürürlüğe girdiği tarihten sonra, bu Kanuna göre verilen kararların yarattığı sonuçları aynen doğurur. Ancak Türk Kanunu Medenîsine göre evliliğin feshinden doğmuş bulunan sonuçlar olduğu gibi kalır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Dernekler">
      <mvz-madde no="7" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önceki kurallar uyarınca tüzel kişilik kazanan derneklerin tüzel kişiliği devam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Dernekler hakkında öncelikle Türk Medenî Kanunu hükümleri uygulanır. Ancak, kamu hukuku nitelikli özel hükümler saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Vakıflar">
      <mvz-madde no="8" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Kanunu Medenîsinin yürürlüğe girmesinden önce kurulmuş bulunan vakıflar hakkında yürürlükte olan özel hükümler saklı kalmaya devam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türk Kanunu Medenîsi hükümlerine göre kurulmuş olan vakıflara, öncelikle Türk Medenî Kanunu hükümleri uygulanır. Ancak, kamu hukuku nitelikli özel hükümler saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Aile Hukuku">
    <mvz-b1 no="A" başlık="Evlenme, boşanma ve evliliğin genel hükümleri">
      <mvz-madde no="9" başlık="">
        <mvz-fıkra no="1">
          <template>Evliliğin kurulması ve sona ermesi, Türk Medenî Kanunu hükümlerine tâbidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önce eski hukuka göre kurulmuş olan evlilikler, Türk Medenî Kanununa göre de geçerliliğini korur; eski hukuka göre sona ermiş olan evlilikler, bu Kanuna göre de sona ermiş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Eski hukuka göre geçerli olmayan evlenmenin iptali, Türk Medenî Kanunu hükümlerine tâbidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Türk Medenî Kanununun evliliğin genel hükümlerine ilişkin düzenlemeleri, bu Kanunun yürürlüğe girmesinden önce kurulmuş olan evlilikler hakkında da geçerlidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Mal rejimleri">
      <mvz-madde no="10" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun yürürlüğe girdiği tarihten önce evlenmiş olan eşler arasında bu tarihe kadar tâbi oldukları mal rejimi devam eder. Eşler Kanunun yürürlüğe girdiği tarihten başlayarak bir yıl içinde başka bir mal rejimi seçmedikleri takdirde, bu tarihten geçerli olmak üzere yasal mal rejimini seçmiş sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önce açılmış olan boşanma veya iptal davaları sonuçlanıncaya kadar eşler arasında tâbi oldukları mal rejimi devam eder. Dava boşanma veya iptal kararıyla sonuçlanırsa, bu mal rejiminin sona ermesine ilişkin hükümler uygulanır. Davanın redle sonuçlanması hâlinde eşler, kararın kesinleşmesini izleyen bir yıl içinde başka bir mal rejimi seçmedikleri takdirde, Kanunun yürürlük tarihinden geçerli olmak üzere yasal mal rejimini seçmiş sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Şu kadar ki eşler, yukarıdaki fıkralarda öngörülen bir yıllık süre içinde mal rejimi sözleşmesiyle yasal mal rejiminin evlenme tarihinden geçerli olacağını kabul edebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yukarıdaki hükümler uyarınca mal birliği veya mal ortaklığı rejiminin yasal mal rejimine dönüşmesi hâlinde, Türk Kanunu Medenîsinin ilgili mal rejiminin sona ermesine ilişkin hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Üçüncü kişilerin korunması">
      <mvz-madde no="11" başlık="">
        <mvz-fıkra no="1">
          <template>Eşler arasında mal rejimleriyle ilgili değişiklikler sebebiyle, üçüncü kişilerin haklarını korumaya yönelik sorumluluk hükümleri, Türk Medenî Kanununun yürürlüğe girmesinden sonraki değişiklikler hakkında da uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Soybağı">
      <mvz-madde no="12" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önce, sahih olmayan nesepli çocuklar, yürürlük tarihinden başlayarak bu Kanunun soybağına ilişkin hükümlerine tâbi olurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu çocuklar, vesayet altında bulunuyorlarsa velâyetin kaldırılmasını gerektiren sebepler bulunmadıkça en geç bir yıl içinde velâyet hükümlerine tâbi olurlar. Kanunun yürürlüğe girmesinden önce velâyetin verilmesi veya kaldırılması konusunda verilmiş olan kararlar geçerliliğini korur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="E" başlık="Babalık davası">
      <mvz-madde no="13" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önce açılmış olan babalık davaları, bu Kanun hükümlerine göre karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önce olumlu karara bağlanmış olan malî sonuçlu babalık davalarında çocuğun soybağı, yürürlük tarihinden başlayarak bu Kanun hükümlerine göre kurulmuş olur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="F" başlık="Evlat edinme">
      <mvz-madde no="14" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önce kurulmuş olan evlat edinme sözleşmeleri, bütün hükümleri ile birlikte geçerliliğini korur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="G" başlık="Velâyet">
      <mvz-madde no="15" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önce velâyet konusunda verilmiş olan kararlar, Kanunun yürürlüğe girmesinden sonra da geçerliliğini korur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="H" başlık="Vesayet">
      <mvz-madde no="16" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önce atanmış olan vasiler, görev süresi bakımından da bu Kanun hükümlerine tabidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Miras Hukuku">
    <mvz-b1 no="A" başlık="Mirasçılık ve mirasın geçişi">
      <mvz-madde no="17" başlık="">
        <mvz-fıkra no="1">
          <template>Mirasçılık ve mirasın geçişi, miras bırakanın ölümü tarihinde yürürlükte olan hükümlere göre belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Eşya Hukuku">
    <mvz-b1 no="A" başlık="Aynî haklar">
      <mvz-madde no="18" başlık="">
        <mvz-fıkra no="1">
          <template>Eski hukuka göre kurulmuş olup da, Türk Kanunu Medenîsinin yürürlükte bulunduğu zamanda varlıklarını korumuş olan aynî haklar, Türk Medenî Kanununun yürürlüğe girdiği tarihten sonra da varlıklarını sürdürürler. Bu haklardan Türk Medenî Kanunu uyarınca kurulması mümkün olmayanlar, tapu kütüğünün beyanlar sütununa yazılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Eşya hukuku hükümlerinin uygulanması">
      <mvz-madde no="19" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun eşya hukukuna ilişkin hükümleri, uygun düştüğü ölçüde zabıt defterlerinin tutulduğu yerlerde de uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Diğer Hükümler">
    <mvz-b1 no="A" başlık="Hak düşürücü süreler ve zamanaşımı süreleri">
      <mvz-madde no="20" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununun yürürlüğe girmesinden önce işlemeye başlamış bulunan hak düşürücü süreler ile zamanaşımı süreleri, Türk Kanunu Medenîsi hükümlerine tâbi olmaya devam ederler. Ancak söz konusu süreler, Türk Medenî Kanununun belirlediği süreden uzun ise, bu Kanunun yürürlüğe girmesinden sonra, bu Kanunda belirlenen sürenin geçmesiyle dolmuş olur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Yollamalar">
      <mvz-madde no="21" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanunun ve Türk Medenî Kanununun yürürlüğe girmesiyle yürürlükten kaldırılmış veya değiştirilmiş bulunan kanunların Maddelerine, diğer mevzuat tarafından yapılan yollamalar, o Maddeleri karşılayan yeni hükümlere yapılmış sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Tüzük ve yönetmelikler">
      <mvz-madde no="22" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Medenî Kanununda öngörülen tüzük ve yönetmelikler, bu Kanunun yürürlüğe girdiği tarihten itibaren bir yıl içinde çıkarılır ya da yürürlükteki tüzük ve yönetmeliklerde gerekli değişiklikler yapılır. Bu düzenlemeler yapılıncaya kadar, yürürlükteki tüzük ve yönetmeliklerin Türk Medenî Kanununa aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Yürürlükten kaldırılan kanun">
      <mvz-madde no="23" başlık="">
        <mvz-fıkra no="1">
          <template>29.5.1926 tarihli ve 864 sayılı Kanunu Medenînin Sureti Mer`iyet ve Şekli Tatbiki Hakkında Kanun yürürlükten kaldırılmıştır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="Yürürlük">
        <mvz-fıkra no="1">
          <template>Bu Kanun Türk Medenî Kanunu ile aynı tarihte yürürlüğe girer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="Yürütme">
        <mvz-fıkra no="1">
          <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
