    <mvz-bölüm no="2-İKİNCİ" başlık="Geçici Maddeler">
      <mvz-madde no="1" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yürürlüğe girdiği tarihte Türkiye Gümrük Bölgesindeki gümrük sundurmalarında veya gümrükçe eşya konulmasına izin verilen yerlerde bulunan eşyanın buralardaki bekleme süreleri ile bunlara ilişkin süre uzatım talepleri hakkında yürürlükten kaldırılan Gümrük Kanunu hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunun yürürlüğe girdiği tarihte genel, özel ve fiktif antrepolarda bulunan eşyanın, buralardaki bekleme süreleri bu Kanun hükümlerine tabidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yürürlüğe girdiği tarihte bir eşya hakkında rejim beyanında bulunulmuş olmakla birlikte, henüz sonuçlandırılamamış gümrük işlemlerinin yürütülmesinde beyan hak sahibi olarak adlandırılan mükellefin lehine olan hükümler uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Beyannamesi tescil edilmiş eşya ile ilgili olarak, bu Kanunun yürürlüğe girdiği tarihten başlamak üzere kırkbeş gün içinde beyan hak sahiplerinin rejim değişikliği talepleri kabul olunur. Ancak, bu taleplerin kabulü, alınmış veya alınacak ceza kararlarının uygulanmasını ortadan kaldırmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Başka Kanunlarda Gümrük ve Tekel Bakanlığı'na; Gümrük Müsteşarlığının görev ve yetki alanına giren konularda Maliye ve Gümrük Bakanlığı'na yapılan atıflar Gümrük Müsteşarlığı'na yapılmış sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Halen yürürlükte bulunan kanunlarda 1615 sayılı Gümrük Kanunu ile sözkonusu Kanunda değişiklik yapan kanunlara yapılmış olan atıflar bu Kanuna yapılmış kabul edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Yürürlükten kaldırılan Gümrük Kanunu hükümlerine göre tasfiyelik hale gelmiş eşyanın, ihale ilanının henüz yayınlanmamış veya perakende satışına karar verilmemiş olması ve beyan sahibinin bu Kanunun yürürlük tarihinden itibaren otuz gün içinde gümrük idaresine başvurması halinde, bu Kanunun 179 uncu maddesi hükümleri uygulanır. Dış ticaret tahdidine giren eşyalar için bu madde hükmü uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yürürlüğe girmesinden önce gümrük komisyoncu yardımcısı karnesine sahip olanlar, Kanunun yürürlüğe girmesinden itibaren iki yıl içinde Gümrük Müsteşarlığına müracaat etmeleri halinde, öğrenim şartı hariç olmak üzere 227 nci maddede belirtilen koşulları taşımaya devam ettiklerinin anlaşılması durumunda, kendilerine Gümrük Müşavir Yardımcısı İzin Belgesi verilir. Bu şekilde gümrük müşavir yardımcısı olanlar en az lise mezunu olmaları halinde, gümrük müşavirliği için açılacak ilk üç sınava girebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunun yürürlüğe girmesinden önce gümrük komisyoncusu karnesine sahip olanlar, Kanunun yürürlüğe girmesinden itibaren iki yıl içinde Gümrük Müsteşarlığına müracaat etmeleri halinde, öğrenim şartı hariç olmak üzere 227 nci maddede belirtilen koşulları taşımaya devam ettiklerinin anlaşılması durumunda, kendilerine Gümrük Müşavirliği İzin Belgesi verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunun yürürlüğe girdiği tarihte, yürürlükten kaldırılan 1615 sayılı Gümrük Kanununun 167 nci maddesinin ikinci ve üçüncü fıkrası ile 168 inci maddesinin üçüncü fıkrasına göre gümrük komisyoncusu veya gümrük komisyoncu yardımcısı olmaya hak kazananların görevlerinden istifa etmelerini veya emekli olmalarını müteakip, kendilerine bu Kanun hükümlerine göre gümrük müşavirliği veya gümrük müşavir yardımcılığı izin belgesi verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>227 nci maddenin 1 inci fıkrasının (d) bendinde belirtilen suçlarla ilgili olarak devam eden davalar bulunduğu takdirde, 1 inci ve 2 nci fıkralarda yer alan iki yıllık müracaat süresine bakılmaksızın, her halükarda davanın lehte sonuçlanmasından itibaren bir yıl içinde Müsteşarlığa müracaat edilmesi gerekir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Gümrük müşavirleri ve gümrük müşavir yardımcıları çıkarılacak bir kanunla bağlı bulundukları gümrük ve muhafaza başmüdürlüğü görev alanı itibariyle kamu kurumu niteliğinde meslek kuruluşu şeklinde örgütleninceye kadar aşağıdaki hükümler uygulanır:</template>
          <mvz-bent no="1.">
            <template>1615 sayılı Gümrük Kanunu hükümlerine göre kurulan Gümrük Komisyoncuları Dernekleri faaliyetlerine devam eder ve sınav açılması ile izin belgeleri verilmesi işlemleri Gümrük Müsteşarlığınca yürütülür.</template>
            <mvz-altbent no="a">
              <template>Gümrük müşavirliği ve gümrük müşavir yardımcılığı sınavları Müsteşarlıkça belirlenen usul ve esaslarçerçevesinde her yıl bir kez yapılır.</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>227 ve 228 inci maddelerde belirtilen koşulları sınavın açıldığı yıl başında sağlamış olanlar, o yıl açılan gümrük müşavirliği veya gümrük müşavir yardımcılığı sınavlarına müracaat edebilirler.</template>
            </mvz-altbent>
            <mvz-altbent no="c">
              <template>Gümrük müşavirliği ve gümrük müşavir yardımcılığı sınavlarına en fazla üçer kez girilebilir.</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Gümrük müşavirliği veya gümrük müşavir yardımcılığı mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan ya da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, gümrük müşavirliği hizmetlerinin gereği gibi yürütülmesi amacıyla, durumun niteliğine ve ağırlık derecesine göre aşağıda tanımlanan disiplin cezaları verilir.</template>
            <mvz-altbent no="a">
              <template>Uyarma: Meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir.</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>Kınama: Meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir.</template>
            </mvz-altbent>
            <mvz-altbent no="c">
              <template>Geçici olarak mesleki faaliyetten alıkoyma: Mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır.</template>
            </mvz-altbent>
            <mvz-altbent no="d">
              <template>Meslekten çıkarma: Meslek mensubunun izin belgesinin geri alınarak, bir daha bu mesleği icra etmesine izin verilmemesidir.</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınamacezası uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan ya da bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Sahte belgelere dayanılarak yanlış beyanda bulunulduğunun, ancak bu durumun gümrük müşavirinin bilgisi dışında olduğunun, bununla birlikte, bir araştırma sonucunda gerçek durumun öğrenilebileceğinin Gümrük Müsteşarlığı merkez denetim elemanlarınca rapora bağlandığı durumlarda, ilgili gümrük müşavirine ilk defasında kınama cezası verilir. Bu hususun tekerrür etmesi halinde geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>7.1.1932 tarihli ve 1918 sayılı Kaçakçılığın Men ve Takibine Dair Kanun hükümlerine göre kaçakçılık suçundan mahkumiyet kararı kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir.</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Üç yıllık dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi, disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir.</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun on günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Disiplin cezaları kesinleşme tarihinden itibaren uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Gümrük müşavirleri ve gümrük müşavir yardımcıları, görevleri sırasında veya görevleri sebebiyle işledikleri suçlardan dolayı fillerinin niteliğine göre Türk Ceza Kanununun Devlet memurlarına ait hükümleri uyarınca cezalandırılır.</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>Disiplin cezaları bir dava sonucuna bağlı olmaksızın mevzuat hükümlerine aykırılığı gümrük idarelerince tespit edildiği tarihten itibaren üç yıl süreyle uygulanmadığı takdirde zamanaşımına uğrar. Mevzuata aykırı işlem ve eylemlerin aynı zamanda bir adli kovuşturma konusu olması halinde, bu aykırılık için Türk Ceza Kanununda öngörülen zamanaşımı hükümlerine göre disiplin cezası verilebilir.</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>2 numaralı bentte belirtilen uyarma ve kınama cezası yetkili gümrük başmüdürü, geçici olarak mesleki faaliyetten alıkoyma cezası Müsteşarlık Merkez Disiplin Kurulu, meslekten çıkarma cezaları Müsteşarlık Yüksek Disiplin Kurulu tarafından verilir.</template>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>Bu Kanuna ve gümrüklerde uygulanan mevzuat hükümlerine aykırı hareketleri görülen gümrük müşavirleri ve gümrük müşavir yardımcılarının izin belgeleri Bakanlık müfettişleri ve gümrük ve dış ticaret bölge müdürleri tarafından gerek görülmesi hâlinde tedbir mahiyetinde en fazla altı ay süre ile geçici olarak alınır ve gümrüklerde iş takip etmelerine izin verilmez. Bu durum, gerekçesiyle birlikte izin belgesinin alınmasını izleyen günde Bakanlığa bildirilir. Bu şekilde izin belgeleri alınanlar hakkında geçici mesleki faaliyetten alıkoyma cezası verilmesi hâlinde, tedbir mahiyetinde izin belgelerinin alındığı süre verilen cezadan mahsup edilir. 3713 sayılı Kanun kapsamında haklarında kovuşturma başlatılanların izin belgeleri kovuşturma sonuçlanıncaya kadar tedbiren geri alınır.</template>
          </mvz-bent>
          <mvz-bent no="10.">
            <template>Gümrük müşavir derneklerince, gümrük müşavirlerinin yapacakları iş ve işlemler karşılığı alacakları asgari ücretleri gösteren ve takvim yılı bazında belirlenen Asgari Ücret Tarifesi, Müsteşarlıkça uygun görülerek onaylanmak suretiyle uygulamaya konulur.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 152 nci, birinci fıkrasının (a) bendi hariç olmak üzere 157 nci, 158 inci ve bölgede faaliyette bulunan işletmelerin ihtiyaçlarıyla sınırlı olarak 185 inci maddelerinin 3218 sayılı Serbest Bölgeler Kanununa aykırı olan hükümleri, Avrupa Birliğine tam üyeliğin gerçekleştiği tarihe kadar uygulanmaz. Ancak 158 inci ve 185 inci madde hükümleri, 4760 sayılı Özel Tüketim Vergisi Kanunu yönünden uygulanmaya devam olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu maddenin yürürlüğe girdiği tarihten önceki dönemler için 4760 sayılı Kanuna göre tarhiyat yapılmaz, daha önce yapılan tarhiyatlardan vazgeçilir, tahakkuk eden tutarlar terkin edilir. Tahsil edilmiş tutarlar ret ve iade edilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>EXPO 2016 Antalya Ajansının tasfiyesinden sonra ülkede kalanlar hariç olmak üzere; EXPO 2016 Antalya ile ilgili olarak yurda geçici olarak sokulacak her türlü ürün, mal ve eşya, gümrük vergisinden müstesnadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddenin yürürlüğe girdiği tarihten önce bu Kanunun 235 inci maddesi uyarınca el konularak mülkiyetin kamuya geçirilmesi kararı verilen kara ulaşım araçları ile ilgili olarak bu maddenin yürürlüğe girdiği ayı takip eden altıncı ayın sonuna kadar ilgili gümrük idaresine başvurulması ve taşıtın ilk iktisabında ödenen özel tüketim vergisinin %25’ine tekabül eden tutarın, başvuru tarihinden itibaren bir ay içinde ilgili tahsil dairesine ödenmesi halinde, el konularak mülkiyetin kamuya geçirilmesi kararı kaldırılır ve el konulan araç, sahibine iade edilir. Bu karar gümrük idaresi tarafından ilgili mahkemeye bildirilir. Tasfiyesi tamamlanmış ulaşım araçları için bu fıkra kapsamında başvurular kabul edilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkrada belirtilen oran bu maddenin yürürlüğe girdiği tarihten önce serbest dolaşıma giriş rejimine tabi tutularak ilk iktisabı gerçekleşmiş kara ulaşım araçları ile ilgili olarak, bu Kanunun 235 inci maddesi kapsamında el konularak mülkiyetin kamuya geçirilmesi kararı verilmesi gereken fiilin gümrük idaresince tespit edilmesinden önce ve birinci fıkrada belirtilen süre içinde kendiliğinden bildirilmesi durumunda %15 olarak uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esasları tespit etmeye Gümrük ve Ticaret Bakanlığı ile Maliye Bakanlığı müştereken yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 235 inci maddesi uyarınca mevcut bir soruşturma kapsamında bulunan veya el konularak mülkiyetin kamuya geçirilmesi kararı verilen kara ulaşım araçları ile ilgili olarak 31/12/2019tarihine kadar ilgili gümrük idaresine başvurulması ve taşıtın ilk iktisabında ödenmesi gereken özel tüketim vergisinin %25’ine tekabül eden tutarın, başvuru sahibine tebliğ edildiği tarihten itibaren bir ay içinde ilgili tahsil dairesine ödenmesi hâlinde, araç hakkında el konularak mülkiyetin kamuya geçirilmesi kararı verilmez, mevcut kararlar kaldırılır ve el konulan araç sahibine iade edilir. İadesi talep edilen ulaşım araçlarının muhafazasına ilişkin masraflar araç sahibince ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu karar gümrük idaresi tarafından ilgili başsavcılığa/mahkemeye bildirilir. Tasfiyesi tamamlanmış ulaşım araçları için bu fıkra kapsamında başvurular kabul edilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci fıkrada belirtilen oran, bu maddenin yürürlüğe girdiği tarihten önce serbest dolaşıma giriş rejimine tabi tutularak ilk iktisabı gerçekleşmiş kara ulaşım araçları ile ilgili olarak, bu Kanunun 235 inci maddesi kapsamında el konularak mülkiyetin kamuya geçirilmesi kararı verilmesi gereken fiilin gümrük idaresince tespit edilmesinden önce ve birinci fıkrada belirtilen süre içinde kendiliğinden bildirilmesi durumunda %15 olarak uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Cumhurbaşkanı birinci fıkrada yer alan başvuru süresini altı aya kadar uzatmaya yetkilidir. Bu maddenin uygulanmasına ilişkin usul ve esaslar Ticaret Bakanlığı ile Hazine ve Maliye Bakanlığı tarafından müştereken belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddenin yürürlüğe girdiği tarihe kadar geçici ithalat rejimi kapsamında kişisel kullanıma mahsus yabancı plakalı taşıtların Türkiye Gümrük Bölgesine getirilerek gümrük idaresine bilgi verilmeden taşıtsız yurt dışına çıkılması durumunda da, 241 inci maddenin altıncı fıkrasının (e) bendi hükmü uygulanır. Bu maddenin yürürlüğe girdiği tarihten önce yapılan tahsilatlar hakkında bu madde hükmü uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
