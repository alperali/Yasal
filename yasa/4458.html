          <template>Ancak;</template>
          <mvz-bent no="a">
            <template>Geçici bir anti-damping vergisi veya fark giderici vergi uygulandığı,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kanunen alınması gereken vergi tutarının, bir bağlayıcı tarife ve menşe bilgisine istinaden belirlenen tutarlardan yüksek olduğu,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Vergi tutarının Cumhurbaşkanı tarafından belirlenen seviyenin altında kaldığı,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Hallerde, hesaplanan vergiler Gümrük Vergileri Tahakkukunu İzleme Defterine kaydedilmekle birlikte, bunların özel durumu defterde belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük Vergilerinin tahakkukunu İzleme Defterinin şekli ile bu defterin tutulmasına ilişkin usul ve esaslar Müsteşarlıkça belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="196" başlık="">
        <mvz-fıkra no="1">
          <template>Gerekli teminatın sağlanması şartıyla, belirli aralıklarla ve aynı kişiye teslim edilen aynı cins eşyanın gümrük vergileri otuz günü geçmeyecek şekilde belirlenecek bir süre içinde tahakkuk ettirilerek Gümrük Vergilerinin Tahakkukunu İzleme Defterine kaydedilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="197" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük vergileri, tahakkukundan hemen sonra  yükümlüye tebliğ edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yapılan denetlemeler sonucunda hiç alınmadığı veya noksan alındığı belirlenen veya 1 inci fıkrada belirtilen şekilde tebliğ edilemeyen gümrük vergilerine ilişkin tebliğat gümrük yükümlülüğünün doğduğu tarihten itibaren üç yıl içinde yapılır. Şu kadar ki, gümrük yükümlülüğünün doğduğu olayla ilgili olarak dava açılması zaman aşımını durdurur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yükümlü tarafından gümrük beyannamesinde gösterilen vergi tutarı ile gümrük idaresince hesaplanan vergi tutarının eşit olması halinde, gümrük idarelerinin eşyayı teslim etmesi, gümrük vergilerinin yükümlüye tebliği yerine geçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Gümrük vergileri alacakları, ceza uygulamasını gerektiren bir fiile ilişkin olması ve zaman aşımı daha uzun bulunan bu fiil nedeniyle ceza davası açılmış olmak kaydıyla, bu alacaklar Türk Ceza Kanunundaki dava ve ceza zamanaşımı süreleri içerisinde kovuşturulup tahsil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu madde hükümlerine göre tebliğ edilen gümrük vergileri; 242 nci maddede belirtilen sürelerde itirazda bulunulmaması veya süresi içinde idari yargı mercilerine başvurulmaması hallerinde bu sürelerin bittiği tarihte kesinleşir; dava açılması halinde mahkemece yükümlü aleyhine verilen kararın gümrük idaresine tebliğ edildiği tarihte tahsil edilebilir hale gelir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="198" başlık="">
        <mvz-fıkra no="1">
          <template>69 uncu madde hükümleri saklı kalmak kaydıyla, yapılan kontrol ve denetlemeler sonucunda hiç alınmadığı veya noksan alındığı belirlenen gümrük vergileri ile işlemleri daha sonra yapılmak üzere teslim edilen eşyaya ilişkin gümrük vergilerinin, yükümlüye tebliğ edildiği tarihten itibaren onbeş gün içinde ödenmesi zorunludur. Ödeme süresinin bitmesinden önce ilgilinin yazılı istemde bulunması ve teminat alınması şartıyla ödeme süresi otuz gün daha uzatılabilir. Süre uzatımı beyanname kapsamı eşyanın her bir kalemi için ayrı ayrı da yapılabilir. Uzatılan süre için 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 48 inci maddesine göre tecil faizi alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tebliğ edilen gümrük vergilerine karşı 242 nci madde çerçevesinde gümrük idareleri nezdinde itiraz edilmesi ödeme süresini keser. Ödeme süresi idarenin ya da yargı mercii kararının tebliğ edildiği tarihten itibaren yeniden başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yükümlü, vergi tutarının tamamını veya bir kısmını verilen sürenin bitimini beklemeksizin ödeyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>195 inci maddenin birinci fıkrasının (a), (b) ve (c) bentlerinde belirtilen durumlar hariç olmak üzere; eşyanın tercihli tarifesinin karşı ülke idareleri ile idari işbirliği çerçevesinde oluşturulduğu durumlarda, dolaşım belgesinin karşı ülke idaresince yanlışlıkla onaylandığı tespit edildiğinde, yükümlü, gümrük mevzuatının gerektirdiği yükümlülüklerin yerine getirilmesinde tüm özeni gösterdiğini ispat edebildiği takdirde, tercihli tarife uygulanması nedeniyle tahakkuk ettirilmeyen vergiler sonradan istenmez. Ancak, belgeyi onaylayan idarenin eşyanın tercihli tarife için tayin edilen şartları yerine getirmediğini bildiği veya bilmesi gerektiği durumlar hariç olmak üzere, doğru olmadığı tespit edilen belgenin ihracatçı tarafından sunulan yanlış verilere dayanılarak onaylanması veya tercihli düzenlemenin, yararlanan ülke tarafından doğru olarak uygulandığına dair şüphe bulunduğu yönünde Resmi Gazetede bir duyuru yayımlanmış olması halinde vergiler yükümlüden tahsil edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="199" başlık="">
        <mvz-fıkra no="1">
          <template>Basitleştirilmiş usule göretescil edilen bir beyannamede eksik bulunan bilgi veya belgenin tamamlanması için gümrük idaresi tarafından verilen süre içinde bu eksikliklerin tamamlanmaması halinde, söz konusu beyanname kapsamı eşyanın ödenmesi gereken vergileri ertelenmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="200" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük vergileri Türk Lirası olarak ödenir. Bu ödeme 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunda öngörülen usullere göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük vergileri, yetki verilen bankalar aracılığıyla da tahsil edilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="201" başlık="">
        <mvz-fıkra no="1">
          <template>Süresi içinde ödenmeyen kesinleşmiş gümrük vergileri hakkında 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Teminat">
      <mvz-madde no="202" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük mevzuatı uyarınca, gümrük vergilerinin ve diğer amme alacaklarının ödenmesini sağlamak üzere bir teminat verilmesi gereken hâllerde, bu teminat söz konusu vergiler ve diğer amme alacakları tutarı kadar yükümlü veya yükümlü olması muhtemel kişi tarafından verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük idareleri, teminat vermesi istenen kişinin yerine başka bir kişinin de teminat vermesini kabul edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel ve katma bütçeye dahil kamu kuruluşlarının belediyelerin sermayesinin tamamı Devlete ait olan kamu iktisadi kuruluşlarının ve Türkiye'deki yabancı misyon şeflerinin verecekleri garanti mektuplarını teminat olarak kabule Müsteşarlık yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Teminat aranmayacak ve kısmi teminat uygulanacak halleri belirlemeye belirlemeye Cumhurbaşkanı yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="203" başlık="">
        <mvz-fıkra no="1">
          <template>202 nci maddenin 1 inci veya 3 üncü fıkrasında belirtilen kişilerin talebi üzerine gümrük idareleri, bir gümrük yükümlülüğünü gerektiren veya gerektirebilecek iki veya daha fazla işlemi kapsamak üzere toplu teminat verilmesine izin verirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="204" başlık="">
        <mvz-fıkra no="1">
          <template>202 nci maddenin birinci fıkrasında belirtilen teminat tutarı, teminata konu gümrük vergileri tutarının kesin olarak tespiti halinde bu miktar, diğer hallerde ise tahakkuk edilen veya edilebilecek gümrük vergilerinin en yüksek tutarı esas alınarak belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Zaman içinde değişkenlik gösteren gümrük vergileri için verilen toplu teminat tuturları, sözkonusu gümrük vergilerini her zaman karşılayabilecek biçimde belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Götürü teminat alınmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="205" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük vergileri için kabul edilecek teminatlar ile bunların değerlendirilmesi 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine tabidir. Yabancı paraların T.C. Merkez Bankası efektif alış kuru üzerinden hesaplanan değeri üzerinden teminat olarak kabulüne Müsteşarlık yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="206" başlık="">
        <mvz-fıkra no="1">
          <template>Teminatın zaman içinde değerini yitirmesi veya yetersiz kalması halinde, ilgili gümrük idaresi ek teminat verilmesini veya ilk teminatın yeni bir teminat ile değiştirilmesini isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Teminatın alınmasını gerektiren gümrük yükümlülüğü sona erdiğinde teminat çözülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gümrük yükümlülüğü kısmen sona erdiğinde, ilgilinin talebi üzerine verilmiş teminat kısmen çözülür. Ancak, söz konusu teminatın kısmen çözülmeye uygun olması gerekir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="207" başlık="">
        <mvz-fıkra no="1">
          <template>Nakdî teminat dışında, bu Kanuna göre;</template>
          <mvz-bent no="a">
            <template>Tahakkuk ettirilip tahsili gereken gümrük vergileri için verilen teminatın kabulü,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bir şartlı muafiyet düzenlemesine tabi tutulan eşyaya ilişkin gümrük yükümlülüğü doğması halinde, şartlı muafiyete ilişkin beyannamenin tescili,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>tarihinden başlamak üzere, 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 51 inci maddesine göre tespit edilen gecikme zammı tahsil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir şartlı muafiyet düzenlemesi kapsamında eşya için indirimli teminattan faydalanılması durumunda birinci fıkrada belirtilen gecikme zammı, teminatın nakit verilen kısmı dışında kalan kısım ile teminat verilmeyen kısmın tümü için uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Gümrük Yükümlülüğünün Sona Ermesi">
      <mvz-madde no="208" başlık="">
        <mvz-fıkra no="1">
          <template>6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümleri saklı kalmak üzere, gümrük yükümlülüğü;</template>
          <mvz-bent no="a">
            <template>Vergilerin ödenmesi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Vergilerin kaldırılmasına karar verilmesi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Gümrük beyannamesinin iptal edilmesi,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Eşyanın bir gümrük rejimi kapsamında tesliminden önce zapt ve müsadere edilmesi veya imha edilmesi, 164 üncü madde uyarınca imha veya terk edilmesi, doğal özellikleri veya beklenmeyen haller yahut mücbir sebep nedeniyle telef veya kaybı,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>182 nci madde uyarınca gümrük yükümlülüğü doğan eşyanın kanuna aykırı girişi nedeniyle müsadere edilmesi,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>hallerinde sona erer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="209" başlık="">
        <mvz-fıkra no="1">
          <template>194 üncü maddenin 1 inci fıkrası uyarınca doğan gümrük yükümlülüğü, bu işlemlerin iptal edilmesiyle ortadan kalkar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Vergilerin Geri Verilmesi veya Kaldırılması">
      <mvz-madde no="210" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanunda geçen;</template>
          <mvz-bent no="a">
            <template>"Geri verme" deyimi, ödenmiş olan gümrük vergilerinin tamamen veya kısmen geri ödenmesi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>"Kaldırma" deyimi, henüz ödenmemiş olan gümrük vergilerinin tamamen veya kısmen alınmamasına karar verilmesi,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>anlamına gelir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük vergilerinin geri verilmesi veya kaldırılmasına ilişkin hükümler bu Kanun kapsamında tatbik edilen para cezaları için de uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="211" başlık="">
        <mvz-fıkra no="1">
          <template>Kanunen ödenmemeleri gerektiği halde ödenmiş olduğu belirlenen gümrük vergileri geri verilir. Kanunen tahakkuk ettirilmemeleri gerektiği halde tahakkuk ettirilen gümrük vergileri kaldırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Ancak, kanunen ödenmemesi veya tahakkuk ettirilmemesi gereken gümrük vergileri ilgili kişinin kasten yaptığı bir tahrifat veya ticaret politikası önlemlerine tabi eşyanın gümrük kıymetinin yükümlünün kendi beyanı ile artırılması sonucunda ödenmiş veya tahakkuk ettirilmişse, bu vergilerin geri verilmesine veya kaldırılmasına ilişkin talepler kabul edilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanunen ödenmemeleri gereken gümrük vergileri, söz konusu vergilerin yükümlüye tebliğ edilmesi ve ilgilinin üç yıl içinde gümrük idaresine müracaatı üzerine geri verilir veya kaldırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Kontrol ve denetleme sonucunda, geri vermeveya kaldırma hallerinden birinin tespiti durumunda, aynı süre içinde geri verme veya kaldırma işlemi doğrudan yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Bu süre mücbir sebep veya beklenmeyen hallerde uzatılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="212" başlık="">
        <mvz-fıkra no="1">
          <template>Bir gümrük beyannamesine dayanılarak ödenmiş olan gümrük vergileri bu beyannamenin iptal edilmesi üzerine ilgilinin talebiyle geri verilir. Bu istemin, gümrük beyannamesinin iptal edilmesi amacıyla müracaatta bulunulması için öngörülen süreler içerisinde yapılması gerekir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="213" başlık="">
        <mvz-fıkra no="1">
          <template>Beyannamenin tescili tarihi itibariyle, kusurlu veya ithallerine esas teşkil eden sözleşme hükümlerine aykırı olduklarından bahisle, ithalatçı tarafından kabul edilmeyen eşyaya ilişkin ithalat vergileri geri verilir veya kaldırılır. Kusurlu eşyaya, teslimden önce hasar gören eşya da dahildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu tür eşyaya ilişkin ithalat vergilerinin geri verilmesi veya kaldırılması, kusurlu veya sözleşme hükümlerine aykırı olduklarının tespiti için gerekli olan ilk kullanım dışında eşyanın kullanılmamış olması ve eşyanın Türkiye Gümrük Bölgesi dışına ihraç edilmesi koşullarına bağlıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Gümrük idareleri, ilgilinin talebi üzerine, eşyanın ihracı yerine; imhasına, yeniden ihraç amacıyla transit veya gümrük antrepo rejimine tabi tutulmasına veya serbest bölgeye konulmasına izin verirler. Sözkonusu işlem veya kullanımlardan birine tabi tutulan eşya, serbest dolaşımda olmayan eşya olarak değerlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gümrük beyanından önce denenmek üzere geçici olarak teslim edilen eşyanın vergileri, eşyanın kusurlu veya sözleşme hükümlerine aykırı olduğu hususlarının deneme sırasında anlaşılamadığı kanıtlanmadıkça geri verilmez veya kaldırılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu madde uyarınca geri verilecek veya kaldırılacak gümrük vergileri için vergilerin yükümlüye tebliği tarihinden itibaren bir yıl içerisinde gümrük idaresine müracaat edilmesi gerekir. Mücbir sebebin tespiti halinde bu süre Müsteşarlıkça uzatılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="214" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük vergileri 211, 212 ve 213 üncü maddelerde belirtilen haller dışında, Türkiye'nin taraf olduğu uluslararası anlaşma hükümleri çerçevesinde Cumhurbaşkanı tarafından belirlenecek hallerde geri verilir veya kaldırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu maddede belirlenen geri verme ve kaldırma işlemleri, gümrük vergilerinin yükümlüye tebliği tarihinden itibaren bir yıl içinde ilgili gümrük idaresine başvurulması üzerine yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Ancak, mücbir sebebin tespiti halinde, bu sürenin aşılmasına Müsteşarlıkça izin verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="215" başlık="">
        <mvz-fıkra no="1">
          <template>Geri verme veya kaldırma işlemine tabi olmayacak gümrük vergileri miktarı Cumhurbaşkanı Kararı ile belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="216" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük vergileri ile bunların ödenmelerine bağlı olarak tahsil edilmiş gecikme faizinin veya gecikme zammının geri verilmesinde, geri vermeye konu fazla tahsilatın yükümlüden kaynaklanması durumunda geri verme başvurusunun yapıldığı tarihten, diğer durumlarda ise tahsilat tarihinden geri verme kararının tebliğ edildiği tarihe kadar geçen süre için geri verilecek tutar üzerinden, aynı dönemde kanuni faiz oranında hesaplanan faiz ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Geri verme kararının tebliğ edildiği tarihten itibaren dört ay içerisinde idarece söz konusu kararın uygulanmaması hâlinde, ilgilinin talebi üzerine, tebliğ tarihinden ödemenin yapıldığı tarihe kadar geçen süre için geri verilecek tutar üzerinden, aynı dönemde kanuni faiz oranında hesaplanan faiz ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="217" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük vergilerinin hatalı olarak kaldırılması veya geri verilmesi halinde, başlangıçta tahakkuk eden vergiler ile 216 ncı madde uyarınca ödenmiş faizler yeniden tahsil edilir. Tahsil edilmeyen miktarlar tebliğ tarihinden itibaren onbeş gün içinde ödenir. Bu süre içinde ödenmeyenler için 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="10-ONUNCU" başlık="Diğer Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="İşletmelerin Yükümlülükleri">
      <mvz-madde no="218" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye ile diğer ülkeler arasında demiryolu dahil kara, deniz ve hava yoluyla yapılan eşya ve yolcu taşımalarında yararlanılan istasyon, deniz ve hava limanlarını işleten kuruluşlar ile posta idareleri, bu Kanun hükümlerine göre gerekli gümrük gözetim ve kontrol işlemlerinin yapılmasını sağlamak üzere; yolcu salonları, geçici depolama yerleri, antrepolar ile görevli gümrük ve gümrük muhafaza idarelerinin çalışmalarına elverişli ve yeterli bürolar ve gözetleme kuleleri tesis etmek; buraların aydınlatma, ısıtma ve temizlik ihtiyaçlarını karşılamak; telefon ve büro eşyasını bedelsiz olarak sağlamak; limanlarda ve gümrük kapılarında gümrük gözetimine tabi eşya ve kişiler ile diğerlerinin birbirine karışmasını önlemeye yönelik her türlü fiziki yapıların sağlanması konusunda Gümrük Müsteşarlığının isteklerini yerine getirmek zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Posta idareleri, 1 inci fıkrada sayılanların yanı sıra posta kolilerinin muayene ve tahlili için gerekli ölçü aletleri ve diğer donanımları sağlamakla yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Türkiye ile diğer ülkeler arasında deniz ve havayolu ile yapılan eşya ve yolcu taşımalarında yararlanılan deniz ve havalimanlarını işleten kuruluşlar ile geçici depolama yeri işleticileri, gümrüklü sahalarda 26/9/2011 tarihli ve 655 sayılı Ulaştırma, Denizcilik ve Haberleşme Bakanlığının Teşkilat ve Görevleri Hakkında Kanun Hükmünde Kararname kapsamı dışında bulunan gümrük iş ve işlemleri ile ilgili tahmil, tahliye, ardiye, saha içi taşıma ücretleri ve benzeri masrafların belirlenen azami bedellerine uymakla yükümlüdür. Bakanlık tarafından azami bedeller belirlenirken özelleştirme uygulamaları çerçevesinde yapılan sözleşmelerde yer alan düzenlemeler dikkate alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="218/A" başlık="">
        <mvz-fıkra no="1">
          <template>Bakanlık, 8/6/1994 tarihli ve 3996 sayılı Bazı Yatırım ve Hizmetlerin Yap-İşlet-Devret Modeli Çerçevesinde Yaptırılması Hakkında Kanun uyarınca yaptırarak işletme hakkını verdiği gümrük kapıları ve/veya lojistik merkezlerini, işletme süresi bittikten sonra 30 yılı geçmemek üzere, 24/11/1994 tarihli ve 4046 sayılı Özelleştirme Uygulamaları Hakkında Kanunun 18 inci maddesinde belirtilen kiralama ve/veya işletme hakkının verilmesi yöntemleri ile 3996 sayılı Kanun ve bu Kanunun uygulanmasına ilişkin ikincil mevzuattaki görevlendirme usullerini kıyas yoluyla uygulayarak bu madde uyarınca belirlenen sözleşme bedeli karşılığında devredebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bakanlıkça belirlenen devir yöntemine göre değer tespiti işlemleri; Bakanlık tarafından görevlendirilecek bir Daire Başkanının başkanlığında, Gümrük ve Ticaret Uzmanı, Mali Hizmetler Uzmanı, Mühendis ve Gümrük Müdürü olmak üzere beş asil ve beş yedek üyeden oluşan Değer Tespit Komisyonu tarafından 4046 sayılı Kanunun 18 inci maddesinin birinci fıkrasının (B) bendinin (c) alt bendinde yer alan metotlardan en az birinin uygulanması suretiyle yapılır. Bu bedel, Komisyonun talebi üzerine Bakanlık tarafından hizmet alımı yoluyla 6/12/2012 tarihli ve 6362 sayılı Sermaye Piyasası Kanununa tabi şirketlere de tespit ettirilebilir. Bu durumda, tespit edilen değer, Değer Tespit Komisyonu tarafından incelenerek karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Görevlendirme işlemleri, Müsteşarın başkanlığında, ilgili Müsteşar Yardımcısı, Gümrükler Genel Müdürü, Gümrükler Muhafaza Genel Müdürü, Strateji Geliştirme Başkanı ve Destek Hizmetleri Dairesi Başkanı ve I. Hukuk Müşavirinden oluşan Görevlendirme Komisyonu tarafından yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu madde uyarınca oluşturulan komisyonlar eksiksiz olarak toplanır. Üyelerden birinin geçerli mazereti nedeniyle toplantıya katılamaması durumunda yerine vekili veya yedek üye katılır. Kararlar çoğunlukla alınır ve kararlarda çekimser kalınamaz. Kararlar imzalanan bir tutanakla tespit edilir. Karara muhalefet eden üye karşı oy gerekçesini yazarak imzalar. Komisyonlarca alınan kararlar Bakan onayına sunulur. Komisyonların sekreterya işlemleri Destek Hizmetleri Dairesi Başkanlığınca yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Devir işlemi gerçekleştirilen gümrük kapıları ve/veya lojistik merkezleri devir süresi sonunda aynı usullerle yeniden devredilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Görevlendirme kararı verilen şirket ile Bakanlık arasında sözleşme imzalanır. Ancak, görevlendirme kararı verilen şirketin ortakları arasında şirket sermayesine en az yüzde elli bir oranında iştirak eden kamu kurumu niteliğinde meslek kuruluşu veya üst kuruluşu olması hâlinde sözleşme, Bakanlık ile ilgili kamu kurumu niteliğindeki meslek kuruluşu ve görevlendirme kararı verilen şirket arasında imzalanır. Sözleşme tutarının yüzde altısı oranında kesin teminat alınır. Bu madde kapsamında yapılan sözleşmelere konu alanlarda yürütülen faaliyetlerden elde edilen toplam yıllık hasılattan genel bütçeye gelir kaydedilmek üzere yüzde bir oranında pay alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="219" başlık="">
        <mvz-fıkra no="1">
          <template>Antrepo işleticileri buralardaki eşyanın güvenliği ve hizmetlerin çabuk görülmesi bakımından, zaman içerisinde Müsteşarlıkça gerekli görülecek ek donanımları ve değişiklikleri yapmak ve ileri teknolojinin gerektirdiği araçları sağlamak zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template></template>
          <mvz-bent no="a">
            <template>Özel antrepo işleticileri, buralarda görevlendirilmesini istedikleri gümrük veya gümrük muhafaza memurlarına ödenecek olan ve miktarı Müsteşarlıkça belirlenecek fazla çalışma ücretlerini ve yolluklarını peşin olarak gümrük veznesine ödemekle yükümlüdürler.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Doğrudan doğruya belirli bir özel veya genel antrepo ile ilgili gümrük işlemlerini yerine getirmek üzere kurulan gümrük ve gümrük muhafaza idarelerinde görevli memurların Devlet tarafından belirlenen maaş, fazla çalışma ücreti ve diğer tahsisat tutarları, antrepo işleticileri tarafından her ay peşin olarak gümrük veznesine yatırılmak zorundadır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Posta idarelerinde yapılacak gümrük kontrolleri ve gümrük işlemleri nedeniyle gümrük memurlarına ödenecek olan ve Müsteşarlıkça belirlenen fazla çalışma ücretleri, posta idareleri tarafından gümrük veznesine yatırılır.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Çalışma Zamanları, Gümrük Personelinin Kıyafeti ve Gümrük Bayrağı">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Çalışma Zamanı ve Fazla Çalışma Ücreti">
        <mvz-madde no="220" başlık="">
          <mvz-fıkra no="1">
            <template>Gümrük idarelerinde normal çalışma saatleri; iklim, mevsim ve bölgenin ekonomik durumu ve ihtiyaçları gözönünde bulundurularak Müsteşarlıkça belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>35 inci madde hükümleri saklı kalmak üzere, gece ve gündüzün her saatinde yolcu ve yük alıp verme işleri yapılan veya taşıtların geliş ve gidişleri normal çalışma saatlerine uymayan kara hudut kapıları, demiryolu istasyonları ile deniz ve hava limanlarındaki gümrük idareleri devamlı surette açık bulundurulur. Buralarda görevli memurların çalışma saatleri, aralarında nöbet esasına göre düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="221" başlık="">
          <mvz-fıkra no="1">
            <template>Yolcuların ve taşıt araçlarının giriş ve çıkışlarına ait işlem dışında, yükleme ve boşaltma ile her türlü gümrük işlemlerinin normal çalışma saatleri içinde yapılması gerekir. Ancak, bu saatler dışında veya tatil zamanlarında hizmet talebinde bulunulduğunda, yazılı olarak yapılacak bu talep, işin yapılacağı gümrük idarelerince yerinde görülürse, gerekli önlemler alınmak ve çalışacak personelin fazla çalışma ücreti ve varsa hak sahibine ödenecek kanunî yollukları karşılığı tutarlar, talep sahipleri tarafından ilgili muhasebe birimi hesabına yatırılmak koşuluyla kabul edilir. Fazla çalışma ücretinden yararlanan personel, bu suretle kendilerine verilecek işleri yapmakla görevlidir. Gümrük idare amirleri normal çalışma saatleri dışında verilecek hizmetleri düzenler ve kontrol eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Normal çalışma saatleri içinde veya dışında olduğuna bakılmaksızın, çalışma ücretinin yatırılması halinde, özel kurye taşımacılığı gümrük hizmeti ile özel yolcu servisi taleplerinin yetkili gümrük idarelerince karşılanması mümkündür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İlgililerden tahsil edilecek fazla çalışma ücretlerinin miktarı ve tahsiline ilişkin usul ve esaslar Cumhurbaşkanınca tespit edilir. Fazla çalışma ücreti olarak yatırılan tutarlar, personelin fazla çalışma süresi, görev yapmış olduğu yer, görevinin önem ve güçlüğü, sınıfı, kadro unvanı gibi hususlar dikkate alınmak suretiyle belirlenecek usul ve esaslar dâhilinde Gümrük ve Ticaret Bakanlığı taşra teşkilatına ait kadro ve pozisyonlarda bulunanlardan ithalat ve ihracat, giriş ve çıkış işlemlerinin yapıldığı gümrük idarelerinde gümrük işlemlerini yürüten memurlar (375 sayılı Kanun Hükmünde Kararname eki (II) sayılı Cetvel kapsamında yer alan kadrolarda bulunanlar hariç) ve 14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanununun 4 üncü maddesinin (B) fıkrasına göre çalışan sözleşmeli personele ödenmek üzere Ankara Gümrük Muhasebe Birimi hesabına aktarılır. Söz konusu ödemeler, Maliye Bakanlığının uygun görüşü alınarak aylık miktarı (36.500) gösterge rakamının memur aylık katsayısıyla çarpımı sonucu bulunacak tutarı geçmemek üzere, Gümrük ve Ticaret Bakanı tarafından tespit edilir. Bu fıkra uyarınca personele her ay yapılacak fazla çalışma ücretinin net tutarı, 375 sayılı Kanun Hükmünde Kararnamenin ek 9 uncu maddesi uyarınca kadro ve görev unvanı veya pozisyon unvanı itibarıyla tespit edilmiş olan ek ödemenin net tutarından az olamaz. 375 sayılı Kanun Hükmünde Kararnamenin ek 9 uncu maddesi uyarınca Gümrük ve Ticaret Bakanlığı personeline yapılacak ödemeler de Ankara Gümrük Muhasebe Birimine aktarılan tutarlardan karşılanır. Bu madde uyarınca yapılan ödemelerden sonra yıl sonu itibarıyla hesapta kalan tutar, takip eden ocak ayı sonuna kadar bütçeye gelir kaydedilir. Bu madde kapsamında personele yapılması gereken ödemelerin Ankara Gümrük Muhasebe Birimi hesabına aktarılan tutarı aşması hâlinde, aradaki fark Maliye Bakanlığı tarafından personel giderlerini karşılama ödeneğinden Bakanlık bütçesine bu amaçla aktarılacak ödenekten karşılanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu madde kapsamında yapılan ödemeler 24/11/1994 tarihli ve 4046 sayılı Özelleştirme Uygulamaları Hakkında Kanunun 22 nci maddesine göre ödenen fark tazminatı hesabında dikkate alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="222" başlık="" durum="mülga">
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Gümrük Personelinin Kıyafeti ve Gümrük Bayrağı">
        <mvz-madde no="223" başlık="">
          <mvz-fıkra no="1">
            <template>Müsteşarlık merkez teşkilatında çalışan personel, başmüdür ve başmüdür yardımcıları ile yaptığı işin mahiyeti gereği sivil olarak çalışması gerekenler hariç olmak üzere, Müsteşarlığın diğer tüm kadro ve unvanlarda görev yapan personeli resmi kıyafet giymek zorundadır. Resmi kıyafetlerin ve bunlara takılacak kokart, isim plaketleri ve diğer işaretlerin şekli ile yaptığı işin mahiyeti gereği sivil olarak çalışması gereken personel yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="224" başlık="">
          <mvz-fıkra no="1">
            <template>Günün her saatinde hizmet veren gümrük kapılarında gümrük bayrağı sürekli olarak çekili kalır. Diğer gümrük binalarında ise yalnız kanuni çalışma saatlerinde gümrük bayrağı çekilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Gümrüklerde İş Takibi ve Gümrük Müşavirleri">
      <mvz-madde no="225" başlık="">
        <mvz-fıkra no="1">
          <template>Eşyanın gümrükçe onaylanmış bir işlem veya kullanıma tabi tutulmasına ilişkin faaliyetler, 5 inci madde hükümleri çerçevesinde, sahipleri ile bunların adına hareket edenler tarafından doğrudan temsil yoluyla veya gümrük müşavirleri tarafından dolaylı temsil yoluyla takip edilir ve sonuçlandırılır.  Gerçek kişinin doğrudan temsil yoluyla iş takibi, geçerli vekaletnameye istinaden ticari miktar ve mahiyet arz etmeyen eşyanın ve özel kullanıma mahsus taşıt araçlarının gümrük işlemleri ile ilgili olarak mümkündür. Posta yolu ve hızlı kargo taşımacılığı kapsamında gelen ya da gönderilen, miktarı ve değeri Cumhurbaşkanınca belirlenecek eşyanın gümrükçe onaylanmış bir işlem veya kullanıma tabi tutulması faaliyetlerinin takip edilip sonuçlandırılmasında, posta idaresi ya da hızlı kargo taşımacılığı yapan şirketler dolaylı temsilci olarak yetkili kılınabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Devlet, belediye, il özel idareleri ve diğer kamu tüzel kişilerinin amir ve memurları, özel hukuk tüzel kişilerinin kendilerini temsile yetkili personeli, tüm gümrük işlemlerini doğrudan temsil yoluyla takip edebilirler.  Özel hukuk tüzel kişilerinin doğrudan temsil yoluyla gümrük idarelerinde iş takibi yapacak personeli için 227 nci maddenin birinci fıkrasının (g) ve (h) dışındaki bentlerinde sayılan şartlar aranır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Kara, deniz ve havayolu işletmeleri ile nakliyeci kuruluş temsilcileri, taşıdıkları eşyanın sadece transit işlemlerini doğrudan temsil yoluyla takip edebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template> Doğrudan veya dolaylı temsilcilerin bu Kanunda öngörülen faaliyetlerini yapmalarına engel hastalığının bulunmaması gerekir. Tereddüt edilmesi halinde, Müsteşarlık tarafından tam teşekküllü resmi sağlık kurumlarından sağlık raporu talep edilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="226" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük müşavirleri her türlü gümrük işlemini takip ederek sonuçlandırabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük müşavir yardımcıları bir gümrük müşavirinin yanında çalışır ve onun adına gümrük idarelerinde iş takip edebilirler. Gümrük müşavir yardımcılarının gümrüklerde iş takibine ilişkin sınırlandırmalar yapmaya Gümrük Müsteşarlığı yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Stajyerler, gümrük idarelerinde iş takibi yapamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Gümrük müşavir yardımcılarının ve stajyerlerin fiil ve hareketlerinden doğacak mali sorumluluk, yanında çalıştıkları gümrük müşavirine aittir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="227" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük müşavir yardımcısı olabilecek kişilerin aşağıda belirtilen koşullara sahip olmaları gerekir:</template>
          <mvz-bent no="a">
            <template>Türkiye Cumhuriyeti vatandaşı olmak,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Medeni hakları kullanma ehliyetine sahip bulunmak,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kamu haklarından mahrum bulunmamak,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Taksirli suçlar hariç olmak üzere; affa uğramış olsalar dahi, ağır hapis veya beş yıldan fazla hapis ya da kaçakçılık, zimmet, ihtilas, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, dolanlı iflas, yalan yere şahadet, suç tasnii, iftira gibi yüz kızartıcı suçlar ile resmi ihale ve alım satımlara fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama, terörün finansmanı, Devlet sırlarını açığa vurma, vergi kaçakçılığı veya vergi kaçakçılığına teşebbüs suçları ile 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu kapsamı suçlar ile örgütlü suçlardan hüküm giymemiş olmak,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template></template>
            <mvz-altbent no="i">
              <template>Hukuk, iktisat, maliye, işletme, muhasebe, bankacılık, kamu yönetimi, siyasal bilgiler ve endüstri mühendisliği dallarında eğitim veren fakülte ve yüksekokullardan veya denkliği Yüksek Öğretim Kurumunca tasdik edilmiş yabancı yükseköğretim kurumlarından en az lisans seviyesinde mezun olmak,</template>
            </mvz-altbent>
            <mvz-altbent no="ii">
              <template>Diğer öğretim kurumlarından lisans seviyesinde mezun olduktan sonra (i) alt bendinde belirtilen bilim dallarından lisansüstü seviyede diploma almış olmak ya da ön lisans eğitimi veren gümrük, dış ticaret ve Avrupa Birliği konularında uzmanlık programı olan meslek yüksekokullarından mezun olmak,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Staj amacıyla bir gümrük müşavirinin yanında bir yıl çalışmış olmak,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Yapılan gümrük mevzuatı ve gümrüğe ilişkin iktisadi, ticari ve mali konuları kapsayan sınavda başarılı olmak,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template></template>
          <mvz-bent no="a">
            <template>Gümrük idaresinde en az onbeş yıl çalışıp da görevlerinden istifa ederek veya emekli olarak ayrılan memurlardan 1 inci fıkradaki koşulları taşıyanlar, staj koşulu aranmaksızın gümrük müşavir yardımcısı sınavına girebilirler.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Gümrük idaresinde en az onbeş yıl çalışıp da bunun üç yılını gümrük muayene memuru, gümrük başmemuru ve gümrük müdür yardımcısı görevlerinde geçirenlerden, görevlerinden istifa eden veya emekliye ayrılan ve 1 inci fıkradaki koşulları taşıyanlar sınav ve staj koşulu aranmaksızın gümrük müşavir yardımcısı olabilirler.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yukarıda belirtilen koşulları yerine getirenlere gerekli müracaat belgelerinin tamamlanmasından itibaren altmış gün içinde Gümrük Müsteşarlığı tarafından Gümrük Müşavir Yardımcılığı İzin Belgesi verilir. Gümrük müşavir yardımcıları ancak bu izin belgesini aldıktan sonra mesleki faaliyette bulunabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="228" başlık="">
        <mvz-fıkra no="1">
          <template>227 nci maddenin 1 inci fıkrasının (f) bendinin (ii) alt bendi hariç olmak üzere, aynı fıkrada belirtilen koşulları taşıyan ve iki yıl süre ile gümrük müşavir yardımcılığı yaparak, gümrük mevzuatı ve gümrüğe ilişkin iktisadi, ticari ve mali konuları kapsayan sınavda başarılı olan kişiler, gümrük müşavirliği yapmaya hak kazanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template></template>
          <mvz-bent no="a">
            <template>Gümrük idaresinde on yıl çalışmış olup, bunun üç yılını şube müdürü, gümrük müdürü, gümrük muhafaza müdürü, gümrük başmüdür yardımcısı ve gümrük muhafaza başmüdür yardımcısı görevlerinden geçirenlerden, görevlerinden, istifa eden veya emekliye ayrılanlar 227 nci maddenin 1 inci fıkrasında belirtilen koşulları taşımaları halinde, staj koşuluna tabi tutulmaksızın gümrük müşavirliği sınavına girebilirler. Bu kişilere, talep halinde sınav ve staj koşulu aranmaksızın Gümrük Müşavir Yardımcısı İzin Belgesi verilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Gümrük idaresinde gümrük başmüdürü, gümrük muhafaza başmüdürü, gümrük uzmanı, kontrolör, gümrük müfettişi, daire başkanı ve daha üst görevlerde enaz on yıl çalışmış olanlardan, görevlerinden istifa eden veya emekliye ayrılanlar, 227 nci maddenin 1 inci fıkrasında belirtilen koşulları taşımaları halinde, sınav ve staj koşuluna bağlı olmaksızın gümrük müşaviri olmaya hak kazanırlar.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>1 inci ve 2 nci fıkralarda belirtilen koşulları yerine getirenlere, gerekli müracaat belgelerinin tamamlanmasından itibaren altmış gün içinde Müsteşarlıkça Gümrük Müşavirliği İzin Belgesi verilir. Gümrük müşavirleri ancak bu izin belgesini aldıktan sonra mesleki faaliyette bulunabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="229" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük müşavirleri tebligat adreslerinde kullanılacak çalışma yerlerini, bu yerin bağlı bulunduğu Gümrük ve Muhafaza Başmüdürlüğüne yazı ile bildirirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük müşavirliğinin bir özel hukuk tüzel kişiliği oluşturularak yürütülmesi halinde, gümrük müşavirlerinin kuracağı tüzel kişiliklere gümrük müşavir yardımcıları da ortak olabilirler. Ancak, gümrük müşaviri ve gümrük müşavir yardımcısı birden fazla tüzel kişiliğe ortak olamaz. Gümrük müşavirliğinin bir tüzel kişilik olması halinde, gümrük beyannamesi veya beyanname kabul edilen diğer belgeler üzerine imzasını atmış olanların vergi kaybına neden olan durumu bildiği veya bilmesi gerektiği hallerde, bunlar gümrük idaresine karşı bağlı bulundukları tüzel kişilikle birlikte müteselsilen sorumlu olurlar. Bu hallerde, ilgili gümrük müşavirinin kişisel cezai sorumluluğu saklı kalmak kaydıyla, işlemi yapan kişi ile birlikte tüzel kişilik de gümrük idaresince alınan vergiler ve verilen para cezaları yönünden müteselsilen sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="230" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük müşavirleri, kanunlara göre tutmaya mecbur oldukları ticari veya kanuni defterlerini, vekaletname ve sözleşmelerini, işlerine dair yazdıkları ve aldıkları mektup, faks, telgraf ve benzeri belgeler ile düzenledikleri fatura, makbuz ve masraflarına ilişkin belgelerin asıllarını ve örneklerini özel kanunlardaki hükümler saklı kalmak kaydıyla beş yıl muhafaza etmeye; bunları gümrük müfettişi, gümrük müfettiş yardımcısı, kontrolör, stajyer kontrolör ve yetkili gümrük amir ve memurlarına göstermeye; bunların incelenmesine, denetlenmesine izin vermeye ve gerektiğinde yazılı istek üzerine bunları yukarıda belirtilen görevlilere ibraz etmeye mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="11-ONBİRİNCİ" başlık="Cezalar">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-madde no="231" başlık="">
        <mvz-fıkra no="1">
          <template>İdari yaptırıma konu fiilin, ceza uygulamasını gerektiren bir fiile ilişkin olması ve zamanaşımı daha uzun bulunan bu fiil nedeniyle ceza davası açılmış olmak kaydıyla, idari yaptırım kararları Türk Ceza Kanunundaki dava ve ceza zamanaşımı süreleri içerisinde uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük vergileri alacağına bağlı idari para cezalarının zamanaşımı, bu idari para cezalarına ilişkin gümrük vergilerinin zamanaşımına tabidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gümrük vergilerine ilişkin idari yaptırım kararları ve bu kararlara yönelik itirazlar hakkında bu Kısım ve Onikinci Kısım hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mülkiyetinin kamuya geçirilmesine karar verilen eşyanın bulunamaması hâlinde kaim değer olarak eşyanın gümrüklenmiş değerinin kamuya geçirilmesine karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Gümrük idaresi tarafından yükümlüye yazı ile yanlış izahat verilmiş olması hâlinde bu Kısım hükümlerine göre idari para cezası ve faiz uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="232" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kısmın İkinci Bölüm hükümlerine göre gümrük vergileri ile birlikte alınması gereken para cezaları bu vergiler ile aynı zamanda karara bağlanarak tebliğ edilir ve aynı zamanda ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Konusu ve yükümlüsünün aynı olması, aralarında maddi veya hukuki yönden bağlılık bulunması şartıyla; birden fazla işleme veya beyannameye ilişkin gümrük vergileri ve para cezalarına tek tahakkuk ve ceza kararı düzenlenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanun uyarınca idari yaptırım kararları gümrük idarelerinin amirleri veya yardımcıları tarafından verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="233" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanuna göre tahsil edilen idari para cezalarının yüzde onbeşi nispetinde bir tutar, varsa muayene ve tahlilden önce cezayı gerektiren durumun ortaya çıkarılmasını sağlayacak muhbirlere Müsteşarlık bütçesinin ilgili tertibinden ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Vergi Kaybına Neden Olan İşlemlere Uygulanacak Cezalar">
      <mvz-madde no="234" başlık="">
        <mvz-fıkra no="1">
          <template>Serbest dolaşıma giriş rejimi veya kısmi muafiyet suretiyle geçici ithalat rejimine tabi tutulan eşyaya ilişkin olarak, yapılan beyan ile muayene ve denetleme veya teslimden sonra kontrol sonucunda;</template>
          <mvz-bent no="a">
            <template>15 inci maddede belirtilen Gümrük Tarifesini oluşturan unsurlarda veya vergilendirmeye esas olan sayı, baş, ağırlık gibi ölçülerinde aykırılık görüldüğü ve beyana göre hesaplanan ithalat vergileri ile muayene sonuçlarına göre alınması gereken ithalat vergileri arasındaki fark %5’i aştığı takdirde, ithalat vergilerinden ayrı olarak bu farkın üç katı para cezası alınır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kıymeti üzerinden ithalat vergilerine tabi eşyanın beyan edilen kıymeti, 23 ila 31 inci maddelerde yer alan hükümler çerçevesinde belirlenen kıymete göre noksan bulunduğu takdirde, bu noksanlığa ait ithalat vergilerinden başka vergi farkının üç katı para cezası alınır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Satış birimine göre miktar itibarıyla %5’i geçmeyen bir fark ile maddi hesap hatasından doğan noksan kıymet beyanlarında, bu farklara ait ithalat vergilerinden başka vergi farkının yarısı tutarında para cezası alınır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Dahilde işleme rejimi, gümrük kontrolü altında işleme rejimi ve tam muafiyet suretiyle geçici ithalat rejimi hükümlerine tabi eşyaya ilişkin olarak yapılan beyan ile muayene ve denetleme veya teslimden sonra kontrol sonucunda; birinci fıkrada belirtilen farklılıkların tespiti durumunda vergi farkının yarısı tutarında idari para cezası verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yukarıda belirtilen aykırılıkların gümrük idaresince tespit edilmesinden önce beyan sahibince bildirilmesi durumunda söz konusu cezalar yüzde on nisbetinde uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Genel yönetim kapsamındaki kamu idareleri için yukarıda belirtilen cezalara ilişkin hükümler uygulanmaz. Bu gibi hallerde, 241 inci maddenin birinci fıkra hükmüne göre işlem yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>194 üncü maddenin birinci fıkrası uyarınca doğan gümrük yükümlülüğü kapsamında ödenmesi gereken ithalat vergilerinin anılan maddenin dördüncü fıkrasında öngörülen tarihe kadar hiç ödenmemiş veya eksik ödenmiş olduğunun gümrük idarelerince yapılan kontrol sonucunda tespit edildiği durumda, ödenmesi gereken ithalat vergilerinin söz konusu dördüncü fıkrada belirtilen faizi ile birlikte tahsilinin yanı sıra, yükümlüsü hakkında bu vergilerin dörtte biri tutarında para cezasına hükmedilir. Bu fıkrada belirtilen hiç ödenmeyen veya eksik ödenen ithalat vergilerinin yükümlüsünce gümrük idaresinin tespitinden önce bildirilmesi durumunda bu cezaya hükmedilmez. 194 üncü maddenin dördüncü fıkrası uyarınca işlem yapmakla yetinilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bir ila üçüncü fıkralara göre verilen cezalar 241 inci maddenin birinci fıkrasında belirtilen miktardan az olamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="235" başlık="">
        <mvz-fıkra no="1">
          <template>Serbest dolaşıma giriş rejimine tabi tutulan eşyaya ilişkin olarak, yapılan beyan ile muayene ve denetleme veya teslimden sonra kontrol sonucunda;</template>
          <mvz-bent no="a">
            <template>Eşyanın genel düzenleyici idari işlemlerle ithalinin yasaklanmış olduğunun tespiti hâlinde, varsa eşyanın fark gümrük vergilerinin alınmasının yanı sıra, gümrüklenmiş değerinin dört katı idari para cezası verilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>(a) bendindeki eşyanın değersiz, artık veya atık madde olması durumunda, idari para cezası; dökme halinde gelen eşya için ton başına otuz bin Türk Lirası, ambalajlı gelmesi halinde kap başına altı yüz Türk Lirası olarak hesaplanır ve eşya yurtdışı edilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Eşyanın ithali, belli kuruluşların vereceği ve gümrük idaresine ibrazı veya beyanı zorunlu olan lisans, izin, uygunluk belgesi veya bu belgeler yerine geçen bilgiye bağlı olmasına rağmen, eşya belge veya bilgiye tabi değilmiş ya da belge veya bilgi alınmış gibi beyanda bulunulduğunun tespit edilmesi hâlinde, varsa eşyanın fark gümrük vergilerinin alınmasının yanı sıra, gümrüklenmiş değerinin iki katı idari para cezası verilir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>(c) bendindeki eşyanın değersiz, artık veya atık madde olması durumunda, idari para cezası; dökme halinde gelen eşya için ton başına sekiz bin Türk Lirası, ambalajlı gelmesi halinde kap başına iki yüz Türk Lirası olarak hesaplanır ve eşya yurtdışı edilir.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Bakanlıkça belirlenecek süre içerisinde, (c) bendinde belirtilen eşyanın ithalinin uygun bulunduğuna ilişkin belge veya bilginin düzenlenmesi veya ilgili kurum veya kuruluş tarafından gerçekleştirilen denetimin olumlu sonuçlandığının bildirilmesi hâlinde, 241 inci maddenin birinci fıkrası uyarınca idari para cezası verilir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İhracat rejimine tabi tutulan eşyaya ilişkin olarak, yapılan beyan ile muayene ve denetleme veya kontrol sonucunda;</template>
          <mvz-bent no="a">
            <template>Eşyanın genel düzenleyici idari işlemlerle ihracının yasaklanmış olduğunun tespiti halinde, eşyanın gümrüklenmiş değerinin iki katı idari para cezası verilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Eşyanın ihracı, belli kuruluşların vereceği ve gümrük idaresine ibrazı veya beyanı zorunlu olan lisans, izin, uygunluk belgesi veya bu belgeler yerine geçen bilgiye bağlı olmasına rağmen, eşya belge veya bilgiye tabi değilmiş ya da belge veya bilgi alınmış gibi beyanda bulunulduğunun tespit edilmesi hâlinde, gümrüklenmiş değerinin onda biri kadar idari para cezası verilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bakanlıkça belirlenecek süre içerisinde, (b) bendinde belirtilen eşyanın ihracının uygun bulunduğuna ilişkin belge veya bilginin düzenlenmesi veya ilgili kurum veya kuruluş tarafından gerçekleştirilen denetimin olumlu sonuçlandığının bildirilmesi hâlinde 241 inci maddenin birinci fıkrası uyarınca idari para cezası verilir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yolcuların, gümrük mevzuatına göre kişisel ve hediyelik eşya kapsamı dışında olup beyanlarına aykırı olarak üzerlerinde, eşyası arasında veya taşıma araçlarında çıkan ya da başkasına ait olduğu halde kendi eşyasıymış gibi gösterdikleri eşyanın gümrük vergileri iki kat olarak alınır ve eşya sahibine teslim edilir. Gümrük vergileri ödenmediği takdirde, eşya gümrüğe terk edilmiş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Cezai hükümler saklı kalmak üzere;</template>
          <mvz-bent no="a">
            <template>Birinci fıkranın (a) bendinde belirtilen eşya, yükümlü talebi doğrultusunda otuz gün içinde mahrecine iade ya da ilgili kurum ya da kuruluşun uygun görüşü ile doğrudan üçüncü ülkeye transit edilir. Bu süre içerisinde mahrecine iade veya üçüncü ülkeye transit edilmeyen eşya, ihraç kaydıyla satış ya da masrafları sahibince karşılanmak koşuluyla imha suretiyle tasfiye edilmek üzere bulunduğu gümrük idaresine terk edilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Birinci fıkranın (c) bendinde belirtilen eşya, yükümlü talebi doğrultusunda mahrecine iade, ilgili kurum ya da kuruluşun uygun görüşü ile doğrudan ya da serbest bölge üzerinden üçüncü ülkeye transit veya ihraç kaydıyla satış ya da masrafları sahibince karşılanmak koşuluyla imha suretiyle tasfiye edilmek üzere bulunduğu gümrük idaresine terk edilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Teslimden sonra kontrol sonucunda uygunsuzluğu tespit edilen ancak bulunamayan eşyanın gümrüklenmiş değerinin kamuya geçirilmesine karar verilir.</template>
          </mvz-bent>

            <template>Dâhilde işleme rejimi ve gümrük kontrolü altında işleme rejimi kapsamında Türkiye Gümrük Bölgesine getirilen eşyanın izin verilen süresinin bitimini takiben iki ayı aşmayan süre içerisinde rejimin gerektirdiği işlemlerinin bitirilmesi, yeniden ihracı veya gümrükçe onaylanmış bir işlem veya kullanıma tabi tutulması,</template>
          </mvz-bent>
          <mvz-bent no="ı" durum="mülga">
            <template></template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Usulsüzlük cezası aşağıdaki hallerde birinci fıkrada belirtilen miktarın altı katı olarak uygulanır:</template>
          <mvz-bent no="a">
            <template>Türkiye Gümrük Bölgesinde karayoluyla transit eşya taşıyan taşıt araçlarının 91 inci maddeye göre verilen süreleri yetmişiki saate kadar aşması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Geçici ithalat rejimi kapsamında Türkiye Gümrük Bölgesine getirilen taşıtlara verilen sürenin bitimini takiben üç ayı aşmayan sürede yeniden ihraç edilmesi veya gümrükçe onaylanmış bir işlem veya kullanıma tabi tutulması.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Usulsüzlük cezası aşağıdaki hallerde 1 inci fıkrada belirtilen miktarın sekiz katı olarak uygulanır:</template>
          <mvz-bent no="a">
            <template>34 üncü maddenin 3 üncü fıkrası hükümlerinin aksine, Türkiye Gümrük Bölgesine giren gemilerin rota değiştirmesi, yolda durması, başka gemilerle temas etmesi, gümrük gözetimi yapılması için yol kesmemesi veya gümrük idaresi bulunmayan yerlere yanaşması ile yükü bulunmadığı durumlarda, yük almadığının veya yükünün başka bir limana çıkarıldığının veya avarya olduğunun kanıtlanamaması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Taşıt araçlarının 33 üncü ve 91 inci maddede belirtilen önceden belirlenmiş yollar dışında seyretmesi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Türkiye Gümrük Bölgesinde karayoluyla transit eşya taşıyan taşıt araçlarının 91 inci maddeye göre verilen süreleri yetmişiki saatten daha fazla bir süre ile aşması.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>11 inci madde hükmüne göre yazılı olarak talep edilen bilgi ve belgeler ile 13 üncü madde hükmü uyarınca beş yıl süreyle saklanması gereken belgelerin gümrük kontrolü sırasında ibraz edilmemesi.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Geçici ithalat rejimi kapsamında kişisel kullanıma mahsus yabancı plakalı taşıtları Türkiye Gümrük Bölgesine getiren hak sahipleri tarafından gümrük idaresine bilgi verilmeden taşıtsız yurt dışına çıkılması.</template>
          </mvz-bent>

        <mvz-fıkra no="7">
          <template>Bu Kanunun 218 inci maddesinin üçüncü fıkrası uyarınca Bakanlıkça belirlenen azami bedellere uyulmaması halinde her bir işlem için beş bin Türk lirası usulsüzlük cezası uygulanır.</template>

  <mvz-kısım no="12-ONİKİNCİ" başlık="İtirazlar">
    <mvz-madde no="242" başlık="">
      <mvz-fıkra no="1">
        <template>Yükümlüler kendilerine tebliğ edilen gümrük vergileri, cezalar ve idari kararlara karşı tebliğ tarihinden itibaren onbeş gün içinde bir üst makama, üst makam yoksa aynı makama verecekleri bir dilekçe ile itiraz edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İdareye intikal eden itirazlar otuz gün içinde karara bağlanarak ilgili kişiye tebliğ edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İtiraz dilekçelerinin süresi içinde yanlış makama verilmesi halinde, itiraz süresinde yapılmış sayılır ve idarece yetkili makama ulaştırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İtirazın reddi kararlarına karşı işlemin yapıldığı yerdeki idari yargı mercilerine başvurulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="243" başlık="">
      <mvz-fıkra no="1">
        <template>İlgili kişilere 197 nci maddeye göre tebliğ edilen gümrük vergilerinin hesaplanmasında esas alınan kimyevi tahlil sonuçlarına karşı tebliğden itibaren onbeş gün içinde gümrük ve muhafaza başmüdürlüğüne yazılı olarak itiraz edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İtiraz üzerine, birinci tahlilin yapıldığı gümrük laboratuarında görevli olan ve ilk tahlili yapan kimyager dışındaki iki kimyager tarafından ikinci tahlil yapılır. Yükümlünün talebi halinde, gümrük idareleri, gümrük kimyageri olmayan bir gözlemci kimyagerin de ikinci tahlilde hazır bulunmasına izin verirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Üç kimyagerden fazla kimyager bulunmayan gümrük laboratuarında yapılan tahlile itiraz edilmesi halinde, ikinci tahlil enaz iki kimyager bulunan en yakın gümrük idaresine ait laboratuarda yaptırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci tahlil sonucu, eşyanın teknik özelliklerinin ve niteliklerinin belirlenmesi yönünden kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="244" başlık="">
      <mvz-fıkra no="1">
        <template>Gümrük idarelerince düzenlenen ek tahakkuk ve ceza kararı muhteviyatı alacaklar için yükümlü veya ceza muhatabı tarafından uzlaşma başvurusu yapılabilir. Uzlaşmanın kapsamına;</template>
        <mvz-bent no="a">
          <template>Beyan ile gümrük idaresi tarafından yapılan tespit sonucunda belirlenen farklılıklara ilişkin tebliğ edilen gümrük vergileri alacakları,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Gümrük idaresi tarafından tespit edilmesinden önce beyan sahibi tarafından bildirilen farklılıklara ilişkin tebliğ edilen gümrük vergileri alacakları,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu Kanun ve ilgili diğer kanunlar uyarınca gümrük idaresi tarafından düzenlenen idari para cezaları,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>girer. Uzlaşma talebi, henüz itiraz başvurusu yapılmamış veya itiraz edilmiş olmakla birlikte itirazı henüz sonuçlandırılmamış gümrük vergileri ve idari para cezaları için, tebliğ tarihinden itibaren onbeş gün içinde yapılır. Uzlaşma talebinde bulunulması hâlinde, itiraz veya dava açma süresi durur, uzlaşmanın vaki olmaması veya temin edilememesi hâlinde süre kaldığı yerden işlemeye başlar, ancak sürenin bitimine beş günden az kalmış olması hâlinde süre beş güne tamamlanır. Uzlaşmanın vaki olmaması veya temin edilememesi hâlinde yeniden uzlaşma talebinde bulunulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Gümrük vergileri ve cezalarına ilişkin fiilin, 5607 sayılı Kanunda yer alan kaçakçılık suçları ile ilişkili olması hâlinde bu madde hükmü uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde kapsamında yapılan uzlaşma talepleri, gümrük uzlaşma komisyonları tarafından değerlendirilir. Gümrük uzlaşma komisyonlarının kurulması, çalışması ile bu madde kapsamında yapılacak işlemlere ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Gümrük uzlaşma komisyonlarının çalışmaları gizlidir. Uzlaşma tutanakları kesin olup gereği idarece derhal yerine getirilir. Vergi yükümlüsü veya ceza muhatabı, üzerinde uzlaşılan ve tutanakla tespit olunan hususlar hakkında dava açamaz ve hiçbir mercie şikâyette bulunamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Uzlaşılan gümrük vergileri ve cezalar, uzlaşma tutanağının tebliğinden itibaren bir ay içinde ödenir. Uzlaşılan vergilere ilişkin gümrük yükümlülüğünün başladığı tarihten uzlaşma tutanağının imzalandığı tarihe kadar geçen süre için 6183 sayılı Kanun hükümlerine göre belirlenen gecikme zammı oranında gecikme faizi uygulanır. Uzlaşmanın vaki olmaması veya temin edilememesi hâlinde, genel hükümlere göre işlem yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu madde uyarınca üzerinde uzlaşılan cezalar hakkında 30/3/2005 tarihli ve 5326 sayılı Kabahatler Kanununun 17 nci maddesi uyarınca ayrıca peşin ödeme indiriminden yararlanılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Uzlaşma komisyonlarının başkan ve üyelerine, bu komisyonlardaki çalışmaları dolayısıyla verilecek ücret Cumhurbaşkanı kararıyla belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
