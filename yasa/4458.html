  <mvz-künye tür="kanun" no="4458" başlık="GÜMRÜK KANUNU"
             tarih="27/10/1999" rgazete-tarih="4/11/1999" rgazete-sayı="23866"
             düstur-tertip="5" düstur-cilt="39" />
    
  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Temel Tanımlar">
      <mvz-madde no="1" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanunun amacı, Türkiye Cumhuriyeti Gümrük Bölgesine giren ve çıkan eşyaya ve taşıt araçlarına uygulanacak gümrük kurallarını belirlemektir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Cumhuriyeti Gümrük Bölgesi, Türkiye Cumhuriyeti topraklarını kapsar. Türkiye kara suları, iç suları ve hava sahası gümrük bölgesine dahildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunda geçen Türkiye Gümrük Bölgesi ve Gümrük Bölgesi kavramları Türkiye Cumhuriyeti Gümrük Bölgesini ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanunda geçen;</template>
          <mvz-bent no="1.">
            <template>"Müsteşarlık" deyimi, Gümrük Müsteşarlığını;</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template></template>
            <mvz-altbent no="a">
              <template>“Gümrük idaresi veya idareleri” deyimi, gümrük mevzuatında belirtilen işlemlerin kısmen veya tamamen yerine getirildiği merkez veya taşra teşkilatındaki hiyerarşik yönetim birimlerinin tamamını;</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>“Giriş gümrük idaresi” deyimi, eşyanın Türkiye Gümrük Bölgesine getirildiği ve risk analizine dayalı giriş kontrolüne tabi tutularak geciktirilmeksizin sevk işlemlerinin yapıldığı gümrük idaresini;</template>
            </mvz-altbent>
            <mvz-altbent no="c">
              <template>“İthalat gümrük idaresi” deyimi, Türkiye Gümrük Bölgesine getirilen eşyanın risk analizine dayalı kontrolleri de dâhil olmak üzere gümrükçe onaylanmış bir işlem ve kullanıma tabi tutulmasına ilişkin işlemlerinin yerine getirildiği gümrük idaresini;</template>
            </mvz-altbent>
            <mvz-altbent no="d">
              <template>“İhracat gümrük idaresi” deyimi, Türkiye Gümrük Bölgesini terk edecek eşyanın risk analizine dayalı kontrolleri de dâhil olmak üzere gümrükçe onaylanmış bir işlem ve kullanıma tabi tutulmasına ilişkin işlemlerinin yerine getirildiği gümrük idaresini;</template>
            </mvz-altbent>
            <mvz-altbent no="e">
              <template>“Çıkış gümrük idaresi” deyimi, eşyanın Türkiye Gümrük Bölgesini terk etmeden önce sunulmasının gerekli olduğu ve çıkış işlemlerinin tamamlanması ile ilgili gümrük kontrolleri ve risk analizine dayalı kontrollere tabi tutulduğu gümrük idaresini;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>"Kişi" deyimi, gerçek ve tüzel kişiler ile hukuken tüzel kişilik statüsüne sahip olmamakla birlikte yürürlükteki mevzuat uyarınca hukuki tasarruflar yapma yetkisi tanınan kişiler ortaklığını;</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>"Türkiye Cumhuriyeti Gümrük Bölgesinde yerleşik kişi" deyimi,</template>
            <mvz-altbent no="a">
              <template>Bu bölgede yerleşim yeri olan bütün gerçek kişileri;</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>Bu bölgede kayıtlı işyeri, kanuni iş merkezi veya şubesi bulunan bütün tüzel kişi veya kişiler ortaklığını;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>"Karar" deyimi, bağlayıcı tarife ve menşe bilgileri de dahil olmak üzere, gümrük idaresinin, gümrük mevzuatı ile ilgili olarak belirli bir konuda bir veya daha fazla kişi üzerinde hukuki sonuç doğuracak idari tasarrufunu;</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template></template>
            <mvz-altbent no="a">
              <template>“Serbest dolaşımda bulunan eşya” deyimi, 18 inci madde hükümlerine göre tümüyle Türkiye Gümrük Bölgesinde elde edilen ve bünyesinde Türkiye Gümrük Bölgesi dışındaki ülke veya topraklardan ithal edilen girdileri bulundurmayan veya şartlı muafiyet düzenlemelerine tabi tutulan eşyadan elde edilen ve tabi olduğu rejim hükümleri uyarınca özel ekonomik değer taşımadığı tespit edilen veya Türkiye Gümrük Bölgesi dışındaki ülke veya topraklardan serbest dolaşıma giriş rejimine tabi tutularak ithal edilen veya Türkiye Gümrük Bölgesinde, yukarıda belirtilen eşyadan ayrı ayrı veya birlikte elde edilen veya üretilen eşyayı;</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>“Serbest dolaşımda bulunmayan eşya” deyimi, serbest dolaşımda bulunan eşya dışında kalan eşya ile transit hükümleri saklı kalmak üzere Türkiye Gümrük Bölgesini fiilen terk eden eşyayı;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>"Gümrük statüsü" deyimi, eşyanın Türkiye Gümrük Bölgesinde serbest dolaşıma girmiş olup olmadığı yönünden durumunu;</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template></template>
            <mvz-altbent no="a">
              <template>“Gümrük vergileri” deyimi, ilgili mevzuat uyarınca eşyaya uygulanan ithalat vergilerinin ya da ihracat vergilerinin tümünü;</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>“Gümrük yükümlülüğü” deyimi, yükümlünün gümrük vergilerini ödemesi zorunluluğunu;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>“İthalat vergileri” deyimi,</template>
            <mvz-altbent no="a">
              <template>Eşyanın ithalinde ödenecek gümrük vergisi ile diğer eş etkili vergiler ve mali yükleri,</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>Tarım politikası veya tarım ürünlerinin işlenmesi sonucu elde edilen bazı ürünlere uygulanan özel düzenlemeler çerçevesinde ithalatta alınacak vergileri ve diğer mali yükleri;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="10.">
            <template>“İhracat vergileri” deyimi,</template>
            <mvz-altbent no="a">
              <template>Eşyanın ihracatında ödenecek gümrük vergisi ile diğer eş etkili vergiler ve mali yükleri,</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>Tarım politikası veya tarım ürünlerinin işlenmesi sonucu elde edilen bazı ürünlere uygulanan özel düzenlemeler çerçevesinde ihracatta alınacak vergileri ve diğer mali yükleri;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="11.">
            <template>"Yükümlü" deyimi, gümrük yükümlülüğünü yerine getirmekle sorumlu bütün kişileri;</template>
          </mvz-bent>
          <mvz-bent no="12.">
            <template>"Gümrük gözetimi" deyimi, gümrük mevzuatına ve gereken hallerde gümrük gözetimi altındaki eşyaya uygulanacak diğer hükümlere uyulmasını sağlamak üzere gümrük idareleri tarafından genel olarak uygulanan işlemleri;</template>
          </mvz-bent>
          <mvz-bent no="13.">
            <template>“Gümrük kontrolü” deyimi, Türkiye Gümrük Bölgesi ile diğer ülkeler arasında taşınan eşyanın giriş, çıkış, transit, nakil ve nihai kullanımını ve serbest dolaşımda bulunmayan eşyanın durumunu düzenleyen gümrük mevzuatı ve diğer mevzuatın doğru uygulanmasını sağlamak için gümrük idareleri tarafından yürütülen; eşyanın muayenesi, beyanname verileri ile elektronik veya yazılı belgelerin varlığının ve gerçekliğinin doğrulanması, işletmelerin hesap ve diğer kayıtlarının incelenmesi, taşıma araçlarının kontrolü, bagajların ve kişilerin yanlarında ya da üstlerinde taşıdıkları diğer eşyanın kontrolü ile resmi araştırmalar ve diğer benzeri uygulamaları;</template>
          </mvz-bent>
          <mvz-bent no="14.">
            <template>"Eşyanın gümrükçe onaylanmış bir işlem veya kullanıma tabi tutulması" deyimi, eşyanın,</template>
            <mvz-altbent no="a">
              <template>Bir gümrük rejimine tabi tutulmasını,</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>Bir serbest bölgeye girmesini,</template>
            </mvz-altbent>
            <mvz-altbent no="c">
              <template>Türkiye Gümrük Bölgesi dışına yeniden ihracını,</template>
            </mvz-altbent>
            <mvz-altbent no="d">
              <template>İmhasını,</template>
            </mvz-altbent>
            <mvz-altbent no="e">
              <template>Gümrüğe terk edilmesini;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="15.">
            <template>"Gümrük rejimi" deyimi,</template>
            <mvz-altbent no="a">
              <template>Serbest dolaşıma giriş rejimini,</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>Transit rejimini,</template>
            </mvz-altbent>
            <mvz-altbent no="c">
              <template>Gümrük antrepo rejimini,</template>
            </mvz-altbent>
            <mvz-altbent no="d">
              <template>Dahilde işleme rejimini,</template>
            </mvz-altbent>
            <mvz-altbent no="e">
              <template>Gümrük kontrolü altında işleme rejimini,</template>
            </mvz-altbent>
            <mvz-altbent no="f">
              <template>Geçici ithalat rejimini,</template>
            </mvz-altbent>
            <mvz-altbent no="g">
              <template>Hariçte işleme rejimini,</template>
            </mvz-altbent>
            <mvz-altbent no="h">
              <template>İhracat rejimini;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="16.">
            <template>"Gümrük beyanı" deyimi. belirlenen usul ve esaslar çerçevesinde eşyanın bir gümrük rejimine tabi tutulması talebinde bulunulmasını;</template>
          </mvz-bent>
          <mvz-bent no="17.">
            <template>"Beyan sahibi" deyimi, kendi adına beyanda bulunan kişiyi veya adına beyanda bulunulan kişiyi;</template>
          </mvz-bent>
          <mvz-bent no="18.">
            <template>"Eşyanın gümrüğe sunulması" deyimi, eşyanın gümrük idaresine ya da gümrükçe tayin edilen veya uygun görülen herhangi bir yere getirilmesi üzerine, belirlenen usul ve esaslara uygun olarak, gümrük idarelerine yapılan bildirimi;</template>
          </mvz-bent>
          <mvz-bent no="19.">
            <template>"Eşyanın teslimi" deyimi, eşyanın tabi tutulduğu gümrük rejimi ile öngörülen amaçlar doğrultusunda gümrük idareleri tarafından ilgilisine teslimini;</template>
          </mvz-bent>
          <mvz-bent no="20.">
            <template></template>
            <mvz-altbent no="a">
              <template>“Rejim hak sahibi” deyimi, kendi adına ve hesabına gümrük beyanını yapan veya hesabına gümrük beyanı yapılan kişi veya bu kişilere ait bir gümrük rejimi ile ilgili hakların ve yükümlülüklerin devredildiği kişiyi;</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>“Asıl sorumlu” deyimi, transit rejiminde rejim hak sahibini;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="21.">
            <template>"İzin hak sahibi" deyimi, kendisine bir izin verilen kişiyi;</template>
          </mvz-bent>
          <mvz-bent no="22.">
            <template>"Elleçleme" deyimi, gümrük gözetimi altındaki eşyanın asli niteliklerini değiştirmeden istiflenmesi, yerinin değiştirilmesi, büyük kaplardan küçük kaplara aktarılması, kapların yenilenmesi veya tamiri, havalandırılması, kalburlanması, karıştırılması ve benzeri işlemleri;</template>
          </mvz-bent>
          <mvz-bent no="23.">
            <template>"Eşya" deyimi, her türlü madde, ürün ve değeri;</template>
          </mvz-bent>
          <mvz-bent no="24.">
            <template>“Risk” deyimi, Türkiye Gümrük Bölgesi ve diğer ülkeler arasında taşınan eşyanın giriş, çıkış, transit, nakil ve nihai kullanımına ve serbest dolaşımda bulunmayan eşyaya ilişkin olarak,</template>
            <mvz-altbent no="a">
              <template>Ulusal ya da uluslararası düzeyde alınmış önlemlerin doğru bir şekilde uygulanmasını engelleyen,</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>Ülkenin mali çıkarlarını tehlikeye düşüren,</template>
            </mvz-altbent>
            <mvz-altbent no="c">
              <template>Ülkenin güvenlik ve emniyetine, kamu güvenliği ve kamu sağlığına, çevreye veya tüketicilere yönelik tehdit oluşturan,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="0">
            <template>bir olayın ortaya çıkma ihtimalini;</template>
          </mvz-bent>
          <mvz-bent no="25.">
            <template>“Risk yönetimi” deyimi, riskin sistematik olarak tanımlanması ve riskin en aza indirilmesi için gerekli olan tüm önlemlerin uygulanması amacıyla ulusal ve uluslararası kaynak ve stratejilere dayanılarak veri ve bilgi toplanmasını, risk analizi ve değerlendirilmesini, alınacak önlemlerin belirlenmesini ve uygulanmasını, bu sürecin işleyiş ve sonuçlarının düzenli olarak izlenmesi ve gözden geçirilmesini;</template>
          </mvz-bent>
          <mvz-bent no="26.">
            <template>“Gümrüklenmiş değer” deyimi, Uluslararası Kıymet Sözleşmesine göre belirlenecek; ithal eşyası için eşyanın CIF kıymeti ile gümrük vergileri toplamını, ihraç eşyası için FOB kıymeti ile gümrük vergileri toplamını;</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük idareleriyle muhatap olan kişiler bu Kanun ve Cumhurbaşkanlığı kararnameleri ile bunlara dayanılarak çıkarılan mevzuat hükümlerine uymak; gümrük idarelerinin gerek bu Kanunda gerek diğer mevzuat hükümlerine göre yapacağı gözetim ve kontrollere tabi olmak; bu idarelerin kendi adına veya başka idareler nam veya hesabına tahsil edeceği her tür vergi, resim, harç ve ücretleri ödemek veya bunların teminata bağlamak; mevzuat hükümlerinin uymayı zorunlu kıldığı her tür işlemleri yerine getirmekle sorumludurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Gümrük Mevzuatı Çerçevesinde Kişilerin Hak ve Yükümlülüklerine İlişkin Çeşitli Hükümler">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Temsil Hakkı ve Yetkilendirilmiş Yükümlü">
        <mvz-madde no="5" başlık="">
          <mvz-fıkra no="1">
            <template>Bütün kişiler, gümrük mevzuatı ile öngörülen tasarrufları ve işlemleri gerçekleştirmek üzere gümrük idarelerindeki işleri için bir temsilci tayin edebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Transit taşımacılık yapan veya arızi olarak beyanda bulunan kişiler hariç olmak üzere, temsilci Türkiye Gümrük Bölgesinde yerleşik bulunan kişilerdir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Temsil, doğrudan veya dolaylı olabilir. temsilci, doğrudan temsil durumunda başkasının adına ve hesabına hareket eder. Dolaylı temsil durumunda ise kendi adına, ancak başkasının hesabına hareket eder. Temsilci, temsil edilen kişi namına hareket ettiğini beyan etmek, temsilin doğrudan veya dolaylı olduğunu belirtmek ve sahip olduğu temsil yetki belgesini gümrük idarelerine ibraz etmek zorundadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bir başka kişi adına veya hesabına hareket ettiğini beyan etmeyen ya da bir temsil yetkisine sahip olmadığı halde, başka bir kişi adına ya da hesabına hareket ettiğini beyan eden kişi, kendi adına ve kendi hesabına hareket ediyor sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>225 inci maddenin 1 inci fıkrasında belirtilen kişiler gümrük idarelerinde dolaylı temsilci olarak iş takip edebilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="5/A" başlık="">
          <mvz-fıkra no="1">
            <template>Müsteşarlık, gerektiğinde ilgili kurum ve kuruluşların görüşlerini de almak suretiyle Türkiye Gümrük Bölgesinde ekonomik faaliyette bulunan yerleşik kişilere ikinci fıkrada yer alan şartları taşımaları halinde yetkilendirilmiş yükümlü statüsü tanır. Yetkilendirilmiş yükümlüler, kolaylaştırılmış emniyet ve güvenlikle ilgili gümrük kontrollerinden veya gümrük mevzuatının öngördüğü basitleştirilmiş uygulamalardan faydalanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yetkilendirilmiş yükümlü statüsünün tanınması için gereken şartlar aşağıda belirtilmiştir.</template>
            <mvz-bent no="a">
              <template>4 üncü maddede belirtilen sorumlulukların yerine getirilmesinde ciddi ihlallerde bulunmamak,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Gümrük kontrollerinin doğru biçimde yapılabilmesine imkân veren ticari kayıtları düzenli bir şekilde tutma yeterliliğine sahip bulunmak,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Müsteşarlıkça gerek görülen hallerde, mali yeterliliğe sahip olduğunu kanıtlamak,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Uygun emniyet ve güvenlik standartlarına sahip bulunmak.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İkinci fıkrada belirtilen şartlar ile aşağıdaki hususlara ilişkin usul ve esaslar yönetmelikle düzenlenir:</template>
            <mvz-bent no="a">
              <template>Yetkilendirilmiş yükümlü statüsünün verilmesi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Basitleştirmelerden faydalanma izninin verilmesi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bu statü ve izinlerin hangi gümrük idarelerince verileceğinin belirlenmesi,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Risk yönetimi düzenlemeleri dikkate alınarak, emniyet ve güvenliğe ilişkin gümrük kontrollerinde tanınacak kolaylıkların türü ve kapsamının belirlenmesi,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>İlgili kurum ve kuruluşlardan gerektiğinde görüş alınması ve bilgi talebinde bulunulması,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Yetkilendirilmiş yükümlü statüsünün geçici olarak geri alınması veya iptali.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Gümrük Mevzuatının Uygulanmasına İlişkin Kararlar">
        <mvz-madde no="6" başlık="">
          <mvz-fıkra no="1">
            <template>Gümrük idarelerinin gümrük mevzuatının uygulanmasına ilişkin bir karar vermesini talep eden her kişi, kararın verilebilmesi için gerekli bütün bilgi ve belgeleri söz konusu idarelere ibraz etmek zorundadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Karar alınması talebinin yazılı olarak yapılması gerekir. Gümrük idareleri, söz konusu talebe ilişkin başvurunun kendilerine ulaştığı tarihten itibaren otuz gün içinde karar alırlar. Verilen kararlar başvuru sahibine yazılı olarak tebliğ edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Ancak, gümrük idareleri tarafından bu süreye uyulması mümkün değilse; belirtilen süre aşılabilir. Bu durumda, söz konusu idareler, yukarıda belirlenen sürenin dolmasından önce başvuru sahibine süre aşımını haklı kılan gerekçeler ile talep hakkında karar vermek için gerekli gördükleri ek süreyi de belirterek bilgi verirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Gümrük idareleri tarafından gerek başvuruların reddine ve gerekse muhatabı kişinin aleyhine olarak verilen yazılı kararlar, Onikinci Kısımda belirtilen şekilde itiraz yolu açık olmak üzere gerekçeli olarak alınır ve bu hususlar kararda belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Alınan kararlar  gümrük idareleri tarafından derhal uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="7" başlık="">
          <mvz-fıkra no="1">
            <template>Gümrük idaresinin ilgilinin lehine olan kararları aşağıdaki hallerin bir arada bulunması durumunda iptal edilir.</template>
            <mvz-bent no="a">
              <template>Kararın yanlış veya eksik bilgilere dayanılarak verilmesi halinde,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Başvuru sahibinin bu yanlışlık veya eksikliği bilmesi veya bilmesi gerektiği hallerde,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kararın doğru veya tam bilgilere dayanılarak verilmesinin mümkün olmamasının tespiti halinde.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aşağıdaki hallerde ise ilgilinin lehine olan karar değiştirilir veya iptal edilebilir.</template>
            <mvz-bent no="a">
              <template>Karara esas teşkil eden bir veya birden fazla koşulun gerçekleşmemiş veya gerçekleşemez olması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Lehine olan bir kararda öngörülen bir yükümlülüğe ilgilinin uymaması halinde.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kararın iptali, muhatabına tebliğ edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>1 inci fıkra hükümlerine göre kararın iptal işlemi iptal kararının verildiği tarihten, 2 nci fıkra hükümlerine göre verilen iptal veya değiştirme kararı tebliğ tarihinden itibaren yürürlüğe girer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Bununla birlikte, karar muhatabının yasal çıkarlarının gerektirdiği istisnai hallerde, kararın iptalinin veya değiştirilmesinin yürürlük tarihi yönetmelikle belirlenen koşullar altında ertelenebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Bilgi">
        <mvz-madde no="8" başlık="">
          <mvz-fıkra no="1">
            <template>Kişiler gümrük idarelerinden gümrük mevzuatının uygulanması hakkında bilgi talep edebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bilgiler, talep edene ücretsiz olarak verilir. Bununla birlikte, özellikle eşyanın kimyevi tahlili veya ekspertizi ya da talep edene geri gönderilmesi nedeniyle gümrük idarelerince yapılan masraflar, talepte bulunan tarafından karşılanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="9" başlık="">
          <mvz-fıkra no="1">
            <template>Yazılı talep üzerine Müsteşarlık veya yetkilendirdiği gümrük idaresi tarafından bağlayıcı tarife veya bağlayıcı menşe bilgileri verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bağlayıcı tarife veya bağlayıcı menşe bilgisi, gümrük idarelerini, hak sahibine karşı sadece eşyanın tarife pozisyonu konusunda veya eşyanın menşeinin tespiti konusunda ve yalnızca bilginin verildiği tarihten sonra tamamlanacak gümrük işlemlerine konu olan eşya için bağlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Bağlayıcı menşe bilgisinin verilmesinde, 17 ila 22 nci maddelerde yer alan eşyanın menşeinin belirlenmesine ilişkin hükümler esas alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bilgi alan kişi;</template>
            <mvz-bent no="a">
              <template>Bağlayıcı tarife bilgisi için, beyan edilecek eşya ile verilen bilgide tanımlanan eşya arasında her bakımdan uygunluk bulunduğunu,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bağlayıcı menşe bilgisi için, beyan edilecek eşya ve menşe kazanımı gerektiren durumu ile verilen bilgide tanımlanan eşya ve menşe kazanımı gerektiren durumunun her bakımdan uygun bulunduğunu,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>kanıtlamak zorundadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bağlayıcı tarife bilgisi veriliş tarihinden itibaren altı yıl; bağlayıcı menşe bilgisi veriliş tarihinden itibaren üç yıl geçerlidir. Talep edenin verdiği yanlış veya eksik bilgiye dayanan bağlayıcı bilgi iptal edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bağlayıcı tarife bilgisi aşağıdaki durumlarda geçerliliğini kaybeder:</template>
            <mvz-bent no="a">
              <template>Türk Gümrük Tarife Cetvelinde değişiklik yapılması ve verilen bilginin söz konusu değişiklikle getirilen hükümlere uymaması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Dünya Gümrük Örgütünün uymakla yükümlü bulunduğumuz nomanklatür, izahname, tarife pozisyonlarına ilişkin kararlarındaki bir değişikliğe uymaması,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bağlayıcı tarife bilgisinin iptal edildiğinin veya değiştirildiğinin bilgi verilen kişiye tebliğ edilmesi.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Bu fıkranın (a) ve (b) bentlerinde belirtilen hallerde bağlayıcı tarife bilgisinin geçerliliğini kaybetme tarihi, söz konusu değişikliklerin Resmi Gazetede yayımı tarihidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bağlayıcı menşe bilgisi aşağıdaki durumlarda geçerliliğini kaybeder:</template>
            <mvz-bent no="a">
              <template>Menşe kurallarında bir mevzuat düzenlemesi veya bir uluslararası anlaşma gereğince değişiklik yapılması ve verilen bilginin söz konusu değişiklikle getirilen hükümlere uymaması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Dünya ticaret Örgütünün uymakla yükümlü bulunduğumuz Menşe Kuralları Anlaşmasına ve bu anlaşmaya ilişkin izahname ve kararlardaki bir değişikliğe uymaması,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bağlayıcı menşe bilgisinin iptal edildiğinin veya değiştirildiğinin bilgi verilen kişiye tebliğ edilmesi.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Bu fıkranın (a) ve (b) bentlerinde belirtilen hallerde bağlayıcı menşe bilgisinin geçerliliğini kaybetme tarihi, söz konusu değişikliklerin Resmi Gazetede yayımı tarihidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>5 ve 6 ncı fıkra hükümleri uyarınca geçerliliğini kaybeden bağlayıcı tarife veya menşe bilgisinin hak sahibi, söz konusu bağlayıcı bilgiye dayanarak ve bu bilginin geçerliliğini kaybetmesinden önce, ilgili eşyanın alımı veya satımı üstüne bağlayıcı sözleşmeler yaptığı takdirde, geçerliliğini kaybeden tarife veya menşe bilgisini, söz konusu yayımın ya da tebligatın yapıldığı, tarihten itibaren altı aylık bir süre boyunca kullanabilir. Ancak, gümrük işlemleri sırasında söz konusu ürünler için bir ithalat, ihracat ya da ön izin belgesinin gümrüğe verilmesi halinde, bu belgenin geçerlilik süresi esas alınır. Bu fıkra hükümlerine istisna getirmeye Cumhurbaşkanı yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Bağlayıcı tarife veya menşe bilgisine ilişkin 7 nci fıkra hükümleri ancak aşağıdaki amaçlarla kullanılabilir.</template>
            <mvz-bent no="a">
              <template>İthalat ya da ihracat vergilerinin belirlenmesi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Tarım politikası kapsamında ihracat vergi iadeleri ile ithalata ya da ihracata verilen diğer bütün ödemelerin hesaplanması,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Belgelerin, söz konusu tarife veya menşe bilgisine istinaden verilmiş olması koşuluyla, eşyaya ait gümrük beyannamesinin tescili için gümrük işlemlerinin yürütülmesi sırasında verilen ithalat, ihracat ya da ön izin belgesinin kullanımı.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="Diğer Hükümler">
        <mvz-madde no="10" başlık="">
          <mvz-fıkra no="1">
            <template></template>
            <mvz-bent no="a">
              <template>Bu Kanunda ve bu Kanuna dayanılarak çıkarılan mevzuatta yer alan; izin süreleri, teminat uygulamaları, gümrük vergilerinden muafiyet ve istisna uygulamaları ile beyanın düzeltilmesine ilişkin ortaya çıkan sorunları ve tereddütleri incelemek suretiyle gidermeye Müsteşarlığın önerisi ile bağlı bulunduğu Bakan yetkilidir.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Tabiî afetler, tehlikeli ve salgın hastalıklar, büyük yangınlar, radyasyon ve hava kirliliği gibi önemli nitelikteki kimyasal ve teknolojik olaylar ile büyük nüfus hareketleri gibi kriz hallerinde kriz bölgelerinde kullanılmak üzere yurt dışından gelecek araç, gereç, makine, teçhizat ve benzeri malzemelerin, giriş kayıtları tutulmak ve gümrük ile ilgili mevzuat gereğince yerine getirilmesi gereken işlemler sonradan yapılmak üzere, yurda girişine izin vermeye; bu şekilde yurda giren her türlü araç, gereç, makine ve teçhizatın tekrar yurt dışına çıkarılmalarına veya ihtiyaçlara ve günün şartlarına uygun olarak serbest dolaşıma girişine karar vermeye Müsteşarlığın bağlı olduğu Bakan yetkilidir.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Müsteşarlık, gümrük mevzuatının doğru olarak uygulanması için gerekli gördüğü bütün önlemleri alır. Bu çerçevede, eşyanın gümrükçe onaylanmış bir işlem veya kullanıma tabi tutulmasına ilişkin gerekli gördüğü bir kısım tespit işlemlerinin, belirleyeceği niteliklere sahip gümrük müşavirleri eliyle yürütülmesine ilişkin usul ve esasları düzenlemeye yetkilidir.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gümrük mevzuatının öngördüğü uygulamaların, hangi hallerde ve hangi koşullar altında basitleştirileceğine ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="10/A" başlık="">
          <mvz-fıkra no="1">
            <template>Gümrük idareleri, mevzuatın belirlediği şartlar çerçevesinde, Türkiye Gümrük Bölgesi ile diğer ülkeler arasında taşınan eşyanın giriş, çıkış, transit, aktarma ve nihai kullanımını ve serbest dolaşımda bulunmayan eşyanın durumunu düzenleyen gümrük mevzuatı ve diğer mevzuatın doğru uygulanmasını sağlamak için gerekli görülen gümrük kontrollerini yerine getirir. Uluslararası bir anlaşmanın öngörmesi halinde, mevzuatın doğru bir şekilde uygulanmasına yönelik gümrük kontrolleri başka bir ülkede de yürütülebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ani ve rastgele yapılanlar dışındaki gümrük kontrolleri; risklerin tespiti ve risk derecesinin ölçülmesi ile ulusal ve gerekli görüldüğü takdirde uluslararası düzeyde riskleri değerlendirerek gerekli önlemleri oluşturmak amacıyla bilgisayarlı veri işleme tekniklerini kullanan risk analizi esas alınarak yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Müsteşarlık, risk yönetimi çerçevesini oluşturur ve risk kriterleri ile öncelikli kontrol alanlarını belirler. Bu amaçla, risk kriterlerinin tespitine yönelik olarak gümrük işlemleri, gümrük kabahatleri ve kaçakçılık fiillerine ilişkin verileri toplamaya, saklamaya ve işlemeye yetkilidir. Verilerin toplanması, saklanması ve işlenmesine ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Gümrük idareleri dışındaki yetkili kurumlar tarafından gerçekleştirilecek kontroller, 21/3/2007 tarihli ve 5607 sayılı Kaçakçılıkla Mücadele Kanununun 19 uncu maddesi hükümleri saklı kalmak kaydıyla gümrük idarelerinin koordinasyonunda ve mümkün olduğu ölçüde aynı yer ve zamanda yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu maddede öngörülen kontroller kapsamında, gümrük idareleri ile diğer yetkili kurumlar, Türkiye Gümrük Bölgesi ile diğer ülkeler arasında taşınan eşyanın giriş, çıkış, transit, aktarma ve nihai kullanımı ile serbest dolaşımda bulunmayan eşyanın durumu ile ilgili alınan bilgileri riskin en az düzeye indirilebilmesi için kendi aralarında paylaşabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>12 nci madde hükümleri saklı kalmak kaydıyla, gizli bilgilerin diğer ülkelerin gümrük idarelerine ve güvenlik güçleri gibi diğer kurumlarına iletilmesine sadece uluslararası bir anlaşma çerçevesinde izin verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="11" başlık="">
          <mvz-fıkra no="1">
            <template>Gümrük işlemleriyle doğrudan veya dolaylı olarak ilgili bulunan kişiler, Gümrük Müsteşarlığının veya gümrük idarelerinin talebi üzerine gümrük işlemleri ile sınırlı olmak kaydıyla belirlenen süreler içinde gerekli bütün belge ve bilgileri vermek ve her türlü yardımı sağlamakla yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kendilerinden bu konularda bilgi istenilen kişiler, özel kanunlarda yazılı gizlilik hükümlerini ileri sürerek bilgi vermekten kaçınamazlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="12" başlık="">
          <mvz-fıkra no="1">
            <template>Gümrük idareleri ve diğer yetkili kurumlar gizli nitelikteki veya gizlilik esasına göre elde edilen bütün bilgileri saklamak zorundadır. Bu bilgileri veren kişinin veya makamın açık izni olmaksızın söz konusu bilgiler açıklanamaz. Şu kadar ki, gümrük idareleri ve diğer yetkili kurumlar verilerin korunmasına ilişkin yasal hükümler veya yargı kararlarının gereği olarak söz konusu bilgileri ilgili mercilere verirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gümrük işlemleri nedeniyle elde edilen gizli nitelikteki bilgilerin toplanması, kullanılması, saklanması, saklanma süresi ve üçüncü kişilere verilmesine ilişkin hükümler yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="13" başlık="">
          <mvz-fıkra no="1">
            <template>İlgili kişiler, 11 inci maddede belirtilen belge ve bilgileri gümrük kontrolü amacıyla beş yıl süre ile saklamak zorundadırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Belge saklama süresi;</template>
            <mvz-bent no="a">
              <template>(b) bendinde öngörülen haller dışında, serbest dolaşıma girmek veya ihraç edilmek üzere beyan edilen eşya ile ilgili olarak, serbest dolaşıma giriş veya ihracat beyanlarına ilişkin belgelerin tescil edildiği yılın;</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Nihai kullanımları nedeniyle indirimli veya sıfır ithalat vergisi ile Türkiye'de serbest dolaşıma giren eşya için, gümrük gözetimine tabi olmalarının sona erdiği yılın;</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Başka bir gümrük rejimine tabi tutulan eşya için, söz konusu gümrük rejiminin sona erdiği yılın;</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Serbest bölgeye konulan eşya için, buralardan çıktıkları yılın;</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Sonundan itibaren işlemeye başlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="14" başlık="">
          <mvz-fıkra no="1">
            <template>Bu Kanunda belirtilen süreler, tarih veya vadeler, aksine özel bir hüküm bulunmadıkça uzatılamaz veya ertelenemez. Süre, tarih veya vadelerin bitim tarihinin resmi tatil gününe rastlaması halinde, bu süreler ilk işgününün resmi çalışma saatleri sonunda biter.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Süre hafta veya ay olarak belli edilmiş ise; başladığı güne son hafta veya ayda tekabül eden günün mesai saati bitiminde sona erer. Sürenin bittiği ayda tekabül eden bir gün yoksa süre o ayın son gününün mesai saati bitiminde sona erer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu Kanuna göre gümrük idaresine yapılacak yazılı başvurular posta ile taahhütlü olarak gönderilebilir. Bu takdirde başvurunun postaya verildiği tarih gümrük idaresine verilme tarihi yerine geçer.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Gümrük Vergileri İle Eşya Ticareti Konusunda Öngörülen Diğer Önlemlerin Uygulanmasına İlişkin Unsurlar">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Gümrük Tarifesi ve Eşyanın Tarife Pozisyonlarına Ayrılması">
      <mvz-madde no="15" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük vergileri, gümrük yükümlülüğünün başladığı tarihte yürürlükte olan gümrük tarifesine göre hesaplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Eşya ticaretine ilişkin özel hükümlerle belirlenmiş diğer önlemler, gerektiği takdirde, söz konusu eşyanın tarife pozisyonuna göre uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">

          <mvz-bent no="d">

        <mvz-fıkra no="5">

          <mvz-bent no="a">

    <mvz-bölüm no="2-İKİNCİ" başlık="Eşyanın Menşei">

        <mvz-madde no="18" başlık="">
          <mvz-fıkra no="1">
            <template>Tümüyle bir ülkede elde edilen veya üretilen eşya, o ülke menşelidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tümüyle bir ülkede elde edilen veya üretilen eşya ifadesinden;</template>
            <mvz-bent no="a">
              <template>O ülkede çıkartılan madencilik ürünleri,</template>

            <mvz-bent no="b">

            </mvz-bent>
            <mvz-bent no="c">

            </mvz-bent>
            <mvz-bent no="d">
              <template>O ülkede yetiştirilen canlı hayvanlardan elde edilen ürünler,</template>
            </mvz-bent>
            <mvz-bent no="e">

            <mvz-bent no="h">

            </mvz-bent>
            <mvz-bent no="j">

        <mvz-madde no="19" başlık="">
          <mvz-fıkra no="1">
            <template>Üretimi birden fazla ülkede gerçekleştirilen eşyanın bir ülke menşeli sayılabilmesi için, o ülkede yeni bir ürün imal edilmesi veya imalatın önemli bir aşamasının ve ekonomik yönden gerekli görülen en son esaslı işçilik ve eylemin o ülkede bu amaçla donatılmış işletmelerde yapılması gerekir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="20" başlık="">
          <mvz-fıkra no="1">
            <template>Esas amacının, Türkiye tarafından belirli ülkelerin eşyasına uygulanan hükümleri aşmak olduğu tespit edilen veya yapılan araştırma sonucunda hakkında bu yönde bir kanaat oluşan bir işçilik veya işlemle üretilmiş eşya, 19 uncu maddeye dayanılarak o ülke menşeli sayılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="21" başlık="">
          <mvz-fıkra no="1">

          <mvz-fıkra no="2">

    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Eşyanın Gümrük Kıymeti">
      <mvz-madde no="23" başlık="">
        <mvz-fıkra no="1">
          <template>Eşyanın gümrük kıymeti, Gümrük Tarifesinin ve eşya ticaretine ilişkin belirli konularda getirilen tarife dışı düzenlemelerin uygulanması amacıyla, bu bölümde yer alan hükümler çerçevesinde belirlenen kıymettir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="">
        <mvz-fıkra no="1">
          <template>İthal eşyasının gümrük kıymeti, eşyanın satış bedelidir. Satış bedeli, Türkiye'ye ihraç amacıyla yapılan satışta 27 ve 28 inci maddelere göre gerekli düzeltmelerin de yapıldığı, fiilen ödenen veya ödenecek fiyattır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Şu kadar ki, eşyanın satış bedelinin gümrük kıymetine esas alınabilmesi, aşağıdaki koşullara bağlıdır:</template>
          <mvz-bent no="a">
            <template>Eşyanın alıcısı tarafından elden çıkartılması veya kullanımı;</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template> - Türkiye Cumhuriyeti mevzuatı ve bunların yetkili kıldığı merciler tarafından konulmuş olan,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template> - Eşyanın tekrar satılabileceği coğrafi bölgeyi sınırlayan,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template> - Eşyanın kıymetini önemli bir ölçüde etkilemeyen,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Kısıtlamalar dışında, hiçbir kısıtlamaya tabi olmamalıdır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Satış veya fiyat, kıymeti belirlenmekte olan eşya bakımından, kıymeti tespit edilemez bir koşul veya edim konusu olmamalıdır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Eşyanın alıcı tarafından tekrar satışı veya diğer herhangi bir şekilde elden çıkartılması ya da kullanımı sonucu doğan hasılanın bir bölümünün doğrudan veya dolaylı olarak satıcıya intikal etmesi halinde, ithal eşyasının fiilen ödenen veya ödenecek fiyatına 27 nci madde hükümlerine göre ilave yapılabilmelidir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Alıcı ve satıcı arasında bir ilişki bulunmamalı; ilişkinin varlığı durumunda ise, satış bedeli bu maddenin 2 nci fıkrası hükümlerine göre gümrük kıymeti olarak kabul edilebilir nitelikte olmalıdır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template></template>
          <mvz-bent no="a">
            <template>Yukarıdaki fıkra hükümlerini uygulayarak satış bedelinin belirlenmesinde, alıcı ile satıcı arasında bir ilişkinin varlığı, satış bedelinin reddedilmesi için tek başına yeterli bir neden oluşturmaz. Böyle durumlarda, satışa ilişkin koşullar incelenerek, bu ilişkinin fiyatı etkilemediği belirlenirse, satış bedeli kabul edilir. Gümrük idaresi, beyan sahibi veya diğer kaynaklardan elde ettiği bilgilere dayanarak, söz konusu ilişkinin fiyatı etkilediği kanısına varırsa, bu hususları beyan sahibine yazılı olarak bildirir. Süresi içinde verilmek şartıyla beyan sahibinin cevap hakkı saklıdır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Birbirleri ile ilişkisi bulunan kişiler arasındaki bir satışta, beyan sahibi satış bedelinin aynı veya yakın bir tarihte gerçekleşen aşağıda yer alan emsal kıymetlerden birine çok yakın olduğunu ispatlarsa, bu satış bedeli kabul edilerek, eşyanın kıymeti 1 inci fıkra hükümlerine göre belirlenir.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template> - Türkiye'ye ihraç amacıyla satılan aynı veya benzer eşyanın birbiriyle hiçbir ilişkisi bulunmayan satıcılar ve alıcılar arasında satışındaki satış bedeli,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template> - Aynı veya benzer eşyanın, 25 inci maddenin 2 nci fıkrasının (c) bendi hükümlerine göre belirlenen gümrük kıymeti,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template> - Aynı veya benzer eşyanın, 25 inci maddenin 2 nci fıkrasının (d) bendi hükümlerine göre belirlenen gümrük kıymeti.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Yukarıdaki emsal kıymetlerle yapılan kıyaslama sırasında, ticari düzeye, miktara, 27 nci maddede sayılan unsurlara ve alıcı ile satıcı arasında ilişkin bulunmayan satışlarda, satıcının üstlendiği, ancak satıcı ile alıcı arasında ilişki bulunan durumlarda satıcının üstlenmediği giderlere ilişkin ispatlanmış farklılıklar dikkate alınır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>(b) bendinde sayılan kıymetler, beyan sahibinin girişimi ile ve yalnız kıyaslama amacıyla kullanılır. (b) bendi hükümlerine dayanarak eşyanın satış bedelinin yerini alacak bir kıymet tespit edilemez.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template></template>
          <mvz-bent no="a">
            <template>Fiilen ödenen veya ödenecek fiyat, ithal eşyası için alıcının, satıcıya veya satıcı yararına yaptığı veya yapması gereken ödemelerin toplamıdır. Bu fiyat, ithal eşyasının satış koşulu olarak, alıcının satıcıya veya satıcının bir yükümlülüğünü karşılamak üzere üçüncü bir kişiye yaptığı veya yapacağı tüm ödemeleri kapsar. Ödemeler, para transferi şeklinde olabileceği gibi, akreditif veya ciro edilebilir bir kıymetli evrak kullanılarak ya da doğrudan veya dolaylı yapılabilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>27 nci maddeye göre yapılan ilaveler dışında, alıcının pazarlama dahil kendi hesabına yaptığı faaliyetler, satıcı yararına veya satıcı ile yapılan bir anlaşma yoluyla da olsa, satıcıya yapılan dolaylı bir ödeme olarak değerlendirilmez. Bu tür işlemlere ilişkin giderler, ithal eşyasının gümrük kıymetinin tespiti sırasında fiilen ödenen veya ödenecek fiyata ilave edilmez.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="">
        <mvz-fıkra no="1">
          <template>24 üncü madde hükümlerine göre belirlenemeyen gümrük kıymeti, bu maddenin 2 nci fıkrasının (a), (b), (c) ve (d) bentlerinin sıra halinde uygulanmasıyla belirlenir. Eşyanın gümrük kıymeti bir üst bent hükümlerine göre belirlenebildiği sürece bir alt bent hükümleri uygulanamaz. Ancak, beyan sahibinin yazılı talebinin gümrük idaresince uygun bulunması şartıyla (c) ve (d) bentlerinin uygulama sırası değiştirilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu madde hükümleri gereğince, gümrük kıymeti aşağıdaki yöntemlere göre belirlenir:</template>
          <mvz-bent no="a">
            <template>Türkiye'ye ihraç amacıyla satılarak, kıymeti belirlenecek eşya ile aynı veya yakın bir tarihte ihraç edilen aynı eşyanın satış bedeli,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Türkiye'ye ihraç amacıyla satılarak, kıymeti belirlenecek eşya ile aynı veya yakın bir tarihte ihraç edilen benzer eşyanın satış bedeli,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İthal eşyasının veya aynı ya da benzer eşyanın Türkiye içinde satıcılardan müstakil kişilere yapılan en büyük miktardaki satışına ait birim fiyata dayalı kıymet,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>İthal eşyasının üretiminde kullanılan malzeme ve imalat veya diğer imal işlemlerinin bedel veya kıymetleri ile Türkiye'ye ihraç edilmek üzere ihraç ülkesindeki üreticiler tarafından üretilen, kıymeti belirlenecek eşya ile aynı sınıf veya cins eşyanın satışında mutat olan kar ve genel giderlere eşit bir tutar ve 27 nci maddenin 1 inci fıkrasının (e) bendinde sayılan diğer bedel veya kıymetler toplamından oluşan hesaplanmış kıymet.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>2 nci fıkranın uygulanmasına ilişkin diğer usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="">
        <mvz-fıkra no="1">
          <template>24 ve 25 inci madde hükümlerine göre belirlenemeyen ithal eşyasının gümrük kıymeti;</template>
          <mvz-bent no="a">
            <template>1994 Gümrük Tarifeleri ve Ticaret Genel Anlaşmasının VII nci Maddesinin Uygulanmasına İlişkin Anlaşmanın,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>1994 Gümrük Tarifeleri ve Ticaret Genel Anlaşmasının VII nci Maddesinin,27</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bu bölüm hükümlerinin,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Prensip ve genel hükümlerine uygun yöntemlerle ve Türkiye'de mevcut veriler esas alınarak belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>1 inci fıkra hükümlerine göre gümrük kıymetinin belirlenmesinde;</template>
          <mvz-bent no="a">
            <template>Türkiye'de üretilen eşyanın Türkiye içindeki satış fiyatı,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Gümrük idaresinin iki alternatif kıymetten yüksek olanını kabul etmesini öngören bir sistem,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Eşyanın ihraç ülkesindeki iç piyasa fiyatı,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Aynı veya benzer eşyanın, 25 inci maddenin 2 nci fıkrasının (d) bendi hükümlerine göre hesaplanmış kıymeti dışındaki maliyet bedeli,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Türkiye'den başka bir ülkeye ihraç edilen eşyanın fiyatı,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Asgari gümrük kıymetleri,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Keyfi veya fiktif kıymetler,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>esas alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="">
        <mvz-fıkra no="1">
          <template>24 üncü madde hükümlerine göre gümrük kıymeti belirlenirken, ithal eşyasının fiilen ödenen veya ödenecek fiyatına aşağıdaki ilaveler yapılır:</template>
          <mvz-bent no="a">
            <template>Aşağıdaki unsurların eşyanın fiilen ödenen veya ödenecek fiyatına dahil edilmemiş, ancak alıcı tarafından üstlenilen bölümü;</template>
            <mvz-altbent no="i">
              <template>Satın alma komisyonları dışındaki komisyonlar ve tellaliye,</template>
            </mvz-altbent>
            <mvz-altbent no="ii">
              <template>Gümrük işlemleri sırasında söz konusu eşya ile tek eşya muamelesi gören kapların maliyeti,</template>
            </mvz-altbent>
            <mvz-altbent no="iii">
              <template>İşçilik ve malzeme giderleri dahil ambalaj bedeli;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İthal eşyasının üretiminde ve ihraç amacıyla satışında kullanılmak üzere, alıcı tarafından doğrudan veya dolaylı olarak, bedelsiz veya düşük bedelle sağlanan, fiilen ödenen veya ödenecek fiyata dahil edilmemiş olan aşağıda sayılan mal ve hizmetlerin kıymetinden verilecek uygun miktardaki pay;</template>
            <mvz-altbent no="i">
              <template>İthal eşyasına katılan malzeme, aksam, parça ve benzerleri,</template>
            </mvz-altbent>
            <mvz-altbent no="ii">
              <template>İthal eşyasının üretimi sırasında kullanılan araç, gereç, kalıp ve benzeri aletler,</template>
            </mvz-altbent>
            <mvz-altbent no="iii">
              <template>İthal eşyasının üretimi sırasında tüketilen maddeler,</template>
            </mvz-altbent>
            <mvz-altbent no="iv">
              <template>İthal eşyasının üretimi için gereken ve Türkiye dışında gerçekleştirilen mühendislik, geliştirme, sanat ve çizim çalışmaları, plan ve taslak hazırlama hizmetleri;</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kıymeti belirlenecek eşyanın satış koşulu gereği, alıcının doğrudan veya dolaylı olarak ödemesi gereken, fiilen ödenen veya ödenecek fiyata dahil edilmemiş olan royalti ve lisans ücretleri;</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>İthal eşyasının tekrar satışı veya diğer herhangi bir şekilde elden çıkartılması ya da kullanımı sonucu doğan hasılanın, doğrudan veya dolaylı olarak satıcıya intikal eden kısmı;</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>28 inci maddenin (a) bendi hükmü saklı kalmak üzere, ithal eşyası için Türkiye’deki giriş liman veya yerine kadar yapılan nakliye ve sigorta giderleri ile eşyanın giriş liman veya yerine kadar nakliyesi ile ilgili olarak yapılan yükleme ve elleçleme giderleri.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu maddeye göre fiilen ödenen veya ödenecek fiyata yapılacak ilaveler için nesnel ve ölçülebilir veriler esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gümrük kıymetinin belirlenmesinde, fiilen ödenen veya ödenecek fiyata bu maddede öngörülenler dışında hiçbir ilave yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu bölümde geçen satın alma komisyonları ifadesinden; ithalatçının temsilcisine kıymeti belirlenecek eşyanın satın alınmasında yurtdışında verdiği temsil hizmeti karşılığında ödediği ücret anlaşılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İthal eşyasının gümrük kıymetinin belirlenmesi sırasında;</template>
          <mvz-bent no="a">
            <template>Türkiye’de çoğaltılması hakkı için yapılan ödemeler,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Türkiye’ye ihraç amacıyla satışında bir satış koşulu olmaması kaydıyla, dağıtım veya tekrar satış hakları için alıcının yaptığı ödemeler,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>1 inci fıkranın (c) bendi kapsamında değerlendirilmez ve fiilen ödenen veya ödenecek fiyata ilave edilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="">
        <mvz-fıkra no="1">
          <template>İthal eşyasının fiilen ödenen veya ödenecek fiyatından ayırt edilebilmeleri koşuluyla aşağıdaki giderler gümrük kıymetine dahil edilmez:</template>
          <mvz-bent no="a">
            <template>Eşyanın, Türkiye Cumhuriyeti Gümrük Bölgesi ile Türkiye’nin anlaşmalarla dahil olduğu gümrük birliği gümrük bölgelerine giriş yerine varışından sonra yapılan nakliye ve sigorta giderleri,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Sınai tesis, makina veya teçhizat gibi, ithal eşyası için ithalattan sonra yapılan inşa, kurma, montaj, bakım veya teknik yardıma ilişkin giderler,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İthal eşyasının satışıyla ilgili olarak bir finansman anlaşması uyarınca alıcı tarafından üstlenilen faiz giderleri;</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>İthal eşyasının Türkiye’de çoğaltılması hakkı için yapılan ödemeler;</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Satın alma komisyonları;</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Eşyanın ithali veya satışı nedeniyle Türkiye’de ödenecek ithalat vergileri.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>(c) bendinde belirtilen hallerde, finansmanın satıcı veya bir başka kişi tarafından sağlanmış olmasına bakılmaz. Ancak, finansman anlaşmasının yazılı olarak yapılmış olması ve gerektiğinde alıcının;</template>
          <mvz-bent no="0">
            <template>- Eşyanın, fiilen ödenen veya ödenecek fiyat olarak beyan edilen fiyattan satıldığını,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>- Söz konusu faiz oranının, finansmanın sağlandığı ülkede o tarihte bu tür bir işlem için geçerli olan faiz oranı seviyesini aşmadığını,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>kanıtlaması şarttır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="">
        <mvz-fıkra no="1">
          <template>Bilgisayarlarda kullanılmak üzere, veri veya komutlar yüklü bilgi taşıyıcılarının gümrük kıymetinin tespitine ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="">
        <mvz-fıkra no="1">
          <template>Eşyanın gümrük vergisine esas alınacak kıymetinin Türk Lirası olarak beyanı zorunludur. Fatura veya diğer belgelerde yazılı yabancı paralar, gümrük yükümlülüğünün başladığı tarihte yürürlükte olan T.C. Merkez Bankası döviz satış kurları üzerinden Türk Lirasına çevrilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="">
        <mvz-fıkra no="1">
          <template>Bu bölüm hükümleri, gümrükçe onaylanmış bir başka işlem veya kullanıma tabi tutulduktan sonra serbest dolaşıma giren eşyanın gümrük kıymetinin belirlenmesine ilişkin özel hükümleri etkilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>24, 25 ve 26 ncı maddelere istisna olarak, genellikle konsinye şekilde teslim edilen çabuk bozulabilir eşyanın gümrük kıymeti, beyan sahibinin talebi üzerine, gümrük idaresince basitleştirilmiş usullere göre belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Eşyanın Ağırlığı ve Kapları">
      <mvz-madde no="32" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük Tarifesinde ağırlık esasına göre vergiye tabi eşyada, vergiye esas ağırlıklar ile bazı pozisyon ve alt pozisyonların kapsamının belirlenmesine esas alınan ağırlıklar;</template>
          <mvz-bent no="a">
            <template>Brüt ağırlığa atıfta bulunulan hallerde, eşyanın kendi ağırlığı ile tüm ambalaj maddeleri ve kapların ağırlıkları toplamı,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Net ağırlığa veya sadece ağırlığa atıfta bulunulan hallerde, eşyanın kendi ağırlığı,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Olarak değerlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Brüt ağırlığı üzerinden vergiye tabi eşya ambalajsız geldiği takdirde, söz konusu eşya bulunduğu haldeki ağırlığı üzerinden vergiye tabi tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Değişik vergi oranlarına ve aynı zamanda brüt ağırlıkları üzerinden vergiye tabi eşyanın aynı ambalaj içinde gelmesi halinde, eşya, net ağırlıkları üzerinden tartılır ve ambalaj ağırlığı orantılı olarak net ağırlıklara ilave edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Beyan edilen ölçü birimi ile vergilendirmeye esas alınan ölçü biriminin farklı olması halinde, bunların birbirlerine dönüştürülmesine ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Eşyanın ambalajlarının;</template>
          <mvz-bent no="a">
            <template>Alışıla gelen ve bilinen maddelerden olmaması veya gereğinden farklı bir şekilde yapılması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Ait oldukları eşyanın faturasında kıymetlerinin ayrı gösterilmesi ve aynı zamanda bağımsız bir ticari eşya niteliğinde olması,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İthalat vergilerinden kaçınma amacıyla ambalaj olarak getirilmesi,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Hallerinde, bunlar ayrı olarak beyan edilir ve girdikleri tarife pozisyonlarına göre vergiye tabi tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Ancak, yukarıdaki gibi kendi tarifeleri üzerinden vergiye tabi ambalaj maddelerinin vergi oranı, içindeki eşyanın gümrük vergi oranından düşük veya buna eşit bulunduğu takdirde, ambalaj maddelerinin gümrük vergisi eşyanın tabi bulunduğu vergi oranları üzerinden ve eşya ile birlikte hesaplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Ağırlık üzerinden vergiye tabi eşyanın alışıla gelen ambalaj niteliğinde olmayan kutu, kılıf ve mahfazalarının gümrük vergi oranları, içindeki eşyanın vergi oranından daha yüksek bulunduğu takdirde, kendilerine ait tarife pozisyonlarına göre vergiye tabi tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Kıymet üzerinden vergiye tabi eşyanın kutu, kılıf ve mahfazaları, başlıbaşına bir ticari eşya niteliğinde olmaması ve kıymetinin eşyanın kıymetine dahil bulunması şartıyla gümrük vergisine tabi tutulmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Ağırlıkları üzerinden gümrük, vergisine tabi eşyanın örnekleme yöntemiyle yapılan gümrük muayenesi sırasında;</template>
          <mvz-bent no="a">
            <template>Kapların yalnız bir kaçının tartılması sonucunda beyana göre fazlalık saptanırsa, aynı cins ve türden eşyanın tartılmamış kaplarına da bu fazlalığın ortalaması esas alınarak ilaveler yapılır. Beyan sahibi, bu şekilde yapılan işlemi kabul etmez ise gümrük idaresi tarafından bütün kaplar tartılır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Tartılan kaplarda beyana göre eksiklik saptanırsa bunun eşyanın doğal özelliklerinden veya hasara uğramasından veya noksan gönderildiğinden veya çalınmasından ileri geldiğinin kanıtlanması halinde, ithalat vergileri bulunan miktar üzerinden hesaplanır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Ancak, bu gibi durumlarda gümrük idaresinin veya beyan sahibinin bütün kapları tarttırmak hakları saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Taşıtların Kontrolü ve Gümrük Bölgesine Getirilen Eşya Gümrükçe Onaylanmış Bir İşlem veya Kullanıma Tabi Tutulana Kadar Uygulanacak Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Taşıtların Türkiye Gümrük Bölgesine Giriş ve Çıkışı">
      <mvz-madde no="33" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Gümrük Bölgesine giriş ve çıkış gümrük kapılarından yapılır. Türkiye Gümrük Bölgesinin giriş noktalarındaki gümrük kapıları ile içeride bulunan gümrük kapıları arasında belirli yolların takip edilmesi zorunludur. Giriş ve çıkış kapıları ile bunları birbirine bağlayan yollar ve hava taşıtlarının Türkiye Gümrük Bölgesinde inebilecekleri gümrük işlemi yapılan havalimanları ilgili kamu kuruluşlarının görüşleri alınarak, Müsteşarlıkça tespit edilerek Resmi Gazetede yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel hizmete açık demiryolları gümrük yolu sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="34" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Gümrük Bölgesine giren veya çıkan taşıtlar gümrük gözetimine tabidir. Bunlar, yürürlükteki hükümlere uygun olarak, gümrük idareleri tarafından denetlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Karayolu ile Türkiye Gümrük Bölgesine gelen taşıtların denetlenmesi bitmeden veya ilgili gümrük idaresinin izni alınmadan söz konusu taşıtlara yük ve yolcu alınıp verilemez ve taşıt yoluna devam edemez; trenlerin vagon değiştirmek veya eklemek suretiyle tertipleri değiştirilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Türkiye Gümrük Bölgesi dışından, demiryolundan başka kara taşıtları ile ancak sınırdaki yetkili bir gümrük idaresine eşya getirilebilir. Sınırdaki yetkili olmayan bir gümrük idaresine gelen eşya gümrük gözetimi altında yetkili bir gümrük idaresine götürülmediği takdirde geri çevrilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Türkiye Gümrük Bölgesine yürütülerek getirilecek hayvanlar, sağlık kontrolü yapılabilen gümrük kapılarından girebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template></template>
          <mvz-bent no="a">
            <template>Türkiye Gümrük Bölgesi dışındaki limanlardan gelen gemiler, Gümrük Bölgesine girmelerinden itibaren beklenmeyen haller veya mücbir sebep olmadıkça ya da gümrük kontrolü gerektirmedikçe, gidecekleri limana göre mutat olan rotayı değiştiremez, yolda duramaz başka gemilerle temas edemez ve gümrük idaresi bulunmayan yerlere yanaşamazlar. Gümrük memurları gemiyi, yükünü ve bunlara ait gerekli tüm defter, belge ve kayıtları denetlemeye, gerektiğinde ambarları ve eşya bulunan diğer yerleri mühür altına almaya yetkilidir.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Yabancı limanlardan gelip Türk limanlarına veya nehirlerine girecek olan gemiler, gümrük denetlemesi yapılmak üzere belirli yerlerde durur veya yol keserler.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Yabancı limanlardan gelen veya Türkiye'den yabancı limanlara giden gemilerin geliş ve gidişlerinde yönetmelikle belirlenecek süreler içerisinde donatan veya işleten veya acentası tarafından ilgili gümrük idarelerine bilgi verilir.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Gemi adamları ve yolcuları ile gemilere girip çıkacak görevli ve görevsiz kimseler Türkiye'ye ancak yetkili gümrük idarelerinden giriş ve çıkış yapabilirler.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Türkiye limanları arasında düzenli sefer yapan ve acentası bulunan gemiler serbest dolaşımda olmayan eşya alırlar veya yolda yabancı limana uğrarlarsa (a) fıkrası hükümlerine tabi tutulurlar. Bu tür gemiler ile bunların yolcu ve yüklerinin denetleme ve gümrük işlemlerinde kolaylık sağlayacak usul ve esaslar koymaya Müsteşarlık yetkilidir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>(b) fıkrası dışında kalan gemilerin Türkiye limanları arasındaki sefer ve taşımaları gümrük gözetimine tabi tutulabilir. Bu tür gemiler, Müsteşarlıkça belirlenecek şartlar ve verilecek izin çerçevesinde serbest dolaşımda olmayan eşyayı Türkiye limanları arasında transit suretiyle taşıyabilirler.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>(c) fıkrasında yazılı taşımalar ile Türkiye karasuları ve iç sularında seyreden her türlü taşıtlar üzerinde gümrükçe yapılacak gözetim ve kontrole ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Türkiye'ye gelen ve Türkiye'den gidecek olan hava araçları yetkili gümrük idaresi bulunan havalimanlarına inebilir veya bu havalimanlarından kalkabilirler. Bu hava araçları gümrük gözetimine tabidir. Özel bir izin ile gelen ve giden hava gemilerinin kaptan pilotları verilen talimata uygun olarak hareket ederler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Türk ve yabancı donanmasına mensup harp gemileri ile Türk Hava Kuvvetlerine mensup hava harp gemileri ve Cumhurbaşkanının izni ile gelen yabancı devletlerin hava harp gemileri, içlerinde eşya bulunmaması halinde gümrük gözetimine tabi değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Gümrük Bölgesine giriş ve çıkış ile gümrük idarelerindeki her türlü gümrük işlemleri normal çalışma saatleri içinde yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Ancak;</template>
          <mvz-bent no="a">
            <template>Demiryolu katarları ve düzenli sefer yapan deniz, nehir, kara ve hava taşıtları gece ve gündüzün her saatinde Gümrük Bölgesine girip çıkabilirler. Düzensiz seferli olan ve yolcu getiren deniz, nehir, kara ve hava taşıtları da aynı şekilde Gümrük Bölgesine girip çıkabilirler.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İşletme teşkilatı bulunan limanlarda, gemiler gece ve gündüzün her saatinde yük ve yolcu alıp çıkarabilirler.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Zorlayıcı sebeplerle çalışma saatleri dışında gümrük idaresi olan bir limana girmek veya bu limandan ayrılmak zorunda kalan gemilerin yük alıp verme istekleri de gümrük idarelerince kabul edilir. Yolcu ve turist taşıyan her türlü gemi mesai saatleri dışında gümrük idaresi bulunan bir limana girip çıkabilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Özet Beyan ve Eşyanın Türkiye Gümrük Bölgesine Girmesi">
      <mvz-madde no="35/A" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Gümrük Bölgesinin kara suları veya hava sahasından gümrük bölgesi içinde durmaksızın geçen taşıt araçları ile taşınan eşya hariç olmak üzere, Türkiye Gümrük Bölgesine getirilen eşya için özet beyan verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Özet beyan, giriş gümrük idaresine verilir. Giriş gümrük idaresine gerekli bilgilerin derhal iletilebildiği veya elektronik ortamda erişiminin sağlandığı hallerde, özet beyanın giriş gümrük idaresinden başka bir gümrük idaresine verilmesine izin verilebilir. Yükümlünün bilgisayar sistemindeki özet beyan bilgilerine erişilebilmesi halinde, Müsteşarlık, özet beyan yerine bir bildirimde bulunulmasını kabul edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Özet beyan, eşyanın Türkiye Gümrük Bölgesine getirilmesinden önce verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Eşyanın Türkiye Gümrük Bölgesine getirilmesinden önce özet beyanın ibraz edilme süresi, bu süreye getirilebilecek istisnalar ve bu süreye ilişkin değişiklikler, özet beyandan vazgeçilebilmesine dair şartlar; özel durumlar ile belirli eşya trafiği, taşıma şekli ve yükümlü türleri ile özel güvenlik düzenlemelerinin öngörüldüğü uluslararası anlaşmalar dikkate alınarak yönetmelik ile düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35/B" başlık="">
        <mvz-fıkra no="1">
          <template>Özet beyanın şekli ve içeriği; öncelikle güvenlik ve emniyet amacı ile uluslararası standartlar ve ticari uygulamalardan yararlanılarak risk analizi ve gümrük kontrollerinin etkin yapılabilmesi için gerekli bilgileri kapsayacak şekilde yönetmelik ile belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Özet beyan veri işleme tekniği kullanılarak hazırlanır. Gerekli ayrıntıları içermesi halinde ticari bilgiler ile liman veya taşıma bilgileri kullanılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Müsteşarlık, istisnai durumlarda yazılı olarak düzenlenen özet beyanları, veri işleme tekniği kullanılarak hazırlanan özet beyanlar ile aynı düzeyde risk yönetimi uygulanmasına imkân verilmesi kaydıyla kabul edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Özet beyan eşyayı Türkiye Gümrük Bölgesine getiren veya eşyanın gümrük bölgesine taşıma sorumluluğunu üstlenen kişi tarafından verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Dördüncü fıkrada belirtilen kişilerin yükümlülükleri saklı kalmak kaydıyla özet beyan;</template>
          <mvz-bent no="a">
            <template>Dördüncü fıkrada belirtilen kişiler adına hareket eden kişi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Eşyayı yetkili gümrük idaresine sunabilen veya eşyanın sunulmasını sağlayan kişi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Dördüncü fıkra ile (a) ve (b) bentlerinde belirtilen kişilerin temsilcisi,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>tarafından, yönetmelik ile belirlenen şartlar uyarınca verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Dördüncü ve beşinci fıkralarda belirtilen kişilerin talep etmeleri halinde, özet beyanın verilmesinden sonra bir veya daha fazla bilginin değiştirilmesine gümrük idarelerince izin verilir. Ancak;</template>
          <mvz-bent no="a">
            <template>Özet beyanı veren kişiye eşyanın muayene edileceğinin bildirilmesinden,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Söz konusu bilgilerin yanlış olduğunun tespit edilmesinden,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Eşyanın boşaltılmasına izin verilmesinden,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>sonra özet beyanda değişiklik yapılmasına izin verilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35/C" başlık="">
        <mvz-fıkra no="1">
          <template>Giriş gümrük idaresi, 35/A maddesinin üçüncü ve dördüncü fıkrasına göre belirlenecek süre sona ermeden önce gümrük beyannamesi verilen eşya için özet beyan verilmesinden vazgeçebilir. Bu durumda, gümrük beyannamesi, 35/B maddesinde öngörülen özet beyanda bulunması gerekli asgari bilgileri içerir ve 61 inci madde uyarınca tescil edilinceye kadar özet beyan statüsüne sahiptir. Giriş gümrük idaresine gerekli bilgileri derhal iletebildiği veya elektronik ortamda erişimini sağladığı hallerde, gümrük beyannamesinin giriş gümrük idaresinden başka bir gümrük idaresine verilmesine izin verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük idarelerince, bilgisayar veri işleme tekniği kullanılmadan düzenlenen gümrük beyannameleri için, veri işleme tekniği kullanılarak hazırlanan gümrük beyannameleri ile aynı düzeyde risk yönetimi uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="36" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Gümrük Bölgesine getirilen eşya, girişinden itibaren gümrük gözetimine tabidir. Bunlar, yürürlükteki hükümlere uygun olarak gümrük idareleri tarafından denetlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Söz konusu eşya gümrük statüleri belirleninceye, serbest dolaşımda olmayan eşya ise 77 nci maddenin 1 inci fıkrası hükmü saklı kalmak üzere, gümrük statüleri değişinceye ya da serbest bölgeye girinceye yahut 163 ve 164 üncü maddeler gereğince yeniden ihraç veya imha edilinceye kadar gümrüğün gözetimi altında kalır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Gümrük Bölgesine getirilen eşya, getiren kişi tarafından gecikmeksizin Müsteşarlıkça belirlenen usul ve esaslara uygun olarak;</template>
          <mvz-bent no="a">
            <template>Belirlenen bir gümrük idaresine veya gümrükçe uygun görülen herhangi bir yere,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Deniz veya havayoluyla ya da Türkiye Gümrük Bölgesinden geçmeksizin karayoluyla doğrudan bir serbest bölgeye,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>götürülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türkiye Gümrük Bölgesine getirildikten sonra eşyanın aktarılması sonucunda nakliyesinden sorumlu olanlar yukarıda belirtilen hükümlere uymak zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gümrük idarelerinin gözetim ve kontrolüne ilişkin hükümler saklı kalmak kaydıyla, yolcu, sınır ahalisi ve posta eşyası ile ekonomik açıdan önem arz etmeyen eşya için özel hükümler getirmeye Müsteşarlık yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yukarıdaki fıkralar ile 35/A ila 35/C ve 38 ila 50 nci madde hükümleri, Türkiye Gümrük Bölgesinin dışında durmaksızın, Gümrük Bölgesinin iki noktası arasında düzenli bir hava veya deniz seferiyle doğrudan yapılan taşımacılık nedeniyle Türkiye Gümrük Bölgesini geçici olarak terk eden eşyaya uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu maddenin 1 inci fıkrası hükmü, varış yeri bir Türk limanı veya havalimanı olmaksızın, Türkiye karasularını ya da hava sahasını geçen gemilerde veya hava araçlarında yüklü eşyaya uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="">
        <mvz-fıkra no="1">
          <template>Beklenmeyen haller veya mücbir sebep nedeniyle 33 üncü madde ile 34 üncü maddenin 1 inci ve 3 üncü fıkralarında öngörülen yükümlülüklere uyulmadığı takdirde, söz konusu yükümlülüklere tabi kişi veya onun yerine hareket eden diğer kişiler, en yakın gümrük idaresini gecikmeksizin bu durumdan ve eşyanın bulunduğu hal ve yerden haberdar ederler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Beklenmeyen haller veya mücbir sebep nedeniyle, Türkiye karasuları içinde taşıdığı eşyayı denize atan, karaya çıkaran, başka bir taşıta aktaran veya bu eşyayı toplayan gemi kaptanları yahut diğer kişiler, eşyanın gümrük statüsünün belirlenmesi ve gereken diğer önlemlerin alınması amacıyla en yakın gümrük idaresini bu durumdan ve eşyanın bulundğu hal ve yerden haberdar ederler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>34 üncü maddenin 5 inci fıkrasında belirtilen bir geminin veya hava gemisinin beklenmeyen haller veya mücbir sebep nedeniyle 34 üncü maddenin 1, 3 ve 4 üncü fıkralarında öngörülen yükümlülüklere uymaksızın geçici olarak Türkiye Gümrük Bölgesi içinde demir atmaya veya konaklamaya mecbur kalması halinde, bu gemiyi veya hava gemisini Gümrük Bölgesine getiren veya onun yerine hareket eden diğer kişiler, gümrük idaresini gecikmeksizin durumdan haberdar ederler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>1 inci fıkrada belirtilen eşya ile 2 nci fıkrada belirtilen gemi veya hava gemisine yüklü eşyanın gümrük kontrolüne imkan verecek ve gerektiğinde daha sonra belirlenen veya uygun görülen bir gümrük idaresine götürülmelerini sağlayacak önlemler Müsteşarlıkça tespit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Eşyanın Gümrüğe Sunulması">
      <mvz-madde no="39" başlık="">
        <mvz-fıkra no="1">
