          <template>Türkiye Gümrük Bölgesinin kara suları veya hava sahasından durmaksızın geçen taşıt araçları ile taşınan eşya hariç olmak üzere, Türkiye Gümrük Bölgesine gelen eşya, getiren kişi ya da duruma göre eşyanın gelişinden sonra taşıma sorumluluğunu üstlenen kişi tarafından gümrüğe sunulur. Gümrüğe sunan kişi, eşyayı daha önce ibraz olunan özet beyan ya da gümrük beyannamesi ile ilişkilendirir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="40" başlık="">
        <mvz-fıkra no="1">
          <template>Müsteşarlık;</template>
          <mvz-bent no="a">
            <template>Yolcu beraberinde getirilecek,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Gümrüğe sunulmaksızın bir gümrük rejimine tabi tutulabilecek,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Eşya hakkında, 39 uncu madde hükümleri dışında özel düzenlemeler yapabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="41" başlık="">
        <mvz-fıkra no="1">
          <template>Talep üzerine, gümrükçe onaylanmış bir işlem veya kullanıma tabi tutulmasından önce, gümrüğe sunulan eşyanın incelenmesi veya bundan numune alınması yönünden ilgili ve yetkili kişilere izin verilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Gümrüğe Sunulan Eşyanın Boşaltılması">
      <mvz-madde no="42" başlık="" durum="mülga">
      </mvz-madde>
      <mvz-madde no="43" başlık="" durum="mülga">
      </mvz-madde>
      <mvz-madde no="44" başlık="" durum="mülga">
      </mvz-madde>
      <mvz-madde no="45" başlık="">
        <mvz-fıkra no="1">
          <template>Eşya bulunduğu taşıt araçlarından gümrük idarelerinin belirledikleri veya uygun gördükleri yerlerde söz konusu idarelerin izni ile boşaltılabilir veya aktarılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Ancak, eşyanın tamamen veya kısmen acilen boşaltılmasını gerektiren kaçınılmaz bir tehlikenin varlığı durumunda bu izin aranmaz. Bu gibi durumlarda en yakın gümrük idaresi derhal haberdar edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük idareleri, eşyanın ve bulunduğu taşıma araçlarının muayenesi amacıyla gerektiğinde eşyanın boşaltılmasını ve kapların açılmasını isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Eşya konulduğu ilk yerden gümrük idarelerinin izni olmaksızın kaldırılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Gümrüğe Sunulan Eşyaya Gümrükçe Onaylanmış Bir İşlem veya Kullanım Belirlenmesi Zorunluluğu">
      <mvz-madde no="46" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrüğe sunulan eşyaya, gümrükçe onaylanmış bir işlem veya kullanım tayin edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Özet beyan kapsamındaki eşyaya, gümrükçe onaylanmış bir işlem veya kullanım belirlenerek, buna ilişkin işlemler;</template>
          <mvz-bent no="a">
            <template>Denizyolu ile gelen eşya için, özet beyan verildiği tarihten itibaren kırkbeş gün,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Diğer bir yolla gelen eşya için, özet beyanın verildiği tarihten itibaren yirmi gün, içinde tamamlanır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Şartlar gerektirdiği takdirde, Müsteşarlık 2 nci fıkrada ve 48 inci maddenin ikinci fıkrasında belirtilen sürelerden daha kısa bir süre saptayabilir veya bu sürelerin uzatılmasına izin verebilir. Ancak, gerçek ihtiyaçları aşan süre uzatımı yapılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="6-ALTINCI" başlık="Eşyanın Geçici Depolanması">
      <mvz-madde no="47" başlık="">
        <mvz-fıkra no="1">
          <template>Eşya, gümrüğe sunulmasından sonra gümrükçe onaylanmış bir işlem veya kullanıma tabi tutuluncaya kadar geçici depolanan eşya statüsünde bulunur ve bu şekilde adlandırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="48" başlık="">
        <mvz-fıkra no="1">
          <template>Geçici depolanan eşya, sadece gümrük idarelerinin uygun gördüğü yerlerde ve bu idarelerin belirlediği koşullarda depolanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Gümrük idareleri, geçici depolanan eşya için 183 üncü veya 184 üncü madde hükümlerine göre tahakkuk edebilecek gümrük vergilerinin ödenmesini sağlamak üzere eşya sahibinden teminat isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yolcu beraberinde getirilip gümrüğe sunulmasından sonra gümrükçe onaylanmış bir işlem veya kullanıma tabi tutuluncaya kadar yolcu eşyasına mahsus gümrük ambarlarına konulan eşyanın buralarda kalabileceği süre üç aydır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="49" başlık="">
        <mvz-fıkra no="1">
          <template>41 inci madde hükümleri saklı kalmak üzere, geçici depolanan eşya, görünüş ve teknik özelliklerinin değiştirilmemesi koşuluyla, aynı durumda muhafazalarını sağlamak üzere yönetmelikle belirlenen elleçlemeye tabi tutulabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="50" başlık="">
        <mvz-fıkra no="1">
          <template>46 ncı maddeye göre belirlenmiş süreler ile 48 inci maddenin 2 nci fıkrasında belirtilen süre içinde kendilerine gümrükçe onaylanmış bir işlem veya kullanım tayini için gerekli işlemlere başlanmamış eşya, herhangi bir adli veya idari takibata konu olmaması halinde, 177 ila 180 inci madde hükümlerine göre tasfiye edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrük idareleri, söz konusu eşyayı durumu belirleninceye kadar, eşya sahibinin risk ve hesabına gümrüğün gözetimindeki özel bir yere sevk edebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="7-YEDİNCİ" başlık="Transit Rejimi Altında Taşınan Eşyaya Uygulanacak Hükümler">
      <mvz-madde no="51" başlık="">
        <mvz-fıkra no="1">
          <template>37 nci maddenin 1 inci fıkrasının (a) bendi hariç olmak üzere, 37 ila 50 nci madde hükümleri, daha önce başlamış bir transit rejimi altında Türkiye Gümrük Bölgesine getirilen eşyaya uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="52" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Gümrük Bölgesinde bir yerden diğer bir yere transit rejimi kapsamında taşınarak varış gümrük idaresine sunulan serbest dolaşımda olmayan eşyaya 41 ila 50 nci madde hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="8-SEKİZİNCİ" başlık="Diğer Hükümler">
      <mvz-madde no="53" başlık="">
        <mvz-fıkra no="1">
          <template>Gümrük idareleri, şartlar gerektirdiği takdirde, gümrüğe sunulan eşyayı imha ettirebilir. Gümrük idareleri bu durumu eşya sahibine bildirir. Eşyanın imhasına ilişkin masraflar eşya sahibinden tahsil edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="54" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanun hükümlerine aykırı olarak; Türkiye Gümrük Bölgesine getirildiği veya gümrük kontrolüne tabi tutulmadığı saptanan eşyaya, Kaçakçılıkla Mücadele Kanunu ile ilgili diğer kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Gümrükçe Onaylanmış İşlem veya Kullanım">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-madde no="55" başlık="">
        <mvz-fıkra no="1">
          <template>Aksine hüküm bulunmadıkça; niteliğine, miktarına, menşeine, yükleme veya varış ülkesine bakılmaksızın, bir eşya, belirlenmiş şartlar altında her zaman gümrükçe onaylanmış işlem veya kullanımlardan birine tabi tutulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Cumhurbaşkanı; kamu ahlakı, kamu düzeni, kamu güvenliği, insan, hayvan ve bitki sağlık ve hayatlarının korunması, sanatsal, tarihi veya arkeolojik değeri olan ulusal hazinelerin korunması, fikri ve sınai mülkiyet haklarının korunması gerekçeleri ile eşyanın gümrükçe onaylanmış bir işlem veya kullanıma tabi tutulmasına yasaklama veya kısıtlamalar koyabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Türkiye ile ticaret, gümrük, taşımacılık anlaşması bulunmayan ve imzalanmış anlaşmaları süresinden önce tek taraflı olarak kısmen veya tamamen hükümsüz bırakan veya Türk kara, hava ve deniz taşıtlarına karşı yasaklama ve kısıtlamalar koyan veya bunlar hakkında farklı işlemler uygulayan yabancı ülkelere ait eşya ve taşıtlara, karşılık olmak üzere, yasaklama veya kısıtlamalar koymaya ve farklı işlemler veya farklı tarifeler uygulamaya Cumhurbaşkanı yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="56" başlık="">
        <mvz-fıkra no="1">
          <template>Gerek üzerlerinde, gerek iç ve dış ambalajlarında üretildiği ülkeden başka bir ülke ürünü olduğunu gösteren veya böyle bir izlenim uyandıran isim ya da simgeler taşıyan eşyanın Türkiye'ye ithaline izin verilmez. Bu gibi eşyanın Türkiye'den transit geçişine veya antrepo ve benzeri yerlere konulmasına ya da yeniden ihracına Müsteşarlıkça izin verilebilir.  Eşyanın bu fıkra kapsamında olup olmadığının belirlenmesinde tereddüt edilen durumlarda, Sanayi ve Ticaret Bakanlığının görüşü esas alınarak işlem yapılır. Söz konusu isim ve simgelerin kaldırılması veya eşyanın gerçek menşeinin gösterilmesi amacıyla, usul ve esasları yönetmelikle belirlenecek elleçleme faaliyetlerine izin verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türk menşeli eşyada kullanılmak üzere ve bunların başka ülke menşeli olduğunu gösterecek veya böyle bir izlenim uyandıracak nitelikte, üzerleri yabancı dille yazılı veya basılı her türlü boş zarf, şerit, etiket, damga ve benzeri eşya ile Türkiye'de düzenlenebilecek belgeleri başka ülkelerde düzenlenmiş gibi gösterebilecek nitelikte, üzerleri imzalı veya imzasız olsun, Türkiye'de yerleşik olmayan yabancı firmalara ait proforma faturalar hariç boş faturaların Türkiye'ye ithaline izin verilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Türkiye'de yerleşik firmalarla, lisans, royalti veya patent anlaşması yabancı firmaların bu tür eşyası bu hüküm dışındadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="57" başlık="">
        <mvz-fıkra no="1">
          <template></template>
          <mvz-bent no="a">
            <template>Fikri ve sınaî haklar mevzuatına göre korunması gereken haklar ile ilgili olarak hak sahibinin yetkilerine tecavüz eder mahiyetteki eşyanın alıkonulması veya gümrük işlemlerinin durdurulması hak sahibinin veya temsilcisinin talebi üzerine gümrük idareleri tarafından gerçekleştirilir. Durdurma veya alıkoyma kararı hak sahibi veya temsilcisi ile beyan sahibi veya 37 nci maddede belirtilen kişilere bildirilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Gümrük idaresine henüz bir talepte bulunulmadığı durumda ve söz konusu eşyanın fikri ve sınaî mülkiyet haklarını ihlal ettiğine dair açık deliller olması halinde, hak sahibinin geçerli bir başvuruda bulunabilmesini teminen, gümrük idareleri tarafından eşya üç işgünü süresince re’sen alıkonulabilir veya eşyanın gümrük işlemleri durdurulabilir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Fikri ve sınaî hakların ihlal edildiği gerekçesi ile gümrük idaresine yapılan başvurunun kabulü, söz konusu eşyanın gümrük idaresince gereğince muayene edilmeden bırakıldığı veya eşyanın alıkonulması için herhangi bir önlem alınmadığı gerekçesi ile hak sahibine tazminat hakkı doğurmaz. Fikri ve sınaî hakları ihlal eden eşya ile mücadele kapsamında, gümrük idaresince başvuru üzerine veya re’sen hareket edilmesi nedeniyle ilgili kişilerin zarara uğramasından gümrük idaresi ve yetkilileri sorumlu tutulamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gümrük idaresince alınan durdurma veya alıkoyma kararının hak sahibine tebliğinden itibaren çabuk bozulabilir eşya için üç iş günü, diğer eşya için on iş günü içinde hak sahibince ihtiyati tedbir kararı getirilmemesi halinde, eşya hakkında beyan sahibinin talepte bulunduğu gümrük rejimi hükümlerine göre işlem yapılır. Haklı bir mazeretin bulunması halinde, hak sahibinin talebi üzerine, gümrük idaresince on iş gününe kadar ek süre verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Gümrük idaresince gümrük işlemleri durdurulan veya alıkonulan eşya, yetkili mahkemece alınan karar doğrultusunda imha veya asli nitelikleri değiştirilerek tasfiye edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yolcuların kendi kullanımlarına mahsus kişisel eşya ile ticari mahiyette olmayan ve gümrük vergisi muafiyeti sınırları içinde kalan hediyelik eşya için bu madde hükümleri uygulanmaz. Aynı şekilde, fikri ve sınaî haklar mevzuatına göre korunması gereken haklar ile korunmuş ve hak sahibinin izni ile üretilmiş eşyanın; hak sahibinin rızası dışında bir gümrük işlemine tabi tutulması veya hak sahibinin onayladığından farklı şartlarda üretilmesi veya başka şartlarda bir marka taşıması halinde, söz konusu eşya bu madde hükümleri kapsamı dışında tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Gümrük idaresince gümrük işlemleri durdurulan veya alıkonulan eşyanın mahkemece fikri ve sınaî hakları ihlal ettiğinin tespitine gerek olmaksızın kolaylaştırılmış imha kapsamında gümrük kontrolü altında imhasına gümrük idaresi tarafından izin verilebilir. Kolaylaştırılmış imhaya ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Gümrük idaresince gümrük işlemleri durdurulan veya alıkonulan eşyanın hak sahibinin belirlediği tutarda teminatla iadesine ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Gümrük Rejimleri">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Eşyanın Bir Gümrük Rejimine Tabi Tutulması">
            <mvz-madde no="58" başlık="">
              <mvz-fıkra no="1">
                <template>Bir gümrük rejimine tabi tutulmak istenen eşya, bu rejime uygun şekilde yetkili gümrük idaresine beyan edilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İhracat, hariçte işleme, transit veya antrepo rejimi için beyan edilen serbest dolaşımda bulunan eşya, gümrüğe verilen beyannamenin tescilinden itibaren Türkiye Gümrük Bölgesinden çıkıncaya veya imha edilinceye ya da gümrük beyannamesi iptal edilinceye kadar gümrük gözetimi altında kalır.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="59" başlık="">
              <mvz-fıkra no="1">
                <template>Gümrük beyanı;</template>
                <mvz-bent no="a">
                  <template>Yazılı olarak,</template>
                </mvz-bent>
                <mvz-bent no="b">
                  <template>Bilgisayar veri işleme tekniği yoluyla,</template>
                </mvz-bent>
                <mvz-bent no="c">
                  <template>Sözlü olarak,</template>
                </mvz-bent>
                <mvz-bent no="d">
                  <template>Eşya sahibinin bu eşyayı bir gümrük rejimine tabi tutma isteğini ifade ettiği herhangi bir tasarruf yoluyla,</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>yapılabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2" durum="mülga">
                <template></template>
              </mvz-fıkra>
            </mvz-madde>
        <mvz-b1 no="A" başlık="Yazılı Beyanlar">
          <mvz-b2 no="I" başlık="Normal Usul">
            <mvz-madde no="60" başlık="">
              <mvz-fıkra no="1">
                <template>Yazılı beyan, 4 üncü fıkrada belirtilen beyanname ile yapılır. Bu beyannamenin eşyanın beyan edildiği gümrük rejimini düzenleyen hükümlerin uygulanması için gerekli bütün bilgileri ihtiva etmesi ve imzalanması gerekir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template></template>
                <mvz-bent no="a">
                  <template>Eşyanın beyan edildiği gümrük rejimini düzenleyen hükümlerin uygulanması için gerekli bütün belgeler beyannameye eklenir.</template>
                </mvz-bent>
                <mvz-bent no="b">
                  <template>Gümrük beyanı bilgisayar veri işleme tekniği yoluyla yapıldığında gümrük idaresi beyannameye eklenmesi gereken belgelerin beyanname ile birlikte ibrazını istemeyebilir. Bu durumda söz konusu belgeler gümrük idaresi istediğinde ibraz edilmek üzere beyan sahibince muhafaza edilir.</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kazıntılı ve silintili beyannameler gümrük idarelerince kabul edilmez. Ancak, beyannameler hatalı yazının üzeri okunacak şekilde çizilerek yanına doğrusu yazılıp beyan sahibi tarafından imzalanarak ve tescil sırasında resmi mühürle mühürlenerek düzeltilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Gümrük işlemleri, şekil ve içeriği yönetmelikle belirlenen beyanname ve diğer belgelerle yapılmak zorundadır. Bu belgelerin basımı ve dağıtımına ilişkin usul ve esaslar Müsteşarlıkça belirlenir. Bilgisayar ortamında hazırlanan söz konusu belgelerin kabulüne Müsteşarlık yetkilidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Aşağıda yazılı hallerde yetkili makamlardan gönderilecek resmi yazılar beyanname kabul edilerek eşyanın gümrük işlemleri, bu yazılara dayanılarak yürütülür.</template>
                <mvz-bent no="a">
                  <template>Cumhurbaşkanının zat ve ikametgâhına ait eşya hakkında Cumhurbaşkanlığından gönderilecek yazılar.</template>
                </mvz-bent>
                <mvz-bent no="b">
                  <template>Diplomatik muaflık ve ayrıcalıklardan yararlananların ancak kendi adlarına veya elçilik adına gelecek eşya için karşılıklı olmak şartıyla misyon şeflerinden veya muaflık hakkı tanınmış heyet başkanlarınca gönderilen yazılar ile şekli, kapsayacağı bilgiler ve göreceği işlemler Dışişleri Bakanlığı ve Müsteşarlıkça müştereken tespit olunan kurye çantalarına ait kurye mektupları.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="61" başlık="">
              <mvz-fıkra no="1">
                <template>60 ıncı maddede belirtilen şartlara uygun beyannameler, ait oldukları eşyanın gümrüğe sunulmuş olması halinde tescil edilir. Tescil işlemi, beyana ilişkin bilgilerin yerel alan ağı veya geniş alan ağı üzerinden gümrük bilgisayar sistemine girilerek sistem tarafından tescil tarihi ve sayısı verilmesini ya da beyanname veya beyanname hükmündeki belgenin üzerine mühür vurularak, sıra numarası ile tarih konulması ve bu beyannameye ait bilgilerin tescil defterine yazılmasını ifade eder.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aksine hüküm bulunmadıkça, eşyanın beyan edildiği gümrük rejimine ilişkin tüm hükümlerin uygulanmasında esas alınacak tarih, beyannamenin  tescil edildiği tarihtir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Tescil edilmiş beyanname, ait olduğu eşyanın vergileri ve para cezalarından dolayı taahhüt niteliğinde beyan sahibini bağlar ve gümrük vergileri tahakkukuna esas tutulur.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="62" başlık="">
              <mvz-fıkra no="1">
                <template>5 inci madde hükümleri saklı kalmak üzere; gümrük beyannamesi, ilgili eşyayı ve eşyanın beyan edildiği gümrük rejimine ilişkin hükümlerin uygulanması için gerekli belgeleri yetkili gümrük idarelerine verme yetkisine sahip olan veya verilmesini sağlayabilen kişiler tarafından verilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ancak, bir beyannamenin tescilinin belirli bir kişi için özel yükümlülükler getirmesi halinde, bu beyanın söz konusu kişi tarafından ya da bu kişi hesabına yapılması ve beyan sahibinin Türkiye Gümrük Bölgesinde yerleşik olması gerekir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Bununla birlikte, yerleşik olma koşulu, transit ya da geçici ithalat beyanında bulunan veya gümrük idarelerinin uygun bulması koşuluyla arızi olarak beyanda bulunan kişilere uygulanmaz.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="63" başlık="">
              <mvz-fıkra no="1">
                <template>Başka bir eşyanın beyanı sonucunu doğurmaması kaydıyla, beyan sahibinin talebi üzerine beyannamede yer alan bir veya daha fazla bilginin düzeltilmesine, gümrük idarelerince izin verilir. Ancak;</template>
                <mvz-bent no="a">
                  <template>Beyan sahibine eşyanın muayene edileceğinin bildirilmesinden,</template>
                </mvz-bent>
                <mvz-bent no="b">
                  <template>Söz konusu bilgilerin yanlış olduğunun tespit edilmesinden,</template>
                </mvz-bent>
                <mvz-bent no="c">
                  <template>73 üncü madde hükümleri saklı kalmak üzere, eşyanın teslim edilmesinden,</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>sonra beyannamede düzeltme yapılmasına izin verilmez.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="64" başlık="">
              <mvz-fıkra no="1">
                <template>Gümrük idareleri, beyan sahibinin talebi üzerine ve eşyanın yanlışlıkla beyanname konusu gümrük rejimine tabi tutulmasına veya beyan edildiği rejime tabi tutulmasının özel nedenlerle artık mümkün olmadığına ilişkin kanıtlayıcı belgeleri ibraz etmesi halinde, tescil edilmiş bir beyannameyi iptal ederek, gerektiğinde yeni bir rejim beyanında bulunulmasına izin verebilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Ancak, gümrük idarelerince beyan sahibine eşyanın muayene edileceğinin bildirilmiş olduğu hallerde, muayenenin sonucu alınmadan beyannamenin iptaline ilişkin talep kabul edilmez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hiçbir şekilde kullanılamaz hale gelmiş eşyanın, talep halinde imhasına veya Gümrük Bölgesi dışına çıkarılmasına izin verilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Beyannamenin tescilinden sonra eşyanın niteliklerinde meydana gelen değişiklikler veya bozulmalar nedeniyle ithalat vergilerinden indirim yapılmaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Ancak;</template>
                <mvz-bent no="a">
                  <template>Özellikle ilk madde olarak kullanılması mümkün hale gelen eşyanın ilk madde olarak beyan edilmesine gümrük idarelerince izin verilir. Gerekli görülmesi halinde, gümrük idareleri bu eşyanın ilk madde şeklinden başka bir şekilde kullanılmasını önleyici tedbirleri alır.</template>
                </mvz-bent>
                <mvz-bent no="b">
                  <template>Kısmen hasara uğrayan eşyanın ayrılması mümkün ise hasara uğramış kısmı için (a) bendi hükümlerine göre işlem yapılır. Eşyanın hasarlı ve hasarsız şekilde ayrılmasının mümkün olmadığı hallerde beyan sahibinin talebi doğrultusunda (a) bendi hükmü uygulanabileceği gibi, bu eşyanın Gümrük Bölgesi dışına çıkarılmasına veya imhasına da izin verilir.</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Yönetmelikle belirlenen haller dışında, eşyanın tesliminden sonra beyannameler iptal edilemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Beyannamenin iptali, yürürlükteki cezai hükümlerin uygulanmasına engel oluşturmaz.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="65" başlık="">
              <mvz-fıkra no="1">
                <template>Gümrük idareleri, beyanın doğruluğunu araştırmak üzere;</template>
                <mvz-bent no="a">
                  <template>Beyanname ile ilgili ve beyannameye ekli belgeleri kontrol edebilir ve beyannamenin içerdiği bilgilerin doğruluğunu araştırmak amacı ile beyan sahibinden diğer belgeleri de vermesini isteyebilir,</template>
                </mvz-bent>
                <mvz-bent no="b">
                  <template>Eşyayı muayene edebilir ve ayrıntılı muayene veya tahlil amacıyla numune alabilirler.</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Beyanname kapsamı eşyanın muayene edilmesi halinde, muayene sonuçları, muayene edilmemesi halinde ise beyannamede yer alan bilgiler, eşyanın tabi olduğu gümrük rejimi hükümlerinin uygulanmasında esas alınır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kontrol amacıyla gümrük müfettişleri, gümrük müfettiş yardımcıları, kontrolörler, stajyer kontrolörler ve gümrük idare amirleri muayenesi yapılmış ve işlemleri tamamlanmış eşyanın ikinci muayenesini her zaman yapabilirler. Keza, sözü edilenler gümrük işlemlerini her aşamada denetlemeye yetkilidirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Beyannameyi kontrol edenler ile muayeneyi ve ikinci muayeneyi yapanlar, yaptıkları kontrolden veya muayeneden, gümrük vergilerinin hesaplanmasından ya da muafiyet hükümlerinin uygulanmasından, duruma göre tek başlarına veya müteselsilen sorumludurlar.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="66" başlık="">
              <mvz-fıkra no="1">
                <template>Eşyanın muayenesi, bunların gümrük idarelerince konulmasına izin verilen yerlerde veya antrepolarda yapılır. Bu yerler dışında da eşya muayenesi yapılmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Kurye çantalarının gümrük işlemleri, Milli Savunma ve Dışişleri Bakanlıkları ile Gümrük Müsteşarlığı tarafından müştereken belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eşyanın muayene edileceği ve numunelerin alınacağı yerlere taşınması ile bu muayene ve numune alma işlemleri için gerekli tüm elleçleme ile numunelerin ambalajlanmasına ve gönderilmesine ilişkin giderleri beyan sahibi tarafından karşılanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Beyan sahibi eşyanın muayenesi ve numune alınması sırasında hazır bulunabilir. Gümrük idareleri, uygun gördükleri takdirde muayene ve numume alma işlemini kolaylaştırmak için gerekli yardımı sağlamak üzere, beyan sahibinin söz konusu muayenede veya numune alımında hazır bulunmasını veya temsil edilmesini zorunlu tutabilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Numunelerin yürürlükteki hükümlere uygun olarak alınması şartıyla, gümrük idareleri, numuneler karşılığında herhangi bir tazminat ödemekle yükümlü değildir. Gümrük idareleri tarafından gümrük laboratuvarlarında yapılacak veya hariçte yaptırılacak tahlil veya inceleme masrafı beyan sahibi tarafından karşılanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Tahlilden arta kalan numuneler, tahlil sonuçlarının ilgilisine bildirilmesinden sonra bir ay içinde alınmadığı takdirde gümrüğe terk edilmiş sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Laboratuvar tahlillerine ve ilgili kuruluşların görüşü alınmak suretiyle gümrük laboratuvarları ücret tarifesinin saptanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="67" başlık="">
              <mvz-fıkra no="1">
                <template>Bir beyanname kapsamı eşyanın tek kalemden oluşması ve kısmen muayene edilmesi halinde, muayene sonuçları söz konusu beyanname kapsamı eşyanın tümüne uygulanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Bununla birlikte, beyan sahibi, kısmi muayene sonuçlarının beyan edilen eşyanın kalan kısmı için geçerli olmadığı düşüncesinde ise eşyanın tamamının muayenesini talep edebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bir beyannamenin iki veya daha fazla kalemi kapsaması halinde, her kaleme ilişkin bilgiler ayrı bir beyan sayılır. Bir kalemin eksik veya fazlası diğer kalemin fazla veya eksiğine mahsup edilemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Türk Gümrük Tarife Cetvelinde aynı tarife pozisyonunun alt açılımında bulunan ve aynı kanuni veya tercihli vergi oranına tabi olan eşya bir kalem sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="68" başlık="">
              <mvz-fıkra no="1">
                <template>Gümrük idareleri, eşyanın beyan edildiği gümrük rejimi şartlarına uyulmasını sağlamak üzere zorunlu olan hallerde, eşyanın ayniyetini tespite yönelik önlemleri alırlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eşyaya veya taşıtlara ayniyet tespitine yönelik olarak tatbik edilen etiket, mühür ve benzeri araçlar, beklenmeyen hal veya mücbir sebep nedeniyle, eşyanın veya taşıtların korunmasını sağlamak için sökülmeleri veya imhaları zorunlu olmadıkça, yalnız gümrük idareleri tarafından veya bu idarelerin izni ile sökülebilir ya da imha edilebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="69" başlık="">
              <mvz-fıkra no="1">
                <template>Eşyanın ilgili rejime tabi tutulma şartlarının yerine getirilmesi ve eşyanın yasaklayıcı veya kısıtlayıcı önlemlere tabi olmaması kaydıyla, gümrük idareleri, tescilden sonra beyannamedeki bilgileri kontrol ederek veya belli hallerde kontrol etmeksizin, eşyayı teslim ederler. Ancak, beyannamenin incelenmesinin makul bir süre içinde tamamlanamadığı ve bu inceleme sırasında eşyanın hazır bulundurulmasına gerek olmadığı hallerde de eşya teslim edilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Yasaklama veya kısıtlamaya tabi olması nedeniyle teslimine imkan bulunmayan eşyanın tabi olacağı işlemlere ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aynı beyanname kapsamı eşyanın tümünün aynı anda teslimi esastır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Bu fıkranın uygulamasında, bir beyannamenin iki veya daha fazla kalemi kapsaması halinde, her kaleme ilişkin bilgiler ayrı bir beyanname konusu eşya gibi değerlendirilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Beyannamenin tescilinin bir gümrük yükümlülüğü doğurması halinde, gümrük vergileri ödenmedikçe veya teminata bağlanmadıkça beyanname kapsamı eşya teslim edilemez. Ancak, bu hüküm kısmi muafiyete tabi geçici ithalat rejimine uygulanamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Beyan edilen gümrük rejimi hükümlerine göre teminat istenmesi halinde, söz konusu teminat alınmadan eşya teslim edilemez.</template>
              </mvz-fıkra>
            </mvz-madde>
            <mvz-madde no="70" başlık="">
              <mvz-fıkra no="1">
                <template>Beyan sahibinden kaynaklanan sebeplerle 46 ncı maddede belirtilen süreler içerisinde, tescil edilmiş beyanname kapsamı eşyanın;</template>
                <mvz-bent no="a">
                  <template>Muayenesine başlanamaması veya devam edilememesi,</template>
                </mvz-bent>
                <mvz-bent no="b">
                  <template>Beyan edildiği gümrük rejimine tabi tutulması için verilmesi gereken belgelerin verilmemiş olması,</template>
                </mvz-bent>
                <mvz-bent no="c">
                  <template>Ödenmesi veya teminat altına alınması gereken ithalat veya ihracat vergilerinin ödenmemesi veya teminatın verilmemesi,</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Hallerinde, eşya muayene edilir. Muayene sonucunda gümrük idarelerince alınacak para cezasını veya diğer takipleri gerektiren veya gerektirmeyen durumlar bir tutanağa bağlanır ve daha sonra eşya 177 ile 180 inci madde hükümlerine göre tasfiye edilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Gümrük antrepolarında bulunan eşya için, gümrükçe onaylanmış bir işlem veya kullanım tayin edilmesine ilişkin beyanneme verilmesi halinde, gümrük işlemlerinin beyannamenin tescil tarihinden itibaren otuz gün içinde bitirilmesi gerekir. Bu süre içinde işlemleri bitirilemeyen eşya ile ilgili olarak 1 inci fıkra hükümleri uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Basitleştirilmiş Usul">
            <mvz-madde no="71" başlık="">
              <mvz-fıkra no="1">
                <template>Gümrük idareleri, usul ve formalitelerin mümkün olduğunca basitleştirilmesi için ve gümrük işlemlerinin yürürlükteki hükümlere uygun olarak yürütülmesini sağlayacak şekilde yönetmelikle belirlenen şartlar altında;</template>
                <mvz-bent no="a">
                  <template>60 ıncı maddede sözü edilen beyannameye eklenmesi gereken belgelerden bazılarının eklenmemesine veya kaydedilmesi gereken bazı bilgilerin beyannameye yazılmamasına,</template>
                </mvz-bent>
                <mvz-bent no="b">
                  <template>Sözü edilen beyanname yerine, eşyanın ilgili gümrük rejimine tabi tutulması talebi ile birlikte ticari veya idari bir belgenin verilmesine,</template>
                </mvz-bent>
                <mvz-bent no="c">
                  <template>Eşyanın ilgili rejime geçişinin kayıt yoluyla yapılmasına,</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>izin verebilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>(c) bendinin uygulanmasında beyan sahibi eşyayı gümrüğe sunma yükümlülüğünden muaf tutulabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="0">
                <template>Basitleştirilmiş usulle beyan, ticari veya idari belge yahut kayıt, eşyanın teşhisi için gerekli bilgileri kapsamak zorundadır. Kayıt yoluyla işlem yapılan hallerde kayıt tarihinin yazılması şarttır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Beyan sahibi genel, dönemsel veya özet niteliğinde bir tamamlayıcı beyanda bulunur. Tamamlayıcı beyanın aranmayacağı haller yönetmelikle belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Tamamlayıcı beyanlar ile 1 inci fıkranın (a), (b) ve (c) bentlerinde sözü edilen beyanlar, ayrılmaz bir bütündür ve basitleştirilmişişleme ilişkin beyannamelerin tescil tarihinden itibaren hüküm ifade ederler. 1 inci fıkranın (c) bendinde belirtilen hallerde kayıt işlemi, 60 ıncı maddede sözü edilen bebeyannamenin tescili ile aynı hukuki sonucu doğurur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Diğer Beyanlar">
          <mvz-madde no="72" başlık="">
            <mvz-fıkra no="1">
              <template>59 uncu maddenin birinci fıkrasının (b), (c) ve (d) bentlerinde belirtilen şekilde yapılan beyanlara ilişkin usuller 60 ila 71 inci madde hükümleri çerçevesinde yönetmelikle belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Eşyanın Tesliminden Sonra Beyanın Kontrolü">
          <mvz-madde no="73" başlık="">
            <mvz-fıkra no="1">
              <template>Gümrük idareleri, eşyanın tesliminden sonra ve beyannamedeki bilgilerin doğruluğunu saptamak amacıyla, eşyanın ithal veya ihraç işlemlerini veya sonraki ticari işlemlere ilişkin ticari belge ve verileri kontrol edebelirler. Bu kontroller beyan sahibine, söz konusu işlemler ile doğrudan ya da dolaylı olarak ticari yönden ilgili diğer kişilere veya belge ve verileri ticari amaçla elinde bulunduran diğer kişilere ait yerlerde yapılabilir. Mümkün olduğu takdirde eşya muayene de edilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Gümrük idareleri, kendi yetkileri doğrultusunda veya beyan sahibinin talebi üzerine, yönetmelikle belirlenen usul ve esaslar çerçevesinde, beyannamenin düzeltilmesini eşyanın tesliminden sonra da yapabilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Beyannamenin incelenmesi veya eşyanın tesliminden sonraki kontrolü sonucunda, ilgili gümrük rejimine ilişkin hükümlerin yanlış veya eksik bilgilere dayanarak uygulandığının saptanması halinde, gümrük idareleri, bu Kanunda yer alan ceza hükümleri saklı kalmak üzere, beyanı yeni bulgulara göre düzeltmek için gerekli işlemleri yaparlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Serbest Dolaşıma Giriş Rejimi">
        <mvz-madde no="74" başlık="">
          <mvz-fıkra no="1">
            <template>Türkiye Gümrük Bölgesine gelen eşyanın serbest dolaşıma girişi; ticaret politikası önlemlerinin uygulanması, eşyanın ithali için öngörülen diğer işlemlerin tamamlanması ve kanunen ödenmesi gereken vergilerin tahsili ile mümkündür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eşyanın Türkiye Gümrük Bölgesine getirilmeden serbest dolaşıma girişine ilişkin usul ve esasları belirlemeye Cumhurbaşkanı yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="75" başlık="">
          <mvz-fıkra no="1">
            <template>Beyan sahibi, tarımsal mali yükler dışında kalan ithalat vergilerinin oranlarının serbest dolaşıma giriş beyannamesinin tescil tarihinden sonra, fakat eşyaya ilişkin gümrük vergilerinin ödenmesinden veya teminata bağlanmasından önce indirilmesi halinde, lehine olan oranın uygulanmasını isteyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Beyan sahibinden kaynaklanan nedenlerle gümrük işlemlerinin tamamlanamaması halinde, 1 inci fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="76" başlık="">
          <mvz-fıkra no="1">
            <template>Bir taşıma belgesi içeriği eşyanın değişik tarife pozisyonlarına girdiği hallerde; her bir eşya için kendi tarife pozisyonuna göre işlem yapılmasının ek bir iş yükü ve masrafa sebep olması halinde, beyan sahibinin talebi üzerine, gümrük idareleri, eşyanın tamamına en yüksek ithalat vergi oranına tabi eşyanın tarife pozisyonuna göre vergi uygulayabilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="77" başlık="">
          <mvz-fıkra no="1">
            <template>Nihai kullanım nedeniyle indirimli veya sıfır vergi oranından yararlanarak serbest dolaşıma girmiş eşyanın gümrük gözetimi, nihai kullanım olarak kabul edilen üretim veya kullanım faaliyetiyle sona erer. Ayrıca, indirimli veya sıfır vergi uygulamasına ilişkin koşulların sona erdiği, eşyanın ihraç veya imha edildiği, eşyanın indirimli veya sıfır vergi uygulaması için belirlenmiş amaçlar dışında kullanılması nedeniyle tahsili gereken vergilerin ödendiği hallerde de gümrük gözetimi sona erer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Nihai kullanım nedeniyle serbest dolaşıma giren eşyaya, duruma göre 81 inci maddenin 2 nci fıkrası veya 83 üncü madde hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="78" başlık="">
          <mvz-fıkra no="1">
            <template>Serbest dolaşımda bulunan eşya, aşağıda belirtilen hallerde bu statüsünü kaybeder:</template>
            <mvz-bent no="a">
              <template>Serbest dolaşıma giriş beyannamesinin iptal edilmesi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Geri ödeme sisteminin uygulandığı dahilde işleme rejimi çerçevesinde işledikten sonra ihraç edilen eşyaya ilişkin gümrük vergilerinin geri verilmesi veya kaldırılması,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>213 üncü madde hükmü uyarınca, eşyanın kusurlu veya satış sözleşmesi hükümlerine uygun olmaması nedeniyle, gümrük vergilerinin geri verilmesi veya kaldırılması,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>214 üncü madde hükmü uyarınca, eşyanın ihracına, geri gönderilmesine veya gümrükçe onaylanmış başka bir işlem veya kullanıma tabi tutulması nedeniyle gümrük vergilerinin geri verilmesi veya kaldırılması.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Şartlı Muafiyet Düzenlemeleri ve Ekonomik Etkili Gümrük Rejimleri">
        <mvz-b1 no="A" başlık="Ortak Hükümler">
          <mvz-madde no="79" başlık="">
            <mvz-fıkra no="1">
              <template>Bu Kanunun 80 ila 83 üncü maddelerinde geçen;</template>
              <mvz-bent no="a">
                <template>Şartlı muafiyet düzenlemesi deyimi, serbest dolaşımda olmayan eşyaya,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Transit,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Antrepo,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Şartlı muafiyet sistemi kapsamında dahilde işleme,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Gümrük kontrolü altında işleme,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Geçici ithalat;</template>
              </mvz-bent>
              <mvz-bent no="b">
                <template>"Ekonomik etkili gümrük rejimi" deyimi,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Antrepo,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Dahilde işleme,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Gümrük kontrolü altında işleme,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Geçici ithalat,</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> - Hariçte işleme;</template>
              </mvz-bent>
              <mvz-bent no="0">
                <template> rejimlerinin uygulanması anlamına gelir.</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>"İthal eşyası" deyimi, şartlı muafiyet düzenlemelerine tabi tutulan eşya ile geri ödeme sisteminin uygulandığı dahilde işleme rejiminde, 118 inci maddede belirtilen işlemlere tabi tutularak serbest dolaşıma giren eşya anlamına gelir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>"Değişmemiş eşya" deyimi, dahilde işleme veya gümrük kontrolü altında işleme rejimleri çerçevesinde hiçbir şekilde işçilik görmemiş ithal eşyası anlamına gelir.</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="80" başlık="">
            <mvz-fıkra no="1">
              <template>Dahilde işleme ve hariçte işleme rejimleriyle ilgili usul ve esaslar Cumhurbaşkanınca belirlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yararlanılacak rejime ilişkin özel hükümler saklı kalmak üzere, ekonomik etkili rejimlerin kullanımına ilişkin izinler ile 95 inci maddenin 1 inci fıkrasında belirtilen antrepo işletme izni;</template>
              <mvz-bent no="a">
                <template>İşlemlerin usulüne uygun olarak yürütülmesi için gerekli taahhütnamelerin ve teminatların verilmesi,</template>
              </mvz-bent>

          <mvz-madde no="97" başlık="">
            <mvz-fıkra no="1">
              <template>Bir genel antrepo işletilmesi için izin verildiğinde, antrepo veya eşyanın özelliklerine göre 96 ncı maddenin bir istisnası olarak, aynı maddenin (a) ve (b) bentlerinde belirtilen yükümlülüklerin münhasıran kullanıcıya ait olduğu, işletme izninde belirtilebilir.</template>

            <mvz-fıkra no="2">

          </mvz-madde>
          <mvz-madde no="98" başlık="">
            <mvz-fıkra no="1">
              <template>81 inci maddenin 2 nci fıkrası hükmü saklı kalmak kaydıyla, gümrük idareleri, antrepo işleticisinden 96 ncı maddede belirtilen sorumluluklarla ilgili olarak yönetmelikle belirlenen esaslar çerçevesinde bir teminat ister.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ancak, fuar ve sergilere konulan veya ithalat vergilerinden muaf olan yahut ihraç edilmek üzere antrepolara konulan eşya için teminat aranmaz.</template>

          <mvz-madde no="100" başlık="">

          <mvz-madde no="101" başlık="">
            <mvz-fıkra no="1">
              <template>Eşyanın antrepo rejimi altında kalış süresi sınırsızdır. Ancak, gümrük idarelerince gerek görülen hallerde, eşyaya gümrükçe onaylanmış yeni bir işlem veya kullanım tayin edilmesi için bir süre belirlenebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">

          </mvz-madde>
          <mvz-madde no="102" başlık="">
            <mvz-fıkra no="1">

            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>Piyasa düzeninin aksamadan işleyişini sağlamak amacıyla tarım ürünlerinin antrepolarda tabi tutulacağı elleçleme işlemleri Müsteşarlıkça sınırlandırılabilir.</template>

            <mvz-fıkra no="2">

            </mvz-fıkra>
            <mvz-fıkra no="3">

          <mvz-madde no="103" başlık="">
            <mvz-fıkra no="1">

            <mvz-fıkra no="0">

            <mvz-fıkra no="2">

          <mvz-madde no="104" başlık="">
            <mvz-fıkra no="1">
              <template>İthal eşyası için bir gümrük yükümlülüğü doğduğunda, eşyanın antrepo masrafları ile antrepoda kaldığı sürece muhafazası için yapılan masraflar, fiilen ödenen veya ödenecek fiyattan ayrı olarak gösterilmeleri şartıyla gümrük kıymetine dahil edilmez.</template>

            <mvz-fıkra no="2">
              <template>Söz konusu eşyanın 102 nci madde çerçevesinde elleçleme işlemlerine tabi tutulması halinde, eşyanın ithalat vergileri tutarının belirlenmesinde dikkate alınacak niteliği, gümrük kıymeti ve miktarı, beyan sahibinin talebi üzerine, 193 üncü maddede belirtilen tarihte, eşya söz konusu elleçleme işlemlerine tabi tutulmamış gibi tespit edilir. Ancak, bu hükümlere Müsteşarlıkça istisnalar getirilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Gümrük antrepo rejimine tabi tutulmuş ithal eşyasının 71 inci maddenin 1 inci fıkrasının (c) bendi hükmüne göre, gümrüğe sunulmaksızın ve beyannamesi verilmeden önce serbest dolaşıma girmek üzere teslim edildiği hallerde, gümrük vergileri, eşyanın antrepo rejimine tabi tutulduğu tarihte yürürlükte bulunan vergi oranları ve diğer vergilendirme unsurlarına dayanarak hesaplanır. Bu hükmün uygulanması, eşyanın nitelik, gümrük kıymeti ve miktarı gibi vergilendirme unsurlarının, eşyanın antrepo rejimine tabi tutulduğu tarihte tespit edilmesi şartına bağlıdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>Ancak, yükümlünün serbest dolaşıma giriş beyannamesinin tescil tarihinde eşyanın bulunduğu hal ve niteliği ile diğer vergilendirme unsurlarına göre işlem yapılması yönünde talepte bulunması halinde, bu yönde işlem yapılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="0">

          <mvz-madde no="105" başlık="">
            <mvz-fıkra no="1">
              <template>Genel ve özel antrepo işleticileri yıl sonunda antrepo mevcutlarına ilişkin bir listeyi gümrük idaresine verir. Her yıl, genel ve özel antrepolardaki eşya gümrük idaresince, işletici tarafından verilen liste gözönünde bulundurulmak suretiyle sayılır. Genel antrepolardaki eşyanın kısa sürede sayılamayacak kadar çok olması halinde, bunların gümrük idareleri tarafından örnekleme yöntemiyle sayılması mümkündür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">

            <mvz-fıkra no="3">
              <template>Yapılan sayım sonucunda fazla çıkan eşya kayıtlara alınır. Bu fazlalığın geçerli nedenlerden ileri geldiğine gümrük idaresince kanaat getirilmediği takdirde, söz konusu eşya 177 ila 180 inci madde hükümlerine göre tasfiyeye tabi tutulur.</template>

          <mvz-madde no="106" başlık="">
            <mvz-fıkra no="1">

            <mvz-fıkra no="2">

            </mvz-fıkra>
            <mvz-fıkra no="0">

              <mvz-fıkra no="2">

              <mvz-fıkra no="6">

              <mvz-fıkra no="8">

              <mvz-fıkra no="1">
                <template>İşlem görmüş ürünlerin eşdeğer eşyadan elde edilmesine veya eşdeğer eşyadan elde edilen işlem görmüş ürünlerin ithal eşyasının serbest dolaşıma girmesinden önce Türkiye Gümrük Bölgesi dışına ihraç edilmesine izin verilebilir. Eşdeğer eşya kullanımına kolaylaştırma, yasaklama veya kısıtlama getirebilir.</template>

              <mvz-fıkra no="4">

              <mvz-fıkra no="1">

              <mvz-fıkra no="2">

                <mvz-bent no="c">

              <mvz-fıkra no="0">

              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Süre, serbest dolaşımda bulunmayan eşya için dahilde işleme rejimine ilişkin iznin alındığı tarihten itibaren işlemeye başlar ve bitimin rastladığı ayın son günü sona erer.  İzin sahibi tarafından ileri sürülen haklı gerekçelere bağlı olarak ek süre verilebilir.Bu süre ve ek süreler, Cumhurbaşkanı Kararıyla belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>İthal eşyasının ithalindenönce eşdeğer eşyadan elde edilen işlem görmüş ürünlerin ihracı halinde, ithal eşyasının rejim beyanı için gereken süre Cumhurbaşkanınca belirlenir. Bu süre, ilgili eşdeğer eşyadan elde edilen işlem görmüş ürünler için ihracat beyannamesinin tescil tarihinden itibaren işlemeye başlar.</template>

    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Gümrükçe Onaylanmış Diğer İşlem veya Kullanım Şekilleri">

            <mvz-fıkra no="0">

    <mvz-bölüm no="2-İKİNCİ" başlık="Geri Gelen Eşya">
      <mvz-madde no="168" başlık="">
        <mvz-fıkra no="1">
          <template>Serbest dolaşımda bulunan eşya, Türkiye Gümrük Bölgesinden veya Türkiye’nin anlaşmalarla dâhil olduğu gümrük birliği gümrük bölgelerinin diğer bir noktasından ihraç edildikten sonra üç yıl içinde yeniden serbest dolaşıma girmesi halinde ve beyan sahibinin talebi üzerine, ithalat vergilerinden muaf tutulur. Üç yıllık süre, beklenmeyen haller veya mücbir sebeplerle uzatılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Geri gelen eşyanın, Türkiye Gümrük Bölgesinden veya Türkiye’nin anlaşmalarla dâhil olduğu gümrük birliği gümrük bölgelerinin diğer bir noktasından ihraç edilmeden önce, özel amaçlı kullanımı nedeniyle indirimli veya sıfır vergi oranından yararlanarak serbest dolaşıma girmiş olduğu hallerde, eşyanın aynı amaca yönelik olarak tekrar serbest dolaşıma sokulmak istenmesi durumunda, bu eşyaya indirimli veya sıfır vergi oranı uygulanır. İthal amacının aynı olmaması halinde, söz konusu eşyaya uygulanacak ithalat vergileri tutarı, serbest dolaşıma ilk girişi sırasında alınmış tutar kadar indirilir. Ancak, serbest dolaşıma ilk girişi sırasında alınmış tutarın geri gelen eşyanın yeniden serbest dolaşıma girişi sırasında alınacak tutardan daha fazla olması halinde hiçbir iade yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>1 inci fıkrada belirtilen ithalat vergilerinden muafiyet;</template>
          <mvz-bent no="a">
            <template>Aynen ihraç edildiği durumda olması hali hariç, hariçte işleme rejimi çerçevesinde Türkiye Gümrük Bölgesinden veya Türkiye’nin anlaşmalarla dâhil olduğu gümrük birliği gümrük bölgelerinin diğer bir noktasından ihraç edilen eşyaya,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İhracı, bir dış ticaret önlemine konu olan eşyaya,</template>

        <mvz-fıkra no="0">
          <template>tanınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>(b) bendine istisna getirilmesine ilişkin hal ve şartlar Cumhurbaşkanınca belirlenir.</template>
        </mvz-fıkra>

      <mvz-madde no="169" başlık="">

        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="170" başlık="">

        <mvz-fıkra no="2">

        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>İthali yasak veya kısıtlamaya tabi olması nedeniyle 178 inci maddenin (b) bendine göre yeniden ihraç amaçlı satış suretiyle tasfiyesi yapılacak eşyanın, ihale ilanının yayımlandığı veya perakende satış kararının alındığı tarihe kadar gümrük idaresine başvurularak gümrük bölgesi dışına yeniden ihracı istenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template> Ancak, yukarıdaki taleplerin kabulü, söz konusu eşyaya ait varsa cezalar ile ambarlama ve elleçleme giderleri ve diğer giderler ile eşyanın döviz cinsinden CIF değerinin %1’i, bu uygulamadan ikinci kez yararlanmak istenmesi hâlinde ise CIF değerinin %3’ü oranında bir tutarın ödenmesine bağlıdır. Başvurunun, eşyanın ihale ilanı yayımlandıktan veya perakende satış kararı alındıktan sonra ve satışının gerçekleşmesinden önce yapılması hâlinde bu taleplerin kabulü söz konusu eşyaya ait varsa cezalar ile ambarlama ve elleçleme giderleri ve diğer giderler ile eşyanın döviz cinsinden CIF değerinin %10’u oranında bir tutarın ödenmesine bağlıdır. Bunun dışındaki başvurular kabul edilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>177 nci maddenin birinci fıkrasının (c), (d), (ı), (l) ve (m) bentleri ile ikinci fıkrasının (a) bendinde belirtilen eşya için birinci fıkra hükmü uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="180" başlık="">
        <mvz-fıkra no="1">
          <template>177 nci maddenin birinci fıkrasının (b), (e), (f), (g) ve (k) bentlerinde ve ikinci fıkrasının (b) bendinde belirtilen eşyanın satış bedelinden sırasıyla;</template>

            <template>Hizmet karşılığı alacaklar ve yapılmış masraflar,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Gümrük vergileri,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Satış için yapılmış masraflar,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Para cezaları,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>ayrılarak hak sahiplerine dağıtılır. Bu bedellerin dağıtımından sonra artan para olursa, eşya sahipleri adına emanet hesabına alınır. Emanete alındığı tarihten itibaren bir yıl içinde alınmayan para ile 177 nci maddenin birinci fıkrasının diğer bentlerinde belirtilen eşyanın satış bedelinden bu fıkradaki usule göre yapılacak dağıtımdan sonra kalan para Gümrük ve Ticaret Bakanlığı döner sermaye işletmesine irat kaydedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>177 nci maddenin ikinci fıkrasında belirtilen ve satış suretiyle tasfiye edilen eşya ve taşıtların satış bedelleri, Kaçakçılıkla Mücadele Kanununun 10 uncu maddesinin ikinci fıkrasında belirtilen taşıtlar için taşıtın muhafazası ve satışı için gerekli olan bütün giderler düşüldükten sonra, aynı Kanunun 16 ncı maddesindeki eşya ve taşıtlarda ise tamamı sahipleri adına emanet hesabına alınır. Bu tutarlar, eşya ile ilgili dava sonucunda iade kararı verilmesi halinde sahibine ödenir.  Eşyanın sahibine iade edilmesine karar verilmesi halinde tasfiye edilen eşyanın gümrük vergileri iade edilmez, müsadere kararı verilmesi halinde satış bedeli Gümrük ve Ticaret Bakanlığı döner sermaye işletmesine irat kaydedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tasfiye edilen eşya ve taşıtın satış bedelinden alınacak gümrük vergileri, eşya için gümrük beyannamesi verilmiş ise beyannamenin tescil edildiği tarihte, kaçak eşya için kaçak eşya tespit tutanağının düzenlendiği tarihte, söz konusu tarihler bilinmiyorsa tespit ve tahakkuk belgesinin düzenlendiği tarihteki vergi oranlarına göre belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Üzerlerinde satılamaz, devredilemez, haciz, rehin, ipotek gibi şerhler bulunan taşıtların tasfiyesinde, bu şerhler ayrıca bir işleme gerek olmaksızın, tasfiye kararı alındığı tarihten itibaren kalkmış sayılarak varsa tescil kayıtları buna göre düzeltilir ve tasfiyesi tamamlanarak birinci ve ikinci fıkra hükümleri çerçevesinde kalan para emanete alınır. Dava sonucunda taşıtın sahibine iadesine karar verilmesi halinde, şerhlere konu bedel ilgilisine ödendikten sonra kalan tutar ikinci fıkra hükmü uyarınca sahibine ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu Kanun kapsamında yapılacak tasfiye işlemlerinde 8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanunu hükümleri uygulanmaz ve buna ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu madde kapsamında emanete alınan tutarların iadesi için, sahibine iadesine ilişkin mahkeme kararının kesinleştiği, diğerlerinde ise emanete alındığı tarihten itibaren bir yıl içinde yapılan başvurular kabul edilir.</template>
        </mvz-fıkra>
      </mvz-madde>

  <mvz-kısım no="9-DOKUZUNCU" başlık="Gümrük Yükümlülüğü">

            <template>İthalat vergilerine tabi eşyanın serbest dolaşıma girişi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İthalat vergilerine tabi eşyanın ithalat vergilerinden kısmi muafiyet suretiyle geçici ithali,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>için verilecek gümrük beyannamesinin tescil tarihinde başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İthalatta gümrük yükümlülüğünde yükümlü, beyan sahibidir. Dolaylı temsil durumunda, hesabına gümrük beyanında bulunulan kişi de yükümlüdür. Dolaylı temsilde, temsilcinin yükümlülüğü, beyanda kullanılan verilerin yanlış olduğunu bildiği veya mesleği icabı ve mutat olarak bilmesi gerektiği durumlarla sınırlıdır. 188 inci, 190 ıncı ve 194 üncü maddeler uyarınca doğan gümrük yükümlülüğü için de bu hüküm uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci fıkrada belirtilen rejimlerden biri için bulunulan beyanda kullanılan veriler, kanunen alınması gereken vergilerin tamamen veya kısmen tahsil edilememesine sebep olduğu takdirde, beyanın yapılabilmesi için bu verileri veren ve bu verilerin yanlış olduğunu bilen veya bilmesi gereken kişiler de gümrük vergilerinden sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>

      <mvz-madde no="193" başlık="">

      <mvz-madde no="194" başlık="">

          <template>Türkiye'nin taraf olduğu anlaşma hükümlerine göre dahilde işleme rejimi altında elde edilen Türk menşeli eşyanın anlaşmalara taraf ülkelere ithalinde, tercihli tarife uygulamasından yararlanmasının, bunların bünyelerine giren serbest dolaşımda olmayan eşyanın ithalat vergilerinin ödenmesi ve buna ilişkin belgelerin onaylanması koşuluna bağlı olması halinde, ithalata ilişkin bir gümrük yükümlülüğü doğar.  Ancak, geri ödeme sisteminden yararlanan eşya için bu fıkra uyarınca gümrük yükümlüğü doğmaz ve bu durumda ödenmiş ithalat vergileri geri verilmez.</template>

        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birinci fıkra uyarınca doğan gümrük yükümlülüğü kapsamında ödenmesi gereken ithalat vergilerinin ihracat beyannamesi konusu eşyanın Türkiye Gümrük Bölgesi dışına çıktığı tarihe kadar ödenmesi zorunludur. Bu tarihten sonra ödenen ithalat vergileri için ayrıca bu tarih itibarıyla 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 51 inci maddesi hükümlerine göre tespit edilen gecikme zammı uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">

        </mvz-fıkra>
      </mvz-madde>

    <mvz-bölüm no="2-İKİNCİ" başlık="Gümrük Vergilerinin Tahakkuku, Tebliği ve Ödenmesi">
