  <mvz-künye tür="kanun" no="1774" başlık="KİMLİK BİLDİRME KANUNU"
             tarih="26/6/1973" rgazete-tarih="11/7/1973 " rgazete-sayı="14591"
             düstur-tertip="5" düstur-cilt="12" düstur-sayfa="2547" />
    
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanunda sayılan, özel veya resmi, her türlü konaklama, dinlenme bakım ve tedavi tesisleri, marinalar, liman tesisleri, kıyı tesisleri ve işyerleri ile konutlarda geçici veya sürekli olarak kalanlar, oturanlar, çalışanlar ve ayrılanlar ile araç, gemi/deniz turizmi aracı kiralayan gerçek ve tüzel kişilerin kimliklerinin tespiti ve bildirilmesi bu Kanunun hükümlerine göre yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Askeri konaklama, dinlenme ve kamp tesisleri ile ordu evleri bu Kanunun kapsamı dışındadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Otel, motel, han, pansiyon, bekar odaları, günübirlik kiralanan evler, kamp, kamping, tatil köyü, marinalar, liman tesisi, kıyı tesisi ve benzeri her türlü, özel veya resmi konaklama yerleri ile özel sağlık müesseseleri, dinlenme ve huzur evleri, dini ve hayır kurumlarının sosyal tesislerinin sorumlu işleticileri, bu yerlerde ücretli veya ücretsiz, gündüz veya gece, yatacak yer gösterdikleri gemi/deniz turizmi araçlarında kalan kişiler de dahil olmak üzere yerli veya yabancı herkesin kimlik ve geliş- ayrılış kayıtlarını, örneğine ve usulüne uygun şekilde günü gününe tutmak, genel kolluk örgütlerinin her an incelemelerine hazır bulundurmak, Devlet İstatistik Enstitüsüne, talebi halinde vermek zorundadırlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>İkinci maddede sayılan tesislerin sorumlu işleticilerinin kimlikleri, tesis açılmadan evvel müessesenin sahibi veya kanuni temsilcisi tarafından örneğine uygun şekilde, en yakın kolluk örgütüne bildirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Sorumlu işleticinin değişmesi halinde keyfiyetin 24 saat içinde ve yukarıdaki fıkrada gösterilen şekilde bildirilmesi zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İşleticiler, kendilerine bu konuda verilen görev ve yükümlülükleri, kendi sorumlulukları altında yöneticilerine devredebilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu durumda işletici ve yönetici müştereken sorumlu olurlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kamu kuruluşlarına ait tesislerin amir ve müdürleri işletici gibi sorumludurlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>İkinci maddedeki tesislerin sorumlu işleticileri, müesseselerinde sürekli veya geçici olarak çalıştırdıkları kimseleri ve bunların ayrılışlarını, örneğine uygun kimlik bildirme belgesi doldurarak, 24 saat içinde bağlı oldukları en yakın kolluk örgütüne bildirirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kolluk örgütüne bildirilerek çalıştırılanlara, sorumlu işletici tarafından doldurulup onaylanan, örneğine uygun bir kimlik kartı verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kolluk görevlilerince her istenildiğinde bu kimlik kartının gösterilmesi zorunludur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>Şehir, kasaba ve köy sınırları içindeki;</template>
      <mvz-bent no="a" durum="mülga">
        <template></template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bu Kanunun ikinci maddesinde sayılanlar dışında kalan her çeşit ticaret ve sanat amacı güden iş yerlerinde çalışanlar ve buralarda her türlü barındırmalar için iş yerlerinin sorumlu işleticisi;</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Öğrenci yurtları ve benzeri yerlerde çalışanlar ile bu yerlerde kalmakta olan öğrenciler için o yerin sorumlu işleticisi;</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>tarafından örneğine uygun kimlik belgesi doldurularak üç gün içinde genel kolluk örgütüne verilmesi zorunludur.</template>
      </mvz-bent>
      <mvz-bent no="d" durum="mülga">
        <template></template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Konutun değiştirilmesi veya (b) ve (c) bentlerinde sayılan konut, iş yeri ve yurtlarda çalışmakta veya barınmakta olanların ayrılmaları halinde de, yukarıdaki şekil ve süre içinde bildirim belgesi gereklidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kimlik bildirimleri, mahalli kolluk örgütüne verilmeden evvel mahalle veya köy muhtarına onaylatılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu bildirimler sorumlu işleticiler tarafından, yukarıda belirtilen süre içerisinde genel kolluk kuvvetlerine elektronik ortamda da yapılabilir. Bildirimlerin elektronik ortamda yapılması durumunda üçüncü fıkra hükmü uygulanmaz. Bu fıkra kapsamında elektronik ortamda yapılan bildirimler, genel kolluk tarafından köy ve mahalle muhtarları ile paylaşılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="">
    <mvz-fıkra no="1">
      <template>Geçici yer değiştirmelerde;</template>
      <mvz-bent no="a">
        <template>Konutlarda 30 günden fazla kalacak misafir için aile reisi;</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Yaylak ve kışlak gibi yerlere mevsimlik olarak göçenler için de aile reisi tarafından, örneğine uygun bildirim,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Üç gün içinde kolluk örgütüne verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Mevsimlik tarım işçisi olarak sürekli ikametinin dışında bir başka ilde çalışmak amacıyla geçici olarak yer değiştirenlerin kimlik bildirimleri, bu kişilerin yaşadıkları geçici yerleşim alanlarında doğrudan kolluk kuvvetlerince alınır ve bu bildirimler Çalışma ve Sosyal Güvenlik Bakanlığı ile elektronik ortamda paylaşılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="9" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerine göre kimlik bildirme belgesini yetkili idareye vermekle yükümlü tutulanlar, kimliğini nüfus hüviyet cüzdanı ve diğer resmi geçerli belgelerle ispat edemeyen kimseleri tesislerinde barındıramaz, konut ve işyerlerinde çalıştıramaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="">
    <mvz-fıkra no="1">
      <template>Kahvehane, oyun salonu, kulüp, lokal ve benzeri yerlerde ve bu Kanunun kapsamına giren diğer yatısız iş yerlerinde, özel kanunları müsaade ettiği takdirde, ancak sahipleri ve çalıştırdıkları kimseler yatabilir, başkaları kalamazlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İskele, istasyon, hava meydanı terminal, garaj, benzin istasyonu ve benzeri kara, deniz ve hava ulaşım merkezleri ile fuar, panayır, sergi ve pazar kurulması gibi zorunluluk olan zaman ve yerlerde, sabahçı kahvesi ve benzeri diğer tesislere, bağlı olduğu kolluk kuvvetinin görüşü alınmak şartıyla belediye veya il özel idaresi tarafından geçici veya, sürekli olarak izin verilebilir. Buralarda kalanlar için bildirim yapılmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="">
    <mvz-fıkra no="1">
      <template>Kat mülkiyetine tabi taşınmaz mal yöneticileri ve kapıcıları, binalarında bildirim dışı kimselerin oturup oturmadığını, çalışıp çalışmadığını, garaj, kömürlük, boş daire gibi bölümlere saklanmalar, sığınmalar, bazı eşya veya maddeleri gizlemeler olup olmadığını kontrol etmekle yükümlüdürler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bütün kat sahipleri ve kiracıları ile binada çalışanlar bu konularda yöneticiye yardımcı olmak ve gereken bilgileri vermek zorundadırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yönetici ve kapıcıların, bu Kanuna aykırılıkları ve diğer şüpheli gördükleri hususları, bağlı oldukları genel kolluk örgütüne bildirmeleri gereklidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanunun bildirimlerle ilgili maddelerinin uygulama biçimi, söz konusu kimlik bildirme belge, defter ve kartlarının şekli, muhtevası, verilişi, alınış, Adalet, İçişleri, Turizm ve Tanıtma ve Devlet İstatistik Enstitüsü işlerine bakan Devlet Bakanlıklarınca müştereken hazırlanacak bir yönetmelikle gösterilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="14" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanuna göre verilecek belgeler ve yapılacak her türlü bildirimler, her çeşit vergi, resim ve harçtan muaftır. Mahkeme kararı olmadıkça, yetkili resmi örgütler dışında, hiç kimsenin bunlardan yararlanmasına müsaade edilemez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="">
    <mvz-fıkra no="1">
      <template>3 ve 4 üncü maddelerdeki yükümlülüklerden her birine aykırı hareket edenlere ikiyüzelli Türk Lirası idarî para cezası verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="17" başlık="">
    <mvz-fıkra no="1">
      <template>6, 7, 9, 10 ve 11 inci maddelerdeki hükümlere aykırı hareket edenlere yirmi Türk Lirası; kimlik bildirme belgesinde gerçeğe uymayan bilgi verenlere yüz Türk Lirası idarî para cezası verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="18" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanunda belirtilen idarî para cezaları, mahallî mülkî amir tarafından verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="19" başlık="">
    <mvz-fıkra no="1">
      <template>10/6/l930 tarihli ve 1704 sayılı Otel Pansiyon, Ticarethane vesair Umumi Müesseselerde Oturan ve Çalışanların Hüviyet Varakası Vermeleri Mecburiyetine dair Kanun ile bu Kanunun bazı maddelerini tadil ve tashih icrasına ve bir madde ilavesine dair 14/1/1933 tarih ve 2099 sayılı Kanun yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bu Kanunun uygulanması sırasında genel kolluk kuvvetlerine ait karakollara, il merkezlerinden de sorgulanabilen bilgisayar terminalleri konulur. Bunun için gerekli giderler İçişleri Bakanlığı bütçesine konulacak ödenekten karşılanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunun 2 nci maddesinde sayılan özel veya resmi her türlü konaklama tesisleri tüm kayıtlarını bilgisayarda günü gününe tutmak, genel kolluk kuvvetlerinin bilgisayar terminallerine bağlanarak mevcut bilgi, belge ve kayıtları genel kolluk kuvvetlerine anlık olarak bildirmek zorundadırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İkinci fıkrada belirtilen genel kolluk kuvvetlerinin terminallerine bağlanmayanlara onbin Türk Lirası, anlık veri göndermeyen veya gerçeğe aykırı kayıt tutanlara beşbin Türk Lirası idari para cezası, mülki idare amirlerince verilir.  Bu maddede sayılan fiillerin işlendiği takvim yılı içinde tekrarı halinde en son kesilen para cezasının iki katı uygulanır, ayrıca sayılan fiillerin işlendiği takvim yılı içinde dördüncü defa işlenmesi halinde işletme ruhsatları iptal edilir. Bu maddeye göre verilen idari para cezaları tebliğinden itibaren bir ay içinde ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu Kanunun 2 nci maddesinde sayılan özel veya resmi her türlü konaklama tesisleri, ikinci fıkrada belirtilen genel kolluk kuvvetlerinin terminallerine bağlanmak için gerekli işlemleri bu maddenin yürürlüğe girdiği tarihten itibaren iki ay içinde tamamlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu maddenin uygulanması ile görevi gereği bu verileri kullanan kamu personelinin denetimine ilişkin usul ve esaslar İçişleri Bakanlığı tarafından belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bu Kanunun 4 üncü ve 6 ncı maddeleri gereğince verilen sürekli veya geçici olarak çalışanlara ait kimlik bilgileri, genel kolluk kuvvetlerince ilgili Sosyal Güvenlik Kurumu Başkanlığı il müdürlükleri veya merkez müdürlüklerine bildirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Araç, gemi/deniz aracı kiralama faaliyeti yürüten gerçek ve tüzel kişilere ait işletmenin sorumlu işletmecileri ve yöneticileri, kiralanan araç bilgileri ile aracı, gemi/deniz aracını kiralayanların kimlik bilgileri ve kira sözleşmesi ile buna ilişkin tüm bilgi, belge ve kayıtları usulüne uygun şekilde bilgisayarda tutmak, genel kolluk kuvvetlerinin her an incelemelerine hazır bulundurmak, bilgisayar terminallerini genel kolluk kuvvetlerinin bilgisayar terminallerine bağlamak ve kiralayan şahıs ile kiralanan araç bilgilerini araç teslimi esnasında genel kolluk kuvvetlerine sistem üzerinden anlık olarak bildirmek ve kiralanan araçlarda GPS cihazı  bulundurarak, araçlara ait konum bilgisine ilişkin kayıtları üç yıl saklamak zorundadırlar. Ancak araç kiralayanın kamu kurum veya kuruluşu olması hâlinde sadece kamu kurum veya kuruluşuyla yapılan sözleşme ile araç bilgileri sisteme kaydedilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Genel kolluk kuvvetleri tarafından tutulan verilerden şahısların devam eden aktif araç kiralamasının olup olmadığı bilgisi araç kiralama faaliyeti yürüten gerçek ve tüzel kişilere ait işletmelerle paylaşılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Araç, gemi/deniz aracı kiralama esnasında gerçeğe aykırı kimlik kullananlar ile birinci fıkra kapsamında elde edilen bilgi ve kayıtları, hukuka aykırı olarak kullanan, bir başkasına veren, yayan veya ele geçiren kişi, 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanunu hükümlerine göre cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Birinci fıkrada belirtilen bilgi, belge ve kayıtları bilgisayarda tutmayanlara, bilgisayar terminallerini genel kolluk kuvvetlerinin bilgisayar terminallerine bağlamayanlara, gerçeğe aykırı kayıt tutan veya bilgi verenlere, kiralanan araçlarda GPS cihazı bulundurmayanlara ve araçlara ait konum bilgisine ilişkin kayıtları saklamayanlara doksan dokuz bin sekiz yüz doksan altı Türk Lirası, ilgili bilgi, belge ve kayıtları genel kolluk kuvvetlerinin incelemelerine hazır bulundurmayanlara, kiralayan şahıs ile kiralanan araç bilgilerini araç teslim edilmeden genel kolluk kuvvetlerine sistem üzerinden anlık olarak bildirmeyenlere kırk dokuz bin dokuz yüz otuz sekiz Türk Lirası idari para cezası, mülki idare amirlerince verilir. Bu maddede sayılan fiillerin işlendiği takvim yılı içinde tekrarı halinde en son kesilen para cezasının iki katı uygulanır. Ayrıca sayılan fiillerin işlendiği takvim yılı içinde dördüncü defa işlenmesi halinde işletme ruhsatları iptal edilir. Bu Kanuna göre verilen idari para cezaları tebliğinden itibaren bir ay içinde ödenir. İşlenen bir suçun gizlenmesi amacıyla bilgilerin yok edilmesi halinde işletme ruhsatı iptal edilir. Bu fıkraya göre idari yaptırımların uygulanması ceza soruşturması ve kovuşturması yapılmasına engel değildir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu maddenin uygulanması ile görevi gereği bu verileri kullanan kamu personelinin denetimine ilişkin esas ve usuller İçişleri Bakanlığı tarafından belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yayım tarihi ile 12 nci madde gereğince hazırlanacak yönetmeliğin yürürlüğe giriş tarihi arasında geçecek süre içinde 1704 ve 2099 sayılı Kanunların uygulanmasına devam olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yayımı tarihden sonra 12 nci maddedeki yönetmelik çıkıncaya kadar 5 inci madde ve 6 ncı maddenin (a), (c), (d) bentlerini gerekli görülen yerlerde uygulatmaya İçişleri Bakanı yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun 12 nci maddesinde belirtilen yönetmelik, bu Kanunun yürürlüğe girdiği tarihten itibaren altı ay içinde çıkarılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu maddenin yürürlüğe girdiği tarihten itibaren altı ay içinde araç kiralama şirketleri tüm kayıtlarını bilgisayarda tutmak ve bilgisayar terminallerini genel kolluk kuvvetlerinin ek 1 inci maddeye göre kurulan bilgisayar terminallerine bağlamak zorundadırlar. Bu şartı yerine getirmeyen işletmelere mülki idare amirlerince on bin Türk Lirası idari para cezası verilir. Bu fiilin tekrarı hâlinde işletme ruhsatları iptal edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="20" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanunun 6 ve 7 nci maddeleri, 6 ncı maddenin (b) bendi hariç, 12 nci maddeye dayanılarak çıkarılacak yönetmeliğin yürürlük tarihinde, diğer maddeleri bu Kanunun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
