  <mvz-künye tür="kanun" no="2644" başlık="TAPU KANUNU"
             tarih="22/12/1934" rgazete-tarih="29/12/1934" rgazete-sayı="2892"
             düstur-tertip="3" düstur-cilt="16" düstur-sayfa="312" />
    
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Gayrimenkullerin tescilinde o gayrimenkul Devlete ait ise bulunduğu yerdeki en büyük mal memuru, hususi idareye ait ise vali, evkafa ait ise evkaf müdürü veya memuru, belediyeye ait ise belediye reisi, köye ait ise muhtar ve mahsus kanunla teşekkül etmiş diğer hükmi şahıslara ait ise bunların kanuni mümessilleri salahiyetlidirler. Bu mümessillerin salahiyetlerini kullanma şeklini gösteren kanunlar hükmü yerinde durmaktadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Hükmi şahısların tapu işlerinde merkez veya şubelerinin bulundukları yerin en büyük mülkiye amirinden nizamnamelerine göre gayrimenkul tasarrufuna izinli olduklarına ve tescil işini yapacak mümessilin salahiyetine dair alınacak belgenin verilmesi mecburidir. Ticaret Şirketleri bu belgeyi ticaret sicil memurundan alırlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>Mevcudiyetleri Türkiye Cumhuriyeti Hükümetince tanınmış olan yabancılara ait dini, ilmi, hayri müesseselerin fermanlara ve Hükümet kararlarına müsteniden sahiplendikleri gayrimenkuller bu belgelerin sınırları dışına çıkmamak ve Hükümetin izni alınmak şartile müesseselerin hükmi şahsiyetleri namına tescil olunabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>Madenlerin tesciline ait muamelelerde mahsus kanun ve nizamlarına göre verilecek belgelerin İktisat Vekaletince tasdik edilmiş olması şarttır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="6" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="7" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="8" başlık="">
    <mvz-fıkra no="1">
      <template>Denizden doldurulmak istenilen yerler için o yerin en büyük mal memurundan izin almak lazımdır. Bu izin doldurulacak yer belediye sınırı içinde ise belediyenin, limanı da alakadar ediyorsa liman dairesinin veya deniz ticareti idaresinin ve müstahkem mevki kumandanlığı olan yerlerde müstahkem mevki kumandanlığının muvafakatları alındıktan sonra 3 yıl müddetle verilir. Belediye sınırı dışında ise alakalarına göre vilayet veya kaza idare heyetlerinin muvafakati alınır. İzinle doldurulan bu yerler izin veren dairelerden alınacak belgeler üzerine değer baha aranmaksızın dolduran namına tapu sicillerine geçirilir. Üç yıl içinde makbul bir özür olmaksızın doldurma işini bitirmiyenlerin bu yerlerden eli çektirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="">
    <mvz-fıkra no="1">
      <template>İzinsiz doldurulmuş olan yerlerin tescilinde mahzur olmadığı alakalı daire ve heyetlerce kabul olunursa doldurulan yerlerin doldurulmuş olduğu halindeki değer bahasının onda biri alınmak şartile dolduran namına tescili yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="">
    <mvz-fıkra no="1">
      <template>Deniz kıyısında teressübattan veya denizlerin med ve cezrinden dolmuş yerlerin satılmasında mahzur olmadığı sekizinci maddede yazılı alakalı dairelerce bildirildiği takdirde o yerlerin kendi gayrimenkulüne bitişik olan kısmını o gayrimenkul sahibinin kendisine yapılacak tebligattan itibaren iki sene içinde takdir olunacak değer baha ile almağa hakkı vardır. Bu yerleri satın alanların o yeri korumak için rıhtım inşası hakkı olacaktır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="">
    <mvz-fıkra no="1">
      <template>Sahipli bir gayrimenkulün önü veya bitişiği doldurulmak istenildiği takdirde sahibinden başkasına izin verilemez. İzinsiz olarak sahibi tarafından doldurulan böyle bir yerin tescilinde mahzur olmadığı alakalı daire ve heyetlerce bildirildiği takdirde doldurulan yerin doldurulmuş olduğu haldeki kıymetinin onda biri alınıp dolduranın veya dolduranın yerine geçenin namına asıl mülkü ile birleştirilerek tescil olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Devlet, vilayet, belediye veya köy meclisince sıhhi, içtimai veya iktisadi sebeplerle yapılacak doldurma işlerinde yukarıdaki fıkrada yazılı gayrimenkul sahiplerine doldurmağa yetecek mühlet verilerek doldurma teklif olunur. Bu müddet içinde doldurmadıkları takdirde bu hakları kalmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="">
    <mvz-fıkra no="1">
      <template>Bir gayrimenkulün önünde veya bitişiğinde olupta sahibi tarafından doldurulmak istenilen yerin doldurma işi bitirilmeksizin o gayrimenkul bir başkasının mülkiyetine geçer veya ayni bir hakla takyid olunursa, başka suretle mukavele bulunmadığı takdirde bu muamele işin şartları mahfuz olmak üzere doldurulan yerde de sari olur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="">
    <mvz-fıkra no="1">
      <template>Devletçe veya vilayet ve belediyelerce yapılan liman, dalgakıran, inşaatile temizleme ve taramadan meydana gelecek arazi hususi kanunlarındaki hükümlere bağlıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="">
    <mvz-fıkra no="1">
      <template>8, 9, 10, 11 ve 12 nci maddeler hükmü bataklık olmıyan göl ve nehir kenarlarında da caridir. Şu kadar ki nehrin asıl yatağını ve suların akıntısını bozmadığı ve alt taraflara ve başkalarına mazarratı olmıyacağı hakkında fenni rapor aranır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Başlı başına tasarruf olunabilecek deniz, göl veya nehir metrukatı bulunan sahipsiz yerler sahipli bir gayrimenkulün önünde veya bitişiğinde bulunursa o gayrimenkul sahibine değer baha ile satın alması teklif olunur. Bir yıl içinde talip olmadığı takdirde başkalarına satılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu yerler başlı başına tasarruf olunmıyacak halde ise takdir olunacak değer baha ile bitişiğindeki gayrimenkul sahiplerine temlik olunarak kendileri borçlandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Göl veya nehrin istila veya tahrip ettiği yerlerin sahiplerine Kanunu Medeninin 636 ve 637 nci maddeleri hükmü yerinde durmak üzere mukabil tarafta bu sebeplerden meydana gelmiş arazi var ise muadili parasız verilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="">
    <mvz-fıkra no="1" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Sahipli arazide husule gelen bataklıkların sıhhi sebeplerinden dolayı kurutulması zarureti tahakkuk edince Devlet veya vilayet tarafından verilecek müsait bir mühlet içinde sahipleri kurutmadıkları takdirde o bataklık Devlet veya vilayet tarafından kurutulur. Sahiplerinden kurutma masrafına iştirak edenlerin arazisi kendilerine verilir. Masrafa iştirak etmiyenlerin arazisi kurutanın mülkü olur.  Bu takdirde, gayrimenkulün bataklık halindeki gerçek karşılığı olarak arazi sahibine ödenecek bedelinin tesbitinde 6830 sayılı İstimlak Kanunu hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="">
    <mvz-fıkra no="1">
      <template>Hususi kanunlarında müsaade edilenleri hariç olmak üzere Devlete, belediyelere ve köylere ait orman, koru ve baltalıklardan tarla açılamaz ve hususi bina yapılamaz. Şahıslara ait ormanlarda dahi ait olduğu vekaletten izin alınmadıkça tarla açılamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="">
    <mvz-fıkra no="1">
      <template>Erbabı vukufa takdir ettirilen değer bahaların ikinci derecede tasdikı belediyelerce seçilecek iki zatın da iştirakile mahalli idare heyetlerine aittir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="18" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunda yazılı vergi kıymetleri 1837 numaralı Bina Vergisi ve 1933 numaralı Arazi Vergisi Kanunları mucibince vergiye matrah olan kıymettir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="19" başlık="">
    <mvz-fıkra no="1">
      <template>Değer bahalar müsavi taksitlerle beş yıl içinde vergi ile birlikte Tahsili Emval Kanununa göre tahsil olunur. İki seneye ait taksit ödenince gayrimenkul sahibi namına tescil edilir ve geri kalan taksitler için o gayrimenkul ipotekli olur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="20" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunun neşrinden evvel muamelesi bitipte tahakkuk ettirilmiş olan değer bahalar dahi 19 uncu maddede yazılı şekilde taksitle tahsil olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="21" başlık="">
    <mvz-fıkra no="1">
      <template>Köy ve belediye sınırları içinde kapanmış yollarla yol fazlaları köy veya belediye namına tescil olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı, Sahil Güvenlik Komutanlığı ve Emniyet Genel Müdürlüğü kullanımındaki kadastral yollar Hazine adına tescil olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="22" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="23" başlık="">
    <mvz-fıkra no="1">
      <template>İlmühaber alınması lazımgelen muameleler için belediye veya ihtiyar meclisi ilmühaberi tasdikten imtina ederse bu imtina sebeplerini şerh ile izaha mecburdur. Bunu yapamazsa hakkında kanuni takibat yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tapu idareleri yapacakları tetkik ve tahkik üzerine bu sebeplerin kanuni olmadığını anlarlarsa işi tapu komisyonuna verirler. Komisyon da sebeplerin kanuni olmadığına karar verirse tapu idarelerince muamele yapılır. Aksine karar verirse tapu idareleri 1515 numaralı kanunun şumülü dışındaki hallerde alakalıyı mahkemeye gönderir. Kaza tapu komisyonlarının kararlarına karşı alakalıların vilayet tapu komisyonlarına itiraz hakları vardır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="24" başlık="">
    <mvz-fıkra no="1">
      <template>Köylerde bulunan metruk ve kimsesiz mezarlıklarla vakfa ait umumi mezarlıklar köyün manevi şahsiyeti namına tescil olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="25" başlık="">
    <mvz-fıkra no="1">
      <template>1580 sayılı Belediye Kanununun 159 uncu maddesi ile 2510 sayılı İskan Kanununun 21 inci maddesi dışında kalan mera, baltalık gibi köy orta malı sayılan yerlerin tescili ve alım satım şekilleri hakkında hususi hükümler konulacaktır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="26" başlık="">
    <mvz-fıkra no="1">
      <template>Mülkiyete, mülkiyetin gayrı ayni haklara ve müşterek bir arzın hissedarları veya birbirine muttasıl gayrimenkullerin sahipleri arasında bunlardan birinin veya bir kaçının o gayrimenkul üzerinde mevcut veya inşa edilecek binanın, muayyen bir katından veya dairesinden yahut müstakillen istimale elverişli bir bölümünden munhasıran istifadesini temin gayesiyle Medeni Kanunun 753 üncü maddesi hükümlerine göre irtifak hakkı tesisine veya tesisi vadine mütedair resmi senetler tapu sicil müdürü veya tapu sicil görevlileri tarafından tanzim edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Taşınmaz mülkiyetinin devrini amaçlayan sözleşmelerde, tarafların farklı tapu müdürlükleri veya yurt dışı teşkilatında bulunmaları hâlinde, taraf iradeleri resmî görevliler tarafından ayrı ayrı alınarak sözleşme tamamlanabilir. Bu fıkranın uygulanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İllerde bulunan tapu sicil müdürlükleri dışındaki müdürlüklerden akitli ve akitsiz işlemleri yıllık 500'ün altında olan yerlerde işleri yapmak üzere, Tapu ve Kadastro Genel Müdürlüğünce yakın il veya ilçelerde görevli tapu sicil müdürü veya görevlendirilen yetkili memura belirli günlerde yetki verilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Resmi senetlerin düzenlenmesine ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Alakalıların isteği halinde resmi senedi tanzim için memurlar ikametgahlara giderler, bu sırada gelecek haciz ve tahdit kararları resmi senedi yapmak için ikametgaha gitmiş olan memura tebliğ olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Resmi senede tarafların kimlik bilgileri ile birlikte vergi kimlik numaraları da kaydedilir. Resmi senedi, taraflar ile hazırlayan tapu sicil müdürlüğü görevlileri imzalar, tapu sicil müdürü veya görevlendirilen memur onaylar.Tarafların kimliklerinde şüpheye düşülen hallerde tanık getirilmesi istenebilir. Kanunların tanık bulundurulmasını zorunlu kıldığı hükümler saklıdır. 11 Ocak 1926 tarihli ve 711 sayılı Kanun gereğince yapılacak akitlerde de aynı usul uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Birinci fıkrada beyan olunan irtifak hakkı tesisi vaitleri tapu siciline re'sen şerh verilir. Bunlardan irtifak hakkı tesisi vadine mütedair resmi senetler tapuya şerh verilmekle, taallük ettiği gayrimenkulün sonraki maliklerini de ilzam eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Noterlik Kanununun 44 üncü maddesinin (B) bendi mucibince noterler tarafından tanzim edilen gayrimenkul satış vadi sözleşmeleri  ile arsa payı karşılığı inşaat sözleşmeleri de taraflardan biri isterse gayrimenkul siciline şerh verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Şerhten itibaren beş yıl içinde satış yapılmaz veya irtifak hakkı tesis ve tapuya tescil edilmezse işbu şerh tapu sicil müdürü veya tapu sicil görevlileri tarafından re'sen terkin olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Kamu kurum ve kuruluşları, kredi kuruluşları, bankalar, esnaf ve sanatkârlar kredi ve kefalet kooperatifleri ile tarım kredi kooperatiflerince açılmış veya açılacak tüm borç ve kredilere karşılık teminat gösterilen taşınmazların ipotek işlemleri, tarafların istemi halinde, taraflarınca imzalanan kredi veya borç sözleşmesine istinaden tapu müdürlüklerinde tapuya tescil olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="11" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="12">
      <template>21/11/2012 tarihli ve 6361 sayılı Finansal Kiralama, Faktoring, Finansman ve Tasarruf Finansman Şirketleri Kanunu kapsamındaki tasarruf finansman şirketleri tarafından müşterilere sağlanan veya sağlanacak finansmana karşılık teminat gösterilen taşınmazların ipotek işlemleri, tarafların istemi hâlinde, imzalanan tasarruf finansman sözleşmesine istinaden tapu müdürlüklerinde tapuya tescil olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="27" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="28" başlık="">
    <mvz-fıkra no="1">
      <template>Akte ve tescile müteallik tapu işleri idari emirlerle durdurulamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="29" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="30" başlık="">
    <mvz-fıkra no="1">
      <template>Plan ve resmi mesahaya istinad etmiyen gayrimenkul mallarda eskidenberi malüm ve muayyen olan hududa itibar olunur. Borçlar Kanununun 215 inci  maddesi hükmü yerinde durmaktadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="31" başlık="">
    <mvz-fıkra no="1">
      <template>Gayrimenkul malların yüz ölçüsü tapu sicilinde yazılı miktardan fazla çıkıpta bu fazlalığın bitişik araziye el uzatmaktan ileri gelmediğine ve sınırca da bir değişiklik olmadığına mahkemece karar verilirse sicille karar veçhile kaydolunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Mahkeme gayrimenkulün başında incelemeler yapar ve bitişik gayrimenkul maliklerini dinler. Mahkeme kararına, tapu fen memurlarına ve bunlar yoksa yetkili fen memurlarına veya mühendislere yaptırılacak o yere ait harita da eklenir. İtiraz halinde genel hükümler çerçevesinde dava açılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="32" başlık="">
    <mvz-fıkra no="1">
      <template>Planı veya resmi şekilde yapılmış haritası bulunan gayrimenkullerin gerek kazaen ve gerekse rızaen parçalara ayrılmasında harita yapılması mecburidir. Şehir ve kasabaların belediye sınırları içinde olupta tapu fen memuru bulunan yerlerde plan ve haritaya bağlı olmıyan gayrimenkullerin parçalara ayrılmasında da harita yapılır. Belediye sınırları dışında bulunan gayrimenkullerden kazai şekilde parçalara ayrılanların haritasını yaptırmak hakimin takdirine bağlıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="33" başlık="">
    <mvz-fıkra no="1">
      <template>Kanunu Medeninin 934, 935 inci maddelerine göre sicillin tashihine ve bir ayni hakkın süküt edip etmediğinin tayinine dair tapu sicil muhafız veya memuru tarafından mahkemeye yapılacak müracaatlar ve bunun üzerine verilecek kararlardan bir güna harc ve resim alınmaz ve bunlara damga pulu yapıştırılmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="34" başlık="">
    <mvz-fıkra no="1">
      <template>Bedelli akitlerde ve bir aktin yapılması diğerinin yapılmış olmasına bağlı olan hallerde alakalılar tapu sicil muhafız veya memurunu yediadil yapabilirler. Bu takdirde memur tarafından paranın hak sahiplerine verilmesi Akitlerin tamam olmasına bağlıdır. Akitler tamam olmazsa memur parayı kimden almış ise alakalılar dağılmadan huzurlarında derhal ona geri verir ve taallük ettiği muameleleri bozar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="35" başlık="">
    <mvz-fıkra no="1">
      <template>Kanuni sınırlamalara uyulmak kaydıyla, uluslararası ikili ilişkiler yönünden ve ülke menfaatlerinin gerektirdiği hallerde Cumhurbaşkanı tarafından belirlenen ülkelerin vatandaşı olan yabancı uyruklu gerçek kişiler Türkiye’de taşınmaz ve sınırlı ayni hak edinebilirler. Yabancı uyruklu gerçek kişilerin edindikleri taşınmazlar ile bağımsız ve sürekli nitelikteki sınırlı ayni hakların toplam alanı, özel mülkiyete konu ilçe yüz ölçümünün yüzde onunu ve kişi başına ülke genelinde otuz hektarı geçemez. Cumhurbaşkanı kişi başına ülke genelinde edinilebilecek miktarı iki katına kadar artırmaya yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yabancı ülkelerde kendi ülkelerinin kanunlarına göre kurulan tüzel kişiliğe sahip ticaret şirketleri ancak özel kanun hükümleri çerçevesinde taşınmaz ve sınırlı ayni hak edinebilirler. Bu ticaret şirketleri dışındakiler taşınmaz edinemez ve lehlerine sınırlı ayni hak tesis edilemez. Bu ticaret şirketleri ile yabancı uyruklu gerçek kişiler lehine taşınmaz rehni tesisinde bu maddede yer alan sınırlamalar uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Cumhurbaşkanı, ülke menfaatlerinin gerektiği hallerde yabancı uyruklu gerçek kişiler ile yabancı ülkelerde kendi ülkelerinin kanunlarına göre kurulan tüzel kişiliğe sahip ticaret şirketlerinin taşınmaz ve sınırlı ayni hak edinimlerini; ülke, kişi, coğrafi bölge, süre, sayı, oran, tür, nitelik, yüzölçüm ve miktar olarak belirleyebilir, sınırlandırabilir, kısmen veya tamamen durdurabilir veya yasaklayabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yabancı uyruklu gerçek kişiler ve yabancı ülkelerde kendi ülkelerinin kanunlarına göre kurulan tüzel kişiliğe sahip ticaret şirketleri, satın aldıkları yapısız taşınmazda geliştireceği projeyi iki yıl içinde ilgili Bakanlığın onayına sunmak zorundadır. İlgili Bakanlıkça başlama ve bitirilme süresi belirlenerek onaylanan proje tapu kütüğünün beyanlar hanesine kaydedilmek üzere taşınmazın bulunduğu tapu müdürlüğüne gönderilir. Onaylanan projenin süresi içinde gerçekleştirilip gerçekleştirilmediği ilgili Bakanlıkça takip edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Askeri yasak bölgeler, askeri güvenlik bölgeleri ile stratejik bölgelere ait harita ve koordinat değerleri bu Kanunun yürürlük tarihinden itibaren en geç bir yıl içinde ve bu yerlere ait değişiklik kararlarına ait harita ve koordinat değerleri değişikliklerin yapıldığı tarihten itibaren bir ay içinde Millî Savunma Bakanlığınca, özel güvenlik bölgeleri ve değişiklik kararlarına ait harita ve koordinat değerleri ise İçişleri Bakanlığınca aynı sürede Tapu ve Kadastro Genel Müdürlüğünün bağlı olduğu Bakanlığa verilir. Bu Kanunun yürürlük tarihinden itibaren bir yıl sonra bu fıkra uyarınca gönderilen belge ve bilgilere göre tapu işlemleri yürütülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu madde hükümlerine aykırı olarak edinilen, edinim amacına aykırı kullanıldığı ilgili Bakanlık ve idarelerce tespit edilen, süresi içinde ilgili Bakanlığa başvurulmayan veya süresi içinde projeleri gerçekleştirilmeyenler ile bu maddenin birinci fıkrası kapsamındaki sınırlamalar dışında miras yoluyla edinilen taşınmazlar ve sınırlı ayni haklar, Maliye Bakanlığınca verilecek bir yılı geçmeyen süre içinde maliki tarafından tasfiye edilmediği takdirde tasfiye edilerek bedele çevrilir ve bedeli hak sahibine ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="36" başlık="">
    <mvz-fıkra no="1">
      <template>29/5/2009 tarihli ve 5901 sayılı Türk Vatandaşlığı Kanununun 28 inci maddesi kapsamındaki kişiler hariç olmak üzere yabancı uyruklu gerçek kişilerin, yabancı ülkelerin kanunlarına göre kurulmuş tüzel kişilerin ve uluslararası kuruluşların yüzde elli veya daha fazla oranda hissesine sahip oldukları veya yönetim hakkını haiz kişilerin çoğunluğunu atayabilme veya görevden alabilme yetkisine sahip oldukları Türkiye’de kurulu tüzel kişiliğe sahip şirketler, ana sözleşmelerinde belirtilen faaliyet konularını yürütmek üzere taşınmaz mülkiyeti veya sınırlı ayni hak edinebilir ve kullanabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkrada belirtilen şirketlerin Türkiye’de kurulu başka bir şirkete doğrudan veya dolaylı olarak ortak olması durumunda, yabancı yatırımcının ortak olunan şirketteki nihai ortaklık oranının yüzde elli veya daha fazla olması halinde; yabancı yatırımcıların, taşınmaz maliki yerli sermayeli şirketlerin hisselerinin yüzde elli veya daha fazlasını doğrudan veya dolaylı olarak edinmesi ve taşınmaz maliki mevcut yabancı sermayeli şirketlerde yabancı yatırımcıların ortaklık oranının hisse devri sonucunda yüzde elli veya daha fazlasına ulaşması durumunda da aynı esaslar geçerlidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>18/12/1981 tarihli ve 2565 sayılı Askeri Yasak Bölgeler ve Güvenlik Bölgeleri Kanunu hükümleri saklı kalmak kaydıyla bu şirketlerin, askeri yasak bölgeler, askeri güvenlik bölgeleri ve aynı Kanunun 28 inci maddesi çerçevesinde belirlenen bölgelerdeki taşınmaz mülkiyeti edinimleri Genelkurmay Başkanlığının ya da yetkilendireceği komutanlıkların; özel güvenlik bölgelerindeki taşınmaz mülkiyeti edinimleri ise taşınmazın bulunduğu yerdeki valiliğin iznine tabidir. Bu fıkra kapsamında yapılacak değerlendirmelerde, edinimin ülke güvenliğine uygunluğu esas alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yukarıdaki fıkralar kapsamı dışında kalan yabancı sermayeli şirketler, yerli sermayeli şirketlerin tabi olduğu hükümler çerçevesinde taşınmaz mülkiyeti ve sınırlı ayni hak edinebilir ve kullanabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Taşınmaz rehni tesisinde, taşınmaz rehninin paraya çevrilmesi kapsamındaki mülkiyet edinimlerinde, şirket birleşmelerinden ve bölünmelerinden doğan taşınmaz mülkiyeti ve sınırlı ayni hak naklinde, organize sanayi bölgeleri, endüstri bölgeleri, teknoloji geliştirme bölgeleri ve serbest bölgeler gibi özel yatırım bölgelerindeki taşınmaz mülkiyeti ve sınırlı ayni hak edinimlerinde ve ilgili mevzuata göre belli sürede elden çıkarma zorunluluğunun devam etmesi kaydıyla bankaların, 19/10/2005 tarihli ve 5411 sayılı Bankacılık Kanunu çerçevesinde kredi olarak sayılan işlemler nedeniyle ya da alacaklarını tahsil amacıyla edindikleri taşınmazlarda bu madde hükümleri uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu madde kapsamında edinilen taşınmazların kullanımı, valiliklerce tapu kayıtları çerçevesinde belli aralıklarla izlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Bu madde hükümlerine aykırı şekilde edinildiği veya kullanıldığı tespit edilen taşınmazlar ve sınırlı ayni haklar, Maliye Bakanlığınca verilecek süre içinde maliki tarafından tasfiye edilmediği takdirde tasfiye edilerek bedele çevrilir ve bedeli hak sahibine ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar, ilgili kurum ve kuruluşların görüşlerinin alınmasını müteakip Ekonomi Bakanlığı tarafından çıkarılan yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="37" başlık="">
    <mvz-fıkra no="1">
      <template>Yabancı hakiki şahısların intikal işleri Türkiye Cumhuriyeti mahkemelerinden verilen veyahut kendi salahiyetli makamlarından verilipte Türk kanunlarının veraset usulü hakkındaki hükümlerine uygun olduğu Türk mahkemelerince tasdik edilen veraset senetlerine istinaden yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="38" başlık="">
    <mvz-fıkra no="1">
      <template>8 cemaziyelevvel 1275 tarihli tapu nizamnamesi ve zeyillerinin ve 28 receb 1291 tarihli emlak nizamnamesinin ve 7 muharrem 1293 tarihli arazi hakkındaki fıkaratı nizamiyenin ve 8 receb 1276 tarihinde iradesi çıkmış olan tapu senedatı hakkındaki talimatnamenin ve 28 receb 1276 tarihinde iradesi çıkmış olan tarifnamenin ve emvali gayrimenkulenin tasarrufuna dair 3 mart 1329 tarihli muvakkat kanunun ve defterhane idarelerinin teşkilat ve tensikatına dair 17 temmuz 1323 tarihli nizamname ile zeyillerinin ve emvali gayrimenkulenin muamelatı tasarrufiyesinde tapu senedatı ile kayidlerine alakadaranın fotoğrafileri yapıştırılmasına dair 30 kanunusani 1926 tarihli kanunun Kanunu Medeni ile Kanunu Medeninin tatbikına aid kanun ve Borçlar Kanunu ile ortadan kalkmamış olan hükümlerile başka kanunların bu kanuna uygun olmıyan hükümleri kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Ölüm tarihinden itibaren en geç iki yıl içinde tapu sicilinde miras intikalinin gerçekleşmemesi halinde tapu müdürlüğü, mirasçılık belgesi düzenlenmesi için yargıya başvurabilir. Tapu müdürlüğü mirasçılık belgesine göre tapu sicili kayıtlarını elbirliği mülkiyeti şeklinde tescil ederek güncelleştirir. Tapu müdürlüğünün bu yetki kapsamındaki başvuruları her türlü gider, vergi, resim veya harçtan muaftır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Rücu istemi" tür="Ek">
    <mvz-fıkra no="1">
      <template>Tapu ve kadastro işlemleri ile ilgili olarak, Devletin kusursuz sorumluluğu sebebiyle yapılan ödemeler dolayısıyla, ihmali bulunan personel aleyhine başlatılacak rücu istemleri, ödeme tarihinden itibaren iki yıl, her hâlde zarara yol açan işlemin gerçekleştirildiği tarihten itibaren on yılın geçmesiyle zamanaşımına uğrar. Ağır kusura dayalı sorumluluğu bulunan personel için 11/1/2011 tarihli ve 6098 sayılı Türk Borçlar Kanununun 73 üncü maddesi hükümleri saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Tapu kaydındaki hisse hatalarının düzeltilmesi" tür="Ek">
    <mvz-fıkra no="1">
      <template>Kadastro tespiti veya tapu sicilinde gerçekleştirilen işlemler nedeniyle oluşan hatadan olumsuz etkilenen hisselerin maliklerine, ayni ve şahsi hak lehtarlarına hatanın nedenleri ve düzeltme sonrası oluşacak hisse durumunu gösteren tebligat yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yapılacak işlem konusunda tapu kaydının beyanlar hanesine belirtme yapılır ve bu belirtme düzeltme işlemi kesinleşinceye kadar korunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Tebliğ tarihinden itibaren otuz gün içinde ilgililerince muvafakat verilmesi hâlinde düzeltme işlemi yapılır. Bu süre içinde muvafakat verilmez ise tapu müdürlüğünce hatalı kayıt resen düzeltilerek işlem sonucu ile birlikte düzeltme işlemine karşı tebliğden itibaren altmış gün içinde asliye hukuk mahkemesinde dava açılabileceği ilgilisine ihtar edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu kanunun mer'iyetinden evvel açılarak tarla veya bağ ve bahçe haline konulmuş olupta henüz muamelesi bitmemiş yerler hakkında da bu kanunun 6 ncı maddesi hükümleri tatbik olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihte mevcut olan askerî yasak bölgeler, askerî ve özel güvenlik bölgeleri ile stratejik bölgelere ilişkin kararlara ait harita ve koordinat değerlerinin tamamı, Millî Savunma Bakanlığı tarafından en geç üç ay içerisinde Tapu ve Kadastro Genel Müdürlüğünün bağlı olduğu Bakanlığa gönderilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yukarıda belirtilen bölgelere ilişkin kararlara ait harita ve koordinat değerlerinin, Tapu ve Kadastro Genel Müdürlüğüne gönderilmesi ve sayısal ortama aktarılarak taşra birimlerine intikal ettirilmesine kadar geçecek sürede yetkili askerî makamlardan sorulmak suretiyle, belirtilen işlemler tamamlandıktan sonra gönderilen belge ve bilgilere göre tapu işlemleri yürütülür.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>İlgili kurum ve kuruluşlar, bu Kanunun 35 inci maddesinin yedinci  fıkrası   uyarınca,  yabancı  uyruklu  gerçek kişiler ile yabancı ülkelerde kendi ülkelerinin kanunlarına göre kurulan tüzel kişiliğe sahip ticaret şirketlerinin taşınmaz ve sınırlı aynî hak edinemeyecekleri alanların yüzölçümlerini ve valilikler bu fıkrada belirtilen ilçelerin uygulama imar planı ve mevzi imar plan sınırları içerisinde kalan toplam alanların yüzölçümlerini bu maddenin yürürlük tarihinden itibaren en geç üç ay içinde komisyona bildirir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2" durum="iptal">
      <template></template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>22/11/2001 tarihli ve 4721 sayılı Türk Medeni Kanununun 883 üncü maddesinin ikinci fıkrasının yürürlüğe girdiği tarihten önce süresi dolmuş olmasına rağmen terkin edilmeyen süreli ipoteklerde anılan fıkrada belirtilen otuz günlük süre, bu maddenin yürürlüğe girdiği tarihte başlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="39" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanun hükümleri, neşrolunduğu tarihten itibaren yürümeğe başlar.</template>
    </mvz-fıkra>
  </mvz-madde>

      <template>Bu kanun hükümlerini Adliye, Dahiliye, Maliye Bakanları yerine getirir.</template>
