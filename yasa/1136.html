  <mvz-künye tür="kanun" no="1136" başlık="AVUKATLIK KANUNU"
             tarih="19/3/1969" rgazete-tarih="7/4/1969" rgazete-sayı="13168"
             düstur-tertip="5" düstur-cilt="8" düstur-sayfa="1694" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Avukatlık ve Avukat">
    <mvz-madde no="1" başlık="Avukatlığın mahiyeti">
      <mvz-fıkra no="1">
        <template>Avukatlık, kamu hizmeti ve serbest bir meslektir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukat, yargının kurucu unsurlarından olan bağımsız savunmayı serbestçe temsil eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Avukatlığın amacı">
      <mvz-fıkra no="1">
        <template>Avukatlığın amacı; hukuki münasebetlerin düzenlenmesini, her türlü hukuki mesele ve anlaşmazlıkların adalet ve hakkaniyete uygun olarak çözümlenmesini ve hukuk kurallarının tam olarak uygulanmasını her derecede yargı organları, hakemler, resmi ve özel kişi, kurul ve kurumlar nezdinde sağlamaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukat bu amaçla hukuki bilgi ve tecrübelerini adalet hizmetine ve kişilerin yararlanmasına tahsis eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yargı organları, emniyet makamları, diğer kamu kurum ve kuruluşları ile kamu iktisadi teşebbüsleri, özel ve kamuya ait bankalar, noterler, sigorta şirketleri ve vakıflar avukatlara görevlerinin yerine getirilmesinde yardımcı olmak zorundadır. Kanunlarındaki özel hükümler saklı kalmak kaydıyla, bu kurumlar avukatın gerek duyduğu bilgi ve belgeleri incelemesine sunmakla yükümlüdür. Bu belgelerden örnek alınması vekâletname ibrazına bağlıdır. Derdest davalarda müzekkereler duruşma günü beklenmeksizin mahkemeden alınabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Avukatlık Mesleğine Kabul">
    <mvz-madde no="3" başlık="Avukatlığa kabul şartları">
      <mvz-fıkra no="1">
        <template>Avukatlık mesleğine kabul edilebilmek için:</template>
        <mvz-bent no="a">
          <template>Türkiye Cumhuriyeti vatandaşı olmak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Türk hukuk fakültelerinden birinden mezun olmak veya yabancı memleket hukuk fakültesinden mezun olup da Türkiye hukuk fakülteleri programlarına göre noksan kalan derslerden başarılı sınav vermiş bulunmak,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Avukatlık stajını tamamlayarak staj bitim belgesi almış bulunmak,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Levhasına yazılmak istenen baro bölgesinde ikametgâhı bulunmak,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Bu Kanuna göre avukatlığa engel bir hali olmamak gerekir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="İstisnalar">
      <mvz-fıkra no="1">
        <template>Adli, idari ve askeri yargı hâkimlik ve savcılıklarında, Anayasa Mahkemesi raportörlüklerinde, Danıştay üyeliklerinde, üniversiteye bağlı fakültelerin hukuk bilimi dersleri dalında profesörlük, doçentlik, yardımcı doçentlik görevlerinde dört yıl, kamu kurum ve kuruluşlarının hukuk müşavirliği görevinde on yıl süre ile hizmet etmiş olanlarda 3 üncü maddenin (c) ve (d) bentlerinde yazılı koşullar aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türk vatandaşları ve Türk uyruğuna kabul olunanlardan yabancı hukuk fakültelerinden mezun olup da, geldikleri yerde dört yıl süreyle mahkemelerin her derecesinde hâkimlik, savcılık veya avukatlık yapmış ve avukatlığı meslek edinmiş bulunanlar, 3 üncü maddenin (b) bendinde yazılı olduğu biçimde Türk hukuk fakülteleri programlarına göre noksan kalan derslerden usulüne uygun olarak yapılan sınavlarda başarı göstermiş ve ayrıca Türkçe’yi iyi bilir oldukları da bir sınavla anlaşılmış olmak kaydıyla, 3 üncü maddenin (c) ve (d) bentlerinde yazılı koşulların dışında tutulurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci ve ikinci fıkrada gösterilenlerin baro levhasına yazılmasında, 17 nci maddenin (1) ve (2) numaralı bentlerinde yazılı belgelerden başka sicil özetlerinin onanmış bir örneğinin de verilmesi gereklidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Avukatlığa kabulde engeller">
      <mvz-fıkra no="1">
        <template>Aşağıda yazılı durumlardan birinin varlığı halinde, avukatlık mesleğine kabul istemi reddolunur:</template>
        <mvz-bent no="a">
          <template>Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı iki yıldan fazla süreyle hapis cezasına ya da Devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar,  zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kesinleşmiş bir disiplin kararı sonucunda hâkim, memur veya avukat olma niteliğini kaybetmiş olmak,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>(İptal)</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Avukatlık mesleği ile birleşemeyen bir işle uğraşmak,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Mahkeme kararı ile kısıtlanmış olmak,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İflas etmiş olup da itibarı iade edilmemiş bulunmak (Taksiratlı ve hileli müflisler itibarları iade edilmiş olsa dahi kabul olunmazlar),</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Hakkında aciz vesikası verilmiş olup da bunu kaldırmamış bulunmak,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Avukatlığı sürekli olarak gereği gibi yapmaya engel vücut veya akılca malul olmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkranın (a) bendinde sayılan yüz kızartıcı suçlardan biri ile hüküm giymiş olanların cezası ertelenmiş, paraya çevrilmiş veya affa uğramış olsa da avukatlığa kabul edilmezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Adayın birinci fıkranın (a) bendinde yazılı cezalardan birini gerektiren bir suçtan dolayı hakkında kamu davası açılmış olması halinde, avukatlığa alınması isteği hakkındaki kararın bu kovuşturmanın sonuna kadar bekletilmesine karar verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Şu kadar ki, ceza kovuşturmasının sonucu ne olursa olsun avukatlığa kabul isteğinin geri çevrilmesi gereken hallerde, sonuç beklenmeden istek karara bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Baroya yazılma istemi">
      <mvz-fıkra no="1">
        <template>4 üncü maddedeki koşulları taşıyanlar başvurdukları baro levhasına yazılmalarını dilekçe ile isteyebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Karar">
      <mvz-fıkra no="1">
        <template>Baro yönetim kurulu, levhaya yazılma istemi hakkında başvurma dilekçesinin varış tarihinden itibaren bir ay içinde gerekçeli olarak karar vermekle ödevlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Süresi içinde karar verilmediği takdirde, adayın avukatlığa kabul istemi reddedilmiş sayılır. Bu halde aday bir aylık sürenin bitiminden itibaren onbeş gün içinde Türkiye Barolar Birliğine itiraz edebilir. İtiraz üzerine 8 inci madde hükmü kıyas yolu ile uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Redde veya kovuşturma sonuna kadar beklenmesine dair karara itiraz">
      <mvz-fıkra no="1">
        <template>Baro Yönetim Kurulu, avukatlığa kabul istemini reddettiği veya kovuşturma sonuna kadar beklenmesine karar verdiği takdirde bunun gerekçesini kararında gösterir. Gerekçeli karar adaya tebliğ olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aday, bu karara karşı, tebliğ tarihinden itibaren onbeş gün içinde, kararı veren baro vasıtasiyle Türkiye Barolar Birliğine itiraz edebilir. Baro tarafından adaya, itiraz tarihini tesbit eden bir belge verilir. Bu belge hiçbir vergi, harç ve resme tabi değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Türkiye Barolar Birliği, itiraz üzerine dosya üzerinde gerekli incelemeleri yaptıktan sonra, itirazı kabul veya reddeder. Türkiye Barolar Birliği itiraz tarihinden itibaren bir ay içinde bir karar vermezse, itiraz reddedilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Baro yönetim kurullarının adayın levhaya yazılması hakkındaki kararları, karar tarihinden itibaren onbeş gün içinde Türkiye Barolar Birliğine gönderilir. Türkiye Barolar Birliği kararın kendisine ulaştığı tarihten itibaren bir ay içinde uygun bulma veya bulmama kararını ve itirazın kabul veya reddi hakkındaki kararlarını onaylamak üzere karar tarihinden itibaren bir ay içinde Adalet Bakanlığına gönderir. Bu kararlar Adalet Bakanlığına ulaştığı tarihten itibaren iki ay içinde Bakanlıkça karar verilmediği veya karar onaylandığı takdirde kesinleşir. Ancak Adalet Bakanlığı uygun bulmadığı kararları bir daha görüşülmek üzere, gösterdiği gerekçesiyle birlikte Türkiye Barolar Birliğine geri gönderir. Geri gönderilen bu kararlar, Türkiye Barolar Birliği Yönetim Kurulunca üçte iki çoğunlukla aynen kabul edildiği takdirde onaylanmış, aksi halde onaylanmamış sayılır; sonuç Türkiye Barolar Birliği tarafından Adalet Bakanlığına bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Baro yönetim kurulunun, avukatlığı kabul isteminin reddi vaya kovuşturma sonuna kadar beklenmesi hakkındaki kararları, süresi içinde itiraz edilmediği takdirde kesinleşir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Adalet Bakanlığının dördüncü fıkra uyarınca verdiği kararlara karşı, Türkiye Barolar Birliği, aday ve ilgili baro; Adalet Bakanlığının uygun bulmayıp bir daha görüşülmek üzere geri göndermesi üzerine Türkiye Barolar Birliğince verilen kararlara karşı ise, Adalet Bakanlığı, aday ve ilgili baro idari yargı merciine başvurabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Barolar, kesinleşen kararları derhal yerine getirmeye mecburdurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Avukatlık ruhsatnamesi ve yemin">
      <mvz-fıkra no="1">
        <template>Avukatlık meslekine kabul edilen adaya, ilgili baro tarafından bir ruhsatname verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukatlığa kabul, ruhsatnamenin verildiği andan itibaren hüküm ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Aday böylece avukatlığa kabul edildikten sonra (Avukat) unvanını kullanmak hakkını kazanır. Durum Türkiye Barolar Birliğine bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ruhsatnameler ve avukat kimlikleri Türkiye Barolar Birliği tarafından tek tip olarak bastırılır ve düzenlenir. 8 inci maddenin dördüncü fıkrasında belirtilen şekilde Türkiye Barolar Birliği Yönetim Kurulunca uygun bulma kararı verildiğinde ruhsatnameler Birlik Başkanı ve ilgili Baro Başkanı tarafından imzalanır. Avukat kimlikleri, tüm resmî ve özel kuruluşlar tarafından kabul edilecek resmî kimlik hükmündedir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Mesleke kabul edilen avukata ruhsatname verilirken, baro yönetim kurulu önünde aşağıdaki şekilde andiçtirilir:</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Hukuka, ahlaka, mesleğin onuruna ve kurallarına uygun davranacağıma namusum ve vicdanım üzerine andiçerim.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Avukatın andiçtirildiği, andın metnini de kapsıyan bir tutanağa bağlanır ve ilgilinin dosyasında saklanır. Tutanak baro yönetim kurulu üyeleri ile birlikte andiçen avukat tarafından imzalanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Ret kararının bildirilmesi">
      <mvz-fıkra no="1">
        <template>Avukatlık meslekine kabul edilmek için baroya başvuran bir adayın bu isteminin reddine veya kovuşturma sonuna kadar beklenmesine dair kararlar kesinleşince, ilgili baro, adayın adını diğer barolara ve Türkiye Barolar Birliğine bildirir. Bu halde, ret ve bekleme sebepleri ortadan kalkmadıkça, hiçbir baro o kimseyi levhasına yazamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Yasak Haller">
    <mvz-madde no="11" başlık="Avukatlıkla birleşemeyen işler">
      <mvz-fıkra no="1">
        <template>Aylık, ücret, gündelik veya kesenek gibi ödemeler karşılığında görülen hiçbir hizmet ve görev, sigorta prodüktörlüğü, tacirlik ve esnaflık veya meslekin onuru ile bağdaşması mümkün olmıyan her türlü iş avukatlıkla birleşemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Avukatlıkla birleşebilen işler">
      <mvz-fıkra no="1">
        <template>Aşağıda, sayılan işler 11 inci madde hükmü dışındadır:</template>
        <mvz-bent no="a">
          <template>Milletvekilliği, il genel meclisi ve belediye meclisi üyeliği,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Hukuk alanında profesör ve doçentlik,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Özel hukuk tüzelkişilerinin hukuk müşavirliği ve sürekli avukatlığı ile bir avukat yazıhanesinde ücret karşılığında avukatlık,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hakemlik, arabuluculuk, tasfiye memurluğu, yargı mercilerinin veya adli bir dairenin verdiği herhangi bir görev veya hizmet,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Kamu iktisadi Teşebbüsleri Hakkında 233 sayılı Kanun Hükmünde Kararnamede başka iş veya hizmetle uğraşmaları yasaklanmamış bulunmak şartıyla; bu Kanun Hükmünde Kararnamenin kapsamına giren İktisadi Devlet Teşekkülleri, kamu iktisadi kuruluşları ve bunların müesseseleri, bağlı ortaklıkları ve iştirakleri ve iktisadi Devlet Teşekkülleri ile Kamu İktisadi kuruluşları dışında kalıp sermayesi Devlete ve diğer kamu tüzelkişilerine ait bulunan kuruluşların yönetim kurulu başkanlığı, üyeliği, denetçiliği,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Anonim, limited, kooperatif şirketlerin ortaklığı, yönetim kurulu başkanlığı, üyeliği ve denetçiliği ve komandit şirketlerde komanditer ortaklık,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Hayri, ilmi ve siyasi kuruluşların yönetim kurulu başkanlığı, üyeliği ve denetçiliği,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Gazete ve dergi sahipliği veya bunların yayım müdürlüğü,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Milletvekilleri hakkında, 3069 sayılı Türkiye Büyük Millet Meclisi Üyeliği ile Bağdaşmayan İşler Hakkında Kanun hükümleri saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(e) bendinde gösterilenlerin, Hazinenin, belediye ve özel idarelerin, il ve belediyelerin yönetimi ve denetimi altında bulunan daire ve kurumların, köy tüzel kişiliklerinin ve kamunun hissedar olduğu şirket ve kuruluşların aleyhinde; il genel meclisi ve belediye meclisi üyelerinin de bağlı bulundukları tüzel kişilerin ve yüksek öğretimde görevli profesör ve doçentlerin yüksek öğretim kurum ve kuruluşları aleyhindeki dava ve işleri takip etmeleri yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu yasak, avukatların ortaklarını ve yanlarında çalıştırdıkları avukatları da kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bir kadroya bağlı olarak aylık veya ücreti Devlet, il veya belediye bütçelerinden yahut Devlet, il veya belediyelerin yönetimi ve denetimi altındaki daire ve müessese yahut şirketlerden verilen müşavir ve avukatlar, yalnız bu daire, müessese ve şirketlere ait işlerde avukatlık yapabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Avukatın hâkim veya savcı ile hısımlık veya evlilik münasebeti">
      <mvz-fıkra no="1">
        <template>Bir hâkim veya Cumhuriyet Savcısının eşi, sebep veya nesep itibariyle usul ve füruundan veya ikinci dereceye kadar (Bu derece dahil) hısımlarından olan avukat, o hakim veya Cumhuriyet Savcısının baktığı dava ve işlerde avukatlık edemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Bazı görevlerden ayrılanların avukatlık edememe yasağı">
      <mvz-fıkra no="1">
        <template>(İptal)</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıki fıkra hükmü Anayasa Mahkemesi üyeleri ve Yüksek Mahkemeler hâkimleri hakkında da uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Devlet, belediye, il özel idare ve Kamu İktisadi Teşebbüsleri Hakkında 233 Sayılı Kanun Hükmünde Kararnamenin kapsamına giren iktisadi Devlet Teşekkülleri ile kamu iktisadi kuruluşları ve bunların müessese, bağlı ortaklık ve iştiraklerinde çalışanlar, buralardan ayrıldıkları tarihten itibaren iki yıl geçmeden ayrıldıkları idare aleyhine dava alamaz ve takipte bulunamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Staj">
    <mvz-madde no="15" başlık="Genel olarak">
      <mvz-fıkra no="1">
        <template>Avukatlık stajı bir yıldır. Stajın bu kısmında yer alan hükümler uyarınca ilk altı ayı mahkemelerde ve kalan altı ayı da en az beş yıl kıdemi olan (bu beş yıllık kıdem hesabına Kanunun 4 üncü maddesinde yazılı hizmette geçen süreler de dahildir.) ve staj yaptığı baroya kayıtlı bir avukat yanında yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Stajın hangi mahkeme ve adalet dairelerinde, ne surette yapılacağı yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Aranacak şartlar">
      <mvz-fıkra no="1">
        <template>3 üncü maddenin (a), (b) ve (f) bentlerinde yazılı koşulları taşıyan ve Hukuk Mesleklerine Giriş Sınavında başarılı olanlardan, stajyer olarak sürekli staj yapmalarına engel işleri ve 5 inci maddede yazılı engelleri bulunmayanlar, staj yapacakları baroya bir dilekçe ile başvururlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukatlık stajına fiilen engel olmamak şartıyla herhangi bir işte sigortalı olarak çalışılması avukatlık stajının yapılmasına engel değildir. Adli ve idari yargı hâkim ve savcı adayları veya yardımcıları ile hâkim ve savcılar hariç olmak üzere, kamu kurum ve kuruluşlarının kadro veya pozisyonlarında görev yapanlar da görev yeri saklı kalmak kaydıyla mahkemelerde yapılan staj sürecinde aylıksız veya ücretsiz izinli olarak avukatlık stajı yapabilir. Bu dönemde ilgilinin talebi üzerine yıllık izinler de kullandırılabilir. Avukat yanında yapılacak staj sürecinde ise kamu kurum ve kuruluşu tarafından ilgilinin ifa ettiği kamu görevini aksatmayacak şekilde çalışma saatleri ile izin dönemleri ve süreleri düzenlenebilir. Ancak ifa edilen kamu görevinin niteliğinden dolayı aynı anda staj yapma durumunda kamu görevinde aksama ortaya çıkacağı hallerde avukat yanında yapılan staj sürecinde de ilgiliye aylıksız veya ücretsiz izin verilebilir. Şu kadar ki, ilgili mevzuatında memur kadrolarına geçiş hakkı tanınan sözleşmeli personel ancak memur kadrolarına geçiş hakkını kazandıktan sonra bu fıkrada yer alan hükümlerden yararlanabilir. Bu fıkrada belirtilen aylıksız veya ücretsiz izinler diğer mevzuatta yer alan sınırlamalara tabi değildir. Kamu kurum ve kuruluşlarının kadro veya pozisyonlarında görev yapanların staj sürecindeki izin dönemleri ve süreleri ile çalışma saatlerinin düzenlenmesine ilişkin usul ve esaslar Cumhurbaşkanlığınca çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Dilekçeye eklenecek belgeler">
      <mvz-fıkra no="1">
        <template>16 ncı madde gereğince verilecek dilekçeye, aşağıda gösterilen belgeler eklenir.</template>
        <mvz-bent no="1.">
          <template>Kanunun aradığı şartlara ilişkin belgelerin asılları ile onanmış ikişer örneği,</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Adayın 3 üncü maddenin (f) ve 5 inci maddenin (a) bendlerinde yazılı halleri bulunmadığını gösteren bildiri kâğıdı,</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Yanında staj göreceği avukatın yazılı muvafakati,</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>Adayın ahlak durumu hakkında, staj yaptığı baroya kayıtlı iki avukat tarafından düzenlenmiş tanıtma kağıdı.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu belgelerin birer örneği baro başkanı tarafından onaylanarak Türkiye Barolar Birliğine gönderilir. Diğer örnek veya asılları barodaki dosyasında saklanır. 22 nci maddenin 2 ve 3 üncü fıkralarında yazılı hallerde, adayın yanında staj göreceği avukatın yazılı muvafakatine ait belge aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Staj isteminde bulunan tarafından verilen bildiri kağıdının hilafı ortaya çıktığı takdirde adaya Cumhuriyet savcısı tarafından ikiyüz Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="İstemin ilanı">
      <mvz-fıkra no="1">
        <template>Adayın istemi, yukarıdaki maddede yazılı hususlarla birlikte, istem tarihinden itibaren on gün içinde baronun ve adalet dairesinin uygun bir yerinde onbeş gün süre ile asılarak ilan olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Her avukat veya stajyer yahut diğer ilgililer, bu süre içinde, adayın stajyer listesine yazılmasına itirazda bulunabilirler. Şu kadar ki, itirazın incelenebilmesi, açık delil veya vakıaların gösterilmiş olmasına bağlıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Rapor">
      <mvz-fıkra no="1">
        <template>Baro başkanı, istemin ilanından önce, baroya bağlı avukatlardan birini adayın gerekli nitelikleri taşıyıp taşımadığını ve avukatlıkla birleşmiyen bir işle uğraşıp uğraşmadığını araştırarak bir rapor düzenlemek üzere görevlendirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Görevlendirilen avukat, raporu en geç onbeş gün içinde baroya vermekle yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Karar">
      <mvz-fıkra no="1">
        <template>Baro yönetim kurulu, itiraz süresinin bitmesinden itibaren bir ay içinde, 19 uncu maddede yazılı raporu da göz önünde tutarak, adayın stajyer listesine yazılıp yazılmaması hakkında gerekçeli bir karar verir. Karar ilgiliye tebliğ edilmekle beraber, bir örneği de incelenmek üzere dosyası ile birlikte o yer Cumhuriyet Savcılığına verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu karar aleyhine baro yönetim kurulu üyeleri karar tarihinden, o yer Cumhuriyet savcısı kararın kendisine verildiği, ilgili ise kararın kendisine tebliğ edildiği tarihten itibaren onbeş gün içinde Türkiye Barolar Birliğine itiraz edebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada yazılı süre içinde bir karar verilmemiş olması halinde talep reddedilmiş sayılır. Bu takdirde, bir aylık sürenin bitiminden itibaren onbeş gün içinde aday Türkiye Barolar Birliğine itiraz edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Türkiye Barolar Birliğinin itiraz üzerine verdiği kararlar Adalet Bakanlığına ulaştığı tarihten itibaren iki ay içinde Bakanlıkça karar verilmediği veya karar onaylandığı takdirde kesinleşir. Ancak Adalet Bakanlığı uygun bulmadığı kararları bir daha görüşülmek üzere, gösterdiği gerekçesiyle birlikte Türkiye Barolar Birliğine geri gönderir. Geri gönderilen bu kararlar, Türkiye Barolar Birliği Yönetim Kurulunca üçte iki çoğunlukla aynen kabul edildiği takdirde onaylanmış, aksi halde onaylanmamış sayılır; sonuç Türkiye Barolar Birliği tarafından Adalet Bakanlığına bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Adalet Bakanlığının yukarıdaki fıkra uyarınca verdiği kararlara karşı, Türkiye Barolar Birliği, aday ve ilgili baro; Adalet Bakanlığının onaylamayıp geri göndermesi üzerine Türkiye Barolar Birliğinin verdiği kararlara karşı ise, Adalet Bakanlığı, aday ve ilgili baro idari yargı merciine başvurabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Stajın başlangıcı">
      <mvz-fıkra no="1">
        <template>Avukatlık stajı listeye yazılma ile başlar. İtiraz yazılmayı durdurur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Yanında staj yapılacak avukat">
      <mvz-fıkra no="1">
        <template>Avukat yanında staja başlıyabilecekleri Cumhuriyet savcılığınca baroya bildirilenler, evvelce dilekçelerinde gösterdikleri ve muvafakatini aldıkları avukat yanında staja başlarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Baro başkanının isteği veya ilgililerin başvurması üzerine, baro yönetim kurulu, stajın dilekçede gösterilenden başka bir avukat yanında yapılmasına karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>17 nci maddenin 3 üncü bendinde yazılı belgeyi almak imkânını bulamıyan adayların hangi avukat yanında staj göreceğini baro başkanı tayin eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Avukat, ikinci ve üçüncü fıkralardaki hallerde stajiyeri kabul zorunluluğundadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Stajın yapılması ve stajiyerin ödevleri">
      <mvz-fıkra no="1">
        <template>Staj kesintisiz olarak yapılır. Stajyerin haklı nedenlere dayanarak devam etmediği günler, engelin kalkmasından sonraki bir ay içinde başvurduğu takdirde, mahkeme stajı sırasında Adalet Komisyonu, avukat yanındaki staj sırasında ise baro yönetim kurulu kararı ile tamamlattırılır. Stajın yapıldığı yere göre adalet komisyonu başkanı ve baro başkanı, haklı bir engelin bulunması halinde yanında staj yaptığı avukatın da görüşünü alarak stajyere otuz günü aşmamak üzere izin verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Stajyer, avukatla birlikte duruşmalara girmek, avukatın mahkemeler ve idari makamlardaki işlerini yapmak, dava dosyaları ve yazışmaları düzenlemek, baroca düzenlenen eğitim çalışmalarına katılmak, baro yönetim kurulunca verilen ve yönetmelikte gösterilecek diğer ödevleri yerine getirmekle yükümlüdür. Stajyerler, meslek kurallarına ve yönetmeliklerde belirlenen esaslara uymak zorundadırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Staj raporları">
      <mvz-fıkra no="1">
        <template>Staj, Adalet Komisyonunun, baronun ve yanında çalışılan avukatın gözetimi altında yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Stajiyer hakkında, yanında staj gördüğü hâkimler, Cumhuriyet savcıları tarafından staj durumu, mesleki ilgisi ve ahlaki durumunu belirten bir belge verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yanında staj görülen avukat tarafından, ilk üç ayın bitiminde ve staj süresinin sonunda da kesin olarak, staj durumunu ve adayın mesleki ilgisi ile ahlaki durumunu da kapsayan bir rapor verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Staj süresinin uzatılması">
      <mvz-fıkra no="1">
        <template>Baro yönetim kurulu, stajyer hakkında verilen raporları değerlendirir, gerektiğinde kurul üyelerinden birini görevlendirmek suretiyle yapılacak inceleme sonuçlarını da göz önünde tutarak staj bitim belgesinin verilmesine veya staj süresinin altı aya kadar uzatılmasına karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yönetim kurulunun bu kararı kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Stajyerlerin yapabileceği işler">
      <mvz-fıkra no="1">
        <template>Stajyerler, avukat yanında staja başladıktan sonra, avukatın yazılı muvafakati ile ve onun gözetimi ve sorumluluğu altında, sulh hukuk mahkemeleri, sulh ceza mahkemeleri ile icra tetkik mercilerinde avukatın takip ettiği dava ve işlerle ilgili duruşmalara girebilir ve icra müdürlüklerindeki işleri yürütebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yetki, staj bitim belgesinin verilmesi veya staj listesinden silinme ile sona erer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Stajiyerlere barolarca yapılacak yardım">
      <mvz-fıkra no="1">
        <template>Staj süresince stajyerlere Türkiye Barolar birliğince kredi verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ödenecek kredinin kaynağı; avukatların yetkili mercilere sunduğu vekâletnamelere avukatın yapıştıracağı pul bedelleri ile geri ödemeden gelen paralar ve bunların gelirleridir. Bu pullar, Türkiye Barolar Birliğince bastırılır.  Yapıştırılacak pulun değeri; 2.7.1964 tarihli ve 492 sayılı Harçlar Kanununun Yargı Harçları bölümünde yer alan vekâletname örnekleri için kullanılan harç tarifesinin yüzde elli fazlası kadarıdır.  Her yıl yenilenen vekâlet pulu bedeline ayrıca yüzde beş oranında ilave yapılır. Bu suretle elde edilecek kaynak avukat stajyerlerinin genel sağlık sigortası primlerinin ödenmesinde kullanılır. Kaynağın yetersizliği durumunda staj kredi fonundan aktarım yapılarak prim ödemesi yapılır. Bu primler Türkiye Barolar Birliği tarafından ödenir.  Bu şekilde toplanan tüm pul bedelleri malî yönden Sayıştay denetimine tâbidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Avukatlarca vekâletname sunulan merciler, pul yapıştırılmamış veya pulu noksan olan vekâletname ve örneklerini kabul edemez. Gerektiğinde ilgiliye on günlük süre verilerek bu süre içinde pul tamamlanmadıkça vekâletname işleme konulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kredi ödemelerinden arta kalan miktar, meslektaşlara destek ve meslekte gelişmeyi sağlamakta kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu kredinin ilke ve koşulları, kimlere verileceği, miktarı, geri ödeme şekli, geri ödemeden gelen paralar ile kredi ödemelerinden sonra arta kalan miktarın barolar ve Türkiye Barolar birliği arasında dağıtım ve sarf esasları ve diğer hususlar Türkiye Barolar Birliği Yönetim kurulunca hazırlanacak ve Adalet Bakanlığınca onaylanacak yönetmelikte gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Pul bedelleri ile geri ödemeden gelen paralar ve bunların gelirleri, kredi ödemelerinden arta kalan miktarın dağıtımı ve sarfı, her yıl Adalet Bakanlığı tarafından ek 4 üncü maddedeki esas ve usullere göre denetlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27/A" başlık="Sosyal yardım ve dayanışma fonu">
      <mvz-fıkra no="1">
        <template>Türkiye Barolar Birliği nezdinde sosyal güvenlik, sosyal yardım ve dayanışma hizmetlerinde kullanılmak üzere kaynağı bu Kanunun 27 nci maddesinin ikinci fıkrasında gösterilen gelirlerin yarısı olan "Sosyal Yardım ve Dayanışma Fonu" kurulmuştur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu fondan yapılacak harcamaların esas ve usulleri ile diğer hususlar Türkiye Barolar Birliği Yönetim Kurulunca hazırlanacak ve Adalet Bakanlığınca onaylanacak yönetmelikte gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Fon gelirleri ile harcamaları her yıl Adalet Bakanlığı tarafından ek 4 üncü maddedeki esas ve usullere göre denetlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
