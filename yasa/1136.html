        <template>Ankara Baro Başkanı, bu Kanunun yürürlüğe girdiği tarihten itibaren iki ay içinde Ankara'da toplanıp Türkiye Barolar Birliği Başkanı ile Birlik Yönetim Kurulu, Birlik Disiplin Kurulu ve Birlik Denetleme Kurulu üyelerini ve yedeklerini seçecek olan ilk genel kurul için delegelerini seçip göndermelerini ve toplantı yer, gün ve saatini, toplantı gününden en az bir ay önce barolara bildirir. Belirtilen günde toplantıyı açarak yerini en yaşlı delegeye bırakır.</template>

    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>708 sayılı Kanunun ikinci ve 7 nci maddelerinde ve 2573 sayılı Kanunun 6 ncı maddesinde yazılı mülazemet süresini 3499 sayılı Avukatlık Kanununun yürürlüğü tarihinde bitirmiş olanlar 3 üncü maddenin (a), (b) ve (c) bentlerinde ve 5 inci maddede gösterilen şartlara sahip oldukları takdirde baro levhasına yazılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun uygulanmasında Medresetulkuzat ve Nüvap Mektebi mezunları hukuk mezunu sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Gerek 3499 sayılı Kanun ve gerekse bu Kanunun yürürlüğe girmesinden sonra dava vekâleti ruhsatnamesi ile 708 sayılı Kanunun 5 inci maddesine dayanılarak avukatlık ruhsatnamesi verilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, hukuk fakültesi veya mektebinden mezun olmadıkları halde 3499 sayılı Kanunun yürürlüğünden önce hâkimlik veya savcılık sınıflarında, 3499 sayılı Kanunun yürürlüğünden önce veya sonraki görev sürelerinin toplamı dört yılı doldurmuş olanlara 3 üncü maddenin (b) ve (c) bentlerindeki kayıtlardan vareste tutulmak şartiyle avukatlık ruhsatnamesi verilir. Sicilleri itibariyle görevlerinden çıkarılmış olanlar hakkında bu hüküm uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>3499 sayılı Kanunun yürürlüğe girdiği tarihte dava, vekâleti ruhsatnamesine sahip olanlar, beş avukat bulunmıyan yerlerde vekâlet icra edebilirler. Bu Kanunun yürürlüğe girmesinden önce 3499 sayılı Kanunun  maddesi uyarınca beş avukat bulunmıyan yerlerde dava vekilliği yapmakta olanların kazanılmış hakları saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dava vekillerinin, mesleklerini icra edebilmeleri için, o yerin bağlı olduğu baroca tutulan bir listeye yazılmaları şarttır. Listeye yazılmak için yapılan başvuru üzerine barolar, istemin kabul veya reddine dair kararlarını bir ay içinde vermek zorundadır. Bu süre içinde karar verilmez yahut ret kararı verilir ise ilgili şahıs; karar verilmemiş ise bir aylık sürenin sonunda, istem reddedilmiş ise ret kararının tebliği tarihinden itibaren onbeş gün içinde Türkiye Barolar Birliği Yönetim Kuruluna itiraz edebilir. Türkiye Barolar Birliğinin itiraz üzerine verdiği kararlar Adalet Bakanlığına ulaştığı tarihten itibaren iki ay içinde Bakanlıkça karar verilmediği veya karar onaylandığı takdirde kesinleşir. Ancak Adalet Bakanlığı uygun bulmadığı kararları bir daha görüşülmek üzere, gösterdiği gerekçesiyle birlikte Türkiye Barolar Birliğine geri gönderir. Geri gönderilen bu kararlar Türkiye Barolar Birliği Yönetim Kurulunca üçte iki çoğunlukla aynen kabul edildiği takdirde onaylanmış, aksi halde onaylanmamış sayılır; sonuç Türkiye Barolar Birliği tarafından Adalet Bakanlığına bildirilir. 8 inci maddenin altıncı ve yedinci fıkraları hükümleri burada da kıyasen uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Listeye yazılma, bu Kanunun davavekillerine tanıdığı hak ve yetkilerden faydalanmak ve yükümlere tabi olmak bakımından, baro levhasına yazılmanın sonuçlarını doğurur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Listenin barolarca nasıl düzenleneceği, listeye yazılmak için yapılacak başvurma hakkındaki işlemler listenin mahkemelere, Cumhuriyet savcılıklarına, icra ve iflas dairelerine ve diğer resmi mercilere bildirilme tarzı ve listeden kaydın silinmesi şekli bu Kanunun 182 inci maddesinde yazılı yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>3499 sayılı Kanunla ek ve değişikliklerine göre kurulmuş olan barolar, bu Kanun hükümlerine göre görevlerine devam ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>168 inci madde uyarınca hazırlanacak asgari ücret tarifesi, bu Kanunun yürürlüğe girdiği tarihten itibaren altı ay içinde yapılır ve yeni tarife yürürlüğe girinceye kadar eski tarife uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Türkiye Barolar Birliği Disiplin Kurulu görevine başlayıncaya kadar, avukatlık haysiyet divanındaki dosyalar, bu kurula devredilmek üzere Ankara Baro Başkanlığınca teslim alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yargı mercileri, Cumhuriyet savcılıkları, icra memurlukları nezdinde başkâtiplik, zabıt kâtipliği, zabıt kâtibi muavinliği yahut icra memurluğu veya yardımcılığı görevlerinden birini en az on yıl süre ile yapmış olan kimseler, bu Kanunun 3 üncü maddesi uyarınca Avukatlık meslekine kabul için aranılan tahsil, staj  dışındaki şartları haiz olurlar ve 5 inci maddede yazılı engeller kendilerinde bulunmazsa, en az üç avukat veya davavekili olmıyan bir yerde, o yerin bağlı olduğu baroca tutulan listeye yazılmak şartiyle, munhasıran o yerin hukuk mahkemeleri ve icra ve iflas dairelerinde dava ve iş takib edebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kimseler, munhasıran vekâlet görevini yapabilecekleri yerde, listeye yazılma tarihinden itibaren üç ay içinde bir büro açmak zorundadırlar. Bu zorunluluğa uymıyanların adları listeden silinir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce, 1086 sayılı Hukuk Usulü Muhakemeleri Kanununun 61 inci maddesinin son fıkrası gereğince vekâlet görevini yapanlar, geçmiş adalet hizmetine ait şarta bakılmaksızın, birinci fıkrada, yazılı diğer şartlara sahip oldukları takdirde, o yerin bağlı bulunduğu baroca tutulan listeye yazılmak suretiyle, munhasıran o yerdeki hukuk mahkemeleri ve icra ve iflas dairelerinde vekâlet görevini yapmaya devam ederler. Ancak, listeden herhangibir suretle adları silinenler, birinci fıkrada yazılı şartların tamamına sahip olmadıkça bir daha listeye yazılamazlar. Bu kimseler, bu maddenin yürürlüğe girdiği tarihten itibaren üç ay içinde listeye yazılmak için başvurmak ve yazılma tarihinden itibaren üç ay içinde bir büro açmak zorundadırlar. Aksi halde listeye yazılmazlar; listeye yazılmışlarsa adları listeden silinir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıdaki fıkralar uyarınca vekâlet görevini yapmak hakkı o yer avukat veya dava vekilleri sayısının üçü bulması halinde kendiliğinden sona erer. Sona erme tarihinden itibaren üç ay içinde, ilgili şansın aynı baro bölgesi içinde üç avukat veya dava vekili bulunmayan başka bir yere naklederek büro açması halinde, listedeki kaydı, nakledilen yer işaret edilmek suretiyle devam eder. İlgili üç aylık süre içinde başka bir baroya başvurduğu takdirde, dosyası getirilmek suretiyle başvurduğu baronun listesine kaydı yapılıp ayrıldığı baronun listesinden de adı silinerek vekâlet görevine devam eder. Üç aylık süre içinde aynı baro bölgesindeki başka bir yere nakil yapılarak büro açılmaması veya bu süre dolmadan başka bir baroya nakil için başvurulmaması halinde ilgilinin adı listeden silinir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Geçici 13 üncü maddenin listeye yazılma için yapılacak başvurma ile ilgili ikinci fıkrası hükmü bu kimseler hakkında da kıyasen uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Listeyle ilgili olup, geçici 13 üncü maddenin son fıkrasında gösterilen hususlar ve bu maddeye göre vekâlet görevini ifa edeceklere verilecek yetki belgesinin neleri ihtiva eyliyeceği 182 nci maddede yazılı yönetmelikte gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu Kanunun ikinci, dördüncü, beşinci, yedinci, sekizinci, dokuzuncu, onbirinci ve onikinci kısmı ile 49, 57, 58, 59, 60, 61, 62 ve 65 inci maddeleri dışında kalan hükümleri bu maddenin kapsamına giren kimseler hakkında da kıyasen uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Baro giriş ve yıllık kesenekleri bu maddenin kapsamına giren kimselerden alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu maddenin üçüncü fıkrası 7 Temmuz 1977 tarihinde yürürlükten kalkar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Geçici 3 ve 4 üncü maddeler uyarınca borçlanılarak emekliliğe esas hizmetlerine eklenen sürelerin üçte ikisi, ilgililerin halen bulundukları görevin veya hizmetin en az yükselme süresine göre iki veya üç yılda bir değerlendirilmek suretiyle intibakları yapılır ve böylece görev veya hizmet aylıkları ile emeklilik keseneğine esas aylıkları yükseltilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte, bu Kanunun 1 nci maddesi ile Avukatlık Kanununun 14 üncü maddesine eklenen fıkrada belirtilenlerin sıkıyönetim askeri mahkemelerinde almış oldukları davalar Avukatlık Kanununun hükümleri dairesinde üç ay içinde devredilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>10.5.2001 tarihinden önce ilköğretim veya orta öğretimde öğretmenlik görevi ile avukatlık mesleğini birlikte yapanlar ve aynı durumda olup avukatlık stajını yapmakta olanlar hakkında 11 inci madde hükmü uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İptal</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarih itibarıyla ödenmemiş baro keseneği borcunun tamamının, bu maddenin yürürlük tarihinden itibaren altı ay içinde ödenmesi halinde, işlemiş faiz borcu silinir. Baro keseneğinin ödenmemesine bağlı olarak yürütülen levhadan ve sicilden silme işlemleri, altı ay süreyle durdurulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Görev sürelerine bakılmaksızın tüm barolarda baro başkanlığı, yönetim, disiplin ve denetleme kurulu üyelikleri ile Türkiye Barolar Birliği delege seçimleri 2020 yılı Ekim ayının ilk haftasında; Birlik Başkanlığı, yönetim, disiplin ve denetleme kurulu üyelikleri seçimleri ise 2020 yılı Aralık ayı içinde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>59 uncu maddenin beşinci fıkrası, bu maddeyi ihdas eden Kanunun yayımlandığı tarihten itibaren on beş gün içinde talep etmek koşuluyla avukatların, avukatlık veya Türkiye Barolar Birliği ya da baroların organlarındaki görevlerinden doğan veya görev sırasında işledikleri suçlar nedeniyle bölge adliye mahkemesi ceza dairelerince 15/7/2020 tarihinden önce verilmiş kesin nitelikteki kararları hakkında da uygulanır. Bu maddenin uygulandığı hâlde, cezası infaz edilmekte olan hükümlülerin, Ceza Muhakemesi Kanununun 100 üncü maddesi uyarınca tutukluluğunun devam edip etmeyeceği hususu, hükmü veren ilk derece mahkemesince değerlendirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce avukatlık stajına başlamış olanlar hakkında bu maddeyi ihdas eden Kanunla 16 ncı maddenin ikinci fıkrasında yapılan değişiklikten önceki hükümlerin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesinden sonra, değiştirilen 168 nci madde hükümleri uyarınca hazırlanacak ilk tarifeler yürürlüğe girinceye kadar açılan davalar veya başlayan hukuki yardımlarla ilgili olarak değer veya miktarın bir milyar lirayı aşan bölümü için takdir edilecek nispi avukatlık ücretinin hesabında, yürürlükte olan tarifelere bakılmaksızın, binde bir oranı uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="199" başlık="">
      <mvz-fıkra no="1">

      </mvz-fıkra>
