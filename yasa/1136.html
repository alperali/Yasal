          <mvz-bent no="4.">
            <template>Türkiye barolarını ve mensuplarını birbirine tanıtarak aralarındaki meslek bağını kuvvetlendirmek,</template>

          <mvz-bent no="5.">
            <template>Her il merkezinde baro kurulmasına ve vatandaşlarda kendilerine ait davaları avukatlar eliyle açmanın ve savunmanın lüzum ve faydaları hakkındaki inancı yerleştirmeye çalışmak,</template>

          <mvz-bent no="6.">
            <template>Kanunların memleket ihtiyaçlarına uygun olarak gelişmesi ve yürütülmesi yolunda dileklerde, yayınlarda bulunmak, gerekirse ön tasarılar hazırlamak,</template>

          <mvz-bent no="7.">
            <template>Baroları ilgilendiren konularda görüşünü yetkili mercilere duyurmak,</template>

          <mvz-bent no="8.">
            <template>Adalet Bakanlığının, yargı veya yasama yetkisini taşıyan mercilerin ve baroların soracakları adli ve mesleki konular hakkında görüş ve düşüncelerini rapor halinde bildirmek,</template>

            <template>Avukatların meslekte gelişmelerini teşvik edecek ve sağlıyacak her türlü tedbirleri almak,</template>

          <mvz-bent no="10.">
            <template>Mahkeme içtihatlarının sistemli bir surette toplanması ve yayınlanması için Adalet Bakanlığı ve yargı mercileri ile işbirliği yapmak,</template>
          </mvz-bent>
          <mvz-bent no="11.">
            <template>Kanunların avukatlara tanıdığı hakların gerçekleşmesine ve yüklediği görevlerin tam ve şerefli bir şekilde yerine getirilmesine çalışmak,</template>
          </mvz-bent>
          <mvz-bent no="12.">
            <template>Baro mensuplarının ilmi ve mesleki seviyelerini yükseltmek için kitaplık açmak, dergi çıkarmak, konferanslar düzenlemek, telif ve tercüme eserler meydana getirilmesini teşvik etmek,</template>
          </mvz-bent>
          <mvz-bent no="13.">
            <template>Meslekin daha cazip bir hale getirilmesi ve bu konuda yazılı amaçlara erişilebilmesi için düşünülecek çare ve tedbirleri görüşmek üzere zaman zaman toplantılar düzenlemek,</template>
          </mvz-bent>
          <mvz-bent no="14.">
            <template>Memleket içinde kurulmuş hukukla ilgili kurul ve kurumlarla ilgilenmek ve temaslarda bulunmak,</template>

          <mvz-bent no="15.">
            <template>Yabancı memleket baroları, avukatlar birlikleri ve hukuk kurumları ile temaslarda bulunmak ve uluslararası kongrelere katılmak,</template>
          </mvz-bent>
          <mvz-bent no="16.">
            <template>Uyulması zorunlu meslek kurallarını tespit ve tavsiye etmek,</template>
          </mvz-bent>
          <mvz-bent no="17.">
            <template>Hukukun üstünlüğünü ve insan haklarını savunmak ve korumak, bu kavramlara işlerlik kazandırmak.</template>
          </mvz-bent>
          <mvz-bent no="18.">
            <template>Kanunlarla verilen diğer yetkileri kullanmak.</template>
          </mvz-bent>

      <mvz-madde no="111" başlık="Yasaklar, mal edinme, protokoldeki yer, görevden uzaklaştırma ve göreve son verme">
        <mvz-fıkra no="1">
          <template>Türkiye Barolar Birliği, kuruluş amaçları dışında faaliyette bulunamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birlik, amacına uygun işlerde kullanılmak üzere taşınır ve taşınmaz mal edinebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birlik, protokol kurallarına göre resmi törenlere katılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Türkiye Barolar Birliği Başkanı, protokolde Yargıtay Cumhuriyet Başsavcısının yanında yer alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>77 nci maddenin beş, altı, yedi sekiz ve dokuzuncu fıkra hükümleri Birlik organları hakkında da uygulanır.  Ancak, görevine son verilen organın Birlik Yönetim Kurulu olması halinde yeni seçilenlerin görevine başladığı tarihe kadar bu organın görevleri, kararı veren mahkemece son genel kurul delegeleri arasından görevlendirilecek en az üç avukat tarafından geçici yönetim kurulu sıfatıyla yürütülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="112" başlık="Görevlerin ücretli oluşu">
        <mvz-fıkra no="1">
          <template>Türkiye Barolar Birliği Başkanlığı, başkan yardımcılığı, genel sekreterliği ve saymanlığı görevleri ücretlidir. Birlik Yönetim Kurulunun başkanlık divanında görev almamış olan üyeleri ile disiplin ve denetleme kurulları üyelerine, katıldıkları toplantılar için huzur hakkı ödenir. Ücretlerle huzur hakkının miktarları ve ödenme şekilleri birlik genel kurulunca belli edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu kimselerden Ankara'dan başka illerden seçilenlere yolculuk, ikamet giderleri ile diğer zaruri giderler birlik bütçesinden ödenir. Bunların miktarı da genel kurulca belli edilir.</template>
        </mvz-fıkra>

            <template>Türkiye Barolar Birliğinin en yüksek organı Genel Kuruldur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Genel Kurul, baroların avukatlıkta en az on yıl kıdemi olan üyeleri arasından gizli oyla seçecekleri üçer delege ile kurulur. Görevde bulunan baro başkanları ile Türkiye Barolar Birliği Başkanlığı yapmış ve yapmakta olan avukatlar, Birlik Genel Kurulunun doğal üyesidirler, oylamalara katılma, seçme ve seçilme hakları vardır.</template>

          <mvz-fıkra no="7">
            <template>Genel Kurul toplantısının yeri, tarihi ve gündemi ile delegelerini gönderme lüzumu, toplantılardan en az otuz gün önce, barolara yazı ile bildirilir. Asıl üyenin mazereti olduğu takdirde, yedek üye Türkiye Barolar Birliği Genel Kuruluna katılır ve oy kullanır.</template>

        <mvz-madde no="115" başlık="Toplantılar">

          <mvz-fıkra no="2">

          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Adalet Bakanı, adaletin ve meslekin genel menfaatleri  hakkında görüş ve düşüncelerini almak üzere Genel Kurulun olağanüstü toplantıya çağırılmasını Birlik Yönetim Kurulundan istiyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birlik Genel Kurulu başkanlık divanının seçimi hakkında 85 inci maddenin birinci fıkrası hükmü kıyasen uygulanır. Birlik organlarında görev alanlar, başkanlık divanına seçilemezler.</template>

        <mvz-madde no="116" başlık="Görüşme ve karar yeter sayısı">

          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>87 nci maddenin 3, 4 ve 5 inci fıkraları ve 88 inci madde hükmü Birlik Genel Kurulu toplantıları ve görüşmeleri hakkında da kıyasen uygulanır.</template>

            <mvz-bent no="6.">

            <mvz-bent no="7.">

            </mvz-bent>
            <mvz-bent no="8.">
              <template>Baroların birlik adına avukatlardan tahsil edeceği keseneğin miktarını her avukat için yıllık baro keseneğinin yarısından fazla olmamak üzere tespit etmek,</template>
            </mvz-bent>
            <mvz-bent no="9.">
              <template>Birlik başkanı, başkan yardımcıları, genel sekreteri ve saymanının ücretleri ile yönetim, disiplin ve denetim kurulları üyelerine verilecek huzur hakları miktarını ve ödenme şeklini belli etmek,</template>
            </mvz-bent>
            <mvz-bent no="10.">
              <template>Bu Kanunun 49 ve 75 inci maddelerinde Birliğe verilen görevleri yerine getirmek ve yetkileri kullanmak,</template>

            <mvz-bent no="11.">
              <template>Kanunlarla verilen diğer yetkileri kullanmak.</template>
            </mvz-bent>

      <mvz-b1 no="II" başlık="Türkiye Barolar Birliği yönetim kurulu">

            <template>Birlik yönetim kurulu, birlik başkanı ile, birlik genel kurulu tarafından kendi üyeleri arasından gizli oyla seçilen on üyeden kurulur. Ayrıca on yedek üye seçilir.</template>

            <template>Birlik yönetim kuruluna birlik başkanı başkanlık eder.</template>

          <mvz-fıkra no="2">
            <template>90 ıncı maddenin 2, 3, 4, 5 ve 6 ncı fıkraları ve 92 nci madde hükmü Birlik Yönetim Kurulu üyeleri hakkında da kıyasen uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="120" başlık="Toplantılar">
          <mvz-fıkra no="1">
            <template>Birlik Yönetim Kurulu ayda bir defa olağan toplantı yapar. Başkan veya Yönetim Kurulu üyelerinden birinin isteği ile kurul, acele hallerde her zaman olağan üstü toplantıya çağırılabilir.</template>

            <template>Her toplantı sonunda, gelecek toplantının günü kararlaştırılır. Toplantı günü, üyelere çağrı mektubu ile bildirilir. Engeli olanlar, bunu en az yedi gün önce yazı ile bildirirler.</template>

          <mvz-fıkra no="3">

          <mvz-fıkra no="4">

  <mvz-kısım no="10-ONUNCU" başlık="Disiplin İşlem ve Cezaları">
    <mvz-madde no="134" başlık="Disiplin Cezalarının uygulanacağı haller">
      <mvz-fıkra no="1">
        <template>Avukatlık onuruna, düzen ve gelenekleri ile meslek kurallarına uymayan eylem ve davranışlarda bulunanlarla, meslekî çalışmada görevlerini yapmayan veya görevinin gerektirdiği dürüstlüğe uygun şekilde davranmayanlar hakkında bu Kanunda yazılı disiplin cezaları uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="135" başlık="Disiplin cezaları">
      <mvz-fıkra no="1">
        <template>Disiplin cezaları şunlardır:</template>
        <mvz-bent no="1.">
          <template>Uyarma; avukatın mesleğinin icrasında daha dikkatli davranması gerektiğinin kendisine bildirilmesidir.</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Kınama; meslekinde ve davranışında kusurlu sayıldığının avukata bildirilmesidir.</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Onbin liradan yüzellibin liraya kadar para cezası.</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>İşten çıkarma, avukatın veya avukatlık ortaklığının üç aydan az ve üç yıldan fazla olmamak üzere meslekî faaliyetlerinin yasaklanmasıdır.</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>Meslekten çıkarma; avukatlık ruhsatnamesinin geri alınarak avukatın adının baro levhasından silinmesi ve avukatlık unvanının kaldırılmasıdır.  Avukatlık ortaklığı için de baro avukatlık ortaklığı sicilinden silinmesidir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="136" başlık="Cezaların uygulanma şekli">
      <mvz-fıkra no="1">
        <template>Bu kanunun avukatların hak ve ödevleri ile ilgili altıncı kısmında yazılı esaslara uymıyanlar hakkında ilk defasında en az kınama, tekrarında, davranışın ağırlığına göre, para veya işten çıkarma cezası ve 5 inci maddenin (a) bendinde yazılı bir suçtan kesin olarak hüküm giyme halinde meslekten çıkarma cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Beş yıllık bir dönem içinde iki veya daha çok defa disiplin cezasını gerektiren davranışta bulunan avukata her yeni suçu için bir öncekinden daha ağır ceza uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bir defa işten çıkarılan avukat, beş yıllık dönem içinde bu kanunun altıncı kısmındaki kurallara aykırı davranışta bulunursa meslekten çıkarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="137" başlık="Savunma hakkı">
      <mvz-fıkra no="1">
        <template>Avukatlar hakkında yapılacak kovuşturmalarda, isnat olunan hususun avukata açıkça ve yazılı olarak bildirilmesi, yazılı savunmasının istenmesi ve bu savunma için en az on günlük bir süre tanınması zorunludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="138" başlık="Baroya yazılmadan önceki ve meslekten ayrıldıktan sonraki eylem ve davranışlar">
      <mvz-fıkra no="1">
        <template>Baro levhasına kabul ve yazılmadan önceki eylem ve davranışlar, meslekten çıkarma cezasını gerektirmedikçe disiplin kovuşturmasına konu olamaz. Staj dönemi bu hükmün dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukatın, avukatlıktan ayrılması, avukatlığı sırasındaki eylem ve davranışlarından dolayı disiplin kovuşturması yapılmasına engel değildir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="139" başlık="Kovuşturma yetkisi ve eksik üyelerin tamamlanması">
      <mvz-fıkra no="1">
        <template>Kovuşturmanın dayandığı şikâyet veya ihbarın vaki olduğu yahut Cumhuriyet savcısının kovuşturma isteğinde bulunduğu veya kovuşturmaya esas teşkil eden eylem veya davranışın re'sen haber alındığı tarihte avukat hangi baronun levhasında yazılı ise, disiplin kovuşturmasına karar verme ve kovuşturmayı yürütme yetkisi o baroya aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Baro başkanı, baro yönetim ve disiplin kurulu üyeleri, kendi haklarındaki kovuşturmalarla ilgili görüşme ve kararlara katılamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkranın kapsamına giren bir durumun mevcut olması veya ret yahut istinkâf sebepleriyle başkan ve üyelerin katılmamaları yüzünden baro yönetim ve disiplin kurullarında toplantı yeter sayısı bulunamazsa, eksikler yedeklerle tamamlanır. Yedeklerin de herhangi bir sebeple görüşme veya karara katılmamaları yahut sayılarının yetişmemesi halinde, baro levhasında yazılı olup yönetim ve disiplin kurullarına seçilme yeterliği bulunan avukatlar arasından ad çekme yolu ile seçileceklerle eksikler tamamlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="140" başlık="Ceza kovuşturmasının disiplin cezalarına tesiri">
      <mvz-fıkra no="1">
        <template>Avukat hakkında başlamış olan ceza kovuşturması, disiplin işlem ve kararlarının uygulanmasına engel olmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şu kadar ki, disiplin işlem ve kararına konu teşkil edecek bir eylemde bulunmuş olan avukat hakkında aynı eylemlerden dolayı ceza mahkemesinde dava açılmış ise, avukat hakkındaki disiplin kovuşturması, ceza davasının sonuna kadar bekletilir. Bu halde yönetim kurulunun isteği üzerine disiplin kurulu, avukatın işten yasaklanmasına yer olup olmadığı hakkında 153 ve 154 üncü maddeler uyarınca bir karar vermek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Eylemin işlenmemiş veya sanığı tarafından yapılmamış olması sebebiyle beraat hali müstesna, beraatle sonuçlanmış bir ceza davasının konusuna giren eylemlerden dolayı disiplin kovuşturması, o eylemin ceza kanunları hükümlerinden ayrı olarak başlı başına disiplin kovuşturmasını gerektirir mahiyette olmasına bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Baro yönetim kurulları hükümlülükle sonuçlanan bir ceza davasının konusunu teşkil eden eylemlerden dolayı ayrıca disiplin kovuşturması açmak zorundadırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="141" başlık="Disiplin kovuşturmasının açılması">
      <mvz-fıkra no="1">
        <template>Disiplin kovuşturması, yönetim kurulu tarafından verilen bir kararla açılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yönetim kurulu, ivedilikle ve her halde ihbar, şikâyet veya istek tarihinden itibaren en çok bir yıl içinde disiplin kovuşturması hakkında bir karar vermeye mecburdur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yönetim kurulu, ilgilinin ihbar ve şikâyeti veya Cumhuriyet savcısının isteği üzerine yahut re'sen, disiplin kovuşturması açılmasına karar vermeye esas olacak soruşturmanın yapılması görevini kendi üyelerinden birine verebilir. Soruşturma ile görevlendirilen üye, delilleri toplar, gerekli gördüğü kimselerin ifadelerini yeminle de alabilir; hakkında soruşturma yapılan avukatı da dinledikten veya dinlemek için verilen süre dolduktan sonra dosyayı bir raporla yönetim kuruluna verir.  Yönetim kurulu, soruşturma maksadıyla her türlü adlî ve idarî mercilerden bilgi ve belge isteyebilir, ilgili dosyaları veya örneklerini isteyip, inceleyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Şikâyet, ihbar veya istem konusu eylem veya davranış hakkında kovuşturma açılmasına yer olmadığına dair yönetim kurulu tarafından verilecek kararlar ilgililere ve Cumhuriyet savcısına tebliğ olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="142" başlık="Disiplin kovuşturmasına yer olmadığına dair kararlara itiraz">
      <mvz-fıkra no="1">
        <template>Baro yönetim kurulunun, disiplin kovuşturmasına yer olmadığına dair kararlarına karşı, tebliğ tarihinden itibaren 15 gün içinde şikâyetçi veya Cumhuriyet savcısı tarafından Türkiye Barolar Birliği Yönetim Kuruluna itiraz olunabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türkiye Barolar Birliği Yönetim Kurulu tarafından dosya üzerinde yapılacak inceleme sonunda şikâyet, ihbar veya istem konusu incelemeye değer mahiyette görülürse, evvelki karar kaldırılarak, disiplin kovuşturmasının açılması için dosya evvelki kararı veren baroya gönderilir. Türkiye Barolar Birliği Yönetim Kurulunun bu kararları kesindir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Baro Yönetim Kurulunun disiplin kovuşturmasına yer olmadığına dair kararları süresi içinde itiraz edilmezse kesinleşir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkra gereğince yapılan itiraz üzerine, Türkiye Barolar Birliği Yönetim Kurulu tarafından verilen itirazın reddine dair kararlar Adalet Bakanlığına ulaştığı tarihten itibaren iki ay içinde Bakanlıkça karar verilmediği veya karar onaylandığı takdirde kesinleşir. Ancak Adalet Bakanlığı uygun bulmadığı kararları bir daha görüşülmek üzere, gösterdiği gerekçesiyle birlikte Türkiye Barolar Birliğine geri gönderir. Geri gönderilen bu kararlar, Türkiye Barolar Birliği Yönetim Kurulunca üçte iki çoğunlukla aynen kabul edildiği takdirde onaylanmış, aksi halde onaylanmamış sayılır; sonuç Türkiye Barolar Birliği tarafından Adalet Bakanlığına bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>8 inci maddenin 6 ncı ve 7 nci fıkraları hükümleri bu halde de kıyasen uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="143" başlık="Aynı eylemden dolayı yeniden inceleme">
      <mvz-fıkra no="1">
        <template>Disiplin kovuşturması açılmasına yer olmadığına dair kararın konusuna giren eylemlerden dolayı yeniden inceleme yapılabilmesi, yeni delillerin bulunmasına ve bu kararın kesinleştiği tarihten üç yıl geçmemiş olmasına bağlıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="144" başlık="Disiplin kurulunda duruşma">
      <mvz-fıkra no="1">
        <template>Disiplin kovuşturması açılmasına karar verilen hallerde, yönetim kurulunun iletmesi üzerine, disiplin kurulu, incelemesini evrak üzerinde yapar. Disiplin kuruluna gönderilen dosya içinde avukatın sicili de bulunur. Avukatın isteği veya disiplin kurulunca gerek görülmesi halinde, inceleme duruşmalı olarak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Duruşma gizli olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Disiplin kurulu incelemeyi ivedilikle ve herhalde kararın kendisine gelişi tarihinden itibaren en geç bir yıl içinde sonuçlandırmak zorundadır. Ceza davasının sonucunun beklenmesini gerektiren haller saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="145" başlık="Gıyapta duruşma">
      <mvz-fıkra no="1">
        <template>Çağrıya uymıyan avukatın gıyabında duruşma yapılır. Şu kadar ki, duruşmaya gelmediği takdirde duruşmanın gıyabında yapılacağının davetiyeye yazılması şarttır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="146" başlık="Delillerin gösterilmesi ve incelenmesi">
      <mvz-fıkra no="1">
        <template>Disiplin kurulu, delillerin gösterilme ve incelenme şeklini, istek veya feragatle yahut evvelce verilmiş kararlarla bağlı olmaksızın takdir ve tayin eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="147" başlık="Tanık ve bilirkişi dinlenmesi">
      <mvz-fıkra no="1">
        <template>Tanık ve bilirkişinin duruşmaya çağrılması veya üyelerden biri tarafından yahut istinabe yoliyle dinlenmesi veya yazılı ifadesinin okunmasiyle yetinilmesi, disiplin kurulunun takdirine bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, bir olayın delili yalnız bir tanığın şahsi bilgisinden ibaret ise, bu tanık her halde dinlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="148" başlık="Duruşma tutanağı">
      <mvz-fıkra no="1">
        <template>Duruşma tutanağı, disiplin kurulu başkanının görevlendireceği bir üye veya kâtip tarafından tutulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Duruşma dışında dinlenenlere ait tutanakların duruşmada okunması zorunludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="149" başlık="İstinabe talimatının yerine getirilmesi">
      <mvz-fıkra no="1">
        <template>İstinabe yoluyla verilen talimat, baro merkezinde disiplin kurulu veya bu kurulun bir üyesi, diğer yerlerde o baronun disiplin kurulunca görevlendirilecek bir avukat tarafından yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="150" başlık="Tanık ve bilirkişinin çağrılması">
      <mvz-fıkra no="1">
        <template>Tanıklar ve bilirkişiler Tebligat Kanunu hükümlerine göre çağrılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Usulüne göre çağırılıp da hukuken geçerli bir mazereti olmaksızın gelmeyen veya kanuni bir sebep olmaksızın tanıklık yahut bilirkişilikten veya yemin etmekten çekinen kimseler hakkında Ceza Muhakemesi Kanununun tanıklıkla ilgili hükümleri uygulanır. Bu fıkra hükmüne göre gerekli kararları vermeye Baronun bulunduğu il merkezindeki sulh ceza hâkimi yetkilidir. Sulh ceza hâkimi bu kararları disiplin kurulunun tutanak örneği üzerinden verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="151" başlık="Disiplin kurulu üyelerinin reddi ve istinkâfı">
      <mvz-fıkra no="1">
        <template>Disiplin kurulu üyeleri, Ceza Muhakemeleri Usulü Kanununda yazılı sebeplerle reddedilebilir ve istinkâf edebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ret istemi, reddi istenen üyeden başkalarının katılmasiyle incelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ret ve istinkâf sebebiyle kurulun toplanamaması halinde 139 uncu maddeye göre işlem yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="152" başlık="Kararların tebliği">
      <mvz-fıkra no="1">
        <template>Disiplin kurulu kararlarının onanmış bir örneği ilgililerden başka, baronun bulunduğu il merkezindeki Cumhuriyet savcısına da tebliğ olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="153" başlık="İşten yasaklanma">
      <mvz-fıkra no="1">
        <template>Hakkında meslekten çıkarma cezasını gerektirebilecek mahiyette bir işten dolayı kovuşturma yapılmakta olan avukat disiplin kurulu karariyle, tedbir mahiyetinde işten yasaklanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kararın verilmesinden önce ilgilinin dinlenmiş veya dinlenmek üzere çağrılmış olup da belirtilen günde gelmemiş olması şarttır.  Ancak, baroya bildirdiği büro adresine tebligat yapılamayan avukatın ayrıca çağrılması ve dinlenmesi zorunlu değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Disiplin kurulu, bu karara esas olacak delillerin hangi sınır dâhilinde gösterilip inceleneceğini, istekle bağlı olmaksızın, serbestçe takdir eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Karar, hakkında kovuşturma yapılan avukata gerekçesiyle birlikte tebliğ olunur ve bu karar verildiği tarihte yürürlüğe girer. Ancak, karara karşı Türkiye Barolar Birliği Disiplin Kuruluna itiraz olunabilir. İtiraz kararın uygulanmasını durdurmaz. Bu husustaki itirazlar ivedilikle ve en geç bir ay içinde karara bağlanır. İtiraz yerinde görülürse karar kaldırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşten yasaklanma kararı, yargı organları ile sair mercilere baro başkanlığı tarafından derhal duyurulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="154" başlık="İşten yasaklanmanın zorunlu olduğu haller">
      <mvz-fıkra no="1">
        <template>Haklarında meslekten çıkarma cezası verilen veya   ve 42 nci madde uyarınca geçici olarak görevlendirilmiş olup, yapılan işlerin ücretini iş sahibinden aldığı halde aynı maddenin son fıkrası gereğince kabule değer bir sebep olmaksızın ilgili mercie ödememiş olan avukatların işten yasaklanmaları zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıdaki fıkrada belirtilen işten yasaklanma sebeplerinin meydana gelmesinden itibaren iki ay içinde disiplin kurulunca haklarında işten yasaklama kararı verilmeyen avukatlar, Türkiye Barolar Birliği Disiplin Kurulunun doğrudan vereceği kararla işten yasaklanırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="155" başlık="İşten yasaklanmanın hükümleri">
      <mvz-fıkra no="1">
        <template>İşten yasaklanmış olanlar bu tarihten itibaren avukatlığa ait yetkileri hiçbir şekilde kullanamazlar. Bu hüküm avukatın eşi ile reşit olmıyan çocuklarına ait işlerde uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada yazılı yasağa aykırı hareket eden avukat hakkında 135 inci maddenin 4 ve 5 inci bentlerinde yazılı cezalardan biri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mahkemeler, resmi daireler işten yasaklanan avukatları kabul etmemekle görevlidirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="156" başlık="İşten yasaklanma kararının kaldırılması">
      <mvz-fıkra no="1">
        <template>İşten yasaklanma kararı, kovuşturmanın durdurulmuş veya avukatlığa engel olmayan bir ceza verilmiş olması hallerinde kendiliğinden kalkar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşten yasaklanma kararı, bu kararın verilmesine esas olan hal ve şartların bulunmadığı veya sonradan kalktığı sabit olursa, disiplin kurulu tarafından kaldırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="157" başlık="Disiplin kurulu kararına karşı itiraz">
      <mvz-fıkra no="1">
        <template>Disiplin kurulu kararlarına karşı, Cumhuriyet Savcısı ve ilgililer, tebliğ tarihinden itibaren otuz gün içinde Türkiye Barolar Birliği Disiplin Kuruluna itiraz edebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birlik disiplin kurulu, disiplin davalarını dosya üzerinde inceler. Ancak, işten veya meslekten çıkarma cezasına yahut işten yasaklanmaya dair kararların incelenmesi sırasında, ilgili avukatın isteği üzerine veya kendiliğinden duruşma yapılmasına karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>145 ve 146 ncı maddeler, birlik disiplin kurulu hakkında da uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birlik disiplin kurulunda duruşmaya raportör üyenin işi izah etmesiyle başlanır. Bu üyenin duruşmadan önce raporunu imzalayıp dosyaya koymuş bulunması gereklidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Raportör üyenin izahından sonra ilgili avukat ve varsa vekilleri gerekli izahlarda bulunurlar. Bunlardan itirazı yapmış olan taraf önce dinlenir. Son söz, hakkında disiplin kovuşturması yapılanındır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Birlik disiplin kurulu, inceleme konusu kararın onanmasına veya kovuşturmanın derinleştirilmesi için kararın bozularak dosyanın ilgili baroya gönderilmesine karar verebileceği gibi, yeniden incelemeyi gerektirmiyen hallerde, uygun görmediği kararı kaldırarak işin esası hakkında karar verebilir veya verilmiş olan kararı düzelterek onaylayabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Birlik Disiplin Kurulunun, itiraz üzerine verdiği kararlar Adalet Bakanlığına ulaştığı tarihten itibaren iki ay içinde Bakanlıkça karar verilmediği veya karar onaylandığı takdirde kesinleşir. Ancak Adalet Bakanlığı uygun bulmadığı kararları bir daha görüşülmek üzere, gösterdiği gerekçesiyle birlikte Türkiye Barolar Birliğine geri gönderir. Geri gönderilen bu kararlar, Türkiye Barolar Birliği Disiplin Kurulunca üçte iki çoğunlukla aynen kabul edildiği takdirde onaylanmış, aksi halde onaylanmamış sayılır; sonuç Türkiye Barolar Birliği tarafından Adalet Bakanlığına bildirilir. Şu kadar ki, uyarma, kınama ve para cezasına ilişkin kararlar kesin olup, Bakanlığın onayına tâbi değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>8 inci maddenin altıncı ve yedinci fıkraları hükümleri burada da kıyasen uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="158" başlık="Delillerin serbestçe takdiri, ceza vermenin amacı ve cezadan mahsup">
      <mvz-fıkra no="1">
        <template>Türkiye Barolar Birliği Disiplin Kurulu ve barolar disiplin kurulları, gösterilen delilleri, soruşturma ve duruşmadan edinecekleri kanıya göre serbestçe takdir ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kurullar disiplin cezalarının verilmesinde; avukatlık onurunu, düzen ve gelenekleri ile meslek kurallarını ve itibarını korumak, mesleğin amaç ve gereklerine ve adalete uygun olarak yerine getirilmesini sağlamak ilkelerini göz önünde tutarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşten yasaklanan avukata süreli olarak işten çıkarma cezası verilmesi halinde, işten yasaklandığı süre cezadan mahsup edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="159" başlık="Kovuşturma ve ceza zamanaşımı">
      <mvz-fıkra no="1">
        <template>Disiplin cezasını gerektirecek eylemlerin işlenmesinden itibaren üç yıl geçmiş ise kovuşturma yapılamaz. Yönetim kurulunca işe el konulmuş ise bu süre işlemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Disiplin cezasını gerektiren eylemlerin işlenmesinden itibaren dört buçuk yıl geçmiş ise disiplin cezası verilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Disiplin cezasını gerektiren eylem aynı zamanda bir suç teşkil ediyor ve bu suç için kanun daha uzun bir zamanaşımı süresi koymuş bulunuyorsa, birinci ve ikinci fıkralardaki süreler yerine bu zamanaşımı süresi uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="160" başlık="Disiplin kararlarının uygulanması ve cezaların sicilden silinmesi">
      <mvz-fıkra no="1">
        <template>Disiplin cezalarına ait kararlar kesinleşmedikçe uygulanamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Meslekten çıkarma ve işten çıkarma cezalarından başka bir disiplin cezası verilen avukatlar, uyarma, kınama ve para cezalarının uygulanmasından itibaren beş yıl geçtikten sonra disiplin kuruluna başvurarak bu disiplin cezalarının sicillerinden silinmesini isteyebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İlgilinin yukarıki fıkrada yazılı süre içerisinde disiplin cezası almamış olması halinde, disiplin cezasının silinmesine karar verilir ve sicil dosyasındaki disiplin bölümü çıkartılarak yenisi düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="161" başlık="Tanık ve bilirkişi gideri">
      <mvz-fıkra no="1">
        <template>Disiplin işlemleri dolayısiyle çağırılan her tanık ve bilirkişinin, kaybettiği zaman ve harcadığı mesaiye uygun bir tazminata hakkı vardır; bunlardan çağrıya uymak için yolculuk etmek zorunda olanlara yolculuk ve ikamet giderleri de verilir. Şikâyetçi ve hakkında kovuşturma yapılan avukat, dinlenmesini istedikleri tanık ve bilirkişiye ait giderleri evvelden öderler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukata veya üçüncü bir kişiye yükletilmiyen veya borçludan alınma imkânı kalmayan giderler baroya yüklenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Şikâyet edenden, şikayetin mahiyeti ve yapılacak disiplin soruşturma ve kovuşturmasının genişliği göz önünde bulundurularak 10 liradan 200 liraya kadar avans alınabilir. Yapılan işlemlere, alınan avansın yetmemesi halinde, tamamlanması her zaman istenebilir. Avans ve tamamlanması istenen miktar ilgilisi tarafından ödenmedikçe işlem yapılmıyabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="162" başlık="Para cezası veya giderlerin tahsili">
      <mvz-fıkra no="1">
        <template>Para cezasına veya giderlerin ödenmesine dair olan kararlar İcra ve İflas Kanununun ilamların yerine getirilmesi hakkındaki hükümlerine göre yerine getirilir. Para cezaları baroya gelir yazılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İcra takibi genel hükümlere göre baro tarafından vekâlet verilecek avukat eliyle yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="11-ONBİRİNCİ" başlık="Avukatlık Sözleşmesi">
    <mvz-madde no="163" başlık="Avukatlık sözleşmesinin kapsamı">
      <mvz-fıkra no="1">
        <template>Avukatlık sözleşmesi serbestçe düzenlenir. Avukatlık sözleşmesinin belli bir hukukî yardımı ve meblâğı yahut değeri kapsaması gerekir. Yazılı olmayan anlaşmalar, genel hükümlere göre ispatlanır. Yasaya aykırı olmayan şarta bağlı sözleşmeler geçerlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukatlık ücret tavanını aşan sözleşmeler, bu Kanunda belirtilen tavan miktarında geçerlidir. İfa edilmiş sözleşmenin geçersizliği ileri sürülemez. Yokluk halleri hariç, avukatlık sözleşmesinin bir hükmünün geçersizliği, bu sözleşmenin tümünü geçersiz kılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="164" başlık="Avukatlık ücreti">
      <mvz-fıkra no="1">
        <template>Avukatlık ücreti, avukatın hukukî yardımının karşılığı olan meblâğı veya değeri ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüzde yirmibeşi aşmamak üzere, dava veya hükmolunacak şeyin değeri yahut paranın belli bir yüzdesi avukatlık ücreti olarak kararlaştırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkraya göre yapılacak sözleşmeler, dava konusu para dışındaki mal ve haklardan bir kısmının aynen avukata ait olacağı hükmünü taşıyamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Avukatlık asgarî ücret tarifesi altında vekâlet ücreti kararlaştırılamaz. Ücretsiz dava alınması halinde, durum baro yönetim kuruluna bildirilir.  Avukatlık ücretinin kararlaştırılmamış olduğu veya taraflar arasında yazılı ücret sözleşmesinin bulunmadığı yahut ücret sözleşmesinin belirgin olmadığı veya tartışmalı olduğu veya ücret sözleşmesinin ücrete ilişkin hükmünün geçersiz sayıldığı hallerde; değeri para ile ölçülebilen dava ve işlerde asgari ücret tarifelerinin altında olmamak koşuluyla ücret itirazlarını incelemeye yetkili merci tarafından davanın kazanılan bölümü için avukatın emeğine göre ilâmın kesinleştiği tarihteki müddeabihin değerinin yüzde onu ile yüzde yirmisi arasındaki bir miktar avukatlık ücreti olarak belirlenir. Değeri para ile ölçülemeyen dava ve işlerde ise avukatlık asgari ücret tarifesi uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Dava sonunda, kararla tarifeye dayanılarak karşı tarafa yüklenecek vekâlet ücreti avukata aittir. Bu ücret, iş sahibinin borcu nedeniyle takas ve mahsup edilemez, haczedilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="165" başlık="Ücret dolayısiyle müteselsil sorumluluk">
      <mvz-fıkra no="1">
        <template>İş sahibinin birden çok olması halinde bunlardan her biri, sulh veya her ne suretle olursa olsun taraflar arasında anlaşmayla sonuçlanan ve takipsiz bırakılan işlerde her iki taraf avukat ücretinin ödenmesi hususunda müteselsil borçlu sayılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="166" başlık="Avukatın hapis hakkı ve avukatlık ücretinin rüçhanlı bulunması">
      <mvz-fıkra no="1">
        <template>Avukat, müvekkili tarafından verilen veya onun namına aldığı malları, parayı ve diğer her türlü kıymetleri, avukatlık ücreti ve giderin ödenmesine kadar, kendi alacağı nispetinde elinde tutabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukat, sözleşme ile kararlaştırılan ve hâkim tarafından takdir olunan ücretinden dolayı, kendi çalışması sonucunda müvekkilin muhafaza ettiği veya kazandığı mallar ve davadaki diğer taraftan ilam gereğince tahsil edilecek para yahut alınacak mallar üzerinde diğer alacaklılara nazaran rüçhan hakkını haizdir. Rüçhan hakkı, vekâletnamenin düzenlenme tarihine, vekâletname umumi ise iş sahibi adına ücret konusu işten dolayı ilk yapılan resmi başvurma tarihine göre sıra alır.  İş sahibinin iflası halinde avukatın vekâlet ücreti alacağı da rüçhanlıdır. Ancak, 9.6.1932 tarihli ve 2004 sayılı İcra ve İflâs Kanununun 206 ncı maddesinin birinci fıkrası hükmü saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bir ilamın cebri icra yoluyla infazına girişildiğinde, icra dairesi, takip talebinde bulunan tarafın ilamda adı yazılı olan avukatına, icra emri ile aynı zamanda düzenliyeceği bir bildiriyi, gideri takip talebinde bulunandan alınmak suretiyle, derhal tebliğ eder. Bu bildiri tebliğ edilmedikçe icranın sonraki safhalarına geçilemez. Avukata yapılacak tebliğin giderleri hakkında 2004 sayılı İcra ve İflas Kanununun 59. maddesi hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Avukatın ölümü halinde, mirasçılarına intikal eden avukatlık ücreti alacakları da, avukat alacakları gibi rüçhanlıdır. Şu kadar ki, üçüncü fıkrada yazılı bildirim zorunluğu bu kimseler hakkında uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="167" başlık="Anlaşmazlıkların hakem yoluyla çözümü">
      <mvz-fıkra no="1">
        <template>İptal</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="168" başlık="Avukatlık ücret tarifesinin hazırlanması">
      <mvz-fıkra no="1">
        <template>Baronun yönetim kurulları, her yıl Eylül ayı içerisinde, yargı yerlerindeki işlemler ile diğer işlemlerden alınacak avukatlık ücretinin asgarî hadlerini gösteren birer tarife hazırlayarak Türkiye Barolar Birliğine gönderirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türkiye Barolar Birliği Yönetim Kurulunca, baro yönetim kurullarının teklifleri de göz önüne alınmak suretiyle uygulanacak tarife o yılın Ekim ayı sonuna kadar hazırlanarak Adalet Bakanlığına gönderilir.  Şu kadar ki hazırlanan tarifede; genel bütçeye, il özel idareleri, belediye ve köylere ait vergi, resim, harç ve benzeri mali yükümlülükler ve bunların zam ve cezaları ile tarifelere ilişkin davalar ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun uygulanmasından doğan her türlü davalar için avukatlık ücreti tutarı maktu olarak belirlenir. Bu tarife Adalet Bakanlığına ulaştığı tarihten itibaren bir ay içinde Bakanlıkça karar verilmediği veya tarife onaylandığı takdirde kesinleşir. Ancak Adalet Bakanlığı uygun bulmadığı tarifeyi bir daha görüşülmek üzere, gösterdiği gerekçesiyle birlikte Türkiye Barolar Birliğine geri gönderir. Geri gönderilen bu tarife, Türkiye Barolar Birliği Yönetim Kurulunca üçte iki çoğunlukla aynen kabul edildiği takdirde onaylanmış, aksi halde onaylanmamış sayılır; sonuç Türkiye Barolar Birliği tarafından Adalet Bakanlığına bildirilir. 8 inci maddenin altıncı fıkrası hükümleri kıyasen uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Avukatlık ücretinin takdirinde, hukukî yardımın tamamlandığı veya dava sonunda hüküm verildiği tarihte yürürlükte olan tarife esas alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="169" başlık="Yargı mercilerine karşı tarafa yükletilecek avukatlık ücretinin miktarı">
      <mvz-fıkra no="1">
        <template>Yargı mercilerince karşı tarafa yükletilecek avukatlık ücreti, avukatlık ücret tarifesinde yazılı miktardan az ve üç katından fazla olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="170" başlık="">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="171" başlık="İşi sonuna kadar takip etme zorunluluğu ve başkasını tevkil">
      <mvz-fıkra no="1">
        <template>Avukat, üzerine aldığı işi kanun hükümlerine göre ve yazılı sözleşme olmasa bile sonuna kadar takip eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukata verilen vekâletnamede başkasını tevkile yetki tanınmış ise, yazılı sözleşmede aksine açık bir hüküm olmadıkça, işi başka bir avukatla birlikte veya başka bir avukata vererek takip ettirebilir. Vekâletnamede, bunun düzenlendiği tarihten sonra açılacak veya takip edilecek bütün dava ve işlerde vekâlete ve başkasını tevkile genel şekilde yetki verilmişse, avukat, bu tarihten sonraki dava ve işlerde müvekkilinden ayrıca vekâlet almaya lüzum kalmaksızın işi başka bir avukatla birlikte veya başka bir avukata vererek takip ettirebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkradaki hallerde, avukatın müvekkile karşı sorumluluğu devam eder. Birlikte takibettiği veya işi tamamen devrettiği avukatların kusurlarından ve meydana getirdikleri zarardan dolayı müvekkile karşı hem şahsen hem de diğer avukatla birlikte müştereken ve müteselsilen sorumludur. Şu kadar ki, bu hüküm, 12 nci maddede yazılı bir iş sebebiyle başka bir yerde çalışmak zorunluğunda olduğu için işi tamamen başkasına devreden avukatlar hakkında uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Avukat tarafından işe başka avukatlar teşrik edilmiş ise, avukat bundan dolayı ayrı bir ücret istiyemiyeceği gibi, işi birlikte takip eden avukat da müvekkilden herhangi bir ücret istiyemez. İş tamamen başka bir avukata bırakılmış ise, tevkil eden ve tevkil olunan avukatlar ücret sözleşmesindeki miktarı aşmamak şartiyle, harcadıkları mesaiye karşılık olan ücreti müvekkilden istiyebilirler. Ancak, tevkil eden avukat müvekkilden peşin ücret almışsa, harcadığı mesaiye karşılık olan miktarın fazlasını tevkil ettiği avukata ödemekle yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="172" başlık="İş sahibinin işi başka bir avukata vermesi">
      <mvz-fıkra no="1">
        <template>İş sahibi, ilk anlaşmayı yaptığı avukatının yazılı muvafakatı ile, başka avukatları da işin kovuşturma ve savunmasına katabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İş sahibi, ilk avukatın muvafakatını kendisine tevdi veya tebliğ edilecek bir yazı ile en az bir haftalık süre vererek talep eder. Avukat bu süre içinde cevap vermemişse muvafakat etmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İlk avukatın muvafakat etmemesi halinde, vekâlet akdi kendiliğinden sona erer. İş sahibi, muvafakat etmiyen avukata ücretin tamamını ödemekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İlk avukatın muvafakatı ile işin başka avukatlar tarafından da takibi halinde iş sahibi, ilk avukatın ücretinden kısıntı yapamaz. Bu halde avukatların müvekkile karşı sorumluluğu konusunda 171 inci maddenin üçüncü fıkrası hükmü uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="173" başlık="Avukatlık ücretinin belli bir işe hasredilmesi">
      <mvz-fıkra no="1">
        <template>Sözleşmede aksine bir hüküm yoksa, kararlaştırılan avukatlık ücreti yalnızca avukatın üzerine almış olduğu işin karşılığı olup, mukabil dava, bağlantı ve ilişki bulunsa bile başka dava ve icra kovuşturmaları veya her türlü hukuki yardımlar ayrı ücrete tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukata tevdi edilen işin yapılması veya yapıldıktan sonra sonucunun alınması için gerekli bütün vergi, resim, harc ve giderler iş sahibinin sorumluluğu altında olup, avukat tarafından ilk istekte avukata veya gerektiği yere ödenir. Bu harcamaların avukat tarafından yapılabilmesi için, yeteri kadar avansın iş sahibi tarafından verilmiş olması gerektir. Avukatın iş için yapacağı yolculuk masrafları ve bulunduğu yerden ayrılma tazminatı, anlaşma gereğince iş sahibi tarafından ayrıca ödenir. Bu giderler peşin olarak ödenmedikçe avukat yolculuğa zorlanamaz. Bu hükmün aksine sözleşme yapılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="174" başlık="Avukatın işi takipten vazgeçmesi, azli ve ücretin gününde ödenmemesi">
      <mvz-fıkra no="1">
        <template>Üzerine aldığı işi haklı bir sebep olmaksızın takipten vazgeçen avukat hiçbir ücret istiyemez ve peşin aldığı ücreti geri vermek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukatın azli halinde ücretin tamamı verilir. Şu kadar ki, avukat kusur veya ihmalinden dolayı azledilmiş ise ücretin ödenmesi gerekmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Anlaşmaya göre avukata peşin verilmesi gereken ücret ödenmezse, avukat işe başlamakla zorunlu değildir. Bu sebeple doğabilecek her türlü sorumluluk iş sahibinindir. Yazılı sözleşmedeki diğer ödeme şartlarının yerine getirilmemesinden dolayı avukat işi takip etmek ve sonucunu elde etmekten mahrum kalırsa sorumluluk bakımından aynı hüküm uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="175" başlık="İş sahibinin adresi">
      <mvz-fıkra no="1">
        <template>İş sahibinin verdiği vekâletnamede yazılı adrese avukat tarafından yapılacak her tebliğ, kendisine yapılmış sayılır. Adres değişiklikleri en geç üç gün içinde iş sahibi tarafından taahhütlü mektupla avukata bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İş sahibinin adresine gönderilecek yazıların tebliğ edilememesinden veya adres değişikliklerinin bildirilmemesinden doğan sorumluluk iş sahibine aittir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="12-ONİKİNCİ" başlık="Adli Müzaharet">
    <mvz-madde no="176" başlık="Adlî yardımın kapsamı">
      <mvz-fıkra no="1">
        <template>Adlî yardım, avukatlık ücretlerini ve diğer yargılama giderlerini karşılama olanağı bulunmayanlara bu Kanunda yazılı avukatlık hizmetlerinin sağlanmasıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="177" başlık="Adlî yardım bürosu">
      <mvz-fıkra no="1">
        <template>Adlî yardım hizmeti, baro merkezlerinde, baro yönetim kurullarınca avukatlar arasından oluşturulan adlî yardım bürosu tarafından yürütülür. Baro yönetim kurulu, ayrıca baro merkezi dışında avukat sayısı beşten çok olan her yargı çevresinde de bir avukatı adlî yardım bürosu temsilcisi olarak görevlendirebilir. Büro ve temsilciler, baro yönetim kurulunun gözetimi altında çalışırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birden fazla baronun bulunduğu illerde her bir baro tarafından adli yardım bürosu oluşturulur. Yargı mercilerinin talebi üzerine yapılacak görevlendirmeler, Türkiye Barolar Birliği tarafından oluşturulan elektronik bilişim sistemi üzerinden o ildeki avukatlar arasında eşitlik gözetilerek yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="178" başlık="Adlî yardım istemi">
      <mvz-fıkra no="1">
        <template>Adlî yardım istemi, adlî yardım bürosuna veya temsilcilerine yapılır. İstek sahibi, isteminde haklı olduğunu gösterdiği delillerle kanıtlamak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yardım isteminin reddi halinde, ilgilisi yazı veya sözle baro başkanına başvurabilir. Baro başkanının vereceği karar kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="179" başlık="Adlî yardımın yapılışı">
      <mvz-fıkra no="1">
        <template>Adlî yardım isteminin kabulü halinde; büro gerekli işlemleri yapmak üzere bir veya birkaç avukatı görevlendirir. Görevlendirilen avukat, görev yazısının kendine ulaşmasıyla, avukatlık hizmetlerini yerine getirmek yükümlülüğü altına girer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yükümlülük, ilgilinin gerekli belge ve bilgileri isteğe rağmen vermemesi veya vekâletname vermekten kaçınmasıyla sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ayrıca görevlendirilen avukat da bu işi yapmaktan çekinmek isterse görevin kendisine bildirildiği tarihten itibaren onbeş gün içinde o işin tarifede belirlenen ücretini baroya ödemek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Büro, görevlendirilen avukatın işi yürütmesiyle ilgili aşamaları izler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>18.6.1927 tarihli ve 1086 sayılı Hukuk Usulü Muhakemeleri Kanunu ve 4.4.1929 tarihli ve 1412 sayılı Ceza Muhakemeleri Usulü Kanunu ile diğer kanunlardaki adlî yardıma ilişkin hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="180" başlık="Büronun gelir ve giderleri">
      <mvz-fıkra no="1">
        <template>Adli yardım bürosunun gelirleri şunlardır:</template>
        <mvz-bent no="a">
          <template>İki yıl öncesine ait kesin hesap sonuçlarına göre tespit edilen toplam miktarlar esas alınarak 492 sayılı Harçlar Kanununa bağlı (1), (2) ve (3) sayılı tarifelere göre alınan harçların yüzde üçü ile idarî nitelikteki para cezaları hariç olmak üzere para cezalarının yüzde üçü,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Baroya düşecek paylar ile kamu ve özel kurum ve kuruluşlarından, il veya belediye bütçelerinden baroya yapılan yardımlar,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu amaçla yapılan her türlü bağışlar,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Adlî yardım görevinden çekilen avukatların yatıracağı ücret,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Adlî yardımla görevlendirilen avukatın aldığı ücretin yüzde onu ile davadan haklı çıkan adlî yardımdan yararlanan kişinin avukat ücretinden başka, yararlandığı kısmın yüzde beşi.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Büronun giderleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Adlî yardımla görevlendirilen avukatlara gerektiğinde ödenecek ücretler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Büroda görevlendirileceklere ödenecek ücretler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Büro giderleri ve diğer giderler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Adlî yardım bürolarının gelir ve giderleri büro bütçesinin ayrı bölümlerinde gösterilir. Bu bölümde kalan gelir fazlasının bir sonraki yıla aynen aktarılması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkranın (a) bendine göre hesaplanacak ödenek, Maliye Bakanlığınca her yıl Mart ayının sonuna kadar Türkiye Barolar Birliği hesabına aktarılır. Bu paralar, münhasıran adlî yardım için kullanılır ve yılı içinde harcanmayan paralar, ertesi yıla aynen aktarılır.  Paraların barolar arasındaki dağıtımında puanlama esas alınır. Her baroya öncelikle beş temel puan verilir. Verilen temel puana, her elli üye avukat için bir puan, ayrıca il nüfusu esas alınarak her beş bin nüfus için bir puan eklenir. Birden fazla baronun bulunduğu illerde, her beş bin nüfus için tespit edilecek toplam puanın yüzde otuzu o ilde bulunan barolar arasında eşit olarak, kalanı ise  o ilde levhaya kayıtlı toplam avukat sayısına bölündükten sonra elde edilen rakamın her baronun üye sayısına çarpımı sonucu elde edilecek puana göre dağıtılır. Bu paraların barolar arasındaki dağıtımı ve kullanılmasına ilişkin hususlar, Türkiye Barolar Birliği tarafından çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Maliye Bakanlığınca iki yıl öncesine ait kesin hesap sonuçlarına göre tespit edilen toplam tutarlar esas alınarak 492 sayılı Harçlar Kanununa bağlı (1), (2) ve (3) sayılı tarifelere göre alınan harçların yüzde biri ile idarî nitelikteki para cezaları hariç olmak üzere para cezalarının yüzde biri; her yıl Mart ayının sonuna kadar Türkiye Barolar Birliği adına açılan hesaba aktarılır ve zorunlu müdafi ve vekil görevlendirme ile ilgili carî giderler bu hesaptan ödenir. Bu hesap, münhasıran zorunlu müdafi ve vekil görevlendirme ile ilgili carî giderler için kullanılır ve yılı içinde harcanmayan paralar, ertesi yıla aynen aktarılır. Bu paraların barolar arasındaki dağıtımı, harcanması ve bu hizmet için çalıştırılacak personele ilişkin hususlar, Maliye Bakanlığının görüşü alınmak suretiyle Adalet Bakanlığı ile Türkiye Barolar Birliği tarafından birlikte çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="181" başlık="Yıllık çalışma raporu ve yönetmelik">
      <mvz-fıkra no="1">
        <template>Adlî yardım bürosu, çalışmalarını her yıl sonu düzenleyecekleri bir raporla baro yönetim kuruluna bildirir. Raporun bir örneği baroca Türkiye Barolar Birliğine gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Adlî yardım bürosunun kuruluşu, görevlendirilecek avukatların ve bunlara ödenecek ücretlerin belirlenmesi, büronun işleyişi, denetimi gibi konular Türkiye Barolar Birliğince çıkarılacak yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="13-ONÜÇÜNCÜ" başlık="Çeşitli Hükümler">
    <mvz-madde no="182" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunda düzenlenmesi yönetmeliğe bırakılan hususlar ile Kanunun uygulanabilmesi için yönetmelikte yer alması gereken diğer konuları kapsayan yönetmelikler Türkiye Barolar Birliği Yönetim Kurulu tarafından hazırlanarak Adalet Bakanlığına gönderilir. Yönetmelikler Adalet Bakanlığına ulaştığı tarihten itibaren iki ay içinde karar verilmediği veya onaylandığı takdirde Resmî Gazete’de yayımlanarak yürürlüğe girer. ,60 Adalet Bakanlığı uygun bulmadığı yönetmelikleri bir daha görüşülmek üzere, gösterdiği gerekçesiyle birlikte Türkiye Barolar Birliğine geri gönderir. Geri gönderilen bu yönetmelikler, Türkiye Barolar Birliği Yönetim Kurulunca üçte iki çoğunlukla aynen kabul edildiği takdirde Resmî Gazete’de yayımlanarak yürürlüğe girer, aksi halde onaylanmamış sayılır ve sonuç Türkiye Barolar Birliği tarafından Adalet Bakanlığına bildirilir. 8 inci maddenin altıncı ve yedinci fıkraları hükümleri burada da kıyasen uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, yönetmelikle veya diğer bir düzenleyici işlemle avukatlık stajına kabulde, staj döneminde ve avukatlık mesleğine kabulde sınav veya benzeri bir rejim öngörülemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="183" başlık="Cumhuriyet savcılarına yapılacak tebligat">

    <mvz-madde no="190" başlık="Prim borcunu ödememenin sonuçları">

        <template>Topluluk Sigortası primlerini, topluluk sözleşmesinde gösterilen zamanda ödemiyen avukatın adı baro yönetim kurulunun karariyle, birikmiş prim borcunu, sözleşmedeki şartlar dairesinde ödeyinceye kadar, baro levhasından silinir ve durum ilgili yerlere bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Topluluk Sigortası primin ödememenin sonuçları, prim borçlusu avukatın şahsına münhasır olup, bu sonuçların aynı Topluluk Sigortası sözleşmesine katılmış olan diğer sigortalılara veya baroya sirayeti hakkında bir hüküm sözleşmeye konulamaz.  17.7.1964 tarihli ve 506 sayılı Sosyal Sigortalar Kanununun 140 ıncı maddesi hükmü barolar hakkında uygulanmaz.</template>

    <mvz-madde no="1" başlık="Kamu kurum ve kuruluşları ile kamu iktisadi teşessüslerinde görevli avukatlar" tür="Ek">
      <mvz-fıkra no="1">
        <template>Kamu kurum ve kuruluşları ile kamu iktisadi teşebbüslerinde asli ve sürekli olarak avukatlık görevinde çalışanların baro levhasına yazılmaları isteklerine bağlıdır. Ancak bunlar hakkında bu Kanunun avukatlık meslekine kabul ve ruhsatname verilmesine ilişkin hükümleri aynen uygulanır. Bunlar, görevlerinin gereği olan işleri yaparken baro levhasına kayıtlı avukatların yetkileriyle haklarına sahip ve onların ödevleriyle yükümlüdürler. Baroya kaydını yaptırmayan avukat, çalıştığı yer barosuna veya o ilde birden fazla baronun bulunması hâlinde bu barolardan birine bilgi verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıdaki fıkra uyarınca baro levhasına yazılmak istemediklerini bildiren adayların, sadece avukatlık mesleğine kabullerine ve adlarına ruhsatname düzenlenmesine karar verilerek kanunda öngörülen diğer işlemler, aynen yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada sözü edilen görevlerden ayrılma halinde, avukatlık mesleğinin yapılabilmesi, baro levhasına yazılmakla mümkündür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun avukatlar hakkında öngördüğü disiplin işlem ve cezaları, bu maddede sözü edilen avukatlar hakkında da avukatın sürekli görev yaptığı yer barosunca uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Yurt dışında temsil" tür="Ek">
      <mvz-fıkra no="1">
        <template>Avukatlar, Türkiye Barolar Birliğini veya baroları temsil etmek üzere uluslararası toplantı ve kongrelere Adalet Bakanlığına bilgi vermek suretiyle katılabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Seçimlerin yapılması" tür="Ek">
      <mvz-fıkra no="1">
        <template>Barolar ile Türkiye Barolar Birliğinin bu Kanuna göre gizli oyla yapılacak organ seçimlerine ilişkin işlemler, aşağıdaki esaslara göre yargı gözetimi altında gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçim yapılacak genel kurul toplantısından en az onbeş gün önce, baro seçimleri için levhaya kayıtlı  avukatlar, Türkiye Barolar Birliği seçimleri için de genel kurula barolarca seçilen asıl ve yedek delegeler ile doğal delegeleri belirleyen liste, toplantının gündemi, yeri, günü, saati ile çoğunluk olmadığı takdirde yapılacak ikinci toplantıya ilişkin hususları belirten bir yazı ile birlikte üç nüsha olarak o yer ilçe seçim kurulu başkanı olan hâkime verilir. Bir yerde birden fazla ilçe seçim kurulu bulunduğu takdirde görevli hâkim, Yüksek Seçim Kurulunca belirlenir. Toplantı tarihleri, gündemde yer alan diğer konular göz önünde bulundurularak görüşmelerin bitimine göre seçimlerin ilçe seçim kurulu başkanının gözetiminde yapılması sağlanır. Üye sayısı dörtyüzü aşan barolarda görüşmeler cumartesi günü sonuçlandırılır ve seçimlere pazar günü dokuzda başlanır ve oy verme işi saat onyedide sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hâkim, gerektiğinde ilgili kayıt ve belgeleri de getirtip incelemek suretiyle varsa noksanları tamamlattırdıktan sonra seçime katılacak avukatları belirleyen liste ile yukarıdaki fıkrada belirtilen diğer hususları onaylar. Onaylanan liste ile toplantıya ilişkin diğer hususlar Adalet dairesi ve baro ilan yerlerinde asılmak sureti ile üç gün süre ile ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İlan süresi içinde listeye yapılacak itirazlar hâkim tarafından incelenir ve en geç iki gün içinde kesin olarak karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu suretle kesinleşen listeler ile toplantıya ilişkin diğer hususlar onaylanarak ilgili baro veya Türkiye Barolar Birliğine gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Hâkim, kamu görevlileri veya aday olmayan avukatlar arasından bir başkan ile iki üyeden oluşan bir seçim sandık kurulu atar. Aynı şekilde ayrıca üç yedek üye de belirler. Seçim sandık kurulu başkanının yokluğunda kurula yaşlı üye başkanlık eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Seçim sandık kurulu, seçimlerin kanunun öngördüğü esaslara göre yürütülmesi, yönetimi ve oyların tasnifi ile görevli olup, bu görevleri seçim ve tasnif işleri bitinceye kadar aralıksız olarak devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Dörtyüz kişiden fazla üyesi bulunan barolarda her dörtyüz kişi için bir oy sandığı bulunur ve her seçim sandığı için ayrı bir kurul oluşturulur. Yüze kadar olan üye fazlalığı sandık sayısında nazara alınmaz. Seçimlerde kullanılacak araç ve gereçler ilçe seçim kurulundan sağlanır. Ve sandıkların konacağı yerler hâkim tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Seçim süresinin sonunda seçim sonuçları tutanakla tespit edilip seçim sandık kurulu başkan ve üyeleri tarafından imzalanır. Birden fazla sandık bulunması halinde tutanaklar, hâkim tarafından birleştirilir. Tutanakların birer örneği seçim yerinde asılmak suretiyle geçici seçim sonuçları ilan edilir. Kullanılan oylar ve diğer belgeler tutanağın bir örneği ile birlikte üç ay süreyle saklanmak üzere ilçe seçim kurulu başkanlığına tevdi edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Seçimin devamı sırasında yapılan işlemler ile tutanakların düzenlenmesinden itibaren iki gün içinde seçim sonuçlarına yapılacak itirazlar, hâkim tarafından aynı gün incelenir ve kesin olarak karara bağlanır. İtiraz süresinin geçmesi ve itirazların karara bağlanmasından hemen sonra hâkim yukarıdaki hükümlere göre kesin sonuçları ilan eder ve ilgili baro ile Türkiye Barolar Birliğine bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Oy verme işlemi, gizli oy açık tasnif esasına göre yapılır. Listede adı yazılı bulunmayan avukat oy kullanamaz. Oylar, oy verenin kimliğinin baro veya resmi kuruluşça verilen belge ile ispat edilmesinden ve listedeki isminin karşısındaki yerin imzalanmasından sonra kullanılır. Oylar, organlara göre birlikte veya ayrı ayrı her şekilde düzenlenen oy pusulalarının, üzerinde ilçe seçim kurulu mühürü bulunan ve oy verme sırasında sandık kurulu başkanı tarafından verilecek zarfa konulması suretiyle kullanılır. Bunların dışındaki zarflara konulan oylar geçersizdir. Asıl üyenin mazereti olduğu takdirde yedek üye Türkiye Barolar Birliği Genel Kuruluna katılır ve oy kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Hâkim, seçim sonuçlarını etkileyecek ölçüde bir usulsüzlük veya kanuna aykırı uygulama tespit etmesi halinde; bu tespite konu olan organla sınırlı olmak üzere seçimlerin iptaline karar verir. Bu takdirde, süresi bir aydan az ve iki aydan fazla olmamak üzere seçimin yenileneceği pazar gününü tespit ederek ilgili baroya veya Türkiye Barolar Birliğine bildirir. Belirlenen günde yalnız seçim yapılır ve seçim işlemleri bu madde ile kanunun öngördüğü diğer hükümlere uygun olarak yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>İlçe seçim kurulu başkanı hâkime ve seçim sandık kurulu başkanı ile üyelerine, "Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun" da belirtilen esaslara göre ücret ödenir. Bu ücret ve diğer seçim giderleri, Türkiye Barolar Birliği ve ilgili baroların bütçelerinden karşılanır.</template>

      <mvz-fıkra no="14">
        <template>Seçimler sırasında sandık kurulu başkanı ve üyelerine karşı görevleriyle bağlantılı olarak işlenen suçlar kamu görevlilerine karşı işlenmiş gibi cezalandırılır.</template>

      <mvz-fıkra no="15">

    <mvz-madde no="4" başlık="Denetim" tür="Ek">

        <template>Adalet Bakanlığı, Barolar ve Türkiye Barolar Birliği organlarının görevlerini kanun hükümlerine uygun olarak yapıp yapmadıklarını ve mali işlemlerini yönetmelikte belirlenecek esaslara göre denetlemeye yetkilidir. Bu idari ve mali denetim, adalet müfettişlerince yapılır.</template>

    </mvz-madde>
    <mvz-madde no="1" başlık="Geçici hükümler" tür="Geçici">
      <mvz-fıkra no="1">
        <template>7 Temmuz 1969 tarihinden sonra 506 sayılı Sosyal sigortalar Kanununun 86 ncı maddesi gereğince barolarla Sosyal Sigortalar Kurumu arasında yapılacak sözleşmelere esas teşkil eden ilk tip sözleşme, bu kanunun geçici 10 uncu maddesi uyarınca Türkiye Barolar Birliğinin yapacağı ilk toplantıyı takip eden üç ay içinde Çalışma Bakanlığı, Türkiye Barolar Birliği ve Sosyal Sigortalar Kurumu arasında yapılacak görüşmelerle tespit edilir. Hazırlanan tip sözleşme, Türkiye Barolar Birliği Yönetim Kurulu tarafından, bir hafta içinde bütün barolara gönderilir. Topluluk sigortasına girmeye mecbur olan avukatların bağlı bulundukları barolar, tip sözleşmeye göre topluluk sigortası sözleşmesi yapmak üzere tip sözleşmenin baroya gelişi tarihinden itibaren iki ay içinde Sosyal Sigortalar Kurumuna başvururlar. Sözleşmeler, baronun başvurma tarihinden itibaren en geç üç ay içinde yürürlüğe konur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="A">
        <template>Topluluk sigortasına tabi oldukları tarihde 30 yaşını geçmiş bulunan avukatlardan, 55 yaşını doldurmakla beraber 506 sayılı Sosyal Sigortalar Kanununun 60 ıncı maddesinde yazılı şartları yerine getiremediklerinden yaşlılık sigortasından aylık bağlanmasına hak kazanamıyan ve:</template>
        <mvz-bent no="a">
          <template>Sigortalılıklarının başladığı tarihten önceki on yıl içinde en az 2000 gün baro levhasında kayıtlı avukat olduklarını tevsik eden,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sigortalılık süresince her yıl en az ortalama 200 gün sigorta primi ödemiş olan,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>En az beş yıl sigortalı bulunan avukatlara, sigortalılık süresi 15 yılı doldurmuş olanlar gibi Sosyal Sigortalar Kanununun 61 inci maddesindeki esaslara göre yaşlılık aylığı bağlanır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>(a) bendinde sözü geçen avukatlık süresi, avukatların sigortalıklarının başladığı tarihten itibaren en geç iki yıl içinde ilgili barolardan alınarak Sosyal Sigortalar Kurumuna verilecek belgelerle tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Barolar bu çalışma belgelerini düzenlemekten kaçınırlarsa, sigortalı avukatların ilgili baro ve yönetim kurulu başkan ve üyelerinden zarar ve ziyan istemek hakları saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Avukatlık süresini gösteren belgelerin gerçeğe uymadığı bir hükümle tespit edildiği takdirde gerek bunu düzenliyenler gerekse ilgili sigortalılar, Sosyal Sigortalar Kurumunun bu yüzden uğrayacağı zararları yüzde elli fazlasiyle ve kanuni faizi ile birlikte adı geçen Kuruma ödemekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Bu gibiler hakkında ayrıca ceza kovuşturması da yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="B">
        <template>Topluluk sigortasına tabi oldukları tarihte 30 yaşını geçmiş bulunan avukatlardan, 50 yaşını doldurup, erken yaşlanmış oldukları tespit edilen ve Sosyal Sigortalar Kanununun 60 ıncı maddesinde yazılı şartları yerine getiremediklerinden aylık bağlanmasına hak kazanamıyanlara (A) fıkrasındaki şartlarla, sigortalılık süreleri 15 yılı doldurmuş olanlar gibi, Sosyal Sigortalar Kanununun 61 inci maddesindeki esaslara göre yaşlılık aylığı bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte T. C. Emekli Sandığındaki emekliliğe esas teşkil eden hizmetleri toplamı en az 15 yıl olan avukatlardan;</template>
        <mvz-bent no="A">
          <template>Emekli keseneği ödedikleri memuriyet veya hizmetten 7 Temmuz 1969 tarihinden önce her ne sebeple olursa olsun ayrılmış olanlar, kendilerine emeklilik veya malûllük aylığı bağlanmamış olmak şartı ile, 7 Temmuz 1969 tarihine kadar Sosyal Sigortaya da tabi olmaksızın geçen fiili avukatlık sürelerinin tamamını veya bu sürenin emekliliğe esas olan eski hizmetlerinin süresi ile birlikte 25 yılı doldurmaya yetecek kısmını aşağıdaki hükümlere göre borçlanabilirler.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Fiili avukatlık süresinin tamamını borçlananlar aşağıdaki (B) bendi hükümlerine göre T.C. Emekli Sandığı ile ilgilerini devam ettirebilirler. Bunlardan T. C. Emekli Sandığı ile ilgilerini devam ettirmek istemiyenlerle fiili avukatlık süresinin bir kısmını borçlanmak suretiyle emekliliğe esas hizmet sürelerini 25 yıla çıkarmış olanlara aşağıdaki hükümlere göre emekli aylığı bağlanır.</template>
        </mvz-bent>
        <mvz-bent no="B">
          <template>Emekli keseneği ödedikleri memuriyet veya hizmetten bu Kanunun yürürlüğe girdiği tarihte veya daha sonra her ne sebeple olursa olsun ayrılanlar, toplam süre 30 yılı geçmemek üzere, T.C. Emekli Sandığı ile ilgilerini devam ettirebilirler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>(A) bendine göre borçlanabilmek için ilgilinin, listesine yazılı bulunduğu baronun topluluk sigortasına katıldığı tarihten itibaren üç ay içinde bu baro aracılığı ile T. C. Emekli Sandığına yazılı olarak başvurması zorunludur. Borçlanılacak miktar, ilgilinin T. C. Emekli Sandığına evvelce kesenek ödediği memuriyet veya hizmette son aldığı maaş yahut ödenek derecesindeki kıdeminden itibaren o memuriyet veya hizmetin asgari terfi süresi nazara alınarak 2 veya 3 yılda bir terfi etmiş sayılmak suretiyle T. C. Emekli Sandığı Kanunu hükümleri dairesinde, bu Kanunun yürürlüğe girdiği tarihe kadarki fiili avukatlık süresi için ödemesi gereken keseneklerin  tamamıdır. Ancak, kesenekler ve kurum hissesi ait oldukları geçmiş yıllarda yürürlükte bulunan T.C. Emekli Sandığı Kanunu hükümlerine göre hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Borçlanılan süre ile T. C. Emekli Sandığına tabi eski memuriyet veya hizmet süreleri toplamı 30 yılı geçemez. Fiili avukatlık süresinin bu miktarı aşan kısmı için borçlanmak mümkün değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Borçlanılacak miktar, ilgilinin talebine göre, T. C. Emekli Sandığı tarafından yapılacak tebligat üzerine en geç 1 ay içinde toptan veya on yıl içinde on eşit taksitle ödenir. T. C. Emekli Sandığına tabi eski memuriyet veya hizmetlerinden ayrılırken keseneklerini almış olanlar bunun tamamını kanuni faizi ile birlikte, borçlanılan miktarın tamamının veya ilk taksidinin ödenmesi süresi içinde sandığa iade ile yükümlüdürler. Kesenekleri süresi içinde iade etmiyenlerin bu madde hükümlerinden faydalanmaları mümkün değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Borçlanan kimseler emekliliğe esas olan eski memuriyet veya hizmet sürelerine borçlandıkları sürenin eklenmesi suretiyle hesaplanacak süre üzerinden ve borçlandıkları miktarın tamamını ödedikleri tarihten itibaren 5434 sayılı Kanuna göre emekli aylığına hak kazanırlar. Emekli aylığına hak kazanabilmesi için toplam süresinin 25 yıl olması yeterlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Taksitle ödemede, borcun tamamını ödiyemeden ölen veya T. C. Emekli Sandığına göre malul olan avukatların kendilerine veya hak sahibi mirasçılarına ölüm veya maluliyeti takibeden ay başından itibaren 5434 sayılı Kanun hükümlerine göre malullük yahut dul ve yetim aylığı bağlanır. Şu kadar ki, ödenmemiş yıllık taksitlerin her biri 12 eşit parçaya bölünerek o yılın malullük veya dul ve yetim aylıklarından kesilir ve artan miktar hak sahiplerine ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Taksitle ödemede, bir taksidi zamanında ödemiyen ve T. C. Emekli Sandığınca yapılan tebligat üzerine 1 ay içinde bu borcunu yerine getiremiyenlerin borçlanma durumuna son verilir ve ödedikleri miktara tekabül eden sürenin eski memuriyet veya hizmetlerine eklenmesi suretiyle hesaplanacak süre üzerinden T. C. Emekli Sandığı Kanunu hükümlerine göre işlem yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yukarıdaki fıkralar gereğince kendilerine veya hak sahibi mirasçılarına emekli, malullük veya dul ve yetim aylığı bağlananlara borçlanmadan önceki fiili memuriyet veya hizmetlerin tutarı üzerinden T. C. Emekli Sandığı Kanunu hükümlerine göre ikramiye ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>(B) bendinden faydalanabilmek için ilgilinin, T. C. Emekli Sandığına kesenek ödediği memuriyet veya hizmetten ayrılmasını takibeden bir ay içinde Sandığa dilekçe ile başvurması ve kendisine emekli aylığı bağlanmamış veya kesenekleri iade edilmemiş olması gereklidir. (A) bendinin ikinci fıkrası delaletiyle (B) bendinden faydalananlar için bu süre borçlanma taleplerinin kabul edildiğinin Sandıkça kendilerine tebliği tarihinden başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>(B) bendinden faydalanmak dileği ile yapılan başvurmanın T.C. Emekli Sandığınca kabul edildiğinin ilgiliye tebliğini takibeden aybaşından itibaren sandığa kesenek ödeme yükümlülüğü doğar. Kesenekler  her ayın ilk haftası içinde doğrudan doğruya veya T.C. Emekli Sandığının belirteceği bir banka aracılığı ile sandığa ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Kesenek ve kurum hissesi, ilgilinin T. C. Emekli Sandığına kesenek ödediği evvelki memuriyet veya hizmette son iktisap ettiği maaş veya ödeneğindeki kıdeminden başlamak üzere o memuriyet veya hizmetin en az yükselme süresine göre iki veya üç senede bir terfi ediyormuşçasına yürütülecek maaş dereceleri üzerinden hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>(B) bendi uyarınca T. C. Emekli Sandığı ile ilgileri devam edenlerin emekliliğe esas sürelerinin 30 yılı doldurduğu, sandıkla ilgilerinin kesilmesini yazılı olarak istedikleri, öldükleri yahut T.C. Emekli Sandığı Kanununa göre malûl duruma girdikleri veya borçlanma hükümlerinde gösterildiği şekilde sandık tarafından verilen bir aylık süre içinde ödememekte temerrüt ettikleri takdirde bu durumların husule geldiği tarihi takibeden aybaşından itibaren sandıkla ilgileri kesilir ve toplam süreleri üzerinden kendilerine yahut hak sahibi mirasçılarına 5434 sayılı Kanun uyarınca emekli, malullük dul veya yetim aylığı bağlanır. Bu kimselere ödenecek ikramiye hakkında borçlanma ile ilgili hükümler kıyasen uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Geçici 3, 4 ve 5 inci maddeler uyarınca borçlandıkları süre ile birlikte emekliliğe esas hizmetleri tutarı 15 yıl veya daha fazla olanlar da bu maddenin (B) bendi hükmünden faydalanabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Bu madde hükümlerinden faydalananların, (A) bendi uyarınca borçlandıkları veya (B) bendi uyarınca T.C. Emekli Sandığı ile ilgilerini devam ettirdikleri sürelerin tamamı, emekliliğe tabi görevden son defa ayrıldıkları maaş veya ödenekteki kıdemlerine eklenmek suretiyle bu görev veya hizmetin en az yükselme süresine göre iki veya üç yılda bir terfi etmiş veya ediyormuşçasına intıbakları yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Bu maddenin 9 uncu fıkrasında T.C. Emekli Sandığına başvurma için konulmuş bir aylık süreyi geçirmiş olanlar, 1 Ocak 1971 tarihine kadar başvurmaları şartı ile bu madde hükümlerinden faydalanabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>7 Temmuz 1969 tarihinde veya bu tarihle 1 Ocak 1971 tarihi arasında T.C. Emekli Sandığında iştirakçi durumunda bulunanların, emeklilik keseneği ödedikleri görev veya hizmetten önce T.C. Emekli Sandığı Kanununa tabi olmadan ve Sosyal Sigortalar kapsamına da girmeden geçirdikleri fiili avukatlık sürelerinin daha önce başka kanunlarla borçlanılan süreler ile birlikte onbeş yılı geçmiyecek kısmı, 5434 sayılı Kanuna 23 şubat 1965 gün ve 545 sayılı Kanunun 5 inci maddesi ile eklenen maddedeki esaslara göre borçlanmaları şartı ile emekliliğe esas hizmetlerine eklenir. Şu kadar ki, bu kimselerin adlarına borç kaydedilecek miktar borçlandırılan sürenin geçtiği tarihlerde kesilen kesenek ve karşılıklar oranına göre tespit olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde hükmünden faydalanmak için, ilgilinin, 1 Nisan 1971 tarihine kadar T.C. Emekli Sandığına yazılı olarak başvurması şarttır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>7 Temmuz 1969 tarihinde veya bu tarihle 1 Ocak 1971 tarihi arasında T.C Emekli Sandığında iştirakçi durumunda bulunanlardan, emekli keseneği ödedikleri görev veya hizmetten önce T.C. Emekli Sandığına tabi olmadan ve Sosyal Sigortalar kapsamına da girmeden avukatlık yapan ve ondan önce de emekliliğe tabi bir görev veya hizmette bulunanların T.C. Emekli Sandığı ile ilişkileri bulunan devreler arasındaki fiili avukatlık sürelerinin daha önce başka kanunlarla borçlanılan süreler ile birlikte onbeş yılı geçmiyecek kısmı geçici 3 üncü madde uyarınca borçlanmaları şartı ile aynı madde hükümlerine göre emekliliğe esas hizmetlerine eklenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Geçici 3 üncü maddenin son fıkrası hükmü bu halde de uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Geçici 2,3 ve 4 üncü maddelerin kapsamına giren avukatların bu maddeler gereğince borçlandıkları fiili avukatlık sürelerinden önce Sosyal Sigortalar Kurumu kapsamına giren hizmetleri de mevcutsa, Sosyal Sigortalar kapsamına giren hizmetler 5/1/1961 tarihli ve 228 sayılı Kanunun aylık bağlanmasına ilişkin esasları dairesinde T.C. Emekli Sandığındaki hizmetler (Borçlanılan süreler dâhil) ile birleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde hükmünden faydalanmak istiyenlerin, T.C. Emekli Sandığına başvurmalarının şekli ve süresi hakkında geçici 3 üncü madde hükmü kıyasen uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte Avukatlar Yardımlaşma Sandığında üye bulunan avukatlar, levhasına yazılı oldukları baroya müracat ederek sandıktaki kayıtların silinmesini istiyebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">

    <mvz-madde no="10" başlık="" tür="Geçici">
