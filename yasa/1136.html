  <mvz-kısım no="6-ALTINCI" başlık="Avukatın Hak ve Ödevleri">
    <mvz-madde no="34" başlık="Genel olarak">
      <mvz-fıkra no="1">
        <template>Avukatlar, yüklendikleri görevleri bu görevin kutsallığına yakışır bir şekilde özen, doğruluk ve onur içinde yerine getirmek ve avukatlık unvanının gerektirdiği saygı ve güvene uygun biçimde davranmak ve Türkiye Barolar Birliğince belirlenen meslek kurallarına uymakla yükümlüdürler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Yalnız avukatların yapabileceği işler">
      <mvz-fıkra no="1">
        <template>Kanun işlerinde ve hukuki meselelerde mütalaa vermek, mahkeme, hakem veya yargı yetkisini haiz bulunan diğer organlar huzurunda gerçek ve tüzel kişilere ait hakları dava etmek ve savunmak, adli işlemleri takip etmek, bu işlere ait bütün evrakı düzenlemek, yalnız baroda yazılı avukatlara aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Baroda yazılı avukatlar birinci fıkradakiler dışında kalan resmi dairelerdeki bütün işleri de takip edebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dava açmaya yeteneği olan herkes kendi davasına ait evrakı düzenleyebilir, davasını bizzat açabilir ve işini takip edebilir. Ancak, Türk Ticaret Kanununun 272 nci maddesinde ön görülen esas sermaye miktarının beş katı veya daha fazla esas sermayesi bulunan anonim şirketler ile üye sayısı yüz veya daha fazla olan yapı kooperatifleri sözleşmeli bir avukat bulundurmak zorundadır. Bu fıkra hükmüne aykırı davranan kuruluşlara Cumhuriyet savcısı tarafından sözleşmeli avukat tayin etmedikleri her ay için, sanayi sektöründe çalışan onaltı yaşından büyük işçiler için suç tarihinde yürürlükte bulunan, asgarî ücretin iki aylık brüt tutarı kadar idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hukuk ve Ceza Muhakemeleri Usulleri kanunları ile diğer kanun hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35/A" başlık="Uzlaşma sağlama">
      <mvz-fıkra no="1">
        <template>Avukatlar dava açılmadan veya dava açılmış olup da henüz duruşma başlamadan önce kendilerine intikal eden iş ve davalarda, tarafların kendi iradeleriyle istem sonucu elde edebilecekleri konulara inhisar etmek kaydıyla, müvekkilleriyle birlikte karşı tarafı uzlaşmaya davet edebilirler. Karşı taraf bu davete icabet eder ve uzlaşma sağlanırsa, uzlaşma konusunu, yerini, tarihini, karşılıklı yerine getirmeleri gereken hususları içeren tutanak, avukatlar ile müvekkilleri tarafından birlikte imza altına alınır. Bu tutanaklar 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanununun 38 inci maddesi anlamında ilâm niteliğindedir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Sır saklama">
      <mvz-fıkra no="1">
        <template>Avukatların, kendilerine tevdi edilen veya gerek avukatlık görevi, gerekse, Türkiye Barolar Birliği ve barolar organlarındaki görevleri dolayısiyle öğrendikleri hususları açığa vurmaları yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukatların birinci fıkrada yazılı hususlar hakkında tanıklık edebilmeleri, iş sahibinin muvafakatini almış olmalarına bağlıdır. Ancak, bu halde dahi avukat tanıklık etmekten çekinebilir.  Çekinme hakkının kullanılması hukuki ve cezai sorumluluk doğurmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıki hükümler, Türkiye Barolar Birliği ve baroların memurları hakkında da uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="İşin reddedildiğinin bildirilmesi">
      <mvz-fıkra no="1">
        <template>Avukat, kendisine teklif olunan işi sebep göstermeden reddedebilir. Reddin, iş sahibine gecikmeden bildirilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşi iki avukat tarafından reddolunan kimse, kendisine bir avukat tayinini baro başkanından isteyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tayin olunan avukat, baro başkanı tarafından belirlenen ücret karşılığında işi takip etmek zorundadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="38" başlık="İşin reddi zorunluluğu">
      <mvz-fıkra no="1">
        <template>Avukat;</template>
        <mvz-bent no="a">
          <template>Kendisine yapılan teklifi yolsuz veya haksız görür yahut sonradan yolsuz veya haksız olduğu kanısına varırsa,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Aynı işte menfaati zıt bir tarafa avukatlık etmiş veya mütalaa vermiş olursa,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Evvelce hâkim, hakem, Cumhuriyet savcısı, bilirkişi veya memur olarak o işte görev yapmış olursa,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kendisinin düzenlediği bir senet veya sözleşmenin hükümsüzlüğünü ileri sürmek durumu ortaya çıkmışsa,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>(İptal)</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Görmesi istenilen iş, Türkiye Barolar Birliği tarafından tespit edilen mesleki dayanışma ve düzen gereklerine uygun değilse,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Teklifi reddetmek zorunluğundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu zorunluluk, avukatların ortaklarını ve yanlarında çalıştırdıkları avukatları da kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(İptal)</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(İptal)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="39" başlık="Avukatın dosya saklaması ve hapis hakkı">
      <mvz-fıkra no="1">
        <template>Avukat, kendisine tevdi olunan evrakı, vekâletin sona ermesinden itibaren üç yıl süre ile saklamakla yükümlüdür. Şu kadar ki, evrakın geri alınması müvekkile yazı ile bildirilmiş olduğu hallerde saklama yükümlülüğü, bildirme tarihinden itibaren üç ayın sonunda sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukat, ücreti ve yapmış olduğu giderleri kendisine ödenmedikçe, elinde bulunan evrakı geri vermekle yükümlü değildir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="40" başlık="Tazminat isteklerinde zamanaşımı">
      <mvz-fıkra no="1">
        <template>İş sahibi tarafından sözleşmeye dayanılarak avukata karşı ileri sürülen tazminat istekleri, bu hakkın doğumunun öğrenildiği tarihten itibaren bir yıl ve her halde zararı doğuran olaydan itibaren beş yıl geçmekle düşer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41" başlık="Avukatın vekâletten çekilmesi">
      <mvz-fıkra no="1">
        <template>Belli bir işi takipten veya savunmadan isteği ile çekilen avukatın o işe ait vekâlet görevi, durumu müvekkiline tebliğinden itibaren onbeş gün süre ile devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şu kadar ki, adli müzaharet bürosu yahut baro başkanı tarafından tayin edilen avukat, kaçınılmaz bir sebep veya haklı bir özürü olmadıkça, görevi yerine getirmekten çekinemez. Kaçınılmaz sebebin veya haklı özürün takdiri avukatı tayin eden makama aittir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Bir avukatın geçici olarak görevlendirilmesi">
      <mvz-fıkra no="1">
        <template>Bir avukatın ölümü veya meslekten yahut işten çıkarılması veya işten yasaklanması yahut geçici olarak iş yapamaz duruma gelmesi hallerinde, avukatın kayıtlı olduğu baro başkanı, ilgililerin yazılı istemi üzerine veya iş sahiplerinin yazılı muvafakatini almak şartiyle, işleri geçici olarak takip etmek ve yürütmek için kendi barosuna kayıtlı bir avukatı görevlendirir ve dosyaları kendisine devir ve teslim eder.  Ayrıca durumu mahkemelere ve gerekli göreceği yerlere bildirir. Bu hükümler avukatlık ortaklığı hakkında da kıyasen uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıki fıkrada yazılı işlere ait kanuni süreler, dosyaların devir ve teslimine kadar işlemez. Şu kadar ki, bu süre üç ayı geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kendisine görev verilen avukat haklı sebepler göstererek bunu reddedebilir. Ret sebeplerinin yerinde olup olmadığına baro yönetim kurulu karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Vekâlet görevi, temsil edilen avukatın talimatına bağlı olmaksızın, bu görevi yapan avukatın sorumluluğu altında yürür. Yapılan işlerin ücretini, kendisine vekâlet olunan avukat öder.  Anlaşmazlık halinde ücretin miktarı baro yönetim kurulu tarafından belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="Büro edinme zorunluluğu">
      <mvz-fıkra no="1">
        <template>Her avukat, levhaya yazıldığı tarihten itibaren üç ay içinde baro bölgesinde bir büro kurmak zorundadır. Büronun niteliklerini barolar belirtir.  23/6/1965 tarihli ve 634 sayılı Kat Mülkiyeti Kanununa göre anagayrimenkulün mesken olarak gösterilen bağımsız bölümlerinde kat maliklerinin izni ve benzeri şartlar aranmaksızın avukatlık büroları faaliyet gösterebilir. Bu konuda, yönetim planındaki aksine hükümler uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir avukatın birden fazla bürosu olamaz. Birlikte çalışan avukatlar ayrı büro edinemezler.  Avukatlık ortaklığı yurt içinde şube açamaz. Milletvekilleri, milletvekilliği süresince avukatlık yapamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bürosunu veya konutunu değiştiren avukat yenilerinin adreslerini bir hafta içinde baroya bildirmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Avukatların büro kurma giderlerinin karşılanması için kredi ve finans kuruluşları ile kredi veren kamu kurum ve kuruluşlarınca uygun şartlarda finansman desteği sağlanır. Desteğin sağlanmasına ilişkin usul ve esaslar, Bankacılık Düzenleme ve Denetleme Kurumu ile Hazine ve Maliye Bakanlığının görüşü alınarak Adalet Bakanlığı tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Avukatların birlikte veya avukatlık ortaklığı şeklinde çalışmaları">
      <mvz-fıkra no="1">
        <template>Avukatlar, meslekî çalışmalarını aynı büroda birlikte veya avukatlık ortaklığı şeklinde de yürütebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="A">
        <template>Aynı büroda birlikte çalışma</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Birlikte çalışma, aynı ilde kurulu barolardan herhangi birine kayıtlı birden çok avukatın meslekî çalışmalarını bir büroda yürütmeleridir. Bu birlikteliğin tüzel kişiliği yoktur, yapılan iş ticarî sayılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Birlikte çalışan avukatlardan biri ya da birkaçının ad ve/veya soyadının yanında  ibaresinin kullanılması zorunludur. Karşılıklı hak ve yükümlülükler, gelir ve giderlerin paylaşılması, büro yönetimi, birlikteliğin sona ermesi birlikte çalışanlarca belirlenir ve yazılı olarak kayıtlı oldukları baroya bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="B">
        <template>Avukatlık ortaklığı</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Avukatlık ortaklığı, aynı ilde kurulu barolardan herhangi birine kayıtlı birden çok avukatın bu Kanuna göre mesleklerini yürütmek için oluşturdukları tüzel kişiliktir. Avukatlık ortaklığının çalışması meslek çalışması olup, ticarî sayılmaz ve vergilendirme bakımından şahıs şirketlerine ilişkin hükümler uygulanır. Avukatlık ortaklığının adı, bir ya da birkaç ortağın ad ve/veya soyadlarına  ibaresi eklenerek belirlenir. Yabancı sermayeyi teşvik mevzuatı çerçevesinde Türkiye’de faaliyet göstermek isteyen yabancı avukatlık ortaklıkları, bu Kanuna ve avukatlık ortaklığı düzenlemesine uygun olarak kurulmak koşuluyla, yalnızca yabancı hukuklar ve milletlerarası hukuk konularında danışmanlık hizmeti verebilirler. Bu sınırlama yabancı avukatlık ortaklığında çalışan Türkiye Cumhuriyeti vatandaşı ya da yabancı avukatları da kapsar. Bu nev’i avukatlık ortaklıkları için ortakların baroya kayıtlı olması şartı aranmaz. Bu kuralın uygulanması mütekabiliyet esasına bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Ana sözleşmesi tip ana sözleşmeye uygun olarak düzenlenen avukatlık ortaklığı, kurucularının kayıtlı bulunduğu baro yönetim kurulu tarafından Baro Avukatlık Ortaklığı Siciline yazılmasıyla tüzel kişilik kazanır. Yazılma istemi, ancak Kanuna ve tip ana sözleşmeye aykırılık gerekçesiyle reddedilebilir. Bu durumda 8 inci madde hükümleri kıyasen uygulanır. Ana sözleşmenin bir örneği Türkiye Barolar Birliğine gönderilir.</template>
        <mvz-bent no="a">
          <template>Ortakların hak ve borçları</template>
          <mvz-altbent no="1">
            <template>Ortaklık payları ve oranları serbestçe belirlenir. Ortakların payı, ancak ortaklara veya avukat olan üçüncü kişilere devredilebilir. Ortakların pay devrinin sözleşme ile yasaklanması veya ortakların pay devrine onay vermemeleri, mirasçının avukat olmaması ya da ortaklığı kabul etmemesi, ortağın emeklilik veya sağlık nedenleri ile avukatlığı bırakması, baro levhasından silinmesi, meslekten çıkması veya çıkarılması, ortaklıktaki payına haciz konulması halinde ortaklık payı gerçek değeri üzerinden diğer ortaklar tarafından payları oranında alınır. Bu işlemlerin üç ay içerisinde sonuçlandırılmaması halinde, yönetmelikteki tasfiye hükümleri uygulanır.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Vekâletnameler ortaklık adına düzenlenir. Ortaklık iş veya davayı takip edecek avukatlara yetki belgesi verir.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Avukatlık ortaklığı, amacın dışında hak ve mal edinemez, üçüncü kişilerle ortaklık kuramaz, tüzel kişilerin paylarını alamaz. Ortaklar; birden fazla avukatlık ortaklığının ortağı olamaz, ortaklığın bürosu dışında büro edinemez ve bağımsız olarak dava ve iş takip edemezler.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Avukatlık ortaklığı; ortaklarının ve çalışan avukatların ortaklık ile ilgili her türlü işlem, eylem ve borçlarından dolayı bunlarla birlikte müştereken ve müteselsilen sınırsız sorumludur. Ortakların ve ortaklıkta çalışan avukatların meslekî görevlerinden dolayı Avukatlık Kanunu ve meslek kurallarına göre sorumlulukları saklıdır. Avukatlık ortaklıkları hakkında da bu Kanundaki disiplin işlem ve cezaları uygulanır.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Defter ve kayıtların tutulmasından ortaklığın yönetim ve temsili ile görevli ortak sorumludur. Avukatlık ortaklığı; iş ve dava defteri, pay defteri, karar defteri, gelir-gider defteri ve demirbaş defteri tutmak zorundadır.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Uyuşmazlıkların çözümü</template>
          <mvz-altbent no="0">
            <template>Avukatların birlikte çalışmalarından veya avukatlık ortaklığında; ortakların kendi aralarında ve ortaklıkla ilgili her türlü uyuşmazlıklar ile ortaklık pay devir ve intikalinde bedele ilişkin olarak üçüncü şahıslarla aralarında çıkacak anlaşmazlıklar, bu Kanunun 167 nci maddesinde tanımlanan hakem kurulu tarafından, bu Kanun ve yönetmelik hükümlerine göre çözümlenir.</template>
          </mvz-altbent>  
        </mvz-bent>
        <mvz-bent no="c">
          <template>Avukatlık ortaklığı tip ana sözleşmesinde bulunması gereken; ortakların kimlik bilgileri, ortaklığın unvanı ve adresi, ortaklık payları, ortaklar arasındaki ilişkiler, iş ve davalarla ilgili iş bölümü, yönetici ortakların yetkileri, ortaklığın yönetimi ve temsili, ortaklar kurulu, kurulun görev ve yetkileri, gelir ve giderin paylaşılması, denetim, ortaklıktan çıkma, çıkarılma, pay devri, ortaklığın sona ermesi, fesih, infisah ve tasfiye gibi hususların esas, şekil ve şartları Türkiye Barolar Birliği Yönetim Kurulunca hazırlanıp Adalet Bakanlığınca onaylanarak Resmî Gazete’de ilan edilen yönetmelikte düzenlenir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="45" başlık="Avukat bürosunda çalışabilecek kişiler">
      <mvz-fıkra no="1">
        <template>Avukatlar ve avukatlık ortaklıkları, bürolarında yalnız avukatlık mesleği için gerekli olan yardımcı elemanları çalıştırabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hâkimliğe ve avukatlığa engel suçlardan biri ile hükümlü olanlar veya avukatlıktan yasaklananlarla her ne şekilde olursa olsun işbirliği edilemez veya bu gibiler büroda çalıştırılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıdaki hükümlere aykırı hareket eden avukat, ilk defasında işten, tekrarında meslekten çıkarma; avukatlık ortaklığı ilk defasında işten çıkarma, tekrarında ise avukatlık ortaklığı sicilinden silinme cezası ile cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="46" başlık="İşlerin stajiyer veya sekreterle takibi, dava dosyalarının incelenmesi ve dosyadan örnek alma">
      <mvz-fıkra no="1">
        <template>Avukat, işlerini kendi sorumluluğu altındaki stajyeri veya yanında çalışan sekreteri eliyle de takip ettirebilir, fotokopi veya benzeri yollarla örnek aldırabilir. Avukatın onanmasını istemediği örnekler harca tâbi değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukat veya stajyer, vekâletname olmaksızın dava ve takip dosyalarını inceleyebilir. Bu inceleme isteğinin ilgililerce yerine getirilmesi zorunludur. Vekâletname ibraz etmeyen avukata dosyadaki kâğıt veya belgelerin örneği veya fotokopisi verilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="47" başlık="Çekişmeli hakları edinme yasağı">
      <mvz-fıkra no="1">
        <template>Avukat el koyduğu işlere ait çekişmeli hakları edinmekten veya bunların edinilmesine aracılıktan yasaklıdır. Bu yasak, işin sona ermesinden itibaren bir yıl sürer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra hükmü, avukatın ortaklarını ve yanında çalıştırdığı avukatları da kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ancak, 164 üncü madde hükmü saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="48" başlık="Avukata çıkar karşılığında iş getirme">
      <mvz-fıkra no="1">
        <template>Avukat veya iş sahibi tarafından vadolunan veya verilen bir ücret yahut da herhangi bir çıkar karşılığında avukata iş getirmeye aracılık edenler ve aracı kullanan avukatlar altı aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu eylemi yapanlar memur iseler, verilecek hapis cezası bir yıldan aşağı olamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="49" başlık="Avukatların resmi kılık ve kıyafeti">
      <mvz-fıkra no="1">
        <template>Avukatlar, mahkemelere Türkiye Barolar Birliği tarafından şekli belirlenen cübbeyle çıkmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukatlara, staj dönemi de dâhil olmak üzere, baro ve Birliğin iş ve işlemleri ile mesleğin icrası kapsamında kılık ve kıyafetle ilgili herhangi bir zorunluluk getirilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="50" başlık="Baroya ve avukatlara ayrılacak yer">
      <mvz-fıkra no="1">
        <template>Her adalet dairesinde, bölgesinde bulunduğu baro için, her mahkeme salonunda ve icra dairesinde ise avukatlar için ihtiyaca yetecek nitelikte yer ayrılması zorunludur.  Birden fazla baronun bulunduğu illerde baro için ayrılacak yer Türkiye Barolar Birliğine tahsis edilir ve Birlik, barolara kayıtlı avukat sayısını esas alarak bu yeri barolara tahsis eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ayrıca her cezaevinde ve kolluk biriminde mesleğin onuruna ve önemine uygun bir görüşme yeri ayrılır. Bu yerlerin bakım ve onarımı ilgisine göre Adalet ve İçişleri Bakanlıklarınca yaptırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="51" başlık="Danışma yapılması uygun olmıyan yerler">
      <mvz-fıkra no="1">
        <template>Avukatlar, baroda yazılı olan bürolarından başka yerlerde, mahkeme salonunda veya adalet binasının başka bir yerinde iş sahipleri ile hukuki danışmada bulunmaktan ve iş kabul etmekten yasaklıdırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıki fıkra hükmü, avukatın özel olarak çağrıldığı hallerde uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="52" başlık="Dosya tutmak">
      <mvz-fıkra no="1">
        <template>Avukat, üzerine aldığı her iş yahut yazılı mütalâasına başvurulan her husus hakkında düzenli dosya tutmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukat, kendisi tarafından yazılan veya taslağı yapılan her belgeyi imzalamakla yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="53" başlık="Görüşmelere ait tutanak">
      <mvz-fıkra no="1">
        <template>Avukat, iş için yaptığı görüşmelerden gerekli saydıklarını bir tutanakla tespit eder. Tutanağın altı, görüşmede bulunanlar tarafından imzalanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="54" başlık="Sicil cüzdanları">
      <mvz-fıkra no="1">
        <template>Levhada yazılı olan her avukatın bağlı olduğu baroda, Türkiye Barolar Birliğinden gönderilen örneğe göre düzenlenecek bir sicil cüzdanı bulunur. Bu cüzdan gizlidir; ancak sahibi veya vekâlet vereceği başka bir avukat tarafından her zaman görülebilir ve gerekli not alınabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir barodan diğerine nakil halinde, cüzdan, nakledilen baro başkanlığına gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="55" başlık="Reklam yasağı">
      <mvz-fıkra no="1">
        <template>Avukatların iş elde etmek için, reklam sayılabilecek her türlü teşebbüs ve harekette bulunmaları ve özellikle tabelalarında ve basılı kâğıtlarında avukat unvanı ile akademik unvanlarından başka sıfat kullanmaları yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yasak, ortak avukatlık bürosu ve avukatlık ortaklığı hakkında da uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıdaki yasaklara ilişkin esaslar Türkiye Barolar Birliğince düzenlenecek yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="56" başlık="Örnek çıkarabilme ve tebligat yapabilme hakkı">
      <mvz-fıkra no="1">
        <template>Usulüne uygun olarak düzenlenen ve avukata verilmiş olan vekâletname 52 nci maddede yazılı dosyada saklanır. Avukat, bu vekâletnamenin örneğini çıkarıp aslına uygunluğunu imzası ile onaylayarak kullanabilir. Avukatın çıkardığı vekâletname örnekleri bütün yargı mercileri, resmi daire ve kurumlar ile gerçek ve tüzel kişiler için resmi örnek hükmündedir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Asıllarının verilmesi kanunda açıkça gösterilmiyen hallerde avukatlar, takibettikleri işlerde, aslı kendilerinde bulunan her türlü kâğıt ve belgelerin örneklerini kendileri onaylıyarak yargı mercileri ile diğer adalet dairelerine verebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Aslı olmayan vekâletname veya diğer kâğıt ve belgelerin örneğini onaylayan yahut aslına aykırı örnek veren avukat, üç yıldan altı yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Avukatlar, vekâlet aldıkları işlerde, ilgili yargı mercii aracılığı ile ve bu yargı merciinin tebligat konusunda bir kararı olmaksızın, diğer tarafa adli kâğıt ve belge tebliğ edebilirler. Tebliğ edilen kâğıt ve belgelerin birer nüshası, gerekli harc, vergi ve resim ödenmek şartiyle, ilgili yargı merciinin dosyasına konur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Avukatlar veya avukatlık ortaklığı başkasını tevkil etme yetkisini haiz oldukları bütün vekâletnamelerini kapsayacak şekilde bir başka avukata veya avukatlık ortaklığına vekâletname yerine geçen yetki belgesi verebilir. Bu yetki belgesi vekâletname hükmündedir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Vekâletnameler Türkiye için tek tip olup, vekâletnamenin biçim ve içeriği Türkiye Barolar Birliği ile Türkiye Noterler Birliği tarafından hazırlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="57" başlık="Avukata karşı işlenen suçlar">
      <mvz-fıkra no="1">
        <template>Görev Sırasında veya yaptığı görevden dolayı avukata karşı işlenen suçlar hakkında, bu suçların hâkimlere karşı işlenmesine ilişkin hükümler uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="58" başlık="Soruşturmaya yetkili Cumhuriyet Savcısı">
      <mvz-fıkra no="1">
        <template>Avukatların avukatlık veya Türkiye Barolar Birliği ya da baroların organlarındaki görevlerinden doğan veya görev sırasında işledikleri suçlardan dolayı haklarında soruşturma, Adalet Bakanlığının vereceği izin üzerine, suçun işlendiği yer Cumhuriyet savcısı tarafından yapılır. Avukat yazıhaneleri ve konutları ancak mahkeme kararı ile ve kararda belirtilen olayla ilgili olarak Cumhuriyet savcısı denetiminde ve kayıtlı olunan baro temsilcisinin katılımı ile aranabilir. Ağır ceza mahkemesinin görev alanına giren bir suçtan dolayı suçüstü hali dışında avukatın üzeri aranamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hukuk Usulü Muhakemeleri Kanunu ile Ceza Muhakemesi Kanununun duruşmanın inzibatına ilişkin hükümleri saklıdır. Şu kadar ki, bu hükümlere göre avukatlar tutuklanamayacağı gibi, haklarında disiplin hapsi veya para cezası da verilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="59" başlık="Kovuşturma izni, son soruşturmanın açılması kararı ve duruşmanın yapılacağı mahkeme">
      <mvz-fıkra no="1">
        <template>58 inci maddeye göre yapılan soruşturmaya ait dosya Adalet Bakanlığı Ceza İşleri Genel Müdürlüğüne tevdi olunur. İnceleme sonunda kovuşturma yapılması gerekli görüldüğü takdirde dosya, suçun işlendiği yer ağır ceza mahkemesine en yakın bulunan ağır ceza mahkemesi Cumhuriyet Savcılığına gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cumhuriyet Savcısı beş gün içinde, iddianamesini düzenliyerek dosyayı son soruşturmanın açılmasına veya açılmasına yer olmadığına karar verilmek üzere ağır ceza mahkemesine verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İddianamenin bir örneği, Ceza Muhakemeleri Usulü Kanununun hükümleri uyarınca, hakkında kovuşturma yapılan avukata tebliğ olunur. Bu tebliğ üzerine avukat, kanunda yazılı süre içinde bazı delillerin toplanmasını ister veya kabule değer bir istemde bulunursa nazara alınır, gerekirse soruşturma başkan tarafından derinleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Haklarında son soruşturmanın açılmasına karar verilen avukatların duruşmaları, suçun işlendiği yer ağır ceza mahkemesinde yapılır.  Durum avukatın kayıtlı olduğu baroya bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Avukatların, avukatlık veya Türkiye Barolar Birliği ya da baroların organlarındaki görevlerinden doğan veya görev sırasında işledikleri suçlar nedeniyle verilen bölge adliye mahkemesi ceza dairelerinin kararları hakkında 4/12/2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun 286 ncı maddesinin ikinci fıkrası uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="60" başlık="İtiraz hakkı">
      <mvz-fıkra no="1">
        <template>59 uncu maddede yazılı mahkemelerin tutuklama veya salıverilmeye yahut son soruşturmanın açılmasına yer olmadığına dair kararlarına karşı Cumhuriyet Savcısı veya sanık tarafından genel hükümler uyarınca itiraz olunabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu itiraz, suçun işlendiği yer ağır ceza mahkemesi hariç olmak üzere, itiraz edilen kararı veren mahkemeye en yakın ağır ceza mahkemesinde incelenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="61" başlık="Suçüstü hali">
      <mvz-fıkra no="1">
        <template>Ağır ceza mahkemesinin görev alanına giren bir suçtan dolayı suçüstü halinde soruşturma, bizzat Cumhuriyet savcısı tarafından genel hükümlere göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="62" başlık="Görevi kötüye kullanma">
      <mvz-fıkra no="1">
        <template>Bu Kanun ve diğer kanunlar gereğince avukat sıfatı ile veya Türkiye Barolar Birliğinin yahut baroların organlarında görevli olarak kendisine verilmiş bulunan görev ve yetkiyi kötüye kullanan avukat Türk Ceza Kanununun 257 nci maddesi hükümlerine göre cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="63" başlık="Avukatlık yetkilerinin başkaları tarafından kullanılmaması">
      <mvz-fıkra no="1">
        <template>Baro levhasında yazılı bulunmıyanlar ve işten yasaklanmış olan avukatlar, şahıslarına ait olmıyan dava evrakını düzenliyemez, icra işlemlerini takip edemez ve avukatlara ait diğer yetkileri kullanamazlar. Baro levhasında yazılı bulunmıyanlar avukatlık unvanını da taşıyamazlar.  Şu kadar ki, baro levhasındaki kaydı yirmi yılı dolanlardan, bürosunu kapatarak vergi kaydını sildiren avukatlar durumları hakkında bilgi vermek ve baroya karşı görev ve yükümlülüklerini yerine getirmek koşuluyla sadece avukat unvanını kullanabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra hükmüne aykırı eylemde bulunanlara Cumhuriyet savcısı tarafından beşyüz Türk Lirasından ikibin Türk Lirasına kadar idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Avukatlık yapmak yetkisini taşımadıkları halde muvazaalı yoldan alacak devralarak ve kanunların tanıdığı başka hakları kötüye kullanarak avukatlara ait yetkileri kullananlar bir yıldan üç yıla kadar hapis ve bin güne kadar adlî para cezası ile cezalandırılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mahkemeler, icra ve iflas daireleri ve barolar, bu maddenin kapsamına giren bir olayı öğrenince Cumhuriyet Savcılığına bildirmek zorundadırlar. Yapılacak kovuşturma sonucu Cumhuriyet Savcısı tarafından baroya bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="64" başlık="Baro yönetim kuruluna karşı özel görevler">
      <mvz-fıkra no="1">
        <template>Denetleme ve şikâyetle ilgili meselelerde avukat, bu kanunda gösterilen meslek sırrını saklama yükümlülüğüne aykırı düşmedikçe, kayıtlı olduğu baro başkanına veya yönetim kuruluna yahut bunlar tarafından görevlendirilen üyelerden birine bilgi vermek ve istek üzerine dosyaları göndermek, dinlenmek üzere çağırıldığı hallerde baro başkanı, yönetim kurulu veya bu kurul üyelerinden birinin davetine uymak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada yazılı zorunluğa uymayan avukat hakkında, kayıtlı olduğu baro yönetim kurulu, onbin liradan yüzbin liraya kadar para cezası verebilir. Bu ceza her davet ve isteğe uymama halinde yeniden verilebilir. Ancak, gönderilen yazıda, davet ve isteğe uymama halinde para cezası verileceğinin belirtilmiş olması şarttır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu para cezasına karşı, tebliğinden itibaren onbeş gün içinde, kararı veren baronun disiplin kuruluna itiraz olunabilir. Baro disiplin kurulunun kararı kesindir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıki fıkralar gereğince hükmedilen para cezaları, bu kanunun disiplin cezalarına ilişkin hükümlerine göre tahsil edilir ve baroya irat yazılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="65" başlık="Baro keseneği">
      <mvz-fıkra no="1">
        <template>Baro keseneğinin yıllık miktarı, genel kurulca belirlenir ve her yılın ocak ve temmuz aylarında iki eşit taksitte ödenir.  Şu kadar ki, mesleğin ilk beş yılında baro keseneği alınmaz. Vadesinde ödenmeyen keseneğe T.C. Merkez Bankası reeskont işlemlerinde uygulanan faiz oranında yıllık temerrüt faizi uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukatlık Kanununun 72 ve 73 üncü madde hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="7-YEDİNCİ" başlık="Baro Levhası ve Avukatlar Listesi">
    <mvz-madde no="66" başlık="Levhaya yazılma yükümlülüğü">
      <mvz-fıkra no="1">
        <template>Her avukat, bölgesi içinde sürekli olarak avukatlık edeceği yerin baro levhasına yazılmakla, yükümlüdür.  Bir ilde birden fazla baronun bulunması hâlinde avukat, bunlardan birinin levhasına yazılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir baro levhasına yazılmış olan avukat, sürekli olmamak şartiyle, memleketin her yerinde avukatlık yapmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="67" başlık="Avukatlığın sürekli olarak başka bölgede yapılması">
      <mvz-fıkra no="1">
        <template>Bir avukat, levhasında yazılı bulunduğu baro bölgesi dışında sürekli olarak avukatlık eder veya disiplin cezası gerektiren bir eylemde bulunursa, bu tespiti yapan baronun yönetim kurulu tarafından bu konuda düzenlenecek tutanak, gereken işlem yapılmak üzere, avukatın levhasında yazılı olduğu baroya gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="68" başlık="Başka baroya nakil">
      <mvz-fıkra no="1">
        <template>Bir barodan diğer baroya nakil hakkındaki istekler, levhasına yazılmak istenen baro yönetim kuruluna yazı ile yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Nakil dilekçelerine hangi belgelerin ekleneceği ve nakilde ne gibi usullerin uygulanacağı yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="69" başlık="Nakille ilgili inceleme ve istemin kabulü">
      <mvz-fıkra no="1">
        <template>Nakil isteği ile başvurulan baronun yönetim kurulu, istekte bulunan avukat hakkında gerekli gördüğü her türlü inceleme ve işlemleri yapar ve özellikle avukatın disiplin kovuşturması altında olup olmadığını, ödenecek borcu bulunup bulunmadığını levhasına yazılı olduğu barodan sorar.  avukatın baroya borçlarını ödemesinden evvel hiçbir işlem yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Nakil isteminin kabulü halinde verilecek karar, nakledilen baro yönetim kurulu tarafından Türkiye Barolar Birliğine ve avukatın ayrıldığı baroya derhal bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="70" başlık="Nakil isteminin reddi">
      <mvz-fıkra no="1">
        <template>Nakil isteminin, levhasına yazılmak için başvurulan baroca reddi halinde, nakil isteğinde bulunan avukat, bu kararın kendisine tebliğinden itibaren onbeş gün içinde Türkiye Barolar Birliğine itiraz edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Baro yönetim kurulu, nakil isteminin baroya varışı tarihinden itibaren bir ay içinde bir karar vermezse istem reddedilmiş sayılır. Bu halde bir aylık sürenin bitiminden itibaren onbeş gün içinde ilgili, Türkiye Barolar Birliğine itiraz edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Türkiye Barolar Birliğinin itiraz üzerine vereceği kararlar kesin olup bu kararlara karşı ilgili tarafından İdari Yargı Merciine başvurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Türkiye Barolar Birliği itiraz dilekçesinin varışı tarihinden itibaren üç ay içinde bir karar vermezse itiraz reddedilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Türkiye Barolar Birliği itirazın kabulü hakkındaki kararını, avukatın naklettiği ve ayrıldığı barolara derhal bildirir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="71" başlık="Levhadan ve avukatlık ortaklığı sicilinden silme">
      <mvz-fıkra no="1">
        <template>Levhadan silme ve avukatlık ortaklığı sicilinden silme kararını avukatın veya avukatlık ortaklığının kayıtlı olduğu baronun yönetim kurulu verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu karardan önce avukatın yazılı cevabı istenmekle birlikte kendisinin dinlenmesi veya dinlenmek üzere yapılan çağrıya süresi içinde uymamış olması şarttır. Avukatlık ortaklığı hakkında da karar verilmesi için ortaklık tarafından görevlendirilecek bir ortağın dinlenmesi veya yapılan çağrıya uyulmamış olması gereklidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Levhadan ve avukatlık ortaklığı sicilinden silme kararı gerekçeli olarak verilir. Bu karara karşı avukat veya avukatlık ortaklığı tebliğ tarihinden itibaren onbeş gün içinde Türkiye Barolar Birliğine itiraz edebilir. Türkiye Barolar Birliğinin itiraz üzerine verdiği kararlar Adalet Bakanlığına ulaştığı tarihten itibaren iki ay içinde Bakanlıkça karar verilmediği veya karar onaylandığı takdirde kesinleşir. Ancak Adalet Bakanlığı uygun bulmadığı kararları bir daha görüşülmek üzere, gösterdiği gerekçesiyle birlikte Türkiye Barolar Birliğine geri gönderir. Geri gönderilen bu kararlar, Türkiye Barolar Birliği Yönetim Kurulunca üçte iki çoğunlukla aynen kabul edildiği takdirde onaylanmış, aksi halde onaylanmamış sayılır; sonuç Türkiye Barolar Birliği tarafından Adalet Bakanlığına bildirilir. 8 inci maddenin altıncı ve yedinci fıkraları hükümleri burada da kıyasen uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Levhadan ve avukatlık ortaklığı sicilinden silme kararı kesinleşinceye kadar ilgili avukat veya avukatlık ortaklığı avukatlık faaliyetini devam ettirme hakkına sahiptir. Şu kadar ki; levhadan silme ve avukatlık ortaklığı sicilinden silme kararı kesinleşinceye kadar avukatın veya avukatlık ortaklığının görevini sürdürmesinde sakınca görülmesi halinde baro yönetim kurulunun istemi ile baro disiplin kurulu avukatı veya avukatlık ortaklığını geçici olarak işten yasaklayabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="72" başlık="Levhadan silinmeyi gerektiren haller">
      <mvz-fıkra no="1">
        <template>Aşağıdaki hallerde avukatın adı levhadan silinir:</template>
        <mvz-bent no="a">
          <template>Avukatlığa kabul için bu kanunun aradığı şartların sonradan kaybedilmiş olması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ruhsatnamenin verildiği tarihte onun verilmemesini gerekli kılan sebeplerin varlığının sonradan tespit edilmiş bulunması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Üç ay içinde baro bölgesinde bir büro açılmamış olması veya büronun kapatılmış yahut baro bölgesi dışına nakledilmiş bulunması, uyarıya rağmen kayıtlı olduğu baro dışında sürekli olarak avukatlık yapan avukatın çalışmasını sürdürdüğü baroya kaydını yaptırmaması,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Baro ve Türkiye Barolar Birliği yıllık keseneklerinin veya staj kredilerinin tebligata rağmen geri ödenmemesi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Avukatın, meslekten isteği ile ayrılmış olması,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Topluluk sigortası primlerinin topluluk sözleşmesinde gösterilen zamanlarda ödenmemesi,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>10 uncu maddedeki engele rağmen levhaya yazılmış olması.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şu kadar ki, staj sırasında mesleğin onuru ile bağdaşması mümkün olmayan işler müstesna olmak üzere, 11 inci maddede sayılan işlerden biri ile uğraştığı, ruhsatnamenin verildiği tarihten itibaren 5 yıl geçtikten sonra anlaşılan avukat, staj süresi içinde elde ettiği ödemelerin veya gelirlerin tutarının üç katını Baroya ödediği takdirde levhaya yeniden yazılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Baroya bildirilen büro terk edilmiş ve yenisi bildirilmemiş ise, 71 inci maddeye göre avukatın dinlenmek üzere çağırılmasından vazgeçilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="73" başlık="Levhaya yeniden yazılma hakkı">
      <mvz-fıkra no="1">
        <template>72 nci maddeye göre levhadan silinmeyi gerektiren hallerin sona erdiğini ispat eden avukat, levhaya yeniden yazılmak hakkını kazanır. Şu kadar ki, baro yönetim kurulu, gerekli gördüğü hallerde, sebeplerini de açıklamak suretiyle, levhaya yeniden yazılma talebinde bulunanı, ilk yazılmaya esas olan şartların hepsinin veya bir kısmının varlığını ispatla zorunlu tutabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ruhsatname verilmesi hükmü ayrık olmak üzere, bu kanunun 7, 8 ve 9 uncu maddeleri levhaya yeniden yazılma istemlerinde de kıyas yolu ile uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Levhaya yeniden yazılmasına evvelce dâhil olduğu baro tarafından karar verilen avukattan yeniden giriş keseneği alınmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="74" başlık="Bir daha yazılmamak üzere levhadan silinme">
      <mvz-fıkra no="1">
        <template>Cezai veya disipline ilişkin bir karar sonunda meslekten çıkarılanlarla 5 inci maddenin (a) bendinde yazılı suçlardan kesin olarak hüküm giyenlerin ruhsatnamesi baro yönetim kurulunca geri alınarak iptal ve adları bir daha yazılmamak üzere levhadan silinir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu işlerin uygulanması, kararın kesinleşmiş olmasına bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Baro yönetim kurullarının bu maddeye dayanarak verdiği karara karşı avukat, kararın kendisine tebliği tarihinden itibaren onbeş gün içinde Türkiye Barolar Birliğine itiraz edebilir. Türkiye Barolar Birliğinin itiraz üzerine verdiği kararlar Adalet Bakanlığına ulaştığı tarihten itibaren iki ay içinde Bakanlıkça karar verilmediği veya karar onaylandığı takdirde kesinleşir. Ancak Adalet Bakanlığı uygun bulmadığı kararları bir daha görüşülmek üzere, gösterdiği gerekçesiyle birlikte Türkiye Barolar Birliğine geri gönderir. Geri gönderilen bu kararlar, Türkiye Barolar Birliği Yönetim Kurulunca üçte iki çoğunlukla aynen kabul edildiği takdirde onaylanmış, aksi halde onaylanmamış sayılır; sonuç Türkiye Barolar Birliği tarafından Adalet Bakanlığına bildirilir. 8 inci maddenin altıncı ve yedinci fıkraları hükümleri burada da kıyasen uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="75" başlık="Avukatlar listesi">
      <mvz-fıkra no="1">
        <template>Baro yönetim kurulu üç yılda bir bölgesi içinde bulunan ve baro levhasında yazılı olan bütün avukatların bir listesini son yılın 31 Aralık tarihine kadar düzenler. Listeye her avukatın alfabe sırasıyla adı, soyadı, büro ve konut adresi yazılır.  Birlikte çalışan avukatların büroları ve avukatlık ortaklıkları listede ayrıca belirtilir. Levhadaki değişiklikler her yıl sonunda düzenlenecek ek listede gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu listenin düzenlenme şekli Türkiye Barolar Birliğince tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Listenin düzenlenmesinden sonra baro levhasına yazılanlara yeni listenin düzenlenmesine kadar kullanılacak geçici bir belge verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Listeden Anayasa Mahkemesine, Yüksek Mahkemelere, Adalet Bakanlığına, Türkiye Barolar Birliğine, diğer barolara, baronun bölgesi içinde bulunan mahkemelerle Cumhuriyet Savcılıklarına, en büyük idare amirine, diğer yargı mercilerine, noterlere ve icra ve iflas dairelerine yeteri kadar gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="8-SEKİZİNCİ" başlık="Barolar">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-madde no="76" başlık="Baroların kuruluş ve nitelikleri">
        <mvz-fıkra no="1">
          <template>Barolar; avukatlık mesleğini geliştirmek, meslek mensuplarının birbirleri ve iş sahipleri ile olan ilişkilerinde dürüstlüğü ve güveni sağlamak; meslek düzenini, ahlâkını, saygınlığını, hukukun üstünlüğünü, insan haklarını savunmak ve korumak, avukatların ortak ihtiyaçlarını karşılamak amacıyla tüm çalışmaları yürüten, tüzel kişiliği bulunan, çalışmalarını demokratik ilkelere göre sürdüren kamu kurumu niteliğinde meslek kuruluşlarıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Barolar, kuruluş amaçları dışında faaliyette bulunamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Protokolde barolar, İl Cumhuriyet Başsavcısının yanında yer alır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="77" başlık="Baronun kurulması, organlarının görevden uzaklaştırılması ve görevlerine son verilmesi">
        <mvz-fıkra no="1">
          <template>Bölgesi içinde en az otuz avukat bulunan her il merkezinde bir baro kurulur. Kurulmuş olan barolarda avukat sayısının otuzun altına düşmesi halinde de ikinci fıkra hükmü uygulanır.  Beşbinden fazla avukat bulunan illerde asgari ikibin avukatla bir baro kurulabilir. Bu sayıların belirlenmesinde baro levhasına kayıtlı avukatlar ile kamu kurum ve kuruluşları ile kamu iktisadi teşebbüslerinde görev yapan avukatlar esas alınır. Kuruluş müracaatında, kuruluş talebini içeren dilekçe ile ikibin avukatın imzasının ve bu avukatların belirlediği dört kişilik kurucular kurulunun isimlerinin yer aldığı liste Türkiye Barolar Birliğine verilir. Birlik, kuruluş işlemlerini yerine getirmek üzere kurucular kurulunu görevlendirir. Kurucular kurulu en geç altı ay içinde organ seçimlerini yapmak üzere kuruluş genel kurulunu toplar ve yeni baronun kuruluşunu tamamlayarak Birliğe bildirir. Yeni kurulan baro, seçimli ilk olağan genel kurulunu yapıncaya kadar Birlikte temsil edilmez ve seçimli ilk olağan genel kurulunu 82 nci madde hükmü uyarınca yapar. Avukat sayısının ikibinin altına düşmesi hâlinde Birlik, asgari avukat sayısının altı ay içinde sağlanmasını yazılı olarak ilgili baroya bildirir. Verilen süre içinde eksiklik giderilemezse baronun tüzel kişiliğine Birlik tarafından son verilir ve son verme kararı Birliğin resmi internet sitesinde ilan edilir. Tüzel kişiliği sona eren baroya kayıtlı avukatlar ve stajyerler ilan tarihinden itibaren onbeş gün içinde o ilde bir baro varsa o baroya, birden fazla baro varsa diledikleri baroya kaydolur ve bunların devam eden iş ve işlemleri kaydoldukları baro tarafından yürütülür. Tüzel kişiliği sona eren baronun tasfiye işlemleri son yönetim kurulu tarafından Birliğin denetim ve gözetiminde yapılır ve kalan malvarlığı Birliğe geçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Baro kurulmayan yerlerin en yakın baroya bağlanmasına veya bunların birleştirilerek bir baro kurulmasına ve merkezlerinin belirlenmesine Türkiye Barolar Birliği karar verir. Türkiye Barolar Birliği yeni kurulacak baro bölgesinde bürosu bulunan levhaya kayıtlı avukatların listesini düzenleyerek bunlardan en kıdemli avukatı, yeni baroyu kurmakla görevlendirir. Görevli avukatın seçeceği ve başkanlığını yapacağı dört kişilik kurucu kurul en geç altı ay içinde yeni baronun kuruluşunu tamamlar ve Türkiye Barolar Birliğine bildirir. Baro yönetim kurulunun yedekleri ile birlikte istifa etmesi halinde baroyu üç ay içinde seçime götürmek kaydıyla aynı kurul oluşturulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Barolar, kuruluşlarını Türkiye Barolar Birliğine bildirmekle tüzel kişilik kazanırlar.  Aynı ilde yeni bir baronun kurulması hâlinde Türkiye Barolar Birliği, tüzel kişilik kazanma tarihini esas almak ve birden başlamak suretiyle baroları o ilin adıyla numaralandırır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Türkiye Barolar Birliği, kuruluşu Adalet Bakanlığına bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Amaçları dışında faaliyet gösteren barolar ile Türkiye Barolar Birliği sorumlu organlarının görevlerine son verilmesine ve yerlerine yenilerinin seçilmesine, Adalet Bakanlığının veya bulundukları yer Cumhuriyet Başsavcılığının istemi üzerine, o yerdeki asliye hukuk mahkemesince basit usule göre yargılama yapılarak karar verilir ve dava en geç üç ay içinde sonuçlandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Görevlerine son verilen organların yerine en geç bir ay içerisinde yenileri seçilir. Yeni seçilenler eskilerin süresini tamamlarlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Adalet Bakanlığının bu Kanun uyarınca baro organlarının işlemleri hakkında onay mercii olarak verdiği kararları görevli baro organları aynen yerine getirmekle yükümlüdürler. Bakanlık kararını idari yargı merciinin yürütmenin durdurulmasına veya esasına ilişkin kararı veya kanuni bir sebep olmaksızın yerine getirmeyen veya eski kararda direnme niteliğinde yeni bir karar veren veya kanunun zorunlu kıldığı işlemleri Bakanlığın uyarısına rağmen yerine getirmeyen baro organları hakkında da yukarıdaki fıkralar hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Görevlerine son verilen organ üyelerinin kanunda yazılı ceza sorumlulukları saklıdır. Bu organların yukarıdaki fıkra gereğince görevlerine son verilmesine neden olan tasarrufları hükümsüzdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Ancak, milli güvenliğin, kamu düzeninin, suç işlenmesini veya suçun devamını önlemenin yahut yakalamanın gerektirdiği hallerde gecikmede sakınca varsa, barolar ile Türkiye Barolar Birliği, vali tarafından faaliyetten men edilebilir. Faaliyetten men kararı, yirmidört saat içinde görevli hâkimin onayına sunulur. Hâkim, kararını kırksekiz saat içinde açıklar, aksi halde, bu idari karar kendiliğinden yürürlükten kalkar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Göreve son verme ve görevden uzaklaştırma hükümleri Baro Genel Kurulu hakkında uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="78" başlık="Görevlerin parasız oluşu ve bir kişide birleşemeyecek görevler">
        <mvz-fıkra no="1">
          <template>Baro başkanlığı, başkanlık divanı, yönetim, denetleme ve disiplin kurulları üyelikleri ile baro menfaatlerini gözetme, temsil ve savunma hususunda avukatlara verilen işler ücretsiz görülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yolculuk ve ikamet giderleriyle diğer zaruri giderler baro kasasından ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Baro başkanlığı, baro yönetim ve disiplin kurulu üyelikleri ve denetçilik bir kişide birleşemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Şu kadar ki, levhada yazılı avukat sayısı kırktan az olan barolarda disiplin kurulu üyeliği ile denetçilik bir kişide birleşebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>

        <mvz-madde no="79" başlık="Organlar">
          <mvz-fıkra no="1">
            <template>Baroların organları şunlardır:</template>
            <mvz-bent no="1.">
              <template>Baro genel kurulu,</template>

            <mvz-bent no="2.">
              <template>Baro yönetim kurulu,</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Baro başkanlığı,</template>

            </mvz-bent>
            <mvz-bent no="5.">
              <template>Baro disiplin kurulu,</template>

            <mvz-bent no="6.">

      <mvz-b1 no="I" başlık="Baro genel kurulu">
        <mvz-madde no="80" başlık="Kuruluşu">
          <mvz-fıkra no="1">
            <template>Baro genel kurulu, baronun en yüksek organı olup levhada yazılı bulunan bütün avukatlardan kurulur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="81" başlık="Görevleri">
          <mvz-fıkra no="1">
            <template>Genel Kurulun görevleri şunlardır:</template>
            <mvz-bent no="1.">
              <template>Yönetim, disiplin ve denetleme kurulları üyeleri ile baro başkanını ve Türkiye Barolar Birliği delegelerini seçmek,</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Levhaya, avukatlık ortaklığı siciline yazılacakların giriş keseneğini avukatlar için en az ikibin en çok sekizbin, avukatlık ortaklıkları için en az yirmibin en çok seksenbin; yıllık keseneğini de, avukatlar için en az bin en çok dörtbin, avukatlık ortaklıkları için en az onbin en çok kırkbin gösterge rakamının her yıl bütçe kanununda Devlet memurları için belirlenen maaş katsayısının çarpımı ile elde edilecek miktar oranında tespit etmek ve bunların ödeneceği tarihleri belirlemek.</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Yönetim kurulunun, baronun gelir ve giderleri ile mallarının yönetimi hakkında vereceği hesapları incelemek ve yönetim kurulunun ibra edilip edilmiyeceği hakkında karar vermek,</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Baro bütçesini onaylamak,</template>
            </mvz-bent>
            <mvz-bent no="5.">
              <template>Yönetim kurulunca hazırlanacak iç yönetmeliği inceliyerek onaylamak,</template>
            </mvz-bent>
            <mvz-bent no="6.">
              <template>Mevcut mevzuatın baro yönetim kuruluna verdiği yetkinin dışında, muhtaç avukatlarla bunların ölümlerinde geride bıraktıkları kimselere yapılacak yardımın şekil ve miktarını tespit etmek,</template>
            </mvz-bent>
            <mvz-bent no="7.">
              <template>Mesleke ait istekleri görüşüp karara bağlamak,</template>
            </mvz-bent>
            <mvz-bent no="8.">
              <template>Avukat bürolarının niteliklerini belirtmek,</template>
            </mvz-bent>
            <mvz-bent no="9.">
              <template>Kanunlarla verilen diğer yetkileri kullanmak.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="82" başlık="Olağan toplantı">
          <mvz-fıkra no="1">
            <template>Genel kurul son rakamı çift olan yıllarda olmak kaydıyla iki yılda bir Ekim ayının ilk haftası içinde baro başkanının daveti üzerine gündemindeki maddeleri görüşmek üzere toplanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="83" başlık="Olağanüstü toplantı">
          <mvz-fıkra no="1">
            <template>Türkiye Barolar Birliği, baro başkanı, yönetim veya denetleme kurulu gerekli gördükleri hallerde genel kurulu olağanüstü toplantıya çağırabilirler. Baro başkanı, levhada yazılı avukatların beşte birinin, görüşme konularını belirten yazılı istemi ile, en geç onbeş gün içinde genel kurulu olağanüstü toplantıya çağırmak zorundadır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="84" başlık="Toplantıya çağrı">
          <mvz-fıkra no="1">
            <template>Genel Kurulun olağan toplantısının yeri, saati ve gündemi ile ilk toplantıda yeterli çoğunluk sağlanamadığı takdirde ikinci toplantının günü, saati ve toplantı yeri, baro çevresi adalet dairelerinde ve baronun uygun bir yerinde en az otuz gün önceden başlamak üzere, genel kurulun toplanacağı tarihe kadar duyurulur. Bu duyuru, tebligat hükmündedir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="85" başlık="Genel kurul başkanlık divanı">
          <mvz-fıkra no="1">
            <template>Gerek olağan, gerekse olağanüstü genel kurul toplantılarında ilk iş olarak toplantıya bir başkan, bir başkanvekili ile iki üyeden kurulu bir başkanlık divanı seçilir. Seçim ayrı ayrı ve genel kurulca aksine karar alınmadıkça işari oyla yapılır ve kullanılan oyların en çoğunu alanlar seçilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Baro başkanı ve yönetim ve denetleme kurulu üyeleri başkanlık divanına seçilemezler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="86" başlık="Toplantıya katılma yükümü">
          <mvz-fıkra no="1">
            <template>Baro levhasında yazılı avukat; gerek olağan, gerek olağanüstü genel kurul toplantılarına katılmak ve oy kullanmakla yükümlüdür. Bu toplantılara haklı bir neden olmaksızın gelmeyenlere veya oy kullanmayanlara ilçe seçim kurulu başkanı tarafından, o baroya kayıtlı avukatların yıllık keseneğinin üçte biri miktarında para cezası verilir. Bu para cezaları ilgili baro başkanlığınca tahsil edilir ve baro bütçesine gelir kaydedilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>64 üncü maddenin üçüncü ve dördüncü  fıkraları, bu maddeye göre verilen para cezaları hakkında da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="87" başlık="Görüşme ve karar yeter sayısı">
          <mvz-fıkra no="1">
            <template>Genel kurul, levhada yazılı avukatların  yarıdan bir fazlasının katılmasiyle toplanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada yazılı çoğunluk sağlanamazsa, toplantı zorunlu bir neden olmadıkça bir hafta sonraya bırakılır. Şu kadar ki, bu erteleme onbeş günü aşamaz. Bu toplantıda, üye sayısı altmışa kadar (altmış dâhil) olan barolarda en az üçte bir, dörtyüze kadar olanlarda (dörtyüz dâhil) beşte bir ve dörtyüzden fazla olanlarda onda bir üye katılmadıkça toplantı ve görüşme yapılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıdaki hükümlere göre yetersayı bulunmak şartiyle, kararlar, tekliflerden en çok oy alanın kabul edilmiş sayılması suretiyle verilir. Oyların eşitliği halinde genel kurul başkanının bulunduğu taraf üstün sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>(Mülga)</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bir üye kendini ilgilendiren özel işinde oy veremez. Seçimlerde bu esas uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Genel kurulun kararları, bir tutanakla tespit edilir. Tutanak, genel kurul başkanlık divanı tarafından imzalanır ve Türkiye Barolar Birliğine gönderilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="88" başlık="Gündem dışı görüşme yasağı">
          <mvz-fıkra no="1">
            <template>Genel kurul toplantısında, görüşüleceği gündemde belirtilmemiş konular hakkında karar verilemez. Yeni bir toplantı kararı bu hükmün dışındadır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="II" başlık="Baro yönetim kurulu">
        <mvz-madde no="89" başlık="Kuruluşu">
          <mvz-fıkra no="1">
            <template>Her baronun yönetim kurulu, baro başkanı ile en az dört üyeden kurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Avukat sayısı elliden yüze kadar olan barolarda altı, yüzbirden ikiyüzelliye kadar olan barolarda 8, 251 den fazla olan barolarda 10 asıl üye ve her baroda asıl üye sayısınca yedek üye bulunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Baro başkanı, yönetim kurulunun başkanıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="90" başlık="Seçilme yeterliği, engelleri ve seçimin şekli">
          <mvz-fıkra no="1">
            <template>Yönetim Kurulu üyeleri levhada yazılı ve avukatlıkta en az beş yıl kıdemli olan avukatlar arasından seçilir. Üye sayısı yüzden az olan barolarda beş yıllık kıdem şartı aranmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Haklarında avukatlığa engel bir suçtan dolayı son soruşturma açılmasına karar verilmiş veya geçmiş beş yıl içinde disiplin kurulunca verilecek kesinleşmiş bir kararla kınama, para veya işten çıkarılma cezalariyle tecziye edilmiş olanlar Yönetim Kurulu Üyesi seçilemezler.  77 nci madde hükmüne dayanılarak görevine son verilenler, yapılacak ilk genel kurulda baro organlarına aday olamazlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>(Mülga)</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yönetim Kurulu üyeleri gizli oy ile seçilirler. Oy puslasına seçilecek asıl üye tamsayısının yarısından en az bir fazla isim yazılması zorunludur. Bundan noksan isim yazılmış oy pusulaları geçerli değildir. Oy pusulasına seçilecek asıl üye sayısından fazla ad yazıldığı takdirde, sondan başlanarak fazla adlar hesaba katılmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Adaylar aldıkları oyların sayısına göre sıralanır ve en çok oy alandan başlanmak üzere önce asıl, sonra yedek üye seçilmiş olanlar bu sıraya göre tespit edilir. Adayların aldıkları oylarda eşitlik halinde meslek kıdemi fazla olan, kıdemleri de eşitse, adayların yaşlısı sırada önalır. Yedek üyeler aldıkları oy sayısına göre bulundukları sıra gözönünde tutularak Kurulda göreve çağırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Seçim yeterliğini kaybeden Yönetim Kurulu üyelerinin görevi kendiliğinden sona erer.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="91" başlık="Seçim dönemi">
          <mvz-fıkra no="1">
            <template>Yönetim Kurulunun görev süresi iki yıldır. Süresi dolan Yönetim Kuruluna mensup üyeler yeniden seçilebilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="92" başlık="Seçim dönemi bitmeden ayrılma">
          <mvz-fıkra no="1">
            <template>Seçim dönemi bitmeden önce ayrılan yönetim kurulu üyesinin yeri, en çok oy almış yedek üye ile doldurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yönetim Kurulu üyelerinden biri hakkında 90 ıncı maddeye göre seçilmeye engel bir suçtan dolayı kamu davası açılmış ise, dava sonuna kadar bu üye Yönetim Kuruluna katılamaz; yeri yedek üye ile doldurulur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="93" başlık="Toplantılar">
          <mvz-fıkra no="1">
            <template>Yönetim Kurulu, Baro Başkanı tarafından, doğrudan doğruya veya üyelerden birinin görüşme konusunu  taşıyan yazılı isteği üzerine toplantıya çağırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yönetim Kurulu salt çoğunlukla toplanır ve üye tam sayısının salt çoğunluğu ile karar verir. Oylarda eşitlik halinde, başkanın bulunduğu taraf üstün tutulur. Baro Başkanı veya Yönetim Kurulu üyeleri, ilgili oldukları işlerin görüşülmesine katılamazlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yönetim Kurulu kararları hakkında düzenlenen tutanak başkan ve üyeler tarafından imzalanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="94" başlık="Toplantıya çağrı">
          <mvz-fıkra no="1">
            <template>Yönetim kurulu üyeleri, baro başkanının çağrısı üzerine toplanır. Ardı ardına üç toplantıya özürsüz olarak katılmamış olan üyenin yönetim kurulu kararı ile üyeliği düşürülür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu karara karşı, tebliğ tarihinden itibaren onbeş gün içinde Türkiye Barolar Birliğine itiraz olunabilir.  İtiraz, kararın uygulanmasını durdurmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="95" başlık="Yönetim kurulunun görevleri">
          <mvz-fıkra no="1">
            <template>Yönetim kurulu, kendisine kanunen verilen görevleri yerine getirmekle yükümlü olup, baronun işlerini kovuşturur ve menfaatlerini korur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yönetim kurulunun başlıca  görevleri şunlardır:</template>
            <mvz-bent no="1.">
              <template>Avukatlık onurunun ve meslek düzeninin korunmasını, meslekin adalet amaçlarına uygun olarak bağlılık ve onurla yapılmasını sağlamak,</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Stajiyer ve avukatların baroya kabul ve levhaya yazılma veya nakil işleri hakkında karar vermek,</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Baro levhasını düzenlemek, avukatların listesini ve avukatlık ortaklığı sicilini tutmak,</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Meslekî ödevler hususunda baro mensuplarına yol göstermek ve onlara bilgi vermek ve meslekî görevlerin yapılıp yapılmadığını denetlemek, mesleğe ve meslek mensuplarına yönelik hak ihlâllerine karşı avukatlık mesleğini ve meslektaşlarını savunmak, bu konularda her türlü yasal ve idarî girişimde bulunmak,</template>
            </mvz-bent>
            <mvz-bent no="5.">
              <template>Levhaya yazılı avukatlar arasında, avukatlarla avukatlık ortaklıkları, avukatlık ortaklığının ortakları arasında ve bunlarla iş sahipleri arasında çıkan anlaşmazlıklarda istek üzerine aracılık etmek ve arabulmak, ücret uyuşmazlıklarında sulha davet etmek,</template>
            </mvz-bent>
            <mvz-bent no="6.">
              <template>Baro mallarını idare ve muhtaç avukatlara yapılacak yardımı şeklini tespit etmek,</template>
            </mvz-bent>
            <mvz-bent no="7.">
              <template>Baro mallarının idaresi hakkında raporlar hazırlayarak genel kurula hesap vermek ve bütçeyi hazırlayıp genel kurulun onayına sunmak,</template>
            </mvz-bent>
            <mvz-bent no="8.">
              <template>Baro adına menkul ve gayrimenkul almak, satmak, ipotek etmek ve bu mallar üzerinde her türlü ayni haklar tesis eylemek ve kaldırmak, bu hususlarda baro başkanına özel yetki vermek,</template>
            </mvz-bent>
            <mvz-bent no="9.">
              <template>Staj işlerini düzenlemek ve denetlemek,</template>
            </mvz-bent>
            <mvz-bent no="10.">
              <template>Yönetim kurulu üyelerinin istifaları hakkında karar vermek,</template>
            </mvz-bent>
            <mvz-bent no="11.">
              <template>Adli müzaharet bürosu kurup yönetmek,</template>
            </mvz-bent>
            <mvz-bent no="12.">
              <template>Genel kurul gündemini hazırlamak,</template>
            </mvz-bent>
            <mvz-bent no="13.">
              <template>Genel kurul kararlarını yerine getirmek,</template>
            </mvz-bent>
            <mvz-bent no="14.">
              <template>Baronun ücretli memurlarının özlük işlerini düzenlemek ve yürütmek,</template>
            </mvz-bent>
            <mvz-bent no="15.">
              <template>İç yönetime ait bütün işleri görmek, yönergeleri düzenlemek,</template>
            </mvz-bent>
            <mvz-bent no="16.">
              <template>Adalet Bakanlığı, Türkiye Barolar Birliği ve disiplin kurulu kararlarını yerine getirmek,</template>
            </mvz-bent>
            <mvz-bent no="17.">
              <template>Bakanlıkların yahut mahkeme veya resmi kurumların istediği konularda görüşünü bildirmek,</template>
            </mvz-bent>
            <mvz-bent no="18.">
              <template>Kanunlarla verilen diğer yetkileri kullanmak.</template>
            </mvz-bent>
            <mvz-bent no="19.">
              <template>Baro bölgesindeki adliye merkezlerinde temsilcilikler kurmak,</template>
            </mvz-bent>
            <mvz-bent no="20.">
              <template>167 nci maddede belirtilen Hakem Kuruluna katılacak avukat hakemleri seçmek,</template>
            </mvz-bent>
            <mvz-bent no="21.">
              <template>Hukukun üstünlüğünü ve insan haklarını savunmak, korumak ve bu kavramlara işlerlik kazandırmak,</template>
            </mvz-bent>
            <mvz-bent no="22.">
              <template>Avukatlık ortaklığı anasözleşmesinin, tip anasözleşmeye uygunluğunu incelemek ve avukatlık ortaklığı siciline tesciline karar vermek.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yönetim kurulu, ikinci fıkranın 4 ve 5 numaralı bentlerinde yazılı görevleri bazı üyelerine devredebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="III" başlık="Baro başkanlığı">
        <mvz-madde no="96" başlık="Seçim ve seçim dönemi bitmeden ayrılma">
          <mvz-fıkra no="1">
            <template>Baro başkanı iki yıllık bir görev süresi için seçilir. Yeniden seçilmek caizdir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Baro başkanı, levhada yazılı ve avukatlıkta en az on yıl kıdemli avukatlar arasından gizli oyla seçilir. Üye sayısı yüzden az olan barolarda kıdem şartı aranmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>90 ıncı maddenin ikinci ve altıncı fıkraları hükümleri, baro başkanının seçimi hakkında da kıyasen uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Seçim döneminin bitmesinden önce ayrılan baro başkanının yerine baro yönetim kurulu tarafından, kendi üyeleri arasından, kalan süreyi tamamlamak üzere baro başkanı seçilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="97" başlık="Görevleri">
          <mvz-fıkra no="1">
            <template>Baro başkanının görevleri şunlardır:</template>
            <mvz-bent no="1.">
              <template>Baroyu temsil ve yönetim kuruluna başkanlık etmek,</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Genel kurul, yönetim kurulu ve disiplin kurulu kararlarını yerine getirmek ve günlük işlemleri yürütmek,</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>95 inci madde gereğince verilen izin ve yetki dairesinde baro adına iltizam ve iktisapta bulunmak, yüklenmelere girişmek, baroya yapılan bağışları kabul etmek ve bütçeyi uygulamak,</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Mahkeme ve resmi dairelerde baroyu temsil edecek ve savunacak avukatları tayin etmek,</template>
            </mvz-bent>
            <mvz-bent no="5.">
              <template>Avukat sicillerinin Türkiye Barolar Birliği tarafından gönderilen örneğine uygun olarak düzenlenmesini ve korunmasını sağlamak,</template>
            </mvz-bent>
            <mvz-bent no="6.">
              <template>Meslek onuru ve bağımsızlığı ile ilgili işlerde kanunlar ve meslek kurallarının gereğini her türlü organlara karşı savunmak ve bu konuda doğrudan doğruya veya dolayısiyle kendisini göreve zorlıyan hususları yapmak,</template>
            </mvz-bent>
            <mvz-bent no="7.">
              <template>Baronun ve yönetim kurulunun çalışmaları hakkında her yıl Türkiye Barolar Birliğine yazılı bir rapor vermek,</template>
            </mvz-bent>
            <mvz-bent no="8.">
              <template>Başkanlık Divanı olmıyan barolarda, divanın diğer üyelerine ait görevleri yerine getirmek ve yetkileri kullanmak,</template>
            </mvz-bent>
            <mvz-bent no="9.">
              <template>Kanunlarla verilen diğer yetkileri kullanmak.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="IV" başlık="Baro başkanlık divanı">
        <mvz-madde no="98" başlık="Kuruluşu ve seçimi">
          <mvz-fıkra no="1">
            <template>Başkanlık divanı:</template>
            <mvz-bent no="1.">
              <template>Baro Başkanı,</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Baro Başkan Yardımcısı,</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Baro Genel Sekreteri,</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Baro Saymanından,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İbarettir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Başkanlık divanı kurulması, 50 den fazla üyesi bulunan barolar için zorunludur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Divanın başkan dışındaki üyeleri, yönetim kurulu için yapılan her seçimden sonraki ilk toplantıda bu kurul tarafından kendi üyeleri arasından gizli oyla seçilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Başkanlık divan, üyelerinden biri süresi dolmadan önce ayrılırsa, kalan görev süresi için en geç bir ay içinde yenisi seçilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="99" başlık="Başkanlık divanının görevleri">
          <mvz-fıkra no="1">
            <template>Başkanlık Divanı, kanunla veya yönetim kurulu kararı ile kendisine verilen görevleri yerine getirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Divan, baro mallarının yönetimi hakkında gerekli kararları alır ve aynı konuda yönetim kurulunun isteğine göre, bu kurula yazılı veya sözlü bilgi verir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="100" başlık="Baro başkan yardımcısının görevleri">
          <mvz-fıkra no="1">
            <template>Baro Başkan yardımcısı, baro başkanının bulunmadığı zamanlarda veya baro başkanlığı herhangi bir sebeple boşalmışsa yenisi işe başlayıncaya kadar başkana ait yetkileri kullanır ve görevleri yerine getirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Baro başkan yardımcısının da yokluğunda başkana ait yetkilerin kullanılması ve görevlerin yerine getirilmesi yönetim kurulunun meslekte en kıdemli üyesine aittir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="101" başlık="Baro genel sekreterinin görevleri">
          <mvz-fıkra no="1">
            <template>Baro genel sekreteri, yönetim kurulu toplantılarına ait tutanakları düzenler, baronun iç çalışmalariyle yazı işlerini yönetir, baro kalemine gerekli direktifleri verir ve kalemin çalışmasını denetler.</template>

        <mvz-madde no="102" başlık="Baro saymanının görevleri">
          <mvz-fıkra no="1">
            <template>Baro saymanı, baronun mallarını başkanlık divanı kararları gereğince yönetmeye ve para alıp vermeye, keseneklerin toplanmasına, baroya gelir yazılacak para cezalarının tahsiline ve bütçenin uygulanmasına dair her türlü gözetimi yapmaya yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Baro saymanı, para alma ve vermede düzenlenen kâğıtları baro başkanı yokluğunda baro başkan yardımcısı veya baro genel sekreteriyle birlikte imzalar.</template>

      <mvz-b1 no="V" başlık="Baro disiplin kurulu">

          <mvz-fıkra no="1">
            <template>Disiplin kurulu, avukat sayısı iki yüz elliye kadar olan barolarda 3, iki yüz elliden fazla olan barolarda 5 üyeden kurulur. Her baroda disiplin kuruluna  üç de yedek üye seçilir.</template>

        <mvz-madde no="104" başlık="Seçilme yeterliği ve engelleri">

            <template>90 ıncı madde hükümleri Disiplin Kurulu üyeleri hakkında da kıyasen uygulanır.</template>

          <mvz-fıkra no="2">
            <template>Seçim sonucu, Yönetim Kurulu tarafından düzenlenen bir tutanak ile Türkiye Barolar Birliğine bildirilir.</template>

        <mvz-madde no="105" başlık="Seçim dönemi">

          <mvz-fıkra no="2">
            <template>Disiplin kurulu seçimden sonra ilk toplantısında üyeleri arasından bir başkan ve bir kâtip seçer. 90, 92 ve 94 üncü maddeler hükümleri, disiplin kurulu üyeleri hakkında da kıyasen uygulanır.</template>

        <mvz-madde no="106" başlık="Toplantılar">

          <mvz-fıkra no="2">
            <template>Kararlar, üye tam sayısının salt çoğunluğu ile verilir. Oylarda eşitlik halinde, başkanın bulunduğu taraf üstün tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Başkanın bulunmadığı zamanlarda, meslekte en kıdemli üye kurula başkanlık eder.</template>

        <mvz-madde no="107" başlık="Görevi">
          <mvz-fıkra no="1">
            <template>Disiplin kurulunun görevi, baro yönetim kurulunun disiplin kovuşturması açılmasına dair kararı üzerine avukatlar hakkında disiplin kovuşturması yaparak disiplinle ilgili kararları ve cezaları vermek ve kanunla verilen diğer yetkileri kullanmaktır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="VI" başlık="Baro denetleme kurulu">
        <mvz-madde no="108" başlık="Kuruluş ve görevi">
          <mvz-fıkra no="1">
            <template>Baro genel kurulu, baronun mali işlerini denetlemek üzere iki yıllık süre için kendi üyeleri arasından en çok üç asıl ve üç yedek denetçi seçer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Seçim gizli oyla yapılır. 90 ve 92 nci maddeler hükümleri denetçiler hakkında da kıyasen uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>

  <mvz-kısım no="9-DOKUZUNCU" başlık="Türkiye Barolar Birliği">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-madde no="109" başlık="Birliğin kuruluş ve nitelikleri">
        <mvz-fıkra no="1">
          <template>Türkiye Barolar Birliği, bütün baroların katılmasıyla oluşan bir kuruluştur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birlik, tüzel kişiliğe sahip kamu kurumu niteliğinde bir meslek kuruluşudur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birliğin merkezi Ankara'dır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="110" başlık="Birliğin görevleri">
        <mvz-fıkra no="1">
          <template>Türkiye Barolar Birliğinin görevleri şunlardır:</template>
          <mvz-bent no="1.">
            <template>Baroları ilgilendiren konularda her baronun görüşünü öğrenip, ortaklaşa görüşmeler sonunda çoğunluğun düşünce ve görüşünü belirtmek,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Baroların çalışmalarını ortak amaca ulaşacak şekilde tasarlayıp meslekin gelişmesini sağlamak,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Baro mensuplarının genel menfaatlerini ve meslekin ahlak, düzen ve geleneklerini korumak,</template>
