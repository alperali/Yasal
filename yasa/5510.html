          <mvz-bent no="a">
            <template>Dul eşine % 50'si; aylık bağlanmış çocuğu bulunmayan dul eşine ise bu Kanunun 5 inci maddesinin birinci fıkrasının (a), (b) ve (e) bentleri hariç bu Kanun kapsamında veya yabancı bir ülke mevzuatı kapsamında çalışmaması veya kendi sigortalılığı nedeniyle gelir veya aylık bağlanmamış olması halinde % 75'i,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bu Kanunun 5 inci maddesinin birinci fıkrasının (a), (b) ve (e) bentleri hariç bu Kanun kapsamında veya yabancı bir ülke mevzuatı kapsamında çalışmayan veya kendi sigortalılığı nedeniyle gelir veya aylık bağlanmamış çocuklardan;</template>
            <mvz-altbent no="1">
              <template>18 yaşını, lise ve dengi öğrenim görmesi halinde 20 yaşını, yüksek öğrenim yapması halinde 25 yaşını doldurmayanların veya,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Kurum Sağlık Kurulu kararı ile çalışma gücünü en az % 60 oranında yitirip malûl olduğu anlaşılanların veya,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Yaşları ne olursa olsun evli olmayan, evli olmakla beraber sonradan boşanan veya dul kalan kızlarının,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="0">
            <template>her birine %25'i,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>(b) bendinde belirtilen çocuklardan sigortalının ölümü ile anasız ve babasız kalan veya sonradan bu duruma düşenlerle, ana ve babaları arasında evlilik bağı bulunmayan veya sigortalının ölümü tarihinde evlilik bağı bulunmakla beraber ana veya babaları sonradan evlenenler ile kendisinden başka aylık alan hak sahibi bulunmayanların her birine %50'si,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Hak sahibi eş ve çocuklardan artan hisse bulunması halinde her türlü kazanç ve irattan elde etmiş olduğu gelirinin asgari ücretin net tutarından daha az olması ve diğer çocuklarından hak kazanılan gelir ve aylıklar hariç olmak üzere gelir ve/veya aylık bağlanmamış olması şartıyla ana ve babaya toplam %25'i oranında; ana ve babanın 65 yaşın üstünde olması halinde ise artan hisseye bakılmaksızın yukarıdaki şartlarla toplam %25'i,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>oranında aylık bağlanır.  Ancak, hak sahibi çocuklardan 18 yaşını, lise ve dengi öğrenim görmesi halinde 20 yaşını, yükseköğrenim yapması halinde 25 yaşını doldurmayanların, bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında sigortalı sayılmaları, bunlara aylık bağlanmasına engel oluşturmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sigortalı tarafından evlât edinilmiş, tanınmış veya soy bağı düzeltilmiş veya babalığı hükme bağlanmış çocukları ile sigortalının ölümünden sonra doğan çocukları, bağlanacak aylıktan yukarıda belirtilen esaslara göre yararlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hak sahiplerine bağlanacak aylıkların toplamı sigortalıya ait aylığın tutarını geçemez. Bu sınırın aşılmaması için gerekirse hak sahiplerinin aylıklarından orantılı olarak indirimler yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35" başlık="Hak sahiplerinin aylıklarının başlangıcı, kesilmesi ve yeniden bağlanması">
        <mvz-fıkra no="1">
          <template>Ölüm sigortasından sigortalının hak sahiplerine bağlanacak aylıklar;</template>
          <mvz-bent no="a">
            <template>Sigortalının ölüm tarihini,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Hak sahibi olma niteliğinin ölüm tarihinden sonra kazanılması halinde, bu niteliğin kazanıldığı tarihi,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>takip eden ay başından itibaren başlatılır. Hak sahiplerine bağlanan aylıklar 34 üncü maddede belirtilen şartların ortadan kalktığı tarihi takip eden ödeme dönemi başından itibaren kesilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak bu Kanunun 4 üncü maddesinin dördüncü fıkrasının (d), (e) ve (f) bentlerinde belirtilenlerden öğrenci olanların sigortalı sayılmaları, bağlanan aylıkların kesilmesini gerektirmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Aylığın kesilmesine yol açan sebebin ortadan kalkması halinde, 34 üncü maddede belirtilen şartlar saklı kalmak kaydıyla, müracaat tarihini takip eden ay başından itibaren yeniden aylık bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu madde gereğince aylığı kesilen çocuklardan, sonradan Kurum Sağlık Kurulu kararı ile çalışma gücünü en az %60 oranında kaybederek malûl olduğu anlaşılanlara, 34 üncü maddede belirtilen şartları taşımaları halinde, malûllük durumlarının tespitine esas teşkil eden rapor tarihini takip eden ay başından itibaren, 94 üncü madde hükmü saklı kalmak kaydıyla aylık bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yeniden bağlanan aylık, aylığın kesildiği tarihten tekrar bağlandığı tarihe kadar geçen süre için 55 inci maddenin ikinci fıkrasına göre artırılmak suretiyle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="36" başlık="Ölüme bağlı toptan ödeme ve ihya">
        <mvz-fıkra no="1">
          <template>4 üncü maddenin birinci fıkrasının (a) ve (b) bentleri kapsamındaki sigortalılar ile bu Kanuna göre ilk defa aynı maddenin birinci fıkrasının (c) bendi kapsamında sigortalı olanlardan ölen sigortalıların hak sahiplerine ölüm aylığı bağlanamaması durumunda, ölüm tarihi esas alınmak kaydıyla 31 inci maddenin birinci fıkrasına göre hesaplanan tutar, 34 üncü madde hükümleri dikkate alınarak hak sahiplerine toptan ödeme şeklinde verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hak sahiplerine yapılacak toptan ödemenin toplamı, sigortalıya yapılacak toptan ödeme tutarını geçemez. Bu sınırın aşılmaması için gerekirse hak sahiplerinin hisselerinden orantılı olarak indirim yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Toptan ödeme yapıldıktan sonra artan tutar olursa sigortalının ölümünden sonra doğan veya soy bağı düzeltilen veya babalığı hükme bağlanan çocuklarına da bu madde hükümlerine göre toptan ödeme yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanuna göre toptan ödeme yapılarak tasfiye edilmiş süreler, borçlanılarak veya yurt dışı hizmetleri birleştirilerek ya da sonradan hizmet tespiti nedeniyle hak kazanılan sürelerin eklenmesi suretiyle ölüm sigortasından yararlanmak için gerekli prim ödeme gün sayısının tamamlanması halinde, hak sahiplerinin yazılı isteği üzerine 31 inci maddenin ikinci fıkrasına göre ihya edilir. Yukarıdaki süreler, ihya edilen süreye ilişkin tutar dahil her türlü borçların ödendiği tarihi takip eden ay başı itibarıyla bu Kanuna göre aylık bağlanmasında dikkate alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="Evlenme ve cenaze ödeneği">
        <mvz-fıkra no="1">
          <template>Evlenmeleri nedeniyle, gelir veya aylıklarının kesilmesi gereken kız çocuklarına evlenmeleri ve talepte bulunmaları halinde almakta oldukları aylık veya gelirlerinin iki yıllık tutarı bir defaya mahsus olmak üzere evlenme ödeneği olarak peşin ödenir. Evlenme ödeneği alan hak sahibinin aylığının kesildiği tarihten itibaren iki yıl içerisinde yeniden hak sahibi olması halinde, iki yıllık sürenin sonuna kadar gelir veya aylık bağlanmaz, bu durumda olanlar 60 ıncı maddenin birinci fıkrasının (f) bendi kapsamında genel sağlık sigortalısı sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Evlenme ödeneği verilmesi halinde, diğer hak sahiplerinin aylık veya gelirleri evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren 34 üncü maddeye göre yeniden belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İş kazası veya meslek hastalığı sonucu veya sürekli iş göremezlik geliri, malûllük, vazife malûllüğü veya yaşlılık aylığı almakta iken veya kendisi için en az 360 gün malûllük, yaşlılık ve ölüm sigortası primi bildirilmiş olup da ölen sigortalının hak sahiplerine Kurum Yönetim Kurulunca belirlenip Bakan tarafından onaylanan tarife üzerinden cenaze ödeneği ödenir. Cenaze ödeneği, sırasıyla sigortalının eşine, yoksa çocuklarına, o da yoksa ana babasına, o da yoksa kardeşlerine verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Cenaze ödeneğinin üçüncü fıkrada sayılanlara ödenememesi ve sigortalının cenazesinin gerçek veya tüzel kişiler tarafından kaldırılması durumunda, üçüncü fıkrada belirtilen tutarı geçmemek üzere belgelere dayanan masraflar, masrafı yapan gerçek veya tüzel kişilere ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı sayılanlardan ölenlerin hak sahiplerine kendi kurumları tarafından ilgili mevzuat gereği ölüm yardımı hariç cenaze gideri, cenaze nakil gideri ödeneği veya bu mahiyette bir ödemenin yapılması halinde, Kurum tarafından cenaze ödeneği ödenmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="Uzun vadeli sigorta kolları bakımından sigortalılık süresi">
        <mvz-fıkra no="1">
          <template>Malûllük, yaşlılık ve ölüm sigortalarının uygulanmasında dikkate alınacak sigortalılık süresinin başlangıcı; sigortalının, mülga 2/6/1949 tarihli ve 5417 sayılı İhtiyarlık Sigortası Kanununa, mülga 4/2/1957 tarihli ve 6900 sayılı Malûliyet, İhtiyarlık ve Ölüm Sigortaları Hakkında Kanuna, 17/7/1964 tarihli ve 506 sayılı Sosyal Sigortalar Kanununa, 2/9/1971 tarihli ve 1479 sayılı Esnaf ve Sanatkârlar ve Diğer Bağımsız Çalışanlar Sosyal Sigortalar Kurumu Kanununa, 17/10/1983 tarihli ve 2925 sayılı Tarım İşçileri Sosyal Sigortalar Kanununa, bu Kanunla mülga 17/10/1983 tarihli ve 2926 sayılı Tarımda Kendi Adına ve Hesabına Çalışanlar Sosyal Sigortalar Kanununa ve 8/6/1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanununa, 506 sayılı Sosyal Sigortalar Kanununun geçici 20 nci maddesi kapsamındaki sandıklara veya bu Kanuna tâbi olarak malûllük, yaşlılık ve ölüm sigortalarına tabi olarak ilk defa kapsama girdiği tarih olarak kabul edilir. Uluslararası sosyal güvenlik sözleşmeleri hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunun uygulanmasında 18 yaşından önce malûllük, yaşlılık ve ölüm sigortalarına tâbi olanların sigortalılık süresi, 18 yaşını doldurdukları tarihte başlamış kabul edilir. Bu tarihten önceki süreler için ödenen malûllük, yaşlılık ve ölüm sigortaları primleri, prim ödeme gün sayılarının hesabına dahil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Aylık bağlama işlemlerinde dikkate alınan sigortalılık süreleri, sigortalılığın başlangıç tarihi ile sigortalının aylık bağlanması için yazılı istekte bulunduğu, aylık bağlanması için istekte bulunmayan sigortalılar için ise ölüm tarihi arasında geçen süredir. 4 üncü maddenin birinci fıkrasının (c) bendi kapsamındaki sigortalılar bakımından sigortalılık süresi; sigortalılığın başlangıç tarihi ile 48 inci maddeye göre yetkili makamdan emekliye sevk onayının alınarak görevi ile ilişiğinin kesildiği ayın son günü arasında geçen süredir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Vazife malûllüğü aylığı almakta iken, çalışmaya başlamaları nedeniyle haklarında uzun vadeli sigorta hükümleri uygulananlar için malûllük, yaşlılık ve ölüm aylığı bağlanmasında veya toptan ödeme yapılmasında esas alınacak sigortalılık süresi, prim ödeme gün sayısı ve prime esas kazancın hesaplanmasında, vazife malûllüğü aylığı bağlandığı tarihten önceki süreler dikkate alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="Uzun vadeli sigorta kolları bakımından üçüncü kişinin sorumluluğu">
        <mvz-fıkra no="1">
          <template>Üçüncü bir kişinin kastı nedeniyle malûl veya vazife malûlü olan sigortalıya veya ölümü halinde hak sahiplerine, bu Kanun uyarınca bağlanacak aylığın başladığı tarihteki ilk peşin sermaye değerinin yarısı için Kurumca zarara sebep olan üçüncü kişilere rücû edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Malûllük, vazife malûllüğü veya ölüm hali, kamu görevlilerinin veya er ve erbaşlar ile kamu idareleri tarafından görevlendirilen diğer kişilerin vazifelerinin gereği olarak yaptıkları fiiller sonucu meydana gelmiş ise, bu fiillerden dolayı haklarında kesinleşmiş mahkûmiyet kararı bulunanlar hariç olmak üzere, sigortalı veya hak sahiplerine yapılan ödemeler veya bağlanan aylıklar için Kurumca, kurumuna veya ilgililere rücû edilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="40" başlık="Fiilî hizmet süresi zammı">
        <mvz-fıkra no="1">
          <template>Aşağıda belirtilen işyerlerinde ve işlerde 4 üncü maddenin birinci fıkrasının (a) ve (c) bentleri kapsamında çalışan sigortalıların prim ödeme gün sayılarına, bu işyerlerinde ve işlerde geçen çalışma sürelerinin her 360 günü için karşılarında gösterilen gün sayıları, fiilî hizmet süresi zammı olarak eklenir. 360 günden eksik sürelere ait fiilî hizmet süresi zammı, 360 gün için eklenen fiilî hizmet süresi ile orantılı olarak belirlenir. Çalışmanın fiili hizmet süresi zammı kapsamında değerlendirilebilmesi için, tablonun (13) ve (14) numaralı sıralarında belirtilen sigortalılar hariç sigortalının kapsamdaki işyerleri ile birlikte belirtilen işlerde fiilen çalışması ve söz konusu işlerin risklerine maruz kalması şarttır.  Tablonun (10) numaralı sırasında belirtilen sigortalıların, fiili hizmet süresi zammından yararlandırılacakları dönem içinde kalan; yıllık ücretli izin, sıhhi izin, hafta tatili, ulusal bayram ve genel tatil günleri ile eğitim, kurs, iş öncesi ve sonrası hazırlık sürelerinde fiilen çalışma ve söz konusu işlerin risklerine maruz kalma şartı aranmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Aşağıdaki bentlerden birden fazlasına dahil olanlar için, en yüksek olan bentten fiilî hizmet süresi zammı uygulanır.</template>

                  </tr>

                  <tr class="align-middle">
                    <td>2) Cam fabrika ve atölyeleri</td>

                      <div>2) Eritme işlerinde (otomatik besleme fırınlarıyla çalışılmadığı takdirde) çalışanlar.</div>

                      <div>8) Yayma fırınlarında düzeltme işlerinde çalışanlar.</div>

                      <div>11) Basınçlı havayla kum püskürten cihazlarla yapılan işlerde (çalışma ortamındaki tozları sağlık için tehlike oluşturmayacak düzeye indiren havalandırma tesisatı bulunmadığı takdirde) çalışanlar.</div>

      <mvz-madde no="43" başlık="Cumhurbaşkanlığı, Türkiye Büyük Millet Meclisi Başkanlığı, Başbakanlık, Cumhurbaşkanı yardımcılığı, Bakanlık ve Türkiye Büyük Millet Meclisi üyeliği görevinde bulunanların aylıkları">
        <mvz-fıkra no="1">
          <template>Cumhurbaşkanı iken bu görevinden herhangi bir nedenle ayrılanlara, istekleri üzerine, müracaat tarihini takip eden ay başından itibaren 140.690 gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarda yaşlılık aylığı bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, herhangi bir nedenle görevden ayrılan Cumhurbaşkanı, 28 inci maddeye göre yaşlılık aylığına hak kazanıyorsa, 29 uncu maddeye göre yaşlılık aylığı ayrıca hesaplanır ve aylıklardan yüksek olanı yaşlılık aylığı olarak bağlanır. 28 inci maddeye göre aylığa hak kazanamaması halinde birinci fıkraya göre bağlanan aylığın tümü, 28 inci maddeye göre aylığa hak kazanması halinde ve 29 uncu maddeye göre hesaplanan aylık, birinci fıkraya göre bağlanan aylıktan düşükse aradaki fark, Hazineden tahsil edilir.</template>

        <mvz-fıkra no="3">
          <template>Türkiye Büyük Millet Meclisi Başkanı veya Başbakan iken bu görevinden herhangi bir nedenle ayrılanlara, istekleri üzerine, müracaat tarihini takip eden ay başından itibaren, 133.988 gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarda yaşlılık aylığı bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ancak herhangi bir nedenle görevden ayrılan Türkiye Büyük Millet Meclisi Başkanı veya Başbakan, 28 inci maddeye göre yaşlılık aylığına hak kazanıyorsa, 29 uncu maddeye göre yaşlılık aylığı ayrıca hesaplanır ve aylıklardan yüksek olanı yaşlılık aylığı olarak bağlanır. 28 inci maddeye göre aylığa hak kazanılamıyorsa üçüncü fıkraya göre bağlanan aylığın tümü, 28 inci maddeye göre aylığa hak kazanılıyor ve 29 uncu maddeye göre hesaplanan aylık, üçüncü fıkraya göre bağlanan aylıktan düşükse aradaki fark Hazineden tahsil edilir.</template>

        <mvz-fıkra no="5">

        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Cumhurbaşkanı yardımcılığı, bakanlık veya Türkiye Büyük Millet Meclisi üyeliği görevlerinde bulunanlara veya bu görevleri herhangi bir sebeple sona erenlere, Kanunun 26, 28, 44, geçici 2 ve geçici 4 üncü maddeleri gereğince aylık bağlanmasına hak kazanmaları ve en az 2 yıl süreyle bu görevlerde bulunmuş olmaları halinde, 27, 29, geçici 2 ve geçici 4 üncü maddelere göre hesaplanacak aylık tutarından az olmamak kaydıyla, 122.530 gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarda malullük, emeklilik veya yaşlılık aylığı ödenir. Bu fıkra hükümlerine göre aylık ödenebilmesi için, bu maddenin yürürlüğe girdiği tarihten önce geçici 4 üncü madde kapsamında Cumhurbaşkanı yardımcılığı, bakanlık ya da Türkiye Büyük Millet Meclisi üyeliği görevi esas alınarak malullük veya emeklilik aylığı ödenenler hariç olmak üzere, malullük, emeklilik veya yaşlılık aylığı bağlanmış olanlar ile aylık bağlanma şartlarını haiz olmayanların en az 2 yıl süreyle en yüksek Devlet memuru emsal alınarak sigorta primi veya geçici 4 üncü madde kapsamında emekli keseneği ile kurum karşılığı ödemiş olmaları da zorunludur.</template>

        <mvz-fıkra no="7">

      <mvz-madde no="45" başlık="Kanunları gereğince görevden uzaklaştırılanlar, tutuklananlar veya görevine son verilenlerin sigortalılıkları ve primleri">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında olan sigortalılardan görevden uzaklaştırılan, görevi ile ilgili olsun veya olmasın herhangi bir suçtan tutuklanan veya gözaltına alınanlardan, kanunları gereğince eksik aylığa müstahak bulunanların prime esas kazançlarının yarısı; kanunlarına göre bu müddetler için sonradan görevlerine iade edilerek tam aylığa hak kazananların ise prime esas kazançlarının tamamı üzerinden prim alınır.  Prime esas kazançların yarısı üzerinden prim alınanların prim ödeme gün sayısı bu sürelerin yarısı olarak hesap edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Görevine son verilenlerden yargı kararı ile görevlerine iade edilenlerin primleri, göreve son verildiği tarihten görevine başladığı tarihe kadar kendi kadrosunun veya emsali kadronun prime esas kazancına göre hesaplanır. Bu durumdakilerin primlerine ait sigortalı ve işveren hisselerinin gecikme cezası ve gecikme zamları kurumlarınca ödenir ve bu süreler sigortalılık süresinden sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci ve ikinci fıkraya göre sigortalılık durumu değişenler için ek bildirge düzenlenerek Kuruma verilir ve bu durumda 102 nci madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında sigortalı sayılanlardan, ilgili kanunları gereğince kullandıkları aylıksız izin sürelerinin bitiminden sonra göreve başlayanlar ile göreve başlaması için tanınan süreler ile bir yıl ve daha az süreyle aylıksız izne ayrılanların aylıksız izin sürelerinde bu Kanunun 67 nci maddesinde aranan 30 günlük prim ödeme şartı aranmaz.  Bu durumdaki sigortalıların aylıksız izinli oldukları süreler için prime esas kazanç alt sınırının altında olmamak kaydıyla aylıksız izne ayrıldıkları tarihteki prime esas kazançları üzerinden %12 oranında genel sağlık sigortası primi işverenlerince ödenir. Ancak askerlik hizmeti nedeniyle aylıksız izne ayrılanların genel sağlık sigortası priminin ödenmesinde, bir yıllık süre sınırı uygulanmaz.</template>

      <mvz-madde no="46" başlık="Bazı kamu görevlilerinin prime esas kazançları ve prime esas kazanç üst sınırı">
        <mvz-fıkra no="1">
          <template>Harp okulları ile fakülte ve yüksek okullarda Milli Savunma Bakanlığı hesabına okuyanların ve astsubay meslek yüksek okulu öğrencileri ile astsubay nasbedilmek üzere temel askerlik eğitimine tabi tutulan adaylar ile Jandarma ve Sahil Güvenlik Akademisi ile fakülte ve yüksekokullarda Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı nam ve hesabına okuyanlar ile subay ve astsubay naspedilmek üzere temel askerlik eğitimine tabi tutulan adayların öğrenci harçlıkları ile ilgisine göre en az aylık alan teğmen veya astsubay çavuşun prime esas kazançları arasındaki farkın primi; polis akademisi ile fakülte ve yüksek okullarda Emniyet Genel Müdürlüğü hesabına okuyan öğrencilerin öğrenci harçlıkları ile komiser yardımcısı veya polis memuru prime esas kazançları arasındaki farkın primi, öğrenciler adına kurumlarınca ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Fakülte veya yüksek okullarda kendi hesabına okuduktan sonra subay veya astsubaylığa nasbedilen veya yedek subaylık hizmetini takiben subaylığa geçirilenler veya yedek astsubaylık hizmetini takiben astsubaylığa geçirilenler ile fakülte ve yüksekokullarda kendi hesabına okuduktan sonra, komiser yardımcısı veya polis memuru olarak atananların başarılı öğrenim süreleri; borçlanmanın yapıldığı tarihte ilgisine göre en az aylık alan teğmenin, astsubay çavuşun veya polis memuru ya da komiser yardımcısının prime esas kazancının %45'i üzerinden, bu sürelere ait primler kendilerince ödenerek borçlandırılmak suretiyle hizmetten sayılır. Bu şekilde hesap edilecek borç, tebliğ tarihinden itibaren iki yıl içinde eşit taksitler halinde ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Fakülte veya yüksek okullarda kendi hesabına okumakta iken Milli Savunma Bakanlığı, Jandarma Genel Komutanlığı, Sahil Güvenlik Komutanlığı veya Emniyet Genel Müdürlüğü hesabına okumaya devam eden öğrencilerin, daha önce kendi hesabına okudukları normal okul süreleri hakkında, ikinci fıkra hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Talim ve manevra için rütbe ile silâh altına alınan 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında olan sigortalılardan rütbelerinin prime esas kazançları, vazifelerinin prime esas kazancından fazla olanların prime esas kazanç farklarına ait primleri vazife gördükleri kurumlarınca ve seferberlik ve harp için silâh altına alınanlardan vazifelerinin prime esas kazançları, rütbelerinin prime esas kazancından fazla olanların prime esas kazançları arasındaki farkın primleri de, rütbelerinin prime esas kazancını ödeyen kamu idaresince kesilerek Kuruma ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamına giren sigortalıların prime esas kazançlarının tespitinde 82 nci maddede belirtilen üst sınır aranmaz. 4 üncü maddenin birinci fıkrasının (c) bendi kapsamına giren sigortalılardan, aylıksız izinli sayılmaksızın ve tabi olduğu personel kanunu ile ilgisi devam edecek şekilde yurt dışına geçici ya da sürekli görevle gönderilenlerin prime esas kazancının hesabında; geçici görevle gönderilenlerin bulundukları kadroya ilişkin prime esas kazancı, yurt dışı kadrolarına atananların ise yurt dışına atanma tarihi itibarıyla, atandıkları kadro ile atanmadan önceki yurt içi kadrosuna ilişkin prime esas kazançtan yüksek olanı esas alınır. Sürekli görevle atananların yurt dışı kadrolarına ilişkin prime esas kazancın hesabında dikkate alınacak ödeme unsurlarından, ilgili mevzuatı uyarınca söz konusu kadroya bağlı olarak belirleme yapılmamış ödeme unsur ve tutarlarını, kadrosunun bulunduğu kurum personelinin yararlanmakta olduğu ödeme unsurlarıyla sınırlı olmak ve aynı veya benzer nitelikteki kadroya ilişkin prime esas kazanca tabi ödemeleri gözönünde bulundurmak suretiyle belirlemeye ilgili kamu idaresinin görüşü üzerine Kurum ve Maliye Bakanlığı müştereken yetkilidir.</template>
        </mvz-fıkra>

      <mvz-madde no="47" başlık="Vazife Malûllüğü">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yürürlüğe girdiği tarihten sonra ilk defa 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı olanlar için aşağıdaki hallerde vazife malûllüğü hükümleri uygulanır. 25 inci maddede belirtilen malûllük; sigortalıların vazifelerini yaptıkları sırada veya vazifeleri dışında idarelerince görevlendirildikleri herhangi bir kamu idaresine ait başka işleri yaparken bu işlerden veya kurumlarının menfaatini korumak maksadıyla bir iş yaparken ya da idarelerince sağlanan bir taşıtla işe gelişi ve işten dönüşü sırasında veya işyerinde meydana gelen kazadan doğmuş olursa, buna vazife malûllüğü ve bunlara uğrayanlara da vazife malûlü denir.</template>

        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu idareleri vazife malûllüğüne sebep olan olayı, o yer yetkili kolluk kuvvetlerine veya kendi mevzuatına göre yetkili mercilere derhal, Kuruma da en geç onbeş iş günü içinde bildirmekle yükümlüdür. Kuruma bildirim, aynı süre içerisinde sigortalılar veya hak sahiplerince de yapılabilir. Vazife malûllüğüne sebep olan olaydan kamu idarelerinin yetkili mercilerinin haberdar edilmemiş olması hali dışında; ilgililerin bildirimi, kamu idarelerinin bildirim sorumluluğunu ortadan kaldırmaz.</template>

        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Süresi içerisinde bildirimde bulunulan vazife malûllüğü aylıkları, sigortalının ölüm ya da malûliyeti sebebiyle göreviyle ilişiğinin kesildiği tarihi takip eden aybaşından itibaren bağlanır.  Ancak, harp malulleri ile 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanuna veya 2330 sayılı Kanun hükümleri uygulanarak aylık bağlanmasını gerektiren kanunlara göre veya 5434 sayılı Kanunun 56 ncı maddesine göre vazife malulü olduğuna karar verilenlerden, sınıf veya görev değiştirerek çalışmaya devam edenlere ise görevden ayrılmalarına ve başkaca bir müracaata gerek kalmaksızın sınıf veya görev değiştirerek çalışmaya başladıkları tarihi takip eden ay başından itibaren aylık bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Vazife malûllüğü süresi içerisinde bildirilmeyen sigortalılara; kamu idareleri ya da sigortalılar veya hak sahiplerince sonradan yapılacak bildirim üzerine, vazife malûllüklerinin belgelenmesi ve müstahak olmaları şartıyla, bu Kanunun zamanaşımı hükümleri dikkate alınmak suretiyle vazife malûllüğü aylığı bağlanır veya bağlanmış olan aylıklar düzeltilir. Bu durumda sigortalı veya hak sahiplerine bağlanacak aylık ya da aylık farklarının, vazife malûllüğünün bildirildiği tarihe kadar olan toplam tutarı Kurumca ilgili kamu idaresine ödettirilir.</template>

        <mvz-fıkra no="7">

          <template>Subay, astsubay, uzman jandarma, uzman erbaş, sözleşmeli erbaş ve er ile Türk Silâhlı Kuvvetlerince görevlendirilen 4 üncü maddenin birinci fıkrasının (c) bendi kapsamındaki sigortalılardan;</template>

          <mvz-bent no="f">

        <mvz-fıkra no="9">

        <mvz-fıkra no="12">

          </mvz-bent>
          <mvz-bent no="d">
            <template>Harp malulleri ile 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanuna veya 2330 sayılı Kanun hükümleri uygulanarak aylık bağlanmasını gerektiren kanunlara göre veya 5434 sayılı Kanunun 56 ncı maddesine göre vazife malulü olduğuna karar verilenlerden, sınıf veya görev değiştirerek 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında çalışmaya devam edenler hakkında uzun vadeli sigorta kollarının uygulanmasına devam edilir. Bunların sınıf veya görev değiştirdikleri tarihten sonra geçen çalışmaları dolayısıyla yeniden aylık bağlanması için yazılı istekte bulunmaları ya da emekliye ayrılmaları veya herhangi bir nedenle görevlerinin sona ermesi halinde, sonraki çalışmaları karşılığında aylığa hak kazanmaları durumunda bu süre için 29 uncu maddeye göre aylık hesaplanır. Sonradan geçen çalışmalarından dolayı yaşlılık aylığına hak kazanamayanların kendilerine toptan ödeme yapılır, vefatları halinde ise hak sahiplerine ölüm aylığı bağlanır veya toptan ödeme yapılır.</template>

        <mvz-fıkra no="16">

      <mvz-madde no="53" başlık="Sigortalılık hallerinin birleşmesi">
        <mvz-fıkra no="1">
          <template>Sigortalının 4 üncü maddenin birinci fıkrasının (a) ve (b) bentlerinde yer alan sigortalılık statüleri ile (c) bendinde yer alan sigortalılık statüsüne aynı anda tabi olacak şekilde Kanun kapsamına girmesi halinde öncelikle aynı maddenin birinci fıkrasının (c) bendi kapsamında, (a) ve (b) bentlerinde yer alan sigortalılık statülerine tabi olacak şekilde Kanun kapsamına girmesi halinde ise aynı maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılır. Ancak, sigortalılık hallerinin çakışması nedeniyle Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamındaki sigortalılığı esas alınanlar, yazılı talepte bulunmak ve Kanunun 82 nci maddesine göre belirlenen prime esas kazanç alt sınırı ve üst sınırına ilişkin hükümler saklı olmak kaydıyla, esas alınmayan sigortalılık statüsü kapsamında talep tarihinden itibaren prim ödeyebilirler. Bu şekilde ödenen primler; iş kazası ve meslek hastalığı sigortasından sağlanan haklar yönünden, Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi kapsamında sigortalılık statüsünde, kısa vadeli sigorta kollarından sağlanan diğer yardımlar ile uzun vadeli sigorta kollarından sağlanan yardımlar yönünden ise Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında sigortalılık statüsünde değerlendirilir. Bu fıkra hükümlerine göre ödeme talebinde bulunulduğu halde ait olduğu ayı izleyen ayın sonuna kadar ödenmeyen primlerin ödenme hakkı düşer. 4 üncü maddenin birinci fıkrasının (b) bendinin (4) numaralı alt bendi ile aynı maddenin birinci fıkrasının (b) bendindeki diğer sigortalılık statülerine aynı anda tabi olacak şekilde çalışılması durumunda, (b) bendinin (4) numaralı alt bendi dışındaki diğer sigortalılık durumu, 4 üncü maddenin birinci fıkrasının (b) bendi kapsamında muhtar sigortalılığı ile aynı maddenin birinci fıkrasının (b) bendindeki diğer sigortalılık statülerine aynı anda tabi olacak şekilde çalışılması durumunda muhtar sigortalılığı dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>4 üncü maddenin birinci fıkrasının (b) bendi kapsamında sayılanlar, kendilerine ait veya ortak oldukları işyerlerinden dolayı, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı bildirilemezler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İsteğe bağlı sigortalı olanların 4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentleri kapsamına tabi olacak şekilde çalışmaya başlamaları halinde, bu Kanunun 51 inci maddesinin üçüncü fıkrası saklı kalmak kaydıyla isteğe bağlı sigortalılık hali sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sigortalının, 4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentlerinde yer alan sigortalılık halleri ile 5 inci maddenin (a) ve (e) bentlerine tâbi sigortalılık hallerinin çakışması halinde, 4 üncü madde kapsamında sigortalı sayılır ve birinci fıkra hükmü uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Birinci fıkra hükmü saklı olmak üzere sigortalının, bu madde hükmüne göre sigortalı sayılması gereken sigortalılık halinden başka bir sigortalılık hali için prim ödemiş olması durumunda, ödenen primler birinci fıkraya göre esas alınan sigortalılık hali için ödenmiş ve esas alınan sigortalılık halinde geçmiş kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren ilk defa sigortalı sayılanlardan 4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentlerinden birden fazlasına tabi olarak çalışmış olanların yaşlılık aylığı bağlanma taleplerinde, en fazla sigortalılığın geçtiği sigortalılık hali, hizmet sürelerinin eşit olması ile malûllük ve ölüm halleri ile yaş haddinden re’sen emekli olma, süresi kanunla belirlenen vazifelere atanma veya seçilme ve bağlı oldukları sigortalılık halinin kanunla değiştirilmesi durumunda ise son sigortalılık hali esas alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="54" başlık="Aylık ve gelirlerin birleşmesi">
        <mvz-fıkra no="1">
          <template>Bu Kanuna göre bağlanacak aylık ve gelirlerin birleşmesi durumunda;</template>
          <mvz-bent no="a">
            <template>Uzun vadeli sigorta kollarından;</template>
            <mvz-altbent no="1">
              <template>Hem malûllük hem de yaşlılık aylığına hak kazanan sigortalıya, bu aylıklardan yüksek olanı, aylıklar eşitse yalnız yaşlılık aylığı,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Malûllük, vazife malûllüğü veya yaşlılık aylığı ile birlikte, ölen eşinden dolayı da aylığa hak kazanan sigortalıya her iki aylığı,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Ana ve babasından ayrı ayrı aylığa hak kazanan çocuklara, yüksek olan aylığın tamamı, az olan aylığın yarısı,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>Birden fazla çocuğundan aylığa hak kazanan ana ve babaya en fazla ödemeye imkân veren ilk iki dosyadan yüksek olan aylığın tamamı, düşük olan aylığın yarısı,</template>
            </mvz-altbent>
            <mvz-altbent no="5">
              <template>Hem eşinden, hem de ana ve/veya babasından ölüm aylığına hak kazananlara, tercihine göre eşinden ya da ana ve/veya babasından bağlanacak aylığı,</template>
            </mvz-altbent>
            <mvz-altbent no="6">
              <template>Bu Kanuna göre vazife malûllüğü aylığı almakta iken, tekrar sigortalı olanlardan hem vazife malûllüğüne hem de malûllük aylığına hak kazananlara bu aylıklardan yüksek olanı, aylıkları eşitse yalnızca vazife malûllüğü aylığı, bunlardan hem vazife malûllüğü hem de yaşlılık aylığına hak kazananlara, bu aylıkların her ikisi,</template>
            </mvz-altbent>
            <mvz-altbent no="7">
              <template>Evliliğin ölüm nedeniyle sona ermesi durumunda sonraki eşinden de aylığa hak kazananlara tercih ettiği aylığı,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="0">
            <template>bağlanır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kısa vadeli sigorta kollarından;</template>
            <mvz-altbent no="1">
              <template>Sürekli iş göremezlik geliriyle birlikte ölen eşinden dolayı da gelire hak kazanan eşe her iki geliri,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Ana ve babadan ayrı ayrı gelire hak kazananlara, yüksek olan gelirin tamamı, az olanın yarısı,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Birden fazla çocuğundan gelire hak kazanan ana ve babaya, en fazla ödemeye imkân veren ilk iki dosyadan yüksek olan gelirin tamamı, düşük olan gelirin yarısı,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>Hem eşinden, hem de ana ve/veya babasından ölüm gelirine hak kazananlara, tercihine göre eşinden ya da ana ve/veya babasından bağlanacak geliri,</template>
            </mvz-altbent>
            <mvz-altbent no="5">
              <template>Evliliğin ölüm nedeniyle sona ermesi durumunda sonraki eşinden de gelire hak kazananlara tercih ettiği geliri,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="0">
            <template>bağlanır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Malûllük, yaşlılık, ölüm sigortaları ve vazife malûllüğü ile iş kazası ve meslek hastalığı sigortasından hak kazanılan aylık ve gelirler birleşirse, sigortalıya veya hak sahibine bu aylık veya gelirlerden yüksek olanın tamamı, az olanın yarısı, eşitliği halinde ise iş kazası ve meslek hastalığından bağlanan gelirin tümü, malûllük, vazife malûllüğü veya yaşlılık aylığının yarısı bağlanır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkradaki sıralamaya göre yapılacak değerlendirmeler sonucunda, bir kişide ikiden fazla gelir veya aylık birleştiği takdirde, bu gelir ve aylıklardan en fazla ödemeye imkân veren iki dosya üzerinden gelir veya aylık bağlanır, diğer dosya veya dosyalardaki gelir ve aylık hakları durum değişikliği veya diğer bir dosyadan gelir veya aylığa hak kazanıldığı tarihe kadar düşer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="55" başlık="Gelir ve aylıkların düzeltilmesi, yükseltilmesi, alt sınırı, ödenmesi ve yoklama işlemleri">
        <mvz-fıkra no="1">
          <template>Bu Kanuna göre gelir veya aylık bağlanan sigortalı ile hak sahibi kişilerin durumlarının, kendilerine veya başka hak sahiplerine bağlanmış bulunan gelir veya aylık tutarının düzeltilmesini gerektirir bir şekilde değişmesi halinde gelir veya aylık tutarları, değişikliğin meydana geldiği tarihten sonraki ödeme dönemi başından başlanarak yeni duruma göre düzeltilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanuna göre bağlanan gelir ve aylıklar, her yılın Ocak ve Temmuz ödeme tarihlerinden geçerli olmak üzere, bir önceki altı aylık döneme göre Türkiye İstatistik Kurumu tarafından açıklanan en son temel yıllı tüketici fiyatları genel indeksindeki değişim oranı kadar artırılarak belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanuna göre sigortalıya bağlanacak aylıklar ile ölen sigortalının hak sahiplerinin aylıklarının hesabına esas tutar, çalışma sürelerindeki her yıl için 82 nci maddeye göre tespit edilen prime esas günlük kazanç alt sınırları dikkate alınarak, talep veya ölüm yılına ait Ocak ayı itibariyle 29 uncu maddenin ikinci fıkrasına göre belirlenen ortalama aylık kazancın %35'inden, sigortalının bakmakla yükümlü olduğu eşi veya çocuğu varsa %40'ından az olamaz. Hak sahibi kimselerin aylıkları; hak sahibi bir kişi ise bu fıkraya göre hesaplanan alt sınır aylığının %80'inden, hak sahibi iki kişi ise %90'ından az olamaz. Uluslararası sosyal güvenlik sözleşmeleri gereğince bağlanan kısmı aylıklar için bu fıkra hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentleri kapsamındaki sigortalılar için ayrı ayrı olmak üzere, malûllük sigortasından dosya bazında her yıl bağlanan aylıkların aylık başlangıç tarihinin ait olduğu yılın Ocak ayı itibarıyla yıl içine ait artışlar uygulanmaksızın hesaplanacak tutarları, yaşlılık sigortasından bir önceki yılın son ödeme ayında söz konusu sigortalılar için ayrı ayrı dosya bazında ödenen en düşük yaşlılık aylığından az olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İş kazası veya meslek hastalığı sonucu başka birinin sürekli bakımına muhtaç duruma gelen sigortalı için bu Kanunun 19 uncu maddesine göre hesaplanacak sürekli iş göremezlik geliri, 82 nci maddeye göre tespit edilen prime esas kazanç alt sınırının aylık tutarının %85'inden az olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Sigortalıya veya hak sahiplerine bağlanan gelir veya aylıklar, her ay peşin olarak ödenir. Gelir ve aylıkların ödeme dönemleri, ödeme tarihleri, ödeme şekli ve ödeme merkezleri Kurumca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Gelir ve aylık alma şartlarının devam edip etmediğine yönelik yoklama işlemlerine ilişkin usûl ve esaslar ile bu maddenin uygulanmasına ilişkin diğer usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelik ile düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="56" başlık="Gelir ve aylık bağlanmayacak haller">
        <mvz-fıkra no="1">
          <template>Ölen sigortalının hak sahiplerinden;</template>
          <mvz-bent no="a">
            <template>Kendisinden aylık bağlanacak sigortalıyı veya gelir ya da aylık bağlanmış olan sigortalıyı kasten öldürdüğü veya öldürmeye teşebbüs ettiği veya bu Kanun gereğince sürekli iş göremez hale veya malûl duruma getirdiği,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kendisinden aylık bağlanacak sigortalıya veya gelir ya da aylık bağlanmamış olan sigortalıya veya hak sahibine karşı ağır bir suç işlediği veya bunlara karşı aile hukukundan doğan yükümlülüklerini önemli ölçüde yerine getirmemesi nedeniyle ölüme bağlı bir tasarrufla mirasçılıktan çıkarıldıkları,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>hususunda kesinleşmiş yargı kararı bulunan kişilere gelir veya aylık ödenmez. Ödenmiş bulunan gelir ve aylıklar, 96 ncı madde hükümlerine göre geri alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Eşinden boşandığı halde, boşandığı eşiyle fiilen birlikte yaşadığı belirlenen eş ve çocukların, bağlanmış olan gelir ve aylıkları kesilir. Bu kişilere ödenmiş olan tutarlar, 96 ncı madde hükümlerine göre geri alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="57" başlık="Yaş">
        <mvz-fıkra no="1">
          <template>İş kazasıyla meslek hastalığı halinde, hak sahiplerine bağlanacak gelirlerin hesabında, iş kazasının olduğu veya meslek hastalığının hekim veya sağlık kurulu raporu ile ilk defa tespit edildiği tarihte nüfus kütüğünde kayıtlı bulunan doğum tarihleri esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Malûllük, yaşlılık ve ölüm sigortalarına ilişkin yaş ile ilgili hükümlerin uygulanmasında, sigortalıların ve hak sahibi çocuklarının, mülga 2/6/1949 tarihli ve 5417 sayılı Kanun ve mülga 4/2/1957 tarihli ve 6900 sayılı Kanun ile 17/7/1964 tarihli ve 506 sayılı, 2/9/1971 tarihli ve 1479 sayılı, 17/10/1983 tarihli ve 2925 sayılı, bu Kanunla mülga 17/10/1983 tarihli ve 2926 sayılı ve 8/6/1949 tarihli ve 5434 sayılı kanunlara, 17/7/1964 tarihli ve 506 sayılı Kanunun geçici 20 nci maddesine tâbi sandıklara veya bu Kanuna göre ilk defa malûllük, yaşlılık ve ölüm sigortalarına tâbi olduğu tarihte, nüfus kütüğünde kayıtlı bulunan doğum tarihleri, sigortalının bu Kanuna göre ilk defa çalışmaya başladığı tarihten sonra doğan çocuklarının ise nüfus kütüğüne ilk olarak yazılan doğum tarihleri esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İş kazası, meslek hastalığı, malûllük, yaşlılık ve ölüm sigortalarından gelir ve aylık tahsisleri ile sermaye değerinin hesabında, iş kazasının olduğu veya meslek hastalığının hekim raporuyla ilk defa tespit edildiği veya sigortalıların bu Kanuna ve bu Kanunla yürürlükten kaldırılmış kanunlara tâbi olarak ilk defa çalışmaya başladığı tarihten sonraki yaş düzeltmeleri dikkate alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Nüfus kayıtlarında doğum ay ve günleri yazılı olmayanlar 1 Temmuz’da, doğum ayı yazılı olup da günü yazılı olmayanlar o ayın birinde doğmuş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı mensuplarının 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanununun 40 ıncı maddesinde belirlenen yaş hadleri sebebiyle emeklilik işlemleri, doğum tarihlerinde ay ve gün yazılı olmayanlar ile doğum günleri 1 Eylülden önce olanlar için 1 Eylül, doğum günleri 1 Eylül ve daha sonra olanlar için müteakip yılın 1 Eylül tarihinde yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="58" başlık="Sosyal Sigorta Yüksek Sağlık Kurulu">
        <mvz-fıkra no="1">
          <template>Bu Kanunda yazılı olan görevleri yerine getirmek üzere branşları Kurum tarafından belirlenecek uzman hekimlerden oluşan Sosyal Sigorta Yüksek Sağlık Kurulu kurulur. Kurul; Millî Savunma Bakanlığı, Sağlık Bakanlığı, Çalışma ve Sosyal Güvenlik Bakanlığı, Yüksek Öğretim Kurulu, en fazla üyeye sahip işveren, işçi ve kamu çalışanlarını temsil eden konfederasyonlar, Türkiye Odalar ve Borsalar Birliği, Türkiye Esnaf ve Sanatkârları Konfederasyonu, Türk Tabipleri Birliği, Türkiye Ziraat Odaları Birliği ile Kurum tarafından görevlendirilecek birer uzman hekimden oluşur. Aynı usûlle birden fazla Kurul oluşturmaya Bakanlık yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurula, kendi aralarından seçecekleri üye başkanlık eder. Başkan, yokluğunda yerine bakacak üyeyi belirler. Kurul, haftada en az bir kez ve en az yedi üye ile toplanır, kararlar salt çoğunlukla alınır.  Oylarda eşitlik olması halinde başkanın bulunduğu taraf çoğunluk sayılır.Kurulda görevlendirilecek olan hekimlerin hizmet süreleri üç yıl olup, üç yıl sonunda yeniden görevlendirilebilirler. Bir takvim yılı içerisinde mazeretsiz olarak birbirini izleyen beş veya toplam on toplantıya katılmayan üyelerin üyelikleri kendiliğinden sona erer. Bu şekilde üyeliği sona eren üyenin yerine bir başka kişi, aynı usûlle görevlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sosyal Sigorta Yüksek Sağlık Kuruluna iştirak edenlerden; katıldıkları her toplantı günü için 4000 gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak miktarda ve ayda sekiz toplantıyı geçmemek üzere huzur hakkı ödenir. Kurulun çalışmaları ile ilgili her türlü giderler Kurumca ödenir. Kurul gerek gördüğü hallerde dışarıdan uzman kişilerin görüşüne başvurabilir. Bu kişilere de aynı miktar ve şartlarda huzur hakkı ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kurul, sigortalılar hakkında vazife malûllük derecesi, iş kazası ve meslek hastalığı sonucu sürekli iş göremezlik derecesi tespiti ile çalışma gücünün malûliyeti gerektirecek derecede kaybına ilişkin Kurumca verilen kararlardan itiraza konu olanları inceleyerek karara bağlar. Kurul, sigortalı veya hak sahiplerinin talebi üzerine görevlendirdiği uzman bir hekimi dinlemek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kurul, bu Kanunda yazılı görevlerle sınırlı olmak kaydıyla, mahkemelerden intikal eden ve bilirkişi sıfatıyla rapor düzenlenmesi talep edilen dava dosyaları hakkında, gerekli incelemeleri yaparak görüş bildirir. Mahkemeler, bahse konu dosyalar için belirlediği bilirkişi ücretini kurul üyelerine iletilmek üzere Kuruma gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Sosyal Sigorta Yüksek Sağlık Kurulunun hizmetlerini ifa etmesi için gerekli sekretarya işlemleri Kurumca yerine getirilir. Sosyal Sigorta Yüksek Sağlık Kurulunun görev, yetki, çalışma usûl ve esasları ile bu maddenin uygulanmasına ilişkin diğer usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="59" başlık="Kurumun denetleme ve kontrol yetkisi">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanmasına ilişkin işlemlerin denetimi, Kurumun denetim ve kontrol ile görevlendirilmiş memurları eliyle yürütülür. Askerî işyerlerine ait sigorta işlemlerinin denetim ve kontrolü, askerî iş müfettişleri tarafından da yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurumun denetim ve kontrol ile görevlendirilmiş memurlarının görevleri sırasında tespit ettikleri Kurum alacağını doğuran olay ve bu olaya ilişkin işlemler, yemin hariç her türlü delile dayandırılabilir. Bunlar tarafından düzenlenen tutanaklar aksi sabit oluncaya kadar geçerlidir. İşverenler ve sigortalılar ile işyeri sahipleri, tasfiye ve iflâs idaresinin memurları, işle ilgili gerçek ve tüzel kişiler, Kurumun denetim ve kontrol ile görevlendirilmiş memurlarına bilgi verilmek üzere çağrıldıkları zaman gelmek, gerekli olan defter, belge ve delilleri getirip göstermek ve vermek, görevlerini yapmak için her türlü kolaylığı sağlamak ve bu yoldaki isteklerini geciktirmeksizin yerine getirmekle yükümlüdürler. Kurumun denetim ve kontrol ile görevlendirilmiş memurları görevlerini yaparken, tüm kamu görevlileri gerekli kolaylığı gösterir ve yardımcı olurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunun uygulanması bakımından, Kurumun denetim ve kontrol ile görevlendirilmiş memurları, 4857 sayılı İş Kanununda belirtilen denetim, teftiş ve kontrol yetkisini de haizdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İhaleli işler ile özel bina inşaatı işyerleri işverenlerine, Kuruma prim borçlarının bulunmadığını gösteren ilişiksizlik belgesinin verilmesinde, 1/6/1989 tarihli ve 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Malî Müşavirlik ve Yeminli Malî Müşavirlik Kanununa göre yetki verilmiş serbest muhasebeci malî müşavirler ile yeminli malî müşavirler tarafından işyeri kayıtlarının incelenmesi sonucunda Kuruma bildirildiği tespit edilen işçilik tutarlarının uygunluğu, Kurumun denetim yetkisi saklı kalmak kaydıyla, esas alınabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Usûl ve esasları Kurumca belirlenmiş hesaplama yöntemine uygun olarak serbest muhasebeci malî müşavirler ile yeminli malî müşavirlerce düzenlenen rapor ile Kuruma yeterli işçilik bildirilmediği anlaşılan işyeri ve işverenlerinin, tespit edilen fark işçilik tutarı üzerinden hesaplanacak prim, gecikme cezası ve gecikme zammı tutarını 102 nci maddenin birinci fıkrasının (d) bendi ile (e) bendinin (4) numaralı alt bendi uyarınca verilecek idarî para cezaları ile birlikte ödemeleri kaydıyla ilişiksizlik belgesi verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kurumca belirlenen usûl ve esaslara aykırı hareket ederek Kurum zararına sebebiyet verdiği anlaşılan serbest muhasebeci malî müşavirler ile yeminli malî müşavirler tarafından düzenlenen raporlar dikkate alınmaz ve bunların daha sonra düzenleyecekleri raporlar Kurumca işleme konulmaz. Gerçeğe aykırı rapor düzenleyen serbest muhasebeci malî müşavirler ile yeminli malî müşavirler, Kurumun bu nedenle uğradığı zarardan işverenle birlikte müştereken ve müteselsilen sorumlu olup, bunlar hakkında, genel hükümlere göre Kurumun takip hakkı saklıdır. Meslek mensupları, işverenlerin devamlı işyerlerinin sigortalıları ile yaptıkları işler ile Kurumda tescil edilmemiş veya tescil edilmiş olmakla birlikte işçilik bildiriminde bulunulmamış olan yukarıdaki işler hakkında inceleme yapamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kamu idarelerinin denetim elemanları kendi mevzuatı gereğince işyerlerinde yapacakları soruşturma, denetim ve incelemeler sırasında, çalıştırılanların sigortalı olup olmadığını da tespit ederek, sigortasız çalıştırılanları Kuruma bildirmek zorundadır. Bu kurumlar ayrıca kendi mevzuatları gereğince yaptıkları inceleme ve tespitler sırasında bu Kanuna göre sigortalı sayılanların prime esas kazançlarının veya sigortalı gün sayılarının eksik bildirilmesi sonucunu doğuran tespitlerini de en geç bir ay içinde Kuruma bildirirler. Kurum bu bildirimleri esas almak üzere gerekli yasal işlemi yapar. İlgililerin itiraz hakları saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Genel Sağlık Sigortası Hükümleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Kapsamdaki Kişiler ve Tescili">
      <mvz-madde no="60" başlık="Genel sağlık sigortalısı sayılanlar">
        <mvz-fıkra no="1">
          <template>İkametgahı Türkiye'de olan kişilerden;</template>
          <mvz-bent no="a">
            <template>4 üncü maddenin birinci fıkrasının;</template>
            <mvz-altbent no="1">
              <template>(a) ve (c) bentleri gereğince sigortalı sayılan kişiler,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>(b) bendi gereğince sigortalı sayılan kişiler,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İsteğe bağlı sigortalı olan kişiler,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yukarıdaki (a) ve (b) bentlerine göre sigortalı sayılmayanlardan;</template>
            <mvz-altbent no="1">
              <template>Harcamaları, taşınır ve taşınmazları ile bunlardan doğan hakları da dikkate alınarak, Kurumca belirlenecek test yöntemleri ve veriler kullanılarak tespit edilecek aile içindeki geliri kişi başına düşen aylık tutarı asgari ücretin üçte birinden az olan vatandaşlar ile gelir tespiti yapılmaksızın genel sağlık sigortalılığı ya da bakmakla yükümlü olduğu kişi bulunmayan Türk vatandaşlarından 18 yaşını doldurmamış çocuklar,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Uluslararası koruma başvurusu veya statüsü sahibi ve vatansız olarak tanınan kişiler,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>1/7/1976 tarihli ve 2022 sayılı 65 Yaşını Doldurmuş Muhtaç, Güçsüz ve Kimsesiz Türk Vatandaşlarına Aylık Bağlanması Hakkında Kanun hükümlerine göre aylık alan kişiler,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>24/2/1968 tarihli ve 1005 sayılı İstiklal Madalyası Verilmiş Bulunanlara Vatani Hizmet Tertibinden Şeref Aylığı Bağlanması Hakkında Kanun hükümlerine göre şeref aylığı alan kişiler,</template>
            </mvz-altbent>
            <mvz-altbent no="5">
              <template>28/5/1986 tarihli ve 3292 sayılı Vatani Hizmet Tertibi Aylıklarının Bağlanması Hakkında Kanun hükümlerine göre aylık alan kişiler,</template>
            </mvz-altbent>
            <mvz-altbent no="6">
              <template>3/11/1980 tarihli ve 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanun hükümlerine göre aylık alan kişiler,</template>
            </mvz-altbent>
            <mvz-altbent no="7">
              <template>24/5/1983 tarihli ve 2828 sayılı Sosyal Hizmetler ve Çocuk Esirgeme Kurumu Kanunu hükümlerine göre korunma, bakım ve rehabilitasyon hizmetlerinden ücretsiz faydalanan kişiler ile ana ve babası olmayan Türk vatandaşlarından 18 yaşını doldurmamış çocuklar,</template>
            </mvz-altbent>
            <mvz-altbent no="8">
              <template>Harp malûllüğü aylığı alanlar ile Terörle Mücadele Kanunu kapsamında aylık alanlar,</template>
            </mvz-altbent>
            <mvz-altbent no="9">
              <template>18/3/1924 tarihli ve 442 sayılı Köy Kanununun  ek 16 ncı maddesine göre aylık alan kişiler,</template>
            </mvz-altbent>
            <mvz-altbent no="10">
              <template>11/10/1983 tarihli ve 2913 sayılı Dünya Olimpiyat ve Avrupa Şampiyonluğu Kazanmış Sporculara ve Bunların Ailelerine Aylık Bağlanması Hakkında Kanun hükümlerine göre aylık alan kişiler,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Mütekabiliyet esası da dikkate alınmak şartıyla, oturma izni almış yabancı ülke vatandaşlarından yabancı bir ülke mevzuatı kapsamında sigortalı olmayan kişiler,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>25/8/1999 tarihli ve 4447 sayılı Kanun gereğince işsizlik ödeneği, Esnaf Ahilik Sandığı ödeneğinin ve ilgili kanunları gereğince kısa çalışma ödeneğinden yararlandırılan kişiler,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Bu Kanun veya bu Kanundan önce yürürlükte bulunan sosyal güvenlik kanunlarına göre gelir veya aylık alan kişiler,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Yukarıdaki bentlerin dışında kalan ve başka bir ülkede sağlık sigortasından yararlanma hakkı bulunmayan vatandaşlar,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>genel sağlık sigortalısı sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>6 ncı maddenin birinci fıkrasının (a), (b), (c), (f), (g), (h), (ı) ve (k) bentlerinde sayılanların öncelikle, genel sağlık sigortalısının bakmakla yükümlü olduğu kişi olup olmadığına bakılır. Genel sağlık sigortalısının bakmakla yükümlü olduğu kişi ise tescili yapılmaz. Aksi takdirde birinci fıkra hükümlerinden durumuna uyan bende göre genel sağlık sigortalısı sayılır. Birinci fıkranın (f) bendi kapsamında gelir alması nedeniyle genel sağlık sigortalısı sayılanlar, aynı zamanda diğer bentler gereği de genel sağlık sigortalısı sayılması halinde (f) bendi dışındaki bentler kapsamında genel sağlık sigortalısı sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>6 ncı maddenin birinci fıkrasının (e) ve (l) bentleri kapsamında olanlar, ceza infaz kurumları ile tutukevleri bünyesinde bulunan hükümlü ve tutuklular, birinci fıkranın (d) bendi kapsamına girenlerden Türkiye'de bir yıldan kısa süreyle yerleşik olanlar, (f) bendi kapsamında olup mülga 30/5/1978 tarihli ve 2147 sayılı ve 8/5/1985 tarihli ve 3201 sayılı kanunlara göre borçlanarak aylık bağlanan kişilerden ise Türkiye’de ikamet etmeyenler genel sağlık sigortalısı ve genel sağlık sigortalısının bakmakla yükümlü olduğu kişi sayılmazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birinci fıkranın (d) ve (g) bentlerinin uygulanmasında evli olanlar için, eşlerden hangisinin bu maddeye göre genel sağlık sigortalısı, hangisinin bakmakla yükümlü olunan kişi olacağının tespiti kendi tercihlerine bırakılır. Diğer bentler gereği eşlerin her ikisinin de genel sağlık sigortalılık şartlarının oluşması halinde her ikisi de ayrı ayrı genel sağlık sigortalısı sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı sayılanlardan, ilgili kanunları gereğince bir yıldan fazla aylıksız izin kullanan eşler, genel sağlık sigortalısının bakmakla yükümlü olduğu kişi sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu maddenin birinci fıkrasının (c) bendinin (1) numaralı alt bendi ile 80 inci maddede belirtilen aile; aynı hane içerisinde yaşayan eş, evli olmayan çocuk, büyük ana ve büyük babadan oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Ülkemizde öğrenim gören yabancı uyruklu öğrenciler birinci fıkranın (d) bendindeki ve 52 nci maddenin ikinci fıkrasının ikinci cümlesindeki şartlar aranmaksızın eğitim öğretim yılı başlangıç tarihinden itibaren üç ay içinde talepte bulunmaları hâlinde genel sağlık sigortalısı sayılır.  Kendilerince 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırının üçte birinin 30 günlük tutarı üzerinden genel sağlık sigortası primi ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>19/3/1969 tarihli ve 1136 sayılı Avukatlık Kanunu uyarınca avukatlık stajı yapmakta olanlardan bu Kanuna göre genel sağlık sigortalısı veya bakmakla yükümlü olunan kişi durumunda olmayanlar staj süresi ile sınırlı olmak üzere genel sağlık sigortalısı sayılır. Bu şekilde genel sağlık sigortalısı sayılanların genel sağlık sigortası primleri Kanunun 82 nci maddesine göre belirlenen prime esas günlük kazanç alt sınırının otuz günlük tutarının %6'sıdır. Bu primler Türkiye Barolar Birliği tarafından ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>8/3/2012 tarihli ve 6284 sayılı Ailenin Korunması ve Kadına Karşı Şiddetin Önlenmesine Dair Kanun hükümlerine göre hakkında koruyucu tedbir kararı verilen kişilerden genel sağlık sigortalısı olmayan ve genel sağlık sigortalısının bakmakla yükümlü olduğu kişi kapsamına da girmeyen veya genel sağlık sigortası kapsamında olup sağlık yardımlarından yararlanamayanlar, bu hâllerin devamı süresince gelir tespiti yapılmaksızın birinci fıkranın (c) bendinin (1) numaralı alt bendi kapsamında genel sağlık sigortalısı sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>29/7/2002 tarihli ve 4769 sayılı Ceza İnfaz Kurumları ve Tutukevleri Personeli Eğitim Merkezleri Kanunu kapsamına göre hizmet öncesi eğitime alınanlar, eğitim gördükleri süre içinde genel sağlık sigortalısı sayılırlar. Bu kişilerin genel sağlık sigortası primleri, 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırının otuz günlük tutarı üzerinden Adalet Bakanlığı bütçesinden ödenir. Bu kişilerin, 3 üncü maddenin birinci fıkrasının (10) numaralı bendine göre tespit edilecek eş ve çocukları ile ana ve babaları da bakmakla yükümlü olunan kişi sıfatıyla genel sağlık sigortasından yararlandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Ana veya babası üzerinden bakmakla yükümlü olunan kişi sayılmayanlardan; lise ve dengi öğrenimden mezun olanlar 20 yaşını, yükseköğrenimden mezun olanlar ise 25 yaşını geçmemek ve bakmakla yükümlü olunan kişi ya da bu maddenin birinci fıkrasının (g) bendinde sayılanlar hariç genel sağlık sigortalısı olmamak şartıyla mezun oldukları tarihi izleyen günden itibaren iki yıl süreyle gelir tespiti yapılmaksızın birinci fıkranın (c) bendinin (1) numaralı alt bendi kapsamında genel sağlık sigortalısı sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>Askerlik hizmetlerini er ve erbaş olarak yapmakta olanlar askere sevk tarihi ile terhis tarihi arasında, yedek subay öğrencileri ve adayları askere sevk tarihi ile yedek subay nasıp tarihi arasında, yedek astsubay öğrencileri ve adayları askere sevk tarihi ile yedek astsubay nasıp tarihi arasında, genel sağlık sigortalısı olmayan yedek personelden seferberlik tatbikatları veya eğitimleri maksadıyla silah altına alınanlar tatbikat ve eğitim sevk tarihi ile terhis tarihi arasında, askeri öğrenci adayları ile Jandarma ve Sahil Güvenlik Akademisi öğrenci adayları ise intibak eğitimine başladıkları tarih ile yemin ettikleri tarih arasında, devre kaybeden askerî öğrenciler ve Jandarma ve Sahil Güvenlik Akademisi öğrencileri devre kaybettikleri sürelerde primleri ilgili kamu idaresi tarafından karşılanmak suretiyle genel sağlık sigortalısı sayılır. Bu sürenin hesabında, mevzuatı uyarınca askerlik hizmet süresinden sayılmayan haller  dikkate alınmaz. Bu kapsamda genel sağlık sigortalısı sayıldıkları sürece bu maddenin diğer fıkraları kapsamında genel sağlık sigortalısı ve genel sağlık sigortalısının bakmakla yükümlü olduğu kişi sayılmazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Uluslararası Askeri Eğitim İşbirliği Anlaşmaları kapsamında Türkiye’de eğitim ve öğretim gören yabancı uyruklu misafir askeri personel ile bakmakla yükümlü oldukları aile fertlerinden, söz konusu anlaşmada sağlık hizmeti giderleri, kabul eden devlet tarafından karşılanacağı hüküm altına alınanlar genel sağlık sigortalısı sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="14">
          <template>Uluslararası Eğitim İşbirliği Anlaşmaları kapsamında Türkiye’de Jandarma Genel Komutanlığı, Sahil Güvenlik Komutanlığı ile Jandarma ve Sahil Güvenlik Akademisi Başkanlığında eğitim ve öğretim gören yabancı uyruklu misafir personel ile bakmakla yükümlü oldukları aile fertlerinden, söz konusu anlaşmada sağlık hizmeti giderleri, kabul eden devlet tarafından karşılanacağı hüküm altına alınanlar genel sağlık sigortalısı sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="15">
          <template>10/10/2024 tarihli ve 7528 sayılı Öğretmenlik Mesleği Kanunu kapsamında Millî Eğitim Bakanlığı tarafından Millî Eğitim Akademisinde hazırlık eğitimine alınan öğretmen adayları, eğitim gördükleri süre içinde genel sağlık sigortalısı sayılırlar. Bu kişilerin genel sağlık sigortası primleri, 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırının otuz günlük tutarı üzerinden Millî Eğitim Bakanlığı bütçesinden ödenir. Bu kişilerin 3 üncü maddenin birinci fıkrasının (10) numaralı bendine göre tespit edilecek eş ve çocukları ile ana ve babaları da, bakmakla yükümlü olunan kişi sıfatıyla genel sağlık sigortasından yararlandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="16">
          <template>Yurtdışı Türkler ve Akraba Topluluklar Başkanlığı veya Uluslararası Öğrenciler Değerlendirme Kurulu kararı ile burslandırılan uluslararası öğrenciler, bursluluk statüleri devam ettiği sürece genel sağlık sigortalısı sayılır. Genel sağlık sigortası primleri, 82 nci maddenin birinci fıkrasına göre belirlenen prime esas kazanç alt sınırının %4’üdür. Bu kişiler hakkında 3 üncü maddenin birinci fıkrasının (10) numaralı bendi uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="61" başlık="Genel sağlık sigortalılığının başlangıcı, bildirimi ve tescili">
        <mvz-fıkra no="1">
          <template>Genel sağlık sigortalılığı başlangıcının tespiti ve tescil işlemleri aşağıdaki hükümlere göre yürütülür. 60 ıncı maddenin birinci fıkrasının;</template>
          <mvz-bent no="a">
            <template>(a) ve (b) bentlerinde sayılanlar; sigortalı veya isteğe bağlı sigortalı olarak tescil edildikleri tarihten itibaren genel sağlık sigortalısı sayılır ve ayrıca bir bildirime gerek olmaksızın tescil edilmiş sayılır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>(c) bendinde sayılanlardan; (1) numaralı alt bentte belirtilenler Kurumca tescil edildiği, (3), (4), (5), (6), (8), (9) ve (10) numaralı alt bentlerde belirtilenler ise aylığa hak kazandıkları tarihten itibaren genel sağlık sigortalısı sayılır. Yukarıdaki alt bentler kapsamı dışında kalanlar ise uluslararası koruma başvurusu yaptıkları veya uluslararası koruma statüsü aldıkları veya vatansız kişi sayıldıkları, korunma, bakım ve rehabilitasyon hizmetlerinden ücretsiz yararlanmaya başladıkları tarihten itibaren genel sağlık sigortalısı sayılır ve ilgili kurumlarca kapsama alındığı tarihten itibaren bir ay içinde Kuruma bildirilir. (1) numaralı alt bentte belirtilenlerin taleplerinin Kurumca değerlendirilmesi sonucu talep tarihi itibariyle müstahak olduğu anlaşılanların talep tarihi; daha sonra müstahak olanların ise müstahak oldukları tarih, Kurumca tescil edildikleri tarih olarak kabul edilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>(d) bendinde sayılanlar Türkiye’deki yerleşim süresinin bir yılı geçtiği tarihten sonra talepte bulunmaları hâlinde talep tarihini takip eden günden itibaren genel sağlık sigortalısı sayılır. Bu kişilerin genel sağlık sigortalılığı bu Kanunda belirtilen nedenlerle sona erer.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>(e) bendinde sayılanlar, işsizlik, Esnaf Ahilik Sandığı veya kısa çalışma ödeneğinden yararlanmaya başladıkları tarihten itibaren genel sağlık sigortalısı sayılır ve Türkiye İş Kurumu tarafından işsizlik veya Esnaf Ahilik Sandığı ödeneğinin bağlandığı tarihten itibaren bir ay içinde Kuruma bildirilir.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>(f) bendinde sayılanlar; gelir veya aylıktan yararlanmaya başladıkları tarihten itibaren genel sağlık sigortalısı sayılır ve ayrıca bir bildirime gerek olmaksızın tescil edilmiş sayılır.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>(g) bendinde sayılanlar; diğer bentlere göre genel sağlık sigortalısı olmadıkları veya diğer bentlere göre genel sağlık sigortasından yararlanma haklarının sona erdiği tarihten itibaren bu bent kapsamında genel sağlık sigortalısı sayılırlar ve Kurumca resen tescil edilirler.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>60 ıncı madde gereği genel sağlık sigortalısı sayılanların çocukları, ana ya da babanın tescil edilmiş olmasına bakılmaksızın ve ayrıca bir işleme gerek olmaksızın 18 yaşını dolduruncaya kadar genel sağlık sigortalısı veya genel sağlık sigortalısının bakmakla yükümlü olduğu kişi olarak sağlık hizmetlerinden ve diğer haklardan yararlandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>60 ıncı madde gereği genel sağlık sigortalısı iken durumunda değişiklik olan kişilerden, aynı maddenin birinci fıkrasının (c) bendinin (1) numaralı alt bendine veya (g) bendi kapsamına giren kişiler durumlarında değişiklik olduğu tarihten itibaren en geç bir ay içinde Kuruma başvurmak zorundadır. Bu kişilerin 60 ıncı maddenin birinci fıkrasının (c) bendinin (1) numaralı alt bendi kapsamına girmediğinin tespit edilmesi halinde, durumlarında değişiklik olduğu tarihten başlamak üzere (g) bendi kapsamında genel sağlık sigortalısı sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Genel sağlık sigortalılığı, yerleşim yerinin Türkiye olmadığı veya 60 ıncı maddenin üçüncü fıkrası gereği genel sağlık sigortası kapsamı dışına çıkılan tarihten itibaren sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu maddede belirtilen genel sağlık sigortası giriş bildirgesini süresi içinde vermeyenler hakkında 102 nci maddenin birinci fıkrasının (a) bendine göre idarî para cezası uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>60 ıncı maddenin yedinci fıkrası kapsamında sayılanlardan dilekçeyle Kuruma müracaat edenlerin, talep tarihini takip eden günden itibaren genel sağlık sigortalılığı başlatılır ve öğrenimleri süresince genel sağlık sigortalılıkları devam eder.  Uluslararası Öğrenciler Değerlendirme Kurulu kararı ile burslandırılan uluslararası öğrencilerin bildirimleri ise Yurtdışı Türkler ve Akraba Topluluklar Başkanlığı veya Uluslararası Öğrenciler Değerlendirme Kurulu tarafından görevlendirilen kurum tarafından yapılır. Bunların genel sağlık sigortalılıkları bu Kanunda belirtilen nedenlerle sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>60 ıncı maddenin sekizinci fıkrası kapsamında sayılanlar avukatlık stajına başladıkları tarihten itibaren genel sağlık sigortalısı sayılırlar ve avukatlık stajları devam ettiği sürece genel sağlık sigortalılıkları devam eder. Bu kapsamdaki stajyerler, staja başladıkları tarihten itibaren bir ay içerisinde Türkiye Barolar Birliğince genel sağlık sigortası giriş bildirgesi ile Kuruma bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>60 ıncı maddenin onikinci fıkrası kapsamındaki er ve erbaşlar ile yedek subay ve yedek astsubay öğrencileri ve adaylarının genel sağlık sigortası bildirimi, askerlik şubesinden sevk tarihi, genel sağlık sigortalısı olmayan yedek personelden seferberlik tatbikatları veya eğitimleri maksadıyla silah altına alınanların tatbikat ve eğitim sevk tarihi,askeri öğrenci adayları ile Jandarma ve Sahil Güvenlik Akademisi öğrenci adaylarının genel sağlık sigortası bildirimi, intibak başlangıç eğitimine başladıkları tarih, devre kaybeden askerî öğrenciler ve Jandarma ve Sahil Güvenlik Akademisi öğrencilerinin genel sağlık sigortası bildirimi devre kaybının başladığı tarih itibarıyla; 60 ıncı maddenin onüçüncü ve ondördüncü fıkraları kapsamında sayılanların bildirimi, personelin eğitim ve öğretime başladığı tarih itibarıyla ilgili kamu idaresi tarafından yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Genel sağlık sigortası giriş bildirgesinin içerik ve şekli ile bu maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="62" başlık="Sağlık hizmetleri ve diğer haklar ile bunlardan yararlanma">
        <mvz-fıkra no="1">
          <template>Bu Kanun gereğince genel sağlık sigortasından sağlanacak sağlık hizmetlerinden ve diğer haklardan yararlanmak, genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişiler için bir hak, Kurum için ise bu hizmet ve hakların finansmanını sağlamak bir yükümlülüktür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sağlık hizmetlerinden ve diğer haklardan genel sağlık sigortalısı ile bakmakla yükümlü olduğu kişiler yararlandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanun kapsamındaki kişilere sağlanacak sağlık hizmetleri ve diğer haklar ile kişilerden alınan primlerin tutarı arasında ilişki kurulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Sağlanan Sağlık Hizmetleri ve Diğer Haklar">
      <mvz-madde no="63" başlık="Finansmanı sağlanan sağlık hizmetleri ve süresi">
        <mvz-fıkra no="1">
          <template>Genel sağlık sigortalısının ve bakmakla yükümlü olduğu kişilerin sağlıklı kalmalarını; hastalanmaları halinde sağlıklarını kazanmalarını; iş kazası ile meslek hastalığı, hastalık ve analık sonucu tıbben gerekli görülen sağlık hizmetlerinin karşılanmasını, iş göremezlik hallerinin ortadan kaldırılmasını veya azaltılmasını temin etmek amacıyla Kurumca finansmanı sağlanacak sağlık hizmetleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Kişilerin hastalanmalarına bakılmaksızın kişiye yönelik koruyucu sağlık hizmetleri ile insan sağlığına zararlı madde bağımlılığını önlemeye yönelik koruyucu sağlık hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kişilerin hastalanmaları halinde ayakta veya yatarak; hekim tarafından yapılacak muayene, hekimin göreceği lüzum üzerine teşhis için gereken klinik muayeneler, laboratuvar tetkik ve tahlilleri ile diğer tanı yöntemleri, konulan teşhise dayalı olarak yapılacak tıbbî müdahale ve tedaviler, hasta takibi ve rehabilitasyon hizmetleri, organ, doku ve kök hücre nakline ve hücre tedavilerine yönelik sağlık hizmetleri, acil sağlık hizmetleri, ilgili kanunları gereğince sağlık meslek mensubu sayılanların hekimlerin kararı üzerine yapacakları tıbbî bakım ve tedaviler.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Analık sebebiyle ayakta veya yatarak; hekim tarafından yapılacak muayene, hekimin göreceği lüzum üzerine teşhis için gereken klinik muayeneler, doğum, laboratuvar tetkik ve tahlilleri ile diğer tanı yöntemleri, konulan teşhise dayalı olarak yapılacak tıbbî müdahale ve tedaviler, hasta takibi, rahim tahliyesi, tıbbî sterilizasyon ve acil sağlık hizmetleri, ilgili kanunları gereğince sağlık meslek mensubu sayılanların hekimlerin kararı üzerine yapacakları tıbbî bakım ve tedaviler.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kişilerin hastalanmaları halinde ayakta veya yatarak; ağız ve diş muayenesi, diş hekiminin göreceği lüzum üzerine ağız ve diş hastalıklarının teşhisi için gereken klinik muayeneler, laboratuvar tetkik ve tahlilleri ile diğer tanı yöntemleri, konulan teşhise dayalı olarak yapılacak tıbbî müdahale ve tedaviler, diş çekimi, konservatif diş tedavisi ve kanal tedavisi, hasta takibi, diş protez uygulamaları, ağız ve diş hastalıkları ile ilgili acil sağlık hizmetleri, 18 yaşını doldurmamış kişilerin ortodontik diş tedavilerinin 72 nci maddeye göre belirlenen tutarı,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Evli olmakla birlikte çocuk sahibi olmayan genel sağlık sigortalısının;</template>
            <mvz-altbent no="1">
              <template>Yapılan tıbbi tedavileri sonrasında normal tıbbi yöntemlerle çocuk sahibi olamadığının ve ancak yardımcı üreme yöntemi ile çocuk sahibi olabileceğinin Kurumca yetkilendirilen sağlık hizmeti sunucuları sağlık kurulları tarafından tıbben mümkün görülmesi,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Kadının 23 yaşından büyük, 40 yaşından küçük olması,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Kadının primer ovaryan yetmezliği ve erkeğin azoospermisi olması hâlleri hariç olmak üzere son üç yıl içinde diğer tedavi yöntemlerinden sonuç alınamamış olduğunun Kurumca yetkilendirilen sağlık hizmeti sunucuları sağlık kurulları tarafından belgelenmesi,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>Uygulamanın yapıldığı tıbbi merkezin Kurum ile sözleşme yapmış olması,</template>
            </mvz-altbent>
            <mvz-altbent no="5">
              <template>Eşlerden birinin en az beş yıldır genel sağlık sigortalısı veya bakmakla yükümlü olunan kişi olup, 900 gün genel sağlık sigortası prim gün sayısının olması,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="0">
            <template>şartlarının birlikte gerçekleşmesi hâlinde veya sağlam çocuk sahibi olan çiftler hariç olmak üzere Kurumun belirlediği kalıtsal bir hastalığı olan veya bu hastalık için taşıyıcı olduğu bilinen evli çiftin sağlam çocuk sahibi olmasına yönelik bu bendin (2), (4) ve (5) numaralı alt bentlerinde belirtilen şartların birlikte gerçekleşmesi hâlinde, en fazla üç deneme ile sınırlı olmak üzere yardımcı üreme yöntemi tedavileri ile bir hastalığın tedavisinin başka tıbbi bir yöntemle mümkün olmaması ve Kurumca yetkilendirilen sağlık hizmeti sunucuları sağlık kurulları tarafından tıbben zorunlu görülmesi ve uygulamanın yapıldığı tıbbi merkezin Kurum ile sözleşme yapmış olması hâlinde yardımcı üreme yöntemi tedavileri,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Yukarıdaki bentler gereğince sağlanacak sağlık hizmetleriyle ilgili teşhis ve tedavileri için gerekli olabilecek kan ve kan ürünleri, kemik iliği, aşı, ilaç, ortez, protez, tıbbî araç ve gereç, kişi kullanımına mahsus tıbbî cihaz, tıbbî sarf, iyileştirici nitelikteki tıbbî sarf malzemelerinin sağlanması, takılması, garanti süresi sonrası bakımı, onarılması ve yenilenmesi hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="g">
