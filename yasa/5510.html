        <mvz-fıkra no="5">
          <template>Bu madde kapsamına girenlerin aylıklarının bağlanması, artırılması, azaltılması, kesilmesi, yeniden bağlanması, toptan ödemeleri, ilgi devamı, ihya ve borçlanmaları, diğer ödemeler ve yardımlar ile emeklilik ikramiyeleri hakkında bu Kanunla yürürlükten kaldırılan hükümleri de dahil 5434 sayılı Kanun hükümlerine göre işlem yapılır ve bu maddenin uygulanmasında mülga 2829 sayılı Kanun hükümleri ayrıca dikkate alınır.   Ancak, bu Kanunun 4 üncü maddesinin dördüncü fıkrasının (d), (e) ve (f) bentlerinde belirtilenlerden öğrenci olanların sigortalı sayılmaları, yetim aylıklarının bağlanmamasını veya bağlanan yetim aylıklarının kesilmesini gerektirmez.  Bu madde kapsamında aylık alan ya da hükmün yürürlüğe girdiği tarihten sonra aylığa hak kazanacak erkek çocuklar için 5434 sayılı Kanunun mülga 74 üncü maddesinin altıncı fıkrası hükümleri uygulanmaz. Bu fıkranın ikinci ve üçüncü cümlesi hükümleri bu Kanunun geçici 18 inci maddesi kapsamındaki yetimler hakkında da ilgisine göre uygulanır.</template>

        <mvz-fıkra no="6">

        <mvz-fıkra no="7">

        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>Bu Kanunun yürürlük tarihinden önce, seçimler neticesinde belediye başkanı olarak görev yapmış olup, bu Kanunun yürürlük tarihinden önce 5434 sayılı Kanunun bu Kanunla yürürlükten kaldırılan ek 68 inci maddesine göre makam tazminatı ve buna bağlı olarak temsil veya görev tazminatı ödenenler hariç olmak üzere, sosyal güvenlik kanunlarına göre emeklilik veya yaşlılık aylığı almakta olanlardan; 5434 sayılı Kanunun bu Kanunla yürürlükten kaldırılan 39 uncu maddesine göre aylık bağlanması şartlarını haiz olanlara, bu Kanunun yürürlük tarihinden itibaren, bu kişilerden bu Kanunun yürürlük tarihi itibarıyla 5434 sayılı Kanunun bu Kanunla yürürlükten kaldırılan 39 uncu maddesine göre aylık bağlanması şartlarını haiz olmayanlara ise bu şartları haiz oldukları tarihten itibaren 5434 sayılı Kanunun bu Kanunla yürürlükten kaldırılan ek 68 inci maddesinde belirtilen şartlar da dikkate alınarak, emsali belediye başkanının almakta olduğu makam tazminatı ve buna bağlı olarak temsil veya görev tazminatı tutarı, almakta oldukları emeklilik veya yaşlılık aylıklarına ilâve edilmek suretiyle ödenir. Bu Kanunun yürürlük tarihinden önce seçimler neticesinde belediye başkanı olarak görev yapmış olup, bu Kanuna göre sigortalı iken yaşlılık aylığı bağlananlardan; 5434 sayılı Kanunun bu Kanunla yürürlükten kaldırılan 39 uncu maddesine göre aylık bağlanması şartlarını haiz olanlara bu Kanunun geçici 2 nci ve geçici 4 üncü maddeleri hükümleri de dikkate alınarak bu fıkrada belirtilen şartlar dahilinde söz konusu tazminatlar aylıklarına ilâve edilmek suretiyle ödenir. Bu Kanunun yürürlük tarihinden önce seçimler neticesinde belediye başkanı olarak görev yapmış olanlardan ölenlerin bu Kanunun 32 nci maddesinde belirtilen şartlara sahip olmaları halinde, 5434 sayılı Kanunun bu Kanunla yürürlükten kaldırılan ek 68 inci maddesinde belirtilen şartlar da dikkate alınarak, hak sahiplerine bu Kanunun 34 üncü, geçici 1 inci, geçici 2 nci ve geçici 4 üncü maddeleri hükümlerine göre söz konusu tazminatlar bu Kanunun yürürlük tarihinden önce ölenler için bu Kanunun yürürlük tarihinden itibaren, bu Kanunun yürürlük tarihinden sonra ölenler için ise ölüm tarihinden itibaren ölüm aylıklarına eklenmek suretiyle ödenir. Bu Kanunun yürürlüğe girdiği tarihten önce seçimler neticesinde belediye başkanı olarak görev yapmış olanlardan; malullük aylığı almakta olanlar ile malullük aylığına hak kazanacaklar 5434 sayılı Kanunun bu Kanunla yürürlükten kaldırılan 39 uncu maddesinde belirtilen aylık bağlamaya ilişkin şartlar dikkate alınmaksızın yukarıda belirtilen tazminat haklarından yararlandırılır. Bu fıkraya göre tazminat tutarları ödendikçe Hazineden tahsil edilir.</template>

      <mvz-madde no="7" başlık="506, 1479, 5434, 2925, 2926 sayılı kanunlara ilişkin ortak geçiş hükümleri" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yürürlük tarihine kadar 17/7/1964 tarihli ve 506 sayılı, 2/9/1971 tarihli ve 1479 sayılı, 17/10/1983 tarihli ve 2925 sayılı, bu Kanunla mülga 17/10/1983 tarihli ve 2926 sayılı, 8/6/1949 tarihli ve 5434 sayılı kanunlar ile 17/7/1964 tarihli ve 506 sayılı Kanunun geçici 20 nci maddesine göre sandıklara tabi sigortalılık başlangıçları ile hizmet süreleri, fiilî hizmet süresi zammı, itibarî hizmet süreleri, borçlandırılan ve ihya edilen süreler ve sigortalılık süreleri tabi oldukları kanun hükümlerine göre değerlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanunun yürürlük tarihinden önce 24/6/1965 tarihli ve 635, 18/3/1986 tarihli ve 3269, 22/7/1965 tarihli ve 644, 1/11/1983 tarihli ve 2937, 25/3/1957 tarihli ve 6940 ve 26/10/1990 tarihli ve 3671 sayılı kanunlar ile 5434 sayılı Kanunun 32 nci maddesine göre fiili hizmet süresine müstehak görevlerde çalışanların bu görevlerde geçirdikleri süreler bu Kanunun 40 ıncı maddesi gereğince aranan 3600 günün doldurulmasında nazara alınır. 17/7/1964 tarihli ve 506 sayılı Kanunun ek 5 inci maddesinde sayılan itibari hizmet süresi kapsamında yer alıp bu Kanunun 40 ıncı maddesinde sayılmayan işlerde bu Kanunun yürürlük tarihinden önce geçen çalışma sürelerinin bu maddenin birinci fıkrası kapsamında değerlendirilmesinde 3600 gün prim ödeme şartı aranmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (e) bendi kapsamındaki sigortalıların borçlandıkları hizmetleri nedeniyle borçlanma tutarlarından ödenmeyen kısmı var ise aylıklarından emekli keseneği oranında tahsil edilmeye devam edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Aylıkların hesabında 41 inci maddeye ve 8/5/1985 tarihli ve 3201 sayılı Kanuna göre yapılan borçlanmaların bu Kanunun yürürlüğe girdiği tarihten önceki sürelere ait kazançları, bu Kanunla yürürlükten kaldırılan ilgili kanun hükümlerine göre değerlendirilir. Ancak, bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında bulunan sigortalılar için bu Kanunun yürürlük tarihinden önceki dönemlere ait sürelerin bu Kanunun yürürlük tarihinden sonra borçlanılması halinde de 41 inci madde ve 8/5/1985 tarihli ve 3201 sayılı Kanun hükümleri uygulanır.  4 üncü maddenin birinci fıkrasının (b) bendi kapsamında değerlendirilen 1/10/2008 tarihinden önceki yurt dışı borçlanma sürelerine göre tespit edilen basamaklar, 2008 yılı Eylül ayında yürürlükte bulunan gelir tablosunda, 41 inci maddenin beşinci fıkrası hükmüne göre belirlenen prime esas aylık kazanca yakın gelire karşılık gelen basamağı geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kanunun yürürlüğe girdiği tarihten önce birden fazla dosyadan gelir veya aylık alınması durumunda bu Kanunun yürürlük tarihinden sonra yeni dosyadan gelir veya aylık alınmasına hak kazanılması durumunda yeni bağlanacak dosyadaki gelir ve aylık miktarı da dahil olmak üzere mukayese yapılarak en düşük miktarlı dosya kapsamdan çıkarılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Birinci fıkrada belirtilen kanunlar kapsamında zorunlu sigortalı sayılanlar ile isteğe bağlı sigortalı olup sağlık sigortasından yararlananların prim ödeme gün sayıları da genel sağlık sigortası prim ödeme gün sayısı olarak değerlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu Kanunun yürürlüğe girdiği tarihten sonra 4 üncü maddenin birinci fıkrasının (c) bendine göre ilk defa sigortalı olanların sigortalılık başlangıç tarihinden önceki süreleri, bu Kanunun 41 ve 46 ncı maddeleri, 5434 sayılı Kanunun ek 31 inci maddesi ile 3201 sayılı Kanuna göre borçlandırılmaları halinde, sigortalılığın başlangıç tarihinin geriye götürülmesini ve haklarında bu Kanunun geçici maddelerinin uygulanmasını gerektirmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Kanunun yürürlük tarihinden önce 5434 sayılı Kanunun ilgili hükümlerine göre itibari hizmet süresine müstehak kadro ve görevlerde bulunanlardan bu Kanunun 4 üncü maddesinin birinci fıkrasının (e) bendi kapsamında çalışmaya devam edenlerin itibari hizmet süreleri hakkında, bu Kanunun yürürlük tarihinden önceki hükümlerinin uygulanmasına devam edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>30/4/2008 tarihinden sonra 506, 1479, 5434, 2925 ve 2926 sayılı kanunlara göre ilk defa sigortalı veya iştirakçi olanlar hakkında bu Kanunun 28 inci maddesinin ikinci ve üçüncü fıkrası hükümleri uygulanır. Geçici 2 nci maddenin birinci fıkrasının (b) bendinin son cümlesi hükmü bunlar hakkında uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>24/7/2003 tarihli ve 4956 sayılı Kanunun 48 inci maddesi ile değişik, mülga 17/10/1983 tarihli ve 2926 sayılı Kanunun 2 nci maddesi hükmü 2/8/2003 tarihi öncesi için de uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="1479 sayılı Kanuna ilişkin geçiş hükümleri" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendinin (4) numaralı alt bendi hariç diğer alt bentlerine göre sigortalılık niteliği taşıdıkları halde bu Kanunun yürürlük tarihine kadar kayıt ve tescillerini yaptırmayanların sigortalılık hak ve yükümlülüğü bu Kanunun yürürlük tarihinden itibaren başlar. Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendinin (4) numaralı alt bendine göre sigortalı sayılanların hak ve yükümlülüğü ise 7 nci maddenin birinci fıkrasının (b) bendine göre başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, bu Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendinin (1) ve (3) numaralı alt bentlerine göre sigortalı sayılanlardan bu Kanunun yürürlük tarihinden itibaren sigortalılıkları başlatılanların, bu Kanunun yürürlük tarihi ile 4/10/2000 tarihi arasında geçen vergi mükellefiyet süreleri bulunmak kaydıyla, sigortalının bu Kanunun yürürlük tarihinden itibaren 6 ay içinde talepte bulunması halinde, vergi mükellefiyet sürelerinin tamamı için 80 inci maddenin ikinci fıkrasının (a) bendine göre talep tarihindeki prime esas kazancının %32’si üzerinden borçlanma tutarı hesaplanır ve sigortalıya tebliğ edilir. Sigortalının kendisine tebliğ edilen borçlanma tutarının tamamını tebliğ tarihinden itibaren 6 ay içinde ödemesi halinde, bu süreler sigortalılık süresi olarak değerlendirilir. Sigortalıya tebliğ edilen borç tutarının bu süre içerisinde tam olarak ödenmemesi halinde bu süreler sigortalılık süresi olarak değerlendirilmez ve ödenen tutar bu Kanunun 89 uncu maddesine göre iade edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunun yürürlüğe girdiği tarihten önce 1479 sayılı Kanunun 53 üncü maddesi gereğince 2004 sayılı İcra ve İflas Kanununa göre başlatılmış olan icra takipleri anılan Kanun hükümlerine göre takip edilerek sonuçlandırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Emeklilik yaşına ilişkin bazı geçiş hükümleri" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>4 üncü maddenin birinci fıkrasının (a) bendi kapsamında olup da 8/9/1999 tarihinden 30/4/2008 tarihine kadar ilk defa sigortalı sayılanlar; kadın ise 58, erkek ise 60 yaşını doldurmak ve 7000 gün malullük, yaşlılık ve ölüm sigortaları primi ödemiş olmak şartıyla veya kadın ise 58, erkek ise 60 yaşını doldurmak ve 25 yıldan beri sigortalı bulunmak ve en az 4500 gün malullük, yaşlılık ve ölüm sigortaları primi ödemiş olmak şartıyla yaşlılık aylığından yararlanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>4 üncü maddenin birinci fıkrasının (b) bendi kapsamında olup da 8/9/1999 tarihinden 30/4/2008 tarihine kadar ilk defa sigortalı sayılanlar kadın ise 58, erkek ise 60 yaşını doldurmuş ve 25 tam yıl sigorta primi ödemiş olması veya kadın ise 60, erkek ise 62 yaşını doldurması ve en az 15 tam yıl malullük, yaşlılık ve ölüm sigortaları primi ödemesi şartıyla kısmi yaşlılık aylığından yararlanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamında olup da 8/9/1999 tarihinden 30/4/2008 tarihine kadar ilk defa sigortalı sayılanlar kadın ise 58, erkek ise 60 yaşını doldurmuş ve 25 tam yıl sigorta primi ödemiş olması veya 61 yaşını doldurması ve en az 15 tam yıl malullük, yaşlılık ve ölüm sigortaları primi ödemesi şartıyla kısmi yaşlılık aylığından yararlanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>17/10/1983 tarihli ve 2925 sayılı Kanun kapsamında sigortalı olup da 8/9/1999 tarihinden 30/4/2008 tarihine kadar ilk defa sigortalı sayılanlar; kadın ise 58, erkek ise 60 yaşını doldurmak ve onbeş yıldan beri sigortalı olup 3600 gün malullük, yaşlılık ve ölüm sigortaları primi ödemek şartıyla yaşlılık aylığından yararlanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu Kanunun yürürlük tarihinden önce bazı hükümleri yürürlükten kaldırılan 506 sayılı Sosyal Sigortalar Kanununa göre sigortalı sayılanlardan;</template>
          <mvz-bent no="a">
            <template>En az 20 yıldan beri Bakanlıkça tespit edilen maden işyerlerinin yeraltı işyerlerinde sürekli çalışan ve bu işlerde en az 5000 gün malullük, yaşlılık ve ölüm sigortaları primi ödeyen sigortalılara yazılı talepleri halinde 28 inci maddenin ikinci fıkrasının (a) bendindeki yaş şartları aranmaksızın yaşlılık aylığı bağlanır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>En az 25 yıldan beri Bakanlıkça tespit edilen maden işyerlerinin yeraltı işyerlerinde yeraltı münavebeli işlerinde çalışan ve bu işlerde en az 4000 gün malullük, yaşlılık ve ölüm sigortaları primi ödeyen sigortalılara da 28 inci maddenin ikinci fıkrasının (a) bendindeki yaş şartları aranmaksızın 8100 gün prim ödemiş sigortalılar gibi yaşlılık aylığı bağlanır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>50 yaşını dolduran ve malullük, yaşlılık ve ölüm sigortalarına tâbi çalışmalarının en az 1800 gününü Bakanlıkça tespit edilen maden işyerlerinin yeraltı işlerinde geçirmiş olan sigortalılara da birinci fıkrada belirtilen diğer şartlarla yaşlılık aylığı bağlanır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu Kanunun yürürlüğe girdiği tarihten önce beşinci fıkrada belirtilen işlerde çalışmaya başlayan sigortalıların, bu Kanunun yürürlük tarihinden önce veya sonra bu işlerde geçen çalışmalarının en az 1800 gün olması halinde bu çalışmalarının dörtte biri toplam prim ödeme gün sayılarına ilave edilir. Bunlar için malullük, yaşlılık ve ölüm sigortaları primi, sigortalının prime esas kazancının %23’üdür. Bunun % 9’u sigortalı hissesi, % 14’ü de işveren hissesidir. Bu Kanunun yürürlüğe girdiği tarihten sonra ilk defa maden işyerlerinin yeraltı veya yeraltı münavebeli işlerde çalışmaya başlayanlar hakkında, bu Kanunun fiili hizmet zammı süresine ait hükümleri uygulanır.</template>
        </mvz-fıkra>

        <mvz-fıkra no="1">
          <template>4 üncü maddenin birinci fıkrasının (a) bendi kapsamında olup bu Kanunun yürürlük tarihinden önce ilk defa sigortalı olanlardan, sigortalı olarak ilk defa çalışmaya başladığı tarihten önce 506 sayılı Sosyal Sigortalar Kanununun mülga 53 üncü maddesine göre malûl sayılmayı gerektirecek derecede hastalık veya engeli bulunan ve bu nedenle malullük aylığından yararlanamayan sigortalılar, yaşları ne olursa olsun en az onbeş yıldan beri sigortalı bulunmak ve en az 3600 gün malullük, yaşlılık ve ölüm sigortaları primi ödemiş olmak şartıyla yaşlılık aylığından yararlanırlar.</template>

        <mvz-fıkra no="4">

        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Yukarıdaki fıkrada belirtilen alt sınır aylıklarının hesabında, 506 sayılı Sosyal Sigortalar Kanununun mülga 92 nci maddesinin ikinci fıkrasına göre belirlenen yarım aylıklar ile aynı Kanunun mülga 96 ncı maddesinin beşinci fıkrası hükmüne göre alt sınır aylığı uygulanmayan aylıklar ile sosyal güvenlik sözleşmeleri gereğince bağlanan kısmî aylıklar dikkate alınmaz.</template>

      <mvz-madde no="11" başlık="Sigortalı tesciline, sigorta sicil numarasına ve dış temsilciliklerdeki görevlilere ilişkin geçiş hükümleri" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Bu Kanun yürürlüğe girmeden önce mevcut sosyal güvenlik kurumlarında tescili yapılan sigortalılar ve ilk defa tescili yapılacak sigortalılar ile bunların hak sahipleri için ortak bilgi bankası oluşturulur. Bu sigortalılar ile sisteme yeni katılacak sigortalıların tescilinde, Türkiye Cumhuriyeti kimlik numaraları sosyal güvenlik sicil numarası olarak esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sigortalıların eski sigorta sicil numaraları, bu Kanuna göre tescil edilecekleri tarihe kadar kullanılmaya devam edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunun 4 üncü maddesinin (b) bendi kapsamında olan sigortalıların, bu Kanunun 17 nci maddesine göre hesaplanacak günlük kazançlarında; bu Kanunun yürürlük tarihinden sonraki sürelere ait prime esas kazanç hesabında dikkate alınan unsurlar, bu Kanunun yürürlük tarihinden önceki sürelere ait prime esas kazanç hesabında da dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">

        <mvz-fıkra no="5">

        <mvz-fıkra no="2">
          <template>Kamu idarelerinin sağlık hizmetlerinin sağlanmasına ilişkin görevleri, yürürlükten kaldırılan kanunlardaki hak ve yükümlülükler çerçevesinde ilgili kayıt ve işlemler Kurum tarafından devralınan tarihe kadar devam eder. Devir süreci 1/1/2012 tarihine kadar tamamlanır.</template>

        <mvz-fıkra no="3">

        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunun yürürlük tarihinden 1/1/2012 tarihine kadar bu Kanunun 60 ıncı maddesinin birinci fıkrasının (e) bendinin (1) numaralı alt bendi uygulanmaz. Bu sürede, 18/6/1992 tarihli ve 3816 sayılı Kanun kapsamında yeşil kart verilen ve verilecek kişiler durumlarında değişiklik olmaması kaydıyla başka bir işleme gerek kalmaksızın bu Kanunun 60 ıncı maddesinin birinci fıkrasının (e) bendinin (1) numaralı alt bendi kapsamında genel sağlık sigortalısı sayılır. 3816 sayılı Kanun kapsamında yeşil kart almak için müracaat etmekle birlikte, 3816 sayılı Kanun hükümlerine göre tespit edilen aile içindeki kişi başına düşen gelir payının aylık tutarı; asgari ücretin üçte birinden asgari ücrete kadar olduğu tespit edilen kişiler için 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırının otuz günlük tutarının üçte biri, asgari ücretten asgari ücretin iki katına kadar olduğu tespit edilen kişiler için 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırının otuz günlük tutarı; asgari ücretin iki katından fazla olduğu tespit edilen kişiler için 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırının otuz günlük tutarının iki katı prime esas asgari kazanç tutarı olarak esas alınır.  1/1/2012 tarihine kadar bu Kanunun uygulanmasında Kurumca talep edilen aile içindeki kişi başına düşen gelir tutarlarının tespiti kararları, gerekli araştırma ve inceleme yapıldıktan sonra, il ve ilçe idare kurulları tarafından verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>60 ıncı maddenin birinci fıkrasının (d) ve (g) bentleri gereğince sigortalı sayılanlar, bu Kanunun yürürlüğe girdiği tarihten itibaren 1/1/2012 tarihine kadar bildirimlerini yapmak zorundadır. Bu süre içinde, 60 ıncı maddenin birinci fıkrasının (d) ve (g) bentleri gereğince genel sağlık sigortalısı sayılanlardan; tescil talebi olmayanların 18 yaşından küçük çocuklarının sağlık hizmetlerinden yararlandırılması halinde bu kişiler Kurumca tescil edildikleri tarih itibarıyla genel sağlık sigortalısı olurlar. Ancak, aile hekimliği uygulamasına başlanan illerde, bu kişiler bu süreye bakılmaksızın genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişi olarak Kurumca tescil edildikleri tarih itibarıyla kapsama alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Aile hekimleri tarafından başlatılan sevk zincirine uygun olarak alınan sağlık hizmetlerinde 68 inci maddenin ikinci fıkrasında belirtilen katılım payları, üç yıl süreyle %50 oranında azaltılarak uygulanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>70 inci maddenin birinci fıkrası gereği yapılacak belirlemeler, bu Kanunun yürürlüğe girdiği tarihten itibaren en geç bir yıl içinde tamamlanır. Bu süre içerisinde 70 inci maddenin ikinci fıkrasının uygulanmasını il ve ilçe bazında ertelemeye Sağlık Bakanlığı yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>İlgili kanunları gereği tedavi yardımları karşılanan kişiler, bu Kanunun yürürlüğe girdiği tarihte herhangi bir işleme gerek kalmaksızın, bu Kanun açısından genel sağlık sigortalısı veya genel sağlık sigortalısının bakmakla yükümlü olduğu kişi sayılır. Bu Kanunun yürürlüğe girdiği tarihte ilgili kanunları gereği bakmakla yükümlü olunan kız çocukları bu Kanun gereğince de bakmakla yükümlü olunan kişi sayılır. Ancak durumlarında değişiklik olduğunda sağlık hizmetlerinden yararlanma koşulları bu Kanun hükümlerine göre yeniden belirlenir.  Kız çocuklarının durum değişikliklerinin ortadan kalkması halinde, bu kişiler tekrar ilgili kanunlarına göre bakmakla yükümlü olunan kişi sayılır. Bu kişilerin sigortalı ve sigortalının bakmakla yükümlü olduğu kişilere ilişkin bilgileri ilgili kurumlar tarafından bu Kanunun yürürlük tarihinden itibaren en geç üç ay içinde Kuruma bildirilir.</template>

        <mvz-fıkra no="9">
          <template>211 sayılı Türk Silâhlı Kuvvetleri İç Hizmet Kanununun, bu Kanuna aykırı hükümleri, bu Kanunun yürürlüğe girdiği tarihten itibaren iki yıl süreyle uygulanır.</template>

        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>63 üncü maddede sayılan finansmanı Kurumca sağlanacak sağlık hizmetleri ile 65 inci madde gereği ödenecek gündelik, yol, yatak ve yemek giderlerinin 72 nci madde hükümlerine göre Kurumca ödenecek bedelleri tespit edilip yayımlanıncaya, 73 üncü madde hükümlerine göre sağlık hizmeti sunucuları ile sözleşmeler yapılıncaya kadar, Kurum tarafından belirlenmiş olan usûl ve esaslar, sağlık hizmeti bedelleri ile protokol ve sözleşmeler geçerlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>4857 sayılı İş Kanununun 13 üncü ve 14 üncü maddelerine göre kısmi süreli iş sözleşmesiyle çalışanlar ile bu Kanuna göre ev hizmetlerinde ay içerisinde 30 günden az çalışan sigortalıların eksik günlerine ait genel sağlık sigortası primlerini 30 güne tamamlama yükümlülüğü 1/1/2012 tarihinde başlar.</template>

          <template>213 31/12/1960 tarihli ve 193 sayılı Gelir Vergisi Kanununun 9 uncu maddesinin birinci fıkrasının (6) numaralı bendinde belirtilen işleri, hizmet akdiyle herhangi bir işverene tabi olmaksızın sürekli ve kazanç getirici nitelikte yaptıkları 213 Maliye Bakanlığının görüşü alınarak Kurumca belirlenen usul ve esaslara göre tespit edilen kadın isteğe bağlı sigortalılar; bu maddenin yürürlüğe girdiği yıl için 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırının onbeş katı üzerinden başlanılarak, takip eden her yıl için bir puan arttırılmak suretiyle otuz katını geçmemek üzere malullük, yaşlılık, ve ölüm sigortaları ile genel sağlık sigortası primi öderler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="Kendi adına ve hesabına çalışanların sigortalılıklarının durdurulmasına ilişkin hükümler" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Kendi adına ve hesabına bağımsız çalışanlarla tarımda kendi adına ve hesabına bağımsız çalışanlardan, 1479 ve 2926 sayılı kanunlara göre tescilleri yapıldığı halde, bu maddenin yürürlük tarihi itibarıyla beş yılı aşan süreye ilişkin prim borcu bulunanların, bu sürelere ilişkin prim borçlarını, prim borçlarının ödenmesine ilişkin Kurumca çıkarılacak genel tebliğin yayımı tarihini takip eden aybaşından itibaren 6 ay içerisinde ödememeleri halinde, prim ödemesi bulunan sigortalıların daha önce ödedikleri primlerin tam olarak karşıladığı ayın sonu itibarıyla, prim ödemesi bulunmayan sigortalıların ise tescil tarihi itibarıyla sigortalılığı durdurulur. Prim borcuna ilişkin süreler sigortalılık süresi olarak değerlendirilmez ve bu sürelere ilişkin Kurum alacakları takip edilmeyerek, Kurum alacakları arasında yer verilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, sigortalı ya da hak sahipleri daha sonra müracaatları tarihindeki 80 inci maddenin ikinci fıkrasına göre belirlenecek prime esas kazanç tutarı üzerinden hesaplanacak borç tutarının tamamını, borcun tebliğ tarihinden itibaren üç ay içinde ödedikleri takdirde, bu süreler sigortalılık süresi olarak değerlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sigortalılıkları önceki kanunlara göre durdurulanlar için de bu maddenin ikinci fıkrası hükmü uygulanır.</template>
        </mvz-fıkra>

          <template>İlgili kanunlarında düzenleme yapılıncaya kadar;</template>
          <mvz-bent no="a">
            <template>8/6/1949 tarihli ve 5434 sayılı Kanunun 56 ncı maddesinin birinci fıkrasında belirtilenlerden bu Kanunla yürürlükten kaldırılan maddeleri dahil 5434 sayılı Kanuna göre vazife veya harp malûlü sayılması gerekenlerin ve Türk Silâhlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı tarafından görevlendirildiği tarihte uzun vadeli sigorta kollarına tabi olarak çalışmayanlardan bu Kanunla yürürlükten kaldırılan maddeleri dahil 5434 sayılı Kanuna göre harp malûlü sayılması gerekenlerin kendileri ile bunların dul ve yetimlerine bağlanacak aylıklar hakkında bu Kanunun yürürlük tarihinden önceki hükümlerin uygulanmasına devam olunur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>5434 sayılı Kanunun ek 77 nci maddesinin birinci fıkrası ile bu Kanunun 47 nci maddesinin sekizinci fıkrasında sayılanlara ve bunların haksahiplerine, ilgili kanunları ve bu Kanun çerçevesinde bağlanacak aylıkları toplamının, emsallerinin 5434 sayılı Kanunun ek 77 nci maddesine göre yükseltilerek hak kazandıkları aylıklardan düşük olması halinde, aradaki fark ayrıca ödenir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>18/3/1924 tarihli ve 442 sayılı Kanunun ek 16 ncı maddesi, 24/2/1968 tarihli ve 1005 sayılı Kanun, 3/11/1980 tarihli ve 2330 sayılı Kanun, 11/10/1983 tarihli ve 2913 sayılı Kanun, 28/5/1986 tarihli ve 3292 sayılı Kanun, 12/4/1991 tarihli ve 3713 sayılı Kanun ile yılı bütçe kanunlarına ekli cetveller kapsamına giren kişilere ve diğer kanunlarda yapılan atıflar sebebiyle 2330 sayılı Kanun esas alınarak ilgililerine aylık, tazminat ve ek ödeme verilmesi ile yardım işlemleri hakkında, bu Kanunla yürürlükten kaldırılan maddeleri dahil 5434 sayılı Kanunun ilgili hükümlerinin uygulanmasına devam edilir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Polis Akademisinde öğrenim görmekte olan öğrencilerin yetim aylıkları bu öğrenimleri süresince kesilmeksizin ödenmeye devam edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu madde kapsamına giren ve malullüklerinin sürekli olduğuna Kurum Sağlık Kurulunca karar verilen geçici ve gönüllü köy korucuları ile 2330 sayılı Kanunun 2 nci maddesinin birinci fıkrasının (e) ve (f) bentlerinde sayılan hizmetlerinden dolayı malullük aylığı bağlananlar 442 sayılı Kanunda öngörülen yaş hadlerine kadar, er ve erbaşlar askerlik çağı dışına çıktıkları tarihe kadar yeniden muayene edilmelerini Kurumdan isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu madde kapsamına girenler için yukarıdaki fıkralar gereğince Kurumun yükleneceği ilâve giderler, ödeme tarihinden itibaren en geç iki ay içinde faturası karşılığı Hazineden tahsil edilir.</template>
        </mvz-fıkra>

      <mvz-madde no="19" başlık="Aylık alanlardan kesilecek sağlık sigortası primi" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>1479 ve 2926 sayılı kanunlara göre aylık almakta olanlarla 4 üncü maddenin birinci fıkrasının (b) bendi kapsamında çalışmaları nedeniyle geçici 2 nci maddeye göre aylık bağlanacaklara aylık bağlamaya esas tüm hizmetleri süresince on yıl süreyle hastalık sigortası veya sağlık sigortası veya genel sağlık sigortası primi ödememiş olanlardan, hastalık sigortası, sağlık sigortası ve genel sağlık sigortası primi kesilmiş olan süreler düşülmek kaydıyla, aylıklarının %10’u oranında ve 10 yılı tamamlayacak süreyle genel sağlık sigortası primi kesilir. Ancak, bu maddenin yürürlük tarihinden önce yapılan kesintiler iade edilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="506 sayılı Kanunun geçici 20 nci maddesi kapsamındaki sandıklar ve ilgili hükümler" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>506 sayılı Kanunun geçici 20 nci maddesi kapsamındaki bankalar, sigorta ve reasürans şirketleri, ticaret odaları, sanayi odaları, borsalar veya bunların teşkil ettikleri birlikler personeli için kurulmuş bulunan sandıkların iştirakçileri ile aylık veya gelir bağlanmış olanlar ile bunların hak sahiplerinin Sosyal Güvenlik Kurumuna devir tarihini belirlemeye Cumhurbaşkanı yetkilidir. Devir tarihi itibarıyla sandık iştirakçileri bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında sigortalı sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sosyal Güvenlik Kurumu, Maliye Bakanlığı, Hazine Müsteşarlığı, Devlet Plânlama Teşkilatı Müsteşarlığı, Bankacılık Düzenleme ve Denetleme Kurumu, Tasarruf Mevduatı Sigorta Fonu, her sandık için ayrı ayrı olmak üzere hesabı yapılan Sandığı temsilen bir ve Sandık iştirakçilerini istihdam eden kuruluşu temsilen bir üyenin katılımıyla oluşturulacak komisyonca; her bir sandık için sandıktan ayrılan iştirakçiler de dâhil olmak üzere, devir tarihi itibarıyla devredilen kişilerle ilgili olarak, sandıkların bu Kanun kapsamındaki sigorta kolları itibariyle gelir ve giderleri dikkate alınarak yükümlülüğünün peşin değeri hesaplanır. Peşin değerin aktüeryal hesabında kullanılacak teknik faiz oranı yüzde 9,8 olarak esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belirlenen peşin değer, onbeş yıldan fazla olmamak üzere, yıllık eşit taksitlerle her yıl için ayrı ayrı Hazine Müsteşarlığınca açıklanacak Yeni Türk Lirası cinsinden iskontolu ihraç edilen Devlet iç borçlanma senetlerinin yıllık ortalama nominal faizi üzerinden sandıklardan ve bu sandık iştirakçilerini istihdam eden kuruluşlardan müteselsilen Kurumca bu Kanun hükümlerine göre tahsil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Devir işlemi tamamlanıncaya kadar, sandık iştirakçileri, sandıktan aylık ve gelir alanlar ile bunların hak sahiplerinin sağlık ve sosyal sigorta yardımlarının sağlanması ile primlerinin tahsil edilmesine, ilgili sandık mevzuat hükümlerine göre sandıklarca ve sandık iştirakçilerini istihdam eden kuruluşlarca devam edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Devir işlemi tamamlandıktan sonra sandıklarca ödenen aylık ve gelirlerin, bu Kanunun yürürlük tarihinden önceki süreler için 506 sayılı Kanun, yürürlük tarihinden sonraki süreler için bu Kanun hükümleri uygulanmak suretiyle hesaplanacak aylık ve gelirlerin üzerinde olması halinde söz konusu farklar, peşin değer hesabında dikkate alınır ve Sosyal Güvenlik Kurumu tarafından ilgililere ödenmeye devam edilir. Devir tarihinden sonra bu kişilerin gelir ve aylıklarının durum değişikliği nedeniyle artırılması, azaltılması, kesilmesi ve yeniden bağlanması işlemleri sırasında vakıf senetlerine göre yapılacak hesaplamalar ilgili sandıklar veya sandık iştirakçilerini istihdam eden kuruluşlar tarafından Kurum kontrolünde yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Devir tarihi itibariyle sandıklarda iştirakçi olanlar ile sandıklardan ayrılmış olup, aylık veya gelir almayanların sandıklara karşı hak sahibi olmaları halinde tahsis talep tarihi itibariyle aylıkları, bu Kanunun geçici 2 nci maddesi hükümlerine göre hesaplanır. Geçici 2 nci maddenin birinci fıkrasının (a) bendinin uygulanmasında bu Kanunun yürürlüğe girdiği tarihten önceki dönem için 506 sayılı Kanun hükümlerine göre Kurum tarafından ve vakıf senetlerine göre ilgili sandıklar ve sandık iştirakçilerini istihdam eden kuruluşlar tarafından Kurum kontrolünde hesaplama yapılır. Geçici 2 nci madde kapsamında hesaplanacak aylıklar ile sandıkta geçen süreler dikkate alınarak sandık hükümlerine göre hesaplanacak aylıklar arasında fark olması halinde söz konusu farklar, peşin değer hesabında dikkate alınır ve Sosyal Güvenlik Kurumu tarafından ilgililere ödenmeye devam edilir. Bu kişilerin gelir ve aylıklarının durum değişikliği nedeniyle artırılması, azaltılması, kesilmesi ve yeniden bağlanması işlemleri sırasında vakıf senetlerine göre yapılacak hesaplamalar ilgili sandıklar veya sandık iştirakçilerini istihdam eden kuruluşlar tarafından Kurum kontrolünde yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Sandık iştirakçileri ile aylık ve/veya gelir bağlanmış olanlar ve bunların hak sahiplerinin Sosyal Güvenlik Kurumuna devrinden sonra bu kişilerin tabi oldukları vakıf senedinde bulunmasına rağmen karşılanmayan diğer sosyal hakları ve ödemeleri, sandıklar ve sandık iştirakçilerini istihdam eden kuruluşlarca karşılanmaya devam edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar ile bu maddenin beşinci ve altıncı fıkralarında belirtilen farklara ilişkin peşin değerin ilk taksitle birlikte defaten veya taksitler halinde ödenmesi konusu, Cumhurbaşkanı kararı ile belirlenir. Taraflar, Sosyal Güvenlik Kurumunca belirlenecek tarihe kadar görüş ve önerilerini yazılı olarak verirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Bu maddenin uygulanmasına ilişkin iş ve işlemlerde Türkiye Odalar, Borsalar ve Birlik Personeli Sigorta ve Emekli Sandığı Vakfı iştirakçilerini istihdam eden kuruluşları, 18/5/2004 tarihli ve 5174 sayılı Türkiye Odalar ve Borsalar Birliği ile Odalar ve Borsalar Kanunu ile kurulan Türkiye Odalar ve Borsalar Birliği temsil eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Söz konusu sandıklar ve sandık iştirakçilerini istihdam eden kuruluşlar ile Kurum, bu madde uygulamasına ilişkin tüm işlemler nedeniyle doğacak her türlü vergi, resim ve harçtan muaftır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Bu Kanunun kısa vadeli sigorta kolları ve genel sağlık sigortası hariç diğer hükümleri bakımından; vakıf senetlerinde bu Kanuna aykırı hükümler bulunması halinde, bu Kanunun yürürlük tarihi itibariyle bu Kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>30/4/2008 tarihinden itibaren, sandıklarca bağlanmış/bağlanacak olan gelir veya aylıklara yapılacak artışlar, 506 sayılı Kanuna göre bağlanan gelir veya aylıklara yapılan artışlardan fazla olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Bu maddenin beşinci ve altıncı fıkralarına göre Sosyal Güvenlik Kurumu tarafından ödenecek olan aylık ve gelirler üzerindeki farklar ve bu madde çerçevesinde devre ilişkin belirlenecek usûl ve esaslar bu maddenin yayımından önce 506 sayılı Kanunun ek 36 ncı maddesine göre devri gerçekleşmiş veya devam eden sandıklar için uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="14">
          <template>5411 sayılı Bankacılık Kanununun 58 inci maddesi hükümleri bu madde kapsamında yapılacak devir ve diğer işlemler hakkında uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="2108 sayılı Yasaya ilişkin geçiş hükümleri" tür="GEÇİCİ" durum="mülga">
      </mvz-madde>
      <mvz-madde no="22" başlık="Anonim şirket kurucu ortaklarının sigortalılıklarına ilişkin geçiş hükümleri" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendinin (3) numaralı alt bendinde belirtilen anonim şirketlerin kurucu ortaklarından daha önce 1479 sayılı Kanunun 24 üncü maddesine tabi olarak sigortalı olanlardan sigortalılıklarını devam ettirmek isteyenlerin bu maddenin yürürlük tarihinden itibaren altı ay içinde yazılı talepte bulunmaları halinde sigortalılıkları aynen devam ettirilir. Bu süre içerisinde talepte bulunmayanların sigortalılıkları ise bu Kanunun yürürlük tarihi itibariyle sona erer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Sosyal güvenlik prim yapılandırılması bozulanlara ilişkin hükümler" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>22/2/2006 tarihli ve 5458 sayılı Sosyal Güvenlik Prim Alacaklarının Yeniden Yapılandırılması ve Bazı Kanunlarda Değişiklik Yapılması Hakkında Kanunun 1 inci ve 2 nci maddeleri kapsamına giren borçları yeniden yapılandırıldığı halde aynı Kanunun 3 üncü maddesi uyarınca yeniden yapılandırma haklarını bu maddenin yürürlüğe girdiği tarihi takip eden ayın sonuna kadar kaybedenlerin, bu maddenin yürürlüğe girdiği tarihi takip eden iki ay içinde Kuruma yazılı olarak başvurmaları halinde, bozulmuş olan yeniden yapılandırma anlaşmaları, 5458 sayılı Kanuna göre yapılmış olan başvuru tarihi ve taksitlendirme süresi dikkate alınmak suretiyle ihya edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yeniden yapılandırma anlaşmaları ihya edilen borçluların, yeniden yapılandırma anlaşmalarının bozulduğu tarihten sonra 5458 sayılı Kanun kapsamına giren borçları için yaptıkları ödemeler, anılan Kanunun 1 inci maddesi kapsamında olanlar için aynı borç türündeki taksit tutarlarına, 2 nci maddesi kapsamında olanlar için ise anılan Kanunun 10 uncu maddesi hükmüne göre mahsup edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İhya veya mahsup işlemleri sonucunda bu maddeye göre yapılan başvuru tarihinden önce vadesinde ödenmediği veya eksik ödendiği anlaşılan taksit tutarlarının, ödeme tarihine kadar gecikilen her ay için ayrı ayrı Hazine Müsteşarlığınca açıklanacak bir önceki aya ait Yeni Türk Lirası  cinsinden iskontolu ihraç edilen Devlet iç borçlanma senetlerinin aylık ortalama faiz oranına 1 puan eklenmek suretiyle bulunacak faiz oranının bileşik bazda uygulanması sonucunda hesaplanacak faiz miktarıyla birlikte başvuru tarihini takip eden altı ay içinde ödenmesi halinde, 5458 sayılı Kanunun yeniden yapılandırma hükümlerinden yararlanılır. Bu fıkrada belirtilen ödeme yükümlülüklerinin söz konusu altı aylık süre içinde tam olarak yerine getirilmemesi halinde yeniden yapılandırma hakkı kaybedilir ve yapılandırma işlemleri iptal edilerek, ödedikleri tutarlar sosyal güvenlik mevzuatının ilgili hükümlerine göre borçlarına mahsup edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu madde hükümlerinden yararlandırılan borçluların, bu maddeye göre yapılan başvuru tarihinden itibaren vadesi gelecek taksitleri ile cari ay prim ödeme yükümlülükleri yönünden, 5458 sayılı Kanunun 3 üncü maddesi hükümleri uygulanır. Şu kadar ki, 5458 sayılı Kanunun 3 üncü maddesi hükümleri, anılan Kanunun 1 inci maddesi kapsamına giren borçlular yönünden, bu maddeye göre yapılan başvuru tarihini takip eden üçüncü ayın sonundan, 2 nci maddesi kapsamına giren borçlular yönünden ise bu maddenin üçüncü fıkrasında belirtilen altı aylık sürenin sonundan itibaren geriye doğru bakılarak uygulanmaya başlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>5458 sayılı Kanunun 1 inci ve 2 nci maddeleri kapsamına giren borçları yeniden yapılandırılanlardan, aynı Kanunun 3 üncü maddesi uyarınca yeniden yapılandırma haklarını kaybetmiş olup, kapsama giren bu borçlarının tamamını sosyal güvenlik mevzuatının ilgili hükümlerine göre ödemiş olanlar hakkında bu madde hükümleri uygulanmaz. Borçlarını kısmen ödemiş olup bu maddeden yararlanmak için başvuranlara, daha önce ödemiş oldukları tutarlar iade edilmez, bu maddenin birinci ve ikinci fıkraları saklı kalmak kaydıyla mahsup işlemi yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu maddenin yürürlüğe girdiği tarihten önce 5458 sayılı Kanun kapsamına giren borçlar nedeniyle, taşınır ve taşınmaz mallara konulan hacizler ile alınan teminatlar vadesi geçmiş taksitlerin ödenmesinden sonra yapılan ödemeler nispetinde, üçüncü şahıslar nezdindeki hak ve alacaklarla ilgili hacizler ise vadesi geçmiş taksitlerin ödenmesinden sonra tümüyle kaldırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>1479 ve 2926 sayılı Kanunlar kapsamındaki sigortalılar veya bunların hak sahipleri, ödeme vadesi geçmiş taksitleri ile 1/4/2006 tarihinden sonraki süreye ilişkin prim borçlarını ödemeleri ve bu maddenin yürürlüğe girdiği tarihten sonraki taksit ve cari ay primlerine ilişkin ödeme yükümlülüklerini yerine getirmeleri durumunda sağlık sigortasından yararlanmaya başlatılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">

      <mvz-madde no="24" başlık="Sosyal güvenlik alacakları" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>17/7/1964 tarihli ve 506 sayılı Sosyal Sigortalar Kanununa göre takip edilen 10/7/2004 tarihli ve 5216 sayılı Büyükşehir Belediyesi Kanununun geçici 3 üncü maddesi, mülga 7/12/2004 tarihli ve 5272 sayılı Belediye Kanununun geçici 7 nci maddesi ve 3/7/2005 tarihli ve 5393 sayılı Belediye Kanununun geçici 5 inci maddesine istinaden Uzlaşma Komisyonunca karara bağlanan ve Bakanlar Kurulunca onaylanarak Resmi Gazetede yayımlanan borçlar hariç olmak üzere, bu maddeye göre yapılan başvuru tarihine kadar tahakkuk ettiği halde ödenmemiş olan, 2008/Mart ve önceki dönemlere ilişkin sigorta primi, işsizlik sigortası primi, idari para cezası, sosyal yardım zammı ile bu Kanunun yürürlüğe girdiği tarihi takip eden ayın sonuna kadar müracaat edilmiş olması kaydıyla 31/3/2008 tarihine kadar bitirilmiş olan özel bina inşaatı ile ihale konusu işlerden Sosyal Güvenlik Kurumunca yapılan ön değerlendirme, araştırma veya tespit sonucunda yeterli işçilik bildiriminde bulunulmadığı anlaşılanların fark işçiliğe ilişkin borçları, isteğe bağlı sigortalıların 2003/Mayıs ila 2008/Mart dönemleri arasında isteğe bağlı sigortalılıklarının devam ettiği süre içindeki prim borçları, topluluk sigortasına tabi olanların 2008/Mart ve önceki dönemlere ilişkin malullük, yaşlılık ve ölüm sigortalarına ait prim borçları, 2/9/1971 tarihli ve 1479 sayılı Esnaf ve Sanatkârlar ve Diğer Bağımsız Çalışanlar Sosyal Sigortalar Kurumu Kanunu ile 17/10/1983 tarihli ve 2926 sayılı Tarımda Kendi Adına ve Hesabına Çalışanlar Sosyal Sigortalar Kanununa göre sigortalı olanların 31/3/2008 tarihine kadar olan prim ve sosyal güvenlik destek prim borçları, bu maddenin yürürlüğe girdiği tarihi takip eden iki ay içinde yazılı olarak başvurulması kaydıyla, bu maddede belirtilen şartlarla peşin veya yirmidört aya kadar eşit taksitler halinde ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Peşin ödeme yolunun tercih edilerek borç aslının tamamının ve başvurunun yapıldığı ayın sonuna kadar sosyal güvenlik mevzuatının ilgili hükümlerine göre hesaplanan gecikme cezası ve gecikme zammının yüzde onbeşinin başvuru tarihini takip eden bir ay içinde ödenmesi halinde, gecikme cezası ve gecikme zammının kalan yüzde seksenbeşi terkin edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Taksitle ödeme yolunun tercih edilmesi halinde, birinci fıkra kapsamına giren borç asıllarına başvurunun yapıldığı ayın sonuna kadar sosyal güvenlik mevzuatının ilgili hükümlerine göre hesaplanan gecikme cezası ve gecikme zammının; oniki aya kadar taksitlendirmelerde yüzde ellibeşi, oniki ayı aşan taksitlendirmelerde yüzde otuzu terkin edilir ve kalan kısmı borç asıllarına ilave edilerek taksitlendirmeye esas borç hesaplanır. Bulunan bu tutar, taksit süresine bölünmek suretiyle ödenecek aylık taksit miktarı bulunur. İlk taksitin ödeme yükümlülüğü, bu maddeye göre başvurunun yapıldığı ayı takip eden ayda başlar. Başlangıçta taksitle ödeme yolu seçilip daha sonra taksitlendirilen borcun kalan kısmının peşin ödenmek istenilmesi halinde, başlangıçta seçilen taksitlendirme süresine bağlı terkin oranı değiştirilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Borçlular, borç türü bazında taksitlendirilmiş borçlarıyla ilgili ödeme yükümlülüklerini bir takvim yılında üç defadan fazla yerine getirmemeleri veya eksik yerine getirmeleri ya da bir takvim yılında üç defaya kadar ödenmeyen veya eksik ödenen taksit tutarlarını en geç son taksiti izleyen ayın sonuna kadar gecikilen her ay için Hazine Müsteşarlığınca açıklanacak bir önceki aya ait Yeni Türk Lirası  cinsinden iskontolu ihraç edilen Devlet iç borçlanma senetlerinin aylık ortalama faiz oranına 1 puan eklenmek suretiyle bulunacak faiz oranının bileşik bazda uygulanması sonucunda hesaplanacak faiz miktarı ile birlikte ödememeleri halinde, bu maddeye göre taksitlendirme haklarını kaybederler ve taksitlendirme öncesi duruma dönülerek ödedikleri taksit tutarları sosyal güvenlik mevzuatının ilgili hükümlerine göre borçlarına mahsup edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu Kanunun yürürlüğe girdiği tarihten önce tahsil edilmiş gecikme cezası ve gecikme zammı, yanlış veya yersiz alınan tutarlar hariç iade ve mahsup edilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu Kanunun yürürlüğe girdiği tarihten önce bu madde kapsamına giren borçlar nedeniyle, taşınır ve taşınmaz mallara konulan hacizler ile alınan teminatlar yapılan ödemeler nispetinde, üçüncü şahıslar nezdindeki hak ve alacaklarla ilgili hacizler ise ilk taksitin ödenmesinden sonra tümüyle kaldırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu madde kapsamına giren borçları ilgili Kanunlar gereğince tecil ve taksitlendirilmiş veya yapılandırılmış olan borçlularca, tecil ve taksitlendirme veya yapılandırma işlemlerinin bozularak birinci fıkra kapsamına giren borçlarının bu maddeye göre peşin ödenmesinin veya taksitlendirilmesinin başvuru süresi içinde yazılı olarak talep edilmesi halinde, daha önce yapılmış olan tecil ve taksitlendirme veya yapılandırma işlemleri bozularak, ödemiş oldukları tutarlar, sosyal güvenlik mevzuatının ilgili hükümlerine göre mahsup edildikten sonra birinci fıkra kapsamına giren kalan borçları bu maddeye göre peşin ödenir veya taksitlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>22/2/2006 tarihli ve 5458 sayılı Sosyal Güvenlik Prim Alacaklarının Yeniden Yapılandırılması ve Bazı Kanunlarda Değişiklik Yapılması Hakkında Kanuna göre yapılandırma anlaşmaları devam eden veya ihya edilen borçluların 5458 sayılı Kanun kapsamı dışında kalan ancak, bu madde kapsamına giren borçları hakkında, talep etmeleri halinde bu madde hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Büyükşehir belediyeleri, belediyeler ve bunlara bağlı kuruluşlar birinci fıkra kapsamına giren borçlarının taksitlendirilmesini talep etmeleri halinde, 10/7/2004 tarihli ve 5216 sayılı Büyükşehir Belediyesi Kanununun geçici 5 inci maddesi ile 3/7/2005 tarihli ve 5393 sayılı Belediye Kanununun geçici 6 ncı maddesi kapsamına giren borçları için ilgili kanunlar gereğince yapılan kesinti tutarları bu madde uyarınca ödenmesi gereken taksit tutarlarına mahsup edilebilir. Kesinti tutarlarının, aylık taksit tutarlarına mahsup edilmediği durumlarda aylık taksit tutarlarının tamamı, kesinti tutarlarının, aylık taksit tutarlarını tam olarak karşılamadığı durumlarda ise bakiye taksit tutarları borçlularca ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>1479 ve 2926 sayılı kanunlar kapsamındaki sigortalılar veya bunların hak sahipleri, bu madde kapsamı dışında borçlarının bulunmaması veya bu madde kapsamı dışında borçları bulunmakla birlikte bu borçların özel kanunlara göre yapılandırılmış olup ödeme yükümlülüklerinin de yerine getiriliyor olması ve birinci fıkraya göre hesaplanan toplam borçlarının ilk dört taksitini ödemeleri kaydıyla sağlık sigortasından yararlanmaya başlatılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Bu maddede belirtilen hükümlerden yararlanmak üzere başvuran borçluların, kapsama giren borçları nedeniyle Sosyal Güvenlik Kurumuna yaptıkları itirazlardan ve yargı nezdinde sürdürdükleri davalardan feragat etmeleri ve ihtilaf yaratmamaları şarttır.</template>

      <mvz-madde no="36" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>13/5/1971 tarihli ve 1402 sayılı Sıkıyönetim Kanunu uyarınca kurulan sıkıyönetim mahkemelerinin görev alanına giren suçlar nedeniyle yakalanan veya tutuklananlardan, Türk Silahlı Kuvvetlerinin yönetime el koyduğu 12 Eylül 1980 tarihinden itibaren haklarında kovuşturmaya yer olmadığına veya beraatlerine karar verilenlerin, gözaltında veya tutuklulukta geçen süreleri için kendilerinin ya da hak sahiplerinin bu durumlarını belgeleyerek , gözaltında veya tutuklulukta geçen süreleri, talep tarihinde 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırının %45’i üzerinden hesaplanacak primlerinin; bu durumlarından dolayı dava açıp tazminat alanların borcun tebliğ tarihinden itibaren altı ay içerisinde kendilerince veya hak sahiplerince, tazminat almamış olanların ise Hazinece ödenmesi suretiyle borçlandırılır. Bu şekilde borçlanılan süreler Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında prim ödeme gün sayısı olarak değerlendirilir. Ancak, sigortalılık başlangıç tarihinden önceki borçlanılan süreler sigortalılık başlangıç tarihini geriye götürmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>5434 sayılı Kanuna tabi çalışmakta iken 1402 sayılı Sıkıyönetim Kanunu uyarınca kurulan sıkıyönetim mahkemelerinin görev alanına giren suçlar nedeniyle yakalanan veya tutuklananlardan, Türk Silahlı Kuvvetlerinin yönetime el koyduğu 12 Eylül 1980 tarihinden itibaren haklarında kovuşturmaya yer olmadığına veya beraatlerine karar verilenlerin, herhangi bir nedenle hizmet sayılmayan gözaltında veya tutuklulukta geçen süreleri, kendileri veya hak sahiplerinin bu durumlarını belgeleyerek bu maddenin yayımı tarihinden itibaren altı ay içerisinde talepte bulunması kaydıyla, gözaltına alındığı veya tutuklandığı tarihteki emeklilik keseneğine esas aylık derece ve kademesinin talep tarihindeki katsayılar ve emeklilik keseneğine esas aylığın hesabına ait diğer unsurlar ile kesenek ve karşılık oranları %45 olarak esas alınmak suretiyle hesaplanacak borçlanma tutarının altı ay içerisinde kendilerince veya hak sahiplerince ödenmesi halinde hizmet sürelerine eklenir. Borçlanılan süreler 5434 sayılı Kanunun geçici 205 inci maddesine göre yaş tespitinde dikkate alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddenin yürürlüğe girdiği tarihe kadar, kendi sigortalılıklarından dolayı sosyal güvenlik kanunlarına göre gelir veya aylık bağlanmış olanlar ile birinci ve ikinci fıkra kapsamında sayılan söz konusu süreleri herhangi bir şekilde sigortalılık hizmeti olarak değerlendirilmiş olanlar bu madde uyarınca borçlanamazlar. Sosyal güvenlik kanunlarına göre gelir veya aylık bağlanmayan ya da toptan ödeme yapılmak suretiyle hizmetleri tasfiye edilenlerden borçlanacakları bu süreler ile birlikte emekli veya yaşlılık aylığına veya gelire hak kazanacak olanlara, geçmişe yönelik aylık ve farkı ödenmez. Bu maddenin birinci ve ikinci fıkrası kapsamında borçlandırılan süreler emekli ikramiyesi hesabında dikkate alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esasları belirlemeye Kurum yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>19/5/2011, 23/10/2011 ve 9/11/2011 tarihlerinde meydana gelen depremler sonucunda malul kalan sigortalılar ile ölen sigortalılar için, malullük ya da ölüme sebep olan deprem tarihinden önceki döneme ilişkin olarak en az 30 gün malullük, yaşlılık ve ölüm sigortaları primi veya bir aylık kesenek ile karşılık ödenmiş ve bu süreye ilişkin sigortalı tescil işleminin Kanunda belirtilen sigortalı bildirim sürelerinden kaynaklanan haller saklı kalmak kaydıyla deprem tarihlerinden önce yapılmış olması şartıyla, Kanunda öngörülen prim ödeme süresi, hizmet, prim ve prime ilişkin borcu olmama ve sigortalılık sürelerine ilişkin diğer şartlar aranmaksızın bu Kanun hükümlerine göre Kurumca kendilerine veya hak sahiplerine aylık bağlanır. Bu şekilde bağlanan aylıklarla ilgili Kanunda öngörülen prim veya kesenek ile karşılıkların eksik olan kısmı Maliye Bakanlığı tarafından Kuruma ödenir. Bu konudaki usul ve esaslar Çalışma ve Sosyal Güvenlik Bakanlığı, Maliye Bakanlığı ve Hazine Müsteşarlığınca müştereken tespit edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkra kapsamına girenlerden depremler sonucunda yaralanan veya engelli hâle gelenlere verilecek protez, ortez, araç ve gereç bedelleri için katılım payı alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Bu maddenin yürürlük tarihinden önce bu Kanunun 43 üncü maddesinin üçüncü fıkrasında sayılan görevlerde bulunmuş olanlardan herhangi bir sebeple bu görevleri sona erenler ile Büyük Millet Meclisi, Millet Meclisi, Cumhuriyet Senatosu, Temsilciler Meclisi ve Danışma Meclisi Başkanları da bu maddenin yürürlüğe girdiği tarihi takip eden aybaşından itibaren bu Kanunun 43 üncü maddesi hükmünden yararlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu maddenin yürürlüğe girdiği tarih itibariyle Türkiye Büyük Millet Meclisi üyeliği görevi devam edenler ile daha önce yasama organı üyeliği görevi sona ermiş olanlardan veya dışarıdan bakanlığa atanmış olanlardan halen milletvekilliği esas alınarak emekli aylığı ödenenlerin, bu Kanunun 43 üncü maddesine göre aylığa hak kazanabilmesinde, aynı maddenin altıncı fıkrasının birinci cümlesinde belirtilen 2 yıllık süre şartı aranmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu fıkranın yürürlüğe girdiği tarih itibarıyla Türkiye Büyük Millet Meclisi üyeliği görevi devam edenlerden, Kanunun 4 üncü maddesinin birinci fıkrasının (a) veya (b) bentleri kapsamında aylık almakta iken aylıklarını kestirip 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalılık talebinde bulunanların, bu Kanunun 43 üncü maddesine göre aylığa hak kazanabilmesinde, 2 yıl süreyle bu görevlerde bulunmuş olma ve sigorta primi veya emekli keseneği ile kurum karşılığı ödenmesine ilişkin şartlar aranmaz. Bunların müracaatları halinde bu fıkranın yürürlüğe girdiği tarihi takip eden ay başından itibaren Kanunun 4 üncü maddesinin birinci fıkrasının (a) veya (b) bentleri kapsamında olan ve kesilen aylıkları bu Kanunun 43 üncü maddesindeki aylık seviyesine yükseltilmek suretiyle yeniden bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddenin yürürlüğe girdiği tarihten önce Türkiye Büyük Millet Meclisi üyeliği ile dışarıdan atandığı bakanlık görevi sona erdiği halde, malullük, yaşlılık veya emeklilik aylığı bağlanmasına hak kazanamayanlardan, bu Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında sigortalılık ilişkisi devam edenlerin veya bu kapsamda sigortalılık ilişkisi kurmaları gerekenlerin bu sigortalılık ilişkisinden kaynaklanan emekli kesenekleri ve kurum karşılıkları, bu Kanunun ek 7 nci maddesi ile belirlenmiş olan esas ve usuller çerçevesinde ve bu maddenin yürürlüğe girdiği tarihten itibaren 60 gün içinde Kuruma başvurmaları halinde, başvurularını izleyen aybaşından başlayarak 4 yıl süreyle Türkiye Büyük Millet Meclisi bütçesinden karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu madde esas alınarak geriye dönük herhangi bir ödeme yapılmaz ve geriye dönük hak talep edilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Son tahsis talep tarihi veya ölüm tarihi 2000 yılı Ocak ayı başından önce olup, 506 sayılı Kanunun mülga hükümleri uyarınca gösterge sistemine göre bağlanan malullük, yaşlılık ve ölüm aylıkları ile bu tarihten önce malullük veya yaşlılık aylığı almakta iken bu tarihten sonra ölen sigortalıların ölüm aylıkları, bu madde hükümlerine göre yeniden hesaplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Aylıkların hesaplanmasında, 506 sayılı Kanunun mülga maddeleri uyarınca hazırlanan ve 1999 yılı Aralık ayında yürürlükte bulunan gösterge veya üst gösterge tablosundan sigortalı için tespit edilmiş olan mevcut gösterge rakamı ile aynı dönemde yürürlükte bulunan memur aylık katsayısı esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sigortalının aylık bağlama oranı aşağıdaki şekilde belirlenir:</template>
          <mvz-bent no="a">
            <template>Malûllük aylığında; gösterge tablosundan aylık hesaplanmış olan için %60, sigortalının başkasının bakımına muhtaç olması halinde %70, üst gösterge tablosundan aylık hesaplanmış olan için ise 1999 yılı Aralık ayında yürürlükte bulunan ve gösterge rakamına göre %59,9 ila %50 arasında belirlenmiş olan taban aylık bağlama oranı esas alınır. Yaştan ve günden artırım ve eksiltme yapılmaz.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yaşlılık aylığında; gösterge tablosundan aylık hesaplanmış olan için %60, üst gösterge tablosundan aylık hesaplanmış olan için ise 1999 yılı Aralık ayında yürürlükte bulunan ve gösterge rakamına göre %59,9 ila %50 arasında belirlenmiş olan taban aylık bağlama oranı esas alınır. Bu şekilde belirlenen taban aylık bağlama oranı, sigortalının tahsis talep tarihi itibarıyla kadın ise 50, erkek ise 55 yaşından sonra doldurduğu her tam yaş için ve 5000 günden fazla ödediği her 240 günlük malullük, yaşlılık ve ölüm sigortaları primi için (l)’er artırılır, 5000 günden noksan ödediği her 240 gün için (1)’er eksiltilir. Maden işyerlerinin yer altı işlerinde çalışması, sigortalı olarak ilk defa çalışmaya başladığı tarihten önce malûl olması, engelliliği nedeniyle vergi indiriminden yararlanması veya erken yaşlanması nedeniyle tarafına yaşlılık aylığı bağlananlara günden dolayı eksiltme yapılmaz.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Ölüm aylığında; gösterge tablosundan aylık hesaplanmış olan için %60, üst gösterge tablosundan aylık hesaplanmış olan için ise 1999 yılı Aralık ayında yürürlükte bulunan ve gösterge rakamına göre %59,9 ila %50 arasında belirlenmiş olan taban aylık bağlama oranı esas alınır. Bu şekilde belirlenen taban aylık bağlama oranı sigortalının ölüm tarihi itibarıyla kadın ise 50, erkek ise 55 yaşından sonra doldurduğu her tam yaş için ve 5000 günden fazla ödediği her 240 günlük malullük, yaşlılık ve ölüm sigortaları primi için (l)’er artırılır. Günden dolayı eksiltme yapılmaz. Malûllük aylığı almakta iken ölen sigortalılar hakkında bakıma muhtaçlık durumu dikkate alınmaksızın (a) bendi, yaşlılık aylığı almakta iken ölen sigortalılar hakkında ise (b) bendi hükümleri uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Malûllük, yaşlılık ve ölüm aylığının aylık bağlama oranı %85’ten fazla olamaz.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sigortalının 1999 yılı Aralık ayı ödeme dönemi itibarıyla aylığı, yukarıdaki hükümlere göre tespit edilen gösterge rakamı, memur aylık katsayısı ve aylık bağlama oranının çarpımı suretiyle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu madde hükümlerine göre 1999 yılı Aralık ayı ödeme dönemi itibarıyla hesaplanan aylık tutarı, %5,9 oranında artırılarak 2000 yılı Ocak ayına, 2000 yılı Ocak ayı için bu şekilde hesaplanan aylık tutarı ise, 7,13326594120697 çarpanı kullanılarak 2008 yılı Ocak ayına taşınır. Bu şekilde hesaplanan aylık tutarı da, 2008 yılı Ocak ayı ödeme döneminden başlayarak 2013 yılı Ocak ayı ödeme dönemine kadar (bu dönem dahil) 4 üncü maddenin birinci fıkrasının (a) bendi kapsamındaki sigortalılara ödenmekte olan aylıklara uygulanmış olan aylık artışları ile artırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu maddeye göre hesaplanan aylık tutarının, sigortalı veya hak sahiplerine 2013 yılı Ocak ayı ödeme döneminde ödenmekte olan aylık tutarının altında kalması halinde, mevcut aylıkların ödenmesine devam edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu maddeye göre hesaplanan aylıklar için geriye yönelik herhangi bir ödeme yapılmaz.</template>

        <mvz-fıkra no="8">
          <template>Sözleşme aylıklarını 2000 yılı Ocak ayı başından sonra borçlanma yapmak suretiyle tam aylığa yükseltenler ile geçici 20 nci maddeye göre devir alınacak sandıklardan aylık alanlara devir tarihinden sonra bu madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>

      <mvz-madde no="40" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>1479 sayılı Kanunun mülga geçici 17 nci maddesine göre 1/4/2002 ile 30/6/2002 tarihleri arasında kullanılmak üzere hazırlanan gelir basamakları esas alınarak hesaplanmış olan aylıklar bu madde hükümlerine göre yeniden hesaplanır.</template>

      <mvz-madde no="43" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>1416 sayılı Kanuna göre yurt dışına gönderilen ve öğrenimini başarıyla tamamlayarak yurda dönenlerden yükümlü bulunduğu mecburi hizmet süresini tamamlamış olanlardan, bu Kanunun yürürlüğe girdiği tarihten önce 5434 sayılı Kanun hükümlerine tabi olarak çalışmaya başlamış olup geçici 4 üncü madde kapsamında çalışmaya devam edenler; yurt dışında resmî öğrenci olarak geçirmiş oldukları öğrenim sürelerinin 18 yaşının tamamlanmasından sonraki döneme ait olan kısmının tamamını veya bir bölümünü,  müracaat etmeleri ve müracaatın kabul edildiği ay itibarıyla geçerli olan emekli keseneğine esas kazanç tutarı üzerinden ve borçlanacakları süreye ilişkin olarak %45 oranında hesaplanacak kesenek ve kurum karşılığı toplamından oluşan yükümlülük tutarının tamamını peşin olarak veya müracaatın kabul tarihinden itibaren oniki ayda eşit taksitler halinde ödemek suretiyle borçlanabilirler. Borcunu taksitler halinde ödeyecek olanların borçlanma işlemi sırasında hesaplanan aylık taksit tutarı, borcun ödendiği tarihteki prime esas asgarî kazanca oranlanarak, söz konusu oran ilgili ayın prime esas asgarî kazancı ile çarpılır ve bulunan tutar, ilgili ayın taksit tutarı kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Borcunun tamamını peşin ödeyenler ile taksit ödeme dönemi sonunda borcunun tamamını ödemiş olduğu tespit olunanların borçlanmış oldukları süreler, fiili hizmet süresinin hesabında ve iştirakçiliğin başlangıç tarihinin tespitinde dikkate alınır. Aylık taksitlerini zamanında ödemeyenlerin önceki aylara ilişkin olarak ödemiş oldukları tutarlar, süresi geçen son taksit tarihinden itibaren otuz gün içinde ilgililere iade olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddeye göre yapılacak borçlanma işlemlerine ilişkin olarak birinci ve ikinci fıkrada düzenlenmemiş olan hususlar hakkında mülga hükümleri dahil 5434 sayılı Kanun hükümleri uygulanır.</template>

      <mvz-madde no="44" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>23/4/1999 ile 14/2/2005 tarihleri arasında tabi oldukları personel mevzuatına göre almış oldukları disiplin cezası sonucu memuriyetleri sona erip, 22/6/2006 tarihli ve 5525 sayılı Kanun uyarınca haklarında verilmiş disiplin cezaları bütün sonuçları ile ortadan kaldırılanların bu maddenin yürürlük tarihinden itibaren 3 ay içinde Kuruma müracaat etmeleri halinde ve yaş haddine ilişkin hükümler saklı kalmak kaydıyla; memuriyetlerinin sona erdiği tarih ile 22/6/2006 tarihi arasındaki dönem içinde uzun vadeli sigorta kollarına tabi olarak sigorta primi ödenmemiş veya emekli keseneği yatırılmamış sürelerine ilişkin kesenek ve kurum karşılığı toplamları, görevden ayrıldıkları tarihteki derece ve kademelerine hizmet olarak sayılacak sürenin her üç yılına bir derece ve her yılına bir kademe verilmek ve öğrenim durumları itibarıyla 657 sayılı Devlet Memurları Kanununun 36 ncı maddesindeki yükselebilecekleri dereceleri geçmemek üzere tespit edilecek derece ve kademeleriyle başvuru tarihinde uygulanmakta olan katsayılar esas alınarak belirlenecek emekli keseneğine esas aylık tutarlarının %45'i üzerinden Kurum tarafından hesaplanarak halen çalıştıkları veya kamu görevlisi olarak en son çalışmış oldukları kamu idarelerine bildirilir ve söz konusu tutarlar bu idareler tarafından üç ay içerisinde Kuruma defaten ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Haklarında verilmiş disiplin cezaları bütün sonuçları ile 5525 sayılı Kanun uyarınca ortadan kaldırılmış olanlardan memuriyetten çıkarılmış oldukları kuruma yeniden atanmak üzere başvuranların, bu başvurularının ilgili kurumların kayıtlarına geçtiği tarihten başlayarak bu kurumlarda yapılan ilk atamalarının kendilerine tebliği tarihine kadar olan dönem içerisindeki uzun vadeli sigorta kollarına tabi olarak sigorta primi ödenmemiş veya emekli keseneği yatırılmamış süreleri hakkında ise, birinci fıkra uyarınca yapılmış olan derece yükselmesi ve kademe ilerlemeleri saklı kalmak kaydıyla, yukarıdaki fıkra hükümleri çerçevesinde işlem yapılır. Ancak, bu fıkra kapsamına girenlerden ataması bu maddenin yürürlük tarihinden önce yapılmış olanların bu fıkra hükümlerinden yararlanabilmesi için, bu maddenin yürürlük tarihinden itibaren altı ay içerisinde, bu maddenin yürürlük tarihinden önce atama talebinde bulunduğu halde atama işlemleri bu maddenin yürürlüğe girdiği tarihten sonra tamamlanacakların ise, atamalarını izleyen altı ay içerisinde Kuruma başvuruda bulunmaları zorunludur.</template>

      <mvz-madde no="52" başlık="" tür="GEÇİCİ">

          <template>10/1/2013 tarihli ve 6385 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu ile Bazı Kanunlarda Değişiklik Yapılmasına Dair Kanuna göre sosyal güvenlik destek primi borçlarını yapılandıran ve yapılandırma işlemi bu maddenin yürürlüğe girdiği tarih itibarıyla devam eden borçlularca, yapılandırma süresi içinde ödenmiş tutarların Kurumun ilgili mevzuatı uyarınca mahsup edilmesinin yazılı olarak talep edilmesi hâlinde, daha önce ödenen tutarlar, sosyal güvenlik mevzuatının ilgili hükümlerine göre mahsup edildikten sonra kalan borçları bu maddeye göre peşin veya taksitler hâlinde ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi kapsamındaki sigortalılar, 60 ıncı maddesinin birinci fıkrasının (g) bendi kapsamında genel sağlık sigortalısı olanlar, ek 5 inci ve ek 6 ncı maddeleri kapsamında sigortalı olanlar, bu madde kapsamındaki borçlarını yapılandırmaları hâlinde, yapılandırılan borç haricinde altmış günden fazla prim ve prime ilişkin borçlarının bulunmaması veya altmış günden fazla prim ve prime ilişkin borçları bulunmakla birlikte bu borçlarını ilgili kanunlara göre taksitlendirmiş veya yapılandırmış olup ödeme yükümlülüklerini de yerine getiriyor olmaları ve bu maddeye göre yapılandırılan borçlarının ilk taksitini ödemeleri kaydıyla genel sağlık sigortasından yararlanmaya başlatılır.</template>

        <mvz-fıkra no="14">

        </mvz-fıkra>
        <mvz-fıkra no="15">
          <template>Bu madde kapsamına giren alacaklara karşılık bu maddenin yayımlandığı tarihten önce tahsil edilmiş olan tutarların bu madde hükümlerine dayanılarak red ve iadesi yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="16">
          <template>Bu madde kapsamında ödenmesi gereken tutarlar, il özel idareleri, belediyeler ve bunlara bağlı müstakil bütçeli ve kamu tüzel kişiliğini haiz kuruluşlarca ikişer aylık dönemler hâlinde azami otuz altı eşit taksitte, bu madde ile bu maddeyi ihdas eden Kanunun 73 üncü maddesi kapsamında ödenmesi gereken tutarlar, Gençlik ve Spor Bakanlığı, Türkiye Futbol Federasyonu ve özerk spor federasyonlarına tescil edilmiş olan ve Türkiye’de sportif alanda faaliyette bulunan spor kulüplerince ikişer aylık dönemler hâlinde azami kırk iki eşit taksitte ödenebilir. Bu takdirde bu bent hükmüne göre hesaplanacak katsayı yirmi dört eşit taksit için 1,20, otuz eşit taksit için 1,25, otuz altı eşit taksit için 1,30 ve kırk iki eşit taksit için 1,35 olarak uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="17">
          <template>Bu madde kapsamına giren alacakların; asıllarının bu maddenin yayımlandığı tarihten önce ödenmiş olması şartıyla, bu maddenin yayımlandığı tarih itibarıyla aslı ödenmiş ferî alacağın %40’ının ilk taksit ödeme süresi içinde ödenmesi hâlinde kalan %60’ının tahsilinden vazgeçilir. Aslı ödenmiş ferî alacağın %40’ının taksitle ödenmek istenmesi hâlinde ise bu maddenin dördüncü fıkrasının (e) bendine göre taksitlendirilir.</template>

        <mvz-fıkra no="18">

      <mvz-madde no="61" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>25/4/1985 tarihli ve 3182 sayılı mülga Bankalar Kanunu, mülga 4389 sayılı Kanun ve 5411 sayılı Kanun kapsamında faaliyet izni kaldırılan ve (ortaklarının temettü hariç ortaklık hakları dâhil) yönetim ve denetimi Tasarruf Mevduatı Sigorta Fonuna devredilen ya da doğrudan iflasına karar verilen bankalar ve bu bankaların; hâkim ortakları, yönetim ve denetimine sahip olduğu iştirakleri, gerçek ve tüzel kişi hâkim ortaklarının hâkim ortak olduğu şirketler ve anılan kanunlar kapsamında bankanın Fona olan borcundan sorumlu tutulan kişiler hariç olmak üzere, bu maddenin yürürlüğe girdiği tarih itibarıyla haklarında 2004 sayılı İcra ve İflas Kanunu hükümlerine göre iflas kararı verilmiş ve işlemleri devam eden, iflas tasfiyesi sonuçlanmış olan şirketlerin borçlarından, 506 sayılı Kanunun mülga 80 inci ve bu Kanunun 88 inci maddesi çerçevesinde müşterek ve müteselsil sorumluluğu bulunanlardan şirket yönetim organlarında görev almayan ve sermaye sahibi olmayan kanuni temsilciler ve üst düzey yönetici veya yetkilileri hakkında Kurum alacaklarından dolayı Kurumca 6183 sayılı Kanun hükümlerine göre icra takibi başlatılmış olsun veya olmasın ilgili mevzuata ilişkin müşterek ve müteselsil sorumlulukları sona erer, yapılan takipler sonlandırılır ve bu kişiler hakkında uygulanan hacizler kaldırılır. Haklarında icra takibi başlatılmış olanlardan, bu işlemlere karşı dava açmış olanların bu madde hükmünden yararlanabilmeleri için bu davalarından feragat etmeleri şarttır. Bu maddenin yürürlüğe girdiği tarihten önce ilgililerin şahsi mal varlıklarından tahsil edilmiş olan tutarlar ret ve iade edilmez.</template>

      <mvz-madde no="63" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Kendi adına ve hesabına bağımsız çalışanlarla tarımda kendi adına ve hesabına bağımsız çalışanlardan, Kuruma kayıt ve tescilleri yapıldığı hâlde, bu maddenin yayımlandığı ayın sonu itibarıyla 12 ay ve daha fazla süreye ilişkin prim borcu bulunanların, bu sürelere ilişkin prim borçlarını, bu maddenin yürürlüğe girdiği tarihi takip eden ay başından itibaren üç ay içinde ödememeleri veya ilgili kanunları uyarınca yapılandırmamaları hâlinde, prim ödemesi bulunan sigortalıların daha önce ödedikleri primlerin tam olarak karşıladığı ayın sonu itibarıyla, prim ödemesi bulunmayan sigortalıların ise tescil tarihi itibarıyla sigortalılığı durdurulur. Durdurulan süreler sigortalılık süresi olarak değerlendirilmez ve bu sürelere ilişkin Kurum alacakları takip edilmeyerek bunlara Kurum alacakları arasında yer verilmez. Sigortalılıkları durdurulanlardan bu Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi kapsamında çalışmaya devam edenlerin sigortalılıkları bu maddenin yayım tarihini takip eden ay başı itibarıyla yeniden başlatılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, daha sonra sigortalı ya da hak sahipleri tarafından talep edilmesi hâlinde durdurulan sigortalılık sürelerinin tamamı, talep tarihinde 80 inci maddenin ikinci fıkrasına göre belirlenecek prime esas kazanç tutarı üzerinden borç tutarı hesaplanarak ihya edilir. Hesaplanan borç tutarının tamamını, borcun tebliğ tarihinden itibaren üç ay içinde ödedikleri takdirde, bu süreler sigortalılık süresi olarak değerlendirilir. Tebliğ edilen borç tutarının bu süre içinde tamamen ödenmemesi hâlinde bu süreler sigortalılık süresi olarak değerlendirilmez ve bu madde kapsamında ödenmiş olan tutarlar ilgilinin prim ve prime ilişkin borcunun bulunmaması kaydıyla faizsiz olarak iade edilir. İhya edilerek kazanılan hizmet süreleri borcun ödendiği tarihten itibaren geçerli sayılır.</template>

          <template>İşverenlerin ve/veya üçüncü şahısların, 31/12/2014 tarihine kadar (bu tarih dâhil) bu Kanunun 14 üncü, 21 inci, 23 üncü, 39 uncu ve 76 ncı maddeleri, 506 sayılı Kanunun mülga 10 uncu, 26 ncı, 27 nci, 28 inci ve 39 uncu maddeleri, 1479 sayılı Kanunun mülga 63 üncü maddesi ve 5434 sayılı Kanunun mülga 129 uncu maddesi gereğince iş kazası ve meslek hastalığı, hastalık, malullük, adi malullük ve ölüm hâlleri ile sigortalıya, genel sağlık sigortalısına veya bunların bakmakla yükümlü olduğu kişilere yönelik fiiller nedeniyle, kesinleşmiş mahkeme kararı sonucu ödemekle yükümlü bulundukları her türlü borçlarına, kanuni faiz uygulanan sürenin başlangıcından bu maddenin yayımlandığı tarihe kadar geçen süre için Yİ-ÜFE aylık değişim oranları esas alınarak hesaplanacak tutarın, bu maddede belirtilen şekilde ve süre içinde ödenmesi hâlinde bu borçlara uygulanan kanuni faizin tahsilinden vazgeçilir.</template>

        <mvz-fıkra no="2">

        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>4/6/1985 tarihli ve 3213 sayılı Maden Kanununun ek 9 uncu maddesi uyarınca ücretleri asgari ücretin iki katından az olamayacağı hükme bağlanan “Linyit” ve “Taşkömürü” çıkarılan işyerlerinde yer altında çalışan sigortalılar için birinci fıkranın uygulanmasında (a) bendinde belirtilen 85 TL günlük kazanç iki kat olarak ve 2015 yılının aynı ayına ilişkin Kuruma verilen aylık prim ve hizmet belgelerinde bildirilen prim ödeme gün sayısının yüzde 50’sini geçmemek üzere, 2016 yılında cari aya ilişkin verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısı dikkate alınır.</template>
