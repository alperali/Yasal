          <template>Bu maddenin yürürlük tarihinden önce ilgili kanunlarına göre gelir veya aylık bağlanan hak sahibi çocuklardan 18 yaşını, lise ve dengi öğrenim görmesi halinde 20 yaşını, yükseköğrenim yapması halinde 25 yaşını doldurmayanların bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında sigortalı sayılmaları, ödenmekte olan gelir ve aylıkların kesilmesini gerektirmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu maddenin yürürlük tarihinden önce çalışmaları nedeniyle ilgili kanunlarına göre gelir veya aylıkları kesilen ve bu Kanunun 34 üncü maddesinin birinci fıkrasının son cümlesinde belirtilen şartları taşıyanlardan, gelir veya aylık bağlanması için yazılı istekte bulunanların gelir ve aylıkları, bu maddenin yürürlüğe girdiği tarihi takip eden aybaşından itibaren başlatılır ve bağlanan gelir ve aylıklar için geriye yönelik herhangi bir ödeme yapılmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="75" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında haklarında uzun vadeli sigorta kolları hükümleri uygulanan sigortalıları çalıştıran işverenlerce;</template>
          <mvz-bent no="a">
            <template>2017 yılının aynı ayına ilişkin Kuruma verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde prime esas günlük kazancı Bakanlar Kurulunca belirlenen tutar ve altında bildirilen sigortalıların toplam prim ödeme gün sayısını geçmemek üzere, 2018 yılında cari aya ilişkin verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısının,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>2018 yılı içinde ilk defa bu Kanun kapsamına alınan işyerlerinden bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısının,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>2018 yılı Ocak ila Eylül ayları/dönemleri için Bakanlar Kurulunca tespit edilen günlük tutar ile çarpımı sonucu bulunacak tutar, bu işverenlerin Kuruma ödeyecekleri sigorta primlerinden mahsup edilir ve bu tutar İşsizlik Sigortası Fonundan karşılanır. Ancak (a) bendinin uygulanmasında Bakanlar Kurulunca belirlenecek prime esas günlük kazancı 18/10/2012 tarihli ve 6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu hükümleri uyarınca toplu iş sözleşmesi uygulanan özel sektör işverenlerine ait işyerleri için ayrıca tespit edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mevcut bir işletmenin kapatılarak değişik bir ad, unvan ya da bir iş birimi olarak açılması veya yönetim ve kontrolü elinde bulunduracak şekilde doğrudan veya dolaylı ortaklık ilişkisi bulunan şirketler arasında istihdamın kaydırılması, şahıs işletmelerinde işletme sahipliğinin değiştirilmesi gibi İşsizlik Sigortası Fonu katkısından yararlanmak amacıyla muvazaalı işlem tesis ettiği anlaşılan veya sigortalıların prime esas kazançlarını 2018 yılı Ocak ila Eylül ayları/dönemleri için eksik bildirdiği tespit edilen işyerlerinden İşsizlik Sigortası Fonunca karşılanan tutar gecikme cezası ve gecikme zammıyla birlikte geri alınır ve bu işyerleri hakkında bu madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İşverenlerin çalıştırdıkları sigortalılarla ilgili 2018 yılı Ocak ila Eylül aylarına/dönemlerine ait aylık prim ve hizmet belgelerini veya muhtasar ve prim hizmet beyannamelerini yasal süresi içerisinde vermediği, sigorta primlerini yasal süresinde ödemediği, denetim ve kontrolle görevli memurlarca yapılan soruşturma ve incelemelerde çalıştırdığı kişileri sigortalı olarak bildirmediği veya bildirilen sigortalının fiilen çalışmadığı durumlarının tespit edilmesi, Kuruma prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borcu bulunması hâllerinde bu maddenin birinci fıkrasının (b) bendine ilişkin hükümler uygulanmaz. Ancak Kuruma olan prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borçlarını 6183 sayılı Kanunun 48 inci maddesine göre tecil ve taksitlendiren işverenler bu tecil ve taksitlendirme devam ettiği sürece anılan fıkra hükmünden yararlandırılır. Bu maddenin uygulanmasında bu Kanunun ek 14 üncü maddesi hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birinci fıkranın (a) bendinin uygulanmasında, bir önceki yılın aynı ayına ilişkin olarak aylık prim ve hizmet belgesi veya muhtasar ve prim hizmet beyannamesi verilmemiş olması halinde bildirim yapılmış takip eden ilk aya ilişkin aylık prim ve hizmet belgesindeki veya muhtasar ve prim hizmet beyannamesindeki bildirimler esas alınır. 2017 yılından önce bu Kanun kapsamına alınmış ancak 2017 yılında sigortalı çalıştırmamış işyerleri hakkında birinci fıkranın (b) bendi hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sigortalı ve işveren hisselerine ait sigorta primlerinin Devlet tarafından karşılandığı durumlarda işverenin ödeyeceği sigorta priminin İşsizlik Sigortası Fonunca karşılanacak tutardan az olması hâlinde sadece sigorta prim borcu kadar mahsup işlemi yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>3213 sayılı Kanunun ek 9 uncu maddesi uyarınca ücretleri asgarî ücretin iki katından az olamayacağı hükme bağlanan “Linyit” ve “Taşkömürü” çıkarılan işyerlerinde yer altında çalışan sigortalılar için birinci fıkranın uygulanmasında (a) bendi uyarınca belirlenecek günlük kazanç iki kat olarak ve 2017 yılının aynı ayına ilişkin Kuruma verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen prim ödeme gün sayısının yüzde 50’sini geçmemek üzere, 2018 yılında cari aya ilişkin verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısı dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu madde hükümleri, 5018 sayılı Kanuna ekli (I) sayılı cetvelde sayılan kamu idarelerine ait kadro ve pozisyonlarda 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında çalışan sigortalılar için uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>4734 sayılı Kanunun 2 nci maddesinin birinci fıkrasının (a), (b), (c) ve (d) bentlerinde sayılan idareler tarafından ilgili mevzuatı uyarınca yapılan ve sözleşmesinde fiyat farkı ödeneceği öngörülen hizmet alımlarında, ihale dokümanında personel sayısının belirlendiği ve haftalık çalışma saatinin tamamının idarede kullanılmasının öngörüldüğü işçilikler için birinci fıkra uyarınca İşsizlik Sigortası Fonu tarafından karşılanacak tutarlar bu idarelerce işverenlerin hak edişinden kesilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>2018 yılı Ocak ila Eylül aylarına/dönemlerine ilişkin yasal süresi dışında Kuruma verilen aylık prim ve hizmet belgelerinde veya Maliye Bakanlığına verilecek muhtasar ve prim hizmet beyannamelerinde kayıtlı sigortalılar için bu madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Çalışma ve Sosyal Güvenlik Bakanlığı ve Türkiye İş Kurumunun görüşleri alınmak suretiyle Kurum tarafından belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="76" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Köy ve mahalle muhtarları, kendi adına ve hesabına bağımsız çalışanlarla tarımda kendi adına ve hesabına bağımsız çalışanlardan, Kuruma kayıt ve tescilleri yapıldığı hâlde, 31/5/2018 tarihi itibarıyla prim borcu bulunanların, bu tarihten önceki sürelere ilişkin prim borçlarını, bu maddenin yürürlüğe girdiği tarihi takip eden ikinci ayın sonuna kadar ödememeleri veya ilgili Kanunları uyarınca yapılandırmamaları halinde, prim ödemesi bulunan sigortalıların daha önce ödedikleri primlerin tam olarak karşıladığı ayın sonu itibarıyla, prim ödemesi bulunmayan sigortalıların ise tescil tarihi itibarıyla sigortalılığı durdurulur. Durdurulan süreler sigortalılık süresi olarak değerlendirilmez ve bu sürelere ilişkin Kurum alacakları takip edilmeyerek bunlara Kurum alacakları arasında yer verilmez. Sigortalılıkları durdurulanlardan bu Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi kapsamında çalışmaya devam edenlerin sigortalılıkları 1/6/2018 tarihi itibarıyla yeniden başlatılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, daha sonra sigortalı ya da hak sahipleri tarafından talep edilmesi hâlinde durdurulan sigortalılık sürelerinin tamamı, talep tarihinde 80 inci maddenin ikinci fıkrasına göre belirlenecek prime esas kazanç tutarı üzerinden borç tutarı hesaplanarak ihya edilir. Hesaplanan borç tutarının tamamını, borcun tebliğ tarihinden itibaren üç ay içinde ödedikleri takdirde, bu süreler sigortalılık süresi olarak değerlendirilir. Tebliğ edilen borç tutarının bu süre içinde tamamen ödenmemesi hâlinde bu süreler sigortalılık süresi olarak değerlendirilmez ve bu madde kapsamında ödenmiş olan tutarlar ilgilinin prim ve prime ilişkin borcunun bulunmaması kaydıyla faizsiz olarak iade edilir. İhya edilerek kazanılan hizmet süreleri borcun ödendiği tarihten itibaren geçerli sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci fıkraya göre sigortalılıkları durdurulanlar ile bunların bakmakla yükümlü olduğu kişiler hakkında 1/1/2012 tarihinden bu maddenin yürürlük tarihine kadar durdurulan süreler için genel sağlık sigortası hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sigortalılıkları önceki kanunlara göre durdurulanlar için de bu maddenin ikinci fıkrası hükmü uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">

        </mvz-fıkra>

        <mvz-fıkra no="2">

        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddenin yürürlüğe girdiği tarihe kadar ek 15 inci maddenin ikinci ve beşinci fıkraları uyarınca yapılacak ödemelerde 89 uncu maddeye göre gecikme zammı ve cezası ile 102 nci maddeye göre idari para cezası uygulanmaz. Bu maddenin yürürlüğe girdiği tarihe kadar ödenmiş olan gecikme cezaları, gecikme zamları ve idari para cezaları iade ve mahsup edilmez.</template>
        </mvz-fıkra>

      <mvz-madde no="80" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>4 üncü maddenin birinci fıkrasının (a) bendi kapsamında haklarında uzun vadeli sigorta kolları hükümleri uygulanan sigortalıları çalıştıran işverenlerce;</template>
          <mvz-bent no="a">
            <template>2019 yılının aynı ayına ilişkin Kuruma verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde prime esas günlük kazancı 128 Türk lirası ve altında bildirilen sigortalıların toplam prim ödeme gün sayısını geçmemek üzere, 2020 yılında cari aya ilişkin verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısının,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>2020 yılı içinde ilk defa bu Kanun kapsamına alınan iş yerlerinden bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısının,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>2020 yılı Ocak ila Aralık ayları/dönemi için günlük 2,50 Türk lirası ile çarpımı sonucu bulunacak tutar, bu işverenlerin Kuruma ödeyecekleri sigorta primlerinden mahsup edilir ve bu tutar İşsizlik Sigortası Fonundan karşılanır. Ancak (a) bendinde belirtilen prime esas günlük kazanç tutarı 6356 sayılı Kanun hükümleri uyarınca toplu iş sözleşmesine tabi özel sektör işverenlerine ait iş yerleri için 256 Türk lirası olarak esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu madde kapsamında destekten yararlanılacak ayda/dönemde, 2019 yılı Ocak ila Kasım ayları/döneminde aylık prim ve hizmet belgesi veya muhtasar ve prim hizmet beyannamesi ile 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında uzun vadeli sigorta kollarından en az sigortalı bildirimi yapılan aydaki/dönemdeki sigortalı sayısının altında bildirimde bulunulması halinde bu madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mevcut bir işletmenin kapatılarak değişik bir ad ve unvan altında ya da bir iş birimi olarak açılması veya yönetim ve kontrolü elinde bulunduracak şekilde doğrudan veya dolaylı ortaklık ilişkisi bulunan şirketler arasında istihdamın kaydırılması, şahıs işletmelerinde işletme sahipliğinin değiştirilmesi gibi İşsizlik Sigortası Fonu katkısından yararlanmak amacıyla muvazaalı işlem tesis ettiği anlaşılan veya sigortalıların prime esas kazançlarını 2020 yılı Ocak ila Aralık ayları/dönemi için eksik bildirdiği tespit edilen iş yerlerinden İşsizlik Sigortası Fonunca karşılanan tutar, gecikme cezası ve gecikme zammıyla birlikte geri alınır ve bu iş yerleri hakkında bu madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İşverenlerin çalıştırdıkları sigortalılarla ilgili 2020 yılı Ocak ila Aralık aylarına/dönemine ait aylık prim ve hizmet belgelerini veya muhtasar ve prim hizmet beyannamelerini yasal süresi içerisinde vermediğinin, sigorta primlerini yasal süresinde ödemediğinin, denetim ve kontrolle görevli memurlarca yapılan soruşturma ve incelemelerde çalıştırdığı kişileri sigortalı olarak bildirmediğinin veya bildirilen sigortalının fiilen çalışmadığının tespit edilmesi, Kuruma prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borcu bulunması hâllerinde birinci fıkranın (b) bendine ilişkin hükümler uygulanmaz. Ancak Kuruma olan prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borçlarını 6183 sayılı Kanunun 48 inci maddesine göre tecil ettiren ve taksitlendiren işverenler bu tecil ve taksitlendirme devam ettiği sürece anılan fıkra hükmünden yararlandırılır. Bu maddenin uygulanmasında ek 14 üncü madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Birinci fıkranın (a) bendinin uygulanmasında, bir önceki yılın aynı ayına ilişkin olarak aylık prim ve hizmet belgesi veya muhtasar ve prim hizmet beyannamesi verilmemiş olması halinde bildirim yapılmış takip eden ilk aya ilişkin aylık prim ve hizmet belgesindeki veya muhtasar ve prim hizmet beyannamesindeki bildirimler esas alınır. 2019 yılından önce bu Kanun kapsamına alınmış ancak 2019 yılında sigortalı çalıştırmamış iş yerleri hakkında birinci fıkranın (b) bendi hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Sigortalı ve işveren hisselerine ait sigorta primlerinin Devlet tarafından karşılandığı durumlarda işverenin ödeyeceği sigorta priminin İşsizlik Sigortası Fonunca karşılanacak tutardan az olması hâlinde sadece sigorta prim borcu kadar mahsup işlemi yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>3213 sayılı Kanunun ek 9 uncu maddesi uyarınca ücretleri asgari ücretin iki katından az olamayacağı hükme bağlanan “Linyit” ve “Taşkömürü” çıkarılan iş yerlerinde yer altında çalışan sigortalılar için birinci fıkranın uygulanmasında (a) bendi uyarınca belirlenecek günlük kazanç 341 Türk lirası olarak ve 2019 yılının aynı ayına ilişkin Kuruma verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen prim ödeme gün sayısının yüzde 50’sini geçmemek üzere, 2020 yılında cari aya ilişkin verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısı dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Bu madde hükümleri, 5018 sayılı Kanuna ekli (I) sayılı cetvelde sayılan kamu idarelerine ait kadro ve pozisyonlarda 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında çalışan sigortalılar için uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>4734 sayılı Kanunun 2 nci maddesinin birinci fıkrasının (a), (b), (c) ve (d) bentlerinde sayılan idareler tarafından ilgili mevzuatı uyarınca yapılan ve sözleşmesinde fiyat farkı ödeneceği öngörülen hizmet alımlarında, ihale dokümanında personel sayısının belirlendiği ve haftalık çalışma saatinin tamamının idarede kullanılmasının öngörüldüğü işçilikler için birinci fıkra uyarınca İşsizlik Sigortası Fonu tarafından karşılanacak tutarlar bu idarelerce işverenlerin hak edişinden kesilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>2020 yılı Ocak ila Aralık aylarına/dönemine ilişkin yasal süresi dışında Kuruma verilen aylık prim ve hizmet belgelerinde veya Hazine ve Maliye Bakanlığına verilecek muhtasar ve prim hizmet beyannamelerinde kayıtlı sigortalılar için bu madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Aile, Çalışma ve Sosyal Hizmetler Bakanlığı ve Türkiye İş Kurumunun görüşleri alınmak suretiyle Kurum tarafından belirlenir.</template>
        </mvz-fıkra>

        <mvz-fıkra no="1">
          <template>Bu maddenin yürürlüğe girdiği tarihten önce 2330 sayılı Kanuna veya 2330 sayılı Kanun hükümleri uygulanarak aylık bağlanmasını gerektiren kanunlara göre aylık bağlanan malûller ile 5434 sayılı Kanunun 56 ncı ve mülga 64 üncü maddesi kapsamında aylık bağlanan vazife ve harp malûllerinden, 2330 sayılı Kanunun 4 üncü maddesinin ikinci fıkrasının üçüncü, dördüncü, beşinci ve altıncı cümlelerine aykırı olacak şekilde yaşlılık veya malûllük aylığı bağlanmış olanlardan, tahsis talep tarihi itibarıyla ilgili kanunlarında öngörülen aylık bağlama koşullarından prim ödeme gün sayısı veya sigortalılık süresi şartının sigortalıların kasıtlı veya kusurlu davranışlarından kaynaklanmayan nedenlerle sağlanmadığı daha sonra anlaşılanların, aylık aldıkları süre herhangi bir şekilde prim talep edilmeksizin prim ödeme gün sayısı olarak dikkate alınır. Ancak;</template>
          <mvz-bent no="a">
            <template>Aylık aldıkları süre, eksik hizmet süresinden fazla olanlar için, yalnızca eksik hizmet süresinin tamamlanacağı tarihe kadarki süre kullanılır. Bu kapsamda olanlar için yeni bir aylık hesabı yapılmaksızın, maddenin yürürlük tarihini takip eden ay başından itibaren kesilmiş olan aylıkları, aylıklara uygulanan artış oranları kadar artırılarak yeniden bağlanır.</template>

      <mvz-madde no="83" başlık="" tür="GEÇİCİ">

          <template>Mevcut bir işletmenin kapatılarak değişik bir ad ve unvan altında ya da bir iş birimi olarak açılması veya yönetim ve kontrolü elinde bulunduracak şekilde doğrudan veya dolaylı ortaklık ilişkisi bulunan şirketler arasında istihdamın kaydırılması, şahıs işletmelerinde işletme sahipliğinin değiştirilmesi gibi İşsizlik Sigortası Fonu katkısından yararlanmak amacıyla muvazaalı işlem tesis ettiği anlaşılan veya sigortalıların prime esas kazançlarını 2023 yılı Ocak ilâ Haziran ayları/dönemi için Kuruma bildirmediği veya eksik bildirdiği tespit edilen işyerlerinden İşsizlik Sigortası Fonunca karşılanan tutar, gecikme cezası ve gecikme zammıyla birlikte geri alınır ve bu işyerleri hakkında bu madde hükümleri uygulanmaz. Ancak, ilgili ayda 2023 yılı Ocak ilâ Haziran aylarına/dönemine ait aylık brüt asgarî ücretin onda birini geçmeyecek tutarda eksik prime esas kazanç bildirimi yapıldığının tespiti durumunda Kurumca yapılacak ihtar üzerine on beş günlük süre içinde söz konusu eksikliği gideren işyerleri hakkında bu madde hükümleri uygulanmaya devam eder.</template>

          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Bakanlık ile Hazine ve Maliye Bakanlığı tarafından müştereken belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="109" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>4 üncü maddenin birinci fıkrasının (a) bendi kapsamında haklarında uzun vadeli sigorta kolları hükümleri uygulanan sigortalıları çalıştıran işverenlerce;</template>
          <mvz-bent no="a">
            <template>2024 yılının aynı ayına ilişkin Kuruma verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde prime esas günlük kazancı 1.000 Türk lirası ve altında bildirilen sigortalıların toplam prim ödeme gün sayısını geçmemek üzere, 2025 yılında cari aya ilişkin verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısının,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>2025 yılı içinde ilk defa bu Kanun kapsamına alınan işyerlerinden bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısının,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>2025 yılı Ocak ila Aralık ayları/dönemi için günlük 33,33 Türk lirası ile çarpımı sonucu bulunacak tutar, bu işverenlerin Kuruma ödeyecekleri sigorta primlerinden mahsup edilir ve bu tutar İşsizlik Sigortası Fonundan karşılanır. Ancak (a) bendinde belirtilen prime esas günlük kazanç tutarı, 6356 sayılı Kanun hükümleri uyarınca toplu iş sözleşmesine tabi özel sektör işverenlerine ait işyerleri için 2.000 Türk lirası olarak esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu madde kapsamında destekten yararlanılacak ayda/dönemde, 2024 yılı Ocak ila Aralık aylarında/döneminde aylık prim ve hizmet belgesi veya muhtasar ve prim hizmet beyannamesi ile 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında uzun vadeli sigorta kollarından en az sigortalı bildirimi yapılan aydaki/dönemdeki sigortalı sayısının altında bildirimde bulunulması hâlinde bu madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mevcut bir işletmenin kapatılarak değişik bir ad ve unvan altında ya da bir iş birimi olarak açılması veya yönetim ve kontrolü elinde bulunduracak şekilde doğrudan veya dolaylı ortaklık ilişkisi bulunan şirketler arasında istihdamın kaydırılması, şahıs işletmelerinde işletme sahipliğinin değiştirilmesi gibi İşsizlik Sigortası Fonu katkısından yararlanmak amacıyla muvazaalı işlem tesis ettiği anlaşılan veya sigortalıların prime esas kazançlarını 2025 yılı Ocak ila Aralık ayları/dönemi için Kuruma bildirmediği veya eksik bildirdiği tespit edilen işyerlerinden İşsizlik Sigortası Fonunca karşılanan tutar, gecikme cezası ve gecikme zammıyla birlikte geri alınır ve bu işyerleri hakkında bu madde hükümleri uygulanmaz. Ancak, ilgili ayda 2025 yılı Ocak ila Aralık aylarına/dönemine ait aylık brüt asgari ücretin onda birini geçmeyecek tutarda eksik prime esas kazanç bildirimi yapıldığının tespiti durumunda Kurumca yapılacak ihtar üzerine on beş günlük süre içinde söz konusu eksikliği gideren işyerleri hakkında bu madde hükümleri uygulanmaya devam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İşyerinde çalıştırılan sigortalılarla ilgili 2025 yılı Ocak ila Aralık aylarına/dönemine ait aylık prim ve hizmet belgelerinin veya muhtasar ve prim hizmet beyannamelerinin yasal süresi içinde verilmediği, sigorta primlerinin yasal süresinde ödenmediği, denetim ve kontrolle görevli memurlarca yapılan soruşturma ve incelemelerde; çalıştırılan kişilerin sigortalı olarak bildirilmediği veya bildirilen sigortalının fiilen çalıştırılmadığı durumlarının tespit edilmesi, Kuruma prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borcunun bulunması hâllerinde bu maddeye ilişkin hükümler uygulanmaz. Ancak Kuruma olan prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borçlarını 6183 sayılı Kanunun 48 inci maddesine göre tecil ve taksitlendiren ya da ilgili diğer kanunlar uyarınca yapılandıran işverenler bu tecil ve taksitlendirme veya yapılandırma devam ettiği sürece bu madde hükümlerinden yararlandırılır. Bu maddenin uygulanmasında bu Kanunun ek 14 üncü maddesi hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Birinci fıkranın (a) bendinin uygulanmasında, bir önceki yılın aynı ayına ilişkin olarak aylık prim ve hizmet belgesi veya muhtasar ve prim hizmet beyannamesi verilmemiş olması hâlinde bildirim yapılmış takip eden ilk aya ilişkin aylık prim ve hizmet belgesindeki veya muhtasar ve prim hizmet beyannamesindeki bildirimler esas alınır. 2025 yılından önce bu Kanun kapsamına alınmış ancak 2024 yılında sigortalı çalıştırmamış işyerleri hakkında birinci fıkranın (b) bendi hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Sigortalı ve işveren hisselerine ait sigorta primlerinin Devlet tarafından karşılandığı durumlarda işverenin ödeyeceği sigorta priminin İşsizlik Sigortası Fonunca karşılanacak tutardan az olması hâlinde sadece sigorta prim borcu kadar mahsup işlemi yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>3213 sayılı Kanunun ek 9 uncu maddesi uyarınca ücretleri asgari ücretin iki katından az olamayacağı hükme bağlanan “Linyit” ve “Taşkömürü” çıkarılan işyerlerinde yer altında çalışan sigortalılar için birinci fıkranın uygulanmasında (a) bendi uyarınca belirlenecek günlük kazanç 2.667 Türk lirası olarak ve 2024 yılının aynı ayına ilişkin Kuruma verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen prim ödeme gün sayısının bir buçuk katını geçmemek üzere, 2025 yılında cari aya ilişkin verilen aylık prim ve hizmet belgelerinde veya muhtasar ve prim hizmet beyannamelerinde bildirilen sigortalılara ilişkin toplam prim ödeme gün sayısı dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Bu madde hükümleri, 5335 sayılı Kanunun 30 uncu maddesinin ikinci fıkrası kapsamına giren kurum ve kuruluşlara ait işyerleri için uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>4734 sayılı Kanunun 2 nci maddesinin birinci fıkrasının (a), (b), (c) ve (d) bentlerinde sayılan idareler tarafından ilgili mevzuatı uyarınca yapılan ve sözleşmesinde fiyat farkı ödeneceği öngörülen hizmet alımlarında, ihale dokümanında personel sayısının belirlendiği ve haftalık çalışma saatinin tamamının idarede kullanılmasının öngörüldüğü işçilikler için bu maddenin birinci fıkrası uyarınca İşsizlik Sigortası Fonu tarafından karşılanacak tutarlar bu idarelerce işverenlerin hak edişinden kesilerek Türkiye İş Kurumuna iade edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Çalışma ve Sosyal Güvenlik Bakanlığı ve Türkiye İş Kurumunun görüşleri alınmak suretiyle Kurum tarafından belirlenir.</template>
