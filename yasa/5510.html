  <mvz-künye tür="kanun" no="5510 " başlık="SOSYAL SİGORTALAR VE GENEL SAĞLIK SİGORTASI KANUNU"
             tarih="31/6/2006" rgazete-tarih="16/6/2006" rgazete-sayı="26200"
             düstur-tertip="5" düstur-cilt="45" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, sosyal sigortalar ile genel sağlık sigortası bakımından kişileri güvence altına almak; bu sigortalardan yararlanacak kişileri ve sağlanacak hakları, bu haklardan yararlanma şartları ile finansman ve karşılanma yöntemlerini belirlemek; sosyal sigortaların ve genel sağlık sigortasının işleyişi ile ilgili usûl ve esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun; sosyal sigortalar ile genel sağlık sigortasından yararlanacak kişileri, işverenleri, sağlık hizmeti sunucularını, bu Kanunun uygulanması bakımından gerçek kişiler ile her türlü kamu ve özel hukuk tüzel kişilerini ve tüzel kişiliği olmayan diğer kurum ve kuruluşları kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template><em>Bu Kanunun uygulanmasında;</em></template>
        <mvz-bent no="1">
          <template>Bakanlık: Çalışma ve Sosyal Güvenlik Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="2">
          <template>Kurum: Sosyal Güvenlik Kurumu Başkanlığını,</template>
        </mvz-bent>
        <mvz-bent no="3">
          <template>Sosyal sigortalar: Kısa ve uzun vadeli sigorta kollarını,</template>
        </mvz-bent>
        <mvz-bent no="4">
          <template>Kısa vadeli sigorta kolları: İş kazası ve meslek hastalığı, hastalık ve analık sigortası kollarını,</template>
        </mvz-bent>
        <mvz-bent no="5">
          <template>Uzun vadeli sigorta kolları: Malûllük, yaşlılık ve ölüm sigortası kollarını,</template>
        </mvz-bent>
        <mvz-bent no="6">
          <template>Sigortalı: Kısa ve/veya uzun vadeli sigorta kolları bakımından adına prim ödenmesi gereken veya kendi adına prim ödemesi gereken kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="7">
          <template>Hak sahibi: Sigortalının veya sürekli iş göremezlik geliri ile malûllük, vazife malûllüğü veya yaşlılık aylığı almakta olanların ölümü halinde, gelir veya aylık bağlanmasına veya toptan ödeme yapılmasına hak kazanan eş, çocuk, ana ve babasını,</template>
        </mvz-bent>
        <mvz-bent no="8">
          <template>Genel sağlık sigortası: Kişilerin öncelikle sağlıklarının korunmasını, sağlık riskleri ile karşılaşmaları halinde ise oluşan harcamaların finansmanını sağlayan sigortayı,</template>
        </mvz-bent>
        <mvz-bent no="9">
          <template>Genel sağlık sigortalısı: Bu Kanunun 60 ıncı maddesinde sayılan kişileri,</template>
        </mvz-bent>
        <mvz-bent no="10">
          <template>Bakmakla yükümlü olduğu kişi: 5 inci maddenin birinci fıkrasının (b) bendi ile 60 ıncı maddenin birinci fıkrasının (c) bendinin (1), (2) ve (7) numaralı alt bentleri ile yedinci ve sekizinci fıkraları ile onikinci fıkrasındaki askeri öğrenci adayları ile Jandarma ve Sahil Güvenlik Akademisi öğrenci adayları dışında kalan genel sağlık sigortalısının, sigortalı sayılmayan veya isteğe bağlı sigortalı olmayan, kendi sigortalılığı nedeniyle gelir veya aylık bağlanmamış olan;</template>
          <mvz-altbent no="a">
            <template>Eşini,</template>
          </mvz-altbent>
          <mvz-altbent no="b">
            <template>18 yaşını, lise ve dengi öğrenim veya 5/6/1986 tarihli ve 3308 sayılı Meslekî Eğitim Kanununda belirtilen aday çıraklık ve çıraklık eğitimi ile işletmelerde meslekî eğitim görmesi halinde 20 yaşını, yüksek öğrenim görmesi halinde 25 yaşını doldurmamış ve evli olmayan çocukları ile yaşına bakılmaksızın bu Kanuna göre malûl olduğu tespit edilen evli olmayan çocuklarını,</template>
          </mvz-altbent>
          <mvz-altbent no="c">
            <template>Geçiminin genel sağlık sigortalısı tarafından sağlandığı Kurumca belirlenen kriterlere göre tespit edilen ana ve babasını,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="11">
          <template>Hizmet akdi: 22/4/1926 tarihli ve 818 sayılı Borçlar Kanununda tanımlanan hizmet akdini ve iş mevzuatında tanımlanan iş sözleşmesini veya hizmet akdini,</template>
        </mvz-bent>
        <mvz-bent no="12">
          <template>Ücret: 4 üncü maddenin birinci fıkrasının (a) ve (c) bendi kapsamında sigortalı sayılanlara saatlik, günlük, haftalık, aylık veya yıllık olarak para ile ödenen ve süreklilik niteliği taşıyan brüt tutarı,</template>
        </mvz-bent>
        <mvz-bent no="13">
          <template>Asgarî ücret: 22/5/2003 tarihli ve 4857 sayılı İş Kanunu gereğince 16 yaşından büyük işçiler için belirlenen bir aylık brüt ücreti,</template>
        </mvz-bent>
        <mvz-bent no="14">
          <template>Ay: Ücretleri; her ayın 15'inde ödenen 4 üncü maddenin birinci fıkrasının (a) ve (c) bentleri kapsamındaki sigortalılar için, ayın 15'inden ertesi ayın 15'ine kadar geçen, diğer sigortalılar için ise ayın 1'i ilâ sonu arasında geçen ve otuz gün olarak değerlendirilen süreyi,</template>
        </mvz-bent>
        <mvz-bent no="15">
          <template>Yıl: Ücretleri; her ayın 15'inde ödenen 4 üncü maddenin birinci fıkrasının (a) ve (c) bentleri kapsamındaki sigortalılar için, 15 Ocak tarihinden ertesi yılın 15 Ocak tarihine kadar geçen, diğer sigortalılar için ise 1 Ocak ilâ 31 Aralık tarihleri arasında geçen ve 360 gün olarak değerlendirilen süreyi,</template>
        </mvz-bent>
        <mvz-bent no="16">
          <template>Gelir: İş kazası veya meslek hastalığı halinde sigortalıya veya sigortalının ölümü halinde hak sahiplerine, yapılan sürekli ödemeyi,</template>
        </mvz-bent>
        <mvz-bent no="17">
          <template>Aylık: Malûllük, yaşlılık ve ölüm sigortaları ile vazife malûllüğü halinde yapılan sürekli ödemeyi,</template>
        </mvz-bent>
        <mvz-bent no="18">
          <template>Ödeme dönemi: Bu Kanuna göre bağlanan gelir ve aylıkların, ödeme tarihinden takip eden ödeme tarihine kadar geçen süreyi,</template>
        </mvz-bent>
        <mvz-bent no="19">
          <template>Tarımsal faaliyet: Kendi mülkünde, ortaklık veya kiralamak suretiyle başkalarının mülkünde veya kamuya mahsus mahallerde; ekim, dikim, bakım, üretme, yetiştirme ve ıslah yoluyla yahut doğrudan doğruya tabiattan istifade etmek suretiyle bitki, orman, hayvan ve su ürünleri elde edilmesini ve/veya bu ürünlerin yetiştiricileri tarafından; muhafazasını, taşınmasını veya pazarlanmasını,</template>
        </mvz-bent>
        <mvz-bent no="20">
          <template>Kurum Sağlık Kurulu: Kurumca yetkilendirilen sağlık hizmeti sunucularının sağlık kurullarınca düzenlenecek raporlardaki teşhis ve bu teşhise dayanak teşkil eden belgeleri incelemek suretiyle, çalışma gücü kaybı ve meslekte kazanma gücü kaybı oranlarını, erken yaşlanma halini, vazifelerini yapamayacak şekilde meslekte kazanma gücü kaybını ve malûllük derecelerini belirlemeye yetkili hekimlerden ve/veya diş hekimlerinden oluşan kurulları,</template>
        </mvz-bent>
        <mvz-bent no="21">
          <template>Kamu idareleri: 10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununun 3 üncü maddesinin birinci fıkrasının (a) bendinde belirtilen kamu idareleri ve kamu iktisadi teşebbüsleri ile bunların bağlı idare, ortaklık, müessese ve işletmeleri ve yukarıda belirtilenlerin ödenmiş sermayesinin % 50’sinden fazlasına sahip oldukları ortaklık ve işletmelerden Türk Ticaret Kanununa tabi olmayanlarla özel kanunlarına göre personel çalıştıran diğer kamu kurumlarını,</template>
        </mvz-bent>
        <mvz-bent no="22">
          <template>Sağlık hizmeti: Genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilere 63 üncü madde gereği finansmanı sağlanacak tıbbî ürün ve hizmetleri,</template>
        </mvz-bent>
        <mvz-bent no="23">
          <template>Kişiye yönelik koruyucu sağlık hizmeti: Kişilerin hastalıktan korunması veya sağlıklı olma halinin sürdürülmesi amacıyla, kişiye yönelik olarak finansmanı sağlanacak sağlık hizmetlerini,</template>
        </mvz-bent>
        <mvz-bent no="24">
          <template>Aile hekimi: Sağlık Bakanlığı tarafından aile hekimi olarak yetkilendirilen ve Kurum ile sözleşme yapmış hekimleri,</template>
        </mvz-bent>
        <mvz-bent no="25">
          <template>Sağlık hizmeti sunucusu: Sağlık hizmetini sunan ve/veya üreten; gerçek kişiler ile kamu ve özel hukuk tüzel kişilerini ve bunların tüzel kişiliği olmayan şubelerini,</template>
        </mvz-bent>
        <mvz-bent no="26">
          <template>Katılım payı: Sağlık hizmetlerinden yararlanabilmek için, genel sağlık sigortalısı veya bakmakla yükümlü olduğu kişiler tarafından ödenecek tutarı,</template>
        </mvz-bent>
        <mvz-bent no="27">
          <template>Uluslararası koruma başvurusu veya statüsü sahibi ve vatansız kişi: İçişleri Bakanlığı tarafından başvuru sahibi, mülteci, ikincil koruma veya şartlı mülteci statüsü sahibi veya vatansız olarak tanınan kişileri,</template>
        </mvz-bent>
        <mvz-bent no="28">
          <template>Peşin sermaye değeri: Kurumca, bu Kanunun ilgili maddelerinde belirtilen giderlerin yaş, kesilme ihtimali ve Kurumca belirlenecek iskonto oranı dikkate alınarak hesaplanan tutarı,</template>
        </mvz-bent>
        <mvz-bent no="29">
          <template>Güncelleme katsayısı: Her yılın Aralık ayına göre Türkiye İstatistik Kurumu tarafından açıklanan en son temel yıllı tüketici fiyatları genel indeksindeki değişim oranının % 100’ü ile sabit fiyatlarla gayri safi yurtiçi hasıla gelişme hızının % 30’unun toplamına (1) tam sayısının ilâve edilmesi sonucunda bulunan değeri,</template>
        </mvz-bent>
        <mvz-bent no="30">
          <template>Vazife malûllüğü: Bu Kanunun 47 nci maddesinde tarif edilen vazife ve/veya harp malûllüğü hallerini,</template>
        </mvz-bent>
        <mvz-bent no="31">
          <template>Uluslararası sosyal güvenlik sözleşmeleri: Ülkemizin taraf olduğu sosyal güvenlik sözleşmelerini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin 29 numaralı bendinde belirtilen güncelleme katsayısının hesabında, en son temel yıllı tüketici fiyatları genel indeksindeki değişim oranı veya sabit fiyatlarla gayri safi yurtiçi hasıla gelişme hızının eksi olduğu yıllarda eksi değerler sıfır olarak alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>4857 sayılı Kanunun 13 üncü ve 14 üncü maddelerine göre kısmi süreli veya çağrı üzerine çalışanlar, ay içerisinde günün bazı saatlerinde çalışıp, çalıştığı saat karşılığında ücret alanlardan ay içerisinde otuz günden eksik prim ödeme gün sayısı bulunanlar, sigortalı çalışmama şartı hariç birinci fıkranın 10 numaralı bendinde yer verilen diğer şartları haiz olmaları kaydıyla otuz günden eksik günleri için genel sağlık sigortalısının bakmakla yükümlü olduğu kişi sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Sosyal Sigorta Hükümleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Sigortalılara İlişkin Hükümler">
      <mvz-madde no="4" başlık="Sigortalı sayılanlar">
        <mvz-fıkra no="1">
          <template>Bu Kanunun kısa ve uzun vadeli sigorta kolları uygulaması bakımından;</template>
          <mvz-bent no="a">
            <template>Hizmet akdi ile bir veya birden fazla işveren tarafından çalıştırılanlar,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Köy ve mahalle muhtarları ile hizmet akdine bağlı olmaksızın kendi adına ve hesabına bağımsız çalışanlardan ise;</template>
            <mvz-altbent no="1">
              <template>Ticarî kazanç veya serbest meslek kazancı nedeniyle gerçek veya basit usûlde gelir vergisi mükellefi olanlar,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Gelir vergisinden muaf olup, esnaf ve sanatkâr siciline kayıtlı olanlar,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Anonim şirketlerin yönetim kurulu üyesi olan ortakları, sermayesi paylara bölünmüş komandit şirketlerin komandite ortakları, diğer şirket ve donatma iştiraklerinin ise tüm ortakları,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>Tarımsal faaliyette bulunanlar,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kamu idarelerinde;</template>
            <mvz-altbent no="1">
              <template>Bu maddenin birinci fıkrasının (a) bendine tabi olmayanlardan, kadro ve pozisyonlarda sürekli olarak çalışıp ilgili kanunlarında (a) bendi kapsamına girenler gibi sigortalı olması öngörülmemiş olanlar,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Bu maddenin birinci fıkrasının (a) ve (b) bentlerine tabi olmayanlardan, sözleşmeli olarak çalışıp ilgili kanunlarında (a) bendi kapsamına girenler gibi sigortalı olması öngörülmemiş olanlar ile 657 sayılı Devlet Memurları Kanununun 86 ncı maddesi uyarınca açıktan vekil atananlar,</template>
            </mvz-altbent>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>sigortalı sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkranın (a) bendi gereği sigortalı sayılanlara ilişkin hükümler;</template>
          <mvz-bent no="a">
            <template>İşçi sendikaları ve konfederasyonları ile sendika şubelerinin başkanlıkları ve yönetim kurullarına seçilenler,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bir veya birden fazla işveren tarafından çalıştırılan; film, tiyatro, sahne, gösteri, ses ve saz sanatçıları ile müzik, resim, heykel, dekoratif ve benzeri diğer uğraşları içine alan bütün güzel sanat kollarında çalışanlar ile düşünürler ve yazarlar,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Mütekabiliyet esasına dayalı olarak uluslararası sosyal güvenlik sözleşmesi yapılmış ülke uyruğunda olanlar hariç olmak üzere, yabancı uyruklu kişilerden hizmet akdi ile çalışanlar,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>2/7/1941 tarihli ve 4081 sayılı Çiftçi Mallarının Korunması Hakkında Kanuna göre çalıştırılanlar,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>24/4/1930 tarihli ve 1593 sayılı Umumi Hıfzısıhha Kanununda belirtilen umumî kadınlar,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Milli Eğitim Bakanlığı tarafından düzenlenen kurslarda usta öğretici olarak çalıştırılanlar, kamu idarelerinde ders ücreti karşılığı görev verilenler ile 657 sayılı Devlet Memurları Kanununun 4 üncü maddesinin (C) bendi kapsamında çalıştırılanlar,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Türkiye İş Kurumu tarafından düzenlenen Toplum Yararına Çalışma Programlarından yararlananlar,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>hakkında da uygulanır.  Bu fıkranın (g) bendinde sayılanlar için Türkiye İş Kurumu prim ödeme yükümlüsü olmakla birlikte bu Kanun kapsamında işyeri ve işveren sayılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci fıkranın (b) bendi gereği sigortalı sayılanlara ilişkin hükümler; 10/7/1953 tarihli ve 6132 sayılı At Yarışları Hakkında Kanuna tabi jokey ve antrenörler hakkında da uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birinci fıkranın (c) bendi gereği sigortalı sayılanlara ilişkin hükümler;</template>
          <mvz-bent no="a">
            <template>Kuruluş ve personel kanunları veya diğer kanunlar gereğince seçimle veya atama yoluyla kamu idarelerinde göreve gelenlerden; bu görevleri sebebiyle kendilerine ilgili kanunlarında Devlet memurları gibi emeklilik hakkı tanınmış olanlardan hizmet akdi ile çalışmayanlar,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başbakan, Cumhurbaşkanı yardımcıları, bakanlar, Türkiye Büyük Millet Meclisi üyeleri, belediye başkanları, il encümeninin seçimle gelen üyeleri,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Birinci fıkranın (c) bendi kapsamında iken, bu kapsamdaki kişilerin kurduğu sendikalar ve konfederasyonları ile sendika şubelerinin başkanlıkları ve yönetim kurullarına seçilenlerden aylıksız izne ayrılanlar,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Harp okulları ile fakülte ve yüksek okullarda, Milli Savunma Bakanlığı hesabına okuyan veya kendi hesabına okumakta iken askerî öğrenci olanlar ile astsubay meslek yüksek okulları ve astsubay naspedilmek üzere temel askerlik eğitimine tâbi tutulan adaylar,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Polis Akademisi ile fakülte ve yüksek okullarda, Emniyet Genel Müdürlüğü hesabına okuyan veya kendi hesabına okumakta iken Emniyet Genel Müdürlüğü hesabına okumaya devam eden öğrenciler ile polis nasbedilmek üzere Polis Meslek Eğitim Merkezlerinde polislik eğitimine tabi tutulan adaylar,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Jandarma ve Sahil Güvenlik Akademisi ile fakülte ve yüksekokullarda Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı nam ve hesabına okuyan veya kendi hesabına okumakta iken Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı nam ve hesabına okumaya devam edenler ile subay ve astsubay naspedilmek üzere temel askerlik eğitimine tabi tutulan adaylar,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>hakkında da uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Dördüncü fıkranın (d), (e) ve (f) bentlerinde belirtilen okulları tamamlamadan ayrılanlar ile bu okulları tamamlamalarına rağmen görevlerine başlamadan ayrılanların, bu okullarda geçen eğitim süreleri sigortalılıklarından sayılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu Kanunun kısa vadeli sigorta kollarına ilişkin hükümleri bu maddenin birinci fıkrasının (c) bendi kapsamında sigortalı sayılanlara bu kapsamda oldukları sürece uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">

      <mvz-madde no="5" başlık="Bazı sigorta kollarının uygulanacağı sigortalılar">
        <mvz-fıkra no="1">
          <template>Kısa ve uzun vadeli sigorta kolları bakımından aşağıda sayılan kişiler hakkında uygulanacak sigorta kolları şunlardır:</template>
          <mvz-bent no="a">
            <template>Hizmet akdi ile çalışmamakla birlikte, ceza infaz kurumları ile tutukevleri bünyesinde oluşturulan tesis, atölye ve benzeri ünitelerde çalıştırılan hükümlü ve tutuklular hakkında, iş kazası ve meslek hastalığı ile analık sigortası uygulanır ve bunlar, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılırlar.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>5/6/1986 tarihli ve 3308 sayılı Meslekî Eğitim Kanununda belirtilen aday çırak, çırak ve işletmelerde meslekî eğitim gören öğrenciler hakkında iş kazası ve meslek hastalığı ile hastalık sigortası; meslekî ve teknik ortaöğretim ile yükseköğrenimleri sırasında staja tabi tutulan öğrenciler, mesleki ve teknik ortaöğretim sırasında tamamlayıcı eğitim ya da alan eğitimi gören öğrenciler, kamu kurum ve kuruluşları tarafından desteklenen projelerde görevli bursiyerler ile 2547 sayılı Yükseköğretim Kanununun 46 ncı maddesine tabi olarak kısmi zamanlı çalıştırılan öğrencilerden aylık prime esas kazanç tutarı, 82 nci maddeye göre belirlenen günlük prime esas kazanç alt sınırının otuz katından fazla olmayanlar hakkında ise iş kazası ve meslek hastalığı sigortası uygulanır. Bu bentte sayılanlar, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılırlar ve bunlardan bakmakla yükümlü olunan kişi durumunda olmayanlar hakkında ayrıca genel sağlık sigortası hükümleri uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Harp malulleri ile 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanuna veya 2330 sayılı Kanun hükümleri veya 8/6/1949 tarihli ve 5434 sayılı Kanunun 56 ncı maddesi uygulanarak aylık bağlanmasını gerektiren kanunlara göre vazife malullüğü aylığı bağlanmış malullerden, 4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentleri kapsamında sigortalı olarak çalışmaya başlayanların aylıkları kesilmez. Aylıkları kesilmeksizin 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında çalışanlar hakkında uzun vadeli sigorta kolları, 4 üncü maddenin birinci fıkrasının (a) ve (b) bentleri kapsamında çalışanlar hakkında ise iş kazası ve meslek hastalığı sigortası hükümleri uygulanır. İş kazası ve meslek hastalığı sigortası hükümleri uygulananların uzun vadeli sigorta kollarına tabi olmayı istemeleri halinde, bu isteklerini Kuruma bildirdikleri tarihi takip eden ay başından itibaren, haklarında uzun vadeli sigorta kolları da uygulanır. Bu fıkra kapsamına girenlerden ayrıca genel sağlık sigortası primi alınmaz.</template>
          </mvz-bent>
          <mvz-bent no="d" durum="mülga">
            <template></template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Türkiye İş Kurumu tarafından düzenlenen meslek edindirme, geliştirme ve değiştirme eğitimine katılan kursiyerler, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılırlar ve bunlar hakkında iş kazası ve meslek hastalığı sigortası ile  genel sağlık sigortası hükümleri uygulanır.  Bunlar için Türkiye İş Kurumu prim ödeme yükümlüsü olmakla birlikte bu Kanun kapsamında işyeri ve işveren sayılmaz.</template>
          </mvz-bent>
          <mvz-bent no="f" durum="mülga">
            <template></template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Ülkemiz ile sosyal güvenlik sözleşmesi olmayan ülkelerde iş üstlenen işverenlerce yurt dışındaki işyerlerinde çalıştırılmak üzere götürülen Türk işçileri 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılır ve bunlar hakkında kısa vadeli sigorta kolları ile genel sağlık sigortası hükümleri uygulanır. Bu sigortalıların uzun vadeli sigorta kollarına tabi olmak istemeleri halinde, 50 nci maddenin ikinci fıkrasındaki Türkiye’de yasal olarak ikamet etme şartı ile aynı fıkranın (a) bendinde belirtilen şartlar aranmaksızın haklarında isteğe bağlı sigorta hükümleri uygulanır. Bu kapsamda, isteğe bağlı sigorta hükümlerinden yararlananlardan ayrıca genel sağlık sigortası primi alınmaz. Bu bent kapsamında yurt dışındaki işyerlerinde çalışan sigortalıların, bu sürede ödedikleri isteğe bağlı sigorta primleri 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalılık sayılır.</template>
          </mvz-bent>
        </mvz-fıkra>

      <mvz-madde no="6" başlık="Sigortalı sayılmayanlar">

          <mvz-bent no="b">

          <mvz-bent no="e">
            <template>Uluslararası sosyal güvenlik sözleşmeleri hükümleri saklı kalmak kaydıyla; yabancı bir ülkede kurulu herhangi bir kuruluş tarafından ve o kuruluş adına ve hesabına Türkiye’ye üç ayı geçmemek üzere bir iş için gönderilen ve yabancı ülkede sosyal sigortaya tabi olduğunu belgeleyen kişiler ile Türkiye’de kendi adına ve hesabına bağımsız çalışanlardan, yurt dışında ikamet eden ve o ülke sosyal güvenlik mevzuatına tabi olanlar,</template>

          </mvz-bent>
          <mvz-bent no="g">
            <template>Sağlık hizmet sunucuları tarafından işe alıştırılmakta olan veya rehabilite edilen, hasta veya malûller,</template>

          <mvz-bent no="h">
            <template>4 üncü maddenin birinci fıkrasının (b) ve (c) bentleri gereği sigortalı sayılması gerekenlerden 18 yaşını doldurmamış olanlar,</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Kamu idarelerinde ve Kanunun ek 5 inci maddesi kapsamında sayılanlar hariç olmak üzere, tarım işlerinde veya orman işlerinde hizmet akdiyle süreksiz işlerde çalışanlar ile tarımda kendi adına ve hesabına bağımsız çalışanlardan; tarımsal faaliyette bulunan ve yıllık tarımsal faaliyet gelirlerinden, bu faaliyete ilişkin masraflar düşüldükten sonra kalan tutarın aylık ortalamasının, bu Kanunda tanımlanan prime esas günlük kazanç alt sınırının otuz katından az olduğunu belgeleyenler ile 65 yaşını dolduranlardan talepte bulunanlar,</template>
          </mvz-bent>
          <mvz-bent no="j" durum="mülga">
            <template></template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Kendi adına ve hesabına bağımsız çalışanlardan gelir vergisinden muaf olup, esnaf ve sanatkâr siciline kayıtlı olanlardan, aylık faaliyet gelirlerinden bu faaliyetine ilişkin masraflar düşüldükten sonra kalan tutarı, prime esas günlük kazanç alt sınırının otuz katından az olduğunu belgeleyenler,</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Kamu idarelerinin dış temsilciliklerinde istihdam edilen ve temsilciliğin bulunduğu ülkede sürekli ikamet izni veya bu devletin vatandaşlığını da haiz bulunan Türk uyruklu sözleşmeli personelden, bulunduğu ülkenin sosyal güvenlik kurumunda sigortalı olduğunu belgeleyenler ile kamu idarelerinin dış temsilciliklerinde istihdam edilen sözleşmeli personelin uluslararası sosyal güvenlik sözleşmeleri çerçevesinde ve temsilciliğin bulunduğu ülkenin ilgili mevzuatının zorunlu kıldığı hallerde, işverenleri tarafından bulunulan ülkede sosyal sigorta kapsamında sigortalı yapılanlar,</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Gençlik ve Spor Bakanlığı, Spor Genel Müdürlüğü, Türkiye Futbol Federasyonu, bağımsız spor federasyonları tarafından yapılan her türlü gençlik ve spor faaliyetleri ile bu faaliyetlerle ilgili kamp, eğitim ve hazırlık çalışmalarında süreklilik arz etmeyecek şekilde görevlendirilenler,</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>30 uncu maddenin üçüncü fıkrasının (b) bendi kapsamında olanlar hariç olmak üzere, yaşlılık aylığı almaktayken bu aylıkları kesilmeksizin 4 üncü maddenin birinci fıkrasının (b) bendi kapsamında çalışanlar,</template>

        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>4 üncü ve 5 inci maddelere göre sigortalı sayılmaz.</template>

          <template>(h) bendinin uygulanmasıyla ilgili olarak, bir meslek veya sanat okulunu bitirenlerden, 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanunu hükümlerine göre mahkemece ergin kılınmak suretiyle, öğrenimleriyle ilgili görevlerde çalışanlar hakkında 18 yaşın bitirilmiş olması şartı aranmaz.</template>

      <mvz-madde no="7" başlık="Sigortalılığın başlangıcı">

          </mvz-bent>
          <mvz-bent no="b">
            <template>(b) bendi kapsamında sigortalı sayılanlardan, gelir vergisi mükellefi olanlar ile şahıs şirketlerinden kolektif, adi komandit şirketlerin komandite ve komanditer ortakları ve donatma iştiraki ortaklarının vergi mükellefiyetlerinin başladıkları tarihten; sermaye şirketlerinden limited şirket ortakları ile sermayesi paylara bölünmüş komandit şirketlerin komandite ortaklarının, şirketin ticaret sicil memurluklarınca tescil edildikleri tarihten; anonim şirketlerin yönetim kurulu üyesi olan ortaklarının yönetim kuruluna seçildikleri tarihten; gelir vergisinden muaf olanların ise esnaf ve sanatkâr siciline kayıtlı oldukları tarihten; tarımda kendi adına ve hesabına bağımsız çalışanlar için tarımsal faaliyetlerinin kanunla kurulu ilgili meslek kuruluşlarınca veya kendilerince, bir yıl içinde bildirilmesi halinde kaydedildiği tarihten, bu süre içinde bildirilmemesi halinde ise bildirimin Kuruma yapıldığı tarihten; köy ve mahalle muhtarları için seçildikleri tarihten; 4 üncü maddenin üçüncü fıkrasında belirtilenler için ise lisans belgesine istinaden fiilen çalışmaya başladıkları tarihten,</template>

          <mvz-bent no="c">
            <template>(c) bendi kapsamında sigortalı sayılanlar için, göreve başladıkları veya bu Kanunun 4 üncü maddesinin dördüncü fıkrasının (d), (e) ve (f) bentleri kapsamındaki okullarda öğrenime başladıkları tarihten,</template>

        <mvz-fıkra no="2">

      <mvz-madde no="8" başlık="Sigortalı bildirimi ve tescili">

          <mvz-bent no="b">

          <mvz-bent no="c">

        <mvz-fıkra no="2">
          <template>Sigortalılar, çalışmaya başladıkları tarihten itibaren en geç bir ay içinde, sigortalı olarak çalışmaya başladıklarını Kuruma bildirirler. Ancak, sigortalının kendini bildirmemesi, sigortalı aleyhine delil teşkil etmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>4 üncü maddenin birinci fıkrasının (b) bendinin (4) numaralı alt bendinde bulunanlar hariç olmak üzere diğer alt bentleri kapsamında sigortalı sayılan kişilerden köy ve mahalle muhtarları için seçildiklerine ilişkin mazbatalarını ilgili seçim kurulundan aldıkları tarihten, sigortalılıkları vergi mükellefiyetlerinin başladığı tarihten başlayan sigortalılar için vergi mükellefiyeti işleminin tesis tarihinden itibaren iki ayı geçmemek üzere ilgili vergi dairesince vergi mükellefinin işe başlama işlemlerinin tekemmül ettirildiği tarihten ve diğerleri için 7 nci maddenin birinci fıkrasının (b) bendinde belirtilen sigortalılık başlangıcından; (4) numaralı alt bendi kapsamında sigortalı sayılanlar için ise kanunla kurulu meslek kuruluşlarına kayıt tarihinden itibaren kendi mevzuatına göre kayıt veya tescili yapan ilgili kurum, kuruluş ve birlikler, vergi daireleri ve Esnaf ve Sanatkâr Sicil Müdürlüğü sigortalı işe giriş bildirgesi düzenleyerek Kuruma vermekle yükümlüdür. 4 üncü maddenin birinci fıkrasının (b) bendinin (1), (2) ve (3) numaralı alt bentlerinde sayılanların bildirimleri en geç 15 gün, (4) numaralı alt bendinde sayılanların bildirimleri ise en geç bir ay içinde yapılır. Ayrıca 4 üncü maddenin birinci fıkrasının (b) bendinin (4) numaralı alt bendinde sayılanların kendileri tarafından da sigortalılık bildirimleri yapılabilir. 4 üncü maddenin üçüncü fıkrasında belirtilenlerin ise çalışmaya başladıkları tarihten itibaren en geç bir ay içinde tescil eden kuruluş tarafından Kuruma bildirilmesi zorunludur. Kurum bu bildirimlerden itibaren bir ay içinde tescili yapılan kişilere, sigortalılık hak ve yükümlülüklerinin başladığını bildirir.</template>

        <mvz-fıkra no="4" durum="mülga">

        <mvz-fıkra no="8">

        </mvz-fıkra>
        <mvz-fıkra no="9">

            </mvz-altbent>
            <mvz-altbent no="3">
              <template>4 üncü maddenin birinci fıkrasının (3) numaralı alt bendi kapsamına girenlerden, şahıs şirketlerinden kolektif, adi komandit şirketlerin komandite ve komanditer ortakları ve donatma iştiraki ortaklarının vergi mükellefiyetlerinin sona erdiği tarihten, sermayesi paylara bölünmüş komandit şirketlerin komandite ortaklarının, şirketin ticaret sicil memurluğundan kaydının silindiği tarihten, limited şirket ortaklarından hisselerinin tamamını devreden sigortalıların, hisse devrinin yapılmasına ortaklar kurulunca karar verildiği tarihten, anonim şirketlerin yönetim kurulu üyesi olan ortaklarının yönetim kurulu üyeliklerinin sona erdiği tarihten, iflas veya tasfiye durumu ile münfesih duruma düşen şirketler için ortağın talep etmesi halinde, mahkeme kararı ile iflasın, tasfiyenin açılmasına, ortaklar kurulu kararı ile tasfiyenin başlamasına veya şirketin münfesih duruma düşmesine karar verildiği, ortakların talepte bulunmaması halinde, mahkemece iflasın kapatılmasına karar verildiği, tasfiyesi sonuçlanan şirketlerin ortaklıklarının ise tasfiye kurulu kararının ticaret sicili memurluğunca tescil edildiği tarihten,</template>
            </mvz-altbent>
            <mvz-altbent no="4" durum="mülga">
              <template></template>
            </mvz-altbent>
            <mvz-altbent no="5">
              <template>Tarımda kendi adına ve hesabına bağımsız çalışanlar için, tarımsal faaliyetinin sona erdiği veya 6 ncı maddenin birinci fıkrasının (ı) bendi uyarınca muafiyet kapsamına girdiği yahut 65 yaşını doldurması nedeniyle talepte bulunduğu tarihten,</template>
            </mvz-altbent>
            <mvz-altbent no="6">
              <template>Köy ve mahalle muhtarlarının, muhtarlık görevlerinin sona erdiği tarihten,</template>
            </mvz-altbent>
            <mvz-altbent no="7">
              <template>Herhangi bir yabancı ülkede ikamet eden ve o ülke mevzuatı kapsamında sigortalı olarak çalışmaya başladığı veya ikamet esasına bağlı olarak, o ülke sosyal güvenlik sistemine dahil olduğu tarihten bir gün öncesinden,</template>
            </mvz-altbent>
            <mvz-altbent no="8">
              <template>(3) numaralı alt bent kapsamında iflas veya tasfiye durumu ile münfesih duruma düşen şirketlerin ortaklarından 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında çalışmaya başlayanların, çalışmaya başladıkları tarihten bir gün öncesinden,</template>
            </mvz-altbent>
            <mvz-altbent no="9">
              <template>Köy ve mahalle muhtarlarından; kendi adına ve hesabına bağımsız çalışmasından dolayı gelir vergisi mükellefiyeti bulunanlar hariç, aynı zamanda hizmet akdi ile çalışanların çalışmaya başladığı tarihten bir gün öncesinden,</template>
            </mvz-altbent>
            <mvz-altbent no="10">
              <template>Gelir vergisinden muaf olan, ancak esnaf ve sanatkârlar sicili kaydına istinaden 4 üncü maddenin birinci fıkrasının (b) bendi kapsamında sigortalı sayılanlardan, bu sigortalılıklarının devamı sırasında, hizmet akdi ile çalışanların çalışmaya başladığı tarihten bir gün öncesinden,</template>
            </mvz-altbent>
            <mvz-altbent no="11">
              <template>6132 sayılı Kanuna tabi jokey ve antrenörler için, lisansları yenilenmeyenlerin lisanslı oldukları yılın sonundan,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="c">
            <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı sayılanların;</template>
            <mvz-altbent no="1">
              <template>Ölüm veya aylık bağlanmasını gerektiren hallerde görev aylıklarının kesildiği tarihi, 8/6/1949 tarihli ve 5434 sayılı Kanunun 40 ıncı maddesinde belirtilen yaş hadleri ile sıhhi izin sürelerinin doldurulması halinde ise bu süre ve hadlerin doldurulduğu tarihleri takip eden aybaşından,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Diğer hallerde ise görevden ayrıldıkları tarihten,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="d">
            <template>5 inci madde gereği bazı sigorta kollarına tâbi tutulanların, sigortalı sayılmalarını gerektiren halin sona erdiği tarihten,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>6 ncı maddenin birinci fıkrasının (l) bendi kapsamında olanlardan, çalışmakta iken bulunduğu ülkenin sosyal güvenlik kurumu ile irtibatlandırılanlar ile uluslararası sosyal güvenlik sözleşmeleri çerçevesinde, seçimini bu yönde kullananlar için sigortalandıkları tarihten,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>itibaren sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, hastalık ve analık hükümlerinin uygulanmasında sigortalılık;</template>
          <mvz-bent no="a">
            <template>İlgili kanunlar gereği sigortalının ücretsiz izinli olması, greve iştirak etmesi veya işverenin lokavt yapması hallerinde, bu hallerin sona ermesini,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Diğer hallerde ise birinci fıkrada belirtilen tarihleri,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>takip eden onuncu günden başlanarak yitirilmiş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci fıkranın (a), (c) ve (d) bentlerine göre sigortalılığı sona erenlerin durumları işverenleri tarafından, (b) bendinde belirtilen şekillerde sona erenlerin durumları ise kendileri ve sözü edilen bentte belirtilen faaliyetin sona erme halinin bildirildiği kuruluşlar veya vergi daireleri tarafından, en geç on gün içinde Kuruma bildirilir. Bu kişilerin meslek kuruluşlarına ya da vergi dairelerine olan yükümlülüklerini yerine getirmemiş olmaları, sigortalılığın sona ermesine ilişkin belge ya da bilginin verilmesine engel teşkil etmez.  Vergi dairelerince vergi mükellefiyetinin sona erdiğine ilişkin yapılacak bildirimlerde bu süre vergi mükellefiyeti terk işleminin tesis tarihinden itibaren iki ayı geçmemek üzere vergi mükellefinin işi bırakma işlemlerinin vergi dairelerince tekemmül ettirildiği tarihten başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birinci fıkranın (e) bendine göre sigortalılığı sona erenler ile 8 inci maddenin birinci fıkrasının (c) bendine göre bildirimi yapılan sigortalıların, sigortalılığının sona ermesine ilişkin bildirimleri, üç ay içinde Kuruma yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Sigortalıların işleri nedeniyle geçici olarak yurt dışında bulunmaları">
        <mvz-fıkra no="1">
          <template>4 üncü maddenin birinci fıkrasının (a) bendinde sayılan sigortalıların işverenleri tarafından geçici görevle yurt dışına gönderilmeleri, (c) bendinde sayılan sigortalıların mevzuatlarında belirtilen usûle uygun olarak yurt dışına gönderilmeleri veya (b) bendinde sayılanların sigortalılığa esas çalışması nedeniyle yurt dışında bulunmaları halinde, bu görevleri yaptıkları sürece, sigortalıların ve işverenlerin sosyal sigortaya ilişkin hak ve yükümlülükleri devam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="İşyerleri ve İşverenlere İlişkin Hükümler">
      <mvz-madde no="11" başlık="İşyeri, işyerinin bildirilmesi, devri, intikali ve nakli">
        <mvz-fıkra no="1">
          <template>İşyeri, sigortalı sayılanların maddî olan ve olmayan unsurlar ile birlikte işlerini yaptıkları yerlerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İşyerinde üretilen mal veya verilen hizmet ile nitelik yönünden bağlılığı bulunan ve aynı yönetim altında örgütlenen işyerine bağlı yerler, dinlenme, çocuk emzirme, yemek, uyku, yıkanma, muayene ve bakım, beden veya meslek eğitimi yerleri, avlu ve büro gibi diğer eklentiler ile araçlar da işyerinden sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İşveren, örneği Kurumca hazırlanacak işyeri bildirgesini en geç sigortalı çalıştırmaya başladığı tarihte, Kuruma vermekle yükümlüdür.  Şirket kuruluşunun ticaret sicili memurluklarına bildirilmesi halinde yapılan bu bildirim Kuruma yapılmış sayılır ve ilgililerce ayrıca işyeri bildirgesi düzenlenmez. Ticaret sicili memurlukları, kendilerine yapılan bu bildirimi en geç on gün içinde Kuruma bildirmek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>29/6/1956 tarihli ve 6762 sayılı Türk Ticaret Kanunu hükümlerine tâbi şirketlerin nevilerinin değişmesi, birleşmesi veya diğer bir şirkete katılması durumunda, bu hususların ticaret siciline tesciline ilişkin ilân tarihini; adi şirketlerde şirkete yeni ortak alınması durumunda ise en geç yeni ortağın alındığı tarihi takip eden on gün içinde, işyeri bildirgesi ile Kuruma bildirilmek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İşyerinin faaliyette bulunduğu adresten başka bir ildeki adrese nakledilmesi, sigortalı çalıştırılan bir işin veya işyerinin başka bir işverene devredilmesi veya intikal etmesi halinde, işyerinin nakledildiği, yeni işverenin işi veya işyerini devraldığı tarihi takip eden on gün içinde, işyerinin miras yoluyla intikali halinde ise mirasçıları, ölüm tarihinden itibaren en geç üç ay içinde, işyeri bildirgesini Kuruma vermekle yükümlüdür. İşyerinin aynı il sınırları içinde Kurumun diğer bir ünitesinin görev alanına giren başka bir adrese nakledilmesi halinde, adres değişikliğinin yazı ile bildirilmesi yeterlidir. Bu işlerde çalışan sigortalıların, sigorta hak ve yükümlülükleri devam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Valilikler, belediyeler ve ruhsat vermeye yetkili diğer kamu ve özel hukuk tüzel kişileri, yapı ruhsatı ve diğer tüm ruhsat veya ruhsat niteliği taşıyan işlemlerine ilişkin bilgi ve belgeler ile varsa bunların verilmesine esas olan istihdama ilişkin bilgileri, verildiği tarihten itibaren bir ay içinde Kuruma bildirmekle yükümlüdürler.  Bu bildirimlerden hangilerinin işyerinin bildirilmesi yerine geçeceği Kurumca belirlenir, belirlenenlerle ilgili ayrıca işyeri bildirgesi düzenlenmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu maddede belirtilen yükümlülükleri yerine getirmeyenler hakkında, 102 nci maddenin birinci fıkrasının (b) bendi uyarınca idarî para cezası uygulanır. İdarî para cezası uygulanması, bu yükümlülüklerin yerine getirilmesine engel teşkil etmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Alt işveren, asıl işverenin işyerinde çalıştırdığı sigortalıları, işverenle aralarında yaptıkları sözleşmenin ibrazı kaydıyla, Kurumdan alacağı özel bir numara ile asıl işverenin kayıtlı olduğu dosyadan bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>İşyeri bildirgesinin verilmemesi veya geç verilmesi, bu Kanunda belirtilen hak ve yükümlülükleri ortadan kaldırmaz. İşyeri bildirgesinin şekli ve içeriği ile bu maddenin uygulanmasına ilişkin usûl ve esaslar Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="İşveren, işveren vekili, geçici iş ilişkisi kurulan işveren ve alt işveren">
        <mvz-fıkra no="1">
          <template>4 üncü maddenin birinci fıkrasının (a) ve (c) bentlerine göre sigortalı sayılan kişileri çalıştıran gerçek veya tüzel kişiler ile tüzel kişiliği olmayan kurum ve kuruluşlar işverendir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İşveren adına ve hesabına, işin veya görülen hizmetin bütününün yönetim görevini yapan kimse, işveren vekilidir. Bu Kanunda geçen işveren deyimi, işveren vekilini de kapsar. İşveren vekili ve 4857 sayılı İş Kanununda tanımlanan geçici iş ilişkisi kurulan işveren, bu Kanunda belirtilen yükümlülüklerinden dolayı işveren ile birlikte müştereken ve müteselsilen sorumludur.  Bu Kanun gereği internet, elektronik ve benzeri ortamda Kuruma gönderilecek muhtasar ve prim hizmet beyannamesinin defter ve kayıtlara ve bu kayıtların dayanağını teşkil eden belgelere uygun olmamasından işverenlerle birlikte yazılı sözleşme ile yetki verilmiş serbest muhasebeci, serbest muhasebeci malî müşavir ve yeminli malî müşavirler de müştereken ve müteselsilen sorumludur. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Kurum tarafından çıkarılan yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>4 üncü maddenin ikinci fıkrasının (a) bendine tâbi olanlar hakkında, işverenlerin bu Kanunda belirtilen yükümlülükleri, bunları çalıştıran işçi sendikaları ve konfederasyonları veya işveren tarafından; 4 üncü maddenin dördüncü fıkrasına tâbi olanlar hakkında, işverenlerin bu Kanunda belirtilen yükümlülükleri, bunları çalıştıran kamu idareleri veya eğitim gördükleri okullar tarafından yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>2/7/1941 tarihli ve 4081 sayılı Çiftçi Mallarının Korunması Hakkında Kanuna göre çalıştırılanlar hakkında, işverenlerin bu Kanunda belirtilen yükümlülükleri, bunları çalıştırmaya yetkili makam tarafından yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Ceza infaz kurumları ile tutukevleri bünyesinde oluşturulan tesis, atölye ve benzeri ünitelerde çalıştırılan hükümlü ve tutukluların işvereni, Ceza İnfaz Kurumları ile Tutukevleri İş Yurtları Kurumu, işveren vekilleri ise Ceza İnfaz Kurumları ile Tutukevleri İş Yurtları Kurumunun sorumlu müdür ve amirleridir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bir işverenden, işyerinde yürüttüğü mal veya hizmet üretimine ilişkin bir işte veya bir işin bölüm veya eklentilerinde, iş alan ve bu iş için görevlendirdiği sigortalıları çalıştıran üçüncü kişiye alt işveren denir. Sigortalılar, üçüncü bir kişinin aracılığı ile işe girmiş ve bunlarla sözleşme yapmış olsalar dahi, asıl işveren, bu Kanunun işverene yüklediği yükümlülüklerden dolayı alt işveren ile birlikte sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Hizmet Akdiyle veya Kendi Adına ve Hesabına Bağımsız Çalışan Sigortalıların Tabi Olduğu Kısa Vadeli Sigorta Hükümleri">
      <mvz-madde no="13" başlık="İş kazasının tanımı, bildirilmesi ve soruşturulması">
        <mvz-fıkra no="1">
          <template>İş kazası;</template>
          <mvz-bent no="a">
            <template>Sigortalının işyerinde bulunduğu sırada,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İşveren tarafından yürütülmekte olan iş nedeniyle sigortalı kendi adına ve hesabına bağımsız çalışıyorsa yürütmekte olduğu iş nedeniyle,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bir işverene bağlı olarak çalışan sigortalının, görevli olarak işyeri dışında başka bir yere gönderilmesi nedeniyle asıl işini yapmaksızın geçen zamanlarda,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamındaki emziren kadın sigortalının, iş mevzuatı gereğince çocuğuna süt vermek için ayrılan zamanlarda,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Sigortalıların, işverence sağlanan bir taşıtla işin yapıldığı yere gidiş gelişi sırasında,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>meydana gelen ve sigortalıyı hemen veya sonradan bedenen ya da ruhen engelli hâle getiren olaydır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İş kazasının 4 üncü maddenin birinci fıkrasının;</template>
          <mvz-bent no="a">
            <template>(a) bendi ile 5 inci madde kapsamında bulunan sigortalılar bakımından bunları çalıştıran işveren tarafından, o yer yetkili kolluk kuvvetlerine derhal ve Kuruma da en geç kazadan sonraki üç işgünü içinde,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>(b) bendi kapsamında bulunan sigortalı bakımından kendisi tarafından, bir ayı geçmemek şartıyla rahatsızlığının bildirim yapmaya engel olmadığı günden sonra üç işgünü içinde,</template>
          </mvz-bent>
          <mvz-bent no="c" durum="mülga">
            <template></template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>iş kazası ve meslek hastalığı bildirgesi ile doğrudan ya da taahhütlü posta ile Kuruma bildirilmesi zorunludur. Bu fıkranın (a) bendinde belirtilen süre, iş kazasının işverenin kontrolü dışındaki yerlerde meydana gelmesi halinde, iş kazasının öğrenildiği tarihten itibaren başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kuruma bildirilen olayın iş kazası sayılıp sayılmayacağı hakkında bir karara varılabilmesi için gerektiğinde, Kurumun denetim ve kontrol ile yetkilendirilen memurları tarafından veya Bakanlık iş müfettişleri vasıtasıyla soruşturma yapılabilir. Bu soruşturma sonunda yazılı olarak bildirilen hususların gerçeğe uymadığı ve olayın iş kazası olmadığı anlaşılırsa, Kurumca bu olay için yersiz olarak yapılmış bulunan ödemeler, ödemenin yapıldığı tarihten itibaren gerçeğe aykırı bildirimde bulunanlardan, 96 ncı madde hükmüne göre tahsil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İş kazası ve meslek hastalığı bildirgesinin şekli ve içeriği, verilme usûlü ile bu maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Meslek hastalığının tanımı, bildirilmesi ve soruşturulması">
        <mvz-fıkra no="1">
          <template>Meslek hastalığı, sigortalının çalıştığı veya yaptığı işin niteliğinden dolayı tekrarlanan bir sebeple veya işin yürütüm şartları yüzünden uğradığı geçici veya sürekli hastalık, bedensel veya ruhsal engellilik halleridir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sigortalının çalıştığı işten dolayı meslek hastalığına tutulduğunun;</template>
          <mvz-bent no="a">
            <template>Kurumca yetkilendirilen sağlık hizmet sunucuları tarafından usûlüne uygun olarak düzenlenen sağlık kurulu raporu ve dayanağı tıbbî belgelerin incelenmesi,</template>
          </mvz-bent>
          <mvz-bent no="b">

      <mvz-madde no="17" başlık="Ödenek ve gelirlere esas tutulacak günlük kazanç">

          <template>İş kazası, meslek hastalığı, hastalık ve analık hallerinde verilecek ödeneklerin hesabına esas tutulacak günlük kazanç; iş kazasının veya doğumun olduğu tarihten, meslek hastalığı veya hastalık halinde ise iş göremezliğin başladığı tarihten önceki oniki aydaki; iş kazası ve meslek hastalığı halinde bağlanacak gelirin hesabına esas tutulacak günlük kazanç ise iş kazasının olduğu veya meslek hastalığında iş göremezliğin başladığı tarihten önceki oniki aydaki son üç ay içinde, 80 inci maddeye göre hesaplanacak prime esas kazançlar toplamının, bu kazançlara esas prim ödeme gün sayısına bölünmesi suretiyle hesaplanır. Ancak, önceki oniki ay içerisinde 180 günden az kısa vadeli sigorta primi bildirilmiş olanların geçici iş göremezlik ödeneğine esas tutulacak günlük kazanç tutarı, iş göremezliğin başladığı tarihteki günlük prime esas kazanç alt sınırının iki katını geçemez.</template>

        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>4 üncü maddenin birinci fıkrasının (a) bendi gereği sigortalı sayılanların ödenek veya gelire esas günlük kazançlarının hesabında:</template>

      <mvz-madde no="19" başlık="Sürekli iş göremezlik gelirine hak kazanma, hesaplanması, başlangıcı ve birden çok iş kazası ve meslek hastalığı hali">

      <mvz-madde no="20" başlık="Hak sahiplerine gelir bağlanması, evlenme ve cenaze ödenekleri">

          <template>İş kazası veya meslek hastalığına bağlı nedenlerden dolayı ölen sigortalının hak sahiplerine, 17 nci madde gereğince tespit edilecek aylık kazancının %70'i, 55 inci maddenin ikinci fıkrasına göre güncellenerek 34 üncü madde hükümlerine göre gelir olarak bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İş kazası veya meslek hastalığı sonucu meslekte kazanma gücünü %50 veya daha fazla oranda kaybetmesi nedeniyle sürekli iş göremezlik geliri bağlanmış iken ölenlerin, ölümün iş kazası veya meslek hastalığına bağlı olup olmadığına bakılmaksızın birinci fıkraya göre belirlenen tutar, 34 üncü madde hükümlerine göre hak sahiplerine gelir olarak bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İş kazası veya meslek hastalığı sonucu meslekte kazanma gücünü %50 oranının altında kaybetmesi nedeniyle sürekli iş göremezlik geliri bağlanmış iken ölenlerin, ölümün iş kazası veya meslek hastalığına bağlı olmaması halinde sigortalının almakta olduğu sürekli iş göremezlik geliri, 34 üncü madde hükümlerine göre hak sahiplerine gelir olarak bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>4 üncü maddenin birinci fıkrasının (b) bendine göre sigortalı sayılanların hak sahiplerine gelir bağlanabilmesi için, kendi sigortalılığından dolayı, genel sağlık sigortası dahil prim ve prime ilişkin her türlü borçlarının ödenmiş olması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Gelirin başlangıcı, kesilmesi ve yeniden bağlanmasında 34 üncü ve 35 inci maddeler uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>37 nci madde hükümlerine göre hak sahiplerine cenaze ve evlenme ödeneği verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="İş kazası ve meslek hastalığı ile hastalık bakımından işverenin ve üçüncü kişilerin sorumluluğu">
        <mvz-fıkra no="1">
          <template>İş kazası ve meslek hastalığı, işverenin kastı veya sigortalıların sağlığını koruma ve iş güvenliği mevzuatına aykırı bir hareketi sonucu meydana gelmişse, Kurumca sigortalıya veya hak sahiplerine bu Kanun gereğince yapılan veya ileride yapılması gereken ödemeler ile bağlanan gelirin başladığı tarihteki ilk peşin sermaye değeri toplamı, sigortalı veya hak sahiplerinin işverenden isteyebilecekleri tutarlarla sınırlı olmak üzere, Kurumca işverene ödettirilir. İşverenin sorumluluğunun tespitinde kaçınılmazlık ilkesi dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İş kazasının, 13 üncü maddenin ikinci fıkrasının (a) bendinde belirtilen sürede işveren tarafından Kuruma bildirilmemesi halinde, bildirim tarihine kadar geçen süre için sigortalıya ödenecek geçici iş göremezlik ödeneği, Kurumca işverenden tahsil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Çalışma mevzuatında sağlık raporu alınması gerektiği belirtilen işlerde, böyle bir rapora dayanılmaksızın veya eldeki rapora aykırı olarak bünyece elverişli olmadığı işte çalıştırılan sigortalının, bu işe girmeden önce var olduğu tespit edilen veya bünyece elverişli olmadığı işte çalıştırılması sonucu meydana gelen hastalığı nedeniyle, Kurumca sigortalıya ödenen geçici iş göremezlik ödeneği işverene ödettirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İş kazası, meslek hastalığı ve hastalık, üçüncü bir kişinin kusuru nedeniyle meydana gelmişse, sigortalıya ve hak sahiplerine yapılan veya ileride yapılması gereken ödemeler ile bağlanan gelirin başladığı tarihteki ilk peşin sermaye değerinin yarısı, zarara sebep olan üçüncü kişilere ve şayet kusuru varsa bunları çalıştıranlara rücû edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İş kazası, meslek hastalığı ve hastalık; kamu görevlileri, er ve erbaşlar ile kamu idareleri tarafından görevlendirilen diğer kişilerin vazifelerinin gereği olarak yaptıkları fiiller sonucu meydana gelmiş ise, bu fiillerden dolayı haklarında kesinleşmiş mahkûmiyet kararı bulunanlar hariç olmak üzere, sigortalı veya hak sahiplerine yapılan ödemeler veya bağlanan gelirler için kurumuna veya ilgililere rücû edilmez. Ayrıca, iş kazası veya meslek hastalığı sonucu ölümlerde, bu Kanun uyarınca hak sahiplerine bağlanacak gelir ve verilecek ödenekler için, iş kazası veya meslek hastalığının meydana gelmesinde kusuru bulunan hak sahiplerine veya iş kazası sonucu ölen kusurlu sigortalının hak sahiplerine, Kurumca rücû edilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Sigortalının kendisinden kaynaklanan sebeplerle tedavi süresinin uzaması, iş göremezliğinin artması">
        <mvz-fıkra no="1">
          <template>Sigortalının aşağıdaki sayılan nedenlerden dolayı iş kazasına veya meslek hastalığına uğraması, hastalanması, tedavi süresinin uzaması veya iş göremezliğinin artması hallerinde geçici iş göremezlik ödeneği veya sürekli iş göremezlik geliri;</template>
          <mvz-bent no="a">
            <template>Ceza sorumluluğu olmayanlar ile kabul edilebilir bir mazereti olanlar hariç, sigortalının iş kazası, meslek hastalığı, hastalık ve analık nedeniyle hekimin bildirdiği tedbir ve tavsiyelere uymaması sonucu tedavi süresinin uzamasına veya iş göremezlik oranının artmasına, malûl kalmasına neden olması halinde, uzayan tedavi süresi veya artan iş göremezlik oranı esas alınarak dörtte birine kadarı Kurumca eksiltilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Ceza sorumluluğu olmayanlar hariç, ağır kusuru yüzünden iş kazasına uğrayan, meslek hastalığına tutulan veya hastalanan sigortalının kusur derecesi esas alınarak üçte birine kadarı Kurumca eksiltilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kasdî bir hareketi yüzünden iş kazasına uğrayan, meslek hastalığına tutulan, hastalanan veya Kurumun yazılı bildirimine rağmen teklif edilen tedaviyi kabul etmeyen sigortalıya, yarısı tutarında ödenir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Tedavi gördüğü hekimden, tedavinin sona erdiğine ve çalışabilir olduğuna dair belge almaksızın çalışan sigortalıya geçici iş göremezlik ödeneği ödenmez, ödenmiş olanlar da yersiz yapılan ödeme tarihinden itibaren 96 ncı madde hükümlerine göre geri alınır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>13 üncü maddenin ikinci fıkrasının (b) bendinde belirtilenler tarafından iş kazasının anılan bentte belirtilen süre içinde Kuruma bildirilmemesi durumunda, sigortalıya yapılacak iş göremezlik ödenekleri bildirim tarihinden itibaren ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Süresinde bildirilmeyen sigortalılıktan doğan sorumluluk">
        <mvz-fıkra no="1">
          <template>Sigortalı çalıştırmaya başlandığının süresi içinde sigortalı işe giriş bildirgesi ile Kuruma bildirilmemesi halinde, bildirgenin sonradan verildiği veya sigortalı çalıştırıldığının Kurumca tespit edildiği tarihten önce meydana gelen iş kazası, meslek hastalığı, hastalık ve analık halleri sonucu ilgililerin gelir ve ödenekleri Kurumca ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıdaki fıkrada belirtilen hallerde, Kurumca yapılan ve ileride yapılması gerekli bulunan her türlü masrafların tutarı ile gelir bağlanırsa bu gelirin başladığı tarihteki ilk peşin sermaye değeri tutarı, 21 inci maddenin birinci fıkrasında yazılı sorumluluk halleri aranmaksızın, işverene ayrıca ödettirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>4 üncü maddenin birinci fıkrasının (b) bendi kapsamında sigortalı olduğu halde, 8 inci maddenin üçüncü fıkrasında belirtilen süre içerisinde bildirimde bulunmayanlara, bildirimde bulunulmayan sürede meydana gelen iş kazası, meslek hastalığı, analık halleri sonucu ilgililerin gelir ve ödenekleri Kurumca ödenmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="Kısa vadeli sigorta kollarında dikkate alınmayan süreler">
        <mvz-fıkra no="1">
          <template>Kısa vadeli sigorta kolları bakımından;</template>
          <mvz-bent no="a">
            <template>Herhangi bir sebeple silâh altına alınan sigortalının askerlikte geçen hizmet süresi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Hükümlülükle sonuçlanmayan tutuklulukta geçen süre,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İş kazası, meslek hastalığı, hastalık ve analık sigortalarından geçici iş göremezlik ödeneği alan sigortalının iş göremediği süre,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Sigortalının greve iştirak etmesi veya işverenin lokavt yapması hallerinde geçen süre,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>18 inci maddede belirtilen çalışma sürelerine girmediği gibi, iş göremezliğin başladığı veya hastalığın anlaşıldığı yahut doğumun olduğu tarihten önceki bir yılın hesabında da dikkate alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Uzun Vadeli Sigorta Hükümleri">
      <mvz-madde no="25" başlık="Malûl sayılma">
        <mvz-fıkra no="1">
          <template>Sigortalının veya işverenin talebi üzerine Kurumca yetkilendirilen sağlık hizmeti sunucularının sağlık kurullarınca usûlüne uygun düzenlenecek raporlar ve dayanağı tıbbî belgelerin incelenmesi sonucu, 4 üncü maddenin birinci fıkrasının (a) ve (b) bentleri kapsamındaki sigortalılar için çalışma gücünün veya iş kazası veya meslek hastalığı sonucu meslekte kazanma gücünün en az %60'ını, (c) bendi kapsamındaki sigortalılar için çalışma gücünün en az %60’ını veya vazifelerini yapamayacak şekilde meslekte kazanma gücünü kaybettiği Kurum Sağlık Kurulunca tespit edilen sigortalı, malûl sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, sigortalı olarak ilk defa çalışmaya başladığı tarihten önce sigortalının çalışma gücünün %60'ını veya vazifesini yapamayacak derecede meslekte kazanma gücünü kaybettiği önceden veya sonradan tespit edilirse, sigortalı bu hastalık veya engelliliği sebebiyle malûllük aylığından yararlanamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yedek subay, yedek astsubay veya erbaş ve er olarak ya da talim, manevra, seferberlik veya harp dolayısıyla görevleri ile ilgileri kesilmeksizin silâh altına alındıkları dönemde malûl olup, bu malûllükleri asıl görevlerini veya işlerini yapmaya mani olmayanlar hakkında, bu hastalık veya engellilik hâlleri sebebiyle malûllük sigortasına ilişkin hükümler uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamındaki sigortalıların yazılı talepleri halinde, haklarında bu madde hükümleri uygulanmaksızın malûllüklerinin mani olmadığı başka vazife veya sınıflara nakil suretiyle tayinleri yapılmak üzere istifa etmiş sayılırlar. Bunların, istifa etmiş sayıldıktan sonra dahi, bu Kanun hükümlerinin uygulanmasını isteme hakları mahfuzdur. Ancak, kurumlarında başka vazife ve sınıflara nakli mümkün olanlardan özel kanunlarına göre yükümlülük süresine tabi olanlar, bu yükümlülüklerini tamamlamadıkça veya malûliyetlerinin yeni vazifelerine de mani olduğuna dair usûlüne uygun yeniden rapor almadıkça bu haklarını kullanamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamındaki sigortalılardan, vazifelerini yapamayacak derecede hastalığa uğrayanlar, hastalıkları kanunlarında tayin edilen sürelerden fazla devam etmesi halinde, hastalıklarının mahiyetlerine ve doğuş sebeplerine göre birinci fıkra uyarınca malûl veya 47 nci madde hükümlerine göre vazife malûlü sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamındaki sigortalılardan; personel kanunlarına tabi olmayanların hastalık sebebiyle malûl sayılmalarına esas alınacak hastalık süresi hakkında kendi özel kanunları yürürlüğe girinceye kadar 657 sayılı Devlet Memurları Kanununun hastalık iznine ilişkin hükümleri uygulanır. Kanunlarındaki yazılı sürelerden önce geçen hastalığı en çok bir yıl içinde nüksetmesi halinde eski ve yeni hastalık süreleri birleştirilmek suretiyle işlem yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Malûllük sigortasından sağlanan haklar ve yararlanma şartları">
        <mvz-fıkra no="1">
          <template>Malûllük sigortasından sigortalılara sağlanan hak, malûllük aylığı bağlanmasıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sigortalıya malûllük aylığı bağlanabilmesi için sigortalının;</template>
          <mvz-bent no="a">
            <template>25 inci maddeye göre malûl sayılması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>En az on yıldan beri sigortalı bulunup, toplam olarak 1800 gün veya başka birinin sürekli bakımına muhtaç derecede malûl olan sigortalılar için ise sigortalılık süresi aranmaksızın 1800 gün malûllük, yaşlılık ve ölüm sigortaları primi bildirilmiş olması,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Malûliyeti nedeniyle sigortalı olarak çalıştığı işten ayrıldıktan veya işyerini kapattıktan veya devrettikten sonra Kurumdan yazılı istekte bulunması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>halinde malûllük aylığı bağlanır. Ancak, 4 üncü maddenin birinci fıkrasının (b) bendine göre sigortalı sayılanların kendi sigortalılığı nedeniyle genel sağlık sigortası primi dahil, prim ve prime ilişkin her türlü borçlarının ödenmiş olması zorunludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Malûllük aylığının hesaplanması, başlangıcı, kesilmesi ve yeniden bağlanması">
        <mvz-fıkra no="1">
          <template>Malûllük aylığı; prim gün sayısı 9000 günden az olan sigortalılar için 9000 gün üzerinden, 9000 gün ve daha fazla olanlar için ise toplam prim ödeme gün sayısı üzerinden, 29 uncu madde hükümlerine göre hesaplanır. Sigortalı başka birinin sürekli bakımına muhtaç ise tespit edilen aylık bağlama oranı 10 puan artırılır. Ancak, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılanlar için 9000 prim gün sayısı 7200 gün olarak uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Malûllük aylığı, 4 üncü maddenin birinci fıkrasının (a) ve (b) bentleri kapsamındaki sigortalılar ile (c) bendi kapsamında sigortalı iken görevinden ayrılmış ve daha sonra başka bir sigortalılık haline tabi olarak çalışmamış olanların;</template>
          <mvz-bent no="a">
            <template>Malûl sayılmasına esas tutulan rapor tarihi yazılı istek tarihinden önce ise yazılı istek tarihini,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Malûl sayılmasına esas tutulan rapor tarihi yazılı istek tarihinden sonra ise rapor tarihini,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamında çalışmakta olanların ise, malûliyetleri sebebiyle görevlerinden ayrıldıkları tarihi,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>takip eden ay başından itibaren başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Malûllük aylığı almakta iken bu Kanuna göre veya yabancı bir ülke mevzuatı kapsamında çalışmaya başlayanların malûllük aylıkları, çalışmaya başladıkları tarihi takip eden ödeme dönemi başında kesilir ve bu Kanuna tabi olarak çalıştıkları süre zarfında 80 inci maddeye göre belirlenen prime esas kazançları üzerinden 81 inci madde gereğince kısa ve uzun vadeli sigorta kolları ile genel sağlık sigortasına ait prim alınır. Bunlardan işten ayrılarak yeniden malûllük aylığı bağlanması için yazılı istekte bulunan ya da emekliye ayrılan veya sevkedilenlere; kontrol muayenesine tabi tutulmak ve ilk aylığına esas malûllüğünün devam ettiği anlaşılmak kaydıyla, 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında çalışıyorsa görevinden ayrıldığı tarihi, diğerlerine ise istek tarihlerini takip eden ödeme döneminden itibaren yeniden malûllük aylığı hesaplanarak bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu durumdakilerden ilk bağlanan malûllük aylığına esas prim ödeme gün sayısı;</template>
          <mvz-bent no="a">
            <template>9000 günün üzerinde olanların aylıkları 30 uncu maddenin üçüncü fıkrasının (a) bendi hükümleri uygulanarak hesaplanır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>9000 günden az olanların aylıkları ise, eski aylığın kesildiği tarihten sonra aylıklara yapılan artışlar uygulanmak suretiyle aylığın başlangıç tarihi itibariyle hesaplanan tutarının emeklilik öncesi ve sonrası prim ödeme gün sayısı toplamının emeklilik öncesi prim ödeme gün sayısına orantılı bölümü ile emeklilik sonrası çalışmaya ait kısmi aylığın toplamından oluşur. Emeklilik sonrası çalışmaya ait kısmi aylık, emeklilik öncesi ve sonrası prim ödeme gün sayısı toplamı ve emeklilik sonrası çalışmaya ait prime esas kazançları üzerinden bu maddenin birinci fıkrasına göre hesaplanan aylığın emeklilik sonrası prim ödeme gün sayısına orantılı bölümü kadardır. Yeni aylık, eski aylığın kesildiği tarihten sonra aylıklara yapılan artışlar uygulanmak suretiyle bulunan tutarın altında olamaz.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yukarıdaki (a) ve (b) bentlerinde belirtilen 9000 prim gün sayısı, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılanlar için 7200 gün olarak uygulanır.</template>
