            <template>Uygulamaya ilişkin usul ve esaslar Kurum tarafından çıkarılacak yönetmelikle belirlenmek üzere, Türkiye Sağlık Enstitüleri Başkanlığı tarafından desteklenen, Sağlık Bakanlığınca izin ve onay verilen kamu hastaneleri ve devlet üniversitelerinde yapılan klinik araştırmalarda, araştırma ürünlerinin sağlanması hariç olmak üzere, bu madde kapsamında Kurumca finansmanı sağlanan sağlık hizmetleri.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurum, finansmanı sağlanacak sağlık hizmetlerinin teşhis ve tedavi yöntemleri ile (f) bendinde belirtilen sağlık hizmetlerinin türlerini, miktarlarını ve kullanım sürelerini, ödeme usul ve esaslarını Aile ve Sosyal Politikalar Bakanlığı ile Sağlık Bakanlığının görüşünü alarak belirlemeye yetkilidir. Ancak, Aile ve Sosyal Politikalar Bakanlığının görüşünün alınması (f) bendinde belirtilen ortez, protez ve diğer iyileştirici nitelikteki araç ve gereçlerin miktarını, standartlarını, sağlanmasını, uygulanmasını, kullanma sürelerini ve garanti süresi sonrası bakım, onarım ve yenilenmesi hususlarını kapsar. Kurum, bu amaçla komisyonlar kurabilir, ulusal ve uluslararası tüzel kişilerle işbirliği yapabilir. Komisyonların çalışma usul ve esasları Aile ve Sosyal Politikalar Bakanlığı, Maliye Bakanlığı ile Sağlık Bakanlığının görüşü alınarak Kurumca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>60 ıncı maddede sayılan genel sağlık sigortalısı sayılma şartlarının yitirilmesi halinde, devam etmekte olan tedavi nedeniyle sağlanacak sağlık hizmetleri kişinin iyileşmesine kadar sürer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Harp malullüğü kapsamında aylık almakta olan harp malullerinin kendileri ve bunların eşleri, 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanuna veya 2330 sayılı Kanun hükümleri uygulanarak aylık bağlanmasını gerektiren kanunlara göre malullük aylığı almakta olan vazife malullerinin kendileri ile bunların eşleri, bu Kanunun 47 nci maddesi ile 5434 sayılı Kanunun 56 ncı maddesi ve mülga 45 inci maddesi kapsamında vazife malulü olarak aylık almakta olan vazife malullerinden ise başkasının yardımı ve desteği olmaksızın yaşamak için gereken hareketleri yapamayacak derecede malul olanların kendileri ile bunların eşleri, birinci fıkranın (e) bendinin (3) ve (5) numaralı alt bentlerinden muaf tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>60 ıncı maddenin onikinci fıkrası kapsamında genel sağlık sigortalısı sayılanlara bu maddeye göre yöntem, tür, miktar ve kullanım süreleri belirlenen, Kurumca finansmanı sağlanan sağlık hizmetleri dışında sunulan sağlık hizmetlerinin usul ve esasları İçişleri Bakanlığı, Milli Savunma Bakanlığı ve Kurumca müştereken belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar, Aile ve Sosyal Politikalar Bakanlığı ve Sağlık Bakanlığının görüşü üzerine Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="64" başlık="Kurumca finansmanı sağlanmayacak sağlık hizmetleri">
        <mvz-fıkra no="1">
          <template>Kurumca finansmanı sağlanmayacak sağlık hizmetleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Vücut bütünlüğünü sağlamak amacıyla yapılan ve iş kazası ile meslek hastalığına, kazaya, hastalıklara veya konjenital nedenlere bağlı olarak ortaya çıkan durumlarda yapılacak sağlık hizmetleri dışında estetik amaçlı yapılan her türlü sağlık hizmeti ile estetik amaçlı ortodontik diş tedavileri.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Geleneksel, tamamlayıcı, alternatif tıp uygulamaları ve Sağlık Bakanlığınca izin veya ruhsat verilmeyen sağlık hizmetleri ile Sağlık Bakanlığınca tıbben sağlık hizmeti olduğu kabul edilmeyen sağlık hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yabancı ülke vatandaşlarının; genel sağlık sigortalısı veya genel sağlık sigortalısının bakmakla yükümlü olduğu kişi sayıldığı tarihten önce mevcut olan kronik hastalıkları,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>63 üncü maddeye göre yöntem, tür, miktar ve kullanım sürelerinin belirlenmesi sonucunda Kurumca finansmanı sağlanacak sağlık hizmetlerinin kapsamı dışında bırakılan sağlık hizmetleri.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurumla sözleşmeli özel sağlık hizmet sunucuları ile Kurumla kısmi branş veya sağlık hizmeti alım sözleşmesi imzalamış olan vakıf üniversitesi sağlık hizmeti sunucuları, Kuruma bildirmiş oldukları hekimlerden sözleşme kapsamı branşlarda fiilen hizmet sunanlar tarafından verilen sağlık hizmetlerini, Kurumca belirlenen istisnalar hariç olmak üzere ve Kurum mevzuatına uygun olarak fatura edebilirler. Aksi takdirde, bu faturalara ait tutarlar Kurumca karşılanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar Sağlık Bakanlığının uygun görüşü alınarak, Kurumca çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="65" başlık="Yol gideri, gündelik ve refakatçi giderleri">
        <mvz-fıkra no="1">
          <template>Hekimin veya diş hekiminin muayene veya tedavi sonrası tıbben göreceği lüzum üzerine genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin sağlık hizmetinden yararlanmaları için muayene ve tedavi edildikleri yerleşim yeri dışına yapılan sevkinde, ayakta tedavilerde kendisinin ve bir kişi ile sınırlı olmak üzere refakatçisinin gidiş ve dönüş yol gideri ve gündelikleri; yatarak tedavilerde ise gidiş ve dönüş tarihleri için gündelikleri ile yol gideri Kurumca karşılanır.  Bu hüküm, 60 ıncı maddenin onikinci, onüçüncü ve ondördüncü fıkralarında sayılan kişiler için uygulanmaz.  Kurum gerekli gördüğü hallerde bu fıkra gereğince kişilerin ulaşım hizmetlerini, hizmet satın alma ve kiralama gibi usullerle temin etmeye yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin yatarak tedavileri sırasında, hekimin veya diş hekiminin tıbben göreceği lüzum üzerine yanında kalan refakatçinin yatak ve yemek giderleri bir kişi ile sınırlı olmak üzere Kurumca karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yurt içinde veya yurt dışına yapılan sevkler nedeniyle ödenecek gündelik, yol, yatak ve yemek giderlerinin tutarı 72 nci maddede belirtilen Sağlık Hizmetleri Fiyatlandırma Komisyonu tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sürekli iş göremezlik veya malûllük durumlarının tespiti, kontrolü veya periyodik sağlık muayenesi amacıyla yapılan sağlık hizmeti giderleri ile yol ve gündelik giderleri de bu madde hükümlerine göre ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="66" başlık="Yurt dışında tedavi">
        <mvz-fıkra no="1">
          <template>63 üncü maddede sayılan sağlık hizmetlerinin yurt içindeki sağlık hizmet sunucularından sağlanması esastır. Ancak;</template>
          <mvz-bent no="a">
            <template>60 ıncı maddenin birinci fıkrasının (a) bendinin (1) numaralı alt bendinde sayılan genel sağlık sigortalılarından; işverenleri tarafından Kurumca belirlenen usûle uygun olarak veya kamu idareleri için özel mevzuatlarında belirtilen usûle uygun olarak geçici görevle yurt dışına gönderilenlere, acil hallerde,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>60 ıncı maddenin birinci fıkrasının (a) bendinin (1) numaralı alt bendinde sayılan genel sağlık sigortalılarından; işverenleri tarafından Kurumca belirlenen usûle uygun olarak veya kamu idareleri için özel mevzuatlarında belirtilen usûle uygun olarak sürekli görevle yurt dışına gönderilenler ile bunların yurt dışında birlikte yaşadıkları bakmakla yükümlü olduğu kişilere,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Sağlık Bakanlığının uygun görüşü üzerine yurt içinde tedavisinin yapılamadığı tespit edilen kişilerin,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Bu fıkranın (a) ve (b) bentleri kapsamında veya bunların dışında herhangi bir nedenle Kuzey Kıbrıs Türk Cumhuriyetinde bulunan ve Türk vatandaşı olan genel sağlık sigortalılarının ve bakmakla yükümlü olduğu kişilerin,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>60 ıncı maddenin onikinci fıkrası kapsamında genel sağlık sigortalısı sayılanlardan özel mevzuatlarında belirtilen usule uygun olarak sürekli veya geçici görevle gönderilenlere,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>sağlık hizmetleri yurt dışında sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yurt içinde yapılması mümkün olmayan tetkiklerin de yurt dışında yapılması sağlanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ancak, yukarıdaki fıkranın (a) ve (b) bentleri gereği yurt dışında sağlanan sağlık hizmetlerinin Kurumca karşılanacak bedelleri, yurt içinde sözleşmeli sağlık hizmet sunucularına ödenen tutarı geçemez. Bu tutarı aşan kısım işverenler tarafından ödenir. Uluslararası sosyal güvenlik sözleşmeleri hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Cumhurbaşkanı kararı ile birlik halinde ya da kamu idarelerinin yetkili makamlarınca yurt dışına askerî veya güvenlik amaçlı görevlendirilenlerin, bu Kanun kapsamına giren sağlık hizmetlerinin sağlanması ile bu hizmetlere ilişkin giderlerin yurt içindeki sözleşmeli sağlık hizmeti sunucularına ödenen tutarı aşan kısmı, kurumlarınca karşılanır.  Ancak, Kuruma gönderilen sağlık hizmeti faturalarında yer alan işlem bedellerinin ayrıntılı belirtilemediği durumlarda, söz konusu fatura bedelinin yüzde ellisi Kurumca, kalan yüzde ellisi ise kendi kurumlarınca karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kurum, birinci fıkranın (a) ve (b) bentleri kapsamındaki kişilerin sağlık hizmetlerini, bu kişilerin geçici veya sürekli görev süresince genel sağlık sigortası için Kuruma ödenen prim tutarını geçmemek kaydıyla, ilgili ülkede sağlık sigortası yaptırmak suretiyle de sağlayabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Birinci fıkranın (c) bendi gereğince yurt dışına sevk edilen kişilerin sağlık hizmeti bedelinin tümü ödenir. Ancak bu tutar varsa Kurumun yurt dışında sevke konu tedaviye ilişkin sözleşmeli olduğu sağlık hizmet sunucularına ödenen tutarı geçemez. Bu kişilerin 65 inci madde hükümlerine göre yapılacak giderleri ayrıca karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Birinci fıkranın (d) bendi gereğince sağlanan sağlık hizmetlerinin Kurumca karşılanacak bedelleri yurt içinde sözleşmeli sağlık hizmet sunucularına ödenen tutarı geçemez ve bu sağlık hizmet sunucularına ödenen tutarı geçen kısım, birinci fıkranın (a) ve (b) bentleri kapsamında bulunanlara ilişkin hükümler saklı kalmak kaydıyla, kişilerin kendilerince karşılanır. Bu kişilerin 65 inci madde hükümlerine göre yapılacak giderleri karşılanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Yukarıdaki haller dışında, yurt dışında sağlık hizmetlerine ilişkin giderler Kurumca ödenmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Bu maddenin uygulanmasında 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı olması nedeniyle genel sağlık sigortalısı sayılanların daimi olarak altı aydan fazla süreyle yurt dışında görevlendirilmeleri durumu, sürekli görevle yurt dışına gönderilme sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Kamu idarelerinde çalışan sigortalılar dışında 4 üncü maddenin birinci fıkrasının (a) bendi kapsamındaki sigortalıların geçici veya sürekli görevlendirilmesine ilişkin usûller ve süreler ile bu maddenin uygulanmasına ilişkin diğer usûl ve esaslar, ilgili Bakanlıkların görüşü alınarak Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Sağlık Hizmetlerinden Yararlanma Şartları ve Katılım Payı">
      <mvz-madde no="67" başlık="Sağlık hizmetlerinden yararlanma şartları">
        <mvz-fıkra no="1">
          <template>18 yaşını doldurmamış olan kişiler, tıbben başkasının bakımına muhtaç olan kişiler, trafik kazası halleri, acil haller, iş kazası ile meslek hastalığı halleri, bildirimi zorunlu bulaşıcı hastalıklar, madde bağımlılığı tedavisine yönelik sağlık hizmetleri, 63 üncü maddenin birinci fıkrasının (a) ve (c) bentleri gereğince sağlanan sağlık hizmetleri, 75 inci maddede sayılan afet ve savaş ile grev ve lokavt hali hariç olmak üzere sağlık hizmetlerinden ve diğer haklardan yararlanabilmek için;</template>
          <mvz-bent no="a">
            <template>60 ıncı maddenin birinci fıkrasının (c) ve (f) bentleri ile aynı maddenin onikinci, onüçüncü ve ondördüncü fıkraları hariç genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin, sağlık hizmeti sunucusuna başvurduğu tarihten önceki son bir yıl içinde toplam 30 gün genel sağlık sigortası prim ödeme gün sayısının olması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>60 ıncı maddenin birinci fıkrasının (a) bendinin (2) numaralı alt bendi ile (g) bendine tabi olan genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin yukarıdaki bentte sayılan şartla birlikte, sağlık hizmeti sunucusuna başvurduğu tarihte 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 48 inci maddesine göre tecil ve taksitlendirilerek tecil ve taksitlendirmeleri devam edenler hariç 60 günden fazla prim ve prime ilişkin her türlü borcunun bulunmaması,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>60 ıncı maddenin birinci fıkrasının (b) ve (d) bentlerine tabi olan genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin yukarıdaki bentlerde sayılan şartla birlikte, sağlık hizmeti sunucusuna başvurduğu tarihte prim ve prime ilişkin her türlü borcunun bulunmaması,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>60 ıncı maddenin yedinci fıkrasına göre genel sağlık sigortalısı sayılanların, (c) bendinde sayılan şartlarla birlikte, bir eğitim öğretim yılına ilişkin genel sağlık sigortası primlerinin tamamını tescil tarihinden itibaren bir ay içinde ödemeleri,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, genel sağlık sigortalısının bakmakla yükümlü olduğu kişi kapsamından çıkanların genel sağlık sigortalısı olduğu tarihten itibaren otuz gün içinde sağlık hizmetlerinden yararlanabilmesi için bu maddenin birinci fıkrasının (a) bendindeki prim ödeme gün sayısı aranmaz. Ayrıca 60 ıncı madde kapsamında genel sağlık sigortalısı sayılanların;</template>
          <mvz-bent no="a">
            <template>Herhangi bir sebeple silâh altına alınan sigortalının askerlikte geçen hizmet süresi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Hükümlülükle sonuçlanmayan tutuklulukta geçen süre,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İş kazası, meslek hastalığı, hastalık ve analık sigortalarından geçici iş göremezlik ödeneği alan sigortalının iş göremediği süre,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Sigortalının greve iştirak etmesi veya işverenin lokavt yapması hallerinde geçen süre, sağlık hizmeti sunucusuna başvurduğu tarihten önceki son bir yıl içinde toplam 30 gün genel sağlık sigortası primi ödeme gün sayısı hesabında dikkate alınmaz.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ayrıca genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin sağlık hizmetlerinden ve diğer haklardan yararlanabilmeleri için sağlık hizmet sunucularına başvurduklarında acil haller hariç olmak üzere ; biyometrik yöntemlerle kimlik doğrulamasının yapılması ve/veya nüfus cüzdanı, sürücü belgesi, evlenme cüzdanı, pasaport veya Kurum tarafından verilen resimli sağlık kartı belgelerinden birinin gösterilmesi zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>60 ıncı maddenin birinci fıkrasının (a) bendi kapsamında genel sağlık sigortalısı sayılanlar, zorunlu sigortalıklarının sona erdiği tarihten itibaren on gün süreyle genel sağlık sigortasından yararlanırlar. Bu kişilerin sigortalılık niteliğini yitirdikleri tarihten geriye doğru bir yıl içinde 90 günlük zorunlu sigortalılıkları varsa, sigortalılık niteliğini yitirdikleri tarihten itibaren 90 gün süreyle  bakmakla yükümlü olduğu kişiler dahil sağlık hizmetlerinden yararlandırılırlar.  Ayrıca, lise veya dengi öğrenimden mezun olanlar 20 yaşını, yükseköğrenimden mezun olanlar ise 25 yaşını geçmemek ve bakmakla yükümlü olunan kişi ya da 60 ıncı maddenin birinci fıkrasının (g) bendinde sayılanlar hariç genel sağlık sigortalısı olmamak şartıyla mezun oldukları tarihi izleyen günden itibaren iki yıl süreyle, prim borçlarına bakılmaksızın bakmakla yükümlü olunan veya hak sahibi kişi sayılmak suretiyle sağlık hizmetinden faydalandırılır.  60 ıncı maddenin onikinci fıkrası kapsamındaki genel sağlık sigortalılığı sona erenler, terhis tarihinden itibaren 30 gün süreyle genel sağlık sigortasından yararlanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>4 üncü maddenin birinci fıkrasının (a) bendi kapsamındaki sigortalıların 4857 sayılı İş Kanununun 56 ncı ve 74 üncü maddeleri ile diğer iş kanunlarında ücretsiz izin sayılan süreler haricinde ayrıca bir takvim yılı içerisinde toplam bir ayı aşmayan ve işverenlerince belgelendirilen ücretsiz izin sürelerinde genel sağlık sigortalılıkları devam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="68" başlık="Katılım payı alınması">
        <mvz-fıkra no="1">
          <template>63 üncü maddede sayılan sağlık hizmetlerinden katılım payı alınacak olanlar şunlardır:</template>
          <mvz-bent no="a">
            <template>Ayakta tedavide hekim ve diş hekimi muayenesi.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Vücut dışı protez ve ortezler</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Ayakta tedavide sağlanan ilaçlar.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kurumca belirlenecek hastalık gruplarına göre yatarak tedavide finansmanı sağlanan sağlık hizmetleri.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Katılım payı, birinci fıkranın (a) bendindeki sağlık hizmetleri için 20 Türk Lirası olarak uygulanır. Katılım payı, (b) ve (c) bentlerindeki sağlık hizmetleri için gereksiz kullanımı azaltma, sağlık hizmetlerinin niteliği itibarıyla hayati öneme sahip olup olmaması, kişilerin prime esas kazançlarının, gelir ve aylıklarının tutarı ve benzeri ölçütler dikkate alınarak %10 ilâ %20 oranları arasında olmak üzere Kurumca belirlenir.  Yukarıdaki (b) ve (c) bentleri kapsamına giren sağlık hizmetlerinden alınacak katılım payını %1’e kadar indirmeye, Kurumun teklifi üzerine Çalışma ve Sosyal Güvenlik Bakanı yetkilidir. Ayrıca Kurum, birinci fıkranın (c) bendinde belirtilen sağlık hizmetlerinde, aile hekimlerince yazılan reçeteler dâhil olmak üzere reçetede yer alan üç kaleme/üç kutuya kadar ilaç/ilaçlar için 3 Türk Lirası, ilave her bir kalem/kutu ilaç için 1 Türk Lirası olmak üzere katılım payı uygulamaya yetkilidir. Katılım payına ilişkin kutu hesabında enjektable formlar, serum ve beslenme ürünleri ile Kurum tarafından belirlenecek ilaçlar dikkate alınmaz. Kurum, birinci fıkranın (a) bendi gereği belirlediği katılım payını; birinci basamak sağlık hizmeti sunucularında yapılan muayenelerde almamaya ya da daha düşük tutarlarda belirlemeye veya tekrar birinci fıkranın (a) bendi için belirlenen tutara getirmeye, ikinci ve üçüncü basamak sağlık hizmet sunucularında yapılan muayenelerde ise müracaat edilen sağlık hizmeti sunucusunun yer aldığı basamak, sağlık hizmeti sunucusunun resmi ve özel sağlık hizmeti sunucusu niteliğinde olup olmaması, önceki basamaklardan sevkli olarak başvurulup başvurulmadığı gibi hususları göz önünde bulundurarak on katına kadar artırmaya, birinci basamak sağlık hizmeti sunucularından sevk edilenler için yarısına kadar azaltmaya ve sağlık hizmeti sunucuları için farklı belirlemeye yetkilidir. Birinci fıkranın (d) bendinde belirtilen sağlık hizmetleri bedelinin %1’ine kadar katılım payı alınabilir. %1’ine kadar tespit edilen katılım payını almamaya, yarısına kadar indirmeye Kurum yetkilidir.  Bu fıkrada belirtilen 1 Türk lirası, 20 Türk lirası ve 3 Türk lirası, 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanunu uyarınca belirlenen yeniden değerleme oranı kadar her yıl artırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin birinci fıkranın (b) bendi gereği ödeyecekleri katılım payının tutarı, sağlık hizmetinin alındığı tarihteki asgarî ücretin %75’ini, (d) bendi gereği ödeyecekleri katılım payının tutarı ise bir takvim yılında asgari ücret tutarını geçmemek kaydıyla her bir yatarak tedavi için asgari ücretin dörtte birini geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>63 üncü maddenin birinci fıkrasının (e) bendi gereğince sağlanan ve bir hastalığın tedavisinin başka tıbbi bir yöntemle mümkün olmaması nedeniyle yapılacak yardımcı üreme yöntemi tedavisi dışındaki, yardımcı üreme yöntemi tedavisinde katılım payı ilk denemede %30, ikinci denemede %25, üçüncü denemede %20 oranında uygulanır. Ancak katılım payında dördüncü fıkra gereği uygulanan üst limit dikkate alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>60 ıncı maddenin birinci fıkrasının (c) bendinin (1), (2) ve (3) numaralı alt bentleri gereği genel sağlık sigortalısı sayılanlar ile bunların bakmakla yükümlü olduğu kişilerin ödemiş oldukları katılım payları, talepleri halinde, 29/5/1986 tarihli ve 3294 sayılı Sosyal Yardımlaşma ve Dayanışmayı Teşvik Kanunu hükümlerine göre kendilerine geri ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Katılım paylarını, gelir veya aylık alan kişilerin gelir veya aylıklarından, çalışanların ücret veya maaşlarından mahsup edilmek suretiyle veya eczaneler ile diğer kurum ve kuruluşlar aracılığı ile tahsile ve katılım paylarının ödenme usulünü belirlemeye Kurum yetkilidir. Sözleşmeli sağlık hizmeti sunucularına, tahsil ettikleri katılım payı düşüldükten sonra kalan tutar ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Katılım paylarının hesaplanmasında 72 nci maddeye göre tespit edilen sağlık hizmeti tutarları esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Katılım paylarının ödenme usûlleri ile bu maddenin uygulanmasına ilişkin diğer usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="69" başlık="Katılım payı alınmayacak haller, sağlık hizmetleri ve kişiler">
        <mvz-fıkra no="1">
          <template>68 inci maddede sayılan sağlık hizmetlerinden katılım payı alınmayacak haller, sağlık hizmetleri ve kişiler şunlardır:</template>
          <mvz-bent no="a">
            <template>İş kazası ile meslek hastalığı halleri ile askerî tatbikat ve manevralarda sağlanan sağlık hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>75 inci maddede yer alan afet ve savaş hali nedeniyle sağlanan sağlık hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Aile hekimi muayeneleri ve kişiye yönelik koruyucu sağlık hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Sağlık raporu ile belgelendirilmek şartıyla; Kurumca belirlenen kronik hastalıklar ve hayati önemi haiz 68 inci maddenin birinci fıkrasının (b) bendi kapsamındaki sağlık hizmetleri ile organ, doku ve kök hücre; nakli.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>94 üncü maddede tanımlanan kontrol muayeneleri,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>60 ıncı maddenin birinci fıkrasının (c) bendinin (4) numaralı alt bendinde belirtilen kişiler ile bunların eşleri, (6) ve (8) numaralı alt bentlerinde sayılanlar ile bunların bakmakla yükümlü olduğu kişiler, (5) ve (7) numaralı alt bentlerinde sayılanlar, vazife malulleri ile 4 üncü maddenin dördüncü fıkrasının (d), (e) ve (f) bentlerinde sayılanlar.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>3713 sayılı Kanunun 21 inci maddesinde sayılan olaylara maruz kalmaları nedeniyle yaralananların tedavileri sonuçlanıncaya veya maluliyetleri kesinleşinceye kadar sağlanacak sağlık hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>60 ıncı maddenin onikinci, onüçüncü ve ondördüncü fıkraları kapsamında genel sağlık sigortalısı sayılanlar.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu madde gereğince katılım payı alınmayacak sağlık hizmetlerini tek tek veya gruplandırarak tespite Kurum yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="70" başlık="Hizmet basamakları ve sevk zinciri">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanması bakımından sağlık hizmeti sunucuları birinci, ikinci ve üçüncü basamak olarak Sağlık Bakanlığı tarafından basamaklandırılır. Bu basamaklar ve sağlık hizmet sunucuları arasında sevk zinciri; tanı, ön tanı, hekimlerin ve diş hekimlerinin uzmanlıkları dikkate alınmak suretiyle tüm yurtta veya il ya da ilçe bazında Sağlık Bakanlığının görüşü alınarak Kurum tarafından belirlenir. Aile hekimleri birinci basamak hizmet sunucuları içinde yer alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurumca sağlık hizmetlerinin sağlanabilmesi için, genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişiler sevk zinciri kurallarına uygun hareket etmek zorundadır.  60 ıncı maddenin birinci fıkrasının (c) bendinin (1) ve (3) numaralı alt bentlerinde sayılanlar ile aynı maddenin onikinci, onüçüncü ve ondördüncü fıkraları kapsamında genel sağlık sigortalısı sayılanların, Kurumla sözleşmeli üniversite ve istisnai hallerde özel sağlık hizmeti sunucularına müracaat edebilme koşulları ile uygulamaya ilişkin usul ve esaslar Kurum tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="71" başlık="Kimlik tespiti ve acil haller">
        <mvz-fıkra no="1">
          <template>Sağlık hizmeti sunucuları, genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilere sağlık hizmeti sunumu aşamasında (acil hallerde ise acil halin sona ermesinden sonra), 67 nci maddenin üçüncü fıkrasında sayılan belgeleri ve bu belgelerin başvuran kişiye ait olup olmadığını kontrol etmek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin kendi adına bir başkasının sağlık hizmeti almasını veya Kurumdan haksız bir menfaat temin etmesini sağlaması yasaktır. Bu fiilleri işleyenlerden Kurumun uğradığı zararın iki katı kanunî faiziyle birlikte müştereken ve müteselsilen tahsil edilir ve ilgililer hakkında 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanunu hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunun uygulamasında acil hallerin ve acil sağlık hizmetlerinin neler olduğuna, hangi yöntem ve ölçütlerle tespit edileceğine ilişkin hususlar, Sağlık Bakanlığının uygun görüşü üzerine Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Malî ve Çeşitli Hükümler">
      <mvz-madde no="72" başlık="Sağlık hizmetlerinin ödenecek bedellerinin belirlenmesi">
        <mvz-fıkra no="1">
          <template>65 inci madde gereği ödenecek gündelik, yol, yatak ve yemek giderlerinin Kurumca ödenecek bedellerini belirlemeye Sağlık Hizmetleri Fiyatlandırma Komisyonu yetkilidir. Komisyon, tıp eğitimini, hizmet basamağını, alt yapı ve kaynak kullanımı ile maliyet unsurlarını dikkate alarak sağlık hizmeti sunucularını fiyatlandırmaya esas olmak üzere ayrı ayrı sınıflandırabilir. Komisyon, 63 üncü madde hükümlerine göre finansmanı sağlanan sağlık hizmetlerinin Kurumca ödenecek bedellerini; sağlık hizmetinin sunulduğu il ve basamak, Devletin doğrudan veya dolaylı olarak sağlamış olduğu sübvansiyonlar, sağlık hizmetinin niteliği itibarıyla hayati öneme sahip olup olmaması, kanıta dayalı tıp uygulamaları, maliyet-etkililik ölçütleri ve genel sağlık sigortası bütçesi dikkate alınmak suretiyle, her sınıf için tek tek veya gruplandırarak belirlemeye yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Komisyon; Bakanlık, Maliye, Sağlık ve Kalkınma bakanlıkları, Hazine Müsteşarlığı, üniversite sağlık hizmeti sunucuları ile özel sağlık hizmeti sunucularını temsilen Bakanlıkça belirlenecek birer üye ve Kurumu temsilen iki üye olmak üzere toplam dokuz üyeden oluşur. Komisyon kararlarını salt çoğunluk ile alır. Komisyon kararları Resmî Gazete’de yayımlanır. Komisyonca gerekli görülen hâllerde sağlık hizmetlerinin türlerine göre birden fazla alt komisyon kurulabilir. Komisyonun sekretarya işlemleri Kurumca yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sağlık Hizmetleri Fiyatlandırma Komisyonuna iştirak edenlere, ayda iki defadan fazla olmamak üzere katıldıkları her toplantı günü için 3000 gösterge rakamının memur aylık katsayısı ile çarpılarak bulunacak tutarı üzerinden toplantı ücreti ödenir. Komisyon çalışmaları ile ilgili her türlü giderler Kurumca ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kurum, ilgili kamu kurum ve kuruluşları ile dernek, vakıf, federasyon, konfederasyon ve kamu kurumu niteliğindeki meslek kuruluşlarının görüşlerini alabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sağlık Hizmetleri Fiyatlandırma Komisyonunun çalışmasına, görev ve yetkileri ile bu maddenin uygulanmasına ilişkin diğer usûl ve esaslar, Komisyon üyesi kurumların görüşleri alınarak Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu maddenin üçüncü fıkrasında belirtilenler hariç olmak üzere 63 üncü maddede belirtilen komisyonlara iştirak edenler ile bilimsel ve akademik nitelikleri dikkate alınarak Kurum tarafından bilimsel nitelikli komisyonlarda veya tıbbi inceleme, tıbbi değerlendirme, tıbbi uygunluk onayı verme gibi iş ve işlemlerle ilgili yürütülen çalışmalarda; üniversitelerden görevlendirilen öğretim üyelerine, kamu ve özel sağlık kurum ve kuruluşlarından görevlendirilen tabip, diş tabibi ve eczacılara 6.500 gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarı geçmemek üzere ödeme yapılır. Bu ödemenin usul, esas ve miktarı ile diğer hususlar Kurum ve Maliye Bakanlığınca müştereken belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="73" başlık="Sağlık hizmetlerinin sağlanma yöntemi ve sağlık giderlerinin ödenmesi">
        <mvz-fıkra no="1">
          <template>Bu Kanuna göre sağlık hizmetleri, Kurum ile yurt içindeki veya yurt dışındaki sağlık hizmeti sunucuları arasında yapılan sözleşmeler yoluyla ve/veya bu Kanun hükümlerine uygun olarak genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin sözleşmesiz sağlık hizmeti sunucularından satın aldıkları sağlık hizmeti giderlerinin ödenmesi suretiyle sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu idaresi sağlık hizmeti sunucuları dışındaki vakıf üniversiteleri dahil sözleşmeli sağlık hizmeti sunucularınca, Sağlık Hizmetleri Fiyatlandırma Komisyonunca belirlenen sağlık hizmetleri bedeline ek olarak, genel sağlık sigortalısı ve bakmakla yükümlü oldukları kişilerden sağlık hizmeti sunucularının giderleri ve ürettikleri sağlık hizmetlerinin maliyetleri, yapılan sübvansiyonlar gibi kriterler dikkate alınarak bu bedellerin iki katına kadar alınabilecek ilave ücretin tavanını belirlemeye Cumhurbaşkanı yetkilidir. Bu tavan dahilinde alınabilecek ilave ücret oranları Kurumca belirlenir. Ancak  60 ıncı maddenin birinci fıkrasının (c) bendinin (4), (6) ve (8) numaralı alt bentleri kapsamında sayılanlar ile bakmakla yükümlü oldukları kişiler ile aynı maddenin onikinci, onüçüncü ve ondördüncü fıkraları kapsamında genel sağlık sigortalısı sayılan kişilerden ilave ücret alınamaz. Sağlık Hizmetleri Fiyatlandırma Komisyonunca belirlenen eşdeğer ilaçların, azami fiyatı ile kişinin talep ettiği eşdeğer ilacın fiyatı arasında oluşacak fark ve optik için tavan uygulanmaz ve bu fıkra kapsamında değerlendirilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu idaresi sağlık hizmeti sunucuları ise otelcilik hizmeti ile dördüncü fıkrada belirtilen istisnai sağlık hizmetleri dışında, sağladıkları sağlık hizmetleri için genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerden ilave ücret talep edemez.    Ancak yükseköğretim kurumlarına ait sağlık hizmeti sunucularında öğretim üyeleri tarafından mesai saatleri dışında bizzat verilen sağlık hizmetleri için Kurumca belirlenmiş sağlık hizmetleri bedelinin, poliklinik muayenelerinde bir katını, diğer hizmetlerde yüzde ellisini geçmemek üzere, üniversite yönetim kurulu kararıyla öğretim üyelerinin unvanları itibarıyla belirlenen miktarda ilave ücret alınabilir. Ancak alınacak ilave ücret bir defada asgari ücretin iki katını geçemez. Bu oranları bir katına kadar artırmaya Cumhurbaşkanı yetkilidir. Kurum bu fıkra kapsamında ilave ücret alınamayacak sağlık hizmetlerini belirlemeye yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sözleşmeli sağlık hizmeti sunucuları, Kurumca belirlenmiş standartların üstündeki talepleri karşılayan otelcilik hizmetleri ile hayati öneme sahip olmama ve alternatif tedavilerin bulunması gibi hususlar göz önüne alınarak Sağlık Hizmetleri Fiyatlandırma Komisyonu tarafından belirlenen istisnai sağlık hizmetleri için, genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerden belirlenen hizmet fiyatlarının üç katını geçmemek üzere ilâve ücret alabilir. Sözleşmeli sağlık hizmeti sunucuları, Kurumca ödenecek sağlık hizmeti bedellerinin yayımlanmasını takiben otuz gün içinde ilâve ücret ödemeleri için belirlenen tavanlar dahilinde belirledikleri sağlık hizmeti fiyatlarını kuruma bildirmek zorundadır. Sözleşmeli sağlık hizmeti sunucuları fiyat değişikliklerini 5 iş günü içinde Kuruma bildirirler. Tavanlar dahilinde de olsa Kurumca belirlenen süreden önce bu fiyatlarını artıramazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kurum, provizyon işlemlerini yürütmek üzere sağlık hizmeti sunucularının mahallinde provizyon merkezi açabilir ve personel çalıştırabilir. Sözleşmeli sağlık hizmeti sunucuları, bu amaçla Kuruma uygun bağımsız mekân tahsis etmek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Acil haller dışında sözleşmesiz sağlık hizmeti sunucularından kişilerce satın alınan sağlık hizmeti bedelleri Kurumca ödenmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Sözleşmesiz sağlık hizmeti sunucularından acil hallerde alınan sağlık hizmeti bedeli, 72 nci madde gereği sözleşmeli sağlık hizmeti sunucuları için belirlenen bedeller esas alınarak genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilere fatura karşılığı ödenir. Sözleşmeli ve sözleşmesiz sağlık hizmeti sunucuları, acil hallerde, sözleşmeli sağlık hizmetleri sunucuları ise Kurumun belirlediği sağlık hizmetleri için genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerden veya Kurumdan herhangi bir ilave ücret talep edemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Kurum, bu Kanunun birinci fıkrasında belirtilen yöntemler dışında, kamu idarelerince verilecek sağlık hizmetlerini götürü bedel üzerinden hizmet alım sözleşmesiyle de sağlamaya yetkilidir. Kamu idaresi sağlık hizmeti sunucuları, sözleşmede belirtilen götürü bedel karşılığında genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilere sözleşme kapsamında verilmesi gereken her türlü sağlık hizmetini sunmakla yükümlüdür ve sözleşmede belirtilen götürü bedel dışında Kurumdan veya genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerden Kanunda belirtilen ilave ücretler ve katılım payları dışında ayrıca bir bedel talep edemez. Götürü bedel üzerinden hizmet alım sözleşmesiyle temin edilen hizmetler için Kuruma ayrıca fatura ve dayanağı belge gönderilmez. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Sağlık Bakanlığı ile müştereken belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Sağlık hizmeti sunucuları, genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin sağlık hizmetlerinden yararlanmaya müstahak olup olmadığını, Kurumun elektronik veya diğer ortamlarda sağlayacağı yöntemlere uygun olarak kontrol etmek ve belgelemek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>3713 sayılı Kanuna göre aylık bağlanmış maluller, 5434 sayılı Kanunun 56 ncımaddesi veya 2330 sayılı Kanunun 2 nci maddesinin birinci fıkrasının (e) ve (f) bentlerinde sayılanlardan 3713 sayılı Kanun kapsamına giren olaylar sebebiyle aylık bağlananlar ile 3713 sayılı Kanun kapsamına girmese dahi başkasının yardımı ve desteği olmaksızın yaşamak için gereken hareketleri yapamayacak derecede malul olan vazife ve harp malullerinin sağlık kurulu raporuyla ihtiyaç duydukları her türlü ortez/protez ve diğer iyileştirici araç ve gereçler herhangi bir kısıtlama getirilmeksizin Kurumca karşılanır.  3713 sayılı Kanun kapsamına girmese dahi atış, tatbikat veya diğer ateşli silah yaralanmaları nedeniyle malul olan vazife ve harp malullerinin de sağlık kurulu raporuyla ihtiyaç duydukları her türlü ortez, protez ve diğer iyileştirici araç ve gereçler herhangi bir kısıtlama getirilmeksizin Sosyal Güvenlik Kurumunca karşılanır.  Ancak, 72 nci maddede belirtilen usullere göre bedelleri karşılanacak olan bu kapsamdaki ürünler, garanti süresi kapsamında veya aynı amaca yönelik ürün talepleri Kurum tarafından yayınlanan ürün listelerinden, yine Kurum tarafından belirlenen usul ve esaslara göre karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Genel sağlık sigortalısı ile bakmakla yükümlü olduğu kişilerden, 3713 sayılı Kanunun 21 inci maddesinde sayılan olaylara maruz kalmaları nedeniyle yaralananlar, tedavileri sonuçlanıncaya veya maluliyetleri kesinleşinceye kadar geçen süre içerisinde verilen sağlık hizmetleri ve diğer haklardan aynı Kanuna göre aylık bağlanmış olanlar gibi yararlandırılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>Kurum, fatura denetimi konusunda kriterler koymaya, alternatif geri ödeme modelleri oluşturmaya ve bu konularda tespitler ve denetimler yapmaya ve/veya yaptırmaya, buna bağlı olarak hizmet alımı yapmaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Kurum, gerçek veya tüzel kişilerden; ödeme kapsamındaki sağlık hizmetleri ve/veya ürün listelerine girmek için yapılan başvurulardan asgari ücretin yirmi katını geçmemek üzere başvuru ücreti, ilaç hariç olmak üzere diğer tıbbi malzeme ve ürünlerden listelerde kalmak için asgari ücretin üç katını geçmemek üzere yıllık aidat, fiyat düşüş talepleri hariç olmak üzere listelerdeki değişiklik taleplerinden her bir işlem için asgari ücret tutarını geçmemek üzere işlem ücreti, kamu kurumu niteliğinde tüzel kişiliği haiz meslek kuruluşları ile yapılan protokollere dayalı sözleşmeler hariç olmak üzere sözleşme imzalamak için asgari ücretin on katını geçmemek üzere sözleşme ücreti alabilir, bu ücretleri imal ve ithal ürün gruplarına göre farklılaştırabilir. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Kurumca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="14">
          <template>Sağlık hizmeti satın alma sözleşmelerinin hazırlanması ve akdedilmesi, sağlık hizmeti giderlerinin ödenmesi ve bu maddenin uygulanmasına ilişkin diğer usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="74" başlık="Genel sağlık sigortası gelirlerinin kullanım amacı, kısa ve uzun vadeli sigorta kolları için yapılan sağlık harcamaları">
        <mvz-fıkra no="1">
          <template>Genel sağlık sigortası prim gelirleri; yönetim giderleri, genel sağlık sigortasından sağlanan sağlık hizmetleri ve diğer haklar dışında başka bir amaçla kullanılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Uzun ve kısa vadeli sigorta kolları bakımından sürekli iş göremezlik, malûllük, çalışma gücü kaybı hallerinin tespiti veya bu amaçla yapılan kontroller nedeniyle oluşan sağlık hizmeti giderleri ile 72 nci maddeye göre, usûl ve esasları Kurumca belirlenecek gündelik ve yol giderleri, refakatçı giderleri, kısa ve uzun vadeli sigorta kolları prim gelirlerinden karşılanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="75" başlık="Doğal afetler veya savaş hali">
        <mvz-fıkra no="1">
          <template>15/5/1959 tarihli ve 7269 sayılı Umumi Hayata Müessir Afetler Dolayısiyle Alınacak Tedbirlerle Yapılacak Yardımlara Dair Kanun kapsamındaki afetler ile 4/11/1983 tarihli ve 2941 sayılı Seferberlik ve Savaş Hali Kanunu gereğince ilân edilen savaş halinde genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin sağlık hizmetleri Kurum tarafından sağlanmaya devam edilir. Ancak, afet veya savaş hallerine bağlı nedenlerden dolayı Kurumca yapılan sağlık hizmeti giderleri, giderlerin ödendiği takvim yılı sonu esas alınarak genel bütçeden Kuruma bir yıl içinde transfer edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="76" başlık="İşverenin, genel sağlık sigortalısının ve üçüncü kişilerin sorumluluğu">
        <mvz-fıkra no="1">
          <template>İşveren, iş kazasına uğrayan veya meslek hastalığına tutulan genel sağlık sigortalısına sağlık durumunun gerektirdiği sağlık hizmetlerini derhal sağlamakla yükümlüdür. Bu amaçla işveren tarafından yapılan ve belgelere dayanan sağlık hizmeti giderleri ve 65 inci madde hükümlerine göre yapılacak masraflar Kurum tarafından karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkrada belirtilen yükümlülüklerin yerine getirilmesindeki ihmalinden veya gecikmesinden dolayı, genel sağlık sigortalısının tedavi süresinin uzamasına veya malûl kalmasına veya malûllük derecesinin artmasına sebep olan işveren, Kurumun bu nedenle yaptığı her türlü sağlık hizmeti giderini ödemekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlgili kanunları gereğince sağlık raporu alınması gerektiği halde sağlık raporuna dayanmaksızın veya alınan raporlarda söz konusu işte çalışması tıbbî yönden elverişli olmadığı belirtildiği halde genel sağlık sigortalısını çalıştıran işverenlere, bu nedenle Kurumca yapılan sağlık hizmeti giderleri tazmin ettirilir. Sağlık kurulu raporu ile belli bir işte çalışamayacağı belgelenen 4 üncü maddenin birinci fıkrasının (a) bendi kapsamındaki kişiler bu işte çalıştırılamaz. Bu kişileri çalıştıran işverenler, genel sağlık sigortalısının aynı hastalık sebebiyle Kurumca yapılan masraflarını ödemekle yükümlüdür. Tedavinin sona erdiğine ve çalışılabilir durumda olduğuna dair Kurumca yetkilendirilen hekim veya sağlık kurullarından belge almaksızın başka işte çalışan genel sağlık sigortalısının aynı hastalığı sebebiyle yapılan tedavi masrafları ise kendisinden alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İş kazası ile meslek hastalığı, işverenin kastı veya genel sağlık sigortalısının iş sağlığını koruma ve iş güvenliği ile ilgili mevzuat hükümlerine aykırı hareketi sonucu olmuşsa, Kurumca yapılan sağlık hizmeti giderleri işverene tazmin ettirilir. İşverenin sorumluluğunun tespitinde kaçınılmazlık ilkesi dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Genel sağlık sigortalısına ve bunların bakmakla yükümlü olduğu kişilere kastı veya suç sayılır bir hareketi veya ilgili kanunlarla verilmiş bir görevi yapmaması ya da ihmali nedeniyle Kurumun sağlık hizmeti sağlamasına veya bu kişilerin tedavi süresinin uzamasına sebep olduğu mahkeme kararıyla tespit edilen üçüncü kişilere, Kurumun yaptığı sağlık hizmeti giderleri tazmin ettirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="77" başlık="Sözleşmeli sağlık hizmeti sunucularının duyurulması ve sağlık hizmet sunucusunu seçme serbestisi">
        <mvz-fıkra no="1">
          <template>Bu Kanun gereğince genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin sağlık hizmetinden yararlanmak için başvuracakları yurt içinde veya yurt dışındaki sözleşmeli sağlık hizmeti sunucularının unvan, isim ve adresleri Kurumca elektronik ortamda veya diğer yöntemlerle duyurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel sağlık sigortalıları ve bakmakla yükümlü olduğu kişiler, sağlık hizmeti sunucuları arasından, genel sağlık sigortasıyla ilgili diğer madde hükümlerine uymak şartıyla istediğini seçme hakkına sahiptir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="78" başlık="Sağlık hizmeti sunucularının kayıt ve bildirim zorunluluğu ve kontrol yetkisi">
        <mvz-fıkra no="1">
          <template>Kurum ile sözleşmesi olan, tüm sağlık hizmeti sunucuları, sağlık hizmeti sunduğu tüm kişilere ait sözleşme hükümlerinde yer verilen bilgileri, belirlenen yöntemlere ve süreye uygun biçimde elektronik ortamda veya yazılı olarak Kuruma göndermek zorundadır. Bu bilgiler gönderilmeksizin talep edilen sağlık hizmeti bedelleri, bilgiler gönderilinceye kadar ödenmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişinin sağlık bilgilerinin gizliliği esastır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kurum, genel sağlık sigortası hükümlerinin uygulanmasıyla ilgili olarak işverenler, sağlık hizmeti sunucuları ve diğer gerçek ve tüzel kişiler nezdindeki defter, belge ve bilgileri inceleyebilir, ibrazını isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kurum, bu Kanunda belirtilen görevleriyle ilgili olarak sağlık hizmeti sunucularının yürüttüğü hizmet ve işlemleri kontrol yetkisine sahiptir. Kurum, bu yetkisini görevlendirdiği personeli vasıtasıyla veya kamu kurumları ve özel kurumlardan hizmet satın almak suretiyle kullanabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Primlere İlişkin Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Prim Alınması, Prime Esas Kazanç, Prim Oranları ve Asgarî İşçilik">
      <mvz-madde no="79" başlık="Prim alınması zorunluluğu">
        <mvz-fıkra no="1">
          <template>Kısa ve uzun vadeli sigortalar ile genel sağlık sigortası için, bu Kanunda öngörülen her türlü ödemeler ile yönetim giderlerini karşılamak üzere Kurum prim almak, ilgililer de prim ödemek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurumca tahsil edilen genel sağlık sigortası primleri, tahsil edilmesini müteakip doğrudan Kurum bütçesinin genel sağlık sigortası kalemine aktarılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="80" başlık="Prime esas kazançlar">
        <mvz-fıkra no="1">
          <template>4 üncü maddenin birinci fıkrasının (a) bendi kapsamındaki sigortalıların prime esas kazançları aşağıdaki şekilde belirlenir.</template>
          <mvz-bent no="a">
            <template>Prime esas kazançların hesabında;</template>
            <mvz-altbent no="1">
              <template>Hak edilen ücretlerin,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Prim, ikramiye ve bu nitelikteki her çeşit istihkaktan o ay içinde yapılan ödemelerin ve işverenler tarafından sigortalılar için özel sağlık sigortalarına ve bireysel emeklilik sistemine ödenen tutarların,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>İdare veya yargı mercilerince verilen karar gereğince yukarıdaki (1) ve (2) numaralı alt bentlerde belirtilen kazançlar niteliğinde olmak üzere sigortalılara o ay içinde yapılan ödemelerin,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="0">
            <template>brüt toplamı esas alınır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Aşağıda sayılan;</template>
            <mvz-altbent no="1">
              <template>Ayni yardımlar,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Ölüm, doğum, evlenme yardımları,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Görev yollukları,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>Seyyar görev, kıdem, ihbar ve kasa tazminatı,</template>
            </mvz-altbent>
            <mvz-altbent no="5">
              <template>İş sonu tazminatı veya kıdem tazminatı mahiyetindeki toplu ödemeler,</template>
            </mvz-altbent>
            <mvz-altbent no="6">
              <template>Keşif ücreti,</template>
            </mvz-altbent>
            <mvz-altbent no="7">
              <template>Kurumca tutarları yıllar itibarıyla belirlenecek çocuk ve aile zamları,</template>
            </mvz-altbent>
            <mvz-altbent no="8">
              <template>İşverenler tarafından sigortalılar için özel sağlık sigortalarına ve bireysel emeklilik sistemine ödenen ve aylık toplamı asgari ücretin %30’unu geçmeyen özel sağlık sigortası primi ve bireysel emeklilik katkı payları tutarları,</template>
            </mvz-altbent>
            <mvz-altbent no="9">
              <template>İşverence işyerinde veya müştemilatında yemek verilmeyen durumlarda, çalışılan günlere ait bir günlük yemek bedelinin 300 Türk lirasına kadar olan kısmı,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="0">
            <template>prime esas kazanca tabi tutulmaz. (9) numaralı alt bentte belirtilen tutar, her yıl bir önceki yıla ilişkin olarak 213 sayılı Kanunun mükerrer 298 inci maddesinin (B) fıkrasına göre belirlenen yeniden değerleme oranında artırılmak suretiyle uygulanır. Bu şekilde hesaplanan tutarın %5’ini aşmayan kesirler dikkate alınmaz.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>(b) bendinde belirtilen istisnalar dışında her ne adla yapılırsa yapılsın tüm ödemeler ile ayni yardım yerine geçmek üzere yapılan nakdi ödemeler prime esas kazanca tabi tutulur. Diğer kanunlardaki prime tabi tutulmaması gerektiğine dair muafiyet ve istisnalar bu Kanunun uygulanmasında dikkate alınmaz.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Ücretler hak edildikleri aya mal edilmek suretiyle prime tabi tutulur. Diğer ödemeler ise öncelikle ödendiği ayın kazancına dahil edilir ve ücret dışındaki bu ödemelerin yapıldığı ayda üst sınırın aşılması nedeniyle prime tabi tutulamayan kısmı, ödemenin yapıldığı ayı takip eden aydan başlanarak iki ayı geçmemek üzere üst sınırın altında kalan sonraki ayların prime esas kazançlarına ilâve edilir. Toplu iş sözleşmelerine tabi işyerleri işverenlerince veya kamu idareleri veya yargı mercilerince verilen kararlara istinaden, sonradan ödenen ücret dışındaki ödemelerin hizmet akdinin mevcut olmadığı veya askıda olduğu bir tarihte ödenmesi durumunda, 82 nci madde hükmü de nazara alınmak suretiyle prime esas kazancın tabi olduğu en son ayın kazancına dahil edilir. Bu durumlarda sigorta primlerinin, yukarıda belirtilen mercilerin kararlarının kesinleşme tarihini izleyen ayın sonuna kadar ödenmesi halinde, gecikme cezası ve gecikme zammı alınmaz ve 102 nci madde hükümleri uygulanmaz.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Saatlik, günlük, haftalık veya aylık olarak belirli bir ücrete dayanmış olmayıp da komisyon ücreti ve kâra katılma gibi belirsiz zaman ve tutar üzerinden ücret alan sigortalıların prim ve ödeneklerinin hesabında esas tutulacak günlük kazançları, 82 nci madde hükmüne göre belirlenen alt sınırdır.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Bir işverene tabi olarak çalışan sigortalının belirli ücretinin dışında ayrıca (e) bendi kapsamında ücret alması halinde, prime esas günlük kazancı bunların toplamından oluşur.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Primlerin hesabına esas tutulacak günlük kazanç, sigortalının, bir ay için prime esas tutulan kazancının otuzda biridir. Ancak günlük kazancın hesabına esas tutulan ay içindeki bazı günlerde çalışmamış ve çalışmadığı günler için ücret almamış sigortalının günlük kazancı, o ay için prime esas tutulan kazancının ücret aldığı gün sayısına bölünmesi suretiyle hesaplanır.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Sigortalıların günlük kazançlarının hesabında esas tutulan gün sayıları, aynı zamanda, bunların prim ödeme gün sayılarını gösterir. Ancak, işveren ve sigortalı arasında kısmî süreli hizmet akdinin yazılı olarak yapılmış olması kaydıyla, ay içerisinde günün bazı saatlerinde çalışan ve çalıştığı saat karşılığında ücret alan sigortalının ay içindeki prim ödeme gün sayısı, ay içindeki toplam çalışma saati süresinin 4857 sayılı İş Kanununa göre belirlenen haftalık çalışma süresine göre hesaplanan günlük çalışma saatine bölünmesi suretiyle bulunur. Bu şekildeki hesaplamada gün kesirleri bir gün kabul edilir.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>İşveren ve sigortalı arasında çağrı üzerine çalışmaya dayalı yazılı iş sözleşmesinde taraflar arasında çalışma süresi gün, hafta ve ay olarak belirlenmemiş ise, sigortalının ay içindeki prim ödeme gün sayısı haftalık çalışma süresi en az yirmi saat kararlaştırılmış sayılarak (h) bendi hükmüne göre hesaplanır.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>88 inci maddenin dördüncü fıkrasına göre ay içerisinde 30 günden az prim ödeme gün sayılarına ait eksik günlerin genel sağlık sigortası primleri, eksik çalışma süreleri dikkate alınmak suretiyle hesaplanır.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Milli Eğitim Bakanlığına bağlı her derece ve türdeki örgün ve yaygın eğitim kurumlarında ek ders ücreti karşılığında ilgili mevzuatı çerçevesinde uzman ve usta öğretici olarak çalıştırılanların prim ödeme gün sayısı 30 günü aşmamak kaydıyla, bir takvim ayı içerisinde hak kazandıkları brüt ek ders ücreti toplam tutarının, prime esas günlük kazanç alt sınırına bölünmesi sonucu bulunur. Bu şekilde yapılacak hesaplamalarda tam sayıdan sonraki küsuratlar dikkate alınmaz.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>yükseköğrenimleri sırasında staja tabi tutulan öğrenciler, kamu kurum ve kuruluşları tarafından desteklenen projelerde görevli bursiyerler ve 2547 sayılı Kanunun 46 ncı maddesine tabi olarak kısmi zamanlı çalıştırılan öğrencilerden aylık prime esas kazanç tutarı 82 nci maddeye göre belirlenen günlük prime esas kazanç alt sınırının otuz katından fazla olmayanlar ile kursiyerlerin prime esas günlük kazançlarının hesaplanmasında prime esas günlük kazanç alt sınırı dikkate alınır.  Aday çırak, çırak, işletmelerde mesleki eğitim, mesleki ve teknik ortaöğretim sırasında staj, tamamlayıcı eğitim ya da alan eğitimi gören öğrencilerin prime esas kazançları ilgili kanunlarında öngörüldüğü şekilde belirlenir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>4 üncü maddesinin birinci fıkrasının (b) bendi kapsamındaki sigortalıların prime esas kazançları aşağıdaki şekilde belirlenir.</template>
          <mvz-bent no="a">
            <template>Aylık prime esas kazanç, 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırı ile üst sınırı arasında kalmak şartı ile kendileri tarafından beyan edilecek günlük kazancın otuz katıdır. Bu sigortalılar tarafından Kurumca belirlenen sürelerde aylık prime esas kazanç beyan edilir. Beyanda bulunmayan sigortalıların aylık prime esas kazancı, prime esas günlük kazanç alt sınırının otuz katı olarak belirlenir.</template>
          </mvz-bent>
          <mvz-bent no="b" durum="mülga">
            <template></template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>4 üncü maddenin birinci fıkrasının (b) bendi kapsamında sigortalı sayılmayı gerektirecek birden fazla durumun söz konusu olması halinde, bu fıkranın (a) ve (b) bentlerinde belirtilen esaslara göre tek beyanda bulunulur.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>4 üncü maddenin birinci fıkrasının (b) bendi kapsamındaki muhtar sigortalılarının aylık prime esas kazançları, günlük prime esas kazanç alt sınırının otuz katıdır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanuna göre ilk defa 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı olanların prime esas kazançlarının hesabında;</template>
          <mvz-bent no="a">
            <template>Aylıklarını personel kanunlarına göre alan sigortalılar için;</template>
            <mvz-altbent no="1">
              <template>İlgili kanunları uyarınca aylık gösterge ve ek göstergeler üzerinden ödenen aylık tutarları,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Memuriyet taban aylık ve kıdem aylık tutarları,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Makam, temsil ve görev tazminatları, 657 sayılı Devlet Memurları Kanununun 152 nci maddesi uyarınca (bölge, kurum, birim, çalışma mahalli, görevin niteliği ve benzeri kriterlere dayalı olarak asıl tazminatlara ilave, ek veya ayrıca ödenen tazminatlar hariç) ödenen tazminatlar (375 sayılı Kanun Hükmünde Kararname eki (III) sayılı Cetvelin 1 inci ve 2 nci sıralarında sayılanlar ile düzenleyici ve denetleyici kurumların emsali personeli için, 152 nci maddenin “II- Tazminatlar” kısmının “A- Özel Hizmet Tazminatı” bölümünün (ğ) bendi ile “F- Denetim Tazminatı” bölümünün (b) bendinde yer alan tazminatlar esas alınır), 27/7/1967 tarihli ve 926 sayılı Türk Silahlı Kuvvetleri Personel Kanununun ek 17 nci maddesinin (A) bendinde yer alan cetvelde belirtilen oranlar üzerinden ödenen hizmet tazminatı )28/2/1982 tarihli ve 2629 sayılı Kanun ile 17/11/1983 tarihli ve 2955 sayılı Kanuna göre tazminat veya üniversite ödeneği alanların sadece rütbelerinin karşılığı hizmet tazminatları), 11/10/1983 tarihli ve 2914 sayılı Yükseköğretim Personel Kanununun 12 nci maddesi uyarınca ödenen üniversite ödeneği, 2802 sayılı Hakimler ve Savcılar Kanununun 106 ncı maddesinin üçüncü fıkrası uyarınca ödenen ek ödeme,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kadro karşılığı sözleşmeli olarak görev yapan sigortalılar ile 375 sayılı Kanun Hükmünde Kararnamenin ek 10 uncu maddesi kapsamındaki sigortalılar için işgal ettikleri kadrolar esas alınmak suretiyle (a) bendinde öngörülen unsurlar üzerinden hesaplanan tutarı,</template>

            <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamındaki sigortalıları çalıştıran özel sektör işverenlerinin, bu maddesinin birinci fıkrasının (a) bendine göre malullük, yaşlılık ve ölüm sigortaları primlerinden, işveren hissesinin iki puanlık kısmına isabet eden tutar Hazinece karşılanır. İşveren hissesine ait primlerin Hazinece karşılanabilmesi için, işverenlerin çalıştırdıkları sigortalılarla ilgili olarak bu Kanun uyarınca aylık prim ve hizmet belgelerini yasal süresi içerisinde Sosyal Güvenlik Kurumuna, muhtasar ve prim hizmet beyannamelerini ise Maliye Bakanlığına vermeleri, sigortalıların tamamına ait sigorta primlerinin sigortalı hissesine isabet eden tutarı ile Hazinece karşılanmayan işveren hissesine ait tutarı yasal süresinde ödemeleri, Sosyal Güvenlik Kurumuna prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borcu bulunmaması şarttır. Ancak Kuruma olan prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borçlarını 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 48 inci maddesine göre tecil ve taksitlendiren işverenler ile 29/7/2003 tarihli ve 4958 sayılı Sosyal Sigortalar Kurumu Kanununa ve 22/2/2006 tarihli ve 5458 sayılı Sosyal Güvenlik Prim Alacaklarının Yeniden Yapılandırılması ve Bazı Kanunlarda Değişiklik Yapılması Hakkında Kanun ile diğer taksitlendirme ve yapılandırma Kanunlarına göre taksitlendiren ve yapılandıran işverenler bu tecil, taksitlendirme ve yapılandırmaları devam ettiği sürece bu fıkra hükmünden yararlandırılır. Bu bent hükümleri; vakıflar tarafından kurulan yükseköğretim kurumları ile okul-aile birliklerince çalıştırılanlar hariç olmak üzere 21/4/2005 tarihli ve 5335 sayılı Kanunun 30 uncu maddesinin ikinci fıkrası kapsamına giren kurum ve kuruluşlara ait işyerleri ile 8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanununa, 4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanununa ve uluslararası anlaşma hükümlerine istina         <mvz-fıkra no="2">
          <template>Kamu idareleri, döner sermayeli kuruluşlar kanunla kurulan kurum ve kuruluşlar ile bankalar tarafından ihale mevzuatına göre yaptırılan işlerden ve özel nitelikteki inşaat işlerinden dolayı bu işleri yapan işveren tarafından yeterli işçilik bildirilmiş olup olmadığı Kurumca araştırılır. Bu araştırma sonucunda yeterli işçiliğin bildirilmemiş olduğu anlaşılırsa, eksik bildirilen işçilik tutarı üzerinden hesaplanan prim tutarı, 89 uncu madde gereği hesaplanacak gecikme cezası ve gecikme zammı ile birlikte bir ay içinde ödenmek üzere işverene tebliğ edilir. Tebliğ edilen prim ve gecikme cezası ve gecikme zammının ödendiği veya ödeneceğinin işveren tarafından yazılı olarak taahhüt edilmesi halinde borç kesinleşir. Kuruma verilecek taahhütnamede üstlenilen ödeme yükümlülüğünün yerine getirilmemesi halinde, işveren hakkında 88 inci ve 89 uncu maddeler uyarınca işlem yapılır. Tebliğ edilen prim ve gecikme cezası ve gecikme zammının ödenmemesi, taahhütname verilmemesi veya Kurumca işyerinin denetlenmesine gerek görülmesi durumunda Kurumca inceleme yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddenin birinci ve ikinci fıkrasında belirtilen usûlerle Kuruma bildirilmediği tespit edilen asgarî işçilik tutarı üzerinden Kurumca re’sen tahakkuk ettirilen sigorta primleri, 88 inci ve 89 uncu maddeler dikkate alınarak işverene tebliğ edilir. İşveren, tebliğ edilen prim borcuna karşı tebliğ tarihinden itibaren bir ay içinde Kuruma itiraz edebilir. İtiraz takibi durdurur. Kurumca itirazın reddi halinde işveren, kararın tebliğ tarihinden itibaren bir ay içinde yetkili iş mahkemesine başvurabilir. Mahkemeye başvurulması, prim borcunun takip ve tahsilini durdurmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kurumun denetim ve kontrolle görevlendirilmiş memurlarınca, Kuruma asgarî işçilik tutarının bildirilmediği tespit edilen işyerleri hakkında ayrıca 102 nci maddenin birinci fıkrasının (d) bendi ile (e) bendinin (4) numaralı alt bendi uyarınca idarî para cezası uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kamu idareleri, döner sermayeli kuruluşlar kanunla kurulan kurum ve kuruluşlar ile bankalar, bu maddenin uygulanmasıyla ilgili Kurumca istenilecek bilgileri ve belgeleri yazılı olarak en geç bir ay içinde vermeye mecburdur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kuruma yeterli işçilik tutarının bildirilmiş olup olmadığının araştırılmasında, işin yürütümü için gerekli olan asgarî işçilik tutarının tespitinde dikkate alınacak asgarî işçilik oranlarının saptanması ve asgarî işçilik oranlarına vaki itirazların incelenerek karara bağlanması amacıyla Kurum bünyesinde; Kurum teknik elemanlarından dört üye, Yönetim Kurulunda temsil edilen işçi ve işveren konfederasyonlarınca görevlendirilecek iki üye, Türkiye Odalar ve Borsalar Birliğinden bir üye olmak üzere toplam yedi teknik elemandan oluşan, Asgarî İşçilik Tespit Komisyonu kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kurumca gerek görüldüğünde, aynı esaslara göre birden fazla Asgarî İşçilik Tespit Komisyonu kurulabilir. Komisyon salt çoğunlukla toplanır ve kararlar en az dört üyenin aynı yöndeki oyu ile alınır. Kurum dışındaki üyelerin üst üste üç toplantıya, son altı ay içinde ise beş toplantıya katılmaması halinde, toplantıya katılmayan üyeyi görevlendiren konfederasyonların yerine, üye sayısı bakımından en yüksek bir sonraki konfederasyondan üye davet edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Asgarî İşçilik Tespit Komisyonuna Kurum dışından görevlendirilenlere, katıldıkları her toplantı günü için  gösterge rakamının memur aylıklarının hesabında kullanılan katsayı ile çarpılarak bulunacak tutarı üzerinden huzur hakkı Kurumca ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Kurumun denetim ve kontrolle görevli memurları tarafından devamlı mahiyetteki işyerlerinde yapılan asgari işçilik incelemesi sonucunda tespiti yapılan ve sigortalılara maledilemeyen fark sigorta primine esas kazanç matrahı üzerinden gecikme cezası ve gecikme zammı ile birlikte hesaplanacak sigorta primi ve buna bağlı uygulanacak idari para cezalarında, konuya ilişkin raporun Kurumun ilgili birimine gönderilmesinden önce işverenle uzlaşma yapılabilir. Uzlaşmaya varılması halinde, bu durum tutanakla tespit edilir. Uzlaşılan tutarlar kesin olup, uzlaşma konusu yapılan tutarlar hakkında işverence dava açılamaz ve hiçbir mercie şikayet ve itirazda bulunulamaz. Uzlaşılan prim ve idari para cezaları, uzlaşma tutanağının düzenlendiği tarihten itibaren bir ay içinde ödenir. İşveren, uzlaşılan idari para cezası tutarı için ayrıca peşin ödeme indiriminden yararlandırılmaz. Uzlaşılan tutarların, bu sürede tam olarak ödenmemesi halinde uzlaşma bozulur ve uzlaşılan tutarlar kazanılmış hak teşkil etmez. Uzlaşmanın temin edilememiş veya uzlaşma müzakeresinde uzlaşmaya varılamamış olması veya uzlaşmanın bozulması hallerinde işveren, bu konuya ilişkin daha sonra uzlaşma talep edemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Uzlaşma neticesinde indirim yapılması nedeniyle tahsil edilmemiş olan sigorta primlerinin daha sonra Kurum veya mahkeme kararıyla sigortalılara mal edilmesi halinde, daha önce eksik tahsil olunan sigorta primleri, sigortalının çalıştığı süre ve sigorta primine esas kazancı dikkate alınarak gecikme cezası ve gecikme zammı ile birlikte tahsil olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Asgarî İşçilik Tespit Komisyonunun çalışma usûl ve esasları, Komisyonda görev alacak teknik elemanların nitelikleri, asgarî işçilik tespitinde uygulanacak yöntem, verilerin belirlenmesi, tamamlanmış veya devam etmekte olan işlerle ilgili yapılacak yerinde tespit kriterleri, uzlaşma komisyonlarının oluşumu, çalışma usûl ve esasları ile bu maddenin uygulanmasına ilişkin diğer usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Prim Belgeleri ve Primlerin Ödenmesi">
      <mvz-madde no="86" başlık="Prim belgeleri ve işyeri kayıtları">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 4 üncü ve 5 inci maddesine tabi sigortalılar ile sosyal güvenlik destek primine tabi sigortalılar için işverenlerce Kuruma verilmesi gereken aylık prim ve hizmet belgelerinin şekli, içeriği, ekleri, ilgili olduğu dönemi, verilme süresi ve diğer hususlar Kurum tarafından çıkarılan yönetmelikle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İşveren, işyeri sahipleri; işyeri defter, kayıt ve belgelerini ilgili olduğu yılı takip eden yıl başından başlamak üzere on yıl süreyle, kamu idareleri otuz yıl süreyle, tasfiye ve iflâs idaresi memurları ise görevleri süresince, saklamak ve Kurumun denetim ve kontrol ile görevlendirilen memurlarınca istenilmesi halinde onbeş gün içinde ibraz etmek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İşverenin, sigortalıyı, 4857 sayılı İş Kanununun 7 nci maddesine göre başka bir işverene iş görme edimini yerine getirmek üzere geçici olarak devretmesi halinde, sigortalıyı devir alan, geçici iş ilişkisi süresine ilişkin birinci fıkrada belirtilen belgelerin aynı süre içinde işverene ait işyerinden Kuruma verilmesinden, işveren ile birlikte müteselsilen sorumludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ay içinde bazı iş günlerinde çalıştırılmayan ve ücret ödenmeyen sigortalıların eksik gün nedeni ve eksik gün sayısı, işverence ilgili aya ait aylık prim ve hizmet belgesinde veya muhtasar ve prim hizmet beyannamesiyle beyan edilir. Sigortalıların otuz günden az çalıştıklarını gösteren eksik gün nedenleri ile bu nedenleri ispatlayan belgelerin şekli, içeriği, ekleri, ilgili olduğu dönemi, saklanması ve diğer hususlar Kurumca çıkarılan yönetmelikle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sigortalıların otuz günden az çalıştığını gösteren bilgi ve belgelerin Kurumca istenilmesine rağmen ibraz edilmemesi veya ibraz edilen bilgi ve belgelerin geçerli sayılmaması halinde otuz günden az bildirilen sürelere ait aylık prim ve hizmet belgesi veya muhtasar ve prim hizmet beyannamesi, yapılan tebligata rağmen bir ay içinde verilmemesi veya noksan verilmesi halinde Kurumca re’sen düzenlenir ve muhteviyatı primler, bu Kanun hükümlerine göre tahsil olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kurumun denetim ve kontrol ile görevlendirilmiş memurlarınca, fiilen yapılan denetimler sonucunda veya işyeri kayıtlarından yapılan tespitlerden ya da kamu idarelerinin denetim elemanlarınca kendi mevzuatı gereğince yapacakları soruşturma, denetim ve incelemeler neticesinde veya kamu kurum ve kuruluşları ile bankalar tarafından düzenlenen belge veya alınan bilgilerden çalıştığı anlaşılan sigortalılara ait olup, bu Kanun uyarınca Kuruma verilmesi gereken belgelerin yapılan tebligata rağmen bir ay içinde verilmemesi veya noksan verilmesi halinde, bu belgeler Kurumca re’sen düzenlenir ve muhteviyatı sigorta primleri Kurumca tespit edilerek işverene tebliğ edilir. İşveren, bu maddeye göre tebliğ edilen prim borcuna karşı tebliğ tarihinden itibaren bir ay içinde, ilgili Kurum ünitesine itiraz edebilir. İtiraz, takibi durdurur. İtirazın reddi halinde, işveren kararın tebliğ tarihinden itibaren bir ay içerisinde yetkili iş mahkemesine başvurabilir. Yetkili mahkemeye başvurulması, prim borcunun takip ve tahsilini durdurmaz. Mahkemenin Kurum lehine karar vermesi halinde, 88 inci ve 89 uncu maddelerin prim borcuna ilişkin hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Kurumun denetim ve kontrolle görevli memurlarınca işyerinde fiilen yapılan tespitlerden ve kamu idarelerinin denetim elemanlarınca kendi mevzuatı gereğince yapacakları soruşturma, denetim ve incelemelerden kayıt ve belgelere dayanmaksızın çalıştığı belirlendiği halde, hizmetlerinin veya prime esas kazançlarının Kuruma bildirilmediği anlaşılan veya eksik bildirildiği tespit edilen sigortalıların geriye yönelik hizmetlerinin veya prime esas kazançlarının, en fazla tespitin yapıldığı tarihten geriye yönelik bir yıllık süreye ilişkin kısmı dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Aylık prim ve hizmet belgesi veya muhtasar ve prim hizmet beyannamesi işveren tarafından verilmeyen veya çalıştıkları Kurumca tespit edilemeyen sigortalılar, çalıştıklarını hizmetlerinin geçtiği yılın sonundan başlayarak beş yıl içerisinde iş mahkemesine başvurarak, alacakları ilâm ile ispatlayabilirlerse, bunların mahkeme kararında belirtilen aylık kazanç toplamları ile prim ödeme gün sayıları dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Sigortalının çalıştığı bir veya birden fazla işte, bu Kanunda yazılı şartları yerine getirmiş olmasına rağmen, kendisi için verilmesi gereken aylık prim ve hizmet belgesinin veya muhtasar ve prim hizmet beyannamesinin işveren tarafından verilmediği veya verilen aylık prim ve hizmet belgesinde veya muhtasar ve prim hizmet beyannamesinde kazançların veya prim ödeme gün sayılarının eksik gösterildiği Kurumca tespit edilirse, hastalık ve analık sigortalarından gerekli ödemeler yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Bu maddede belirtilen yükümlülüklerin yerine getirilmemesi halinde, 102 nci maddeye göre işlem yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>Kamu idarelerinde işyerinin özelliği nedeniyle prim belgelerinin farklı sürelerde verilme zamanını belirlemeye, Kurum yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Muhtasar beyanname ile bu Kanun uyarınca verilmesi gereken aylık prim ve hizmet belgesinin birleştirilerek verilmesi durumunda beyannamenin; şekil, içerik, ekleri, ilgili olduğu dönem, verilme süresi ve diğer hususlar Bakanlık ile Maliye Bakanlığı tarafından çıkarılan müşterek tebliğ ile belirlenir. İşveren sigortalı çalıştırmadığı takdirde, bu hususu sigortalı çalıştırmaya son verdiği tarihten itibaren on beş gün içinde Kuruma bildirmekle yükümlüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="87" başlık="Prim ödeme yükümlüsü">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanmasında kısa ve uzun vadeli sigorta kolları ile genel sağlık sigortası ve isteğe bağlı sigorta bakımından;</template>
          <mvz-bent no="a">

          <mvz-bent no="b">
            <template>4 üncü maddenin birinci fıkrasının (b) bendindeki muhtar sigortalılar hariç bu bent kapsamında sigortalı olanlar, isteğe bağlı sigortalı olanlar ve 60 ıncı maddenin birinci fıkrasının (d) ve (g) bentlerinde sayılan kişilerin kendileri,</template>

          </mvz-bent>
          <mvz-bent no="d">
