          <mvz-bent no="e">
            <template>5 inci maddenin (b) bendinde belirtilen aday çırak, çırak ve işletmelerde meslekî eğitim görenler ile meslekî veya teknik ortaöğretimde okumakta iken  staja tâbi tutulan öğrenciler ile tamamlayıcı eğitim ya da alan eğitimi gören öğrenciler için Milli Eğitim Bakanlığı veya bu öğrencilerin eğitim gördükleri okullar veya kurumlar, kamu kurum ve kuruluşları tarafından desteklenen projelerde görevli bursiyerler için projenin yürütüldüğü kamu kurum ve kuruluşları, özel sektör kuruluşları ve üniversiteler, yüksek öğrenim sırasında  staja tâbi tutulan veya işletmelerde meslekî eğitim gören öğrenciler için öğrenim gördükleri yüksek öğretim kurumu,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>5 inci maddenin (c) ve (g) bentlerine tabi olanlar için işverenleri veya kendileri,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Uluslararası Öğrenciler Değerlendirme Kurulu kararı ile burslandırılan uluslararası öğrenciler için bursluluk statüleri devam ettiği süre boyunca Yurtdışı Türkler ve Akraba Topluluklar Başkanlığı veya Uluslararası Öğrenciler Değerlendirme Kurulu tarafından görevlendirilen kurum,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Muhtarlardan 4 üncü maddenin birinci fıkrasının (b) bendi kapsamında sigortalılığı olanların il özel idareleri veya yatırım izleme ve koordinasyon başkanlıkları,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>prim ödeme yükümlüsüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="88" başlık="Primlerin ödenmesi">
        <mvz-fıkra no="1">
          <template>4 üncü maddenin birinci fıkrasının (a) bendinde belirtilen sigortalıları çalıştıran işveren, bir ay içinde çalıştırdığı sigortalıların primlerine esas tutulacak kazançlar toplamı üzerinden bu Kanun gereğince hesaplanacak sigortalı hissesi prim tutarlarını ücretlerinden keserek ve kendisine ait prim tutarlarını da bu tutara ekleyerek en geç Kurumca belirlenecek günün sonuna kadar Kuruma öder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hak edilen ancak, ödenmemiş olan ücretler üzerinden hesaplanacak primler hakkında da birinci fıkradaki hüküm uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>60 ıncı maddenin birinci fıkrasının (b), (c), (d) ve (g) bentleri ile aynı maddenin onikinci, onüçüncü ve ondördüncü fıkraları gereği genel sağlık sigortalısı sayılanlar için, her ay otuz tam gün genel sağlık sigortası primi ödenmesi zorunludur. Şu kadar ki, 60 ıncı maddenin birinci fıkrasının (b) bendi kapsamında genel sağlık sigortalısı olanların aynı ay içinde zorunlu sigorta kapsamında prim ödeme gün sayısı bulunması halinde, ayın kalan günleri için isteğe bağlı sigorta gün sayısı kadar genel sağlık sigortası primi ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>3 üncü maddenin üçüncü fıkrası kapsamına girenler hariç olmak üzere; 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı olmakla birlikte, 4857 sayılı Kanunun 13 üncü ve 14 üncü maddelerine göre kısmi süreli veya çağrı üzerine çalışanlar ile ay içerisinde günün bazı saatlerinde çalışıp, çalıştığı saat karşılığında ücret alanlardan 155 ay içerisinde sekiz gün ve daha az çalışanlar için eksik günlerine ait genel sağlık sigortası primlerinin otuz güne tamamlanması zorunludur. Bu durumda olan sigortalıların eksik günlerine ilişkin genel sağlık sigortası primleri, 60 ıncı maddenin birinci fıkrasının (c) bendinin (1) numaralı alt bendi veya (g) bendi kapsamında ödenir. Kamu idaresine ait işyerlerinde çalıştırılan sigortalıların iş sözleşmesinin askıda kaldığı aylara ait genel sağlık sigortası primi, 82 nci maddeye göre belirlenen prime esas günlük kazancın alt sınırının 30 günlük tutarı üzerinden ilgili kamu idaresince ödenir.  Ancak, kamu idaresine ait işyerinde çalıştırılan sigortalıların iş sözleşmesinin askıda olduğu sürede 4 üncü maddenin birinci fıkrasının (a) ve (b) bentlerine tabi çalışmaları ya da isteğe bağlı sigortalı olmaları halinde bu sigortalılar için belirtilen şekilde çalıştıkları veya isteğe bağlı sigortalı olarak prim ödedikleri sürelerle sınırlı olarak ilgili kamu idaresinden genel sağlık sigortası primi alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>60 ıncı maddenin birinci fıkrasının (c) bendi ile aynı maddenin onikinci, onüçüncü ve ondördüncü fıkraları kapsamına girenler için prim ödeme yükümlülerinin ödeyecekleri genel sağlık sigortası primi; primin tahakkuk ettirileceği ay itibarıyla anılan maddenin birinci fıkrasının (c) bendinin (1) ve (2) numaralı alt bentleri ve onikinci fıkrası ile bakmakla yükümlü oldukları kişiler dahil olmak üzere onüçüncü ve ondördüncü fıkralarında sayılan kişi sayısının üçe bölünmesi suretiyle bulunacak kişi sayısı, aynı maddenin birinci fıkrasının (c) bendinin (3) ila (10) numaralı alt bentlerinde sayılan kişiler için ise kişi sayısı esas alınarak hesaplanır. Ancak 60 ıncı maddenin birinci fıkrasının (c) bendi kapsamındaki kişilerden aynı zamanda anılan fıkranın diğer bentleri kapsamına girerek genel sağlık sigortalısı sayılanlar, bu fıkraya göre tespit edilecek kişi sayısı hesabına dahil edilmez. Ayrıca 60 ıncı maddenin onikinci fıkrasındaki genel sağlık sigortalılığı kapsamında başlayan tedavilerin 67 nci maddenin dördüncü fıkrasında belirtilen süreyi aşması halinde, bir yıla kadar genel sağlık sigortası primleri, 87 nci maddenin birinci fıkrasının (c) bendi gereği ilgili kamu idaresi tarafından ödenmek suretiyle sağlık hizmetlerinden yararlandırılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>87 nci maddenin birinci fıkrasının (b) bendinde belirtilen yükümlüler, her aya ait primlerini takip eden ayda Kurumca belirlenecek günün sonuna kadar Kuruma öderler. Bu kişiler primlerini en fazla 360 günle sınırlı olmak üzere peşin olarak erken ödeyebilir. Erken ödeme halinde erken ödenen her gün için 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usûlü Hakkında Kanunun ek 1 inci maddesine göre erken ödeme indirimi hükümleri uygulanır. Ancak yapılan erken ödeme indirimi, prime esas kazançtan indirilmez. Erken ödemede sigortalılık süresi, sigorta priminin ait olduğu her ayın ilk gününden itibaren, prim ödeme gün sayısına dahil edilir. Erken ödeme yapılan ve prim ödeme gün sayısına dahil edilmeyen sürede isteğe bağlı sigortalılığın sona ermesi halinde, sigortalılık süresinden sayılmayan günlere ait primler ilgililere iade edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>4 üncü maddenin birinci fıkrasının (b) bendinin (4) numaralı alt bendine tabi sigortalılar için, genel sağlık sigortası primi ile kısa ve uzun vadeli sigorta kolları primlerini ayrı ayrı veya birlikte tahsil edilecek şekilde prim ödeme tarihlerini veya dönemlerini belirlemeye Kurum yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>4 üncü maddenin birinci fıkrasının (b) bendi kapsamında sigortalı sayılanların, her ay için otuz tam gün prim ödemesi zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>4 üncü maddenin birinci fıkrasının (c) bendinde belirtilen sigortalıları çalıştıran işverenler, çalıştırdığı sigortalıların primlerine esas tutulacak kazançlar toplamı üzerinden bu Kanun gereğince hesaplanacak prim tutarlarını ücretlerinden keserek ve kendisine ait prim tutarlarını da bu tutara ekleyerek, en geç Kurumca belirlenecek günün sonuna kadar Kuruma öderler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>87 nci maddenin birinci fıkrasının (c), (d) ve (g) bentleri ile 60 ıncı maddenin sekizinci ve onuncu fıkralarında belirtilen yükümlüler, her aya ait primleri ilgili ayı takip eden ayın sonuna kadar Kuruma öderler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Kuruma fiilen ödenmeyen prim tutarları, gelir vergisi ve kurumlar vergisi uygulamasında gider yazılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>4 üncü maddenin birinci fıkrasının (b) bendinin (4) numaralı alt bendi kapsamında sigortalı olarak tescil edilmiş olanların prim borçlarını, sattıkları tarımsal ürün bedellerinden borç tutarını geçmemek şartıyla %1 ilâ %5 oranları arasında olmak üzere kesinti yapılmak suretiyle tahsil etmeye Kurum yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Prim borçları katma değer vergisi iade alacağından mahsubu suretiyle de ödenebilir. Bu takdirde katma değer vergisi iade hakkı sahibi kendisinin, mal veya hizmet satın aldığı veya iştirak veya ortaklık ilişkisi içinde bulunduğu işverenlerin prim borçları için de mahsup talep edebilir. Bu işverenlerin mahsup talebinde bulundukları ayda muaccel olan prim borçlarının birinci fıkrada belirtilen ödeme sürelerini izleyen onbeş gün içinde mahsup suretiyle ödenmesi halinde, yasal süresi içinde ödendiği kabul edilir. Ancak prim borçlarının katma değer vergisi iade alacağından mahsup suretiyle ödenmesi talebinde bulunulduğu halde, süresinde mahsup edilemeyen veya eksik mahsup edilen prim borçları için birinci fıkrada belirtilen ödeme sürelerini izleyen günden başlanarak gecikme cezası ve gecikme zammı uygulanır. Kurum, Maliye Bakanlığının uygun görüşü ile bu uygulamadan faydalanacak işverenleri; iştigal konusu, işletme türü ve işletme büyüklüğü itibarıyla belirlemeye ve lehine mahsup talebinde bulunulan işverenlerin prim borcu ödeme süresini otuz günü aşmamak üzere uzatmaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="14">
          <template>Kurum, prim ve her türlü alacaklarını, işverenlere olan borçlarından mahsup etmek suretiyle tahsil etmeye yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="15">
          <template>Primlerin özel ödeme şekilleri kullanılmak suretiyle ödenmesi zorunluluğunu getirmeye ve primlerin yatırılacağı tahsilât kuruluşlarını belirlemeye Kurum yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="16">
          <template>Kurumun süresi içinde ödenmeyen prim ve diğer alacaklarının tahsilinde, 6183 sayılı Amme Alacaklarının Tahsil Usûlü Hakkında Kanunun 51 inci, 102 nci ve 106 ncı maddeleri hariç, diğer maddeleri uygulanır. Kurum, 6183 sayılı Kanunun uygulanmasında Maliye Bakanlığı ile diğer kamu kurum ve kuruluşları ve mercilere verilen yetkileri kullanır.  Cumhurbaşkanı, Kurumun 6183 sayılı Kanuna göre takip edilen alacakları için anılan Kanunun 48/A maddesini; en az üç yıl süreyle prim yükümlüsü olup son üç yıl içerisinde verilmesi gereken bildirgeleri kanuni sürelerinde vermiş olanlardan başvuru tarihi itibarıyla vadesi bir yılı geçmemiş borcunu borç ödemede hüsnüniyet sahibi olmasına rağmen ödeyememiş olanlar hakkında uygulatmaya ve uyumlu prim borçlularını belirlemeye yetkilidir.  6183 sayılı Kanunun 23 üncü maddesine göre Maliye Bakanlığına bağlı tahsil dairelerince reddiyat yapılması durumunda anılan maddenin birinci fıkrasına göre yapılacak mahsuptan sonra Kurumun prim ve diğer alacaklarından muaccel olanlara mahsup yapılır. Kurumun tahsil ettiği prim ve diğer alacaklardan reddi icap edenler, istihkak sahiplerinin Kuruma olan muaccel borçlarına mahsubundan sonra Maliye Bakanlığına bağlı tahsil dairelerine olan muaccel borçlara mahsup edilmek üzere reddolunur. Bu suretle yapılan ödemelerde, reddedilen tutarın Kuruma ve/veya alacaklı tahsil dairesinin hesabına geçtiği tarihte ödeme yapılmış sayılır. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Maliye Bakanlığı ile Kurum tarafından müştereken belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="17">
          <template>Kurum, 6183 sayılı Kanun kapsamında takip edilen alacakları hariç olmak üzere her türlü alacağın teminatını teşkil etmek üzere Yeni Türk Lirası ve/veya yabancı para birimi üzerinden ticari işletme, taşınır ve/veya taşınmaz rehni dahil olmak üzere her türlü teminat almaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="18">
          <template>Kurumun 6183 sayılı Kanun kapsamında takip edilen prim ve diğer alacakları amme alacağı niteliğinde olup, imtiyazlı alacaktır. Kurumun taraf olduğu her türlü dava ve icra takiplerinin kısmen veya tamamen aleyhe neticelenmesi halinde 2004 sayılı İcra ve İflas Kanununda yazılı tazminat ve cezalar Kurum hakkında uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="19">
          <template>Kurumun prim ve diğer alacaklarının tahsilinde, 6183 sayılı Amme Alacaklarının Tahsil Usûlü Hakkında Kanunun uygulamasından doğacak uyuşmazlıkların çözümlenmesinde Kurumun alacaklı biriminin bulunduğu yer iş mahkemesi yetkilidir. Yetkili iş mahkemesine başvurulması alacakların takip ve tahsilini durdurmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="20">
          <template>Kurumun sigorta primleri ve diğer alacakları haklı bir sebep olmaksızın bu Kanunda belirtilen sürelerde ödenmez ise kamu idarelerinin tahakkuk ve tediye ile görevli kamu görevlileri, tüzel kişiliği haiz diğer işverenlerin şirket yönetim kurulu üyeleri de dahil olmak üzere üst düzeydeki yönetici veya yetkilileri ile kanuni temsilcileri Kuruma karşı işverenleri ile birlikte müştereken ve müteselsilen sorumludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="21">
          <template>Kurum, kamu idarelerinde işyerinin özelliği nedeniyle primlerin farklı zamanlarda ödeme süresini belirlemeye yetkilidir. Prim alacaklarının tahsili için muacceliyet tarihinden itibaren en geç bir yıl içinde icra yoluna başvurmayan Kurum yetkili personeli hakkında genel hükümlere göre kovuşturma yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="22">
          <template>Sigortalılar ile tüzel kişilerin kasıt, kusur, hata veya yanıltıcı beyanından kaynaklanmaması şartıyla, sigortalılarca ödenen prim ve prime ilişkin borcun noksan tahakkuk ettirildiğinin Kurumca sonradan tespit edilmesi hâlinde tespit edilen fark prime ilişkin borç aslına, tebliğ tarihinden itibaren 89 uncu maddenin ikinci fıkrasına göre gecikme cezası ve gecikme zammı uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="23">
          <template>Kurum görev alanı kapsamındaki tebliğler, bu Kanunun 99 uncu maddesi hükümleri saklı kalmak kaydıyla, tebliğe elverişli elektronik bir adres vasıtasıyla elektronik ortamda yapılabilir. Elektronik ortamda yapılan tebligat, muhatabın elektronik adresine ulaştığı tarihi izleyen beşinci günün sonunda yapılmış sayılır. Kurum, elektronik ortamda yapılacak tebliğle ilgili her türlü teknik altyapıyı kurmaya veya kurulmuş olanları kullanmaya, tebliğe elverişli elektronik adres kullanma zorunluluğu getirmeye, kendisine elektronik ortamda tebliğ yapılacakları ve elektronik tebliğe ilişkin diğer usul ve esasları belirlemeye yetkilidir. Kurum tarafından yapılacak tebliğler, Maliye Bakanlığı ile yapılacak protokol çerçevesinde 213 sayılı Kanunun 107/A maddesi hükümlerine göre kurulan teknik altyapı kullanılarak da elektronik ortamda yapılabilir. Bu şekilde yapılan tebligatlar, 99 uncu maddenin ikinci fıkrası kapsamındaki bildirim yerine geçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="24">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="89" başlık="Prim borçlarına halef olma, gecikme cezası ve gecikme zammı ile iadesi gereken primler">
        <mvz-fıkra no="1">
          <template>Sigortalının çalıştırıldığı işyeri aktif veya pasifi ile birlikte devralınır veya intikal ederse ya da başka bir işyerine katılır veya birleşirse eski işverenin Kuruma olan prim ile gecikme cezası, gecikme zammı ve diğer ferilerinden oluşan borçlarından, aynı zamanda yeni işveren de müştereken ve müteselsilen sorumludur. Bu hükme aykırı sözleşme hükümleri Kuruma karşı geçersizdir. Bu fıkranın uygulanmasına ilişkin usûl ve esasları belirlemeye Kurum yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurumun prim ve diğer alacakları süresi içinde ve tam olarak ödenmezse, ödenmeyen kısmı sürenin bittiği tarihten itibaren ilk üç aylık sürede her bir ay için %3 oranında gecikme cezası uygulanarak artırılır. Ayrıca, her ay için bulunan tutarlara ödeme süresinin bittiği tarihten başlamak üzere borç ödeninceye kadar her ay için ayrı ayrı Hazine Müsteşarlığınca açıklanacak bir önceki aya ait Yeni Türk Lirası cinsinden iskontolu ihraç edilen Devlet iç borçlanma senetlerinin aylık ortalama faizi bileşik bazda uygulanarak gecikme zammı hesaplanır. Ancak, ödemenin yapıldığı ay için gecikme zammı günlük hesaplanır. Cumhurbaşkanı, ilk üç ay için uygulanan gecikme cezası oranını iki katına kadar artırmaya veya bu oranı %1 oranına kadar indirmeye, yeniden kanunî oranına getirmeye ve uygulama tarihini belirlemeye yetkilidir. Dava ve icra takibi açılmış olsa bile, prim ve diğer Kurum alacaklarının ödenmemiş kısmı için gecikme cezası ve gecikme zammı tahsil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yanlış veya yersiz alınmış olduğu tespit edilen primler, alındıkları tarihten on yıl geçmemiş ise, hisseleri oranında işverenlere, sigortalılara, isteğe bağlı sigortalılara veya genel sağlık sigortalılarına veya hak sahiplerine kanunî faizi ile birlikte geri verilir. Kanunî faiz, primin Kuruma yatırıldığı tarihi takip eden ay başından, iadenin yapıldığı ayın başına kadar geçen süre için hesaplanır. Ancak Borçlar Kanununun 65 inci maddesi hükmü saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Prim iadesi nedeniyle sigortalıların, isteğe bağlı sigortalıların, genel sağlık sigortalılarının aylık, gelir, ödenek ve sağlık hizmetlerinden yararlanma şartlarını yitirmeleri durumunda, bu Kanuna göre ödenen aylık, gelir ve ödenekler ile sağlanan sağlık hizmetleri durdurulur. Yanlış veya yersiz yapılan masraflar 96 ncı madde hükümlerine göre ilgililerden geri alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="90" başlık="Prim ve idari para cezası borçlarının hakedişlerden mahsubu, ödenmesi ve ilişiksizlik belgesinin aranması">
        <mvz-fıkra no="1">
          <template>Kamu idareleri ile döner sermayeli kuruluşlar ve 5411 sayılı Bankacılık Kanunu kapsamındaki kuruluşlar, kanunla kurulan kurum ve kuruluşlar, ihale yolu ile yaptırdıkları her türlü işleri üstlenenleri ve bunların adreslerini onbeş gün içinde Kuruma bildirmekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İşverenlerin hakedişleri, Kuruma idari para cezası, prim ve prime ilişkin borçlarının olmaması kaydıyla ödenir. Kesin teminatları ise ihale konusu işle ilgili olarak Kuruma borçlarının bulunmadığının tespit edilmesinden sonra iade edilir. İşverenlerin, kamu idareleri ile döner sermayeli kuruluşlar, bankalar ve kanunla kurulan kurum ve kuruluşlar nezdindeki her çeşit alacak, teminat ve hakedişleri üzerinde işçi ücreti alacakları hariç olmak üzere yapılacak her türlü devir, temlik ve el değiştirme, Kurum alacaklarını karşılayacak kısım ayrıldıktan sonra, kalan kısım üzerinde hüküm ifade eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hakedişlerin mahsubu ve ödenmesi ile teminatların prim ve idari para cezası borçlarına karşılık tutulmasına ilişkin işlemlerin usûl ve esasları Cumhurbaşkanınca çıkarılacak yönetmelikle tespit edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Valilikler, belediyeler, il özel idareleri ve ruhsat vermeye yetkili diğer merciler tarafından, geçici iskân veya yapı kullanma izin belgesi verilmeden önce yapılan inşaat dolayısıyla, diğer kamu idareleri ile döner sermayeli kuruluşlar, kanunla kurulan kurum ve kuruluşlar ve bankaların ise Cumhurbaşkanı kararı ile belirlenecek işlemlerinde Kuruma borçlarının bulunmadığına dair ilgililerden Kurumca düzenlenmiş bir belgenin istenmesi zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu maddede belirtilen yükümlülükler yerine getirilmeden hak ediş ödenmesi, kesin teminatın iade edilmesi veya geçici iskân izin belgesi ve yapı kullanma izin belgesi verilmesi veya diğer işlemlerin gerçekleştirilmesi hallerinde, ilgililer hakkında genel hükümlere göre idarî ve cezaî işlem yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Ülke çapında uygulanan ve özel bir izne veya belgeye dayanmayan genel düzenlemeler hariç olmak üzere, belirli bölgelere veya sektörlere yönelik ya da kamu kurum ve kuruluşları tarafından verilen özel belgelere veya izinlere dayalı olarak kamudan kaynak tahsis edilmesi şeklinde kanun, kararname ve diğer mevzuatla sağlanan araştırma, geliştirme, üretim, yatırım, pazarlama ve benzeri tüm aşamalarda uygulanan devlet yardımı, teşvik ve desteklerin, daha önce başlayıp devam eden nakdi olmayanlar ile kamu kurum ve kuruluşları tarafından proje ve faaliyetleri karşılığında kamu kurum ve kuruluşlarına sağlananlar hariç olmak üzere, verilmesinden önce işverenlerden Kuruma muaccel olmuş prim ve idari para cezası borçlarının bulunmadığına veya tecil ve taksitlendirildiğine ya da yapılandırıldığına dair belge ve bilgilerin istenmesi zorunludur.  Devlet yardımı, teşvik ve desteklerden; işverenlerin muaccel prim ve idari para cezası borçları kesilip Kuruma aktarıldıktan sonra, varsa kalan kısmı üzerinden yararlanılabilir. Tecil ve takside bağlanmış ya da yapılandırılmış olan borçlara ilişkin yükümlülüklerin yerine getirilmemesinden dolayı anlaşması bozulanlardan veya bu sebepler dışında söz konusu yardım, teşvik ve desteklerden yararlanmaması gerektiği sonradan anlaşılanlardan, yapılan devlet yardımı teşvik ve destek ödemeleri ilgili mevzuat çerçevesinde müeyyideleri ile birlikte geri alınır. Bu fıkranın uygulanmasına ilişkin usûl ve esaslar Maliye Bakanlığı ile Hazine Müsteşarlığının görüşleri alınarak Kurumca belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="91" başlık="Afet ve diğer mücbir sebep hâllerinde belgelerin verilme süresi ve primlerin ertelenmesi">
        <mvz-fıkra no="1">
          <template>Yangın, su baskını, sel, kuraklık, yer kayması, deprem gibi afetlerle ağır hastalık, ağır kaza, tutukluluk ve sabotaj gibi nedenlerle ticari veya ekonomik kayıplara uğrayan işverenler, bu Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi kapsamındaki sigortalılar ile bu Kanuna göre primlerini kendileri ödeyen sigortalılar, bu durumu belgelemeleri kaydıyla vakanın veya afetin meydana geldiği tarihten itibaren üç ay içinde talepte bulunmaları ve prim ödeme aczine düştüklerinin, yapılacak inceleme sonucu anlaşılması hâlinde, yukarıda belirtilen vaka veya afet tarihinden önce ödeme süresi dolmuş mevcut Kuruma olan borçlar ile vaka veya afetin meydana geldiği tarihi takip eden üçüncü ayın sonuna kadar tahakkuk edecek Kuruma olan borçları, vaka veya afetin meydana geldiği tarihten itibaren bir yıla kadar Kurumca ertelenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkrada belirtilen durumlar ile Bakanlık ve Maliye Bakanlığınca müştereken belirlenen vaka, afet veya mücbir sebep hâllerinde Kuruma verilmesi gereken her türlü bilgi ve belge ile yapılması gereken başvuruların vakanın, afetin veya mücbir sebebin meydana geldiği tarihi takip eden üç ay içinde Kuruma verilmesi veya yapılması hâlinde, süresinde verilmiş veya yapılmış sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yetkili makamlarca genel hayatı etkilediğine dair karar verilen vaka, afet veya mücbir sebep hâllerinde, genel hayatın etkilendiği bölge, il, ilçe veya mahalde doğrudan veya dolaylı olarak zarar gören işverenlerle sigortalı ve hak sahiplerince bu Kanuna göre Kuruma verilmesi gereken her türlü bilgi ve belge ile yapılması gereken başvuruların, ödenmesi gereken primlerin ve diğer Kurum alacaklarının ödeme sürelerini bu Kanundaki sürelere bağlı olmaksızın, genel hayatın etkilendiği bölge, il, ilçe veya mahaldeki şartları ve gelişmeleri göz önünde tutarak belirlemeye ve ertelemeye Kurum yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kuruma olan borçların ertelendiği sürede zamanaşımı işlemez ve ertelenen kısmına gecikme cezası ve gecikme zammı uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Ortak ve Çeşitli Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Ortak Hükümler">
      <mvz-madde no="92" başlık="Sigortalılığın zorunlu oluşu, sona ermesi ve sosyal güvenlik sicil numarası">
        <mvz-fıkra no="1">
          <template>Kısa ve uzun vadeli sigorta kapsamındaki kişilerin sigortalı ve genel sağlık sigortalısı olması, genel sağlık sigortası kapsamındaki kişilerin ise genel sağlık sigortalısı olması zorunludur. Bu Kanunda yer alan sigorta hak ve yükümlülüklerini ortadan kaldırmak, azaltmak, vazgeçmek veya başkasına devretmek için sözleşmelere konulan hükümler geçersizdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanuna göre alınacak sigorta primleri ve idarî para cezalarının ödenmesi için, Kurumca işverene yapılacak bildirim üzerine prim borçları ve idarî para cezaları ödenmezse, Kurumca düzenlenen prim borcunu ve idarî para cezasını gösteren belgeler resmî dairelerin usulüne göre düzenledikleri belgeler hükmündedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sigortalılık, bu Kanunda sayılan sigortalı sayılma şartlarının kaybedilmesi veya ölüm halinde sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sigortalılar, isteğe bağlı sigortalılar ile bunların hak sahiplerinin; genel sağlık sigortalıları ve bunların bakmakla yükümlü olduğu kişilerin tescil ve diğer tüm işlemlerinde sosyal güvenlik sicil numarası olarak Türk vatandaşları için T.C. kimlik numarası, yabancı uyruklu kişiler için ise İçişleri Bakanlığınca verilen kimlik numarası kullanılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="93" başlık="Devir, temlik, haciz ve Kurum alacaklarında zamanaşımı">
        <mvz-fıkra no="1">
          <template>Bu Kanun gereğince sigortalılar ve hak sahiplerinin gelir, aylık ve ödenekleri, sağlık hizmeti sunucularının genel sağlık sigortası hükümlerinin uygulanması sonucu Kurum nezdinde doğan alacakları, devir ve temlik edilemez. Gelir, aylık ve ödenekler; 88 inci maddeye göre takip ve tahsili gereken alacaklar ile nafaka borçları dışında haczedilemez. Bu fıkraya göre haczi yasaklanan gelir, aylık ve ödeneklerin haczedilmesine ilişkin talepler, borçlunun muvafakati bulunmaması halinde, icra müdürü tarafından reddedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurumun prim ve diğer alacakları ödeme süresinin dolduğu tarihi takip eden takvim yılı başından başlayarak on yıllık zamanaşımına tâbidir. Kurumun prim ve diğer alacakları; mahkeme kararı sonucunda doğmuş ise mahkeme kararının kesinleşme tarihinden, Kurumun denetim ve kontrolle görevli memurlarınca yapılan tespitlerden doğmuş ise rapor tarihinden, kamu idarelerinin denetim elemanlarınca kendi mevzuatı gereğince yapacakları soruşturma, denetim ve incelemelerden doğmuş ise bu soruşturma, denetim ve inceleme sonuçlarının Kuruma intikal ettiği tarihten veya bankalar, döner sermayeli kuruluşlar, kamu idareleri ile kanunla kurulmuş kurum ve kuruluşlardan alınan bilgi ve belgelerden doğmuş ise bilgi ve belgenin Kuruma intikal ettiği tarihten itibaren, zamanaşımı on yıl olarak uygulanır. Bu alacaklar için 89 uncu madde gereğince hesaplanacak gecikme cezası ve gecikme zammı, 88 inci maddede belirtilen ödeme süresinin son gününü takip eden günden itibaren uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanuna dayanılarak Kurumca açılacak tazminat ve rücû davaları, on yıllık zamanaşımına tâbidir. Zamanaşımı tarihi; rücû konusu gelir ve aylıklar bakımından Kurum onay tarihinden, masraf ve ödemeler için ise masraf veya ödeme tarihinden itibaren başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Zamanaşımından sonra yapılan ödemeler kabul edilir. Ancak, 4 üncü maddenin birinci fıkrasının (b) bendine tâbi sigortalıların zamanaşımı nedeniyle prim ödenmeyen süreleri, sigortalılık süresinden sayılmaz ve bu süreye ilişkin sigortalılık hak ve yükümlülükleri düşer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="94" başlık="Kontrol muayenesi">
        <mvz-fıkra no="1">
          <template>Kurum yürütülen soruşturma kapsamıyla sınırlı olmak üzere;</template>
          <mvz-bent no="a">
            <template>Sağlık hizmeti alan genel sağlık sigortalısından veya bunların bakmakla yükümlü olduğu kişilerden, sağlık hizmetinin gerçekten alınıp alınmadığını,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Sigortalının, isteğe bağlı sigortalının veya bunların hak sahiplerinin malullük, iş göremezlik raporlarında belirtilen rahatsızlıklarının mevcut olup olmadığını,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>tespit amacıyla kontrol muayenesi ve tetkik yaptırılmasını talep edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Malûllük, vazife malullüğü aylığı veya sürekli iş göremezlik geliri bağlanmış sigortalılar, malullük durumlarında artma veya başka birinin sürekli bakımına muhtaç olduğunu ileri sürerek aylık ve gelirlerinde değişiklik yapılmasını isteyebilecekleri gibi; Kurum da harp malullüğü, vazife malullüğü, malullük aylığı veya sürekli iş göremezlik geliri bağlanmış sigortalılar ile aylık veya gelir bağlanan ve çalışma gücünün en az %60’ını yitiren malûl çocukların kontrol muayenesine tâbi tutulmasını talep edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kurumca yaptırılan kontrol muayenesinde veya sigortalının isteği üzerine ya da işe alıştırma sonunda yapılan muayenesinde yeniden tespit edilecek malullük durumuna göre, malullük aylığı veya sürekli iş göremezlik geliri, yeni malullük durumuna esas tutulan raporun tarihini takip eden ödeme dönemi başından başlanarak artırılır, azaltılır veya kesilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Çalışma gücünün en az %60’ını yitiren malûl çocuklara bağlanmış bulunan gelir ve aylıklar, kontrol muayenesi sonunda tespit edilecek malullük durumuna göre, rapor tarihinden sonraki ödeme dönemi başından itibaren kesilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kurumun yazılı bildiriminde belirtilen tarihten sonraki ödeme dönemi başına kadar kabul edilebilir bir özrü olmadığı halde kontrol muayenesini yaptırmayan sigortalının malullük aylığı veya sürekli iş göremezlik geliri ile çalışma gücünün en az % 60’ını yitiren malûl çocukların kendilerine bağlanmış olan gelir veya aylığı, kontrol muayenesi için belirtilen tarihten sonraki ödeme dönemi başından itibaren kesilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Ancak, kontrol muayenesini Kurumun yazılı bildiriminde belirtilen tarihten başlayarak üç ay içinde yaptıran ve malullük veya sürekli iş göremezlik halinin devam ettiği tespit edilen sigortalının veya aylık ya da gelir bağlanmış olan malûl çocuğun kesilen aylık veya geliri, kesildiği tarihten başlanarak yeniden bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kontrol muayenesini Kurumun yazılı bildiriminde belirtilen tarihten üç ay geçtikten sonra yaptıran ve malullük veya sürekli iş göremezlik halinin devam ettiği tespit edilen sigortalının malullük aylığı veya yeni sürekli iş göremezlik derecesine göre hesaplanacak geliri, gelir veya aylık bağlanan çalışamayacak durumda malûl çocukların ise almakta oldukları gelir veya aylık, rapor tarihinden sonraki ay başından başlanarak yeniden bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Bu maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="95" başlık="Sağlık raporlarının usûl ve esaslarının belirlenmesi">
        <mvz-fıkra no="1">
          <template>Bu Kanun gereğince, yurt dışında tedavi için yapılacak sevklere, çalışma gücü kaybı, geçici iş göremezlik ödeneklerinin verilmesine ilişkin raporlar ile iş kazası ve meslek hastalığı sonucu meslekte kazanma gücü veya çalışma gücü kaybına esas teşkil edecek sağlık kurulu raporlarının usûl ve esaslarını, bu raporları vermeye yetkili sağlık hizmeti sunucularının sahip olması gereken kriterleri belirlemeye, usulüne uygun olmayan sağlık kurulu raporu ve dayanağı tıbbî belgeleri düzenleyen sağlık hizmet sunucusuna iade ederek belirlenen bilgileri içerecek şekilde yeniden düzenlenmesini istemeye Kurum yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Usûlüne uygun sağlık kurulu raporu ve dayanağı tıbbî belgeler ile gerekli diğer belgelerin incelenmesiyle; yurt dışında tedavi için yapılacak sevklere, vazife malullük derecesini, iş kazası veya meslek hastalığı sonucu tespit edilen meslekte kazanma gücünün kaybına veya meslekte kazanma gücünün kaybı derecelerine ilişkin usulüne uygun düzenlenmiş sağlık kurulu raporları ve diğer belgelere istinaden Kurumca verilen karara ilgililerin itirazı halinde, durum Sosyal Sigorta Yüksek Sağlık Kurulunca karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddenin uygulamasına ilişkin usûl ve esaslar, Sağlık Bakanlığı ile Kurumun birlikte çıkaracağı yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="96" başlık="Yersiz ödemelerin geri alınması">
        <mvz-fıkra no="1">
          <template>Kurumca işverenlere, sigortalılara, isteğe bağlı sigortalılara gelir veya aylık almakta olanlara ve bunların hak sahiplerine, genel sağlık sigortalılarına ve bunların bakmakla yükümlü olduğu kişilere, fazla veya yersiz olarak yapıldığı tespit edilen bu Kanun kapsamındaki her türlü ödemeler;</template>
          <mvz-bent no="a">
            <template>Kasıtlı veya kusurlu davranışlarından doğmuşsa, hatalı işlemin tespit tarihinden geriye doğru en fazla on yıllık sürede yapılan ödemeler, bu ödemelerin yapıldığı tarihlerden,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kurumun hatalı işlemlerinden kaynaklanmışsa, hatalı işlemin tespit tarihinden geriye doğru en fazla beş yıllık sürede yapılan ödemeler toplamı, ilgiliye tebliğ edildiği tarihten itibaren yirmidört ay içinde yapılacak ödemelerde faizsiz, yirmidört aylık sürenin dolduğu tarihten sonra yapılacak ödemelerde ise bu süre sonundan,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>itibaren hesaplanacak olan kanunî faizi ile birlikte, ilgililerin Kurumdan alacağı varsa bu alacaklarından mahsup edilir, alacakları yoksa genel hükümlere göre geri alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Alacakların yersiz ödemelere mahsubu, en eski borçtan başlanarak borç aslına yapılır, kanunî faiz kalan borca uygulanır. Bu hüküm ilgili hak sahiplerinin muvafakat etmeleri kaydıyla, aynı dosyadan diğer bir hak sahibine yapılan yersiz ödemelere mahsubunda da uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yersiz ödemenin gelir ve aylıklardan kesilmesinde, kesintinin başlayacağı ödeme dönemi başı itibarıyla kanunî faizi ile birlikte hesaplanan borç tutarı, gelir ve aylıktan % 25 oranında kesilmek suretiyle uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yersiz ödemelerin tespiti ile geri alınmasına ve bu maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="97" başlık="Zamanaşımı, hakkın düşmesi ve avans">
        <mvz-fıkra no="1">
          <template>Bu Kanunda aksine hüküm bulunmayan hallerde, iş kazası, meslek hastalığı, vazife malullüğü ve ölüm hallerinde bağlanması gereken gelir ve aylıkların, hakkın kazanıldığı tarihten itibaren beş yıl içinde istenmeyen kısmı zamanaşımına uğrar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kuruma müracaat etmemenin haklı bir sebebe dayandığını genel hükümlere göre ispat edenler hakkında, yukarıdaki hükümler uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kısa vadeli sigorta kollarından ve ölüm sigortasından kazanılan diğer haklar, hakkın doğduğu tarihten itibaren beş yıl içinde istenmezse düşer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanuna göre bağlanan gelir ve aylıklarını tahakkuk ettirildiği tarihlerden itibaren aralıksız on iki ay sonuna kadar tahsil etmeyenlerin gelir ve aylıkları, gelir ve aylık bağlanma şartlarının devam edip etmediğinin tespiti amacıyla durdurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin alacakları, hakkı doğuran olayın öğrenildiği tarihten itibaren iki yıl içinde istenmezse zamanaşımına uğrar, hakkı doğuran olay tarihinden itibaren ise beş yıl sonunda düşer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Sigortalılar ile bunların hak sahiplerinin, genel sağlık sigortalıları ile bakmakla yükümlü olduğu kişilerin, bu Kanunun uygulanması bakımından hak ettikleri alacaklarının süresi içinde ödenememesi halinde, avans verilmesine Kurum yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Sağlık hizmeti sunucuları, sunmuş oldukları hizmetlere ilişkin bir ay içinde düzenledikleri fatura ve eki belgeleri izleyen ayın onbeşine kadar Kuruma teslim ederler. Fatura teslim tarihi; süresi içinde teslim edilen faturalar için teslim edildiği ayın onbeşinci günü, süresi içinde teslim edilmeyen faturalar için ise teslim edildiği ayı takip eden ayın onbeşinci günü olarak kabul edilir. Fatura bedelinin tamamı, fatura teslim tarihinden itibaren, altmış gün içinde, sağlık hizmet sunucularına avans olarak ödenir. Fatura ve eki belgeler, fatura teslim tarihinden itibaren üç ay içinde incelenerek avans hesabı kapatılır. İnceleme süresinin takip eden mali yıla sirayet etmesi durumunda, avans artıkları hakkında 5018 sayılı Kamu Mali Yönetimi ve Kontrol Kanununun 35 inci maddesindeki akreditiflere ilişkin hükümler uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>66 ncı madde gereği sağlanan sağlık hizmetlerinin bedelleri için, yurt dışında bulunan sağlık hizmet sunucusunun talebi halinde, sağlık hizmetinin sunumundan önce de avans ödenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="98" başlık="Ücretlerden kesinti yapılmaması, özel sigortalara ilişkin hükümler ve sosyal güvenlik sözleşmelerinin yürütülmesi">
        <mvz-fıkra no="1">
          <template>İşveren, sosyal sigortalar ve genel sağlık sigortası için kendisine düşen yükümlülükler nedeniyle, sigortalıların ücretlerinden kesinti yapamaz. Bu Kanunda hüküm bulunmayan hallerde özel sigortalara ilişkin hükümler, bu Kanun hükümlerinin uygulanmasında dikkate alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanun gereğince sağlık hizmetlerinden yararlananların ödemekle yükümlü oldukları katılım payları, özel sigorta şirketleri tarafından teminat veya ödeme konusu yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yıllık veya daha uzun süreli tamamlayıcı veya destekleyici özel sağlık sigortalarına ilişkin usûl ve esaslar Kurumun uygun görüşü alınarak Hazine Müsteşarlığı tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Uluslararası sosyal güvenlik sözleşmeleri kapsamında yapılacak her türlü işlemler ve hesaplaşmalar, Kurum tarafından yürütülür. İlgili sözleşmelerde irtibat kurumuna yapılan atıflar, Kuruma yapılmış sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Çeşitli Hükümler">
      <mvz-madde no="99" başlık="Sosyal güvenlikle ilgili düzenlemeler, bildirimler ve yurt dışından başvuru">
        <mvz-fıkra no="1">
          <template>Sosyal güvenlik hak ve yükümlülükleri ile ilgili yapılacak her türlü kanunî düzenlemeler bu Kanunda yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanun gereğince yapılacak bildirimler hakkında, 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanun ve bu Kanunla mülga kanunlar ile sosyal güvenliğe dair diğer kanunlar kapsamında Kuruma yapılması öngörülen başvurulardan Bakanlıkça uygun görülenler yurt dışında çalışma ve sosyal güvenlik müşavirlik veya ataşelikleri vasıtasıyla alınabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yurt dışından hangi başvuruların alınacağına, başvuruların alınmasına, Kuruma iletilmesine ve başvurulara dair diğer işlemlere ilişkin usul ve esaslar Bakanlıkça çıkarılan yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="100" başlık="Bilgi ve belge isteme hakkı, bilgi ve belgelerin Kuruma verilme usûlü">
        <mvz-fıkra no="1">
          <template>5411 sayılı Bankacılık Kanunu kapsamındaki kuruluşlar, döner sermayeli kuruluşlar ile diğer gerçek ve tüzel kişiler doğrudan, münferit olarak bilgi ve belge istenmesi hariç olmak üzere kamu idareleri ile kanunla kurulan kurum ve kuruluşlar ise Kurumla yapılacak protokoller çerçevesinde, Devletin güvenliği ve temel dış yararlarına karşı ağır sonuçlar doğuracak hâller ile özel hayat ve aile hayatının gizliliği ve savunma hakkına ilişkin hükümler saklı kalmak kaydıyla özel kanunlardaki yasaklayıcı ve sınırlayıcı hükümler dikkate alınmaksızın gizli dahi olsa Kurum tarafından kişilerin sosyal güvenliğinin sağlanması, 6183 sayılı Kanuna göre Kurum alacaklarının takip ve tahsili ile bu Kanun kapsamında verilen diğer görevler ile sınırlı olmak üzere istenecek her türlü bilgi ve belgeyi sürekli ve/veya belli aralıklarla vermeye, bilgilerin elektronik ortamda görüntülenmesini sağlamaya, görüntülenen bu bilgilerin güvenliğini sağlamaya, muhafaza etmek zorunda oldukları her türlü belge ile vermek zorunda oldukları bilgilere ilişkin mikrofiş, mikrofilm, manyetik teyp, disket ve benzeri ortamlardaki kayıtlarını ve bu kayıtlara erişim veya kayıtları okunabilir hale getirmek için gerekli tüm sistem ve şifreleri incelemek için ibraz etmeye mecburdurlar.</template>

        <mvz-fıkra no="2">

        <mvz-fıkra no="3">

        <mvz-fıkra no="4">

        </mvz-bent>
        <mvz-bent no="m">
          <template>Kurumun prim tahakkukuna ve sigortalıların sosyal güvenlik haklarına dayanak teşkil eden bu Kanunun 86 ncı maddesinin on üçüncü fıkrası uyarınca verilmesi gereken beyannamedeki sigortalıların, prime esas kazançlarının veya hizmetlerinin bildirilmediği, eksik ya da geç bildirildiği anlaşılan her bir işyeri için;</template>
          <mvz-altbent no="1">
            <template>Beyannamenin asıl olması hâlinde, aylık asgari ücretin iki katını geçmemek kaydıyla beyannamede kayıtlı sigortalı sayısı başına, aylık asgari ücretin beşte biri tutarında,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Beyannamenin ek olması hâlinde, aylık asgari ücretin iki katını geçmemek kaydıyla her bir ek beyannamede kayıtlı sigortalı sayısı başına, aylık asgari ücretin sekizde biri tutarında,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Ek beyannamenin, 86 ncı maddenin beşinci fıkrasına istinaden Kurumca resen düzenlenmesi durumunda, aylık asgari ücretin iki katını geçmemek kaydıyla her bir ek beyannamede kayıtlı sigortalı sayısı başına, aylık asgari ücretin yarısı tutarında,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Beyannamenin mahkeme kararı, Kurumun denetim ve kontrol ile görevlendirilmiş memurlarınca yapılan tespitler veya diğer kamu idarelerinin denetim elemanlarınca kendi mevzuatları gereğince yapacakları soruşturma, denetim ve incelemeler neticesinde ya da bankalar, döner sermayeli kuruluşlar, kamu idareleri ile kanunla kurulan kurum ve kuruluşlardan alınan bilgi ve belgelerden, hizmetleri ve kazançları Kuruma bildirilmediği veya eksik bildirildiği ya da sadece hizmetlerinin Kuruma eksik bildirildiği anlaşılan sigortalılarla ilgili olması hâlinde, beyannamenin asıl veya ek nitelikte olup olmadığı, işverence düzenlenip düzenlenmediği dikkate alınmaksızın, aylık beyannamedeki her bir işyeri için,</template>
          </mvz-altbent>
          <mvz-altbent no="0">
            <template>a) Kamu idareleri ile 213 sayılı Vergi Usul Kanunu uyarınca bilanço esasına göre defter tutmak zorunda olanlar hakkında asgari ücretin üç katını geçmemek üzere sigortalı başına aylık asgari ücret tutarında,</template>
          </mvz-altbent>
          <mvz-altbent no="0">
            <template>b) Diğer defterleri tutmak zorunda olanlar hakkında asgari ücretin iki katını geçmemek üzere sigortalı başına yarım asgari ücret tutarında,</template>
          </mvz-altbent>
          <mvz-altbent no="0">
            <template>c) Defter tutmakla yükümlü olmayanlar hakkında aylık asgari ücreti geçmemek üzere sigortalı başına asgari ücretin üçte biri tutarında,</template>
          </mvz-altbent>
          <mvz-altbent no="0">
            <template>ç) Beyannamedeki her bir işyerinden bildirilen sigortalıların sadece prime esas kazançlarının eksik bildirildiğinin anlaşılması hâlinde ise beyannamenin asıl veya ek nitelikte olup olmadığı, işverence düzenlenip düzenlenmediği dikkate alınmaksızın, aylık asgari ücretin onda birinden az, iki katından fazla olmamak üzere tespit edilen prime esas kazanç tutarında,</template>
          </mvz-altbent>
          <mvz-altbent no="0">
            <template>idari para cezası uygulanır.</template>
          </mvz-altbent>
        </mvz-bent>  
        <mvz-bent no="n">
          <template>Muhtasar ve prim hizmet beyannamesinde, sigortalıların işyerlerinde fiilen yaptıkları işe uygun meslek adı ve kodunu, gerçeğe aykırı bildiren her bir işyeri için aylık asgari ücreti geçmemek üzere meslek adı ve kodu gerçeğe aykırı bildirilen sigortalı başına asgari ücretin onda biri tutarında idari para cezası uygulanır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mahkeme kararına, Kurumun denetim ve kontrol ile görevlendirilmiş memurlarınca yapılan tespitler veya diğer kamu idarelerinin denetim elemanlarınca kendi mevzuatları gereğince yapacakları soruşturma, denetim ve incelemelere ya da kamu idarelerinden alınan belgelere istinaden düzenlenenler hariç olmak üzere, bildirgenin veya belgenin yasal süresi geçtikten sonra ilgililerce kendiliğinden 30 gün içinde verilmesi ve söz konusu cezaların ilgililerce, yapılacak tebligat tarihini takip eden günden itibaren 15 gün içinde ödenmesi halinde, bu maddenin birinci fıkrasının (a), (b), (g), (h) ve (j) bentlerinde öngörülen cezalar dörtte bir oranına karşılık gelen tutar üzerinden uygulanır.  Kurumca, birinci fıkrada belirtilen bildirge, beyanname, belge veya defterlere istinaden sigortalıların ve çalışma gün sayılarının eksiksiz bildirilmesi şartıyla bildirilen prime esas kazanç tutarında, fiilin işlendiği tarihteki brüt asgari ücretin üçte birini geçmeyecek ve %1’ini aşmayacak şekilde eksiklik tespit edilmesi durumunda, eksikliğin on beş gün içinde düzeltilmesi için ilgiliye yazılı ihtar verilir. Bu süre sonunda tespit edilen eksik tutarın Kuruma bildirilmemesi halinde birinci fıkranın ilgili hükümlerine göre idari para cezası verilir. Eksikliğin işverence tespit edilmesi durumunda bu süre; bildirge, beyanname, belge veya defterlerin Kuruma verilmesinden itibaren on beş gündür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İdarî para cezası uygulanması 8 inci, 9 uncu, 11 inci ve 86 ncı maddelerde belirtilen belgelerin Kuruma verilmesi yükümlülüğünü kaldırmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İdarî para cezaları ilgiliye tebliğ ile tahakkuk eder. Tebliğ tarihinden itibaren onbeş gün içinde Kuruma ya da Kurumun ilgili hesaplarına yatırılır veya aynı süre içinde Kuruma itiraz edilebilir. İtiraz takibi durdurur. Kurumca itirazı reddedilenler, kararın kendilerine tebliğ tarihinden itibaren otuz gün içinde yetkili idare mahkemesine başvurabilirler. Bu süre içinde başvurunun yapılmamış olması halinde, idari para cezası kesinleşir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İdarî para cezalarının, Kuruma itiraz edilmeden veya yargı yoluna başvurulmadan önce tebliğ tarihinden itibaren onbeş gün içinde peşin ödenmesi halinde, bunun dörtte üçü tahsil edilir. Peşin ödeme idari para cezasına karşı yargı yoluna başvurma hakkını etkilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Mahkemeye başvurulması idari para cezasının takip ve tahsilini durdurmaz. Tebliğ tarihinden itibaren onbeş gün içinde ödenmeyen idari para cezaları, 89 uncu madde hükmü gereğince hesaplanacak gecikme cezası ve gecikme zammı ile birlikte tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İdarî para cezaları on yıllık zamanaşımı süresine tabidir. Zamanaşımı süresi, fiilin işlendiği tarihten itibaren başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>İdarî para cezaları hakkında, bu Kanun ve 16/5/2006 tarihli ve 5502 sayılı Sosyal Güvenlik Kurumu Kanununda hüküm bulunmayan hallerde 30/3/2005 tarihli ve 5326 sayılı Kabahatler Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="103" başlık="İdarî yaptırımlar ve fesih">
      <mvz-fıkra no="1">
        <template>Kurumca yapılan inceleme neticesinde;</template>
        <mvz-bent no="a">
          <template>Sağlık hizmeti sunulmadığı halde sağlık hizmetini fatura ettiği,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Faturayı veya faturaya dayanak oluşturan belgeleri, gerçeğe aykırı olarak düzenlediği,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>64 üncü madde gereğince kapsam dışı tutulan sağlık hizmetlerini, kapsam içinde olan sağlık hizmetleri gibi gösterdiği,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Sağlık hizmetlerine hak kazanmayan kişilere, sağlık hizmeti sunarak Kuruma fatura ettiği,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>73 üncü madde gereğince belirlenen tavanın üzerinde ilave ücret aldığı,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>tespit edilen sağlık hizmeti sunucuları hakkında genel hükümlere göre takip yapılır. Bu fiiller nedeniyle Kurumun yersiz ödediği tutar 96 ncı maddeye göre geri alınır. Ayrıca bu fiilleri işleyen veya sağlık hizmeti satınalınmasına ilişkin sözleşmelerde belirtilen hükümlere aykırı davrandığı tespit edilen sağlık hizmeti sunucularının Kurum ile yaptıkları sözleşmeleri feshedilebilir ve Kurumca belirlenecek süre içinde tekrar sözleşme yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>71 inci maddede yer alan kimlik tespiti yükümlülüğünü yapmayan ve bu nedenle bir başka kişiye sağlık hizmeti sunulması nedeniyle Kurumun zarara uğramasına sebebiyet veren sağlık hizmeti sunucularından uğranılan zarar geri alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurum müfettişlerince yapılan inceleme veya soruşturma esnasında yapılan tespitlere bağlı olarak, oluşabilecek Kurum alacağı tahsilinin riske gireceğinin öngörülmesi hâlinde, en az üç müfettişten oluşan komisyonun uygun görüşü ve Rehberlik ve Teftiş Başkanının onayıyla altı ayı geçmemek üzere, inceleme veya soruşturma sonuçlanıncaya kadar sağlık hizmeti sunucusunun Kurum nezdindeki muaccel veya müeccel alacaklarının ödemesi, tahsili riske gireceği öngörülen alacakla orantılı olarak durdurulabilir. Altı aylık süre içinde inceleme veya soruşturma sonuçlanmaz ise durdurma kararı kendiliğinden kalkar ve bu tarihten itibaren muaccel olan alacakları ödenmeye devam olunur. Altı aylık süre sonuna kadar ödemesi durdurulan alacaklar ise inceleme veya soruşturma sonuçlanıncaya kadar ödenmez. Ancak, sağlık hizmeti sunucusunun Kurum nezdindeki muaccel olan alacaklarının her biri için 6183 sayılı Kanunun l0 uncu maddesinin birinci fıkrasının 2 nci ve 3 üncü bentlerinde sayılanlar kapsamında teminat verilmesi hâlinde durdurma kararı bu kararı uygulayan Kurum ünitesi tarafından kaldırılır ve Kurum nezdindeki alacakları ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurum tarafından sözleşmesi feshedilmiş sağlık hizmeti sunucusuyla feshe neden olan fiillere bağlı olarak oluşan Kurum alacakları tahsil edilmeden ve fesih süresi tamamlanmadan yeni bir sözleşme yapılmaz. Söz konusu sağlık hizmeti sunucusunun devri hâlinde ise feshe neden olan Kurum alacakları tahsil edilmeden ve en az bir yıllık fesih süresi geçmeden devralan sağlık hizmeti sunucusu ile sözleşme yapılmaz. Sözleşme yapılmayan veya sözleşmesi feshedilen sağlık hizmeti sunucusunun muayene ve işlemlere ilişkin fatura bedelleri ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>5237 sayılı Kanunda belirtilen ve Kurum zararına neden olan nitelikli dolandırıcılık suçunun işlendiği kesinleşmiş mahkeme kararıyla sabit görülmesi şartıyla; söz konusu fiillerin sağlık hizmeti sunucusunun yöneticileri ve/veya ortakları tarafından işlendiği durumda aynı sağlık hizmeti sunucusuyla veya bunların daha sonra yönetici ve/veya ortak olduğu sağlık hizmeti sunucusuyla hiçbir şekilde sözleşme yapılmaz, bu fiillerin hekimler tarafından işlendiği durumda ise ilgili hekimlerle en az üç yıl süre ile sözleşme yapılmaz. Kesinleşmiş mahkeme kararının beklenmesi sağlık hizmeti satın alınmasına ilişkin sözleşmelerde belirtilen fesih sürelerinin uygulanmasına engel olmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>5237 sayılı Kanunda belirtilen nitelikli dolandırıcılık fiillerini işleyen sağlık hizmeti sunucusu ve/veya ilgili hekimler hakkında ruhsat iptali de dâhil olmak üzere gerekli tüm iş ve işlemler için keyfiyet Sağlık Bakanlığına bildirilir. Nitelikli dolandırıcılık fiillerini işleyerek Kurum zararına neden olmuş hekimlerden gelen muayene ve işlemlere ilişkin fatura bedelleri en az üç yıl süre ile ödenmez.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>

          <template>18/6/1992 tarihli ve 3816 sayılı Kanun 1/1/2012 tarihinde, 506 sayılı Kanunun ek 36 ncı ve geçici 20 nci maddeleri ise bu Kanunun geçici 20 nci maddesinde belirtilen devir işlemlerinin tamamlanmasından sonra yürürlükten kaldırılmıştır.</template>

      <mvz-madde no="107" başlık="Yönetmelikler">
        <mvz-fıkra no="1">
          <template>Bu Kanunda bahsi geçen yönetmelikler bu Kanunun yürürlük tarihinden itibaren bir yıl içerisinde çıkarılır. Kurum, bu Kanunun diğer maddelerinin uygulanmasına ilişkin usûl ve esasları yönetmelik ile düzenleme yetkisine sahiptir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="Kuruma yapılan bazı bildirimlerin yeterli sayılması" tür="EK">
        <mvz-fıkra no="1">
          <template>İşverenler tarafından 8 inci, 9 uncu ve 11 inci maddelere göre Kuruma yapılan sigortalı ve işyerlerine ilişkin bildirimler; 5953 sayılı Basın Mesleğinde Çalışanlarla Çalıştıranlar Arasındaki Münasebetlerin Tanzimi Hakkında Kanunun 3 üncü maddesi, 2821 sayılı Sendikalar Kanununun 62 nci maddesi, 4447 sayılı İşsizlik Sigortası Kanununun 48 inci maddesi ve 4857 sayılı İş Kanununun 3 üncü maddesi hükümleri uyarınca Bakanlık ile ilgili bölge müdürlüklerine ve Türkiye İş Kurumuna yapılması gereken bildirimlerin yerine geçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ticaret sicili memurluklarınca işyeri tesciline ilişkin Kuruma yapılan bildirimlerin dışında, ayrıca Bakanlık ilgili bölge müdürlüğüne bildirimde bulunulmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Geçici 20 nci maddede belirtilen sandıklar, Kuruma devir tarihine kadar iştirakçilerinin sandıkla ilgilerinin başlama ve sona ermesine ilişkin bildirimlerini en geç on gün içinde Kuruma yaparlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="EK">
        <mvz-fıkra no="1">
          <template>Yatırımlarda Devlet yardımları hakkında kararlar çerçevesinde düzenlenen teşvik belgeleri kapsamında gerçekleştirilecek yatırımlarla istihdam edilen sigortalılar için, 81 inci maddede sayılan ve 82 nci madde uyarınca belirlenen prime esas kazanç alt sınırı üzerinden hesaplanan sigorta primlerinin; işveren hisselerinin tamamına veya Cumhurbaşkanınca istatistiki bölge birimleri sınıflandırması, kişi başına düşen milli gelir veya sosyoekonomik gelişmişlik düzeyleri dikkate alınmak suretiyle belirlenen illerde işveren hisseleri ile birlikte sigortalı hisselerinin tamamına kadar olan kısmı Ekonomi Bakanlığı bütçesinden karşılanır. Cumhurbaşkanı ayrıca Ekonomi Bakanlığınca karşılanacak tutarın uygulama süresini, karşılama oranını ve kapsamını; yatırımın sektörü, büyüklüğü ve bulunduğu illere göre farklılaştırmaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Primlerin Ekonomi Bakanlığınca karşılanabilmesi için işverenlerce, çalıştırdıkları sigortalılarla ilgili olarak bu Kanun uyarınca aylık prim ve hizmet belgelerinin Kuruma, muhtasar ve prim hizmet beyannamelerinin Maliye Bakanlığına yasal süresi içerisinde  verilmesi ve Ekonomi Bakanlığınca karşılanmayan tutarın yasal süresi içinde ödenmiş olması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu madde hükümleri, 21/4/2005 tarihli ve 5335 sayılı Bazı Kanun ve Kanun Hükmünde Kararnamelerde Değişiklik Yapılmasına Dair Kanunun 30 uncu maddesinin ikinci fıkrası kapsamına giren kurum ve kuruluşlara ait işyerleri ile sosyal güvenlik destek primine tabi çalışanlar ve yurt dışında çalışan sigortalılar hakkında uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ekonomi Bakanlığınca karşılanan prim tutarları işverenler bakımından gelir ve kurumlar vergisi matrahının tespitinde gider veya maliyet unsuru olarak dikkate alınmaz. Bu Kanun gereğince yapılan kontrol ve denetimlerde, çalıştırdığı kişileri sigortalı olarak bildirmediği veya bildirilen sigortalının fiilen çalışmadığının tespit edilmesi halinde işverenler bir yıl süreyle bu maddeyle sağlanan destek unsurlarından yararlanamaz. Bu madde kapsamındaki teşvikten yersiz olarak faydalanıldığının tespiti halinde işverenden yararlanılan teşvik tutarı gecikme zammı ve gecikme cezası ile birlikte tahsil edilir. Ayrıca, işyerinde sigortalının fiilen çalışmadığı halde bildirildiğinin tespit edilmesi halinde işveren hakkında Cumhuriyet başsavcılığına suç duyurusunda bulunulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Ekonomi Bakanlığı ile Çalışma ve Sosyal Güvenlik Bakanlığı tarafından müştereken belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="EK" durum="mülga">
      </mvz-madde>
      <mvz-madde no="4" başlık="" tür="EK">
        <mvz-fıkra no="1">
          <template>Kamu idarelerinde çalışanlardan bu Kanunun 66 ncı maddesinin birinci fıkrasının (a) bendi kapsamına girenler için acil hallerle sınırlı olmak üzere sadece kendilerinin, aynı fıkranın (b) bendi ile söz konusu maddenin sekizinci fıkrası kapsamına girenlerin ise kendilerinin ve yurtdışında birlikte yaşadıkları bakmakla yükümlü olduğu kişilerin kamu kurumları tarafından yurtdışında sağlık hizmetlerinden yararlandırılması aşağıda belirtilen temel ilkelere göre yürütülür.</template>
          <mvz-bent no="1">
            <template>Eşlerin aylıksız izinli olması veya aylıksız izin süresini borçlanması, bu Kanunun geçici 4 üncü maddesi kapsamına girenler açısından isteğe bağlı iştirakçiliğin devam etmesi, sosyal güvenlik mevzuatı kapsamında eşin kendi adına aylık veya gelir bağlanmış olması, bakmakla yükümlü olunan aile ferdi sıfatını ortadan kaldırmaz.</template>
          </mvz-bent>
          <mvz-bent no="2">
            <template>Çocuklar için yetim aylığı bağlanmış olması bakmakla yükümlü olunan aile ferdi sıfatını ortadan kaldırmaz.</template>
          </mvz-bent>
          <mvz-bent no="3">
            <template>Kamu kurumlarınca bedeli ödenecek sağlık hizmetlerinin kapsamı, bu Kanunun 66 ncı maddesine göre Sosyal Güvenlik Kurumu Başkanlığı tarafından ödenen sağlık hizmetleri ile sınırlıdır. Ancak, bulunulan ülke mevzuatı gereğince zorunlu olarak yaptırılması gereken kontrol ve muayeneler ile aşı gibi Türkiye’de Sağlık Bakanlığı tarafından doğrudan ve ücretsiz olarak yürütülmesi sebebiyle 66 ncı madde kapsamında herhangi bir belirleme yapılmamış sağlık hizmetlerine ilişkin giderler Türkiye’deki uygulamanın sınırlılıkları dahilinde ayrıca ödenir.</template>
          </mvz-bent>
          <mvz-bent no="4">
            <template>68 inci maddede belirtilen tutar veya oranları geçmemek kaydıyla, Dışişleri Bakanlığı ve Maliye Bakanlığı tarafından tespit edilecek tutar, oran ve usule göre katılım payı alınır. Alınan katılım payları, ilgisine göre genel bütçeye ya da ilgili kurum bütçesine gelir kaydedilir.</template>
          </mvz-bent>
          <mvz-bent no="5">
            <template>Tıbbi lüzum üzerine yaptırılan diş tedavileri sonucu doğan giderler;</template>
            <mvz-altbent no="a">
              <template>a) Diş çekimi, kanal tedavisi, diş dolguları ve travma sonucu oluşan çene defektlerine yapılan cerrahi müdahalelerle, protez tamirlerine ait tedavi bedelleri aynen,</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>Diğer diş tedavilerine ait giderler ise, bedeli ödenecek her bir diş tedavisi kalemi için faturada yer alan tutarı geçmemek kaydıyla, Sosyal Güvenlik Kurumu tarafından aynı tedavi için tespit edilen birim fiyatların % 100 oranında artırılması suretiyle bulunacak miktar üzerinden,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="0">
            <template>ödenir.</template>
          </mvz-bent>
          <mvz-bent no="6">
            <template>Gözlük camı ve çerçeveye ilişkin tedavi bedeli, bedeli ödenebilecek her bir kalem için faturada yer alan tutarı geçmemek kaydıyla, Sosyal Güvenlik Kurumu tarafından tespit edilen birim fiyatların %100 oranında artırılması suretiyle bulunacak miktar üzerinden ödenir.</template>
          </mvz-bent>
          <mvz-bent no="7">
            <template>Sürekli görev yaptıkları memuriyet merkezinde tedavileri sağlanamadığı için aynı ülke içinde başka bir yere tedavi amacıyla sevk edilenlerin, yurtdışı gündeliklerine dair karar ekinde yer alan cetvelde belirlenen miktar kadar gündelik ve fiilen kullandıkları taşıtlara ilişkin gider belgelendirilmiş olması kaydıyla ödenir. Kendi araçlarını kullanmış olanlara yapılacak ödeme, o ülkede aynı yer için geçerli olan genel ulaşım türü esas alınarak belirlenir.</template>
          </mvz-bent>
          <mvz-bent no="8">
            <template>Yurtdışında sağlık hizmetinden ve yol giderlerinden yararlanacak olanların hastalanmaları halinde tedavilerinin sağlanabilmesi için, gerekli olması halinde tedaviye mahalli usule göre lüzum gösterilmiş olması zorunludur.</template>
          </mvz-bent>
          <mvz-bent no="9">
            <template>Kamu kurumlarınca bedeli ödenecek tutarın yurtdışına transferi halinde, yılın ilk günündeki kurlar esas alınır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kapsama dahil kişilerin sağlık hizmetlerinden yararlanmasına ilişkin usul ve esaslar ile bu maddenin uygulanmasına ilişkin diğer hususlar, Maliye Bakanlığının koordinatörlüğünde, Dışişleri Bakanlığı, Milli Savunma Bakanlığı, Sağlık Bakanlığı ve Sosyal Güvenlik Kurumu Başkanlığı tarafından müştereken çıkarılacak bir yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Tarım veya orman işlerinde hizmet akdiyle süreksiz olarak çalışanların sigortalılığı" tür="EK">
        <mvz-fıkra no="1">
          <template>4 üncü madde ile isteğe bağlı sigortalılık hükümleri ve 506 sayılı Kanunun geçici 20 nci maddesi kapsamında sigortalı olmayan, kendi sigortalılıklarından dolayı bu kanunlara göre gelir veya aylık almayan ve 18 yaşını doldurmuş olanlardan; tarım veya orman işlerinde hizmet akdiyle süreksiz olarak çalışanlar, örneği Kurumca hazırlanan ve Kurumca belirlenen ilgili muhtarlık, birlik, kuruluş, il veya ilçe tarım müdürlükleri tarafından usulüne uygun olarak düzenlenip onaylanmış belgeleri ile talepte bulundukları tarihten itibaren sigortalı sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu madde kapsamındaki sigortalılık; 4 üncü maddenin birinci fıkrasının (b) bendinin (4) numaralı alt bendi dâhil olmak üzere 4 üncü maddeye istinaden sigortalı olarak çalışmaya başlayanların çalışmaya başladıkları tarihten, sigortalılıklarını sona erdirme talebinde bulunanların talep tarihinden, prim borcu bulunanlardan talepte bulunanların primi ödenmiş son günden, gelir ya da aylık talebinde bulunanların aylığa hak kazanmış olmak şartıyla talep tarihinden ve ölen sigortalının ölüm tarihinden itibaren sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu madde kapsamındaki sigortalıların 4 üncü madde kapsamında çalışmaları halinde, bu madde kapsamındaki sigortalılıkları sona erer. 4 üncü madde kapsamındaki çalışmanın sona ermesi halinde, bu madde kapsamındaki çalışmasının devam etmesi kaydıyla çalışmanın sona erdiği tarihi takip eden günden itibaren bu madde kapsamındaki sigortalılıkları kendiliğinden başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Tarım veya orman işlerinde hizmet akdiyle süreksiz olarak çalışanlar, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılırlar. Bunlar hakkında bu Kanunun kısa vadeli sigorta kolları bakımından yalnızca iş kazası ve meslek hastalığı sigortası, uzun vadeli sigorta kolları yönünden malullük, yaşlılık ve ölüm sigortası ile genel sağlık sigortası hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu madde hükümlerine tabi sigortalıların iş kazası ve meslek hastalığı sigorta kollarından sağlanan yardımlardan yararlanabilmeleri için iş kazasının olduğu tarihten en az on gün önce tescil edilmiş olmaları ve sigortalılıklarının sona ermemiş olması, bu Kanuna göre iş kazası veya meslek hastalığından dolayı geçici iş göremezlik ödeneği ödenmesi veya sürekli iş göremezlik geliri ya da malullük, yaşlılık ve ölüm sigortalarından aylık bağlanabilmesi için prim ve prime ilişkin her türlü borçlarının ödenmiş olması şartı aranır. İş kazası ve meslek hastalığı halinde durum, kendilerince veya işverenlerince kolluk kuvvetlerine derhal, Kuruma da en geç üç iş günü içinde bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu madde kapsamındaki sigortalılar, 82 nci maddeye göre belirlenen prime esas kazancın alt ve üst sınırı arasında olmak kaydıyla sigortalı tarafından belirlenen günlük kazancın otuz katının %35,5’i oranında prim öderler. Bunun %21’i malûllük, yaşlılık ve ölüm sigortaları, %12,5’i genel sağlık sigortası, %2’si iş kazası ve meslek hastalıkları sigortası primidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu madde kapsamındaki sigortalılar ve bakmakla yükümlü olduğu kişilerin, genel sağlık sigortası hükümlerinden yararlanabilmesi için 67 nci maddede sayılan diğer şartların yanı sıra sağlık hizmeti sunucusuna başvurduğu tarihte 6183 sayılı Kanunun 48 inci maddesine göre tecil ve taksitlendirerek tecil ve taksitlendirmeleri devam edenler hariç 60 günden fazla prim ve prime ilişkin her türlü borcunun bulunmaması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Bu madde kapsamındaki sigortalıların primlerinin yılda bir veya birden fazla dönem halinde ödenmesini ve ödeme tarihlerini belirlemeye Kurum yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Bu madde kapsamındaki sigortalılar ile ilgili olarak bu maddede aksine hüküm bulunmaması kaydıyla bu Kanunun ilgili hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Kamu idarelerinin tarım veya orman işlerinde hizmet akdiyle süreksiz olarak çalıştırılanlar hakkında bu madde hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Kurum tarafından çıkarılan yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Bazı kısmi süreli çalışanların sigortalılıkları" tür="EK">
        <mvz-fıkra no="1">
          <template>Ticari taksi, dolmuş ve benzeri nitelikteki şehir içi toplu taşıma aracı işyerleri ile 4 üncü maddenin ikinci fıkrasının (b) bendinde belirtilen ve Kültür ve Turizm Bakanlığınca belirlenecek alanlarda kısmi süreli iş sözleşmesiyle bir veya birden fazla kişi tarafından çalıştırılan ve çalıştıkları kişi yanında ay içerisinde çalışma saati süresine göre hesaplanan çalışma gün sayısı 10 günden az olan kişilerin sigortalılıkları, bu madde kapsamında kendileri tarafından 30 gün üzerinden prim ödemeleri suretiyle sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">

      <mvz-madde no="7" başlık="" tür="EK">

        </mvz-fıkra>
        <mvz-fıkra no="2">

      <mvz-madde no="9" başlık="Ev hizmetlerinde çalışanların sigortalılığı ve konut kapıcılığı" tür="EK">

          <template>Ev hizmetlerinde bir veya birden fazla gerçek kişi tarafından çalıştırılan ve çalıştıkları kişi yanında ay içinde çalışma saati süresine göre hesaplanan çalışma gün sayısı 10 gün ve daha fazla olan sigortalılar ile konut kapıcılığı işyerlerinde çalıştırılan sigortalılar hakkında Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamındaki sigortalılara ilişkin hükümler uygulanır. Bunların bildirimi, işverenler tarafından örneği Kurumca hazırlanan belgeyle en geç çalışmanın geçtiği ayın sonuna kadar yapılır. Süresinde yapılmayan bildirim için işverene 102 nci maddenin birinci fıkrasının (a) bendinin (1) numaralı alt bendi hükmü uygulanır.</template>

        <mvz-fıkra no="2">
          <template>Ev hizmetlerinde bir veya birden fazla gerçek kişi tarafından çalıştırılan ve çalıştıkları kişi yanında ay içinde çalışma saati süresine göre hesaplanan çalışma gün sayısı 10 günden az olanlar için ise, çalıştırıldıkları süreyle orantılı olarak çalıştıranlarca 82 nci maddeye göre belirlenen prime esas günlük kazanç alt sınırının %2’si oranında iş kazası ve meslek hastalığı sigortası primi ödenir. Bu şekilde çalışanların sigortalılık tescili, çalışan ve çalıştıran imzalarını da ihtiva eden ve en geç çalışmanın geçtiği ayın sonuna kadar Kuruma verilmesi gereken örneği Kurumca hazırlanacak belgenin Kuruma verilmesi ile sağlanır. Sigortalılık başlangıcında bu belge üzerinde çalışma başlangıcına dair kayıtlı en eski tarih esas alınır. Bunlar hakkında hastalık sigortası hükümleri uygulanmaz. Bu fıkra kapsamına girenler, adlarına ödenen priminin ait olduğu ayı takip eden ayın sonuna kadar aynı kazancın otuz katının %33,5 oranında prim ödeyebilir. Bunun %21’i malullük, yaşlılık ve ölüm sigortaları, %12,5'i genel sağlık sigortası primidir. Bu süre içinde ödenmeyen primin ödenme hakkı düşer. Ödenen primler 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalılık sayılır.</template>

          <template>İkinci fıkra kapsamındakileri çalıştıranlar bu Kanun uygulamasında işveren sayılmaz. Sigortalının iş kazası ve meslek hastalığı sigorta kollarından sağlanan yardımlardan yararlanabilmesi için iş kazasının olduğu tarihten en az on gün önce tescil edilmiş olması ve sigortalılığının sona ermemiş olması, bu Kanuna göre iş kazası veya meslek hastalığından dolayı geçici iş göremezlik ödeneği ödenmesi veya sürekli iş göremezlik geliri ya da malullük, yaşlılık ve ölüm sigortalarından aylık bağlanabilmesi için prim ve prime ilişkin her türlü borçlarının ödenmiş olması şarttır. Bu sigortalılar ile ilgili iş kazası ve meslek hastalığı olaylarında Kanunun 21 inci maddesinin birinci fıkrası hükümleri uygulanmaz.</template>

        <mvz-fıkra no="4">

        <mvz-fıkra no="5">

      <mvz-madde no="11" başlık="" tür="EK">

          <template>4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı sayılanlardan, doğum veya evlat edinmeye bağlı olarak ilgili mevzuatına göre yarım zamanlı çalışma hakkından yararlanmaları nedeniyle mali hakları ile sosyal yardımları yarım ödenenlerin, bu şekilde ödeme yapılan döneme ilişkin fiili hizmet süreleri ile prim ödeme gün sayıları yarım olarak hesaplanır. Yarım zamanlı olarak çalışılmaya başlanan günü izleyen ay başından itibaren normal zamanlı çalışılması hâlinde ödenmesi gereken sigorta primine esas aylık kazanç ya da emekli keseneğine esas aylık tutarının yarısı üzerinden sigorta primi veya emekli keseneği ödenir. Ancak, bunların genel sağlık sigortası primi sigortalı ve işveren yükümlülüğünde herhangi bir değişiklik yapılmaksızın sigorta primine esas aylık kazanç ya da emekli keseneğine esas aylık tutarının tamamı üzerinden ödenir. Bu maddenin primlerin ve prim ödeme gün sayılarının yarım olarak uygulanacağına dair hükümleri yarım zamanlı çalışanlardan ek 3 üncü madde uyarınca ilave prim ödeyenler hakkında da uygulanır.</template>

      <mvz-madde no="23" başlık="" tür="EK">
        <mvz-fıkra no="1">
          <template>Kömür ve linyit madenlerinin yer altı işlerinde meydana gelen iş kazası sonucunda ölen sigortalının; genel sağlık sigortası primi dâhil kendi sigortalılığı nedeniyle prim ve prime ilişkin her türlü borçları terkin edilir ve ölüm tarihinde sigortalıya ilişkin şartlar aranmaksızın hak sahiplerine aylık bağlanır. Bu şekilde bağlanan aylıklara ilişkin primlerin eksik olan kısmı Hazine ve Maliye Bakanlığınca Kuruma ödenir.</template>

        <mvz-fıkra no="4">

        <mvz-fıkra no="5">

      <mvz-madde no="2" başlık="Bu Kanundan önce yürürlükte bulunan sosyal güvenlik kanunlarına tâbi geçen çalışmalar için bağlanacak aylıkların hesabı" tür="GEÇİCİ">

        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu Kanunun yürürlüğe girdiği tarihten önce sigortalı veya iştirakçi olup, bu Kanunun yürürlüğe girdiği tarihten sonra aylık talebinde bulunanlardan, farklı sosyal güvenlik kurumlarına ya da bu Kanunda belirtilen sigortalılık hallerinden birden fazlasına tabi olanlara aylık bağlanmasına esas alınacak kanun, bu Kanunla mülga 2829 sayılı Kanun hükümlerine göre tespit olunur ve bunlar hakkında, bu Kanunun geçici maddelerindeki hükümler uygulanır. Ancak, bunlardan bu Kanunun geçici 4 üncü maddesi kapsamına girmeyenlere 5434 sayılı Kanun hükümleri uygulanmaz. Bu Kanunla mülga 2829 sayılı Kanuna göre 5434 sayılı Kanun hükümleri uygulanması gerekenlerden, bu Kanunun geçici 4 üncü maddesi kapsamına girmeyenler için, bu maddenin birinci fıkrasının (a) ve (b) bentleri esas alınır. (a) bendi hükümlerinin uygulamasına esas alınacak kanun, bu Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında geçen süreler hariç, bu Kanunla mülga 2829 sayılı Kanun hükümlerine göre belirlenir. Bu Kanuna tabi hizmetlerle 506 sayılı Kanunun geçici 20 nci maddesine tabi sandıklarda geçen hizmetlerin birleştirilmesinde de bu fıkra hükümleri esas alınmak suretiyle bu Kanunla mülga 2829 sayılı Kanun hükümleri uygulanır.</template>

          <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla 8/6/1949 tarihli ve 5434 sayılı Kanuna göre; aylık, tazminat, harp malûllüğü zammı, diğer ödemeler ve yardımlar ile 8/2/2006 tarihli ve 5454 sayılı Kanunun 1 inci maddesine göre ek ödeme verilmekte olanlara, bu Kanunla yürürlükten kaldırılan hükümleri de dahil 5434 sayılı Kanunda kendileri için belirtilmiş olan şartları haiz oldukları müddetçe bunların ödenmesine devam olunur. Ancak, 5 ilâ 10 yıl arasında fiili hizmet süresi olan iştirakçilerden dolayı dul ve yetim aylığı almakta olanların, aylık ve diğer ödemeleri, bu Kanunun 32 nci, 34 üncü ve 37 nci maddelerindeki şartları haiz oldukları müddetçe devam edilir.</template>

        <mvz-fıkra no="2">

        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>5434 sayılı Kanuna göre iştirakçi olup bu Kanunun yürürlüğe girdiği tarihten sonra bu Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendine tabi olarak çalışmaya başlayanlardan vazife malûllüğü kapsamına girenler hakkında, bu Kanunun 47 nci maddesinin birinci fıkrasına göre işlem yapılır.  5434 sayılı Kanunun mülga hükümlerine göre vazife malullüğü aylığı bağlananlardan malullüklerinin sürekli olduğuna Kurum Sağlık Kurulunca karar verilen iştirakçiler yine aynı Kanunun 40 ıncı maddesinde belirtilen yaş hadleri ile özel kanunlarındaki yaş hadlerini doldurduğu tarihe kadar yeniden muayene edilmelerini Kurumdan isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunda aksine bir hüküm bulunmadığı takdirde; iştirakçi iken, bu Kanunun yürürlüğe girdiği tarih itibarıyla bu Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamına alınanlar, bu Kanunun yürürlüğe girdiği tarihten önce 5434 sayılı Kanun hükümlerine tabi olarak çalışmış olup bu Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendine tabi olarak yeniden çalışmaya başlayanlar ile bunların dul ve yetimleri hakkında bu Kanunla yürürlükten kaldırılan hükümleri de dahil 5434 sayılı Kanun hükümlerine göre işlem yapılır.  Bu fıkra kapsamına girenlerden 375 sayılı Kanun Hükmünde Kararnamenin ek 10 uncu maddesi kapsamında bulunanların emekli kesenekleri ile kurum karşılıklarının hesabında, işgal ettikleri kadrolar için ilgili mevzuatında belirlenen unsurlar esas alınır.</template>
