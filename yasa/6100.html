  <mvz-künye tür="kanun" no="6100" başlık="HUKUK MUHAKEMELERİ KANUNU"
             tarih="12/1/2011" rgazete-tarih="4/2/2011" rgazete-sayı="27836"
             düstur-tertip="5" düstur-cilt="50" />
  
  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Görev, Yetki ve Yargı Yeri Belirlenmesi">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Görev">
        <mvz-madde no="1" başlık="Görevin belirlenmesi ve niteliği">
          <mvz-fıkra no="1">
            <template>Mahkemelerin görevi, ancak kanunla düzenlenir. Göreve ilişkin kurallar, kamu düzenindendir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="2" başlık="Asliye hukuk mahkemelerinin görevi">
          <mvz-fıkra no="1">
            <template>Dava konusunun değer ve miktarına bakılmaksızın malvarlığı haklarına ilişkin davalarla, şahıs varlığına ilişkin davalarda görevli mahkeme, aksine bir düzenleme bulunmadıkça asliye hukuk mahkemesidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu Kanunda ve diğer kanunlarda aksine düzenleme bulunmadıkça, asliye hukuk mahkemesi diğer dava ve işler bakımından da görevlidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="3" başlık="Ölüm veya vücut bütünlüğünün yitirilmesinden doğan zararların tazmini davalarında görev" durum="iptal">
        </mvz-madde>
        <mvz-madde no="4" başlık="Sulh hukuk mahkemelerinin görevi">
          <mvz-fıkra no="1">
            <template>Sulh hukuk mahkemeleri, dava konusunun değer veya tutarına bakılmaksızın;</template>
            <mvz-bent no="a">
              <template>Kiralanan taşınmazların, 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanununa göre ilamsız icra yoluyla tahliyesine ilişkin hükümler ayrık olmak üzere, kira ilişkisinden doğan alacak davaları da dâhil olmak üzere tüm uyuşmazlıkları konu alan davalar ile bu davalara karşı açılan davaları,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Taşınır ve taşınmaz mal veya hakkın paylaştırılmasına ve ortaklığın giderilmesine ilişkin davaları,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Taşınır ve taşınmaz mallarda, sadece zilyetliğin korunmasına yönelik olan davaları,</template>
            </mvz-bent>
            <mvz-bent no="ç">
              <template>Bu Kanun ile diğer kanunların, sulh hukuk mahkemesi veya sulh hukuk hâkimini görevlendirdiği davaları,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>görürler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Yetki">
        <mvz-madde no="5" başlık="Genel kural">
          <mvz-fıkra no="1">
            <template>Mahkemelerin yetkisi, diğer kanunlarda yer alan yetkiye ilişkin hükümler saklı kalmak üzere, bu Kanundaki hükümlere tabidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="6" başlık="Genel yetkili mahkeme">
          <mvz-fıkra no="1">
            <template>Genel yetkili mahkeme, davalı gerçek veya tüzel kişinin davanın açıldığı tarihteki yerleşim yeri mahkemesidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yerleşim yeri, 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanunu hükümlerine göre belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="7" başlık="Davalının birden fazla olması hâlinde yetki">
          <mvz-fıkra no="1">
            <template>Davalı birden fazla ise dava, bunlardan birinin yerleşim yeri mahkemesinde açılabilir. Ancak, dava sebebine göre kanunda, davalıların tamamı hakkında ortak yetkiyi taşıyan bir mahkeme belirtilmişse, davaya o yer mahkemesinde bakılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birden fazla davalının bulunduğu hâllerde, davanın, davalılardan birini sırf kendi yerleşim yeri mahkemesinden başka bir mahkemeye getirmek amacıyla açıldığı, deliller veya belirtilerle anlaşılırsa, mahkeme, ilgili davalının itirazı üzerine, onun hakkındaki davayı ayırarak yetkisizlik kararı verir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="8" başlık="Bir yerde geçici olarak oturanlara karşı açılacak davalarda yetki">
          <mvz-fıkra no="1">
            <template>Memur, işçi, öğrenci, asker gibi, bir yerde geçici olarak oturanlara karşı açılacak alacak veya taşınır mal davaları için, orada bulunmaları uzunca bir süre devam edebilecekse, bulundukları yer mahkemesi de yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="9" başlık="Türkiye’de yerleşim yerinin bulunmaması hâlinde yetki">
          <mvz-fıkra no="1">
            <template>Türkiye’de yerleşim yeri bulunmayanlar hakkında genel yetkili mahkeme, davalının Türkiye’deki mutad meskeninin bulunduğu yer mahkemesidir. Ancak, diğer özel yetki hâlleri saklı kalmak üzere, malvarlığı haklarına ilişkin dava, uyuşmazlık konusu malvarlığı unsurunun bulunduğu yerde de açılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="10" başlık="Sözleşmeden doğan davalarda yetki">
          <mvz-fıkra no="1">
            <template>Sözleşmeden doğan davalar, sözleşmenin ifa edileceği yer mahkemesinde de açılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="11" başlık="Mirastan doğan davalarda yetki">
          <mvz-fıkra no="1">
            <template>Aşağıdaki davalarda, ölen kimsenin son yerleşim yeri mahkemesi kesin yetkilidir:</template>
            <mvz-bent no="a">
              <template>Terekenin paylaşılmasına, yapılan paylaşma sözleşmesinin geçersizliğine, ölüme bağlı tasarrufların iptali ve tenkisine, miras sebebiyle istihkaka ilişkin davalar ile mirasçılar arasında terekenin yönetiminden kaynaklanan davalar.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Terekenin kesin paylaşımına kadar mirasçılara karşı açılacak tüm davalar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Terekede bulunan bir mal hakkında açılmak istenen istihkak davası, terekenin yazımı ve tespiti zamanında mal nerede bulunuyorsa, orada da açılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mirasçılık belgesinin iptali ve yeni mirasçılık belgesi verilmesine ilişkin davalarda, mirasçıların her birinin oturduğu yer mahkemesi de yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="12" başlık="Taşınmazın aynından doğan davalarda yetki">
          <mvz-fıkra no="1">
            <template>Taşınmaz üzerindeki ayni hakka ilişkin veya ayni hak sahipliğinde değişikliğe yol açabilecek davalar ile taşınmazın zilyetliğine yahut alıkoyma hakkına ilişkin davalarda, taşınmazın bulunduğu yer mahkemesi kesin yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İrtifak haklarına ilişkin davalar, üzerinde irtifak hakkı kurulan taşınmazın bulunduğu yer mahkemesinde açılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu davalar, birden fazla taşınmaza ilişkinse, taşınmazlardan birinin bulunduğu yerde, diğerleri hakkında da açılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="13" başlık="Karşı davada yetki">
          <mvz-fıkra no="1">
            <template>Kesin yetkinin söz konusu olmadığı hâllerde, asıl davaya bakan mahkeme, karşı davaya bakmaya da yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="14" başlık="Şubeler ve tüzel kişilerle ilgili davalarda yetki">
          <mvz-fıkra no="1">
            <template>Bir şubenin işlemlerinden doğan davalarda, o şubenin bulunduğu yer mahkemesi de yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Özel hukuk tüzel kişilerinin, ortaklık veya üyelik ilişkileriyle sınırlı olmak kaydıyla, bir ortağına veya üyesine karşı veya bir ortağın yahut üyenin bu sıfatla diğerlerine karşı açacakları davalar için, ilgili tüzel kişinin merkezinin bulunduğu yer mahkemesi kesin yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="15" başlık="Sigorta sözleşmelerinden doğan davalarda yetki">
          <mvz-fıkra no="1">
            <template>Zarar sigortalarından doğan davalar, sigorta, bir taşınmaza veya niteliği gereği bir yerde sabit bulunması gereken yahut şart kılınan taşınıra ilişkinse, malın bulunduğu yerde; bir yerde sabit bulunması gerekmeyen veya şart kılınmayan bir taşınıra ilişkinse, rizikonun gerçekleştiği yerde de açılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Can sigortalarında, sigorta ettirenin, sigortalının veya lehtarın leh veya aleyhine açılacak davalarda onların yerleşim yeri mahkemesi kesin yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu hüküm deniz sigortalarından doğan davalarda uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="16" başlık="Haksız fiilden doğan davalarda yetki">
          <mvz-fıkra no="1">
            <template>Haksız fiilden doğan davalarda, haksız fiilin işlendiği veya zararın meydana geldiği yahut gelme ihtimalinin bulunduğu yer ya da zarar görenin yerleşim yeri mahkemesi de yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="17" başlık="Yetki sözleşmesi">
          <mvz-fıkra no="1">
            <template>Tacirler veya kamu tüzel kişileri, aralarında doğmuş veya doğabilecek bir uyuşmazlık hakkında, bir veya birden fazla mahkemeyi sözleşmeyle yetkili kılabilirler. Taraflarca aksi kararlaştırılmadıkça dava sadece sözleşmeyle belirlenen bu mahkemelerde açılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="18" başlık="Yetki sözleşmesinin geçerlilik şartları">
          <mvz-fıkra no="1">
            <template>Tarafların üzerinde serbestçe tasarruf edemeyecekleri konular ile kesin yetki hâllerinde, yetki sözleşmesi yapılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yetki sözleşmesinin geçerli olabilmesi için yazılı olarak yapılması, uyuşmazlığın kaynaklandığı hukuki ilişkinin belirli veya belirlenebilir olması ve yetkili kılınan mahkeme veya mahkemelerin gösterilmesi şarttır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="19" başlık="Yetki itirazının ileri sürülmesi">
          <mvz-fıkra no="1">
            <template>Yetkinin kesin olduğu davalarda, mahkeme yetkili olup olmadığını, davanın sonuna kadar kendiliğinden araştırmak zorundadır; taraflar da mahkemenin yetkisiz olduğunu her zaman ileri sürebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yetkinin kesin olmadığı davalarda, yetki itirazının, cevap dilekçesinde ileri sürülmesi gerekir. Yetki itirazında bulunan taraf, yetkili mahkemeyi; birden fazla yetkili mahkeme varsa seçtiği mahkemeyi bildirir. Aksi takdirde yetki itirazı dikkate alınmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkeme, yetkisizlik kararında yetkili mahkemeyi de gösterir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yetkinin kesin olmadığı davalarda, davalı, süresi içinde ve usulüne uygun olarak yetki itirazında bulunmazsa, davanın açıldığı mahkeme yetkili hâle gelir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Görevsizlik veya Yetkisizlik Kararı Üzerine Yapılacak İşlemler ve Yargı Yeri Belirlenmesi">
        <mvz-madde no="20" başlık="Görevsizlik veya yetkisizlik kararı üzerine yapılacak işlemler">
          <mvz-fıkra no="1">
            <template>Görevsizlik veya yetkisizlik kararı verilmesi hâlinde, taraflardan birinin, bu karar verildiği anda kesin ise tebliğ tarihinden,  süresi içinde kanun yoluna başvurulmayarak kesinleşmiş ise kararın kesinleştiği tarihten; kanun yoluna başvurulmuşsa bu başvurunun reddi kararının tebliğ tarihinden itibaren iki hafta içinde kararı veren mahkemeye başvurarak, dava dosyasının görevli ya da yetkili mahkemeye gönderilmesini talep etmesi gerekir. Aksi takdirde dava açılmamış sayılır ve görevsizlik veya yetkisizlik kararı veren mahkemece bu konuda resen karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dosya kendisine gönderilen mahkeme, kendiliğinden taraflara davetiye gönderir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="21" başlık="Yargı yeri belirlenmesini gerektiren sebepler">
          <mvz-fıkra no="1">
            <template>Aşağıdaki hâllerde, davaya bakacak mahkemenin tayini için yargı yeri belirlenmesi yoluna başvurulur:</template>
            <mvz-bent no="a">
              <template>Davaya bakmakla görevli ve yetkili mahkemenin davaya bakmasına herhangi bir engel çıkarsa.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>İki mahkeme arasında yargı çevrelerinin sınırlarının belirlenmesi konusunda bir tereddüt ortaya çıkarsa.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İki mahkeme de görevsizlik kararı verir ve bu kararlar kanun yoluna başvurulmaksızın kesinleşirse.</template>
            </mvz-bent>
            <mvz-bent no="ç">
              <template>Kesin yetki hâllerinde, iki mahkeme de yetkisizlik kararı verir ve bu kararlar kanun yoluna başvurulmaksızın kesinleşirse.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="22" başlık="İnceleme yeri">
          <mvz-fıkra no="1">
            <template>Yetkili mahkemenin bir davaya bakmasına herhangi bir engel bulunduğu yahut iki mahkeme arasında yargı çevrelerinin sınırlarının belirlenmesinde tereddüt ortaya çıktığı takdirde, yetkili mahkemenin tayininde, ilk derece mahkemeleri için bölge adliye mahkemelerine, bölge adliye mahkemeleri için Yargıtaya başvurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İki mahkemenin aynı dava hakkında göreve veya yetkiye ilişkin olarak verdikleri kararlar kanun yoluna başvurulmaksızın kesinleştiği takdirde, görevli veya yetkili mahkeme, ilgisine göre bölge adliye mahkemesince veya Yargıtayca belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="23" başlık="İnceleme usulü ve sonucu">
          <mvz-fıkra no="1">
            <template>Yargı yerinin belirlenmesine ilişkin inceleme dosya üzerinden yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bölge adliye mahkemesince veya Yargıtayca verilen yargı yeri belirlenmesi ile kanun yolu incelemesi sonucunda kesinleşen göreve veya yetkiye ilişkin kararlar, davaya ondan sonra bakacak mahkemeyi bağlar.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Yargılamaya Hâkim Olan İlkeler">
      <mvz-madde no="24" başlık="Tasarruf ilkesi">
        <mvz-fıkra no="1">
          <template>Hâkim, iki taraftan birinin talebi olmaksızın, kendiliğinden bir davayı inceleyemez ve karara bağlayamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanunda açıkça belirtilmedikçe, hiç kimse kendi lehine olan davayı açmaya veya hakkını talep etmeye zorlanamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tarafların üzerinde serbestçe tasarruf edebilecekleri dava konusu hakkında, dava açıldıktan sonra da tasarruf yetkisi devam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="Taraflarca getirilme ilkesi">
        <mvz-fıkra no="1">
          <template>Kanunda öngörülen istisnalar dışında, hâkim, iki taraftan birinin söylemediği şeyi veya vakıaları kendiliğinden dikkate alamaz ve onları hatırlatabilecek davranışlarda dahi bulunamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanunla belirtilen durumlar dışında, hâkim, kendiliğinden delil toplayamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Taleple bağlılık ilkesi">
        <mvz-fıkra no="1">
          <template>Hâkim, tarafların talep sonuçlarıyla bağlıdır; ondan fazlasına veya başka bir şeye karar veremez. Duruma göre, talep sonucundan daha azına karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hâkimin, tarafların talebiyle bağlı olmadığına ilişkin kanun hükümleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Hukuki dinlenilme hakkı">
        <mvz-fıkra no="1">
          <template>Davanın tarafları, müdahiller ve yargılamanın diğer ilgilileri, kendi hakları ile bağlantılı olarak hukuki dinlenilme hakkına sahiptirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu hak;</template>
          <mvz-bent no="a">
            <template>Yargılama ile ilgili olarak bilgi sahibi olunmasını,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Açıklama ve ispat hakkını,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Mahkemenin, açıklamaları dikkate alarak değerlendirmesini ve kararların somut ve açık olarak gerekçelendirilmesini,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>içerir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="Aleniyet ilkesi">
        <mvz-fıkra no="1">
          <template>Duruşma ve kararların bildirilmesi alenidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Duruşmaların bir kısmının veya tamamının gizli olarak yapılmasına ancak genel ahlâkın veya kamu güvenliğinin  kesin olarak gerekli kıldığı hâllerde, ilgilinin talebi üzerine yahut resen mahkemece karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tarafların gizlilik talebi ön sorunlar hakkındaki hükümler çerçevesinde gizli duruşmada incelenir ve karara bağlanır. Hâkim, bu kararının gerekçelerini, esas hakkındaki kararı ile birlikte açıklar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Hâkim, gizli yargılama işlemleri sırasında hazır bulunanları o yargılamayla ilgili edindikleri bilgileri açıklamamaları hususunda uyarır ve 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun gizliliğin ihlaline ilişkin hükmünün uygulanacağını ihtar ederek bu hususu tutanağa geçirir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="Dürüst davranma ve doğruyu söyleme yükümlülüğü">
        <mvz-fıkra no="1">
          <template>Taraflar, dürüstlük kuralına uygun davranmak zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Taraflar, davanın dayanağı olan vakıalara ilişkin açıklamalarını gerçeğe uygun bir biçimde yapmakla yükümlüdürler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="Usul ekonomisi ilkesi">
        <mvz-fıkra no="1">
          <template>Hâkim, yargılamanın makul süre içinde ve düzenli bir biçimde yürütülmesini ve gereksiz gider yapılmamasını sağlamakla yükümlüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="Hâkimin davayı aydınlatma ödevi">
        <mvz-fıkra no="1">
          <template>Hâkim, uyuşmazlığın aydınlatılmasının zorunlu kıldığı durumlarda, maddi veya hukuki açıdan belirsiz yahut çelişkili gördüğü hususlar hakkında, taraflara açıklama yaptırabilir; soru sorabilir; delil gösterilmesini isteyebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="Yargılamanın sevk ve idaresi">
        <mvz-fıkra no="1">
          <template>Yargılamayı, hâkim sevk ve idare eder; yargılama düzeninin bozulmaması için gerekli her türlü tedbiri alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Okunamayan veya uygunsuz yahut ilgisiz olan dilekçenin yeniden düzenlenmesi için uygun bir süre verilir ve bu dilekçe dosyada kalır. Verilen süre içinde yeni bir dilekçe düzenlenmezse, tekrar süre verilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="33" başlık="Hukukun uygulanması">
        <mvz-fıkra no="1">
          <template>Hâkim, Türk hukukunu resen uygular.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Hâkimin Yasaklılığı, Reddi ve Hukuki Sorumluluğu">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Hâkimin Davaya Bakmaktan Yasaklılığı ve Reddi">
        <mvz-madde no="34" başlık="Yasaklılık sebepleri">
          <mvz-fıkra no="1">
            <template>Hâkim, aşağıdaki hâllerde davaya bakamaz; talep olmasa bile çekinmek zorundadır:</template>
            <mvz-bent no="a">
              <template>Kendisine ait olan veya doğrudan doğruya ya da dolayısıyla ilgili olduğu davada.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Aralarında evlilik bağı kalksa bile eşinin davasında.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kendisi veya eşinin altsoy veya üstsoyunun davasında.</template>
            </mvz-bent>
            <mvz-bent no="ç">
              <template>Kendisi ile arasında evlatlık bağı bulunanın davasında.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Üçüncü derece de dâhil olmak üzere kan veya kendisini oluşturan evlilik bağı kalksa dahi kayın hısımlığı bulunanların davasında.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Nişanlısının davasında.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>İki taraftan birinin vekili, vasisi, kayyımı veya yasal danışmanı sıfatıyla hareket ettiği davada.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="35" başlık="Çekinme kararının sonuçları">
          <mvz-fıkra no="1">
            <template>Çekinme kararına karşı üst mahkemeye başvurulabilir. Yasaklama sebebinin doğduğu tarihten itibaren, o hâkimin huzuru ile yapılan bütün işlemler, üst mahkemenin kararı ile iptal olunabilir. Hüküm ve kararlar ise herhâlde iptal olunur. Bu durumda, hâkim yargılama giderlerine mahkûm edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Çekinme kararının ilk derece mahkemesi hâkimince verildiği hâllerde, başvuru üzerine bölge adliye mahkemesinin vereceği karar kesindir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="36" başlık="Ret sebepleri">
          <mvz-fıkra no="1">
            <template>Hâkimin tarafsızlığından şüpheyi gerektiren önemli bir sebebin bulunması hâlinde, taraflardan biri hâkimi reddedebileceği gibi hâkim de bizzat çekilebilir. Özellikle aşağıdaki hâllerde, hâkimin reddi sebebinin varlığı kabul edilir:</template>
            <mvz-bent no="a">
              <template>Davada, iki taraftan birine öğüt vermiş ya da yol göstermiş olması.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Davada, iki taraftan birine veya üçüncü kişiye kanunen gerekmediği hâlde görüşünü açıklamış olması.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Davada, tanık veya bilirkişi olarak dinlenmiş veya hâkim ya da hakem sıfatıyla hareket etmiş olması; uyuşmazlıkta arabuluculuk veya uzlaştırmacılık yapmış bulunması.</template>
            </mvz-bent>
            <mvz-bent no="ç">
              <template>Davanın, dördüncü derece de dâhil yansoy hısımlarına ait olması.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Dava esnasında, iki taraftan birisi ile davası veya aralarında bir düşmanlık bulunması.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="37" başlık="Hâkimin bizzat çekilmemesi hâli">
          <mvz-fıkra no="1">
            <template>Hâkim, reddini gerektiren sebeplerden biri varken bizzat çekilmezse, iki taraftan biri ret talebinde bulununcaya kadar davaya bakabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="38" başlık="Ret usulü">
          <mvz-fıkra no="1">
            <template>Hâkimin reddi sebebini bilen tarafın, ret talebini en geç ilk duruşmada ileri sürmesi gerekir. Taraf, ret sebebini davaya bakıldığı sırada öğrenmiş ise en geç öğrenmeden sonraki ilk duruşmada, yeni bir işlem yapılmadan önce bu talebini hemen bildirmek zorundadır. Belirtilen sürede yapılmayan ret talebi dinlenmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkimin reddi, dilekçeyle talep edilir. Bu dilekçede, ret talebinin dayandığı sebepler ile delil veya emarelerin açıkça gösterilmesi ve varsa belgelerin eklenmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hâkimin reddi dilekçesi, reddi istenen hâkimin mensup olduğu mahkemeye verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Ret talebi geri alınamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Hâkimi reddeden taraf, dilekçesini karşı tarafa tebliğ ettirir. Karşı taraf bir hafta içinde cevap verebilir. Bu süre geçtikten sonra yazı işleri müdürü tarafından ret dilekçesi, varsa karşı tarafın cevabı ve ekleri, dosya ile birlikte reddi istenen hâkime verilir. Hâkim bir hafta içinde dosyayı inceler ve ret sebeplerinin kanuna uygun olup olmadığı hakkındaki düşüncesini yazı ile bildirerek, dosyayı hemen merciine gönderilmek üzere yazı işleri müdürüne verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="7" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Hâkimi çekilmeye davet, hâkimin reddi hükmündedir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="39" başlık="Çekilme kararının incelenmesi">
          <mvz-fıkra no="1">
            <template>Hâkim, taraflardan birinin ret talebi üzerine veya kendiliğinden çekilme yönünde görüş bildirirse, ret talebini incelemeye yetkili merci, bu çekilmenin kanuna uygun olup olmadığına karar verir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="40" başlık="Ret talebini incelemeye yetkili merci">
          <mvz-fıkra no="1">
            <template>Hâkimin reddi talebi, reddi istenen hâkim katılmaksızın mensup olduğu mahkemece incelenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Reddedilen hâkimin katılmamasından dolayı mahkeme toplanamıyor ya da mahkeme tek hâkimden oluşuyor ise ret talebi, o yerde asliye hukuk hâkimliği görevini yapan diğer mahkeme veya hâkim tarafından incelenir. O yerde, asliye hukuk hâkimliği görevi tek hâkim tarafından yerine getiriliyorsa, o hâkim hakkındaki ret talebi, asliye ceza hâkimi varsa onun tarafından, yoksa en yakın asliye hukuk mahkemesince incelenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sulh hukuk hâkimi reddedildiği takdirde, ret talebi, o yerdeki diğer sulh hukuk hâkimi tarafından incelenir. O yerde, sulh hukuk hâkimliği görevi tek hâkim tarafından yerine getiriliyorsa, o hâkim hakkındaki ret talebi, bulunma sıralarına göre; o yerdeki sulh ceza hâkimi, asliye hukuk hâkimi, asliye ceza hâkimi, bunların da bulunmaması hâlinde, en yakın yerdeki sulh hukuk hâkimi tarafından incelenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bölge adliye mahkemesi hukuk dairelerinin başkan ve üyelerinin reddi talebi, reddedilen başkan ve üye katılmaksızın görevli olduğu dairece karara bağlanır. Hukuk dairelerinin toplanmasını engelleyecek şekildeki toplu ret talepleri dinlenmez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="41" başlık="Ret talebinin geri çevrilmesi">
          <mvz-fıkra no="1">
            <template>Hâkimin reddi talebi, aşağıdaki hâllerde kabul edilmeyerek geri çevrilir:</template>
            <mvz-bent no="a">
              <template>Ret talebi süresinde yapılmamışsa.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ret sebebi ve bu sebebe ilişkin inandırıcı delil veya emare gösterilmemişse.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Ret talebinin davayı uzatmak amacıyla yapıldığı açıkça anlaşılıyorsa.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hâllerde ret talebi, toplu mahkemelerde reddedilen hâkimin müzakereye katılmasıyla; tek hâkimli mahkemelerde ise reddedilen hâkimin kendisi tarafından geri çevrilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İlk derece mahkemesinin bu kararlarına karşı istinaf yoluna, bölge adliye mahkemesi hukuk dairelerinin başkan ve üyeleri hakkındaki kararlarına karşı da temyiz yoluna ancak hükümle birlikte başvurulabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="42" başlık="Ret talebinin incelenmesi">
          <mvz-fıkra no="1">
            <template>Hâkimin reddi talebine ilişkin karar, dosya üzerinden inceleme yapılarak da verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ret sebebi sabit olmasa bile, merci bunu muhtemel görürse, ret talebini kabul edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ret sebepleri hakkında yemin teklif olunamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Reddi istenen hâkim, ret hakkında merci tarafından karar verilinceye kadar o davaya bakamaz. Şu kadar ki, gecikmesinde sakınca bulunan iş ve davalar bunun dışındadır. Daha önce hakkındaki ret talebi mercice reddolunan hâkimin, aynı durum ve olaylara dayanarak yeniden reddedilmesi hâli, hâkimin davaya bakmasına engel oluşturmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Ret talebinin merci tarafından kabul edilmemesi hâlinde, reddi istenen hâkim davaya bakmaya devam eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Ret talebinin, kötüniyetle yapıldığının anlaşılması ve esas yönünden kabul edilmemesi hâlinde, talepte bulunanların her biri hakkında beşyüz Türk Lirasından beşbin Türk Lirasına kadar disiplin para cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Hâkim hakkında aynı davada aynı tarafça ileri sürülen ret talebinin reddi hâlinde verilecek disiplin para cezası, bir önceki disiplin para cezasının iki katından az olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Disiplin para cezasının tahsili için, davaya bakan mahkeme, dosyanın geliş tarihinden başlayarak iki hafta içinde gereğini yapar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="43" başlık="Ret talebine ilişkin kararlara karşı istinaf">
          <mvz-fıkra no="1">
            <template>Esas hüküm bakımından istinaf yolu kapalı bulunan dava ve işlerde, hâkimin reddi talebiyle ilgili merci kararları kesindir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Esas hüküm bakımından istinaf yolu açık bulunan dava ve işlerde ise ret talebi hakkındaki merci kararlarına karşı  tebliği tarihinden itibaren iki hafta içinde istinaf yoluna başvurulabilir; bu hâlde 347 nci madde hükmü uygulanmaz. Bölge adliye mahkemesinin bu husustaki kararları kesindir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ret talebinin reddine ilişkin merci kararının bölge adliye mahkemesince uygun bulunmayarak kaldırılması veya ret talebinin kabulüne ilişkin merci kararının bölge adliye mahkemesince uygun bulunması hâlinde, ret sebebinin doğduğu tarihten itibaren reddedilen hâkimce yapılmış olan ve ret talebinde bulunan tarafça itiraz edilen esasa etkili işlemler, davaya daha sonra bakacak hâkim tarafından iptal olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="44" başlık="Ret talebine ilişkin kararların temyizi">
          <mvz-fıkra no="1">
            <template>Esas hüküm bakımından temyiz yolu kapalı bulunan dava ve işlerde, bölge adliye mahkemesi başkan ve üyelerinin reddine ilişkin bölge adliye mahkemesi kararları kesindir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Esas hüküm bakımından temyiz yolu açık bulunan dava ve işlerde ise ret talebi hakkındaki karar,  tebliği tarihinden itibaren iki hafta içinde temyiz edilebilir. Bu hâlde 347 nci madde hükmü uygulanmaz. Yargıtayın bu husustaki kararı kesindir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bölge adliye mahkemesi hâkiminin reddine ilişkin talebin reddi konusundaki kararın temyizi üzerine Yargıtayca bozulması veya ret talebinin kabulüne ilişkin kararın Yargıtayca onanması hâlinde, ret sebebinin doğduğu tarihten itibaren reddedilen hâkimce yapılmış olan ve ret talebinde bulunan tarafça itiraz edilen esasa ilişkin işlemler, davaya daha sonra bakacak olan bölge adliye mahkemesi tarafından iptal olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="45" başlık="Zabıt kâtibinin yasaklılığı ve reddi">
          <mvz-fıkra no="1">
            <template>Davada görevli zabıt kâtibi hakkında 34 ve 36 ncı maddelerde düzenlenen sebeplerden birisiyle ret talebinde bulunulabilir. Ret talebi, zabıt kâtibinin görev yaptığı mahkeme tarafından karara bağlanır. Bu konuda verilecek kararlar kesindir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Zabıt kâtibi 34 üncü maddedeki sebepleri bildirerek görevden çekinebilir. Bu hâlde gereken karar, görev yaptığı mahkeme tarafından verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Zabıt kâtibinin aynı işte hâkim ile birlikte reddi veya çekinmesinin istenmesi hâlinde, hâkim hakkında ret veya çekinmeyi inceleyecek olan merci, her ikisi hakkında karar verir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Hâkimin Hukuki Sorumluluğu">
        <mvz-madde no="46" başlık="Devletin sorumluluğu ve rücu">
          <mvz-fıkra no="1">
            <template>Hâkimlerin yargılama faaliyetinden dolayı aşağıdaki sebeplere dayanılarak Devlet aleyhine tazminat davası açılabilir:</template>
            <mvz-bent no="a">
              <template>Kayırma veya taraf tutma yahut taraflardan birine olan kin veya düşmanlık sebebiyle hukuka aykırı bir hüküm veya karar verilmiş olması.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Sağlanan veya vaat edilen bir menfaat sebebiyle kanuna aykırı bir hüküm veya karar verilmiş olması.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Farklı bir anlam yüklenemeyecek kadar açık ve kesin bir kanun hükmüne aykırı karar veya hüküm verilmiş olması.</template>
            </mvz-bent>
            <mvz-bent no="ç">
              <template>Duruşma tutanağında mevcut olmayan bir sebebe dayanılarak hüküm verilmiş olması.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Duruşma tutanakları ile hüküm veya kararların değiştirilmiş yahut tahrif edilmiş veya söylenmeyen bir sözün hüküm ya da karara etkili olacak şekilde söylenmiş gibi gösterilmiş ve buna dayanılarak hüküm verilmiş olması.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Hakkın yerine getirilmesinden kaçınılmış olması.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tazminat davasının açılması, hâkime karşı bir ceza soruşturmasının yapılması yahut mahkûmiyet şartına bağlanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Devlet, ödediği tazminat nedeniyle, sorumlu hâkime ödeme tarihinden itibaren bir yıl içinde rücu eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="47" başlık="Davaların açılacağı mahkeme">
          <mvz-fıkra no="1">
            <template>Devlet aleyhine açılan tazminat davası, ilk derece ve bölge adliye mahkemesi hâkimlerinin fiil ve kararlarından dolayı, Yargıtay ilgili hukuk dairesinde; Yargıtay Başkan ve üyeleri ile kanunen onlarla aynı konumda olanların fiil ve kararlarından dolayı Yargıtay Dördüncü Hukuk Dairesinde ilk derece mahkemesi sıfatıyla görülür. Dava, bu dairenin Başkan ve üyelerinin fiil ve kararlarından dolayı ise yargılama Yargıtay Üçüncü Hukuk Dairesinde yapılır. Verilen kararların temyiz incelemesi Hukuk Genel Kurulunca yapılır. Temyiz incelemesine, kararı veren başkan ile üyeler katılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Devletin sorumlu hâkime karşı açacağı rücu davası, tazminat davasını karara bağlamış olan mahkemede görülür.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="48" başlık="Dava dilekçesi ve davanın ihbarı">
          <mvz-fıkra no="1">
            <template>Tazminat davası dilekçesinde hangi sorumluluk sebebine dayanıldığı ve delilleri açıkça belirtilir; varsa belgeler de eklenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme, açılan tazminat davasını, ilgili hâkime resen ihbar eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="49" başlık="Davanın reddi hâlinde verilecek ceza">
          <mvz-fıkra no="1">
            <template>Dava esastan reddedilirse davacı, beşyüz Türk Lirasından beşbin Türk Lirasına kadar disiplin para cezasına mahkûm edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Taraflar ve Davaya Katılan Üçüncü Kişiler">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Tarafların Ehliyetleri">
        <mvz-madde no="50" başlık="Taraf ehliyeti">
          <mvz-fıkra no="1">
            <template>Medenî haklardan yararlanma ehliyetine sahip olan, davada taraf ehliyetine de sahiptir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="51" başlık="Dava ehliyeti">
          <mvz-fıkra no="1">
            <template>Dava ehliyeti, medenî hakları kullanma ehliyetine göre belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="52" başlık="Davada kanuni temsil">
          <mvz-fıkra no="1">
            <template>Medenî hakları kullanma ehliyetine sahip olmayanlar davada kanuni temsilcileri, tüzel kişiler ise yetkili organları tarafından temsil edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="53" başlık="Dava takip yetkisi">
          <mvz-fıkra no="1">
            <template>Dava takip yetkisi, talep sonucu hakkında hüküm alabilme yetkisidir. Bu yetki, kanunda belirtilen istisnai durumlar dışında, maddi hukuktaki tasarruf yetkisine göre tayin edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="54" başlık="Temsil veya izin belgelerinin verilmesi">
          <mvz-fıkra no="1">
            <template>Kanuni temsilciler, davanın açılıp yürütülmesinin belli bir makamın iznine bağlı olduğu hâllerde izin belgelerini, tüzel kişilerin organları ise temsil belgelerini, dava veya cevap dilekçesiyle mahkemeye vermek zorundadırlar; aksi takdirde dava açamaz ve yargılamayla ilgili hiçbir işlem yapamazlar. Şu kadar ki, gecikmesinde sakınca bulunan hâllerde mahkeme, kanuni temsilcilerin veya tüzel kişilerin organlarının, yukarıda belirtilen eksikliği gidermeleri şartıyla dava açmalarına yahut davayla ilgili işlem yapmalarına izin verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İzin belgesinin alınması için mahkemeye müracaat edilmesi gerekiyorsa ilgiliye, müracaatı için kesin süre verilir. Bu süre içinde mahkemeye başvurulması hâlinde bu konuda karar verilinceye kadar beklenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Süresi içinde belgelerin ibraz edilmemesi veya mahkemeye başvurulmaması hâlinde, dava açılmamış veya gerçekleştirilen işlemler yapılmamış sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="55" başlık="Dava sırasında taraflardan birinin ölümü">
          <mvz-fıkra no="1">
            <template>Taraflardan birinin ölümü hâlinde, mirasçılar mirası kabul veya reddetmemişse, bu hususta kanunla belirlenen süreler geçinceye kadar dava ertelenir. Bununla beraber hâkim, gecikmesinde sakınca bulunan hâllerde, talep üzerine davayı takip için kayyım atanmasına karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="56" başlık="Kanuni temsilci atanması sebebiyle yargılamanın ertelenmesi">
          <mvz-fıkra no="1">
            <template>Taraflardan birinin vesayet altına alınması veya kendisine yasal danışman atanması talebi mahkemece uygun bulunur ya da mahkemece gerekli görülürse, bu konuda kesin bir karar verilinceye kadar yargılama ertelenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Taraflardan biri kanun gereğince tedavi, gözlem veya koruma altına alınmış yahut başkalarıyla görüşmekten yasaklanmış olup da kendisi veya vekilinin mahkemede bulunması mümkün değilse, o kimse hakkında davayı takip için kayyım atanıncaya kadar yargılama ertelenebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Dava Arkadaşlığı">
        <mvz-madde no="57" başlık="İhtiyari dava arkadaşlığı">
          <mvz-fıkra no="1">
            <template>Birden çok kişi, aşağıdaki hâllerde birlikte dava açabilecekleri gibi aleyhlerine de birlikte dava açılabilir:</template>
            <mvz-bent no="a">
              <template>Davacılar veya davalılar arasında dava konusu olan hak veya borcun, elbirliği ile mülkiyet dışındaki bir sebeple ortak olması.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ortak bir işlemle hepsinin yararına bir hak doğmuş olması veya kendilerinin bu şekilde yükümlülük altına girmeleri.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Davaların temelini oluşturan vakıaların ve hukuki sebeplerin aynı veya birbirine benzer olması.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="58" başlık="İhtiyari dava arkadaşlarının davadaki durumu">
          <mvz-fıkra no="1">
            <template>İhtiyari dava arkadaşlığında, davalar birbirinden bağımsızdır. Dava arkadaşlarından her biri, diğerinden bağımsız olarak hareket eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="59" başlık="Mecburi dava arkadaşlığı">
          <mvz-fıkra no="1">
            <template>Maddi hukuka göre, bir hakkın birden fazla kimse tarafından birlikte kullanılması veya birden fazla kimseye karşı birlikte ileri sürülmesi ve tamamı hakkında tek hüküm verilmesi gereken hâllerde, mecburi dava arkadaşlığı vardır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="60" başlık="Mecburi dava arkadaşlarının davadaki durumu">
          <mvz-fıkra no="1">
            <template>Mecburi dava arkadaşları, ancak birlikte dava açabilir veya aleyhlerine de birlikte dava açılabilir. Bu tür dava arkadaşlığında, dava arkadaşları birlikte hareket etmek zorundadır. Ancak, duruşmaya gelmiş olan dava arkadaşlarının yapmış oldukları usul işlemleri, usulüne uygun olarak davet edildiği hâlde duruşmaya gelmemiş olan dava arkadaşları bakımından da hüküm ifade eder.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Davanın İhbarı ve Davaya Müdahale">
        <mvz-madde no="61" başlık="İhbar ve şartları">
          <mvz-fıkra no="1">
            <template>Taraflardan biri davayı kaybettiği takdirde, üçüncü kişiye veya üçüncü kişinin kendisine rücu edeceğini düşünüyorsa, tahkikat sonuçlanıncaya kadar davayı üçüncü kişiye ihbar edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dava kendisine ihbar edilen kişinin de aynı şartlarda bir başkasına ihbarda bulunması mümkündür ve bu şekilde ihbar tevali ettirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="62" başlık="İhbarın şekli">
          <mvz-fıkra no="1">
            <template>İhbar yazılı olarak yapılır; ihbar sebebinin gerekçeleriyle birlikte açıklanması ve yargılamanın hangi aşamada bulunduğunun belirtilmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Davanın ihbarı sebebiyle yargılama bir başka güne bırakılamaz ve ihbarın tevali etmesi gibi zorunlu olan durumlar dışında süre verilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="63" başlık="İhbarda bulunulan kişinin durumu">
          <mvz-fıkra no="1">
            <template>Dava kendisine ihbar edilen kişi, davayı kazanmasında hukuki yararı olan taraf yanında davaya katılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="64" başlık="İhbarın etkisi">
          <mvz-fıkra no="1">
            <template>İhbar edilen davada verilen hükmün ihbar eden kişiye etkisi hakkında 69 uncu maddenin ikinci fıkrası hükmü kıyasen uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="65" başlık="Asli müdahale">
          <mvz-fıkra no="1">
            <template>Bir yargılamanın konusu olan hak veya şey üzerinde kısmen ya da tamamen hak iddia eden üçüncü kişi, hüküm verilinceye kadar bu durumu ileri sürerek, yargılamanın taraflarına karşı aynı mahkemede dava açabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Asli müdahale davası ile asıl yargılama birlikte yürütülür ve karara bağlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="66" başlık="Fer’î müdahale">
          <mvz-fıkra no="1">
            <template>Üçüncü kişi, davayı kazanmasında hukuki yararı bulunan taraf yanında ve ona yardımcı olmak amacıyla, tahkikat sona erinceye kadar, fer’î müdahil olarak davada yer alabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="67" başlık="Fer’î müdahale talebi ve incelenmesi">
          <mvz-fıkra no="1">
            <template>Müdahale talebinde bulunan üçüncü kişi, yanında katılmak istediği tarafı, müdahale sebebini ve bunun dayanaklarını belirten bir dilekçeyle mahkemeye başvurur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Müdahale dilekçesi, davanın taraflarına tebliğ edilir. Mahkeme, gerekirse taraflarla birlikte üçüncü kişiyi de dinlemek üzere davet eder, gelmeseler dahi müdahale talebi hakkında karar verir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="68" başlık="Fer’î müdahilin durumu">
          <mvz-fıkra no="1">
            <template>Müdahale talebinin kabulü hâlinde müdahil, davayı ancak bulunduğu noktadan itibaren takip edebilir. Müdahil, yanında katıldığı tarafın yararına olan iddia veya savunma vasıtalarını ileri sürebilir; onun işlem ve açıklamalarına aykırı olmayan her türlü usul işlemlerini yapabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme, katıldığı noktadan itibaren, taraflara bildirilen işlemleri müdahile de tebliğ eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="69" başlık="Fer’î müdahalenin etkisi">
          <mvz-fıkra no="1">
            <template>Müdahilin de yer aldığı asıl davada hüküm, taraflar hakkında verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fer’î müdahilin, tarafla rücu ilişkisinde, asıl davadaki uyuşmazlık hakkında yanlış karar verildiği iddiası dinlenilmez. Ancak, müdahil, zamanında ihbar yapılmadığı için davaya geç katıldığını veya yanında katıldığı tarafın iddia ve savunma imkânlarını kullanmasını engellediğini ya da kendisince bilinmeyen iddia ve savunma imkânlarının, tarafın ağır kusuru sebebiyle kullanılamadığını belirterek, yanında katıldığı tarafın yargılamayı hatalı yürüttüğünü ileri sürebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="70" başlık="Cumhuriyet savcısının davada yer alması">
          <mvz-fıkra no="1">
            <template>Cumhuriyet savcısı, kanunda açıkça öngörülen hâllerde, hukuk davası açar veya açılmış olan hukuk davasında taraf olarak yer alır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhuriyet savcısı, resmî dairenin bildirimine rağmen dava açmaz ise ihbar eden resmî daire, Cumhuriyet savcısının yargı çevresinde görev yaptığı ağır ceza merkezine en yakın kıdemli asliye hukuk mahkemesi hâkimine itiraz edebilir. Bu hususta 4/12/2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun 172 ve 173 üncü maddeleri kıyasen uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cumhuriyet savcısının yer aldığı dava ve işler üzerinde taraflar serbestçe tasarruf edemezler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="Davaya Vekâlet">
        <mvz-madde no="71" başlık="Genel olarak">
          <mvz-fıkra no="1">
            <template>Dava ehliyeti bulunan herkes, davasını kendisi veya tayin ettiği vekil aracılığıyla açabilir ve takip edebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="72" başlık="Davaya vekâlet hakkında uygulanacak hükümler">
          <mvz-fıkra no="1">
            <template>Davanın vekil aracılığıyla açılması ve takip edilmesinde, kanunlardaki özel hükümler saklı kalmak üzere, 22/4/1926 tarihli ve 818 sayılı Borçlar Kanununun temsile ilişkin hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="73" başlık="Davaya vekâletin kanuni kapsamı">
          <mvz-fıkra no="1">
            <template>Davaya vekâlet, kanunda özel yetki verilmesini gerektiren hususlar saklı kalmak üzere, hüküm kesinleşinceye kadar, vekilin davanın takibi için gereken bütün işlemleri yapmasına, hükmün yerine getirilmesine, yargılama giderlerinin tahsili ile buna ilişkin makbuz vermesine ve bu işlemlerin tamamının kendisine karşı da yapılabilmesine ilişkin yetkiyi kapsar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Belirtilen bu yetkiyi kısıtlamaya yönelik bütün sınırlandırıcı işlemler, karşı taraf yönünden geçersizdir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="74" başlık="Davaya vekâlette özel yetki verilmesini gerektiren hâller">
          <mvz-fıkra no="1">
            <template>Açıkça yetki verilmemiş ise vekil; sulh olamaz, hâkimi reddedemez, davanın tamamını ıslah edemez, yemin teklif edemez, yemini kabul, iade veya reddedemez, başkasını tevkil edemez, haczi kaldıramaz, müvekkilinin iflasını isteyemez, tahkim ve hakem sözleşmesi yapamaz, konkordato veya sermaye şirketleri ve kooperatiflerin uzlaşma yoluyla yeniden yapılandırılması teklifinde bulunamaz ve bunlara muvafakat veremez, alternatif uyuşmazlık çözüm yollarına başvuramaz, davadan veya kanun yollarından feragat edemez, karşı tarafı ibra ve davasını kabul edemez, yargılamanın iadesi yoluna gidemez, hâkimlerin fiilleri sebebiyle Devlet aleyhine tazminat davası açamaz, hangileri hakkında yetki verildiği açıklanmadıkça kişiye sıkı sıkıya bağlı haklarla ilgili davaları açamaz ve takip edemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="75" başlık="Birden fazla vekil görevlendirilmesi">
          <mvz-fıkra no="1">
            <template>Dava için birden fazla vekil görevlendirilmiş ise vekillerden her biri, vekâletten kaynaklanan yetkileri, diğerinden bağımsız olarak kullanabilir. Aksi yöndeki sınırlamalar, karşı taraf bakımından geçersizdir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="76" başlık="Vekâletnamenin ibrazı">
          <mvz-fıkra no="1">
            <template>Avukat, açtığı veya takip ettiği dava ve işlerde, noter tarafından onaylanan ya da düzenlenen vekâletname aslını veya avukat tarafından onaylanmış aslına uygun örneğini, dava yahut takip dosyasına konulmak üzere ibraz etmek zorundadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kamu kurum ve kuruluşlarının avukatlarına, yetkili amirleri tarafından usulüne uygun olarak düzenlenip verilmiş olan temsil belgeleri de geçerli olup, ayrıca noterce onaylanmasına gerek yoktur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="77" başlık="Vekâletnamesiz dava açılması ve işlem yapılması">
          <mvz-fıkra no="1">
            <template>Vekâletnamesinin aslını veya onaylı örneğini vermeyen avukat, dava açamaz ve yargılamayla ilgili hiçbir işlem yapamaz. Şu kadar ki, gecikmesinde zarar doğabilecek hâllerde mahkeme, vereceği kesin süre içinde vekâletnamesini getirmek koşuluyla avukatın dava açmasına veya usul işlemlerini yapmasına izin verebilir. Bu süre içinde vekâletname verilmez veya asıl taraf yapılan işlemleri kabul ettiğini dilekçeyle mahkemeye bildirmez ise dava açılmamış veya gerçekleştirilen işlemler yapılmamış sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Vekâletnamesiz işlem yapmasına izin verilen ancak haklı bir sebep olmaksızın süresi içinde vekâletname ibraz etmeyen avukat, celse harcı ile diğer yargılama giderleri ve karşı tarafın uğradığı zararları ödemeye mahkûm edilir. Bunu kötüniyetle yapan avukat aleyhine, ceza ve disiplin soruşturması açılmasını sağlamak üzere, Cumhuriyet başsavcılığına ve vekilin bağlı olduğu baro başkanlığına durum yazıyla bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bir tarafın avukat tutmak istemesi sebebiyle, yargılama hiçbir şekilde başka bir güne bırakılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Avukatın istifa etmesi, azledilmesi veya dosyayı incelememiş olması sebebiyle yargılama başka bir güne bırakılamaz. Ancak, dosyanın incelenmemiş olması geçerli bir özre dayanıyorsa, hâkim bir defaya mahsus olmak üzere, kısa bir süre verebilir. Verilen süre sonunda, dosya incelenmemiş olsa bile davaya devam olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="78" başlık="Vekilin vekâlet veren huzurundaki beyanı">
          <mvz-fıkra no="1">
            <template>Kendisinin de hazır olduğu duruşmada, vekili tarafından yapılan açıklamalara derhâl ve açıkça itiraz etmeyen taraf, bu açıklamalara rıza göstermiş sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="79" başlık="Vekilin veya vekâlet verenin duruşmada uygun olmayan tutum ve davranışı">
          <mvz-fıkra no="1">
            <template>Vekil, duruşma sırasında uygun olmayan tutum ve davranışta bulunursa, hâkim tarafından uyarılır; vekil uyarıya uymaz ve fiil disiplin suçu veya adlî suç teşkil eder nitelikte görülürse, duruşma salonunda bulunan kişilerin kimlik bilgileri, adresleri de yazılarak olay tutanağa geçirilir ve duruşma ertelenir. Vekil hakkında gerekli yasal işlem yapılmak üzere mahkemece vekilin kayıtlı olduğu baroya ve gerekiyorsa Cumhuriyet başsavcılığına bildirimde bulunulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Davasını kendisi takip eden kimse, duruşmada uygun olmayan tutum ve davranışta bulunursa, hâkim kendisini uyarır; bu uyarılara uyulmaz ve gerekli görülürse kendisini vekil ile temsil ettirmesine karar verip, hemen duruşma salonundan dışarıya çıkartılmasını sağlar; vekil ile temsil ettirmemesi hâlinde, tarafın yokluğu hâlinde uygulanacak hükümlere göre işlem yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="80" başlık="Tarafın davasını takip edebilecek ehliyette olmaması">
          <mvz-fıkra no="1">
            <template>Hâkim, taraflardan birisinin, davasını bizzat takip edecek yeterlikte olmadığını görürse, ona uygun bir süre tanıyarak, davasını vekil aracılığıyla takip etmesine karar verebilir. Verilen karara uymayan taraf hakkında, yokluğu hâlindeki hükümlere göre işlem yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="81" başlık="Vekilin azli ve istifasının şekli">
          <mvz-fıkra no="1">
            <template>Vekilin azli veya istifasının, mahkeme ve karşı taraf bakımından hüküm ifade edebilmesi için, bu konudaki beyanın dilekçeyle bildirilmesi veya tutanağa geçirilmesi ve gerektiğinde ilgilisine yapılacak tebligat giderinin de peşin olarak ödenmesi zorunludur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="82" başlık="Vekilin istifası">
          <mvz-fıkra no="1">
            <template>İstifa eden vekilin vekâlet görevi, istifanın müvekkiline tebliğinden itibaren iki hafta süreyle devam eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Vekilin istifa etmiş olması hâlinde, vekâlet veren davayı takip etmez ve başka bir vekil de görevlendirmez ise tarafın yokluğu hâlinde uygulanacak hükümlere göre işlem yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıdaki fıkralarda yer alan hususlar, istifa eden vekilin istifa dilekçesi ile birlikte vekâlet verene ihtaren bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="83" başlık="Vekilin azli">
          <mvz-fıkra no="1">
            <template>Vekil ile takip edilen davada, vekilin azli hâlinde vekâlet veren, davayı takip etmez ve iki hafta içinde bir başka vekil de görevlendirmez ise tarafın yokluğu hâlinde uygulanacak hükümlere göre işlem yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Teminat">
      <mvz-madde no="84" başlık="Teminat gösterilecek hâller">
        <mvz-fıkra no="1">
          <template>Aşağıdaki hâllerde davalı tarafın muhtemel yargılama giderlerini karşılayacak uygun bir teminat gösterilir:</template>
          <mvz-bent no="a">
            <template>Türkiye’de mutad meskeni olmayan Türk vatandaşının dava açması, davacı yanında davaya müdahil olarak katılması veya takip yapması.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Davacının daha önceden iflasına karar verilmiş, hakkında konkordato veya uzlaşma suretiyle yeniden yapılandırma işlemlerinin başlatılmış bulunması; borç ödemeden aciz belgesinin varlığı gibi sebeplerle, ödeme güçlüğü içinde bulunduğunun belgelenmesi.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Davanın görülmesi sırasında teminatı gerektiren durum ve koşulların ortaya çıkması hâlinde de mahkeme teminat gösterilmesine karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mecburi dava ve takip arkadaşlığında teminat gösterme yükümlülüğü, bu yükümlülüğün tüm davacılar bakımından mevcut olması hâlinde doğar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="85" başlık="Teminat gerektirmeyen hâller">
        <mvz-fıkra no="1">
          <template>Aşağıda sayılan hâllerde teminat istenemez:</template>
          <mvz-bent no="a">
            <template>Davacının adli yardımdan yararlanması.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Davacının, yurt içinde istenen teminatı karşılamaya yeterli taşınmaz malının veya ayni teminatla güvence altına alınmış bir alacağının bulunması.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Davanın, sırf küçüğün menfaatlerini korumaya yönelik olarak açılmış olması.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>İlama bağlı alacak için ilamlı icra takibi yapılmış olması.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="86" başlık="Teminat kararı">
        <mvz-fıkra no="1">
          <template>Yargılama giderlerini karşılayacak teminata, mahkemece kendiliğinden karar verilir. Hâkim, teminat kararı vermeden önce tarafları veya müdahale talebinde bulunan kişiyi dinleyebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="87" başlık="Teminatın tutarı ve şekli">
        <mvz-fıkra no="1">
          <template>Bir davada verilecek teminatın tutarını ve şeklini hâkim serbestçe tayin eder. Ancak, tarafların teminatın şeklini sözleşmeyle kararlaştırmaları hâlinde, teminat ona göre belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Teminatı gerektiren durum ve koşullarda değişiklik olması hâlinde, hâkim teminatın azaltılması, artırılması, değiştirilmesi ya da kaldırılmasına karar verebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="88" başlık="Teminat gösterilmemesinin sonuçları">
        <mvz-fıkra no="1">
          <template>Hâkim tarafından belirlenen kesin süre içinde teminat gösterilmezse, dava usulden reddedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Müdahale talebinde bulunan kişi, kesin süre içinde istenen teminatı vermezse, müdahale talebinden vazgeçmiş sayılmasına karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="89" başlık="Teminatın iadesi">
        <mvz-fıkra no="1">
          <template>Teminat gösterilmesini gerektiren sebep ortadan kalktığı takdirde, ilgilinin talebi üzerine mahkeme, teminatın iadesine karar verir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="6-ALTINCI" başlık="Süreler, Eski Hâle Getirme ve Adli Tatil">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Süreler">
        <mvz-madde no="90" başlık="Sürelerin belirlenmesi">
          <mvz-fıkra no="1">
            <template>Süreler, kanunda belirtilir veya hâkim tarafından tespit edilir. Kanunda belirtilen istisnai durumlar dışında, hâkim kanundaki süreleri artıramaz veya eksiltemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkim, kendisinin tespit ettiği süreleri, haklı sebeplerle artırabilir veya eksiltebilir; gerekli gördüğü takdirde, bu konudaki kararından önce tarafları da dinler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="91" başlık="Sürelerin başlaması">
          <mvz-fıkra no="1">
            <template>Süreler, taraflara tebliğ tarihinden veya kanunda öngörülen hâllerde, tefhim tarihinden itibaren işlemeye başlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="92" başlık="Sürelerin bitimi">
          <mvz-fıkra no="1">
            <template>Süreler gün olarak belirlenmiş ise tebliğ veya tefhim edildiği gün hesaba katılmaz ve süre son günün tatil saatinde biter.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Süre; hafta, ay veya yıl olarak belirlenmiş ise başladığı güne son hafta, ay veya yıl içindeki karşılık gelen günün tatil saatinde biter. Sürenin bittiği ayda, başladığı güne karşılık gelen bir gün yoksa, süre bu ayın son günü tatil saatinde biter.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="93" başlık="Tatil günlerinin etkisi">
          <mvz-fıkra no="1">
            <template>Resmî tatil günleri, süreye dâhildir. Sürenin son gününün resmî tatil gününe rastlaması hâlinde, süre tatili takip eden ilk iş günü çalışma saati sonunda biter.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="94" başlık="Kesin süre">
          <mvz-fıkra no="1">
            <template>Kanunun belirlediği süreler kesindir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkim, tayin ettiği sürenin kesin olduğuna karar verebilir. Bu takdirde hâkim, tayin ettiği kesin süreye konu olan işlemi hiçbir duraksamaya yer vermeyecek şekilde açıklar ve süreye uyulmamasının hukuki sonuçlarını açıkça tutanağa geçirerek ihtar eder. Kesin olduğu belirtilmeyen süreyi geçirmiş olan taraf yeniden süre isteyebilir; bu şekilde verilecek ikinci süre kesindir ve yeniden süre verilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kesin süre içinde yapılması gereken işlemi, süresinde yapmayan tarafın, o işlemi yapma hakkı ortadan kalkar.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Eski Hâle Getirme">
        <mvz-madde no="95" başlık="Talep">
          <mvz-fıkra no="1">
            <template>Elde olmayan sebeplerle, kanunda belirtilen veya hâkimin kesin olarak belirlediği süre içinde bir işlemi yapamayan kimse, eski hâle getirme talebinde bulunabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Süresinde yapılamayan işlemle ulaşılmak istenen aynı sonuca, eski hâle getirme dışında, başka bir hukuki yoldan ulaşılabiliyorsa, eski hâle getirme talebinde bulunulamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="96" başlık="Süre">
          <mvz-fıkra no="1">
            <template>Eski hâle getirme, işlemin süresinde yapılamamasına sebep olan engelin ortadan kalkmasından itibaren iki hafta içinde talep edilmelidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İlk derece ve istinaf yargılamalarında, en geç nihai karar verilinceye kadar eski hâle getirme talebinde bulunmak mümkündür. Ancak, nihai karar bir tarafın yokluğunda verilmişse, tahkikat aşamasında kaçırılan süreler için kararın verilmesinden sonra da eski hâle getirme talebinde bulunulabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="97" başlık="Talebin şekli ve kapsamı">
          <mvz-fıkra no="1">
            <template>Eski hâle getirme, dilekçeyle talep edilir. Dilekçede, talebin dayandığı sebepler ile bunların delil veya emareleri gösterilir. Süresinde yapılamayan işlemin de eski hâle getirme talebinde bulunmak için öngörülen süre içinde yapılması zorunludur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="98" başlık="Talep ve inceleme mercii">
          <mvz-fıkra no="1">
            <template>Yapılamayan işlem için eski hâle getirme, bu işlem hakkında hangi mahkemede inceleme yapılacak idiyse, o mahkemeden talep edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eski hâle getirme, istinaf yoluna başvuru hakkının düşmesi hâlinde, bölge adliye mahkemesinden; temyiz yoluna başvuru hakkının düşmesi hâlinde ise Yargıtaydan talep edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="99" başlık="Talebin yargılamaya ve hükmün icrasına etkisi">
          <mvz-fıkra no="1">
            <template>Eski hâle getirme talebi, yargılamanın ertelenmesini gerektirmez ve hükmün icrasına engel olmaz. Ancak, talebi inceleyen mahkeme, talebi haklı görürse, teminat gösterilmek şartıyla, yargılamanın ertelenmesine veya hükmün icrasının geri bırakılmasına karar verebilir. Mahkeme, gerektiğinde teminat gösterilmeden de yargılamanın ertelenmesine veya icranın geri bırakılmasına karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="100" başlık="İnceleme ve karar">
          <mvz-fıkra no="1">
            <template>İlk derece mahkemeleri veya bölge adliye mahkemelerinde eski hâle getirme talebi, ön sorunlar hakkındaki usule; Yargıtayda ileri sürülecek eski hâle getirme talebi ise temyiz usulüne göre yapılır ve incelenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme, eski hâle getirme talebinin kabulü hâlinde, hangi işlemlerin geçersiz hâle geldiğini kararında belirtir. Islahla geçersiz kılınamayan işlemler, eski hâle getirme talebinden de etkilenmez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="101" başlık="Giderler">
          <mvz-fıkra no="1">
            <template>Eski hâle getirme talebi sebebiyle ortaya çıkan giderler, talepte bulunan tarafa yükletilir. Ancak, karşı taraf eski hâle getirme talebine karşı asılsız itirazlar ileri sürerek giderlerin artmasına sebep olmuşsa, hâkim, giderlerin tümünün veya bir kısmının karşı tarafa yükletilmesine karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Adli Tatil">
        <mvz-madde no="102" başlık="Adli tatil süresi">
          <mvz-fıkra no="1">
            <template>Adli tatil, her yıl yirmi temmuzda başlar, otuz bir ağustosta sona erer. Yeni adli yıl bir eylülde başlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="103" başlık="Adli tatilde görülecek dava ve işler">
          <mvz-fıkra no="1">
            <template>Adli tatilde, ancak aşağıdaki dava ve işler görülür:</template>
            <mvz-bent no="a">
              <template>İhtiyati tedbir, ihtiyati haciz ve delillerin tespiti gibi geçici hukuki koruma, deniz raporlarının alınması ve dispeçci atanması talepleri ile bunlara karşı yapılacak itirazlar ve diğer başvurular hakkında karar verilmesi.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Her çeşit nafaka davaları ile soybağı, velayet ve vesayete ilişkin dava ya da işler.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Nüfus kayıtlarının düzeltilmesi işleri ve davaları.</template>
            </mvz-bent>
            <mvz-bent no="ç">
              <template>Hizmet akdi veya iş sözleşmesi sebebiyle işçilerin açtıkları davalar.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Ticari defterlerin kaybından dolayı kayıp belgesi verilmesi talepleri ile kıymetli evrakın kaybından doğan iptal işleri.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>İflas ve konkordato ile sermaye şirketleri ve kooperatiflerin uzlaşma suretiyle yeniden yapılandırılmasına ilişkin işler ve davalar.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Adli tatilde yapılmasına karar verilen keşifler.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Tahkim hükümlerine göre, mahkemenin görev alanına giren dava ve işler.</template>
            </mvz-bent>
            <mvz-bent no="ğ">
              <template>Çekişmesiz yargı işleri.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Kanunlarda ivedi olduğu belirtilen veya taraflardan birinin talebi üzerine, mahkemece ivedi görülmesine karar verilen dava ve işler.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tarafların anlaşması hâlinde veya dava bir tarafın yokluğunda görülmekte ise hazır olan tarafın talebi üzerine, yukarıdaki iş ve davalara bakılması, adli tatilden sonraya bırakılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Adli tatilde, yukarıdaki fıkralarda gösterilenler dışında kalan dava ve işlerle ilgili olarak verilen dava, karşı dava, istinaf ve temyiz dilekçeleri ile bunlara karşı verilen cevap dilekçelerinin ve dosyası işlemden kaldırılan davaları yenileme dilekçelerinin alınması, ilam verilmesi, her türlü tebligat, dosyanın başka bir mahkemeye, bölge adliye mahkemesine veya Yargıtaya gönderilmesi işlemleri de yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu madde hükümleri, bölge adliye mahkemeleri ile Yargıtay incelemelerinde de uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="104" başlık="Adli tatilin sürelere etkisi">
          <mvz-fıkra no="1">
            <template>Adli tatile tabi olan dava ve işlerde, bu Kanunun tayin ettiği sürelerin bitmesi tatil zamanına rastlarsa, bu süreler ayrıca bir karara gerek olmaksızın adli tatilin bittiği günden itibaren bir hafta uzatılmış sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Dava Çeşitleri, Dava Şartları ve İlk İtirazlar">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Dava Çeşitleri">
      <mvz-madde no="105" başlık="Eda davası">
        <mvz-fıkra no="1">
          <template>Eda davası yoluyla mahkemeden, davalının, bir şeyi vermeye veya yapmaya yahut yapmamaya mahkûm edilmesi talep edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="106" başlık="Tespit davası">
        <mvz-fıkra no="1">
          <template>Tespit davası yoluyla, mahkemeden, bir hakkın veya hukuki ilişkinin varlığının ya da yokluğunun yahut bir belgenin sahte olup olmadığının belirlenmesi talep edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tespit davası açanın, kanunlarda belirtilen istisnai durumlar dışında, bu davayı açmakta hukuken korunmaya değer güncel bir yararı bulunmalıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Maddi vakıalar, tek başlarına tespit davasının konusunu oluşturamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="107" başlık="Belirsiz alacak davası" durum="mülga">
      </mvz-madde>
      <mvz-madde no="108" başlık="İnşaî dava">
        <mvz-fıkra no="1">
          <template>İnşaî dava yoluyla, mahkemeden, yeni bir hukuki durum yaratılması veya mevcut bir hukuki durumun içeriğinin değiştirilmesi yahut onun ortadan kaldırılması talep edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir inşaî hakkın, dava yoluyla kullanılmasının zorunlu olduğu hâllerde, inşaî dava açılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kanunlarda aksi belirtilmedikçe, inşaî hükümler, geçmişe etkili değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="109" başlık="Kısmi dava">
        <mvz-fıkra no="1">
          <template>Talep konusunun niteliği itibarıyla bölünebilir olduğu durumlarda, sadece bir kısmı da dava yoluyla ileri sürülebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Dava açılırken, talep konusunun kalan kısmından açıkça feragat edilmiş olması hâli dışında, kısmi dava açılması, talep konusunun geri kalan kısmından feragat edildiği anlamına gelmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Alacağın sadece bir kısmının dava edildiği durumlarda talep konusu, aynı davada bir defaya mahsus olmak üzere iddianın genişletilmesi yasağına tabi olmaksızın tahkikatın sona ermesine kadar artırılabilir. Bu durumda zamanaşımı, artırılan kısım bakımından da dava tarihinden itibaren kesilmiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="110" başlık="Davaların yığılması">
        <mvz-fıkra no="1">
          <template>Davacı, aynı davalıya karşı olan, birbirinden bağımsız birden fazla asli talebini, aynı dava dilekçesinde ileri sürebilir. Bunun için, birlikte dava edilen taleplerin tamamının aynı yargı çeşidi içinde yer alması ve taleplerin tümü bakımından ortak yetkili bir mahkemenin bulunması şarttır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="111" başlık="Terditli dava">
        <mvz-fıkra no="1">
          <template>Davacı, aynı davalıya karşı birden fazla talebini, aralarında aslilik-ferîlik ilişkisi kurmak suretiyle, aynı dava dilekçesinde ileri sürebilir. Bunun için, talepler arasında hukuki veya ekonomik bir bağlantının bulunması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme, davacının asli talebinin esastan reddine karar vermedikçe, fer’î talebini inceleyemez ve hükme bağlayamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="112" başlık="Seçimlik dava">
        <mvz-fıkra no="1">
          <template>Seçimlik borçlarda, seçim hakkı kendisine ait olan borçlu veya üçüncü kişinin bu hakkı kullanmaktan kaçınması hâlinde, alacaklı seçimlik dava açabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Seçimlik davada mahkeme, talebin hukuka uygun olduğu sonucuna varırsa, seçimlik mahkûmiyet hükmü verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Seçimlik mahkûmiyet hükmünü cebrî icraya koyan alacaklı, takibinin konusunu, mahkûmiyet hükmünde yer alan edimlerden birine hasretmek zorundadır. Ancak, bu durum, borçlunun, diğer edimi ifa etmek suretiyle borcundan kurtulma hakkını ortadan kaldırmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="113" başlık="Topluluk davası">
        <mvz-fıkra no="1">
          <template>Dernekler ve diğer tüzel kişiler, statüleri çerçevesinde, üyelerinin veya mensuplarının yahut temsil ettikleri kesimin menfaatlerini korumak için, kendi adlarına, ilgililerin haklarının tespiti veya hukuka aykırı durumun giderilmesi yahut ilgililerin gelecekteki haklarının ihlal edilmesinin önüne geçilmesi için dava açabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Dava Şartları ve İlk İtirazlar">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Dava Şartları">
        <mvz-madde no="114" başlık="Dava şartları">
          <mvz-fıkra no="1">
            <template>Dava şartları şunlardır:</template>
            <mvz-bent no="a">
              <template>Türk mahkemelerinin yargı hakkının bulunması.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yargı yolunun caiz olması.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Mahkemenin görevli olması.</template>
            </mvz-bent>
            <mvz-bent no="ç">
              <template>Yetkinin kesin olduğu hâllerde, mahkemenin yetkili bulunması.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Tarafların, taraf ve dava ehliyetine sahip olmaları; kanuni temsilin söz konusu olduğu hâllerde, temsilcinin gerekli niteliğe sahip bulunması.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Dava takip yetkisine sahip olunması.</template>
            </mvz-bent>
