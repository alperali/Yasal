          <mvz-bent no="ç">
            <template>Geçici hukuki koruma tedbirleri ve protesto, ihbar, ihtarname ve vekâletname düzenlenmesine ilişkin giderler.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Keşif giderleri.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Tanık ile bilirkişiye ödenen ücret ve giderler.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Resmî dairelerden alınan belgeler için ödenen harç, vergi, ücret ve sair giderler.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Vekil ile takip edilmeyen davalarda tarafların hazır bulundukları günlere ait gündelik, seyahat ve konaklama giderlerine karşılık hâkimin takdir edeceği miktar; vekili bulunduğu hâlde mahkemece bizzat dinlenmek, isticvap olunmak veya yemin etmek üzere çağrılan taraf için takdir edilecek gündelik, yol ve konaklama giderleri.</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Vekille takip edilen davalarda kanun gereğince takdir olunacak vekâlet ücreti.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Yargılama sırasında yapılan diğer giderler.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="324" başlık="Delil ikamesi için avans">
        <mvz-fıkra no="1">
          <template>Taraflardan her biri ikamesini talep ettiği delil için mahkemece belirlenen avansı, verilen kesin süre içinde yatırmak zorundadır. Taraflar birlikte aynı delilin ikamesini talep etmişlerse, gereken gideri yarı yarıya avans olarak öderler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Taraflardan birisi avans yükümlülüğünü yerine getirmezse, diğer taraf bu avansı yatırabilir. Aksi hâlde talep olunan delilin ikamesinden vazgeçilmiş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tarafların üzerinde serbestçe tasarruf edemeyeceği dava ve işler hakkındaki hükümler saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="325" başlık="Resen yapılması gereken işlemlere ilişkin giderler">
        <mvz-fıkra no="1">
          <template>Tarafların üzerinde serbestçe tasarruf edemeyeceği dava ve işlerde, hâkim tarafından resen başvurulan deliller için gereken giderlerin, bir haftalık süre içinde taraflardan birisi veya belirtilecek oranda her ikisi tarafından ödenmesine karar verilir. Belirlenen süre içinde bu işlemlere ait giderleri karşılayacak miktarda avans yatırılmazsa, ileride bu gideri ödemesi gereken taraftan alınmak üzere Hazineden ödenmesine hükmedilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="326" başlık="Yargılama giderlerinden sorumluluk">
        <mvz-fıkra no="1">
          <template>Kanunda yazılı hâller dışında, yargılama giderlerinin, aleyhine hüküm verilen taraftan alınmasına karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Davada iki taraftan her biri kısmen haklı çıkarsa, mahkeme, yargılama giderlerini tarafların haklılık oranına göre paylaştırır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Aleyhine hüküm verilenler birden fazla ise mahkeme yargılama giderlerini, bunlar arasında paylaştırabileceği gibi, müteselsilen sorumlu tutulmalarına da karar verebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="327" başlık="Dürüstlük kuralına aykırılık sebebiyle yargılama giderlerinden sorumluluk">
        <mvz-fıkra no="1">
          <template>Gereksiz yere davanın uzamasına veya gider yapılmasına sebebiyet vermiş olan taraf, davada lehine karar verilmiş olsa bile, karar ve ilam harcı dışında kalan yargılama giderlerinin tamamını veya bir kısmını ödemeye mahkûm edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir kişi davada sıfatı olmadığı hâlde, davacıyı, davalı sıfatı kendisine aitmiş gibi yanıltıp, kendisine karşı dava açılmasına sebebiyet verirse, davanın sıfat yokluğu nedeniyle reddi hâlinde, davalı yararına yargılama giderlerine hükmedilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="328" başlık="Fer’î müdahale gideri">
        <mvz-fıkra no="1">
          <template>Fer’î müdahil olarak davada yer alan kimse, yanında katıldığı taraf haksız çıkarsa, yalnızca fer’î müdahale giderinden sorumlu tutulur, aksi hâlde bu giderler diğer tarafa yükletilir. Ancak, hüküm üçüncü kişinin katıldığı taraf lehine verilmiş olsa bile, lehine hükmolunan tarafın hâl ve davranışı, üçüncü kişinin davaya katılmasını gerektirmişse, müdahale giderinin tamamı veya bir kısmı, lehine hüküm verilen tarafa yükletilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="329" başlık="Kötüniyetle veya haksız dava açılmasının sonuçları">
        <mvz-fıkra no="1">
          <template>Kötüniyetli davalı veya hiçbir hakkı olmadığı hâlde dava açan taraf, yargılama giderlerinden başka, diğer tarafın vekiliyle aralarında kararlaştırılan vekâlet ücretinin tamamı veya bir kısmını ödemeye mahkûm edilebilir. Vekâlet ücretinin miktarı hakkında uyuşmazlık çıkması veya mahkemece miktarının fahiş bulunması hâlinde, bu miktar doğrudan mahkemece takdir olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kötüniyet sahibi davalı veya hiçbir hakkı olmadığı hâlde dava açan taraf, bundan başka beşyüz Türk Lirasından beşbin Türk Lirasına kadar disiplin para cezası ile mahkûm edilebilir. Bu hâllere vekil sebebiyet vermiş ise disiplin para cezası vekil hakkında uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="330" başlık="Vekâlet ücretinin taraf lehine hükmedilmesi">
        <mvz-fıkra no="1">
          <template>Vekil ile takip edilen davalarda mahkemece, kanuna göre takdir olunacak vekâlet ücreti, taraf lehine hükmedilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="331" başlık="Esastan sonuçlanmayan davada yargılama gideri">
        <mvz-fıkra no="1">
          <template>Davanın konusuz kalması sebebiyle davanın esası hakkında bir karar verilmesine gerek bulunmayan hâllerde, hâkim, davanın açıldığı tarihteki tarafların haklılık durumuna göre yargılama giderlerini takdir ve hükmeder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Görevsizlik veya yetkisizlik kararından sonra davaya bir başka mahkemede devam edilmesi hâlinde, yargılama giderlerine o mahkeme hükmeder. Görevsizlik veya yetkisizlik kararından sonra davaya bir başka mahkemede devam edilmemiş ise talep üzerine davanın açıldığı mahkeme dosya üzerinden bu durumu tespit ile davacıyı yargılama giderlerini ödemeye mahkûm eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Davanın açılmamış sayılmasına karar verilen hâllerde yargılama giderleri davacıya yükletilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="332" başlık="Yargılama giderlerine hükmedilmesi">
        <mvz-fıkra no="1">
          <template>Yargılama giderlerine, mahkemece resen hükmedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yargılama gideri, tutarı, hangi tarafa ve hangi oranda yükletildiği ve dökümü hüküm altında gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hükümden sonraki yargılama giderlerini hangi tarafın ödeyeceği, miktarı ve dökümü ile bu giderlerin hangi tarafa yükletileceği, mahkemece ilamın altına yazılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="333" başlık="Avansın iadesi">
        <mvz-fıkra no="1">
          <template>Hükmün kesinleşmesinden sonra mahkeme kendiliğinden, yatırılan avansın kullanılmayan kısmının iadesine karar verir. Bu kararın tebliğ gideri iade edilecek avanstan karşılanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Adli Yardım">
      <mvz-madde no="334" başlık="Adli yardımdan yararlanacak kişiler">
        <mvz-fıkra no="1">
          <template>Kendisi ve ailesinin geçimini önemli ölçüde zor duruma düşürmeksizin, gereken yargılama veya takip giderlerini kısmen veya tamamen ödeme gücünden yoksun olan kimseler, iddia ve savunmalarında, geçici hukuki korunma taleplerinde ve icra takibinde, taleplerinin açıkça dayanaktan yoksun olmaması kaydıyla adli yardımdan yararlanabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="iptal">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yabancıların adli yardımdan yararlanabilmeleri ayrıca karşılıklılık şartına bağlıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="335" başlık="Adli yardımın kapsamı">
        <mvz-fıkra no="1">
          <template>Adli yardım kararı, ilgiliye, aşağıdaki hususları sağlar:</template>
          <mvz-bent no="a">
            <template>Yapılacak tüm yargılama ve takip giderlerinden geçici olarak muafiyet.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yargılama ve takip giderleri için teminat göstermekten muafiyet.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Dava ve icra takibi sırasında yapılması gereken tüm giderlerin Devlet tarafından avans olarak ödenmesi.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Davanın avukat ile takibi gerekiyorsa, ücreti sonradan ödenmek üzere bir avukat temini.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme, talepte bulunanın, yukarıdaki bentlerde düzenlenen hususlardan bir kısmından yararlanmasına da karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Adli yardım, hükmün kesinleşmesine kadar devam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="336" başlık="Adli yardım talebi">
        <mvz-fıkra no="1">
          <template>Adli yardım, asıl talep veya işin karara bağlanacağı mahkemeden; icra ve iflas takiplerinde ise takibin yapılacağı yerdeki icra mahkemesinden istenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Talepte bulunan kişi, iddiasının özeti ile birlikte, iddiasını dayandıracağı delilleri ve yargılama giderlerini karşılayabilecek durumda olmadığını gösteren mali durumuna ilişkin belgeleri mahkemeye sunmak zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kanun yollarına başvuru sırasında adli yardım talebi bölge adliye mahkemesine veya Yargıtaya yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Adli yardım talebine ilişkin evrak, her türlü harç ve vergiden muaftır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="337" başlık="Adli yardım talebinin incelenmesi">
        <mvz-fıkra no="1">
          <template>Mahkeme, adli yardım talebi hakkında duruşma yapmaksızın karar verebilir. Ancak, talep hâlinde inceleme duruşmalı olarak yapılır.  Adli yardım taleplerinin reddine ilişkin mahkeme kararlarında sunulan bilgi ve belgelerin kabul edilmeme sebebi açıkça belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Adli yardım talebinin reddine ilişkin kararlara karşı, tebliğinden itibaren iki hafta içinde kararı veren mahkemeye dilekçe vermek suretiyle itiraz edilebilir. Kararına itiraz edilen mahkeme, itirazı incelemesi için dosyayı o yerde adli yardım talebi yapılan hukuk mahkemesinin birden fazla dairesinin bulunması hâlinde, numara olarak kendisini izleyen daireye, son numaralı daire için birinci daireye, o yerde adli yardım talebi yapılan hukuk mahkemesinin tek dairesi bulunması hâlinde ise aynı işlere bakmakla görevli en yakın mahkemeye gönderir. İtiraz incelemesi neticesinde verilen karar kesindir. Adli yardım talebi reddedilirse, ödeme gücünde sonradan gerçekleşen ciddi bir azalmaya dayanılarak tekrar talepte bulunulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Adli yardım, daha önce yapılan yargılama giderlerini kapsamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="338" başlık="Adli yardım kararının kaldırılması">
        <mvz-fıkra no="1">
          <template>Adli yardımdan yararlanan kişinin mali durumu hakkında kasten veya ağır kusuru sonucu yanlış bilgi verdiği ortaya çıkar veya sonradan mali durumunun yeteri derecede iyileştiği anlaşılırsa adli yardım kararı kaldırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="339" başlık="Adli yardımla ertelenen yargılama giderlerinin tahsili">
        <mvz-fıkra no="1">
          <template>Adli yardım kararından dolayı ertelenen tüm yargılama giderleri ile Devletçe ödenen avanslar dava veya takip sonunda haksız çıkan kişiden tahsil olunur. Adli yardımdan yararlanan kişinin haksız çıkması hâlinde, uygun görülürse yargılama giderlerinin en çok bir yıl içinde aylık eşit taksitler hâlinde ödenmesine karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Adli yardım kararından dolayı Devletçe ödenen veya muaf tutulan yargılama giderlerinin tahsilinin, adli yardımdan yararlananın mağduriyetine neden olacağı mahkemece açıkça anlaşılırsa, mahkeme, hükümde tamamen veya kısmen ödemeden muaf tutulmasına karar verebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="340" başlık="Adli yardım kararıyla atanan avukatın ücretinin ödenmesi">
        <mvz-fıkra no="1">
          <template>Adli yardımdan yararlanan kişi için mahkemenin talebi üzerine baro tarafından görevlendirilen avukatın ücreti, yargılama gideri olarak Hazineden ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="8-SEKİZİNCİ" başlık="Kanun Yolları">
    <mvz-bölüm no="1-BİRİNCİ" başlık="İstinaf">
      <mvz-madde no="341" başlık="İstinaf yoluna başvurulabilen kararlar">
        <mvz-fıkra no="1">
          <template>İlk derece mahkemelerinin aşağıdaki kararlarına karşı istinaf yoluna başvurulabilir:</template>
          <mvz-bent no="a">
            <template>Nihai kararlar.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İhtiyati tedbir ve ihtiyati haciz taleplerinin reddi kararları, karşı tarafın yüzüne karşı verilen ihtiyati tedbir ve ihtiyati haciz kararları, karşı tarafın yokluğunda verilen ihtiyati tedbir ve ihtiyati haciz kararlarına karşı yapılan itiraz üzerine verilen kararlar.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Miktar veya değeri üç bin Türk Lirasını geçmeyen malvarlığı davalarına ilişkin kararlar kesindir.  Ancak manevi tazminat davalarında verilen kararlara karşı, miktar veya değere bakılmaksızın istinaf yoluna başvurulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Alacağın bir kısmının dava edilmiş olması durumunda üç bin Türk Liralık kesinlik sınırı alacağın tamamına göre belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Alacağın tamamının dava edilmiş olması durumunda, kararda asıl talebinin kabul edilmeyen bölümü üç bin Türk Lirasını geçmeyen taraf, istinaf yoluna başvuramaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İlk derece mahkemelerinin diğer kanunlarda temyiz edilebileceği veya haklarında Yargıtaya başvurulabileceği belirtilmiş olup da bölge adliye mahkemelerinin görev alanına giren dava ve işlere ilişkin nihai kararlarına karşı, bölge adliye mahkemelerine başvurulabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="342" başlık="İstinaf dilekçesi">
        <mvz-fıkra no="1">
          <template>İstinaf yoluna başvurma, dilekçeyle yapılır ve dilekçeye, karşı tarafın sayısı kadar örnek eklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İstinaf dilekçesinde aşağıdaki hususlar bulunur:</template>
          <mvz-bent no="a">
            <template>Başvuran ile karşı tarafın davadaki sıfatları, adı, soyadı, Türkiye Cumhuriyeti kimlik numarası ve adresleri.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Varsa kanuni temsilci ve vekillerinin adı, soyadı ve adresleri.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kararın hangi mahkemeden verilmiş olduğu ve tarihi ile sayısı.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Kararın başvurana tebliğ edildiği tarih.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kararın özeti.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Başvuru sebepleri ve gerekçesi.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Talep sonucu.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Başvuranın veya varsa kanuni temsilci yahut vekilinin imzası.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İstinaf dilekçesi, başvuranın kimliği ve imzasıyla, başvurulan kararı yeteri kadar belli edecek kayıtları taşıması durumunda diğer hususlar bulunmasa bile reddolunmayıp, 355 inci madde çerçevesinde gerekli inceleme yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="343" başlık="İstinaf dilekçesinin verilmesi">
        <mvz-fıkra no="1">
          <template>İstinaf dilekçesi, kararı veren mahkemeye veya başka bir yer mahkemesine verilebilir. İstinaf dilekçesi hangi mahkemeye verilmişse, o mahkemece bölge adliye mahkemesi başvuru defterine kaydolunur ve başvurana ücretsiz bir alındı belgesi verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kararı veren mahkemeden başka bir mahkemeye verilmiş olan istinaf dilekçesi, bu mahkemece yukarıdaki fıkraya göre işlem yapıldıktan sonra kararı veren mahkemeye örnekleriyle birlikte gönderilir. Bu durum derhâl mahkemesine bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İstinaf yoluna başvurma tarihi konusunda 118 inci madde hükmü uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Dosya, kararı veren mahkemece, istinaf dilekçesinde gösterilen daire ile bağlı kalınmaksızın, ilgili bölge adliye mahkemesine gönderilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="344" başlık="Harç ve giderlerin yatırılması">
        <mvz-fıkra no="1">
          <template>İstinaf dilekçesi verilirken, istinaf kanun yoluna başvuru için gerekli harçlar ve tebliğ giderleri de dâhil olmak üzere tüm giderler ödenir. Bunların hiç ödenmediği veya eksik ödenmiş olduğu sonradan anlaşılırsa, kararı veren mahkeme tarafından verilecek bir haftalık kesin süre içinde tamamlanması, aksi hâlde başvurudan vazgeçmiş sayılacağı hususu başvurana yazılı olarak bildirilir. Verilen kesin süre içinde harç ve giderler tamamlanmadığı takdirde, mahkeme başvurunun yapılmamış sayılmasına karar verir. Bu karara karşı istinaf yoluna başvurulması hâlinde, 346 ncı maddenin ikinci fıkrası hükmü kıyas yoluyla uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="345" başlık="Başvuru süresi">
        <mvz-fıkra no="1">
          <template>İstinaf yoluna başvuru süresi iki haftadır. Bu süre, ilamın usulen taraflardan her birine tebliğiyle işlemeye başlar. İstinaf yoluna başvuru süresine ilişkin özel kanun hükümleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="346" başlık="İstinaf dilekçesinin reddi">
        <mvz-fıkra no="1">
          <template>İstinaf dilekçesi, kanuni süre geçtikten sonra verilir veya kesin olan bir karara ilişkin olursa, kararı veren mahkeme istinaf dilekçesinin reddine karar verir ve 344 üncü maddeye göre yatırılan giderden karşılanmak suretiyle ret kararını kendiliğinden ilgiliye tebliğ eder.</template>
        </mvz-fıkra>

      <mvz-madde no="363" başlık="Kanun yararına temyiz">
        <mvz-fıkra no="1">
          <template>İlk derece mahkemelerinin kesin olarak verdikleri kararlar ile istinaf incelemesinden geçmeden kesinleşmiş bulunan kararlarına ve bölge adliye mahkemesi hukuk dairelerinin ilk derece mahkemesi sıfatıyla kesin olarak verdikleri kararlar ile yine bu sıfatla verdikleri ve temyiz incelemesinden geçmeden kesinleşmiş bulunan kararlarına karşı, yürürlükteki hukuka aykırı bulunduğu ileri sürülerek Adalet Bakanlığı veya Yargıtay Cumhuriyet Başsavcılığı tarafından kanun yararına temyiz yoluna başvurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Temyiz talebi Yargıtayca yerinde görüldüğü takdirde, karar kanun yararına bozulur. Bu bozma, kararın hukuki sonuçlarını ortadan kaldırmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bozma kararının bir örneği Adalet Bakanlığına gönderilir ve Bakanlıkça Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="364" başlık="Temyiz dilekçesi">
        <mvz-fıkra no="1">
          <template>Temyiz, dilekçe ile yapılır ve dilekçeye, karşı tarafın sayısı kadar örnek eklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Temyiz dilekçesinde aşağıdaki hususlar bulunur:</template>
          <mvz-bent no="a">
            <template>Temyiz eden ile karşı tarafın davadaki sıfatları, adı, soyadı, Türkiye Cumhuriyeti kimlik numarası ve adresleri.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bunların varsa kanuni temsilci ve vekillerinin adı, soyadı ve adresleri.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Temyiz edilen kararın hangi bölge adliye mahkemesi hukuk dairesinden verilmiş olduğu, tarihi ve sayısı.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Yargıtayın bozma kararı üzerine, bozmaya uygun olarak ilk derece mahkemesince verilen yeni kararın veya direnme kararına karşı temyizde direnme kararının, hangi mahkemeye ait olduğu, tarihi ve sayısı.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>İlamın temyiz edene tebliğ edildiği tarih.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Kararın özeti.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Temyiz sebepleri ve gerekçesi.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Duruşma istenmesi hâlinde bu istek.</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Temyiz edenin veya varsa kanuni temsilci yahut vekilinin imzası.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Temyiz dilekçesinin, temyiz edenin kimliği ve imzasıyla temyiz olunan kararı yeteri kadar belli edecek kayıtları taşıması hâlinde, diğer şartlar bulunmasa bile reddolunmayıp temyiz incelemesi yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="365" başlık="Temyiz dilekçesinin verilmesi">
        <mvz-fıkra no="1">
          <template>Temyiz dilekçesi, kararı veren bölge adliye mahkemesi hukuk dairesine veya Yargıtayın bozması üzerine hüküm veren ilk derece mahkemesine yahut temyiz edenin bulunduğu yer bölge adliye mahkemesi hukuk dairesine veya ilk derece mahkemesine verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Temyiz dilekçesi, kararı veren mahkemeden başka bir mahkemeye verilmişse temyiz defterine kaydolunur ve durum derhâl kararı temyiz edilen mahkemeye bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Temyiz edene ücretsiz bir alındı belgesi verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="366" başlık="Kıyas yoluyla uygulanacak hükümler">
        <mvz-fıkra no="1">
          <template>Bu Kanunun istinaf yolu ile ilgili 343 ilâ 349 ve 352 nci maddeleri hükümleri, temyizde de kıyas yoluyla uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="367" başlık="Temyizin icraya etkisi">
        <mvz-fıkra no="1">
          <template>Temyiz, kararın icrasını durdurmaz. İcra ve İflas Kanununun icranın geri bırakılmasıyla ilgili 36 ncı maddesi hükmü saklıdır. Nafaka kararlarında icranın geri bırakılmasına karar verilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kişiler hukuku, aile hukuku ve taşınmaz mal ile ilgili ayni haklara ilişkin kararlar kesinleşmedikçe yerine getirilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="368" başlık="Kötüniyetle temyiz">
        <mvz-fıkra no="1">
          <template>Temyiz talebinin kötüniyetle yapıldığı anlaşılırsa Yargıtayca 329 uncu madde hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="369" başlık="Temyiz incelemesi ve duruşma">
        <mvz-fıkra no="1">
          <template>Yargıtay, tarafların ileri sürdükleri temyiz sebepleriyle bağlı olmayıp, kanunun açık hükmüne aykırı gördüğü diğer hususları da inceleyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yargıtay temyiz incelemesini dosya üzerinde yapar. Ancak, tüzel kişiliğin feshine veya genel kurul kararlarının iptaline, evlenmenin butlanına veya iptaline, boşanma veya ayrılığa, velayete, soybağına ve kısıtlamaya ilişkin davalarla miktar veya değeri altmışbin Türk Lirasını aşan alacak ve ayın davalarında taraflardan biri temyiz veya cevap dilekçesinde duruşma yapılmasını talep etmiş ise Yargıtayca bir gün belli edilerek taraflara usulen davetiye gönderilir. Tebliğ tarihi ile duruşma günü arasında en az iki hafta bulunması gerekir; taraflar gelmişlerse bu süreye bakılmaz. Tebligat gideri verilmemişse duruşma talebi dikkate alınmaz. Duruşma giderinin eksik ödenmiş olduğu anlaşılırsa, dairenin başkanı tarafından verilecek bir haftalık kesin süre içinde tamamlanması, aksi hâlde duruşma talebinden vazgeçilmiş sayılacağı, duruşma isteyene yazılı olarak bildirilir. Verilen süre içinde giderler tamamlanmadığı takdirde, Yargıtay incelemesini dosya üzerinde yapar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Altmışbin Türk Liralık duruşma sınırının belirlenmesinde 362 nci maddenin ikinci fıkrası kıyas yoluyla uygulanır.59</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yargıtay, ikinci fıkra hükmü ile bağlı olmaksızın, bilgi almak üzere resen de duruşma yapılmasına karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Duruşma günü belli edilen hâllerde Yargıtay, tarafları veya gelen tarafı dinledikten sonra, taraflardan hiçbiri gelmemiş ise dosya üzerinde inceleme yaparak kararını verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Duruşma günü kararı verilemeyen işlerin en geç bir ay içinde karara bağlanması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kanunda ivedi olduğu bildirilen dava ve işlere ait temyiz incelemesi öncelikle yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="370" başlık="Onama kararları">
        <mvz-fıkra no="1">
          <template>Yargıtay, onama kararında, onadığı kararın hukuk kurallarına uygunluk gerekçesini göstermek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Temyiz olunan kararın, esas yönünden kanuna uygun olup da kanunun olaya uygulanmasında hata edilmiş olmasından dolayı bozulması gerektiği ve kanuna uymayan husus hakkında yeniden yargılama yapılmasına ihtiyaç duyulmadığı takdirde Yargıtay, kararı düzelterek onayabilir. Esas yönünden kanuna uygun olmayan kararlar ile hâkimin takdir yetkisi kapsamında karara bağladığı edalar hakkında bu fıkra hükmü uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tarafların kimliklerine ait yanlışlıklarla, yazı, hesap veya diğer açık ifade yanlışlıkları hakkında da bu hüküm uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Karar, usule ve kanuna uygun olup da gösterilen gerekçe doğru bulunmazsa, gerekçe değiştirilerek ve düzeltilerek onanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="371" başlık="Bozma sebepleri">
        <mvz-fıkra no="1">
          <template>Yargıtay, aşağıda belirtilen sebeplerden dolayı gerekçe göstererek temyiz olunan kararı kısmen veya tamamen bozar:</template>
          <mvz-bent no="a">
            <template>Hukukun veya taraflar arasındaki sözleşmenin yanlış uygulanmış olması.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Dava şartlarına aykırılık bulunması.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Taraflardan birinin davasını ispat için dayandığı delillerin kanuni bir sebep olmaksızın kabul edilmemesi.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Karara etki eden yargılama hatası veya eksiklikleri bulunması.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="372" başlık="Yargıtay kararlarının tebliği">
        <mvz-fıkra no="1">
          <template>Yargıtayın bozma kararları ile onama kararları mahkeme yazı işleri müdürü tarafından derhâl taraflara tebliğ edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tebliğ giderleri, temyiz dilekçesiyle birlikte, temyiz talebinde bulunandan peşin olarak alınır. Bu giderlerin ödenmemesi hâlinde 344 üncü madde hükmü uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="373" başlık="Bozmaya uyma veya direnme">
        <mvz-fıkra no="1">
          <template>Yargıtay ilgili dairesinin tamamen veya kısmen bozma kararı, başvurunun bölge adliye mahkemesi tarafından esastan reddi kararına ilişkin ise bölge adliye mahkemesi kararı kaldırılarak dosya, kararı veren ilk derece mahkemesine veya uygun görülecek diğer bir ilk derece mahkemesine, kararın bir örneği de bölge adliye mahkemesine gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bölge adliye mahkemesinin düzelterek veya yeniden esas hakkında verdiği karar Yargıtayca tamamen veya kısmen bozulduğu takdirde dosya, kararı veren bölge adliye mahkemesi veya uygun görülen diğer bir bölge adliye mahkemesine gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bölge adliye mahkemesi, 344 üncü madde uyarınca peşin alınmış olan gideri kullanmak suretiyle, kendiliğinden tarafları duruşmaya davet edip dinledikten sonra Yargıtayın bozma kararına uyulup uyulmayacağına karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yargıtayın bozma kararı üzerine ilk derece mahkemesince bozmaya uygun olarak karar verildiği takdirde, bu karara karşı temyiz yoluna başvurulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İlk derece mahkemesi veya bölge adliye mahkemesi kararında direnirse, bu kararın temyiz edilmesi durumunda inceleme, kararına direnilen dairece yapılır. Direnme kararı öncelikle incelenir. Daire, direnme kararını yerinde görürse kararını düzeltir; görmezse dosyayı Yargıtay Hukuk Genel Kuruluna gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Davanın esastan reddi veya kabulünü içeren bozmaya uyularak tesis olunan kararın önceki bozmayı ortadan kaldıracak şekilde yeniden bozulması üzerine alt mahkemece verilen kararın temyiz incelemesi, her hâlde Yargıtay Hukuk Genel Kurulunca yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Hukuk Genel Kurulunun verdiği karara uymak zorunludur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Yargılamanın İadesi">
      <mvz-madde no="374" başlık="Konu">
        <mvz-fıkra no="1">
          <template>Yargılamanın iadesi, kesin olarak verilen veya kesinleşmiş olan hükümlere karşı istenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="375" başlık="Yargılamanın iadesi sebepleri">
        <mvz-fıkra no="1">
          <template>Aşağıdaki sebeplere dayanılarak yargılamanın iadesi talep edilebilir:</template>
          <mvz-bent no="a">
            <template>Mahkemenin kanuna uygun olarak teşekkül etmemiş olması.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Davaya bakması yasak olan yahut hakkındaki ret talebi, merciince kesin olarak kabul edilen hâkimin karar vermiş veya karara katılmış bulunması.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Vekil veya temsilci olmayan kimselerin huzuruyla davanın görülmüş ve karara bağlanmış olması.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Yargılama sırasında, aleyhine hüküm verilen tarafın elinde olmayan nedenlerle elde edilemeyen bir belgenin, kararın verilmesinden sonra ele geçirilmiş olması.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Karara esas alınan senedin sahteliğine karar verilmiş veya senedin sahte olduğunun mahkeme veya resmî makam önünde ikrar edilmiş olması.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İfadesi karara esas alınan tanığın, karardan sonra yalan tanıklık yaptığının sabit olması.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Bilirkişi veya tercümanın, hükme esas alınan husus hakkında kasten gerçeğe aykırı beyanda bulunduğunun sabit olması.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Lehine karar verilen tarafın, karara esas alınan yemini yalan yere ettiğinin, ikrar veya yazılı delille sabit olması.</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Karara esas alınan bir hükmün, kesinleşmiş başka bir hükümle ortadan kalkmış olması.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Lehine karar verilen tarafın, karara tesir eden hileli bir davranışta bulunmuş olması.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Bir dava sonunda verilen hükmün kesinleşmesinden sonra tarafları, konusu ve sebebi aynı olan ikinci davada, öncekine aykırı bir hüküm verilmiş ve bu hükmün de kesinleşmiş olması.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Kararın, İnsan Haklarını ve Ana Hürriyetleri Korumaya Dair Sözleşmenin veya eki protokollerin ihlali suretiyle verildiğinin, Avrupa İnsan Hakları Mahkemesinin kesinleşmiş kararıyla tespit edilmiş olması veya karar aleyhine Avrupa İnsan Hakları Mahkemesine yapılan başvuru hakkında dostane çözüm ya da tek taraflı deklarasyon sonucunda düşme kararı verilmesi.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkranın (e), (f) ve (g) bentlerindeki hâllerde yargılamanın iadesinin istenebilmesi, bu sebeplerin kesinleşmiş bir ceza mahkûmiyet kararı ile belirlenmiş olması şartına bağlıdır. Delil yokluğundan başka bir sebeple ceza kovuşturmasına başlanamamış veya mahkûmiyet kararı verilememiş ise ceza mahkemesi kararı aranmaz. Bu takdirde dayanılan yargılamanın iadesi sebebinin, yargılamanın iadesi davasında öncelikle ispat edilmesi gerekir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="376" başlık="Üçüncü kişilerin hükmün iptalini talep etmesi">
        <mvz-fıkra no="1">
          <template>Davanın taraflarından birisinin alacaklıları veya aleyhine hüküm verilen tarafın yerine geçenler, borçluları veya yerine geçmiş oldukları kimselerin aralarında anlaşarak, kendilerine karşı hile yapmaları nedeniyle hükmün iptalini isteyebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="377" başlık="Süre">
        <mvz-fıkra no="1">
          <template>Yargılamanın iadesi süresi;</template>
          <mvz-bent no="a">
            <template>Mahkemenin kanuna uygun olarak teşekkül etmemiş olduğunun öğrenildiği,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>375 inci maddenin birinci fıkrasının (b) ve (c) bentlerinde öngörülen hâllerde, kararın davalıya veya gerçek vekil veya temsilciye tebliğ edildiği; alacaklı veya davalı yerine geçenlerin karardan usulen haberdar olduğu,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yeni belgenin elde edildiği veya hilenin farkına varıldığı,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>375 inci maddenin birinci fıkrasının (d), (e), (f) ve (g) bentlerindeki hâllerde, ceza mahkûmiyetine ilişkin hükmün kesinleştiği veya ceza kovuşturmasına başlanamadığı yahut soruşturmanın sonuçsuz kaldığı,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Karara esas alınan ilamın bozularak kesin hüküm şeklinde tamamen ortadan kalkmasından haberdar olunduğu,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>375 inci maddenin birinci fıkrasının (i) bendinde yazılı sebepten dolayı, Avrupa İnsan Hakları Mahkemesinin kesinleşmiş kararının tebliğ edildiği,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>tarihten itibaren üç ay ve her hâlde iade talebine konu olan hükmün kesinleşmesinden itibaren on yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>375 inci maddenin birinci fıkrasının (ı) bendinde yazılan sebepten dolayı yargılamanın yenilenmesi süresi ilama ilişkin zamanaşımı süresi kadardır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="378" başlık="İnceleyecek mahkeme ve teminat">
        <mvz-fıkra no="1">
          <template>Yargılamanın iadesi talebini içeren dilekçe, kararı veren mahkemece incelenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme, dayanılan sebebin niteliğine göre yargılamanın iadesi talebinde bulunandan karşı tarafın zarar ve ziyanını karşılayacak uygun bir miktar teminat göstermesini isteyebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="379" başlık="Talebin ön incelemesi">
        <mvz-fıkra no="1">
          <template>Yargılamanın iadesi talebi üzerine mahkeme, tarafları davet edip dinledikten sonra;</template>
          <mvz-bent no="a">
            <template>Talebin kanuni süre içinde yapılmış olup olmadığını,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yargılamanın iadesi yoluyla kaldırılması istenen hükmün kesin olarak verilmiş veya kesinleşmiş olup olmadığını,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İleri sürülen yargılamanın iadesi sebebinin kanunda yazılı sebeplerden olup olmadığını,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>kendiliğinden inceler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu koşullardan biri eksik ise hâkim davayı esasa girmeden reddeder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="380" başlık="Yeniden yargılama veya hükmün iptali">
        <mvz-fıkra no="1">
          <template>İnceleme sonunda, dayanılan yargılamanın iadesi sebebi sabit görülürse, yeniden yargılama yapılarak ortaya çıkacak duruma göre verilmiş olan karar onanır veya kısmen yahut tamamen değiştirilir. Ancak, davacının açık veya zımni muvafakati olmaksızın vekil veya temsilci olmayan kimselerin huzuruyla davanın görülmüş ve karara bağlanmış olması yahut 375 inci maddenin birinci fıkrasının (ı) bendine dayalı olarak yargılamanın iadesi dilekçesi kabul olunursa, başka bir inceleme yapılmaksızın hüküm iptal edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu husus, iade yoluyla incelenmesi istenen hükmün bütün nüshalarında gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="381" başlık="İcranın durdurulması">
        <mvz-fıkra no="1">
          <template>Yargılamanın iadesi davası, hükmün icrasını durdurmaz. Ancak dava veya hükmün niteliğine ve diğer hâllere göre talep üzerine icranın durdurulmasına ihtiyaç duyulursa, yargılamanın iadesi talebinde bulunan kimseden teminat alınmak şartıyla iade talebini inceleyen mahkemece icranın durdurulması kararı verilebilir. Yargılamanın iadesi sebebi bir mahkeme kararına dayanıyorsa bu takdirde teminat istenmez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="9-DOKUZUNCU" başlık="Çekişmesiz Yargı">
    <mvz-madde no="382" başlık="Çekişmesiz yargı işleri">
      <mvz-fıkra no="1">
        <template>Çekişmesiz yargı, hukukun, mahkemelerce, aşağıdaki üç ölçütten birine veya birkaçına göre bu yargıya giren işlere uygulanmasıdır:</template>
        <mvz-bent no="a">
          <template>İlgililer arasında uyuşmazlık olmayan hâller.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İlgililerin, ileri sürülebileceği herhangi bir hakkının bulunmadığı hâller.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Hâkimin resen harekete geçtiği hâller.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aşağıdaki işler çekişmesiz yargı işlerinden sayılır:</template>
        <mvz-bent no="a">
          <template>Kişiler hukukundaki çekişmesiz yargı işleri:</template>
          <mvz-altbent no="1">
            <template>Ergin kılınma.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Ad ve soyadın değiştirilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Ölüm karinesi sebebiyle  nüfus kütüğüne ölü kaydı düşülen kişinin sağ olduğunun tespiti.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Gaiplik kararı.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Kişisel durum sicilindeki kaydın düzeltilmesi.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Aile hukukundaki çekişmesiz yargı işleri:</template>
          <mvz-altbent no="1">
            <template>Henüz evlenme yaşında olmayanların evlenmesine izin verme.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Gaiplik nedeniyle evliliğin feshi.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Evlendirme memurunun, evlenme başvurusunu ret kararına karşı yapılan itiraz.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Yeniden evlenmede bekleme süresinin hâkim tarafından kaldırılması.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Terk eden eşin ortak konuta davet edilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Eşlerden birinin, evlilik birliğini tek başına temsil etmek konusunda yetkili kılınması.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Aile konutu ile ilgili işlemler için diğer eşin rızasının sağlanamadığı hâllerde hâkimin müdahalesinin istenmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>Mevcut mal rejiminin eşlerden birinin veya alacaklıların talebiyle mal ayrılığına dönüştürülmesi ve sebeplerin ortadan kalkması hâlinde mal ayrılığından eski rejime geri dönülmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="9">
            <template>Paylaşmalı mal ayrılığında boşanma veya evliliğin iptali hâlinde, aile konutu ve ev eşyasını hangi eşin kullanmaya devam edeceği hakkında karar verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="10">
            <template>Sağ kalan eşe aile konutu üzerinde ve ev eşyası üzerinde mülkiyet veya intifa hakkı tanınması.</template>
          </mvz-altbent>
          <mvz-altbent no="11">
            <template>Mal ortaklığında eşlerden birinin mirası reddine izin verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="12">
            <template>Ana babaya çocuğun mallarından bir kısmını çocuğun bakım ve eğitimi için sarf etme izninin verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="13">
            <template>Velayetin kaldırılması, velayetin eşlerden birinden alınarak diğerine verilmesi ve kaldırılan velayetin geri verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="14">
            <template>Hâkimin çocuğun mallarının yönetimine müdahale etmesi ve çocuğun mallarının yönetiminin kayyıma devri.</template>
          </mvz-altbent>
          <mvz-altbent no="15">
            <template>Evlilik sona erince velayet kendisinde kalan eşin, hâkime çocuğun malları hakkında defter sunması.</template>
          </mvz-altbent>
          <mvz-altbent no="16">
            <template>Aile yurdunun kurulmasına izin verilmesi, kuruluşun tebliğ ve ilanı, kapatılması hâlinde tapu sicilindeki şerhin silinmesine izin verilmesi, taşınmazın bizzat malik veya ailesi tarafından kullanılması şartına geçici olarak istisna tanınması.</template>
          </mvz-altbent>
          <mvz-altbent no="17">
            <template>14/1/1998 tarihli ve 4320 sayılı Ailenin Korunmasına Dair Kanuna göre aile mahkemesi hâkimi tarafından karar verilecek tedbirler.</template>
          </mvz-altbent>
          <mvz-altbent no="18">
            <template>Çocuk hâkimi tarafından, çocuğun anası, babası, vasisi, bakım ve gözetiminden sorumlu kimse, Sosyal Hizmetler ve Çocuk Esirgeme Kurumu ve Cumhuriyet savcısının istemi üzerine veya resen çocuklar hakkında koruyucu ve destekleyici tedbir kararı alınması.</template>
          </mvz-altbent>
          <mvz-altbent no="19">
            <template>Vesayet işleri.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Miras hukukundaki çekişmesiz yargı işleri:</template>
          <mvz-altbent no="1">
            <template>Sulh hâkimi tarafından resmî vasiyetname düzenlenmesi; el yazısı ile vasiyetnamenin sulh hâkimi tarafından saklanması; sözlü vasiyetname tutanağının sulh veya asliye mahkemesine tevdiî.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Vasiyeti yerine getirme görevlisine görevinin bildirilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Vasiyeti yerine getirme görevlisinin tereke malları üzerinde tasarruf etmesine izin verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Gaibin mirasçılarına, gaibe düşen miras payının teslim edilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Tereke mallarının korunması ve hak sahiplerine ulaşmasını sağlamak için önlem alınması.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Mirasçılık belgesi verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Terekenin yazımı işleminin sona erdiğinin mirasçılara bildirilmesi, mirasın reddi beyanının tespiti ve tescili; mirasın reddinin, mirası reddeden kişiden sonra gelen mirasçılara bildirilmesi; mirasın reddi süresinin uzatılması.</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>Terekenin resmî defterinin tutulması.</template>
          </mvz-altbent>
          <mvz-altbent no="9">
            <template>Sulh hâkiminin özellikleri olan eşyanın mirasçılardan birine tahsis edilmesi veya satılmasına karar vermesi.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Eşya hukukundaki çekişmesiz yargı işleri:</template>
          <mvz-altbent no="1">
            <template>Taşınmaz üzerinde taraf oluşturulmasına ve hak ihlaline sebebiyet vermeyecek düzeltmelerin yapılması.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Taşınmaz rehninde alacaklı için kayyım tayini.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Borçlar hukukundaki çekişmesiz yargı işleri:</template>
          <mvz-altbent no="1">
            <template>Yetkisi sona eren temsilcinin temsil belgesini mahkemeye teslimi.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Borçluya ifa veya teminat göstermesi için süre verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Tevdi mahalli belirlenmesi veya tevdi edilemeyecek eşyanın satılması.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Alacaklısı ihtilaflı olan borcun mahkemeye tevdiî.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Ayıplı hayvanın bilirkişi tarafından muayenesi.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Mesafeli satımlarda ayıbın tespiti veya ayıplı malın satılmasına izin verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>İşçiye kârdan hisse verilmesini öngören iş sözleşmesinde, mahkemenin işverenin hesaplarını inceleyecek bir kişi tayin etmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>Eser sözleşmesinde eserin ayıplı olup olmadığının bilirkişiye tespit ettirilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="9">
            <template>Satılmak için komisyoncuya gönderilen eşyanın hasarının tespiti.</template>
          </mvz-altbent>
          <mvz-altbent no="10">
            <template>Komisyoncu elindeki malın açık artırma ile satışına izin verilmesi.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Ticaret hukukundaki çekişmesiz yargı işleri:</template>
          <mvz-altbent no="1">
            <template>Ticari defterlerin zıyaı hâlinde belge verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Acentenin müvekkili hesabına teslim aldığı malın Borçlar Kanununa göre satılması.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Kollektif şirketin tasfiyesinde tasfiye memuru tayini.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Komanditer ortağın talebiyle şirket hesaplarını incelemek için eksper tayini.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Anonim şirkette ayni sermaye konulması, tescilden itibaren iki yıl içinde sermayenin onda birini aşan tutarda işletme devralınması ve sermaye azaltılmasında bilirkişi raporu alınması ve mahkemenin izni.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Kıymetli evrakın iptali.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Eşya taşımada eşyanın hasar ve eksiğinin tespit edilmesi; teslim edilememesi hâlinde Borçlar Kanunu hükümlerine göre satılmasına karar verilmesi; gönderilen eşyanın mahkeme marifetiyle muayenesi.</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>Gemi ipoteğinde, malikin bulunamadığı hâllerde kayyım tayini.</template>
          </mvz-altbent>
          <mvz-altbent no="9">
            <template>Deniz raporu tanzimi.</template>
          </mvz-altbent>
          <mvz-altbent no="10">
            <template>Kırkambar sözleşmesinde geminin hareket gününün mahkeme tarafından tayini.</template>
          </mvz-altbent>
          <mvz-altbent no="11">
            <template>Navlun sözleşmesinde, boşaltma limanında malların hâl ve vaziyetinin, ölçü, sayı ve tartısının ekspere tespit ettirilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="12">
            <template>Müşterek avaryalarda dispeççi tayini ve dispecin mahkemece tasdiki.</template>
          </mvz-altbent>
          <mvz-altbent no="13">
            <template>Denizcilik rizikolarına karşı sigortalarda zararın ve kapsamının belirlenmesi için bilirkişi tayini.</template>
          </mvz-altbent>
          <mvz-altbent no="14">
            <template>Kooperatiflerde ayni sermayeye değer biçilmesi için bilirkişi tayini.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İcra ve iflas hukukundaki çekişmesiz yargı işleri:</template>
          <mvz-altbent no="1">
            <template>İpotekli alacakta alacaklının gaipliği veya alacağı almaktan kaçınması hâlinde, borç tutarının icra dairesine tevdi edilmesi üzerine icra mahkemesi tarafından ipoteğin fekkine karar verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Doğrudan doğruya iflas.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>İflasın kaldırılması.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>İflasın kapanmasına karar verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Reddolunmuş mirasın tasfiyesinin, mirasçılardan birinin mirası kabul talebi üzerine mahkeme tarafından durdurulması.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Konkordato mühleti verilmesi ve komiserin atanması.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Konkordatonun tasdiki.</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>Sermaye şirketleri ve kooperatiflerin uzlaşma yoluyla yeniden yapılandırılmasında projenin ilanı ve ara dönem denetçisinin atanması.</template>
          </mvz-altbent>
          <mvz-altbent no="9">
            <template>Fevkalade hâllerde, kusuru olmaksızın borçlarını yerine getiremeyen borçluya mühlet verilmesi.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Çeşitli kanunlardaki çekişmesiz yargı işleri:</template>
          <mvz-altbent no="1">
            <template>Nüfus kütüklerinin sayfa birleşim yerlerinin asliye hukuk mahkemesince mühürlenmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Noterlerin göreve başlarken mahkemede yemin ettirilmeleri.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Noter evrak ve defterlerinden alınarak başka yere gönderilecek örneklerin mahkeme tarafından tasdiki.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Kamu görevlilerinin mahkeme huzurunda kanunen yemin etme zorunluluğunun öngörüldüğü diğer durumlar.</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="383" başlık="Görevli mahkeme">
      <mvz-fıkra no="1">
        <template>Çekişmesiz yargı işlerinde görevli mahkeme, aksine bir düzenleme bulunmadığı sürece sulh hukuk mahkemesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="384" başlık="Çekişmesiz yargı işlerinde yetki">
      <mvz-fıkra no="1">
        <template>Kanunda aksine hüküm bulunmadıkça, çekişmesiz yargı işleri için talepte bulunan kişinin veya ilgililerden birinin oturduğu yer mahkemesi yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="385" başlık="Yargılama usulü">
      <mvz-fıkra no="1">
        <template>Çekişmesiz yargı işlerinde, niteliğine uygun düştüğü ölçüde, basit yargılama usulü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çekişmesiz yargı işlerinde aksine bir hüküm bulunmadıkça resen araştırma ilkesi geçerlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mahkemeler dışındaki resmî makamlara bırakılan çekişmesiz yargı işlerinde uygulanacak usul, ilgili özel kanunlarında belirtilen hükümlere tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="386" başlık="Mühürleme, deftere geçirme ve yemin tutanağı düzenlenmesi usulü">
      <mvz-fıkra no="1">
        <template>Mühürleme, deftere geçirme ve yemin tutanağı gibi işlerin düzenlenmesi usulü, bu Kanun gereğince, Adalet Bakanlığı tarafından çıkarılacak yönetmelikte belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="387" başlık="Kararlara karşı başvuru yolları">
      <mvz-fıkra no="1">
        <template>Çekişmesiz yargı işlerinde verilen kararlara karşı hukuki yararı bulunan ilgililer, özel kanuni düzenlemeler saklı kalmak kaydıyla, kararın öğrenilmesinden itibaren iki hafta içinde, bu Kanun hükümleri dairesinde istinaf yoluna başvurabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="388" başlık="Kararların niteliği">
      <mvz-fıkra no="1">
        <template>Kanunda aksine hüküm bulunmayan hâllerde, çekişmesiz yargı kararları maddi anlamda kesin hüküm teşkil etmez.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="10-ONUNCU" başlık="Geçici Hukuki Korumalar">
    <mvz-bölüm no="1-BİRİNCİ" başlık="İhtiyati Tedbir">
      <mvz-madde no="389" başlık="İhtiyati tedbirin şartları">
        <mvz-fıkra no="1">
          <template>Mevcut durumda meydana gelebilecek bir değişme nedeniyle hakkın elde edilmesinin önemli ölçüde zorlaşacağından ya da tamamen imkânsız hâle geleceğinden veya gecikme sebebiyle bir sakıncanın yahut ciddi bir zararın doğacağından endişe edilmesi hâllerinde, uyuşmazlık konusu hakkında ihtiyati tedbir kararı verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkra hükmü niteliğine uygun düştüğü ölçüde çekişmesiz yargı işlerinde de uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="390" başlık="İhtiyati tedbir talebi">
        <mvz-fıkra no="1">
          <template>İhtiyati tedbir, dava açılmadan önce, esas hakkında görevli ve yetkili olan mahkemeden; dava açıldıktan sonra ise ancak asıl davanın görüldüğü mahkemeden talep edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Talep edenin haklarının derhâl korunmasında zorunluluk bulunan hâllerde, hâkim karşı tarafı dinlemeden de tedbire karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tedbir talep eden taraf, dilekçesinde dayandığı ihtiyati tedbir sebebini ve türünü açıkça belirtmek ve davanın esası yönünden kendisinin haklılığını yaklaşık olarak ispat etmek zorundadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="391" başlık="İhtiyati tedbir kararı">
        <mvz-fıkra no="1">
          <template>Mahkeme, tedbire konu olan mal veya hakkın muhafaza altına alınması veya bir yediemine tevdii ya da bir şeyin yapılması veya yapılmaması gibi, sakıncayı ortadan kaldıracak veya zararı engelleyecek her türlü tedbire karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İhtiyati tedbir kararında;</template>
          <mvz-bent no="a">
            <template>İhtiyati tedbir talep edenin, varsa kanuni temsilcisi ve vekilinin ve karşı tarafın adı, soyadı ve yerleşim yeri ile talep edenin Türkiye Cumhuriyeti kimlik numarası,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Tedbirin, açık ve somut olarak hangi sebebe ve delillere dayandığı,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Tereddüde yer vermeyecek şekilde, neyin üzerinde ve ne tür bir tedbire karar verildiği,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Talepte bulunanın, ne tutarda ve ne türde bir teminat göstereceği,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>yazılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İhtiyati tedbir talebinin reddi kararı gerekçeli olarak verilir ve bu karara karşı kanun yoluna başvurulabilir. Yüzüne karşı aleyhine ihtiyati tedbir kararı verilen taraf da kanun yoluna başvurabilir. Bu başvurular öncelikle incelenir ve kesin olarak karara bağlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="392" başlık="İhtiyati tedbirde teminat gösterilmesi">
        <mvz-fıkra no="1">
          <template>İhtiyati tedbir talep eden, haksız çıktığı takdirde karşı tarafın ve üçüncü kişilerin bu yüzden uğrayacakları muhtemel zararlara karşılık teminat göstermek zorundadır. Talep, resmî belgeye, başkaca kesin bir delile dayanıyor yahut durum ve koşullar gerektiriyorsa, mahkeme gerekçesini açıkça belirtmek şartıyla teminat alınmamasına da karar verebilir. Adli yardımdan yararlanan kimsenin teminat göstermesi gerekmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Asıl davaya ilişkin hükmün kesinleşmesinden veya ihtiyati tedbir kararının kalkmasından itibaren bir ay içinde tazminat davasının açılmaması üzerine teminat iade edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="393" başlık="İhtiyati tedbir kararının uygulanması">
        <mvz-fıkra no="1">
          <template>İhtiyati tedbir kararının uygulanması, bu kararın, tedbir isteyen tarafa tefhim veya tebliğinden itibaren bir hafta içinde talep edilmek zorundadır. Aksi hâlde, kanuni süre içinde dava açılmış olsa dahi, tedbir kararı kendiliğinden kalkar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tedbir kararının uygulanması, kararı veren mahkemenin yargı çevresinde bulunan veya tedbir konusu mal ya da hakkın bulunduğu yer icra dairesinden talep edilir. Mahkeme, kararında belirtmek suretiyle, tedbirin uygulanmasında, yazı işleri müdürünü de görevlendirebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İhtiyati tedbir kararının uygulanması için, gerekirse zor kullanılabilir. Zor kullanmak hususunda, bütün kolluk kuvvetleri ve köylerde muhtarlar, uygulamayı gerçekleştirecek memurun yazılı başvurusu üzerine, kendisine yardım etmek ve emirlerine uymakla yükümlüdürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İhtiyati tedbiri uygulayan memur, bir tutanak düzenler. Bu tutanakta, tedbir konusu ve bulunduğu yer gösterilir; tedbir konusu ile ilgili her türlü iddia bu tutanağa geçirilir. Tedbiri uygulayan memur, bu tutanağın bir örneğini tedbir sırasında hazır bulunmayan taraflara ve duruma göre üçüncü kişiye tebliğ eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İhtiyati tedbir kararları hakkında kanun yoluna başvurulması hâlinde, tedbire ilişkin dosya ve delillerin sadece örnekleri ilgili mahkemeye gönderilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="394" başlık="İhtiyati tedbir kararına karşı itiraz">
        <mvz-fıkra no="1">
          <template>Karşı taraf dinlenmeden verilmiş olan ihtiyati tedbir kararlarına itiraz edilebilir. Aksine karar verilmedikçe, itiraz icrayı durdurmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İhtiyati tedbirin uygulanması sırasında karşı taraf hazır bulunuyorsa, tedbirin uygulanmasından itibaren; hazır bulunmuyorsa tedbirin uygulanmasına ilişkin tutanağın tebliğinden itibaren bir hafta içinde, ihtiyati tedbirin şartlarına, mahkemenin yetkisine ve teminata ilişkin olarak, kararı veren mahkemeye itiraz edebilir.  Esas hakkında dava açıldıktan sonra, itiraz hakkında, bu davaya bakan mahkemece karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İhtiyati tedbir kararının uygulanması sebebiyle menfaati açıkça ihlal edilen üçüncü kişiler de ihtiyati tedbiri öğrenmelerinden itibaren bir hafta içinde ihtiyati tedbirin şartlarına ve teminata itiraz edebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İtiraz dilekçeyle yapılır. İtiraz eden, itiraz sebeplerini açıkça göstermek ve itirazının dayanağı olan tüm delilleri dilekçesine eklemek zorundadır. Mahkeme, ilgilileri dinlemek üzere davet eder; gelmedikleri takdirde dosya üzerinden inceleme yaparak kararını verir. İtiraz üzerine mahkeme, tedbir kararını değiştirebilir veya kaldırabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İtiraz hakkında verilen karara karşı, kanun yoluna başvurulabilir. Bu başvuru öncelikle incelenir ve kesin olarak karara bağlanır. Kanun yoluna başvurulmuş olması, tedbirin uygulanmasını durdurmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="395" başlık="Teminat karşılığı tedbirin değiştirilmesi veya kaldırılması">
        <mvz-fıkra no="1">
          <template>Aleyhine ihtiyati tedbir kararı verilen veya hakkında bu tedbir kararı uygulanan kişi, mahkemece kabul edilecek teminatı gösterirse, mahkeme, duruma göre tedbirin değiştirilmesine veya kaldırılmasına karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Teminatın tutarı, tedbirin değiştirilmesi veya kaldırılmasına göre; türü ise 87 nci maddeye göre tayin edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İtiraza ilişkin 394 üncü maddenin üçüncü ve dördüncü fıkrası, kıyas yoluyla uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="396" başlık="Durum ve koşulların değişmesi sebebiyle tedbirin değiştirilmesi veya kaldırılması">
        <mvz-fıkra no="1">
          <template>Durum ve koşulların değiştiği sabit olursa, talep üzerine ihtiyati tedbirin değiştirilmesine veya kaldırılmasına teminat aranmaksızın karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İtiraza ilişkin 394 üncü maddenin üçüncü ve dördüncü fıkrası, kıyas yoluyla uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="397" başlık="İhtiyati tedbiri tamamlayan işlemler">
        <mvz-fıkra no="1">
          <template>İhtiyati tedbir kararı dava açılmasından önce verilmişse, tedbir talep eden, bu kararın uygulanmasını talep ettiği tarihten itibaren iki hafta içinde esas hakkındaki davasını açmak ve dava açtığına ilişkin evrakı, kararı uygulayan memura ibrazla dosyaya koydurtmak ve karşılığında bir belge almak zorundadır. Aksi hâlde tedbir kendiliğinden kalkar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İhtiyati tedbir kararının etkisi, aksi belirtilmediği takdirde, nihai kararın kesinleşmesine kadar devam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tedbir kalkmış veya kaldırılmış ise bu husus ilgili yerlere bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İhtiyati tedbir dosyası, asıl dava dosyasının eki sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="398" başlık="Tedbire muhalefetin cezası">
        <mvz-fıkra no="1">
          <template>İhtiyati tedbir kararının uygulanmasına ilişkin emre uymayan veya tedbir kararına aykırı davranan kimse, ihlalin öğrenildiği tarihten itibaren altı ay içinde şikâyet edilmesi üzerine, altı aya kadar disiplin hapsi ile cezalandırılır. Görevli ve yetkili mahkeme, esas hakkındaki dava henüz açılmamışsa, ihtiyati tedbir kararı veren mahkeme; esas hakkındaki dava açılmışsa, bu davanın görüldüğü mahkemedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Şikâyet olunana, şikâyet dilekçesi ile birlikte duruşma gün ve saatini bildiren davetiye gönderilir. Davetiyede, savunma ve delillerini duruşma gününe kadar bildirmesi ve duruşmaya gelmediği takdirde yargılamaya yokluğunda devam olunarak karar verileceği ihtar edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme duruşmaya gelen şikâyet olunana, 5271 sayılı Kanunun 147 nci maddesinde belirtilen haklarını hatırlatarak savunmasını alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mahkeme, dosyadaki delilleri değerlendirerek gerekli araştırmayı yapar. Yargılama sonunda şikâyet olunanın ihtiyati tedbir kararının uygulanmasına ilişkin emre uymadığı veya tedbir kararına aykırı davrandığı tespit edilirse, birinci fıkra uyarınca disiplin hapsi ile cezalandırılmasına; aksi takdirde şikâyetin reddine karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Taraflar, kararın  tebliğinden itibaren iki hafta içinde karara itiraz edebilir. İtirazı, o yerde hükmü veren mahkemenin birden fazla dairesinin bulunması hâlinde, numara olarak kendisinden sonra gelen daire; son numaralı daire için bir numaralı daire; o yerde hükmü veren mahkemenin tek dairesi bulunması hâlinde en yakın yerdeki aynı düzey ve sıfattaki mahkeme inceler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>İtiraz merci, bir hafta içinde kararını verir. Merci, itirazı yerinde görürse işin esası hakkında karar verir. İtiraz üzerine verilen karar kesindir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu madde uyarınca verilen disiplin hapsi kararları kesinleşmeden infaz edilemez. Kesinleşen kararların infazı Cumhuriyet başsavcılığınca yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Tedbir kararına aykırı davranışın sona ermesi veya tedbir kararının gereğinin yerine getirilmesi ya da şikâyetten vazgeçilmesi hâlinde, dava ve bütün sonuçlarıyla beraber ceza düşer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Disiplin hapsine ilişkin karar, kesinleştiği tarihten itibaren iki yıl geçtikten sonra yerine getirilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="399" başlık="Tazminat">
        <mvz-fıkra no="1">
          <template>Lehine ihtiyati tedbir kararı verilen taraf, ihtiyati tedbir talebinde bulunduğu anda haksız olduğu anlaşılır yahut tedbir kararı kendiliğinden kalkar ya da itiraz üzerine kaldırılır ise haksız ihtiyati tedbir nedeniyle uğranılan zararı tazminle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Haksız ihtiyati tedbirden kaynaklanan tazminat davası, esas hakkındaki davanın karara bağlandığı mahkemede açılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tazminat davası açma hakkı, hükmün kesinleşmesinden veya ihtiyati tedbir kararının kalkmasından itibaren, bir yıl geçmesiyle zamanaşımına uğrar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Delil Tespiti ve Diğer Geçici Hukuki Korumalar">
      <mvz-madde no="400" başlık="Delil tespitinin istenebileceği hâller">
        <mvz-fıkra no="1">
          <template>Taraflardan her biri, görülmekte olan bir davada henüz inceleme sırası gelmemiş yahut ileride açacağı davada ileri süreceği bir vakıanın tespiti amacıyla keşif yapılması, bilirkişi incelemesi yaptırılması ya da tanık ifadelerinin alınması gibi işlemlerin yapılmasını talep edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Delil tespiti istenebilmesi için hukuki yararın varlığı gerekir. Kanunda açıkça öngörülen hâller dışında, delilin hemen tespit edilmemesi hâlinde kaybolacağı yahut ileri sürülmesinin önemli ölçüde zorlaşacağı ihtimal dâhilinde bulunuyorsa hukuki yarar var sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="401" başlık="Görev ve yetki">
        <mvz-fıkra no="1">
          <template>Henüz dava açılmamış olan hâllerde delil tespiti, esas hakkındaki davaya bakacak olan mahkemeden veya üzerinde keşif yahut bilirkişi incelemesi yapılacak olan şeyin bulunduğu veya tanık olarak dinlenilecek kişinin oturduğu yer sulh mahkemesinden istenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Noterlerin, 18/1/1972 tarihli ve 1512 sayılı Noterlik Kanunu uyarınca yapacağı vakıa tespitine ilişkin hükümler saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Esas hakkında açılan davada, delil tespiti yapan mahkemenin yetkisiz ve görevsiz olduğu ileri sürülemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Dava açıldıktan sonra yapılan her türlü delil tespiti talebi hakkında sadece davanın görülmekte olduğu mahkeme yetkili ve görevlidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="402" başlık="Delil tespiti talebi ve karar">
        <mvz-fıkra no="1">
          <template>Delil tespiti talebi dilekçeyle yapılır. Dilekçede tespiti istenen vakıa, tanıklara veya bilirkişilere sorulması istenen sorular, delillerin kaybolacağı veya gösterilmesinde zorlukla karşılaşılacağı kuşkusunu uyandıran sebepler ile aleyhine delil tespiti istenen kişinin ad, soyad ve adresi yer alır. Tespit talebinde bulunan, durum ve koşulların imkân vermemesi nedeniyle, aleyhine tespit yapılacak kişiyi gösteremiyorsa talebi geçerli sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme tarafından belirlenen tespit giderleri avans olarak ödenmedikçe sonraki işlemler yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tespit talebi mahkemece haklı bulunursa karar, dilekçeyle birlikte karşı tarafa tebliğ edilir. Kararda ayrıca, delil tespitinin nasıl ve ne zaman yapılacağı, tespitin icrası esnasında karşı tarafın da hazır bulunabileceği, varsa itiraz ve ilave soruların bir hafta içinde bildirilmesi gerektiği belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Tespitin yapılmasından sonra, tespit tutanağı ve varsa bilirkişi raporunun bir örneği mahkemece karşı tarafa resen tebliğ olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="403" başlık="Acele hâllerde tespit">
        <mvz-fıkra no="1">
          <template>Talep sahibinin haklarının korunması bakımından zorunluluk bulunan hâllerde, karşı tarafa tebligat yapılmaksızın da delil tespiti yapılabilir. Tespitin yapılmasından sonra, tespit dilekçesi, tespit kararı, tespit tutanağı ve varsa bilirkişi raporunun bir örneği mahkemece kendiliğinden diğer tarafa tebliğ olunur. Karşı taraf tebliğden itibaren bir hafta içinde delil tespiti kararına itiraz edebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="404" başlık="Delil tespiti kararında uygulanacak hükümler">
        <mvz-fıkra no="1">
          <template>Tespiti istenen vakıanın hangi delille tespit edileceğine karar verilmişse, bu kararın yerine getirilmesinde o delilin toplanmasına ilişkin hükümler uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="405" başlık="Tutanak ve diğer belgeler">
        <mvz-fıkra no="1">
          <template>Delil tespiti dosyası, asıl dava dosyasının eki sayılır ve onunla birleştirilir. Asıl davanın taraflarından her biri, iddia veya savunmasını ispat için bu tutanak ve raporlara dayanabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="406" başlık="Diğer geçici hukuki korumalar">
        <mvz-fıkra no="1">
          <template>Mahkemece, gerekli hâllerde, mal veya haklarla ilgili defter tutulmasına ya da mühürleme işleminin yapılmasına karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İhtiyati haciz, muhafaza tedbirleri ve geçici düzenleme niteliğindeki kararlar gibi geçici hukuki korumalara ilişkin diğer kanunlarda yer alan özel hükümler saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="11-ONBİRİNCİ" başlık="Tahkim">
    <mvz-madde no="407" başlık="Uygulanma alanı">
      <mvz-fıkra no="1">
        <template>Bu Kısımda yer alan hükümler, 21/6/2001 tarihli ve 4686 sayılı Milletlerarası Tahkim Kanununun tanımladığı anlamda yabancılık unsuru içermeyen ve tahkim yerinin Türkiye olarak belirlendiği uyuşmazlıklar hakkında uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="408" başlık="Tahkime elverişlilik">
      <mvz-fıkra no="1">
        <template>Taşınmaz mallar üzerindeki ayni haklardan veya iki tarafın iradelerine tabi olmayan işlerden kaynaklanan uyuşmazlıklar tahkime elverişli değildir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="409" başlık="İtiraz hakkından feragat">
      <mvz-fıkra no="1">
        <template>Tarafların aksini kararlaştırabilecekleri bir hükme veya tahkim sözleşmesine uyulmaz ise ilgili taraf bu aykırılığa itiraz edebilir. İlgili taraf, aykırılığı öğrendiği tarihten itibaren iki hafta veya hakemlerin bu konuda kararlaştırdıkları süre içinde itiraz etmeden tahkime devam ederse, itiraz hakkından feragat etmiş sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="410" başlık="Tahkimde görevli ve yetkili mahkeme">
      <mvz-fıkra no="1">
        <template>Tahkim yargılamasında, mahkeme tarafından yapılacağı belirtilen işlerde görevli ve yetkili mahkeme, konusuna göre tahkim yeri asliye hukuk veya asliye ticaret mahkemesidir. Tahkim yeri belirlenmemiş ise görevli mahkeme, konusuna göre asliye hukuk veya asliye ticaret mahkemesi, yetkili mahkeme ise davalının Türkiye’deki yerleşim yeri, oturduğu yer veya işyeri mahkemesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="411" başlık="Mahkemenin yardımı">
      <mvz-fıkra no="1">
        <template>Tahkim yargılamasına mahkemelerin yardımı, bu Kısımda açıkça izin verilmiş olan hâllerde mümkündür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="412" başlık="Tahkim sözleşmesinin tanımı ve şekli">
      <mvz-fıkra no="1">
        <template>Tahkim sözleşmesi, tarafların, sözleşme veya sözleşme dışı bir hukuki ilişkiden doğmuş veya doğabilecek uyuşmazlıkların tamamı veya bir kısmının çözümünün hakem veya hakem kuruluna bırakılması hususunda yaptıkları anlaşmadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tahkim sözleşmesi, taraflar arasındaki sözleşmenin bir şartı veya ayrı bir sözleşme şeklinde yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tahkim sözleşmesi yazılı şekilde yapılır. Yazılı şekil şartının yerine getirilmiş sayılması için, tahkim sözleşmesinin taraflarca imzalanmış yazılı bir belgeye veya taraflar arasında teati edilen mektup, telgraf, teleks, faks gibi bir iletişim aracına veya elektronik ortama geçirilmiş olması ya da dava dilekçesinde yazılı bir tahkim sözleşmesinin varlığının iddia edilmesine davalının verdiği cevap dilekçesinde itiraz edilmemiş olması yeterlidir. Asıl sözleşmenin bir parçası hâline getirilmek amacıyla tahkim şartı içeren bir belgeye yollama yapılması hâlinde de tahkim sözleşmesi yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
