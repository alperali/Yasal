        <template>Tahkim sözleşmesine karşı, asıl sözleşmenin geçerli olmadığı veya tahkim sözleşmesinin henüz doğmamış olan bir uyuşmazlığa ilişkin olduğu itirazında bulunulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yargılama sırasında tarafların tahkim yoluna başvurma konusunda anlaşmaları hâlinde, dava dosyası mahkemece ilgili hakem veya hakem kuruluna gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="413" başlık="Tahkim itirazı">
      <mvz-fıkra no="1">
        <template>Tahkim sözleşmesinin konusunu oluşturan bir uyuşmazlığın çözümü için mahkemede dava açılmışsa, karşı taraf tahkim ilk itirazında bulunabilir. Bu durumda tahkim sözleşmesi hükümsüz, tesirsiz veya uygulanması imkânsız değil ise mahkeme tahkim itirazını kabul eder ve davayı usulden reddeder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tahkim itirazının ileri sürülmesi, tahkim yargılamasına engel değildir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="414" başlık="İhtiyati tedbir ve delil tespiti">
      <mvz-fıkra no="1">
        <template>Aksi kararlaştırılmadıkça, tahkim yargılaması sırasında hakem veya hakem kurulu, taraflardan birinin talebi üzerine, bir ihtiyati tedbirin alınmasına veya delil tespitine karar verebilir. Hakem veya hakem kurulu, ihtiyati tedbir kararı vermeyi, uygun bir teminat verilmesine bağlı kılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mahkeme hakem veya hakem kurulunca verilen tedbir kararının, geçerli bir tahkim sözleşmesinin var olması kaydıyla taraflardan birinin talebi üzerine icra edilebilirliğine karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakem veya hakem kurulunun ya da taraflarca görevlendirilecek bir başka kişinin zamanında veya etkin olarak hareket edemeyecek olduğu hâllerde, taraflardan biri ihtiyati tedbir veya delil tespiti için mahkemeye başvurabilir. Bu hâller mevcut değil ise mahkemeye başvuru, sadece hakem veya hakem kurulundan alınacak izne veya tarafların bu konudaki yazılı sözleşmesine dayanılarak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tahkim yargılaması öncesi veya tahkim yargılaması sırasında taraflardan birinin talebi üzerine mahkemece verilen ihtiyati tedbir kararı, aksine karar verilmedikçe, hakem veya hakem kurulu kararının icra edilebilir hâle gelmesiyle ya da davanın hakem veya hakem kurulu tarafından reddedilmesi hâlinde kendiliğinden ortadan kalkar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Mahkemenin verdiği ihtiyati tedbir kararı, hakem veya hakem kurulu tarafından değiştirilebilir veya ortadan kaldırılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="415" başlık="Hakem sayısı">
      <mvz-fıkra no="1">
        <template>Taraflar, hakemin sayısını belirlemekte serbesttir. Ancak, bu sayı tek olmalıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hakemlerin sayısı taraflarca kararlaştırılmamışsa üç hakem seçilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="416" başlık="Hakemlerin seçimi">
      <mvz-fıkra no="1">
        <template>Taraflar, hakem veya hakemlerin seçim usulünü kararlaştırmakta serbesttir. Taraflarca aksi kararlaştırılmamışsa hakem seçiminde aşağıdaki usul uygulanır:</template>
        <mvz-bent no="a">
          <template>Ancak gerçek kişiler hakem seçilebilir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tek hakem seçilecek ise ve taraflar hakem seçiminde anlaşamazlarsa hakem, taraflardan birinin talebi üzerine mahkeme tarafından seçilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Üç hakem seçilecek ise taraflardan her biri bir hakem seçer; bu şekilde seçilen iki hakem üçüncü hakemi belirler. Taraflardan biri, diğer tarafın bu yoldaki talebinin kendisine ulaşmasından itibaren bir ay içinde hakemini seçmezse veya tarafların seçtiği iki hakem seçilmelerinden sonraki bir ay içinde üçüncü hakemi belirlemezlerse, taraflardan birinin talebi üzerine mahkeme tarafından hakem seçimi yapılır. Üçüncü hakem, başkan olarak görev yapar.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Üçten fazla hakem seçilecek ise son hakemi seçecek olan hakemler yukarıdaki bentte belirtilen usule göre taraflarca eşit sayıda belirlenir.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hakemin birden fazla kişiden oluşması hâlinde en az birinin kendi alanında beş yıl ve daha fazla kıdeme sahip bir hukukçu olması şarttır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hakemlerin seçim usulünü kararlaştırmış olmalarına rağmen;</template>
        <mvz-bent no="a">
          <template>Taraflardan biri sözleşmeye uymazsa,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kararlaştırılmış olan usule göre tarafların veya taraflarca seçilen hakemlerin hakem seçimi konusunda birlikte karar vermeleri gerektiği hâlde, taraflar ya da hakemler bu konuda anlaşamazlarsa,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Hakem seçimi ile yetkilendirilen üçüncü kişi, kurum veya kuruluş, hakemi ya da hakem kurulunu seçmezse,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>hakem veya hakem kurulunun seçimi, taraflardan birinin talebi üzerine mahkeme tarafından yapılır. Mahkemenin, gerektiğinde tarafları dinledikten sonra bu fıkra hükümlerine göre verdiği kararlara karşı kanun yoluna başvurulamaz. Mahkeme, hakem seçiminde tarafların sözleşmesini ve hakemlerin bağımsız ve tarafsız olması ilkelerini göz önünde bulundurur. Üçten fazla hakem seçilecek hâllerde de aynı usul uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="417" başlık="Ret sebepleri">
      <mvz-fıkra no="1">
        <template>Kendisine hakemlik önerilen kimse, bu görevi kabul etmeden önce tarafsızlık ve bağımsızlığından şüphe edilmeyi haklı gösteren durum ve koşulları açıklamak zorundadır. Taraflar önceden bilgilendirilmemiş oldukları takdirde hakem, daha sonra ortaya çıkan durumları da gecikmeksizin taraflara bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hakem, taraflarca kararlaştırılan niteliklere sahip olmadığı, taraflarca kararlaştırılan tahkim usulünde öngörülen bir ret sebebi mevcut bulunduğu veya tarafsızlığından şüphe edilmeyi haklı gösteren durum ve koşullar gerçekleştiği takdirde reddedilebilir. Taraflardan birisinin kendisinin atadığı veya atanmasına katıldığı hakemi reddetmesi, yalnızca hakemin atanma tarihinden sonra öğrenilen ret sebeplerine dayanılarak yapılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="418" başlık="Hakemin reddi usulü">
      <mvz-fıkra no="1">
        <template>Taraflar, hakemin reddi usulünü serbestçe kararlaştırabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hakemi reddetmek isteyen taraf, hakemin veya hakem kurulunun seçiminden ya da hakemin reddi talebinde bulunabileceği bir durumun ortaya çıktığını öğrendiği tarihten itibaren iki hafta içinde ret talebinde bulunabilir ve bu talebini karşı tarafa yazılı olarak bildirir. Reddedilen hakem kendiliğinden çekilmez veya diğer taraf reddi kabul etmez ise ret hakkında, hakem kurulunca karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakem kurulundan bir veya birden çok hakemin reddini isteyen taraf, ret talebini ve gerekçesini hakem kuruluna bildirir. Ret talebinin kabul edilmediğini öğrenen taraf, bu tarihten itibaren karara karşı bir ay içinde mahkemeye başvurarak bu kararın kaldırılmasını ve hakem veya hakemlerin reddine ilişkin talep hakkında karar verilmesini isteyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Seçilen hakemin veya hakem kurulunun tümünün ya da karar çoğunluğunu ortadan kaldıracak sayıda hakemin reddi için ancak mahkemeye başvurulabilir. Mahkemenin bu fıkra uyarınca vereceği kararlara karşı kanun yoluna başvurulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Seçilen hakemin veya hakem kurulunun tümünün ya da karar çoğunluğunu ortadan kaldıracak sayıda hakemin ret talebini mahkemenin kabul etmesi hâlinde tahkim sona erer. Ancak tahkim sözleşmesinde hakem veya hakemlerin isimleri belirlenmemişse yeniden hakem seçimi yoluna gidilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="419" başlık="Hakemlerin sorumluluğu">
      <mvz-fıkra no="1">
        <template>Taraflarca aksi kararlaştırılmamışsa, tahkim yargılamasında görevi kabul eden hakem, haklı bir neden olmaksızın görevini yerine getirmekten kaçındığı takdirde, tarafların bu nedenle uğradığı zararı gidermekle yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="420" başlık="Görevin yerine getirilememesi">
      <mvz-fıkra no="1">
        <template>Bir hakem, hukuki veya fiilî sebeplerle görevini hiç ya da zamanında yerine getiremediği takdirde hakemlik görevi, çekilme veya tarafların bu yönde anlaşmaları suretiyle sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflardan her biri, hakemin çekilmesini gerektiren sebeplerin varlığı konusunda aralarında uyuşmazlık olursa, mahkemeden hakemin yetkisinin sona erdirilmesi konusunda karar verilmesini isteyebilir. Mahkemenin vereceği karar kesindir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakemin görevinden çekilmesi veya diğer tarafın hakemin yetkisinin sona ermesine muvafakat etmesi, hakemin ret sebeplerinin varlığının kabulü anlamına gelmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="421" başlık="Yeni hakem seçilmesi">
      <mvz-fıkra no="1">
        <template>Hakemlerden birinin görevi herhangi bir sebeple sona ererse, onun yerine seçimindeki usul uygulanarak yeni bir hakem seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir veya birden çok hakemin değiştirilmesi için geçen süre tahkim süresinden sayılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tahkim sözleşmesinde hakemin veya hakem kurulunu oluşturan hakemlerin ad ve soyadları belirtilmiş ise hakemin, hakem kurulunun ya da kurulun karar çoğunluğunu ortadan kaldıracak sayıda hakemin görevinin herhangi bir sebeple sona ermesi hâlinde, tahkim de sona erer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="422" başlık="Hakemin kendi yetkisi hakkında karar vermesi">
      <mvz-fıkra no="1">
        <template>Hakem veya hakem kurulu, tahkim sözleşmesinin mevcut veya geçerli olup olmadığına ilişkin itirazlar da dâhil olmak üzere, kendi yetkisi hakkında karar verebilir. Bu karar verilirken, bir sözleşmede yer alan tahkim şartı, sözleşmenin diğer hükümlerinden bağımsız olarak değerlendirilir. Hakem veya hakem kurulunun asıl sözleşmenin hükümsüzlüğüne karar vermesi, tahkim sözleşmesinin kendiliğinden hükümsüzlüğü sonucunu doğurmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hakem veya hakem kurulunun yetkisizliğine ilişkin itiraz, en geç cevap dilekçesinde yapılır. Tarafların hakemleri bizzat seçmiş veya hakem seçimine katılmış olmaları, hakem veya hakem kurulunun yetkisine itiraz etme haklarını ortadan kaldırmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakem veya hakem kurulunun yetkisini aştığına ilişkin itiraz derhâl ileri sürülmelidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hakem veya hakem kurulu, yukarıda belirtilen her iki hâlde de gecikmenin haklı sebebe dayandığı sonucuna varırsa, süresinde ileri sürülmeyen itirazı kabul edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Hakem veya hakem kurulu, yetkisizlik itirazını, ön sorun şeklinde inceler ve karara bağlar; yetkili olduğuna karar verirse, tahkim yargılamasını sürdürür ve davayı karara bağlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="423" başlık="Tarafların eşitliği ve hukuki dinlenilme hakkı">
      <mvz-fıkra no="1">
        <template>Taraflar, tahkim yargılamasında eşit hak ve yetkiye sahiptirler. Taraflara hukuki dinlenilme hakkını kullanma imkânı tanınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="424" başlık="Yargılama usulünün belirlenmesi">
      <mvz-fıkra no="1">
        <template>Taraflar, hakem veya hakem kurulunun uygulayacağı yargılama usulüne ilişkin kuralları, bu Kısmın emredici hükümleri saklı kalmak kaydıyla, serbestçe kararlaştırabilir ya da tahkim kurallarına yollama yaparak belirleyebilirler. Taraflar arasında böyle bir sözleşme yoksa hakem veya hakem kurulu, tahkim yargılamasını, bu Kısmın hükümlerini gözeterek uygun bulduğu bir şekilde yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="425" başlık="Tahkim yeri">
      <mvz-fıkra no="1">
        <template>Tahkim yeri, taraflarca veya onların seçtiği bir tahkim kurumunca serbestçe kararlaştırılır. Bu konuda bir anlaşma yoksa tahkim yeri, hakem veya hakem kurulunca olayın özelliklerine göre belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hakem veya hakem kurulu, tahkim yargılamasının gerektirdiği durumlarda önceden taraflara bildirmek kaydıyla bir başka yerde de toplanabilir; duruşma, keşif gibi benzeri işlemleri de yapabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="426" başlık="Dava tarihi">
      <mvz-fıkra no="1">
        <template>Taraflar aksini kararlaştırmadıkça tahkim davası, hakemlerin seçimi için mahkemeye veya tarafların sözleşmesine göre hakem seçecek olan kişi, kurum veya kuruluşa başvurulduğu ve eğer sözleşmeye göre hakemlerin seçimi iki tarafa ait ise davacının hakemini seçip kendi hakemini seçmesini diğer tarafa bildirdiği; sözleşmede hakem veya hakem kurulunu oluşturan hakemlerin ad ve soyadları belirtilmiş ise uyuşmazlığın tahkim yoluyla çözülmesi talebinin karşı tarafça alındığı tarihte açılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflardan biri, mahkemeden ihtiyati tedbir veya ihtiyati haciz kararı almış ise iki hafta içinde tahkim davasını açmak zorundadır. Aksi hâlde ihtiyati tedbir veya ihtiyati haciz kendiliğinden ortadan kalkar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="427" başlık="Tahkim süresi">
      <mvz-fıkra no="1">
        <template>Taraflar aksini kararlaştırmadıkça, bir hakemin görev yapacağı davalarda hakemin seçildiği, birden çok hakemin görev yapacağı davalarda ise hakem kurulunun ilk toplantı tutanağının düzenlendiği tarihten itibaren bir yıl içinde, hakem veya hakem kurulunca esas hakkında karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tahkim süresi, tarafların anlaşmasıyla; anlaşamamaları hâlinde ise taraflardan birinin başvurusu üzerine mahkemece uzatılabilir. Mahkemenin, bu konudaki kararı kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="428" başlık="Dava ve cevap dilekçesi">
      <mvz-fıkra no="1">
        <template>Taraflarca kararlaştırılan veya hakem tarafından belirlenecek süre içinde, davacı tahkim şartını veya sözleşmesiyle birlikte varsa esas sözleşme ile iddiasını dayandırdığı vakıaları ve talebini; davalı ise savunmasını ve dayandığı vakıaları dilekçeyle hakem veya hakem kuruluna sunar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflar dilekçelerine yazılı delillerini ekleyebilir ve ileride sunacakları delilleri gösterebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Taraflar, aksini kararlaştırmış olmadıkça, tahkim yargılaması sırasında iddia veya savunmalarını değiştirebilir veya genişletebilirler. Ancak, hakem veya hakem kurulu, bu işlemin gecikerek yapılmış olduğunu veya diğer taraf için haksız bir şekilde büyük zorluk yarattığını ve diğer durum ve koşulları dikkate alarak, böyle bir değişiklik veya genişletmeye izin vermeyebilir. İddia veya savunma tahkim sözleşmesinin kapsamı dışına çıkacak şekilde değiştirilemez veya genişletilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="429" başlık="Duruşma yapılması veya dosya üzerinden inceleme">
      <mvz-fıkra no="1">
        <template>Hakem veya hakem kurulu, delillerin ikamesi, sözlü beyanlarda bulunulması veya bilirkişiden açıklama istenmesi gibi sebeplerle duruşma yapılmasına karar verebileceği gibi; yargılamanın dosya üzerinden yürütülmesine de karar verebilir. Taraflar, aksini kararlaştırmadıkça, hakem veya hakem kurulu, taraflardan birinin talebi üzerine yargılamanın uygun aşamasında duruşma yapılmasına karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hakem veya hakem kurulu, dava ile ilgili her türlü keşif tarihini, bilirkişi incelemesini veya diğer delillerin incelenmesi için yapacağı toplantı ve duruşmalar ile tarafların gelmemeleri hâlinde bunun sonuçlarını uygun bir süre önce taraflara bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakem veya hakem kuruluna verilen dilekçeler, bilgiler ve diğer belgeler taraflara bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="430" başlık="Taraflardan birinin yargılamaya katılmaması">
      <mvz-fıkra no="1">
        <template>Taraflardan birinin yargılamaya katılmaması hâlinde aşağıdaki hükümler uygulanır:</template>
        <mvz-bent no="a">
          <template>Davacı, geçerli bir neden göstermeksizin dava dilekçesini süresi içinde vermezse; dava dilekçesi usulüne uygun değilse ve eksiklik hakem veya hakem kurulunca belirlenecek süre içinde giderilmezse, hakem veya hakem kurulu tahkim yargılamasına son verir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Davalı, cevap dilekçesini vermezse; bu durum davacının iddialarının ikrarı veya davanın kabulü olarak değerlendirilmeyip yargılamaya devam edilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Taraflardan biri, geçerli bir neden göstermeksizin duruşmaya katılmaz veya delillerini sunmaktan kaçınırsa; hakem veya hakem kurulu, tahkim yargılamasına devam ederek mevcut delillere göre karar verebilir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="431" başlık="Hakem veya hakem kurulunca bilirkişi seçimi">
      <mvz-fıkra no="1">
        <template>Hakem veya hakem kurulu;</template>
        <mvz-bent no="a">
          <template>Belirlediği konular hakkında rapor vermek üzere bir veya birden çok bilirkişi seçimine,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tarafların bilirkişiye gerekli açıklamaları yapmalarına, ilgili belge ve bilgileri vermelerine,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Keşif yapılmasına,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aksi kararlaştırılmadıkça, taraflardan birinin talebi veya hakem ya da hakem kurulunun gerekli görmesi üzerine bilirkişiler, yazılı veya sözlü raporlarını vermelerinden sonra çağrılacakları duruşmaya katılırlar. Bu duruşmada taraflar, bilirkişilere soru sorabilir ve uyuşmazlık konusunda kendi seçtikleri özel bilirkişileri dinletebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="432" başlık="Delillerin toplanması">
      <mvz-fıkra no="1">
        <template>Taraflardan biri, hakem veya hakem kurulunun onayı ile delillerin toplanmasında mahkemeden yardım isteyebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="433" başlık="Hakem kurulunun karar vermesi">
      <mvz-fıkra no="1">
        <template>Taraflarca aksi kararlaştırılmamışsa, hakem kurulu oy çokluğuyla da karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflar veya hakem kurulunun diğer üyeleri yetki vermişlerse, hakem kurulu başkanı, yargılama usulü ile ilgili belirli konularda tek başına karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakem veya hakem kurulu, ancak tarafların açıkça yetkili kılmış olmaları şartıyla hakkaniyet ve nasafet kurallarına göre veya dostane çözüm yoluyla karar verebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="434" başlık="Sulh">
      <mvz-fıkra no="1">
        <template>Tahkim yargılaması sırasında taraflar uyuşmazlık konusunda sulh olurlarsa, tahkim yargılamasına son verilir. Tarafların talebi, ahlâka veya kamu düzenine aykırı değilse ya da tahkime elverişli olan bir konuya ilişkin ise sulh, hakem kararı olarak tespit edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="435" başlık="Tahkim yargılamasının sona ermesi">
      <mvz-fıkra no="1">
        <template>Tahkim yargılaması, nihai hakem kararının verilmesi veya aşağıdaki hâllerden birinin gerçekleşmesi ile sona erer:</template>
        <mvz-bent no="a">
          <template>Davalının itirazı üzerine hakem veya hakem kurulunun uyuşmazlığın kesin olarak çözümünde davalının hukuki yararı bulunduğunu kabul etmesi hâli hariç, davacı davasını geri alırsa.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Taraflar, yargılamanın sona erdirilmesi konusunda anlaşırlarsa.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Hakem veya hakem kurulu, başka bir sebeple yargılamanın sürdürülmesini gereksiz veya imkânsız bulursa.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>427 nci maddenin ikinci fıkrası uyarınca tahkim süresinin uzatılmasına ilişkin talep mahkemece reddedilirse.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Taraflarca kararın oybirliğiyle verilmesinin öngörülmesine rağmen, hakem kurulu oybirliğiyle karar veremezse.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>442 nci maddenin ikinci fıkrası uyarınca yargılama giderleri için avans yatırılmazsa.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>437 nci madde hükmü saklı kalmak üzere, hakem veya hakem kurulunun yetkisi, yargılamanın sona ermesiyle ortadan kalkar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="436" başlık="Hakem kararının şekli, içeriği ve saklanması">
      <mvz-fıkra no="1">
        <template>Hakem kararlarında;</template>
        <mvz-bent no="a">
          <template>Kararı veren hakem veya hakem kurulu üyelerinin ad ve soyadları,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tarafların ve varsa temsilcileri ile vekillerinin ad ve soyadları, unvanları ve adresleri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kararın dayandığı hukuki sebepler ile gerekçesi,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bir sıra numarası altında açık ve kesin bir biçimde taraflara yüklenen hak ve borçlar ile yargılama giderleri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Karara karşı iptal davası açılabileceği ve süresi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Tahkim yeri ve kararın tarihi,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kararı veren hakem veya hakem kurulu üyelerinin tamamı veya çoğunluğunun imzaları ve karara eklenmiş ise karşı oy yazısı,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aksi kararlaştırılmadıkça, hakem veya hakem kurulu kısmi kararlar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakem kararı; hakem, hakem kurulu başkanı veya ilgili tahkim kurumu tarafından taraflara bildirilir. Ayrıca kararın aslı dosya ile birlikte mahkemeye gönderilir ve mahkemece saklanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="437" başlık="Hakem kararının tavzihi, düzeltilmesi ve tamamlanması">
      <mvz-fıkra no="1">
        <template>Evvelce daha farklı bir süre öngörülmemişse, taraflardan her biri, hakem kararının kendisine bildirilmesinden itibaren iki hafta içinde, karşı tarafa da bilgi vermek kaydıyla, hakem veya hakem kuruluna başvurarak;</template>
        <mvz-bent no="a">
          <template>Hakem kararında bulunan hesap, yazı ve benzeri maddi hataların düzeltilmesini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Karara ilişkin belirli bir konunun veya kararın bir bölümünün tavzihini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>isteyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Karşı tarafın görüşünü alan hakem veya hakem kurulu, bu talebi haklı bulursa, talep tarihinden itibaren bir ay içinde kararındaki maddi hatayı düzeltir veya kararın tavzihini yapar. İcap ederse, bu süre hakem veya hakem kurulunca uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakem veya hakem kurulu, karardaki maddi hataları karar tarihini izleyen iki hafta içinde kendiliğinden de düzeltebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Taraflardan her biri, hakem kararının kendilerine bildirilmesinden itibaren bir ay içinde, karşı tarafa da bilgi vermek kaydıyla, yargılama sırasında ileri sürülmüş olmasına rağmen karara bağlanmamış konularda tamamlayıcı hakem kararı verilmesini isteyebilir. Hakem veya hakem kurulu, talebi haklı bulursa, tamamlayıcı hakem kararını bir ay içinde verir. İcap ederse, bu süre hakem veya hakem kurulunca en fazla bir ay uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Düzeltme, tavzih ve tamamlama kararları, taraflara bildirilir ve hakem kararının bir parçasını oluşturur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="438" başlık="Tebligat">
      <mvz-fıkra no="1">
        <template>Taraflarca aksi kararlaştırılmadıkça tebligat, 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümlerine göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="439" başlık="İptal davası">
      <mvz-fıkra no="1">
        <template>Hakem kararına karşı yalnızca iptal davası açılabilir. İptal davası, tahkim yeri bölge adliye mahkemesinde açılır; öncelikle ve ivedilikle görülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template></template>
        <mvz-bent no="a">
          <template>Tahkim sözleşmesinin taraflarından birinin ehliyetsiz ya da tahkim sözleşmesinin geçersiz olduğu,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Hakem veya hakem kurulunun seçiminde, sözleşmede belirlenen veya bu Kısımda öngörülen usule uyulmadığı,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kararın, tahkim süresi içinde verilmediği,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Hakem veya hakem kurulunun, hukuka aykırı olarak yetkili veya yetkisiz olduğuna karar verdiği,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hakem veya hakem kurulunun, tahkim sözleşmesi dışında kalan bir konuda karar verdiği veya talebin tamamı hakkında karar vermediği ya da yetkisini aştığı,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Tahkim yargılamasının, usul açısından sözleşmede veya bu yönde bir sözleşme bulunmaması hâlinde, bu Kısımda yer alan hükümlere uygun olarak yürütülmediği ve bu durumun kararın esasına etkili olduğu,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Tarafların eşitliği ilkesi ve hukuki dinlenilme hakkına riayet edilmediği,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Hakem veya hakem kurulu kararına konu uyuşmazlığın Türk hukukuna göre tahkime elverişli olmadığı,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Kararın kamu düzenine aykırı olduğu,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>tespit edilirse, hakem kararları iptal edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakem veya hakem kurulunun, tahkim sözleşmesi dışında kalan bir konuda karar verdiği iddiasıyla açılan iptal davasında, tahkim sözleşmesi kapsamında olan konuların, tahkim sözleşmesi kapsamında olmayan konulardan ayrılması mümkün olduğu takdirde, hakem kararının sadece tahkim sözleşmesi kapsamında olmayan konuları içeren bölümü iptal edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İptal davası, bir ay içinde açılabilir. Bu süre, hakem kararının veya tavzih, düzeltme ya da tamamlama kararının taraflara bildirildiği tarihten itibaren işlemeye başlar. Hakem kararına karşı iptal davası açılması kararın icrasını durdurmaz. Ancak taraflardan birinin talebi üzerine hükmolunan para veya eşyanın değerini karşılayacak bir teminat gösterilmek şartı ile kararın icrası durdurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İptal talebi, davaya bakan bölge adliye mahkemesi aksine karar vermedikçe, dosya üzerinden incelenerek karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İptal davası hakkında verilen kararlara karşı temyiz yoluna başvurulabilir. Temyiz incelemesi, bu maddede yer alan iptal sebepleriyle sınırlı olarak, öncelikle ve ivedilikle karara bağlanır. Temyiz, kararın icrasını durdurmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İptal davasının kabulü hâlinde, kabul kararı temyiz edilmezse veya ikinci fıkranın (b), (c), (ç), (d), (e) ve (f) bentlerindeki hâllerin varlığı sebebiyle kabulü hâlinde, taraflar aksini kararlaştırmamışlarsa hakemleri ve tahkim süresini yeniden belirleyebilirler. Taraflar isterlerse eski hakemleri tayin edebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="440" başlık="Hakem ücreti">
      <mvz-fıkra no="1">
        <template>Taraflarca aksi kararlaştırılmamışsa, hakemlerin ücreti, dava konusu alacağın miktarı, uyuşmazlığın niteliği ve tahkim yargılamasının süresi dikkate alınarak, hakem veya hakem kurulu ile taraflar arasında kararlaştırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflar, hakem veya hakem kurulunun ücretini yerleşmiş kurallara veya kurumsal tahkim kurallarına yollama yaparak da belirleyebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Taraflarla hakem veya hakem kurulu arasında ücretin belirlenmesi konusunda anlaşmaya varılamaz veya tahkim sözleşmesinde ücretin belirlenmesine ilişkin herhangi bir hüküm bulunmazsa ya da taraflarca bu konuda yerleşmiş kurallara veya kurumsal tahkim kurallarına yollama yapılmamışsa, hakem veya hakem kurulunun ücreti, her yıl Adalet Bakanlığınca ilgili kamu kurumu niteliğindeki meslek kuruluşlarının görüşleri alınarak hazırlanan ücret tarifesine göre belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Taraflarca aksi kararlaştırılmadıkça başkanın ücreti, hakemlerden her birine ödenecek hakem ücretinin yüzde on fazlası olarak hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Aksi kararlaştırılmadıkça hakem kararının düzeltilmesi, yorumlanması veya tamamlanması hâllerinde ek hakem ücreti ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Hakem veya hakem kurulu kararında tahkim yargılamasının giderleri gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="441" başlık="Yargılama giderleri">
      <mvz-fıkra no="1">
        <template>Yargılama giderleri;</template>
        <mvz-bent no="a">
          <template>Hakemlerin ve hakemlerce belirlenen hakem sekreterliği ücretini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Hakemlerin seyahat giderlerini ve yaptıkları diğer masrafları,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Hakem veya hakem kurulu tarafından atanan bilirkişilere ve yardımına başvurulan diğer kişilere ödenen ücretleri ve keşif giderlerini,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Hakem veya hakem kurulunun onayladığı ölçüde tanıkların seyahat giderlerini ve yaptıkları diğer masrafları,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hakem veya hakem kurulunun, davayı kazanan tarafın varsa vekili için avukatlık asgari ücret tarifesine göre takdir ettiği vekâlet ücretini,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bu Kanuna göre mahkemelere yapılacak başvurularda alınan yargı harçlarını,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Tahkim yargılamasına ilişkin tebligat giderlerini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="442" başlık="Avans yatırılması ve giderlerin ödenmesi">
      <mvz-fıkra no="1">
        <template>Hakem veya hakem kurulu, tarafların her birinden yargılama giderleri için gereken hâllerde avans yatırılmasını isteyebilir. Aksi kararlaştırılmadıkça, bu avans taraflarca eşit miktarda ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avans, hakem veya hakem kurulu kararında öngörülen süre içinde ödenmemişse hakem veya hakem kurulu yargılamayı durdurabilir. Yargılamanın durdurulduğunun taraflara bildirilmesinden itibaren bir ay içinde avans ödenirse yargılamaya devam olunur; aksi hâlde tahkim yargılaması sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakem veya hakem kurulu, kararını verdikten sonra taraflara, yatırılmış olan avansların harcama yerlerini ve miktarlarını gösterir bir belge verir ve varsa kalan avansı ödeyene iade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Taraflar aksini kararlaştırmadıkça yargılama giderleri haksız çıkan tarafa yüklenir. Davada her iki taraf da kısmen haklı çıkarsa, yargılama giderleri haklılık durumuna göre taraflar arasında paylaştırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Hakem veya hakem kurulunun yargılamayı sona erdiren veya taraflar arasındaki sulhü tespit eden kararında da yargılama giderleri gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="443" başlık="Yargılamanın iadesi">
      <mvz-fıkra no="1">
        <template>Yargılamanın iadesine ilişkin yukarıdaki Sekizinci Kısmın Üçüncü Bölümü hükümleri, niteliğine uygun düştüğü şekilde tahkime de uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tahkimde, yargılamanın iadesi sebeplerinden sadece 375 inci maddenin birinci fıkrasının (b), (c), (e), (f), (g), (h), (ı) ve (i) bentleri uygulanır. Yargılamanın iadesi davası mahkemede görülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yargılamanın iadesi talebi kabul edilirse mahkeme, hakem kararını iptal eder ve uyuşmazlığı yeniden bir karar verilebilmesi için yeni hakeme veya hakem kuruluna gönderir. Bu durumda hakem veya hakem kurulu 421 inci maddeye göre yeniden seçilir veya oluşturulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="444" başlık="Uygulanmayacak hükümler">
      <mvz-fıkra no="1">
        <template>Bu Kısımda düzenlenen konularda, aksine hüküm bulunmadıkça bu Kanunun diğer hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="12-ONİKİNCİ" başlık="Son Hükümler">
    <mvz-madde no="445" başlık="Elektronik işlemler">
      <mvz-fıkra no="1">
        <template>Ulusal Yargı Ağı Bilişim Sistemi , adalet hizmetlerinin elektronik ortamda yürütülmesi amacıyla oluşturulan bilişim sistemidir. Dava ve diğer yargılama işlemlerinin elektronik ortamda gerçekleştirildiği hâllerde UYAP kullanılarak veriler kaydedilir ve saklanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Elektronik ortamda, güvenli elektronik imza kullanılarak dava açılabilir, harç ve avans ödenebilir, dava dosyaları incelenebilir. Bu Kanun kapsamında fizikî olarak hazırlanması öngörülen tutanak ve belgeler güvenli elektronik imzayla elektronik ortamda hazırlanabilir ve gönderilebilir. Güvenli elektronik imza ile oluşturulan tutanak ve belgeler ayrıca fizikî olarak gönderilmez, belge örneği aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Elektronik ortamdan fizikî örnek çıkartılması gereken hâllerde tutanak veya belgenin aslının aynı olduğu belirtilerek hâkim veya görevlendirdiği yazı işleri müdürü tarafından imzalanır ve mühürlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Elektronik ortamda yapılan işlemlerde süre gün sonunda biter.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Mahkemelerde görülmekte olan dava, çekişmesiz yargı, geçici hukuki koruma ve diğer tüm işlemlerde UYAP’ın kullanılmasına dair usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="446" başlık="Disiplin para cezası">
      <mvz-fıkra no="1">
        <template>Bu Kanun anlamında disiplin para cezasından maksat, yargılamanın düzenli bir biçimde işleyişini sağlamak ve kamu düzenini korumak amacıyla verilen, verildiği anda kesin olan ve derhâl infazı gereken para cezasıdır. Bu ceza, seçenek yaptırımlara çevrilemez ve adli sicil kayıtlarında yer almaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Disiplin para cezası, 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre tahsil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="447" başlık="Diğer kanunlardaki yargılama usulü ile ilgili hükümler">
      <mvz-fıkra no="1">
        <template>Diğer kanunların sözlü yahut seri yargılama usulüne atıf yaptığı hâllerde, bu Kanunun basit yargılama usulü ile ilgili hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mevzuatta, yürürlükten kaldırılan 18/6/1927 tarihli ve 1086 sayılı Hukuk Usulü Muhakemeleri Kanununa yapılan yollamalar, Hukuk Muhakemeleri Kanununun bu hükümlerin karşılığını oluşturan maddelerine yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="448" başlık="Zaman bakımından uygulanma">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümleri, tamamlanmış işlemleri etkilememek kaydıyla derhâl uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="449" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasıyla ilgili yönetmelikler, Adalet Bakanlığı tarafından Kanunun yürürlüğe girdiği tarihten itibaren altı ay içinde çıkarılır. Yeni yönetmelikler çıkarılıncaya kadar, mevcut yönetmeliklerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="450" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>18/6/1927 tarihli ve 1086 sayılı Hukuk Usulü Muhakemeleri Kanunu ek ve değişiklikleri ile birlikte tümüyle yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Parasal sınırların artırılması" tür="EK">
      <mvz-fıkra no="1">
        <template>200 üncü, 201 inci, 341 inci, 362 nci ve 369 uncu maddelerdeki parasal sınırlar her takvim yılı başından geçerli olmak üzere, önceki yılda uygulanan parasal sınırların; o yıl için 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi hükümleri uyarınca Maliye Bakanlığınca her yıl tespit ve ilan edilen yeniden değerleme oranında artırılması suretiyle uygulanır. Bu şekilde belirlenen sınırların bin Türk lirasını aşmayan kısımları dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>200 üncü ve 201 inci maddelerdeki parasal sınırların uygulanmasında hukuki işlemin yapıldığı, 341 inci, 362 nci ve 369 uncu maddelerdeki parasal sınırların uygulanmasında davanın açıldığı tarihteki miktar esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3" durum="mülga">
        <template></template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yargı yolu ve göreve ilişkin hükümleri, Kanunun yürürlüğe girmesinden önceki tarihte açılmış olan davalarda uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun, senetle ispat, istinaf ve temyiz ile temyizde duruşma yapılmasına ilişkin parasal sınırlarla ilgili hükümleri Kanunun yürürlüğe girmesinden önceki tarihte açılmış olan dava ve işlerde uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>1086 sayılı Kanunun yürürlükte olduğu dönemde usulüne uygun olarak düzenlenmiş bulunan senetler, bu Kanunun yürürlüğe girdiği tarihten sonra da geçerliliklerini korur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bölge adliye mahkemelerinin, 26/9/2004 tarihli ve 5235 sayılı Adli Yargı İlk Derece Mahkemeleri ile Bölge Adliye Mahkemelerinin Kuruluş, Görev ve Yetkileri Hakkında Kanunun geçici 2 nci maddesi uyarınca Resmî Gazete’de ilan edilecek göreve başlama tarihine kadar, 1086 sayılı Kanunun temyize ilişkin yürürlükteki hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bölge adliye mahkemelerinin göreve başlama tarihinden önce verilen kararlar hakkında, kesinleşinceye kadar 1086 sayılı Kanunun 26/9/2004 tarihli ve 5236 sayılı Kanunla yapılan değişiklikten önceki 427 ilâ 444 üncü madde hükümlerinin uygulanmasına devam olunur.  Bu kararlara ilişkin dosyalar bölge adliye mahkemelerine gönderilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda bölge adliye mahkemelerine görev verilen hallerde bu mahkemelerin göreve başlama tarihine kadar 1086 sayılı Kanunun bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bölge adliye mahkemelerinin göreve başlama tarihinden önce verilen kararlarla ilgili Yargıtay hukuk daireleri tarafından verilen bozma kararları üzerine mahkemelerce verilen direnme kararları, kararına direnilen daireye gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddeyi ihdas eden Kanunun yürürlüğe girdiği tarih itibarıyla Yargıtay Hukuk Genel Kurulunda bulunan dosyalar, kararına direnilen daireye gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddeyi ihdas eden Kanunun yürürlüğe girdiği tarih itibarıyla Yargıtay Hukuk Genel Kurulunda bulunan ve 30/1/1950 tarihli ve 5521 sayılı İş Mahkemeleri Kanununun geçici 2 nci maddesi uyarınca ilgili daire tarafından incelenen dosyalar, kararına direnilen daireye yeniden gönderilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Daire, mümkün olan en kısa sürede direnme kararını inceler ve yerinde görürse kararını düzeltir; görmezse dosyayı Yargıtay Hukuk Genel Kuruluna gönderir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="451" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun 1/10/2011 tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="452" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
