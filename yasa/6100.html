          <template>Taraflar, kendilerinin veya karşı tarafın delil olarak dayandıkları ve ellerinde bulunan tüm belgeleri mahkemeye ibraz etmek zorundadırlar. Elektronik belgeler ise belgenin çıktısı alınarak ve talep edildiğinde incelemeye elverişli şekilde elektronik ortama kaydedilerek mahkemeye ibraz edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ticari defterler gibi devamlı kullanılan belgelerin sadece ilgili kısımlarının onaylı örnekleri mahkemeye ibraz edilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="220" başlık="Tarafın belgeyi ibraz etmemesi">
        <mvz-fıkra no="1">
          <template>İbrazı istenen belgenin, ileri sürülen hususun ispatı için zorunlu ve bu isteğin kanuna uygun olduğuna mahkemece kanaat getirildiği ve karşı taraf da bu belgenin elinde olduğunu ikrar ettiği veya ileri sürülen talep üzerine sükut ettiği yahut belgenin var olduğu resmî bir kayıtla anlaşıldığı veya başka bir belgede ikrar olunduğu takdirde, mahkeme bu belgenin ibrazı için kesin bir süre verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkemece, ibrazı istenen belgenin elinde bulunduğunu inkâr eden tarafa, böyle bir belgenin elinde bulunmadığına, özenle aradığı hâlde bulamadığına ve nerede olduğunu da bilmediğine ilişkin yemin teklif edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belgeyi ibraz etmesine karar verilen taraf, kendisine verilen sürede belgeyi ibraz etmez ve aynı sürede, delilleriyle birlikte ibraz etmemesi hakkında kabul edilebilir bir mazeret göstermez ya da belgenin elinde bulunduğunu inkâr eder ve teklif edilen yemini kabul veya icra etmezse, mahkeme, duruma göre belgenin içeriği konusunda diğer tarafın beyanını kabul edebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="221" başlık="Üçüncü kişinin belgeyi ibraz etmemesi">
        <mvz-fıkra no="1">
          <template>Mahkeme, üçüncü kişi veya kurumun elinde bulunan bir belgenin taraflarca ileri sürülen hususun ispatı için zorunlu olduğuna karar verirse, bu belgenin ibrazını emreder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belgeyi ibraz etmesine karar verilen herkes, elindeki belgeyi ibraz etmek; belgeyi ibraz edememesi hâlinde ise bunun sebebini delilleri ile birlikte açıklamak zorundadır. Mahkeme yapılan açıklamayı yeterli görmezse, bu kimseyi tanık olarak dinleyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belgeyi ibraz zorunda olanlar, tanıklıktan çekinmeye ilişkin hükümlere göre, belgeyi ibrazdan veya bu konudaki tanıklıktan çekinebilirler. Belgeyi ibraz veya bu konuda tanıklık yapmak zorunda olanlar hakkında, tanıklara ilişkin hükümler uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="222" başlık="Ticari defterlerin ibrazı ve delil olması">
        <mvz-fıkra no="1">
          <template>Mahkeme, ticari davalarda tarafların ticari defterlerinin ibrazına kendiliğinden veya taraflardan birinin talebi üzerine karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ticari defterlerin, ticari davalarda delil olarak kabul edilebilmesi için, kanuna göre eksiksiz ve usulüne uygun olarak tutulmuş, açılış ve kapanış onayları yaptırılmış ve defter kayıtlarının birbirini doğrulamış olması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İkinci fıkrada belirtilen şartlara uygun olarak tutulan ticari defter kayıtlarının sahibi ve halefleri lehine delil olarak kabul edilebilmesi için, diğer tarafın aynı şartlara uygun olarak tutulmuş ticari defterlerindeki kayıtların bunlara aykırı olmaması veya diğer tarafın ticari defterlerini ibraz etmemesi yahut defter kayıtlarının aksinin senet veya diğer kesin delillerle ispatlanmamış olması gerekir.  Diğer tarafın ikinci fıkrada yazılan şartlara uygun olarak tutulan ticari defterlerinin, ilgili hususta hiçbir kayıt içermemesi hâlinde ticari defterler, sahibi lehine delil olarak kullanılamaz. Bu şartlara uygun olarak tutulan defterlerdeki sahibi lehine ve aleyhine olan kayıtlar birbirinden ayrılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Açılış veya kapanış onayları bulunmayan ve içerdiği kayıtlar birbirini doğrulamayan ticari defter kayıtları, sahibi aleyhine delil olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Taraflardan biri tacir olmasa dahi, tacir olan diğer tarafın ticari defterlerindeki kayıtları kabul edeceğini belirtir; ancak, karşı taraf defterlerini ibrazdan kaçınırsa, ibrazı talep eden taraf iddiasını ispat etmiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="223" başlık="Yabancı dilde yazılmış belgeler">
        <mvz-fıkra no="1">
          <template>Yabancı dilde yazılmış belgeye dayanan taraf, tercümesini de mahkemeye sunmak zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme kendiliğinden veya diğer tarafın talebi üzerine, belgenin resmî tercümesini de isteyebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="224" başlık="Yabancı resmî belgelerin yetkili makamlar tarafından onaylanması zorunluluğu">
        <mvz-fıkra no="1">
          <template>Yabancı devlet makamlarınca hazırlanan resmî belgelerin, Türkiye’de bu vasfı taşıması, belgenin verildiği devletin yetkili makamı veya ilgili Türk konsolosluk makamı tarafından onaylanmasına bağlıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türkiye’nin taraf olduğu milletlerarası sözleşmelerin yabancı resmî belgelerin tasdiki ile ilgili hükümleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Yemin">
      <mvz-madde no="225" başlık="Yeminin konusu">
        <mvz-fıkra no="1">
          <template>Yeminin konusu, davanın çözümü bakımından önem taşıyan, çekişmeli olan ve kişinin kendisinden kaynaklanan vakıalardır. Bir kimsenin bir hususu bilmesi onun kendisinden kaynaklanan vakıa sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="226" başlık="Yemine konu olamayacak vakıalar">
        <mvz-fıkra no="1">
          <template>Aşağıdaki hususlar yemine konu olamaz:</template>
          <mvz-bent no="a">
            <template>Tarafların üzerinde serbestçe tasarruf edemeyeceği vakıalar.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bir işlemin geçerliliği için, kanunen iki tarafın irade açıklamalarının yeterli görülmediği hâller.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yemin edecek kimsenin namus ve onurunu etkileyecek veya onu ceza soruşturması ya da kovuşturması ile karşı karşıya bırakacak vakıalar.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="227" başlık="Yemin teklifi">
        <mvz-fıkra no="1">
          <template>Uyuşmazlık konusu vakıanın ispatı için yeminden başka delili olduğunu beyan etmiş olan taraf dahi yemin teklif edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yemin teklif olunan kimse, yemini edaya hazır olduğunu bildirdikten sonra, diğer taraf teklifinden vazgeçerek başka bir delile dayanamaz ve yeni bir delil de gösteremez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="228" başlık="Yemine davet">
        <mvz-fıkra no="1">
          <template>Yemin teklif edilen kimse, duruşmada bizzat hazır bulunmadığı takdirde, kendisine yemin için bir davetiye çıkarılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yemin davetiyesine, yemine konu hususlar hakkında sorulacak sorular ile geçerli bir özrü olmaksızın yemin için tayin olunan gün ve saatte mahkemeye bizzat gelmediği veya gelip de yemini iade etmediği yahut yemini eda etmekten kaçındığı takdirde, yemin konusu vakıaları ikrar etmiş sayılacağı yazılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="229" başlık="Yemin etmemenin sonuçları">
        <mvz-fıkra no="1">
          <template>Yemin için davet edilen kimse, tayin edilen gün ve saatte mahkemede geçerli bir özrü olmaksızın bizzat hazır bulunmaz yahut hazır bulunup da yemini iade etmez ya da yemini eda etmekten kaçınırsa yemin konusu vakıaları ikrar etmiş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kendisine yemin iade olunan kimse, yemin etmekten kaçınırsa yemin konusu vakıa ispat edilememiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="230" başlık="Yeminin iade olunamayacağı hâller">
        <mvz-fıkra no="1">
          <template>Yeminin konusunu oluşturan vakıa, her iki tarafın değil, yalnızca kendisine yemin teklif edilen tarafın şahsından kaynaklanıyorsa yemin iade edilemez</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="231" başlık="Ölüm veya fiil ehliyetinin kaybı">
        <mvz-fıkra no="1">
          <template>Yemin edecek taraf gerçek kişi olup, yeminden evvel ölür veya fiil ehliyetini kaybederse yemin teklif edilmemiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="232" başlık="Yemini yerine getirecek kimseler">
        <mvz-fıkra no="1">
          <template>Yemin, tarafa teklif olunur ve tarafça eda yahut iade olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Taraflardan biri tüzel kişi yahut ergin olmayan veya kısıtlı bir kimse ise onlar adına yapılmış bir işleme ilişkin vakıanın ispatı için yemin, tüzel kişiyi temsile yetkili kişi veya organ yahut kanuni mümessil tarafından eda ya da iade olunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ergin olmayan veya kısıtlı kimselere bizzat dava hakkı tanınan hâllerde, ikinci fıkra hükmü uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="233" başlık="Yeminin şekli">
        <mvz-fıkra no="1">
          <template>Yemin, mahkeme huzurunda eda olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hâkim, yeminin icrasından önce yemin edecek kimseye, hangi konuda yemin edeceğini açıklar, yeminin anlam ve önemini anlatır ve yalan yere yemin etmesi hâlinde cezalandırılacağı hususunda dikkatini çeker.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yemin edecek kimse, yemin konusunun yeterli açıklıkta olmadığını ileri sürerse; hâkim, karşı tarafın görüşünü aldıktan sonra derhâl bu konuda kararını verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sonra "Size sorulan sorular hakkında, gerçeğe uygun cevap vereceğinize ve hiçbir şey saklamayacağınıza namusunuz, şerefiniz ve kutsal saydığınız bütün inanç ve değerler üzerine yemin eder misiniz?" diye sorar. O kimse de "Bana sorulan sorular hakkında gerçeğe uygun cevap vereceğime ve hiçbir şey saklamayacağıma namusum, şerefim ve kutsal saydığım bütün inanç ve değerlerim üzerine yemin ediyorum." demekle yemin eda edilmiş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yemin eda edilirken, hâkim de dâhil olmak üzere hazır bulunan herkes ayağa kalkar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="234" başlık="Sağır ve dilsizlerin yemini">
        <mvz-fıkra no="1">
          <template>Okuma ve yazma bilen sağır veya dilsizler, yemin hakkındaki beyanlarını yazıp imzalayarak yemin ederler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Okuma ve yazma bilmeyen sağır veya dilsizler, işaretlerinden anlayan bir bilirkişi aracılığıyla yemin ederler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="235" başlık="Hasta veya engellilerin mahkeme dışında yemini">
        <mvz-fıkra no="1">
          <template>Yemin edecek kimse, mahkemeye gelemeyecek kadar hasta veya engelli ise hâkim, bulunduğu yerde o kimseye yemin ettirir. Bu sırada isterlerse taraf vekilleri ve karşı taraf da hazır bulunabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="236" başlık="Yemin edecek kimsenin mahkemenin yargı çevresi dışında olması">
        <mvz-fıkra no="1">
          <template>Mahkemenin yargı çevresi dışında oturan kimse, yemin için davaya bakan mahkemeye gelmek zorundadır. Ancak, yemin edecek kişi, mahkemenin bulunduğu il dışında oturuyor ve bulunduğu yerde aynı anda ses ve görüntü nakledilmesi yolu ile yemin icrası mümkün değil ise istinabe yolu ile yemin ettirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="237" başlık="Yemin konusunun açıklattırılması">
        <mvz-fıkra no="1">
          <template>Hâkim, eksik olan noktaları tamamlamak veya açık olmayan hususları aydınlatmak için yeminin konusu ile bağlantılı gördüğü soruları yemin eden kimseye sorabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="238" başlık="Yemin tutanağının düzenlenmesi">
        <mvz-fıkra no="1">
          <template>Hâkim, yemin eden kimsenin beyanını dinleyip tutanağa geçirir ve yazılanları yüksek sesle huzurunda okur; beyanında ısrar edip etmediğini sorar ve verilen cevabı tutanağa kaydeder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="239" başlık="Yalan yere yemin iddiası">
        <mvz-fıkra no="1">
          <template>Yemin eda edildikten sonra, yalan yere yemin nedeniyle açılan ceza davası, esas dava bakımından bekletici sorun yapılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Tanık">
      <mvz-madde no="240" başlık="Tanık gösterme şekli">
        <mvz-fıkra no="1">
          <template>Davada taraf olmayan kişiler tanık olarak gösterilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tanık gösteren taraf, tanık dinletmek istediği vakıayı ve dinlenilmesi istenen tanıkların adı ve soyadı ile tebliğe elverişli adreslerini içeren listeyi mahkemeye sunar. Bu listede gösterilmemiş olan kimseler tanık olarak dinlenemez ve ikinci bir liste verilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tanık listesinde adres gösterilmemiş veya gösterilen adreste tanık bulunamamışsa, tarafa adres göstermesi için, işin niteliğine uygun kesin süre verilir. Bu süre içinde adres gösterilmez veya gösterilen yeni adres de doğru değilse, bu tanığın dinlenilmesinden vazgeçilmiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="241" başlık="Tanıklardan bir kısmının dinlenilmesiyle yetinilmesi">
        <mvz-fıkra no="1">
          <template>Mahkeme, gösterilen tanıklardan bir kısmının tanıklığı ile ispat edilmek istenen husus hakkında yeter derecede bilgi edindiği takdirde, geri kalanların dinlenilmemesine karar verebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="242" başlık="Tanıklığın izne bağlı olduğu hâller">
        <mvz-fıkra no="1">
          <template>Kamu görevlileri, görevlerinden ayrılmış olsalar bile, görevleri gereğince sır olarak saklamak zorunda oldukları hususlar hakkında, sırrın ait olduğu resmî makamın yazılı izni olmadıkça tanık olarak dinlenemezler. Bu izin, milletvekilleri hakkında Türkiye Büyük Millet Meclisi üyeleri, Cumhurbaşkanı yardımcıları ve bakanlar hakkında Cumhurbaşkanı ve diğerleri hakkında bağlı oldukları bakan veya kuruluşun amiri tarafından verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tanıklık kamu yararına aykırı bulunmadıkça izin verilmesinden kaçınılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu izin, mahkeme kararı üzerine yazı ile istenir ve izin verilince tanık davet edilerek dinlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="243" başlık="Tanığın davet edilmesi">
        <mvz-fıkra no="1">
          <template>Tanık davetiye ile çağrılır. Ancak, davetiye gönderilmeden taraflarca hazır bulundurulan tanık da dinlenir. Şu kadar ki, tanık listesi için kesin süre verildiği ve dinlenme gününün belirlendiği hâllerde, liste verilmemiş olsa dahi taraf, o duruşmada hazır bulundurursa tanıklar dinlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Davetiyenin duruşma gününden en az bir hafta önce tebliğ edilmiş olması gerekir. Acele hâllerde tanığın daha önce gelmesine karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tanığı davet, gerektiğinde telefon, faks, elektronik posta gibi araçlardan yararlanılmak suretiyle de yapılabilir. Ancak, davete rağmen gelmemeye bağlanan sonuçlar, bu durumda uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="244" başlık="Davetiyenin içeriği">
        <mvz-fıkra no="1">
          <template>Tanıklara gönderilecek davetiyede;</template>
          <mvz-bent no="a">
            <template>Tanığın adı, soyadı ve açık adresi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Tarafların ad ve soyadları,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Tanıklık yapacağı konu,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Hazır bulunması gereken yer, gün ve saat,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Gelmemesinin veya gelmesine rağmen tanıklıktan ya da yemin etmekten çekinmesinin hukuki ve cezai sonuçları,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Adalet Bakanlığınca hazırlanan tarife gereğince ücret ödeneceği,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>yazılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="245" başlık="Çağrıya uyma zorunluluğu">
        <mvz-fıkra no="1">
          <template>Kanunda gösterilen hükümler saklı kalmak üzere, tanıklık için çağrılan herkes gelmek zorundadır. Usulüne uygun olarak çağrıldığı hâlde mazeret bildirmeksizin gelmeyen tanık zorla getirtilir, gelmemesinin sebep olduğu giderlere ve beşyüz Türk Lirasına kadar disiplin para cezasına hükmolunur. Zorla getirtilen tanık, evvelce gelmemesini haklı gösterecek sebepleri sonradan bildirirse, aleyhine hükmedilen giderler ve disiplin para cezası kaldırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="246" başlık="Tanığa soru kâğıdı gönderilmesi">
        <mvz-fıkra no="1">
          <template>Hâkim gerekli görülen hâllerde, sözlü olarak dinlenmesi yerine, belirlenecek süre içinde cevaplarını yazılı olarak bildirmesi için tanığa soru kâğıdı gönderilmesine karar verebilir. Bu şekilde işlem yapılması, tanığın vereceği cevabın hükme yeterli olup olmadığı hususunu hâkimin takdir etmesine engel olamaz. Hâkim, verilen yazılı cevapların yetersiz olması hâlinde, tanığı dinlemek üzere davet edebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="247" başlık="Tanıklıktan çekinme hakkı">
        <mvz-fıkra no="1">
          <template>Kanunda açıkça belirtilmiş olan hâllerde, tanık olarak çağrılmış bulunan kimse, tanıklık yapmaktan çekinebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kişisel nedenlerle tanıklıktan çekinme sebeplerinin varlığı hâlinde, hâkim tanık olarak çağrılmış kimsenin çekinme hakkı bulunduğunu önceden hatırlatır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="248" başlık="Kişisel nedenlerle tanıklıktan çekinme">
        <mvz-fıkra no="1">
          <template>Aşağıdaki kimseler tanıklıktan çekinebilirler:</template>
          <mvz-bent no="a">
            <template>İki taraftan birinin nişanlısı.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Evlilik bağı ortadan kalkmış olsa dahi iki taraftan birinin eşi.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kendisi veya eşinin altsoy veya üstsoyu.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Taraflardan biri ile arasında evlatlık bağı bulunanlar.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Üçüncü derece de dâhil olmak üzere kan veya kendisini oluşturan evlilik bağı ortadan kalkmış olsa dahi kayın hısımları.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Koruyucu aile ve onların çocukları ile koruma altına alınan çocuk.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="249" başlık="Sır nedeniyle tanıklıktan çekinme">
        <mvz-fıkra no="1">
          <template>Kanun gereği sır olarak korunması gereken bilgiler hakkında tanıklığına başvurulacak kimseler, bu hususlar hakkında tanıklıktan çekinebilirler. Ancak, 19/3/1969 tarihli ve 1136 sayılı Avukatlık Kanunu hükmü saklı kalmak üzere sır sahibi tarafından sırrın açıklanmasına izin verildiği takdirde, bu kimseler tanıklıktan çekinemezler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="250" başlık="Menfaat ihlali tehlikesi nedeniyle tanıklıktan çekinme">
        <mvz-fıkra no="1">
          <template>Aşağıdaki hâllerde tanıklıktan çekinilebilir:</template>
          <mvz-bent no="a">
            <template>Tanığın beyanı kendisine veya 248 inci maddede yazılı kimselerden birine doğrudan doğruya maddi bir zarar verecekse.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Tanığın beyanı kendisinin veya 248 inci maddede yazılı kimselerden birinin şeref veya itibarını ihlal edecek ya da ceza soruşturmasına veya kovuşturmasına sebep olacaksa.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Tanığın beyanı, meslek veya sanatına ait olan sırların ortaya çıkmasına sebebiyet verecekse.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="251" başlık="Tanıklıktan çekinme hakkının istisnaları">
        <mvz-fıkra no="1">
          <template>248 ve 249 uncu maddeler ile 250 nci maddenin (a) bendindeki hâllerde;</template>
          <mvz-bent no="a">
            <template>Bir hukuki işlemin yapılması sırasında tanık olarak bulundurulmuş olan kimse o işlemin esası ve içeriği hakkında,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Aile bireylerinin doğum, ölüm veya evlenmelerinden kaynaklanan olaylar hakkında,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Aile bireyleri arasında, ailevi ilişkilerden kaynaklanan mali uyuşmazlıklara ilişkin vakıalar hakkında,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Taraflardan birinin hukuki selefi veya temsilcisi olarak kendisinin yaptığı işler hakkında,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>tanıklıktan çekinilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="252" başlık="Çekinme sebeplerinin bildirilmesi ve incelenmesi">
        <mvz-fıkra no="1">
          <template>Tanıklıktan çekinen kimse, çekinme sebebini ve bu sebebi haklı gösterecek delilini, dinleneceği günden önce yazılı veya davet edildiği duruşmada sözlü olarak bildirmek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Çekinme sebeplerini ve bunun dayanaklarını önceden bildirmiş olan tanık belli günde mahkemeye gelmek zorunda değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme, duruşmada bulunan tarafları dinledikten sonra tanıklıktan çekinmenin haklı olup olmadığına karar verir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="253" başlık="Çekinmenin kabul edilmemesinin sonucu">
        <mvz-fıkra no="1">
          <template>Tanık, kanuni bir sebep göstermeden tanıklıktan çekinir, yemin etmez veya göstermiş olduğu sebep mahkemece kabul edilmemesine rağmen tanıklık yapmaktan çekinirse beşyüz Türk Lirasından beşbin Türk Lirasına kadar disiplin para cezasına ve bu yüzden doğan giderleri ödemesine hükmedilerek, yeniden dinlenilmek üzere yargılama başka güne bırakılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tanık kendisine sorulan sorulara cevap vermez veya yemin etmemekte direnirse o mahkemece iki haftayı geçmemek üzere disiplin hapsine mahkûm edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="254" başlık="Tanığın kimliğinin tespiti">
        <mvz-fıkra no="1">
          <template>Dinleme sırasında öncelikle tanıktan adı, soyadı, doğum tarihi, mesleği, adresi, taraflarla akrabalığının veya başka bir yakınlığının bulunup bulunmadığı, tanıklığına duyulacak güveni etkileyebilecek bir durumu olup olmadığı sorulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="255" başlık="Tanıklara itiraz">
        <mvz-fıkra no="1">
          <template>Tanığın davada yararı bulunmak gibi tanıklığının doğruluğu konusunda kuşkuyu gerektiren sebepler varsa, bunu iki taraftan biri iddia ve ispat edebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="256" başlık="Tanığa görevinin önemini anlatma">
        <mvz-fıkra no="1">
          <template>Tanığa dinlenmeden önce;</template>
          <mvz-bent no="a">
            <template>Gerçeği söylemesinin önemi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Gerçeği söylememesi hâlinde yalan tanıklık suçundan dolayı cezalandırılacağı,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Doğruyu söyleyeceği hususunda yemin edeceği,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Duruşmada mahkeme başkanı veya hâkimin açık izni olmadan mahkeme salonunu terk edemeyeceği ve gerekirse diğer tanıklarla yüzleştirilebileceği,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>anlatılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="257" başlık="Yeminsiz dinlenecekler">
        <mvz-fıkra no="1">
          <template>Aşağıdaki kimseler yeminsiz dinlenir:</template>
          <mvz-bent no="a">
            <template>Dinlendiği sırada onbeş yaşını bitirmemiş olanlar.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yeminin niteliğini ve önemini kavrayamayacak derecede ayırt etme gücüne sahip olmayanlar.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="258" başlık="Yeminin zamanı ve şekli">
        <mvz-fıkra no="1">
          <template>Yemin, tanığın dinlenilmesinden önce eda edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yemin eda edilirken, hâkim de dâhil olmak üzere hazır bulunan herkes ayağa kalkar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hâkim tanığa, “Tanık sıfatıyla sorulacak sorulara vereceğiniz cevapların gerçeğe aykırı olmayacağına ve bilginizden hiçbir şey saklamayacağınıza namusunuz, şerefiniz ve kutsal saydığınız bütün inanç ve değerler üzerine yemin ediyor musunuz?” diye sorar. Tanık da cevaben, “Sorulacak sorulara, hiçbir şey saklamadan doğru cevap vereceğime namusum, şerefim ve kutsal saydığım bütün inanç ve değerlerim üzerine yemin ediyorum.” demekle yemin eda edilmiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="259" başlık="Tanıkların mahkemede dinlenilmesi">
        <mvz-fıkra no="1">
          <template>Tanıklar davaya bakan mahkemede dinlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme, gerçeğin ortaya çıkması için gerekliyse, tanığın olayın gerçekleştiği veya şeyin bulunduğu yerde dinlenilmesine karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme, hasta veya engelli olmasından dolayı gelemeyen tanığı bulunduğu yerde dinler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mahkemenin yargı çevresi dışında bulunan tanığın, bulunduğu yer mahkemesi tarafından dinlenmesine karar verilebilir. İstinabe yolu ile dinlenilmesine karar verilen tanığın, nerede, hangi gün ve saatte dinleneceği hususu, talepleri hâlinde taraflara tebliğ edilir. Bu durumda, tanığın, hangi hususlardan dolayı dinleneceğini hâkim belirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="260" başlık="Tanığın bilgilendirilmesi">
        <mvz-fıkra no="1">
          <template>Tanık dinlenmeden önce hakkında tanıklık yapacağı olayla ilgili olarak, hâkim tarafından kendisine bilgi verilir ve tanıklık edeceği konulara ilişkin bildiklerini söylemesi istenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="261" başlık="Tanığın dinlenilme şekli">
        <mvz-fıkra no="1">
          <template>Tanıklar, hâkim tarafından ayrı ayrı dinlenir ve biri dinlenirken henüz dinlenmemiş olanlar salonda bulunamazlar. Tanıklar gerektiğinde yüzleştirilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tanık, bildiğini sözlü olarak açıklar ve sözü kesilmeden dinlenir. Dinlenilme sırasında, tanık, yazılı notlar kullanamaz. Şu kadar ki, tanık tarihleri ve rakamları tespit etmek veya bazı hususları açıklamak ya da hatırlayabilmek için yazılarına bakmak zorunda olduğunu hâkime söylerse, hâkim derhâl yazılarına bakmasına veya belirleyeceği duruşmada yeniden dinlenmesine karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hâkim, tanık sözünü bitirdikten sonra, ifade ettiği hususların açıklanması veya tamamlanması amacıyla başka sorular da sorabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Toplu mahkemede başkan, hâkimlerden her birinin tanığa doğrudan doğruya soru sormasına izin verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Tanığın sözleri tutanağa yazılarak önünde okunur ve tutanağın altı kendisine imza ettirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="262" başlık="Yasak davranışlar">
        <mvz-fıkra no="1">
          <template>Tarafların, tanığın sözünü kesmeleri, söz veya hareketle onu övmeleri veya tahkir etmeleri yasaktır. Buna aykırı davranan taraf veya vekili, hâkimin uyarısına rağmen davranışını devam ettirecek olursa, 79 veya 151 inci maddeler uyarınca işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="263" başlık="Tercüman ve bilirkişi kullanılması">
        <mvz-fıkra no="1">
          <template>Tanık Türkçe bilmezse tercümanla dinlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tanık, sağır ve dilsiz olup okuma ve yazmayı biliyorsa, sorular kendisine yazılı olarak bildirilir ve cevapları yazdırılır; okuma ve yazma bilmediği takdirde, hâkim, kendisini işaret dilinden anlayan bilirkişi yardımıyla dinler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="264" başlık="Yalan yere veya menfaat temin ederek tanıklık edilmesi ve sonuçları">
        <mvz-fıkra no="1">
          <template>Hâkim, tanığın tanıklığı esnasında yalan söylediği veya menfaat temin ederek tanıklık ettiği hakkında yeterli delil veya emare elde ederse bir tutanak düzenler ve bu tutanağı derhâl Cumhuriyet başsavcılığına gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hâkim, tanığın ve suçta ortakları varsa onların tutuklanmasına da karar verebilir ve kovuşturma yapılmak üzere Cumhuriyet başsavcılığına sevk eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="265" başlık="Tanığa ödenecek ücret ve giderler">
        <mvz-fıkra no="1">
          <template>Mahkeme tarafından çağrılan tanığa, her yıl Adalet Bakanlığınca hazırlanan tarifeye göre, kaybettiği zaman ile orantılı bir ücret verilir. Tanık hazır olmak için seyahat etmek zorunda kalmışsa yol giderleri ile tanıklığa çağrıldığı yerdeki konaklama ve beslenme giderleri de karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkra hükmüne göre ödenmesi gereken ücret ve giderler, hiçbir vergi, resim ve harca tabi değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Bilirkişi İncelemesi">
      <mvz-madde no="266" başlık="Bilirkişiye başvurulmasını gerektiren hâller">
        <mvz-fıkra no="1">
          <template>Mahkeme, çözümü hukuk dışında, özel veya teknik bilgiyi gerektiren hâllerde, taraflardan birinin talebi üzerine yahut kendiliğinden, bilirkişinin oy ve görüşünün alınmasına karar verir.  Ancak genel bilgi veya tecrübeyle ya da hâkimlik mesleğinin gerektirdiği hukukî bilgiyle çözümlenmesi mümkün olan konularda bilirkişiye başvurulamaz.  Hukuk öğrenimi görmüş kişiler, hukuk alanı dışında ayrı bir uzmanlığa sahip olduğunu belgelendirmedikçe, bilirkişi olarak görevlendirilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="267" başlık="Bilirkişi sayısının belirlenmesi">
        <mvz-fıkra no="1">
          <template>Mahkeme, bilirkişi olarak, yalnızca bir kişiyi görevlendirebilir. Ancak, gerekçesi açıkça gösterilmek suretiyle, tek sayıda, birden fazla kişiden oluşacak bir kurulun bilirkişi olarak görevlendirilmesi de mümkündür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="268" başlık="Bilirkişilerin görevlendirilmesi">
        <mvz-fıkra no="1">
          <template>Bilirkişiler, bölge adliye mahkemelerinin yargı çevreleri esas alınmak suretiyle bilirkişilik bölge kurulu tarafından hazırlanan listede yer alan kişiler arasından seçilir. Ancak kendi bölge listesinde ilgili uzmanlık alanında bilirkişi olmasına rağmen diğer bir bölgedeki bilirkişinin, görevlendirme yapılan yere daha yakın bir mesafede bulunması durumunda, bu listeden de görevlendirme yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bölge kurulunun hazırladığı listede bilgisine başvurulacak uzmanlık dalında bilirkişi bulunmaması hâlinde, diğer bölge kurullarının listelerinden; burada da bulunmaması hâlinde, Bilirkişilik Kanununun 10 uncu maddesinin (d), (e) ve (f) bentleri hariç birinci fıkrasında yer alan şartları da taşımak kaydıyla listelerin dışından bilirkişi görevlendirilebilir. Listelerin dışından görevlendirilen bilirkişiler, bölge kuruluna bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kanunların görüş bildirmekle yükümlü kıldığı kişi ve kuruluşlara görevlendirildikleri konularda bilirkişi olarak öncelikle başvurulur. Ancak kamu görevlilerine, bağlı bulundukları kurumlarla ilgili dava ve işlerde, bilirkişi olarak görev verilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="269" başlık="Bilirkişilik görevinin kapsamı">
        <mvz-fıkra no="1">
          <template>Bilirkişilik görevi, mahkemece yapılan davete uyup tayin edilen gün ve saatte mahkemede hazır bulunmayı, yemin etmeyi ve bilgisine başvurulan konuda süresinde oy ve görüşünü mahkemeye bildirmeyi kapsar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Geçerli bir özrü olmaksızın mahkemece yapılan davete uyup, tayin edilen gün ve saatte mahkemede hazır bulunmayan yahut mahkemeye gelip de yemin etmekten veya süresinde oy ve görüş bildirmekten kaçınan bilirkişiler hakkında, tanıklığa ilişkin disiplin hükümleri uygulanır ve durum bilirkişilik bölge kuruluna bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="270" başlık="Bilirkişilik görevini kabulle yükümlü olanlar">
        <mvz-fıkra no="1">
          <template>Aşağıda sayılmış olan kişi ya da kuruluşlar, bilirkişilik görevini kabulle yükümlüdürler:</template>
          <mvz-bent no="a">
            <template>Resmî bilirkişiler ile 268 inci maddede belirtilmiş bulunan listelerde yer almış olanlar.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bilgisine başvurulacak konuyu bilmeksizin, meslek veya zanaatlarını icra etmesine olanak bulunmayanlar.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bilgisine başvurulacak konu hakkında, meslek veya sanat icrasına resmen yetkili kılınmış olanlar.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu kişiler, ancak tanıklıktan çekinme sebeplerine veya mahkemece kabul edilebilir diğer bir sebebe dayanarak, bilirkişilikten çekinebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="271" başlık="Bilirkişiye yemin verdirilmesi">
        <mvz-fıkra no="1">
          <template>Listelere kaydedilmiş kişiler arasından görevlendirilmiş olan bilirkişilere, bilirkişilik bölge kurulu veya bulunduğu yer il adli yargı adalet komisyonu huzurunda, “Bilirkişilik görevimi sadakat ve özenle, bilim ve fenne uygun olarak, tarafsız ve objektif bir biçimde yerine getireceğime, namusum, şerefim ve kutsal saydığım bütün inanç ve değerlerim üzerine yemin ederim.” şeklindeki sözler, tekrarlattırılmak suretiyle yemin verdirilir. Bu bilirkişilere, görevlendirildikleri her dava veya işte ayrıca yemin verdirilmez; sadece görevlendirme yazısında, bilirkişilere önceden etmiş bulundukları yemine bağlı kalmak suretiyle oy ve görüş bildirmek zorunda oldukları hususu hatırlatılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Listelere kaydedilmemiş olan kişiler arasından bilirkişiler görevlendirilmişse, kendilerine, görevlendiren mahkemece, huzurda, göreve başlamadan önce, birinci fıkrada belirtilen şekilde yemin verdirilir. Yemine ilişkin tutanak, hâkim, zabıt kâtibi ve bilirkişi tarafından imzalanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="272" başlık="Bilirkişinin görevini yapmaktan yasaklı olması ve reddi">
        <mvz-fıkra no="1">
          <template>Hâkimler hakkındaki yasaklılık ve ret sebepleriyle ilgili kurallar, bilirkişiler bakımından da uygulanır. Ancak, bilirkişinin, aynı dava veya işte daha önceden tanık olarak dinlenmiş bulunması, bir ret sebebi teşkil etmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hâkimler hakkındaki yasaklılık sebeplerinden biri, bilirkişinin şahsında gerçekleşmişse, mahkeme, hüküm verilinceye kadar, her zaman bilirkişiyi resen görevden alabileceği gibi, bilirkişi de mahkemeden, görevden alınma talebinde bulunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ret sebeplerinden birinin bilirkişinin şahsında gerçekleşmesi hâlinde taraflar, bilirkişinin reddini talep edebileceği gibi, bilirkişi de kendisini reddedebilir. Ret talebi veya bilirkişinin kendisini reddetmesinin, ret sebebinin öğrenilmesinden itibaren en geç bir hafta içinde yapılmış olması şarttır. Ret sebeplerinin ispatı için, yemin teklif edilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Görevden alınma, ret ve bilirkişinin kendisini reddetmesine yönelik talep, bilirkişiyi görevlendiren mahkemece dosya üzerinden incelenir ve karara bağlanır. Kabule ilişkin kararlar kesindir. Redde ilişkin kararlara karşı ise ancak esas hakkındaki kararla birlikte kanun yoluna başvurulabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="273" başlık="Bilirkişinin görev alanının belirlenmesi">
        <mvz-fıkra no="1">
          <template>Mahkeme, tarafların da görüşünü almak suretiyle bilirkişinin görevlendirilmesine ilişkin kararında, aşağıda belirtilen hususlara yer vermek zorundadır:</template>
          <mvz-bent no="a">
            <template>İnceleme konusunun bütün sınırlarıyla ve açıkça belirlenmesi.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bilirkişinin cevaplaması gereken sorular.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Raporun verilme süresi.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bilirkişiye, görevlendirme yazısının ekinde, inceleyeceği şeyler, dizi pusulasına bağlı olarak ve gerekiyorsa mühürlü bir biçimde teslim edilir; ayrıca bu husus tutanakta gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="274" başlık="Bilirkişinin görev süresi">
        <mvz-fıkra no="1">
          <template>Bilirkişi raporunun hazırlanması için verilecek süre üç ayı geçemez. Bilirkişinin talebi üzerine, kendisini görevlendiren mahkeme gerekçesini göstererek, süreyi üç ayı geçmemek üzere uzatabilir.  Ancak basit yargılama usulüne tabi dava ve işlerde bu süreler iki ay olarak uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belirlenen süre içinde raporunu vermeyen bilirkişi görevden alınıp, yerine bir başka kimse, bilirkişi olarak görevlendirilebilir. Bu durumda mahkeme, görevden alınmış olan bilirkişiden, görevden alındığı ana kadar yapmış olduğu işlemler hakkında açıklama yapmasını talep eder ve ayrıca bilirkişinin dizi pusulasına bağlı bir biçimde görevi sebebiyle incelenmek üzere kendisine teslim edilmiş bulunan dosya ve eklerini mahkemeye hemen tevdi etmesini ister.  Ayrıca hukuki ve cezai sorumluluğuna ilişkin hükümler saklı kalmak kaydıyla, bilirkişiye ücret ve masraf adı altında hiçbir ödeme yapılmamasına karar verilebilir ve gerekçesi gösterilerek gerekli yaptırımların uygulanması bilirkişilik bölge kurulundan talep edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="275" başlık="Bilirkişinin haber verme yükümlülüğü">
        <mvz-fıkra no="1">
          <template>Bilgisine başvurulan bilirkişi, kendisine tevdi olunan görevin, uzmanlık alanına girmediğini, inceleme konusu maddi vakıaların açıklığa kavuşturulması ve tespiti için, uzman kimliği bulunan başka bir bilirkişi ile işbirliğine ihtiyaç duyduğunu veya görevi kabulden kaçınmasını haklı kılacak mazeretini bir hafta içinde görevlendirmeyi yapan mahkemeye bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bilirkişi, incelemesini gerçekleştirebilmek için, bazı hususların önceden soruşturulması ve tespiti ile bazı kayıt ve belgelerin getirtilmesine ihtiyaç duyuyorsa, bunun sağlanması için, bir hafta içinde kendisini görevlendiren mahkemeye bilgi verir ve talepte bulunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="276" başlık="Bilirkişinin görevini bizzat yerine getirme yükümlülüğü">
        <mvz-fıkra no="1">
          <template>Bilirkişi, mahkemece kendisine tevdi olunan görevi bizzat yerine getirmekle yükümlü olup, görevinin icrasını kısmen yahut tamamen başka bir kimseye bırakamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="277" başlık="Bilirkişinin sır saklama yükümlülüğü">
        <mvz-fıkra no="1">
          <template>Bilirkişi, görevi sebebiyle yahut görevini yerine getirirken öğrendiği sırları saklamak, kendisi ve başkaları yararına kullanmaktan kaçınmakla yükümlüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="278" başlık="Bilirkişinin yetkileri">
        <mvz-fıkra no="1">
          <template>Bilirkişi, görevini, mahkemenin sevk ve idaresi altında yürütür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bilirkişi, görev alanı veya sınırları hakkında tereddüde düşerse, bu tereddüdünün giderilmesini, her zaman mahkemeden isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bilirkişi, incelemesini gerçekleştirirken ihtiyaç duyarsa, mahkemenin de uygun bulması kaydıyla, tarafların bilgisine başvurabilir. Taraflardan birinin bilgisine başvurulacağı hâllerde, mahkemece bilirkişiye taraflardan biri bulunmaksızın diğerinin dinlenemeyeceği hususu önceden hatırlatılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bilirkişinin oy ve görüşünü açıklayabilmesi için bir şey üzerinde inceleme yapması zorunlu ise mahkeme kararı ile gerekli incelemeyi yapabilir. Bu işlemin icrası sırasında taraflar da hazır bulunabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="279" başlık="Bilirkişi açıklamalarının tespiti ve rapor">
        <mvz-fıkra no="1">
          <template>Mahkeme, bilirkişinin oy ve görüşünü yazılı veya sözlü olarak bildirmesine karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Raporda, tarafların ad ve soyadları, bilirkişinin görevlendirildiği hususlar, gözlem ve inceleme konusu yapılan maddi vakıalar, gerekçe ve varılan sonuçlarla, bilirkişiler arasında görüş ayrılığı varsa, bunun sebebi, düzenlenme tarihi ve bilirkişi ya da bilirkişilerin imzalarının bulunması gerekir. Azınlıkta kalan bilirkişi, oy ve görüşünü ayrı bir rapor hâlinde de mahkemeye sunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme, bilirkişinin oy ve görüşünü sözlü olarak açıklamasına karar verirse, bilirkişinin açıklamaları tutanağa geçirilir ve tutanağın altına bilirkişinin de imzası alınır. Kurul hâlinde görevlendirme söz konusu ise bilirkişilerin bilgilerine başvurulan hususu hemen aralarında müzakere etmelerine imkân tanınır ve müzakere sonucunda açıklanan oy ve görüş, tutanakla tespit edilip; tutanağın altı, bilirkişilere imza ettirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bilirkişi, raporunda ve sözlü açıklamaları sırasında çözümü uzmanlığı, özel veya teknik bilgiyi gerektiren hususlar dışında açıklama yapamaz; hâkim tarafından yapılması gereken hukuki nitelendirme ve değerlendirmelerde bulunamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="280" başlık="Bilirkişi raporunun verilmesi">
        <mvz-fıkra no="1">
          <template>Bilirkişi, raporunu, varsa kendisine incelenmek üzere teslim edilen şeylerle birlikte bir dizi pusulasına bağlı olarak mahkemeye verir; verildiği tarih rapora yazılır ve duruşma gününden önce birer örneği taraflara tebliğ edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="281" başlık="Bilirkişi raporuna itiraz">
        <mvz-fıkra no="1">
          <template>Taraflar, bilirkişi raporunun, kendilerine tebliği tarihinden itibaren iki hafta içinde, raporda eksik gördükleri hususların, bilirkişiye tamamlattırılmasını; belirsizlik gösteren hususlar hakkında ise bilirkişinin açıklama yapmasının sağlanmasını veya yeni bilirkişi atanmasını mahkemeden talep edebilirler.  Bilirkişi raporuna karşı talebin bu süre içinde hazırlanmasının çok zor veya imkânsız olması ya da özel yahut teknik bir çalışmayı gerektirmesi hâlinde yine bu süre içinde mahkemeye başvuran tarafa, sürenin bitiminden itibaren işlemeye başlamak, bir defaya mahsus olmak ve iki haftayı geçmemek üzere ek süre verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme, bilirkişi raporundaki eksiklik yahut belirsizliğin tamamlanması veya açıklığa kavuşturulmasını sağlamak için, bilirkişiden, yeni sorular düzenlemek suretiyle ek rapor alabileceği gibi, tayin edeceği duruşmada, sözlü olarak açıklamalarda bulunmasını da kendiliğinden isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme, gerçeğin ortaya çıkması için gerekli görürse, yeni görevlendireceği bilirkişi aracılığıyla, tekrar inceleme de yaptırabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="282" başlık="Bilirkişinin oy ve görüşünün değerlendirilmesi">
        <mvz-fıkra no="1">
          <template>Hâkim, bilirkişinin oy ve görüşünü diğer delillerle birlikte serbestçe değerlendirir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="283" başlık="Bilirkişi gider ve ücreti">
        <mvz-fıkra no="1">
          <template>Bilirkişiye, sarf etmiş olduğu emek ve mesaiyle orantılı bir ücret ile inceleme, ulaşım, konaklama ve diğer giderleri ödenir. Bu konuda, Adalet Bakanlığınca çıkarılacak ve her yıl güncellenecek olan tarife esas alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="284" başlık="Bilirkişinin ceza hukuku bakımından durumu">
        <mvz-fıkra no="1">
          <template>Bilirkişi, Türk Ceza Kanunu anlamında kamu görevlisidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="285" başlık="Bilirkişinin hukuki sorumluluğu">
        <mvz-fıkra no="1">
          <template>Bilirkişinin kasten veya ağır ihmal suretiyle düzenlemiş olduğu gerçeğe aykırı raporun, mahkemece hükme esas alınması sebebiyle zarar görmüş olanlar, bu zararın tazmini için Devlete karşı tazminat davası açabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Devlet, ödediği tazminat için sorumlu bilirkişiye rücu eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="286" başlık="Davaların açılacağı mahkeme">
        <mvz-fıkra no="1">
          <template>Devlet aleyhine açılacak olan tazminat davası, gerçeğe aykırı bilirkişi raporunun ilk derece mahkemesince hükme esas alındığı hâllerde, bu mahkemenin yargı çevresi içinde yer aldığı bölge adliye mahkemesi hukuk dairesinde; bölge adliye mahkemesince hükme esas alındığı hâllerde ise Yargıtay ilgili hukuk dairesinde görülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Devletin sorumlu bilirkişiye karşı açacağı rücu davası, tazminat davasını karara bağlamış olan mahkemede görülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="287" başlık="Rücu davasında zamanaşımı">
        <mvz-fıkra no="1">
          <template>Devlet, ödediği tazminat nedeniyle, sorumlu bilirkişiye, ödeme tarihinden itibaren bir yıl içinde rücu eder. Hükme esas alınan bilirkişi raporu kasten gerçeğe aykırı olarak düzenlenmişse, bu durumda, ceza zamanaşımı süresi uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="6-ALTINCI" başlık="Keşif">
      <mvz-madde no="288" başlık="Keşif kararı">
        <mvz-fıkra no="1">
          <template>Hâkim, uyuşmazlık konusu hakkında bizzat duyu organları yardımıyla bulunduğu yerde veya mahkemede inceleme yaparak bilgi sahibi olmak amacıyla keşif yapılmasına karar verebilir. Hâkim gerektiğinde bilirkişi yardımına başvurur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Keşif kararı, mahkemece, sözlü yargılamaya kadar taraflardan birinin talebi üzerine veya resen alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="289" başlık="Keşfe yetkili mahkeme">
        <mvz-fıkra no="1">
          <template>Keşif, davaya bakan mahkemece icra edilir. Keşif konusu, mahkemenin yargı çevresi dışında ise inceleme istinabe suretiyle yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Keşif konusu, büyükşehir belediye sınırları içerisinde ise inceleme, davaya bakan mahkeme tarafından da yerine getirilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="290" başlık="Keşfin yapılması">
        <mvz-fıkra no="1">
          <template>Keşfin yeri, kapsamı ve zamanı mahkeme tarafından tespit edilir. Keşif, taraflar hazır iseler huzurlarında, aksi takdirde yokluklarında yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme keşif sırasında tanık ve bilirkişi dinleyebilir. Keşif sırasında, yapılan tüm işlemler ve beyanları içeren bir tutanak düzenlenir.  Tutanağa, hâkimin keşif konusu ve mahalliyle ilgili gözlemleri de yazılır. Plan, çizim, fotoğraf gibi belgeler de tutanağa eklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme, bir olayın nasıl geçmiş olabileceğini tespit için temsili uygulama da yaptırabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="291" başlık="Keşfe katlanma zorunluluğu">
        <mvz-fıkra no="1">
          <template>Taraflar ve üçüncü kişiler keşif kararının gereğine uymak ve engelleyici tutum ve davranışlardan kaçınmak zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Keşif yapılmasına taraflardan birinin karşı koyması hâlinde, o kimse ispat yükü kendisine düşen taraf ise bu delilden vazgeçmiş; diğer taraf ise iddia edilen vakıayı kabul etmiş sayılır. Şu kadar ki, hâkim duruma ve karşı koyma sebebine göre bu hükmü uygulamayabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Keşif, üçüncü kişi için uygun olan zamanda yapılır. Keşif zamanı ve yeri üçüncü kişiye bildirilir. Gecikmesinde zarar umulan hâllerde bildirim yapılmaksızın keşif icra edilir. Keşfe karşı koyma hâlinde hâkim, üçüncü kişiyi karşı koymanın sebep olduğu giderlere ve beşyüz Türk Lirasından beşbin Türk Lirasına kadar disiplin para cezasına mahkûm eder; gerektiğinde zor kullanılmasına karar verebilir. Ancak, üçüncü kişi tanıklıktan çekinme sebeplerine dayanarak keşfe katlanma yükümlülüğünden kaçınabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="292" başlık="Soybağı tespiti için inceleme">
        <mvz-fıkra no="1">
          <template>Uyuşmazlığın çözümü bakımından zorunlu ve bilimsel verilere uygun olmak, ayrıca sağlık yönünden bir tehlike oluşturmamak şartıyla, herkes, soybağının tespiti amacıyla vücudundan kan veya doku alınmasına katlanmak zorundadır. Haklı bir sebep olmaksızın bu zorunluluğa uyulmaması hâlinde, hâkim incelemenin zor kullanılarak yapılmasına karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Üçüncü kişi tanıklıktan çekinme hakkı bulunduğunu ileri sürerek bu yükümlülükten kaçınamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="7-YEDİNCİ" başlık="Uzman Görüşü">
      <mvz-madde no="293" başlık="Uzman görüşü">
        <mvz-fıkra no="1">
          <template>Taraflar, dava konusu olayla ilgili olarak, uzmanından bilimsel mütalaa alabilirler. Sadece bu nedenle ayrıca süre istenemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hâkim, talep üzerine veya resen, kendisinden rapor alınan uzman kişinin davet edilerek dinlenilmesine karar verebilir. Uzman kişinin çağrıldığı duruşmada hâkim ve taraflar gerekli soruları sorabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Uzman kişi çağrıldığı duruşmaya geçerli bir özrü olmadan gelmezse, hazırlamış olduğu rapor mahkemece değerlendirmeye tabi tutulmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Hüküm ve Davaya Son Veren Taraf İşlemleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Hüküm">
      <mvz-madde no="294" başlık="Hüküm, hükmün verilmesi ve tefhimi">
        <mvz-fıkra no="1">
          <template>Mahkeme, usule veya esasa ilişkin bir nihai kararla davayı sona erdirir. Yargılama sonunda uyuşmazlığın esası hakkında verilen nihai karar, hükümdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hüküm, yargılamanın sona erdiği duruşmada verilir ve tefhim olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hükmün tefhimi, her hâlde hüküm sonucunun duruşma tutanağına geçirilerek okunması suretiyle olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Zorunlu nedenlerle sadece hüküm sonucunun tefhim edildiği hâllerde, gerekçeli kararın tefhim tarihinden başlayarak bir ay içinde yazılması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Hükmün tefhimini, duruşmada bulunanlar ayakta dinler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Hükme ilişkin hususlar, niteliğine aykırı düşmedikçe, usule ilişkin nihai kararlar hakkında da uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="295" başlık="Hükmün müzakeresi">
        <mvz-fıkra no="1">
          <template>Hüküm, gizli müzakere edilerek hazırlanır ve alenen tefhim olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hükmü, yargılamanın sona erdiğinin bildirildiği duruşmada hazır bulunan hâkim veya hâkimler verir. Bu şekilde hüküm verebilecek hâkimlerin tamamı hazır bulunmadıkça hüküm hakkında görüşme yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hükmün müzakeresi sırasında, yargılamanın sona erdiğinin bildirildiği duruşmada hazır bulunan hâkim bulunmuyorsa, gerekli görüldüğü takdirde tarafların sözlü açıklamaları tekrar dinlendikten sonra müzakere edilir ve hüküm verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="296" başlık="Hükmün oylanması ve yeter sayı">
        <mvz-fıkra no="1">
          <template>Toplu mahkemelerde hüküm hakkındaki müzakereyi mahkeme başkanı idare eder. Müzakere yapıldıktan sonra, başkan, müzakereye katılan en kıdemsiz üyeden başlayarak her üyenin ayrı ayrı oyunu alır ve en son kendi oyunu açıklar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hüküm, oy çokluğu ile de verilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="297" başlık="Hükmün kapsamı">
        <mvz-fıkra no="1">
          <template>Hüküm “Türk Milleti Adına” verilir ve bu ibareden sonra aşağıdaki hususları kapsar:</template>
          <mvz-bent no="a">
            <template>Hükmü veren mahkeme ile hâkim veya hâkimlerin ve zabıt kâtibinin ad ve soyadları ile sicil numaraları, mahkeme çeşitli sıfatlarla görev yapıyorsa hükmün hangi sıfatla verildiğini.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Tarafların ve davaya katılanların kimlikleri ile Türkiye Cumhuriyeti kimlik numarası, varsa kanuni temsilci ve vekillerinin ad ve soyadları ile adreslerini.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Tarafların iddia ve savunmalarının özetini, anlaştıkları ve anlaşamadıkları hususları, çekişmeli vakıalar hakkında toplanan delilleri, delillerin tartışılması ve değerlendirilmesini, sabit görülen vakıalarla bunlardan çıkarılan sonuç ve hukuki sebepleri.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Hüküm sonucu, yargılama giderleri ile taraflardan alınan avansın harcanmayan kısmının iadesi, varsa kanun yolları ve süresini.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Hükmün verildiği tarih ve hâkim veya hâkimlerin ve zabıt kâtibinin imzalarını.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Gerekçeli kararın yazıldığı tarihi.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hükmün sonuç kısmında, gerekçeye ait herhangi bir söz tekrar edilmeksizin, taleplerden her biri hakkında verilen hükümle, taraflara yüklenen borç ve tanınan hakların, sıra numarası altında; açık, şüphe ve tereddüt uyandırmayacak şekilde gösterilmesi gereklidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="298" başlık="Hükmün yazılması">
        <mvz-fıkra no="1">
          <template>Hüküm, hükmü veren hâkim, toplu mahkemelerde başkan veya hükme katılmış olan hâkimlerden başkanın seçeceği bir üye tarafından yazılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gerekçeli karar, tefhim edilen hüküm sonucuna aykırı olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hükümde gerekçesi ile birlikte karşı oya da yer verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Hüküm, hükmü veren hâkim veya hâkimler ile zabıt kâtibi tarafından imzalanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="299" başlık="Hükmün imza edilememesi">
        <mvz-fıkra no="1">
          <template>Hüküm sonucu tefhim edildikten sonra gerekçeli karar imzalanmadan, hâkim ölür veya herhangi bir sebeple imzalayamayacak hâle düşerse, yeni hâkim, tefhim edilen hükme uygun olarak gerekçeli kararı bizzat yazarak imzalar. Toplu mahkemelerde böyle bir durumun gerçekleşmesi hâlinde, hüküm diğer hâkimler tarafından imzalanır ve başkan veya en kıdemli hâkim tarafından, hükmün altına diğer hâkimin imza edememesinin sebebi yazılarak imza olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="300" başlık="Hükmün korunması">
        <mvz-fıkra no="1">
          <template>Hükme katılan hâkimlerle zabıt kâtibinin imzalarını ve mahkeme mührünü taşıyan hüküm arşivde korunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="301" başlık="Hüküm nüshası">
        <mvz-fıkra no="1">
          <template>Hüküm yazılıp imza edildikten ve mahkeme mührü ile mühürlendikten sonra, nüshaları yazı işleri müdürü tarafından taraflardan her birine makbuz karşılığında verilir ve bir nüshası da gecikmeksizin diğer tarafa tebliğ edilir. Hükmün bir nüshası da dosyasında saklanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Taraflardan her birine verilen hüküm nüshası ilamdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tarafların elinde bulunan hüküm nüshalarının farklı olması hâlinde karar kartonundaki esas alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="302" başlık="İlamın alınması, kesinleşme kaydı ve harçlar">
        <mvz-fıkra no="1">
          <template>Taraflar, harcının ödenmiş olup olmamasına bakılmaksızın ilamı her zaman alabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bakiye karar ve ilam harcının ödenmemiş olması, hükmün tebliğe çıkarılmasına, takibe konmasına ve kanun yollarına başvurulmasına engel teşkil etmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>2/7/1964 tarihli ve 492 sayılı Harçlar Kanunu dâhil, diğer kanunların bu maddeye aykırı hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Hükmün kesinleştiği, ilamın altına veya arkasına yazılıp, tarih ve mahkeme mührü konmak ve başkan veya hâkim tarafından imzalanmak suretiyle belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kanun yollarından geçmek suretiyle kesinleşen kararların kesinleşme kaydı ile kesinleşme kaydı yapılan kararların yerine getirilmesi için gerekli bildirimler de ilk derece mahkemesince yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="303" başlık="Kesin hüküm">
        <mvz-fıkra no="1">
          <template>Bir davaya ait şeklî anlamda kesinleşmiş olan hükmün, diğer bir davada maddi anlamda kesin hüküm oluşturabilmesi için, her iki davanın taraflarının, dava sebeplerinin ve ilk davanın hüküm fıkrası ile ikinci davaya ait talep sonucunun aynı olması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir hüküm, davada veya karşılık davada ileri sürülen taleplerden, sadece hükme bağlanmış olanlar hakkında kesin hüküm teşkil eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kesin hüküm, tarafların küllî halefleri hakkında da geçerlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bir dava dolayısıyla ortaya çıkan kesin hüküm, o hükmün kesinleşmesinden sonra dava konusu şeyin mülkiyetini tarafların birisinden devralan yahut dava konusu şey üzerinde sınırlı bir ayni hak veya fer’î zilyetlik kazanan kişiler hakkında da geçerlidir. Ancak, Türk Medenî Kanununun iyiniyetle mal edinmeye ait hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Müteselsil borçlulardan biri veya birkaçı ile alacaklı arasında yahut müteselsil alacaklılardan biri veya birkaçı ile borçlu arasında oluşan kesin hüküm, diğerleri hakkında geçerli değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Hükmün Tashihi, Tavzihi ve Tamamlanması">
      <mvz-madde no="304" başlık="Hükmün tashihi">
        <mvz-fıkra no="1">
          <template>Hükümdeki yazı ve hesap hataları ile diğer benzeri açık hatalar, mahkemece resen veya taraflardan birinin talebi üzerine düzeltilebilir. Hüküm tebliğ edilmişse hâkim, tarafları dinlemeden hatayı düzeltemez. Davet üzerine taraflar gelmezse, dosya üzerinde inceleme yapılarak karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tashih kararı verildiği takdirde, düzeltilen hususlarla ilgili karar, mahkemede bulunan nüshalar ile verilmiş olan suretlerin altına veya bunlara eklenecek ayrı bir kâğıda yazılır, imzalanır ve mühürlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="305" başlık="Hükmün tavzihi">
        <mvz-fıkra no="1">
          <template>Hüküm yeterince açık değilse veya icrasında tereddüt uyandırıyor yahut birbirine aykırı fıkralar içeriyorsa, icrası tamamlanıncaya kadar taraflardan her biri hükmün açıklanmasını veya tereddüt ya da aykırılığın giderilmesini isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hüküm fıkrasında taraflara tanınan haklar ve yüklenen borçlar, tavzih yolu ile sınırlandırılamaz, genişletilemez ve değiştirilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="305/A" başlık="Hükmün tamamlanması">
        <mvz-fıkra no="1">
          <template>Taraflardan her biri, nihaî kararın tebliğinden itibaren bir ay içinde, yargılamada ileri sürülmesine veya kendiliğinden hükme geçirilmesi gerekli olmasına rağmen hakkında tamamen veya kısmen karar verilmeyen hususlarda, ek karar verilmesini isteyebilir. Bu karara karşı kanun yoluna başvurulabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="306" başlık="Tavzih ve tamamlama talebi ile usulü">
        <mvz-fıkra no="1">
          <template>Tavzih veya tamamlama, dilekçeye tarafların sayısı kadar nüsha eklenmek suretiyle hükmü veren mahkemeden istenebilir. Dilekçenin bir nüshası, cevap süresi mahkemece belirlenerek karşı tarafa tebliğ edilir. Cevap, tavzih veya tamamlama talebinde bulunan tarafa tebliğ olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme, cevap verilmemiş olsa bile dosya üzerinde inceleme yaparak karar verir; ancak gerekli görürse iki tarafı sözlü açıklamalarını yapabilmeleri için davet edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme tavzih veya tamamlama talebini yerinde gördüğü takdirde 304 üncü madde uyarınca işlem yapar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Davaya Son Veren Taraf İşlemleri">
      <mvz-madde no="307" başlık="Davadan feragat">
        <mvz-fıkra no="1">
          <template>Feragat, davacının, talep sonucundan kısmen veya tamamen vazgeçmesidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="308" başlık="Davayı kabul">
        <mvz-fıkra no="1">
          <template>Kabul, davacının talep sonucuna, davalının kısmen veya tamamen muvafakat etmesidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kabul, ancak tarafların üzerinde serbestçe tasarruf edebilecekleri davalarda hüküm doğurur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="309" başlık="Feragat ve kabulün şekli">
        <mvz-fıkra no="1">
          <template>Feragat ve kabul, dilekçeyle veya yargılama sırasında sözlü olarak yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Feragat ve kabulün hüküm ifade etmesi, karşı tarafın ve mahkemenin muvafakatine bağlı değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kısmen feragat veya kabulde, feragat edilen veya kabul edilen kısmın, dilekçede yahut tutanakta açıkça gösterilmesi gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Feragat ve kabul, kayıtsız ve şartsız olmalıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="310" başlık="Feragat ve kabulün zamanı">
        <mvz-fıkra no="1">
          <template>Feragat ve kabul, hüküm kesinleşinceye kadar her zaman yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Feragat veya kabul, hükmün verilmesinden sonra yapılmışsa, taraflarca kanun yoluna başvurulmuş olsa dahi, dosya kanun yolu incelemesine gönderilmez ve ilk derece mahkemesi veya bölge adliye mahkemesince feragat veya kabul doğrultusunda ek karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Feragat veya kabul, dosyanın temyiz incelemesine gönderilmesinden sonra yapılmışsa, Yargıtay temyiz incelemesi yapmaksızın dosyayı feragat veya kabul hususunda ek karar verilmek üzere hükmü veren mahkemeye gönderir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="311" başlık="Feragat ve kabulün sonuçları">
        <mvz-fıkra no="1">
          <template>Feragat ve kabul, kesin hüküm gibi hukuki sonuç doğurur. İrade bozukluğu hâllerinde, feragat ve kabulün iptali istenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="312" başlık="Feragat ve kabul hâlinde yargılama giderleri">
        <mvz-fıkra no="1">
          <template>Feragat veya kabul beyanında bulunan taraf, davada aleyhine hüküm verilmiş gibi yargılama giderlerini ödemeye mahkûm edilir. Feragat ve kabul, talep sonucunun sadece bir kısmına ilişkin ise yargılama giderlerine mahkûmiyet, ona göre belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Davalı, davanın açılmasına kendi hâl ve davranışıyla sebebiyet vermemiş ve yargılamanın ilk duruşmasında da davacının talep sonucunu kabul etmiş ise yargılama giderlerini ödemeye mahkûm edilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="313" başlık="Sulh">
        <mvz-fıkra no="1">
          <template>Sulh, görülmekte olan bir davada, tarafların aralarındaki uyuşmazlığı kısmen veya tamamen sona erdirmek amacıyla, mahkeme huzurunda yapmış oldukları bir sözleşmedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sulh, ancak tarafların üzerinde serbestçe tasarruf edebilecekleri uyuşmazlıkları konu alan davalarda yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Dava konusunun dışında kalan hususlar da sulhun kapsamına dâhil edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sulh, şarta bağlı olarak da yapılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="314" başlık="Sulhun zamanı">
        <mvz-fıkra no="1">
          <template>Sulh, hüküm kesinleşinceye kadar her zaman yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sulh, hükmün verilmesinden sonra yapılmışsa, taraflarca kanun yoluna başvurulmuş olsa dahi, dosya kanun yolu incelemesine gönderilmez ve ilk derece mahkemesi veya bölge adliye mahkemesince sulh doğrultusunda ek karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sulh, dosyanın temyiz incelemesine gönderilmesinden sonra yapılmışsa, Yargıtay temyiz incelemesi yapmaksızın dosyayı sulh hususunda ek karar verilmek üzere hükmü veren mahkemeye gönderir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="315" başlık="Sulhun etkisi">
        <mvz-fıkra no="1">
          <template>Sulh, ilgili bulunduğu davayı sona erdirir ve kesin hüküm gibi hukuki sonuç doğurur. Mahkeme, taraflar sulhe göre karar verilmesini isterlerse, sulh sözleşmesine göre; sulhe göre karar verilmesini istemezlerse, karar verilmesine yer olmadığına karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İrade bozukluğu ya da aşırı yararlanma hâllerinde sulhun iptali istenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="Basit Yargılama Usulü">
    <mvz-madde no="316" başlık="Basit yargılama usulüne tabi dava ve işler">
      <mvz-fıkra no="1">
        <template>Basit yargılama usulü, kanunlarda açıkça belirtilenler dışında, aşağıdaki durumlarda uygulanır:</template>
        <mvz-bent no="a">
          <template>Sulh hukuk mahkemelerinin görevine giren dava ve işler.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Doğrudan dosya üzerinden karar vermek konusunda kanunun mahkemeye takdir hakkı tanıdığı dava ve işler.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İhtiyati tedbir, ihtiyati haciz, delil tespiti gibi geçici hukuki koruma talepleri ile deniz raporlarının alınması, dispeççi atanması talepleri ve bunlara karşı yapılacak olan itirazlar.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Her çeşit nafaka davaları ile velayet ve vesayete ilişkin dava ve işler.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hizmet ilişkisinden doğan davalar.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Konkordato ve sermaye şirketleri veya kooperatiflerin uzlaşma suretiyle yeniden yapılandırılmasına ilişkin açılacak davalar.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Tahkim hükümlerine göre, mahkemenin görev alanına giren dava ve işler.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Diğer kanunlarda yer alan ve yazılı yargılama usulü dışındaki yargılama usullerinin uygulanacağı belirtilen dava ve işler.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="317" başlık="Dilekçelerin verilmesi">
      <mvz-fıkra no="1">
        <template>Dava açılması ve davaya cevap verilmesi dilekçe ile olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cevap süresi, dava dilekçesinin davalıya tebliğinden itibaren iki haftadır. Ancak mahkeme durum ve koşullara göre cevap dilekçesinin bu süre içinde hazırlanmasının çok zor yahut imkânsız olduğu durumlarda, yine bu süre zarfında mahkemeye başvuran davalıya, cevap süresinin bitiminden itibaren işlemeye başlamak, bir defaya mahsus olmak ve iki haftayı geçmemek üzere ek bir süre verebilir. Ek cevap süresi talebi hakkında verilen karar taraflara derhâl bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Taraflar cevaba cevap ve ikinci cevap dilekçesi veremezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Dava ve cevap dilekçeleri yönetmelikte belirlenecek formun doldurulması suretiyle de verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="318" başlık="Delillerin ikamesi">
      <mvz-fıkra no="1">
        <template>Taraflar dilekçeleri ile birlikte, tüm delillerini açıkça ve hangi vakıanın delili olduğunu da belirterek bildirmek; ellerinde bulunan delillerini dilekçelerine eklemek ve başka yerlerden getirilecek belge ve dosyalar için de bunların bulunabilmesini sağlayan bilgilere dilekçelerinde yer vermek zorundadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="319" başlık="İddia ve savunmanın genişletilmesi veya değiştirilmesi yasağı">
      <mvz-fıkra no="1">
        <template>İddianın genişletilmesi veya değiştirilmesi yasağı dava açılmasıyla; savunmanın genişletilmesi veya değiştirilmesi yasağı cevap dilekçesinin mahkemeye verilmesiyle başlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="320" başlık="Ön inceleme ve tahkikat">
      <mvz-fıkra no="1">
        <template>Mahkeme, mümkün olan hâllerde tarafları duruşmaya davet etmeden dosya üzerinden karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Daha önce karar verilemeyen hâllerde mahkeme, ilk duruşmada dava şartları ve ilk itirazlarla hak düşürücü süre ve zamanaşımı hakkında tarafları dinler; daha sonra tarafların iddia ve savunmaları çerçevesinde, anlaştıkları ve anlaşamadıkları hususları tek tek tespit eder. Uyuşmazlık konularının tespitinden sonra hâkim, tarafları sulhe veya arabuluculuğa teşvik eder. Tarafların sulh olup olmadıkları, sulh olmadıkları takdirde anlaşamadıkları hususların nelerden ibaret olduğu tutanağa yazılır; tutanağın altı hazır bulunan taraflarca imzalanır. Tahkikat bu tutanak esas alınmak suretiyle yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mahkeme, tarafların dinlenmesi, delillerin incelenmesi ve tahkikat işlemlerinin yapılmasını yukarıdaki fıkrada belirtilen duruşma hariç, iki duruşmada tamamlar. Duruşmalar arasındaki süre bir aydan daha uzun olamaz. İşin niteliği gereği bilirkişi incelemesinin uzaması, istinabe yoluyla tahkikat işlemlerinin yürütülmesi gibi zorunlu hâllerde, hâkim gerekçesini belirterek bir aydan sonrası için de duruşma günü belirleyebilir ve ikiden fazla duruşma yapabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Basit yargılama usulüne tabi davalarda, işlemden kaldırılmasına karar verilmiş olan dosya, yenilenmesinden sonra takipsiz bırakılırsa, dava açılmamış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="321" başlık="Hüküm">
      <mvz-fıkra no="1">
        <template>Tahkikatın tamamlanmasından sonra, mahkeme tarafların son beyanlarını alır ve yargılamanın sona erdiğini bildirerek kararını tefhim eder. Taraflara beyanda bulunabilmeleri için ayrıca süre verilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kararın tefhimi, mahkemece hükme ilişkin tüm hususların gerekçesi ile birlikte açıklanması ile gerçekleşir. Ancak zorunlu hâllerde, hâkim bu durumun sebebini de tutanağa geçirmek suretiyle, sadece hüküm özetini tutanağa yazdırarak kararı tefhim edebilir. Bu durumda gerekçeli kararın en geç bir ay içinde yazılarak tebliğe çıkartılması gerekir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="322" başlık="Uygulanacak hükümler">
      <mvz-fıkra no="1">
        <template>Bu Kanun ve diğer kanunlarda basit yargılama usulü hakkında hüküm bulunmayan hâllerde, yazılı yargılama usulüne ilişkin hükümler uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Paylaştırma ve ortaklığın giderilmesi için satış yapılması gereken hâllerde, hâkim satış için bir memur görevlendirir. Taşınır ve taşınmaz malların satışı İcra ve İflas Kanunu hükümlerine göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="7-YEDİNCİ" başlık="Yargılama Giderleri ve Adli Yardım">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Yargılama Giderleri">
      <mvz-madde no="323" başlık="Yargılama giderlerinin kapsamı">
        <mvz-fıkra no="1">
          <template>Yargılama giderleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Başvurma, karar ve ilam harçları.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Dava nedeniyle yapılan tebliğ ve posta giderleri.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Dosya ve sair evrak giderleri.</template>
          </mvz-bent>
