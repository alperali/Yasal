            <mvz-bent no="f">
              <template>Vekil aracılığıyla takip edilen davalarda, vekilin davaya vekâlet ehliyetine sahip olması ve usulüne uygun düzenlenmiş bir vekâletnamesinin bulunması.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Davacının yatırması gereken gider avansının yatırılmış olması.</template>
            </mvz-bent>
            <mvz-bent no="ğ">
              <template>Teminat gösterilmesine ilişkin kararın gereğinin yerine getirilmesi.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Davacının, dava açmakta hukuki yararının bulunması.</template>
            </mvz-bent>
            <mvz-bent no="ı">
              <template>Aynı davanın, daha önceden açılmış ve hâlen görülmekte olmaması.</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Aynı davanın, daha önceden kesin hükme bağlanmamış olması.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Diğer kanunlarda yer alan dava şartlarına ilişkin hükümler saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="115" başlık="Dava şartlarının incelenmesi">
          <mvz-fıkra no="1">
            <template>Mahkeme, dava şartlarının mevcut olup olmadığını, davanın her aşamasında kendiliğinden araştırır. Taraflar da dava şartı noksanlığını her zaman ileri sürebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme, dava şartı noksanlığını tespit ederse davanın usulden reddine karar verir. Ancak, dava şartı noksanlığının giderilmesi mümkün ise bunun tamamlanması için kesin süre verir. Bu süre içinde dava şartı noksanlığı giderilmemişse davayı dava şartı yokluğu sebebiyle usulden reddeder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Dava şartı noksanlığı, mahkemece, davanın esasına girilmesinden önce fark edilmemiş, taraflarca ileri sürülmemiş ve fakat hüküm anında bu noksanlık giderilmişse, başlangıçtaki dava şartı noksanlığından ötürü, dava usulden reddedilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="İlk İtirazlar">
        <mvz-madde no="116" başlık="Konusu">
          <mvz-fıkra no="1">
            <template>İlk itirazlar aşağıdakilerden ibarettir:</template>
            <mvz-bent no="a">
              <template>Kesin yetki kuralının bulunmadığı hâllerde yetki itirazı.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Uyuşmazlığın tahkim yoluyla çözümlenmesi gerektiği itirazı.</template>
            </mvz-bent>
            <mvz-bent no="c" durum="mülga">
              <template></template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="117" başlık="İleri sürülmesi ve incelenmesi">
          <mvz-fıkra no="1">
            <template>İlk itirazların hepsi cevap dilekçesinde ileri sürülmek zorundadır; aksi hâlde dinlenemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İlk itirazlar, dava şartlarından sonra incelenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İlk itirazlar, ön sorunlar gibi incelenir ve karara bağlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Yazılı Yargılama Usulü">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Davanın Açılması">
      <mvz-madde no="118" başlık="Davanın açılma zamanı">
        <mvz-fıkra no="1">
          <template>Dava, dava dilekçesinin kaydedildiği tarihte açılmış sayılır. Dava dilekçesine davalı sayısı kadar örnek eklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Dava dilekçesinin kaydına ilişkin usul ve esaslar yönetmelikte belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="119" başlık="Dava dilekçesinin içeriği">
        <mvz-fıkra no="1">
          <template>Dava dilekçesinde aşağıdaki hususlar bulunur:</template>
          <mvz-bent no="a">
            <template>Mahkemenin adı.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Davacı ile davalının adı, soyadı ve adresleri.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Davacının Türkiye Cumhuriyeti kimlik numarası.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Varsa tarafların kanuni temsilcilerinin ve davacı vekilinin adı, soyadı ve adresleri.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Davanın konusu ve malvarlığı haklarına ilişkin davalarda, dava konusunun değeri.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Davacının iddiasının dayanağı olan bütün vakıaların sıra numarası altında açık özetleri.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>İddia edilen her bir vakıanın hangi delillerle ispat edileceği.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Dayanılan hukuki sebepler.</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Açık bir şekilde talep sonucu.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Davacının, varsa kanuni temsilcisinin veya vekilinin imzası.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkranın (a), (d), (e), (f) ve (g) bentleri dışında kalan hususların eksik olması hâlinde, hâkim davacıya eksikliği tamamlaması için bir haftalık kesin süre verir. Bu süre içinde eksikliğin tamamlanmaması hâlinde dava açılmamış sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="120" başlık="Harç ve gider avansının ödenmesi">
        <mvz-fıkra no="1">
          <template>Davacı, yargılama harçları ile her yıl Adalet Bakanlığınca çıkarılacak gider avansı tarifesinde belirlenecek olan tutarı, dava açarken mahkeme veznesine yatırmak zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Avansın yeterli olmadığının dava sırasında anlaşılması hâlinde, mahkemece, bu eksikliğin tamamlanması için davacıya iki haftalık kesin süre verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Taraflardan her birinin ikamesini talep ettiği delil için mahkemece belirlenen delil avansına ilişkin 324 üncü madde hükümleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="121" başlık="Belgelerin birlikte verilmesi">
        <mvz-fıkra no="1">
          <template>Dava dilekçesinde gösterilen ve davacının elinde bulunan belgelerin asıllarıyla birlikte harç ve vergiye tabi olmaksızın davalı sayısından bir fazla düzenlenmiş örneklerinin veya sadece örneklerinin dilekçeye eklenerek, mahkemeye verilmesi ve başka yerlerden getirtilecek belge ve dosyalar için de bunların bulunabilmesini sağlayıcı açıklamanın dilekçede yer alması zorunludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="122" başlık="Dava dilekçesinin tebliği">
        <mvz-fıkra no="1">
          <template>Dava dilekçesi, mahkeme tarafından davalıya tebliğ edilir. Davalının iki hafta içinde davaya cevap verebileceği tebliğ zarfında gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="123" başlık="Davanın geri alınması">
        <mvz-fıkra no="1">
          <template>Davacı, hüküm kesinleşinceye kadar, ancak davalının açık rızası ile davasını geri alabilir.  Bu takdirde davanın açılmamış sayılmasına karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="124" başlık="Tarafta iradî değişiklik">
        <mvz-fıkra no="1">
          <template>Bir davada taraf değişikliği, ancak karşı tarafın açık rızası ile mümkündür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu konuda kanunlarda yer alan özel hükümler saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ancak, maddi bir hatadan kaynaklanan veya dürüstlük kuralına aykırı olmayan taraf değişikliği talebi, karşı tarafın rızası aranmaksızın hâkim tarafından kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Dava dilekçesinde tarafın yanlış veya eksik gösterilmesi kabul edilebilir bir yanılgıya dayanıyorsa, hâkim karşı tarafın rızasını aramaksızın taraf değişikliği talebini kabul edebilir. Bu durumda hâkim, davanın tarafı olmaktan çıkarılan ve aleyhine dava açılmasına sebebiyet vermeyen kişi lehine yargılama giderlerine hükmeder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="125" başlık="Dava konusunun devri">
        <mvz-fıkra no="1">
          <template>Davanın açılmasından sonra, davalı taraf, dava konusunu üçüncü bir kişiye devrederse, davacı aşağıdaki yetkilerden birini kullanabilir:</template>
          <mvz-bent no="a">
            <template>İsterse, devreden tarafla olan davasından vazgeçerek, dava konusunu devralmış olan kişiye karşı davaya devam eder. Bu takdirde dava davacı lehine sonuçlanırsa, dava konusunu devreden ve devralan yargılama giderlerinden müteselsilen sorumlu olur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İsterse, davasını devreden taraf hakkında tazminat davasına dönüştürür.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Davanın açılmasından sonra, dava konusu davacı tarafından devredilecek olursa, devralmış olan kişi, görülmekte olan davada davacı yerine geçer ve dava kaldığı yerden itibaren devam eder.  Bu takdirde dava davacı aleyhine sonuçlanırsa, dava konusunu devreden ve devralan yargılama giderlerinden müteselsilen sorumlu olur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Cevap Dilekçesi">
      <mvz-madde no="126" başlık="Cevap dilekçesinin verilmesi">
        <mvz-fıkra no="1">
          <template>Davalı, cevap dilekçesini, davanın açılmış olduğu mahkemeye verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Cevap dilekçesine davacı sayısı kadar örnek eklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Cevap dilekçesi, havale edildiği tarihte verilmiş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Cevap dilekçesinin örneği mahkeme tarafından davacıya tebliğ edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="127" başlık="Cevap dilekçesini verme süresi">
        <mvz-fıkra no="1">
          <template>Cevap dilekçesini verme süresi, dava dilekçesinin davalıya tebliğinden itibaren iki haftadır. Ancak, durum ve koşullara göre cevap dilekçesinin bu süre içinde hazırlanmasının çok zor yahut imkânsız olduğu durumlarda, yine bu süre zarfında mahkemeye başvuran davalıya, cevap süresinin bitiminden itibaren işlemeye başlamak, bir defaya mahsus olmak ve bir ayı geçmemek üzere ek bir süre verilebilir. Ek cevap süresi talebi hakkında verilen karar taraflara derhâl bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="128" başlık="Süresinde cevap dilekçesi verilmemesinin sonucu">
        <mvz-fıkra no="1">
          <template>Süresi içinde cevap dilekçesi vermemiş olan davalı, davacının dava dilekçesinde ileri sürdüğü vakıaların tamamını inkâr etmiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="129" başlık="Cevap dilekçesinin içeriği">
        <mvz-fıkra no="1">
          <template>Cevap dilekçesinde aşağıdaki hususlar bulunur:</template>
          <mvz-bent no="a">
            <template>Mahkemenin adı.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Davacı ile davalının adı, soyadı ve adresleri; davalı yurt dışında ise açılan dava ile ilgili işlemlere esas olmak üzere yurt içinde göstereceği bir adres.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Davalının Türkiye Cumhuriyeti kimlik numarası.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Varsa, tarafların kanuni temsilcilerinin ve davacı vekilinin adı, soyadı ve adresleri.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Davalının savunmasının dayanağı olan bütün vakıaların sıra numarası altında açık özetleri.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Savunmanın dayanağı olarak ileri sürülen her bir vakıanın hangi delillerle ispat edileceği.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Dayanılan hukuki sebepler.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Açık bir şekilde talep sonucu.</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Davalının veya varsa kanuni temsilcisinin yahut vekilinin imzası.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>121 inci madde hükmü cevap dilekçesi hakkında da uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="130" başlık="Cevap dilekçesinde eksiklik bulunması">
        <mvz-fıkra no="1">
          <template>129 uncu maddenin birinci fıkrasının (a), (b), (c), (ç) ve (ğ) bentlerinin cevap dilekçesinde eksik olması hâlinde, bunun giderilmesi için hâkim tarafından bir haftalık süre verilir; eksikliğin bu süre zarfında da giderilmemesi hâlinde cevap dilekçesi verilmemiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="131" başlık="Cevap dilekçesi verilmesinin sonucu">
        <mvz-fıkra no="1">
          <template>Cevap dilekçesinin verilmesinden sonra, cevap süresi dolmamış olsa bile ilk itirazlar ileri sürülemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="132" başlık="Karşı dava açılabilmesinin şartları">
        <mvz-fıkra no="1">
          <template>Karşı dava açılabilmesi için;</template>
          <mvz-bent no="a">
            <template>Asıl davanın açılmış ve hâlen görülmekte olması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Karşı davada ileri sürülecek olan talep ile asıl davada ileri sürülen talep arasında takas veya mahsup ilişkisinin bulunması yahut bu davalar arasında bağlantının mevcut olması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belirtilen bu şartlar gerçekleşmeden karşı dava açılacak olursa, mahkeme, talep üzerine yahut resen, karşı davanın asıl davadan ayrılmasına; gerekiyorsa dosyanın görevli mahkemeye gönderilmesine karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Karşı davaya karşı, dava açılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="133" başlık="Karşı davanın açılması ve süresi">
        <mvz-fıkra no="1">
          <template>Karşı dava, cevap dilekçesiyle veya esasa cevap süresi içinde ayrı bir dilekçe verilmek suretiyle açılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Süresinden sonra karşı dava açılması hâlinde, mahkeme davaların ayrılmasına karar verir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="134" başlık="Asıl davanın sona ermesi">
        <mvz-fıkra no="1">
          <template>Asıl davanın herhangi bir sebeple sona ermesi, karşı davanın görülüp karara bağlanmasına engel oluşturmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="135" başlık="Uygulanacak hükümler">
        <mvz-fıkra no="1">
          <template>Bu Kanunun dava ile ilgili hükümleri, aksine özel düzenleme bulunmayan hâllerde, karşı dava hakkında da uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Cevaba Cevap ve İkinci Cevap Dilekçesi">
      <mvz-madde no="136" başlık="Tarafların ikinci dilekçeleri">
        <mvz-fıkra no="1">
          <template>Davacı, cevap dilekçesinin kendisine tebliğinden itibaren iki hafta içinde cevaba cevap dilekçesi; davalı da davacının cevabının kendisine tebliğinden itibaren iki hafta içinde ikinci cevap dilekçesi verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Davacının cevaba cevap, davalının da ikinci cevap dilekçesi hakkında, dava ve cevap dilekçelerine ilişkin hükümler, niteliğine aykırı düşmediği sürece kıyasen uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Ön İnceleme">
      <mvz-madde no="137" başlık="Ön incelemenin kapsamı">
        <mvz-fıkra no="1">
          <template>Dilekçelerin karşılıklı verilmesinden sonra ön inceleme yapılır. Mahkeme ön incelemede; dava şartlarını ve ilk itirazları inceler, uyuşmazlık konularını tam olarak belirler, hazırlık işlemleri ile tarafların delillerini sunmaları ve delillerin toplanması için gereken işlemleri yapar, tarafların üzerinde serbestçe tasarruf edebileceği davalarda onları sulhe veya arabuluculuğa teşvik eder ve bu hususları tutanağa geçirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ön inceleme tamamlanmadan ve gerekli kararlar alınmadan tahkikata geçilemez ve tahkikat için duruşma günü verilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="138" başlık="Dava şartları ve ilk itirazlar hakkında karar">
        <mvz-fıkra no="1">
          <template>Mahkeme, öncelikle dava şartları ve ilk itirazlar hakkında dosya üzerinden karar verir; gerektiği takdirde kararını vermeden önce, bu konuda tarafları ön inceleme duruşmasında dinleyebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="139" başlık="Ön inceleme duruşmasına davet">
        <mvz-fıkra no="1">
          <template>Mahkeme, dilekçelerin karşılıklı verilmesinden ve yukarıdaki maddelerde belirtilen incelemeyi tamamladıktan sonra, ön inceleme için bir duruşma günü tespit ederek taraflara bildirir.  Çıkarılacak davetiyede aşağıdaki hususlar ihtar edilir:</template>
          <mvz-bent no="a">
            <template>Duruşma davetiyesine ve sonuçlarına ilişkin diğer hususlar.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Tarafların sulh için gerekli hazırlığı yapmaları.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Duruşmaya sadece taraflardan birinin gelmesi ve yargılamaya devam etmek istemesi durumunda gelmeyen tarafın yokluğunda yapılan işlemlere itiraz edemeyeceği.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Davetiyenin tebliğinden itibaren iki haftalık kesin süre içinde tarafların dilekçelerinde gösterdikleri, ancak henüz sunmadıkları belgeleri mahkemeye sunmaları veya başka yerden getirtilecek belgelerin getirtilebilmesi amacıyla gereken açıklamayı yapmaları, bu hususların verilen süre içinde yerine getirilmemesi hâlinde o delile dayanmaktan vazgeçmiş sayılacaklarına karar verileceği.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="140" başlık="Ön inceleme duruşması">
        <mvz-fıkra no="1">
          <template>Hâkim, ön inceleme duruşmasında, dava şartları ve ilk itirazlar hakkında karar verebilmek için gerekli görürse tarafları dinler; daha sonra, tarafların iddia ve savunmaları çerçevesinde, anlaştıkları ve anlaşamadıkları hususları tek tek tespit eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Uyuşmazlık konularının tespitinden sonra hâkim, tarafları sulh ve arabuluculuğun esasları, süreci ve hukuki sonuçları hakkında aydınlatarak sulhe veya arabuluculuğa teşvik eder; bu konuda sonuç alınacağı kanaatine varırsa, bir defaya mahsus olmak üzere yeni bir duruşma günü tayin eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ön inceleme duruşmasının sonunda, tarafların sulh veya arabuluculuk faaliyetinden bir sonuç alıp almadıkları, sonuç alamadıkları takdirde anlaşamadıkları hususların nelerden ibaret olduğu tutanakla tespit edilir. Bu tutanağın altı, duruşmada hazır bulunan taraflarca imzalanır. Tahkikat bu tutanak esas alınmak suretiyle yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ön inceleme tek duruşmada tamamlanır. Zorunlu olan hâllerde bir defaya mahsus olmak üzere yeni bir duruşma günü tayin edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>139 uncu madde uyarınca yapılan ihtara rağmen dilekçelerinde gösterdikleri belgeleri sunmayan veya belgelerin getirtilmesi için gerekli açıklamayı yapmayan tarafın bu delillere dayanmaktan vazgeçmiş sayılmasına karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="141" başlık="İddia ve savunmanın genişletilmesi veya değiştirilmesi">
        <mvz-fıkra no="1">
          <template>Taraflar, cevaba cevap ve ikinci cevap dilekçeleri ile serbestçe iddia veya savunmalarını genişletebilir yahut değiştirebilirler. Dilekçelerin karşılıklı verilmesinden sonra iddia veya savunma genişletilemez yahut değiştirilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İddia ve savunmanın genişletilip değiştirilmesi konusunda ıslah ve karşı tarafın açık muvafakati hükümleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="142" başlık="Süreler hakkında karar">
        <mvz-fıkra no="1">
          <template>Ön inceleme duruşması tamamlandıktan sonra, hâkim tahkikata başlamadan önce, hak düşürücü süreler ile zamanaşımı hakkındaki itiraz ve def’ileri inceleyerek karara bağlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Tahkikat ve Tahkikat Sırasındaki Özel Durumlar">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Tahkikat">
        <mvz-madde no="143" başlık="Tahkikatın konusu">
          <mvz-fıkra no="1">
            <template>Tarafların davada ileri sürdükleri bütün iddia ve savunmalar birlikte incelenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkim, muhakemeyi basitleştirmek veya kısaltmak için resen veya taraflardan birinin talebi üzerine tahkikatın her aşamasında iddia veya savunmalardan birinin veya bir kısmının diğerinden önce incelenmesine karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="144" başlık="Tarafların dinlenilmesi">
          <mvz-fıkra no="1">
            <template>Tahkikat aşamasında mahkeme, her iki tarafı usulüne uygun olarak davet edip, davada ileri sürülen vakıalar hakkında dinleyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkemenin, dinlenilmek üzere mahkemeye gelmeleri için iki tarafa vereceği süre iki haftadan az olamaz. Bu süre, gerektiğinde, mahkemece resen veya iki taraftan birinin talebi üzerine uzatılabileceği gibi kısaltılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="145" başlık="Sonradan delil gösterilmesi">
          <mvz-fıkra no="1">
            <template>Taraflar, Kanunda belirtilen süreden sonra delil gösteremezler. Ancak bir delilin sonradan ileri sürülmesi yargılamayı geciktirme amacı taşımıyorsa veya süresinde ileri sürülememesi ilgili tarafın kusurundan kaynaklanmıyorsa, mahkeme o delilin sonradan gösterilmesine izin verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="146" başlık="Mevcut delillerle davanın aydınlanması">
          <mvz-fıkra no="1">
            <template>Mahkeme, taraflarca gösterilmiş olan delillerin incelenmesinden sonra, davanın muhakeme ve hüküm için yeterli derecede aydınlandığını anlarsa, tahkikatın bittiğini kendilerine bildirir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Duruşma">
        <mvz-madde no="147" başlık="Tarafların duruşmaya daveti">
          <mvz-fıkra no="1">
            <template>Taraflar, ön inceleme aşamasının tamamlanmasından sonra tahkikat ve sözlü yargılama için duruşmaya davet edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Taraflara gönderilecek davetiyede, belirlenen gün ve saatte geçerli bir özrü olmadan mahkemede hazır bulunmadıkları takdirde, duruşmaya yokluklarında devam edileceği ve yapılan işlemlere itiraz edemeyecekleri, tahkikatın sona erdiği duruşmada sözlü yargılamaya geçileceği, sözlü yargılama için duruşmanın ertelenmesi hâlinde taraflara ayrıca davetiye gönderilmeyeceği ve 150 nci madde hükmü saklı kalmak kaydıyla, yokluklarında hüküm verileceği bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Duruşmalar arasındaki süre üç aydan daha uzun olamaz. İşin niteliği gereği bilirkişi incelemesinin uzaması veya istinabe yoluyla tahkikat işlemlerinin yürütülmesi gibi zorunlu hâllerde, hâkim gerekçesini belirterek daha uzun bir süre belirleyebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="148" başlık="Mahkemenin çalışma zamanı">
          <mvz-fıkra no="1">
            <template>Mahkemeler, resmî çalışma gün ve saatlerinde görev yaparlar. Ancak, zorunluluk veya gecikmesinde zarar olan hâllerde, keşif, delillerin tespiti ve günlük duruşma listesinde yazılı işler gibi işlemlerin, resmî tatil günlerinde veya çalışma saatlerinin dışında da yapılmasına karar verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="149" başlık="Ses ve görüntü nakledilmesi yoluyla veya başka yerde duruşma icrası">
          <mvz-fıkra no="1">
            <template>Mahkeme, taraflardan birinin talebi üzerine talep eden tarafın veya vekilinin, aynı anda ses ve görüntü nakledilmesi yoluyla bulundukları yerden duruşmaya katılmalarına ve usul işlemleri yapabilmelerine karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme resen veya taraflardan birinin talebi üzerine; tanığın, bilirkişinin veya uzmanın aynı anda ses ve görüntü nakledilmesi yoluyla bulundukları yerden dinlenilmesine karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkeme, tarafların üzerinde serbestçe tasarruf edemeyecekleri dava ve işlerde ilgililerin, aynı anda ses ve görüntü nakledilmesi yoluyla bulundukları yerden dinlenilmesine resen karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Ses ve görüntü nakledilmesi yoluyla bulundukları yerden duruşmaya katılmasına karar verilenler hakkında, 154 üncü maddenin üçüncü fıkrasının (ç) bendinde belirtilen ikrar, yeminin edası, davanın geri alınmasına muvafakat, davadan feragat, davayı kabul ile sulh olma hâlleri hariç olmak üzere, elle atılan imzaya ilişkin hükümler uygulanmaz.</template>
          </mvz-fıkra>  
          <mvz-fıkra no="5">
            <template>Mahkeme, fiilî engel veya güvenlik sebebiyle duruşmanın il sınırları içinde başka bir yerde yapılmasına, yargı çevresi içinde yer aldığı bölge adliye mahkemesi adalet komisyonunun uygun görüşünü alarak karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikte belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="150" başlık="Tarafların duruşmaya gelmemesi, sonuçları ve davanın açılmamış sayılması">
          <mvz-fıkra no="1">
            <template>Usulüne uygun şekilde davet edilmiş olan taraflar, duruşmaya gelmedikleri veya gelip de davayı takip etmeyeceklerini bildirdikleri takdirde dosyanın işlemden kaldırılmasına karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Usulüne uygun şekilde davet edilmiş olan taraflardan biri duruşmaya gelir, diğeri gelmezse, gelen tarafın talebi üzerine, yargılamaya gelmeyen tarafın yokluğunda devam edilir veya dosya işlemden kaldırılır. Geçerli bir özrü olmaksızın duruşmaya gelmeyen taraf, yokluğunda yapılan işlemlere itiraz edemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Duruşma gününün belli edilmesi için tarafların başvurması gereken hâllerde gün tespit ettirilmemişse, son işlem tarihinden başlayarak bir ay geçmekle dosya işlemden kaldırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Dosyası işlemden kaldırılmış olan dava, işlemden kaldırıldığı tarihten başlayarak üç ay içinde taraflardan birinin dilekçe ile başvurusu üzerine yenilenebilir. Yenileme dilekçesi, duruşma gün, saat ve yeri ile birlikte taraflara tebliğ edilir. Dosyanın işlemden kaldırıldığı tarihten başlayarak bir ay geçtikten sonra yenileme talebinde bulunulursa, yeniden harç alınır, bu harç yenileyen tarafça ödenir ve karşı tarafa yüklenemez. Bu şekilde harç verilerek yenilenen dava, eski davanın devamı sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İşlemden kaldırıldığı tarihten başlayarak üç ay içinde yenilenmeyen davalar, sürenin dolduğu gün itibarıyla açılmamış sayılır ve mahkemece kendiliğinden karar verilerek kayıt kapatılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İşlemden kaldırılmasına karar verilmiş ve sonradan yenilenmiş olan dava, ilk yenilenmeden sonra bir defadan fazla takipsiz bırakılamaz. Aksi hâlde dava açılmamış sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Hangi sebeple olursa olsun açılmamış sayılan davadaki talep dahi vaki olmamış sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="151" başlık="Duruşma düzeni">
          <mvz-fıkra no="1">
            <template>Hâkim, duruşmanın düzenini bozan kimseyi, bunu yapmaktan men eder ve gerekirse, avukatlar hariç, derhâl duruşma salonundan çıkarılmasını emreder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir kimse, ihtara rağmen mahkemenin düzenini bozar veya mahkeme huzurunda uygun olmayan bir söz söylemeye veya davranışta bulunmaya devam ederse derhâl yakalanır ve hakkında dört güne kadar disiplin hapsi uygulanır. Bu fıkra hükmü avukatlar hakkında uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkemenin düzenini bozan eylem veya mahkeme huzurunda söylenen uygun olmayan söz veya davranış, ayrıca bir suç oluşturuyor ise bu durum bir tutanak ile Cumhuriyet başsavcılığına gönderilir ve gerekiyorsa, avukatlar hariç, fiili işleyenin tutuklanmasına da karar verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="152" başlık="Soru yöneltme">
          <mvz-fıkra no="1">
            <template>Duruşmaya katılan taraf vekilleri; tanıklara, bilirkişilere ve duruşmaya çağrılan diğer kişilere, duruşma disiplinine uygun olarak doğrudan soru yöneltebilirler. Taraflar ise hâkim aracılığıyla soru sorabilirler. Yöneltilen soruya itiraz edildiğinde, sorunun yöneltilmesinin gerekip gerekmediğine hâkim karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Toplu mahkemelerde, hâkimlerden her biri, birinci fıkrada belirtilen kişilere soru sorabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="153" başlık="Kayıt ve yayın yasağı">
          <mvz-fıkra no="1">
            <template>Duruşma sırasında fotoğraf çekilemez ve hiçbir şekilde ses ve görüntü kaydı yapılamaz. Ancak, dava dosyasında saklı kalmak kaydıyla, yargılamanın zorunlu kıldığı hâllerde, mahkemece çekim yapılabilir ve kayıt alınabilir. Bu şekilde yapılan çekim ve kayıtlar ile kişilik haklarını ilgilendiren konuları içeren dava dosyası içindeki her türlü belge ve tutanak, mahkemenin ve ilgili kişilerin açık izni olmadıkça hiçbir yerde yayımlanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Duruşma sırasında bu yasağa aykırı davranan kişi hakkında 151 inci madde hükmü uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kayıt ve yayın yasağına aykırı davranan kişi hakkında, ayrıca Türk Ceza Kanununun 286 ncı maddesi hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="154" başlık="Tutanak">
          <mvz-fıkra no="1">
            <template>Hâkim, tahkikat ve yargılama işlemlerinin icrasıyla, iki tarafın ve diğer ilgililerin sözlü açıklamalarını, gerekirse özet olarak zabıt kâtibi aracılığıyla tutanağa kaydettirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Taraflar veya diğer ilgililer sözlü açıklamalarını hâkimin izniyle doğrudan da tutanağa yazdırabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Aşağıdaki hususlar mutlak olarak tutanağa yazılır:</template>
            <mvz-bent no="a">
              <template>Mahkemenin adı, duruşmanın açıldığı yer, gün ve saat.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hâkim, zabıt kâtibi, hazır bulunan taraflar ve varsa vekilleri, kanuni temsilcileri, fer’î müdahil ve tercümanın ad ve soyadları.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Yargılamanın aleni ya da gizli yapıldığı.</template>
            </mvz-bent>
            <mvz-bent no="ç">
              <template>Beyanda bulunana okunmak ve imzası alınmak kaydıyla ikrar, yeminin edası, davanın geri alınmasına muvafakat, davadan feragat, davayı kabule ilişkin beyanlar ve sulh müzakereleri ile sonucu.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Beyanda bulunana okunmak kaydıyla taraf, tanık, bilirkişi veya uzman kişi beyanı.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Duruşma dışında yapılan işlemlerin özeti.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Tarafların sundukları belgelerin neler olduğu.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Tarafların soruşturmaya ilişkin istekleri ile diğer kanunların tutanağa yazılmasını emrettiği konular.</template>
            </mvz-bent>
            <mvz-bent no="ğ">
              <template>Ara kararları ve hükmün sonucu.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Karar veya hükmün açıklanma biçimi.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Tutanakta sözü edilen veya dosyaya konduğu belirtilen belgeler de tutanağın eki sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Tahkikat ve yargılama sırasında yapılan işlemler teknik araçlarla kayda alınırsa, bu durum bir tutanakla tespit olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="155" başlık="Tutanağın imzalanması ve imza atamayanların durumu">
          <mvz-fıkra no="1">
            <template>Tutanak, hâkim ve zabıt kâtibi tarafından derhâl imzalanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tutanağa imza atamayacak durumda olan kimsenin parmak izi alınır, bunun hangi parmağa ait olduğu belirtilir. Ancak elinde parmak bulunmayanlar, imza yerine mühür veya özel işaret kullanabilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="156" başlık="Tutanağın ispat gücü">
          <mvz-fıkra no="1">
            <template>Ön inceleme, tahkikat ve yargılama işlemleri, ancak tutanakla ispat olunabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="157" başlık="Zabıt kâtibi bulundurulması zorunluluğu">
          <mvz-fıkra no="1">
            <template>Mahkemede veya mahkeme dışında hâkim huzuruyla yapılacak bütün işlemlerde zabıt kâtibinin hazır bulunması zorunludur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hukuki veya fiilî engellerle zabıt kâtibi görev yapamayacak durumda olur ve işin gecikmesinde sakınca bulunursa, görevin niteliğine uygun yemin ettirilmek koşuluyla, başka bir kimse, zabıt kâtibi olarak görevlendirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="158" başlık="Tutanak örneği verilmesi">
          <mvz-fıkra no="1">
            <template>Tutanakların tamamı veya bir kısmının örnekleri, talep hâlinde taraflara veya fer’î müdahile verilir. Bu örneklere mahkemenin mührü basılır ve aslına uygun olduğu yazı işleri müdürü tarafından imza olunarak onaylanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tutanağın eki niteliğinde bulunan ve gizlilik kararı kapsamında kalan belgelerin örneği ancak hâkimin izni ile verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="159" başlık="Dosyaya belge konulması ve dosyanın başka yere gönderilmesi">
          <mvz-fıkra no="1">
            <template>Dava ile ilgili mahkemeye sunulan her türlü dilekçe ve belge hâkim veya yazı işleri müdürüne havale ettirildikten sonra, zabıt kâtibi tarafından dosyasına konulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dosyanın başka bir resmî mercie gönderilmesi gerektiğinde, hâkim resen veya talep üzerine dosyada yer alan bir belgenin aslı yerine onaylı bir örneğinin gönderilmesine karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="160" başlık="Dizi listesi">
          <mvz-fıkra no="1">
            <template>Zabıt kâtibi, dosya içindeki her tür belgeyi gösteren bir dizi listesi düzenlemek zorundadır. Dosyaya ibraz edilen veya çıkarılan belgeler derhâl bu listeye kaydedilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="161" başlık="Dosyanın taraflar ve ilgililerce incelenmesi">
          <mvz-fıkra no="1">
            <template>Zabıt kâtibinin gözetimi altında taraflar veya fer’î müdahil, dava dosyasını inceleyebilir. Dava ile ilgili olanlar da bunu ispatlamak kaydı ve hâkimin izniyle dosyayı inceleyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gizli olarak saklanmasına karar verilen belge ve tutanakların incelenebilmesi hâkimin açık iznine bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="162" başlık="Dosyanın hâkimin incelemesine hazır tutulması">
          <mvz-fıkra no="1">
            <template>Zabıt kâtibi, yargılamadan evvel ve gerektiği hâllerde dava dosyasını incelenmek için hâkime vermek ve zamanında eksiksiz almak ile görevlidir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Ön Sorun ve Bekletici Sorun">
        <mvz-madde no="163" başlık="Ön sorunun ileri sürülmesi">
          <mvz-fıkra no="1">
            <template>Yargılama sırasında, davaya ilişkin bir ön sorun ortaya çıkarsa, ilgili taraf, bunu dilekçe vermek suretiyle yahut duruşma sırasında sözlü olarak ileri sürebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="164" başlık="Ön sorunun incelenmesi">
          <mvz-fıkra no="1">
            <template>Hâkim, taraflardan birinin ileri sürdüğü ön sorunu incelemeye değer bulursa, belirleyeceği süre içinde, varsa delilleriyle birlikte cevabını bildirmesi için diğer tarafa tefhim veya tebliğ eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ön sorun hakkında iki taraf arasında uyuşmazlık varsa, hâkim gerekirse tarafları davet edip dinledikten sonra kararını verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hâkim, ön sorun hakkındaki kararını taraflara tefhim veya tebliğ eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="165" başlık="Bekletici sorun">
          <mvz-fıkra no="1">
            <template>Bir davada hüküm verilebilmesi, başka bir davaya, idari makamın tespitine yahut dava konusuyla ilgili bir hukuki ilişkinin mevcut olup olmadığına kısmen veya tamamen bağlı ise mahkemece o davanın sonuçlanmasına veya idari makamın kararına kadar yargılama bekletilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir davanın incelenmesi ve sonuçlandırılması başka bir davanın veya idari makamın çözümüne bağlı ise mahkeme, ilgili tarafa görevli mahkemeye veya idari makama başvurması için uygun bir süre verir. Bu süre içinde görevli mahkemeye veya idari makama başvurulmadığı takdirde, ilgili taraf bu husustaki iddiasından vazgeçmiş sayılarak esas dava hakkında karar verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="Davaların Birleştirilmesi ve Ayrılması">
        <mvz-madde no="166" başlık="Davaların birleştirilmesi">
          <mvz-fıkra no="1">
            <template>Aynı yargı çevresinde yer alan aynı düzey ve sıfattaki hukuk mahkemelerinde açılmış davalar, aralarında bağlantı bulunması durumunda, davanın her aşamasında, talep üzerine veya kendiliğinden ilk davanın açıldığı mahkemede birleştirilebilir. İlk davanın açıldığı mahkeme birleştirme kararının kesinleşmesinden itibaren bununla bağlıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Davalar, ayrı yargı çevrelerinde yer alan aynı düzey ve sıfattaki hukuk mahkemelerinde açılmış ise bağlantı sebebiyle birleştirme ikinci davanın açıldığı mahkemeden talep edilebilir. Birinci davanın açıldığı mahkeme, talebin kabulü ile davaların birleştirilmesine ilişkin kararın kesinleşmesinden itibaren, bununla bağlıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birleştirme kararı, derhâl ilk davanın açıldığı mahkemeye bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Davaların aynı veya birbirine benzer sebeplerden doğması ya da biri hakkında verilecek hükmün diğerini etkileyecek nitelikte bulunması durumunda, bağlantı var sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İstinaf incelemesi ayrı dairelerde yapılması gereken davaların da bu madde hükmüne göre birleştirilmesine karar verilebilir. Bu hâlde istinaf incelemesi, birleştirilen davalarda uyuşmazlığı doğuran asıl hukuki ilişkiye ait kararı inceleyen bölge adliye mahkemesi dairesinde yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="167" başlık="Davaların ayrılması">
          <mvz-fıkra no="1">
            <template>Mahkeme, yargılamanın iyi bir şekilde yürütülmesini sağlamak için, birlikte açılmış veya sonradan birleştirilmiş davaların ayrılmasına, davanın her aşamasında, talep üzerine veya kendiliğinden karar verebilir. Bu durumda mahkeme, ayrılmasına karar verilen davalara bakmaya devam eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="168" başlık="Kanun yolları">
          <mvz-fıkra no="1">
            <template>Aynı yargı çevresinde yer alan aynı düzey ve sıfattaki hukuk mahkemelerinde görülmekte olan davalar yönünden verilen birleştirme kararına karşı sadece istinaf yoluna başvurulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İlk derece mahkemelerince verilen ayırma kararlarına karşı istinaf yoluna; bölge adliye mahkemelerinin birleştirme ve ayırma kararları hakkında ise temyiz yoluna, ancak hükümle birlikte gidilebilir. Şu kadar ki, bu husus tek başına, bölge adliye mahkemesinde hükmün kaldırılarak esastan incelenme; Yargıtayda ise bozma sebebi teşkil etmez.</template>
          </mvz-fıkra>  
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="5-BEŞİNCİ" başlık="İsticvap">
        <mvz-madde no="169" başlık="Konusu">
          <mvz-fıkra no="1">
            <template>Mahkeme, kendiliğinden veya talep üzerine taraflardan her birinin isticvabına karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İsticvap, davanın temelini oluşturan vakıalar ve onunla ilişkisi bulunan hususlar hakkında olur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="170" başlık="İsticvap olunacak kişilerin belirlenmesi">
          <mvz-fıkra no="1">
            <template>Tüzel kişiler adına, temsil yetkisine sahip kimseler isticvap olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ergin olmayan veya kısıtlı bir kimse adına yapılmış bir işleme ilişkin olarak, o kişinin kanuni mümessili isticvap olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ergin olmayan veya kısıtlı kimselere bizzat dava hakkı tanınan hâllerde, ikinci fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="171" başlık="İsticvap olunacak tarafın davet edilmesi">
          <mvz-fıkra no="1">
            <template>İsticvabına karar verilen kimseye bizzat davetiye gönderilir ve belirlenen gün ve saatte isticvap olunmak üzere hazır bulunması gerektiği belirtilir. Davetiyede, ayrıca, isticvap konusu vakıalar gösterilir; ilgili tarafın geçerli bir özrü olmaksızın gelmediği veya gelip de sorulara cevap vermediği takdirde, isticvap konusu vakıaları ikrar etmiş sayılacağı ihtarı da yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Çağrılan taraf özürsüz olarak gelmediği veya gelip de soruları cevapsız bıraktığı takdirde, mahkemece sorulan vakıalar ikrar edilmiş sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="172" başlık="Bizzat isticvap olunma">
          <mvz-fıkra no="1">
            <template>İsticvap olunacak kimsenin bizzat gelmesi gereklidir. Ancak, isticvap olunacak kişi, mahkemenin bulunduğu il dışında oturuyor ve bulunduğu yerde aynı anda ses ve görüntü nakledilmesi yolu ile isticvap olunması mümkün değil ise istinabe yolu ile isticvap olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İsticvap olunacak kimse hastalık, engellilik veya benzeri sebeplerle mahkemeye bizzat gelemeyecek durumda ise bulunduğu yerde isticvap olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="173" başlık="İsticvabın yapılması">
          <mvz-fıkra no="1">
            <template>İsticvabına karar verilen kimse bizzat isticvap olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkim, isticvaba başlamadan önce isticvap olunan tarafa gerçeği söylemesi gerektiği hususunu hatırlatır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İsticvap esnasında, karşı taraf ve taraf vekilleri hazır bulunabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İsticvap olunan taraf, mahkemenin izni olmadıkça, yazılı notlar kullanamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="174" başlık="Tutanak düzenlenmesi">
          <mvz-fıkra no="1">
            <template>İsticvap sonunda bir tutanak düzenlenir. İsticvap olunan tarafça yapılan açıklamalar, sorulan sorular ve verilen cevaplar tutanağa yazılır. Tutanak taraflar huzurunda okunduktan sonra altı isticvap olunan tarafa imzalatılır. İsticvap olunan taraf haklı bir gerekçe göstermeksizin tutanağı imzalamaktan kaçınırsa, bu durum hâkim tarafından tutanakla tespit olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="175" başlık="Kıyasen uygulanacak hükümler">
          <mvz-fıkra no="1">
            <template>Tanıklığa ilişkin 249, 250, 259 ilâ 263 üncü madde hükümleri niteliğine aykırı düşmediği sürece isticvapta da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="6-ALTINCI" başlık="Islah ve Maddi Hataların Düzeltilmesi">
        <mvz-madde no="176" başlık="Kapsamı ve sayısı">
          <mvz-fıkra no="1">
            <template>Taraflardan her biri, yapmış olduğu usul işlemlerini kısmen veya tamamen ıslah edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aynı davada, taraflar ancak bir kez ıslah yoluna başvurabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="177" başlık="Islahın zamanı ve şekli">
          <mvz-fıkra no="1">
            <template>Islah, tahkikatın sona ermesine kadar yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yargıtayın bozma kararından veya bölge adliye mahkemesinin kaldırma kararından sonra dosya ilk derece mahkemesine gönderildiğinde, ilk derece mahkemesinin tahkikata ilişkin bir işlem yapması hâlinde tahkikat sona erinceye kadar da ıslah yapılabilir. Ancak bozma kararına uymakla ortaya çıkan hukuki durum ortadan kaldırılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Islah, sözlü veya yazılı olarak yapılabilir. Karşı taraf duruşmada hazır değilse veya ıslah talebi duruşma dışında yapılıyorsa, bu yazılı talep veya tutanak örneği, haber vermek amacıyla karşı tarafa bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="178" başlık="Islah sebebiyle ortaya çıkan yargılama giderleri ve karşı tarafın zararının ödenmesi">
          <mvz-fıkra no="1">
            <template>Islah eden taraf, ıslah sebebiyle geçersiz hâle gelen işlemler için yapılan yargılama giderleri ile karşı tarafın uğradığı ve uğrayabileceği zararları karşılamak üzere hâkimin takdir edeceği teminatı, bir hafta içinde, mahkeme veznesine yatırmak zorundadır. Aksi hâlde, ıslah yapılmamış sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Karşı tarafın zararının kesin olarak tespit edilmesinden sonra, mahkeme veznesine yatırılan miktar eksikse tamamlattırılır, fazla ise iade edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="179" başlık="Islahın etkisi">
          <mvz-fıkra no="1">
            <template>Islah, bunu yapan tarafın teşmil edeceği noktadan itibaren, bütün usul işlemlerinin yapılmamış sayılması sonucunu doğurur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ancak ikrar, tanık ifadeleri, bilirkişi rapor ve beyanları, keşif ve isticvap tutanakları, yerine getirilmiş olan veya henüz yerine getirilmemiş olmakla beraber, karşı tarafın yerine getireceğini ıslahtan önce bildirmiş olması koşuluyla, yeminin teklifi, reddi veya iadesi ıslah ile geçersiz kılınamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Şu kadar ki, ıslahtan sonra yapılacak tahkikat sonucuna göre, bu işlemlerin göz önünde tutulması gerekmiyorsa, bunlar da yapılmamış sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="180" başlık="Davanın tamamen ıslahı">
          <mvz-fıkra no="1">
            <template>Davasını tamamen ıslah ettiğini bildiren taraf, bu bildirimden itibaren bir hafta içinde yeni bir dava dilekçesi vermek zorundadır. Aksi hâlde, ıslah hakkı kullanılmış sayılır ve ıslah hiç yapılmamış gibi davaya devam edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="181" başlık="Kısmen ıslah">
          <mvz-fıkra no="1">
            <template>Kısmen ıslaha başvuran tarafa, ıslah ettiği usul işlemini yapması için bir haftalık süre verilir. Bu süre içinde ıslah edilen işlem yapılmazsa, ıslah hiç yapılmamış gibi davaya devam edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="182" başlık="Kötüniyetli ıslah">
          <mvz-fıkra no="1">
            <template>Islahın davayı uzatmak veya karşı tarafı rahatsız etmek gibi kötüniyetli düşüncelerle yapıldığı deliller veya belirtilerle anlaşılırsa, mahkeme, ıslahı dikkate almadan karar verir. Ayrıca hâkim, kötüniyetle ıslaha başvuranı, karşı tarafın bu yüzden uğradığı bütün zararlarını ödemeye ve beşyüz Türk Lirasından beşbin Türk Lirasına kadar disiplin para cezasına mahkûm eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="183" başlık="Maddi hataların düzeltilmesi">
          <mvz-fıkra no="1">
            <template>Tarafların veya mahkemenin dava dosyasında bulunan belgelerdeki açık yazı ve hesap hataları, karar verilinceye kadar düzeltilebilir. Taraflardan birinin yazı veya hesap hatasını düzeltmesi sonucu yargılama uzamışsa, yargılama giderlerinin belirlenmesinde bu durum da dikkate alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
      <mvz-ayırım no="7-YEDİNCİ" başlık="Toplu Mahkemelerde Tahkikat">
        <mvz-madde no="183/A" başlık="Toplu mahkemelerde tahkikat">
          <mvz-fıkra no="1">
            <template>Dava açılmadan önce veya dava açıldıktan sonra talep edilen delil tespiti, ihtiyati haciz ve ihtiyati tedbir gibi geçici hukuki koruma tedbirleri de dâhil olmak üzere toplu mahkemenin görevine giren dava ve işlerde tüm yargılama aşamaları heyet tarafından yerine getirilir ve karara bağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Heyet, diğer kanunlardaki hükümler saklı kalmak kaydıyla, iş veya davanın özelliğine göre tahkikatın, tahkikat hâkimi olarak görevlendirilen bir üye tarafından yapılmasına karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tahkikatın heyetçe yürütüldüğü iş veya davalarda mahkeme başkanı, belirli bazı tahkikat işlemlerini yapmak üzere, üyelerden birini naip hâkim olarak görevlendirebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Mahkeme başkanı, mahkemenin uyumlu, verimli ve düzenli çalışmasını sağlar ve bu yolda uygun göreceği önlemleri alır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="6-ALTINCI" başlık="Tahkikatın Sona Ermesi ve Sözlü Yargılama">
      <mvz-madde no="184" başlık="Tahkikatın sona ermesi">
        <mvz-fıkra no="1">
          <template>Hâkim, tarafların iddia ve savunmalarıyla toplanan delilleri inceledikten sonra, duruşmada hazır bulunan taraflara tahkikatın tümü hakkında açıklama yapabilmeleri için söz verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme tarafların tahkikatın tümü hakkındaki açıklamalarından sonra, tahkikatı gerektiren bir husus kalmadığını görürse, tahkikatın bittiğini taraflara tefhim eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="185" başlık="Toplu mahkemelerde tahkikatın sona ermesi">
        <mvz-fıkra no="1">
          <template>Toplu mahkemelerde, tahkikatı yapmakla görevlendirilen hâkim, tahkikatın tamamlandığı kanaatine varırsa, tarafların davanın tümü hakkında açıklama yapabilmeleri için dosyayı mahkeme başkanına verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Toplu mahkeme, gerçeğin ortaya çıkması için gerekli görürse tahkikat için görevlendirilen hâkim tarafından dinlenen tanıkları ve bilirkişiyi tekrar çağırıp dinleyebileceği gibi, davanın maddi vakıaları hakkında gösterilen ve mahkemeye verilememiş veya getirtilmemiş olan delillerin verilmesini veya getirtilmesini de kararlaştırabilir. Kurul, eksik gördüğü tahkikatı kendisi tamamlayabileceği gibi hâkimlerden birine de verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Toplu mahkeme, tarafların tahkikatın tümü hakkındaki açıklamalarından sonra, tahkikatı gerektiren bir husus kalmadığını görürse, tahkikatın bittiğini tefhim eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="186" başlık="Sözlü yargılama">
        <mvz-fıkra no="1">
          <template>Mahkeme, tahkikatın bittiğini tefhim ettikten sonra aynı duruşmada sözlü yargılama aşamasına geçer. Bu durumda taraflardan birinin talebi üzerine duruşma iki haftadan az olmamak üzere ertelenir. Hazır bulunsun veya bulunmasın sözlü yargılama için taraflara ayrıca davetiye gönderilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sözlü yargılamada mahkeme, taraflara son sözlerini sorar ve hükmünü verir.  Şu kadar ki, 150 nci madde hükmü saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="İspat ve Deliller">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-madde no="187" başlık="İspatın konusu">
        <mvz-fıkra no="1">
          <template>İspatın konusunu tarafların üzerinde anlaşamadıkları ve uyuşmazlığın çözümünde etkili olabilecek çekişmeli vakıalar oluşturur ve bu vakıaların ispatı için delil gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Herkesçe bilinen vakıalarla, ikrar edilmiş vakıalar çekişmeli sayılmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="188" başlık="İkrar">
        <mvz-fıkra no="1">
          <template>Tarafların veya vekillerinin mahkeme önünde ikrar ettikleri vakıalar, çekişmeli olmaktan çıkar ve ispatı gerekmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Maddi bir hatadan kaynaklanmadıkça ikrardan dönülemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sulh görüşmeleri sırasında yapılan ikrar tarafları bağlamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="189" başlık="İspat hakkı">
        <mvz-fıkra no="1">
          <template>Taraflar, kanunda belirtilen süre ve usule uygun olarak ispat hakkına sahiptir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hukuka aykırı olarak elde edilmiş olan deliller, mahkeme tarafından bir vakıanın ispatında dikkate alınamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kanunun belirli delillerle ispatını emrettiği hususlar, başka delillerle ispat olunamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bir vakıanın ispatı için gösterilen delilin caiz olup olmadığına mahkemece karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="190" başlık="İspat yükü">
        <mvz-fıkra no="1">
          <template>İspat yükü, kanunda özel bir düzenleme bulunmadıkça, iddia edilen vakıaya bağlanan hukuki sonuçtan kendi lehine hak çıkaran tarafa aittir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanuni bir karineye dayanan taraf, sadece karinenin temelini oluşturan vakıaya ilişkin ispat yükü altındadır. Kanunda öngörülen istisnalar dışında, karşı taraf, kanuni karinenin aksini ispat edebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="191" başlık="Karşı ispat">
        <mvz-fıkra no="1">
          <template>Diğer taraf, ispat yükünü taşıyan tarafın iddiasının doğru olmadığı hakkında delil sunabilir. Karşı ispat faaliyeti için delil sunan taraf, ispat yükünü üzerine almış sayılmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="192" başlık="Kanunda düzenlenmemiş deliller">
        <mvz-fıkra no="1">
          <template>Kanunun belirli bir delille ispat zorunluluğunu öngörmediği hâllerde, Kanunda düzenlenmemiş olan diğer delillere de başvurulabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="193" başlık="Delil sözleşmesi">
        <mvz-fıkra no="1">
          <template>Taraflar yazılı olarak veya mahkeme önünde tutanağa geçirilecek imzalı beyanlarıyla kanunda belirli delillerle ispatı öngörülen vakıaların başka delil veya delillerle ispatını kararlaştırabilecekleri gibi; belirli delillerle ispatı öngörülmeyen vakıaların da sadece belirli delil veya delillerle ispatını kabul edebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Taraflardan birinin ispat hakkının kullanımını imkânsız kılan veya fevkalade güçleştiren delil sözleşmeleri geçersizdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="194" başlık="Somutlaştırma yükü ve delillerin gösterilmesi">
        <mvz-fıkra no="1">
          <template>Taraflar, dayandıkları vakıaları, ispata elverişli şekilde somutlaştırmalıdırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tarafların, dayandıkları delilleri ve hangi delilin hangi vakıanın ispatı için gösterildiğini açıkça belirtmeleri zorunludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="195" başlık="Başka yerden getirtilecek deliller">
        <mvz-fıkra no="1">
          <template>Tarafların ellerinde bulunmayan ve incelenmesine karar verilen delillerin getirtilmesi için, mahkemece ilgili resmî makam ve mercilerle üçüncü kişilere bu husus bildirilir. Mahkemeye getirtilmesi mümkün olmayan deliller, bulunduğu yerde incelenebilir veya dinlenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="196" başlık="Delilden vazgeçme">
        <mvz-fıkra no="1">
          <template>Delil gösteren taraf, karşı tarafın açık izni olmadıkça, o delile dayanmaktan vazgeçemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="197" başlık="Delillerin incelenmesi ve istinabe">
        <mvz-fıkra no="1">
          <template>Kanunda belirtilen hâller dışında, deliller davaya bakan mahkeme huzurunda, mümkün olduğu kadar birlikte ve aynı duruşmada incelenir. Zorunlu hâllerde, bazı delillerin incelenmesi başka bir duruşmaya bırakılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başka yerde bulunan ve mahkemeye getirilemeyen deliller, o yerde istinabe yoluyla toplanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Delillerin incelenmesi veya beyanların dinlenmesi sırasında taraflar, istinabe olunan mahkemede hazır bulunabilir ve delillerle ilgili açıklama haklarını kullanabilirler. Bu hususu sağlamak için, taraflara incelemenin yapılacağı tarih ve yer bildirilir. Bu davet üzerine taraflar istinabe olunan mahkemede hazır bulunmasalar dahi deliller incelenir veya beyanlar dinlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="198" başlık="Delillerin değerlendirilmesi">
        <mvz-fıkra no="1">
          <template>Kanuni istisnalar dışında hâkim delilleri serbestçe değerlendirir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Belge ve Senet">
      <mvz-madde no="199" başlık="Belge">
        <mvz-fıkra no="1">
          <template>Uyuşmazlık konusu vakıaları ispata elverişli yazılı veya basılı metin, senet, çizim, plan, kroki, fotoğraf, film, görüntü veya ses kaydı gibi veriler ile elektronik ortamdaki veriler ve bunlara benzer bilgi taşıyıcıları bu Kanuna göre belgedir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="200" başlık="Senetle ispat zorunluluğu">
        <mvz-fıkra no="1">
          <template>Bir hakkın doğumu, düşürülmesi, devri, değiştirilmesi, yenilenmesi, ertelenmesi, ikrarı ve itfası amacıyla yapılan hukuki işlemlerin, yapıldıkları zamanki miktar veya değerleri ikibinbeşyüz Türk Lirasını geçtiği takdirde senetle ispat olunması gerekir. Bu hukuki işlemlerin miktar veya değeri ödeme veya borçtan kurtarma gibi bir nedenle ikibinbeşyüz Türk Lirasından aşağı düşse bile senetsiz ispat olunamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu madde uyarınca senetle ispatı gereken hususlarda birinci fıkradaki düzenleme hatırlatılarak karşı tarafın açık muvafakati hâlinde tanık dinlenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="201" başlık="Senede karşı tanıkla ispat yasağı">
        <mvz-fıkra no="1">
          <template>Senede bağlı her çeşit iddiaya karşı ileri sürülen ve senedin hüküm ve kuvvetini ortadan kaldıracak veya azaltacak nitelikte bulunan hukuki işlemler ikibinbeşyüz Türk Lirasından az bir miktara ait olsa bile tanıkla ispat olunamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="202" başlık="Delil başlangıcı">
        <mvz-fıkra no="1">
          <template>Senetle ispat zorunluluğu bulunan hâllerde delil başlangıcı bulunursa tanık dinlenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Delil başlangıcı, iddia konusu hukuki işlemin tamamen ispatına yeterli olmamakla birlikte, söz konusu hukuki işlemi muhtemel gösteren ve kendisine karşı ileri sürülen kimse veya temsilcisi tarafından verilmiş veya gönderilmiş belgedir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="203" başlık="Senetle ispat zorunluluğunun istisnaları">
        <mvz-fıkra no="1">
          <template>Aşağıdaki hâllerde tanık dinlenebilir:</template>
          <mvz-bent no="a">
            <template>Altsoy ve üstsoy, kardeşler, eşler, kayınbaba, kaynana ile gelin ve damat arasındaki işlemler.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İşin niteliğine ve tarafların durumlarına göre, senede bağlanmaması teamül olarak yerleşmiş bulunan hukuki işlemler.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yangın, deniz kazası, deprem gibi senet alınmasında imkânsızlık veya olağanüstü güçlük bulunan hâllerde yapılan işlemler.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Hukuki işlemlerde irade bozukluğu ile aşırı yararlanma iddiaları.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Hukuki işlemlere ve senetlere karşı üçüncü kişilerin muvazaa iddiaları.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Bir senedin sahibi elinde beklenmeyen bir olay veya zorlayıcı bir nedenle yahut usulüne göre teslim edilen bir memur elinde veya noterlikte herhangi bir şekilde kaybolduğu kanısını kuvvetlendirecek delil veya emarelerin bulunması hâli.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="204" başlık="İlamların ve resmî senetlerin ispat gücü">
        <mvz-fıkra no="1">
          <template>İlamlar ile düzenleme şeklindeki noter senetleri, sahteliği ispat olunmadıkça kesin delil sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İlgililerin beyanına dayanılarak noterlerin tasdik ettikleri senetlerle diğer yetkili memurların görevleri içinde usulüne uygun olarak düzenledikleri belgeler, aksi ispatlanıncaya kadar kesin delil sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme, yukarıdaki belgelerden biri hakkında şüphe uyandıran bir hâl görürse, ilgili daireden açıklama isteyebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="205" başlık="Adi senetlerin ispat gücü">
        <mvz-fıkra no="1">
          <template>Mahkeme huzurunda ikrar olunan veya mahkemece inkâr edenden sadır olduğu kabul edilen adi senetler, aksi ispat edilmedikçe kesin delil sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Usulüne göre güvenli elektronik imza ile oluşturulan elektronik veriler, senet hükmündedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hâkim, mahkemeye delil olarak sunulan elektronik imzalı belgenin, güvenli elektronik imza ile oluşturulmuş olup olmadığını resen inceler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="206" başlık="İmza atamayanların durumu">
        <mvz-fıkra no="1">
          <template>Okuma ve yazma bilmediği için imza atamayanların mühür veya bir alet ya da parmak izi kullanmak suretiyle yapacakları hukuki işlemleri içeren belgelerin senet niteliğini taşıyabilmesi, noterler tarafından düzenleme biçiminde oluşturulmasına bağlıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Okuma ve yazma bildiği hâlde imza atamayanların mühür veya bir alet ya da parmak izi kullanmak suretiyle yapacakları hukuki işlemleri içeren belgelerin senet niteliğini taşıyabilmesi, noterler tarafından onaylanmasına veya düzenlenmesine bağlıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İmza atamayan kimselerin, cüzdanla iş yapmayı usul edinmiş kuruluşlarla olan işlemlerde kullanacakları mühür, kazınmış imza, işaret veya parmak izinin, işlemin başlangıcında hesap defterine veya cüzdanına basılmış olması veya önceden noterde bir örneği saklanmak üzere onanmış bulunması yeterli olup, her işlemde ayrıca onamaya bağlı değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yukarıda belirtilen hükümler dairesinde noterlerce onaylanacak veya düzenlenecek olan senetler için ilgilisinden harç, vergi ve değerli kâğıt bedeli alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="207" başlık="Senette çıkıntı, kazıntı ve silinti">
        <mvz-fıkra no="1">
          <template>Senetteki çıkıntı, kazıntı veya silinti ayrıca onanmamışsa, inkâr hâlinde göz önünde tutulmaz. Bu tür çıkıntı, kazıntı veya silinti mahkemece senedin geçerliliğine ve anlamına etkili olacak nitelikte görülürse, senet kısmen veya tamamen hükümsüz sayılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="208" başlık="Yazı veya imza inkârı">
        <mvz-fıkra no="1">
          <template>Taraflardan biri, kendisi tarafından düzenlendiği iddia edilen bir belgedeki yazı veya imzayı inkâr etmek isterse, sahtelik iddiasında bulunmalıdır; aksi hâlde belge, aleyhine delil olarak kullanılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir belgenin sahteliği iddia edildiğinde, belgenin mahkemeye verildiği tarih yazılıp mühürlenerek, saklanması için mahkemece gerekli tedbirler alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bir belgenin sahteliğini iddia eden kimse, bunu aynı mahkemede ön sorun şeklinde ileri sürebileceği gibi, bu konuda ayrı bir dava da açabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Resmî bir senetteki yazı veya imzayı inkâr eden tarafın bu iddiası, ancak ilgili evraka resmiyet kazandıran kişiyi de taraf göstererek açacağı ayrı bir davada incelenip karara bağlanabilir. Asıl davaya bakan hâkim, gerekirse bu konuda imza veya yazıyı inkâr eden tarafa, dava açması için iki haftalık kesin bir süre verir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="209" başlık="Yazı veya imza inkârının sonucu">
        <mvz-fıkra no="1">
          <template>Adi bir senetteki yazı veya imza inkâr edildiğinde, bu konuda bir karar verilinceye kadar, o senet herhangi bir işleme esas alınamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Resmî senetlerdeki yazı veya imza inkâr edildiğinde, senetteki yazı veya imzanın sahteliği, ancak mahkeme kararıyla sabit olursa, bu senet herhangi bir işleme esas alınamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Senede dayanılarak verilmiş olan ihtiyati tedbir, o senet hakkındaki sahtelik iddiasından etkilenmez ve gerektiğinde senet sahibi haklarının korunması için yeni tedbirler talep edebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="210" başlık="Güvenli elektronik imzalı belgenin inkârı">
        <mvz-fıkra no="1">
          <template>Güvenli elektronik imzayla oluşturulmuş verinin inkârı hâlinde, hâkim tarafından veriyi inkâr eden taraf dinlendikten sonra bir kanaate varılamamışsa, bilirkişi incelemesine başvurulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="211" başlık="Sahtelik incelemesi">
        <mvz-fıkra no="1">
          <template>Bir belgenin sahteliğinin iddia edilmesi durumunda, bu hususta karşı tarafın açıklamaları da dikkate alınarak, aşağıdaki sıra ile inceleme yapılarak öncelikle karar verilir:</template>
          <mvz-bent no="a">
            <template>Hâkim, yazı veya imzayı inkâr eden tarafı isticvap ettikten sonra bir kanaat edinememişse, huzurda bu kişiye yazı yazdırıp imza attırmak suretiyle elde ettiği belge ve diğer delilleri değerlendirir. Hâkim, sahtelik konusunda başka bir incelemeye gerek duymadan karar verebilecek durumda ise gerekçesini açıkça belirtmek suretiyle, senedin sahteliği hakkında bir karar verir. İsticvap için mahkemeye davet edilen taraf, belirtilen günde hazır bulunmadığı takdirde, inkâr etmiş olduğu belgedeki yazı veya imzayı ikrar etmiş sayılır; bu husus kendisine çıkartılacak davetiyede ayrıca ihtar edilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>(a) bendi hükmüne göre yaptığı incelemeye rağmen, hâkimde sahtelik konusunda kesin bir kanaat oluşmamışsa, bilirkişi incelemesine karar verir. Bilirkişi incelemesinden önce, mevcutsa, o tarafa ait olan karşılaştırma yapmaya elverişli yazı ve imzalar, ilgili yerlerden getirtilir. Bilirkişi, bu yazı ve imzalarla, o mahkemede elde edilen yazı ve imzaları esas alarak inceleme yapar. Bilirkişi, inceleme için gerekli görürse, kendi huzurunda tarafın yeniden yazı yazması veya imza atmasını mahkemeden talep edebilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="212" başlık="Sahte senedin iptali">
        <mvz-fıkra no="1">
          <template>Bir senedin sahte olduğuna dair karar kesinleştikten sonra, senedin altına sahte olduğu yazılarak senet iptal olunur. Resmî senetlerde, senedin ilgili dairedeki aslı da bu yolla iptal edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="213" başlık="Haksız yere sahtelik iddiası">
        <mvz-fıkra no="1">
          <template>Sahtelik iddiası sonunda haksız çıkan taraf kötü niyetli ise bu sebeple ertelenen her bir duruşma için celse harcına ve talep hâlinde bu sebeple diğer tarafın uğradığı zararları tazmin etmeye mahkûm edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Resmî senetteki imza veya yazı inkâr edildiğinde, yukarıdaki harç miktarı iki katı olarak uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bilirkişi incelemesi yapılmasına karar verilmesinden önce, tarafların sahteliğe ilişkin iddialarından vazgeçmeleri hâlinde, hâkim, tazminattan indirim yapabileceği gibi tazminata hükmetmeyebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="214" başlık="Sahtelik hakkında hukuk ve ceza mahkemesi kararlarının etkisi">
        <mvz-fıkra no="1">
          <template>Belgenin sahte olmadığına dair hukuk mahkemesince verilen karar kesinleştikten sonra, söz konusu belge hakkında ceza mahkemesinde de sahtelik iddiası dinlenmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ceza mahkemesince belgeyi düzenleyen hakkında ceza verilmesine yer olmadığı ya da beraat kararı verilmiş olması, hukuk mahkemesinin belgenin sahteliğini incelemesini engellemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="215" başlık="Belgelerin halefler aleyhine kullanılması ve adi senetlerin üçüncü kişiler için hüküm ifade etmesi">
        <mvz-fıkra no="1">
          <template>Bir kimsenin aleyhine delil olarak kullanılabilecek belgeler, o kimsenin halefleri aleyhine de delil teşkil eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir adi senet bakımından, kendisine ibraz olunduğu noter veya yetkili memur tarafından usulüne uygun olarak onaylanmış ise ibraz tarihi, resmi bir işleme konu olmuşsa işlem tarihi, imza edenlerden biri ölmüşse ölüm tarihi, imza edenlerden birinin imza etmesine fiilen imkân kalmamışsa bu imkânı ortadan kaldıran olayın meydana geldiği tarih üçüncü kişiler hakkında da hüküm ifade eder. Adi senette bahsedilen diğer senetlerin tarihleri, üçüncü kişiler hakkında ancak son senet tarihinin onaylanmış olduğunun kabul edildiği tarihte hüküm ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="216" başlık="Mahkemece belge aslının istenmesi ve geri verilmesi">
        <mvz-fıkra no="1">
          <template>Belgenin sadece örneğinin mahkemeye verildiği durumlarda, mahkeme kendiliğinden veya taraflardan birinin talebi üzerine belgenin aslının verilmesini de isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belgenin aslını elinde bulunduran taraf, üçüncü kişi veya resmî makamlar, istenmesi hâlinde bunu mahkemeye vermek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme, belge aslının verilmesi durumunda, belgenin saklanması için gerekli tedbirleri alır veya istendiğinde tekrar verilmek üzere belgeyi ibraz edene geri verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Taraflardan biri elindeki belgenin aslını mahkemeye verirse, bu belgenin geri verilmesini talep edebilir. Bu takdirde hâkim, belgenin aslının verilip verilmeyeceğine karar verir. Geri verilmesine karar verildiğinde, aslına uygun olduğu mahkeme mührü ve yazı işleri müdürünün imzasıyla onanmış örneği dosyaya konur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="217" başlık="Belge aslının ibrazı usulü">
        <mvz-fıkra no="1">
          <template>Bir kişi veya kurumun elinde bulunup mahkemeye teslim edilmesi gereken belgenin aslı istendiğinde, kişi veya kurumun bulunduğu ya da belgenin teslim edileceği yerdeki asliye mahkemesi tarafından örneği onaylanarak aslı mahkemeye gönderilir yahut teslim edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkemece onaylanmış belge örneği, aslı gibi hüküm ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="218" başlık="Belgenin yerinde incelenmesi">
        <mvz-fıkra no="1">
          <template>Mahkemeye getirilmesi zor veya sakıncalı olan belgeler, hâkim veya görevlendireceği bilirkişi tarafından yerinde incelenir ya da bu belgelerin mahkemeye sunulmuş örnekleri asıllarıyla karşılaştırılır. İnceleme sonunda bir tutanak düzenlenir ve gerekli görülürse uygun teknik araçlarla belgenin aslı kaydedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkemenin bu yöndeki emrinin yerine getirilmesine haklı bir sebep olmaksızın engel olunması hâlinde hâkim tarafından, engel olan kişi hakkında sebep olduğu giderlere ve beşyüz Türk Lirasından beşbin Türk Lirasına kadar disiplin para cezasına hükmolunur. Gerektiğinde zor kullanılmasına da karar verilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="219" başlık="Tarafların belgeleri ibrazı zorunluluğu">
        <mvz-fıkra no="1">
