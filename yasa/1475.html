  <mvz-madde no="14" başlık="Kıdem tazminatı">
    <mvz-fıkra no="1">
      <template>Bu Kanuna tabi işçilerin hizmet akitlerinin:</template>
      <mvz-bent no="1.">
        <template>İşveren tarafından bu Kanunun 17 nci maddesinin II numaralı bendinde gösterilen sebepler dışında,</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>İşçi tarafından bu Kanunun 16 ncı maddesi uyarınca,</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Muvazzaf askerlik hizmeti dolayısıyle,</template>
      </mvz-bent>
      <mvz-bent no="4.">
        <template>Bağlı bulundukları kanunla veya Cumhurbaşkanlığı kararnamesiyle kurulu kurum veya sandıklardan yaşlılık, emeklilik veya malullük aylığı yahut toptan ödeme almak amacıyla;</template>
      </mvz-bent>
      <mvz-bent no="5.">
        <template>506 Sayılı Kanunun 60 ıncı maddesinin birinci fıkrasının (A) bendinin (a) ve (b) alt bentlerinde öngörülen yaşlar dışında kalan diğer şartları veya aynı Kanunun Geçici 81 inci maddesine göre yaşlılık aylığı bağlanması için öngörülen sigortalılık süresini ve prim ödeme gün sayısını tamamlayarak kendi istekleri ile işten ayrılmaları nedeniyle,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Feshedilmesi veya kadının evlendiği tarihten itibaren bir yıl içerisinde kendi arzusu ile sona erdirmesi veya işçinin ölümü sebebiyle son bulması hallerinde işçinin işe başladığı tarihten itibaren hizmet aktinin devamı süresince her geçen tam yıl için işverence işçiye 30 günlük ücreti tutarında kıdem tazminatı ödenir. Bir yıldan artan süreler için de aynı oran üzerinden ödeme yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İşçilerin kıdemleri, hizmet akdinin devam etmiş veya fasılalarla yeniden akdedilmiş olmasına bakılmaksızın aynı işverenin bir veya değişik işyerlerinde çalıştıkları süreler gözönüne alınarak hesaplanır. İşyerlerinin devir veya intikali yahut herhangi bir suretle bir işverenden başka bir işverene geçmesi veya başka bir yere nakli halinde işçinin kıdemi, işyeri veya işyerlerindeki hizmet akitleri sürelerinin toplamı üzerinden hesaplanır. 12/7/1975 tarihinden, itibaren işyerinin devri veya herhangi bir suretle el değiştirmesi halinde işlemiş kıdem tazminatlarından her iki işveren sorumludur. Ancak, işyerini devreden işverenlerin bu sorumlulukları işçiyi çalıştırdıkları sürelerle ve devir esnasındaki işçinin aldığı ücret seviyesiyle sınırlıdır. 12/7/1975 tarihinden evvel işyeri devrolmuş veya herhangi bir suretle el değiştirmişse devir mukavelesinde aksine bir hüküm yoksa işlemiş kıdem tazminatlarından yeni işveren sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İşçinin birinci bendin 4 üncü fıkrası hükmünden faydalanabilmesi için aylık veya toptan ödemeye hak kazanmış bulunduğunu ve kendisine aylık bağlanması veya toptan ödeme yapılması için yaşlılık sigortası bakımından bağlı bulunduğu kuruma veya sandığa müracaat etmiş olduğunu belgelemesi şarttır. İşçinin ölümü halinde bu şart aranmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>T.C. Emekli Sandığı Kanunu ve Sosyal Sigortalar Kanununa veya yalnız Sosyal Sigortalar Kanununa tabi olarak sadece aynı ya da değişik kamu kuruluşlarında geçen hizmet sürelerinin birleştirilmesi suretiyle Sosyal Sigortalar Kanununa göre yaşlılık veya malullük aylığına ya da toptan ödemeye hak kazanan işçiye, bu kamu kuruluşlarında geçirdiği hizmet sürelerinin toplamı üzerinden son kamu kuruluşu işverenince kıdem tazminatı ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yukarıda belirtilen kamu kuruluşlarında işçinin hizmet akdinin evvelce bu maddeye göre kıdem tazminatı ödenmesini gerektirmeyecek şekilde sona ermesi suretiyle geçen hizmet süreleri kıdem tazminatının hesabında dikkate alınmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Ancak, bu tazminatın T.C. Emekli Sandığına tabi olarak geçen hizmet süresine ait kısmı için ödenecek miktar, yaşlılık veya malullük aylığının başlangıç tarihinde T.C. Emekli Sandığı Kanununun yürürlükteki hükümlerine göre emeklilik ikramiyesi için öngörülen miktardan fazla olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Bu maddede geçen kamu kuruluşları deyimi, genel, katma ve özel bütçeli idareler ile 468 sayılı Kanunun 4 üncü maddesinde sayılan kurumları kapsar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Aynı kıdem süresi için bir defadan fazla kıdem tazminatı veya ikramiye ödenmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Kıdem tazminatının hesaplanması, son ücret üzerinden yapılır. Parça başı, akort, götürü veya yüzde usulü gibi ücretin sabit olmadığı hallerde son bir yıllık süre içinde ödenen ücretin o süre içinde çalışılan günlere bölünmesi suretiyle bulunacak ortalama ücret bu tazminatın hesabına esas tutulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Ancak, son bir yıl içinde işçi ücretine zam yapıldığı takdirde, tazminata esas ücret, işçinin işten ayrılma tarihi ile zammın yapıldığı tarih arasında alınan ücretin aynı süre içinde çalışılan günlere bölünmesi suretiyle hesaplanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="11">
      <template>13 üncü maddesinde sözü geçen tazminat ile bu maddede yer alan kıdem tazminatına esas olacak ücretin hesabında 26 ncı maddenin birinci fıkrasında yazılı ücrete ilaveten işçiye sağlanmış olan para ve para ile ölçülmesi mümkün akdi ve kanundan doğan menfaatler de gözönünde tutulur. Kıdem tazminatının zamanında ödenmemesi sebebiyle açılacak davanın sonunda hakim gecikme süresi için, ödenmeyen süreye göre mevduata uygulanan en yüksek faizin ödenmesine hükmeder. İşçinin mevzuattan doğan diğer hakları saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="12">
      <template>Bu maddede belirtilen kıdem tazminatı ile ilgili 30 günlük süre hizmet akidleri veya toplu iş sözleşmeleri ile işçi lehine değiştirilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="13">
      <template>Ancak, toplu sözleşmelerle ve hizmet akitleriyle belirlenen kıdem tazminatlarının yıllık miktarı, Devlet Memurları Kanununa tabi en yüksek Devlet memuruna 5434 sayılı T.C. Emekli Sandığı Kanunu hükümlerine göre bir hizmet yılı için ödenecek azami emeklilik ikramiyesini geçemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="14">
      <template>İşçinin ölümü halinde yukarıdaki hükümlere göre doğan tazminat tutarı, kanuni mirasçılarına ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="15">
      <template>Kıdem tazminatından doğan sorumluluğu işveren şahıslara veya sigorta şirketlerine sigorta ettiremez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="16">
      <template>İşveren sorumluluğu altında ve sadece yaşlılık, emeklilik, malullük, ölüm ve toptan ödeme hallerine mahsus olmak kaydiyle Devlet veya kanunla veya Cumhurbaşkanlığı kararnamesiyle kurulu kurumlarda veya % 50 hisseden fazlası Devlete ait bir bankada veya bir kurumda işveren tarafından kıdem tazminatı ile ilgili bir fon tesis edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="17">
      <template>Fon tesisi ile ilgili hususlar kanunla düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
