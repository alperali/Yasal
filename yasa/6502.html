  <mvz-künye tür="kanun" no="6502" başlık="TÜKETİCİNİN KORUNMASI HAKKINDA KANUN"
             tarih="7/11/2013" rgazete-tarih="28/11/2013" rgazete-sayı="28835"
             düstur-tertip="5" düstur-cilt="54" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; kamu yararına uygun olarak tüketicinin sağlık ve güvenliği ile ekonomik çıkarlarını koruyucu, zararlarını tazmin edici, çevresel tehlikelerden korunmasını sağlayıcı, tüketiciyi aydınlatıcı ve bilinçlendirici önlemleri almak, tüketicilerin kendilerini koruyucu girişimlerini özendirmek ve bu konulardaki politikaların oluşturulmasında gönüllü örgütlenmeleri teşvik etmeye ilişkin hususları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, her türlü tüketici işlemi ile tüketiciye yönelik uygulamaları kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Bakan: Gümrük ve Ticaret Bakanını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakanlık: Gümrük ve Ticaret Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Genel Müdür: Tüketicinin Korunması ve Piyasa Gözetimi Genel Müdürünü,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Genel Müdürlük: Tüketicinin Korunması ve Piyasa Gözetimi Genel Müdürlüğünü,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hizmet: Bir ücret veya menfaat karşılığında yapılan ya da yapılması taahhüt edilen mal sağlama dışındaki her türlü tüketici işleminin konusunu,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İthalatçı: Kamu tüzel kişileri de dâhil olmak üzere mal veya hizmetleri ya da bu malların hammaddelerini yahut ara mallarını ticari veya mesleki amaçlarla ithal ederek satım, kira, finansal kiralama veya benzeri bir yolla piyasaya süren gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kalıcı veri saklayıcısı: Tüketicinin gönderdiği veya kendisine gönderilen bilgiyi, bu bilginin amacına uygun olarak makul bir süre incelemesine elverecek şekilde kaydedilmesini ve değiştirilmeden kopyalanmasını sağlayan ve bu bilgiye aynen ulaşılmasına imkân veren kısa mesaj, elektronik posta, internet, disk, CD, DVD, hafıza kartı ve benzeri her türlü araç veya ortamı,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Konut finansmanı kuruluşu: Konut finansmanı kapsamında doğrudan tüketiciye kredi kullandıran ya da finansal kiralama yapan bankalar ile Bankacılık Düzenleme ve Denetleme Kurulu tarafından konut finansmanı faaliyetinde bulunması uygun görülen finansal kiralama şirketleri ve finansman şirketlerini,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Kredi veren: Mevzuatı gereği tüketicilere kredi vermeye yetkili olan gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Mal: Alışverişe konu olan; taşınır eşya, konut veya tatil amaçlı taşınmaz mallar ile elektronik ortamda kullanılmak üzere hazırlanan yazılım, ses, görüntü ve benzeri her türlü gayri maddi malları,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Sağlayıcı: Kamu tüzel kişileri de dâhil olmak üzere ticari veya mesleki amaçlarla tüketiciye hizmet sunan ya da hizmet sunanın adına ya da hesabına hareket eden gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Satıcı: Kamu tüzel kişileri de dâhil olmak üzere ticari veya mesleki amaçlarla tüketiciye mal sunan ya da mal sunanın adına ya da hesabına hareket eden gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Teknik düzenleme: 29/6/2001 tarihli ve 4703 sayılı Ürünlere İlişkin Teknik Mevzuatın Hazırlanması ve Uygulanmasına Dair Kanunda yer alan tanımı,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Tüketici: Ticari veya mesleki olmayan amaçlarla hareket eden gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Tüketici işlemi: Mal veya hizmet piyasalarında kamu tüzel kişileri de dâhil olmak üzere ticari veya mesleki amaçlarla hareket eden veya onun adına ya da hesabına hareket eden gerçek veya tüzel kişiler ile tüketiciler arasında kurulan, eser, taşıma, simsarlık, sigorta, vekâlet, bankacılık ve benzeri sözleşmeler de dâhil olmak üzere her türlü sözleşme ve hukuki işlemi,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Tüketici örgütleri: Tüketicinin korunması amacıyla kurulan dernek, vakıf veya bunların üst kuruluşlarını,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Üretici: Kamu tüzel kişileri de dâhil olmak üzere tüketiciye sunulmuş olan mal ya da bu malların hammaddelerini yahut ara mallarını üretenler ile mal üzerine markasını, unvanını veya herhangi bir ayırt edici işaretini koyarak kendisini üretici olarak gösteren gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Genel Esaslar">
    <mvz-madde no="4" başlık="Temel ilkeler">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yazılı olarak düzenlenmesi öngörülen sözleşmeler ile bilgilendirmeler en az on iki punto büyüklüğünde, anlaşılabilir bir dilde, açık, sade ve okunabilir bir şekilde düzenlenir ve bunların bir nüshası kâğıt üzerinde veya kalıcı veri saklayıcısı ile tüketiciye verilir. Sözleşmede bulunması gereken şartlardan bir veya birkaçının bulunmaması durumunda, eksiklik sözleşmenin geçerliliğini etkilemez. Bu eksiklik sözleşmeyi düzenleyen tarafından derhâl giderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sözleşmede öngörülen koşullar, sözleşme süresi içinde tüketici aleyhine değiştirilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tüketiciden; kendisine sunulan mal veya hizmet kapsamında haklı olarak yapılmasını beklediği ve sözleşmeyi düzenleyenin yasal yükümlülükleri arasında yer alan edimler ile sözleşmeyi düzenleyenin kendi menfaati doğrultusunda yapmış olduğu masraflar için ek bir bedel talep edilemez. Bankalar, tüketici kredisi veren finansal kuruluşlar ve kart çıkaran kuruluşlar tarafından tüketiciye sunulan ürün veya hizmetlerde ise tüketiciden faiz dışında alınacak her türlü ücret, komisyon ve masraf türleri ile bunlara ilişkin usul ve esaslar Bakanlığın görüşü alınarak bu Kanunun ruhuna uygun olarak ve tüketiciyi koruyacak şekilde Türkiye Cumhuriyet Merkez Bankası tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunda düzenlenen sözleşmelere istinaden tüketiciden talep edilecek her türlü ücret ve masrafa ilişkin bilgilerin, sözleşmenin eki olarak kâğıt üzerinde yazılı şekilde tüketiciye verilmesi zorunludur. Uzaktan iletişim aracıyla kurulan sözleşmelerde ise, bu bilgiler kullanılan uzaktan iletişim aracına uygun şekilde verilir. Bu bilgilerin tüketiciye verildiğinin ispatı sözleşmeyi düzenleyene aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tüketicinin yapmış olduğu işlemler nedeniyle kıymetli evrak niteliğinde sadece nama yazılı ve her bir taksit ödemesi için ayrı ayrı olacak şekilde senet düzenlenebilir. Bu fıkra hükümlerine aykırı olarak düzenlenen senetler tüketici yönünden geçersizdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Tüketici işlemlerinde, tüketicinin edimlerine karşılık olarak alınan şahsi teminatlar, her ne isim altında olursa olsun adi kefalet sayılır. Tüketicinin alacaklarına ilişkin karşı tarafça verilen şahsi teminatlar diğer kanunlarda aksine hüküm bulunmadıkça müteselsil kefalet sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Temerrüt hâli de dâhil olmak üzere, tüketici işlemlerinde bileşik faiz uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu Kanun tüm düzenlemeleri yönünden katılım bankalarını da kapsar. Uygulama, kâr payı dikkate alınarak yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Tüketici sözleşmelerindeki haksız şartlar">
      <mvz-fıkra no="1">
        <template>Haksız şart; tüketiciyle müzakere edilmeden sözleşmeye dâhil edilen ve tarafların sözleşmeden doğan hak ve yükümlülüklerinde dürüstlük kuralına aykırı düşecek biçimde tüketici aleyhine dengesizliğe neden olan sözleşme şartlarıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tüketiciyle akdedilen sözleşmelerde yer alan haksız şartlar kesin olarak hükümsüzdür. Sözleşmenin haksız şartlar dışındaki hükümleri geçerliliğini korur. Bu durumda sözleşmeyi düzenleyen, kesin olarak hükümsüz sayılan şartlar olmasaydı diğer hükümlerle sözleşmeyi yapmayacak olduğunu ileri süremez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bir sözleşme şartı önceden hazırlanmış ve standart sözleşmede yer alması nedeniyle tüketici içeriğine etki edememişse, o sözleşme şartının tüketiciyle müzakere edilmediği kabul edilir. Sözleşmeyi düzenleyen, bir standart şartın münferiden müzakere edildiğini iddia ediyorsa bunu ispatla yükümlüdür. Sözleşmenin bütün olarak değerlendirilmesinden standart sözleşme olduğu sonucuna varılırsa, bu sözleşmedeki bir şartın belirli unsurlarının veya münferit bir hükmünün müzakere edilmiş olması, sözleşmenin kalan kısmına bu maddenin uygulanmasını engellemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sözleşme şartlarının yazılı olması hâlinde, tüketicinin anlayabileceği açık ve anlaşılır bir dilin kullanılmış olması gerekir. Sözleşmede yer alan bir hükmün açık ve anlaşılır olmaması veya birden çok anlama gelmesi hâlinde; bu hüküm, tüketicinin lehine yorumlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Faaliyetlerini, kanun veya yetkili makamlar tarafından verilen izinle yürütmekte olan kişi veya kuruluşların hazırladıkları sözleşmelere de niteliklerine bakılmaksızın bu madde hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bir sözleşme şartının haksızlığı; sözleşme konusu olan mal veya hizmetin niteliği, sözleşmenin kuruluşunda var olan şartlar ve sözleşmenin diğer hükümleri veya haksız şartın ilgili olduğu diğer bir sözleşmenin hükümleri dikkate alınmak suretiyle sözleşmenin kuruluş anına göre belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Sözleşme şartlarının haksızlığının takdirinde, bu şartlar açık ve anlaşılır bir dille yazılmış olmak koşuluyla, hem sözleşmeden doğan asli edim yükümlülükleri arasındaki hem de mal veya hizmetin piyasa değeri ile sözleşmede belirlenen fiyat arasındaki dengeye ilişkin bir değerlendirme yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bakanlık, genel olarak kullanılmak üzere hazırlanmış sözleşmelerde yer alan haksız şartların, sözleşme metinlerinden çıkarılması veya kullanılmasının önlenmesi için gerekli tedbirleri alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Haksız şartların tespit edilmesi ve denetlenmesine ilişkin usul ve esaslar ile sınırlayıcı olmamak üzere haksız şart olduğu kabul edilen sözleşme şartları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Satıştan kaçınma">
      <mvz-fıkra no="1">
        <template>Vitrinde, rafta, elektronik ortamda veya açıkça görülebilir herhangi bir yerde teşhir edilen malın, satılık olmadığı belirtilen bir ibareye yer verilmedikçe satışından kaçınılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hizmet sağlamaktan haklı bir sebep olmaksızın kaçınılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ticari veya mesleki amaçlarla hareket edenler; aksine bir teamül, ticari örf veya adet ya da haklı bir sebep yoksa; bir mal veya hizmetin satışını o mal veya hizmetin, kendisi tarafından belirlenen miktar, sayı, ebat gibi koşullara ya da başka bir mal veya hizmetin satın alınması şartına bağlayamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bakanlık ve belediyeler, bu madde hükümlerinin uygulanması ve izlenmesine ilişkin işleri yürütmekle görevlidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Sipariş edilmeyen mal veya hizmetler">
      <mvz-fıkra no="1">
        <template>Sipariş edilmeyen malların gönderilmesi ya da hizmetlerin sunulması durumunda, tüketiciye karşı herhangi bir hak ileri sürülemez. Bu hâllerde, tüketicinin sessiz kalması ya da mal veya hizmeti kullanmış olması, sözleşmenin kurulmasına yönelik kabul beyanı olarak yorumlanamaz. Tüketicinin malı geri göndermek veya muhafaza etmek gibi bir yükümlülüğü yoktur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir mal veya hizmetin sipariş edildiğini iddia eden bu iddiasını ispatla yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Ayıplı Mal ve Hizmetler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Ayıplı Mallar">
      <mvz-madde no="8" başlık="Ayıplı mal">
        <mvz-fıkra no="1">
          <template>Ayıplı mal, tüketiciye teslimi anında, taraflarca kararlaştırılmış olan örnek ya da modele uygun olmaması ya da objektif olarak sahip olması gereken özellikleri taşımaması nedeniyle sözleşmeye aykırı olan maldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ambalajında, etiketinde, tanıtma ve kullanma kılavuzunda, internet portalında ya da reklam ve ilanlarında yer alan özelliklerinden bir veya birden fazlasını taşımayan; satıcı tarafından bildirilen veya teknik düzenlemesinde tespit edilen niteliğe aykırı olan; muadili olan malların kullanım amacını karşılamayan, tüketicinin makul olarak beklediği faydaları azaltan veya ortadan kaldıran maddi, hukuki veya ekonomik eksiklikler içeren mallar da ayıplı olarak kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sözleşmeye konu olan malın, sözleşmede kararlaştırılan süre içinde teslim edilmemesi veya montajının satıcı tarafından veya onun sorumluluğu altında gerçekleştirildiği durumlarda gereği gibi monte edilmemesi sözleşmeye aykırı ifa olarak değerlendirilir. Malın montajının tüketici tarafından yapılmasının öngörüldüğü hâllerde, montaj talimatındaki yanlışlık veya eksiklik nedeniyle montaj hatalı yapılmışsa, sözleşmeye aykırı ifa söz konusu olur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Ayıplı maldan sorumluluk">
        <mvz-fıkra no="1">
          <template>Satıcı, malı satış sözleşmesine uygun olarak tüketiciye teslim etmekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Satıcı, kendisinden kaynaklanmayan reklam yoluyla yapılan açıklamalardan haberdar olmadığını ve haberdar olmasının da kendisinden beklenemeyeceğini veya yapılan açıklamanın içeriğinin satış sözleşmesinin akdi anında düzeltilmiş olduğunu veya satış sözleşmesi kurulma kararının bu açıklama ile nedensellik bağı içinde olmadığını ispatladığı takdirde açıklamanın içeriği ile bağlı olmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="İspat yükü">
        <mvz-fıkra no="1">
          <template>Teslim tarihinden itibaren altı ay içinde ortaya çıkan ayıpların, teslim tarihinde var olduğu kabul edilir. Bu durumda malın ayıplı olmadığının ispatı satıcıya aittir. Bu karine, malın veya ayıbın niteliği ile bağdaşmıyor ise uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketicinin, sözleşmenin kurulduğu tarihte ayıptan haberdar olduğu veya haberdar olmasının kendisinden beklendiği hâllerde, sözleşmeye aykırılık söz konusu olmaz. Bunların dışındaki ayıplara karşı tüketicinin seçimlik hakları saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Satışa sunulacak ayıplı mal üzerine ya da ambalajına, üretici, ithalatçı veya satıcı tarafından tüketicinin kolaylıkla okuyabileceği şekilde malın ayıbına ilişkin açıklayıcı bilgiyi içeren bir etiket konulur. Bu etiketin tüketiciye verilmesi veya ayıba ilişkin açıklayıcı bilginin tüketiciye verilen fatura, fiş veya satış belgesi üzerinde açıkça gösterilmesi zorunludur. Teknik düzenlemesine uygun olmayan ürünler ise hiçbir şekilde piyasaya arz edilemez. Bu ürünlere, Ürünlere İlişkin Teknik Mevzuatın Hazırlanması ve Uygulanmasına Dair Kanun ve ilgili diğer mevzuat hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Tüketicinin seçimlik hakları">
        <mvz-fıkra no="1">
          <template>Malın ayıplı olduğunun anlaşılması durumunda tüketici;</template>
          <mvz-bent no="a">
            <template>Satılanı geri vermeye hazır olduğunu bildirerek sözleşmeden dönme,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Satılanı alıkoyup ayıp oranında satış bedelinden indirim isteme,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Aşırı bir masraf gerektirmediği takdirde, bütün masrafları satıcıya ait olmak üzere satılanın ücretsiz onarılmasını isteme,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>İmkân varsa, satılanın ayıpsız bir misli ile değiştirilmesini isteme,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>seçimlik haklarından birini kullanabilir. Satıcı, tüketicinin tercih ettiği bu talebi yerine getirmekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ücretsiz onarım veya malın ayıpsız misli ile değiştirilmesi hakları üretici veya ithalatçıya karşı da kullanılabilir. Bu fıkradaki hakların yerine getirilmesi konusunda satıcı, üretici ve ithalatçı müteselsilen sorumludur. Üretici veya ithalatçı, malın kendisi tarafından piyasaya sürülmesinden sonra ayıbın doğduğunu ispat ettiği takdirde sorumlu tutulmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ücretsiz onarım veya malın ayıpsız misli ile değiştirilmesinin satıcı için orantısız güçlükleri beraberinde getirecek olması hâlinde tüketici, sözleşmeden dönme veya ayıp oranında bedelden indirim haklarından birini kullanabilir. Orantısızlığın tayininde malın ayıpsız değeri, ayıbın önemi ve diğer seçimlik haklara başvurmanın tüketici açısından sorun teşkil edip etmeyeceği gibi hususlar dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ücretsiz onarım veya malın ayıpsız misli ile değiştirilmesi haklarından birinin seçilmesi durumunda bu talebin satıcıya, üreticiye veya ithalatçıya yöneltilmesinden itibaren azami otuz iş günü, konut ve tatil amaçlı taşınmazlarda ise altmış iş günü içinde yerine getirilmesi zorunludur. Ancak, bu Kanunun 58 inci maddesi uyarınca çıkarılan yönetmelik eki listede yer alan mallara ilişkin, tüketicinin ücretsiz onarım talebi, yönetmelikte belirlenen azami tamir süresi içinde yerine getirilir. Aksi hâlde tüketici diğer seçimlik haklarını kullanmakta serbesttir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Tüketicinin sözleşmeden dönme veya ayıp oranında bedelden indirim hakkını seçtiği durumlarda, ödemiş olduğu bedelin tümü veya bedelden yapılan indirim tutarı derhâl tüketiciye iade edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Seçimlik hakların kullanılması nedeniyle ortaya çıkan tüm masraflar, tüketicinin seçtiği hakkı yerine getiren tarafça karşılanır. Tüketici bu seçimlik haklarından biri ile birlikte 11/1/2011 tarihli ve 6098 sayılı Türk Borçlar Kanunu hükümleri uyarınca tazminat da talep edebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Zamanaşımı">
        <mvz-fıkra no="1">
          <template>Kanunlarda veya taraflar arasındaki sözleşmede daha uzun bir süre belirlenmediği takdirde, ayıplı maldan sorumluluk, ayıp daha sonra ortaya çıkmış olsa bile, malın tüketiciye teslim tarihinden itibaren iki yıllık zamanaşımına tabidir. Bu süre konut veya tatil amaçlı taşınmaz mallarda taşınmazın teslim tarihinden itibaren beş yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunun 10 uncu maddesinin üçüncü fıkrası saklı olmak üzere ikinci el satışlarda satıcının ayıplı maldan sorumluluğu bir yıldan, konut veya tatil amaçlı taşınmaz mallarda ise üç yıldan az olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ayıp, ağır kusur ya da hile ile gizlenmişse zamanaşımı hükümleri uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Ayıplı Hizmetler">
      <mvz-madde no="13" başlık="Ayıplı hizmet">
        <mvz-fıkra no="1">
          <template>Ayıplı hizmet, sözleşmede belirlenen süre içinde başlamaması veya taraflarca kararlaştırılmış olan ve objektif olarak sahip olması gereken özellikleri taşımaması nedeniyle sözleşmeye aykırı olan hizmettir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hizmet sağlayıcısı tarafından bildirilen, internet portalında veya reklam ve ilanlarında yer alan özellikleri taşımayan ya da yararlanma amacı bakımından değerini veya tüketicinin ondan makul olarak beklediği faydaları azaltan veya ortadan kaldıran maddi, hukuki veya ekonomik eksiklikler içeren hizmetler ayıplıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Ayıplı hizmetten sorumluluk">
        <mvz-fıkra no="1">
          <template>Sağlayıcı, hizmeti sözleşmeye uygun olarak ifa etmekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sağlayıcı, kendisinden kaynaklanmayan reklam yoluyla yapılan açıklamalardan haberdar olmadığını ve haberdar olmasının da kendisinden beklenemeyeceğini veya yapılan açıklamanın içeriğinin hizmet sözleşmesinin kurulduğu tarihte düzeltilmiş olduğunu veya hizmet sözleşmesinin kurulması kararının bu açıklama ile nedensellik bağı içermediğini ispatladığı takdirde açıklamanın içeriği ile bağlı olmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Tüketicinin seçimlik hakları">
        <mvz-fıkra no="1">
          <template>Hizmetin ayıplı ifa edildiği durumlarda tüketici, hizmetin yeniden görülmesi, hizmet sonucu ortaya çıkan eserin ücretsiz onarımı, ayıp oranında bedelden indirim veya sözleşmeden dönme haklarından birini sağlayıcıya karşı kullanmakta serbesttir. Sağlayıcı, tüketicinin tercih ettiği bu talebi yerine getirmekle yükümlüdür. Seçimlik hakların kullanılması nedeniyle ortaya çıkan tüm masraflar sağlayıcı tarafından karşılanır. Tüketici, bu seçimlik haklarından biri ile birlikte Türk Borçlar Kanunu hükümleri uyarınca tazminat da talep edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ücretsiz onarım veya hizmetin yeniden görülmesinin sağlayıcı için orantısız güçlükleri beraberinde getirecek olması hâlinde tüketici bu hakları kullanamaz. Orantısızlığın tayininde hizmetin ayıpsız değeri, ayıbın önemi ve diğer seçimlik haklara başvurmanın tüketici açısından sorun teşkil edip etmeyeceği gibi hususlar dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tüketicinin sözleşmeden dönme veya ayıp oranında bedelden indirim hakkını seçtiği durumlarda, ödemiş olduğu bedelin tümü veya bedelden indirim yapılan tutar derhâl tüketiciye iade edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ücretsiz onarım veya hizmetin yeniden görülmesinin seçildiği hâllerde, hizmetin niteliği ve tüketicinin bu hizmetten yararlanma amacı dikkate alındığında, makul sayılabilecek bir süre içinde ve tüketici için ciddi sorunlar doğurmayacak şekilde bu talep sağlayıcı tarafından yerine getirilir. Her hâlükârda bu süre talebin sağlayıcıya yöneltilmesinden itibaren otuz iş gününü geçemez. Aksi takdirde tüketici diğer seçimlik haklarını kullanmakta serbesttir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="Zamanaşımı">
        <mvz-fıkra no="1">
          <template>Kanunlarda veya taraflar arasındaki sözleşmede daha uzun bir süre belirlenmediği takdirde, ayıplı hizmetten sorumluluk, ayıp daha sonra ortaya çıkmış olsa bile, hizmetin ifası tarihinden itibaren iki yıllık zamanaşımına tabidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ayıp, ağır kusur ya da hile ile gizlenmişse zamanaşımı hükümleri uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Tüketici Sözleşmeleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Taksitle Satış">
      <mvz-madde no="17" başlık="Taksitle satış sözleşmeleri">
        <mvz-fıkra no="1">
          <template>Taksitle satış sözleşmesi, satıcı veya sağlayıcının malın teslimi veya hizmetin ifasını üstlendiği, tüketicinin de bedeli kısım kısım ödediği sözleşmelerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketicinin, kira süresi sonunda bir malın mülkiyetini edinme zorunluluğunun bulunduğu finansal kiralama sözleşmeleri hakkında da bu Bölüm hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Taksitle satış sözleşmesi yazılı olarak kurulmadıkça geçerli olmaz. Geçerli bir sözleşme yapmamış olan satıcı veya sağlayıcı, sonradan sözleşmenin geçersizliğini tüketicinin aleyhine olacak şekilde ileri süremez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Cayma hakkı">
        <mvz-fıkra no="1">
          <template>Tüketici, yedi gün içinde herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin taksitle satış sözleşmesinden cayma hakkına sahiptir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Cayma hakkının kullanıldığına dair bildirimin bu süre içinde satıcı veya sağlayıcıya yöneltilmiş olması yeterlidir. Satıcı veya sağlayıcı, cayma hakkı konusunda tüketicinin bilgilendirildiğini ispat etmekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Satıcı cayma süresi içinde malı tüketiciye teslim etmişse tüketici, malı ancak olağan bir gözden geçirmenin gerektirdiği ölçüde kullanabilir; aksi takdirde tüketici cayma hakkını kullanamaz. Cayma hakkı süresi sona ermeden önce, tüketicinin onayı ile hizmetin ifasına başlanan hizmet sözleşmelerinde de tüketici cayma hakkını kullanamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Tüketicinin satıcıyı bulduğu finansal kiralama işlemlerinde cayma hakkı kullanılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Temerrüt">
        <mvz-fıkra no="1">
          <template>Taksitle satış sözleşmelerinde tüketicinin taksitleri ödemede temerrüde düşmesi durumunda, satıcı veya sağlayıcı, kalan borcun tümünün ifasını talep etme hakkını saklı tutmuşsa, bu hak ancak satıcı veya sağlayıcının bütün edimlerini ifa etmiş olması, tüketicinin de sözleşmede yer alan bedelin en az onda birini oluşturan ve birbirini izleyen en az iki taksidi veya en az dörtte birini oluşturan bir taksidi ödemede temerrüde düşmesi hâlinde kullanılabilir. Satıcı veya sağlayıcının bu hakkı kullanabilmesi için tüketiciye en az otuz gün süre vererek muacceliyet uyarısında bulunması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Muaccel kılınan taksitlerin hesaplanmasında faiz, komisyon ve benzeri masraflar dikkate alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="Erken ödeme">
        <mvz-fıkra no="1">
          <template>Tüketici, borçlandığı toplam miktarı önceden ödeyebileceği gibi vadesi gelmemiş bir ya da birden çok taksit ödemesinde de bulunabilir. Her iki durumda da satıcı veya sağlayıcı, faiz veya komisyon aldığı durumlarda ödenen miktara göre gerekli tüm faiz ve komisyon indirimini yapmakla yükümlüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="Diğer hususlar">
        <mvz-fıkra no="1">
          <template>Tüketicinin taşınır bir malın satış bedelini önceden kısım kısım ödemeyi, satıcının da bedelin tamamen ödenmesinden sonra satılanı tüketiciye teslim etmeyi üstlendikleri ve ödeme süresi bir yıldan daha uzun veya belirsiz olan sözleşmeler hakkında Türk Borçlar Kanununun ön ödemeli taksitle satış hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sözleşmenin zorunlu içeriği, tüketici ile satıcı ve sağlayıcının hak ve yükümlülükleri, cayma hakkı, erken ödeme ile diğer hususlara ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Tüketici Kredileri">
      <mvz-madde no="22" başlık="Tüketici kredisi sözleşmeleri">
        <mvz-fıkra no="1">
          <template>Tüketici kredisi sözleşmesi, kredi verenin tüketiciye faiz veya benzeri bir menfaat karşılığında ödemenin ertelenmesi, ödünç veya benzeri finansman şekilleri aracılığıyla kredi verdiği veya kredi vermeyi taahhüt ettiği sözleşmeyi ifade eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kredi kartı sözleşmeleri, faiz veya benzeri bir menfaat karşılığında, ödemenin üç aydan daha uzun süre ertelenmesi veya benzer şekilde taksitle ödeme imkânı sağlanması hâlinde tüketici kredisi sözleşmesi olarak değerlendirilir. Ancak bu durumda uygulanacak faiz oranı kredi kartı sözleşmesi uyarınca belirlenen orandan fazla olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tüketici kredisi sözleşmesi yazılı veya mesafeli olarak kurulmadıkça geçerli olmaz. Geçerli bir sözleşme yapmamış olan kredi veren, sonradan sözleşmenin geçersizliğini tüketicinin aleyhine olacak şekilde ileri süremez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Sözleşme öncesi bilgilendirme yükümlülüğü">
        <mvz-fıkra no="1">
          <template>Kredi verenin ve varsa kredi aracısının, tüketiciye, teklif ettikleri kredi sözleşmesinin koşullarını içeren sözleşme öncesi bilgi formunu, sözleşmenin kurulmasından makul bir süre önce vermesi zorunludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="Cayma hakkı">
        <mvz-fıkra no="1">
          <template>Tüketici, on dört gün içinde herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin tüketici kredisi sözleşmesinden cayma hakkına sahiptir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kredi veren, cayma hakkı olduğu konusunda tüketicinin bilgilendirildiğini ispat etmekle yükümlüdür. Cayma hakkının kullanıldığına dair bildirimin cayma hakkı süresi içinde kredi verene yöneltilmiş olması yeterlidir.  Cayma hakkı süresi içinde kredi borcunun tamamının erken ödenmesi hâlinde bildirim aranmaksızın bu madde hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Cayma hakkını kullanan tüketicinin krediden faydalandığı hâllerde, tüketici, anaparayı ve kredinin kullanıldığı tarihten anaparanın geri ödendiği tarihe kadar olan sürede tahakkuk eden faizi en geç cayma bildirimini kredi verene göndermesinden sonra otuz gün içinde geri öder. Bu süre içinde ödeme yapılmaması hâlinde tüketici kredisinden cayılmamış sayılır. Faiz, akdî faiz oranına göre hesaplanır. Tüketiciden, hesaplanan akdî faiz ve bir kamu kurum veya kuruluşuna veya üçüncü kişilere ödenmiş olan masraflar dışında herhangi bir bedel talep edilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="Faiz oranı">
        <mvz-fıkra no="1">
          <template>Belirli süreli tüketici kredisi sözleşmelerinde faiz oranı sabit olarak belirlenir. Sözleşmenin kurulduğu tarihte belirlenen bu oran tüketici aleyhine değiştirilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketici kredisi sözleşmelerinde, akdî faiz, efektif yıllık faiz veya kredinin toplam maliyetinin yer almaması durumunda, kredi tutarı faizsiz olarak sözleşme süresinin sonuna kadar kullanılır. Efektif faiz oranı, olduğundan düşük gösterilmişse, kredinin toplam maliyetinin hesaplanmasında esas alınacak akdî faiz oranı, düşük gösterilen efektif faiz oranına uyacak şekilde yeniden belirlenir. Bu hâllerde ödeme planı, yapılan değişikliklere göre yeniden düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Sözleşmede değişiklik yapılması">
        <mvz-fıkra no="1">
          <template>Belirli süreli kredi sözleşmesinin şartları, tüketici aleyhine değiştirilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belirsiz süreli kredi sözleşmelerinde faiz oranının artırılması durumunda, bu değişikliğin yürürlüğe girmesinden otuz gün önce, tüketiciye kâğıt üzerinde veya kalıcı veri saklayıcısı aracılığıyla yazılı olarak bildirilmesi zorunludur. Bu bildirimde, yeni faiz oranının yürürlüğe girmesinden sonra yapılacak ödemelerin tutarı, sayısı ile aralıklarının değişmesine ilişkin ayrıntılara yer verilir. Faiz oranının artırılması hâlinde, yeni faiz oranı geriye dönük olarak uygulanamaz. Tüketici, bildirim tarihinden itibaren en geç altmış gün içinde borcun tamamını ödediği ve kredi kullanmaya son verdiği takdirde faiz artışından etkilenmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Erken ödeme">
        <mvz-fıkra no="1">
          <template>Tüketici, vadesi gelmemiş bir veya birden çok taksit ödemesinde bulunabilir veya kredi borcunun tamamını erken ödeyebilir. Bu hâllerde kredi veren, erken ödenen miktara göre gerekli tüm faiz ve diğer maliyet unsurlarına ilişkin indirim yapmakla yükümlüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="Temerrüt">
        <mvz-fıkra no="1">
          <template>Belirli süreli kredi sözleşmelerinde tüketicinin taksitleri ödemede temerrüde düşmesi durumunda, kredi veren, borcun tamamının ifasını talep etme hakkını saklı tutmuşsa, bu hak ancak kredi verenin bütün edimlerini ifa etmiş olması, tüketicinin de birbirini izleyen en az iki taksidi ödemede temerrüde düşmesi hâlinde kullanılabilir. Kredi verenin bu hakkı kullanabilmesi için tüketiciye en az otuz gün süre vererek muacceliyet uyarısında bulunması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Muaccel kılınan taksitlerin hesaplanmasında faiz, komisyon ve benzeri masraflar dikkate alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="Sigorta, yan finansal ürün ve hizmet sunumu">
        <mvz-fıkra no="1">
          <template>Tüketicinin yazılı veya kalıcı veri saklayıcısı aracılığıyla açık talebi olmaksızın kredi bağlantılı sigorta yaptırılamaz. Kredi veren, kredi bağlantılı sigorta içermeyen bir sözleşmeyi de tüketiciye teklif etmek koşuluyla kredi bağlantılı sigorta yaptırılmasını içeren bir kredi sözleşmesini tüketiciye sunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketicinin istediği sigorta şirketinden sağladığı teminat, kredi veren tarafından kabul edilmek zorundadır. Kredi bağlantılı sigortanın; kredi borcunun geri ödenme teminatını sağlama amacıyla, meblağ sigortalarında kalan borç tutarıyla ve vadesiyle uyumlu olması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tüketici kredisi sözleşmesi, kredi ile ilgili olanlar hariç yan finansal ürün ve hizmetlerin satın alınması şartına bağlanamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="Bağlı krediler">
        <mvz-fıkra no="1">
          <template>Bağlı kredi sözleşmesi; tüketici kredisinin münhasıran belirli bir malın veya hizmetin tedarikine ilişkin bir sözleşmenin finansmanı için verildiği ve bu iki sözleşmenin objektif açıdan ekonomik birlik oluşturduğu sözleşmedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ekonomik birliğin varlığı;</template>
          <mvz-bent no="a">
            <template>Satıcı veya sağlayıcının tüketici için krediyi finanse ettiği,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Üçüncü bir tarafça finanse edilmesi durumunda, kredi verenin kredi sözleşmesinin imzalanması veya hazırlanması ile ilgili olarak satıcı veya sağlayıcının hizmetlerinden yararlandığı,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Belirli bir mal veya hizmetin verilmesinin kredi sözleşmesinde açıkça belirtildiği, durumlarından en az birinin varlığı hâlinde kabul edilir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tüketicinin mal veya hizmet tedarikine ilişkin sözleşmeden cayması ve buna ilişkin bildirimin cayma süresi içinde ayrıca kredi verene de yöneltilmesi hâlinde, bağlı kredi sözleşmesi de herhangi bir tazminat veya cezai şart ödeme yükümlülüğü olmaksızın sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bağlı kredilerde, mal veya hizmet hiç ya da gereği gibi teslim veya ifa edilmez ise satıcı, sağlayıcı ve kredi veren, tüketicinin satış sözleşmesinden dönme veya bedelden indirim hakkını kullanması hâlinde müteselsilen sorumludur. Tüketicinin bedelden indirim hakkını kullanması hâlinde bağlı kredi de bu oranda indirilir ve ödeme planı buna göre değiştirilir. Tüketicinin sözleşmeden dönme hakkını kullanması hâlinde, o güne kadar yapmış olduğu ödemenin iadesi hususunda satıcı, sağlayıcı ve kredi veren müteselsilen sorumludur. Ancak, kredi verenin sorumluluğu; malın teslim veya hizmetin ifa edilmediği durumlarda satış sözleşmesinde veya bağlı kredi sözleşmesinde belirtilen malın teslim veya hizmetin ifa edilme tarihinden, malın teslim veya hizmetin ifa edildiği durumlarda malın teslim veya hizmetin ifa edildiği tarihten itibaren, kullanılan kredi miktarı ile sınırlı olmak üzere bir yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kredi veren ile satıcı veya sağlayıcı arasında belirli bir malın veya hizmetin tedarikine ilişkin bir sözleşme olmaksızın, tüketicinin kendisi tarafından belirlenen malın veya hizmetin bedelinin kredi veren tarafından ödenmesi suretiyle kullandırılan krediler bağlı kredi sayılmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="Diğer hususlar">
        <mvz-fıkra no="1">
          <template>Belirli süreli kredi sözleşmesine ilişkin bir hesap açılması ve bu hesaptan sadece kredi ile ilgili işlemler yapılması durumunda, tüketiciden bu hesaba ilişkin herhangi bir isim altında ücret veya masraf talep edilemez. Bu hesap, tüketicinin aksine yazılı veya kalıcı veri saklayıcısıyla talebi olmaması hâlinde kredinin ödenmesi ile kapanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketicinin açık talimatı olmaksızın, belirli süreli kredi sözleşmesi ile ilişkili bir kredili mevduat sözleşmesi yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kart çıkaran kuruluşlar, tüketicilere yıllık üyelik aidatı ve benzeri isim altında ücret tahsil etmedikleri bir kredi kartı türü sunmak zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sözleşme öncesi bilgilendirme, sözleşmenin zorunlu içeriği, kapsam dışı sözleşmeler, tüketici ile kredi verenin hak ve yükümlülükleri, cayma hakkı, erken ödeme, efektif yıllık faizin hesaplanması, tüketici kredilerine ilişkin reklamların zorunlu içeriği, fesih hakkının kullanılması, temerrüt, kredinin devri, bağlı kredi ile diğer hususlara ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Konut Finansmanı">
      <mvz-madde no="32" başlık="Konut finansmanı sözleşmeleri">
        <mvz-fıkra no="1">
          <template>Konut finansmanı sözleşmesi, konut edinmeleri amacıyla; tüketicilere kredi kullandırılması, konutların finansal kiralama yoluyla tüketicilere kiralanması, sahip oldukları konutların teminatı altında tüketicilere kredi kullandırılması ve bu kredilerin yeniden finansmanı amacıyla kredi kullandırılmasına yönelik sözleşmedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Konut finansmanı sözleşmesi yazılı veya mesafeli olarak kurulmadıkça geçerli olmaz. Geçerli bir sözleşme yapmamış olan konut finansmanı kuruluşu, sonradan sözleşmenin geçersizliğini tüketicinin aleyhine olacak şekilde ileri süremez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="33" başlık="Sözleşme öncesi bilgilendirme yükümlülüğü">
        <mvz-fıkra no="1">
          <template>Konut finansmanı kuruluşları, tüketiciye, konut finansmanı sözleşmesinin koşullarını içeren sözleşme öncesi bilgi formunu, sözleşmenin kurulmasından makul bir süre önce vermek zorundadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="34" başlık="Temerrüt">
        <mvz-fıkra no="1">
          <template>Tüketicinin taksitleri ödemede temerrüde düşmesi durumunda konut finansmanı kuruluşu, kalan borcun tamamının ifasını talep etme hakkını saklı tutmuşsa, bu hak ancak konut finansmanı kuruluşunun bütün edimlerini ifa etmiş olması ve tüketicinin de birbirini izleyen en az iki taksidi ödemede temerrüde düşmesi hâlinde kullanılabilir. Konut finansmanı kuruluşunun bu hakkını kullanabilmesi için tüketiciye en az otuz gün süre vererek muacceliyet uyarısında bulunması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Muaccel kılınan taksitlerin hesaplanmasında faiz, komisyon ve benzeri masraflar dikkate alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Finansal kiralama işlemlerinde, muacceliyet uyarısında verilen süre içinde tüketicinin edimini yerine getirmemesi hâlinde, bu sürenin sona ermesini takiben konut finansmanı kuruluşu kalan borcun tamamını ifa etme hakkını kullanmak üzere konut finansmanı sözleşmesini feshettiği takdirde, konutu derhâl satışa çıkarmakla yükümlüdür. Konut finansmanı kuruluşu satış öncesinde konut için 6/12/2012 tarihli ve 6362 sayılı Sermaye Piyasası Kanunu uyarınca yetki verilmiş olan kişi veya kurumlara kıymet takdiri yaptırır. Takdir edilen kıymet, satıştan en az on iş günü önce tüketiciye bildirilir. Konut finansmanı kuruluşu takdir edilen kıymeti dikkate alarak basiretli bir tacir gibi davranmak suretiyle konutun satışını gerçekleştirir. Konutun satışından elde edilen bedelin, kalan borcu aşması hâlinde aşan kısım tüketiciye derhâl ödenir. Konut finansmanına yönelik finansal kiralama işlemlerinde 21/11/2012 tarihli ve 6361 sayılı Finansal Kiralama, Faktoring ve Finansman Şirketleri Kanununun 33 üncü maddesi uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Konutun satışının bu maddenin üçüncü fıkrası kapsamında gerçekleştirilmesi ve varsa elde edilen bedelin kalan borcu aşan kısmının tüketiciye ödenmesini takiben tüketici veya zilyetliğin devredilmiş olması hâlinde zilyetliği elinde bulunduran üçüncü şahıslar konutu tahliye etmekle yükümlüdür. Konutun tahliye edilmemesi hâlinde konut sahibi, 9/6/1932 tarihli ve 2004 sayılı İcra ve İflâs Kanununun 26 ncı ve 27 nci maddeleri uyarınca tüketici veya zilyetliği elinde bulunduran üçüncü şahıslar aleyhine icra yoluna başvurabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35" başlık="Bağlı krediler">
        <mvz-fıkra no="1">
          <template>Bağlı kredi sözleşmesi; konut finansmanı kredisinin münhasıran belirli bir konutun satın alınması durumunda bir sözleşmenin finansmanı için verildiği ve bu iki sözleşmenin objektif açıdan ekonomik bir birlik oluşturduğu sözleşmedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bağlı kredilerde, konutun hiç ya da gereği gibi teslim edilmemesi nedeniyle tüketicinin bu Kanunun 11 inci maddesinde belirtilen seçimlik haklarından birini kullanması hâlinde, satıcı ve konut finansmanı kuruluşu müteselsilen sorumludur. Ancak, konut finansmanı kuruluşunun sorumluluğu; konutun teslim edilmemesi durumunda konut satış sözleşmesinde veya bağlı kredi sözleşmesinde belirtilen konut teslim tarihinden, konutun teslim edilmesi durumunda konutun teslim edildiği tarihten itibaren, kullanılan kredi miktarı ile sınırlı olmak üzere bir yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Konut finansmanı kuruluşları tarafından verilen kredilerin ipotek finansmanı kuruluşlarına, konut finansmanı fonlarına veya ipotek teminatlı menkul kıymet teminat havuzlarına devrolması hâlinde dahi, kredi veren konut finansmanı kuruluşunun sorumluluğu devam eder. Krediyi devralan kuruluş bu madde kapsamında sorumlu olmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Konut finansmanı kuruluşu ile satıcı arasında belirli bir konutun tedarikine ilişkin bir sözleşme olmaksızın, tüketicinin kendisi tarafından belirlenen konutun bedelinin kredi veren konut finansmanı kuruluşu tarafından ödenmesi suretiyle kullandırılan krediler bağlı kredi sayılmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="36" başlık="Faiz oranı">
        <mvz-fıkra no="1">
          <template>Kredilerde geri ödeme tutarlarının, finansal kiralama işlemlerinde ise kira bedellerinin anaparayı aşan kısmı bu madde kapsamında faiz olarak kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sözleşmede belirtilmek suretiyle konut finansmanına yönelik kredilerde ve finansal kiralama işlemlerinde faiz oranı sabit veya değişken olarak ya da aynı kredi için her iki yöntem esas alınmak suretiyle belirlenebilir. Faiz oranının sabit olarak belirlenmesi hâlinde, sözleşmenin kurulduğu tarihte belirlenen oran tarafların rızası dışında değiştirilemez. Oranın değişken olarak belirlenmesi hâlinde ise, başlangıçta sözleşmede belirlenen oran, dönemsel geri ödeme tutarı başlangıçta sözleşmede belirlenen azami dönemsel geri ödeme tutarını aşmamak koşuluyla ve sözleşmede belirlenecek yurt içinde veya yurt dışında genel kabul görmüş ve yaygın olarak kullanılan endekslerden en düşük olanı baz alınarak değiştirilebilir. Oranların değişken olarak belirlenmesi hâlinde bu yöntemin muhtemel etkileri konusunda tüketicilerin bilgilendirilmesi şarttır. Bu amaçlarla kullanılabilecek referans faizler ve endeksler Türkiye Cumhuriyet Merkez Bankası tarafından belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="Erken ödeme">
        <mvz-fıkra no="1">
          <template>Tüketici, vadesi gelmemiş bir veya birden çok taksit ödemesinde bulunabileceği gibi, konut finansmanı borcunun tamamını erken ödeyebilir. Bu hâllerde, konut finansmanı kuruluşu, erken ödenen miktara göre gerekli tüm faiz ve diğer maliyet unsurlarına ilişkin indirim yapmakla yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Faiz oranının sabit olarak belirlenmesi hâlinde, sözleşmede yer verilmek suretiyle, bir ya da birden fazla ödemenin vadesinden önce yapılması durumunda, konut finansmanı kuruluşu tarafından tüketiciden erken ödeme tazminatı talep edilebilir. Erken ödeme tazminatı gerekli faiz indirimi yapılarak hesaplanan ve tüketici tarafından konut finansmanı kuruluşuna erken ödenen tutarın kalan vadesi otuz altı ayı aşmayan kredilerde yüzde birini, kalan vadesi otuz altı ayı aşan kredilerde ise yüzde ikisini geçemez. Oranların değişken olarak belirlenmesi hâlinde tüketiciden erken ödeme tazminatı talep edilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="Sigorta, yan finansal ürün ve hizmet sunumu">
        <mvz-fıkra no="1">
          <template>Tüketicinin yazılı veya kalıcı veri saklayıcısı aracılığıyla açık talebi olmaksızın kredi bağlantılı sigorta yaptırılamaz. Konut finansmanı kuruluşu, kredi bağlantılı sigorta içermeyen bir sözleşmeyi de tüketiciye teklif etmek koşuluyla kredi bağlantılı sigorta yaptırılmasını içeren bir konut finansmanı sözleşmesini tüketiciye sunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketicinin istediği sigorta şirketinden sağladığı teminat, konut finansmanı kuruluşu tarafından kabul edilmek zorundadır. Kredi bağlantılı sigortanın; kredi borcunun geri ödenme teminatını sağlama amacıyla, meblağ sigortalarında kalan borç tutarıyla ve vadesiyle uyumlu olması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Konut finansmanı sözleşmesi, kredi ile ilgili olanlar hariç yan finansal ürün ve hizmetlerin satın alınması şartına bağlanamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="Diğer hususlar">
        <mvz-fıkra no="1">
          <template>Konut finansmanı sözleşmesine ilişkin bir hesap açılması ve bu hesaptan sadece kredi ile ilgili işlemler yapılması durumunda, tüketiciden bu hesaba ilişkin herhangi bir isim altında ücret veya masraf talep edilemez. Bu hesap, tüketicinin aksine yazılı veya kalıcı veri saklayıcısıyla talebi olmaması hâlinde kredinin ödenmesi ile kapanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketicinin açık talimatı olmaksızın konut finansmanı sözleşmesi ile ilişkili bir kredili mevduat sözleşmesi yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Bölüm hükümlerinin uygulanmasında, konut yapı kooperatiflerinin gerçek kişi ortakları da tüketici olarak kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sözleşme öncesi bilgilendirme, tüketici ile konut finansmanı kuruluşunun hak ve yükümlülükleri, sözleşmenin zorunlu içeriği, konut finansmanı reklamları, yeniden finansman, bağlı kredi, temerrüt, erken ödeme ve yıllık maliyet oranının hesaplanması ile diğer hususlara ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Ön Ödemeli Konut Satışı">
      <mvz-madde no="40" başlık="Ön ödemeli konut satış sözleşmeleri">
        <mvz-fıkra no="1">
          <template>Ön ödemeli konut satış sözleşmesi, tüketicinin konut amaçlı bir taşınmazın satış bedelini önceden peşin veya taksitle ödemeyi, satıcının da bedelin tamamen veya kısmen ödenmesinden sonra taşınmazı tüketiciye devir veya teslim etmeyi üstlendiği sözleşmedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketicilere sözleşmenin kurulmasından en az bir gün önce, Bakanlıkça belirlenen hususları içeren ön bilgilendirme formu verilmek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yapı ruhsatı alınmadan, tüketicilerle ön ödemeli konut satış sözleşmesi yapılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="41" başlık="Şekil şartı">
        <mvz-fıkra no="1">
          <template>Ön ödemeli konut satışının tapu siciline tescil edilmesi, satış vaadi sözleşmesinin ise noterde düzenleme şeklinde yapılması zorunludur. Aksi hâlde satıcı, sonradan sözleşmenin geçersizliğini tüketicinin aleyhine olacak şekilde ileri süremez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Satıcı, geçerli bir sözleşme yapılmış olmadıkça tüketiciden herhangi bir isim altında ödeme yapmasını veya tüketiciyi borç altına sokan herhangi bir belge vermesini isteyemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="42" başlık="Teminat">
        <mvz-fıkra no="1">
          <template>Bakanlıkça projedeki konut adedi ya da projenin toplam bedeli kriterine göre belirlenecek büyüklüğün üzerindeki projeler için satıcının ön ödemeli konut satışına başlamadan önce; kapsamı, koşulları ve uygulama esasları Hazine Müsteşarlığınca belirlenen bina tamamlama sigortası yaptırması veya Bakanlıkça belirlenen diğer teminat ve şartları sağlaması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bina tamamlama sigortası kapsamında sağlanan tazminat, teminat ve benzeri güvenceler iflas veya tasfiye masasına dâhil edilemez, haczolunamaz, üzerlerine ihtiyati tedbir ve ihtiyati haciz konulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="43" başlık="Cayma hakkı">
        <mvz-fıkra no="1">
          <template>Tüketici, on dört gün içinde herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin ön ödemeli konut satış sözleşmesinden cayma hakkına sahiptir. Cayma hakkının kullanıldığına dair bildirimin bu süre içinde satıcıya yöneltilmiş olması yeterlidir. Satıcı, cayma hakkı konusunda tüketicinin bilgilendirildiğini ispat etmekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Taşınmazın kısmen veya tamamen bağlı krediyle alınması durumunda bağlı kredi sözleşmesi, sözleşmenin kurulduğu tarihte hüküm doğurmak üzere bu maddede öngörülen cayma hakkı süresi sonunda yürürlüğe girer. Konut finansmanı kuruluşu cayma hakkı süresi içinde tüketiciden faiz, komisyon, yasal yükümlülük ve benzeri isimler altında hiçbir masraf talep edemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Satıcının aldığı bedeli ve tüketiciyi borç altına sokan her türlü belgeyi iade ettiği tarihten itibaren, tüketici on gün içinde edinimlerini iade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="44" başlık="Konutun teslimi">
        <mvz-fıkra no="1">
          <template>Ön ödemeli konutun sözleşmede taahhüt edilen süre içinde tüketiciye teslim edilmesi zorunludur. Bu süre her hâlükârda sözleşme tarihinden itibaren kırk sekiz ayı geçemez. Kat irtifakının tüketici adına tapu siciline tescil edilmesiyle birlikte zilyetliğin devri hâlinde de devir ve teslim yapılmış sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="45" başlık="Sözleşmeden dönme">
        <mvz-fıkra no="1">
          <template>Ön ödemeli konut satışında sözleşme tarihinden itibaren yirmidört aya kadar  tüketicinin herhangi bir gerekçe göstermeden sözleşmeden dönme hakkı vardır. Sözleşmeden dönülmesi durumunda satıcı; konutun satışı veya satış vaadi sözleşmesi nedeniyle oluşan vergi, harç ve benzeri yasal yükümlülüklerden doğan masraflar ile sözleşme tarihinden itibaren ilk üç ay için sözleşme bedelinin yüzde ikisine, üç ila altı ay arası için yüzde dördüne, altı ila oniki ay arası için yüzde altısına ve oniki ila yirmidört ay arası için de yüzde sekizine kadar tazminatın ödenmesini isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Satıcı, yükümlülüklerini hiç ya da gereği gibi yerine getirmezse tüketiciden herhangi bir bedel talep edemez. Tüketicinin ölmesi veya kazanç elde etmekten sürekli olarak yoksun kalması sebebiyle ön ödemeleri yapamayacak duruma düşmesi ya da sözleşmenin yerine olağan koşullarla yapılacak bir taksitle satış sözleşmesinin konulmasına ilişkin önerisinin satıcı tarafından kabul edilmemesi yüzünden sözleşmeden dönülmesi hâllerinde tüketiciden herhangi bir bedel talep edilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sözleşmeden dönülmesi durumunda, tüketiciye iade edilmesi gereken tutar ve tüketiciyi borç altına sokan her türlü belge, dönme bildiriminin satıcıya ulaştığı tarihten itibaren en geç yüzseksen gün içinde tüketiciye geri verilir. Satıcının aldığı bedeli ve tüketiciyi borç altına sokan her türlü belgeyi iade ettiği tarihten itibaren, tüketici on gün içinde edinimlerini iade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="46" başlık="Diğer hususlar">
        <mvz-fıkra no="1">
          <template>Sözleşme öncesi bilgilendirme, sözleşmenin zorunlu içeriği, tüketici ile satıcının hak ve yükümlülükleri, cayma hakkı ve sözleşmeden dönme ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Diğer Tüketici Sözleşmeleri">
      <mvz-madde no="47" başlık="İş yeri dışında kurulan sözleşmeler">
        <mvz-fıkra no="1">
          <template>Satıcı veya sağlayıcı ile tüketici arasında;</template>
          <mvz-bent no="a">
            <template>Teklifin tüketici ya da satıcı veya sağlayıcı tarafından yapılmasına bakılmaksızın iş yeri dışında, tarafların eş zamanlı fiziksel varlığında kurulan,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Tarafların eş zamanlı fiziksel varlığında tüketiciyle iş yeri dışında görüşülmesinin hemen sonrasında, satıcı veya sağlayıcının iş yerinde ya da herhangi bir uzaktan iletişim aracıyla kurulan,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Mal ve hizmetlerin tüketiciye tanıtımı ya da satışı amacıyla satıcı veya sağlayıcı tarafından düzenlenen bir gezi esnasında kurulan,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>sözleşmeler iş yeri dışında kurulan sözleşmeler olarak kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İş yeri dışında kurulan sözleşmeler, Bakanlık tarafından yetkilendirilmiş satıcı veya sağlayıcı tarafından kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tüketicinin, iş yeri dışında kurulan sözleşme ya da buna karşılık gelen herhangi bir öneri ile bağlanmadan önce ayrıntıları yönetmelikte belirlenen hususlarda açık ve anlaşılır şekilde bilgilendirilmesi zorunludur. Tüketicinin bilgilendirildiğine ilişkin ispat yükü satıcı veya sağlayıcıya aittir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İş yeri dışında kurulan sözleşmeler yazılı olarak kurulmadıkça geçerli olmaz. Geçerli bir sözleşme kurmamış olan satıcı veya sağlayıcı, sonradan sözleşmenin geçersizliğini tüketicinin aleyhine olacak şekilde ileri süremez. Satıcı veya sağlayıcı; tüketicinin kendi el yazısı ile sözleşme tarihini yazmasını ve sözleşmeyi imzalamasını sağlamak, sözleşmenin bir nüshasını tüketiciye vermek ve mal veya hizmeti tüketiciye sunmakla yükümlüdür. Sözleşmenin tüketiciye teslim edildiğinin ve mal veya hizmetin sunulduğunun ispatı satıcı veya sağlayıcıya aittir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Tüketici, on dört gün içinde herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin sözleşmeden cayma hakkına sahiptir. Cayma hakkının kullanıldığına dair bildirimin bu süre içinde satıcı veya sağlayıcıya yöneltilmiş olması yeterlidir. Cayma süresi içinde satıcı veya sağlayıcı sözleşmeye konu mal veya hizmet karşılığında tüketiciden herhangi bir isim altında ödeme yapmasını veya tüketiciyi borç altına sokan herhangi bir belge vermesini isteyemez. Satıcı veya sağlayıcı, cayma hakkı konusunda tüketicinin bilgilendirildiğini ispat etmekle yükümlüdür. Tüketici, cayma süresi içinde malın mutat kullanımı sebebiyle meydana gelen değişiklik ve bozulmalardan sorumlu değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Satıcı veya sağlayıcının bu maddede belirtilen yükümlülüklere aykırı hareket etmesi veya tüketiciyi cayma hakkı konusunda gerektiği şekilde bilgilendirmemesi durumunda, tüketici cayma hakkını kullanmak için on dört günlük süreyle bağlı değildir. Her hâlükârda bu süre cayma süresinin bittiği tarihten itibaren bir yıl sonra sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Sözleşmenin zorunlu içeriği, kapsam dışı sözleşmeler, doğrudan satışlar, tüketici ile satıcı ve sağlayıcının hak ve yükümlülükleri, cayma hakkı, bilgilendirme yükümlülüğü, teslimat, satış yapacaklarda aranacak nitelikler ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="48" başlık="Mesafeli sözleşmeler">
        <mvz-fıkra no="1">
          <template>Mesafeli sözleşme, satıcı veya sağlayıcı ile tüketicinin eş zamanlı fiziksel varlığı olmaksızın, mal veya hizmetlerin uzaktan pazarlanmasına yönelik olarak oluşturulmuş bir sistem çerçevesinde, taraflar arasında sözleşmenin kurulduğu ana kadar ve kurulduğu an da dâhil olmak üzere uzaktan iletişim araçlarının kullanılması suretiyle kurulan sözleşmelerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketici, mesafeli sözleşmeyi ya da buna karşılık gelen herhangi bir teklifi kabul etmeden önce ayrıntıları yönetmelikte belirlenen hususlarda ve siparişi onaylandığı takdirde ödeme yükümlülüğü altına gireceği konusunda açık ve anlaşılır şekilde satıcı veya sağlayıcı tarafından bilgilendirilir. Tüketicinin bilgilendirildiğine ilişkin ispat yükü satıcı veya sağlayıcıya aittir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Satıcı veya sağlayıcı, tüketicinin siparişinin kendisine ulaştığı andan itibaren taahhüt edilen süre içinde edimini yerine getirir.  Tüketicinin isteği veya kişisel ihtiyaçları doğrultusunda hazırlanan mallara ilişkin sözleşmeler haricinde mal satışlarında bu süre her hâlükârda otuz günü geçemez. Satıcı veya sağlayıcının bu süre içinde edimini yerine getirmemesi durumunda tüketici sözleşmeyi feshedebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Tüketici, on dört gün içinde herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin sözleşmeden cayma hakkına sahiptir. Cayma hakkının kullanıldığına dair bildirimin bu süre içinde satıcı veya sağlayıcıya yöneltilmiş olması yeterlidir. Satıcı veya sağlayıcı, cayma hakkı konusunda tüketicinin bilgilendirildiğini ispat etmekle yükümlüdür. Tüketici, cayma hakkı konusunda gerektiği şekilde bilgilendirilmezse, cayma hakkını kullanmak için on dört günlük süreyle bağlı değildir. Her hâlükârda bu süre cayma süresinin bittiği tarihten itibaren bir yıl sonra sona erer. Tüketici, cayma hakkı süresi içinde malın mutat kullanımı sebebiyle meydana gelen değişiklik ve bozulmalardan sorumlu değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Oluşturdukları sistem ile satıcı veya sağlayıcı adına mesafeli sözleşme kurulmasına aracılık eden aracı hizmet sağlayıcılar, sistem aracılığıyla kurulan mesafeli sözleşmelerden doğan hak ve yükümlülüklerin kullanım süresi boyunca tüketicilerin yönetmelikle belirlenen hususlara ilişkin talep ve bildirimlerini iletebilmelerine ve takip edebilmelerine elverişli bir sistemi kurmak ve kesintisiz olarak açık tutmakla yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Aracı hizmet sağlayıcısı olarak faaliyet gösterenler aracılık ettikleri mesafeli sözleşmelere ilişkin olarak;</template>
          <mvz-bent no="a">
            <template>Tüketiciye ön bilgilendirmenin yapılmasından, teyidinden ve ispatından satıcı veya sağlayıcı ile birlikte müteselsilen,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Veri girişinin satıcı veya sağlayıcı tarafından yapıldığı durumlar hariç olmak üzere, yönetmelikle belirlenen ön bilgilendirmede bulunması zorunlu hususlardaki eksikliklerden,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bu maddede yer alan hususlardan dolayı tüketicilerin satıcı veya sağlayıcılar ile yaptıkları işlemlere ilişkin kayıtların tutulmasından ve istenilmesi hâlinde bu bilgilerin ilgili kamu kurum ve kuruluşları ile tüketicilere verilmesinden,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Satıcı veya sağlayıcı ile yaptıkları aracılık hizmetine ilişkin sözleşmeye aykırı uygulamaları nedeniyle satıcı ve sağlayıcıların bu madde hükümlerine aykırı davranmasına sebep oldukları her bir işlemden,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Satıcı veya sağlayıcı adına bedel tahsil etmesi hâlinde, mal veya hizmetin tüketiciye teslim veya ifası sonrası bedelin satıcıya veya sağlayıcıya aktarıldığı durumlar ile 11 inci ve 15 inci maddelerde yer alan hakların kullanımı hariç olmak üzere teslim veya ifa ile cayma hakkına ilişkin yükümlülüklerden satıcı veya sağlayıcı ile birlikte müteselsilen,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Satıcı veya sağlayıcı onayı olmaksızın düzenledikleri kampanyalı, promosyonlu veya indirimli satışlarda, sözleşmenin hiç ya da gereği gibi ifa edilmemesinden,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Ön bilgilendirmede yer alan hususlar ile reklamlarında yer alan bilgilerin uyumlu olmasından ve ispatından,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>sorumludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Mesafeli sözleşmelerde, kapsam dışı sözleşmeler, tüketici, satıcı ve sağlayıcı ile mesafeli sözleşme kurulmasına aracılık eden aracı hizmet sağlayıcının hak ve yükümlülükleri, cayma hakkı, bilgilendirme yükümlülüğü, teslimat ile diğer uygulama usul ve esasları yönetmelikle belirlenir.11</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="49" başlık="Finansal hizmetlere ilişkin mesafeli sözleşmeler">
        <mvz-fıkra no="1">
          <template>Finansal hizmetler, her türlü banka hizmeti, kredi, sigorta, bireysel emeklilik, yatırım ve ödeme ile ilgili hizmetleri ifade eder. Finansal hizmetlere ilişkin mesafeli sözleşme, finansal hizmetlerin uzaktan pazarlanmasına yönelik olarak oluşturulmuş bir sistem çerçevesinde, sağlayıcı ile tüketici arasında uzaktan iletişim araçlarının kullanılması suretiyle kurulan sözleşmelerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Finansal hizmetlere ilişkin mesafeli sözleşmelerde, tüketicinin sözleşmenin kurulmasına ilişkin iradesini açıklamadan önce, cayma hakkı, tüketicinin kabul beyanı vermesi hâlinde yükümlülük altına gireceği ve ayrıntıları Bakanlıkça belirlenen diğer hususlarda, açık, anlaşılır ve kullanılan iletişim araçlarına uygun bir şekilde bilgilendirilmesi zorunludur. Bu bilgilendirmenin ticari amaçla yapıldığı anlaşılır olmalı ve sesli iletişim araçlarının kullanıldığı hâllerde sağlayıcının kimliği ile görüşme talebinin sebebi her görüşmenin başında belirtilmelidir. Tüketicinin sözleşmenin kurulmasına dair kabul beyanı kullanılan iletişim araçlarına uygun olarak fiziki veya elektronik ortamda tespit veya kayıt edilir. Sağlayıcı, cayma hakkının iletilmesi ile fiziki veya elektronik ortamda yapılacak tespit veya kayıtlar için gerekli önlemleri almakla yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sağlayıcının, sözleşmenin bütün şartlarını ve Bakanlıkça belirlenen diğer hususları, kâğıt üzerinde veya kalıcı veri saklayıcısı aracılığıyla tüketiciye iletmesi zorunludur. Bu yükümlülük, tüketicinin sözleşmeyi kuran iradesini yöneltmesinden önce veya tüketicinin talebi üzerine yazılı bilgilendirmeye elverişli olmayan bir uzaktan iletişim aracı kullanılarak sözleşmenin kurulması hâlinde sözleşmenin kurulmasından hemen sonra yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Tüketici, sözleşme ilişkisinin devam ettiği süre içinde herhangi bir ücret ödemeksizin sözleşmenin kâğıt üzerinde yazılı bir örneğini talep edebilir. Ayrıca tüketici, finansal hizmetin niteliğiyle bağdaşması hâlinde kullanılan uzaktan iletişim aracını değiştirme hakkına sahiptir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Tüketici, finansal hizmetlere ilişkin mesafeli sözleşmelerden on dört gün içinde herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin cayma hakkına sahiptir. Cayma hakkının kullanıldığına dair bildirimin bu süre içinde sağlayıcıya yöneltilmiş olması yeterlidir. Sağlayıcı, cayma hakkı konusunda tüketicinin bilgilendirildiğini ispatla yükümlüdür. Sigorta sözleşmelerine ve bireysel emekliliğe ilişkin sözleşmelerde ise cayma süresi hakkında diğer mevzuatta yer alan tüketici lehine olan hükümler uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Finansal hizmetlere ilişkin mesafeli sözleşmelerde, tüketicinin sözleşmeyi sona erdirmesine ilişkin talebini herhangi bir uzaktan iletişim aracıyla iletmesi yeterlidir. Tüketici, sözleşmeyi sona erdirmek için sözleşmenin tesis edilmesini sağlayan yöntemden daha ağır koşullar içeren bir yöntem kullanmak zorunda bırakılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Finansal hizmetlere ilişkin mesafeli sözleşmelerde, uzaktan iletişim araçlarının kullanılması, kapsam dışı sözleşmeler, kartla ödeme, tüketici ile sağlayıcının hak ve yükümlülükleri, cayma hakkı ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="50" başlık="Devre tatil ve uzun süreli tatil hizmeti sözleşmeleri">
        <mvz-fıkra no="1">
          <template>Devre tatil sözleşmesi, bir yıldan uzun süre için kurulan ve tüketiciye bu süre zarfında birden fazla dönem için bir veya daha fazla sayıda gecelik konaklama imkânı veren sözleşmelerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Devre tatil sözleşmeleri ile sağlanan hakkın şahsi veya ayni bir hak olması ya da devre tatil satışının finansal kiralama ile yapılması bu maddenin uygulanmasını engellemez. 23/6/1965 tarihli ve 634 sayılı Kat Mülkiyeti Kanununun sekizinci bölümü hükümleri kapsamında kurulan devre mülk hakkı veren sözleşmeler hariç olmak üzere, tüketicilerle mülkiyet payına bağlı ayni hak sağlayan devre tatil sözleşmesi kurulamaz. Kooperatif veya ticaret şirketi ortaklığı ya da dernek veya vakıf üyeliği suretiyle devre tatil hakkı tanınamaz. Devre tatile konu mal üzerinde ayni hak sahibi olmayanlar devre tatil satışı yapamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Uzun süreli tatil hizmeti sözleşmesi, bir yıldan uzun süre için kurulan ve tüketiciye, belirlenen süre zarfında konaklamaya veya konaklama ile birlikte seyahat ya da diğer hizmetlerin beraber sunulduğu durumlara ilişkin indirim yahut diğer menfaatlerden faydalanma hakkı verilen sözleşmelerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Tüketicilere aşağıdaki sözleşmelerin kurulmasından en az bir gün önce, Bakanlıkça belirlenen hususları içeren ön bilgilendirme formu verilmesi zorunludur:</template>
          <mvz-bent no="a">
            <template>Devre tatil sözleşmeleri</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Uzun süreli tatil hizmeti sözleşmeleri</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Değişim sözleşmeleri</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Satıcı veya sağlayıcının, devre tatil veya uzun süreli tatil hizmetinin alınıp satılması hususunda tüketiciye yardımcı olduğu yeniden satış sözleşmeleri.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Mesafeli satış yöntemiyle kurulan sözleşmeler hariç olmak üzere satıcı veya sağlayıcı, tüketicinin kendi el yazısıyla sözleşme tarihini yazmasını ve sözleşmeyi imzalamasını sağlamakla yükümlüdür. Yazılı veya mesafeli olarak kurulan bu sözleşmelerin bir nüshasının kâğıt üzerinde veya kalıcı veri saklayıcısı ile tüketiciye verilmesi zorunludur. Daha ağır şekil şartları öngören kanun hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Tüketici, on dört gün içinde herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin sözleşmeden cayma hakkına sahiptir. Cayma süresi dolmadan satıcı veya sağlayıcı, tüketiciden herhangi bir isim altında ödeme yapmasını veya tüketiciyi borç altına sokan herhangi bir belge vermesini isteyemez.  Bu yasağa rağmen, tüketiciden herhangi bir bedel alınması durumunda alınan bedel tüketiciye derhâl iade edilir. Ayrıca tüketiciyi borç altına sokan her türlü belge tüketici yönünden geçersizdir. Devre tatil, uzun süreli tatil hizmeti sözleşmeleri ve bu sözleşmelerle birlikte düzenlenmiş olan yeniden satım, değişim ve ilgili diğer tüm sözleşmeler cayma hakkının kullanılması ile birlikte kendiliğinden sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Tüketicinin ödeyeceği bedel, kısmen veya tamamen satıcı veya sağlayıcı ile kredi veren arasındaki anlaşmaya dayanılarak bir kredi veren tarafından karşılanıyorsa, tüketicinin sözleşmeden cayması ve buna ilişkin bildirimin cayma süresi içinde ayrıca kredi verene de yöneltilmesi hâlinde, bağlı kredi sözleşmesi de herhangi bir tazminat veya cezai şart ödeme yükümlülüğü olmaksızın sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Devre mülk hakkı veren sözleşmeler de dâhil olmak üzere tüketicilerle ön ödemeli devre tatil sözleşmesi kurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Devre mülk hakkı veren sözleşmeler hariç olmak üzere, devre tatil sözleşmeleri en fazla on yıl için kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Tüketici, şahsi hak sağlayan devre tatil sözleşmesinden kaynaklanan tatil hakkını belirli bir dönem için kullanmayacağını tatilin başlayacağı tarihten en az doksan gün önce sağlayıcıya bildirirse, o dönem için tüketiciden herhangi bir isim altında bedel talep edilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Devre tatil, uzun süreli tatil hizmeti, yeniden satım, değişim sözleşmeleri ve ön bilgilendirmenin içeriği, tüketici ile satıcı ve sağlayıcının hak ve yükümlülükleri, cayma hakkı  ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="51" başlık="Paket tur sözleşmeleri">
        <mvz-fıkra no="1">
          <template>Paket tur sözleşmesi, paket tur düzenleyicileri veya aracıları tarafından aşağıdaki hizmetlerden en az ikisinin birlikte, her şeyin dâhil olduğu fiyatla satıldığı veya satımının vaat edildiği ve hizmetin yirmi dört saatten uzun bir süreyi kapsadığı veya gecelik konaklamayı içerdiği sözleşmelerdir:</template>
          <mvz-bent no="a">
            <template>Ulaştırma</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Konaklama</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Ulaştırma ve konaklama hizmetlerine bağlı olmayan başka turizm hizmetleri.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Turun ayrıntılarının, paket tur düzenleyicisi, aracısı veya tüketici tarafından belirlenmiş olması veya aynı paket tur içindeki hizmetlerin ayrı ayrı faturalandırılması hâllerinde de bu madde hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Paket tur düzenleyicisinin Türkiye’de temsilcisinin bulunmadığı hâllerde paket tur aracısı paket tur düzenleyicisi gibi sorumlu olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Paket tur sözleşmesinin kurulmasından önce tüketiciye ön bilgilendirme amaçlı broşür verilmesi zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Paket tur düzenleyicileri veya aracıları, yazılı veya mesafeli olarak kurulan paket tur sözleşmelerinin bir nüshasını kâğıt üzerinde veya kalıcı veri saklayıcısı aracılığıyla tüketiciye vermek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Tüketici, kendisinden kaynaklanmayan nedenlerle paket tur sözleşmesinin esaslı unsurlarından birisinin değişmesi veya turun başlamadan önce iptal edilmesi hâllerinde bu değişikliği veya paket tur düzenleyicisi tarafından sunulan alternatif bir turu kabul edebileceği gibi sözleşmeden dönme hakkına da sahiptir. Sözleşmeden dönülmesi hâlinde paket tur düzenleyicisi veya aracısının, dönme bildiriminin kendisine ulaştığı tarihten itibaren tüketicinin ödemiş olduğu tüm bedeli herhangi bir kesinti yapmaksızın derhâl iade etmesi zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Tüketicinin, sözleşmenin ifası sürecinde ortaya çıkan her türlü eksiklik nedeniyle bedelin indirilmesini talep etme hakkı vardır. Paket tur düzenleyicisinin, tur başladıktan sonra önemli bir yükümlülüğünü yerine getirmediği veya getiremeyeceği tespit edildiğinde tüketici sözleşmeden dönebilir. Bu hâllerde paket tur düzenleyicisi veya aracısının ücret talep etme hakkı sona erer. Yapılmış olan ödemelerin sözleşmeden dönüldüğü tarihten itibaren tüketiciye derhâl iade edilmesi zorunludur. Ancak paket tur düzenleyicisi o ana kadar ifa etmiş olduğu edimler için tüketiciden hizmetten faydalandığı oranda uygun bir karşılık talep edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>14/9/1972 tarihli ve 1618 sayılı Seyahat Acentaları ve Seyahat Acentaları Birliği Kanununun zorunlu sigorta ile ilgili hükümleri saklı olmak üzere, paket tur düzenleyicisi sözleşmenin hiç veya gereği gibi ifa edilmemesi nedeniyle tüketicinin uğradığı her türlü zarardan sorumludur. Tüketici boşa harcanan tatil zamanı için de uygun bir tazminat talep edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Ticari veya mesleki faaliyetleri çerçevesinde paket tur hizmetinden faydalanan kişiler de tüketici olarak kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Ön bilgilendirme, sözleşmenin içeriği, paket turun devri, sözleşmede değişiklik yapılmasının koşulları ve bu hâllerde tüketicinin hakları, paket turun iptal edilmesinin sonuçları, paket tur düzenleyicisinin ve aracısının sorumlulukları, tüketicinin hangi hâllerde tazminat talep edebileceği, sözleşmeden dönme ve sonuçları ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="52" başlık="Abonelik sözleşmeleri">
        <mvz-fıkra no="1">
          <template>Abonelik sözleşmesi, tüketicinin, belirli bir mal veya hizmeti sürekli veya düzenli aralıklarla edinmesini sağlayan sözleşmelerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yazılı veya mesafeli olarak kurulan bu sözleşmelerin bir nüshasının kâğıt üzerinde veya kalıcı veri saklayıcısı ile tüketiciye verilmesi zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
