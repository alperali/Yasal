          <template>Belirli süreli abonelik sözleşmelerine sözleşmenin belirlenen süre kadar uzayacağına ilişkin hükümler konulamaz; ancak abonelik sözleşmesinin kurulmasından sonra, sözleşmenin sona ereceği tarihe kadar tüketicinin talepte bulunması veya onay vermesi hâlinde abonelik sözleşmesi uzatılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Tüketici, belirsiz süreli veya süresi bir yıldan daha uzun olan belirli süreli abonelik sözleşmesini herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin istediği zaman feshetme hakkına sahiptir. Süresi bir yıldan az olan belirli süreli abonelik sözleşmesinde satıcı veya sağlayıcı tarafından sözleşme koşullarında değişiklik yapılması hâlinde de tüketici sözleşmeyi feshedebilir. Fesih bildiriminin kâğıt üzerinde veya kalıcı veri saklayıcısı ile satıcı veya sağlayıcıya yöneltilmiş olması yeterlidir. Satıcı veya sağlayıcı, abonelik sözleşmesinin feshi için sözleşmenin tesis edilmesini sağlayan yöntemden daha ağır koşullar içeren bir yöntem belirleyemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Satıcı veya sağlayıcı, tüketicinin aboneliğe son verme isteğini yönetmelikle belirlenen süreler içinde yerine getirmekle yükümlüdür. Aboneliğin belirlenen süreler içinde sona erdirilmediği durumlarda, bu sürelerin bitiminden itibaren mal veya hizmetten yararlanılmış olsa dahi, tüketiciden herhangi bir bedel talep edilemez. Satıcı veya sağlayıcı, fesih bildiriminin hüküm ifade etmesinden itibaren on beş gün içinde tüketici tarafından ödenmiş olan ücretin geri kalan kısmını kesinti yapmaksızın iade etmekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Satıcı veya sağlayıcı, abonelik sözleşmesinin feshedilmesi ile ilgili bildirim ve taleplere ilişkin işlemleri yerine getirmek üzere gerekli tedbirleri almak ve gerektiğinde uygun bir sistem kurup bu sistemi kesintisiz olarak açık tutmakla yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Sözleşmenin zorunlu içeriği, tüketici ile satıcı ve sağlayıcının hak ve yükümlülükleri ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="53" başlık="Süreli yayın kuruluşlarınca düzenlenen promosyon uygulamaları">
        <mvz-fıkra no="1">
          <template>Süreli yayın kuruluşlarınca düzenlenen ve her ne amaç ve şekilde olursa olsun, bilet, kupon, iştirak numarası, oyun, çekiliş ve benzeri yollarla süreli yayın dışında ikinci bir mal veya hizmetin verilmesinin taahhüt edildiği veya verildiği promosyon uygulamalarında, yönetmelikle belirlenen süreli yayıncılık amaçlarına uygun kültürel mal veya hizmetler dışında başka bir mal veya hizmet verilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Süreli yayının birden fazla sayıda satın alınmasını gerektiren ve belirli bir zamana yayılan promosyon uygulamalarının süresi; günlük süreli yayınlarda yetmiş beş günü, haftalık süreli yayınlarda on sekiz haftayı, daha uzun süreli yayınlarda ise on iki ayı geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Süreli yayın kuruluşu, promosyon uygulamasına ait reklamlarda uygulamaya konu olan mal veya hizmetin Türkiye genelinde teslim ve ifa tarihlerine ilişkin programını ilan etmek ve bu mal veya hizmetin teslim ve ifasını, promosyon uygulamasının bitiminden itibaren kırk beş gün içinde yerine getirmek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Promosyon uygulaması süresince, süreli yayının satış fiyatı, ikinci ürün olarak verilmesi taahhüt edilen mal veya hizmetin yol açtığı maliyet artışı nedeniyle artırılamaz. Promosyon uygulamasına konu olan mal veya hizmet bedelinin tamamının veya bir bölümünün tüketici tarafından karşılanması istenemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Promosyon uygulamasına konu olan mal veya hizmet taahhüdü ve dağıtımı bölünerek yapılamaz ve bu mal veya hizmetin ayrılmaz ya da tamamlayıcı parçaları da ayrı bir promosyon konusu hâline getirilemez. Bu Kanunun uygulanmasında ikinci ürün olarak verilmesi taahhüt edilen her bir mal veya hizmete ilişkin işlemler bağımsız bir promosyon uygulaması olarak kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Süreli yayın kuruluşları tarafından düzenlenmeyen ancak süreli yayınla doğrudan veya dolaylı ilişkilendirilen promosyon uygulamaları da bu madde hükümlerine tabidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Promosyon uygulamalarına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Tüketicinin Bilgilendirilmesi ve Menfaatlerinin Korunması">
    <mvz-madde no="54" başlık="Fiyat etiketi">
      <mvz-fıkra no="1">
        <template>Perakende satışa arz edilen malların veya ambalajlarının yahut kaplarının üzerine kolaylıkla görülebilir ve okunabilir şekilde tüketicinin ödeyeceği tüm vergiler dâhil satış fiyatı ve birim fiyatını gösteren, üretim yeri ve ayırıcı özelliklerini içeren etiket konulması; etiket konulması mümkün olmayan hâllerde aynı bilgileri kapsayan listelerin görülebilecek şekilde uygun yerlere asılması zorunludur. Hizmetlerin tarife ve fiyatlarını gösteren listeler de bu madde hükmüne göre düzenlenerek asılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Etiket, tarife ve fiyat listelerinde belirtilen fiyat ile kasa fiyatı arasında fark olması durumunda tüketici lehine olan fiyat uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İndirimli satışa konu edilen mal veya hizmetlerin indirimli satış fiyatı, indirimden önceki fiyatı, tarife ve fiyat listeleri ile etiketlerinde gösterilir. İndirimli satışa konu edilen mal veya hizmetlerin indirimden önceki fiyattan daha düşük fiyatla satışa sunulduğunun ispatı satıcı veya sağlayıcıya aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bakanlık, belediyeler ve ilgili odalar, bu madde hükümlerinin uygulanması ve izlenmesine ilişkin işleri yürütmekle görevlidirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Etiket, tarife ve fiyat listeleri, indirimli satışlara ilişkin süre ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="55" başlık="Tanıtma ve kullanma kılavuzu">
      <mvz-fıkra no="1">
        <template>Tüketicinin kullanımına sunulan malların tanıtım, kullanım, kurulum, bakım ve basit onarımına ilişkin Türkçe tanıtma ve kullanma kılavuzuyla, gerektiğinde uluslararası sembol ve işaretleri kapsayan etiketle satışa sunulması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Malın güvenli kullanımına ilişkin hususların malın üzerinde yer alması hâlinde yazılı ve sesli ifadelerin Türkçe olması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Malların ilgili teknik düzenlemesi uyarınca kişinin sağlığı ile çevreye zararlı veya tehlikeli olabilmesi durumunda, bu malın güvenli kullanılabilmesi için malın üzerine veya tanıtma ve kullanma kılavuzuna bu durumla ilgili açıklayıcı bilgi ve uyarılar açıkça görülecek ve okunacak şekilde konulur veya yazılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Türkçe tanıtma ve kullanma kılavuzlarının hazırlanması sorumluluğu üretici ve ithalatçıya; tüketiciye verilmesi ve teslim edildiğinin ispat sorumluluğu ise satıcıya aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Hangi malların tanıtma ve kullanma kılavuzu ve etiket ile satılmak zorunda olduğu ve bunlarda bulunması gereken asgari unsurlar ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="56" başlık="Garanti belgesi">
      <mvz-fıkra no="1">
        <template>Üretici ve ithalatçılar, tüketiciye yönelik üretilen veya ithal edilen mallar için içeriği yönetmelikle belirlenen bir garanti belgesi düzenlemek zorundadır. Bu belgenin tekemmül ettirilerek tüketiciye verilmesi sorumluluğu satıcıya aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Garanti süresi malın teslim tarihinden itibaren başlamak üzere asgari iki yıldır. Ancak, özelliği nedeniyle bazı malların garanti şartları Bakanlıkça başka bir ölçü birimi ile belirlenebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tüketici bu Kanunun 11 inci maddesinde belirtilen seçimlik haklarından onarım hakkını kullanmışsa, malın garanti süresi içinde tekrar arızalanması veya tamiri için gereken azami sürenin aşılması veya tamirinin mümkün bulunmadığının anlaşılması hâllerinde 11 inci maddede yer alan diğer seçimlik haklarını kullanabilir. Satıcı tüketicinin talebini reddedemez. Bu talebin yerine getirilmemesi durumunda satıcı, üretici ve ithalatçı müteselsilen sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hangi malların garanti belgesi ile satılmak zorunda olduğu ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="57" başlık="İhtiyari garanti">
      <mvz-fıkra no="1">
        <template>İhtiyari garanti, tüketicinin yasal hakları saklı kalmak kaydıyla mal veya hizmetle ilgili; değişim, onarım, bakım, bedel iadesi ve benzeri hususlarda satıcı, sağlayıcı, üretici veya ithalatçı tarafından verilen ilave taahhüdü ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İhtiyari garanti taahhüdü süresince, taahhüt edilen hakların kullanılması nedeniyle tüketiciden masraf talep edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Taahhütte bulunan, taahhüdünün yanı sıra ilgili reklam ve ilanlarında yer alan ifadelerle de bağlıdır. Bu taahhütte, tüketicinin yasal haklarının saklı olduğu, garantiden faydalanma koşulları, süresi, garanti verenin adı ile iletişim bilgileri yer almak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İhtiyari garanti taahhüdünün tüketiciye yazılı olarak veya kalıcı veri saklayıcısı ile verilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İhtiyari garanti taahhüdü, bu maddede öngörülen özellikleri taşımasa bile taahhütte bulunanı bağlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="57/A" başlık="Yenilenmiş ürünler">
      <mvz-fıkra no="1">
        <template>Yenilenmiş ürünler; donanım, yazılım veya fiziki özelliklerinde iyileştirme yapılarak tekrar satışa sunulan kullanılmış mallardır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yenilenmiş ürünlere tüketiciye teslim tarihinden itibaren asgari bir yıl garanti verilmesi zorunludur. Ancak özelliği nedeniyle bazı malların garanti şartları Bakanlıkça başka bir ölçü birimi ile de belirlenebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yönetmelikle belirlenen mallar ancak Bakanlıkça yetkilendirilen merkezlerde yenilenmesi şartı ile yenilenmiş ürün olarak satılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yenileme merkezlerinin Bakanlıktan yetki belgesi alması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Elektronik kimlik bilgisi bulunan malların kullanılmış ve kayıtlı olduğuna ilişkin doğrulama yapılmasının gerektiği durumda bu doğrulamalar Bakanlık, yenileme merkezi ve yetkili alıcı tarafından Bakanlıkça belirlenen usul ve esaslara göre Bilgi Teknolojileri ve İletişim Kurumu kayıtlarından yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Hangi malların yenileme merkezleri tarafından yenileneceği, yenileme merkezlerinin kuruluşu ve sorumluluğu ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="58" başlık="Satış sonrası hizmetler">
      <mvz-fıkra no="1">
        <template>Üretici veya ithalatçılar, ürettikleri veya ithal ettikleri mallar için Bakanlıkça belirlenen kullanım ömrü süresince, satış sonrası bakım ve onarım hizmetlerini sağlamak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üretici veya ithalatçılar, yönetmelikle belirlenen mallar için Bakanlıkça onaylı satış sonrası hizmet yeterlilik belgesi almak ve tüm yetkili servis istasyonlarına ilişkin bilgileri güncel olarak Bakanlıkça oluşturulan sisteme kaydetmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bir malın yetkili servis istasyonlarındaki tamir süresi, yönetmelikle belirlenen azami süreyi geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Üretici veya ithalatçılar, yetkili servis istasyonlarını kendileri kurabileceği gibi servis istasyonlarının verdiği hizmetlerden sorumlu olmak şartıyla kurulu bulunan servis istasyonlarından veya servis organizasyonlarından da faydalanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Herhangi bir üretici veya ithalatçıya bağlı olmaksızın faaliyette bulunan servis istasyonları da verdikleri hizmetten dolayı tüketiciye karşı sorumludur.  Bu servis istasyonlarının, her türlü mecrada ve faaliyetlerinde kolaylıkla görülebilir ve okunabilir şekilde “özel servis” ibaresini kullanması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İthalatçının herhangi bir şekilde ticari faaliyetinin sona ermesi hâlinde bakım ve onarım hizmetlerinin sunulmasından garanti süresi boyunca satıcı, üretici ve yeni ithalatçı müteselsilen sorumludur. Garanti süresi geçtikten sonra ise kullanım ömrü süresince bakım ve onarım hizmetlerini üretici veya yeni ithalatçı sunmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Garanti süresi bittikten sonra Bakanlıkça belirlenen kullanım ömrü süresince mala ilişkin satış sonrası hizmetin üretici veya ithalatçı tarafından sağlanmaması hâlinde tüketici zararın tazminini talep edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Satış sonrası hizmet sunulması zorunlu olan mallar, oluşturulması gereken asgari yetkili servis istasyonu sayıları, azami tamir süreleri, servis istasyonlarının sorumlulukları ile diğer uygulama usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="59" başlık="Tüketicinin bilinçlendirilmesi">
      <mvz-fıkra no="1">
        <template>Tüketicinin bilinçlendirilmesi konusunda örgün ve yaygın eğitim kurumlarının ders programlarına, Bakanlığın görüşü alınarak Millî Eğitim Bakanlığınca gerekli ilaveler yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ülke genelinde yayın yapan radyo ve televizyon kuruluşları 08.00-22.00 saatleri arasında, ayda on beş dakikadan az olmamak üzere tüketicinin bilinçlendirilmesi amacıyla yayınlar yapmak zorundadır. Yapılan yayınların tarih, saat, süre ve içerik bilgileri liste hâlinde her ay düzenli olarak Radyo ve Televizyon Üst Kuruluna bildirilir. Bu saatler dışında yapılan yayınlar, aylık on beş dakikalık süreye dâhil edilmez. Bu süreler, Radyo ve Televizyon Üst Kurulu tarafından denetlenir ve sonuçları Bakanlığa bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="60" başlık="Tüketici ödülleri">
      <mvz-fıkra no="1">
        <template>Tüketici ödülleri, tüketicinin korunması ve bilinçlendirilmesi ile yasal haklarını kullanmaları konusunda özendirilmesi amaçlarına yönelik olarak verilen ödüllerdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tüketici ödülü ve benzeri isimler altında verilen ödüllerin herhangi bir menfaat temin edilmeksizin verilmesi ve bu ödüllerin önceden ilan edilen objektif kriterlere dayanması esastır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tüketici ödülü verilmesine ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="Ticari Reklam ve Haksız Ticari Uygulamalar">
    <mvz-madde no="61" başlık="Ticari reklam">
      <mvz-fıkra no="1">
        <template>Ticari reklam, ticaret, iş, zanaat veya bir meslekle bağlantılı olarak; bir mal veya hizmetin satışını ya da kiralanmasını sağlamak, hedef kitleyi oluşturanları bilgilendirmek veya ikna etmek amacıyla reklam verenler tarafından herhangi bir mecrada yazılı, görsel, işitsel ve benzeri yollarla gerçekleştirilen pazarlama iletişimi niteliğindeki duyurulardır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ticari reklamların Reklam Kurulunca belirlenen ilkelere, genel ahlaka, kamu düzenine, kişilik haklarına uygun, doğru ve dürüst olmaları esastır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tüketiciyi aldatıcı veya onun tecrübe ve bilgi noksanlıklarını istismar edici, can ve mal güvenliğini tehlikeye düşürücü, şiddet hareketlerini ve suç işlemeyi özendirici, kamu sağlığını bozucu, hastaları, yaşlıları, çocukları ve engellileri istismar edici ticari reklam yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Reklam olduğu açıkça belirtilmeksizin yazı, haber, yayın ve programlarda, mal veya hizmetlere ilişkin isim, marka, logo veya diğer ayırt edici şekil veya ifadelerle ticari unvan veya işletme adlarının reklam yapmak amacıyla yer alması ve tanıtıcı mahiyette sunulması örtülü reklam olarak kabul edilir. Her türlü iletişim aracında sesli, yazılı ve görsel olarak örtülü reklam yapılması yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Aynı ihtiyaçları karşılayan ya da aynı amaca yönelik rakip mal veya hizmetlerin karşılaştırmalı reklamı yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Reklam verenler ticari reklamlarında yer alan iddiaların doğruluğunu ispatla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Reklam verenler, reklam ajansları ve mecra kuruluşları bu madde hükümlerine uymakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Ticari reklamlara ilişkin getirilecek sınırlamalar ile bu reklamlarda uyulması gereken usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="62" başlık="Haksız ticari uygulamalar">
      <mvz-fıkra no="1">
        <template>Bir ticari uygulamanın; mesleki özenin gereklerine uymaması ve ulaştığı ortalama tüketicinin ya da yöneldiği grubun ortalama üyesinin mal veya hizmete ilişkin ekonomik davranış biçimini önemli ölçüde bozması veya önemli ölçüde bozma ihtimalinin olması durumunda haksız olduğu kabul edilir. Özellikle aldatıcı veya saldırgan nitelikte olan uygulamalar ile yönetmelik ekinde yer alan uygulamalar haksız ticari uygulama olarak kabul edilir. Tüketiciye yönelik haksız ticari uygulamalar yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ticari uygulamanın haksız olduğunun iddia edilmesi hâlinde, ticari uygulamada bulunan, bu uygulamasının haksız ticari uygulama olmadığını ispatla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Haksız ticari uygulamanın reklam yoluyla gerçekleştirildiği hâllerde bu Kanunun 61 inci maddesi hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Haksız ticari uygulamaların tespit edilmesine ve bunların denetlenmesine ilişkin usul ve esaslar ile her hâlükârda haksız ticari uygulama olarak kabul edilecek uygulamalar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="63" başlık="Reklam Kurulu">
      <mvz-fıkra no="1">
        <template>Ticari reklamlarda uyulması gereken ilkeleri belirleme ve haksız ticari uygulamalara karşı tüketiciyi korumaya yönelik düzenlemeleri yapma, bu hususlar çerçevesinde inceleme ve gerektiğinde denetim yapma, inceleme ve denetim sonucuna göre durdurma veya aynı yöntemle düzeltme veya idari para cezası veya gerekli görülen hâllerde de üç aya kadar tedbiren durdurma cezası ya da içeriğin çıkarılması ve/veya erişimin engellenmesi kararı verme hususlarında görevli bir Reklam Kurulu oluşturulur. Kurul tedbiren durdurma kararı verme yetkisini Reklam Kurulu Başkanına devredebilir. Kurulun kararları Bakanlıkça uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Başkanlığı, Bakanın görevlendireceği ilgili Genel Müdür tarafından yürütülen Reklam Kurulu;</template>
        <mvz-bent no="a">
          <template>Bakanlığın ilgili Genel Müdür yardımcıları arasından görevlendireceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Adalet Bakanlığının, bu Bakanlıkta idari görevlerde çalışan hâkim veya savcılar arasından görevlendireceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Gıda, Tarım ve Hayvancılık Bakanlığının görevlendireceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Sağlık Bakanlığının görevlendireceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kültür ve Turizm Bakanlığının görevlendireceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Radyo ve Televizyon Üst Kurulunun görevlendireceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Türk Standartları Enstitüsünden bir üye,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Ankara, İstanbul ve İzmir büyükşehir belediyelerinin kendi aralarından seçeceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Yükseköğretim Kurulunun, reklamcılık, iletişim veya ticaret hukuku alanında uzman öğretim üyeleri arasından görevlendireceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Türkiye Odalar ve Borsalar Birliğinin, Türkiye Medya ve İletişim Meclisi üyeleri arasından görevlendireceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Türkiye Esnaf ve Sanatkârları Konfederasyonunun görevlendireceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Tüketici Konseyinin Konseye katılan tüketici örgütü temsilcileri arasından seçeceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Reklam verenler derneklerinin veya varsa üst kuruluşlarının seçeceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Reklamcılar derneklerinin veya varsa üst kuruluşlarının seçeceği bir üye,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Türk Eczacıları Birliğinin görevlendireceği eczacı bir üye,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Türk Diş Hekimleri Birliğinin görevlendireceği diş hekimi bir üye,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Türk Tabipleri Birliği Merkez Konseyinin görevlendireceği doktor bir üye,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Türkiye Barolar Birliğinin görevlendireceği avukat bir üye,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>olmak üzere başkan dâhil on dokuz üyeden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurul üyelerinin görev süreleri üç yıldır. Süresi bitenler yeniden görevlendirilebilir veya seçilebilir. Üyelikler herhangi bir sebeple boşaldığı takdirde boşalan üyeliklere ikinci fıkra esasları dâhilinde bir ay içinde görevlendirme veya seçim yapılır. Süresi dolan üyenin görevi, yeni üye görevine başlayıncaya kadar devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurul ayda en az bir defa veya ihtiyaç duyulduğu her zaman Başkanın çağrısı üzerine toplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurul, Başkan dâhil en az on bir üyenin hazır bulunması ile toplanır ve toplantıya katılanların salt çoğunluğu ile karar verir.  Başkanın toplantıya katılamadığı hâllerde Kurula Bakanlığın ilgili genel müdür yardımcısı başkanlık yapar. Oyların eşit olması hâlinde Başkanın oy kullandığı taraf çoğunluğu sağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bakanlıkça, Kurulun karar vermesine yardımcı olmak üzere sektörel alanlarda ihtisas komisyonları kurulur. Komisyonlar, başkan dâhil en az üç en fazla beş kişiden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kurul Başkan ve üyeleri ile ihtisas komisyonu başkan ve üyelerine ödenecek huzur hakkı ve huzur ücreti ile buna ilişkin usul ve esaslar Maliye Bakanlığının uygun görüşü alınarak Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Kurul, incelemesini ilgili belgelerin yer aldığı dosya üzerinden yapar. Kurulun sekretarya hizmetleri Genel Müdürlük tarafından yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Kurul, gerekli gördüğü takdirde özel uzmanlık gerektiren hususlarla ilgili olarak ihtisas sahibi üniversiteler, özel hukuk tüzel kişileri ile gerçek kişilerin görüşlerine başvurabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Kurul kararları, tüketicilerin bilgilendirilmesi, aydınlatılması ve ekonomik çıkarlarının korunması amacıyla Bakanlıkça açıklanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Reklam Kurulunun ve ihtisas komisyonlarının kuruluşu, görevleri, çalışma usul ve esasları ile sekretarya hizmetleri ve diğer hususlar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="7-YEDİNCİ" başlık="Tüketici Kuruluşları">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Tüketici Konseyi ve Reklam Konseyi">
      <mvz-madde no="64" başlık="Tüketici Konseyi">
        <mvz-fıkra no="1">
          <template>Tüketici sorunlarının ve ihtiyaçlarının belirlenmesi ile çıkarlarının korunmasına ilişkin gerekli tedbirleri araştırmak ve bu Kanunun uygulanmasına yönelik tedbirlere dair görüşleri öncelikle ele alınmak üzere ilgili mercilere iletmek amacıyla yılda en az bir kez Bakanlığın koordinatörlüğünde Tüketici Konseyi toplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketici Konseyine kamu kurum ve kuruluşlarından gelen temsilcilerin sayısı, hiçbir şekilde Konseyin toplam üye sayısının yüzde ellisinden fazla olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tüketici Konseyinin üyeleri, çalışma usul ve esasları ile diğer hususlar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="65" başlık="Reklam Konseyi">
        <mvz-fıkra no="1">
          <template>Reklam politikalarının oluşturulması ve uygulanması ile ilgili olarak çağdaş iletişim uygulamalarını takip etmek, reklam sektörünün ve reklam denetim işlevinin geliştirilmesine yönelik araştırma ve çalışmalar yapmak, bu alanda görüş ve önerilerde bulunmak ve bu görüş ve önerileri ilgili mercilere iletmek amacıyla yılda en az bir kez Bakanlığın koordinatörlüğünde Reklam Konseyi toplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Reklam Konseyine kamu kurum ve kuruluşlarından gelen temsilcilerin sayısı, hiçbir şekilde Konseyin toplam üye sayısının yüzde ellisinden fazla olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Reklam Konseyinin üyeleri, çalışma usul ve esasları ile diğer hususlar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Tüketici Hakem Heyeti">
      <mvz-madde no="66" başlık="Kuruluşu ve görev alanı">
        <mvz-fıkra no="1">
          <template>Bakanlık, tüketici işlemleri ile tüketiciye yönelik uygulamalardan doğabilecek uyuşmazlıklara çözüm bulmak amacıyla tüketici hakem heyetleri oluşturmakla görevlidir. Tüketici hakem heyetlerinin yetki alanı ile iş bölümü Bakanlıkça belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başkanlığı illerde ticaret il müdürü, ilçelerde ise kaymakam veya bunların görevlendireceği bir memur tarafından yürütülen tüketici hakem heyeti;</template>
          <mvz-bent no="a">
            <template>Belediye başkanının konunun uzmanı belediye personeli arasından görevlendireceği bir üye,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Baronun, mensupları arasından görevlendireceği bir üye,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Satıcının tacir olduğu uyuşmazlıklarda ticaret ve sanayi odasının ya da bunların ayrı ayrı örgütlendiği yerlerde ticaret odasının; satıcının esnaf ve sanatkâr olduğu uyuşmazlıklarda, illerde esnaf ve sanatkârlar odaları birliğinin, ilçelerde ise en fazla üyeye sahip esnaf ve sanatkârlar odasının görevlendireceği bir üye,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Tüketici örgütlerinin kendi aralarından seçecekleri bir üye,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>olmak üzere başkan dâhil beş üyeden oluşur. Başkan ve üyelerin bu fıkrada yer alan niteliklere sahip yedekleri de ayrıca belirlenir.  Birden fazla baro kurulan illerde il ve ilçe tüketici hakem heyetlerine üye görevlendirilmesi, baroların eşit ve dönüşümlü temsili esas alınarak yapılır. Görevlendirmeye ilişkin usul ve esaslar Türkiye Barolar Birliği tarafından hazırlanan yönetmelikte gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tüketici hakem heyetinin oluşumunun sağlanamadığı yerlerde noksan üyelikler, yönetmelikle belirlenen üyelik niteliklerine sahip Devlet memurları arasından illerde ticaret il müdürü, ilçelerde ise kaymakam tarafından tamamlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="67" başlık="Raportör">
        <mvz-fıkra no="1">
          <template>Raportörler il ve ilçe merkezlerinde kurulu bulunan tüketici hakem heyetlerinde istihdam edilebilir. Raportör sayısının yeterli olmadığı illerde ticaret il müdürü tarafından ticaret il müdürlüğü personeli arasından, ilçelerde ise kaymakam tarafından ilçede görevli Devlet memurları arasından yeterli sayıda raportör görevlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketici hakem heyeti raportörleri, heyetin çalışmalarına ve kararlarına esas olacak dosyaları hazırlamak ve uyuşmazlığa ilişkin raporu sunmakla görevlidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="68" başlık="Başvuru">
        <mvz-fıkra no="1">
          <template>Tarafların İcra ve İflas Kanunundaki hakları saklı kalmak kaydıyla; değeri otuz bin Türk Lirasının altında bulunan uyuşmazlıklarda tüketici hakem heyetlerine başvuru zorunludur. Bu değerlerin üzerindeki uyuşmazlıklar için tüketici hakem heyetlerine başvuru yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketici hakem heyetleri kendilerine yapılan başvuruları gereğini yapmak üzere kabul etmek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Başvurular, tüketicinin yerleşim yerinin bulunduğu veya tüketici işleminin yapıldığı yerdeki tüketici hakem heyetine yapılabilir.  Tüketici hakem heyetinin bulunmadığı yerlerde ise başvurular o ilçe kaymakamlığına yapılabilir.  Yapılan bu başvurular, kaymakamlıklarca gereği yapılmak üzere Bakanlıkça belirlenen yetkili tüketici hakem heyetine iletilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddede belirtilen parasal sınırlar her takvim yılı başından itibaren geçerli olmak üzere, o yıl için 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi hükümleri uyarınca tespit ve ilan edilen yeniden değerleme oranında artırılarak uygulanır. Bu artışların hesabında bin Türk Lirasının küsuru dikkate alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu madde tüketicilerin ilgili mevzuatına göre alternatif uyuşmazlık çözüm mercilerine başvurmasına engel değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="69" başlık="İnceleme">
        <mvz-fıkra no="1">
          <template>Tüketici hakem heyetleri uyuşmazlık konusuna ilişkin her türlü bilgi ve belgeyi taraflardan, ilgili kurum veya kuruluşlardan isteyebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="70" başlık="Karar ve karara itiraz">
        <mvz-fıkra no="1">
          <template>Tüketici hakem heyeti kararları tarafları bağlar.  Tüketici hakem heyetlerince vekâlet ücreti ödenmesine karar verilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüketici hakem heyeti tarafından tebliği gereken evrakın taraflara veya vekillerine 213 sayılı Kanunun 107/A maddesi hükümlerine göre elektronik ortamda tebliği yapılır, bu kapsamda elektronik ortamda tebligat yapılamadığı durumlarda 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümleri uygulanır. Tüketici hakem heyetinin kararları, İcra ve İflâs Kanununun ilamların yerine getirilmesi hakkındaki hükümlerine göre yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Taraflar, tüketici hakem heyetinin kararlarına karşı tebliğ tarihinden itibaren iki hafta içinde tüketici hakem heyetinin veya tüketicinin yerleşim yerinin bulunduğu yerdeki tüketici mahkemesine itiraz edebilir. İtiraz, tüketici hakem heyeti kararının icrasını durdurmaz. Ancak talep edilmesi şartıyla hâkim, tüketici hakem heyeti kararının icrasını tedbir yoluyla durdurabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İtiraz olunan kararın, esas yönünden kanuna uygun olup da, kanunun olaya uygulanmasında hata edilmiş olmasından dolayı itirazın kabul edilmesi gerektiği veya kanuna uymayan husus hakkında yeniden yargılamayı gerektirmediği takdirde tüketici mahkemesi evrak üzerinde, kararı değiştirerek veya düzelterek onama kararı verebilir. Tarafların kimliklerine, ticari unvanlarına ait yanlışlıklarla, yazı, hesap veya diğer açık ifade yanlışlıkları hakkında da bu hüküm uygulanır. Karar, usule ve kanuna uygun olup da gösterilen gerekçe doğru bulunmazsa, gerekçe değiştirilerek veya düzeltilerek onanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Tüketici hakem heyeti kararlarına karşı yapılan itiraz üzerine tüketici mahkemesinin vereceği karar kesindir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Tüketici hakem heyetlerinin tüketici lehine verdiği kararlara karşı açılan itiraz davalarında, kararın iptali durumunda tüketici aleyhine, avukatlık asgari ücret tarifesine göre nisbi tarife üzerinden vekâlet ücretine hükmedilir.  Ancak, mevcut olduğu hâlde tüketici hakem heyetine sunulmayan bir bilgi veya belgenin tüketici mahkemesine sunulması nedeniyle kararın iptali hâlinde tüketici aleyhine yargılama giderine ve vekâlet ücretine hükmedilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Uyuşmazlıkla ilgili olarak tüketici hakem heyeti tarafından tüketici aleyhine verilen kararlarda tebligat ve bilirkişi ücretleri Bakanlıkça karşılanır. Uyuşmazlığın tüketicinin lehine sonuçlanması durumunda ise, tebligat ve bilirkişi ücretleri 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre karşı taraftan tahsil olunarak bütçeye gelir kaydedilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="71" başlık="Huzur hakkı ve ücreti">
        <mvz-fıkra no="1">
          <template>Tüketici hakem heyeti başkan ve üyelerine, raportör olarak görevlendirilen diğer kamu personeline ödenecek huzur hakkı ve huzur ücreti ile bilirkişi ücreti ve bu ödemelere ilişkin usul ve esaslar Maliye Bakanlığının uygun görüşü alınarak Bakanlıkça belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="72" başlık="Diğer hususlar">
        <mvz-fıkra no="1">
          <template>Tüketici hakem heyetlerinin kurulması, çalışma usul ve esasları, raportörlerin nitelikleri ile bilirkişilik müessesesine ilişkin usul ve esaslar ile diğer hususlar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="8-SEKİZİNCİ" başlık="Yargılama, Denetim ve Cezaya İlişkin Hükümler">
    <mvz-madde no="73" başlık="Tüketici mahkemeleri">
      <mvz-fıkra no="1">
        <template>Tüketici işlemleri ile tüketiciye yönelik uygulamalardan doğabilecek uyuşmazlıklara ilişkin davalarda tüketici mahkemeleri görevlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tüketici mahkemeleri nezdinde Bakanlık, tüketiciler ve tüketici örgütleri tarafından açılan davalar 2/7/1964 tarihli ve 492 sayılı Harçlar Kanununda düzenlenen harçlardan muaftır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tüketici örgütleri üst kuruluşlarınca açılacak davalarda bilirkişi ücreti ve davanın davacı aleyhine sonuçlanması durumunda, hükmedilen vekâlet ücreti Bakanlıkça karşılanır. Davanın, davalı aleyhine sonuçlanması durumunda, bilirkişi ücreti Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre davalıdan tahsil olunarak bütçeye gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tüketici mahkemelerinde görülecek davalar 12/1/2011 tarihli ve 6100 sayılı Hukuk Muhakemeleri Kanununun Altıncı Kısım hükümlerine göre yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tüketici davaları, tüketicinin yerleşim yerinin bulunduğu yerdeki tüketici mahkemesinde de açılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Tüketici örgütleri, ilgili kamu kurum ve kuruluşları ile Bakanlık; haksız ticari uygulamalar ve ticari reklamlara ilişkin hükümler dışında, genel olarak tüketicileri ilgilendiren ve bu Kanuna aykırı bir durumun doğma tehlikesi olan hâllerde bunun önlenmesine veya durdurulmasına ilişkin ihtiyati tedbir kararı alınması veya hukuka aykırı durumun tespiti, önlenmesi veya durdurulması amacıyla tüketici mahkemelerinde dava açabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Genel olarak tüketicileri ilgilendiren davalarda davacı, verilen kararların yayımlanmasını talep edebilir. Talebin mahkemece kabul edilmesi hâlinde bu karar, masrafları davalıdan alınmak üzere ülke düzeyinde yayımlanan gazetelerden en az üçünde derhâl ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Tüketici mahkemelerince verilen kesinleşmiş kararlar, Ulusal Yargı Ağı Bilişim Sistemi üzerinden Bakanlığa iletilir. Tüketici hakem heyetleri kararlarına karşı yapılan itiraz sonucu verilen kararlar, kararı veren mahkeme tarafından ilgili tüketici hakem heyetine gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="73/A" başlık="Dava şartı olarak arabuluculuk">
      <mvz-fıkra no="1">
        <template>Tüketici mahkemelerinde görülen uyuşmazlıklarda dava açılmadan önce arabulucuya başvurulmuş olması dava şartıdır. Şu kadar ki, aşağıda belirtilen hususlarda dava şartı olarak arabuluculuğa ilişkin hükümler uygulanmaz:</template>
        <mvz-bent no="a">
          <template>Tüketici hakem heyetinin görevi kapsamında olan uyuşmazlıklar</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tüketici hakem heyeti kararlarına yapılan itirazlar</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>73 üncü maddenin altıncı fıkrasında belirtilen davalar</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>74 üncü maddede belirtilen davalar</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Tüketici işlemi mahiyetinde olan ve taşınmazın aynından doğan uyuşmazlıklar</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>7/6/2012 tarihli ve 6325 sayılı Hukuk Uyuşmazlıklarında Arabuluculuk Kanununun 18/A maddesinin onbirinci fıkrası tüketici aleyhine uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabuluculuk faaliyeti sonunda taraflara ulaşılamaması, taraflar katılmadığı için görüşme yapılamaması veya tarafların anlaşmaları ya da anlaşamamaları hâlinde tüketicinin ödemesi gereken arabuluculuk ücreti, Adalet Bakanlığı bütçesinden karşılanır. Ancak belirtilen hâllerde arabuluculuk ücreti, Arabuluculuk Asgari Ücret Tarifesinin eki Arabuluculuk Ücret Tarifesinin Birinci Kısmına göre iki saatlik ücret tutarını geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Arabuluculuk faaliyeti sonunda açılan davanın tüketici lehine sonuçlanması hâlinde arabuluculuk ücreti, 6183 sayılı Kanun hükümlerine göre davalıdan tahsil olunarak bütçeye gelir kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="74" başlık="Üretimin veya satışın durdurulması ve malın toplatılması">
      <mvz-fıkra no="1">
        <template>Satışa sunulan bir seri malın ayıplı olduğunun tespiti, üretiminin veya satışının durdurulması, ayıbın ortadan kaldırılması ve satış amacıyla elinde bulunduranlardan toplatılması için Bakanlık, tüketiciler veya tüketici örgütleri dava açabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Satışa sunulan seri malın ayıplı olduğunun mahkeme kararı ile tespit edilmesi hâlinde, mahkeme ayıbın niteliğine göre malın satışını geçici olarak durdurma veya ayıbı giderme kararları verebilir. Üretici veya ithalatçı mahkeme kararının tebliğ tarihinden itibaren en geç üç ay içinde malın ayıbını ortadan kaldırmakla yükümlüdür. Malın ayıbının ortadan kalkmasının imkânsız olması hâlinde mal, üretici veya ithalatçı tarafından toplanır veya toplattırılır. Toplatılan mallar taşıdıkları risklere göre kısmen veya tamamen imha edilir veya ettirilir. İmha edilen malla ilgili tüketicinin dava ve tazminat hakları saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Satışa sunulan bir seri malın, tüketicinin güvenliğini tehlikeye sokan bir ayıp taşıması durumunda Ürünlere İlişkin Teknik Mevzuatın Hazırlanması ve Uygulanmasına Dair Kanun hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="75" başlık="Denetim">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında, Bakanlık müfettişleri, gümrük ve ticaret denetmenleri ile Bakanlıkça görevlendirilecek personel, mal veya hizmet sunulan her yerde denetleme, inceleme ve araştırma yapmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamına giren hususlarda, yetkili ve görevli kişi veya kuruluşlara her türlü bilgi ve belgenin doğru olarak gösterilmesi veya istenmesi hâlinde belgelerin aslının veya onaylı kopyalarının verilmesi zorunludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="76" başlık="Tüketici ürünü ve hizmet denetimi">
      <mvz-fıkra no="1">
        <template>Tüketici ürünü; hizmet sektöründe kullanılanlar dâhil olmak üzere tüketicilerin kullanması için tasarlanan veya makul koşullarda tüketiciler tarafından kullanılması öngörülen, gerek ticari faaliyetler sonucunda gerekse başka yollarla tedarik edilen veya kullanılabilir hâle getirilen yeni, kullanılmış veya ıslah edilmiş her türlü üründür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üretici veya dağıtıcının, tüketiciye açıkça bilgi vermesi kaydıyla antika olan veya kullanılmadan önce tamir veya ıslah edilmesi gereken ikinci el ürünler birinci fıkra kapsamında değerlendirilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tüketici ürünleri ile tüketiciye sunulan hizmetler; can ve mal güvenliğine ve çevreye zarar vermemeli, uygulanması zorunlu her türlü idari ve teknik düzenlemeye uygun olmalıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bakanlık sorumlu olduğu tüketici ürünlerinin piyasa gözetimi ve denetimini Ürünlere İlişkin Teknik Mevzuatın Hazırlanması ve Uygulanmasına Dair Kanun hükümlerine göre yerine getirmekle görevlidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="77" başlık="Yaptırım hükümleri">
      <mvz-fıkra no="1">
        <template>Bu Kanunun;</template>
        <mvz-bent no="a">
          <template>4 üncü, 7 nci, 18 inci, 19 uncu, 20 nci, 21 inci, 26 ncı, 30 uncu, 35 inci, 49 uncu, 51 inci, 52 nci, 54 üncü, 57 nci maddeleri ve 48 inci maddesinin ikinci, üçüncü, dördüncü, altıncı ve yedinci fıkralarında belirtilen yükümlülüklere aykırı hareket edenler ile 8 inci maddesinin üçüncü fıkrası uyarınca malları süresinde teslim veya monte etmeyenler hakkında aykırılığı tespit edilen her bir işlem veya sözleşme için iki bin iki yüz Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>6 ncı maddesine aykırı olarak bir mal veya hizmetin satışından kaçınanlar hakkında aykırılığı tespit edilen her bir işlem veya sözleşme için iki bin iki yüz Türk Lirasından az olmamak üzere satışından kaçınılan mal veya hizmetin tüm vergiler dahil toplam satış fiyatının yüzde onu kadar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>idari para cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun 5 inci maddesi uyarınca belirlenen haksız şartların tüketici sözleşmelerinde kullanılması durumunda, Bakanlıkça verilecek süre içinde bu haksız şartın sözleşme metninden çıkarılmaması hâlinde, aykırılığın tespit edildiği her bir sözleşme için iki yüz Türk Lirası idari para cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun 23 üncü, 24 üncü, 25 inci, 27 nci, 28 inci, 29 uncu, 33 üncü, 34 üncü, 36 ncı, 37 nci, 38 inci, 39 uncu, 41 inci, 43 üncü, 45 inci, 46 ncı maddeleri ile 31 inci maddesinin birinci, ikinci ve dördüncü, 40 ıncı maddesinin ikinci, 47 nci maddesinin üçüncü, dördüncü, beşinci, yedinci fıkralarında belirtilen yükümlülüklere aykırı hareket edenler hakkında aykırılığı tespit edilen her bir işlem veya sözleşme için bin Türk Lirası idari para cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun;</template>
        <mvz-bent no="a">

    <mvz-madde no="77/A" başlık="Uzlaşma">

      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde kapsamında yapılan uzlaşma talepleri, uzlaşma komisyonları tarafından değerlendirilir. Uzlaşma komisyonlarının tutacakları uzlaşma tutanakları kesin olup gereği idarece derhâl yerine getirilir. Ceza muhatabı, üzerinde uzlaşılan ve tutanakla tespit olunan hususlar hakkında dava açamaz ve hiçbir mercie şikâyette bulunamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Uzlaşma halinde, idari para cezasında yapılacak indirim oranı yüzde elliyi geçemez. Bu madde uyarınca üzerinde uzlaşma talebinde bulunulan idari para cezaları hakkında 30/3/2005 tarihli ve 5326 sayılı Kabahatler Kanununun 17 nci maddesi uyarınca ayrıca peşin ödeme indiriminden yararlanılamaz. Uzlaşma konusu yapılan idari para cezaları, uzlaşma gerçekleştiği takdirde, uzlaşma tutanağı uzlaşma anında tebliğ edilir ve tebliğinden itibaren on beş gün içinde ödenir.</template>

      </mvz-fıkra>
      <mvz-fıkra no="7">

      <mvz-fıkra no="2">
        <template>Bu Kanun hükümlerine göre verilen idari yaptırım kararlarına karşı 6/1/1982 tarihli ve 2577 sayılı İdari Yargılama Usulü Kanunu hükümlerine göre idari yargı yoluna başvurulabilir. Ancak, idare mahkemesinde dava, işlemin tebliğini izleyen günden itibaren otuz gün içinde açılır. İdare mahkemesinde iptal davası açılmış olması, kararın yerine getirilmesini durdurmaz.</template>

    <mvz-madde no="79" başlık="Yiyecek taklidi ürünler">
      <mvz-fıkra no="1">
        <template>Gıda ürünü olmamalarına rağmen, sahip oldukları şekil, koku, renk, görünüm, ambalaj, etiket, hacim veya boyutları nedeniyle olduklarından farklı görünen ve bu sebeple tüketiciler, özellikle çocuklar tarafından, gıda ürünleriyle karıştırılarak tüketicilerin sağlığını ve güvenliğini tehlikeye atan ürünlerin üretilmesi, pazarlanması, ithalatı ve ihracatı yasaktır. Gıda ürünü olmamalarına rağmen geleneksel el sanatı ürünü olarak gıda ürünü şeklinde üretilen ve sağlığa zarar vermeyen ürünler, üzerinde uyarı işareti ve yazısı bulunması şartıyla bu hükmün dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık, olduklarından farklı görünerek tüketicilerin sağlığını ve güvenliğini tehlikeye atan bu ürünlere karşı gerekli tedbirleri almaya ve düzenlemeleri yapmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Piyasaya arz edilmiş olan bu ürünlerin güvensizliğinin tespit edilmesi hâlinde alınacak önlemler ile bu önlemlerin Avrupa Komisyonuna bildirilmesi hususunda Ürünlere İlişkin Teknik Mevzuatın Hazırlanması ve Uygulanmasına Dair Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bakanlık, bu kapsamdaki ürünlerin piyasa gözetimi ve denetimini yapmakla görevlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yiyecek taklidi ürünleri satın alan tüketicilerin uğradıkları maddi ve manevi zararlar nedeniyle dava açma hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="80" başlık="Piramit satış sistemleri">
      <mvz-fıkra no="1">
        <template>Piramit satış; katılımcılarına bir miktar para veya malvarlığı ortaya koymak karşılığında, sisteme aynı şartlar altında başka katılımcılar bulma koşuluyla bir para veya malvarlığı kazancı olanağı ümidi veren ve malvarlığı kazancının elde edilmesini tamamen veya kısmen diğer katılımcıların da koşullara uygun davranmasına bağlı kılan, gerçekçi olmayan veya gerçekleşmesi çok güç olan kazanç beklentisi sistemidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Piramit satış sisteminin kurulması, yayılması veya tavsiye edilmesi yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bakanlık, piramit satış sistemleri ile ilgili gerekli incelemeleri yapmaya ve varsa elektronik sistemin ülkemizde durdurulması dâhil ilgili kamu kurum veya kuruluşlarıyla iş birliği içinde gerekli önlemleri almaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="81" başlık="Test, muayene ve analizler">
      <mvz-fıkra no="1">
        <template>Bakanlık, bu Kanunun uygulaması için resmi veya özel kuruluşların laboratuvarlarından yararlanabilir. Test ve muayene ücretleri Bakanlık bütçesinden karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Test ve muayene sonuçlarının ilgili idari ve teknik düzenlemesine aykırı çıkması hâlinde buna ilişkin tüm giderler üretici veya ithalatçıdan Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre tahsil olunur. Tahsil olunan test ve muayene ücretleri bütçeye gelir kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="82" başlık="Ödenek">
      <mvz-fıkra no="1">
        <template>Reklam Kurulu, Reklam Konseyi, Tüketici Konseyi ve tüketici hakem heyetlerinin faaliyetlerine ilişkin masraflar, Bakanlığın tüketicinin korunması amacına yönelik masrafları ve sair harcamalar Bakanlık bütçesine konulacak ödenekten karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="83" başlık="Diğer hükümler">
      <mvz-fıkra no="1">
        <template>Bu Kanunda hüküm bulunmayan hâllerde genel hükümler uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflardan birini tüketicinin oluşturduğu işlemler ile ilgili diğer kanunlarda düzenleme olması, bu işlemin tüketici işlemi sayılmasını ve bu Kanunun görev ve yetkiye ilişkin hükümlerinin uygulanmasını engellemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="84" başlık="Yönetmelikler ve diğer düzenleyici işlemler">
      <mvz-fıkra no="1">
        <template>Bakanlık, bu Kanunun uygulanmasıyla ilgili olarak mevzuat çerçevesinde gerekli tedbirleri almaya ve düzenlemeleri yapmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunda öngörülen yönetmelikler, Kanunun yürürlüğe girdiği tarihten itibaren altı ay içinde Bakanlık tarafından çıkarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bakanlıkça çıkarılacak ikincil düzenlemelerde ilgili kamu kurum ve kuruluşlarının, kamu kurumu niteliğindeki meslek kuruluşlarının, sivil toplum kuruluşlarının ve meslek örgütlerinin görüşleri alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="85" başlık="Kadro ihdası">
      <mvz-fıkra no="1">
        <template>Ekli listede yer alan kadrolar ihdas edilerek 13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnamenin eki (I) sayılı cetvelin Gümrük ve Ticaret Bakanlığına ait bölümüne eklenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="86" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>23/2/1995 tarihli ve 4077 sayılı Tüketicinin Korunması Hakkında Kanun yürürlükten kaldırılmıştır. Diğer mevzuatta Tüketicinin Korunması Hakkında Kanuna yapılan atıflar bu Kanuna yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Geçiş hükümleri" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce açılmış olan davalar açıldıkları mahkemelerde görülmeye devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önceki tüketici işlemlerine, bunların hukuken bağlayıcı olup olmadıklarına ve sonuçlarına bu işlemler hangi kanun yürürlükte iken gerçekleşmiş ise kural olarak o kanun hükümleri uygulanır. Ancak:</template>
        <mvz-bent no="a">
          <template>Bu Kanunun yürürlüğe girdiği tarihten önce kurulan ve hâlen geçerli sözleşmelerin bu Kanuna aykırı hükümleri yürürlük tarihinden itibaren uygulanmaz.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu Kanunun yürürlüğe girdiği tarihten önce işlemeye başlamış hak düşürücü süreler ile zamanaşımı süreleri dolmamış ise bu Kanunda öngörülen sürenin geçmesiyle hak düşürücü süre veya zamanaşımı süresi dolmuş olur.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda öngörülen yönetmelikler yürürlüğe girinceye kadar, bu Kanunla yürürlükten kaldırılan Tüketicinin Korunması Hakkında Kanuna dayanılarak çıkartılan yönetmelik ve diğer mevzuatın, bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun dava şartı olarak arabuluculuğa ilişkin hükümleri, bu hükümlerin yürürlüğe girdiği tarih itibarıyla ilk derece mahkemeleri ve bölge adliye mahkemeleri ile Yargıtayda görülmekte olan davalar hakkında uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önceki tüketici işlemleri, bunların hukuken bağlayıcı olup olmadıkları ve sonuçları hakkında bu işlemler hangi kanun yürürlükte iken gerçekleşmiş ise kural olarak o kanun hükümleri uygulanır. Ancak, bu maddenin yürürlüğe girdiği tarihten önce kurulan ve hâlen geçerli olan belirsiz süreli tüketici sözleşmelerinin bu Kanuna aykırı hükümleri bu maddenin yürürlük tarihinden itibaren uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin yayımı tarihi itibarıyla yapı ruhsatı alınmış olan devre tatile konu taşınmazlarda, bu maddenin yayımı tarihinden itibaren beş yıl süresince ön ödemeli usulle satış da dâhil olmak üzere devre mülk, mülkiyet payına bağlı ayni hak sağlayan devre tatil veya şahsi hak sağlayan devre tatil satışı yapılabilir, kooperatif veya ticaret şirketi ortaklığı ya da dernek veya vakıf üyeliği suretiyle devre tatil hakkı tanınabilir, devre tatile konu mal üzerinde ayni hak sahibi olmayanlar devre tatil satışı yapabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin yayımı tarihinden önce kurulan devre tatil sözleşmeleri ve ikinci fıkra kapsamında kurulan sözleşmeler hakkında idari para cezası hükümleri de dâhil olmak üzere bu maddenin yayımı tarihinden önceki Kanun hükümleri ile birlikte bu maddeyi ihdas eden Kanunla değiştirilen 50 nci maddenin onuncu fıkrası hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>66 ncı, 68 inci ve 73 üncü maddeler gereğince tüketici hakem heyetlerine yapılan başvurular ile mahkemelerde açılmış olan davalar için söz konusu başvuruların yapıldığı ve davaların açıldığı tarihte yürürlükte bulunan görev ve yetkiye ilişkin hükümler uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="87" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinden itibaren altı ay sonra yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="88" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
