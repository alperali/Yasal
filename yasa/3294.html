  <mvz-künye tür="kanun" no="3294" başlık="SOSYAL YARDIMLAŞMA VE DAYANIŞMAYI TEŞVİK KANUNU"
             tarih="29/5/1986" rgazete-tarih="14/6/1986" rgazete-sayı="19134"
             düstur-tertip="5" düstur-cilt="25" düstur-sayfa="264" />

  <mvz-madde no="1" başlık="Amaç">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı; fakru zaruret içinde ve muhtaç durumda bulunan vatandaşlar ile gerektiğinde her ne suretle olursa olsun Türkiye'ye kabul edilmiş veya gelmiş olan kişilere yardım etmek, sosyal adaleti pekiştirici tedbirler alarak gelir dağılımının adilane bir şekilde tevzi edilmesini sağlamak, sosyal yardımlaşma ve dayanışmayı teşvik etmektir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Kapsam">
    <mvz-fıkra no="1">
      <template>Fakrü zaruret içinde ve muhtaç durumda bulunan kanunla kurulu sosyal güvenlik kuruluşlarına tabi olmayan ve bu kuruluşlardan aylık ve gelir almayan  vatandaşlar ile geçici olarak küçük bir yardım veya eğitim ve öğretim imkanı sağlanması halinde topluma faydalı hale getirilecek, üretken duruma geçirilebilecek kişiler bu Kanun kapsamı içindedir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ancak, 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 60 ıncı maddesinin birinci fıkrasının (c) bendinde sayılan genel sağlık sigortalısı ve bakmakla yükümlü olduğu kişilerin 5510 sayılı Kanun gereği ödedikleri katılım payları bu Kanun kapsamındadır. Ancak yıl içinde ödenen tutarlar, takip eden yılda Hazine tarafından Fona geri ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ayrıca, kanunla veya Cumhurbaşkanlığı kararnamesiyle kurulu sosyal güvenlik kuruluşlarına tabi olmakla veya bu kuruluşlarca aylık veya gelir bağlanmış olmakla birlikte, Fon Kurulunca belirlenecek ölçütlere göre; hane içindeki kişi başına düşen geliri, onaltı yaşından büyükler için belirlenen aylık net asgari ücretin 1/3’ünden az olan kişilerden fakir ve muhtaç durumda bulunanlar da bu Kanun kapsamındadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Her türlü acil durum ve afetten zarar görenler ve şehit yakınları ile gaziler ise, Fon Kurulu ile Sosyal Yardımlaşma ve Dayanışma Vakıflarınca belirlenecek kriter ve süreler çerçevesinde bu Kanun ile sağlanacak haklardan yararlandırılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Kuruluş">
    <mvz-fıkra no="1">
      <template>Bu Kanunda öngörülen hizmetlerin gerçekleştirilmesi için Cumhurbaşkanınca görevlendirilen Cumhurbaşkanı yardımcısına veya bakana bağlı ve T.C. Merkez Bankası nezdinde Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonu kurulmuştur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Fonun gelirleri">
    <mvz-fıkra no="1">
      <template>Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonunun gelirleri;</template>
      <mvz-bent no="a">
        <template>Kanun ve kararnamelerle kurulu bulunan ve kurulacak olan fonlardan Cumhurbaşkanı kararıyla % 10'a kadar aktarılacak miktardan,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bütçeye konulacak ödeneklerden,</template>
      </mvz-bent>
      <mvz-bent no="c" durum="mülga">
        <template></template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Trafik para cezası hasılatının yarısından,</template>
      </mvz-bent>
      <mvz-bent no="e" durum="mülga">
        <template></template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Radyo ve Televizyon Üst Kurulu reklam gelirleri hasılatından aktarılacak % 15'lik miktardan,</template>
      </mvz-bent>
      <mvz-bent no="g" durum="mülga">
        <template></template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Her nevi bağış ve yardımlardan,</template>
      </mvz-bent>
      <mvz-bent no="i">
        <template>Diğer gelirlerden,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Teşekkül eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu maddeye göre (d ve e bentleri hariç) Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonu için tahsil edilen veya aktarılması yapılan miktar, tahsil veya aktarmayı takip eden ayın en geç 15'ine kadar T.C. Merkez Bankası nezdindeki fon hesabına yatırılmak zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="4" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu maddenin (d) bendinde yer alan gelirler hakkında 30/3/2005 tarihli ve 5326 sayılı Kabahatler Kanununun 17 nci maddesinin üçüncü fıkrasının birinci cümlesi hükmü uygulanmaz. Bu gelirler tahsilatın yapıldığı ayı takip eden ayın sonuna kadar vergi daireleri ve muhasebe birimleri tarafından Maliye Bakanlığınca belirlenen esaslara göre, Türkiye Cumhuriyet Merkez Bankası nezdindeki Fon hesabına aktarılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Engelli ve Yaşlı Hizmetleri Genel Müdürlüğü tarafından engellilere ve yaşlılara yönelik olarak hazırlanan veya hazırlatılan projeler ile yapım ve kiralama işleri ve anılan Genel Müdürlüğün bu konudaki faaliyetlerine yönelik olarak kullanılmak üzere, bu maddede sayılan gelirlerin %5’e kadarı Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonu Kurulu kararıyla Aile ve Sosyal Politikalar Bakanlığı emrine tahsis edilir. Bu amaçla tahsis edilen kaynak Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonu Kurulunun onaylayacağı projeler için kullanılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Fonun çalışma usul ve esasları">
    <mvz-fıkra no="1">
      <template>Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonunun çalışma usul ve esasları ile toplanacak kaynakların Sosyal Yardımlaşma ve Dayanışma Vakıflarına dağıtım esasları yönetmelikle tespit edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Engellilerin topluma uyumunu kolaylaştıracak her türlü ortopedik ve diğer yardımcı araç ve gereçlerin standartlara uygun olarak teminini dikkate almak suretiyle, engellilere yönelik destek programlarına ilişkin usul ve esaslar ayrı bir yönetmelikle tespit edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Fonun denetimi">
    <mvz-fıkra no="1">
      <template>Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonunun denetimi Başbakanlık Yüksek Denetleme Kurulunca yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Vakıflar">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacına uygun faaliyet ve çalışmalar yapmak ve ihtiyaç sahibi vatandaşlara nakdî ve aynî yardımda bulunmak üzere her il ve ilçede sosyal yardımlaşma ve dayanışma vakıfları kurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Mülkî idare amirleri vakfın tabii başkanı olup, illerde belediye başkanı, defterdar, il millî eğitim müdürü, il sağlık müdürü, il tarım müdürü, il sosyal hizmetler ve çocuk esirgeme kurumu müdürü ve il müftüsü; ilçelerde belediye başkanı, mal müdürü, ilçe millî eğitim müdürü, Sağlık Bakanlığının ilçe üst görevlisi, varsa ilçe tarım müdürü ve ilçe müftüsü vakfın mütevelli heyetini oluşturur. Ayrıca her faaliyet dönemi için, il dahilindeki köy ve mahalle muhtarlarının valinin çağrısı üzerine yapacağı toplantıya katılanların salt çoğunluğuyla kendi aralarından seçecekleri birer muhtar üye ile ilde kurulan ve bu Kanunda belirtilen amaçlara yönelik faaliyette bulunan sivil toplum kuruluşlarının yöneticilerinin kendi aralarından seçecekleri iki temsilci ve hayırsever vatandaşlar arasından il genel meclisinin seçeceği iki kişi; ilçe dahilindeki köy ve mahalle muhtarlarının kaymakamın çağrısı üzerine yapacağı toplantıya katılanların salt çoğunluğu ile kendi aralarından seçecekleri birer üye ile ilçede kurulu ve bu Kanunda belirtilen amaçlara yönelik faaliyette bulunan sivil toplum kuruluşlarının yöneticilerinin kendi aralarından seçecekleri bir temsilci ve hayırsever vatandaşlar arasından il genel meclisinin seçeceği iki kişi mütevelli heyetinde görev alırlar. İl veya ilçede bu Kanunda belirtilen amaçlara yönelik faaliyette bulunan sivil toplum kuruluşu olmaması halinde, hayırsever vatandaşlar arasından il genel meclisinin seçeceği üçüncü bir kişi daha mütevelli heyetinde görev yapar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Büyükşehir belediyesi bulunan illerdeki il ve ilçe sosyal yardımlaşma ve dayanışma vakıflarında, ikinci fıkrada hayırsever vatandaşlar arasından seçileceği belirtilen iki üye; il sosyal yardımlaşma ve dayanışma vakıfları için doğrudan vali tarafından, ilçe sosyal yardımlaşma ve dayanışma vakıfları için ise kaymakamın teklifi üzerine vali tarafından belirlenir. Ayrıca, il veya ilçede bu Kanunda belirlenen amaçlara yönelik faaliyette bulunan sivil toplum kuruluşu bulunmaması hâlinde il sosyal yardımlaşma ve dayanışma vakıfları için doğrudan vali tarafından, ilçe sosyal yardımlaşma ve dayanışma vakıfları için ise kaymakamın teklifi üzerine vali tarafından üçüncü bir kişi daha belirlenir. İl veya ilçe sınırları içerisinde köy bulunmaması hâlinde, köy muhtarı yerine bir mahalle muhtarı daha mütevelli heyetinde görev yapar. İlde vali, bir vali yardımcısını başkan vekili olarak; büyükşehir belediye başkanı, genel sekreteri veya genel sekreter yardımcısını; il belediye başkanı da bir belediye başkan yardımcısını toplantılarda kendisini temsil etmek üzere görevlendirebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Vakıf senetleri mahallin en büyük mülki idare amiri tarafından Medeni Kanundaki hükümlere göre tescil ettirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Vakıflar, 18/10/2012 tarihli ve 6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanununun 34 üncü maddesinin ikinci fıkrası hükmüne göre, Aile ve Sosyal Politikalar Bakanlığı Sosyal Yardımlar Genel Müdürlüğünce imzalanacak işletme düzeyinde toplu iş sözleşmesi kapsamında işyerleridir.</template>
    </mvz-fıkra>
  </mvz-madde>

  <mvz-madde no="9" başlık="Muafiyetler">
    <mvz-fıkra no="1">
      <template>Bu Kanunla kurulan Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonu ile Sosyal Yardımlaşma ve Dayanışma Vakıfları;</template>
      <mvz-bent no="a">
        <template>Kurumlar Vergisinden, (iktisadi işletmeler hariç),</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Yapılacak bağış ve yardımlar sebebiyle Veraset ve İntikal Vergisinden,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Sahip oldukları taşınır ve taşınmaz mallar ve yapacakları tüm muameleler dolayısıyla her türlü vergi, resim, harç ve fonlardan,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Vakıflar, Vakıflar Genel Müdürlüğünce vakıflardan tahsil edilen teftiş ve denetleme masraflarına katılma paylarından,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Her türlü döner sermaye ücretlerinden,</template>
      </mvz-bent>
    </mvz-fıkra>

    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Fona ve Vakfa yapılacak bağış ve yardımlar her türlü vergi, resim ve harçtan muaftır. Bu bağış ve yardımlar Kurumlar ve Gelir Vergisi matrahından indirilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Kaldırılan hükümler">
    <mvz-fıkra no="1">
      <template>23 Haziran 1983 tarihli ve 2860 sayılı Yardım Toplama Kanununun Beşinci Bölümü ile bu bölümde yer alan 21, 22 ve 23 üncü maddeleri ve Altıncı Bölümde yer alan 29 uncu maddenin 2 nci fıkrası yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="Tahsil şekli ve müeyyide" tür="Ek">
    <mvz-fıkra no="1">
      <template>4 üncü maddenin (a), (c), (d), (e), (f), (g) bendlerinde sayılan fon gelirleri ile 8 inci maddede yazılı vakıf gelirleri kamu alacağı mahiyetinde olup, bu Kanunda yazılı süre içinde ödenmeyen gerek 4 üncü maddenin (a), (c), (d), (f) ve (g) bendlerindeki fon gelirlerinin, gerekse 8 inci maddenin (b) bendinde yazılı vakıf gelirlerinin tahsili için Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonu Kurulu Başkanlığınca veya ilgili vakıflarca 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun Hükümlerine göre işlem yapılır. Ayrıca, sorumlular hakkında bu Kanun ve ilgili diğer kanunlar uyarınca takibata geçilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Sosyal yardımların ve desteklerin haczedilemeyeceği" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bu Kanun gereğince yapılan yardımlar ve proje destekleri ile 1/7/1976 tarihli ve 2022 sayılı 65 Yaşını Doldurmuş Muhtaç, Güçsüz ve Kimsesiz Türk Vatandaşlarına Aylık Bağlanması Hakkında Kanun gereğince verilen yaşlılık ve engelli aylıkları, kişinin rızası olsa bile haczedilemez, başkasına devir ve temlik edilemez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Sosyal Yardımlaşma ve Dayanışma Vakıfları tarafından; ilgisine göre Millî Eğitim Bakanlığı veya ilgili kamu idaresinin görüşü alınarak, vakıf gelirleri veya Fon kaynakları kullanılarak yurt veya pansiyon yapılabilir. Maliye Bakanlığınca yurt veya pansiyon yapılmak amacıyla belediyelere tahsis edilenler hariç olmak üzere ilgili kamu idarelerine tahsis edilen Hazineye ait taşınmazların üzerinde de adına tahsis yapılan kamu idaresinin talebi üzerine, aynı şekilde yurt veya pansiyon yapılabilir. Bu taşınmazların üzerinde inşa edilen ve kullanıma hazır hâle getirilen her türlü bina, yapı ve tesisler hiçbir işleme gerek kalmaksızın Hazineye intikal eder ve adına tahsis yapılan kamu idarelerince kullanılmaya devam olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Sosyal Yardımlaşma ve Dayanışma Vakıfları tarafından, arsası bağışlanan veya bağışla alınan ve bu arsalar üzerindeki bina, yapı ve tesislerin tamamı bağışlanan veya bağışla yapılanlar hariç olmak üzere, vakıf gelirleri veya Fon kaynakları kullanılarak alınan ve üzerinde yurt veya pansiyon olarak kullanılmak üzere inşa edilen ve kullanıma hazır hâle getirilen her türlü bina, yapı ve tesisler bulunan taşınmazlar belediyeler hariç ihtiyacı olan kamu idarelerine yapılış amacında kullanılmak amacıyla tahsis edilmek üzere bedelsiz olarak Hazineye devredilir. Arsası bağışlanan veya bağışla alınan ve bu arsalar üzerindeki bina, yapı ve tesislerin tamamı bağışlanan veya bağışla yapılanların kullanım veya işletme hakkı ise ilgisine göre Millî Eğitim Bakanlığına veya belediyeler hariç ilgili kamu idaresine devredilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>İşe başladığı tarihten önceki son bir yıl içerisinde Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonu Kurulu tarafından belirlenen nakdî düzenli sosyal yardımlardan en az bir defa yararlanmış olanların ikamet ettiği hanede 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 60 ıncı maddesinin birinci fıkrasının (c) bendinin (1) numaralı alt bendi kapsamında bulunanlardan Türkiye İş Kurumuna kayıtlı işsizler arasında olması kaydıyla, 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında özel sektör işverenlerince istihdam edilen sigortalı için; 5510 sayılı Kanunun 81 inci maddesinde sayılan ve 5510 sayılı Kanunun 82 nci maddesi uyarınca belirlenen prime esas kazanç alt sınırı üzerinden hesaplanan sigorta primlerinin işveren hisselerine ait tutarın tamamı işe başladığı tarihten itibaren bir yıl süreyle Aile ve Sosyal Politikalar Bakanlığı tarafından karşılanır. Cumhurbaşkanı bu süreyi bir yıl uzatmaya yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İşveren hisselerine ait primlerin karşılanabilmesi için işverenlerin çalıştırdıkları sigortalılarla ilgili olarak; işe alındıkları yıldan bir önceki takvim yılında işyerinden bildirilen aylık prim ve hizmet belgelerindeki sigortalı sayısının ortalamasına ilave olması, 5510 sayılı Kanun uyarınca aylık prim ve hizmet belgelerini yasal süresi içinde Sosyal Güvenlik Kurumuna vermesi, sigortalıların tamamına ait sigorta primlerinin Aile ve Sosyal Politikalar Bakanlığınca karşılanmayan tutarı yasal süresi içinde ödemesi ve kapsama giren sigortalının işe alındığı işyerinden dolayı Sosyal Güvenlik Kurumuna prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borcu bulunmaması şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Sosyal Güvenlik Kurumuna olan prim, idari para cezası ve bunlara ilişkin gecikme cezası ve gecikme zammı borçlarının 6183 sayılı Kanunun 48 inci maddesine göre tecil ve taksitlendirilmiş veya ilgili kanunlar uyarınca prim borçlarının yeniden yapılandırılmış olması, bu tecil, taksitlendirme ve yeniden yapılandırma devam ettiği sürece işverenlerin bu madde hükmünden yararlanmasına engel teşkil etmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yapılan kontrol ve denetimlerde, çalıştırdığı kişileri sigortalı olarak bildirmediği tespit edilen işverenler bir yıl süreyle bu maddeyle sağlanan destek unsurlarından yararlanamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu madde hükümleri, 21/4/2005 tarihli ve 5335 sayılı Bazı Kanun ve Kanun Hükmünde Kararnamelerde Değişiklik Yapılmasına Dair Kanunun 30 uncu maddesinin ikinci fıkrası kapsamına giren kurum ve kuruluşlara ait işyerleri ile bu işyerlerinin yaptırdığı her türlü alım ve yapım işlerine ilişkin işyerleri, sosyal güvenlik destek primine tabi çalışanlar ve yurt dışında çalışan sigortalılar hakkında uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>İşverenler bu maddeyle sağlanan prim desteğinden aynı sigortalı için birinci fıkradaki süreleri geçmemek üzere yararlanır. Destekten yersiz olarak faydalanıldığının tespiti hâlinde, yararlanılan teşvik tutarı 5510 sayılı Kanunun 89 uncu maddesi uyarınca gecikme cezası ve gecikme zammıyla birlikte işverenden tahsil edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonu Kurulu tarafından belirlenen nakdî düzenli sosyal yardımlardan işe başladığı tarihten önceki son bir yıl içerisinde en az bir defa yararlanmış olanların ikamet ettiği hanede 5510 sayılı Kanunun 60 ıncı maddesinin birinci fıkrasının (c) bendinin (1) numaralı alt bendi kapsamında bulunanlardan çalışabilir durumda olanlar, Aile ve Sosyal Politikalar Bakanlığı tarafından bütünleşik sosyal yardım sistemi üzerinden Türkiye İş Kurumu sistemine kaydedilir. Bu kişiler Türkiye İş Kurumu tarafından mesleki eğitime veya diğer aktif iş gücü programlarına tabi tutulur. Mesleki eğitimi veya aktif iş gücü programlarını ya da Türkiye İş Kurumu tarafından teklif edilen işi üçüncü kez kabul etmeyenlerin Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonu Kurulu tarafından belirlenen nakdî düzenli sosyal yardımları, durumun bütünleşik sosyal yardım sistemi üzerinden Türkiye İş Kurumu veri tabanından tespit edilmesini takip eden ay başından itibaren bir yıl süreyle kesilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Aile ve Sosyal Politikalar Bakanlığınca karşılanan prim tutarları, gelir ve kurumlar vergisi uygulamalarında gider veya maliyet unsuru olarak dikkate alınmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Bu madde kapsamına giren sosyal yardımlar ve bu maddenin uygulanmasına ilişkin usul ve esaslar Maliye Bakanlığı, Sosyal Güvenlik Kurumu ile Türkiye İş Kurumunun görüşleri alınarak Aile ve Sosyal Politikalar Bakanlığınca belirlenir.</template>
    </mvz-fıkra>

  <mvz-madde no="2" başlık="" tür="Geçici">

      <template>Bu maddenin yürürlüğe girdiği tarihten önce Sosyal Yardımlaşma ve Dayanışma Vakıfları tarafından, Fon kaynakları kullanılarak Hazineye ait taşınmazların üzerinde yurt veya pansiyon olarak kullanılmak üzere inşa edilen ve kullanıma hazır hâle getirilen her türlü bina, yapı ve tesisler hiçbir işleme gerek kalmaksızın Hazineye intikal eder. Bu taşınmazlar ve üzerindeki bina, yapı ve tesisler, belediyeler hariç ihtiyacı olan kamu idarelerinin talebi üzerine, yapılış amacı, kullanım durumu ve ihtiyaçlar da dikkate alınarak Maliye Bakanlığınca belediyeler hariç ilgili kamu idarelerine tahsis edilebilir. Ancak, bunlardan Sosyal Yardımlaşma ve Dayanışma Vakıfları tarafından sözleşme veya protokol yapılmak suretiyle üçüncü kişilerin kullanımına bırakılanlar, sözleşme veya protokolde belirtilen koşullarla, süresi sonuna kadar bu kişiler tarafından kullanılmaya devam olunabilir. Kullanım süresi sonunda bunlar hakkında da bu madde hükümlerine göre işlem yapılır.</template>
