  <mvz-künye tür="kanun" no="" başlık="PERAKENDE TİCARETİN DÜZENLENMESİ HAKKINDA KANUN"
             tarih="14/1/2015" rgazete-tarih="29/1/2015" rgazete-sayı="29251"
             düstur-tertip="5" düstur-cilt="55" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; perakende işletmelerin açılış ve faaliyete geçiş işlemlerinin kolaylaştırılması, perakende ticaretin serbest piyasa ortamında etkin ve sürdürülebilir rekabet şartlarına göre yapılması, tüketicinin korunması, perakende işletmelerin dengeli bir şekilde büyüme ve gelişmesinin sağlanması ve perakende işletmelerin faaliyetleri ile bunların birbirleri, üretici ve tedarikçilerle ilişkilerinin düzenlenmesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun; perakende işletmelerin açılış, faaliyet ve denetimlerine ilişkin usul ve esaslar ile bu Kanunun uygulanmasında Bakanlık, yetkili idare ve diğer kamu kurum ve kuruluşlarının görev, yetki ve sorumluluklarını kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hizmet sektöründe faaliyet gösteren işletmelerden açılış ve/veya faaliyete geçiş süreci ile faaliyetleri özel kanunlarla düzenlenenler bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Alışveriş merkezi: Bir yapı veya alan bütünlüğü olan, içinde büyük mağaza ve/veya beslenme, giyinme, eğlenme, dinlenme, kültürel ve benzeri ihtiyaçların bir kısmının veya tamamının karşılandığı diğer işyerleri bulunan, merkezî bir yönetime ve ortak kullanım alanları ile yönetmelikle belirlenen diğer niteliklere sahip işletmeyi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakanlık: Gümrük ve Ticaret Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bayi işletme: Sözleşmeye dayalı olarak bir işletmenin mal ve hizmetlerinin satışına aracılık eden ve kendi adına bağımsız çalışan işletmeyi,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Büyük mağaza: Hangi ad altında olursa olsun, tüketim mallarının kısmen veya tamamen perakende satışının yapıldığı, en az dört yüz metrekare satış alanına sahip işletmeyi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Esnaf ve sanatkâr işletmesi: 7/6/2005 tarihli ve 5362 sayılı Esnaf ve Sanatkârlar Meslek Kuruluşları Kanununun 3 üncü maddesinin birinci fıkrasının (a) bendinde tanımlanan esnaf ve sanatkârlarca işletilen işletmeyi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Hızlı tüketim malı: Gıda, içecek, temizlik ve kişisel bakım ürünlerini,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Mağaza markalı ürün: Büyük mağaza veya zincir mağazanın, başkalarına ürettirerek kendi ad veya markasıyla işyerinde sattığı ve bunların fiyat, ambalaj veya tanıtımı üzerinde kontrole sahip olduğu ürünü,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Meslek kuruluşu: Esnaf ve sanatkârlar odaları birliği ile ticaret ve sanayi odasını, ticaret ve sanayi odalarının ayrı kurulduğu yerlerde ticaret odasını,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Özel yetkili işletme: Sözleşmeye dayalı olarak bir işletmenin, yönetim ve organizasyon ile  dağıtım  veya  pazarlama  teknolojileri gibi konularda bilgi ve desteğini almak suretiyle bu işletmenin mal veya hizmetinin satışı üzerindeki imtiyaz hakkını bedel, bölge ve süre gibi belirli şartlar ve sınırlamalar dâhilinde kullanan bağımsız ticari işletmeyi,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Perakende bilgi sistemi (PERBİS): Perakende işletmelerin açılış ve faaliyeti ile kapanışında gerekli başvuru ve diğer işlemlerin tek merkeze yapılmasını ve bu merkezden sonuçlandırılmasını sağlayan elektronik bilgi sistemini,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Perakende işletme: Alışveriş merkezi, büyük mağaza, zincir mağaza, bayi işletme, özel yetkili işletme, perakende ticaretle uğraşan diğer ticari işletmeler ile esnaf ve sanatkâr işletmelerini,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Perakende ticaret: Mal ve hizmetlerin perakende işletmelerce satışı ve pazarlanmasıyla ilgili faaliyetler bütününü,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Satış alanı: Münhasıran büro amaçlı kullanılan işyerleri ile konaklama, depolama, üretim tesis ve alanları ile ortak kullanım alanları hariç olmak üzere; alışveriş merkezlerinde işyerlerinin toplam alanlarını, büyük mağaza ve zincir mağazalarda ise doğrudan satış yapılan ve aracı satıcılara kiralanan alanları,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Üst meslek kuruluşu: Türkiye Odalar ve Borsalar Birliği ile Türkiye Esnaf ve Sanatkârları Konfederasyonunu,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Yetkili idare: İşyeri açma ve çalışma ruhsatını vermeye yetkili belediye veya il özel idareleri ile diğer idareleri,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Zincir mağaza: Benzer çeşitlilikteki tüketim mallarının hangi ad altında olursa olsun kısmen veya tamamen perakende satışının yapıldığı, aynı gerçek veya tüzel kişi sahipliğinde bir merkeze bağlı olarak faaliyet gösteren; içlerinden en az biri büyük mağaza niteliğini taşıyan en az beş şubeye sahip işletmeyi veya her biri dört yüz metrekarenin altında satış alanına sahip en az on şubesi bulunan işletmeyi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Perakende Bilgi Sistemi, İşyeri Açma ve Çalışma Ruhsatı Verilmesi">
    <mvz-madde no="4" başlık="Perakende bilgi sistemi">
      <mvz-fıkra no="1">
        <template>Perakende işletmelerin açılış ve faaliyeti ile kapanışında gerekli başvuru ve diğer işlemlerin yapılması, ilgili kurum ve kuruluşlara iletilmesi, değerlendirilmesi, sonuçlandırılması ve bu işletmelere yönelik veri tabanının oluşturulması ile bilgi paylaşımının sağlanması amacıyla Bakanlık bünyesinde kısa adı PERBİS olan perakende bilgi sistemi kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>PERBİS, Bakanlıkça ilgili kurum ve kuruluşların erişimine açılır ve bu kurum ve kuruluşlar nezdinde kurulan elektronik kayıt sistemleriyle çevrimiçi olarak birbirine bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>PERBİS’in kurulum, işletim ve diğer giderleri ile PERBİS’e bilgi ve belge aktarımına ilişkin giderler, Bakanlığın talebi üzerine Türkiye Odalar ve Borsalar Birliğinin bütçesinden karşılanır. PERBİS’in işletim giderleri ile diğer giderleri için anılan Birliğin bütçesine her yıl ödenek konulur. Bu ödeneğin miktarı, yıllık bütçenin yüzde birini geçemez. Birliğin bütçesinden karşılanacak meblağın yeterli olmaması hâlinde söz konusu giderler, Bakanlık bütçesine konulan ödenekten karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>PERBİS’te yer alacak ve erişime açılacak bilgiler ile bu maddenin uygulanmasına ilişkin diğer usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="İşyeri açma ve çalışma ruhsatı verilmesi">
      <mvz-fıkra no="1">
        <template>İşyeri açma ve çalışma ruhsatı PERBİS üzerinden verilir. İşyeri açma ve çalışma ruhsatı başvurusu, doğrudan veya PERBİS üzerinden yetkili idareye yapılır. Doğrudan yapılan başvurular, yetkili idare tarafından PERBİS’e işlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yetkili idare tarafından yapılan ön değerlendirme sonucu uygun bulunan başvurular; başvuru tarihinden itibaren en geç üç iş günü içinde, perakende işletmenin açılış ve faaliyete geçişinde gerekli kayıt ve benzeri işlemleri yapmakla görevli ve yetkili kurum ve kuruluşlara PERBİS üzerinden iletilir. Bu iletimle birlikte, ilgili kurum ve kuruluşlara da gerekli başvuru yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İlgili kurum ve kuruluşlar tarafından, mevzuatı çerçevesinde gerekli değerlendirmeler yapılır ve yönetmelikle belirlenen esaslara uygun olarak perakende işletmenin açılış ve faaliyete geçişi için gerekli olan bilgi ve belgeler PERBİS’e işlenerek yetkili idareye iletilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mevzuatta öngörülen şartları taşıyan perakende işletmelere, yetkili idare tarafından PERBİS üzerinden işyeri açma ve çalışma ruhsatı düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Başvurusu uygun bulunmayanlara, sonuç en geç otuz gün içinde gerekçeli olarak tebliğ edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Ruhsat değişikliğine ilişkin işlemler de PERBİS üzerinden gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Büyükşehirlerde, alışveriş merkezlerine yapı ruhsatı, yapı kullanma izin belgesi ve işyeri açma ve çalışma ruhsatı vermeye büyükşehir belediyeleri yetkilidir. Alışveriş merkezi projesi için yapı ruhsatı verilirken, üst meslek kuruluşlarının görüşü alınır. Bu kuruluşlar görüşlerini on beş iş günü içinde bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Üçüncü fıkrada öngörülen esaslar ile bu maddenin uygulanmasına ilişkin diğer usul ve esaslar Çevre ve Şehircilik Bakanlığının görüşü alınarak hazırlanan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="İlke ve Kurallar">
    <mvz-madde no="6" başlık="Tedarik zincirinde haksız ticari uygulamalar">
      <mvz-fıkra no="1">
        <template>Haksız ticari uygulamalarda bulunulamaz. Üretici, tedarikçi ve perakende işletmeler arasındaki ticari ilişkilerde taraflardan birinin diğer tarafın ticari faaliyetlerini önemli ölçüde bozan, makul karar verme yeteneğini azaltan veya normal şartlarda taraf olmayacağı bir ticari ilişkinin tarafı olmasına sebep olan faaliyetleri haksız ticari uygulamadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aşağıda belirtilen faaliyetler her durumda haksız ticari uygulama kabul edilir:</template>
        <mvz-bent no="a">
          <template>Kalite standartlarının sağlanması amacıyla sözleşmede yer verilen koşullar hariç olmak üzere, herhangi bir gerçek veya tüzel kişiden mal veya hizmet teminine zorlamak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kampanya maliyetini, kampanyalı satış yapmak istemeyen tarafa yansıtmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Tarım ve gıda ürünlerinin tedarikinde ticari ilişkinin koşullarını, yazılı veya elektronik ortamda yapılan sözleşmeyle belirlememek.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Karşı tarafın aleyhine tek taraflı değişiklik yapma yetkisi veren veya açık ve anlaşılır olmayan hükümlere sözleşmede yer vermek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Ürün talebini doğrudan etkileyen herhangi bir hizmet vermediği halde mağaza açılışı ve tadilatı, ciro açığı, banka ve kredi kartı katılım bedeli ve başka adlar altında bedel almak veya verdiği hizmetin türünü ve hizmet bedelinin tutar ya da oranını sözleşmede belirtmediği halde prim ve bedel almak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Karşı tarafın kusurundan kaynaklanan durumlar hariç olmak üzere, üretim tarihinden itibaren otuz gün içinde bozulabilen tarım ve gıda ürünlerine yönelik siparişleri, ürünün teslim tarihinden önceki otuz gün içinde iptal etmek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Karşı tarafın kusurundan kaynaklanan durumlar hariç olmak üzere, üretim tarihinden itibaren otuz gün içinde bozulabilen tarım ve gıda ürünlerinin tesliminden veya mülkiyetinin devrinden sonra bozulma ya da zayi olma gibi maliyetleri yansıtmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkranın (e) ve (f) bentlerinde belirtilen kusuru ispat yükü siparişi iptal eden veya maliyeti karşı tarafa yansıtana aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bakanlık, birinci fıkra kapsamında yer alan haksız ticari uygulamaları, otuz gün içinde bozulabilen tarım ve gıda ürünlerini ve bu maddenin uygulanmasına ilişkin usul ve esasları yönetmelikle belirlemeye yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Ödeme süresi">
      <mvz-fıkra no="1">
        <template>Üretici, tedarikçi ve perakende işletmeler arasındaki ticari ilişkilerden kaynaklanan ödemelerin, sözleşmede öngörülen süre içinde yapılması esastır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üretim tarihinden itibaren otuz gün içinde bozulabilen tarım ve gıda ürünlerine ilişkin ödemelerin süresi; alacaklının küçük, borçlunun orta veya büyük ölçekli ya da alacaklının orta, borçlunun büyük ölçekli olması durumunda otuz, diğer durumlarda kırk beş günü geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkrada belirtilen ürünlerin dışında kalan tarım ve gıda ürünlerine ilişkin ödemelerin süresi, alacaklının küçük, borçlunun orta veya büyük ölçekli ya da alacaklının orta, borçlunun büyük ölçekli olması durumunda altmış günü geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddede belirtilen süreler, teslim veya mülkiyetin devri tarihlerinden hangisi önce ise o tarih esas alınarak hesaplanır. Ödemenin süresi içinde yapıldığına ilişkin ispat yükü borçluya aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddede düzenlenmeyen hususlarda 13/1/2011 tarihli ve 6102 sayılı Türk Ticaret Kanununun 1530 uncu maddesi hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Mağaza markalı ürün">
      <mvz-fıkra no="1">
        <template>Yurt içinde üretilen ve hızlı tüketim malı niteliği taşıyan mağaza markalı ürünlerin üzerinde ve/veya ambalajında, perakendecinin ad, unvan veya markasının yanı sıra üreticinin ad, unvan ya da markasına da uygun ve kolay okunabilir bir şekilde yer verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Kampanyalı satış ve alışveriş festivali">
      <mvz-fıkra no="1">
        <template>Perakende işletmeler, 7/11/2013 tarihli ve 6502 sayılı Tüketicinin Korunması Hakkında Kanun ve ilgili diğer kanunlarda öngörülen usul ve esaslara uymak kaydıyla indirimli veya promosyonlu satış kampanyaları düzenleyebilir. Ancak kampanyanın süresi; işyeri açılışı, devri, kapanışı, adres veya faaliyet konusu değişikliğinde üç ayı, 6102 sayılı Kanun hükümlerine göre tasfiye durumunda ise altı ayı geçemez. Perakende işletmeler başlangıç ve bitiş süresi belli olmayan indirimler yapamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mahallî idareler ve kamu kurumu niteliğindeki meslek kuruluşları ile bunların ortağı olduğu şirketler ve diğer tüzel kişiler; birlikte veya bağımsız olarak, perakende işletmelerin katılımıyla, yılın belli dönemlerinde, ilçe, il, bölge veya ülke düzeyinde alışveriş festivali düzenleyebilir. Kamu kurumu niteliğindeki meslek kuruluşlarının bu festivaller için ayıracakları ödenek miktarı, bütçelerinin yüzde beşini geçemez. Alışveriş festivalinin başlangıç ve bitiş tarihleri ile festivalin programı ve uygulama alanı önceden Bakanlığa bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Sürekli indirimli satış">
      <mvz-fıkra no="1">
        <template>Sürekli indirimli satış; seri sonu, sezon sonu, ihraç fazlası, kusurlu ve benzeri malların, perakende işletmelerce, indirimli fiyattan veya malların fabrika çıkış fiyatı üzerinden yıl boyunca satılmasıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sürekli indirimli satış yapan perakende işletmelerin ön cephesinde ve mağaza içlerinde, kolaylıkla görülebilir ve okunabilir şekilde bu satış türünü gösterir ya da çağrıştırır ibarelere yer verilir. Bu ibarelerin alışveriş merkezlerince kullanımı, içerisinde yer alan perakende işletmelerin tamamının birinci fıkra kapsamında faaliyet göstermesine; alışveriş merkezi içinde bulunanlar da dâhil diğer perakende işletmelerce kullanımı ise satışa sunulan malların en az yüzde yetmişinin aynı fıkrada belirtilen niteliklere sahip olmasına bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sürekli indirimli satışa konu mallar ve alışveriş merkezi yönetimlerinin bu madde kapsamındaki yükümlülükleri ile bu maddenin uygulanmasına ilişkin diğer hususlar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Ortak kullanım alanları">
      <mvz-fıkra no="1">
        <template>Alışveriş merkezlerinde, satış alanının en az binde beşine tekabül eden alanın sosyal ve kültürel etkinliklerin düzenlenmesi amacıyla ayrılması zorunludur. Bakanlık, bu oranı bir katına kadar artırmaya veya yarısına kadar azaltmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Alışveriş merkezlerinde, acil tıbbi müdahale ünitesi, ibadet yeri, bebek bakım odası, çocuk oyun alanı gibi ortak kullanım alanları oluşturulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Alışveriş merkezlerinde yer alan ortak kullanım alanları, engelliler ile yaşlı ve çocukların ihtiyaçları dikkate alınarak oluşturulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ortak kullanım alanlarına ilişkin elektrik, su, doğal gaz, yenileme niteliğinde olmayan bakım, onarım, güvenlik ve temizlik giderleri gibi alışveriş merkezinin aynına ilişkin olmayan giderler ile alışveriş merkezinde fiilen çalışan bordrolu yönetim personelinin göreviyle ilgili giderler ortak giderdir. Alışveriş merkezindeki perakende işletmelerden yalnızca bu giderler için katılım payı tahsil edilebilir; reklam, pazarlama ve danışmanlık gibi ortak gider niteliğini haiz olmayan giderler ile belgelendirilmeyen giderler için herhangi bir bedel tahsil edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ortak kullanım alanlarından elde edilen kiralama, reklam, pazarlama, kültürel ve sanatsal faaliyet ve diğer ortak kullanım alanı gelirleri ile ortak gider katılım payı avanslarından elde edilen her türlü gelir ortak gelirdir. Ortak gelirler, ortak giderlerin karşılanmasında kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Alışveriş merkezi maliki veya yönetimi, her yıl bir önceki yıla ilişkin ortak gelir ve gider raporu hazırlayarak alışveriş merkezindeki perakende işletmelere gönderir. Raporda, ortak gelir ve giderlerin tür ve tutarları, her bir perakende işletmeden tahsil edilmesi gereken ve tahsil edilen ortak gider katılım payları ile Bakanlıkça gerekli görülen diğer bilgilere yer verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Ortak kullanım alanlarına ve bunların niteliklerine; ortak gelir ve giderlere, ortak giderlerin belgelendirilmesine, bu giderlere katılıma ve katılanların bilgilendirilmesine; ortak gelir ve gider raporunun hazırlanmasına, bu rapora esas teşkil eden gelir ve gider belgeleri ile sözleşmelerinin perakende işletmelere sunulmasına, ortak gelir ve gider uygulamalarının bağımsız denetim kuruluşlarınca denetlenmesine ve bu maddenin uygulanmasına ilişkin diğer hususlar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Yer ve raf tahsisi">
      <mvz-fıkra no="1">
        <template>Alışveriş merkezlerinde, esnaf ve sanatkâr işletmecilerine rayiç bedel üzerinden kiraya verilmek üzere, toplam satış alanının en az yüzde beşi oranında yer ayrılır. Bu yerler; esnaf ve sanatkâr işletmecilerinden yeteri kadar talep olmaması veya boşalan yerlerin duyuru tarihinden itibaren yirmi gün içinde doldurulamaması hâlinde, diğer talep sahiplerine de kiralanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Alışveriş merkezlerinde; geleneksel, kültürel veya sanatsal değeri olan kaybolmaya yüz tutmuş meslekleri icra edenlere kiraya verilmek üzere, toplam satış alanının en az binde üçü oranında yer ayrılır. Bu yerlerin kira bedeli, rayiç bedelinin dörtte birinden fazla olamaz. Söz konusu meslekler, ilgili üst meslek kuruluşunun görüşü alınarak Bakanlıkça belirlenir ve ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hızlı tüketim mallarının satışının yapıldığı büyük mağaza ve zincir mağazalar ile bayi işletme ve özel yetkili işletmelerde satış alanlarının en az yüzde birine tekabül edecek şekilde raf alanı, mağazanın bulunduğu ilde üretilmesi kaydıyla coğrafi işaretli olarak tescil edilen veya coğrafi işaretli olarak tescil edilmemiş olsa bile meslek kuruluşlarının uygun görüşü alınarak ticaret il müdürlüklerince belirlenen hızlı tüketim malı niteliği taşıyan yöresel ürünlerin satışına ayrılır. Yöresel ürünlerle doldurulamayan raf alanları, diğer ürünlerin satışı amacıyla kullanılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Çalışma saatleri">
      <mvz-fıkra no="1">
        <template>Mesleğe, mevsime ve turizme özgü şartlar ve benzeri hususlar gözetilerek perakende işletmelerin bir kısmının veya tamamının çalışma saatleri, meslek kuruluşlarının müşterek teklifi üzerine yetkili idarenin görüşü alınmak suretiyle vali tarafından belirlenebilir. Esnaf ve sanatkâr işletmelerinin çalışma saatlerinin belirlenmesinde, meslek kuruluşunca ilgili esnaf ve sanatkâr odasının görüşü alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üst meslek kuruluşlarının müşterek teklifi üzerine, faaliyet kollarına göre perakende işletmelerin çalışma saatlerinin bölge veya ülke düzeyinde belirlenmesine Bakanlık yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Tedarik ve Dağıtım Kooperatifleri ile Perakendeciler Konseyi">
    <mvz-madde no="14" başlık="Tedarik ve dağıtım kooperatifleri">
      <mvz-fıkra no="1">
        <template>Esnaf ve sanatkâr işletmelerince satışa sunulan malların etkin bir şekilde piyasadan temini amacıyla esnaf ve sanatkârların üyesi olduğu tedarik ve dağıtım kooperatifleri kurulabilir. Bu kooperatiflerin kuruluşu ve ana sözleşme değişikliği Bakanlık iznine tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kooperatif ortaklarının en az iki yıl kesintisiz olarak 5362 sayılı Kanuna tabi odalara kayıtlı olması şarttır. Bakanlık; bu kooperatiflerin ortaklık şartlarını, kuruluşunda aranacak asgari sermaye miktarını ve ortak sayısını belirlemeye, örnek ana sözleşmelerini düzenlemeye, güvenli, açık ve istikrarlı bir şekilde faaliyet göstermelerine ilişkin düzenlemeler yapmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>5362 sayılı Kanuna tabi esnaf ve sanatkârlar meslek kuruluşlarının yönetim ve denetim kurulu üyeleri, görev yaptıkları sürece, bu madde kapsamında kurulmuş olan kooperatiflerin yönetim ve denetim kurullarında görev alamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Perakendeciler Konseyi">
      <mvz-fıkra no="1">
        <template>Perakende ticaretin bu Kanunun amacına uygun olarak yapılmasının sağlanması hususunda karşılıklı bilgi ve görüş alışverişinde bulunmak, sektöre yönelik politika oluşturulmasına katkı sağlamak, sorunları tespit etmek, alınacak önlemleri belirlemek ve ilgili kurum ve kuruluşlar arasında işbirliğini sağlamak üzere Bakanlığın koordinatörlüğünde Perakendeciler Konseyi oluşturulur. Yılda en az bir kez toplanacak Konseyin sekretarya hizmetleri Bakanlık İç Ticaret Genel Müdürlüğü tarafından yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Perakendeciler Konseyinin kuruluşu ve çalışmasına ilişkin giderler ile harcırah giderleri ve sair harcamalar Bakanlık bütçesine konulan ödenekten karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Perakendeciler Konseyinin oluşumu, çalışma usul ve esasları ile diğer hususlar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Görev, Yetki, Denetim ve Ceza">
    <mvz-madde no="16" başlık="Görev ve yetkiler">
      <mvz-fıkra no="1">
        <template>Bakanlık;</template>
        <mvz-bent no="a">
          <template>Perakende sektörünün ve perakende işletmelerin ülke genelinde dengeli bir şekilde yayılması, büyümesi ve gelişmesine yönelik çalışmalar yapmaya,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Taşınmaz ve ikinci el motorlu kara taşıtı alım satımı gibi ticari faaliyetleri yürütenlere yönelik mesleki davranış kurallarını belirlemeye ve bu faaliyetlerin yürütülmesine ilişkin düzenlemeler yapmaya,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İstatistiki bilgileri derlemeye, düzenlemeye ve yayımlamaya,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bu Kanunun uygulanmasıyla ilgili olarak oluşan tereddütleri gidermeye, ikincil düzenlemeler yapmaya ve her türlü idari tedbiri almaya,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>görevli ve yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cumhurbaşkanı;</template>
        <mvz-bent no="a">
          <template>faaliyet konusu ve kollarına göre perakende işletmelerin açılış ve faaliyete geçişinde, işletme sayısı ve bunların birbirlerine yakınlığı, ulaşım imkânları, işletmelerin çevreye, altyapıya ve trafiğe getireceği yükler ile can ve mal güvenliği riski gibi ekonomik, sosyal, demografik ve çevresel faktörler açısından gözetilecek kriterleri belirleyerek, PERBİS işyeri açma ve çalışma ruhsatı onay sürecine dâhil edilmek üzere belirlediği kriterleri Bakanlığa iletmeye ve bu hususlara ilişkin usul ve esasları yönetmelikle düzenlemeye,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>14/6/1989 tarihli ve 3572 sayılı İşyeri Açma ve Çalışma Ruhsatlarına Dair Kanun Hükmünde Kararnamenin Değiştirilerek Kabulüne Dair Kanunda belirtilen diğer müesseseler ile bu Kanunun 2 nci maddesinin ikinci fıkrasındaki işletmelerin açılış ve faaliyeti ile kapanış işlemlerinin PERBİS üzerinden gerçekleştirilmesine yönelik konularda karar vermeye ve bu hususlara ilişkin usul ve esasları yönetmelikle düzenlemeye,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu Kanun kapsamına giren hizmet sektöründeki işletmeleri faaliyet konusu, bulunduğu yerleşim yeri veya kolları bazında, Bakanlığın teklifi üzerine kapsam dışında tutmaya,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Üst meslek kuruluşları, ikinci fıkranın (a) bendine göre verecekleri görüşlerini otuz gün içinde Bakanlığa bildirir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Denetim">
      <mvz-fıkra no="1">
        <template>Bakanlık, bu Kanunun uygulanması, uygulamada çıkan sorunlar ve şikâyetlerle ilgili olarak perakende işletmeler nezdinde denetim yapmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yetkili idareler, yetki alanlarıyla sınırlı olmak kaydıyla, doğrudan veya Bakanlığın talebi üzerine, bu Kanun hükümleri çerçevesinde perakende işletmeler nezdinde ön inceleme mahiyetinde olmak üzere gerekli denetim ve uygulamaları yapmak ve önlemleri almakla görevli ve yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Ceza hükümleri">
      <mvz-fıkra no="1">
        <template>Bu Kanunun;</template>
        <mvz-bent no="a">
          <template>6 ncı maddesinin ikinci fıkrasının;</template>
          <mvz-altbent no="1">
            <template>(a), (c) ve (ç) bentlerine aykırı hareket edenlere, her bir aykırılık için yirmi bin Türk lirası,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>(b) bendine aykırı hareket edenlere, yansıtılan kampanya maliyeti tutarında, (d) bendine aykırı hareket edenlere, haksız olarak alınan prim ve bedel tutarında, (e) bendine aykırı hareket edenlere, iptal edilen sipariş bedeli tutarında, (f) bendine aykırı hareket edenlere, yansıtılan maliyet tutarında,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>7 nci maddesinin ikinci ve üçüncü fıkralarına aykırı hareket edenlere; süresinde ödenmeyen tutarı geçmemek üzere otuz güne kadar süre aşımında her bir gün için bu tutarın binde beşi, otuz günden sonraki süre aşımında her bir gün için süresinde ödenmeyen tutarın yüzde biri oranında,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>8 inci maddesinin birinci fıkrasına aykırı hareket eden büyük mağaza ve zincir mağazalara, her bir mağaza ya da şubesindeki her bir ürün grubu için on bin Türk lirası,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>9 uncu maddesinin birinci fıkrası ile 10 uncu maddesinin ikinci fıkrasına aykırı hareket edenlere beş bin Türk lirası,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>11 inci maddesinin birinci fıkrasına aykırı hareket edenlere, ayrılması gereken alandan ayrılmayan her bir metrekare için yirmi bin Türk lirası, aykırılığın otuz günden az olmamak üzere Bakanlıkça verilen süre içinde giderilmemesi hâlinde bu tutarın iki katı,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>11 inci maddesinin ikinci fıkrasına aykırı hareket edenlere, her bir aykırılık için elli bin Türk lirası, aykırılığın otuz günden az olmamak üzere Bakanlıkça verilen süre içinde giderilmemesi hâlinde bu tutarın iki katı,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>11 inci maddesinin dördüncü fıkrasına aykırı hareket edenlere, perakende işletmelerden haksız olarak tahsil edilen tutarın iki katı; beşinci fıkrasına aykırı hareket edenlere ise ortak giderlerin karşılanmasında kullanılmayan ortak gelir tutarında,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>11 inci maddesinin altıncı fıkrasında belirtilen ortak gelir ve gider raporunu usulüne uygun hazırlamayanlara veya perakende işletmelere göndermeyenlere, alışveriş merkezindeki her bir perakende işletme için yirmi bin Türk lirası,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>12 nci maddesinin birinci ve ikinci fıkralarına aykırı hareket eden alışveriş merkezlerine, ayrılması gereken yerden ayrılmayan her bir metrekare için metrekare başına düşen rayiç kira bedeli tutarında, aykırılığın otuz günden az olmamak üzere Bakanlıkça verilen süre içinde giderilmemesi hâlinde bu tutarın iki katı,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>12 nci maddesinin üçüncü fıkrasına aykırı hareket edenlere, her bir mağazası ya da şubesi için yirmi bin Türk lirası, aykırılığın otuz günden az olmamak üzere Bakanlıkça verilen süre içinde giderilmemesi hâlinde bu tutarın iki katı,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>13 üncü maddesine göre belirlenen çalışma saatlerine aykırı hareket edenlere bin Türk lirası,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>16 ncı maddesinin birinci fıkrasının (b) bendine istinaden belirlenen mesleki davranış kurallarına ve yapılan düzenlemelere aykırı hareket edenler ile bu maddede ayrı bir idari para cezası öngörülmemiş olması durumunda, aynı fıkranın (ç) bendine veya bu Kanunun diğer maddelerine göre Bakanlıkça alınan tedbirlere ve yapılan ikincil düzenlemelere uymayanlara her bir aykırılık için on bin Türk lirasından üç yüz bin Türk lirasına kadar,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Denetime yetkili olanlarca istenilen defter, belge ve diğer kayıtlar ile bunlara ilişkin bilgileri vermeyenlere veya eksik verenlere ya da denetim elemanlarının görevlerini yapmalarını engelleyenlere elli bin Türk lirasından iki yüz elli bin Türk lirasına kadar,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Ek 1 inci maddesinin birinci fıkrasına aykırı hareket edenlere her bir aykırılık için yüz bin Türk lirasından bir milyon Türk lirasına kadar; ikinci fıkrasına aykırı hareket edenlere ise her bir aykırılık için bir milyon Türk lirasından on iki milyon Türk lirasına kadar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkranın (ç), (i) ve (j) bentlerinde öngörülen cezalar; fiilin büyük mağaza ve zincir mağaza tarafından işlenmesi hâlinde beş katı, alışveriş merkezi tarafından işlenmesi hâlinde ise on katı uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkranın (ı) bendinde öngörülen ceza; fiilin büyük mağaza ve zincir mağaza tarafından işlenmesi hâlinde yirmi katı, alışveriş merkezi tarafından işlenmesi hâlinde ise elli katı uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddenin birinci fıkrasının (k) bendinde öngörülen idari para cezalarını uygulama yetkisi Haksız Fiyat Değerlendirme Kuruluna, bu maddede öngörülen diğer idari para cezalarını uygulama yetkisi ise Bakanlığa aittir. Bakanlığa ait olan idari para cezası uygulama yetkisi taşra birimlerine devredilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin birinci fıkrasının (a), (c), (ç), (g), (ı), (i), (j) ve (k) bentlerinde belirtilen idari para cezalarının verilmesini gerektirir aykırılığın bir takvim yılı içinde tekrarı hâlinde, her bir tekrar için bir önceki cezanın iki katı idari para cezası uygulanır. Bu hüküm nispi idari para cezaları hakkında uygulanmaz.  Bakanlık, ek 1 inci maddenin ikinci fıkrasına bir takvim yılı içinde en az üç defa aykırı hareket etmesi nedeniyle idari para cezası uygulanan üretici, tedarikçi ve perakende işletmelerin iş yerlerini altı güne kadar kapatmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu maddede alt ve üst sınırları belirtilen idari para cezalarının uygulanmasında Bakanlıkça ceza tutarı belirlenirken, işlenen kabahatin haksızlık içeriği, tekrarı ve sayısı, kabahat dolayısıyla elde edilen menfaatin ve neden olunan zararın büyüklüğü ile failin kusuru ve ekonomik durumu gibi hususlar dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu maddede belirtilen idari para cezalarının bir takvim yılına ilişkin toplam tutarı; işletmenin küçük ölçekli olması durumunda yirmi milyon Türk lirasından, orta ölçekli olması durumunda iki yüz milyon Türk lirasından, büyük ölçekli olması durumunda bir milyar Türk lirasından fazla olamaz. Bu tutar, her yıl, Hazine ve Maliye Bakanlığı tarafından bir önceki yıla ilişkin olarak 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi uyarınca tespit ve ilân edilen yeniden değerleme oranında, takvim yılı başından geçerli olmak üzere artırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu Kanuna göre verilen idari para cezaları, tebliğ tarihinden itibaren bir ay içinde ödenir.</template>
      </mvz-fıkra>

    <mvz-madde no="1" başlık="Fahiş fiyat artışı, stokçuluk ve Haksız Fiyat Değerlendirme Kurulu" tür="EK">
      <mvz-fıkra no="1">
        <template>Üretici, tedarikçi ve perakende işletmeler tarafından bir mal veya hizmetin satış fiyatında fahiş artış yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üretici, tedarikçi ve perakende işletmeler tarafından piyasada darlık yaratıcı, piyasa dengesini ve serbest rekabeti bozucu faaliyetler ile tüketicinin mallara ulaşmasını engelleyici faaliyetlerde bulunulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Üretici, tedarikçi ve perakende işletmelerin fahiş fiyat artışı ve stokçuluk uygulamalarına yönelik  gerektiğinde denetim ve incelemelerde bulunarak idari para cezası uygulamak ve her türlü tedbiri almak amacıyla Haksız Fiyat Değerlendirme Kurulu oluşturulur. Başkanlığı, İç Ticaret Genel Müdürü tarafından yürütülen Kurul;</template>
        <mvz-bent no="a">
          <template>Tüketicinin Korunması ve Piyasa Gözetimi Genel Müdürü,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Esnaf, Sanatkârlar ve Kooperatifçilik Genel Müdürü,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Adalet Bakanlığı, Hazine ve Maliye Bakanlığı, Sanayi ve Teknoloji Bakanlığı ile Tarım ve Orman Bakanlığı tarafından görevlendirilen birer Genel Müdür,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>İlgili İç Ticaret Genel Müdür Yardımcısı,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Türkiye Odalar ve Borsalar Birliği ile Türkiye Esnaf ve Sanatkârları Konfederasyonu tarafından görevlendirilen birer üye,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Üretici ve tüketici örgütleri ile perakende sektörünü temsilen birer üye,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>olmak üzere on üç üyeden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurul ihtiyaç halinde Başkanın çağrısı üzerine; Başkan dâhil en az yedi üye ile toplanır ve toplantıya katılanların salt çoğunluğu ile karar alır. Oyların eşit olması halinde Başkanın oy kullandığı tarafın çoğunluğu sağladığı kabul edilir. Kurulun kararları Bakanlıkça uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurulun sekretarya hizmetleri İç Ticaret Genel Müdürlüğü tarafından yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kurulun oluşumu, görevleri, çalışma usul ve esasları, sekretarya hizmetleri ve Kurula ilişkin diğer hususlar yönetmelik ile belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Geçiş hükümleri" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>PERBİS kuruluncaya kadar, perakende işletmelerin açılış ve faaliyete geçiş işlemleri ilgili mevzuatına göre yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşyeri açma ve çalışma ruhsatı verilmesi sürecinde yer alan yetkili idareler ve ilgili diğer kurum ve kuruluşlar; Bakanlığın koordinasyonunda, teknik ve personel altyapıları ile gerekli diğer hususları PERBİS kuruluncaya kadar tamamlayarak bilgi sistemlerini PERBİS’le uyumlu hâle getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Perakende işletmelere ait gerekli bütün bilgiler, kurulmasından itibaren en geç bir yıl içinde Bakanlığın koordinasyonunda yetkili idare tarafından PERBİS’e aktarılır. Bakanlık, bu süreyi birer yılı geçmemek üzere en fazla iki defa uzatmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla yapı ruhsatı almış olmakla birlikte işyeri açma ve çalışma ruhsatı almamış olan alışveriş merkezleri hakkında 5 inci maddenin yedinci fıkrası hükmü uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce perakende işletmelerin almış olduğu işyeri açma ve çalışma ruhsatları geçerliliğini korur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Sürekli indirimli satış yapan perakende işletmeler, bu Kanunun yürürlüğe girdiği tarihten itibaren iki yıl içinde durumlarını 10 uncu maddeye uygun hâle getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce işyeri açma ve çalışma ruhsatı almış olan alışveriş merkezlerinde, 11 inci maddede öngörülen ortak kullanım alanları, Kanunun yürürlüğe girdiği tarihten itibaren bir yıl içinde oluşturulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren, alışveriş merkezlerinde boşalan satış alanları 12 nci maddenin birinci fıkrasında belirtilen orana ulaşılana kadar esnaf ve sanatkâr işletmecilerine öncelik verilmek suretiyle kiralanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren, alışveriş merkezlerinde boşalan satış alanları 12 nci maddenin ikinci fıkrasında belirtilen orana ulaşılana kadar geleneksel, kültürel ve sanatsal değeri olan kaybolmaya yüz tutmuş meslekleri icra edenlere kiralanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>12 nci maddenin üçüncü fıkrasında, hızlı tüketim mallarının satışının yapıldığı büyük mağaza ve zincir mağazalarda yöresel ürünler için öngörülen raf tahsisi, bu Kanunun yürürlüğe girdiği tarihten itibaren bir yıl içinde yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Bu maddenin altıncı, yedinci, sekizinci, dokuzuncu ve onuncu fıkralarına aykırı hareket edenlere, bu Kanunun 18 inci maddesinde ilgili aykırılık için öngörülen cezalar, aynı maddede belirtilen usul ve esaslar çerçevesinde uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Bu Kanunda öngörülen yönetmelikler Bakanlık tarafından dokuz ay içinde yürürlüğe konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>2023 takvim yılı bakımından bu maddeyi ihdas eden Kanunla değişik 18 inci maddenin birinci fıkrasının (ğ) ve (h) bentleri uyarınca kesilecek idari para cezaları hakkında 30/3/2005 tarihli ve 5326 sayılı Kabahatler Kanununun 17 nci maddesinin yedinci fıkrası hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddeyi ihdas eden Kanunun yürürlüğe girmesinden önce reklam, pazarlama ve danışmanlık gibi giderler için alışveriş merkezindeki perakende işletmelerden katılım payı talep edilebilmesine imkân sağlayan ve bu maddenin yayımı tarihinden önce kurulan sözleşme hükümleri, sözleşme süresince geçerlidir. Ancak, sözleşme süresinin sona ermesinden önce veya sonra sözleşmenin yenilenmesi ya da süresinin uzatılmış sayılması hallerinde söz konusu giderler için katılım payı tahsil edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamındaki sözleşmelerde yönetim giderinin alt kalemleri ayrıca belirtilmedikçe perakende işletmelerden yönetim gideri olarak yalnızca alışveriş merkezinde fiilen çalışan bordrolu yönetim personelinin göreviyle ilgili giderler için katılım payı tahsil edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci ve ikinci fıkralar kapsamında perakende işletmelerce ödenmesi gereken katılım payları, bu işletmelerin satış alanlarının alışveriş merkezinin satış alanına oranlanmasıyla hesaplanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Yürütme">
