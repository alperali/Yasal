  <mvz-künye tür="kanun" no="4123" başlık="TABİİ AFET NEDENİYLE MEYDANA GELEN HASAR VE TAHRİBATA İLİŞKİN HİZMETLERİN YÜRÜTÜLMESİNE DAİR KANUN"
             tarih="23/7/1995" rgazete-tarih="25/7/1995" rgazete-sayı="22354"
             düstur-tertip="5" düstur-cilt="34" />
    
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, tabii afete maruz kalan yörelerde normal hayatın devamını sağlayacak hizmetlerin yürütülmesi, hasar ve tahribatın giderilmesi ile 2.2.1981 tarihli ve 2380 sayılı Kanuna göre kurulmuş fonlardan yapılacak yardıma ilişkin usul ve esasları düzenlemektir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Onarımı mümkün görülen ve birden fazla bağımsız bölümü olan hasarlı yapılarda, 7269 sayılı Kanun hükümlerine göre, onarım yardımından yararlanmak için kat malikleri sayı ve arsa payı çoğunluğu ile borçlanma sözleşmelerini yapmaları halinde, borçlanma sözleşmesi yapmayan veya bu imkana sahip olmayan diğer kat maliklerinin herhangi bir karar almaya gerek kalmadan Kat Mülkiyeti Kanunu gereğince yapının ortak yerlerinde yapılacak onarım giderlerine arsa payları oranında iştirakini sağlattırmaya, bunlardan tahsilat yapmaya ve yaptırmaya, Bayındırlık ve İskan Bakanlığı yetkilidir. 7269 sayılı Kanun ile 2985 sayılı Toplu Konut Kanununa dayanılarak kredi verilen inşaatı tamamlanmış veya devam etmekte olan konutlardan hasar görenlerin Toplu Konut İdaresine veya bankalara olan borçlarının ertelenmesi veya silinmesine Cumhurbaşkanı yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>Yiyecek, içecek, giyecek, tabii yardım, çadır ve diğer her türlü taşınır mallar  Kızılay'a aktarılır. Bu amaçla toplanan yardımlar derhal tabii afet bölgelerine intikal ettirilir ve tabii afet bölgeleri dışında kullanılamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamına giren yörelerde tabii afet nedeniyle hayatını kaybeden yurttaşların birinci derecedeki yakınlarına ve engelli hâle gelenlere Gelir Vergisi Kanununun engellilik indirimine ilişkin 31 inci maddesinde belirtilen esas ve usuller çerçevesinde Cumhurbaşkanınca belirlenecek miktarda yardım yapılabilir. Ödemeler Cumhurbaşkanlığınca uygun görülecek fonlardan yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamına giren yörelerde fiilen oturdukları konutları veya fiilen kullandıkları işyerleri tabii afet nedeniyle hasar görenlere 7269 sayılı Kanun hükümleri çerçevesinde yapılacak hasar tespitlerine göre, yapılacak yardımın miktar, usul ve esasları Cumhurbaşkanınca belirlenir. Ödemeler zarar görenlerin malik veya kiracı durumunda olup olmadıklarına bakılmaksızın hak sahipliği dışında karşılıksız olarak Cumhurbaşkanlığınca uygun görülecek fonlardan yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamına giren yöre belediyelerinin tabii afet nedeniyle toplayamadığı Emlak Vergisi dahil, diğer vergi, resim ve harçlar, 2.2.1981 tarihli ve 2380 sayılı Kanuna göre kurulmuş bulunan fonlardan karşılanabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkraya göre hangi fondan ne miktarda ödeme yapılacağı Cumhurbaşkanınca kararlaştırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Tabiî afete maruz kalan yörelerdeki belediyeler ile özel idarelere, maruz kaldıkları hasar ve tahribatları gidermek amacıyla, 7269 sayılı Kanunun 20.6.2001 tarihli ve 4684 sayılı Kanunla değişik 33 üncü maddesi çerçevesinde özel hesaplarda toplanan kaynaklardan yardım yapılabilir. Bu yardımların miktarı, hasar ve tahribat oranları dikkate alınarak Maliye Bakanının uygun görüşü üzerine, Bayındırlık ve İskân Bakanınca tespit edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu Kanun kapsamına giren belediyelerin İller Bankasına olan yatırım borçları Cumhurbaşkanınca belirlenecek esaslar çerçevesinde ertelenir veya terkin edilir. Bu belediyelerin İller Bankası yıllık yatırım programında bulunmayan yatırımları Bayındırlık ve İskan Bakanlığının teklifi üzerine yıllık yatırım programına derhal alınır. Bu fıkra hükümlerinin yürütülmesi için gereken ödenekler Maliye Bakanlığınca İller Bankasına bir ay içinde aktarılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="" durum="işlenmiş">
    <mvz-fıkra no="1">
      <template>(20/6/1977 tarih ve 2090 sayılı Kanuna Ek Madde eklenmesiyle ilgili olup, yerine işlenmiştir.)</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamına giren yörelerde faaliyette bulunan esnaf ve sanatkarlar, serbest meslek mensupları ile sanayici ve ticaret erbabına T. Halk Bankasınca, çiftçilere T.C. Ziraat Bankasınca; Cumhurbaşkanı tarafından tespit edilecek oran ve belirlenecek esas ve usullere göre kredi verilir. Bu kredilerin kullandırılmasından dolayı doğacak zararlar Hazinece karşılanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="">
    <mvz-fıkra no="1">
      <template>Tabiî afet nedeniyle ödenen veya ödenecek sigorta tazminatları, Devletçe ödenen yardımlardan düşülmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunda yer alan hükümlerin uygulanması ile ilgili sürelerin tespitine Cumhurbaşkanı yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Tabii afet nedeniyle hasar gören:</template>
      <mvz-bent no="a">
        <template>İskan ruhsatı alınmış binalara ait afet tarihinden önce resmi şekilde düzenlenmiş satış vaadi senedine veya noterlikçe düzenlenmiş satış senedine sahip olanlara,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Fiilen oturulmasına rağmen iskan ruhsatı alınmamış konut sahipleri ile konut kooperatiflerinin üyelerine yalnız bir kooperatif ve tek bir üyelik için,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Ahır ve samanlık sahiplerine,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>İşyeri sahiplerine,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>7269 sayılı Umumi Hayata Müessir Afetler Dolayısıyla Alınacak Tedbirlerle Yapılacak Yardımlara Dair Kanunda belirtilen borçlanma ve kredilendirme usulleri çerçevesinde hak sahipliği tanınır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamında, 7269 sayılı Umumi Hayata Müessir Afetler Dolayısıyla Alınacak Tedbirlerle Yapılacak Yardımlara Dair Kanuna göre tespit edilmiş olan hak sahipliğine başvuru süresinin uzatılması hususunda Bayındırlık ve İskan Bakanlığı yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Tabii afete maruz bölgelerde yapılacak işlerle ilgili olarak tomruk, kereste, demir ve çimento gibi yapı malzemesi tahsisleri, ilgili Bakanlığın talebi üzerine kurumlarca öncelik ve ivedilikle sağlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Tabii afete maruz bölgelerde çalışan 657 sayılı Devlet Memurları Kanununa tabi personele bütçe kanunlarında yer alan fazla çalışma ücretinin iki katını geçmemek üzere fazla çalışma ücreti ödenir. Ayrıca bu bölgede çalışan her statüdeki personele ek gösterge dahil en yüksek Devlet Memuru aylığının brüt tutarının % 50 sini geçmemek kaydı ile tazminat, aylık ve ücretleri ile birlikte ödenir. Bu tazminat, damga vergisi hariç hiçbir vergi ve kesintiye tabi tutulmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Fazla çalışmanın ve tazminatın uygulama sürelerinin, hangi yörelerdeki hangi görev ve derecelere ne miktarda ödeneceği hususlarına yönelik her türlü düzenlemeyi yapmaya Cumhurbaşkanı yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Tabii afete maruz kalan bölgelerde ticaretle iştigal eden kiracı konumundaki işletmecilere Sosyal Yardımlaşma ve Dayanışmayı Teşvik Vakıfları aracılığıyla proje üzerinden iş yeri edindirme yardımı yapılabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bayındırlık ve İskan Bakanlığına, afetlerin önlenmesi ve zararların azaltılması amacıyla, hibe olarak yurt dışından gönderilen her türlü malzeme ve teknik ekipmanlar ile geçici veya daimi olarak ithal edilecek malzeme ve teknik ekipmanlanlar, Gümrük mevzuatında belirlenen sürelere bağlı olmadığı gibi, ithalde alınan her türlü fonlar ile vergi, resim ve harçlardan muaftır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>27.1.2003 tarihinde Tunceli-Pülümür ve çevresinde, 10.4.2003 tarihinde İzmir-Urla, Seferihisar ve çevresinde ve 1.5.2003 tarihinde Bingöl ve çevresinde meydana gelen depremler sonucunda Bayındırlık ve İskân Bakanlığı fen heyetleri tarafından belediye sınırları ile mücavir alanlarında belirlenen ağır hasarlı veya yıkık konut sahibi afetzedelere veya afetzedelerin kuracakları kooperatiflere, kendi arsaları veya tespit edilecek arsalar üzerinde yapılacak konutlar için Toplu Konut İdaresi Başkanlığı aracılığı ile kredi verilebilir. Bu alanlarda Bayındırlık ve İskân Bakanlığı tarafından afetzedeler için konut, her türlü alt yapı ve sosyal donatılar ile ağır hasarlı veya yıkık işyeri sahibi afetzedelere toplu işyeri yapılabilir veya yaptırılabilir. Orta hasarlı olduğu belirlenen konut veya işyeri sahibi afetzedelere ise, Bayındırlık ve İskân Bakanlığı tarafından güçlendirme projesi ve onarım işleri için kredi verilebilir. Söz konusu kredilerin kullandırılması, geri dönüşü ve yapılacak konut ve işyerlerinin afetzedelere tahsisine ilişkin usul ve esaslar, Bayındırlık ve İskân Bakanlığı tarafından çıkarılacak yönetmelikle belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yukarıdaki fıkranın uygulanması için gerekli malî kaynak; Bütçeden aktarılacak ödenekler, 7269 sayılı Kanunun 20.6.2001 tarihli ve 4684 sayılı Kanunla değişik 33 üncü maddesinde belirlenen esaslar çerçevesinde toplanan nakdî bağış ve yardımlar ile yurt dışından sağlanan her türlü dış kredi ve hibelerden sağlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Afetzedeler için konut yapımına yönelik aynî bağışlar, yardımlar ve yurt dışından sağlanan her türlü dış kredi ve hibeler ile ilgili iş ve işlemler Bayındırlık ve İskân Bakanlığının koordinasyonunda Toplu Konut İdaresi Başkanlığınca yürütülür ve sonuçlandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Afetzedelere konut ve işyeri yapımı amacıyla tespit edilen alanlarda arsa ve arazi temininde 15.5.1959 tarihli ve 7269 sayılı Kanunun 21, ek 9 ve ek 10 uncu maddelerindeki hükümler uygulanır. Bu şekilde temin ve tahsis edilen arsa ve araziler Toplu Konut İdaresi Başkanlığına bedelsiz olarak devredilmiş sayılır. Bu araziler üzerinde imar mevzuatındaki kısıtlamalara bağlı kalmaksızın harita, her türlü imar ve parselasyon planları Bayındırlık ve İskân Bakanlığınca yapılır veya yaptırılır ve onanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu madde uyarınca temin edilecek arsa ve araziler ile yeniden inşa edilecek veya onarılacak alt ve üst yapılarla ilgili; harita, imar ve parselasyon planları, ifraz, tevhit, tescil, ihale, sözleşme, ruhsatname ve sair işlemler, verilecek beyanname, taahhütname ve sözleşmeler ile tapu ve kadastro müdürlükleri dahil tüm kamu kurum ve kuruluşlarınca yapılacak işlemler her türlü vergi, resim, harç, fon, pay ve ücretten muaftır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu madde kapsamında gerçekleştirilecek işler, 4734 sayılı Kamu İhale Kanununun 21 inci maddesinin birinci fıkrasının (b) bendi kapsamında sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
