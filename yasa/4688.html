  <mvz-künye tür="kanun" no="4688" başlık="KAMU GÖREVLİLERİ SENDİKALARI VE TOPLU SÖZLEŞME KANUNU"
             tarih="25/6/2001" rgazete-tarih="12/7/2001" rgazete-sayı="24460"
             düstur-tertip="5" düstur-cilt="40" />
    
  <mvz-kısım no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, kamu görevlilerinin ortak ekonomik, sosyal ve meslekî hak ve menfaatlerinin korunması ve geliştirilmesi için oluşturdukları sendika ve konfederasyonların kuruluşu, organları, yetkileri ve faaliyetleri ile sendika ve konfederasyonlarda görev alacak kamu görevlilerinin hak ve sorumluluklarını belirlemek ve toplu sözleşme yapılmasına ilişkin usul ve esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, Devletin veya diğer kamu tüzel kişilerinin yürütmekle görevli oldukları kamu hizmetlerinin görüldüğü genel, katma ve özel bütçeli idareler, il özel idareleri ve belediyeler ile bunlara bağlı kuruluşlarda kamu iktisadî teşebbüslerinde, özel kanunlarla  kurulan banka ve teşekküller ile bunlara bağlı kuruluşlarda ve diğer kamu kurum veya kuruluşlarında işçi statüsü dışında çalışan kamu görevlileri hakkında uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Kamu görevlisi: Bu Kanun kapsamında yer alan kurum ve kuruluşların kadro veya pozisyonlarında istihdam edilenlerden işçi statüsü dışında çalışan kamu görevlilerini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu İşvereni: Kamu görevlilerinin çalıştığı tüzel kişiliği olan ya da olmayan kamu kurum ve kuruluşlarını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kamu İşveren Vekili: Kamu kurum ve kuruluşlarını temsile ve bütününü sevk ve idareye yetkili olanlar ile bunların yardımcılarını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İşyeri: Kamu hizmetinin yürütüldüğü yerleri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Kurum: Kuruluş kanunları veya kuruluşlarına ilişkin mevzuatlarında görev, yetki ve sorumlulukları belirlenen, hizmetin niteliği ve yürütülmesi bakımından idarî bir bütünlüğe sahip işyerlerinden oluşan kuruluşları,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Sendika: Kamu görevlilerinin ortak ekonomik, sosyal ve meslekî hak ve menfaatlerini korumak ve geliştirmek için oluşturdukları tüzel kişiliğe sahip kuruluşları,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Konfederasyon: Değişik hizmet kollarında bu Kanuna tabi olarak kurulmuş en az beş sendikanın bir araya gelerek oluşturdukları tüzel kişiliği olan üst kuruluşları,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Toplu sözleşme: Bu Kanunda belirtilen esaslar çerçevesinde kamu görevlilerinin mali ve sosyal haklarını belirlemek üzere yürütülen toplu sözleşme görüşmeleri sonucunda mutabık kalınması durumunda taraflarca imzalanan sözleşmeyi,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Toplantı tutanağı: Toplu sözleşme görüşmeleri sonucunda toplu sözleşme imzalanamaması halinde, tarafların uzlaştığı ve uzlaşamadığı konuların yer aldığı tutanağı,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>İşyeri sendika temsilcisi: Bir işyerinde en çok üye kaydetmiş sendikaca o işyerinden seçilen kamu görevlisini,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Sendika işyeri temsilcisi: Bir işyerinde en çok üye kaydetmiş sendika dışındaki her bir sendika tarafından o işyerinden seçilen kamu görevlisini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu işveren vekilleri bu Kanun bakımından kamu işvereni, hizmetin niteliği ve yürütülmesi bakımından bağlı tüm birimler ise asıl işyerinden sayılır. Kamu işvereninin birden fazla işyeri varsa, bu Kanun bakımından bu işyerlerinin tamamı işyerinden sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Kuruluş Esasları ve Organlar">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Kuruluş Esasları">
      <mvz-madde no="4" başlık="Kuruluş">
        <mvz-fıkra no="1">
          <template>Sendikalar hizmet kolu esasına göre, Türkiye çapında faaliyette bulunmak amacıyla bir hizmet kolundaki kamu işyerlerinde çalışan kamu görevlileri tarafından kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir hizmet kolunda birden fazla sendika kurulabilir. Meslek veya işyeri esasına göre sendika kurulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Hizmet kolları">
        <mvz-fıkra no="1">
          <template>Sendikaların kurulabilecekleri hizmet kolları aşağıda belirtilmiştir:</template>
          <mvz-bent no="1.">
            <template>Büro, bankacılık ve sigortacılık hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Eğitim, öğretim ve bilim hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Sağlık ve sosyal hizmetler.</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Yerel yönetim hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Basın, yayın ve iletişim hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Kültür ve sanat hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>Bayındırlık, inşaat ve köy hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>Ulaştırma hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>Tarım ve ormancılık hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="10.">
            <template>Enerji, sanayi ve madencilik hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="11.">
            <template>Diyanet ve vakıf hizmetleri.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Kuruluş işlemleri">
        <mvz-fıkra no="1">
          <template>Sendika ve konfederasyonlar önceden izin almaksızın serbestçe kurulurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sendika kurucusu olabilmek için  kamu görevlisi olarak çalışmak yeterlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sendikanın kurucuları; sendika tüzüğü ve kamu görevlisi olduklarını gösterir belge ile sendikayı ilk genel kurula kadar sevk ve idare edeceklerin isimlerini kuruluş dilekçelerinin ekinde sendika merkezinin bulunacağı ilin valiliğine vermek zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Konfederasyon kurucuları, konfederasyon tüzüğü ile sendikaların konfederasyon kurulmasına ilişkin kurucular kurulu kararını ve konfederasyonu ilk genel kurula kadar sevk ve idare edeceklerin isimlerini konfederasyon merkezinin bulunacağı ilin valiliğine vermek zorundadırlar. Konfederasyonu ilk genel kurula kadar sevk ve idare edecekler, üyesi oldukları sendikaların zorunlu organlarına seçilmemişlerse, kamu görevlisi olduklarını gösterir belgeyi eklemekle yükümlüdürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yukarıda anılan belge ve tüzüklerin ilgili valiliğe verilmesi ile sendika veya konfederasyon tüzel kişilik kazanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Valilik, tüzük ve belgelerin birer örneğini, onbeş işgünü içinde Çalışma ve Sosyal Güvenlik Bakanlığına gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Tüzüğün veya bu Maddede sayılan belgelerin içerdikleri bilgilerin kanuna aykırılığının tespit edilmesi ya da bu Kanunda öngörülen kuruluş koşullarının gerçekleşmediğinin anlaşılması halinde, ilgili valilik eksikliklerin bir ay içinde tamamlanmasını ister. Tamamlanmadığı takdirde sendika veya konfederasyonun faaliyetinin durdurulması için ilgili valilik bir ay içinde iş mahkemesine başvurur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Mahkeme, kanuna aykırılığın veya eksikliğin giderilmesi için altmış günü aşmayan bir süre verir. Verilen süre sonunda tüzük ve belgeler kanuna uygun hale getirilmemişse, mahkeme sendika veya konfederasyonun kapatılmasına karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Çalışma ve Sosyal Güvenlik Bakanlığı, sendika ve konfederasyonlar için birer bilgi kaydı tutar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Tüzük">
        <mvz-fıkra no="1">
          <template>Sendika ve konfederasyonların tüzüklerinde aşağıdaki hususların belirtilmesi zorunludur:</template>
          <mvz-bent no="a">
            <template>Sendika veya konfederasyonun adı, merkezi ve adresi.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Sendika veya konfederasyonun amacı ve bu amacı gerçekleştirmek üzere sürdürülecek çalışma konuları ile çalışma usulleri.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Sendikanın faaliyet göstereceği hizmet kolu.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Sendika kurucularının ad ve soyadları, meslek veya görevleri ve adresleri; konfederasyonu kuran sendikaların hizmet kolları ile ad ve adresleri.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Sendika veya konfederasyona üyelik koşulları, üyelikten çıkma ve çıkarılmanın usul ve esasları.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Konfederasyon, sendika ve sendika şubesi genel kurul delegelerinin belirlenmesi usulü.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Genel kurulun görev ve yetkileri, oy kullanma ve karar alma usul ve yeter sayıları ile yönetim, denetleme ve disiplin kurullarının oluşumu, bu kurulların görevleri ve toplantı usulü.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Sendika veya konfederasyonun genel kurul dışındaki zorunlu organlarına üyelerin seçilme usulü, asil ve yedek üye sayısı, görev ve yetkileri.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Sendika veya konfederasyonların yöneticilerinde aranılacak şartlar.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Sendika şubelerinin nasıl kurulacağı, görev ve yetkileri, genel kurulların toplantılarına ve kararlarına ilişkin usul ve esaslar ile sendika genel kurulunda şubelerin temsil şekli.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Üyelik ödentisinin oranı.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Sendika veya konfederasyonun iç denetim usulü.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Harcamaların nasıl yapılacağı, yetkilerin nasıl verileceği ve yetki sınırları.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Tüzüğün değiştirilmesi usulü, yapılacak ilk genel kurula sunulması ve geçmişe etkili olmaması kaydıyla ilgili makamlarca veya mahkemelerce kanuna aykırı görülerek düzeltilmesi istenen tüzük hükümlerinin değiştirilmesi için yönetim kuruluna yetki verilebilmesi.</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Sendika veya konfederasyonun feshi, kendiliğinden dağılması, başka bir sendika veya konfederasyonla birleşmesi veya mahkeme kararıyla kapatılması hallerinde mal varlığının tasfiye usulü.</template>
          </mvz-bent>
          <mvz-bent no="p">
            <template>Sendika veya konfederasyonun zorunlu organlarının oluşumuna kadar kuruluşun işlerini yürütmeye ve temsile yetkili geçici yönetim kurulu üyelerinin ad ve soyadları ile adresleri.</template>
          </mvz-bent>
          <mvz-bent no="r">
            <template>Sendika ve konfederasyon temsilcilerinin seçiminde yetkili kurulun belirlenmesi, temsilcilerin nitelikleri ve görevden alınma usulü.</template>
          </mvz-bent>
          <mvz-bent no="s">
            <template>Gelirlerini ne şekilde muhafaza edecekleri ve zorunlu giderleri için kasalarında tutacakları azamî nakit mevcudu.</template>
          </mvz-bent>
          <mvz-bent no="t">
            <template>Demirbaşların satış ve terkininde uygulanacak usul ve esaslar.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Organlar ve Seçimler">
      <mvz-madde no="8" başlık="Zorunlu organlar">
        <mvz-fıkra no="1">
          <template>Sendika şubesi, sendika ve konfederasyonların zorunlu organları genel kurul, yönetim kurulu, denetleme kurulu ve disiplin kuruludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sendika ve konfederasyonlar, birinci fıkrada belirtilen organların dışında da organlar kurabilir. Tüzüklerinde belirtilmesi kaydıyla genel kurul dışındaki organlar, görev, yetki ve sorumluluklarını kurulacak bu organlara devredebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel kurullar tarafından zorunlu organlara seçilen üyelerin ad ve soyadları, meslek ve görevleri, adresleri ile tüzük değişiklikleri ve açılan, kapatılan veya birleştirilen şubeler; sendika şubesinin, sendikanın veya konfederasyonun bulunduğu illerin valiliklerine  ve Çalışma ve Sosyal Güvenlik Bakanlığına otuz gün içinde bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Genel kurulların oluşması">
        <mvz-fıkra no="1">
          <template>Sendika ve sendika şubesi genel kurulları üyelerden oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sendika şubesi genel kurulları ve üye sayısı bini aşan sendikaların genel kurulları delegelerle yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Delegeler üyeler tarafından gizli oy, açık sayım ve döküm esasına ve sendika tüzüğündeki hükümlere göre seçilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Konfederasyon genel kurulları, üye sendikalarca seçilen en çok beşyüz delegeden oluşur. Üye sendikaların genel kurulda kaç delegeyle temsil edileceği konfederasyon tüzüğünde belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sendika şubeleri ile sendika ve konfederasyonların yönetim ve denetleme kurulu üyeleri bu sıfatla kendi genel kurullarına delege olarak katılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Delege sıfatı, müteakip olağan genel kurul için yapılacak delege seçimine kadar sürer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Tüzüklere delege seçilmeyi engelleyici hükümler konulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Genel kurulların toplantı zamanı ve karar yeter sayısı">
        <mvz-fıkra no="1">
          <template>Sendika veya konfederasyonun ilk genel kurulu tüzel kişilik kazanmasından başlayarak altı ay içinde yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Olağan genel kurul toplantıları dört yılı aşmamak üzere tüzüklerde belirtilen sürede yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İki genel kurul toplantısı arasındaki döneme ilişkin faaliyet ve hesap raporu, denetleme kurulu veya denetçi raporu ile gelecek döneme ilişkin bütçe önerisi, genel kurula katılacaklara toplantı tarihinden en az onbeş gün önce yazılı veya elektronik ortamda gönderilir ve internet sitesinde ilan edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Olağanüstü genel kurul, yönetim kurulu veya denetleme kurulunun gerekli gördüğü durumlarda ya da genel kurul üye veya delegelerinin beşte birinin yazılı isteği üzerine en geç altmış gün içinde toplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Genel kurula çağrı yönetim kurulu tarafından yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Toplantı yeter sayısı üye ya da delege tamsayısının salt çoğunluğudur. İlk toplantıda yeter sayı sağlanamazsa, ikinci toplantı en çok onbeş gün sonraya bırakılabilir. Bu toplantıda salt çoğunluk aranmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Karar yeter sayısı toplantıya katılan üye veya delege sayısının salt çoğunluğudur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Yukarıdaki hükümlere aykırı hareket eden sendika şubesi, sendika veya konfederasyon yönetim kuruluna; üyelerinden birinin veya durumu tespit eden Çalışma ve Sosyal Güvenlik Bakanlığının başvurusu üzerine, iş davalarına bakmakla görevli mahkeme kararı ile işten el çektirilir. Bu takdirde görevli mahkeme, genel kurulu kanun ve tüzük hükümleri gereğince altmış günü geçmemek kaydıyla en kısa zamanda toplamak ve yeni yönetim kurulu seçilinceye kadar cari işleri yürütmekle görevli olmak üzere Medenî Kanun hükümleri gereğince bir veya üç kayyım tayin eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Seçimlerde uygulanacak esaslar">
        <mvz-fıkra no="1">
          <template>Genel kurullarda seçimler yargı gözetimi altında serbest, eşit, gizli oy, açık sayım ve döküm esasına göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel kurul toplantıları, genel kurullarda yapılacak seçimler, seçimlere yapılacak itirazlar, seçimlerin iptali ve yenilenmesine ilişkin hususlarda 2821 sayılı Sendikalar Kanununun 14 üncü Maddesi ile 52 nci Maddesinde yer alan hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Seçimlere ilişkin usul ve esaslar, sendika ve konfederasyonların tüzüklerinde belirtilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Genel kurulların görevleri">
        <mvz-fıkra no="1">
          <template>Genel kurulların görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Organların seçimi.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Tüzük değişikliği.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yönetim ve denetleme kurulu raporlarının görüşülmesi ve aklanması.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Yönetim kurulunca hazırlanan çalışma programı ve bütçenin görüşülerek karara bağlanması.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Sendika ve konfederasyonların tüzüklerinde belirtilen konularda yönetim kuruluna yetki verilmesi.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Taşınmaz malların satın alınması veya mevcut taşınmaz malların satılması konusunda yönetim kuruluna yetki verilmesi.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Sendika ve konfederasyon yönetim kurulu üyelerine verilecek her türlü ücret ve diğer görevlilerin huzur hakkı ve yolluklarının belirlenmesi.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Sendika şubesi açma, şubeleri birleştirme veya kapatma; sendika şubesi açma ve başlangıçtaki kuruluş şartlarını kaybeden şubeleri kapatma konularında yönetim kuruluna yetki verme.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Aynı hizmet kolunda bulunmak koşuluyla başka bir sendika ile birleşme ve katılma.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Başka bir konfederasyonla birleşme ve katılma.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Konfederasyonlara üye olma veya üyelikten çekilme.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Amaçlarına uyan uluslararası kuruluşlara üye olma veya çekilme.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Fesih kararı verme.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Mevzuatta veya sendika tüzüklerinde genel kurulca yapılması belirtilen diğer işlemlerin yerine getirilmesi ve herhangi bir organın görev alanına girmeyen konuların karara bağlanması.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Şube genel kurulları sadece yukarıdaki (a), (c) ve (n) bentlerinde belirtilen görevlerini yerine getirirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Yönetim, denetleme ve disiplin kurullarının oluşması, görevleri ve toplantıları">
        <mvz-fıkra no="1">
          <template>Sendika şubesi ve sendika yönetim kurulları en az üç, en çok yedi üyeden; konfederasyon yönetim kurulları ise en az beş, en çok on üyeden oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Disiplin kurulu en az üç, en çok beş üyeden, denetleme kurulu en az üç, en çok beş denetçiden oluşur. Şubelerde bir denetçi ile yetinilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yönetim, denetleme ve disiplin kurulları ile kurulması uygun görülen diğer organların oluşumu, görev ve yetkileri ile toplanma ve karar alma usulleri Sendikalar Kanununun 16, 17, 18 ve 19 uncu Maddelerinde belirtilen esaslara uygun olarak sendika veya konfederasyonların tüzüklerinde düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Üyelik ve Güvenceler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Üyelik">
      <mvz-madde no="14" başlık="Sendika üyeliğinin kazanılması">
        <mvz-fıkra no="1">
          <template>Sendikalara üye olmak serbesttir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu görevlileri çalıştıkları işyerinin girdiği hizmet kolunda kurulu bir sendikaya üye olabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sendikaya üyelik, kamu görevlisinin üç nüsha olarak doldurup imzaladığı üye formu ile sendikaya başvurması ve başvurunun sendika yetkili organınca kabulü ile kazanılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Üyelik başvurusu, sendika tarafından en çok otuz gün içinde reddedilmediği takdirde üyelik istemi kabul edilmiş sayılır. Haklı bir sebep gösterilmeden üyeliği kabul edilmeyen kamu görevlisinin, bu kararın kendisine tebliğinden itibaren otuz gün içinde iş davalarına bakmakla görevli mahallî mahkemede dava açma hakkı vardır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sendika, üyeliği kesinleşen kamu görevlisinin başvuru belgesinin bir örneğini üyenin kendisine verir, bir örneği sendikada kalır, bir örneğini üyelik ödentisine esas olmak ve dosyasında saklanmak üzere onbeş gün içinde işverene gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Birden çok sendikaya üye olunamaz. Birden çok sendikaya üyelik halinde sonraki üyelikler geçersizdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Aynı tarihli birden fazla üyeliğe ilişkin bildirimler dikkate alınmaz ve bu husus kamu işvereni tarafından ilgiliye ve sendikalara yazılı olarak bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Sendika üyesi olamayacaklar">
        <mvz-fıkra no="1">
          <template>Bu Kanuna göre kurulan sendikalara;</template>
          <mvz-bent no="a">
            <template>Cumhurbaşkanlığı merkez teşkilatında, bağlı kurullarında ve Diyanet İşleri Başkanlığı, Savunma Sanayii Başkanlığı ile İletişim Başkanlığı hariç olmak üzere bağlı kuruluşlarında, Millî Güvenlik Kurulu Genel Sekreterliğinde çalışan kamu görevlileri,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yüksek yargı organlarının başkan ve üyeleri, hâkimler, savcılar ve bu meslekten sayılanlar,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bakanlar, bakan yardımcıları, bu Kanun kapsamında bulunan kurum ve kuruluşların başkanları, genel müdürleri ve bunların yardımcıları, yönetim kurulu üyeleri, merkez teşkilâtlarının denetim birimleri yöneticileri ve kurul başkanları, hukuk müşavirleri, bölge, il ve ilçe teşkilâtlarının en üst amirleri ile bunlara eşit veya daha üst düzeyde olan kamu görevlileri,  belediye başkanları ve yardımcıları,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Yükseköğretim Kurulu Başkan ve üyeleri ile Yükseköğretim Denetleme Kurulu Başkan ve üyeleri, üniversite ve yüksek teknoloji enstitüsü rektörleri,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Mülkî idare amirleri,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Silahlı Kuvvetler mensupları,</template>
          </mvz-bent>
          <mvz-bent no="g" durum="iptal">
            <template></template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Millî İstihbarat Teşkilâtı mensupları,</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Bu Kanun kapsamında bulunan kurum ve kuruluşların merkezi denetim elemanları,</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Emniyet hizmetleri sınıfı  ,</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Ceza infaz kurumlarında çalışan kamu görevlileri,</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığında görevli subay, sözleşmeli subay, astsubay, sözleşmeli astsubay, uzman jandarma, uzman erbaş, sözleşmeli erbaş ve sözleşmeli erler,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>üye olamazlar ve sendika kuramazlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="Üyeliğin sona ermesi">
        <mvz-fıkra no="1">
          <template>Her üye üyelikten serbestçe çekilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Üyelikten çekilme, çekilmek isteyen kamu görevlisi tarafından, üç nüsha olarak doldurulup imzalanan üyelikten çekilme bildiriminin kurumuna verilmesi ile gerçekleşir. Kurum görevlisi, kayıt numarası ile tarih verilen çekilme bildiriminin bir suretini derhal üyeye vermek zorundadır. Kamu işvereni, bildirimin bir örneğini onbeş gün içinde sendikaya gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Çekilme, kamu işverenine başvurma tarihinden başlayarak otuz gün sonra geçerli olur. Çekilenin bu süre içinde başka bir sendikaya üye olması halinde yeni sendikaya üyeliği, bu sürenin bitim tarihinde kazanılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Üyenin, sendikadan çıkarılma kararı sendika merkez genel kurulunca alınır. Çıkarma kararı, çıkarılana ve işverene yazı ile bildirilir. Çıkarma kararına karşı üye, bildirim tarihinden itibaren onbeş gün içinde görevli iş mahkemesine itiraz edebilir. Mahkeme iki ay içinde kesin karar verir. Üyelik, çıkarılma kararı kesinleşinceye kadar sürer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Çekilme, göreve son verilmesi veya sair nedenlerle kamu görevinden ayrılanların üyelikleri, sendika şubesi, sendika veya konfederasyon organlarındaki görevleri, farklı bir hizmet koluna giren kuruma atananlardan sendika üyesi olanların ise üyelikleri, varsa sendika şubesi ve sendika organlarındaki görevleri sona erer, ancak varsa konfederasyon organlarındaki görevleri devam eder. Emekliye ayrılanların sendika şubesi, sendika veya konfederasyon organlarındaki görevleri seçildikleri dönemin sonuna kadar devam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Üyeliğin devamı ve askıya alınması hallerinde 2821 sayılı Sendikalar Kanununun 24 üncü maddesinde yer alan hükümler uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="Konfederasyon ve uluslararası kuruluş üyeliği">
        <mvz-fıkra no="1">
          <template>Sendikalar, ancak bir konfederasyona üye olabilirler. Birden çok konfederasyona üye olunması halinde sonraki üyelikler geçersizdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sendika veya konfederasyonlar, tüzüklerinde gösterilen amaçlarını gerçekleştirmek üzere uluslararası kuruluş kurabilir, amaçlarına uyan uluslararası kuruluşlara üye olabilir ve üyelikten çekilebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sendika ve konfederasyonlar ikinci fıkra kapsamına giren üyelik işlemlerini ve faaliyetlerini gerçekleşme tarihinden itibaren onbeş gün içinde Çalışma ve Sosyal Güvenlik Bakanlığına bildirir. Bildirime ilgili kuruluş tüzüğünün bir örneği de eklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sendikalar ve konfederasyonlar önceden izin almaksızın, serbestçe, yabancı ülkelerdeki amaçlarına uyan uluslararası kuruluşların üye veya temsilcilerini Türkiye'ye davet edebilir veya yabancı ülkelerdeki toplantılarına kendi üye veya temsilcilerini gönderebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Güvenceler">
      <mvz-madde no="18" başlık="Sendika üyelerinin ve yöneticilerinin güvencesi">
        <mvz-fıkra no="1">
          <template>Kamu görevlileri, iş saatleri dışında veya işverenin izni ile iş saatleri içinde sendika veya konfederasyonların bu Kanunda belirtilen faaliyetlerine katılmalarından dolayı farklı bir işleme tâbi tutulamaz ve görevlerine son verilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu işvereni, işyeri sendika temsilcisi, sendika işyeri temsilcisi, sendika il ve ilçe temsilcisi ile sendika ve sendika şube yöneticilerinin işyerini  sebebini açık ve kesin şekilde belirtmedikçe değiştiremez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu işvereni kamu görevlileri arasında sendika üyesi olmaları veya olmamaları nedeniyle bir ayırım yapamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sendika veya konfederasyonu ilk genel kurula kadar sevk ve idare edecek yönetim kurulu üyeleri, genel kurulda yönetim kuruluna seçilenler ile sendika şube yönetim kurulu üyeleri seçildikleri tarihten itibaren durumlarını en geç otuz gün içinde kurumlarına yazılı olarak bildirirler. Söz konusu yöneticiler  sendika tüzüğünde belirtilen hükümlere göre, ayrıca yazılı talepte bulunmaları halinde bu görevleri süresince aylıksız izine ayrılırlar. Talepte bulunmayanlar ise kurumlarındaki görevlerine devam ederler. İzine ayrılmayan yönetim kurulu üyeleri haftada bir gün kurumlarından izinli sayılırlar.  Sendika yönetim kurulu üyelerinin, bu fıkrada belirtilen haklardan yararlanabilmesi için bağlı bulundukları sendikanın şube kurulması için öngörülen üye sayısına ulaşması, konfederasyon yönetim kurulu üyelerinin bu fıkrada belirtilen haklardan yararlanabilmesi için ise konfederasyona bağlı sendikaların toplam üye sayısının genel kurullarını delegelerle yapabilecek sendika üye sayısına ulaşması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sendika şubeleri en az 400 üye ile kurulur.  Sendika şubesi bulunmayan il ve ilçelerde il ve ilçe temsilciliği kurulabilir. İldeki üye sayısı 100 ve daha fazla olan sendikanın il temsilcisi ile ilçedeki üye sayısı 50 ve daha fazla olan sendikanın ilçe temsilcisi haftada dört saat izinli sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Aylıksız izine ayrılan yöneticilerin bu süreleri, emekli kesenekleri ve karşılıklarının yöneticisi oldukları sendikaları tarafından her ay Türkiye Cumhuriyeti Emekli Sandığına ödenmesini kabul etmeleri koşuluyla kazanılmış hak aylığı ile emeklilik hizmetine sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Kurumlarından aylıksız izinli sayılan sendika, konfederasyon ve şube yönetim kurulu üyeleri ile bunların bakmakla yükümlü oldukları aile fertlerinin sağlık giderlerinin kurumlarınca karşılanmasına devam olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Aylıksız izinli sayılanlardan herhangi bir nedenle sendika veya konfederasyon organlarındaki görevlerinden ayrılanlar, görevlerinin son bulması tarihinden itibaren otuz gün içinde ayrıldıkları kurum ve kuruluşa yazılı müracaat etmeleri durumunda, kamu işvereni bu kimseleri otuz gün içinde eski görevlerine ya da uygun diğer bir göreve atamak zorundadır. Otuz gün içinde görevlerine başlamak için başvurmayanlar görevlerinden çekilmiş sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Görevden uzaklaştırma, re’sen emeklilik, göreve son verilmesi, tayin veya sair hallerde görevlinin mahkemeye başvurması halinde, mahkeme kararı kesinleşinceye kadar sendikadaki görevi devam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Faaliyetler, Yasaklar ve Yönetime Katılma">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Faaliyetler ve Yasaklar">
      <mvz-madde no="19" başlık="Sendika ve konfederasyonların yetki ve faaliyetleri">
        <mvz-fıkra no="1">
          <template>Kamu görevlileri sendikaları ile konfederasyonlar, bu Kanundaki hükümler çerçevesinde, toplu sözleşme görüşmelerinde taraf olmaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sendika ve konfederasyonlar kuruluş amaçları doğrultusunda toplumsal cinsiyet eşitliğini gözeterek aşağıdaki faaliyetlerde bulunabilirler:</template>
          <mvz-bent no="a">
            <template>Genel olarak kamu personelinin hak ve ödevleri, çalışma koşulları, yükümlülükleri, iş güvenlikleri ile sağlık koşullarının geliştirilmesi konularında görüş bildirmek ve toplu sözleşmenin uygulanmasını izlemek üzere yapılacak çalışmalara temsilciler göndermek.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Devlet personel mevzuatında kamu görevlilerinin temsilini öngören çeşitli kurullara temsilci göndermek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Verimlilik araştırmaları yapmak, sonuçlarla ilgili raporlar düzenlemek, önerilerde bulunmak ve işverenlerle bu konularda ortak çalışmalar yapmak.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Üyelerin meslekî yeterliliklerinin artırılması ve sorunlarının çözülmesi ile sendikal faaliyetlerinin geliştirilmesine yönelik kurs, seminer ve sosyal amaçlı toplantılar düzenlemek, bilimsel çalışmalar yapmak ve yayınlarda bulunmak.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Üyelerin ortak ekonomik ve sosyal hak ve menfaatleri ile personel hukukunu ilgilendiren konularda ilgili kurumlara ve yetkili makamlara sunulmak üzere çalışmalar yapmak ve öneriler getirmek.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Üyelerin idare ile ilgili doğacak ihtilaflarında, ortak hak ve menfaatlerinin izlenmesinde veya hukukî yardım gerekliliğinin ortaya çıkması durumunda üyelerini veya mirasçılarını, her düzeyde ve derecedeki yönetim ve yargı organları önünde temsil etmek veya ettirmek, dava açmak ve bu nedenle açılan davalarda taraf olmak.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Üyeleri ve ailelerinin yararlanmaları için hizmet amacıyla, eğitim ve sağlık tesisleri, dinlenme yerleri, misafirhane spor alanları ve benzeri yerler ile kitaplık, kreş, yuva ve huzur evleri, yardımlaşma sandıkları kurmak ve yönetmek ile herhangi bir bağışta bulunmamak kaydı ile üyeleri için kooperatifler kurulmasına yardım etmek ve nakit mevcudunun yüzde onundan fazla olmamak kaydıyla bu kooperatiflere kredi vermek.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Yangın, su baskını, deprem gibi tabii afetlerin vukuunda, gerektiğinde üyelik şartı aranmaksızın nakit mevcudunun yüzde onunu aşmamak kaydıyla afete uğrayan bölgelerde konut, sağlık ve eğitim tesisleri yapılması amacıyla kamu yararına çalışan dernekler ve Cumhurbaşkanınca vergi muafiyeti tanınan vakıflar ile kamu kurum ve kuruluşlarına aynî ve nakdî yardımda bulunmak, afete uğrayan bölgelerde konut ve sağlık tesisleri yapmak.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Gerektiğinde, nakit mevcudunun yüzde onunu aşmamak kaydıyla ve Aile ve Sosyal Politikalar Bakanlığı ile koordinasyon halinde, 8/6/1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanununun mülga 64 üncü maddesi ve 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 47 nci maddesinin sekizinci fıkrasında sayılanlar ile 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu, 3/11/1980 tarihli ve 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanun, 17/7/2004 tarihli ve 5233 sayılı Terör ve Terörle Mücadeleden Doğan Zararların Karşılanması Hakkında Kanunun ek 1 inci maddesi hükümlerine göre nakdî tazminat ödenmesi veya aylık bağlanması hakkı bulunanlara aynî ve nakdî yardımda bulunmak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="Yasaklar">
        <mvz-fıkra no="1">
          <template>Bu Kanuna göre kurulan sendika ve konfederasyonların yönetim ve işleyişleri Anayasada belirtilen Cumhuriyetin niteliklerine ve demokratik esaslara aykırı olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sendika ve konfederasyonlar kamu makamlarından maddî yardım kabul edemez, siyasî partilerden maddî yardım alamaz ve onlara maddî yardımda bulunamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sendika ve konfederasyonlar siyasî partilerin kuruluşu içinde yer alamazlar; siyasî partilerin ad, amblem, rumuz veya işaretlerini kullanamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sendika ve konfederasyonlar ticaretle uğraşamazlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Yönetime Katılma">
      <mvz-madde no="21" başlık="Kamu Personeli Danışma Kurulu">
        <mvz-fıkra no="1">
          <template>Kamu Personeli Danışma Kurulu, kamu görevlileri sendikaları ve konfederasyonları ile kamu idareleri arasında sosyal diyaloğun geliştirilmesi, kamu personel mevzuatının ve kamu yönetimi uygulamalarının değerlendirilmesi, yönetimin daha iyi işleyen bir yapıya kavuşturulması için ortak çalışmalar yürütülmesi, kamu görevlilerinin yönetime katılımının sağlanması ve kamu yönetiminin karşılaştığı sorunlara çözümler geliştirilmesi amacıyla; Cumhurbaşkanının görevlendireceği Cumhurbaşkanı yardımcısı veya bakanın başkanlığında, en çok üyeye sahip üç konfederasyonun genel başkanı ile her bir hizmet kolunda en çok üyeye sahip kamu görevlileri sendikasının başkanı ve Cumhurbaşkanınca belirlenen kamu kurum ve kuruluşlarının temsilcilerinden oluşur. Kurula gündemde yer alan konulara göre diğer kamu kurum ve kuruluşlarının yetkilileri de davet edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>28 inci maddede belirtilen toplu sözleşme konuları ile kurumsal konular dışında kalan ve kamu personel sistemini ilgilendiren genel nitelikli konular, Kurulda değerlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kurul, her yıl mart ve kasım aylarında toplanır. Kurulun sekretarya hizmetleri Devlet Personel Başkanlığınca yürütülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Kurum idarî kurulları">
        <mvz-fıkra no="1">
          <template>Kurum düzeyinde kamu görevlilerinin çalışma koşulları ve kanunların kamu görevlilerine eşit uygulanması konularında görüş bildirmek üzere, eşit sayıda kamu işveren vekili ile en çok üyeye sahip sendikaca, üyeleri arasından belirlenen temsilcilerin katıldığı kurum idarî kurulları oluşturulur. Bu kurullar yılda iki kez toplanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="İşyeri sendika temsilcileri ve sendika işyeri temsilcileri">
        <mvz-fıkra no="1">
          <template>İşyerlerinde 30 uncu madde uyarınca yapılan tespite göre kamu görevlilerinden en çok üye kaydetmiş sendika, işyeri sendika temsilcisi seçmeye yetkilidir. İşyerindeki kamu görevlisi sayısı 200’e kadar ise bir, 201-600 arasında ise en çok iki, 601-1000 arasında ise en çok üç, 1001-2000 arasında ise en çok dört, 2000’den fazla ise en çok beş işyeri sendika temsilcisi seçilebilir. Bu temsilcilerden biri ilgili sendika tarafından baştemsilci olarak görevlendirilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İşyeri sendika temsilcileri, işyerlerinde kamu görevlilerinin işveren veya işyeri ile ilgili sorunlarını dinlemek, ilgili yerlere iletmek ve kamu görevlileri ile işveren arasında iletişim sağlamak amacıyla işyerinden seçilir. İşyeri sendika temsilcileri bu görevlerini işyerinde, haftada dört saat olmak üzere yerine getirirler ve bu sürede izinli sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bir işyerinde en çok üye kaydetmiş sendikanın dışında faaliyette bulunan sendikalar da, bu Kanun kapsamına giren sendikal faaliyetlerin yürütülmesi açısından koordinasyon görevini yürütmek üzere o işyerinden sendika işyeri temsilcisi belirleyebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kamu işvereni, yönetim ve hizmetin işleyişini engellemeyecek biçimde sendika temsilcilerine çalışma saatleri içinde ve dışında görevlerini yapabilmeleri için imkânlar ölçüsünde kolaylıklar sağlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Sendika ve Konfederasyonların Gelirleri, Giderleri ve Denetimi">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Gelir ve Giderler">
      <mvz-madde no="24" başlık="Gelirler">
        <mvz-fıkra no="1">
          <template>Sendika ve konfederasyonların gelirleri;</template>
          <mvz-bent no="a">
            <template>Üyelerinin ödeyecekleri üyelik ödentilerinden,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bu Kanuna göre yapabilecekleri faaliyetlerden elde edilecek gelirlerden,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bağış ve yardımlardan,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Mal varlığından elde edilen gelirlerden,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="iptal">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sendika ve konfederasyonlar tüm nakdî gelirlerini bankalara yatırmak zorundadırlar. Zorunlu giderler için kasalarında tutacakları azamî nakit mevcudu tüzüklerinde gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="Üyelik ödentisi">
        <mvz-fıkra no="1">
          <template>Kamu görevlileri sendikasına, kamu görevlisinin ödeyeceği üyelik ödentileri, 14 üncü madde çerçevesinde doldurulan üyelik başvuru formuna ve sendika tüzüğünde belirtilen aylık ödenti tutarına göre kamu işverenince aylığından kesilerek beş gün içinde sendikaların banka hesaplarına yatırılır ve ödenti listesinin bir örneği ilgili sendikaya gönderilir. Kamu işvereni, sendikaya üye olan ve üyelik ödentisi kesilen kamu görevlilerinin listesini her ayın son haftasında, işyerinde herkesin görebileceği yerde ve kurumsal düzeyde duyurulabilecek diğer araçlarla ilan eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Aylık üyelik ödenti tutarı; kamu görevlisinin kadro ya da pozisyonuna bağlı ve her ay mutat olarak ödenmekte olan damga vergisine tâbi aylık brüt gelirleri toplamına, sendika tüzüğünde belirtilen oran uygulanmak suretiyle hesaplanır. Ödenti tutarı, 15 inci derecenin birinci kademesinden aylık alan Devlet memurunun damga vergisine tâbi brüt gelirleri toplamının binde dördünden az, otuzda birinden fazla olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sendika tüzüğüne, üyelik ödentisi dışında her ne ad altında olursa olsun, üyelerden başka bir kesinti yapılmasını öngören hükümler konulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sendika merkez genel kurul kararıyla üyelikten çıkarılan üyelerin isimlerinin sendikaca onbeş gün içinde işverene bildirilmesi zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Konfederasyonlara üyelerince ödenecek ödenti miktarı, sendikaların ödenti tutarlarının yüzde beşinden aşağı olmamak üzere konfederasyonların genel kurullarınca belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Giderler">
        <mvz-fıkra no="1">
          <template>Sendika ve konfederasyonlar gelirleri tüzüklerinde belirtilen amaçları ve bu Kanunda gösterilen faaliyetleri dışında kullanamazlar ve bağışlayamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sendika ve konfederasyonlar, gelirlerinin en az yüzde onunu üyelerinin mesleki bilgi ve tecrübelerini artırmak için kullanmak zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Vergi Usul Kanununa göre demirbaş sayılan her türlü eşya veya malzeme demirbaş defterine kaydedilir ve bunlar hiçbir şekilde gider olarak işlem göremez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sendika şubeleri, sendika ve konfederasyonlar yardımlaşma sandıkları dışında, üyeleri, yöneticileri veya diğer kişi ve kuruluşlara borç para veremez ve elde ettikleri gelirleri dağıtamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sendika ve konfederasyonların tutacakları defterler, tasdik şekli, kayıtların düzenlenme usul ve esasları bir yönetmelikle belirlenir. Muhasebe kayıtları bilanço esasına göre tutulur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Denetim">
      <mvz-madde no="27" başlık="İdarî ve malî denetim">
        <mvz-fıkra no="1">
          <template>Sendika şubesi, sendika ve konfederasyonların yönetim ve işleyişleri ile gelir ve giderleri ve bunlarla ilgili her türlü işlemlerin kanunlar ve ilgili diğer mevzuat ile tüzük ve genel kurul kararlarına uygun olup olmadığı hususlarındaki idari ve mali denetim, denetleme kurulları ya da denetçiler tarafından yapılır. Denetimin esasları hakkında Sendikalar Kanununun 47 nci Maddesine göre çıkarılan tüzük hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sendikalar ve konfederasyonların yıllık hesapları 1.6.1989 tarihli ve 3568 sayılı Kanuna göre denetim yetkisi almış meslek mensupları tarafından denetlenerek, bağımsız denetim raporu hazırlanır. Bu raporlar genel kurula sunulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sendika ve konfederasyonlar her hesap ya da bütçe dönemine ait bilanço ve hesaplarıyla çalışma ve denetleme raporlarını ait oldukları dönemi izleyen üç ay içinde Çalışma ve Sosyal Güvenlik Bakanlığına; sendikalar ayrıca bağlı bulundukları konfederasyona gönderirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="Toplu Sözleşme">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-madde no="28" başlık="Toplu sözleşmenin kapsamı">
        <mvz-fıkra no="1">
          <template>Toplu sözleşme; kamu görevlilerinin mali ve sosyal haklarını düzenleyen mevcut mevzuat hükümleri dikkate alınarak kamu görevlilerine uygulanacak katsayı ve göstergeler, aylık ve ücretler, her türlü zam ve tazminatlar, ek ödeme, toplu sözleşme ikramiyesi, fazla çalışma ücreti, harcırah, ikramiye, doğum, ölüm ve aile yardımı ödenekleri, cenaze giderleri, yiyecek ve giyecek yardımları ve diğer mali ve sosyal hakları kapsar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Toplu sözleşme ikramiyesi hariç olmak üzere toplu sözleşme hükümlerinin uygulanmasında sendika üyesi olan ve sendika üyesi olmayan kamu görevlileri arasında ayrım yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Toplu sözleşme hükümleri, sözleşmenin yapıldığı tarihi takip eden iki mali yıl için geçerlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>8/6/1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanununa göre aylık ödenmekte olanların aylıklarının hesabında da toplu sözleşme hükümlerine göre belirlenen aylık ve taban aylık katsayıları esas alınır. 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamındaki sigortalılık hali esas alınarak bağlanan yaşlılık, malullük veya ölüm aylıklarında yapılacak artışlar hakkında 5510 sayılı Kanunun 55 inci maddesinin ikinci fıkrası uygulanmaz ve bu aylıklar toplu sözleşme hükümlerine göre belirlenen aylık ve taban aylık katsayılarındaki artış dikkate alınarak artırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="Toplu sözleşmenin tarafları ve imza yetkisi">
        <mvz-fıkra no="1">
          <template>Toplu sözleşme görüşmelerine kamu idaresi adına Kamu İşveren Heyeti, kamu görevlileri adına Kamu Görevlileri Sendikaları Heyeti katılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu İşveren Heyeti, Cumhurbaşkanının görevlendireceği Cumhurbaşkanı yardımcısı veya bakanın başkanlığında, Cumhurbaşkanınca belirlenen bakanlıklar ile kamu kurum ve kuruluşlarının temsilcilerinden oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu Görevlileri Sendikaları Heyeti, bağlı sendikaların toplam üye sayısı itibarıyla en fazla üyesi bulunan konfederasyonun Heyet Başkanı olarak belirleyeceği bir temsilci ile her bir hizmet kolunda en fazla üyeye sahip kamu görevlileri sendikaları tarafından belirlenecek birer temsilci, bağlı sendikaların üye sayıları esas alınmak kaydıyla toplam üye sayıları itibarıyla birinci, ikinci ve üçüncü sırada bulunan konfederasyonlar tarafından belirlenecek birer temsilci olmak üzere onbeş üyeden oluşur. Heyet Başkanı ve temsilciler, toplu sözleşme görüşmelerinin başlamasından onbeş gün önce konfederasyonlar tarafından Devlet Personel Başkanlığına bildirilir. Heyet Başkanlığı sıfatını haiz konfederasyon temsilcisinin toplu sözleşme görüşmelerine katılmaması veya görüşmelerden çekilmesi halinde Heyet Başkanlığı yetkisi, en çok üyeye sahip ikinci sırada bulunan konfederasyon temsilcisi tarafından kullanılır. Her bir hizmet kolunda en fazla üyeye sahip kamu görevlileri sendikaları tarafından belirlenecek temsilcinin toplu sözleşme görüşmelerine katılmaması veya görüşmelerden çekilmesi halinde aynı hizmet kolunda en fazla üyeye sahip ikinci sırada bulunan kamu görevlileri sendikası temsilcisi Kamu Görevlileri Sendikaları Heyetine dahil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Toplu sözleşmeyi imzalamaya kamu idaresi adına Kamu İşveren Heyeti Başkanı, kamu görevlileri adına sözleşmenin kamu görevlilerinin geneline yönelik bölümü için Kamu Görevlileri Sendikaları Heyeti Başkanı ve hizmet kollarına yönelik bölümleri için ilgili sendika temsilcisi yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu madde hükümlerine göre toplu sözleşmenin imzalanan bölümlerine ilişkin Kamu Görevlileri Hakem Kuruluna başvurulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Üye Sayılarının Tespiti ve Toplu Sözleşme Görüşmeleri">
      <mvz-madde no="30" başlık="Üye sayılarının tespiti">
        <mvz-fıkra no="1" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sendika ve konfederasyonların üye sayılarının belirlenmesinde aşağıdaki esaslar uygulanır:</template>
          <mvz-bent no="a">
            <template>Kurumlarca yapılacak tespit;</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Tespite ilişkin toplantıya kurumun işveren vekili ile tahakkuk memuru veya mali hizmetler birimi yetkilisi ve kurumun hizmet kolunda faaliyette bulunan sendikalardan birer temsilci katılır. Toplantı her yıl 15 mayıs tarihinden sonra beş iş günü içerisinde kurumca belirlenerek sendikalara bildirilen yer ve günde yapılır.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Bu Kanuna tâbi olarak kurumda çalışan kamu görevlilerinin, 15 mayıs tarihi itibarıyla listesi ile üyelerinden aidat kesintisi yapılan sendikaların üyelerini gösterir liste, toplantıya katılanlarca değerlendirilir. Bu değerlendirmeden sonra, toplam kamu görevlisi sayısı ile sendika üyesi kamu görevlilerinin sendikalara göre toplam sayılarını belirten tutanak toplantıya katılan taraflarca imzalanır. İmzalı tutanak, kamu işvereni ve sendikalarca mayıs ayının son iş gününe kadar Çalışma ve Sosyal Güvenlik Bakanlığına gönderilir.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Kurumların taşra teşkilatları, yukarıdaki esaslara göre tarafların katılımı ile yapılacak toplantı neticesinde düzenlenecek tutanakları kurum merkezinde yapılacak tespitte değerlendirilmek üzere 15 mayıs tarihini takip eden iki iş günü içerisinde kurum merkezine gönderirler. Bu tutanaklar kurum merkezinde tarafların katılımı ile tek tutanak haline getirilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Çalışma ve Sosyal Güvenlik Bakanlığınca kurumlardan ve sendikalardan gelen müşterek imzalı listeler üzerinden yapılacak tespit;</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Çalışma ve Sosyal Güvenlik Bakanlığı, kurumlarda çalışan toplam kamu görevlisi sayısı ile sendikalar itibarıyla üyelik kesintisi yapılan üye sayılarını dikkate alarak her yıl 15 mayıs tarihi itibarıyla hizmet kollarındaki bütün kamu görevlileri sayısı ile hizmet kolundaki sendikaların üye sayılarını tespit eder. Buna göre  kamu görevlileri sendikaları ile konfederasyonların toplam üye sayısını belirler ve sonuçları her yıl temmuz ayının ilk haftasında Resmî Gazetede yayımlar.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sonuçların yayımı tarihinden itibaren beş işgünü içinde kamu görevlileri sendikaları ile konfederasyonlarının üye sayılarının yanlışlığı iddiasıyla sendika ve konfederasyonlarca Ankara İş Mahkemesine itiraz edilebilir. Mahkeme itirazı onbeş gün içinde karara bağlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="Toplu sözleşme görüşmeleri">
        <mvz-fıkra no="1">
          <template>Toplu sözleşme görüşmeleri son rakamı tek olan yıllarda yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu görevlilerinin geneline yönelik toplu sözleşme teklifleri Kamu Görevlileri Sendikaları Heyetinin konfederasyon temsilcisi üyeleri, her bir hizmet koluna ilişkin toplu sözleşme teklifleri ise Heyetin ilgili sendika temsilcisi üyesi tarafından hazırlanır ve toplu sözleşme görüşmelerinin başlama tarihinden en az bir hafta önce Kamu İşveren Heyetine sunulmak üzere Devlet Personel Başkanlığına verilir. Toplu sözleşme görüşmelerinin başlangıcında Kamu İşveren Heyeti Başkanı ile Kamu Görevlileri Sendikaları Heyeti Başkanı, Devlet Personel Başkanlığına verilen talepler esas alınmak suretiyle genel ve hizmet koluna ilişkin toplu sözleşme görüşme gündemini belirler. Toplu sözleşme görüşmeleri, genel ve hizmet kollarını ilgilendiren taleplerin topluca görüşülmesi suretiyle yürütülür. Birden fazla hizmet kolunu ilgilendiren hususlar, kamu görevlilerinin geneline yönelik konular arasında görüşülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu İşveren Heyeti Başkanının belirleyeceği kurum temsilcileri ile Kamu Görevlileri Sendikaları Heyetinin toplam sayısı onbeşi geçmemek üzere belirleyeceği temsilciler, toplu sözleşme görüşmelerine teknik heyet olarak iştirak edebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Toplu sözleşme görüşmelerine, ağustos ayının ilk işgünü Kamu İşveren Heyeti Başkanınca belirlenen ve Kamu Görevlileri Sendikaları Heyetine dahil konfederasyonlara görüşmelerin başlamasından en az bir hafta önceden bildirilen yerde başlanır. Toplu sözleşme süreci, Kamu Görevlileri Hakem Kurulu kararının alınması da dahil olmak üzere en geç ağustos ayının son işgünü tamamlanır. Hafta sonu tatil günleri hariç olmak üzere resmî tatil günlerine rastlayan günlerde toplu sözleşme görüşmelerine ara verilir. Toplu sözleşme görüşmelerinin yürütülmesinde uygulanacak yöntem ve görüşme takvimi yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Toplu sözleşme görüşme süreci sonunda, kamu görevlilerinin geneline yönelik mali ve sosyal haklara ilişkin bölüm ile her bir hizmet koluna özgü mali ve sosyal haklara ilişkin bölümlerden ve tek metinden oluşan toplu sözleşme veya toplantı tutanağı imzalanır. Toplu sözleşmeye kurumsal hiyerarşiyi bozacak ve aynı veya benzer unvanlı kamu görevlilerinin mali ve sosyal hakları arasında kurumlar arası dengesizliğe yol açacak hükümler konulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>İmzalanan toplu sözleşme metinleri Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Toplu sözleşme görüşmelerine katılmaya yetkili hiçbir konfederasyon temsilcisinin toplu sözleşme görüşmelerine katılmaması veya toplu sözleşme görüşmelerinin uzlaşmazlıkla sonuçlanmasına rağmen tarafların Kamu Görevlileri Hakem Kuruluna başvurmaması halinde, kamu görevlilerine sonraki iki mali yıl boyunca uygulanacak mali ve sosyal haklar genel hükümlere göre belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="Mahalli idarelerde sözleşme imzalanması">
        <mvz-fıkra no="1">
          <template>27/6/1989 tarihli ve 375 sayılı Kanun Hükmünde Kararnamenin ek 15 inci maddesi hükümleri çerçevesinde sosyal denge tazminatının ödenmesine belediyelerde belediye başkanının teklifi üzerine belediye meclisince, il özel idaresinde valinin teklifi üzerine il genel meclisince karar verilmesi halinde, sözleşme döneminde verilecek sosyal denge tazminatı tutarını belirlemek üzere ilgili mahalli idarede en çok üyeye sahip sendikanın genel başkanı veya sendika yönetim kurulu tarafından yetkilendirilecek bir temsilcisi ile belediyelerde belediye başkanı, il özel idaresinde vali arasında toplu sözleşme sürecinin tamamlanmasını izleyen üç ay içerisinde sözleşme yapılabilir. Bu sözleşme bu Kanunun uygulanması bakımından toplu sözleşme sayılmaz ve bu kapsamda Kamu Görevlileri Hakem Kuruluna başvurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yapılacak sözleşme, toplu sözleşme dönemi ile sınırlı olarak uygulanır ve sözleşme süresi hiçbir şekilde izleyen mahalli idareler genel seçimi tarihini geçemez. Mahalli idareler genel seçim tarihini izleyen üç ay içerisinde de toplu sözleşme dönemiyle sınırlı olmak üzere sözleşme yapılabilir. Bu sözleşmeye dayanılarak yapılan ödemeler kazanılmış hak sayılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlgili mahalli idarenin; vadesi geçmiş vergi, sosyal güvenlik primi ile Hazine Müsteşarlığına olan borç toplamının gerçekleşen en son yıl bütçe gelirlerinin yüzde onunu aşması, ödeme süresi geçtiği halde ödenmemiş aylık ve ücret borcu bulunması veya gerçekleşen en son yıla ilişkin toplam personel giderinin, gerçekleşen en son yıl bütçe gelirlerinin belediyelerde yüzde otuzunu, il özel idaresinde yüzde yirmibeşini aşması hallerinde bu madde kapsamında sözleşme yapılamaz. Sözleşmenin yapılmasından sonra bu koşulların oluşması durumunda mevcut sözleşme kendiliğinden hükümsüz kalır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Uyuşmazlıkların Çözüm Usulleri">
      <mvz-madde no="33" başlık="Uyuşmazlık hali">
        <mvz-fıkra no="1">
          <template>Toplu sözleşme görüşme süreci sonunda toplu sözleşme imzalanamaması halinde, üzerinde uzlaşılan ve uzlaşılamayan konuları içeren toplantı tutanağı, tutanağın kamu görevlilerinin geneline yönelik bölümü Kamu Görevlileri Sendikaları Heyeti Başkanı ve hizmet kollarına yönelik bölümleri ilgili sendika temsilcisi ile Kamu İşveren Heyeti Başkanı tarafından imzalanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Toplu sözleşme görüşmelerinin uzlaşmazlıkla sonuçlanması ve toplantı tutanağı imzalanamaması halinde Devlet Personel Başkanlığı tarafından görüşmelerin uzlaşmazlıkla sonuçlandığına dair tespit tutanağı tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Toplantı tutanağı imzalanmasından veya görüşmelerin uzlaşmazlıkla sonuçlandığının tespit tutanağı ile belirlenmesinden itibaren üç işgünü içerisinde sözleşmenin ilgili bölümlerini imzalamaya yetkili olanlar tarafından imzalamaya yetkili oldukları bölümler için Kamu Görevlileri Hakem Kuruluna başvurulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Toplu sözleşme kapsamına girmeyen konulara ilişkin olarak Kamu Görevlileri Hakem Kuruluna başvurulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="34" başlık="Kamu Görevlileri Hakem Kurulu">
        <mvz-fıkra no="1">
          <template>Kamu Görevlileri Hakem Kurulu her toplu sözleşme dönemi için;</template>
          <mvz-bent no="a">
            <template>Yargıtay, Danıştay ve Sayıştay Başkan, Başkanvekili, Başkan Yardımcısı veya Daire Başkanları arasından Cumhurbaşkanınca Başkan olarak seçilecek bir üye,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Cumhurbaşkanınca belirlenen bakanlıklar ile kamu kurum ve kuruluşlarından dört üye,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bağlı sendikaların üye sayısı itibarıyla en fazla üyeye sahip konfederasyon tarafından belirlenecek iki, bağlı sendikaların üye sayısı açısından ikinci ve üçüncü sırada bulunan konfederasyonlardan birer üye,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Üniversitelerin kamu yönetimi, iş hukuku, kamu maliyesi, çalışma ekonomisi, iktisat ve işletme bilim dallarından en az Doçent unvanını taşıyanlar arasından Cumhurbaşkanınca seçilecek bir üye,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Bağlı sendikaların üye sayısı itibarıyla en fazla üyeye sahip konfederasyon tarafından üç, bağlı sendikaların üye sayısı açısından ikinci ve üçüncü sırada bulunan konfederasyonlar tarafından ikişer olmak üzere (d) bendinde belirtilen bilim dallarından en az Doçent unvanını taşımak kaydıyla, önerilecek toplam yedi öğretim üyesi arasından Cumhurbaşkanınca seçilecek bir üye,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>olmak üzere onbir üyeden oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkranın (b) bendi gereğince belirlenen üyeler, konfederasyonlarca belirlenen üyeler ile öğretim üyeleri, toplu sözleşme görüşmelerinin başlamasından iki hafta önce Kamu Görevlileri Hakem Kurulunun sekretaryasına bildirilir. Kamu Görevlileri Hakem Kurulunun Başkan ve diğer üyeleri, toplu sözleşme görüşmeleri başlamadan önce belirlenir. Kamu Görevlileri Hakem Kurulu Başkanı ve her bir üyesi için aynı usul ve esaslar çerçevesinde birer yedek üye görevlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu Görevlileri Hakem Kurulu, Başkanın çağrısı üzerine Başkan dahil en az sekiz üyenin katılımı ile toplanır. Mazereti nedeniyle toplantıya katılamayacak üyelerin yerine yedekleri çağrılır. Çalışma programı, toplantı gündemi, toplantı veya tespit tutanağının inceleme usul ve esasları ile toplantıya ilişkin diğer hususlar Başkan tarafından belirlenir. Kamu Görevlileri Hakem Kurulu, tarafların başvuru tarihinden itibaren beş gün içinde kararını verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kamu Görevlileri Hakem Kurulu, toplantıya katılanların çoğunluğu ile karar alır. Kurul üyeleri çekimser oy kullanamazlar. Oyların eşitliği halinde Başkanın bulunduğu taraf çoğunluğu sağlamış sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Karara katılmayan üyeler, ayrı ayrı veya birlikte, karşı oy şerhini ve gerekçesini tutanağa yazdırır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kurul kararları kesindir ve toplu sözleşme hükmündedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kurul kararları taraflara üç gün içerisinde yazılı olarak bildirilir ve Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Her toplantı günü için toplantıya katılan Kamu Görevlileri Hakem Kurulu Başkanına (5000), üyelere (4500) gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak miktarda toplantı ücreti ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Kamu Görevlileri Hakem Kurulunun sekretarya hizmetleri Cumhurbaşkanı tarafından belirlenecek Cumhurbaşkanı yardımcısı veya bakanlık tarafından yürütülür. Toplu sözleşme görüşmeleri ile Kamu Görevlileri Hakem Kurulu çalışmalarına katılacak olanların ağırlama, konaklama, yolluk ve gündelikleri ile diğer her türlü giderleri sekretarya hizmetlerini yürüten kurum bütçesine konulacak ödenekten karşılanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Uyuşmazlığın tespiti, çözümü ve Uzlaştırma Kurulu">
      <mvz-madde no="35" başlık="" durum="mülga">
      </mvz-madde>
    </mvz-bölüm>
