  <mvz-kısım no="7-YEDİNCİ" başlık="Çeşitli, Geçici ve Son Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Çeşitli Hükümler">
      <mvz-madde no="36" başlık="Sendika ve konfederasyonların katılma ve birleşmesi">
        <mvz-fıkra no="1">
          <template>Genel Kurul kararıyla sendikaların başka bir sendikaya veya konfederasyonların başka bir konfederasyona katılması halinde katılan sendika veya konfederasyonun bütün hak, borç, yetki ve menfaatleri katıldığı sendika veya konfederasyona kendiliğinden geçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birleşen sendika veya konfederasyonların bütün hak, borç, yetki ve menfaatleri birleşme sonucu meydana getirdikleri yeni tüzel kişiliğe kendiliğinden geçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu madde hükümleri gereğince katılan veya birleşen sendika ve konfederasyonların üyeleri, ayrı bir işleme gerek olmaksızın devralan veya yeni kurulan sendika veya konfederasyonun üyesi olurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birleşme ile ilgili diğer usul ve esaslar sendika veya konfederasyonların tüzüklerinde gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="Kapatma">
        <mvz-fıkra no="1">
          <template>Anayasada belirtilen Cumhuriyetin niteliklerine ve demokratik esaslara aykırı faaliyetlerde bulunan sendika ve konfederasyon, merkezlerinin bulunduğu yer Cumhuriyet Başsavcısının istemi üzerine iş davalarına bakmakla görevli mahallî mahkeme kararı ile kapatılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıdaki fıkraya aykırı hareket eden sendika şubesi, sendika ve konfederasyonlar hakkında 2908 sayılı Dernekler Kanununun 54 üncü maddesi uyarınca işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="Ceza hükümleri">
        <mvz-fıkra no="1">
          <template>Bu Kanunun;</template>
          <mvz-bent no="a">
            <template>20, 24 ve 26 ncı maddelerinde yer alan hükümlere aykırı hareket edenler, altı aydan bir yıla kadar hapis cezası,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>8, 14, 16 ve 17 nci maddelerinde yer alan hükümlere aykırı hareket eden kişiler, elli günden az olmamak üzere adlî para cezası,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>ile cezalandırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="Faaliyetin durdurulmasında kayyım tayini">
        <mvz-fıkra no="1">
          <template>Faaliyeti durdurulan sendika veya konfederasyonun mallarının idaresi, menfaatlerinin korunması ve durdurma süresi sonunda yeniden faaliyete geçebilmesi için genel kurul yapılması, Medenî Kanun hükümleri gereğince tayin olunacak bir veya üç kayyım tarafından sağlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="40" başlık="Fesih, infisah ve kapatma halinde malların devri">
        <mvz-fıkra no="1">
          <template>Fesih, infisah ve kapatma hallerinde, mal varlıkları 2821 sayılı Sendikalar Kanununun 46 ncı maddesindeki hükümler çerçevesinde tasfiye edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, tasfiye sonucunda kalacak para ve mallar, ilgili sendika veya konfederasyonun tüzüğünde aksine bir hüküm bulunmadığı takdirde Hazineye devredilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="41" başlık="Yönetmelikler">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanması bakımından;</template>
          <mvz-bent no="a">
            <template>Kurumların girecekleri hizmet kolları,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Sendika ve konfederasyon üyeliklerine başvuru belgeleri ile çekilme bildirimlerinin şekli ve içereceği bilgiler,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kamu Personeli Danışma Kurulu ve Kamu Görevlileri Hakem Kurulunun çalışma usul ve esasları, toplu sözleşme görüşmelerinin yapılma usul ve esasları ile bu Kanunun uygulanmasını göstermek üzere ihtiyaç duyulacak diğer hususlar,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Sendika üye sayıları ve bunların bağlı bulundukları konfederasyonların belirlenmesine ilişkin usul ve esaslar,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Sendika ve konfederasyonların tutacakları defterler, tasdik şekli ve kayıtların düzenlenme usul ve esasları,</template>
          </mvz-bent>
          <mvz-bent no="f" durum="mülga">
            <template></template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanunun yayımı tarihinden itibaren dört ay içinde, kamu görevlileri sendikaları konfederasyonlarının da görüşleri alınmak suretiyle Maliye Bakanlığı, Çalışma ve Sosyal Güvenlik Bakanlığı ile Devlet Personel Başkanlığınca birlikte hazırlanacak yönetmeliklerle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="42" başlık="Uygulamanın izlenmesi">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanmasında;</template>
          <mvz-bent no="a">
            <template>Kamu görevlileri sendika ve konfederasyonlarının kuruluşu, yetkili organlarının oluşumu ve bu organların çalışma usulleri ile görevleri, sendika ve konfederasyonların tüzel kişi olarak hak ve yükümlülükleri ve faaliyetleri gibi konularda karşılaşılacak sorunları gidermeye Çalışma ve Sosyal Güvenlik Bakanlığı,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Personel konularına ilişkin olarak karşılaşılacak sorunları Maliye Bakanlığı ile Çalışma ve Sosyal Güvenlik Bakanlığının görüşlerini alarak gidermeye Devlet Personel Başkanlığı,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Maliye Bakanlığı, Çalışma ve Sosyal Güvenlik Bakanlığı ve Devlet Personel Başkanlığı yukarıda belirtilen hususlar ile ihtiyaç duyulacak diğer hususlarda bu kurumlardan birinin talebi üzerine ortak çalışma yapabilirler. Bu çalışmalara Kamu Personeli Danışma Kuruluna temsilci gönderen kamu görevlileri sendikaları konfederasyonunun temsilcileri de davet edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="43" başlık="Diğer kanunların uygulanması">
        <mvz-fıkra no="1">
          <template>Bu Kanunda hüküm bulunmayan hallerde 2821 sayılı Sendikalar Kanunu, 2908 sayılı Dernekler Kanunu, 743 sayılı Türk Medeni Kanunu ile sendika ve konfederasyonlarda görev alacaklar hakkında kamu görevlilerinin tabi oldukları personel kanunlarının ilgili hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="44" başlık="Değiştirilen kanun hükmü">
        <mvz-fıkra no="1">
          <template>(11/4/2001 tarihli ve 4641 sayılı Ekonomik ve Sosyal Konseyin Kuruluşu, Çalışma Esas ve Yöntemleri Hakkında Kanunun 2 nci maddesi ile ilgili olup yerine işlenmiştir.)</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Geçici ve Son Hükümler">
      <mvz-madde no="1" başlık="Ödenek tahsisi" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanun gereğince yapılacak harcamalar için Maliye Bakanlığı bütçesinin transfer tertibinden Çalışma ve Sosyal Güvenlik Bakanlığı bütçesinin ilgili tertiplerine yeterli miktarda ödenek aktarılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Kadro tahsisi" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunla getirilen hizmetlerin yürütülebilmesi için, Çalışma ve Sosyal Güvenlik Bakanlığı merkez teşkilatında kullanılmak üzere ekli (1) sayılı cetvelde yer alan kadrolar ihdas edilerek 190 sayılı Kanun Hükmünde Kararnameye bağlı cetvellerin adı geçen Bakanlığa ait bölümüne eklenmiştir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yürürlüğe girmesini müteakip kurulacak sendikalardan üye sayıları, ulaşım hizmetleri, bayındırlık, inşaat ve köy hizmetleri ile bankacılık ve sigorta hizmetleri hizmet kollarında 1500, enerji, sanayi ve madencilik hizmetleri ile tarım ve ormancılık hizmetleri hizmet kollarında 3000, basın yayın ve iletişim hizmetleri ile yerel yönetim hizmetleri hizmet kollarında 4000, büro hizmetleri ile sağlık ve sosyal hizmetler hizmet kollarında 10 000, eğitim, öğretim, bilim ve kültür hizmetleri hizmet kolunda 18 000 ve daha fazla olduğu ve konfederasyonlardan kendi içindeki sendikalarda bulunan kamu görevlisi üye sayısı 35 000 ve daha fazla olduğu Çalışma ve Sosyal Güvenlik Bakanlığınca belirlenerek Resmî Gazetede yayımlananlar bakımından, bu Kanunun 25 inci maddesinin birinci fıkrasında yer alan yüzde beş oranı, 2002 yılında toplu görüşme yapmaya yetkili kamu görevlileri sendikaları ve bu sendikaların bağlı oldukları konfederasyonlar belirleninceye kadar geçecek süre içinde uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıdaki fıkra uyarınca Resmî Gazetede yayımlanacak belirlemeden sonra ilgililerin aylıksız izinli geçen sürelerine ilişkin aylık ve özlük hakları kendilerine ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Konusu suç teşkil etmemek ve kesinleşmiş bir yargı kararına müstenit olmamak üzere, bu Kanunun yayımı tarihine kadar, memur temsilcileri ile toplu iş sözleşmesi akdetmeleri nedeniyle kamu görevlileri haklarında idarî, malî veya adlî takibat yapılmaz, başlatılanlar işlemden kaldırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 41 inci maddesinin (a), (b) ve (e) bentlerinde belirtilen yönetmelikler, Kanunun yürürlüğe girmesini izleyen otuz gün içinde yürürlüğe konulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yayımı tarihinde faaliyette bulunan kamu görevlileri kuruluşları, bu Kanunun yürürlüğe girmesinden itibaren sekiz ay içinde;</template>
          <mvz-bent no="a">
            <template>Mevcut tüzüklerine göre olağanüstü genel kurullarını yaparak, tüzük ve örgütlenmelerini bu Kanun hükümlerine göre düzenlemek,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yeni örgüt ve tüzüklerine göre ilk olağan genel kurullarını da yapmak zorundadırlar.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Belirlenen süre içerisinde, bu Kanuna uygun olarak yeni tüzüklerini düzenlememiş ve ilk olağan genel kurullarını yapmamış kuruluşlar bu Kanunda tanımlanan sendikaların hak ve yetkilerini kullanamazlar.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bu Kanunun yayımından sonra tüzüklerini bu Kanuna uyduran sendikalar tüm üyelik belgelerini bu Kanuna göre çıkarılacak yönetmelik hükümlerine uygun olarak yeniden düzenleyerek birer örneğini olağan genel kurul tarihinden itibaren iki ay içinde Çalışma ve Sosyal Güvenlik Bakanlığına göndermek zorundadırlar.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Hizmet kollarına göre yetkili sendikalar belirleninceye kadar oran şartı aranmaksızın üyelik aidatlarının kaynaktan kesilmesine devam edilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yürürlüğe girmesinden itibaren faaliyette bulunan kamu görevlileri sendikaları ile konfederasyon yöneticilerinin yetkili sendikalar belirlenene kadar özlük haklarının ödenmesine devam edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yürürlüğe girdiği tarihte kurulu bulunan kamu görevlileri sendikaları, genel kurul kararı ile mal varlıklarını, hak ve borçlarını her hangi bir sendika, konfederasyon veya Bakanlar Kurulunca kamu yararına çalıştığı belirlenen kuruluşlara üç ay içerisinde devredebilirler. Devir ve intikal işlemleri her türlü vergi, resim ve harçtan muaftır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>2004 yılı için;</template>
          <mvz-bent no="a">
            <template>30 uncu maddenin ikinci fıkrasının (a) bendinde öngörülen tespit, 15 Temmuz 2004 tarihi itibarıyla gerçekleştirilerek 20 Temmuz 2004 tarihine kadar Çalışma ve Sosyal Güvenlik Bakanlığına gönderilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>30 uncu maddenin ikinci fıkrasının (b) bendi gereğince Çalışma ve Sosyal Güvenlik Bakanlığınca yapılacak tespit ise 30 Ağustos 2004 tarihine kadar Resmî Gazetede yayımlanır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>32 nci maddenin birinci fıkrasındaki "Ağustos ayının onbeşinci günü", "Eylül ayının onbeşinci günü" olarak uygulanır.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Tüzük değişikliği" tür="Geçici">
        <mvz-fıkra no="1">
          <template>İlgili sendika tüzüklerinde bu maddenin yayımından önce farklı yöntemlerle belirlenmiş olan ödenti tutarları, ilk genel kurulda tüzük değişikliği yapılmak kaydıyla, sendika yönetim kurulu tarafından bu maddenin yayımı tarihinden itibaren en geç bir ay içinde bu Kanuna uygun olarak yeniden düzenlenir ve Maliye Bakanlığına bildirilir; bildirim tarihini takip eden aybaşından itibaren üyelik ödentilerinin hesaplanmasında uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>2012 ve 2013 yıllarına ilişkin mali ve sosyal hakları belirlemek üzere yapılacak toplu sözleşme görüşmelerine, bu maddenin yürürlüğe girdiği tarihten itibaren bir ay içerisinde başlanır. Kamu Görevlileri Sendikaları Heyet üyelerinin bildirimi, toplu sözleşme tekliflerinin verilmesi ve görüşmelerin başlama tarihinin bildirimi ile Kamu Görevlileri Hakem Kurulu üyelerinin belirlenmesine ilişkin 29, 31 ve 34 üncü maddelerde öngörülen süreler dikkate alınmaz. Bu toplu sözleşme görüşmelerine katılacak sendika ve konfederasyonların belirlenmesinde 7/7/2011 tarihli ve 27987 sayılı Resmî Gazetede yayımlanan 4688 sayılı Kamu Görevlileri Sendikaları Kanunu Gereğince Kamu Görevlileri Sendikaları ile Konfederasyonların Üye Sayılarına İlişkin 2011 Temmuz İstatistikleri Hakkında Tebliğ hükümleri esas alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>30 uncu maddenin ikinci fıkrasının (a) bendinde öngörülen tespit 2012 yılı için 15 Haziran 2012 tarihi esas alınarak gerçekleştirilir ve en geç 29 Haziran 2012 tarihine kadar Çalışma ve Sosyal Güvenlik Bakanlığına gönderilir. Aynı fıkranın (b) bendi uyarınca yapılacak tespit ise 15 Haziran 2012 tarihi esas alınarak yapılır ve 10 Ağustos 2012 tarihine kadar Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>41 inci maddenin birinci fıkrasının (c) bendinde belirtilen yönetmelik bir ay içinde yürürlüğe konulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>15/3/2012 tarihinden önce 375 sayılı Kanun Hükmünde Kararnamenin ek 15 inci maddesi kapsamındaki idareler ile ilgili sendikalar arasında toplu iş sözleşmesi, toplu sözleşme, sosyal denge sözleşmesi ve benzeri adlar altında imzalanan sözleşmelerin uygulanmasına, söz konusu sözleşmelerde öngörülen sürelerin sonuna kadar devam edilebilir. Anılan sözleşmelerin uygulanmasına devam edildiği dönem için 32 nci madde hükümleri çerçevesinde ayrıca sözleşme yapılamaz. Söz konusu sözleşmeleri 31/12/2015 tarihinden önce sona eren veya mevcut sözleşmeleri bu maddenin yürürlüğe girdiği tarihten sonra karşılıklı olarak feshedilen kapsama dahil idareler, sözleşmelerinin sona eriş veya fesih tarihini izleyen bir ay içinde sözleşmelerin sona erdiği veya feshedildiği tarih ile bu Kanunda öngörülen toplu sözleşme dönemi sonuna kadarki dönemle sınırlı olmak üzere üçüncü fıkra hükümleri dikkate alınmaksızın 32 nci madde hükümleri çerçevesinde sözleşme yapabilir. Ancak 32 nci madde uyarınca toplu sözleşmede belirlenen tavan tutarın, unvanlar itibarıyla ilgili personele söz konusu sözleşmeler uyarınca yapılmakta olan ortalama aylık ödemenin altında kalması halinde; üçüncü fıkra hükümleri dikkate alınmaksızın 32 nci madde hükümleri esas alınarak 31/12/2015 tarihine kadar uygulanabilecek sözleşmelerde bu maddenin yürürlüğe girdiği tarihte uygulanan sözleşme uyarınca unvanlar itibarıyla ilgili personele ödenen ortalama aylık tutar tavan olarak esas alınabilir. Bu şekilde yapılacak ödemeler kazanılmış hak sayılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Konusu suç teşkil etmemek ve kesinleşmiş bir yargı kararına müstenit olmamak kaydıyla, 15/3/2012 tarihine kadar, memur temsilcileri ile toplu iş sözleşmesi akdederek veya başka bir tasarrufta bulunarak 375 sayılı Kanun Hükmünde Kararnamenin ek 15 inci maddesi kapsamındaki idarelerde çalışan kamu personeline her ne ad altında olursa olsun ek ödemede bulunmaları nedeniyle kamu görevlileri hakkında idari veya mali takibat ve yargılama yapılamaz, başlatılanlar işlemden kaldırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="" tür="Geçici" durum="iptal">
      </mvz-madde>
      <mvz-madde no="16" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Konusu suç teşkil etmemek kaydıyla; bu maddenin yürürlük tarihine kadar bu Kanun veya 375 sayılı Kanun Hükmünde Kararnamenin ek 15 inci maddesi hükümlerine aykırı olarak sosyal denge tazminatı ödediği tespit edilen il özel idareleri, belediyeler, büyükşehir belediyeleri ve bağlı kuruluşları ile bunların üyesi olduğu mahalli idare birliklerinin yetkili veya görevli olan sorumluları hakkında yapılan bu ödemeler nedeniyle idari veya mali yargılama ve takibat yapılamaz; başlamış olanlar işlemden kaldırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Konusu suç teşkil etmemek kaydıyla; bu Kanun hükümleri uyarınca imzalanan toplu sözleşmeler ve Kamu Görevlileri Hakem Kurulu kararlarındaki usul ve esaslara aykırı olarak 31/5/2025 tarihine kadar kamu görevlilerine giyim yardımı, kıyafet yardımı, koruyucu giyim yardımı, koruyucu giyim malzemesi ve koruyucu donanım malzemesi yardımı yapan kamu kurum ve kuruluşlarının yetkili veya görevli olan sorumluları hakkında idari ve/veya mali takibat ve yargılama yapılamaz, başlamış olanlar işlemden kaldırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="45" başlık="Yürürlük">
        <mvz-fıkra no="1">
          <template>Bu Kanun yayımını takip eden 30 uncu günün sonunda yürürlüğe girer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="46" başlık="Yürütme">
        <mvz-fıkra no="1">
          <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
