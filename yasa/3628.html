  <mvz-künye tür="kanun" no="3628" başlık="MAL BİLDİRİMİNDE BULUNULMASI, RÜŞVET VE YOLSUZLUKLARLA MÜCADELE KANUNU"
             tarih="19.4.1990" rgazete-tarih="4.5.1990 " rgazete-sayı="20508"
             düstur-tertip="5" düstur-cilt="29" düstur-sayfa="95" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, rüşvet ve yolsuzluklarla mücadele cümlesinden olarak; bu Kanunda sayılanların mal bildiriminde bulunmalarını, bildirimlerin yenilenmesini, mal edinmelerin denetimiyle, haksız mal edinme veya gerçeğe aykırı bildirimde bulunma halinde uygulanacak hükümleri, bu Kanunda belirlenen suçlarla bazı suçlardan dolayı kamu görevlileri ve suç ortakları hakkında takip ve muhakeme usulünü düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Mal bildiriminde bulunacaklar">
      <mvz-fıkra no="1">
        <template>Fıkra</template>
        <mvz-bent no="a">
          <template>Her tür seçimle iş başına gelen kamu görevlileri ile Cumhurbaşkanı yardımcıları ve bakanlar (Muhtarlar ve ihtiyar heyeti üyeleri hariç)</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Noterler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Türk Hava Kurumunun genel yönetim ve merkez denetleme kurulu üyeleri ile genel merkez teşkilatında ve Türk Kuşu Genel Müdürlüğünde, Türkiye Kızılay Derneğinin merkez kurullarında ve Genel Müdürlük teşkilatında görev alanlar ve bunların şube başkanları,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Genel ve katma bütçeli daireler, il özel idareleri, belediyeler ve bunlara bağlı kuruluş veya alt kuruluşlarda, kamu iktisadi teşebbüsleri (İktisadi devlet teşekkülleri ve kamu iktisadi kuruluşları) ile bunlara bağlı müessese, bağlı ortaklık ve işletmelerde, özel kanunlarla veya Cumhurbaşkanlığı kararnamesiyle kurulan ve kamu hizmeti gören kurum ve kuruluşlar ile bunların alt kuruluşlarında veya komisyonlarında aylık, ücret ve ödenek almak suretiyle kamu hizmeti gören memurları, işçi niteliği taşımayan diğer kamu görevlileri ile yönetim ve denetim kurulu üyeleri,</template>
        </mvz-bent>
        <mvz-bent no="e"  durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Siyasi parti genel başkanları, vakıfların idare organlarında görev alanlar, kooperatiflerin ve birliklerinin başkanları, yönetim kurulun üyeleri ve genel müdürleri, yeminli mali müşavirler, kamu yararına sayılan dernek yönetici ve deneticileri,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Gazete sahibi gerçek kişiler ile, gazete sahibi şirketlerin yönetim ve denetim kurulu üyeleri, sorumlu müdürleri, başyazarları ve fıkra yazarları,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Mal bildiriminde bulunmak zorundadırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Özel Kanunlarına göre mal bildiriminde bulunmak zorunda olanlar da bu Kanun hükümlerine tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Hediye">
      <mvz-fıkra no="1">
        <template>Yukarıdaki maddede sayılan kamu görevlileri, milletlerarası protokol, mücamele veya nezaket kaideleri uyarınca veya diğer herhangi bir sebeple, yabancı devletlerden, milletlerarası kuruluşlardan, sair milletlerarası hukuk tüzelkişiliklerinden, Türk uyruğunda olmayan herhangi bir özel veya tüzelkişi veya kuruluştan; aldıkları tarihteki değeri on aylık net asgari ücret toplamını aşan hediye veya hibe niteliğindeki eşyayı aldıkları tarihten itibaren bir ay içinde kendi kurumlarına teslim etmek zorundadırlar. Ancak, yabancı devlet adamları ve milletlerarası kuruluş temsilcileri tarafından verilen imzalı hatıra fotoğraflarının çerçeveleri bu madde hükümlerine dahil değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hediyelerin bedellerinin tespiti çıkarılacak yönetmeliğe göre Maliye ve Gümrük Bakanlığınca yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Haksız mal edinme">
      <mvz-fıkra no="1">
        <template>Kanuna veya genel ahlaka uygun olarak sağlandığı ispat edilmeyen mallar veya ilgilinin sosyal yaşantısı bakımından geliriyle uygun olduğu kabul edilemeyecek harcamalar şeklinde ortaya çıkan artışlar, bu Kanunun uygulanmasında haksız mal edinme sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Mal Bildirimleri">
    <mvz-madde no="5" başlık="Bildirimlerin konusu">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren görevlilerin kendilerine, eşlerine ve velayetleri altındaki çocuklarına ait bulunan taşınmaz malları ile görevliye yapılan aylık net ödemenin, ödeme yapılmayan görevlilerin ise, 1 inci derece Devlet Memurlarına yapılan aylık net ödemenin beş katından fazla tutarındaki her biri için ayrı olmak üzere, para, hisse senetleri ve tahviller ile altın, mücevher ve diğer taşınır malları, hakları, alacakları ve gelirleriyle bunların kaynakları, borçları ve sebepleri mal bildiriminin konusunu teşkil eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Bildirimin zamanı">
      <mvz-fıkra no="1">
        <template>Mal Bildirimlerinin;</template>
        <mvz-bent no="a">
          <template>Bu Kanun kapsamındaki göreve atanmada, göreve giriş için gerekli belgelerle,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Cumhurbaşkanı yardımcısı veya bakan olarak atanmalarda, atamayı izleyen bir ay içinde,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Seçimle gelinen görevlerde seçimin kesinleşmesi tarihini izleyen iki ay içinde,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Mal varlığında önemli bir değişiklik olduğunda bir ay içinde,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Yönetim ve denetim kurulu üyelikleri ile komisyon üyeliklerine seçim ve atamalarda göreve başlama tarihini izleyen bir ay içinde,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Görevin sona ermesi halinde, ayrılma tarihini izleyen bir ay içinde,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Gazete sahibi gerçek kişiler ile, gazete sahibi şirketlerin yönetim ve denetim kurulu üyeleri faaliyete geçme tarihini, sorumlu müdürleri, başyazarları ve fıkra yazarları bu işe veya görevlerine başlama tarihini izleyen bir ay içinde,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Verilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(a) Bendinde yazılı bildirim verilmedikçe göreve atama yapılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Bildirimin yenilenmesi">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki görevlere devam edenler, sonu (0) ve (5) ile biten yılların en geç şubat ayı sonuna kadar bildirimlerini yenilerler. Yeni bildirimler yetkili merci tarafından daha önceki bildirimler ile karşılaştırılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Bildirimlerin verileceği merciler">
      <mvz-fıkra no="1">
        <template>Bildirimlerin verileceği merciler şunlardır:</template>
        <mvz-bent no="a">
          <template>Türkiye Büyük Millet Meclisi Üyeleri için Türkiye Büyük Millet Meclisi Başkanlığı, Cumhurbaşkanı yardımcıları ve bakanlar için Cumhurbaşkanlığı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu kurum ve kuruluşlarında görevli personel için özlük işleriyle ilgili sicil ve belge raporlarının bulunduğu makam veya merci,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kurum, teşebbüs, teşekkül ve kuruluşların Genel Müdürleri, yönetim ve denetim kurulu için ilgili Bakanlık,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yüksek mahkemelerin daire başkan ve üyeleri için mahkemenin başkanı,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Noterler için Adalet Bakanlığı,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Diğer kurum ve kuruluşların memur ve hizmetlileri için atamaya yetkili makam veya merci,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Türk Hava Kurumu ile Türkiye Kızılay Derneğinde görev alanlar için kurum ve dernek genel başkanlığı,</template>
        </mvz-bent>
        <mvz-bent no="h" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Görevlerinden ayrılanlar için bu görevlerinde iken bildirimlerinin vermeleri gereken makam veya merci,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Siyasi parti genel başkanları için Yargıtay Cumhuriyet Başsavcılığı,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Kooperatifler ve birliklerin başkanları, yönetim kurulu üyeleri ve genel müdürleri için kooperatiflerin ve birliklerin denetimlerinin yapıldığı kuruluşlar,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Yeminli mali müşavirler için Maliye ve Gümrük Bakanlığı,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Türk Hava Kurumunun, Türkiye Kızılay Derneğinin ve Kamu yararına sayılan derneklerin genel yönetim ve merkez denetleme kurulu üyeleri için İçişleri Bakanlığı, bunların şube başkanları için bulundukları İl Valilikleri,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>İl Genel Meclisi Üyeleri için Valiler, Belediye Meclis Üyeleri için Belediye Başkanları, Belediye Başkanları için İçişleri Bakanlığı,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Mal bildirimi verecek son merciler için, kendi kuruluşlarının özlük işleri ile ilgili makam veya merci,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>Gazete sahibi gerçek kişiler ile, gazete sahibi şirketlerin yönetim ve denetim kurulu üyeleri, sorumlu müdürleri, başyazarları ve fıkra yazarları bulundukları yer en büyük mülki amirliği,</template>
        </mvz-bent>
        <mvz-bent no="r">
          <template>Vakıfların idare organlarında görev alanlar için Vakıflar Genel Müdürlüğü,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Görevleri sebebiyle birden fazla mal bildiriminde bulunması gerekenler asli görevlerinden dolayı bir tek mal bildiriminde bulunurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Bildirimlerin gizliliği">
      <mvz-fıkra no="1">
        <template>Mal bildirimleri, özel kanunlardaki hükümler saklı kalmak kaydıyla bildirimde bulunanın özel dosyasında saklanır. Bildirimlerin içeriği hakkında, 20 nci madde hükmü dışında hiçbir şekilde açıklama yapılamaz ve bilgi verilemez. Ayrıca mal bildirimlerindeki bilgiler ve kayıtlar esas alınarak içeriği hakkında yayında bulunulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, Kamu Görevlileri Etik Kurulu mal bildirimlerini gerektiğinde inceleme yetkisine sahiptir. Mal bildirimlerindeki bilgilerin doğruluğunun kontrolü amacıyla ilgili kişi ve kuruluşlar  talep edilen bilgileri en geç otuz gün içinde Kurula vermekle yükümlüdürler.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Ceza Hükümleri">
    <mvz-madde no="10" başlık="">
      <mvz-fıkra no="1">
        <template>6 ncı maddede belirtilen sürelerde mal bildiriminde bulunmayana bildirimlerin verileceği mercilerce ihtarda bulunulur. İhtarın kendisine tebliğinden itibaren otuz gün içinde mazeretsiz olarak bildirimde bulunmayana üç aya kadar hapis cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Soruşturma ile ilgili olarak verilen süre zarfında mal bildiriminde bulunmayana üç aydan bir yıla kadar hapis cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Gerçeğe aykırı açıklama">
      <mvz-fıkra no="1">
        <template>Mal bildiriminin muhtevası hakkında 9 uncu maddeye aykırı davranan üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu fiilin basın yoluyla işlenmesi halinde verilecek ceza yarı oranında artırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Gerçeğe aykırı bildirimde bulunma">
      <mvz-fıkra no="1">
        <template>Kanunen daha ağır bir cezayı gerektirmediği takdirde gerçeğe aykırı bildirimde bulunana altı aydan üç yıla kadar hapis cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Haksız mal edinme, mal kaçırma veya gizleme">
      <mvz-fıkra no="1">
        <template>Kanunun daha ağır bir cezayı gerektirmediği takdirde haksız mal edinene üç yıldan beş yıla kadar hapis ve beş milyon liradan on milyon liraya kadar ağır para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Haksız edinilen malı kaçıran veya gizleyene de aynı ceza verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Zoralım">
      <mvz-fıkra no="1">
        <template>Haksız edinilmiş olan malların zoralımına hükmolunur. Bu malların elde edilememesi veya bir malın tümünün haksız mal edinme konusu teşkil etmemesi sebepleri ile zoralımın mümkün olmadığı hallerde haksız edinilen değere eşit bedelinin hazineye ödenmesine karar verilir. Bu bedel, Amme Alacaklarının Tahsil Usulü Hakkında Kanun Hükümlerine göre tahsil olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Kamu hizmetlerinden yasaklanma">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 11 ve 12 nci maddeler hükümleri ile cezalandırılanlara ceza süresi kadar; 13 üncü madde hükmüne göre cezalandırılanlara müebbeten kamu hizmetlerinden yasaklanma cezası hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Tecil, paraya çevirme ve ön ödeme yasağı">
      <mvz-fıkra no="1">
        <template>Bu bölümde yazılı olan cezalar 10 uncu maddenin birinci fıkrası hariç tecil edilemez, şahsi hürriyeti bağlayıcı olanlar para veya tedbire çevrilemez, failleri hakkında Türk Ceza Kanununun 119 uncu maddesi hükümleri uygulanamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Bu Kanunda Yazılı Suçlar ile Bazı Suçlardan Dolayı Soruşturma Usulü">
    <mvz-madde no="17" başlık="Soruşturma">
      <mvz-fıkra no="1">
        <template>Bu Kanunda ve 18.6.1999 tarihli ve 4389 sayılı Bankalar Kanununda yazılı suçlarla, irtikâp, rüşvet, basit ve nitelikli zimmet, görev sırasında veya görevinden dolayı kaçakçılık, resmî ihale ve alım ve satımlara fesat karıştırma, Devlet sırlarının açıklanması veya açıklanmasına sebebiyet verme suçlarından veya bu suçlara iştirak etmekten sanık olanlar hakkında 2.12.1999 tarihli ve 4483 sayılı Memurlar ve Diğer Kamu Görevlilerinin Yargılanması Hakkında Kanun hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıdaki fıkra hükmü müsteşarlar, valiler ve kaymakamlar hakkında uygulanamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Görevleri veya sıfatları sebebi ile özel soruşturma ve kovuşturma usulüne tabi olan sanıklarla ilgili kanun hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Suçun ihbarı">
      <mvz-fıkra no="1">
        <template>Yukarıdaki maddede yazılı suçlara ilişkin ihbarlar doğrudan Cumhuriyet Başsavcılıklarına yapılır. İhbar üzerine derhal bir ihbar tutanağı düzenlenir ve bir örneği muhbire verilir. Acele ve gecikmesinde sakınca umulan hallerde tutanak düzenlenmesi sonraya bırakılabilir. Muhbirlerin kimlikleri, rızaları olmadıkça açıklanmaz. İhbar asılsız çıktığında aleyhine takibat yapılanın istemi üzerine muhbirin kimliği açıklanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıdaki fıkraya göre yapılan ihbar veya takipsizlik kararı ve iddianame Cumhuriyet başsavcılığınca, ilgili kamu kurum veya kuruluşlarına bildirilir.  İlgili kamu kurum veya kuruluşları tarafından yazılı başvuruda bulunulması halinde bu kurum veya kuruluşlar, başvuru tarihinde müdahil sıfatını kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu suçlardan dolayı müfettiş ve muhakkikler de soruşturma neticesinde delil veya emare elde ettikleri takdirde, işi yetkili ve görevli Cumhuriyet Başsavcılığına ihbar ve evrakı tevdi ederler. Cumhuriyet Başsavcılığı müfettiş ve muhakkikler tarafından kendisine tevdiine lüzum görülmediği halde dahi evrakın taalluk ettiği iş hakkında soruşturma yapmak üzere gerekçe göstererek evrakı ait olduğu merciden isteyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>17 nci maddede yazılı suçlardan dolayı delil veya emare elde eden müfettiş ve muhakkikler durumu yetkili ve görevli Cumhuriyet Başsavcılığına ihbar ve evrakı tevdi etmedikleri takdirde bunlar hakkında da yapılacak takibattan dolayı Memurin Muhakematı Hakkında Kanunu Muvakkat Hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İhbar konusu müsnet suç hakkında dava açılıncaya kadar bilgi vermek ve yayın yapmak yasaktır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Soruşturma usulü">
      <mvz-fıkra no="1">
        <template>Cumhuriyet Savcısı 17 nci maddede yazılı suçların işlendiğini öğrendiğinde sanıklar hakkında doğrudan doğruya ve bizzat soruşturmaya başlamakla beraber durumu atamaya yetkili amirine veya 8 inci maddede sayılan mercilere bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cumhuriyet Savcısı soruşturmaya başladığında ihbarı doğrulayan emareler bulduğu takdirde sanıktan, haksız edinilen malın kaçırıldığı yolunda delil ve emare elde edildiği takdirde sanığın ikinci dereceye kadar kan ve sıhri hısımları ile gelini ve damadından mal bildiriminde bulunmalarını ister. Bu istemin sanığa ve diğer ilgililere ulaştığı tarihten itibaren yedi gün içinde Cumhuriyet Savcısına mal bildiriminin verilmesi zorunludur. Soruşturmanın müfettiş veya muhakkik tarafından yapılması halinde müfettiş veya muhakkik de sanıktan ve yukarıda sayılan ilgililerden mal bildirimi isteminde bulunurlar. Bu istemin sanık ve ilgililere ulaştığı tarihten itibaren yedi gün içinde müfettiş veya muhakkike mal bildiriminin verilmesi keza zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Cumhuriyet Savcısı, kamu davası açılmadan önce haksız edinildiği yolunda delil veya emare elde edilen para veya mal ile ilgili tedbirin alınmasını görevli mahkemeden veya para veya malın bulunduğu yer hukuk mahkemesinden isteyebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Bilgi verme zorunluluğu">
      <mvz-fıkra no="1">
        <template>Özel kanunlarında aksine bir hüküm bulunsa bile ilgili gerçek veya tüzel kişiler veya kamu kurum ve kuruluşları; bu Kanuna göre takip, soruşturma ve kovuşturmaya yetkili kişi ve bu Kanundaki diğer mercilerce istenen bilgileri gecikmeksizin makul sürede eksiksiz vermek zorundadır. Aksine davranan kişiler hakkında bir yıldan üç yıla kadar hapis cezası verilir. Bu ceza, para cezasına veya tedbirlerden birine çevrilemez ve ertelenemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Asker kişilerin soruşturması" durum="mülga">
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Çeşitli Hükümler">
    <mvz-madde no="22" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Mal bildiriminin şekli, düzenleniş biçimi, sayısı, neleri kapsayacağı ve merciine nasıl ulaştırılacağı hususları ile Kanunun uygulanması bakımından gerekli görülecek diğer konular, Cumhurbaşkanı tarafından çıkarılacak bir yönetmelikle düzenlenir ve bu yönetmelik Resmi Gazete'de yayımlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>9 Ağustos 1983 tarih ve 2871 sayılı Kamu Görevlileri ile ilgili Mal Bildirimi Kanunu ile bu Kanunun yürürlükten kaldırdığı Kanunlar ve 15.5.1930 tarih ve 1609 sayılı Bazı Cürümlerden Dolayı Memurlar ve Şerikleri Hakkında Takip ve Muhakeme Usulüne Dair Kanun yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihi takip eden bir ay içinde 2 nci maddede sayılanlar mal bildiriminde bulunurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mal bildiriminde bulunmayan veya gerçeğe aykırı beyanda bulunanlar hakkında üçüncü bölümdeki ceza hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 2 nci maddesinde sayılanlardan 22 nci maddeye müsteniden çıkartılacak yönetmeliğin yürürlüğe girdiği tarihe kadar 9 Ağustos 1983 tarih ve 2871 sayılı Kanuna göre hazırlanan beyannamenin alınmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce bu Kanunla kapsama yeni alınan suçlardan dolayı, Memurin Muhakematı Hakkında Kanunu Muvakkat Hükümlerine göre,kesinleşmiş lüzumu muhakeme veya meni muhakeme kararları hariç, yapılan tahkikat evrakı derhal ilgili Cumhuriyet Başsavcılıklarına gereği için tevdi olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
