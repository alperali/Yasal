  <mvz-bölüm no="1-BİRİNCİ" başlık="Tanım ve Terör Suçları">
    <mvz-madde no="1" başlık="Terör tanımı">
      <mvz-fıkra no="1">
        <template>Terör; cebir ve şiddet kullanarak; baskı, korkutma, yıldırma, sindirme veya tehdit yöntemlerinden biriyle, Anayasada belirtilen Cumhuriyetin niteliklerini, siyasî, hukukî, sosyal, laik, ekonomik düzeni değiştirmek, Devletin ülkesi ve milletiyle bölünmez bütünlüğünü bozmak, Türk Devletinin ve Cumhuriyetin varlığını tehlikeye düşürmek, Devlet otoritesini zaafa uğratmak veya yıkmak veya ele geçirmek, temel hak ve hürriyetleri yok etmek, Devletin iç ve dış güvenliğini, kamu düzenini veya genel sağlığı bozmak amacıyla bir örgüte mensup kişi veya kişiler tarafından girişilecek her türlü suç teşkil eden eylemlerdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="3" durum="mülga">
        <template></template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Terör suçlusu">
      <mvz-fıkra no="1">
        <template>Birinci maddede belirlenen amaçlara ulaşmak için meydana getirilmiş örgütlerin mensubu olup da, bu amaçlar doğrultusunda diğerleri ile beraber veya tek başına suç işleyen veya amaçlanan suçu işlemese dahi örgütlerin mensubu olan kişi terör suçlusudur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Terör örgütüne mensup olmasa dahi örgüt adına suç işleyenler de terör suçlusu sayılır .</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Terör suçları">
      <mvz-fıkra no="1">
        <template>26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 302, 307, 309, 311, 312, 313, 314, 315 ve 320 nci maddeleri ile 310 uncu maddesinin birinci fıkrasında yazılı suçlar, terör suçlarıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Terör amacı ile işlenen suçlar">
      <mvz-fıkra no="1">
        <template>Aşağıdaki suçlar 1 inci maddede belirtilen amaçlar doğrultusunda suç işlemek üzere kurulmuş bir terör örgütünün faaliyeti çerçevesinde işlendiği takdirde, terör suçu sayılır:</template>
        <mvz-bent no="a">
          <template>Türk Ceza Kanununun 79, 80, 81, 82, 84, 86, 87, 96, 106, 107, 108, 109, 112, 113, 114, 115, 116, 117, 118, 142, 148, 149, 151, 152, 170, 172, 173, 174, 185, 188, 199, 200, 202, 204, 210, 213, 214, 215, 223, 224, 243, 244, 265, 294, 300, 316, 317, 318 ve 319 uncu maddeleri ile 310 uncu maddesinin ikinci fıkrasında yer alan suçlar.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>10/7/1953 tarihli ve 6136 sayılı Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunda tanımlanan suçlar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>31/8/1956 tarihli ve 6831 sayılı Orman Kanununun 110 uncu maddesinin dördüncü ve beşinci fıkralarında tanımlanan kasten orman yakma suçları.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>10/7/2003 tarihli ve 4926 sayılı Kaçakçılıkla Mücadele Kanununda tanımlanan ve hapis cezasını gerektiren suçlar.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Anayasanın 120 nci maddesi gereğince olağanüstü hal ilan edilen bölgelerde, olağanüstü halin ilanına neden olan olaylara ilişkin suçlar.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>21/7/1983 tarihli ve 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanununun 68 inci maddesinde tanımlanan suç.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Cezaların artırılması">
      <mvz-fıkra no="1">
        <template>3 ve 4 üncü maddelerde yazılı suçları işleyenler hakkında ilgili kanunlara göre tayin edilecek hapis cezaları veya adlî para cezaları yarı oranında artırılarak hükmolunur. Bu suretle tayin olunacak cezalarda, gerek o fiil için, gerek her nevi ceza için muayyen olan cezanın yukarı sınırı aşılabilir. Ancak, müebbet hapis cezası yerine, ağırlaştırılmış müebbet hapis cezasına hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Suçun, örgütün faaliyeti çerçevesinde işlenmiş olması dolayısıyla ilgili maddesinde cezasının artırılması öngörülmüşse; sadece bu madde hükmüne göre cezada artırım yapılır. Ancak, yapılacak artırım, cezanın üçte ikisinden az olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde hükümleri çocuklar hakkında uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Açıklama ve yayınlama">
      <mvz-fıkra no="1">
        <template>İsim ve kimlik belirterek veya belirtmeyerek kime yönelik olduğunun anlaşılmasını sağlayacak surette kişilere karşı terör örgütleri tarafından suç işleneceğini veya terörle mücadelede görev almış kamu görevlilerinin hüviyetlerini açıklayanlar veya yayınlayanlar veya bu yolla kişileri hedef gösterenler bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Terör örgütlerinin; cebir, şiddet veya tehdit içeren yöntemlerini meşru gösteren veya öven ya da bu yöntemlere başvurmayı teşvik eden bildiri veya açıklamalarını basanlar veya yayınlayanlar bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun 14 üncü maddesine aykırı olarak muhbirlerin hüviyetlerini açıklayanlar veya yayınlayanlar bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıdaki fıkralarda belirtilen fiillerin basın ve yayın yoluyla işlenmesi hâlinde, basın ve yayın organlarının suçun işlenişine iştirak etmemiş olan  yayın sorumluları hakkında da bin günden beşbin güne kadar adlî para cezasına hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5" durum="mülga">
        <template></template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Terör örgütleri">
      <mvz-fıkra no="1">
        <template>Cebir ve şiddet kullanılarak; baskı, korkutma, yıldırma, sindirme veya tehdit yöntemleriyle, 1 inci maddede belirtilen amaçlara yönelik olarak suç işlemek üzere, terör örgütü kuranlar, yönetenler ile bu örgüte üye olanlar Türk Ceza Kanununun 314 üncü maddesi hükümlerine göre cezalandırılır. Örgütün faaliyetini düzenleyenler de örgütün yöneticisi olarak cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Terör örgütünün; cebir, şiddet veya tehdit içeren yöntemlerini meşru gösterecek veya övecek ya da bu yöntemlere başvurmayı teşvik edecek şekilde propagandasını yapan kişi, bir yıldan beş yıla kadar hapis cezası ile cezalandırılır. Bu suçun basın ve yayın yolu ile işlenmesi hâlinde, verilecek ceza yarı oranında artırılır. Ayrıca, basın ve yayın organlarının suçun işlenmesine iştirak etmemiş olan yayın sorumluları hakkında da bin günden beş bin güne kadar adli para cezasına hükmolunur.  Haber verme sınırlarını aşmayan veya eleştiri amacıyla yapılan düşünce açıklamaları suç oluşturmaz. Aşağıdaki fiil ve davranışlar da bu fıkra hükümlerine göre cezalandırılır:</template>
        <mvz-bent no="a" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Toplantı ve gösteri yürüyüşü sırasında gerçekleşmese dahi, terör örgütünün üyesi veya destekçisi olduğunu belli edecek şekilde;</template>
          <mvz-altbent no="1">
            <template>Örgüte ait amblem, resim veya işaretlerin asılması ya da taşınması,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Slogan atılması,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Ses cihazları ile yayın yapılması,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Terör örgütüne ait amblem, resim veya işaretlerin üzerinde bulunduğu üniformanın giyilmesi.</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Terör örgütünün propagandasına dönüştürülen toplantı ve gösteri yürüyüşlerinde, kimliklerini gizlemek amacıyla yüzünü tamamen veya kısmen kapatanlar üç yıldan beş yıla kadar hapis cezasıyla cezalandırılır. Bu suçu işleyenlerin cebir ve şiddete başvurmaları ya da her türlü silah, molotof ve benzeri patlayıcı, yakıcı ya da yaralayıcı maddeler bulundurmaları veya kullanmaları hâlinde verilecek cezanın alt sınırı dört yıldan az olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İkinci fıkrada belirtilen suçların; dernek, vakıf, siyasî parti, işçi ve meslek kuruluşlarına veya bunların yan kuruluşlarına ait bina, lokal, büro veya eklentilerinde veya öğretim kurumlarında veya öğrenci yurtlarında veya bunların eklentilerinde işlenmesi halinde bu fıkradaki cezanın iki katı hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Terör örgütüne üye olmamakla birlikte örgüt adına;</template>
        <mvz-bent no="a">
          <template>İkinci fıkrada tanımlanan suçu,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>6 ncı maddenin ikinci fıkrasında tanımlanan suçu,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>6/10/1983 tarihli ve 2911 sayılı Toplantı ve Gösteri Yürüyüşleri Kanununun 28 inci maddesinin birinci fıkrasında tanımlanan kanuna aykırı toplantı ve gösteri yürüyüşüne katılma suçunu,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>işleyenler hakkında, 5237 sayılı Kanunun 314 üncü maddesinin üçüncü fıkrasında tanımlanan suçtan dolayı ayrıca ceza verilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Terörün finansmanı" durum="mülga">
    </mvz-madde>
    <mvz-madde no="8/A" başlık="Nitelikli hal">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren suçların kamu görevinin sağladığı nüfuz kötüye kullanılmak suretiyle işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8/B" başlık="Tüzel kişilerin sorumluluğu">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren suçların bir tüzel kişinin faaliyeti çerçevesinde işlenmesi halinde, Türk Ceza Kanununun 60 ıncı maddesine göre bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Yargılama Usulleri">
    <mvz-madde no="9" başlık="Görev ve yargı çevresinin belirlenmesi" durum="mülga">
    </mvz-madde>
    <mvz-madde no="10" başlık="Görev ve yargı çevresinin belirlenmesi, soruşturma ve kovuşturma usulü" durum="mülga">
    </mvz-madde>
    <mvz-madde no="11" başlık="Gözetim süresi" durum="mülga">
    </mvz-madde>
    <mvz-madde no="12" başlık="Tutanak düzenleyenlerin dinlenmeleri" durum="mülga">
    </mvz-madde>
    <mvz-madde no="13" başlık="Hükmün açıklanmasının geri bırakılması kararı verilmemesi, seçenek yaptırımlara çevirme ve erteleme yasağı" durum="mülga">
    </mvz-madde>
    <mvz-madde no="14" başlık="Muhbirlerin hüviyetlerinin açıklanmaması">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren suçlar ve suçluları ihbar edenlerin hüviyetleri, rızaları olmadıkça veya ihbarın mahiyeti haklarında suç teşkil etmedikçe açıklanamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Avukat tayini">
      <mvz-fıkra no="1">
        <template>Terörle mücadelede görev alan Türk Silahlı Kuvvetleri personeli, mülki idare amirleri, istihbarat ve kolluk görevlileri ile bu amaçla görevlendirilmiş diğer personelin, bu görevlerinin ifasından doğduğu iddia edilen suçlardan dolayı yapılan soruşturma ve kovuşturmalar sebebiyle belirleyeceği en fazla üç avukatın veya bu görevlerinin ifasından dolayı mağdur, şikâyetçi, katılan, davalı ya da davacı konumunda olan personelin seçeceği bir avukatın ücreti ödenir ve bunlara avukatlık ücret tarifesine bağlı olmaksızın yapılacak ödemeler, ilgili kuruluşların bütçelerine konulacak ödenekten karşılanır.  Ancak davacı konumunda olan personelin seçeceği bir avukata ücret ödenmesi, ilgili Bakanın onayına tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avukatların ücretlerinin ödenmesine ilişkin esas ve usûller, Millî Savunma ve İçişleri bakanlıklarınca müştereken çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Cezaların İnfazı">
    <mvz-madde no="16" başlık="Cezaların infazı ve tutukluların muhafazası" durum="mülga">
    </mvz-madde>
    <mvz-madde no="17" başlık="Koşullu salıverilme">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren suçlardan mahkûm olanlar hakkında, koşullu salıverilme ve denetimli serbestlik tedbirinin uygulanması bakımından 13/12/2004 tarihli ve 5275 sayılı Ceza ve Güvenlik Tedbirlerinin İnfazı Hakkında Kanunun 107 nci maddesinin dördüncü fıkrası ile 108 inci maddesi hükümleri uygulanır.  Ancak, süreli hapis cezaları bakımından düzenlenen koşullu salıverilme oranı, dörtte üç olarak uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tutuklu veya hükümlü iken firar veya ayaklanma suçundan mahkûm edilmiş bulunanlar ile disiplin cezası olarak üç defa hücre hapsi cezası almış olanlar, bu disiplin cezaları kaldırılmış olsa bile şartla salıverilmeden yararlanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanun kapsamına giren suçlardan mahkûm olanlar, hükümlerinin kesinleşme tarihinden sonra bu Kanunun kapsamına giren bir suçu işlemeleri halinde, şartla salıverilmeden yararlanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ölüm cezaları, 14/7/2004 tarihli ve 5218 sayılı Kanunun 1 inci maddesi ile değişik 3/8/2002 tarihli ve 4771 sayılı Çeşitli Kanunlarda Değişiklik Yapılmasına İlişkin Kanunla müebbet ağır hapis cezasına dönüştürülen terör suçluları ile ölüm cezaları ağırlaştırılmış müebbet ağır hapis cezasına dönüştürülen veya ağırlaştırılmış müebbet ağır hapis cezasına mahkûm olan terör suçluları koşullu salıverilme hükümlerinden yararlanamaz. Bunlar hakkında ağırlaştırılmış müebbet ağır hapis cezası ölünceye kadar devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Ceza ve tutukevi inşaatı" durum="mülga">
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Çeşitli Hükümler">
    <mvz-madde no="19" başlık="Ödüllendirme">
      <mvz-fıkra no="1">
        <template>İşlenişine iştirak etmemiş olmak koşuluyla bu Kanun kapsamına giren suçun ortaya çıkarılmasına veya delillerin ele geçirilmesine ya da suç faillerinin yakalanabilmesine yardımcı olanlara veya yerlerini yahut kimliklerini bildirenlere para ödülü verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ödül miktarının belirlenmesi ve ödülün verilmesine ilişkin usul ve esaslar İçişleri Bakanlığınca çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Koruma tedbirleri">
      <mvz-fıkra no="1">
        <template>Terörle mücadelede görev veren veya bu görevi ifa eden adlî, istihbarî, idarî ve askerî görevliler, kolluk görevlileri, Ceza ve Tevkifevleri Genel Müdürü ve Genel Müdür Yardımcıları, terör suçlularının muhafaza edildiği ceza ve tutukevlerinin savcıları ve müdürleri, Devlet Güvenlik Mahkemelerinde görev yapmış hâkim ve savcılar, Ceza Muhakemesi Kanununun 250 nci maddesiyle yetkili kılınmış ağır ceza mahkemelerinde görev yapan hâkim ve savcılar ile bu görevlerinden ayrılmış olanlar ve terör örgütlerinin açık hedefi haline gelen veya getirilenler ile suçların aydınlatılmasında yardımcı olanlar hakkında gerekli koruma tedbirleri Devlet tarafından alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ceza Muhakemesi Kanununun 250 nci maddesi uyarınca Hâkimler ve Savcılar Yüksek Kurulunca görevlendirilecek ağır ceza mahkemeleri başkan ve üyeleri ile bu mahkemelerin görev alanına giren suçları soruşturmakla ve kovuşturmakla görevli Cumhuriyet savcılarının korunma ve güvenlik talepleri ilgili makam ve mercilerce öncelikle ve ivedilikle yerine getirilir. Koruma için ihtiyaç duyulan araç ve gereçler Adalet ve İçişleri bakanlıklarınca temin edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu koruma tedbirleri; talep halinde estetik cerrahi yoluyla fizyolojik görünümün değiştirilmesi dahil, nüfus kaydı, ehliyet, evlenme cüzdanı, diploma ve benzeri belgelerin değiştirilmesi, askerlik işleminin düzenlenmesi, menkul ve gayrimenkul mal varlıklarıyla ilgili hakları, sosyal güvenlik ve diğer hakların korunması gibi hususlarda düzenleme yapılır.  Korumaya alınmış emekli personelden, meskende korunmaları mutlak surette zorunlu bulunanlar Cumhurbaşkanlığınca belirlenecek konutlardan yararlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu tedbirlerin uygulanmasında, İçişleri Bakanlığı ile ilgili diğer kurum ve kuruluşlar gerekli her türlü gizlilik kurallarına uymak zorundadırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Koruma tedbirleriyle ilgili esas ve usûller Cumhurbaşkanınca çıkarılacak bir yönetmelik ile belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yukarıda sayılanlardan kamu görevlileri, görevlerinden ayrılmış olsalar dahi terör suçluları tarafından kendilerine veya eş ve çocuklarının canına vuku bulan bir taarruzu savmak için silah kullanmaya yetkilidirler.</template>

    <mvz-madde no="20/A" başlık="Zararların tazmini amacıyla tedbir konulması">
      <mvz-fıkra no="1">
        <template>Türk Ceza Kanununun İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde tanımlanan suçlar ve bu Kanun kapsamına giren suçlar nedeniyle gerçek veya tüzel kişiler ile kamu kurum ve kuruluşlarının uğradığı zararların tazmini amacıyla, soruşturma aşamasında Cumhuriyet savcısının talebi üzerine sulh ceza hâkimi, kovuşturma aşamasında mahkeme tarafından, şüpheli veya sanıklara ait taşınmazların veya kara, deniz ya da hava ulaşım araçlarının devir ve temlikini veya bunlarla ilgili hak tesisini önlemek ya da tasarruf yetkisini kısıtlamak için şerh düşülmesine ve bu kişilerin yardımlaşma kurum ve sandıklarından olan alacaklarına tedbir konulmasına karar verilebilir. Taşınmazlarla ilgili karar tapu kütüğüne; kara, deniz ve hava ulaşım araçlarıyla ilgili karar ise bu araçların kayıtlı bulunduğu sicile şerh verilmek suretiyle icra olunur. Kovuşturmaya yer olmadığına dair kararın kesinleşmesi halinde veya şerhin konulduğu tarihten itibaren iki yıl içinde, şerhin devamı yönünde hukuk mahkemesinden verilmiş ihtiyati haciz veya ihtiyati tedbir kararı ibraz edilmediği takdirde şerh kendiliğinden terkin edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamına giren suçlar nedeniyle gerçek veya tüzel kişiler ile kamu kurum ve kuruluşlarının uğradığı zararların tazmini amacıyla açılan davalarda; davalının adres kayıt sisteminde adresinin bulunmaması veya bulunup da tebligata elverişli olmaması halinde, mahkemece, dava dilekçesinin özeti tirajı ellibinin üzerinde olan ve yurt düzeyinde dağıtımı yapılan gazetelerden biri vasıtasıyla ilan edilir. Yapılacak ilanda davalının bir ay içinde yurtiçinde tebligata elverişli bir adres veya 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanununun 7/a maddesi uyarınca kayıtlı elektronik posta adresi bildirmemesi ya da davada kendisini avukatla temsil ettirmemesi halinde, yargılamaya yokluğunda devam olunacağı, yargılama aşamalarında başkaca tebligat yapılmayarak hüküm verileceği ve hükmün de aynı usulle tebliğ edileceği ihtar edilir. Adresi yabancı ülkede bulunan davalıya çıkarılacak tebligatta, bu fıkrada belirtilen ilanda yer alan hususlar ile yabancı ülke adresine bir daha tebligat yapılmayacağı ihtarına yer verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkra kapsamında açılan davaların kısmen veya tamamen reddi halinde, davacı aleyhine maktu avukatlık ücretine hükmolunur. Ancak belirlenen ücret dava değerini geçemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Yardım">
      <mvz-fıkra no="1">
        <template>kamu görevlilerinden yurtiçinde ve yurtdışında görevlerini ifa ederlerken veya sıfatları kalkmış olsa bile bu görevlerini yapmalarından dolayı terör eylemlerine muhatap olarak yaralanan, engelli hâle gelen, ölen veya öldürülenler hakkında 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanun hükümleri uygulanır.  Ayrıca;</template>
        <mvz-bent no="a">
          <template>Malul olanlarla, ölenlerin aylığa müstehak dul ve yetimlerine bağlanacak aylığın toplam tutarı, bunların görevde olan emsallerinin almakta oldukları aylıklardan; emekli olanların terör nedeniyle öldürülmeleri halinde ise, dul ve yetimlerine bağlanacak aylığın toplam tutarı ve Kanuna göre kendisine bağlanabilecek emekli aylığından az olamaz. Yaşamak için gereken hareketleri yapamayacak ve başkasının yardım ve desteğine muhtaç olacak derecede malül olanlar ile ölenlerin dul ve yetimlerine en yüksek devlet memuru aylığı üzerinden, diğerlerine mevcut aylıkları üzerinden, 30 yıl hizmet yapmış gibi emekli ikramiyesi ödenir. Bu bent hükümlerine göre ilgililere fazla olarak yapılan ödemeler, faturası karşılığı ilgili sosyal güvenlik kuruluşlarınca Hazineden tahsil edilir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yurtiçinde veya yurtdışında kamu konutlarından yararlanmakta iken malul olanların kendileri, ölenlerin aylığa müstehak dul ve yetimleri, 9/11/1983 tarihli ve 2946 sayılı Kamu Konutları Kanununda gösterilen özel tahsisli konutlarda oturanlar hariç olmak üzere, herhangi bir kira bedeli alınmaksızın on yıl süreyle kamu konutlarından yararlanmaya devam edebilirler. Kamu konutundan çıkacaklar ile kamu konutundan yararlanmayanlar ve özel tahsisli konutlarda oturanların istekleri halinde ikametgâh olarak kullanacakları yurtiçindeki taşınmazın kira bedeli on yıl süre ile Devletçe karşılanır; ancak kamu konutlarından kira ödemeksizin yararlanılan süre, kira yardımından yararlanılan süreden düşülür. Yurtdışındaki özel tahsisli konutlarda oturanların yurtdışı kira bedelleri de istekleri halinde bir yıl süre ile Devletçe karşılanır.  Bütün hak sahipleri adına bir konut için yapılacak aylık kira yardımının üst limiti ile ödeme usul ve esasları, Aile ve Sosyal Politikalar Bakanlığı, Millî Savunma Bakanlığı ve İçişleri Bakanlığının görüşü alınmak suretiyle Maliye Bakanlığınca çıkarılan yönetmelikle belirlenir. Bu Kanun hükümlerine göre aylık alan maluller ile hayatını kaybedenlerin dul ve yetimlerine yapılan gayrimenkul hibeleri veraset ve intikal vergisinden, devir işlemleri harçlarından ve döner sermaye ücretlerinden ve bu işlemler nedeniyle düzenlenecek kağıtlar için tahakkuk edecek damga vergisinden müstesnadır. Bu gayrimenkullerin maliyet bedellerinin tamamı bunları hibe edenler tarafından 31/12/1960 tarihli ve 193 sayılı Gelir Vergisi Kanununun 89 uncu maddesi ve 13/6/2006 tarihli ve 5520 sayılı Kurumlar Vergisi Kanununun 10 uncu maddesi kapsamında dönem gelirinden veya kurum kazancından indirilebilir.</template>
        </mvz-bent>
        <mvz-bent no="c" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="d" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Malûl olanlar ile ölenlerin dul ve yetimleri, Türkiye Cumhuriyeti Emekli Sandığınca kendilerine verilen tanıtım kartlarını ibraz etmeleri durumunda, kamu kurum ve kuruluşlarına ait bütün hastanelerde muayene ve tedavi edilirler. Bunların her türlü tedavi giderleri; ilgililerin herhangi bir kamu kurumu veya kuruluşunda çalışmaları halinde bu kurum veya kuruluşça, emekli, yaşlılık, malûllük veya dul ve yetim aylığı almaları halinde bağlı bulundukları sosyal güvenlik kurumunca, herhangi bir kuruma tâbi olarak çalışmamaları, 1/7/1976 tarihli ve 2022 sayılı 65 Yaşını Doldurmuş Muhtaç, Güçsüz ve Kimsesiz Türk Vatandaşlarına Aylık Bağlanması Hakkında Kanun kapsamında aylık alanlar hariç emekli, yaşlılık, malûllük veya dul ve yetim aylığı almamaları durumunda Millî Savunma veya İçişleri Bakanlığınca karşılanır. Malûl olanların eksilen vücut organları, yurt içi veya yurt dışında en son teknik usûllere göre yapılması mümkün sunileriyle tamamlatılır ve gerekirse tamir ettirilir veya yenisi yaptırılır.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Yurtiçinde tedavileri mümkün olmayanlar, yetkili sağlık kuruluşlarının raporlarına istinaden yurtdışında.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Yaşamak için gerekli hareketleri yapmaktan aciz olanlar ile kimsesizler, kamu kurum ve kuruluşlarına ait, bunlar bulunmadığı takdirde özel rehabilitasyon ve bakım merkezleri, yurtlar ve huzurevlerinde parasız olarak veya masrafları devlet tarafından karşılanmak üzere barındırılır, baktırılır .</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Erbaş ve erlerden veya geçici veya gönüllü köy korucularından; terörle mücadele görevi ifa ederken yaralanarak veya engelli hâle gelerek ilgili mevzuatına göre malullük aylığı bağlanması koşullarının oluştuğu tespit olunanlar, 2330 sayılı Kanuna göre aylık bağlanması hakkından ve bu fıkranın (c), (d) ve (g) bentlerindeki haklardan, bunların eş, ana ve babaları ile bakmakla yükümlü olunan kişi kapsamına giren çocukları da bu fıkranın (d) bendinde düzenlenen haklardan yararlandırılır. Erbaş ve erlerden veya geçici veya gönüllü köy korucularından; aynı sebeplerle hayatını kaybedenlerin veya bu fıkra kapsamında malul olması sebebiyle aylık almakta iken hayatını kaybedenlerin dul aylığına müstehak eşi, ana ve babaları ile yetim aylığına müstehak çocukları 2330 sayılı Kanun hükümlerine göre aylık bağlanması hakkından ve bu fıkranın (c) ve (d) bendindeki haklardan yararlandırılır.</template>
        </mvz-bent>
        <mvz-bent no="ı" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Yedek subay ve yedek astsubay okulu öğrencileri, harp okulları ve astsubay meslek yüksekokullarında okuyanlar, Jandarma ve Sahil Güvenlik Akademisi fakülte ve yüksekokullarında okuyanlar, üniversitelerin fakülte ve yüksekokullarında Milli Savunma Bakanlığı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı adına öğrenim görenler ya da kendi hesabına öğrenim görmekte iken Milli Savunma Bakanlığı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı nam ve hesabına okumaya devam edenler, Polis Akademisi ile Polis Meslek Eğitim Merkezlerinde veya üniversitelerin fakülte ve yüksekokullarında Emniyet Genel Müdürlüğü hesabına öğrenim görenler veya kendi hesabına öğrenim görmekte iken Emniyet Genel Müdürlüğü hesabına öğrenim görmeye devam edenler, Emniyet Genel Müdürlüğü veya Millî İstihbarat Teşkilatı hesabına açılan okullarda öğrenim görenler ile Milli Savunma Bakanlığı, Jandarma Genel Komutanlığı, Sahil Güvenlik Komutanlığı veya Emniyet Genel Müdürlüğü adına öğrenim görmek üzere temel ve intibak eğitimine tabi tutulanlardan; 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında sigortalı sayılmamış olup bu öğrenimleri veya eğitimleri nedeniyle bu Kanun kapsamındaki terör eylemlerinde hedef alınarak hayatını kaybedenler ile yaralanan veya engelli hâle gelenlerden ilgili mevzuatına göre malullük aylığı bağlanması koşullarının oluştuğu tespit olunanların kendileri, 2330 sayılı Kanuna göre aylık bağlanması hakkından ve bu fıkranın (c), (d) ve (g) bentlerindeki haklardan, bunların eş, ana ve babaları ile bakmakla yükümlü olunan kişi kapsamına giren çocukları da bu fıkranın (d) bendinde düzenlenen haklardan yararlandırılır. Yukarıda sayılanlardan aynı sebeplerle hayatını kaybedenlerin veya bu fıkra kapsamında malul olması sebebiyle aylık almakta iken hayatını kaybedenlerin dul aylığına müstehak eşi, ana ve babaları ile yetim aylığına müstehak çocukları 2330 sayılı Kanun hükümlerine göre aylık bağlanması hakkından ve bu fıkranın (c) ve (d) bendindeki haklardan yararlandırılır.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Terör eyleminin ortaya çıkarılması, etkilerinin azaltılması veya bertaraf edilmesinin sağlanmasında yardımcı ve faydalı olanlar bu faaliyetlerinden dolayı hayatını kaybettikleri, yaralandıkları veya engelli hâle geldikleri; ilgili valinin teklifi üzerine Nakdi Tazminat Komisyonu tarafından karara bağlanan sivillerden Sosyal Güvenlik Kurumunca ilgili mevzuatına göre malullük aylığı bağlanması koşullarının oluştuğu tespit olunanların kendileri, 2330 sayılı Kanuna göre aylık bağlanması hakkından ve bu fıkranın (c), (d) ve (g) bentlerindeki haklardan, bunların eş, ana ve babaları ile bakmakla yükümlü olunan kişi kapsamına giren çocukları da bu fıkranın (d) bendinde düzenlenen haklardan yararlandırılır. Yukarıda sayılanlardan aynı sebeplerle hayatını kaybedenlerin veya bu fıkra kapsamında malul olması sebebiyle aylık almakta iken hayatını kaybedenlerin dul aylığına müstehak eşi, ana ve babaları ile yetim aylığına müstehak çocukları 2330 sayılı Kanun hükümlerine göre aylık bağlanması hakkından ve bu fıkranın (c) ve (d) bendindeki haklardan yararlandırılır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu görevlileri ile birinci fıkranın (h) ve (j) bentleri kapsamına girenlerden terör olaylarını önlemek amacıyla her türlü patlayıcı maddeye bağlı olarak meydana gelen olaylar sonucunda ya da her ne şekilde olursa olsun terör olaylarının önlenmesi, takibi veya etkisiz hale getirilmesi amacıyla ifa edilen görevler sırasında veya bu görevlere gidiş dönüşler esnasında meydana gelen kazalar sonucunda yaralanan, engelli hâle gelen, hastalanan veya hayatını kaybedenler, birinci fıkranın durumlarına uygun hükümlerinden yararlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkranın (h), (i) ve (j) bentleri kapsamındakilere bağlanacak aylıklar, bitirmiş oldukları okullar neticesinde hak kazandıkları unvanlar üzerinden yürütmüş oldukları kamu görevleri sebebiyle daha yüksek aylık bağlanmasına ilişkin hakları saklı kalmak kaydıyla; en az dört yıllık yüksek öğrenim mezunu olanlar sekizinci derecenin birinci kademesinde, diğerleri ise eğitim durumlarına bakılmaksızın onuncu derecenin birinci kademesinde bulunanların emekli keseneğine esas aylıkları üzerinden hesaplanacak vazife malullüğü aylığı tutarından düşük olamaz ve bunlar için 8/6/1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanununun ek 77 nci maddesinin birinci fıkrasının (c) bendine göre yapılacak yükseltmelerde aynı derece başlangıç olarak esas alınarak artırılır ve derece yükselmelerinde yüksek öğrenim mezunu gibi işlem yapılır ve dördüncü dereceye yükselenler için 2.100, üçüncü dereceye yükselenler için 2.200, ikinci dereceye yükselenler için 3.000, birinci dereceye yükselenler için ise 3.600 ek gösterge rakamı esas alınır. Bu fıkra kapsamındakilere bağlanacak aylığın toplam tutarı, 35.398 gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutardan; hak sahiplerinin aylık tutarı ise bulunacak tutarın hisseleri oranı esas alınarak tespit edilecek tutarından az olamaz. Bu fıkra uyarınca ilgililere fazla olarak yapılan ödemeler, faturası karşılığı Sosyal Güvenlik Kurumunca Hazineden tahsil edilir.</template>
      </mvz-fıkra>  
      <mvz-fıkra no="4">
        <template>Birinci fıkranın (h), (i) ve (j) bentlerinde belirtilenlerden bu Kanun kapsamındaki olaylar sebebiyle yaralananlar, tedavileri sonuçlanıncaya veya maluliyetleri kesinleşinceye kadar geçen süre içinde 5510 sayılı Kanuna göre sağlanan sağlık hizmetlerinden ve diğer haklardan, aynı sebeplerle tedavi gören malul kamu görevlilerine ilişkin hükümler çerçevesinde yararlandırılır. Erbaş ve erler için Türk Silahlı Kuvvetlerine ait sağlık kurum ve kuruluşlarında yapılan tedaviler hariç, bu kapsamda yapılacak giderlerin tamamı; ilgililerin genel sağlık sigortalısı olup olmadığına bakılmaksızın Sosyal Güvenlik Kurumu tarafından karşılanır. Ancak, bu kişilerden 5510 sayılı Kanuna göre genel sağlık sigortası kapsamında yer almayanlar için, Sosyal Güvenlik Kurumunca yapılmış olan giderler, Sosyal Güvenlik Kurumu tarafından; erbaş ve erler için ilgisine göre Millî Savunma Bakanlığı, Jandarma Genel Komutanlığı, Sahil Güvenlik Komutanlığı, diğerleri için Maliye Bakanlığından tahsil olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kendilerine aylık bağlanan dul ve yetimler; ilgili sosyal güvenlik kurumları mevzuatı gereği aylıklarının kesilmesi halinde, bu madde ile verilen diğer haklardan da yararlanamazlar.</template>
      </mvz-fıkra>

    <mvz-madde no="22" başlık="Terörden zarar gören diğer kişilere yardım">
      <mvz-fıkra no="1">
        <template>Terör eylemlerinden dolayı yaralananların tedavileri Devlet tarafından yapılır. Zarar gören, can ve mal kaybına uğrayan vatandaşlara, Sosyal Yardımlaşma ve Dayanışmayı Teşvik Fonundan öncelikle yardım yapılır. Bu fondan ilk ve orta öğrenim çağındaki şehit çocuklarının öğrenim masrafları karşılanır. Yardımın kapsam ve ölçüsü, Fonun mahalli yetkililerince belirlenecek miktarı aşmamak kaydıyla Fon Kurulunca tespit edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununun eki (I), (II),  ve (IV) sayılı cetvellerde yer alan kamu kurum ve kuruluşları, kamu iktisadi teşebbüsleri ve bağlı ortaklıkları, il özel idareleri, belediyeler ve bağlı kuruluşları, özel kanunla kurulan diğer her türlü kamu kurum ve kuruluşları; 657 sayılı Devlet Memurları Kanununa tabi memur kadroları ile sözleşmeli personel pozisyonlarına ve sürekli işçi kadrolarına bu madde hükümleri çerçevesinde Aile ve Sosyal Politikalar Bakanlığınca hak sahibi olduğu belirlenerek Devlet Personel Başkanlığına bildirilen ve Başkanlıkça kura sonucu atama teklifi yapılanları atamak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde kapsamında hak sahipliği sonucunu doğuran durumlar aşağıda belirtilmiştir:</template>
        <mvz-bent no="a">
          <template>5434 sayılı Kanunun mülga 64 üncü maddesi, 5510 sayılı Kanunun 47 nci maddesinin sekizinci fıkrası, 3/11/1980 tarihli ve 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanuna göre veya 2330 sayılı Kanun hükümleri uygulanarak aylık bağlanmasını gerektiren kanunlara göre harp veya vazife malulü sayılanlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>5434 sayılı Kanunun mülga 45 inci maddesi ile 5510 sayılı Kanunun 47 nci maddesinin birinci fıkrasında belirtilen haller kapsamında vazife malulü sayılan; Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığının erbaş ve erler dahil askeri personeli ile Emniyet Teşkilatından Emniyet Hizmetleri Sınıfına mensup personeli ve ceza infaz kurumu müdürü, infaz ve koruma başmemuru ve infaz ve koruma memuru unvanlı ceza infaz kurumu personeli,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>(b) bendi kapsamına girenler hariç olmak üzere 5434 sayılı Kanunun mülga 45 inci maddesi ile 5510 sayılı Kanunun 47 nci maddesinin birinci fıkrası kapsamında olanlardan vazife malulü sayılanlar,</template>

        <mvz-bent no="ç">

      <mvz-fıkra no="4">
        <template>Bu madde kapsamında atanacakların, atamalarının yapılacağı kadro veya pozisyonlar için sınavlara ilişkin hükümler hariç olmak üzere ilgili mevzuatında öngörülen nitelik ve şartları taşımaları zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bir başkasının bakımına muhtaç olacak derecede engelli olanlar, terör örgütlerine veya Milli Güvenlik Kurulunca Devletin milli güvenliğine karşı faaliyette bulunduğuna karar verilen yapı, oluşum veya gruplara üyeliği, mensubiyeti veya iltisakı yahut bunlarla irtibatı olduğu ilgili valilerce tespit edilenler, birinci fıkrada sayılan kurumlarda görev yapanlar, istihdam hakkını sağlayan olayın meydana geldiği tarihten sonra söz konusu kurum ve kuruluşlarında görev yapmakta iken bu görevinden ayrılmış olanlar  istihdam hakkından faydalanamazlar ve bu durumda olanlar yukarıdaki fıkraların uygulanmasında dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Hak sahiplerinden ilköğretim, ortaokul, ilkokul mezunu olanların hizmetli unvanlı kadro ve pozisyonlara; ortaöğretim ve yükseköğretim mezunu olanların, atama teklifinin yapıldığı tarihte öğrenim durumları itibarıyla ihraz ettikleri unvanın 190 sayılı Kanun Hükmünde Kararnamenin eki cetvellerde yer alması koşuluyla ihraz etmiş bulundukları unvanlara, bunların dışında kalan ortaöğretim ve yükseköğretim mezunlarının ise memur unvanlı kadro ve pozisyonlara atama teklifleri Devlet Personel Başkanlığınca yapılır.  Üçüncü fıkranın (a), (b), (c) ve (ç) bentlerinde sayılan maluller ile 15/8/2016 tarihli ve 670 sayılı Olağanüstü Hal Kapsamında Alınması Gereken Tedbirler Hakkında Kanun Hükmünde Kararnamenin 9 uncu maddesine göre tazminat hakkından yararlandırılanların kendilerinin istihdam hakkından yararlanmaları ve ilköğretim, ortaokul, ilkokul mezunu olmaları halinde atama teklifleri memur unvanlı kadro ve pozisyonlara yapılır. İşçi kadrolarına yapılacak atama teklifleri sürekli işçi unvanlı kadroya yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu madde kapsamında başvuranlardan hak sahibi olanlar Aile ve Sosyal Politikalar Bakanlığınca tespit edilerek, liste hâlinde  Devlet Personel Başkanlığına bildirilir.  Hak sahiplerinin kamu kurum ve kuruluşlarına atama teklifleri, Devlet Personel Başkanlığınca  kura usulü ile yapılır.  Kamu kurum ve kuruluşları bu madde kapsamındaki taleplerini her yılın ocak ve temmuz aylarının son gününe kadar DPB e-uygulama üzerinden iletirler. Devlet Personel Başkanlığınca atama teklifleri, bu talepler esas alınarak gerçekleştirilir. Söz konusu taleplerin yeterli olmaması halinde Başkanlıkça resen atama teklifi yapılır.  Hak sahiplerinin kamu kurum ve kuruluşlarına Kura sonucu yapılacak atamalarda atama teklifinin yapılması ile birlikte diğer kanunlardaki hükümlere bakılmaksızın ve başka bir işleme gerek kalmaksızın atama teklifi yapılan kamu kurum ve kuruluşlarına kadro ve pozisyonlar ihdas, tahsis ve vize edilmiş ve mevzuatı uyarınca düzenlenen ilgili cetvel ve bölümlere eklenmiş sayılır. Bu şekilde ihdas edilen kadro ve pozisyonlar, herhangi bir şekilde boşalması hâlinde başka bir işleme gerek kalmaksızın iptal edilmiş sayılır. Atama işlemlerinin, atama teklifinin kamu kurum ve kuruluşuna intikalinden itibaren otuz gün içinde yapılması zorunludur. Atama emri ilgili kamu kurum ve kuruluşu tarafından 7201 sayılı Tebligat Kanunu hükümlerine göre ilgililere tebliğ edilir. İlgililerin işe başlama sürelerine ve işe başlamama hâlinde yapılacak işlemlere ilişkin olarak 657 sayılı Kanunun 62 nci ve 63 üncü maddeleri hükümleri uygulanır. Atama onayı alınmasına rağmen görevine başlamayanlar ile başladıktan sonra herhangi bir sebeple görevden ayrılanlar bu madde kapsamında yeniden istihdam edilemezler. Kamu kurum ve kuruluşları atama ve göreve başlatma işlemlerinin sonucunu, işlemlerin tamamlanmasını takip eden on beş gün içinde Devlet Personel Başkanlığına bildirirler.</template>
      </mvz-fıkra>

    <mvz-madde no="3" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>21 inci maddenin birinci fıkrasının (a), (h), (i) ve (j) bentleri kapsamında terör eylemi nedeniyle yaralanmış olup ilgili mevzuatına göre malul sayılmamaları nedeniyle aylık bağlanamayanlardan, talepleri üzerine 13/7/1953 tarihli ve 4/1053 sayılı Bakanlar Kurulu Kararıyla yürürlüğe konulan Vazife Malullüklerinin Nevileri ile Dereceleri Hakkında Nizamname hükümlerine göre derece tespiti yapılanlara, bu dereceleri esas alınarak aşağıda yazılı gösterge rakamlarının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarda, nakdi tazminat karar tarihini takip eden aybaşından başlamak üzere aylık bağlanır.</template>

      <mvz-fıkra no="2">
        <template>Ancak, herhangi bir sigortalılık statüsüne tabi çalışmaları olanlara bağlanacak ilk aylığın tutarı, aylık bağlanmasına ilişkin şartlar aranmaksızın bu aylığa hak kazanıldığı tarihteki unsurlar ve mevcut hizmet süreleri esas alınarak hesaplanacak emekli veya yaşlılık aylığının % 25 artırımlı tutarından az olamaz. Bunlardan aylık başlangıç tarihinden önce ilgili mevzuatı uyarınca aylık bağlanmış olanlara, durumuna göre belirlenecek gösterge rakamı karşılığı bulunacak aylık miktarından az olmamak üzere, aylık başlangıç tarihinde ödenmekte olan veya aylıkları kesilmiş olanlar için ödenebilecek emekli, yaşlılık veya malullük aylıkları % 25 oranında artırılır. Bu madde uyarınca aylık bağlananlar hakkında 5510 sayılı Kanunun 5 inci maddesinin birinci fıkrasının (c) bendi hükümleri uygulanır. Bu aylıklar, vefatları halinde, anne ve baba için herhangi bir şart aranmaksızın, 5510 sayılı Kanunun 34 üncü maddesi esas alınarak hak sahiplerine ölüm aylığı olarak intikal ettirilir. Bu şekilde aylığa hak kazanılmasından önce geçen her türlü sigortalılık ve prim ödeme süreleri, iştirakçilik ve fiili hizmet süreleri ile bunların itibari ve fiili hizmet süresi zammı olarak değerlendirilen süreleri; aylığa hak kazanılmasından sonra geçen sigortalılık ve çalışma sürelerinin tabi olacağı sigortalılık haliyle birleştirilmez ve sonradan geçen sigortalılık veya çalışma süreleri yaşlılık/emekli, malullük ya da ölüm/dul veya yetim aylığı bağlanmasında veya toptan ödeme yapılmasında ilgili mevzuatına göre ayrı bir çalışma veya sigortalılık süresi olarak değerlendirilir. Bu şekilde aylık bağlananlardan, 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında sigortalı olanlara, ikramiyeye esas hizmet süreleri için ayrıca emekli ikramiyesi ödenir. Ayrıca, aylık bağlandıktan sonraki çalışmaları için 5510 sayılı Kanunun geçici 4 üncü maddesi hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde uyarınca aylık bağlananlardan söz konusu yaralanmalarına bağlı olarak sonradan malul olduklarına karar verilenlere, karar tarihini takip eden aybaşından itibaren ilgisine göre bu Kanunun 21 inci maddesinin birinci fıkrası hükümleri uygulanır ve bu madde hükümlerine göre bağlanmış olan aylıkları vazife malullüğü aylığının başladığı tarihten itibaren kesilir. Bunlardan emekli ikramiyesine hak kazanacak olanların emekli ikramiyesinin hesabında daha önce ikramiye ödenen süreler dikkate alınmaz. Bu Kanunun 21 inci maddesi kapsamında vazife malullüğü aylığı bağlanmış olup, kontrol muayenesi sonucunda maluliyetlerinin sona erdiğine karar verilenlerden bu madde kapsamına girenlere, vazife malullüğü aylığına hak kazanıldığı tarihteki mevcut hizmet süreleri, unsurlar ve memur aylık katsayısı ile varsa almakta oldukları aylıklar esas alınarak birinci fıkra uyarınca hesaplanacak tutarın; aylık artışları ile artırılması sonucu bulunacak tutar üzerinden vazife malullüğünün kesildiği tarihten itibaren bu madde hükümleri uyarınca aylık bağlanır. Ancak, bu kapsamda aylık bağlanması sebebiyle ikramiye ödenmez.</template>

      <mvz-fıkra no="6">

      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Adli Tıp Kurumunca kullanılan tıbbî değerlendirme ölçütleri esas alınarak, olay tarihindeki yaralanmalarının hafif nitelikte olmayan yaralanma niteliği taşıdığı ve olay ile yaralanma arasında illiyet bağı bulunduğu en az bir adli tıp uzmanının yer aldığı sağlık kurulu raporuyla tespit edilenlerden; malul sayılmayan veya 13/7/1953 tarihli ve 4/1053 sayılı Bakanlar Kurulu Kararıyla yürürlüğe konulan Vazife Mâlûllüklerinin Nevileriyle Dereceleri Hakkında Nizamname hükümlerine göre derece tespiti yapılmayan Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığının erbaş ve erler dâhil askerî personeli, Millî İstihbarat Teşkilatı mensupları, Emniyet Teşkilatının Emniyet Hizmetleri Sınıfına mensup personeli ile güvenlik korucularının kendilerine olay tarihindeki mensubu oldukları kuruma bu madde kapsamında yaptıkları başvuru tarihini takip eden ay başından itibaren Sosyal Güvenlik Kurumu tarafından 17.135 gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarda aylık bağlanır. Bu madde kapsamında Sosyal Güvenlik Kurumunca ödenen aylıklar, faturası karşılığında iki ay içerisinde Hazineden tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamında yer alanların başvurusu üzerine olay tarihinde mensubu olunan kurum tarafından, yaralanmanın bu madde kapsamında olabileceğinin değerlendirilmesi halinde ilgili bilgi ve belgeler ile birlikte kişi Sağlık Bakanlığınca belirlenen hastanelere sevk edilir. İlgili hastanelerce, olay tarihindeki yaralanmanın bu madde kapsamında olup olmadığına ilişkin, mevcut tıbbi kayıtlar ve diğer sağlık belgeleri esas alınarak sağlık kurulu raporu düzenlenir ve ilgili kuruma gönderilir. Bu amaçla düzenlenecek olan sağlık raporlarından ücret alınmaz. Bu madde kapsamında olduğu tespit edilenlere ilişkin sağlık kurulu raporu ile diğer bilgi ve belgeler aylık bağlanması amacıyla ilgili kurum tarafından Sosyal Güvenlik Kurumuna gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde uyarınca aylık bağlananlardan söz konusu yaralanmalarına bağlı olarak sonradan malul olduklarına karar verilenler ile ek 3 üncü maddenin birinci fıkrası kapsamında derece tespiti yapılanlar hakkında, karar tarihini takip eden ay başından itibaren ilgisine göre 21 inci maddenin birinci fıkrası ile ek 3 üncü madde hükümleri uygulanır ve bu madde hükümlerine göre bağlanmış olan aylıkları vazife malullüğü aylığının ya da ek 3 üncü madde kapsamındaki aylığın başladığı tarihten itibaren kesilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde kapsamında aylık bağlananlar, aylık bağlanmasına ilişkin hükümler hariç olmak üzere 1005 sayılı Kanun kapsamındakiler için ilgili mevzuatında sağlanan diğer haklardan yararlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu madde hükümleri, yalnızca bu maddenin yürürlüğe girdiği tarihten önce meydana gelen olaylar hakkında bir defaya mahsus uygulanır. Bu tarihten sonra meydana gelen olaylar bakımından bu madde kapsamında yeni başvuru yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu madde kapsamındaki başvurular, bu maddenin yürürlüğe girdiği tarihten itibaren bir yıl içinde ilgililer tarafından olay tarihinde mensubu oldukları kurumlara yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
