  <mvz-künye tür="kanun" no="2960" başlık="BOĞAZİÇİ KANUNU"
             tarih="18/11/1983" rgazete-tarih="22/11/1983" rgazete-sayı="18229"
             düstur-tertip="5" düstur-cilt="22" düstur-sayfa="970" />
    
  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Tanımlar">
      <mvz-madde no="1" başlık="Amaç">
        <mvz-fıkra no="1">
          <template>Bu Kanunun amacı; İstanbul Boğaziçi Alanının kültürel ve tarihi değerlerini ve doğal güzelliklerini kamu yararı gözetilerek korumak ve geliştirmek ve bu alandaki nüfus yoğunluğunu artıracak yapılanmayı sınırlamak için uygulanacak imar mevzuatını belirlemek ve düzenlemektir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Tanımlar">
        <mvz-fıkra no="1">
          <template>Bu Kanunda kullanılan bazı terimlerin tanımları aşağıda gösterilmiştir.</template>
          <mvz-bent no="a">
            <template>Boğaziçi Alanı; Boğaziçi kıyı ve sahil şeridinden, öngörünüm bölgesinden, geri görünüm bölgesinden ve etkilenme bölgelerinden oluşan ve sınırları ve koordinatları bu Kanuna ekli krokide işaretli ve 22/7/1983 onay tarihli nazım planda gösterilen alandır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Boğaziçi sahil şeridi; Boğaziçi kıyı kenar çizgisi ile 22/7/1983 tarihli 1/5000 ölçekli nazım planında gösterilen hat arasında kalan bölgedir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Öngörünüm bölgesi; Boğaziçi sahil şeridine bitişik olan ve 22/7/1983 tarihli 1/1000 ölçekli imar uygulama planında gösterilen bölgedir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Geri görünüm bölgesi; öngörünüm bölgesine bitişik olan ve 22/7/1983 tarihli 1/5000 ölçekli nazım planında gösterilen coğrafi bölgedir.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Etkilenme bölgesi; öngörünüm ve geri görünüm bölgeleri dışında 22/7/1983 tarihli ve 1/5000 ölçekli nazım planında gösterilen ve Boğaziçi sahil şeridi, öngörünüm ve geri görünüm bölgelerinden etkilenen bölgedir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Genel Esaslar, Orman Alanları, Yeşil Sahalar">
      <mvz-madde no="3" başlık="Genel esaslar">
        <mvz-fıkra no="1">
          <template>Boğaziçi Alanının korunması ve geliştirilmesinde ve imar mevzuatının uygulanmasında aşağıdaki hususlar esas alınır.</template>
          <mvz-bent no="a">
            <template>Boğaziçi Alanında yer alan kültürel ve tarihi değerler ve doğal güzellikler muhafaza edilir ve doğal yapı korunur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Boğaziçi Alanı bu Kanunun amaçlarına uygun olarak ve doğal ve tarihi çevreye uyumu gözetilerek güzelleştirilir ve geliştirilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Boğaziçi Alanında tarihi ve milli kültürümüze dayanan yaşamın yeniden canlandırılması, mesire yerlerinin geliştirilmesi ve gezinti alışkanlıklarının sürdürülmesi teşvik edilir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Boğaziçi Alanındaki kültür ve tabiat varlıklarının onarımına öncelik verilir.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Boğaziçi Alanındaki yapılar bu Kanun hükümlerine ve imar planları esaslarına göre yapılır, aykırı olanlar derhal yıkılır veya yıktırılır.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Boğaziçi alanında mevcut planda nüfus ve yapı yoğunluğu göz önüne alınmak kaydı ile plan değişikliği yapılabilir.</template>
          </mvz-bent>
          <mvz-bent no="g" durum="iptal">
            <template></template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Boğaziçi sahil şeridi ve öngörünüm bölgesinde turizm ve rekreasyon amacı ile ayrılan alanlara toplumun yararlanmasına ayrılan yapı yapılır ve bu husus tapu sicillerine işlenir. Toplumun yararlanmasına ayrılan bu yapılar amaç dışı kullanılamaz.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Boğaziçi Alanında kıyılar ancak kamu yararına kullanılır.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Boğaziçi sahil şeridinde ancak toplumun yararlanacağı dinlenme, gezinti ve turizm tesisleri imar planlarına uygun olmak şartı ile yapılabilir.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Boğaziçi Alanında kıyıda ve sahil şeridinde boş alanlar veya boşaltılacak sahalar "j" fıkrasındaki esaslara göre değerlendirilir.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Boğaziçi Alanında kömür ve akaryakıt depoları, tersaneler ve sanayi tesisleri kurulamaz.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Boğaziçi su yolunda hurda gemi ve benzeri araçlar bırakılamaz.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Boğaziçi Alanında imar planlarında parseller için belirlenen kullanım kararları tapu sicillerine işlenir.</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Boğaziçi Alanında kamu hizmet ve tesislerine ayrılan alanlarda geçici inşaat müsaadesi verilmez. Ancak; Boğaziçi öngörünüm, geri görünüm ve etkilenme bölgelerinde kamu hizmet ve tesislerine ayrılan alanlarda 40 m2'yi geçemeyen bekçi kulübesi, büfe, çay ocağı gibi yapılara imar uygulama programı uygulanana kadar Boğaziçi İmar İdare Heyetince müsaade edilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="Orman alanları">
        <mvz-fıkra no="1">
          <template>Boğaziçi Alanı sınırları içinde Devlet ormanı statüsüne alınacak yerler, Boğaziçi İmar Yüksek Koordinasyon Kurulunca kararlaştırılır ve kamu kurum ve kuruluşlarına ait olanlar bedelsiz olarak Hazineye devredilir. Özel mülkiyete ait olanlar ise Tarım ve Orman Bakanlığınca kamulaştırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Devlet ormanı statüsüne alınan bu yerler, Tarım ve Orman Bakanlığınca hazırlanacak proje ve programa göre Boğaziçi Alanının doğal yapısına uygun olarak düzenlenir, ağaçlandırılır parklar ve mesire yerleri yapılır ve bunların bakımı, işletilmesi ve muhafazası sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Devlet ormanı statüsüne alınan bu yerlerde 6831 sayılı Orman Kanununun 2 nci maddesi uygulaması yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Boğaziçi Alanı içindeki ormanlarda intifa ve irtifak hakkı tesis edilemez. Ancak bu Kanunun amacına uygun intifa ve irtifak hakkı, Boğaziçi İmar İdare Heyetinin teklifi üzerine ilgili bakanlıklarca tesis edilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Yeşil alanlar">
        <mvz-fıkra no="1">
          <template>Boğaziçi Alanında orman sayılmayan kamu kurum ve kuruluşlarına veya özel mülkiyete ait koru, koruya katılacak alan, çayır, mesire yeri, bostan ve benzeri alanlar yeşil alan sayılır ve bitki varlıkları geliştirilerek muhafaza edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu alanlardaki ağaç varlıklarının yok edilmesi veya tahrip edilmesi yasaktır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yeşil alan sayılan yerlerde mahalli mahsullerin yetiştirilmesine devam edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İmar planında yeşil alan olarak belirlenen arsaların ağaçlandırılması için gerekli tedbirler Boğaziçi İmar Müdürlüğünce alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Boğaziçi Alanındaki yabancı ülke temsilciliklerine ait koruların bu nitelikleri korunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Organlar ve Uygulama Hükümleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Organlar">
      <mvz-madde no="6" başlık="Kuruluş">
        <mvz-fıkra no="1">
          <template>Bu Kanun amaçları doğrultusunda Boğaziçi Alanında yerleşme ve yapılaşmanın planlanması, koordinasyonu, imar uygulamalarının yapılması ve denetlenmesi için Boğaziçi İmar Yüksek Koordinasyon Kurulu, Boğaziçi İmar İdare Heyeti ve Boğaziçi İmar Müdürlüğü kurulmuştur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Boğaziçi İmar Yüksek Koordinasyon Kurulu">
        <mvz-fıkra no="1">
          <template>Boğaziçi İmar Yüksek Koordinasyon Kurulu; Başbakan veya görevlendireceği Devlet Bakanı ve Başbakan Yardımcısının başkanlığında, İmar ve İskan Milli Savunma, Maliye, İçişleri, Bayındırlık, Sağlık ve Sosyal Yardım, Ulaştırma, Tarım ve Orman, Kültür ve Turizm, Sanayi ve Teknoloji, Enerji ve Tabii Kaynaklar bakanlarından oluşur. Gerektiğinde ilgili kurum ve kuruluşların temsilcileri kurul toplantılarına çağrılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurulun sekreterya hizmeti İmar ve İskan Bakanlığınca yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Boğaziçi İmar Yüksek Koordinasyon Kurulu yılda en az iki defa toplanır ve çalışma esasları Başbakanlıkça belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Boğaziçi İmar Yüksek Koordinasyon Kurulunun görevleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Boğaziçi imar planlarının yapılmasını kararlaştırmak, imar planlarını ve diğer ilgili planları görüşmek ve kabul etmek,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Boğaziçi imar uygulama programlarını onaylamak,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Boğaziçi imar uygulama programları gereği kamu yatırımlarını planlamak ve Bakanlar Kurulunun onayına sunmak,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Boğaziçi İmar Müdürlüğünün mali yardım isteklerini incelemek ve karara bağlamak,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İmar ve İskan Bakanlığınca getirilen Boğaziçi Alanı ile ilgili konuları görüşmek ve kararlaştırmak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Boğaziçi İmar İdare Heyeti">
        <mvz-fıkra no="1">
          <template>Boğaziçi İmar İdare Heyeti, İstanbul Valisinin başkanlığında İstanbul Belediye Başkanı, İstanbul İl Hukuk İşleri Müdürü, İl İmar Müdürü, İl Sağlık Müdürü, Defterdar, Boğaziçi İmar Müdürü, İstanbul Belediyesi İmar Müdürü Vali ve Belediye Başkanının tayin edecekleri birer uzman, Taşınmaz Kültür ve Tabiat Varlıkları Bölge Kurulu Başkanı, Yükseköğretim Kurulunca belirlenecek ilgili bilim dalı öğretim üyesi olmak üzere oniki üyeden oluşur. Gerektiğinde ilgili kurum ve kuruluşların temsilcileri toplantılara çağrılabilir. Boğaziçi İmar İdare Heyetinin sekreterya hizmeti Boğaziçi İmar Müdürlüğünce yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Boğaziçi İmar İdare Heyeti ayda en az iki defa, ayrıca valinin çağrısı üzerine toplanır çalışma ve karar alma esasları Valilikçe belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Boğaziçi İmar İdare Heyetinin görevleri şunlardır,</template>
          <mvz-bent no="a">
            <template>Boğaziçi İmar planını ve diğer ilgili planların görüşmek ve mütalaası ile birlikte İmar ve İskan Bakanlığına sunmak,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Boğaziçi imar uygulama programlarını görüşmek ve İmar ve İskan Bakanlığına sunmak.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Boğaziçi imar uygulama programları gereği kamu yatırımlarını planlamak ve İmar ve İskan Bakanlığına sunmak,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Boğaziçi İmar Müdürlüğünün mali yardım isteğini görüşmek ve talepleri İmar ve İskan Bakanlığına sunmak.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Boğaziçi İmar Müdürlüğünün bütçesini görüşmek ve karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Bu Kanun hükümlerine göre tespit ve teklif edilen yıkım işlerini görüşmek ve karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Boğaziçi İmar Müdürlüğünce gündeme getirilen konuları görüşmek ve karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Bu Kanunla verilen diğer görevleri yapmak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Boğaziçi İmar Müdürlüğü">
        <mvz-fıkra no="1">
          <template>İstanbul Belediyesine bağlı kamu tüzelkişiliğine sahip Boğaziçi İmar Müdürlüğü; Boğaziçi İmar Müdürü, en çok üç müdür yardımcısı ile gerekli planlama, plan uygulama, yapı kontrol, idare ve destek birimlerinden oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Boğaziçi Alanında bu Kanunun amacına uygun olarak faaliyetlerin planlanmasından, koordinesinden ve uygulanmasından, Boğaziçi Alanının genel görünüm ve estetiğinin ve tarihi ve doğal mimari özelliklerinin korunmasından birinci derecede sorumlu olan Boğaziçi İmar Müdürü, en az lisans düzeyinde yükseköğrenim görmüş kişiler arasından, İstanbul Belediye Başkanının inhası, İstanbul Valisinin teklifi üzerine İmar ve İskan Bakanlığınca atanır. Müdür yardımcıları, Müdürde aranan şartları taşıyan kişiler arasından aynı usulle atanır. Diğer görevlilerin atanması genel hükümlere göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Boğaziçi İmar Müdürlüğünde görevli müdür ve yardımcıları ile diğer görevliler 657 sayılı Devlet Memurları Kanunu hükümlerine tabidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Boğaziçi İmar Müdürlüğünün görevleri şunlardır;</template>
          <mvz-bent no="a">
            <template>Boğaziçi imar planlarını ve Boğaziçi Alanında bu Kanunun amacına uygun yatırımları ve ilgili diğer faaliyetleri düzenleyen imar uygulama programlarını ve ilgili diğer planları hazırlamak ve Belediye Başkanlığına sunmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Boğaziçi İmar Müdürlüğünün bütçesini hazırlamak. Belediye Başkanının muvafakatı ile İmar İdare Heyetine sunmak.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Boğaziçi Alanında imar uygulamalarını, ruhsat ve izin işlemlerini yürütmek.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Boğaziçi Alanında yapıları ve inşaatları kontrol etmek.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İmar mevzuatına aykırı yapılar hakkında alınan yıkım kararlarını uygulamak.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Bu Kanunla verilen diğer görevleri yapmak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Planlar ve İmar Uygulamaları">
      <mvz-madde no="10" başlık="İmar planlarının yapılması, onayı ve tadili">
        <mvz-fıkra no="1">
          <template>"Geri görünüm" bölgesinde Taban Alan Kat Sayısı (T.A.K.S.) azami % 15 ve 4 katı (H = 12.50 m. irtifaı), "Etkilenme" bölgesinde ise gene Taban Alanı Kat Sayısı (T.A.K.S.) % 15 ve 5 katı (H = 15.50 m. irtifaı) geçmemek şartı ile konut yapılabilir. Daha önce belediyeye bilabedel terk edilmiş veya edilecek olan alanlar bu hesaba dahil edilir. Hesabat brüt alan üzerinden yapılır 1/1/1982 den sonra alınmış "Yüksek Anıtlar Kurulunun" kararları ile 22/7/1983 onay tarihli planda kazanılmış haklar saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, kat alanı ve irtifa ne olursa olsun İmar Kanununun ilgili maddelerine göre yapı sahipleri ruhsat ve iskan alma mecburiyetinde olup, bu işlemler yalnızca ilgili İlçe Belediye Başkanlıklarınca avan ve tatbikat projelerine göre verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gerekli görüldüğü takdirde "Boğaziçi Alanı" için yapılan planların revize edilmesi "geri görünüm" ve "etkilenme" bölgelerinde 3030 sayılı Kanuna göre, "sahil şeridi" ve "öngörünüm" bölgelerinde İstanbul Büyük Şehir Belediyesince hazırlanarak Belediye Meclisinin kararı ve Belediye Başkanının onayından sonra "Boğaziçi İmar Yüksek Koordinasyon Kurulu" onayı ile yürürlüğe girer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İlgili kamu kurum ve kuruluşları ile meslek kuruluşları, Büyük Şehir Belediye Başkanlığında bir ay süre ile ilan edilen "Sahil Şeridi" ve "Öngörünüm" bölgeleri ile ilgili planlara itiraz edebilir. Ancak, itirazlar yürürlüğü durdurmaz. Belediye Başkanlığı planı itirazları ile inceler ve görüşünü de ekleyerek Belediye Meclisine sunar. Belediye Meclisi durumu bir ay içinde inceleyerek karara varır. Netice, Büyük Şehir Belediye Başkanının ve Boğaziçi İmar Yüksek Koordinasyon Kurulunun onayı ile kesinleşir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Plan değişiklikleri de aynı usule göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Boğaziçi İmar Müdürlüğünün bütçesi, personeli ve gelirleri de İstanbul Büyük Şehir Belediye Başkanlığına aktarılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Yapının denetimi">
        <mvz-fıkra no="1">

            <template>Boğaziçi sahil şeridi, öngörünüm, etkilenme ve geri görünüm bölgelerindeki yapılardan (5) misli bina inşaat harcı ve ekli cetvele göre tahakkuk ettirilen ilave harç bir defaya mahsus olmak üzere tahsil olunur.</template>
          </mvz-bent>
          <mvz-bent no="b" durum="mülga">
            <template></template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Boğaziçi Alanında bulunan ve 2/6/1981 tarihinden önce yapılan gecekonduların sahiplerinden hak sahipliği belirlenenlere, sahil şeridi ve öngörünüm bölgesinden başlamak üzere Boğaziçi Alanı dışındaki 16/3/1983 tarih ve 2805 sayılı Kanuna göre ıslah imar planı yapılan alanlarda veya gecekondu önleme ve ıslah bölgelerinde İstanbul Belediye Başkanlığınca beş yıl içinde arsa veya konut tahsisinde öncelik verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Boğaziçi sahil şeridinde kıyı kenar çizgisine bitişik parsellerin kıyı tarafında, Boğaziçi İmar Müdürlüğünce lüzum görülen hallerde, bu Kanunun yürürlüğe girdiği tarihten itibaren beş yıl içinde gezinti mahalli yapılmak üzere yeteri kadar arazi kamulaştırılabilir. Bu kamulaştırma kararı, kamu yararı kararı sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Boğaziçi Alanında mevcut bulunan taş, kum, kireç, tuğla ocağı gibi doğal güzellikleri bozan veya tahrip eden tesisler 1984 yılı sonuna kadar kapatılır. Bozulan ve tahrip edilen doğal güzellikler Boğaziçi İmar Müdürlüğünce doğal yapıya uygun hale getirilir ve ruhsatsız olan veya ruhsata aykırı olanlara ait masraflar kişi ve kuruluşlardan tahsil edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Boğaziçi Alanında kömür ve akaryakıt depoları ve tersaneler ve sanayi gibi kullanımlar 1985 yılı sonuna kadar Bakanlar Kurulunca alınacak kararda öngörülen süre içinde başka bölgelere nakledilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>16/3/1983 tarih ve 2805 sayılı Kanuna göre tespit edilecek Boğaziçi Alanındaki gecekondu arsa kullanım bedelleri 1/4/1983 tarihinden itibaren bir misli fazla alınır ve Boğaziçi İmar Müdürlüğüne aktarılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Yürürlük">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 15 ve 16 ncı maddelerinde belirlenen gelirlere ilişkin hükümleri 1/1/1984 tarihinde, diğer hükümleri ise yayımı tarihinde yürürlüğe girer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Yürütme">
        <mvz-fıkra no="1">
          <template>Bu Kanunu Bakanlar Kurulu yürütür.</template>
        </mvz-fıkra>
      </mvz-madde>
