  <mvz-künye tür="kanun" no="1739" başlık="MİLLİ EĞİTİM TEMEL KANUNU"
             tarih="14/6/1973" rgazete-tarih="24/6/1973" rgazete-sayı="14574"
             düstur-tertip="5" düstur-cilt="12" düstur-sayfa="2342" />
  
  <mvz-giriş başlık="Giriş">
    <mvz-b2 no="I" başlık="Kanunun kapsamı">
      <mvz-madde no="1" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanun, Türk milli eğitiminin düzenlenmesinde esas olan amaç ve ilkeler, eğitim sisteminin genel yapısı, öğretmenlik mesleği, okul bina ve tesisleri, eğitim araç ve gereçleri ve Devletin eğitim ve öğretim alanındaki görev ve sorumluluğu ile ilgili temel hükümleri bir sistem bütünlüğü içinde kapsar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
  </mvz-giriş>
  <mvz-kısım no="1-BİRİNCİ" başlık="Türk Milli Eğitim Sistemini Düzenleyen Genel Esaslar">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Türk Milli Eğitiminin Amaçları">
      <mvz-b2 no="I" başlık="Genel amaçlar">
        <mvz-madde no="2" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Milli Eğitiminin genel amacı, Türk Milletinin bütün fertlerini,</template>
            <mvz-bent no="1.">
              <template>Atatürk inkılap ve ilkelerine ve Anayasada ifadesini bulan Atatürk milliyetçiliğine bağlı; Türk Milletinin milli, ahlaki, insani, manevi ve kültürel değerlerini benimseyen, koruyan ve geliştiren; ailesini, vatanını, milletini seven ve daima yüceltmeye çalışan, insan haklarına ve Anayasanın başlangıcındaki temel ilkelere dayanan demokratik, laik ve sosyal bir hukuk Devleti olan Türkiye Cumhuriyetine karşı görev ve sorumluluklarını bilen ve bunları davranış haline getirmiş yurttaşlar olarak yetiştirmek;</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Beden, zihin, ahlak, ruh ve duygu bakımlarından dengeli ve sağlıklı şekilde gelişmiş bir kişiliğe ve karaktere, hür ve bilimsel düşünme gücüne, geniş bir dünya görüşüne sahip, insan haklarına saygılı, kişilik ve teşebbüse değer veren, topluma karşı sorumluluk duyan; yapıcı, yaratıcı ve verimli kişiler olarak yetiştirmek;</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>İlgi, istidat ve kabiliyetlerini geliştirerek gerekli bilgi, beceri, davranışlar ve birlikte iş görme alışkanlığı kazandırmak suretiyle hayata hazırlamak ve onların, kendilerini mutlu kılacak ve toplumun mutluluğuna katkıda bulunacak bir meslek sahibi olmalarını sağlamak;</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Böylece bir yandan Türk vatandaşlarının ve Türk toplumunun refah ve mutluluğunu artırmak; öte yandan milli birlik ve bütünlük içinde iktisadi, sosyal ve kültürel kalkınmayı desteklemek ve hızlandırmak ve nihayet Türk Milletini çağdaş uygarlığın yapıcı, yaratıcı, seçkin bir ortağı yapmaktır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Özel amaçlar">
        <mvz-madde no="3" başlık="">
          <mvz-fıkra no="1">
            <template>Türk eğitim ve öğretim sistemi, bu genel amaçları gerçekleştirecek şekilde düzenlenir ve çeşitli derece ve türdeki eğitim kurumlarının özel amaçları, genel amaçlara ve aşağıda sıralanan temel ilkelere uygun olarak tespit edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Türk Milli Eğitiminin Temel İlkeleri">
      <mvz-b2 no="I" başlık="Genellik ve eşitlik">
        <mvz-madde no="4" başlık="">
          <mvz-fıkra no="1">
            <template>Eğitim kurumları dil, ırk, cinsiyet, engellilik ve din ayırımı gözetilmeksizin herkese açıktır. Eğitimde hiçbir kişiye, aileye, zümreye veya sınıfa imtiyaz tanınamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Ferdin ve toplumun ihtiyaçları">
        <mvz-madde no="5" başlık="">
          <mvz-fıkra no="1">
            <template>Milli eğitim hizmeti, Türk vatandaşlarının istek ve kabiliyetleri ile Türk toplumunun ihtiyaçlarına göre düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Yöneltme">
        <mvz-madde no="6" başlık="">
          <mvz-fıkra no="1">
            <template>Fertler, eğitimleri süresince, ilgi, istidat ve kabiliyetleri ölçüsünde ve doğrultusunda çeşitli programlara veya okullara yöneltilerek yetiştirilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Milli eğitim sistemi, her bakımdan, bu yöneltmeyi gerçekleştirecek biçimde düzenlenir. Bu amaçla, ortaöğretim kurumlarına, eğitim programlarının hedeflerine uygun düşecek şekilde hazırlık sınıfları konulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yöneltmede ve başarının ölçülmesinde rehberlik hizmetlerinden ve objektif ölçme ve değerlendirme metotlarından yararlanılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Eğitim hakkı">
        <mvz-madde no="7" başlık="">
          <mvz-fıkra no="1">
            <template>İlköğretim görmek her Türk vatandaşının hakkıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İlköğretim kurumlarından sonraki eğitim kurumlarından vatandaşlar ilgi, istidat ve kabiliyetleri ölçüsünde yararlanırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="V" başlık="Fırsat ve imkan eşitliği">
        <mvz-madde no="8" başlık="">
          <mvz-fıkra no="1">
            <template>Eğitimde kadın, erkek herkese fırsat ve imkan eşitliği sağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Maddi imkanlardan yoksun başarılı öğrencilerin en yüksek eğitim kademelerine kadar öğrenim görmelerini sağlamak amacıyle parasız yatılılık, burs, kredi ve başka yollarla gerekli yardımlar yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Özel eğitime ve korunmaya muhtaç çocukları yetiştirmek için özel tedbirler alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="VI" başlık="Süreklilik">
        <mvz-madde no="9" başlık="">
          <mvz-fıkra no="1">
            <template>Fertlerin genel ve mesleki eğitimlerinin hayat boyunca devam etmesi esastır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gençlerin eğitimi yanında, hayata ve iş alanlarına olumlu bir şekilde uymalarına yardımcı olmak üzere, yetişkinlerin sürekli eğitimini sağlamak için gerekli tedbirleri almak da bir eğitim görevidir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="VII" başlık="Atatürk İnkılap ve İlkeleri ve Atatürk Milliyetçiliği">
        <mvz-madde no="10" başlık="">
          <mvz-fıkra no="1">
            <template>Eğitim sistemimizin her derece ve türü ile ilgili ders programlarının hazırlanıp uygulanmasında ve her türlü eğitim faaliyetlerinde Atatürk inkılap ve ilkeleri ve Anayasada ifadesini bulmuş olan Atatürk milliyetçiliği temel olarak alınır. Milli ahlak ve milli kültürün bozulup yozlaşmadan kendimize has şekli ile evrensel kültür içinde korunup geliştirilmesine ve öğretilmesine önem verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Milli birlik ve bütünlüğün temel unsurlarından biri olarak Türk dilinin, eğitimin her kademesinde, özellikleri bozulmadan ve aşırılığa kaçılmadan öğretilmesine önem verilir; çağdaş eğitim ve bilim dili halinde zenginleşmesine çalışılır ve bu maksatla Atatürk Kültür, Dil ve Tarih Yüksek Kurumu ile işbirliği yapılarak Mili Eğitim Bakanlığınca gereken tedbirler alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="VIII" başlık="Demokrasi eğitimi">
        <mvz-madde no="11" başlık="">
          <mvz-fıkra no="1">
            <template>Güçlü ve istikrarlı, hür ve demokratik bir toplum düzeninin gerçekleşmesi ve devamı için yurttaşların sahip olmaları gereken demokrasi bilincinin, yurt yönetimine ait bilgi, anlayış ve davranışlarla sorumluluk duygusunun ve manevi değerlere saygının, her türlü eğitim çalışmalarında öğrencilere kazandırılıp geliştirilmesine çalışılır; ancak, eğitim kurumlarında Anayasada ifadesini bulan Atatürk milliyetçiliğine aykırı siyasi ve ideolojik telkinler yapılmasına ve bu nitelikteki günlük siyasi olay ve tartışmalara karışılmasına hiçbir şekilde meydan verilmez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="IX" başlık="Laiklik">
        <mvz-madde no="12" başlık="">
          <mvz-fıkra no="1">
            <template>Türk milli eğitiminde laiklik esastır. Din kültürü ve ahlak öğretimi ilköğretim okulları ile lise ve dengi okullarda okutulan zorunlu dersler arasında yer alır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="X" başlık="Bilimsellik">
        <mvz-madde no="13" başlık="">
          <mvz-fıkra no="1">
            <template>Her derece ve türdeki ders programları ve eğitim metotlarıyle ders araç ve gereçleri, bilimsel ve teknolojik esaslara ve yeniliklere, çevre ve ülke ihtiyaçlarına göre sürekli olarak geliştirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eğitimde verimliliğin artırılması ve sürekli olarak gelişme ve yenileşmenin sağlanması bilimsel araştırma ve değerlendirmelere dayalı olarak yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bilgi ve teknoloji üretmek ve kültürümüzü geliştirmekle görevli eğitim kurumları gereğince donatılıp güçlendirilir; bu yöndeki çalışmalar maddi ve manevi bakımından teşvik edilir ve desteklenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="XI" başlık="Planlılık">
        <mvz-madde no="14" başlık="">
          <mvz-fıkra no="1">
            <template>Milli eğitimin gelişmesi iktisadi, sosyal ve kültürel kalkınma hedeflerine uygun olarak eğitim - insangücü - istihdam ilişkileri dikkate alınmak suretiyle, sanayileşme ve tarımda modernleşmede gerekli teknolojik gelişmeyi sağlayacak mesleki ve teknik eğitime ağırlık verecek biçimde planlanır ve gerçekleştirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mesleklerin kademeleri ve her kademenin unvan, yetki ve sorumlulukları kanunla tespit edilir ve her derece ve türdeki örgün ve yaygın mesleki eğitim kurumlarının kuruluş ve programları bu kademelere uygun olarak düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Eğitim kurumlarının yer, personel, bina, tesis ve ekleri, donatım, araç, gereç ve kapasiteleri ile ilgili standartlar önceden tespit edilir ve kurumların bu standartlara göre optimal büyüklükte kurulması ve verimli olarak işletilmesi sağlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="XII" başlık="Karma eğitim">
        <mvz-madde no="15" başlık="">
          <mvz-fıkra no="1">
            <template>Okullarda kız ve erkek karma eğitim yapılması esastır. Ancak eğitimin türüne, imkan ve zorunluluklara göre bazı okullar yalnızca kız veya yalnızca erkek öğrencilere ayrılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="XIII" başlık="Eğitim kampüsleri ve okul ile ailenin işbirliği">
        <mvz-madde no="16" başlık="">
          <mvz-fıkra no="1">
            <template>Aynı alan içinde birden fazla örgün ve/veya yaygın eğitim kurumunun bir arada bulunması halinde eğitim kampüsü kurulabilir ve bunların ortak ihtiyaçlarını karşılamak üzere eğitim kampüsü yönetimi oluşturulabilir. Eğitim kampüsü bünyesindeki ortak açık alan, kantin, salon ve benzeri yerlerin işlettirilmesi veya işletilmesi kampüs yönetimince yerine getirilir. Bu şekilde elde edilen gelirler, kampüsün ortak giderlerinde kullanılır. Eğitim kampüslerinin kuruluşu, yönetiminin oluşumu, gelirlerinin harcanması ve denetlenmesi ile bu fıkrada belirtilen diğer hususlar Maliye Bakanlığı ve Milli Eğitim Bakanlığınca müştereken hazırlanan yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eğitim kurumlarının amaçlarının gerçekleştirilmesine katkıda bulunmak için okul ile aile arasında işbirliği sağlanır. Bu amaçla okullarda okul-aile birlikleri kurulur. Okul-aile birlikleri, okulların eğitim ve öğretim hizmetlerine etkinlik ve verimlilik kazandırmak, okulların ve maddi imkânlardan yoksun öğrencilerin zorunlu ihtiyaçlarını karşılamak üzere; aynî ve nakdî bağışları kabul edebilir, maddi katkı sağlamak amacıyla sosyal ve kültürel etkinlikler ve kampanyalar düzenleyebilir, okulların bünyesinde bulunan açık alan, kantin, salon ve benzeri yerleri işlettirebilir veya işletebilirler. Öğrenci velileri hiçbir surette bağış yapmaya zorlanamaz. Okul-aile birliklerinin kuruluş ve işleyişi, birlik organlarının oluşturulması ve seçim şekilleri, sosyal ve kültürel etkinliklerden sağlanan maddi katkılar, bağışların kabulü, harcanması ve denetlenmesi ile açık alan, kantin, salon ve benzeri yerlerin işlettirilmesi veya işletilmesinden sağlanan gelirlerin dağıtım yerleri ve oranları, harcanması ve denetlenmesine dair usul ve esaslar, Maliye Bakanlığı ve Milli Eğitim Bakanlığınca müştereken hazırlanan yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Milli Eğitim Bakanlığınca belirlenecek usul ve esaslar çerçevesinde, gerekli görülen hallerde il milli eğitim müdürlükleri; il sınırları içerisinde bulunan bir veya birden fazla eğitim kampüsü yönetiminin veya okul-aile birliğinin işlettirebileceği veya işletebileceği yerlere ilişkin ihaleleri bunlar adına yapmaya yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Eğitim kampüsleri ve okul-aile birliklerinin gelirleri, genel bütçe gelirleri ile ilişkilendirilmeksizin eğitim kampüsü yönetimi ve okul-aile birliği adına bankalarda açılan özel hesaplarda tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Eğitim kampüsü yönetimleri ve okul-aile birlikleri, bu madde kapsamında yapacakları işlemler ve düzenlenen kâğıtlar yönünden damga vergisi ve harçlardan muaf; bunlara ve bunlar tarafından yapılan bağış ve yardımlar ise veraset ve intikal vergisinden müstesnadır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="XIV" başlık="Her yerde eğitim">
        <mvz-madde no="17" başlık="">
          <mvz-fıkra no="1">
            <template>Milli eğitimin amaçları yalnız resmi ve özel eğitim kurumlarında değil, aynı zamanda evde, çevrede, işyerlerinde, her yerde ve her fırsatta gerçekleştirilmeye çalışılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Resmi, özel ve gönüllü her kuruluşun eğitimle ilgili faaliyetleri, Milli Eğitim amaçlarına uygunluğu bakımından Milli Eğitim Bakanlığının denetimine tabidir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Türk Milli Eğitim Sisteminin Genel Yapısı">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-b2 no="I" başlık="Örgün ve yaygın eğitim">
        <mvz-madde no="18" başlık="">
          <mvz-fıkra no="1">
            <template>Türk milli eğitim sistemi, örgün eğitim ve yaygın eğitim olmak üzere, iki anabölümden kurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Örgün eğitim, okul öncesi eğitimi, ilköğretim, ortaöğretim ve yükseköğretim kurumlarını kapsar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yaygın eğitim, örgün eğitim yanında veya dışında düzenlenen eğitim faaliyetlerinin tümünü kapsar.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Örgün Eğitim">
      <mvz-b1 no="A" başlık="Okul öncesi eğitimi">
        <mvz-b2 no="I" başlık="Kapsam">
          <mvz-madde no="19" başlık="">
            <mvz-fıkra no="1">
              <template>Okul öncesi eğitimi, mecburi ilköğrenim çağına gelmemiş çocukların eğitimini kapsar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu eğitim isteğe bağlıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Amaç ve görevler">
          <mvz-madde no="20" başlık="">
            <mvz-fıkra no="1">
              <template>Okul öncesi eğitiminin amaç ve görevleri, milli eğitimin genel amaçlarına ve temel ilkelerine uygun olarak,</template>
              <mvz-bent no="1.">
                <template>Çocukların beden, zihin ve duygu gelişmesini ve iyi alışkanlıklar kazanmasını sağlamak;</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Onları ilk öğretime hazırlamak;</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Şartları elverişsiz çevrelerden ve ailelerden gelen çocuklar için ortak bir yetişme ortamı yaratmak;</template>
              </mvz-bent>
              <mvz-bent no="4.">
                <template>Çocukların Türkçeyi doğru ve güzel konuşmalarını sağlamaktır.</template>
              </mvz-bent>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Kuruluş">
          <mvz-madde no="21" başlık="">
            <mvz-fıkra no="1">

          </mvz-fıkra>

            <template>Mesleki ve teknik yaygın eğitim faaliyetlerini yürüten Bakanlıklar ile özerk eğitim kurumları ve resmi ve özel işletmeler arasında Milli Eğitim Bakanlığınca sağlanacak koordinasyon ve işbirliğinin esasları kanunla düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Öğretmenlik Mesleği">
    <mvz-b2 no="I" başlık="Öğretmenlik">
      <mvz-madde no="43" başlık="" durum="mülga">
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="II" başlık="Milli Eğitim Bakanlığına bağlı Eğitim Yüksekokulu açma yetkisi">
      <mvz-madde no="44" başlık="">
        <mvz-fıkra no="1">
          <template>Öğretmenlik formasyonu veren ve öğretmen yetiştiren Milli Eğitim Bakanlığına bağlı eğitim yüksekokulları, Cumhurbaşkanı kararı ile kurulabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="III" başlık="Öğretmenlerin nitelikleri ve seçimi">
      <mvz-madde no="45" başlık="" durum="mülga">
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="IV" başlık="Öğretmenlerin bölge hizmeti">
      <mvz-madde no="46" başlık="">
        <mvz-fıkra no="1">
          <template>Öğretmenlikte yurdun çeşitli bölgelerinde görev yapmak esastır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hizmet bölgeleri ve ihtiyaçlara göre bu bölgelerarası yer değiştirme esasları yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="V" başlık="Uzman ve usta ögreticiler">
      <mvz-madde no="47" başlık="">
        <mvz-fıkra no="1">
          <template>Örgün ve yaygın eğitim kurumlarında ve hizmetiçi yetiştirme kurs, seminer ve konferanslarında uzman ve usta öğreticiler de geçici veya sürekli olarak görevlendirilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Öğretim tür ve seviyelerine göre uzman ve usta öğreticilerin seçimlerinde aranacak şartlar, görev ve yetkileri, yönetmeliklerle tespit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="VI" başlık="Öğretmenlerin hizmet içi yetiştirilmesi">
      <mvz-madde no="48" başlık="">
        <mvz-fıkra no="1">
          <template>Öğretmenlerin daha üst öğrenim görmelerini sağlamak üzere yaz ve akşam okulları açılır veya hizmet içinde yetiştirilmeleri maksadıyle kurslar ve seminerler düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yaz ve akşam okulları öğretmen yetiştiren kurumlarca açılır; bunlara devam ederek yeterli krediyi dolduran öğretmenlere o kurumun belge veya diploması verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Milli Eğitim Bakanlığınca açılan kurs ve seminerlere devam edenlerden başarı sağlayanlara belge verilir. Bu belgelerin, öğretmenlerin atama, yükselme ve nakillerinde ne ölçüde ve nasıl değerlendirileceği yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="VII" başlık="Yurt içi ve yurt dışı yetişme imkanları">
      <mvz-madde no="49" başlık="">
        <mvz-fıkra no="1">
          <template>Yurt içinde ve dışında daha üst öğrenim yapmak veya bilgi, görgü ve ihtisaslarını arttırmak isteyen öğretmenlerin belli şartlarla, aylıklı veya aylıksız izinli sayılmaları sağlanır; bu şartlar, milli eğitimin ihtiyaçları gözönünde tutularak, hazırlanacak yönetmelikle belirtilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="VIII" başlık="Öğretmen konutları">
      <mvz-madde no="50" başlık="">
        <mvz-fıkra no="1">
          <template>Milli Eğitim Bakanlığınca gerekli görülen yerlerde, özellikle mahrumiyet bölgelerinde görevli öğretmenlere konut sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Konutlar okul binaları ile birlikte planlanır ve yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Eski eğitim kurumlarının konut ihtiyacı bir plana bağlanır ve bu konutların yapımı için, her yıl Milli Eğitim Bakanlığı Bütçesine gerekli ödenek konur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="IX" başlık="Öğretmenlerin izin ve tatilleri">
      <mvz-madde no="50/A" başlık="">
        <mvz-fıkra no="1">
          <template>Öğretmenler, yaz tatili içinde aralıksız iki ay izinlidirler. Ancak bu iki aylık izin sürelerine dokunulmadan kalan tatil zamanlarında yönetmelikle belirlenecek meslekle ilgili çalışmalara katılmakla yükümlüdürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Rehberlik öğretmenleri tercih danışmanlığı, alan ve ders seçimi, öğrenci tanılama sürecine bağlı olarak yapılacak çalışmalarda ihtiyaç duyulması halinde izin ve tatil dönemlerinde de görevlendirilebilir. Bu durumda rehberlik öğretmenlerinin izinleri bir aydan az olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlçe, il veya ülke genelinde genel hayatı etkileyen salgın hastalık, doğal afet, elverişsiz hava koşulları gibi nedenlerle eğitim ve öğretim faaliyetinin iki haftadan fazla süreyle yapılamaması halinde uygulanacak telafi programlarının ders yılı içerisinde tamamlanamadığı durumlarda yaz tatilinde yapılacak eğitim ve öğretim faaliyetleri nedeniyle Milli Eğitim Bakanlığınca öğretmenlerin izinleri kısaltılabilir. Bu durumda öğretmenlerin izinleri bir aydan az olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kendilerine ikinci görev olarak okul/kurum yöneticiliği verilenler ve yüz yüze eğitim yapılmayan eğitim kurumlarında görevli öğretmenler ile Bakanlık merkez teşkilatı ve il/ilçe milli eğitim müdürlüklerinde görevlendirilen  öğretmenler yıllık izinlerini 657 sayılı Devlet Memurları Kanununun 102 nci maddesi ve 103 üncü maddesinin birinci fıkrası hükümlerine göre kullanır. Okul müdürleriyle müdür yardımcıları tatil aylarında okul işlerini ayarlamak ve düzenlemek şartı ile, sıra ile izinlerini kullanırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Okul Binaları ve Tesisleri">
    <mvz-madde no="51" başlık="">
      <mvz-fıkra no="1">
        <template>Her derece ve türdeki eğitim kurumlarına ait bina ve tesisler çevrenin ihtiyaçlarına ve uygulanacak programların özelliklerine göre Milli Eğitim Bakanlığınca planlanır ve yaptırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maksatla her yıl Milli Eğitim Bakanlığı bütçesine gerekli ödenek konur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arsa temini ile okul bina ve tesislerin yapım ve donatımında, Devletin azami imkanlarının kullanılması yanında vatandaşların her türlü yardımlarından da yararlanılır ve yardımlar teşvik edilir ve değerlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Milli Eğitim Bakanlığına tahsisli Hazine mülkiyetindeki taşınmazların Milli Eğitim Bakanlığı ile mutabık kalınarak tahsislerini kaldırmaya ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununun 46 ncı maddesine bağlı olmaksızın satışına Maliye Bakanı yetkilidir. Ayrıca bu taşınmazlardan Milli Eğitim Bakanlığınca uygun görülenler, Maliye Bakanlığı tarafından, 24/11/1994 tarihli ve 4046 sayılı Özelleştirme Uygulamaları Hakkında Kanun hükümleri çerçevesinde özelleştirilmek üzere Özelleştirme İdaresi Başkanlığına bildirilir. Bunun üzerine söz konusu taşınmazlar Özelleştirme Yüksek Kurulunca özelleştirme kapsam ve programına alınır. Özelleştirme uygulamasına ilişkin iş ve işlemler 4046 sayılı Kanuna göre Özelleştirme İdaresi Başkanlığınca yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>4046 sayılı Kanun hükümleri çerçevesinde taşınmazların özelleştirilmesi sonucu elde edilecek gelirler, özelleştirme giderleri düşüldükten sonra Hazineye aktarılır. Bu taşınmazların satışından elde edilen gelirleri, bir yandan genel bütçenin (B) işaretli cetveline gelir, diğer yandan ihtiyaç duyulan yerlerde okul yapımı ve onarımı amacıyla kullanılmak üzere Milli Eğitim Bakanlığı bütçesine ödenek kaydetmeye Maliye Bakanı yetkilidir. Sermaye ödenekleri yılı yatırım programıyla ilişkilendirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Eğitim Araç ve Gereçleri">
    <mvz-b2 no="I" başlık="Kapsam">
      <mvz-madde no="52" başlık="">
        <mvz-fıkra no="1">
          <template>Eğitim araç ve gereçleri, eğitim kurumlarında kullanılacak ders kitapları ile öğretmen ve öğrencilere kaynak ve yardımcı olacak basılı eğitim malzemesini, milli eğitimin genel amaçlarının gerçekleşmesine yararlı olacak diğer eserleri ve eğitim araç ve gereçlerini kapsar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="II" başlık="Görev">
      <mvz-madde no="53" başlık="">
        <mvz-fıkra no="1">
          <template>Milli Eğitim Bakanlığı, kendisine bağlı eğitim kurumlarının eğitim araç ve gereçlerini, gelişen eğitim teknolojisine ve program ve metotlara uygun olarak sağlamak, geliştirmek, yenileştirmek, standartlaştırmak, kullanılma süresini ve telif haklarını ve ders kitabı fiyatlarını tespit etmek, paralı veya parasız olarak ilgililerin yararlanmasına sunmakla görevlidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="III" başlık="Görevin yerine getirilmesi">
      <mvz-madde no="54" başlık="">
        <mvz-fıkra no="1">
          <template>Milli Eğitim Bakanlığı eğitim araç ve gereçlerini,</template>
          <mvz-bent no="1.">
            <template>Hazırlamak, imal etmek ve satın almak;</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Kişilere veya kuracağı komisyonlara veya yarışmalar düzenleyerek hazırlatmak;</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Özel kesimce hazırlananlar veya imal edilenler arasından seçmek veya tavsiye etmek suretiyle 53 üncü maddede belirtilen görevini yerine getirir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="IV" başlık="Okullarda okutulacak kitapların tespiti ve ücret ödenmesi">
      <mvz-madde no="55" başlık="">
        <mvz-fıkra no="1" durum="iptal">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Millî Eğitim Bakanlığınca hazırlanacak veya hazırlatılacak kitaplar ile eğitim araç ve gereçlerini hazırlama, inceleme ve redaksiyonunda görevlendirilenlere ücret ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ders kitaplarına ilişkin yarışmalarda derece alanlara verilecek ödülün ödeme, usul ve esasları ile miktarı yönetmelikle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Özel kesimce hazırlanan ve okullarda ders kitabı olarak okutulmak üzere Millî Eğitim Bakanlığına gönderilen eserler ücret karşılığı incelenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Ders kitaplarının kabulü, uygunluk süresi, telif hakkı ve ücretlerle ilgili esaslar; inceleme işlemleri ve alınacak inceleme ücreti miktarı; Millî Eğitim Bakanlığınca incelettirilecek eserler için ödenecek ücret miktarı; ders kitaplarının hazırlanması ve incelenmesinde aranacak kriterler ile ders kitabı üreten yayın evlerinde aranacak kriterler; ders kitabı dışındaki diğer kitap ve eğitim araçlarının kullanımı ve bunlardan hangileri için inceleme ücreti alınacağı ve ödeneceği ile ilgili esas ve usuller Millî Eğitim Bakanlığınca çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="Eğitim ve Öğretim Alanındaki Görev ve Sorumluluk">
    <mvz-b2 no="I" başlık="Yürütme, gözetim ve denetim">
      <mvz-madde no="56" başlık="">
        <mvz-fıkra no="1">
          <template>Eğitim ve öğretim hizmetinin, bu kanun hükümlerine göre Devlet adına yürütülmesinden, gözetim ve denetiminden Milli Eğitim Bakanlığı sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="II" başlık="Yasaklık">
      <mvz-madde no="57" başlık="">
        <mvz-fıkra no="1">
          <template>Askeri maksatlarla açılacak okullar hariç, bu kanun hükümlerine aykırı hiç bir eğitim faaliyetinde bulunulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="III" başlık="Okul açma yetkisi">
      <mvz-madde no="58" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye'de ilköğretim okulu, lise veya dengi okullar, Milli Eğitim Bakanlığının izni olmaksızın açılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Milli Eğitim Bakanlığı veya diğer bir bakanlık tarafından açılmış veya açılacak okullar  ile özel okulların derecelerinin tayini, Milli Eğitim Bakanlığına aittir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Askeri eğitim kurumlarının dereceleri ve müfredatı, Milli Savunma Bakanlığı ile birlikte tespit edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Diğer bakanlıklara bağlı lise ve dengi okulların program ve yönetmelikleri, ilgili bakanlıkla Milli Eğitim Bakanlığı tarafından birlikte yapılır ve Milli Eğitim Bakanlığınca onanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Diğer bakanlıklara bağlı okullar, Milli Eğitim Bakanlığının gözetim ve denetimine tabidir. Gözetim ve denetim sonunda uygun eğitim ortamı ve niteliği taşımayan kurumların denkliği usulüne uygun şekilde Milli Eğitim Bakanlığınca iptal edilir. Buna ait esaslar Cumhurbaşkanınca çıkarılan bir yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="IV" başlık="Yurt dışı eğitim">
      <mvz-madde no="59" başlık="">
        <mvz-fıkra no="1">
          <template>Türk vatandaşlarının yurt dışında eğitim, öğrenim ve ihtisas görmeleri ile ilgili Devlet hizmetlerinin düzenlenmesinden –askeri öğrenciler hariç–, Milli Eğitim Bakanlığı sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
  </mvz-kısım>
  <mvz-kısım no="7-YEDİNCİ" başlık="Son Hükümler">
    <mvz-b2 no="I" başlık="Kenar başlıkları">
      <mvz-madde no="60" başlık="">
        <mvz-fıkra no="1">
          <template>Bu kanunun madde kenar başlıkları, sadece ilgili oldukları maddelerin konusunu ve maddeler arasındaki sıralama ve bağlantıyı göstermekte olup kanun metnine dahil değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="II" başlık="Kaldırılan hükümler">
      <mvz-madde no="61" başlık="">
        <mvz-fıkra no="1">
          <template>1340 tarih ve 439 sayılı Orta Tedrisat Muallimleri Kanununun 3 üncü maddesi, 22/3/1926 tarih ve 789 sayılı Maarif Teşkilatına dair Kanunun 3 ve 4 üncü maddeleri, 6/6/1949 tarih ve 5429 sayılı Milli Eğitim Bakanlığına bağlı okullarda okutturulacak ders kitaplarının seçilmesi, basılması ve dağıtılması hakkında Kanun, 5/1/1961 tarih ve 222 sayılı İlköğretim ve Eğitim Kanununun 69 uncu maddesi ve diğer kanunların bu kanuna aykırı hükümleri, bu kanunun yayımı tarihinde, yürürlükten kalkar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="III" başlık="Yönetmelikler">
      <mvz-madde no="62" başlık="">
        <mvz-fıkra no="1">
          <template>Bu kanunda sözü geçen yönetmelikler, Kanunda belirtilen genel amaç ve temel ilkelere uygun olarak Milli Eğitim Bakanlığınca, kanunun yürürlüğe girmesinden itibaren en geç bir yıl içinde çıkarılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>14/6/1973 tarihli ve 1739 sayılı Milli Eğitim Temel Kanununda geçen "temel eğitim" terimi "ilköğretim" olarak değiştirilmiştir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu kanunun yürürlüğe girdiği tarihte, yüksek öğrenim kurumlarında öğrenci bulunanlar hakkında 38 inci madde hükmü uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="Geçici" durum="mülga">
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Zorunlu ortaöğretim 2012-2013 eğitim-öğretim yılından itibaren uygulanmaya başlanır. Bakanlar Kurulu uygulamayı bir eğitim-öğretim yılı ertelemeye yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddenin yayımı tarihinden önce, uzman öğretmenlik ve başöğretmenlik unvanlarını mahkeme kararıyla elde edenlerin, mahkeme kararının aleyhlerine kesinleşmesi hâlinde bu kişilere unvanlarının iptal edildiği tarihten önce yapılan ödemeler geri alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>43 üncü maddeye bu Kanunla eklenen beşinci, altıncı ve yedinci fıkra hükümleri, bu Kanunun yayımı tarihinden sonra aday öğretmen olarak göreve başlayanlar hakkında uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="IV" başlık="Yürürlük">
      <mvz-madde no="63" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
