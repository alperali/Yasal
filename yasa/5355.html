  <mvz-künye tür="kanun" no="5355" başlık="MAHALLÎ İDARE BİRLİKLERİ KANUNU"
             tarih="26/5/2005" rgazete-tarih="11/6/2005" rgazete-sayı="25842"
             düstur-tertip="5" düstur-cilt="44" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; mahallî idare birliklerinin hukukî statüsünü, kuruluşunu, organlarını, yönetimini, görev, yetki ve sorumlulukları ile çalışma usûl ve esaslarını düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun mahallî idare birliklerini kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Mahallî idare: İl özel idaresi, belediye ve köyü,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Mahallî idare birliği: Birden fazla mahallî idarenin, yürütmekle görevli oldukları hizmetlerden bazılarını birlikte görmek üzere kendi aralarında kurdukları kamu tüzel kişisini,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Birlik: Mahallî idare birliğini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Birliğin Kuruluşu, Tüzüğü, Görev ve Yetkileri">
    <mvz-madde no="4" başlık="Kuruluş">
      <mvz-fıkra no="1">
        <template>Birlik, birlik tüzüğünün kesinleşmesinden sonra Cumhurbaşkanının izni ile kurulur ve tüzel kişilik kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurulmuş bir birliğe üyelik, üye olmak isteyen mahallî idare meclisinin kararı ve buna dayalı başvuru üzerine, birlik meclisinin kabulü ile olur. Bu durumda Cumhurbaşkanının izni aranmaz. Ayrılmada ilgili mahallî idare meclisinin kararı yeterlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Su, atık su, katı atık ve benzeri altyapı hizmetleri ile çevre ve ekolojik dengenin korunmasına ilişkin projelerin zorunlu kılması durumunda; Cumhurbaşkanı, ilgili mahallî idarelerin, bu amaçla kurulmuş birliğe katılmasına karar verebilir. Bu fıkrada belirtilen birliklerden ayrılma da Cumhurbaşkanının iznine bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mahallî idarelerin bütün görevlerini kapsayacak şekilde genel amaçlı veya amacı açıkça belirlenmemiş birlik kurulamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Birlik tüzüğü">
      <mvz-fıkra no="1">
        <template>Birlik tüzüğü, birliği kuracak mahallî idarelerin meclislerinde üye tam sayısının üçte iki çoğunluğuyla kabul edildikten sonra valinin; birlik birden fazla ildeki mahallî idarelerin katılımı ile kuruluyorsa üyeleri il özel idareleri ve köylerden oluşan birlikler için İçişleri Bakanının, geri kalanları için Çevre ve Şehircilik Bakanının onayı ile kesinleşir. Tüzük değişikliğinin nasıl yapılacağı birlik tüzüğünde gösterilir ve onaylanması hakkında tüzüğün onaylanmasına ilişkin usûl uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birlik tüzüğünde aşağıdaki hususların bulunması zorunludur:</template>
        <mvz-bent no="a">
          <template>Birliğin adı ve amacı.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Birlik üyesi mahallî idarelerin adları.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Birliğin merkezi.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Birliğin görev süresi, sona ermesi ve tasfiyesi.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Birliğe devredilen görev ve hizmetler.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Birlik meclisinin ve birlik encümeninin toplantı dönemleri.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Birlik üyesi mahallî idarelerin her birinin birlik meclisinde kaç üye ile temsil edileceği ve seçilen üyelerin görev süresi ve birlik encümeni üye sayısı.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Birlik üyelerinin, birliğin kuruluş ve faaliyet giderlerine katılma payları ve bu payların tespit yöntemi.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Birliğin gelirleri, giderleri, bütçe ve çalışma programlarına ilişkin hususlar.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Birlik üyesi mahallî idarelerin ve bu idarelerin hizmet alanında yaşayanların birlik hizmetlerinden yararlanma usûlleri.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Tüzük değişikliğinin nasıl yapılacağı.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Birliğin hak ve yetkileri">
      <mvz-fıkra no="1">
        <template>Mahallî idare birlikleri, tüzükte birliğe devredilmesi öngörülen mahallî müşterek nitelikli hizmetlere ilişkin olarak üye mahallî idarelerin hak ve yetkilerine sahiptir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Birliğin Organları">
    <mvz-madde no="7" başlık="Birliğin organları">
      <mvz-fıkra no="1">
        <template>Birliğin organları; birlik meclisi, birlik encümeni ve birlik başkanıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Birlik meclisi">
      <mvz-fıkra no="1">
        <template>Birlik meclisi, birliğin karar organıdır ve birlik üyesi mahallî idarelerin meclislerinin kendi üyeleri veya belediye meclis üyeliğine seçilmeyi haiz kişiler arasından, birlik tüzüğünde belirlenen sayıda ve gizli oyla seçecekleri üyelerden oluşur. Ancak dışarıdan seçileceklerin sayısı mahalli idare meclisinden seçileceklerin üçte birini geçemez. Asıl üye sayısının yarısı kadar yedek üye seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birliğin üyesi olan il özel idaresi için vali, belediye için belediye başkanı ve köy için muhtar, birlik meclisinin doğal üyesidir. Birlik meclisinde bunların dışında doğal üye bulunmaz. Meclis üye tam sayısına doğal üyeler de dâhildir. Vali ve belediye başkanı birlik meclisinde kendisini temsil etmek üzere meclis üyelerinden birine yetki verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Üye mahallî idarelerden herhangi birinin birlik meclisindeki asıl üyeliklerinde boşalma olursa, birlik başkanı o mahallî idarenin yedek üyelerini göreve çağırır. Çağrılacak yedek üye kalmadığı takdirde üye mahallî idarelerin meclisleri, ilk toplantılarında yeniden yedek üye seçimi yapar. Birlik meclisinin feshedilmesi durumunda yeniden asıl ve yedek üye seçimi yapılır. Bu üyeler kalan süreyi tamamlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İl özel idaresi, belediye ve köy idarelerindeki görevleri sona erenlerin birlik meclisi üyeliği de sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Birlik meclisi üyeliği, üyeliğin düşmesini gerektiren bir sebeple sona erenler, bir sonraki dönemde birlik meclisi üyeliğine seçilemezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Birlik tüzüğünde, üye mahallî idarelerin birlik meclisinde nüfus ve katılım payı oranına göre temsil edilmesine dair esas getirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Birlik başkanı aynı zamanda birlik meclisinin de başkanıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Meclisin görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>Birlik meclisinin görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Yatırım plânı ve çalışma programını görüşmek ve kabul etmek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bütçe ve kesinhesabı kabul etmek, bütçede kurumsal kodlama yapılan birimler ile fonksiyonel sınıflandırmanın birinci düzeyleri arasında aktarma yapmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Borçlanmaya karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Taşınmaz mal alımına, satımına, kiralanmasına ve takasına karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Birlik tarafından yürütülecek hizmetler için uygulanacak ücret tarifesini belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Şartlı bağışları kabul etmek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Dava konusu olan ve miktarı ikibin Yeni Türk Lirasından onbin Yeni Türk Lirasına kadar birlik alacaklarının sulhen halline karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Birlik yatırımlarının yap-işlet veya yap-işlet-devret modeli ile yapılmasına karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Birlik başkanlık divanını, birlik encümen üyelerini ve meclis ihtisas komisyonu üyelerini seçmek.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Birlik teşkilâtına ait birimlerin kurulmasına karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Birlik tüzüğünde öngörülmesi halinde tüzük değişikliğini kabul etmek.</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Birlik tarafından çıkarılacak yönetmelikleri kabul etmek.</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Birlik başkanıyla birlik encümeni arasındaki anlaşmazlıkları karara bağlamak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Meclis başkanlık divanı">
      <mvz-fıkra no="1">
        <template>Birlik meclisi, birliğin kuruluşundan ve mahallî idare genel seçim sonuçlarının Yüksek Seçim Kurulunca ilânından itibaren otuz gün içinde birlik merkezinin bulunduğu mahallin mülkî idare amiri tarafından birlik merkezinde toplantıya davet edilir. Meclis, en yaşlı üyenin başkanlığında toplanarak ilk iki yıl için görev yapmak üzere, üyeleri arasından ve gizli oyla birlik başkanını, meclis birinci ve ikinci başkan vekili ile kâtip üyeleri seçer. İlk iki yıldan sonra seçilecek başkanlık divanı üyeleri yapılacak ilk mahallî idareler seçimine kadar görev yapar.  Üyelerinin tamamı il özel idarelerinden oluşan ulusal düzeydeki birlik için Birlik Başkanı, İçişleri Bakanlığı Müsteşarıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Meclis başkanlık divanı seçimi üç gün içinde tamamlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birlik meclisine birlik başkanı, bulunmaması durumunda meclis birinci başkan vekili, onun da bulunmaması durumunda ikinci başkan vekili başkanlık eder. Ancak yıllık faaliyet raporunun görüşüldüğü meclis toplantısı meclis başkan vekilinin başkanlığında yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Başkanlık divanında boşalma olması durumunda kalan süreyi tamamlamak üzere yeni üye seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Meclis başkanı, meclis çalışmalarında düzeni sağlamakla yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Meclis toplantısı">
      <mvz-fıkra no="1">
        <template>Meclis toplantıları, üye mahallî idarelerin kanunlarında belirtilen toplantı dönemleri dikkate alınarak yılda ikiden az olmamak üzere birlik tüzüğünde gösterilen zamanlarda yapılır. Yılın ilk toplantısı dönem başı toplantısıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birlik başkanı, üye mahallî idare meclislerinden birinin talebi, birlik meclisi üyelerinin üçte birinin gerekçeli teklifi veya acil durumlarda kendisinin lüzum görmesi üzerine birlik meclisini olağanüstü toplantıya çağırır. Olağanüstü toplantı çağrısı ve gündem en az üç gün önceden meclis üyelerine yazılı olarak duyurulur ve ayrıca ilân edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birlik meclisinde plan ve bütçe komisyonunun dışında birliğin faaliyet konularında olmak üzere ihtisas komisyonları kurulabilir. İhtisas komisyonları meclis üyeleri arasından birlik meclisinin kararıyla kurulur ve komisyon üye sayısı beşi geçemez. Komisyon üyelerinin ayrı mahalli idare temsilcileri arasından seçilmesi esastır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Olağanüstü toplantılarda, çağrıyı gerektiren konuların dışında bir iş görüşülemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Birden çok ili kapsayan mahalli idare birliklerinde mahalli idare birlik meclisinin kararları o birliğin merkezinin olduğu yer mülki idare amirine gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Birlik meclisinin toplantıları, kararları, çalışma esas ve usûlleri, bilgi edinme ve denetim yolları, feshi, meclis üyeliğinin sona ermesi, ihtisas komisyonu üyelerinin seçimi ile meclis üyelerinin yükümlülükleri hakkında bu Kanunda hüküm bulunmayan durumlarda, Belediye Kanununun belediye meclislerine ilişkin hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Birlik encümeni">
      <mvz-fıkra no="1">
        <template>Birlik encümeni, birlik başkanı ile sayısı yediyi geçmemek üzere birlik tüzüğünde gösterilecek sayıda meclis üyesinden oluşur. Ülke düzeyinde kurulan birliklerde bu sayı iki kat olarak uygulanır. Bu üyeler, birlik meclisince, dönem başı toplantısında kendi üyeleri arasından gizli oyla bir yıllığına görev yapmak üzere seçilir. Birlik başkanı, encümeninin de başkanıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birlik encümeni birlik tüzüğünde belirtilen sürelerle toplanır. Bu süre bir ayı aşamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Herhangi bir sebeple yıl içinde seçilen birlik encümeni, dönem başına kadar görev yapar. Birlik meclisi üyeliği sona erenlerin birlik encümeni üyeliği de sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Üye sayısı dört veya daha fazla olan mahallî idare birliklerinde, encümen üyelerinin ayrı ayrı mahallî idarelerin meclis üyeleri arasından seçilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Birlik meclisinin feshi durumunda, yeni meclis oluşuncaya kadar birlik meclisi ve birlik encümenine ait görevler, ulusal düzeyde kurulan birlikler için İçişleri Bakanlığınca, diğer birlikler için birlik merkezinin bulunduğu yer mülkî idare amirince kamu görevlileri arasından biri başkan olmak üzere görevlendirilecek beş kişilik bir heyet tarafından yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Encümenin görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>Birlik encümeninin görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Yatırım plânı ve çalışma programı ile bütçe ve kesinhesabı inceleyip birlik meclisine görüş bildirmek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamulaştırma işlemlerinin gerektirdiği kamu yararı kararını almak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Öngörülmeyen giderler ödeneğinin harcama yerlerini belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bütçede fonksiyonel sınıflandırmanın ikinci düzeyleri arasında aktarma yapmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Kanunlarda öngörülen cezaları vermek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İkibin Yeni Türk Lirasına kadar olan davaların sulhen halline karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Taşınmaz mal alımına, satımına, kiralanmasına ve takasına ilişkin meclis kararlarını uygulamak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birlik encümeninin toplantıları, kararları ile çalışma esas ve usûlleri hakkında bu Kanunda hüküm bulunmayan hallerde, Belediye Kanununun belediye encümenine ilişkin hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Birlik başkanı">
      <mvz-fıkra no="1">
        <template>Birlik başkanı, birlik idaresinin başı ve tüzel kişiliğinin temsilcisidir. Birlik başkanının görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Birliği yönetmek ve birliğin hak ve menfaatlerini korumak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yatırım plânı ve çalışma programı ile bütçeyi ve kesinhesabı hazırlamak, uygulamak, izlemek, değerlendirmek ve bunlarla ilgili olarak hazırlayacağı yıllık faaliyet raporunu meclise sunmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Birliği temsil etmek veya vekil tayin etmek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Birlik meclisine ve birlik encümenine başkanlık etmek.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Birliğin taşınır ve taşınmaz mallarını idare etmek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Birliğin gelir ve alacaklarını takip ve tahsil etmek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Yetkili organların kararını almak şartıyla sözleşme yapmak.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Birlik meclisi ve birlik encümeni kararlarını uygulamak.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Birlik meclisi ve birlik encümeninin yetkisi dışında kalan diğer ödenek aktarmalarını yapmak.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Birlik personelini atamak.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Birliği denetlemek.</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Şartsız bağışları kabul etmek.</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Kanunlarla birliğe verilen ve birlik meclisi veya birlik encümeni kararını gerektirmeyen görevleri yapmak ve yetkileri kullanmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birlik bütçesinin harcama yetkilisi birlik başkanıdır. Birlik başkanı bu yetkisini birlik genel sekreterine veya birlik müdürüne devredebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birlik başkanlığının sona ermesi ile ilgili olarak Belediye Kanununun belediye başkanlığının göreve devamsızlık dışındaki sebeplerle sona ermesine ilişkin hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Malî Hükümler">
    <mvz-madde no="15" başlık="Birliğin gelirleri">
      <mvz-fıkra no="1">
        <template>Birliğin gelirleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Birlik üyelerinin, birliğin kuruluş ve faaliyet giderlerine katılma payları.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Birlik meclisi tarafından belirlenecek tarifelere göre tahsil edilecek hizmet karşılığı ücretler.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Diğer kamu kurum ve kuruluşlarından aktarılacak ödenekler.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Taşınır ve taşınmaz malların kira, satış ve başka suretle değerlendirilmesinden elde edilecek gelirler.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Kira ve faiz gelirleri.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Bağışlar.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Köylere hizmet götürme birlikleri için il özel idaresi bütçesinden ayrılacak pay.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Diğer gelirler.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Birliğin giderleri">
      <mvz-fıkra no="1">
        <template>Birliğin giderleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Birlik hizmetlerinin yürütülmesi için yapılacak giderler.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Birliğin personeline ve seçilmiş organlarının üyelerine ödenen maaş, ücret, ödenek, huzur hakkı, yolluk, hizmete ilişkin eğitim harcamaları ile diğer giderler.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Hizmet karşılığı alınacak ücretler ve diğer gelirlerin takip ve tahsili için yapılacak giderler.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Birliğin hizmet binalarının, tesislerinin, araç ve gereçlerinin temini, yapımı, bakımı ve onarımı için yapılan giderler.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Faiz, borçlanmaya ilişkin diğer ücretler ile sigorta giderleri.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Dava takip ve icra giderleri.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Avukatlık, danışmanlık ve denetim ücretleri.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kamu ve özel sektör kuruluşlarıyla yapılan ortak hizmetler ve diğer proje giderleri.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Temsil, tören ve ağırlama giderleri.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Çeşitli Hükümler">
    <mvz-madde no="17" başlık="Teşkilât">
      <mvz-fıkra no="1">
        <template>Norm kadroya uygun olarak birlik teşkilâtı birlik müdürü, yazı işleri, malî işler birimleriyle birliğin faaliyet alanına göre kurulacak teknik işler biriminden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ülke düzeyinde kurulan birliklerle üye sayısı yüzden fazla olan birliklerde teşkilât, norm kadroya uygun olarak genel sekreter, yazı işleri ve malî işler birimleriyle birliğin faaliyet alanında olmak ve sayısı üçü geçmemek üzere birlik meclisinin kararıyla kurulacak diğer birimlerden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kamu kurum ve kuruluşlarında çalışan memurlar, Belediye Kanununda belirtilen esas ve usûllere göre birlik genel sekreteri veya diğer üst yönetici kadrolarında görevlendirilebilir. Bu tür görevlendirmelerde ilgilinin kendi kurumundan aldığı her türlü malî ve sosyal hakları kesilmez, ancak kurumundan aldığı aylık ve diğer ödemelerin toplam tutarını geçmemek üzere birlik encümeni kararıyla ek ödeme yapılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Köylere hizmet götürme birlikleri">
      <mvz-fıkra no="1">
        <template>İlçelerde, tarım ürünlerinin pazarlanması hariç olmak üzere, yol, su, kanalizasyon ve benzeri altyapı tesisleri ile köylere ait diğer hizmetlerin yürütülmesine yardımcı olmak, bizzat yapmak, yaptırmak ve kırsal kalkınmayı sağlamak üzere, tüm köylerin iştiraki ile o ilçenin adını taşıyan, köylere hizmet götürme birliği kurulabilir. Cumhurbaşkanı, bu konuda genel izin vermeye yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birlik başkanı merkez ilçelerde vali veya görevlendireceği vali yardımcısı, diğer ilçelerde kaymakamdır. Köylere hizmet götürme birliğinin meclisi, birlik başkanı başkanlığında, birliğe üye köylerin muhtarları ve o ilçeden seçilen il genel meclisi üyelerinden oluşur. Köylere hizmet götürme birliğinin encümeni birlik başkanının başkanlığında, meclisin kendi üyeleri arasından gizli oyla seçeceği iki il genel meclisi üyesi ve iki köy muhtarı olmak üzere beş kişiden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bakanlıklar ve diğer merkezi idare kuruluşları ile il özel idareleri; köye yönelik hizmetlere ilişkin yapım, bakım ve onarım işleri, bölünmüş yol, elektrifikasyon, köy yolu, içme suyu, sulama suyu ve kanalizasyon yatırımlarını, kendi bütçelerinde bu hizmetler için ayrılan ödenekleri köylere hizmet götürme birliklerine aktarmak suretiyle gerçekleştirebilirler. Aktarma işlemi merkezi idare kuruluşlarında ilgili bakanın, il özel idarelerinde valinin onayıyla yapılır ve bu ödenekler tahsis amacı dışında kullanılamaz. Bu takdirde iş, birliğin tabi olduğu usul ve esaslara göre sonuçlandırılır. Köylere hizmet götürme birlikleri de bütçe imkânları ölçüsünde bu yatırımlara kendi bütçelerinden ödenek aktarabilirler. Bakanlıklar ve diğer merkezi idare kuruluşları ile il özel idareleri tarafından aktarılacak ödeneklerle gerçekleştirilecek yatırımlar, birliğin hizmet ve görev alanı sınırlamasına tabi olmaksızın yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Köylere hizmet götürme birlikleri, ihtiyaca göre hizmet akdiyle personel istihdam edebilir. Ancak, köylere hizmet götürme birliklerinin yıllık toplam personel giderleri, gerçekleşen en son yıl bütçe gelirlerinin Vergi Usul Kanununda belirlenen yeniden değerleme katsayısı ile çarpımı sonucu bulunacak miktarın % 10'unu aşamaz. Vali ve kaymakamlar birlik hizmetlerini yürütmek üzere diğer kamu kurum ve kuruluşlarından personel görevlendirebilir. Bu şekilde görevlendirilenlere birlik bütçesinden karşılanmak üzere, (5000) gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunan tutarda aylık ödeme yapılır. Görevlendirmelerde otuz günden kısa süreler için kıst hesaplama yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İl özel idaresi bütçe gelirlerinin ne kadarının köylere hizmet götürme birliklerine aktarılacağı, köylere hizmet götürme birliklerinin sunacağı yatırım plânı, yıllık çalışma programı ve uygulama projelerine göre il genel meclisince kararlaştırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Köylere hizmet götürme birliklerinin bütçesine ilişkin esas ve usûller ile muhasebe ve raporlama standartları, harcama esas ve usûlleri, çerçeve hesap plânı ile düzenlenecek raporların şekil, süre ve türleri ile bu birliklerin yapacakları ihalelere ilişkin esas ve usûller Maliye Bakanlığının görüşü alınarak İçişleri Bakanlığı tarafından çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Sulama birlikleri" durum="mülga">
    </mvz-madde>
    <mvz-madde no="20" başlık="Ülke düzeyinde birlik kurulması">
      <mvz-fıkra no="1">
        <template>Mahallî idarelerin menfaatlerinin korunması, gelişmelerine yardımcı olunması, personelinin eğitilmesi ve mahallî idarelerle ilgili kanun hazırlıklarında görüş bildirilmesi amacıyla il özel idarelerini ve belediyeleri temsil etmek üzere ülke düzeyinde sadece birer birlik kurulabilir. Bu durum ülke düzeyinde olmaksızın bu amaçlarla başka mahallî idare birliği kurulmasına engel oluşturmaz. İl özel idareleri ve belediyeler ülke düzeyinde kurulan birliklerden kendilerine ait olanın doğal üyesidirler.  İl özel idarelerinden oluşan ülke düzeyindeki birliğe yatırım izleme ve koordinasyon başkanlıkları da aynı hak, yetki ve yükümlülüklerle üye olurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ülke düzeyinde kurulan birlikler birinci fıkrada belirtilen amaçların yanında mahallî idarelere rehberlik etmek; mahallî idareler arasında yardımlaşma ve işbirliğini, teknik ve idarî deneyim bilgi değişimini teşvik etmek; iyi uygulama örneklerinin yaygınlaşmasına yardım etmek konularında da faaliyette bulunabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada belirtilen birliklerden belediyelere ait olanın birlik meclisi; büyükşehir, il merkezi ve nüfusu yüzbin ve daha fazla olan yerlerin belediye başkanları ile her ilden belediye başkanı ve belediye meclis üyeleri arasından o ilin milletvekili sayısı kadar seçilecek üyelerden oluşur. Seçim, birlik başkanlığının talebi üzerine büyükşehir olan yerlerde büyükşehir belediye başkanlığı, diğer yerlerde il belediye başkanlığınca tespit edilen gün ve yerde o il içindeki belediyelerin başkanları ve belediye meclis üyelerinin katılımıyla yapılır. Seçime katılacaklar kendilerini temsilen oy kullanmak üzere başka bir üyeye yazılı olarak yetki verebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkrada belirtilen birliklerden il özel idarelerine ait olanın birlik meclisi, il valileri ile her ilin il genel meclisinin, birlik tüzüğünde gösterilen sayıda kendi üyeleri arasından seçeceği kimselerden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Üçüncü ve dördüncü fıkrada belirtilen birliklere üye mahalli idarelerin birliğe ödemeleri gereken üyelik bedeli, bu idarelerin en son kesinleşmiş bütçelerinin birlik meclisince belirlenen oranı olarak tespit edilir ve birliğin talebi üzerine bu mahallî idarelere genel bütçe vergi gelirlerinden ayrılan paylardan bu payların dağıtımını yapan kuruluşça kesilerek birliğe ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Birlik üyelerinin yükümlülükleri">
      <mvz-fıkra no="1">
        <template>Birliğe karşı malî yükümlülüklerini yerine getirmeyen üye mahallî idarelerin ödemeleri gerekli miktar, birliğin başvurusu üzerine bu idarelere genel bütçe vergi gelirleri tahsilâtı toplamı üzerinden ayrılan paydan, bu payların dağıtımını yapan kuruluş tarafından kesilerek alacaklı birliğe ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Ortak hükümler">
      <mvz-fıkra no="1">
        <template>Mahallî idare birliklerinin denetimi İçişleri Bakanlığınca yapılır. Valiler ve kaymakamlar gerekli gördüklerinde ülke düzeyinde kurulan birlikler dışındaki birlikleri denetleyebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sayıştayın dış denetimine tâbi olmayan mahallî idare birliklerinin, İçişler Bakanlığı, valiler veya kaymakamlarca malî denetimi sonucunda tespit edilen kamu zararı üzerine yapılan kişi borcu teklifleri, birlik meclisinde görüşülerek karara bağlanır. Bu kararın örneği, birlik merkezinin bulunduğu yerin valiliğine, ülke düzeyinde kurulan birlikler ile başkanı vali veya vali yardımcısı olan birliklerde ise İçişleri Bakanlığına gönderilir. Karara karşı, ülke düzeyinde kurulan birlikler ile başkanı vali veya vali yardımcısı olan birliklerde İçişleri Bakanlığı, diğerlerinde ise valiler veya hakkında kişi borcu çıkarılanlar on gün içinde idarî yargıya başvurabilirler. İdarî yargı kararı doğrultusunda işlem sonuçlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kontrol, denetim, inceleme, kesin hükme bağlama veya yargılama sonucunda tespit edilen kamu zararı, zararın oluştuğu tarihten itibaren ilgili mevzuatına göre hesaplanacak faiziyle birlikte ilgililerden tahsil edilir. Kamu zararlarının tahsiline ilişkin usûl ve esaslar, Cumhurbaşkanı tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birliklerde çalışma programı, yetki devri, birlik ile birlik başkanının ihtilaflı olması, birlik organının veya bunların üyelerinin görevden uzaklaştırılması, , yıllık faaliyet raporu, bütçe ve diğer malî konular, tahvil ihracı hariç borçlanma, bütçe içi işletme tesisi, borç ve alacakların mahsubu, yurt dışı ilişkileri, diğer kuruluşlarla ilişkiler, yazışma ve yeniden değerleme oranının birliklerde uygulanması konularında, bu Kanunda hüküm bulunmayan durumlarda birlik tüzüğü ile birliğe devredilen hizmetlerle sınırlı olmak üzere Belediye Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Birliklerde, teşkilât ve personel istihdamı konularında bu Kanunda hüküm bulunmayan hallerde Belediye Kanunu ile Belediye Kanununa aykırı olmamak kaydıyla birlik tüzüğü hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Köylere hizmet götürme birliklerinin birlik meclisleri hariç olmak üzere, birlik meclisi ile birlik encümeninin başkan ve üyelerine meclis ve encümen toplantılarına katıldıkları her gün için birlik başkanına (5000), encümen üyelerine (2000), meclis üyelerine (1500) gösterge rakamının Devlet memurları için belirlenen aylık katsayı ile çarpımı sonucu bulunacak tutarı geçmemek üzere, birlik meclisi tarafından belirlenecek miktarda huzur hakkı ödenebilir. Ancak, huzur hakkı ödenecek gün sayısı, bir yıl içinde yirmidört günü geçemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Turizm altyapı hizmet birlikleri" tür="Ek">
      <mvz-fıkra no="1">
        <template>Kültür ve turizmi koruma ve gelişim bölgeleri ile turizm merkezlerinde, alanın bütüncül bir anlayışla korunması, geliştirilmesi, tanıtımı, kültür ve turizme ilişkin sosyal ve teknik altyapının gerçekleştirilmesi ve işletilmesini sağlamak amacıyla alandaki bütün mahalli idarelerin katılımı ile bir mahalli idare birliği kurulur. Bu amaçla kurulan mahalli idare birliklerinin meclis üyelerinin üçte biri, alandaki Kültür ve Turizm Bakanlığından turizm belgeli konaklama tesislerinin ve deniz turizmi tesislerinin temsilcilerinin kendi aralarından, birlik tüzüğünde belirlenen sayıda ve gizli oyla belediye meclis üyeliğine seçilme şartlarını taşımak kaydıyla seçecekleri üyelerden oluşur. Seçim, birlik merkezinin bulunduğu yer il özel idaresi encümenlerinin gözetiminde yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birliğin görev ve yetki alanında bulunan konaklama tesisleri, üye mahalli idarelerin ödediği aidatın üçte birinden az olmamak üzere konaklama tesislerinin yatak sayıları, deniz turizmi tesislerinin ise bağlama kapasiteleri dikkate alınarak birlik meclisince belirlenecek miktarda üyelik aidatı öder. Üye olmayan diğer turizm tesisleri ve hizmetten yararlananlar, birlik meclisince belirlenecek miktarda katılım payı veya ücreti öder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Ceza ve yasaklama" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki mahallî idare birlikleri tarafından yapılan ihalelerdeki yasak fiil veya davranışlar ile cezalara ilişkin hususlarda 4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanunu, 4/1/2002 tarihli ve 4735 sayılı Kamu İhale Sözleşmeleri Kanunu ve 8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanununda belirtilen hükümler uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesinden önce kurulmuş olan mahallî idare birlikleri, durumlarını en geç altı ay içinde bu Kanun hükümlerine uygun hâle getirirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen süre içinde durumlarını bu Kanuna uygun hâle getirmeyen birlikler, İçişleri Bakanlığı tarafından iki ay ek süre verilerek uyarılır. Bu süre içinde de gerekli değişiklikleri yapmayan birlikler kendiliğinden dağılmış sayılır ve tüzüklerindeki hükümlere göre tasfiye edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun yayımlanmasından önce Bakanlar Kurulunun izni ile kurulan ancak 26.3.1987 tarihli ve 3335 sayılı Uluslararası Nitelikteki Teşekküllerin Kurulması Hakkında Kanunda belirtilen nitelikte uluslararası faaliyette bulunan ve en az yedi üyeye sahip olan mahallî idare birliklerinden uluslararası teşekkül sayılma talebinde bulunanlar hakkında birinci ve ikinci fıkra hükümleri uygulanmaz. Uluslararası teşekkül sayılma talebi, birlik encümen kararına dayalı olarak bu Kanunun yayımlanmasından itibaren en geç üç ay içinde; birlik meclisince kabul edilecek olan uluslararası teşekkül statüsü ise en geç bir yıl içinde İçişleri Bakanlığına sunulur. İçişleri Bakanlığı uluslararası teşekkül statüsünü Dışişleri Bakanlığının görüşünü alarak iki ay içinde onaylar veya Kanuna uygun hale getirilmesi için en fazla iki ay süre vererek iade eder. Uluslararası teşekkül statüsünün onaylanmasıyla birlikte mahallî idare tüzelkişiliği sona erer ve bu birlikler, başka bir işleme gerek kalmaksızın 3335 sayılı Kanuna göre kurulmuş uluslararası teşekkül statüsü kazanarak aynı Kanun uyarınca faaliyetlerine devam ederler. Uluslararası teşekkül sayılma talebinde bulunan ancak statüsünü belirtilen süre içinde teslim etmeyen veya Kanuna uygun hale getirmeyen mahallî idare birlikleri, bu sürelerin sonunda kendiliğinden dağılmış sayılır. Uluslararası teşekkül sayılma talebinde bulunmayan veya en az yedi üyeye sahip olmadığı için bulunamayan bu nitelikteki mahalli idare birlikleri hakkında birinci fıkra hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce mahallî idare birlikleri personeli hakkında çeşitli sebeplerden dolayı çıkarılmış kişi borçları, birlik meclisinin alacağı kararla sonuçlandırılır. Bu karara karşı birlik merkezinin bulunduğu yer mülkî idare amiri veya hakkında kişi borcu çıkarılanlar on gün içinde idarî yargıya başvurabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Turizm altyapı hizmet birliklerinin kuruluşu" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun ek 1 inci maddesinde belirtilen turizm altyapı hizmet birliklerinin kurulma işlemleri bölge veya merkezde yetkili valiler tarafından bu Kanunun yürürlüğe girmesinden itibaren bir yıl içinde tamamlanır. Bölge veya merkezin birden fazla il sınırını kapsaması halinde, bu konuda Çevre ve Şehircilik Bakanlığınca görevlendirilecek valilik, kuruluş işlemlerini yürütür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun yayımı tarihinden önce kurulmuş turizm altyapı hizmet birlikleri, tüzüklerini en geç bir yıl içerisinde Kanuna uygun hale getirirler.</template>
      </mvz-fıkra>
