  <mvz-künye tür="kanun" no="168" başlık="YABANCI MEMLEKETLERDE TÜRK ASILLI VE YABANCI UYRUKLU ÖĞRETMENLERE SOSYAL YARDIM YAPILMASI HAKKINDA KANUN"
             tarih="16/12/1960" rgazete-tarih="23/12/1960" rgazete-sayı="10688"
             düstur-tertip="1" düstur-cilt="1" düstur-sayfa="819" />
 
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Yabancı memleketlerde Türk kültürüne hizmet eden Türk asıllı ve yabancı uyruklu öğretmen veya din görevlilerine; görevlerinden ayrılışları halinde kendilerine, vefatları halinde ise dul ve yetimlerine bu Kanun hükümlerine göre sosyal yardım yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Sosyal yardımdan faydalanabilmek için;</template>
      <mvz-bent no="a">
        <template>25 yıl veya daha fazla hizmetten sonra görevden ayrılmak veya asgari onbeş yıl hizmeti bulunup 60 yaşını tamamlamış olmak,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Engelli olması veya tedavisi mümkün olmayan hastalık sebebiyle çalışamaz hale gelindiğinin, en az üç doktordan oluşan bir sağlık kurulu tarafından düzenlenecek raporla belgelenmesi ve bu raporda belirtilen sebebin görevini yapmasına engel teşkil ettiğinin Sağlık Bakanlığının görüşü alınmak suretiyle Dışişleri Bakanlığınca uygun görülmesi,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Durumu yukarıdaki (a) ve (b) bentlerinde gösterilen haller kapsamına girmemekle birlikte, Dışişleri Bakanlığı tarafından takdir edilecek sebeplerle görevini bırakmış olmak,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Görevlerini yapmaları sırasında, şahsiyet ve Türk kültürüne hizmetlerinin sebep ve etkisiyle, bulundukları ülke makamlarınca görevlerinden men edilmiş olmak,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>şartlarından en az birisini haiz olunması zorunludur</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Yapılacak sosyal yardımın aylık tutarı ile yardımların tahakkuku ve ödenmesine ilişkin hususlar; ilgililerin hizmet yılları ile tamamlamış oldukları eğitimin seviyesi ve alanı, pedagojik formasyonlarının bulunup bulunmadığı, görev unvanları, yerleştikleri ülke ve mahalli geçim endekslerindeki gelişmeler dikkate alınarak, her yıl Dışişleri, Maliye ve Milli Eğitim bakanlıkları ile Sosyal Güvenlik Kurumu Başkanlığı ve Diyanet İşleri Başkanlığı tarafından müştereken tespit olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun uyarınca sosyal yardım yapılmakta olanların kendileri ile bunların tedavi yardımı ya da hastalık sigortası hakkı bulunmayan eşlerinin, Türkiye’de sağlık kurum ve kuruluşlarındaki tedavilerine ilişkin giderler ile ilaç giderleri; 8/6/1992 tarihli ve 3816 sayılı Ödeme Gücü Olmayan Vatandaşların Tedavi Giderlerinin Yeşil Kart Verilerek Devlet Tarafından Karşılanması Hakkında Kanunda düzenlenmiş olan şartlar aranmaksızın, yeşil kart verilmek suretiyle anılan Kanun hükümlerine göre karşılanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunda yazılı sosyal yardımdan faydalanabilmek için;</template>
      <mvz-bent no="a">
        <template>İlgilinin cemaatten veya tabiiyetinde bulunduğu hükümetten yeteri kadar yardım veya emekli aylığı almamış olması,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Türk kültürüne ve devrimlerine aykırı harekette bulunmaması,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Dışişleri Bakanlığınca takdir olunacak mücbir sebepler dışında, başka bir memlekette yerleşmek maksadiyle bulunduğu memleketten ayrılmaması şarttır.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>Sosyal yardımdan faydalanacak öğretmenler ile din görevlilerinin yabancı memleketlerde Türk kültürüne hizmetleri, devrimlere sadakatları ve başarı durumları Dışişleri Bakanlığınca tesbit edilir ve bunlardan öğretmen olanların sicilleri Milli Eğitim Bakanlığınca, din görevlisi olanların sicilleri ise Diyanet İşleri Başkanlığı tarafından tutulur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanun hükümleri gereğince yapılacak sosyal yardımlar Dışişleri Bakanlığı bütçesinde açılacak özel bir fasıldan ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Tesbit edilecek esaslara göre belgelendirmek şartiyle bu kanunun neşrinden önce geçmiş hizmetler de dikkate alınır. Bu kanunun yayımından önce görevlerinden ayrılmış olanlardan yardıma hak kazanmış bulunanlarla, bunlardan vefat etmiş olanların dul ve yetimlerine de bu kanunun esasları dairesinde sosyal yardım yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunu Dışişleri, Maliye ve Milli Eğitim Bakanları yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
