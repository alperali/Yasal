  <mvz-künye tür="kanun" no="3686" başlık="İNSAN HAKLARINI İNCELEME KOMİSYONU KANUNU"
             tarih="5/12/1990" rgazete-tarih="8/12/1990" rgazete-sayı="20719"
             düstur-tertip="5" düstur-cilt="30" düstur-sayfa="45" />
    
  <mvz-madde no="1" başlık="Amaç">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı; Dünya'da ve ülkemizde insan haklarına saygı ve bu konudaki gelişmeleri izlemek suretiyle uygulamaların bu gelişmelere uyumunu sağlamak ve başvuruları incelemek üzere Türkiye Büyük Millet Meclisinde bir İnsan Haklarını İnceleme Komisyonunun kuruluş, görev, yetki,çalışma usul ve esaslarını düzenlemektir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanun; T.C. Anayasası ile İnsan Hakları Evrensel Beyannamesi ve Avrupa İnsan Hakları Sözleşmesi gibi çok taraflı uluslararası belgelerde belirlenmiş bulunan insan hak ve hürriyetleri ile uluslararası alanda genel kabul gören insan haklarını kapsar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Komisyonun Kuruluşu">
    <mvz-fıkra no="1">
      <template>Üye sayısı Danışma Kurulunun teklifi üzerine Genel Kurulca belirlenecek İnsan Haklarını İnceleme Komisyonunda; siyasi parti grupları ile bağımsızlar Meclisteki sayılarının - boş üyelikler hariç - üye tamsayısına nispet edilmesi ile bulunacak yüzde oranına uygun olarak temsil edilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Komisyon üyelikleri için, bir yasama döneminde iki seçim yapılır.  İlk seçilenlerin görev süresi iki yıldır, ikinci devre için seçilenlerin görev süresi ise o yasama döneminin sonuna kadar devam eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Komisyon, Siyasi Parti gruplarının yüzde oranlarına göre, bir başkan, iki başkanvekili, bir sözcü ve bir katip seçer. Bu seçim, üye tamsayısının salt çoğunluğuyla toplanan Komisyonun, toplantıya katılanlarının salt çoğunluğunun gizli oyuyla yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Komisyonun Görevleri">
    <mvz-fıkra no="1">
      <template>İnsan Haklarını İnceleme Komisyonunun görevleri şunlardır:</template>
      <mvz-bent no="a">
        <template>Uluslararası alanda genel kabul gören insan hakları konusundaki gelişmeleri izlemek,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Türkiye'nin insan hakları alanında taraf olduğu uluslararası andlaşmalarla T.C. Anayasası ve diğer milli mevzuat ve uygulamalar arasında uyum sağlamak amacıyla yapılması gereken değişiklikleri tespit etmek ve bu amaçla yasal düzenlemeler önermek,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Türkiye Büyük Millet Meclisi Başkanlığınca havale edilen kanun teklifleri ile olağanüstü hal sırasında çıkarılan Cumhurbaşkanlığı kararnamelerini görüşmek, Türkiye Büyük Millet Meclisi komisyonlarının gündemindeki konular hakkında, istem üzerine görüş ve öneri bildirmek,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Türkiye'nin insan hakları uygulamalarının, taraf olduğu uluslararası andlaşmalara, Anayasa ve Kanunlara uygunluğunu incelemek ve bu amaçla, araştırmalar yapmak, bu konularda iyileştirmeler, çözümler önermek,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>İnsan haklarının ihlale uğradığına dair iddialar ile ilgili başvuruları incelemek veya gerekli gördüğü hallerde ilgili mercilere iletmek,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Gerektiğinde dış ülkelerdeki insan hakları ihlallerini incelemek ve bu ihlalleri o ülke parlamenterlerinin dikkatlerine doğrudan veya mevcut parlamenter forumlar aracılığıyla sunmak,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Her yıl yapılan çalışmaları, elde edilen sonuçları, yurtiçi ve dışında İnsan Haklarına saygı ve uygulamaları kapsayan bir rapor hazırlamak.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Komisyonun Yetkileri">
    <mvz-fıkra no="1">
      <template>İnsan Haklarını İnceleme Komisyonu, görevleri ile ilgili olarak, Bakanlıklarla Genel ve Katma Bütçeli Dairelerden, mahalli idarelerden, muhtarlıklardan, üniversitelerden ve diğer kamu kurum ve kuruluşları ile özel kuruluşlardan bilgi istemek ve buralarda inceleme yapmak, ilgililerini çağırıp bilgi almak yetkisine sahiptir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Komisyon, gerekli gördüğünde uygun bulacağı uzmanların bilgilerine başvurabilir ve Ankara dışında da çalışabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Komisyonun Çalışma Usul ve Esasları">
    <mvz-fıkra no="1">
      <template>İnsan Haklarını İnceleme Komisyonu, üye tamsayısının en az üçte biri ile toplanır ve toplantıya katılanların salt çoğunluğu ile karar verir; ancak karar yeter sayısı hiçbir şekilde üye tamsayısının dörtte birinin bir fazlasından az olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Komisyon, incelemelerini alt komisyonlar kurmak suretiyle de yapabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Komisyon, görevleri ile ilgili olarak hazırladığı raporları Türkiye Büyük Millet Meclisi Başkanlığına sunar. Bu raporlar Danışma Kurulunun görüş ve önerisi ile Genel Kurul gündemine alınabilir ve okunmak suretiyle veya üzerinde görüşme açılarak bilgi edinilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Komisyon raporları Cumhurbaşkanlığı ve ilgili bakanlıklara da Başkanlıkça gönderilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Komisyonun gerekli görmesi halinde; inceleme konusunun sorumluları hakkında genel hükümlere göre kovuşturma veya işlem yapılabilmesi için, Türkiye Büyük Millet Meclisi Başkanlığınca Komisyon raporu ilgili mercie bildirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Komisyon çalışmaları ile ilgili olarak, yurtiçi ve yurtdışı görevlendirmelere ait giderler, Komisyonun Kararı ve Türkiye Büyük Millet Meclisi Başkanının onayı ile 6245 sayılı Harcırah Kanunu hükümlerine göre Türkiye Büyük Millet Meclisi Bütçesinden karşılanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="İnceleme ve Sonucun Bildirilmesi">
    <mvz-fıkra no="1">
      <template>İnsan Haklarını İnceleme Komisyonu, Türkiye Büyük Millet Meclisi Başkanlığınca havale olunan başvurular ile ilgili konuları inceler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Komisyon, başvuruların sonucu veya yapılmakta olan işlem hakkında başvuru sahibine en geç altmış gün içinde bilgi verir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Uygulanacak İçtüzük">
    <mvz-fıkra no="1">
      <template>İnsan Haklarını İnceleme Komisyonunun çalışmalarında, bu Kanunda sarahat olmayan hallerde, Türkiye Büyük Millet Meclisi İçtüzüğü hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Türkiye Büyük Millet Meclisi Başkanının, Türkiye Büyük Millet Meclisi İçtüzüğü gereğince komisyonlar üzerinde haiz olduğu denetleme yetkisi bu Komisyon için de geçerlidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Yürürlük">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Yürütme">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Türkiye Büyük Millet Meclisi Başkanı ile Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
