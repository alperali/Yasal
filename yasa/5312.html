  <mvz-künye tür="kanun" no="5312" başlık="DENİZ ÇEVRESİNİN PETROL VE DİĞER ZARARLI MADDELERLE KİRLENMESİNDE ACİL DURUMLARDA MÜDAHALE VE ZARARLARIN TAZMİNİ ESASLARINA DAİR KANUN"
             tarih="3/3/2005" rgazete-tarih="11/3/2005" rgazete-sayı="25752"
             düstur-tertip="5" düstur-cilt="44" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, deniz emniyetinin sağlanması ve deniz kirliliğinin önlenmesi konusundaki uluslararası hukuk ve iç hukuktan doğan hak ve yükümlülükler göz önünde bulundurularak;</template>
        <mvz-bent no="a">
          <template>Acil durumlarda gemilerden ve kıyı tesislerindeki faaliyetlerden kaynaklanan kirlenme tehlikesini ortadan kaldırmak veya kirlenmeyi azaltmak, sınırlamak ve gidermek üzere uygulanacak müdahale ve hazırlıklı olma esaslarını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Olay sonucu ortaya çıkan zararların tespit ve tazmin esaslarını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Uluslararası yükümlülüklerin yerine getirilmesi esaslarını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kanun kapsamına giren kişilerle kurum, kuruluş, gemi ve tesislerin Kanunda belirtilen ilgililerinin yetki, görev ve sorumluluklarını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Belirlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, uygulama alanlarında bulunan veya herhangi bir nedenle uygulama alanlarına girmek isteyen, beşyüz groston ve daha büyük petrol ve diğer zararlı maddeleri taşıyan gemiler ile petrol ve diğer zararlı maddelerle kirlenmeye neden olabilecek faaliyetleri icra eden kıyı tesislerinin sorumlu taraflarının, bakanlıkların ve kamu kurum ve kuruluşlarının yetki, görev ve sorumluluklarını kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Savaş gemileri ve yardımcı savaş gemileri ile herhangi bir devlete ait veya devlet tarafından işletilen ve ticarî faaliyetler dışında kullanılan gemiler Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen;</template>
        <mvz-bent no="a">
          <template>Acil müdahale birimi: Acil müdahale plânları çerçevesinde koruyucu önlemleri uygulamak veya uygulatmak, kirliliği önlemek veya önletmek, ortadan kaldırmak veya kaldırtmak, çıkacak yangınları söndürmek veya söndürtmek amacıyla oluşturulmuş, yetkilendirilmiş, donatılmış birimi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Acil müdahale plânı: Müdahale faaliyetleri kapsamında teşkilâtlanmayı, yetki, görev ve sorumlulukları, yapılacak işlemleri, hazırlıklı olma, müdahale imkân ve kabiliyetleri ile diğer hususları içeren ulusal, bölgesel ve yerel düzeydeki plânları,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bakanlık: Çevre ve Orman Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Diğer zararlı maddeler: Denizlerin Gemiler Tarafından Kirletilmesinin Önlenmesine Ait Uluslararası Sözleşmenin (MARPOL 73/78) II nci ekinin II nci ve III üncü eklentilerinde listelenmiş maddeler ile bu liste ile sınırlı olmaksızın deniz ortamına karıştığında kirlenme yaratan radyoaktif maddeler hariç her türlü maddeyi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Garantör: Bu Kanunda belirtilen hükümlere göre sorumlu taraf adına, sorumlu taraf dışında zararların tazminine ilişkin malî sorumluluk üstlenen ve malî sorumluluk belgesini sağlayan kişi, kuruluş veya devleti,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Hazırlıklı olma: Olayda acil ve etkin bir önlem almak ve olaydan kaynaklanabilecek zararı en aza indirmek amacıyla müdahale etme kabiliyetine sahip her türlü araç, gereç, donanım, malzeme ve eğitilmiş insan gücünü hazır bulundurma hâlini,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kıyı tesisi: Açık deniz tesisleri ve boru hatları da dahil, kıyıda veya kıyıya yakın bölgelerde denizlerin petrol ve diğer zararlı maddelerle kirlenmesine yol açabilecek faaliyetleri icra eden tesisi,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kirlenme: Olay sonucunda, petrol ve diğer zararlı maddelerin; canlı kaynaklara ve deniz yaşamına zarar verecek, insan sağlığı için tehlike oluşturacak, balıkçılık ve denizlerin diğer yasal amaçlarla kullanımı da dahil olmak üzere, denizcilik faaliyetlerini engelleme, deniz suyunun niteliğini değiştirme ve ekolojik dengeyi bozma gibi zararlı etkiler yaratacak şekilde deniz çevresine karışmasını,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Koruyucu önlem: Bir olayın meydana gelmesinden sonra ortaya çıkabilecek muhtemel kirlenmeyi önlemek veya sınırlı tutmak amacıyla alınan tedbirleri,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Olay: Acil müdahale plânlarının uygulanmasını veya acil müdahaleyi gerektiren çarpışma, kırılma, yangın, patlama veya diğer nedenlerle gemilerden veya kıyı tesislerinden kaynaklanan kirlenme veya zarar ortaya çıkaran veya ortaya çıkma tehlikesi yaratan bir durumu,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Müdahale: Bir olayın meydana gelmesinden sonra ortaya çıkan kirliliğin neden olacağı zararı azaltmak, gidermek, sınırlandırmak amacıyla icra edilen faaliyetleri veya koruyucu önlemlerin uygulanmasını,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Müsteşarlık: Denizcilik Müsteşarlığını,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Petrol: Denizlerin Gemiler Tarafından Kirletilmesinin Önlenmesine Ait Uluslararası Sözleşmenin (MARPOL 73/78) I inci ekinin I inci eklentisinde listelenen maddeler ile bu liste ile sınırlı olmaksızın ham petrol, akaryakıt, slaç, rafine ürünler ve toprak altında doğal olarak meydana gelen her türlü sıvı hidrokarbon karışımını,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Sorumlu taraf: Zararın tazmini ve koruyucu önlemlerin karşılanması konusunda yükümlülük atfedilebilecek, beşyüz groston ve daha büyük petrol ve diğer zararlı maddeleri taşıyan gemiler ile kıyı tesislerinin sahipleri, işletenleri, kaptanları, idare edenleri, kiracıları, zilyetleri ve garantörleri,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Talep sahibi: Bu Kanun hükümlerine göre bir zararın tazmini için talepte bulunan gerçek ve tüzel kişileri,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>Uygulama alanları: Bu Kanunun uygulanması bakımından, Türkiye'nin iç suları, karasuları, kıta sahanlığı ve münhasır ekonomik bölgesinden oluşan deniz yetki alanlarını ve bu Kanunda öngörülen acil durumlarda, bu durumlara müdahale ve zararların tazmini amaçlarıyla sınırlı kalmak kaydıyla, Müsteşarlığın, Bakanlık, Dışişleri Bakanlığı ve ilgili diğer kamu kurum ve kuruluşlarının görüşlerini alarak vereceği karara bağlı olarak karasularının ötesindeki açık deniz alanlarını,</template>
        </mvz-bent>
        <mvz-bent no="r">
          <template>Zarar: Bu Kanunun 6 ncı maddesinde belirtilenler ile zararın tespit, tazmin ve uyuşmazlıkların giderilmesine ilişkin masrafları,</template>
        </mvz-bent>
        <mvz-bent no="s">
          <template>Zararsız geçiş: Türk iç sularına girmeksizin veya iç sular dışında bulunan bir demirleme yerine veya liman tesisine uğramaksızın karasularını katetme amacıyla veya Türk iç sularına ulaşmak veya ayrılmak, iç sular dışında bulunan bir demirleme yerinde veya liman tesisinde durmak veya bunlardan ayrılmak amacıyla Türk karasularında seyretmeyi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Yetki, Görev ve Sorumluluklar">
    <mvz-madde no="4" başlık="Kuruluşların yetki, görev ve sorumlulukları">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanması bakımından genel koordinasyon görevi Bakanlığa aittir. Bu Kanunla yetkili kılınan kurum ve kuruluşlar, bu Kanun kapsamında elde ettikleri bilgiler ile yapılan işlemleri gecikmeksizin Bakanlığa bildirmekle yükümlüdürler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Acil müdahale plânlarının hazırlanması, kıyı alanlarında acil müdahale plânlarının uygulanması, kirlenmenin türü ve etkilerinin belirlenmesi, çevreye olan zararların tespiti ve olay sonrası kirlilikten etkilenen alanların rehabilitasyonuna ilişkin yetki, görev ve sorumluluklar Bakanlığa; deniz araçlarından kaynaklanan deniz kirliliğinin önlenmesine yönelik acil müdahale plânlarının uygulanması, hazırlıklı olma, kirliliğe müdahale, zararların tazmini ve malî sorumluluk garantilerinin bildirimi konularında icraya ilişkin yetki, görev ve sorumluluklar Müsteşarlığa; asayiş ve kolluk görevlerine ilişkin yetki, görev ve sorumluluklar Sahil Güvenlik Komutanlığına aittir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Seyir, can, mal ve çevre emniyetinin sağlanması">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki tüm gemi ve kıyı tesislerinin sorumlu tarafları; olayın meydana gelmesinin önlenmesi, olayın meydana geldiği durumlarda ise zararın azaltılması, giderilmesi, sınırlandırılması amacıyla hazırlıklı olma ve koruyucu önlemler de dahil uluslararası hukukun öngördüğü ve seyir, can, mal ve çevre emniyetinin gerektirdiği yükümlülüklere ilişkin tüm tedbirleri almakla yükümlüdürler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türkiye'nin taraf olduğu uluslararası sözleşmelerde seyir, can, mal ve çevre emniyeti ile ilgili olarak belirlenmiş standartlara uyduğunu, uluslararası kabul görmüş belgelerle ispat edemeyen veya standartlara uymadığı konusunda açık emareler bulunan petrol ve/veya diğer zararlı maddeleri taşıyan bu Kanun kapsamındaki yabancı bayraklı gemilerin, can kurtarma hizmetlerinden kaynaklanacak mücbir sebepler dışında, Türk iç sularına veya iç sular dışındaki bir demir yeri veya liman tesislerine uğramak amacıyla Türk karasularına ve iç sularına girmesine izin verilmez; girmiş olan gemiler derhal buralardan çıkartılır veya standartları sağlaması için en fazla otuz gün süre verilir. Bu süre sonunda standartları sağlamadığı tespit edilen gemiler derhal karasuları dışına çıkartılır. Standartlara uymayan bu Kanun kapsamındaki Türk bayraklı gemiler ise standartları sağlayıncaya kadar bağlanarak seferden yasaklanır. Bu durumdaki gemilerin yükü, gemi veya yük sahibince standartlara uygun başka bir gemiye nakledilir ve mevzuat uyarınca bertaraf edilmesi gereken yüklerin uygun bir şekilde bertarafı sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanun kapsamındaki gemiler, Türk iç sularına veya iç sular dışındaki bir demir yeri veya liman tesislerine uğramak amacı ile Türk karasularına girmeden kırksekiz saat önce veya kalkış limanı ile Türk karasularına girmesine kadarki seyir süresi kırksekiz saatten az olan gemiler kalkış limanından hareketten hemen sonra Müsteşarlığa, gemi ve taşıdığı yükle ilgili bilgileri vermek zorundadır. Bu zorunluluğa uymayan gemilerin Türk karasularına ve iç sularına girmesine izin verilmez; girmiş olan gemiler derhal buralardan çıkartılır. Bildirime ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Seyir, can, mal ve çevre emniyetini sağlamak amacıyla alınan tedbirler, bu Kanun, ilgili mevzuat ve uluslararası düzenlemelerde belirtilen usûl ve esaslara göre, yetkili kuruluşlar tarafından denetlenir. Denetim ile ilgili usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kıyı tesislerinin, muhtemel kirliliğe müdahale etmek üzere bulundurmak zorunda oldukları personel, malzeme ve ekipmanlar ile ilgili usûl ve esaslar yönetmelikle belirlenir. Bulundurmak zorunda oldukları personel, malzeme ve ekipmanlar tamamlanıncaya kadar, yeni kurulacak kıyı tesislerinin faaliyetlerine izin verilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Zararların Tazmini">
    <mvz-madde no="6" başlık="Zarardan dolayı sorumluluk">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren gemi ve kıyı tesislerinin sorumlu tarafları, uygulama alanlarında gemi ve kıyı tesislerinden kaynaklanan olay sonucu ortaya çıkan kirlenmenin veya kirlenme tehlikesinin neden olduğu; temizleme masraflarını, koruyucu önlemlere ilişkin masrafları, canlı kaynaklar ve deniz yaşamına verilen zararları, bozulan çevrenin yeniden oluşturulması, toplanan atıkların taşınması ve bertarafı için yapılacak masrafları, geçim için kullanılan doğal ve canlı kaynaklarda meydana gelen zararları, özel mallardaki zararları, şahısların yaralanması ve ölümünden kaynaklanan zararları, gelir kayıplarını, gelir ve kazanç kapasitelerine verilen zararları ve diğer kamu zararlarını tazmin etmekle müteselsilen sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Garantörün sorumluluğu, diğer sorumlu tarafların sorumluluğunu ortadan kaldırmaz. Garantörün tazmin etmediği zararlar diğer sorumlu taraflarca tazmin edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İki veya daha fazla geminin karışmasıyla meydana gelen bir olayda ortaya çıkan zarardan tüm gemilerin sorumlu tarafları müştereken ve müteselsilen sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Olay sonucu ortaya çıkan zararı ödeyenlerin zarara neden olanlara rücû hakkı saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Sorumluluğun sınırı">
      <mvz-fıkra no="1">
        <template>Gemi başına sorumlu taraf yükümlülüğünün toplamı ve sorumlu tarafa yüklenecek azamî tazminat miktarı konusunda Türkiye'nin taraf olduğu uluslararası sözleşme hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Malî sorumluluk garantileri">
      <mvz-fıkra no="1">
        <template>Uygulama alanlarına girmek isteyen petrol ve/veya diğer zararlı maddeleri taşıyan gemiler, Türkiye'nin taraf olduğu uluslararası sözleşmeler uyarınca kendilerinden istenen malî sorumluluk belgelerine sahip olmak, bunları ilgili makamlara bildirmek ve talep edildiğinde göstermek zorundadırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türkiye'nin taraf olduğu uluslararası sözleşmelerde öngörülen malî sorumluluk garantilerine sahip olmadıkları belirlenen bu Kanun kapsamındaki yabancı bayraklı gemilerin, can kurtarma hizmetlerinden kaynaklanacak mücbir sebepler dışında, Türk iç sularına veya iç sular dışındaki bir demir yeri veya liman tesislerine uğramak amacıyla Türk karasularına ve iç sularına girmesine izin verilmez; girmiş olan gemiler derhal buralardan çıkartılır veya şartları sağlaması için en fazla otuz gün süre verilir. Bu süre sonunda şartları sağlamadığı tespit edilen gemiler derhal karasuları dışına çıkartılır. Şartlara uymayan bu Kanun kapsamındaki Türk bayraklı gemiler ise şartları sağlayıncaya kadar bağlanarak seferden yasaklanır. Bu durumdaki gemilerin yükü, gemi veya yük sahibince şartlara uygun başka bir gemiye nakledilir ve mevzuat uyarınca bertaraf edilmesi gereken yüklerin uygun bir şekilde bertarafı sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kıyı tesisleri, bu Kanun kapsamındaki zararlara karşı malî sorumluluk sigortası yaptırmak zorundadır. Sigorta yaptırma zorunluluğuna uymayan kıyı tesislerinin faaliyetine izin verilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıdaki fıkrada öngörülen zorunlu malî sorumluluk sigortasının, Hazine Müsteşarlığınca belirlenen sigorta şirketleri tarafından ya da bu şirketlerin kendi aralarında kuracakları bir havuz tarafından yapılması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bakanlık, Hazine Müsteşarlığının uygun görüşünü almak kaydıyla, kıyı tesislerinin malî sorumluluk sigortası yaptırma zorunluluğunu, bu sigortaya ilişkin genel şartlar ile tarife ve talimatların yürürlüğe girmesinden itibaren en çok bir yıl ertelemeye yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kıyı tesisleri tarafından yaptırılacak malî sorumluluk sigortasına ilişkin sigorta genel şartları Hazine Müsteşarlığınca onaylanır. Malî sorumluluk sigortası tarife ve talimatları Hazine Müsteşarlığının bağlı olduğu Bakan tarafından tespit edilir. Hazine Müsteşarlığının bağlı olduğu Bakan tarifeyi serbest bırakmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Malî sorumluluk garantilerinin bildirimi">
      <mvz-fıkra no="1">
        <template>Herhangi bir Türk limanına gitmek üzere Türkiye'nin karasularına girmek isteyen ve bu Kanuna göre malî sorumluluk garantileri bulundurmakla yükümlü gemilerin 8 inci maddede belirtilen belgelerinin sureti, gidecekleri liman başkanlıklarına, Türk karasularına girişten önce, Türkiye'de mukim bir acente vasıtası ile ulaştırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türk boğazlarından uğraksız geçiş amacıyla Türkiye'nin karasularına girmek isteyen gemiler için bildirim yükümlülükleri Cumhurbaşkanınca yürürlüğe konulan yönetmelik ile belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Zararsız geçiş amacıyla Türkiye'nin karasularını kullanacak gemiler, her türlü muhabere aracı ve malî sorumluluk belgelerindeki bilgiler ile geminin adı, çağrı adı, bayrağı, tescil limanı, geminin sahibinin adı ve idare merkezinin yeri, geminin Uluslararası Denizcilik Örgütü numarası (IMO No), teminat türü, teminat geçerlilik süresi, sigortacının adı ve merkezinin bulunduğu yer, tazmin limitleri ve geminin yükü ve miktarı, geminin tipi, kalkış ve varış limanına ilişkin bilgi ve belgeleri en yakın liman yetkilisine bildirmek zorundadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Zararların belirlenmesi">
      <mvz-fıkra no="1">
        <template>Bakanlık temsilcisinin başkanlığında; Müsteşarlık, Sahil Güvenlik Komutanlığı, Kıyı Emniyeti ve Gemi Kurtarma İşletmeleri Genel Müdürlüğü ile ilgili valilik ve belediyelerin temsilcilerinden zarar tespit komisyonu oluşturulur. Komisyon gerek görürse ilgili diğer kurum ve kuruluşların temsilcilerini ve uzmanlarını da komisyona çağırabilir. Komisyonun çalışmalarına ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Komisyon, zararların tamamının veya bir kısmının tespitini, bu konuda uzman Türk veya yabancı kişi ve kuruluşlara yaptırabilir. Bu şekilde tespit edilen zarar miktarı, komisyon tarafından onaylanması üzerine geçerlilik kazanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Tazminat ve ücret talepleri ve ödenmesi">
      <mvz-fıkra no="1">
        <template>Olaydan zarar görenlerin tazminat talepleri ile kirliliğe müdahale ve kirliliği bertaraf edenlerin ücret talepleri Müsteşarlığa bildirilir. Müsteşarlık, zararların tespitine ve uyuşmazlıkların giderilmesine bağlı olarak zararların sorumlu taraflarca tazminini ve ücretlerin ödenmesini sağlar. Komisyon tarafından belirlenen zarar miktarı üzerinde taraflarca uzlaşma sağlanması durumunda Müsteşarlık, zararların sorumlu taraf veya garantöründen talep ve tahsiline ve zarar görenlere dağıtılmasına yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kirletenin tespit edilememesi halinde Müsteşarlık tarafından kirliliğe müdahale edilir veya ettirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Müsteşarlık, Bakanlığın ve Dışişleri Bakanlığının görüşlerini alarak bu Kanun kapsamında kirliliğe neden olan ancak, sorumlu tarafları bulunamayan yabancı bayraklı gemilerin Türkiye'de neden oldukları zararların tazmini konusunda bayrak devletinden yardım talep edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tazmin ve ödemelere ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Zamanaşımı">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki olaylar nedeniyle tazminat taleplerinde zamanaşımı süresi, diğer kanunlarda daha uzun bir süre öngörülmedikçe, zararın öğrenildiği ve sorumlu tarafın tespit edildiği tarihten itibaren beş yıl, her hâlde olayın meydana geldiği tarihten veya olay, olaylar zincirinden meydana geliyorsa son olayın meydana geldiği tarihten itibaren on yıldır. Zamanaşımı süresine ilişkin olarak Türkiye'nin taraf olduğu uluslararası sözleşme hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Müdahale Esasları">
    <mvz-madde no="13" başlık="Bildirim">
      <mvz-fıkra no="1">
        <template>Olaya karışan, olayı gören, duyan veya olaydan haberdar olan herkes, kirlenme veya kirlenme tehlikesini ilgili makam ve acil müdahale birimlerine bildirmekle yükümlüdür. Bildirilecek makamlar ve bildirime ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Kirlenmenin tespiti">
      <mvz-fıkra no="1">
        <template>Bakanlık, bir olay sonucu meydana gelen kirlenmenin türü, kapsamı, miktarı, yayılma yönü ve hızı, muhtemel sonuçları ve bertaraf yöntemleri konularında gerekli çalışmaları yapar veya yaptırır ve ilgili acil müdahale birimine bildirir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Müdahale">
      <mvz-fıkra no="1">
        <template>Olay sonucunda ortaya çıkan kirlenmeye ve kirlenme tehlikesine müdahale etme yetkisi Müsteşarlığa aittir. Müsteşarlık bu görevi, Bakanlığın görüşlerini alarak, diğer kamu kurum ve kuruluşlarına ve bu alanda meslek icra eden veya bu amaçla kurulmuş olan ve merkezi Türkiye'de bulunan şirketlere yaptırabilir. Bu durum, Müsteşarlığın sorumluluğunu ortadan kaldırmaz ve görevlendirilen kamu kurum ve kuruluşlarına ve şirketlere, sorumlu taraftan doğrudan tazminat talep etme yetkisi vermez. Kıyı Emniyeti ve Gemi Kurtarma İşletmeleri Genel Müdürlüğünün kurtarma ve yardıma ilişkin hakları saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen yetkiler gerektiğinde Bakanlık tarafından da kullanılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Gemilerin veya kıyı tesislerinin neden olduğu kirlenmede, olaya karışan gemiler ve olay yakınındaki gemiler ile kıyı tesisleri, üzerlerinde bulundurdukları personel, teçhizat ve malzemelerle sınırlı olarak ilk müdahalede bulunurlar veya bulundurturlar, yetkili acil müdahale biriminin olaya müdahalesinden sonra bu birimin talimatlarına uyarlar. Müsteşarlık, gerçekleştirilen müdahale faaliyetlerini Bakanlığa bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Türkiye'nin taraf olduğu uluslararası sözleşmeler ve bu çerçevede hazırlanmış acil müdahale plânlarında belirtilen uluslararası işbirliği hükümlerine göre, Türkiye'ye yabancı acil müdahale unsurlarını davet etmeye veya yabancı ülkelere Türk acil müdahale ekibi göndermeye ve bunlara ait harcamaları ödemeye veya talep etmeye, Bakanlığın ve Dışişleri Bakanlığının görüşlerini alarak, Müsteşarlık yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Acil müdahale birimi olarak görev yapacak özel kuruluşlar ile kamu kurum ve kuruluşları ve uluslararası işbirliği çerçevesinde davet edilmiş yabancı ülke acil müdahale unsurlarının müdahale yetkisine ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Müdahale faaliyetlerinin etkinliğini artırmak amacıyla Müsteşarlık, olay bölgesinde veya olayla ilgili uygun gördüğü deniz alanlarında deniz trafiğini geçici olarak askıya alabilir veya değiştirebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Atıkların taşınması ve bertarafı">
      <mvz-fıkra no="1">
        <template>Olay bölgesinde toplanan atıkların uygun bertaraf tesisine taşınması ve bertarafı, acil müdahale plânlarında belirlenen esaslara göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Kirlilikten etkilenen alanların tespiti ve rehabilitasyonu">
      <mvz-fıkra no="1">
        <template>Müdahale işlemleri sonrasında, kirlilikten etkilenen alanların tespiti ve rehabilitasyonu çalışmaları ile kirliliğin insan sağlığı, bitki ve hayvan varlığı ile doğal ve tarihsel değerler üzerinde uzun dönemli etkilerinin tespiti amacıyla Bakanlıkça izleme programları yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Acil müdahale plânları">
      <mvz-fıkra no="1">
        <template>Deniz çevresinin petrol ve diğer zararlı maddelerden kirlenmesinde acil durumlarda müdahaleye ilişkin faaliyetleri ve uluslararası işbirliğine ilişkin esasları içeren ulusal acil müdahale plânı, Türkiye Acil Durum Yönetimi Genel Müdürlüğü ve ilgili kuruluşların görüşü alınmak suretiyle Müsteşarlıkla koordinasyon sağlanarak Bakanlıkça hazırlanır. Ulusal acil müdahale plânı ile bölgesel ve yerel düzeydeki acil müdahale plânlarının hazırlanmasına ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Acil durum yönetimine geçilmesi halinde koordinasyon">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki bir olay nedeniyle 10.10.1984 tarihli ve 3056 sayılı Kanunun 11/A maddesi uyarınca Bakanlığın talebi üzerine acil durum yönetimine geçilmesi durumunda, bu Kanun kapsamında yetkilendirilecek acil müdahale birimi, oluşturulacak merkezlerin birer unsuru olarak görev yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Acil durum yönetimine geçilmesini gerektirmemekle birlikte bu Kanun kapsamında yer alan bir olayın karayı da etkilemesi durumunda, bu Kanun kapsamında yetkilendirilecek acil müdahale birimi, birinci fıkrada belirtilen hükümler uyarınca oluşturulacak merkezlerin birer unsuru olarak görev yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci ve ikinci fıkralarda öngörülen durumlarda, 10 uncu maddede belirtilen komisyona Türkiye Acil Durum Yönetimi Genel Müdürlüğü temsilcileri de katılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Çeşitli Hükümler">
    <mvz-madde no="20" başlık="Uyuşmazlıkların çözümü için hakem tayini">
      <mvz-fıkra no="1">
        <template>Müsteşarlık ile sorumlu taraf veya garantörünün uzlaşması halinde bu Kanunun uygulanmasından doğacak uyuşmazlıkların çözümü için hakem veya hakem heyeti tayin edilebilir. Tayin edilen hakemler Türk hukukunu uygular. Tahkim, ilgisine göre 1086 sayılı Hukuk Usulü Muhakemeleri Kanunu veya 4686 sayılı Milletlerarası Tahkim Kanunu hükümlerine tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Tehlike altındaki gemilerin uygun, güvenli deniz alanlarına kabulü">
      <mvz-fıkra no="1">
        <template>Tehlike altındaki bir geminin, talebi halinde, uygun, güvenli deniz alanlarına kabulüne Müsteşarlık yetkilidir. Kabule ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Geminin denetimi ve kolluk görevleri">
      <mvz-fıkra no="1">
        <template>Bir geminin bu Kanun kapsamında bir olaya veya kirliliğe neden olacağı veya böyle bir risk oluşturacağı yönünde ciddi şüphelerin bulunduğu durumlarda, Müsteşarlık kesin tespit için gemiyi denetime tâbi tutabilir. Müsteşarlık, bu yetkisini gerekli gördüğü hâllerde ilgili kurum ve kuruluşlara devredebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun uygulanmasına ilişkin tüm asayiş ve kolluk görevleri Sahil Güvenlik Komutanlığı tarafından yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Gemi yakıtlarından ve yüklerden kaynaklanan kirlilik">
      <mvz-fıkra no="1">
        <template>Bir olayda, bu Kanuna tâbi olan veya olmayan bir geminin yakıt olarak taşıdığı petrol veya türevlerinden veya bu Kanuna tâbi olmayan geminin taşıdığı diğer zararlı maddelerden/yüklerden meydana gelen kirliliğe veya kirlilik tehlikesine müdahale ve zararların tespit ve tazmininde, bu Kanunun 5 inci maddesinin üçüncü fıkrası ile 8 inci ve 9 uncu maddeleri dışındaki hükümleri uygulanır. Türkiye'nin taraf olduğu uluslararası sözleşme hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Yönetmelikler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasına ilişkin yönetmelikler, ilgili bakanlık ve kuruluşların görüşü alınmak suretiyle Bakanlık ve Müsteşarlık tarafından müştereken hazırlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Değiştirilen hükümler" durum="işlenmiş">
      <mvz-fıkra no="1">
        <template>(4.1.2002 tarihli ve 4734 sayılı Kamu İhale Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="" durum="işlenmiş">
      <mvz-fıkra no="1">
        <template>(4.1.2002 tarihli ve 4734 sayılı Kamu İhale Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen yönetmelikler, Kanunun yürürlüğe girdiği tarihten itibaren en geç bir yıl; malî sorumluluk sigortasına ilişkin genel şartlar ile tarife ve talimatlar bu Kanunun yürürlüğe girdiği tarihten itibaren en geç altı ay içinde hazırlanır ve Resmi Gazetede yayımlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte faal durumda bulunan tesislerden, bu Kanunun 5 inci maddesinin son fıkrasına göre bulundurmak zorunda oldukları personel, malzeme ve ekipmanlara ilişkin eksiklerini yönetmelikte belirtilen süre içinde tamamlamayanların faaliyetleri Bakanlık tarafından durdurulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinden itibaren üç ay sonra yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
