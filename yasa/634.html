  <mvz-künye tür="kanun" no="634" başlık="KAT MÜLKİYETİ KANUNU"
             tarih="23/6/1965" rgazete-tarih="2/7/1965" rgazete-sayı="12038"
             düstur-tertip="5" düstur-cilt="4" düstur-sayfa="2932" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-b1 no="A" başlık="Kat mülkiyeti ve kat irtifakı">
      <mvz-b2 no="I" başlık="Genel kural">
        <mvz-madde no="1" başlık="">
          <mvz-fıkra no="1">
            <template>Tamamlanmış bir yapının kat, daire, iş bürosu, dükkan, mağaza, mahzen, depo gibi bölümlerinden ayrı ayrı ve başlı başına kullanılmaya elverişli olanları üzerinde, o gayrimenkulün maliki veya ortak malikleri tarafından, bu Kanun hükümlerine göre, bağımsız mülkiyet hakları kurulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yapılmakta veya ileride yapılacak olan bir yapının, birinci fıkrada yazılı nitelikteki bölümleri üzerinde, yapı tamamlandıktan sonra geçilecek kat mülkiyetine esas olmak üzere, arsa maliki veya arsanın ortak malikleri tarafından, bu Kanun hükümlerine göre irtifak hakları kurulabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Tarifler">
        <mvz-madde no="2" başlık="">
          <mvz-fıkra no="1">
            <template>Bu Kanuna göre</template>
            <mvz-bent no="a">
              <template>Kat mülkiyetine konu olan gayrimenkulün bütününe (Anagayrimenkul); yalnız esas yapı kısmına (Anayapı) anagayrimenkulün ayrı ayrı ve başlı başına kullanılmaya elverişli olup, bu Kanun hükümlerine göre bağımsız mülkiyete konu olan bölümlerine (Bağımsız bölüm); bir bağımsız bölümün dışında olup, doğrudan doğruya o bölüme tahsis edilmiş olan yerlere (Eklenti); bağımsız bölümler üzerinde kurulan mülkiyet hakkına (Kat mülkiyeti) ve bu hakka sahip olanlara (Kat maliki);</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Anagayrimenkulün bağımsız bölümleri dışında kalıp, korunma ve ortaklaşa kullanma veya faydalanmaya yarıyan yerlerine (Ortak yerler); kat maliklerinin ortak malik sıfatiyle paydaşı bulundukları bu yerler üzerindeki faydalanma haklarına (Kullanma hakkı);</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bir arsa üzerinde ileride kat mülkiyetine konu olmak üzere yapılacak veya yapılmakta olan bir veya birden çok yapının bağımsız bölümleri için o arsanın maliki veya ortak malikleri tarafından bu Kanun hükümlerine göre kurulan irtifak hakkına (kat irtifakı); bu hakka sahip olanlara da (kat irtifak sahibi);</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Arsanın, bu Kanunda yazılı esasa göre bağımsız bölümlere tahsis edilen ortak mülkiyet paylarına (Arsa payı);</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kat mülkiyetinin veya irtifakının kurulmasına ait resmi senede (Sözleşme);</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>denir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Kat mülkiyetinin ve kat irtifakının niteliği">
        <mvz-madde no="3" başlık="">
          <mvz-fıkra no="1">
            <template>Kat mülkiyeti, arsa payı ve anagayrimenkuldeki ortak yerlerle bağlantılı özel bir mülkiyettir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kat mülkiyeti ve kat irtifakı, bu mülkiyete konu olan anagayrimenkulün bağımsız bölümlerinden her birinin konum ve büyüklüklerine göre hesaplanan değerleri ile oranlı olarak projesinde tahsis edilen arsa payının ortak mülkiyet esaslarına göre açıkça gösterilmesi suretiyle kurulur. Arsa paylarının bağımsız bölümlerin payları ile oranlı olarak tahsis edilmediği hallerde, her kat maliki veya kat irtifakı sahibi, arsa paylarının yeniden düzenlenmesi için mahkemeye başvurabilir. Bağımsız bölümlerden her birine bu fıkra uyarınca tahsis edilen arsa payı, o bölümlerin değerinde sonradan meydana gelen çoğalma veya azalma sebebiyle değiştirilemez. 44 üncü madde hükmü saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kat irtifakı arsa payına bağlı bir irtifak çeşidi olup, yapının tamamı için düzenlenecek yapı kullanma izin belgesine dayalı olarak, bu Kanunda gösterilen şartlar uyarınca kat mülkiyetine resen çevrilir. Bu işlem, arsa malikinin veya kat irtifakına sahip ortak maliklerden birinin istemi ile dahi gerçekleştirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Ortak yerler">
        <mvz-madde no="4" başlık="">
          <mvz-fıkra no="1">
            <template>Ortak yerlerin konusu sözleşme ile belirtilebilir. Aşağıda yazılı yerler ve şeyler bu Kanun gereğince her halde ortak yer sayılır.</template>
            <mvz-bent no="a">
              <template>Temeller ve ana duvarlar, taşıyıcı sistemi oluşturan kiriş, kolon ve perde duvarlar ile taşıyıcı sistemin parçası diğer elemanlar,bağımsız bölümleri ayıran ortak duvarlar, tavan ve tabanlar, avlular, genel giriş kapıları, antreler, merdivenler, asansörler, sahanlıklar, koridorlar ve buralardaki genel tuvalet ve lavabolar, kapıcı daire veya odaları, genel çamaşırlık ve çamaşır kurutma yerleri, genel kömürlük ve ortak garajlar, elektrik, su ve havagazı saatlerinin korunmasına mahsus olup bağımsız bölüm dışında bulunan yuvalar ve kapalı kısımlar, kalorifer daireleri, kuyu ve sarnıçlar, yapının genel su depoları, sığınaklar,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Her kat malikinin kendi bölümü dışındaki kanalizasyon tesisleri ve çöp kanalları ile kalorifer, su, havagazı ve elektrik tesisleri, telefon, radyo ve televizyon için ortak şebeke ve antenler sıcak ve soğuk hava tesisleri,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Çatılar, bacalar, genel dam terasları, yağmur olukları, yangın emniyet merdivenleri.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıda sayılanların dışında kalıp da, yine ortaklaşa kullanma, korunma veya faydalanma için zaruri olan diğer yerler ve şeyler de (Ortak yer) konusuna girer.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Bağlantılar">
      <mvz-b2 no="I" başlık="Bağımsız bölümlerle arsa payı arasındaki bağlantı">
        <mvz-madde no="5" başlık="">
          <mvz-fıkra no="1">
            <template>Kat mülkiyetinin başkasına devri veya miras yoluyla geçmesi halinde, ona bağlı arsa payı da birlikte geçer; arsa payı, kat mülkiyetinden veya kat irtifakından ayrı olarak devredilemiyeceği gibi, miras yoluyla da geçmez ve başka bir hakla kayıtlanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Anagayrimenkulde, kat mülkiyetine bağlanmamış veya lehine kat irtifakı kurulmamış arsa payı bırakılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kat mülkiyetini kayıtlayan haklar, kendiliğinden arsa payını da kayıtlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kat irtifakına konu olan arsa üzerinde bu hakla bağdaşması mümkün olmayan irtifaklar kurulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Anagayrimenkulde kat mülkiyetinin kurulmasından önce o gayrimenkulün kütükteki sayfasına tescil veya şerhedilmiş olan haklar kat mülkiyetini de, kaide olarak arsa payı oranında, kendiliğinden kayıtlar.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Bağımsız bölümlerle eklentiler ve ortak yerler arasındaki bağlantı">
        <mvz-madde no="6" başlık="">
          <mvz-fıkra no="1">
            <template>Bir bağımsız bölümün dışında olup, doğrudan doğruya o bölüme tahsis edilmiş olan kömürlük, su deposu, garaj, elektrik, havagazı veya su saati yuvaları, tuvalet gibi eklentiler, ait olduğu bağımsız bölümün bütünleyici parçası sayılır ve o bölümün maliki, eklentilerin de tek başına maliki olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eklentiler kat mülkiyeti kütüğünün  hanesine kaydedilir ve bunlardan anayapının oturduğu zeminin dışında kalanlar kadastro planında veya tapu haritasında ayrıca gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bağımsız bölüm üzerinde kat mülkiyetiyle ve diğer kat maliklerinin haklariyle bağdaşması mümkün olmayan irtifaklar kurulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bağımsız bölümlerin başkasına devri, kayıtlanması veya kiralanması halinde, eklentiler ve ortak yerler de kendiliğinden devredilmiş, kayıtlanmış vaya kiralanmış olur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Ortaklığın (Şüyuun) giderilmesi ve öncelikle satınalma (Şüf'a) hakkı">
      <mvz-b2 no="I" başlık="Ortaklığın giderilmesi">
        <mvz-madde no="7" başlık="">
          <mvz-fıkra no="1">
            <template>Kat mülkiyetine veya kat irtifakına tabi olan gayrimenkulde ortaklığın giderilmesi istenemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bağımsız bölümler, bağımsız bir gayrimenkul gibi dava ve takip konusu olabilir bunlarda ortaklığın giderilmesi istenebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Öncelikle satınalma hakkı">
        <mvz-madde no="8" başlık="">
          <mvz-fıkra no="1">
            <template>Kat mülkiyeti kurulmuş bir gayrimenkulün bağımsız bölümlerinden birinin veya kat irtifakı bağlanmış arsa payının satılması halinde diğer kat maliklerinin veya irtifak hakkı sahiplerinin öncelikle satın alma hakkı yoktur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir bağımsız bölümün paydaşlarından birinin kendi payını başkasına satması halinde öteki paydaşlar, öncelikle satınalma hakkını kullanabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sözleşmede bu maddenin aksine hüküm konulabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Genel hükümlerin uygulanma alanı">
      <mvz-madde no="9" başlık="">
        <mvz-fıkra no="1">
          <template>Kat mülkiyetine veya kat irtifakına ait kütük kaydında veya kat malikleri arasındaki sözleşmede veya yönetim planında veya bu kanunda hüküm bulunmayan hallerde, kat mülkiyetinden doğan anlaşmazlıklar, Medeni Kanun ve ilgili diğer kanunlar hükümlerine göre karara bağlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Kat Mülkiyetinin ve Kat İrtifakının Kurulması">
    <mvz-b1 no="A" başlık="Genel kural">
      <mvz-madde no="10" başlık="">
        <mvz-fıkra no="1">
          <template>Kat mülkiyeti ve kat irtifakı resmi senetle ve tapu siciline tescil ile doğar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Anagayrimenkulün tümünün mülkiyeti  ne çevrilmeden o gayrimenkulün yalnız bir veya birkaç bölümü üzerinde kat mülkiyeti kurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kat mülkiyeti kurulurken aynı katta birbirine bitişik bulunan aynı nevideki birden fazla bağımsız bölüm veya bir yapının otel, iş veya ticaret yeri gibi iktisadî açıdan veya kullanma bakımından bütünlük arz eden birden çok katı veya bölümü, kat mülkiyeti kütüğüne tek bağımsız bölüm olarak tescil edilebilir. Böyle bir tescilin yapılabilmesi için, buna uygun değişiklik projesinin ve yapı kullanma izin belgesinin Tapu Sicil Müdürlüğüne verilmiş olması gereklidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kat mülkiyetinin tescili, tapu memurunca düzenlenen resmî senet uyarınca veya aşağıdaki fıkralara göre yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Hak sahiplerine isabet eden bağımsız bölümlerin belirlenmiş olması şartıyla arsa maliki ile yüklenici arasında düzenlenen kat karşılığı inşaat sözleşmesi, kat karşılığı temlik sözleşmesi veya bağımsız bölümlerin taksimine ilişkin noterlik sözleşmesine istinaden inşa edilecek olan binaya ilişkin  kat irtifakı ve kat mülkiyeti tesisi işlemi, yüklenici tarafından talep edilmesi halinde ilgili idare tarafından yapılır. Tapuya tescil işlemlerinde elektronik ortamda düzenlenen ve ilgili idare tarafından onaylı mimari proje ile yönetim planı esas alınır. Mimari proje ile yönetim planında malik imzası aranmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Yapı kullanma izin belgesi düzenlenen tüm yapıların cins değişikliği işlemleri resen yapılır. Yapı kullanma izin belgesini düzenlemeye yetkili idare tarafından Mekânsal Adres Kayıt Sistemine yüklenerek elektronik ortamda kadastro müdürlüğüne gönderilen yapı kullanma izin belgesi ile yapı aplikasyon projesine göre kadastro müdürlüğünce tescil bildirimi düzenlenir. Tapu müdürlüğüne gönderilen tescil bildirimi üzerine başkaca bir belge aranmaksızın cins değişikliği resen tescil edilir. Cins değişikliği yapılmış taşınmaz kat irtifakı tesisli ise, kat irtifakının tesciline ait resmî senede ve 12 nci maddede yazılı belgelere dayalı olarak başkaca bir belge aranmaksızın resen kat mülkiyetine çevrilir. Bu işlemler, döner sermaye hizmet bedelinden muaftır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kat mülkiyetine konu olmaya elverişli bir gayrimenkul üzerindeki ortaklığın giderilmesi davalarında, mirasçılardan veya ortak maliklerden biri, paylaşmanın, kat mülkiyeti kurulması ve bağımsız bölümlerin tahsisi suretiyle yapılmasını isterse, hakim, o gayrimenkulün mülkiyetinin, 12 nci maddede yazılı belgelere dayanılarak kat mülkiyetine çevrilmesine ve paylar denkleştirilmek suretiyle bağımsız bölümlerin ortaklara ayrı ayrı tahsisine karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Gelirinin ortak giderlere harcanması için veya başka bir amaçla ortak yararlanmaya tahsis edilen bağımsız bölümlerin malik hanesine, bunlardan yararlanan "bağımsız bölümlerin numaraları" yazılmak suretiyle kat mülkiyeti kütüğüne tescil edilir. Bu husus bağımsız bölümlerin beyanlar hanesinde gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Kat mülkiyeti kütüğü">
      <mvz-madde no="11" başlık="">
        <mvz-fıkra no="1">
          <template>Kat mülkiyeti ve kat irtifakı, Tapu Sicili Tüzüğüne göre tutulacak kat mülkiyeti kütüğüne tescil olunur. Bu Kanunda aksine hüküm olmadıkça, tescille ilgili genel hükümler, kat mülkiyeti kütüğüne yapılacak tescillerde de uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Henüz kadastrosu yapılmamış olan yerlerde kat mülkiyeti ve kat irtifakı, Tapu Sicili Tüzüğündeki formüle göre, ayrıca tutulacak Kat Mülkiyeti Zabıt Defterine tescil olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Kat mülkiyetinin kurulması">
      <mvz-b2 no="I" başlık="İstem ve belgeler">
        <mvz-madde no="12" başlık="">
          <mvz-fıkra no="1">
            <template>Kat mülkiyetinin kurulması için, anagayrimenkulün kat mülkiyetine çevrilmesi hususunda o gayrimenkulün maliki veya bütün paydaşlarının aşağıda yazılı belgeler ile birlikte tapu idaresinde istemde bulunması gerekir:</template>
            <mvz-bent no="a">
              <template>Anagayrimenkulde, yapı veya yapıların dış cepheler ve iç taksimatı bağımsız bölüm, eklenti, ortak yerlerinin ölçüleri ve bağımsız bölümlerin konum ve büyüklüklerine göre hesaplanan değerleriyle oranlı arsa payları, kat, daire, iş bürosu gibi nevi ile bunların birden başlayıp sırayla giden numarası ve bağımsız bölümlerin yapı inşaat alanı da açıkça gösterilmek suretiyle, proje müellifi mimar tarafından yapılan, yetkili kamu kurum ve kuruluşlarınca anagayrimenkulün maliki veya bütün paydaşlarının imzaları alınarak onaylanan ve elektronik ortamda tapu müdürlüğüne gönderilen mimarî proje ile yapı kullanma izin belgesi.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bağımsız bölümlerin kullanılış tarzına, birden çok yapının varlığı halinde bu yapıların özelliğine göre 28 inci maddedeki esaslar çerçevesinde hazırlanmış, kat mülkiyetini kuran malik veya malikler tarafından imzalanmış bir yönetim plânı.</template>
            </mvz-bent>
            <mvz-bent no="c" durum="mülga">
              <template></template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Sözleşme ve tescil">
        <mvz-madde no="13" başlık="">
          <mvz-fıkra no="1">
            <template>Tapu memuru kendisine verilen belgelerin tamam ve usulüne uygun ve dilekçeyi verenlerin veya istemde bulunanların yetkili olduklarına kanaat getirdikten sonra, kat mülkiyeti veya kat irtifakı kurulmasına dair resmi sözleşmeyi düzenler. Bu sözleşme aynı zamanda tescil istemi sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sözleşme düzenlenince kat irtifakının kat mülkiyetine çevrilmesinde kat irtifakının kayıtlı olduğu kat mülkiyeti kütüğü sayfasındaki, doğrudan doğruya kat mülkiyetinin kurulması halinde ise anagayrimenkulün kayıtlı bulunduğu tapu kütüğü sayfasındaki mülkiyet hanesine "Bu gayrimenkulün mülkiyeti kat mülkiyetine çevrilmiştir." ibaresi yazılarak, sayfa anagayrimenkulün leh ve aleyhine tesis edilecek irtifak hakları dışındaki işlemlere kapatılır ve kat mülkiyetine konu olan her bağımsız bölüm, kat mülkiyeti kütüğünün ayrı bir sayfasına o bölüme bağlı arsa payı ve anagayrimenkulün kayıtlı bulunduğu genel kütükteki pafta, ada, parsel, defter ve sayfa numaraları gösterilmek suretiyle tescil edilir; anagayrimenkulün kayıtlı bulunduğu genel kütük sayfasına da, bağımsız bölümlerin kat mülkiyeti kütüğündeki defter ve sayfa numaraları işlenmek suretiyle, kütükler arasında bağlantı sağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Anagayrimenkulün sayfasında evvelce mevcut olan haklara ait sicil kaydı, irtifak hakları hariç, bağımsız bölümlerin kat mülkiyeti kütüğündeki sayfasına geçirilir. Anagayrimenkulün mülkiyetinin kat mülkiyetine çevrilmesinden sonra, anagayrimenkulün leh ve aleyhine tesis edilecek irtifak hakları da anagayrimenkulün tapu kütüğü sayfasına tescil edilir ve kat mülkiyeti kütüğünün beyanlar hanesinde belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kat mülkiyeti kütüğüne tescil edilen her bağımsız bölüm ayrı bir gayrimenkul niteliğini kazanır ve kütükte o bölümün tasdikli planındaki numarayı alır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kat malikine, anagayrimenkulun çaplı tasarruf belgesinden başka, istem halinde, 12 nci maddenin (a) bendinde belirtilen projeden kendi bağımsız bölümüne ait olan kısmının tasdikli bir örneği de verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Kat irtifakının kurulması">
      <mvz-madde no="14" başlık="">
        <mvz-fıkra no="1">
          <template>Henüz yapı yapılmamış veya yapısı tamamlanmamış bir arsa üzerinde kat irtifakının kurulması ve tapu siciline tescil edilmesi için o arsanın malikinin veya bütün paydaşlarının buna ait istem ile birlikte 12 nci maddenin birinci fıkrasının (a) bendine uygun olarak düzenlenen, yetkili kamu kurum ve kuruluşlarınca anagayrimenkulün maliki veya bütün paydaşlarının imzaları alınarak onaylanan ve elektronik ortamda tapu müdürlüğüne gönderilen proje ile (b) bendindeki yönetim plânını tapu idaresine vermeleri lazımdır. Kat mülkiyetine geçişte ayrıca yönetim plânı istenmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir arsa üzerinde kat irtifakları ancak sözleşmede veya dilekçede her kat irtifakının ilgili bulunduğu bağımsız bölüme tahsisi istenen arsa payı, arsanın kayıtlı olduğu kütüğün  hanesinde belirtilmek suretiyle kurulur ve yapının, verilen projeye göre tamamlanmasından sonra kat mülkiyetine konu olacak bağımsız bölümlerinin numarası ve bu bölümlere bağlı eklentiler kütüğün beyanlar hanesinde belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="4" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Kat Maliklerinin ve Kat İrtifakı Sahiplerinin Hakları">
    <mvz-b1 no="A" başlık="Kat maliklerinin hakları">
      <mvz-b2 no="I" başlık="Bağımsız bölüm üzerinde">
        <mvz-madde no="15" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikleri kendilerine ait bağımsız bölümler üzerinde, bu kanunun ilgili hükümleri saklı kalmak şartiyle, Medeni Kanunun maliklere tanıdığı bütün hak ve yetkilere sahiptirler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Ortak yerler üzerinde">
        <mvz-madde no="16" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikleri anagayrimenkulün bütün ortak yerlerine, arsa payları oranında, ortak mülkiyet hükümlerine göre malik olurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kat malikleri ortak yerlerde kullanma hakkına sahiptirler; bu hakkın genel kömürlük, garaj, teras, çamaşırhane ve çamaşır kurutma alanları gibi yerlerdeki ölçüsü, aksine sözleşme olmadıkça, her kat malikine ait arsa payı ile oranlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Kat irtifakı sahibinin hakları">
      <mvz-madde no="17" başlık="">
        <mvz-fıkra no="1">
          <template>Kat irtifakı sahipleri, ortak arsa üzerinde yapılacak yapının, sözleşmede yazılı süre içinde başlaması ve tamamlanması için kendilerine düşen borçların yerine getirilmesini, karşılıklı olarak isteme ve dava etme hakkına sahiptirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kat irtifakı sahipleri yapının tamamlanması için kendi aralarından veya dışarıdan bir veya birkaç kişiyi yönetici olarak tayin edebilirler. Kat mülkiyeti yöneticisinin görev, yetki ve sorumluluklarına dair hükümler, bu yönetici hakkında da uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kat irtifakı kurulmuş gayrimenkullerde yapı fiilen tamamlanmış ve bağımsız bölümlerin üçte ikisi fiilen kullanılmaya başlanmışsa, kat mülkiyetine geçilmemiş olsa dahi anagayrimenkulün yönetiminde kat mülkiyeti hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Kat Maliklerinin ve Kat İrtifakı Sahiplerinin Borçları">
    <mvz-b1 no="A" başlık="Kat Maliklerinin borçları">
      <mvz-b2 no="I" başlık="Genel kural">
        <mvz-madde no="18" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikleri, gerek bağımsız bölümlerini, gerek eklentileri ve ortak yerleri kullanırken doğruluk kaidelerine uymak, özellikle birbirini rahatsız etmemek, birbirinin haklarını çiğnememek ve yönetim planı hükümlerine uymakla, karşılıklı olarak yükümlüdürler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu kanunda kat maliklerinin borçlarına dair olan hükümler, bağımsız bölümlerdeki kiracılara ve oturma  hakkı sahiplerine veya bu bölümlerden herhangi bir suretle devamlı olarak faydalananlara da uygulanır; bu borçları yerine getirmiyenler kat malikleriyle birlikte, müteselsil olarak sorumlu olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Anagayrimenkulün bakımı, korunması ve zarardan sorumluluk">
        <mvz-madde no="19" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikleri, anagayrimenkulün bakımına ve mimarı durumu ile güzelliğini ve sağlamlığını titizlikle korumaya mecburdurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kat maliklerinden biri, bütün kat maliklerinin beşte dördünün yazılı rızası olmadıkça anagayrimenkulün ortak yerlerinde inşaat, onarım ve tesisler, değişik renkte dış badana veya boya yaptıramaz. Ancak, ortak yer ve tesislerdeki bir bozukluğun anayapıya veya bağımsız bir bölüme veya bölümlere zarar verdiğinin ve acilen onarılması gerektiğinin veya anayapının güçlendirilmesinin zorunlu olduğunun mahkemece tespit edilmiş olması halinde, bu onarım ve güçlendirmenin projesine ve tekniğine uygun biçimde yapılması konusunda kat maliklerinin rızası aranmaz. Kat maliki kendi bağımsız bölümünde anayapıya zarar verecek nitelikte onarım, tesis ve değişiklik yapamaz. Tavan, taban veya duvar ile birbirine bağlantılı bulunan bağımsız bölümlerin bağlantılı yerlerinde, bu bölüm maliklerinin ortak rızası ile anayapıya zarar vermeyecek onarım, tesis ve değişiklik yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Her kat maliki anagayrimenkule ve diğer bağımsız bölümlere, kusuru ile verdiği zarardan dolayı diğer kat maliklerine karşı sorumludur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Anagayrimenkulün genel giderlerine katılma">
        <mvz-madde no="20" başlık="">
          <mvz-fıkra no="1">
            <template>Kat maliklerinden her biri aralarında başka türlü anlaşma olmadıkça:</template>
            <mvz-bent no="a">
              <template>Kapıcı, kaloriferci, bahçıvan ve bekçi giderlerine ve bunlar için toplanacak avansa eşit olarak;</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Anagayrimenkulün sigorta primlerine ve bütün  ortak yerlerin bakım, koruma,  güçlendirme ve onarım giderleri ile yönetici aylığı gibi diğer giderlere ve ortak tesislerin işletme giderlerine ve giderler için toplanacak avansa kendi arsa payı oranında;</template>
            </mvz-bent>
            <mvz-bent no="0">
              <template>Katılmakla yükümlüdür.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kat malikleri ortak yer veya tesisler üzerindeki kullanma hakkından vazgeçmek veya kendi bağımsız bölümünün durumu dolayısıyla bunlardan faydalanmaya lüzum ve ihtiyaç bulunmadığını ileri sürmek suretiyle bu gider ve avans payını ödemekten kaçınamaz.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gider veya avans payını ödemeyen kat maliki hakkında, diğer kat maliklerinden her biri veya yönetici tarafından, yönetim planına, bu Kanuna ve genel hükümlere göre dava açılabilir, icra takibi yapılabilir. Gider ve avans payının tamamını ödemeyen kat maliki ödemede geciktiği günler için aylık yüzde beş hesabıyla gecikme tazminatı ödemekle yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci fıkradaki giderlere, kat maliklerinden birinin veya onun bağımsız bölümünden herhangi bir suretle faydalanan kişinin kusurlu bir hareketi sebep olmuşsa, gidere katılanların yaptıkları ödemeler için o kat malikine veya gidere sebep olanlara rücu hakları vardır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Sigorta anlaşması">
        <mvz-madde no="21" başlık="">
          <mvz-fıkra no="1">
            <template>Anagayrimenkulün, kat malikleri kurulunca tayin edilecek değer üzerinden sigorta edilmesi kat malikleri kurulunca kararlaştırılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sigorta yapılması halinde kat malikleri, sigorta giderlerine, arsa payları oranında, katılmakla yükümlüdürler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Anagayrimenkulün tümünün harap olması halinde alınacak sigorta bedeli, aksine sözleşme olmadıkça, kat maliklerine, arsa payları oranında, paylaştırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yalnız bir veya bir kaç bağımsız bölüm veya eklentisi veya ortak yerlerden bir kısmı hasara uğramışsa, alınacak sigorta bedeli hasara uğrayan yerlerin onarımına arsa payları oranında harcanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kat malikleri anagayrimenkulün sigortasıyla giderilemeyecek olan zararlarını karşılamak üzere, kendi bağımsız bölümlerini ayrıca kendi ad ve hesaplarına sigorta ettirebilirler; bu halde alınacak sigorta bedeli, anagayrimenkulün sigorta bedelindeki payları da ayrıca saklı kalmak üzere, yalnız kendilerine ait olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Sigorta hakkındaki emredici hükümler saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="V" başlık="Ortak giderlerin teminatı">
        <mvz-madde no="22" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikinin, 20 nci madde uyarınca payına düşecek gider ve avans borcundan ve gecikme tazminatından, bağımsız bölümlerin birinde kira akdine, oturma  hakkına veya başka bir sebebe dayanarak devamlı bir şekilde faydalananlar da müştereken ve müteselsilen sorumludur. Ancak, kiracının sorumluluğu ödemekle yükümlü olduğu kira miktarı ile sınırlı olup, yaptığı ödeme kira borcundan düşülür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kat malikinin borcu bu yolla da alınamazsa, mahkemece tesbit edilen borcunu ödemiyen kat malikinin bağımsız bölümü üzerine, varsa yöneticinin yoksa kat maliklerinden birinin yazılı istemiyle bu borç tutarı için, diğer kat malikleri lehine kanuni ipotek hakkı tescil edilir.  4721 sayılı Türk Medenî Kanununun 893 üncü maddesinin son fıkrası hükmü burada da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kat maliklerinin, gider borcunu ödemeyen kat maliki veya diğer sorumlulardan olan alacakları önceliklidir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="VI" başlık="Müsaade mecburiyeti">
        <mvz-madde no="23" başlık="">
          <mvz-fıkra no="1">
            <template>Kat maliklerinden birinin bağımsız bölümünde veya bu bölümdeki tesislerde meydana gelen bir hasar veya bozukluğun onarımı veya giderilmesi veya tesislerin yeniden yapılması ile yapı güvenliğiyle ilgili olarak yapılması gerekli görülen teknik incelemeler için diğer bir bağımsız bölüme girmek gerekiyorsa, o bölümün maliki veya o bölümde başka sıfatla oturanlar, giriş müsaadesi vermeye ve bölümde gerekli işlerin yapılmasına katlanmaya mecburdurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Anagayrimenkulün bir kısmının harap olması halinde, harap olan bağımsız bölüm ve eklentilerinin veya ortak yerlerin veya bağımsız bölümdeki tesislerin yeniden yapılması için, sağlam kalan bağımsız bölümlerin içinden veya dışından faydalanılması gerekiyorsa, o bölümlerin malikleri veya orada başka sıfatla oturanlar buna müsaade etmeye mecburdurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıdaki fıkralarda yazılı müsaade yüzünden, kat maliklerinin veya orada başka sıfatla oturanların uğrayacakları zararı, lehine müsaade verilen bağımsız bölüm malikleri derhal ödemekle yükümlüdürler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="VII" başlık="Yasak işler">
        <mvz-madde no="24" başlık="">
          <mvz-fıkra no="1">
            <template>Anagayrimenkulün, kütükte mesken, iş veya ticaret yeri olarak gösterilen bağımsız bir bölümünde hastane, dispanser, klinik, poliklinik, ecza laboratuvarı gibi müesseseler kurulamaz; kat maliklerinin buna aykırı sözleşmeleri hükümsüzdür; dispanser, klinik, poliklinik niteliğinde olmayan muayenehaneler bu hükmün dışındadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Anagayrimenkulün, kütükte mesken olarak gösterilen bağımsız bir bölümünde sinema, tiyatro, kahvehane, gazino, pavyon, bar, kulüp, dans salonu ve emsali gibi eğlence ve toplantı yerleri ve fırın, lokanta, pastahane, süthane gibi gıda ve beslenme yerleri ve imalathane, boyahane, basımevi, dükkan, galeri ve çarşı gibi yerler, ancak kat malikleri kurulunun oybirliği ile vereceği kararla açılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>1136 sayılı Avukatlık Kanununda avukatlık büroları ve hukuk büroları ile ilgili düzenleme yapılıncaya kadar meskenlerdeki avukatlık ve hukuk büroları faaliyetlerine devam ederler. Bu süre, bu maddenin yürürlüğe girdiği tarihten itibaren iki yıldır. Bu hüküm 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununda ilgili düzenleme yapılıncaya kadar meslek mensupları tarafından açılan bürolar hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu karar yöneticinin veya kat maliklerinden birinin istemi üzerine bütün bağımsız bölümlerin kat mülkiyeti kütüğündeki sahifelerine şerh verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="VIII" başlık="Kat mülkiyetinin devri mecburiyeti">
        <mvz-madde no="25" başlık="">
          <mvz-fıkra no="1">
            <template>Kat maliklerinden biri bu kanuna göre kendisine düşen borçları ve yükümleri yerine getirmemek suretiyle diğer kat maliklerinin haklarını, onlar için çekilmez hale gelecek derecede ihlal ederse, onlar, o kat malikinin müstakil bölümü üzerindeki mülkiyet hakkının kendilerine devredilmesini hakimden istiyebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu gibi bir kat maliki hakkında, bağımsız bölümün mülkiyetinin hükme en yakın tarihteki değeri o kat malikine ödenerek bu mülkiyetin diğer kat maliklerine, arsa payları oranında devredilmesi için davanın açılması, aksi kararlaştırılmış olmadıkça, diğer kat maliklerinin sayı ve arsa payı çoğunluğuyla karar vermesine bağlıdır. Bu karara rağmen kat maliklerinden bir kısmı bu davayı açmak istemezse, davayı öteki kat malikleri açar ve hâkim hüküm vermeden önce devir bedelinin ileride hak sahibine ödenmek üzere bankada üçer aylık vadeli hesaba yatırılması ve makbuzunun ibrazı için davacılara resen belirleyeceği uygun bir süre verir. Devir bedelinin süresi içinde yatırıldığına ilişkin belge ibraz edildiğinde ve davanın kabulü halinde hâkim, davalının bağımsız bölümünün mülkiyetinin davayı açmış olan kat maliklerine arsa payları oranında devredilmesine ve devir bedelinin işlemiş faiziyle birlikte davalıya ödenmesine karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Aşağıdaki durumlarda, birinci fıkrada yazılı çekilmezlik, her halde mevcut farz edilir :</template>
            <mvz-bent no="a">
              <template>Ortak giderlerden ve avanstan kendine düşen borçları ödemediği için hakkında iki takvim yılı içinde üç defa icra veya dava takibi yapılmasına sebep olunması;</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Anagayrimenkulün bulunduğu yerin sulh hakimi tarafından 33 üncü madde gereğince verilen emre rağmen, bu kanunda yazılı borç ve yükümleri yerine getirmemek suretiyle öteki kat maliklerinin haklarını ihlal etmekte devamlı olarak bir yıl ısrar edilmesi;</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kendi bağımsız bölümünü randevu evi veya kumarhane veya benzeri yer olarak kullanmak suretiyle ahlak ve adaba aykırı harekette bulunması.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu maddedeki dava hakkı, devir konusunda kat maliklerince alınan dava açma kararının öğrenilmesi tarihinden başlayarak altı ay ve her halde dava hakkının doğumundan başlayarak beş yıl içinde kullanılmazsa veya dava sebebi ortadan kalkmışsa düşer.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Kat irtifakı sahiplerinin borçları">
      <mvz-madde no="26" başlık="">
        <mvz-fıkra no="1">
          <template>Kat irtifakı sahipleri bu hakka konu olan ortak arsa üzerinde, ileride kat mülkiyetine çevrilmek üzere yapılacak yapının sözleşmeye ve plana göre tamamlanması için kendilerine düşen borçları vaktinde yerine getirmek ve yapı işini, doğruluk kaideleri uyarınca kolaylaştırmakla, karşılıklı olarak yükümlüdürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kat irtifakı sahiplerinden biri kendine düşen borçları, noter aracılığıyla yapılan ihtara rağmen, bu ihtar tarihinden başlayarak iki ay içinde yerine getirmezse diğerlerinin yazılı istemi üzerine hâkim, onun arsa payının ve kat irtifakının hükme en yakın tarihteki değeri karşılığında, öteki paydaşlara, arsa payları oranında devrine karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kat irtifakı sahiplerinden birinin kusuru yüzünden, yapının kanuni süre içinde yapılamaması sebebiyle kat irtifakı düşerse, kusurlu taraf diğerlerinin bu yüzden uğradıkları zararı tazminle yükümlüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Anagayrimenkulün Yönetimi">
    <mvz-b1 no="A" başlık="Genel kurul">
      <mvz-madde no="27" başlık="">
        <mvz-fıkra no="1">
          <template>Anagayrimenkul, kat malikleri kurulunca yönetilir ve yönetim tarzı, kanunların emredici hükümleri saklı kalmak şartiyle, bu kurul tarafından kararlaştırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Yönetim planı">
      <mvz-madde no="28" başlık="">
        <mvz-fıkra no="1">
          <template>Yönetim planı yönetim tarzını, kullanma maksat ve şeklini yönetici ve denetçilerin alacakları ücreti ve yönetime ait diğer hususları düzenler.Yönetim planı, bütün kat maliklerini bağlıyan bir sözleşme hükmündedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yönetim planında hüküm bulunmayan hallerde, anagayrimenkulün yönetiminden doğacak anlaşmazlıklar bu kanuna ve genel hükümlere göre karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yönetim planının değiştirilmesi için bütün kat maliklerinin beşte dördünün oyu şarttır. Kat maliklerinin 33 üncü maddeye göre mahkemeye başvurma hakları saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yönetim planı ve bunda yapılan değişiklikler, bütün kat malikleriyle onların külli ve cüzi haleflerini ve yönetici ve denetçileri bağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yönetim planının ve onda sonradan yapılan değişikliklerin tarihi, kat mülkiyeti kütüğünün  hanesinde gösterilir ve bu değişiklikler yönetim planına bağlanarak kat mülkiyetinin kuruluş belgeleri arasında saklanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Kat malikleri kurulunun toplantısı ve kararları">
      <mvz-b2 no="I" başlık="Toplantı zamanı">
        <mvz-madde no="29" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikleri kurulu, yılda bir defadan az olmamak üzere yönetim planında gösterilen zamanlarda, eğer böyle bir zaman gösterilmemişse, her takvim yılının ilk ayı içinde toplanır.  Toplu yapılarda ise kurullar, en geç iki yılda bir defadan az olmamak üzere yönetim plânlarında gösterilen zamanlarda, böyle bir zaman gösterilmemişse, ikinci takvim yılının ilk ayı içinde toplanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Önemli bir sebebin çıkması halinde, yöneticinin veya denetçinin veya kat maliklerinden üçte birinin istemi üzerine ve toplantı için istenilen tarihten en az onbeş gün önce bütün kat maliklerine imzalattırılacak bir çağrı veya bir taahhütlü mektupla, toplantı sebebi de bildirilmek şartiyle, kat malikleri kurulu her zaman toplanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İlk çağrı yapılırken, birinci toplantıda, yeter sayının sağlanamaması halinde, ikinci toplantının nerede ve hangi tarihte yapılacağı da belirtilir.  İlk toplantı ile ikinci toplantı arasında bırakılacak zaman yedi günden az olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Yeter sayı">
        <mvz-madde no="30" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikleri kurulu, kat maliklerinin sayı ve arsa payı bakımından yarısından fazlasiyle toplanır ve oy çokluğuyla karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yeter sayının sağlanamaması nedeniyle ilk toplantının yapılamaması halinde, ikinci toplantı, en geç onbeş gün sonra yapılır. Bu toplantıda karar yeter sayısı, katılanların salt çoğunluğudur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu kanunda yeter sayı için ayrıca konulmuş olan hükümler saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Oya katılma">
        <mvz-madde no="31" başlık="">
          <mvz-fıkra no="1">
            <template>Her kat maliki, arsa payı oranına bakılmaksızın, bir tek oy hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Anagayrimenkulde birden ziyade bağımsız bölümü olan kat maliki, her bağımsız bölüm için ayrı bir oy hakkına sahiptir; bununla beraber onun malik olduğu bağımsız bölümlerin sayısı ne olursa olsun, sahip olacağı oy sayısı bütün oyların üçte birinden fazla olamaz; oy hesabı yapılırken kesirler gözönüne alınmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bir bağımsız bölümün birden ziyade maliki varsa, kat malikleri kurulunda bunları içlerinden vekalet verecekleri birisi temsil eder. Kat maliklerinden biri ehliyetsiz ise onu kanuni mümessili temsil eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Alınacak karar doğrudan doğruya kendini ilgilendiren kat maliki görüşmelerde hazır bulunabilir, fakat oya katılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kat maliklerinden biri, oyunu yetkili vekil eliyle kullanabilir. Bir kişi, oy sayısının yüzde beşinden fazlasını kullanmak üzere vekil tayin edilemez. Ancak, kırk ve daha az sayıdaki kat mülkiyetine tâbi taşınmazlarda bir kişi, en fazla iki kişiye vekâlet edebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Kararlar">
        <mvz-madde no="32" başlık="">
          <mvz-fıkra no="1">
            <template>Anagayrimenkul kat malikleri kurulu tarafından, sözleşme, yönetim planı ve kanun hükümleri uyarınca verilecek kararlara göre yönetilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bütün kat malikleriyle külli ve cüzi halefleri, yönetici ve denetçiler, kat malikleri kurulunun kararlarına uymakla yükümlüdürler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Anagayrimenkulün kullanılmasından veya yönetiminden dolayı kat malikleri arasında veya bunlarla yönetici ve denetçiler arasında veya denetçilerle yöneticiler arasında çıkan anlaşmazlıklar, kat malikleri kurulunca çözülür ve karara bağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kat malikleri kurulu kararları (1) den başlayıp sırayla giden sayfa numaraları taşıyan her sayfası noter mühüriyle tasdikli bir deftere yazılarak, toplantıda bulunan bütün kat maliklerince imzalanır; karara aykırı oy verenler bu aykırılığın sebebini belirterek imza koyarlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bir husus hakkında ilerde çıkan anlaşmazlıklar, karar defterinde aynı hususa dair daha önce verilmiş bir karar varsa kaide olarak ona göre çözülür.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="V" başlık="Hakimin müdahalesi">
        <mvz-madde no="33" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikleri kurulunca verilen kararlar aleyhine, kurul toplantısına katılan ancak 32 nci madde hükmü gereğince aykırı oy kullanan her kat maliki karar tarihinden başlayarak bir ay içinde, toplantıya katılmayan her kat maliki kararı öğrenmesinden başlayarak bir ay içinde ve her halde karar tarihinden başlayarak altı ay içinde anagayrimenkulün bulunduğu yerdeki sulh mahkemesine iptal davası açabilir; kat malikleri kurulu kararlarının yok veya mutlak butlanla hükümsüz sayıldığı durumlarda süre koşulu aranmaz. Kat maliklerinden birinin yahut onun katından kira akdine, oturma hakkına veya başka bir sebebe dayanarak devamlı surette faydalanan kimsenin, borç ve yükümlerini yerine getirmemesi yüzünden zarar gören kat maliki veya kat malikleri, anagayrimenkulün bulunduğu yerin sulh mahkemesine başvurarak hâkimin müdahalesini isteyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hakim, ilgilileri dinledikten sonra, bu kanuna ve yönetim planına ve bunlarda bir hüküm yoksa, genel hükümlere ve hakkaniyet kaidelerine göre derhal kararını verir ve bunun, tesbit edeceği kısa bir süre içinde yerine getirilmesi lüzumunu ilgiliye tefhim veya tebliğ eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tespit edilen süre içinde hâkimin kararını yerine getirmeyenlere, aynı mahkemece, ikiyüz elli Türk Lirasından ikibin Türk Lirasına kadar idarî para cezası verilir. 25 inci madde hükmü saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Yönetici">
      <mvz-b2 no="I" başlık="Atanması">
        <mvz-madde no="34" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikleri, anagayrimenkulün yönetimini kendi aralarından veya dışardan seçecekleri bir kimseye veya üç kişilik bir kurula verebilirler; bu kimseye (Yönetici), kurula da (Yönetim kurulu) denir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Anagayrimenkulün sekiz veya daha fazla bağımsız bölümü varsa, yönetici atanması mecburidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Anagayrimenkulün bütün bölümleri bir kişinin mülkiyetinde ise, malik kanunen yönetici durumundadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yönetici, kat maliklerinin, hem sayı hem arsa payı bakımından çoğunluğu tarafından atanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yönetici her yıl kat malikleri kurulunun kanuni yıllık toplantısında yeniden atanır; eski yönetici tekrar atanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Kat malikleri anagayrimenkulün yönetiminde anlaşamaz veya toplanıp bir yönetici atayamazlarsa, o geyrimenkulün bulunduğu yerin sulh mahkemesince, kat maliklerinden birinin müracaatı üzerine ve mümkünse diğerleri de dinlendikten sonra, gayrimenkule bir yönetici atanır. Bu yönetici, aynen kat maliklerince atanan yöneticinin yetkilerine sahip ve kat maliklerine karşı sorumlu olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Sulh mahkemesince atanan yönetici, bu atanma üzerinden altı ay geçmedikçe, kat malikleri kurulunca değiştirilemez Ancak haklı bir sebep çıkarsa, onu atamış olan sulh mahkemesi, değiştirmeye müsaade edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Yönetici atanırken kendisiyle yapılan sözleşmede, teminat göstermesi şart edilebilir; sözleşmede böyle bir şart olmasa bile, haklı bir sebebin çıkması halinde, kat malikleri kurulu, yöneticiden teminat göstermesini istiyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Yöneticinin ad ve soyadı ile iş ve ev adresinin anagayrimenkulün kapısı yanına veya girişte görülecek bir yere çerçeve içinde asılması mecburidir. Bu yapılmazsa, yöneticiden veya yönetim kurulu üyelerinin her birine, ilgilinin başvurması üzerine aynı mahkemece, elli Türk Lirasından ikiyüzelli Türk Lirasına kadar idarî para cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Yöneticinin görevleri">
        <mvz-b3 no="1" başlık="Genel yönetim işlerinin görülmesi">
          <mvz-madde no="35" başlık="">
            <mvz-fıkra no="1">
              <template>Yöneticinin görevleri, yönetim planında belirtilir; yönetim planında aksine hüküm olmadıkça, yönetici aşağıdaki işleri görür:</template>
              <mvz-bent no="a">
                <template>Kat malikleri kurulunca verilen kararların yerine getirilmesi;</template>
              </mvz-bent>
              <mvz-bent no="b">
                <template>Anagayrimenkulün gayesine uygun olarak kullanılması, korunması, bakımı ve onarımı için gereken tedbirlerin alınması;</template>
              </mvz-bent>
              <mvz-bent no="c">
                <template>Anagayrimenkulün sigorta ettirilmesi;</template>
              </mvz-bent>
              <mvz-bent no="d">
                <template>Anagayrimenkulün genel yönetim işleriyle korunma, onarım, temizlik gibi bakım işleri ve asansör ve kalorifer, sıcak ve soğuk hava işletmesi ve sigorta için yönetim planında gösterilen zamanda, eğer böyle bir zaman gösterilmemişse, her takvim yılının ilk ayı içinde, kat maliklerinden işletme projesi onaylanıncaya kadar avansın toplanması;</template>
              </mvz-bent>
              <mvz-bent no="e">
                <template>Anagayrimenkulün yönetimiyle ilgili diğer bütün ödemelerin kabulü, yönetim dolayısiyle doğan borçların ödenmesi ve kat malikleri tarafından ayrıca yetkili kılınmışsa, bağımsız bölümlere ait kiraların toplanması;</template>
              </mvz-bent>
              <mvz-bent no="f">
                <template>Anagayrimenkulün tümünü ilgilendiren tebligatın kabulü;</template>
              </mvz-bent>
              <mvz-bent no="g">
                <template>Anagayrimenkulü ilgilendiren bir sürenin geçmesinden veya bir hakkın kaybına meydan vermiyecek gerekli tedbirlerin alınması;</template>
              </mvz-bent>
              <mvz-bent no="h">
                <template>Anagayrimenkulün korunması ve bakımı için kat maliklerinin yararına olan hususlarda gerekli tedbirlerin, onlar adına alınması;</template>
              </mvz-bent>
              <mvz-bent no="i">
                <template>Kat mülkiyetine ilişkin borç ve yükümlerini yerine getirmiyen kat maliklerine karşı dava ve icra takibi yapılması ve kanuni ipotek hakkının kat mülkiyeti kütüğüne tescil ettirilmesi;</template>
              </mvz-bent>
              <mvz-bent no="j">
                <template>Topladığı paraları ve avansları yatırmak ve gerektiğinde almak üzere muteber bir bankada kendi adına ve fakat anagayrimenkulün yönetici sıfatı gösterilmek suretiyle, hesap açtırılması;</template>
              </mvz-bent>
              <mvz-bent no="k">
                <template>Kat malikleri kurulunun toplantıya çağırılması.</template>
              </mvz-bent>
              <mvz-bent no="l">
                <template>Anagayrimenkulde bulunan asansörlerin güvenli bir şekilde işletilmesinin sağlanması amacıyla aylık bakımları ile yıllık kontrollerinin ilgili teknik düzenlemelere uygun şekilde yaptırılması ve bu işlemlere ilişkin ücretlerin ödenmesi.</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu Kanunun 34 üncü maddesinde belirtilen şartları taşımasına rağmen yönetici ataması yapılmayan anagayrimenkulde, birinci fıkrada sayılan işlerin yaptırılmasından kat malikleri müştereken sorumludur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Defter tutulması ve belgelerin saklanması">
          <mvz-madde no="36" başlık="">
            <mvz-fıkra no="1">
              <template>Yönetici, kat malikleri kurulunun kararlarını protokolleri, yapılan ihtar ve tebligatın özetini ve tarihlerini ve bütün giderleri, 32 nci maddede sözü geçen deftere tarih sırasiyle yazmaya ve bu defteri ve giderlerin belgeleriyle diğer bütün belgeleri bir dosyada saklamaya mecburdur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu defterin, her takvim yılının bitmesinden başlıyarak bir ay içinde yönetici tarafından notere kapattırılması mecburidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bu maddede yazılı görevleri yerine getirmiyen yöneticiye 33 üncü maddenin son fıkrasında yazılı cezalar uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="İşletme projesinin yapılması">
          <mvz-madde no="37" başlık="">
            <mvz-fıkra no="1">
              <template>İşletme projesi kat malikleri genel kurulunda onaylanır. Kat malikleri kurulunca kabul edilmiş işletme projesi yoksa, en geç üç ay içinde kat malikleri kurulunda onaylanıncaya kadar yönetici, gecikmeksizin geçici bir işletme projesi yapar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu projede özellikle:</template>
              <mvz-bent no="a">
                <template>Anagayrimenkulün bir yıllık yönetiminde  tahmini olarak gelir ve gider tutarları;</template>
              </mvz-bent>
              <mvz-bent no="b">
                <template>Tüm giderlerden her kat malikine, bu Kanunun 20 nci maddesindeki esaslara göre düşecek tahmini miktar;</template>
              </mvz-bent>
              <mvz-bent no="c">
                <template>Her kat malikinin 20 nci maddedeki esaslara göre vermesi gereken avans tutarı;</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>Gösterilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bu proje, kat maliklerine veya bağımsız bölümden fiilen yararlananlara, imzaları karşılığında veya taahhütlü mektupla bildirilir ve en geç üç ay içinde aynen veya değiştirilerek kabulüne yönelik genel kurulda karar alınır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Kesinleşen işletme projeleri veya kat malikleri kurulunun işletme giderleri ile ilgili kararları, İcra ve İflas Kanununun 68 inci maddesinin 1 inci fıkrasında belirtilen belgelerden sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Mevcut işletme projesi varsa, geçici işletme projesi için öngörülen bedel, yürürlüğü devam eden işletme projesi bedelinin takvim yılı başından geçerli olmak üzere, her yıl, bir önceki yıla ilişkin olarak 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi hükümleri uyarınca tespit ve ilan edilen yeniden değerleme oranından fazla olmamak kaydıyla belirlenir ve yukarıda belirlenen usulde kat malikleri kuruluna sunulur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Sorumluluğu">
        <mvz-b3 no="1" başlık="Genel kural">
          <mvz-madde no="38" başlık="">
            <mvz-fıkra no="1">
              <template>Yönetici, kat maliklerine karşı aynen bir vekil gibi sorumludur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kat malikleri kurulu, ada temsilciler kurulu veya toplu yapı temsilciler kurulu kararlarının iptaline ilişkin davalar, kat maliklerini temsilen yöneticiye, toplu yapılarda ise ada temsilciler kurulu veya toplu yapı temsilciler kurulunca seçilen yöneticiye husumet yöneltilmesi suretiyle açılabilir. Yönetici, açılan davayı bütün kat maliklerine ve ada veya toplu yapı temsilciler kuruluna duyurur. Kurul kararının iptali halinde bu konudaki yargılama giderleri ortak giderlerden karşılanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Hesap Verme">
          <mvz-madde no="39" başlık="">
            <mvz-fıkra no="1">
              <template>Yönetici, yönetim planında yazılı zamanlarda eğer böyle bir zaman yazılmamışsa her takvim yılının birinci ayı içinde kat malikleri kuruluna, anagayrimenkul dolayısiyle o tarihe kadar elde edilen gelirlerin ve yapılmış olan giderlerin hesabına vermekle yükümlüdür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kat maliklerinin  yarısı isterse, bunların arsa payları ne olursa, olsun yönetim planında yazılı zamanlar dışında da hesabın gösterilmesi yöneticiden istenebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Hakları">
        <mvz-madde no="40" başlık="">
          <mvz-fıkra no="1">
            <template>Yönetici, kaide olarak vekilin haklarına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kat malikleri,kendilerine düşen borçları ve yükümleri yönetici tarafından noterlikçe yaptırılan ihtara rağmen vaktinde  ve tamamen yerine getirmezlerse, yönetici, hiçbir tazminat ödemeye mecbur olmaksızın, kendine ait sözleşmeyi feshedip yöneticilikten çekilerek bu yüzden uğradığı zararın tazminini kat maliklerinden istiyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yönetici, yönetim planında veya kendisiyle yapılan sözleşmede bir ücret tayin edilmemiş olsa bile, kat maliklerinden uygun bir ücret istiyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kat malikleri kurulu, kat malikleri arasından atanmış yöneticinin normal yönetim giderlerine katılıp katılmayacağı, katılacaksa, ne oranda katılacağını kararlaştırır. Bu yolda, bir karar alınmamış ise, yönetici yönetim süresince kendisine düşen normal yönetim giderlerinin yarısına katılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="E" başlık="Yönetimin denetlenmesi">
      <mvz-madde no="41" başlık="">
        <mvz-fıkra no="1">
          <template>Kat malikleri kurulu, yöneticinin bu görevdeki tutumunu devamlı olarak denetler ve haklı bir sebebin çıkması halinde onu her zaman değiştirebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hesapların denetlenmesi için yönetim planında, belli bir zaman konulmamışsa; bu denetim her üç ayda bir yapılır; bununla beraber haklı bir sebep çıkarsa, hesap denetlenmesi her zaman yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kat malikleri kurulu denetim işini, kendi aralarından sayı ve arsa payı çoğunluğuyla seçecekleri bir denetçiye veya üç kişilik bir denetim kuruluna verebilir; bu halde denetçi veya denetim kurulu yönetim planında yazılı zamanlarda, eğer zaman yazılmamışsa, her takvim yılının birinci ayı içinde kat malikleri kuruluna verecekleri bir raporla denetimin sonucunu ve anagayrimenkulün yönetim tarzı hakkındaki düşüncelerini bildirir; bu rapor çoğaltılarak birer örneği taahhütlü mektupla kat maliklerine gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Denetçiler bu raporu ve verecekleri kararları ve gerekli gördükleri diğer hususları, (1) den başlayıp sıra ile giden sayfa numaraları taşıyan ve her sayfası noter mührüyle tasdikli bir deftere geçirip tarih koyarak altını imza ederler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="F" başlık="Yenilik ve ilaveler">
      <mvz-b2 no="I" başlık="Faydalı olanlar">
        <mvz-madde no="42" başlık="">
          <mvz-fıkra no="1">
            <template>Kat malikleri,anagayrimenkulün ortak yerlerinde kendi başlarında bir değişiklik yapamazlar; ortak yerlerin düzgün veya bunları kullanmanın daha rahat ve kolay bir hale konulmasına veya bu yerlerden elde edilecek faydanın çoğaltılmasına yarıyacak bütün yenilik ve ilaveler, kat maliklerinin sayı ve arsa payı çoğunluğu ile verecekleri karar üzerine yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Engellilerin yaşamı için zorunluluk göstermesi hâlinde, proje tadili kat maliklerinin en geç üç ay içerisinde yapacağı toplantıda görüşülerek sayı ve arsa payı çoğunluğu ile karara bağlanır. Toplantının bu süre içerisinde yapılamaması veya tadilat talebinin çoğunlukla kabul edilmemesi durumunda; ilgili kat malikinin talebi üzerine bina güvenliğinin tehlikeye sokulmadığını bildirir komisyon raporuna istinaden ilgili mercilerden alınacak  tasdikli  proje değişikliği veya krokiye göre inşaat, onarım ve tesis yapılır. İlgili merciler, tasdikli proje değişikliği veya kroki taleplerini en geç altı ay içinde sonuçlandırır.  Komisyonun teşkili, çalışma usûlü ile engellinin kullanımından sonraki süreç ile ilgili usûl ve esaslar Bayındırlık ve İskan Bakanlığı ile Özürlüler İdaresi Başkanlığı tarafından müştereken hazırlanacak yönetmelikle belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu işlerin giderleri, yeniliklerden faydalananlar tarafından, faydalanma oranına göre, ödenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kat maliklerinden birinin isteği üzerine ısı yalıtımı, ısıtma sisteminin yakıt dönüşümü ve ısıtma sisteminin merkezi sistemden ferdi sisteme veya ferdi sistemden merkezi sisteme dönüştürülmesi, kat maliklerinin sayı ve arsa payı çoğunluğu ile verecekleri karar üzerine yapılır. Ancak toplam inşaat alanı ikibin metrekare ve üzeri olan binalarda merkezi ısıtma sisteminin ferdi ısıtma sistemine dönüştürülmesi, kat maliklerinin sayı ve arsa payı olarak oybirliği ile verecekleri karar üzerine yapılır. Bu konuda yapılacak ortak işlerin giderleri arsa payı oranına göre ödenir. Merkezi ısıtma sistemlerinde ısınma giderlerinin paylaştırılmasına ilişkin usûl ve esaslar Bayındırlık ve İskan Bakanlığı tarafından yürürlüğe konulacak yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Isıtma sisteminin merkezi sistemden ferdi sisteme veya ferdi sistemden merkezi sisteme dönüştürülmesine karar verilmesi halinde, yönetim planının bu karara aykırı hükümleri değiştirilmiş sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Çok masraflı ve lüks olanlar">
        <mvz-madde no="43" başlık="">
          <mvz-fıkra no="1">
            <template>Yapılması arzu edilen yenilik ve ilaveler çok masraflı ise veya yapının özel durumuna göre lüks bir nitelik taşıyorsa veya anagayrimenkulün bütün kat malikleri tarafından kullanılması mutlaka gerekli olan yerlerinde veya geçitlerinde bulunmıyorsa, bunlardan faydalanmak istemiyen kat maliki, gidere katılmak zorunda değildir; bu gibi yenilik ve ilavelerin giderini, onların yapılmasına karar vermiş olan kat malikleri öderler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bununla beraber, başlangıçta giderlere katılmayan kat maliki veya onun külli veya cüzi halefleri yenilik ve ilavelerin yapılması ve korunması giderlerine sonradan, kendi arsa payları oranında katılırlarsa, yapılan lüks yenilik veya ilaveden faydalanma hakkını kazanırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Bağımsız bölüm ilavesi">
        <mvz-madde no="44" başlık="">
          <mvz-fıkra no="1">
            <template>Anagayrimenkulün üstüne kat ilavesi veya mevcut çekme kat yerine tam kat yapılması veya zemin veya bodrum katlarında veya arsanın boş kısmında 24 üncü maddenin ikinci fıkrasında yazılı yerlerin sonradan yapımı veya ilavesi için:</template>
            <mvz-bent no="a">
              <template>Kat malikleri kurulunun buna oybirliğiyle karar vermesi;</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Anagayrimenkulün bu inşaattan sonra alacağı duruma göre, yapılan yeni ilaveler de dahil olmak üzere bütün bağımsız bölümlerine tahsis olunacak arsa paylarının, usulüne göre yeniden ve oybirliğiyle tesbit edilmesi;</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İlave edilecek yeni bağımsız bölüme tahsis edilen arsa payı üzerinde, tapu memuru huzurunda yapılacak resmi senetle, 14 üncü maddeye göre kat irtifakı kurularak bunun, anagayrimenkulün bütün bağımsız bölümlerinin kat mülkiyeti kütüğündeki irtifaklar hanesine tescil edilmesi ve anagayrimenkulün kapanan eski kütük sayfasiyle 13 üncü madde hükmüne göre bağlantı sağlanması;</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Şarttır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu nitelikteki ilave ve genişletmelere muvafakat etmekle beraber kendisi katılmak istemiyen kat maliklerinin arsa paylarından, bu ilaveler sebebiyle azalan kısmın, ilaveyi yaptıranların bağımsız bölümlerine tahsisini kabul ettikleri, resmi senette belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu takdirde, yeni bağımsız bölümün yapılmasına katılmayan kat maliklerinin arsa paylarından yeni tahsis sebebiyle azalan kısmın bedeli kendilerine ödenmek şartiyle, yeni yapılan bağımsız bölüm, kat irtifakı kurulmasına dair olan eski resmi senet gereğince kat mülkiyetine çevrilerek onu yaptıranın mülkü veya yaptıranların ortak mülkü olur ve kat mülkiyeti kütüğünün ayrı bir sayfasına yeni malik veya malikler adına tescil edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="G" başlık="Temliki tasarruflar ve önemli işler">
      <mvz-madde no="45" başlık="">
        <mvz-fıkra no="1">
          <template>Anagayrimenkulün bir hakla kayıtlanması veya arsanın bölünmesi ve bölünen kısmın mülkiyetinin başkasına devrolunması gibi temliki tasarruflar veya anayapının dış duvarlarının, çatı veya damının reklam maksadiyle kiralanması gibi önemli yönetim işleri ancak bütün kat maliklerinin oybirliğiyle verecekleri karar üzerine yapılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Kat Mülkiyetinin ve Kat İrtifakının Sona Ermesi">
    <mvz-b1 no="A" başlık="Kat mülkiyetinin sona ermesi">
      <mvz-b2 no="I" başlık="Anagayrimenkulün arsasiyle birlikte yok olması veya kamulaştırılması ile">
        <mvz-madde no="46" başlık="">
          <mvz-fıkra no="1">
            <template>Kat mülkiyeti, kat mülkiyeti kütüğündeki sicil kaydının silinmesiyle sona erer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Anagayrimenkulün bütün bağımsız bölümlerinin bir tek kişinin mülkiyetinde toplanmasiyle kat mülkiyeti kendiliğinden sona ermez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sicil kaydı, bütün kat maliklerinin veya bütün bağımsız bölümleri kendi mülkiyetinde toplamış bulunan malikin, anagayrimankuldeki kat mülkiyetinin adi mülkiyete çevrilmesine ait yazılı istemi üzerine silinir ve o gayrimenkul, müstakil bölümlere bağlı arsa paylarına göre, genel kütükte yeni bir sayfaya gaçirilerek ve eski kayıtlariyle bağlantı sağlanmak suretiyle tescil olunur. Anagayrimenkulün niteliğinde kat mülkiyetinin kurulmasından sonra değişiklikler olmuşsa, yeni sicil kaydına bunlar da yazılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bağımsız bölümlerden biri bir ayni hakla veya sicile şerh verilen bir şahsi hakla kayıtlanmış bulunuyorsa, hak sahibinin muvafakatiyle o hak kütükten silinmedikçe, anagayrimenkul üzerindeki kat mülkiyetinin adi mülkiyete çevrilmesi ve kat mülkiyeti kütüğündeki sicil kaydının silinmesi istenemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kayıtlayıcı hakkın sahibi, sicil kaydının silinmesine muvafakat etmemekle beraber hakkının yalnız borçluya ait mülkiyet payına veya hakkın niteliğine göre, bütün ortak mülkiyet paylarına aktarılmasına muvafakat ederse bu hak sicilden silinmeksizin yalnız borçlunun, adi mülkiyet  gayrimenkuldeki bütün ortak mülkiyet payları üzerine geçirilmek suretiyle genel kütüğe tescil olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Anagayrimenkulün arsasiyle birlikte tamamen yok olması veya kamulaştırılması halinde sicil kaydının silinmesi genel hükümlere göre yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Anagayrimenkul kamulaştırılırsa, her bağımsız bölümün kamulaştırma bedeli bağlantılı bulunduğu arsa payı ve eklentileri de gözönünde tutularak ayrı ayrı takdir olunur ve o bölümün malikine ödenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Anayapının harap olması">
        <mvz-madde no="47" başlık="">
          <mvz-fıkra no="1">
            <template>Anayapının tümü harap olmuşsa, anagayrimenkul üzerindeki kat mülkiyeti kendiliğinden sona erer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Anayapının bağımsız bölümlerinden biri tamamen harap olur ve o bölümün maliki iki yıl içinde bölümünü yeniden yaptırmazsa, diğer kat malikleri veya bunlardan bir kısmı, bu sürenin tamamlanmasından başlıyarak bir yıl içinde o bölüme ait arsa payının, değeri karşılığında ve arsa payları oranında kendilerine devredilmesini hakimden istiyebilirler. Bu halde devrolunan arsa payları kat mülkiyeti kütüğünün ilgili sayfalarının (Beyanlar) hanesine işaret olunur; arsa payını devralanlar, devraldıkları tarihten başlıyarak iki yıl içinde, harap olan bağımsız bölümü yeniden yaptırmaya veya aynı süre içerisinde bütün kat malikleri bağımsız bölümlere bağlı arsa paylarını bu kanunun 3 üncü maddesinin 2 nci fıkrasındaki esaslara göre yeniden hasaplıyarak kat mülkiyeti kütüğüne geçirtmeye mecburdurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukardaki fıkra hükmüne uyulmadığı takdirde anagayrimenkul üzerindeki kat mülkiyeti kendiliğinden sona ererek, gerek o gayrimenkul ve gerek harap olan bölümler için alınan sigorta bedeli üzerinde ortak mülkiyet hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birden ziyade bağımsız bölüm tamamen harap olup da bunlardan birinin yeniden yapılması diğerinin yapılmasına bağlı bulunuyorsa, bağımsız bölümleri harap olan kat malikleri bunları yeniden yaptırıp yaptırmıyacaklarını, harabolma tarihinden başlıyarak altı ay içinde diğer kat maliklerine yazılı olarak bildirmeye mecburdurlar.  Bildirmeyenlerin yeniden yaptırmak istemedikleri kabul olunur ve onların arsa payları, değeri karşılığında bölümlerini yeniden yaptırmak isteyenlere öncelikle devredilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Harabolan bağımsız bölümler üzerindeki kat mülkiyeti bu maddede yazılı süreler devamınca kendiliğinden kat irtifakına çevrilir ve kat mülkiyeti kütüğünde beyanlar hanesine geçici şerh verilir. Bağımsız bölüm yapılınca onun üzerindeki kat mülkiyeti yeniden doğar ve geçici şerh kütükten silinir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Bildirme ödevi ve kaydın silinmesi">
        <mvz-madde no="48" başlık="">
          <mvz-fıkra no="1">
            <template>Anagayrimenkulün veya anayapının tümünün veya bir kısmının harabolması halinde durum yönetici tarafından o gayrimenkulün bulunduğu yerin tapu idaresine ve bütün kat maliklerine; eğer yönetici yoksa, bağımsız bölümü harap olan kat maliki tarafından tapu idaresine derhal bildirir; bunun bildirilmemesi yüzünden doğacak zararların tümünden bağımsız bölümü harap olan kat maliki, zararın beşte biri oranındaki kısmından da yönetici müteselsilen sorumlu olup, Hazine sorumlu değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kat mülkiyeti sona erince, kat mülkiyeti kütüğündeki sayfalar kapatılarak gayrimenkulün kaydı anayapıdan sağlam kalan kısımlar gösterilmek ve kat mülkiyeti kütüğü kurulmadan önceki genel kütük kaydiyle bağlantı sağlanmak suretiyle, arsa payları oranında ortak mülkiyet esaslarına göre, genel kütüğe tescil edilir. Bu halde sigorta bedelleriyle enkaz üzerinde de ortak mülkiyet hükümleri yürür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tümü harabolan anayapının arsasında malik veya ortak malikler tarafından yine kat mülkiyeti esasına göre yeni bir yapı yapılmak istenirse, kat irtifakı ve kat mülkiyeti kurulmasına dair hükümler uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Kat irtifakının sona ermesi">
      <mvz-madde no="49" başlık="">
        <mvz-fıkra no="1">
          <template>Kat irtifakına konu olan arsanın maliki veya ortak malikleri, tapu memuruna verecekleri yazılı bir beyanla kat irtifakına ait sicil kaydını sildirerek bu irtifaka her zaman son verebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kat irtifakı, buna konu olan arsanın tamamiyle yok olması veya üzerinde yapı yapılamıyacak hale gelmesi veya kamulaştırılması ile kendiliğinden sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kat irtifakına konu olan arsa üzerinde, bu irtifakın kurulması sırasında verilen plana göre beş yıl içinde yapı yapılmazsa maliklerden birinin istemi üzerine, sulh hakimi, gerektiğinde ilgilileri de dinleyerek, duruma göre kat irtifakının sona ermesine veya belli bir süre için uzatılmasına karar verir. Süre istem üzerine yeniden uzatılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yukarıdaki fıkra uyarınca kat irtifakı kaldırıldığında tapu kütüğündeki kayıt silinir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Son Hükümler">
    <mvz-b1 no="A" başlık="Yasaklar">
      <mvz-madde no="50" başlık="">
        <mvz-fıkra no="1">
          <template>Bu kanun yürürlüğe girdikten sonra Medeni Kanuna ve diğer kanunlara göre, bir gayrimenkulün paydaşlarından birinin o gayrimenkulün bir bölümünden kat maliki gibi tek başına faydalanmasını sağlamak için irtifak hakkı kurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tümü kârgir olmayan yapılarda kat mülkiyeti kurulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Yeni duruma uyma">
      <mvz-b2 no="I" başlık="Medeni Kanunun yürürlüğe girmesinden sonra kurulan irtifaklarda">
        <mvz-madde no="51" başlık="">
          <mvz-fıkra no="1">
            <template>Medeni Kanunun yürürlüğe girmesinden sonra bu kanunun yürürlüğe girdiği tarihe kadar bir gayrimenkulün paydaşlarından birinin o gayrimenkulün bir bölümünden kat maliki gibi tek başına faydalanmasını sağlamak için üzerinde irtifak hakkı kurulmuş olan gayrimenkullerin mülkiyetinin  2/1/1971 tarihine kadar kat mülkiyetine çevrilmesi ve kat mülkiyeti kütüğüne tescil ettirilmesi mecburidir. Bu yapılmazsa irtifak hakları sona ererek yalnız ortak mülkiyet devam eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gayrimenkul üzerindeki mülkiyetin birinci fıkra gereğince kat mülkiyetine çevrilmesi ve kat mülkiyet kütüğüne tescili, ortak maliklerden birinin tapu idaresine başvurması üzerine tapu idaresindeki belgelere ve bu kanunun 12 nci maddesinin (b) bendinde yazılı fotoğrafa dayanılarak yapılır; bu halde fotoğrafın, tapu idaresine başvuran ortak malikin imzasiyle tasdik edilmesi yeter.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Diğer ortak malikler bu çevrilmeye itiraz edemiyecekleri gibi bunun giderlerine katılmaktan ve yönetim planı yapmaktan  kaçınamazlar; kaçınılırsa, hakimin müdahalasine dair olan 33 üncü madde hükmü uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Medeni Kanundan önce kurulmuş olan haklarda">
        <mvz-madde no="52" başlık="">
          <mvz-fıkra no="1">
            <template>Medeni Kanunun yürürlüğe girdiği tarihten önce (Hava hakkı, oda mülkiyeti) gibi isimler altında kurulmuş olan haklar, bu kanunun yürürlüğe girmesinden başlayarak üç yıl içinde, aşağıda yazılı hükümlere göre, bu kanun uyarınca kat mülkiyetine veya kat irtifakına çevrilir:</template>
            <mvz-bent no="a">
              <template>Gayrimenkul üzerinde bu haklara konu olan yapı bölümleri mevcutsa, hak sahipleri, aralarında yapacakları bir sözleşme ile, o gayrimenkulün arsasında, bölümlerinin değerleri oranında ve hiçbir bedel ödemeye mecbur olmaksızın, Medeni Kanunun ortak mülkiyet hükümlerine göre paydaş olurlar ve Kat Mülkiyeti Kanununun ilgili hükümleri uyarınca kat mülkiyetini kurarlar.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yapı bölümleri mevcut olmayıp yalnız hava hakkı mevcutsa, bu hak (a) bendindeki esaslara göre hak sahibinin arsada paydaş olması suretiyle kendiliğinden kat irtifakı hakkına çevrilir ve kütüğe o suretle tescil edilir.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Hak sahipleri anlaşarak bu kanunun yürürlüğe girdiği tarihten itibaren üç yıl içinde eski haklarını kat mülkiyetine veya kat irtifakına çevirmezlerse, bu çevirme, gayrimenkulün bulunduğu yerin tapu idaresince, ayrı ayrı bölümlerin değerleri oranında arsa paylarının tesbiti ve gereken belgelerin hazırlanması suretiyle ve bu maddenin (a) ve (b) bendlerindeki esaslar uyarınca, hak sahiplerinden birinin müracaatı üzerine veya doğrudan doğruya yapılır ve durum bütün hak sahiplerine bildirilir.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu  hakların tapu idaresince kat mülkiyetine veya kat irtifakına doğrudan doğruya çevrilmesi için gereken masraflar Hazinece ödenerek, kamu alacaklarının tahsili hakkındaki özel kanun hükümlerine göre hak sahiplerinden alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hak sahipleri tapu idaresinin kararına karşı, bunun kendilerine bildirilmesinden başlayarak bir ay içinde, sulh mahkemesine dava açmak suretiyle itiraz edebilirler.</template>
