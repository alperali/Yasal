          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Medeni Kanuna göre kurulmuş kat irtifaklarının yönetimi">
        <mvz-madde no="53" başlık="">
          <mvz-fıkra no="1">
            <template>Bu Kanun yürürlüğe girdiği tarihten önce bir gayrimenkulün paydaşlarından birinin o gayrimenkulün bir bölümünden kat maliki gibi tek başına faydalanmasını sağlamak için kurulmuş olan irtifak hakları, bu Kanuna göre kat mülkiyetine çevrilinceye kadar anagayrimenkulün yönetimi, yönetim planı yapılması mecburiyeti ve giderlere ve sigorta mecburiyetine ve bunun primlerine katılma hususlarında bu kanun hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Özel kanuna göre ortaklaştırma <Şüyulandırma> halinde kat mülkiyetinin durumu">
      <mvz-madde no="54" başlık="">
        <mvz-fıkra no="1">
          <template>İmar Kanunu hükümlerine göre ortaklaştırma halinde, ortaklaştırılan gayrimenkuller arasında kat mülkiyetine tâbi gayrimenkul varsa ve ortaklaştırma, 9/11/1985 tarihinden önce ise 6785 sayılı İmar Kanununun 46 ncı maddesi, bu tarihten sonra ise 3194 sayılı İmar Kanununun 16 ncı maddesi gereğince ortaklığın giderilmesi hususunda bütün malikler anlaştıkları takdirde, ortaklığın giderilmesi bu anlaşma hükümlerine göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Böyle bir anlaşmaya varılamazsa, her gayrimenkulün ortaklaştırmadan önceki geçer değerleri, birinci fıkrada sözü geçen madde hükümlerine göre ortaklığı gidermekle görevli sulh mahkemesince ayrı ayrı takdir edilerek, bunlara Türkiye İstatistik Kurumunca yayımlanan üretici fiyat endeksi uygulanmak suretiyle her bir gayrimenkulün hükme en yakın tarih itibarıyla ulaştığı değerleri tespit edildikten sonra, bunlardan değeri en fazla olan gayrimenkulün malikine, öteki gayrimenkulleri bu değerle satın almasını teklife karar verilir ve bu teklif kabul edilip bedel ödenince ortaklık giderilmiş olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kesinleşen sulh  mahkemesi  kararının  tebliğinden  başlıyarak bir ay içinde bedel ödenmez veya altı ay içinde ödenmek üzere banka mektubu veya ayni teminat gösterilmezse ortaklaştırılan gayrimenkullerin tümü, imar durumuna göre mümkünse katmülkiyeti muhafaza ve diğer gayrimenkuller buna ilhak edilerek, eğer bu mümkün değilse kat mülkiyeti kaldırılarak, açık artırma yoliyle satılıp ortaklık giderilir ve satış bedeli her gayrimenkulün, ikinci fıkra uyarınca takdir edilmiş olan değerleri arasındaki orana göre, maliklere paylaştırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Harç ve vergiler">
      <mvz-madde no="55" başlık="">
        <mvz-fıkra no="1">
          <template>Bu kanuna göre kat mülkiyeti ve kat irtifakı kurulması, mülkiyetin başkasına devrini ihtiva etmedikçe her çeşit harc ve vergiden muaftır. Bu muafiyet, Medeni Kanunun yürürlüğe girmesinden sonra kurulan irtifak haklarının 51 nci madde gereğince kat mülkiyetine ve Medeni Kanundan önce kurulmuş olan hakların 52 nci maddeye göre kat mülkiyeti veya kat irtifakına çevrilmesi işlemlerine de şamildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurulan kat mülkiyetleri tapu memurunca derhal anagayrimenkulün kayıtlı bulunduğu yerin belediyesine ve vergi dairesine bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="E" başlık="Belediyesi olmayan yerlerdeki durum">
      <mvz-madde no="56" başlık="">
        <mvz-fıkra no="1">
          <template>Bu kanunun belediyelere yüklediği görevler, belediye olmayan, yerlerde o yerin bağlı bulunduğu ilçe veya il merkezleri belediyelerince, 6785 sayılı İmar Kanununun 47 nci maddesinde bahsi geçen sahalarda ise ilgili belediyece yerine getirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Devre Mülk Hakkı">
    <mvz-madde no="57" başlık="">
      <mvz-fıkra no="1">
        <template>Mesken olarak kullanılmaya elverişli bir yapı veya bağımsız bölümün ortak maliklerinden her biri lehine bu yapı veya bağımsız bölümden yılın belli dönemlerinde istifade hakkı, müşterek mülkiyet payına bağlı bir irtifak hakkı olarak kurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu hakka devre mülk hakkı denir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="58" başlık="">
      <mvz-fıkra no="1">
        <template>Aksi resmi senette kararlaştırılmadıkça devre mülk hakkının bağlı olduğu pay, devrelerin sayı ve süreleri esas alınarak eşit bir biçimde belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Devre mülk hakkı ancak mesken nitelikli, kat mülkiyetine veya kat irtifakına çevrilmiş yahut müstakil yapılarda kurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Devre mülk üzerinde bu hakla bağdaşan ayni haklar tesis edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Devre mülk hakkı bağlı olduğu müşterek mülkiyet payına bağlı olarak devir ve temlik edilebilir ve mirasçılara geçer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="59" başlık="">
      <mvz-fıkra no="1">
        <template>Devre mülk hakkının yılın belirli dönemlerine ayrılması ve 7 günden daha az süreli olmaması gerekir. Sözleşmede aksi kararlaştırılmamışsa devre mülk hakkı sahibi bu hakkın kullanımını başkalarına bırakabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="60" başlık="">
      <mvz-fıkra no="1">
        <template>Ana taşınmaz mal ile bağımsız bölümlerin ve müstakil yapıların tapu kütüklerinin beyanlar hanesine, bağımsız bölüm veya yapı üzerinde devre mülk hakkı kurulduğu işaret edilir ve düzenlenecek tapu senedinde de bu husus belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="61" başlık="">
      <mvz-fıkra no="1">
        <template>Üzerinde devre mülk hakkı kurulacak yapı veya bağımsız bölümlerin ortak malikler arasında dönem süresi, devir ve teslimi ile istifade şekil ve usulleri, yöneticilerin seçimi ile hak ve sorumlulukları, büyük onarım için ayrılacak dönem, bakım masrafları gibi hususlar devre mülk sözleşmesinde belirlenir. Bu hususları içeren ve bütün hak sahiplerince imzalanan devre mülk sözleşmesi resmi senede eklenir ve tapu kütüğünün beyanlar hanesinde gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Devre mülk hakkı kurulan her yapı veya bağımsız bölüm için ortak malikler, kendi aralarından veya dışardan bir gerçek veya tüzelkişiyi yönetici ve kat malikleri kuruluna temsilci olarak tayin ederler. Bu Kanunun genel hükümlerine göre atanan yöneticilere devre mülk yöneticiliği ile ilgili görevler de verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="62" başlık="">
      <mvz-fıkra no="1">
        <template>Kat mülkiyetine çevrilmiş birden fazla bağımsız bölümlerden bazılarının üzerinde devre mülk hakkı kurulması, aksi yönetim planında kararlaştırılmamışsa, diğer bağımsız bölüm maliklerinin muvafakatlarına bağlı değildir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="63" başlık="">
      <mvz-fıkra no="1">
        <template>Üzerinde devre mülk hakkı kurulan yapı veya bağımsız bölümün ortak malikleri, aksi sözleşme ile kararlaştırılmamışsa, şuyuun giderilmesini isteyemezler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="64" başlık="">
      <mvz-fıkra no="1">
        <template>Devre mülk hak sahipleri, kendilerine ayrılan ve tapu sicilinde belirtilen dönem süresi sonunda istifade ettikleri bağımsız bölüm veya yapıyı sözleşme hükümleri gereğince boşaltmaya ve yeni hak sahibine teslime mecburdurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dönem süresi sonunda tahliye olmadığı takdirde, istifade edecek dönem sahibinden birisinin veya yöneticinin tapu kaydını ve sözleşmeyi talebine ekleyerek ibrazı halinde, mahallin en büyük mülki amirin emri ile, başkaca bir işlem ve tebligata lüzum kalmadan, derhal zabıtaca boşalttırılır. İdare veya yargı organlarına yapılacak başvuru, bu boşaltma işlemini durdurmaz. İlgililerin kanundan ve sözleşmeden doğan hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="65" başlık="">
      <mvz-fıkra no="1">
        <template>Devre mülk hakkı sahiplerinin hak ve borçları, yetki ve sorumluluklarının tespit ve uyuşmazlıkların çözümlenmesinde bu Kanunda, sözleşmede veya yönetim planında hüküm bulunmayan hallerde Türk Medeni Kanunu ve ilgili diğer kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="9-DOKUZUNCU" başlık="Toplu Yapılara İlişkin Özel Hükümler">
    <mvz-madde no="66" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Toplu yapı, bir veya birden çok imar parseli üzerinde, belli bir onaylı yerleşim plânına göre yapılmış veya yapılacak, alt yapı tesisleri, ortak kullanım yerleri, sosyal tesis ve hizmetler ile bunların yönetimi bakımından birbirleriyle bağlantılı birden çok yapıyı ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu yapı kapsamındaki imar parsellerinin bitişik veya komşu olmaları şarttır. Ancak bu parseller arasında kalan ve imar plânına göre yol, meydan, yeşil alan, park, otopark gibi kamuya ayrılan yerler için bu şart aranmaz. Toplu yapı kapsamındaki her imar parseli, kat irtifakının veya kat mülkiyetinin tesisinde ayrı ayrı dikkate alınır. Ancak, toplu yapı birden fazla imar parselini içeriyorsa, münferit parseller üzerinde toplu yapı hükümlerine tâbi olacak şekilde kat mülkiyeti ilişkisi kurulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yapılar tamamlandıkça, tamamlanan yapılara ilişkin kat irtifakları kat mülkiyetine çevrilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="67" başlık="Ortak yerler">
      <mvz-fıkra no="1">
        <template>Toplu yapı kapsamında olup, bütünüyle bu kapsamdaki bağımsız bölümlerin ortak kullanma ve faydalanmasına tahsis edilmiş bulunan parsellerin malik hanesine, tahsis edildikleri toplu yapı kapsamındaki diğer parsellerin ada, parsel, blok ve bağımsız bölüm numaraları gösterilmek suretiyle tapu siciline kaydedilir ve bu suretle tahsis edildikleri parsellerde bulunan bağımsız bölümlerin ortak yeri olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu yapı kapsamında bulunan birden çok yapının ortak sosyal ve alt yapı tesisleri bulundukları parsel veya yapıya bakılmaksızın, tahsis edildikleri bağımsız bölümlerin ortak yeri sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="68" başlık="Vaziyet plân ve projeleri">
      <mvz-fıkra no="1">
        <template>Toplu yapılarda; yapıların konumları, ortak nitelikteki yerler ve tesisler, bunların kullanılış amaç ve şekilleri, toplu yapı kapsamındaki parsel veya parsellerin tamamını kapsayacak şekilde, bir bütün olarak ilgili makamlarca onaylanmış imar plânı hükümlerine uygun olarak hazırlanmış vaziyet plânında ve projelerde belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamuya ayrılan yerlerin düzenlenmesi, işletilmesi ve bakımı, bu konuda yetkili kamu kurumu ile mutabakat sağlanması hâlinde, kamunun kullanımını kısıtlamamak şartıyla toplu yapı yönetimince üstlenilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Toplu yapı uygulamasında, kat mülkiyetinin ve kat irtifakının tesisine, aranacak belgelere, tapuda yapılacak işlemlere ilişkin hususlar, Bayındırlık ve İskân Bakanlığınca hazırlanacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="69" başlık="Yönetim">
      <mvz-fıkra no="1">
        <template>Toplu yapı kapsamında bulunan parsel ve parsellerdeki birden çok bağımsız bölümü kapsayan ana yapıda ortak yerleri bulunan blok yapıların her biri, kendi sorunlarına ve yalnız o bloğa ait ortak yerlere ilişkin olarak, o blokta bulunan bağımsız bölüm maliklerinden oluşan blok kat malikleri kurulunca yönetilir. Bir parselde blok niteliğinde olmayan yapılar varsa veya bu nitelikteki yapılarla blok yapılar aynı parselde yer alıyorsa, kendi sorunlarına ve o parsele ait ortak yerlere ilişkin olarak, o parselde bulunan bağımsız bölüm maliklerinden oluşan kat malikleri kurulunca yönetilir. Yönetim plânında blokların ve blok niteliğinde olmayan yapıların idare tarzı ayrıca belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir adada birden çok parsel yer alıyorsa, adayı oluşturan parsellere ait ortak yerler, o adada bulunan bağımsız bölüm maliklerinden oluşan ada kat malikleri kurulunca yönetilir ve yönetim tarzı, kanunların emredici hükümleri saklı kalmak şartıyla, bu kurul tarafından kararlaştırılır. Bu yetki, yönetim plânında ada temsilciler kuruluna verilebilir. Yönetim plânında başka türlü düzenlenmemişse, ada temsilciler kurulu, blok yapılarda her blokta bulunan bağımsız bölüm maliklerince seçilen blok yöneticileri ve blok niteliğinde olmayan yapıların bağımsız bölüm maliklerince seçilen temsilcilerden oluşur. Ada temsilciler kurulu üyelerinin sayısı ve nasıl seçileceği toplu yapının özelliği dikkate alınarak yönetim plânında belirtilir. Ada temsilciler kurulunda bu yöneticiler ve temsilciler yönettikleri ve temsil ettikleri bağımsız bölüm sayısı kadar oy hakkına sahiptirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Toplu yapı kapsamındaki ortak yapı, yer ve tesisler, bu kapsamda yer alan bağımsız bölüm maliklerinden oluşan toplu yapı kat malikleri kurulunca yönetilir ve yönetim tarzı, kanunların emredici hükümleri saklı kalmak şartıyla, bu kurul tarafından kararlaştırılır. Bu yetki, yönetim plânında toplu yapı temsilciler kuruluna verilebilir. Yönetim plânında başka türlü düzenlenmemişse, toplu yapı temsilciler kurulu, blok yapılarda her blokta bulunan bağımsız bölüm maliklerince seçilen blok yöneticileri ve blok niteliğinde olmayan yapıların bağımsız bölüm maliklerince seçilen temsilcilerden oluşur. Toplu yapı temsilciler kurulu üyelerinin sayısı ve nasıl seçileceği toplu yapının özelliği dikkate alınarak yönetim plânında belirtilir. Toplu yapı temsilciler kurulunda bu yöneticiler ve temsilciler yönettikleri ve temsil ettikleri bağımsız bölüm sayısı kadar oy hakkına sahiptirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="70" başlık="Yönetim plânı ve değiştirilmesi">
      <mvz-fıkra no="1">
        <template>Toplu yapı kapsamındaki yapı ve yerler için tamamını kapsayan bir tek yönetim plânı düzenlenir. Yönetim plânı, toplu yapı kapsamındaki bütün kat maliklerini bağlar. Yönetim plânının değiştirilebilmesi için, toplu yapı temsilciler kurulu üyelerinin temsil ettikleri bağımsız bölümlerin tamsayısının üçte ikisinin oyu şarttır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Geçici yönetimle ilgili yönetim plânı hükümleri, toplu yapı alanındaki bağımsız bölüm maliklerinin üçte ikisinin oylarıyla değiştirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yönetim planlarının bu maddeye aykırı hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="71" başlık="Yönetici ve denetçi atama">
      <mvz-fıkra no="1">
        <template>Yönetim plânında başka türlü düzenlenmedikçe, blok kat malikleri kurulu blok için, blok niteliğinde olmayan yapıların yer aldığı parseldeki kat malikleri kendilerine özgülenen ortak yer ve tesisler için, toplu yapı temsilciler kurulu ise toplu yapı kapsamındaki bütün ortak yapı, yer ve tesisler için yönetici ve denetçi atar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Blok yöneticisi ve denetçisi, bloktaki kat maliklerinin; blok niteliğinde olmayan yapıların ortak yer ve tesisleri için yönetici ve denetçi, bu yapılardaki kat maliklerinin sayı ve arsa payı bakımından çoğunluğu tarafından seçilir. Toplu yapı kapsamındaki bütün ortak yapı, yer ve tesisler için yönetici ve denetçi ise, toplu yapı temsilciler kuruluna katılan yönetici ve temsilcilerin, yönettikleri ve temsil ettikleri bağımsız bölüm sayısının salt çoğunluğunun oyu ile atanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="72" başlık="Ortak giderlere katılma">
      <mvz-fıkra no="1">
        <template>Toplu yapı kapsamındaki belli bir yapıya veya yapıların sadece birkaçındaki kat maliklerinin ortak kullanım ve yararlanmasına tahsis edilmiş ortak yer ve tesislere ilişkin ortak giderler, o yapılardaki kat malikleri tarafından, bütün bağımsız bölümlerin ortak kullanım ve yararlanmasına tahsis edilmiş tesis ve yerlere ilişkin ortak giderler ise bütün kat malikleri tarafından karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Blok kat malikleri, toplu yapı temsilcileri ve geçici yönetim kurulu kararları, 2004 sayılı İcra ve İflas Kanununun 68 inci maddesinin birinci fıkrasında belirtilen belgelerden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kat malikleri, toplu yapı kapsamındaki ortak yapı, yer ve tesisler üzerindeki kullanma hakkından vazgeçmek veya bunların başka bir parselde veya kamuya ait alanlarda bulunduğunu veya bağımsız bölümlerinin veya kendilerinin durumu dolayısıyla bunlardan faydalanmaya lüzum ve ihtiyaç bulunmadığını ileri sürmek suretiyle toplu yapı ortak gider payını ve toplanacak avansı ödemekten kaçınamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="73" başlık="Geçici yönetim">
      <mvz-fıkra no="1">
        <template>Yönetim plânında toplu yapı temsilciler kurulu oluşuncaya kadar, bu kurulun görevlerini üstlenmek, yetkilerini kullanmak ve kurulun oluşması için gerekli girişim ve çağrılarda bulunmak üzere, bir geçici yönetim kurulması öngörülebilir. Bu takdirde yönetim plânında geçici yönetimin nasıl oluşacağına ve ne zamana kadar devam edeceğine ilişkin hükümlere yer verilir. Geçici yönetim en geç toplu yapının bitimini izleyen bir yıl sonrasına kadar devam edebilir. Bu süre, her halde toplu yapı kapsamındaki ilk yapı ruhsatının alınmasından itibaren on yıl geçmekle sona erer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="74" başlık="Uygulanacak diğer hükümler">
      <mvz-fıkra no="1">
        <template>Bu bölümde öngörülen özel hükümler saklı kalmak kaydıyla, bu Kanunda yer alan bütün hükümler, toplu yapılar hakkında da aynen veya kıyas yoluyla tatbik edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Görevli mahkeme" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasından doğacak her türlü anlaşmazlık sulh mahkemelerinde çözümlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kullanma yerlerinin boşaltılması" tür="Ek">
      <mvz-fıkra no="1">
        <template>Kat malikleri kurulunca veya bu kurulca yetki verilen yönetici tarafından sözleşmeleri herhangi bir nedenle feshedilen veya sona eren, kapıcı, kaloriferci, bahçıvan ve bekçiler ile dışarıdan atanan yöneticiler kendilerine bu görevleri dolayısıyla bir yer tahsis edilmiş ise, bu yerleri onbeş gün içerisinde boşaltmak zorundadırlar. Bu süre içinde boşaltılmayan yerler yöneticinin veya kat maliklerinden herhangi birinin başvurusu üzerine başkaca tebligata lüzum kalmadan mahalli mülki amirlerin kararı ile bir hafta içinde zabıtaca boşalttırılır. İdare ve yargı organlarına yapılacak başvuru, bu kararların yerine getirilmesini durdurmaz. İlgililerin kanun ve sözleşmeden doğan hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Birden çok yapılarda uygulanacak özel hükümler" tür="Ek" durum="mülga">
    </mvz-madde>
    <mvz-madde no="4" başlık="Kat irtifakına geçiş" tür="Ek">
      <mvz-fıkra no="1">
        <template>Beş veya daha fazla kişi tarafından üzerinde bir veya birden çok yapı yaptırılmak amacıyla birlikte bir arsa edinilmiş olması ve pay sahiplerinden en az beşte dördünün kat irtifakına geçiş konusunda aldığı karara uyulmaması halinde, karara uymayan pay sahiplerinin gayrimenkuldeki paylarının iptaline ve bu payların, isteyen diğer pay sahipleri adına tesciline sulh mahkemesi tarafından aşağıdaki şartlarla karar verilir:</template>
        <mvz-bent no="a">
          <template>Müşterek gayrimenkulün yukarıda belirtilen amaçla edinildiğinin ispat edilmiş olması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Müşterek maliklerin yukarıda açıklanan çoğunluğunun kat irtifakına geçiş kararına veya bununla ilgili yükümlülüklere noterlikçe yapılan tebligata rağmen iki ay içinde uyulmamış olması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Karara uymayan müşterek maliklerin paylarının mahkemece tespit edilen rayiç bedelinin mahkeme veznesine depo edilmesi.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Hatalı blok veya bağımsız bölüm numaralarının düzeltilmesi" tür="Ek">
      <mvz-fıkra no="1">
        <template>Kat mülkiyetine tabi yapıların projesindeki hatalı blok numaralarının düzeltilebilmesi için; blok bazında kat malikleri kurulunun salt çoğunluğuyla alınmış karar ile lisanslı harita ve kadastro bürosu veya kadastro müdürlüğü tarafından hazırlanan teknik rapor gereğince düzenlenen ve ilgili idarece onaylanan yeni vaziyet planı ilgilisi tarafından tapu müdürlüğüne sunulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kat mülkiyetine tabi yapıların projesindeki hatalı bağımsız bölüm numaralarının düzeltilebilmesi için; lisanslı harita ve kadastro bürosu veya kadastro müdürlüğü tarafından hazırlanan ve ilgili idarece onaylanan teknik rapor ilgilisi tarafından tapu müdürlüğüne sunulur. Bu fıkra kapsamında yapılan düzeltmelerde ayni ve şahsi hak lehtarlarının muvafakati aranır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girmesinden önce yapı kullanma izin belgesi düzenlenen tüm yapılarda, Mekânsal Adres Kayıt Sistemine yüklenemeyen yapı kullanma izin belgesi ile yapı aplikasyon projesinin yetkili idare tarafından elektronik ortamda kadastro müdürlüğüne gönderilmesi hâlinde, 10 uncu maddenin altıncı fıkrası hükümleri uyarınca işlem yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlük tarihinden önce kurulan toplu yapılara ait yönetim planlarının, bu Kanun hükümlerine uyarlanması amacıyla yapılacak ilk değişiklik için mevcut kat malikleri kurulunun salt çoğunluğu yeterlidir. Mevcut toplu yapı yönetimleri, değiştirilen yönetim planına göre yeni yöneticiler seçilinceye kadar geçici yönetim olarak görevini sürdürür. Toplu yapı yöneticisi seçimi, en geç yönetim planının değiştirilmesini takip eden üç ay içinde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
