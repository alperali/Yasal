  <mvz-künye tür="kanun" no="5320" başlık="CEZA MUHAKEMESİ KANUNUNUN YÜRÜRLÜK VE UYGULAMA ŞEKLİ HAKKINDA KANUN"
             tarih="23/3/2005" rgazete-tarih="31/3/2005" rgazete-sayı="25772" rgazete-mükerrer="1"
             düstur-tertip="5" düstur-cilt="44" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, 4.12.2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun yürürlüğe konulmasına ve uygulanmasına ilişkin esas ve usûlleri belirlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, diğer kanunlarda, yürürlükten kaldırılan 4.4.1929 tarihli ve 1412 sayılı Ceza Muhakemeleri Usulü Kanununa yapılan yollamaları, Ceza Muhakemesi Kanununun yürürlüğe girmesiyle yürürlükten kaldırılan hükümleri ve bu Kanunun uygulanması için diğer kanunlarda yapılan değişiklikleri belirtir ve yürürlüğe girmesinden önce işlenmiş suçlar hakkında ne şekilde uygulama yapılacağına ve kesinleşmiş cezaların nasıl infaz edileceğine ilişkin bazı usul hükümlerini kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Uyum Hükümleri">
    <mvz-madde no="3" başlık="Yollamalar">
      <mvz-fıkra no="1">
        <template>Mevzuatta, yürürlükten kaldırılan Ceza Muhakemeleri Usulü Kanununa yapılan yollamalar, Ceza Muhakemesi Kanununun bu hükümlerin karşılığını oluşturan maddelerine yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mevzuatta, yürürlükten kaldırılan Ceza Muhakemeleri Usulü Kanununun kitap, bab ve fasıllarına yapılmış yollamalar, o kitap, bab ve fasıl içinde yer almış hükümlerin karşılığını oluşturan Ceza Muhakemesi Kanununun maddelerine yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Mahkemelerin görevleri">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemesi Kanunu, yürürlüğe girdiği tarihten itibaren, aşağıdaki maddelerin hükümleri saklı kalmak üzere, kesin hükme bağlanmış olanlar hariç, görülmekte olan bütün soruşturma ve kovuşturmalarda uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, Ceza Muhakemesi Kanununun yürürlüğe girmesinden önce soruşturma ve kovuşturma evrelerinde yapılmış işlem ve kararlar hukuki geçerliliklerini sürdürürler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Gıyabî tutuklama kararları">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemeleri Usulü Kanunu yürürlükte iken verilmiş gıyabî tutuklama kararları, Ceza Muhakemesi Kanununun yürürlüğe girmesiyle, 248 inci maddesinin yabancı ülkede bulunan kaçaklarla ilgili beşinci fıkrası hükmü ayrık olmak üzere, yakalama emri niteliğine dönüşür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ceza Muhakemesi Kanununun 248 inci maddesinin beşinci fıkrası hükmü, sadece yabancı ülkede bulunan kaçaklar hakkında uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Koruma tedbirleri nedeniyle tazminat">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemesi Kanununun 141 ilâ 144 üncü maddeleri hükümleri, 1 Haziran 2005 tarihinden itibaren yapılan işlemler hakkında uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu tarihten önceki işlemler hakkında ise, 7.5.1964 tarihli ve 466 sayılı Kanun Dışı Yakalanan veya Tutuklanan Kimselere Tazminat Verilmesi Hakkında Kanun hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="İtiraz">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemeleri Usulü Kanunu gereğince süre konulmamış adî itiraza tâbi kararlara karşı Ceza Muhakemesi Kanununun yürürlüğe girdiği tarihten itibaren yedi gün içinde itiraz yoluna başvurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ceza Muhakemeleri Usulü Kanunu ve diğer kanunlarda yer alan acele itirazlar hakkında Ceza Muhakemesi Kanununun itiraza ilişkin hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Temyiz ve karar düzeltme">
      <mvz-fıkra no="1">
        <template>Bölge adliye mahkemelerinin, 26.9.2004 tarihli ve 5235 sayılı Adlî Yargı İlk Derece Mahkemeleri ile Bölge Adliye Mahkemelerinin Kuruluş, Görev ve Yetkileri Hakkında Kanunun geçici 2 nci maddesi uyarınca Resmî Gazetede ilân edilecek göreve başlama tarihinden önce verilen kararlar hakkında, kesinleşinceye kadar Ceza Muhakemeleri Usulü Kanununun 322 nci maddesinin dördüncü, beşinci ve altıncı fıkraları hariç olmak üzere, 305 ilâ 326 ncı maddeleri uygulanır.  Bu kararlara ilişkin dosyalar bölge adliye mahkemelerine gönderilemez.  Yargıtay ceza daireleri ile Ceza Genel Kurulu kararlarındaki yazıma ilişkin maddi hataların düzeltilmesi için Yargıtay Cumhuriyet Başsavcısı, ilgili ceza dairesi veya Ceza Genel Kuruluna başvurabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2" durum="iptal">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ceza Muhakemesi Kanununun yürürlüğe girdiği tarihten önce Yargıtay'ca incelenip kesinleşen hükümler hakkında, başvuru süresi dolmamış olması kaydıyla karar düzeltme yoluna gidilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Şahsî dava">
      <mvz-fıkra no="1">
        <template>Özel kanunlarda öngörülen şahsî davalar kamu davasına dönüşür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hâlen şahsî dava usulüne göre yürütülen davalar da kamu davası olarak sürdürülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Şahsî davacılar, katılan sıfatını alırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu davalar hakkında, 26.9.2004 tarihli ve 5237 sayılı Türk Ceza Kanunu ile Ceza Muhakemesi Kanununun uzlaşmaya ilişkin hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Ceza kararnamesi">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemesi Kanununun yürürlüğe girdiği tarihten önce verilip henüz kesinleşmemiş ceza kararnamesi ile sonuçlandırılan dava dosyaları, mahkemesince re'sen ele alınarak duruşmalı yargılama yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Yargılamaya katılamayacak hâkim">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemesi Kanununun 23 üncü maddesinin ikinci fıkrası, Kanunun 163 üncü maddesi hükmü dışındaki hallerde uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Tutuklulukta geçecek süre ve tanıkların dinlenmesi">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemesi Kanununun 102 nci maddesi, aynı Kanunun 250 nci maddesinin birinci fıkrasının (c) bendinde yazılı suçlar ile ağır ceza mahkemesinin görev alanına giren suçlar bakımından, 31 Aralık 2010 tarihinde yürürlüğe girer. Bu süre zarfında 1412 sayılı Ceza Muhakemeleri Usulü Kanununun 110 uncu maddesinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ceza Muhakemesi Kanununun 52 nci maddesinin üçüncü fıkrası, bu fıkranın (a) ve (b) bentleri yönünden 1 Temmuz 2006 tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Müdafi ve vekil ücreti">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemesi Kanunu gereğince soruşturma ve kovuşturma makamlarının istemi üzerine baro tarafından görevlendirilen müdafi ve vekile, avukatlık ücret tarifesinden ayrık olarak, Türkiye Barolar Birliğinin görüşü de alınarak Adalet ve Maliye bakanlıkları tarafından birlikte tespit edilecek ücret, Adalet Bakanlığı bütçesinde bu amaçla yer alan ödenekten ödenir. Bu ücret, yargılama giderlerinden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde uyarınca yapılacak ödeme ve uygulamaya ilişkin usûl ve esaslar Türkiye Barolar Birliğinin görüşü de alınmak suretiyle Adalet Bakanlığı tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Çeşitli Hükümler">
    <mvz-madde no="14" başlık="Yönetmeliklerin çıkarılması">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemesi Kanununda öngörülen yönetmelikler, bu Kanunun yürürlüğe girdiği tarihten itibaren altı ay içinde çıkarılır ya da yürürlükteki yönetmeliklerde gerekli değişiklikler yapılır. Bu düzenlemeler yapılıncaya kadar, yürürlükteki yönetmeliklerin Ceza Muhakemesi Kanununa aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Zamanaşımı">
      <mvz-fıkra no="1">
        <template>Birden fazla mahkumiyeti olan kişi bu mahkumiyetlerden birine ilişkin cezayı infaz kurumunda çektiği sürece, diğer cezaları açısından ceza zamanaşımı işlemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cezanın infazının ertelenmesi veya durdurulması halinde, bu cezaya ilişkin zamanaşımı işlemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Kolluğa bildirim">
      <mvz-fıkra no="1">
        <template>Şüpheli ve sanıkla ilgili olarak verilen soruşturma ve kovuşturmayı sona erdiren kesinleşmiş kararlar, soruşturmada görev alan kolluk birimlerine bildirilir. Kolluk birimleri bu bildirim üzerine gerekli işlemleri derhal yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kolluk birimlerine yapılan ihbar ve şikâyetler üzerine verilen soruşturma yapılmasına yer olmadığına dair kararlar da gerekli işlem ve düzeltmelerin yapılması için ilgili kolluk birimine gecikmeksizin gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Parada sahtecilikle ilgili bilgilerin toplanması">
      <mvz-fıkra no="1">
        <template>Parada sahtecilik suçundan dolayı elkonulan sahte paralar ve bunlara ilişkin bilgiler, Cumhuriyet başsavcılıkları ve mahkemeler tarafından paraların asıllarını tedavüle çıkaran kurumca oluşturulacak sistemde incelenmek ve değerlendirilmek üzere paraların asıllarını tedavüle çıkaran kurumun ilgili birimine gönderilir. Gönderilen bilgilerin içeriği ve bildirimin sureti, paraların asıllarını tedavüle çıkaran kurum ile İçişleri Bakanlığının görüşü alınarak, Adalet Bakanlığı tarafından çıkarılacak bir yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Yürürlükten kaldırılan kanunlar">
      <mvz-fıkra no="1">
        <template>1 Haziran 2005 tarihi itibarıyla;</template>
        <mvz-bent no="a">
          <template>4.4.1929 tarihli ve 1412 sayılı Ceza Muhakemeleri Usulü Kanunu,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>8.6.1936 tarihli ve 3005 sayılı Meşhud Suçların Muhakeme Usulü Kanunu,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>7.5.1964 tarihli ve 466 sayılı Kanun Dışı Yakalanan veya Tutuklanan Kimselere Tazminat Verilmesi Hakkında Kanun,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>30.7.1999 tarihli ve 4422 sayılı Çıkar Amaçlı Suç Örgütleriyle Mücadele Kanunu,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Bütün ek ve değişiklikleriyle birlikte yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun 6, 8 ve 12 nci maddelerinde öngörülen yürürlük ve uygulamaya ilişkin hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Kanunlarda sulh ceza mahkemesi veya sulh ceza hâkimine yapılan atıflardan,</template>
        <mvz-bent no="a">
          <template>İdari yaptırım kararlarına karşı yapılan başvurulara, yürütülen soruşturmalarda hâkim tarafından verilmesi gerekli karar ve işlemlere ve kanunlarda sulh ceza mahkemesince veya hâkimince verilmesi öngörülen karar veya işlemlere ilişkin olanlar sulh ceza hâkimine,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yargılamaya ilişkin olanlar asliye ceza mahkemesine veya hâkimine,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce ceza mahkemelerinde açılmış bulunan davalardaki şahsi hak talepleri, görevsizlik kararı verilmeyerek bu mahkemelerce sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bölge adliye mahkemeleri faaliyete geçinceye kadar hapis cezasından çevrilenler hariç olmak üzere, sonuç olarak belirlenen onbeşbin Türk Lirası dâhil adlî para cezasına mahkûmiyet hükümlerine karşı temyiz yoluna başvurulamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>1/1/2014 tarihine kadar, asliye ceza mahkemelerinde yapılan duruşmalarda Cumhuriyet savcısı bulunmaz ve katılma hususunda Cumhuriyet savcısının görüşü alınmaz. Ancak, verilen hükümler ile tutuklamaya veya salıverilmeye ilişkin kararlara karşı Cumhuriyet savcısının kanun yoluna başvurabilmesi amacıyla dosya Cumhuriyet başsavcılığına gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici" durum="mülga">
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Ceza Muhakemesi Kanununun 308 inci maddesinde yapılan değişiklikler, bu Kanunun yayımı tarihinde Yargıtay Ceza Genel Kurulunda bulunan ve henüz karara bağlanmamış dosyalar hakkında da uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihte sulh ceza mahkemeleri kaldırılmıştır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin yürürlüğe girdiği tarihten itibaren yirmi gün içinde sulh ceza hâkimlikleri kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin yürürlüğe girdiği tarihte, sulh ceza mahkemelerinde görülmekte olan dava dosyaları bir ay içinde yetkili asliye ceza mahkemelerine devredilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddenin yürürlüğe girdiği tarihte, kaldırılan sulh ceza mahkemelerinde görülmekte olan işlerden, sulh ceza hâkimliğince bakılması gerekenler, sulh ceza hâkimliklerinin kurulmasından itibaren on beş gün içinde yetkili sulh ceza hâkimliğine devredilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kaldırılan sulh ceza mahkemelerinde görev yapan hâkimler Hâkimler ve Savcılar Yüksek Kurulunca, sulh ceza hâkimliklerinin kurulmasından itibaren on beş gün içinde müktesepleri dikkate alınarak uygun görülecek bir göreve atanır veya yetkilendirilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu maddenin yürürlüğe girdiği tarihte, sulh ceza mahkemelerince verilen kararlardan Yargıtay incelemesinde olanlar hakkında sadece görev nedeniyle bozma kararı verilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Sulh ceza hâkimlikleri faaliyete geçirilinceye kadar, sulh ceza mahkemelerinin görev alanına giren her türlü kararı vermeye kaldırılan sulh ceza mahkemeleri yetkilidir. Kaldırılan mahkemelerde bulunan ve kesinleşen dosyalara ait arşiv ve emanetler ile diğer evrak ve dokümanlar Hâkimler ve Savcılar Yüksek Kurulu tarafından belirlenecek mahkeme veya mahkemelere ya da hâkimliklere devredilir ve müteakip işlem ve talepler bu mahkemelerce veya hâkimliklerce yerine getirilir veya karara bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla Türk Ceza Kanununun 191 inci maddesinde tanımlanan suç nedeniyle yürütülen kovuşturmalarda, hakkında hâlen denetimli serbestlik veya tedavi kararı uygulananlar bakımından Türk Ceza Kanununun 191 inci maddesi hükümleri çerçevesinde bu tedbirlerin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla Türk Ceza Kanununun 191 inci maddesinde tanımlanan suç nedeniyle yürütülen kovuşturmalarda, hakkında daha önce denetimli serbestlik veya tedavi tedbiri uygulanmayan kişilerle ilgili olarak 191 inci madde hükümleri çerçevesinde hükmün açıklanmasının geri bırakılması kararı verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla Türk Ceza Kanununun 191 inci maddesinde tanımlanan suç nedeniyle yürütülen kovuşturmalarda, hakkında daha önce denetimli serbestlik veya tedavi kararı verilmiş olup da bu yükümlülükleri ihlal eden kişilerin yargılanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce suç soruşturması ve kovuşturması sırasında yapılan her türlü işlem veya alınan karar nedeniyle hâkimler ve Cumhuriyet savcıları hakkında hukuk mahkemelerinde açılan ve hâlen derdest olan tazminat davasına ilişkin dosyalar mahkemesince, Yargıtay incelemesinde bulunan dosyalar ise esası incelenmeksizin ilgili dairece yetkili ağır ceza mahkemesine gönderilir. Bu davalar ağır ceza mahkemelerince, Ceza Muhakemesi Kanununun 141 inci ve devamı maddeleri uyarınca Devlet aleyhine yürütülmek suretiyle karara bağlanır.</template>
