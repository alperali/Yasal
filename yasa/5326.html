  <mvz-künye tür="kanun" no="5326" başlık="KABAHATLER KANUNU"
             tarih="30/3/2005" rgazete-tarih="31/3/2005" rgazete-sayı="25772" rgazete-mükerrer="1"
             düstur-tertip="5" düstur-cilt="44" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç ve Kapsam, Tanım, Kanunîlik İlkesi ve Kanunun Uygulama Alanı">
      <mvz-madde no="1" başlık="Amaç ve kapsam">
        <mvz-fıkra no="1">
          <template>Bu Kanunda; toplum düzenini, genel ahlâkı, genel sağlığı, çevreyi ve ekonomik düzeni korumak amacıyla;</template>
          <mvz-bent no="a">
            <template>Kabahatlere ilişkin genel ilkeler,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kabahatler karşılığında uygulanabilecek olan idarî yaptırımların türleri ve sonuçları,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kabahatler dolayısıyla karar alma süreci,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>İdarî yaptırıma ilişkin kararlara karşı kanun yolu,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İdarî yaptırım kararlarının yerine getirilmesine ilişkin esaslar,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Belirlenmiş ve çeşitli kabahatler tanımlanmıştır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Tanım">
        <mvz-fıkra no="1">
          <template>Kabahat deyiminden; kanunun, karşılığında idarî yaptırım uygulanmasını öngördüğü haksızlık anlaşılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="Genel kanun niteliği">
        <mvz-fıkra no="1">
          <template>Bu Kanunun;</template>
          <mvz-bent no="a">
            <template>İdarî yaptırım kararlarına karşı kanun yoluna ilişkin hükümleri, diğer kanunlarda aksine hüküm bulunmaması halinde,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Diğer genel hükümleri, idarî para cezası veya mülkiyetin kamuya geçirilmesi yaptırımını gerektiren bütün fiiller hakkında,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="Kanunîlik ilkesi">
        <mvz-fıkra no="1">
          <template>Hangi fiillerin kabahat oluşturduğu, kanunda açıkça tanımlanabileceği gibi; kanunun kapsam ve koşulları bakımından belirlediği çerçeve hükmün içeriği, idarenin genel ve düzenleyici işlemleriyle de doldurulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kabahat karşılığı olan yaptırımların türü, süresi ve miktarı, ancak kanunla belirlenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Zaman bakımından uygulama">
        <mvz-fıkra no="1">
          <template>26.9.2004 tarihli ve 5237 sayılı Türk Ceza Kanununun zaman bakımından uygulamaya ilişkin hükümleri kabahatler bakımından da uygulanır. Ancak, kabahatler karşılığında öngörülen idarî yaptırımlara ilişkin kararların yerine getirilmesi bakımından derhal uygulama kuralı geçerlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kabahat, failin icraî veya ihmali davranışı gerçekleştirdiği zaman işlenmiş sayılır. Neticenin oluştuğu zaman, bu bakımdan dikkate alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Yer bakımından uygulama">
        <mvz-fıkra no="1">
          <template>5237 sayılı Türk Ceza Kanununun yer bakımından uygulamaya ilişkin 8 inci maddesi hükümleri, kabahatler bakımından da uygulanır. Ancak, kanunlarda aksine hüküm bulunan haller saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Kabahatten Dolayı Sorumluluğun Esasları">
      <mvz-madde no="7" başlık="Kabahatin ihmali davranışla işlenmesi">
        <mvz-fıkra no="1">
          <template>Kabahat, icraî veya ihmali davranışla işlenebilir. İhmali davranışla işlenmiş kabahatin varlığı için kişi açısından belli bir icraî davranışta bulunma hususunda hukukî yükümlülüğün varlığı gereklidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Organ veya temsilcinin davranışından dolayı sorumluluk">
        <mvz-fıkra no="1">
          <template>Organ veya temsilcilik görevi yapan ya da organ veya temsilci olmamakla birlikte, tüzel kişinin faaliyeti çerçevesinde görev üstlenen kişinin bu görevi kapsamında işlemiş bulunduğu kabahatten dolayı tüzel kişi hakkında da idarî yaptırım uygulanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Temsilci sıfatıyla hareket eden kişinin bu sıfatla bağlantılı olarak işlemiş bulunduğu kabahatten dolayı temsil edilen gerçek kişi hakkında da idarî yaptırım uygulanabilir. Gerçek kişiye ait bir işte çalışan kişinin bu faaliyeti çerçevesinde işlemiş bulunduğu kabahatten dolayı, iş sahibi kişi hakkında da idarî yaptırım uygulanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kanunun, organ veya temsilcide ya da temsil edilen kişide özel nitelikler aradığı hallerde de yukarıdaki fıkralar hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birinci ve ikinci fıkra hükümleri, organ veya temsilcilik ya da hizmet ilişkisinin dayanağını oluşturan işlemin hukuken geçerli olmaması halinde de uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Kast veya taksir">
        <mvz-fıkra no="1">
          <template>Kabahatler, kanunda açıkça hüküm bulunmayan hallerde, hem kasten hem de taksirle işlenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Hata">
        <mvz-fıkra no="1">
          <template>Türk Ceza Kanununun hata hallerine ilişkin hükümleri, ancak kasten işlenen kabahatler bakımından uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Sorumluluk">
        <mvz-fıkra no="1">
          <template>Fiili işlediği sırada onbeş yaşını doldurmamış çocuk hakkında idarî para cezası uygulanamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Akıl hastalığı nedeniyle, işlediği fiilin hukukî anlam ve sonuçlarını algılayamayan veya bu fiille ilgili olarak davranışlarını yönlendirme yeteneği önemli derecede azalmış olan kişi hakkında idarî para cezası uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Hukuka uygunluk nedenleri ile kusurluluğu ortadan kaldıran nedenler">
        <mvz-fıkra no="1">
          <template>Bu Kanunda aksine hüküm bulunmayan hallerde, Türk Ceza Kanununun hukuka uygunluk nedenleri ile kusurluluğu ortadan kaldıran nedenlere ilişkin hükümleri, kabahatler bakımından da uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Teşebbüs">
        <mvz-fıkra no="1">
          <template>Kabahate teşebbüs cezalandırılmaz. Ancak, teşebbüsün de cezalandırılabileceğine dair ilgili kanunda hüküm bulunan haller saklıdır. Bu durumda, Türk Ceza Kanununun suça teşebbüse ve gönüllü vazgeçmeye ilişkin hükümleri, kabahatler bakımından da uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="İştirak">
        <mvz-fıkra no="1">
          <template>Kabahatin işlenişine birden fazla kişinin iştirak etmesi halinde bu kişilerin her biri hakkında, fail olarak idarî para cezası verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Özel faillik niteliğinin arandığı durumlarda, kabahate iştirak eden ve bu niteliği taşımayan kişi hakkında da fail olarak idarî para cezası verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kabahate iştirak için kasten ve hukuka aykırı işlenmiş bir fiilin varlığı yeterlidir. Kabahatin işlenişine iştirak eden kişi hakkında, diğerlerinin sorumlu olup olmadığı göz önünde bulundurulmaksızın idarî para cezası verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kanunda özel faillik niteliğini taşıyan kişi açısından suç, diğer kişiler açısından kabahat olarak tanımlanan fiilin, bu niteliği taşıyan ve taşımayan kişiler tarafından ortaklaşa işlenmesi halinde suça iştirake ilişkin hükümler uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="İçtima">
        <mvz-fıkra no="1">
          <template>Bir fiil ile birden fazla kabahatin işlenmesi halinde bu kabahatlere ilişkin tanımlarda sadece idarî para cezası öngörülmüşse, en ağır idarî para cezası verilir. Bu kabahatlerle ilgili olarak kanunda idarî para cezasından başka idarî yaptırımlar da öngörülmüş ise, bu yaptırımların her birinin uygulanmasına karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Aynı kabahatin birden fazla işlenmesi halinde her bir kabahatle ilgili olarak ayrı ayrı idarî para cezası verilir. Kesintisiz fiille işlenebilen kabahatlerde, bu nedenle idarî yaptırım kararı verilinceye kadar fiil tek sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bir fiil hem kabahat hem de suç olarak tanımlanmış ise, sadece suçtan dolayı yaptırım uygulanabilir. Ancak, suçtan dolayı yaptırım uygulanamayan hallerde kabahat dolayısıyla yaptırım uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="İdarî Yaptırımlar">
      <mvz-madde no="16" başlık="Yaptırım türleri">
        <mvz-fıkra no="1">
          <template>Kabahatler karşılığında uygulanacak olan idarî yaptırımlar, idarî para cezası ve idarî tedbirlerden ibarettir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İdarî tedbirler, mülkiyetin kamuya geçirilmesi ve ilgili kanunlarda yer alan diğer tedbirlerdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="İdarî para cezası">
        <mvz-fıkra no="1">
          <template>İdarî para cezası, maktu veya nispi olabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İdarî para cezası, kanunda alt ve üst sınırı gösterilmek suretiyle de belirlenebilir. Bu durumda, idarî para cezasının miktarı belirlenirken işlenen kabahatin haksızlık içeriği ile failin kusuru ve ekonomik durumu birlikte göz önünde bulundurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>10/12/2003 tarihli ve 5018 sayılı Kamu Mali Yönetimi ve Kontrol Kanununa ekli (I), II ve III sayılı cetvellerde yer alan kamu idareleri tarafından verilen idarî para cezalarının ilgili kanunlarında 1/6/2005 tarihinden sonra belirlenen oranın dışındaki kısmı ile Cumhuriyet başsavcılıkları ve mahkemeler tarafından verilen idarî para cezaları Genel Bütçeye gelir kaydedilir. Sosyal güvenlik kurumları ile mahalli idareler tarafından verilen idarî para cezaları kendi bütçelerine gelir kaydedilir. Diğer kamu kurum ve kuruluşları tarafından verilen idarî para cezaları ise, ilgili kanunlarındaki hükümler saklı kalmak kaydıyla, Genel Bütçeye gelir kaydedilir. Kamu kurumu niteliğindeki meslek kuruluşlarının verdiği para cezaları, kendi kanunlarındaki hükümlere tâbidir. Kişinin ekonomik durumunun müsait olmaması halinde, idarî para cezasının, ilk taksitinin peşin ödenmesi koşuluyla, bir yıl içinde ve dört eşit taksit halinde ödenmesine karar verilebilir. Taksitlerin zamanında ve tam olarak ödenmemesi halinde, idarî para cezasının kalan kısmının tamamı tahsil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Genel Bütçeye gelir kaydedilmesi gereken idarî para cezalarına ilişkin kesinleşen kararlar, 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre tahsil edilmek üzere Maliye Bakanlığınca belirlenecek tahsil dairelerine gönderilir. Sosyal güvenlik kurumları ve mahalli idareler tarafından verilen idarî para cezaları, ilgili kanunlarında aksine hüküm bulunmadığı takdirde, Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre kendileri tarafından tahsil olunur. Diğer kamu kurum ve kuruluşları tarafından verilen ve Genel Bütçeye gelir kaydedilmesi gerekmeyen idarî para cezaları, ilgili kanunlarında özel hüküm bulunmadığı takdirde genel hükümlere göre tahsil olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İdarî para cezası tamamen tahsil edildikten itibaren en geç bir ay içinde durum, ilgili kamu kurum ve kuruluşuna bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kabahat dolayısıyla idarî para cezası veren kamu görevlisi, ilgilinin rıza göstermesi halinde bunun tahsilatını derhal kendisi gerçekleştirir.  Kanunlarında ödeme süresi düzenlenmemiş olan idari para cezaları, tebliğinden itibaren bir ay içinde ödenir. İdari para cezasının ödeme süresi içinde ödenmesi halinde, cezadan %25 oranında indirim yapılır.  Ödeme yapılması, kişinin bu karara karşı kanun yoluna başvurma hakkını etkilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>İdarî para cezaları her takvim yılı başından geçerli olmak üzere o yıl için 4.1.1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi hükümleri uyarınca tespit ve ilân edilen yeniden değerleme oranında artırılarak uygulanır. Bu suretle idarî para cezasının hesabında bir Türk Lirasının küsuru dikkate alınmaz. Bu fıkra hükmü, nispi nitelikteki idarî para cezaları açısından uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Mülkiyetin kamuya geçirilmesi">
        <mvz-fıkra no="1">
          <template>Kabahatin konusunu oluşturan veya işlenmesi suretiyle elde edilen eşyanın mülkiyetinin kamuya geçirilmesine, ancak kanunda açık hüküm bulunan hallerde karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mülkiyetin kamuya geçirilmesine ilişkin karar, eşyanın;</template>
          <mvz-bent no="a">
            <template>Kullanılmaz hale getirilmesi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Niteliğinin değiştirilmesi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Ancak belli bir surette kullanılması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Koşullarından birinin yerine getirilmesine bağlı olarak belli bir süre geciktirilebilir. Belirlenen süre zarfında koşulun yerine getirilmemesi halinde eşyanın mülkiyetinin kamuya geçirilmesine karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mülkiyetin kamuya geçirilmesine ilişkin karar kesinleşinceye kadar ilgili kamu kurum ve kuruluşu tarafından eşyaya elkonulabileceği gibi; eşya, kişilerin muhafazasına da bırakılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Eşyanın mülkiyeti, kanunda açık hüküm bulunan hallerde ilgili kamu kurum ve kuruluşuna, aksi takdirde Devlete geçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Eşyanın mülkiyetinin kamuya geçirilmesine karar verilebilmesi için fail hakkında idarî para cezası veya başka bir idarî yaptırım kararı verilmiş olması şart değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kaim değerin mülkiyetinin kamuya geçirilmesine de karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Mülkiyeti kamuya geçirilen eşya, başka suretle değerlendirilmesi mümkün olmazsa imha edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Mülkiyetin kamuya geçirilmesine ilişkin karar, kesinleşmesi halinde yerine getirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Saklı tutulan hükümler">
        <mvz-fıkra no="1">
          <template>Diğer kanunlarda kabahat karşılığında öngörülen belirli bir süre için;</template>
          <mvz-bent no="a">
            <template>Bir meslek ve sanatın yerine getirilmemesi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İşyerinin kapatılması,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Ruhsat veya ehliyetin geri alınması,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kara, deniz veya hava nakil aracının trafikten veya seyrüseferden alıkonulması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>gibi yaptırımlara ilişkin hükümler, ilgili kanunlarda bu Kanun hükümlerine uygun değişiklik yapılıncaya kadar saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="Soruşturma zamanaşımı">
        <mvz-fıkra no="1">
          <template>Soruşturma zamanaşımının dolması halinde kabahatten dolayı kişi hakkında idarî para cezasına karar verilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Soruşturma zamanaşımı süresi;</template>
          <mvz-bent no="a">
            <template>Yüzbin Türk Lirası veya daha fazla idarî para cezasını gerektiren kabahatlerde beş,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Ellibin Türk Lirası veya daha fazla idarî para cezasını gerektiren kabahatlerde dört,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Ellibin Türk Lirasından az idarî para cezasını gerektiren kabahatlerde üç,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>yıldır.  Ancak, 89 uncu maddesi hariç olmak üzere 1111 sayılı Askerlik Kanunu, 2839 sayılı Milletvekili Seçimi Kanunu, 2918 sayılı Karayolları Trafik Kanunu, 2972 sayılı Mahalli İdareler ile Mahalle Muhtarlıkları ve İhtiyar Heyetleri Seçimi Hakkında Kanun, 3376 sayılı Anayasa Değişikliklerinin Halkoyuna Sunulması Hakkında Kanun, 4925 sayılı Karayolu Taşıma Kanunu, 5490 sayılı Nüfus Hizmetleri Kanunu ve 6001 sayılı Karayolları Genel Müdürlüğünün Teşkilat ve Görevleri Hakkında Kanunda belirtilen ve idari para cezasını gerektiren fiilin işlendiği tarihi takip eden takvim yılının son günü bitimine kadar idari para cezası verilerek tebliğ edilmediği takdirde idari yaptırım kararı verilemez, verilmiş olanlar düşer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Nispî idarî para cezasını gerektiren kabahatlerde zamanaşımı süresi sekiz yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Zamanaşımı süresi, kabahate ilişkin tanımdaki fiilin işlenmesiyle veya neticenin gerçekleşmesiyle işlemeye başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kabahati oluşturan fiilin aynı zamanda suç oluşturması halinde suça ilişkin dava zamanaşımı hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="Yerine getirme zamanaşımı">
        <mvz-fıkra no="1">
          <template>Yerine getirme zamanaşımının dolması halinde idarî para cezasına veya mülkiyetin kamuya geçirilmesine ilişkin karar artık yerine getirilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yerine getirme zamanaşımı süresi;</template>
          <mvz-bent no="a">
            <template>Ellibin Türk Lirası veya daha fazla idarî para cezasına karar verilmesi halinde yedi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yirmibin Türk Lirası veya daha fazla idarî para cezasına karar verilmesi halinde beş,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Onbin Türk Lirası veya daha fazla idarî para cezasına karar verilmesi halinde dört,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Onbin Türk Lirasından az idarî para cezasına karar verilmesi halinde üç,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mülkiyetin kamuya geçirilmesine ilişkin zamanaşımı süresi on yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Zamanaşımı süresi, kararın kesinleşmesinin rastladığı takvim yılını takip eden takvim yılı başından itibaren işlemeye başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kanun hükmü gereği olarak idarî yaptırımın yerine getirilmesine başlanamaması veya yerine getirilememesi halinde zamanaşımı işlemez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Karar Verme Yetkisi ve Kanun Yolları">
      <mvz-madde no="22" başlık="İdarî yaptırım kararı verme yetkisi">
        <mvz-fıkra no="1">
          <template>Kabahat dolayısıyla idarî yaptırım kararı vermeye ilgili kanunda açıkça gösterilen idarî kurul, makam veya kamu görevlileri yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanunda açık hüküm bulunmayan hallerde ilgili kamu kurum ve kuruluşunun en üst amiri bu konuda yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İdarî kurul, makam veya kamu görevlileri, ancak ilgili kamu kurum ve kuruluşunun görev alanına giren yerlerde işlenen kabahatler dolayısıyla idarî yaptırım kararı vermeye yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>4.12.2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun yer bakımından yetki kuralları kabahatler açısından da geçerlidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Cumhuriyet savcısının karar verme yetkisi">
        <mvz-fıkra no="1">
          <template>Cumhuriyet savcısı, kanunda açıkça hüküm bulunan hallerde bir kabahat dolayısıyla idarî yaptırım kararı vermeye yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir suç dolayısıyla başlatılan soruşturma kapsamında bir kabahatin işlendiğini öğrenmesi halinde Cumhuriyet savcısı durumu ilgili kamu kurum ve kuruluşuna bildirebileceği gibi, kendisi de idarî yaptırım kararı verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Soruşturma konusu fiilin kabahat oluşturduğunun anlaşılması halinde Cumhuriyet savcısı bu nedenle idarî yaptırım kararı verir. Ancak, bunun için ilgili kamu kurum ve kuruluşu tarafından idarî yaptırım kararı verilmemiş olması gerekir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="Mahkemenin karar verme yetkisi">
        <mvz-fıkra no="1">
          <template>Kovuşturma konusu fiilin kabahat oluşturduğunun anlaşılması halinde mahkeme tarafından idarî yaptırım kararı verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="İdarî yaptırım kararı">
        <mvz-fıkra no="1">
          <template>İdarî yaptırım kararına ilişkin tutanakta;</template>
          <mvz-bent no="a">
            <template>Hakkında idarî yaptırım kararı verilen kişinin kimlik ve adresi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İdarî yaptırım kararı verilmesini gerektiren kabahat fiili,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bu fiilin işlendiğini ispata yarayacak bütün deliller,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Karar tarihi ve kararı veren kamu görevlilerinin kimliği,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Açık bir şekilde yazılır. Tutanakta, ayrıca kabahati oluşturan fiil, işlendiği yer ve zaman gösterilerek açıklanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Kararların tebliği">
        <mvz-fıkra no="1">
          <template>İdarî yaptırım kararı, 11.2.1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümlerine göre ilgili kişiye tebliğ edilir. Tebligat metninde bu karara karşı başvurulabilecek kanun yolu, mercii ve süresi açık bir şekilde belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İdarî yaptırım kararının ilgili gerçek kişinin huzurunda verilmesi halinde tutanakta bu husus açıkça belirtilir. Bu karara karşı başvurabileceği kanun yolu, mercii ve süresine ilişkin olarak bilgilendirildikten sonra kişinin karar tutanağını imzalaması istenir. İmzadan kaçınılması halinde bu durum tutanakta açıkça belirtilir. Karar tutanağının bir örneği kişiye verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tüzel kişi hakkında verilen idarî yaptırım kararları her halde ilgili tüzel kişiye tebliğ edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İdari yaptırım kararları, Maliye Bakanlığı ile idari yaptırım kararı verenler arasında yapılacak protokoller çerçevesinde, kararı verenler adına 213 sayılı Kanunun 107/A maddesi hükümlerine göre kurulan teknik altyapı kullanılmak suretiyle Maliye Bakanlığı tarafından elektronik ortamda tebliğ edilebilir. Elektronik ortamda yapılan tebligat, muhatabın elektronik adresine ulaştığı tarihi izleyen beşinci günün sonunda yapılmış sayılır. Bu şekilde yapılan tebligatlar, birinci fıkra kapsamındaki tebliğ yerine geçer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Başvuru yolu">
        <mvz-fıkra no="1">
          <template>İdarî para cezası ve mülkiyetin kamuya geçirilmesine ilişkin idarî yaptırım kararına karşı, kararın tebliği veya tefhimi tarihinden itibaren en geç onbeş gün içinde, sulh ceza mahkemesine başvurulabilir. Bu süre içinde başvurunun yapılmamış olması halinde idarî yaptırım kararı kesinleşir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mücbir sebebin varlığı dolayısıyla bu sürenin geçirilmiş olması halinde bu sebebin ortadan kalktığı tarihten itibaren en geç yedi gün içinde karara karşı başvuruda bulunulabilir. Bu başvuru, kararın kesinleşmesini engellemez; ancak, mahkeme yerine getirmeyi durdurabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Başvuru, bizzat kanunî temsilci veya avukat tarafından sulh ceza mahkemesine verilecek bir dilekçe ile yapılır. Başvuru dilekçesi, iki nüsha olarak verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Başvuru dilekçesinde, idarî yaptırım kararına ilişkin bilgiler, bu karara karşı ileri sürülen deliller açık bir şekilde gösterilir. Dilekçede ayrıca, başvurunun süresinde yapılmasını engelleyen mücbir sebep dayanaklarıyla gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İdarî yaptırım kararının mahkeme tarafından verilmesi halinde, bu karara karşı ancak itiraz yoluna gidilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Soruşturma konusu fiilin suç değil de kabahat oluşturduğu gerekçesiyle idarî yaptırım kararı verilmesi halinde; kovuşturmaya yer olmadığı kararına itiraz edildiği takdirde, idarî yaptırım kararına karşı başvuru da bu itiraz merciinde incelenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kovuşturma konusu fiilin suç değil de kabahat oluşturduğu gerekçesiyle idarî yaptırım kararı verilmesi halinde; fiilin suç oluşturmaması nedeniyle verilen beraat kararına karşı kanun yoluna gidildiği takdirde, idarî yaptırım kararına karşı itiraz da bu kanun yolu merciinde incelenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>İdarî yaptırım kararının verildiği işlem kapsamında aynı kişi ile ilgili olarak idarî yargının görev alanına giren kararların da verilmiş olması halinde; idarî yaptırım kararına ilişkin hukuka aykırılık iddiaları bu işlemin iptali talebiyle birlikte idarî yargı merciinde görülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="Başvurunun incelenmesi">
        <mvz-fıkra no="1">
          <template>Başvuru üzerine mahkemece yapılan ön inceleme sonucunda;</template>
          <mvz-bent no="a">
            <template>Yetkili olmadığının anlaşılması halinde dosyanın yetkili sulh ceza mahkemesine gönderilmesine,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başvurunun süresi içinde yapılmadığının, başvuru konusu idarî yaptırım kararının sulh ceza mahkemesinde incelenebilecek kararlardan olmadığının veya başvuranın buna hakkı bulunmadığının anlaşılması halinde, bu nedenlerle başvurunun reddine,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>(a) ve (b) bentlerinde sayılan nedenlerin bulunmaması halinde başvurunun usulden kabulüne,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başvurunun usulden kabulü halinde mahkeme dilekçenin bir örneğini ilgili kamu kurum ve kuruluşuna tebliğ eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlgili kamu kurum ve kuruluşu, başvuru dilekçesinin tebliği tarihinden itibaren en geç onbeş gün içinde mahkemeye cevap verir. Başvuru konusu idarî yaptırıma ilişkin işlem dosyasının tamamının bir örneği, cevap dilekçesi ile birlikte mahkemeye verilir. Mahkeme, işlem dosyasının aslını da ilgili kamu kurum ve kuruluşundan isteyebilir. Cevap dilekçesi, idarî yaptırım kararına karşı başvuruda bulunan kişi sayısından bir fazla nüsha olarak verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mahkeme, başvuruda bulunan kişilere cevap dilekçesinin bir örneğini tebliğ eder; talep üzerine veya re'sen tarafları çağırarak belli bir gün ve saatte dinleyebilir. Dinleme için belirlenen günle tebligatın yapılacağı gün arasında en az bir haftalık zaman olmasına dikkat edilir. Dinleme sırasında taraflar veya avukatları hazır bulunur. Mazeretsiz olarak hazır bulunmama, yokluklarında karar verilmesine engel değildir. Bu husus, tebligat yazısında açıkça belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Ceza Muhakemesi Kanununun tanıklığa, bilirkişi incelemesine ve keşfe ilişkin hükümleri, bu başvuru ile ilgili olarak da uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Dinlemede sırasıyla; hazır bulunan başvuru sahibi ve avukatı, ilgili kamu kurum ve kuruluşunun temsilcisi, varsa tanıklar dinlenir, bilirkişi raporu okunur, diğer deliller ortaya konulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Mahkeme, ilgilileri dinledikten ve bütün delilleri ortaya koyduktan sonra aleyhinde idarî yaptırım kararı verilen ve hazır bulunan tarafa son sözünü sorar. Son söz hakkı, aleyhinde idarî yaptırım kararı verilen tarafın kanunî temsilcisi veya avukatı tarafından da kullanılabilir. Mahkeme son kararını hazır bulunan tarafların huzurunda açıklar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Mahkeme, son karar olarak idarî yaptırım kararının;</template>
          <mvz-bent no="a">
            <template>Hukuka uygun olması nedeniyle, "başvurunun reddine",</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Hukuka aykırı olması nedeniyle, "idarî yaptırım kararının kaldırılmasına",</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>İdarî para cezasının alt ve üst sınırının kanunda gösterildiği kabahatler dolayısıyla verilmiş idarî para cezasına karşı başvuruda bulunulması halinde, mahkeme idarî para cezasının miktarında değişiklik yaparak da başvurunun kabulüne karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Onbeşbin Türk Lirası dahil idarî para cezalarına karşı başvuru üzerine verilen kararlar kesindir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="İtiraz yolu">
        <mvz-fıkra no="1">
          <template>Mahkemenin verdiği son karara karşı, Ceza Muhakemesi Kanununa göre itiraz edilebilir. Bu itiraz, kararın tebliği tarihten itibaren en geç iki hafta içinde yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İtirazla ilgili karar, dosya üzerinden inceleme yapılarak verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme, her bir itirazla ilgili olarak “itirazın kabulüne” veya “itirazın reddine” karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mahkemenin verdiği karar taraflara tebliğ edilir. Vekil olarak avukatla temsil edilme halinde ayrıca taraflara tebligat yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İdarî yaptırım kararının ağır ceza mahkemesi tarafından verilmesi halinde bu karara karşı Ceza Muhakemesi Kanununa göre itiraz edilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="Vazgeçme ve kabul">
        <mvz-fıkra no="1">
          <template>Kanun yoluna başvuran kişi, bu konuda karar verilinceye kadar başvurusundan vazgeçebilir. Vazgeçme halinde bir daha aynı konuda başvuruda bulunulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İlgili kamu kurum ve kuruluşu da mahkeme tarafından karar verilinceye kadar kanun yolu başvurusunu kabul ederek idarî yaptırım kararını geri alabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="Masrafların ve vekalet ücretinin ödenmesi">
        <mvz-fıkra no="1">
          <template>İdarî yaptırım kararına karşı başvuru yolu harca tâbi değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanun yoluna başvuru dolayısıyla oluşan bütün masraflar ve vekalet ücreti, başvurusu veya savunması reddedilen tarafça ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Çeşitli Kabahatler">
    <mvz-madde no="32" başlık="Emre aykırı davranış">
      <mvz-fıkra no="1">
        <template>Yetkili makamlar tarafından adlî işlemler nedeniyle ya da kamu güvenliği, kamu düzeni veya genel sağlığın korunması amacıyla, hukuka uygun olarak verilen emre aykırı hareket eden kişiye yüz Türk Lirası idarî para cezası verilir. Bu cezaya emri veren makam tarafından karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde, ancak ilgili kanunda açıkça hüküm bulunan hallerde uygulanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>1.3.1926 tarihli ve 765 sayılı Türk Ceza Kanununun 526 ncı maddesine diğer kanunlarda yapılan yollamalar, bu maddeye yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="Dilencilik">
      <mvz-fıkra no="1">
        <template>Dilencilik yapan kişiye, elli Türk Lirası idarî para cezası verilir. Ayrıca, dilencilikten elde edilen gelire elkonularak mülkiyetin kamuya geçirilmesine karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kabahat dolayısıyla idarî para cezasına ve elkoymaya kolluk veya belediye zabıta görevlileri, mülkiyetin kamuya geçirilmesine mülkî amir veya belediye encümeni karar verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="34" başlık="Kumar">
      <mvz-fıkra no="1">
        <template>Kumar oynayan kişiye, bin Türk Lirası idarî para cezası verilir. Ayrıca, kumardan elde edilen gelire elkonularak mülkiyetin kamuya geçirilmesine karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kabahat dolayısıyla idarî para cezasına ve elkoymaya kolluk görevlileri, mülkiyetin kamuya geçirilmesine mülkî amir karar verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Sarhoşluk">
      <mvz-fıkra no="1">
        <template>Sarhoş olarak başkalarının huzur ve sükununu bozacak şekilde davranışlarda bulunan kişiye, kolluk görevlileri tarafından elli Türk Lirası idarî para cezası verilir. Kişi, ayrıca sarhoşluğun etkisi geçinceye kadar kontrol altında tutulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Gürültü">
      <mvz-fıkra no="1">
        <template>Başkalarının huzur ve sükununu bozacak şekilde gürültüye neden olan kişiye, elli Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu fiilin bir ticarî işletmenin faaliyeti çerçevesinde işlenmesi halinde işletme sahibi gerçek veya tüzel kişiye bin Türk Lirasından beşbin Türk Lirasına kadar idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu kabahat dolayısıyla idarî para cezasına kolluk veya belediye zabıta görevlileri karar verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Rahatsız etme">
      <mvz-fıkra no="1">
        <template>Mal veya hizmet satmak için başkalarını rahatsız eden kişi, elli Türk Lirası idarî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kabahat dolayısıyla idarî para cezası vermeye kolluk veya belediye zabıta görevlileri yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="38" başlık="İşgal">
      <mvz-fıkra no="1">
        <template>Yetkili makamların açık ve yazılı izni olmaksızın meydan, cadde, sokak veya yayaların gelip geçtiği kaldırımları işgal eden veya buralarda mal satışa arz eden kişiye, belediye zabıta görevlileri tarafından elli Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yetkili makamların açık ve yazılı izni olmaksızın meydan, cadde, sokak veya yayaların gelip geçtiği kaldırımlar üzerine inşaat malzemesi yığan kişiye, belediye zabıta görevlileri tarafından yüz Türk Lirasından beşyüz Türk Lirasına kadar idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Özel kanunlardaki hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="39" başlık="Tütün mamullerinin tüketilmesi">
      <mvz-fıkra no="1">
        <template>Kamu hizmet binalarının kapalı alanlarında tütün mamulü tüketen kişiye, ilgili idarî birim amirinin yetkili kıldığı kamu görevlileri tarafından elli Türk Lirası idarî para cezası verilir. Bu fıkra hükmü, tütün mamulü tüketilmesine tahsis edilen alanlarda uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu taşıma araçlarında tütün mamulü tüketen kişiye, elli Türk Lirası idarî para cezası verilir. Kabahatin özel hukuk kişileri tarafından işletilen toplu taşıma araçlarında işlenmesi halinde bu ceza ilk başvurulan kolluk birim yetkilileri tarafından verilir. Kamuya ait toplu taşıma araçlarında işlenmesi halinde idarî para cezası verme yetkisi bakımından birinci fıkra hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Özel hukuk kişilerine ait olan ve herkesin girebileceği binaların kapalı alanlarında, tütün mamullerinin tüketilemeyeceğini belirtir açık bir işarete yer verilmesine rağmen, bu yasağa aykırı hareket eden kişiye, elli Türk Lirası idarî para cezası verilir. Bu ceza, şikâyet üzerine en yakın kolluk birimi yetkililerince verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="40" başlık="Kimliği bildirmeme">
      <mvz-fıkra no="1">
        <template>Görevle bağlantılı olarak sorulması halinde kamu görevlisine kimliği veya adresiyle ilgili bilgi vermekten kaçınan veya gerçeğe aykırı beyanda bulunan kişiye, bu görevli tarafından elli Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Açıklamada bulunmaktan kaçınması veya gerçeğe aykırı beyanda bulunması dolayısıyla kimliği belirlenemeyen kişi tutularak durumdan derhal Cumhuriyet savcısı haberdar edilir. Bu kişi, kimliği açık bir şekilde anlaşılıncaya kadar gözaltına alınır ve gerekirse tutuklanır. Gözaltına ve tutuklamaya karar verme yetkisi ve usulü bakımından Ceza Muhakemesi Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kişinin kimliğinin belirlenmesi durumunda, bu nedenle gözaltına alınma veya tutuklanma haline derhal son verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41" başlık="Çevreyi kirletme">
      <mvz-fıkra no="1">
        <template>Evsel atık ve artıkları, bunların toplanmasına veya depolanmasına özgü yerler dışına atan kişiye, yirmi Türk Lirası idarî para cezası verilir. Bireysel atık ve artıkların atılması halinde de bu fıkra hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Fiilin yemek pişirme ve servis yerlerinde işlenmesi halinde işletme sahibi gerçek veya tüzel kişiye, beşyüz Türk Lirasından beşbin Türk Lirasına kadar idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hayvan kesimine tahsis edilen yerler dışında hayvan kesen veya kesilen hayvan atıklarını sokağa veya kamuya ait sair bir alana bırakan kişiye, elli Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İnşaat atık ve artıklarını bunların toplanmasına veya depolanmasına özgü yerler dışına atan kişiye, yüz Türk Lirasından üçbin Türk Lirasına kadar idarî para cezası verilir. İnşaat faaliyetinin bir tüzel kişi adına yürütülmesi halinde bu tüzel kişi hakkında verilecek idarî para cezasının üst sınırı beşbin Türk Lirasıdır. Bu atık ve artıkların kaldırılmasına ilişkin masraf da ayrıca kişiden tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kullanılamaz hale gelen veya ihtiyaç fazlası ev eşyasını bunların toplanmasına ilişkin olarak belirlenen günün dışında sokağa veya kamuya ait sair bir yere bırakan kişiye elli Türk Lirası idarî para cezası verilir. Bu eşyanın toplanması hususunda belediye tarafından belirli aralıklarla yılda üç günden az olmamak üzere belirlenen günler önceden uygun araçlarla ilân olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kullanılamaz hale gelen motorlu kara veya deniz nakil araçlarını ya da bunların mütemmim cüzlerini sokağa veya kamuya ait sair bir yere bırakan kişiye ikiyüzelli Türk Lirası idarî para cezası verilir. Bunların kaldırılmasına ilişkin masraf da kişiden ayrıca tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu kabahatler dolayısıyla idarî para cezasına belediye sınırları içerisinde belediye zabıta görevlileri, belediye sınırları dışında kolluk görevlileri karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu kabahatler dolayısıyla meydana gelen kirliliğin kişi tarafından derhal giderilmesi halinde idarî para cezasına karar verilmeyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Özel kanunlardaki hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Afiş asma">
      <mvz-fıkra no="1">
        <template>Meydanlara veya parklara, cadde veya sokak kenarlarındaki kamuya ait duvar veya alanlara, rızası olmaksızın özel kişilere ait alanlara bez, kâğıt ve benzeri afiş ve ilân asan kişiye, yüz Türk Lirasından üçbin Türk Lirasına kadar idarî para cezası verilir. Aynı içerikteki afiş ve ilânlar, tek fiil sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra hükmü, yetkili makamlardan alınan açık ve yazılı izne dayalı olarak asılan afiş ve ilânlar açısından uygulanmaz. Bu izinde, afiş ve ilânın asılacağı zaman dilimi açık bir şekilde gösterilir. Bu afiş ve ilânlar izin verilen gerçek veya tüzel kişi tarafından bu sürenin dolmasını müteakip derhal toplatılır. Toplatma yükümlülüğüne aykırı hareket edilmesi halinde birinci fıkra hükmüne göre idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu afiş ve ilânların kaldırılmasına ilişkin masraflar da ilgili kişilerden ayrıca tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu kabahatler dolayısıyla idarî para cezasına, kolluk veya belediye zabıta görevlileri karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Özel kanunlardaki hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42/A" başlık="Asılsız çağrı ve asılsız ihbar">
      <mvz-fıkra no="1">
        <template>112 Acil Çağrı Merkezini meşgul etmek amacıyla arayarak görevlilerle konuşan veya ısrarla çağrı bırakan kişiye, il valileri tarafından binbeşyüz Türk Lirası idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>112 Acil Çağrı Merkezine yapılan ihbarın asılsız olduğunun olay yerine giden ekiplerce tutanakla tespit edilmesi halinde kişiye, il valileri tarafından onbeşbin Türk Lirası idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddede yazılı fiillerin bir yıl içinde tekrarı halinde idari para cezası iki katı olarak uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="Silah taşıma">
      <mvz-fıkra no="1">
        <template>Yetkili makamlardan ruhsat almaksızın kanuna göre yasak olmayan silahları park, meydan, cadde veya sokaklarda görünür bir şekilde taşıyan kişiye, kolluk tarafından elli Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43/A" başlık="Tüzel kişilerin sorumluluğu">
      <mvz-fıkra no="1">
        <template>Daha ağır idarî para cezasını gerektiren bir kabahat oluşturmadığı hallerde, bir tüzel kişinin organ veya temsilcisi ya da organ veya temsilci olmamakla birlikte bu tüzel kişinin faaliyeti çerçevesinde görev üstlenen bir kişi tarafından;</template>
        <mvz-bent no="a">
          <template>5237 sayılı Türk Ceza Kanununun;</template>
          <mvz-altbent no="1">
            <template>157 nci ve 158 inci maddelerinde tanımlanan dolandırıcılık suçunun,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>188 inci maddesinde tanımlanan uyuşturucu veya uyarıcı madde imal ve ticareti suçunun,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>235 inci maddesinde tanımlanan ihaleye fesat karıştırma suçunun,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>236 ncı maddesinde tanımlanan edimin ifasına fesat karıştırma suçunun,</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>252 nci maddesinde tanımlanan rüşvet suçunun,</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>282 nci maddesinde tanımlanan suçtan kaynaklanan malvarlığı değerlerini aklama suçunun,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>19/10/2005 tarihli ve 5411 sayılı Bankacılık Kanununun 160 ıncı maddesinde tanımlanan zimmet suçunun,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>21/3/2007 tarihli ve 5607 sayılı Kaçakçılıkla Mücadele Kanununda tanımlanan kaçakçılık suçlarının,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>4/12/2003 tarihli ve 5015 sayılı Petrol Piyasası Kanununun Ek 5 inci maddesinde tanımlanan suçun,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>7/2/2013 tarihli ve 6415 sayılı Terörizmin Finansmanının Önlenmesi Hakkında Kanunun 4 üncü maddesinde tanımlanan terörizmin finansmanı suçunun,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>tüzel kişinin yararına olarak işlenmesi halinde, ayrıca bu tüzel kişiye onbin Türk Lirasından elli milyon Türk Lirasına kadar idarî para cezası verilir.  Ancak idari para cezası, işleme veya eyleme konu menfaatin iki katından az olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde hükümlerine göre idari para cezasına karar vermeye, birinci fıkrada sayılan suçlardan dolayı yargılama yapmakla görevli mahkeme yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3" durum="iptal">
        <template></template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43/B" başlık="Tüzel kişilerin bildirim yükümlülüğü">
      <mvz-fıkra no="1">
        <template>5411 sayılı Kanunun 3 üncü maddesinde tanımlanan; bankalara, finansal kuruluşlara veya paranın sayım ve incelemesini yaparak bankalara destek hizmeti veren kuruluşlar ile mevzuat çerçevesinde dövize ilişkin işlemler yapmasına izin verilen şirketlere, her ne amaçla olursa olsun ibraz edilen paranın sahte olduğunun anlaşılması halinde, 5237 sayılı Kanunun 278 inci maddesinde düzenlenen bildirim yükümlülüğü yerine getirilmediği takdirde, bu maddede sayılan tüzel kişilere Cumhuriyet savcısı tarafından bin Türk Lirasından beşbin Türk Lirasına kadar idarî para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>4.1.1961 tarihli ve 213 sayılı Vergi Usul Kanununda yer alan vergi mahkemelerinin görevine ilişkin hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunda ve 1 Haziran 2005 tarihinden sonra yürürlüğe giren diğer kanunlardaki idarî para cezaları ile ilgili olarak geçen "Türk Lirası" ibaresi karşılığında, uygulamada, 28.1.2004 tarihli ve 5083 sayılı Türkiye Cumhuriyeti Devletinin Para Birimi Hakkında Kanun hükümlerine göre ülkede tedavülde bulunan para "Yeni Türk Lirası" olarak adlandırıldığı sürece bu ibare kullanılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümleri, yürürlüğe girdiği tarih itibarıyla idare mahkemelerinde dava açılarak iptali istenen idarî yaptırım kararları hakkında uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Daha önce verilmiş olan idarî para cezasına ilişkin kararlara karşı henüz iptal davası açılmamış olmakla birlikte dava açma süresinin geçmemiş olması halinde, bu Kanunun yürürlüğe girdiği tarihten itibaren onbeş gün içinde 27 nci madde hükümlerine göre sulh ceza mahkemesine başvuruda bulunulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun 1 Haziran 2005 tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="45" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
