  <mvz-künye tür="kanun" no="2699" başlık="UMUMİ MAĞAZALAR KANUNU"
             tarih="11/8/1982" rgazete-tarih="13/7/1982" rgazete-sayı="17781"
             düstur-tertip="5" düstur-cilt="21" düstur-sayfa="391" />
    
  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç ve Tanımlar">
      <mvz-madde no="1" başlık="Amaç">
        <mvz-fıkra no="1">
          <template>Makbuz ve rehin senedi verme karşılığında serbest, gümrüklenmemiş veya tekel altında bulunan malları vedia olarak kabul etmek ve mudilerine de bu senetlerle tevdi olunan malları satabilmek veya terhin edebilmek imkanını vermek üzere faaliyette bulunan umumi mağazaların kurulma, çalışma ve denetleme usul ve esaslarını düzenlemektir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Tanımlar">
        <mvz-fıkra no="1">
          <template>Bu Kanunda geçen,</template>
          <mvz-bent no="a">
            <template>“Makbuz senedi (resepise)” Umumi mağazalara tevdi edilen malların mülkiyetini temsil eden belgeyi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>“Rehin senedi (varant)” Umumi mağazalara tevdi edilen malların terhinini temin eden belgeyi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>“Serbest Mal” Milli mahsul ve mamullerle fiili ithali yapılmış eşyayı,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>“Gümrüklenmemiş mal (eşya)” Gümrük Kanunu ve mevzuatı gereğince gümrük denetimine tabi tutulmamış eşyayı,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>İfade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Kurulma Usul ve Esasları">
      <mvz-madde no="3" başlık="Kurulma usul ve esasları">
        <mvz-fıkra no="1">
          <template>Umumi mağazalar, memleketin genel ekonomik şartları gözönünde bulundurularak Ticaret Bakanlığınca verilecek izinle anonim şirket şeklinde kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu şekilde faaliyette bulunacak şirketlerin unvanlarında umumi mağazalar teriminin bulunması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Umumi mağazaların şube açması da Ticaret Bakanlığının iznine bağlıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Umumi mağazaların kurulabilmesi için, Türk Ticaret Kanunundaki anonim şirketlerin kuruluşuyla ilgili hükümleri saklı kalmak kaydıyla;</template>
          <mvz-bent no="a">
            <template>Ödenmiş sermaye miktarının en az 50 000 000 (elli milyon) lira olması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yönetmelikte belirtilecek belgelerin ibraz edilmesi de,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Ödenmiş sermaye miktarı Cumhurbaşkanı kararıyla üç katına kadar artırılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Çalışma, Denetim, Ceza Usul ve Esasları">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Çalışma Usul ve Esasları">
      <mvz-madde no="4" başlık="Gümrüklenmemiş veya tekel altında bulunan malların durumu">
        <mvz-fıkra no="1">
          <template>Gümrüklenmemiş veya tekel altında bulunan malların umumi mağazalara kabul edilmesi Gümrük ve Tekel Bakanlığının iznine bağlıdır. Bu mallar hakkında 1615 sayılı Gümrük Kanununun antrepo ve transit rejimi uygulanır. İznin verilmesinde aranılacak şartlar yönetmelikte gösterilir. Bu izin ticaret siciline tescil ve Türkiye Ticaret Sicili Gazetesi ile ilan olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Bakanlık temsilcileri">
        <mvz-fıkra no="1">
          <template>Umum mağazaların denetim kurullarında Ticaret Bakanlığınca atanacak bir temsilci bulundurulabilir. Bu temsilciler hakkında Türk Ticaret Kanununun 275 inci maddesinin 2 nci ve 3 üncü fıkraları hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Umumi mağazaların haiz olacağı teknik şartlar">
        <mvz-fıkra no="1">
          <template>Umumi mağazaların haiz olması gereken teknik şartlar yönetmelikte belirtilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Kefalet akçesi">
        <mvz-fıkra no="1">
          <template>Umumi mağaza işletenler yapacakları işlerin önem ve genişliğine göre 2 000 000 (iki milyon) ila 10 000 000 (on milyon) lira arasında bir kefalet akçesi vermekle yükümlüdürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu miktar Cumhurbaşkanınca üç katına kadar artırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yatırılacak kefalet akçesinin miktarı Ticaret Bakanlığınca tespit olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kefalet akçesi, Türk parası, devlet tahvilleri, milli bankalardan verilmiş teminat mektupları, borsada kote edilmiş % 15 (yüzde onbeş) eksiği ile nazara alınacak milli esham veya tahvilat olabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kefalet akçesinin eksilen miktarı tamamlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>İşletmeden vazgeçilen veya Ticaret Bakanlığınca izinleri iptal edilen umumi mağazaların bütün taahhütlerini yerine getirdikleri ispat edilmedikçe kefalet akçeleri geri verilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kefalet akçesinin miktarının tespit esasları ve muhafaza şekli yönetmelikte gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Ücret tarifeleri">
        <mvz-fıkra no="1">
          <template>Umumi mağaza işletenler tarafından mağaza işletmeye açılmadan önce, eşyanın yükleme ve boşaltılması, mağazaya, alınması, muhafazası, ambalajlarının onarılması, tartılması, kıymet biçilmesi ve mağazadan çıkarılması gibi hizmetler için alınacak ücretleri gösteren tarifeler yapılır. Bu tarifeler Türkiye Ticaret, Sanayi, Deniz Ticaret Odaları ve Ticaret Borsaları Birliğinin görüşü alınarak Ticaret Bakanlığınca onaylandıktan sonra ve Türkiye Ticaret Sicili Gazetesi ile, işletmeye açılacak mağazaların bulunduğu yerlerdeki en az bir gazetede ilan olunduğu tarihten itibaren yürürlüğe girer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tarifelerde değişiklikler yukarıdaki şekle göre yapılır ve ilan olunur. Ancak bu değişiklik ücretlerin yükseltilmesi için yapılmış olursa ilan tarihinden itibaren bir ay sonra uygulamaya konulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Yasak faaliyetler">
        <mvz-fıkra no="1">
          <template>Umumi mağazalar, tevdi olunan mallar üzerinde, gerek kendi gerekse başkaları adına veya hesabına doğrudan veya dolaylı olarak ticaret yapamazlar, malların niteliklerini değiştirecek herhangi bir işlemde bulunamazlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Makbuz ve rehin senedi defteri">
        <mvz-fıkra no="1">
          <template>Umumi mağazalar noterden tasdikli biri makbuz senedi ve diğeri rehin senedi defteri olmak üzere iki defter tutmak zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu defterlerin tutulma şekli yönetmelikte gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kanun ve yönetmeliğe uygun olarak tutulmayan defterler için yönetim kurulu ve görevliler hakkında Türk Ticaret Kanununun 67 nci maddesi uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Denetim Usul ve Esasları">
      <mvz-madde no="11" başlık="Teftiş ve denetim">
        <mvz-fıkra no="1">
          <template>Umumi mağazalar Ticaret Bakanlığının teftiş ve denetimi altındadır. Ticaret Bakanlığınca gerek görüldüğünde bu yerler ve işlemleri her zaman teftiş edilebilir ve denetlenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gümrüklenmemiş veya tekel altında bulunan mallar üzerinde Gümrük ve Tekel Bakanlığının teftiş ve denetim hakkı saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="İznin iptali">
        <mvz-fıkra no="1">
          <template>Bu Kanuna aykırı faaliyet gösterdiği tespit edilen Umumi mağazaların, Ticaret Bakanlığınca yapılacak tebligata rağmen bir ay içinde mevzuata uymadıklarının veya Kanunun 9 uncu maddesine aykırı hareket ettiklerinin belirlenmesi halinde, kanunun 3 üncü maddesine istinaden verilmiş bulunan izinleri iptal edilerek, keyfiyet ticaret siciline tescil ve Türkiye Ticaret Sicili Gazetesin’de ilan edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İzinleri iptal edilen umumi mağazaların yönetim kurulu üyeleri ile denetçileri, İptal tarihinden itibaren beş yıl geçmedikçe umumi mağazacılıkla uğraşan anonim şirketlerde ortak olamazlar ve bu konuda kurulmuş olan şirketlerin yönetim ve denetim kurullarında ve idari işlerinde görev alamazlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Ceza İşleri">
      <mvz-madde no="13" başlık="Ceza hükümleri">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 8 inci maddesine göre düzenlenen tarifelerin dışında ücret alan veya 9 uncu maddesine aykırı harekette bulunan şirket yöneticilerine veya temsilcilerine veyahut yetkili görevlilere üç aydan bir yıla kadar hapis ve ikiyüz günden az olmamak üzere adlî para cezası verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunun 12 nci maddesinin ikinci fıkrasına aykırı harekette bulunan şirket yöneticilerine veya temsilcilerine veyahut yetkili görevlilere bir yıldan üç yıla kadar hapis ve beşyüz günden üçbin güne kadar adlî para cezası verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ticaret Bakanlığının izni alınmadan umumi mağaza veya şube açarak makbuz senedi veya rehin senedi tanzim eden veya izinleri iptal edilmesine rağmen faaliyete devam eden şirket yöneticilerine veya temsilcilerine veyahut yetkili görevlilere bir yıldan üç yıla kadar hapis ve beşyüz günden beşbin güne kadar adlî para cezası verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Çeşitli Hükümler">
    <mvz-madde no="14" başlık="Son hükümler">
      <mvz-fıkra no="1">
        <template>Bu Kanunda belirtilmeyen hususlar için 6762 sayılı Türk Ticaret Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Umumi mağazaların kuruluş ve faaliyet esasları, kabul edilecek malların cinsleri gümrüklenmemiş malların kabul şartları, mallar üzerinde gümrük denetlemesi ve icra tarzı, umumi mağazaların denetim usul ve esasları ile bu Kanunun uygulanmasıyla ilgili diğer hususlar, Cumhurbaşkanınca çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Evvelce kurulmuş bulunan umumi mağazalar bu Kanuna göre hazırlanacak tüzüğün yürürlüğe girdiği tarihten itibaren bir yıl içinde bu Kanun ve tüzük hükümlerine intibak etmedikleri takdirde, umumi mağaza olarak bunlara verilen izin yeni bir karara gerek kalmadan iptal edilmiş sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümleri yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
