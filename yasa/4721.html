<mvz-künye tür="kanun" no="4721" başlık="TÜRK MEDENİ KANUNU"
           tarih="22/11/2001" rgazete-tarih="8/12/2001" rgazete-sayı="24607"
           düstur-tertip="5" düstur-cilt="41" />

<mvz-giriş başlık="BAŞLANGIÇ">
  <mvz-b1 no="A" başlık="Hukukun uygulanması ve kaynakları">
    <mvz-madde no="1" başlık="">
      <mvz-fıkra no="1">
        <template>Kanun, sözüyle ve özüyle değindiği bütün konularda uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kanunda uygulanabilir bir hüküm yoksa, hâkim, örf ve âdet hukukuna göre, bu da yoksa kendisi kanun koyucu olsaydı nasıl bir kural koyacak idiyse ona göre karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hâkim, karar verirken bilimsel görüşlerden ve yargı kararlarından yararlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-b1>
  <mvz-b1 no="B" başlık="Hukukî ilişkilerin kapsamı">
    <mvz-b2 no="I" başlık="Dürüst davranma">
      <mvz-madde no="2" başlık="">
        <mvz-fıkra no="1">
          <template>Herkes, haklarını kullanırken ve borçlarını yerine getirirken dürüstlük kurallarına uymak zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir hakkın açıkça kötüye kullanılmasını hukuk düzeni korumaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="II" başlık="İyiniyet">
      <mvz-madde no="3" başlık="">
        <mvz-fıkra no="1">
          <template>Kanunun iyiniyete hukukî bir sonuç bağladığı durumlarda, asıl olan iyiniyetin varlığıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, durumun gereklerine göre kendisinden beklenen özeni göstermeyen kimse iyiniyet iddiasında bulunamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="III" başlık="Hâkimin takdir yetkisi">
      <mvz-madde no="4" başlık="">
        <mvz-fıkra no="1">
          <template>Kanunun takdir yetkisi tanıdığı veya durumun gereklerini ya da haklı sebepleri göz önünde tutmayı emrettiği konularda hâkim, hukuka ve hakkaniyete göre karar verir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
  </mvz-b1>
  <mvz-b1 no="C" başlık="Genel nitelikli hükümler">
    <mvz-madde no="5" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanun ve Borçlar Kanununun genel nitelikli hükümleri, uygun düştüğü ölçüde tüm özel hukuk ilişkilerine uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-b1>
  <mvz-b1 no="D" başlık="İspat kuralları">
    <mvz-b2 no="I" başlık="İspat yükü">
      <mvz-madde no="6" başlık="">
        <mvz-fıkra no="1">
          <template>Kanunda aksine bir hüküm bulunmadıkça, taraflardan her biri, hakkını dayandırdığı olguların varlığını ispatla yükümlüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
    <mvz-b2 no="II" başlık="Resmî belgelerle ispat">
      <mvz-madde no="7" başlık="">
        <mvz-fıkra no="1">
          <template>Resmî sicil ve senetler, belgeledikleri olguların doğruluğuna kanıt oluşturur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bunların içeriğinin doğru olmadığının ispatı, kanunlarda başka bir hüküm bulunmadıkça, her hangi bir şekle bağlı değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b2>
  </mvz-b1>
</mvz-giriş>
  
  <mvz-kitap no="1-BİRİNCİ" başlık="KİŞİLER HUKUKU">
    <mvz-kısım no="1-BİRİNCİ" başlık="GERÇEK KİŞİLER">
      <mvz-bölüm no="1-BİRİNCİ" başlık="KİŞİLİK">
        <mvz-b1 no="A" başlık="Genel olarak">
          <mvz-b2 no="I" başlık="Hak ehliyeti">
            <mvz-madde no="8" başlık="">
              <mvz-fıkra no="1">
                <template>Her insanın hak ehliyeti vardır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Buna göre bütün insanlar, hukuk düzeninin sınırları içinde, haklara ve borçlara ehil olmada eşittirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Fiil ehliyeti">
            <mvz-b3 no="1" başlık="Kapsamı">
              <mvz-madde no="9" başlık="">
                <mvz-fıkra no="1">
                  <template>Fiil ehliyetine sahip olan kimse, kendi fiilleriyle hak edinebilir ve borç altına girebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Koşulları">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="10" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ayırt etme gücüne sahip ve kısıtlı olmayan her ergin kişinin fiil ehliyeti vardır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Erginlik">
                <mvz-madde no="11" başlık="">
                  <mvz-fıkra no="1">
                    <template>Erginlik onsekiz yaşın doldurulmasıyla başlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Evlenme kişiyi ergin kılar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Ergin kılınma">
                <mvz-madde no="12" başlık="">
                  <mvz-fıkra no="1">
                    <template>Onbeş yaşını dolduran küçük, kendi isteği ve velisinin rızasıyla mahkemece ergin kılınabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Ayırt etme gücü">
                <mvz-madde no="13" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yaşının küçüklüğü yüzünden veya akıl hastalığı, akıl zayıflığı, sarhoşluk ya da bunlara benzer sebeplerden biriyle akla uygun biçimde davranma yeteneğinden yoksun olmayan herkes, bu Kanuna göre ayırt etme gücüne sahiptir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Fiil ehliyetsizliği">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="14" başlık="">
                <mvz-fıkra no="1">
                  <template>Ayırt etme gücü bulunmayanların, küçüklerin ve kısıtlıların fiil ehliyeti yoktur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Ayırt etme gücünün bulunmaması">
              <mvz-madde no="15" başlık="">
                <mvz-fıkra no="1">
                  <template>Kanunda gösterilen ayrık durumlar saklı kalmak üzere, ayırt etme gücü bulunmayan kimsenin fiilleri hukukî sonuç doğurmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Ayırt etme gücüne sahip küçükler ve kısıtlılar">
              <mvz-madde no="16" başlık="">
                <mvz-fıkra no="1">
                  <template>Ayırt etme gücüne sahip küçükler ve kısıtlılar, yasal temsilcilerinin rızası olmadıkça, kendi işlemleriyle borç altına giremezler. Karşılıksız kazanmada ve kişiye sıkı sıkıya bağlı hakları kullanmada bu rıza gerekli değildir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ayırt etme gücüne sahip küçükler ve kısıtlılar haksız fiillerinden sorumludurlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Hısımlık">
            <mvz-b3 no="1" başlık="Kan hısımlığı">
              <mvz-madde no="17" başlık="">
                <mvz-fıkra no="1">
                  <template>Kan hısımlığının derecesi, hısımları birbirine bağlayan doğum sayısıyla belli olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Biri diğerinden gelen kişiler arasında üstsoy-altsoy hısımlığı; biri diğerinden gelmeyip de, ortak bir kökten gelen kişiler arasında yansoy hısımlığı vardır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Kayın hısımlığı">
              <mvz-madde no="18" başlık="">
                <mvz-fıkra no="1">
                  <template>Eşlerden biri ile diğer eşin kan hısımları, aynı tür ve dereceden kayın hısımları olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kayın hısımlığı, kendisini meydana getiren evliliğin sona ermesiyle ortadan kalkmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Yerleşim yeri">
            <mvz-b3 no="1" başlık="Tanım">
              <mvz-madde no="19" başlık="">
                <mvz-fıkra no="1">
                  <template>Yerleşim yeri bir kimsenin sürekli kalma niyetiyle oturduğu yerdir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bir kimsenin aynı zamanda birden çok yerleşim yeri olamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bu kural ticarî ve sınaî kuruluşlar hakkında uygulanmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yerleşim yerinin değiştirilmesi ve oturma yeri">
              <mvz-madde no="20" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir yerleşim yerinin değiştirilmesi yenisinin edinilmesine bağlıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Önceki yerleşim yeri belli olmayan veya yabancı ülkedeki yerleşim yerini bıraktığı hâlde Türkiye'de henüz bir yerleşim yeri edinmemiş olan kimsenin hâlen oturduğu yer, yerleşim yeri sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Yasal yerleşim yeri">
              <mvz-madde no="21" başlık="">
                <mvz-fıkra no="1">
                  <template>Velâyet altında bulunan çocuğun yerleşim yeri, ana ve babasının; ana ve babanın ortak yerleşim yeri yoksa, çocuğun kendisine bırakıldığı ana veya babanın yerleşim yeridir. Diğer hâllerde çocuğun oturma yeri, onun yerleşim yeri sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vesayet altındaki kişilerin yerleşim yeri, bağlı oldukları vesayet makamının bulunduğu yerdir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Kurumlarda bulunma">
              <mvz-madde no="22" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir öğretim kurumuna devam etmek için bir yerde bulunma ya da eğitim, sağlık, bakım veya ceza kurumuna konulma, yeni yerleşim yeri edinme sonucunu doğurmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Kişiliğin korunması">
          <mvz-b2 no="I" başlık="Vazgeçme ve aşırı sınırlamaya karşı">
            <mvz-madde no="23" başlık="">
              <mvz-fıkra no="1">
                <template>Kimse, hak ve fiil ehliyetlerinden kısmen de olsa vazgeçemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kimse özgürlüklerinden vazgeçemez veya onları hukuka ya da ahlâka aykırı olarak sınırlayamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Yazılı rıza üzerine insan kökenli biyolojik maddelerin alınması, aşılanması ve nakli mümkündür. Ancak, biyolojik madde verme borcu altına girmiş olandan edimini yerine getirmesi istenemez; maddî ve manevî tazminat isteminde bulunulamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Saldırıya karşı">
            <mvz-b3 no="1" başlık="İlke">
              <mvz-madde no="24" başlık="">
                <mvz-fıkra no="1">
                  <template>Hukuka aykırı olarak kişilik hakkına saldırılan kimse, hâkimden, saldırıda bulunanlara karşı korunmasını isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kişilik hakkı zedelenen kimsenin rızası, daha üstün nitelikte özel veya kamusal yarar ya da kanunun verdiği yetkinin kullanılması sebeplerinden biriyle haklı kılınmadıkça, kişilik haklarına yapılan her saldırı hukuka aykırıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Davalar">
              <mvz-madde no="25" başlık="">
                <mvz-fıkra no="1">
                  <template>Davacı, hâkimden saldırı tehlikesinin önlenmesini, sürmekte olan saldırıya son verilmesini, sona ermiş olsa bile etkileri devam eden saldırının hukuka aykırılığının tespitini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Davacı bunlarla birlikte, düzeltmenin veya kararın üçüncü kişilere bildirilmesi ya da yayımlanması isteminde de bulunabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Davacının, maddî ve manevî tazminat istemleri ile hukuka aykırı saldırı dolayısıyla elde edilmiş olan kazancın vekâletsiz iş görme hükümlerine göre kendisine verilmesine ilişkin istemde bulunma hakkı saklıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Manevî tazminat istemi, karşı tarafça kabul edilmiş olmadıkça devredilemez; miras bırakan tarafından ileri sürülmüş olmadıkça mirasçılara geçmez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="5">
                  <template>Davacı, kişilik haklarının korunması için kendi yerleşim yeri veya davalının yerleşim yeri mahkemesinde dava açabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Ad üzerindeki hak">
            <mvz-b3 no="1" başlık="Adın korunması">
              <mvz-madde no="26" başlık="">
                <mvz-fıkra no="1">
                  <template>Adının kullanılması çekişmeli olan kişi, hakkının tespitini dava edebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Adı haksız olarak kullanılan kişi buna son verilmesini; haksız kullanan kusurlu ise ayrıca maddî zararının giderilmesini ve uğradığı haksızlığın niteliği gerektiriyorsa manevî tazminat ödenmesini isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Adın değiştirilmesi">
              <mvz-madde no="27" başlık="">
                <mvz-fıkra no="1">
                  <template>Adın değiştirilmesi, ancak haklı sebeplere dayanılarak hâkimden istenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Adın değiştirildiği nüfus siciline kayıt ve Basın İlan Kurumunun ilan portalında ilan olunur. Bu ilanda; hükmü veren mahkeme, kararın verildiği tarih, dosyanın esas ve karar numarası ile adının değiştirilmesine karar verilen kişinin nüfusa kayıtlı olduğu yer, doğum tarihi, ana ve baba adı, önceki adı ve soyadı, mahkeme kararıyla verilen yeni adı ve soyadı yer alır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ad değişmekle kişisel durum değişmez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Adın değiştirilmesinden zarar gören kimse, bunu öğrendiği günden başlayarak bir yıl içinde değiştirme kararının kaldırılmasını dava edebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Kişiliğin başlangıcı ve sonu">
          <mvz-b2 no="I" başlık="Doğum ve ölüm">
            <mvz-madde no="28" başlık="">
              <mvz-fıkra no="1">
                <template>Kişilik, çocuğun sağ olarak tamamıyla doğduğu anda başlar ve ölümle sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Çocuk hak ehliyetini, sağ doğmak koşuluyla, ana rahmine düştüğü andan başlayarak elde eder.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sağ olmanın ve ölümün ispatı">
            <mvz-b3 no="1" başlık="İspat yükü">
              <mvz-madde no="29" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir hakkın kullanılması için bir kimsenin sağ veya ölü olduğunu veya belirli bir zamanda ya da başka bir kimsenin ölümünde sağ bulunduğunu ileri süren kimse, iddiasını ispat etmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Birden fazla kişiden hangisinin önce veya sonra öldüğü ispat edilemezse, hepsi aynı anda ölmüş sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İspat araçları">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="30" başlık="">
                  <mvz-fıkra no="1">
                    <template>Doğum ve ölüm, nüfus sicilindeki kayıtlarla ispat olunur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Nüfus sicilinde bir kayıt yoksa veya bulunan kaydın doğru olmadığı anlaşılırsa, gerçek durum her türlü kanıtla ispat edilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Ölüm karinesi">
                <mvz-madde no="31" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir kimse, ölümüne kesin gözle bakılmayı gerektiren durumlar içinde kaybolursa, cesedi bulunamamış olsa bile gerçekten ölmüş sayılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Gaiplik kararı">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="32" başlık="">
                <mvz-fıkra no="1">
                  <template>Ölüm tehlikesi içinde kaybolan veya kendisinden uzun zamandan beri haber alınamayan bir kimsenin ölümü hakkında kuvvetli olasılık varsa, hakları bu ölüme bağlı olanların başvurusu üzerine mahkeme bu kişinin gaipliğine karar verebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yetkili mahkeme, kişinin Türkiye'deki son yerleşim yeri; eğer Türkiye'de hiç yerleşmemişse nüfus sicilinde kayıtlı olduğu yer; böyle bir kayıt da yoksa anasının veya babasının kayıtlı bulunduğu yer mahkemesidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yargılama usulü">
              <mvz-madde no="33" başlık="">
                <mvz-fıkra no="1">
                  <template>Gaiplik kararının istenebilmesi için, ölüm tehlikesinin üzerinden en az bir yıl veya son haber tarihinin üzerinden en az beş yıl geçmiş olması gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mahkeme, gaipliğine karar verilecek kişi hakkında bilgisi bulunan kimseleri, belirli bir sürede bilgi vermeleri için usulüne göre yapılan ilânla çağırır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bu süre, ilk ilânın yapıldığı günden başlayarak en az altı aydır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="İstemin düşmesi">
              <mvz-madde no="34" başlık="">
                <mvz-fıkra no="1">
                  <template>Gaipliğine karar verilecek kişi, ilân süresi dolmadan ortaya çıkar veya kendisinden haber alınırsa ya da öldüğü tarih tespit edilirse gaiplik istemi düşer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Hükmü">
              <mvz-madde no="35" başlık="">
                <mvz-fıkra no="1">
                  <template>İlândan sonuç alınamazsa, mahkeme gaipliğe karar verir ve ölüme bağlı haklar, aynen gaibin ölümü ispatlanmış gibi kullanılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Gaiplik kararı ölüm tehlikesinin gerçekleştiği veya son haberin alındığı günden başlayarak hüküm doğurur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="KİŞİSEL DURUM SİCİLİ">
        <mvz-b1 no="A" başlık="Genel olarak">
          <mvz-b2 no="I" başlık="Sicil">
            <mvz-madde no="36" başlık="">
              <mvz-fıkra no="1">
                <template>Kişisel durum, bu amaçla tutulan resmî sicille belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu sicilin tutulmasına ve zorunlu bildirimlerin yapılmasına ilişkin esaslar, ilgili kanunda gösterilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Görevliler">
            <mvz-madde no="37" başlık="">
              <mvz-fıkra no="1">
                <template>Kişisel durum sicili, Devletçe atanan memurlar tarafından tutulur. Sicil kayıtlarını tutmak ve örnek vermek bu memurların görevidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yabancı memleketlerdeki Türkiye temsilcilerine, Cumhurbaşkanlığının onayı ile nüfus memurluğu yetkisi verilebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Sorumluluk">
            <mvz-madde no="38" başlık="">
              <mvz-fıkra no="1">
                <template>Kişisel durum sicilinin tutulmasından doğan zararlar, kusurlu memura rücu edilmek kaydıyla, Devletçe tazmin edilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Tazminat ve rücu davaları, kişisel durum sicilinin tutulduğu yer mahkemesinde açılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Düzeltme">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="39" başlık="">
                <mvz-fıkra no="1">
                  <template>Mahkeme kararı olmadıkça, kişisel durum sicilinin hiçbir kaydında düzeltme yapılamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Cinsiyet değişikliğinde">
              <mvz-madde no="40" başlık="">
                <mvz-fıkra no="1">
                  <template>Cinsiyetini değiştirmek isteyen kimse, şahsen başvuruda bulunarak mahkemece cinsiyet değişikliğine izin verilmesini isteyebilir. Ancak, iznin verilebilmesi için, istem sahibinin onsekiz yaşını doldurmuş bulunması ve evli olmaması; ayrıca transseksüel yapıda olup, cinsiyet değişikliğinin ruh sağlığı açısından zorunluluğunu  bir eğitim ve araştırma hastanesinden alınacak resmî sağlık kurulu raporuyla belgelemesi şarttır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Verilen izne bağlı olarak amaç ve tıbbî yöntemlere uygun bir cinsiyet değiştirme ameliyatı gerçekleştirildiğinin resmî sağlık kurulu raporuyla doğrulanması hâlinde, mahkemece nüfus sicilinde gerekli düzeltmenin yapılmasına karar verilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Doğum kütüğü">
          <mvz-b2 no="I" başlık="Bildirme">
            <mvz-madde no="41" başlık="">
              <mvz-fıkra no="1">
                <template>Doğumlara ilişkin bildirimler ve kimliği bilinmeyen bulunmuş çocuklar hakkındaki işlemler ilgili kanun hükümlerine göre yapılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Doğum kütüğünde değişiklikler">
            <mvz-madde no="42" başlık="">
              <mvz-fıkra no="1">
                <template>Kişisel durumdaki değişiklikler, özellikle evlilik dışı bir çocuğun tanınması veya hâkimin babalığa karar vermesi, soybağının düzeltilmesi, evlât edinme ya da bulunmuş bir çocuğun soybağının belli olması, ilgili kanun hükümlerine göre kütüğe işlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Ölüm kütüğü">
          <mvz-b2 no="I" başlık="Ölümün bildirilmesi">
            <mvz-madde no="43" başlık="">
              <mvz-fıkra no="1">
                <template>Ölümlere ilişkin bildirimler ilgili kanun hükümlerine göre yapılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Cesedi bulunamayan kişi">
            <mvz-madde no="44" başlık="">
              <mvz-fıkra no="1">
                <template>Bir kimse, ölümüne kesin gözle bakılmayı gerektiren durumlar içinde ortadan kaybolursa cesedi bulunamamış olsa bile, o yerin en büyük mülkî amirinin emriyle kütüğe ölü kaydı düşürülür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bununla birlikte her ilgili, bu kişinin ölü veya sağ olduğunun mahkemece tespitini dava edebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Gaiplik kararı">
            <mvz-madde no="45" başlık="">
              <mvz-fıkra no="1">
                <template>Gaiplik kararı, hâkimin bildirmesi üzerine, ölüm kütüğüne kaydolunur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Değişikliklerin kütüğe geçirilmesi">
            <mvz-madde no="46" başlık="">
              <mvz-fıkra no="1">
                <template>Tescile esas olan bir bildirimin doğru olmadığının tespit edilmesi veya kime ait olduğu bilinmeyen cesedin kimliğinin belli olması ya da gaiplik kararının kaldırılması sebepleriyle zorunlu olan değişiklikler, ilgilinin kütükteki kaydının düşünceler sütununa yazılarak yapılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="TÜZEL KİŞİLER">
      <mvz-bölüm no="1-BİRİNCİ" başlık="GENEL HÜKÜMLER">
        <mvz-b1 no="A" başlık="Tüzel kişilik">
          <mvz-madde no="47" başlık="">
            <mvz-fıkra no="1">
              <template>Başlıbaşına bir varlığı olmak üzere örgütlenmiş kişi toplulukları ve belli bir amaca özgülenmiş olan bağımsız mal toplulukları, kendileri ile ilgili özel hükümler uyarınca tüzel kişilik kazanırlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Amacı hukuka veya ahlâka aykırı olan kişi ve mal toplulukları tüzel kişilik kazanamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Hak ehliyeti">
          <mvz-madde no="48" başlık="">
            <mvz-fıkra no="1">
              <template>Tüzel kişiler, cins, yaş, hısımlık gibi yaradılış gereği insana özgü niteliklere bağlı olanlar dışındaki bütün haklara ve borçlara ehildirler.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Fiil ehliyeti">
          <mvz-b2 no="I" başlık="Koşulu">
            <mvz-madde no="49" başlık="">
              <mvz-fıkra no="1">
                <template>Tüzel kişiler, kanuna ve kuruluş belgelerine göre gerekli organlara sahip olmakla, fiil ehliyetini kazanırlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kullanılması">
            <mvz-madde no="50" başlık="">
              <mvz-fıkra no="1">
                <template>Tüzel kişinin iradesi, organları aracılığıyla açıklanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Organlar, hukukî işlemleri ve diğer bütün fiilleriyle tüzel kişiyi borç altına sokarlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Organlar, kusurlarından dolayı ayrıca kişisel olarak sorumludurlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Yerleşim yeri">
          <mvz-madde no="51" başlık="">
            <mvz-fıkra no="1">
              <template>Tüzel kişinin yerleşim yeri, kuruluş belgesinde başka bir hüküm bulunmadıkça işlerinin yönetildiği yerdir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Kişiliğin sona ermesi">
          <mvz-b2 no="I" başlık="Sınırlı devam etme">
            <mvz-madde no="52" başlık="">
              <mvz-fıkra no="1">
                <template>Sona eren tüzel kişinin kişiliği, ehliyeti tasfiye amacıyla sınırlı olmak üzere tasfiye sırasında da devam eder.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Malvarlığının tasfiyesi">
            <mvz-madde no="53" başlık="">
              <mvz-fıkra no="1">
                <template>Tüzel kişinin malvarlığının tasfiyesi, kanunda ve kuruluş belgesinde aksine hüküm bulunmadıkça, terekenin resmî tasfiyesine ilişkin hükümlere göre yapılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Malvarlığının özgülenmesi">
            <mvz-madde no="54" başlık="">
              <mvz-fıkra no="1">
                <template>Tüzel kişinin malvarlığı, kanunda veya kuruluş belgesinde başka bir hüküm bulunmadıkça ya da yetkili organı başka türlü karar vermedikçe, en yakın amacı güden kamu kurum veya kuruluşuna geçer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu malvarlığı olanak ölçüsünde daha önce özgülendiği amaç için kullanılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Hukuka veya ahlâka aykırı amaç güttüğü için kişiliği mahkeme kararıyla sona eren tüzel kişinin malvarlığı her hâlde ilgili kamu kuruluşuna geçer.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Saklı hükümler">
          <mvz-madde no="55" başlık="">
            <mvz-fıkra no="1">
              <template>Kamu tüzel kişileri ile ticaret şirketleri hakkındaki kanun hükümleri saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="DERNEKLER">
        <mvz-b1 no="A" başlık="Kuruluşu">
          <mvz-b2 no="I" başlık="Tanımı">
            <mvz-madde no="56" başlık="">
              <mvz-fıkra no="1">
                <template>Dernekler, gerçek veya tüzel en az yedi kişinin kazanç paylaşma dışında belirli ve ortak bir amacı gerçekleştirmek üzere, bilgi ve çalışmalarını sürekli olarak birleştirmek suretiyle oluşturdukları, tüzel kişiliğe sahip kişi topluluklarıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hukuka veya ahlâka aykırı amaçlarla dernek kurulamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Dernek kurma hakkı">
            <mvz-madde no="57" başlık="">
              <mvz-fıkra no="1">
                <template>Herkes, önceden izin almaksızın dernek kurma hakkına sahiptir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Dernek kurucularının fiil ehliyetine sahip olması gerekir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Tüzük">
            <mvz-madde no="58" başlık="">
              <mvz-fıkra no="1">
                <template>Her derneğin bir tüzüğü bulunur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Dernek tüzüğünde derneğin adı, amacı,  gelir kaynakları, üyelik koşulları, organları ve örgütü ile geçici yönetim kurulunun gösterilmesi zorunludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Dernek tüzüğü, kanunun emredici hükümlerine aykırı olamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Dernek tüzüğünde düzenlenmemiş konularda kanun hükümleri uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Tüzel kişiliğin kazanılması">
            <mvz-b3 no="1" başlık="Kazanma anı">
              <mvz-madde no="59" başlık="">
                <mvz-fıkra no="1">
                  <template>Dernekler, kuruluş bildirimini, dernek tüzüğünü ve gerekli belgeleri yerleşim yerinin bulunduğu yerin en büyük mülkî amirine verdikleri anda tüzel kişilik kazanırlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kuruluş bildiriminin içeriği ve gerekli belgelerin nelerden ibaret olduğu, yönetmelikte gösterilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İnceleme">
              <mvz-madde no="60" başlık="">
                <mvz-fıkra no="1">
                  <template>Kuruluş bildirimi ve belgelerin doğruluğu ile dernek tüzüğü, en büyük mülkî amir tarafından altmış gün içinde dosya üzerinden incelenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kuruluş bildiriminde, tüzükte ve kurucuların hukukî durumlarında kanuna aykırılık veya noksanlık tespit edildiği takdirde bunların giderilmesi veya tamamlanması derhâl kuruculardan istenir. Bu istemin tebliğinden başlayarak otuz gün içinde belirtilen noksanlık tamamlanmaz ve kanuna aykırılık giderilmezse; en büyük mülkî amir, yetkili asliye hukuk mahkemesinde derneğin feshi konusunda dava açması için durumu Cumhuriyet savcılığına bildirir. Cumhuriyet savcısı mahkemeden derneğin faaliyetinin durdurulmasına karar verilmesini de isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kuruluş bildiriminde, tüzükte ve belgelerde kanuna aykırılık veya noksanlık bulunmaz ya da bu aykırılık veya noksanlık belirli sürede giderilmiş bulunursa; keyfiyet derhâl derneğe yazıyla bildirilir ve dernek, dernekler kütüğüne kaydedilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Dernek tüzüğünün ilânı">
              <mvz-madde no="61" başlık="" durum="mülga">
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="İlk genel kurul toplantısı">
              <mvz-madde no="62" başlık="">
                <mvz-fıkra no="1">
                  <template>Dernekler, 60 ıncı maddenin son fıkrası gereğince yapılan yazılı bildirimi izleyen altı ay içinde ilk genel kurul toplantılarını yapmak ve zorunlu organlarını oluşturmakla yükümlüdürler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Üyelik">
          <mvz-b2 no="I" başlık="Kazanılması">
            <mvz-b3 no="1" başlık="Kural">
              <mvz-madde no="63" başlık="">
                <mvz-fıkra no="1">
                  <template>Hiç kimse, bir derneğe üye olmaya ve hiçbir dernek de üye kabul etmeye zorlanamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Koşulları">
              <mvz-madde no="64" başlık="">
                <mvz-fıkra no="1">
                  <template>Fiil ehliyetine sahip bulunan her gerçek kişi ile tüzel kişiler, derneklere üye olma hakkına sahiptir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yazılı olarak yapılacak üyelik başvurusu,  dernek yönetim kurulunca en çok otuz gün içinde karara bağlanır ve sonuç yazıyla başvuru sahibine bildirilir. Başvurusu kabul edilen üye, bu amaçla tutulacak deftere kaydedilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sona ermesi">
            <mvz-b3 no="1" başlık="Kendiliğinden">
              <mvz-madde no="65" başlık="">
                <mvz-fıkra no="1">
                  <template>Üyelik için kanunda veya tüzükte aranılan nitelikleri sonradan kaybedenlerin dernek üyeliği kendiliğinden sona erer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Çıkma ile">
              <mvz-madde no="66" başlık="">
                <mvz-fıkra no="1">
                  <template>Hiç kimse, dernekte üye kalmaya zorlanamaz. Her üye  yazılı olarak bildirmek kaydıyla, dernekten çıkma hakkına sahiptir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Çıkarılma ile">
              <mvz-madde no="67" başlık="">
                <mvz-fıkra no="1">
                  <template>Tüzükte üyelerin çıkarılma sebepleri gösterilebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tüzükte çıkarma sebepleri gösterilmişse, çıkarma kararına bu sebeplerin haklı sayılamayacağı iddiasıyla itiraz edilemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Tüzükte çıkarma düzenlenmemişse üye, ancak haklı sebeple çıkarılabilir. Bu çıkarma kararına, haklı sebep bulunmadığı ileri sürülerek itiraz edilebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Kapsamı">
            <mvz-b3 no="1" başlık="Üyelerin hakları">
              <mvz-b4 no="a" başlık="Eşitlik ilkesi">
                <mvz-madde no="68" başlık="">
                  <mvz-fıkra no="1">
                    <template>Dernek üyeleri eşit haklara sahiptirler. Dernek, üyeleri arasında dil, ırk, renk, cinsiyet, din ve mezhep, aile, zümre ve sınıf farkı gözetemez; eşitliği bozan veya bazı üyelere bu sebeplerle ayrıcalık tanıyan uygulamalar yapamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Her üyenin, derneğin faaliyetlerine ve yönetimine katılma hakkı vardır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Dernekten çıkan veya çıkarılan üye, dernek malvarlığında hak iddia edemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Oy hakkı">
                <mvz-madde no="69" başlık="">
                  <mvz-fıkra no="1">
                    <template>Her üyenin genel kurulda bir oy hakkı vardır; üye, oyunu şahsen kullanmak zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Onursal üyelerin oy hakkı yoktur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Üyelerin yükümlülükleri">
              <mvz-b4 no="a" başlık="Ödenti verme borcu">
                <mvz-madde no="70" başlık="">
                  <mvz-fıkra no="1">
                    <template>Üyelerin ödenti verme borcu tüzükle düzenlenir. Tüzükte düzenleme yoksa üyeler, dernek amacının gerçekleşmesi ve borçlarının karşılanması için zorunlu ödentilere eşit olarak katılırlar. Dernekten çıkan veya çıkarılan üye, üyelikte bulunduğu sürenin ödentisini vermek zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Onursal üyeler ödenti vermek zorunda değildir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Diğer yükümlülükler">
                <mvz-madde no="71" başlık="">
                  <mvz-fıkra no="1">
                    <template>Üyeler, dernek düzenine uymak ve derneğe sadakat göstermekle yükümlüdürler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Her üye, derneğin amacına uygun davranmak, özellikle amacın gerçekleşmesini güçleştirici veya engelleyici davranışlardan kaçınmakla yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Organlar">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="72" başlık="">
              <mvz-fıkra no="1">
                <template>Derneğin zorunlu organları, genel kurul, yönetim kurulu ve denetim kuruludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Dernekler zorunlu organları dışında başka organlar da oluşturabilirler. Ancak, bu organlara zorunlu organların görev, yetki ve sorumlulukları devredilemez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Genel kurul">
            <mvz-b3 no="1" başlık="Niteliği ve oluşumu">
              <mvz-madde no="73" başlık="">
                <mvz-fıkra no="1">
                  <template>Genel kurul, derneğin en yetkili karar organı olup; derneğe kayıtlı üyelerden oluşur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Toplanması">
              <mvz-b4 no="a" başlık="Olağan toplantı">
                <mvz-madde no="74" başlık="">
                  <mvz-fıkra no="1">
                    <template>Genel kurul, tüzükte belirtilen zamanda yönetim kurulunun çağrısı üzerine toplanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Olağan genel kurul toplantılarının en geç üç yılda bir yapılması zorunludur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Olağanüstü toplantı">
                <mvz-madde no="75" başlık="">
                  <mvz-fıkra no="1">
                    <template>Genel kurul, yönetim veya denetim kurulunun gerekli gördüğü hâllerde veya dernek üyelerinden beşte birinin yazılı başvurusu üzerine, yönetim kurulunca olağanüstü toplantıya çağrılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Yönetim kurulu, genel kurulu toplantıya çağırmazsa; üyelerden birinin başvurusu üzerine, sulh hâkimi, üç üyeyi genel kurulu toplantıya çağırmakla görevlendirir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Toplantısız veya çağrısız alınan kararlar">
                <mvz-madde no="76" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bütün üyelerin bir araya gelmeksizin yazılı katılımıyla alınan kararlar ile dernek üyelerinin tamamının kanunda yazılı çağrı usulüne uymaksızın bir araya gelerek aldığı kararlar geçerlidir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu şekilde karar alınması olağan toplantı yerine geçmez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Toplantıya çağrı">
              <mvz-madde no="77" başlık="">
                <mvz-fıkra no="1">
                  <template>Genel kurul, yönetim kurulunca, en az onbeş gün önceden toplantıya çağrılır. Bu amaçla toplantının günü, saati, yeri ve gündemi,  üyelere  bildirilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Toplantıya çağrı usulü ve toplantının ertelenmesine ilişkin konular, yönetmelikle düzenlenir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Toplantı yeri ve toplantı yeter sayısı">
              <mvz-madde no="78" başlık="">
                <mvz-fıkra no="1">
                  <template>Genel kurul toplantıları, tüzükte aksine hüküm olmadıkça, dernek merkezinin bulunduğu yerde yapılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Genel kurul, katılma hakkı bulunan üyelerin salt çoğunluğunun, tüzük değişikliği ve derneğin feshi hâllerinde üçte ikisinin katılımıyla toplanır; çoğunluğun sağlanamaması sebebiyle toplantının ertelenmesi durumunda ikinci toplantıda çoğunluk aranmaz. Ancak, bu toplantıya katılan üye sayısı, yönetim ve denetim kurulları üye tam sayısının iki katından az olamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Genel kurul toplantısı, bir defadan fazla geri bırakılamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Toplantı usulü">
              <mvz-madde no="79" başlık="">
                <mvz-fıkra no="1">
                  <template>Genel kurul toplantısının açılışından sonra, toplantıyı yönetmek üzere, bir başkan ve yeteri kadar başkan vekili ile yazman seçilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Genel kurul toplantısında yalnız gündemde yer alan Maddeler görüşülür. Ancak, toplantıda hazır bulunan üyelerin en az onda biri tarafından görüşülmesi yazılı olarak istenen konuların gündeme alınması zorunludur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3" durum="mülga">
                  <template></template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="6" başlık="Genel kurulun görev ve yetkileri">
              <mvz-madde no="80" başlık="">
                <mvz-fıkra no="1">
                  <template>Genel kurul, üyeliğe kabul ve üyelikten çıkarma hakkında son kararı verir; dernek organlarını seçer ve derneğin diğer bir organına verilmemiş olan işleri görür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Genel kurul, derneğin diğer organlarını denetler ve onları haklı sebeplerle her zaman görevden alabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="7" başlık="Genel kurul kararları">
              <mvz-b4 no="a" başlık="Karar yeter sayısı">
                <mvz-madde no="81" başlık="">
                  <mvz-fıkra no="1">
                    <template>Genel kurul kararları, toplantıya katılan üyelerin salt çoğunluğuyla alınır. Şu kadar ki, tüzük değişikliği ve derneğin feshi kararları, ancak toplantıya katılan üyelerin üçte iki çoğunluğuyla alınabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Oy hakkından yoksunluk">
                <mvz-madde no="82" başlık="">
                  <mvz-fıkra no="1">
                    <template>Hiçbir dernek üyesi, dernek ile kendisi, eşi, üstsoyu ve altsoyu arasındaki bir hukukî işlem veya uyuşmazlık konusunda alınması gereken kararlarda oy kullanamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tüzel kişi adına oy kullanacak kişi hakkında da yukarıdaki fıkra hükmü uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Kararın iptali">
                <mvz-madde no="83" başlık="">
                  <mvz-fıkra no="1">
                    <template>Toplantıda hazır bulunan ve kanuna veya tüzüğe aykırı olarak alınan genel kurul kararlarına katılmayan her üye, karar tarihinden başlayarak bir ay içinde; toplantıda hazır bulunmayan her üye kararı öğrenmesinden başlayarak bir ay içinde ve her hâlde karar tarihinden başlayarak üç ay içinde mahkemeye başvurmak suretiyle kararın iptalini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Diğer organların kararlarına karşı, dernek içi denetim yolları tüketilmedikçe iptal davası açılamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Genel kurul kararlarının yok veya mutlak butlanla hükümsüz sayıldığı durumlar saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Yönetim kurulu">
            <mvz-b3 no="1" başlık="Oluşumu">
              <mvz-madde no="84" başlık="">
                <mvz-fıkra no="1">
                  <template>Yönetim kurulu, beş asıl ve beş yedek üyeden az olmamak üzere dernek tüzüğünde belirtilen sayıda üyeden oluşur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yönetim kurulu üye sayısı, boşalmalar sebebiyle üye tamsayısının yarısının altına düşerse; genel kurul, kalan yönetim kurulu üyeleri veya denetim kurulu tarafından bir ay içinde toplantıya çağrılır. Çağrı yapılmazsa, üyelerden birinin istemi üzerine, sulh hâkimi, üç üyeyi genel kurulu toplantıya çağırmakla görevlendirir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Görevleri">
              <mvz-madde no="85" başlık="">
                <mvz-fıkra no="1">
                  <template>Yönetim kurulu, derneğin yürütme ve temsil organıdır; bu görevini kanuna ve dernek tüzüğüne uygun olarak yerine getirir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Temsil görevi, yönetim kurulunca, üyelerden birine veya bir üçüncü kişiye verilebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Denetim kurulu">
            <mvz-madde no="86" başlık="">
              <mvz-fıkra no="1">
                <template>Denetim kurulu, üç asıl ve üç yedek üyeden az olmamak üzere dernek tüzüğünde belirtilen sayıda üyeden oluşur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Denetim kurulu, denetleme görevini, dernek tüzüğünde belirtilen esas ve usullere göre yapar; denetleme sonuçlarını bir raporla yönetim kuruluna ve genel kurula sunar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Sona erme">
          <mvz-b2 no="I" başlık="Kendiliğinden">
            <mvz-madde no="87" başlık="">
              <mvz-fıkra no="1">
                <template>Dernekler, aşağıdaki hâllerde kendiliğinden sona erer:</template>
                <mvz-bent no="1.">
                  <template>Amacın gerçekleşmesi, gerçekleşmesinin olanaksız hâle gelmesi veya sürenin sona ermesi,</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>İlk genel kurul toplantısının kanunda öngörülen sürede yapılmamış ve zorunlu organların oluşturulmamış olması,</template>
                </mvz-bent>
                <mvz-bent no="3.">
                  <template>Borç ödemede acze düşmüş olması,</template>
                </mvz-bent>
                <mvz-bent no="4.">
                  <template>Tüzük gereğince yönetim kurulunun oluşturulmasının olanaksız hâle gelmesi,</template>
                </mvz-bent>
                <mvz-bent no="5.">
                  <template>Olağan genel kurul toplantısının iki defa üst üste yapılamaması.</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Her ilgili, sulh hâkiminden, derneğin kendiliğinden sonra erdiğinin tespitini isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Genel kurul kararı ile">
            <mvz-madde no="88" başlık="">
              <mvz-fıkra no="1">
                <template>Genel kurul, her zaman derneğin feshine karar verebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Mahkeme kararı ile">
            <mvz-madde no="89" başlık="">
              <mvz-fıkra no="1">
                <template>Derneğin amacı, kanuna veya ahlâka aykırı hâle gelirse; Cumhuriyet savcısının veya bir ilgilinin istemi üzerine mahkeme, derneğin feshine karar verir. Mahkeme, dava sırasında faaliyetten alıkoyma dahil gerekli bütün önlemleri alır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Derneklerin faaliyetleri">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="90" başlık="">
              <mvz-fıkra no="1">
                <template>Dernekler, amaçlarını gerçekleştirmek üzere, tüzüklerinde belirtilen çalışma konuları ve biçimleri doğrultusunda faaliyette bulunurlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yasaklanan veya izne bağlı faaliyetlerle ilgili kamu hukuku nitelikli özel kanun hükümleri saklıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Dernek faaliyetleri ile ilgili yasak ve sınırlamalara aykırılık hâlinde, Cumhuriyet savcısının istemiyle mahkemece faaliyetten alıkoyma kararı verilebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Uluslararası faaliyet">
            <mvz-b3 no="1" başlık="Faaliyet serbestliği">
              <mvz-madde no="91" başlık="">
                <mvz-fıkra no="1">
                  <template>Dernekler, tüzüklerinde gösterilen amaçları gerçekleştirmek üzere uluslararası faaliyette ve işbirliğinde bulunabilirler, yurt dışında şube açabilirler ve yurt dışında kurulmuş dernek veya kuruluşlara üye olarak katılabilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yabancı dernekler">
              <mvz-madde no="92" başlık="">
                <mvz-fıkra no="1">
                  <template>Yabancı dernekler,  Dışişleri Bakanlığının görüşü alınmak suretiyle İçişleri Bakanlığının izniyle Türkiye’de faaliyette ve işbirliğinde bulunabilirler, şube açabilirler, üst kuruluşlar kurabilir ve kurulmuş üst kuruluşlara katılabilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Yabancıların dernek kurma hakkı">
            <mvz-madde no="93" başlık="">
              <mvz-fıkra no="1">
                <template>Türkiye'de yerleşme hakkına sahip olan yabancı gerçek kişiler,  dernek kurabilirler veya kurulmuş derneklere üye olabilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Onursal üyelik için bu koşul aranmaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Derneklerin örgütlenmesi">
          <mvz-b2 no="I" başlık="Şube açmaları">
            <mvz-b3 no="1" başlık="Kuruluşu">
              <mvz-madde no="94" başlık="">
                <mvz-fıkra no="1">
                  <template>Dernekler, gerekli görülen yerlerde genel kurul kararıyla şube açabilirler. Bu amaçla dernek yönetim kurulunca yetki verilen en az üç kişilik kurucular kurulu, şube açılacak yerin en büyük mülkî amirine şube kuruluş bildirimini ve gerekli belgeleri verir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2" durum="mülga">
                  <template></template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Şube kuruluş bildiriminin içeriği ve gerekli belgeler, yönetmelikte gösterilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Şubenin organları ve uygulanacak hükümler">
              <mvz-madde no="95" başlık="">
                <mvz-fıkra no="1">
                  <template>Her şubede genel kurul ve yönetim kurulu ile denetim kurulu veya denetçi bulunması zorunludur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu organların görev ve yetkileri ile şubelere ilişkin diğer hususlar hakkında bu Kanun hükümleri uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Üst kuruluşlar kurmaları">
            <mvz-b3 no="1" başlık="Federasyon">
              <mvz-madde no="96" başlık="">
                <mvz-fıkra no="1">
                  <template>Federasyonlar, kuruluş amaçları aynı olan en az beş derneğin, amaçlarını gerçekleştirmek üzere üye sıfatıyla bir araya gelmeleri suretiyle kurulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Her federasyonun bir tüzüğü bulunur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Federasyon, kuruluş bildirimi, tüzük ve gerekli belgelerin yerleşim yerinin en büyük mülkî amirine verilmesiyle tüzel kişilik kazanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Konfederasyon">
              <mvz-madde no="97" başlık="">
                <mvz-fıkra no="1">
                  <template>Konfederasyonlar, kuruluş amaçları aynı olan en az üç federasyonun, amaçlarını gerçekleştirmek üzere üye sıfatıyla bir araya gelmeleri suretiyle kurulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Her konfederasyonun bir tüzüğü bulunur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Konfederasyon, kuruluş bildirimi, tüzük ve gerekli belgelerin yerleşim yerinin en büyük mülkî amirine verilmesiyle tüzel kişilik kazanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Ortak hükümler">
              <mvz-madde no="98" başlık="">
                <mvz-fıkra no="1">
                  <template>Dernekler, bağlı oldukları federasyonun; federasyonlar da bağlı oldukları konfederasyonun genel kurulunda en az üçer üye ile temsil olunurlar. Temsilci üyeler, ilgili derneklerin ve federasyonların genel kurullarınca seçilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Federasyon ve konfederasyonlara ilişkin diğer hususlar hakkında bu Kanun hükümleri uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="G" başlık="Dernek gelirleri">
          <mvz-madde no="99" başlık="">
            <mvz-fıkra no="1">
              <template>Dernek gelirleri, üye ödentisi, dernek faaliyetleri sonucunda veya dernek malvarlığından elde edilen gelirler ile bağış ve yardımlardan oluşur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="H" başlık="Saklı hükümler">
          <mvz-madde no="100" başlık="">
            <mvz-fıkra no="1">
              <template>Kamuya yararlı dernekler ve özel kanunlarla kurulan dernekler hakkındaki özel hükümler saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="VAKIFLAR">
        <mvz-b1 no="A" başlık="Kuruluşu">
          <mvz-b2 no="I" başlık="Tanımı">
            <mvz-madde no="101" başlık="">
              <mvz-fıkra no="1">
                <template>Vakıflar, gerçek veya tüzel kişilerin yeterli mal ve hakları belirli ve sürekli bir amaca özgülemeleriyle oluşan tüzel kişiliğe sahip mal topluluklarıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bir malvarlığının bütünü veya gerçekleşmiş ya da gerçekleşeceği anlaşılan her türlü geliri veya ekonomik değeri olan haklar vakfedilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3" durum="iptal">
                <template></template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Cumhuriyetin Anayasa ile belirlenen niteliklerine ve Anayasanın temel ilkelerine, hukuka, ahlâka, millî birliğe ve millî menfaatlere aykırı veya belli bir ırk ya da cemaat mensuplarını desteklemek amacıyla vakıf kurulamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kuruluş şekli">
            <mvz-madde no="102" başlık="">
              <mvz-fıkra no="1">
                <template>Vakıf kurma iradesi, resmî senetle veya ölüme bağlı tasarrufla açıklanır. Vakıf, yerleşim yeri mahkemesi nezdinde tutulan sicile tescil ile tüzel kişilik kazanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Resmî senetle vakıf kurma işleminin temsilci aracılığıyla yapılması, temsil yetkisinin noterlikçe düzenlenmiş bir belgeyle verilmiş olmasına ve bu belgede vakfın amacı ile özgülenecek mal ve hakların belirlenmiş bulunmasına bağlıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Mahkemeye başvurma, resmî senet düzenlenmiş ise vakfeden tarafından; vakıf ölüme bağlı tasarrufa dayanıyorsa ilgililerin veya vasiyetnameyi açan sulh hâkiminin bildirimi üzerine ya da Vakıflar Genel Müdürlüğünce re'sen yapılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Başvurulan mahkeme, mal ve hakların korunması için gerekli önlemleri re'sen alır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Temyiz ve iptal">
            <mvz-madde no="103" başlık="">
              <mvz-fıkra no="1">
                <template>Mahkemenin verdiği karar, tebliğ tarihinden başlayarak bir ay içinde, başvuran veya Vakıflar Genel Müdürlüğü tarafından temyiz edilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vakıflar Genel Müdürlüğü veya ilgililer, vakfın kurulmasını engelleyen sebeplerin varlığı hâlinde iptal davası açabilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Tescil ve ilân">
            <mvz-madde no="104" başlık="">
              <mvz-fıkra no="1">
                <template>Tesciline karar verilen vakıf, vakfın yerleşim yeri mahkemesi nezdinde tutulan sicile tescil edilir; ayrıca Vakıflar Genel Müdürlüğünde tutulan merkezî sicile kaydolunur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Tescil kararı, başka bir mahkemece verilmiş ise, ilgili belgelerle birlikte tescil için vakfın yerleşim yeri mahkemesine gönderilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Yerleşim yeri mahkemesinin yapacağı bildirim üzerine Vakıflar Genel Müdürlüğünce merkezî sicile kaydolunan vakıf Resmî Gazete ile ilân olunur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Tescil ve ilân Cumhurbaşkanınca çıkarılan yönetmelik hükümlerine göre yapılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Mal ve hakların kazanılması ve sorumluluk">
            <mvz-madde no="105" başlık="">
              <mvz-fıkra no="1">
                <template>Özgülenen malların mülkiyeti ile haklar, tüzel kişiliğin kazanılmasıyla vakfa geçer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Tescile karar veren mahkeme, vakfedilen taşınmazın vakıf tüzel kişiliği adına tescil edilmesini tapu idaresine bildirir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Ölüme bağlı tasarrufla kurulan vakfın mirasbırakanın borçlarından sorumluluğu, özgülenen mal ve haklarla sınırlıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Vakıf senedi">
          <mvz-b2 no="I" başlık="İçeriği">
            <mvz-madde no="106" başlık="">
              <mvz-fıkra no="1">
                <template>Vakıf senedinde vakfın adı, amacı, bu amaca özgülenen mal ve haklar, vakfın örgütlenme ve yönetim şekli ile yerleşim yeri gösterilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Noksanlıklar">
            <mvz-madde no="107" başlık="">
              <mvz-fıkra no="1">
                <template>Vakıf senedinde vakfın amacı ile bu amaca özgülenen mal ve haklar yeterince belirlenmiş ise, diğer noksanlıklar vakfın tüzel kişilik kazanması için yapılan başvurunun reddini gerektirmez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu tür noksanlıklar, tescil kararı verilmeden önce mahkemece tamamlattırılabileceği gibi; kuruluştan sonra da denetim makamının başvurusu üzerine, olanak varsa vakfedenin görüşü alınarak vakfın yerleşim yeri mahkemesince tamamlattırılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Tescili istenen vakfa ölüme bağlı tasarrufla özgülenen mal ve haklar amacın gerçekleşmesine yeterli değilse; vakfeden aksine bir irade açıklamasında bulunmuş olmadıkça bu mal ve haklar, denetim makamının görüşü alınarak hâkim tarafından benzer amaçlı bir vakfa özgülenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Mirasçıların ve alacaklıların dava hakkı">
          <mvz-madde no="108" başlık="">
            <mvz-fıkra no="1">
              <template>Vakfedenin mirasçıları ile alacaklılarının, bağışlamaya ve ölüme bağlı tasarruflara ilişkin hükümler uyarınca dava hakları saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Vakfın örgütü">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="109" başlık="">
              <mvz-fıkra no="1">
                <template>Vakfın bir yönetim organının bulunması zorunludur. Vakfeden, vakıf senedinde gerekli gördüğü başka organları da gösterebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Çalıştırılanlara ve işçilere yardım vakfı">
            <mvz-madde no="110" başlık="">
              <mvz-fıkra no="1">
                <template>Çalıştırılanlara ve işçilere yardım vakıflarının yöneticileri, yararlananlara, vakfın örgütü, işleyişi ve malî durumu hakkında gerekli bilgiyi vermekle yükümlüdürler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vakfa ödenti veren çalıştırılanlar ve işçiler en az yapmış oldukları ödeme oranında yönetime katılırlar ve temsilcilerini olabildiğince kendi aralarından seçerler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Vakfın malvarlığının çalıştırılanların ve işçilerin yapacakları ödemelerle sağlanacak bölümünün işverene karşı vakfın bir alacağından ibaret olması, ancak bu alacak için yeterli güvence sağlanmış olmasına bağlıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Yararlananların, vakfın edimlerinin yerine getirilmesini dava yoluyla isteyebilmeleri, ödenti vermiş olmalarına veya vakfı düzenleyen hükümlerin kendilerine bu hakkı tanımış bulunmasına bağlıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Çalıştırılanlara ve işçilere yardım vakıflarında yararlananların yönetime katılmaları ve vakıftan yararlanma koşulları ile ilgili hükümlerde yapılacak değişiklikler, vakıf senedine göre buna yetkili organın istemi üzerine, denetim makamının yazılı görüşü alındıktan sonra yerleşim yeri mahkemesince karara bağlanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Denetim">
          <mvz-madde no="111" başlık="">
            <mvz-fıkra no="1">
              <template>Vakıfların, vakıf senedindeki hükümleri yerine getirip getirmedikleri, vakıf mallarını amaca uygun biçimde yönetip yönetmedikleri ve vakıf gelirlerini amaca uygun olarak harcayıp harcamadıkları Vakıflar Genel Müdürlüğünce ve üst kuruluşlarınca denetlenir. Vakıfların üst kuruluşlarınca denetimi özel kanun hükümlerine tabidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2" durum="mülga">
              <template></template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Yönetimin, amacın ve malların değiştirilmesi">
          <mvz-b2 no="I" başlık="Yönetimin değiştirilmesi">
            <mvz-madde no="112" başlık="">
              <mvz-fıkra no="1">
                <template>Haklı sebepler varsa mahkeme, vakfın yönetim organı veya denetim makamının istemi üzerine diğerinin yazılı görüşünü aldıktan sonra vakfın örgütünü, yönetimini ve işleyişini değiştirebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Mahkeme, denetim makamının başvurusu üzerine,  duruşma yaparak yöneticileri görevden alabilir ve vakıf senedinde başka bir hüküm yoksa yenisini seçebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Amacın ve malların değiştirilmesi">
            <mvz-madde no="113" başlık="">
              <mvz-fıkra no="1">
                <template>Durum ve koşullardaki değişmeler yüzünden vakıf senedinde yazılı amaca bağlı kalınması vakfedenin arzusuna açıkça uymayacak hâle gelmiş ise mahkeme, vakfın yönetim organı veya denetim makamının başvurusu üzerine diğerinin yazılı görüşünü aldıktan sonra vakfın amacını değiştirebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Amacın gerçekleşmesini önemli ölçüde güçleştiren veya engelleyen koşulların ve yükümlülüklerin kaldırılmasında veya değiştirilmesinde de aynı hüküm uygulanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Amaca özgülenen mal ve hakların daha yararlı olanları ile değiştirilmesini veya paraya çevrilmesini haklı kılan sebepler varsa mahkeme, vakfın yönetim organı veya denetim makamının başvurusu üzerine diğerinin yazılı görüşünü aldıktan sonra gerekli değişikliğe izin verebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="G" başlık="Yıllık rapor">
          <mvz-madde no="114" başlık="">
            <mvz-fıkra no="1">
              <template>Yönetim organı her takvim yılının ilk üç ayı içinde vakfın bir önceki yıla ait malvarlığı durumunu ve çalışmalarını bir rapor hâlinde denetim makamına bildirir ve durumun uygun araçlarla yayımlanmasını sağlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="H" başlık="Faaliyetten geçici alıkoyma">
          <mvz-madde no="115" başlık="">
            <mvz-fıkra no="1">
              <template>İçişleri Bakanlığı, Anayasada öngörülen hâllerde ve belirlenen usullere uygun olarak, denetim makamının da görüşünü almak suretiyle mahkemece bir karar verilinceye kadar vakfı geçici olarak faaliyetten alıkoyabilir ve derhâl mahkemeye başvurur. Hâkim başvuruyu gecikmeksizin karara bağlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="İ" başlık="Vakfın sona ermesi">
          <mvz-madde no="116" başlık="">
            <mvz-fıkra no="1">
              <template>Amacın gerçekleşmesi olanaksız hâle geldiği ve değiştirilmesine de olanak bulunmadığı takdirde, vakıf kendiliğinden sona erer ve mahkeme kararıyla sicilden silinir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yasak amaç güttüğü veya yasak faaliyetlerde bulunduğu sonradan anlaşılan veya amacı sonradan yasaklanan vakfın amacının değiştirilmesine olanak bulunmazsa; vakıf, denetim makamının ya da Cumhuriyet savcısının başvurusu üzerine duruşma yapılarak dağıtılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="J" başlık="Diğer hükümler">
          <mvz-madde no="117" başlık="">
            <mvz-fıkra no="1">
              <template>Vakıfların malları üzerinde zilyetlik yoluyla kazanma hükümleri uygulanmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Derneklerin uluslararası faaliyette bulunmalarına ve üst kuruluş kurmalarına ilişkin hükümler kıyas yoluyla vakıflar hakkında da uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kamuya yararlı veya özel kanunlarla kurulan vakıflar hakkındaki özel hükümler saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-bölüm>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="2-İKİNCİ" başlık="AİLE HUKUKU">
    <mvz-kısım no="1-BİRİNCİ" başlık="EVLİLİK HUKUKU">
      <mvz-bölüm no="1-BİRİNCİ" başlık="EVLENME">
        <mvz-ayırım no="1-BİRİNCİ" başlık="NİŞANLILIK">
          <mvz-b1 no="A" başlık="Nişanlanma">
            <mvz-madde no="118" başlık="">
              <mvz-fıkra no="1">
                <template>Nişanlanma, evlenme vaadiyle olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Nişanlanma, yasal temsilcilerinin rızası olmadıkça küçüğü veya kısıtlıyı bağlamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Nişanlılığın hükümleri">
            <mvz-b2 no="I" başlık="Dava hakkının bulunmaması">
              <mvz-madde no="119" başlık="">
                <mvz-fıkra no="1">
                  <template>Nişanlılık, evlenmeye zorlamak için dava hakkı vermez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Evlenmeden kaçınma hâli için öngörülen cayma tazminatı veya ceza şartı dava edilemez; ancak yapılan ödemeler de geri istenemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Nişanın bozulmasının sonuçları">
              <mvz-b3 no="1" başlık="Maddî tazminat">
                <mvz-madde no="120" başlık="">
                  <mvz-fıkra no="1">
                    <template>Nişanlılardan biri haklı bir sebep olmaksızın nişanı bozduğu veya nişan taraflardan birine yükletilebilen bir sebeple bozulduğu takdirde; kusuru olan taraf, diğerine dürüstlük kuralları çerçevesinde ve evlenme amacıyla yaptığı harcamalar ve katlandığı maddî fedakârlıklar karşılığında uygun bir tazminat vermekle yükümlüdür. Aynı kural nişan giderleri hakkında da uygulanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tazminat istemeye hakkı olan tarafın ana ve babası veya onlar gibi davranan kimseler de, aynı koşullar altında yaptıkları harcamalar için uygun bir tazminat isteyebilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Manevî tazminat">
                <mvz-madde no="121" başlık="">
                  <mvz-fıkra no="1">
                    <template>Nişanın bozulması yüzünden kişilik hakkı saldırıya uğrayan taraf, kusurlu olan diğer taraftan manevî tazminat olarak uygun miktarda bir para ödenmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Hediyelerin geri verilmesi">
              <mvz-madde no="122" başlık="">
                <mvz-fıkra no="1">
                  <template>Nişanlılık evlenme dışındaki bir sebeple sona ererse, nişanlıların birbirlerine veya ana ve babanın ya da onlar gibi davrananların, diğer nişanlıya vermiş oldukları alışılmışın dışındaki hediyeler, verenler tarafından geri istenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hediye aynen veya mislen geri verilemiyorsa, sebepsiz zenginleşme hükümleri uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Zamanaşımı">
              <mvz-madde no="123" başlık="">
                <mvz-fıkra no="1">
                  <template>Nişanlılığın sona ermesinden doğan dava hakları, sona ermenin üzerinden bir yıl geçmekle zamanaşımına uğrar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="EVLENME EHLİYETİ VE ENGELLERİ">
          <mvz-b1 no="A" başlık="Ehliyetin koşulları">
            <mvz-b2 no="I" başlık="Yaş">
              <mvz-madde no="124" başlık="">
                <mvz-fıkra no="1">
                  <template>Erkek veya kadın onyedi yaşını doldurmadıkça evlenemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ancak, hâkim olağanüstü durumlarda ve pek önemli bir sebeple onaltı yaşını doldurmuş olan erkek veya kadının evlenmesine izin verebilir. Olanak bulundukça karardan önce ana ve baba veya vasi dinlenir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Ayırt etme gücü">
              <mvz-madde no="125" başlık="">
                <mvz-fıkra no="1">
