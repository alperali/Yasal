              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Çocuğun korunması">
            <mvz-b2 no="I" başlık="Koruma önlemleri">
              <mvz-madde no="346" başlık="">
                <mvz-fıkra no="1">
                  <template>Çocuğun menfaati ve gelişmesi tehlikeye düştüğü takdirde, ana ve baba duruma çare bulamaz veya buna güçleri yetmezse hâkim, çocuğun korunması için uygun önlemleri alır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Çocukların yerleştirilmesi">
              <mvz-madde no="347" başlık="">
                <mvz-fıkra no="1">
                  <template>Çocuğun bedensel ve zihinsel gelişmesi tehlikede bulunur veya çocuk manen terk edilmiş hâlde kalırsa hâkim, çocuğu ana ve babadan alarak bir aile yanına veya bir kuruma yerleştirebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çocuğun aile içinde kalması ailenin huzurunu onlardan katlanmaları beklenemeyecek derecede bozuyorsa ve durumun gereklerine göre başka çare de kalmamışsa, ana ve baba veya çocuğun istemi üzerine hâkim aynı önlemleri alabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ana ve baba ile çocuğun ödeme gücü yoksa bu önlemlerin gerektirdiği giderler Devletçe karşılanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Nafakaya ilişkin hükümler saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Velâyetin kaldırılması">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="348" başlık="">
                  <mvz-fıkra no="1">
                    <template>Çocuğun korunmasına ilişkin diğer önlemlerden sonuç alınamaz ya da bu önlemlerin yetersiz olacağı önceden anlaşılırsa, hâkim aşağıdaki hâllerde velâyetin kaldırılmasına karar verir:</template>
                    <mvz-bent no="1.">
                      <template>Ana ve babanın deneyimsizliği, hastalığı, başka bir yerde bulunması veya benzeri sebeplerden biriyle velayet görevini gereği gibi yerine getirememesi.</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Ana ve babanın çocuğa yeterli ilgiyi göstermemesi veya ona karşı yükümlülüklerini ağır biçimde savsaklaması.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Velâyet ana ve babanın her ikisinden kaldırılırsa çocuğa bir vasi atanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Kararda aksi belirtilmedikçe, velâyetin kaldırılması mevcut ve doğacak bütün çocukları kapsar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Ana veya babanın yeniden evlenmesi hâlinde">
                <mvz-madde no="349" başlık="">
                  <mvz-fıkra no="1">
                    <template>Velâyete sahip ana veya babanın yeniden evlenmesi, velâyetin kaldırılmasını gerektirmez. Ancak, çocuğun menfaati gerektirdiğinde velâyet sahibi değiştirilebileceği gibi, durum ve koşullara göre velâyet kaldırılarak çocuğa vasi de atanabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Velâyetin kaldırılması hâlinde ana ve babanın yükümlülükleri">
                <mvz-madde no="350" başlık="">
                  <mvz-fıkra no="1">
                    <template>Velâyetin kaldırılması hâlinde ana ve babanın çocuklarının bakım ve eğitim giderlerini karşılama yükümlülükleri devam eder.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ana ve baba ile çocuğun ödeme gücü yoksa bu giderler Devletçe karşılanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Nafakaya ilişkin hükümler saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Durumun değişmesi">
              <mvz-madde no="351" başlık="">
                <mvz-fıkra no="1">
                  <template>Durumun değişmesi hâlinde, çocuğun korunmasına ilişkin önlemlerin yeni koşullara uydurulması gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Velâyetin kaldırılmasını gerektiren sebep ortadan kalkmışsa hâkim, re'sen ya da ana veya babanın istemi üzerine velâyeti geri verir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="7-YEDİNCİ" başlık="ÇOCUK MALLARI">
          <mvz-b1 no="A" başlık="Yönetim">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="352" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba, velâyetleri devam ettiği sürece çocuğun mallarını yönetme hakkına sahip ve bununla yükümlüdürler; kural olarak hesap ve güvence vermezler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ana ve babanın yükümlülüklerini yerine getirmedikleri durumlarda hâkim müdahale eder.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Evlilik sona erince">
              <mvz-madde no="353" başlık="">
                <mvz-fıkra no="1">
                  <template>Evlilik sona erince velâyet kendisinde kalan eş, hâkime çocuğun malvarlığının dökümünü gösteren bir defter vermek ve bu malvarlığında veya yapılan yatırımlarda gerçekleşen önemli değişiklikleri bildirmek zorundadır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Kullanma hakkı">
            <mvz-madde no="354" başlık="">
              <mvz-fıkra no="1">
                <template>Ana ve baba, kusurları sebebiyle velâyetleri kaldırılmadıkça, çocuğun mallarını kullanabilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Gelirlerin sarfı">
            <mvz-madde no="355" başlık="">
              <mvz-fıkra no="1">
                <template>Ana ve baba, çocuk mallarının gelirlerini öncelikle çocuğun bakımı, yetiştirilmesi ve eğitimi için; hakkaniyete uyduğu ölçüde de aile ihtiyaçlarını karşılamak üzere sarfedebilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Gelir fazlası, çocuk mallarına katılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Çocuk mallarının kısmen sarfı">
            <mvz-madde no="356" başlık="">
              <mvz-fıkra no="1">
                <template>Olağan ihtiyaçlar gerektirdiği ölçüde sermaye biçiminde ödemeler, tazminatlar ve benzeri edimler çocuğun bakımı için kısmen kullanılabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Çocuğun bakımı, yetiştirilmesi ve eğitimi için zorunluluk varsa hâkim, ana ve babaya belirlediği miktarlarda çocuğun diğer mallarına da başvurma yetkisini tanıyabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Çocuğun serbest malları">
            <mvz-b2 no="I" başlık="Kazandırmalar">
              <mvz-madde no="357" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba, faiz getiren yatırım veya tasarruf hesabı açılmak üzere ya da açıkça ana ve babanın kullanmaması koşuluyla çocuğa yapılan kazandırmaların gelirlerini kendi menfaatlerine sarfedemezler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kazandırmada bulunan kişi, kazandırma sırasında açıkça aksini öngörmedikçe, ana ve baba bunlar üzerinde yönetim hakkına sahiptir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Saklı pay">
              <mvz-madde no="358" başlık="">
                <mvz-fıkra no="1">
                  <template>Ölüme bağlı tasarruf yoluyla çocuğun saklı payı ana ve babanın yönetimi dışında bırakılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasbırakan yönetimi bir üçüncü kişiye bırakmışsa, tasarrufunda bu kişinin belirli zamanlarda sulh hâkimine hesap vermesini öngörebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Meslek veya sanat için verilen mal ve kişisel kazanç">
              <mvz-madde no="359" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba tarafından bir meslek veya sanat ile uğraşması için çocuğa kendi malından verilen kısmın veya kendi kişisel kazancının yönetimi ve bunlardan yararlanma hakkı çocuğa aittir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çocuğun evde ana ve babasıyla birlikte yaşaması hâlinde, ana ve baba ondan kendisinin bakımı için uygun bir katkıda bulunmasını isteyebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="F" başlık="Çocuk mallarının korunması">
            <mvz-b2 no="I" başlık="Önlemler">
              <mvz-madde no="360" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba, çocuğun mallarını yönetmekte her ne sebeple olursa olsun yeterince özen göstermezlerse hâkim, malların korunması için uygun önlemleri alır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hâkim, özellikle malların yönetimi konusunda talimat verebilir; belirli zamanlarda verilen bilgi ve hesabı yeterli görmezse, malların tevdi edilmesine veya güvence gösterilmesine karar verebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Yönetimin ana ve babadan alınması">
              <mvz-madde no="361" başlık="">
                <mvz-fıkra no="1">
                  <template>Çocuğun mallarının tehlikeye düşmesi başka bir şekilde önlenemiyorsa hâkim, yönetimin bir kayyıma devredilmesine karar verebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çocuğun, yönetimi ana ve babaya ait olmayan malları tehlikeye düştüğünde hâkim, aynı önlemlerin alınmasını kararlaştırabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Çocuk mallarının gelirlerinin veya bu mallardan ayrılmış belirli miktarların kanuna uygun şekilde sarfedileceğinden kuşku duyulursa hâkim, bunların da yönetimini bir kayyıma bırakabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="G" başlık="Yönetimin sona ermesi">
            <mvz-b2 no="I" başlık="Malların devri">
              <mvz-madde no="362" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba, velâyetleri veya yönetim hakları sona erince, çocuğun mallarını, hesabıyla birlikte ergin çocuğa, vasisine veya kayyıma devrederler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Ana ve babanın sorumluluğu">
              <mvz-madde no="363" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba, çocuk mallarının geri verilmesinde vekil gibi sorumludurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Dürüstlük kuralına uygun olarak başkasına devrettikleri malların yerine sadece aldıkları karşılığı geri vermekle yükümlüdürler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kanuna uygun olarak çocuk veya aile için yaptıkları harcamalardan dolayı tazminatla yükümlü tutulmazlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="AİLE">
        <mvz-ayırım no="1-BİRİNCİ" başlık="NAFAKA YÜKÜMLÜLÜĞÜ">
          <mvz-b1 no="A" başlık="Nafaka yükümlüleri">
            <mvz-madde no="364" başlık="">
              <mvz-fıkra no="1">
                <template>Herkes, yardım etmediği takdirde yoksulluğa düşecek olan üstsoyu ve altsoyu ile kardeşlerine nafaka vermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kardeşlerin nafaka yükümlülükleri, refah içinde bulunmalarına bağlıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Eş ile ana ve babanın bakım borçlarına ilişkin hükümler saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Dava hakkı">
            <mvz-madde no="365" başlık="">
              <mvz-fıkra no="1">
                <template>Nafaka davası, mirasçılıktaki sıra göz önünde tutularak açılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Dava, davacının geçinmesi için gerekli ve karşı tarafın malî gücüne uygun bir yardım isteminden ibarettir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Nafakanın, yükümlülerin bir veya bir kaçından istenmesi hakkaniyete aykırıysa hâkim, onların nafaka yükümlülüğünü azaltabilir veya kaldırabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Dava, nafaka alacaklısına bakmakta olan resmî veya kamuya yararlı kurumlar tarafından da açılabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Hâkim, istem hâlinde, irat biçiminde ödenmesine karar verilen nafakanın gelecek yıllarda tarafların sosyal ve ekonomik durumlarına göre ne miktarda ödeneceğini karara bağlayabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Yetkili mahkeme, taraflardan birinin yerleşim yeri mahkemesidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Korunmaya muhtaç kişiler">
            <mvz-madde no="366" başlık="">
              <mvz-fıkra no="1">
                <template>Korunmaya muhtaç kişilerin bakımı, bununla yükümlü kurumlar tarafından sağlanır. Bu kurumlar, yaptıkları masrafları nafaka yükümlüsü hısımlardan isteyebilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="EV DÜZENİ">
          <mvz-b1 no="A" başlık="Koşulları">
            <mvz-madde no="367" başlık="">
              <mvz-fıkra no="1">
                <template>Aile hâlinde yaşayan birden çok kimsenin oluşturduğu topluluğun kanuna, sözleşmeye veya örfe göre belirlenen bir ev başkanı varsa, evi yönetme yetkisi ona ait olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Evi yönetme yetkisi, kan veya kayın hısımlığı, işçilik, çıraklık veya benzeri sebeplerle ya da koruma ve gözetme ilişkisi içinde ev halkı olarak bir arada yaşayanların hepsini kapsar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Hükümleri">
            <mvz-b2 no="I" başlık="Ev düzeni ve gözetim">
              <mvz-madde no="368" başlık="">
                <mvz-fıkra no="1">
                  <template>Birlikte yaşayan kimseler evin düzenine tâbidir. Bu düzenin kuruluşunda ev halkından her birinin yararı adil biçimde gözetilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ev halkının her biri, özellikle öğrenimi, eğitimi, dinî inançları, meslek ve sanatı için gerekli özgürlükten yararlanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ev başkanı, birlikte yaşayanların evdeki eşyasını özenle korumak ve güvenlik altında bulundurmakla yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Sorumluluk">
              <mvz-madde no="369" başlık="">
                <mvz-fıkra no="1">
                  <template>Ev başkanı, ev halkından olan küçüğün, kısıtlının, akıl hastalığı veya akıl zayıflığı bulunan kişinin verdiği zarardan, alışılmış şekilde durum ve koşulların gerektirdiği dikkatle onu gözetim altında bulundurduğunu veya bu dikkat ve özeni gösterseydi dahi zararın meydana gelmesini engelleyemeyeceğini ispat etmedikçe sorumludur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ev başkanı, ev halkından akıl hastalığı veya akıl zayıflığı bulunanların kendilerini ya da başkalarını tehlikeye veya zarara düşürmemeleri için gerekli önlemleri almakla yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Zorunluluk hâlinde gerekli önlemlerin alınmasını yetkili makamdan ister.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Altsoyun denkleştirme alacağı">
              <mvz-b3 no="1" başlık="Koşulları">
                <mvz-madde no="370" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ana ve baba veya büyük ana ve baba ile birlikte yaşayan ve emeklerini ya da gelirlerini aileye özgüleyen ergin altsoylar, buna karşılık uygun bir bedel isteyebilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Uyuşmazlık hâlinde hâkim, bedelin miktarı, güvence altına alınması ve ödeme şekli hakkında karar verir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="İstenmesi">
                <mvz-madde no="371" başlık="">
                  <mvz-fıkra no="1">
                    <template>Altsoy, bu bedeli borçlunun ölümü hâlinde isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacaklı, bu alacağını borçlunun sağlığında, birlikte yaşamanın sona ermesi veya işletmenin el değiştirmesi, borçluya karşı icra takibi yapılması veya onun iflâsı hâllerinde de isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bu alacak zamanaşımına uğramaz. Fakat en geç borçlunun terekesinin taksimi anına kadar istenebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="AİLE MALLARI">
          <mvz-b1 no="A" başlık="Aile vakfı">
            <mvz-madde no="372" başlık="">
              <mvz-fıkra no="1">
                <template>Aile bireylerinin eğitim ve öğrenimleri, donanım ve desteklenmeleri ve bunlara benzer amaçların gerektirdiği harcamaların yapılması için kişiler hukuku ve miras hukuku hükümleri uyarınca aile vakfı kurulabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bir malın veya hakkın başkalarına geçmemek üzere aynı soydan gelenlere kuşaktan kuşağa kalacak şekilde özgülenmesi yasaktır. Böyle bir özgülenme, vakıf kurma yoluyla da yapılamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Aile malları ortaklığı">
            <mvz-b2 no="I" başlık="Oluşumu">
              <mvz-b3 no="1" başlık="Koşulları">
                <mvz-madde no="373" başlık="">
                  <mvz-fıkra no="1">
                    <template>Hısımlar, kendilerine geçen mirasın tamamı veya bir bölümüyle ya da ortaya başka mallar koymak suretiyle aralarında bir aile malları ortaklığı kurabilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Şekil">
                <mvz-madde no="374" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aile malları ortaklığı sözleşmesinin resmî şekilde yapılması ve bütün ortakların veya temsilcilerinin imzalarını taşıması gerekir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Süre">
              <mvz-madde no="375" başlık="">
                <mvz-fıkra no="1">
                  <template>Aile malları ortaklığı, belirli veya belirsiz süre için kurulabilir. Süre belirlenmediği takdirde ortaklardan her biri, altı ay önceden bildirmek koşuluyla ortaklıktan çıkabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu bildirim, tarımsal işletme ile ilgili bir ortaklıkta, ancak ürünlerin yetiştiği yere göre olağan hasat mevsiminin sonu için geçerlidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Hükmü">
              <mvz-b3 no="1" başlık="Elbirliği ile işletme">
                <mvz-madde no="376" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aile malları ortaklığı, ortakları elbirliği ile iktisadî faaliyette bulunmak üzere birleştirir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Aksi kararlaştırılmış olmadıkça, ortaklardan her biri eşit hakka sahiptir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Ortaklar, ortaklık devam ettiği sürece paylarını isteyemeyecekleri gibi, bu payları üzerinde tasarruf işlemleri de yapamazlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Yönetim ve temsil">
                <mvz-b4 no="a" başlık="Genel olarak">
                  <mvz-madde no="377" başlık="">
                    <mvz-fıkra no="1">
                      <template>Aile malları ortaklığı, tüm ortakların elbirliği ile yönetilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Ortaklardan her biri, olağan yönetim işlerini diğer ortakların katılmasına gerek olmaksızın yapabilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Yöneticinin yetkisi">
                  <mvz-madde no="378" başlık="">
                    <mvz-fıkra no="1">
                      <template>Ortaklar, içlerinden birini ortaklığa yönetici olarak atayabilirler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Yönetici, ortaklığı yönetir ve ortaklıkla ilgili işlemlerde onu temsil eder.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Ortaklığı kimin temsil edeceği ticaret siciline kaydedilmiş olmadıkça diğer ortakların temsil yetkisi bulunmadığı iyiniyetli üçüncü kişilere karşı ileri sürülemez.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Ortak mallar ve kişisel mallar">
                <mvz-madde no="379" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ortaklar, ortaklığa giren malların elbirliği hâlinde malikidirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ortaklar, ortaklığın borçlarından müteselsil olarak sorumludurlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Ortakların, ortaklık dışında bıraktıkları mallar ile aksi kararlaştırılmış olmadıkça, ortaklığın devamı sırasında miras yoluyla veya herhangi bir şekilde karşılıksız kazanma yoluyla edindikleri mallar, onların kişisel mallarıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Ortaklığın sona ermesi">
              <mvz-b3 no="1" başlık="Sebepleri">
                <mvz-madde no="380" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıdaki hâllerde ortaklık sona erer:</template>
                    <mvz-bent no="1.">
                      <template>Bütün ortakların anlaşması veya feshin bildirilmesiyle,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Ortaklık süresi açıkça veya örtülü olarak uzatılmadığı takdirde sürenin bitmesiyle,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Ortaklardan birinin payının haczedilmesi ve satışının istenmesiyle,</template>
                    </mvz-bent>
                    <mvz-bent no="4.">
                      <template>Ortaklardan birinin iflâsıyla,</template>
                    </mvz-bent>
                    <mvz-bent no="5.">
                      <template>Ortaklardan birinin haklı sebebe dayanan istemiyle.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Fesih bildirimi, ödemeden aciz, evlenme">
                <mvz-madde no="381" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ortaklardan biri feshi bildirir veya iflâs ederse ya da bir ortağın haczedilmiş payının satışı istenirse, öteki ortaklar, ayrılan ortağın veya alacaklılarının haklarını ödeyerek ortaklığı kendi aralarında sürdürebilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Evlenen ortak, fesih bildirimine gerek olmaksızın ortaklıktaki hakkının kendisine ödenmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Ölüm">
                <mvz-madde no="382" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ortaklardan birinin ölümü hâlinde onun ortaklığa dahil olmayan mirasçıları, ancak ölen ortağa düşen payın karşılığının kendilerine ödenmesini isteyebilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ölen ortak mirasçı olarak altsoyunu bırakmışsa, bunlar öbür ortakların rızası ile onun yerine ortaklığa girebilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Paylaşma kuralları">
                <mvz-madde no="383" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ortaklık mallarının paylaşılması veya ayrılan ortağın payının hesaplanması, ortaklık mallarının paylaşma veya ayrılma zamanındaki değerine ve durumuna göre yapılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Paylaşma ve hesaplaşma uygun olmayan bir zamanda istenemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Kazanç paylı aile malları ortaklığı">
              <mvz-b3 no="1" başlık="Konusu">
                <mvz-madde no="384" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ortaklar, aralarında yapacakları sözleşmeyle, yıllık kazançtan kendilerine belli bir pay verilmesi kaydıyla ortaklığın temsilini ve ortaklığın mallarının işletilmesini içlerinden birine bırakabilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu pay, anlaşmayla belirlenmemişse, ortaklık mallarının uygun derecede uzun bir dönemdeki kazancın ortalama miktarı ile işleten ortağın çalışması ve yaptığı harcama göz önünde tutularak adil bir biçimde belirlenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Özel sona erdirme sebepleri">
                <mvz-madde no="385" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşletme ve temsili üzerine alan ortak, malları gereği gibi işletmediği veya yükümlülüklerini yerine getirmediği takdirde, ortakların ortaklığın feshini isteme hakları vardır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ortaklardan birinin, haklı sebeplere dayanarak istemde bulunması üzerine hâkim, mirastaki paylaşma kurallarını göz önünde bulundurarak, bu ortağın işletme ve temsili üzerine alan ortakla birlikte yönetime ve ortaklık mallarından yararlanmaya katılmasına karar verebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Ortakların elbirliği ile işlettikleri ortaklığa ilişkin kurallar, kazanç paylı aile malları ortaklığında da uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Aile yurdu">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="386" başlık="">
                <mvz-fıkra no="1">
                  <template>Konutlar, tarıma veya sanayiye elverişli taşınmazlar, eklentileriyle birlikte aile yurdu hâline getirilebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Kurulması">
              <mvz-b3 no="1" başlık="Koşulları">
                <mvz-madde no="387" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aile yurdu hâline getirilecek taşınmazların büyüklüğü, üzerindeki rehin haklarına ve malikin diğer mallarına bakılmaksızın, bir ailenin normal geçimine ve barınmasına yetecek ölçüden fazla olamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Mahkemece haklı sebeplere dayanılarak geçici bir istisna kabul edilmiş olmadıkça malikin, taşınmazı veya üzerindeki tesisi kendisinin işletmesi ya da konutta oturması zorunludur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Usul ve şekil">
                <mvz-b4 no="a" başlık="İlân">
                  <mvz-madde no="388" başlık="">
                    <mvz-fıkra no="1">
                      <template>Alacaklılar ve aile yurdu kurulması yüzünden haklarının zedelenmesi ihtimali bulunan kişiler, kuruluştan önce mahkemece yapılan ilânla itirazlarını iki ay içinde bildirmeye çağrılırlar.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Durum, alacakları taşınmaz rehniyle güvenceye bağlanmış olanlara ve hacizli alacaklılara ayrıca bildirilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Üçüncü kişilerin haklarının korunması">
                  <mvz-madde no="389" başlık="">
                    <mvz-fıkra no="1">
                      <template>Aile yurdu hâline getirilecek taşınmazda yurt olabilmesi için gerekli koşullar bulunur ve yurdun kurulmasına üçüncü kişiler itiraz etmez veya itirazın haksız olduğu anlaşılırsa, mahkeme kuruluşa izin verir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Süresi içinde itiraz eden alacaklıların ilgilerinin kesildiği ispat edilmedikçe veya taşınmaz üzerinde bulunan rehin ve hacizler kaldırılmadıkça, aile yurdu kurulmasına izin verilemez. Borç, itiraz eden veya rehinli alacaklı lehine vadeye bağlı olsa bile, aile yurdu kurmak isteyen borçlu hemen ödemede bulunabilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Tapu kütüğüne şerh verilmesi">
                  <mvz-madde no="390" başlık="">
                    <mvz-fıkra no="1">
                      <template>Bir taşınmazın aile yurdu hâline getirilmesi, ancak izne ilişkin mahkeme kararının o taşınmazın tapu kütüğüne şerh verilmesiyle mümkün olur; bu husus mahkemece ilân edilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Sonuçları">
              <mvz-b3 no="1" başlık="Tasarruf hakkının sınırlanması">
                <mvz-madde no="391" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aile yurdu hâline getirilen taşınmazlar devrolunamaz, rehnedilemez ve kiraya verilemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Aile yurdu ve eklentileri hakkında, mahkeme eliyle yönetim hâli saklı kalmak kaydıyla, cebrî icra yoluna başvurulamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Kan hısımlarının aile yurduna alınması">
                <mvz-madde no="392" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malikin, yoksulluğu sebebiyle aile yurduna alınmaya muhtaç bulunan ve kabullerine engel olacak durumları olmayan üstsoyunu, altsoyunu ve kardeşlerini yurda kabul etmesine mahkemece karar verilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Malikin ödemede acze düşmesi">
                <mvz-madde no="393" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malik borçlarını ödemede acze düşerse, aile yurdunu yönetmek üzere mahkemece bir yönetici atanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Yönetici, yurdu amacına ve alacaklıların menfaatlerine uygun biçimde yönetir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Alacaklılar, haklarını aciz belgelerindeki tarih ve iflâstaki sıraya göre alırlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Sona ermesi">
              <mvz-b3 no="1" başlık="Malikin ölümü hâlinde">
                <mvz-madde no="394" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malikin ölümünden sonra aile yurdunun devam edebilmesi, taşınmazın mirasçılara yurt olarak geçmesine ilişkin bir ölüme bağlı tasarrufun yapılmış olmasına bağlıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Böyle bir tasarruf yoksa, malik ölünce tapu kütüğündeki yurda ilişkin şerh silinir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Malikin sağlığında">
                <mvz-madde no="395" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malik sağlığında yurda son verebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bunun için malik, tapu kütüğündeki kaydı sildirmek üzere bir dilekçeyle mahkemeye başvurur; bu istem mahkemece ilân olunur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>İlân tarihinden başlayarak iki ay içinde bir itiraz yapılmaz veya yapılan itirazın haksızlığı anlaşılırsa, mahkeme kütükteki kaydın silinmesine izin verir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="3-ÜÇÜNCÜ" başlık="VESAYET">
      <mvz-bölüm no="1-BİRİNCİ" başlık="VESAYET DÜZENİ">
        <mvz-ayırım no="1-BİRİNCİ" başlık="VESAYET ORGANLARI">
          <mvz-b1 no="A" başlık="Genel olarak">
            <mvz-madde no="396" başlık="">
              <mvz-fıkra no="1">
                <template>Vesayet organları, vesayet daireleri ile vasi ve kayyımlardır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Vesayet daireleri">
            <mvz-b2 no="I" başlık="Kamu vesayeti">
              <mvz-madde no="397" başlık="">
                <mvz-fıkra no="1">
                  <template>Kamu vesayeti, vesayet makamı ve denetim makamından oluşan vesayet daireleri tarafından yürütülür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vesayet makamı, sulh hukuk mahkemesi; denetim makamı, asliye hukuk mahkemesidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Özel vesayet">
              <mvz-b3 no="1" başlık="Koşulları">
                <mvz-madde no="398" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vesayet altındaki kişinin menfaatinin haklı gösterdiği, özellikle bir işletmenin, bir ortaklığın veya benzeri işlerin sürdürülmesi gerektiği takdirde vesayet istisnaî olarak bir aileye verilebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu durumda vesayet makamının yetki, görev ve sorumluluğu kurulacak aile meclisine geçer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Kurulması">
                <mvz-madde no="399" başlık="">
                  <mvz-fıkra no="1">
                    <template>Özel vesayet, vesayet altına alınan kişinin fiil ehliyetine sahip iki yakın hısımının veya bir hısımı ile eşinin istemi üzerine denetim makamı tarafından kurulur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Aile meclisi">
                <mvz-madde no="400" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aile meclisi, vesayet altındaki kişinin vasi olmaya ehil, denetim makamınca dört yıl için atanacak en az üç hısımından oluşur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Vesayet altına alınanın eşi de aile meclisine üye olabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Güvence">
                <mvz-madde no="401" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aile meclisi üyeleri, görevlerini gereği gibi yerine getireceklerine dair güvence vermek zorundadırlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Güvence sağlanmadan özel vesayet kurulamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="5" başlık="Sona ermesi">
                <mvz-madde no="402" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aile meclisi görevini yapmadığı veya vesayet altındaki kişinin menfaati gerektirdiği takdirde, denetim makamı her zaman aile meclisini değiştirebileceği gibi özel vesayeti de sona erdirebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Vasi ve kayyım">
            <mvz-madde no="403" başlık="">
              <mvz-fıkra no="1">
                <template>Vasi, vesayet altındaki küçüğün veya kısıtlının kişiliği ve malvarlığı ile ilgili bütün menfaatlerini korumak ve hukukî işlemlerde onu temsil etmekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kayyım, belirli işleri görmek veya malvarlığını yönetmek için atanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bu Kanunun vasi hakkındaki hükümleri, aksi belirtilmiş olmadıkça kayyım hakkında da uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="VESAYETİ GEREKTİREN HÂLLER">
          <mvz-b1 no="A" başlık="Küçüklük">
            <mvz-madde no="404" başlık="">
              <mvz-fıkra no="1">
                <template>Velâyet altında bulunmayan her küçük vesayet altına alınır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Görevlerini yaparlarken vesayeti gerektiren böyle bir hâlin varlığını öğrenen nüfus memurları, idarî makamlar, noterler ve mahkemeler, bu durumu hemen yetkili vesayet makamına bildirmek zorundadırlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Kısıtlama">
            <mvz-b2 no="I" başlık="Akıl hastalığı veya akıl zayıflığı">
              <mvz-madde no="405" başlık="">
                <mvz-fıkra no="1">
                  <template>Akıl hastalığı veya akıl zayıflığı sebebiyle işlerini göremeyen veya korunması ve bakımı için kendisine sürekli yardım gereken ya da başkalarının güvenliğini tehlikeye sokan her ergin kısıtlanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Görevlerini yaparlarken vesayet altına alınmayı gerekli kılan bir durumun varlığını öğrenen idarî makamlar, noterler ve mahkemeler, bu durumu hemen yetkili vesayet makamına bildirmek zorundadırlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Savurganlık, alkol veya uyuşturucu madde bağımlılığı, kötü yaşama tarzı, kötü yönetim">
              <mvz-madde no="406" başlık="">
                <mvz-fıkra no="1">
                  <template>Savurganlığı, alkol veya uyuşturucu madde bağımlılığı, kötü yaşama tarzı veya malvarlığını kötü yönetmesi sebebiyle kendisini veya ailesini darlık veya yoksulluğa düşürme tehlikesine yol açan ve bu yüzden devamlı korunmaya ve bakıma muhtaç olan ya da başkalarının güvenliğini tehdit eden her ergin kısıtlanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Özgürlüğü bağlayıcı ceza">
              <mvz-madde no="407" başlık="">
                <mvz-fıkra no="1">
                  <template>Kesinleşmiş hapis cezasının infazı amacıyla ceza infaz kurumunda bulunan ergin bir kişi, isteği üzerine kısıtlanır veya kendisine kayyım atanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Toplam beş yıl veya daha fazla kesinleşmiş hapis cezasının infazı amacıyla ceza infaz kurumunda bulunan ergin bir kişi, isteği bulunmasa dahi kişiliğinin veya malvarlığının korunması bakımından gerekli görülmesi hâlinde kısıtlanabilir. Cezayı yerine getirmekle görevli makam hapis cezasının infazına başlandığını derhâl vesayet makamına bildirir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Vesayet makamı karar vermeden önce hükümlüyü dinler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Bu Kanunun kayyımlığa ilişkin hükümleri niteliğine uygun düştüğü ölçüde bu madde için de uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="İstek üzerine">
              <mvz-madde no="408" başlık="">
                <mvz-fıkra no="1">
                  <template>Yaşlılığı, engelliliği, deneyimsizliği veya ağır hastalığı sebebiyle işlerini gerektiği gibi yönetemediğini ispat eden her ergin kısıtlanmasını isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Usul">
            <mvz-b2 no="I" başlık="İlgilinin dinlenilmesi ve bilirkişi raporu">
              <mvz-madde no="409" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir kimse dinlenilmeden savurganlığı, alkol veya uyuşturucu madde bağımlılığı, kötü yaşama tarzı, kötü yönetimi veya isteği sebebiyle kısıtlanamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Akıl hastalığı veya akıl zayıflığı sebebiyle kısıtlamaya ancak resmî sağlık kurulu raporu üzerine karar verilir.  Resmî sağlık kurulu raporunun tanzimi için gereklilik bulunması halinde 436 ncı madde hükümleri uygulanır. Hâkim, karar vermeden önce, kurul raporunu göz önünde tutarak kısıtlanması istenen kişiyi dinleyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="İlân">
              <mvz-madde no="410" başlık="">
                <mvz-fıkra no="1">
                  <template>Kısıtlama kararı, kesinleşince hemen kısıtlının yerleşim yeri ile nüfusa kayıtlı olduğu yerde ilân olunur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kısıtlama, iyiniyetli üçüncü kişileri ilândan önce etkilemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ayırt etme gücüne sahip olmamanın sonuçlarına ilişkin hükümler saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="YETKİ">
          <mvz-b1 no="A" başlık="Vesayet işlerinde yetki">
            <mvz-madde no="411" başlık="">
              <mvz-fıkra no="1">
                <template>Vesayet işlerinde yetki küçüğün veya kısıtlının yerleşim yerindeki vesayet dairelerine aittir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Yerleşim yerinin değişmesi">
            <mvz-madde no="412" başlık="">
              <mvz-fıkra no="1">
                <template>Vesayet makamının izni olmadıkça vesayet altındaki kişi yerleşim yerini değiştiremez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yerleşim yerinin değişmesi hâlinde yetki, yeni vesayet dairelerine geçer. Bu takdirde kısıtlama yeni yerleşim yerinde ilân olunur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="VASİNİN ATANMASI">
          <mvz-b1 no="A" başlık="Koşulları">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="413" başlık="">
                <mvz-fıkra no="1">
                  <template>Vesayet makamı, bu görevi yapabilecek yetenekte olan bir ergini vasi olarak atar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Gereken durumlarda, bu görevi birlikte veya vesayet makamı tarafından belirlenen yetkileri uyarınca ayrı ayrı yerine getirmek üzere birden çok vasi atanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Rızaları bulunmadıkça birden çok kimse vesayeti birlikte yürütmekle görevlendirilemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Eşin ve hısımların önceliği">
              <mvz-madde no="414" başlık="">
                <mvz-fıkra no="1">
                  <template>Haklı sebepler engel olmadıkça, vesayet makamı, vesayet altına alınacak kişinin öncelikle eşini veya yakın hısımlarından birini, vasilik koşullarına sahip olmaları kaydıyla bu göreve atar. Bu atamada yerleşim yerlerinin yakınlığı ve kişisel ilişkiler göz önünde tutulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="İlgililerin isteği">
              <mvz-madde no="415" başlık="">
                <mvz-fıkra no="1">
                  <template>Haklı sebepler engel olmadıkça, vasiliğe, vesayet altına alınacak kişinin ya da ana veya babasının gösterdiği kimse atanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Vasiliği kabul yükümlülüğü">
              <mvz-madde no="416" başlık="">
                <mvz-fıkra no="1">
                  <template>Vesayet altına alınan kimsenin yerleşim yerinde oturanlardan vasiliğe atananlar, bu görevi kabul etmekle yükümlüdürler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Aile meclisince atanma hâlinde vasiliği kabul yükümlülüğü yoktur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Vasilikten kaçınma sebepleri">
              <mvz-madde no="417" başlık="">
                <mvz-fıkra no="1">
                  <template>Aşağıdaki kişiler vasiliği kabul etmeyebilirler:</template>
                  <mvz-bent no="1.">
                    <template>Altmış yaşını doldurmuş olanlar,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Bedensel engelleri veya sürekli hastalıkları sebebiyle bu görevi güçlükle yapabilecek olanlar,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Dörtten çok çocuğun velisi olanlar,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Üzerinde vasilik görevi olanlar,</template>
                  </mvz-bent>
                  <mvz-bent no="5.">
                    <template>Cumhurbaşkanı, Türkiye Büyük Millet Meclisi üyeleri, Cumhurbaşkanı yardımcıları, bakanlar, hâkimlik ve savcılık mesleği mensupları.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Vasiliğe engel olan sebepler">
              <mvz-madde no="418" başlık="">
                <mvz-fıkra no="1">
                  <template>Aşağıdaki kişiler vasi olamazlar:</template>
                  <mvz-bent no="1.">
                    <template>Kısıtlılar,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Kamu hizmetinden yasaklılar veya haysiyetsiz hayat sürenler,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Menfaati kendisine vasi atanacak kişinin menfaati ile önemli ölçüde çatışanlar veya onunla aralarında düşmanlık bulunanlar,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>İlgili vesayet daireleri hâkimleri.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Atama usulü">
            <mvz-b2 no="I" başlık="Vasinin atanması">
              <mvz-madde no="419" başlık="">
                <mvz-fıkra no="1">
                  <template>Vesayet makamı, gecikmeksizin vasi atamakla yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Gerek duyulduğunda henüz ergin olmayanların da kısıtlanmasına karar verilebilir; ancak, kısıtlama kararı ergin olduktan sonra sonuç doğurur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kısıtlanan ergin çocuklar kural olarak vesayet altına alınmayıp velâyet altında bırakılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Geçici önlemler">
              <mvz-madde no="420" başlık="">
                <mvz-fıkra no="1">
                  <template>Vesayet işleri zorunlu kıldığı takdirde vesayet makamı, vasinin atanmasından önce de re'sen gerekli önlemleri alır; özellikle, kısıtlanması istenen kişinin fiil ehliyetini geçici olarak kaldırabilir ve ona bir temsilci atayabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vesayet makamının kararı ilân olunur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Tebliğ ve ilân">
              <mvz-madde no="421" başlık="">
                <mvz-fıkra no="1">
                  <template>Atama kararı vasiye hemen tebliğ olunur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kısıtlamaya ve vasi atanmasına veya kısıtlanan velâyet altında bırakılmışsa buna ilişkin karar, kısıtlının yerleşim yerinde ve nüfusa kayıtlı olduğu yerde ilân olunur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Kaçınma ve itiraz">
              <mvz-b3 no="1" başlık="Usul">
                <mvz-madde no="422" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vasiliğe atanan kişi, bu durumun kendisine tebliğinden başlayarak on gün içinde vasilikten kaçınma hakkını kullanabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İlgili olan herkes, vasinin atandığını öğrendiği günden başlayarak on gün içinde atamanın kanuna aykırı olduğunu ileri sürebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Vesayet makamı, vasilikten kaçınma veya itiraz sebebini yerinde görürse yeni bir vasi atar; yerinde görmediği takdirde, bu konudaki görüşü ile birlikte gerekli kararı vermek üzere durumu denetim makamına bildirir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Geçici görev">
                <mvz-madde no="423" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vasiliğe atanan kimse, vasilikten kaçınmış veya atanmasına itiraz edilmiş olsa bile, yerine bir başkası atanıncaya kadar vasiye ait görevleri yerine getirmekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Karar">
                <mvz-madde no="424" başlık="">
                  <mvz-fıkra no="1">
                    <template>Denetim makamı, vereceği kararı vasiliğe atanmış olan kimseye ve vesayet makamına bildirir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Vasiliğe atananın görevden alınması hâlinde vesayet makamı, hemen yeni bir vasi atar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Görevin verilmesi">
              <mvz-madde no="425" başlık="">
                <mvz-fıkra no="1">
                  <template>Atama kararı kesinleşince vesayet makamı vasinin göreve başlaması için gerekli işlemleri yapar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="5-BEŞİNCİ" başlık="KAYYIMLIK VE YASAL DANIŞMANLIK">
          <mvz-b1 no="A" başlık="Kayyımlığı gerektiren hâller">
            <mvz-b2 no="I" başlık="Temsil">
              <mvz-madde no="426" başlık="">
                <mvz-fıkra no="1">
                  <template>Vesayet makamı, aşağıda yazılı olan veya kanunda gösterilen diğer hâllerde ilgilisinin isteği üzerine veya re'sen temsil kayyımı atar:</template>
                  <mvz-bent no="1.">
                    <template>Ergin bir kişi, hastalığı, başka bir yerde bulunması veya benzeri bir sebeple ivedi bir işini kendisi görebilecek veya bir temsilci atayabilecek durumda değilse,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Bir işte yasal temsilcinin menfaati ile küçüğün veya kısıtlının menfaati çatışıyorsa,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Yasal temsilcinin görevini yerine getirmesine bir engel varsa.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Yönetim">
              <mvz-b3 no="1" başlık="Kanun gereği">
                <mvz-madde no="427" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vesayet makamı, yönetimi kimseye ait olmayan mallar için gereken önlemleri alır ve özellikle aşağıdaki hâllerde bir yönetim kayyımı atar:</template>
                    <mvz-bent no="1.">
                      <template>Bir kimse uzun süreden beri bulunamaz ve oturduğu yer de bilinemezse,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Vesayet altına alınması için yeterli bir sebep bulunmamakla beraber, bir kişi malvarlığını kendi başına yönetmek veya bunun için temsilci atamak gücünden yoksunsa,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Bir terekede mirasçılık hakları henüz belli değilse veya ceninin menfaatleri gerekli kılarsa,</template>
                    </mvz-bent>
                    <mvz-bent no="4.">
                      <template>Bir tüzel kişi gerekli organlardan yoksun kalmış ve yönetimi başka yoldan sağlanamamışsa,</template>
                    </mvz-bent>
                    <mvz-bent no="5.">
                      <template>Bir hayır işi veya genel yarar amacı güden başka bir iş için halktan toplanan para ve sair yardımı yönetme veya harcama yolu sağlanamamışsa.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="İstek üzerine">
                <mvz-madde no="428" başlık="">
                  <mvz-fıkra no="1">
                    <template>İsteğe bağlı kısıtlama sebeplerinden biri varsa, ergin bir kişiye kendi isteği üzerine bir kayyım atanabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Yasal danışmanlık">
            <mvz-madde no="429" başlık="">
              <mvz-fıkra no="1">
                <template>Kısıtlanması için yeterli sebep bulunmamakla beraber korunması bakımından fiil ehliyetinin sınırlanması gerekli görülen ergin bir kişiye aşağıdaki işlerde görüşü alınmak üzere bir yasal danışman atanır:</template>
                <mvz-bent no="1.">
                  <template>Dava açma ve sulh olma,</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Taşınmazların alımı, satımı, rehnedilmesi ve bunlar üzerinde başka bir aynî hak kurulması,</template>
                </mvz-bent>
                <mvz-bent no="3.">
                  <template>Kıymetli evrakın alımı, satımı ve rehnedilmesi,</template>
                </mvz-bent>
                <mvz-bent no="4.">
                  <template>Olağan yönetim sınırları dışında kalan yapı işleri,</template>
                </mvz-bent>
                <mvz-bent no="5.">
                  <template>Ödünç verme ve alma,</template>
                </mvz-bent>
                <mvz-bent no="6.">
                  <template>Ana parayı alma,</template>
                </mvz-bent>
                <mvz-bent no="7.">
                  <template>Bağışlama,</template>
                </mvz-bent>
                <mvz-bent no="8.">
                  <template>Kambiyo taahhüdü altına girme,</template>
                </mvz-bent>
                <mvz-bent no="9.">
                  <template>Kefil olma.</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aynı koşullar altında bir kimsenin malvarlığını yönetme yetkisi, gelirlerinde dilediği gibi tasarruf hakkı saklı kalmak üzere kaldırılabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Yetki">
            <mvz-madde no="430" başlık="">
              <mvz-fıkra no="1">
                <template>Temsil kayyımı, kendisine kayyım atanacak kimsenin yerleşim yeri vesayet makamı tarafından atanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yönetim kayyımı, malvarlığının büyük bölümünün yönetildiği veya temsil edilen kimsenin payına düşen malların bulunduğu yer vesayet makamı tarafından atanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Usul">
            <mvz-madde no="431" başlık="">
              <mvz-fıkra no="1">
                <template>Vasinin atanması usulüne ilişkin kurallar, kayyım ve yasal danışmanın atanmasında da uygulanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kayyım veya yasal danışman atanmasına ilişkin karar, ancak vesayet makamının gerekli görmesi hâlinde ilân olunur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="6-ALTINCI" başlık="KORUMA AMACIYLA ÖZGÜRLÜĞÜN KISITLANMASI">
          <mvz-b1 no="A" başlık="Koşulları">
            <mvz-madde no="432" başlık="">
              <mvz-fıkra no="1">
                <template>Akıl hastalığı, akıl zayıflığı, alkol veya uyuşturucu madde bağımlılığı, ağır tehlike arzeden bulaşıcı hastalık veya serserilik sebeplerinden biriyle toplum için tehlike oluşturan her ergin kişi, kişisel korunmasının başka şekilde sağlanamaması hâlinde, tedavisi, eğitimi veya ıslahı için elverişli bir kuruma yerleştirilir veya alıkonulabilir. Görevlerini yaparlarken bu sebeplerden birinin varlığını öğrenen kamu görevlileri, bu durumu hemen yetkili vesayet makamına bildirmek zorundadırlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu konuda kişinin çevresine getirdiği külfet de göz önünde tutulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>İlgili kişi durumu elverir elvermez kurumdan çıkarılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Yetki">
            <mvz-madde no="433" başlık="">
              <mvz-fıkra no="1">
                <template>Yerleştirme veya alıkoymaya karar verme yetkisi, ilgilinin yerleşim yeri veya gecikmesinde sakınca bulunan hâllerde bulunduğu yer vesayet makamına aittir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yerleştirme veya alıkoymaya karar veren vesayet makamı, kurumdan çıkarmaya da yetkilidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Bildirim yükümlülüğü">
            <mvz-madde no="434" başlık="">
              <mvz-fıkra no="1">
                <template>Kısıtlı bir kişi bir kuruma yerleştirildiği veya alıkonulduğu ya da ergin bir kişi hakkında vesayete ilişkin diğer önlemlerin alınmasına gerek görüldüğü takdirde, kişinin bulunduğu yer vesayet makamı veya özel kanunlarda öngörülen ilgililer, durumu yerleşim yeri vesayet makamına bildirmekle yükümlüdürler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="İtiraz">
            <mvz-madde no="435" başlık="">
              <mvz-fıkra no="1">
                <template>Kuruma yerleştirilen kişi veya yakınları, verilen karara karşı kendilerine bildirilmesinden başlayarak on gün içinde denetim makamına itiraz edebilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu hak, kurumdan çıkarılma isteminin reddi hâlinde de kullanılabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Usul">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="436" başlık="">
                <mvz-fıkra no="1">
                  <template>Koruma amacıyla özgürlüğün kısıtlanması, aşağıdaki kurallar saklı kalmak üzere, Hukuk Usulü Muhakemeleri Kanununa tâbidir:</template>
                  <mvz-bent no="1.">
                    <template>Karar verilirken ilgilinin bunun sebepleri hakkında bilgilendirilmesi ve karara karşı denetim makamına itiraz edebileceğine yazılı olarak dikkatinin çekilmesi zorunludur.</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Bir kuruma yerleştirilen kişiye, alıkonulma kararına veya kurumdan çıkarılma isteminin reddine karşı en geç on gün içinde denetim makamına itiraz edebileceği derhal yazılı olarak bildirilir.</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Mahkeme kararını gerektiren her istem, gecikmeksizin yetkili hâkime ulaştırılır.</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Yerleştirme kararı veren vesayet makamı veya hâkim durumun özelliklerine göre bu istemin görüşülmesini erteleyebilir.</template>
                  </mvz-bent>
                  <mvz-bent no="5.">
                    <template>Akıl hastalığı, akıl zayıflığı, alkol veya uyuşturucu madde bağımlılığı, ağır tehlike arzeden bulaşıcı hastalığı olanlar hakkında, ancak resmî sağlık kurulu raporu alındıktan sonra karar verilebilir.</template>
                  </mvz-bent>
                  <mvz-bent no="6.">
                    <template>Resmî sağlık kurulu raporunun alınabilmesini temin amacıyla; kişinin vücudundan kan veya benzeri biyolojik örneklerle kıl, tükürük, tırnak gibi örnekler alınabilir, kişiye gerekli tıbbi müdahaleler yapılabilir ve gerektiğinde kişi, hekim ön raporu üzerine en fazla yirmi gün süreyle sağlık kuruluşuna yerleştirilebilir. Hekim ön raporu üzerine verilen yerleştirme kararı derhâl ilgiliye ve yakınlarına bildirilir. İlgili veya yakınları, bu karara karşı bildirimden itibaren on gün içinde denetim makamına itiraz edebilir, yapılan itiraz kararın icrasını durdurmaz. İtiraz denetim makamınca ivedilikle karara bağlanır.</template>
                  </mvz-bent>
                  <mvz-bent no="7.">
                    <template>Bu madde kapsamında alınan kararların icrası için gerektiğinde ilgili kişi hakkında zor kullanılabilir ve sağlık görevlilerinden gerekli tıbbi yardım alınabilir.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Yargılama usulü">
              <mvz-madde no="437" başlık="">
                <mvz-fıkra no="1">
                  <template>Hâkim, basit yargılama usulüne göre karar verir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Gerektiğinde ilgili kişiye adlî yardım sağlanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Hâkim, ilgili kişiyi dinler, tahkikatı tamamlar ve gecikmeksizin en geç iki gün içinde kararını verir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="VESAYETİN YÜRÜTÜLMESİ">
        <mvz-ayırım no="1-BİRİNCİ" başlık="VASİNİN GÖREVLERİ">
          <mvz-b1 no="A" başlık="Göreve başlama">
            <mvz-b2 no="I" başlık="Defter tutma">
              <mvz-madde no="438" başlık="">
                <mvz-fıkra no="1">
                  <template>Vasiliğe atanma kararının kesinleşmesi üzerine vasi ile vesayet makamının görevlendireceği bir kişi tarafından, vakit geçirilmeksizin, yönetilecek malvarlığının defteri tutulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vesayet altındaki kişi ayırt etme gücüne sahipse, olanak bulunduğu takdirde defter tutulurken hazır bulundurulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Koşullar gerektirdiği takdirde denetim makamı, vasi ve vesayet makamının isteği üzerine vesayet altındaki kişinin malvarlığının resmî defterinin tutulmasına karar verebilir. Bu defter, mirastaki resmî defterin alacaklılara karşı doğurduğu sonuçları doğurur ve oradaki usul uyarınca tutulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Değerli şeylerin saklanması">
              <mvz-madde no="439" başlık="">
                <mvz-fıkra no="1">
                  <template>Kıymetli evrak, değerli eşya, önemli belge ve benzerleri, malvarlığının yönetimi bakımından bir sakınca yoksa, vesayet makamının gözetimi altında güvenli bir yere konulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Taşınırların satılması">
              <mvz-madde no="440" başlık="">
                <mvz-fıkra no="1">
                  <template>Vesayet altındaki kişinin menfaati gerektirirse değerli şeylerin dışındaki taşınırlar, vesayet makamının vereceği talimat uyarınca, açık artırma ile satılır. Hâkim, özel durumları, taşınırın niteliğini veya değerinin azlığını göz önüne alarak pazarlıkla satışa da karar verebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vesayet altındaki kişinin kendisi veya ailesi için özel bir değer taşıyan şeyler, zorunluluk olmadıkça satılamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Paraların yatırılması">
              <mvz-b3 no="1" başlık="Yatırma zorunluluğu">
                <mvz-madde no="441" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vesayet altındaki kişinin kendisi veya malvarlığının yönetimi için gerekli olmayan paralar, faiz getirmek üzere, vesayet makamı tarafından belirlenen millî bir bankaya yatırılır veya Hazine tarafından çıkarılan menkul kıymetlere çevrilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Paranın yatırılmasını bir aydan fazla geciktiren vasi, faiz kaybını ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Yatırımların dönüştürülmesi">
                <mvz-madde no="442" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yeteri kadar güven verici olmayan yatırımlar, güvenli yatırımlara dönüştürülür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Dönüştürme işleminin uygun zamanda ve vesayet altındaki kişinin menfaati gözetilerek yapılması gerekir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Ticarî ve sınaî işletmeler">
              <mvz-madde no="443" başlık="">
                <mvz-fıkra no="1">
                  <template>Vesayet altındaki kişinin malvarlığı içinde ticarî, sınaî veya benzeri bir işletme varsa; vesayet makamı, bunların işletilmesinin devamı veya tasfiyesi için gerekli talimatı verir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Taşınmazların satılması">
              <mvz-madde no="444" başlık="">
                <mvz-fıkra no="1">
                  <template>Taşınmazların satışı, vesayet makamının talimatı uyarınca ve ancak vesayet altındaki kişinin menfaati gerekli kıldığı hâllerde mümkündür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Satış, vesayet makamının bu iş için görevlendireceği bir kişi tarafından vasi de hazır olduğu hâlde açık artırmayla yapılır ve ihale vesayet makamının onamasıyla tamam olur; onamaya ilişkin kararın ihale gününden başlayarak on gün içinde verilmesi gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ancak denetim makamı, istisnaî olarak özel durumları, taşınmazın niteliğini veya değerinin azlığını göz önüne alarak pazarlıkla satışa da karar verebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Özen ve temsil">
            <mvz-b2 no="I" başlık="Kişiye özen">
              <mvz-b3 no="1" başlık="Küçüklerde">
                <mvz-b4 no="a" başlık="Genel olarak">
                  <mvz-madde no="445" başlık="">
                    <mvz-fıkra no="1">
                      <template>Vesayet altındaki kişi küçük ise, vasi onun bakımı ve eğitimi için gereken önlemleri almakla yükümlüdür.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Vesayet dairelerinin yetkilerine ilişkin hükümler saklı kalmak kaydıyla, vasi bu konuda ana ve babanın yetkilerine sahiptir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Koruma amacıyla özgürlüğün kısıtlanması">
                  <mvz-madde no="446" başlık="">
                    <mvz-fıkra no="1">
                      <template>Küçüklerin koruma amacıyla bir kuruma yerleştirilmesine vasinin başvurusu üzerine vesayet makamı veya gecikmesinde sakınca bulunan hâllerde bizzat vasi karar verir ve durumu derhâl vesayet makamına bildirir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bunun dışında usul ve yetkiyle ilgili konularda kısıtlı olsun veya olmasın erginlerin korunması amacıyla özgürlüklerinin kısıtlanmasına ilişkin hükümler uygulanır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Onaltı yaşını doldurmamış çocuk bu konuda mahkemeye bizzat başvuramaz.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Kısıtlılarda">
                <mvz-madde no="447" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vasi, kısıtlıyı korumak ve bütün kişisel işlerinde ona yardım etmekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Gecikmesinde sakınca bulunan hâllerde vasi, koruma amacıyla özgürlüğün kısıtlanmasına ilişkin hükümlere göre kısıtlıyı bir kuruma yerleştirebilir veya orada alıkoyabilir ve durumu derhal vesayet makamına bildirir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Temsil">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="448" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vesayet dairelerinin yetkilerine ilişkin hükümler saklı kalmak kaydıyla vasi, vesayet altındaki kişiyi bütün hukukî işlemlerinde temsil eder.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Yasak işlemler">
                <mvz-madde no="449" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vesayet altındaki kişi adına kefil olmak, vakıf kurmak ve önemli bağışlarda bulunmak yasaktır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Vesayet altındaki kişinin görüşünün alınması">
                <mvz-madde no="450" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vesayet altındaki kişi görüşlerini oluşturma ve açıklama yeteneğine sahipse, vasi önemli işlerde karar vermeden önce olanak ölçüsünde, onun görüşünü almakla yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Vesayet altındaki kişinin işi uygun bulmuş olması vasiyi sorumluluktan kurtarmaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Vesayet altındaki kişinin yapabileceği işler">
                <mvz-b4 no="a" başlık="Vasinin rızası">
                  <mvz-madde no="451" başlık="">
                    <mvz-fıkra no="1">
                      <template>Ayırt etme gücüne sahip olan vesayet altındaki kişi, vasinin açık veya örtülü izni veya sonraki onamasıyla yükümlülük altına girebilir veya bir haktan vazgeçebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Yapılan işlem diğer tarafın belirlediği veya başvurusu üzerine hâkimin belirleyeceği uygun bir süre içinde onanmazsa, diğer taraf bununla bağlı olmaktan kurtulur.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Onamamanın sonucu">
                  <mvz-madde no="452" başlık="">
                    <mvz-fıkra no="1">
                      <template>Vasinin onamadığı işlemlerde taraflardan her biri verdiğini geri isteyebilir. Ancak, vesayet altındaki kişi, sadece kendi menfaatine harcanan veya geri isteme zamanında malvarlığında mevcut olan zenginleşme tutarıyla ya da iyiniyetli olmaksızın elden çıkarmış olduğu miktarla sorumludur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Vesayet altındaki kişi, fiil ehliyetine sahip olduğu hususunda diğer tarafı yanıltmış ise, onun bu yüzden uğradığı zarardan sorumlu olur.</template>
                    </mvz-fıkra>
