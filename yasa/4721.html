                  <template>Mirasçılardan birinin karşı çıkması hâlinde, nitelikleri veya özgülendikleri amaç gereği bir bütünlük oluşturan eşya birbirinden ayrılamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Aile belgeleri ile aile için özel anı değeri olan eşya, mirasçılardan birinin karşı çıkması hâlinde satılamaz. Mirasçılar arasında anlaşmazlık çıkarsa sulh hâkimi, yerel âdetleri, âdet yoksa kişisel durumları göz önünde tutarak bu eşyanın, payına mahsup edilmek veya edilmemek suretiyle mirasçılardan birine özgülenmesine ya da satılmasına karar verir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Özel kanun hükümleri saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Mirasbırakanın mirasçılardaki alacakları">
              <mvz-madde no="654" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakanın bir mirasçıdaki alacağı, paylaşma sırasında o mirasçının payına mahsup edilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Rehnedilmiş tereke malları">
              <mvz-madde no="655" başlık="">
                <mvz-fıkra no="1">
                  <template>Paylaşmada kendisine mirasbırakanın borçları için rehnedilmiş bir tereke malı düşen mirasçı, o malın güvence altına aldığı borcu üstlenmiş olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Taşınmazlar">
              <mvz-b3 no="1" başlık="Bölünme">
                <mvz-madde no="656" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmazların bölünmelerine ilişkin kanun hükümleri saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Özgülenme">
                <mvz-b4 no="a" başlık="Özgülenmeye esas olan değer">
                  <mvz-madde no="657" başlık="">
                    <mvz-fıkra no="1">
                      <template>Taşınmazlar, paylaşmanın yapıldığı zamandaki gerçek değerleri esas alınarak mirasçılara özgülenir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Tarımsal taşınmazlar gelir değerine, diğer taşınmazlar sürüm değerine göre özgülenir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Değerin belirlenmesi">
                  <mvz-madde no="658" başlık="">
                    <mvz-fıkra no="1">
                      <template>Mirasçılar özgülenme değeri üzerinde uyuşamazlarsa, bu değer sulh hâkimi tarafından belirlenir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>

        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="MİRASTA DENKLEŞTİRME">
          <mvz-b1 no="A" başlık="Mirasçılar arasında">
            <mvz-madde no="669" başlık="">
              <mvz-fıkra no="1">
                <template>Yasal mirasçılar, mirasbırakandan miras paylarına mahsuben elde ettikleri sağlararası karşılıksız kazandırmaları, denkleştirmeyi sağlamak için terekeye geri vermekle birbirlerine karşı yükümlüdürler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Mirasbırakanın çeyiz veya kuruluş sermayesi vermek ya da bir malvarlığını devretmek veya borçtan kurtarmak ve benzerleri gibi karşılık almaksızın altsoyuna yapmış olduğu kazandırmalar, aksi mirasbırakan tarafından açıkça belirtilmiş olmadıkça, denkleştirmeye tâbidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Mirasçılık sıfatının kaybı hâlinde">
            <mvz-madde no="670" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasın açılmasından önce veya sonra mirasçılık sıfatını kaybeden mirasçıya ait geri verme yükümlülüğü, onun yerini alan mirasçılara, miras paylarında meydana gelen artış oranında geçer.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Denkleştirme şekli">
            <mvz-b2 no="I" başlık="Geri verme veya mahsup">
              <mvz-madde no="671" başlık="">
                <mvz-fıkra no="1">
                  <template>Geri vermekle yükümlü olan mirasçı, dilerse aldığını aynen geri verir; dilerse payından fazla olsa bile değerini miras payına mahsup ettirir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasbırakanın bu kurala aykırı tasarrufları ve mirasçıların tenkise ilişkin hakları saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Miras payını aşan kazandırmalar">
              <mvz-madde no="672" başlık="">
                <mvz-fıkra no="1">
                  <template>Yapılan kazandırma miras payını aştığı takdirde mirasçı, mirasbırakanın bunu kendisine bırakmak istediğini ispat ederse, bu fazlalık denkleştirmeye tâbi olmaz. Diğer mirasçıların tenkise ilişkin hakları saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Denkleştirme değeri">
              <mvz-madde no="673" başlık="">
                <mvz-fıkra no="1">
                  <template>Denkleştirme, kazandırmanın denkleştirme anındaki değerine göre yapılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yarar ve zarar ile gelir ve giderler hakkında mirasçılar arasında sebepsiz zenginleşme hükümleri uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Eğitim ve öğrenim giderleri">
            <mvz-madde no="674" başlık="">
              <mvz-fıkra no="1">
                <template>Çocukların eğitim ve öğrenimi için yapılan giderler sebebiyle geri verme yükümlülüğü, mirasbırakanın aksini arzu ettiği ispat edilmedikçe, ancak alışılmış ölçüleri aşan kısım için mevcuttur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eğitim ve öğrenimini tamamlamamış olan veya engelliliği bulunan çocuklara, paylaşmada hakkaniyete uygun bir ödeme yapılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Hediyeler ve evlenme giderleri">
            <mvz-madde no="675" başlık="">
              <mvz-fıkra no="1">
                <template>Olağan hediyeler ile evlenme sırasında yapılan geleneğe uygun giderler denkleştirmeye tâbi değildir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Altsoy hısımlarının evlenmelerinde, alışılmış ölçüler içinde yapılan çeyiz giderleri hakkında denkleştirmeye tâbi tutmama arzusunun bulunduğu asıldır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="PAYLAŞMANIN TAMAMLANMASI VE SONUCU">
          <mvz-b1 no="A" başlık="Paylaşmanın sonuçlandırılması">
            <mvz-b2 no="I" başlık="Paylaşma sözleşmesi">
              <mvz-madde no="676" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçılar arasında payların oluşturulması ve fiilen alınması veya aralarında yapacakları paylaşma sözleşmesi mirasçıları bağlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Paylaşma sözleşmesiyle mirasçılar, tereke mallarının tamamı veya bir kısmı üzerindeki elbirliği mülkiyetinin miras payları oranında paylı mülkiyete dönüştürülmesini de kabul edebilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Paylaşma sözleşmesinin geçerliliği yazılı şekilde yapılmasına bağlıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Miras payı üzerinde sözleşme">
              <mvz-madde no="677" başlık="">
                <mvz-fıkra no="1">
                  <template>Terekenin tamamı veya bir kısmı üzerinde miras payının devri konusunda mirasçılar arasında yapılan sözleşmelerin geçerliliği yazılı şekle bağlıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bir mirasçının üçüncü kişiyle yapacağı böyle bir sözleşmenin geçerliliği, noterlikçe düzenlenmesine bağlıdır. Sözleşme bu kişiye paylaşmaya katılma yetkisi vermez; sadece paylaşma sonunda mirasçıya özgülenen payın kendisine verilmesini isteme hakkını sağlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Mirasın açılmasından önce yapılan sözleşmeler">
              <mvz-madde no="678" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakanın katılması veya izni olmaksızın bir mirasçının henüz açılmamış bir miras hakkında diğer mirasçılar veya üçüncü bir kişi ile yapacağı sözleşmeler geçerli değildir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Böyle bir sözleşme gereğince yerine getirilmiş olan edimlerin geri verilmesi istenebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Mirasçıların birbirine karşı sorumluluğu">
            <mvz-b2 no="I" başlık="Garanti borcu">
              <mvz-madde no="679" başlık="">
                <mvz-fıkra no="1">
                  <template>Paylaşmanın tamamlanmasından sonra mirasçılar, paylarına düşen mallar için birbirlerine karşı satım hükümlerine göre sorumludurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasçılar, paylaşmada her birine özgülenmiş olan alacakların varlığını birbirlerine karşı garanti ettikleri gibi; borsaya kayıtlı olan kıymetli evrak dışında, alacağın mirasçının hakkına mahsup edilen miktarı için borçlunun ödeme gücünden adî kefil gibi sorumludurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Garantiye ve kefalete dayanan dava, paylaşma tarihinin veya daha sonra yerine getirilecek alacaklarda muacceliyet tarihinin üzerinden bir yıl geçmekle zamanaşımına uğrar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Paylaşma sözleşmesinin geçersizliği">
              <mvz-madde no="680" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlar Kanununun geçersizliğe ilişkin genel hükümleri, paylaşma sözleşmeleri hakkında da uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Mirasçıların üçüncü kişilere karşı sorumluluğu">
            <mvz-b2 no="I" başlık="Müteselsil sorumluluk">
              <mvz-madde no="681" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçılar, bölünmesine veya nakline alacaklı tarafından açık veya örtülü olarak rıza gösterilmemiş olan tereke borçlarından dolayı, paylaşmadan sonra da bütün malvarlıklarıyla müteselsilen sorumludurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Paylaşmanın gerçekleştiği tarihin veya daha sonra yerine getirilecek borçlarda muacceliyet tarihinin üzerinden beş yıl geçmekle teselsül sona erer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Mirasçılara rücu">
              <mvz-madde no="682" başlık="">
                <mvz-fıkra no="1">
                  <template>Paylaşma sözleşmesinde ödenmesi kendisine yükletilmemiş olan bir tereke borcunu veya üzerine aldığı miktardan fazlasını ödeyen mirasçı, diğer mirasçılara rücu edebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Rücu hakkı, ilk önce, ödenmiş olan borcu paylaşma sözleşmesiyle üstlenmiş bulunan mirasçıya karşı kullanılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Diğer hâllerde, aksi kararlaştırılmış olmadıkça, mirasçılardan her biri terekedeki borçları miras payı oranında ödemekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
    </mvz-kısım>

  <mvz-kitap no="4-DÖRDÜNCÜ" başlık="EŞYA HUKUKU">
    <mvz-kısım no="1-BİRİNCİ" başlık="MÜLKİYET">
      <mvz-bölüm no="1-BİRİNCİ" başlık="GENEL HÜKÜMLER">
        <mvz-b1 no="A" başlık="Mülkiyet hakkının içeriği">
          <mvz-madde no="683" başlık="">
            <mvz-fıkra no="1">
              <template>Bir şeye malik olan kimse, hukuk düzeninin sınırları içinde, o şey üzerinde dilediği gibi kullanma, yararlanma ve tasarrufta bulunma yetkisine sahiptir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Malik, malını haksız olarak elinde bulunduran kimseye karşı istihkak davası açabileceği gibi, her türlü haksız elatmanın önlenmesini de dava edebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Mülkiyet hakkının kapsamı">
          <mvz-b2 no="I" başlık="Bütünleyici parça">
            <mvz-madde no="684" başlık="">
              <mvz-fıkra no="1">
                <template>Bir şeye malik olan kimse, o şeyin bütünleyici parçalarına da malik olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bütünleyici parça, yerel âdetlere göre asıl şeyin temel unsuru olan ve o şey yok edilmedikçe, zarara uğratılmadıkça veya yapısı değiştirilmedikçe ondan ayrılmasına olanak bulunmayan parçadır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Doğal ürünler">
            <mvz-madde no="685" başlık="">
              <mvz-fıkra no="1">
                <template>Bir şeyin maliki, onun ürünlerinin de maliki olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ürünler, dönemsel olarak elde edilen doğal veya hukukî ürünler ile bir şeyin özgülendiği amaca göre âdetler gereği ondan elde edilmesi uygun görülen diğer verimlerdir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Doğal ürünler asıl şeyden ayrılıncaya kadar onun bütünleyici parçasıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Eklenti">
            <mvz-b3 no="1" başlık="Tanım">
              <mvz-madde no="686" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir şeye ilişkin tasarruflar, aksi belirtilmedikçe onun eklentisini de kapsar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Eklenti, asıl şey malikinin anlaşılabilen arzusuna veya yerel âdetlere göre, işletilmesi, korunması veya yarar sağlaması için asıl şeye sürekli olarak özgülenen ve kullanılmasında birleştirme, takma veya başka bir biçimde asıl şeye bağlı kılınan taşınır maldır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Eklenti, asıl şeyden geçici olarak ayrılmakla bu niteliğini kaybetmez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Eklenti sayılmayanlar">
              <mvz-madde no="687" başlık="">
                <mvz-fıkra no="1">
                  <template>Asıl şeye zilyet olan kimsenin sadece geçici olarak kullanması veya tüketmesi için özgülenen ya da asıl şeyin özel niteliği ile herhangi bir ilişkisi bulunmadan sadece korunmak, satılmak veya kiraya verilmek üzere onunla birleştirilen şeyler eklenti sayılmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Birlikte mülkiyet">
          <mvz-b2 no="I" başlık="Paylı mülkiyet">
            <mvz-b3 no="1" başlık="Genel kurallar">
              <mvz-madde no="688" başlık="">
                <mvz-fıkra no="1">
                  <template>Paylı mülkiyette birden çok kimse, maddî olarak bölünmüş olmayan bir şeyin tamamına belli paylarla maliktir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Başka türlü belirlenmedikçe, paylar eşit sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Paydaşlardan her biri kendi payı bakımından malik hak ve yükümlülüklerine sahip olur. Pay devredilebilir, rehnedilebilir ve alacaklılar tarafından haczettirilebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yönetim ve tasarruf">
              <mvz-b4 no="a" başlık="Anlaşmalar">
                <mvz-madde no="689" başlık="">
                  <mvz-fıkra no="1">
                    <template>Paydaşlar, kendi aralarında oybirliğiyle anlaşarak yararlanma, kullanma ve yönetime ilişkin konularda kanun hükümlerinden farklı bir düzenleme yapabilirler. Ancak, böyle bir anlaşmayla paydaşların aşağıdaki hak ve yetkileri kaldırılamaz ve sınırlandırılamaz:</template>
                    <mvz-bent no="1.">
                      <template>Paylı mülkiyet konusu eşyanın kullanılabilirliğinin ve değerinin korunması için zorunlu olan yönetim işlerini yapmak ve gerektiğinde mahkemeden buna ilişkin önlemlerin alınmasını istemek,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Eşyayı bir zarar tehlikesinden veya zararın artmasından korumak için derhâl alınması gereken önlemleri bütün paydaşlar hesabına almak.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Taşınmazlarla ilgili anlaşmalar imzalarının noterlikçe onaylanması koşuluyla paydaşlardan birinin başvurusu üzerine tapu kütüğüne şerh verilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Olağan yönetim işleri">
                <mvz-madde no="690" başlık="">
                  <mvz-fıkra no="1">
                    <template>Paydaşlardan her biri olağan yönetim işlerini yapmaya, özellikle küçük onarımları yaptırmaya ve tarımsal işleri yürütmeye yetkilidir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Zorunlu ve ivedi işlerin yapılmasına ilişkin kanun hükümleri saklı kalmak kaydıyla, paydaşların çoğunlukla alacağı kararla olağan yönetim işlerinde yetkiyle ilgili farklı düzenleme getirilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Önemli yönetim işleri">
                <mvz-madde no="691" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşletme usulünün veya tarım türünün değiştirilmesi, adî kiraya veya ürün kirasına ilişkin sözleşmelerin yapılması veya feshi, toprağın ıslahı gibi önemli yönetim işleri için pay ve paydaş çoğunluğuyla karar verilmesi gerekir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Olağan yönetim sınırlarını aşan ve paylı malın değerinin veya yarar sağlamaya elverişliliğinin korunması için gerekli bakım, onarım ve yapı işlerinde de aynı çoğunluk aranır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Pay ve paydaşların eşitliği hâlinde hâkim, paydaşlardan birinin istemi üzerine bütün paydaşların menfaatini gözeterek hakkaniyete uygun bir karar verir; gerekli gördüğü işlerin yapılması için paydaşlar arasından veya dışarıdan bir kayyım atayabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Olağanüstü yönetim işleri ve tasarruflar">
                <mvz-madde no="692" başlık="">
                  <mvz-fıkra no="1">
                    <template>Paylı malın özgülendiği amacın değiştirilmesi, korumanın veya olağan şekilde kullanmanın gerekli kıldığı ölçüyü aşan yapı işlerine girişilmesi veya paylı malın tamamı üzerinde tasarruf işlemlerinin yapılması, oybirliğiyle aksi kararlaştırılmış olmadıkça, bütün paydaşların kabulüne bağlıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Paylar üzerinde taşınmaz rehni veya taşınmaz yükü kurulmuşsa, paydaşlar malın tamamını benzer haklarla kayıtlayamazlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Yararlanma, kullanma ve koruma">
              <mvz-madde no="693" başlık="">
                <mvz-fıkra no="1">
                  <template>Paydaşlardan her biri, diğerlerinin hakları ile bağdaştığı ölçüde paylı maldan yararlanabilir ve onu kullanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Uyuşmazlık hâlinde yararlanma ve kullanma şeklini hâkim belirler. Bu belirleme, paylı malın kullanılmasının zaman veya yer itibarıyla paydaşlar arasında bölünmesi biçiminde de olabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Paydaşlardan her biri, bölünemeyen ortak menfaatlerin korunmasını diğer paydaşları temsilen sağlayabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Giderler ve yükümlülükler">
              <mvz-madde no="694" başlık="">
                <mvz-fıkra no="1">
                  <template>Paylı mülkiyetten doğan veya paylı malı ilgilendiren yönetim giderleri, vergiler ve diğer yükümlülükler, aksine bir hüküm bulunmadıkça, paydaşlar tarafından payları oranında karşılanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Payına düşenden fazlasını ödemiş bulunan paydaş, diğerlerine payları oranında rücu edebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Kararların bağlayıcılığı">
              <mvz-madde no="695" başlık="">
                <mvz-fıkra no="1">
                  <template>Yararlanma, kullanma ve yönetime ilişkin konularda paydaşların yaptıkları düzenleme ve aldıkları kararlar ile mahkemece verilen kararlar, sonradan paydaş olan veya pay üzerinde aynî hak kazanan kimseleri de bağlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taşınmazlarda yararlanma, kullanma ve yönetime ilişkin kararların sonradan paydaş olan veya pay üzerinde aynî hak kazananları bağlaması için, bunların tapu kütüğüne şerh edilmesi gerekir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="6" başlık="Paydaşlıktan çıkarma">
              <mvz-b4 no="a" başlık="Paydaşın çıkarılması">
                <mvz-madde no="696" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kendi tutum ve davranışlarıyla veya malın kullanılmasını bıraktığı ya da fiillerinden sorumlu olduğu kişilerin tutum ve davranışlarıyla diğer paydaşların tamamına veya bir kısmına karşı olan yükümlülüklerini ağır biçimde çiğneyen paydaş, bu yüzden onlar için paylı mülkiyet ilişkisinin devamını çekilmez hâle getirmişse, mahkeme kararıyla paydaşlıktan çıkarılabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Davanın açılması, aksi kararlaştırılmış olmadıkça, pay ve paydaş çoğunluğuyla karar verilmesine bağlıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Hâkim, çıkarma istemini haklı gördüğü takdirde, çıkarılacak paydaşın payını karşılayacak kısmı maldan ayırmaya olanak varsa, bu ayırmayı yaparak ayrılan parçanın paylı mülkiyetten çıkarılana özgülenmesine karar verir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Aynen ayrılmasına olanak bulunmayan maldaki payın dava tarihindeki değeriyle kendilerine devrini isteyen paydaş veya paydaşlar bu istemlerini paydaşlıktan çıkarma istemi ile birlikte ileri sürmek zorundadırlar. Hâkim, hüküm vermeden önce re'sen belirleyeceği uygun bir süre içinde pay değerinin ödenmesine veya tevdiine karar verir. Davanın kabulü hâlinde payın istemde bulunan adına tesciline hükmolunur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="5">
                    <template>Payı karşılayacak kısım maldan aynen ayrılamaz ve bu payı isteyen paydaş da bulunmazsa hâkim, davalıya payını devretmesi için bir süre belirler ve bu süre içinde devredilmeyen payın açık artırmayla satışına karar verir. Satış kararı, cebrî icra yoluyla paraya çevirmeye ilişkin hükümler uyarınca yerine getirilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Diğer hak sahiplerinin çıkarılması">
                <mvz-madde no="697" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir paydaşın çıkarılmasına ilişkin hükümler, kıyas yoluyla, pay üzerinde intifa veya diğer bir aynî ya da tapuya şerh edilmiş kişisel yararlanma hakkı sahipleri hakkında da uygulanır. Ancak, devri caiz olmayan bir hakkın uygun bir tazminat karşılığında sona ermesine karar verilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="7" başlık="Paylı mülkiyetin sona ermesi">
              <mvz-b4 no="a" başlık="Paylaşma istemi">
                <mvz-madde no="698" başlık="">
                  <mvz-fıkra no="1">
                    <template>Hukukî bir işlem gereğince veya paylı malın sürekli bir amaca özgülenmiş olması sebebiyle paylı mülkiyeti devam ettirme yükümlülüğü bulunmadıkça, paydaşlardan her biri malın paylaşılmasını isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Paylaşmayı isteme hakkı, hukukî bir işlemle en çok on yıllık süre ile sınırlandırılabilir. Taşınmazlarda paylı mülkiyetin devamına ilişkin sözleşmeler, resmî şekle bağlıdır ve tapu kütüğüne şerh verilebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Uygun olmayan zamanda paylaşma isteminde bulunulamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Paylaşma biçimi">
                <mvz-madde no="699" başlık="">
                  <mvz-fıkra no="1">
                    <template>Paylaşma, malın aynen bölüşülmesi veya pazarlık ya da artırmayla satılarak bedelinin bölüşülmesi biçiminde gerçekleştirilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Paylaşma biçiminde uyuşma sağlanamazsa, paydaşlardan birinin istemi üzerine hâkim, malın aynen bölünerek paylaştırılmasına, bölünen parçaların değerlerinin birbirine denk düşmemesi hâlinde eksik değerdeki parçaya para eklenerek denkleştirme sağlanmasına karar verir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bölme istemi durum ve koşullara uygun görülmezse ve özellikle paylı malın önemli bir değer kaybına uğramadan bölünmesine olanak yoksa, açık artırmayla satışa hükmolunur. Satışın paydaşlar arasında artırmayla yapılmasına karar verilmesi, bütün paydaşların rızasına bağlıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="İntifa hakkı sahibinin durumu">
                <mvz-madde no="700" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir paydaşın kendi payı üzerinde intifa hakkı kurması hâlinde, diğer paydaşlardan biri intifa hakkının kurulduğunun kendisine tebliğinden başlayarak üç ay içinde paylaşma isteminde bulunursa; satış yoluyla paylaşmada intifa hakkı, buna ilişkin paya düşecek bedel üzerinde devam eder.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Elbirliği mülkiyeti">
            <mvz-b3 no="1" başlık="Kaynakları ve niteliği">
              <mvz-madde no="701" başlık="">
                <mvz-fıkra no="1">
                  <template>Kanun veya kanunda öngörülen sözleşmeler uyarınca oluşan topluluk dolayısıyla mallara birlikte malik olanların mülkiyeti, elbirliği mülkiyetidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Elbirliği mülkiyetinde ortakların belirlenmiş payları olmayıp her birinin hakkı, ortaklığa giren malların tamamına yaygındır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Hükümleri">
              <mvz-madde no="702" başlık="">
                <mvz-fıkra no="1">
                  <template>Ortakların hakları ve yükümlülükleri, topluluğu doğuran kanun veya sözleşme hükümleri ile belirlenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kanunda veya sözleşmede aksine bir hüküm bulunmadıkça, gerek yönetim, gerek tasarruf işlemleri için ortakların oybirliğiyle karar vermeleri gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Sözleşmeden doğan topluluk devam ettiği sürece, paylaşma yapılamaz ve bir pay üzerinde tasarrufta bulunulamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Ortaklardan her biri, topluluğa giren hakların korunmasını sağlayabilir. Bu korumadan bütün ortaklar yararlanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Sona ermesi">
              <mvz-madde no="703" başlık="">
                <mvz-fıkra no="1">
                  <template>Elbirliği mülkiyeti, malın devri, topluluğun dağılması veya paylı mülkiyete geçilmesiyle sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Paylaştırma, aksine bir hüküm bulunmadıkça, paylı mülkiyet hükümlerine göre yapılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="TAŞINMAZ MÜLKİYETİ">
        <mvz-ayırım no="1-BİRİNCİ" başlık="TAŞINMAZ MÜLKİYETİNİN KONUSU, KAZANILMASI VE KAYBI">
          <mvz-b1 no="A" başlık="Taşınmaz mülkiyetinin konusu">
            <mvz-madde no="704" başlık="">
              <mvz-fıkra no="1">
                <template>Taşınmaz mülkiyetinin konusu şunlardır:</template>
                <mvz-bent no="1.">
                  <template>Arazi,</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Tapu kütüğünde ayrı sayfaya kaydedilen bağımsız ve sürekli haklar,</template>
                </mvz-bent>
                <mvz-bent no="3.">
                  <template>Kat mülkiyeti kütüğüne kayıtlı bağımsız bölümler.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Taşınmaz mülkiyetinin kazanılması">
            <mvz-b2 no="I" başlık="Tescil">
              <mvz-madde no="705" başlık="">
                <mvz-fıkra no="1">
                  <template>Taşınmaz mülkiyetinin kazanılması, tescille olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Miras, mahkeme kararı, cebrî icra, işgal, kamulaştırma hâlleri ile kanunda öngörülen diğer hâllerde, mülkiyet tescilden önce kazanılır. Ancak, bu hâllerde malikin tasarruf işlemleri yapabilmesi, mülkiyetin tapu kütüğüne tescil edilmiş olmasına bağlıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Kazanma yolları">
              <mvz-b3 no="1" başlık="Hukukî işlem">
                <mvz-madde no="706" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmaz mülkiyetinin devrini amaçlayan sözleşmelerin geçerli olması, resmî şekilde düzenlenmiş bulunmalarına bağlıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ölüme bağlı tasarruflar ve mal rejimi sözleşmeleri, kendilerine özgü şekillere tâbidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="İşgal">
                <mvz-madde no="707" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tapu kütüğüne kayıtlı bir taşınmazın mülkiyetinin işgal yoluyla kazanılması, ancak kaydının malikin istemiyle terkin edilmiş olmasına bağlıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tapuya kayıtlı olmayan taşınmazlar üzerinde işgal yoluyla mülkiyet kazanılamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Yeni arazi oluşması">
                <mvz-madde no="708" başlık="">
                  <mvz-fıkra no="1">
                    <template>Birikme, dolma, toprak kayması veya kamuya ait suların yatağında ya da seviyesinde değişme gibi sebeplerle sahipsiz yerlerde yeniden oluşan yararlanmaya elverişli arazi Devlete ait olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Devlet, bu araziyi kamusal bir sakınca bulunmadığı takdirde öncelikle arazisi kayba uğrayana veya bitişik arazi malikine devredebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Toprak parçalarının kendi arazisinden koptuğunu ispat eden malik, bunları, durumu öğrendiği tarihten başlayarak bir ve her hâlde oluşumun gerçekleştiği tarihten başlayarak on yıl içinde geri alabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Arazi kayması">
                <mvz-b4 no="a" başlık="Genel olarak">
                  <mvz-madde no="709" başlık="">
                    <mvz-fıkra no="1">
                      <template>Arazi kayması sınır değişikliğini gerektirmez.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Arazi kayması sebebiyle bir taşınmazdan diğerine geçmiş olan arazi parçaları ve diğer cisimler hakkında sürüklenen şeylere ve karışmaya ilişkin hükümler uygulanır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Heyelân">
                  <mvz-madde no="710" başlık="">
                    <mvz-fıkra no="1">
                      <template>Arazi kaymasının sınır değişikliğine yol açmayacağı ilkesi, yetkili makamlarca heyelân bölgesi olduğu belirlenen yörelerde uygulanmaz.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bu yörelerin belirlenmesi sırasında yöredeki arazinin yapısı göz önünde tutulur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Bir taşınmazın böyle bir yörede bulunduğu, ilgililere uygun biçimde bildirilir ve tapu kütüğünün beyanlar sütununa yazılır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Sınırın yeniden belirlenmesi">
                  <mvz-madde no="711" başlık="">
                    <mvz-fıkra no="1">
                      <template>Sınır, arazi kayması sebebiyle gerçeği yansıtmıyorsa; ilgili taşınmaz maliki, sınırın yeniden belirlenmesini isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Fazlalık ve eksiklikler denkleştirilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="5" başlık="Kazandırıcı zamanaşımı">
                <mvz-b4 no="a" başlık="Olağan zamanaşımı">
                  <mvz-madde no="712" başlık="">
                    <mvz-fıkra no="1">
                      <template>Geçerli bir hukukî sebep olmaksızın tapu kütüğüne malik olarak yazılan kişi, taşınmaz üzerindeki zilyetliğini davasız ve aralıksız olarak on yıl süreyle ve iyiniyetle sürdürürse, onun bu yolla kazanmış olduğu mülkiyet hakkına itiraz edilemez.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Olağanüstü zamanaşımı">
                  <mvz-madde no="713" başlık="">
                    <mvz-fıkra no="1">
                      <template>Tapu kütüğünde kayıtlı olmayan bir taşınmazı davasız ve aralıksız olarak yirmi yıl süreyle ve malik sıfatıyla zilyetliğinde bulunduran kişi, o taşınmazın tamamı, bir parçası veya bir payı üzerindeki mülkiyet hakkının tapu kütüğüne tesciline karar verilmesini isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Aynı koşullar altında, maliki tapu kütüğünden anlaşılamayan veya yirmi yıl önce  hakkında gaiplik kararı verilmiş bir kimse adına kayıtlı bulunan taşınmazın tamamının veya bölünmesinde sakınca olmayan bir parçasının zilyedi de, o taşınmazın tamamı, bir parçası veya bir payı üzerindeki mülkiyet hakkının tapu kütüğüne tesciline karar verilmesini isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Tescil davası, Hazineye ve ilgili kamu tüzel kişilerine veya varsa tapuda malik gözüken kişinin mirasçılarına karşı açılır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="4">
                      <template>Davanın konusu, mahkemece bir gazete ve bir internet haber sitesinde ve ayrıca taşınmazın bulunduğu yerde uygun araç ve aralıklarla en az üç defa ilân olunur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="5">
                      <template>Son ilândan başlayarak üç ay içinde yukarıdaki koşulların gerçekleşmediğini ileri sürerek itiraz eden bulunmaz ya da itiraz yerinde görülmez ve davacının iddiası ispatlanmış olursa, hâkim tescile karar verir. Mülkiyet, birinci fıkrada öngörülen koşulların gerçekleştiği anda kazanılmış olur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="6">
                      <template>Davalılar ve itiraz edenler, aynı davada kendi adlarına tescile karar verilmesini isteyebilirler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="7">
                      <template>Kararda, tescili istenilen taşınmazın niteliği, yeri, sınırları ve yüzölçümü belirtilir ve karara, uzmanlarca düzenlenen teknik bilgileri içeren krokisi de eklenir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="8">
                      <template>Özel kanun hükümleri saklıdır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Sürelerin hesabı">
                  <mvz-madde no="714" başlık="">
                    <mvz-fıkra no="1">
                      <template>Kazandırıcı zamanaşımı sürelerinin hesaplanmasında, kesilmesinde ve durmasında, Borçlar Kanununun zamanaşımına ilişkin hükümleri kıyas yoluyla uygulanır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="6" başlık="Sahipsiz yerler ve yararı kamuya ait mallar">
                <mvz-madde no="715" başlık="">
                  <mvz-fıkra no="1">
                    <template>Sahipsiz yerler ile yararı kamuya ait mallar, Devletin hüküm ve tasarrufu altındadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Aksi ispatlanmadıkça, yararı kamuya ait sular ile kayalar, tepeler, dağlar, buzullar gibi tarıma elverişli olmayan yerler ve bunlardan çıkan kaynaklar, kimsenin mülkiyetinde değildir ve hiçbir şekilde özel mülkiyete konu olamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Sahipsiz yerler ile yararı kamuya ait malların kazanılması, bakımı, korunması, işletilmesi ve kullanılması özel kanun hükümlerine tâbidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Tescili isteme hakkı">
              <mvz-madde no="716" başlık="">
                <mvz-fıkra no="1">
                  <template>Mülkiyetin kazanılmasına esas olacak bir hukukî sebebe dayanarak malikten mülkiyetin kendi adına tescilini istemek hususunda kişisel hakka sahip olan kimse, malikin kaçınması hâlinde hâkimden, mülkiyetin hükmen geçirilmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bir taşınmazın mülkiyetini işgal, miras, kamulaştırma, cebrî icra veya mahkeme kararına dayanarak kazanan kişi tescili doğrudan doğruya yaptırabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bir taşınmazın mülkiyetinde eşler arasındaki mal rejimi dolayısıyla meydana gelen değişiklikler, eşlerden birinin istemiyle tapu kütüğüne doğrudan tescil olunur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Taşınmaz mülkiyetinin kaybı">
            <mvz-madde no="717" başlık="">
              <mvz-fıkra no="1">
                <template>Taşınmaz mülkiyeti, terkin veya taşınmazın tamamen yok olmasıyla sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kamulaştırma hâlinde mülkiyetin ne zaman sona ereceği özel kanunla belirlenir</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="TAŞINMAZ MÜLKİYETİNİN İÇERİĞİ VE KISITLAMALARI">
          <mvz-b1 no="A" başlık="Taşınmaz mülkiyetinin içeriği">
            <mvz-b2 no="I" başlık="Kapsam">
              <mvz-madde no="718" başlık="">
                <mvz-fıkra no="1">
                  <template>Arazi üzerindeki mülkiyet, kullanılmasında yarar olduğu ölçüde, üstündeki hava ve altındaki arz katmanlarını kapsar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu mülkiyetin kapsamına, yasal sınırlamalar saklı kalmak üzere yapılar, bitkiler ve kaynaklar da girer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Sınırlar">
              <mvz-b3 no="1" başlık="Sınırların belirlenmesi">
                <mvz-madde no="719" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmazın sınırları, tapu plânları ve arz üzerindeki sınır işaretleriyle belirlenir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tapu plânları ile arz üzerindeki işaretler birbirini tutmazsa, asıl olan plândaki sınırdır. Bu kural, yetkili makamlarca heyelân bölgesi olduğu belirlenen yörelerde uygulanmaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Sınır belirleme yükümlülüğü">
                <mvz-madde no="720" başlık="">
                  <mvz-fıkra no="1">
                    <template>Her arazi maliki, komşusunun istemi üzerine belli olmayan sınırların belirlenmesi için tapu plânlarının düzeltilmesine veya arz üzerine sınır işaretleri konulmasına katkıda bulunmakla yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Sınırlıklar üzerinde paylı mülkiyet">
                <mvz-madde no="721" başlık="">
                  <mvz-fıkra no="1">
                    <template>İki taşınmazı birbirinden ayırmaya yarayan duvar, parmaklık, çit gibi sınırlıklar, aksi ispat edilmedikçe, her iki komşunun paylı malı sayılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Arazideki yapılar">
              <mvz-b3 no="1" başlık="Arazi ve yapı malzemesi">
                <mvz-b4 no="a" başlık="Mülkiyet ilişkisi">
                  <mvz-madde no="722" başlık="">
                    <mvz-fıkra no="1">
                      <template>Bir kimse kendi arazisindeki yapıda başkasının malzemesini ya da başkasının arazisindeki yapıda kendisinin veya bir başkasının malzemesini kullanırsa, bu malzeme arazinin bütünleyici parçası olur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Ancak, sahibinin rızası olmaksızın kullanılmış olan malzemenin sökülmesi aşırı zarara yol açmayacaksa, malzeme sahibi, gideri yapıyı yaptırana ait olmak üzere bunların sökülüp kendisine verilmesini isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Aynı koşullar altında arazinin maliki de, rızası olmaksızın yapılan yapıda kullanılan malzemenin, gideri yapıyı yaptırana ait olmak üzere sökülüp kaldırılmasını isteyebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Tazminat">
                  <mvz-madde no="723" başlık="">
                    <mvz-fıkra no="1">
                      <template>Malzeme sökülüp alınmazsa arazi maliki, malzeme sahibine uygun bir tazminat ödemekle yükümlüdür.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Yapıyı yaptıran arazi maliki iyiniyetli değilse hâkim, malzeme sahibinin uğradığı zararın tamamının tazmin edilmesine karar verebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Yapıyı yaptıran malzeme sahibi iyiniyetli değilse, hâkimin hükmedeceği miktar bu malzemenin arazi maliki için taşıdığı en az değeri geçmeyebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Arazinin mülkiyetinin malzeme sahibine verilmesi">
                  <mvz-madde no="724" başlık="">
                    <mvz-fıkra no="1">
                      <template>Yapının değeri açıkça arazinin değerinden fazlaysa, iyiniyetli taraf uygun bir bedel karşılığında yapının ve arazinin tamamının veya yeterli bir kısmının mülkiyetinin malzeme sahibine verilmesini isteyebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Taşkın yapılar">
                <mvz-madde no="725" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir yapının başkasına ait araziye taşırılan kısmı, eğer yapıyı yapan malik taşırılan arazi üzerinde bir irtifak hakkına sahip bulunuyorsa, ona ait taşınmazın bütünleyici parçası olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Böyle bir irtifak hakkı yoksa, zarar gören malik taşmayı öğrendiği tarihten başlayarak onbeş gün içinde itiraz etmediği, aynı zamanda durum ve koşullar da haklı gösterdiği takdirde, taşkın yapıyı iyiniyetle yapan kimse, uygun bir bedel karşılığında taşan kısım için bir irtifak hakkı kurulmasını veya bu kısmın bulunduğu arazi parçasının mülkiyetinin kendisine devredilmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Üst hakkı">
                <mvz-madde no="726" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir üst irtifakına dayalı olarak başkasına ait bir arazinin altında veya üstünde sürekli kalmak üzere inşa edilen yapıların mülkiyeti, irtifak hakkı sahibine ait olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bir binanın başlı başına kullanılmaya elverişli bağımsız bölümleri üzerinde kat mülkiyeti veya kat irtifakı kurulması, Kat Mülkiyeti Kanununa tâbidir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bağımsız bölümler üzerinde ayrıca üst hakkı kurulamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Mecralar">
                <mvz-madde no="727" başlık="">
                  <mvz-fıkra no="1">
                    <template>Su, gaz, elektrik ve benzerlerinin mecraları, işletmenin bulunduğu taşınmazın dışında olsalar bile, aksine bir düzenleme olmadıkça o işletmenin eklentisi ve işletme malikinin malı sayılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Komşuluk hukukunun gerektirdiği hâller dışında bir taşınmazın böyle bir mecra ile aynî hak olarak yüklenmesi, ancak bir irtifak hakkı kurulması suretiyle olabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>İrtifak hakkı, mecra dışarıdan görülmüyorsa tapu kütüğüne tesciliyle, dışarıdan görülüyorsa noterce düzenlenecek sözleşmeye dayanılarak mecranın yapılmasıyla doğar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="5" başlık="Taşınır yapılar">
                <mvz-madde no="728" başlık="">
                  <mvz-fıkra no="1">
                    <template>Başkasının arazisi üzerinde kalıcı olması amaçlanmaksızın yapılan kulübe, büfe, çardak, baraka ve benzeri hafif yapılar, bunların malikine aittir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu tür yapılar, taşınır mal hükümlerine tâbi olur ve tapu kütüğünde gösterilmez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Araziye dikilen fidanlar">
              <mvz-madde no="729" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir kimse başkasının fidanını kendi arazisine ya da kendisinin veya bir üçüncü kişinin fidanını başkasının arazisine dikerse, başkasının malzemesini kullanarak yapılan yapılara veya taşınır yapılara ilişkin hükümler bunlar hakkında da uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ağaçlar ve ormanlar üst hakkına konu olamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Taşınmaz malikinin sorumluluğu">
              <mvz-madde no="730" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir taşınmaz malikinin mülkiyet hakkını bu hakkın yasal kısıtlamalarına aykırı kullanması sonucunda zarar gören veya zarar tehlikesi ile karşılaşan kimse, durumun eski hâline getirilmesini, tehlikenin ve uğradığı zararın giderilmesini dava edebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hâkim, yerel âdete uygun ve kaçınılmaz taşkınlıklardan doğan zararların uygun bir bedelle denkleştirilmesine karar verebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Taşınmaz mülkiyetinin kısıtlamaları">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-fıkra no="3">
                <template>Madde 731-Taşınmaz mülkiyetinin kanundan doğan kısıtlamaları, tapu siciline tescil edilmeksizin etkili olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Bu kısıtlamaların ortadan kaldırılması veya değiştirilmesi, buna ilişkin sözleşmenin resmî şekilde düzenlenmesine ve tapu kütüğüne şerh verilmesine bağlıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Kamu yararı için konulan kısıtlamalar kaldırılamaz ve değiştirilemez.</template>
              </mvz-fıkra>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Devir hakkının kısıtlamaları">
              <mvz-b3 no="1" başlık="Yasal önalım hakkı">
                <mvz-b4 no="a" başlık="Önalım hakkı sahibi">
                  <mvz-madde no="732" başlık="">
                    <mvz-fıkra no="1">
                      <template>Paylı mülkiyette bir paydaşın taşınmaz üzerindeki payını tamamen veya kısmen üçüncü kişiye satması hâlinde, diğer paydaşlar önalım hakkını kullanabilirler.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Kullanma yasağı, feragat ve hak düşürücü süre">
                  <mvz-madde no="733" başlık="">
                    <mvz-fıkra no="1">
                      <template>8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanunu kapsamında yapılan satışlar ile cebrî artırmayla satışlarda önalım hakkı kullanılamaz.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Önalım hakkından feragatin resmî şekilde yapılması ve tapu kütüğüne şerh verilmesi gerekir. Belirli bir satışta önalım hakkını kullanmaktan vazgeçme, yazılı şekle tâbidir ve satıştan önce veya sonra yapılabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Yapılan satış, alıcı veya satıcı tarafından diğer paydaşlara noter aracılığıyla bildirilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="4">
                      <template>Önalım hakkı, satışın hak sahibine bildirildiği tarihin üzerinden üç ay ve her hâlde satışın üzerinden bir yıl geçmekle düşer.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Kullanılması">
                  <mvz-madde no="734" başlık="">
                    <mvz-fıkra no="1">
                      <template>Önalım hakkı, alıcıya karşı dava açılarak kullanılır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Dava konusu payın rayiç bedeli hâkim tarafından gecikmeksizin belirlenir. Önalım hakkı sahibi, belirlenen rayiç bedel ile alıcıya düşen tapu giderlerini nemalandırılmak üzere hâkim tarafından belirlenen yere verilen kesin süre içinde nakden yatırmakla yükümlüdür. Bu yükümlülük, verilen kesin süre içinde yerine getirilmezse önalım hakkı sahibi adına payın tesciline karar verilemez. Yatırılan bedel, hükmün kesinleşmesi üzerine nemalarıyla birlikte ilgilisine ödenir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Sözleşmeden doğan önalım hakkı">
                <mvz-madde no="735" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tapu kütüğüne şerh verilen sözleşmeden doğan önalım hakkı, şerhte belirtilen sürede ve belirtilen koşullara göre her malike karşı kullanılabilir. Kütükte koşullar belirtilmemişse taşınmazın üçüncü kişiye satışındaki koşullar esas alınır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Şerhin etkisi her durumda, şerhin verildiği tarihin üzerinden on yıl geçmekle sona erer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Yasal önalım hakkının kullanılmasına ve vazgeçmeye ilişkin hükümler sözleşmeden doğan önalım hakkında da uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Alım ve geri alım hakları">
                <mvz-madde no="736" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tapu kütüğüne şerh verilen alım ve geri alım hakları, şerhde belirtilen süre içinde her malike karşı kullanılabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Şerhin etkisi, her durumda, şerhin verildiği tarihin üzerinden on yıl geçmekle sona erer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Komşu hakkı">
              <mvz-b3 no="1" başlık="Kullanma biçimi">
                <mvz-madde no="737" başlık="">
                  <mvz-fıkra no="1">
                    <template>Herkes, taşınmaz mülkiyetinden doğan yetkileri kullanırken ve özellikle işletme faaliyetini sürdürürken, komşularını olumsuz şekilde etkileyecek taşkınlıktan kaçınmakla yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Özellikle, taşınmazın durumuna, niteliğine ve yerel âdete göre komşular arasında hoş görülebilecek dereceyi aşan duman, buğu, kurum, toz, koku çıkartarak, gürültü veya sarsıntı yaparak rahatsızlık vermek yasaktır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Yerel âdete uygun ve kaçınılmaz taşkınlıklardan doğan denkleştirmeye ilişkin haklar saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Kazı ve yapılar">
                <mvz-b4 no="a" başlık="Kural">
                  <mvz-madde no="738" başlık="">
                    <mvz-fıkra no="1">
                      <template>Malik, kazı ve yapı yaparken komşu taşınmazlara, onların topraklarını sarsmak veya tehlikeye düşürmek ya da üzerlerindeki tesisleri etkilemek suretiyle zarar vermekten kaçınmak zorundadır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Komşuluk hukuku kurallarına aykırı yapılar hakkında taşkın yapılara ilişkin hükümler uygulanır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Özel kurallar">
                  <mvz-madde no="739" başlık="">
                    <mvz-fıkra no="1">
                      <template>Kazı ve yapılarda uyulması gerekli kurallar özel kanunlarla belirlenir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Bitkiler">
                <mvz-b4 no="a" başlık="Kural">
                  <mvz-madde no="740" başlık="">
                    <mvz-fıkra no="1">
                      <template>Komşunun arazisine taşarak zarar veren dal ve kökler, onun istemi üzerine uygun bir süre içinde kaldırılmazsa, komşu bu dal ve kökleri kesip kendi mülkiyetine geçirebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Ekilmiş veya üzerine yapı yapılmış arazisine dalların taşmasına katlanan komşu, bu dallarda yetişen meyvaları toplama hakkına sahip olur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Komşu ormanlar hakkında bu hükümler uygulanmaz.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Özel kurallar">
                  <mvz-madde no="741" başlık="">
                    <mvz-fıkra no="1">
                      <template>Komşu taşınmaz maliklerinin bitki dikerken uymak zorunda oldukları kurallar özel kanunlarla belirlenir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Doğal olarak akan su">
                <mvz-madde no="742" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmaz maliki, üst taraftaki araziden kendi arazisine doğal olarak akan suların ve özellikle yağmur, kar ve tutulmamış kaynak sularının akışına katlanmak zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Komşulardan hiçbiri bu suların akışını diğerinin zararına değiştiremez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Üstteki arazi maliki, alt taraftaki taşınmaza gerekli olan suyu, ancak kendi taşınmazı için zorunlu olduğu ölçüde tutabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="5" başlık="Fazla suyun akıtılması">
                <mvz-madde no="743" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir arazinin suyu öteden beri alt taraftaki araziye doğal bir şekilde akmakta ise, alt taraftaki arazi maliki, üst taraftaki araziden fazla suyun boşaltılması sırasında da bu suları tazminat isteme hakkı olmaksızın kabul etmek zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alt taraftaki arazi maliki boşaltma dolayısıyla akan sulardan zarar görmekte ise, gideri üstteki arazi malikine ait olmak üzere, kendi arazisinde yapılacak mecrayla suyun akıtılmasını isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bataklıkların kurutulması hakkındaki özel kanun hükümleri saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="6" başlık="Mecra geçirilmesi">
                <mvz-b4 no="a" başlık="Katlanma yükümlülüğü">
                  <mvz-madde no="744" başlık="">
                    <mvz-fıkra no="1">
                      <template>Her taşınmaz maliki, uğrayacağı zararın tamamının önceden ödenmesi koşuluyla, su yolu, kurutma kanalı, gaz ve benzerlerine ait boruların, elektrik hat ve kablolarının, başka yerden geçirilmesi olanaksız veya aşırı ölçüde masraflı olduğu takdirde, kendi arazisinin altından veya üstünden geçirilmesine katlanmakla yükümlüdür.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Mecra geçirilmesinin kamulaştırma kurallarına bağlı olması hâlinde, bu Kanunun mecralara ilişkin komşuluk hükümleri uygulanmaz.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Mecrayı geçirme hakkı, hak sahibinin istemi üzerine ve giderleri ödemesi koşuluyla tapu kütüğüne tescil edilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Yükümlü taşınmaz malikinin menfaatinin korunması">
                  <mvz-madde no="745" başlık="">
                    <mvz-fıkra no="1">
                      <template>Yükümlü taşınmaz maliki, kendi menfaatinin hakkaniyete uygun bir biçimde gözetilmesini isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Arazinin üzerinden geçecek mecralarda olağanüstü durumlar varsa malik, bu mecraların üzerinden geçirileceği arazi parçasının uygun bir kısmının, zararını tam olarak karşılayacak bir bedelle satın alınmasını isteyebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Durumun değişmesi">
                  <mvz-madde no="746" başlık="">
                    <mvz-fıkra no="1">
                      <template>Durum değişirse, yükümlü taşınmaz maliki, mecranın kendi yararına olarak başka bir yere nakledilmesini isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Yer değiştirme giderleri, kural olarak mecra hakkı sahibine aittir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Özel durumlar haklı gösterdiği takdirde, taşınmaz maliki de giderlerin uygun bir kısmına katılmakla yükümlü tutulabilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="7" başlık="Geçit hakları">
                <mvz-b4 no="a" başlık="Zorunlu geçit">
                  <mvz-madde no="747" başlık="">
                    <mvz-fıkra no="1">
                      <template>Taşınmazından genel yola çıkmak için yeterli geçidi bulunmayan malik, tam bir bedel karşılığında bir geçit hakkı tanınmasını komşularından isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bu hak, ilk önce kendisinden bu geçidin istenmesi önceki mülkiyet ve yol durumuna göre en uygun düşen komşuya karşı ve daha sonra bundan en az zarar görecek olana karşı kullanılır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Zorunlu geçit iki tarafın menfaati gözetilerek belirlenir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Diğer geçit hakları">
                  <mvz-madde no="748" başlık="">
                    <mvz-fıkra no="1">
                      <template>Taşınmaz malikinin taşınmazını işletme veya iyileştirme ya da taşınmazı üzerinde yapı yapma amacıyla komşu taşınmaza geçici olarak girme hakkı ile tarla yolu, hayvan sulama yolu, kış geçidi, tomruk kaydırma yolu ve oluğu ve bunlara benzer diğer geçitler özel kanun hükümlerine tâbidir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Özel kanun hükmü yoksa yerel âdet uygulanır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Doğrudan doğruya kanundan kaynaklanan geçit hakları, tapu kütüğüne tescil edilmeksizin doğar. Ancak, bunlardan sürekli nitelikte olanlar beyanlar sütununda gösterilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="8" başlık="Sınırlıklar">
                <mvz-madde no="749" başlık="">
                  <mvz-fıkra no="1">
                    <template>Sınırlıklar üzerinde paylı mülkiyete ilişkin hükümler saklı kalmak üzere; her arazi maliki, taşınmazının sınırının çit veya duvar gibi sınırlıklarla çevrilmesi için yapılan giderleri karşılar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Arazinin sınırlıklarla çevrilmesi yükümlülüğü ve biçimine ilişkin özel kanun hükümleri saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="9" başlık="Katılma yükümlülüğü">
                <mvz-madde no="750" başlık="">
                  <mvz-fıkra no="1">
                    <template>Her taşınmaz maliki, komşuluk hukukundan doğan yetkilerin kullanılması için gerekli işlere ve bunların giderlerine, kendi yararlanması oranında katılmakla yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Başkasının arazisine girme hakkı">
              <mvz-b3 no="1" başlık="Orman ve mer'aya girme">
                <mvz-madde no="751" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yetkili makamlar tarafından bitki örtüsünü korumak amacıyla yasaklanmadıkça, herkes başkasının orman ve mer'asına girebilir ve oralarda yetişen yabanî meyve, mantar ve benzeri şeyleri, yerel âdetlerin izin verdiği ölçüde toplayıp alabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Avlanmak ve balık tutmak için başkasının arazisine girme, özel kanun hükümlerine tâbidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Sürüklenen şeyler ile benzerlerinin alınması">
                <mvz-madde no="752" başlık="">
                  <mvz-fıkra no="1">
                    <template>Su, rüzgâr, çığ veya diğer doğal güçlerin etkisiyle ya da rastlantı sonucunda başkasının arazisine sürüklenen veya düşen şeyler ile buraya giren büyük ve küçük baş hayvan, arı oğulu, kanatlı hayvan ve balık gibi hayvanların hak sahipleri tarafından aranıp alınmasına, arazi maliki izin vermek zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Arazi maliki, bu yüzden uğradığı zararın denkleştirilmesini istemek ve denkleştirme bedeli kendisine ödeninceye kadar o şeyleri hapsetmek hakkına sahiptir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Zorunluluk hâlinde">
                <mvz-madde no="753" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir kimse kendisini veya başkasını tehdit eden bir zararı veya o anda mevcut bir tehlikeyi ancak başkasının taşınmazına müdahale ile önleyebilecek ve bu zarar ya da tehlike taşınmaza müdahaleden doğacak zarardan önemli ölçüde büyük ise, malik buna katlanmak zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Malik, bu yüzden uğradığı zarar için hakkaniyete uygun bir denkleştirme bedeli isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Kamu hukuku kısıtlamaları">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="754" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmaz mülkiyeti hakkının kamu yararı için kısıtlanması, özellikle yapı, yangın, doğal afetler ve sağlıkla ilgili kolluk hizmetlerine; orman ve yollara, deniz ve göl kıyılarındaki ana ve tali yollara sınır işaretleri ve nirengi noktaları konulmasına; toprağın iyileştirilmesine veya bölünmesine, tarım topraklarının veya yapıya özgü arsaların birleştirilmesine; eski eserler, doğal güzellikler, manzaralar, seyirlik noktaları ve ender doğa anıtları ile içmeler, ılıcalar, maden ve kaynak sularının korunmasına ilişkin mülkiyet kısıtlamaları, özel kanun hükümlerine tâbidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Toprağın iyileştirilmesi">
                <mvz-madde no="755" başlık="">
                  <mvz-fıkra no="1">
                    <template>Su yollarını düzeltme, sulama, bataklık yerlerini kurutma, yol açma, orman yetiştirme, arazileri toplulaştırma gibi iyileştirme işleri, ancak ilgili maliklerin ortak girişimleriyle yapılabilecekse, arazinin yarısından fazlasına sahip bulunmak koşuluyla maliklerin üçte ikisinin bu yolda karar vermeleri gerekir. Diğer malikler de bu karara uymak zorundadır. Alınan karar, tapu kütüğünün beyanlar sütununda gösterilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu konulara ilişkin özel kanun hükümleri saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Kaynak ve yeraltı suları">
            <mvz-b2 no="I" başlık="Mülkiyet ve irtifak hakkı">
              <mvz-madde no="756" başlık="">
                <mvz-fıkra no="1">
                  <template>Kaynaklar, arazinin bütünleyici parçası olup, bunların mülkiyeti ancak kaynadıkları arazinin mülkiyeti ile birlikte kazanılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Başkasının arazisinde bulunan kaynaklar üzerindeki hak, bir irtifak hakkı olarak tapu kütüğüne tescil ile kurulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Yeraltı suları, kamu yararına ait sulardandır. Arza malik olmak, onun altındaki yeraltı sularına da malik olmak sonucunu doğurmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Arazi maliklerinin yeraltı sularından yararlanma biçimi ve ölçüsüne ilişkin özel kanun hükümleri saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Kaynaklara zarar verilmesi">
              <mvz-b3 no="1" başlık="Tazminat">
                <mvz-madde no="757" başlık="">
                  <mvz-fıkra no="1">
                    <template>Önemli ölçüde yararlanılan veya yararlanmak amacıyla suyu biriktirilen kaynakları veya kuyuları kazı, yapı veya benzeri faaliyetler yüzünden kısmen olsun keserek ya da kirleterek malikine veya onda hak sahibi olana zarar veren kimse, bu zararı gidermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Zarar kasten veya ihmal yoluyla verilmemişse ya da zarar görenin de kusuru varsa hâkim, tazminatın gerekip gerekmediğini, gerekiyorsa miktar ve türünü takdir eder.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Eski duruma getirme">
                <mvz-madde no="758" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir taşınmazda oturmak, onu işletmek veya bir yerin içme ya da kullanma suyunu sağlamak için gerekli olan kaynaklar kesilir ve kirletilirse, kaynağın olabildiği ölçüde eski duruma getirilmesi istenebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bunlar dışında eski duruma getirme, ancak özel hâller haklı gösterdiği takdirde istenebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Aynı yataktan beslenen kaynaklar">
              <mvz-madde no="759" başlık="">
                <mvz-fıkra no="1">
                  <template>Değişik maliklere ait komşu kaynaklar, ortak bir ana kaynaktan beslenmekte ise maliklerden her biri, bu kaynakların birlikte tutulmasını ve suyun hak sahiplerine o zamana kadarki yararlanmaları oranında dağıtılmasını isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hak sahipleri, ortak tesis masraflarını yararlanmaları oranında üstlenirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Birinin karşı çıkması hâlinde, hak sahiplerinden her biri, diğer kaynaklardaki su azalacak olsa bile, kendi kaynağındaki suyun tutulup akıtılması için gerekli işleri yapabilir ve kendi kaynağına gelen suyun miktarı bu işler sonunda çoğaldığı takdirde, ancak bu çoğalma oranında bir bedel vermekle yükümlü olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Özel kanun hükümleri ve yerel âdet">
              <mvz-madde no="760" başlık="">
                <mvz-fıkra no="1">
                  <template>Özel mülkiyete tâbi arazide bulunan kaynak, kuyu veya derelerden komşuların ve diğer kişilerin su içme, su alma veya hayvan sulama ya da benzer yollarla yararlanmaları özel kanun hükümlerine tâbidir. Özel kanun hükmü yoksa yerel âdet uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Zorunlu su">
              <mvz-madde no="761" başlık="">
                <mvz-fıkra no="1">
                  <template>Evi, arazisi veya işletmesi için gerekli sudan yoksun olup, bunu aşırı zahmet ve gidere katlanmaksızın başka yoldan sağlayamayan taşınmaz maliki, komşusundan, onun ihtiyacından fazla olan suyu tam bir bedel karşılığında almasını sağlayacak bir irtifak kurulmasını isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Zorunlu su irtifakının kurulmasında öncelikle kaynak sahibinin menfaati gözetilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Durum değişirse, kurulmuş irtifak hakkının değiştirilmesi veya kaldırılması istenebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="TAŞINIR MÜLKİYETİ">
        <mvz-b1 no="A" başlık="Konusu">
          <mvz-madde no="762" başlık="">
            <mvz-fıkra no="1">
              <template>Taşınır mülkiyetinin konusu, nitelikleri itibarıyla taşınabilen maddî şeyler ile edinmeye elverişli olan ve taşınmaz mülkiyetinin kapsamına girmeyen doğal güçlerdir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Kazanılması">
          <mvz-b2 no="I" başlık="Mülkiyetin nakli">
            <mvz-b3 no="1" başlık="Zilyetliğin devri">
              <mvz-madde no="763" başlık="">
                <mvz-fıkra no="1">
                  <template>Taşınır mülkiyetinin nakli için zilyetliğin devri gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
