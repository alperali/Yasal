                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="5" başlık="Meslek veya sanat">
                <mvz-madde no="453" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vesayet altındaki kişiye vesayet makamı tarafından bir meslek veya sanatın yürütülmesi için izin verilmiş ise, o kişi bununla ilgili her türlü olağan işlemleri yapmaya yetkilidir ve bu tür işlemlerden dolayı bütün malvarlığı ile sorumludur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Malvarlığının yönetilmesi">
            <mvz-b2 no="I" başlık="Yönetim ve hesap tutma yükümlülüğü">
              <mvz-madde no="454" başlık="">
                <mvz-fıkra no="1">
                  <template>Vasi, vesayet altındaki kişinin malvarlığını iyi bir yönetici gibi özenle yönetmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vasi, yönetimle ilgili hesap tutmak ve vesayet makamının belirlediği tarihlerde ve her hâlde yılda bir defa hesabı onun incelemesine sunmakla yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Vesayet altındaki kişi görüşlerini oluşturma ve açıklama yeteneğine sahip ise, hesabın hâkim tarafından incelenmesi sırasında olanak ölçüsünde hazır bulundurulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Serbest mallar">
              <mvz-madde no="455" başlık="">
                <mvz-fıkra no="1">
                  <template>Vesayet altındaki kişi, kendi tasarrufuna bırakılmış olan mallar ile vasinin izniyle çalışarak kazandığı malları serbestçe yönetir ve kullanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Görevin süresi">
            <mvz-madde no="456" başlık="">
              <mvz-fıkra no="1">
                <template>Vasi, kural olarak iki yıl için atanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vesayet makamı, bu süreyi her defasında ikişer yıl uzatabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Dört yıl dolunca vasi, vasilikten kaçınma hakkını kullanabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Vasinin ücreti">
            <mvz-madde no="457" başlık="">
              <mvz-fıkra no="1">
                <template>Vasi, vesayet altındaki kişinin malvarlığından, olanak bulunmadığı takdirde Hazineden karşılanmak üzere kendisine bir ücret verilmesini isteyebilir. Ödenecek ücret, yönetimin gerektirdiği emek ve yönetilen malvarlığının geliri göz önünde tutulmak suretiyle her hesap dönemi için vesayet makamı tarafından belirlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="KAYYIMIN GÖREVLERİ">
          <mvz-b1 no="A" başlık="Kayyımın konumu">
            <mvz-madde no="458" başlık="">
              <mvz-fıkra no="1">
                <template>Bir kimseye kayyım atanması onun fiil ehliyetini etkilemez. Yasal danışmanlığa ilişkin hükümler saklıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kayyımın görev süresi ve ücreti vesayet makamı tarafından belirlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Kayyımlığın kapsamı">
            <mvz-b2 no="I" başlık="Belli bir iş">
              <mvz-madde no="459" başlık="">
                <mvz-fıkra no="1">
                  <template>Belli bir iş için görevlendirilmiş olan kayyım, vesayet makamının talimatına aynen uymak zorundadır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Malvarlığının yönetimi">
              <mvz-madde no="460" başlık="">
                <mvz-fıkra no="1">
                  <template>Kayyım bir malvarlığının yönetimi ve gözetimi ile görevlendirilmiş ise, yalnız o malvarlığının yönetim ve korunması için gerekli olan işleri yapabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kayyımın, bunun dışındaki işleri yapabilmesi, temsil olunanın vereceği özel yetkiye, temsil olunan bu yetkiyi verecek durumda değilse vesayet makamının iznine bağlıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="VESAYET DAİRELERİNİN GÖREVLERİ">
          <mvz-b1 no="A" başlık="Şikâyet ve itiraz">
            <mvz-madde no="461" başlık="">
              <mvz-fıkra no="1">
                <template>Ayırt etme gücüne sahip olan vesayet altındaki kişi ve her ilgili, vasinin eylem ve işlemlerine karşı vesayet makamına şikâyette bulunabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vesayet makamının kararlarına karşı tebliğ gününden başlayarak on gün içinde denetim makamına itiraz edilebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="İzin">
            <mvz-b2 no="I" başlık="Vesayet makamından">
              <mvz-madde no="462" başlık="">
                <mvz-fıkra no="1">
                  <template>Aşağıdaki hâllerde vesayet makamının izni gereklidir:</template>
                  <mvz-bent no="1.">
                    <template>Taşınmazların alımı, satımı, rehnedilmesi ve bunlar üzerinde başka bir aynî hak kurulması,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Olağan yönetim ve işletme ihtiyaçları dışında kalan taşınır veya diğer hak ve değerlerin alımı, satımı, devri ve rehnedilmesi,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Olağan yönetim sınırlarını aşan yapı işleri,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Ödünç verme ve alma,</template>
                  </mvz-bent>
                  <mvz-bent no="5.">
                    <template>Kambiyo taahhüdü altına girme,</template>
                  </mvz-bent>
                  <mvz-bent no="6.">
                    <template>Bir yıl veya daha uzun süreli ürün ve üç yıl veya daha uzun süreli taşınmaz kirası sözleşmeleri yapılması,</template>
                  </mvz-bent>
                  <mvz-bent no="7.">
                    <template>Vesayet altındaki kişinin bir sanat veya meslekle uğraşması,</template>
                  </mvz-bent>
                  <mvz-bent no="8.">
                    <template>Acele hâllerde vasinin geçici önlemler alma yetkisi saklı kalmak üzere, dava açma, sulh olma, tahkim ve konkordato yapılması,</template>
                  </mvz-bent>
                  <mvz-bent no="9.">
                    <template>Mal rejimi sözleşmeleri, mirasın paylaştırılması ve miras payının devri sözleşmeleri yapılması,</template>
                  </mvz-bent>
                  <mvz-bent no="10.">
                    <template>Borç ödemeden aciz beyanı,</template>
                  </mvz-bent>
                  <mvz-bent no="11.">
                    <template>Vesayet altındaki kişi hakkında hayat sigortası yapılması,</template>
                  </mvz-bent>
                  <mvz-bent no="12.">
                    <template>Çıraklık sözleşmesi yapılması,</template>
                  </mvz-bent>
                  <mvz-bent no="13.">
                    <template>Vesayet altındaki kişinin bir eğitim, bakım veya sağlık kurumuna yerleştirilmesi,</template>
                  </mvz-bent>
                  <mvz-bent no="14.">
                    <template>Vesayet altındaki kişinin yerleşim yerinin değiştirilmesi.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Denetim makamından">
              <mvz-madde no="463" başlık="">
                <mvz-fıkra no="1">
                  <template>Aşağıdaki hâllerde vesayet makamının izninden sonra denetim makamının da izni gereklidir:</template>
                  <mvz-bent no="1.">
                    <template>Vesayet altındaki kişinin evlât edinmesi veya evlât edinilmesi,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Vesayet altındaki kişinin vatandaşlığa girmesi veya çıkması,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Bir işletmenin devralınması veya tasfiyesi, kişisel sorumluluğu gerektiren bir ortaklığa girilmesi veya önemli bir sermaye ile bir şirkete ortak olunması,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Ömür boyu aylık veya gelir bağlama veya ölünceye kadar bakma sözleşmeleri yapılması,</template>
                  </mvz-bent>
                  <mvz-bent no="5.">
                    <template>Mirasın kabulü, reddi veya miras sözleşmesi yapılması,</template>
                  </mvz-bent>
                  <mvz-bent no="6.">
                    <template>Küçüğün ergin kılınması,</template>
                  </mvz-bent>
                  <mvz-bent no="7.">
                    <template>Vesayet altındaki kişi ile vasi arasında sözleşme yapılması.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Rapor ve hesapların incelenmesi">
            <mvz-madde no="464" başlık="">
              <mvz-fıkra no="1">
                <template>Vesayet makamı, vasinin belli dönemlerde vereceği rapor ve hesapları inceler; gerekli gördüğü hâllerde bunların tamamlanması veya düzeltilmesini ister.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vesayet makamı, rapor ve hesapları kabul veya reddeder; gerektiğinde vesayet altındaki kişinin menfaatini korumak için uygun önlemleri alır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="İznin bulunmaması">
            <mvz-madde no="465" başlık="">
              <mvz-fıkra no="1">
                <template>Kanunen gerektiği hâlde vasinin yetkili vesayet dairelerinin iznini almadan yapmış olduğu işlemler, vesayet altındaki kişinin vasinin izni olmaksızın yaptığı işlem hükmündedir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="VESAYET ORGANLARININ SORUMLULUĞU">
          <mvz-b1 no="A" başlık="Özen yükümü">
            <mvz-madde no="466" başlık="">
              <mvz-fıkra no="1">
                <template>Vesayet organları ve vesayet işleriyle görevlendirilmiş olan diğer kişiler, bu görevlerini yerine getirirlerken iyi bir yönetimin gerektirdiği özeni göstermekle yükümlüdürler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Vasinin sorumluluğu">
            <mvz-madde no="467" başlık="">
              <mvz-fıkra no="1">
                <template>Vasi, görevini yerine getirirken kusurlu davranışıyla vesayet altındaki kişiye verdiği zarardan sorumludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kayyım ve yasal danışmanlar hakkında da aynı hüküm uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Devletin sorumluluğu">
            <mvz-madde no="468" başlık="">
              <mvz-fıkra no="1">
                <template>Devlet, vesayet dairelerinde görevli olanların hukuka aykırı olarak sebebiyet verdikleri zararlardan doğrudan doğruya sorumlu olduğu gibi; vasi, kayyım ve yasal danışmanlara tazmin ettirilemeyen zararlardan da sorumludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zararı tazmin eden Devlet, zararın meydana gelmesinde kusurlu olanlara rücu eder.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Zararın doğmasına kusurları ile sebep olanlar, rücu hakkını kullanan Devlete karşı müteselsilen sorumludurlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Görev ve yetki">
            <mvz-madde no="469" başlık="">
              <mvz-fıkra no="1">
                <template>Devletin vesayet dairelerinde görevli kişilere karşı rücu davasına bakmaya, vesayet dairelerinin bulunduğu yere en yakın asliye mahkemesi yetkilidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vesayetle ilgili tazminat ve diğer rücu davaları vesayet dairelerinin bulunduğu yer asliye mahkemesinde görülür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="VESAYETİN SONA ERMESİ">
        <mvz-ayırım no="1-BİRİNCİ" başlık="VESAYETİ GEREKTİREN HÂLLERİN SONA ERMESİ">
          <mvz-b1 no="A" başlık="Küçüklerde">
            <mvz-madde no="470" başlık="">
              <mvz-fıkra no="1">
                <template>Küçük üzerindeki vesayet, onun ergin olmasıyla kendiliğinden sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Erginliğe mahkemece karar verilmiş ise, mahkeme aynı zamanda küçüğün hangi tarihte ergin olacağını tespit ve ilân eder.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Hükümlülerde">
            <mvz-madde no="471" başlık="">
              <mvz-fıkra no="1">
                <template>Özgürlüğü bağlayıcı cezaya mahkûmiyet sebebiyle kısıtlı bulunan kişi üzerindeki vesayet, hapis hâlinin hukuka uygun bir şekilde sona ermesiyle kendiliğinden ortadan kalkar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hapis hâlinin devamı süresince aşağıdaki şartların varlığı hâlinde vesayet sona erdirilebilir:</template>
                <mvz-bent no="1.">
                  <template>Toplam beş yıldan az olan hapis cezasının infazına bağlı olarak verilen kısıtlama kararları bakımından kişinin isteminin bulunması,</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Toplam beş yıl veya daha fazla kesinleşmiş hapis cezasının infazına bağlı olarak verilen kısıtlama kararları bakımından kişinin talebi üzerine kişiliğinin veya malvarlığının korunması sebebinin ortadan kalkması.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Diğer kısıtlılarda">
            <mvz-b2 no="I" başlık="Kaldırılması">
              <mvz-madde no="472" başlık="">
                <mvz-fıkra no="1">
                  <template>Diğer kısıtlılar üzerindeki vesayet, yetkili vesayet makamının kararıyla sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vesayeti gerektiren sebebin ortadan kalkması üzerine vesayet makamı vesayetin sona ermesine karar verir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kısıtlı ve ilgililerden her biri, vesayetin kaldırılması isteminde bulunabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Usulü">
              <mvz-b3 no="1" başlık="İlân">
                <mvz-madde no="473" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kısıtlama ilân edilmişse, kaldırılması da ilân olunur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Fiil ehliyetinin yeniden kazanılması, ilânın yapılmasına bağlı değildir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Akıl hastalığı veya akıl zayıflığında">
                <mvz-madde no="474" başlık="">
                  <mvz-fıkra no="1">
                    <template>Akıl hastalığı veya akıl zayıflığı yüzünden kısıtlanmış olan kişi üzerindeki vesayetin kaldırılmasına, ancak kısıtlama sebebinin ortadan kalkmış olduğunun resmî sağlık kurulu raporu ile belirlenmesi hâlinde karar verilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Savurganlık, alkol veya uyuşturucu madde bağımlılığı, kötü yaşama tarzı, kötü yönetimde">
                <mvz-madde no="475" başlık="">
                  <mvz-fıkra no="1">
                    <template>Savurganlığı, alkol veya uyuşturucu madde bağımlılığı, kötü yaşama tarzı veya malvarlığını kötü yönetmesi sebebiyle kısıtlanmış olan kişinin vesayetin kaldırılmasını isteyebilmesi, en az bir yıldan beri vesayet altına alınmasını gerektiren sebeple ilgili olarak bir şikâyete meydan vermemiş olmasına bağlıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="İstek üzerine kısıtlamada">
                <mvz-madde no="476" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kendi isteğiyle kısıtlanmış olan kişi üzerindeki vesayetin kaldırılması, kısıtlamayı gerektiren sebebin ortadan kalkmasına bağlıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Kayyımlıkta ve yasal danışmanlıkta">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="477" başlık="">
                <mvz-fıkra no="1">
                  <template>Temsil kayyımlığı, kayyımın yapmakla görevlendirildiği işin bitirilmesiyle sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yönetim kayyımlığı, kayyımın atanmasını gerektiren sebebin ortadan kalkması veya kayyımın görevden alınmasıyla sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Yasal danışmanlık, vesayetin kaldırılmasına ilişkin hükümler uyarınca vesayet makamının kararıyla sona erer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="İlân">
              <mvz-madde no="478" başlık="">
                <mvz-fıkra no="1">
                  <template>Atamanın ilân edilmiş olması veya vesayet makamının gerekli görmesi hâllerinde, kayyımlığın sona erdiği de ilân olunur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="VASİLİK GÖREVİNİN SONA ERMESİ">
          <mvz-b1 no="A" başlık="Fiil ehliyetinin yitirilmesi ve ölüm">
            <mvz-madde no="479" başlık="">
              <mvz-fıkra no="1">
                <template>Vasilik görevi, vasinin fiil ehliyetini yitirmesi veya ölümüyle sona erer.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Sürenin sona ermesi ve uzatılmaması">
            <mvz-b2 no="I" başlık="Sürenin dolması">
              <mvz-madde no="480" başlık="">
                <mvz-fıkra no="1">
                  <template>Vasilik görevi, uzatılmadığı takdirde, sürenin dolmasıyla sona erer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Engelin veya kaçınma sebebinin ortaya çıkması">
              <mvz-madde no="481" başlık="">
                <mvz-fıkra no="1">
                  <template>Vasi, vasiliğe engel bir sebebin ortaya çıkması hâlinde görevinden çekilmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vasi, bir kaçınma sebebi ortaya çıktığı takdirde sürenin bitiminden önce görevinden alınmasını isteyebilir; ancak, önemli sebeplerin varlığı hâlinde görevine devam etmek zorundadır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Göreve devam zorunluluğu">
              <mvz-madde no="482" başlık="">
                <mvz-fıkra no="1">
                  <template>Görevi sona eren vasi, yenisi göreve başlayıncaya kadar zorunlu işleri yapmakla yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Görevden alınma">
            <mvz-b2 no="I" başlık="Sebepleri">
              <mvz-madde no="483" başlık="">
                <mvz-fıkra no="1">
                  <template>Vasi, görevini ağır surette savsaklar, yetkilerini kötüye kullanır veya güveni sarsıcı davranışlarda bulunur ya da borç ödemede acze düşerse, vesayet makamı tarafından görevden alınır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vasinin görevini yapmakta yetersizliği sebebiyle vesayet altındaki kişinin menfaatleri tehlikeye düşerse, vesayet makamı kusuru olmasa bile vasiyi görevden alabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Usulü">
              <mvz-b3 no="1" başlık="İstek üzerine veya re'sen">
                <mvz-madde no="484" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ayırt etme gücüne sahip olan vesayet altındaki kişi veya her ilgili, vasinin görevden alınmasını isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Görevden alınmayı gerektiren sebebin varlığını başka bir yoldan öğrenen vesayet makamı, vasiyi re'sen görevden almakla yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Araştırma ve uyarı">
                <mvz-madde no="485" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vesayet makamı, ancak gerekli araştırmayı yaptıktan ve vasiyi dinledikten sonra onu görevden alabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Vesayet makamı, ağır olmayan hâllerde vasiye görevden alınacağı konusunda uyarıda bulunur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Geçici önlemler">
                <mvz-madde no="486" başlık="">
                  <mvz-fıkra no="1">
                    <template>Gecikmesinde tehlike bulunan hâllerde vesayet makamı, vasiye geçici olarak işten el çektirip bir kayyım atayabileceği gibi; gerekirse muhtemel zararı göz önünde bulundurarak vasinin mallarına ihtiyati haciz koyabilir ve tutuklanmasını da isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Diğer önlemler">
                <mvz-madde no="487" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vesayet makamı, görevden alma ve uyarıda bulunmanın yanı sıra, vesayet altındaki kişinin korunması için gerekli diğer önlemleri de almakla yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="5" başlık="İtiraz">
                <mvz-madde no="488" başlık="">
                  <mvz-fıkra no="1">
                    <template>İlgililer, vesayet makamının kararlarına karşı, tebliğ gününden başlayarak on gün içinde denetim makamına itiraz edebilirler. Denetim makamı, gerektiğinde duruşma da yaparak bu itirazı kesin karara bağlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="VESAYETİN SONA ERMESİNİN SONUÇLARI">
          <mvz-b1 no="A" başlık="Kesin hesap ve malvarlığının teslimi">
            <mvz-madde no="489" başlık="">
              <mvz-fıkra no="1">
                <template>Görevi sona eren vasi, yönetimle ilgili son raporu ve kesin hesabı vesayet makamına vermekle yükümlü olduğu gibi; malvarlığını vesayet altındaki kişiye, mirasçılarına veya yeni vasiye teslim edilmek üzere hazır bulundurmak zorundadır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Rapor ve hesabın incelenmesi">
            <mvz-madde no="490" başlık="">
              <mvz-fıkra no="1">
                <template>Son rapor ve kesin hesap belli zamanlarda verilen rapor ve hesaplar gibi vesayet makamı tarafından incelenir ve onaylanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Vasinin görevine son verilmesi">
            <mvz-madde no="491" başlık="">
              <mvz-fıkra no="1">
                <template>Son rapor ve kesin hesap onaylandıktan ve malvarlığı vesayet altındaki kişiye, mirasçılarına veya yeni vasiye teslim edildikten sonra, vesayet makamı vasinin görevinin sona erdiğine karar verir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vesayet makamı, son rapor ve kesin hesabın onaylanması veya reddi konusundaki kararı ile birlikte kesin hesabı vesayet altındaki kişiye, mirasçılarına veya yeni vasiye, tazminat davası açma hakları bulunduğunu da belirtmek suretiyle tebliğ eder. Bu tebliğde vasinin görevine son verildiği de belirtilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Sorumluluk davasında zamanaşımı">
            <mvz-b2 no="I" başlık="Olağan zamanaşımı">
              <mvz-madde no="492" başlık="">
                <mvz-fıkra no="1">
                  <template>Sorumlu vasi ve kayyıma karşı açılacak tazminat davası kesin hesabın tebliğ edildiği tarihten başlayarak bir yıl geçmekle zamanaşımına uğrar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tazmin ettirilemeyen zararlar için Devlete karşı açılacak tazminat davasının zamanaşımı süresi, zararın vasi, kayyım ve yasal danışmana tazmin ettirilemeyeceğinin anlaşılmasından başlayarak bir yıldır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Vesayet dairelerinde görevli olanların sebebiyet verdikleri zararlardan dolayı Devlete karşı açılacak davaların zamanaşımı genel hükümlere tâbidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Devletin rücu davası, rücu hakkının doğumunun üzerinden bir yıl geçmekle zamanaşımına uğrar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Olağanüstü zamanaşımı">
              <mvz-madde no="493" başlık="">
                <mvz-fıkra no="1">
                  <template>Olağan zamanaşımı süresi işlemeye başlamadan önce zarar gören tarafından bilinmesi veya anlaşılması olanağı bulunmayan bir hesap yanlışlığına veya bir sorumluluk sebebine dayanan tazminat davası, hesap yanlışlığının veya sorumluluk sebebinin öğrenilmesinden başlayarak bir yıl içinde açılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vesayetten doğan tazminat davaları, her hâlde kesin hesabın tebliğinin üzerinden on yıl geçmekle zamanaşımına uğrar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Vesayet altındaki kişinin alacağı">
            <mvz-madde no="494" başlık="">
              <mvz-fıkra no="1">
                <template>Vesayet altındaki kişinin vasi veya Devlete karşı alacakları imtiyazlı alacaktır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="3-ÜÇÜNCÜ" başlık="MİRAS HUKUKU">
    <mvz-kısım no="1-BİRİNCİ" başlık="MİRASÇILAR">
      <mvz-bölüm no="1-BİRİNCİ" başlık="YASAL MİRASÇILAR">
        <mvz-b1 no="A" başlık="Kan hısımları">
          <mvz-b2 no="I" başlık="Altsoy">
            <mvz-madde no="495" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakanın birinci derece mirasçıları, onun altsoyudur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Çocuklar eşit olarak mirasçıdırlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Mirasbırakandan önce ölmüş olan çocukların yerini, her derecede halefiyet yoluyla kendi altsoyları alır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Ana ve baba">
            <mvz-madde no="496" başlık="">
              <mvz-fıkra no="1">
                <template>Altsoyu bulunmayan mirasbırakanın mirasçıları, ana ve babasıdır. Bunlar eşit olarak mirasçıdırlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Mirasbırakandan önce ölmüş olan ana ve babanın yerlerini, her derecede halefiyet yoluyla kendi altsoyları alır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bir tarafta hiç mirasçı bulunmadığı takdirde, bütün miras diğer taraftaki mirasçılara kalır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Büyük ana ve büyük baba">
            <mvz-madde no="497" başlık="">
              <mvz-fıkra no="1">
                <template>Altsoyu, ana ve babası ve onların altsoyu bulunmayan mirasbırakanın mirasçıları, büyük ana ve büyük babalarıdır. Bunlar, eşit olarak mirasçıdırlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Mirasbırakandan önce ölmüş olan büyük ana ve büyük babaların yerlerini, her derecede halefiyet yoluyla kendi altsoyları alır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Ana veya baba tarafından olan büyük ana ve büyük babalardan biri altsoyu bulunmaksızın mirasbırakandan önce ölmüşse, ona düşen pay aynı taraftaki mirasçılara kalır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Ana veya baba tarafından olan büyük ana ve büyük babaların ikisi de altsoyları bulunmaksızın mirasbırakandan önce ölmüşlerse, bütün miras diğer taraftaki mirasçılara kalır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Sağ kalan eş varsa, büyük ana ve büyük babalardan birinin mirasbırakandan önce ölmüş olması hâlinde, payı kendi çocuğuna; çocuğu yoksa o taraftaki büyük ana ve büyük babaya; bir taraftaki büyük ana ve büyük babanın her ikisinin de ölmüş olmaları hâlinde onların payları diğer tarafa geçer.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Evlilik dışı hısımlar">
            <mvz-madde no="498" başlık="">
              <mvz-fıkra no="1">
                <template>Evlilik dışında doğmuş ve soybağı, tanıma veya hâkim hükmüyle kurulmuş olanlar, baba yönünden evlilik içi hısımlar gibi mirasçı olurlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Sağ kalan eş">
          <mvz-madde no="499" başlık="">
            <mvz-fıkra no="1">
              <template>Sağ kalan eş, birlikte bulunduğu zümreye göre mirasbırakana aşağıdaki oranlarda mirasçı olur:</template>
              <mvz-bent no="1.">
                <template>Mirasbırakanın altsoyu ile birlikte mirasçı olursa, mirasın dörtte biri,</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Mirasbırakanın ana ve baba zümresi ile birlikte mirasçı olursa, mirasın yarısı,</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Mirasbırakanın büyük ana ve büyük babaları ve onların çocukları ile birlikte mirasçı olursa, mirasın dörtte üçü, bunlar da yoksa mirasın tamamı eşe kalır.</template>
              </mvz-bent>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Evlâtlık">
          <mvz-madde no="500" başlık="">
            <mvz-fıkra no="1">
              <template>Evlâtlık ve altsoyu, evlât edinene kan hısımı gibi mirasçı olurlar. Evlâtlığın kendi ailesindeki mirasçılığı da devam eder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Evlât edinen ve hısımları, evlâtlığa mirasçı olmazlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Devlet">
          <mvz-madde no="501" başlık="">
            <mvz-fıkra no="1">
              <template>Mirasçı bırakmaksızın ölen kimsenin mirası Devlete geçer.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="ÖLÜME BAĞLI TASARRUFLAR">
        <mvz-ayırım no="1-BİRİNCİ" başlık="TASARRUF EHLİYETİ">
          <mvz-b1 no="A" başlık="Ehliyet">
            <mvz-b2 no="I" başlık="Vasiyette">
              <mvz-madde no="502" başlık="">
                <mvz-fıkra no="1">
                  <template>Vasiyet yapabilmek için ayırt etme gücüne sahip ve onbeş yaşını doldurmuş olmak gerekir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Miras sözleşmesinde">
              <mvz-madde no="503" başlık="">
                <mvz-fıkra no="1">
                  <template>Miras sözleşmesi yapabilmek için ayırt etme gücüne sahip ve ergin olmak, kısıtlı bulunmamak gerekir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="İrade sakatlığı">
            <mvz-madde no="504" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakanın yanılma, aldatma, korkutma veya zorlama etkisi altında yaptığı ölüme bağlı tasarruf geçersizdir. Ancak, mirasbırakan yanıldığını veya aldatıldığını öğrendiği ya da korkutma veya zorlamanın etkisinden kurtulduğu günden başlayarak bir yıl içinde tasarruftan dönmediği takdirde tasarruf geçerli sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ölüme bağlı tasarrufta kişinin veya şeyin belirtilmesinde açık yanılma hâlinde mirasbırakanın gerçek arzusu kesin olarak tespit edilebilirse, tasarruf bu arzuya göre düzeltilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="TASARRUF ÖZGÜRLÜĞÜ">
          <mvz-b1 no="A" başlık="Tasarruf edilebilir kısım">
            <mvz-b2 no="I" başlık="Kapsamı">
              <mvz-madde no="505" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçı olarak altsoyu, ana ve babası veya eşi bulunan miras bırakan, mirasının saklı paylar dışında kalan kısmında ölüme bağlı tasarrufta bulunabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu mirasçılardan hiç biri yoksa, mirasbırakan mirasının tamamında tasarruf edebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Saklı pay">
              <mvz-madde no="506" başlık="">
                <mvz-fıkra no="1">
                  <template>Saklı pay aşağıdaki oranlardan ibarettir:</template>
                  <mvz-bent no="1.">
                    <template>Altsoy için yasal miras payının yarısı,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Ana ve babadan her biri için yasal miras payının dörtte biri,</template>
                  </mvz-bent>
                  <mvz-bent no="3." durum="mülga">
                    <template></template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Sağ kalan eş için, altsoy veya ana ve baba zümresiyle birlikte mirasçı olması hâlinde yasal miras payının tamamı, diğer hâllerde yasal miras payının dörtte üçü.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Tasarruf edilebilir kısmın hesabı">
              <mvz-b3 no="1" başlık="Borçların indirilmesi">
                <mvz-madde no="507" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tasarruf edilebilir kısım, terekenin mirasbırakanın ölümü günündeki durumuna göre hesaplanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Hesap yapılırken, mirasbırakanın borçları, cenaze giderleri, terekenin mühürlenmesi ve yazımı giderleri, mirasbırakan ile birlikte yaşayan ve onun tarafından bakılan kimselerin üç aylık geçim giderleri terekeden indirilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Sağlararası karşılıksız kazandırmalar">
                <mvz-madde no="508" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakanın sağlararası karşılıksız kazandırmaları, tenkise tâbi oldukları ölçüde, tasarruf edilebilir kısmın hesabında terekeye eklenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Sigorta alacakları">
                <mvz-madde no="509" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakanın kendi ölümünde ödenmek üzere üçüncü kişi lehine hayat sigortası sözleşmesi yapması veya böyle bir kişiyi sonradan lehdar olarak tayin etmesi ya da sigortacıya karşı olan istem hakkını sağlararası veya ölüme bağlı tasarrufla karşılıksız olarak üçüncü kişiye devretmesi hâlinde, sigorta alacağının mirasbırakanın ölümü zamanındaki satın alma değeri terekeye eklenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Mirasçılıktan çıkarma">
            <mvz-b2 no="I" başlık="Sebepleri">
              <mvz-madde no="510" başlık="">
                <mvz-fıkra no="1">
                  <template>Aşağıdaki durumlarda mirasbırakan, ölüme bağlı bir tasarrufla saklı paylı mirasçısını mirasçılıktan çıkarabilir:</template>
                  <mvz-bent no="1.">
                    <template>Mirasçı, mirasbırakana veya mirasbırakanın yakınlarından birine karşı ağır bir suç işlemişse,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Mirasçı, mirasbırakana veya mirasbırakanın ailesi üyelerine karşı aile hukukundan doğan yükümlülüklerini önemli ölçüde yerine getirmemişse.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Hükümleri">
              <mvz-madde no="511" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçılıktan çıkarılan kimse, mirastan pay alamayacağı gibi; tenkis davası da açamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasbırakan başka türlü tasarrufta bulunmuş olmadıkça, mirasçılıktan çıkarılan kimsenin miras payı, o kimse mirasbırakandan önce ölmüş gibi, mirasçılıktan çıkarılanın varsa altsoyuna, yoksa mirasbırakanın yasal mirasçılarına kalır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Mirasçılıktan çıkarılan kimsenin altsoyu, o kimse mirasbırakandan önce ölmüş gibi saklı payını isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="İspat yükü">
              <mvz-madde no="512" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçılıktan çıkarma, mirasbırakan ancak buna ilişkin tasarrufunda çıkarma sebebini belirtmişse geçerlidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasçılıktan çıkarılan kimse itiraz ederse, belirtilen sebebin varlığını ispat, çıkarmadan yararlanan mirasçıya veya vasiyet alacaklısına düşer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Sebebin varlığı ispat edilememiş veya çıkarma sebebi tasarrufta belirtilmemişse tasarruf, mirasçının saklı payı dışında yerine getirilir; ancak, mirasbırakan bu tasarrufu çıkarma sebebi hakkında düştüğü açık bir yanılma yüzünden yapmışsa, çıkarma geçersiz olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Borç ödemeden aciz sebebiyle mirasçılıktan çıkarma">
              <mvz-madde no="513" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakan, hakkında borç ödemeden aciz belgesi bulunan altsoyunu, saklı payının yarısı için mirasçılıktan çıkarabilir. Ancak, bu yarıyı mirasçılıktan çıkarılanın doğmuş ve doğacak çocuklarına özgülemesi şarttır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Miras açıldığı zaman borç ödemeden aciz belgesinin hükmü kalmamışsa veya belgenin kapsadığı borç tutarı mirasçılıktan çıkarılanın miras payının yarısını aşmıyorsa, mirasçılıktan çıkarılanın istemi üzerine çıkarma iptal olunur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="ÖLÜME BAĞLI TASARRUFLARIN ÇEŞİTLERİ">
          <mvz-b1 no="A" başlık="Genel olarak">
            <mvz-madde no="514" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakan, tasarruf özgürlüğünün sınırları içinde, malvarlığının tamamında veya bir kısmında vasiyetname ya da miras sözleşmesiyle tasarrufta bulunabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Mirasbırakanın üzerinde tasarruf etmediği kısım yasal mirasçılarına kalır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Koşullar ve yüklemeler">
            <mvz-madde no="515" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakan, ölüme bağlı tasarruflarını koşullara veya yüklemelere bağlayabilir. Tasarruf hüküm ve sonuçlarını doğurduğu andan itibaren, her ilgili koşul veya yüklemenin yerine getirilmesini isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hukuka veya ahlâka aykırı koşullar ve yüklemeler, ilişkin bulundukları tasarrufu geçersiz kılar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Anlamsız veya yalnız başkalarını rahatsız edici nitelikte olan koşullar ve yüklemeler yok sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Mirasçı atama">
            <mvz-madde no="516" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakan, mirasının tamamı veya belli bir oranı için bir veya birden çok kişiyi mirasçı atayabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bir kişinin, mirasın tamamını veya belli bir oranını almasını içeren her tasarruf, mirasçı atanması sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Belirli mal bırakma">
            <mvz-b2 no="I" başlık="Konusu">
              <mvz-madde no="517" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakan, bir kimseye onu mirasçı atamaksızın belirli bir mal bırakma yoluyla kazandırmada bulunabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Belirli mal bırakma, ölüme bağlı tasarrufla bir kimseye terekedeki bir malın mülkiyetinin veya terekenin tamamı ya da bir kısmı üzerinde intifa hakkının kazandırılmasına yönelik olabileceği gibi; bir kimse lehine tereke değeri üzerinden bir edimin yerine getirilmesinin, bir iradın bağlanmasının veya bir kimsenin bir borçtan kurtarılmasının, mirasçılar veya belirli mal bırakılanlara yükletilmesi suretiyle de olabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bırakılan belirli mal terekede bulunmadığı takdirde, tasarruftan aksi anlaşılmadıkça, ölüme bağlı tasarrufu yerine getirmekle yükümlü olanlar borçtan kurtulurlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Teslim borcu">
              <mvz-madde no="518" başlık="">
                <mvz-fıkra no="1">
                  <template>Bırakılan belirli mal, mirasın açılması anındaki durumuyla teslim olunur; yarar ve hasar, mirasın açılması anında kendisine belirli mal bırakılana geçer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tasarrufu yerine getirme ile yükümlü olan kimse, mirasın açılmasından sonra bırakılan belirli mala yaptığı harcamalar ve mala verdiği zararlardan dolayı, vekâletsiz iş görenin haklarına sahip ve borçlarıyla yükümlü olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Tereke ile ilgisi">
              <mvz-madde no="519" başlık="">
                <mvz-fıkra no="1">
                  <template>Tereke mevcudunu veya tasarrufu yerine getirme yükümlüsüne yapılan kazandırmayı ya da saklı payı zedeleyen tasarrufların orantılı olarak tenkisi istenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tasarrufu yerine getirme yükümlüsü, mirasçılığı veya kendisine bırakılan kazandırmayı reddetmiş ya da mirasbırakandan önce ölmüş veya mirastan yoksun kalmış olsa bile tasarruf yürürlükte kalır; yerine getirme borcu, bu durumlardan yararlananlara geçer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Yasal veya atanmış mirasçı, mirası reddetmiş olsa bile lehine yapılmış bir tasarrufun yerine getirilmesini isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Yedek mirasçı atama">
            <mvz-madde no="520" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakan, atadığı mirasçının kendisinden önce ölmesi veya mirası reddetmesi hâlinde onun yerine geçmek üzere bir veya birden çok kişiyi yedek mirasçı olarak atayabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu kural belirli mal bırakmada da uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="F" başlık="Artmirasçı atama">
            <mvz-b2 no="I" başlık="Belirlenmesi">
              <mvz-madde no="521" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakan, ölüme bağlı tasarrufuyla önmirasçı atadığı kişiyi mirası artmirasçıya devretmekle yükümlü kılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Aynı yükümlülük artmirasçıya yüklenemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bu kurallar belirli mal bırakmada da uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Artmirasçıya geçiş">
              <mvz-madde no="522" başlık="">
                <mvz-fıkra no="1">
                  <template>Tasarrufta geçiş anı belirtilmemişse miras, önmirasçının ölümüyle artmirasçıya geçer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tasarrufta geçiş anı gösterilmiş olup önmirasçının ölümünde bu an henüz gelmemişse miras, güvence göstermeleri koşuluyla önmirasçının mirasçılarına teslim edilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Mirasın artmirasçıya geçmesine herhangi bir sebeple olanak kalmadığı anda miras, önmirasçıya; önmirasçı ölmüşse onun mirasçılarına kesin olarak kalır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Güvence">
              <mvz-madde no="523" başlık="">
                <mvz-fıkra no="1">
                  <template>Önmirasçıya geçen mirasın sulh mahkemesince defteri tutulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasbırakan açıkça bağışık tutmadıkça, mirasın önmirasçıya teslimi onun güvence göstermesine bağlıdır. Taşınmazlarda bu güvence, yeterli görüldüğü takdirde mirası geçirme yükümlülüğünün tapu kütüğüne şerh verilmesiyle de sağlanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Önmirasçı güvence göstermez veya artmirasçının beklenen haklarını tehlikeye düşürürse, mirasın resmen yönetimine karar verilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Hükümleri">
              <mvz-b3 no="1" başlık="Önmirasçı hakkında">
                <mvz-madde no="524" başlık="">
                  <mvz-fıkra no="1">
                    <template>Önmirasçı, mirası atanmış mirasçılar gibi kazanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Önmirasçı, mirasa artmirasçıya geçirme yükümlülüğü ile sahip olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Artmirasçı hakkında">
                <mvz-madde no="525" başlık="">
                  <mvz-fıkra no="1">
                    <template>Artmirasçı, mirası belirlenmiş olan geçiş anında sağ ise kazanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Artmirasçı geçiş anından önce ölmüşse, tasarrufta aksi öngörülmüş olmadıkça, miras önmirasçıya kalır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Önmirasçı mirasbırakanın ölümünde sağ değilse veya mirastan yoksun kalmışsa ya da mirası reddederse, miras artmirasçıya geçer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="G" başlık="Vakıf">
            <mvz-madde no="526" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakan, terekesinin tasarruf edilebilir kısmının tamamını veya bir bölümünü özgülemek suretiyle vakıf kurabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vakıf, ancak kanun hükümlerine uyulmak koşuluyla tüzel kişilik kazanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="H" başlık="Miras sözleşmeleri">
            <mvz-b2 no="I" başlık="Olumlu miras sözleşmesi">
              <mvz-madde no="527" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakan, miras sözleşmesiyle mirasını veya belirli malını sözleşme yaptığı kimseye ya da üçüncü bir kişiye bırakma yükümlülüğü altına girebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasbırakan, malvarlığında eskisi gibi serbestçe tasarruf edebilir; ancak, miras sözleşmesindeki yükümlülüğü ile bağdaşmayan ölüme bağlı tasarruflarına veya bağışlamalarına itiraz edilebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Mirastan feragat sözleşmesi">
              <mvz-b3 no="1" başlık="Kapsamı">
                <mvz-madde no="528" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakan, bir mirasçısı ile karşılıksız veya bir karşılık sağlanarak mirastan feragat sözleşmesi yapabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Feragat eden, mirasçılık sıfatını kaybeder.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bir karşılık sağlanarak mirastan feragat, sözleşmede aksi öngörülmedikçe feragat edenin altsoyu için de sonuç doğurur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Hükümden düşmesi">
                <mvz-madde no="529" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirastan feragat sözleşmesi belli bir kişi lehine yapılmış olup bu kişinin herhangi bir sebeple mirasçı olamaması hâlinde, feragat hükümden düşer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Mirastan feragat sözleşmesi belli bir kişi lehine yapılmamışsa, en yakın ortak kökün altsoyu lehine yapılmış sayılır ve bunların herhangi bir sebeple mirasçı olamaması hâlinde, feragat yine hükümden düşer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Tereke alacaklılarının hakları">
                <mvz-madde no="530" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasın açılması anında tereke, borçları karşılayamıyorsa ve borçlar mirasçılar tarafından da ödenmiyorsa, feragat eden ve mirasçıları, alacaklılara karşı feragat için ölümünden önceki beş yıl içinde mirasbırakandan almış oldukları karşılıktan, mirasın açılması anındaki zenginleşmeleri tutarında sorumludurlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="ÖLÜME BAĞLI TASARRUFLARIN ŞEKİLLERİ">
          <mvz-b1 no="A" başlık="Vasiyet">
            <mvz-b2 no="I" başlık="Şekilleri">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="531" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vasiyet, resmî şekilde veya mirasbırakanın el yazısı ile ya da sözlü olarak yapılabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Resmî vasiyetname">
                <mvz-b4 no="a" başlık="Düzenlenmesi">
                  <mvz-madde no="532" başlık="">
                    <mvz-fıkra no="1">
                      <template>Resmî vasiyetname, iki tanığın katılmasıyla resmî memur tarafından düzenlenir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Resmî memur, sulh hâkimi, noter veya kanunla kendisine bu yetki verilmiş diğer bir görevli olabilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Memurun işlevi">
                  <mvz-madde no="533" başlık="">
                    <mvz-fıkra no="1">
                      <template>Mirasbırakan, arzularını resmî memura bildirir. Bunun üzerine memur, vasiyetnameyi yazar veya yazdırır ve okuması için mirasbırakana verir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Vasiyetname, mirasbırakan tarafından okunup imzalanır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Memur, vasiyetnameyi tarih koyarak imzalar.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Tanıkların katılması">
                  <mvz-madde no="534" başlık="">
                    <mvz-fıkra no="1">
                      <template>Vasiyetnameye tarih ve imza konulduktan hemen sonra mirasbırakan, vasiyetnameyi okuduğunu, bunun son arzularını içerdiğini memurun huzurunda iki tanığa beyan eder.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Tanıklar, bu beyanın kendi önlerinde yapıldığını ve mirasbırakanı tasarrufa ehil gördüklerini vasiyetnameye yazarak veya yazdırarak altını imzalarlar.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Vasiyetname içeriğinin tanıklara bildirilmesi zorunlu değildir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="d" başlık="Mirasbırakan tarafından okunmaksızın ve imzalanmaksızın düzenleme">
                  <mvz-madde no="535" başlık="">
                    <mvz-fıkra no="1">
                      <template>Mirasbırakan vasiyetnameyi bizzat okuyamaz veya imzalayamazsa, memur vasiyetnameyi iki tanığın önünde ona okur ve bunun üzerine mirasbırakan vasiyetnamenin son arzularını içerdiğini beyan eder.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bu durumda tanıklar, hem mirasbırakanın beyanının kendi önlerinde yapıldığını ve onu tasarrufa ehil gördüklerini; hem vasiyetnamenin kendi önlerinde memur tarafından mirasbırakana okunduğunu ve onun vasiyetnamenin son arzularını içerdiğini beyan ettiğini vasiyetnameye yazarak veya yazdırarak altını imzalarlar.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="e" başlık="Düzenlemeye katılma yasağı">
                  <mvz-madde no="536" başlık="">
                    <mvz-fıkra no="1">
                      <template>Fiil ehliyeti bulunmayanlar, bir ceza mahkemesi kararıyla kamu hizmetinden yasaklılar, okur yazar olmayanlar, mirasbırakanın eşi, üstsoy ve altsoy kan hısımları, kardeşleri ve bu kişilerin eşleri, resmî vasiyetnamenin düzenlenmesine memur veya tanık olarak katılamazlar.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Resmî vasiyetnamenin düzenlenmesine katılan memura ve tanıklara, bunların üstsoy ve altsoy kan hısımlarına, kardeşlerine ve bu kişilerin eşlerine o vasiyetname ile kazandırmada bulunulamaz.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="f" başlık="Vasiyetnamenin saklanması">
                  <mvz-madde no="537" başlık="">
                    <mvz-fıkra no="1">
                      <template>Resmî vasiyetnameyi düzenleyen memur, vasiyetnamenin aslını saklamakla yükümlüdür.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="3" başlık="El yazılı vasiyetname">
                <mvz-madde no="538" başlık="">
                  <mvz-fıkra no="1">
                    <template>El yazılı vasiyetnamenin yapıldığı yıl, ay ve gün gösterilerek başından sonuna kadar mirasbırakanın el yazısıyla yazılmış ve imzalanmış olması zorunludur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>El yazılı vasiyetname, saklanmak üzere açık veya kapalı olarak notere, sulh hâkimine veya yetkili memura bırakılabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Sözlü vasiyet">
                <mvz-b4 no="a" başlık="Son arzuları anlatma">
                  <mvz-madde no="539" başlık="">
                    <mvz-fıkra no="1">
                      <template>Mirasbırakan; yakın ölüm tehlikesi, ulaşımın kesilmesi, hastalık, savaş gibi olağanüstü durumlar yüzünden resmî veya el yazılı vasiyetname yapamıyorsa, sözlü vasiyet yoluna başvurabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bunun için mirasbırakan, son arzularını iki tanığa anlatır ve onlara bu beyanına uygun bir vasiyetname yazmaları veya yazdırmaları görevini yükler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Resmî vasiyetname düzenlenmesinde okur yazar olma koşulu dışında, tanıklara ilişkin yasaklar, sözlü vasiyetteki tanıklar için de geçerlidir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Belgeleme">
                  <mvz-madde no="540" başlık="">
                    <mvz-fıkra no="1">
                      <template>Mirasbırakan tarafından görevlendirilen tanıklardan biri, kendilerine beyan edilen son arzuları, yer, yıl, ay ve günü de belirterek hemen yazar, bu belgeyi imzalar ve diğer tanığa imzalatır. Yazılan belgeyi ikisi birlikte vakit geçirmeksizin bir sulh veya asliye mahkemesine verirler ve mirasbırakanı vasiyetname yapmaya ehil gördüklerini, onun son arzularını olağanüstü durum içinde kendilerine anlattığını hâkime beyan ederler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Tanıklar, daha önce bir belge düzenlemek yerine, vakit geçirmeksizin mahkemeye başvurup yukarıdaki hususları beyan ederek mirasbırakanın son arzularını bir tutanağa geçirtebilirler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Sözlü vasiyet yoluna başvuran kimse askerlik hizmetinde bulunuyorsa, teğmen veya daha yüksek rütbeli bir subay; Ülke sınırları dışında seyreden bir ulaşım aracında bulunuyorsa, o aracın sorumlu yöneticisi; sağlık kurumlarında tedavi edilmekteyse, sağlık kurumunun en yetkili yöneticisi hâkim yerine geçer.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Hükümden düşme">
                  <mvz-madde no="541" başlık="">
                    <mvz-fıkra no="1">
                      <template>Mirasbırakan için sonradan diğer şekillerde vasiyetname yapma olanağı doğarsa, bu tarihin üzerinden bir ay geçince sözlü vasiyet hükümden düşer.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Vasiyetten dönme">
              <mvz-b3 no="1" başlık="Yeni vasiyetname ile">
                <mvz-madde no="542" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakan, vasiyetname için kanunda öngörülen şekillerden birine uymak suretiyle yeni bir vasiyetname yaparak önceki vasiyetnameden her zaman dönebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Vasiyetnamenin tamamından veya bir kısmından dönülebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Yok etme ile">
                <mvz-madde no="543" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakan, yok etmek suretiyle de vasiyetnameden dönebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Kaza sonucunda veya üçüncü kişinin kusuruyla yok olan ve içeriğinin aynen ve tamamen belirlenmesine olanak bulunmayan vasiyetname hükümsüz kalır. Tazminat isteme hakkı saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Sonraki tasarruflar">
                <mvz-madde no="544" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakan, önceki vasiyetnamesini ortadan kaldırmaksızın yeni bir vasiyetname yaparsa, kuşkuya yer bırakmayacak surette önceki vasiyetnameyi tamamlamadıkça, sonraki vasiyetname onun yerini alır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Belirli mal bırakma vasiyeti de, vasiyetnamede aksi belirtilmedikçe, mirasbırakanın sonradan o mal üzerinde bu vasiyetle bağdaşmayan başka bir tasarrufta bulunmasıyla ortadan kalkar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Miras sözleşmesi">
            <mvz-b2 no="I" başlık="Şekli">
              <mvz-madde no="545" başlık="">
                <mvz-fıkra no="1">
                  <template>Miras sözleşmesinin geçerli olması için resmî vasiyetname şeklinde düzenlenmesi gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Sözleşmenin tarafları, arzularını resmî memura aynı zamanda bildirirler ve düzenlenen sözleşmeyi memurun ve iki tanığın önünde imzalarlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Ortadan kaldırılması">
              <mvz-b3 no="1" başlık="Sağlararasında">
                <mvz-b4 no="a" başlık="Sözleşme veya vasiyetname ile">
                  <mvz-madde no="546" başlık="">
                    <mvz-fıkra no="1">
                      <template>Miras sözleşmesi, tarafların yazılı anlaşmasıyla her zaman ortadan kaldırılabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Miras sözleşmesiyle mirasçı atanan veya kendisine belirli mal bırakılan kişinin, mirasbırakana karşı miras sözleşmesinin yapılmasından sonra mirasçılıktan çıkarma sebebi oluşturan davranışta bulunduğu ortaya çıkarsa; mirasbırakan, miras sözleşmesini tek taraflı olarak ortadan kaldırabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Tek taraflı ortadan kaldırma, vasiyetnameler için kanunda öngörülen şekillerden biriyle yapılır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Sözleşmeden dönme yolu ile">
                  <mvz-madde no="547" başlık="">
                    <mvz-fıkra no="1">
                      <template>Miras sözleşmesi gereğince sağlararası edimleri isteme hakkı bulunan taraf, bu edimlerin sözleşmeye uygun olarak yerine getirilmemesi veya güvenceye bağlanmaması hâlinde borçlar hukuku kuralları uyarınca sözleşmeden dönebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Mirasbırakandan önce ölme">
                <mvz-madde no="548" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasçı atanan veya kendisine belirli mal bırakılan kişi mirasbırakanın ölümünde sağ değilse, miras sözleşmesi kendiliğinden ortadan kalkar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Mirasbırakandan önce ölen kişinin mirasçıları, aksi kararlaştırılmış olmadıkça, ölüme bağlı tasarrufta bulunandan, miras sözleşmesi uyarınca elde ettiği ölüm tarihindeki zenginleşmeyi geri isteyebilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Tasarruf edilebilir kısmın daralması">
            <mvz-madde no="549" başlık="">
              <mvz-fıkra no="1">
                <template>Miras sözleşmesi veya vasiyetnameyle yapılan ölüme bağlı kazandırmalar, mirasbırakanın tasarruf edebileceği kısmın sonradan daralması yüzünden hükümsüz olmaz; sadece tenkis edilebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="5-BEŞİNCİ" başlık="VASİYETİ YERİNE GETİRME GÖREVLİSİ">
          <mvz-b1 no="A" başlık="Atanması">
            <mvz-b2 no="I" başlık="Atanma ve ehliyet">
              <mvz-madde no="550" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakan, vasiyetnameyle bir veya birden çok vasiyeti yerine getirme görevlisi atayabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vasiyeti yerine getirme görevlisinin, göreve başladığı sırada fiil ehliyetine sahip olması gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Vasiyeti yerine getirme görevlisine sulh hâkimi tarafından bu görevi bildirilir; bildirim tarihinden başlayarak onbeş gün içinde kabul edilmediği sulh hâkimine bildirilmezse, görev kabul edilmiş sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Vasiyeti yerine getirme görevlisi hizmetinin karşılığında uygun bir ücret isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Birden çok vasiyeti yerine getirme görevlisi">
              <mvz-madde no="551" başlık="">
                <mvz-fıkra no="1">
                  <template>Birden çok vasiyeti yerine getirme görevlisinin atanmış olması hâlinde, tasarruftan veya işin niteliğinden aksi anlaşılmadıkça bunlar görevi birlikte yürütürler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bunlardan biri görevi kabul etmez veya edemez ya da herhangi bir sebeple görevi sona ererse, mirasbırakanın tasarrufundan aksi anlaşılmadıkça diğerleri göreve devam eder.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Birden çok vasiyeti yerine getirme görevlisi birlikte hareket etmek üzere atanmış olsa bile acele hâllerde her biri gerekli işlemleri yapabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Görev ve yetkileri">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="552" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakan, tasarrufunda aksini öngörmüş veya sınırlı bir görev vermiş olmadıkça vasiyeti yerine getirme görevlisi, mirasbırakanın son arzularının yerine getirilmesi için gerekli bütün işlemleri yapmakla görevli ve yetkilidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vasiyeti yerine getirme görevlisi, özellikle;</template>
                  <mvz-bent no="1.">
                    <template>Göreve başladıktan sonra gecikmeksizin terekedeki malların, hakların ve borçların listesini düzenler. Liste düzenlenirken olanak varsa mirasçılar hazır bulundurulur.</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Terekeyi yönetir ve yönetimin gerektirdiği ölçüde tereke mallarının zilyetliğinin kendisine devrini ister.</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Tereke alacaklarını tahsil eder, borçlarını öder.</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Vasiyetleri yerine getirir.</template>
                  </mvz-bent>
                  <mvz-bent no="5.">
                    <template>Terekenin paylaşılması için plân hazırlar.</template>
                  </mvz-bent>
                  <mvz-bent no="6.">
                    <template>Tereke ile ilgili dava ve takiplerde miras ortaklığını temsil eder. Mirasçılar tarafından açılmış davalardan görevi ile ilgili olanlara müdahil olarak katılabilir.</template>
                  </mvz-bent>
                  <mvz-bent no="7.">
                    <template>Açtığı veya aleyhine açılan davalar ile yapılan takipleri mirasçılara bildirir.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Tereke malları üzerinde tasarruf">
              <mvz-madde no="553" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakan taahhüt etmiş olmadıkça, terekeye dahil malların, vasiyeti yerine getirme görevlisi tarafından devri veya bunlar üzerinde sınırlı aynî haklar kurulması, sulh hâkiminin yetki vermesine bağlıdır. Hâkim, olanak bulunduğu takdirde mirasçıları dinledikten sonra karar verir. Olağan giderleri karşılayacak ölçüdeki tasarruflar için yetki almaya gerek yoktur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Görevin sona ermesi">
            <mvz-madde no="554" başlık="">
              <mvz-fıkra no="1">
                <template>Vasiyeti yerine getirme görevlisinin görevi, ölümü veya atanmasını geçersiz kılan bir sebebin varlığı hâlinde kendiliğinden sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vasiyeti yerine getirme görevlisi sulh hâkimine yapacağı bir beyanla görevinden ayrılabilir. Görev uygunsuz bir zamanda bırakılamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Denetlenmesi">
            <mvz-madde no="555" başlık="">
              <mvz-fıkra no="1">
                <template>Vasiyeti yerine getirme görevlisi, görevinin yerine getirilmesinde sulh hâkiminin denetimine tâbidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hâkim, şikâyet üzerine veya re'sen gereken önlemleri alır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Vasiyeti yerine getirme görevlisinin yetersiz olduğu, görevini kötüye kullandığı veya ağır ihmali tespit edilirse, sulh hâkimi tarafından görevine son verilir. Bu karara karşı tebliğinden başlayarak onbeş gün içinde asliye mahkemesine itiraz edilebilir. İtiraz üzerine verilen karar kesindir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Sorumluluğu">
            <mvz-madde no="556" başlık="">
              <mvz-fıkra no="1">
                <template>Vasiyeti yerine getirme görevlisi, görevini yerine getirirken özen göstermekle yükümlüdür; ilgililere karşı bir vekil gibi sorumludur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="6-ALTINCI" başlık="ÖLÜME BAĞLI TASARRUFLARIN İPTALİ VE TENKİSİ">
          <mvz-b1 no="A" başlık="İptal davası">
            <mvz-b2 no="I" başlık="Sebepleri">
              <mvz-madde no="557" başlık="">
                <mvz-fıkra no="1">
                  <template>Aşağıdaki sebeplerle ölüme bağlı bir tasarrufun iptali için dava açılabilir:</template>
                  <mvz-bent no="1.">
                    <template>Tasarruf mirasbırakanın tasarruf ehliyeti bulunmadığı bir sırada yapılmışsa,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Tasarruf yanılma, aldatma, korkutma veya zorlama sonucunda yapılmışsa,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Tasarrufun içeriği, bağlandığı koşullar veya yüklemeler hukuka veya ahlâka aykırı ise,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Tasarruf kanunda öngörülen şekillere uyulmadan yapılmışsa.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Dava hakkı">
              <mvz-madde no="558" başlık="">
                <mvz-fıkra no="1">
                  <template>İptal davası, tasarrufun iptal edilmesinde menfaati bulunan mirasçı veya vasiyet alacaklısı tarafından açılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Dava, ölüme bağlı tasarrufun tamamının veya bir kısmının iptaline ilişkin olabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İptal davası, ölüme bağlı tasarrufla kendilerine, eşlerine veya hısımlarına kazandırma yapılanların tasarrufun düzenlenmesine katılmalarının yol açtığı sakatlığa dayandığı takdirde tasarrufun tamamı değil, yalnız bu kazandırmalar iptal edilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Hak düşürücü süreler">
              <mvz-madde no="559" başlık="">
                <mvz-fıkra no="1">
                  <template>İptal davası açma hakkı, davacının tasarrufu, iptal sebebini ve kendisinin hak sahibi olduğunu öğrendiği tarihten başlayarak bir yıl ve her hâlde vasiyetnamelerde açılma tarihinin, diğer tasarruflarda mirasın geçmesi tarihinin üzerinden, iyiniyetli davalılara karşı on yıl, iyiniyetli olmayan davalılara karşı yirmi yıl geçmekle düşer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hükümsüzlük, def"i yoluyla her zaman ileri sürülebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Tenkis davası">
            <mvz-b2 no="I" başlık="Koşulları">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="560" başlık="">
                  <mvz-fıkra no="1">
