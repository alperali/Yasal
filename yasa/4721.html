                  <template>Bir taşınırın zilyetliğini iyiniyetle ve malik olmak üzere devralan kimse, devredenin mülkiyeti devir yetkisi olmasa bile, zilyetlik hükümlerine göre kazanmanın korunduğu hâllerde o şeyin maliki olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Mülkiyetin saklı tutulması">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="764" başlık="">
                  <mvz-fıkra no="1">
                    <template>Başkasına devredilen bir malın mülkiyetinin saklı tutulması kaydı, ancak resmî şekilde yapılacak sözleşmenin devralanın yerleşim yeri noterliğinde özel siciline kaydedilmesiyle geçerli olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Hayvan satışlarında mülkiyeti saklı tutma sözleşmesi yapılamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Taksitle satış">
                <mvz-madde no="765" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taksitle mal satan kimse, bu satımlara ilişkin özel hükümlere uymak koşuluyla, mülkiyeti saklı tutma sözleşmesine dayanarak, sattığı malın geri verilmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Hükmen teslim">
              <mvz-madde no="766" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir taşınırın mülkiyetini nakleden kimse özel bir hukukî ilişkiye dayanarak o şeyin zilyetliğini korursa, mülkiyet teslimsiz geçmiş olur. Ancak, bu işlem üçüncü kişileri zarara sokmak veya taşınır rehni kurallarından kurtulmak için yapılmışsa, mülkiyetin nakli sonuç doğurmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Böyle bir amaç güdülüp güdülmediğini hâkim takdir eder.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sahiplenme">
            <mvz-b3 no="1" başlık="Sahipsiz şeyler">
              <mvz-madde no="767" başlık="">
                <mvz-fıkra no="1">
                  <template>Sahipsiz bir taşınırı malik olmak iradesiyle zilyetliğine geçiren kimse, onun maliki olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Sahipsiz duruma gelen hayvanlar">
              <mvz-madde no="768" başlık="">
                <mvz-fıkra no="1">
                  <template>Tutulan av hayvanları, yeniden serbest kalır ve sahipleri onları gecikmeksizin ve ara vermeksizin aramaz ve tekrar tutmak için uğraşmazsa, sahipsiz duruma gelirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ehlileştirilmiş hayvanlar tekrar vahşileşir ve sahiplerine dönmezlerse, sahipsiz duruma gelirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Arı oğulu başkasının taşınmazına uçmuş olmakla sahipsiz duruma gelmez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Bulunmuş eşya">
            <mvz-b3 no="1" başlık="Arama ve ilân">
              <mvz-madde no="769" başlık="">
                <mvz-fıkra no="1">
                  <template>Kaybedilmiş bir şeyi bulan kimse, malın sahibine, sahibini bilmiyorsa kolluk kuvvetlerine, köylerde muhtara bildirmek veya araştırma yapmak ve gerektiğinde ilân etmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bulunan şey önemli ölçüde değerli ise, her hâlde kolluk kuvvetlerine veya muhtara bildirmek gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Oturulan bir evde veya işyerinde ya da kamu hizmeti görülen yerde bir şey bulan kimse, bunu o yer sahibine veya kiracıya ya da kamu hizmeti görülen yerde denetim ve gözetim ile görevli olanlara teslim etmek zorundadır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Koruma ve satma">
              <mvz-madde no="770" başlık="">
                <mvz-fıkra no="1">
                  <template>Bulunan şeyin özenle korunması gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Korunması aşırı gideri gerektirir veya çabuk bozulabilir bir nitelik taşır ya da kolluk kuvvetleri veya kamu kurumu tarafından bir yıldan fazla saklanmış olursa, bulunan şey satılabilir. Satış, gerektiğinde önceden ilân edilerek açık artırma yoluyla yapılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Satış bedeli, bulunan şeyin yerine geçer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Mülkiyetin kazanılması, geri verme">
              <mvz-madde no="771" başlık="">
                <mvz-fıkra no="1">
                  <template>Bulunan şeyin maliki, ilân veya kolluk kuvvetlerine ya da muhtara bildirme tarihinden başlayarak beş yıl içinde ortaya çıkmazsa; bulan kimse, yükümlülüklerini yerine getirmiş olmak koşuluyla o şeyin mülkiyetini kazanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bulunan şey malikine geri verilirse, bulan kimse yaptığı giderlerin ödenmesini ve uygun bir ödül verilmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kaybedilmiş şey oturulan bir evde veya işyerinde ya da kamu hizmeti görülen yerde bulunmuşsa; o yerin sahibi, kiracı veya kurum, o şeyi bulan sayılır. Ancak bunlar ödül isteyemezler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Define">
              <mvz-madde no="772" başlık="">
                <mvz-fıkra no="1">
                  <template>Bulunmalarından çok zaman önce gömülmüş veya saklanmış olduğu ve duruma göre artık malikinin bulunmadığı kesin olarak anlaşılan değerli şeyler, define sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bilimsel değer taşıyan eşyaya ilişkin hükümler saklı kalmak üzere define, içinde bulunduğu taşınmaz veya taşınır malın malikinin olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Defineyi bulan kimse, değerinin yarısını aşmamak üzere uygun bir ödül isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Bilimsel değeri olan eşya">
              <mvz-madde no="773" başlık="">
                <mvz-fıkra no="1">
                  <template>Bilimsel değeri olan sahipsiz doğal şeyler ile eski eserlerin bulunması hâlinde özel kanun hükümleri uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Düşen veya sürüklenen şeyler">
            <mvz-madde no="774" başlık="">
              <mvz-fıkra no="1">
                <template>Su, rüzgâr, çığ veya diğer doğal güçlerin etkisiyle veya rastlantı sonucunda taşınır mallar veya hayvanlar kimin egemenlik alanına girerse, o kimse kaybolan eşyayı bulanın haklarına sahip ve yükümlülüklerine tâbi olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Başkasının kovanına göçen arı oğulu, bir bedel ödenmesi gerekmeksizin kovan malikinin olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="İşleme">
            <mvz-madde no="775" başlık="">
              <mvz-fıkra no="1">
                <template>Bir kimse başkasına ait bir şeyi işler veya başka bir şekle sokarsa, emeğin değerinin o şeyin değerinden fazla olması hâlinde, yeni şey işleyenin, aksi hâlde malikin olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İşleyen iyiniyetli değilse, emeğin değeri işlenen şeyin değerinden daha fazla olsa bile hâkim, yeni şeyi malike bırakabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Tazminat ve sebepsiz zenginleşmeden doğan istem hakları saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="VI" başlık="Karışma ve birleşme">
            <mvz-madde no="776" başlık="">
              <mvz-fıkra no="1">
                <template>Birden çok kişinin taşınır malları önemli bir zarara uğratılmadan veya aşırı bir emek ve para harcanmadan ayrılmayacak şekilde birbiriyle birleşmiş veya karışmışsa o kişiler, yeni şey üzerinde kendi taşınırlarının birleşme veya karışma zamanındaki değerleri oranında paylı mülkiyete sahip olurlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bir taşınır diğer bir taşınırla onun ikincil nitelikte bütünleyici parçası olacak şekilde karışır veya birleşirse; eşyanın tamamı, ana parçanın malikine ait olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Tazminat ve sebepsiz zenginleşmeden doğan istem hakları saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="VII" başlık="Kazandırıcı zamanaşımı">
            <mvz-madde no="777" başlık="">
              <mvz-fıkra no="1">
                <template>Başkasının taşınır bir malını davasız ve aralıksız beş yıl iyiniyetle ve malik sıfatıyla zilyetliğinde bulunduran kimse, zamanaşımı yoluyla o taşınırın maliki olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zilyetliğin irade dışı kaybedilmesi hâlinde zilyet, bir yıl içinde eşyayı ele geçirir veya açacağı bir dava yoluyla onu yeniden elde ederse kazandırıcı zamanaşımı kesilmiş olmaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kazandırıcı zamanaşımı süresinin hesaplanmasında, kesilmesinde ve durmasında Borçlar Kanununun zamanaşımına ilişkin hükümleri kıyas yoluyla uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Kaybedilmesi">
          <mvz-madde no="778" başlık="">
            <mvz-fıkra no="1">
              <template>Taşınır mülkiyeti, malik tarafından terk edilmedikçe veya başkası tarafından kazanılmadıkça yalnız zilyetliğin kaybıyla sona ermez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="SINIRLI AYNÎ HAKLAR">
      <mvz-bölüm no="1-BİRİNCİ" başlık="İRTİFAK HAKLARI VE TAŞINMAZ YÜKÜ">
        <mvz-ayırım no="1-BİRİNCİ" başlık="TAŞINMAZ LEHİNE İRTİFAK HAKKI">
          <mvz-b1 no="A" başlık="Konusu">
            <mvz-madde no="779" başlık="">
              <mvz-fıkra no="1">
                <template>Taşınmaz lehine irtifak hakkı, bir taşınmaz üzerinde diğer bir taşınmaz lehine konulmuş bir yük olup, yüklü taşınmazın malikini mülkiyet hakkının sağladığı bazı yetkileri kullanmaktan kaçınmaya veya yararlanan taşınmaz malikinin yüklü taşınmazı belirli şekilde kullanmasına katlanmaya mecbur kılar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yapma borçları, irtifaka başlı başına konu olamaz; ona ancak yan edim olarak bağlanabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Kurulması ve sona ermesi">
            <mvz-b2 no="I" başlık="Kurulması">
              <mvz-b3 no="1" başlık="Tescil">
                <mvz-madde no="780" başlık="">
                  <mvz-fıkra no="1">
                    <template>İrtifak hakkının kurulması için tapu kütüğüne tescil şarttır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İrtifak hakkının kazanılmasında ve tescilinde, aksi öngörülmüş olmadıkça taşınmaz mülkiyetine ilişkin hükümler uygulanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>İrtifak hakkının zamanaşımı yoluyla kazanılması, ancak mülkiyeti bu yolla elde edilebilecek taşınmazlarda mümkündür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Sözleşme">
                <mvz-madde no="781" başlık="">
                  <mvz-fıkra no="1">
                    <template>İrtifak hakkının kurulmasına ilişkin sözleşmenin geçerli olması, resmî şekilde düzenlenmesine bağlıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Kendi taşınmazı üzerinde irtifak hakkı">
                <mvz-madde no="782" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malik kendisine ait iki taşınmazdan biri üzerinde diğerinin lehine irtifak hakkı kurabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Sona ermesi">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="783" başlık="">
                  <mvz-fıkra no="1">
                    <template>İrtifak hakkı, tescilin terkini veya yüklü ya da yararlanan taşınmazın yok olmasıyla sona erer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Her iki taşınmaza aynı kimsenin malik olması">
                <mvz-madde no="784" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yüklü ve yararlanan taşınmazlara aynı kimse malik olursa, bu kişi, irtifak hakkını terkin ettirebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Terkin edilmedikçe irtifak, aynî hak olarak varlığını sürdürür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Mahkeme kararı">
                <mvz-madde no="785" başlık="">
                  <mvz-fıkra no="1">
                    <template>Lehine irtifak kurulan taşınmaz için bu hakkın sağladığı hiç bir yarar kalmamışsa, yüklü taşınmazın maliki bu hakkın terkinini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Yüküne oranla çok az yarar sağlayan bir irtifak hakkının, bedel karşılığında kısmen veya tamamen terkini istenebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Hükümleri">
            <mvz-b2 no="I" başlık="Kapsamı">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="786" başlık="">
                  <mvz-fıkra no="1">
                    <template>İrtifak hakkı sahibi, hakkının korunması ve kullanılması için gerekli olan önlemleri alabilir; ancak, hakkını yüklü taşınmazın malikine en az zarar verecek biçimde kullanmak zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Yüklü taşınmazın maliki, irtifak hakkının kullanılmasını engelleyecek ya da zorlaştıracak davranışlarda bulunamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Tescile göre">
                <mvz-madde no="787" başlık="">
                  <mvz-fıkra no="1">
                    <template>İrtifaktan doğan yetki ve yükümlülükleri açıkça belirlediği ölçüde tescil, irtifakın kapsamını belirlemede esas oluşturur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tescilden açıkça anlaşılmadığı hâllerde kapsam, tescilin sınırları içinde, irtifak hakkının kazanılma sebebine veya uzun süreden beri davasız ve iyiniyetle kullanılış biçimine göre belirlenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="İhtiyaçların değişmesi">
                <mvz-madde no="788" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yararlanan taşınmazın ihtiyaçlarındaki değişiklik, yüklü taşınmazın irtifaktan doğan yükünü ağırlaştıramaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Özel kanun hükümleri ve yerel âdet">
                <mvz-madde no="789" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tarla yolu, yaya veya araba geçidi gibi geçit hakları ile hayvan otlatma, hayvan sulama, tarlalara veya arklara su alma hakları ve benzeri hakların kapsamını belirlemede taraflar arasındaki anlaşma veya özel kanun hükümleri, yoksa yerel âdet uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Bakım giderleri">
              <mvz-madde no="790" başlık="">
                <mvz-fıkra no="1">
                  <template>İrtifak hakkının kullanılması için gerekli tesislerin bakımı, yararlanan taşınmaz malikine aittir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tesisler yüklü taşınmazın malikine de yararlı ise, bunların bakım giderlerine her iki malik yararları oranında katılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Değişiklikler">
              <mvz-b3 no="1" başlık="İrtifak hakkının ilişkin olduğu yerin değiştirilmesi">
                <mvz-madde no="791" başlık="">
                  <mvz-fıkra no="1">
                    <template>İrtifak hakkı yüklü taşınmazın yalnız belli bir kısmının kullanılması koşuluyla kurulmuşsa, bu taşınmazın maliki, menfaatini ispat etmek ve giderleri üstlenmek kaydıyla; irtifakın, hakkın kullanılmasını güçleştirmeyecek biçimde taşınmazın başka bir yerine naklini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İrtifak hakkının kullanılacağı yer tapu kütüğünde belirtilmiş olsa bile yüklü taşınmaz maliki bu yetkiyi kullanabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Mecraların bir yerden başka bir yere naklinde komşuluk hukuku kuralları da göz önünde tutulur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Bölünme">
                <mvz-b4 no="a" başlık="Yararlanan taşınmazın bölünmesi">
                  <mvz-madde no="792" başlık="">
                    <mvz-fıkra no="1">
                      <template>Yararlanan taşınmazın parsellere bölünmesi hâlinde kural, irtifak hakkının her parsel yararına devam etmesidir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Ancak, durum ve koşullara göre irtifak hakkı yalnız bir parselin yararına kullanılabiliyorsa, yüklü taşınmazın maliki diğer parseller için irtifak hakkının terkinini isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Tapu sicil memuru, bu istemi irtifak hakkı sahibine bildirir ve onun bir ay içinde itiraz etmemesi hâlinde irtifak hakkını terkin eder.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Yüklü taşınmazın bölünmesi">
                  <mvz-madde no="793" başlık="">
                    <mvz-fıkra no="1">
                      <template>Yüklü taşınmazın parsellere bölünmesi hâlinde kural, irtifak hakkının her parsel üzerinde devam etmesidir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Ancak, irtifak hakkı belirli parseller üzerinde kullanılmıyorsa, durum ve koşullara göre de kullanılamayacaksa, bu parsellerin maliklerinden her biri, kendi taşınmazı üzerindeki irtifak hakkının terkinini isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Tapu sicil memuru, bu istemi irtifak hakkı sahibine bildirir ve onun bir ay içinde itiraz etmemesi hâlinde irtifak hakkını terkin eder.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="İNTİFA HAKKI VE DİĞER İRTİFAK HAKLARI">
          <mvz-b1 no="A" başlık="İntifa hakkı">
            <mvz-b2 no="I" başlık="Konusu">
              <mvz-madde no="794" başlık="">
                <mvz-fıkra no="1">
                  <template>İntifa hakkı, taşınırlar, taşınmazlar, haklar veya bir malvarlığı üzerinde kurulabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Aksine düzenleme olmadıkça bu hak, sahibine, konusu üzerinde tam yararlanma yetkisi sağlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Kurulması">
              <mvz-madde no="795" başlık="">
                <mvz-fıkra no="1">
                  <template>İntifa hakkı, taşınırlarda zilyetliğin devri, alacaklarda alacağın devri, taşınmazlarda tapu kütüğüne tescil ile kurulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taşınır ve taşınmazlarda intifa hakkının kazanılması ve tescilinde, aksine düzenleme olmadıkça, mülkiyete ilişkin hükümler uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Taşınmaz üzerindeki yasal intifa hakkı tapu kütüğüne tescil edilmemiş olsa bile, durumu bilenlere karşı ileri sürülebilir. Tescil edilmiş ise, herkese karşı ileri sürülebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Sona ermesi">
              <mvz-b3 no="1" başlık="Sona erme sebepleri">
                <mvz-madde no="796" başlık="">
                  <mvz-fıkra no="1">
                    <template>İntifa hakkı, konusunun tamamen yok olması ve taşınmazlarda tescilin terkini; yasal intifa hakkı, sebebinin ortadan kalkması ile sona erer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Sürenin dolması veya hak sahibinin vazgeçmesi ya da ölümü gibi diğer sona erme sebepleri, taşınmazlarda malike terkini isteme yetkisi verir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Süresi">
                <mvz-madde no="797" başlık="">
                  <mvz-fıkra no="1">
                    <template>İntifa hakkı, gerçek kişilerde hak sahibinin ölümü; tüzel kişilerde kararlaştırılan sürenin dolması, süre kararlaştırılmamışsa kişiliğin ortadan kalkmasıyla sona erer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tüzel kişilerin intifa hakkı, en çok yüz yıl devam edebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Harap olma veya kamulaştırma">
                <mvz-madde no="798" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malik, yararlanılamayacak derecede harap olan intifa konusu malı yararlanılacak hâle getirmekle yükümlü değildir; getirirse intifa hakkı yeniden kurulmuş olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Sigorta ve kamulaştırma gibi durumlarda intifa hakkı, hakkın konusu yerine geçen karşılık üzerinde devam eder.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Geri verme">
                <mvz-b4 no="a" başlık="Yükümlülük">
                  <mvz-madde no="799" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı sona erince hak sahibi, hakkın konusu olan malı malike geri vermekle yükümlüdür.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Sorumluluk">
                  <mvz-madde no="800" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı sahibi, zararın kendi kusurundan ileri gelmediğini ispat etmedikçe, malın yok olmasından veya değerinin azalmasından sorumludur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>İntifa hakkı sahibi, yararlanması için gerekli olmadığı hâlde tükettiği şeyleri tazmin etmekle yükümlüdür.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>İntifa hakkı sahibi, malın olağan kullanılması sonucunda meydana gelen değer azalmalarından sorumlu değildir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Giderler">
                  <mvz-madde no="801" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı sahibi, yükümlü olmadığı hâlde yaptığı giderler, yenilemeler ve eklemeler için, hak sona erdiğinde, vekâletsiz iş görme hükümleri uyarınca tazminat isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Malikin tazminat vermekten kaçınması hâlinde intifa hakkı sahibi, yaptığı eklemeleri, malı eski hâline getirmek kaydıyla söküp alabilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="5" başlık="Zamanaşımı">
                <mvz-madde no="802" başlık="">
                  <mvz-fıkra no="1">
                    <template>Geri verme anında malik ve intifa hakkı sahibi tarafından ileri sürülebilecek bütün istem hakları, bu andan başlayarak bir yıl geçmekle zamanaşımına uğrar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="İntifa hakkının hükümleri">
              <mvz-b3 no="1" başlık="İntifa hakkı sahibinin hakları">
                <mvz-b4 no="a" başlık="Genel olarak">
                  <mvz-madde no="803" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı sahibi, hakkın konusu olan malı zilyetliğinde bulundurma, yönetme, kullanma ve ondan yararlanma yetkilerine sahiptir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>İntifa hakkı sahibi, bu yetkilerini kullanırken iyi bir yönetici gibi özen göstermek zorundadır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Doğal ürünler">
                  <mvz-madde no="804" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı süresi içinde olgunlaşan doğal ürünler, intifa hakkı sahibine aittir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Ekimi veya dikimi yapan malik veya intifa hakkı sahibi, olgunlaşan ürünleri toplayan diğer taraftan, yaptığı giderler için ürünün değerini aşmamak üzere uygun bir bedel isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Nitelikleri itibarıyla malın doğal verimi veya ürünü sayılmayan bütünleyici parçaları malike aittir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Faizler">
                  <mvz-madde no="805" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkına konu olan sermayenin faizleri ve diğer dönemsel gelirleri, daha geç muaccel olsalar bile, intifa hakkının başladığı tarihten sona erdiği tarihe kadar intifa hakkı sahibine ait olur.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="d" başlık="Hakkın kullanılmasının devri">
                  <mvz-madde no="806" başlık="">
                    <mvz-fıkra no="1">
                      <template>Sözleşmede aksine hüküm yoksa veya durum ve koşullardan hak sahibince şahsen kullanılması gerektiği anlaşılmıyorsa, intifa hakkının kullanılması başkasına devredilebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bu takdirde malik, haklarını, devralana karşı doğrudan doğruya ileri sürebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Malikin hakları">
                <mvz-b4 no="a" başlık="Gözetim">
                  <mvz-madde no="807" başlık="">
                    <mvz-fıkra no="1">
                      <template>Malik, hakkın konusu olan malın hukuka aykırı ya da niteliğine uygun düşmeyen kullanılış biçimine itiraz edebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Güvence isteme">
                  <mvz-madde no="808" başlık="">
                    <mvz-fıkra no="1">
                      <template>Haklarının tehlikeye düştüğünü ispat eden malik, intifa hakkı sahibinden güvence isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>İntifa hakkının konusu tüketilebilen şey veya kıymetli evrak ise, malik tehlikenin ispatına gerek olmaksızın teslimden önce de güvence isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Kıymetli evrakın güvenilir bir yere tevdi edilmesi güvence yerine geçer.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Bağışlamada güvence">
                  <mvz-madde no="809" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı kendisinde kalmak üzere yapılan bağışlamalarda bağışlayandan güvence istenemez.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="d" başlık="Güvence verilmemesinin sonuçları">
                  <mvz-madde no="810" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı sahibi, kendisine tanınan uygun süre içinde güvence göstermez veya hakkın konusu olan malı malikin itiraz etmesine rağmen hukuka aykırı şekilde kullanmaya devam ederse; sulh hâkimi, yeni bir karara kadar intifa hakkı sahibinin zilyetliğini kaldırarak hakkın konusunu atayacağı bir kayyıma tevdi eder.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Defter tutma">
                <mvz-madde no="811" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malik veya intifa hakkı sahibi, diğerinden giderleri paylaşmak üzere intifa hakkına konu olan malların noterlikçe resmen defterinin tutulmasını her zaman isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="İntifa hakkı sahibinin yükümlülükleri">
                <mvz-b4 no="a" başlık="Malın korunması">
                  <mvz-madde no="812" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı sahibi, hakkın konusu olan malın muhafazası ve olağan bakımı için gerekli onarım ve yenilemeleri yapmakla yükümlüdür.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Malın muhafazası, daha önemli işlerin yapılmasını veya önlemlerin alınmasını gerektiriyorsa; intifa hakkı sahibi, durumu malike bildirmek ve bunların gerçekleştirilmesine izin vermek zorundadır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Malikin gereken işleri yapmaktan kaçınması hâlinde intifa hakkı sahibi, bunları onun hesabına kendisi yapabilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Bakım ve işletme giderleri">
                  <mvz-madde no="813" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı konusu olan malın olağan bakım ve işletme giderleri, güvencesini oluşturduğu borçların faizleri, vergi ve resimleri, intifa süresince intifa hakkı sahibine aittir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Vergi ve resimleri malik ödemişse, intifa hakkı sahibi, yukarıda belirtilen esasa göre bunları malike tazmin etmek zorundadır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Diğer bütün yükümlülükler malike aittir. Ancak, intifa hakkı sahibi bunların yerine getirilmesi için gereken parayı, istemi üzerine malike karşılıksız olarak sağlamazsa; malik, intifa hakkı konusu malı bu yükümlülüklerin yerine getirilmesi için kısmen veya tamamen paraya çevirebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Malvarlığı intifaında borçların faizi">
                  <mvz-madde no="814" başlık="">
                    <mvz-fıkra no="1">
                      <template>Malvarlığı intifaında, intifa hakkı sahibi bu malvarlığındaki borçların faizlerini ödemekle yükümlüdür. Ancak, durum ve koşullar haklı gösteriyorsa, intifa hakkı sahibi bu yükümlülükten kurtarılmasını isteyebilir. Bu takdirde intifa hakkı, borçların ödenmesinden sonra kalan kısım üzerinde devam eder.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="d" başlık="Sigorta ettirme">
                  <mvz-madde no="815" başlık="">
                    <mvz-fıkra no="1">
                      <template>Yerel âdetlere göre iyi bir yönetimin gereği olduğu takdirde intifa hakkı sahibi, malikin lehine malı yangına ve diğer tehlikelere karşı sigorta ettirmekle yükümlüdür.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bu durumda veya intifa hakkının sigortalı bir mal üzerinde kurulmuş olması hâlinde intifa hakkı sahibi, hakkının devamı süresince sigorta primlerini ödemekle yükümlüdür.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Özel hâller">
              <mvz-b3 no="1" başlık="Taşınmazlar">
                <mvz-b4 no="a" başlık="Ürünler">
                  <mvz-madde no="816" başlık="">
                    <mvz-fıkra no="1">
                      <template>Bir taşınmaz üzerinde intifa hakkına sahip olan kimse, yararlanmanın olağan sınırlar içerisinde kalmasına özen göstermekle yükümlüdür.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bu ölçü aşılarak elde edilen ürünler malike ait olur.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Özgülenme yönü">
                  <mvz-madde no="817" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı sahibi, intifa konusu taşınmazın ekonomik özgülenme yönünü malike önemli zarar verecek şekilde değiştiremez; özellikle onu yeni bir şekle dönüştüremeyeceği gibi, onda önemli bir değişiklik de yapamaz.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>İntifa hakkı sahibi, malike önceden haber vermek ve taşınmazın ekonomik özgülenme yönünde önemli değişiklik yapmamak koşuluyla taş, kireç, mermer ve turba ocakları ile benzerlerini açabilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Ormanlar">
                  <mvz-madde no="818" başlık="">
                    <mvz-fıkra no="1">
                      <template>Bir orman üzerinde intifa hakkına sahip olan kimse, ondan özel kanun hükümlerine uygun bir işletme plânı çerçevesinde yararlanabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Malik ile intifa hakkı sahibi, işletme plânı yapılırken kendi haklarının gözetilmesini isteyebilirler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Fırtına, kar, yangın, sel, zararlı böcek akını veya diğer sebepler yüzünden olağan yararlanma önemli ölçüde aşılmışsa orman, bu kaybı giderek azaltacak şekilde işletilir veya işletme plânı yeni duruma uygun hâle getirilir. Aşırı yararlanma dolayısıyla elde edilen bedel, faiz getirecek şekilde yatırılır ve verim noksanını gidermeye ayrılır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Tüketilebilen ve değeri biçilen şeyler">
                <mvz-madde no="819" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tüketilebilen şeylerin mülkiyeti, aksi kararlaştırılmadıkça, intifa hakkı sahibine geçer; ancak, intifa hakkı sahibi geri verme sırasında bu şeylerin o günkü değerini ödemekle yükümlü olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İntifa hakkı sahibi, değeri biçilerek kendisine teslim olunan diğer taşınırlar üzerinde, aksi kararlaştırılmadıkça, serbestçe tasarrufta bulunabilir; ancak, bu yetkisini kullandığı takdirde bu şeylerin biçilen değerlerini geri verme sırasında ödemekle yükümlü olur. Bu ödeme, tarım işletmesi gereçleri, hayvan sürüleri, ticarî mallar veya benzeri şeylerde aynı cins ve nitelikte eşya verilmesi suretiyle yerine getirilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Alacaklar">
                <mvz-b4 no="a" başlık="Yararlanmanın kapsamı">
                  <mvz-madde no="820" başlık="">
                    <mvz-fıkra no="1">
                      <template>Bir alacak üzerindeki intifa hakkı, onun getirisini edinme yetkisi verir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Borçluya karşı yapılacak ödeme isteminin ve kıymetli evrak üzerindeki tasarrufların alacaklı ve intifa hakkı sahibi tarafından birlikte yapılması, borcunu ödemek üzere borçlu tarafından yapılacak bildirimin de bunların her ikisine yöneltilmesi gerekir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Alacak tehlikeye düşerse, alacaklı ve intifa hakkı sahibinden her biri, diğerinden iyi bir yönetimin gerektirdiği önlemleri almaya katılmasını isteyebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Ödeme ve işletme">
                  <mvz-madde no="821" başlık="">
                    <mvz-fıkra no="1">
                      <template>Alacaklı ve intifa hakkı sahibinden birine ödemeye yetkili kılınmamış olan borçlu, borcunu ikisine birlikte ödemek veya hâkimin belirleyeceği yere tevdi etmek zorundadır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Yerine getirilen edimin konusu ve özellikle geri ödenecek ana para, intifa hakkına tâbi olur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Alacaklı veya intifa hakkı sahibi, ana paranın güvenilir ve getiri sağlayan bir yere yatırılmasını isteyebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Devir isteme hakkı">
                  <mvz-madde no="822" başlık="">
                    <mvz-fıkra no="1">
                      <template>İntifa hakkı sahibi, intifaın başlangıcını izleyen üç ay içinde, hakkın konusu olan alacağın ve kıymetli evrakın kendisine devrini isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>İntifa hakkı sahibi, alacağın ve kıymetli evrakın devri sırasındaki değeri tutarında devredene karşı bunların bedelini ödeme borcu altına girer ve feragat edilmedikçe bu borç için ayrıca güvence göstermekle yükümlü olur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Güvence istemekten feragat edilmemiş ise devir, ancak güvence gösterildikten sonra hüküm ifade eder.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Oturma hakkı">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="823" başlık="">
                <mvz-fıkra no="1">
                  <template>Oturma hakkı, bir binadan veya onun bir bölümünden konut olarak yararlanma yetkisi verir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Oturma hakkı, başkasına devredilemez ve mirasçılara geçmez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kanunda aksine hüküm bulunmadıkça, intifa hakkına ilişkin hükümler oturma hakkına da uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Oturma hakkının kapsamı">
              <mvz-madde no="824" başlık="">
                <mvz-fıkra no="1">
                  <template>Oturma hakkının kapsamı, genel olarak hak sahibinin kişisel ihtiyaçlarına göre belirlenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Oturma hakkı sahibi, hakkın şahsına özgülendiği açıkça belirtilmedikçe, bina veya onun bir bölümünde ailesi ve ev halkı ile birlikte oturabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Binanın bir bölümü üzerinde oturma hakkına sahip olan kimse, ortaklaşa kullanmaya özgülenen yerlerden de yararlanabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Giderler">
              <mvz-madde no="825" başlık="">
                <mvz-fıkra no="1">
                  <template>Oturma hakkı, binanın veya bir bölümünün tamamından yararlanma yetkisi veriyorsa; bina veya bölümün muhafazası ve olağan bakımı için gerekli onarım ve yenileme giderleri, oturma hakkı sahibine aittir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Oturma hakkı sahibi bina veya onun bir bölümünü malik ile birlikte kullanıyorsa, bakım ve onarım giderleri malike ait olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Üst hakkı">
            <mvz-b2 no="I" başlık="Konu ve tapu kütüğüne kayıt">
              <mvz-madde no="826" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir taşınmaz maliki, üçüncü kişi lehine arazisinin altında veya üstünde yapı yapmak veya mevcut bir yapıyı muhafaza etmek yetkisi veren bir irtifak hakkı kurabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Aksi kararlaştırılmış olmadıkça bu hak, devredilebilir ve mirasçılara geçer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Üst hakkı, bağımsız ve sürekli nitelikte ise üst hakkı sahibinin istemi üzerine tapu kütüğüne taşınmaz olarak kaydedilebilir. En az otuz yıl için kurulan üst hakkı, sürekli niteliktedir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="İçerik ve kapsam">
              <mvz-madde no="827" başlık="">
                <mvz-fıkra no="1">
                  <template>Üst hakkının içerik ve kapsamıyla ilgili olarak resmî senette yer alan, özellikle yapının konumuna, şekline, niteliğine, boyutlarına, özgülenme amacına ve üzerinde yapı bulunmayan alandan faydalanmaya ilişkin sözleşme kayıtları herkes için bağlayıcıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Sona ermenin sonuçları">
              <mvz-b3 no="1" başlık="Yapı mülkiyetinin malike geçmesi">
                <mvz-madde no="828" başlık="">
                  <mvz-fıkra no="1">
                    <template>Üst hakkı sona erince yapılar, arazi malikine kalır ve arazinin bütünleyici parçası olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bağımsız ve sürekli üst hakkı tapu kütüğüne taşınmaz olarak kaydedilmişse, üst hakkı sona erince bu sayfa kapatılır. Taşınmaz olarak kaydedilmiş olan üst hakkı üzerindeki rehin hakları, diğer bütün hak, kısıtlama ve yükümlülükler de sayfanın kapatılmasıyla birlikte sona erer. Bedele ilişkin hükümler saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Bedel">
                <mvz-madde no="829" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmaz maliki, aksi kararlaştırılmadıkça, kendisine kalan yapılar için üst hakkı sahibine bir bedel ödemez. Uygun bir bedel ödenmesi kararlaştırılmışsa, miktarı ve hesaplanış biçimi belirlenir. Ödenmesi kararlaştırılan bedel, üst hakkı kendileri için rehnedilmiş olan alacaklıların henüz ödenmemiş alacaklarının güvencesini oluşturur ve rızaları olmaksızın üst hakkı sahibine ödenmez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Kararlaştırılan bedel ödenmez veya güvence altına alınmazsa, üst hakkı sahibi veya bu hak kendisine rehnedilmiş olan alacaklı, bedel alacağına güvence olmak üzere, terkin edilen üst hakkı yerine aynı derecede ve sırada bir ipoteğin tescilini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bu ipotek, üst hakkının sona ermesinden başlayarak üç ay içinde tescil edilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Diğer hükümler">
                <mvz-madde no="830" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmaz malikine kalan yapılar için üst hakkı sahibine ödenmesi kararlaştırılan bedelin miktarı ve bunun hesaplanış biçimi ile bu bedel borcunun kaldırılmasına ve arazinin ilk hâline getirilmesine ilişkin anlaşmalar, üst hakkının kurulması için gerekli olan resmî şekle tâbidir ve tapu kütüğüne şerh verilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Süresinden önce devir istemi">
              <mvz-b3 no="1" başlık="Koşulları">
                <mvz-madde no="831" başlık="">
                  <mvz-fıkra no="1">
                    <template>Üst hakkı sahibi, bu haktan doğan yetkilerinin sınırını ağır şekilde aşar veya sözleşmeden doğan yükümlülüklerine önemli ölçüde aykırı davranırsa; malik, üst hakkının ona bağlı bütün hak ve yükümlülükleri ile birlikte süresinden önce kendisine devrini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Hakkın kullanılması">
                <mvz-madde no="832" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malik, üst hakkının devrini, kendisine geçecek yapılar için uygun bir bedel ödemek kaydıyla isteyebilir. Üst hakkı sahibinin kusuru, bedelin belirlenmesinde indirim sebebi olarak göz önüne alınabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Üst hakkının malike devri, bedelin ödenmesine veya güvence altına alınmış olmasına bağlıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Diğer hâller">
                <mvz-madde no="833" başlık="">
                  <mvz-fıkra no="1">
                    <template>Üst hakkı sahibinin yükümlülüklerine aykırı davranması hâlinde sözleşmede malik lehine saklı tutulan, üst hakkını süresinden önce sona erdirme veya devrini isteme yetkisi, süresinden önce devir istemine ilişkin hükümlere tâbidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Üst hakkı iradının güvencesi">
              <mvz-b3 no="1" başlık="İpotek kurulmasını isteme hakkı">
                <mvz-madde no="834" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malik, üst hakkı karşılığı olarak irat biçiminde borçlanılan edimleri güvence altına almak amacıyla, o tarihteki üst hakkı sahibinden en çok üç yıllık irat için tapu kütüğüne taşınmaz olarak kaydedilmiş üst hakkının ipotek edilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İrat, her yıl için eşit edimler biçiminde belirlenmemiş ise; bu kanunî ipoteğin tescili, iradın eşit olarak dağıtılmasında üç yıla düşecek miktarı için istenebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Tescil">
                <mvz-madde no="835" başlık="">
                  <mvz-fıkra no="1">
                    <template>İpotek, üst hakkı devam ettiği sürece, her zaman tescil edilebilir ve icra yoluyla satışta terkin olunmaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Yapı alacaklıları ipoteğinin kurulmasına ilişkin hükümler kıyas yoluyla uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Sürenin üst sınırı">
              <mvz-madde no="836" başlık="">
                <mvz-fıkra no="1">
                  <template>Üst hakkı, bağımsız bir hak olarak en çok yüz yıl için kurulabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Üst hakkı, süresinin dörtte üçü dolduktan sonra, kurulması için öngörülen şekle uyularak her zaman en çok yüz yıllık yeni bir süre için uzatılabilir. Bu konuda önceden yapılan taahhüt bağlayıcı değildir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Kaynak hakkı">
            <mvz-madde no="837" başlık="">
              <mvz-fıkra no="1">
                <template>Başkasının arazisinde bulunan kaynak üzerinde irtifak hakkı, bu arazinin malikini suyun alınmasına ve akıtılmasına katlanmakla yükümlü kılar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu hak, aksi kararlaştırılmış olmadıkça, başkasına devredilebilir ve mirasçıya geçer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kaynak hakkı, bağımsız nitelikte ve en az otuz yıl için kurulmuş ise tapu kütüğüne taşınmaz olarak kaydedilebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Diğer irtifak hakları">
            <mvz-madde no="838" başlık="">
              <mvz-fıkra no="1">
                <template>Malik, taşınmazı üzerinde herhangi bir kişi veya topluluk lehine atış eğitimi veya spor alanı ya da geçit olarak kullanılmak gibi belirli bir yararlanmaya hizmet etmek üzere başka irtifak hakları da kurabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu haklar, aksi kararlaştırılmış olmadıkça, başkasına devredilemez ve mirasçılara geçmez. Bu hakların kapsamı, hak sahibinin olağan ihtiyaçlarına göre belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Taşınmaz lehine irtifaklara ilişkin hükümler, bu tür irtifak haklarına da uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="TAŞINMAZ YÜKÜ">
          <mvz-b1 no="A" başlık="Konusu">
            <mvz-madde no="839" başlık="">
              <mvz-fıkra no="1">
                <template>Taşınmaz yükü, bir taşınmazın malikini yalnız o taşınmazla sorumlu olmak üzere diğer bir kimseye bir şey vermek veya yapmakla yükümlü kılar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hak sahibi olarak, bir başka taşınmazın maliki de gösterilebilir.</template>
              </mvz-fıkra>

          <mvz-b1 no="B" başlık="Kurulması ve sona ermesi">

              <mvz-b3 no="1" başlık="Tescil ve kazanma">

                      <template>Alacaklı, sözleşmeyle yetkili kılınmış olduğu takdirde veya aşağıdaki durumlarda, malikten taşınmazın yükten kurtarılmasını isteyebilir:</template>

                    <template>Muaccel olan edimler, borçlunun kişisel borcu hâline geldiği tarihten başlayarak zamanaşımına tâbi olur.</template>

                </mvz-madde>

                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Her edim, muaccel olmasından başlayarak üç yıl sonra kişisel borç hâline gelir ve taşınmaz bu borcun güvencesi olmaktan çıkar.</template>
                </mvz-fıkra>

                </mvz-fıkra>
                <mvz-fıkra no="2">

      <mvz-bölüm no="2-İKİNCİ" başlık="TAŞINMAZ REHNİ">

          <mvz-b1 no="A" başlık="Koşullar">
            <mvz-b2 no="I" başlık="Taşınmaz rehninin türleri">

                <mvz-fıkra no="1">
                  <template>Taşınmaz rehni, ancak ipotek, ipotekli borç senedi veya irat senedi şeklinde kurulabilir.</template>
                </mvz-fıkra>
              </mvz-madde>

            <mvz-b2 no="II" başlık="Güvence altına alınan alacak">
              <mvz-b3 no="1" başlık="Ana para">
                <mvz-madde no="851" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmaz rehni, miktarı Türk parası ile gösterilen belli bir alacak için kurulabilir. Alacağın miktarının belli olmaması hâlinde, alacaklının bütün istemlerini karşılayacak şekilde taşınmazın güvence altına alacağı üst sınır taraflarca belirtilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Yurt içinde veya dışında faaliyette bulunan kredi kuruluşlarınca yabancı para üzerinden veya yabancı para ölçüsü ile verilen kredileri güvence altına almak için yabancı para üzerinden taşınmaz rehni kurulabilir. Bu hâlde her derecenin ifade ettiği miktar, rehin konusu alacağın tespit edildiği para türü üzerinden gösterilir. Ancak, aynı derecede birden fazla para türü kullanılarak rehin kurulamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Yabancı para üzerinden kurulan rehne ait bir derecenin boşalması hâlinde, yerine, tescil edileceği tarihteki karşılığı Türk parası veya yabancı para üzerinden rehin kurulabilir. Türk parası ile kurulmuş bir rehne ait derecenin boşalması hâlinde ise, yerine tescil edileceği tarihteki karşılığı yabancı para üzerinden rehin kurulabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Yabancı veya Türk parası karşılıklarının hesabında hesap günündeki Türkiye Cumhuriyet Merkez Bankasının döviz alış kuru esas alınır. Rehin haklarının hangi yabancı paralar üzerinden kurulabileceği Cumhurbaşkanınca belirlenir.</template>
                  </mvz-fıkra>

                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>

                      <template>Birden çok taşınmazın aynı borç için rehnedilmesi, taşınmazların aynı malike veya borçtan müteselsilen sorumlu olan maliklere ait olmalarına bağlıdır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Aynı alacak için birden çok taşınmazın rehnedildiği diğer hâllerde, her taşınmazın alacağın ne miktarı için güvence oluşturduğu rehin kurulurken belirtilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">

                </mvz-b4>
              </mvz-b3>

                  <mvz-fıkra no="3">

                <mvz-madde no="859" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yetkili kamu kurum veya kuruluşu tarafından gerçekleştirilen parsel birleştirilmesi ve dağıtımı işlemi sonucunda birleştirilen parsel üzerindeki rehinler, sıralarını koruyarak o parselin yerine verilen taşınmaz üzerine geçer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Birleştirme sonucunda meydana gelen taşınmaz, değişik alacaklar için rehinli veya bazıları rehinsiz birden çok parselin yerini alırsa; bu taşınmaz üzerine geçen rehin hakları, taşınmazı bütün olarak kapsar ve olanak ölçüsünde sıralarını korurlar.</template>
                  </mvz-fıkra>

                  <mvz-fıkra no="1">
                    <template>Birleştirilen taşınmazlardan biri ile güvence altına alınmış olan alacağın borçlusu, üç ay önce bildirmek koşuluyla birleştirme sırasında karşılığını ödeyerek taşınmazı rehinden kurtarabilir.</template>

              <mvz-b3 no="3" başlık="Bedel olarak ödenen para">

                    <template>Rehinli bir taşınmaz için bedel olarak ödenen para, alacaklılar arasında sıralarına göre, aynı sırada iseler alacaklarının miktarlarıyla orantılı olarak bölüştürülür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu bedel, rehinle güvenceye bağlanmış olan alacak miktarının yirmide birinden fazla olduğu veya yeni taşınmaz, alacak için yeterli güvence oluşturmadığı takdirde, alacaklının rızası olmadan borçluya ödenemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>

          <mvz-b1 no="C" başlık="Hükmü">

                <mvz-fıkra no="1">

                <mvz-fıkra no="2">
                  <template>Rehnin kuruluşu sırasında makine, otel döşeme eşyası gibi açıkça eklenti olarak gösterilen ve tapu kütüğünde beyanlar sütununa yazılan şeyler, kanuna göre bu nitelikte olamayacakları ispat edilmedikçe eklenti sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Üçüncü kişilerin eklentiler üzerindeki hakları saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>

            <mvz-b2 no="II" başlık="Kira bedelleri">
              <mvz-madde no="863" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiraya verilmiş taşınmaz üzerindeki rehnin kapsamına, borçluya karşı rehnin paraya çevrilmesi yoluyla takibe başlanmasından veya borçlunun iflâsının ilânından başlayarak rehnin paraya çevrilmesi anına kadar işleyen kira bedelleri de girer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Rehin hakkı, kiracılara karşı ancak cebrî icra yoluyla takibin kendilerine bildirilmesi veya iflâs kararının ilânından sonra ileri sürülebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Rehinli taşınmaz malikinin henüz muaccel olmamış kira bedelleri üzerinde yaptığı hukukî işlemler ile diğer alacaklılar tarafından koydurulan hacizler, kira alacaklarının muaccel olmalarından önce rehnin paraya çevrilmesi yoluyla takibe başlamış olan rehinli alacaklılara karşı geçerli değildir.</template>
                </mvz-fıkra>
              </mvz-madde>

            <mvz-b2 no="III" başlık="Zamanaşımı">

                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Alacaklıya, gerekli önlemleri almak üzere hâkim tarafından yetki verilebileceği gibi; gecikmesinde tehlike bulunan hâllerde alacaklı, böyle bir yetki verilmeden de gerekli önlemleri kendiliğinden alabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Alacaklı, önlem için yapmış olduğu giderleri malikten isteyebilir ve bu alacakları için taşınmaz üzerinde, tescile gerek olmaksızın ve tescil edilmiş olan diğer yüklerden önce gelen bir rehin hakkına sahip olur.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Güvence, eski hâle getirme, kısmî ödeme isteme">
                  <mvz-madde no="866" başlık="">
                    <mvz-fıkra no="1">
                      <template>Rehinli taşınmazın değerinde düşme meydana gelmişse alacaklı, alacağı için başka güvence göstermesini veya rehinli taşınmazın eski hâle getirilmesini borçludan isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Alacaklı, rehinli taşınmazın değerinin düşmesi tehlikesinin mevcut olması hâlinde de güvence isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Yeterli güvence hâkim tarafından belirlenen süre içinde verilmediği takdirde alacaklı, güvence eksiğini karşılayacak miktardaki alacak kısmının ödenmesini isteyebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Değerin kusur olmadan düşmesi">
                <mvz-madde no="867" başlık="">
                  <mvz-fıkra no="1">
                    <template>Değer düşmesi malikin kusuru olmadan meydana gelmişse alacaklı, ancak malikin zarardan ötürü aldığı tazminat miktarını aşmayacak ölçüde borçludan güvence vermesini veya kısmî ödeme yapmasını isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bununla birlikte alacaklı, değer düşmesinin önlenmesi veya giderilmesi için gerekli önlemleri kendiliğinden alabilir. Alacaklı, bu amaçla yaptığı masraflardan dolayı rehinli taşınmaz üzerinde tescile gerek olmaksızın ve tescil edilmiş olan diğer yüklerden önce gelen bir rehin hakkına sahip olur. Malik, bu masraflardan kişisel olarak sorumlu değildir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Rehinli taşınmazın kısmen devri">
                <mvz-madde no="868" başlık="">
                  <mvz-fıkra no="1">
                    <template>Malik, rehinli taşınmazın güvence altına aldığı alacağın yirmide birinden az değeri olan bir parçasını başkasına devrederse; alacaklı, kendisine bu parça ile orantılı bir ödeme yapıldığı veya taşınmazın geri kalan kısmı yeterli güvence oluşturduğu takdirde, devredilen parça üzerindeki rehni kaldırmaktan kaçınamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Rehinden sonra kurulan aynî haklar">
              <mvz-madde no="869" başlık="">
                <mvz-fıkra no="1">
                  <template>Malikin rehinli taşınmaz üzerinde yeni sınırlı aynî haklar kurmayacağını taahhüt etmesi geçerli değildir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tarihi daha eski olan rehin hakkı, aynı taşınmaz üzerinde alacaklının izni olmadan daha sonra kurulan irtifak haklarından veya taşınmaz yüklerinden önce gelir. Sonradan kurulan ve rehnin paraya çevrilmesi sırasında daha eski tarihli rehinli alacaklılara zarar veren irtifaklar ve taşınmaz yükleri terkin edilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Önceki rehinli alacaklının istemiyle irtifak hakları veya taşınmaz yükleri terkin edilen kimselerin, rehinli taşınmazın paraya çevrilmesinde, hakları sonradan tescil edilenlere karşı, satış bedelinden haklarının değerini karşılayan miktarı almak hususunda öncelikleri vardır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Rehin derecesi">
              <mvz-b3 no="1" başlık="Rehin derecesinin hükümleri">
                <mvz-madde no="870" başlık="">
                  <mvz-fıkra no="1">
                    <template>Rehnin sağladığı güvence, tescilde belirtilen rehin derecesi ile sınırlıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Taşınmaz rehni, sırada kendisinden önce gelecek olanın miktarının tescilde belirtilmesi kaydıyla ikinci veya daha sonraki derecede de kurulabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Rehin dereceleri arasındaki ilişki">
                <mvz-madde no="871" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aynı taşınmaz üzerinde farklı sıralarda kurulmuş bulunan rehin haklarından birinin terkin edilmiş olması, sonraki sırada yer alan rehinli alacaklıya boşalan dereceye geçme hakkı vermez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Terkin edilen rehin hakkı yerine yeni bir rehin hakkı kurulabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Sonraki sırada yer alan rehinli alacaklılara boşalan dereceye geçme hakkı veren sözleşmelerin geçerliliği, resmî şekilde yapılmalarına; aynî etki sağlamaları, tapu kütüğüne şerh verilmelerine bağlıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Boş dereceler">
                <mvz-madde no="872" başlık="">
                  <mvz-fıkra no="1">
                    <template>Sonraki sıralarda kurulmuş bir rehin hakkından önce gelen bir rehin mevcut değilse veya borçlu önceki bir rehin senedi üzerinde tasarruf etmemişse ya da önceki sırada bulunan rehinli alacak, o derece için tescilde belirtilen miktardan az ise; taşınmazın paraya çevrilmesinde satış bedeli, boş derece hesaba katılmaksızın sonraki alacaklılara sıralarına göre dağıtılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="VII" başlık="Rehnin paraya çevrilmesi">
              <mvz-b3 no="1" başlık="Paraya çevirme şekli">
                <mvz-madde no="873" başlık="">
                  <mvz-fıkra no="1">
                    <template>Borç ödenmezse alacaklı, alacağını rehinli taşınmazın satış bedelinden elde etme hakkına sahiptir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Borcun ödenmemesi hâlinde rehinli taşınmazın mülkiyetinin alacaklıya geçeceğine ilişkin sözleşme hükmü geçersizdir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Aynı alacak için birden çok taşınmazın rehnedilmiş olması hâlinde, rehnin paraya çevrilmesi istemi, taşınmazların tamamı hakkında yapılır. Bununla birlikte, icra dairesi onlardan ancak gerektiği kadarını paraya çevirir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Satış bedelinin dağıtılması">
                <mvz-madde no="874" başlık="">
                  <mvz-fıkra no="1">
                    <template>Rehinli taşınmazın satış bedeli, alacaklılar arasında sıralarına göre dağıtılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Aynı sırada olan alacaklılar arasında o sıraya düşen satış bedeli alacakları oranında dağıtılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Güvencenin kapsamı">
                <mvz-madde no="875" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmaz rehninin alacaklıya sağladığı güvencenin kapsamına şunlar girer:</template>
                    <mvz-bent no="1.">
                      <template>Ana para,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Takip giderleri ve gecikme faizi,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>İflâsın açıldığı veya rehnin paraya çevrilmesinin istendiği tarihe kadar muaccel olmuş üç yıllık faiz ile son vadeden başlayarak işleyen faiz.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Daha önce belirlenmiş olan faiz oranı, sonradan gelen alacaklıların zararına olarak artırılamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Zorunlu masrafların güvencesi">
                <mvz-madde no="876" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklı, rehinli taşınmazın korunması için zorunlu masraf yapmışsa ve özellikle malikin borçlu olduğu sigorta primlerini ödemişse, bundan doğan alacakları tescile gerek olmaksızın aynen rehinli alacağı gibi güvenceden yararlanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="VIII" başlık="Arazinin iyileştirilmesi hâlinde rehin hakkı">
              <mvz-b3 no="1" başlık="Öncelik">
                <mvz-madde no="877" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir kamu kurum veya kuruluşunun katkısıyla iyileştirilen arazinin değerinde bir artma meydana gelirse malik, iyileştirme giderlerinden payına düşeni karşılamak üzere kendisine ödünç veren alacaklı lehine tescil suretiyle rehin hakkı kurabilir. Kurulan rehin, taşınmaz üzerindeki diğer bütün yüklerden önce gelir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İyileştirme, kamu kurum veya kuruluşunun katkısı olmaksızın yapılmış ise, malik taşınmazı üzerinde en çok masrafların üçte ikisi için rehin kurabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Borcun ödenmesi ve rehnin sona ermesi">
                <mvz-madde no="878" başlık="">
                  <mvz-fıkra no="1">
                    <template>İyileştirme, kamu kurum veya kuruluşunun katkısı olmaksızın yapılmış ise, rehinli alacağın en çok beş yıl içinde eşit taksitlerle ödenmesi gerekir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacağın veya yıllık taksitlerin muaccel olmasından beş yıl sonra rehin hakkı sona erer ve sonraki alacaklılar sıralarına göre ilerlerler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IX" başlık="Sigorta tazminatı üzerinde hak">
              <mvz-madde no="879" başlık="">
                <mvz-fıkra no="1">
                  <template>Muaccel olan sigorta tazminatı, malike ancak bütün rehinli alacaklıların rızasıyla ödenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Sigorta tazminatı taşınmazın eski hâle getirilmesi için harcanacaksa, malik tarafından yeterli bir güvence gösterilmesi koşuluyla kendisine ödenir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="X" başlık="Alacaklının temsili">
              <mvz-madde no="880" başlık="">
                <mvz-fıkra no="1">
                  <template>Acele karar alınması gereken hâllerde, borçlunun veya diğer bir ilgilinin istemesi üzerine, şahsen hareket etmesi kanun hükmü gereği olup da adı veya nerede olduğu bilinmeyen alacaklıya, rehinli taşınmazın bulunduğu yer sulh hâkimi tarafından bir kayyım atanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="İPOTEK">
          <mvz-b1 no="A" başlık="Amaç ve nitelik">
            <mvz-madde no="881" başlık="">
              <mvz-fıkra no="1">
                <template>Hâlen mevcut olan veya henüz doğmamış olmakla beraber doğması kesin veya olası bulunan herhangi bir alacak, ipotekle güvence altına alınabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İpoteğe konu olacak taşınmazın, borçlunun mülkiyetinde bulunması gerekmez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Kurulması ve sona ermesi">
            <mvz-b2 no="I" başlık="Kuruluş">
              <mvz-madde no="882" başlık="">
                <mvz-fıkra no="1">
                  <template>Miktarı belirli olmayan veya değişebilen alacaklar da, belli rehin derecesine yerleştirilir ve tescilden sonra alacak miktarında meydana gelecek değişmelere bakılmaksızın sırasını korur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tapu memuru istem üzerine alacaklıya ipoteği gösteren bir belge verir. Sadece tescilin yapıldığını ispata yarayan bu belge kıymetli evrak niteliği taşımaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Tescilin yapıldığının sözleşme üzerine yazılıp onaylanması, ipotek belgesi yerine geçer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Sona erme">
              <mvz-b3 no="1" başlık="İpoteğin terkinini isteme hakkı">
                <mvz-madde no="883" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacak sona erince ipotekli taşınmazın maliki, alacaklıdan ipoteği terkin ettirmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İpotek süreli olarak kurulmuşsa, sürenin bitiminden itibaren otuz gün içinde ipotekli taşınmaz üzerinde 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanununun 150/c maddesinde belirtilen şerhin konulmaması hâlinde ipotek, malikin talebiyle tapu müdürlüğünce terkin edilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Borçtan sorumlu olmayan malikin hakkı">
                <mvz-madde no="884" başlık="">
                  <mvz-fıkra no="1">
                    <template>Borçtan şahsen sorumlu olmayan rehinli taşınmaz maliki, borçluya ait koşullar içinde borcu ödeyerek taşınmazın üzerindeki ipoteğin kaldırılmasını isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacak, borcu ödeyen malike geçer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="İpotekten kurtarma">
                <mvz-b4 no="a" başlık="Koşulları ve usulü">
                  <mvz-madde no="885" başlık="">
                    <mvz-fıkra no="1">
                      <template>Değerini aşan bir borç için ipotek edilmiş olan bir taşınmazı edinen kimse, borçtan şahsen sorumlu değilse, icra takibine başlanmadan önce, satın alma bedelini ödeyerek taşınmazı ipotekten kurtarabilir. Taşınmazı karşılıksız olarak edinen kimse de, takdir edeceği bedeli ödeyerek bu hakkı kullanabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>İpotekten kurtarma hakkı, alacaklılara altı ay önce yapılacak yazılı ihbarla kullanılabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>İpotekten kurtarma bedeli alacaklılar arasında sıralarına göre dağıtılır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Açık artırma">
                  <mvz-madde no="886" başlık="">
                    <mvz-fıkra no="1">
                      <template>İpotekten kurtarma ihbarına karşı alacaklılar, ihbarın tebliğinden başlayarak bir ay içinde giderleri peşin ödemek suretiyle, ipotekli taşınmazın açık artırma yoluyla satılmasını isteyebilirler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Satış, icra dairesince İcra ve İflâs Kanunu hükümlerine göre yapılır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
