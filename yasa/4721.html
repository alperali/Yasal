                      <template>Açık artırmada elde edilen miktarın satış bedelinden veya malik tarafından takdir edilen bedelden fazla olması hâlinde, bu miktar ipotekten kurtarma bedeli sayılır. Artırma bedelinin fazla olduğu hâllerde açık artırma giderleri malike, aksi hâlde açık artırmayı isteyen alacaklıya ait olur.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Ödeme istemi">
                <mvz-madde no="887" başlık="">
                  <mvz-fıkra no="1">
                    <template>İpotekli taşınmazın maliki borçtan şahsen sorumlu değilse, alacaklının ödeme isteminin ona karşı etkili olması, bu istemin hem borçluya, hem kendisine karşı yapılmış olmasına bağlıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Hükmü">
            <mvz-b2 no="I" başlık="Mülkiyet ve borçluluk">
              <mvz-b3 no="1" başlık="Taşınmazın devri">
                <mvz-madde no="888" başlık="">
                  <mvz-fıkra no="1">
                    <template>İpotekli taşınmazın devri, aksi kararlaştırılmış olmadıkça, borçlunun sorumluluğunda ve güvencede bir değişiklik meydana getirmez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Yeni malik borcu yüklendiği takdirde alacaklı, kendisine başvurma hakkını saklı tuttuğunu bir yıl içinde yazılı olarak önceki borçluya bildirmezse, borçlu borcundan kurtulur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Taşınmazın bölünmesi">
                <mvz-madde no="889" başlık="">
                  <mvz-fıkra no="1">
                    <template>İpotekli taşınmazın bir kısmının veya aynı malike ait bulunan ipotekli taşınmazlardan birinin başkasına devredilmesi ya da ipotekli taşınmazın bölünmesi hâlinde, aksine bir anlaşma yoksa, rehin taşınmazlara değerleri oranında tapu idaresince re'sen dağıtılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu dağıtımı kabul etmeyen alacaklı, dağıtımın kesinleştiğinin kendisine tebliğinden başlayarak bir ay içinde yazılı bildirimde bulunmak suretiyle alacağın bir yıl içinde ödenmesini borçludan isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Yeni malikler, kendilerine ait taşınmaza düşen borcu yüklendikleri takdirde alacaklı, kendisine başvurma hakkını saklı tuttuğunu önceki borçluya bir yıl içinde yazılı olarak bildirmezse, borçlu borcundan kurtulur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Borcu yüklenmenin bildirilmesi">
                <mvz-madde no="890" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmazın yeni maliki borcu yüklenirse, tapu idaresi bunu alacaklıya bildirir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacaklıya tanınan hakkını saklı tuttuğuna ilişkin bir yıllık beyan süresi, tapu idaresince yapılan bildirimin tebliği tarihinden işlemeye başlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Alacağın devri">
              <mvz-madde no="891" başlık="">
                <mvz-fıkra no="1">
                  <template>İpotekle güvence altına alınmış bir alacağın devrinin geçerli olması, devrin tapu kütüğüne tescil edilmesine bağlı değildir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Kanunî ipotek">
            <mvz-b2 no="I" başlık="Tescile tâbi olmayan kanunî ipotek">
              <mvz-madde no="892" başlık="">
                <mvz-fıkra no="1">
                  <template>Kanunî ipotek haklarının doğumu, aksi kanunda öngörülmüş olmadıkça, tapu kütüğüne tescil edilmelerine bağlı değildir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Tescile tâbi kanunî ipotekler">
              <mvz-b3 no="1" başlık="Hâller">
                <mvz-madde no="893" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıdaki alacaklılar, kanunî ipotek hakkının tescilini isteyebilirler:</template>
                    <mvz-bent no="1.">
                      <template>Satıştan doğan alacağı için satılan taşınmaz üzerinde satıcı,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Elbirliği ortaklığına giren taşınmazlarda paylaşmadan doğan alacakları için birlikte mirasçı olanlar veya diğer elbirliği ortakları,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Bir taşınmaz üzerinde yapılan yapı veya diğer işlerde malzeme vererek veya vermeden emek sarf ettikleri için malzeme ve emek karşılığı olarak malik veya yükleniciden alacaklı olan alt yüklenici veya zanaatkârlar.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacaklıların, bu kanunî ipotek hakkından önceden feragat etmeleri geçerli değildir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Satıcılar, mirasçılar ve diğer elbirliği ortakları bakımından">
                <mvz-madde no="894" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satıcıların, mirasçıların ve diğer elbirliği ortaklarının kanunî ipotek haklarının, mülkiyetin naklini izleyen üç ay içinde tapu kütüğüne tescil edilmiş olması gerekir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Zanaatkâr ve yükleniciler bakımından">
                <mvz-b4 no="a" başlık="Tescil">
                  <mvz-madde no="895" başlık="">
                    <mvz-fıkra no="1">
                      <template>Zanaatkârların ve yüklenicilerin kanunî ipotek hakları, çalışmayı veya malzeme vermeyi yüklendikleri andan başlayarak tapu kütüğüne tescil olunabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Tescilin yüklenilen işin tamamlanmasından başlayarak üç ay içinde yapılmış olması gerekir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Tescilin yapılması için alacağın malik tarafından kabul edilmiş veya mahkemece karara bağlanmış olması şarttır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="4">
                      <template>Malik yeterli güvence gösterirse tescil istenemez.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Sıra">
                  <mvz-madde no="896" başlık="">
                    <mvz-fıkra no="1">
                      <template>Hakları değişik tarihlerde tescil edilmiş olsa bile zanaatkârlar ve yükleniciler, kanunî ipotekten yararlanma bakımından kendi aralarında aynı sırada sayılırlar.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Öncelik">
                  <mvz-madde no="897" başlık="">
                    <mvz-fıkra no="1">
                      <template>Satış bedeli zanaatkârlar ve yüklenicilerin alacaklarının tamamını karşılamadığı takdirde kalan kısım, ipotek hakkı elde eden önceki sıradaki alacaklıların payına düşen satış bedelinden arsa değeri çıkarıldıktan sonra artan para ile karşılanır. Ancak bu, taşınmaz üzerindeki yüklerin zanaatkârlar ve yüklenicilerin zararına olacağının alacaklılar tarafından bilinebilir olmasına bağlıdır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Önceki sırada bulunan alacaklılar, rehin senetlerini devrederlerse, bu devir yüzünden zanaatkârlar ve yüklenicilerin elde edemedikleri alacak miktarını tazmin etmekle yükümlü olurlar.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>İşe başlandığı, hak sahibi, zanaatkârlar veya yüklenicilerden birinin bildirimi üzerine tapu kütüğünün beyanlar sütununa yazıldıktan sonra, tescilin yapılabileceği sürenin sonuna kadar taşınmaz üzerinde ipotekten başka türde rehin tescil edilemez.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="İPOTEKLİ BORÇ SENEDİ VE İRAT SENEDİ">
          <mvz-b1 no="A" başlık="İpotekli borç senedi">
            <mvz-b2 no="I" başlık="Amaç ve nitelik">
              <mvz-madde no="898" başlık="">
                <mvz-fıkra no="1">
                  <template>İpotekli borç senedi, taşınmaz rehniyle güvence altına alınmış kişisel bir alacak meydana getirir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Değer biçilmesi">
              <mvz-madde no="899" başlık="">
                <mvz-fıkra no="1">
                  <template>İpotekli borç senedi yoluyla rehin kurulması için tapu idaresince taşınmaza resmen değer biçilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Biçilmiş değeri aşan miktar için ipotekli borç senedi yoluyla rehin kurulamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Muacceliyet bildirimi">
              <mvz-madde no="900" başlık="">
                <mvz-fıkra no="1">
                  <template>İpotekli borç senedindeki alacak, aksi kararlaştırılmış olmadıkça, faizlerin ödenmesi gereken tarihte, bu tarihten en az altı ay önce alacaklı veya borçlu tarafından diğer tarafa yapılacak bildirimle muaccel olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Malikin durumu">
              <mvz-madde no="901" başlık="">
                <mvz-fıkra no="1">
                  <template>İpotekli borç senedindeki borçtan kişisel olarak sorumlu olmayan rehinli taşınmaz maliki hakkında ipoteğe ilişkin hükümler uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taşınmaz maliki, alacaklıya karşı borçluya ait bütün def'ileri ileri sürebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Devir ve bölünme">
              <mvz-madde no="902" başlık="">
                <mvz-fıkra no="1">
                  <template>İpotekli borç senedinin güvencesi olan taşınmazın devrine veya bölünmesine ilişkin sonuçlar hakkında ipotek hükümleri uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="İrat senedi">
            <mvz-b2 no="I" başlık="Amaç ve nitelik">
              <mvz-madde no="903" başlık="">
                <mvz-fıkra no="1">
                  <template>İrat senedi, bir taşınmaz üzerinde taşınmaz yükü şeklinde kurulmuş bir alacak hakkı meydana getirir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İrat senedinin güvencesini ancak tarım arazisi, konutlar ve üzerinde bina yapılabilecek arsalar oluşturabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İrat senedi, kişisel borç doğurmaz ve borcun sebebini de göstermez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Sorumluluğun sınırı">
              <mvz-madde no="904" başlık="">
                <mvz-fıkra no="1">
                  <template>İrat senetlerindeki alacak miktarı, tarım arazisinde arazinin gelir değerinin, diğer taşınmazlarda taşınmazın gelir değeri ile bina ve arsa değerleri ortalamasının beşte üçünü aşamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Değerlendirmeler tapu idaresince resmen yapılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Devletin sorumluluğu">
              <mvz-madde no="905" başlık="">
                <mvz-fıkra no="1">
                  <template>Değer biçilmesinde gereken özenin gösterilmemesinden Devlet sorumludur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Devlet, kusuru olan memurlara rücu edebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Yükten kurtarma">
              <mvz-madde no="906" başlık="">
                <mvz-fıkra no="1">
                  <template>İrat senedi ile yüklü olan taşınmazın maliki, sözleşmeyle daha uzun bir bildirim süresi kabul edilmiş olsa bile, her altı yıllık dönemin sonu için bir yıl önce bildirmek ve bedelini ödemek koşuluyla taşınmazın yükten kurtarılmasını isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kanunda öngörülen hâller dışında alacaklı, ancak her on yıllık dönemin sonu için bir yıl önce bildirmek suretiyle borcun ödenmesini isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Borç ve mülkiyet">
              <mvz-madde no="907" başlık="">
                <mvz-fıkra no="1">
                  <template>İrat senedinin borçlusu yüklü taşınmazın malikidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yüklü taşınmazı edinen kimse irat senedinin borçlusu olur ve eski malik başka bir işleme gerek kalmaksızın borcundan kurtulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Faiz borçları, taşınmazla güvenceye bağlı olmaktan çıktığı tarihten başlayarak malikin kişisel borcu olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Bölünme">
              <mvz-madde no="908" başlık="">
                <mvz-fıkra no="1">
                  <template>İrat senediyle yüklü taşınmazın bölünmesi hâlinde, parsellerin malikleri irat senedinin borçlusu olurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İrat senedi borcunun parsellere dağıtılmasında, ipotekle yüklü taşınmazın bölünmesine ilişkin hükümler uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Alacaklı, borcun parsellere dağıtımının kesinleşmesinden başlayarak bir ay içinde yapacağı bildirimle bir yıl içinde irat senedinin satın alınmasını isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Ortak hükümler">
            <mvz-b2 no="I" başlık="Kurulması">
              <mvz-b3 no="1" başlık="Alacağın niteliği">
                <mvz-madde no="909" başlık="">
                  <mvz-fıkra no="1">
                    <template>İpotekli borç senedi ve irat senedi koşul ve karşı edim kaydı içeremez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Senedin dayanağı borç ile ilişkisi">
                <mvz-madde no="910" başlık="">
                  <mvz-fıkra no="1">
                    <template>İpotekli borç senedinin veya irat senedinin düzenlenmesiyle birlikte dayanağı olan borç ilişkisi yenileme yoluyla sona erer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bunun aksine yapılan sözleşme, sadece tarafları ve iyiniyetli olmayan üçüncü kişileri etkiler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Tescil ve rehin senedi">
                <mvz-b4 no="a" başlık="Rehin senedini düzenleme gereği">
                  <mvz-madde no="911" başlık="">
                    <mvz-fıkra no="1">
                      <template>İpotekli borç senedi veya irat senedi için tapu kütüğüne yapılacak tescilden başka rehin senedi de düzenlenir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Senet daha sonra düzenlenmiş olsa bile, hukukî sonuçlarını tescil tarihinden başlayarak doğurur.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Rehin senedinin düzenlenmesi">
                  <mvz-madde no="912" başlık="">
                    <mvz-fıkra no="1">
                      <template>İpotekli borç senedi ve irat senedi, tapu memuru tarafından düzenlenir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Senetler üzerinde tapu memuru ile yetkili Hazine temsilcisinin imzaları bulunur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Bu senetler, alacaklı veya temsilcisine ancak borçlunun ve yüklü taşınmazın malikinin yazılı rızaları üzerine verilebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Rehin senedinin şekli">
                  <mvz-madde no="913" başlık="">
                    <mvz-fıkra no="1">
                      <template>İpotekli borç senedi ve irat senedinin şekilleri Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Alacaklının belirlenmesi">
                <mvz-b4 no="a" başlık="Düzenleme sırasında">
                  <mvz-madde no="914" başlık="">
                    <mvz-fıkra no="1">
                      <template>İpotekli borç senedi ve irat senedi nama veya hamile yazılı düzenlenebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bu senetler, yüklü taşınmazın maliki adına da düzenlenebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Ortak temsilci">
                  <mvz-madde no="915" başlık="">
                    <mvz-fıkra no="1">
                      <template>İpotekli borç senedi veya irat senedi düzenlenirken, gerekli ödemeleri yapmak ve ödenecek paraları tahsil etmek, yapılacak tebliğleri almak, güvence azalmalarına rıza göstermek ve genel olarak alacaklının, borçlunun ve malikin haklarını tam bir özen ve tarafsızlıkla korumak üzere bunlar tarafından bir temsilci atanabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Temsilcinin adı tapu kütüğüne ve rehin senedine yazılır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Temsilcinin yetkisinin sona ermesi hâlinde ilgililer anlaşamazlarsa, sulh hâkimi gerekli önlemleri alır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="5" başlık="Ödeme yeri">
                <mvz-madde no="916" başlık="">
                  <mvz-fıkra no="1">
                    <template>Rehin senedinden aksi anlaşılmadıkça, senet hamile yazılı olsa bile borçlu, bütün ödemelerini alacaklının yerleşim yerinde yapmak zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacaklının yerleşim yeri bilinmediği veya alacaklı yerleşim yerini borçlunun zararına değiştirdiği takdirde borçlu, borcunu kendi yerleşim yerindeki veya alacaklının eski yerleşim yerindeki hâkimin belirleyeceği yere tevdi ederek borcundan kurtulabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Senedin faiz kuponları varsa faiz ödemesi, kuponları ibraz edene yapılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="6" başlık="Alacağın devrinden sonra ödeme">
                <mvz-madde no="917" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacağın devri hâlinde borçlu, kendisine bildirilmiş olmadıkça kupona bağlı olmayan faiz ve yıllık edimleri, senet hamile yazılı olsa bile, eski alacaklıya ödeyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ana paranın tamamen veya kısmen ödenmesi, ancak ödeme zamanında kendisinin alacaklı olduğunu ispat eden kimseye yapılmış ise geçerlidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Sona erme">
              <mvz-b3 no="1" başlık="Alacaklının olmaması">
                <mvz-madde no="918" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklı yoksa veya rehin hakkından feragat ederse borçlu, tapu kütüğündeki tescili terkin ettirip ettirmemekte serbesttir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Borçlu, zilyetliğine geçmiş olan senedi yeniden tedavüle çıkartabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Terkin">
                <mvz-madde no="919" başlık="">
                  <mvz-fıkra no="1">
                    <template>İpotekli borç senedi veya irat senedine ilişkin tescil, ancak tarafların veya mahkemenin rehin senedini iptal etmesi üzerine terkin edilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Alacaklının hakları">
              <mvz-b3 no="1" başlık="İyiniyetin korunması">
                <mvz-b4 no="a" başlık="Tescil bakımından">
                  <mvz-madde no="920" başlık="">
                    <mvz-fıkra no="1">
                      <template>İpotekli borç senedinden veya irat senedinden doğan alacak, tapu kütüğüne iyiniyetle dayanan herkes için kütükteki tescile göre geçerlidir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Senet bakımından">
                  <mvz-madde no="921" başlık="">
                    <mvz-fıkra no="1">
                      <template>Usulüne göre düzenlenmiş olan ipotekli borç senedi veya irat senedi, ona iyiniyetle dayanan herkes hakkında, içinde yazılı olanlara göre geçerlidir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Senet ile tescilin ilişkisi">
                  <mvz-madde no="922" başlık="">
                    <mvz-fıkra no="1">
                      <template>İpotekli borç senedi veya irat senedi metninde yazılı olanlar tapu kütüğündeki tescile uymazsa veya tapu kütüğünde tescil yoksa, kütük esas alınır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bununla birlikte senedi iyiniyetle edinen kimse, tapu kütüğüne ilişkin hükümler uyarınca tazminat isteyebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Hakkın ileri sürülmesi">
                <mvz-madde no="923" başlık="">
                  <mvz-fıkra no="1">
                    <template>Nama veya hamile yazılı ipotekli borç senedi veya irat senedindeki alacak, ancak senet üzerindeki zilyetlikle birlikte devir veya rehin edilebilir veya başka bir tasarrufa konu olabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Senetlerin henüz düzenlenmemiş olması veya mahkeme tarafından iptal edilmesi hâlinde alacağı ileri sürme hakkı saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Alacağın devri">
                <mvz-madde no="924" başlık="">
                  <mvz-fıkra no="1">
                    <template>İpotekli borç senedindeki veya irat senedindeki alacağın devri, rehin senedinin teslim edilmesine bağlıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Rehin senedinin nama yazılı olması hâlinde devralanın adı ve devir işlemi senet üzerine yazılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="İptal">
              <mvz-b3 no="1" başlık="Senedin kaybedilmesi">
                <mvz-madde no="925" başlık="">
                  <mvz-fıkra no="1">
                    <template>Rehin senedi irade dışında elden çıkmış veya borcu sona erdirme kastı olmaksızın yok edilmiş ise alacaklı, rehin senedini ve kuponu mahkeme kararıyla iptal ettirerek borçludan borcunu ödemesini ve eğer alacak henüz muaccel değilse yeni bir rehin senedi veya kupon düzenlenmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İptal kararı, hamile yazılı kıymetli evrakın iptaline ilişkin hükümler gereğince verilir; ancak, ibraz süresi bir yıldır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Borçlu da ödenmiş olmasına rağmen geri verilmemiş olan senet için aynı hükümler uyarınca senedin iptalini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="İlân yoluyla duyuru">
                <mvz-madde no="926" başlık="">
                  <mvz-fıkra no="1">
                    <template>İpotekli borç senedi veya irat senedinin alacaklısının kim olduğu on yıldan beri bilinmiyor ve bu süre içinde faiz ödenmesi de istenmemiş bulunuyorsa, rehinli taşınmazın maliki, alacaklının ortaya çıkması için gaipliğe ilişkin hükümlere göre ilân yapılmasını hâkimden isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacaklı ortaya çıkmaz ve yapılan araştırma sonunda büyük bir olasılıkla alacağın artık mevcut olmadığı anlaşılırsa, hâkim tarafından senedin iptaline karar verilir; bu kararla rehin derecesi boşalmış olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Borçlunun def'ileri">
              <mvz-madde no="927" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlu yalnız tescilden veya senetten doğan def'ileri ve istemde bulunan alacaklıya karşı sahip olduğu kişisel def'ileri ileri sürebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Ödenen senedin geri verilmesi">
              <mvz-madde no="928" başlık="">
                <mvz-fıkra no="1">
                  <template>Borcun tamamını ödeyen borçlu, alacaklıdan senedin iptal edilmemiş olarak geri verilmesini isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VII" başlık="Hukukî ilişkide değişiklik">
              <mvz-madde no="929" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlu borcun kısmen ödenmesi veya borç yükünün hafifletilmesi ya da güvencenin azaltılması gibi hukukî ilişkide meydana gelen değişiklikleri tapu kütüğüne tescil ettirme hakkına sahiptir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tapu memuru, bu tür değişiklikleri senet üzerine de yazar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Meydana gelen değişikliklerin tescil edilmemiş olması hâlinde, senette yazılı yıllık edimlerin ödenmiş olması dışındaki değişiklikler senedi iyiniyetle kazanan kimseye karşı ileri sürülemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="TAŞINMAZ REHNİYLE GÜVENCE ALTINA ALINAN ÖDÜNÇ SENETLERİ">
          <mvz-b1 no="A" başlık="Rehinli tahviller">
            <mvz-madde no="930" başlık="">
              <mvz-fıkra no="1">
                <template>Nama veya hamile yazılı tahviller, aşağıdaki hâllerde taşınmaz rehniyle güvence altına alınabilir:</template>
                <mvz-bent no="1.">
                  <template>Ödüncün tamamı için ipotek veya ipotekli borç senedi yoluyla rehin kurulması ve alacaklılar ile borçlu için ortak bir temsilcinin atanması,</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Tahvil çıkarmayı üzerine alan kurum yararına ödüncün tamamı için taşınmaz rehni kurulması ve bu rehinli alacağın da tahvil alacaklıları yararına rehnedilmesi.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Seri hâlinde rehin senedi çıkarılması">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="931" başlık="">
                <mvz-fıkra no="1">
                  <template>Seri hâlinde çıkarılan ipotekli borç senetleri ile irat senetleri hakkında, aşağıdaki hükümler saklı kalmak kaydıyla, ipotekli borç senedi ve irat senedine ilişkin genel hükümler uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Düzenlenmesi">
              <mvz-madde no="932" başlık="">
                <mvz-fıkra no="1">
                  <template>Seri hâlinde çıkarılan senetler, her birinin değeri yüz milyon lira veya yüz milyon liranın katları olarak düzenlenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bir serideki bütün senetlerin şeklinin aynı olması ve numaralarının birbirini izlemesi gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Senetlerin rehinli taşınmaz maliki tarafından çıkarılmamış olması hâlinde aracı kurumun, alacaklılar ve borçlunun temsilcisi olduğu senetlerde belirtilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Borcun kısım kısım ödenmesi">
              <mvz-madde no="933" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlu, belirli zamanlarda faizle birlikte anaparanın bir kısmını da ödemeyi üstlenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taksit olarak her yıl ödenecek paranın, senetlerin belli bir bölümünü karşılaması zorunludur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Tescil">
              <mvz-madde no="934" başlık="">
                <mvz-fıkra no="1">
                  <template>Senetler, sayıları gösterilmek suretiyle tapu kütüğüne tescil olunur; ödüncün tamamı için bir tescil yapılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Senet sayısı az ise, her senet ayrı tescil edilebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Hükmü">
              <mvz-b3 no="1" başlık="Senedi çıkaran aracı kurum">
                <mvz-madde no="935" başlık="">
                  <mvz-fıkra no="1">
                    <template>Senedi çıkaran aracı kurum, alacaklıların ve borçlunun temsilcisi olsa bile, senetlerin çıkarılması sırasında kendisine ayrıca yetki verilmiş olmadıkça, borcun kapsamında ve koşullarında bir değişiklik yapamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Senetlerin geri ödenmesi">
                <mvz-b4 no="a" başlık="Ödeme plânı">
                  <mvz-madde no="936" başlık="">
                    <mvz-fıkra no="1">
                      <template>Senetlerin geri ödenmesi, çıkarma sırasında yapılan veya o sırada verilen yetkiye dayanarak aracı kurumun düzenleyeceği plâna göre gerçekleştirilir. Sırası gelen senedin karşılığı alacaklıya ödenmekle senedin hükmü kalmaz.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Aksi kararlaştırılmadıkça tescilin terkini, ancak borçlunun tescilde belirtilen yükümlülüklerini tamamen yerine getirmiş ve senetlerin bütün kuponları ile birlikte geri verilmiş olmasına veya geri verilmemiş kuponlar varsa bunları karşılayacak miktarın hâkimin belirleyeceği yere tevdi edilmesine bağlıdır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Denetleme">
                  <mvz-madde no="937" başlık="">
                    <mvz-fıkra no="1">
                      <template>Rehinli taşınmazın maliki veya aracı kurum, ödeme plânına göre kur'a çekmek ve karşılığı ödenen senetleri iptal etmekle yükümlüdür.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>İrat senetlerinde bu işlemler Devletçe denetlenir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="c" başlık="Geri ödemelerin özgülenmesi">
                  <mvz-madde no="938" başlık="">
                    <mvz-fıkra no="1">
                      <template>Rehinli taşınmazlar yerine elde edilen paralar, ilk kur'a çekiminde belli olacak senetlerin ödenmesinde kullanılır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="TAŞINIR REHNİ">
        <mvz-ayırım no="1-BİRİNCİ" başlık="TESLİME BAĞLI REHİN VE HAPİS HAKKI">
          <mvz-b1 no="A" başlık="Teslime bağlı rehin">
            <mvz-b2 no="I" başlık="Kurulması">
              <mvz-b3 no="1" başlık="Alacaklının zilyetliği">
                <mvz-madde no="939" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kanunda öngörülen ayrık durumlar dışında taşınırlar, ancak zilyetliğin alacaklıya devri suretiyle rehnedilebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Rehnedende tasarrufta bulunma yetkisi olmasa bile, rehin konusu taşınıra iyiniyetle zilyet olan kimse, zilyetlik hükümlerine göre edinimi korunduğu ölçüde rehin hakkı kazanır. Üçüncü kişilerin önceki zilyetlikten doğan hakları saklıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Taşınır, fiilen yalnız rehnedenin hâkimiyetinde kaldığı sürece rehin hakkı doğmaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Ayrık durumlar">
                <mvz-madde no="940" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yetkili makamlar tarafından izin verilen kuruluşlar ile kooperatiflerin alacaklarının güvence altına alınması için, zilyetlik devredilmeden de, icra dairesinde tutulacak özel sicile yazılmak suretiyle hayvanlar üzerinde rehin kurulabilir. Bu amaçla tutulacak sicil Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Gerçek veya tüzel kişilerin alacaklarının güvence altına alınması için, kanun gereğince bir sicile tescili zorunlu olan taşınır mallar üzerinde, zilyetlik devredilmeden de, taşınır malın kayıtlı bulunduğu sicile yazılmak suretiyle rehin kurulabilir. Rehnin kurulmasına ilişkin diğer hususlar Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Art rehin">
                <mvz-madde no="941" başlık="">
                  <mvz-fıkra no="1">
                    <template>Rehnedilen taşınırın maliki, onun üzerinde bir art rehin kurabilir. Bunun için, alacağı ödenince rehnedilen taşınırın sonraki alacaklıya teslim edilmesinin rehinli alacaklıya yazılı olarak bildirilmesi gerekir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Alt rehin">
                <mvz-madde no="942" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklı, rehinli taşınırı ancak rehnedenin rızasıyla bir başkasına rehnedebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Rehnin sona ermesi">
              <mvz-b3 no="1" başlık="Zilyetliğin kaybı">
                <mvz-madde no="943" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınır rehni, alacaklının zilyet olmaktan çıkması ve onu zilyet olan üçüncü kişiden geri alamaz hâle gelmesiyle son bulur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Taşınır, alacaklının rızasıyla fiilen yalnız rehnedenin hâkimiyeti altında bulunduğu sürece rehnin hükümleri askıda kalır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Geri verme borcu">
                <mvz-madde no="944" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacağın ödenmesi suretiyle veya başka bir sebeple rehin hakkı sona erince alacaklı, rehinli taşınırı hak sahibine geri vermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacaklı, alacağının tamamını almadıkça rehinli taşınırı veya onun bir kısmını geri vermek zorunda değildir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Alacaklının sorumluluğu">
                <mvz-madde no="945" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklı, rehinli taşınırın kaybolması, yok olması veya değerinin azalması yüzünden meydana gelen zararlardan, bunların kendi kusuru olmaksızın doğduğunu ispat etmedikçe sorumludur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Rehinli taşınırı kendiliğinden başkasına devir veya rehneden alacaklı, bundan doğan bütün zararlardan sorumlu olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Rehnin hükümleri">
              <mvz-b3 no="1" başlık="Alacaklının hakkı">
                <mvz-madde no="946" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklı, ödenmeyen alacağının rehnin paraya çevrilmesi yoluyla ödenmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Rehin hakkı, alacaklıya asıl alacak ile birlikte sözleşme faizlerinin, takip giderlerinin ve gecikme faizinin güvencesini sağlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Rehnin kapsamı">
                <mvz-madde no="947" başlık="">
                  <mvz-fıkra no="1">
                    <template>Rehin, taşınırı eklentileriyle birlikte kapsar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Aksi kararlaştırılmış olmadıkça alacaklı, rehinli taşınırın doğal ürünlerini, bütünleyici parçası olmaktan çıkınca malike vermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Rehin, paraya çevirme sırasında bütünleyici parça niteliğindeki doğal ürünleri de kapsar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Rehnin sırası">
                <mvz-madde no="948" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aynı taşınır üzerinde birden çok rehin hakkı bulunduğu takdirde, alacaklılara rehin haklarının sırasına göre ödeme yapılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Rehin hakkının sırası kuruluş tarihine göre belirlenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Mülkiyetin geçememesi">
                <mvz-madde no="949" başlık="">
                  <mvz-fıkra no="1">
                    <template>Borcun ödenmemesi hâlinde rehinli taşınırın mülkiyetinin alacaklıya geçmesini öngören sözleşme hükmü geçersizdir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Hapis hakkı">
            <mvz-b2 no="I" başlık="Koşulları">
              <mvz-madde no="950" başlık="">
                <mvz-fıkra no="1">
                  <template>Alacaklı, borçluya ait olup onun rızasıyla zilyedi bulunduğu taşınırı veya kıymetli evrakı, borcun muaccel olması ve niteliği itibarıyla bu eşyanın alacak ile bağlantısı bulunması hâlinde, borç ödeninceye kadar hapsedebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Zilyetlik ve alacak ticarî ilişkiden doğmuşsa, tacirler arasında bu bağlantı var sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Alacaklı, borçluya ait olmayan taşınırlar üzerinde de zilyetliğin iyiniyetle kazanılmasının korunduğu ölçüde hapis hakkına sahip olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Ayrık durumlar">
              <mvz-madde no="951" başlık="">
                <mvz-fıkra no="1">
                  <template>Nitelikleri itibarıyla paraya çevrilmeye elverişli olmayan taşınırlar üzerinde hapis hakkı kullanılamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacaklının üstlendiği yükümlülükle veya borçlunun teslim sırasında ya da daha önce verdiği talimatla veya kamu düzeniyle bağdaşmayan hâllerde de hapis hakkı kullanılamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Borç ödemeden aciz">
              <mvz-madde no="952" başlık="">
                <mvz-fıkra no="1">
                  <template>Alacaklı, borçlunun ödemeden acze düşmesi hâlinde, alacağı muaccel olmasa bile, hapis hakkını kullanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Borç ödemeden aciz, taşınırın tesliminden sonra meydana gelmiş veya daha önce meydana gelmiş olmakla beraber alacaklı bu durumu teslimden sonra öğrenmiş ise; o şeyin belli bir yönde kullanılacağı konusunda alacaklı tarafından yüklenilmiş bir yükümlülük veya borçlunun teslim sırasında ya da daha önce verdiği talimatla bağdaşmasa bile, alacaklı hapis hakkını kullanabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Hükümleri">
              <mvz-madde no="953" başlık="">
                <mvz-fıkra no="1">
                  <template>Borç yerine getirilmez ve yeterli güvence de gösterilmezse alacaklı, borçluya daha önce bildirimde bulunarak, hapsettiği şeylerin teslime bağlı rehin hükümleri uyarınca paraya çevrilmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Üzerinde hapis hakkı bulunan nama yazılı kıymetli evrakın paraya çevrilmesi için icra dairesi, borçlu yerine gerekli işlemleri yapar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="ALACAKLAR VE DİĞER HAKLAR ÜZERİNDE REHİN">
          <mvz-b1 no="A" başlık="Genel olarak">
            <mvz-madde no="954" başlık="">
              <mvz-fıkra no="1">
                <template>Başkasına devredilebilen alacaklar ve diğer haklar rehnedilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aksine bir hüküm bulunmadıkça, bunların rehni hakkında da teslime bağlı rehin hükümleri uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Kurulması">
            <mvz-b2 no="I" başlık="Senede bağlı olan veya olmayan alacaklarda">
              <mvz-madde no="955" başlık="">
                <mvz-fıkra no="1">
                  <template>Senede bağlanmış olan veya olmayan alacakların rehni için rehin sözleşmesinin yazılı şekilde yapılması ve senede bağlı alacaklarda senedin teslim edilmesi gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacaklı veya rehneden, rehni borçluya ihbar edebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Diğer hakların rehninde, yazılı rehin sözleşmesiyle birlikte, bu hakların devri için öngörülen şekle uyulması gerekir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Kıymetli evrakta">
              <mvz-madde no="956" başlık="">
                <mvz-fıkra no="1">
                  <template>Hamile yazılı senetlerin rehni için senetlerin rehin alacaklısına teslimi yeterlidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Diğer kıymetli evrakın rehni için senedin ciro edilmiş veya yazılı devir beyanı yapılmış olarak teslimi gerekir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Emtiayı temsil eden senetlerde">
              <mvz-madde no="957" başlık="">
                <mvz-fıkra no="1">
                  <template>Emtiayı temsil eden kıymetli evrakın rehnedilmesiyle emtia üzerinde rehin hakkı doğar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Emtiayı temsil eden senetten başka özel bir rehin senedi  düzenlenmişse, rehinli alacak miktarının ve muaccel olduğu tarihin senet üzerine yazılmış olması koşuluyla, rehin senedinin rehnedilmiş olması yeterlidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Art rehin">
              <mvz-madde no="958" başlık="">
                <mvz-fıkra no="1">
                  <template>Rehinli bir alacak üzerinde sonra gelen bir rehnin kurulması, ancak rehnedenin veya sonra gelen rehin alacaklısının durumu önce gelen rehin alacaklısına yazılı olarak bildirmesi hâlinde geçerlidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Hükümleri">
            <mvz-b2 no="I" başlık="Rehnin kapsamı">
              <mvz-madde no="959" başlık="">
                <mvz-fıkra no="1">
                  <template>Faiz veya kâr payı gibi dönemsel gelir getiren alacakların rehnedilmiş olması hâlinde, aksi kararlaştırılmış olmadıkça, bunlardan yalnız vadeleri henüz gelmemiş olanlar rehnin kapsamına girer ve rehin, vadeleri geçmiş olan edimleri kapsamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu tür yan edimler için özel senetler düzenlenmiş ise, aksi kararlaştırılmış olmadıkça, bunların rehin kapsamına girmesi, şekil koşullarına uygun olarak rehnedilmelerine bağlıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Rehinli pay senetlerinin temsili">
              <mvz-madde no="960" başlık="">
                <mvz-fıkra no="1">
                  <template>Ortaklık genel kurulunda rehinli pay senetlerini temsil etmek yetkisi, rehin alacaklısına değil, pay sahibine aittir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Yönetim ve ödeme">
              <mvz-madde no="961" başlık="">
                <mvz-fıkra no="1">
                  <template>Özenli bir yönetim, rehnedilmiş alacağın muacceliyetinin ihbarını ve tahsil edilmesini gerekli kılıyorsa alacaklı bu işlemleri yapabilir; rehin alacaklısı da alacaklıyı bu işlemlerin yapılmasına zorlayabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Rehin kendisine ihbar edilmiş olan borçlu, borcunu asıl alacaklıya veya rehin alacaklısına ancak diğerinin rızasıyla ödeyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bu rızanın bulunmaması hâlinde borçlu, borcunu tevdi etmekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="REHİN KARŞILIĞINDA ÖDÜNÇ VERME İŞİ İLE UĞRAŞANLAR">
          <mvz-b1 no="A" başlık="Ödünç verenler">
            <mvz-b2 no="I" başlık="İşletme izni alma">
              <mvz-madde no="962" başlık="">
                <mvz-fıkra no="1">
                  <template>İşletme olarak taşınır rehni karşılığında ödünç verme işiyle uğraşmak isteyenler, yetkili makamdan izin almak zorundadırlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Süre">
              <mvz-madde no="963" başlık="">
                <mvz-fıkra no="1">
                  <template>Özel işletmelere ancak belli süre için izin verilebilir. Sürenin bitiminde bu izin yenilenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Gerekli kurallara uyulmaması hâlinde, verilen izin her zaman geri alınabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Taşınır rehni karşılığı ödünç">
            <mvz-b2 no="I" başlık="Kurulması">
              <mvz-madde no="964" başlık="">
                <mvz-fıkra no="1">
                  <template>Rehnedilen taşınırın işletmeye teslim edilmesi ve karşılığında bir makbuzun alınmasıyla rehin kurulmuş olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Hükümleri">
              <mvz-b3 no="1" başlık="Rehnin paraya çevrilmesi">
                <mvz-madde no="965" başlık="">
                  <mvz-fıkra no="1">
                    <template>Borç vadesinde ödenmezse, ödünç veren, borçluya önceden noter aracılığı ile borcunu ödemesini ihtar ettikten sonra rehni icra yoluyla paraya çevirtebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Borçlu, ödünç verene karşı kişisel olarak sorumlu değildir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Arta kalan para üzerindeki hak">
                <mvz-madde no="966" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satış bedelinin rehinli alacak miktarından fazla olması hâlinde, arta kalan para hak sahibine ödenir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşletmenin aynı borçludan birden fazla alacağı varsa, bunlar arta kalan para hesaplanırken bir bütün olarak göz önünde tutulur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Arta kalan miktarı isteme hakkı, rehnedilen taşınırın paraya çevrilmesinin üzerinden beş yıl geçmekle zamanaşımına uğrar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Rehnin sona ermesi">
              <mvz-b3 no="1" başlık="Rehinden kurtarmayı isteme hakkı">
                <mvz-madde no="967" başlık="">
                  <mvz-fıkra no="1">
                    <template>Rehnedilen taşınır, satılıncaya kadar rehin makbuzunun geri verilmesi suretiyle rehinden kurtarılabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Rehin makbuzu geri verilmezse, alacağın muaccel olmasından sonra hak sahibi olduğunu ispat eden kimse taşınırı rehinden kurtarabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Ödünç veren, rehnedilen taşınırı makbuzun teslimi karşılığı geri verme hakkını açıkça saklı tutmuş olsa bile; alacağın muaccel olmasının üzerinden altı ay geçtikten sonra hakkını ispat eden kimse, taşınırı rehinden kurtarabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Ödünç verenin hakları">
                <mvz-madde no="968" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ödünç veren, taşınırın rehinden kurtarıldığı aya ait faizin tamamının ödenmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ödünç veren, makbuzu kim getirirse taşınırı ona geri verme hakkını açıkça saklı tutmuşsa, makbuzun hamilinin bunu haksız olarak ele geçirdiğini bilmedikçe ve bilmesi gerekmedikçe bu yetkisini kullanabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Geri alım hakkı tanıyarak satım">
            <mvz-madde no="969" başlık="">
              <mvz-fıkra no="1">
                <template>Geri alım hakkı tanıyarak satın almayı meslek edinenler hakkında da, taşınır rehni karşılığında ödünç verenlere ilişkin hükümler uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="REHİNLİ TAHVİL">
          <mvz-b1 no="A" başlık="Niteliği">
            <mvz-madde no="970" başlık="">
              <mvz-fıkra no="1">
                <template>İşletme olarak taşınmaz rehni karşılığında ödünç verme işiyle uğraşmak üzere yetkili makamdan izin alanlar, özel bir rehin sözleşmesi ve teslim yükümlülüğü olmasa bile, taşınmaz rehniyle güvence altına alınmış alacakları ile cari işlerinden doğan alacaklarını karşılık göstererek rehinli tahvil çıkarabilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Şekli">
            <mvz-madde no="971" başlık="">
              <mvz-fıkra no="1">
                <template>Alacaklılar, rehinli tahvillerin öngörülen zamandan önce ödenmesini isteyemezler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Tahviller hamile veya nama yazılı olarak çıkarılır ve hamile yazılı kuponları bulunur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Düzenlenmesi">
            <mvz-madde no="972" başlık="">
              <mvz-fıkra no="1">
                <template>Tahvil çıkaracaklar ile tahvil çıkarmaya ilişkin koşullar ve çıkarma izni vermeye yetkili makam özel kanunla belirlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="3-ÜÇÜNCÜ" başlık="ZİLYETLİK VE TAPU SİCİLİ">
      <mvz-bölüm no="1-BİRİNCİ" başlık="ZİLYETLİK">
        <mvz-b1 no="A" başlık="Zilyetlik kavramı ve türleri">
          <mvz-b2 no="I" başlık="Kavram">
            <mvz-madde no="973" başlık="">
              <mvz-fıkra no="1">
                <template>Bir şey üzerinde fiilî hâkimiyeti bulunan kimse onun zilyedidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Taşınmaz üzerindeki irtifak haklarında ve taşınmaz yüklerinde hakkın fiilen kullanılması zilyetlik sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Türleri">
            <mvz-b3 no="1" başlık="Aslî ve fer'î zilyetlik">
              <mvz-madde no="974" başlık="">
                <mvz-fıkra no="1">
                  <template>Zilyet, bir sınırlı aynî hak veya bir kişisel hakkın kurulmasını ya da kullanılmasını sağlamak için şeyi başkasına teslim ederse, bunların ikisi de zilyet olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bir şeyde malik sıfatıyla zilyet olan aslî zilyet, diğeri fer'î zilyettir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Dolaylı ve dolaysız zilyetlik">
              <mvz-madde no="975" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir şeyde fiilî hâkimiyetini doğrudan doğruya sürdüren kimse dolaysız zilyet, başka bir kişi aracılığı ile sürdüren kimse dolaylı zilyettir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Geçici olarak kesilme">
            <mvz-madde no="976" başlık="">
              <mvz-fıkra no="1">
                <template>Fiilî hâkimiyetin geçici nitelikteki sebeplerle kullanılmaması veya kullanma olanağının ortadan kalkması zilyetliği sona erdirmez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Zilyetliğin devri">
          <mvz-b2 no="I" başlık="Hazırlar arasında">
            <mvz-madde no="977" başlık="">
              <mvz-fıkra no="1">
                <template>Zilyetlik, şeyin veya şey üzerinde hâkimiyeti sağlayacak araçların, edinene teslimi veya edinenin önceki zilyedin rızasıyla şey üzerinde hâkimiyeti kullanacak duruma gelmesi hâlinde devredilmiş olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Hazır olmayanlar arasında">
            <mvz-madde no="978" başlık="">
              <mvz-fıkra no="1">
                <template>Temsilciye yapılan teslim, temsil edilene yapılmış gibi zilyetliği geçirir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Teslimsiz devir">
            <mvz-madde no="979" başlık="">
              <mvz-fıkra no="1">
                <template>Bir üçüncü kişi veya zilyetliği devreden, özel bir hukukî ilişkiye dayanarak zilyet olmakta devam ederse zilyetlik, teslim gerçekleşmeksizin kazanılmış olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zilyetliğin bu yolla devri, zilyet olmakta devam eden üçüncü kişiye karşı, ancak durumun devreden tarafından kendisine bildirildiği andan başlayarak hüküm doğurur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Üçüncü kişi, zilyetliği devredene karşı ileri sürebileceği sebeplerle şeyi edinene vermekten kaçınabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Emtiayı temsil eden senetlerin teslimi">
            <mvz-madde no="980" başlık="">
              <mvz-fıkra no="1">
                <template>Bir taşıyıcıya veya umumî mağazaya bırakılmış emtiayı temsil eden kıymetli evrakın teslimi, emtianın teslimi gibi sonuç doğurur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kıymetli evrakı iyiniyetle teslim alan kimse ile emtiayı iyiniyetle teslim alan kimse arasında uyuşmazlık çıkarsa emtiayı teslim alan tercih olunur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Zilyetliğin hükümleri">
          <mvz-b2 no="I" başlık="Korunması">
            <mvz-b3 no="1" başlık="Savunma hakkı">
              <mvz-madde no="981" başlık="">
                <mvz-fıkra no="1">
                  <template>Zilyet, her türlü gasp veya saldırıyı kuvvet kullanarak defedebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Zilyet, rızası dışında kendisinden alınan şeyi taşınmazlarda el koyanı kovarak, taşınırlarda ise eylem sırasında veya kaçarken yakalananın elinden alarak zilyetliğini koruyabilir. Ancak, zilyet durumun haklı göstermediği derecede kuvvet kullanmaktan kaçınmak zorundadır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Zilyetliğin gasbında dava hakkı">
              <mvz-madde no="982" başlık="">
                <mvz-fıkra no="1">
                  <template>Başkasının zilyet bulunduğu bir şeyi gasbeden kimse, o şey üzerinde üstün bir hakka sahip olduğunu iddia etse bile onu geri vermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Davalı, o şeyi davacıdan geri almasını gerektirecek üstün bir hakka sahip olduğunu derhâl ispat ederse onu geri vermekten kaçınabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Dava, şeyin geri verilmesine ve zararın giderilmesine yönelik olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Zilyetliğe saldırıya dava hakkı">
              <mvz-madde no="983" başlık="">
                <mvz-fıkra no="1">
                  <template>Saldırıda bulunan, şey üzerinde bir hak iddia etse bile; zilyetliği saldırıya uğrayan, ona karşı dava açabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Dava, saldırının sona erdirilmesine, sebebinin önlenmesine ve zararın giderilmesine yönelik olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Dava hakkının düşmesi">
              <mvz-madde no="984" başlık="">
                <mvz-fıkra no="1">
                  <template>Gasp ve saldırıdan dolayı dava hakkı, zilyedin fiili ve failini öğrenmesinden başlayarak iki ay ve her hâlde fiilin üzerinden bir yıl geçmekle düşer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Zilyetlik dolayısıyla hakkın korunması">
            <mvz-b3 no="1" başlık="Mülkiyet karinesi">
              <mvz-madde no="985" başlık="">
                <mvz-fıkra no="1">
                  <template>Taşınırın zilyedi onun maliki sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Önceki zilyetler de zilyetlikleri süresince o taşınırın maliki sayılırlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Fer'î zilyetlikte karine">
              <mvz-madde no="986" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir taşınıra malik olma iradesi bulunmaksızın zilyet olan kimse, taşınırı kendisinden iyiniyetle aldığı kişinin mülkiyet karinesine dayanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taşınıra bir sınırlı aynî hak veya kişisel hak iddiasıyla zilyet bulunan kimsenin iddia ettiği hakkın varlığı karine olarak kabul edilir. Ancak, zilyet bu karineyi şeyi kendisine vermiş olan kişiye karşı ileri süremez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Davaya karşı savunma">
              <mvz-madde no="987" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir taşınırın zilyedi, kendisine karşı açılan her davada üstün hakka sahip olduğu karinesine dayanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Gasp veya saldırıya ilişkin hükümler saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Tasarruf yetkisi ve taşınır davası">
              <mvz-b4 no="a" başlık="Emin sıfatıyla zilyetten edinme bakımından">
                <mvz-madde no="988" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir taşınırın emin sıfatıyla zilyedinden o şey üzerinde iyiniyetle mülkiyet veya sınırlı aynî hak edinen kimsenin edinimi, zilyedin bu tür tasarruflarda bulunma yetkisi olmasa bile korunur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Kaybedilen veya çalınan eşya bakımından">
                <mvz-madde no="989" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınırı çalınan, kaybolan ya da iradesi dışında başka herhangi bir şekilde elinden çıkan zilyet, o şeyi elinde bulunduran herkese karşı beş yıl içinde taşınır davası açabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu taşınır, açık artırmadan veya pazardan ya da benzeri eşya satanlardan iyiniyetle edinilmiş ise; iyiniyetli birinci ve sonraki edinenlere karşı taşınır davası, ancak ödenen bedelin geri verilmesi koşuluyla açılabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Diğer konularda iyiniyetli zilyedin haklarına ilişkin hükümler uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Para ve hamile yazılı senetlerde">
                <mvz-madde no="990" başlık="">
                  <mvz-fıkra no="1">
                    <template>Zilyet, iradesi dışında elinden çıkmış olsa bile, para ve hamile yazılı senetleri iyiniyetle edinmiş olan kimseye karşı taşınır davası açamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="İyiniyetli olmama hâlinde">
                <mvz-madde no="991" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir taşınırın zilyetliğini iyiniyetle edinmemiş olan kimseye karşı önceki zilyet, her zaman taşınır davası açabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Eğer önceki zilyet de, zilyetliği iyiniyetle edinmemiş ise sonraki zilyede karşı taşınır davası açamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Taşınmazlarda karine">
              <mvz-madde no="992" başlık="">
                <mvz-fıkra no="1">
                  <template>Tapuya kayıtlı taşınmazlarda, hak karinesinden ve zilyetlikten doğan dava açma hakkından yalnız adına tescil bulunan kimse yararlanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bununla birlikte taşınmaz üzerinde fiilî hâkimiyeti bulunan kimse, gasp veya saldırı sebebiyle dava açabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Sorumluluk">
            <mvz-b3 no="1" başlık="İyiniyetli zilyet bakımından">
              <mvz-b4 no="a" başlık="Yararlanma">
                <mvz-madde no="993" başlık="">
                  <mvz-fıkra no="1">
                    <template>İyiniyetle zilyedi bulunduğu şeyi, karineyle mevcut hakkına uygun şekilde kullanan veya ondan yararlanan zilyet, o şeyi geri vermekle yükümlü olduğu kimseye karşı bu yüzden herhangi bir tazminat ödemek zorunda değildir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İyiniyetli zilyet, şeyin kaybedilmesinden, yok olmasından veya hasara uğramasından sorumlu olmaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Tazminat">
                <mvz-madde no="994" başlık="">
                  <mvz-fıkra no="1">
                    <template>İyiniyetli zilyet, geri vermeyi isteyen kimseden şey için yapmış olduğu zorunlu ve yararlı giderleri tazmin etmesini isteyebilir ve bu tazminat ödeninceye kadar şeyi geri vermekten kaçınabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İyiniyetli zilyet, diğer giderler için tazminat isteyemez. Ancak, şeyin geri verilmesinden önce kendisine bu giderler için bir tazminat önerilmezse, kendisi tarafından o şeyle birleştirilen ve zararsızca ayrılması mümkün bulunan eklemeleri o şeyi geri vermeden önce ayırıp alabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Zilyedin elde ettiği ürünler, yaptığı giderler sebebiyle doğan alacaklarına mahsup edilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İyiniyetli olmayan zilyet bakımından">
              <mvz-madde no="995" başlık="">
                <mvz-fıkra no="1">
                  <template>İyiniyetli olmayan zilyet, geri vermekle yükümlü olduğu şeyi haksız alıkoymuş olması yüzünden hak sahibine verdiği zararlar ve elde ettiği veya elde etmeyi ihmal eylediği ürünler karşılığında tazminat ödemek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İyiniyetli olmayan zilyet, yaptığı giderlerden ancak hak sahibi için de zorunlu olanların tazmin edilmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İyiniyetli olmayan zilyet, şeyi kime geri vereceğini bilmediği sürece ancak kusuruyla verdiği zararlardan sorumlu olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Kazandırıcı zamanaşımından yararlanma">
            <mvz-madde no="996" başlık="">
              <mvz-fıkra no="1">
                <template>Kazandırıcı zamanaşımından yararlanma hakkına sahip olan zilyet, zilyetliği kendisine devreden aynı yetkiye sahip idiyse onun zilyetlik süresini kendi süresine ekleyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="TAPU SİCİLİ">
        <mvz-b1 no="A" başlık="Kurulması">
          <mvz-b2 no="I" başlık="Sicil bakımından">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="997" başlık="">
                <mvz-fıkra no="1">
                  <template>Taşınmazlar üzerindeki hakları göstermek üzere tapu sicili tutulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tapu sicili, tapu kütüğü ve kat mülkiyeti kütüğü ile bunları tamamlayan yevmiye defteri ve belgeler ile plânlardan oluşur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Sicilin örneği, nasıl tutulacağı ve yardımcı siciller Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Taşınmazların kaydedilmesi">
              <mvz-b4 no="a" başlık="Kaydedilecek taşınmazlar">
                <mvz-madde no="998" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tapu siciline taşınmaz olarak şunlar kaydedilir:</template>
                    <mvz-bent no="1.">
                      <template>Arazi,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Taşınmazlar üzerindeki bağımsız ve sürekli haklar,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Kat mülkiyetine konu olan bağımsız bölümler.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Arazinin tapu siciline kaydı, özel kanun hükümlerine tâbidir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bağımsız ve sürekli hakların kaydedilmesi için gerekli koşullar ve usul Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir. Süreklilik koşulunun gerçekleşmesi için hakkın süresiz veya en az otuz yıl süreli olması gerekir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Kat mülkiyetine konu olan bağımsız bölümlerin taşınmaz olarak kaydı, özel kanun hükümlerine tâbidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Kaydedilmeyecek taşınmazlar">
                <mvz-madde no="999" başlık="">
                  <mvz-fıkra no="1">
                    <template>Özel mülkiyete tâbi olmayan ve kamunun yararlanmasına ayrılan taşınmazlar, bunlara ilişkin tescili gerekli bir aynî hakkın kurulması söz konusu olmadıkça kütüğe kaydolunmaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tapuya kayıtlı bir taşınmaz, kayda tâbi olmayan bir taşınmaza dönüşürse, tapu sicilinden çıkarılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Sicilin unsurları">
              <mvz-b4 no="a" başlık="Tapu kütüğü">
                <mvz-madde no="1000" başlık="">
                  <mvz-fıkra no="1">
                    <template>Her taşınmaza kütükte bir sayfa ayrılır ve sayfa numaraları birbirini izler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bir taşınmazın bölünmesi veya birden çok taşınmazın birleştirilmesi hâlinde uyulacak usul Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Kütüğün her sayfasındaki özel sütunlara şunlar tescil edilir:</template>
                    <mvz-bent no="1.">
                      <template>Mülkiyet,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Taşınmaz üzerinde kurulmuş olan veya o taşınmaz lehine başka taşınmaz üzerinde kurulmuş bulunan irtifak hakları ile taşınmaz yükü,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Taşınmaz üzerindeki rehin hakları.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Eklentiler, malikin isteği üzerine beyanlar sütununa kaydedilir. Yapılan bu kayıt, ancak kütükte hak sahibi olarak görünenlerin rızasıyla kütükten silinebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="5">
                    <template>Aynı malike ait olan birden çok taşınmaz, sınırları birbirine bitişik olmasa bile, malikin istemiyle kütükte ortak bir sayfaya kaydedilebilir. Bu sayfaya yapılan rehin tescilleri, o sayfada kayıtlı bulunan bütün taşınmazları bağlar; aynı sayfada kayıtlı bu gibi taşınmazlardan bir kısmı malikin istemi üzerine veya mahkeme kararıyla o sayfadan çıkarılırsa, çıkarılan taşınmazlar üzerinde tescil edilmiş bulunan haklar saklı kalır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Kat mülkiyeti kütüğü">
                <mvz-madde no="1001" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kat mülkiyetine konu olan bağımsız bölümler, ayrıca tutulacak kat mülkiyeti kütüğüne yazılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Özel kanun hükümleri saklı kalmak üzere, kütükte yapılacak işlemler hakkında tapu kütüğüne ilişkin hükümler uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Yevmiye defteri ve belgeler">
                <mvz-madde no="1002" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tapu kütüğüne tescil istemleri, isteyenin kimliği ve istemin konusu belirtilerek istem sırasına göre derhâl yevmiye defterine yazılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu işlemlerin dayanağı olan belgeler, özenle sıraya konulur ve saklanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Plân">
                <mvz-madde no="1003" başlık="">
                  <mvz-fıkra no="1">
