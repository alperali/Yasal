                  <template>Ayırt etme gücüne sahip olmayanlar evlenemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Yasal temsilcinin izni">
              <mvz-b3 no="1" başlık="Küçükler hakkında">
                <mvz-madde no="126" başlık="">
                  <mvz-fıkra no="1">
                    <template>Küçük, yasal temsilcisinin izni olmadıkça evlenemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Kısıtlılar hakkında">
                <mvz-madde no="127" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kısıtlı, yasal temsilcisinin izni olmadıkça evlenemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Mahkemeye başvurma">
                <mvz-madde no="128" başlık="">
                  <mvz-fıkra no="1">
                    <template>Hâkim, haklı sebep olmaksızın evlenmeye izin vermeyen yasal temsilciyi dinledikten sonra, bu konuda başvuran küçük veya kısıtlının evlenmesine izin verebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Evlenme engelleri">
            <mvz-b2 no="I" başlık="Hısımlık">
              <mvz-madde no="129" başlık="">
                <mvz-fıkra no="1">
                  <template>Aşağıdaki kimseler arasında evlenme yasaktır:</template>
                  <mvz-bent no="1.">
                    <template>Üstsoy ile altsoy arasında; kardeşler arasında; amca, dayı, hala ve teyze ile yeğenleri arasında,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Kayın hısımlığı meydana getirmiş olan evlilik sona ermiş olsa bile, eşlerden biri ile diğerinin üstsoyu veya altsoyu arasında,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Evlât edinen ile evlâtlığın veya bunlardan biri ile diğerinin altsoyu ve eşi arasında.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Önceki evlilik">
              <mvz-b3 no="1" başlık="Sona erdiğinin ispatı">
                <mvz-b4 no="a" başlık="Genel olarak">
                  <mvz-madde no="130" başlık="">
                    <mvz-fıkra no="1">
                      <template>Yeniden evlenmek isteyen kimse, önceki evliliğinin sona ermiş olduğunu ispat etmek zorundadır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Gaiplik durumunda">
                  <mvz-madde no="131" başlık="">
                    <mvz-fıkra no="1">
                      <template>Gaipliğine karar verilen kişinin eşi, mahkemece evliliğin feshine karar verilmedikçe yeniden evlenemez.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Kaybolanın eşi evliliğin feshini, gaiplik başvurusuyla birlikte veya ayrıca açacağı bir dava ile isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Ayrı bir dava ile evliliğin feshi, davacının yerleşim yeri mahkemesinden istenir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Kadın için bekleme süresi">
                <mvz-madde no="132" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlilik sona ermişse, kadın, evliliğin sona ermesinden başlayarak üçyüz gün geçmedikçe evlenemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Doğurmakla süre biter.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Kadının önceki evliliğinden gebe olmadığının anlaşılması veya evliliği sona eren eşlerin yeniden birbiriyle evlenmek istemeleri hâllerinde mahkeme bu süreyi kaldırır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Akıl hastalığı">
              <mvz-madde no="133" başlık="">
                <mvz-fıkra no="1">
                  <template>Akıl hastaları, evlenmelerinde tıbbî sakınca bulunmadığı resmî sağlık kurulu raporuyla anlaşılmadıkça evlenemezler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="EVLENME BAŞVURUSU VE TÖRENİ">
          <mvz-b1 no="A" başlık="Başvuru">
            <mvz-b2 no="I" başlık="Başvuru makamı">
              <mvz-madde no="134" başlık="">
                <mvz-fıkra no="1">
                  <template>Birbiriyle evlenecek erkek ve kadın, içlerinden birinin oturduğu yer evlendirme memurluğuna birlikte başvururlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Evlendirme memuru, belediye bulunan yerlerde belediye başkanı veya bu işle görevlendireceği memur, köylerde muhtardır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Şekli">
              <mvz-madde no="135" başlık="">
                <mvz-fıkra no="1">
                  <template>Başvuru, evlenecekler tarafından yazılı veya sözlü olarak yapılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Belgeler">
              <mvz-madde no="136" başlık="">
                <mvz-fıkra no="1">
                  <template>Erkek ve kadından her biri, nüfus cüzdanı ve nüfus kayıt örneğini, önceki evliliği sona ermiş ise buna ilişkin belgeyi, küçük veya kısıtlı ise ayrıca yasal temsilcisinin imzası onaylanmış yazılı izin belgesini ve evlenmeye engel hastalığının bulunmadığını gösteren sağlık raporunu evlendirme memurluğuna vermek zorundadır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Başvurunun incelenmesi ve reddi">
              <mvz-madde no="137" başlık="">
                <mvz-fıkra no="1">
                  <template>Evlendirme memuru, evlenme başvurusunu ve buna eklenmesi gereken belgeleri inceler. Başvuruda bir noksanlık görürse bunu tamamlar veya tamamlattırır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Başvurunun usulüne uygun olarak yapılmadığı veya evleneceklerden birinin evlenmeye ehil olmadığı ya da evlenmeye yasal bir engel bulunduğu anlaşılırsa, evlenme başvurusu reddolunur ve durum evleneceklere yazıyla hemen bildirilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Redde itiraz ve yargılama usulü">
              <mvz-madde no="138" başlık="">
                <mvz-fıkra no="1">
                  <template>Evleneceklerden her biri evlendirme memurunun ret kararına karşı mahkemeye başvurabilir. İtiraz, evrak üzerinde incelenip kesin karara bağlanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ancak, mutlak butlan sebeplerinden birinin bulunduğuna ilişkin ret kararlarına karşı açılan davalar, basit yargılama usulüyle  görülür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Evlenme töreni ve tescil">
            <mvz-b2 no="I" başlık="Koşulları">
              <mvz-b3 no="1" başlık="Evlenme izni">
                <mvz-madde no="139" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlendirme memuru, evlenme koşullarının varlığını tespit ederse veya ret kararı mahkemece kaldırılırsa, evleneceklere evlenme gün ve saatini bildirir veya isterlerse evlenme izni belgesini verir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Evlenme izni belgesi, verildiği tarihten başlayarak altı ay içinde evleneceklere herhangi bir evlendirme memuru önünde evlenebilme hakkı sağlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Evlenmenin yapılamaması">
                <mvz-madde no="140" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlenme koşullarının bulunmadığının anlaşılması veya belgelerin verilmesinden başlayarak altı ayın geçmesi hâlinde, evlendirme memuru evlenme törenini yapamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Yapılışı">
              <mvz-b3 no="1" başlık="Tören yeri">
                <mvz-madde no="141" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlenme töreni, evlendirme dairesinde evlendirme memurunun ve ayırt etme gücüne sahip ergin iki tanığın önünde açık olarak yapılır. Ancak, tören evleneceklerin istemi üzerine evlendirme memurunun uygun bulacağı diğer yerlerde de yapılabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Törenin şekli">
                <mvz-madde no="142" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlendirme memuru, evleneceklerden her birine birbiriyle evlenmek isteyip istemediklerini sorar. Evlenme, tarafların olumlu sözlü cevaplarını verdikleri anda oluşur. Memur, evlenmenin tarafların karşılıklı rızası ile kanuna uygun olarak yapılmış olduğunu açıklar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Aile cüzdanı ve dinî tören">
                <mvz-madde no="143" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlenme töreni biter bitmez evlendirme memuru eşlere bir aile cüzdanı verir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Aile cüzdanı gösterilmeden evlenmenin dinî töreni yapılamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Evlenmenin geçerli olması dinî törenin yapılmasına bağlı değildir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Yönetmelik">
            <mvz-madde no="144" başlık="">
              <mvz-fıkra no="1">
                <template>Evlenme işlemi, evlenme kütüğü, evlenmeye ilişkin yazışma ve evlenme ile ilgili diğer konular yönetmelikle düzenlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="BATIL OLAN EVLENMELER">
          <mvz-b1 no="A" başlık="Mutlak butlan">
            <mvz-b2 no="I" başlık="Sebepleri">
              <mvz-madde no="145" başlık="">
                <mvz-fıkra no="1">
                  <template>Aşağıdaki hâllerde evlenme mutlak butlanla batıldır:</template>
                  <mvz-bent no="1.">
                    <template>Eşlerden birinin evlenme sırasında evli bulunması,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Eşlerden birinin evlenme sırasında sürekli bir sebeple ayırt etme gücünden yoksun bulunması,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Eşlerden birinde evlenmeye engel olacak derecede akıl hastalığı bulunması,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Eşler arasında evlenmeye engel olacak derecede hısımlığın bulunması.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Dava açma görevi ve hakkı">
              <mvz-madde no="146" başlık="">
                <mvz-fıkra no="1">
                  <template>Mutlak butlan davası, Cumhuriyet savcısı tarafından re'sen açılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu dava, ilgisi olan herkes tarafından da açılabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Dava hakkının sınırlanması veya kalkması">
              <mvz-madde no="147" başlık="">
                <mvz-fıkra no="1">
                  <template>Sona ermiş bir evliliğin mutlak butlanı Cumhuriyet savcısı tarafından re'sen dava edilemez; fakat her ilgili, mutlak butlanın karar altına alınmasını isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ayırt etme gücünün sonradan kazanılması veya akıl hastalığının iyileşmiş olması durumlarında mutlak butlan davasını yalnız ayırt etme gücünü sonradan kazanan veya akıl hastalığı iyileşen eş açabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Evliyken yeniden evlenen bir kimsenin önceki evliliği mutlak butlan kararı verilmeden önce sona ermişse ve ikinci evlenmede diğer eş iyiniyetli ise, bu evlenmenin butlanına karar verilemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Nisbî butlan">
            <mvz-b2 no="I" başlık="Eşlerin dava hakkı">
              <mvz-b3 no="1" başlık="Ayırt etme gücünden geçici yoksunluk">
                <mvz-madde no="148" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlenme sırasında geçici bir sebeple ayırt etme gücünden yoksun olan eş, evlenmenin iptalini dava edebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Yanılma">
                <mvz-madde no="149" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıdaki durumlarda eşlerden biri evlenmenin iptalini dava edebilir:</template>
                    <mvz-bent no="1.">
                      <template>Evlenmeyi hiç istemediği veya evlendiği kişiyle evlenmeyi düşünmediği hâlde yanılarak bu evlenmeye razı olmuşsa,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Eşinde bulunmaması onunla birlikte yaşamayı kendisi için çekilmez bir duruma sokacak derecede önemli bir nitelikte yanılarak evlenmişse.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Aldatma">
                <mvz-madde no="150" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıdaki durumlarda eşlerden biri evlenmenin iptalini dava edebilir:</template>
                    <mvz-bent no="a">
                      <template>1. Eşinin namus ve onuru hakkında doğrudan doğruya onun tarafından veya onun bilgisi altında bir başkası tarafından aldatılarak evlenmeye razı olmuşsa,</template>
                    </mvz-bent>
                    <mvz-bent no="b">
                      <template>2. Davacının veya altsoyunun sağlığı için ağır tehlike oluşturan bir hastalık kendisinden gizlenmişse.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Korkutma">
                <mvz-madde no="151" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kendisinin veya yakınlarından birinin hayatı, sağlığı veya namus ve onuruna yönelik pek yakın ve ağır bir tehlike ile korkutularak evlenmeye razı edilmiş eş, evlenmenin iptalini dava edebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="5" başlık="Hak düşürücü süre">
                <mvz-madde no="152" başlık="">
                  <mvz-fıkra no="1">
                    <template>İptal davası açma hakkı, iptal sebebinin öğrenildiği veya korkunun etkisinin ortadan kalktığı tarihten başlayarak altı ay ve her hâlde evlenmenin üzerinden beş yıl geçmekle düşer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Yasal temsilcinin dava hakkı">
              <mvz-madde no="153" başlık="">
                <mvz-fıkra no="1">
                  <template>Küçük veya kısıtlı, yasal temsilcisinin izni olmadan evlenirse, izni alınmayan yasal temsilci evlenmenin iptalini dava edebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu suretle evlenen kimse sonradan onsekiz yaşını doldurmak suretiyle ergin olur, kısıtlı olmaktan çıkar veya karı gebe kalırsa evlenmenin iptaline karar verilemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Butlanı gerektirmeyen sebepler">
            <mvz-b2 no="I" başlık="Bekleme süresine uymama">
              <mvz-madde no="154" başlık="">
                <mvz-fıkra no="1">
                  <template>Kadının bekleme süresi bitmeden evlenmesi, evlenmenin butlanını gerektirmez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Şekil kurallarına uymama">
              <mvz-madde no="155" başlık="">
                <mvz-fıkra no="1">
                  <template>Evlendirmeye yetkili memur önünde yapılmış olan bir evliliğin kanunun diğer şekil kurallarına uyulmaması sebebiyle butlanına karar verilemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Butlan kararı">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="156" başlık="">
                <mvz-fıkra no="1">
                  <template>Batıl bir evlilik ancak hâkimin kararıyla sona erer. Mutlak butlan hâlinde bile evlenme, hâkimin kararına kadar geçerli bir evliliğin bütün sonuçlarını doğurur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Sonuçları">
              <mvz-b3 no="1" başlık="Çocuklar yönünden">
                <mvz-madde no="157" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mahkemece butlanına karar verilen bir evlilikten doğan çocuklar, ana ve baba iyiniyetli olmasalar bile evlilik içinde doğmuş sayılırlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Çocuklar ile ana ve baba arasındaki ilişkilere boşanmaya ilişkin hükümler uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Eşler yönünden">
                <mvz-madde no="158" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlenmenin butlanına karar verilirse, evlenirken iyiniyetli bulunan eş bu evlenme ile kazanmış olduğu kişisel durumunu korur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Eşler arasındaki mal rejiminin tasfiyesi, tazminat, nafaka ve soyadı hakkında boşanmaya ilişkin hükümler uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Mirasçıların dava hakkı">
            <mvz-madde no="159" başlık="">
              <mvz-fıkra no="1">
                <template>Evlenmenin butlanını dava etme hakkı mirasçılara geçmez. Ancak, mirasçılar açılmış olan davayı sürdürebilirler. Dava sonucunda evlenme sırasında iyiniyetli olmadığı anlaşılan sağ kalan eş, yasal mirasçı olamayacağı gibi, daha önce yapılmış olan ölüme bağlı tasarruflarla kendisine sağlanan hakları da kaybeder.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="F" başlık="Yetki ve yargılama usulü">
            <mvz-madde no="160" başlık="">
              <mvz-fıkra no="1">
                <template>Evlenmenin butlanı davasında, yetki ve yargılama usulü bakımından boşanmaya ilişkin hükümler uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="BOŞANMA">
        <mvz-b1 no="A" başlık="Boşanma sebepleri">
          <mvz-b2 no="I" başlık="Zina">
            <mvz-madde no="161" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden biri zina ederse, diğer eş boşanma davası açabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Davaya hakkı olan eşin boşanma sebebini öğrenmesinden başlayarak altı ay ve her hâlde zina eyleminin üzerinden beş yıl geçmekle dava hakkı düşer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Affeden tarafın dava hakkı yoktur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Hayata kast, pek kötü veya onur kırıcı davranış">
            <mvz-madde no="162" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden her biri diğeri tarafından hayatına kastedilmesi veya kendisine pek kötü davranılması ya da ağır derecede onur kırıcı bir davranışta bulunulması sebebiyle boşanma davası açabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Davaya hakkı olan eşin boşanma sebebini öğrenmesinden başlayarak altı ay ve her hâlde bu sebebin doğumunun üzerinden beş yıl geçmekle dava hakkı düşer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Affeden tarafın dava hakkı yoktur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Suç işleme ve haysiyetsiz hayat sürme">
            <mvz-madde no="163" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden biri küçük düşürücü bir suç işler veya haysiyetsiz bir hayat sürer ve bu sebeplerden ötürü onunla birlikte yaşaması diğer eşten beklenemezse, bu eş her zaman boşanma davası açabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Terk">
            <mvz-madde no="164" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden biri, evlilik birliğinden doğan yükümlülüklerini yerine getirmemek maksadıyla diğerini terk ettiği veya haklı bir sebep olmadan ortak konuta dönmediği takdirde ayrılık, en az altı ay sürmüş ve bu durum devam etmekte ve istem üzerine hâkim veya noter tarafından yapılan ihtar sonuçsuz kalmış ise; terk edilen eş, boşanma davası açabilir. Diğerini ortak konutu terk etmeye zorlayan veya haklı bir sebep olmaksızın ortak konuta dönmesini engelleyen eş de terk etmiş sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Davaya hakkı olan eşin istemi üzerine hâkim veya noter, esası incelemeden yapacağı ihtarda terk eden eşe iki ay içinde ortak konuta dönmesi gerektiği ve dönmemesi hâlinde doğacak sonuçlar hakkında uyarıda bulunur. Bu ihtar gerektiğinde ilân yoluyla yapılır. Ancak, boşanma davası açmak için belirli sürenin dördüncü ayı bitmedikçe ihtar isteminde bulunulamaz ve ihtardan sonra iki ay geçmedikçe dava açılamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Akıl hastalığı">
            <mvz-madde no="165" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden biri akıl hastası olup da bu yüzden ortak hayat diğer eş için çekilmez hâle gelirse, hastalığın geçmesine olanak bulunmadığı resmî sağlık kurulu raporuyla tespit edilmek koşuluyla bu eş boşanma davası açabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="VI" başlık="Evlilik birliğinin sarsılması">
            <mvz-madde no="166" başlık="">
              <mvz-fıkra no="1">
                <template>Evlilik birliği, ortak hayatı sürdürmeleri kendilerinden beklenmeyecek derecede temelinden sarsılmış olursa, eşlerden her biri boşanma davası açabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yukarıdaki fıkrada belirtilen hâllerde, davacının kusuru daha ağır ise, davalının açılan davaya itiraz hakkı vardır. Bununla beraber bu itiraz, hakkın kötüye kullanılması niteliğinde ise ve evlilik birliğinin devamında davalı ve çocuklar bakımından korunmaya değer bir yarar kalmamışsa boşanmaya karar verilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Evlilik en az bir yıl sürmüş ise, eşlerin birlikte başvurması ya da bir eşin diğerinin davasını kabul etmesi hâlinde, evlilik birliği temelinden sarsılmış sayılır. Bu hâlde boşanma kararı verilebilmesi için, hâkimin tarafları bizzat dinleyerek iradelerinin serbestçe açıklandığına kanaat getirmesi ve boşanmanın malî sonuçları ile çocukların durumu hususunda taraflarca kabul edilecek düzenlemeyi uygun bulması şarttır. Hâkim, tarafların ve çocukların menfaatlerini göz önünde tutarak bu anlaşmada gerekli gördüğü değişiklikleri yapabilir. Bu değişikliklerin taraflarca da kabulü hâlinde boşanmaya hükmolunur. Bu hâlde tarafların ikrarlarının hâkimi bağlamayacağı hükmü uygulanmaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Boşanma sebeplerinden herhangi biriyle açılmış bulunan davanın reddine karar verilmesi ve bu kararın kesinleştiği tarihten başlayarak bir yıl geçmesi hâlinde, her ne sebeple olursa olsun ortak hayat yeniden kurulamamışsa evlilik birliği temelden sarsılmış sayılır ve eşlerden birinin istemi üzerine boşanmaya karar verilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Dava">
          <mvz-b2 no="I" başlık="Konusu">
            <mvz-madde no="167" başlık="">
              <mvz-fıkra no="1">
                <template>Boşanma davası açmaya hakkı olan eş, dilerse boşanma, dilerse ayrılık isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Yetki">
            <mvz-madde no="168" başlık="">
              <mvz-fıkra no="1">
                <template>Boşanma veya ayrılık davalarında yetkili mahkeme, eşlerden birinin yerleşim yeri veya davadan önce son defa altı aydan beri birlikte oturdukları yer mahkemesidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Geçici önlemler">
            <mvz-madde no="169" başlık="">
              <mvz-fıkra no="1">
                <template>Boşanma veya ayrılık davası açılınca hâkim, davanın devamı süresince gerekli olan, özellikle eşlerin barınmasına, geçimine, eşlerin mallarının yönetimine ve çocukların bakım ve korunmasına ilişkin geçici önlemleri re'sen alır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Karar">
          <mvz-b2 no="I" başlık="Boşanma veya ayrılık">
            <mvz-madde no="170" başlık="">
              <mvz-fıkra no="1">
                <template>Boşanma sebebi ispatlanmış olursa, hâkim boşanmaya veya ayrılığa karar verir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Dava yalnız ayrılığa ilişkinse, boşanmaya karar verilemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Dava boşanmaya ilişkinse, ancak ortak hayatın yeniden kurulması olasılığı bulunduğu takdirde ayrılığa karar verilebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Ayrılık süresi">
            <mvz-madde no="171" başlık="">
              <mvz-fıkra no="1">
                <template>Ayrılığa bir yıldan üç yıla kadar bir süre için karar verilebilir. Bu süre ayrılık kararının kesinleşmesiyle işlemeye başlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Ayrılık süresinin bitimi">
            <mvz-madde no="172" başlık="">
              <mvz-fıkra no="1">
                <template>Süre bitince ayrılık durumu kendiliğinden sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ortak hayat yeniden kurulmamışsa, eşlerden her biri boşanma davası açabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Boşanmanın sonuçları düzenlenirken ilk davada ispatlanmış olan olaylar ve ayrılık süresinde ortaya çıkan durumlar göz önünde tutulur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Boşanan kadının kişisel durumu">
            <mvz-madde no="173" başlık="">
              <mvz-fıkra no="1">
                <template>Boşanma hâlinde kadın, evlenme ile kazandığı kişisel durumunu korur; ancak, evlenmeden önceki soyadını yeniden alır. Eğer kadın evlenmeden önce dul idiyse hâkimden bekârlık soyadını taşımasına izin verilmesini isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kadının, boşandığı kocasının soyadını kullanmakta menfaati bulunduğu ve bunun kocaya bir zarar vermeyeceği ispatlanırsa, istemi üzerine hâkim, kocasının soyadını taşımasına izin verir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Koca, koşulların değişmesi hâlinde bu iznin kaldırılmasını isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Boşanmada tazminat ve nafaka">
            <mvz-b3 no="1" başlık="Maddî ve manevî tazminat">
              <mvz-madde no="174" başlık="">
                <mvz-fıkra no="1">
                  <template>Mevcut veya beklenen menfaatleri boşanma yüzünden zedelenen kusursuz veya daha az kusurlu taraf, kusurlu taraftan uygun bir maddî tazminat isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Boşanmaya sebep olan olaylar yüzünden kişilik hakkı saldırıya uğrayan taraf, kusurlu olan diğer taraftan manevî tazminat olarak uygun miktarda bir para ödenmesini isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yoksulluk nafakası">
              <mvz-madde no="175" başlık="">
                <mvz-fıkra no="1">
                  <template>Boşanma yüzünden yoksulluğa düşecek taraf, kusuru daha ağır olmamak koşuluyla geçimi için diğer taraftan malî gücü oranında süresiz olarak nafaka isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Nafaka yükümlüsünün kusuru aranmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Tazminat ve nafakanın ödenme biçimi">
              <mvz-madde no="176" başlık="">
                <mvz-fıkra no="1">
                  <template>Maddî tazminat ve yoksulluk nafakasının toptan veya durumun gereklerine göre irat biçiminde ödenmesine karar verilebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Manevî tazminatın irat biçiminde ödenmesine karar verilemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İrat biçiminde ödenmesine karar verilen maddî tazminat veya nafaka, alacaklı tarafın yeniden evlenmesi ya da taraflardan birinin ölümü hâlinde kendiliğinden kalkar; alacaklı tarafın evlenme olmaksızın fiilen evliymiş gibi yaşaması, yoksulluğunun ortadan kalkması ya da haysiyetsiz hayat sürmesi hâlinde mahkeme kararıyla kaldırılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Tarafların malî durumlarının değişmesi veya hakkaniyetin gerektirdiği hâllerde iradın artırılması veya azaltılmasına karar verilebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="5">
                  <template>Hâkim, istem hâlinde, irat biçiminde ödenmesine karar verilen maddî tazminat veya nafakanın gelecek yıllarda tarafların sosyal ve ekonomik durumlarına göre ne miktarda ödeneceğini karara bağlayabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Yetki">
              <mvz-madde no="177" başlık="">
                <mvz-fıkra no="1">
                  <template>Boşanmadan sonra açılacak nafaka davalarında, nafaka alacaklısının yerleşim yeri mahkemesi yetkilidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Zamanaşımı">
              <mvz-madde no="178" başlık="">
                <mvz-fıkra no="1">
                  <template>Evliliğin boşanma sebebiyle sona ermesinden doğan dava hakları, boşanma hükmünün kesinleşmesinin üzerinden bir yıl geçmekle zamanaşımına uğrar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="VI" başlık="Mal rejiminin tasfiyesi">
            <mvz-b3 no="1" başlık="Boşanma hâlinde">
              <mvz-madde no="179" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal rejiminin tasfiyesinde eşlerin bağlı olduğu rejime ilişkin hükümler uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Ayrılık hâlinde">
              <mvz-madde no="180" başlık="">
                <mvz-fıkra no="1">
                  <template>Ayrılığa karar verilirse mahkeme, ayrılığın süresine ve eşlerin durumlarına göre aralarında sözleşmeyle kabul edilmiş olan mal rejiminin kaldırılmasına karar verebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="VII" başlık="Miras hakları">
            <mvz-madde no="181" başlık="">
              <mvz-fıkra no="1">
                <template>Boşanan eşler, bu sıfatla birbirlerinin yasal mirasçısı olamazlar ve boşanmadan önce yapılmış olan ölüme bağlı tasarruflarla kendilerine sağlanan hakları, aksi tasarruftan anlaşılmadıkça, kaybederler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Boşanma davası devam ederken, ölen eşin mirasçılarından birisinin davaya devam etmesi ve diğer eşin kusurunun ispatlanması hâlinde de yukarıdaki fıkra hükmü uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="VIII" başlık="Çocuklar bakımından ana ve babanın hakları">
            <mvz-b3 no="1" başlık="Hâkimin takdir yetkisi">
              <mvz-madde no="182" başlık="">
                <mvz-fıkra no="1">
                  <template>Mahkeme boşanma veya ayrılığa karar verirken, olanak bulundukça ana ve babayı dinledikten ve çocuk vesayet altında ise vasinin ve vesayet makamının düşüncesini aldıktan sonra, ana ve babanın haklarını ve çocuk ile olan kişisel ilişkilerini düzenler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mahkeme, kararında kişisel ilişki düzenlemesinin gereklerinin yerine getirilmemesi hâlinde, çocuğun menfaatine aykırı olmamak kaydıyla velayetin değiştirilebileceğini ihtar eder.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Velâyetin kullanılması kendisine verilmeyen eşin çocuk ile kişisel ilişkisinin düzenlenmesinde, çocuğun özellikle sağlık, eğitim ve ahlâk bakımından yararları esas tutulur. Bu eş, çocuğun bakım ve eğitim giderlerine gücü oranında katılmak zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Hâkim, istem hâlinde irat biçiminde ödenmesine karar verilen bu giderlerin gelecek yıllarda tarafların sosyal ve ekonomik durumlarına göre ne miktarda ödeneceğini karara bağlayabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Durumun değişmesi">
              <mvz-madde no="183" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana veya babanın başkasıyla evlenmesi, başka bir yere gitmesi veya ölmesi gibi yeni olguların zorunlu kılması hâlinde hâkim, re'sen veya ana ve babadan birinin istemi üzerine gerekli önlemleri alır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Boşanmada yargılama usulü">
          <mvz-madde no="184" başlık="">
            <mvz-fıkra no="1">
              <template>Boşanmada yargılama, aşağıdaki kurallar saklı kalmak üzere Hukuk Usulü Muhakemeleri Kanununa tâbidir:</template>
              <mvz-bent no="1.">
                <template>Hâkim, boşanma veya ayrılık davasının dayandığı olguların varlığına vicdanen kanaat getirmedikçe, bunları ispatlanmış sayamaz.</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Hâkim, bu olgular hakkında gerek re'sen, gerek istem üzerine taraflara yemin öneremez.</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Tarafların bu konudaki her türlü ikrarları hâkimi bağlamaz.</template>
              </mvz-bent>
              <mvz-bent no="4.">
                <template>Hâkim, kanıtları serbestçe takdir eder.</template>
              </mvz-bent>
              <mvz-bent no="5.">
                <template>Boşanma veya ayrılığın fer'î sonuçlarına ilişkin anlaşmalar, hâkim tarafından onaylanmadıkça geçerli olmaz.</template>
              </mvz-bent>
              <mvz-bent no="6.">
                <template>Hâkim, taraflardan birinin istemi üzerine duruşmanın gizli yapılmasına karar verebilir.</template>
              </mvz-bent>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="EVLİLİĞİN GENEL HÜKÜMLERİ">
        <mvz-b1 no="A" başlık="Haklar ve yükümlülükler">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="185" başlık="">
              <mvz-fıkra no="1">
                <template>Evlenmeyle eşler arasında evlilik birliği kurulmuş olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eşler, bu birliğin mutluluğunu elbirliğiyle sağlamak ve çocukların bakımına, eğitim ve gözetimine beraberce özen göstermekle yükümlüdürler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Eşler birlikte yaşamak, birbirine sadık kalmak ve yardımcı olmak zorundadırlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Konutun seçimi, birliğin yönetimi ve giderlere katılma">
            <mvz-madde no="186" başlık="">
              <mvz-fıkra no="1">
                <template>Eşler oturacakları konutu birlikte seçerler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Birliği eşler beraberce yönetirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Eşler birliğin giderlerine güçleri oranında emek ve malvarlıkları ile katılırlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Kadının soyadı">
            <mvz-madde no="187" başlık="" durum="iptal">
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Birliğin temsili">
          <mvz-b2 no="I" başlık="Eşlerin temsil yetkisi">
            <mvz-madde no="188" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden her biri, ortak yaşamın devamı süresince ailenin sürekli ihtiyaçları için evlilik birliğini temsil eder.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ailenin diğer ihtiyaçları için eşlerden biri, birliği ancak aşağıdaki hâllerde temsil edebilir:</template>
                <mvz-bent no="1.">
                  <template>Diğer eş veya haklı sebeplerle hâkim tarafından yetkili kılınmışsa,</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Birliğin yararı bakımından gecikmede sakınca bulunur ve diğer eşin hastalığı, başka bir yerde olması veya benzeri sebeplerle rızası alınamazsa.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sorumluluk">
            <mvz-madde no="189" başlık="">
              <mvz-fıkra no="1">
                <template>Birliği temsil yetkisinin kullanıldığı hâllerde, eşler üçüncü kişilere karşı müteselsilen sorumlu olurlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eşlerden her biri, birliği temsil yetkisi bulunmaksızın yaptığı işlemlerden kişisel olarak sorumludur. Ancak, temsil yetkisinin üçüncü kişilerce anlaşılamayacak şekilde aşılması hâlinde eşler müteselsilen sorumludurlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Temsil yetkisinin kaldırılması veya sınırlanması">
            <mvz-madde no="190" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden biri birliği temsil yetkisini aşar veya bu yetkiyi kullanmada yetersiz kalırsa hâkim, diğer eşin istemi üzerine temsil yetkisini kaldırabilir veya sınırlayabilir. İstemde bulunan eş, temsil yetkisinin kaldırıldığını veya sınırlandığını, üçüncü kişilere sadece kişisel duyuru yoluyla bildirebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Temsil yetkisinin kaldırılmasının veya sınırlanmasının iyiniyetli üçüncü kişilere karşı sonuç doğurması, durumun hâkimin kararıyla ilân edilmesine bağlıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Temsil yetkisinin geri verilmesi">
            <mvz-madde no="191" başlık="">
              <mvz-fıkra no="1">
                <template>Temsil yetkisinin kaldırılmasına veya sınırlanmasına ilişkin karar, koşullar değiştiğinde eşlerden birinin istemi üzerine hâkim tarafından değiştirilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İlk karar ilân edilmiş ise, değişikliğe ilişkin karar da ilân olunur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Eşlerin meslek ve işi">
          <mvz-madde no="192" başlık="">
            <mvz-fıkra no="1">
              <template>Eşlerden her biri, meslek veya iş seçiminde diğerinin iznini almak zorunda değildir. Ancak, meslek ve iş seçiminde ve bunların yürütülmesinde evlilik birliğinin huzur ve yararı göz önünde tutulur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Eşlerin hukukî işlemleri">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="193" başlık="">
              <mvz-fıkra no="1">
                <template>Kanunda aksine hüküm bulunmadıkça, eşlerden her biri diğeri ve üçüncü kişilerle her türlü hukukî işlemi yapabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Aile konutu">
            <mvz-madde no="194" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden biri, diğer eşin açık rızası bulunmadıkça, aile konutu ile ilgili kira sözleşmesini feshedemez, aile konutunu devredemez veya aile konutu üzerindeki hakları sınırlayamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Rızayı sağlayamayan veya haklı bir sebep olmadan kendisine rıza verilmeyen eş, hâkimin müdahalesini isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Aile konutu olarak özgülenen taşınmaz malın maliki olmayan eş, tapu kütüğüne konutla ilgili gerekli şerhin verilmesini tapu müdürlüğünden isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Aile konutu eşlerden biri tarafından kira ile sağlanmışsa, sözleşmenin tarafı olmayan eş, kiralayana yapacağı bildirimle sözleşmenin tarafı hâline gelir ve bildirimde bulunan eş diğeri ile müteselsilen sorumlu olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Birliğin korunması">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="195" başlık="">
              <mvz-fıkra no="1">
                <template>Evlilik birliğinden doğan yükümlülüklerin yerine getirilmemesi veya evlilik birliğine ilişkin önemli bir konuda uyuşmazlığa düşülmesi hâlinde, eşler ayrı ayrı veya birlikte hâkimin müdahalesini isteyebilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hâkim, eşleri yükümlülükleri konusunda uyarır; onları uzlaştırmaya çalışır ve eşlerin ortak rızası ile uzman kişilerin yardımını isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Hâkim, gerektiği takdirde eşlerden birinin istemi üzerine kanunda öngörülen önlemleri alır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Eşler birlikte yaşarken">
            <mvz-madde no="196" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden birinin istemi üzerine hâkim, ailenin geçimi için her birinin yapacağı parasal katkıyı belirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eşin ev işlerini görmesi, çocuklara bakması, diğer eşin işinde karşılıksız çalışması, katkı miktarının belirlenmesinde dikkate alınır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bu katkılar, geçmiş bir yıl ve gelecek yıllar için istenebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Birlikte yaşamaya ara verilmesi">
            <mvz-madde no="197" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden biri, ortak hayat sebebiyle kişiliği, ekonomik güvenliği veya ailenin huzuru ciddî biçimde tehlikeye düştüğü sürece ayrı yaşama hakkına sahiptir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Birlikte yaşamaya ara verilmesi haklı bir sebebe dayanıyorsa hâkim, eşlerden birinin istemi üzerine birinin diğerine yapacağı parasal katkıya, konut ve ev eşyasından yararlanmaya ve eşlerin mallarının yönetimine ilişkin önlemleri alır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Eşlerden biri, haklı bir sebep olmaksızın diğerinin birlikte yaşamaktan kaçınması veya ortak hayatın başka bir sebeple olanaksız hâle gelmesi üzerine de yukarıdaki istemlerde bulunabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Eşlerin ergin olmayan çocukları varsa hâkim, ana ve baba ile çocuklar arasındaki ilişkileri düzenleyen hükümlere göre gereken önlemleri alır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Borçlulara ait önlemler">
            <mvz-madde no="198" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden biri, birliğin giderlerine katılma yükümlülüğünü yerine getirmezse, hâkim onun borçlularına, ödemeyi tamamen veya kısmen diğer eşe yapmalarını emredebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Tasarruf yetkisinin sınırlanması">
            <mvz-madde no="199" başlık="">
              <mvz-fıkra no="1">
                <template>Ailenin ekonomik varlığının korunması veya evlilik birliğinden doğan malî bir yükümlülüğün yerine getirilmesi gerektirdiği ölçüde, eşlerden birinin istemi üzerine hâkim, belirleyeceği malvarlığı değerleriyle ilgili tasarrufların ancak onun rızasıyla yapılabileceğine karar verebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hâkim bu durumda gerekli önlemleri alır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Hâkim, eşlerden birinin taşınmaz üzerinde tasarruf yetkisini kaldırırsa, re'sen durumun tapu kütüğüne şerhedilmesine karar verir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="VI" başlık="Durumun değişmesi">
            <mvz-madde no="200" başlık="">
              <mvz-fıkra no="1">
                <template>Koşullar değiştiğinde hâkim, eşlerden birinin istemi üzerine kararında gerekli değişikliği yapar veya sebebi sona ermişse alınan önlemi kaldırır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="VII" başlık="Yetki">
            <mvz-madde no="201" başlık="">
              <mvz-fıkra no="1">
                <template>Evlilik birliğinin korunmasına yönelik önlemler konusunda yetkili mahkeme eşlerden herhangi birinin yerleşim yeri mahkemesidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eşlerin yerleşim yerleri farklı ve her ikisi de önlem alınması isteminde bulunmuş ise, yetkili mahkeme ilk istemde bulunanın yerleşim yeri mahkemesidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Önlemlerin değiştirilmesi, tamamlanması veya kaldırılması konusunda yetkili mahkeme, önlem kararını veren mahkemedir. Ancak, her iki eşin de yerleşim yeri değişmişse, yetkili mahkeme eşlerden herhangi birinin yeni yerleşim yeri mahkemesidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="EŞLER ARASINDAKİ MAL REJİMİ">
        <mvz-ayırım no="1-BİRİNCİ" başlık="GENEL HÜKÜMLER">
          <mvz-b1 no="A" başlık="Yasal mal rejimi">
            <mvz-madde no="202" başlık="">
              <mvz-fıkra no="1">
                <template>Eşler arasında edinilmiş mallara katılma rejiminin uygulanması asıldır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eşler, mal rejimi sözleşmesiyle kanunda belirlenen diğer rejimlerden birini kabul edebilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Mal rejimi sözleşmesi">
            <mvz-b2 no="I" başlık="Sözleşmenin içeriği">
              <mvz-madde no="203" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal rejimi sözleşmesi, evlenmeden önce veya sonra yapılabilir. Taraflar, istedikleri mal rejimini ancak kanunda yazılı sınırlar içinde seçebilir, kaldırabilir veya değiştirebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Sözleşme ehliyeti">
              <mvz-madde no="204" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal rejimi sözleşmesi, ancak ayırt etme gücüne sahip olanlar tarafından yapılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Küçükler ile kısıtlılar, yasal temsilcilerinin rızasını almak zorundadırlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Sözleşmenin şekli">
              <mvz-madde no="205" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal rejimi sözleşmesi, noterde düzenleme veya onaylama şeklinde yapılır. Ancak, taraflar evlenme başvurusu sırasında hangi mal rejimini seçtiklerini yazılı olarak da bildirebilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mal rejimi sözleşmesinin taraflarca ve gerektiğinde yasal temsilcilerince imzalanması zorunludur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Olağanüstü mal rejimi">
            <mvz-b2 no="I" başlık="Eşlerden birinin istemi ile">
              <mvz-b3 no="1" başlık="Karar">
                <mvz-madde no="206" başlık="">
                  <mvz-fıkra no="1">
                    <template>Haklı bir sebep varsa hâkim, eşlerden birinin istemi üzerine, mevcut mal rejiminin mal ayrılığına dönüşmesine karar verebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Özellikle aşağıdaki hâllerde haklı bir sebebin varlığı kabul edilir:</template>
                    <mvz-bent no="1.">
                      <template>Diğer eşe ait malvarlığının borca batık veya ortaklıktaki payının haczedilmiş olması,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Diğer eşin, istemde bulunanın veya ortaklığın menfaatlerini tehlikeye düşürmüş olması,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Diğer eşin, ortaklığın malları üzerinde bir tasarruf işleminin yapılması için gereken rızasını haklı bir sebep olmadan esirgemesi,</template>
                    </mvz-bent>
                    <mvz-bent no="4.">
                      <template>Diğer eşin, istemde bulunan eşe malvarlığı, geliri, borçları veya ortaklık malları hakkında bilgi vermekten kaçınması,</template>
                    </mvz-bent>
                    <mvz-bent no="5.">
                      <template>Diğer eşin sürekli olarak ayırt etme gücünden yoksun olması.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Eşlerden biri ayırt etme gücünden sürekli olarak yoksun ise, onun yasal temsilcisi de bu sebebe dayanarak mal ayrılığına karar verilmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Yetki">
                <mvz-madde no="207" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yetkili mahkeme eşlerden herhangi birinin yerleşim yeri mahkemesidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Mal ayrılığına geçişten dönme">
                <mvz-madde no="208" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşler, her zaman yeni bir mal rejimi sözleşmesiyle önceki veya başka bir mal rejimini kabul edebilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Mal ayrılığına geçişi gerektiren sebebin ortadan kalkması hâlinde hâkim, eşlerden birinin istemi üzerine eski mal rejimine dönülmesine karar verebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Cebrî icra hâlinde">
              <mvz-b3 no="1" başlık="İflâsta">
                <mvz-madde no="209" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mal ortaklığını kabul etmiş olan eşlerden birinin iflâsına karar verildiği takdirde, ortaklık kendiliğinden mal ayrılığına dönüşür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Hacizde">
                <mvz-madde no="210" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mal ortaklığını kabul etmiş eşlerden birine karşı icra takibinde bulunan alacaklı, haczin uygulanmasında zarara uğrarsa, hâkimden mal ayrılığına karar verilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacaklının istemi her iki eşe yöneltilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Yetkili mahkeme, borçlunun yerleşim yeri mahkemesidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Eski rejime dönme">
                <mvz-madde no="211" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklı tatmin edildiği takdirde eşlerden birinin istemi üzerine hâkim, mal ortaklığının yeniden kurulmasına karar verebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Eşler, mal rejimi sözleşmesiyle edinilmiş mallara katılma rejimini kabul edebilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Önceki rejimin tasfiyesi">
              <mvz-madde no="212" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal ayrılığına geçildiği takdirde, kanunda aksine hüküm bulunmadıkça, eşler arasında önceki mal rejiminin tasfiyesi, bu rejime ilişkin hükümlere göre yapılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Alacaklıların korunması">
            <mvz-madde no="213" başlık="">
              <mvz-fıkra no="1">
                <template>Mal rejiminin kurulması, değiştirilmesi veya önceki rejimin tasfiyesi, eşlerden birinin veya ortaklığın alacaklılarının, üzerinden haklarını alabilecekleri malları sorumluluk dışında bırakamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kendisine böyle mallar geçmiş olan eş, borçlardan kişisel olarak sorumludur; ancak, söz konusu malların borcu ödemeye yetmediğini ispat ettiği takdirde, bu ölçüde kendisini sorumluluktan kurtarabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Mal rejiminin tasfiyesi davalarında yetki">
            <mvz-madde no="214" başlık="">
              <mvz-fıkra no="1">
                <template>Eşler veya mirasçılar arasında bir mal rejiminin tasfiyesine ilişkin davalarda, aşağıdaki mahkemeler yetkilidir:</template>
                <mvz-bent no="1.">
                  <template>Mal rejiminin ölümle sona ermesi durumunda ölenin son yerleşim yeri mahkemesi,</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Boşanmaya, evliliğin iptaline veya hâkim tarafından mal ayrılığına karar verilmesi durumunda, bu davalarda yetkili olan mahkeme,</template>
                </mvz-bent>
                <mvz-bent no="3.">
                  <template>Diğer durumlarda davalı eşin yerleşim yeri mahkemesi.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="F" başlık="Bir eşin mallarının diğeri tarafından yönetimi">
            <mvz-madde no="215" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden birinin açık veya örtülü olarak mallarının yönetimini diğer eşe bırakması hâlinde, aksi kararlaştırılmış olmadıkça vekâlet hükümleri uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="G" başlık="Envanter">
            <mvz-madde no="216" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden her biri, diğerinden her zaman mallarının envanterinin resmî senetle yapılmasını isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu envanter, malların getirilmesinden başlayarak bir yıl içinde yapılmışsa, aksi ispatlanmış olmadıkça bu envanterin doğru olduğu kabul edilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="H" başlık="Eşler arasındaki borçlar">
            <mvz-madde no="217" başlık="">
              <mvz-fıkra no="1">
                <template>Mal rejimi, eşler arasındaki borçların muaccel olmasını önlemez. Bununla beraber bir borcun yerine getirilmesi, borçlu eşi evlilik birliğini tehlikeye düşürecek derecede önemli güçlüklere sokacaksa, bu eş ödeme için süre isteyebilir. Durum ve koşullar gerektiriyorsa, hâkim istemde bulunan eşi güvence göstermekle yükümlü tutar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="EDİNİLMİŞ MALLARA KATILMA">
          <mvz-b1 no="A" başlık="Mülkiyet">
            <mvz-b2 no="I" başlık="Kapsamı">
              <mvz-madde no="218" başlık="">
                <mvz-fıkra no="1">
                  <template>Edinilmiş mallara katılma rejimi, edinilmiş mallar ile eşlerden her birinin kişisel mallarını kapsar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Edinilmiş mallar">
              <mvz-madde no="219" başlık="">
                <mvz-fıkra no="1">
                  <template>Edinilmiş mal, her eşin bu mal rejiminin devamı süresince karşılığını vererek elde ettiği malvarlığı değerleridir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bir eşin edinilmiş malları özellikle şunlardır:</template>
                  <mvz-bent no="1.">
                    <template>Çalışmasının karşılığı olan edinimler,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Sosyal güvenlik veya sosyal yardım kurum ve kuruluşlarının veya personele yardım amacı ile kurulan sandık ve benzerlerinin yaptığı ödemeler,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Çalışma gücünün kaybı nedeniyle ödenen tazminatlar,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Kişisel mallarının gelirleri,</template>
                  </mvz-bent>
                  <mvz-bent no="5.">
                    <template>Edinilmiş malların yerine geçen değerler.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Kişisel mallar">
              <mvz-b3 no="1" başlık="Kanuna göre">
                <mvz-madde no="220" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıda sayılanlar, kanun gereğince kişisel maldır:</template>
                    <mvz-bent no="1.">
                      <template>Eşlerden birinin yalnız kişisel kullanımına yarayan eşya,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Mal rejiminin başlangıcında eşlerden birine ait bulunan veya bir eşin sonradan miras yoluyla ya da herhangi bir şekilde karşılıksız kazanma yoluyla elde ettiği malvarlığı değerleri,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Manevî tazminat alacakları,</template>
                    </mvz-bent>
                    <mvz-bent no="4.">
                      <template>Kişisel mallar yerine geçen değerler.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Sözleşmeye göre">
                <mvz-madde no="221" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşler, mal rejimi sözleşmesiyle, bir mesleğin icrası veya işletmenin faaliyeti sebebiyle doğan edinilmiş mallara dahil olması gereken malvarlığı değerlerinin kişisel mal sayılacağını kabul edebilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Eşler, mal rejimi sözleşmesiyle kişisel malların gelirlerinin edinilmiş mallara dahil olmayacağını da kararlaştırabilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="İspat">
              <mvz-madde no="222" başlık="">
                <mvz-fıkra no="1">
                  <template>Belirli bir malın eşlerden birine ait olduğunu iddia eden kimse, iddiasını ispat etmekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Eşlerden hangisine ait olduğu ispat edilemeyen mallar onların paylı mülkiyetinde sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bir eşin bütün malları, aksi ispat edilinceye kadar edinilmiş mal kabul edilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Yönetim, yararlanma ve tasarruf">
            <mvz-madde no="223" başlık="">
              <mvz-fıkra no="1">
                <template>Her eş, yasal sınırlar içerisinde kişisel malları ile edinilmiş mallarını yönetme, bunlardan yararlanma ve bunlar üzerinde tasarrufta bulunma hakkına sahiptir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aksine anlaşma olmadıkça, eşlerden biri diğerinin rızası olmadan paylı mülkiyet konusu maldaki payı üzerinde tasarrufta bulunamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Üçüncü kişilere karşı sorumluluk">
            <mvz-madde no="224" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden her biri kendi borçlarından bütün malvarlığıyla sorumludur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Mal rejiminin sona ermesi ve tasfiye">
            <mvz-b2 no="I" başlık="Sona erme anı">
              <mvz-madde no="225" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal rejimi, eşlerden birinin ölümü veya başka bir mal rejiminin kabulüyle sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mahkemece evliliğin iptal veya boşanma sebebiyle sona erdirilmesine veya mal ayrılığına geçilmesine karar verilmesi hâllerinde, mal rejimi dava tarihinden geçerli olmak üzere sona erer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Malların geri alınması ve borçlar">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="226" başlık="">
                  <mvz-fıkra no="1">
                    <template>Her eş, diğer eşte bulunan mallarını geri alır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tasfiye sırasında, paylı mülkiyete konu bir mal varsa, eşlerden biri kanunda öngörülen diğer olanaklardan yararlanabileceği gibi, daha üstün bir yararı olduğunu ispat etmek ve diğerinin payını ödemek suretiyle o malın bölünmeden kendisine verilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Eşler karşılıklı borçları ile ilgili düzenleme yapabilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Değer artış payı">
                <mvz-madde no="227" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerden biri diğerine ait bir malın edinilmesine, iyileştirilmesine veya korunmasına hiç ya da uygun bir karşılık almaksızın katkıda bulunmuşsa, tasfiye sırasında bu malda ortaya çıkan değer artışı için katkısı oranında alacak hakkına sahip olur ve bu alacak o malın tasfiye sırasındaki değerine göre hesaplanır; bir değer kaybı söz konusu olduğunda katkının başlangıçtaki değeri esas alınır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Böyle bir malın daha önce elden çıkarılmış olması hâlinde hâkim, diğer eşe ödenecek alacağı hakkaniyete uygun olarak belirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Eşler, yazılı bir anlaşmayla değer artışından pay almaktan vazgeçebilecekleri gibi, pay oranını da değiştirebilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Eşlerin paylarının hesaplanması">
              <mvz-b3 no="1" başlık="Kişisel malların ve edinilmiş malların ayrılması">
                <mvz-madde no="228" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerin kişisel malları ile edinilmiş malları, mal rejiminin sona ermesi anındaki durumlarına göre ayrılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Eşlerden birine sosyal güvenlik veya sosyal yardım kurumlarınca yapılmış olan toptan ödemeler veya iş gücünün kaybı dolayısıyla ödenmiş olan tazminat, toptan ödeme veya tazminat yerine ilgili sosyal güvenlik veya sosyal yardım kurumunca uygulanan usule göre ömür boyunca irat bağlanmış olsaydı, mal rejiminin sona erdiği tarihte bundan sonraki döneme ait iradın peşin sermayeye çevrilmiş değeri ne olacak idiyse, tasfiyede o miktarda kişisel mal olarak hesaba katılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Eklenecek değerler">
                <mvz-madde no="229" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıda sayılanlar, edinilmiş mallara değer olarak eklenir:</template>
                    <mvz-bent no="1.">
                      <template>Eşlerden birinin mal rejiminin sona ermesinden önceki bir yıl içinde diğer eşin rızası olmadan, olağan hediyeler dışında yaptığı karşılıksız kazandırmalar,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Bir eşin mal rejiminin devamı süresince diğer eşin katılma alacağını azaltmak kastıyla yaptığı devirler.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu tür kazandırma veya devirlere ilişkin uyuşmazlıklarda mahkeme kararı, davanın kendisine ihbar edilmiş olması koşuluyla, kazandırma veya devirden yararlanan üçüncü kişilere karşı da ileri sürülebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Kişisel mallar ile edinilmiş mallar arasında denkleştirme">
                <mvz-madde no="230" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir eşin kişisel mallara ilişkin borçları edinilmiş mallardan veya edinilmiş mallara ilişkin borçları kişisel mallarından ödenmiş ise, tasfiye sırasında denkleştirme istenebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Her borç, ilişkin bulunduğu mal kesimini yükümlülük altına sokar. Hangi kesime ait olduğu anlaşılamayan borç, edinilmiş mallara ilişkin sayılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bir mal kesiminden diğer kesimdeki malın edinilmesine, iyileştirilmesine veya korunmasına katkıda bulunulmuşsa, değer artması veya azalması durumunda denkleştirme, katkı oranına ve malın tasfiye zamanındaki değerine veya mal daha önce elden çıkarılmışsa hakkaniyete göre yapılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Artık değer">
                <mvz-madde no="231" başlık="">
                  <mvz-fıkra no="1">
                    <template>Artık değer, eklenmeden ve denkleştirmeden elde edilen miktarlar da dahil olmak üzere her eşin edinilmiş mallarının toplam değerinden bu mallara ilişkin borçlar çıkarıldıktan sonra kalan miktardır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Değer eksilmesi göz önüne alınmaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Değerin belirlenmesi">
              <mvz-b3 no="1" başlık="Sürüm değeri">
                <mvz-madde no="232" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mal rejiminin tasfiyesinde malların sürüm değerleri esas alınır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Gelir değeri">
                <mvz-b4 no="a" başlık="Genel olarak">
                  <mvz-madde no="233" başlık="">
                    <mvz-fıkra no="1">
                      <template>Bir eşin malik olarak bizzat işletmeye devam ettiği veya sağ kalan eş ya da altsoyundan birinin kendisine bir bütün olarak özgülenmesini istemeye haklı olduğu bir tarımsal işletme için değer artışından alacağı pay ve katılma alacağı, bunların gelir değeri göz önünde tutularak hesaplanır.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Tarımsal işletmenin maliki veya mirasçıları, diğer eşe karşı ileri sürebilecekleri değer artışı payının veya katılma alacağının, işletmenin sadece sürüm değeri üzerinden hesaplanmasını isteyebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Değerlendirmeye ve işletmenin kazancından mirasçılara pay ödenmesine ilişkin miras hukuku hükümleri kıyas yoluyla uygulanır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Özel hâller">
                  <mvz-madde no="234" başlık="">
                    <mvz-fıkra no="1">
                      <template>Özel hâller gerektirdiği takdirde hesaplanan değer, uygun bir miktarda artırılabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Özellikle sağ kalan eşin geçim koşulları, tarımsal işletmenin alım değeri, ayrıca tarımsal işletme kendisine ait olan eşin yaptığı yatırımlar veya malî durumu özel hâllerden sayılır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Değerlendirme anı">
                <mvz-madde no="235" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mal rejiminin sona erdiği sırada mevcut olan edinilmiş mallar, tasfiye anındaki değerleriyle hesaba katılırlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Edinilmiş mallara hesapta eklenecek olanların değeri, malın devredildiği tarih esas alınarak hesaplanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Artık değere katılma">
              <mvz-b3 no="1" başlık="Kanuna göre">
                <mvz-madde no="236" başlık="">
                  <mvz-fıkra no="1">
                    <template>Her eş veya mirasçıları, diğer eşe ait artık değerin yarısı üzerinde hak sahibi olurlar. Alacaklar takas edilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Zina veya hayata kast nedeniyle boşanma hâlinde hâkim, kusurlu eşin artık değerdeki pay oranının hakkaniyete uygun olarak azaltılmasına veya kaldırılmasına karar verebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Sözleşmeye göre">
                <mvz-b4 no="a" başlık="Genel olarak">
                  <mvz-madde no="237" başlık="">
                    <mvz-fıkra no="1">
                      <template>Artık değere katılmada mal rejimi sözleşmesiyle başka bir esas kabul edilebilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bu tür anlaşmalar, eşlerin ortak olmayan çocuklarının ve onların altsoylarının saklı paylarını zedeleyemez.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="İptal, boşanma veya mahkeme kararıyla mal ayrılığında">
                  <mvz-madde no="238" başlık="">
                    <mvz-fıkra no="1">
                      <template>Mahkemece evliliğin iptal veya boşanma sebebiyle sona erdirilmesine veya mal ayrılığına geçilmesine karar verilmesi hâllerinde, kanundaki artık değere katılmaya ilişkin düzenlemeden farklı anlaşmalar, ancak mal rejimi sözleşmesinde bunun açıkça öngörülmüş olması hâlinde geçerlidir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Katılma alacağının ve değer artış payının ödenmesi">
              <mvz-b3 no="1" başlık="Ödeme ve ertelenmesi">
                <mvz-madde no="239" başlık="">
                  <mvz-fıkra no="1">
