                    <template>Bir taşınmazın kütüğe kaydı ve belirlenmesinde resmî bir ölçüme dayanan plân esas alınır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Plânların nasıl hazırlanacağı Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Tapu sicilinin tutulması">
            <mvz-b3 no="1" başlık="Bir bölgede">
              <mvz-madde no="1004" başlık="">
                <mvz-fıkra no="1">
                  <template>Taşınmazlar, bulundukları bölgenin tapu siciline kaydedilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Birden çok bölgede">
              <mvz-madde no="1005" başlık="">
                <mvz-fıkra no="1">
                  <template>Birden çok bölgede bulunan taşınmaz, diğer bölge sicillerine kayıtlı olduğu belirtilmek suretiyle her bölgedeki sicile ayrı ayrı kaydedilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Böyle bir taşınmaza ilişkin tescil istemleri ve tescil işlemleri taşınmazın büyük kısmının bulunduğu bölgede yapılır ve yapılan tescil kütüğe işlenmek üzere diğer bölgelerdeki tapu idarelerine bildirilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Tapu idareleri">
            <mvz-b3 no="1" başlık="Kuruluş">
              <mvz-madde no="1006" başlık="">
                <mvz-fıkra no="1">
                  <template>Tapu idarelerinin kuruluş, işleyiş ve hizmetlerinin yürütülmesi, özel kanun hükümlerine tâbidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Sorumluluk">
              <mvz-madde no="1007" başlık="">
                <mvz-fıkra no="1">
                  <template>Tapu sicilinin tutulmasından doğan bütün zararlardan Devlet sorumludur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Devlet, zararın doğmasında kusuru bulunan görevlilere rücu eder.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Devletin sorumluluğuna ilişkin davalar, tapu sicilinin bulunduğu yer mahkemesinde görülür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="İşlemler">
          <mvz-b2 no="I" başlık="İşlemlerin konusu">
            <mvz-b3 no="1" başlık="Tescil">
              <mvz-madde no="1008" başlık="">
                <mvz-fıkra no="1">
                  <template>Taşınmaza ilişkin aşağıdaki haklar, tapu kütüğüne tescil edilir:</template>
                  <mvz-bent no="1.">
                    <template>Mülkiyet,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>İrtifak hakları ve taşınmaz yükleri,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Rehin hakları.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Şerhler">
              <mvz-b4 no="a" başlık="Kişisel haklarda">
                <mvz-madde no="1009" başlık="">
                  <mvz-fıkra no="1">
                    <template>Arsa payı karşılığı inşaat, taşınmaz satış vaadi, kira, alım, önalım, gerialım sözleşmelerinden doğan haklar ile şerhedilebileceği kanunlarda açıkça öngörülen diğer haklar tapu kütüğüne şerhedilebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bunlar şerh verilmekle o taşınmaz üzerinde sonradan kazanılan hakların sahiplerine karşı ileri sürülebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Tasarruf yetkisinin kısıtlanmasında">
                <mvz-madde no="1010" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıdaki sebeplere dayanan tasarruf yetkisi kısıtlamaları, tapu kütüğüne şerh verilebilir:</template>
                    <mvz-bent no="1.">
                      <template>Çekişmeli hakların korunmasına ilişkin mahkeme kararları,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Haciz, iflâs kararı veya konkordato ile verilen süre,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Aile yurdu kurulması, artmirasçı atanması gibi şerh verilmesi kanunen öngörülen işlemler.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tasarruf yetkisi kısıtlamaları, şerh verilmekle taşınmaz üzerinde sonradan kazanılan hakların sahiplerine karşı ileri sürülebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Geçici tescil şerhi">
                <mvz-madde no="1011" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıdaki hâllerde geçici tescil şerhi verilebilir:</template>
                    <mvz-bent no="1.">
                      <template>İddia edilen bir aynî hakkın güvence altına alınması gerekiyorsa,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Tasarruf yetkisini belirleyen belgelerdeki noksanlıkların sonradan tamamlanmasına kanun olanak tanıyorsa.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Geçici tescil şerhi, bütün ilgililerin razı olmasına veya hâkimin karar vermesine bağlıdır. Şerhin konusu olan hak sonradan gerçekleşirse, şerh tarihinden başlayarak üçüncü kişilere karşı ileri sürülebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Geçici tescil şerhi verilmesi istemi üzerine hâkim, tarafları dinleyerek veya dosya üzerinde inceleme yaparak şerhe konu olan hakkın varlığının kabul edilebileceği kanaatına varırsa, şerh kararı verir. Kararda şerhin etki bakımından süresi ve içeriği belirlenir; gerektiğinde mahkemeye başvurulması için bir süre verilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Beyanlar">
              <mvz-madde no="1012" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir taşınmazın eklentileri, malikin istemi üzerine kütükteki beyanlar sütununa yazılır. Bu kaydın terkini, kütükte hak sahibi görünen bütün ilgililerin rızasına bağlıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taşınmaz mülkiyetine ilişkin kamu hukuku kısıtlamalarının beyanlar sütununa yazılması ve bu sütuna yazılabilecek diğer hususlar Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Özel kanun hükümleri saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Tescilin ve terkinin koşulları">
            <mvz-b3 no="1" başlık="İstem">
              <mvz-b4 no="a" başlık="Tescil için">
                <mvz-madde no="1013" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tescil, tasarrufa konu olan taşınmaz malikinin yazılı beyanı üzerine yapılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Edinen kimse, kanun hükmüne, kesinleşmiş mahkeme kararına veya buna eşdeğer bir belgeye dayanıyorsa, bu beyana gerek yoktur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bir aynî hakkı tescilden önce kazanan kimse, gerekli belgeleri ibraz ederek tescili isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Terkin ve değişiklik için">
                <mvz-madde no="1014" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir tescilin terkin edilmesi veya değiştirilmesi, ancak bu kaydın kendilerine hak sağladığı kimselerin yazılı beyanı üzerine yapılabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yetkinin ve sebebin belirlenmesi">
              <mvz-madde no="1015" başlık="">
                <mvz-fıkra no="1">
                  <template>Tescil, terkin ve değişiklik gibi tasarruf işlemlerinin yapılabilmesi, istemde bulunanın, tasarruf yetkisini ve hukukî sebebi belgelemiş olmasına bağlıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İstemde bulunan kimse, kendisinin, sicilde hak sahibi görünen kişi veya bu kişinin temsilcisi olduğunu ispat etmek suretiyle tasarruf yetkisini belgelemiş olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Hukukî sebebin belgelenmesi, bu sebebin geçerliliği için gerekli şekle uyulduğunun ispatı suretiyle olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Belgelerin tamamlanması">
              <mvz-madde no="1016" başlık="">
                <mvz-fıkra no="1">
                  <template>Tasarruf yetkisine ve hukukî sebebe ilişkin belgeler tamam değilse istem reddedilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bununla birlikte, hukukî sebebe ilişkin belgeler tamam olmasına rağmen, tasarruf yetkisini belirten belgenin tamamlanması gereken hâllerde, malikin rızası veya hâkimin kararıyla geçici tescil şerhi verilebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Tescilin biçimi">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="1017" başlık="">
                <mvz-fıkra no="1">
                  <template>Kütüğe tesciller, istem tarihine ve sırasına göre yapılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Sicildeki kaydın bir örneği isteyen ilgiliye verilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Tescil ve terkin ile verilecek örneklerin şekli Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Taşınmaz lehine irtifaklarda">
              <mvz-madde no="1018" başlık="">
                <mvz-fıkra no="1">
                  <template>Taşınmaz lehine irtifakların tescil ve terkini hem yüklü, hem yararlanan taşınmazların sayfalarına kaydedilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Tebliğ zorunluluğu">
            <mvz-madde no="1019" başlık="">
              <mvz-fıkra no="1">
                <template>Tapu memuru, ilgililerin bilgisi dışında yaptığı işlemleri onlara tebliğ etmekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İlgililerin bu işlemlere karşı itiraz süresi, kendilerine yapılan tebliğ tarihinden işlemeye başlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Tapu sicilinin açıklığı">
          <mvz-madde no="1020" başlık="">
            <mvz-fıkra no="1">
              <template>Tapu sicili herkese açıktır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İlgisini inanılır kılan herkes, tapu kütüğündeki ilgili sayfanın ve belgelerin tapu memuru önünde kendisine gösterilmesini veya bunların örneklerinin verilmesini isteyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Tescilin etkileri">
          <mvz-b2 no="I" başlık="Tescilin yapılmamasının sonuçları">
            <mvz-madde no="1021" başlık="">
              <mvz-fıkra no="1">
                <template>Kurulması kanunen tescile tâbi aynî haklar, tescil edilmedikçe varlık kazanamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Tescilin sonuçları">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="1022" başlık="">
                <mvz-fıkra no="1">
                  <template>Aynî haklar, kütüğe tescil ile doğar; sıralarını ve tarihlerini tescile göre alır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tescilin etkisi, kanunen öngörülen belgeler isteme eklenmiş veya geçici tescil hâlinde belgelerin uygun zamanda tamamlanmış olması koşuluyla yevmiye defterine yapılan kayıt tarihinden başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bir hakkın içeriği, tescilin sınırları içinde, dayandığı belgelere göre veya diğer herhangi bir yolla belirlenir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İyiniyetli üçüncü kişilere karşı">
              <mvz-madde no="1023" başlık="">
                <mvz-fıkra no="1">
                  <template>Tapu kütüğündeki tescile iyiniyetle dayanarak mülkiyet veya bir başka aynî hak kazanan üçüncü kişinin bu kazanımı korunur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="İyiniyetli olmayan üçüncü kişilere karşı">
              <mvz-madde no="1024" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir aynî hak yolsuz olarak tescil edilmiş ise, bunu bilen veya bilmesi gereken üçüncü kişi bu tescile dayanamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bağlayıcı olmayan bir hukukî işleme dayanan veya hukukî sebepten yoksun bulunan tescil yolsuzdur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Böyle bir tescil yüzünden aynî hakkı zedelenen kimse, tescilin yolsuz olduğunu iyiniyetli olmayan üçüncü kişilere karşı doğrudan doğruya ileri sürebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Terkin ve değiştirme">
          <mvz-b2 no="I" başlık="Yolsuz tescilde">
            <mvz-madde no="1025" başlık="">
              <mvz-fıkra no="1">
                <template>Bir aynî hak yolsuz olarak tescil edilmiş veya bir tescil yolsuz olarak terkin olunmuş ya da değiştirilmiş ise, bu yüzden aynî hakkı zedelenen kimse tapu sicilinin düzeltilmesini dava edebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İyiniyetli üçüncü kişilerin bu tescile dayanarak kazandıkları aynî haklar ve her türlü tazminat istemi saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Aynî hakların sona ermesi">
            <mvz-madde no="1026" başlık="">
              <mvz-fıkra no="1">
                <template>Bir aynî hakkın sona ermesiyle tescil her türlü hukukî değerini kaybettiği takdirde, yüklü taşınmaz maliki, terkini isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Tapu memuru bu istemi yerine getirirse, her ilgili, bu işlemin kendisine tebliği tarihinden başlayarak otuz gün içinde terkine karşı dava açabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Tapu memuru, re'sen hâkime başvurarak aynî hakkın sona erdiğinin belirlenmesine ilişkin karar verilmesini istemeye ve hâkimin vereceği karara dayanarak terkin işlemini yapmaya yetkilidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Düzeltme">
            <mvz-madde no="1027" başlık="">
              <mvz-fıkra no="1">
                <template>İlgililerin yazılı rızaları olmadıkça, tapu memuru, tapu sicilindeki yanlışlığı ancak mahkeme kararıyla düzeltebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Düzeltme, eski tescilin terkini ve yeni bir tescilin yapılması biçiminde de olabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Tapu memuru, basit yazı yanlışlıklarını, Cumhurbaşkanınca çıkarılan yönetmelik uyarınca re'sen düzeltir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-bölüm>
    </mvz-kısım>
