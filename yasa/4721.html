                    <template>Saklı paylarının karşılığını alamayan mirasçılar, mirasbırakanın tasarruf edebileceği kısmı aşan tasarruflarının tenkisini dava edebilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Yasal mirasçıların paylarına ilişkin olarak tasarrufta yer alan kurallar, mirasbırakanın arzusunun başka türlü olduğu tasarruftan anlaşılmadıkça, sadece paylaştırma kuralları sayılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Saklı paylı mirasçılar lehine kazandırmalar">
                <mvz-madde no="561" başlık="">
                  <mvz-fıkra no="1">
                    <template>Saklı pay sahibi mirasçılara ölüme bağlı tasarrufla yapılan ve tasarruf edilebilir kısmı aşan kazandırmaların onların saklı paylarını aşan kısmı orantılı olarak tenkise tâbi olur. Tenkise tâbi birden fazla ölüme bağlı tasarrufun bulunması hâlinde, saklı pay sahibi mirasçıya yapılan kazandırmanın saklı payı aşan kısmı ile saklı pay sahibi olmayan kimselere yapılan kazandırmalar orantılı olarak tenkis edilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Mirasçının alacaklılarının hakları">
                <mvz-madde no="562" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakan, tasarruf edebileceği kısmı aştığında, saklı payı zedelenen mirasçı, iflâsı hâlinde iflâs dairesinin veya mirasın geçtiği tarihte kendisine karşı ellerinde ödemeden aciz belgesi bulunan alacaklıların ihtarına rağmen tenkis davası açmazsa, iflâs idaresi veya bu alacaklılar, alacaklarının elde edilmesi için gerekli olan oranda ve mirasçıya tanınan süre içinde tenkis davası açabilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Mirasçılıktan çıkarılanın çıkarma tasarrufuna itiraz etmemesi durumunda da iflâs idaresi veya alacaklılar, aynı koşullarla tenkis davası açabilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Hükümleri">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="563" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tenkis, mirasbırakanın arzusunun başka türlü olduğu tasarruftan anlaşılmadıkça, mirasçı atanması yoluyla veya diğer bir ölüme bağlı tasarrufla elde edilen kazandırmaların tamamında, orantılı olarak yapılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ölüme bağlı tasarrufla kazandırma elde eden kimse, bazı vasiyetleri yerine getirmekle yükümlü kılınmışsa, kazandırmanın tenkise tâbi tutulması hâlinde, bu kimse mirasbırakanın arzusunun başka türlü olduğu tasarruftan anlaşılmadıkça vasiyet borçlarının da aynı oranda tenkis edilmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Bölünmez mal vasiyetinde">
                <mvz-madde no="564" başlık="">
                  <mvz-fıkra no="1">
                    <template>Değerinde azalma meydana gelmeksizin bölünmesine olanak bulunmayan belirli bir mal vasiyeti tenkise tâbi olursa, vasiyet alacaklısı, dilerse tenkisi gereken kısmın değerini ödeyerek malın verilmesini, dilerse tasarruf edilebilir kısmın değerini karşılayan parayı isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tasarruf konusu malın vasiyet alacaklısında kalması durumunda, malın tenkis sebebiyle vasiyet borçlusuna verilmesi gereken, aksi hâlde tasarruf oranı içinde kalan kısmının karar günündeki değerinin para olarak ödetilmesine karar verilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bu kurallar, sağlararası kazandırmaların tenkisinde de uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Sağlararası kazandırmalar">
                <mvz-b4 no="a" başlık="Tenkise tâbi kazandırmalar">
                  <mvz-madde no="565" başlık="">
                    <mvz-fıkra no="1">
                      <template>Aşağıdaki karşılıksız kazandırmalar, ölüme bağlı tasarruflar gibi tenkise tâbidir:</template>
                      <mvz-bent no="1.">
                        <template>Mirasbırakanın, mirasçılık sıfatını kaybeden yasal mirasçıya miras payına mahsuben yapmış olduğu sağlararası kazandırmalar, geri verilmemek kaydıyla altsoyuna malvarlığı devri veya borçtan kurtarma yoluyla yaptığı kazandırmalar ya da alışılmışın dışında verilen çeyiz ve kuruluş sermayesi,</template>
                      </mvz-bent>
                      <mvz-bent no="2.">
                        <template>Miras haklarının ölümden önce tasfiyesi maksadıyla yapılan kazandırmalar,</template>
                      </mvz-bent>
                      <mvz-bent no="3.">
                        <template>Mirasbırakanın serbestçe dönme hakkını saklı tutarak yaptığı bağışlamalar ve ölümünden önceki bir yıl içinde âdet üzere verilen hediyeler dışında yapmış olduğu bağışlamalar,</template>
                      </mvz-bent>
                      <mvz-bent no="4.">
                        <template>Mirasbırakanın saklı pay kurallarını etkisiz kılmak amacıyla yaptığı açık olan kazandırmalar.</template>
                      </mvz-bent>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Geri verme borcu">
                  <mvz-madde no="566" başlık="">
                    <mvz-fıkra no="1">
                      <template>Kendisine tenkise tâbi bir kazandırma yapılmış olan kimse iyiniyetli ise, sadece mirasın geçmesi anında kazandırmadan elinde kalanı geri vermekle yükümlüdür; iyiniyetli değilse, iyiniyetli olmayan zilyedin geri verme borcuna ilişkin hükümlere göre sorumlu olur.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Miras sözleşmesiyle elde ettiği kazandırma tenkise tâbi tutulan kimse, bu kazandırma için mirasbırakana verdiği karşılığın tenkis oranında geri verilmesini isteyebilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Hayat sigortalarında">
                <mvz-madde no="567" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakanın kendi ölümünde ödenmek üzere üçüncü kişi lehine hayat sigortası yaptığı veya böyle bir kişiyi lehdar olarak sonra belirlediği ya da sigortacıya karşı olan istem hakkını sağlararası veya ölüme bağlı tasarrufla karşılıksız olarak üçüncü kişiye devrettiği hâllerde, sigorta alacağının mirasbırakanın ölümü zamanındaki satınalma değeri tenkise tâbi olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="5" başlık="İntifa hakkı veya irat bakımından">
                <mvz-madde no="568" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakan, tahmin edilen devam sürelerine göre sermayeye çevrilmeleri hâlinde tasarruf edilebilir kısmı aşan intifa hakkı veya irat borcu ile terekesini yükümlü kılarsa, mirasçıları, intifa hakkının veya irat borcunun tenkisini ya da tasarruf edilebilir kısmı vererek bu yükümlülüğün kaldırılmasını isteyebilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="6" başlık="Artmirasçı bakımından">
                <mvz-madde no="569" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirası artmirasçıya geçirme yükümlülüğü ile saklı payı zedelenen mirasçı, aşan kısmın tenkisini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Tenkiste sıra">
              <mvz-madde no="570" başlık="">
                <mvz-fıkra no="1">
                  <template>Tenkis, saklı pay tamamlanıncaya kadar, önce ölüme bağlı tasarruflardan; bu yetmezse, en yeni tarihlisinden en eskisine doğru geriye gidilmek üzere sağlararası kazandırmalardan yapılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kamu tüzel kişileri ile kamuya yararlı dernek ve vakıflara yapılan ölüme bağlı tasarruflar ve sağlararası kazandırmalar en son sırada tenkis edilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Hak düşürücü süreler">
              <mvz-madde no="571" başlık="">
                <mvz-fıkra no="1">
                  <template>Tenkis davası açma hakkı, mirasçıların saklı paylarının zedelendiğini öğrendikleri tarihten başlayarak bir yıl ve her hâlde vasiyetnamelerde açılma tarihinin, diğer tasarruflarda mirasın açılması tarihinin üzerinden on yıl geçmekle düşer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bir tasarrufun iptali bir öncekinin yürürlüğe girmesini sağlarsa, süreler iptal kararının kesinleşmesi tarihinde işlemeye başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Tenkis iddiası, def'i yoluyla her zaman ileri sürülebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="7-YEDİNCİ" başlık="MİRAS SÖZLEŞMESİNDEN DOĞAN DAVALAR">
          <mvz-b1 no="A" başlık="Mirasbırakanın sağlığında mallarını vermesi durumunda">
            <mvz-madde no="572" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakan, sağlığında bütün malvarlığını miras sözleşmesiyle atadığı mirasçıya devretmişse, bu mirasçı resmî defter düzenlenmesini isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Mirasbırakan, malvarlığının tamamını devretmemişse veya tamamını devrettikten sonra yeni mallar edinmişse; miras sözleşmesi, aksine bir kural içermedikçe, yalnız sağlıkta devredilmiş olan malları kapsar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Mirasbırakanın sağlığında malvarlığını devretmesi hâlinde, miras sözleşmesinde başka türlü bir kural yoksa, miras sözleşmesinden doğan hak ve borçlar atanmış mirasçının mirasçılarına geçer.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Mirastan feragat durumunda">
            <mvz-b2 no="I" başlık="Tenkis">
              <mvz-madde no="573" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakan, mirastan feragat eden mirasçıya, sağlığında terekenin tasarruf edilebilir kısmını aşan edimlerde bulunmuşsa; diğer mirasçılar bunun tenkisini isteyebilirler. Bu durumda, mirastan feragat edenin sadece saklı payını aşan miktar tenkise tâbi olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Edimlerin değerlerinin mahsubu, mirasta denkleştirme kurallarına göre yapılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Geri verme">
              <mvz-madde no="574" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirastan feragat eden, tenkis sebebiyle terekeye bir malı veya diğer bir değeri geri vermekle yükümlü olursa; dilerse tenkise tâbi değeri geri verir, dilerse almış olduklarının tamamını terekeye geri vererek mirastan feragat etmemiş gibi paylaşmaya katılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="MİRASIN GEÇMESİ">
      <mvz-bölüm no="1-BİRİNCİ" başlık="MİRASIN AÇILMASI">
        <mvz-b1 no="A" başlık="Açılma ve değerlendirme anı">
          <mvz-madde no="575" başlık="">
            <mvz-fıkra no="1">
              <template>Miras, mirasbırakanın ölümüyle açılır. Mirasbırakanın sağlığında yapmış olduğu mirasla ilgili kazandırmalar ve paylaştırmalar, terekenin ölüm anındaki durumuna göre değerlendirilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Açılma yeri ve yetkili mahkeme">
          <mvz-madde no="576" başlık="">
            <mvz-fıkra no="1">
              <template>Miras, malvarlığının tamamı için mirasbırakanın yerleşim yerinde açılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Mirasbırakanın tasarruflarının iptali veya tenkisi, mirasın paylaştırılması ve miras sebebiyle istihkak davaları bu yerleşim yeri mahkemesinde görülür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Açılmanın hükümleri">
          <mvz-b2 no="I" başlık="Mirasa ehliyet">
            <mvz-b3 no="1" başlık="Hak ehliyeti">
              <mvz-madde no="577" başlık="">
                <mvz-fıkra no="1">
                  <template>Bu Kanuna göre mirasa ehil olmayanlar dışındaki herkes mirasçı olabileceği gibi, vasiyet alacaklısı da olabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tüzel kişiliği bulunmayan bir topluluğa belli bir amaç için yapılan kazandırmaları, o topluluk içindeki kişiler, mirasbırakan tarafından belirlenen bu amacı gerçekleştirme kaydıyla birlikte edinmiş olurlar; amacın bu yolla gerçekleştirilmesine olanak yoksa, yapılan kazandırma vakıf kurma sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Mirastan yoksunluk">
              <mvz-b4 no="a" başlık="Sebepleri">
                <mvz-madde no="578" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıdaki kimseler, mirasçı olamayacakları gibi; ölüme bağlı tasarrufla herhangi bir hak da edinemezler:</template>
                    <mvz-bent no="1.">
                      <template>Mirasbırakanı kasten ve hukuka aykırı olarak öldüren veya öldürmeye teşebbüs edenler,</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Mirasbırakanı kasten ve hukuka aykırı olarak sürekli şekilde ölüme bağlı tasarruf yapamayacak duruma getirenler,</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Mirasbırakanın ölüme bağlı bir tasarruf yapmasını veya böyle bir tasarruftan dönmesini aldatma, zorlama veya korkutma yoluyla sağlayanlar ve engelleyenler,</template>
                    </mvz-bent>
                    <mvz-bent no="4.">
                      <template>Mirasbırakanın artık yeniden yapamayacağı bir durumda ve zamanda ölüme bağlı bir tasarrufu kasten ve hukuka aykırı olarak ortadan kaldıranlar veya bozanlar.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Mirastan yoksunluk, mirasbırakanın affıyla ortadan kalkar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Altsoya etkisi">
                <mvz-madde no="579" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirastan yoksunluk, yalnız yoksun olanı etkiler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Mirastan yoksun olanın altsoyu, mirasbırakandan önce ölen kimsenin altsoyu gibi mirasçı olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sağ olmak">
            <mvz-b3 no="1" başlık="Mirasçı olarak">
              <mvz-madde no="580" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçı olabilmek için mirasbırakanın ölümü anında mirasa ehil olarak sağ olmak şarttır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasın açıldığı anda sağ olan mirasçı sonradan ölürse, onun miras hakkı kendi mirasçılarına kalır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Vasiyet alacaklısı olarak">
              <mvz-madde no="581" başlık="">
                <mvz-fıkra no="1">
                  <template>Vasiyet alacaklısı olabilmek için mirasbırakanın ölümü anında mirasa ehil olarak sağ olmak şarttır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vasiyet alacaklısı mirasbırakandan önce ölmüş ise, tasarruftan aksi anlaşılmadıkça, vasiyeti yerine getirme yükümlülüğü, vasiyet yükümlüsünün yararına ortadan kalkar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Cenin">
              <mvz-madde no="582" başlık="">
                <mvz-fıkra no="1">
                  <template>Cenin, sağ doğmak koşuluyla mirasçı olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ölü doğan çocuk mirasçı olamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="İleride doğacak çocuk">
              <mvz-madde no="583" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasın açıldığı anda henüz var olmayan bir kimseye artmirasçı veya art vasiyet alacaklısı olarak, tereke veya tereke malı bırakılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasbırakan tarafından önmirasçı atanmamışsa, yasal mirasçı, önmirasçı sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Gaiplik">
          <mvz-b2 no="I" başlık="Gaibin mirası">
            <mvz-b3 no="1" başlık="Güvence karşılığı teslim">
              <mvz-madde no="584" başlık="">
                <mvz-fıkra no="1">
                  <template>Hakkında gaiplik kararı verilmiş bir kimsenin mirasçıları veya mirasında hak sahibi olan kişiler, tereke malları kendilerine teslim edilmeden önce bu malları ileride ortaya çıkabilecek üstün hak sahiplerine veya gaibin kendisine geri vereceklerine ilişkin güvence göstermek zorundadırlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu güvence, ölüm tehlikesi içinde kaybolma durumunda beş yıl, uzun zamandan beri haber alınamama durumunda onbeş yıl ve her hâlde en çok gaibin yüz yaşına varmasına kadar geçecek süre için gösterilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Beş yıl, tereke mallarının tesliminden; onbeş yıl, son haber tarihinden başlayarak hesaplanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Geri verme">
              <mvz-madde no="585" başlık="">
                <mvz-fıkra no="1">
                  <template>Gaip ortaya çıkarsa veya üstün hak sahibi olduklarını ileri sürenler bu sıfatlarını ispat ederlerse, tereke mallarını teslim almış olanlar, aldıkları malları zilyetlik kuralları uyarınca geri vermekle yükümlüdürler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İyiniyetli olanların üstün hak sahiplerine geri verme yükümlülükleri, miras sebebiyle istihkak davasına ilişkin zamanaşımı süresine tâbidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Gaibe düşen miras">
            <mvz-madde no="586" başlık="">
              <mvz-fıkra no="1">
                <template>Ortada bulunmayan ve mirasın açıldığı anda sağ olup olmadığı ispat edilemeyen mirasçının miras payı resmen yönetilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Mirasın açıldığı anda ortada bulunmayanın sağ olmaması hâlinde onun miras payı kendilerine kalacak olanlar, gaipliğe ilişkin sürelere ve usule uyarak o kimsenin gaipliğine karar verilmesini ve miras payının kendilerine teslimini isteyebilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Miras payının teslimi, gaipliğine karar verilen kimsenin mirasının mirasçılara teslimine ilişkin kurallara tâbidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Gaibin hem mirasbırakan, hem mirasçı olması">
            <mvz-madde no="587" başlık="">
              <mvz-fıkra no="1">
                <template>Gaibin mirasçıları tereke mallarını teslim aldıktan sonra gaibe bir miras düşerse, ona düşen miras payı gaiplik sebebiyle kendilerine kalacak olanlar, ayrıca bir gaiplik kararı almak zorunda kalmaksızın bu miras payının teslimini isteyebilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Gaibe düşen miras payını teslim alanların elde ettikleri gaiplik kararına aynı şekilde gaibin mirasçıları da dayanabilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Hazinenin istemi">
            <mvz-madde no="588" başlık="">
              <mvz-fıkra no="1">
                <template>Sağ olup olmadığı bilinmeyen bir kimsenin malvarlığı veya ona düşen miras payı on yıl resmen yönetilirse ya da malvarlığı böyle yönetilenin yüz yaşını dolduracağı süre geçerse, Hazinenin istemi üzerine o kimsenin gaipliğine karar verilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Gaiplik kararı verilebilmesi için gerekli ilân süresinde hiçbir hak sahibi ortaya çıkmazsa, aksine hüküm bulunmadıkça, gaibin mirası Devlete geçer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Devlet, gaibe veya üstün hak sahiplerine karşı, aynen gaibin mirasını teslim alanlar gibi geri vermekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="MİRASIN GEÇMESİNİN SONUÇLARI">
        <mvz-ayırım no="1-BİRİNCİ" başlık="KORUMA ÖNLEMLERİ">
          <mvz-b1 no="A" başlık="Genel olarak">
            <mvz-madde no="589" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakanın yerleşim yeri sulh hâkimi, istem üzerine veya re'sen tereke mallarının korunması ve hak sahiplerine geçmesini sağlamak üzere gerekli olan bütün önlemleri alır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu önlemler, özellikle kanunda belirtilen hâllerde terekede bulunan mal ve hakların yazımına, terekenin mühürlenmesine, terekenin resmen yönetilmesine ve vasiyetnamelerin açılmasına ilişkindir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Önlemlerle ilgili giderler, ileride terekeden alınmak üzere, başvuran kişi tarafından; önleme hâkimin re'sen karar verdiği hâllerde Devlet tarafından karşılanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Mirasbırakan, yerleşim yerinden başka bir yerde ölmüş ise, o yerin sulh hâkimi bu ölümü yerleşim yeri sulh hâkimine gecikmeksizin bildirir ve mirasbırakanın ölüm yerinde bulunan mallarının korunması için gerekli önlemleri alarak bununla ilgili dosyayı ve varsa vasiyetnameyi yerleşim yeri sulh hâkimine gönderir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Defter tutma">
            <mvz-madde no="590" başlık="">
              <mvz-fıkra no="1">
                <template>Aşağıdaki sebeplerden birinin gerçekleşmesi hâlinde sulh hâkimi terekenin defterinin tutulmasına karar verir:</template>
                <mvz-bent no="1.">
                  <template>Mirasçılar arasında vesayet altına alınmış olan veya alınması gereken kimse varsa,</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Mirasçılardan biri uzun süreden beri bulunamıyorsa ve temsilcisi de yoksa,</template>
                </mvz-bent>
                <mvz-bent no="3.">
                  <template>Mirasçılardan veya ilgililerden biri, ölüm tarihinden başlayarak bir ay içinde istemde bulunursa,</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Defter tutma işlemi gecikmeksizin tamamlanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Mühürleme">
            <mvz-madde no="591" başlık="">
              <mvz-fıkra no="1">
                <template>Yazımı yapılan tereke mallarından gerekenler mühürlenir. Mühürlenmeyen mallar için uygun koruma önlemi alınır. Mühür altına alma yazımdan önce de yapılabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Tereke mühürlenirken mirasbırakanla birlikte oturanların ihtiyaçları için gerekli eşya bir tutanakla tespit edilip güvenilir kişi olarak kendilerine bırakılır; taşınmazların onların oturmaları için zorunlu olan bölümleri, mühürlemenin dışında tutulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Alacaklıların istemi üzerine yapılan mühürleme, güvence altına alınan miktarla sınırlıdır. Alacaklıya güvence gösterildiği takdirde mühürleme yapılmaz, yapılmışsa kaldırılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Terekenin resmen yönetilmesi">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="592" başlık="">
                <mvz-fıkra no="1">
                  <template>Aşağıdaki hâllerde sulh hâkimi re'sen mirasın resmen yönetilmesine karar verir:</template>
                  <mvz-bent no="1.">
                    <template>Mirasçılardan birinin uzun süreden beri bulunamaması ve temsilci de bırakmaması hâlinde menfaati gerektiriyorsa,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Mirasta hak sahibi olduğunu ileri sürenlerden hiçbiri mirasçılık sıfatını yeterince ispatlayamazsa veya bir mirasçı bulunup bulunmadığı şüpheli olursa,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Mirasçıların tamamı bilinmiyorsa,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Kanunda özel olarak öngörülmüşse.</template>
                  </mvz-bent>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasbırakan terekenin tamamı üzerinde yetkili olmak üzere vasiyeti yerine getirme görevlisi atamış ise, önemli bir engel bulunmadıkça terekenin yönetimi ona verilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Mirasbırakan velâyet veya vesayet altında idiyse; veli veya vasi bir sakınca olmadıkça terekenin yönetimiyle görevlendirilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Sulh hâkimi, terekeyi yönetmekle görevlendirilen kimseye, istemi hâlinde terekeden karşılanmak üzere uygun bir ücret ödenmesine karar verir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Görev, temsil ve sorumluluk">
              <mvz-madde no="593" başlık="">
                <mvz-fıkra no="1">
                  <template>Terekeyi resmen yöneten sulh hâkimi veya onun yönetimle görevlendirdiği kimse, resmen yönetme sebeplerinin ortadan kalkmasına ya da paylaştırmaya kadar, terekeyi hak sahiplerinin haklarının kaybına meydan vermeyecek biçimde iyi bir yönetici gibi özenle yönetmek ve özellikle aşağıda yazılı işleri görmekle yükümlüdür:</template>
                  <mvz-bent no="1.">
                    <template>Henüz yapılmamışsa, terekenin yazımı,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Gereken koruma önlemlerinin alınması,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Mirasçıların menfaatlerine veya iyi bir yönetimin gereklerine uygun düştüğü takdirde terekedeki malların satılması,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Mirasbırakanın alacaklarının tahsili ve borçlarının ödenmesi,</template>
                  </mvz-bent>
                  <mvz-bent no="5.">
                    <template>Mirasçıların yasal haklarını zedelemediği anlaşılan vasiyetlerin, sulh hâkiminin izni ve asliye hâkiminin onayı ile yerine getirilmesi,</template>
                  </mvz-bent>
                  <mvz-bent no="6.">
                    <template>Terekeye ait paraların faiz getirmek üzere Cumhurbaşkanınca çıkarılan yönetmelikte belirtilen bir bankaya yatırılması veya bu paralarla Devlet tahvili alınması ve yeterli güvencesi bulunmayan yatırımların güvenceli yatırımlara dönüştürülmesi,</template>
                  </mvz-bent>
                  <mvz-bent no="7.">
                    <template>Terekede ticarethane, imalâthane veya başka bir işletme varsa, bunların olduğu gibi sürdürülmesi; sürdürmede yarar yoksa, tasfiyesi için gerekli önlemlerin alınması.</template>
                  </mvz-bent>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tereke yöneticisi, görevine giren hususlarda miras ortaklığının temsilcisi olup, ortaklık aleyhine açılan davalarda ve yapılan icra takiplerinde ortaklığı temsil eder ve gereken hâllerde ortaklık adına dava açmaya, icra takibinde bulunmaya, davadan feragate, kabule, sulh olmaya ve tahkime yetkilidir; davaları ve takipleri mirasçılara ihbar eder.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Terekenin resmen yönetilmesinde, sulh hâkimi ile yöneticinin işlemleri konusunda, niteliklerine uygun olduğu ölçüde, vesayete ilişkin hükümler uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Mirasçıların bilinmemesi">
              <mvz-madde no="594" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakanın mirasçısı bulunup bulunmadığı veya mirasçıların tamamı bilinmiyorsa, sulh hâkimi uygun araçlarla ve bir ay ara ile iki defa ilân yapıp hak sahiplerini son ilândan başlayarak en geç bir yıl içinde mirasçılık sıfatlarını bildirmeye çağırır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İlân süresinde kimse başvurmazsa ve sulh hâkimi de hiçbir mirasçı tespit edememişse, miras sebebiyle istihkak davası açma hakkı saklı kalmak üzere miras Devlete geçer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Vasiyetname ile ilgili işlemler">
            <mvz-b2 no="I" başlık="Teslim görevi ve alınacak önlemler">
              <mvz-madde no="595" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakanın ölümünden sonra ele geçen vasiyetnamesinin, geçerli olup olmadığına bakılmaksızın hemen sulh hâkimine teslim edilmesi zorunludur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vasiyetnameyi düzenleyen veya muhafaza eden görevli ya da mirasbırakanın arzusu üzerine saklayan veya başka surette ele geçiren ya da ölenin eşyası arasında bulan kimse, ölümü öğrenir öğrenmez teslim görevini yerine getirmekle yükümlüdür; aksi takdirde bu yüzden doğacak zarardan sorumludur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Sulh hâkimi, teslim edilen vasiyetnameyi derhâl inceler, gerekli koruma önlemlerini alır; olanak varsa ilgilileri dinleyerek terekenin yasal mirasçılara geçici olarak teslimine veya resmen yönetilmesine karar verir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Vasiyetnamenin açılması">
              <mvz-madde no="596" başlık="">
                <mvz-fıkra no="1">
                  <template>Vasiyetname, geçerli olup olmadığına bakılmaksızın tesliminden başlayarak bir ay içinde mirasbırakanın yerleşim yeri sulh hâkimi tarafından açılır ve ilgililere okunur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bilinen mirasçılar ve diğer ilgililer vasiyetnamenin açılması sırasında diledikleri takdirde hazır bulunmak üzere çağrılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Mirasbırakanın sonradan ortaya çıkan vasiyetnameleri için de aynı işlemler yapılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="İlgililere tebliğ">
              <mvz-madde no="597" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasta hak sahibi olanların her birine gideri terekeye ait olmak üzere, vasiyetnamenin kendilerine ilişkin kısımlarının onaylı bir örneği hâkim tarafından tebliğ edilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Nerede olduğu bilinmeyenlere vasiyetnamenin kendilerine ilişkin kısımları ilân yolu ile tebliğ olunur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Mirasçılık belgesi">
              <mvz-madde no="598" başlık="">
                <mvz-fıkra no="1">
                  <template>Başvurusu üzerine yasal mirasçı oldukları belirlenenlere, sulh mahkemesince veya noterlikçe mirasçılık sıfatlarını gösteren bir belge verilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasçı atamaya veya vasiyete ilişkin ölüme bağlı tasarrufa mirasçılar veya başka vasiyet alacaklıları tarafından kendilerine bildirilmesinden başlayarak bir ay içinde itiraz edilmedikçe, lehine tasarrufta bulunulan kimseye, sulh mahkemesince atanmış mirasçı veya vasiyet alacaklısı olduğunu gösteren bir belge verilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Mirasçılık belgesinin geçersizliği her zaman ileri sürülebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Ölüme bağlı tasarrufun iptaline ilişkin dava hakkı saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="MİRASIN KAZANILMASI">
          <mvz-b1 no="A" başlık="Kazanma">
            <mvz-b2 no="I" başlık="Mirasçılar tarafından">
              <mvz-madde no="599" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçılar, mirasbırakanın ölümü ile mirası bir bütün olarak, kanun gereğince kazanırlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kanunda öngörülen ayrık durumlar saklı kalmak üzere mirasçılar, mirasbırakanın aynî haklarını, alacaklarını, diğer malvarlığı haklarını, taşınır ve taşınmazlar üzerindeki zilyetliklerini doğrudan doğruya kazanırlar ve mirasbırakanın borçlarından kişisel olarak sorumlu olurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Atanmış mirasçılar da mirası, mirasbırakanın ölümü ile kazanırlar. Yasal mirasçılar, atanmış mirasçılara düşen mirası onlara zilyetlik hükümleri uyarınca teslim etmekle yükümlüdürler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Vasiyet alacaklıları tarafından">
              <mvz-b3 no="1" başlık="İstem">
                <mvz-madde no="600" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vasiyet alacaklısı, vasiyeti yerine getirme görevlisi varsa ona; yoksa yasal veya atanmış mirasçılara karşı kişisel bir istem hakkına sahip olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu alacak, tasarruftan aksi anlaşılmıyorsa vasiyet yükümlüsünün mirası kabul etmesi veya ret hakkının düşmesiyle muaccel olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Vasiyet alacaklısı, yükümlülüğünü yerine getirmeyen vasiyet yükümlüsüne karşı, vasiyet edilen malın teslimini veya hakkın devrini; vasiyet konusu bir davranış ise, bunun yerine getirilmemesinden doğan zararın giderilmesini dava edebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Özel durumlar">
                <mvz-madde no="601" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kendisine bir intifa hakkı veya bir irat hakkı ya da belli aralıklarla tekrarlanan diğer bir edim vasiyet edilen kimsenin istem hakkı, tasarrufta başka bir esas öngörülmüş olmadıkça, eşya hukuku ve borçlar hukuku kurallarına tâbidir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Kendisine mirasbırakanın ölümünde ödenecek bir sigorta alacağı vasiyet edilen kimse, sigorta sözleşmesinden doğan istem hakkını sigortacıya karşı doğrudan doğruya kullanabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Zamanaşımı">
                <mvz-madde no="602" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vasiyet alacaklısının dava hakkı, ölüme bağlı kazandırmayı öğrenmesinin veya vasiyet borcu daha sonra muaccel olacaksa muaccel olma tarihinin üzerinden on yıl geçmekle zamanaşımına uğrar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Alacaklıların durumu">
              <mvz-madde no="603" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakanın alacaklılarının hakları, vasiyet alacaklılarının haklarından, vasiyet alacaklılarının hakları da mirasçıların alacaklılarının haklarından önce gelir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirası kayıtsız şartsız kabul eden mirasçıların alacaklıları ile mirasbırakanın alacaklıları aynı haklara sahiptirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Tenkis ve geri isteme">
              <mvz-madde no="604" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçılar, vasiyet yükümlülüğünü yerine getirdikten sonra mirasbırakanın daha önce bilmedikleri borçlarını öderlerse, vasiyet alacaklısından vasiyetin tenkisini isteyebilecekleri oranda verileni geri isteme hakkına sahiptirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vasiyet alacaklısı, ancak geri isteme zamanında var olan zenginleşmesi ölçüsünde sorumlu tutulabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Ret">
            <mvz-b2 no="I" başlık="Ret beyanı">
              <mvz-b3 no="1" başlık="Ret hakkı">
                <mvz-fıkra no="3">
                  <template>Madde 605-Yasal ve atanmış mirasçılar mirası reddedebilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Ölümü tarihinde mirasbırakanın ödemeden aczi açıkça belli veya resmen tespit edilmiş ise, miras reddedilmiş sayılır.</template>
                </mvz-fıkra>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Süre">
                <mvz-b4 no="a" başlık="Genel olarak">
                  <mvz-madde no="606" başlık="">
                    <mvz-fıkra no="1">
                      <template>Miras, üç ay içinde reddolunabilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Bu süre, yasal mirasçılar için mirasçı olduklarını daha sonra öğrendikleri ispat edilmedikçe mirasbırakanın ölümünü öğrendikleri; vasiyetname ile atanmış mirasçılar için mirasbırakanın tasarrufunun kendilerine resmen bildirildiği tarihten işlemeye başlar.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Terekenin yazımında">
                  <mvz-madde no="607" başlık="">
                    <mvz-fıkra no="1">
                      <template>Koruma önlemi olarak terekenin yazımı hâlinde mirası ret süresi, yasal ve atanmış mirasçılar için yazım işleminin sona erdiğinin sulh hâkimi tarafından kendilerine bildirilmesiyle başlar.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Ret hakkının geçmesi">
                <mvz-madde no="608" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirası reddetmeden ölen mirasçının ret hakkı kendi mirasçılarına geçer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu mirasçılar için ret süresi, kendilerinin mirasbırakanına mirasın geçtiğini öğrendikleri tarihten başlar. Ancak bu süre, kendilerinin mirasbırakanından geçen mirasın reddi için mirasçıya tanınan süre dolmadıkça sona ermez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Ret sonucunda miras daha önce mirasçı olmayanlara geçerse; bunlar için ret süresi, önceki mirasçılar tarafından mirasın reddedildiğini öğrendikleri tarihten işlemeye başlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Reddin şekli">
                <mvz-madde no="609" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasın reddi, mirasçılar tarafından sulh mahkemesine sözlü veya yazılı beyanla yapılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Reddin kayıtsız ve şartsız olması gerekir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Sulh hâkimi, sözlü veya yazılı ret beyanını bir tutanakla tespit eder.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Süresi içinde yapılmış olan ret beyanı, mirasın açıldığı yerin sulh mahkemesince özel kütüğüne yazılır ve reddeden mirasçı isterse kendisine reddi gösteren bir belge verilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="5">
                    <template>Tutanağın ve kütüğün nasıl tutulacağı Cumhurbaşkanınca çıkarılan yönetmelikle düzenlenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Ret hakkının düşmesi">
              <mvz-madde no="610" başlık="">
                <mvz-fıkra no="1">
                  <template>Yasal süre içinde mirası reddetmeyen mirasçı, mirası kayıtsız şartsız kazanmış olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ret süresi sona ermeden mirasçı olarak tereke işlemlerine karışan, terekenin olağan yönetimi niteliğinde olmayan veya mirasbırakanın işlerinin yürütülmesi için gerekli olanın dışında işler yapan ya da tereke mallarını gizleyen veya kendisine maleden mirasçı, mirası reddedemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Zamanaşımı veya hak düşümü sürelerinin dolmasına engel olmak için dava açılması ve cebrî icra takibi yapılması, ret hakkını ortadan kaldırmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Mirasçılardan biri tarafından ret">
              <mvz-madde no="611" başlık="">
                <mvz-fıkra no="1">
                  <template>Yasal mirasçılardan biri mirası reddederse onun payı, miras açıldığı zaman kendisi sağ değilmiş gibi, hak sahiplerine geçer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirası reddeden atanmış mirasçının payı, mirasbırakanın ölüme bağlı tasarrufundan arzusunun başka türlü olduğu anlaşılmadıkça, mirasbırakanın en yakın yasal mirasçılarına kalır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="En yakın mirasçıların tamamı tarafından ret">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="612" başlık="">
                  <mvz-fıkra no="1">
                    <template>En yakın yasal mirasçıların tamamı tarafından reddolunan miras, sulh mahkemesince iflâs hükümlerine göre tasfiye edilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tasfiye sonunda arta kalan değerler, mirası reddetmemişler gibi hak sahiplerine verilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Mirasın sağ kalan eşe geçmesi">
                <mvz-madde no="613" başlık="">
                  <mvz-fıkra no="1">
                    <template>Altsoyun tamamının mirası reddetmesi hâlinde, bunların payı sağ kalan eşe geçer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Sonra gelen mirasçılar yararına ret">
                <mvz-madde no="614" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasçılar, mirası reddederken, kendilerinden sonra gelen mirasçılardan mirası kabul edip etmeyeceklerinin sorulmasını tasfiyeden önce isteyebilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu takdirde ret, sulh hâkimi tarafından daha sonra gelen mirasçılara bildirilir; bunlar bir ay içinde mirası kabul etmezlerse reddetmiş sayılırlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bunun üzerine miras, iflâs hükümlerine göre tasfiye edilir ve tasfiye sonunda arta kalan değerler, önce gelen mirasçılara verilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Ret süresinin uzatılması">
              <mvz-madde no="615" başlık="">
                <mvz-fıkra no="1">
                  <template>Önemli sebeplerin varlığı hâlinde sulh hâkimi, yasal ve atanmış mirasçılara tanınmış olan ret süresini uzatabilir veya yeni bir süre tanıyabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Vasiyetin reddi">
              <mvz-madde no="616" başlık="">
                <mvz-fıkra no="1">
                  <template>Vasiyet alacaklısının vasiyeti reddetmesi hâlinde, mirasbırakanın arzusunun başka türlü olduğu tasarruftan anlaşılmadıkça, bu redden vasiyet yükümlüsü yararlanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VII" başlık="Mirasçıların alacaklılarının korunması">
              <mvz-madde no="617" başlık="">
                <mvz-fıkra no="1">
                  <template>Malvarlığı borcuna yetmeyen mirasçı, alacaklılarına zarar vermek amacıyla mirası reddederse; alacaklıları veya iflâs idaresi, kendilerine yeterli bir güvence verilmediği takdirde, ret tarihinden başlayarak altı ay içinde reddin iptali hakkında dava açabilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Reddin iptaline karar verilirse, miras resmen tasfiye edilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bu suretle tasfiye edilen mirastan reddeden mirasçının payına bir şey düşerse bundan, önce itiraz eden alacaklıların, daha sonra diğer alacaklıların alacakları ödenir. Arta kalan değerler ise, ret geçerli olsa idi bundan yararlanacak olan mirasçılara verilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VIII" başlık="Ret hâlinde sorumluluk">
              <mvz-madde no="618" başlık="">
                <mvz-fıkra no="1">
                  <template>Ödemeden âciz bir mirasbırakanın mirasını reddeden mirasçılar, onun alacaklılarına karşı, ölümünden önceki beş yıl içinde ondan almış oldukları ve mirasın paylaşılmasında geri vermekle yükümlü olacakları değer ölçüsünde sorumlu olurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Olağan eğitim ve öğrenim giderleriyle âdet üzere verilen çeyiz, bu sorumluluğun dışındadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İyiniyetli mirasçılar, ancak geri verme zamanındaki zenginleşmeleri ölçüsünde sorumlu olurlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="RESMÎ DEFTER TUTMA">
          <mvz-b1 no="A" başlık="Koşulları">
            <mvz-madde no="619" başlık="">
              <mvz-fıkra no="1">
                <template>Mirası reddetmeye hakkı olan her mirasçı, terekenin resmî defterinin tutulmasını isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Defter tutma, mirasın reddine ilişkin usule uyulmak suretiyle, bir ay içinde sulh hâkiminden istenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Mirasçılardan birinin defter tutma istemi, diğerleri hakkında da etkili olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Usul">
            <mvz-b2 no="I" başlık="Deftere geçirme">
              <mvz-madde no="620" başlık="">
                <mvz-fıkra no="1">
                  <template>Resmî defter, sulh mahkemesi tarafından düzenlenir; bu deftere terekeye ait aktif ve pasifler takdir edilen değerleriyle yazılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasbırakanın malî durumu hakkında bilgi sahibi olan herkes, sulh mahkemesi tarafından istenilen bilgiyi vermekle yükümlüdür. Haklı bir sebep olmaksızın bilgi vermeyenler veya yanlış ya da eksik bilgi verenler, bundan doğacak zararları mirasçılara, vasiyet alacaklılarına veya üçüncü kişilere tazminle yükümlüdürler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Mirasçılar, özellikle mirasbırakanın kendilerince bilinen borçlarını sulh mahkemesine bildirmek zorundadırlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Resmî defterin nasıl tutulacağı Cumhurbaşkanınca çıkarılan yönetmelikle düzenlenir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="İlân yoluyla çağrı">
              <mvz-madde no="621" başlık="">
                <mvz-fıkra no="1">
                  <template>Sulh mahkemesi, mirasbırakanın alacaklıları ile borçlularını belli bir süre içinde alacaklarını ve borçlarını bildirmeleri için bir ay arayla iki defa yapılacak ilân yoluyla çağırır. Çağrı, kefalet sebebiyle alacaklı ve borçlu olanları da kapsar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İlânda bildirimde bulunmamanın sonuçları hakkında alacaklıların dikkatleri çekilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bildirim süresi, ikinci ilândan başlayarak en az bir aydır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Doğrudan doğruya deftere geçirme">
              <mvz-madde no="622" başlık="">
                <mvz-fıkra no="1">
                  <template>Resmî kayıtlardan veya mirasbırakanın belgelerinden varlığı anlaşılan alacaklar ve borçlar, deftere doğrudan doğruya geçirilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Deftere geçirilenler, alacaklılara ve borçlulara bildirilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Defter tutmanın sona ermesi">
              <mvz-madde no="623" başlık="">
                <mvz-fıkra no="1">
                  <template>İlânda belirtilen sürenin dolmasıyla defterin tutulması sona erer ve defter, bu tarihten başlayarak tanınacak en az bir aylık süre içinde ilgililerce incelenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Defter tutma giderleri terekeden ödenir. Giderler terekeden karşılanamazsa defter tutulmasını istemiş olan mirasçılardan alınır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Defter tutma sırasında mirasçıların durumu">
            <mvz-b2 no="I" başlık="Yönetim">
              <mvz-madde no="624" başlık="">
                <mvz-fıkra no="1">
                  <template>Defter tutma süresince ancak zorunlu yönetim işleri yapılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasbırakanın işlerinin yürütülmesi sulh mahkemesince kendisine bırakılan mirasçıdan diğer mirasçılar güvence göstermesini isteyebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="İcra takibi, dava ve zamanaşımı">
              <mvz-madde no="625" başlık="">
                <mvz-fıkra no="1">
                  <template>Resmî defter tutulması devam ettiği sürece mirasbırakanın borçları için icra takibi yapılamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu süre içinde zamanaşımı işlemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Acele hâller dışında, davalara devam edilemiyeceği gibi, yeni dava da açılamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Sonuçları">
            <mvz-b2 no="I" başlık="Beyana çağrı">
              <mvz-madde no="626" başlık="">
                <mvz-fıkra no="1">
                  <template>Defteri inceleme süresi bittikten sonra her mirasçı, mahkemece bir ay içinde beyanda bulunmaya çağrılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Koşullar gerektirdiği takdirde sulh mahkemesi, tereke mallarına yeni değer biçilmesi, uyuşmazlıkların çözümü ve benzeri durumlar için ek süre verebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Beyan">
              <mvz-madde no="627" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçılardan her biri, tanınan süre içinde mirası reddettiğini veya resmî tasfiye istediğini ya da deftere göre veya kayıtsız şartsız kabul ettiğini beyan edebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Süresi içinde herhangi bir beyanda bulunmayan mirasçı, mirası tutulan deftere göre kabul etmiş sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Resmî deftere göre kabulün sonuçları">
              <mvz-b3 no="1" başlık="Deftere yazılanlardan sorumluluk">
                <mvz-madde no="628" başlık="">
                  <mvz-fıkra no="1">
                    <template>Resmî deftere göre kabul edilen miras, mirasçıya sadece deftere yazılmış borçlarla geçer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu suretle mirasın geçmesi, mirasın açıldığı tarihten başlayarak hüküm ifade eder.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Mirasçı, mirasbırakanın deftere yazılmış olan borçlarından hem tereke malları, hem kendi malvarlığı ile sorumludur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Deftere yazılmayanlardan sorumluluk">
                <mvz-madde no="629" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklarını süresi içinde yazdırmayan alacaklılara karşı mirasçı, kendi kişisel mallarıyla sorumlu olmadığı gibi; terekeden kendisine geçen mallarla da sorumlu tutulamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ancak, alacaklının kusuru olmadan deftere yazdıramadığı veya bildirdiği hâlde deftere yazılmamış alacakları için mirasçı, zenginleşmesi ölçüsünde sorumlu kalır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Alacakları, tereke mallarıyla güvence altına alınmış olan alacaklılar deftere geçirilmemiş olsa bile bu haklarını güvenceden alabilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Kefalet borçlarından sorumluluk">
                <mvz-madde no="630" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mirasbırakanın kefaletten doğan borçları defterde ayrı bir yere yazılır ve mirasçılar, mirası kayıtsız ve şartsız kabul etmiş olsalar bile, bu borçlardan terekenin iflâs hükümlerine göre tasfiyesi hâlinde kefalet sebebiyle alacaklı olanlara ne düşecek idiyse ancak o miktarla sorumlu olurlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Mirasın Devlete geçmesi hâli">
            <mvz-madde no="631" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasın Devlete geçmesi hâlinde sulh mahkemesi, re'sen yukarıdaki usuller uyarınca terekenin resmî defterini düzenler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Devlet, deftere yazılan borçlardan sadece miras yoluyla edindiği değerler ölçüsünde sorumludur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="RESMÎ TASFİYE">
          <mvz-b1 no="A" başlık="Koşulları">
            <mvz-b2 no="I" başlık="Mirasçıların istemi ile">
              <mvz-madde no="632" başlık="">
                <mvz-fıkra no="1">
                  <template>Her mirasçı, mirası ret veya resmî deftere göre kabul edeceği yerde terekenin resmî tasfiyesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu istem, birlikte mirasçı olanlardan birinin mirası kabul etmesi hâlinde dikkate alınmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Resmî tasfiye hâlinde mirasçılar, terekenin borçlarından sorumlu olmazlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Mirasbırakanın alacaklılarının istemi ile">
              <mvz-madde no="633" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakanın alacaklarını elde edemeyeceklerinden inandırıcı sebeplerle kuşku duyan alacaklıları, istedikleri hâlde alacakları ödenmediği veya kendilerine güvence verilmediği takdirde, mirasbırakanın ölümünden ya da vasiyetnamenin açılmasından başlayarak üç ay içinde, terekenin resmî tasfiyesini isteyebilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Aynı koşulların varlığı hâlinde vasiyet alacaklıları da, haklarının korunması için gerekli önlemlerin alınmasını isteyebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Usul">
            <mvz-b2 no="I" başlık="Yönetim">
              <mvz-madde no="634" başlık="">
                <mvz-fıkra no="1">
                  <template>Resmî tasfiye, sulh mahkemesince veya atayacağı bir ya da birkaç tasfiye memuru tarafından yapılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Resmî tasfiyeye terekenin defterinin düzenlenmesiyle başlanır ve aynı zamanda yapılacak ilânla mirasbırakanın alacaklılarından ve borçlularından, belirtilen süre içinde alacaklarını ve borçlarını bildirmeleri istenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Terekenin daha önce resmî defteri düzenlenmiş ise resmî tasfiye bu deftere göre yapılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Tasfiye memuru, göreviyle ilgili işlerini sulh mahkemesinin gözetim ve denetimi altında yürütür. Mirasçılar ve tereke alacaklıları, sulh mahkemesine, tasfiye memuru tarafından yapılan veya tasarlanan işlemlerden dolayı bunu öğrendikleri tarihten başlayarak yedi gün içinde yazılı olarak şikâyette bulunabilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Olağan usul ile tasfiye">
              <mvz-madde no="635" başlık="">
                <mvz-fıkra no="1">
                  <template>Resmî tasfiye, mirasbırakanın yürüyen işlerinin tamamlanmasını, borçlarının yerine getirilmesini, alacaklarının tahsilini, vasiyet borçlarının terekenin olanağı ölçüsünde yerine getirilmesini, zorunlu olduğu takdirde mirasbırakanın haklarının ve borçlarının mahkemece tespitini ve mallarının paraya çevrilmesini kapsar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tasfiye memuru, tereke ile ilgili dava, takip ve idarî işlemler hakkında mirasçılara bilgi vermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Terekedeki taşınmazlar, açık artırma veya bütün mirasçıların kabulü hâlinde pazarlık yoluyla satılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Mirasçılar, tasfiye devam ederken tasfiye için gerekli olmayan tereke mallarının ve paranın kısmen veya tamamen kendilerine verilmesini isteyebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="İflâs usulü ile tasfiye">
              <mvz-madde no="636" başlık="">
                <mvz-fıkra no="1">
                  <template>Mevcudu borçlarını ödemeye yetmeyen terekenin tasfiyesi, sulh mahkemesince iflâs hükümlerine göre yapılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="5-BEŞİNCİ" başlık="MİRAS SEBEBİYLE İSTİHKAK DAVASI">
          <mvz-b1 no="A" başlık="Koşulları">
            <mvz-madde no="637" başlık="">
              <mvz-fıkra no="1">
                <template>Yasal veya atanmış mirasçı, terekeyi veya bazı tereke mallarını elinde bulunduran kimseye karşı mirasçılıktaki üstün hakkını ileri sürerek miras sebebiyle istihkak davası açabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu davada hâkim, mirasçılık sıfatıyla ilgili uyuşmazlıkları da çözer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Hâkim, davacının istemi üzerine hakkın korunması için davalının güvence göstermesi veya tapu kütüğüne şerh verilmesi gibi gerekli her türlü önlemi alır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Hükümleri">
            <mvz-madde no="638" başlık="">
              <mvz-fıkra no="1">
                <template>Miras sebebiyle istihkak davasının kabulü hâlinde, tereke veya terekeye dahil mal, davacıya zilyetliğe ilişkin hükümler uyarınca verilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Miras sebebiyle istihkak davasında davalı, tereke malını zamanaşımı yoluyla kazandığını ileri süremez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Zamanaşımı">
            <mvz-madde no="639" başlık="">
              <mvz-fıkra no="1">
                <template>Miras sebebiyle istihkak davası, davacının kendisinin mirasçı olduğunu ve iyiniyetli davalının terekeyi veya tereke malını elinde bulundurduğunu öğrendiği tarihten başlayarak bir yıl ve her hâlde mirasbırakanın ölümünün veya vasiyetnamenin açılmasının üzerinden on yıl geçmekle zamanaşımına uğrar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İyiniyetli olmayanlara karşı zamanaşımı süresi yirmi yıldır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="MİRASIN PAYLAŞILMASI">
        <mvz-ayırım no="1-BİRİNCİ" başlık="PAYLAŞIMDAN ÖNCE MİRAS ORTAKLIĞI">
          <mvz-b1 no="A" başlık="Mirasın geçmesinin sonucu">
            <mvz-b2 no="I" başlık="Miras ortaklığı">
              <mvz-madde no="640" başlık="">
                <mvz-fıkra no="1">
                  <template>Birden çok mirasçı bulunması hâlinde, mirasın geçmesiyle birlikte paylaşmaya kadar, mirasçılar arasında terekedeki bütün hak ve borçları kapsayan bir ortaklık meydana gelir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasçılar terekeye elbirliğiyle sahip olurlar ve sözleşme veya kanundan doğan temsil ya da yönetim yetkisi saklı kalmak üzere, terekeye ait bütün haklar üzerinde birlikte tasarruf ederler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Mirasçılardan birinin istemi üzerine sulh mahkemesi, miras ortaklığına paylaşmaya kadar bir temsilci atayabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Mirasçılardan her biri, terekedeki hakların korunmasını isteyebilir. Sağlanan korumadan mirasçıların hepsi yararlanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="5">
                  <template>Bir mirasçı ödemeden aciz hâlinde ise, mirasın açılması üzerine diğer mirasçılar, haklarının korunması için gerekli önlemlerin gecikmeksizin alınmasını sulh mahkemesinden isteyebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Mirasçıların sorumluluğu">
              <mvz-madde no="641" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçılar, tereke borçlarından müteselsilen sorumludurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ana ve baba veya büyük ana ve büyük baba ile birlikte yaşayan ve emeklerini veya gelirlerini aileye özgüleyen ergin çocuklar ile torunlara verilecek uygun miktardaki tazminat, bu yüzden terekenin borç ödemeden acze düşmemesi kaydıyla tereke borcu sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Paylaşmayı isteme hakkı">
            <mvz-madde no="642" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasçılardan her biri, sözleşme veya kanun gereğince ortaklığı sürdürmekle yükümlü olmadıkça, her zaman mirasın paylaşılmasını isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Her mirasçı, terekedeki belirli malların aynen, olanak yoksa satış yoluyla paylaştırılmasına karar verilmesini sulh mahkemesinden isteyebilir. Mirasçılardan birinin istemi üzerine hâkim, terekenin tamamını ve terekedeki malların her birini göz önünde tutarak, olanak varsa taşınmazlardan her birinin tamamının bir mirasçıya verilmesi suretiyle paylaştırmayı yapar. Mirasçılara verilen taşınmazların değerleri arasındaki fark para ödenmesi yoluyla giderilerek miras payları arasında denkleştirme sağlanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Paylaşmanın derhâl yapılması, paylaşım konusu malın veya terekenin değerini önemli ölçüde azaltacaksa; sulh hâkimi, mirasçılardan birinin istemi üzerine bu malın veya terekenin paylaşılmasının ertelenmesine karar verebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Cenin nedeniyle erteleme">
            <mvz-madde no="643" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasın açıldığı tarihte, mirasçı olabilecek bir cenin varsa paylaşma doğumuna kadar ertelenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ana muhtaç ise, doğuma kadar geçim giderlerinin terekeden sağlanmasını isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Elbirliği mülkiyetinin paylı mülkiyete dönüştürülmesi">
            <mvz-madde no="644" başlık="">
              <mvz-fıkra no="1">
                <template>Bir mirasçı, terekeye dahil malların tamamı veya bir kısmı üzerindeki elbirliği mülkiyetinin paylı mülkiyete dönüştürülmesi isteminde bulunduğu takdirde sulh hâkimi, diğer mirasçılara çağrıda bulunarak belirleyeceği süre içinde varsa itirazlarını bildirmeye davet eder.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Elbirliği mülkiyetinin devamını haklı kılacak bir itiraz ileri sürülmediği veya mirasçılardan biri belirlenen süre içinde paylaşma davası açmadığı takdirde, istem konusu mal üzerindeki elbirliği mülkiyetinin paylı mülkiyete dönüştürülmesine karar verilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Terekeye dahil diğer hakların ve alacakların paylar oranında bölünmesi hususunda da yukarıdaki hükümler uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Birlikte yaşayanların hakkı">
            <mvz-madde no="645" başlık="">
              <mvz-fıkra no="1">
                <template>Mirasbırakanın ölümünde onunla birlikte yaşayan ve onun tarafından bakılan kimseler, ölüm tarihinden başlayarak üç aylık bakım ve geçim giderlerinin terekeden sağlanmasını isteyebilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="PAYLAŞMANIN NASIL YAPILACAĞI">
          <mvz-b1 no="A" başlık="Genel olarak">
            <mvz-madde no="646" başlık="">
              <mvz-fıkra no="1">
                <template>Yasal mirasçılar, gerek kendi aralarında, gerek atanmış mirasçılarla birlikte mirası aynı kurallara göre paylaşırlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aksine düzenleme olmadıkça mirasçılar, paylaşmanın nasıl yapılacağını serbestçe kararlaştırırlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Tereke mallarına zilyet olan veya mirasbırakana borçlu bulunan mirasçılar, paylaşma sırasında bu konuda eksiksiz bilgi vermekle yükümlüdürler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Paylaşma kuralları">
            <mvz-b2 no="I" başlık="Mirasbırakanın tasarrufu">
              <mvz-madde no="647" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasbırakan, ölüme bağlı tasarrufuyla paylaşmanın nasıl yapılacağı ve payların nasıl oluşturulacağı hakkında kurallar koyabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu kurallar, mirasbırakan tarafından kastedilmemiş olan bir eşitsizlik hâlinde payların denkleştirilmesi olanağı saklı kalmak kaydıyla, mirasçılar için bağlayıcıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Aksini arzu ettiği tasarruftan anlaşılmadıkça, mirasbırakanın tereke malını bir mirasçıya özgülemesi, vasiyet olmayıp sadece paylaştırma kuralı sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Paylaşmaya kayyımın katılması">
              <mvz-madde no="648" başlık="">
                <mvz-fıkra no="1">
                  <template>Açılmış mirasta bir mirasçının payını devralmış veya haczettirmiş olan ya da elinde mirasçıya karşı alınmış borç ödemeden aciz belgesi bulunan alacaklı, sulh hâkiminden bu mirasçının yerine paylaşmaya katılmak üzere bir kayyım atanmasını isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Paylaşmanın gerçekleşmesi">
            <mvz-b2 no="I" başlık="Mirasçıların eşitliği">
              <mvz-madde no="649" başlık="">
                <mvz-fıkra no="1">
                  <template>Kanunda aksine bir hüküm bulunmadıkça mirasçılar, paylaşmada terekenin bütün malları üzerinde eşit hakka sahiptirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasçılar, mirasbırakan ile aralarındaki ilişkiler hakkında paylaşmanın eşitliğe ve adalete uygun olması için göz önüne alınması gereken bütün bilgileri birbirlerine vermekle yükümlüdürler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Mirasçılardan her biri, tereke borçlarının paylaşmadan önce ödenmesini veya güvenceye bağlanmasını isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Payların oluşturulması">
              <mvz-madde no="650" başlık="">
                <mvz-fıkra no="1">
                  <template>Mirasçılar, tereke mallarından mirasçı veya ortak kök sayısınca pay oluştururlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Anlaşma olmazsa, mirasçılardan her biri, payların oluşturulmasını sulh mahkemesinden isteyebilir. Payların oluşturulmasında hâkim, yerel âdetleri, mirasçıların kişisel durumlarını ve çoğunluğun arzusunu göz önünde bulundurur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Payların özgülenmesi mirasçıların anlaşması uyarınca yapılır. Buna olanak bulunmazsa kur'a çekilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Bazı malların özgülenmesi veya satılması">
              <mvz-madde no="651" başlık="">
                <mvz-fıkra no="1">
                  <template>Değerinde önemli azalma olmadan bölünemeyen tereke malı, bütün olarak mirasçılardan birine özgülenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mirasçılar bir tereke malının bölünmesi veya özgülenmesi konusunda anlaşamazlarsa, o mal satılır ve bedeli bölüştürülür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Mirasçılardan biri istemde bulunursa satış artırma yoluyla yapılır. Mirasçılar artırmanın şekli konusunda anlaşamazlarsa sulh hâkimi, artırmanın mirasçılar arasında veya herkese açık yapılmasına karar verir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Aile konutu ve ev eşyasının sağ kalan eşe özgülenmesi">
            <mvz-madde no="652" başlık="">
              <mvz-fıkra no="1">
                <template>Eşlerden birinin ölümü hâlinde tereke malları arasında ev eşyası veya eşlerin birlikte yaşadıkları konut varsa; sağ kalan eş, bunlar üzerinde kendisine miras hakkına mahsuben mülkiyet hakkı tanınmasını isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Haklı sebeplerin varlığı hâlinde, sağ kalan eşin veya mirasbırakanın diğer yasal mirasçılarından birinin istemi üzerine, mülkiyet yerine intifa veya oturma hakkı tanınmasına da karar verilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Mirasbırakanın bir meslek veya sanat icra ettiği ve altsoyundan birinin aynı meslek ve sanatı icra etmesi için gerekli olan bölümlerde, sağ kalan eş bu hakları kullanamaz. Tarımsal taşınmazlara ilişkin miras hukuku hükümleri saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Özellikleri olan eşya">
            <mvz-b2 no="I" başlık="Bütünlük oluşturan veya aile belgeleri ile özel anı değeri olan eşya">
              <mvz-madde no="653" başlık="">
                <mvz-fıkra no="1">
