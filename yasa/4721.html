                    <template>Katılma alacağı ve değer artış payı ayın veya para olarak ödenebilir. Aynî ödemede malların sürüm değeri esas alınır; bir mesleğin icrasına ayrılmış birimler ile işletmelerin ekonomik bütünlüğü gözetilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Katılma alacağının ve değer artış payının derhâl ödenmesi kendisi için ciddî güçlükler doğuracaksa, borçlu eş ödemelerinin uygun bir süre ertelenmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Aksine anlaşma yoksa, tasfiyenin sona ermesinden başlayarak katılma alacağına ve değer artış payına faiz yürütülür; durum ve koşullar gerektiriyorsa ayrıca borçludan güvence istenebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Aile konutu ve ev eşyası">
                <mvz-madde no="240" başlık="">
                  <mvz-fıkra no="1">
                    <template>Sağ kalan eş, eski yaşantısını devam ettirebilmesi için, ölen eşine ait olup birlikte yaşadıkları konut üzerinde kendisine katılma alacağına mahsup edilmek, yetmez ise bedel eklenmek suretiyle intifa veya oturma hakkı tanınmasını isteyebilir; mal rejimi sözleşmesiyle kabul edilen başka düzenlemeler saklıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Sağ kalan eş, aynı koşullar altında ev eşyası üzerinde kendisine mülkiyet hakkı tanınmasını isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Haklı sebeplerin varlığı hâlinde, sağ kalan eşin veya ölen eşin yasal mirasçılarının istemiyle intifa veya oturma hakkı yerine, konut üzerinde mülkiyet hakkı tanınabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Sağ kalan eş, mirasbırakanın bir meslek veya sanat icra ettiği ve altsoyundan birinin aynı meslek veya sanatı icra etmesi için gerekli olan bölümlerde bu hakları kullanamaz. Tarımsal taşınmazlara ilişkin miras hukuku hükümleri saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Üçüncü kişilere karşı dava">
                <mvz-madde no="241" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tasfiye sırasında, borçlu eşin malvarlığı veya terekesi, katılma alacağını karşılamadığı takdirde, alacaklı eş veya mirasçıları, edinilmiş mallarda hesaba katılması gereken karşılıksız kazandırmaları bunlardan yararlanan üçüncü kişilerden eksik kalan miktarla sınırlı olarak isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Dava hakkı, alacaklı eş veya mirasçılarının haklarının zedelendiğini öğrendikleri tarihten başlayarak bir yıl ve her hâlde mal rejiminin sona ermesinin üzerinden beş yıl geçmekle düşer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Yukarıdaki fıkra hükümleri ve yetki kuralları dışında mirastaki tenkis davasına ilişkin hükümler kıyas yoluyla uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="MAL AYRILIĞI">
          <mvz-b1 no="A" başlık="Yönetim, yararlanma ve tasarruf">
            <mvz-madde no="242" başlık="">
              <mvz-fıkra no="1">
                <template>Mal ayrılığı rejiminde eşlerden her biri, yasal sınırlar içerisinde kendi malvarlığı üzerinde yönetim, yararlanma ve tasarruf haklarını korur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Diğer hükümler">
            <mvz-madde no="243" başlık="">
              <mvz-fıkra no="1">
                <template>İspat, borçlardan sorumluluk ve paylı mülkün özgülenmesi konularında paylaşmalı mal ayrılığı rejimine ilişkin hükümler uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="PAYLAŞMALI MAL AYRILIĞI">
          <mvz-b1 no="A" başlık="Yönetim, yararlanma ve tasarruf">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="244" başlık="">
                <mvz-fıkra no="1">
                  <template>Eşlerden her biri, yasal sınırlar içerisinde kendi malvarlığı üzerinde yönetim, yararlanma ve tasarruf haklarını korur.</template>

            </mvz-b2>

              <mvz-fıkra no="1">
                <template>Eşlerden her biri, kendi borçlarından bütün malvarlığıyla sorumludur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Mal rejiminin sona ermesi ve tasfiye">
            <mvz-b2 no="I" başlık="Sona erme anı">
              <mvz-madde no="247" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal rejimi, eşlerden birinin ölümü veya başka bir mal rejiminin kabulüyle sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mahkemece evliliğin iptal veya boşanma sebebiyle sona erdirilmesine veya mal ayrılığına geçilmesine karar verilmesi hâllerinde de, mal rejimi dava tarihinden geçerli olmak üzere sona erer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Malların geri alınması ve paylı malın verilmesi">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="248" başlık="">
                  <mvz-fıkra no="1">
                    <template>Her eş, diğer eşte bulunan mallarını geri alır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Paylaşmalı mal ayrılığı rejimi sona erdiğinde, üstün yararı olduğunu ispat eden eş, diğer önlemler yanında, eşine payının ödeme günündeki karşılığını vermek suretiyle paylı mülkiyetteki malın kendisine verilmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Katkıdan doğan hak">
                <mvz-madde no="249" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerden biri diğerine ait olup, paylaştırma dışı kalan bir malın edinilmesine, iyileştirilmesine veya korunmasına hiç ya da uygun bir karşılık almaksızın katkıda bulunmuşsa; mal rejiminin sona ermesi hâlinde, katkısı oranında hakkaniyete uygun bir bedel ödenmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Aynı istem, paylaştırma dışı kalan malın yerine geçen değerler için de geçerlidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Aileye özgülenen mallar">
              <mvz-b3 no="1" başlık="Kural">
                <mvz-madde no="250" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerden biri tarafından paylaşmalı mal ayrılığı rejiminin kurulmasından sonra edinilmiş olup ailenin ortak kullanım ve yararlanmasına özgülenmiş mallar ile ailenin ekonomik geleceğini güvence altına almaya yönelik yatırımlar veya bunların yerine geçen değerler, mal rejiminin sona ermesi hâlinde eşler arasında eşit olarak paylaşılır. Paylaştırmada işletmelerin ekonomik bütünlüğü gözetilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Manevî tazminat alacakları, miras yoluyla edinilen mallar ile karşılıksız kazandırmada bulunanın açık iradesinden aksi anlaşılmadıkça, sağlararası veya ölüme bağlı tasarruflarla edinilen mallar hakkında bu hüküm uygulanmaz.</template>
                  </mvz-fıkra>
                </mvz-madde>

              <mvz-b3 no="2" başlık="Paylaşmaya aykırı davranışlar">
                <mvz-madde no="251" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerden biri, diğer eşin payını azaltmak kastıyla paylaşmadan önce bir malı karşılıksız olarak elden çıkardığı takdirde hâkim, diğer eşin alacağı denkleştirme bedelini hakkaniyete uygun olarak belirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Mal rejiminin sona ermesinden önceki bir yıl içinde diğer eşin rızası olmadan olağan hediyeler dışında yapılan karşılıksız kazandırmaların bu eşin payını azaltmak kastıyla yapıldığı varsayılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bu tür kazandırmalara ilişkin uyuşmazlıklarda mahkeme kararı, davanın kendisine ihbar edilmiş olması koşuluyla, kazandırmadan yararlanan üçüncü kişilere karşı da ileri sürülebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Paylaştırma isteminin reddi">
                <mvz-madde no="252" başlık="">
                  <mvz-fıkra no="1">
                    <template>Zina veya hayata kast nedeniyle boşanma hâlinde hâkim, kusurlu eşin payının hakkaniyete uygun olarak azaltılmasına veya kaldırılmasına karar verebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Paylaştırma yöntemi">
                <mvz-madde no="253" başlık="">
                  <mvz-fıkra no="1">
                    <template>Paylaştırmanın ayın olarak yapılması asıldır. Buna olanak yoksa bedel eklemek suretiyle paylar denkleştirilir. Eşlerden birinin diğerine ödeyeceği bedel, malların tasfiye anındaki sürüm değerlerine göre hesaplanır. Bu hesaplamada paylaşım konusu malların edinilmesinden doğan borçlar indirilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Denkleştirme bedelinin derhal ödenmesi kendisi için ciddî güçlükler doğuracaksa, borçlu eş ödemelerin uygun bir süre ertelenmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Aksine anlaşma yoksa, tasfiyenin sona ermesinden başlayarak denkleştirme bedeline faiz yürütülür; durum ve koşullar gerektiriyorsa ayrıca borçludan güvence istenebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Aile konutu ve ev eşyası">
              <mvz-b3 no="1" başlık="İptal veya boşanma hâlinde">
                <mvz-madde no="254" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evliliğin iptal veya boşanma kararıyla sona erdirilmesi hâlinde, ailenin ortak kullanımına özgülenmiş ve eşler arasında eşit olarak paylaşma konusu olan konutta kalmaya ve ev eşyasını kullanmaya hangisinin devam edeceği konusunda eşler anlaşabilirler. Konutta kalma hakkını elde eden eş, bu hakkın tapu kütüğüne şerh edilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Eşlerin aile konutunda kimin kalmaya ve ev eşyasını kimin kullanmaya devam edeceği konusunda anlaşamamaları hâlinde, hakkaniyet gerektiriyorsa hâkim, olayın özelliklerini, eşlerin ekonomik ve sosyal durumlarını ve varsa çocukların menfaatlerini göz önünde bulundurarak bu hakka hangisinin sahip olacağına iptal veya boşanma kararıyla birlikte re'sen karar verir; bu kararında kalma ve kullanma süresini belirleyerek tapu kütüğüne şerhi için tapu memurluğuna bildirir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Hâkim aksine karar vermedikçe hak, belirlenen sürenin bitiminde kendiliğinden sona erer. Ancak, bu süre sona ermeden yararlanan tarafın durumunda değişiklik olması hâlinde, diğer taraf hâkimden, kararın gözden geçirilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Eşler konutta kira ile oturuyorlarsa hâkim, gerektiğinde konutta kiracı sıfatı taşımayan eşin kalmasına karar verebilir. Bu durumda, kiralayanın sözleşmeden doğan haklarını güvenceye almak için gerekli düzenleme yapılmasına iptal veya boşanma kararıyla birlikte re'sen karar verilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Ölüm hâlinde">
                <mvz-madde no="255" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerden birinin ölümü hâlinde, paylaşma konusu olan mallar arasında ev eşyası veya eşlerin birlikte yaşadıkları konut varsa; sağ kalan eş, bunlar üzerinde kendisine miras ve paylaşmadan doğan hakkına mahsup edilmek ve yetmezse bir bedel eklenmek suretiyle mülkiyet hakkı tanınmasını isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Haklı sebeplerin varlığı hâlinde sağ kalan eşin veya ölenin diğer yasal mirasçılardan birinin istemi üzerine, mülkiyet yerine intifa veya oturma hakkı tanınmasına da karar verilebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Sağ kalan eş, mirasbırakanın bir meslek veya sanat icra ettiği ve altsoyundan birinin aynı meslek veya sanatı icra etmesi için gerekli olan bölümlerde bu hakları kullanamaz. Tarımsal taşınmazlara ilişkin miras hükümleri saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="5-BEŞİNCİ" başlık="MAL ORTAKLIĞI">

            <mvz-b2 no="I" başlık="Kapsamı">
              <mvz-madde no="256" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal ortaklığı rejimi, ortaklık malları ile eşlerin kişisel mallarını kapsar.</template>
                </mvz-fıkra>

              <mvz-b3 no="1" başlık="Genel mal ortaklığı">
                <mvz-madde no="257" başlık="">
                  <mvz-fıkra no="1">
                    <template>Genel mal ortaklığında eşlerin kanun gereğince kişisel mal sayılanlar dışındaki malları ile gelirleri ortaklık mallarını oluşturur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Eşler, ortaklık mallarına bölünmemiş bir bütün olarak sahip olurlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Hiçbir eş, ortaklık payı üzerinde tek başına tasarruf hakkına sahip değildir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Sınırlı mal ortaklığı">
                <mvz-b4 no="a" başlık="Edinilmiş mallarda ortaklık">
                  <mvz-madde no="258" başlık="">
                    <mvz-fıkra no="1">
                      <template>Eşler, mal rejimi sözleşmesiyle sadece edinilmiş mallardan oluşan bir ortaklık kabul edebilirler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Kişisel malların gelirleri de bu ortaklığa dahildir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Diğer mal ortaklıkları">
                  <mvz-madde no="259" başlık="">
                    <mvz-fıkra no="1">
                      <template>Eşler, mal rejimi sözleşmesiyle belirli malvarlığı değerlerini veya türlerini, özellikle taşınmaz malları, bir eşin kazancını, bir meslek veya sanat icrası için kullandığı malları ortaklık dışında tutabilirler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Aksi sözleşmede öngörülmedikçe bu malların gelirleri ortaklığa dahil değildir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Kişisel mallar">
              <mvz-madde no="260" başlık="">
                <mvz-fıkra no="1">
                  <template>Kişisel mallar, mal rejimi sözleşmesi, üçüncü kişinin karşılıksız kazandırması veya kanunla belirlenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Eşlerden her birinin sadece kişisel kullanımına ayrılmış olan eşyası ile manevî tazminat alacakları kanundan dolayı kişisel malıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bir eşin saklı pay olarak isteyebileceği malvarlığı değerleri, mal rejimi sözleşmesiyle ortaklığa dahil edildiği ölçüde, mirasbırakanları tarafından kendisine kişisel mal olarak kazandırılamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="İspat">
              <mvz-madde no="261" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir eşin kişisel malı olduğu ispatlanmadıkça tüm malvarlığı değerleri ortaklık malı sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Yönetim ve tasarruf">
            <mvz-b2 no="I" başlık="Ortaklık mallarında">
              <mvz-b3 no="1" başlık="Olağan yönetim">
                <mvz-madde no="262" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşler, ortaklık mallarını evlilik birliğinin yararına uygun olarak yönetirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Olağan yönetim sınırları içinde her eş, ortaklığı yükümlülük altına sokabilir ve ortak mallarda tasarrufta bulunabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Olağanüstü yönetim">
                <mvz-madde no="263" başlık="">
                  <mvz-fıkra no="1">
                    <template>Olağan yönetim dışında kalan konularda eşler, ancak birlikte veya biri diğerinin rızasını almak suretiyle ortaklığı yükümlülük altına sokabilir veya mallarda tasarrufta bulunabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Rızanın bulunmadığını bilmeyen veya bilecek durumda olmayan üçüncü kişiler için bu rıza var sayılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Evlilik birliğinin temsiline ilişkin hükümler saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Ortaklık malları ile meslek veya sanat icrası">
                <mvz-madde no="264" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerden biri, diğerinin rızasıyla ortaklık mallarını kullanarak, tek başına bir meslek veya sanat icra ederse, bu meslek veya sanata ilişkin bütün hukukî işlemleri yapabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Mirasın kabulü veya reddi">
                <mvz-madde no="265" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerden biri, diğerinin rızası olmaksızın ortaklık mallarına girecek olan bir mirası reddemeyeceği gibi, tereke borca batıksa mirası kabul de edemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Diğer eşin rızasının alınmasına olanak bulunamazsa veya bu konudaki istem onun tarafından haklı sebep olmaksızın reddedilirse, istem sahibi eş kendi yerleşim yeri mahkemesine başvurabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="5" başlık="Sorumluluk ve yönetim giderleri">
                <mvz-madde no="266" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mal ortaklığının sona ermesi hâlinde, eşlerden her biri ortaklık malıyla ilgili işlemlerden dolayı vekil gibi sorumludur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Yönetim giderleri ortaklık mallarından karşılanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Kişisel mallar">
              <mvz-madde no="267" başlık="">
                <mvz-fıkra no="1">
                  <template>Eşlerden her biri, yasal sınırlar içerisinde kendi kişisel mallarını yönetme ve bunlar üzerinde tasarrufta bulunma hakkına sahiptir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kişisel mallara giren gelirler varsa, yönetim giderleri bu gelirlerden karşılanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Üçüncü kişilere karşı sorumluluk">
            <mvz-b2 no="I" başlık="Ortaklık borçları">
              <mvz-madde no="268" başlık="">
                <mvz-fıkra no="1">
                  <template>Eşlerden her biri, aşağıdaki borçlardan kişisel malları ve ortaklık mallarıyla sorumludur:</template>
                  <mvz-bent no="1.">
                    <template>Evlilik birliğini temsil veya ortaklık mallarını yönetme yetkisine dayanarak yapılan borçlardan,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Ortaklık mallarını veya ortaklık mallarına giren gelirleri kullanarak bir meslek veya sanatın icra edilmesi nedeniyle yapılan borçlardan,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Diğer eş için de kişisel sorumluluk doğuran borçlardan,</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Kişisel mal yanında ortaklık mallarının da sorumlu olacağı hususunda eşlerin üçüncü kişilerle anlaşarak yaptığı borçlardan.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Kişisel borçlar">
              <mvz-madde no="269" başlık="">
                <mvz-fıkra no="1">
                  <template>Her eş, diğer bütün borçlardan kendi kişisel mallarıyla ve ortaklık mallarının değerinin yarısı kadarıyla sorumlu tutulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ortaklığın zenginleşmesinden kaynaklanan istemler saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Eşler arasındaki borçlar">
            <mvz-madde no="270" başlık="">
              <mvz-fıkra no="1">
                <template>Mal rejimi eşler arasındaki borçların muaccel olmasını önlemez. Bununla beraber bir borcun yerine getirilmesi borçlu eşi, evlilik birliğini tehlikeye düşürecek derecede önemli güçlüklere sokacaksa, bu eş ödeme için süre isteyebilir. Durum ve koşullar gerektiriyorsa hâkim, istemde bulunan eşi güvence göstermekle yükümlü tutar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Mal rejiminin sona ermesi ve tasfiye">
            <mvz-b2 no="I" başlık="Sona erme anı">
              <mvz-madde no="271" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal rejimi eşlerden birinin ölümü, diğer bir mal rejiminin kabul edilmesi veya eşlerden biri hakkında iflâsın açılmasıyla son bulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Mahkemece evliliğin iptal veya boşanma sebebiyle sona erdirilmesine veya mal ayrılığına geçilmesine karar verilmesi hâllerinde, mal rejimi dava tarihinden geçerli olmak üzere sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ortaklık mallarıyla kişisel malların kapsamının belirlenmesinde mal ortaklığının sona erdiği tarih esas alınır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Kişisel mala ekleme">
              <mvz-madde no="272" başlık="">
                <mvz-fıkra no="1">
                  <template>Eşlerden birine sosyal güvenlik veya sosyal yardım kurumlarınca yapılmış olan toptan ödemeler veya iş gücünün kaybı dolayısıyla ödenmiş olan tazminat, toptan ödeme veya tazminat yerine ilgili sosyal güvenlik veya sosyal yardım kurumunca uygulanan usule göre ömür boyunca irat bağlanmış olsaydı, mal rejiminin sona erdiği tarihte bundan sonraki döneme ait iradın peşin sermayeye çevrilmiş değeri ne olacak idiyse, tasfiyede o miktarda kişisel mal olarak hesaba katılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Kişisel mal ile ortaklık malı arasındaki denkleştirme">
              <mvz-madde no="273" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir eşin kişisel mallara ilişkin borçları, ortaklık mallarından veya ortaklık mallarına ilişkin borçları kişisel mallarından ödenmiş ise; tasfiye sırasında denkleştirme istenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Her borç, ilişkin bulunduğu mal kesimini yükümlülük altına sokar. Hangi kesime ait olduğu anlaşılamayan borç ortaklık mallarına ilişkin sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Değer artış payı">
              <mvz-madde no="274" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir eşin kişisel malı veya ortaklık malıyla bir başka mal kesimine giren malvarlığı değerinin edinilmesi, iyileştirilmesi veya korunmasına katkıda bulunulmuşsa, edinilmiş mallara katılma rejiminde değer artış payına ilişkin hükümler uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Değer belirlenmesi">
              <mvz-madde no="275" başlık="">
                <mvz-fıkra no="1">
                  <template>Mal rejimi sona erince, mevcut ortaklık mallarının değerlendirilmesinde tasfiye anı esas alınır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Paylaşma">
              <mvz-b3 no="1" başlık="Ölüm veya diğer bir mal rejiminin kabulü hâlinde">
                <mvz-madde no="276" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerden birinin ölümü veya diğer bir mal rejiminin kabulü sebebiyle mal ortaklığının sona ermesi hâlinde, her eşe veya mirasçılarına ortaklık mallarının yarısı verilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Mal rejimi sözleşmesiyle başka bir paylaşma oranı kararlaştırılabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bu tür anlaşmalar altsoyun saklı paylarını zedeleyemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Diğer hâllerde">
                <mvz-madde no="277" başlık="">
                  <mvz-fıkra no="1">
                    <template>Boşanma veya evliliğin iptali sebebiyle ya da kanun veya mahkeme kararı gereğince mal ayrılığına geçiş hâllerinde, her eş edinilmiş mallara katılma rejiminde kendi kişisel malı sayılacak olanları ortaklık mallarından geri alır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Geri kalan ortaklık malları eşler arasında yarı yarıya paylaşılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Yasal paylaşmanın değiştirilmesine ilişkin anlaşmalar, ancak mal rejimi sözleşmesinde bunun açıkça öngörülmüş olması hâlinde geçerlidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="VII" başlık="Paylaşma usulü">
              <mvz-b3 no="1" başlık="Kişisel mallar">
                <mvz-madde no="278" başlık="">
                  <mvz-fıkra no="1">
                    <template>Mal ortaklığının eşlerden birinin ölümüyle sona ermesi hâlinde sağ kalan eş, edinilmiş mallara katılma rejiminde kişisel malı sayılabilecek olanların payına mahsuben kendisine verilmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Aile konutu ve ev eşyası">
                <mvz-madde no="279" başlık="">
                  <mvz-fıkra no="1">
                    <template>Eşlerin birlikte yaşadıkları konut veya ev eşyası ortaklık mallarına dahil ise, sağ kalan eş, payına mahsuben bunların mülkiyetinin kendisine verilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Haklı sebeplerin varlığı hâlinde, sağ kalan eş veya ölenin diğer yasal mirasçılarının istemiyle bunlar üzerinde mülkiyet yerine intifa veya oturma hakkı tanınabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Mal ortaklığı rejiminin ölüm dışındaki bir sebeple son bulması hâlinde, eşlerden her biri, üstün bir yararının varlığını ispat etmek suretiyle aynı istemleri ileri sürebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Diğer malvarlığı değerleri">
                <mvz-madde no="280" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir eş, üstün bir yararının varlığını ispat etmek suretiyle diğer malvarlığı değerlerinin de payına mahsuben kendisine verilmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="4" başlık="Diğer paylaşma kuralları">
                <mvz-madde no="281" başlık="">
                  <mvz-fıkra no="1">
                    <template>Diğer hâllerde paylı mülkiyet ve mirasın paylaşılmasına ilişkin hükümler kıyas yoluyla uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="HISIMLIK">
      <mvz-bölüm no="1-BİRİNCİ" başlık="SOYBAĞININ KURULMASI">
        <mvz-ayırım no="1-BİRİNCİ" başlık="GENEL HÜKÜMLER">
          <mvz-b1 no="A" başlık="Genel olarak soybağının kurulması">
            <mvz-madde no="282" başlık="">
              <mvz-fıkra no="1">
                <template>Çocuk ile ana arasında soybağı doğumla kurulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Çocuk ile baba arasında soybağı, ana ile evlilik, tanıma veya hâkim hükmüyle kurulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Soybağı ayrıca evlât edinme yoluyla da kurulur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Davada yetki ve yargılama usulü">
            <mvz-b2 no="I" başlık="Yetki">
              <mvz-madde no="283" başlık="">
                <mvz-fıkra no="1">
                  <template>Soybağına ilişkin davalar, taraflardan birinin dava veya doğum sırasındaki yerleşim yeri mahkemesinde açılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Yargılama usulü">
              <mvz-madde no="284" başlık="">
                <mvz-fıkra no="1">
                  <template>Soybağına ilişkin davalarda, aşağıdaki kurallar saklı kalmak kaydıyla Hukuk Usulü Muhakemeleri Kanunu uygulanır:</template>
                  <mvz-bent no="1.">
                    <template>Hâkim maddî olguları re'sen araştırır ve kanıtları serbestçe takdir eder.</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Taraflar ve üçüncü kişiler, soybağının belirlenmesinde zorunlu olan ve sağlıkları yönünden tehlike yaratmayan araştırma ve incelemelere rıza göstermekle yükümlüdürler. Davalı, hâkimin öngördüğü araştırma ve incelemeye rıza göstermezse, hâkim, durum ve koşullara göre bundan beklenen sonucu, onun aleyhine doğmuş sayabilir.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="2-İKİNCİ" başlık="KOCANIN BABALIĞI">
          <mvz-b1 no="A" başlık="Babalık karinesi">
            <mvz-madde no="285" başlık="">
              <mvz-fıkra no="1">
                <template>Evlilik devam ederken veya evliliğin sona ermesinden başlayarak üçyüz gün içinde doğan çocuğun babası kocadır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu süre geçtikten sonra doğan çocuğun kocaya bağlanması, ananın evlilik sırasında gebe kaldığının ispatıyla mümkündür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kocanın gaipliğine karar verilmesi hâlinde üçyüz günlük süre, ölüm tehlikesi veya son haber tarihinden işlemeye başlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Soybağının reddi">
            <mvz-b2 no="I" başlık="Dava hakkı">
              <mvz-madde no="286" başlık="">
                <mvz-fıkra no="1">
                  <template>Koca, ana veya çocuk soybağının reddi davasını açarak babalık karinesini çürütebilir. Bu dava, dava açma hakkına sahip diğer kişilere karşı açılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="İspat">
              <mvz-b3 no="1" başlık="Evlilik içinde ana rahmine düşme">
                <mvz-madde no="287" başlık="">
                  <mvz-fıkra no="1">
                    <template>Çocuk evlilik içinde ana rahmine düşmüşse davacı, kocanın baba olmadığını ispat etmek zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Evlenmeden başlayarak en az yüzseksen gün geçtikten sonra ve evliliğin sona ermesinden başlayarak en fazla üçyüz gün içinde doğan çocuk evlilik içinde ana rahmine düşmüş sayılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Evlenmeden önce veya ayrı yaşama sırasında ana rahmine düşme">
                <mvz-madde no="288" başlık="">
                  <mvz-fıkra no="1">
                    <template>Çocuk, evlenmeden önce veya ayrı yaşama sırasında ana rahmine düşmüşse, davacının başka bir kanıt getirmesi gerekmez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ancak, gebe kalma döneminde kocanın karısı ile cinsel ilişkide bulunduğu konusunda inandırıcı kanıtlar varsa, kocanın babalığına ilişkin karine geçerliliğini korur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Hak düşürücü süreler">
              <mvz-madde no="289" başlık="">
                <mvz-fıkra no="1">
                  <template>Koca, davayı, doğumu ve baba olmadığını veya ananın gebe kaldığı sırada başka bir erkek ile cinsel ilişkide bulunduğunu öğrendiği tarihten başlayarak bir yıl,  içinde açmak zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ana doğumdan, çocuk ise ergin olduğu tarihten başlayarak en geç bir yıl içinde dava açmak zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Gecikme haklı bir sebebe dayanıyorsa, bir yıllık süre bu sebebin ortadan kalktığı tarihte işlemeye başlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Karinelerin çakışması">
            <mvz-madde no="290" başlık="">
              <mvz-fıkra no="1">
                <template>Çocuk evliliğin sona ermesinden başlayarak üçyüz gün içinde doğmuş ve ana da bu arada yeniden evlenmiş olursa, ikinci evlilikteki koca baba sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu karine çürütülürse ilk evlilikteki koca baba sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Diğer ilgililerin dava hakkı">
            <mvz-madde no="291" başlık="">
              <mvz-fıkra no="1">
                <template>Dava açma süresinin geçmesinden önce kocanın ölmesi veya gaipliğine karar verilmesi ya da sürekli olarak ayırt etme gücünü kaybetmesi hâllerinde baba olduğunu iddia eden kişi, kocanın altsoyu, anası veya babası, doğumu ve kocanın ölümünü, sürekli olarak ayırt etme gücünü kaybettiğini veya hakkında gaiplik kararı alındığını öğrenmelerinden başlayarak bir yıl içinde soybağının reddi davasını açabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ergin olmayan çocuğa atanacak kayyım, atama kararının kendisine tebliğinden başlayarak bir yıl,  içinde soybağının reddi davasını açar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kocanın açacağı soybağının reddi davasına ilişkin hükümler kıyas yoluyla uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Sonradan evlenme">
            <mvz-b2 no="I" başlık="Koşulu">
              <mvz-madde no="292" başlık="">
                <mvz-fıkra no="1">
                  <template>Evlilik dışında doğan çocuk, ana ve babasının birbiriyle evlenmesi hâlinde kendiliğinden evlilik içinde doğan çocuklara ilişkin hükümlere tâbi olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Bildirim">
              <mvz-madde no="293" başlık="">
                <mvz-fıkra no="1">
                  <template>Eşler, evlilik dışında doğmuş olan ortak çocuklarını, evlenme sırasında veya evlenmeden sonra, yerleşim yerlerindeki veya evlenmenin yapıldığı yerdeki nüfus memuruna bildirmek zorundadırlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bildirimin yapılmamış olması, çocuğun evlilik içinde doğan çocuklara ilişkin hükümlere tâbi olmasını engellemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Daha önce tanıma veya babalığa hükümle soybağı kurulmuş çocukların ana ve babası birbiriyle evlenince, nüfus memuru re'sen gerekli işlemi yapar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="İtiraz ve iptal">
              <mvz-madde no="294" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve babanın yasal mirasçıları, çocuk ve Cumhuriyet savcısı sonradan evlenme yoluyla soybağının kurulmasına itiraz edebilirler. İtiraz eden, kocanın baba olmadığını ispatla yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çocuğun altsoyu da, çocuğun ölmüş ya da ayırt etme gücünü sürekli olarak kaybetmiş olması hâlinde itiraz hakkına sahiptir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Tanımanın iptaline ilişkin hükümler kıyas yoluyla uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="TANIMA VE BABALIK HÜKMÜ">
          <mvz-b1 no="A" başlık="Tanıma">
            <mvz-b2 no="I" başlık="Koşulları ve şekli">
              <mvz-madde no="295" başlık="">
                <mvz-fıkra no="1">
                  <template>Tanıma, babanın, nüfus memuruna veya mahkemeye yazılı başvurusu ya da resmî senette veya vasiyetnamesinde yapacağı beyanla olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tanıma beyanında bulunan kimse küçük veya kısıtlı ise, veli veya vasisinin de rızası gereklidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Başka bir erkek ile soybağı bulunan çocuk, bu bağ geçersiz kılınmadıkça tanınamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Bildirim">
              <mvz-madde no="296" başlık="">
                <mvz-fıkra no="1">
                  <template>Beyanda bulunulan nüfus memuru, sulh hâkimi, noter veya vasiyetnameyi açan hâkim, tanımayı babanın ve çocuğun kayıtlı bulunduğu nüfus memurluklarına bildirir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çocuğun kayıtlı bulunduğu nüfus memurluğu da tanımayı çocuğa, anasına, çocuk vesayet altında ise vesayet makamına bildirir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="İptal davası">
              <mvz-b3 no="1" başlık="Tanıyanın dava hakkı">
                <mvz-madde no="297" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tanıyan, yanılma, aldatma veya korkutma sebebiyle tanımanın iptalini dava edebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İptal davası anaya ve çocuğa karşı açılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="İlgililerin dava hakkı">
                <mvz-b4 no="a" başlık="Genel olarak">
                  <mvz-madde no="298" başlık="">
                    <mvz-fıkra no="1">
                      <template>Ana, çocuk ve çocuğun ölümü hâlinde altsoyu, Cumhuriyet savcısı, Hazine ve diğer ilgililer tanımanın iptalini dava edebilirler.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Dava tanıyana, tanıyan ölmüşse mirasçılarına karşı açılır.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="İspat yükü">
                  <mvz-madde no="299" başlık="">
                    <mvz-fıkra no="1">
                      <template>Davacı, tanıyanın baba olmadığını ispatla yükümlüdür.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Ana veya çocuk tarafından tanıyanın baba olmadığı iddiasıyla açılan iptal davasında ispat yükü, tanıyanın, gebe kalma döneminde ana ile cinsel ilişkide bulunduğuna ilişkin inandırıcı kanıtları göstermesinden sonra doğar.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Hak düşürücü süreler">
                <mvz-madde no="300" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tanıyanın dava hakkı, iptal sebebinin öğrenildiği veya korkunun etkisinin ortadan kalktığı tarihten başlayarak bir yıl ve her hâlde tanımanın üzerinden beş yıl geçmekle düşer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İlgililerin dava hakkı, davacının tanımayı ve tanıyanın çocuğun babası olamayacağını öğrendiği tarihten başlayarak bir yıl ve her hâlde tanımanın üzerinden beş yıl geçmekle düşer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Çocuğun dava hakkı, ergin olmasından başlayarak bir yıl geçmekle düşer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Yukarıdaki süreler geçtiği hâlde gecikmeyi haklı kılan sebep varsa, sebebin ortadan kalkmasından başlayarak bir ay içinde dava açılabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Babalık hükmü">
            <mvz-b2 no="I" başlık="Dava hakkı">
              <mvz-madde no="301" başlık="">
                <mvz-fıkra no="1">
                  <template>Çocuk ile baba arasındaki soybağının mahkemece belirlenmesini ana ve çocuk isteyebilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Dava babaya, baba ölmüşse mirasçılarına karşı açılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Babalık davası, Cumhuriyet savcısına ve Hazineye; dava ana tarafından açılmışsa kayyıma; kayyım tarafından açılmışsa anaya ihbar edilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Karine">
              <mvz-madde no="302" başlık="">
                <mvz-fıkra no="1">
                  <template>Davalının, çocuğun doğumundan önceki üçyüzüncü gün ile yüzsekseninci gün arasında ana ile cinsel ilişkide bulunmuş olması, babalığa karine sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu sürenin dışında olsa bile fiilî gebe kalma döneminde davalının ana ile cinsel ilişkide bulunduğu tespit edilirse aynı karine geçerli olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Davalı, çocuğun babası olmasının olanaksızlığını veya bir üçüncü kişinin baba olma olasılığının kendisininkinden daha fazla olduğunu ispatlarsa karine geçerliliğini kaybeder.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Hak düşürücü süreler">
              <mvz-madde no="303" başlık="">
                <mvz-fıkra no="1">
                  <template>Babalık davası, çocuğun doğumundan önce veya sonra açılabilir. Ananın dava hakkı, doğumdan başlayarak bir yıl geçmekle düşer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2" durum="iptal">
                  <template></template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Çocuk ile başka bir erkek arasında soybağı ilişkisi varsa, bir yıllık süre bu ilişkinin ortadan kalktığı tarihte işlemeye başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Bir yıllık süre geçtikten sonra gecikmeyi haklı kılan sebepler varsa, sebebin ortadan kalkmasından başlayarak bir ay içinde dava açılabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Ananın malî hakları">
              <mvz-madde no="304" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana, babalık davası ile birlikte veya ayrı olarak baba veya mirasçılarından aşağıdaki giderlerin karşılanmasını isteyebilir:</template>
                  <mvz-bent no="1.">
                    <template>Doğum giderleri,</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Doğumdan önceki ve sonraki altışar haftalık geçim giderleri,</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Gebelik ve doğumun gerektirdiği diğer giderler.</template>
                  </mvz-bent>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çocuk ölü doğmuş olsa bile hâkim, bu giderlerin karşılanmasına karar verebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Üçüncü kişiler veya sosyal güvenlik kuruluşlarınca anaya yapılan ödemeler, hakkaniyet ölçüsünde tazminattan indirilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="EVLÂT EDİNME">
          <mvz-b1 no="A" başlık="Küçüklerin evlât edinilmesi">
            <mvz-b2 no="I" başlık="Genel koşulları">
              <mvz-madde no="305" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir küçüğün evlât edinilmesi, evlât edinen tarafından bir yıl süreyle bakılmış ve eğitilmiş olması koşuluna bağlıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Evlât edinmenin her hâlde küçüğün yararına bulunması ve evlât edinenin diğer çocuklarının yararlarının hakkaniyete aykırı bir biçimde zedelenmemesi de gerekir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Birlikte evlât edinme">
              <mvz-madde no="306" başlık="">
                <mvz-fıkra no="1">
                  <template>Eşler, ancak birlikte evlât edinebilirler; evli olmayanlar birlikte evlât edinemezler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Eşlerin en az beş yıldan beri evli olmaları veya otuz yaşını doldurmuş bulunmaları gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Eşlerden biri, en az iki yıldan beri evli olmaları veya kendisinin otuz yaşını doldurmuş bulunması koşuluyla diğerinin çocuğunu evlât edinebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Tek başına evlât edinme">
              <mvz-madde no="307" başlık="">
                <mvz-fıkra no="1">
                  <template>Evli olmayan kişi otuz yaşını doldurmuş ise tek başına evlât edinebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Otuz yaşını doldurmuş olan eş, diğer eşin ayırt etme gücünden sürekli olarak yoksunluğu veya iki yılı aşkın süreden beri nerede olduğunun bilinmemesi ya da mahkeme kararıyla iki yılı aşkın süreden beri eşinden ayrı yaşamakta olması yüzünden birlikte evlât edinmesinin mümkün olmadığını ispat etmesi hâlinde, tek başına evlât edinebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Küçüğün rızası ve yaşı">
              <mvz-madde no="308" başlık="">
                <mvz-fıkra no="1">
                  <template>Evlât edinilenin, evlât edinenden en az onsekiz yaş küçük olması şarttır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ayırt etme gücüne sahip olan küçük, rızası olmadıkça evlât edinilemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Vesayet altındaki küçük, ayırt etme gücüne sahip olup olmadığına bakılmaksızın vesayet dairelerinin izniyle evlât edinilebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Ana ve babanın rızası">
              <mvz-b3 no="1" başlık="Şekil">
                <mvz-madde no="309" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlât edinme, küçüğün ana ve babasının rızasını gerektirir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Rıza, küçüğün veya ana ve babasının oturdukları yer mahkemesinde sözlü veya yazılı olarak açıklanarak tutanağa geçirilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Verilen rıza, evlât edinenlerin adları belirtilmemiş veya evlât edinenler henüz belirlenmemiş olsa dahi geçerlidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Zamanı">
                <mvz-madde no="310" başlık="">
                  <mvz-fıkra no="1">
                    <template>Rıza, küçüğün doğumunun üzerinden altı hafta geçmeden önce verilemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Rıza, tutanağa geçirilme tarihinden başlayarak altı hafta içinde aynı usulle geri alınabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Geri almadan sonra yeniden verilen rıza kesindir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="3" başlık="Rızanın aranmaması">
                <mvz-b4 no="a" başlık="Koşulları">
                  <mvz-madde no="311" başlık="">
                    <mvz-fıkra no="1">
                      <template>Aşağıdaki hâllerde ana ve babadan birinin rızası aranmaz:</template>
                      <mvz-bent no="1.">
                        <template>Kim olduğu veya uzun süreden beri nerede oturduğu bilinmiyorsa veya ayırt etme gücünden sürekli olarak yoksun bulunuyorsa,</template>
                      </mvz-bent>
                      <mvz-bent no="2.">
                        <template>Küçüğe karşı özen yükümlülüğünü yeterince yerine getirmiyorsa.</template>
                      </mvz-bent>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
                <mvz-b4 no="b" başlık="Karar">
                  <mvz-madde no="312" başlık="">
                    <mvz-fıkra no="1">
                      <template>Küçük, gelecekte evlât edinilmek amacıyla bir kuruma yerleştirilir ve ana ve babadan birinin rızası eksik olursa, evlât edinenin veya evlât edinmede aracılık yapan kurumun istemi üzerine ve kural olarak küçüğün yerleştirilmesinden önce, onun oturduğu yer mahkemesi bu rızanın aranıp aranmamasına karar verir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="2">
                      <template>Diğer hâllerde, bu konudaki karar evlât edinme işlemleri sırasında verilir.</template>
                    </mvz-fıkra>
                    <mvz-fıkra no="3">
                      <template>Ana ve babadan birinin küçüğe karşı özen yükümlülüğünü yeterince yerine getirmemesi sebebiyle rızasının aranmaması hâlinde, bu konudaki karar kendisine yazılı olarak bildirilir.</template>
                    </mvz-fıkra>
                  </mvz-madde>
                </mvz-b4>
              </mvz-b3>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Erginlerin ve kısıtlıların evlât edinilmesi">
            <mvz-madde no="313" başlık="">
              <mvz-fıkra no="1">
                <template>Evlât edinenin altsoyunun açık muvafakatiyle ergin veya kısıtlı aşağıdaki hallerde evlât edinilebilir.</template>
                <mvz-bent no="1.">
                  <template>Bedensel veya zihinsel engeli sebebiyle sürekli olarak yardıma muhtaç ve evlât edinen tarafından en az beş yıldan beri bakılıp gözetilmekte ise,</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Evlât edinen tarafından, küçükken en az beş yıl süreyle bakılıp gözetilmiş ve eğitilmiş ise,</template>
                </mvz-bent>
                <mvz-bent no="3.">
                  <template>Diğer haklı sebepler mevcut ve evlât edinilen, en az beş yıldan beri evlât edinen ile aile hâlinde birlikte yaşamakta ise.</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Evli bir kimse ancak eşinin rızasıyla evlât edinilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bunlar dışında küçüklerin evlât edinilmesine ilişkin hükümler kıyas yoluyla uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Hükümleri">
            <mvz-madde no="314" başlık="">
              <mvz-fıkra no="1">
                <template>Ana ve babaya ait olan haklar ve yükümlülükler evlât edinene geçer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Evlâtlık, evlât edinenin mirasçısı olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Evlâtlık küçük ise evlât edinenin soyadını alır. Evlât edinen isterse çocuğa yeni bir ad verebilir. Ergin olan evlâtlık, evlât edinilme sırasında dilerse evlât edinenin soyadını alabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Ayırt etme gücüne sahip olmayan küçüklerin nüfus kaydına, birlikte evlât edinmede ana ve baba adı olarak evlât edinen eşlerin adları; tek başına evlât edinmede ise ana veya baba adı olarak evlât edinenin adı yazılır. Evlât edinilen diğer kişiler hakkında, talepleri halinde bu hüküm uygulanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Evlâtlığın, miras ve başka haklarının zedelenmemesi, aile bağlarının devam etmesi için evlâtlığın naklen geldiği aile kütüğü ile evlât edinenin aile kütüğü arasında her türlü bağ kurulur. Ayrıca evlâtlıkla ilgili kesinleşmiş mahkeme kararı her iki nüfus kütüğüne işlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Evlât edinme ile ilgili kayıtlar, belgeler ve bilgiler mahkeme kararı olmadıkça veya evlâtlık istemedikçe hiçbir şekilde açıklanamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Şekil ve usul">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="315" başlık="">
                <mvz-fıkra no="1">
                  <template>Evlât edinme kararı, evlât edinenin oturma yeri; birlikte evlât edinmede eşlerden birinin oturma yeri mahkemesince verilir. Mahkeme kararıyla birlikte evlâtlık ilişkisi kurulmuş olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Evlât edinme başvurusundan sonra evlât edinenin ölümü veya ayırt etme gücünü kaybetmesi, diğer koşullar bundan etkilenmediği takdirde evlât edinmeye engel olmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Başvurudan sonra küçük ergin olursa, koşulları daha önceden yerine getirilmiş olmak kaydıyla küçüklerin evlât edinilmesine ilişkin hükümler uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Araştırma">
              <mvz-madde no="316" başlık="">
                <mvz-fıkra no="1">
                  <template>Evlât edinmeye, ancak esaslı sayılan her türlü durum ve koşulların kapsamlı biçimde araştırılmasından, evlât edinen ile edinilenin dinlenmelerinden ve gerektiğinde uzmanların görüşünün alınmasından sonra karar verilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Araştırmada özellikle evlât edinen ile edinilenin kişiliği ve sağlığı, karşılıklı ilişkileri, ekonomik durumları, evlât edinenin eğitme yeteneği, evlât edinmeye yönelten sebepler ve aile ilişkileri ile bakım ilişkilerindeki gelişmelerin açıklığa kavuşturulması gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Evlât edinenin altsoyu varsa, onların evlât edinme ile ilgili tavır ve düşünceleri de değerlendirilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="E" başlık="Evlâtlık ilişkisinin kaldırılması">
            <mvz-b2 no="I" başlık="Sebepleri">
              <mvz-b3 no="1" başlık="Rızanın bulunmaması">
                <mvz-madde no="317" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yasal sebep bulunmaksızın rıza alınmamışsa, rızası alınması gereken kişiler, küçüğün menfaati bunun sonucunda ağır biçimde zedelenmeyecekse, hâkimden evlâtlık ilişkisinin kaldırılmasını isteyebilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Diğer noksanlıklar">
                <mvz-madde no="318" başlık="">
                  <mvz-fıkra no="1">
                    <template>Evlât edinme esasa ilişkin diğer noksanlıklardan biriyle sakatsa, Cumhuriyet savcısı veya her ilgili evlâtlık ilişkisinin kaldırılmasını isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Noksanlıklar bu arada ortadan kalkmış veya sadece usule ilişkin olup ilişkinin kaldırılması evlâtlığın menfaatini ağır biçimde zedeleyecek olursa, bu yola gidilemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Hak düşürücü süre">
              <mvz-madde no="319" başlık="">
                <mvz-fıkra no="1">
                  <template>Dava hakkı, evlâtlık ilişkisinin kaldırılması sebebinin öğrenilmesinden başlayarak bir yıl  geçmekle düşer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="F" başlık="Evlâtlık işlemlerinde aracılık">
            <mvz-madde no="320" başlık="">
              <mvz-fıkra no="1">
                <template>Küçüklerin evlât edinilmesine ilişkin aracılık faaliyetleri, ancak Cumhurbaşkanınca yetki verilen kurum ve kuruluşlarca yapılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aracılık faaliyetlerinin yürütülmesine ilişkin hususlar Cumhurbaşkanınca çıkarılan yönetmelikle düzenlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="5-BEŞİNCİ" başlık="SOYBAĞININ HÜKÜMLERİ">
          <mvz-b1 no="A" başlık="Soyadı">
            <mvz-madde no="321" başlık="">
              <mvz-fıkra no="1">
                <template>Çocuk, ana ve baba evli ise ailenin;  soyadını taşır. Ancak, ana önceki evliliğinden dolayı çifte soyadı taşıyorsa çocuk onun bekârlık soyadını taşır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Karşılıklı yükümlülükler">
            <mvz-madde no="322" başlık="">
              <mvz-fıkra no="1">
                <template>Ana, baba ve çocuk, ailenin huzur ve bütünlüğünün gerektirdiği şekilde birbirlerine yardım etmek, saygı ve anlayış göstermek ve aile onurunu gözetmekle yükümlüdürler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b1>
          <mvz-b1 no="C" başlık="Çocuk ile kişisel ilişki">
            <mvz-b2 no="I" başlık="Ana ve baba ile">
              <mvz-b3 no="1" başlık="Kural">
                <mvz-madde no="323" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ana ve babadan her biri, velâyeti altında bulunmayan veya kendisine bırakılmayan çocuk ile uygun kişisel ilişki kurulmasını isteme hakkına sahiptir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Sınırları">
                <mvz-madde no="324" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ana ve babadan her biri, diğerinin çocuk ile kişisel ilişkisini zedelemekten, çocuğun eğitilmesi ve yetiştirilmesini engellemekten kaçınmakla yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Kişisel ilişki sebebiyle çocuğun huzuru tehlikeye girer veya ana ve baba bu haklarını birinci fıkrada öngörülen yükümlülüklerine aykırı olarak kullanırlar veya çocuk ile ciddî olarak ilgilenmezler ya da diğer önemli sebepler varsa, kişisel ilişki kurma hakkı reddedilebilir veya kendilerinden alınabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Velayet kendisine bırakılan ana veya baba, kişisel ilişki düzenlemesinin gereklerini yerine getirmezse çocuğun menfaatine aykırı olmamak kaydıyla velayet değiştirilebilir. Bu husus kişisel ilişki kurulmasına dair kararda taraflara ihtar edilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Üçüncü kişiler ile">
              <mvz-madde no="325" başlık="">
                <mvz-fıkra no="1">
                  <template>Olağanüstü hâller mevcutsa, çocuğun menfaatine uygun düştüğü ölçüde çocuk ile kişisel ilişki kurulmasını isteme hakkı diğer kişilere, özellikle hısımlarına da tanınabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ana ve baba için öngörülen sınırlamalar üçüncü kişiler için kıyas yoluyla uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Yetki">
              <mvz-madde no="326" başlık="">
                <mvz-fıkra no="1">
                  <template>Kişisel ilişki kurulmasıyla ilgili bütün düzenlemelerde çocuğun oturduğu yer mahkemesi de yetkilidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Boşanmaya ve evlilik birliğinin korunmasına ilişkin yetki kuralları saklıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Çocuk ile kişisel ilişkiye yönelik bir düzenleme yapılıncaya kadar, velâyet hakkına sahip veya çocuk kendisine bırakılmış kişinin rızası dışında kişisel ilişki kurulamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="D" başlık="Çocukların bakım ve eğitim giderlerini karşılama">
            <mvz-b2 no="I" başlık="Kapsamı">
              <mvz-madde no="327" başlık="">
                <mvz-fıkra no="1">
                  <template>Çocuğun bakımı, eğitimi ve korunması için gerekli giderler ana ve baba tarafından karşılanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ana ve baba, yoksul oldukları veya çocuğun özel durumu olağanüstü harcamalar yapılmasını gerektirdiği takdirde ya da olağan dışı herhangi bir sebebin varlığı hâlinde, hâkimin izniyle çocuğun mallarından onun bakım ve eğitimine yetecek belli bir miktar sarfedebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Süresi">
              <mvz-madde no="328" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve babanın bakım borcu, çocuğun ergin olmasına kadar devam eder.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çocuk ergin olduğu halde eğitimi devam ediyorsa, ana ve baba durum ve koşullara göre kendilerinden beklenebilecek ölçüde olmak üzere, eğitimi sona erinceye kadar çocuğa bakmakla yükümlüdürler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Dava hakkı">
              <mvz-madde no="329" başlık="">
                <mvz-fıkra no="1">
                  <template>Küçüğe fiilen bakan ana veya baba, diğerine karşı çocuk adına nafaka davası açabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ayırt etme gücüne sahip olmayan küçük için gereken hâllerde nafaka davası, atanacak kayyım veya vasi tarafından da açılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ayırt etme gücüne sahip olan küçük de nafaka davası açabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Nafaka miktarının takdiri">
              <mvz-madde no="330" başlık="">
                <mvz-fıkra no="1">
                  <template>Nafaka miktarı, çocuğun ihtiyaçları ile ana ve babanın hayat koşulları ve ödeme güçleri dikkate alınarak belirlenir. Nafaka miktarının belirlenmesinde çocuğun gelirleri de göz önünde bulundurulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Nafaka her ay peşin olarak ödenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Hâkim istem hâlinde, irat biçiminde ödenmesine karar verilen nafakanın gelecek yıllarda tarafların sosyal ve ekonomik durumlarına göre ne miktarda ödeneceğini karara bağlayabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Durumun değişmesi">
              <mvz-madde no="331" başlık="">
                <mvz-fıkra no="1">
                  <template>Durumun değişmesi hâlinde hâkim, istem üzerine nafaka miktarını yeniden belirler veya nafakayı kaldırır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Geçici önlemler">
              <mvz-b3 no="1" başlık="Genel olarak">
                <mvz-madde no="332" başlık="">
                  <mvz-fıkra no="1">
                    <template>Nafaka davası açılınca hâkim, davacının istemi üzerine dava süresince gerekli olan önlemleri alır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Soybağı tespit edilirse, davalının, uygun nafaka miktarını depo etmesine veya geçici olarak ödemesine karar verilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
              <mvz-b3 no="2" başlık="Babalığın tespitinden önce">
                <mvz-madde no="333" başlık="">
                  <mvz-fıkra no="1">
                    <template>Babalık davası ile birlikte nafaka istenir ve hâkim, babalık olasılığını kuvvetli bulursa, hükümden önce çocuğun ihtiyaçları için uygun bir nafakaya karar verebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b3>
            </mvz-b2>
            <mvz-b2 no="VII" başlık="Güvence verilmesi">
              <mvz-madde no="334" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba nafaka yükümlülüklerini sürekli olarak ve ısrarla yerine getirmezlerse ya da kaçma hazırlığı içinde bulundukları, mallarını gelişigüzel harcadıkları veya heba ettikleri kabul edilebilirse hâkim, gelecekteki nafaka yükümlülüklerine ilişkin olarak uygun bir güvencenin sağlanmasına veya gerektiğinde diğer önlemlerin alınmasına karar verebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
        </mvz-ayırım>
        <mvz-ayırım no="6-ALTINCI" başlık="VELÂYET">
          <mvz-b1 no="A" başlık="Genel olarak">
            <mvz-b2 no="I" başlık="Koşullar">
              <mvz-madde no="335" başlık="">
                <mvz-fıkra no="1">
                  <template>Ergin olmayan çocuk, ana ve babasının velâyeti altındadır. Yasal sebep olmadıkça velâyet ana ve babadan alınamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hâkim vasi atanmasına gerek görmedikçe, kısıtlanan ergin çocuklar da ana ve babanın velâyeti altında kalırlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Ana ve baba evli ise">
              <mvz-madde no="336" başlık="">
                <mvz-fıkra no="1">
                  <template>Evlilik devam ettiği sürece ana ve baba velâyeti birlikte kullanırlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ortak hayata son verilmiş veya ayrılık hâli gerçekleşmişse hâkim, velâyeti eşlerden birine verebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Velâyet, ana ve babadan birinin ölümü hâlinde sağ kalana, boşanmada ise çocuk kendisine bırakılan tarafa aittir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Ana ve baba evli değilse">
              <mvz-madde no="337" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba evli değilse velâyet anaya aittir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ana küçük, kısıtlı veya ölmüş ya da velâyet kendisinden alınmışsa hâkim, çocuğun menfaatine göre, vasi atar veya velâyeti babaya verir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Üvey çocuklar">
              <mvz-madde no="338" başlık="">
                <mvz-fıkra no="1">
                  <template>Eşler, ergin olmayan üvey çocuklarına da özen ve ilgi göstermekle yükümlüdürler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kendi çocuğu üzerinde velâyeti kullanan eşe diğer eş uygun bir şekilde yardımcı olur; durum ve koşullar zorunlu kıldığı ölçüde çocuğun ihtiyaçları için onu temsil eder.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
          </mvz-b1>
          <mvz-b1 no="B" başlık="Velâyetin kapsamı">
            <mvz-b2 no="I" başlık="Genel olarak">
              <mvz-madde no="339" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba, çocuğun bakım ve eğitimi konusunda onun menfaatini göz önünde tutarak gerekli kararları alır ve uygularlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çocuk, ana ve babasının sözünü dinlemekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ana ve baba, olgunluğu ölçüsünde çocuğa hayatını düzenleme olanağı tanırlar; önemli konularda olabildiğince onun düşüncesini göz önünde tutarlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Çocuk, ana ve babasının rızası dışında evi terkedemez ve yasal sebep olmaksızın onlardan alınamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="5">
                  <template>Çocuğun adını ana ve babası koyar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="II" başlık="Eğitim">
              <mvz-madde no="340" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba, çocuğu olanaklarına göre eğitirler ve onun bedensel, zihinsel, ruhsal, ahlâkî ve toplumsal gelişimini sağlar ve korurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ana ve baba çocuğa, özellikle bedensel ve zihinsel engelli olanlara, yetenek ve eğilimlerine uygun düşecek ölçüde, genel ve meslekî bir eğitim sağlarlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="III" başlık="Dinî eğitim">
              <mvz-madde no="341" başlık="">
                <mvz-fıkra no="1">
                  <template>Çocuğun dinî eğitimini belirleme hakkı ana ve babaya aittir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ana ve babanın bu konudaki haklarını sınırlayacak her türlü sözleşme geçersizdir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ergin, dinini seçmekte özgürdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="IV" başlık="Çocuğun temsil edilmesi">
              <mvz-madde no="342" başlık="">
                <mvz-fıkra no="1">
                  <template>Ana ve baba, velâyetleri çerçevesinde üçüncü kişilere karşı çocuklarının yasal temsilcisidirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İyiniyetli üçüncü kişiler, eşlerden her birinin diğerinin rızasıyla işlem yaptığını varsayabilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Vesayet makamlarının iznine bağlı hususlar dışında kısıtlıların temsiline ilişkin hükümler velâyetteki temsilde de uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="V" başlık="Çocuğun fiil ehliyeti">
              <mvz-madde no="343" başlık="">
                <mvz-fıkra no="1">
                  <template>Velâyet altındaki çocuğun fiil ehliyeti, vesayet altındaki kişinin ehliyeti gibidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çocuk, borçlarından ana ve babanın çocuk malları üzerindeki haklarına bakılmaksızın kendi malvarlığı ile sorumludur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VI" başlık="Çocuğun aileyi temsil etmesi">
              <mvz-madde no="344" başlık="">
                <mvz-fıkra no="1">
                  <template>Velâyet altındaki çocuk, ayırt etme gücüne sahip ise ana ve babanın rızasıyla aile adına hukukî işlemler yapabilir; bu işlemlerden dolayı ana ve baba borç altına girer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b2>
            <mvz-b2 no="VII" başlık="Çocuk ile ana ve baba arasındaki hukukî işlemler">
              <mvz-madde no="345" başlık="">
                <mvz-fıkra no="1">
                  <template>Çocuk ile ana veya baba arasında ya da ana ve babanın menfaatine olarak çocuk ile üçüncü kişi arasında yapılacak bir hukukî işlemle çocuğun borç altına girebilmesi, bir kayyımın katılmasına ve hâkimin onayına bağlıdır.</template>
                </mvz-fıkra>
