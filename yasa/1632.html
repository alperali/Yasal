  <mvz-künye tür="kanun" no="1632" başlık="ASKERİ CEZA KANUNU"
             tarih="22/5/1930" rgazete-tarih="15/6/1930" rgazete-sayı="1520"
             düstur-tertip="3" düstur-cilt="11" düstur-sayfa="367" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Askeri suçlar ve kabahatler ve cezalar">
    <mvz-bap no="1-BİRİNCİ" başlık="Esaslar">
      <mvz-madde no="1" başlık="Askeri cürüm ve kabahat">
        <mvz-fıkra no="1">
          <template>Türk Ceza Kanununa göre cürümler ve cezalar hakkında umumi suretle cari olan esaslar bu kanunda hilafı yazılı olmadıkça askeri cürümler ve cezalar hakkında da tatbik olunur.</template>
          <mvz-bent no="1.">
            <template>Bu kanunun ölüm, ağır hapis ve hapis cezalariyle cezalandırdığı suçlar askeri cürümlerdir.</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Bu kanunun kısa hapis cezasiyle cezalandırdığı suçlar askeri kabahatlerdir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Askerlerin askeri olmayan suçları">
        <mvz-fıkra no="1">
          <template>Askeri şahısların askeri olmayan suçları için Türk Ceza Kanunu hükümleri tatbik olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="Askeri şahıslar">
        <mvz-fıkra no="1">
          <template>Askerî şahıslar; Mareşalden asteğmene kadar subaylar, astsubaylar, Millî Savunma Bakanlığı ile Türk Silahlı Kuvvetleri kadro ve kuruluşunda çalışan sivil personel, uzman jandarma, uzman erbaş, sözleşmeli erbaş ve er, erbaş ve erler ile askerî öğrencilerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Milli Savunma Bakanlığı ile Türk Silahlı Kuvvetleri kadro ve kuruluşunda çalışan Devlet memurlarının asker kişi sıfatları, 4.1.1961 tarihli ve 211 sayılı Türk Silahlı Kuvvetleri İç Hizmet Kanununun 115 inci maddesinde belirtilen yükümlülükleri ile sınırlıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="İhtiyat askeri şahıslar">
        <mvz-fıkra no="1">
          <template>İhtiyat askeri şahıslar askeri hizmetlerde bulundukları müddetçe bu kanun hükümlerine tabidirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Asker kişilerin yabancı ülkelerde işledikleri askerî suçlar">
        <mvz-fıkra no="1">
          <template>Asker kişilerin yabancı ülkelerde Türk askerî kıt’a, karargâh ve kurumlarında veya diğer resmi görevleri sırasında veya esir kamplarında işledikleri askerî suçlar, Türkiye’de işlenmiş sayılır. Bunlar hakkında yabancı ülkede hüküm verilmiş olsa bile, Milli Savunma Bakanının talebi üzerine Türkiye’de tekrar muhakeme olunurlar. Bu halde, yabancı ülkede verilip infaz edilen ceza, verilecek cezadan indirilir. Ceza nev’ileri farklı ise, mahkeme yapılacak indirmeyi tayin eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Müttefik hükümetlerin askeri şahıslarına karşı yapılan suçlar">
        <mvz-fıkra no="1">
          <template>Müttefik hükümetlerin askeri şahısları ile müşterek vazife sırasında bu şahıslara karşı yapılan askeri suçlar müttefik hükümetler ile mukabele bilmisil mukavelesi varsa Türkiye askeri şahıslarına yapılmış sayılarak ona göre cezalandırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Harb hükümleri ve cari olacağı hal ve vakitler">
        <mvz-fıkra no="1">
          <template>Bu kanunda "seferberlikte" tabiriyle takyit edilen ceza hükümleri "Harb hükümleri" dir ve aşağıdaki hal ve vakitlerde caridir:</template>
          <mvz-bent no="A">
            <template>Umumi seferberlik müddetince askeri şahıslar hakkında;</template>
          </mvz-bent>
          <mvz-bent no="B">
            <template>Kısmi seferberlik ilan olunan mıntıkalarda bunun devamı müddetince askeri şahıslar hakkında;</template>
          </mvz-bent>
          <mvz-bent no="C">
            <template>Örfi idare ilan olunan mıntıkalarda harb hükümleri tatbik olunacağına Cumhurbaşkanınca karar verildiği takdirde bunun devamı müddetince mezkür mıntıkada bulunanlar hakkında;</template>
          </mvz-bent>
          <mvz-bent no="D">
            <template>Fesat ve isyan halinde veyahut silah kullanılacak askeri bir hareket yapılması halinde kumanda eden subay tarafından harb hükümleri mer'i olacağı resmen bildirilen askeri kıtalar hakkında bu hallerin devamı müddetince;</template>
          </mvz-bent>
          <mvz-bent no="E">
            <template>Bulundukları mahalde en büyük rütbeli komutan tarafından harb hükümleri mer'i olacağı kendilerine resmen tebliğ olunan harb esirleri hakkında.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Seferberlik ve tarifi">
        <mvz-fıkra no="1">
          <template>Sefer tabiri harb halini ihtiva eden seferberliktir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Seferberlik, ordunun veya bazı kısımlarının seferber olmasını amir olan emirde yazılı ve muayyen tarihten başlayarak ilgasını mübeyyin neşrolunan emirde yazılan tarihte biten haldir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hazarda Türkiye Cumhuriyeti hudut ve kara suları dışında yalnız dahi seyrü hareket eden her harb tayyare ve harb gemisi üssülharekelerinden birine varıncaya kadar bu kanunun tatbikatında seferber sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Düşman karşısı">
        <mvz-fıkra no="1">
          <template>Seferberlikte düşman ile müsademeyi intizaren emniyet hizmetleri tatbik ve ifa olunmağa başladığı zamandan itibaren bu müsademeye memur kıta, gemi, tayyare düşman karşısında sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Silahlı eşkiya">
        <mvz-fıkra no="1">
          <template>Silahlı eşkiya düşman sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Silahlının tarifi">
        <mvz-fıkra no="1">
          <template>Bu kanunun tatbikatında; "Silahlı" tabirinden maksat hizmetin icabı olan silahı hamili bulunmak, veya silahının başında olarak bir amirin kumandası ve nezaretiyle hizmete başlanılmış olmak halidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Hizmetin tarifi">
        <mvz-fıkra no="1">
          <template>Bu kanunun tatbikatında "Hizmet" tabirinden maksat gerek malüm ve muayyen olan ve gerek bir amir tarafından emredilen bir askeri vazifeninmadun tarafından yapılması halidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Memur, amir ve üstün tarifi">
        <mvz-fıkra no="1">
          <template>Bu kanunun tatbikatında "memur" tabirinden maksat 12 nci maddede yazılı hizmeti ifa ile mükellef olandır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Amir, makam ve memuriyet itibariyle emretmek salahiyetini haiz kimsedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Üst tabiri rütbe ve kıdem büyüklüğünü gösterir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Herhangi bir suretle ciheti askeriyece  göz altına alınan yabancı devlet orduları mensupları arasında astlık ve üstlük münasebetleri cari değildir. Bunlar arasında astlık ve üstlük münasebetleri salahiyetli komutanlar tarafından hususi surette verilen emirle teessüs edebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Toplu erbaş ve er karşısının tarifi">
        <mvz-fıkra no="1">
          <template>Bir fiil toplu erbaş ve er karşısında yapılmış sayılarak kanunun bu kayıt ile takyit ettiği hükümlerin tatbikı için amir veya mafevk ile failden veya şeriklerden başka askeri hizmet maksadiyle toplanmış en az yedi askeri şahsın bulunması şarttır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Nöbetçi, karakol, devriyenin tarifi">
        <mvz-fıkra no="1">
          <template>Bu kanunun tatbikatında nöbetçi hazarda ve seferde emniyet, muhafaza, disiplin, tarassut maksatlariyle silahlı olarak bir yere konulan ve muayyen bir talimatı bulunan tek veya çift askerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Karakol hazarda ve seferde aynı maksatlarla konulan ve bir amir emrinde bulunan silahlı bir kısım askerdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Devriye hazarda ve seferde aynı maksatlarla muayyen bir mıntakada seyyar olarak vazife yapan bir veya daha ziyade silahlı askerdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="Ordu ve kıtanın tarifi">
        <mvz-fıkra no="1">
          <template>Bu kanunda yazılı olan "Ordu" kelimesi kara, deniz ve hava kuvvetlerine; ve kıta kelimesi subay kumandasında bulunan her birliğe şamildir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="İstirdat ve tazminat nasıl hükmolunur">
        <mvz-fıkra no="1">
          <template>Askeri mahkeme istirdat ve tazminata Türk Ceza Kanununun koyduğu kaideler mucibince hükmeder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Adli amirler disiplin cezasile birlikte değeri 25 lirayı geçmeyen şeyler için istirdad ve tazminata da karar verebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu kararlar aleyhine tefhim veya tebliğden itibaren 15 gün içinde askeri mahkemede itiraz olunabilir. İtiraz üzerine duruşma yapılarak hüküm verilir. İtiraz eden, muhakeme için tayin edilen günde mahkemede bulunmazsa itiraz hakkının düşmesine mahkemece karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İtiraz üzerine mahkemece verilecek kararlar kat'i olup bunlar aleyhine temyize müracaat olunamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Askeri Ceza Kanununda yazılı cezanın icrası ve disiplin cezalarının tatbiki" durum="mülga">
      </mvz-madde>
      <mvz-madde no="19" başlık="Disiplin cezaları" durum="mülga">
      </mvz-madde>
    </mvz-bap>
    <mvz-bap no="2-İKİNCİ" başlık="Cezalar">
      <mvz-fasıl no="1-BİRİNCİ" başlık="Askeri cezalar">
        <mvz-madde no="20" başlık="Ölüm cezası">
          <mvz-fıkra no="1">
            <template>Ölüm cezası, buna mahküm olan kimsenin hayatının izale olunmasıdır. Bu ceza askeri şahıslar hakkında askeri bir cürümden dolayı hükmedilmiş ise mahkumun kurşuna dizilmesi suretiyle infaz olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Askeri olmayan bir cürümden dolayı askeri şahıslar ile askeri olmayan şahıslar hakkında askeri mahkemelerden verilen ölüm hükümleri Türk Ceza Kanununun 12 nci maddesi mucibince icra olunur. Bu veçhile asılacak ölüm mahkumları cezanın infazı için o baptaki ilam ve tasdik emri suretleriyle C. Müddeiumumiliğine verilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="21" başlık="Şahsi hürriyeti tahdit eden cezalar">
          <mvz-fıkra no="1">
            <template>Bu kanuna göre şahsi hürriyeti tahdit eden cezalar ağır hapis ve hapis ve kısa hapistir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="22" başlık="Ağır hapis ve hapis cezalarının mahiyeti ve neticeleri">
          <mvz-fıkra no="1">
            <template>Ağır hapis ve hapis cezalarının mahiyeti ve neticeleri ve icrası Türk Ceza Kanununda yazılı olan kaidelere tabidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="23" başlık="Kısa hapis cezaları">
          <mvz-fıkra no="1">
            <template></template>
            <mvz-bent no="A">
              <template>Kısa hapis cezaları üç türlüdür:</template>
              <mvz-altbent no="1">
                <template>Göz hapsi;</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Oda hapsi;</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Katıksız hapis.</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="B">
              <template>Subay, astsubay, Milli Savunma Bakanlığı ve Türk Silahlı Kuvvetlerinde görevli Devlet memurları, uzman jandarma ve uzman erbaşlar hakkında:</template>
              <mvz-altbent no="1">
                <template>Dört haftaya kadar göz hapsi,</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Dört haftaya kadar oda hapsi,</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="0">
              <template>Cezaları verilebilir.</template>
            </mvz-bent>
            <mvz-bent no="C">
              <template>Erbaş ve er hakkında:</template>
              <mvz-altbent no="1">
                <template>Dört haftaya kadar oda hapsi;</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Üç haftaya kadar katıksız hapis cezaları verilebilir.</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="D">
              <template>Askeri öğrenciler hakkında : (Askeri orta ve lise ile eşidi okullar öğrencileri hariç) dört haftaya kadar oda hapsi cezası verilebilir.</template>
            </mvz-bent>
            <mvz-bent no="E">
              <template>Kısa hapis cezalarında maaş ve tahsisat tam olarak verilir.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="24" başlık="Göz ve oda hapsi cezalarının mahiyeti, neticeleri ve yerine getirilmesi">
          <mvz-fıkra no="1">
            <template>Subay, astsubay, Milli Savunma Bakanlığı ve Türk Silahlı Kuvvetlerinde görevli Devlet memurları, uzman jandarma ve uzman erbaşlar;</template>
            <mvz-bent no="A">
              <template>Göz hapsi cezalarında:</template>
              <mvz-altbent no="1">
                <template>Resmi daire, kışla, eğitim alanları ile sair yerlerdeki hizmetlerine devam ederler.</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Hizmetin bitiminden sonra hiçbir yere gidemezler. Kışlada veya resmi odalarda kalırlar.</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Hizmete ilişkin olanlar dışında hiçbir ziyaret kabul edemezler.</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="B">
              <template>Oda hapis cezalarında :</template>
              <mvz-altbent no="1">
                <template>Mümkün olduğu takdirde cezayı tek başlarına belirli bir hapis odasında geçirirler.</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Emir veremezler.</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Genel hizmet yapamazlar.</template>
              </mvz-altbent>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Askeri öğrenciler, oda hapsi cezasını belirli hapis odalarında topluca geçirirler. Hapis odalarının kapısında bir nöbetçi bulundurulur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="25" başlık="Erbaş ve er hakkında oda ve katıksız hapis cezalarının mahiyeti ve icrası">
          <mvz-fıkra no="1">
            <template>Erbaş ve er :</template>
            <mvz-bent no="1.">
              <template>Oda hapsi cezasını muayyen hapis odalarında topluca geçirirler.</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Katıksız hapis cezasını hapis odasında tek başına geçirirler.</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Hapis odalarının kapısında bir nöbetçi bulundurulur.</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Onbaşı ve erler ağır askeri hizmetlerde kullanılabilirler.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="26" başlık="Katıksız hapsin icrası">
          <mvz-fıkra no="1">
            <template>Katıksız hapis, mahkuma bir katı minder ve gıda olarak yalnız su ve istihkak miktarı ekmek verilmek ve tütün ve saire verilmemek suretiyle tenfiz olunur. Bu mahrumiyetler hapsin dördüncü sekizinci on ikinci günleriyle bundan sonra mahkumiyet müddetince her üç günde bir kaldırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="27" başlık="Katıksız hapsin değiştirilmesi">
          <mvz-fıkra no="1">
            <template>Mahkumun sıhhati katıksız hapse müsait değilse disiplin cezasının bir derece daha hafifi tatbik olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="28" başlık="Kısa hapis cezalarının tatbikı şartları">
          <mvz-fıkra no="1">
            <template>Bu kanunda kısa hapis cezası gösterilen yerlerde failin rütbesine göre caiz olan kısa hapsin her nev'i hükmolunabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu kanunda kısa hapis cezasının nevi tasrih edilipte bu nevi cezanın failin rütbesine göre verilmesi gayricaiz olduğu takdirde failin rütbesine göre caiz olan bir derece hafifi hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="29" başlık="Fer'i askeri cezalar">
          <mvz-fıkra no="1">
            <template>Askeri şahıslar hakkında hükmolunacak fer’i askeri cezalar şunlardır:</template>
            <mvz-bent no="A">
              <template>Türk Silahlı Kuvvetlerinden çıkarma.</template>
            </mvz-bent>
            <mvz-bent no="B">
              <template>Rütbenin geri alınması.</template>
            </mvz-bent>
            <mvz-bent no="C">
              <template>Askeri öğrencilik hukukunu kaybettirme.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="30" başlık="Türk Silahlı Kuvvetlerinden çıkarma cezası">
          <mvz-fıkra no="1">
            <template>Aşağıda yazılı hallerde subay, astsubay, uzman jandarmalar ve özel kanunlarında bu cezanın uygulanacağı belirtilen asker kişiler hakkında, askeri mahkemeler veya adliye mahkemelerince asıl ceza ile birlikte, Türk Silahlı Kuvvetlerinden çıkarma cezası da verilir. Bu husus mahkeme hükmünde belirtilmemiş olsa dahi, Silahlı Kuvvetlerden çıkarmayı gerektirir.</template>
            <mvz-bent no="A">
              <template>Taksirli suçlardan verilen cezalar hariç olmak üzere ölüm, ağır hapis, bir seneden fazla hapis cezası ile hükümlülük halinde,</template>
            </mvz-bent>
            <mvz-bent no="B">

        <mvz-madde no="56" başlık="Milli Müdafaaya hiyanet">
          <mvz-fıkra no="1">
            <template>Bu maddede gösterilen fiilleri işliyenler ve bunlara teşebbüs edenler (Milli Müdafaaya hiyanet) cürmünden dolayı aşağıda yazılı cezalarla cezalandırılırlar.</template>

        <mvz-madde no="57" başlık="Milli Müdafaa aleyhine sair hareketler">

            <template>Her kim, bir müstahkem mevkide, bir harb limanında veyahut diğer bir askeri müessesede ve askeri sahada, deniz ordusuna ait bir gemide, yahut Devlet karasuları içinde Devletin bir makamına, bir memura veya bir askere karşı ismi ve şahsı halleri, sıfatı, mesleki, ikamet mahalli veya tabiiyeti hakkında kasten yanlış malumat verir veya malumat vermekten çekinirse üç aydan üç seneye kadar hapis ile cezalandırılır.</template>

          <mvz-fıkra no="0">

        <mvz-madde no="58" başlık="Milli mukavemeti kırmak">

        </mvz-madde>
        <mvz-madde no="59" başlık="Milli Müdafaa vasıtalarını tahrip">

            <template>Milli Müdafaayı ihlal kastiyle müdafaaya yarayan vasıtalardan birini veya her hangi bir tesisi tahrip eden, yok eden, terkeden, kullanılmayacak hale getiren veya kusurlu olarak imal, teslim veya tesellüm eden veya bunlara her hangi bir suretle zarar verenler sekiz seneden aşağı olmamak üzere ağır hapis cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Milli Müdafaanın emniyeti için ehemmiyetli olan bir işletmeye muktazi her hangi bir vasıtayı Milli Müdafaayı ihlal kastiyle kısmen veya tamamen bozarak veya tahrip ederek veyahut mesaisini ihlal eyleyerek işletmenin faaliyetini tehlikeye düşürenler veya muattal bir hale koyanlar sekiz seneden aşağı olmamak üzere ağır hapis cezasiyle cezalandırılır.</template>

          <mvz-fıkra no="3">
            <template>Fiil, seferberlikte yapılmış veya Devletin harb hazırlıklarını veya harb kudretini veya kabiliyetini ve askeri hareketlerini tehlikeye koymuş ise 1, 2 numaralı fıkralarda yazılı curümlerin failleri ölüm cezası ile cezalandırılır.</template>

        <mvz-madde no="60" başlık="Söz vererek tahliye olunan harb esirleri">
          <mvz-fıkra no="1">
            <template>Harb esiri olupta verdiği sözü tutmayarak Türkiye Cumhuriyeti aleyhine muharip olarak tutulmak ve yahut ecnebi olupta Türkiye Cumhuriyeti hizmeti askeriyesinde bulunduğu halde Türkiye aleyhine bir düşman ile beraber olmak hiyanet addolunarak faili ölüme mahkum olur.</template>

          <mvz-fıkra no="2">

        </mvz-madde>

      <mvz-fasıl no="2-İKİNCİ" başlık="Seferberlikte harb kuvvetlerini tehlikeye düşürmek">
        <mvz-madde no="61" başlık="Seferberliği geciktirenlerin ve ihlal edenlerin cezası">
          <mvz-fıkra no="1">
            <template>Her kim kasten seferberliği geciktirip veya askeri bir hizmet ve vazifeyi ihlal edip bu suretle düşman teşebbüsatının kolaylaşmasına ve terakkisine ve yahut muharip Türkiye Cumhuriyeti ve mütteffikleri kıtalarına zarar ve tehlike gelmesine sebep olursa muvakkat ağır hapis ve yahut üç seneden fazla hapis cezasiyle cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Az vahim hallerde veya vazife ve hizmeti ihlal kasten vukubulmamış ise, üç seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="62" başlık="Müstahkem bir mevkii veya kendi mevkiini veya kendisini veya bir gemiyi, bir tayyareyi düşmana teslim eden kumandanların cezası">

            <template>Aşağıda yazılı olan askeri şahıslar ölüm cezasiyle cezalandırılır:</template>

              <template>Müstahkem bir mevkii; müdafaasına hizmet eden bütün vasıtaları kullanıp bitirmeksizin düşmana teslim eden mezkür mevkiin kumandanı;</template>
            </mvz-bent>
            <mvz-bent no="B">
              <template>Emri altında bulunan müdafaa vasıtalarını ihmal ile kendisine mevdu mevkii terkeden veya düşmana teslim eden kumandan;</template>

            <mvz-bent no="C">
              <template>Vazifesinin kendisinden talep eylediği her şeyi evvelden yapmayarak emri altına tevdi edilen kıtaatın teslimisilah etmesini intaç edecek surette açık sahrada düşmanla mukavele yapan kumandan;</template>

            <mvz-bent no="D">

          <mvz-fıkra no="2">

      <mvz-fasıl no="3-ÜÇÜNCÜ" başlık="Yoklama kaçağı, bakaya, saklı, firar">
        <mvz-madde no="63" başlık="">
          <mvz-fıkra no="1">
            <template>Barışta, 25/6/2019 tarihli ve 7179 sayılı Askeralma Kanununun 24 üncü maddesi uyarınca haklarında verilen idarî para cezası kesinleştikten sonra söz konusu Kanunun 23 üncü maddesinde belirtilen mazeretlerden birisi bulunmaksızın,</template>
            <mvz-bent no="a">
              <template>Yoklama kaçaklarından birlikte  yoklamaya tabi oldukları doğumluların yurt genelinde normal sevk yılı içindeki son kafilesi gönderilmiş bulunanlar için, son kafilenin gönderilmesi tarihinden,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bakaya kalanlar için, bakaya kaldıkları tarihten,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İhtiyat erattan çağrılıp da birlikte işleme tabi olduğu kişiler gönderilmiş bulunanlar için, en son gönderilme tarihinden,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Yoklama kaçağı, saklı veya bakaya olup olmamasına bakılmaksızın askerlik şubesince sevk edildiği kıtasına katılmayan veya geç katılanlar için, kendilerine tanınan kanuni yol süresinin bitiminden,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>itibaren dört ay içinde gelenler altı aya kadar, yakalananlar iki aydan altı aya kadar; dört aydan sonra bir yıl içinde gelenler iki aydan bir yıla kadar, yakalananlar dört aydan bir yıla kadar; bir yıldan sonra gelenler dört aydan iki yıla kadar, yakalananlar altı aydan üç yıla kadar hapis cezasıyla cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Seferberlikte birinci fıkrada yazılı olanlarla ruhsatlılardan sevk gününün bitmesinden itibaren yedi gün içinde gelenler bir aydan bir seneye, elde edilenler dört aydan iki seneye kadar, yedi günden sonra üç ay içinde gelenler iki seneden aşağı olmamak üzere elde edilenler üç seneden aşağı olmamak üzere hapis, üç aydan sonra kendiliğinden gelenler beş seneden az olmamak üzere ağır hapis, elde edilenler ölüm cezasına mahkum edilirler. Az vahim hallerde ölüm cezası yerine müebbet veya on seneden aşağı olmamak üzere ağır hapis cezası verilir ve diğer hallerde gösterilen cezalar yarıya indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="64" başlık="Çağırılıpta gelmiyen yedek subaylar, yedek astsubaylar ve askeri memurların cezaları">
          <mvz-fıkra no="1">
            <template>Hazarda askeri hizmete çağrıldığı halde 1076 sayılı kanunun 15 inc maddesine tevfikan Milli Müdafaa Vekaletince emredilen müddet içinde askerlik şubesine gelmiyen yedek subay , yedek astsubay ve askeri memurlardan bu müddetin bitmesinden sonra on beş gün içinde elde edilenler bir aydan altı aya kadar, on beş günden sonra üç ay içinde elde edilenler altı aydan bir seneye kadar hapis ve üç aydan sonra elde edilenler beş seneye kadar ağır hapis cezasiyle cazalandırılır. Bu müddetler içinde kendiliğinden gelenlerin cezaları yarıya indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Seferberlikte çağrıldığı halde muayyen müddet içinde askerlik şubesine gelmiyen yedek subaylar, yedek astsubaylar ve askeri memurlardan bu müddetin bitmesinden sonra yedi gün içinde gelenler üç aydan iki seneye kadar, elde edilenler altı aydan üç seneye kadar, yedi günden sonra üç ay içinde gelenler iki seneden ve elde edilenler üç seneden aşağı olmamak üzere hapis, üç aydan sonra gelenler beş seneden az olmamak üzere ağır hapis, elde edilenler ölüm cezasiyle cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Askeri hizmet için yapılan davet üzerine şubeye gelen yedek subay , yedek astsubay ve askeri memurlardan mahalli müretteplerine hazarda on iki ve sefeberlikte dört gün içinde hareket etmiyenler veya yol müddeti hariç olarak bu müddetlerin yarısından fazla bir müddeti yolda geçirerek vazife ve memuriyetlerine iltihak etmiyenler hazarda üç aya kadar ve seferberlikte üç aydan beş seneye kadar hapsolunurlar. Bu fıkrada ve 65 inci maddede yazılı müddetler halin icabına göre Milli Müdafaa Vekilliğince azaltılabilir veya uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Az vahim hallerde 63 üncü maddenin son fıkrasında yazılı hükümler bu maddede yazılı olan cezalar hakkında da tatbik olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>1076 sayılı kanunun 13 ve 15 inci madelerinde yazılı haller bu maddenin tatbikında da nazara alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="65" başlık="Vazife ve memuriyetlerine gitmeyenlerin cezaları">
          <mvz-fıkra no="1">
            <template>Tayin olunduğu vazife ve memuriyet emrinin tebliğinden itibaren mazeretsiz hazarda 15 ve seferberlikte 6 gün içinde hareket etmiyen veya yol müddeti hariç olarak hazarda 7, seferde 3 günden fazla bir müddet yolda geçirerek vazife ve memuriyetlerine iltihak etmiyen subaylar, askeri memurlarla astsubaylar üç aya kadar ve seferberlikte üç aydan beş aya kadar hapsolunurlar. Tekerrürü halinde ilk fiil hazarda ise altı ay ve seferberlikte ise sekiz ay ve her iki fiil seferberlikte ise bir sene hapsolunurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarda hareket ve iltihak için tayin olunan müddetlerin bitmesinden itibaren hazarda altı, seferberlikte üç gün içinde kıtasına iltihak etmiyenler hakkında da 66 ncı madde hükümleri tatbik olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="66" başlık="Firar ve cezası">
          <mvz-fıkra no="1">
            <template>Aşağıda yazılı askeri şahıslar bir yıldan üç yıla kadar hapsolunur:</template>
            <mvz-bent no="a">

            <mvz-bent no="b">
              <template>Kıt'asından veya görevini yapmakta olduğu yerden izin, istirahat veya hava değişimi alarak ayrılanlardan, dönmeye mecbur bulundukları günden itibaren altı gün içerisinde özürsüz olarak gelmeyenler,</template>

              <template>Suçlu, silah, mühimmat ve bunların teçhizat veya nakil vasıtalarından ve hayvanlardan birini veya ordu hizmetine tahsis edilen herhangi bir şeyi beraberinde götürmüş ise;</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Suçlu hizmet yaparken kaçmış ise;</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Suçlu mükerrir ise;</template>

          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Seferberlikte bu maddede yazılı mehiller yarıya indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="67" başlık="Yabancı memlekete firar edenlerin cezaları">
          <mvz-fıkra no="1">
            <template>Aşağıda yazılı fiilleri işleyen asker kişiler, yabancı ülkeye kaçmış sayılarak bir seneden beş seneye kadar hapis cezası ile cezalandırılırlar:</template>

              <template>Ülke sınırları dışındaki bir askerî birlik veya görev yerinden, deniz veya hava aracından kaçıp da bu durumda üç günü geçirenler.</template>

            </mvz-bent>
            <mvz-bent no="D">
              <template>Harp esiri iken serbest bırakılıp da askerî veya sivil bir Türk resmî makamına veya müttefik devlet makamlarına teslim olmak üzere harekete geçme imkânı doğduğu halde, özürsüz olarak hareketsiz kalan ve bu durumda üç günü geçirenler.</template>

          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aşağıda yazılı hallerde üç seneden yedi seneye kadar hapis cezası verilir:</template>

              <template>Fail beraberinde silah, mühimmat, savaş araç veya gerecini götürmüş ise.</template>
            </mvz-bent>
            <mvz-bent no="B">
              <template>Fail hizmet yaparken kaçmış ise.</template>
            </mvz-bent>
            <mvz-bent no="C">
              <template>Fail mükerrir ise.</template>
