      <mvz-madde no="7" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunda ve diğer kanunlarda geçen;</template>
          <mvz-bent no="A">
            <template>“Başgedikli”, “Gedikli” ve “Küçük Zabit” ibareleri “Astsubay”,</template>
          </mvz-bent>
          <mvz-bent no="B">
            <template>“Toplu Efrat” ibaresi “Toplu Asker”, “Efrat” ibaresi sadece “Erbaş ve Er”, “Nefer” ibaresi “Er”.</template>
          </mvz-bent>
          <mvz-bent no="C">
            <template>“Tard, ihraç ve rütbenin geri alınması” fer’i cezaları , “Türk Silahlı Kuvvetlerinden çıkarma” fer’i cezası,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Olarak değiştirilmiştir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Askeri mahkemeler ve adli yargı mahkemeleri tarafından verilen kısa süreli hapis cezaları; 16/6/1927 tarihli ve 1076 sayılı Yedek Subaylar ve Yedek Askeri Memurlar Kanunu hükümlerine göre askerlik hizmetini yerine getiren yükümlüler ile yükümlü erbaş ve erler hakkında Türk Ceza Kanununun 50 nci maddesinin birinci fıkrasında belirtilen seçenek yaptırımlara, diğer askeri şahıslar hakkında ise aynı fıkranın (a), (b) ve (d) bentlerinde belirtilen seçenek yaptırımlara çevrilebilir. Ancak aşağıdaki hâllerde kısa süreli hapis cezaları seçenek yaptırımlara çevrilemez:</template>
          <mvz-bent no="A">
            <template>Sırf askeri suçlardan dolayı yapılan yargılama sonunda hükmolunan netice cezanın dört ay veya daha fazla süreli hapis cezası olması.</template>
          </mvz-bent>
          <mvz-bent no="B">
            <template>Fiilin, disiplini ağır şekilde ihlal etmesi veya birliğin güvenliğini tehlikeye düşürmesi ya da birliğin muharebe hazırlığını veya etkinliğini zafiyete uğratması ya da büyük bir zarar meydana getirmesi.</template>
          </mvz-bent>
          <mvz-bent no="C">
            <template>Fiilin savaş veya seferberlikte işlenmesi.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>1076 sayılı Kanun hükümlerine göre askerlik hizmetini yerine getiren yükümlüler ile yükümlü erbaş ve erler hakkında verilen kısa süreli hapis cezasına seçenek yaptırımların yerine getirilmesi askerlik hizmetlerinin sonuna bırakılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sırf askerî suçlar ile hapis cezasının üst sınırı üç ayı geçen askerî suçlar hakkında, önödeme hükümleri uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunda alt sınırı belirtilmeyen ağır hapis cezalarının alt sınırları "bir sene" olarak uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunda ve diğer ilgili kanunlarda gerekli değişiklikler yapılıncaya kadar, 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun Birinci Kitabında yer alan düzenlemeler bakımından bu Kanunun ek 8 ve 9 uncu maddeleri ile 16/6/1964 tarihli ve 477 sayılı Disiplin Mahkemeleri Kuruluşu, Yargılama Usulü ve Disiplin Suç ve Cezaları Hakkında Kanunun 63 üncü maddesinin ikinci fıkrası hükümlerinin uygulanmasına devam olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="iptal">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Askerî suçlar ile sırf askerî suçlar" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunda düzenlenen suçlar ile asker kişilerin askerlik hizmet ve görevleriyle ilgili olarak işledikleri suçlar, askerî suçtur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunda düzenlenen ve asker kişiler tarafından işlenen 60 ıncı, 62 nci, 65 inci, 66 ncı, 67 nci, 68 inci, 70 inci, 79 uncu, 81 inci, 82 nci, 85 inci, 87 nci, 88 inci, 89 uncu, 90 ıncı, 91 inci, 97 nci, 98 inci, 100 üncü, 101 inci, 102 nci ve 136 ncı maddelerinde düzenlenen suçlar, sırf askerî suçtur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Amir-maiyet veya üst-ast ilişkisi" tür="Ek">
        <mvz-fıkra no="1">
          <template>Askerlik hizmet ve görevlerine ilişkin hâller dışında, asker kişilerden nişanlıların, evlilik bağı kalmasa bile eşlerin, kan veya kayın hısımlığından üstsoy veya altsoy ile üçüncü derece dâhil hısımların veya evlâtlık bağı olanların birbirlerine karşı işledikleri suçlar bakımından amir-maiyet ve üst-ast ilişkisi dikkate alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yükümlü erbaş ve erler arasında ast, üst veya amir ilişkisinin dikkate alınması için fiilin askerî hizmet ve görevlerinden dolayı işlenmesi şarttır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Yakalama ve tutuklama" tür="Ek">
        <mvz-fıkra no="1">
          <template>Aşağıda belirtilen hâllerde, asker kişi herkes tarafından geçici olarak yakalanabilir:</template>
          <mvz-bent no="a">
            <template>Kişiye suçu işlerken rastlanması.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Suçüstü bir fiilden dolayı; izlenen kişinin kaçması olasılığının bulunması veya hemen kimliğini belirleme olanağının bulunmaması.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tutuklama kararı veya yakalama emri düzenlenmesini gerektiren ve gecikmesinde sakınca bulunan hâllerde; Cumhuriyet savcısına derhâl başvurma olanağı bulunmadığı takdirde, amiri, üstü, askerî karakol, nöbetçi, devriye, askerî inzibat ve kolluk görevlisi asker kişiyi yakalama yetkisine sahiptir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yakalanan kişi ve olay hakkında Cumhuriyet savcısına hemen bilgi verilerek emri doğrultusunda işlem yapılır. Cumhuriyet savcısı, yakalanan kişiyi serbest bırakmaz ise en yakın askerî inzibat karakoluna veya askerî makama ya da adli kolluk görevlilerine teslim edilmesine karar verir. Suçun Türk Ceza Kanununun İkinci Kitap, Dördüncü Kısım altındaki Dördüncü, Beşinci, Altıncı ve Yedinci Bölümlerinde tanımlanan suçlar ile 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu kapsamına giren suçlardan olması durumunda, yakalanan kişi Cumhuriyet savcısının talimatı ile adli kolluk görevlilerine teslim edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Asker kişilerin gözaltına alınması veya tutuklanması durumunda derhâl kıta komutanı veya askerî kurum amirine de haber verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Soruşturma ve kovuşturma" tür="Ek">
        <mvz-fıkra no="1">
          <template>Askerî suçlarla ilgili olarak aşağıdaki hükümler uygulanır:</template>
          <mvz-bent no="a">
            <template>Subay ve astsubayların şüpheli sıfatıyla ifadesi bizzat Cumhuriyet savcısı tarafından alınır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Askerî amirler Cumhuriyet savcısının işe el koymasına kadar delillerin kaybolmasını önleyecek tedbirleri alır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Ülke sınırları dışında işlenen suçlar bakımından Cumhuriyet savcısı, adli kolluk görevlileri tarafından yapılacak işlemlerin Millî Savunma Bakanlığınca yurt dışında görevlendirilen hukuk sınıfı subaylar tarafından yapılmasını isteyebilir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kuvvetli suç şüphesinin varlığını gösteren somut delillerin bulunması ve sırf askerî suç nedeniyle askerî disiplinin ağır şekilde ihlal edilmesi hâlinde de asker kişi hakkında tutuklama kararı verilebilir.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Sırf askerî suçlarda, tutuklama yasağına ilişkin hükümler uygulanmaz.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Asker kişilerin işlediği askerî suçlarla ilgili olarak kabul edilen iddianamenin bir örneğini mahkeme, kovuşturmaya yer olmadığına karar verilmesi durumunda ise kararın bir örneğini savcılık soruşturma iznini veren komutanlığa veya askerî kurum amirliğine gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Askerî birlik komutanı veya askerî kurum amiri, emir komutasındaki asker kişilerin, ifadelerinin alınması veya sorgularının yapılması için hazır bulundurulmasını sağlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Soruşturma izni ve izin vermeye yetkili merciler" tür="Ek">
        <mvz-fıkra no="1">
          <template>Asker kişilerin işledikleri askerî suçların soruşturulması izne tabidir. Ancak, ağır ceza mahkemesinin görevine giren suçüstü hâllerinde soruşturma genel hükümlere göre yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Soruşturma izni, asgari tugay komutanı veya eşidi askerî kurum amiri (Deniz ve Hava Kuvvetleri Komutanlıklarında eşidi) olmak üzere, asker kişinin görev yaptığı birlik komutanı veya askerî kurum amiri, bu kişilerin yokluklarında ise vekilleri tarafından bizzat verilir. Genelkurmay Başkanlığı, Kuvvet Komutanlıkları ve Milli Savunma Üniversitesi hariç, Millî Savunma Bakanlığı merkez ve taşra teşkilatı ile bağlı ve ilgili kurum ve kuruluşlarda görev yapan asker kişiler hakkında soruşturma izni Millî Savunma Bakanı tarafından verilir. General ve amiraller hakkındaki soruşturma izni ise görev yeri dikkate alınarak ilgisine göre Genelkurmay Başkanının veya ilgili Kuvvet Komutanının teklifi üzerine ya da resen Millî Savunma Bakanı tarafından verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bir askerî birlik veya askerî kurumda geçici olarak görevlendirilen veya harekât komutasına verilen asker kişiler hakkında soruşturma izni, bu görevlerinin devamı süresince, geçici olarak görevlendirildikleri veya harekât komutasına verildikleri askerî birlik veya askerî kurumun bağlı bulunduğu soruşturma izni vermeye yetkili birlik komutanı veya askerî kurum amiri tarafından verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kanunlarda aksi yazılı olmadıkça, bir askerî birlik veya askerî kurum dışında görevlendirilen asker kişiler hakkında soruşturma izni, bu görevlerinin devamı süresince, Millî Savunma Bakanı tarafından verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Uluslararası anlaşmalar gereğince yabancı asker kişilerin askerî suçları hakkında soruşturma izni Millî Savunma Bakanı tarafından verilir. Bunlar hakkında altıncı ve yedinci fıkra hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Millî Savunma Bakanı, general ve amiraller hariç subay veya astsubaylara ilişkin soruşturma izni verme yetkisini, Personel Genel Müdürlüğünün bağlı olduğu bakan yardımcısına devredebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Subay ve astsubaylar hariç diğer kişilerin işledikleri askerî suçlara ilişkin soruşturma izni verme yetkisi, bu izni vermeye yetkili komutan veya askerî kurum amiri tarafından teşkilatında bulunan hukuk sınıfından olan ya da 27/7/1967 tarihli ve 926 sayılı Türk Silâhlı Kuvvetleri Personel Kanununun geçici 45 inci maddesinin birinci fıkrasının (b) bendi uyarınca atanmış olan hukuk hizmetleri başkanı veya birim amirine, Millî Savunma Bakanı tarafından merkezde Hukuk Hizmetleri Genel Müdürü veya yardımcısına, taşrada ve bağlı kurum ve kuruluşlarda ise asgari alay eşidi kurum amirine devredilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>İzin vermeye yetkili merci, ihbar veya şikâyetin işleme konulması hâlinde bir ön inceleme başlatır, ön incelemeyi bizzat yapabileceği gibi, izin vermeye asıl yetkili merciin emrinde olan ve hakkında inceleme yapılanın üstü konumundaki asker kişilerden birine de yaptırabilir. İzin vermeye yetkili merci, emrinde olan ve hakkında inceleme yapılanın üstü konumundaki en az üç asker kişiden oluşan bir heyet de görevlendirebilir. İzin vermeye yetkili merciin zorunlu gördüğü hâllerde, heyette yer alanların çoğunluğunun, hakkında inceleme yapılanın rütbe veya kıdemce eşidi veya üstü konumunda, heyet başkanının ise hakkında inceleme yapılanın üstü konumunda olması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Firar ve izin tecavüzü gibi hakkında ön inceleme yapılanın bulunamaması nedeniyle ifade almayı imkânsız hâle getiren zorunlu hâllerde, ilgilinin ifadesi alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Yetkili merci, soruşturma izni konusundaki kararını suçun işlenildiğinin öğrenilmesinden itibaren ön inceleme dâhil en geç otuz gün içinde verir. Bu süre, zorunlu hâllerde on beş günü geçmemek üzere bir defa uzatılabilir. Yetkili merci, belirtilen süreler içinde soruşturma izni verilmesi veya verilmemesi konusunda karar verir ve kararını Cumhuriyet başsavcılığına, hakkında inceleme yapılana ve varsa şikayetçiye bildirir. Bu kararlara karşı on gün içinde itiraz edilebilir. Sırf askerî suçlara ilişkin verilen soruşturma iznine itiraz edilmesi, soruşturma işlemlerini engellemez. İtiraz,  general ve amiraller için Danıştay Birinci Dairesine, diğer asker kişiler için ise yetkili merciin yargı çevresinde bulunduğu bölge idare mahkemesine yapılır. İtirazlar, öncelikle incelenir ve en geç üç ay içinde karara bağlanır. Verilen kararlar kesindir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>General ve amiraller hakkındaki soruşturma Yargıtay Cumhuriyet Başsavcısı veya Başsavcıvekili tarafından yapılır. Hâkim kararı gerektiren işlemlere dair Yargıtay Cumhuriyet Başsavcılığının talepleri ile kovuşturmaya yer olmadığına dair kararlara yapılan itirazlar hakkında, soruşturma konusu suçların en ağırına bakmakla görevli Yargıtay ceza dairesini numara itibarıyla izleyen ceza dairesi başkanı tarafından karar verilir. Suçun son numaralı ceza dairesinin görevine girmesi hâlinde talebi ve itirazı inceleme yetkisi Birinci Ceza Dairesi Başkanına aittir. Hâkim kararı gerektiren işlemlerde Başkanın verdiği kararlara karşı yapılan itirazı numara itibarıyla izleyen ceza dairesi başkanı inceler. Son numaralı daire başkanının kararı, Birinci Ceza Dairesi Başkanı tarafından incelenir. İddianame hazırlanması hâlinde kovuşturma Yargıtay ilgili ceza dairesince yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>19/4/1990 tarihli ve 3628 sayılı Mal Bildiriminde Bulunulması, Rüşvet ve Yolsuzluklarla Mücadele Kanununun 17 nci maddesinin birinci fıkrasında yer alan suçları işleyen asker kişiler hakkında soruşturma ve kovuşturma genel hükümlere göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Bu maddede hüküm bulunmayan hâllerde 2/12/1999 tarihli ve 4483 sayılı Memurlar ve Diğer Kamu Görevlilerinin Yargılanması Hakkında Kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="Yüce Divanda yargılanacak asker kişilerle ilgili soruşturma usulü" tür="Ek">
        <mvz-fıkra no="1">
          <template>Genelkurmay Başkanı ile Kara, Deniz ve Hava Kuvvetleri Komutanlarının işlediği askerî suçların soruşturulması izne tabidir. Ancak, ağır ceza mahkemesinin görevine giren suçüstü hâllerinde soruşturma genel hükümlere göre yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genelkurmay Başkanı ile Kara, Deniz ve Hava Kuvvetleri Komutanları hakkında askerî suçlardan dolayı soruşturma yapılması Cumhurbaşkanının iznine bağlıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İzin vermeye yetkili merci, ihbar veya şikâyetin işleme konulması hâlinde bir ön inceleme yaptırır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yetkili merci, soruşturma izni konusundaki kararını suçun işlenildiğinin öğrenilmesinden itibaren ön inceleme dâhil en geç otuz gün içinde verir. Bu süre, zorunlu hâllerde on beş günü geçmemek üzere bir defa uzatılabilir. Yetkili merci, belirtilen süreler içinde soruşturma izni verilmesi veya verilmemesi konusunda karar verir ve kararını Yargıtay Cumhuriyet Başsavcılığına, hakkında inceleme yapılana ve varsa şikayetçiye bildirir. Bu kararlara karşı on gün içinde Danıştay Birinci Dairesine itiraz edilebilir. İtirazlar, öncelikle incelenir ve en geç üç ay içinde karara bağlanır. Verilen kararlar kesindir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Soruşturma Yargıtay Cumhuriyet Başsavcısı tarafından yapılır. Hâkim kararı gerektiren işlemlere dair Yargıtay Cumhuriyet Başsavcılığının talepleri ile kovuşturmaya yer olmadığına dair kararlara yapılan itirazlar hakkında, soruşturma konusu suçların en ağırına bakmakla görevli Yargıtay ceza dairesini numara itibarıyla izleyen ceza dairesi başkanı tarafından karar verilir. Suçun son numaralı ceza dairesinin görevine girmesi hâlinde talebi ve itirazı inceleme yetkisi Birinci Ceza Dairesi Başkanına aittir. Hâkim kararı gerektiren işlemlerde Başkanın verdiği kararlara karşı yapılan itirazı numara itibarıyla izleyen ceza dairesi başkanı inceler. Son numaralı daire başkanının kararı, Birinci Ceza Dairesi Başkanı tarafından incelenir. İddianame düzenlenmesi hâlinde kovuşturma, Yüce Divan sıfatıyla Anayasa Mahkemesinde yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>3628 sayılı Kanunun 17 nci maddesinin birinci fıkrasında sayılan suçlar bakımından da bu madde hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu maddede hüküm bulunmayan hâllerde 4483 sayılı Kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="Hükmün açıklanmasının geri bırakılması" tür="Ek">
        <mvz-fıkra no="1">
          <template>4/12/2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun hükmün açıklanmasının geri bırakılmasına ilişkin hükümleri, aşağıdaki hâller hariç askerî suç ve cezalar hakkında da uygulanır:</template>
          <mvz-bent no="A">
            <template>Sırf askerî bir suçtan dolayı altı ay veya daha fazla süreli hapis cezasına hükmedilmesi.</template>
          </mvz-bent>
          <mvz-bent no="B">
            <template>Fiilin, disiplini ağır şekilde ihlal etmesi veya birliğin güvenliğini tehlikeye düşürmesi ya da birliğin muharebe hazırlığını veya etkinliğini zafiyete uğratması ya da büyük bir zarar meydana getirmesi.</template>
          </mvz-bent>
          <mvz-bent no="C">
            <template>Fiilin savaş veya seferberlikte işlenmesi.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Uygulanacak hükümler" tür="Ek">
        <mvz-fıkra no="1">
          <template>Askerî suçların soruşturması ve kovuşturmasına ilişkin olarak bu Kanunda hüküm bulunmayan hâllerde 5271 sayılı Kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Mahkemelerin görev ve yetkisi" tür="Ek">
        <mvz-fıkra no="1">
          <template>Askerî suçlara ilişkin dava ve işler, suçun işlendiği yerin bağlı olduğu ilin adıyla anılan asliye ve ağır ceza mahkemelerinde ya da askerî birlik ve personel yoğunluğunun gerektirmesi hâlinde Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Kurulunca belirlenen ilçelerde kurulu bulunan asliye veya ağır ceza mahkemelerinde görülür. İlçede görülmesine karar verildiği takdirde ilçenin yargı çevresi de aynı usulle belirlenir. Bu suçlara ilişkin dava ve işler, acele işlerden sayılır ve bunlarla ilgili davalar adli tatilde de görülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkra uyarınca belirlenen mahkemelerin görev alanına giren suçlara ilişkin davalarla;</template>
          <mvz-bent no="a">
            <template>Diğer mahkemelerin görev alanına giren suçlara ilişkin davaların aralarındaki bağlantı nedeniyle birlikte yürütülmesinin zorunlu olduğu hâllerde davalar, birinci fıkra uyarınca belirlenen mahkemelerde,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Türk Ceza Kanununun İkinci Kitap, Dördüncü Kısım altındaki Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde tanımlanan suçlar ile Terörle Mücadele Kanunu kapsamına giren suçlara ilişkin davaların aralarındaki bağlantı nedeniyle birlikte yürütülmesinin zorunlu olduğu hâllerde davalar, bu bentte belirtilen suçlara bakmakla görevli mahkemelerde,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>birleştirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Asker kişiler tarafından ülke sınırları dışında işlenen askerî suçlara ait dava ve işlere bakmaya birinci fıkra kapsamındaki Ankara mahkemeleri yetkilidir. Yurt dışında bulunan askerî mahallerde yapılacak önleme aramasına karar vermeye de bu yer sulh ceza hâkimliği yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunun 65 inci, 66 ncı, 67 nci, 68 inci ve 70 inci maddelerinde düzenlenen suçlara ilişkin dava ve işlerde yetkili mahkeme, şüpheli veya sanığın mensubu olduğu askerî birlik veya askerî kurumun bulunduğu yerde birinci fıkra uyarınca belirlenen il ve ilçe mahkemeleridir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Askerî suçlara ilişkin soruşturmalar, suçun işlendiği yerin bağlı olduğu ilin adıyla anılan Cumhuriyet başsavcılığınca ya da birinci fıkra uyarınca Hâkimler ve Savcılar Kurulunca belirlenen ilçe Cumhuriyet başsavcılığınca yürütülür. Bu başsavcılıklarda askerî suçlar bürosu kurulur ve yeteri kadar Cumhuriyet savcısı görevlendirilir. İl veya birinci fıkra uyarınca belirlenen ilçe Cumhuriyet savcısı, suçun işlendiği yer Cumhuriyet savcısından soruşturmanın kısmen veya tamamen yapılmasını isteyebilir. Gecikmesinde sakınca bulunan hâllerde suçun işlendiği yer Cumhuriyet savcısı zorunlu olan delilleri toplar ve gerekmesi hâlinde alınacak kararlar bakımından bulunduğu yer sulh ceza hâkimliğinden talepte bulunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="Atıflar" tür="Ek">
        <mvz-fıkra no="1">
          <template>Kanunlarda geçen;</template>
          <mvz-bent no="A">
            <template>Askerî Yargıtay, Yargıtayı,</template>
          </mvz-bent>
          <mvz-bent no="B">
            <template>Askerî Yargıtay Başsavcılığı, Yargıtay Cumhuriyet Başsavcılığını,</template>
          </mvz-bent>
          <mvz-bent no="C">
            <template>Askerî Yargıtay Başsavcısı, Yargıtay Cumhuriyet Başsavcısını,</template>
          </mvz-bent>
          <mvz-bent no="D">
            <template>Askerî Yargıtay Başkanı, Askerî Yargıtay daire başkanları ve Askerî Yargıtay üyeleri sırasıyla, Yargıtay Birinci Başkanını, Yargıtay daire başkanlarını ve Yargıtay üyelerini,</template>
          </mvz-bent>
          <mvz-bent no="E">
            <template>Askerî mahkeme, bu Kanun uyarınca belirlenen asliye ceza mahkemesini, ağır ceza mahkemesinin görev alanına giren suçlar bakımından ağır ceza mahkemesini,</template>
          </mvz-bent>
          <mvz-bent no="F">
            <template>Askerî hâkim, hâkim veya sulh ceza hâkimini,</template>
          </mvz-bent>
          <mvz-bent no="G">
            <template>Askerî savcılık, Cumhuriyet başsavcılığını,</template>
          </mvz-bent>
          <mvz-bent no="H">
            <template>Askerî savcı, ilgisine göre Cumhuriyet başsavcısını veya Cumhuriyet savcısını,</template>
          </mvz-bent>
          <mvz-bent no="I">
            <template>Yardımcı askerî savcı ve askerî savcı yardımcısı, Cumhuriyet savcısını,</template>
          </mvz-bent>
          <mvz-bent no="J">
            <template>Askerî adalet müfettişi, ilgisine göre Hâkimler ve Savcılar Kurulu müfettişlerini veya adalet müfettişlerini,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Genelkurmay Başkanı, Kara, Deniz ve Hava Kuvvetleri Komutanları ile general ve amiraller hakkında bu Kanunun ek 15 inci ve ek 16 ncı maddeleri kapsamında yürütülen işlemlerde soruşturma izni vermeye, soruşturma ve kovuşturma yapmaya yetkili mercilerin tayininde ilgililerin son rütbeleri ve görevleri esas alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu kanunun makabline şümulü :</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Bu kanun ile konulan cezalar bundan evvelki kanunlarda yazılı olan cezalardan daha hafif olduğu surette bu kanunun meriyete konulduğu tarihte hükmedilmemiş olan suçlarla eski kanuna göre hükmedilip henüz infaz edilmemiş veya infaz edilmekte bulunmuş olan hükümler hakkında da tatbik olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yürürlüğe girdiği tarihten önce 91 inci maddenin (4) numaralı fıkrası kapsamına giren suçlardan dolayı haklarında idam cezası verilen hükümlülerin dosyalarından;</template>
          <mvz-bent no="a">
            <template>Henüz Askerî Yargıtaya gönderilmemiş olan veya Askerî Yargıtay Başsavcılığında bulunan yahut Türkiye Büyük Millet Meclisine gönderilmiş olanlar, hükmü veren askerî mahkemece duruşma açılarak,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Askerî Yargıtayda bulunanlar, ilgili dairesince ele alınarak,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren üç ay içinde karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Askerî Yargıtay Başsavcılığında ve Türkiye Büyük Millet Meclisinde bulunan dosyalar, gelişlerindeki usule uygun olarak, bu Kanunun yürürlüğe girdiği tarihten itibaren bir ay içinde, hükmü veren askerî mahkemeye geri gönderilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanun uyarınca askerî suçlara bakmak amacıyla il ve ilçelerde belirlenecek mahkemeler, bu Kanunun yürürlüğe girdiği tarihten itibaren bir ay içinde belirlenir. Belirleme tarihi itibarıyla kovuşturma evresine geçilmiş askerî suçlara ilişkin dava dosyaları, belirlenen bu mahkemelere devredilmez, kesinleşinceye kadar açıldıkları mahkemelerde görülmeye devam olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mülga;</template>
          <mvz-bent no="a">
            <template>27/6/1972 tarihli ve 1600 sayılı Askerî Yargıtay Kanununa tabi Askerî Yargıtay Başkanı, Başsavcısı, İkinci Başkanı, daire başkanları ve üyelerinin görevleri sırasında işledikleri şahsi suçları ile görev suçlarının soruşturulması ve kovuşturulmasında Yargıtay Birinci Başkanı, Yargıtay daire başkanları ve üyeleri ile Yargıtay Cumhuriyet Başsavcısının,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>4/7/1972 tarihli ve 1602 sayılı Askerî Yüksek İdare Mahkemesi Kanununa tabi Askerî Yüksek İdare Mahkemesi Başkanı, Askerî Yüksek İdare Mahkemesi Başsavcısı, daire başkanları ve üyelerinin görevleri sırasında işledikleri şahsi suçları ile görev suçlarının soruşturulması ve kovuşturulmasında Danıştay Başkanı, Danıştay daire başkanları ve üyeleri ile Danıştay Başsavcısının,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>26/10/1963 tarihli ve 357 sayılı Askerî Hâkimler Kanununa tabi askerî hâkimlerin görevleri sırasında işledikleri şahsi suçları ile Millî Savunma Bakanı tarafından soruşturma yapılmasına izin verilmesi hâlinde görev suçlarının soruşturulması ve kovuşturulmasında 24/2/1983 tarihli ve 2802 sayılı Hâkimler ve Savcılar Kanununda yer alan hâkim ve Cumhuriyet savcılarının,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>yargılanmasına ilişkin hükümler uygulanır. Bu fıkra hükümleri (a) ve (b) bentlerinde yer alanların görevleri sırasındaki eylemleri nedeniyle yapılacak disiplin soruşturma veya kovuşturmaları bakımından da uygulanır. (c) bendinde yer alanların görevleri sırasındaki eylemleri nedeniyle yapılacak disiplin soruşturma veya kovuşturmaları bakımından ise 926 sayılı Kanunun geçici 45 inci maddesinin birinci fıkrasının (b) bendinde belirlenen disiplin hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>10/3/1983 tarihli ve 2803 sayılı Jandarma Teşkilat, Görev ve Yetkileri Kanununun geçici 5 inci maddesi ile 9/7/1982 tarihli ve 2692 sayılı Sahil Güvenlik Komutanlığı Kanununun geçici 9 uncu maddesi kapsamında Millî Savunma Bakanlığı tarafından Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı emrine görevlendirilen erbaş ve erler ile askerlik yükümlüleri, bu görevlendirme süresince asker kişi sayılırlar ve bu Kanuna tabi olmaya devam ederler. Bu kişilerin Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığında görevli rütbelilere karşı işledikleri askerî suçlar asker kişilere karşı işlenmiş sayılır. Soruşturma izni, Jandarma Genel Komutanlığında asgari alay komutanı veya eşidi kurum amiri, Sahil Güvenlik Komutanlığında ise asgari grup komutanı veya eşidi kurum amiri olmak üzere, asker kişinin fiilen görev yaptığı birlik komutanı veya kurum amiri, bu kişilerin yokluklarında ise vekilleri tarafından bizzat verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="194" başlık="Kanunun mer'iyeti tarihi">
        <mvz-fıkra no="1">
          <template>Bu kanun neşri tarihinden dört ay sonra muteberdir.</template>
        </mvz-fıkra>
