          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Seferberlik ve savaş halinde, bu maddede yazılı mehil bir güne iner. Bu maddedeki suçu seferberlikte işleyenlere beş seneden, savaş halinde işleyenlere ise yedi seneden aşağı olmamak üzere ağır hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="68" başlık="Mehil içinde yakalananların cezası">
          <mvz-fıkra no="1">
            <template>66 ve 67 nci maddelerde yazılı olan süreler içinde yakalananlara iki aydan altı aya kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aşağıda yazılı hallerde, gün unsuru aranmaz ve ceza artırılır.</template>
            <mvz-bent no="A">
              <template>Fail beraberinde silah, mühimmat, savaş araç ve gerecini götürmüş ise,</template>
            </mvz-bent>
            <mvz-bent no="B">
              <template>Fail hizmet yaparken kaçmış ise.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="69" başlık="Düşman  tarafında, düşman kaşısında, mahsur mevkiden kaçanların cezası">
          <mvz-fıkra no="1">
            <template>Düşman tarafına kaçan ölüme mahkum edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Düşman karşısında veya mahsur bir mevkiden kaçan müebbet veya muvakkat ağır hapis ile cezalandırılır. Vahim hallerde ölüm cezası verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="70" başlık="Sözleşerek firar ve cezası">
          <mvz-fıkra no="1">
            <template>İkiden ziyade askeri şahıslar önceden kararlaştırarak toplu kaçarlarsa sözleşerek firar sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçlular yabancı memlekete kaçmışlar ise ön ayak olanlar beş seneden yedi seneye kadar; ön ayak olanlar subay veya askeri memur ise beş seneden on seneye kadar ağır hapis ile cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suçlular vatan içine kaçmışlarsa ön ayak olanlar iki seneden beş seneye kadar, ön ayak olan subay veya askeri memur ise beş seneden yedi seneye kadar ağır hapis ile cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Sözleşerek kaçan diğer suçlular bir seneden üç seneye kadar hapsolunur. Firar yabancı memlekete ise ceza bir kat arttırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Seferberlikte sözleşerek firara ön ayak olanlar ölüm cezasiyle cezalandırılırlar, diğer suçluların cezaları muayyen cezanın yarısı kadar arttırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="71" başlık="Erbaşların rütbelerinin geri alınması">
          <mvz-fıkra no="1">
            <template>Firar ve izin tecavüzü cürümlerinden hüküm giyen erbaşların rütbelerinin geri alınmasına da hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="72" başlık="Firar cezalarının sonraya bırakılması">
          <mvz-fıkra no="1" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bunlar sevkolunurken, yollardan misafirhanelerden, bulundukları kıta ve müesseselerden tekrar kaçarlarsa evvelce mahkum oldukları ceza iki misline iblağ olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="73" başlık="Geri gelen kaçakların cezalarının indirilmesi">
          <mvz-fıkra no="1">
            <template>Kaçak, kaçtığından altı hafta, seferberlikte bir hafta içinde kendiliğinden geri gelirse yukarıki maddelere göre verilecek cezalar yarısına kadar indirilir. Ölüm cezası yerine müebbet ağır hapis yahut beş seneden az olmamak üzere ağır hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Firara kalkışanları haber vermiyenlerin cezası</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="74" başlık="">
          <mvz-fıkra no="1">
            <template>Bir firar teşebbüsünü doğru olarak haber alıpta firarın önü alınabilecek bir zamanda bunu amirine haber vermekte ihmal eden askeri şahıs, eğer  firar vuku bulmuş ise altı aya kadar ve firar seferberlikte vuku bulmuş ise iki seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="75" başlık="Kaçaklara yardım edenlerin cezaları">
          <mvz-fıkra no="1">
            <template>Asker kişileri kaçmağa kışkırtan veya kaçmalarını veya kaçaklığın devamını kolaylaştıran veya kaçakları, izinsizleri, bakayayı, yoklama kaçaklarını, saklıları ve çağrılıp ta gelmiyen yedek subaylar ve yedek astsubaylar ile yedek askeri memurları bilerek özel ve resmi hizmete alanlar veya gizliyenler veya Devlet, il ve belediyelerle bunların denetimi altındaki bütün kuruluş ve kurumlarda ve banka ve kamu faydasına çalışan dernek ve mesleki kuruluşlarda her ne suretle olursa olsun çalıştıranlar ve Hükümetten yapılacak tebligat üzerine özel işlerinden çıkarmıyanlar barışta üç aydan bir yıla ve tekerrüründe bir yıldan üç yıla, seferberlikte veya olağanüstü hallerde altı aydan iki yıla kadar hapis ve bu eylemin seferberlikte veya olağanüstü hallerde tekerrüründe yedi yıla kadar ağır hapis cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Seferberlikte herhangi bir suretle askeri kuvveti tenkise sebep olacak surette vakıa gayrimutabık kasten vesika verenler birinci defasında iki seneden beş seneye kadar ağır hapis ve mükerrirler ölüm cezasiyle cezalandırılırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="76" başlık="Tutukevi veya cezaevinden kaçmak veya kaçmaya aracı olmak">
          <mvz-fıkra no="1">
            <template>Askeri tutukevi veya cezaevinden kaçmak veya kaçmaya aracı olmak suçlarını işleyen asker kişiler hakkında, Türk Ceza Kanununun İkinci Kitabının Dördüncü Bab Yedinci Faslında yer alan hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ancak, askeri ceza ve tutukevlerinden altı gün veya daha fazla süre ile kaçan asker kişilere verilecek hapis cezası veya asıl cezaya ilave olunacak hürriyeti bağlayıcı ceza bir yıldan az olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="77" başlık="Göz veya oda hapsi ceza yerinden kaçmak, infaz şartlarına uymamak, kaçmaya aracı olmak">
          <mvz-fıkra no="1">
            <template>Disiplin mahkemeleri ile disiplin amirleri tarafından verilen göz veya oda hapsi cezalarının çekildiği yeri terk edenlere veya cezanın diğer infaz şartlarını yerine getirmeyenlere, bir aydan altı aya kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Göz veya oda hapsi ceza yerinden kaçanlara, aracı olanlara veya ihmal yahut kayıtsızlıkları ile kaçmalarına sebebiyet verenlere de aynı ceza uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Göz veya oda hapsini çekmekte olduğu yeri terk fiili, altı gün veya daha fazla devam etmiş ise, verilecek hapis cezası bir yıldan az olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="78" başlık="Düşman tarafına, yabancı memlekete kaçanlar hakkında mali ve fer'i cezalar">
          <mvz-fıkra no="A">
            <template></template>
            <mvz-bent no="1.">
              <template>Düşman tarafına kaçan veya seferberlikte mükellef olduğu hizmetten uzak kalmak kastiyle yabancı bir memlekete sığınanların veya yabancı memlekette kalanların mevcut ve ileride vücut bulacak menkul ve gayrimenkul bütün mal ve mülklerinin millet namına zaptına karar verilir. Bu karar verilirken suçlunun hısımları bir müdafi tayin etmek hakkını haizdirler.</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Bu karar maznuna, mümkün olmadığı halde onun son ikametgahına tebliğ olunur ve askeri mahkeme kapısına asılır, gazetelerle ilan olunur. Seferberliğin bittiğini bildiren emir tarihinden üç ay içinde bu tebliğ bir kere daha yapılır.</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Zabıt kararının bir hulasası karar tarihinden sekiz gün içinde tapu idarelerine ve gaiplerin mallarını idare ile muvazzaf olan makama tebliğ olunur.</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Zaptına karar verilen mal ve mülkler mezkür idareler tarafından satılıncaya kadar mahcuz kalır. Bu mal ve mülkler satılmazdan evvel maznun gelir veyahut yakalanır da muhakemesi yapılırsa haciz kaldırılır.</template>
            </mvz-bent>
            <mvz-bent no="5.">
              <template>Suçlunun kanunen infaka mecbur olduğu kimselerin geçinmeleri son ikametgahı sulh hakiminin emriyle haczolunan mallarından kıymetlerine göre temin olunabilir.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="B">
            <template></template>
            <mvz-bent no="1.">
              <template>Suçlunun füruu, baba ve anası, kardeşleri yahut karısı sağ ise, ölüme bağlı tasarruf hükümlerine göre  bu kimselerin mahfuz hisseleri miktarı kendilerine verilir ve mütebakisi millet menfaatine satılır. Bu mirasçılardan kimse bulunmazsa, bütün mallar millet menfaatine satılır.</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Suçlunun gelmesine maddi bir imkansızlığın sebebiyet verdiği resmi tahkikat ile sabit olmaz ise veya hısımları tarafından ispat edilemez ise (A) fıkrasının 2 rakamında yazılı olduğu üzere seferberlik bittikten sonra yapılacak son tebliğ tarihinden bir sene sonunda zabıt katileşir ve zaptolunan mallar satılır.</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Zaptolunan mallar devlet mallarının satılmasına dair kanunlara ve nizamnamelere göre satılır.</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Malların satılmasına ve kıymetlerine karşı itirazlar suçlunun Türkiyede bulunduğu son ikametgahı veya son bulunduğu mahal mahkemelerine arzolunur.</template>
            </mvz-bent>
            <mvz-bent no="5.">
              <template>Suçlunun borçları mirasçılara terkedilen hisselerden istifa olunur. Mirasçı yoksa bütün malların dörtte üçü suçlunun borçlarına karşılık teşkil eder.</template>
            </mvz-bent>
            <mvz-bent no="6.">
              <template>Mallar satıldıktan sonra A fıkrasının 2 numarasında yazılı müddetin hitamından evvel suçlunun ölmüş olduğu anlaşılırsa satılan malların bedeli mirasçılarına verilir.</template>
            </mvz-bent>
            <mvz-bent no="7.">
              <template>Zaptolunan mallar satıldıktan sonra vicahi muhakeme neticesinde suçlu beraet ederse geldiği veya yakalandığı günden ilerisi için bütün medeni haklarına sahip olur. Geçen zaman için mallarının zaptedilmesi yüzünden kendisine ve ailesine vakı olan zarar ve ziyanın tazminini Devletten talep ve iddia edebilir.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="C">
            <template></template>
            <mvz-bent no="1.">
              <template>Şahsi servetini gizlemek, elinden çıkarmak veya azaltmak kastiyle seferberlikte gerek hayatta bulunanlar arasında cari olan ve gerek ölüme bağlı bulunan akit ve tasarruflardan birine dair suçlu tarafından karşılıklı veya karşılıksız doğrudan doğruya veya bilvasıta yapılan her türlü talep ve müracaatlar ve muamelelerin muteber olmayacağı zabıt karariyle beraber karar altına alınır.</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>"A" fıkrasında gösterilen suçlunun mallarının zaptına karar verilmeden veya verildikten sonra bu suçlunun bütün mallarının veya bir kısmının kaçırılmasına veya azaltılmasına doğrudan doğruya ve bilvasıta bilerek yardım eden bütün devlet memurları, varisler, ticari, ve mali müesseseler, şirketler ve bütün üçüncü şahıslar bu suretle gizlenen veya kaçırılan mallar kıymetinin iki mislinden az ve üç mislinden çok olmamak üzere ağır para cezasına mahkum olurlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="D">
            <template>Suçlu Kanunu Medeni mucibince haiz olduğu vesayete mütallik bütün haklarını zayi eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="E">
            <template>Bu maddedeki suçlar hakkında, dava ve ceza müruru zamanı işlemez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-fasıl>
      <mvz-fasıl no="4-DÖRDÜNCÜ" başlık="Kendini askerliğe yaramayacak hale getirmek ve askerlikten kurtulmak için hile kullanmak">
        <mvz-madde no="79" başlık="Kendini askerliğe yaramayacak hale getirenlerin cezası">
          <mvz-fıkra no="1">
            <template>Kendisini kasten sakatlayan veya her hangi bir suretle askerliğe yaramayacak bir hale getiren veya kendi rızasiyle bu hale getirten bir seneden beş seneye kadar hapis cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiil her nevi askeri maksatlar için çalışmak kabiliyetini mahvetmiş ise suçlu yedi seneye kadar ağır hapis ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Fiil seferberlikte yapılmışsa on seneye kadar ağır hapis, düşman karşısında yapılmışsa yapan ölüm cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="80" başlık="Başkasını askerliğe yaramayacak hale getirenlerin cezası">
          <mvz-fıkra no="1">
            <template>79 uncu maddede yazılı fiilleri bilerek başkasına yapan dahi aynı ceza ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="81" başlık="Askerlikten kurtulmak için hile yapanlar">
          <mvz-fıkra no="1">
            <template>Askerlik çağına girenlerden askerlikten büsbütün veya kısmen kurtulmak kasdile ismini değiştirenler, başkasını kendi yerine tabib muayenesine veya askere gönderenler, başkasının hüviyet cüzdanını veya askeri vesikasını kullananlar, askerlik işlerinde sahte şehadetname veya evrak kullanan yahut her ne suretle olursa olsun hile ve desise yapanlarla kıt'aya veya bir müesseseye intisab ettikten sonra kendisinin yapmağa mecbur olduğu hizmetten büsbütün veya kısmen kurtulmak kasdile hile yapanlar on seneye kadar ağır hapis cezası ile cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıdaki fıkrada yazılı cezalar suç ortaklarına da uygulanır. Az vahim hallerde altı aydan beş seneye kadar hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-fasıl>
      <mvz-fasıl no="5-BEŞİNCİ" başlık="Askeri itaat ve inkıyadı bozan suçlar">
        <mvz-madde no="82" başlık="Amir veya üstü tehdit">
          <mvz-fıkra no="1" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Amir veya üstünü herhangi bir suretle tehdit edenlere, altı aydan iki seneye kadar hapis cezası verilir. Fiil toplu asker karşısında veya silahlı iken veya hizmet esnasında işlendiği takdirde, verilecek hapis cezası bir yıldan az olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="83" başlık="Bilerek doğru söylemeyenlerin cezaları" durum="mülga">
        </mvz-madde>
        <mvz-madde no="84" başlık="Yalan yere şikâyet">
          <mvz-fıkra no="1">
            <template>Doğru olmadığını bildiği iddialarla şikayete kalkışan üç aya kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="85" başlık="Amir ve mafevkine hakaret edenlerin cezaları">
          <mvz-fıkra no="1">
            <template>Bir amire veya üste hakaret eden üç aydan bir seneye kadar hapis cezası ile, hakaret hizmet esnasında yahut hizmete müteallik bir muameleden dolayı vuku bulursa altı aydan üç seneye kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hakaret bir maddei mahsusa tayini ile vukua gelmiş ise altı aydan beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hakaret umuma teşhir olunmuş yazı, resim veya sair neşir vasıtalariyle veya resmi makamlara verilipte üzerine muamele cereyan etmiş evrak ile yapılmış ise bir seneden beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="86" başlık="İtaatsizlik ve cezası" durum="mülga">
        </mvz-madde>
        <mvz-madde no="87" başlık="İtaatsizlikte ısrar edenlerin cezası">
          <mvz-fıkra no="1">
            <template>Hizmete ilişkin emri hiç yapmayan asker kişiler bir aydan bir seneye kadar, emrin yerine getirilmesini söz veya fiili ile açıkça reddeden veya emir tekrar edildiği halde emri yerine getirmeyenler, üç aydan iki seneye kadar hapis cezası ile cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıki fıkrada yazılı suçlar seferberlikte yapılırsa beş ve düşman karşısında yapılırsa on seneye kadar ağır hapis cezası hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="88" başlık="Toplu asker karşısında veya hizmetten savuşmak için veya silahlı iken yapılan itaatsizliğin cezaları">
          <mvz-fıkra no="1">
            <template>87 nci maddede yazılı itaatsizlik suçlarını; toplu asker karşısında yahut silah başı emrine karşı veya silahlı iken veya hizmetten kısmen veya tamamen sıyrılmak kastı ile yapanlar altı aydan beş seneye kadar hapis, seferberlikte beş seneye kadar ağır hapis ve düşman karşısında on seneden aşağı olmamak üzere ağır hapis cezası ile cezalandırılırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="89" başlık="Büyük zararlar veren itaatsizliğin cezaları">
          <mvz-fıkra no="1">
            <template>Emre itaatsizlik sonucu bir insanın hayatını tehlikeye koyan, memleketin veya bir askeri birliğin güvenliğini veya savaş hazırlığını veya eğitimini önemli derecede ihlal eden veya büyük bir zarar meydana getiren yahut başkasının malına önemli bir zarar veren asker kişiler, bir seneden on seneye kadar hapis, seferberlikte iki seneden onbeş seneye kadar ağır hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Düşman karşısında ölüm cezası veyahut on beş seneden aşağı olmamak üzere ağır hapis ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="90" başlık="Mukavemet ve cezası">
          <mvz-fıkra no="1">
            <template>Bir amiri veya mafevkını zorla ve tehdit ile hizmet emrini ifadan menetmeğe, yahut hizmete mütaallik bir muameleyi yapmak veya yapmamak için zorlamağa kalkışan mukavemet cürmünü yapmış olur. Bu cürmü işleyenler altı aydan on seneye kadar, az vahim hallerde üç aydan az olmamak üzere hapis, seferberlikte iki seneden, az vahim hallerde altı aydan aşağı olmamak üzere hapis cezalariyle cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mukavemet cürmü amirin muhafazasına memur olan yahut bu maksatla getirilen erbaşa ve ere karşı yapılırsa yine aynı ceza verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="91" başlık="Amire ve mafevka fiilen taarruz edenlerin cezaları">
          <mvz-fıkra no="1">
            <template>Amire veya mafevka fiilen taaruz eden veya fiilen taarruza teşebbüs eden üç seneden, az vahim hallerde altı aydan aşağı olmamak üzere hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Taarruz veya taarruza teşebbüs silahlı olarak veya bir hizmet esnasında veya toplu asker karşısında veyahut silah ve tehlikeli bir alet ile yapılmış ise beş seneden, az vahim hallerde bir seneden aşağı olmamak üzere suçluya hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Taarruz, amirin veya mafevkin vücudunda tahribatı mucip olmuşsa onbeş seneden az olmamak üzere ağır hapis, eğer ölümü mucip olmuşsa müebbet ağır hapis, az vahim hâllerde yirmidört seneden otuz seneye kadar ağır hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Taarruz veya taarruza teşebbüs seferberlikte yapılmışsa yirmi seneden, az vahim hâllerde onbeş seneden az olmamak üzere ağır hapis, eylem amir veya mafevkin vücudunda tahribatı mucip olmuşsa müebbet ağır hapis, ölümü mucip olmuş ise ölüm cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="92" başlık="Tahrik suretiyle madunun yaptığı suçlar hakkındaki cezaların nasıl indirileceği">
          <mvz-fıkra no="1">
            <template>Bir amir veya mafevk, askeri nizamlara ve askerlik kaidelerine mugayir muamelede bulunmak, yahut makam ve mevkiinin salahiyetini tecavüz etmek suretleriyle madunu tahrik eyler ve madun bu tahrik sebebiyle 82, 83, 84, 85, 86, 87, 88, 89, 90 ve 91 inci maddelerde yazılı suçlardan birini hemen yaparsa, Türk Ceza Kanununun elli birinci maddesine göre madunun cezası hafifletilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkradaki tahriki yapanlar tahrikin nevi ve mahiyetine göre 116, 117 ve 118 inci maddelerde yazılı cezalarla cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="93" başlık="Muharrik ve cezası">
          <mvz-fıkra no="1">
            <template>Askeri şahıslardan birini amire veya mafevka karşı itaatsizliğe mukavemete, fiilen taarruza sevk ve tahrik eden muharrik sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suç teşebbüs derecesinde kalmışsa muharrik üç aydan iki seneye ve seferberlikte altı aydan beş seneye kadar hapsolunur. Ceza herhalde müteşebbisin cezasından şiddetli olmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Suç yapılmışsa, muharrik cürme şerik olur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="94" başlık="İsyan muharriki ve cezası">
          <mvz-fıkra no="1">
            <template>Birden ziyade askeri şahısları hep birlikte amire veya mafevka itaatsizliğe veya mukavemete veyahut fiilen taarruza sevk ve tahrik eden isyan muharriki sayılır. Suç yapılmamış veyahut yapılmağa teşebbüs edilmemişse isyan muharriki beş seneden az olmamak üzere ağır hapis cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tahrik sebebiyle, askeri hizmete ehemmiyetli bir zarar gelmişse isyan muharriki on seneden az olmamak üzere ağır hapisle cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Seferberlikte isyan muharriki ölüm cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="95" başlık="Hilafı salahiyet askerlik işleri için toplananlar ve müzakere yapanların cezaları">
          <mvz-fıkra no="1">
            <template>Hakkı ve görevi olmadığı halde askeri muamelat, teşkilat, harekat, tesisat veya tertibata müteallik işler hakkında :</template>
            <mvz-bent no="a">
              <template>Müzakere veya istişare için asker kişileri toplayan,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Birlikte beyanat veya şikayette bulunmak üzere imza toplayan,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Birlikte beyanat veya şikayette bulunan,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Her ne suretle olursa olsun gösteri veya tezahüratta bulunan,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Kim olursa olsun altı aydan üç seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>(a) fıkrasında yazılı toplantıya bilerek katılanlar ile (b) fıkrasında yazılı beyanat ve şikayetlere imza koyanlar altı aya kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kendisine özel bir mezuniyet verilmediği halde, görevi ve sıfatı icabı muttali olduğu askeri muamelat, teşkilat, harekat, tesisat veya tertibata müteallik işler hakkında beyanat veren, yazı yazan veya sair surette açıklamada bulunanlar her kim olursa olsun, fiili daha ağır bir cezayı gerektirmediği takdirde altı aydan üç seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Astlık - üstlük münasebetlerini zedelemeye, amir veya komutanlara karşı güven hissini yok etmeye matuf olarak alenen tahkir veya tezyif edici fiil ve harekette bulunanlar altı aydan üç seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu maddede yazılı suçların basın yoliyle işlenmesi halinde ceza artırılarak verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu maddenin 3 ve 4 üncü fıkralarında yazılı suçlar hakkındaki soruşturma icrası Milli Savunma Bakanının iznine tabidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="96" başlık="Askerlikten soğutanların cezaları">
          <mvz-fıkra no="1">
            <template>Umuma teşhir olunmuş yazı, resim veya sair teşhir vasıtalarıyla veyahut seferberlikte sözle arkadaşlarını hoşnutsuzluğa kışkırtan, üç aydan beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="97" başlık="Fesat ve cezası">
          <mvz-fıkra no="1">
            <template>Birden ziyade askeri şahıslar bir amire veya mafevka hep birlikte itaatsizlik veya mukavemet veya fiilen taarruz etmek (M. 86, 90, 91) için ittifak ederlerse fesat sayılır ve ceza, ittifak edenlerin yapmak için ittifak ettikleri cürme tatbik edilecek kanun maddesine göre tayin ve ölüm ile müebbet ağır hapisten başka hallerde üç aydan iki seneye kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İttifak edenler eğer suçu işlerse ceza ölüm ve müebbet ağır hapisten başka hallerde 50 nci madde mucibince arttırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="98" başlık="Fesadı haber vermeyenlerin cezası">
          <mvz-fıkra no="1">
            <template>Fesat hakkında bir suretle haber alıpta fesada veya fesadın fiile çıkmasına mani olacak kadar vaktiyle malümat vermekte ihmal eden fesat, fiile çıktığı surette üç seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="99" başlık="Fesadı haber verenlerin cezadan kurtulması">
          <mvz-fıkra no="1">
            <template>Fesat için ittifak edenlerden biri, başka suretle malümat almadan fesadın fiile çıkmasına mümanaat mümkün olacak hal ve zamanda haber verirse, cezadan kurtulur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="100" başlık="Askeri isyan ve cezası">
          <mvz-fıkra no="1">
            <template>Birden ziyade askeri şahıslar, gürültü patırdı ile veya alenen toplanarak bir amire veya mafevka itaatsizliğe veya mukavemet veya fiilen taarruza (M. 86, 90, 91) birlikte kalkışırlarsa "Askeri isyan" sayılır. Toplanmaya iştirakedenlerin her biri beş seneden ve seferberlikte on seneden az olmamak üzere muvakkat ağır hapis cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="101" başlık="Askeri isyanda önayak olanların cezaları">
          <mvz-fıkra no="1">
            <template>Askerî isyanın (M. 100) reisi veya mürettibi veya ön ayak olanları ile asilerden amire ve mafevke zorla müessir fiillerde bulunanlar münferiden yaptıkları suç müebbet ağır hapis cezasını mucip değilse, on seneden az olmamak üzere muvakkat ağır hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Askeri isyan, seferberlikte yapılmışsa birinci fıkradaki suçlulara ölüm cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="102" başlık="Düşman karşısında askeri isyan suçlularının cezası">
          <mvz-fıkra no="1">
            <template>Askeri isyan (M. 100) düşman karşısında yapılmışsa isyana iştirak edenlerin hepsine ölüm cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="103" başlık="Askeri isyan ve fesada iştirak edenlerden nadim olanların cezalarının azaltılması">
          <mvz-fıkra no="1">
            <template>Bir fesada (M. 97) veya askeri isyana (M.100) iştirak edipte amirlere veya mafevklere zorla müessir fiiller yapmadan evvel nedametle intizam ve inzıbata dönenler fesat ve isyanın reisi veya mürettibi veya önayakları değilseler iki seneye kadar hapsolunurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Amir veya mafevka zorla müessir fiiller yapılmaksızın fesat ve isyana iştirak edenlerin hepsi intizam ve disipline dönerlerse reis veya mürettibi veya önayak olanları bir seneden beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="104" başlık="Askeri fesat ve isyana iştirak edenlerden önayak sayılacak diğer askerler">
          <mvz-fıkra no="1">
            <template>Askeri fesat (M. 97) ve isyana (M. 100) iştirak edenlerden şunlar da reis ve müşevvik cezalariyle cezalandırılırlar</template>
            <mvz-bent no="A">
              <template>Amir ve mafevk tarafından şahsına vakı olan itaat emrine karşı itaatsizlikte söz ile veya fiilen ısrar eden;</template>
            </mvz-bent>
            <mvz-bent no="B">
              <template>Askeri işareti suistimal ederek veya sair işaretler vererek isyanın vukuunu kolaylaştıran;</template>
            </mvz-bent>
            <mvz-bent no="C">
              <template>Asiler arasında en büyük rütbelisi veya en kıdemlisi olan;</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="105" başlık="Fesat ve isyan suçlularının cezalarının azaltılması">
          <mvz-fıkra no="1">
            <template>94, 100, 101 ve 104 üncü maddelerde yazılı suçlar az vahim oldukları halde 94 üncü maddenin birinci fıkrasında ve 100 üncü maddede yazılı cezalar altı ay ve seferberlikte bir sene hapis cezasına ve 94 üncü maddenin ikinci ve 101 nci maddenin birinci fıkrasında ve 104 üncü maddelerde yazılı olan cezalar bir sene hapis cezasına ve seferberlikte iki sene hapis cezasına ve 102 nci maddede yazılı ceza az vahim hallerde müebbeden ağır hapis veyahut beş sene den az olmamak üzere ağır hapis veya hapis cezalarına indirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="106" başlık="Askeri karakol ve nöbetçi ve devriyeye taarruz edenlerin cezaları">
          <mvz-fıkra no="1">
            <template>Askeri karakola, nöbetçiye ve devriyeye hakaret eden veya bunları dinlemiyen veya bunlara mukavemette bulunan yahut fiilen taarruz eden bu suçları amire karşı yapmış sayılır ve öylece cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="107" başlık="Bu fasıldaki cezalar maduna tatbik olunabilmesinin şartı">
          <mvz-fıkra no="1">
            <template>Bu fasılda madunlar hakkında tayin edilen ağır cezaların verilmesi için mafevkın rütbesi ve kıdemi herhangi bir suretle madunun malümu bulunması şarttır. Madunun mafevkın vaziyetini bilmediği sabit olursa hakkında tertip olunacak ceza umumi hükümlere tabidir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-fasıl>
      <mvz-fasıl no="6-ALTINCI" başlık="Makam ve memuriyet nüfuzunu suiistimal">
        <mvz-madde no="108" başlık="Madununa hizmetle münasebeti olmayan emirler verenlerin ve mutalebede bulunanların cezası" durum="mülga">
        </mvz-madde>
        <mvz-madde no="109" başlık="Madununa suç yapmak için emir verenlerin cezası">
          <mvz-fıkra no="1">
            <template>Rütbe veya makam ve memuriyetinin nüfuz ve salahiyetini suistimal ederek madununa bir suçun yapılmasını teklif eden, amir veya mafevk iki seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suç yapılır veya yapılmağa teşebbüs edilirse faili asliye muayyen olan ceza, emir veren hakkında (M. 50) artırılarak hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="110" başlık="Madunun şikayetnamesini saklayan veya geri aldıranların cezası">
          <mvz-fıkra no="1">
            <template>Madunların verdikleri şikayetnameleri saklayanlar veya tehdit ederek geri aldıranlar beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="111" başlık="Hak edilmemiş veya müsaade olunmamış disiplin cezası verenlerin cezası">
          <mvz-fıkra no="1">
            <template>Ceza vermek salahiyetini tecavüz ederek ve bilhassa hak edilmemiş veya müsaade olunmamış bir cezayı kasten verenler beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="112" başlık="Askeri mahkemeler üzerinde tesir yapanların cezası">
          <mvz-fıkra no="1">
            <template>Memuriyetinin nüfuzunu suistimal ile askeri mahkemeler üzerinde tesir yapanlar beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="113" başlık="Askeri şahısları mürettep oldukları yerlerden geriye sevkedenlerin cezası">
          <mvz-fıkra no="1">
            <template>Askerlik hizmetine davet edilmiş olan kimseleri, makbul bir sebep olmaksızın mürettep oldukları mevki ve kıta ve müessesenin gayrısına sevkeden altı aya kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Seferberlikte bu ceza bir seneden az olmamak üzere arttırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="114" başlık="Erleri kanuna muhalif olarak hizmetçiliğe verenlerin cezası">
          <mvz-fıkra no="1">
            <template>Kanunen emir veya seyis eri almaya hakkı olmayanlara emir veya seyis eri verenlerle bu emir veya seyis erini alıp istihdam edenler asker olsun olmasın bir aydan 3 aya kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Emir veya seyis eri almak hakkını haiz olanlardan kendi emir veya seyis erini askerlik şeref ve haysiyetine uymayan şekillerde süfli hizmetlerde çalıştıranlar veyahut bunların vazifesi dışında kendi sanat, meslek veya şahsi işlerinde çalışmasına müsaade veya müsamaha edenler bir aydan 6 aya kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukardaki haller haricinde askerleri hizmetçiliğe veya sair suretlerle çalışmaya verenlerle asker olsun olmasın alan veya çalıştıranlar 2 aydan bir seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="115" başlık="Memuriyet nüfuzunun sair suretle kötüye kullanılması">
          <mvz-fıkra no="1">
            <template>Emir vermek yetkisini veya memuriyet nüfuzunu kötüye kullanarak mevzuatın tayin ettiği ahvalden başka bir suretle herhangi bir gerçek veya tüzel kişi yahut astı hakkında keyfi bir işlem yapan yahut yapılmasını emreden amir veya üst, bir aydan iki seneye kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu işlem, siyasi bir amaçla yahut kişisel bir çıkar sağlamak için yapılmış veya yapılması emredilmiş ise, fiil başka bir suç oluşturmadığı takdirde altı aydan aşağı olmamak üzere hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="116" başlık="Madununa sövüp sayan veya fena muamelede bulunanların cezası" durum="mülga">
        </mvz-madde>
        <mvz-madde no="117" başlık="Maduna müessir fiiller yapanların cezası">
          <mvz-fıkra no="1">
            <template>Madununu kasten itip kakan, döven, veya sair suretlerle cismen eza verecek veya sıhhatini bozacak hallerde bulunan veyahut tazip maksadiyle madunun hizmetini lüzumsuz yere güçleştiren veya onun diğer askerler tarafından tazip edilmesine veya suimuamelde bulunulmasına müsamaha eden amir veya mafevk iki seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="118" başlık="Müessir fiillerle Madununun vücudunda tahribat yapan veya ölümüne sebep olan mafevka verilecek ceza">
          <mvz-fıkra no="1">
            <template>117 nci maddede yazılan fiiller madunun vücudunda tahrıbatı mucip olmuş ise amir veya mafevk beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Daha ziyade vahim hallerde amir ve mafevk altı aydan beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Fiil taammüden yapılmış ise amir veya mafevk on seneye kadar ağır hapis cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Fiil ölümü intaç etmiş ise fail on seneden az olmamak üzere ağır hapis cezasına mahkum olur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="119" başlık="Mafevkin cürüm sayılmayacak olan fiilleri">
          <mvz-fıkra no="1">
            <template>Bir madunun fiili taarruzlarını defetmek yahut mübrem ve müstacel bir zaruret ve tehlike halinde verdiği emirlere itaat ettirmek için bir mafevk tarafından yapılan müessir fiiller makam ve memuriyet nufuzunu suistimal telakki edilmez ve suç sayılmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hüküm harbde veya eşkıya müsademeleri ve isyan yahut askerlik harekatı ve mücrim takıbatı gibi vazifeler başında mübrem surette elzem bir itaati temin için başka vasıtalar bulunmadığı takdirde bir subayın madunun ısrar ve mukavemetine karşı silah kullanmaya mecbur kalması halinde de caridir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mafevkin, hizmete ve askerliğe dair kusur ve hatalardan dolayı madunu tenkit ve muanaze etmesi hakaret sayılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="120" başlık="Bu fasıldaki suçlarda karakolun vaziyeti">
          <mvz-fıkra no="1">
            <template>Bu fasılda yazılı olan suçları yapan bir askeri karakol veya devriye yahut nöbetçi bu suçları yapan mafevk gibi ceza görür.Bu suçlar karakol amiri olan mafevka karşı yapılmış ise ceza arttırılır. –M. 50– 119 uncu maddenin hükümleri karakollar hakkında da caridir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="121" başlık="Askerliğe ait vesika, evrak, harita ve şekilleri yakanlar">
          <mvz-fıkra no="1">
            <template>Askerliğe ve hesap işlerine dair olan defterleri ve müsveddeleri, vesikaları, hükümlü evrakı, harita ve şekilleri fena niyetle tahrip eden, yakan, yok eden veya ettiren on seneye kadar hapsolunur. Bunları muhafaza imkanı olmayıpta düşman eline geçmesinde düşman için fayda varsa bu fiiller suç sayılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-fasıl>
      <mvz-fasıl no="7-YEDİNCİ" başlık="Seferberlikte insanlar ve mallar aleyhine yapılan cürümler">
        <mvz-madde no="122" başlık="Ganimet almak için uzaklaşan, ganimet alan ve aldığı şeyi teslim etmeyenler">
          <mvz-fıkra no="1">
            <template>Seferberlikte ganimet almak kastiyle kıtasından uzaklaşan veyahut ganimet hukukuna tabi bir şeyi ganimet namiyle kendiliğinden temellük eden üç seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Meşru surette aldığı ve fakat teslim ile mükellef bulunduğu şeyleri teslimden imtina ile temellük eden dahi aynı ceza ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="123" başlık="Yağmacılığın tarifi">
          <mvz-fıkra no="1">
            <template>Harbin mucip olduğu dehşet ve korkudan istifade veya askeri kuvvetini suistimal ederek:</template>
            <mvz-bent no="A">
              <template>Ahaliden birinin malını haksız olarak zabt veya bir kimseyi malını vermeğe icbar eden;</template>
            </mvz-bent>
            <mvz-bent no="B">
              <template>Salahiyeti olmadığı halde ahaliden para veyahut zorla eşya toplayan veya memur olduğu istimvalin  derecesinin kendi menfaatları için aşan yağmacı sayılır.</template>
            </mvz-bent>
            <mvz-bent no="C">
              <template>Alınan eşya erzak, sıhhi levazım, giyecek, ısınılacak gibi şeyler yeme veya nakil vasıtalarına munhasır kalır ve o andaki zaruri ihtiyaçlarla mütenasip bulunursa bu hareket yağmacılık sayılmaz.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="124" başlık="Yağmacılığın cezası">
          <mvz-fıkra no="1">
            <template>Yağmacılık eden her askeri şahıs beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="125" başlık="Bir kimsenin malını tahrip veya imha edenlerin cezası">
          <mvz-fıkra no="1">
            <template>Harb zarureti olmaksızın bir kimsenin mal ve mülkünü kasten tahrip ve imha edenler ve ağaçları kesenler ve mahsulat ve mezruata hasar iras edenler ve bunlar için emir verenler veya müsamahada bulunan amir ve mafevkler iki seneye kadar hapsolunur. Ve daha vahim hallerde yağmacı sayılırlar. (M. 123)</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıdaki fiilleri yapanlarla emir veren veya müsamaha eden amir ve mafevkler hakkında Adliye mahkemelerinde alakadarlar tarafından tazminat davası açılabilir. Ve bu fiilleri yapanlarla emir veren veya müsamaha eden amir ve mafevkler icabeden tazminatla müteselsilen mahkum olur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="126" başlık="Zorla, müessir fiillere birden ziyade şahısların iştirakiyle yağmacılık ve cezası">
          <mvz-fıkra no="1">
            <template>Yağmacılık (M. 123) veya yağmacılıktan sayılan fiiller (M.125) bir şahsa karşı zorla yapılırsa faili on seneye kadar ağır hapis cezasiyle cezalandırılır. Eğer bu zorluk cismen tahribatı mucip olursa faili on seneden az olmamak üzere muvakkat ağır hapis cezasiyle mücazat olunur. Fiil ölümü mucip olursa faili ölüme mahkum olur; az vahim hallerde müebbet ağır hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukardaki fıkrada yazılı yağmacılığa birden ziyade şahıslar iştirak eylerse reis ve mürettibi ve önayak olanları ölüme mahkum olur. Diğerleri birinci fıkra mucibince cezalandırılır. Bu yağmacılıkta bir şahsa karşı müessir fiillerde bulunmaksızın iştirak edenlere on seneye kadar ağır hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="127" başlık="Muharebe meydanlarında ölülerin ,esirlerin, yaralıların mallarına tecavüz edenler">
          <mvz-fıkra no="1">
            <template>Haksız  olarak  ve  temellük  kastiyle  Türkiye  Cumhuriyeti  ve  müttefikleri  ordusundan  muharebe  meydanlarında  ölü  olarak  kalmış  olanların  eşya  ve  paralarını  alan   veyahut   muharebe  meydanlarında   veya  yürüyüş  esnasında  veya  hastanede  veyahut  nakliyat  zamanında  bir  hastanın,  bir  yaralının   veya  nezaret ve muhafazası altına verilmiş olan bir harb esirinin bir şeyini alan veya zorla zapteden veyahut Hilali Ahmer ve Salibi Ahmer'e mensup sıhhiye müesseselerini yağma ve tahrip eden veya bu bapta teşvikat ve tahrikat yapan ve emir veren on seneye kadar ağır hapis ile cezalandırılır. Az vahim hallerde beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Nakline memur olduğu yaralıyı bir sebep ve zaruret olmaksızın terkeden veyahut bir yaralıya işkence eden beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yaralıyı soymak kastiyle işkence eden veya soyarken tekrar yaralayan ölüm cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="128" başlık="Kıtasından geri kalarak ahaliye taaddi edenler">
          <mvz-fıkra no="1">
            <template>Mensup olduğu kıtaat veya askeri heyetten geri kalarak ahaliye taaddi eden altı aydan beş seneye kadar hapsolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu fiile birden ziyade şahıslar iştirak ederek ahaliyi tazyik etmiş olurlarsa veyahut fiil yağmacılk (M. 123 ve 125) şeklini almış olursa müştereklerden her biri on seneye kadar ağır hapis cezasiyle cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="129" başlık="Fiillerin Türk vatandaşlarına karşı yapılmasının cezası">
          <mvz-fıkra no="1">
            <template>123, 124, 125, 126 ve 128 inci maddelerde yazılı olan fiiller Türk vatandaşlarına karşı yapılırsa ceza arttırılır. (M. 50) Eğer ceza Türk Ceza Kanununda daha şiddetli ise o kanun hükümleri tatbik olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-fasıl>
      <mvz-fasıl no="8-SEKİZİNCİ" başlık="Mallara karşı yapılan diğer cürümler">
        <mvz-madde no="130" başlık="Hizmete mahsus eşyayı tahrip ve terk ve kaybedenler">
          <mvz-fıkra no="1">
            <template>Askeri eşyayı kasten terk veya kısmen yahut tamamen tahrip eden, özürsüz kaybeden veya harabolmasına sebebiyet veren veya özel menfaati için kullanan asker kişiler, eşyanın değeri, önemi, meydana gelen hasarın miktarı ve fiilin işleniş şekline göre üç aydan iki seneye kadar hapis cezası ile cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suç konusu eşya; silah, mühimmat, savaş aracı veya gereci ise ceza artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kaybedilen, kasten terk veya kısmen yahut tamamen tahrip edilen veya harabolmasına sebebiyet verilen eşyanın ödettirilmesine de ayrıca hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="131" başlık="Eşyayı ve malları çalan, satan, rehine veren ve alanlar">
          <mvz-fıkra no="1">
            <template>Askeri bir hizmet yaparken veya vazifeyi suistimal ederek bir hizmet veya vazifeden ötürü tevdi veya emanet edilmiş olan para veya kıymeti ne olursa olsun bir eşyayı yahut kendisine tevdi veya emanet edilmiş olmasa bile her türlü askeri erzak, eşya ve hayvanları çalanlar veya zimmetine geçirenler, yahut ihtilas edenler veya satanlar, yahut rehine verenler ve bunları bilerek satın alanlar veya rehin kabul edenler veya gizliyenler beş seneye kadar ağır hapis cezasile cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Az vahim hallerde, altı aydan üç seneye kadar hapis cezası hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Çalınan veya rehin edilen mallar bulunursa geri alınır. Yok edilen eşya, hayvan ve sairenin değerlerinin ödettirilmesine de hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıki fıkrada yazılı fiiller silah, cephane veya her hangi bir müdafaa vasıtasına taallük ederse ceza arttırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıki iki fıkrada yazılı fiiller seferberlikte yapılırsa yapanlar hakkında on seneden aşağı olmamak üzere ağır hapis, az vahim hallerde iki seneden aşağı olmamak üzere beş seneye kadar ağır hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="132" başlık="Üstünün, astının veya arkadaşının bir şeyini çalanlar">
          <mvz-fıkra no="1">
            <template>Bir üstünün, arkadaşının veya astının bir şeyini çalan asker kişiler, altı aydan beş seneye kadar hapis cezası ile cezalandırılırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="133" başlık="Bozuk ölçü kullananlar">
          <mvz-fıkra no="1">
            <template>Bir terazi veya kantar veya herhangi bir ölçüyü ayarı bozuk olduğunu bilerek askeri bir hizmetin ifasında kullananlar, iki seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-fasıl>
      <mvz-fasıl no="9-DOKUZUNCU" başlık="Hizmet ve vazifenin ihlali">
        <mvz-madde no="134" başlık="Hakikata muhalif rapor layiha sair evrak tanzim ve ita edenler">
          <mvz-fıkra no="1">
            <template>Hizmete veya tevdi edilen bir vazifeye mütaallik olarak kasten hakikata muhalif rapor veya takrir veya layiha ve sair resmi evrak tanzim eden ve veren veyahut bunların hakikata muhalif olduğunu bilerek mafevklere takdime delalet eden altı aydan üç seneye kadar hapis ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="135" başlık="Rüşvet">
          <mvz-fıkra no="1">
            <template>Askeri şahıslardan herhangi biri Türk Ceza Kanununun 3 üncü babının 3 üncü faslında yazılı suçlardan birini işlerse o fasıldaki cezalarla cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="136" başlık="Dikkatsizlik edenler">
          <mvz-fıkra no="1">
            <template>Her kim askeri karakolun veya müfrezenin veyahut hususi bir vazife ile mükellef olan bir kısım askerin kumandanı veya subaylarından veyahut nöbetçi iken kasten veya tekasülünden :</template>
            <mvz-bent no="A">
              <template>Kendisini verilen vazifeyi yapmayacak hale korsa;</template>
            </mvz-bent>
            <mvz-bent no="B">
              <template>Nöbet mahallini terkederse yahut verilen sair talimata mugayir hareket ederse;</template>
            </mvz-bent>
            <mvz-bent no="C">
              <template>Her iki halde de bir mazarratı mucip olursa on dört günden az olmamak üzere katıksız hapis veya iki seneye kadar hapis ile cezalandırılır.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıki fıkrada yazılı suç seferberlikte yapılmışsa suçlu altı aydan az olmamak üzere hapis, düşman karşısında ölüm, az vahim hallerde bir seneden az olmamak üzere muvakkat veya müebbet ağır hapis ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>2 nci fıkrada yazılı suç dolayısiyle ehemmiyetli bir zarar tehlikesi zuhura gelmişse üç aydan aşağı olmamak üzere hapis, bu tehlike düşman karşısında olduğu takdirde suçluya bir seneden az olmamak üzere ağır hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="137" başlık="Tekasül dolayısiyle esliha ve harb malzemesinden bir şeyin hasara uğramasına sebep olanlar">
          <mvz-fıkra no="1">
            <template>Vazife veya hizmette tekasül dolayısiyle bir gemi veya tayyarenin veya esliha ve harb malzemesinden birinin mühimce hasara uğramasına sebep olan  üç seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="138" başlık="Askeri mahkeme işine sekte verenler">
          <mvz-fıkra no="1">
            <template>Askeri mahkemelerin vazifelerini ve muamelelerini makbul sebeb olmaksızın geciktiren altı aya kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="139" başlık="Suç yapılmasına göz yumanlar">
          <mvz-fıkra no="1">
            <template>Bir askeri karakolun veya bir müfrezenin veya hususi bir vazife ile mükellef olan bir kısım askerin kumandanı iken veyahut subaylarından veya nöbetçi iken mani olabileceği ve vazifeten men'e mecbur bulunduğu bir suçun yapılmasına göz yumarsa fiili kendisi yapmış gibi ceza görür.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="140" başlık="Mahsup ve mevkufları firar ettirenler">
          <mvz-fıkra no="1">
            <template>Bir mevkuf veya mahpusu muhafaza ve nezarete memur olupta kasten kaçıran veya firarını kolaylaştıran veyahut amiri tarafından emrolunduğu veya vazifeten mecbur bulunduğu halde bir diğerini tevkif ve hapsetmiyen Türk Ceza Kanununun 301, 302, 303, 304,305, 306 ve 307 nci maddeleri mucibince ceza görür.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="141" başlık="Erzak tağşiş edenler">
          <mvz-fıkra no="1">
            <template>Askeri tayınattan olan her nevi zehair ve erzakı tağşiş veya tebdil eden veya ettiren veya bu suretle tağşiş veya tebdil olunmuş zehair ve erzakı bilerek tevzi eden veya ettiren üç seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="142" başlık="Bozuk erzaktan tayınat verenler">
          <mvz-fıkra no="1">
            <template>Askeri tayınatı çürümüş bozulmuş zahire ve erzaktan veren veya verdiren iki seneye kadar hapsolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="143" başlık="Şartnameye aykırı mal ve hizmet kabul etmek">
          <mvz-fıkra no="1">
            <template>Sözleşmeye bağlanmış yiyecek, giyecek, teçhizat veya diğer mal ve hizmetler ile her nevi imalat ve inşaatı, sözleşmeye ilişkin şartname ve numulerine uymadıkları halde kabul eden veya ettirenler üç yıldan az olmamak üzere hapis cezası ile cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiil ceza kanunlarına göre daha ağır bir suç teşkil ediyorsa, ceza o kanuna göre tayin edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kabul edilen veya ettirilen eşya; silah, mühimmat, savaş aracı veya gereci ise veya suç seferberlik veya savaş halinde işlenmişse ceza artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="144" başlık="Umumi surette ihmal ve tekasül">
          <mvz-fıkra no="1">
            <template>Kendisine tevdi edilen askeri bir işin ifasında bu kanunda yazılı hallerden başka Türk Ceza Kanunu mucibince cezayı mucip ihmal ve tekasül gösteren ve vazifesini suiistimal eden o kanun mucibince cezalandırılır. (T.C.K.B: F:4)</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-fasıl>
      <mvz-fasıl no="10-ONUNCU" başlık="Askeri disiplini bozan sair fiiller">
        <mvz-madde no="145" başlık="Madununa nezarete ihmal edenler, madunun suçları hakkında takibatta bulunmayanlar">
          <mvz-fıkra no="1">
            <template>veya bu fiiller hakkında kasten kanuni takibatta bulunmayan mafevk kısa hapis ile veya altı aya kadar hapis ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="146" başlık="Başkasının yaralanmasına ve ölmesine sebep olanlar">
          <mvz-fıkra no="1">
            <template>Silahları ve cephanesi hakkında dikkatsizlik ve nizamlara ve emirlere talimatlara riayetsizlik dolayısıyla başkasının yaralanmasına veya ölmesine sebep olanlar hakkında Türk Ceza Kanununun 455 ve 459 uncu maddelerine göre ceza verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="147" başlık="İzinsiz evlenenler">
          <mvz-fıkra no="1">
            <template>İzin alması icap eden askeri şahıslardan izinsiz evlenenler bir seneye kadar hapsolunurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Evlenmeleri kanuna göre yasak olan askeri şahıslardan evlenenler üç aydan bir seneye kadar hapsolunurlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="148" başlık="Siyasi faaliyetlerde bulunanlar">
          <mvz-fıkra no="1">
            <template>Askeri şahıslardan;</template>

      <mvz-madde no="192" başlık="Son maddeler">
        <mvz-fıkra no="1">
          <template>Askeri Ceza Kanununun 75, 79 uncu maddelerile 78 inci maddesinin C fıkrasının iki numarasında ve askeri eşyayı satın almak, rehin olarak kabul etmek ve gizlemek fiillerine dair 131 inci maddede yazılı suçlar askeri mahkemelere tabi olmıyan siviller tarafından yapılırsa umumi mahkemeler bu kanun hükümlerini tatbik ederler.</template>
        </mvz-fıkra>

      <mvz-madde no="193" başlık="İlga edilen kanunlar">
        <mvz-fıkra no="1">
          <template>1286 tarihli Askeri Ceza Kanunu ile ilave ve zeyilleri ve muaddel maddeleri ve mensubini askeriyenin siyasetle meni iştigali hakkındaki 25 Eylül 1328 ve Askeri Ceza Kanununun 169 uncu maddesi makamına kaim olan 16 Teşrinievvel 1328 ve seferde tekalifi harbiye ve vesaiti nakliye komisyonlarına ve efradı cedidenin sevkine memur olanlar hakkındaki 21 Ağustos 1330 ve mafevk tarafından maduna yapılacak bazı ef'alin cürüm addolunmayacağına dair olan 30 Teşrinievvel 1330 ve 1286 tarihli Askeri Ceza Kanununun 101, 102, 103, 104 üncü maddesine matuf olan 3 Mart 1331 ve esrarı askeriye ve hiyaneti harbiye hakkındaki 16 Teşrinievvel 1330 ve seferde tart cezasının sureti tatbikına dair olan 25 Şubat 1330 tarihli kanunlarla zeyilleri ve sair kanunların bu kanuna muhalif olan hükümleri mülgadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="Ek">
        <mvz-fıkra no="1">

        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Tekerrürü halinde evvelce verilmiş olan ceza bir kat arttırılmakla beraber zabitlerle askeri memurlar hakkında "ihraç" astsubaylar hakkında "rütbenin geri alınması" cezaları da birlikte hükmolunur.</template>

      <mvz-madde no="2" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Aşağıda yazılı fiilleri ilk defa yapan yedek subay hakkında iki aydan altı aya ve astsubaylarla erler hakkında on beş günden üç aya kadar hapis cezası verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Tekerrürü halinde cezaları bir kat arttırılmakla beraber astsubaylar hakkında (rütbenin geri alınması) cezası da birlikte hükmolunur.</template>

        <mvz-fıkra no="2">

      <mvz-madde no="3" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Askeri doktorların bizzat hususi hastane açmaları memnudur. Hilafında hareket, birinci madde mucibince cezayı müstelzimdir.</template>

      <mvz-madde no="4" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>A) Fevkalade halin, seferberliğin veya harb halinin devamı müddetince askeri bir hizmet yaparken Milli Müdafaa vasıtalarına veya askeri ihtiyaçlara taallük eden taahhüt, imal, inşa, alım, satım, teslim, tesellüm, nakil, muhafaza veya tevzi yahut celp, sevk ve muayene gibi işlerde zimmet, ihtilas, irtikap, rüşvet veya hırsızlık suçlarından birini işliyenler on seneden aşağı olmamak üzere ağır hapis veya müebbet ağır hapis cezasiyle birlikte beş yüz liradan aşağı olmamak üzere ağır para cezasiyle cezalandırılırlar. Şu kadar ki para cezası hiçbir halde temin olunan menfaatin iki mislinden az olamaz.</template>
          <mvz-bent no="B">
            <template>Seferberlikte veya harp hâlinin devamı müddetince vahim hâllerde ölüm cezası hükmolunur.</template>

          <mvz-bent no="C">
            <template>Bu maddede yazılı suçlardan husule gelen veya husulü kasdolunan zarar hafif ise (A) fıkrasına göre hükmedilmesi lazımgelen muvakkat ağır hapis ve para cezası yarıya, pek az ise üçte bire indirilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Fevkalade halin, seferberliğin veya harb halinin devamı müddetince Milli Müdafaa vasıtalarına veya askeri ihtiyaçlara taallük eden işlerde hususi kanunlara göre kendilerine tevdi edilen vazifeleri yaparken bu kanunda yazılı suçları işliyen askeri olmıyan şahıslar hakkında da umumi mahkemelerce birinci maddede yazılı cezalar tatbik olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Birinci askeri yasak bölgeler içinde veya nöbet yerlerinde, karakollarda, kışlalarda, karargahlarda, askeri kurumlarda, yerleşme veya konaklama amaciyle kullanılan bina veya mahaller içinde; askerlere fiilen taarruzda bulunanlar, sövenler veya hakaret edenler veyahut askerlik görevlerine ilişkin işleri yapmaya veya yapmamaya zorlamak için şiddet veya tehdide başvuranlar Türk Ceza Kanununun bu fiillere ilişkin 188, 190, 191, 254, 255, 256, 257, 258, 260, 266, 267,268, 269, 271, 272 ve 273 üncü maddeleri uyarınca cezalandırılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Nöbetçi, devriye, karakol, inzibat, askeri trafik, kolluk veya kurtarma ve yardım görevi yapan askerlere karşı bu görevleri yaptıkları sırada yukarıdaki fıkrada yazılı suçları işliyenler aynı kanun maddeleri ile cezalandırılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Umumi emniyet ve asayişi korumaya ilişkin önleyici ve adli zabıta görevlerini ifa ettikleri sırada jandarma subay, astsubay, erbaş ve erlerine karşı işlenen suçlarda yukardaki fıkralar hükümleri uygulanmaz.</template>
        </mvz-fıkra>
