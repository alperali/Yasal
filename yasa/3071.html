  <mvz-künye tür="kanun" no="3071" başlık="DİLEKÇE HAKKININ KULLANILMASINA DAİR KANUN"
             tarih="1/11/1984" rgazete-tarih="10/11/1984" rgazete-sayı="18571"
             düstur-tertip="5" düstur-cilt="24" düstur-sayfa="64" />

  <mvz-madde no="1" başlık="Amaç">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, Türk vatandaşlarının ve Türkiye’de ikamet eden yabancıların kendileriyle veya kamu ile ilgili dilek ve şikâyetleri hakkında, Türkiye Büyük Millet Meclisine ve yetkili makamlara yazı ile başvurma haklarının kullanılma biçimini düzenlemektir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanun, Türk vatandaşları ve Türkiye’de ikamet eden yabancılar tarafından Türkiye Büyük Millet Meclisi ile idarî makamlara yapılan dilek ve şikâyetler hakkındaki başvuruları kapsar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Dilekçe hakkı">
    <mvz-fıkra no="1">
      <template>Türk vatandaşları kendileriyle veya kamu ile ilgili dilek ve şikayetleri hakkında, Türkiye Büyük Millet Meclisine ve yetkili makamlara yazı ile başvurma hakkına sahiptirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Türkiye’de ikamet eden yabancılar karşılıklılık esası gözetilmek ve dilekçelerinin Türkçe yazılması kaydıyla bu haktan yararlanabilirler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Dilekçede bulunması zorunlu şartlar">
    <mvz-fıkra no="1">
      <template>Türkiye Büyük Millet Meclisine veya yetkili makamlara verilen veya gönderilen dilekçelerde, dilekçe sahibinin adı-soyadı ve imzası ile iş veya ikametgâh adresinin bulunması gerekir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Gönderilen makamda hata">
    <mvz-fıkra no="1">
      <template>Dilekçe, konusuyla ilgili olmayan bir idari makama verilmesi durumunda, bu makam tarafından yetkili idari makama gönderilir ve ayrıca dilekçe sahibine de bilgi verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="İncelenemeyecek dilekçeler">
    <mvz-fıkra no="1">
      <template>Türkiye Büyük Millet Meclisine veya yetkili makamlara verilen veya gönderilen dilekçelerden;</template>
      <mvz-bent no="a">
        <template>Belli bir konuyu ihtiva etmeyenler,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Yargı mercilerinin görevine giren konularla ilgili olanlar,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>4 üncü maddede gösterilen şartlardan herhangi birini taşımayanlar,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İncelenemezler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Dilekçenin incelenmesi ve sonucunun bildirilmesi">
    <mvz-fıkra no="1">
      <template>Türk vatandaşlarının ve Türkiye’de ikamet eden yabancıların kendileri ve kamu ile ilgili dilek ve şikâyetleri konusunda yetkili makamlara yaptıkları başvuruların sonucu veya yapılmakta olan işlemin safahatı hakkında dilekçe sahiplerine en geç otuz gün içinde gerekçeli olarak cevap verilir. İşlem safahatının duyurulması halinde alınan sonuç ayrıca bildirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Türkiye Büyük Millet Meclisine yapılan başvuruların incelenmesi">
    <mvz-fıkra no="1">
      <template>Türkiye Büyük Millet Meclisine gönderilen dilekçelerin, Dilekçe Komisyonunda incelenmesi ve karara bağlanması altmış gün içinde sonuçlandırılır. İlgili kamu kurum veya kuruluşları Türkiye Büyük Millet Meclisi Dilekçe Komisyonunca gönderilen dilekçeleri otuz gün içinde cevaplandırır. İnceleme ve karara bağlamanın esas ve usulleri Türkiye Büyük Millet Meclisi İçtüzüğünde gösterilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Dilekçe Komisyonu, görevleri ile ilgili olarak, kamu kurum ve kuruluşları, kamu kurumu niteliğindeki meslek kuruluşları ile özel kuruluşlardan her türlü bilgi ve belgeyi almak, ilgilileri çağırıp bilgi almak, idari denetimin yapılmasını istemek, bilirkişi görevlendirmek ve yerinde inceleme yapmak yetkisine sahiptir. Bu yetkinin kullanılması durumunda kamu kurum ve kuruluşları ile kamu personeli, talep edilen bilgi ve belgeyi vermek, idari denetimi yapmak ve yerinde inceleme için gerekli tedbirleri almakla yükümlüdür.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Kaldırılan hüküm">
    <mvz-fıkra no="1">
      <template>26 Aralık 1962 tarih ve 140 sayılı Türk Vatandaşlarının Türkiye Büyük Millet Meclisine Dilekçe ile Başvurmaları ve Dilekçelerin İncelenmesi ile Karara Bağlanmasının Düzenlenmesine Dair Kanun yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Türkiye Büyük Millet Meclisi İçtüzüğünde gerekli değişiklikler yapılıncaya kadar, 140 sayılı Türk Vatandaşlarının Türkiye Büyük Millet Meclisine Dilekçe ile Başvurmaları ve Dilekçelerin İncelenmesi ile Karara Bağlanmasının Düzenlenmesine Dair Kanunun Dilekçe Komisyonunun çalışma esas ve usullerine ilişkin hükümlerinin uygulanmasına devam olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Yürürlük">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="Yürütme">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Türkiye Büyük Millet Meclisi Başkanı ile Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
