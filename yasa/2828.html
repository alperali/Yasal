  <mvz-künye tür="kanun" no="2828" başlık="SOSYAL HİZMETLER KANUNU"
             tarih="24/5/1983" rgazete-tarih="27/5/1983" rgazete-sayı="18059"
             düstur-tertip="5" düstur-cilt="22" düstur-sayfa="355" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam, Tanımlar ve Genel Esaslar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; korunmaya, bakıma veya yardıma ihtiyacı olan aile, çocuk, engelli, yaşlı ve diğer kişilere götürülen sosyal hizmetlere ve bu hizmetleri yürütmek üzere kurulan teşkilatın kuruluş, görev, yetki ve sorumluluklar ile faaliyet ve gelirlerine ait esas ve usulleri düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, sosyal hizmetlerle ilgili tüm kamu kurum ve kuruluşları ile gerçek kişileri ve özel hukuk tüzelkişilerini, sosyal hizmet kurum ve kuruluşlarında çalışan personeli, sosyal hizmetlerden faydalananları ve faydalanacak durumda olanları kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Kanunda geçen;</template>
        <mvz-bent no="a">
          <template>"Sosyal Hizmetler"; kişi ve ailelerin kendi bünye ve çevre şartlarından doğan veya kontrolleri dışında oluşan maddi, manevi ve sosyal yoksunluklarının giderilmesine ve ihtiyaçlarının karşılanmasına, sosyal sorunlarının önlenmesi ve çözümlenmesine yardımcı olunmasını ve hayat standartlarının iyileştirilmesi ve yükseltilmesini amaçlayan sistemli ve programlı hizmetler bütününü,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>"Korunmaya ihtiyacı olan Çocuk"; beden, ruh ve ahlak gelişimleri veya şahsi güvenlikleri tehlikede olup;</template>
          <mvz-altbent no="1">
            <template>Ana veya babasız, ana ve babasız,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Ana veya babası veya her ikisi de belli olmayan,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Ana ve babası veya her ikisi tarafından terkedilen,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Ana veya babası tarafından ihmal edilip; fuhuş, dilencilik, alkollü içkileri veya uyuşturucu maddeleri kullanma gibi her türlü sosyal tehlikelere ve kötü alışkanlıklara karşı savunmasız bırakılan ve başıboşluğa sürüklenen,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Çocuğu,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>"Engelli", doğuştan veya sonradan herhangi bir hastalık veya kaza sonucu bedensel, zihinsel, ruhsal, duygusal ve sosyal yeteneklerini çeşitli derecelerde kaybetmesi nedeniyle normal yaşamın gereklerine uymama durumunda olup; korunma, bakım, rehabilitasyon, danışmanlık ve destek hizmetlerine ihtiyacı olan kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>"Bakıma İhtiyacı Olan Engelli"; engellilik sınıflandırmasına göre resmî sağlık kurulu raporu ile ağır engelli olduğu belgelendirilenlerden, günlük hayatın alışılmış, tekrar eden gereklerini önemli ölçüde yerine getirememesi nedeniyle hayatını başkasının yardımı ve bakımı olmadan devam ettiremeyecek derecede düşkün olan kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>"İhtiyacı Olan Yaşlı"; sosyal veya ekonomik yönden yoksunluk içinde olup korunmaya, bakıma ve yardıma ihtiyacı olan yaşlı statüsündeki kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Sosyal hizmet kuruluşları; bu Kanunun amacına ve belirtilen esaslara uygun faaliyette bulunan kuruluşlar olup bunlardan;</template>
          <mvz-altbent no="1">
            <template>"Çocuk Yuvaları"; 0 - 12 yaş arası korunmaya ihtiyacı olan çocuklarla gerektiğinde 12 yaşını dolduran kız çocuklarının, bedensel, eğitsel, psiko sosyal gelişimlerini, sağlıklı bir kişilik veya iyi alışkanlıklar kazanmalarını sağlamakla görevli ve yükümlü yatılı sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>"Yetiştirme Yurtları"; 13 - 18 yaş arası korunmaya ihtiyacı olan çocukları korumak, bakmak ve bir iş veya meslek sahibi edilmeleri ve topluma yararlı kişiler olarak yetişmelerini sağlamakla görevli ve yükümlü olan yatılı sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>"Kreş ve Gündüz Bakımevleri"; 0 - 6 yaş grubundaki çocukların bakımlarını gerçekleştirmek, bedensel ve ruhsal sağlıklarını korumak ve geliştirmek ve bu çocuklara temel değer ve alışkanlıkları kazandırmak amacıyla kurulan  ve yatılı olmayan sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>"Huzurevleri"; ihtiyacı olan yaşlı kişileri huzurlu bir ortamda korumak ve bakmak, sosyal ve psikolojik ihtiyaçlarını karşılamak amacıyla kurulan yatılı sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>"Bakım ve Rehabilitasyon Merkezleri"; bedensel, zihinsel ve ruhsal engellilikleri nedeniyle normal yaşamın gereklerine uymama durumunda olan kişilerin, fonksiyon kayıplarını gidermek ve toplum içinde kendi kendilerine yeterli olmasını sağlayan beceriler kazandırmak veya bu becerileri kazanamayanlara devamlı bakmak üzere kurulan sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>"Çocuk Destek Merkezleri"; Suça sürüklenmesi, suç mağduru olması veya sokakta sosyal tehlikelerle karşı karşıya kalması sebebiyle haklarında bakım tedbiri veya korunma kararı verilen çocuklardan psikososyal desteğe ihtiyaç duyduğu tespit edilenlerin, bu ihtiyaçları giderilinceye kadar geçici süre ile bakım ve korunmalarının sağlandığı, bu süre içinde aile, yakın çevre ve toplum ilişkilerinin düzenlenmesine yönelik çalışmaların yürütüldüğü; çocukların mağduriyet, suça sürüklenme, yaş ve cinsiyet durumuna göre ayrı ayrıyapılandırılan veya ihtisaslaştırılan yatılı sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>"Kadın veya Erkek Konukevleri", fiziksel, duygusal, cinsel ve ekonomik istismara uğrayan kadın veya erkeklerin psiko-sosyal ve ekonomik problemlerinin çözümlenmesi sırasında varsa çocukları ile birlikte ihtiyaçlarını karşılamak amacıyla geçici bir süre kalabilecekleri yatılı sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>"Toplum veya Aile Danışma Merkezleri", toplumun ve ailenin gelişmesi için; bireyin katılımcı, üretken ve kendine yeterli hale gelmesi amacıyla koruyucu, önleyici, eğitici, geliştirici, rehberlik ve rehabilite edici işlevlerini, gerekirse diğer kuruluşlar ve gönüllülerle işbirliği içerisinde sunmakla görevli bulunan gündüzlü sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="9">
            <template>"Aktif Yaşam Merkezi"; Yaşlı bireyler ile engelli bireylerin yaşam kalitesinin artırılması ve sosyal hayata aktif katılımlarına katkı sağlanması amacıyla, engelli ve yaşlı bireyler ile ailelerine rehberlik ve destek hizmeti ile evde gündüz bakım hizmeti sunan gündüzlü sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="10">
            <template>"Çok Amaçlı Sosyal Hizmet Kuruluşları"; aynı yerleşkede ve/veya binada, birden çok sosyal hizmet kuruluşunun tek yönetim ve denetim altında kurulmasına ve çalışmasına imkan tanıyan sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="11">
            <template>"Çocuk evleri"; 0-18 yaşlar arasındaki korunmaya ihtiyacı olan çocukların kaldığı ev birimlerini,</template>
          </mvz-altbent>
          <mvz-altbent no="12">
            <template>"Çocuk Evleri Sitesi"; Korunma ihtiyacı olan çocukların bakımlarının sağlandığı aynı yerleşkede bulunan birden fazla ev tipi sosyal hizmet biriminden oluşan kuruluşu,</template>
          </mvz-altbent>
          <mvz-altbent no="13">
            <template>"Ev Tipi Sosyal Hizmet Birimleri"; Çocuk, kadın, engelli ve yaşlılar ile bakım veya barınma ihtiyacı olan kişilere hizmet verilen mesken niteliğindeki yatılı sosyal hizmet birimlerini,</template>
          </mvz-altbent>
          <mvz-altbent no="14">
            <template>"Ev Tipi Sosyal Hizmet Birimleri Koordinasyon Merkezi"; İl müdürlüğü bünyesinde oluşturulan ev tipi sosyal hizmet birimlerinin bağlı olduğu merkezi,</template>
          </mvz-altbent>
          <mvz-altbent no="15">
            <template>"Sosyal Hizmet Merkezi"; İhtiyaç sahiplerinin tespit edilerek sosyal hizmet müdahalesinin ve takibinin gerçekleştirilmesi, çocuk, genç, kadın, erkek, engelli, yaşlı bireylere ve ailelerine koruyucu, önleyici, destekleyici, geliştirici hizmetler ile rehberlik ve danışmanlık hizmetlerinin bir arada ve en kolay ulaşılabilir biçimde, gerektiğinde kamu kurum ve kuruluşları, yerel yönetimler, üniversiteler, sivil toplum kuruluşları ve gönüllüler ile işbirliği içinde sunulmasından ve bu hizmetlerin koordinasyonundan sorumlu gündüzlü sosyal hizmet kuruluşlarını,</template>
          </mvz-altbent>
          <mvz-altbent no="16">
            <template>"Çocuk Evleri Koordinasyon Merkezi"; Çocuk evlerinin illerde planlanması, açılış ve işleyişine ilişkin her türlü işlemler ile harcamaların yapılması, takibi, denetlenmesi ve çocuk evleri arasındaki koordinasyonun sağlanması amacıyla oluşturulan merkezleri,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="g">
          <template>"Kurum"; bu Kanunla kurulan Sosyal Hizmetler ve Çocuk Esirgeme Kurumu Genel Müdürlüğünü,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Genel esaslar">
      <mvz-fıkra no="1">
        <template>Sosyal hizmetlere ilişkin genel esaslar şunlardır:</template>
        <mvz-bent no="a">
          <template>Bu Kanun kapsamına giren sosyal hizmetlere ilişkin faaliyetler, Devletin denetim ve gözetiminde, sivil toplum kuruluşları ile halkın gönüllü katkı ve katılımı da sağlanarak bir bütünlük içinde yürütülür. Sunulacak bakım ve diğer hizmetlerin kapsamı ve bu hizmetleri verecek olan gerçek ve tüzel kişilerin izin, çalışma usûl ve esasları ve diğer hususlar Sosyal Hizmetler ve Çocuk Esirgeme Kurumu tarafından çıkarılacak bir yönetmelikle düzenlenir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sosyal hizmetler alanında faaliyet gösteren kamu kurum ve kuruluşları ile gönüllü kuruluşlar arasında koordinasyon ve işbirliği tesis edilerek güç birliği sağlanır ve mevcut kaynaklara en verimli şekilde işlerlik kazandırılır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sosyal hizmet programlarının uygulanmasında korunmaya ihtiyacı olan çocuk, ihtiyacı olan engelli ve ihtiyacı olan yaşlıya öncelik tanınır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Sosyal hizmetlerin yürütülmesi ve sunulmasında sınıf, ırk, dil, din, mezhep veya bölge farklılığı gözetilemez, hizmet talebinin hizmet arzından fazla olması halinde öncelikler, ihtiyacı olan olma derecesi ve başvuru veya tespit sırası esas alınarak belirlenir.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Bu Kanunla kurulan Kuruma bağlı kuruluşların dışındaki sosyal hizmet kuruluşlarının kurulması izne tabi olup, alınacak tertip ve tedbirlerle bunların hizmet, işleyiş ve personele ilişkin hususlarda tespit edilen standart ve esaslara uygun olarak faaliyette bulunmaları sağlanır.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Sosyal hizmet kuruluşlarının coğrafik ve fonksiyonel görev alanlarının ve yurt sathında dengeli dağılımının görev boşluğu bırakılmayacak şekilde düzenlenmesi esastır.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Çocuk yuvaları ile yetiştirme yurtlarının korunmaya ihtiyacı olan çocukların yaş, cinsiyet, sosyal ve psikolojik özellikleri ile engel dereceleri dikkate alınarak, kaynaştırma anlayışına göre gruplandırılması ve özellikle çocuk yuvalarının, huzurevleri ile aynı mahallerde tesis edilerek dede-torun, nine-torun ilişkilerinin sağlanması esas alınır.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Korunmaya, bakıma ve yardıma ihtiyacı olan kişilere hizmet sunumu insan haysiyet ve vakarına yaraşır şekilde yerine getirilir.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Sosyal hizmet kurum ve kuruluşlarında çalıştırılacak personelin seçim ve niteliklerinin tespitinde ve bunların hizmetiçi eğitim programlarının düzenlenmesinde bu kurum ve kuruluşların hizmet özellikleri dikkate alınır.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Korunmaya ihtiyacı olan çocukların Türk örf, adet, inanç ve milli ahlakına sahip, kendisine güvenen, insan sevgi ve saygısıyla dolu, Atatürkçü düşünce ve Atatürk ilke ve inkılaplarına uygun olarak yetiştirilmeleri, bir iş veya meslek sahibi yapılmaları, koruma kararı kalktıktan sonra da toplum içinde izlenmeleri ve imkanlar ölçüsünde desteklenmeleri esastır.</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>İhtiyacı olan, engelli ve yaşlıların hayatlarını sağlık, huzur ve güven içinde sürdürmesi, ihtiyacı olan engellilerin toplum içinde kendi kendilerini idare edebilecek ve üretken hale gelebilecek şekilde bakım ve rehabilitasyonlarının yapılması, bunlardan tedavisi mümkün olmayanların sürekli bakım altına alınması amacıyla gerekli her türlü tertip ve tedbir alınır.</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Doğal afetlerde ulusal ve uluslararası sosyal hizmet kurum ve kuruluşlarıyla birlikte hareket edilmesi ve acil kurtarma ve yardım çalışmalarının etkili şekilde yürütülmesi amacıyla gerekli her türlü tertip ve tedbir alınır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Engellilere yönelik hizmetlerin yürütülmesine ilişkin genel esaslar şunlardır:</template>
        <mvz-bent no="a">
          <template>Eşit katılım için, engellilerin sahip oldukları hak ve yükümlülükler konusunda birey, aile ve toplumun bilinçlendirilmesi, tıbbî bakım ve rehabilitasyonlarının sağlanması, günlük yaşamlarında kendi başlarına yaşayabilme kapasitelerinin artırılması.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bilgi, hizmet ve fiziksel çevre koşullarının engelliler için ulaşılabilir hâle getirilmesi.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Doğumdan başlayarak okul öncesi, okul çağı ve yetişkinleri kapsayacak biçimde tüm engellilere eğitimde fırsat eşitliği sağlanması.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İstihdamın, mesleki eğitim ve rehabilitasyonla birlikte gerçekleştirilmesi, istihdam alanlarının engellilerin kullanımına uygunluğunun sağlanması ve teknolojiye uygun alet ve cihazların engellilerce elde edilmesini kolaylaştırıcı önlemlerin alınması.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Engellilerin sosyal güvenlikleri ile gelirlerinin korunması, aile hayatı ve kişisel bütünlükleri ile kültür, eğlence, spor ve din alanlarına tam katılımlarının sağlanması.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Engellilere ilişkin plan ve programlar ile ekonomik ve sosyal statülerini etkileyen tüm kararların alınması sırasında engellilerin katılımlarının sağlanması.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>

    <mvz-madde no="16" başlık="Personel statüsü">
      <mvz-fıkra no="1">
        <template>Kurum personeli hakkında 657 sayılı Devlet Memurları Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurum, hizmetin gereği veya daimi kadro ile yapılamayan veya daimi kadro ile yapılması güçlük arzeden işler için sözleşme ile personel çalıştırabilir. Bu personel tercihen 40 yaşını doldurmuş kişiler arasından seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Korunmaya ve bakıma alınmış olup, iş görme gücüne sahip ve istekli olanlar, bulundukları sosyal hizmet kuruluşlarının uygun görülen hizmetlerinde bu hizmetlerle ilgili kadroların boş tutulması ve her boş kadro karşılığı haftada 40 saati geçmemek üzere tespit edilecek çalışma saatleri içinde, saat başına ücret ödenmek kaydıyla, 657 sayılı Devlet Memurları Kanunu, iş ve sosyal güvenlikle ilgili mevzuat hükümlerine tabi olmaksızın ve Borçlar Kanunu hükümlerine göre sözleşme ile çalıştırılabilirler. Bu kadroların %30'u engellilikleri nedeniyle koruma kararı uzatılanlara tahsis edilir. Saat ücreti asgari ücretin aylık çalışma saati toplamına bölünmesi ile tespit edilir. Bir kadro karşılığında çalışma saati ile sınırlı olmak üzere birden fazla kişi çalıştırılabilir. Ancak kişi başına ayda 60 saatin dışında ücret ödenemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Ev tipi sosyal hizmet birimleri, 22/5/2003 tarihli ve 4857 sayılı İş Kanununun 4 üncü maddesinin birinci fıkrası hükmü kapsamındadır.</template>
      </mvz-fıkra>
    </mvz-madde>

  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Mali Hükümler">
    <mvz-madde no="18" başlık="Kurumun gelirleri">
      <mvz-fıkra no="1">
        <template>Kurumun gelirleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Genel Bütçeden yapılacak Hazine yardımı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Döner sermaye gelirleri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kuruma ait taşınır ve taşınmaz mallardan elde edilecek her çeşit gelirler,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kurum tarafından veya Kurum yararına başka kuruluşlar ya da gerçek ve tüzelkişilerce düzenlenecek sosyal faaliyetler ile her türlü teşebbüs gelirleri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Gerçek ve tüzelkişilerle uluslararası resmi ve özel kuruluşlar ve yabancı benzer kuruluşlar tarafından Kuruma yapılacak ayni ve nakdi taşınır ve taşınmaz her çeşit bağışlar ve bunların gelirleri,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Türk Hava Kurumunca toplanacak kurban derisi, fitre, zekat gelirlerinden Kuruma ayrılan paylar,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Belediye sınırları ile mücavir alanlar içinde düzenlenen fuar, festival, sergi ve benzeri yerlere giriş biletlerine, Cumhurbaşkanınca tespit edilen miktarda yapıştırılacak sosyal yardım pulu gelirleri,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Kanunla kurulan döner sermaye işletmelerinin (Vakıflar Genel Müdürlüğüne ve Orman Genel Müdürlüğü'ne ait olanlar hariç), yıllık brüt hasılatlarının %1'inin Kuruma aktarılmasıyla elde edilecek gelirler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıda sayılan gelirlerden (k) bendinde belirtilenler, hasılatın elde edilmesini takip eden ayın son gününe kadar Kuruma ödenmek zorundadır. Bu süreler içinde ödemelerin yapılmasından ilgili kurum ve kuruluşların yetkili amirleri ile muhasebe yetkilileri ortaklaşa sorumlu olup, ödemelerin geciktirilmesi halinde ödenmesi gereken miktarlar %5 cezaî faizle birlikte kendilerinden tahsil olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Döner sermaye">
      <mvz-fıkra no="1">
        <template>Aile ve Sosyal Politikalar Bakanlığına, bu Kanunda öngörülen temel ve sürekli görevlere bağlı olarak ortaya çıkan üretim ve hizmet faaliyetlerini sürdürebilmek için gerekli yerde ve sayıda döner sermaye işletmesi kurmak amacıyla kendi kaynaklarından karşılanmak üzere beş milyon (5.000.000,00) Türk Lirası sermaye tahsis edilmiştir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tahsis edilen döner sermaye tutarını artırmaya Cumhurbaşkanı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Döner sermaye, ayni yardımlar, döner sermaye faaliyetlerinden elde edilecek kârlar, bağış ve yardımlardan oluşur. Bağış ve yardımlar tahsis olunan sermaye ile sınırlı olmaksızın tahsis olunan sermaye tutarına eklenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Döner sermaye faaliyetlerinden elde edilen kârlar, ödenmiş sermaye tutarı tahsis edilen sermaye tutarına ulaşıncaya kadar sermayeye mahsup edilir. Ödenmiş sermaye tutarı tahsis edilen sermaye tutarına ulaştıktan sonra, yılsonu kârı genel bütçeye gelir kaydedilmek üzere nisan ayının sonuna kadar ilgili muhasebe birimi hesabına yatırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Döner sermaye işletmesinin gelirleri, bu maddenin birinci fıkrasında sayılan gelir getirici faaliyetlerden elde edilen gelirlerden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İşletmenin giderleri, bu maddenin birinci fıkrasında belirtilen iş ve faaliyetlerin gerektirdiği harcamalar ile döner sermaye işletmelerinde istihdam edilen personele genel hükümlere göre yapılacak ödemelerden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İşletme faaliyetleri, ihtiyaca göre kurulacak işletmelerce yerine getirilir. İşletmeler, Aile ve Sosyal Politikalar Bakanının onayıyla kurulur. Her bir işletmeye tahsis edilecek sermaye tutarını belirlemeye ve işletmeler arasında karşılıklı veya karşılıksız kaynak aktarımına, Aile ve Sosyal Politikalar Bakanı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>İşletmelerden gerekli görülenlerin birleştirilmesine, devredilmesine ve tasfiye edilmesine Döner Sermaye Merkez Müdürlüğünün teklifi üzerine, Aile ve Sosyal Politikalar Bakanı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Döner Sermaye Merkez Müdürlüğünün görevleri ve çalışmaları ile işletmelerin yönetimi, faaliyet alanları, işleyişi, sermaye kaynakları, her türlü idari ve mali işlemlerine ilişkin usul ve esaslar, Maliye Bakanlığının görüşü alınarak çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Mali kolaylıklar">
      <mvz-fıkra no="1">
        <template></template>
        <mvz-bent no="a">
          <template>Kurum ve kuruluşlarına yapılacak her türlü bağış, yardım ve vasiyetler vergi, resim ve harçlardan muaftır. Bağış, yardım ve vasiyetlerin kullanılmasında bağış, yardım ve vasiyet yapanların koydukları ve kanunlara göre geçerli sayılan kayıtlara ve şartlara uyulur.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Gelir veya Kurumlar Vergisi mükellefleri tarafından Kurum ve kuruluşlarına makbuz karşılığında yapılacak nakdî ve aynî bağışlar Gelir ve Kurumlar Vergisi kanunları hükümlerine göre yıllık beyanname ile bildirilecek gelirlerden ve Kurum kazancından indirilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kurum ve kuruluşlarınca hizmetin gereği olarak ithal edilen makine, teçhizat, malzeme ve yayınlar gümrük vergisi ve buna bağlı vergi, resim ve harçtan muaftır. Bu muafiyet hükümleri bağış ve yardım yoluyla gelen aynı cins malzemeler için şartsız olarak uygulanır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Türkiye Çocuk Esirgeme Kurumuna kanunlarla verilmiş olan imtiyazlar, Kurum için de aynen uygulanır.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Tespit, İnceleme ve Koruma">
    <mvz-madde no="21" başlık="Tespit ve inceleme">
      <mvz-fıkra no="1">
        <template>Kurum, korunmaya, bakıma, yardıma ihtiyacı olan aile, çocuk, engelli ve yaşlılar ile sosyal hizmetlere ihtiyacı olan diğer kişileri tespit ve incelemekle görevlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kişilerin Kuruma duyurulmasında ve incelemeye ilişkin olarak Kurum ile işbirliğinde bulunulmasında mahalli mülki amirler, sağlık kuruluşları ve köy muhtarları ile genel kolluk kuvvetleri ve belediye zabıta memurları yükümlüdürler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Korunma kararı">
      <mvz-fıkra no="1">
        <template>Korunmaya ihtiyacı olan çocukların reşit oluncaya kadar bu Kanun hükümlerine göre Kurumca kurulan sosyal hizmet kuruluşlarında bakılıp yetiştirilmeleri ve bir meslek sahibi edilmeleri hususundaki gerekli tedbir kararı 3/7/2005 tarihli ve 5395 sayılı Çocuk Koruma Kanununa göre yetkili ve görevli mahkemece alınır. Bu karar için gerekli belgeler Kurumca düzenlenir ve ilgili mahkemeye gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Haklarında derhal korunma tedbiri alınmasında zorunluluk görülen çocuklar mahkeme kararı alınıncaya kadar, bu Kanuna göre kurulmuş kuruluşlarda veya aile yanında mahalli mülki amirin onayı alınmak suretiyle bakım altına alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sosyal hizmet kuruluşlarının kendisine teslim edilen çocuk hakkında yapacağı inceleme sonucunda hazırlayacağı raporda, 5395 sayılı Kanunun 9 uncu maddesi uyarınca çocuğun derhâl korunma altına alınmasını gerektiren bir durum olmadığı ve ailesine teslim edilmesinde herhangi bir sakınca bulunmadığı kanaatine varması hâlinde mülki idare amirinin onayı ile çocuk ailesine teslim edilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Koruyucu aile">
      <mvz-fıkra no="1">
        <template>Mahkemece korunma kararı alınan korunmaya ihtiyacı olan çocuğun bakımı ve yetiştirilmesi bu Kanuna göre kurulmuş kuruluşlarda olduğu kadar Kurumun denetim ve gözetiminde bir "Koruyucu Aile" tarafından da yerine getirilebilir.  Koruyucu aileye, korunmaya ihtiyacı olan çocuğun bakımı ve yetiştirilmesine karşılık olarak ikinci fıkra kapsamında ödeme yapılabileceği gibi koruyucu aile bu işi gönüllü olarak da üstlenebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Koruyucu aile hizmeti kapsamında aile yanına yerleştirilen çocukların bakım, eğitim, kurs, okul, yemek ve taşıma servisi, harçlık ve benzeri ihtiyaçları esas alınarak koruyucu ailelere, bu giderlerin tamamına karşılık toplu bir ödeme yapılmasına veya her bir gider türü için ayrı ayrı yapılacak ödemelerin kapsamına, ödeme tutarlarına, yapılacak ödemelerin usul ve esası ile koruyucu ailelerin seçimine, çocukla ilgili sorumluluklarına ve hizmetin işleyişine ilişkin usul ve esaslar, Maliye Bakanlığının uygun görüşü üzerine Aile ve Sosyal Politikalar Bakanlığı tarafından çıkarılan yönetmelikle belirlenir ve bu kapsamda verilecek ödemelerden hiçbir kesinti yapılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Korunma kararının süresi ve kaldırılması">
      <mvz-fıkra no="1">
        <template>Korunma kararı genel olarak çocuk reşit olana kadar devam eder. Ancak bu karar, korunma kararına neden olan şartların ortadan kalkması halinde Kurum yetkililerinin önerisi üzerine mahkemece çocuk reşit olmadan önce kaldırılabileceği gibi reşit olduktan sonra da çocuğun rızası alınmak şartıyla devamı hususunda karar verilebilir. Reşit olduktan sonra korunma kararının devamı aşağıda belirtilen şartlara bağlıdır.</template>
        <mvz-bent no="a">
          <template>18 yaşını tamamlamış olan korunmaya ihtiyacı olan çocuklardan;</template>
          <mvz-altbent no="1">
            <template>Ortaöğrenime devam edenlerin 20 yaşına kadar,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Yükseköğrenime devam edenlerin 25 yaşına kadar korunma kararları uzatılabilir.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Öğrenime devam etmeyen 18 yaşını doldurmuş çocukların bir iş veya meslek sahibi edilerek kendi kendilerine yeterli olabilmelerinin sağlanması amacıyla 20 yaşına kadar korunma kararları uzatılabilir.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Bunlardan korunma kararı kalkmış; ancak tek başına yaşamını sürdüremeyecek durumda bulunan kız çocukları, Kurumca himaye olunur. Bu çocukların emek karşılığı iaşe, ibate ve harçlıkları Kurumca karşılanmak kaydıyla Kurum hizmetlerinde çalışmaları da sağlanabilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bedensel, zihinsel ve ruhsal engellilikleri nedeniyle sürekli bakıma ihtiyacı olan ve çalışmaktan aciz olan Çocukların korunma kararı uzatılır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Korunma kararı kalkan çocukların Kurumla ilişkilerinin devamı sağlanır. Bu çocuklara gerektiğinde imkanlar ölçüsünde Kurumca yardımcı olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Korunmaya ihtiyacı olan çocukların eğitim ve öğretimlerinin sağlanması veya meslek sahibi yapılmaları">
      <mvz-fıkra no="1">
        <template>Okul çağındaki korunmaya ihtiyacı olan çocukların eğitim ve öğretimleri Milli Eğitim Bakanlığı ile diğer kamu kurumlarına ait okullarda gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Herhangi bir nedenle okula devam etme imkanı bulamayan çocuklar, kamu ve özel işyerlerinde ücret mukabilinde çalıştırılarak bir meslek sahibi yapılırlar. Bu şekilde çalıştırılan çocukların ücretlerinin yurt idarelerince tespit edilen miktarı kendilerine harçlık olarak verilir. Geri kalan miktar aybaşını takip eden on gün içinde milli bankalarda çocuk namıma açtırılan hesaba yatırılır. Çocuğun ücretinin başlama zamanı ve miktarı, yurt idaresi ile işveren arasında mahalli örf ve rayice göre tespit olunur. Bu konuya ilişkin hususlar bir yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Özel eğitim gerektiren korunmaya ihtiyacı olan çocukların eğitim ve öğretimleri Milli Eğitim Bakanlığına bağlı resmi ve özel eğitim-öğretim kurumlarında sürdürülür. Korunmaya ihtiyacı olan engelli çocukların eğitimleri Milli Eğitim Bakanlığı ile birlikte planlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Korunmaya, bakıma, yardıma ihtiyacı olan engelli, yaşlı ve diğer kişilere ilişkin hususlar">
      <mvz-fıkra no="1">
        <template>Korunmaya, bakıma, yardıma ihtiyacı olan aile, engelli, yaşlı ve diğer kişilerin tespiti, incelenmesi ve bunların sosyal hizmetlerden yararlandırılmasına ilişkin esaslar bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Cezai sorumluluk">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren sosyal hizmet kuruluşlarında muhafaza ve bakımlarına terkedilen şahıslara karşı herhangi bir suç işleyen kuruluş görevlileri hakkında bu suç nedeniyle genel hükümlere göre verilecek muvakkat hürriyeti bağlayıcı cezalar ile para cezaları üçte bir oranında artırılarak hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Kurumla İlgili Özel Hükümler">
    <mvz-madde no="28" başlık="Mirasın Kuruma geçmesi">
      <mvz-fıkra no="1">
        <template>Kuruma bağlı kuruluşlarda bakılmakta iken mirasçı bırakmaksızın ölen kimselerin mirası Kuruma geçer. Kurum terekenin borcundan ancak, kendisine geçen mallar ölçüsünde sorumlu olur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Haciz, devir ve temlik ayrıcalığı">
      <mvz-fıkra no="1">
        <template>Bu Kanun gereğince korunmaya ve yardıma ihtiyacı olan aile ve kişilere yapılacak ödemeler ve sağlanacak yardımlar başkasına devir, temlik ve haciz edilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Dava açma hakkı">
      <mvz-fıkra no="1">
        <template>Kurum, kendisine yardımda bulunduğu kişiler için Türk Medeni Kanunu hükümlerine göre nafaka ile yükümlü bulunanlar hakkında dava açmak hakkına sahiptir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Kurumun malları">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="32" başlık="Evlenme yardımı">
      <mvz-fıkra no="1">
        <template>Kuruma ait sosyal hizmet kuruluşlarında koruma kararı devam eden kız çocuklarından evlenenlere çeyiz ihtiyaçlarını karşılamak ve bir defaya mahsus olmak üzere en yüksek Devlet memuru aylığının birbuçuk katı tutarında evlenme yardımı yapılır. Bu yardım hiçbir vergi ve kesintiye tabi tutulmaksızın ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="Kurumun sembolü">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Çeşitli Hükümler">
    <mvz-madde no="34" başlık="Açılış izni ve standartlar">
      <mvz-fıkra no="1">
        <template>Kurum dışındaki kamu kurum ve kuruluşları ile gerçek kişiler ve özel hukuk tüzelkişilerince bu Kanun kapsamına giren sosyal hizmet kuruluşlarının kurulmasına, teşvik edilmesine ve açılış izinlerinin verilmesine, varsa ücret tarifelerinin tespitine ilişkin usul ve esaslar ile bu kuruluşların hizmet ve personel standartları bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Darüşşafaka Cemiyeti hariç olmak üzere özel sosyal hizmet kuruluşlarının kapasitelerinin yüzde üçü, Aile ve Sosyal Politikalar Bakanlığınca tespit edilecek kişilerin ücretsiz yararlanması için ayrılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Denetleme esasları">
      <mvz-fıkra no="1">
        <template>Kamu kurum ve kuruluşları ile gerçek kişiler ve özel hukuk tüzelkişileri tarafından işletilen sosyal hizmet kuruluşlarının 34 üncü maddede yer alan yönetmelik esaslarına uygunluğu Kurumun kontrol ve denetlenmesine tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sosyal hizmet kuruluşları yılda en az bir defa Kurumca denetlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İlgililer kontrol ve denetlemeler sırasında denetleme heyetine her türlü kolaylığı göstermekle yükümlüdürler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kontrol ve denetlemeye ilişkin esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35/A" başlık="Müeyyideler">
      <mvz-fıkra no="1">
        <template>Gerçek kişi veya özel hukuk tüzel kişilerine ait sosyal hizmet kuruluşunda yapılan kontrol ve denetim sonucunda, bu kuruluşların açılışına, çalışma şartlarına, yönetimine, hizmetin etkin sunumuna ilişkin olarak yönetmelikle belirlenen koşullara göre eksiklik veya aykırılığın tespiti hâlinde il müdürü tarafından 16 yaşından büyükler için her yıl belirlenen aylık net asgari ücret tutarının on katından elli katına kadar idari para cezası verilir. Bu eksiklik veya aykırılıkların giderilmesi ile idari para cezasının yatırılması için otuz günü geçmemek üzere uygun bir süre verilerek ilgili kuruluş yazılı olarak ihtar edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Belirlenen süre içinde kuruluş tarafından eksiklik veya aykırılığın giderilmemesi hâlinde birinci fıkra uyarınca verilen idari para cezasının iki katı tutarında tekrar idari para cezası uygulanır ve eksiklik veya aykırılığın giderilmesi için otuz günü geçmemek üzere ek süre verilir. Bu süre içinde de eksiklik veya aykırılığın giderilmemesi hâlinde kuruluş, Aile ve Sosyal Politikalar Bakanlığı tarafından kapatılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci ve ikinci fıkralar uyarınca verilen sürede eksiklikler veya aykırılıklar giderilinceye kadar kuruluşa yeni bir kişinin kabulü yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bir yıl içinde beş defa idari para cezası uygulanan kuruluş, Aile ve Sosyal Politikalar Bakanlığı tarafından kapatılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanun kapsamında verilen idari para cezaları, tebliğinden itibaren bir ay içinde ödenir. Bu süre içinde ödenmeyen idari para cezaları, kesinleşmesini müteakiben Bakanlığın bildirimi üzerine vergi daireleri tarafından 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanuna göre takip ve tahsil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35/B" başlık="Kuruluşun kapatılması">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında gerçek kişi veya özel hukuk tüzel kişilerince açılan sosyal hizmet kuruluşlarında hizmet verilen kişilere yönelik tehdit veya baskı ya da özgürlüğün keyfî engellenmesini de içeren fiziksel, cinsel, tıbbi, psikolojik veya ekonomik açıdan zarar veren her türlü tutum ve davranışın gerçekleşmesi hâlinde bu tutum ve davranışların engellenmesine yönelik gerekli tedbirleri almayan kurucu veya sorumlu müdüre dört yüz günden az olmamak üzere adli para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sosyal hizmet kuruluşları aşağıda belirtilen hususlardan birinin tespit edilmesi hâlinde Aile ve Sosyal Politikalar Bakanlığı tarafından kapatılır:</template>
        <mvz-bent no="a">
          <template>Kurucu veya sorumlu müdürün kuruluşta hizmet verilen kişilere yönelik tehdit veya baskı ya da özgürlüğün keyfî engellenmesini de içeren fiziksel, cinsel, tıbbi, psikolojik veya ekonomik açıdan zarar veren eylemlerden dolayı cezalandırılmasına karar verilmiş olması</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kurucu veya sorumlu müdürün birinci fıkra hükümleri uyarınca cezalandırılmasına karar verilmiş olması</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kuruluşun açılış izin onayı olmadan hizmete başlaması</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Kuruluşun izinsiz olarak nakil veya devir işleminin yapılması</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kuruluşun açılış işlemleri esnasında ibraz edilen belge ve beyanların gerçeği yansıtmadığının sonradan ortaya çıkması</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkranın (a) ve (b) bentlerinde belirtilen hallerde 4/12/2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun 231 inci maddesi uyarınca hükmün açıklanmasının geri bırakılmasına karar verilmiş olması, kapatma işleminin yapılmasına engel teşkil etmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Onurlandırma">
      <mvz-fıkra no="1">
        <template>Kurumca yürütülmekte olan sosyal hizmet faaliyetlerine gerçek ve tüzelkişilerin her türlü maddi ve manevi katkı ve katılımın sağlanmasına ilişkin esaslar ile Kuruma büyük hizmet ve katkıları geçenlerin onurlandırılması işlemleri bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>

    <mvz-madde no="38" başlık="Yürürlükten kaldırma">
      <mvz-fıkra no="1">
        <template>Aşağıda sayılan;</template>
        <mvz-bent no="a">
          <template>15/5/1957 tarih ve 6972 sayılı Korunmaya Muhtaç Çocuklar Hakkında Kanun,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>12/6/1959 tarih ve 7355 sayılı Sosyal Hizmetler Enstitüsü Kurulmasına Dair Kanun,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>25/4/1963 tarih ve 225 sayılı Sağlık ve Sosyal Yardım Bakanlığı Kuruluş ve Memurları Kanununda ve 4862 sayılı Kanuna Bağlı (1) ve (2) sayılı Cetvellerde Değişiklik Yapılmasına Dair Kanunun 1 inci maddesinin (b) bendi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Türkiye Çocuk Esirgeme Kurumunun teşkiline ait mevzuat,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Diğer kanunların bu Kanuna aykırı hükümleri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanun veya 5395 sayılı Kanun uyarınca haklarında korunma veya bakım tedbir kararı alınmış olup fasılalı olarak geçen yararlanma süreleri dâhil iki yıldan az olmamak üzere, Aile ve Sosyal Politikalar Bakanlığının sosyal hizmet modellerinden yararlanan çocuklardan reşit olduğu tarih itibarıyla bu hizmetlerden yararlanmaya devam edenlerin işe yerleştirilmeleri aşağıdaki usul ve esaslar çerçevesinde yapılır:</template>
        <mvz-bent no="a">
          <template>Kamu kurum ve kuruluşları tarafından hangi statüde olursa olsun serbest kadro ve pozisyonları toplamının binde biri, bu madde kapsamında istihdam edilecekler için ayrılır ve her yıl belirtilen oranda kişi istihdam edilir. Serbest kadro ve pozisyon toplamının binden az olması hâlinde dahi kamu kurum ve kuruluşlarında en az bir hak sahibi istihdam edilir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu hükümden yararlanmak isteyenler, 18 yaşını doldurdukları ve korunma, bakım tedbir kararı veya bu Kanunun 24 üncü maddesinin birinci fıkrasının (b) bendinde belirtilen himaye onayının sona erdiği tarihten itibaren beş yıl içinde Aile ve Sosyal Politikalar Bakanlığına başvururlar. Bu madde hükümleri çerçevesinde Aile ve Sosyal Politikalar Bakanlığı tarafından hak sahibi olduğu onaylananlar Devlet Personel Başkanlığına bildirilir. Hak sahiplerinin atamaları il tercihleri de dikkate alınarak Başkanlıkça kura usulü ile yapılır. İşe yerleştirmede öncelik, sırasıyla lisans, ön lisans ve ortaöğretim mezunlarına verilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yerleştirme yapılacak kadro sayısı 13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnameye tabi kurumların serbest memur kadroları ile sözleşmeli personel pozisyonları ve işçi kadro sayısının toplamının binde biridir. Toplam kadro ve pozisyon sayısının belirlenmesinde yerleştirme yapılacak yılın başındaki veriler esas alınır. Devlet Personel Başkanlığınca bu madde kapsamında hak sahiplerinin istihdam edileceği toplam kadro sayıları her kurum için tespit edilerek kurumlara bildirilir. Kurumlar, bildirilen bu kadroları merkez ve taşra teşkilatları itibarıyla dağıtımını yaparak yerleştirme dönemlerinde Devlet Personel Başkanlığına bildirir. Bu madde kapsamına girenlerin yerleştirilmeleri; ortaöğretim ve daha üst öğrenim mezunları için kurumların talepleri doğrultusunda öğrenim durumları itibarıyla ihraz ettikleri unvanın 190 sayılı Kanun Hükmünde Kararname eki cetvellerde yer alması şartıyla ihraz etmiş bulundukları unvanlara, bunların dışında kalan ortaöğretim ve yükseköğretim mezunları için memur unvanlı kadro ve pozisyonlara, diğer öğrenim mezunları için ise yardımcı hizmetler sınıfında yer alan kadro ve pozisyonlara yılda üç defadan az olmamak üzere Devlet Personel Başkanlığınca yapılır veya yaptırılır. Ek 1 inci madde kapsamında yerleştirme yapılacak kurumlarca teşkilat bazında dağıtımın bildirilmemesi hâlinde Devlet Personel Başkanlığınca belirlenecek usul ve esaslar dâhilinde resen yerleştirme yapılır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kamu kurum ve kuruluşları, bu maddede belirtilen haktan yararlanarak yerleştirilen ancak herhangi bir nedenle işten ayrılan personele ilişkin belirlenecek bilgileri işten ayrılmayı takip eden bir ay içinde, hâlen çalışmakta olanların bilgilerini ise yönetmelikte belirlenecek zamanda Aile ve Sosyal Politikalar Bakanlığı ile Devlet Personel Başkanlığına bildirir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra ile sağlanan istihdam hakkından sadece bir kez yararlanılabilir. Kamu kurum ve kuruluşlarına ait kadro ve pozisyonlara her ne surette olursa olsun yerleştirilenler bu maddede verilen hakkı kullanmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>190 sayılı Kanun Hükmünde Kararname kapsamı dışında kalan kurumlar da bu madde kapsamında istihdamla yükümlü oldukları kadro ve pozisyonları Devlet Personel Başkanlığına bildirmek zorundadır. Ancak, bu kurumlara yapılacak yerleştirmelerde ilgili kurumların talep ettikleri kadro ve statüler esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde kapsamında yapılacak yerleştirmelerde; yerleştirilen kişinin atama onayının alınması ile birlikte diğer kanunlardaki hükümlere bakılmaksızın ve başka bir işleme gerek kalmaksızın teklif yapılan kamu kurum ve kuruluşlarına kadrolar ihdas, tahsis ve vize edilmiş ve ilgili kurumun 190 sayılı Kanun Hükmünde Kararname eki ilgili cetvel ve bölümlerine eklenmiş sayılır. Bu şekilde ihdas edilen kadrolar, herhangi bir şekilde boşalması hâlinde başka bir işleme gerek kalmaksızın iptal edilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yerleştirilen hak sahiplerine ilişkin bilgiler, göreve başlama tarihinden itibaren en geç bir ay içinde Aile ve Sosyal Politikalar Bakanlığı ile Devlet Personel Başkanlığına bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Birinci fıkra kapsamına giren kişilerin özel sektörde çalıştırılmaları hâlinde, 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 81 inci maddesine göre ödenmesi gereken ve aynı Kanunun 82 nci maddesi uyarınca belirlenen prime esas kazanç alt sınırı üzerinden hesaplanan malullük, yaşlılık ve ölüm sigortası primi, kısa vadeli sigorta kolları primi ve genel sağlık sigortası primi, sigortalı ve işveren hissesi primlerinin tamamı ile 25/8/1999 tarihli ve 4447 sayılı İşsizlik Sigortası Kanununun 49 uncu maddesinin birinci fıkrasına göre ödenmesi gereken işsizlik sigortası primi, sigortalı ve işveren hissesinin tamamı sigortalının işe giriş tarihinden itibaren beş yıl süre ile Hazine tarafından karşılanır. Bu fıkra kapsamında sağlanan prim teşvikinden işverenler yararlanır ve Hazine tarafından işverene sağlanan sigortalı primi hissesi teşviki tutarının sigortalıya ödenmesi işverenden talep edilemez. Bu fıkra uyarınca teşvikten faydalanabilmek için Sosyal Güvenlik Kurumuna verilmesi gereken aylık prim ve hizmet belgelerinin yasal süresi içinde verilmesi ve Hazinece karşılanmayan primlerin yasal süresi içinde ödenmesi şarttır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İşe yerleştirme yükümlülüğünün takip ve denetimi, yerleştirme yapılacak kadro ve pozisyonların belirlenmesi, yerleştirme ve kuraya ilişkin usul ve esaslar ile diğer hususlar, Maliye Bakanlığı ile Aile ve Sosyal Politikalar Bakanlığının olumlu görüşleri üzerine Devlet Personel Başkanlığı tarafından bu Kanunun yayımını takip eden üç ay içinde yürürlüğe konulacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>

    <mvz-madde no="4" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen "sakat" ibaresi "özürlü", "kör" ibaresi "görme özürlü", "sağır" ibaresi "İşitme özürlü" olarak değiştirilmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Doğal afet bölgelerinde afetzedelere yönelik sosyal hizmet müdahaleleri için gerekli öncü, geçici ve sürekli ekipler, Kurum Genel Müdürünün onayıyla kurulur. Bu ekipler ile diğer Kurum personelinin düzenli bir eğitim programından geçirilmesi için gerekli bütün önlemler alınır. Afet bölgesinde görevlendirilen personelin, hizmetin gerektirdiği ihtiyaçları karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Doğal afet bölgelerindeki ilçe sosyal yardımlaşma ve dayanışma vakıflarının mütevelli heyetlerine, ilçe sosyal hizmetler müdürü, mütevelli heyeti üyesi olarak katılır. Bu vakıflarda afet çalışmaları süresince, sosyal hizmet uzmanları istihdam edilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Her ne ad altında olursa olsun her türlü gelirler toplamı esas alınmak suretiyle, hane içinde kişi başına düşen ortalama aylık gelir tutarı, asgarî ücretin aylık net tutarının 2/3’ünden daha az olan bakıma ihtiyacı olan engellilere, resmî veya özel bakım merkezlerinde bakım hizmeti ya da sosyal yardım yapılmak suretiyle evde bakımına destek verilmesi sağlanır. Hanede birden fazla bakıma ihtiyacı olan engelli bulunması hâlinde, hane içinde kişi başına düşen ortalama aylık gelir tutarının hesaplanmasında birinci bakıma ihtiyacı olan engelliden sonraki her bakıma ihtiyacı olan engelli iki kişi sayılır.  Bu fıkranın uygulanmasında, 5510 sayılı Kanunun ek 18 inci maddesi uyarınca Ramazan ve Kurban bayramlarında ödenen bayram ikramiyeleri hane içinde kişi başına düşen ortalama aylık gelir tutarının hesaplanmasına dâhil edilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakıma ihtiyacı olan engellilere özel bakım merkezlerinde sunulacak bakım hizmetinin karşılığı olarak belirlenecek kişi başına aylık bakım ücreti tutarı, 20.000 gösterge rakamı ile memur aylık katsayısının çarpımı sonucu bulunacak tutardan fazla olamaz. Bakıma ihtiyacı olan engellinin evde bakımına destek için ise 10.000 gösterge rakamı ile memur aylık katsayısının çarpımı sonucu bulunacak tutar kadar aylık sosyal yardım yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bakıma ihtiyacı olan engellilere sunulacak bakım hizmet modeline ve kapsamına, bakım hizmetinden yararlanabileceklerin başvuru şekline, bu hizmetleri verecek olan gerçek ve tüzel kişiler tarafından açılacak kuruluşlara açılış izni verilmesine, çalışmasına, denetimine, ücretlendirilmesine, idari para cezalarının ve kapatılma işlemlerinin uygulanmasına, özel bakım merkezlerine bakım hizmeti karşılığı yapılacak ödemelere ve bakım hizmeti veren resmî kurumlara yapılacak yardımlara ilişkin usul ve esaslar, Sağlık Bakanlığının görüşü alınarak Maliye Bakanlığı ile Aile ve Sosyal Politikalar Bakanlığınca müştereken çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bakıma ihtiyacı olan engellilerin evde bakımına destek için yapılacak sosyal yardımlara ilişkin iş ve işlemler, Aile ve Sosyal Politikalar Bakanlığı ve Sosyal Yardımlaşma ve Dayanışma Vakıflarınca gerçekleştirilir. Bakıma ihtiyacı olan engellilerin evde bakımına destek için yapılacak sosyal yardımın başvuru şekline, değerlendirilmesine, ödenmesine ve diğer hususlara ilişkin usul ve esaslar, Sağlık Bakanlığının görüşü alınarak Maliye Bakanlığı ile Aile ve Sosyal Politikalar Bakanlığınca müştereken çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Birinci fıkra kapsamındaki bakıma ihtiyacı olan engellilere sunulacak bakım hizmetinin karşılığı olarak özel bakım merkezlerine ödenecek bakım ücreti, evde bakımına destek için yapılacak sosyal yardım ile bakım hizmeti veren resmî kurumlara yapılacak yardımlar Aile ve Sosyal Politikalar Bakanlığı bütçesinden karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
