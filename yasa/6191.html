  <mvz-künye tür="kanun" no="6191" başlık="SÖZLEŞMELİ ERBAŞ VE ER KANUNU"
             tarih="10/3/2011" rgazete-tarih="22/3/2011" rgazete-sayı="27882"
             düstur-tertip="5" düstur-cilt="50" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, Milli Savunma Bakanlığınca veya İçişleri Bakanlığınca lüzum görülecek erbaş ve er kadrolarında, kritik ve uygun görülen görevlerde, yetişmiş personel ihtiyacını karşılamak maksadıyla istihdam edilecek sözleşmeli erbaş ve erlerin; temini, yetiştirilmeleri, görevde yükselmeleri, tertip edilmeleri, geçici görevlendirilmeleri, hizmet şartları, görev ve hakları, yükümlülükleri, ayırma ve ayrılmaları, uzman erbaşlığa geçirilmeleri ile ilgili usul ve esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Askerî eğitim: Sözleşmeli er adaylarına okul, kurum, sınıf okulu, kıtalar veya eğitim merkezlerinde yaptırılacak olan kadro görevine yönelik eğitimi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ön sözleşme: Türk Silahlı Kuvvetleri  birlik, karargâh, kurum ve kuruluşları ile sözleşmeli er adayları arasında; askerî eğitime alınmaları konusunda yapılan ve askerî eğitim dönemi başlangıcı ile sözleşme yapılıncaya kadar geçecek süreyi kapsayan sözleşmeyi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sözleşme: Türk Silahlı Kuvvetleri (Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı dâhil) birlik, karargâh, kurum ve kuruluşları ile sözleşmeli er adaylarından askerî eğitimi başarıyla tamamlayanlar arasında yapılan, başlangıçta üç yıldan az olmamak şartıyla en fazla dört yıl, müteakiben bir yıldan az üç yıldan fazla olmayan ve hizmet yükümlülüğü getiren, yönetmelikte belirtilen örneğine göre hazırlanmış olan sözleşmeyi,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Sözleşmeli er adayı: Sözleşmeli er yetiştirilmek amacıyla ön sözleşme yapılarak askerî eğitime alınanları,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Sözleşmeli erbaş ve er: Erbaş ve er kadro görev yerlerinde, bu Kanun esaslarına göre istihdam edilenleri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Sözleşme yılı: Sözleşmenin yürürlüğe girdiği ay ve günü başlangıç olarak kabul eden ve bu tarihten itibaren geçen her bir yıllık süreyi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Kaynak, Yetiştirme, Hizmet Şartları, Yedeklik Dönemi, Görev ve Sözleşme Süreleri">
    <mvz-madde no="3" başlık="Kaynak">
      <mvz-fıkra no="1">
        <template>Sözleşmeli er kaynaklarını;</template>
        <mvz-bent no="a">
          <template>En az ilköğretim veya yurt dışındaki dengi okul mezunu olup, askerlik hizmetini erbaş ve er olarak tamamlamış ve düzeltilmemiş nüfus kaydına göre müracaat yapılan yılın ocak ayının ilk günü itibarıyla yirmi beş yaşını bitirmemiş olanlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>En az ortaöğretim veya yurt dışındaki dengi okul mezunu olup, askerlik hizmetine başlamamış veya askerlik hizmetini tamamlamamış olanlardan, düzeltilmemiş nüfus kaydına göre müracaat yapılan yılın ocak ayının ilk günü itibarıyla yirmi yaşından gün almış ve yirmi beş yaşını bitirmemiş olanlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>teşkil eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Ayrıca, (a) bendinde sayılanlardan askerlik hizmetine başlamamış veya askerlik hizmetini tamamlamamış olanların, (b) bendi kapsamında sözleşmeli erliğe alınıp alınmayacakları kaynak ihtiyacı dikkate alınarak Millî Savunma Bakanlığı tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Askerî okullardan ve Türk Silahlı Kuvvetlerinden her ne sebeple olursa olsun ilişikleri kesilen personel sözleşmeli er olarak alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sözleşmeli erlik için aşağıdaki nitelikler aranır:</template>
        <mvz-bent no="a">
          <template>Türk vatandaşı olmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu Kanunda belirtilen öğrenim ile ilgili şartları taşımak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sağlık ile ilgili Türk Silahlı Kuvvetleri Sağlık Yeteneği Yönetmeliğinde belirtilen şartları taşımak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Kamusal hakları kullanmaktan yoksun bırakılmamış olmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Cezaları ertelenmiş, seçenek yaptırımlardan birisine çevrilmiş, genel ya da özel af kanunları kapsamına girmiş veya haklarında hükmün açıklanmasının geri bırakılmasına karar verilmiş olsa dahi;</template>
          <mvz-altbent no="1">
            <template>Devletin güvenliğine karşı işlenen suçlar, halkı askerlikten soğutmak, Türk Milletini, Türkiye Cumhuriyeti Devletini, Devletin kurum ve organlarını aşağılama ile zimmet, irtikâp, iftira, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, yalan tanıklık, yalan yere yemin, suç uydurma, cinsel saldırı, cinsel taciz, kişiyi hürriyetinden yoksun bırakmak, fuhuş, gayri tabii mukarenet, hileli iflas gibi yüz kızartıcı veya şeref ve haysiyet kırıcı suçlar ile kaçakçılık, ihaleye fesat karıştırma, Devlet sırlarını açığa vurma suçlarından,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Firar, amir veya üste fiilen taarruz, emre itaatsizlikte ısrar, üste hakaret, mukavemet, fesat ve isyan suçlarından,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>22/5/1930 tarihli ve 1632 sayılı Askerî Ceza Kanununun 148 inci maddesinde belirtilen suçlardan,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>birisinden mahkûm olmamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Taksirli suçlar hariç olmak üzere bir suçtan bir ay veya daha fazla hapis cezası ile mahkûm olmamak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Güvenlik soruşturması olumlu sonuçlanmış olmak; güvenlik soruşturmasının sonucunun henüz gelmediği hallerde arşiv araştırması olumlu sonuçlanmış olmak.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Yapılacak fiziki kabiliyet testi ve mülakatlarda başarılı olmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Asgari tugay veya eşidi birlik komutanı veya kurum amiri tarafından haklarında “sözleşmeli erbaş ve er olur” belgesi düzenlenen personelin müracaatları öncelikle kabul edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Sözleşme, hizmet şartları ve yedeklik dönemi">
      <mvz-fıkra no="1">
        <template>Sözleşmeli er adayları, ön sözleşme yapılarak askerî eğitime alınır. Askerî eğitimi başarı ile tamamlayanlarla, dört yıldan fazla olmamak kaydıyla en az üç yıllık sözleşme yapılır. Müteakip sözleşmeler, bir yıldan az üç yıldan fazla olmamak şartıyla azamî yedi yıllık hizmet süresi sonuna kadar uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seferberlik, savaş veya terörle mücadeleden kaynaklanan zorunlu hâllerde ihtiyaç duyulanların sözleşme süreleri, talebe ve yaş haddine bakılmaksızın Kuvvet Komutanları, Jandarma Genel Komutanı veya Sahil Güvenlik Komutanının istemi üzerine ve durumun devamı müddetince, Genelkurmay Başkanının onayı ile uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sözleşmeli erbaş ve erler ile sözleşmeli er adayları, asker kişi sayılırlar. Sözleşmeli erbaşlar, muvazzaflık hizmetinde olan emsal rütbedeki erbaşların üstü, emsal rütbedeki uzman erbaşların astıdır. Sözleşmeli erbaşlar hakkında rütbenin geri alınması feri cezası uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sözleşmeli erbaş ve erler istihdam edildikleri kadro görevleri ile 4/1/1961 tarihli ve 211 sayılı Türk Silahlı Kuvvetleri İç Hizmet Kanununda erbaş ve erler için belirtilen görevleri yaparlar. Bu Kanunda hüküm bulunmayan hâllerde sözleşmeli erbaş ve erler hakkında, erbaş ve erlere ilişkin hükümler uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Sözleşmeli erbaş ve erlerin sınıfları, Kuvvet Komutanlıkları, Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığınca değiştirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Sefer görev emirleri, öncelikle sözleşmeli erbaş ve er olarak görev yaptıkları sınıf, branş, ihtisas ve rütbe esasları dikkate alınarak çıkarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Terhis kaydı, yedeklik yoklaması, hizmete celp, eğitim ve tatbikat gibi yedeklik dönemine ilişkin olarak bu Kanunda düzenlenmeyen hususlarda, 21/6/1927 tarihli ve 1111 sayılı Askerlik Kanunu ile 16/6/1927 tarihli ve 1076 sayılı Yedek Subaylar ve Yedek Askerî Memurlar Kanununun ilgili hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Rütbe Bekleme Süreleri, Sözleşmenin Yenilenmesi ve Feshi">
    <mvz-madde no="5" başlık="Rütbe bekleme süreleri ve sözleşmenin yenilenmesi">
      <mvz-fıkra no="1">
        <template>Sözleşmeli erlikte en az iki yılını tamamlayanlar, kadro görev yeri uygunsa liyakat durumu da dikkate alınarak yönetmelikte belirtilen esaslar dâhilinde sözleşmeli onbaşılığa; sözleşmeli onbaşılıkta en az iki yılını tamamlayanlar, kadro görev yeri uygunsa liyakat durumu da dikkate alınarak yönetmelikte belirtilen esaslar dâhilinde sözleşmeli çavuşluğa geçirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Her sözleşme süresinin sona erme tarihinden en az üç ay önce, sözleşmeli erbaş ve erler sözleşmeyi yenileyeceklerine dair yazılı bildirimde bulunmadıkları takdirde, sözleşme kendiliğinden sona erer. Terörle mücadele sırasında veya bu görevlerinden dolayı alıkonulan ya da kaybolanların sözleşme süreleri, akıbetleri açıklığa kavuşturulana kadar kuvvet komutanları, Jandarma Genel Komutanı veya Sahil Güvenlik Komutanının göstereceği lüzum üzerine, durumun devamı müddetince, Genelkurmay Başkanının onayı ile talebe bakılmaksızın bu Kanunda belirtilen yaş haddini geçmemek üzere uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sözleşmeli erbaş ve erler, sözleşme süreleri sona ermeden sözleşmelerini tek taraflı olarak feshedemezler. Ancak, ilk sözleşmeyi müteakip yapılacak sözleşmelerin süresi bitmeden, fesih talebine ilişkin sebepleri Kuvvet Komutanlıkları, Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığınca yönetmelikte belirtilen hizmet gerekleri ve koşullar gözetilerek uygun olduğuna karar verilen sözleşmeli erbaş ve erlerin sözleşmeleri idarece feshedilebilir. Bu şekilde sözleşmeleri feshedilenler, 7 nci maddenin beşinci ve altıncı fıkraları ile 8 inci maddenin ikinci fıkrasının (b) bendinde belirtilen haklardan istifade ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Sözleşmenin idarece feshi">
      <mvz-fıkra no="1">
        <template>Sözleşmeli er adaylarının ön sözleşmeleri, aşağıdaki nedenlerle süresinin bitiminden önce feshedilir:</template>
        <mvz-bent no="a">
          <template>Yönetmelikte belirtilen yetkili kurullarca, askerî eğitim esnasında başarısız veya disiplinsiz olduğuna karar verilmek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yetkili sağlık kurullarınca askerî eğitime ve/veya göreve devam edemez kararı verilmiş olmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sözleşmeli er adayı olma şartlarından herhangi birini taşımadığı sonradan anlaşılmak veya sözleşme süresi içinde bu şartlardan herhangi birini kaybetmek.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Askerî eğitimin üçte birine katılmamak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Güvenlik soruşturması olumsuz sonuçlanmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ön sözleşme döneminde görevlerini icra ederken veya görevleri dolayısıyla bir saldırıya veya kazaya uğrayan ya da bir meslek hastalığına yakalanma neticesinde askerî eğitimin üçte birine devam etmeyerek başarısız kabul edilenler, bir kez olmak üzere sonraki dönemde açılacak askerî eğitime planlanırlar. İstekli olmaları, aranan sağlık ve diğer niteliklerini korumaları hâlinde yeniden ön sözleşme yapılarak eğitime alınırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ön sözleşme döneminde Türk Silahlı Kuvvetleri ile ilişikleri kesilen personelden, peşin olarak ödenen ücret ve ücretle birlikte ödenen diğer tüm özlük haklarının, çalışılmayan günlere ait kısmı geri alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sözleşmeli erbaş ve erlerin sözleşmeleri, aşağıdaki nedenlerle sözleşme süresinin bitiminden önce feshedilir:</template>
        <mvz-bent no="a">
          <template>Disiplinsizlik ve ahlaki durum nedeniyle Türk Silahlı Kuvvetlerinde, Jandarma Genel Komutanlığında veya Sahil Güvenlik Komutanlığında görev yapamayacağı ilgisine göre 31/1/2013 tarihli ve 6413 sayılı Türk Silahlı Kuvvetleri Disiplin Kanunu veya 31/1/2018 tarihli ve 7068 sayılı Genel Kolluk Disiplin Hükümleri Hakkında Kanun Hükmünde Kararnamenin Kabul Edilmesine Dair Kanun kapsamında yapılacak disiplin soruşturması neticesinde, sıralı amirlerinin her türlü bilgi ve belgeye dayanarak düzenleyeceği nitelik belgesi ile anlaşılmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>6/A maddesinde belirtilen durumları rapor, tutanak ve her türlü belge ile kanıtlanarak görevde başarısız olduğu tespit edilmiş olmak veya 6/B maddesinde belirtilen durumları rapor, tutanak ve her türlü belge ile kanıtlanarak kendilerinden istifade edilemeyeceği tespit edilmiş olmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Son olarak verilen de dâhil olmak üzere, kararın kesinleştiği tarihten itibaren geriye doğru son bir yıl içinde toplamda otuz gün ve daha fazla oda hapsi veya hizmet yerini terk etmeme cezasına mahkum olmak veya en son aldığı disiplin cezasından geriye doğru son bir yıl içinde en az iki disiplin amirinden toplam sekiz defa veya daha fazla disiplin cezası almak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yasa dışı siyasi, yıkıcı ve bölücü faaliyetlerde bulunmak, tutum ve davranışlarıyla bu görüşleri benimsediği tespit edilmek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Sözleşmeli er olmak için gerekli nitelik ve şartlardan herhangi birini taşımadığı sonradan anlaşılmak veya sözleşme süresi içinde bu niteliklerinden herhangi birini kaybetmek.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Yabancı uyruklu kişilerle yapılan evliliklerde, evlilikleri ilgili mevzuatta belirtilen esaslar dâhilinde Millî Savunma Bakanlığınca uygun görülmemek veya çeşitli nedenlerle Türk vatandaşlığını kaybetmek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Yetkili sağlık kurullarınca ilgili yönetmelik doğrultusunda verilen kararlara göre sözleşmeli erbaş ve er olarak göreve devamı mümkün olmamak.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>İstihdam edildikleri sınıf ve branşlarda görev yapamayacaklarına dair yetkili sağlık kurullarınca karar verilenlerden, idarece başka bir sınıfta istihdamına gerek duyulmamak.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Herhangi bir suç sebebiyle doksan günden fazla tutuklu kalmak ve göreve başlama tarihinden önce işlediği 3 üncü maddede belirtilen bir suç nedeniyle soruşturması devam edenlerden, haklarında verilecek olan mahkûmiyet hükmü göreve başladıktan sonra kesinleşmiş olmak.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Güvenlik soruşturması olumsuz sonuçlanmak.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Terör örgütleriyle eylem birliği içerisinde olmak, bu örgütlere yardım etmek, kamu imkân ve kaynaklarını bu örgütleri desteklemeye yönelik kullanmak ya da kullandırmak yahut bu örgütlerin propagandasını yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Askerlik hizmetini tamamlayanlar ile tamamlamış sayılanlardan sözleşmesi feshedilerek ilişiği kesilenler, yedekte erbaş ve er kaynağına alınırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Dördüncü fıkranın (f) ve (g) bentleri gereğince sözleşmeleri idarece feshedilenler 7 nci maddenin beşinci ve altıncı fıkralarında belirtilen haklardan istifade ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Sözleşmenin yapılmasını müteakip;</template>
        <mvz-bent no="a">
          <template>Barışta ve savaşta, görevini icra ederken veya görevi dolayısıyla bir saldırıya, kazaya uğrayan ya da bir meslek hastalığına yakalananlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kanser, tüberküloz, kronik böbrek yetmezliği ile ruh ve sinir hastalıkları gibi sağlık kurulları raporlarında uzun süreli bir tedaviye ihtiyaç gösterdiği belirtilen bir hastalığa yakalananlardan, toplam olarak ve fiilen üç yılı geçmemek şartıyla tedavi, istirahat veya hava değişimine tabi tutulanlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>hariç olmak üzere, sözleşmeli erbaş ve erlerin hava değişimi ve istirahat süresinin toplamı, istirahat ve hava değişiminin başladığı tarihten geriye doğru son bir yıl içerisinde (yatarak tedavi olma süreci hariç) üç ayı geçemez. Sürenin hesaplanmasına en son alınan hava değişimi ve istirahat süresi dahil edilir. Hava değişimi ve istirahat süresi üç ayı geçenlerin sözleşmeleri feshedilerek Türk Silahlı Kuvvetleri ile ilişikleri kesilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6/A" başlık="Görevde başarısız olma halleri">
      <mvz-fıkra no="1">
        <template>Sözleşmeli erbaş ve erlerden;</template>
        <mvz-bent no="a">
          <template>Atış, spor ve eğitim faaliyetlerinde ilgili mevzuatında öngörülen standartlara ulaşamayanlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Harekât, operasyon, iç güvenlik, hudut ve kolluk/asayiş görevleri ile kadro görevinin gereklerini yerine getirmede yetersizlik veya isteksizlik göstererek vazifeyi yahut birliğin emniyetini tehlikeye düşürenler veya görevin yapılmasını aksatanlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>bu durumlarının rapor, tutanak ve her türlü belge ile kanıtlanması halinde görevde başarısız sayılırlar ve 6 ncı maddenin dördüncü fıkrasının (b) bendine göre sözleşmeleri feshedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6/B" başlık="Kendilerinden istifade edilememe halleri">
      <mvz-fıkra no="1">
        <template>Sözleşmeli erbaş ve erlerden;</template>
        <mvz-bent no="a">
          <template>Mücbir sebepler hariç gelirinin çok üstünde borçlanmaya düşkün olan ve bu borçlarını ödememeyi alışkanlık haline getirenler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Görevine, sosyal ve aile yaşantısına zarar verecek derecede menfaatine, içkiye, kumara düşkün olanlar veya Türk Silahlı Kuvvetlerinin, Jandarma Genel Komutanlığının veya Sahil Güvenlik Komutanlığının itibarını sarsacak şekilde yüz kızartıcı, utanç verici veya toplumun genel ahlak yapısına aykırı fiillerde bulunanlar,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Devletin, Türk Silahlı Kuvvetlerinin, Jandarma Genel Komutanlığının veya Sahil Güvenlik Komutanlığının manevi şahsiyetine zarar verecek nitelikte suç veya disiplinsizlik teşkil eden tutum, davranış veya fiillerde bulunanlar,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>İntihara teşebbüs eden, kendisini veya bir başkasını kasten hizmete yaramayacak hale getiren ve getirtenler, kasten veya silah kullanımına yönelik mevzuat, talimat ya da emirlere açıkça aykırı olacak şekilde ateşli silah ile kendisini veya başkasını yaralayanlar,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Uyuşturucu ve uyarıcı maddeleri yapan veya kullanan, bunların yapılmasına, kullanılmasına, saklanmasına, nakledilmesine, yakalanacağı sırada ortadan kaldırılmasına, satılmasına veya satın alınmasına aracı olan, kullanılmasını kolaylaştıran ya da özendirenler,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Mazeretsiz olarak bir sözleşme yılı içinde toplam yedi gün ve daha uzun süre göreve gelmeyenler,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Türk Silahlı Kuvvetlerinde komando birliklerinde görev yapmak üzere Komando branşında istihdam edilmek üzere temin edilenlerden en az dört yıl hizmet süresini tamamlamadan, vazifenin sebep ve tesiri nedenleri hariç, komando niteliğini kaybettiği yönünde sağlık kurulu raporu alanlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>bu durumlarının rapor, tutanak ve her türlü belge ile kanıtlanması halinde kendinden istifade edilemeyecek personel sayılırlar ve 6 ncı maddenin dördüncü fıkrasının (b) bendine göre sözleşmeleri feshedilir.</template>
      </mvz-fıkra>

  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Özlük Hakları, Sosyal Haklar, İzin, Kıyafet ve Barınma">
    <mvz-madde no="7" başlık="Sosyal güvenlik ve mali haklar">
      <mvz-fıkra no="1">
        <template>Sözleşmeli er adayları ile sözleşmeli erbaş ve erler; ön sözleşme yapılması ile birlikte 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında sigortalı sayılır. Prime esas kazançların hesabında; sözleşmeli er adayı, sözleşmeli er ve sözleşmeli onbaşı olarak istihdam edilenler için uzman onbaşıların, sözleşmeli çavuş olarak istihdam edilenler için ise uzman çavuşların prime esas kazanç tutarları esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sözleşmeli er adaylarına, sözleşmeli erlerin birinci hizmet yılı için öngörülen ücretin üçte ikisi oranında, aynı esas ve usuller çerçevesinde aylık ücret ödenir. Ödemeler, her ayın başında peşin olarak yapılır. Sözleşmeli er adayları, ön sözleşme tarihinden itibaren ücrete hak kazanırlar. Sözleşmeli er adaylarının, ön sözleşme dönemindeki iaşe ve ibateleri, Devlet tarafından karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sözleşmeli erbaş ve erlere, sözleşme tarihinden geçerli olarak, 15.330 gösterge rakamının memur aylık katsayısıyla çarpımı sonucu bulunacak tutarın hizmet yıllarına göre bu Kanuna ekli (1) sayılı Cetvelde belirlenen oran ile çarpımı sonucu bulunacak tutar üzerinden aylık ücret verilir. Ekli (1) sayılı Cetvelde belirlenen oran, komando birliklerinde görevli sözleşmeli erbaş ve erlere yüzde sekiz, Amfibi Deniz Piyade Tugay Komutanlığında görevli sözleşmeli erbaş ve erlere yüzde beş, sınır birliklerinde, gemide ve yüzer birliklerde fiilen görevli sözleşmeli erbaş ve erlere yüzde üç arttırımlı uygulanır. Sözleşmeli erbaş ve erlere ödenecek ücretten, damga vergisi dışında herhangi bir vergi kesilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sözleşmeli er adayları ile sözleşmeli erbaş ve erlerden uçuş, paraşüt, denizaltı, dalgıç ve kurbağa adam hizmetlerinde görevlendirilenlere, bu hizmetlerde görevlendirilen ve aynı uçuş, dalış ve atlayış hizmet süresinde bulunan astsubaylara 28/2/1982 tarihli ve 2629 sayılı Uçuş, Paraşüt, Denizaltı, Dalgıç ve Kurbağa Adam Hizmetleri Tazminat Kanunu esaslarına göre hizmet yılları itibarıyla ödenen uçuş, dalış ve atlayış tazminatlarının yüzde yirmibeşi tutarında aylık uçuş, dalış ve atlayış tazminatı ilaveten ödenir. Ayrıca, bu kapsamda bulunanlar hakkında 2629 sayılı Kanunun şehitlik ve sakatlık tazminatı hükümleri uygulanır. Jandarma Genel Komutanlığı kadrolarında görev yapan sözleşmeli erbaş ve erlere 10/3/1983 tarihli ve 2803 sayılı Jandarma Teşkilat, Görev ve Yetkileri Kanununun 21 inci maddesinde, Sahil Güvenlik Komutanlığı kadrolarında görev yapan sözleşmeli erbaş ve erlere ise 9/7/1982 tarihli ve 2692 sayılı Sahil Güvenlik Komutanlığı Kanununun 7 nci maddesinde öngörülen ödeme tutarının yüzde kırkı, aynı usul ve esaslar çerçevesinde ödenir. Tutuklanan, firar eden veya izin tecavüzünde bulunan ve cezası infaz edilmekte olan sözleşmeli erbaş ve erlerin ücret ve diğer ödemeleri hakkında 27/7/1967 tarihli ve 926 sayılı Türk Silahlı Kuvvetleri Personel Kanununun 65 inci maddesi hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kendi kusurları olmaksızın veya ilk sözleşmesini yahut müteakip sözleşme süresini bitirmesinden dolayı Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ile Sahil Güvenlik Komutanlığından ayrılan sözleşmeli erbaş ve erlere, ayrıldıkları tarihteki 15.330 gösterge rakamının memur aylık katsayısıyla çarpımı sonucu bulunacak tutarın, bu Kanuna ekli (2) sayılı Cetvelde hizmet yıllarına göre belirlenen oran ile çarpımı sonucu bulunacak tutarda ödeme yapılır. Bu ödemeden, damga vergisi hariç herhangi bir vergi kesilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Çeşitli nedenlerle Türk vatandaşlığını kaybedenlerin yahut disiplinsizlik, ahlaki durum veya diğer nedenlerle Türk Silahlı Kuvvetlerinde, Jandarma Genel Komutanlığında veya Sahil Güvenlik Komutanlığında kalması uygun görülmeyerek sözleşmeleri feshedilenlere, beşinci fıkrada öngörülen ödeme yapılmaz. Sağlık yahut bulunduğu kadronun kaldırılması sebebiyle sözleşme yılını tamamlayamadan ayrılmak mecburiyetinde kalanlara, sözleşmeli olarak görev yaptığı yıllara ait ödeme tutarına, hizmet ettiği ve tamamlayamadığı sözleşme yılına ait ödeme tutarının oniki aya eşit olarak bölünmek suretiyle hizmet ettiği her aya isabet eden miktarda ilave edilerek ödeme yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Sözleşmeli erbaş ve erlerden ayrıldıktan sonra ilgili mevzuatına göre kamu kurum ve kuruluşlarında istihdam edilenler ile iş kanunlarına tabi olarak çalışanların emekli olmaları durumunda; ilgili mevzuatına göre ödenecek emekli ikramiyesi, iş sonu tazminatı ve kıdem tazminatının hesabında, bu maddenin beşinci ve altıncı fıkralarına göre yapılan ödemede esas alınan hizmet süreleri dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Görevde iken işledikleri kasıtlı suçlardan haklarında dava açılan ancak, yargılama sırasında sözleşme süresinin bitmesi nedeniyle kendi istekleri ile ayrılan sözleşmeli erbaş ve erlere, yargılama sonuçlanıp kesinleşinceye kadar beşinci fıkrada öngörülen ödeme yapılmaz. Yargılama sonucunda beraat edenlere hak ettikleri bu ödeme yapılır, mahkûm olanlara ise yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Vefat eden sözleşmeli erbaş ve erlerin kanuni mirasçılarına, bu maddenin beşinci ve altıncı fıkralarında öngörülen ödeme aynen yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Sosyal Güvenlik Kurumu tarafından, mevzuatı uyarınca kendilerine veya hak sahiplerine aylık bağlananlara, beşinci ve altıncı fıkralarda öngörülen ödemeler yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Vefat eden ve Sosyal Güvenlik Kurumu tarafından ilgili mevzuat hükümleri gereğince emekliye ayrılan sözleşmeli erbaş ve erlerden, o aya ait peşin ödenen aylık geri alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Esir düşen, görevi sırasında harp gaibi olan veya enterne edilenler ile terörle mücadele görevi sırasında veya bu görevlerinden dolayı alıkonulan ya da kaybolan sözleşmeli erbaş ve erler hakkında 926 sayılı Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Resmi sağlık kurumları tarafından düzenlenen sağlık kurulu raporu üzerine verilen hastalık izinleri, kanser, verem ve akıl hastalıkları gibi uzun süreli tedaviye ihtiyaç gösteren hastalığa yakalananların kullandığı hastalık izinleri ve hastalıkları sebebiyle resmi yataklı tedavi kurumlarında yatarak tedavi görülen tedavi süreleri ile terörle mücadele veya hudut birliklerindeki görevleri nedeniyle yaralanan personel hariç olmak üzere, bir takvim yılı içinde kullandığı hastalık izin süreleri toplamı onbeş günü aşan sözleşmeli er adayları ile sözleşmeli erbaş ve erlere, aşan günlere isabet eden aylık ücretleri yüzde on eksik ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="İzin, sosyal haklar, tertip edilme ve kuvvet değiştirme">
      <mvz-fıkra no="1">
        <template>Sözleşmeli erbaş ve erlerden barışta ve savaşta görev esnasında veya görev dışında görevlerinden dolayı bir saldırıya veya kazaya uğrayan veya bir meslek hastalığına yakalananların, iyileşinceye kadar ilişikleri kesilmez, izinli sayılırlar. Sıhhî arızası devam edenler ve kendisinden istifade edilemeyeceği anlaşılanlar hakkında 5510 sayılı Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sözleşmeli erbaş ve erlerden;</template>
        <mvz-bent no="a">
          <template>Kendi kusurları olmaksızın idare tarafından sözleşmeleri yenilenmeyenler ile sözleşme süresi içinde vefat, bir yıl içerisinde 6 ncı maddede belirtilen süreden daha fazla hava değişimi süresini geçirme, bulunduğu kadronun kaldırılması, istihdam edildiği kadronun sağlık niteliğini kaybetme nedenleriyle sözleşmeleri sona erenler, sözleşmeli erbaş ve er olarak hizmet ettikleri süre kadar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sözleşme süresi sonunda kendi istekleriyle sözleşmelerini yenilemeyenler ile istihdam edildiği kuvvetinin değiştirilmesi yahut sınıfının kaldırılması sebebiyle kendi istekleri üzerine sözleşmesini feshedenler, sözleşmeli erbaş ve er olarak hizmet ettikleri sürenin yarısı kadar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>müddetle genel sağlık sigortalısı sayılmaya devam olunur. Bu şekilde genel sağlık sigortalısı sayılmaya devam olunanların sigortalı hissesi dâhil genel sağlık sigortası primleri, prime esas günlük kazanç alt sınırının otuz katı üzerinden, Milli Savunma Bakanlığı veya İçişleri Bakanlığı tarafından ödenir. Genel sağlık sigortası priminin ödenmeye devam olunacağı dönem içerisinde, 5510 sayılı Kanunun 4 üncü maddesinde belirtilen sigortalılık hâllerinden biri kapsamında sigortalı olmayı gerektiren bir işte çalışanların, bu şekilde çalışmaları sebebiyle adlarına genel sağlık sigortası primi ödenen süreler için bu fıkra hükümlerine göre genel sağlık sigortası primi ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sözleşmeli erbaş ve erlerin vefatı hâlinde, 211 sayılı Kanunun 66 ncı maddesinin (b) fıkrası hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sözleşmeleri sağlık nedeniyle sona erenlerden; sözleşmelerinin sona ermesine neden olan sıhhî arızalarının tedavisine devam edilenlere, sözleşme sona erme tarihinden başlamak şartıyla oniki ayı geçmemek üzere tedavi süresince, görevdeki emsallerinin 7 nci maddenin üçüncü fıkrasına göre almış oldukları aylık net ücretin üçte ikisi her ay sağlık yardımı olarak kurumlarınca ödenir. Bu ödemeden hiçbir kesinti yapılmaz. Ödemeye ilişkin usul ve esaslar yönetmelikle düzenlenir. Ancak, sözleşme sona erme tarihinden itibaren oniki ay içerisinde sözleşmenin sona ermesine neden olan sıhhî arızasından dolayı, malûllük aylığına hak kazananlara, hak kazandıkları tarihten itibaren söz konusu yardım kesilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Sözleşmeli erbaş ve erlerin barışta her yıl otuz gün yıllık planlı izin hakkı vardır. Bu müddete yol dâhil değildir. Ayrıca, kısa süreli mazeretlerde kullanılmak üzere on beş güne kadar yıllık mazeret izni verilebilir. Yıllık izinlerin verilmesi, zamanı ve süresi hizmetin aksamaması esas alınmak suretiyle kıta, karargâh ve kurum amirlerince düzenlenir. On beş günlük mazeret izni dışında sözleşmeli erbaş ve erlere;</template>
        <mvz-bent no="a">
          <template>Ana, baba, eş, çocuk ve kardeşlerinin ölümü hâlinde on gün, kendisinin evlenmesi halinde yedi gün, eşinin doğum yapması halinde on gün,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yangın, deprem ve su baskını gibi olağanüstü bir mazeret dolayısıyla bir yıl içinde otuz güne kadar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>mazeret izni verilebilir. Verilen mazeret izinleri yıllık izne mahsup edilmez. İzinler, ilgili yönetmelik esaslarına göre düzenlenir. Görev ve hizmet ihtiyacının gerektirdiği durumlarda asgari tugay ve eşidi komutan veya amirin onayıyla bu Kanun kapsamına giren personel izinden geriye çağrılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Sözleşmeli erbaş ve erlerin giyecek, bakım ve barınmaları ile iaşeleri erbaş ve erler gibi Devlet tarafından sağlanır. Bunlara, bu kapsamda başkaca bir ödeme yapılmaz. Sözleşmeli erbaş ve erlerin giyim, kuşam istihkakları, ilgili bakanlıklarca düzenlenecek istihkak ve tahsis listelerinde gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Sözleşmeli erbaş ve erlerin kıyafetleri ile rütbelerinin şekli ve niteliği ilgili yönetmelikte gösterilir. Sözleşmeli erbaş ve erlerin silahları kadro silahıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Sözleşmeli erbaş ve erlerin günlük faaliyet programı ve hafta sonu izinleri, 1111 sayılı Kanun gereği askerlik yapanlarda olduğu gibidir. Sözleşme ve görev süresince kışlada iskân edilirler.  Ancak sözleşmeli erbaş ve erlere birliğin günlük faaliyet programı ile görevlerini ve emniyetini aksatmayacak şekilde hafta içi mesai sonrası ve hafta sonu görev yerlerinden ayrılmaları için izin verilir.  Görev yerlerinden ayrılmaları için izin verilenler, mesaiye gidiş ve gelişlerinde subay ve astsubay servislerinden istifade edebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Sözleşmeli erbaş ve erlerin ilk ve müteakip birliklere tertibi ilgili kuvvet komutanlıkları, Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığı Personel Başkanlıklarınca yapılır. Bu şekilde tertip edilen personel hakkında 1111 sayılı Kanunun erbaş ve erlere ilişkin hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Sözleşmeli erbaş ve erlerin, istihdam edildikleri kadro görev yerlerinin bağlı olduğu kuvvetin değişmesi durumunda kuvvetleri, ilgili Kuvvet Komutanlıkları, Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığının görüşleri alındıktan sonra ilgisine göre göre Milli Savunma Bakanlığı veya İçişleri Bakanlığı tarafından değiştirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Kendi kusurları olmaksızın sözleşmesi feshedilenler ile kendi isteği ile sözleşmesini yenilemeyenler veya ayrılanlar, ilgili mevzuattaki şartları sağlamak şartıyla uzman erbaşlığa veya astsubaylığa başvurabilirler. Başvuruda bulunan sözleşmeli erbaş ve erlere yönetmelikte belirtilen esaslar dâhilinde öncelik verilir.  Sözleşmeli çavuşlar, uzman erbaşlığa uzman çavuş rütbesiyle başlarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Bu Kanunun 7 nci maddesinin beşinci fıkrası kapsamındaki ödeme; sözleşmeli er/erbaş iken gerekli şartları taşıyarak ilgisine göre kuvvet komutanlıkları mensubu olup Milli Savunma Bakanlığı kadrolarında uzman erbaş olarak istihdam edilenlere, Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığı mensubu olup İçişleri Bakanlığı kadrolarında uzman erbaş olarak istihdam edilenlere ödenir. Ancak bu şekilde istihdam edilenlerin emekli olmaları durumunda; ilgili mevzuatına göre ödenecek emekli ikramiyesi, iş sonu tazminatı ve kıdem tazminatının hesabında, bu Kanun kapsamındaki hizmet süreleri dikkate alınmaz. Ayrıca sözleşmeli er/erbaş iken gerekli şartları taşıyarak astsubay nasbedilenlere bu ödeme yapılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Özel hükümler ve yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunda hüküm bulunmayan hâllerde, 1111 sayılı Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sözleşmeli er temin etmekten sorumlu birimler, sözleşmeli erbaş ve erlerde aranacak nitelikler, “sözleşmeli erbaş ve er olur” belgesi düzenleme esasları, müracaat şekli ve zamanı, müracaatın kabul edilmesi, sınav merkezi olarak tespit edilecek komutanlıkların belirlenmesi, sınav heyetlerinin oluşturulması, sözleşmeli onbaşılığa veya sözleşmeli çavuşluğa yükseltilme, sözleşme yapma ve feshi, askerî eğitim, değerlendirmeye esas alınacak nitelik belgesi, görevde başarısız olma ve kendilerinden istifade edilememe hâllerinde yapılacak işlemler ile diğer hususlardaki usul ve esaslar altı ay içerisinde Milli Savunma Bakanlığı ve İçişleri Bakanlığınca müştereken yürürlüğe konulan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>

    <mvz-madde no="1" başlık="Kamuda istihdam" tür="EK">
      <mvz-fıkra no="1">
        <template>Sözleşmeli erbaş ve er olarak en az yedi hizmet yılını doldurarak ayrılanlardan nitelik belgesi olumlu olanlar, ilgili mevzuatlarındaki şartları taşımaları kaydıyla kamu kurum ve kuruluşlarının boş kadro ve pozisyonlarına bu maddedeki usul ve esaslar çerçevesinde atanırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sözleşmeli erbaş ve erlerden talepte bulunanların bilgileri, hizmet süresi en fazla olandan başlamak üzere İçişleri veya Millî Savunma bakanlıkları tarafından yılda bir defa şubat ayının son gününe kadar Devlet Personel Başkanlığına bildirilir. İlgili personelin bildirilmiş olması atanma için tek başına hak teşkil etmez. Bu madde kapsamında personel istihdam etmek isteyen kamu kurum ve kuruluşları atama yapmak istedikleri boş kadro ve pozisyon sayısının iki katı kadar adayı Devlet Personel Başkanlığından her yılın 15 Mart tarihine kadar talep ederler. Devlet Personel Başkanlığınca 1 Mayıs tarihine kadar yılda bir defa kamu kurum ve kuruluşlarına sözleşmeli erbaş ve er olarak hizmet süresi en fazla olandan başlayarak aday listeleri gönderilir. Bir ay içinde yapılacak mülakatta başarılı bulunarak atananların bilgileri bir ay içinde ilgili kamu kurum ve kuruluşu tarafından Devlet Personel Başkanlığına bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ataması yapılan personel göreve başladığı tarihten itibaren atandığı kadro veya pozisyonun mali ve diğer haklarından faydalandırılır. Bunların sözleşmeli erbaş ve erlikte geçen hizmet süreleri, 657 sayılı Kanunda öngörülen öğrenim durumlarına göre yükselebilecekleri dereceleri aşmamak kaydıyla, başlangıç derece ve kademelerine her yıl bir kademe ilerlemesi ve her üç yıl bir derece yükselmesi sayılmak suretiyle kazanılmış hak aylık, derece ve kademeleri ile emekli ikramiyesinin hesabına esas sürenin tespitinde değerlendirilir. Atama onayı alınmasına rağmen görevine başlamayanlar ile başladıktan sonra herhangi bir sebeple görevden ayrılanlar bu madde kapsamında yeniden istihdam edilemezler. Seferberlik, savaş veya terörle mücadeleden kaynaklanan zorunlu hâllerde, kuvvet komutanlıkları, Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığı tarafından birinci fıkrada belirtilen hizmet süresi uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Başvuru, mülakat, atama ve diğer işlemlere ilişkin usul ve esaslar İçişleri ve Millî Savunma bakanlıkları ile Devlet Personel Başkanlığı tarafından müştereken çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu madde kapsamında ortaya çıkabilecek tereddütleri gidermeye, gerekli bilgi ve belgeleri istemeye, araştırma ve inceleme yapmaya ve uygulamayı yönlendirmeye Devlet Personel Başkanlığı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="EK">
      <mvz-fıkra no="1">
        <template>Askerî hizmete ilişkin görevleri sebebiyle haklarında kamu davası açılanlar hakkında 926 sayılı Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Sevk tehiri, askerlik yükümlülüğünün yerine getirilmiş sayılması" tür="EK">
      <mvz-fıkra no="1">
        <template>Askerlik hizmetine başlamadan sözleşmeli erliğe kabul edilenlerin sevkleri; ilgili kuvvet komutanlığının, Jandarma Genel Komutanlığının veya Sahil Güvenlik Komutanlığının teklifine istinaden, sözleşmeli er oluncaya kadar Millî Savunma Bakanlığı tarafından tehir edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sözleşmeli erbaş ve erlerden, askerlik yükümlülüğünü daha önce tamamlamamış olanların, askerlik yükümlülüklerine ilişkin olarak uygulanacak hükümler şunlardır:</template>
        <mvz-bent no="a">
          <template>Sözleşmeli erbaş ve erler ile sözleşmeli er adaylarından, ön sözleşme ve sözleşme süreleri içinde bu Kanunun 6 ncı maddesinin (b) ve (c) bentleri hariç olmak üzere birinci fıkrası ile (f) ve (g) bentleri hariç dördüncü fıkrası gereğince ilişiği kesilenlerden; ön sözleşme ve sözleşme döneminde ay olarak hizmette geçen sürelerinin üçte biri 1111 sayılı Kanunun 5 inci maddesinin birinci fıkrasına göre belirlenen süreyi karşılayanlar, askerlik hizmetini yerine getirmiş sayılır, bu süreyi karşılamayanların kalan süreleri tamamlattırılır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yukarıdaki bentte belirtilen hâller dışında herhangi bir nedenle sözleşmesi sona eren sözleşmeli erbaş ve erler ile sözleşmeli er adaylarından, ön sözleşme ve sözleşme döneminde ay olarak hizmette geçen sürelerinin üçte biri;</template>
          <mvz-altbent no="1">
            <template>Sözleşmesinin sona erme tarihinde 1076 sayılı Kanuna tabi olanlardan, 1111 sayılı Kanunun 5 inci maddesinin ikinci fıkrasına göre belirlenen süreyi karşılayanlar,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Sözleşmesinin sona erme tarihinde 1111 sayılı Kanuna tabi olanlardan, söz konusu Kanunun 5 inci maddesinin birinci fıkrasına göre belirlenen süreyi karşılayanlar,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>askerlik hizmetini yerine getirmiş sayılır, bu süreyi karşılamayanların kalan süreleri tamamlattırılır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Askerlik hizmetine devam ederken sözleşmeli er olarak alınanların, ön sözleşme imzaladıkları tarihe kadarki hizmet sürelerinin tamamı, kalan yükümlülük süresinin hesabından mahsup edilir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Askerlik hizmetinin tamamlattırılması, ilgilinin ilişiği kesilmeden, kuvvet komutanlıkları, Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığı tarafından belirlenecek birliklerde, erbaş veya er olarak yerine getirilir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Yetki devri" tür="EK">
      <mvz-fıkra no="1">
        <template>Millî Savunma ve İçişleri Bakanları, sözleşmeli erbaş ve erlerin adi malullük dâhil malullük veya vazife malullüğüne bağlı emeklilik işlemlerine ilişkin onay yetkisini devredebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Uzman erbaşlığa geçirilme" tür="EK">
      <mvz-fıkra no="1">
        <template>Sözleşmeli erbaş ve erlerden bu fıkradaki şartları sağlayanlar; kuvvet komutanlıklarının, Jandarma Genel Komutanlığının ve Sahil Güvenlik Komutanlığının ihtiyaç duyacağı miktar kadarı, aynı kuvvet komutanlığı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı içerisinde olmak şartı ile uzman erbaşlığa nasbedilirler. Uzman erbaşlığa geçirilmeye ilişkin usul, esas ve şartlar aşağıda belirtilmiştir:</template>
        <mvz-bent no="a">
          <template>En az lise mezunu olmak veya komando nitelikliler için en az ilköğretim okulu mezunu olmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Uzman erbaş olmaya istekli olmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Başvuru tarihinde ikinci hizmet yılını tamamlamış olmak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yönetmelikte öngörülen sınavlarda başarılı olmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>18/3/1986 tarihli ve 3269 sayılı Uzman Erbaş Kanununda ve bu Kanuna göre yürürlüğe konulacak yönetmelikte belirtilen; ceza durumuna, kişisel ve ahlaki niteliklere, disiplin durumuna, görevdeki başarısına, sağlık durumuna, mesleki yeterliliğe ve sahip olması gereken diğer niteliklere ilişkin şartları sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Tabi tutulacakları temel askerlik eğitiminde başarılı olmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sözleşmeli erbaş ve erlerden uzman erbaşlığa nasbedilecekler;</template>
        <mvz-bent no="a">
          <template>Uzman çavuş rütbesinde göreve başlatılırlar.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tabi tutulacakları eğitimler esnasında özlük hakları yönünden sözleşmeli erbaş ve er statüleri devam eder. Eğitimlerde başarılı olamayanlar ile kendi isteği ile ayrılanlardan, istekli olan ve sözleşmeli erbaş ve er olmak için gerekli olan şartları kaybetmemiş olanlar sözleşmeli erbaş ve er olarak hizmete devam ettirilirler. Eğitimini başarıyla tamamlayarak, bu madde kapsamında uzman erbaş nasbedilenler için, 3269 sayılı Kanunun 12 nci maddesinde öngörülen intibak dönemi uygulanmaz.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu personelin sözleşmeli erbaş ve erlikte geçen hizmet süreleri uzman erbaşlık hizmet süresinden sayılmaz.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce milli güvenliğe tehdit oluşturduğu tespit edilen FETÖ/PDY terör örgütüne aidiyeti, iltisakı veya irtibatı nedeniyle sözleşmeleri feshedilen sözleşmeli erbaş ve erler hakkında 22/7/2016 tarihli ve 667 sayılı Olağanüstü Hal Kapsamında Alınan Tedbirlere İlişkin Kanun Hükmünde Kararnamenin 4 üncü maddesinin ikinci ve üçüncü fıkraları uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Yürürlük">

      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Yürütme">
