  <mvz-künye tür="kanun" no="224" başlık="SAĞLIK HİZMETLERİNİN SOSYALLEŞTİRİLMESİ HAKKINDA KANUN"
             tarih="5/1/1961" rgazete-tarih="12/1/1961" rgazete-sayı="10705"
             düstur-tertip="4" düstur-cilt="1" düstur-sayfa="1486" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-b1 no="I" başlık="Kanunun gayesi">
      <mvz-madde no="1" başlık="">
        <mvz-fıkra no="1">
          <template>İnsan Hakları Evrensel Beyannamesinde bir hak olarak tanınan sağlık hizmetlerinden faydalanmanın sosyal adalete uygun bir şekilde ifasını sağlamak maksadiyle tababet ve tababetle ilgili hizmetler bu kanun çerçevesinde hazırlanacak bir program dahilinde sosyalleştirilecektir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="II" başlık="Terimler">
      <mvz-madde no="2" başlık="">
        <mvz-fıkra no="1">
          <template>Bu kanunda kullanılan terimlerin delalet ettiği manalar aşağıda gösterilmiştir:</template>
          <mvz-bent no="a">
            <template>Sağlık: Sağlık, yalnız hastalık ve malüliyetin yokluğu olmayıp bedenen, ruhen ve sosyal bakımdan tam bir iyilik halidir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Sağlık hizmetleri: İnsan sağlığına zarar veren çeşitli faktörlerin yokedilmesi ve toplumun bu faktörlerin tesirinden korunması, hastaların tedavi edilmesi, bedeni ve ruhi kabiliyet ve melekeleri azalmış olanların işe alıştırılması –Rehabilitasyon– için yapılan tıbbi faaliyetler sağlık hizmetidir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Amme sektörü: Umumi ve mülhak bütçeli idarelerle hususi idareler ve belediyeler ve bunlara bağlı teşekküller, sermayesinin tamamı Devlet tarafından verilmek suretiyle kurulan iktisadi teşekküller, idare ve murakabeleri 3460 sayılı kanun hükümlerine tabi teşekkül ve müesseseler, hususi kanunlarla kurulan bankalar ve diğer teşekküller, sermayesinin yarısından fazlası Devletin veya yukarıda yazılı müesseselerin elinde bulunan teşekküller ve bunların aynı nispetle iştirakleri ile vücut bulan kurumlar amme sektörünü teşkil ederler.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Sağlık personeli: Sağlık personeli, sağlık hizmetlerinde maaş, ücret, yevmiye ve mukavele ile istihdam edilen ve bu sahada mesleki eğitim görerek yetişmiş olanlardır.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Bu hizmet sahasında çalışan ve yüksek eğitim yapmamış olanlar yardımcı sağlık personelidir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Sosyalleştirme: Sağlık hizmetlerinin sosyalleştirilmesi vatandaşların sağlık hizmetleri için ödedikleri prim ile amme sektörüne ait müesseselerin bütçelerinden ayrılan tahsisat karşılığı herçeşit sağlık hizmetlerinden ücretsiz veya kendisine yapılan masrafın bir kısmına iştirak suretiyle eşit şekilde faydalanmalarıdır.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Sağlık ocağı: Takriben 5000 - 10000 kişinin köyler grubu veya bir kasaba veya şehir ve büyük kasabalardaki mahalle grupları bir sağlık ocağını teşkil eder. Bunların il içinde idari taksimata uyması icabetmez.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="III" başlık="Temel prensipler">
      <mvz-madde no="3" başlık="">
        <mvz-fıkra no="1">
          <template>Mülga</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="">
        <mvz-fıkra no="1">
          <template>Amme sektörüne dahil kurumlardan maaş veya ücret almıyan ve hiç bir şekilde ayni ve nakdi menfaat sağlamayan hekim ve tababet şubeleri mensupları, –mer'i kanunların hükümleri dairesinde– mesleklerini serbestçe icraya ve hususi sağlık müesseseleri ve eczane kurmağa mezundurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirildiği bölgelerde yaşayanların –ücretini şahsen ödemek şartiyle– sağlık hizmetlerini gördürmek üzere istedikleri sağlık personelini veya müessese ve eczaneyi seçmek hakları mahfuzdur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Cumhuriyeti hudutları içinde yaşayan yabancı uyruklu şahıslar Sağlık ve Sosyal Yardım Bakanlığı tarafından hazırlanan bir yönetmelik hükümleri çerçevesinde ücret mukabili sosyalleştirilmiş sağlık hizmetlerinden faydalanabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>4772 ve 5502 sayılı kanunlara tabi yabancı uyruklu sigortalılar sosyalleştirilmiş sağlık hizmetlerinden faydalanırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="">
        <mvz-fıkra no="1">
          <template>Kamu sektörüne dahil kurumlarda çalıştırılacak sağlık personeli miktarı bu kurumların tabi bulundukları kanunların hüküm ve esasları dairesinde alınan kadroları aşmamak şartıyla Sağlık ve Sosyal Yardım Bakanlığı tarafından ilgili bakanlıkların da mütalaası alınarak yapılacak teklif üzerine Başbakanlıkça tesbit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirildiği bölgelerde, Milli Savunma Bakanlığına bağlı teşekküller hariç amme sektörüne dahil kurumlara ait sağlık hizmetleri ilgili Bakanlıklarca müştereken hazırlanacak tüzükte gösterilen esaslar dairesinde Sağlık ve Sosyal Yardım Bakanlığı tarafından yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sosyal sigorta kanunları gereğince sigorta muameleleri için lüzumlu belgeler, Çalışma ve Sağlık ve Sosyal Yardım Bakanlığı tarafından müştereken tesbit olunan esaslar dahilinde, sosyalleştirilmiş sağlık hizmetleri teşkilatınca tanzim edilerek İşçi Sigortaları Kurumuna verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Sosyalleştirme">
    <mvz-b1 no="I" başlık="Sağlık Teşkilatının Kuruluş ve vazifeleri">
      <mvz-madde no="9" başlık="">
        <mvz-fıkra no="1">
          <template>Sosyalleştirilmiş sağlık hizmeti teşkilatı: Sağlık evleri sağlık ocakları, sağlık merkezleri ile hastaneleri, çeşitli koruyucu hekimlik teşekkülleri, sağlık hizmeti hususiyet arzeden yerler için kurulmuş sağlık teşekkülleri, sağlık müdürlükleri, bölge hastaneleri, bölge laboratuvarları, sağlık personeli yetiştiren eğitim müesseseleri, Sağlık ve Sosyal Yardım Bakanlığı merkez teşkilatı ve diğer Bakanlık ve kurumlarda Sağlık ve Sosyal Yardım Bakanlığı ile işbirliği yapmak üzere kurulmuş olan dairelerden teşekkül eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="">
        <mvz-fıkra no="1">
          <template>Bir sağlık ocağının hizmeti en az bir hekim ve yeter sayıda yardımcı sağlık personelinden teşekkül eden bir ekip tarafından yürütülür. Köylerde bu ekibe yardımcı olarak tesis edilen sağlık evlerinde yardımcı sağlık personeli vazifelendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sağlık ocakları ve evleri her türlü koruyucu hekimlik hizmetleri, hastaların muayene ve tedavisi ile, sağlık ocağına kayıtlı şahısların sağlık sicillerini tutmakla mükelleftir. Ocak hekimleri yalnız kendi ocakları içinde adli tabiplik vazifesi görürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Her ekibe sağlık hizmetlerini kifayetli bir şekilde yapacak motorlu veya gerekirse canlı nakil vasıtası, malzeme ve nüfusu 5000 den az olan yerlerde ikamet eden personele kira mukabili lojman tahsis edilir. Bu kira miktarı Maliye ve Sağlık ve Sosyal Yardım Bakanlığı tarafından hazırlanacak bir yönetmelikle tesbit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirildiği yerlerdeki her ilçede en az bir sağlık ocağı bulunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sağlık merkezlerindeki sağlık personeli, ocaklarda çalışan personelin her türlü koruyucu hekimlik ve tedavi hekimliği hizmetlerinde onlara rehber ve yardımcıdır. Bu hizmetlerden kendi uhdelerine verilenleri de bizzat ifa ederler. Sağlık merkezleri başhekimi kendisine bağlı sağlık ocaklarında çalışan personelin faaliyetlerini de denetler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sağlık merkezlerinin personel kadrosu ihtiyaca göre Sağlık ve Sosyal Yardım Bakanlığınca tesbit edilir. Her sağlık merkezinde kadrolarında yazılı sayıda motorlü vasıta, sağlık hizmetlerini kifayetli bir şekilde yapacak malzeme ve nüfusu 5000 den az olan yerlerde personele lojman verebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="">
        <mvz-fıkra no="1">
          <template>Hastaneler, sağlık ocaklarından veya sağlık merkezlerinden veya diğer hastanelerden gönderilen veya durumları acil müdahaleyi icabettiren veya 13 üncü madde hükümlerine göre müracaat eden hastaları ayakta veya yatarak tedavi etmek ve uhdelerine verilen koruyucu ve sosyal sağlık hizmetlerini yapmakla mükelleftirler. Hastanelerdeki sağlık personeli sağlık ocakları ve sağlık merkezleri personelinin mesleki tekamülüne de yardım ederler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="II" başlık="Sağlık hizmetlerinin yürütülmesi">
      <mvz-madde no="13" başlık="">
        <mvz-fıkra no="1">
          <template>Sosyalleştirilmiş sağlık hizmetlerinden faydalanmak istiyen, acil vakalar hariç, evvela sağlık evine veya sağlık ocağına başvururlar. Köylük bölgelerde sağlık ocağı hekimleri tedavi edemedikleri vakaları, güç olması muhakkak bulunan doğumları sağlık merkezine, hastaneye sevki gereken acil vakaları hastaneye yollarlar, Sağlık ocağında hekim bulunmadığı hallerde yardımcı sağlık personeli hastaları –kendi selahiyetleri dahilinde olan müdahaleyi mütaakıp gerekirse– sağlık merkezine veya hastaneye sevkedebilir. Sağlık merkezinde tedavisi mümkün olmıyan hastalar veya mütehassıs müdahalesini icabettiren doğumlar hastanelere veya doğumevlerine sevkedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sağlık hizmetlerinin sosyalleştirildiği bölgelerde sağlık ocağı sağlık merkezi ve hastanelerde hizmetin nasıl yürütüleceği Sağlık ve Sosyal Yardım Bakanlığınca hazırlanan bir yönetmelikle tesbit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirildiği bölgelerde hasta muayene ve tedavisi bu kanunun 16 ncı maddesi hükümleri dairesinde ücrete tabi olan ilaç bedelleri ve aşağıda zikredilen haller hariç parasızdır.</template>
          <mvz-bent no="a">
            <template>Sağlık ocağı tarafından sevkedilmedikleri halde sağlık merkezlerine veya hastanelere veya sağlık merkezi ve bir hastaneden diğer bir hastaneye sevkedilmeden hastanelere müracaat edenler –Acil vakalar hariç–,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Sağlık hizmetlerinin sosyalleştirilmediği bir bölgeden gelip de müracaat ettiği ocak bölgesinde ikametleri 90 günü aşmamış olanlar –Mahallin mülki amirlerinden fakirlik belgesi alanlar hariç–,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bölgede yaşayan halkın çalışma saatleri nazarı itibara alınarak tayin edilen mesai saatleri dışında ve tatil günlerinde nöbetçi olmayan hekim ve yardımcı sağlık personeline muayene ve tedavi olmak istiyenler,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sosyalleşmiş bölgelerden herhangi bir sebeple geçici olarak ayrılan ve kendi ocak hekimleri tarafından verilen sağlık fişlerini ibraz edenlerin muayenesi bulundukları yerlerdeki ocak hekimleri veya bunların hastayı sevkettikleri müesseselerde veya şahıs sağlık hizmetlerinin sosyalleştirilmediği bir bölgeye gittiği takdirde orada Sağlık ve Sosyal Yardım Bakanlığınca tayin edilen müesseselerde ücrete tabi değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirildiği bölgelerde, hastaların muhtaç olduğu ilaç ve tedavi vasıtaları köylerde ve serbest eczanesi bulunmayan yerlerde sağlık teşkilatınca veya Sağlık ve Sosyal Yardım Bakanlığı tarafından işletilen eczaneler ve ecza dolapları tarafından 209 sayılı Kanun ve bununla ilgili yönetmelik hükümleri dahilinde döner sermaye verilen Sağlık ve Sosyal Yardım Bakanlığına bağlı kurumlarca temin edilir. Bu eczane ve ecza dolapları ile teşekküller serbest meslek icra eden hekimlerin muayene ve tedavi ettikleri hastalara da ilaç satarlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="">
        <mvz-fıkra no="1">
          <template>Sosyalleştirilmiş sağlık hizmetleri gören teşekküller tarafından parasız veya bedelinin bir kısmı veya tamamı hastalar tarafından ödenerek alınacak ilaç ve tedavi vasıtalarının listeleri her yılın ilk ayında Sağlık ve Sosyal Yardım Bakanlığı tarafından ilan edilir. Liste harici ilaç ve tedavi araçları bedeli hastalar tarafından ödenmek suretiyle alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="III" başlık="Sosyalleştirmenin tatbik ve teşmili">
      <mvz-madde no="17" başlık="">
        <mvz-fıkra no="1">
          <template>Bir bölgede sağlık hizmetlerinin iyi bir şekilde yürütülmesi için gereken tesisler, lojmanlar, malzeme, araçlar ve personel temin edilmeden o bölgede sosyalleştirme planı tatbik edilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirilmesi hususundaki planın tatbikatına rehber olmak üzere gereken kılavuz bölgelerin nerelerde kurulacağı Sağlık ve Sosyal Yardım Bakanlığının teklifi üzerine Başbakanlıkça kararlaştırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sosyalleştirme planı bütün yurda kademeli surette teşmil edilirken sağlık hizmetlerinin hangi bölgelerde ve ne zaman sosyalleştirileceği de Sağlık ve Sosyal Yardım Bakanlığının teklifi üzerine Başbakanlıkça tesbit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="">
        <mvz-fıkra no="1">
          <template>Amme sektörüne dahil kurumlara bağlı sağlık idare ve teşkilatında yardımcı sağlık personeli yetiştiren okullarda ve kendi mensuplarına veya muayyen meslek gruplarına sağlık hizmeti yapan kurumlarda çalışan personele bu kanunun 3 ve 26 ncı maddelerinin hükümlerinin ne zaman tatbik edileceği bağlı oldukları bakanlıkların, aynı hükümlerin Tıp Fakültelerinde tatbik tarihi, üniversite senatosunun kararı ve Milli Eğitim Bakanlığının teklifi üzerine Bakanlar Kurulu tarafından kararlaştırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin bütün yurt sathında sosyalleştirilmesi en geç 1992 yılı sonuna kadar gerçekleştirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="IV" başlık="Özel daire, genel kurul, ve mahalli sağlık kurulları">
      <mvz-madde no="21" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirilmesi işlerini planlamak ve Bakanlığın diğer daireleri ile işbirliği yaparak yürütmek üzere Sağlık ve Sosyal Yardım Bakanlığında bir özel daire kurulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirilmesi faaliyetlerinin yürütülmesi ve değerlendirilmesi konusunda Sağlık ve Sosyal Yardım Bakanlığına görüşlerini bildirecek, tavsiyelerde bulunacak ve bu konuda halk ve çeşitli kurumlar arasında işbirliği sağlayacak bir Genel Kurul teşkil edilir. Bu Kurul Sağlık ve Sosyal Yardım Bakanlığından tayin edilecek veya vazifelendirilecek yeter sayıda mütehassıs ile Üniversitelerin, Bakanlıkların, Devlet Planlama Teşkilatının, İşçi Sigortaları Kurumunun, Türk Tabipleri Birliğinin, Türk Eczacılar Birliğinin, Türk Veteriner Hekimleri Odaları Birliğinin göndereceği salahiyetli temsilcilerle il sağlık kurullarının göndereceği birer temsilciden teşekkül eder. Sağlık ve Sosyal Yardım Bakanlığının talebi üzerine yukarıda adı zikredilmeyen kurumlar da Genel Kurula daimi veya muvakkat temsilci gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel Kurul mütat olarak yılda bir kere toplanır. Kurulun Başkanı Sağlık ve Sosyal Yardım Bakanı veya görevlendireceği bir zattır. Sağlık ve Sosyal Yardım Bakanı, Genel Kurulu veya Genel Kurulun bazı üyelerinden teşkil edeceği istişare kurullarını toplantıya çağırmağa salahiyetlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel Kurul Üyelerinden 3656 ve 3659 sayılı kanunlara tabi olup da toplantılara Ankara dışından geleceklere kanuni yollukları Sağlık ve Sosyal Yardım Bakanlığı tarafından, bunların dışında kalanlara yollukları Maliye ve Sağlık ve Sosyal Yardım Bakanlıkları tarafından tesbit edilen esaslar dahilinde ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="">
        <mvz-fıkra no="1">
          <template>Sosyalleştirilmiş sağlık hizmetleri teşkilatı ile halk arasındaki münasebeti temin maksadiyle sağlık ocaklarında, Sağlık merkezlerinde ve illerde, sağlık kurulları kurulur. Bu kurulların kuruluşu, çalışma tarzları ve toplantı zamanları Sağlık ve Sosyal Yardım Bakanlığı tarafından hazırlanan bir yönetmelikle tayin edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu kurullar halkın sağlık teşkilatından istediği hususları ilgililere duyurur. Hizmetlerin başarı ile yürütülmesi için halkın eğitilmesine ve teşkilat ile maddi ve manevi işbirliği yapmalarına yardım ederler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="V" başlık="Personele dair hükümler">
      <mvz-madde no="24" başlık="">
        <mvz-fıkra no="1">
          <template>Sosyalleştirilmiş sağlık hizmetlerinde vazife alanlar, vazifeye başladıkları günden itibaren mukavele imzalamaya mecburdurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu mukavele 1 yıldan az, 3 yıldan fazla olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mukavele müddeti zarfında ilgili kurumlar mukaveleli personeli lüzumu halinde sosyalleştirme bölgesi içinde herhangi bir mahalle ve sağlık vazifesine nakledebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mukavele müddetinin hitamından en geç 1 ay evvel mukavelenin yenilenmiyeceği bildirilmediği takdirde mukavele birer yıllık sürelerle uzatılmış sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bir yıldan fazla mukavele imzalanmış olması halinde, bir yıllık hizmetten sonra sebep gösterilmeksizin 3 aylık bir ihbar müddetine riayet kaydiyle mukavele her zaman için fesih edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Tayin edildikleri yere gitmiyenler veya vazifesini terk edenlerin mukaveleleri feshedilerek hizmetten çıkarılırlar. Bu suretle hizmetten ayrılanlar bir yıl süre ile kamu sektöründe herhangi bir göreve tayin edilemezler ve çalışmakta oldukları ilde veya daha önce mukavele ile çalıştıkları illerde bir yıl süre ile serbest sanat icra edemezler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetleri sosyalleştirilmiş illerde çalıştırılan hekimlerin istihdam yetkisi Sağlık ve Sosyal Yardım Bakanlığına, yardımcı personelin istihdam yetkisi ise İl Sağlık Müdürlerine aittir. Sosyalleştirilmiş sağlık hizmetleri personeli tayin edildikleri vazife dışında, tayin makamı tarafından uygun görüldüğü hallerde amme sektörüne ait başka bir sağlık hizmetini de günlük resmi mesai süresini aşmamak şartiyle ek ücret veya maaş almadan ifa ederler. Mahallin sağlık amiri, sağlık personeline zaruret halinde kısa süreli geçici vazifeler verebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık ve Soysal Yardım Bakanlığı veya ilgili Bakanlık Sağlık hizmetlerinin sosyalleştirilmiş olduğu bölgelerde kadro mevzuu olan hizmetlerinde mukavele ile sağlık personeli istihdam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sağlık personeline mukavele ile verilecek ücret miktarları bu meslek mensuplarının umumi serbest kazanç seviyeleri, hizmet süreleri, ihtisasları, işgal ettikleri mevkiin önemi, yaptıkları vazifenin ağırlığı ve çalıştıkları bölgelerde maruz kaldıkları mahrumiyet şartları göz önüne alınarak Sağlık ve Sosyal Yardım Bakanlığının teklifi ve Devlet Personel Dairesinin tesbit ettiği esaslara göre Bakanlar Kurulunca tayin olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>2847, 3656 ve 3659 sayılı kanunlara tabi daire ve teşekküllerde istihdam edilen personelden sosyalleştirilmiş bölgelerde istihdam edilenlerin istihdamları müddetince emeklilik, kıdem ve terfi hakları mahfuzdur. Bu gibi kimseler sosyalleştirilmiş bölgelerden ayrıldıkları zaman iktisap etmiş oldukları emeklilik ve terfi dereceleri nazarı itibara alınarak nakil ve tayinleri yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="">
        <mvz-fıkra no="1">
          <template>Ücret mukabili muayene ve tedavi edilen hastalardan ücret, hizmeti yapan sağlık personeli tarafından, makbuz mukabilinde tahsil edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="">
        <mvz-fıkra no="1">
          <template>Sosyalleştirilmiş hizmetlerde çalıştırılan karı veya kocanın aynı mahalde ayrı iki teşekkülde çalıştırılmaları mümkün değilse bunlar aynı hizmet yerine tayin edilebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="VI" başlık="Mali hükümler">
      <mvz-madde no="29" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirilmesi ile ilgili her çeşit inşaat ile bunlara gerekli yapı kısımlarının imal ettirilmesi, her türlü malzemenin alımı, taşıma ve depolama işleri için girişilecek yüklenmeler geçici ve kesin teminat hükümleri saklı kalmak şartiyle 2490 sayılı kanunun diğer hükümleri uygulanmamak, 1050 sayılı Muhasebei Umumiye Kanununun 135 inci maddesindeki %20 nispeti %30 olarak uygulanmak şartiyle, Bayındırlık Bakanlığınca merkezde ve illerde emaneten, mahdut eksiltme suretiyle veya birden fazla firmalar arasında pazarlıkla gerçekleştirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bayındırlık Bakanlığı lüzumu halinde inşaat için gerekli personel ve araçları inşaat ödeneğinden sağlayabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirildiği bölgelerde amme sektörüne dahil kurumların sağlık teşekküllerine ait binalar, malzeme, ilaç ve eşya Sağlık ve Sosyal Yardım Bakanlığının lüzum gösterdiği ve iş emniyetini tehdit etmediği takdirde aşağıdaki esaslar dairesinde Sağlık ve Sosyal Yardım Bakanlığına devrolunur:</template>
          <mvz-bent no="a">
            <template>Devlete ait binalar Maliye Bakanlığınca Sağlık ve Sosyal Yardım Bakanlığı emrine tahsis olunur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Sermayesinin tamamı Devlete ait iktisadi teşekküllerden Hazineye devredilecek binaların iktisap bedellerinden amortisman bedelleri çıkarıldıktan sonra geri kalan bakiye bu teşekkülün sermayesinden tenzil edilir. Binalar Hazine adına tescil edildikten sonra Sağlık ve Sosyal Yardım Bakanlığı emrine verilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bir kısım sermayesi hakiki veya hükmi şahıslara ait olan amme sektörü müesseselerinin malı olan binaların devrinde Devlet hissesine düşen kısım hakkında (b) fıkrasındaki gibi muamele yapılır. Hakiki ve hükmi şahısların hissesi kendilerine ödenir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>İşçi Sigortaları Kurumuna ait sağlık tesisleri, binaları, tıbbi malzeme, eşya ve ilaçlar, iktisap bedeli verilmek suretiyle, Sağlık ve Sosyal Yardım ve Çalışma Bakanlıkları tarafından müştereken tesbit edilecek esaslar dairesinde Sağlık ve Sosyal Yardım Bakanlığına devredilir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>(a), (b) ve (c) fıkralarında yazılı binalarla eşya, malzeme ve ilaçların devrine ait diğer hususat Maliye, Sağlık ve Sosyal Yardım ve ilgili Bakanlıklar arasında müştereken tesbit edilecek esaslara göre yürütülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirildiği bölgelerde hususi tababet icra edenlerin - istedikleri takdirde - sanatlarını icra için kullandıkları alet, makine, cihaz ve malzemeden işe yarar olanlar Sağlık ve Sosyal Yardım Bakanlığı tarafından satın alınabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Satın alma bedeli; malzemenin maliyeti, amortismanı, satın alındığı tarihteki rayiç fiyatı gözönünde tutularak Maliye, Sağlık ve Sosyal Yardım Bakanlıkları tarafından kurulacak bir komisyon kararı ile tayin olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="">
        <mvz-fıkra no="1">
          <template>Sosyalleştirilmiş sağlık hizmetlerinde ücretli olarak muayene ve tedaviye tabi şahıslardan alınacak ücretlerin miktarı Maliye ve Sağlık ve Sosyal Yardım Bakanlıkları tarafından müştereken tesbit ve ilan olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="33" başlık="">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirildiği bölgelerde belediye sağlık hizmetlerinden olan su, lağım, mezbaha ve temizlik işleri, umumi yerlerin, taşıtların ve meskenlerin teftişi, haşarat ve gıda kontrolü, mezarlıklar gibi çevre sağlığı hizmetleri belediyeler tarafından yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sağlık hizmetlerinin sosyalleştirildiği bölgelerde belediyelerin çevre sağlığı hizmetleri dışında kalan sağlık hizmetleri, hükümet tabipliği vazifeleri ve belediyenin çevre sağlığı hizmetlerinin murakabesi sağlık ocakları hekimleri tarafından ifa edilir ve bu bölgelere ayrıca hükümet tabibi tayin edilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bakanlar Kurulu tarafından tesbit edilecek olan kılavuz bölgelerde sağlık hizmetlerinin sosyalleştirilmesi için hazırlıklara 1 Mart 1962 de ve tatbikata Bakanlar Kurulunun tesbit edeceği tarihte başlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sosyalleştirme - Kılavuz bölgelerde elde edilen neticeler gözönüne alınarak en geç 1 Mart 1964 den itibaren kademeli olarak yurda teşmile başlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Sağlık hizmetlerinin sosyalleştirilmediği bölgelerde amme sektörüne bağlı kurumlarda sağlık hizmetleri kendi usul ve mevzuatına göre yürütülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Amme sektörüne dahil kurumların, sağlık hizmetlerinin sosyalleştirildiği bölgeler dahilinde bulunmakla beraber sosyalleştirmenin henüz teşmil edilmediği bölgelerdeki mensuplarının hizmetine de cevap veren Sağlık müesseselerinin 35 inci madde hükümleri gereğince Sağlık ve Sosyal Yardım Bakanlığına devri, kurumu talep ettiği takdirde sosyalleştirmenin bu kurumun teşkilatı olan her yere teşmil edilinceye kadar tehir edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu kanunun yürürlüğe girdiği tarihten önce mukavele imzalamış olan sağlık ve yardımcı sağlık personeli de değişik 24 üncü madde hükümlerinden faydalanırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
