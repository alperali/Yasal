  <mvz-künye tür="kanun" no="5018" başlık="KAMU MALÎ YÖNETİMİ VE KONTROL KANUNU"
             tarih="10/12/2003" rgazete-tarih="24/12/2003" rgazete-sayı="25326"
             düstur-tertip="5" düstur-cilt="42" />
    
  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
      <mvz-madde no="1" başlık="Amaç">
        <mvz-fıkra no="1">
          <template>Bu Kanunun amacı, kalkınma planları ve programlarda yer alan politika ve hedefler doğrultusunda kamu kaynaklarının etkili, ekonomik ve verimli bir şekilde elde edilmesi ve kullanılmasını, hesap verebilirliği ve malî saydamlığı sağlamak üzere, kamu malî yönetiminin yapısını ve işleyişini, kamu bütçelerinin hazırlanmasını, uygulanmasını, tüm malî işlemlerin muhasebeleştirilmesini, raporlanmasını ve malî kontrolü düzenlemektir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Kapsam">
        <mvz-fıkra no="1">
          <template>Bu Kanun, merkezi yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idarelerden oluşan genel yönetim kapsamındaki kamu idarelerinin malî yönetim ve kontrolünü kapsar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Avrupa Birliği fonları ile yurt içi ve yurt dışından kamu idarelerine sağlanan kaynakların kullanımı ve kontrolü de uluslararası anlaşmaların hükümleri saklı kalmak kaydıyla, bu Kanun hükümlerine tâbidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Düzenleyici ve denetleyici kurumlar, bu Kanunun sadece 3, 7, 8, 12, 15, 17, 18, 19, 25, 42, 43, 44, 47, 48, 49, 50, 51, 52, 53, 54, 68 ve 76 78 ncı maddelerine tâbidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="Tanımlar">
        <mvz-fıkra no="1">
          <template>Münhasıran bu Kanunun uygulanmasında;</template>
          <mvz-bent no="a">
            <template>Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu satışından doğan farklar, ekonomik, malî ve sosyal transferler, verilen bağış ve yardımlar ile diğer giderleri,</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Kamu geliri: Kanunlarına dayanılarak toplanan vergi, resim, harç, fon kesintisi, pay veya benzeri gelirler, faiz, zam ve ceza gelirleri, taşınır ve taşınmazlardan elde edilen her türlü gelirler ile hizmet karşılığı elde edilen gelirler, borçlanma araçlarının primli satışı suretiyle elde edilen gelirler, sosyal güvenlik primi kesintileri, alınan bağış ve yardımlar ile diğer gelirleri,</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Özel gelir: Genel bütçe kapsamındaki idarelerin kamu görevi ve hizmeti dışında ilgili kanunlarında veya Cumhurbaşkanlığı kararnamelerinde belirtilen faaliyetlerinden ve fiyatlandırılabilir nitelikteki mal ve hizmet teslimlerinden sağlanan ve genel bütçede gösterilen gelirleri,</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Harcama birimi: Kamu idaresi bütçesinde ödenek tahsis edilen ve harcama yetkisi bulunan birimi,</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Kamu malî yönetimi: Kamu kaynaklarının tanımlanmış standartlara uygun olarak etkili, ekonomik ve verimli kullanılmasını sağlayacak yasal ve yönetsel sistem ve süreçleri,</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Malî kontrol: Kamu kaynaklarının belirlenmiş amaçlar doğrultusunda, ilgili mevzuatla belirlenen kurallara uygun, etkili, ekonomik ve verimli bir şekilde kullanılmasını sağlamak için oluşturulan kontrol sistemi ile kurumsal yapı, yöntem ve süreçleri,</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Stratejik plan: Kamu idarelerinin orta ve uzun vadeli amaçlarını, temel ilke ve politikalarını, hedef ve önceliklerini, performans ölçütlerini, bunlara ulaşmak için izlenecek yöntemler ile kaynak dağılımlarını içeren planı,</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Malî yıl: Takvim yılını,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Kamu Maliyesi">
      <mvz-madde no="4" başlık="Kamu maliyesi">
        <mvz-fıkra no="1">
          <template>Kamu maliyesi; gelirlerin toplanması, harcamaların yapılması, açıkların finansmanı, kamunun varlık ve borçları ile diğer yükümlülüklerinin yönetimini kapsar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu maliyesi, merkezden ve yerinden yönetim esaslarına göre yürütülür. Kamu idarelerinin görevleri, ilgili kanunlarında veya Cumhurbaşkanlığı kararnamelerinde açık olarak belirlenir ve kaynakların dağıtımında esas alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Kamu maliyesinin temel ilkeleri">
        <mvz-fıkra no="1">
          <template>Kamu maliyesinin temel ilkeleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Kamu malî yönetimi uyumlu bir bütün olarak oluşturulur ve yürütülür.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kamu maliyesi, kamu görevlilerinin hesap verebilmelerini sağlayacak şekilde uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Maliye politikası, makroekonomik ve sosyal hedefler ile uyumlu bir şekilde oluşturulur ve yürütülür.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kamu malî yönetimi Türkiye Büyük Millet Meclisinin bütçe hakkına uygun şekilde yürütülür.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Kamu malî yönetimi malî disiplini sağlar.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Kamu malî yönetimi ekonomik, malî ve sosyal etkinliği birlikte sağlayacak şekilde kamusal tercihlerin oluşması için gerekli ortamı yaratır.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Kamu idarelerinin mal ve hizmet üretimi ile ihtiyaçlarının karşılanmasında, ekonomik veya sosyal verimlilik ilkelerine uygun olarak maliyet-fayda veya maliyet-etkinlik ile gerekli görülen diğer ekonomik ve sosyal analizlerin yapılması esastır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İlgili kanunlardaki hükümler saklı kalmak kaydıyla, kamu maliyesi ilkelerinin uygulanmasına ilişkin usul ve esaslar Cumhurbaşkanı tarafından belirlenir ve izlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Hazine birliği">
        <mvz-fıkra no="1">
          <template>Merkezî yönetim kapsamındaki kamu idarelerinin gelir, gider, tahsilat, ödeme, nakit planlaması ve borç yönetimi Hazine birliğini sağlayacak şekilde yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanuna ekli (I) sayılı cetvelde yer alan kamu idarelerinin tüm gelirleri Hazine veznelerine girer, giderleri bu veznelerden ödenir. Bu idareler özel vezne açamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Her türlü iç ve dış borçlanma, yurt dışından hibe alınması, borç ve hibe verilmesi ve bunlara ilişkin geri ödemeler, Hazine garantileri, Hazine alacakları, nakit yönetimi ve bunlarla ilgili diğer hususlarda 9.12.1994 tarihli ve 4059 sayılı, 28.3.2002 tarihli ve 4749 sayılı Kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanuna ekli (I) sayılı cetvelde yer alan kamu idarelerinin muhasebe hizmetlerini yürüten muhasebe birimlerince gerçekleştirilen tahsilât ve ödeme işlemleri, güvenli elektronik imza kullanılarak veya Türkiye Cumhuriyet Merkez Bankasınca belirlenecek güvenlik kriterlerine uygun olarak elektronik ortamda verilecek talimatlar çerçevesinde bu Banka aracılığıyla gerçekleştirilebilir. Genel yönetim kapsamındaki diğer kamu idarelerini uygulama kapsamına almaya ve uygulamaya ilişkin usul ve esasları belirlemeye Türkiye Cumhuriyet Merkez Bankasının görüşünü almak suretiyle Hazine ve Maliye Bakanlığı yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Kamu Kaynağının Kullanılmasının Genel Esasları">
      <mvz-madde no="7" başlık="Malî saydamlık">
        <mvz-fıkra no="1">
          <template>Her türlü kamu kaynağının elde edilmesi ve kullanılmasında denetimin sağlanması amacıyla kamuoyu zamanında bilgilendirilir. Bu amaçla;</template>
          <mvz-bent no="a">
            <template>Görev, yetki ve sorumlulukların açık olarak tanımlanması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Hükümet politikaları, kalkınma planları, yıllık programlar, stratejik planlar ile bütçelerin hazırlanması, yetkili organlarda görüşülmesi, uygulanması ve uygulama sonuçları ile raporların kamuoyuna açık ve ulaşılabilir olması,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Genel yönetim kapsamındaki kamu idareleri tarafından sağlanan teşvik ve desteklemelerin bir yılı geçmemek üzere belirli dönemler itibarıyla kamuoyuna açıklanması,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kamu hesaplarının standart bir muhasebe sistemi ve genel kabul görmüş muhasebe prensiplerine uygun bir muhasebe düzenine göre oluşturulması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Malî saydamlığın sağlanması için gerekli düzenlemelerin yapılması ve önlemlerin alınmasından kamu idareleri sorumlu olup, bu hususlar Hazine ve Maliye Bakanlığınca izlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Hesap verme sorumluluğu">
        <mvz-fıkra no="1">
          <template>Her türlü kamu kaynağının elde edilmesi ve kullanılmasında görevli ve yetkili olanlar, kaynakların etkili, ekonomik, verimli ve hukuka uygun olarak elde edilmesinden, kullanılmasından, muhasebeleştirilmesinden, raporlanmasından ve kötüye kullanılmaması için gerekli önlemlerin alınmasından sorumludur ve yetkili kılınmış mercilere hesap vermek zorundadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Stratejik planlama ve performans esaslı program bütçe">
        <mvz-fıkra no="1">
          <template>Kamu idareleri; kalkınma planları, Cumhurbaşkanı tarafından belirlenen politikalar, programlar, ilgili mevzuat ve benimsedikleri temel ilkeler çerçevesinde geleceğe ilişkin misyon ve vizyonlarını oluşturmak, stratejik amaçlar ve ölçülebilir hedefler saptamak, performanslarını önceden belirlenmiş olan göstergeler doğrultusunda ölçmek ve bu sürecin izleme ve değerlendirmesini yapmak amacıyla katılımcı yöntemlerle stratejik plan hazırlarlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu idareleri, kamu hizmetlerinin istenilen düzeyde ve kalitede sunulabilmesi için bütçeleri ile program ve proje bazında kaynak tahsislerini; stratejik planlarına, yıllık amaç ve hedefleri ile performans göstergelerine dayandırmak zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Stratejik plan hazırlamakla yükümlü olacak kamu idarelerinin ve stratejik planlama sürecine ilişkin takvimin tespitine, stratejik planların politikalar, kalkınma planı ve programlarla ilişkilendirilmesine yönelik usul ve esaslar Cumhurbaşkanı tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kamu idareleri, program bütçeye uygun olarak yürütecekleri faaliyetler ile bunların kaynak ihtiyacını, amaç, hedef ve performans göstergelerini içeren performans programı hazırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kamu idareleri bütçelerini, kalkınma planı, Cumhurbaşkanlığı programı, orta vadeli program,  Cumhurbaşkanlığı yıllık programı, stratejik planları ile program yapısına uyumlu şekilde ve performans esasına dayalı olarak hazırlar. Kamu idarelerinin bütçelerinin stratejik planlarda belirlenen performans göstergelerine uygunluğu ve idarelerin bu çerçevede yürütecekleri faaliyetler ile performans esaslı bütçelemeye ilişkin diğer hususlar Cumhurbaşkanı tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kamu idareleri, bütçeleri ile stratejik plan ve performans programlarını izlemek ve değerlendirmek amacıyla nesnel, sistematik ve düzenli olarak veri toplar ve analiz eder. İzleme ve değerlendirme sonuçları idare faaliyet raporlarında gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Cumhurbaşkanı tarafından ilgili kamu idaresi için uygun görülen performans göstergeleri, kuruluşların bütçelerinde yer alır. Performans denetimleri bu göstergeler çerçevesinde gerçekleştirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Bakanların ve Üst Yöneticilerin Hesap Verme Sorumluluğu">
      <mvz-madde no="10" başlık="Bakanlar">
        <mvz-fıkra no="1">
          <template>Bakanlar, Cumhurbaşkanı tarafından belirlenen politikaların uygulanması ile bakanlıkların ve bakanlıklara bağlı, ilgili ve ilişkili kuruluşların stratejik planları ile bütçelerinin kalkınma planlarına, yıllık programlara uygun olarak hazırlanması ve uygulanmasından, bu çerçevede diğer bakanlıklarla koordinasyon ve işbirliğini sağlamaktan sorumludur. Bu sorumluluk, Yükseköğretim Kurulu, Ölçme, Seçme ve Yerleştirme Merkezi Başkanlığı, üniversiteler ve yüksek teknoloji enstitüleri için Millî Eğitim Bakanına, mahallî idareler için Çevre ve Şehircilik Bakanına aittir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bakanlar, kamu kaynaklarının etkili, ekonomik ve verimli kullanılması ile hukuki ve mali konularda Cumhurbaşkanına karşı sorumludurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bakanlar; idarelerinin amaçları, hedefleri, stratejileri, varlıkları, yükümlülükleri ve yıllık performans programları konusunda her malî yılın ilk ayı içinde kamuoyunu bilgilendirirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Üst yöneticiler">
        <mvz-fıkra no="1">
          <template>Bakanlıklarda ve diğer kamu idarelerinde en üst yönetici, il özel idarelerinde vali ve belediyelerde belediye başkanı üst yöneticidir.   Bakanlıklarda en üst yönetici Cumhurbaşkanı tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Üst yöneticiler, idarelerinin stratejik planlarının ve bütçelerinin kalkınma planına, yıllık programlara, kurumun stratejik plan ve performans hedefleri ile hizmet gereklerine uygun olarak hazırlanması ve uygulanmasından, sorumlulukları altındaki kaynakların etkili, ekonomik ve verimli şekilde elde edilmesi ve kullanımını sağlamaktan, kayıp ve kötüye kullanımının önlenmesinden, malî yönetim ve kontrol sisteminin işleyişinin gözetilmesi, izlenmesi ve kanunlar ile Cumhurbaşkanlığı kararnamelerinde belirtilen görev ve sorumlulukların yerine getirilmesinden Bakana; mahallî idarelerde ise meclislerine karşı sorumludurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Üst yöneticiler, bu sorumluluğun gereklerini harcama yetkilileri, malî hizmetler birimi ve iç denetçiler aracılığıyla yerine getirirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Kamu İdare Bütçeleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-madde no="12" başlık="Bütçe türleri ve kapsamı">
        <mvz-fıkra no="1">
          <template>Genel yönetim kapsamındaki idarelerin bütçeleri; merkezî yönetim bütçesi, sosyal güvenlik kurumları bütçeleri ve mahallî idareler bütçeleri olarak hazırlanır ve uygulanır. Kamu idarelerince bunlar dışında herhangi bir ad altında bütçe oluşturulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Merkezî yönetim bütçesi, bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerinin bütçelerinden oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel bütçe, Devlet tüzel kişiliğine dahil olan ve bu Kanuna ekli (I) sayılı cetvelde yer alan kamu idarelerinin bütçesidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Özel bütçe, bir bakanlığa bağlı veya ilgili olarak belirli bir kamu hizmetini yürütmek üzere kurulan, gelir tahsis edilen, bu gelirlerden harcama yapma yetkisi verilen, kuruluş ve çalışma esasları kanunla veya Cumhurbaşkanlığı kararnamesiyle düzenlenen ve bu Kanuna ekli (II) sayılı cetvelde yer alan her bir kamu idaresinin bütçesidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Düzenleyici ve denetleyici kurum bütçesi, kanunla veya Cumhurbaşkanlığı kararnamesiyle kurul, kurum veya üst kurul şeklinde teşkilatlanan ve bu Kanuna ekli (III) sayılı cetvelde yer alan her bir düzenleyici ve denetleyici kurumun bütçesidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Sosyal güvenlik kurumu bütçesi, sosyal güvenlik hizmeti sunmak üzere, kanunla veya Cumhurbaşkanlığı kararnamesiyle kurulan ve bu Kanuna ekli (IV) sayılı cetvelde yer alan her bir kamu idaresinin bütçesidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Mahallî idare bütçesi, mahallî idare kapsamındaki kamu idarelerinin bütçesidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Bütçe ilkeleri">
        <mvz-fıkra no="1">
          <template>Bütçelerin hazırlanması, uygulanması ve kontrolünde aşağıdaki ilkelere uyulur:</template>
          <mvz-bent no="a">
            <template>Bütçelerin hazırlanması ve uygulanmasında, makroekonomik istikrarla birlikte sürdürülebilir kalkınmayı sağlamak esastır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kamu idarelerine bütçeyle verilen harcama yetkisi, kanunlarla veya Cumhurbaşkanlığı kararnameleriyle düzenlenen görev ve hizmetlerin yerine getirilmesi amacıyla kullanılır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bütçeler kalkınma planı ve programlarda yer alan politika, hedef ve önceliklere uygun şekilde, idarelerin stratejik planları ile performans ölçütlerine ve fayda-maliyet analizine göre hazırlanır, uygulanır ve kontrol edilir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Bütçeler, stratejik planlar dikkate alınarak izleyen iki yılın bütçe tahminleriyle birlikte görüşülür ve değerlendirilir.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Bütçe, kamu malî işlemlerinin kapsamlı ve saydam bir şekilde görünmesini sağlar.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Tüm gelir ve giderler gayri safi olarak bütçelerde gösterilir.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Belirli gelirlerin belirli giderlere tahsis edilmemesi esastır.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Bütçelerde gelir ve gider denkliğinin sağlanması esastır.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Bütçeler, ait olduğu yıl başlamadan önce Türkiye Büyük Millet Meclisi veya yetkili organlarca kabul edilmedikçe veya onaylanmadıkça uygulanamaz.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Bütçelerde, bütçeyi ilgilendirmeyen hususlara yer verilmez.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Bütçeler, program yapısı esas alınarak kurumsal ve ekonomik sonuçların görülmesini sağlayacak şekilde Cumhurbaşkanlığınca uluslararası standartlara uygun olarak belirlenen bir sınıflandırmaya tabi tutularak hazırlanır ve uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Bütçe gelir ve gider tahminleri ile uygulama sonuçlarının raporlanmasında açıklık, doğruluk ve malî saydamlık esas alınır.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Kamu idarelerinin tüm gelir ve giderleri bütçelerinde gösterilir.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Kamu hizmetleri, bütçelere konulacak ödeneklerle, mevzuatla belirlenmiş yöntem, ilke ve amaçlara uygun olarak gerçekleştirilir.</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Bütçelerde, ödenekler belirli amaçları gerçekleştirmek üzere tahsis edilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Gelir ve giderleri etkileyecek kanun teklifleri" durum="iptal">
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Merkezî Yönetim Bütçe Kanunu">
      <mvz-madde no="15" başlık="Merkezî yönetim bütçe kanununun kapsamı ve düzeni">
        <mvz-fıkra no="1">
          <template>Merkezî yönetim bütçe kanunu, merkezî yönetim kapsamındaki kamu idarelerinin gelir ve gider tahminlerini gösteren, bunların uygulanmasına ve yürütülmesine yetki ve izin veren kanundur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Merkezî yönetim bütçe kanununda; yılı ve izleyen iki yılın gelir ve gider tahminleri, varsa bütçe açığının veya fazlasının tutarı, açığın nasıl kapatılacağı veya fazlanın nasıl kullanılacağı, vergi muafiyeti, istisnası ve indirimleri ile benzeri uygulamalar nedeniyle vazgeçilen vergi gelirleri, borçlanma ve garanti sınırları, bütçelerin uygulanmasında tanınacak yetkiler, bağlı cetveller, malî yıl içinde gelir ve giderlere yönelik olarak uygulanacak hükümler yer alır. Merkezî yönetim kapsamındaki kamu idarelerinin her birinin gelir-gider tahminleri, merkezî yönetim bütçe kanununda ayrı bölüm veya cetvellerde gösterilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Merkezî yönetim bütçe kanununun gider cetvelinin bölümleri, analitik bütçe sınıflandırması esas alınarak programlar itibarıyla düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İlgili mevzuatta giderlere ilişkin olarak yer alan “Tertip” deyimi program sınıflandırmasının ilk düzeyini, kurumsal ve finansman tipi sınıflandırmanın bütün düzeyleri ile ekonomik sınıflandırmanın ilk iki düzeyini, borç ödemeleri yönünden “ilgili hizmet tertibi” deyimi borç konusu hizmetlerin yürütüldüğü ilgili tertipleri ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="Orta vadeli program  ve bütçe hazırlama rehberi">
        <mvz-fıkra no="1">
          <template>Cumhurbaşkanlığı merkezî yönetim bütçe kanunu teklifini hazırlar ve bu amaçla ilgili kamu idareleri arasında koordinasyonu sağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Merkezî yönetim bütçesinin hazırlanma süreci, Cumhurbaşkanı tarafından en geç Eylül ayının ilk haftası sonuna kadar kalkınma planları, stratejik planlar ve genel ekonomik koşulların gerekleri doğrultusunda makro politikaları, ilkeleri, hedef ve gösterge niteliğindeki temel ekonomik büyüklükleri, gelecek üç yıla ilişkin toplam gelir ve gider tahminlerini, bütçe dengesi ve borçlanma durumu ile kamu idarelerinin ödenek teklif tavanlarını içeren orta vadeli programın Resmî Gazete’de yayımlanması ile başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu doğrultuda, kamu idarelerinin bütçe tekliflerini ve yatırım programını hazırlama sürecini yönlendirmek üzere; Bütçe Çağrısı ve eki Bütçe Hazırlama Rehberi ile Yatırım Genelgesi ve eki Yatırım Programı Hazırlama Rehberi Cumhurbaşkanlığı tarafından hazırlanarak en geç Eylül ayının onbeşine kadar Resmî Gazete’de yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bütçe Hazırlama Rehberi ile Yatırım Programı Hazırlama Rehberi, bütçe tekliflerinin hazırlanmasına esas olmak üzere, kamu idarelerince uyulması gereken genel ilkeleri, nesnel ve ölçülebilir standartları, hesaplama yöntemlerini, bunlara ilişkin olarak kullanılacak cetvel ve tablo örneklerini ve diğer bilgileri içerir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="Merkezî yönetim bütçesinin hazırlanması">
        <mvz-fıkra no="1">
          <template>Gelir ve gider tekliflerinin hazırlanmasında;</template>
          <mvz-bent no="a">
            <template>Orta vadeli programda belirlenen temel büyüklükler ile ilke ve esaslar,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kalkınma planı ve yıllık program öncelikleri ile kurumun stratejik planları çerçevesinde belirlenmiş ödenek tavanları,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kamu idarelerinin stratejik planları ile uyumlu çok yıllı bütçeleme anlayışı,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>İdarenin performans hedefleri,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu idareleri, merkez ve merkez dışı birimlerinin ödenek taleplerini dikkate alarak gider tekliflerini hazırlar. Genel bütçe gelir teklifi Cumhurbaşkanlığı tarafından, diğer bütçelerin gelir teklifleri ilgili idarelerce hazırlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gider ve gelir teklifleri, ekonomik ve malî analiz yapılmasına imkân verecek, hesap verilebilirliği ve saydamlığı sağlayacak şekilde, Cumhurbaşkanlığı tarafından uluslararası standartlara uyumlu olarak belirlenen sınıflandırma sistemine göre hazırlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kamu idareleri, stratejik planları ile Bütçe Hazırlama Rehberinde yer alan esaslar çerçevesinde, bütçe gelir ve gider tekliflerini gerekçeli olarak hazırlar ve yetkilileri tarafından imzalanmış olarak en geç Eylül ayı sonuna kadar Cumhurbaşkanlığına gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bütçe teklifleri Cumhurbaşkanlığına verildikten sonra, kamu idarelerinin yetkilileriyle gider ve gelir teklifleri hakkında görüşmeler yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Düzenleyici ve denetleyici kurumlar, bütçelerini üç yıllık bütçeleme anlayışı, stratejik planları ve performans programları ile program yapısını esas alarak bu Kanunda tanımlanan tertip düzeylerini içerecek şekilde hazırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Merkezî yönetim bütçe kanun teklifinin sunulması">
        <mvz-fıkra no="1">
          <template>Merkezî yönetim bütçe kanun teklifi malî yılbaşından en az yetmiş beş gün önce Cumhurbaşkanı tarafından Türkiye Büyük Millet Meclisine sunulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Merkezî yönetim bütçe kanun teklifine, Türkiye Büyük Millet Meclisinde görüşülmesi sırasında dikkate alınmak üzere Cumhurbaşkanlığı tarafından;</template>
          <mvz-bent no="a">
            <template>Orta vadeli programı da içeren bütçe gerekçesi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yıllık ekonomik rapor,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Vergi muafiyeti, istisnası ve indirimleri ile benzeri uygulamalar nedeniyle vazgeçilen kamu gelirleri cetveli,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kamu borç yönetimi raporu,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Genel yönetim kapsamındaki kamu idarelerinin son iki yıla ait bütçe gerçekleşmeleri ile izleyen iki yıla ait gelir ve gider tahminleri,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Mahallî idareler ve sosyal güvenlik kurumlarının bütçe tahminleri,</template>
          </mvz-bent>
          <mvz-bent no="g" durum="mülga">
            <template></template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Merkezî yönetim kapsamında olmayıp, merkezî yönetim bütçesinden yardım alan kamu idareleri ile diğer kurum ve kuruluşların listesi,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>eklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Türkiye Büyük Millet Meclisi ve Sayıştay ile Düzenleyici ve denetleyici kurumlar, bütçelerini Eylül ayı sonuna kadar doğrudan Türkiye Büyük Millet Meclisine, bir örneğini de Cumhurbaşkanlığına gönderirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Merkezî yönetim bütçe kanun teklifinin görüşülmesi">
        <mvz-fıkra no="1">
          <template>Türkiye Büyük Millet Meclisi, merkezî yönetim bütçe kanun teklifinin metnini maddeler, gider ve gelir cetvellerini kamu idareleri itibarıyla görüşür ve  oylar. Merkezî yönetim bütçe kanunu malî yıl başından önce Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu yatırım programı, merkezî yönetim bütçe kanununa uygun olarak  anılan Kanunun yürürlüğe girdiği tarihten itibaren on beş gün içinde Cumhurbaşkanı kararıyla Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Merkezî yönetim bütçe kanununun süresinde yürürlüğe konulamaması halinde, geçici bütçe kanunu çıkarılır. Geçici bütçe ödenekleri, bir önceki yıl bütçe başlangıç ödeneklerinin belirli bir oranı esas alınarak belirlenir. Geçici bütçe kanununun da çıkarılamaması durumunda, yeni bütçe kanunu kabul edilinceye kadar bir önceki yılın bütçesi yeniden değerleme oranına göre artırılarak uygulanır. Cari yıl bütçesinin yürürlüğe girmesiyle geçici bütçe veya yeniden değerleme oranına göre artırılarak belirlenen bütçe uygulaması sona erer ve o tarihe kadar yapılan harcamalar ve girişilen yüklenmeler ile tahsil olunan gelirler cari yıl bütçesine dahil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Merkezî yönetim kapsamındaki kamu idarelerinin bütçelerindeki ödeneklerin yetersiz kalması halinde veya öngörülmeyen hizmetlerin yerine getirilmesi amacıyla, karşılığı gelir gösterilmek kaydıyla, kanunla ek bütçe yapılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Bütçelerin Uygulama Esasları">
      <mvz-madde no="20" başlık="Ödeneklerin kullanılması">
        <mvz-fıkra no="1">
          <template>Bütçe ödeneklerinin kullanılmasında aşağıda belirtilen esaslara uyulur:</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>(a)  Genel bütçe kapsamındaki kamu idareleri, ayrıntılı harcama programlarını hazırlar ve vize edilmek üzere Cumhurbaşkanlığına gönderir. Bütçe ödenekleri, Cumhurbaşkanlığı tarafından belirlenecek esaslar çerçevesinde, nakit planlaması da dikkate alınarak vize edilen ayrıntılı harcama programları ve serbest bırakma oranlarına göre kullanılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>(b)  Özel bütçeli idareler ve sosyal güvenlik kurumları ayrıntılı finansman programlarını hazırlar ve harcamalarını bu programa uygun olarak yaparlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>(c)  Ayrıntılı harcama ve finansman programlarının hazırlanmasına, vize edilmesine, uygulanmasına ve uygulamanın izlenmesine dair usûl ve esaslar Cumhurbaşkanlığı tarafından belirlenir.</template>
          <mvz-bent no="d">
            <template>Kamu idareleri, bütçelerinde yer alan ödeneklerin üzerinde harcama yapamaz. Bütçeyle verilen ödenekler, tahsis edildikleri amaçlar doğrultusunda yılı içinde yaptırılan iş, satın alınan mal ve hizmetler ile diğer giderlerin karşılanmasında kullanılır. Ancak, ait olduğu malî yılda ödenemeyen ve emanet hesabına alınamayan zamanaşımına uğramamış geçen yıllar borçları ile ilama bağlı borçlar, ilgili kamu idaresinin cari yıl bütçesinden ödenir.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İlgili mevzuatına göre, yılı içinde hizmetin gerektirdiği hâllerde Cumhurbaşkanlığı tarafından belirlenen usûl ve esaslar çerçevesinde merkezî yönetim kapsamındaki kamu idarelerinin bütçelerinde yeni tertipler, gelir kodları ve finansman kodları açılabilir.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Cari yılda kullanılmayan ödenekler yıl sonunda iptal edilir.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Genel veya kısmi seferberlik, savaş ilanı veya  zorunlu askeri hazırlıkların yapıldığı olağanüstü hallerde Millî Savunma Bakanlığı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı bütçelerindeki mevcut ödenekler, bu idarelerin ödenek toplamları aşılmamak şartıyla, birleştirilerek kullanılabilir. Bu durumda da mevcut ödeneklerin yeterli olmaması halinde toplam ödenek tutarının yüzde on beşine kadar ek harcama yapılabilir. Yukarıda sayılan hallerde sevk ve intikalle ilgili giderler için, harcama yetkililerinin onayıyla görevlendirilecek mutemetlere gereken miktarda avans verilebilir ve gönderilecek ödeneğe istinaden bir ay içinde mahsup edilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="Ödenek aktarmaları">
        <mvz-fıkra no="1">
          <template>Merkezî yönetim kapsamındaki kamu idarelerinin bütçeleri arasındaki ödenek aktarmaları kanunla yapılır. Ancak, harcamalarda tasarrufu sağlamak, dengeli ve etkili bir bütçe politikasını gerçekleştirmek üzere genel bütçe ödeneklerinin yüzde onunu geçmemek kaydıyla, merkezî yönetim kapsamındaki kamu idarelerinin bütçeleri arasındaki ödenek aktarmalarına ilişkin yetki ve işlemler ile usul ve esaslar merkezî yönetim bütçe kanununda belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Merkezî yönetim kapsamındaki kamu idareleri, aktarma yapılacak tertipteki ödeneğin yüzde yirmisine kadar kendi bütçeleri içinde ödenek aktarması yapabilirler. Ancak, ihtiyaç halinde yüzde yirmiyi aşan ödenek aktarma işlemlerini kurum bütçesinin başlangıç ödenekleri toplamının yüzde yirmisini geçmemek üzere yapmaya Cumhurbaşkanlığı, yılı yatırım programına ek yatırım cetvellerinde yer alan projelerde değişiklik yapılması halinde değişikliğin gerektirdiği tertipler arası ödenek aktarması işlemlerinin tamamını yapmaya ise ilgili idareler yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu idarelerinin bütçeleri içinde; personel giderleri tertiplerinden, aktarma yapılmış tertiplerden ve yedek ödenekten aktarma yapılmış tertiplerden diğer tertiplere ödenek aktarılamaz. Ancak, yılı yatırım programına ek yatırım cetvellerinde yer alan projelerde değişiklik yapılması halinde, aktarma yapılan tertiplerden diğer tertiplere ödenek aktarılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Merkez dışı birimlere ödenek gönderme">
        <mvz-fıkra no="1">
          <template>Kamu idarelerinin merkez teşkilatı harcama yetkilileri, merkez dışı birimlere, ihtiyaçlarında kullanılmak üzere Ödenek Gönderme Belgesi düzenlemek suretiyle ödenek gönderirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Merkezî yönetim kapsamındaki kamu idarelerinde ödenek gönderilmesine ilişkin usul ve esasları belirlemeye Hazine ve Maliye Bakanı yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Yedek ödenek">
        <mvz-fıkra no="1">
          <template>Merkezî yönetim bütçe kanununda belirtilen hizmet ve amaçları gerçekleştirmek, ödenek yetersizliğini gidermek veya bütçelerde öngörülmeyen hizmetler için, bu Kanuna ekli (I) sayılı cetvelde yer alan idareler ile (II) sayılı cetvelde yer alan idarelerden merkezî yönetim bütçe kanununda gösterilecek olanların bütçelerine aktarılmak üzere, genel bütçe ödeneklerinin yüzde ikisine kadar  yedek ödenek konulabilir. Bu ödenekten aktarma yapmaya Cumhurbaşkanı yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Malî yıl içinde yedek ödenekten yapılan aktarmaların tür, tutar ve idareler itibarıyla dağılımı, yılın bitimini takip eden on beş gün içinde Cumhurbaşkanlığı tarafından ilan edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="Örtülü ödenek">
        <mvz-fıkra no="1">
          <template>Örtülü ödenek; kapalı istihbarat ve kapalı savunma hizmetleri, Devletin millî güvenliği ve yüksek menfaatleri ile Devlet itibarının gerekleri, siyasi, sosyal ve kültürel amaçlar ve olağanüstü hizmetlerle ilgili Devlet ve Hükümet icapları için kullanılmak üzere Cumhurbaşkanlığı bütçesine konulan ödenektir. Kanunlarla veya Cumhurbaşkanlığı kararnameleriyle verilen görevlerin gerektirdiği istihbarat hizmetlerini yürüten diğer kamu idarelerinin bütçelerine de örtülü ödenek konulabilir. Örtülü ödenek, bu amaçlar dışında, Cumhurbaşkanının ve ailesinin kişisel harcamaları ile siyasi partilerin idare, propaganda ve seçim ihtiyaçlarında kullanılamaz. İlgili yılda bu amaçla tahsis edilen ödenekler toplamı, genel bütçe başlangıç ödenekleri toplamının binde beşini geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Cumhurbaşkanlığı ve diğer ilgili idare bütçelerinde yer alan örtülü ödeneklerin kullanılma yeri, giderin kimin tarafından yapılacağı, hesapların tutulma ve kapatılma yöntemi, gideri yapanın değişmesi halinde yeni yetkiliye hangi belgelerin aktarılacağı Cumhurbaşkanı tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Örtülü ödeneklere ilişkin giderler Cumhurbaşkanı tarafından belirlenen esaslara göre gerçekleştirilir ve ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="Kamu yatırım projeleri">
        <mvz-fıkra no="1">
          <template>Kamu yatırım projeleri ilgili mevzuat hükümleri çerçevesinde hazırlanır, uygulanır ve izlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Millî Savunma Bakanlığı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı bütçelerinin mal ve hizmet alım giderlerine ilişkin tertiplerinde yer alan savunma sektörü, altyapı, inşa, iskân ve tesisleriyle NATO altyapı yatırımlarının gerektirdiği inşa ve tesisler ve bunlara ilişkin kamulaştırmalar ile stratejik hedef planı içinde yer alan alım ve hizmetler, vizeye bağlı olmayıp yılı yatırım programına ek yatırım cetvellerinde yer almaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanuna ekli (III) sayılı cetvelde yer alan idarelerin yatırım nitelikli projelerine, bilgi için yılı yatırım programında yer verilir. Ayrıca, sosyal güvenlik kurumları ve mahallî idarelerin yatırımlarının uygulanması ve izlenmesine ilişkin usul ve esaslar Cumhurbaşkanlığınca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kamu yatırım projelerinin gerçekleşme ve uygulama sonuçları, ilgili kamu idaresi tarafından izleyen yılın Mart ayı sonuna kadar bir rapor halinde Sayıştay Başkanlığına, Cumhurbaşkanlığına ve Hazine ve Maliye Bakanlığına gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Proje maliyeti, Yılı Programının Uygulanması, Koordinasyonu ve İzlenmesine Dair Cumhurbaşkanı Kararında belirlenecek sınırın üzerinde bulunan, afetlerle ilgili olanlar hariç, yeni kamu yatırım projesi teklifleri fayda-maliyet veya maliyet-etkinlik analizleri ile çevresel analizleri içerecek şekilde yapılabilirlik etüdü ile birlikte sunulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Yüklenmeye girişilmesi">
        <mvz-fıkra no="1">
          <template>Yüklenme, usulüne uygun olarak düzenlenmiş sözleşme esaslarına veya kanun veya Cumhurbaşkanlığı kararnamesi hükmüne dayanılarak iş yaptırılması, mal veya hizmet alınması karşılığında geleceğe yönelik bir ödeme yükümlülüğüne girilmesidir. Bütçede yeterli ödeneği bulunmayan işler için yüklenmeye girişilemez. Yüklenme süresi malî yılla sınırlıdır. Harcama yetkilileri, tahsis edilen ödenekler dahilinde yüklenmeye girebilirler. Yüklenmeye girişilen tutara ait ödenekler saklı tutulur; başka iş yaptırılması, mal veya hizmet alınması için kullanılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Ertesi yıla geçen yüklenme">
        <mvz-fıkra no="1">
          <template>Niteliğinden dolayı malî yılla sınırlı tutulamayan ve sürekliliği bulunan aşağıdaki iş ve hizmetler için; her iş itibarıyla, bütçelerinde öngörülen ödeneklerin yüzde ellisini, izleyen yılın Haziran ayını geçmemek ve yüklenme süresi on iki ayı aşmamak üzere, ilgili üst yöneticinin onayıyla ertesi yıla geçen yüklenmelere girişilebilir:</template>
          <mvz-bent no="a">
            <template>Türk Silahlı Kuvvetlerinin yapım, onarım, etüt ve proje işleri, araştırma-geliştirme projeleri, giyecek ve yiyecek alımları, makine-teçhizat, silah-mühimmat-teçhizat alımlarıyla bunların bakım, onarım ve imalat işleri.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yiyecek, yakacak, akaryakıt ve madeni yağ ihtiyaçları.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Temini ve korunması güç olan ilaç, aşı, serum ve tıbbi sarf malzemeleri.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Süreli yayın alımı, taşıma, koruma ve güvenlik, temizlik ve yemek hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Taşıtların malî sorumluluk sigortası ile yurt dışından tedariki yapılan silah, silah-teçhizat ve mühimmat sevkinin her türlü riske karşı sigortalanması amacıyla yaptırılan nakliyat sigortası.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Makine-teçhizat, yol ve otoyol, bilgisayar ve haberleşme sistemlerinin bakım işleri; her türlü onarım işleri ile elektronik bilgi erişim hizmetleri.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Emniyet Genel Müdürlüğü, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığının yapım, onarım, etüt ve proje işleri, araştırma-geliştirme projeleri, yiyecek ve giyecek alımları makine-teçhizat ile silah, mühimmat ve teçhizat alımlarıyla bunların bakım, onarım ve imalat işleri.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Milli İstihbarat Teşkilatı Müsteşarlığının etüt ve proje işleri, araştırma-geliştirme projeleri, makine, silah-mühimmat, teçhizat ve sistem alımlarıyla bunların bakım, onarım ve imalat işleri.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Türkiye İş Kurumu tarafından yürütülen aktif işgücü hizmetleri kapsamında kurs ve programlar,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak (d) bendinde sayılan işler için bütçelerinde ödeneklerin yüzde ellisinin aşılmayacağı hükmü Millî Eğitim Bakanlığı için aranmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="Gelecek yıllara yaygın yüklenmeler">
        <mvz-fıkra no="1">
          <template>Merkezî yönetim kapsamındaki kamu idareleri, bir malî yıl içinde tamamlanması mümkün olmayan yatırım projeleri için gelecek yıllara yaygın yüklenmeye girişebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türk Silahlı Kuvvetleri Stratejik Hedef Planında yer alan projeler için 2.7.1992 tarihli ve 3833 sayılı Kanun çerçevesinde gelecek yıllara yaygın yüklenmelere girişmeye,  Milli Savunma Bakanlığı  yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Emniyet Genel Müdürlüğü, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığının bir mali yıl içinde tamamlanması mümkün olmayan asayiş ve güvenlik hizmetlerine yönelik alımları için gelecek yıllara yaygın yüklenmelere girişmeye İçişleri Bakanlığı yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Dışişleri Bakanlığı, Cumhurbaşkanlığının onayıyla, yabancı ülkelerde dış temsilcilik binası veya arsa satın alınması, bina yaptırılması veya kiralanması için gelecek yıllara yaygın yüklenmelere girişebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yılı bütçesinde ödeneği bulunması ve merkezî yönetim kapsamındaki idareler için Cumhurbaşkanlığının onayıyla; satın alma suretiyle edinilmesi ekonomik olmayan her türlü makine-teçhizat, cihazlar ve taşıtlar ile hava ambulansı ve yangınla mücadele amacıyla hava ve deniz araçlarının kiralanması veya finansal kiralama suretiyle temini; afet ve acil durumlar için kurulan lojistik depoların işletilmesiyle ilgili hizmetleri, yemek (beşinci fıkra kapsamındaki yemek hizmetleri hariç) ve personel taşıma hizmetleri, 16/6/2005 tarihli ve 5369 sayılı Kanuna göre sağlanan sabit ve ankesörlü telefon hizmetleri ile acil yardım çağrıları hizmetleri, internet erişim hizmetleri, deniz haberleşmesi ve seyir güvenliği haberleşme hizmetleri, 5/11/2008 tarihli ve 5809 sayılı Elektronik Haberleşme Kanunu kapsamındaki elektronik haberleşme hizmetleri, elektrik ve doğalgaz alımları, harita, plan, proje, etüt ve müşavirlik hizmetleri, 17/2/2011 tarihli ve 6114 sayılı Kanuna göre yapılan sınav işlemleri ile sınırlı olmak üzere basım, dağıtım, nakil, kamera kaydı ve izlenmesi ile sınav güvenliği ve gizliliği kapsamındaki alımlar, ulusal araştırma geliştirme kurumlarının süreli ve süresiz yayın alımları, orman ağaçlandırma ve amenajman işleri, kit karşılığı cihaz, ilaç, tıbbi cihaz, aşı ve anti-serum alımı için; süresi üç yılı geçmemek, finansal kiralama suretiyle temin edileceklerde ise dört yıl olmak üzere üst yöneticinin onayıyla gelecek yıllara yaygın yüklenmeye girişilebilir.  Bu fıkrada sayılanlar dışında, birden fazla yıla yaygın olması zorunluluğu bulunan veya ekonomik olan diğer mal ve hizmet alımlarını, yüklenme süresi 3 yılı geçmemek üzere belirlemeye ve bu fıkrada belirlenen süreleri beş katına kadar artırmaya Cumhurbaşkanı yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Genel yönetim kapsamındaki kamu idarelerinin, 4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanununun 62 nci maddesinin birinci fıkrasının (e) bendi kapsamında olan işlerden sürekli nitelikte olanlara ilişkin hizmet alımlarında, yüklenme süresi üç yıl olup, işin niteliğinden veya süresinden kaynaklanan zorunlu hâllerde bu süre gerekçesi gösterilmek şartıyla üst yöneticinin onayıyla kısaltılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="Bütçelerden yardım yapılması">
        <mvz-fıkra no="1">
          <template>Gerçek veya tüzel kişilere kanunda veya Cumhurbaşkanlığı kararnamesinde dayanağı olmadan kamu kaynağı kullandırılamaz, yardımda bulunulamaz veya menfaat sağlanamaz. Ancak, genel yönetim kapsamındaki kamu idarelerinin bütçelerinde öngörülmüş olmak kaydıyla; kamu yararı gözetilerek dernek, vakıf, birlik, kurum, kuruluş, sandık ve benzeri teşekküllere yardım yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu yardımların yapılması, kullanılması, izlenmesi, denetlenmesi ve kamuoyuna açıklanmasına ilişkin esas ve usuller Cumhurbaşkanı tarafından çıkarılan yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="Bütçe politikası, gelir ve giderlerin izlenmesi">
        <mvz-fıkra no="1">
          <template>Cumhurbaşkanı, merkezî yönetim bütçe kanununun uygulamasına ilişkin olarak; harcamalarda tasarrufu sağlamak, tutarlı, dengeli ve etkili bir bütçe politikası yürütmek için gelir ve giderlere ilişkin kanun ve diğer mevzuatla belirlenmiş konularda uygulamaları düzenlemek üzere gerekli önlemleri almaya, standartları belirlemeye, sınırlamalar koymaya, kamu istihdam politikasının belirlenmesine ve uygulanmasına yön vermeye, bütçe harcama ve gerçekleşmelerini izlemeye, ödeneklerin dağıtım ve kullanımını belirli esaslara bağlamaya ve bu hususlarda kamu idareleri için uyulması zorunlu düzenlemeleri yapmaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel yönetimin tüm gelir ve giderleri ile borç ve malî imkânlarının tespitinin ve takibinin yapılabilmesi amacıyla, genel yönetim kapsamındaki kamu idareleri ve merkezî yönetim bütçesinden yardım alan kurum, kuruluş, vakıf ve dernekler ile benzeri teşekküller; gelir ve gider tahminlerini, malî tablolarını, birbirleriyle olan borç ve alacak durumlarını, personel giderlerine ilişkin her türlü bilgi ve belgeleri, istenilmesi halinde Cumhurbaşkanlığına vermek zorundadırlar. Bilgi, belge ve hesap durumlarını ibraz etmeyen veya uygun harcama yapmayan kamu idareleri ve diğer kuruluşlarla ilgili olarak gerekli önlemleri almaya Cumhurbaşkanı yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel yönetim kapsamındaki idareler bütçelerinin ilk altı aylık uygulama sonuçları, ikinci altı aya ilişkin beklentiler ve hedefler ile faaliyetlerini; Cumhurbaşkanlığı ise merkezî yönetim bütçe kanununun ilk altı aylık uygulama sonuçları, finansman durumu, ikinci altı aya ilişkin beklentiler ve hedefler ile faaliyetleri kapsayan malî durumu temmuz ayı içinde kamuoyuna açıklar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Harcama Yapılması">
      <mvz-madde no="31" başlık="Harcama yetkisi ve yetkilisi">
        <mvz-fıkra no="1">
          <template>Bütçeyle ödenek tahsis edilen her bir harcama biriminin en üst yöneticisi harcama yetkilisidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, teşkilât yapısı ve personel durumu gibi nedenlerle harcama yetkililerinin belirlenmesinde güçlük bulunan idareler ile bütçelerinde harcama birimleri sınıflandırılmayan idarelerde harcama yetkisi, üst yönetici veya üst yöneticinin belirleyeceği kişiler tarafından; mahallî idarelerde İçişleri veya Çevre ve Şehircilik Bakanlığının, diğer idarelerde ise Hazine ve Maliye Bakanlığının uygun görüşü üzerine yürütülebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kanunların veya Cumhurbaşkanlığı kararnamelerinin verdiği yetkiye istinaden yönetim kurulu, icra komitesi, komisyon ve benzeri kurul veya komite kararıyla yapılan harcamalarda, harcama yetkisinden doğan sorumluluk kurul, komite veya komisyona ait olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yükseköğretim Kurulu ile üniversiteler ve yüksek teknoloji enstitülerinde, harcama yetkilileri ödenek gönderme belgesiyle belirlenir. Bu idarelerde ödenek gönderme belgesi ile ödenek gönderilen birimler harcama birimi, kendisine ödenek gönderilen birimin en üst yöneticisi ise harcama yetkilisidir.  Bütçe ödeneklerinin ilgili birimlere dağılımının planlanması ve kullanılmasına ilişkin usûl ve esaslar Cumhurbaşkanlığı, ödenek gönderme belgesine bağlanmasına ilişkin usul ve esaslar ise Hazine ve Maliye Bakanlığı tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Genel yönetim kapsamındaki kamu idarelerinde; idareler, merkez ve merkez dışı birimler ve görev unvanları itibarıyla harcama yetkililerinin belirlenmesine, harcama yetkisinin bir üst yönetim kademesinde birleştirilmesine ve devredilmesine ilişkin usûl ve esaslar Hazine ve Maliye Bakanlığınca belirlenir. Harcama yetkisinin devredilmesi, yetkiyi devredenin idarî sorumluluğunu ortadan kaldırmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Harcama yetkilileri bütçede öngörülen ödenekleri kadar, ödenek gönderme belgesiyle kendisine ödenek verilen harcama yetkilileri ise tahsis edilen ödenek tutarında harcama yapabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="Harcama talimatı ve sorumluluk">
        <mvz-fıkra no="1">
          <template>Bütçelerden harcama yapılabilmesi, harcama yetkilisinin harcama talimatı vermesiyle mümkündür. Harcama talimatlarında hizmet gerekçesi, yapılacak işin konusu ve tutarı, süresi, kullanılabilir ödeneği, gerçekleştirme usulü ile gerçekleştirmeyle görevli olanlara ilişkin bilgiler yer alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Harcama yetkilileri, harcama talimatlarının bütçe ilke ve esaslarına, kanun ve diğer mevzuata uygun olmasından, ödeneklerin etkili, ekonomik ve verimli kullanılmasından ve bu Kanun çerçevesinde yapmaları gereken diğer işlemlerden sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="33" başlık="Giderin gerçekleştirilmesi">
        <mvz-fıkra no="1">
          <template>Bütçelerden bir giderin yapılabilmesi için iş, mal veya hizmetin belirlenmiş usul ve esaslara uygun olarak alındığının veya gerçekleştirildiğinin, görevlendirilmiş kişi veya komisyonlarca onaylanması ve gerçekleştirme belgelerinin düzenlenmiş olması gerekir.  Giderlerin gerçekleştirilmesi; harcama yetkililerince belirlenen görevli tarafından düzenlenen ödeme emri belgesinin harcama yetkilisince imzalanması ve tutarın hak sahibine ödenmesiyle tamamlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gerçekleştirme görevlileri, harcama talimatı üzerine; işin yaptırılması, mal veya hizmetin alınması, teslim almaya ilişkin işlemlerin yapılması, belgelendirilmesi ve ödeme için gerekli belgelerin hazırlanması görevlerini yürütürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Elektronik ortamda oluşturulan ortak bir veri tabanından yararlanmak suretiyle yapılacak harcamalarda, veri giriş işlemleri gerçekleştirme görevi sayılır. Bu fıkranın uygulanmasına ilişkin esas ve usûller Hazine ve Maliye Bakanlığınca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Gerçekleştirme görevlileri, bu Kanun çerçevesinde yapmaları gereken iş ve işlemlerden sorumludurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kamu borç yönetimine ilişkin olanlar da dahil giderin çeşidine göre aranacak gerçekleştirme belgelerinin şekil ve türleri merkezî yönetim kapsamındaki kamu idareleri için Hazine ve Maliye Bakanlığınca, mahallî idareler için İçişleri veya Çevre ve Şehircilik Bakanlığınca, sosyal güvenlik kurumları için de bağlı veya ilgili oldukları bakanlıklar tarafından, Hazine ve Maliye Bakanlığının uygun görüşü alınmak suretiyle çıkarılacak yönetmeliklerle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="34" başlık="Ödenemeyen giderler ve bütçeleştirilmiş borçlar">
        <mvz-fıkra no="1">
          <template>Ödeme emri belgesine bağlandığı halde ödenemeyen tutarlar, bütçeye gider yazılarak emanet hesaplarına alınır ve buradan ödenir. Ancak, malın alındığı veya hizmetin yapıldığı malî yılı izleyen beşinci yılın sonuna kadar talep edilmeyen emanet hesaplarındaki tutarlar bütçeye gelir kaydedilir. Gelir kaydedilen tutarlar, mahkeme kararı üzerine ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu idarelerinin nakit mevcudunun tüm ödemeleri karşılayamaması halinde giderler, muhasebe kayıtlarına alınma sırasına göre ödenir. Ancak, sırasıyla kanunları gereğince diğer kamu idarelerine ödenmesi gereken vergi, resim, harç, prim, fon kesintisi, pay ve benzeri tutarlara, tarifeye bağlı ödemelere, ilama bağlı borçlara, ödenmemesi halinde gecikme cezası veya faiz gibi ek yük getirecek borçlara ve ödenmesi talep edilen emanet hesaplarındaki tutarlara öncelik verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlgili olduğu malî yılın sonundan başlayarak beş yıl içinde alacaklıları tarafından geçerli bir mazerete dayanmaksızın, yazılı talep edilmediğinden veya belgeleri verilmediğinden dolayı ödenemeyen borçlar zamanaşımına uğrayarak kamu idareleri lehine düşer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Genel bütçe kapsamındaki kamu idarelerinde, bir taahhüde ve harcama talimatına dayanmayan giderlere ilişkin olup, Cumhurbaşkanlığı tarafından belirlenecek ekonomik kodlardan yapılan ve bütçede ödeneği öngörülmüş olmakla birlikte, oluştuğu yer ve zamanda ödeneği bulunmayan giderler; dayanağını oluşturan harcama belgeleri de eklenmek suretiyle usûlüne göre gerçekleştirilerek ilgili hesaplara alınır ve ödeneğinin gelmesini müteakip ödenir. Bu tutarlara ilişkin ödenek gönderme belgeleri, en geç malî yılın sonuna kadar muhasebe birimine gönderilerek muhasebeleştirme işlemleri tamamlanır. Bu fıkranın uygulanmasına ilişkin usûl ve esaslar Hazine ve Maliye Bakanlığınca belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35" başlık="Ön ödeme">
        <mvz-fıkra no="1">
          <template>Harcama yetkilisinin uygun görmesi ve karşılığı ödeneğin saklı tutulması kaydıyla, ilgili kanunlarda öngörülen haller ile gerçekleştirme işlemlerinin tamamlanması beklenilemeyecek ivedi veya zorunlu giderler için avans vermek veya kredi açmak suretiyle ön ödeme yapılabilir. Verilecek avansın üst sınırları merkezî yönetim bütçe kanununda gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sözleşmesinde belirtilmek ve yüklenme tutarının yüzde otuzunu geçmemek üzere, yüklenicilere, teminat karşılığında bütçe dışı avans ödenebilir. İlgili kanunların veya Cumhurbaşkanlığı kararnamelerinin bütçe dışı avans ödenmesine ilişkin hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Açılmış akreditiflere ilişkin kredi artıkları ertesi yıla devredilmekle birlikte ödenekleri iptal olunur. Devredilen kredi artıklarının karşılığı, genel bütçe kapsamındaki kamu idarelerinde Cumhurbaşkanı, diğer kamu idarelerinde ise üst yönetici tarafından idare bütçesinin ilgili tertibine ödenek kaydolunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sözleşmelerin bitim tarihlerinde henüz bir kısım hizmet yerine getirilememiş veya zorunlu nedenlerle sözleşmenin uygulanmasına başlanılamamış ancak, ilgili idarece ek süre verilmiş ve bu süre ertesi malî yıla taşmış ise; yıl sonunda yüklenme artığı devredilir ve bu tutarlara ilişkin ödenekler hakkında akreditiflerle ilgili hükümler uygulanır. Devredilen yüklenme artığı karşılığı hizmet ek süre içinde yerine getirilerek kanıtlayıcı belgeleri verildiğinde, tutarı hizmetin yapıldığı yıl bütçesine gider kaydıyla ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Her mutemet ön ödemelerden harcadığı tutara ilişkin kanıtlayıcı belgeleri, ilgili kanunlarında belirtilmemiş olması halinde avanslarda bir ay, kredilerde üç ay içinde muhasebe yetkilisine vermek ve artan tutarı iade etmekle yükümlüdür. Süresi içerisinde mahsup edilmeyen avanslar hakkında 21.7.1953 tarihli ve 6183 sayılı Kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Merkezî yönetim kapsamındaki kamu idarelerinde ön ödeme şekilleri, devir ve mahsup işlemleri, yapılacak ön ödemelerin idareler ve gider türleri itibarıyla miktarı ve oranlarının belirlenmesi, zorunlu hallerde yapılacak harcamalar için ön ödemenin tutarı ve mahsup süresi, mutemetlerin görevlendirilmesi ve diğer işlemlere ilişkin usul ve esaslar Cumhurbaşkanı tarafından çıkarılan yönetmelikle düzenlenir. Diğer kamu idarelerinde ön ödemeye ilişkin usul ve esaslar bu madde hükümleri dikkate alınmak suretiyle ilgili mevzuatlarında düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>2.7.1992 tarihli ve 3833 sayılı Kanunun avans ve kredi işlemlerine ilişkin hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Emniyet Genel Müdürlüğü, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığının bir mali yıl içinde tamamlanması mümkün olmayan asayiş ve güvenlik hizmetlerine yönelik alımlarının avans ve kredi işlemlerine ilişkin usuller İçişleri Bakanlığınca çıkarılan yönetmelik ile düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Gelirlerin Toplanması">
      <mvz-madde no="36" başlık="Gelir politikası ve ilkeleri">
        <mvz-fıkra no="1">
          <template>Gelirlerin toplanmasında aşağıdaki ilkelere uyulur:</template>
          <mvz-bent no="a">
            <template>Gelir politikaları ve uygulamaları konusunda ilkeler, amaçlar, stratejiler ve taahhütler her malî yıl başında kamuoyuna duyurulur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Mükellef ve sorumlulara vergi, resim, harç ve benzeri malî yükümlülüklerini kolayca yerine getirebilmeleri için gerekli hizmetler sağlanır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Mükellef ve sorumluların vergiye uyumu teşvik edilir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Hakların korunması ve yükümlülükler konusunda mükelleflerin bilgilendirilmesi için ilgili idareler tarafından gerekli önlemler alınır.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="Gelirlerin dayanakları">
        <mvz-fıkra no="1">
          <template>Vergi, resim, harç ve benzeri malî yükümlülükler kanunla konulur, değiştirilir veya kaldırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel yönetim kapsamındaki kamu idarelerinin gelirlerinin kanuni dayanakları bütçelerinde gösterilir. Bütçelerde yer alan gelirler, ilgili kanunlarında belirtilen usullere göre tarh, tahakkuk ve tahsil edilir. Genel bütçe gelirlerinin tarh, tahakkuk ve tahsili Hazine ve Maliye Bakanlığı veya tarh ve tahakkuka ilgili mevzuatına göre yetkili idareler tarafından yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel yönetim kapsamındaki kamu idarelerinin topladığı vergi, resim, harç ve benzeri gelirlerden diğer idare, kurum ve kuruluşlara verilecek paylar, geliri toplayan kamu idaresi bütçesine bu amaçla konulacak ödeneklerden karşılanır. Malî yıl içinde kullanılabilecek ödenek miktarı, ilgili kanun hükümleri uyarınca tahsil edilen miktar dikkate alınarak hesaplanacak pay miktarını geçemez. Hesaplanan pay tutarının, bu amaçla tahsis edilen ödenek tutarını aşması halinde, aradaki farkı geçmemek kaydıyla ödenek eklemesi yapmaya genel bütçe kapsamındaki idarelerde Hazine ve Maliye Bakanı, diğer idarelerde üst yöneticiler yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Tahsili zamanaşımına uğrayan gelirlerin silinmesine ilişkin usul ve esaslar, ilgili kanunlardaki hükümler saklı kalmak üzere, Hazine ve Maliye Bakanlığınca belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="Gelirlerin toplanması sorumluluğu">
        <mvz-fıkra no="1">
          <template>Kamu gelirlerinin tarh, tahakkuk, tahsiliyle yetkili ve görevli olanlar, ilgili kanunlarda öngörülen tarh, tahakkuk ve tahsil işlemlerinin zamanında ve eksiksiz olarak yapılmasından sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="Özel gelirler">
        <mvz-fıkra no="1">
          <template>Özel gelirler karşılığında idarelere tahsis edilen özel ödenek miktarları, ilgili idarelerin bütçelerinde gösterilir. Malî yıl içinde kullanılabilecek özel ödenek miktarı, tahsil edilen özel gelir tutarını geçemez. Tahsil edilen özel gelirlerin ödenek tutarını aşması halinde, ödenek eklenemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Özel gelirlere ilişkin olarak ilgili kanunlarında veya Cumhurbaşkanlığı kararnamelerinde belirtilen fiyatlandırılabilir mal ve hizmetlerin tarifeleri ile uygulamaya yönelik usul ve esaslar, Hazine ve Maliye Bakanlığının görüşü alınarak ilgili kamu idarelerince belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Özel gelirlerin ödenek kaydına, gelecek yıla devrine, iptaline ilişkin yetki ve işlemler merkezî yönetim bütçe kanununda gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="40" başlık="Bağış ve yardımlar">
        <mvz-fıkra no="1">
          <template>Herhangi bir gerçek veya tüzel kişi tarafından, kamu hizmetinin karşılığı olarak veya kamu hizmetleriyle ilişkilendirilerek bağış veya yardım toplanamaz, benzeri adlar altında tahsilat yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu idarelerine yapılan her türlü bağış ve yardımlar  gelir kaydedilir. Nakdi olmayan bağış ve yardımlar, ilgili mevzuatına göre değerlemeye tâbi tutularak kayıtlara alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu yararına kullanılmak üzere kamu idarelerine yapılan şartlı bağış ve yardımlar, dış finansman kaynağından sağlananlarda 28.3.2002 tarihli ve 4749 sayılı Kanun hükümleri saklı kalmak kaydıyla, hizmeti yapacak idarenin üst yöneticisi tarafından uygun görülmesi halinde, bütçede açılacak bir tertibe gelir ve şart kılındığı amaca harcanmak üzere açılacak bir tertibe ödenek kaydedilir. Bu ödenekten amaç dışında başka bir tertibe aktarma yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu ödeneklerden malî yıl sonuna kadar harcanmamış olan tutarlar, bağış ve yardımın amacı gerçekleşinceye kadar ertesi yıl bütçesine devir olunarak ödenek kaydedilir. Ancak, bu ödeneklerden tahsis amacı gerçekleştirilmiş olanlardan kalan tutarlar, tahsis amacının gerçekleştirilmesi bakımından yetersiz olanlar ile yılı bütçesinde belirlenen tutarı aşmayan ve iki yıl devrettiği halde harcanmayan ödenekleri iptal etmeye genel bütçe kapsamındaki kamu idarelerinde Cumhurbaşkanı, diğer kamu idarelerinde üst yönetici yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bağış ve yardımlar, kullanılmadığı veya amaç dışı kullanıldığı için geri istenildiği takdirde, bütçeye gider kaydıyla ilgilisine geri verilir. Şartlı bağış ve yardımın zamanında kullanılmaması nedeniyle doğacak zararlar ile amaç dışı kullanım nedeniyle yapılan harcamalar sorumluluğu tespit edilenlere ödettirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="6-ALTINCI" başlık="Faaliyet Raporları ve Kesin Hesap">
      <mvz-madde no="41" başlık="Faaliyet raporları">
        <mvz-fıkra no="1">
          <template>Üst yöneticiler ve bütçeyle ödenek tahsis edilen harcama yetkililerince, hesap verme sorumluluğu çerçevesinde, her yıl faaliyet raporu hazırlanır. Üst yönetici, harcama yetkilileri tarafından hazırlanan birim faaliyet raporlarını esas alarak, idaresinin faaliyet sonuçlarını gösteren idare faaliyet raporunu düzenleyerek kamuoyuna açıklar. Merkezî yönetim kapsamındaki kamu idareleri ve sosyal güvenlik kurumları, idare faaliyet raporlarının birer örneğini Sayıştaya ve Cumhurbaşkanlığına gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahallî idarelerce hazırlanan idare faaliyet raporlarının birer örneği Sayıştay ve Çevre ve Şehircilik Bakanlığına gönderilir. Çevre ve Şehircilik Bakanlığı, bu raporları esas alarak kendi değerlendirmelerini de içeren mahallî idareler genel faaliyet raporunu hazırlar ve kamuoyuna açıklar. Raporun birer örneği Sayıştaya ve Cumhurbaşkanlığına gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Merkezî yönetim kapsamındaki idareler ile sosyal güvenlik kurumlarının bir malî yıldaki faaliyet sonuçları, Cumhurbaşkanlığı tarafından hazırlanacak genel faaliyet raporunda gösterilir. Bu raporda, mahallî idarelerin malî yapılarına ilişkin genel değerlendirmelere de yer verilir. Cumhurbaşkanlığı, genel faaliyet raporunu kamuoyuna açıklar ve bir örneğini Sayıştaya gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sayıştay, mahallî idarelerin raporları hariç idare faaliyet raporlarını, mahallî idareler genel faaliyet raporunu ve genel faaliyet raporunu, dış denetim sonuçlarını dikkate alarak görüşlerini de belirtmek suretiyle Türkiye Büyük Millet Meclisine sunar. Türkiye Büyük Millet Meclisi bu raporlar ve değerlendirmeler çerçevesinde, kamu kaynağının elde edilmesi ve kullanılmasına ilişkin olarak kamu idarelerinin yönetim ve hesap verme sorumluluklarını görüşür. Bu görüşmelere üst yönetici veya görevlendireceği yardımcısının ilgili bakanla birlikte katılması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İdare faaliyet raporu, ilgili idare hakkındaki genel bilgilerle birlikte; kullanılan kaynakları, bütçe hedef ve gerçekleşmeleri ile meydana gelen sapmaların nedenlerini, varlık ve yükümlülükleri ile yardım yapılan birlik, kurum ve kuruluşların faaliyetlerine ilişkin bilgileri de kapsayan malî bilgileri; stratejik plan ve performans programı uyarınca yürütülen faaliyetleri ve performans bilgilerini içerecek şekilde düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu raporlarda yer alacak hususlar, raporların hazırlanması, ilgili idarelere verilmesi, kamuoyuna açıklanması ve bu işlemlere ilişkin süreler ile diğer usûl ve esaslar,  Sayıştayın görüşü alınarak Cumhurbaşkanı tarafından çıkarılacak yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="42" başlık="Kesin hesap kanunu">
        <mvz-fıkra no="1">
          <template>Türkiye Büyük Millet Meclisi, merkezî yönetim bütçe kanununun uygulama sonuçlarını onama yetkisini kesin hesap kanunuyla kullanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kesin hesap kanunu teklifi, muhasebe kayıtları dikkate alınarak, merkezî yönetim bütçe kanununun şekline uygun olarak Hazine ve Maliye Bakanlığınca hazırlanır. Bu teklif, bir yıllık uygulama sonuçlarını karşılaştırmalı olarak gösteren değerlendirmeleri içeren gerekçesiyle birlikte izleyen malî yılın Haziran ayı sonuna kadar Cumhurbaşkanı tarafından Türkiye Büyük Millet Meclisine sunulur ve bir örneği Sayıştaya gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kesin hesap kanun teklifinin ekinde;</template>
          <mvz-bent no="a">
            <template>Genel mizan,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bütçe gelirleri kesin hesap cetveli ve açıklaması,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bütçe giderleri kesin hesap cetvelleri ve açıklaması,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Bütçe gelir ve giderlerinin iller ve idareler itibarıyla dağılımı,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Devlet borçları ve Hazine garantilerine ilişkin cetveller,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Yılı içerisinde silinen kamu alacakları cetveli,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Mal yönetim hesabı icmal cetvelleri,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Hazine ve Maliye Bakanlığı tarafından gerekli görülen diğer belgeler,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>yer alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Merkezî yönetim kapsamındaki kamu idareleri bütçelerinin kesin hesabının düzenlenmesine ilişkin usul ve esaslar Hazine ve Maliye Bakanlığınca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İdarelerin faaliyet raporları, genel faaliyet raporu, dış denetim genel değerlendirme raporu ve kesin hesap kanunu teklifi ile merkezî yönetim bütçe kanunu teklifi birlikte görüşülür. Ancak, bu raporlar ile genel uygunluk bildirimi Türkiye Büyük Millet Meclisi komisyonlarında öncelikle görüşülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Mahallî idare bütçeleri ile sosyal güvenlik kurumları bütçelerinin uygulama sonuçlarının kesin hesaba bağlanması, ilgili kanunlarındaki hükümlere göre yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="43" başlık="Genel uygunluk bildirimi">
        <mvz-fıkra no="1">
          <template>Sayıştay, merkezî yönetim kapsamındaki kamu idareleri için düzenleyeceği genel uygunluk bildirimini, kesin hesap kanun teklifinin verilmesinden başlayarak en geç yetmiş beş gün içinde Türkiye Büyük Millet Meclisine sunar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel uygunluk bildirimi; dış denetim raporları, idare faaliyet raporları ve genel faaliyet raporu dikkate alınarak hazırlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kesin hesap kanunu teklifi ve genel uygunluk bildiriminin Türkiye Büyük Millet Meclisine verilmiş olması, ilgili yıla ait Sayıştayca sonuçlandırılmamış denetimleri önlemez ve hesapların kesin hükme bağlandığı anlamına gelmez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Taşınır ve Taşınmazlar">
    <mvz-madde no="44" başlık="Taşınır ve taşınmaz işlemleri">
      <mvz-fıkra no="1">
        <template>Genel yönetim kapsamındaki kamu idarelerince, taşınır ve taşınmaz edinilmesi, yönetilmesi, trampası, elden çıkarılması, ecrimisilin tahsil ve takibinde izlenecek yöntem, Devletin hüküm ve tasarrufu altındaki yerlerin yönetimi ve korunması, işgalli malların tahliyesi gibi hususlar ilgili kanunlarında düzenlenir.  Bu malların kaydı ile taşınırların muhafazası, kullanımı, mal yönetim hesabının verilmesi ve mal yönetim sorumlularıyla bunlar adına görev yapacak olanların belirlenmesine ilişkin usûl ve esaslar, Cumhurbaşkanı tarafından çıkarılan yönetmeliklerle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı, Sahil Güvenlik Komutanlığı ile Millî İstihbarat Teşkilatı ve Emniyet Genel Müdürlüğünün  taşınırlarının kayda alınması ile bunların yönetim ve iç denetimine ilişkin usûl ve esaslar Cumhurbaşkanı tarafından çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="45" başlık="Taşınır ve taşınmaz edinme">
      <mvz-fıkra no="1">
        <template>Genel yönetim kapsamındaki kamu idareleri, kamu hizmetlerinin zorunlu kıldığı durumlarda gereken nicelikte ve nitelikte taşınır ve taşınmazları, yurt içinde veya yurt dışında, bedellerini peşin veya taksitle ödeyerek veya finansal kiralama suretiyle edinebilirler. Kamu idareleri, taşınmaz satın alma veya kamulaştırma işlemlerini yetki devri yoluyla bir başka kamu idaresi eliyle yürütebilir. Genel bütçe kapsamındaki kamu idarelerinin edindiği taşınmazlar Hazine adına, diğer kamu idarelerine ait taşınmazlar ise tüzel kişilikleri adına tapu sicilinde tescil olunur. Hazine adına tescil edilen taşınmazlar Çevre ve Şehircilik Bakanlığı tarafından yönetilir. Bu tescil işlemleri, adına tescil yapılan idarenin taşınmazın bulunduğu yerdeki ilgili birimine bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu idarelerince üretilen malların kendi tüketimlerinde kullanılması halinde bunların bedelleri, rayiç bedel üzerinden ilgili ödenek tertibine gider ve karşılığı gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kamu idareleri, ihtiyaç fazlası taşınırları ile görmekle yükümlü olduğu kamu hizmetlerinde kullanılacağına ve amacına uygun kullanılmaması halinde geri alınacağına dair tapu kütüğüne şerh konulması kaydıyla taşınmazlarını diğer kamu idarelerine bedelsiz olarak devredebilir. Devredilmeyecek taşınır ve taşınmazlar ile devir ve kayıt işlemlerine ilişkin usul ve esaslar Çevre ve Şehircilik Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kamu idareleri arasındaki taşınmazların mülkiyetine ilişkin uyuşmazlıklar, görevli mahkemelerce çözümlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="46" başlık="Taşınır ve taşınmaz satışı">
      <mvz-fıkra no="1">
