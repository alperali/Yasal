        <template>Genel bütçe kapsamındaki kamu idarelerinin her türlü taşınır ve taşınmazlarının satışına Çevre ve Şehircilik Bakanlığı yetkilidir. Satış bedelleri genel bütçeye gelir kaydedilir. Diğer kamu idarelerine ait taşınır ve taşınmazların elden çıkarılması kanunlarında ve Cumhurbaşkanlığı kararnamelerinde belirtilen yetkili organlarının kararıyla mümkündür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Merkezî yönetim kapsamındaki kamu idarelerinin taşınmazlarından değeri her yıl merkezî yönetim bütçe kanununda belirtilen sınırın üzerinde olanlar, Cumhurbaşkanı kararıyla satılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="47" başlık="Taşınmaz tahsisi">
      <mvz-fıkra no="1">
        <template>Kamu idareleri, kanunlarında veya Cumhurbaşkanlığı kararnamelerinde belirtilen kamu hizmetlerini yerine getirebilmek için mülkiyetlerindeki taşınmazlarla Devletin hüküm ve tasarrufu altındaki yerleri, birbirlerine ve köy tüzel kişiliklerine bedelsiz olarak tahsis edebilirler. Tahsis edilen taşınmaz, amaç dışı kullanılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hazinenin özel mülkiyetindeki taşınmazlarla Devletin hüküm ve tasarrufu altındaki yerleri tahsis etmeye, kamu ihtiyaçları için gerekli olmayanların tahsisini kaldırmaya Çevre ve Şehircilik Bakanlığı; diğer taşınmazları tahsis etmeye ve tahsisini kaldırmaya ise maliki kamu idaresi yetkilidir. Bu maddenin uygulanmasına ilişkin esas ve usûller Çevre ve Şehircilik Bakanlığınca çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kanunlardaki özel hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="48" başlık="Mal yönetiminde etkililik ve sorumluluk">
      <mvz-fıkra no="1">
        <template>Kamu idareleri, taşınırların yönetimi, kaydı, muhafazası ve kullanımından sorumludurlar. Taşınırların özelliğinden veya olağan kullanımından kaynaklanan yıpranma ile usulüne uygun olarak belirlenen firelerden dolayı sorumluluk aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kullanılmak üzere taşınır teslim edilen görevliler, taşınırın korunmasından ve taşınıra verilen zararlardan sorumludur. Kamu idareleri, verilen zararların sorumlularına ödettirilmesini sağlamakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kamu idarelerine ait malları edinme, kiralama, tahsis, yönetim, kullanma ve elden çıkarma işlemleri, mevzuatında öngörülen kurallar dahilinde hizmetin amacına uygun olarak verimlilik ve tutumluluk ilkesine göre yapılır. Bu ilkeye aykırı eylem ve işlemlerden doğacak zararlardan, malların yönetimi veya kullanılması hususunda yetki verilenler sorumludur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Kamu Hesapları ve Malî İstatistikler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Kamu Hesapları">
      <mvz-madde no="49" başlık="Muhasebe sistemi">
        <mvz-fıkra no="1">
          <template>Muhasebe sistemi; karar, kontrol ve hesap verme süreçlerinin etkili çalışmasını sağlayacak ve malî raporların düzenlenmesi ile kesin hesabın çıkarılmasına temel olacak şekilde kurulur ve yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu hesapları, kamu idarelerinin gelir, gider ve varlıkları ile malî sonuç doğuran ve öz kaynağın artmasına veya azalmasına neden olan her türlü işlemlerle garantilerin ve yükümlülüklerin belirlenmiş bir düzen içinde hesaplara kaydedilerek, yönetim ve denetim yetkilileriyle kamuoyuna gerekli bilgilerin sağlanması amacıyla tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel yönetim kapsamındaki kamu idarelerinde uygulanacak muhasebe ve raporlama standartları, uluslararası standartlara uygun olarak Hazine ve Maliye Bakanlığı bünyesinde; Sayıştay Başkanlığı, Hazine ve Maliye Bakanlığı ve diğer ilgili kuruluş temsilcilerinin katılımıyla oluşturulacak olan Devlet Muhasebesi Standartları Kurulu tarafından belirlenir. Bu standartlar Resmî Gazetede yayımlanır. Kurulun yapısı, çalışma usûl ve esasları ile diğer hususlar Maliye Bakanlığınca çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kurulda görevlendirilenlerin aslî görevleri devam eder. Başkan ve üyelere, ayda ikiden fazla olmamak üzere her toplantı günü için  gösterge rakamının memur aylık katsayısıyla çarpımı sonucu bulunacak tutar üzerinden toplantı ücreti ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Genel yönetim kapsamındaki kamu idarelerince uygulanacak çerçeve hesap planı ile düzenlenecek raporların şekil, süre ve türlerine ilişkin hususlar, Kurul tarafından belirlenen muhasebe ve raporlama standartları çerçevesinde, Cumhurbaşkanı tarafından çıkarılan yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Muhasebe işlemlerine, hesap planlarına ve işlemlerin muhasebeleştirilmesinde kullanılacak belgelerin şekil ve türlerine ilişkin düzenleme, beşinci fıkrada belirtilen yönetmeliğe uygun olarak, ilgili idarelerin görüşü alınmak suretiyle merkezî yönetim kapsamındaki kamu idareleri için Hazine ve Maliye Bakanlığınca; sosyal güvenlik kurumları için ilgili idarelerce, mahallî idareler için ise İçişleri ile Çevre ve Şehircilik bakanlıklarınca Hazine ve Maliye Bakanlığının uygun görüşü alınmak suretiyle hazırlanır. Genel yönetim kapsamındaki kamu idarelerinin detaylı hesap planlarına ilişkin hususlar Hazine ve Maliye Bakanlığınca belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="50" başlık="Kayıt zamanı">
        <mvz-fıkra no="1">
          <template>Bir ekonomik değer yaratıldığında, başka bir şekle dönüştürüldüğünde, mübadeleye konu edildiğinde, el değiştirdiğinde veya yok olduğunda muhasebeleştirilir. Bütün malî işlemlerin muhasebeleştirilmesi ve her muhasebe kaydının belgeye dayanması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="51" başlık="Kamu gelir ve giderlerinin yılı ve mahsup dönemi">
        <mvz-fıkra no="1">
          <template>Kamu gelir ve giderleri tahakkuk ettirildikleri malî yılın hesaplarında gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tahakkuk ettirilecek giderler Devlet muhasebesi kayıtlarında ekonomik sınıflandırmanın dördüncü düzeyini de kapsayacak şekilde gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bütçe gelirleri tahsil edildiği, bütçe giderleri ise ödendiği yılda muhasebeleştirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kamu hesapları malî yıl esasına göre tutulur. Malî yılın bitimine kadar fiilen yapılmış olan ödemelerden mahsup edilememiş olanların, ödenekleri saklı tutulmak suretiyle, mahsup işlemleri malî yılın bitimini izleyen bir ay içinde yapılabilir. Zorunlu hallerde bu süre, Hazine ve Maliye Bakanlığı tarafından bütçe giderleri için bir ay, diğer işlemlerde iki ayı geçmemek üzere uzatılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Malî İstatistikler">
      <mvz-madde no="52" başlık="Kapsam, temel ilkeler ve kurumsal çevre">
        <mvz-fıkra no="1">
          <template>Malî istatistikler, genel yönetim kapsamındaki kamu idarelerinin malî işlemlerini kapsar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Malî istatistikler, uluslararası standartlara uygun olarak bütünlük, güvenilirlik, kullanışlılık, yöntemsel geçerlilik ve ulaşılabilirlik ilkeleri çerçevesinde; yeterli mesleki eğitimi almış personel tarafından muhasebe kayıtlarındaki verilere dayanılarak ve istatistiksel yöntemler kullanılarak hazırlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Malî istatistiklerin hazırlanmasında kamu idarelerinin yöneticileri uygun kurumsal çevrenin oluşturulması için gerekli önlemleri alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunda yer alan genel yönetim kapsamındaki kamu idareleri tanımına bağlı kalmaksızın; mali istatistiklerin derlenmesi amacıyla, uluslararası sınıflandırmalara uygun olarak,  Türkiye Cumhuriyet Merkez Bankası ve Türkiye İstatistik Kurumunun da görüşünü almak suretiyle, ayrıca genel yönetim sektörü adıyla bir kapsam belirlemeye ve bu kapsamdaki kamu idarelerinin mali verilerini almaya Hazine ve Maliye Bakanlığı yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="53" başlık="Malî istatistiklerin hazırlanması ve açıklanması">
        <mvz-fıkra no="1">
          <template>Genel yönetim kapsamındaki kamu idarelerine ait malî istatistikler, Hazine ve Maliye Bakanlığınca derlenir. Merkezî yönetim kapsamı dışındaki kamu idareleri malî istatistiklerini belirlenmiş ilkelere uygun olarak hazırlar ve belirlenen süreler içinde Hazine ve Maliye Bakanlığına gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Merkezî yönetim kapsamındaki kamu idarelerine ait malî istatistikler, Hazine ve Maliye Bakanlığınca aylık olarak yayımlanır. Sosyal güvenlik kurumları ve mahallî idarelere ait malî istatistikler ile merkezî yönetim kapsamındaki kamu idarelerine ait malî istatistikler Hazine ve Maliye Bakanlığınca birleştirilerek, genel yönetim kapsamındaki kamu idarelerine ait malî istatistikler elde edilir ve üçer aylık dönemler itibarıyla yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Malî istatistiklerin anlaşılabilir ve kullanıcılar için kolayca ulaşılabilir olması esastır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>52 nci maddenin son fıkrasına göre belirlenen kamu idarelerinden, mali istatistiklerine esas verilerini süresinde göndermeyenlere Hazine ve Maliye Bakanlığınca bir ay ek süre verilir. Ek süre sonunda da verilerin gönderilmemesi halinde, Hazine ve Maliye Bakanlığının talebi üzerine, ilgili kamu idaresinin üst yöneticileri tarafından mali hizmetler birimi yöneticisi ile muhasebe yetkilisine, her türlü aylık, ödenek, zam ve tazminat dâhil yapılan bir aylık net ödemeler toplamı tutarında idari para cezası verilir. İdari para cezası uygulanmış olması bilgi verme yükümlülüğünü ortadan kaldırmaz. İdari para cezaları, bu Kanunun 73 üncü maddesi hükümlerine göre tahsil edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="54" başlık="Malî istatistiklerin değerlendirilmesi">
        <mvz-fıkra no="1">
          <template>Bir yıla ait malî istatistikler izleyen yılın Mart ayı içinde; hazırlanma, yayımlanma, doğruluk, güvenilirlik ve önceden belirlenmiş standartlara uygunluk bakımından Sayıştay tarafından değerlendirilir ve bu amaçla düzenlenen değerlendirme raporu Türkiye Büyük Millet Meclisine ve Hazine ve Maliye Bakanlığına gönderilir. Bu raporda yer alan değerlendirmelere ilişkin olarak Hazine ve Maliye Bakanı gerekli önlemleri alır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="İç Kontrol Sistemi">
    <mvz-madde no="55" başlık="İç kontrolün tanımı">
      <mvz-fıkra no="1">
        <template>İç kontrol; idarenin amaçlarına, belirlenmiş politikalara ve mevzuata uygun olarak faaliyetlerin etkili, ekonomik ve verimli bir şekilde yürütülmesini, varlık ve kaynakların korunmasını, muhasebe kayıtlarının doğru ve tam olarak tutulmasını, malî bilgi ve yönetim bilgisinin zamanında ve güvenilir olarak üretilmesini sağlamak üzere idare tarafından oluşturulan organizasyon, yöntem ve süreçle iç denetimi kapsayan malî ve diğer kontroller bütünüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Görev ve yetkileri çerçevesinde, malî yönetim ve kontrol süreçlerine ilişkin standartlar ve yöntemler Hazine ve Maliye Bakanlığınca, iç denetime ilişkin standartlar ve yöntemler ise İç Denetim Koordinasyon Kurulu tarafından belirlenir, geliştirilir ve uyumlaştırılır. Bunlar ayrıca, sistemlerin koordinasyonunu sağlar ve kamu idarelerine rehberlik hizmeti verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="56" başlık="İç kontrolün amacı">
      <mvz-fıkra no="1">
        <template>İç kontrolün amacı;</template>
        <mvz-bent no="a">
          <template>Kamu gelir, gider, varlık ve yükümlülüklerinin etkili, ekonomik ve verimli bir şekilde yönetilmesini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu idarelerinin kanunlara ve diğer düzenlemelere uygun olarak faaliyet göstermesini,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Her türlü malî karar ve işlemlerde usulsüzlük ve yolsuzluğun önlenmesini,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Karar oluşturmak ve izlemek için düzenli, zamanında ve güvenilir rapor ve bilgi edinilmesini,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Varlıkların kötüye kullanılması ve israfını önlemek ve kayıplara karşı korunmasını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>sağlamaktır.</template>
      </mvz-fıkra>

    <mvz-madde no="57" başlık="Kontrolün yapısı ve işleyişi">
      <mvz-fıkra no="1">
        <template>Kamu idarelerinin malî yönetim ve kontrol sistemleri; harcama birimleri, muhasebe ve malî hizmetler ile ön malî kontrol ve iç denetimden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yeterli ve etkili bir kontrol sisteminin oluşturulabilmesi için; mesleki değerlere ve dürüst yönetim anlayışına sahip olunması, malî yetki ve sorumlulukların bilgili ve yeterli yöneticilerle personele verilmesi, belirlenmiş standartlara uyulmasının sağlanması, mevzuata aykırı faaliyetlerin önlenmesi ve kapsamlı bir yönetim anlayışı ile uygun bir çalışma ortamının ve saydamlığın sağlanması bakımından ilgili idarelerin üst yöneticileri ile diğer yöneticileri tarafından görev, yetki ve sorumluluklar göz önünde bulundurulmak suretiyle gerekli önlemler alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3" durum="mülga">
        <template></template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="58" başlık="Ön malî kontrol">
      <mvz-fıkra no="1">
        <template>Ön malî kontrol, harcama birimlerinde işlemlerin gerçekleştirilmesi aşamasında yapılan kontroller ile malî hizmetler birimi tarafından yapılan kontrolleri kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ön malî kontrol süreci, malî karar ve işlemlerin hazırlanması, yüklenmeye girişilmesi, iş ve işlemlerin gerçekleştirilmesi ve belgelendirilmesinden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kamu idarelerinde ön malî kontrol görevi, yönetim sorumluluğu çerçevesinde yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Harcama birimlerinde işlemlerin gerçekleştirilmesi aşamasında yapılacak asgarî kontroller, malî hizmetler birimi tarafından ön malî kontrole tâbi tutulacak malî karar ve işlemlerin usûl ve esasları ile ön malî kontrole ilişkin standart ve yöntemler Hazine ve Maliye Bakanlığınca belirlenir. Kamu idareleri, bu standart ve yöntemlere aykırı olmamak şartıyla bu konuda düzenleme yapabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="59" başlık="Malî kontrol yetkilisinin nitelikleri ve atanması" durum="mülga">
    </mvz-madde>
    <mvz-madde no="60" başlık="Malî hizmetler birimi">
      <mvz-fıkra no="1">
        <template>Kamu idarelerinde aşağıda sayılan görevler, malî hizmetler birimi tarafından yürütülür:</template>
        <mvz-bent no="a">
          <template>İdarenin stratejik plan ve performans programının hazırlanmasını koordine etmek ve sonuçlarının konsolide edilmesi çalışmalarını yürütmek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İzleyen iki yılın bütçe tahminlerini de içeren idare bütçesini, stratejik plan ve yıllık performans programına uygun olarak hazırlamak ve idare faaliyetlerinin bunlara uygunluğunu izlemek ve değerlendirmek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Mevzuatı uyarınca belirlenecek bütçe ilke ve esasları çerçevesinde, ayrıntılı harcama programı hazırlamak ve hizmet gereksinimleri dikkate alınarak ödeneğin ilgili birimlere gönderilmesini sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bütçe kayıtlarını tutmak, bütçe uygulama sonuçlarına ilişkin verileri toplamak, değerlendirmek ve bütçe kesin hesabı ile malî istatistikleri hazırlamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İlgili mevzuatı çerçevesinde idare gelirlerini tahakkuk ettirmek, gelir ve alacaklarının takip ve tahsil işlemlerini yürütmek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Genel bütçe kapsamı dışında kalan idarelerde muhasebe hizmetlerini yürütmek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Harcama birimleri tarafından hazırlanan birim faaliyet raporlarını da esas alarak idarenin faaliyet raporunu hazırlamak.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>İdarenin mülkiyetinde veya kullanımında bulunan taşınır ve taşınmazlara ilişkin icmal cetvellerini düzenlemek.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>İdarenin yatırım programının hazırlanmasını koordine etmek, uygulama sonuçlarını izlemek ve yıllık yatırım değerlendirme raporunu hazırlamak.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>İdarenin, diğer idareler nezdinde takibi gereken malî iş ve işlemlerini yürütmek ve sonuçlandırmak.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Malî kanunlarla ilgili diğer mevzuatın uygulanması konusunda üst yöneticiye ve harcama yetkililerine gerekli bilgileri sağlamak ve danışmanlık yapmak.</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Ön malî kontrol faaliyetini yürütmek.</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>İç kontrol sisteminin kurulması, standartlarının uygulanması ve geliştirilmesi konularında çalışmalar yapmak.</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Malî konularda üst yönetici tarafından verilen diğer görevleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Alım, satım, yapım, kiralama, kiraya verme, bakım-onarım ve benzeri malî işlemlerden; idarenin tamamını ilgilendirenler destek hizmetlerini yürüten birim, sadece harcama birimlerini ilgilendirenler ise harcama birimleri tarafından gerçekleştirilir. Ancak, harcama yetkililiği görevi uhdesinde kalmak şartıyla, harcama birimlerinin talebi ve üst yöneticinin onayıyla bu işlemler destek hizmetlerini yürüten birim tarafından yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Malî hizmetler biriminin yapısı teşkilât kanunlarında veya Cumhurbaşkanlığı kararnamelerinde gösterilir. Malî hizmetler birimlerinin çalışma usûl ve esasları; idarelerin teşkilat yapısı dikkate alınmak ve stratejik planlama, bütçe ve performans programı, muhasebe-kesin hesap ve raporlama ile iç kontrol fonksiyonlarının ayrı alt birimler tarafından yürütülebilmesini sağlayacak şekilde Cumhurbaşkanı tarafından çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Harcama yetkilisi ile muhasebe yetkilisi görevi aynı kişide birleşemez. Malî hizmetler biriminde ön malî kontrol görevini yürütenler malî işlem sürecinde görev alamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İdarelerin malî hizmetler birimlerinde malî hizmetler uzman yardımcısı ve malî hizmetler uzmanı çalıştırılabilir. Malî hizmetler uzman yardımcısı kadrolarına veya pozisyonlarına atanabilmek için 657 sayılı Devlet Memurları Kanununun 48 inci maddesinde sayılan genel şartlara ilave olarak;</template>
        <mvz-bent no="a">
          <template>En az dört yıllık lisans eğitimi veren hukuk, siyasal bilgiler, iktisat, işletme, iktisadi ve idari bilimler fakültelerinden veya bunlara denkliği yetkili makamlarca kabul edilen yurt içi veya yurt dışındaki öğretim kurumlarından mezun olmak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yapılacak özel yarışma sınavında başarılı olmak,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sınavın yapıldığı yılın başı itibarıyla 30 yaşını doldurmamış olmak,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>şartları aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Özel yarışma sınavı, Hazine ve Maliye Bakanlığı tarafından Öğrenci Seçme ve Yerleştirme Merkezine yaptırılacak yazılı sınav ve Hazine ve Maliye Bakanlığınca yapılacak sözlü sınavdan oluşur. Özel yarışma sınavında başarılı olanlar, ÖSYM tarafından başarı sırası ve yaptıkları tercihler dikkate alınarak belirlenir ve bunlar idarelerde malî hizmetler uzman yardımcısı kadro veya pozisyonlarına atanırlar. Bu kadro veya pozisyonlara atananlar en az üç yıl çalışmak ve başarılı olmak şartıyla, açılacak yeterlik sınavına girme hakkını kazanırlar. Hazine ve Maliye Bakanlığınca yapılacak yeterlik sınavında başarılı olanlar malî hizmetler uzmanı kadro veya pozisyonlarına atanırlar. Malî hizmetler uzman yardımcılığı döneminde veya yeterlik sınavında başarılı olamayanlar, istihdam şekline göre bulundukları kamu idarelerinde durumlarına uygun kadro veya pozisyonlara atanırlar. Özel yarışma sınavına katılacak adayların belirlenmesi, sınavların yapılması, atama ve yerleştirilmeleri, yetiştirilmeleri, yeterlik sınavları ile çalışma usûl ve esasları Hazine ve Maliye Bakanlığınca çıkarılacak yönetmelikle düzenlenir. Malî hizmetler uzmanı kadrolarına atandıktan sonra en az üç yıl süreyle atandıkları idarelerde söz konusu kadrolarda 657 sayılı Devlet Memurları Kanununa göre görev yapanlar, kendilerinin isteği ve idarelerinin muvafakati ile başka bir kamu idaresinin aynı unvanlı kadrolarına atanabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="61" başlık="Muhasebe hizmeti ve muhasebe yetkilisinin yetki ve sorumlulukları">
      <mvz-fıkra no="1">
        <template>Muhasebe hizmeti; gelirlerin ve alacakların tahsili, giderlerin hak sahiplerine ödenmesi, para ve parayla ifade edilebilen değerler ile emanetlerin alınması, saklanması, ilgililere verilmesi, gönderilmesi ve diğer tüm malî işlemlerin kayıtlarının yapılması ve raporlanması işlemleridir. Bu işlemleri yürütenler muhasebe yetkilisidir. Memuriyet kadro ve unvanlarının muhasebe yetkilisi niteliğine etkisi yoktur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Muhasebe yetkilisi, bu hizmetlerin yapılmasından ve muhasebe kayıtlarının usulüne uygun, saydam ve erişilebilir şekilde tutulmasından sorumludur. Genel bütçe kapsamındaki kamu idarelerinin muhasebe hizmetleri Hazine ve Maliye Bakanlığınca yürütülür. Muhasebe yetkilileri gerekli bilgi ve raporları düzenli olarak kamu idarelerine verirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Muhasebe yetkilileri ödeme aşamasında, ödeme emri belgesi ve eki belgeler üzerinde;</template>
        <mvz-bent no="a">
          <template>Yetkililerin imzasını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ödemeye ilişkin ilgili mevzuatında sayılan belgelerin tamam olmasını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Maddi hata bulunup bulunmadığını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hak sahibinin kimliğine ilişkin bilgileri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>kontrol etmekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Muhasebe yetkilileri, ilgili mevzuatında düzenlenmiş belgeler dışında belge arayamaz. Yukarıda sayılan konulara ilişkin hata veya eksiklik bulunması halinde ödeme yapamaz. Belgesi eksik veya hatalı olan ödeme emri belgeleri, düzeltilmek veya tamamlanmak üzere en geç bir iş günü içinde gerekçeleriyle birlikte harcama yetkilisine yazılı olarak gönderilir. Hataların düzeltilmesi veya eksikliklerin giderilmesi halinde ödeme işlemi gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Muhasebe yetkilileri işlemlerine ilişkin defter, kayıt ve belgeleri muhafaza eder ve denetime hazır bulundurur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Muhasebe yetkilileri, 34 üncü maddenin ikinci fıkrasındaki ödemeye ilişkin hükümler ile bu maddenin üçüncü fıkrasında belirtilen ödemeye ilişkin kontrol yükümlülüklerinden dolayı sorumludur. Muhasebe yetkililerinin bu Kanuna göre yapacakları kontrollere ilişkin sorumlulukları, görevleri gereği incelemeleri gereken belgelerle sınırlıdır.  Muhasebe yetkililerinin görev ve yetkilerinin yardımcılarına devredilmesine, muhasebe yetkililerinin herhangi bir nedenle görevlerinden ayrılmalarında muhasebe hizmetlerinin yürütülmesine ilişkin düzenleme yapmaya ve sertifika sınavlarına girmeye hak kazanılması bakımından muhasebe yetkilisi yardımcısı eşiti görevleri belirlemeye Hazine ve Maliye Bakanlığı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Muhasebe yetkilisi adına ve hesabına para ve parayla ifade edilebilen değerleri geçici olarak almaya, vermeye ve göndermeye yetkili olanlar muhasebe yetkilisi mutemedidir. Muhasebe yetkilisi mutemetleri doğrudan muhasebe yetkilisine karşı sorumludur. Muhasebe yetkilisi mutemetlerinin görevlendirilmeleri, yetkileri, denetimi, tutacakları defter ve belgeler ve diğer hususlara ilişkin usul ve esaslar Hazine ve Maliye Bakanlığınca çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="62" başlık="Muhasebe yetkilisinin nitelikleri ve atanması">
      <mvz-fıkra no="1">
        <template>Muhasebe yetkilisi görevini yürütmek üzere atanacakların, 657 sayılı Devlet Memurları Kanununun 48 inci maddesinde belirtilenler ile aşağıdaki şartları taşıması gerekir:</template>
        <mvz-bent no="a">
          <template>En az dört yıllık yüksek öğrenim görmüş olmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu idarelerinin muhasebe hizmetlerinde en az dört yıl çalışmış olmak koşuluyla bu idarelerde muhasebe yetkilisi yardımcısı veya eşiti görevlerde bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Muhasebe yetkilisi sertifikası almış olmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Son üç yıl içerisinde olumsuz sicil almamış olmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Aylıktan kesme ve kademe ilerlemesinin durdurulması cezası almamış olmak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Görevin gerektirdiği bilgi ve temsil yeteneğine sahip olmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, belde ve nüfusu 25.000'in altında olan ilçe belediyeleri ile mahalli idare birliklerinde muhasebe yetkilisi görevini yürütmek üzere atanacakların, yukarıdaki fıkranın (c), (d), (e) ve (f) bentlerinde belirtilen şartları taşımaları kaydıyla, en az lise mezunu olmaları ve kamu idarelerinin muhasebe hizmetlerinde en az dört yıl çalışmış olmaları yeterlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Genel bütçe kapsamındaki kamu idarelerinde muhasebe yetkilisi Hazine ve Maliye Bakanlığınca, diğer kamu idarelerinde ise üst yöneticiler tarafından atanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Muhasebe yetkilisi olacak görevliler, Hazine ve Maliye Bakanlığınca görevin niteliği dikkate alınarak meslekî konularda eğitime tâbi tutulur ve bu eğitimi başarıyla tamamlayanlara sertifika verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Muhasebe yetkilisi sertifika programına başvuru şartları, adayların eğitimi, eğitim süresi, sertifika sınavı, sertifika verilmesi, bu işlemlerin genel yönetim kapsamındaki kamu idareleri itibarıyla ayrı ayrı veya birlikte yapılması ile muhasebe yetkililerinin çalışma usul ve esasları, Hazine ve Maliye Bakanlığınca çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="63" başlık="İç denetim">
      <mvz-fıkra no="1">
        <template>İç denetim, kamu idaresinin çalışmalarına değer katmak ve geliştirmek için kaynakların ekonomiklik, etkililik ve verimlilik esaslarına göre yönetilip yönetilmediğini değerlendirmek ve rehberlik yapmak amacıyla yapılan bağımsız, nesnel güvence sağlama ve danışmanlık faaliyetidir. Bu faaliyetler, idarelerin yönetim ve kontrol yapıları ile malî işlemlerinin risk yönetimi, yönetim ve kontrol süreçlerinin etkinliğini değerlendirmek ve geliştirmek yönünde sistematik, sürekli ve disiplinli bir yaklaşımla ve genel kabul görmüş standartlara uygun olarak gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İç denetim, iç denetçiler tarafından yapılır.  Kamu idarelerinin yapısı ve personel sayısı dikkate alınmak suretiyle, İç Denetim Koordinasyon Kurulunun uygun görüşü üzerine, doğrudan üst yöneticiye bağlı iç denetim birimi başkanlıkları kurulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="64" başlık="İç denetçinin görevleri">
      <mvz-fıkra no="1">
        <template>Kamu idarelerinin yıllık iç denetim programı üst yöneticinin önerileri de dikkate alınarak iç denetçiler tarafından hazırlanır ve üst yönetici tarafından onaylanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İç denetçi, aşağıda belirtilen görevleri yerine getirir:</template>
        <mvz-bent no="a">
          <template>Nesnel risk analizlerine dayanarak kamu idarelerinin yönetim ve kontrol yapılarını değerlendirmek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kaynakların etkili, ekonomik ve verimli kullanılması bakımından incelemeler yapmak ve önerilerde bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Harcama sonrasında yasal uygunluk denetimi yapmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İdarenin harcamalarının, malî işlemlere ilişkin karar ve tasarruflarının, amaç ve politikalara, kalkınma planına, programlara, stratejik planlara ve performans programlarına uygunluğunu denetlemek ve değerlendirmek.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Malî yönetim ve kontrol süreçlerinin sistem denetimini yapmak ve bu konularda önerilerde bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Denetim sonuçları çerçevesinde iyileştirmelere yönelik önerilerde bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Denetim sırasında veya denetim sonuçlarına göre soruşturma açılmasını gerektirecek bir duruma rastlandığında, ilgili idarenin en üst amirine bildirmek.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İç denetçi bu görevlerini, İç Denetim Koordinasyon Kurulu tarafından belirlenen ve uluslararası kabul görmüş kontrol ve denetim standartlarına uygun şekilde yerine getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İç denetçi, görevinde bağımsızdır ve iç denetçiye asli görevi dışında hiçbir görev verilemez ve yaptırılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İç denetçiler, raporlarını doğrudan üst yöneticiye sunar. Bu raporlar üst yönetici tarafından değerlendirmek suretiyle gereği için ilgili birimler ile malî hizmetler birimine verilir. İç denetim raporları ile bunlar üzerine yapılan işlemler, üst yönetici tarafından en geç iki ay içinde İç Denetim Koordinasyon Kuruluna gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="65" başlık="İç denetçinin nitelikleri ve atanması">
      <mvz-fıkra no="1">
        <template>İç denetçi olarak atanacakların, 657 sayılı Devlet Memurları Kanununun 48 inci maddesinde belirtilenler ile aşağıdaki şartları taşıması gerekir:</template>
        <mvz-bent no="a">
          <template>İlgili kamu idaresinin özelliği de dikkate alınarak İç Denetim Koordinasyon Kurulu tarafından belirlenen alanlarda en az dört yıllık yüksek öğrenim görmüş olmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu idarelerinde denetim elemanı olarak en az beş yıl veya İç Denetim Koordinasyon Kurulunca belirlenen alanlarda en az sekiz yıl çalışmış olmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Mesleğin gerektirdiği bilgi, ehliyet ve temsil yeteneğine sahip olmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İç Denetim Koordinasyon Kurulunca gerekli görülen diğer şartları taşımak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu idarelerine iç denetçi olarak atanacaklar, İç Denetim Koordinasyon Kurulu koordinatörlüğünde, iç denetim eğitimine tâbi tutulur. Eğitim programı, iç denetçi adaylarına denetim, bütçe, malî kontrol, kamu ihale mevzuatı, muhasebe, personel mevzuatı, Avrupa Birliği mevzuatı ve mesleki diğer konularda yeterli bilgi verilecek şekilde hazırlanır. Bu eğitimi başarıyla tamamlayanlara sertifika verilir. İç denetçi adayları için uygulanacak eğitim programının süresi, konuları ve eğitim sonucunda yapılacak işlemler ile diğer hususlar Cumhurbaşkanı tarafından çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İç denetçiler, bakanlıklar ve bağlı idarelerde, üst yöneticilerin teklifi üzerine Bakan, diğer idarelerde üst yöneticiler tarafından sertifikalı adaylar arasından atanır ve aynı usûlle görevden alınır. İç denetçilerin kamu idareleri itibarıyla sayıları, çalışma usul ve esasları ile diğer hususlar Cumhurbaşkanı tarafından çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="66" başlık="İç Denetim Koordinasyon Kurulu">
      <mvz-fıkra no="1">
        <template>Hazine ve Maliye Bakanlığına bağlı İç Denetim Koordinasyon Kurulu, yedi üyeden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Gerekli görülen hallerde İç Denetim Koordinasyon Kurulu, oy hakkı olmamak kaydıyla teknik yardım almak ve danışmak amacıyla uzman kişileri de toplantılara davet edebilir. Kurulun çalışma usul ve esasları ile diğer hususlar İç Denetim Koordinasyon Kurulunun önerisi üzerine Hazine ve Maliye Bakanlığınca çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İç Denetim Koordinasyon Kurulunda görevlendirilenlerin asli görevleri devam eder. Başkan ve üyelerine, ayda dörtten fazla olmamak üzere her toplantı günü için (3000) gösterge rakamının memur aylık katsayısıyla çarpımı sonucu bulunacak tutar üzerinden toplantı ücreti ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="67" başlık="İç Denetim Koordinasyon Kurulunun görevleri">
      <mvz-fıkra no="1">
        <template>İç Denetim Koordinasyon Kurulu, kamu idarelerinin iç denetim sistemlerini izlemek, bağımsız ve tarafsız bir organ olarak hizmet vermek üzere aşağıdaki görevleri yürütür:</template>
        <mvz-bent no="a">
          <template>İç denetime ilişkin denetim ve raporlama standartlarını belirlemek, denetim rehberlerini hazırlamak ve geliştirmek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Uluslararası uygulamalar ve denetim standartlarıyla uyumlu risk değerlendirme yöntemlerini geliştirmek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kamu idarelerinin denetim birimleri ile işbirliğini sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yolsuzluk veya usulsüzlüklerin ortadan kaldırılması için gerekli önlemlerin alınması konusunda önerilerde bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Risk içeren alanlarda iç denetçilere program dışı özel denetim yaptırılması için kamu idarelerine önerilerde bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İç denetçilerin eğitim programlarını düzenlemek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>İç denetçiler ile üst yöneticiler arasında görüş ayrılığı bulunması halinde anlaşmazlığın giderilmesine yardımcı olmak.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>İdarelerin iç denetim raporlarını değerlendirerek sonuçlarını konsolide etmek suretiyle yıllık rapor halinde Hazine ve Maliye Bakanına sunmak ve kamuoyuna açıklamak.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>İşlem hacimleri ve personel sayıları dikkate alınmak suretiyle idareler ile ilçe ve belde belediyeleri için iç denetçi atanıp atanmayacağına karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>İç denetçilerin atanmasına ilişkin diğer usulleri belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>İç denetçilerin uyacakları etik kuralları belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Kalite güvence ve geliştirme programını düzenlemek ve iç denetim birimlerini bu kapsamda değerlendirmek.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="Dış Denetim">
    <mvz-madde no="68" başlık="Dış denetim">
      <mvz-fıkra no="1">
        <template>Sayıştay tarafından yapılacak harcama sonrası dış denetimin amacı, genel yönetim kapsamındaki kamu idarelerinin hesap verme sorumluluğu çerçevesinde, yönetimin malî faaliyet, karar ve işlemlerinin; kanunlara, kurumsal amaç, hedef ve planlara uygunluk yönünden incelenmesi ve sonuçlarının Türkiye Büyük Millet Meclisine raporlanmasıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dış denetim, genel kabul görmüş uluslararası denetim standartları dikkate alınarak;</template>
        <mvz-bent no="a">
          <template>Kamu idaresi hesapları ve bunlara ilişkin belgeler esas alınarak, malî tabloların güvenilirliği ve doğruluğuna ilişkin malî denetimi ile kamu idarelerinin gelir, gider ve mallarına ilişkin malî işlemlerinin kanunlara ve diğer hukuki düzenlemelere uygun olup olmadığının tespiti,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu kaynaklarının etkili, ekonomik ve verimli olarak kullanılıp kullanılmadığının belirlenmesi, faaliyet sonuçlarının ölçülmesi ve performans bakımından değerlendirilmesi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Suretiyle gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dış denetim sırasında, kamu idarelerinin iç denetçileri tarafından düzenlenen raporlar, talep edilmesi halinde Sayıştay denetçilerinin bilgisine sunulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Denetimler sonucunda; ikinci fıkranın (a) ve (b) bentlerinde belirtilen hususlarda düzenlenen raporlar, idareler itibarıyla konsolide edilir ve bir örneği ilgili kamu idaresine verilerek üst yönetici tarafından cevaplandırılır. Sayıştay, denetim raporları ve bunlara verilen cevapları dikkate alarak düzenleyeceği dış denetim genel değerlendirme raporunu Türkiye Büyük Millet Meclisine sunar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Sayıştay tarafından hesapların hükme bağlanması; genel yönetim kapsamındaki kamu idarelerinin gelir, gider ve mal hesapları ile bu hesaplarla ilgili işlemlerinin yasal düzenlemelere uygun olup olmadığına karar verilmesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Dış denetim ve hesapların hükme bağlanmasına ilişkin diğer hususlar ilgili kanununda düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="69" başlık="Sayıştayın denetlenmesi">
      <mvz-fıkra no="1">
        <template>Sayıştayın denetlenmesi, her yıl Türkiye Büyük Millet Meclisi adına Türkiye Büyük Millet Meclisi Başkanlık Divanı tarafından görevlendirilen ve gerekli mesleki niteliklere sahip denetim elemanlarından oluşan bir komisyon tarafından, hesaplar ve bunlara ilişkin belgeler esas alınarak yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="7-YEDİNCİ" başlık="Yaptırımlar ve Yetkili Merciler">
    <mvz-madde no="70" başlık="Ödenek üstü harcama">
      <mvz-fıkra no="1">
        <template>Kamu zararı oluşturmamakla birlikte bütçelere, ayrıntılı harcama programlarına, serbest bırakma oranlarına aykırı olarak veya ödenek gönderme belgelerindeki ödenek miktarını aşan harcama talimatı veren harcama yetkililerine, her türlü aylık, ödenek, zam ve tazminat dahil yapılan bir aylık net ödemeler toplamının iki katı tutarına kadar para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="71" başlık="Kamu zararı">
      <mvz-fıkra no="1">
        <template>Kamu zararı; kamu görevlilerinin kasıt, kusur veya ihmallerinden kaynaklanan mevzuata aykırı karar, işlem veya eylemleri sonucunda kamu kaynağında artışa engel veya eksilmeye neden olunmasıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu zararının belirlenmesinde;</template>
        <mvz-bent no="a">
          <template>İş, mal veya hizmet karşılığı olarak belirlenen tutardan fazla ödeme yapılması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Mal alınmadan, iş veya hizmet yaptırılmadan ödeme yapılması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Transfer niteliğindeki giderlerde, fazla veya yersiz ödemede bulunulması,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İş, mal veya hizmetin rayiç bedelinden daha yüksek fiyatla alınması veya yaptırılması,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İdare gelirlerinin tarh, tahakkuk veya tahsil işlemlerinin mevzuata uygun bir şekilde yapılmaması,</template>
        </mvz-bent>
        <mvz-bent no="f" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Mevzuatında öngörülmediği halde ödeme yapılması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kontrol, denetim, inceleme, kesin hükme bağlama veya yargılama sonucunda tespit edilen kamu zararı, zararın oluştuğu tarihten itibaren ilgili mevzuatına göre hesaplanacak faiziyle birlikte ilgililerden tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Alınmamış para, mal ve değerleri alınmış; sağlanmamış hizmetleri sağlanmış; yapılmamış inşaat, onarım ve üretimi yapılmış veya bitmiş gibi gösteren gerçek dışı belge düzenlemek suretiyle kamu kaynağında bir artışa engel veya bir eksilmeye neden olanlar ile bu gibi kanıtlayıcı belgeleri bilerek düzenlemiş, imzalamış veya onaylamış bulunanlar hakkında Türk Ceza Kanunu veya diğer kanunların bu fiillere ilişkin hükümleri uygulanır. Ayrıca, bu fiilleri işleyenlere her türlü aylık, ödenek, zam, tazminat dahil yapılan bir aylık net ödemelerin iki katı tutarına kadar para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kamu zararının, bu zarara neden olan kamu görevlisinden veya diğer gerçek ve tüzel kişilerden tahsiline ilişkin usûl ve esaslar, Cumhurbaşkanı tarafından çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="72" başlık="Yetkisiz tahsil ve ödeme">
      <mvz-fıkra no="1">
        <template>Kanunların veya Cumhurbaşkanlığı kararnamelerinin öngördüğü şekilde yetkili kılınmamış hiçbir gerçek veya tüzel kişi, kamu adına tahsilat veya ödeme yapamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yetkisiz tahsilat veya ödeme yapılması, kamu hizmeti karşılığında veya kamu hizmetleriyle ilişkilendirilerek bağış veya yardım toplanması veya başka adlarla tahsilat veya ödeme yapılması hallerinde; söz konusu tutarlar, yetkisiz tahsilat veya ödeme yapılanlardan alınarak, ilgisine göre bütçeye gelir kaydedilir veya ilgililerine iade edilmek üzere emanet hesaplarına kaydedilir. Ayrıca, bunlar hakkında ilgili kanunları uyarınca adli ve idari yönden gerekli işlemler yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="73" başlık="Para cezaları ve yetkili merciler">
      <mvz-fıkra no="1">
        <template>Bu Kanunda belirtilen para cezaları, ilgili kamu idaresinin üst yöneticisi tarafından verilir. Para cezaları, karar verilmesini izleyen ay başından başlamak üzere ve herhangi bir hüküm almaya gerek kalmaksızın; ilgililerine yapılan her türlü aylık, ödenek, zam, tazminat dahil bir aylık net ödemelerin dörtte biri oranında kesilerek tahsil olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="74" başlık="Zamanaşımı">
      <mvz-fıkra no="1">
        <template>Kamu zararının meydana geldiği ve bu Kanunda belirtilen para cezalarının verilmesini gerektiren fiilin işlendiği yılı izleyen malî yılın başından başlamak üzere zamanaşımını kesen ve durduran genel hükümler saklı kalmak kaydıyla onuncu yılın sonuna kadar tespit ve tahsil edilemeyen kamu zararları ile para cezaları zamanaşımına uğrar.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="8-SEKİZİNCİ" başlık="Diğer Hükümler">
    <mvz-madde no="75" başlık="Malî yönetim ve kontrol sisteminin denetimi">
      <mvz-fıkra no="1">
        <template>Malî yönetim ve kontrol sisteminin zaafa uğradığı, yolsuzluk veya kamu zararına yönelik emarelerin ortaya çıktığı durumlarda; Cumhurbaşkanı kamu idarelerinin tüm malî yönetim ve kontrol sistemlerini, malî karar ve işlemlerini mevzuata uygunluk yönünden teftiş ettirir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="76" başlık="Kamu idarelerinin sorumluluğu">
      <mvz-fıkra no="1">
        <template>Malî karar ve işlemlere ilişkin her türlü kayıt, bilgi ve belgeler, kamu idareleri tarafından düzenli olarak muhafaza edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu idareleri ve görevlileri; malî yönetim ve kontrol sistemleri ile bütçenin hazırlanması, uygulanması, sonuçlandırılması, muhasebeleştirilmesi, raporlanması işlemlerine ait bilgi ve belgeleri denetimle görevlendirilmiş olanlara ibraz etmek, görevin sağlıklı yapılmasını sağlayacak önlemleri almak ve her türlü yardım ve kolaylığı göstermek zorundadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="77" başlık="Sosyal güvenlik kurumları ve mahallî idareler">
      <mvz-fıkra no="1">
        <template>Sosyal güvenlik kurumları ve mahallî idare bütçelerinin hazırlanması ve uygulanması ile diğer malî işlemleri, bu Kanun hükümleri saklı kalmak kaydıyla, ilgili kanunlarındaki hükümlere tâbidir. Ancak, sosyal güvenlik kurumları ve mahallî idarelerin ayrıntılı harcama programları ile finansman programları bütçeleriyle birlikte hazırlanır, görüşülür ve onaylanır. Ödenekler de bu usul ve esaslara göre kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Malî yönetim ve kontrol sisteminin zaafa uğradığı, yolsuzluk veya kamu zararına yönelik emarelerin ortaya çıktığı durumlarda; il özel idareleri için ilgili vali, belediyeler için ilgili belediye başkanının talep etmesi veya doğrudan Cumhurbaşkanının onayı üzerine İçişleri Bakanı, yetkili denetim elemanlarına, ilgili mahallî idarelerin tüm malî yönetim ve kontrol sistemlerini, malî karar ve işlemlerini mevzuata uygunluk yönünden teftiş ettirir. Bu teftişler sonucunda düzenlenecek raporların bir örneği İç Denetim Koordinasyon Kuruluna, bir örneği de gerekli işlemlerin yapılması için ilgili vali veya belediye başkanına gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="78" başlık="Kurumlardan alınacak hasılat payı">
      <mvz-fıkra no="1">
        <template>Kamu iktisadi teşebbüsleri ve kamu şirketlerinin gayrisafi hasılatının yüzde onbeşine kadar tutarda bir bedel tahsil edilerek genel bütçeye gelir kaydedilir. Bu kapsamda bedel tahsil edilecek kurum ve kuruluşlar ile hasılat payı oranları, ödeme yeri ve zamanı Cumhurbaşkanı tarafından belirlenir. Zamanında ödenmeyen hasılat payları, Cumhurbaşkanı tarafından belirlenen oranda zam uygulanmak suretiyle 21.7.1953 tarihli ve 6183 sayılı Kanuna göre tahsil edilir. Hesaplanan zam, kurum ve kuruluşun bu payları ödeme yetkisi verilmiş görevlilerinden alınır. Ancak, Hazine ve Maliye Bakanlığınca verilmiş ek süreler için zam uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Düzenleyici ve denetleyici kurumların üçer aylık dönemler itibarıyla oluşacak gelir fazlaları, her üç ayda bir izleyen ayın onbeşine kadar genel bütçeye aktarılır. Bu fıkra hükmü İstanbul Menkul Kıymetler Borsası hakkında da uygulanır. Söz konusu tutarların süresi içinde ödenmemesi halinde, ödenmeyen tutarlar 6183 sayılı Kanuna göre gecikme zammı da uygulanmak suretiyle takip ve tahsil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="79" başlık="Kamu alacaklarının silinmesi">
      <mvz-fıkra no="1">
        <template>Özel mevzuatındaki hükümler saklı kalmak üzere, idare hesaplarında kayıtlı olup 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun kapsamında izlenen kamu alacakları dışında kalan;</template>
        <mvz-bent no="a">
          <template>Zarurî veya mücbir sebeplerle takip ve tahsil imkânı kalmayan,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tahsili için yapılacak takibat giderlerinin asıl alacak tutarından fazla olacağı anlaşılan,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>kamu alacaklarından merkezî yönetim bütçe kanununda gösterilen tutarlara kadar olanların kayıtlardan çıkarılmasına üst yöneticiler yetkilidir. (a) bendine göre belirlenen tutarı aşan kamu alacaklarından silinmesi öngörülenler merkezî yönetim bütçe kanununda ayrıca gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="80" başlık="Yetki">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerinin uygulanmasına ilişkin gerekli düzenlemeleri yapmaya Hazine ve Maliye Bakanlığı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>

  <mvz-kısım no="9-DOKUZUNCU" başlık="Yürürlükten Kaldırılan Hükümler, Geçici Maddeler ve Yürürlük">
    <mvz-madde no="81" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun geçici maddelerindeki hükümler saklı kalmak kaydıyla;</template>
        <mvz-bent no="a">
          <template>1050 sayılı Muhasebei Umumiye Kanunu ile ek ve değişiklikleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>832 sayılı Sayıştay Kanununun 30, 32, 33, 36, 37 nci maddeleri ile diğer maddelerinin bu Kanuna aykırı hükümleri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu Kanun kapsamındaki kamu idarelerine ilişkin olarak, 4.1.1961 tarihli ve 211 sayılı Kanunun 98 - 106 ncı maddeleri hariç olmak üzere, diğer kanunlarla 1050 sayılı Muhasebei Umumiye Kanunu, 6245 sayılı Harcırah Kanunu ve 832 sayılı Sayıştay Kanununa tâbi olunmadığına dair istisna veya muafiyet getiren hükümleri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>28.3.2002 tarihli ve 4749 sayılı Kanunun 14 üncü maddesinin üçüncü fıkrası,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>26.11.1999 tarihli ve 4481 sayılı Kanunun 15 inci maddesi,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Diğer kanunların bu Kanuna aykırı hükümleri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Türkiye Büyük Millet Meclisi ve Sayıştayın muhasebe hizmetleri Türkiye Büyük Millet Meclisi Başkanı, Cumhurbaşkanlığı muhasebe hizmetleri ise Cumhurbaşkanlığı tarafından görevlendirilen muhasebe yetkilileri tarafından yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Müşterek fon hesabı" tür="Ek">
      <mvz-fıkra no="1">
        <template>Çeşitli mevzuatla kurulmuş fonların her türlü geliri Türkiye Cumhuriyet Merkez Bankası nezdinde Hazine ve Maliye Bakanlığı adına açılan müşterek fon hesabına yatırılır. Bu hesaba yatırılan gelirlerden ilgili mevzuatında öngörülen fonlar arası pay ve kesintiler Türkiye Cumhuriyet Merkez Bankası tarafından yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Destekleme ve Fiyat İstikrar Fonunun gelirleri, yapılan kesintilerden sonra kalan tutarlar üzerinden genel bütçenin (B) işaretli cetveline gelir kaydedilir. Bu Fon, hizmetlerini bütçenin (A) işaretli cetveline konulan ödeneklerle yerine getirir. Ancak, bu Fon gelirlerinden kredi ana para geri dönüşleri, kredi faizleri, borçlanma ve satış hasılatı, genel bütçenin (B) işaretli cetveline gelir kaydedilmeksizin doğrudan müşterek fon hesabından ilgili Fonun gider hesabına aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kapsam dışında bırakılan fonların gelirleri ve harcamaları bütçe ile ilişkilendirilmez. Ancak, bunların müşterek fon hesabında toplanan gelirlerinden Cumhurbaşkanı tarafından belirlenecek oran ve tutarlarda kesinti yapılarak genel bütçeye gelir kaydedilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Fonlar, hizmet ve harcamalarını kendi mevzuatında yer alan esas ve usûllere göre yürütürler. Fon gelirlerinin tahsili, takibi, gelir kaydı, muhasebeleştirilmesi ve denetimine ilişkin süre, esas ve usûller Hazine ve Maliye Bakanlığı tarafından tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kanun ve kanun hükmünde kararname ile kurulanlar hariç olmak üzere, hizmet alanı kalmayan fonlar Cumhurbaşkanı tarafından tasfiye edilebilir. Bunların tasfiyesine ilişkin her türlü düzenlemeyi yapmaya Hazine ve Maliye Bakanı yetkilidir. Cumhurbaşkanı tarafından fonların gider hesapları üzerinden aktarma yapılabilir. Aktarılan tutar, kendisine aktarma yapılan fonun gelir hesabı üzerinden müşterek fon hesabına, buradan da tamamı gider hesabına aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bütçe kapsamı dışındaki fonlardan kendi mevzuatına göre yapılan kesinti ile fonlar arası aktarmalardan sonra kalan tutar, Türkiye Cumhuriyet Merkez Bankası tarafından ilgili fonun gider hesabına aktarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="FATİH Projesi kapsamında mal ve hizmet alımları ile yapım işleri" tür="Ek">
      <mvz-fıkra no="1">
        <template>Eğitimde Fırsatları Artırma ve Teknolojiyi İyileştirme Hareketi (FATİH) Projesi kapsamında Millî Eğitim Bakanlığınca yapılacak yazılım, donanım, dijital içerik alımı, internet erişim hizmetleri sağlanması, ağ altyapısı, AR-GE merkezi, veri merkezi kurulumu ve bunlara ilişkin her türlü bakım, onarım ve işletme işlerinde üst yöneticinin onayıyla 15 yıla kadar gelecek yıllara yaygın yüklenmelere girişilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında yer alan tüm iş ve işlemler elektronik ortamda gerçekleştirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin uygulanması ile ilgili olarak Hazine ve Maliye Bakanlığı;</template>
        <mvz-bent no="a">
          <template>Defter, kayıt, belge ve benzeri içeriklerin elektronik ortamda oluşturulması, kaydedilmesi, iletilmesi, muhafaza ve ibrazına ilişkin usul ve esasları belirlemeye,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Elektronik ortamda gerçekleştirilen işlemlerin kaynağı, bütünlüğü, gizliliği ve güvenliğinin sağlanmasına yönelik sertifika altyapısı oluşturmaya veya mevcut olan altyapıları kullanmaya,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İlgili bilişim sistemlerine yönelik her türlü birlikte işlerlik standartlarına ilişkin usul ve esasları belirlemeye,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hazine ve Maliye Bakanlığı, bu madde kapsamında yapacağı belirlemelerde Sayıştayın uygun görüşünü alır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanlığı kararnameleriyle kurulan idarelerin bu Kanuna ekli cetvellerden hangisinde yer alacağı ilgili Cumhurbaşkanlığı kararnamesinde belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Kanunla veya Cumhurbaşkanlığı kararnamesiyle merkezi yönetim kapsamındaki kamu idarelerinin yeniden teşkilatlanması çerçevesinde yapılan ödenek aktarma işlemleri, personel giderleri tertiplerinden diğer tertiplere yapılan aktarmalar hariç olmak üzere, bu Kanunun 21 inci maddesi ve yılı merkezi yönetim bütçe kanununda düzenlenen ödenek aktarmalarına ilişkin sınırlamalara tabi değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu idarelerinin yeniden teşkilatlanmasının gerektirdiği bütçe işlemlerini yapmaya, bütçenin uygulaması ile kesin hesapların hazırlanmasına ilişkin olarak gerekli her türlü düzenlemeyi yapmaya Cumhurbaşkanı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kamu idarelerinin yeniden teşkilatlanmasına ilişkin süreç tamamlanıncaya kadar yapılması gereken zorunlu harcamalar kapatılan idare veya ilgili idare bütçesinden gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kapatılan harcama birimi ve idareler için faaliyet raporu düzenlenmez. Bu birim ve idarelerin yılı faaliyet sonuçları görev, yetki ve sorumluluklarının devredildiği idarelerin faaliyet raporlarında gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Mücbir sebep" tür="Ek">
      <mvz-fıkra no="1">
        <template>Deprem, yangın, sel gibi doğal afetler ile salgın hastalık veya Hazine ve Maliye Bakanlığı bilişim sistemlerinin herhangi bir nedenle çalışmaması gibi mücbir sebep hallerinde; veri, bilgi ve belgelerin oluşturulması, kaydedilmesi, iletilmesi, muhafazası ve ibrazına ilişkin yöntemler Hazine ve Maliye Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mücbir sebep hallerinde, Hazine ve Maliye Bakanlığı bilişim sistemleri üzerinden yürütülen işlemlerde yaşanabilecek gecikme nedeniyle ilgililere, gecikme faizi, gecikme zammı ve ceza gibi yaptırımlar uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Mevzuatta orta vadeli mali plana yapılan atıflar orta vadeli programa yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Kamu kurum ve kuruluşlarının harcama ve uygulamalarının tasarruf tedbirlerine uygunluğunun idarelerince ve/veya Hazine ve Maliye Bakanlığınca izlenmesi ve denetlenmesi sonucunda, alınan tedbirlere aykırı iş ve işlemleri tespit edilenler hakkında tabi oldukları mevzuat uyarınca disiplin hükümleri uygulanır ve sonuçları idarelerince Cumhurbaşkanlığına bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girmesinden önce malî işlemleri Maliye Bakanlığı tarafından yürütülmekte olan kamu idarelerinde, malî yönetim ve kontrol sistemi kuruluncaya kadar, bu Kanun uyarınca yapılması gereken görevler, Maliye Bakanlığının birimleri tarafından yürütülür. Maliye Bakanlığınca belirlenecek kriterlerin yerine getirilmesi durumunda, bu kamu idarelerine yetki devri, Maliye Bakanlığının önerisi üzerine idareler itibarıyla gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Diğer kamu idarelerinde, bu Kanunun öngördüğü malî yönetim ve kontrol sürecine ilişkin görevler, malî yönetim ve kontrol sistemi kuruluncaya kadar, görev ve yetki bakımından benzeri birim ve görevliler tarafından yürütülür. Bu kamu idarelerinde görev ve yetki bakımından benzeri birim ve görevliler, Maliye Bakanlığının uygun görüşü üzerine ilgili üst yönetici tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Maliye Bakanlığı, rehberlik ve koordinasyon görevleri çerçevesinde, kamu idarelerinde malî yönetim ve kontrol sistemlerinin oluşturulmasına yardımcı olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Geçiş dönemi 31.12.2007 tarihini geçemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen tüzük, yönetmelik ve diğer düzenlemeler en geç 31.12.2004 tarihine kadar yayımlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 49 uncu maddesindeki Kurul tarafından belirleme yapılıncaya kadar, genel yönetim kapsamındaki kamu idarelerinde uygulanacak muhasebe standartları Maliye Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen malî yönetim ve kontrol sistemine uyum sağlanması amacıyla, Kanun kapsamındaki idarelerle ilgili mevzuatta ve Türkiye Büyük Millet Meclisi İçtüzüğünde gerekli değişiklikler, en geç 31.12.2007 tarihine kadar yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel bütçe kapsamındaki idarelerin, kamu görevi ve hizmeti dışında kalan ve ilgili kanunlarında belirtilen faaliyetleri ile mal ve hizmet teslimlerinden fiyatlandırılabilir nitelikte bulunanlardan sağlayacakları gelirleri düzenleyen kanun, 31.12.2007 tarihine kadar yürürlüğe konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>31.12.2005 tarihi itibarıyla;</template>
        <mvz-bent no="a">
          <template>Maliye Bakanlığı kadrolarında Bütçe Dairesi Başkanı, Muhasebe Müdürü, Gelir Saymanlık Müdürü, Malmüdürü, Saymanlık Müdürü, Vergi Dairesi Müdürü, Vergi Müdürü, Askeri Defterdar, Devlet Muhasebe Uzmanı ve Muhasebe Denetmeni olarak görev yapanlar ile daha önce en az beş yıl bu görevlerde bulunanlar, kamu idarelerinde Muhasebe Yetkilisi;  bunların yardımcıları ile kadro unvanı sayman olanlar ise Muhasebe Yetkilisi Yardımcısı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Özel bütçeli idareler, mahallî idareler ve sosyal güvenlik kurumlarının muhasebe birimlerinde, birinci derecede sorumlu olarak çalışanlar ile daha önce bu görevi en az beş yıl yapmış olanlarla bu idarelerde bütçe dairesi başkanı, gelir ve gider dairesi başkanı, muhasebe daire başkanı, gelir müdürü, bütçe müdürü ve muhasebe müdürü olanlar anılan idarelerde Muhasebe Yetkilisi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sayıştay Denetçisi, Başbakanlık Müfettişi, Yüksek Denetleme Kurulu Denetçisi, Maliye Müfettişi, Hesap Uzmanı, Bütçe Kontrolörü, Muhasebat Kontrolörü, Gelirler Kontrolörü, Millî Emlak Kontrolörü, Tasfiye İşleri ve Döner Sermaye İşletmeleri Kontrolörü, Hazine Kontrolörü kadrolarında çalışmakta olanlar ile daha önce en az beş yıl bu görevlerde bulunanlar, kamu idarelerinde İç Denetçi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bakanlık, Müsteşarlık, Başkanlık ve Genel Müdürlüklerde Müfettiş veya Kontrolör olanlar ile daha önce en az beş yıl bu görevlerde bulunanlar, kendi idarelerinde, özel bütçeli idarelerde, mahallî idarelerde ve sosyal güvenlik kurumlarında İç Denetçi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Muhasebe, Millî Emlak ve Vergi Denetmenleri ile bu görevlerde daha önce en az beş yıl bulunanlar, özel bütçeli idareler ile mahallî idarelerde; Belediye Müfettişi ve Hesap İşleri Murakıbı olanlar ile bu görevlerde daha önce en az beş yıl bulunanlar, mahallî idarelerde İç Denetçi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>olarak 31.12.2007 tarihine kadar atanabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>31.12.2005 tarihi itibarıyla kamu idarelerinin muhasebe hizmetlerini birinci derece sorumlu olarak yürütmekte olanlar, bulundukları kamu idarelerinin muhasebe yetkililiği görevini 1.1.2006 tarihinden itibaren sertifikalı muhasebe yetkilisi atanıncaya kadar yürütürler. Bu kişiler, sertifika alamamaları halinde kadrolarına uygun bir göreve atanırlar. Ancak, bu maddenin yürürlüğe girdiği tarihten önce saymanlık hizmetleri Maliye Bakanlığı tarafından yürütülen idarelerde muhasebe yetkilisi atanıncaya kadar muhasebe hizmetleri Maliye Bakanlığının belirleyeceği kişilerce yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(a) ve (b) bentlerinde belirtilen muhasebe yetkilisi görevini yürütmek üzere atanacak olanların Maliye Bakanlığınca verilecek meslekî eğitimden geçmeleri ve yapılacak sınavda başarı göstererek sertifika almaları şarttır. Ancak, (a) ve (b) bentlerinde sayılanlardan sınavla bu kadrolara atanmış olanların muhasebe yetkilisi olarak atanmalarında sınav şartı aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(c), (d) ve (e) bentlerinde belirtilen görevlere atananlar bu Kanunun öngördüğü sistemin uygulanmasına yönelik eğitime tâbi tutulurlar. Atamalarda ilgilinin ve idaresinin muvafakati alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kamu idarelerinde muhasebe yetkilisi görevini yürütmek üzere üçüncü fıkraya göre sertifika almış olanlar arasından muhasebe yetkilisi atanması esastır. Bu şekilde sertifika almış olanlardan atama yapılamaması halinde, Maliye Bakanlığınca sertifika almış muhasebe yetkilisi atama zorunluluğu getirilinceye kadar, Maliye Bakanlığınca belirlenen usul ve esaslara göre genel bütçe kapsamındaki kamu idarelerinde Maliye Bakanlığı, diğer kamu idarelerinde üst yöneticiler tarafından belirlenen kişiler muhasebe hizmetlerini yapmak üzere görevlendirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici" durum="mülga">
    </mvz-madde>

    </mvz-madde>

      <mvz-fıkra no="1">
        <template>İç Denetim Koordinasyon Kurulu başkan ve üyeleri, bu Kanunun yayımını izleyen iki ay içerisinde atanırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Diğer kanunlarla 1050 sayılı Muhasebei Umumiye Kanununa yapılan atıflar, bu Kanuna yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İlk kez bu Kanunla Sayıştay denetimine tâbi tutulan düzenleyici ve denetleyici kurumlar ile özel bütçeli idarelerin 31.12.2005 tarihine kadar olan işlemlerinin dış denetimi ilgili kanunlarındaki hükümlere göre yapılmaya devam edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1" durum="mülga">
        <template></template>
      </mvz-fıkra>
