    <mvz-madde no="14" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunla verilmiş olan görevlerin gerektirdiği hizmetlerin etkili ve verimli bir şekilde yerine getirilmesi amacıyla Araştırma Planlama ve Koordinasyon Kurulu, Bütçe ve Malî Kontrol Genel Müdürlüğü ve Maliye Yüksek Eğitim Merkezî Başkanlığında kullanılmak üzere, ekli (I) sayılı listede yer alan kadrolar ihdas edilerek 190 sayılı Kanun Hükmünde Kararnameye ekli (I) sayılı cetvelin Maliye Bakanlığına ait ilgili bölümlerine eklenmiş, ekli (II) sayılı listede yer alan kadrolar ise iptal edilerek anılan Kararnameye ekli (I) sayılı cetvelin Maliye Bakanlığına ait ilgili bölümünden çıkarılmıştır. Araştırma, Planlama ve Koordinasyon Kurulunda görevlendirilecek başkan yardımcısı Bakan onayı ile atanır ve bakanlıktaki genel müdür yardımcıları için ilgili mevzuatında öngörülen tüm haklardan aynen yararlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Gelir ve ödenek kaydetme yetkisi" tür="Geçici">
      <mvz-fıkra no="1">
        <template>2006 yılında, ilgili mevzuatı gereğince özel gelir kaydedilmek üzere tahsil edilen tutarlar ile 40 ıncı maddeye göre tahsil edilen bağış ve yardımları, idare bütçelerinde söz konusu mevzuatta belirtilen amaçlar için tertiplenen ödenekten kullandırmak üzere genel bütçenin (B) işaretli cetveline gelir kaydetmeye ve bütçelenen ödenekten gelir gerçekleşmesine göre ilgili tertiplere aktarma yapmaya, yılı içinde harcanmayan ödenekleri (2005 yılından devredenler de dahil) ertesi yıl bütçesine devren gelir ve ödenek kaydetmeye, bu hükümler çerçevesinde yapılacak işlemlere ilişkin esas ve usûlleri belirlemeye Maliye Bakanı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Geçici 5 inci maddenin birinci fıkrasının (c), (d) ve (e) bentlerinde belirtilen kadrolarda 31/12/2006 tarihi itibarıyla çalışmakta olanlar ile daha önce en az beş yıl bu görevde bulunanlar da anılan madde hükümlerine göre iç denetçi kadrolarına atanabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>22/12/2005 tarihli ve 5436 sayılı Kanunun 16 ncı maddesinin altıncı fıkrasına göre ihdas edilerek kamu idarelerine tahsis edilen malî hizmetler uzmanı unvanlı boş bulunan kadrolara, ilgili kamu idarelerince talep edilecek sayıyı aşmamak üzere, aşağıda belirtilen şartları taşıyan adaylar arasından 31/10/2007 tarihine kadar bir defaya mahsus olmak üzere Maliye Bakanlığınca, Öğrenci Seçme ve Yerleştirme Merkezine veya Millî Eğitim Bakanlığı Ölçme ve Değerlendirme Merkezine yaptırılacak yazılı sınav ve yerleştirme sonucuna göre atama yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yapılacak sınava girebilmek ve malî hizmetler uzmanı kadrolarına atanabilmek için;</template>
        <mvz-bent no="a">
          <template>5436 sayılı Kanunun 16 ncı maddesinin altıncı fıkrasına göre ihdas edilerek malî hizmetler uzmanı kadrosunun tahsis edildiği kamu idarelerinin;</template>
          <mvz-altbent no="1">
            <template>Strateji Geliştirme Başkanlığı, Strateji Geliştirme Daire Başkanlığı, strateji geliştirme ve malî hizmetlere ilişkin hizmetlerin yerine getirildiği müdürlükler, İdarî ve Malî İşler Dairesi Başkanlıkları, İdarî ve Malî İşler Müdürlükleri ile döner sermayeli işletmeler hariç olmak üzere idarelerin muhasebe ve malî hizmetlerinin yerine getirildiği daire başkanlıkları veya müdürlüklerinde,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Mülga Araştırma Planlama ve Koordinasyon Kurulu Başkanlıkları, Araştırma Planlama ve Koordinasyon Dairesi Başkanlıkları ile Araştırma Planlama ve Koordinasyon Müdürlüklerinde,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Maliye Bakanlığı Bütçe ve Mali Kontrol Genel Müdürlüğü ile Muhasebat Genel Müdürlüğünde, kadroları Maliye Bakanlığına ait olmak kaydıyla döner sermayeli işletmeler dahil olmak üzere muhasebe hizmetleri Maliye Bakanlığı Muhasebat Genel Müdürlüğünce yürütülen kamu idarelerinin muhasebe birimlerinde, malmüdürlüklerinin ise vezne ve muhasebe servislerinde,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>genel idare hizmetleri sınıfına dahil kadrolarda sınav tarihi itibarıyla toplam en az üç yıl hizmeti bulunmak ve malî hizmetler uzman yardımcılığı giriş sınavına katılabilmek için gerekli öğrenim şartını taşımak gerekir. Hizmet süresinin hesabında sayılan birimler adına tahsis edilmiş kadrolarda fiilen görev yapılan süreler dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sınav komisyonunun oluşturulması, sınava katılabilecekler, sınav konuları, sınav ve yerleştirme ile söz konusu kadrolara atama ve atananların eğitimine ilişkin esas ve usûller Maliye Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>5436 sayılı Kanunun geçici 2 nci maddesi ve bu madde gereğince malî hizmetler uzmanı kadrolarına atandıktan sonra en az üç yıl süreyle atandıkları idarelerde söz konusu kadrolarda görev yapanlar, kendilerinin isteği ve idarelerinin muvafakati ile başka bir kamu idaresinin aynı unvanlı kadrolarına atanabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin uygulanmasına ilişkin olarak ortaya çıkabilecek tereddütleri gidermeye Maliye Bakanlığı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>31/12/2012 tarihine kadar genel yönetim kapsamındaki kamu idarelerinin mali tabloları, muhasebe ve raporlama standartları ile muhasebe tekniğine uygunluk açısından Maliye Bakanlığınca denetlenebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>2023 yılına kadar, orman yangınları ile havadan mücadele hizmetlerinde kullanılmak maksadıyla Çevre ve Orman Bakanlığı tarafından gerçek ve tüzel kişilerden her nevi hava aracı kiralanmasında, sağlık hizmetlerinde kullanılmak maksadıyla Sağlık Bakanlığı tarafından gerçek ve tüzel kişilerden her nevi hava ve deniz aracı kiralanmasında, ülkemizde aşı ve biyolojik ürün üretimini sağlayacak ileri teknoloji transferine yönelik aşı ve biyolojik ürün temininde ve ileri teknoloji ürünü yüksek maliyetli tıbbi cihaz temininde bu Kanunun 28 inci maddesinde yer alan üç yıllık süre yedi yıla kadar, gemi hastane kiralanmasında ise on beş yıla kadar uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Eğitimde Fırsatları Artırma ve Teknolojiyi İyileştirme Hareketi (FATİH) Projesi kapsamında Millî Eğitim Bakanlığına bağlı okullara internet erişim hizmetleri ve ağ altyapısının sağlanması için Millî Eğitim Bakanlığı ve Ulaştırma, Denizcilik ve Haberleşme Bakanlığınca 2015 yılı sonuna kadar yapılacak mal ve hizmet alımları ile yapım işlerinde üst yöneticinin onayıyla 15 yıla kadar gelecek yıllara yaygın yüklenmelere girişilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="İç denetçi kadrolarına atanma" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Merkezî yönetim kapsamındaki idarelerde ve sosyal güvenlik kurumlarında mesleğe özel yarışma sınavıyla girip yeterlik sınavında başarılı olan ve başvuru tarihi itibarıyla yardımcılıkta geçen süre dâhil, denetçi, müfettiş, kontrolör, sigorta denetleme uzmanı, sigorta denetleme aktüeri, yasama uzmanı, düzenleyici ve denetleyici kurumlarda murakıp ve uzman ve 657 sayılı Devlet Memurları Kanununun 152 nci maddesinin “II-Tazminatlar” kısmının “A- Özel Hizmet Tazminatı” bölümünün (ğ) bendinde yer alanlardan merkez teşkilatına ait uzman unvanlı kadrolarda en az beş yıl çalışmış olanlar, iç denetçi aday belirleme sınavına katılabilmek için aranan yabancı dillerin birinde Yabancı Dil Bilgisi Seviye Tespit Sınavından en az elli puan almış ve bu maddenin yürürlüğe girdiği tarih itibarıyla kırk yaşını doldurmamış olmak şartıyla, kamu idarelerinin iç denetçi kadrolarına 31/12/2014 tarihine kadar atanabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamındaki idarelerde mesleğe özel yarışma sınavıyla girip yeterlik sınavında başarılı olan ve başvuru tarihi itibarıyla yardımcılıkta geçen süre dâhil mali hizmetler uzmanı olarak en az beş yıl çalışmış olanlar, iç denetçi aday belirleme sınavına katılabilmek için aranan yabancı dillerin birinde Yabancı Dil Bilgisi Seviye Tespit Sınavından en az elli puan almış ve bu maddenin yürürlüğe girdiği tarih itibarıyla kırk yaşını doldurmamış olmak şartıyla, kendi idareleri, yükseköğretim kurumları ve mahalli idarelerin iç denetçi kadrolarına 31/12/2014 tarihine kadar atanabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mesleğe özel yarışma sınavıyla girip yeterlik sınavında başarılı olan ve başvuru tarihi itibarıyla yardımcılıkta geçen süre dâhil il eğitim denetmeni, muhasebe denetmeni, millî emlak denetmeni, sosyal güvenlik denetmeni veya mahalli idarelerde müfettiş olarak en az beş yıl çalışmış olanlar, iç denetçi aday belirleme sınavına katılabilmek için aranan yabancı dillerin birinde Yabancı Dil Bilgisi Seviye Tespit Sınavından en az elli puan almış ve bu maddenin yürürlüğe girdiği tarih itibarıyla kırk yaşını doldurmamış olmak şartıyla, yükseköğretim kurumları ve mahalli idarelerin iç denetçi kadrolarına 31/12/2014 tarihine kadar atanabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Geçici 5 inci ve geçici 16 ncı maddelere göre atanan iç denetçiler, iç denetçi aday belirleme sınavına katılabilmek için aranan yabancı dillerin birinde Yabancı Dil Bilgisi Seviye Tespit Sınavından en az elli puan almış ve bu maddenin yürürlüğe girdiği tarih itibarıyla kırk yaşını doldurmamış olmak şartıyla, diğer idarelerin iç denetçi kadrolarına 31/12/2014 tarihine kadar naklen atanabilirler. Bunlar, daha önce kendilerine verilen Kamu İç Denetçi Sertifikalarını kullanmaya devam ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanun kapsamındaki idarelerde başvuru tarihi itibarıyla öğretim üyesi, tabip, diş tabibi, eczacı, veteriner, biyolog, hukuk müşaviri, Hazine avukatı, avukat, mühendis unvanlı kadrolarda en az beş yıl çalışmış olanlardan, iç denetçi aday belirleme sınavına katılabilmek için aranan yabancı dillerin birinde Yabancı Dil Bilgisi Seviye Tespit Sınavından en az elli puan almış ve bu maddenin yürürlüğe girdiği tarih itibarıyla kırk yaşını doldurmamış olanlar, belirli dönemlerde yapılacak sertifika eğitimlerine 31/12/2015 tarihine kadar doğrudan katılabilirler. Bu eğitimler sonucunda yapılacak sınavlarda başarılı olanlar kamu idarelerinin iç denetçi kadrolarına atanabilirler ve bunlara atandıkları idarede geçerli Kamu İç Denetçi Sertifikası verilir. İdarelerin ihtiyaçlarını göz önünde bulundurarak bu fıkrada sayılan unvanlar dışında ilave unvanlar belirlemeye, mühendislere ilişkin olarak lisans mezuniyetine göre bölüm şartı getirmeye, bu fıkra kapsamındaki sertifika eğitimleri ve sınavlarına ilişkin usul ve esasları belirlemeye ve idarelerin özelliklerini göz önünde bulundurarak bu fıkraya göre atananların bir başka idareye naklen atanmalarına ilişkin usul ve esasları belirlemeye İç Denetim Koordinasyon Kurulu yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Birinci, ikinci ve üçüncü fıkralara göre atananlar İç Denetim Koordinasyon Kurulu koordinatörlüğünde Maliye Bakanlığı tarafından en az iki aylık sertifika eğitimine tabi tutulur ve eğitim tamamlandıktan sonra bunlara atandıkları idarede geçerli Kamu İç Denetçi Sertifikası verilir. Fiilen en az üç yıl iç denetçilik yaptıktan sonra İç Denetim Koordinasyon Kurulu tarafından belli dönemlerde yapılacak sertifika sınavına girerek başarılı olanlara, bu Kanun kapsamındaki bütün idarelerin iç denetçi kadrolarına naklen atanmalarına imkân verecek nitelikte Kamu İç Denetçi Sertifikası verilir. Bu maddeye aykırı bir şekilde iç denetçi kadrolarına atananların atamaları ile verilmiş ise Kamu İç Denetçi Sertifikası iptal edilir. Bu maddenin uygulanmasına ilişkin usul ve esasları belirlemeye ve tereddütleri gidermeye İç Denetim Koordinasyon Kurulu yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kamu Personeli Yabancı Dil Bilgisi Seviye Tespit Sınavından veya Üniversitelerarası Kurul Yabancı Dil Sınavından en az elli puan almış olanlar da bu maddede aranan yabancı dil şartını yerine getirmiş sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
