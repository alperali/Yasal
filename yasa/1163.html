  <mvz-künye tür="kanun" no="1163" başlık="KOOPERATİFLER KANUNU"
             tarih="24/4/1969" rgazete-tarih="10/5/1969" rgazete-sayı="13195"
             düstur-tertip="5" düstur-cilt="8" düstur-sayfa="1955" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Kooperatif ve Kuruluşu">
    <mvz-b1 no="A" başlık="Tarif">
      <mvz-madde no="1" başlık="">
        <mvz-fıkra no="1">
          <template>Tüzel kişiliği haiz olmak üzere ortaklarının belirli ekonomik menfaatlerini ve özellikle meslek veya geçimlerine ait ihtiyaçlarını işgücü ve parasal katkılarıyla karşılıklı yardım, dayanışma ve kefalet suretiyle sağlayıp korumak amacıyla gerçek ve tüzel kişiler tarafından kurulan değişir ortaklı ve değişir sermayeli ortaklıklara kooperatif denir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Kuruluş, muteberlik şartları, isim kullanma yetkisi">
      <mvz-madde no="2" başlık="">
        <mvz-fıkra no="1">
          <template>Bir kooperatif en az 7 ortak tarafından imzalanacak anasözleşme ile kurulur. Anasözleşmenin ticaret sicili müdürlüğünde yetkilendirilmiş personel huzurunda imzalanması gerekir. İlgili Bakanlık faaliyet konuları itibarıyla kooperatifleri sınıflandırmaya, çalışma bölgeleri oluşturmaya, kooperatif kuruluşu için asgari ortak sayısından az olmamak üzere ortak sayısı ve kooperatif kurulmasına yönelik diğer şartlar ile usul ve esasları belirlemeye yetkilidir. Bu maddenin uygulanmasına ilişkin usul ve esaslar ilgili Bakanlık tarafından çıkarılacak tebliğ ile belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yapı kooperatifleri ile konusuna taşınmaz mal temliki dahil bulunan diğer kooperatiflerin anasözleşmelerinde ortaklara taşınmaz mal temlik edileceği hakkındaki taahhütler başka bir resmi şekil aranmaksızın muteberdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sermaye miktarı sınırlandırılarak kooperatif kurulamaz. Kooperatif adını ancak bu kanuna göre kurulmuş teşekküller kullanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kooperatifler ve üst kuruluşlarının unvanlarında, kamu kurum ve kuruluşlarının isimlerine yer verilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="İzin verme, tescil ve ilan">
      <mvz-madde no="3" başlık="">
        <mvz-fıkra no="1">
          <template>Ana sözleşme, Ticaret Bakanlığına verilir. Bakanlığın kuruluşa izin vermesi halinde, kooperatif merkezinin bulunduğu yer ticaret siciline tescil ve ilan olunur. Tescil ve ilan olunacak hususlar şunlardır:</template>
          <mvz-bent no="1.">
            <template>Ana sözleşme tarihi,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Kooperatifin amacı, konusu ve varsa süresi,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Kooperatifin unvanı ve merkezi,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Kooperatifin sermayesi ve bunun nakdi kısmına karşılık olarak ödenen en az miktar ve her ortaklık payının değeri,</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Ortaklık payı belgelerinin ada yazılı olduğu,</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Ayni sermaye ve devralınan akçalı kıymetlerle işletmelerin neden ibaret oldukları ve bunlara biçilen değerler,</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>Kooperatifin ne suretle temsil olunacağı ve denetleneceği,</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>Yönetim Kurulu üyeleriyle kooperatifi temsile yetkili kimselerin ad ve soyadları,</template>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>Kooperatifin yapacağı ilanların şekli ve anasözleşmede de bu hususta bir hüküm varsa yönetim kurulu kararlarının pay sahiplerine ne suretle bildirileceği,</template>
          </mvz-bent>
          <mvz-bent no="10.">
            <template>Kooperatifin şubeleri: Kooperatifler, lüzum gördükleri takdirde memleket içinde ve dışında şubeler açabilirler. Şubeler, merkezin sicil kaydına atıf yapılmak suretiyle bulundukları yer ticaret siciline tescil olunurlar.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ticaret Bakanlığı, ana sözleşmelerin, kanunun ihtiyari hükümlerinden ayrıldığını ileri sürerek kooperatifleri kuruluşuna izin vermekten kaçınamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Anasözleşmenin değişiklikleri de kuruluştaki usullere bağlıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Anasözleşmeye konacak hükümler">
      <mvz-b2 no="I" başlık="Mecburi hükümler">
        <mvz-madde no="4" başlık="">
          <mvz-fıkra no="1">
            <template>Kooperatif anasözleşmesinde aşağıdaki hususlara ait hükümlerin yer olması gerektir.</template>
            <mvz-bent no="1.">
              <template>Kooperatifin adı ve merkezi,</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Kooperatifin amacı ve çalışma konuları,</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Ortaklık sıfatını kazandıran ve kaybettiren hal ve şartlar,</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Ortakların pay tutarı ve kooperatif sermayesinin ödenme şekli, nakdi sermayenin en az 1/4 nün peşin ödenmesi,</template>
            </mvz-bent>
            <mvz-bent no="5.">
              <template>Ortakların ayni sermaye koyup koymıyacakları,</template>
            </mvz-bent>
            <mvz-bent no="6.">
              <template>Kooperatiflerin yükümlerinden dolayı ortakların sorumluluk durumu ve derecesi,</template>
            </mvz-bent>
            <mvz-bent no="7.">
              <template>Kooperatifin yönetici ve denetleyici organlarının görev ve yetki ve sorumlulukları ve seçim tarzları,</template>
            </mvz-bent>
            <mvz-bent no="8.">
              <template>Kooperatifin temsiline ait hükümler,</template>
            </mvz-bent>
            <mvz-bent no="9.">
              <template>Yıllık gelir gider farklarının, hesaplama ve kullanma şekilleri,</template>
            </mvz-bent>
            <mvz-bent no="10.">
              <template>Kurucuların adı, soyadı iş ve konut adresleri,</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="İhtiyari hükümler">
        <mvz-madde no="5" başlık="">
          <mvz-fıkra no="1">
            <template>Anasözleşme ayrıca aşağıdaki hususları da kapsıyabilir.</template>
            <mvz-bent no="1.">
              <template>Genel kurulun toplantısı, kararların alınması, oyların kullanılması hakkındaki hükümler;</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Kooperatifin çalışma şekline dair esaslar;</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Kooperatifin birliklerle olan münasebetleri;</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Kooperatifin diğer bir kooperatifle birleşmesine ait hükümler;</template>
            </mvz-bent>
            <mvz-bent no="5.">
              <template>Kooperatifin süresi.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Yorumlayıcı hükümler">
        <mvz-madde no="6" başlık="">
          <mvz-fıkra no="1">
            <template>5 inci maddenin 1 ve 2 nci bentlerinde yazılı hususlar hakkında anasözleşmede hüküm olmadığı takdirde aşağıdaki hükümler uygulanır.</template>
            <mvz-bent no="1.">
              <template>Genel kurul, kooperatifi temsile yetkililer tarafından imzalanan taahütlü mektuplarla veya bir mahalli gazete ve bir internet haber sitesi ile köylerde ise yazılı olarak imza karşılığı toplantıya çağrılır.</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Kooperatifin faaliyeti; kooperatifin amacı ve çalışma konusuyle sınırlıdır.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="E" başlık="Tüzel kişiliğin kazanılması ve sorumluluk">
      <mvz-madde no="7" başlık="">
        <mvz-fıkra no="1">
          <template>Kooperatif ticaret siciline tescil ile tüzel kişilik kazanır. Tescilden önce kooperatif namına işlem yapanlar bunlardan şahsan ve zincirleme olarak sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Ortaklık Sıfatının Kazanılması ve Kaybedilmesi">
    <mvz-b1 no="A" başlık="Ortaklığa girme şartları ve ek ödemeler">
      <mvz-b2 no="I" başlık="Ortaklığa girme şartları ve ortak sayısı">
        <mvz-madde no="8" başlık="">
          <mvz-fıkra no="1">
            <template>Kooperatif ortaklığına girmek için gerçek kişilerin medeni hakları kullanma yeterliliğine sahip olmaları gerekir. Ortak olmak isteyen gerçek ve tüzelkişiler, kooperatif anasözleşmesi hükümlerini bütün hak ve ödevleriyle birlikte kabul ettiklerini belirten bir yazı ile kooperatif yönetim kuruluna başvururlar.  Yönetim kurulu başvuruyu bir ay içinde sonuçlandırır ve başvuru sahibine kararı taahhütlü mektupla veya elden imza karşılığında tebliğ eder. Kooperatif, ortaklarına kendi varlığı dışında şahsi bir sorumluluk veya ek ödemeler yüklüyor ise ortak olmak isteği, bu yükümlerin yazılı olarak kabul edilmesi halinde değer taşır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yönetim Kurulu; ortaklar ile ortak olmak için müracat edenlerin anasözleşmede gösterilen ortaklık şartlarını taşıyıp taşımadıklarını araştırmak zorundadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yapı kooperatiflerinde konut, işyeri ve ortak sayısı genel kurulca belirlenir. Yönetim Kurulu, genel kurulca kararlaştırılan sayının üzerinde ortak kaydedemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kamu kaynaklarından desteklenen kredilere kefil olan kooperatifler ile kamu kaynaklı tarımsal desteklemelere aracılık yapan kooperatiflerde, yönetim kurulu anasözleşmede belirtilen şartları taşıyanları ortaklığa kabulden kaçınamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Tüzel kişilerin ortaklığı">
        <mvz-madde no="9" başlık="">
          <mvz-fıkra no="1">
            <template>Kamu ve özel hukuk tüzel kişileri amaçları bakımından ilgilendikleri kooperatiflerin kuruluşlarına yardımcı olabilir, önderlik edebilir ve ortak olabilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Ortaklığın sona ermesi">
      <mvz-b2 no="I" başlık="Ortaklıktan çıkma serbestisi - tazminat">
        <mvz-madde no="10" başlık="">
          <mvz-fıkra no="1">
            <template>Her ortağın kooperatiften çıkma hakkı vardır. Çıkma keyfiyetinin kooperatifin mevcudiyetini tehlikeye düşürmesi halinde ayrılmak istiyen ortağın, muhik bir tazminat ödenmesine dahi hüküm anasözleşmeye konulabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Ortaklıktan çıkmanın sınırlandırılması">
        <mvz-madde no="11" başlık="">
          <mvz-fıkra no="1">
            <template>Kooperatiften çıkma hakkının kullanılması, anasözleşme ile en çok 5 yıl için sınırlandırılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Haklı ve önemli sebeplerle bu süreden evvel çıkabileceği hususunda Anasözleşmeye hüküm konulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bir ortağın hiçbir suretle kooperatiften çıkamıyacağına dair bağlamalar hükümsüzdür.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Bildirme süresi ve çıkma zamanı">
        <mvz-madde no="12" başlık="">
          <mvz-fıkra no="1">
            <template>Çıkış, ancak bir hesap senesi sonu için ve en az 6 ay önceden haber verilerek yapılır. Anasözleşmede daha kısa bir süre belirtilip hesap senesi içinde çıkışa müsaade edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Ortaklıktan çıkmayı kabulden kaçınma">
        <mvz-madde no="13" başlık="">
          <mvz-fıkra no="1">
            <template>Yönetim kurulu, anasözleşmeye uygun olarak yapılacak isteğe rağmen, bir ortağın kooperatiften istifasını kabulden kaçınacak olursa, ortak çıkma dileğini noter aracılığı ile kooperatife bildirir. Bildiri tarihinden itibaren çıkma gerçekleşir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="V" başlık="Ortağın ölümü ve ortaklığın devri">
        <mvz-madde no="14" başlık="">
          <mvz-fıkra no="1">
            <template>Ortağın ölümü ile ortaklık sıfatı sona erer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Anasözleşmede gösterilecek şartlarla ölen ortağın mirasçılarının kooperatifte ortak olarak kalmaları sağlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ortaklık devredilebilir. Yönetim kurulu, ortaklığı devralan kişinin ortaklık niteliklerini taşıması halinde, bu kişiyi ortaklığa kabul eder.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="VI" başlık="Görev veya hizmetin bitmesi, taşınmaz mal veya işletme karşılığı ortaklık">
        <mvz-madde no="15" başlık="">
          <mvz-fıkra no="1">
            <template>Ortaklık sıfatı bir görev veya hizmetin yerine getirilmesine bağlı ise, bu görev veya hizmetin sona ermesi ile ortaklık sıfatı kalkar. Bu halde Anasözleşmeye hüküm konulmak suretiyle ortaklığın devamı sağlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ortaklık sıfatının kazanılması, Anasözleşme ile bir taşınmaz malın mülkiyetine bağlı hakların kullanılmasına veya bir teşebbüsün işletilmesine bağlanabilir. Bu gibi hallerde taşınmaz malın mülkiyetinin veya işletmenin üçüncü şahıslara devir veya temliki ile ortaklık sıfatının bir hak olarak yeni malike veya işletmeyi alana geçebileceğini anasözleşme hüküm altına alabilir. Taşınmaz mala ait bu şekil iktisabın üçüncü şahıslara karşı muteber olması tapu siciline bu yoldan meşruhat verilmesine bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Ortaklıktan çıkarılma esasları ve itiraz">
      <mvz-madde no="16" başlık="">
        <mvz-fıkra no="1">
          <template>Kooperatif ortaklığından çıkarılmayı gerektiren sebepler anasözleşmede açıkça gösterilir. Ortaklar anasözleşmede açıkça gösterilmeyen sebeplerle ortaklıktan çıkarılamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ortaklıktan çıkarılmaya yönetim kurulunun teklifi ile genel kurulca karar verilir. Anasözleşme, çıkarılanın genel kurula başvurma hakkı saklı kalmak üzere, bu hususta yönetim kurulunu da yetkili kılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Çıkarılma kararı gerekçeli olarak tutanağa geçirileceği gibi, ortaklar defterine de yazılır. Kararın onaylı örneği, çıkarılan ortağa tebliğ edilmek üzere, on gün içinde notere tevdi edilir. Bu ortak tebliğ tarihinden itibaren üç ay içinde itiraz davası açabilir. Tebliğ edilen karar, yönetim kurulunca verilmiş ise ortak, üç aylık süre içinde genel kurula da itiraz edebilir. Bu itiraz, ilk toplanacak genel kurula sunulmak üzere, yönetim kuruluna noter aracılığı ile tebliğ ettirilecek bir yazı ile yapılır. Genel kurula itiraz edildiği takdirde, yönetim kurulunun çıkarma kararı aleyhine itiraz davası açılamaz. İtiraz üzerine genel kurulca verilecek karara karşı itiraz davası hakkı saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Üç aylık süre içinde, genel kurula veya mahkemeye başvurmak suretiyle itiraz edilmiyen çıkarılma kararları kesinleşir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Haklarındaki çıkarma kararı kesinleşmeyen ortakların yerine yeni ortak alınamaz. Bu kişilerin ortaklık hak ve yükümlülükleri, çıkarılma kararı kesinleşinceye kadar devam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Kooperatiften çıkan veya çıkarılan ortaklarla hesaplaşma süresi ve yükümlülük">
      <mvz-madde no="17" başlık="">
        <mvz-fıkra no="1">
          <template>Kooperatiften çıkan veya çıkarılan ortakların kendilerinin yahut mirasçılarının kooperatif varlığı üzerinde hakları olup olmadığı ve bu hakların nelerden ibaret bulunduğu anasözleşmede gösterilir. Bu haklar, yedek akçeler hariç olmak üzere, ortağın ayrıldığı yıl bilançosuna göre hesaplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kooperatifin mevcudiyetini tehlikeye düşürecek nitelikteki iade ve ödemeler, anasözleşmede daha kısa bir süre tespit edilmiş olsa bile genel kurulca üç yılı aşmamak üzere geciktirilebilir. Bu durumda kooperatifin muhik bir tazminat isteme hakkı saklıdır. Çıkan veya çıkarılan ortaklar ile mirasçılarının alacak ve hakları bunları istiyebilecekleri günden başlıyarak beş yıl geçmekle zamanaşımına uğrar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Çıkan veya çıkarılan ortağın sermaye veya mevduatından kısmen veya tamamen yoksun kalacağı hakkındaki şartlar hükümsüzdür.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Ortakların Hak ve Ödevleri">
    <mvz-b1 no="A" başlık="Ortaklık senedi">
      <mvz-madde no="18" başlık="">
        <mvz-fıkra no="1">
          <template>Her ortağın üyelik haklarının, ada yazılı ortaklık senedi ile temsil olunması şarttır. Bu senede kooperatifin unvanı, sahibinin adı ve soyadı, iş ve konut adresi, kooperatife girdiği ve çıktığı tarihler yazılır. Bu hususlar, senet sahibi ile kooperatifi temsile yetkisi olan kimseler tarafından imzalanır. Ortağın yatırdığı veya çektiği paralar tarih sırasiyle kaydedilir. Bu kayıtlar kooperatifin ödediği paralara ait ise ortak imza eder. İmzalı ortak senedi makbuz hükmündedir. Mezkür senet anasözleşmeyi ihtiva etmek şartiyle ortaklık cüzdanı şeklinde de düzenlenebilir. Ortaklık senetleri kıymetli evrak niteliğinde olmayıp sadece beyyine vesikası hükmündedir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Ortaklık payları, şahsi alacaklılar">
      <mvz-madde no="19" başlık="">
        <mvz-fıkra no="1">
          <template>Kooperatife giren her şahıstan en az bir ortaklık payı alınması gerekir. Anasözleşme, en yüksek had tespit ederek bir ortak tarafından bu had dahilinde birden fazla pay alınmasına cevaz verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir ortaklık payının değeri 100 Türk lirasıdır. Kooperatife giren ortaklar en çok 5 000 pay taahhüt edebilirler. Kooperatifler üst kuruluşuna iştirak edenler ise en az 50 pay taahhüt ederler.  Ortaklık payının değeri kooperatiflerin amaç ve faaliyet konularına göre ilgili Bakanlıkça artırılabilir.  3/6/2007 tarihli ve 5684 sayılı Sigortacılık Kanunu kapsamında sigortacılık faaliyetinde bulunacak kooperatifler için en çok pay taahhüt sınırı uygulanmaz ve ortaklık payının değeri ilgili kurumun görüşü alınarak belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bir kaç pay bir ortaklık senedinde gösterilebilir. Senetle temsil edilmeyen paylar  100 Türk lirası itibar olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Her kooperatifin iştigal mevzuuna göre kredi talepleri bankalarca, müesseselerce veya şirketlerce öncelikle karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Tarımsal amaçlı kooperatiflerin yatırım faaliyetleri, ilgili bakanlıkça düzenlenen yönetmelik esasları dahilinde, bütçeden ayrılacak ödenekler yoluyla verilecek düşük faizli kredilerle desteklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bir ortağın şahsi alacaklıları, ancak ortağa ait faiz ve gelir-gider farklarından hissesine düşen miktarı ve kooperatifin dağılmasında ona ödenecek payı haczettirebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Ayni sermaye">
      <mvz-madde no="20" başlık="">
        <mvz-fıkra no="1">
          <template>Ayn nevinden sermaye konması veya kooperatifin mevcut bir işletmeyi veya aynları devralması sözleşme ile kabul edilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    
      <mvz-b3 no="1" başlık="Değer biçme, bilirkişi">
        <mvz-madde no="21" başlık="">
          <mvz-fıkra no="1">
            <template>Anasözleşmede aynların değeri tespit edilmemiş ise, bu tespit kurucular tarafından toplantıya çağrılacak ilk genel kurulda ortak adedinin 2/3 ünü temsil eden ortakların çoğunluğu ile seçilecek bilirkişi tarafından yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kuruluştan sonra girecek ortakların ayn nevinden sermaye koymaları halinde bu çağrı yönetim kurulu tarafından yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ortakların, 2/3 ünü birleşmesi mümkün olmıyan hallerde bilirkişinin seçimi sulh hukuk mahkemesinden istenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Seçilen bilirkişi veya bilirkişiler tarafından verilen rapora karşı tebliğ tarihinden itibaren bir hafta içinde mahalli sulh hukuk mahkemesine itiraz edebilirler. Mahkemenin vereceği karar kesindir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b3>
      <mvz-b3 no="2" başlık="Karar nisabı, raporların kabulü">
        <mvz-madde no="22" başlık="">
          <mvz-fıkra no="1">
            <template>21 inci madde gereğince atanan bilirkişi, gereken raporları düzenleyip verdikten sonra yapılacak genel kurul toplantısında, konu görüşülür. Çağrı mektuplarına bilirkişi raporunun bir örneği eklenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ortak sayısının en az yarısının asaleten ve temsilen toplantıda bulunması şartiyle bilirkişi raporları okunup incelendikten ve gereğinde ayn nevinden sermaye koyan kimselerin ve devralınacak işletmenin veya aynların sahibinin açıklamaları dinlendikten sonra değerlerinin aynen kabul veya reddine, yahut ilgililerin muvafakatiyle değerlendirilmesine çoğunlukla karar verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b3>
    
    <mvz-b1 no="Ç" başlık="Hak ve vecibelerde eşitlik">
      <mvz-madde no="23" başlık="">
        <mvz-fıkra no="1">
          <template>Ortaklar bu kanunun kabul ettiği esaslar dahilinde hak ve vecibelerde eşittirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    
      <mvz-b3 no="1" başlık="Bilgi edinmek hakkı, bilanço">
        <mvz-madde no="24" başlık="">
          <mvz-fıkra no="1">
            <template>Yönetim kurulu yıllık faaliyet raporu, bilanço, gelir-gider farkı hesapları ve denetçilerin 66 ncı ve 69 uncu madde hükümlerine uygun olarak tanzim edecekleri raporlar, genel kurulun yıllık toplantısından en az 15 gün öncesinden itibaren bir yıl süre ile kooperatif merkezinde, varsa şubelerinde ve elektronik ortamda KOOPBİS’te ortakların tetkikine amade tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kooperatif ortaklarına KOOPBİS üzerinden, genel kurula katılma hakkını haiz ortakları gösterir listeye erişim yetkisi verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ortakların bilgi edinmek hakkı, anasözleşme veya kooperatif organlarından birinin karariyle bertaraf edilemez veya sınırlandırılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Madde kapsamında elde edilen kişisel veriler sadece ortakların kooperatif iş ve işlemlerinden haberdar olmaları ve kooperatif organlarında görev almak isteyen adayların kooperatif ortaklarına ulaşabilmeleri amaçlarıyla kullanılabilir. Elde edilen veriler 24/3/2016 tarihli ve 6698 sayılı Kişisel Verilerin Korunması Kanununa aykırı olarak kullanılamaz, aktarılamaz veya başka bir şekilde işlenemez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b3>
      <mvz-b3 no="2" başlık="Ticari defterler ve sır saklama hükümleri ve ceza">
        <mvz-madde no="25" başlık="">
          <mvz-fıkra no="1">
            <template>Kooperatifin ticari defterleri ve haberleşme ile ilgili hususların tetkiki, genel kurulun açık bir müsaadesi veya yönetim kurulunun kararı ile mümkündür. İncelenmesine müsaade edilen defter ve vesikalardan öğrenilecek sırlar hariç olmak üzere, hiçbir ortak kooperatifin iş sırlarını öğrenmeye yetkili değildir. Her ortak ne suretle olursa olsun öğrenmiş olduğu kooperatife ait iş sırlarını, sonradan ortaklık hakkını kaybetmiş olsa dahi daima gizli tutmak zorundadır. Bu mecburiyete uymıyan ortak meydana gelecek zararlardan kooperatife karşı sorumlu olduğu gibi kooperatifin şikayeti üzerine herhangi bir zarar umulmasa dahi bir yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b3>
      <mvz-b3 no="3" başlık="Genel kurul toplantılarına katılma hakkı">
        <mvz-madde no="26" başlık="">
          <mvz-fıkra no="1">
            <template>Üç ay evvel ortak olmayanlar hariç her ortak genel kurula katılma hakkına sahiptir. Yapı kooperatiflerinde genel kurul toplantılarına katılmak için bu şart aranmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b3>
    
    <mvz-b1 no="D" başlık="Ortakların ödev ve sorumlulukları">
      <mvz-b2 no="I" başlık="Süre ve ortaklığın yok olması">
        <mvz-madde no="27" başlık="">
          <mvz-fıkra no="1">
            <template>Ortakların yüklendikleri paylar için ödiyebilecekleri para tutarını anasözleşme belirtir. Kooperatif, sermaye yüklemlerinde borçlu veya sair ödemelerle yükümlü bulunan ortaklarından elden yazılı olarak veya taahhütlü mektupla, bu husus mümkün olmazsa ilanla ve münasip bir süre belirterek yükümlerini yerine getirmelerini ister.  İlk isteğe uymıyan ve ikinci  istemeden sonra da bir ay içinde yükümlerini yerine getirmiyenlerin ortaklığı kendiliğinden düşer. Ortaklığın düşmesi alakalının, anasözleşme veya diğer suretlerle doğmuş borçlarının yok olmasını gerektirmez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Kooperatifin sorumluluğu">
        <mvz-madde no="28" başlık="">
          <mvz-fıkra no="1">
            <template>Anasözleşmede aksine hüküm olmadıkça kooperatif, alacaklılarına karşı yalnız mamelekiyle sorumludur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      
        <mvz-b3 no="1" başlık="Sınırsız sorumluluk">
          <mvz-madde no="29" başlık="">
            <mvz-fıkra no="1">
              <template>Anasözleşme, kooperatifin varlığı borçlarını karşılamaya yetmediği hallerde, ortaklarının da şahsan ve sınırsız olarak sorumlu tutulacaklarını hüküm altına alabilir. Bu takdirde alacaklılar kooperatifin iflası veya diğer sebeplerle dağılması halinde alacaklarını tamamen sağlıyamazlarsa, kooperatifin borçlarından dolayı, kooperatif ortakları zincirleme ve bütün varlıklariyle sorumlu olurlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Sınırlı sorumluluk">
          <mvz-madde no="30" başlık="">
            <mvz-fıkra no="1">
              <template>Anasözleşmeye, kooperatif borçları için her ortağın kendi payından fazla olarak şahsan ve belirli bir miktara kadar kooperatiften sonra sorumlu olacakları hususunda bir hüküm konabilir. Ortakların tek başına sorumlu olacakları miktar kooperatifteki paylarının tutarı ile orantılı olarak da gösterilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İflasın sonuna kadar bu sorumluluk iflas idaresi tarafından ileri sürülür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Ek ödeme yüklemi">
          <mvz-madde no="31" başlık="">
            <mvz-fıkra no="1">
              <template>Anasözleşme, ortakları ek ödemelerle yükümlendirebilir. Ancak, ek ödemelerin yalnız bilanço açıklarını kapatmada kullanılması şarttır. Ek ödeme yükleme sınırsız olabileceği gibi belirli miktarlarla veya iş hacmi ile veya paylarla orantılı olarak sınırlandırılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kooperatifin iflası halinde ek ödemeleri isteme hakkı iflas idaresinindir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="4" başlık="Caiz olmayan sınırlama">
          <mvz-madde no="32" başlık="">
            <mvz-fıkra no="1">
              <template>Sorumluluğu belirli bir zamana bırakan veya bazı ortak grublarına yükleyen anasözleşme hükümleri muteber değildir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="5" başlık="İflas halinde usul">
          <mvz-madde no="33" başlık="">
            <mvz-fıkra no="1">
              <template>Ortakları şahsan sorumlu bulunan veya ek ödemelerle yükümlü olan bir kooperatifin iflası halinde, iflas idaresi sıra cetvelini düzenlemekle beraber ortaklardan her birinin payına düşen borcun ödenmesini kendilerinden ister.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Tahsil olunamıyan meblağlar diğer ortaklar arasında bölüşülür. Aktif bakiyesi pay cetvellerinin kesin olarak tespiti üzerine geri verilir. Ortakların birbirlerine rücu hakları saklıdır. Ortakların geçici olarak tespit olunan borçlariyle pay cetveli aleyhine İcra ve İflas Kanunu hükümlerine göre itiraz hakları vardır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="6" başlık="Sorumluluk hükümlerinin değiştirilmesi">
          <mvz-madde no="34" başlık="">
            <mvz-fıkra no="1">
              <template>Ortakların sorumluluğu ve ek ödemeler yükümleri ile ilgili değiştirmeler ancak anasözleşmenin tadili ile mümkündür.Sorumluluk ve ek ödeme yükümleri konulması veya bunların artırılması,bu husustaki kararın tescili ile kooperatifin bütün alacakları lehine hüküm ifade eder. Sorumluluğun azaltılması hakkındaki kararlar, tescilden evvel doğmuş borçları kapsamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="7" başlık="Kooperatife yeni giren ortakların sorumluluğu">
          <mvz-madde no="35" başlık="">
            <mvz-fıkra no="1">
              <template>Ortakları şahsan sorumlu, veya ek ödemelerle yükümlü bir kooperatifte, durumunu bilerek yeni giren kimse, girişinden önce doğmuş olan borçlardan diğer ortaklar gibi sorumlu olur. Buna aykırı mukavele hükümleriyle ortaklar arasındaki anlaşmalar üçüncü şahıslar hakkında hüküm ifade etmez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="8" başlık="Bir ortağın ayrılmasından veya kooperatifin dağılmasından sonra sorumluluk">
          <mvz-madde no="36" başlık="">
            <mvz-fıkra no="1">
              <template>Sınırsız veya sınırlı sorumlu bir ortak ölür veya diğer bir sebeple kooperatiften ayrılışının kesinleştiği tarihten başlıyarak bir yıl veya anasözleşme ile tespit olunan daha uzun bir süre içinde kooperatif iflas ettiği takdirde, ayrılmasından önce doğmuş olan borçlar için ortak sorumluluktan kurtulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Aynı şartlar altında veya aynı süre içinde ek ödeme yükümü de mevcut olmakta devam eder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bir kooperatif dağılırsa, dağılmanın Ticaret Siciline tescilinden başlıyarak bir yıl veya anasözleşmede tespit olunan daha uzun bir süre içinde kooperatifin iflasının açılmasına karar verilmesi halinde ortaklar aynı şekilde ek ödemelerle birlikte sorumludurlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="9" başlık="Sorumlulukta zamanaşımı">
          <mvz-madde no="37" başlık="">
            <mvz-fıkra no="1">
              <template>Alacaklıların, ortakların şahsi sorumluluklarından doğan isteme hakları, daha önce kanuni bir hüküm gereğince düşmedikçe iflas işlemlerinin sona ermesinden başlıyarak daha bir yıl süre ile alacaklılardan her biri tarafından ileri sürülebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ortakların birbirine olan rücu hakları da bu hakka vücut veren ödemenin yapıldığı andan başlamak üzere bir yıl içinde zamanaşımına uğrar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Kooperatif Hesapları">
    <mvz-b1 no="A" başlık="Gelir gider farkları, bölünmesi ve paylara faiz verilmesi">
      <mvz-madde no="38" başlık="">
        <mvz-fıkra no="1">
          <template>Anasözleşmede aksine hüküm bulunmadığı takdirde ortaklarla yapılan muamelelerden bir yıllık faaliyet sonunda elde edilen hasılanın tamamı gelir gider farkı olarak kooperatifin yedek akçelerine eklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gelir gider farkının ortaklar arasında bölüşülmesi öngörülmüş ise bu bölünme ortakların muameleleri oranında yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gelir-gider farkının en az % 50'si ortaklara dağıtıldıktan sonra, ortakların sermaye paylarına genel kurul kararı ile Devlet Tahvillerine verilen en yüksek faiz haddini geçmemek üzere faiz ödenebileceği anasözleşme ile hükme bağlanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ortak dışı işlemlerden elde edilen hasılanın ortaklara sermaye payları oranında dağıtılabileceği anasözleşmede hükme bağlanabilir. Dağıtılmadığı takdirde, bunlar kooperatifin gelişmesine yarayacak işlerde kullanılmak üzere özel bir fonda toplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bir yıllık faaliyet neticeleri menfi olduğu takdirde açık, yedek akçelerden ve bunların kafi gelmemesi halinde ek ödemelerle veya ortak sermaye paylariyle karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Menfi neticeler ortadan kaldırılmadıkça gelir gider farkı ve faiz dağıtımı yapılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Yedek akçe ayırımı">
      <mvz-madde no="39" başlık="">
        <mvz-fıkra no="1">
          <template>Gelir-gider farkının en az % 10'u yedek akçeye, kooperatif üst kuruluşlarında ise buna ilaveten en az % 5'i fevkalade yedek akçeye ayrılmadıkça ortaklara dağıtım yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yedek akçelerin ortaklara dağıtılacağına dair anasözleşmeye konacak hükümler muteber değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Ortak ve personel için yardım fonları">
      <mvz-madde no="40" başlık="">
        <mvz-fıkra no="1">
          <template>Anasözleşme gerek kooperatifin memurları ile işçileri, gerekse kooperatifin ortakları için yardım kuruluşları vücuda getirmek ve bunları işletmek amacı ile yardım fonları kurulmasını hüküm altına alabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yardım amacı için ayrılan kıymetler belirli ise, bunlar kooperatifin mamelekinden ayrılarak tahsis edildiği amaçlar için kullanılmak üzere özel bir hesaba alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Gelir gider farkından ilk ayrılacak fonlar">
      <mvz-madde no="41" başlık="">
        <mvz-fıkra no="1">
          <template>Bölünecek gelir gider farkından ilk önce yedek akçe ile kanun veya anasözleşme gereğince kurulan diğer fonlara yatırılacak paralar ayrılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yedek akçelerin ve özel fonların kullanılış şekil ve şartları anasözleşmede gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>

  <mvz-bölüm no="5-BEŞİNCİ" başlık="Kooperatif Organları">
    <mvz-b1 no="A" başlık="Genel kurul">
      <mvz-b2 no="I" başlık="Yetki">
        <mvz-madde no="42" başlık="">
          <mvz-fıkra no="1">
            <template>Genel Kurul bütün ortakları temsil eden en yetkili organdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Genel Kurul, aşağıdaki yetkilerini devir ve terk edemez.</template>
            <mvz-bent no="1.">
              <template>Anasözleşmeyi değiştirmek,</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Yönetim Kurulu ve Denetçiler Kurulu üyeleriyle gerektiğinde tasfiye kurulunu seçmek,</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>İşletme hesabiyle bilanço ve gerektiğinde gelir gider farkının bölüşülmesi hakkında karar almak,</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Yönetim ve denetçiler kurullarını ibra etmek,</template>
            </mvz-bent>
            <mvz-bent no="5.">
              <template>Kanun veya anasözleşme ile Genel Kurula tanınmış olan konular hakkında karar vermek.</template>
            </mvz-bent>
            <mvz-bent no="6.">
              <template>Gayrimenkul alımında ve satımında takip edilecek usul ile alınacak gayrimenkulün niteliğini, yerine ve azami fiyatını, satılacak gayrimenkulün asgari fiyatını belirlemek.</template>
            </mvz-bent>
            <mvz-bent no="7.">
              <template>İmalat ve inşaat işlerinin yaptırılma yöntemini belirlemek.</template>
            </mvz-bent>
            <mvz-bent no="8.">
              <template>Yapı kooperatiflerinde; kooperatifin ortak sayısı ile yapılacak konut veya işyeri sayısını tesbit etmek.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Çağrı">
        <mvz-b3 no="1" başlık="Çağrıya yetkisi olanlar">
          <mvz-madde no="43" başlık="">
            <mvz-fıkra no="1">
              <template>Yönetim kurulu veya anasözleşme ile bu hususta yetkili kılınan diğer bir organ ve gerektiğinde denetçiler kurulu, ortağı olduğu üst birlik ve tasfiye memurları genel kurulu toplantıya çağırma yetkisine sahiptirler. Ancak genel kurul yukarıda belirtildiği şekilde toplanamadığı takdirde ilgili bakanlık genel kurulu toplantıya çağırma yetkisine sahiptir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Ortakların isteği, bakanlıkların çağrısı, mahkemenin izni">
          <mvz-madde no="44" başlık="">
            <mvz-fıkra no="1">
              <template>Dört ortaktan az olmamak kaydıyle ortak sayısının en az onda birinin isteği üzerine Genel Kurul toplantıya çağrılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yönetim Kurulu bu isteği en az on gün içinde yerine getirmediği takdirde, istek sahiplerinin müracaatı üzerine veya doğrudan doğruya Ticaret Bakanlığı tarafından, yapı kooperatiflerinde de İmar ve İskan Bakanlığı tarafından Genel Kurul toplantıya çağrılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Çağrılmadığı takdirde istek sahipleri mahalli mahkemeye başvurarak Genel Kurulu bizzat toplantıya çağırma müsaadesini alabilirler.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Şekil">
          <mvz-madde no="45" başlık="">
            <mvz-fıkra no="1">
              <template>Genel kurul olağan ve gerektiğinde olağanüstü olarak toplanır. Olağan toplantının her hesap devresi sonundan itibaren 6 ay içinde ve en az yılda bir defa yapılması zorunludur.  Ancak, usul ve esasları ilgili Bakanlıkça yapılacak düzenlemede gösterilmek üzere; kooperatif üst kuruluşuna ortak olunması ve genel kurul toplantısının gündemine konuyla ilgili madde konulması şartıyla, olağan genel kurul toplantıları en fazla iki hesap dönemini kapsayacak şekilde ve birleştirilerek yapılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Genel kurul, anasözleşmede gösterilen şekil ve surette toplantıya çağrılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Toplantı nisabı anasözleşmede gösterilir. Ancak yapı kooperatiflerinin genel kurul toplantılarında ortakların en az 1/4'ünün şahsen veya temsilen hazır bulunmaları şarttır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Genel kurul toplantı tarihi, yeri ve gündemi toplantıdan en az 15 gün önce ilgili bakanlığa ve mülki idare amirliğine yazılı olarak bildirilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Genel kurulun sevk ve idaresi, ortaklar veya üst kuruluş temsilcileri arasında seçilen başkan ve üyeler tarafından sağlanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Genel kurul toplantısına, yönetim kurulu tarafından KOOPBİS’ten alınan ortaklar listesinde adı bulunanlar katılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Genel kurul toplantısı anasözleşmede hüküm bulunması şartıyla elektronik ortamda da yapılabilir. Genel kurullara elektronik ortamda katılma, öneride bulunma, görüş açıklama ve oy verme, fiilen katılmanın ve oy vermenin bütün hukuki sonuçlarını doğurur. Bu hükmün uygulama esasları ile genel kurula elektronik ortamda katılmaya ve oy vermeye ilişkin anasözleşme hükmü örneği Ticaret Bakanlığınca çıkarılan yönetmelikle belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Gündem">
        <mvz-madde no="46" başlık="">
          <mvz-fıkra no="1">
            <template>Toplantı çağrısına ve ilana gündem yazılır. Anasözleşmenin değiştirilmesi bahis konusu ise, yapılacak ilanda değiştirilecek maddelerin numaralarının yazılması ile yetinilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dörtten az olmamak üzere ortakların en az 1/10'u tarafından genel kurul toplantısından en az 20 gün önce yazılı olarak bildirilecek hususların gündeme konulması zorunludur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Gümdemde olmayan hususlar gürüşülemez. Ancak, kooperatife kayıtlı ortakların en az 1/10'unun gündem maddelerinin görüşülmesine geçilmeden önce yazılı teklifte bulunmaları halinde, hesap tetkik komisyonunun seçilmesi, bilanço incelemesinin ve ibranın geriye bırakılması, çıkan veya çıkarılan ortaklar hakkında karar alınması, genel kurulun yeni bir toplantıya çağrılması ve kanun, anasözleşme ve iyiniyet esasları ile genel kurul kararlarına aykırı olduğu ileri sürülen yönetim kurulu kararlarının iptali, yönetim kurulu üyeleri ile denetçilerin azli ve yerlerine yenilerinin seçilmesi ile ilgili hususlar, genel kurula katılanların yarıdan bir fazlasının kabulü ile gündeme alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Bütün pay sahiplerinin hazır bulunması hali">
        <mvz-madde no="47" başlık="">
          <mvz-fıkra no="1">
            <template>Kooperatifin bütün ortakları toplantıda hazır bulunduğu sürece ve bir itiraz olmadığı takdirde Genel Kurul toplantılarına dair olan diğer hükümler saklı kalmak şartiyle toplantıya çağrı hakkındaki hükümlere uyulmamış olsa dahi kararlar alınabilir. Bu gibi kararların, ortaklar veya ortakların toptantıda oy birliği ile seçecekleri temsilciler tarafından imzalanması gereklidir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="V" başlık="Oy hakkı">
        <mvz-b3 no="1" başlık="Genel olarak">
          <mvz-madde no="48" başlık="">
            <mvz-fıkra no="1">
              <template>Genel Kurulda her ortak yalnız bir oya sahiptir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Esnaf ve sanatkârlar kredi ve kefalet kooperatifleri hariç olmak üzere, ortak sayısı 500’den fazla olan kooperatiflerin ve üst kuruluşlarının genel kurul toplantılarındaki yönetim ve denetim kurulu belirleme seçimleri, gizli oy açık tasnif esasına göre yapılır. Kooperatiflerin organ seçimlerinde her ortak, en fazla bir ortağı temsilen oy kullanabilir. Anasözleşmelerin bu fıkraya aykırı hükümleri uygulanmaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Temsil">
          <mvz-madde no="49" başlık="">
            <mvz-fıkra no="1">
              <template>Anasözleşmede açıklama bulunduğu takdirde, bir ortak yazı ile izin vermek suretiyle Genel Kurul toplantısında oyunu ancak başka bir ortağa kullandırabilir. Bir ortak Genel Kurulda birden fazla ortağı temsil edemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Üye sayısı 1000 in üstünde olan kooperatiflerde anasözleşme ile her ortağın en çok 9 olmak üzere birden fazla başka ortağı temsil edebileceği öngörülebilir. Eş ve birinci derecede akrabalar için temsilde ortaklık şartı aranmaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Oya katılamayacaklar">
          <mvz-madde no="50" başlık="">
            <mvz-fıkra no="1">
              <template>Kooperatif işlerinin görülmesine herhangi bir suretle katılmış olanlar Yönetim Kurulunun ibrasına ait kararlarda oylamaya katılamazlar. Bu hüküm denetçiler hakkında uygulanmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ortaklardan hiçbiri kendisi veya karı ve kocası yahut usul ve füruu ile kooperatif arasında şahsi bir işe veya davaya dair olan görüşmelerde oy hakkını kullanamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="VI" başlık="Kararlar">
        <mvz-b3 no="1" başlık="Genel olarak">
          <mvz-madde no="51" başlık="">
            <mvz-fıkra no="1">
              <template>Kanun veya anasözleşmede aykırı hüküm bulunmadıkça Genel Kurul kararlarında ve seçimlerde oyların yarıdan bir fazlasına itibar olunur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kooperatifin dağılması veya diğer bir kooperatifle birleşmesi ve anasözleşmenin değiştirilmesi kararlarında fiilen kullanılan oyların 2/3 ü çoğunluğu gereklidir. Anasözleşme, bu kararların alınması için oy çoğunluğu hakkında daha ağır hükümler koyabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Ortakların paylarının artırılması">
          <mvz-madde no="52" başlık="">
            <mvz-fıkra no="1">
              <template>Ortakların şahsi sorumluluklarının ağırlaştırılması veya ek ödeme yükümleri ihdası hakkında alınacak kararlar için bütün ortakların 3/4'ünün rızası gereklidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ancak, kamu kuruluşlarından kredi alan kooperatiflerin kredi miktarının artırılmasından yararlanmak üzere alacakları kararlarda bu şart aranmaz ve 51 inci maddenin birinci fıkrası hükmü uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kararlar, ilandan başlayarak üç ay içinde kooperatiften çıktıklarını bildirmeleri halinde bunlara katılmayan ortakları bağlamaz. Bu takdirde kooperatiften çıkma beyanı, kararın yürürlüğe girdiği tarihten başlamak üzere hüküm ifade eder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bu suretle kooperatiften çıkma hakkının kullanılması, bir ayrılma tazminatı ödenmesine bağlı kılınamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Kararların bozulması ve şartlar">
          <mvz-madde no="53" başlık="">
            <mvz-fıkra no="1">
              <template>Aşağıda yazılı kimseler kanuna, anasözleşme hükümlerine ve iyi niyet esaslarına aykırı olduğu iddiası ile Genel Kurul kararları aleyhine, toplantıyı kovalayan günden başlamak üzere bir ay içinde, kooperatif merkezinin bulunduğu yerdeki mahkemeye başvurabilirler.</template>
              <mvz-bent no="1.">
                <template>Toplantıda hazır bulunup da kararlara aykırı kalarak keyfiyeti tutanağa geçirten veya oyunu kullanmasına haksız olarak müsaade edilmiyen yahut toplantıya çağrının usulü dairesinde yapılmadığını veyahut gündemin gereği gibi ilan veya tebliğ edilmediğini yahut da Genel Kurul toplantısına katılmaya yetkili olmıyan kimselerin karara katılmış bulunduklarını iddia eden pay sahipleri;</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Yönetim Kurulu;</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Kararların yerine getirilmesi Yönetim Kurulu üyeleri ile denetçilerin şahsi sorumluluklarını mucip olduğu takdirde bunların her biri;</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bozma davasının açıldığı ve duruşmanın yapılacağı gün, Yönetim Kurulu tarafından usulen ilan olunur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Birinci fıkrada yazılı bir aylık hak düşüren sürenin sona ermesinden önce duruşmaya başlanılamaz. Birden fazla bozma davası açıldığı takdirde, davalar birleştirilerek görülür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Mahkeme, kooperatifin isteği üzerine muhtemel zararlarına karşı davacıların teminat göstermesine karar verebilir. Teminatın mahiyet ve miktarını belirtmek mahkemeye aittir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Bir kararın bozulması bütün ortaklar için hüküm ifade eder.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="4" başlık="Mektupla oy verme ve temsilciler toplantısı">
          <mvz-madde no="54" başlık="">
            <mvz-fıkra no="1">
              <template>Ortak sayısı 1000 den fazla olan kooperatiflerde, anasözleşmelerine kayıt konulmak suretiyle:</template>
              <mvz-bent no="1.">
                <template>Genel Kurula ait kararlardan, hepsinin veya bir kısmının ortakların oylarını mektupla bildirmeleri suretiyle verilmesi,</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Ortakların gruplara ayrılarak verecekleri kararlarla tespit edecekleri talimat gereğince oy vermek üzere kendi aralarından seçecekleri temsilciler topluluğu,</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>Genel Kurul sayılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Mektupla oy bildirme halinde, mektupların, Yönetim Kurulu ve bakanlık temsilcisi önünde incelenmesi sonunda muhtevanın neden ibaret olduğu tespit edilerek tutanağa yazılır. Hazır bulunanlar tarafından imza edilen tutanağa göre verildiği anlaşılan karar yürürlüğe girer.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Grup temsilcileri genel kurulunda her temsilci, temsil ettiği ortakların sayısı kadar oya sahiptir. Temsilcinin aldığı talimata aykırı olarak oy vermesi karara tesir etmez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Yönetim kurulu">
      <mvz-b2 no="I" başlık="Ödevi ve üye sayısı">
        <mvz-madde no="55" başlık="">
          <mvz-fıkra no="1">
            <template>Yönetim Kurulu, kanun ve anasözleşme hükümleri içinde kooperatifin faaliyetini yöneten ve onu temsil eden icra organıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yönetim Kurulu en az üç üyeden kurulur. Bunların ve yedeklerinin kooperatif ortağı olmaları şarttır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Çalışma konusu, ortak sayısı ve ciro gibi kıstaslara göre belirlenen kooperatiflerin yönetim kurulu üyeleri ve yedeklerinin, seçilmelerini takiben en geç dokuz ay içinde kooperatifçilik eğitim programını tamamlamaları şarttır. Eğitim programına ilişkin usul ve esaslar ile buna tabi olacak kooperatifler ilgili bakanlıkların görüşü alınarak Ticaret Bakanlığınca çıkarılan yönetmelikle belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yönetim Kurulu üyeliğine seçilen tüzel kişiler, temsilcilerinin isimlerini kooperatife bildirir.  Üçüncü fıkra, tüzel kişi üyelerin temsilcileri hakkında da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Üyelik şartları ve ücret">
        <mvz-madde no="56" başlık="">
          <mvz-fıkra no="1">
            <template>Yönetim kurulu üyelerinde aşağıdaki şartlar aranır.</template>
            <mvz-bent no="1.">
              <template>Türk vatandaşı olmak.</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Amacı ve esas faaliyet konusu aynı olan başka bir kooperatifin yönetim kurulu üyesi olmamak.</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar,  zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından ya da bu Kanun hükümlerine göre mahkum olmamak.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Üyelik şartları denetçiler tarafından araştırılır. Bu şartları taşımadıkları halde seçilenler ile sonradan kaybedenlerin görevlerine yönetim kurulunca son verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Haklarında yukarıdaki suçlarla ilgili olarak kamu davası açılmış olanların görevleri ilk genel kurul toplantısına kadar devam etmekle beraber, yönetim kurulunca bu durumdaki üyelerin genel kurulca azli veya göreve devamı hakkında karar alınmak üzere yapılacak ilk genel kurul gündemine madde konulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu veya anasözleşmede gösterilecek diğer bir sebeple yönetim kurulu toplantı nisabını kaybederse, boşalan yönetim kurulu üyeliklerine denetim kurulu üyeleri tarafından gecikilmeksizin yeteri kadar yedek üye çağrılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yönetim kurulu üyelerinden bir veya bir kaç kooperatifi temsil yetkisini haiz murahhas üye seçilebilir. Murahhas üyelerin seçilmesi ve değiştirilmesi Ticaret Siciline tescil ettirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Yönetim kurulu üyelerine genel kurulca belirlenen aylık ücret, huzur hakkı, risturn ve yolluk dışında hiç bir ad altında başkaca ödeme yapılamaz.  Kamu kaynaklarından desteklenen kredilere kefil olan kooperatifler ile kamu kaynaklı tarımsal desteklemelere aracılık yapan kooperatiflerin yönetim kurulu üyeleri, bunların ortağı olduğu üst kuruluşlarda görev alsalar dahi yalnızca bir ücret veya huzur hakkı alabilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Üyelik süresi">
        <mvz-madde no="57" başlık="">
          <mvz-fıkra no="1">
            <template>Yönetim Kurulu üyeleri en çok 4 yıl için seçilebilirler. Anasözleşmede aksine hüküm yoksa tekrar seçilmeleri caizdir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Yönetim ve temsil">
        <mvz-b3 no="1" başlık="Yetkilerin devri">
          <mvz-madde no="58" başlık="">
            <mvz-fıkra no="1">
              <template>Anasözleşme, Genel Kurula veya Yönetim Kuruluna, kooperatifin yönetimini ve temsilini kısmen veya tamamen kooperatif ortağı bulunmaları şart olmıyan bir veya birkaç müdüre veya Yönetim Kurulu üyesine tevdi etmek yetkisini verebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Şümulü ve sınırlandırılması">
          <mvz-madde no="59" başlık="">
            <mvz-fıkra no="1">
              <template>Temsile yetkili şahıslar kooperatif namına onun amacının gerektirdiği bütün hukuki işlemleri yapabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu temsil yetkisinin sınırlandırılması iyi niyet sahibi üçüncü şahıslara karşı hiçbir hüküm ifade etmez. Temsil yetkisinin sadece esas müessesenin veya bir şubenin işlerine hasrolunmasına veya kooperatif unvanının birlikte kullanılmasına dair ticaret siciline tescil edilmiş olan kayıtlar saklıdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Yönetime veya temsile yetkili şahısların kooperatife ait görevlerini yürütmeleri esnasında meydana getirdikleri haksız fiillerden doğan zararlardan kooperatif sorumludur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Kooperatiflerce alınması kararlaştırılan gayrimenkullerin alımının, tapu devri veya tapuya şerh verdirilecek bir satış vaadi sözleşmesi ile yapılması şarttır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Alınacak gayrimenkullün kooperatifin amacına uygun olması gerekir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Yönetim kurulu üyeleri ve kooperatif personeli ortaklık işlemleri dışında kendisi veya başkası namına, bizzat veya dolaylı olarak kooperatifle kooperatif konusuna giren bir ticari muamele yapamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Kooperatif ve üst kuruluşlarca tanıtma ve ortak kaydetmek amacıyla yapılacak ilan, reklam ve açıklamalar, eksik ve gerçeğe aykırı olamayacağı gibi, yanıltıcı bilgi ve unsurlar taşıyamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="8">
              <template>Yönetim kurulu üyeleri ve temsile yetkili şahıslar, genel kurulun devredemeyeceği yetkilerini kullanamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="İmza">
          <mvz-madde no="60" başlık="">
            <mvz-fıkra no="1">
              <template>Kooperatifi temsile yetkili kılınan kimseler imzalarını ancak kooperatifin unvanı altına koymak suretiyle kooperatifi bağlarlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="4" başlık="Tescil">
          <mvz-madde no="61" başlık="">
            <mvz-fıkra no="1">
              <template>Kooperatif yönetim kurulu, kooperatifi temsile yetkili kılınan kimselerin isimlerini ve imzalarını ticaret siciline bildirir ve bu yetkiye dayanak olan kararları ticaret sicili müdürlüğünde yetkilendirilmiş personele tasdik ettirir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="5" başlık="Üyelerin titizlik derecesi ve sorumlulukları">
          <mvz-madde no="62" başlık="">
            <mvz-fıkra no="1">
              <template>Yönetim Kurulu, kooperatif işlerinin yönetim için gereken titizliği gösterir ve kooperatifin başarısı ve gelişmesi yolunda bütün gayretini sarf eder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yönetim kurulu; kendi tutanakları, genel kurul tutanakları, ortak listeleri, gelir-gider hesapları ve yıllık bilançonun usulüne uygun olarak hazırlanması ve saklanmasından, tetkik olunmak üzere denetçilere verilmesinden sorumludur. Ayrıca görevi sona eren yönetim kurulu üyeleri tarafından sorumlulukları altında bulunan para, mal, defter, belge ve diğer kooperatif varlıklarının seçimlerin yapıldığı genel kurul toplantı tarihinden itibaren üç iş günü içinde tutanakla yeni seçilenlere teslimi zorunludur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Yönetim Kurulu üyeleri ve kooperatif memurları, kendi kusurlarından ileri gelen zararlardan sorumludurlar. Bunların suç teşkil eden fiil ve hareketlerinden ve özellikle kooperatifin para ve malları bilanço, tutanak, rapor ve başka evrak, defter ve belgeleri üzerinde işledikleri suçlardan dolayı kamu görevlisi gibi cezalandırılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="V" başlık="Kooperatifin aczi halinde yapılacak işler">
        <mvz-madde no="63" başlık="">
          <mvz-fıkra no="1">
            <template>Kooperatifin aczi halinde bulunduğunu kabul ettirecek ciddi sebepler mevcut ise yönetim kurulu piyasada cari fiyatlar esas olmak üzere, derhal bir ara bilançosu tanzim eder. Son yılın bilançosu veya daha sonra yapılan bir tasfiye bilançosu veyahut daha yukarda sözü geçen ara bilançosu kooperatif mevcudunun, borçlarını artık karşılamıyacağını belirtiyorsa yönetim kurulu, Ticaret Bakanlığına ve yapı kooperatiflerinde İmar ve İskan Bakanlığına da keyfiyeti bildirir ve genel kurulu derhal olağanüstü toplantıya çağırır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Pay senetleri çıkarılmış olan bir kooperatifte son yılın bilançosunda kooperatif varlığının yarısı karşılıksız kalırsa yönetim kurulu derhal genel kurulu toplantıya çağırarak durumu ortaklara arz eder. Aynı zamanda ilgili mahkemeye, Ticaret Bakanlığına ve yapı kooperatiflerinde İmar ve İskan Bakanlığına da bilgi verir. Ancak, ortakları ek Ödemelerle yükümlü olan kooperatiflerde, bilançoda tespit edilen açık, üç ay içinde ortakların ek ödemeleriyle kapanmadığı takdirde Ticaret Bakanlığı ve yapı kooperatiflerinde İmar ve İskan Bakanlığı da haberdar edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Malî durumun düzeltilmesinin mümkün görülmesi hâlinde yönetim kurulu veya alacaklılardan biri konkordato da talep edebilir. Bu takdirde 9/6/1932 tarihli ve 2004 sayılı İcra ve İflâs Kanununun 285 inci ve devamı maddeleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="VI" başlık="İşten çıkarma">
        <mvz-madde no="64" başlık="">
          <mvz-fıkra no="1">
            <template>Yönetim kurulu, işlerin görülmesi ile görevlendirdiği kimseleri ve atadığı müdürleri ve diğer temsilci ve vekilleri her zaman azledebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İşten çıkarılan kimselerin tazminat isteme hakları saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Denetçiler">
      <mvz-b2 no="I" başlık="Seçim">
        <mvz-madde no="65" başlık="">
          <mvz-fıkra no="1">
            <template>Denetçi, genel kurul namına kooperatifin bütün işlem ve hesaplarını tetkik eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Genel kurul tarafından, denetleme organı olarak görev yapmak üzere en fazla dört yıl için en az bir denetçi seçilir. Genel kurulca asıl üye sayısı kadar yedek üye seçilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Çalışma konusu, ortak sayısı ve ciro gibi kıstaslara göre belirlenen kooperatiflerin denetleme organı üyeleri ve yedeklerinin, seçilmelerini takiben en geç dokuz ay içinde kooperatifçilik eğitim programını tamamlamaları şarttır. Eğitim programına ilişkin usul ve esaslar 55 inci maddenin üçüncü fıkrası kapsamında çıkarılan yönetmelikle belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Denetleme organı üyeliğinin herhangi bir nedenle boşalması halinde üyelerin yerlerine en çok oy alan yedekleri geçer. Yedeklerle beraber üye sayısı genel kurulca belirlenen sayının altına düştüğü takdirde, mevcut üye veya üyeler ilk genel kurula kadar görev yapmak üzere şartları haiz kişileri denetim kurulu üyeliğine atar. Yedekler de dahil hiçbir üye kalmaması halinde, yönetim kurulunca, denetçilerin seçilmesi amacıyla genel kurul derhal toplantıya çağırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Anasözleşme ve genel kurul kararı ile denetim organının görev ve yetkilerini artırmak ve özellikle ara denetlemeleri öngörmek mümkündür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Denetçi raporu genel kurula sunulmayan kooperatiflerde; finansal tablolar, yönetim kurulu yıllık faaliyet raporu ve ibra hakkında alınan kararlar geçersizdir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>56 ncı maddenin birinci fıkrasının (1) ve (3) numaralı bentleri ile üçüncü ve altıncı fıkralarında yer alan hükümler denetçiler hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Yönetim kurulu gecikmeksizin denetçileri ticaret siciline tescil ettirir ve Türkiye Ticaret Sicili Gazetesi ile internet sitesinde ilan ettirir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Çalışma">
        <mvz-b3 no="1" başlık="İnceleme yükümlülüğü">
          <mvz-madde no="66" başlık="">
            <mvz-fıkra no="1">
              <template>Denetçiler, işletme hesabiyle bilançonun defterlerle uygunluk halinde bulunup bulunmadığını, defterlerin düzenli bir surette tutulup tutulmadığını ve işletmenin neticeleriyle mameleki hakkında uyulması gerekli olan hükümlere göre işlem yapılıp yapılmadığını incelemekle yükümlüdürler. Ortakların şahsan sorumlu veya ek ödeme ile yükümlü olan kooperatiflerde denetçiler, ortaklar listesinin usulüne uygun olarak tutulup tutulmadığını da incelemek zorundadırlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yöneticiler, bu maksatla denetçilere defterleri ve belgeleri verirler.Denetçilerin istekleri üzerine müfredat defteri ve bu defterin hangi esaslara göre düzenlendiği ve istenilen her konu hakkında bilgi verilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Ortaklar gerekli gördükleri hususlarda denetçilerin dikkatini çekmeye ve açıklama yapılmasını istemeye yetkilidirler.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Rapor düzenlenmesi">
          <mvz-madde no="67" başlık="">
            <mvz-fıkra no="1">
              <template>Denetçiler her yıl yazılı bir raporla beraber tekliflerini genel kurula sunmaya mecburdurlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Denetçiler, görevleri çerçevesinde işlerin yürütülmesinde gördükleri noksanlıkları, kanun veya anasözleşmeye aykırı hareketleri bundan sorumlu olanların bağlı bulundukları organa ve gerekli hallerde aynı zamanda genel kurula haber vermekle yükümlüdürler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Denetçiler yönetim ve genel kurul toplantılarına katılırlar. Ancak, yönetim kurulunda oy kullanamazlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Sır saklama yükümlülüğü">
          <mvz-madde no="68" başlık="">
            <mvz-fıkra no="1">
              <template>Denetçiler, görevleri sırasında öğrendikleri ve açıklanmasında kooperatifin veya ortakların şahısları için zarar umulan hususları kooperatif ortaklarına ve üçüncü şahıslara açıklayamazlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Dış denetim">
        <mvz-madde no="69" başlık="">
          <mvz-fıkra no="1">
            <template>Ticaret Bakanlığı tarafından çalışma konusu, ortak sayısı ve ciro gibi kıstaslar dikkate alınarak belirlenen kooperatif ve üst kuruluşları dış denetime tabidir. Dış denetim finansal tabloların denetimidir. Yönetim kurulunun yıllık faaliyet raporu içinde yer alan finansal bilgilerin, denetlenen finansal tablolar ile tutarlı olup olmadığı ve gerçeği yansıtıp yansıtmadığı da dış denetimin kapsamı içindedir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dış denetim genel kurulca alınan karar doğrultusunda;</template>
            <mvz-bent no="a">
              <template>Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu tarafından yetkilendirilen bağımsız denetçiler,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>1/6/1989 tarihli ve 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa tabi meslek mensupları,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İlgili Bakanlıkça dış denetimle yetkilendirilen, bağlı olunan merkez birlikleri veya merkez birliği kurulamamışsa bağlı olunan birlikler,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>tarafından yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İlgili Bakanlıkça dış denetimle yetkilendirilen birlik ve merkez birlikleri 13/1/2011 tarihli ve 6102 sayılı Türk Ticaret Kanununun ilgili hükümlerine göre bağımsız denetime tabidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Dış denetim yapacak denetçiler ile denetim yetkisi verilen birlik ve merkez birliğinin denetimle görevlendirilen personeli, görevleri sebebiyle işledikleri suçlardan dolayı, fiillerinin niteliğine göre 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun kamu görevlilerine ait hükümleri uyarınca cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Dış denetim ve bu denetimi yapacak denetçiler hakkında da 65 inci maddenin altıncı, yedinci ve sekizinci fıkraları uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu madde ve 65 inci madde kapsamında yapılacak denetime ilişkin usul ve esaslar, denetçilerin nitelikleri, uyacakları etik ilkeler, görev ve yetkileri, seçilmeleri, görevden alınmaları veya ayrılmaları, denetimin ve denetim raporlarının içeriği ve raporun genel kurula sunulması ile üst kuruluşların yetkilendirilmesine ilişkin hususlar ilgili bakanlıkların görüşü alınarak Ticaret Bakanlığınca çıkarılan yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Kooperatif Birlikleri, Kooperatifler Merkez Birlikleri, Türkiye Milli Kooperatifler Birliği ve Danışma Kurulu">
    
      <mvz-madde no="70" başlık="Görev ve sorumluluk">
        <mvz-fıkra no="1">
          <template>Kooperatiflerin müşterek menfaatlerini korumak, amaçlarını gerçekleştirmek için iktisadi faaliyette bulunmak, faaliyetlerini koordine etmek ve denetlemek, dış memleketlerle olan münasebetlerini düzenlemek, kooperatifçiliği geliştirmek ve eğitim yapmak, kooperatifçilik konularında tavsiyelerde bulunmak gibi hizmetlerin yerine getirilmesi için, Kooperatif birlikleri, kooperatifler merkez birlikleri ve Türkiye Milli Kooperatifler Birliği kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kooperatif birlikleri, kooperatifler merkez birlikleri ve Türkiye Milli Kooperatifler Birliği Yönetim Kurulu üyeleriyle memurları haklarında 62 nci madde hükmü uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="71" başlık="Yükümlülük">
        <mvz-fıkra no="1">
          <template>Birliklere katılan kooperatifin ortaklarına, birliğe girmekle kanun veya kendi kooperatiflerin anasözleşmesindeki yükümlülüklerden fazlası yüklenemez.</template>
        </mvz-fıkra>
      </mvz-madde>
    
    <mvz-b1 no="A" başlık="Kooperatif birlikleri">
      <mvz-madde no="72" başlık="">
        <mvz-fıkra no="1">
          <template>Konuları aynı veya birbiriyle ilgili nitelikte olan 7 veya daha çok kooperatif tarafından birlikler kurulabileceği anasözleşmelerinde tesbit edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu birlikler kooperatif şeklinde kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlgili bakanlık tarafından bölgeler belirlendiği takdirde, bu bölgelerde aynı çalışma konularına sahip birden fazla kooperatif birliği kurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kooperatifler, kooperatif birliklerine; kooperatif birlikleri de merkez birliğine ortak olmadığı takdirde, kamu kaynaklarından desteklenen kredilere kefalet sağlayamaz ve kamu kaynaklı tarımsal desteklemelere aracılık yapamaz. Bu kapsamdaki başvurularda; birlikler kooperatifleri, merkez birliği de birlikleri ortaklığa kabulden kaçınamaz.</template>

        <mvz-fıkra no="3">

    <mvz-b1 no="C" başlık="Türkiye Milli Kooperatifler Birliği">
