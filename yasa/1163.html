  <mvz-bölüm no="7-YEDİNCİ" başlık="Kooperatiflerin Dağılması">
    <mvz-b1 no="A" başlık="Dağılma sebepleri">
      <mvz-madde no="81" başlık="">
        <mvz-fıkra no="1">
          <template>Kooperatif:</template>
          <mvz-bent no="1.">
            <template>Anasözleşme gereğince,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Genel Kurul kararı ile,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>İflasın açılmasıyla,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Kanunlarda öngörülen diğer hallerde, ilgili bakanlığın mahkemeden alacağı karar üzerine,</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Diğer bir kooperatifle birleşmesi veya devralınması suretiyle,</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Üç yıl olağan genel kurulunu yapmaması halinde,</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>Amacına ulaşma imkanının bulunmadığının ilgili Bakanlıkça tespiti halinde mahkemeden alacağı kararla,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Dağılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yapı kooperatifleri, anasözleşmede gösterilen işlerin tamamlanması ve ferdi mülkiyete geçilip konutların ve/veya işyerlerinin ortaklar adına tescil edilmesiyle amacına ulaşmış sayılır ve dağılır.  Ancak tescil işleminden sonra usulüne uygun şekilde anasözleşme değişikliği yapılarak kooperatifin amacının değiştirilmesi halinde dağılmaya ilişkin hüküm uygulanmaz.  Amacına ulaşılarak dağılma sürecine girmiş olan kooperatiflerden çıkan veya çıkarılan ortağın konutu veya işyeri çıkma veya çıkarılma sebebiyle geri alınamaz; ancak, bu eski ortaklar daha sonra oluşabilecek tasfiye masraflarına katılırlar. Konut kooperatiflerinde yapı kullanma izninin alınmasını müteakip en geç bir yıl içinde ortakların Kat Mülkiyeti Kanununa göre ferdi münasebet işleri sonuçlandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkemece veya genel kurulca tasfiye memurları seçilmediği takdirde tasfiye işlerini yönetim kurulu yapar, Tasfiye kurulu üyelerine, atamayı yapan merci tarafından tespit edilecek miktarda ücret ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Anasözleşme ile özel bir nisap belirlenmemiş ise, tasfiye halinde kooperatiflerin genel kurul toplantılarında nisap aranmaz. Kararlar oy çokluğu ile verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Tasfiye kurulunun görevleri anasözleşmede gösterilir,</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Tasfiye kurulu üyeleri, tasfiye işlerinin biran önce bitirilmesi için çalışmakla yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>56 ncı maddenin 1 inci fıkrasının 3 üncü bendi ile 62 nci madde hükümleri tasfiye kurulu üyeleri hakkında da uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Ticaret siciline bildirme">
      <mvz-madde no="82" başlık="">
        <mvz-fıkra no="1">
          <template>İflastan gayrı hallerde kooperatifin dağılması, yetkili organlar tarafından Ticaret Siciline tescil ile ilan ettirilir. Yetkili organların kimler olacağı Anasözleşmede gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Tasfiye mamelekin paylaştırılması">
      <mvz-madde no="83" başlık="">
        <mvz-fıkra no="1">
          <template>Tasfiye haline giren kooperatifin bütün borçları ödendikten ve ortak pay bedelleri geri verildikten sonra kalan mallar ancak Anasözleşmede bu husus öngörülmüş olduğu takdirde, ortaklar arasında paylaştırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Anasözleşmede başka bir hal tarzı kabul edilmiş olmadıkça paylaştırma, dağılma anında kayıtlı ortaklar veya hukuki halefleri arasında eşit olarak yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ortaklara paylaştırma yapılacağına dair Anasözleşmede açıklama olmadığı takdirde tasfiye neticesinden arta kalan miktar, kooperatifleşme amacına uygun olarak harcanmak üzere Türkiye Milli Kooperatifler Birliğine bırakılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Birleşme suretiyle dağılma">
      <mvz-madde no="84" başlık="">
        <mvz-fıkra no="1">
          <template>Bir kooperatif bütün aktif ve pasifleriyle diğer bir kooperatif tarafından devralınmak suretiyle dağıldığı takdirde aşağıdaki hükümler uygulanır:</template>
          <mvz-bent no="1.">
            <template>Devralan kooperatifin yönetim kurulu, dağılan kooperatifin tasfiye hakkındaki hükümlere göre alacaklarını bildirmeye çağırır.</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Dağılan kooperatifin mameleki, borçları tediye veya teminata bağlanıncaya kadar ayrı olarak idare edilir. Yönetimi devralan kooperatifin yönetim kurulu üyeleri üzerine alır.</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Devralan kooperatifin yönetim kurulu üyeleri alacaklılara karşı yönetimin ayrı olarak yürütülmesinden şahsan ve zincirleme sorumludurlar.</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Mameleki ayrı olarak yönetildiği süre içinde, dağılan kooperatife karşı açılacak davalara dağılmadan önceki yetkili mahkeme bakar.</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Dağılan kooperatif alacaklılarının devralan kooperatif ve onun alacaklıları ile olan münasebetlerinde, devralınan mallar aynı süre içinde dağılan kooperatife ait sayılır. Devralan kooperatifin iflası halinde ise bu mallar ayrı bir masa teşkil eder. Gerekirse yalnız dağılan kooperatifin borçlarının ödenmesinde kullanılır.</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Her iki kooperatifin mameleki, ancak dağılan kooperatifin malları üzerinde tasarruf etmek caiz olduğu andan itibaren birleştirilebilir.</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>Kooperatifin dağılmasının tescili Ticaret Sicili memurluğundan istenir. Borçları ödendikten veya teminata bağlandıktan sonra kooperatifin kaydı sildirilir.</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>Kooperatifin dağılmasının tescili ile ortakları da bütün hak ve borçları ile birlikte devralan kooperatife katılmış olurlar.</template>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>Mameleki ayrı idare edildiği sürece dağılan kooperatifin ortakları yalnız onun borçları için ve o zamana kadar sorumluluklarının bağlı olduğu esaslar dairesinde takip olunabilirler.</template>
          </mvz-bent>
          <mvz-bent no="10.">
            <template>Aynı süre esnasında, dağılan kooperatifin ortaklarının sorumlulukları veya ek ödeme yükümlülükleri birleşme neticesinde hafiflemeye uğradığı ölçüde, bu hafifleme dağılan kooperatifin alacaklılarına karşı ileri sürülemez.</template>
          </mvz-bent>
          <mvz-bent no="11.">
            <template>Birleşme neticesinde dağılan kooperatifin ortakları için şahsi sorumluluk veya ek ödeme yükümlülüğü doğduğu veya ağırlaştığı taktirde birleşme kararı, ancak bütün ortakların 3/4 ünün çoğunluğu ile verilebilir. Sorumluluğa ve ek ödeme yükümlülüğüne mütedair hükümler birleşme kararına katılmamış olan ve bundan başka kararın ilanı tarihinden başlamak üzere üç ay içinde kooperatiften çıkacağını bildiren ortaklara uygulanmaz.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="E" başlık="Bir kamu tüzel kişiliği tarafından devralınmak">
      <mvz-madde no="85" başlık="">
        <mvz-fıkra no="1">
          <template>Bir kooperatifin varlığı, belediye, ekonomik bir Devlet kuruluşu, kamu müessesesi veya kamuya yararlı dernek veya cemiyetler tarafından da devralınabilir. Bu takdirde genel kurulca alınacak kararın dağılmaya ait hükümlere göre tescil ve ilan ettirilmesi gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu gibi kooperatif varlığının, Devlete ait ekonomik kuruluş veya herhangi bir ekonomik kuruluş veya herhangi bir dernek veya cemiyet tarafından devralınması hallerinde genel kurul tasfiye yapılmamasına karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Devir kararının ilan edildiği tarihten itibaren kooperatifin aktif ve pasifi devralana intikal etmiş olur. Dağılan kooperatifin adı ticaret sicilinden sildirilir. Bu husus ayrıca ilan ettirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birleşen müessese ile kooperatifin alacaklılarından her biri ilan tarihinden itibaren üç ay içinde yetkili mahkemeye başvurmak suretiyle birleşmeye itiraz edebilir. İtiraz hakkından vazgeçilmedikçe yahut bu husustaki itirazın reddine dair mahkemece verilen karar kesinleşmedikçe veyahut mahkemece takdir edilecek teminat, müessese veya kooperatif tarafından verilmedikçe birleşme hüküm ifade etmez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Ticaret Bakanlığının Görev ve Yetkileri">
    <mvz-b1 no="A" başlık="Genel olarak Bakanlığın görev ve yetkileri">
      <mvz-madde no="86" başlık="">
        <mvz-fıkra no="1">
          <template>Ticaret Bakanlığının kooperatifleri ilgilendiren başlıca görev ve yetkileri şunlardır:</template>
          <mvz-bent no="1.">
            <template>Kooperatiflere, kooperatif birliklerine, merkez birliklerine,Türkiye Milli Kooperatifler Birliğine kuruluş ve organizasyonlarında yol göstermek, öğütleriyle yönetimlerinde ve çalışmalarında yardımcı olmak,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Kooperatifleri, birlikleri, merkez birliklerini ve Türkiye Milli Kooperatifler Birliğini teftiş etmek, denetlemek veya denetlettirmek,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Kooperatiflerin, birliklerin, merkez birliklerinin ve Türkiye Milli Kooperatifler Birliğinin dağılmasını gerektiren sebepleri mahkemeye bildirmek,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Kooperatiflerin, bilhassa istihsale yararlı kooperatiflerin kuruluşu, öncelikle kredilenmesi ve memleket yararına faaliyette bulunmaları hususunda ilgili bakanlıklar ve kuruluşlar nezdinde gerekli teşebbüsleri yapmak ve koordinatör olarak vazife görmek.</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Kooperatifler mevzuatının uygulanmasında ve kooperatiflerle üst kuruluşlara yapılacak desteklemelerle ilgili kamu ve sosyal güvenlik fonları konusunda düzenleyici tasarruflarda bulunmak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Bakanlık temsilcileri ve kararların yürürlük şartı">
      <mvz-madde no="87" başlık="">
        <mvz-fıkra no="1">
          <template>Kooperatiflerin, kooperatif birliklerinin, merkez birliklerinin ve Türkiye Milli Kooperatifler Birliğinin, genel kurul toplantılarından en az onbeş gün önce ilgili Bakanlıktan temsilci talebinde bulunması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel kurul toplantıları, Bakanlık temsilcisinin huzuru ile açılır ve devam eder. Temsilci, toplantının kanunlara, anasözleşmeye ve gündeme göre yürütülmesine nezaret eder. Genel kurul toplantı tutanağı ile toplantıya katılanların listesi temsilci tarafından imzalanır. Temsilci, genel kurulda, kanun ve anasözleşmeye aykırı olarak alınan kararlar hakkındaki görüşünü tutanakta belirtir. Usulüne uygun talepte bulunulduğu halde, temsilci toplantıya katılamaz ise ilan edilen saatten bir saat sonra toplantıya başlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bakanlık temsilcisinin nitelikleri, görevleri, yetkileri ve ücretinin ödenmesine ilişkin esaslar ile temsilci görevlendirilmesine ilişkin usul ve esaslar ilgili bakanlıkların görüşü alınarak Ticaret Bakanlığınca çıkarılan yönetmelikle düzenlenir. Bakanlık temsilcisinin ücreti, ilgili kooperatif tarafından karşılanır.  Bakanlık temsilcilerine, (1200) gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarı geçmemek üzere Ticaret Bakanlığınca belirlenen tutarda ücret net olarak ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Örnek anasözleşme hazırlanması">
      <mvz-madde no="88" başlık="">
        <mvz-fıkra no="1">
          <template>Ticaret Bakanlığı, kooperatifler, kooperatif birlikleri, kooperatif merkez birlikleri ve Türkiye Milli Kooperatifler Birliği için bu teşekküllerin mütalaasının da alınmak kaydiyle örnek anasözleşmeler hazırlar, yapı kooperatifleri için bu görev Ticaret ve İmar ve İskan Bakanlığınca müştereken kullanılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Muhasebe usulü ve defterler">
      <mvz-madde no="89" başlık="">
        <mvz-fıkra no="1">
          <template>Kooperatiflerin, kooperatif birliklerinin, kooperatif merkez birliklerinin ve Türkiye Milli Kooperatifler Birliğinin muhasebe usulleri ve mecbur olarak tutacakları defterler hakkında 13/1/2011 tarihli ve 6102 sayılı Türk Ticaret Kanunu hükümleri uygulanır. Bu maddenin uygulanmasına ilişkin usul ve esaslar Gümrük ve Ticaret Bakanlığınca çıkarılacak tebliğ ile belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Vergi Usul Kanununun bu hususlarla ilgili hükümleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="E" başlık="Teftiş ve denetleme">
      <mvz-madde no="90" başlık="">
        <mvz-fıkra no="1">
          <template>İlgili bakanlık; kooperatiflerin, kooperatif birliklerinin, kooperatif merkez birliklerinin ve Türkiye Milli Kooperatifler Birliğinin işlem ve hesaplarını ve varlıklarını müfettişlere, kooperatif kontrolörlerine veya denetim için görevlendirilecek olan personele denetlettirebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="iptal">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci fıkradaki teşekküller, denetim sonuçlarına göre ilgili bakanlıkça verilecek talimata uymak zorundadırlar. Yapılan denetimler sonucunda, kooperatiflerin, kooperatif birliklerinin, kooperatif merkez birliklerinin, Türkiye Milli Kooperatifler Birliğinin ve bunların iştiraklerinin yönetim kurulu üyeleri ile üst düzey yöneticilerinin, hukuka açıkça aykırı eylem ve işlemlerinin tespit edilmesi durumunda, ilgili Bakanlık, kamu yararı ve hizmet gerekleri dikkate alınarak gecikmesinde sakınca görülen hallerde ileride telafisi güç veya imkansız zararlara yol açılmasının engellenmesi amacıyla bu kişilerin görevlerine tedbiren son verebilir. Bu durumda ilgili Bakanlık, bir yıl içerisinde olağanüstü genel kurul toplantısının yapılması için gerekli tedbirleri alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kooperatifler ve üst kuruluşlarına kredi veren kamu kurum ve kuruluşları ile belediyeler ve ilgili bakanlıklar; verilen kredilerin açılış gayesine uygun olarak kullanılıp kullanılmadığını, plan ve projesine uygunluğu, teknik özellikleri ve kalite açısından denetleyebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kooperatiflerde ve üst kuruluşlarında görevli bulunanlar bu kuruluşlara ait mal, para ve para hükmündeki kağıtları ve gizli de olsa bunlarla ilgili defter ve belgeleri istenildiğinde müfettişlere, kooperatif kontrolörlerine, denetimle görevlendirilen personele ve kredi kuruluşlarının denetim görevlilerine göstermek, saymasına ve incelemesine yardımda bulunmak, istenilen bilgileri gerçeğe uygun ve eksiksiz olarak vermek ve doğru beyanda bulunmakla yükümlüdürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Birinci fıkradaki teşekküller, ilgili Bakanlıkça teşekküle ilişkin olarak istenilen her türlü bilgi, belge ve kayıtları, tanınan süre içinde tam olarak vermek zorundadır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="F" başlık="Teftiş ve denetleme ile görevlendirme">
      <mvz-madde no="91" başlık="">
        <mvz-fıkra no="1">
          <template>İlgili bakanlık; kooperatif üst kuruluşlarını, ilgili müesseseleri ve bağımsız denetim kuruluşlarını denetleme işleri için görevlendirebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bunlara mütaallik esaslar 90 ıncı madde gereğince hazırlanacak Cumhurbaşkanınca çıkarılan yönetmelikle belirtilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>

          <template>Kooperatifler, kooperatif birlikleri, kooperatif merkez birlikleri ve Türkiye Milli Kooperatifler Birliği;</template>
          <mvz-bent no="a">
            <template>Birbirlerinden ve ortaklarından aldıkları faiz ve komüsyonlar ile ortaklarına kefalet etmeleri dolayısiyle bunlardan aldıkları paralar, banka ve Sigorta Muameleleri Vergisinden,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Her nevi defterlerin ve anasözleşmelerin tasdiki ve açılış tasdiklerinde sayfalarının mühürlenmesi her nevi harçtan ve Damga Vergisinden,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kiraya verilmediği veya irat getirmiyen bir cihete tahsis edilmediği müddetçe sahip oldukları gayrimenkul mallar üzerinden alınacak her türlü vergilerden,</template>
          </mvz-bent>
          <mvz-bent no="d">

          </mvz-bent>
          <mvz-bent no="e">
            <template>13 üncü madde gereğince verilecek bildiri Damga Vergisine, diğer harç ve resimlere tabi değildir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gayrimenkullerin irtifak haklarının ve gayrimenkul mükellefiyetinin kooperatiflere, kooperatif birliklerine, kooperatif merkez birliklerine, Türkiye Milli Kooperatifler Birliğine sermaye konulması halinde bunlar Emlak Alım Vergisi Kanununun 9 uncu maddesindeki indirimli nispetten,</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>5422 sayılı Kurumlar Vergisi Kanununun 199 sayılı Kanunla değişik 7 nci maddesinin 16 ncı bendindeki esaslar dahilinde Kurumlar Vergisi muaflığından,</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Faydalanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kooperatifler, kooperatif birlikleri ve kooperatifler merkez birlikleri faaliyete geçen üst kuruluşlara girmedikleri takdirde, bu maddenin 1 nolu fıkrasının (b) bendi ile 2 nolu fıkrasından gayri fıkralarında yazılı muaflıklardan istifade edemezler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Ortaklarının çoğunluğu kadınlardan oluşan ve kadın emeğinin değerlendirilmesi amacıyla kurulan kooperatifler ile ortaklarının çoğunluğu engellilerden oluşan kooperatiflerin, bu Kanun ve 6102 sayılı Kanun gereğince tescil ve ilana tabi işlemlerinden ücret alınmaz ve ilana tabi olanlar Türkiye Ticaret Sicili Gazetesinde ücretsiz olarak yayımlanır. Bu kooperatiflerden, 18/5/2004 tarihli ve 5174 sayılı Türkiye Odalar ve Borsalar Birliği ile Odalar ve Borsalar Kanununun 24 üncü maddesi gereğince odaya kayıt ücreti ve yıllık aidat ile aynı Kanunun 25 inci maddesinde tanımlanan munzam aidat alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>

          <template>Bu kanunda düzenlenen hususlardan doğan hukuk davaları, tarafların tacir olup olmadıklarına bakılmaksızın ticari dava sayılır.</template>

    <mvz-b1 no="H" başlık="Kaldırılan hükümler">
      <mvz-madde no="100" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Ticaret Kanununun kooperatiflere ait 6 ncı faslını teşkil eden 485 - 502 nci maddeleri yürürlükten kaldırılmıştır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="İlgili Bakanlık" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunda geçen Bakanlık isimleri "İlgili bakanlık" olarak değiştirilmiştir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İlgili bakanlık deyiminden, bu Kanun kapsamındaki tarımsal amaçlı kooperatifler ve üst kuruluşları için Tarım ve Köyişleri Bakanlığı, yapı kooperatifleri ve üst kuruluşları için Bayındırlık ve İskan Bakanlığı ve diğer kooperatifler ve üst kuruluşlar için ise Sanayi ve Ticaret Bakanlığı anlaşılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Cezai sorumluluk" tür="Ek">
        <mvz-fıkra no="1">
          <template>8 inci maddenin üçüncü ve dördüncü fıkralarına, 16 ncı maddenin beşinci fıkrasına, 24 üncü maddenin birinci fıkrasına, 46 ncı maddenin ikinci fıkrasına, 56 ncı maddenin ikinci ve altıncı fıkralarına, 59 uncu maddenin dördüncü, altıncı, yedinci ve sekizinci fıkralarına, 62 nci maddenin ikinci fıkrası gereği sorumlulukları altında bulunan para, mal, defter, belge ve diğer kooperatif varlıklarını teslim etmeyen ve 90 ıncı maddenin beşinci fıkrasına aykırı hareket eden kooperatif ve üst kuruluşlarının yönetim kurulu üyeleri ve memurları ile 72 nci maddenin dördüncü fıkrasına aykırı hareket eden kooperatif üst kuruluşlarının yönetim kurulu üyeleri üç aydan iki yıla kadar hapis ve elli günden beşyüz güne kadar adlî para cezası ile cezalandırılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>45 inci maddenin birinci fıkrası gereği genel kurulu zamanında olağan toplantıya çağırmayan yönetim kurulu üyeleri ile 2 nci maddenin dördüncü fıkrasına, 8 inci maddenin ikinci fıkrasına, 16 ncı maddenin birinci fıkrasına, 66 ncı maddenin ikinci fıkrasına ve 90 ıncı maddenin üçüncü fıkrasına aykırı hareket eden kooperatif ve üst kuruluşlarının yönetim kurulu üyeleri dokuz aya kadar hapis ve otuz günden üçyüz güne kadar adlî  para cezası ile cezalandırılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>56 ncı maddenin ikinci ve dördüncü fıkralarına, 66 ncı maddeye, 67 nci maddenin birinci ve ikinci fıkralarına aykırı hareket eden ve ek 3 üncü maddeye aykırı uygulamaları araştırmayan kooperatif ve üst kuruluşlarının denetim kurulu üyeleri bir aydan dokuz aya kadar hapis ve otuz günden üçyüz güne kadar adlî  para cezası ile cezalandırılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ek 5 inci maddenin ikinci fıkrasına ve bu madde kapsamında çıkarılan yönetmelikte belirlenen yükümlülüklere aykırı hareket eden yönetim kurulu üyelerinin her biri, her bir yükümlülük için ayrı ayrı olmak üzere bin Türk lirası idari para cezası ile cezalandırılır. Aynı denetim kapsamında aynı kişiye verilebilecek idari para cezalarının toplam tutarı onbin Türk lirasını geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İlgili bakanlık, kooperatifler ve üst kuruluşlarının yönetim ve denetim kurulu üyeleri ile memurları hakkında görevlerine ilişkin olarak işledikleri suçlardan dolayı açılan kamu davalarına katılma talebinde bulunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu maddede öngörülen idari para cezaları ilgili Bakanlık tarafından uygulanır. İlgili Bakanlık, bu yetkisini il müdürlüklerine devredebilir. Bu Kanuna göre verilen idari para cezaları, tebliğ tarihinden itibaren bir ay içinde ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="Bağdaşmayan görevler" tür="Ek">
        <mvz-fıkra no="1">
          <template>Kooperatifler ve üst kuruluşlarının yönetim kurulu üyeleri ve denetçileri; bu kooperatiflerin ve üst kuruluşlarının hissedarı oldukları şirketlerde, katıldıkları vakıflarda ve diğer teşekküllerde yönetim kurulu üyesi veya denetçi olamazlar, personel olarak yahut başka bir şekilde ücretli görev alamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkrada belirtilen diğer görevleri bulunmasına rağmen kooperatif ve üst kuruluşlarında yönetim kurulu üyesi veya denetçi olarak seçilenler, seçildikleri tarih itibariyle diğer görevlerinden ayrılmak zorundadırlar. Bu görevlerinden ayrılmayanların yönetim kurulu üyeliğine veya denetçiliğe seçilmelerine ilişkin işlemler hükümsüzdür. Seçildikten sonra birinci fıkradaki diğer görevleri edinen kooperatif ve üst kuruluşlarının yönetim kurulu üyeleri ve denetçilerinin sonradan edindikleri görevlere ilişkin seçilme veya görevlendirme işlemleri ile sözleşmeler de hükümsüzdür. Yönetim kurulu üyeliğine veya denetçiliğe seçilme işlemleri bu şekilde hükümsüz olanların yerlerine yedekleri çağrılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kooperatifler ve üst kuruluşlarının yönetim kurulu üyeleri ve denetçilerinin fiilen bu görevleri yürüttükleri dönemde; bunların eş ve ikinci derece dâhil kan ve kayın hısımları, bu kooperatifler ve üst kuruluşları ile % 50’den fazla hissedarı oldukları şirketlerde, katıldıkları vakıflarda ve diğer teşekküllerde yönetim kurulu üyesi veya denetçi olamazlar, personel olarak veya başka bir şekilde ücretli olarak işe alınamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu madde hükümlerine aykırı uygulamalar denetçiler tarafından araştırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Birinci fıkraya aykırı olarak görev yapmakta olanlar, bu maddenin yürürlüğe girdiği tarihten itibaren üç ay içerisinde bu görevlerinden sadece birisini tercih ederek diğerlerinden ayrılırlar. Süresi içerisinde tercihte bulunmayanların seçilmiş oldukları kooperatif veya üst kuruluşlarındaki yönetim kurulu üyeliği veya denetçilik görevleri dışındaki diğer görevlerinin tamamı kendiliğinden sona erer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="Üniversitelerin yönetim kurulunda üye bulundurma hakkı" tür="Ek" durum="mülga">
      </mvz-madde>
      <mvz-madde no="5" başlık="Kooperatif Bilgi Sistemi" tür="Ek">
        <mvz-fıkra no="1">
          <template>Ticaret Bakanlığı tarafından tüm kooperatif ve üst kuruluşlarının, kooperatifçilik hizmetlerine elektronik ortamda eriştiği ve merkezî veri tabanının yönetildiği Kooperatif Bilgi Sistemi (KOOPBİS) kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kooperatifin ticaret sicili kayıtlarının, finansal tablolarının, yönetim kurulu ve denetçi raporlarının, genel kurul toplantı evrakının, ortakların kimlik, iletişim, pay ve ödemelerine ilişkin bilgilerinin KOOPBİS’e işlenmesinden yönetim kurulu sorumludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlgili Bakanlık ile kooperatif ve üst kuruluşları, görevleri ile sınırlı kalmak şartıyla, ortakların ve ortak olmak için başvuranların kişisel verilerini KOOPBİS’te işlemeye ve görüntülemeye yetkilidir. İlgili Bakanlık; denetim, istatistik üretme, hizmetlerde otomasyonu artırma, ülke kooperatifçiliğinin geliştirilmesi ve kooperatif ortaklarının haklarının korunması amacıyla sistemde işlenen verileri, kamu kurum ve kuruluşlarına aktarabilir. Elde edilen veriler 6698 sayılı Kanuna aykırı olarak kullanılamaz, aktarılamaz veya başka bir şekilde işlenemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>KOOPBİS’te tutulacak veriler ile elektronik ortamda sunulacak hizmetlerden faydalanılmasına, bu sistem üzerinde işlenen kişisel verilerin aktarımı ile güvenliğin sağlanmasına ve aydınlatma yükümlülüğünün ne şekilde yerine getirileceğine ilişkin usul ve esaslar ilgili bakanlıklar ile Kişisel Verileri Koruma Kurumunun görüşü alınarak Ticaret Bakanlığı tarafından çıkarılan yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>İnşaatı tamamlayarak etaplar halinde yeniden inşaata başlayan yapı kooperatifleri, yaptıkları ve yapmayı planladıkları tüm inşaatlar tamamlanmadan iş yeri ve konutları ortaklarına tahsis etmiş olsalar dahi tahsis edilen gayrimenkullerin tapusunun devrini yapamaz.</template>
        </mvz-fıkra>
      </mvz-madde>  
      <mvz-madde no="1" başlık="Geçici Hüküm" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Halen kuruluş ve faaliyette bulunan kooperatifler sözleşmelerini üç sene içinde bu kanun hükümlerine intıbak ettirmek zorundadırlar. Bu hususa riayet etmiyen kooperatifler dağılmış sayılırlar. Kanunen tasfiye ile vazifelendirilmiş kimseler tarafından dağılmadan başlıyarak iki ay içinde tasfiyeye geçilmediği takdirde Ticaret Bakanlığı veya Hazine tarafından mahkemeden tasfiye memuru atanması istenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Anasözleşmelerini bu kanuna intıbak ettirmek için kooperatiflerin yapacakları genel kurullar, olağan genel kurulların usul ve çoğunluğuna göre toplanır ve karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yayımından önce kurulmuş bulunan ve Kamu Kuruluşlarından kredi alan yapı kooperatiflerinin anasözleşmelerindeki 1163 sayılı Kooparatifler Kanununun bu Kanunla değişik 52 nci maddesine aykırı hükümler, herhangi bir işlem yapılmaksızın anılan maddeye göre düzeltilmiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>1163 sayılı Kooperatifler Kanununun ek 1 inci maddesi uyarınca Sanayi ve Ticaret Bakanlığınca yapı kooperatifleri ve üst kuruluşları ile ilgili başlatılmış veya planlanmış iş ve işlemler ile bunlara dair her türlü hak, yetki ve görevler Bayındırlık ve İskan Bakanlığına devredilmiştir. Bayındırlık ve İskan Bakanlığı, Sanayi ve Ticaret Bakanlığınca başlatılmış veya planlanmış iş ve işlemleri yürütmeye, bunlar hakkında yeni iş ve işlemler yapmaya, gerekli görülenleri tasfiye etmeye yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bayındırlık ve İskan Bakanlığı; Kooperatifler Kanununun ek 1 inci maddesi uyarınca yapılan iş ve işlemlerden dolayı Sanayi ve Ticaret Bakanlığının taraf olduğu işlemlerde ve sözleşmelerde taraf olur ve bu Bakanlık leh ve aleyhine açılmış ve bu maddenin yürürlüğe girmesinden önce bu Bakanlık tarafından yapılmış olan iş ve işlemler sebebiyle açılacak olan davalarda kendiliğinden taraf sıfatını kazanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu madde ile devredilmesi öngörülen her türlü işleme ilişkin evrak ile dava dosyaları ve sair malzemenin devri, Bayındırlık ve İskan Bakanlığı ile Sanayi ve Ticaret Bakanlığınca müştereken belirlenecek usul ve esaslara göre gerçekleştirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bayındırlık ve İskan Bakanlığının personel ve teşkilat yapısı, yapı kooperatifleri ile ilgili olarak bu Kanun ile verilen görevleri yürütmeye hazır hâle getirilinceye kadar, hizmetine ihtiyaç duyulan personel, her türlü özlük hakları saklı kalmak kaydıyla Sanayi ve Ticaret Bakanlığınca, Bayındırlık ve İskan Bakanlığı emrinde bu maddenin yürürlük tarihinden itibaren bir yıl süre ile geçici olarak görevlendirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="" tür="Geçici" durum="mülga">
      </mvz-madde>
      <mvz-madde no="6" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddeyi ihdas eden Kanunla yapılan değişiklikler uyarınca hazırlanacak yönetmelikler, bu maddenin yürürlüğe girdiği tarihten itibaren altı ay içinde çıkarılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>55 inci ve 65 inci maddelerin üçüncü fıkraları bu maddenin yürürlüğe girdiği tarihte görevde bulunan yönetim kurulu üyeleri ve denetçiler için yapılacak ilk seçimlere kadar uygulanmaz. Mezkûr fıkralarda yer alan dokuz aylık süre 31/12/2022 tarihine kadar seçilecek yönetim kurulu üyeleri ve denetçiler için bu tarihten itibaren başlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>KOOPBİS, bu maddenin yürürlüğe girdiği tarihten itibaren bir yıl içinde kurulur. İlgili bakanlıklar, sistemin kurulum sürecinde kendi sistemlerindeki verileri aktarmakla, uygulamaya geçtikten sonra da kooperatif ve üst kuruluşlarınca yapılan veri girişlerini takip etmekle sorumludurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kooperatif ve üst kuruluşları yönetim kurulu üyeleri, kooperatifin; ticaret sicili kayıtlarını, fınansal tablolarını, yönetim kurulu yıllık faaliyet raporlarını, genel kurul toplantı evrakını, ortaklarının kimlik, iletişim, pay ve ödemelerine ilişkin bilgilerini KOOPBİS’in kurulmasını müteakip bir yıl içinde KOOPBİS’e aktarmakla yükümlüdür.  Bu süre Ticaret Bakanlığınca altı aya kadar uzatılabilir.  Buna rağmen geçiş sürecinin tamamlanamadığının tespit edilmesi halinde Ticaret Bakanlığınca birer yıl olmak üzere iki defa daha süre uzatımı yapılabilir. Bu süreçte kooperatifler ve üst kuruluşları, genel kurul toplantısına katılma hakkını haiz ortakları gösteren listeleri bu madde yürürlüğe girmeden önceki hükümlere göre almaya devam ederler.  Bu süre sona erinceye kadar kooperatif ve üst kuruluşlarının yönetim kurulu üyeleri ve memurları hakkında, 24 üncü ve ek 5 inci maddelerde yer alan KOOPBİS yükümlülüğüne aykırı davranmaları nedeniyle ek 2 nci maddenin birinci fıkrasının (1) ve (4) numaralı bentlerinde yer alan hükümler uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddenin ikinci fıkrasında belirtilen yükümlülüklerini yerine getirmeyen kooperatif ve üst kuruluşlarının yönetim kurulu üyeleri, ek 2 nci maddenin birinci fıkrasının (4) numaralı bendi uyarınca idari para cezası ile cezalandırılırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Kooperatifler ve üst kuruluşları, anasözleşmelerini en geç beş yıl içinde bu Kanun hükümlerine intibak ettirmek zorundadır. Anasözleşmelerini intibak ettirmeyen kooperatif ve üst kuruluşları dağılmış sayılır. Kanunen tasfiye ile görevlendirilmiş kimseler tarafından dağılmadan başlayarak iki ay içinde tasfiye işlemlerine geçilmemesi halinde, kooperatif ve üst kuruluşun ortakları ya da alacaklıları tarafından mahkemeden iki yıl içinde tasfiye memuru atanması istenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Anasözleşmeler intibak ettirilinceye kadar, mevcut anasözleşmelerin bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Anasözleşmelerini bu Kanuna intibak ettirmek için kooperatifler ve üst kuruluşlarının yapacakları genel kurulları, olağan genel kurulların usul ve çoğunluğuna göre toplanır ve karar verir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>72 nci maddenin dördüncü fıkrasının birinci cümlesi hükmü kamu kaynaklı tarımsal desteklemelere aracılık yapan kooperatifler hakkında 1/1/2024 tarihinden itibaren uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="" tür="Geçici" durum="iptal">
      </mvz-madde>
