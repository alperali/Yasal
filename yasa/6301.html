  <mvz-künye tür="kanun" no="6301" başlık="ÖĞLE DİNLENMESİ KANUNU"
             tarih="2/3/1954" rgazete-tarih="8/3/1954" rgazete-sayı="8652"
             düstur-tertip="3" düstur-cilt="35" düstur-sayfa="1162" />
    
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Nüfusu on bin ve daha fazla olan şehir ve kasabalardaki fabrika, imalathane, mağaza, dükkan, yazıhane, büro ve bunların benzerleriyle bilümum ticari ve sınai müesseselerde çalıştırılan işçilere ve diğer müstahdemlere bir saatten aşağı olmamak üzere öğle dinlenmesi verilmesi mecburidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Dinlenme devresinin başlama ve bitme saatleri, mevsimlere göre, o mahallin Belediye Meclisi tarafından tesbit ve ilan olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Dinlenme devresinin devamı müddetince iş yerlerinin kapalı kalması şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu devre içinde müstahdem ve işçiler serbest olup, isterlerse, iş yerlerinden ayrılabilirler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>Birinci maddede yazılı yerlerden:</template>
      <mvz-bent no="a">
        <template>Halkın yeme ve içmesiyle alakalı maddeleri satanların,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Eczanelerin, umumun yıkanıp temizlenmesine, yatıp kalkmasına veya eğlenmesine mahsus bulunanlarla her nevi lokanta, gazino, kahvehane ve benzerlerinin,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Garaj, akaryakıt satış istasyonları gibi seyrüseferle alakalı olanların,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>öğle dinlenmesini hangi saatlerde ve ne şekilde tatbik edecekleri 1 inci maddede yazılı makam tarafından tesbit ve ilan olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Bu maddenin (b) ve (c) fıkralarında gösterilen yerlerin dinlenme devresinin devamı müddetince kapalı kalmaları mecburiyeti olmayıp ancak, buralarda çalışan işçi ve müstahdemlerin öğle dinlenmeleri, münavebe suretiyle temin olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>İş Kanununa tabi bulunan iş yerlerinde çalışan "işçiler" hakkındaki öğle dinlenmelerinin tatbikına bahsi geçen kanunda yazılı hükümler dairesinde devam olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanun hükümlerinin tatbikı müstahdem ve işçi kazançlarının ve bu kimselere ait sair hakların daha aşağı hadlere indirilmesi için sebep tutulamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanunda yazılı bulunan hükümler işçi ve müstahdemlere öğle dinlenmesi verilmesi hakkında daha elverişli hak ve menfaatler sağlayan kanun, mukavele, adet ve teamüllerden doğan haklara halel getirmez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerine muhalif olarak müstahdem ve işçilerine öğle dinlenmesi yaptırmayan işveren veya işveren vekillerine yüz Türk Lirası idarî para cezası verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunun 5 inci maddesine muhalif hareket eden işveren veya işveren vekiline, müstahdem veya işçi kazançlarının veya bu kimselere ait sair hakların daha aşağı hadlere indirilmesinden dolayı müstahdem veya işçilerin uğradıkları zararın iki katı kadar idarî para cezası verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu maddedeki idarî para cezalarını vermeye belediye encümeni yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanun hükümlerinin nüfusu on binden az şehir ve kasabalarda dahi tatbikı mahalli belediye meclislerinin karar ve ilanına bağlıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanun neşri tarihinde mer'iyete girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunun hükümlerini icraya İcra Vekilleri Heyeti memurdur.</template>
    </mvz-fıkra>
  </mvz-madde>
