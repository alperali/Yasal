  <mvz-künye tür="kanun" no="6701" başlık="TÜRKİYE İNSAN HAKLARI VE EŞİTLİK KURUMU KANUNU"
             tarih="6/4/2016" rgazete-tarih="20/4/2016" rgazete-sayı="29690"
             düstur-tertip="5" düstur-cilt="57" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; insan onurunu temel alarak insan haklarının korunması ve geliştirilmesi, kişilerin eşit muamele görme hakkının güvence altına alınması, hukuken tanınmış hak ve hürriyetlerden yararlanmada ayrımcılığın önlenmesi ile bu ilkeler doğrultusunda faaliyet göstermek, işkence ve kötü muameleyle etkin mücadele etmek ve bu konuda ulusal önleme mekanizması görevini yerine getirmek üzere Türkiye İnsan Hakları ve Eşitlik Kurumunun kurulması, teşkilat, görev ve yetkilerine ilişkin esasların düzenlenmesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Ayrı tutma: Kişilerin bu Kanunda sayılan temellerden biri veya birden fazlası nedeniyle, bir eylem veya eylemsizliğin sonucu olarak diğerlerinden ayrı tutulması durumunu,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ayrımcılık talimatı: Bir kişinin kendi nam veya hesabına eylem ve işlemlerde bulunmaya yetkili kıldığı kişilere veya bir kamu görevlisinin diğer kişilere verdiği ayrımcılık yapılmasına yönelik talimatı,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Başkan: Türkiye İnsan Hakları ve Eşitlik Kurumu Başkanını,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Çoklu ayrımcılık: Ayrımcı uygulamanın birden fazla ayrımcılık temeli ile ilişkili olması durumunu,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Doğrudan ayrımcılık: Bir gerçek veya tüzel kişinin, hukuken tanınmış hak ve hürriyetlerden karşılaştırılabilir durumdakilere kıyasla eşit şekilde yararlanmasını bu Kanunda sayılan ayrımcılık temellerine dayanılarak engelleyen veya zorlaştıran her türlü farklı muameleyi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Dolaylı ayrımcılık: Bir gerçek veya tüzel kişinin, görünüşte ayrımcı olmayan her türlü eylem, işlem ve uygulamalar sonucunda, bu Kanunda sayılan ayrımcılık temelleriyle bağlantılı olarak, hukuken tanınmış hak ve hürriyetlerden yararlanma bakımından nesnel olarak haklılaştırılamayan dezavantajlı bir konuma sokulmasını,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Engelli: Fiziksel, zihinsel, ruhsal ve duyusal yetilerinde çeşitli düzeyde kayıplarından dolayı topluma diğer bireyler ile birlikte eşit şartlarda tam ve etkin katılımını kısıtlayan tutum ve çevre şartlarından etkilenen bireyi,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>İşyerinde yıldırma: Bu Kanunda sayılan ayrımcılık temellerine dayanılarak kişiyi işinden soğutmak, dışlamak, bıktırmak amacıyla kasıtlı olarak yapılan eylemleri,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Kamu görevlisi: Kamu hizmetlerinin yürütülmesine atama veya seçilme yoluyla ya da herhangi bir surette sürekli, süreli veya geçici olarak katılan kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kurul: Türkiye İnsan Hakları ve Eşitlik Kurulunu,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Kurum: Türkiye İnsan Hakları ve Eşitlik Kurumunu,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Makul düzenleme: Engellilerin hak ve özgürlüklerini tam ve diğer bireylerle eşit şekilde kullanmasını veya bunlardan yararlanmasını sağlamak üzere belirli bir durumda ihtiyaç duyulan, mali imkânlar nispetinde, ölçülü, gerekli ve uygun değişiklik ve tedbirleri,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Taciz: Psikolojik ve cinsel türleri de dâhil olmak üzere bu Kanunda sayılan temellerden birisine dayanılarak, insan onurunun çiğnenmesi amacını taşıyan veya böyle bir sonucu doğuran yıldırıcı, onur kırıcı, aşağılayıcı veya utandırıcı her türlü davranışı,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Ulusal önleme mekanizması: İşkenceye ve Diğer Zalimane, Gayriinsanî veya Küçültücü Muamele veya Cezaya Karşı Birleşmiş Milletler Sözleşmesine Ek İhtiyari Protokol hükümleri çerçevesinde kişilerin özgürlüklerinden yoksun bırakıldığı yerlere düzenli ziyaretler yapmak üzere oluşturulan sistemi,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Uygulamalı iş deneyimi: Bir mesleğin gerektirdiği bilgi, beceri ve iş alışkanlıklarının eğitimle eş zamanlı ya da eğitim sonrası dönemde iş içerisinde geliştirilmesini,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Varsayılan temele dayalı ayrımcılık: Bir gerçek veya tüzel kişinin, bu Kanunda sayılan ayrımcılık temellerinden birisiyle gerçekte ilgisi olmamasına rağmen, bu temellerden birisini taşıdığı sanılarak hukuken tanınmış hak ve hürriyetlerden yararlanma bakımından ayrımcı muameleye maruz kalmasını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Ayrımcılıkla Mücadele">
    <mvz-madde no="3" başlık="Eşitlik ilkesi ve ayrımcılık yasağı">
      <mvz-fıkra no="1">
        <template>Herkes, hukuken tanınmış hak ve hürriyetlerden yararlanmada eşittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamında cinsiyet, ırk, renk, dil, din, inanç, mezhep, felsefi ve siyasi görüş, etnik köken, servet, doğum, medeni hâl, sağlık durumu, engellilik ve yaş temellerine dayalı ayrımcılık yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ayrımcılık yasağının ihlali hâlinde, konuya ilişkin görev ve yetkisi bulunan kamu kurum ve kuruluşları ile kamu kurumu niteliğindeki meslek kuruluşları ihlalin sona erdirilmesi, sonuçlarının giderilmesi, tekrarlanmasının önlenmesi, adli ve idari yoldan takibinin sağlanması amacıyla gerekli tedbirleri almakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ayrımcılık yasağı bakımından sorumluluk altında olan gerçek ve özel hukuk tüzel kişileri, yetki alanları içerisinde bulunan konular bakımından ayrımcılığın tespiti, ortadan kaldırılması ve eşitliğin sağlanması için gerekli tedbirleri almakla yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Ayrımcılık türleri">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren ayrımcılık türleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Ayrı tutma.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ayrımcılık talimatı verme ve bu talimatları uygulama.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Çoklu ayrımcılık.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Doğrudan ayrımcılık.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Dolaylı ayrımcılık.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İşyerinde yıldırma.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Makul düzenleme yapmama.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Taciz.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Varsayılan temele dayalı ayrımcılık.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Eşit muamele ilkesine uyulması veya ayrımcılığın önlenmesi amacıyla idari ya da adli süreçleri başlatan yahut bu süreçlere katılan kişiler ile bunların temsilcilerinin, bu nedenle maruz kaldıkları olumsuz muameleler de ayrımcılık teşkil eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Ayrımcılık yasağının kapsamı">
      <mvz-fıkra no="1">
        <template>Eğitim ve öğretim, yargı, kolluk, sağlık, ulaşım, iletişim, sosyal güvenlik, sosyal hizmetler, sosyal yardım, spor, konaklama, kültür, turizm ve benzeri hizmetleri sunan kamu kurum ve kuruluşları, kamu kurumu niteliğindeki meslek kuruluşları, gerçek kişiler ve özel hukuk tüzel kişileri, yürüttükleri faaliyetler bakımından bu hizmetlerden yararlanmakta olan veya yararlanmak üzere başvurmuş olan ya da bu hizmetler hakkında bilgi almak isteyen kişi aleyhine ayrımcılık yapamaz. Bu hüküm kamuya açık hizmetlerin sunulduğu alanlar ve binalara erişimi de kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen hizmetlerin planlanması, sunulması ve denetlenmesinden sorumlu olan kişi ve kurumlar, farklı engelli grupların ihtiyaçlarını dikkate almakla ve makul düzenlemelerin yapılmasını sağlamakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kamu kurum ve kuruluşları, kamu kurumu niteliğindeki meslek kuruluşları, gerçek kişiler, özel hukuk tüzel kişileri ve bunlar tarafından yetkilendirilenler, taşınır ve taşınmazları kamuya açık bir şekilde sunarken bu malları edinmek veya kiralamak isteyenler ile bunlar hakkında bilgi almak isteyenler aleyhine, bunların kiralanması, kira akdinin şartlarının belirlenmesi, kira akdinin yenilenmesi veya sona erdirilmesi, satışı ve devri süreçlerinin hiçbirinde ayrımcılık yapamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Dernek, vakıf, sendika, siyasi parti ve meslek örgütlerine, ilgili mevzuatlarında veya tüzüklerinde belirtilen istisnalar dışında üye olma, organlarına seçilme, üyelik imkânlarından yararlanma, üyeliğin sonlandırılması ve bunların faaliyetlerine katılma ve yararlanma bakımından, hiç kimse aleyhine ayrımcılık yapılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="İstihdam ve serbest meslek">
      <mvz-fıkra no="1">
        <template>İşveren veya işveren tarafından yetkilendirilmiş kişi; işverenin çalışanı veya bu amaçla başvuran kişi, uygulamalı iş deneyimi edinmek üzere bir işyerinde bulunan veya bu amaçla başvuran kişi ve herhangi bir sıfatla çalışmak ya da uygulamalı iş deneyimi edinmek üzere işyeri veya iş ile ilgili olarak bilgi edinmek isteyen kişi aleyhine, bilgilenme, başvuru, seçim kriterleri, işe alım şartları ile çalışma ve çalışmanın sona ermesi süreçleri dâhil olmak üzere, işle ilgili süreçlerin hiçbirinde ayrımcılık yapamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra iş ilanı, işyeri, çalışma şartları, mesleki rehberlik, mesleki eğitim ve yeniden eğitimin tüm düzeylerine ve türlerine erişim, meslekte yükselme ve mesleki hiyerarşinin tüm düzeylerine erişim, hizmet içi eğitim, sosyal menfaatler ve benzeri hususları da kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşveren veya işveren tarafından yetkilendirilmiş kişi, istihdam başvurusunu gebelik, annelik ve çocuk bakımı gerekçeleriyle reddedemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Serbest mesleğe kabul, ruhsat, kayıt, disiplin ve benzeri hususlar bakımından ayrımcılık yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>22/5/2003 tarihli ve 4857 sayılı İş Kanunu kapsamına girmeyen her türlü iş ve iş görme sözleşmeleri de bu madde kapsamındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kamu kurum ve kuruluşlarında istihdam bu madde hükümlerine tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Ayrımcılık iddiasının ileri sürülemeyeceği hâller">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında ayrımcılık iddiasının ileri sürülemeyeceği hâller ve istisnalar şunlardır:</template>
        <mvz-bent no="a">
          <template>İstihdam ve serbest meslek alanlarında, zorunlu mesleki gerekliliklerin varlığı hâlinde amaca uygun ve orantılı olan farklı muamele.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sadece belli bir cinsiyetin istihdamını zorunlu kılan durumlar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İşe kabul ve istihdam sürecinde, hizmetin zorunlulukları nedeniyle yaş sınırlarının belirlenmesi ve uygulanması, gereklilik ve amaçla orantılı olması şartıyla yaşa dayalı farklı muamele.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Çocuk veya özel bir yerde tutulması gereken kişilere yönelik özel tedbirler ve koruma önlemleri.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bir dine ait kurumda, din hizmeti veya o dine ilişkin eğitim ve öğretim vermek üzere sadece o dine mensup kişilerin istihdamı.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Dernek, vakıf, sendika, siyasi parti ve meslek örgütlerinin, ilgili mevzuatlarında veya tüzüklerinde yer alan amaç, ilke ve değerler temelinde üye olacak kişilerde belli şart ve nitelik aramaları.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Eşitsizlikleri ortadan kaldırmaya yönelik, gerekli, amaca uygun ve orantılı farklı muamele.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Vatandaş olmayanların ülkeye giriş ve ikametlerine ilişkin şartlarından ve hukuki statülerinden kaynaklanan farklı muamele.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Kuruluş, Teşkilat Yapısı ve Görevler">
    <mvz-madde no="8" başlık="Türkiye İnsan Hakları ve Eşitlik Kurumu">
      <mvz-fıkra no="1">
        <template>Bu Kanunla ve diğer mevzuatla verilen görevleri yerine getirmek ve yetkileri kullanmak üzere, idari ve mali özerkliğe sahip, özel bütçeli ve kamu tüzel kişiliğini haiz, Cumhurbaşkanının görevlendireceği bakan ile ilişkili Türkiye İnsan Hakları ve Eşitlik Kurumu kurulmuştur. Cumhurbaşkanı bu teşkilatın yönetimi ile ilgili yetkilerini gerekli gördüğü hallerde bakan vasıtasıyla kullanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurum, Kurul ve Başkanlıktan oluşur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Kurumun görevleri">
      <mvz-fıkra no="1">
        <template>Kurumun görevleri şunlardır:</template>
        <mvz-bent no="a">
          <template>İnsan haklarının korunmasına, geliştirilmesine, ayrımcılığın önlenmesine ve ihlallerin giderilmesine yönelik çalışmalar yapmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İnsan hakları ve ayrımcılıkla mücadele konularında kitle iletişim araçlarını da kullanarak bilgilendirme ve eğitim yoluyla kamuoyunda duyarlılığı geliştirmek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Millî eğitim müfredatında bulunan insan hakları ve ayrımcılık yasağıyla ilgili bölümlerin hazırlanmasına katkıda bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>İnsan haklarının korunması, ayrımcılığın ortadan kaldırılması ve toplumdaki eşitlik anlayışının geliştirilmesine yönelik olarak üniversiteler ile ortaklaşa faaliyetlerde bulunmak, Yükseköğretim Kurulunun eşgüdümünde üniversitelerin insan hakları ve eşitlik ile ilgili bölümlerinin kurulmasına ve insan hakları ve eşitlik öğretimine dair müfredatın belirlenmesine katkıda bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kamu kurum ve kuruluşlarının meslek öncesi ve meslek içi insan hakları ve eşitlik eğitimi programlarının esaslarının belirlenmesine ve bu programların yürütülmesine katkıda bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Görev alanıyla ilgili mevzuat çalışmalarını izlemek, değerlendirmek, bunlara ilişkin görüş ve önerilerini ilgili mercilere bildirmek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İnsan hakları ihlallerini resen incelemek, araştırmak, karara bağlamak ve sonuçlarını takip etmek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Ayrımcılık yasağı ihlallerini resen veya başvuru üzerine incelemek, araştırmak, karara bağlamak ve sonuçlarını takip etmek.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Ayrımcılık yasağı ihlalleri nedeniyle mağdur olduğu iddiasıyla Kuruma başvuranlara mağduriyetlerinin giderilmesi için kullanabilecekleri idari ve hukuki süreçler konusunda yol göstermek ve başvurularını takip etmelerini sağlamak amacıyla yardımcı olmak.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>İşkence ve kötü muamele ile mücadele etmek ve bu konuda çalışmalar yapmak.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>İşkenceye ve Diğer Zalimane, Gayriinsanî veya Küçültücü Muamele veya Cezaya Karşı Birleşmiş Milletler Sözleşmesine Ek İhtiyari Protokol hükümleri çerçevesinde ulusal önleme mekanizması olarak görev yapmak.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Özgürlüğünden mahrum bırakılan ya da koruma altına alınan kişilerin ulusal önleme mekanizması kapsamındaki başvurularını incelemek, araştırmak, karara bağlamak ve sonuçlarını takip etmek.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Özgürlüğünden mahrum bırakılan ya da koruma altına alınan kişilerin bulundukları yerlere haberli veya habersiz düzenli ziyaretler gerçekleştirmek, bu ziyaretlere ilişkin raporları ilgili kurum ve kuruluşlara iletmek, Kurulca gerekli görülmesi durumunda kamuoyuna açıklamak, ceza infaz kurumları ve tutukevleri izleme kurulları, il ve ilçe insan hakları kurulları ile diğer kişi, kurum ve kuruluşların bu gibi yerlere gerçekleştirdikleri ziyaretlere ilişkin raporları incelemek ve değerlendirmek.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Cumhurbaşkanlığına, ve Türkiye Büyük Millet Meclisi Başkanlığına sunulmak üzere, insan haklarının korunması ve geliştirilmesi, işkence ve kötü muameleyle mücadele ve ayrımcılıkla mücadele alanlarında yıllık raporlar hazırlamak.</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Kamuoyunu bilgilendirmek, düzenli yıllık raporlar dışında, gerek görüldüğünde görev alanına ilişkin özel raporlar yayımlamak.</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>İnsan hakları ve ayrımcılıkla mücadele alanındaki uluslararası gelişmeleri izlemek ve değerlendirmek, alanındaki uluslararası kuruluşlarla ilgili mevzuat dâhilinde işbirliği yapmak.</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>İnsan haklarının korunması ve ayrımcılıkla mücadele kapsamında faaliyet yürüten kamu kurum ve kuruluşları, sivil toplum kuruluşları, meslek kuruluşları ve üniversitelerle işbirliği yapmak.</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Diğer kurumların ayrımcılığın önlenmesine yönelik faaliyetlerine destek vermek.</template>
        </mvz-bent>
        <mvz-bent no="ö">
          <template>Türkiye’nin taraf olduğu uluslararası insan hakları sözleşmelerinin uygulanmasını izlemek, bu sözleşmeler uyarınca kurulan inceleme, izleme ve denetleme mekanizmalarına Devletin sunmakla yükümlü olduğu raporların hazırlanması sürecinde, ilgili sivil toplum kuruluşlarından da yararlanmak suretiyle görüş bildirmek, bu raporların sunulacağı uluslararası toplantılara temsilci göndererek katılmak.</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>Kanunlarla verilen diğer görevleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu kurum ve kuruluşları ile görevliler, birinci fıkranın (j) bendi kapsamındaki ziyaretler sebebiyle gerekli yardım ve kolaylığı göstermek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurum, görev ve yetkilerine ilişkin olarak Türkiye Büyük Millet Meclisi İnsan Haklarını İnceleme Komisyonunu ve Kadın Erkek Fırsat Eşitliği Komisyonunu yılda en az bir defa bilgilendirir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Kurul">
      <mvz-fıkra no="1">
        <template>Kurul, Kurumun karar organıdır. Kurul, bu Kanunla ve diğer mevzuatla verilen görev ve yetkilerini kendi sorumluluğu altında, bağımsız olarak yerine getirir ve kullanır. Görev alanına giren konularla ilgili olarak hiçbir organ, makam, merci veya kişi, Kurula emir ve talimat veremez, tavsiye ve telkinde bulunamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurul; biri Başkan, biri İkinci Başkan olmak üzere Cumhurbaşkanı tarafından seçilen on bir üyeden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkraya göre Cumhurbaşkanınca seçilen üyelerin görev süreleri dolmadan iki ay önce durum, Kurum tarafından uygun iletişim araçlarıyla kamuoyuna duyurulur. Başvurular Cumhurbaşkanlığına yapılır. İkinci fıkrada belirtilen usule göre yeni seçilen üyeler, yerlerine seçildikleri üyenin görev süresinin bitiminden itibaren göreve başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurula üye olabilmek için aşağıdaki şartlar aranır:</template>
        <mvz-bent no="a" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanununun 48 inci maddesinin birinci fıkrasının (A) bendinin (1), (4), (5), (6) ve (7) numaralı alt bentlerinde belirtilen nitelikleri taşımak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Herhangi bir siyasi partinin yönetim ve denetim organlarında görevli veya yetkili bulunmamak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>En az dört yıllık lisans düzeyinde yükseköğrenim görmüş olmak.</template>
        </mvz-bent>
        <mvz-bent no="d" durum="mülga">
          <template></template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="5" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Üyeliklerde görev süresi dolmadan herhangi bir sebeple boşalma olması hâlinde, bir ay içinde aynı usulle yeni üye seçilir. Bu şekilde seçilen üye, yerine seçildiği üyenin kalan süresini tamamlar ve bunlardan iki yıl veya daha az süreyle görev yapanların bu görevleri seçilme dönemi olarak değerlendirilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Başkan, İkinci Başkan ve üyelerin süreleri dolmadan herhangi bir nedenle görevlerine son verilemez. Ancak üyenin;</template>
        <mvz-bent no="a">
          <template>Seçilmesi için gerekli şartları taşımaması ya da sonradan kaybetmesi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kurul kararlarını süresi içinde imzalamaması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kurul tarafından kabul edilebilir mazereti olmaksızın bir takvim yılı içinde toplam beş Kurul toplantısına katılmaması,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Ağır hastalık veya engellilik nedeniyle iş göremeyeceğinin sağlık kurulu raporuyla belgelenmesi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Görevi ile ilgili olarak işlediği suçlardan dolayı hakkında verilen mahkûmiyet kararının kesinleşmesi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Geçici iş göremezlik hâlinin üç aydan fazla sürmesi,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>657 sayılı Kanunun 48 inci maddesinin birinci fıkrasının (A) bendinin (5) numaralı alt bendinde belirtilen suçlardan mahkûm edilip de cezasının infazına fiilen başlanması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>hâllerinin Kurul tarafından tespit edilmesi üzerine Cumhurbaşkanı veya görevlendireceği bakanın onayıyla üyeliğine son verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Üyelerin Kurulda görev yaptıkları sürece önceki görevleri ile olan ilişikleri kesilir. Üyeler, özel bir kanuna dayanmadıkça, Kuruldaki görevlerinin dışında resmî veya özel hiçbir görev alamaz, dernek, vakıf, kooperatif ve benzeri yerlerde yöneticilik ve denetçilik yapamaz, ticaretle uğraşamaz, serbest meslek faaliyetinde bulunamaz, hakemlik ve bilirkişilik yapamaz. Ancak üyeler, asli görevlerini aksatmayacak şekilde bilimsel amaçlı yayın yapabilir, ders ve konferans verebilir ve bunlardan doğacak telif hakları ile ders ve konferans ücretlerini alabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Kamu görevlisi iken üyeliğe seçilenler, memuriyete giriş şartlarını kaybetmemeleri kaydıyla, görev sürelerinin sona ermesi veya görevden ayrılma isteğinde bulunmaları ve otuz gün içinde önceki kurum veya kuruluşlarına başvurmaları durumunda atamaya yetkili makam tarafından bir ay içinde mükteseplerine uygun bir kadroya atanır. Atama gerçekleşinceye kadar, bunların almakta oldukları her türlü ödemelerin Kurum tarafından yapılmasına devam olunur. Bunların Kurumda geçirdiği süreler, özlük ve diğer hakları açısından önceki kurum veya kuruluşlarında geçirilmiş sayılır. Bir kamu kurumunda çalışmayanlardan üyeliğe seçilip yukarıda belirtilen şekilde görevi sona erenlere herhangi bir görev veya işe başlayıncaya kadar, almakta oldukları her türlü ödemeler Kurum tarafından ödenmeye devam edilir ve bu şekilde üyeliği sona erenlere Kurum tarafından yapılacak ödeme üç ayı geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Başkan ve üyeler, 19/4/1990 tarihli ve 3628 sayılı Mal Bildiriminde Bulunulması, Rüşvet ve Yolsuzluklarla Mücadele Kanununa tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Seçilen üyeler ilk toplantının başında aşağıdaki şekilde yemin ederler:</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>“Görevimi tam bir tarafsızlık, dürüstlük, hakkaniyet ve adalet anlayışı içinde yerine getireceğime, namusum ve şerefim üzerine yemin ederim.”</template>
      </mvz-fıkra>
      <mvz-fıkra no="14">
        <template>2/12/1999 tarihli ve 4483 sayılı Memurlar ve Diğer Kamu Görevlilerinin Yargılanması Hakkında Kanun uyarınca Başkan ve üyeler için soruşturma yapılması Cumhurbaşkanı veya görevlendireceği bakanın iznine tabidir. Soruşturma izni verilmesi veya verilmemesine ilişkin kararlara karşı itirazlar Danıştay tarafından karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="15">
        <template>Başkan ve üyeler ile Kurum personeli, görevlerini yerine getirmeleri sırasında edindikleri, kamuya, ilgililere ve üçüncü kişilere ait gizlilik taşıyan bilgileri, kişisel verileri, Kurumla ilgili gizlilik taşıyan bilgileri, ticari sırları ve bunlara ait belgeleri, bu konuda kanunen yetkili kılınan mercilerden başkasına açıklayamaz, kendilerinin veya üçüncü kişilerin yararına kullanamaz. Bu yükümlülük görevden ayrılmalarından sonra da devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Kurulun görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>Kurulun görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Kurumla ve Kurumun görev alanıyla ilgili düzenlemeler yapılmasına yönelik kararlar almak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ayrımcılık yasağı ihlallerine ilişkin başvurular ile insan hakları veya ayrımcılık yasağı ihlallerine ilişkin resen yapılan incelemeleri karara bağlamak, bu başvuru ve incelemelere ilişkin gerekli hâllerde uzlaşma sürecini sonuçlandırmak, ayrımcılık yasağı ihlallerine ilişkin bu Kanunda öngörülen idari yaptırımlara karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İnsan hakları ve ayrımcılık yasağı ihlallerine ilişkin yargı kararlarının uygulanmasına ilişkin sorunları izlemek ve değerlendirmek.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Özgürlüğünden mahrum bırakılan ya da koruma altına alınan kişilerin ulusal önleme mekanizması kapsamındaki başvurularını ve bu kapsamda resen yürütülen incelemeleri karara bağlamak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Görev alanıyla ilgili olarak yargı organlarına, kamu kurum ve kuruluşlarına ve ilgili kişilere talepleri hâlinde görüş bildirmek.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Gerek gördüğünde Kurumun kendi alanında çalışan uluslararası kuruluşlara üye olmasına ve bu kuruluşlarla işbirliği yapmasına karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kurum tarafından insan haklarının korunması, ayrımcılıkla mücadele ve ulusal önleme mekanizması görevleri kapsamında yapılan inceleme ve araştırmaları, hazırlanan raporları ve benzeri çalışmaları karara bağlamak.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kurumun stratejik planını karara bağlamak, amaç ve hedeflerini, hizmet kalite standartlarını ve performans ölçütlerini belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Kurumun stratejik planı ile amaç ve hedeflerine uygun olarak hazırlanan bütçe teklifini görüşmek ve karara bağlamak.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kurumun faaliyet raporlarını karara bağlamak.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Taşınmaz alımı, satımı ve kiralanması konularındaki önerileri görüşüp karara bağlamak.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Kanunlarla verilen diğer görevleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Kurulun çalışma esasları">
      <mvz-fıkra no="1">
        <template>Kurul, Başkanın çağrısı üzerine toplanır. Toplantıları Başkan yönetir. Başkanın dışında en az beş üyenin birlikte talep etmesi hâlinde, Kurul, Başkan tarafından beş gün içinde toplanmak üzere derhâl toplantıya çağrılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplantı gündemi Başkan tarafından hazırlanarak, toplantıdan en az üç gün önce Kurul üyelerine bildirilir. Gündeme yeni madde eklenebilmesi için toplantıda üyelerden birinin öneride bulunması ve önerilen maddenin Kurul tarafından kabul edilmesi gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurul, en az yedi üye ile toplanır ve en az altı üyenin aynı yöndeki oyuyla karar alır. Kararlarda çekimser oy kullanılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurul, kendi üyeleri arasından, her bir çalışma alanı için üçer üyeli komisyonlar oluşturabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurul, başvuruları görüşmek ve sonuçlandırmak üzere Başkan hariç beş üyeli daireler oluşturabilir. Başkan, dairelerin doğal üyesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kurul kararları tutanakla tespit edilir ve karar tutanağı toplantı esnasında veya en geç toplantıyı izleyen beş iş günü içinde toplantıya katılan tüm üyeler tarafından imzalanarak</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>tekemmül ettirilir. Toplantı tarihinden itibaren en geç on beş iş günü içinde gerekçeler ve varsa karşı oy gerekçeleri yazılır. Gerektiğinde, Kurul tarafından bu süre uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Başkan ve üyeler; kendileri, aralarındaki evlilik bağı kalkmış olsa bile eşleri, evlatlıkları ve üçüncü derece dâhil üçüncü dereceye kadar kan ve ikinci derece dâhil ikinci dereceye kadar kayın hısımlarıyla ilgili veya kişisel menfaat ilişkisi içinde oldukları konularda toplantı ve oylamaya katılamaz. Bu durum karar metninde ayrıca belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Aksi kararlaştırılmadıkça Kurul toplantılarındaki müzakereler gizlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>İhtiyaç duyulması hâlinde görüşlerinden yararlanılmak üzere ilgililer Kurul toplantısına davet edilebilir. Ancak, Kurul kararları toplantıya dışarıdan katılanların yanında alınamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Kurul kararları, tekemmül etmesinden itibaren en geç beş iş günü içinde ilgililere gönderilir. Kurul kararlarında, ilgili kişilerin bu kararlara karşı hangi hukuki yollara başvurabilecekleri süreleri ile birlikte belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Kurul, gerekli gördüğü durumlarda kararlarını, kişisel verilerin gizliliği ilkesine bağlı kalmak kaydıyla uygun vasıtalarla kamuoyuna duyurabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Kurul üyeleri ile Kurum personelinin uyacakları mesleki ve etik ilkeler, bu maddede belirtilen komisyonların ve dairelerin oluşumu, çalışma esasları ile Kurulun çalışma usul ve esasları ve diğer hususlar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Başkan">
      <mvz-fıkra no="1">
        <template>Başkan, Kurumun en üst amiri olup, Kurum hizmetlerini mevzuata, Kurumun amaç ve politikalarına, stratejik planına, performans ölçütlerine ve hizmet kalite standartlarına uygun olarak düzenler, yürütür ve hizmet birimleri arasında eşgüdümü sağlar. Başkan, Kurumun genel yönetim ve temsilinden sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Başkanın görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Kurul toplantılarının gündemini, gün ve saatini belirlemek ve toplantıları yönetmek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kurul kararlarının tebliğini ve Kurulca gerekli görülenlerin kamuoyuna duyurulmasını sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Hizmet birimi koordinatörlerini görevlendirmek ve diğer Kurum personelini atamak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Hizmet birimlerinden gelen önerilere son şeklini vererek Kurula sunmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kurumun stratejik planını, performans ölçütlerini hazırlamak, amaç ve hedeflerini, hizmet kalite standartlarını, insan kaynakları ve çalışma politikalarını oluşturmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Belirlenen stratejilere, yıllık amaç ve hedeflere uygun olarak Kurumun yıllık bütçesi ile mali tablolarını hazırlamak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Yıllık faaliyet raporlarını hazırlamak, yıllık amaç ve hedeflere, performans ölçütlerine göre faaliyetlerin değerlendirmesini yapmak ve bunları Kurula sunmak.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kurul ve hizmet birimlerinin uyumlu, verimli, disiplinli ve düzenli bir biçimde çalışması amacıyla eşgüdümü sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Kurumun yönetim ve işleyişine ilişkin diğer görevleri yerine getirmek.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Başkanın yokluğunda İkinci Başkan, Başkana vekâlet eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Başkanlık">
      <mvz-fıkra no="1">
        <template>Başkanlık, Başkan Yardımcıları, hizmet birimleri ve çalışma gruplarından oluşur. Hizmet birimlerinin sayısı onu geçemez. Başkanlık, Kurul kararlarını uygulamakla ve diğer konularda Başkana ve Kurula yardımcı olmakla görevlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurul Başkanı, Kurumun da başkanıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hizmet birimleri, Başkan tarafından belirlenen koordinatörlerin eşgüdümünde faaliyet gösterir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurum, görev alanına giren konularla ilgili olarak çalışmalarda bulunmak üzere kamu kurum ve kuruluşları, sivil toplum kuruluşları ve konuyla ilgili uzmanların katılımı ile altı ay süreli geçici komisyonlar oluşturabilir. Başkan, bu süreyi üç aya kadar uzatabilir. Gerekli görülmesi hâlinde Kurul, altı aylık süreyi iki katına kadar uzatabilir. Ayda ikiyi geçmemek kaydıyla komisyonların toplantılarına ilişkin giderler Kurum bütçesinden karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Gerek görülmesi hâlinde, Kurumun teklifi üzerine Cumhurbaşkanı kararıyla Kuruma bağlı bürolar kurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Hizmet birimleri ve büroların çalışma usul ve esasları, bu Kanunda belirtilen faaliyet alanı, görev ve yetkilerine uygun olarak Kurumun teklifi üzerine Cumhurbaşkanınca yürürlüğe konulan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Personel Rejimi">
    <mvz-madde no="15" başlık="Personele ve özlük haklarına ilişkin hükümler">
      <mvz-fıkra no="1">
        <template>Kurum personeli, bu Kanunla düzenlenen hususlar dışında 657 sayılı Kanuna tabidir. Hizmet birimi koordinatörü olarak görevlendirilenlerde bakanlık daire başkanı kadrolarına atanmak için aranan şartlar aranır ve bunlara kadrolarına bağlı olarak mali haklar kapsamında yapılan aylık net ödeme tutarının, bakanlık daire başkanına kadrosuna bağlı olarak yapılması öngörülen aylık net ödeme tutarından az olması hâlinde aradaki fark, herhangi bir vergi ve kesintiye tabi olmaksızın ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurul Başkanına 27/6/1989 tarihli ve 375 sayılı Kanun Hükmünde Kararnameye ekli (II) sayılı cetvelin 3 üncü sırasında, Kurul üyelerine anılan cetvelin 4 üncü sırasında yer alan göstergeler üzerinden anılan Kanun Hükmünde Kararnamenin ek 10 uncu maddesinde öngörülen usul ve esaslar çerçevesinde ödeme yapılır. Söz konusu ödemelerden vergi ve diğer yasal kesintilere tabi olmayanlar bu fıkraya göre yapılacak ödemelerde de vergi ve diğer yasal kesintilere tabi tutulmaz. Başkan ve üyeler, 657 sayılı Kanun ve diğer ilgili mevzuat uyarınca Devlet memurlarının yararlandığı sosyal hak ve yardımlardan da aynı usul ve esaslar çerçevesinde yararlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Başkan ve üyeler ile Kurum personeli 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 4 üncü maddesinin birinci fıkrasının (c) bendi hükümlerine tabidir. Başkan ve üyeler ile başkan yardımcıları emeklilik hakları bakımından sırasıyla Gelir İdaresi Başkanı, bakanlık genel müdürleri ve bakanlık genel müdür yardımcıları ile denk kabul edilir. Bunlardan bu görevleri sırasında 5510 sayılı Kanunun geçici 4 üncü maddesi kapsamına girenlerin bu görevlerde geçen süreleri makam tazminatı ile temsil tazminatı ödenmesi gereken süre olarak değerlendirilir. 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında sigortalı iken üyeliğe seçilenlerden bu görevleri sona erenler veya bu görevlerinden ayrılma isteğinde bulunanların bu görevlerde geçen hizmet süreleri kazanılmış hak aylık, derece ve kademelerinin tespitinde dikkate alınır. Kamu kurum ve kuruluşlarında 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında sigortalı iken üyeliğe seçilenlerin, önceki kurum ve kuruluşları ile ilişiklerinin kesilmesi kendilerine kıdem tazminatı veya iş sonu tazminatı ödenmesini gerektirmez. Bu durumda olanların kıdem tazminatı veya iş sonu tazminatı ödenmesi gereken hizmet süreleri, üyelikte geçen hizmet süreleri ile birleştirilir ve emeklilik ikramiyesi ödenecek süre olarak değerlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurul tarafından, Kuruma ilişkin görevlerinde Başkana yardımcı olmak üzere, Kurumun görev alanları dikkate alınarak üç Başkan Yardımcısı atanır. Başkan Yardımcısı olarak atanacaklarda;</template>
        <mvz-bent no="a">
          <template>En az dört yıllık lisans düzeyinde yükseköğrenim görmüş olma,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu hizmetinde en az on yıllık mesleki tecrübeye sahip olma,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>657 sayılı Kanunun 48 inci maddesinin birinci fıkrasının (A) bendinin (1), (4), (5), (6) ve (7) numaralı alt bentlerinde belirtilen nitelikleri taşıma,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>şartları aranır. Başkan yardımcılarının görev süresi dört yıldır. Görevi sona eren başkan yardımcıları yeniden atanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Başkan, sınırlarını yazılı ve açık olarak belirlemek şartıyla Kurula ilişkin olmayan görev ve yetkilerinin bir bölümünü başkan yardımcılarına veya hizmet birimi koordinatörlerine devredebilir. Yetki devri, uygun araçlarla ilgililere duyurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kurumda, 657 sayılı Kanun ve diğer mevzuat hükümlerine bağlı kalmaksızın, sözleşmeli personel istihdam edilebilir. Sözleşmeli olarak istihdam edilecek personel, 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında sigortalı sayılır. Bu personelin atama usul ve esasları Kurumca belirlenir. Bunlara ödenecek ücretin net tutarı, birinci dereceli İnsan Hakları ve Eşitlik Uzmanına ödenen aylık ortalama net tutarı aşmamak üzere Başkan tarafından tespit edilir. Bu fıkra uyarınca çalıştırılacakların sayısı İnsan Hakları ve Eşitlik Uzmanı ve İnsan Hakları ve Eşitlik Uzman Yardımcısı toplam kadro sayısının yüzde on beşini geçemez. Bu fıkraya göre istihdam edilecek sözleşmeli personelin, yurt içindeki ve yurt dışındaki üniversitelerin en az dört yıllık eğitim veren Kurumca belirlenecek bölümlerinden mezun olması ve en az yarısının Kurumca belirlenecek yabancı diller için Yabancı Dil Bilgisi Seviye Tespit Sınavından en az (C) düzeyinde puan alması veya buna denk kabul edilen ve uluslararası geçerliliği bulunan bir belgeye sahip olması gerekir. Kurumca belirlenecek yabancı dillerin konuşulduğu ülkelerde dört yıllık eğitim veren kurumlardan mezun olan kişilerden yabancı dil belgesi istenmez. Bu fıkrada belirtilen yabancı dil bilgisine ilişkin şartlar yabancı uyruklular için aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Merkezi yönetim kapsamındaki kamu idarelerinde, sosyal güvenlik kurumlarında, mahalli idarelerde, mahalli idarelere bağlı idarelerde, mahalli idare birliklerinde, döner sermayeli kuruluşlarda, kanunlarla kurulan fonlarda, kamu tüzel kişiliğini haiz kuruluşlarda, sermayesinin yüzde ellisinden fazlası kamuya ait kuruluşlarda, iktisadi devlet teşekkülleri ve kamu iktisadi kuruluşları ile bunlara bağlı ortaklıklar ve müesseselerde görevli memurlar ile diğer kamu görevlileri kurumlarının, hakimler ve savcılar ise kendilerinin muvafakati ile aylık, ödenek, her türlü zam ve tazminatlar ile diğer mali ve sosyal hak ve yardımları kurumlarınca ödenmek kaydıyla geçici olarak Kurumda görevlendirilebilir. Kurumun bu konudaki talepleri, ilgili kurum ve kuruluşlarca öncelikle sonuçlandırılır. Bu şekilde görevlendirilen personel, kurumlarından aylıklı izinli sayılır. Bu personelin izinli oldukları sürece memuriyetleri ile ilgileri ve özlük hakları devam ettiği gibi, bu süreler yükselme ve emekliliklerinde de hesaba katılır ve yükselmeleri başkaca bir işleme gerek duyulmadan süresinde yapılır. Hakim ve savcılar dâhil bu madde kapsamında görevlendirilenlerin Kurumda geçirdikleri süreler, kendi kurumlarında geçirilmiş sayılır. Görevlendirme süresi iki yılı geçemez. Ancak ihtiyaç hâlinde bu süre bir yıllık dönemler hâlinde uzatılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="İnsan Hakları ve Eşitlik Uzmanı ve Uzman Yardımcıları">
      <mvz-fıkra no="1">
        <template>Kurumda, İnsan Hakları ve Eşitlik Uzmanı ve İnsan Hakları ve Eşitlik Uzman Yardımcısı istihdam edilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Başvurular ve İnceleme Usulleri">
    <mvz-madde no="17" başlık="Başvurular">
      <mvz-fıkra no="1">
        <template>Ayrımcılık yasağı ihlalinden zarar gördüğü iddiasında bulunan her gerçek ve tüzel kişi Kuruma başvurabilir. Kuruma başvuru, illerde valilikler, ilçelerde kaymakamlıklar aracılığıyla da yapılabilir. Başvuru hakkının etkin bir şekilde kullanılmasına hiçbir surette engel olunamaz. Başvurulardan herhangi bir ücret alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlgililer, Kuruma başvurmadan önce bu Kanuna aykırı olduğunu iddia ettikleri uygulamanın düzeltilmesini ilgili taraftan talep eder. Bu taleplerin reddedilmesi veya otuz gün içerisinde cevap verilmemesi hâlinde Kuruma başvuru yapılabilir. Ancak Kurum, telafisi güç veya imkânsız zararların doğması ihtimali bulunan hâllerde, bu şartı aramadan başvuruları kabul edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dava açma süresi içinde Kuruma yapılan başvurular işlemeye başlamış olan dava açma süresini durdurur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yasama ve yargı yetkilerinin kullanılmasına ilişkin işlemler, Hâkimler ve Savcılar Yüksek Kurulu kararları ile Anayasanın yargı denetimi dışında bıraktığı işlemler başvurunun konusu olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>4857 sayılı Kanunun 5 inci maddesi kapsamına giren ayrımcılık iddialarına ilişkin başvurular, 4857 sayılı Kanun ve ilgili mevzuatında belirlenen şikâyet usulleri izlendikten sonra herhangi bir yaptırım kararı alınmadığı hâllerde yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İnsan hakları ve ayrımcılık yasağı ihlallerine ilişkin resen yapılan incelemeler için ihlal mağdurunun şahsen belirlenebilir olduğu durumlarda kendisinin veya kanuni temsilcisinin açık rızasının alınması şarttır. Ancak, çocuğun yüksek yararının gerektirdiği hâllerde kanuni temsilcisinin rızası aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kuruma yapılacak başvurularda, vesayet ya da koruma altında olanlar ve çocuklar ile talepleri üzerine mağdur ya da mağdurların kimlik bilgileri gizli tutulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>9 uncu maddenin birinci fıkrasının (i) bendi kapsamında yapılan başvurular hakkında da bu madde hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>İşleme konulmayacak başvurular ve gerekçeli kabul edilmezlik kararları ile başvuruya ilişkin diğer usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="İhlal incelemeleri">
      <mvz-fıkra no="1">
        <template>Kurum, başvuruları ve resen yaptığı incelemeleri başvuru ve resen inceleme kararı tarihinden itibaren en geç üç ay içinde sonuçlandırır. Bu süre, Başkan tarafından bir defaya mahsus olmak üzere en fazla üç ay uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurum, ihlal iddiasına muhatap olan taraftan yazılı görüşünü sunmasını ister. Yazılı görüş, istemin tebliğinden itibaren on beş gün içinde Kuruma ulaştırılır. Yazılı görüş, başvuran kişiye tebliğ edilerek, görüşünü tebliğden itibaren en geç on beş gün içinde Kuruma sunması istenir. Talep hâlinde Başkan bu süreleri bir defaya mahsus olmak üzere on beş gün uzatabilir. Taraflara talepleri hâlinde Kurul önünde ayrı ayrı sözlü açıklama yapma hakkı tanınabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Başkan, incelemenin özelliğine göre, görüşlerin alınmasından sonra, resen veya talep üzerine tarafları uzlaşmaya davet edebilir. Uzlaşma, insan hakları veya ayrımcılık yasağı ihlali olduğu iddia olunan uygulamaya son verilmesi veya mağdur açısından bu sonucu sağlayacak çözümleri içerebileceği gibi mağdura belli bir tazminatın ödenmesi biçiminde de olabilir. Uzlaşma en geç bir ay içinde sonuçlandırılır. Uzlaşma müzakereleri sırasında yapılan tespitler, alınan beyanlar veya açıklamalar, herhangi bir soruşturma ve kovuşturmada ya da davada delil olarak kullanılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Uzlaşma yoluyla sonuçlandırılamayan başvurular ve incelemeler hakkında ilgili rapora ilişkin müzekkere yirmi gün içinde Kurula sunulur. Bunun üzerine Kurul, insan hakları veya ayrımcılık yasağı ihlali yapılıp yapılmadığına ilişkin karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurul, konusu suç teşkil eden insan hakları veya ayrımcılık yasağı ihlallerini tespit ettiği takdirde, bunlarla ilgili suç duyurusunda bulunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="İnceleme yetkisi">
      <mvz-fıkra no="1">
        <template>Bu Kanunla ve diğer mevzuatla Kuruma verilen inceleme, araştırma, ziyaret ve rapor hazırlama görevleri ile diğer görevler, insan hakları ve eşitlik uzmanları, insan hakları ve eşitlik uzman yardımcıları ve Başkan tarafından görevlendirilen diğer Kurum personeli tarafından yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada sayılanlar, Başkanın yetkilendirmesi hâlinde, tüm kamu kurum ve kuruluşları ile diğer gerçek ve tüzel kişilerden ilgili bilgi ve belgeleri istemeye, incelemeye ve bunların örneklerini almaya, ilgililerden yazılı ve sözlü bilgi almaya, özgürlüğünden mahrum bırakılan ya da koruma altına alınan kişilerin bulundukları yerleri ziyaret etmeye, buralarda inceleme yapmaya ve gerekli tutanakları düzenlemeye, kötü muameleye maruz kaldığı iddia edilen kişi ya da kişilerle görüşmeye yetkilidir. Kamu kurum ve kuruluşları ile diğer gerçek ve tüzel kişiler, Kurumun ziyaretlerini kolaylaştırmak ve taleplerini gecikmeksizin yerine getirmek zorundadırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurumun görev ve yetki alanına giren konularda yerinde inceleme ve araştırma yapmak üzere,  Başkanın belirleyeceği Kurum personelinin başkanlığında,  ilgili kurum ve kuruluşların temsilcilerinin ve diğer kişilerin katılımıyla heyet oluşturulabilir. Heyette görev alacak kamu kurum ve kuruluşları temsilcileri kendi kurum ve kuruluşlarınca, diğer kişiler ise Başkan tarafından belirlenir. Heyetler tarafından yapılan inceleme ve araştırmaların sonuçları Kurum tarafından bir rapor hâline getirilir. Heyetlerin giderleri Kurum bütçesinden karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurumun inceleme ve araştırma konusuyla ilgili olarak gerekçesini belirterek istediği bilgi ve belgelerin, bu talebin tebliğ edildiği tarihten itibaren otuz gün içinde verilmesi zorunludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Bilirkişi görevlendirilmesi ve tanık dinlenmesi">
      <mvz-fıkra no="1">
        <template>Kurumca inceleme ve araştırma yapılan ve ileri derecede teknik ve mali uzmanlık bilgisi gerektiren konularla ilgili olarak, Başkan ya da Kurul tarafından, ücreti Kurum bütçesinden ödenmek üzere bilirkişi görevlendirilebilir. Bilirkişi olarak görev yapacakların nitelikleri ve çalışma esasları yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>10/2/1954 tarihli ve 6245 sayılı Harcırah Kanunu hükümleri saklı kalmak üzere, Kurum dışından görevlendirilmek ve ayda beşi geçmemek kaydıyla her inceleme ve araştırma konusu için uhdesinde kamu görevi bulunan her bilirkişiye (1.000), uhdesinde kamu görevi bulunmayan her bilirkişiye (2.000) gösterge rakamının memur aylık katsayısıyla çarpımı sonucu bulunacak miktarı geçmemek üzere bilirkişi ücreti ödenir. Bu ödemeler, damga vergisi hariç herhangi bir vergi ve kesintiye tabi tutulmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İnceleme ve araştırma konusuyla ilgili olarak gerek görülmesi hâlinde Kurul ve inceleme ve araştırma yapmaya yetkili Kurum personeli, tanık veya ilgili kişileri dinleyebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="İspat yükü">
      <mvz-fıkra no="1">
        <template>Münhasıran ayrımcılık yasağının ihlali iddiasıyla Kuruma yapılan başvurularda, başvuranın iddiasının gerçekliğine ilişkin kuvvetli emarelerin ve karine oluşturan olguların varlığını ortaya koyması hâlinde, karşı tarafın ayrımcılık yasağını ve eşit muamele ilkesini ihlal etmediğini ispat etmesi gerekir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="İstişare komisyonu ve istişare toplantıları">
      <mvz-fıkra no="1">
        <template>Ayrımcılık yasağıyla ilgili konularda sorunları ve çözüm önerilerini tartışmak ve bu konularda bilgi ve görüş alışverişinde bulunmak amacıyla, kamu kurum ve kuruluşları, sivil toplum kuruluşları, sendikalar, sosyal ve mesleki kuruluşlar, yükseköğretim kurumları, basın ve yayın kuruluşları, araştırmacılar ve ilgili diğer kişi, kurum ve kuruluşların katılımıyla istişare komisyonu oluşturulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurum, insan hakları sorunlarını tartışmak ve insan hakları konularında bilgi ve görüş alışverişinde bulunmak amacıyla, kamu kurum ve kuruluşları, sivil toplum kuruluşları, sendikalar, sosyal ve mesleki kuruluşlar, yükseköğretim kurumları, basın ve yayın kuruluşları, araştırmacılar ve ilgili diğer kişi, kurum ve kuruluşların katılımıyla merkezde ve illerde istişare toplantıları gerçekleştirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Çeşitli ve Son Hükümler">
    <mvz-madde no="23" başlık="Kurumun gelirleri">
      <mvz-fıkra no="1">
        <template>Kurumun gelirleri şunlardır:</template>

    <mvz-madde no="24" başlık="İstatistik">
      <mvz-fıkra no="1">
        <template>Kurul, ayrımcılıkla mücadele amacıyla hangi alanlarda resmî nitelikte istatistik toplanmasına ihtiyaç olduğuna Türkiye İstatistik Kurumu ve diğer ilgili kurum ve kuruluşlarla birlikte karar verir. Ayrımcılık belirtilerinin tüm boyutlarını ortaya koyabilmek için gerekli olan istatistiksel bilgilerin, verilere sürekli ve eksiksiz şekilde erişilmesini sağlayacak bir sistem içinde toplanmasından Resmî İstatistik Programı kapsamında Türkiye İstatistik Kurumu sorumludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="İdari yaptırımlar">
      <mvz-fıkra no="1">
        <template>Ayrımcılık yasağının ihlali hâlinde, bu ihlalin etki ve sonuçlarının ağırlığı, failin ekonomik durumu ve çoklu ayrımcılığın ağırlaştırıcı etkisi dikkate alınarak ihlalden sorumlu olan kamu kurum ve kuruluşları, kamu kurumu niteliğindeki meslek kuruluşları, gerçek kişiler ve özel hukuk tüzel kişileri hakkında bin Türk lirasından on beş bin Türk lirasına kadar idari para cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen idari para cezasının kamu kurum ve kuruluşları ile kamu kurumu niteliğindeki meslek kuruluşları hakkında uygulanması hâlinde, ödenen idari para cezası, cezaya esas ayrımcı uygulamaya kusuruyla sebebiyet veren kamu kurum ve kuruluşlarında görev yapan memurlar ve diğer kamu görevlileri ile kamu kurumu niteliğindeki meslek kuruluşlarında görev yapanlara rücu edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>19 uncu maddede öngörülen yükümlülüklere, uyarıya rağmen haklı bir neden olmaksızın belirtilen sürede uymayan birinci fıkra kapsamındaki kişi ve kuruluşlar hakkında beş yüz Türk lirasından iki bin Türk lirasına kadar idari para cezası uygulanır. Bu fıkrada düzenlenen idari para cezaları hakkında da ikinci fıkra hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurul, verdiği idari para cezasını bir defaya mahsus olmak üzere uyarı cezasına dönüştürebilir. Hakkında uyarı cezası verilen kişi veya kurumun ayrımcı fiilinin tekrarı hâlinde alacağı ceza yüzde elli oranında artırılır. Bu artış ceza üst sınırını aşamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanuna göre verilen idari para cezaları tebliğinden itibaren bir ay içinde ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanunda hüküm bulunmayan hâllerde idari yaptırımlara ilişkin olarak 30/3/2005 tarihli ve 5326 sayılı Kabahatler Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="İnsan hakları ve ayrımcılıkla mücadele eğiticileri">

    <mvz-madde no="28" başlık="Yürürlükten kaldırılan ve değiştirilen hükümler">
      <mvz-fıkra no="1">
        <template>21/6/2012 tarihli ve 6332 sayılı Türkiye İnsan Hakları Kurumu Kanunu yürürlükten kaldırılmıştır. Diğer mevzuatta mülga Türkiye İnsan Hakları Kurumuna yapılmış olan atıflar Türkiye İnsan Hakları ve Eşitlik Kurumuna yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2" durum="işlenmiş">
        <template>(14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="3" durum="işlenmiş">
        <template>(10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Türkiye İnsan Hakları Kurumuna ait kadrolar iptal edilerek 13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnamenin ilgili cetvellerinden çıkarılmış ve ekli (1) sayılı listede yer alan kadrolar ihdas edilerek anılan Kanun Hükmünde Kararnamenin eki (I) sayılı cetvele Türkiye İnsan Hakları ve Eşitlik Kurumu bölümü olarak eklenmiştir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5" durum="işlenmiş">
        <template>(27/6/1989 tarihli ve 375 sayılı Kanun Hükmünde Kararname ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Hak ve yetkiler ile personelin devri" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bakanlar Kurulunca ilk yapılacak seçimde seçilecek üyelere ilişkin başvurular ve aday bildirimleri Başbakanlığa yapılır. Başvurular ve aday bildirimlerine ilişkin hususlar Başbakanlık tarafından ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun ile kurulan Türkiye İnsan Hakları ve Eşitlik Kurumu teşkilatlanıncaya kadar Kuruma verilen görev ve hizmetler mülga Türkiye İnsan Hakları Kurumunun mevcut personeli eliyle yürütülmeye devam edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin yürürlüğe girdiği tarihte mülga Türkiye İnsan Hakları Kurumuna ait her türlü taşınır, taşıt, araç, gereç ve malzeme, nakit ve benzeri değerler, her türlü borç ve alacaklar, yazılı ve elektronik ortamdaki her türlü kayıtlar ve diğer dokümanlar ile kadro ve pozisyonlarda bulunan personel, hiçbir işleme gerek kalmaksızın Türkiye İnsan Hakları ve Eşitlik Kurumuna devredilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mülga Türkiye İnsan Hakları Kurumu tarafından yapılmış olan sözleşmelere Türkiye İnsan Hakları ve Eşitlik Kurumu halef olur. Mülga Türkiye İnsan Hakları Kurumunun leh ve aleyhine açılmış davalar ile icra takiplerinde Türkiye İnsan Hakları ve Eşitlik Kurumu kendiliğinden taraf sıfatını kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Mülga Türkiye İnsan Hakları Kurulu üyelerinin üyelikleri bu maddenin yürürlüğe girdiği tarihte sona erer. Mülga Türkiye İnsan Hakları Kurumu Başkanı ve İkinci Başkanı, bu Kanuna göre seçilen Türkiye İnsan Hakları ve Eşitlik Kurumu Başkanı göreve başlayıncaya kadar Türkiye İnsan Hakları ve Eşitlik Kurumu Başkanı ve İkinci Başkanı olarak görev yapar. Bunlar, bu Kanuna göre seçilen Türkiye İnsan Hakları ve Eşitlik Kurumu Başkanı göreve başladığında, atandıkları mevzuata göre kalan görev sürelerinin sonuna kadar görev yapmak üzere ekli (2) sayılı liste ile ihdas edilen Kurum Başkanlık Müşaviri kadrolarına hiçbir işleme gerek kalmaksızın atanmış sayılır ve Başkan tarafından belirlenen istişari görevleri yürütür. Bu fıkra ile ihdas edilen Kurum Başkanlık Müşaviri kadroları, bu kadroların herhangi bir sebeple boşalması ve her hâlde anılan kadrolara atanmış sayılan Başkan ve İkinci Başkanın atandıkları mevzuata göre kalan görev sürelerinin sona ermesi hâlinde hiçbir işleme gerek kalmaksızın iptal edilmiş sayılır. Bu fıkraya göre Kurum Başkanlık Müşaviri kadrolarına atanmış sayılanlara, fiilen görev yapma şartına bağlı ödemeler hariç mali ve sosyal haklar kapsamında bu maddenin yürürlüğe girdiği tarihten önce yürürlükte bulunan mevzuata göre yapılmakta olan ödemelere, kalan görev süreleri sonuna kadar devam edilir. Bunlar görev sürelerinin sonunda talepleri hâlinde, Kurumda veya önceki kurumlarında öğrenim durumları, hizmet yılı ve kazanılmış hak aylık derecelerine uygun bir kadroya en geç bir ay içinde atanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu maddenin yürürlüğe girdiği tarihte İnsan Hakları Uzmanı ve İnsan Hakları Uzman Yardımcısı kadrolarında bulunanlar, İnsan Hakları ve Eşitlik Uzmanı ile İnsan Hakları ve Eşitlik Uzman Yardımcısı kadrolarına başka bir işleme gerek kalmaksızın hâlen bulundukları kadro dereceleriyle atanmış sayılır ve bunlardan 375 sayılı Kanun Hükmünde Kararnamenin geçici 12 nci maddesi hükmünden yararlananların bu hakları söz konusu kadrolarda bulundukları sürece devam eder. Bu fıkraya göre atananların İnsan Hakları Uzmanı kadrosunda geçirdiği süreler İnsan Hakları ve Eşitlik Uzmanı kadrosunda, İnsan Hakları Uzman Yardımcısı kadrosunda geçirdiği süreler ise İnsan Hakları ve Eşitlik Uzman Yardımcısı kadrosunda geçmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Mülga Türkiye İnsan Hakları Kurumu kadrolarında bulunan memurlardan yukarıdaki fıkralarda belirtilenler dışında kalanlar, Kurum için ihdas edilen aynı unvanlı kadrolara hâlen bulundukları kadro dereceleriyle başka bir işleme gerek kalmaksızın atanmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu madde uyarınca atanan veya atanmış sayılan personelin yeni kadrolarına atandıkları veya atanmış sayıldıkları tarih itibarıyla eski kadrolarına ilişkin en son ayda aldıkları sözleşme ücreti, aylık, ek gösterge, ikramiye (bir aya isabet eden net tutarı), her türlü zam ve tazminatları, makam tazminatı, temsil tazminatı, görev tazminatı, ek ödeme ve benzeri adlarla yapılan her türlü ödemelerin toplam net tutarının (Bu tutar sabit bir değer olarak esas alınır.); yeni atandıkları kadrolara ilişkin olarak yapılan sözleşme ücreti, aylık, ek gösterge, ikramiye (bir aya isabet eden net tutarı), her türlü zam ve tazminatları, makam tazminatı, temsil tazminatı, görev tazminatı, ek ödeme ve benzeri adlarla yapılan her türlü ödemelerin (ilgili mevzuatı uyarınca fiili çalışmaya bağlı fazla mesai ücreti hariç) toplam net tutarından fazla olması hâlinde aradaki fark tutarı, herhangi bir vergi ve kesintiye tabi tutulmaksızın fark kapanıncaya kadar ayrıca tazminat olarak ödenir. Atandıkları veya atanmış sayıldıkları kadro unvanlarında isteğe bağlı olarak herhangi bir değişiklik olanlarla, kendi istekleriyle başka kurumlara atananlara fark tazminatı ödenmesine son verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu maddenin yürürlüğe girdiği tarihe kadar mülga Türkiye İnsan Hakları Kurumunda geçen hizmetler, Türkiye İnsan Hakları ve Eşitlik Kurumunda geçmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Türkiye İnsan Hakları ve Eşitlik Kurumunun 2016 mali yılı harcamaları, 2016 Yılı Merkezi Yönetim Bütçe Kanununa istinaden Maliye Bakanlığınca yeni bir düzenleme yapılıncaya kadar, mülga Türkiye İnsan Hakları Kurumunun 2016 yılı bütçesinde yer alan ödeneklerinden karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Cumhurbaşkanlığı tarafından yeni bir düzenleme yapılıncaya kadar il ve ilçe insan hakları kurulları faaliyetine devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>En az dört yıllık lisans eğitimi veren yükseköğretim kurumlarını bitirerek mesleğe özel yarışma sınavı ile giren ve belirli süreli meslek içi eğitimden sonra özel bir yeterlik sınavı sonunda insan hakları alanında faaliyet gösteren kurumların merkez teşkilatı kadrolarına atanmış olanlar talepleri hâlinde kurumlarının, hakimler ve savcılar ise kendilerinin muvafakati ile, Kurumun görev alanına giren konularda doktora yapmış olan Devlet memurları ile öğretim elemanları ise başvurmaları hâlinde bu Kanunun yürürlüğe girdiği tarihten itibaren bir yıl içinde, bu Kanun kapsamında atanan Kurul tarafından belirlenecek usul ve esaslar dâhilinde İnsan Hakları ve Eşitlik Uzmanı olarak atanabilirler. Bu fıkra hükümlerine göre atanacak olanların sayısı, Kurumun kadro cetvellerindeki İnsan Hakları ve Eşitlik Uzmanı ve İnsan Hakları ve Eşitlik Uzman Yardımcısı kadro sayısının yüzde onunu geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Bu Kanunun uygulanmasına ilişkin yönetmelikler Kurulun ilk toplantı tarihinden itibaren altı ay içerisinde yürürlüğe konulur. Ayrımcılık yasağı ihlali iddialarına ilişkin başvurular 17 nci maddenin dokuzuncu fıkrasında öngörülen yönetmeliğin yürürlüğe girdiği tarihten itibaren alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
