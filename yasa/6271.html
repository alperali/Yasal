<mvz-künye tür="kanun" no="6271" başlık="CUMHURBAŞKANI SEÇİMİ KANUNU"
             tarih="19/1/2012" rgazete-tarih="26/1/2012" rgazete-sayı="28185"
             düstur-tertip="5" düstur-cilt="51" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; Cumhurbaşkanı seçimine, Cumhurbaşkanı adaylarında aranacak niteliklere, seçim öncesi, seçim günü ve seçim sonrası yapılması gereken işlemlere ilişkin usul ve esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Seçimde uygulanacak genel ilkeler">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanı halk tarafından seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçim genel, eşit ve gizli oyla, bütün yurtta aynı günde, yargı yönetim ve denetimi altında yapılır. Yurt dışında yaşayan Türk vatandaşlarının oy kullanmaları, 26/4/1961 tarihli ve 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun hükümleri çerçevesinde sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Seçmen, oyunu tam bir serbestlikle kendisi kullanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Oyların sayımı, dökümü ve tutanaklara bağlanması açık olarak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanunda özel hüküm bulunmayan hâllerde 298 sayılı Kanun, 22/4/1983 tarihli ve 2820 sayılı Siyasi Partiler Kanunu, 10/6/1983 tarihli ve 2839 sayılı Milletvekili Seçimi Kanunu, 18/1/1984 tarihli ve 2972 sayılı Mahalli İdareler ile Mahalle Muhtarlıkları ve İhtiyar Heyetleri Seçimi Hakkında Kanun, 23/5/1987 tarihli ve 3376 sayılı Anayasa Değişikliklerinin Halkoyuna Sunulması Hakkında Kanun ile bunların ek ve değişikliklerinin bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yüksek Seçim Kurulu, Cumhurbaşkanı seçimlerinin başlamasından bitimine kadar, seçimin düzen içinde yönetimi ve dürüstlüğü ile ilgili bütün işlemleri yapmak ve yaptırmak amacıyla, gerekli ilke kararları almaya, beşinci fıkrada sayılan kanunlar ile bu Kanunda seçimle ilgili olarak yer alan bütün süreleri gerektiğinde kısaltarak tespit ve ilâna yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Seçim dönemi, seçim döneminin başlangıcı ve seçimlerin tamamlanması">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanı ve Türkiye Büyük Millet Meclisi seçimleri beş yılda bir aynı günde yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir kimse en fazla iki defa Cumhurbaşkanı seçilebilir. Ancak Cumhurbaşkanının ikinci döneminde Meclis tarafından seçimlerin yenilenmesine karar verilmesi hâlinde, Cumhurbaşkanı bir defa daha aday olabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Cumhurbaşkanı ve Türkiye Büyük Millet Meclisinin görev sürelerinin dolmasından önceki son Pazar günü oy verme günüdür. Görev süresi, birlikte yapılan bir önceki seçim tarihi esas alınarak belirlenir. Oy verme gününden geriye doğru hesaplanacak altmış günlük sürenin ilk günü seçimin başlangıç tarihidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Seçimlerin yenilenmesine karar verilmesi hâlinde bu karar kırksekiz saat içinde Resmî Gazete’de yayımlanarak ilân olunur. Bu kararın verildiği günden sonra gelen altmışıncı günü takip eden ilk Pazar günü Cumhurbaşkanı ile Türkiye Büyük Millet Meclisi genel seçimi birlikte yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Cumhurbaşkanlığı makamının herhangi bir nedenle boşalması ve Türkiye Büyük Millet Meclisi genel seçimine bir yıl veya daha az süre kalması hâlinde, Cumhurbaşkanı seçimi, makamın boşaldığı günden sonra gelen altmışıncı günü takip eden ilk Pazar günü Türkiye Büyük Millet Meclisi genel seçimiyle birlikte yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Cumhurbaşkanlığı makamının herhangi bir nedenle boşalması ve Türkiye Büyük Millet Meclisi genel seçimine bir yıldan fazla süre kalması hâlinde, Cumhurbaşkanı seçimi, makamın boşaldığı günden sonra gelen kırkbeş gün içindeki son Pazar günü yapılır. Bu şekilde seçilen Cumhurbaşkanı Türkiye Büyük Millet Meclisi seçim tarihine kadar görevine devam eder. Kalan süreyi tamamlayan Cumhurbaşkanı açısından bu süre dönemden sayılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Yukarıdaki fıkralarda öngörülen süreler içinde seçimin tamamlanması amacıyla, Yüksek Seçim Kurulu tarafından, seçim takvimi resen belirlenir ve ilân edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Seçim sistemi ve uygulanması">
      <mvz-fıkra no="1">
        <template>Genel oyla yapılacak seçimde, geçerli oyların salt çoğunluğunu alan aday, Cumhurbaşkanı seçilir. İlk oylamada bu çoğunluk sağlanamazsa, bu oylamayı izleyen ikinci Pazar günü ikinci oylama yapılır. Bu oylamaya, ilk oylamada en çok oy almış bulunan iki aday katılır ve geçerli oyların çoğunluğunu alan aday Cumhurbaşkanı seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İkinci oylamaya katılmaya hak kazanan adaylardan birinin herhangi bir nedenle seçime katılmaması hâlinde; ikinci oylama, boşalan adaylığın birinci oylamadaki sıraya göre ikame edilmesi suretiyle yapılır. Ancak ikame, geçici sonuçların ilânını takip eden gün saat 17.00’ye kadar yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Oylamalara tek adayla gidilmesi hâlinde, oylama referandum şeklinde yapılır. Geçerli oyların salt çoğunluğunu alan aday Cumhurbaşkanı seçilir. Oylamada, adayın geçerli oyların salt çoğunluğunu alamaması hâlinde seçim yenilenir ve kesin sonuçların ilânından sonra gelen kırkbeşinci günü takip eden ilk Pazar günü sadece Cumhurbaşkanı seçimi yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Cumhurbaşkanının görev süresinin dolması veya seçimlerin yenilenmesine karar verilmesi ya da seçimlerin tamamlanamaması hâllerinde, yenisi göreve başlayıncaya kadar mevcut Cumhurbaşkanının görevi devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Cumhurbaşkanı seçilenin, varsa Türkiye Büyük Millet Meclisi üyeliği sona erer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Seçimin geri bırakılması">
      <mvz-fıkra no="1">
        <template>Türkiye Büyük Millet Meclisi tarafından savaş sebebiyle yeni seçimlerin yapılmasına imkân görülmediğine dair karar verilmesi hâlinde, Cumhurbaşkanı seçimi bir yıl geriye bırakılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Geri bırakma sebebi ortadan kalkmamışsa, erteleme kararındaki usule göre bu işlem tekrarlanabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Seçilme yeterliği">
      <mvz-fıkra no="1">
        <template>Kırk yaşını doldurmuş ve yüksek öğrenim yapmış Türkiye Büyük Millet Meclisi üyeleri veya bu niteliklere ve milletvekili seçilme yeterliğine sahip her Türk vatandaşı Cumhurbaşkanı seçilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Seçim Öncesi İşleri">
    <mvz-madde no="7" başlık="Aday gösterilme">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanlığına;</template>
        <mvz-bent no="a">
          <template>Siyasi parti grupları,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>En son yapılan milletvekili genel seçiminde toplam geçerli oyların tek başına veya birlikte en az yüzde beşini almış olan siyasi partiler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>En az yüzbin seçmen</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>aday gösterebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aday gösterilmek, kişinin yazılı muvafakatine bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Aday gösterme süresinin sona erdiği tarihten itibaren hiçbir şekilde yeni aday gösterilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Siyasi partilerce aday gösterilme">
      <mvz-fıkra no="1">
        <template>Türkiye Büyük Millet Meclisinde grubu bulunan siyasi partiler grup kararıyla, diğer siyasi partiler ise tüzüklerinde gösterilen yetkili organlarının kararıyla Cumhurbaşkanlığına aday gösterebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek Seçim Kurulu tarafından ilân edilen süre içinde, adayların isimleri, muvafakat belgeleri ve gerekli diğer belgelerle birlikte Yüksek Seçim Kuruluna başvurularak aday gösterilmiş olur. Her siyasi parti veya parti grubu ancak bir aday için başvuruda bulunabilir. Bir kişiyi birden fazla siyasi parti grubu veya siyasi parti aday gösterebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Adaylarla ilgili bilgi ve belgelerde eksiklik tespit edilmesi hâlinde, Yüksek Seçim Kurulunca, ilgili siyasi partilere eksikliklerin giderilmesi için beş günlük süre verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Eksiklikleri, verilen süre içinde gidermeyen siyasi partiler, aday göstermekten vazgeçmiş sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8/A" başlık="Seçmenler tarafından aday gösterilme">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanlığına en az yüzbin seçmenin yazılı teklifiyle aday gösterilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçmenlerce aday gösterilmek isteyen kişi;</template>
        <mvz-bent no="a">
          <template>Kimlik ve açık adres bilgilerini ihtiva eden başvuru dilekçesi ve seçilme yeterliğine ilişkin belgelerle,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>En yüksek derecedeki Devlet memuruna mâli haklar kapsamında yapılmakta olan her türlü ödemelerin bir aylık brüt tutarının on katının ilgili maliye veznesine emaneten yatırıldığına dair makbuzla</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yüksek Seçim Kuruluna bizzat başvurur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yüksek Seçim Kurulu, başvuru dilekçesi ve eklerini iki gün içinde inceler. İnceleme sonucunda:</template>
        <mvz-bent no="a">
          <template>Başvuranın, seçilme yeterliğinin bulunmadığının tespit edilmesi hâlinde, başvuru reddedilir. Başvuran bu kararın bildirilmesinden itibaren iki gün içinde dilekçeyle yeniden inceleme talebinde bulunabilir. Yüksek Seçim Kurulu, bu talebi üç gün içinde karara bağlar.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bilgi ve belgelerde eksiklik bulunması hâlinde, eksikliklerin tamamlanması için iki gün süre verilir. Bu süre içinde eksiklikler tamamlanmadığı takdirde başvuru reddedilir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yüksek Seçim Kurulu, başvurusu kabul edilen kişileri ilân eder. Seçmenler, ancak bu ilânda belirtilen kişilerden sadece biri için bir kez teklifte bulunabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Seçmenler, adaylık teklifi için kayıtlı oldukları ilçe seçim kuruluna bizzat başvururlar. Başvuranın, seçmen niteliğine sahip olduğu ve daha önce aday teklifinde bulunmadığı tespit edildikten sonra, ilân edilen listedeki kişiler arasından tercih yaptırılarak adayın bilgilerini ihtiva eden form imzalatılır ve elektronik ortamda da kaydedilir. Başvuran seçmene, aday teklifinde bulunduğuna dair belge verilir. Aday gösterme formları, elektronik ortamda Yüksek Seçim Kuruluna iletilir ve fiziki olarak ilçe seçim kurullarında saklanır. Aday gösterilmek isteyen kişinin talebi hâlinde, hakkında aday teklifinde bulunanlara ilişkin formlar ve diğer bilgiler kendisine verilir. İtiraza ilişkin hususlar Yüksek Seçim Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Belirlenen süre içinde yüzbin seçmen tarafından teklif edilen kişiler, geçici aday listesinde gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Yüzbin seçmen tarafından aday teklifinde bulunulması veya ölüm hâllerinde maliye veznesine emaneten yatırılan tutar, seçimden sonra talep üzerine ilgiliye iade edilir. Diğer hâllerde bu tutar, Hazineye gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Aday teklifine ilişkin işlemler için ilçe seçim kurullarında yeteri kadar personel görevlendirilir ve gerekli tedbirler alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Aday teklifine ilişkin başvuru ve formların şekli ile yurt dışı seçmen kütüğüne kayıtlı seçmenlerin aday göstermeleri dâhil bu maddenin uygulanmasına ilişkin diğer usul ve esaslar Yüksek Seçim Kurulunca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Adaylığın incelenmesi ve geçici aday listesi">
      <mvz-fıkra no="1">
        <template>Yüksek Seçim Kurulu, adaylar hakkında yaptığı inceleme sonucunda seçilme yeterliğini ve aday gösterilme şartlarını taşıyanları gösteren geçici aday listesini belirler. Geçici aday listesi ve itiraz süresi Resmî Gazetede yayımlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="İtiraz ve kesin aday listesi">
      <mvz-fıkra no="1">
        <template>Resmî Gazetede yapılan ilândan itibaren iki gün içinde, geçici aday listesine veya bu listeye alınmamaya ilişkin karara karşı Yüksek Seçim Kuruluna itiraz edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek Seçim Kurulu itirazları üç gün içinde kesin karara bağlar ve kesin aday listesini Resmî Gazetede yayımlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Adayların görevden ayrılması ve göreve dönmesi">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanı adayı gösterilen hâkimler ve savcılar, yüksek yargı organları mensupları, yüksek öğretim kurumlarındaki öğretim elemanları, Yükseköğretim Kurulu, Radyo ve Televizyon Üst Kurulu üyeleri, kamu kurumu ve kuruluşlarının memur statüsündeki görevlileri ile yaptıkları hizmet bakımından işçi niteliği taşımayan diğer kamu görevlileri, belediye başkanları ve subaylar ile astsubaylar, siyasi partilerin il ve ilçe yönetim kurulu başkan ve üyeleri ile belediye meclisi üyeleri, il genel meclisi üyeleri, kamu kurumu niteliğindeki meslek kuruluşları ile sendikalar, kamu bankaları ile üst birliklerin ve bunların üst kuruluşlarının ve katıldıkları teşebbüs veya ortaklıkların yönetim ve denetim kurullarında görev alanlar, aday listesinin kesinleştiği tarih itibarıyla görevlerinden ayrılmış sayılır. Bu durum Yüksek Seçim Kurulunca aday gösterilenin bağlı bulunduğu bakanlığa veya kuruma derhal bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek mahkeme üyeleri, hâkimler, savcılar ve bu meslekten sayılanlar ile subay ve astsubaylar hariç olmak üzere, Cumhurbaşkanı adayı gösterilen Devlet memurları ve diğer kamu görevlileri, adaylığı veya seçimi kaybetmeleri hâlinde, Yüksek Seçim Kurulunca Cumhurbaşkanının seçildiğinin ilân edilmesini takip eden bir ay içinde müracaat etmeleri kaydıyla eski görevlerine veya kazanılmış hak aylık derecelerindeki başka bir göreve dönebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Adaylıkta eksilme">
      <mvz-fıkra no="1">
        <template>Birinci oylamada, kesin aday listesinin Resmî Gazetede yayımından itibaren, oy verme günü saat 17.00’ye kadar listede meydana gelecek eksilmeler, değişikliği gerektirmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Propaganda">
      <mvz-fıkra no="1">
        <template>Propaganda dönemi, aday listesinin kesinleştiği gün başlar ve oylamaların yapılacağı günden önceki gün saat 18.00’de sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Propaganda döneminde, Türkiye Radyo ve Televizyonlarında yapılacak propaganda yayınlarının tam bir tarafsızlık ve eşitlik içinde yapılması, Yüksek Seçim Kurulu ile Türkiye Radyo ve Televizyon Kurumu tarafından sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Adayların, özel radyo ve televizyonlardaki propaganda konuşmalarında, süre ile ilgili sınırlamalar dışında, 298 sayılı Kanunun ilgili hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Propaganda döneminde Başbakan, bakanlar ve milletvekilleriyle ilgili yasaklara ilişkin hükümler dâhil olmak üzere propagandaya dair diğer hususlarda 298 sayılı Kanun hükümleri kıyasen uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Adaylara yardım">
      <mvz-fıkra no="1">
        <template>Adaylar, yabancı devletlerden, uluslararası kuruluşlardan, tüzel kişilerden ve Türk uyrukluğunda olmayan gerçek kişilerden bağış ve yardım alamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Adaylar, Yüksek Seçim Kurulu tarafından belirlenecek adaylık başvurusu süresi içinde mal bildiriminde bulunmak zorundadır. Seçilen adayın mal bildirimi, seçim sonuçlarının kesinleşmesini müteakip Resmî Gazetede yayımlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Her bir kişinin adaylara yapabileceği nakdî yardım miktarı, her bir tur için en yüksek Devlet memuruna mali haklar kapsamında fiilen yapılmakta olan her türlü ödemelerin bir aylık brüt tutarını geçemez. Alınan bağış ve yardımlar veraset ve intikal vergisinden müstesnadır. Adaylar ödünç niteliğinde para kabul edemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Seçimlerde şeffaflığın sağlanması amacıyla, Yüksek Seçim Kurulunca belirlenecek tutarın üzerindeki nakdî yardımlar adayların “Seçim Hesabı” olarak kendileri adına açtıracakları bir banka hesabına yatırılır. Yüksek Seçim Kurulunca belirlenecek tutarın altında kalan nakdî yardımlar ise makbuz karşılığında alınır ve seçim hesabına yatırılır. Alınan bağış ve yardımlar sadece seçim harcamalarında kullanılır ve başka bir amaç için tahsis edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Adaylığın kesinleşmesinden seçim sonuçlarının kesinleşmesine kadar geçen dönemde bağış ve yardımlar ile yapılan harcamalar Yüksek Seçim Kurulu tarafından tasdik edilen listelere kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Seçim hesapları ile bağış, yardım ve harcamalara ilişkin bilgi ve belgeler, seçim sonuçlarının kesinleşmesini izleyen on gün içinde Yüksek Seçim Kuruluna sunulur. Yüksek Seçim Kurulu bir ay içinde, seçim hesaplarını inceler ve varsa usulsüzlükleri ve öngörülen limitlerin aşılıp aşılmadığını tespit eder. Bu aşamada tespit edilen eksikliklerin giderilmesi amacıyla Yüksek Seçim Kurulu tarafından adaylara uygun bir süre verilir. Alınan bağış ve yardımlardan belirtilen limiti aşan miktar ile harcanmayan kısım Hazineye intikal ettirilir. Kurul bu görevi yerine getirirken Sayıştaydan ve gerekli görülen diğer ilgili kamu kurumlarından yardım alabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Yüksek Seçim Kurulunca yapılan inceleme sonuçları kesin olup, incelemenin tamamlanmasını müteakip bir ay içinde ilân edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Aday, Yüksek Seçim Kuruluna önceden bildirmek şartıyla, seçim hesapları ile gelir ve harcamalara ilişkin bilgi ve belgelerin kayda geçirilmesi ve ibrazına ilişkin hususlarda 1/6/1989 tarihli ve 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre yetki almış meslek mensuplarından veya avukatlardan birini ya da birkaçını yetkili kılabilir. Bu durumda, yetkilendirilen meslek mensubu, yukarıda belirtilen hususların yerine getirilmemesi veya eksik yerine getirilmesinde ilgili mevzuat hükümlerine göre sorumlu tutulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Aday tarafından verilecek mal bildiriminin usul ve esasları, adaylar tarafından kullanılacak listelerin şekil, içerik ve tasdiki, makbuzların şekil ve içeriği, bastırılması, bağış ve yardımların alınması, kayda geçirilmesi, harcanması, harcanmayan ya da bağış sınırını aşan kısmın Hazineye intikali ile bu maddenin uygulanmasına ilişkin diğer usul ve esaslar Yüksek Seçim Kurulunca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Seçim Günü İşleri">
    <mvz-madde no="15" başlık="Kullanılacak oy pusulasının şekli">
      <mvz-fıkra no="1">
        <template>Oylamalarda kullanılacak filigranlı birleşik oy pusulasında “Cumhurbaşkanı Adayları” ibaresi ile Yüksek Seçim Kurulu tarafından çekilen kuraya göre sırası belirlenen adayların adı ve soyadı yer alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Oylamanın referandum şeklinde yapılması hâlinde beyaz üzerine “Evet”, kahverengi üzerine “Hayır” ibareleri yazılı, iki ayrı renkten oluşan birleşik oy pusulası kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kullanılacak birleşik oy pusulalarıyla ilgili diğer hususlar Yüksek Seçim Kurulu tarafından belirlenir. Yüksek Seçim Kurulu, birleşik oy pusulalarını kendisi bastırabileceği gibi gerektiğinde uygun göreceği il seçim kurulları vasıtasıyla bastırmaya da yetkilidir. Gerekli ödenek Maliye Bakanlığınca karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Oy kullanma şekli">
      <mvz-fıkra no="1">
        <template>Seçmen, sandık kurulunca kendisine verilen birleşik oy pusulası ve “Evet” veya “Tercih” yazılı mührü alarak oyunu kullanmak üzere kapalı oy verme yerine girer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçmen, mührü, birleşik oy pusulasında tercih ettiği adaya ait özel daire içine basmak, birleşik oy pusulasını zarfa koymak ve zarfı sandığa atmak suretiyle oyunu kullanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Oyunu kullanan seçmen, mührü sandık kurulu başkanına geri verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Oylamanın referandum şeklinde yapılması hâlinde oy kullanma">
      <mvz-fıkra no="1">
        <template>Seçmen, sandık kurulunca kendisine verilen, beyaz üzerine “Evet” kahverengi üzerine “Hayır” ibareleri bulunan iki ayrı renkten oluşan birleşik oy pusulası ve “Evet” veya “Tercih” yazılı mührü alarak oyunu kullanmak üzere kapalı oy verme yerine girer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçmen, mührü, birleşik oy pusulasında tercih ettiği kısmın üzerine basmak, birleşik oy pusulasını zarfa koymak ve zarfı sandığa atmak suretiyle oyunu kullanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Oyunu kullanan seçmen, mührü sandık kurulu başkanına geri verir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Seçimden Sonra Yapılacak İşler ve Son Hükümler">
    <mvz-madde no="18" başlık="Seçim tutanakları ve sonuçların birleştirilmesi">
      <mvz-fıkra no="1">
        <template>Sandık, ilçe ve il seçim kurullarınca düzenlenmesi gereken tutanakların içeriği ile seçim sonuçlarının birleştirilmesine ilişkin usul ve esaslar Yüksek Seçim Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek Seçim Kurulu, il seçim kurullarından gelen sonuçları birleştirerek ilân eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Seçimin veya birleştirme tutanağının iptali">
      <mvz-fıkra no="1">
        <template>Bir veya birkaç seçim çevresinde, yapılan seçimin veya düzenlenen birleştirme tutanağının, seçim işlemleri sebebiyle iptaline karar verilmesi hâlinde, iptal edilen kısmın ülke genelindeki seçim sonuçlarına etkisi olup olmadığı göz önüne alınarak Yüksek Seçim Kurulu tarafından söz konusu seçim çevrelerinde seçimlerin yenilenip yenilenmeyeceğine karar verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Cumhurbaşkanı seçiminin sonuçlandırılması">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanı seçiminin kesin sonuçları, Yüksek Seçim Kurulu tarafından Türkiye Büyük Millet Meclisi Başkanlığı ile Cumhurbaşkanlığı Makamına bildirilir, kamuoyuna ilân edilir ve Resmî Gazetede yayımlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçilen Cumhurbaşkanı adına, Yüksek Seçim Kurulu tarafından Cumhurbaşkanı seçildiğine dair bir tutanak düzenlenir.  Bu tutanak seçilen Cumhurbaşkanına verilmek üzere Türkiye Büyük Millet Meclisi Başkanlığına sunulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Andiçme töreni">
      <mvz-fıkra no="1">
        <template>Seçilen Cumhurbaşkanı adına düzenlenen tutanak, Türkiye Büyük Millet Meclisi Genel Kurulunda, Türkiye Büyük Millet Meclisi Başkanı veya Geçici Başkan tarafından verilir ve aynı birleşimde andiçme töreni yapılır. Bu birleşim, birlikte yapılan Cumhurbaşkanı ve Türkiye Büyük Millet Meclisi genel seçiminin ardından Meclisin toplandığı ilk günü takip eden üç gün içinde gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cumhurbaşkanının ikinci oylamada seçilmesi veya sadece Cumhurbaşkanı seçiminin yapılması halinde andiçme töreni, seçim sonucunun kesinleşmesini takip eden üç gün içinde yapılır. Türkiye Büyük Millet Meclisi toplantı halinde değilse derhal toplantıya çağrılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Cumhurbaşkanınca atanan Cumhurbaşkanı yardımcıları ve Bakanlar atanmalarını takip eden gün andiçerler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Değiştirilen mevzuat" durum="işlenmiş">
      <mvz-fıkra no="1">
        <template>298 sayılı Kanun ile ilgili olup yerine işlenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Onbirinci Cumhurbaşkanının görev süresi yedi yıldır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(İptal)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Türkiye Büyük Millet Meclisi Başkanı ile Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
