  <mvz-künye tür="kanun" no="3308" başlık="MESLEKİ EĞİTİM KANUNU"
             tarih="5/6/1986" rgazete-tarih="19/6/1986" rgazete-sayı="19139"
             düstur-tertip="5" düstur-cilt="26" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; çırak, kalfa ve ustaların eğitimi ile okullarda, yükseköğretim kurumlarında ve işletmelerde yapılacak mesleki eğitime ilişkin esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, Yükseköğretim Kurulu ve Mesleki Eğitim Kurulunun belirleyeceği mesleklerde, kamu ve özel sektöre ait kurum, kuruluş ve iş yerleri ile mesleki ve teknik eğitim okul ve kurumlarındaki eğitim ve öğretimi kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen;</template>
        <mvz-bent no="a">
          <template>"Bakanlık", Milli Eğitim Bakanlığını;</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>"Aday çırak", çıraklığa başlama yaşını doldurmamış ve çıraklık döneminden önce kendisine işyeri ortamı tanıtılan, sanat ve mesleğinin ön bilgileri verilen kişiyi;</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>"Çırak", çıraklık sözleşmesi esaslarına göre bir meslek alanında mesleğin gerektirdiği bilgi, beceri ve iş alışkanlıklarını iş içerisinde geliştirilen kişiyi;</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>"Öğrenci", işletmelerde, mesleki ve teknik eğitim okul ve kurumlarında örgün eğitim görenleri;</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>"Kalfa", bir mesleğin gerektirdiği bilgi, beceri ve iş alışkanlıklarını kazanmış ve bu meslekle ilgili iş ve işlemleri ustanın gözetimi altında kabul edilebilir standartlarda yapabilen kişiyi;</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>"Usta", bir mesleğin gerektirdiği bilgi, beceri ve iş alışkanlıklarını kazanmış ve bunları mal ve hizmet üretiminde iş hayatınca kabul edilebilecek standartlarda uygulayabilen; üretimi planlayabilen; üretim sırasında karşılaşılabilecek problemleri çözümleyebilen; düşüncelerini yazılı, sözlü ve resim ile açıklayabilen; üretimle ilgili pratik hesaplamaları yapabilen kişiyi;</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>"Usta öğretici", ustalık yeterliğini kazanmış; aday çırak, çırak, kalfa ile mesleki ve teknik eğitim okul ve kurumları öğrencilerinin işyerindeki eğitiminden sorumlu; mesleki eğitim tekniklerini bilen ve uygulayan kişiyi;</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>"İşletmelerde Mesleki Eğitim", mesleki ve teknik eğitim okul ve kurumları öğrencilerinin beceri eğitimlerini işletmelerde, teorik eğitimlerini ise mesleki ve teknik eğitim okul ve kurumlarında veya işletme veya kurumlarca tesis edilen eğitim birimlerinde yaptıkları eğitim uygulamalarını;</template>
        </mvz-bent>
        <mvz-bent no="i" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>“Mesleki ve Teknik Eğitim Okul ve Kurumları”, mesleki ve teknik eğitim alanında, diplomaya götüren orta öğretim kurumları ve mesleki ve teknik eğitim yapan yükseköğretim kurumları ile belge ve sertifika programlarının uygulandığı her tür ve derecedeki örgün ve yaygın eğitim-öğretim kurumlarını;</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>“Personel”, kamu ve özel kurum, kuruluş ve işyerlerinde maaş ya da ücret karşılığında çalışan kadrolu veya sözleşmeli elemanlar ile işçileri;</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>“İşletme”, mal ve hizmet üreten kamu ve özel kurum, kuruluş ve işyerlerini;</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>“Eğitici Personel”, mesleki yeterliğe sahip, öğrencilerin işyerindeki eğitiminden sorumlu, iş pedagojisi eğitimi almış, mesleki eğitim yöntem ve tekniklerini bilen ve uygulayan veya mesleki ve teknik eğitim okul ve kurumlarında atölye, laboratuvar, meslek dersleri öğretmenliği yapabilme yetkisine sahip kişiyi;</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>“Meslek Alanı”, ortak özelliklere sahip birden fazla meslek dalını içeren; bilgi, beceri, tutum, davranış ve istihdam olanağı sağlayan alanı;</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>“Meslek Dalı”, bir meslek alanı içinde yer alan ve belirli konularda uzmanlaşmaya yönelik bilgi, beceri, tutum, davranış gerektiren ve istihdam olanağı sağlayan iş kollarından her birini;</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>“Eğitim Birimi”, bu Kanun kapsamında öğrencilerin teorik ve beceri eğitimi, staj veya tamamlayıcı eğitim ile işletme personelinin eğitimi amacıyla işletmeler tarafından oluşturulan, gerekli araç, gereç ve donanıma sahip eğitim ortamını;</template>
        </mvz-bent>
        <mvz-bent no="r">
          <template>“Staj”, Yükseköğretim Kurulunca, yükseköğretim kurumlarında verilmekte olan her düzeydeki alana özgü olarak belirlenen teorik ve uygulamalı dersler dışında, öğrencilerin öğretim programlarıyla kazandırılması öngörülen mesleki bilgi, beceri, tutum ve davranışlarını geliştirmeleri, sektörü tanımaları, iş hayatına uyumları, gerçek üretim ve hizmet ortamında yetişmeleri amacıyla işletmede yaptıkları mesleki çalışmayı;</template>
        </mvz-bent>
        <mvz-bent no="s">
          <template>“Tamamlayıcı Eğitim”, açık öğretim yoluyla eğitimi yapılamayan alan veya dallarda, mesleki ve teknik orta öğretim programlarını tamamlayamadan okuldan ayrılanlar ile yurtdışında öğrenim görenlerin denklik işlemleri sonucunda tespit edilen eksik meslek alan veya dal derslerini işletmelerde mesleki eğitim esaslarına göre tamamlamalarına imkân sağlayan eğitimi;</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Kurullar">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Mesleki Eğitim Kurulu">
      <mvz-madde no="4" başlık="Kurul" durum="mülga">
      </mvz-madde>
      <mvz-madde no="5" başlık="Görevleri">
        <mvz-fıkra no="1">
          <template>Mesleki Eğitim Kurulunun görevleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Gerek bu Kanun ve gerekse bu Kanuna göre çıkarılacak olan yönetmelik hükümlerinin uygulanmasını takip etmek ve değerlendirmesini sağlamak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Muhtelif sektör ve branşda çıraklık eğitimi ile meslek eğitimi konusunda eğitim ihtiyaçlarını tespit etmek ve Bakanlığa bildirmek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Mesleki Eğitim programlarının esasları ve süreleri hakkında Bakanlığa görüş bildirmek.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Çıraklık ve işletmelerdeki mesleki eğitim sınav komisyonlarının kurulması ve çalışması ile sınavların yapılış usullerine ilişkin yönetmelik taslaklarını hazırlamak ve Bakanlığa sunmak.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Aday çırak, çırak ve işletmelerde mesleki eğitim gören öğrenciler için sözleşme modellerini hazırlamak ve Bakanlığa sunmak.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Lüzumu halinde çıraklık ve mesleki eğitim ile ilgili konuların incelenmesi için ihtisas komisyonları kurmak.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Çıraklık ve mesleki eğitimle ilgili Bakanlıkça gönderilecek konuları incelemek ve görüş bildirmek.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Bu Kanuna göre yapılacak çıraklık ve işletmelerdeki mesleki eğitimde; uygulama alanına alınacak veya çıkarılacak yer ve meslekleri belirlemek ve Bakanlığa görüş bildirmek.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>İl Mesleki Eğitim Kurullarının yıllık çalışma raporlarını değerlendirmek.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Teknolojik gelişmelerin ve iş hayatındaki değişmelerin meslek eğitimine etkilerini izlemek ve Bakanlığa bildirmek.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="İl Mesleki Eğitim Kurulu">
      <mvz-madde no="6" başlık="Kurul">
        <mvz-fıkra no="1">
          <template>Bu Kanun kapsamında mesleki ve teknik eğitim okul ve kurumları ile işletmelerde yapılacak mesleki eğitimin planlanması, geliştirilmesi, değerlendirilmesi konularında karar almak ve valiliğe görüş ve tavsiyelerde bulunmak üzere illerde il mesleki eğitim kurulu kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İl mesleki eğitim kurulu, il milli eğitim müdürünün başkanlığında;</template>
          <mvz-bent no="a">
            <template>Belediye başkanı veya temsilcisi ,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İl sağlık müdürü veya temsilcisi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İl sanayi ve ticaret müdürü,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Esnaf ve sanatkarlar odaları birliği başkanı veya temsilcisi ile mesleki eğitimin yapıldığı mesleklerle ilgili oda yöneticileri arasından Esnaf ve Sanatkarlar Odaları Birliği Başkanlığınca seçilecek üç üye,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İl ticaret odası başkanı veya temsilcisi,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>İl sanayi odası başkanı veya temsilcisi,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Sanayi ve ticaret odalarının ayrı ayrı kurulmadığı yerlerde, il sanayi ve ticaret odası başkanı veya temsilcisi,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>İlin, mesleki eğitimden sorumlu milli eğitim müdür yardımcısı,</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Kurulun sekretarya görevini yürüten okul müdürü,</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>İlde faaliyet gösteren mesleki ve teknik eğitim okullarından ve kurumlarından birer yönetici,</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>En fazla işçiyi temsil eden konfedarasyonun o il için göstereceği işçi sendikaları temsilcisi,</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Defterdar veya temsilcisi,</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Türkiye İş Kurumu il müdürü veya temsilcisi,</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Sosyal Sigortalar Kurumu Başkanlığı sigorta müdürü veya temsilcisi,</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>En fazla işvereni temsil eden konfederasyonun, o il için göstereceği işveren sendikaları temsilcisinden,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İl mesleki eğitim kurulu toplantılarına, gerekirse başkanın isteği üzerine ilgili kurum temsilcileri de davet edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İl mesleki eğitim kurulu toplantı ve çalışma esasları yönetmelikle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İl mesleki eğitim kurulunun kararları valinin onayı ile uygulanır. Vali, gerekli gördüğü hallerde il mesleki eğitim kuruluna başkanlık eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Görevleri">
        <mvz-fıkra no="1">
          <template>İl Mesleki Eğitim Kurulunun görevleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Muhtelif sektör ve branştaki çıraklık ve mesleki eğitim ihtiyacını il seviyesinde tespit etmek ve Bakanlığa sunmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bakanlıkça gönderilen çıraklık ve mesleki eğitim çerçeve programlarının il ihtiyaçlarına göre düzenlenmesi için Bakanlığa görüş bildirmek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Çıraklık ve mesleki eğitim uygulamalarında ortaya çıkan uyuşmazlıkların çözümüne yardımcı olmak.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Bu Kanun hükümlerinin il seviyesinde eksiksiz yerine getirilmesi için gerekli tedbirleri almak.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Çıraklık ve Mesleki Eğitim konularında valilikçe gönderilecek konuları incelemek ve sonuçlandırmak.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>İldeki çıraklık ve mesleki eğitim uygulamalarını takip etmek ve değerlendirmek. Bu konu ile ilgili yıllık çalışma raporunu hazırlamak ve Bakanlığa sunmak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Kapsama alma">
        <mvz-fıkra no="1">
          <template>İlin Bakanlıkça Kanun kapsamına alınma kararının yayımı tarihinden itibaren üç ay içinde "İl Mesleki Eğitim Kurulu" kurulur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Çıraklık, Kalfalık ve İşletmelerde Mesleki Eğitim">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Çıraklık ve Kalfalık Eğitimi">
      <mvz-madde no="9" başlık="Aday çırak">
        <mvz-fıkra no="1">
          <template>İlköğretim okulunu bitirmiş olanlar, bir mesleğe hazırlık amacı ile çıraklık dönemine kadar işyerlerinde aday çırak olarak eğitilebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Mesleki eğitim merkezi programına çıraklık kayıt şartları">
        <mvz-fıkra no="1">
          <template>Mesleki eğitim merkezi programına çırak öğrenci olarak kayıt olabilmek için aşağıdaki şartlar aranır:</template>
          <mvz-bent no="a">
            <template>En az ortaokul veya imam-hatip ortaokulu mezunu olmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bünyesi ve sağlık durumu gireceği mesleğin gerektirdiği işleri yapmaya uygun olmak.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tehlikeli ve çok tehlikeli işler veya özellik arz eden mesleklere alınacak çırakların öğrenim ve yaş durumu, ilgili kuruluşların görüşü alınarak Bakanlıkça belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Aday çırak ve çırakların statüleri">
        <mvz-fıkra no="1">
          <template>Aday çırak ve çırak; öğrenci statüsünde olup, öğrencilik haklarından yararlanır. Bunlar işyerinde çalışan işçi sayısına dahil edilmezler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Eğitim ve çalışma">
        <mvz-fıkra no="1">
          <template>Aday çırak ve çıraklar, mesleğin özelliğine göre haftada sekiz saatten az olmamak üzere genel ve mesleki eğitim görürler. Bu eğitime katılmaları için aday çırak ve çırak öğrencilere ücretli izin verilir. Mevsime göre özellik arz eden mesleklerde teorik ve pratik eğitim belirli aylarda bloklaştırılmış olarak yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Aday çırak ve çıraklar, pratik eğitimlerini işyerlerinde, işyerindeki eksik kalan pratik eğitimleri ile teorik eğitimlerini mesleki ve teknik eğitim okul ve kurumlarında veya Bakanlıkça uygun görülen işyerlerinin eğitim birimlerinde yapar. Teorik ve pratik eğitim birbirlerini tamamlayacak şekilde planlanır ve yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Pratik eğitim, hazırlanmış eğitim programlarına göre, işyerinin ve mesleğin özelliklerine uygun olarak usta öğreticinin gözetiminde yapılır. Pratik eğitimde 1475 sayılı İş Kanununun 69 uncu maddesi hükmü gözönünde bulundurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Çıraklık eğitiminin esas ve usulleri yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Sözleşme yapılması">
        <mvz-fıkra no="1">
          <template>Bu Kanun kapsamında bulunan il ve mesleklerde faaliyet gösteren iş yerleri, Bakanlıkça tespit edilecek illerde ve meslek dallarında ondokuz yaşından gün almamış kişileri çıraklık sözleşmesi yapmadan çalıştıramazlar. Mesleki ve teknik eğitim okul ve kurumlarının örgün eğitim programlarından mezun olanlar ve kalfalık belgesi sahipleri bu hükmün dışında tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İşyeri sahibi, aday çırağı ve çırağı çalıştırmaya başlamadan önce bunların velisi veya vasisi veya reşit ise kendisi ile yazılı çıraklık sözleşmesi yapmak zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Çıraklık sözleşmesi; çırağın sözleşme süresi içinde reşit olması halinde, çırağın rızasıyla, işyeri sahibinin değişmesi halinde yeni işyeri sahibi aynı mesleği sürdürüyorsa ve rızasıyla devam eder, aynı mesleği sürdürmüyorsa sözleşme feshedilir. Fesih halinde çırağın önceki çalışmaları geçerli olup; yeni yapacağı çıraklık sözleşmesi ile çıraklık statüsünü devam ettirerek çıraklık süresini ve eğitimini tamamlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunun uygulandığı yer ve meslek dallarında 818 sayılı Borçlar Kanununun çıraklık sözleşmesine dair hükümleri ile onsekiz yaşını doldurduktan sonra sözleşmesi devam eden çıraklar hakkında 1475 sayılı İş Kanununun, İşçi Sağlığı ve Güvenliği başlıklı beşinci bölümünde yer alan hükümleri dışındaki hükümler uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Çıraklığa başlama ve çıraklık süresi">
        <mvz-fıkra no="1">
          <template>Çıraklığa bir deneme dönemi ile başlanır. Bu dönem mesleğin özelliğine göre bir aydan az, üç aydan fazla olamaz. Bu süre Bakanlıkça tespit edilir. Deneme döneminden sonra taraflar 10 gün içinde ilgili Mesleki Eğitim Merkezi müdürlüğüne başvurmadığı takdirde çıraklık sözleşmesi kesinleşir ve bu dönem çıraklık süresinden sayılır. Deneme döneminde ücret ödenir. Aday çıraklıktan çıraklığa geçenler deneme dönemini yapmış sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Lise ve daha üst düzeyde genel eğitimden sonra çıraklık eğitimine başlayanlar için eğitim süresi, mesleklerindeki çıraklık eğitimi süresinin yarısına kadar kısaltılabilir. Bu sürenin ne kadar kısaltılabileceği, ilgili meslek kuruluşunun teklifi ve Mesleki Eğitim Kurulunun uygun görüşü alınarak Bakanlıkça belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ayrıca, mesleki ve teknik eğitim okul ve kurumlarında uygulanan örgün eğitim programlarının herhangi bir kademesinden ayrılanlar ile yaygın eğitim programlarını tamamlayarak belge veya sertifika alanlardan, kendi alanlarında çıraklık eğitimine başlayanlar için çıraklık eğitim süresi daha önce aldığı mesleki eğitim programının içeriği ile devam edeceği çıraklık eğitimi programının içeriği değerlendirilerek Bakanlıkça belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Usta öğretici bulundurma şartı">
        <mvz-fıkra no="1">
          <template>Aday çırak ve çırak almak için işyerinde usta öğretici bulunması şarttır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="Kalfalık imtihanı">
        <mvz-fıkra no="1">
          <template>Kalfa adayının mesleği ile ilgili bilgi, beceri ve iş alışkanlıklarına iş hayatınca kabul edilebilir seviyede sahip olup olmadığı kalfalık sınavı ile tespit edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sınav komisyonunun teşkili ile sınavın esasları ve usulleri yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="Kalfa unvanını kullanma ve işyeri değiştirme">
        <mvz-fıkra no="1">
          <template>Bu Kanuna göre kalfalık hakkını elde edenlere kalfalık belgesi verilir. Kalfalık belgesi bulunmayanlar kalfa unvanı ile çalışamaz ve çalıştırılamazlar. Bu belgeye sahip olanlar, kalfalık unvanı kullanılmayan işyerlerinde dengi işlerde çalıştırılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>507 sayılı Esnaf ve Küçük Sanatkarlar Kanunu kapsamındaki işyerlerinde çalışarak kalfa olanlar en az bir yıl o işyerinde çalışırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu sürenin sonunda işyerini değiştirmek isteyen kalfaya üç ay önce başvurmak kaydıyla, o işyeri çıkma izni verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Çıkma izni olmadan başka işyerleri kalfayı işe alamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kalfaların işten ayrılmalarını gerektiren hususlar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="İşletmelerde Meslek Eğitimi">
      <mvz-madde no="18" başlık="">
        <mvz-fıkra no="1">
          <template>On ve daha fazla personel çalıştıran işletmeler, çalıştırdıkları personel sayısının yüzde beşinden az olmamak üzere mesleki ve teknik eğitim okul ve kurumu öğrencilerine beceri eğitimi, mesleki ve teknik ortaöğretim okul ve kurumu öğrencilerine staj ve tamamlayıcı eğitim yaptırır. Öğrenci sayısının tespitinde kesirler tam sayıya tamamlanır. Bu işletmeler mesleki ve teknik eğitim yapan yükseköğretim kurumu öğrencilerine staj yaptırabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Deprem, sel ve yangın gibi tabii afetler sonucu yörede faal durumda kalan işletmelerin eğitim olanakları dikkate alınarak, bu işletmeler için yukarıda belirtilen oranlar, il mesleki eğitim kurulunun teklifi ve Bakanlığın onayı ile değiştirilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mesleki eğitim kapsamına alınıp alınmadığına bakılmaksızın ondan az personel çalıştıran işletmeler de mesleki ve teknik eğitim okul ve kurumları öğrencilerine bu Kanunun ilgili hükümlerine göre beceri eğitimi, staj ve tamamlayıcı eğitim yaptırabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Vardiya usulü veya mevsimlik olarak faaliyet gösteren işletmelerde eğitim görecek öğrenci sayısının tespitinde gündüz vardiyasında veya faaliyet gösterdiği mevsimde çalışan personel sayısı esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu Kanun kapsamında on ve daha fazla personel çalıştıran işletmeler, çalışma ve iş kurumu il müdürlüklerince her yıl şubat ayı içerisinde il millî eğitim müdürlüklerine ve o ildeki yükseköğretim kurumlarına bildirilir. Beceri eğitimi, staj ve tamamlayıcı eğitim yaptıracak Türk Silahlı Kuvvetlerine bağlı işletmeler, Bakanlık ve Millî Savunma Bakanlığınca birlikte belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>İşletmelerdeki personel sayısının tespitinde her yılın ocak ayı, yaz mevsiminde faaliyet gösteren işletmelerde temmuz ayı esas alınır. Beceri eğitimi uygulamasına da öğretim yılı başında başlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>İşletmelerde mesleki eğitim uygulaması kapsamına alınacak iller ve meslekler, Mesleki Eğitim Kurulunun görüşü doğrultusunda Bakanlıkça tespit edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Bu madde kapsamında on ve daha fazla öğrenciye beceri eğitimi, staj ve tamamlayıcı eğitim yaptıracak işletmeler bu amaçla bir eğitim birimi kurar. Bu birimde, yapılan eğitim için alanında ustalık yeterliğine sahip ve iş pedagojisi eğitimi almış usta öğretici veya eğitici personel görevlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Bu maddede belirtilen on personel sayısını beş personele kadar indirmeye Cumhurbaşkanı yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Eğitim programları">
        <mvz-fıkra no="1">
          <template>İşletmelerde uygulanacak ağır ve tehlikeli işlerde yapılacak eğitim dahil meslek eğitimi programları Mesleki Eğitim Kurulunun görüşü alınarak Bakanlıkça tespit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="Teorik eğitim">
        <mvz-fıkra no="1">
          <template>İşletmelerde beceri eğitimi gören öğrencilerin teorik eğitimi, mesleki ve teknik eğitim okul ve kurumlarında veya işletmelerin eğitim birimlerinde yapılır. Çalışma saatleri içinde yapılacak teorik eğitim haftada oniki saatten az olamaz. Bu eğitim yoğunlaştırılmak suretiyle de yapılabilir. Teorik eğitim günlerinde öğrenciler ücretli izinli sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mesleki ve teknik eğitim okul ve kurumlarında ve işletmelerde yapılan mesleki eğitim, staj ve tamamlayıcı eğitime ilişkin usul ve esaslar ile sınavların yapılış şekilleri, Bakanlık ve Yükseköğretim Kurulunca çıkarılan yönetmeliklerle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="İşyeri şartlarına uyma">
        <mvz-fıkra no="1">
          <template>İşletmelerde mesleki eğitim, staj ve tamamlayıcı eğitim gören öğrenciler, işyerlerinin şartlarına ve çalışma düzenine uymak zorundadırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Eğitimin devamı">
        <mvz-fıkra no="1">
          <template>İşletmelerde grev ve lokavt uygulaması, deprem, yangın ve sel gibi afetler olması halinde mesleki ve teknik eğitim okul ve kurumu öğrencileri eğitimlerini kendi mesleki ve teknik eğitim okul ve kurumlarında sürdürür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İşletmeler beceri eğitimi başladıktan sonra personel sayısında azalma olması halinde de,eğitime alınan öğrenciler okuldan mezun oluncaya kadar eğitimi devam ettirirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Beceri eğitimi yaptırabilecek diğer işletmeler" durum="mülga">
      </mvz-madde>
      <mvz-madde no="24" başlık="Mesleki eğitime katılma payı">
        <mvz-fıkra no="1">
          <template>On ve daha fazla personel çalıştıran ve Bakanlıkça işletmelerde mesleki eğitim kapsamına alınan, ancak, beceri eğitimi yaptırmayan işletmeler, beceri eğitimi yaptırması gereken her öğrenci için eğitim süresince her ay 18 yaşını bitirenlere ödenen asgari ücretin net tutarının 1/3’ü nispetinde, yirmi ve daha fazla personel çalıştırılması halinde 2/3’ü nispetinde Saymanlık hesabına para yatırmakla yükümlüdürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mesleki eğitim şartlarına sahip olan işletmelere Bakanlıkça öğrenci gönderilememesi halinde bu işletmeler,  katılma payı ödemezler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu sayının tespitinde görev ve çalışma statüsüne bakılmaksızın işyerinde 1475 sayılı İş Kanununa tabi olarak çalıştırılan personel sayısı dikkate alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Ücret, Sosyal Güvenlik ve izin">
      <mvz-madde no="25" başlık="Ücret ve Sosyal Güvenlik">
        <mvz-fıkra no="1">
          <template>Aday çırak ve çıraklar ile işletmelerde mesleki eğitim gören, staj veya tamamlayıcı eğitime devam eden öğrencilere işletmeler tarafından ödenecek ücret ve bu ücretlerdeki artışlar, düzenlenecek sözleşme ile tespit edilir. Ancak, işletmelerde mesleki eğitim gören öğrenciler ile mesleki ve teknik ortaöğretim okul ve kurumlarında staj veya tamamlayıcı eğitim gören öğrencilere asgari ücretin net tutarının; yirmi ve üzerinde personel çalıştıran işyerlerinde yüzde otuzundan, yirmiden az personel çalıştıran işyerlerinde yüzde onbeşinden, aday çırak ve çırağa yaşına uygun asgari ücretin yüzde otuzundan, kalfalık yeterliğini kazanan mesleki eğitim merkezi 12’nci sınıf öğrencilerine asgari ücretin yüzde ellisinden aşağı ücret ödenemez. Bu amaçla kamu kurum ve kuruluşları gerekli tedbirleri alır. Staj yapacak işletme bulunamaması nedeniyle stajını okulda yapan ortaöğretim öğrencileri ile yükseköğretim kurumları ve birimlerinde yapan yükseköğretim öğrencilerinin yaptıkları stajlar bu fıkra hükmü kapsamı dışındadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Aday çırak, çırak ve öğrencinin eğitimi sırasında işyerinin kusuru halinde meydana gelecek iş kazaları ve meslek hastalıklarından işveren sorumludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Aday çırak, çırak ve öğrencilere ödenecek ücretler her türlü vergiden müstesnadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Aday çırak, çıraklar, işletmelerde mesleki eğitim gören öğrenciler ile mesleki ve teknik ortaöğretim okul ve kurumlarında okumakta iken staja, tamamlayıcı eğitime veya alan eğitimine tabi tutulan öğrencilerin sigorta primleri asgari ücretin yüzde ellisi üzerinden, Bakanlık ile mesleki ve teknik eğitim yapan yükseköğretim kurumlarının bağlı olduğu üniversitelerin bütçesine konulan ödenekten karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Aday çırak, çırak ve işletmelerde mesleki eğitim gören, staj veya tamamlayıcı eğitime devam eden öğrenciler ile mesleki ve teknik eğitim okul ve kurumlarında alan eğitimine başlayan öğrenciler hakkında 506 sayılı Sosyal Sigortalar Kanununun 23, 24, 35 ve 42 nci maddeleri hükümleri uygulanmaz. Ayrıca bunlara aynı Kanuna göre işgöremezlik ödenekleri bağlanacak sürekli işgöremezlik gelirine esas olacak günlük kazançların tespitinde sigorta primine esas tutulan ücret dikkate alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="İzin">
        <mvz-fıkra no="1">
          <template>Aday çırak, çırak ve işletmelerde mesleki eğitim gören öğrencilere işletmelerce her yıl tatil aylarında bir ay ücretli izin verilir. Ayrıca mazeretleri kabul edilenlere okul müdürlüğünün görüşü alınarak bir aya kadar ücretsiz izin de verilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Ustalık">
    <mvz-madde no="27" başlık="Ustalık eğitimi">
      <mvz-fıkra no="1">
        <template>Kalfalık yeterliğini kazanmış olanların mesleki yönden gelişmelerini ve bağımsız işyeri açabilmelerini temin için gerekli yeterlikleri kazandırmak gayesiyle Bakanlıkça ustalık eğitimi düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu eğitimin kapsam ve süreleri Bakanlıkça tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3" durum="mülga">
        <template></template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Ustalık sınavı">
      <mvz-fıkra no="1">
        <template></template>
        <mvz-bent no="a">
          <template>Ustalık sınavı, adayın, kendi mesleğinde usta olarak çalışabilmesi için gerekli bilgi, beceri ve iş alışkanlıklarını mal ve hizmet üretiminde iş hayatınca kabul edilebilir standartlara göre bağımsız olarak uygulayıp uygulayamadığını ölçmek amacı ile düzenlenir. Sınavın esas ve usulleri yönetmelikle düzenlenir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kalfaların, ustalık sınavlarına girebilmesi için ustalık eğitimini başarı ile tamamlamış olmaları gerekir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kalfalık yeterliğini kazanmış olup mesleklerinde en az beş yıl çalışmış olanlar ustalık sınavlarına doğrudan katılabilirler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu sınavları başarı ile tamamlayanlara ustalık belgesi verilir. Ustalık belgesi bulunmayanlar usta unvanı ile çalışamaz ve çalıştırılamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Meslek lisesi mezunları için ustalık">
      <mvz-fıkra no="1">
        <template>En az üç yıl süreli mesleki ve teknik orta öğretim kurumlarından veya mesleki ve teknik eğitim okul ve kurumlarından mezun olanlar, Bakanlıkça düzenlenen ustalık eğitim kurslarına katılabilecekleri gibi doğrudan da ustalık sınavlarına girebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kursların kapsam ve süreleri ile sınavların esas ve usulleri Bakanlıkça çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ustalık unvanının kullanılmadığı mesleklerde çalışanlara, ustalık belgesinin hak, yetki ve sorumluluklarını taşıyan belge aynı esaslara göre verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mesleki ve teknik orta öğretim kurumu veya mesleki ve teknik eğitim merkezi mezunlarından, alanlarında Bakanlığa bağlı iki yıllık bir yaygın eğitim kurumundan belge alanlara doğrudan ustalık belgesi verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="İşyeri açma">
      <mvz-fıkra no="1">
        <template>Ustalık belgesine sahip olanlar veya bunları işyerlerinde çalıştıranlar bağımsız işyeri açabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamına alınan il ve mesleklerde; belediyeler ve işyeri açma izni vermeye yetkili diğer kurum ve kuruluşlar işyeri açılışında, esnaf ve sanatkârlar ile tacirlerin kendilerinden veya işyerinde her bir meslek dalında çalıştırdıkları en az birer çalışanından ustalık belgesi ya da en az ön lisans diploması istemek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu işyerlerinde alanında mesleki eğitim almış olanlar istihdam edilir. İstihdam edilenlerin almaları gereken eğitimin seviyesi, türü ile halen çalışanların durumu Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşyeri sahipleri veya o işyerinde çalışan ustalık belgesi sahipleri, ustalık belgelerini işyerlerine asar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ustalık belgesi sahibi olanlar bu haklarını onsekiz yaşını tamamlayana kadar kullanamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Teknik lise mezunları veya mesleki ve teknik eğitim okul ve kurumlarının dört yıllık eğitim programlarından mezun olanlara, ustalık belgesinin yetki ve sorumluluklarını taşıyan, mesleklerinde bağımsız İşyeri Açma Belgesi verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Usta öğreticilik">
      <mvz-fıkra no="1">
        <template>Ustalık yeterliğini kazanmış olanlar Bakanlıkça açılacak iş pedagojisi kurslarını başarıyla tamamladıkları takdirde kendilerine usta öğreticilik belgesi verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ustalık yeterliğini kazanmış olanlar mesleklerinde en az on yıl çalıştıklarını belgelendirdikleri takdirde Bakanlıkça açılacak iş pedagojisi kursu sınavına doğrudan katılabilirler. Başarılı olanlara usta öğreticilik belgesi verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Çıraklık, Mesleki ve Teknik Eğitimi Geliştirme ve Yaygınlaştırma Faaliyetlerinin Desteklenmesi">
    <mvz-madde no="32" başlık="Kuruluş">
      <mvz-fıkra no="1">
        <template></template>
        <mvz-bent no="a">
          <template>Çıraklık, mesleki ve teknik eğitimi geliştirme ve yaygınlaştırma hizmet ve faaliyetlerinde kullanılmak üzere;</template>
          <mvz-altbent no="1">
            <template>Bakanlık bünyesinde bulunan döner sermaye işletmelerinin kârları,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Bakanlığa bağlı kurumlarda eğitim öğretimde üretilen malların satışından elde edilen gelirler,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Bağış, yardım ve diğer her türlü gelirler,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Milli Eğitim Bakanlığı Merkez Saymanlık Müdürlüğü hesabına yatırılır. Yatırılan bu tutarlar Maliye Bakanlığınca bir yandan genel bütçeye özel gelir, diğer yandan Bakanlık bütçesinde açılacak tertiplere özel ödenek kaydedilir. Bu suretle ödenecek kaydedilen miktarlardan yılı içerisinde harcanmayan tutarları ertesi yıl bütçesine devren özel gelir ve ödenek kaydetmeye Maliye Bakanı yetkilidir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Çıraklık, mesleki ve teknik eğitimi geliştirme ve yaygınlaştırma hizmet ve faaliyetlerinde kullanılmak üzere Bakanlık bütçesine özel ödenek kaydedilen bu tutarlar aşağıdaki hizmetlerin yerine getirilmesinde kullanılır:</template>
          <mvz-altbent no="1">
            <template>Çıraklık, örgün ve yaygın mesleki ve teknik öğretim kurumlarında görevli yönetici, öğretmen, uzman, kadrolu ve kadrosuz usta öğreticilerin nitelik ve niceliklerinin yükseltilmesi için yurt içinde eğitilmelerinde,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Mesleki ve teknik eğitim metotlarının ve araçlarının araştırılması, geliştirilmesi ve yaygınlaştırılmasında,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Çıraklık, örgün ve yaygın mesleki ve teknik öğretim kurumlarının atölye ve laboratuvarları için makine, araç, takım ve teçhizat alınması, gerektiğinde kiralanması, bunların bakım ve tamirinde,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Çıraklık, örgün ve yaygın mesleki ve teknik eğitim kurumlarında görevli kadrolu ve kadrosuz atölye ve meslek dersi öğretim elemanlarına asli görevleri dışında, okulda ve işyerlerinde yapılan eğitimle ilgili normal maaş ve ücretlerine ilave ek ücret ödenmesinde,</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Çıraklık, örgün ve yaygın mesleki teknik eğitimle ilgili her türlü yayınların hazırlatılması, tercümesi, çoğaltılması, satın alınması ve dağıtılmasında,</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Çeşitli mesleklerde çalışmakta olanlara hizmet içinde ve mesleklerinde gelişmeleri için gerekli bilgi ve becerilerin kazandırılması için Bakanlığa bağlı eğitim kurumlarında kurslar, seminerler ve eğitim programları düzenlenmesinde,</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>İş öncesi eğitimi, yaygın ve çıraklık eğitiminde,</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>İl Mesleki Eğitim Kurulu toplantılarına katılan başkan, üye, müşavir üye, imtihan ve mesleki ihtisas komisyonu üyelerine Maliye Bakanlığının uygun görüşü üzerine tespit edilecek miktarda verilecek yolluk ve huzur hakkı ödemelerinde.</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="Çıraklık, mesleki ve teknik eğitimi teşvik" durum="mülga">
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="Çeşitli Hükümler">
    <mvz-madde no="34" başlık="Sanayi sitelerinde çıraklık eğitimi kurumları">
      <mvz-fıkra no="1">
        <template>Sanayi ve Ticaret Bakanlığı; bakanlıkla koordineli olarak sanayi sitelerinde çıraklık eğitimi kurumlarının yer almasına yardımcı olur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Denklik">
      <mvz-fıkra no="1">
        <template>Kapsamı, şartları ve süresi Bakanlıkça belirlenen telafi eğitimi veya tamamlayıcı eğitime katılan ve bu eğitim sonunda yapılan sınavlarda başarılı olan kalfa, usta ve ortaöğretim kurumu mezunlarına, bitirdikleri meslek alanının diploması verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Önceki öğrenmelere ilişkin mesleki yeterlikler, meslek standartları ve seviyeleri esas alınarak sınavla belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Önceki öğrenmelerin tanınması ve denklikle ilgili usul ve esaslar Bakanlıkça çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Eğitim giderleri">
      <mvz-fıkra no="1">
        <template>Aday çırak, çırak, kalfa ve işletmelerde mesleki eğitimde kamu ve özel kuruluşlarca yapılan teorik ve pratik eğitim giderleri kendi kurum ve kuruluşlarınca, işyerlerinde yapılan pratik eğitimin giderleri ise işyerlerince karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşyerleri pratik eğitim için eğitim mahalli, sınavlar için sınav ortamı, araç ve gereç hazırlarlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Meslek kursları">
      <mvz-fıkra no="1">
        <template>Bakanlık, örgün eğitim sisteminden ayrılmış,istihdam için gerekli yeterliklere sahip olmayan kişileri iş hayatında istihdam imkanı olan görevlere hazırlamak amacıyla meslek kursları düzenler. Kurslara katılanlar kursa devam ettikleri sürece bu Kanunun çırak ve öğrencilere verdiği haklardan yararlanırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık, kursların düzenlenmesinde ilgili Bakanlık, kurum ve kuruluşlarla işbirliği yapar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="38" başlık="Geliştirme ve uyum kursları">
      <mvz-fıkra no="1">
        <template>Yirmi ve daha fazla personel çalıştıran işletmeler çalıştırdığı personelin işindeki verimini yükseltmek, yeni teknolojilere uyumunu ve mesleklerinde gelişmelerini sağlamak amacıyla çalışma saatleri dışında çeşitli kurslar açarlar veya aynı amaca yönelik diğer kurumlarca açılan kurslara katılmalarını sağlarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşletmeler; kurs programlarının hazırlanmasında, uygulanmasında ve değerlendirilmesinde Bakanlık, İş ve İşçi Bulma Kurumu ile işbirliği yaparlar. Kursların açılması ve işleyişine ilişkin esas ve usuller yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="39" başlık="Özel eğitim kursları">
      <mvz-fıkra no="1">
        <template>Bakanlık, özel eğitime muhtaç kişilere iş hayatında geçerliliği olan görevlere hazırlayıcı özel meslek kursları düzenler. Kursların düzenlenmesinde ve uygulanmasında bu kişilerin ilgi, ihtiyaç ve yetenekleri dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurslara katılanlar kursa devam ettikleri sürece bu Kanunun çırak ve öğrencilere verdiği haklardan yararlanırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="40" başlık="Yolluk ve huzur hakkı" durum="mülga">
    </mvz-madde>
    <mvz-madde no="41" başlık="Denetleme ve ceza">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre Bakanlığa bağlı eğitim kurumlarının dışında kamu ve özel kurum ve kuruluşlarında yapılan aday çırak, çırak ve kalfaların eğitimi ile işletmelerde yapılan mesleki eğitim, öğrencilerin bu eğitiminden sorumlu işletmelerin bağlı olduğu oda veya birliklerin temsilcilerinin katılımı ile Bakanlıkça; iş ortamı, sosyal güvenlik, iş güvenliği ve sağlık şartları bakımından ise Çalışma ve Sosyal Güvenlik Bakanlığınca denetlenir. Denetimle ilgili raporlar valiliğe verilir. Raporlarda belirtilen hususlar valilikçe değerlendirilir ve gereği yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Denetlemenin esas ve usulleri bu bakanlıklarca müştereken çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun; 9, 10, 12, 13, 14, 15, 17, 20, 22, 25, 26, 28 ve 30 uncu maddelerindeki yükümlülükleri yerine getirmeyenlere ihtar cezası verilir. İhtarın tebliğinden itibaren on gün içinde yükümlülüklerini yerine getirmeyenlerden;</template>
        <mvz-bent no="a">
          <template>9, 10, 25, 26 ve 28 inci maddelerine aykırı davrananlara altıyüz Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>12, 13, 14, 15, 17, 20, 22 ve 30 uncu maddelerine aykırı davrananlar ile sözleşmeyi tek taraflı ve haksız olarak fesheden işletmelere dörtyüz Türk Lirası,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Fiilin tekrarı hâlinde bu cezalar iki katına çıkarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Fiilin sürmesi hâlinde ise meslekten geçici men cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu maddedeki idarî yaptırımlara karar vermeye mahallî mülkî amir yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu Kanunun 30 uncu maddesine aykırı olarak açılan işyerleri durumun öğrenilmesinden itibaren İl Mesleki Eğitim Kurulu ile ilgili mercilerin müracaatı üzerine mahallî mülkî amirce yedi gün içinde kapatılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Mesleki ve Teknik Eğitim Araştırma ve Geliştirme Merkezi">
      <mvz-fıkra no="1">
        <template>Çıraklık, Mesleki ve Teknik Eğitim konularında Bakanlıkça ihtiyaç duyulan planlama, araştırma, geliştirme ve üretim hizmetlerini yapmak veya yaptırmak amacıyla doğrudan merkeze bağlı taşra kuruluşu olarak "Mesleki ve Teknik Eğitim Araştırma ve Geliştirme Merkezi" kurulmuştur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Merkezin kuruluş, yönetim, işleyiş ve döner sermaye hizmetlerine ilişkin hususlar ile merkezde görevlendirilecek personelin nitelik ve çalışma esas ve usulleri Cumhurbaşkanınca çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Merkezde sözleşmeli personel çalıştırılabilir. Merkezde görevli sözleşmeli personel dışındaki eğitim - öğretim sınıfı personeli; 2914 sayılı Yükseköğretim Kurulu Personel Kanunundaki esaslara göre Üniversitedeki emsalinin mali haklarından aynen faydalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="">
      <mvz-fıkra no="1">
        <template>3423 sayılı Milli Eğitim Bakanlığına Bağlı Mesleki ve Teknik Öğretim Okulları Döner Sermayesi Hakkında Kanun ile ilgili olup yerine işlenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template></template>
        <mvz-bent no="a">
          <template>20/6/1977 tarih ve 2089 sayılı Çırak, Kalfa ve Ustalık Kanunu;</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>17/6/1938 tarih ve 3457 sayılı Sınai Müesseselerde ve Maden Ocaklarında Mesleki Kurslar Açılmasına dair Kanun;</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Mesleki ve teknik eğitim merkezlerinin kuruluşu" tür="Ek">
      <mvz-fıkra no="1">
        <template>Öncelikle, Bakanlıkça belirlenecek küçük yerleşim birimlerinde olmak üzere, mesleki ve teknik eğitim merkezleri kurulur. Bu merkezlerde, mesleki ve teknik eğitim alanında orta öğretim diploması, sertifika ve belge veren programlar uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mesleki ve teknik eğitim merkezlerinin kurulmasına, eğitim, öğretim, yönetim ve üretim ile ilgili her türlü iş ve işlemlere ilişkin esas ve usuller Bakanlıkça çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Mevzuatta Mesleki Eğitim Kuruluna yapılmış olan atıflar, Cumhurbaşkanınca belirlenen kurul veya mercie yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Kalfalık ve ustalık belgesi verilmesi" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte;</template>
        <mvz-bent no="a">
          <template>Bakanlıkça tesbit edilen meslek dallarında çalışmakta olup, bakanlıkça ilan edilecek tarihten itibaren üç ay içerisinde müracaat edenlerden;</template>
          <mvz-altbent no="1">
            <template>18 yaşını doldurmuş olanlar doğrudan,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>16 yaşını doldurmuş olanlar kapsam ve süreleri Bakanlıkça belirlenecek eğitime tabi tutulduktan sonra,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Kalfalık imtihanlarına alınırlar. İmtihanlarda başarılı olanlara kalfalık belgesi verilir.</template>
          <mvz-altbent no="3">
            <template>Kalfalık belgesini almış olup 22 yaşını doldurmuş olanlara ustalık imtihanlarını başarmaları şartı ile ustalık belgesi verilir.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template></template>
          <mvz-altbent no="1" durum="iptal">
            <template></template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Lise dengi mesleki ve teknik öğretim kurumlarından 1985 - 1986 öğretim yılı sonuna kadar mezun olanlara;</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Doğrudan ustalık belgesi verilir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsamda olmayan il ve mesleklerde kalfalık ve ustalık belgesi verilmesi" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Kanun kapsamına alınmamış il ve mesleklerin Bakanlıkça kanun kapsamına alınması halinde alınma tarihinden itibaren bu il ve mesleklerde kalfalık ve ustalık belgeleri bu kanunun geçici 1 inci madde hükümlerine göre verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Yapılan uygulamaların geçerliliği" tür="Geçici">
      <mvz-fıkra no="1">
        <template>3457 sayılı Sınai Müesseselerde ve Maden Ocaklarında Mesleki Kurslar Açılmasına Dair Kanun ile 2089 sayılı Çırak, Kalfa ve Ustalık Kanununa göre yapılan uygulamalar ve alınmış olan kalfalık ve ustalık belgeleri geçerlidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Sigorta primlerinin ödenmeye başlanması" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 25 inci maddesine göre sigorta primlerinin ödenmesine bu Kanunun yürürlüğe girdiği tarihi takip eden mali yılbaşından itibaren başlanır. Bu tarihe kadar olan sürede primlerin işyeri sahiplerince ödenmesine devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun gereğince çıkarılacak tüzük ve yönetmelikler Kanunun yayımı tarihinden itibaren altı ay içinde çıkarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bakanlıkça tesbit edilecek illerde ve meslek dallarında 1986 - 1987 öğretim yılında işletmelerde mesleki eğitimin başlatılabilmesi için işletmelerin çalıştırdıkları işçi sayısı Çalışma ve Sosyal Güvenlik Bölge Müdürlüğünce 1 Ağustos 1986 tarihine kadar Bakanlığa bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>32 nci maddenin 2 nci fıkrasının (e) bendi 1986 yılı kazançlarına uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bakanlık, Kanunun yürürlüğe girdiği tarihte geçici 1 inci maddedeki şartlara sahip oldukları halde Bakanlıkça ilan edilen tarihlerde belge almak için müracaat edemeyenlere 6 (altı) aya kadar ek müracaat süreleri vermeye yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yayımı tarihinden önce, 3308 sayılı Çıraklık ve Meslek Eğitimi Kanununun çıraklık eğitimi uygulama kapsamındaki mesleklerde ustalık belgesi sahibi olmadığı halde işyeri açmış olanlara, kapsam ve süresi ilgili meslek kuruluşlarının görüşü alınarak Bakanlıkça belirlenecek telâfi eğitimine katılmaları ve bu eğitim sonundaki sınavlarda başarılı olmaları halinde doğrudan ustalık belgesi verilir. Bu gibilere telâfi eğitimini tamamlamaları için beş yıl süre tanınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalıştığı meslek dalı çıraklık eğitimi uygulama kapsamına alınmadan önce meslek odalarınca mevzuatına uygun olarak verilmiş kalfalık ve ustalık belgeleri, mesleğin o ilde kapsama alınmasından sonra Bakanlıkça yeni belgeler ile doğrudan değiştirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamı dışındaki mesleklerde, mesleki belgelerin verilmesi işlemi, o meslek kapsama alınıncaya kadar ilgili meslek kuruluşlarınca mevzuat doğrultusunda yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddeyi ihdas eden Kanunun yürürlüğe girdiği tarihte çıraklık eğitimine devam etmekte olanlar, eğitimlerini başladıkları programa ve mevzuata göre sürdürür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>2016-2017 eğitim ve öğretim yılı sonuna kadar uygulanmak üzere aday çırak ve çıraklar ile 18 inci madde hükümleri uyarınca işletmelerde mesleki eğitim gören, staj veya tamamlayıcı eğitime devam eden öğrencilere, 25 inci maddenin birinci fıkrası kapsamında yapılacak ödemeler asgari ücretin net tutarının yüzde otuzundan, kalfalık yeterliğini kazanan mesleki eğitim merkezi 12’nci sınıf öğrencilerine yapılacak ödemeler asgari ücretin yüzde ellisinden az olamaz. Mesleki eğitim merkezi programı dışındaki okul ve kurumlarda öğrenim gören öğrencilere ödenebilecek en az ücretin; yirmiden az personel çalıştıran işletmeler için üçte ikisi, yirmi ve üzerinde personel çalıştıran işletmeler için üçte biri; mesleki eğitim merkezi programına devam eden öğrencilere ödenebilecek en az ücretin ise tamamı 25/8/1999 tarihli ve 4447 sayılı İşsizlik Sigortası Kanununun 53 üncü maddesinin üçüncü fıkrasının (B) bendinin (h) alt bendi için ayrılan tutardan Devlet katkısı olarak ödenir. Bu kapsamda yapılacak ödemeleri on eğitim ve öğretim yılına kadar uzatmaya Cumhurbaşkanı yetkilidir. Staj yapacak işletme bulunamaması nedeniyle stajını okulda yapan ortaöğretim öğrencileri ile öğretim programı gereği staj yapmak zorunda olmayan yükseköğretim öğrencilerinin yaptıkları stajlar bu fıkra hükmü kapsamı dışındadır. Kamu kurum ve kuruluşlarına Devlet katkısı ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde uyarınca ödenen Devlet katkısı ödemenin yapıldığı tarihi takip eden iki ay içerisinde Çalışma ve Sosyal Güvenlik Bakanlığı bütçesinden İşsizlik Sigortası Fonuna aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada bu fıkrayı düzenleyen Kanunla yapılan değişiklikler sebebiyle 2021-2022 eğitim ve öğretim yılından önceki döneme ilişkin geçmişe dönük olarak herhangi bir ücret veya Devlet katkısı ödemesi yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Bakanlık ve Türkiye İş Kurumu tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
