  <mvz-künye tür="kanun" no="3621" başlık="KIYI KANUNU"
             tarih="4/4/1990" rgazete-tarih="17/4/1990" rgazete-sayı="20495"
             düstur-tertip="5" düstur-cilt="29" düstur-sayfa="76" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanun, deniz, tabii ve suni göl ve akarsu kıyıları ile bu yerlerin etkisinde olan ve devamı niteliğinde bulunan sahil şeritlerinin doğal ve kültürel özelliklerini gözeterek koruma ve toplum yararlanmasına açık, kamu yararına kullanma esaslarını tespit etmek amacıyla düzenlenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, deniz, tabii ve suni göller ve akarsu kıyıları ile deniz ve göllerin kıyılarını çevreleyen sahil şeritlerine ait düzenlemeleri ve bu yerlerden kamu yararına yararlanma imkan ve şartlarına ait esasları kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="İstisnalar">
      <mvz-fıkra no="1">
        <template>Askeri yasak bölgeler ve güvenlik bölgelerinde veya ülke güvenliği ile doğrudan ilgili, Türk Silahlı Kuvvetlerine veya Sahil Güvenlik Komutanlığına ait harekat ve savunma amaçlı yerlerde  özel kanun hükümlerine, diğer özel kanunlar uyarınca belirlenmiş veya belirlenecek yerlerde ise özel kanunların bu Kanuna aykırı olmayan hükümlerine uyulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen deyimlerden;</template>
        <mvz-bent no="a">
          <template>Kıyı çizgisi: Deniz, tabii ve suni göl ve akarsularda, taşkın durumları dışında, suyun karaya değdiği noktaların birleşmesinden oluşan çizgiyi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kıyı Kenar çizgisi: Deniz, tabii ve suni göl ve akarsularda, kıyı çizgisinden sonraki kara yönünde su hareketlerinin oluşturulduğu kumluk, çakıllık, kayalık, taşlık, sazlık, bataklık ve benzeri alanların doğal sınırını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kıyı: Kıyı çizgisi ile kıyı kenar çizgisi arasındaki alanı,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Sahil şeridi: Kıyı kenar çizgisinden itibaren kara yönünde yatay olarak en az 100 metre genişliğindeki alanı,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Dar Kıyı: Kıyı kenar çizgisinin, kıyı çizgisi ile çakışmasını,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Toplumun yararlanmasına açık yapı: Mevzuata göre tespit ya da tasdik edilmiş kural ve ücret tarifelerine uygun biçimde, getirdiği kullanımdan belirli kişi ya da topluluklara ayrıcalıklı kullanım hakkı tanımaksızın yararlanmak isteyen herkese eşit ve serbest olarak açık bulundurulan ve konut dokunulmazlığı olmayan yapıları,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Genel Esaslar">
      <mvz-fıkra no="1">
        <template>Kıyılar ile ilgili genel esaslar aşağıda belirtilmiştir:</template>
        <mvz-bent no="a">
          <template>Kıyılar, Devletin hüküm ve tasarrufu altındadır. Kıyılar, herkesin eşit ve serbest olarak yararlanmasına açıktır,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kıyı ve sahil şeritlerinden yararlanmada öncelikle kamu yararı gözetilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kıyıda ve sahil şeridinde planlama ve uygulama yapılabilmesi için kıyı kenar çizgisinin tespiti zorunludur.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Kıyı kenar çizgisinin tespit edilmediği bölgelerde talep vukuunda, talep tarihini takip eden üç ay içinde kıyı kenar çizgisinin tespiti zorunludur.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Ek :  Sahil şeritlerinde yapılacak yapılar kıyı kenar çizgisine en fazla 50 metre yaklaşabilir.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Ek :  Yaklaşma mesafesi ve kıyı kenar çizgisi arasında kalan alanlar, ancak yaya yolu, gezinti, dinlenme, seyir ve rekreaktif amaçla kullanılmak üzere düzenlenebilir.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Ek :  Sahil şeritlerinin derinliği, 4 üncü maddede belirtilen mesafeden az olmamak üzere, sahil şeridindeki ve sahil şeridi gerisindeki kullanımlar ve doğal eşikler de dikkate alınarak belirlenir.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Ek :  Taşıt yolları, sahil şeridinin kara yönünde yapı yaklaşma sınırı gerisinde kalan alanda düzenlenebilir.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Ek :  Sahil şeridinde yapılacak yapıların kullanım amacına bağlı olarak yapım koşulları yönetmelikte belirlenir.</template>
        </mvz-bent>
      </mvz-fıkra>  
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Kıyı, Kıyı Kenar Çizgisi, Sahil Şeridi, Planlama ve Yapılanma">
    <mvz-madde no="6" başlık="Kıyının Korunması, Yapı Yasağı, Kıyı ve Su Alanlarında Yapılacak Yapılar">
      <mvz-fıkra no="1">
        <template>Kıyı, herkesin eşitlik ve serbestlikle yararlanmasına açık olup, buralarda hiçbir yapı yapılamaz; duvar, çit, parmaklık, telörgü, hendek, kazık ve benzeri engeller oluşturulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kıyılarda, kıyıyı değiştirecek boyutta kazı yapılamaz; kum, çakıl vesaire alınamaz veya çekilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kıyılara moloz, toprak, curuf, çöp gibi kirletici etkisi olan atık ve artıklar dökülemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kıyının kumluk veya çakıllık olduğu alanlarda denize girme, güneşlenme, amatör su sporları gibi faaliyetlerin gerçekleştirilmesine yönelik rekreatif amaçlı iskele yapılamaz. Ancak, kıyının kayalık karakter gösterdiği ya da kıyının kumluk veya çakıllık olmasına rağmen niteliği gereği su alanından başka türlü faydalanmanın mümkün olmadığı zorunlu hallerde genişliği üç metreyi geçmeyen ve platform niteliği taşımayan rekreatif amaçlı iskeleler yapılabilir. Buna ilişkin usul ve esaslar; 2634 sayılı Kanun kapsamındaki alanlarda Kültür ve Turizm Bakanlığı ile Çevre ve Şehircilik Bakanlığı tarafından müştereken, diğer alanlarda ise Çevre ve Şehircilik Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kıyıda imar planı kararı ile;</template>
        <mvz-bent no="a">
          <template>İskele, liman, barınak, yanaşma yeri, rıhtım, dalgakıran, köprü, menfez, istinat duvarı, fener, çekek yeri, kayıkhane, tuzla, dalyan, tasfiye ve pompaj istasyonları gibi, kıyının kamu yararına kullanımı ve kıyıyı korumak amacına yönelik alt yapı ve tesisler, Sahil Güvenlik Komutanlığının faaliyetlerinin özelliği gereği kıyıdan başka yerde yapılması mümkün olmayan Sahil Güvenlik Komutanlığı bağlısı gemi/bot karakolları ve destek birimi binaları,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Faaliyetlerinin özellikleri gereği kıyıdan başka yerde yapılmaları mümkün olmayan tersane, gemi söküm yeri ve su ürünlerini üretim ve yetiştirme tesisleri gibi, özelliği olan yapı ve tesisler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Organize turlar ile seyahat eden kişilerin taşındığı yolcu gemilerinin  bağlandığı, günün teknolojisine uygun yolcu gemisine hizmet vermek amacıyla liman hizmetlerinin  sağlandığı, yolcularla ilgili gümrüklü alan hizmetlerinin görüldüğü, ülke tanıtımı ve imajını üst seviyeye çıkaracak turizm amaçlı  fonksiyonlara sahip olup, kruvaziyer gemilerin yanaşmasına ve yolcuları indirmeye müsait deniz yapıları ve yan tesislerinin yer aldığı kruvaziyer ve yat limanları,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Uluslararası spor otoritelerinin, Türkiye’de spor faaliyetlerinin düzenleneceğine dair kararı gereğince Gençlik ve Spor Genel Müdürlüğünün bağlı olduğu spordan sorumlu Bakanlığın izni doğrultusunda, 10/12/2003 tarihli ve 5018 sayılı Kamu Mali Yönetimi ve Kontrol Kanununun (I) sayılı Cetvelinde düzenlenen genel bütçe kapsamındaki kamu idareleri, aynı Kanunun  sayılı Cetvelinde düzenlenen özel bütçeli idareler, belediyeler ile il özel idareleri tarafından her türlü spor aktiviteleri ve organizasyonların yapılmasına/yaptırılmasına yönelik spor tesisleri ve zorunluluk arz eden durumlarda bunların tamamlayıcı konaklama tesisleri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Trabzon, Rize ve Zonguldak illerinde 24/5/1933 tarihli ve 2219 sayılı Hususi Hastaneler Kanunu kapsamında kalan sağlık tesisleri hariç olmak üzere, Cumhurbaşkanınca alınacak kamu yararı kararı doğrultusunda kurulacak sağlık tesisleri ve alternatif alan bulunmaması durumunda 9/1/2002 tarihli ve 4737 sayılı Endüstri Bölgeleri Kanununa göre kurulan, işletilen ve mevcut en iyi teknikleri kullanan endüstri bölgeleri,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Enerji iletim hatları,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Millet bahçeleri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İçme-kullanma suyu temin edilen rezervuarlar ve sulak alanlar ile bu Kanun kapsamında kalan kıyı ve sahil şeritleri hariç olmak üzere denizler, baraj gölleri, suni göller ve tabii göllerin Enerji ve Tabii Kaynaklar Bakanlığınca yenilenebilir enerji kaynak alanı olarak ilan edilen alanlarında imar planı yapılmaksızın yenilenebilir enerji üretim santralleri kurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İçme-kullanma suyu temin edilen rezervuarlar ve sulak alanlar ile bu Kanun kapsamında kalan kıyı ve sahil şeritleri hariç olmak üzere baraj gölleri, suni göller ve tabii göllerde imar planı yapılmaksızın 14/3/2013 tarihli ve 6446 sayılı Elektrik Piyasası Kanununa göre hidrolik kaynaklara dayalı önlisans veya üretim lisansı sahibi tüzel kişiler tarafından yenilenebilir enerji kaynağına dayalı birden çok kaynaklı üretim tesisi kurulabilir. Söz konusu alanlarda Devlet Su İşleri Genel Müdürlüğüne veya sulama birliklerine ait tarımsal sulama amaçlı tesislerin elektrik ihtiyaçlarını karşılamak amacıyla Devlet Su İşleri Genel Müdürlüğü veya Devlet Su İşleri Genel Müdürlüğünün izniyle sulama birlikleri tarafından yenilenebilir enerji kaynaklarına dayalı lisanssız elektrik üretim tesisi kurulabilir. Ayrıca belediye sınırları içerisinde yer alan söz konusu alanlarda Devlet Su İşleri Genel Müdürlüğünün izni ile ilgili belediyeler ve bağlı kuruluşları tarafından yenilenebilir enerji kaynaklarına dayalı lisanssız elektrik üretim tesisi kurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Özelleştirme kapsam ve programına alınan ve sahil şeridi belirlenen veya belirlenecek olan alanlar ile kıyı ve dolgu alanlarında yapılacak yat ve kruvaziyer limanlarının ihtiyacı olan yönetim birimleri, destek birimleri, bakım ve onarım birimleri, teknik ve sosyal altyapı ve konaklama birimleri ile ilgili kullanım kararları ve yapılanma şartları imar plânı ile belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu yapı ve tesisler yapım amaçları dışında kullanılamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Doldurma ve Kurutma Yoluyla Arazi Kazanma ve Bu Araziler Üzerinde Yapılabilecek Yapılar">
      <mvz-fıkra no="1">
        <template>Kamu yararının gerektirdiği hallerde, uygulama imar planı kararı ile deniz, göl ve akarsularda ekolojik özellikler dikkate alınarak doldurma ve kurutma suretiyle arazi elde edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu gibi yerlerde doldurma veya kurutmayı yapacak ilgili idarenin valiliğe iletilen teklifi, valilik görüşü ile birlikte Çevre ve Şehircilik Bakanlığına gönderilir. Bakanlık, konusuna göre ilgili kuruluşların görüşünü de almak suretiyle teklifi inceler. Uygun bulunması halinde ilgili idare tarafından uygulama imar planı hazırlanır. Bu yerler için yapılacak planlar hakkında 3/5/1985 tarihli ve 3194 sayılı İmar Kanunu hükümleri uygulanır. Ancak bu planlar Çevre ve Şehircilik Bakanlığı tarafından; 12/3/1982 tarihli ve 2634 sayılı Turizmi Teşvik Kanunu kapsamında kalan alanlardaki planlar, anılan Kanunun 7 nci maddesine göre ve 4737 sayılı Kanun kapsamında kalan alanlardaki planlar ise anılan Kanunun 4/A, 4/C ve 4/Ç maddelerine göre tasdik edilir. Doldurma ve kurutma işlemleri yürürlükteki mevzuat hükümlerine göre yapılır. Bu araziler Devletin hüküm ve tasarrufu altındadır, özel mülkiyet konusu olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu alanlar üzerinde 6 ncı maddede belirtilen yapılar ile yol, açık otopark, park, yeşil alan ve çocuk bahçeleri gibi teknik ve sosyal altyapı alanları düzenlenebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Sahil Şeridinde Yapılabilecek Yapılar">
      <mvz-fıkra no="1">
        <template>Uygulama imar planı bulunmayan alanlardaki sahil şeritlerinde, 4 üncü maddede belirtilen mesafeler içinde hiç bir yapı ve tesis yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Uygulama imar planı bulunan yerlerde duvar, çit, parmaklık, telörgü, hendek, kazık ve benzeri engeller oluşturulamaz. Moloz, toprak, curuf, çöp gibi kirletici ve çevreyi bozucu etkisi olan atık ve artıklar dökülemez, kazı yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ancak bu alanlarda; uygulama imar planı kararıyla altı ve yedinci maddede belirtilen yapı ve tesislerle birlikte toplum yararına açık olmak şartıyla konaklama hariç günü birlik turizm yapı ve tesisleri yapılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Kıyı Kenar Çizgisinin Tespiti">
      <mvz-fıkra no="1">
        <template>Kıyı kenar çizgisi, valiliklerce, kamu görevlilerinden oluşturulacak en az 5 kişilik bir komisyonca tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu komisyon; jeoloji mühendisi, jeolog veya jeomorfolog, harita ve kadastro mühendisi, ziraat mühendisi, mimar ve şehir plancısı, inşaat mühendisinden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Komisyonca tespit edilip valiliğin uygun görüşü ile birlikte gönderilen kıyı kenar çizgisi, Çevre ve Şehircilik Bakanlığınca onaylandıktan sonra yürürlüğe girer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Komisyonun çalışma usul ve esasları Çevre ve Şehircilik Bakanlığınca hazırlanan yönetmelik ile belirlenir.7</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Kıyı ve Sahil Şeridinde Planlar">
      <mvz-fıkra no="1">
        <template>Kıyıda ve sahil şeridindeki planlar bu Kanunun ve buna dayanılarak çıkarılacak yönetmeliğin hükümlerine aykırı olamaz. Bu yerlerde düzenlenen planlardan, imar mevzuatı veya yerin özelliği dolayısıyla 2634 sayılı Turizmi Teşvik Kanunu kapsamına girenler, anılan Kanunun 7 nci maddesine göre onaylanarak kesinleşir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Kıyıda ve Doldurma ve Kurutma Yoluyla Kazanılan Araziler Üzerinde Yapılanmalara İzin Verilmesi">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre, kıyıda ve doldurma ve kurutma yoluyla kazanılan araziler üzerinde yapılması mümkün olan yapı ve tesislerin yapılabilmesi için, Çevre ve Şehircilik Bakanlığından gerekli iznin alınması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yapı ruhsatı verilmesinde bu izin belgesi yeterlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İznin verilme şekil ve şartları Çevre ve Şehircilik Bakanlığınca tespit edilerek çıkarılacak uygulama yönetmeliğinde belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Tapuya Şerh Verilmesi">
      <mvz-fıkra no="1">
        <template>Sahil şeridinde, bu Kanunun 8 inci maddesinde belirtilen hükümlere uygun olarak yapılan yapıların bu niteliklerinin, tapu kütüğünün beyanlar hanesine işlenmesi zorunludur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Kontrol, İmar Mevzuatına Aykırı Yapı ve Ceza Hükümleri">
    <mvz-madde no="13" başlık="Kontrol">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında kalan alanlardaki uygulamaların kontrolu; belediye ve mücavir alan sınırları içinde belediye, dışında ise valilikçe yürütülür. İlgili bakanlıkların teftiş ve kontrol yetkileri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="İmar Mevzuatına Aykırı Yapı">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında kalan alanlarda ruhsatsız yapılar ile ruhsat ve eklerine aykırı yapılar hakkında 3l94 sayılı İmar Kanununun ilgili hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Ceza Hükümleri">
      <mvz-fıkra no="1">
        <template>Kıyıda ve uygulama imar planı bulunan sahil şeritlerinde duvar, çit, parmaklık, tel örgü, hendek, kazık ve benzeri engelleri oluşturanlara ikibin Türk Lirasından onbin Türk Lirasına kadar idarî para cezası verilir. Ayrıca oluşturulan engellerin beş günden fazla olmamak üzere belirlenen süre zarfında kaldırılmasına karar verilir. Bu süre zarfında engellerin ilgililer tarafından kaldırılmaması halinde, masrafı yüzde yirmi zammıyla birlikte kendilerinden kamu alacaklarının tahsili usulüne göre tahsil edilmek üzere kamu gücü kullanılmak suretiyle derhal kaldırılır. Kabahatin tekrarı halinde, ceza üst sınırdan verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada sayılan yerlerden kum, çakıl alanlara üçbin Türk Lirasından onbeşbin Türk Lirasına kadar idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada sayılan yerlere moloz, toprak, cüruf, çöp gibi atık ve artıkları dökenler, atılan veya dökülen maddenin niteliğine, çevreyi kirletici ve bozucu etkisine göre Türk Ceza Kanunu, Kabahatler Kanunu veya Çevre Kanunu hükümlerine göre cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıdaki fıkralarda sayılan fiillerin kıyının doğal yapısını bozacak bir etki meydana getirmesi halinde, daha ağır cezayı gerektiren bir suç oluşturmadığı takdirde, failleri hakkında altı aydan iki yıla kadar hapis cezasına hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Birinci fıkrada sayılan yerlerde ruhsatsız veya ruhsat ve eklerine aykırı olarak yapı yapan kişilere Türk Ceza Kanunu veya İmar Kanunu hükümlerine göre verilecek ceza bir kat artırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İlgili kanunlarda belirtilen makamların yetkileri saklı kalmak üzere, bu maddede belirtilen idarî yaptırımlara karar vermeye mahalli mülki amir yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanması ile ilgili yönetmelik, Kanunun yayımından itibaren 3 ay içinde Maliye ve Gümrük, Turizm Bakanlıklarının yazılı görüşü alınarak Bayındırlık ve İskan Bakanlığınca hazırlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Özelleştirme kapsamındaki kuruluşların kullanımında bulunan ve bu Kanunun 6 ncı maddesi kapsamında kıyıda yer alan arazi ve yapılar için, bu Kanun hükümleri çerçevesinde yapılması gereken tüm işlemler  kuruluşun özelleştirme kapsamına alınmasını takiben ilgili kurum ve kuruluşlarca iki ay içerisinde sonuçlandırılır. Bu arazi ve yapılar Özelleştirme İdaresi Başkanlığının talebine istinaden kadastro müdürlüğünce kadastro paftalarına özel işaretleri ile belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Ekli (5) numaralı kroki ile listede sınır ve koordinatları gösterilen alanın bu Kanuna tabi kısımlarında imar planı kararıyla resmi kurum alanı yapılabilir. Bu alan, imar planında belirlenen amaç dışında kullanılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>11/7/1992 tarihinden önce yapıldığı tarihteki mevzuatına uygun olarak yapılan yapılardan;</template>
        <mvz-bent no="a">
          <template>Büyükşehir belediye sınırları içinde köyden mahalleye dönüşen ve ilgili idaresince kırsal yerleşik alan kabul edilen yerleşme alanlarının sahil şeridinde kalan yapılar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Belediye sınırları içinde olanlar dâhil köy statüsünü koruyan, köy yerleşme alanlarının sahil şeridinde kalan yapılar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>mevcut haliyle korunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yapılar, kat mülkiyeti tesis edilmemek ve herhangi bir müktesep hak teşkil etmemek ve mevcut kontur ve gabari aşılmamak kaydı ile yöreye uygun cephe değişikliği ve onarımı ile can ve mal güvenliği için güçlendirme yapılarak kullanılabilir. Bu nitelikteki köy yerleşme alanlarının sahil şeridinde kalan kısımlarında yeni yapı yapılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Ekli (6) numaralı krokile ile listede sınır ve koordinatları gösterilen alanda yer seçim kararına uygun olarak imar planı kararıyla su ürünleri yetiştiriciliği konulu Tarıma Dayalı İhtisas Organize Sanayi Bölgesi kurulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Ekli (7) numaralı kroki ile listede sınır ve koordinatları gösterilen alanda, yer seçim kararına uygun olarak imar planı kararıyla sera konulu Tarıma Dayalı İhtisas Organize Sanayi Bölgesi kurulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Ekli (8) numaralı kroki ile listede sınır ve koordinatları gösterilen alanda, yer seçim kararına uygun olarak imar planı kararıyla Organize Sanayi Bölgesi kurulabilir. Bu alan 12/4/2000 tarihli ve 4562 sayılı Organize Sanayi Bölgeleri Kanununun 4 üncü maddesinin dördüncü fıkrası kapsamında devredilir ve devredilemeyecek alanlarda ise aynı usul ve esaslarla kullanma izni verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce mevzuat hükümlerine uygun olarak onanmış ve kısmen veya tamamen yapılaşmış 1/1000 ölçekli uygulama imar planlarının sahil şeritleri ile ilgili hükümleri geçerlidir. Ancak, 8 inci maddenin ikinci fıkra hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanunun  hükümleri yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
