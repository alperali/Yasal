  <mvz-künye tür="kanun" no="7223" başlık="ÜRÜN GÜVENLİĞİ VE TEKNİK DÜZENLEMELER KANUNU"
             tarih="5/3/2020" rgazete-tarih="12/3/2020" rgazete-sayı="31066" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, ürünlerin güvenli ve ilgili teknik düzenlemelere uygun olmasını sağlamak; piyasa gözetimi ve denetiminin esasları ile yetkili kuruluşların görevlerini ve iktisadi işletmeciler ile uygunluk değerlendirme kuruluşlarının yükümlülüklerini belirlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, piyasaya arz edilmesi hedeflenen, arz edilen, piyasada bulundurulan veya hizmete sunulan tüm ürünleri kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avrupa Birliği üyesi ülkelere ihraç edilen veya ihraç edilmesi hedeflenen ürünler bu Kanun kapsamında piyasaya arz edilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bir ürüne ilişkin özel bir kanunun bulunması durumunda, bu Kanun hükümleri söz konusu ürüne, özel kanunda hüküm bulunmayan hallerde uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Avrupa Birliği üyesi ülkeler dışındaki ülkelere ihraç edilen veya ihraç edilmesi hedeflenen ürünler bu Kanunun kapsamı dışındadır. Ancak bu ürünlerin de güvenli olması, tağşişe konu olmaması ve ürüne ilişkin işaretleme, etiketleme ve belgelendirmenin alıcıyı yanıltmayacak şekilde yapılması zorunludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Akreditasyon: Bir ulusal akreditasyon kurumu tarafından bir uygunluk değerlendirme kuruluşunun, belirli bir uygunluk değerlendirme faaliyetini yerine getirmek üzere ilgili ulusal veya uluslararası standartların belirlediği gerekleri ve uygulanabildiği yerlerde ilgili sektörel düzenlemelerde öngörülen ek gerekleri karşıladığının tespitine ve resmî kabulüne ilişkin kamu faaliyetini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakanlık: Ticaret Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Ciddi risk taşıyan ürün: Risk değerlendirmesine dayanması ve ürünün normal ve öngörülebilir kullanımının dikkate alınması kaydıyla, zarara yol açabilecek bir tehlikenin gerçekleşme olasılığı ve zararın ciddiyetinin büyüklüğünün birlikte ele alınması neticesinde, riskin etkisi kısa vadede ortaya çıkmayan vakalar da dâhil olmak üzere, yetkili kuruluşların acil müdahalesini gerektiren risk taşıyan ürünü,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Dağıtıcı: Ürünü tedarik zincirinde yer alarak piyasada bulunduran, imalatçı veya ithalatçı dışındaki gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Geri çağırma: Nihai kullanıcının elinde bulunan ürünün iktisadi işletmeciye geri getirilmesini amaçlayan her türlü önlemi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Güvenli ürün: Kullanım süresi, hizmete sunulması, kurulumu, kullanımı, bakımı ve gözetimine ilişkin talimatlara uygun ve normal kullanım koşullarında kullanıldığında risk taşımayan veya sadece ürünün kullanımına özgü asgari risk taşıyan ve insan sağlığı ve güvenliği için gerekli düzeyde koruma sağlayan ürünü,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İktisadi işletmeci: İmalatçı, yetkili temsilci, ithalatçı, dağıtıcı veya ilgili teknik düzenleme kapsamında ürünlerin imalatına, piyasada bulundurulmasına veya hizmete sunulmasına ilişkin sorumluluğu olan diğer gerçek veya tüzel kişileri,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>İmalatçı: Ürünü imal ederek veya ürünün tasarımını veya imalatını yaptırarak kendi isim veya ticari markası ile piyasaya arz eden gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>İthalatçı: Ürünü ithal ederek piyasaya arz eden gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Nihai kullanıcı: Bir ürünü ticaret, iş, zanaat ve mesleki faaliyetler dışında tüketici olarak ya da sanayi veya mesleki faaliyeti için elinde bulunduran, Türkiye’de yerleşik veya ikamet eden gerçek ya da tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Piyasa gözetimi ve denetimi: Ürünlerin ilgili teknik düzenlemesi veya genel ürün güvenliği mevzuatında belirtilen gereklere uygun olmalarını sağlamak ve bu mevzuat kapsamında yer alan kamu yararını korumak amacıyla yetkili kuruluşlar tarafından yürütülen faaliyetleri ve alınan tedbirleri,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Piyasada bulundurma: Ürünün ticari faaliyet yoluyla, bedelli veya bedelsiz olarak dağıtım, tüketim veya kullanım için piyasaya sağlanmasını,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Piyasadan çekme: Tedarik zincirindeki ürünün piyasada bulundurulmasını önlemeyi amaçlayan her türlü tedbiri,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Piyasaya arz: Ürünün piyasada ilk kez bulundurulmasını,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Risk: Zarara yol açacak bir tehlikenin gerçekleşme olasılığı ile bu zararın ciddiyetinin büyüklüğünün birleşimini,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Risk taşıyan ürün: Ürünün kullanım amacı veya kullanım süresi ve uygulanabildiği durumlarda hizmete sunulması, kurulum ve bakım gereklilikleri de dâhil olmak üzere, ürünün normal ve öngörülebilir kullanım koşulları çerçevesinde, ilgili teknik düzenleme ya da genel ürün güvenliği mevzuatı kapsamında korunan insan sağlığı ve güvenliğini, iş yerinde sağlık ve güvenliği, tüketicilerin korunmasını, çevreyi, kamu güvenliğini ve diğer kamu yararlarını, makul ve kabul edilebilir değerlendirilen ölçünün ötesinde olumsuz etkileme olasılığı bulunan ürünü,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Teknik düzenleme: İdari hükümler de dâhil olmak üzere, ürünün niteliğini, işleme veya üretim yöntemlerini veya bunlarla ilgili terminoloji, sembol, ambalajlama, işaretleme, etiketleme veya uygunluk değerlendirme işlemlerini tek tek veya birkaçını ele alarak belirleyen uyulması zorunlu mevzuatı,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Uygunluk değerlendirme kuruluşu: Kalibrasyon, test, belgelendirme ve muayene dâhil olmak üzere, uygunluk değerlendirme faaliyeti gerçekleştiren kuruluşu,</template>
        </mvz-bent>
        <mvz-bent no="ö">
          <template>Uygunluk değerlendirmesi: Ürün, süreç, hizmet, sistem, kişi veya kuruluşa ilişkin belirli şartların yerine getirilip getirilmediğini gösteren süreci,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>Uygunluk işareti: Ürünün ilgili teknik düzenlemeye uygun olduğunu gösteren işareti,</template>
        </mvz-bent>
        <mvz-bent no="r">
          <template>Uygunsuzluk: Ürünün ilgili teknik düzenlemeye veya genel ürün güvenliği mevzuatına uygun olmama halini,</template>
        </mvz-bent>
        <mvz-bent no="s">
          <template>Ürün: Her türlü madde, müstahzar veya eşyayı,</template>
        </mvz-bent>
        <mvz-bent no="ş">
          <template>Yetkili kuruluş: Ürünlere ilişkin teknik düzenlemeleri hazırlayan, yürüten veya ürünleri denetleyen kamu kuruluşunu,</template>
        </mvz-bent>
        <mvz-bent no="t">
          <template>Yetkili temsilci: İmalatçının bu Kanun ve ilgili diğer mevzuat kapsamındaki bazı yükümlülüklerini onun adına yerine getirmek üzere imalatçı tarafından yazılı şekilde görevlendirilen Türkiye’de yerleşik gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Teknik Düzenlemeler, Ürün Güvenliği, Ürün Sorumluluğu Tazminatı, İktisadi İşletmecilerin Yükümlülükleri ve İzlenebilirlik">
    <mvz-madde no="4" başlık="Teknik düzenlemeler">
      <mvz-fıkra no="1">
        <template>Ürünlerin, teknik düzenlemesine uygun olması zorunludur. Bu hüküm, kullanılmış olmakla birlikte değişiklik yapılarak piyasaya tekrar arz edilen veya arz edilmesi hedeflenen ürünler ile Avrupa Birliği üyesi ülkeler dışındaki ülkelerden ithal edilen eski ve kullanılmış ürünlere de uygulanır. Teknik düzenlemesine uygun olmayan ürünler, uygunsuzlukları giderilmeden piyasaya arz edilemez, piyasada bulundurulamaz veya hizmete sunulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen hususlarda düzenlemeler yapmaya, sınırlamalar getirmeye ve istisnalar tanımaya Cumhurbaşkanı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ürünlere ilişkin teknik düzenlemeler, yetkili kuruluşça aşağıdaki usul ve esaslar gözetilerek hazırlanır, yürürlüğe konulur veya uygulanır:</template>
        <mvz-bent no="a">
          <template>Yetkili kuruluş, teknik düzenlemeleri insan sağlığının, can ve mal güvenliğinin, çevrenin, hayvan ve bitki sağlığının veya tüketicinin korunması ya da enerji verimliliğinin sağlanması gibi bir kamu yararını gözeterek, rekabeti engellemeyecek şekilde ve gözettiği amacın ötesine geçmeyen, uygun, orantılı, açık ve uygulanabilir olacak şekilde hazırlar ve/veya uygular.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yetkili kuruluş, hazırladığı teknik düzenlemeleri taslak aşamasındayken Bakanlığın ve ilgili tüm tarafların görüşüne açar, mevzuatın ve uluslararası yükümlülüklerin gerektirdiği hallerde ilgili uluslararası taraflara bildirir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yetkili kuruluş, ilgili teknik düzenlemelerin gerektirdiği hallerde ürünlerde engellilerin erişebilirliğine yönelik önlemleri alır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Avrupa Birliği teknik mevzuatına uyum alanında yetkili kuruluşlar arasında koordinasyon Bakanlık tarafından sağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Ürün güvenliği">
      <mvz-fıkra no="1">
        <template>Ürünün güvenli olması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Teknik düzenlemenin insan sağlığı ve güvenliği ile ilgili hükümlerine uygun ürün, aksi ispatlanana kadar güvenli kabul edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Teknik düzenlemenin bulunmadığı veya insan sağlığı ve güvenliğine ilişkin hükümler içermediği durumlarda, bir ürünün güvenli olup olmadığının değerlendirilmesi genel ürün güvenliği mevzuatına göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Ürün sorumluluğu tazminatı">
      <mvz-fıkra no="1">
        <template>Ürünün, bir kişiye veya bir mala zarar vermesi halinde, bu ürünün imalatçısı veya ithalatçısı zararı gidermekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İmalatçı veya ithalatçının sorumlu tutulabilmesi için, zarar gören tarafın uğradığı zararı ve uygunsuzluk ile zarar arasındaki nedensellik bağını ispat etmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ürünün sebep olduğu zarardan birden fazla imalatçı veya ithalatçının sorumlu olması halinde, bunlar müteselsilen sorumlu tutulurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İmalatçı veya ithalatçıyı üründen kaynaklanan tazminat sorumluluğundan kurtaran ya da bu sorumluluğu azaltan sözleşmelerin ilgili maddeleri hükümsüzdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ürünün sebep olduğu zarar nedeniyle ödenecek maddi ve manevi tazminat miktarının belirlenmesinde 11/1/2011 tarihli ve 6098 sayılı Türk Borçlar Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Tazminat talebi için zamanaşımı süresi, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten itibaren üç yıl ve her halde zararın doğduğu tarihten itibaren on yıldır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Diğer kanunlardaki tazminat sorumluluğuna ilişkin hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="İmalatçının yükümlülükleri">
      <mvz-fıkra no="1">
        <template>İmalatçı;</template>
        <mvz-bent no="a">
          <template>Piyasaya ancak teknik düzenlemesine veya 5 inci maddenin üçüncü fıkrasında belirtilen genel ürün güvenliği mevzuatına uygun ürünleri arz eder.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Mevzuatın gerektirdiği hallerde teknik dosyayı tanzim eder, uygunluk değerlendirme işlemini yapar veya yaptırır, uygunluk beyanını veya uygunluğu gösteren diğer belgeleri düzenler ve uygunluk işaretini ürüne koyar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Uygunluk değerlendirmesine ilişkin teknik dosyayı ve belgeleri teknik düzenlemede belirtilen süre, süre belirtilmediği hallerde ürünün piyasaya arz edildiği tarihten itibaren en az on yıl boyunca muhafaza eder.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Ürünün ilgili kurallara uygunluğunun seri üretim boyunca da sürdürülmesi için gerekli önlemleri alır, ürünün tasarımı veya niteliğindeki değişiklikler ile uygun olduğunu beyan ettiği kurallardaki değişiklikleri takip eder ve gereğini yapar.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Taşıdıkları muhtemel risklerle orantılı olarak, piyasada bulundurulan ürünlerinden numune alarak test eder, inceleme yapar, şikâyetlerin, uygun olmayan ve geri çağrılan ürünlerin kaydını tutar ve yaptığı izleme faaliyeti hakkında dağıtıcıları bilgilendirir.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Ürünün mevzuatın gerektirdiği model, parti ve seri numarası veya ayırt edilmesini sağlayacak diğer bilgileri kolayca görülebilir ve okunabilir şekilde taşımasını temin eder. Ürünün boyut veya doğasının buna elverişli olmadığı durumlarda ise bu bilgilerin ürünün ambalajında veya ürüne eşlik eden bir belgede yer almasını sağlar.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Mevzuatın gerektirdiği hallerde ismini, kayıtlı ticari unvanını veya markasını ve kendisine ulaşılabilecek açık adresini ürünün üzerinde, bunun mümkün olmadığı durumlarda ürünün ambalajında veya ürüne eşlik eden bir belgede belirtir.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Ürünün taşıyabileceği risklere karşı gereken tedbirleri alır ve bunlardan sakınabilmeleri için nihai kullanıcılara gerekli bilgileri sağlar.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Ürün veya ambalajının üzerinde veya ürüne eşlik eden belgelerde yer alan (g) bendinde belirtilen bilgilerin ve montaj, kullanım ve bakım talimatları ile güvenlik kurallarının Türkçe olmasını sağlar.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Piyasaya arz etmiş olduğu bir ürünün uygun olmadığını öğrendiği veya bilmesinin gerektiği hallerde ürünü uygun duruma getirmek ve gerektiğinde ürünün piyasaya arzını durdurmak, ürünü piyasadan çekmek veya geri çağırmak için gerekli düzeltici önlemleri ivedilikle alır. Ürünün risk taşıdığı durumlarda özellikle sağlık ve güvenlik bakımından risk teşkil eden hususlar ile alınan düzeltici önlemler ve sonuçları hakkında ayrıntılı bir şekilde ve ivedilikle yetkili kuruluşu bilgilendirir.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Piyasaya arz ettiği ürünlerin taşıdığı risklerin ortadan kaldırılması amacıyla yapılan faaliyetlerde yetkili kuruluşun talimatlarını yerine getirir ve ürünlerin uygunluğunu gösteren gerekli tüm bilgi ve belgeleri yetkili kuruluşa Türkçe veya yetkili kuruluşun kabul edeceği diğer bir dilde sağlar.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>İlgili teknik düzenlemenin gerektirdiği hallerde ve öngördüğü usuller çerçevesinde resmî kayıt işlemlerini yapar veya yaptırır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Numunenin imalatçı dışındaki gerçek veya tüzel kişiden alınması durumunda numune bedeli, imalatçı tarafından numunenin alındığı gerçek veya tüzel kişiye ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Yetkili temsilcinin yükümlülükleri">
      <mvz-fıkra no="1">
        <template>İmalatçı, devrettiği yetki ve görevlerin mahiyetini, varsa koşullarını ve sınırlarını yazılı olarak ve açık bir biçimde belirlemek suretiyle yetkili temsilci atayabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yetkili temsilci, imalatçının birinci fıkrada belirtilen şekilde kendisine verdiği ve mevzuatın sınırlamadığı görevleri yerine getirir. Ancak, görevlendirme belgesinde belirtilmese dahi, yetkili temsilci teknik düzenlemenin gerektirdiği ve ürünün uygunluğunu gösteren belgeleri teknik düzenlemede belirtilen süre, süre belirtilmediği hallerde ürünün piyasaya arz edildiği tarihten itibaren en az on yıl boyunca muhafaza eder ve yetkili kuruluşun talebi halinde Türkçe veya yetkili kuruluşun kabul edeceği diğer bir dilde sağlar. Ürünün taşıdığı risklerin ortadan kaldırılması amacıyla yapılan faaliyetlerde yetkili kuruluşun talimatlarını ivedilikle yerine getirir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="İthalatçının yükümlülükleri">
      <mvz-fıkra no="1">
        <template>İthalatçı;</template>
        <mvz-bent no="a">
          <template>Piyasaya ancak teknik düzenlemesine veya 5 inci maddenin üçüncü fıkrasında belirtilen genel ürün güvenliği mevzuatına uygun ürünleri arz eder.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ürünü piyasaya arz etmeden önce, ürünün uygunluk işareti veya işaretlerini taşıdığını, ürüne gerekli belgelerin eşlik ettiğini ve imalatçının 7 nci maddenin birinci fıkrasının (b), (e) ve (f) bentlerinde düzenlenen yükümlülükleri yerine getirdiğini teyit eder.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Ürünün uygun olmadığını bildiği veya bilmesinin gerektiği durumlarda, uygun hale getirilmeden ürünü piyasaya arz edemez ve ürünün risk taşıdığı her durumda imalatçıyı ve yetkili kuruluşu bilgilendirir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Mevzuatın gerektirdiği hallerde ismini, kayıtlı ticari unvanını veya markasını ve kendisine ulaşılabilecek açık adresini ürünün üzerinde, bunun mümkün olmadığı durumlarda ürünün ambalajında veya ürüne eşlik eden bir belgede belirtir. Bu yükümlülüğü, imalatçı tarafından belirtilen zorunlu veya ürün güvenliğine ilişkin bilgilerin görünürlüğünü engellemeden yerine getirir.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Ürünün taşıyabileceği risklere karşı gereken tedbirleri alır ve bunlardan sakınabilmeleri için nihai kullanıcılara gerekli bilgileri sağlar.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Ürün veya ambalajının üzerinde veya ürüne eşlik eden belgelerde yer alan (d) bendinde belirtilen bilgilerin ve montaj, kullanım ve bakım talimatları ile güvenlik kurallarının Türkçe olmasını sağlar.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Ürün kendi sorumluluğu altındayken, depolama ve nakliye şartlarının ürünün teknik düzenlemesine veya 5 inci maddenin üçüncü fıkrasında belirtilen genel ürün güvenliği mevzuatına uygunluğuna halel gelmemesini sağlar.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Taşıdıkları muhtemel risklerle orantılı olarak piyasada bulundurulan ürünlerinden numune alarak test eder, inceleme yapar, şikâyetlerin, uygun olmayan ve geri çağrılan ürünlerin kaydını tutar ve yaptığı izleme faaliyetleri hakkında imalatçı ve dağıtıcıları bilgilendirir.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Piyasaya arz etmiş olduğu bir ürünün uygun olmadığını öğrendiği veya bilmesinin gerektiği hallerde ürünü uygun duruma getirmek ve gerektiğinde ürünün piyasaya arzını durdurmak, ürünü piyasadan çekmek veya geri çağırmak için gerekli düzeltici önlemleri ivedilikle alır. Ürünün risk taşıdığı durumlarda özellikle sağlık ve güvenlik bakımından risk teşkil eden hususlar ile alınan düzeltici önlemler ve sonuçları hakkında ayrıntılı bir şekilde ve ivedilikle yetkili kuruluşu bilgilendirir.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Mevzuatın gerektirdiği ve ürünün uygunluğunu gösteren belgelerin bir örneğini teknik düzenlemede belirtilen süre, süre belirtilmemiş ise ürünün ithal edildiği tarihten itibaren en az on yıl boyunca yetkili kuruluşun talebi halinde Türkçe veya yetkili kuruluşun kabul edeceği diğer bir dilde sağlar.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Piyasaya arz ettiği ürünlerin taşıdığı risklerin ortadan kaldırılması amacıyla yapılan faaliyetlerde yetkili kuruluşun talimatlarını yerine getirir.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>İlgili teknik düzenlemenin gerektirdiği hallerde ve öngördüğü usuller çerçevesinde resmî kayıt işlemlerini yapar veya yaptırır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Numunenin ithalatçı dışındaki gerçek veya tüzel kişiden alınması durumunda numune bedeli ithalatçı tarafından numunenin alındığı gerçek veya tüzel kişiye ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Dağıtıcının yükümlülükleri">
      <mvz-fıkra no="1">
        <template>Dağıtıcı;</template>
        <mvz-bent no="a">
          <template>Ürünü piyasada bulundurmadan önce, ürünün uygunluk işareti veya işaretlerini taşıdığını, uygunluğu gösteren belgelere sahip olduğunu, talimatların ve güvenlik kurallarının ürüne Türkçe olarak eşlik ettiğini ve imalatçının 7 nci maddenin birinci fıkrasının (e) ve (f) bentlerinde, ürün ithal ise ayrıca ithalatçının 9 uncu maddenin birinci fıkrasının (ç) bendinde düzenlenen yükümlülükleri yerine getirdiğini doğrular, ürünün veya ambalajının üzerine koyacağı etiket, fiyat, uyarı ve benzeri bilgilerin imalatçının veya ithalatçının koyduğu zorunlu veya ürün güvenliğine ilişkin bilgilerin görünürlüğünü engellemesini önler.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ürünün uygun olmadığını bildiği veya bilmesinin gerektiği durumlarda, uygun hale getirilmeden ürünü piyasada bulunduramaz ve ürünün risk taşıdığı her durumda imalatçı veya ithalatçıyı ve yetkili kuruluşu ivedilikle bilgilendirir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Ürün kendi sorumluluğu altındayken, depolama ve nakliye koşullarının ürünün teknik düzenlemesine veya 5 inci maddenin üçüncü fıkrasında belirtilen genel ürün güvenliği mevzuatına uygunluğuna halel gelmemesini sağlar.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Piyasada bulundurduğu ürünün uygun olmadığını öğrendiği veya bilmesinin gerektiği hallerde, ürünü uygun duruma getirmek, piyasadan çekmek veya geri çağırmak için gerekli düzeltici önlemlerin imalatçı veya ithalatçı tarafından alındığını teyit eder ve ürünün risk taşıdığı durumlarda imalatçı veya ithalatçıyı ve özellikle sağlık ve güvenlik bakımından risk teşkil eden hususlar ile alınan düzeltici önlemler ve sonuçları hakkında yetkili kuruluşu ivedilikle bilgilendirir.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Piyasada bulundurduğu ürünlerin taşıdığı risklerin ortadan kaldırılması amacıyla yapılan faaliyetlerde ilgili iktisadi işletmeci ile iş birliği yapar, ürünlerin uygunluğunu gösteren tüm bilgi ve belgeleri yetkili kuruluşa sunar ve yetkili kuruluşun talimatlarını ivedilikle yerine getirir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="İmalatçının yükümlülüklerinin ve ürün sorumluluğu tazminatının diğer iktisadi işletmecilere uygulandığı durumlar">
      <mvz-fıkra no="1">
        <template>Ürünü kendi isim veya ticari markası altında piyasaya arz eden veya piyasada bulundurulan ürünü teknik düzenlemesine veya 5 inci maddenin üçüncü fıkrasında belirtilen genel ürün güvenliği mevzuatına uygunluğunu etkileyecek şekilde değiştiren ithalatçılar ile dağıtıcılar bu Kanun kapsamında imalatçı sayılırlar ve imalatçının 7 nci maddede belirtilen yükümlülüklerini yerine getirmekle sorumludurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ürünün imalatçısı, yetkili temsilcisi veya ithalatçısının tespit edilemediği durumlarda, yetkili kuruluşça yapılan bildirimin kendisine tebliğ edildiği tarihten itibaren on iş günü içinde imalatçı, yetkili temsilci veya ithalatçısının isim ve irtibat bilgilerini, bu bilgilere sahip değil ise tedarik zincirinde yer alan bir önceki iktisadi işletmecinin isim ve irtibat bilgilerini bildirmeyen dağıtıcı, bu Kanun kapsamında imalatçı olarak kabul edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Üründen kaynaklanan tazminat sorumluluğuna ilişkin olarak ürünün imalatçısı, yetkili temsilcisi veya ithalatçısının belirlenemediği durumlarda, zarara uğrayan kişiye bu iktisadi işletmecilerin isim ve irtibat bilgilerini, bu bilgilere sahip değil ise tedarik zincirinde yer alan bir önceki iktisadi işletmecinin isim ve irtibat bilgilerini bu talebin kendisine tebliğ edildiği tarihten itibaren on iş günü içinde bildirmeyen dağıtıcı, bu Kanun kapsamında imalatçı gibi tazminattan sorumlu tutulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="İzlenebilirlik">
      <mvz-fıkra no="1">
        <template>İktisadi işletmeciler, tedarik zincirinde yer alan bir önceki ve varsa bir sonraki iktisadi işletmecinin ismi, ticari unvanı veya markası ve irtibat bilgileri ile ürünün takibini kolaylaştıracak diğer bilgilerin kaydını düzenli bir şekilde tutar, ürünü piyasaya arz ettikleri veya piyasada bulundurmaya başladıkları tarihten itibaren en az on yıl boyunca muhafaza eder ve yetkili kuruluşun talebi halinde sunarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen yükümlülükler; bir ürünü elektronik ortamda piyasaya arz eden veya bulunduranlar, başkalarına ait iktisadi ve ticari faaliyetlerin yapılmasına elektronik ticaret ortamını sağlayan aracı hizmet sağlayıcıları ile radyo ve televizyon gibi medya hizmet sağlayıcıları için de geçerlidir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Uygunluk İşaretleri ve Belgeleri, Uygunluk Değerlendirme İşlemleri ve Kuruluşları">
    <mvz-madde no="13" başlık="Uygunluk işaretleri ve belgeleri, uygunluk değerlendirme işlemleri">
      <mvz-fıkra no="1">
        <template>Ürünün piyasaya arz edilebilmesi, piyasada bulundurulabilmesi veya hizmete sunulabilmesi için teknik düzenlemede bu ürüne ilişkin öngörülen zorunlu uygunluk değerlendirme işlemlerinin tamamlanması ve olumlu sonuçlanması gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir teknik düzenlemenin gerektirdiği ürünlere ilişkin her türlü uygunluk işareti ve belgesinin, test raporlarının ve diğer belgelerin gerçeğe aykırı şekilde düzenlenmesi, kullanılması, tahrif veya taklit edilmesi yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Uygunluk işaretleri, sadece teknik düzenlemelerin bu işaretlerin konulmasını öngördüğü ürünlerde kullanılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ürünün uygunluğunu gösteren işaret ve belgeler, uygulama mevzuatında veya teknik düzenlemede belirtilen usul ve esaslara uygun olarak düzenlenir ve kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ürüne, uygunluk işaretinin anlamı ve şekli hakkında üçüncü tarafları yanıltacak başka işaretler veya betimlemeler konulamaz. Diğer her türlü işaret, ürüne ancak uygunluk işaretinin görünebilirliğini, okunabilirliğini ve anlamını bozmayacak şekilde konulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Uygunluk değerlendirme kuruluşları ve onaylanmış kuruluşlar">
      <mvz-fıkra no="1">
        <template>Yetkili kuruluş, teknik düzenlemenin gerektirdiği hallerde, uygulama mevzuatında ve teknik düzenlemede belirtilen usul ve esaslar çerçevesinde onaylanmış kuruluşlar dâhil olmak üzere uygunluk değerlendirme kuruluşlarını görevlendirebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Görevlendirme olup olmadığına bakılmaksızın uygunluk değerlendirme kuruluşları, teknik düzenleme kapsamındaki faaliyetlerinden dolayı bu teknik düzenlemeyi yürüten yetkili kuruluşa karşı sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Uygunluk değerlendirme kuruluşları;</template>
        <mvz-bent no="a">
          <template>Uygulama mevzuatında ve teknik düzenlemelerde yer alan usul ve esaslara uyar; bağımsız, tarafsız ve şeffaf bir şekilde hizmet verir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Faaliyetleri ile ilgili her türlü belge ve kaydı, teknik düzenlemede belirtilen süre, süre belirtilmediği durumlarda ise bu belge ve kayıtların düzenlendiği tarihten itibaren en az on yıl boyunca muhafaza eder ve yetkili kuruluşun talebi halinde sunar.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yetkili kuruluş, yetki alanına giren uygunluk değerlendirme kuruluşlarının uygulama mevzuatında ve teknik düzenlemelerde belirtilen nitelikleri karşılamaya devam edip etmediğini, sorumlulukları yerine getirip getirmediğini ve faaliyetleri öngörülen koşullara uygun olarak sürdürüp sürdürmediğini izler ve denetler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yetkili kuruluş, dördüncü fıkrada belirtilen izleme ve denetleme faaliyetinin sonuçlarının olumsuz çıkması halinde, bu uygunsuzlukların düzeltilmesi için uygunluk değerlendirme kuruluşuna acil haller dışında makul bir süre verebilir. Yetkili kuruluş, nihai kararını verene kadar uygunluk değerlendirme kuruluşunun uygunsuzluğa konu faaliyetini askıya alabilir veya kısıtlayabilir. Yetkili kuruluş, verilen sürede uygunsuzluğun giderilmemesi halinde, uygunluk değerlendirme kuruluşunun teknik düzenleme kapsamındaki faaliyetlerini, uygunsuzlukla orantılı olarak süreli veya süresiz kısıtlayabilir veya tamamen durdurabilir; bu uygunluk değerlendirme kuruluşu bir onaylanmış kuruluş ise bu statüsünü geri çekebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Uygunluk değerlendirme kuruluşlarından faaliyeti kısıtlanan, askıya alınan, faaliyetine son verilen veya kendi isteği ile faaliyetine son verenler, uygunluk değerlendirme işlemleri ile ilgili belge ve kayıtları, uygunluk değerlendirme işlemini devam ettirmek üzere başka bir uygunluk değerlendirme kuruluşuna veya yetkili kuruluşa teslim eder veya yetkili kuruluşun talebi halinde sunmak üzere muhafaza eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Türkiye’de yerleşik uygunluk değerlendirme kuruluşlarının akreditasyonunu kamu kuruluşu olan ulusal akreditasyon kuruluşu yapar. Uygunluk değerlendirme kuruluşları, ulusal akreditasyon kuruluşunun akreditasyon hizmeti vermediği alanlarda Avrupa Birliği üyesi ülkelerin bu alanda akreditasyon hizmeti veren ulusal akreditasyon kuruluşlarına başvurabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Ürünlerin Denetimi ve Yetkili Kuruluşun Görev, Yetki ve Sorumlulukları">
    <mvz-madde no="15" başlık="Ürünlerin denetimine ilişkin genel usul ve esaslar">
      <mvz-fıkra no="1">
        <template>Yetkili kuruluş, yetki alanına giren ürünlerin teknik düzenlemelere veya 5 inci maddenin üçüncü fıkrasında belirtilen genel ürün güvenliği mevzuatına uygunluğunu doğrulamak amacıyla denetim yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen denetimin, ürünün piyasaya arzından nihai kullanıcıya ulaştığı aşamaya kadar piyasa gözetimi ve denetimi yoluyla yapılması esastır. Ancak, teknik düzenlemelerin gerektirdiği hallerde ve öngördüğü koşullarda denetim; ithalat, ihracat, montaj, hizmete sunum veya bir mal veya hizmet sağlanması sürecinde veya kullanım aşamasında da yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Denetim, yetkili kuruluşun görev ve sorumluluğundadır. Denetim yetkili kuruluş tarafından yapılır veya gerektiğinde bu görev, denetim yapma kapasitesine sahip diğer bir yetkili kuruluşa devredilebilir. Yetki devri, bu Kanunda düzenlenen yaptırımları uygulama ve önlemleri alma yetkisini de içerebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yetkili kuruluş, denetim görevini orantılılık ve tarafsızlık ilkelerine riayet ederek yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yetkili kuruluş, ürün denetiminin etkin ve hızlı yapılması için gerekli idari ve teknik yapıyı oluşturur, plan ve program hazırlar ve gerektiğinde diğer yetkili kuruluşlarla iş birliği yapar. Yetkili kuruluşlar arasında ortaya çıkabilecek görüş ayrılıklarının giderilmesine ilişkin koordinasyon, Bakanlık tarafından sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bir ürünün teknik düzenlemeye veya 5 inci maddenin üçüncü fıkrasında belirtilen genel ürün güvenliği mevzuatına uygunluğunu gösteren belgelere veya işaretlere sahip olması, yetkili kuruluşun, ürünü bu Kanunun gerektirdiği şekilde denetlemesini, uygun olmayan ürün hakkında bu Kanunda belirtilen önlemleri almasını veya ilgililere yaptırım uygulamasını engellemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Denetlenen ürünün test ve/veya muayene sonucunda uygun olmadığının tespiti halinde numune, test veya muayene giderleri ve bunlara ilişkin diğer giderler imalatçı veya ithalatçı tarafından karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Dış ticarete konu ürünlerin uygunluk denetimlerine ilişkin usul ve esaslar Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Yetkili kuruluşun piyasa gözetimi ve denetiminde görev, yetki ve sorumlulukları">
      <mvz-fıkra no="1">
        <template>Yetkili kuruluş piyasaya arz edilmesi hedeflenen, piyasaya arz edilen, piyasada bulundurulan veya hizmete sunulan ürünleri; depoda, nakil aracında, iş yeri ve üretim tesisi de dâhil olmak üzere gerekli görülen yerlerde denetleyebilir ve iktisadi işletmecilerden denetime ilişkin gerek duyduğu belge, bilgi ve kayıtları isteyebilir.</template>

      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ürüne ilişkin uygunluk işareti veya teknik düzenlemenin gerektirdiği teknik dosya, etiket ve talimatların bulunmaması, eksik veya yetersiz olması veya yanlış kullanılması halinde yetkili kuruluş üçüncü fıkrada belirtilen risk değerlendirmesini yapmak için yeterli gerekçenin bulunduğunu varsayabilir. Bu durumda, yapacağı risk değerlendirmesinin sonucundan bağımsız olarak yetkili kuruluş, tespit ettiği bu fıkra kapsamındaki uygunsuzlukların giderilmesini, bunun gerçekleşmemesi halinde iktisadi işletmeciden bu Kanunda öngörülen önlemlerden uygun ve gerekli gördüklerinin alınmasını ister. Bu uygunsuzlukların devam etmesi halinde yetkili kuruluş, ürünün piyasaya arzının yasaklanması veya kısıtlanması için gerekli tüm önlemleri alır veya piyasada bulunan ürünün geri çağrılmasını veya piyasadan çekilmesini sağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ürünün ciddi risk taşıdığı haller dışında yetkili kuruluş, önlemlere ilişkin nihai kararı almadan önce iktisadi işletmeciye savunma yapabilmesi için on iş gününden az olmamak üzere makul bir süre verir. Yetkili kuruluş bu Kanun kapsamında aldığı önlem ve idari yaptırıma ilişkin kararını iktisadi işletmeciye bildirdiği tebligatta bu kararın dayandığı gerekçeleri, varsa çözüm önerilerini, yasal itiraz yollarını ve süre sınırlarını da belirtir.</template>

        <mvz-bent no="c">
          <template>Belli durumlarda veya belli kişiler bakımından risk taşıyabilecek ürünlerin; riskler hakkında uygun, açık ve kolayca anlaşılabilir Türkçe uyarılarla işaretlenmesi ve bu risklerin ürüne eşlik eden belgelerde yer alan montaj, kullanım ve bakım talimatları ile güvenlik kurallarında açıkça belirtilmesi veya bu ürünlerin piyasaya arzının uygunluğunu temin edecek ön koşullara tabi tutulması ve risk altındaki kişilerin riskler hakkında ivedilikle ve uygun şekillerde uyarılması,</template>

        </mvz-bent>
        <mvz-bent no="d">
          <template>Ciddi risk taşıyan ürünlerin piyasaya arzının ivedilikle durdurulması, piyasada bulundurulmasının önlenmesi, piyasadan çekilmesi ve geri çağrılması, dağıtıcıların bu kararlardan haberdar olmaları ve kararlara uymalarını sağlamak amacıyla gerekli tedbirlerin alınması ve ürünün taşıdığı riskler hakkında nihai kullanıcıların uyarılması, ürünlerin uygun koşullarda imhası veya işlevsiz hale getirilmesi, öneri ve teşhirinin durdurulması,</template>

    <mvz-madde no="21" başlık="İktisadi işletmeciyi sorumluluktan kurtaran haller">
      <mvz-fıkra no="1">
        <template>Piyasaya arz ettikleri, piyasada bulundurdukları veya hizmete sundukları ürünün uygun olmadığını tespit edip yetkili kuruluşun talebi ve uyarısı olmadan uygunsuzluğun giderilmesi ve riskin ortadan kaldırılması için ürünün geri çağrılması da dâhil olmak üzere gerekli tedbirleri kendiliğinden alan ve uygunsuzluğu tamamen gideren iktisadi işletmeciler için bu Kanunda düzenlenen idari yaptırımlar uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İmalatçı veya ithalatçı;</template>
        <mvz-bent no="a">
          <template>Ürünü piyasaya kendisinin arz etmediğini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Uygunsuzluğun dağıtıcının veya üçüncü bir tarafın ürüne müdahalesinden veya kullanıcıdan kaynaklandığını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Üründeki uygunsuzluğun, teknik düzenlemelere veya diğer zorunlu teknik kurallara uygun olarak üretilmesinden kaynaklandığını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ispatladığı takdirde bu Kanunda düzenlenen idari yaptırımlar uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İmalatçı veya ithalatçı, ikinci fıkrada belirtilen şartlardan birini ispatladığı takdirde, 6 ncı maddede belirtilen tazminat sorumluluğu kalkar. Zararın, üründeki uygunsuzluğun yanı sıra üçüncü bir kişinin fiili veya ihmalinden kaynaklanmış olması imalatçı veya ithalatçının 6 ncı maddede düzenlenen tazminat sorumluluğunu azaltmaz. Ancak, imalatçı veya ithalatçının üçüncü kişiye rücu hakkı saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Zararın, üründeki uygunsuzluğun yanı sıra zarar görenin veya zarar görenin sorumluluğundaki bir kişinin kusurundan kaynaklanmış olması halinde, imalatçı veya ithalatçının 6 ncı maddede düzenlenen tazminat sorumluluğu, hal ve şartlara göre azaltılabileceği gibi tamamen de kaldırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanunda belirtilen sorumluluklarını yerine getirip piyasadan çekilen ürünü teslim eden dağıtıcı, ürünün piyasadan çekilmesine yol açan sorunun giderilmesini imalatçı veya ithalatçıdan ister. İmalatçı veya ithalatçı, mümkün olması halinde ürünü uygun duruma getirir ve dağıtıcıya teslim eder. Ürünün işlevsiz hale getirilmesi veya imha edilmesinin gerektiği hallerde, imalatçı veya ithalatçı, dağıtıcıya imalatçı veya ithalatçının piyasaya arz ettiği satış değerinin ödenmesi veya ürünün teknik düzenlemesine uygun, güvenli ve eş değer bir ürünle değiştirilmesi seçeneklerinden birini sunar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Masrafların rücu edilmesi ve idari yaptırımlarda yetki ve itiraz">
      <mvz-fıkra no="1">
        <template>Bu Kanunda belirlenen idari yaptırımlar yetkili kuruluş tarafından uygulanır. İdari yaptırımların hangi makam veya kamu görevlilerince uygulanacağı yetkili kuruluş tarafından çıkarılan yönetmelik ile belirlenir. 15 inci maddenin yedinci fıkrası, 16 ncı maddenin dördüncü ve yedinci fıkraları ile 17 nci maddenin birinci fıkrası uyarınca yapılan masrafların yetkili kuruluş tarafından karşılanması halinde masraflar, masrafı yapan yetkili kuruluşça ilgili iktisadi işletmeciye genel hükümlere göre rücu edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun hükümlerine göre verilen idari yaptırım kararlarına karşı 6/1/1982 tarihli ve 2577 sayılı İdari Yargılama Usulü Kanunu hükümlerine göre idari yargı yoluna başvurulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Gizlilik, ticari sırlar ve şeffaflık">
      <mvz-fıkra no="1">
        <template>Yetkili kuruluş, bu Kanunu uygularken kişisel verilere dair, ticari sır niteliğindeki veya fikrî ve sınai mülkiyet hakkına ilişkin edindiği bilgilerin gizliliğini korumakla yükümlüdür. Ancak, insan sağlığı ve güvenliğinin gerektirdiği hallerde bu bilgilerin açıklanması bu kapsamda sayılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Uygulama mevzuatı">
      <mvz-fıkra no="1">
        <template>Teknik düzenlemelerin hazırlanmasına ilişkin usul ve esaslar ile Avrupa Birliği teknik mevzuatını uyumlaştırmak ve piyasa gözetimi ve denetimi yapmakla yetkili kuruluşların belirlenmesine ilişkin usul ve esaslar Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamında yer alan;</template>
        <mvz-bent no="a">
          <template>Piyasa gözetimi ve denetimi, “CE” işareti, uygunluk değerlendirme kuruluşları ve onaylanmış kuruluşlar ile bildirimlere ilişkin usul ve esaslar Cumhurbaşkanınca yürürlüğe konulan yönetmeliklerle,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Uygunluk değerlendirme yöntemleri, ticarette teknik engellerin önlenmesi, teknik mevzuat uyumu, elektronik ticarette piyasa gözetimi ve denetimi, genel ürün güvenliği ve bu Kanunun uygulanmasını ilgilendiren diğer hususlara ilişkin usul ve esaslar Bakanlık tarafından,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Yürürlükten kaldırılan Kanun">
      <mvz-fıkra no="1">
        <template>29/6/2001 tarihli ve 4703 sayılı Ürünlere İlişkin Teknik Mevzuatın Hazırlanması ve Uygulanmasına Dair Kanun yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mevzuatta 4703 sayılı Kanuna yapılan atıflar bu Kanuna yapılmış kabul edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Geçiş hükümleri" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>24 üncü maddede belirtilen düzenlemeler yürürlüğe konuluncaya kadar, 4703 sayılı Kanunun 14 üncü maddesinde belirtilen uygulama mevzuatı ile 4703 sayılı Kanuna dayanılarak yürürlüğe konulan teknik düzenlemelerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cumhurbaşkanınca yeni bir karar yürürlüğe konuluncaya kadar, dış ticarete konu ürünlerin uygunluk denetimlerine ilişkin 28/1/2013 tarihli ve 2013/4284 sayılı Bakanlar Kurulu Kararı ile yürürlüğe konulan Teknik Düzenlemeler Rejimi Kararı hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinden bir yıl sonra yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Cumhurbaşkanı yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
