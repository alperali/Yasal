  <mvz-künye tür="kanun" no="1164" başlık="ARSA ÜRETİMİ VE DEĞERLENDİRİLMESİ HAKKINDA KANUN"
             tarih="29/4/1969" rgazete-tarih="10/5/1969" rgazete-sayı="13195"
             düstur-tertip="5" düstur-cilt="8" düstur-sayfa="1981" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç ve Görevler">
    <mvz-madde no="1" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; arsaların aşırı fiyat artışlarını önlemek üzere tanzim alış ve satışı yapmak; konut, sanayi, eğitim, sağlık ve turizm yatırımları ve kamu tesisleri için arazi ve arsa sağlamaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunda yazılı görevler Toplu Konut İdaresi Başkanlığı tarafından yürütülür. Bu Kanunda, diğer kanunlarda ve ilgili mevzuatta Arsa Ofisi Genel Müdürlüğüne yapılan atıflar Toplu Konut İdaresi Başkanlığına yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Genel Müdürlük;</template>
        <mvz-bent no="a">
          <template>Konut, sanayi, eğitim,sağlık ve turizm yatırımları ve çeşitli kamu tesisleri için anlaşma, devir, satınalma yolu ile ve benzeri şekillerde arazi ve arsa sağlamaya,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Arsa stoku ve tanzim satışları yapmaya,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sağladığı arazi ve arsaları olduğu gibi veya planlayarak, altyapı tesislerini kısmen veya tamamen ikmal ederek veya ettirerek ihtiyaç sahiplerine satmaya, kiralamaya, trampaya, irtifak hakkı tesis etmeye; kamu kurum ve kuruluşları eliyle pazarlamaya ve satmaya,  Genel Müdürlük mülkiyetinde olup, ihale suretiyle satılan, ancak yapılan satış işlemleri yargı kararları ile iptal edilerek kamu malına dönüştürülen, satışa konu arazi ve arsaların maliklerine; ihale bedellerinin güncelleştirilmiş değeri veya emsali değerdeki, Genel Müdürlük mülkiyetinde bulunan ya da Genel Müdürlükçe imkân dahilinde sağlanacak en yakın arazi ve arsalardan vermeye,</template>
        </mvz-bent>
        <mvz-bent no="d" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="e" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Konut, sanayi, eğitim, sağlık ve turizm yatırımları ile kamu tesisleri yerleşme alanlarında arazi ve arsa alımı ve altyapı inşaatları için tahsis edilen fonlardan kaynak sağlamaya,</template>
        </mvz-bent>
        <mvz-bent no="g" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="h" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Toplu Konut İdaresi Başkanlığı tarafından satış ve kira sözleşmesine konu edilen taşınmazlar hariç olmak üzere, Toplu Konut İdaresi Başkanlığının mülkiyetinde bulunan arsa ve arazilerin, gerçek veya tüzel kişilerce işgali halinde; ecrimisil istemeye, ecrimisilin tahsiline ve taşınmazın tahliyesine ilişkin işlemleri uygulamaya veya Milli Emlak Genel Müdürlüğü eliyle uygulatmaya,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel Müdürlük, Bu Kanun amaçları çerçevesinde kullanacağı taşınmaz malların harita, imar, uygulama ve parselasyon planlarını yapar veya yaptırır. Planlar, 3194 sayılı İmar Kanunu hükümlerine göre işlem yapılarak onanır ve kesinleşir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="4" başlık="" durum="mülga">
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Mali Hükümler">
    <mvz-madde no="5" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="6" başlık="">
      <mvz-fıkra no="1">
        <template>Arsa alımı ve satımı, harita, planlama kamu tesis ve hizmetlerinin yapılması, diğer döner sermaye işlemleri 1050 sayılı Muhasebe-i Umumiye Kanunu ile 2886 sayılı Devlet İhale Kanununa tabi değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, döner sermaye ile yapılacak işlerden doğan gelir ve giderler için, mali yılın bitiminden itibaren iki ay içinde Arsa Ofisi Genel Müdürlüğünce bir bilanço düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>832 sayılı Sayıştay Kanununun 40 ıncı maddesi uyarınca hazırlanan bilanço ve eki cetveller ile belgeler Sayıştaya, bilanço ve eklerinin birer örneği ise Maliye Bakanlığına aynı süre içinde gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Arsa ile İlgili Hükümler">
    <mvz-madde no="7" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="8" başlık="">
      <mvz-fıkra no="1">
        <template>Hazine, belediye, özel idare ve Vakıflar İdaresi satışa çıkaracakları arazi ve arsaları satış muamelesine tevessül etmeden önce (Arsa Ofisine) bildirmekle mükelleftir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="">
      <mvz-fıkra no="1">
        <template>Arsa Ofisi Genel Müdürlüğü; konut, sanayi, eğitim, sağlık ve turizm yatırımları ile kamu tesisleri için gerçek ve tüzel kişilere ait arazi ve arsaları ve bunlar içerisinde veya üzerinde bulunan muhdesatı Bakan onayı ile kamulaştırmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="">
      <mvz-fıkra no="1">
        <template>Arsa Ofisi Genel Müdürlüğü; konut, sanayi, eğitim, sağlık ve turizm yatırımları ve kamu tesisleri için planlamayı öngördüğü ve tahdidini yaparak ilgili tapu idarelerine bildirmiş bulunduğu sahalardaki arsa ve arazinin satışlarında şuf'a hakkını haizdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu sahalardaki arsa ve arazinin satışları tapu daireleri tarafından 15 gün içinde Arsa Ofisine bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tapu dairelerine yapılacak bildiri üzerine Arsa Ofisi en geç 30 gün zarfında şüf'a hakkını kullanacağını bildirmediği ve bu süre içinde ödenmiş satış bedeli ile her türlü harç ve masrafları peşin olarak, malik adına yatırmadığı takdirde, şüf'a hakkının kullanılmasından vazgeçmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>30 günlük süre içinde ödenmiş satış bedeli ile her türlü harç ve masrafların yatırılmasını mütaakıp, tapu dairelerince re'sen eski satışın iptali ile yeni maliki adına tescil işlemi yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu halde tapu idareleri re'sen şüf'a hakkındaki şerhi kaldırmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="">
      <mvz-fıkra no="1">
        <template>Arsa Ofisi Genel Müdürlüğü, sattığı veya devrettiği arsa ve arazinin amacına uygun kullanılması için tapu kayıtlarına, satış şartlarına uygun alt yapı, yapı veya tesis yapılmadıkça üçüncü kişilere satış, devir, temlik yapılamayacağı ve haczedilemeyeceği hususunda şerhler koydurmaya ve/veya bu amaca yönelik sözleşmeler yapmaya yetkilidir. Bu maddenin uygulanmasına ilişkin esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="">
      <mvz-fıkra no="1">
        <template>Kamu tüzel kişiliğini haiz kuruluşlarla kamu kurumları arsa ihtiyaçlarını Arsa Ofisi Genel Müdürlüğüne bildirerek Ofis eliyle karşılamak zorundadırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, vaki talepleri Arsa Ofisince dört ay içinde karşılanamadığı veya bu müddete kadar karşılanamayacağı daha önce yazı ile bildirildiği takdirde, talep olunan arsalar için bu zorunluluk ortadan kalkar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıda sözü geçen kurum ve kuruluşlara Hazineden veya diğer kaynaklardan çeşitli kanunlarla bedelsiz olarak intikal edecek arazi ve arsalar ile, belediyelere 1580, 6785, 6830 sayılı kanunlar ve bunların ek ve tadilleri uyarınca hibe, mübadele, anlaşma yolu ve benzeri şekillerde sağlanacak yerler birinci fıkra hükümlerine tabi değildir. Bu kurum ve kuruluşlar, bu şekilde sağladıkları arazi ve arsaları, ölçekli krokilerini, cins, miktar ve diğer vasıflarını açıklamak, kullanma maksat ve şekillerini belirtmek suretiyle en geç 6 ay içerisinde Arsa Ofisi Genel Müdürlüğüne bildirmek zorundadırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanun gereğince Arsa Ofisi Genel Müdürlüğü tarafından kamulaştırılan, satın alınan, planlanan veya çeşitli kamu hizmet ve tesisleri yapılarak değerlendirilen sahalar, bunlar içinde ve civarındaki binalı ve binasız diğer arazi ve arsaların değer artışlarının vergilendirmede dikkate alınmasını sağlamak üzere, Ofisçe Maliye Bakanlığına bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Çeşitli Hükümler">
    <mvz-madde no="14" başlık="">
      <mvz-fıkra no="1">
        <template>Kamu tüzel kişiliğini haiz kuruluşlar ile kamu kurumları, Ofisin görevleri ile ilgili işlerde gerekli bilgileri vermek zorundadırlar. Bu işlerin gerektirdiği giderler Ofisçe karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="">
      <mvz-fıkra no="1">
        <template>Arsa Ofisi Genel Müdürlüğü, konut, sanayi ve turizm bölgeleri, konut veya sanayi siteleri veya diğer kamu tesisleri meydana getirmek istiyen kamu tüzel kişiliğini haiz kuruluşlar, kamu kurumları ve özel hukuk tüzel kişileri ile araştırma, inceleme ve proje hazırlama konularında teknik işbirliği yapabilir, lüzum gördüğü yerlerde Maliye Bakanlığının muvafakatini almak şartiyle, bu kanunun uygulanması için belediyelerle ortaklık kurabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ortaklık esasları ve ilgili sair hususlar hazırlanacak yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="">
      <mvz-fıkra no="1">
        <template>Arsa Ofisi Genel Müdürlüğünün görev ve yetkileri ile yapılacak satış, alınan avanslarla edinilen taşınmaz malların ilgililere intikal ettirilmesi, kiraya verme ve irtifak hakkı tesisleriyle tazminat takdirleri, satış ve devir almalar, harcamalar, taşınmaz mal veya hizmet maliyetlerinin hesabı, amortisman, kar ve nizami faiz paylarının tayini, hesap usulleriyle diğer idari, mali ve teknik işlemlerin nasıl yürütüleceği hususları yönetmelikte belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="">
      <mvz-fıkra no="1">
        <template>Arsa Ofisi Genel Müdürlüğünün bütün malları Devlet malı hükmündedir. Bunlar aleyhine suç işliyenler Devlet malları aleyhine suç işliyenler gibi cezalandırılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="">
      <mvz-fıkra no="1">
        <template>Arsa Ofisi Genel Müdürlüğü, her türlü idari ve kazai ihtilaflarda husumete ehildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mahkemelerde ve icra dairelerince Genel Müdürlük lehine hükmedilip, tahsil olunan vekalet ücretlerinin tevzi ve tediyesinde 1389 sayılı Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="20" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Ofis, ürettiği veya üreteceği arsalar karşılığında menkul kıymet ihraç edebilir. İhraç edilecek menkul kıymetlerin şekli, ihracı, halka arzı, menkul kıymetler borsaları veya bankalar aracılığı ile satışı konularında Sermaye Piyasası Kanunu ve ilgili mevzuat hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu şekilde çıkarılacak menkul kıymetler, 3/10/1983 gün ve 91 sayılı Menkul Kıymetler Borsaları Hakkındaki Kanun Hükmünde Kararnamenin 10 uncu maddesinin 2 numaralı bendi uyarınca Maliye Bakanlığının talebi üzerine borsa kotuna alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Ofisce üretilen arsaların maliyet ve satış bedelleri arasındaki farkın %20 sini geçmemek kaydıyla, arsaların alt yapı tesislerinin yapımında kullanılmak kaydıyla belediyelere ödeme yapılabilir. Bu konuda, il, ilçe, belde ve bölgeler itibariyle farklı oranlar belirlemeye Maliye Bakanlığı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Ek" durum="mülga">
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>28.12.1960 tarihli ve 189 sayılı Kanun kapsamında bulunanlar ile her hangi bir kamu hizmetine tahsis edilmiş arazi ve arsalar hariç olmak üzere Cumhurbaşkanının onayı ile belirlenen arsa üretim alanlarında bulunan Hazineye ait taşınmazlar ve Hazine adına tescil edilecek taşınmazların mülkiyeti Toplu Konut İdaresi Başkanlığına bedelsiz olarak devredilir. Kamu hizmetlerine ayrılan yerler ile Maliye Bakanlığınca değişik ihtiyaçlarla talep edilen taşınmazlar bedelsiz olarak Hazineye iade edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 2 nci maddesinin birinci fıkrasının (ı) bendi kapsamında alınacak olan ecrimisiller ve taşınmazın tahliyesi hakkında 8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanununun 75 inci maddesine göre işlem yapılır ve tahsil edilen tutarların, %50’si genel bütçeye gelir kaydedilir ve %50’si tahsilatı takip eden ayın sonuna kadar Toplu Konut İdaresi Başkanlığına aktarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>(30/11/1989 tarih ve 392 sayılı KHK’nin hükmü olup, 2/6/1994 tarih ve 538 sayılı KHK’nin 10 uncu maddesi ile madde numarası teselsül ettirilmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Kadroları ve görev unvanları değişenler veya kaldırılanlar yeni bir kadroya atanıncaya kadar durumlarına uygun işlerde görevlendirilirler ve bu süre içinde eski kadrolarına ait aylık, ek gösterge ve diğer haklarını almaya devam ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Ekli (1)sayılı cetvelde yer alan kadrolar ihdas edilerek 190 sayılı Kanun Hükmünde Kararnamenin eki (1) sayılı cetvelin Arsa Ofisi Genel Müdürlüğü bölümüne serbest kadro olarak eklenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici" durum="iptal">
    </mvz-madde>
    <mvz-madde no="21" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanunu Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
