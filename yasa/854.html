  <mvz-künye tür="kanun" no="854" başlık="DENİZ İŞ KANUNU"
             tarih="20/4/1967" rgazete-tarih="29/4/1967" rgazete-sayı="12586"
             düstur-tertip="5" düstur-cilt="6" düstur-sayfa="1849" />
    
  <mvz-madde no="1" başlık="Kanun kapsamı">
    <mvz-fıkra no="1">
      <template>Bu kanun denizlerde, göllerde ve akarsularda Türk Bayrağını taşıyan ve yüz ve daha yukarı grostonilatoluk gemilerde bir hizmet akti ile çalışan gemiadamları ve bunların işverenleri hakkında uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Aynı işverene ait gemilerin grostonilatoları toplamı yüz veya daha fazla olduğu veyahut işverenin çalıştırdığı gemiadamı sayısı 5 veya daha fazla bulunduğu takdirde birinci bent hükmü uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu kanunun uygulanmasında; sandal, mavna, şat, salapurya gibi olanlar da (gemi) sayılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Cumhurbaşkanı, ekonomik ve sosyal gerekler bakımından bu kanun hükümlerini yukardaki bentlerin kapsamı dışında kalan gemilerle gemiadamlarına ve bunların işverenlerine kısmen veya tamamen teşmile yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yukardaki bentlerde yazılı gemilerin bu kanun kapsamına alınmaları sebebiyle yapılabilecek itirazlar Çalışma Bakanlığı tarafından incelenerek karara bağlanır. Bu itirazlar kanunun uygulanmasını durduramaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="İşveren, gemiadamı, kaptan ve işveren vekilinin tarifi">
    <mvz-fıkra no="1">
      <template>Bu kanunun uygulanmasında,</template>
      <mvz-bent no="A">
        <template>Gemi sahibine veya kendisinin olmıyan bir gemiyi kendi adına ve hesabına işleten kimseye “işveren” denir.</template>
      </mvz-bent>
      <mvz-bent no="B">
        <template>Bir hizmet aktine dayanarak gemide çalışan kaptan, zabit ve tayfalarla diğer kimselere “gemiadamı” denir.</template>
      </mvz-bent>
      <mvz-bent no="C">
        <template>Gemiyi sevk ve idare eden kimseye veya zorunlu sebeplerle görevi başında bulunmaması halinde ona vekalet eden kimseye “kaptan” denir.</template>
      </mvz-bent>
      <mvz-bent no="Ç">
        <template>Kaptan veya işveren adına ve hesabına harekete yetkili olan kimseye “işveren vekili” denir.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İşveren vekilinin bu sıfatla gemiadamlarına karşı muamele ve taahhütlerinden doğrudan doğruya işveren sorumludur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Saklı hükümler">
    <mvz-fıkra no="1">
      <template>Türk Ticaret Kanununun deniz ticaretinden bahseden dördüncü kitabındaki kaptan ile işveren arasındaki ilişkilere ait hükümler saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Yabancı gemiadamları">
    <mvz-fıkra no="1">
      <template>Bu kanun hükümleri, mütekabiliyet esaslarına göre Türk gemiadamlarına aynı mahiyette haklar tanıyan devletlerin uyruğunda olup bu kanun kapsamına giren gemilerde çalışan gemiadamlarına bu uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Yazılı akit">
    <mvz-fıkra no="1">
      <template>Hizmet akti işveren veya işveren vekiliyle gemiadamı arasında yazılı olarak iki nüsha yapılır ve taraflardan her birine birer nüsha verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Yazılı aktin şekli">
    <mvz-fıkra no="1">
      <template>Bu kanuna göre yapılacak yazılı akitlerde aşağıdaki hususların bulunması gerekir:</template>
      <mvz-bent no="1.">
        <template>İşverenin adı ve soyadiyle ikametgah adresi,</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>Gemiadamının adı, soyadı, doğum tarihi ve yeri, sicil numarası ve ikametgah adresi,</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Gemiadamının çalışacağı geminin ismi, sicil numarası, grostonilatosu ve kaydedildiği sicil dairesi (Gemiadamının aynı işverenin muhtelif gemilerinde çalışması ihtimali mevcutsa, bu hizmet aktinde ayrıca belirtilir.)</template>
      </mvz-bent>
      <mvz-bent no="4.">
        <template>Aktin yapıldığı yer ve tarih,</template>
      </mvz-bent>
      <mvz-bent no="5.">
        <template>Gemiadamının göreceği iş,</template>
      </mvz-bent>
      <mvz-bent no="6.">
        <template>Gemiadamının hizmete başlayacağı tarih ve yer,</template>
      </mvz-bent>
      <mvz-bent no="7.">
        <template>Hizmet aktinin belli bir süre için yapılmış olup olmadığı, belli bir süre için yapılmış ise süresi veya sefer üzerine ise hangi sefer olduğu,</template>
      </mvz-bent>
      <mvz-bent no="8.">
        <template>Kararlaştırılan ücret esası ile miktarı,</template>
      </mvz-bent>
      <mvz-bent no="9.">
        <template>Ücretin ödeme zamanı ve yeri ile zorunlu tutulan işverenler için gemiadamının ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakının ödeneceği banka özel hesap numarası,</template>
      </mvz-bent>
      <mvz-bent no="10.">
        <template>Avans şartları,</template>
      </mvz-bent>
      <mvz-bent no="11.">
        <template>Diğer iş şartları,</template>
      </mvz-bent>
      <mvz-bent no="12.">
        <template>Tirimciler ve ateşçiler ile yapılacak hizmet akitlerinde 25/5/1959 gün ve 7292 sayılı kanunla onanan sözleşmenin özeti.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Belirli süre veya sefer için akit">
    <mvz-fıkra no="1">
      <template>Hizmet akti belirli bir süre veya sefer için yahut süresiz olarak yapılabilir.</template>
      <mvz-bent no="I.">
        <template>Belirli bir süre için yapılmış hizmet akti bu sürenin bitiminde sona erer. Hizmet akti gemi seyir halinde iken sona ererse akit, geminin ilk limana varmasına ve güvenlik altına alınmasına kadar devam eder.</template>
      </mvz-bent>
      <mvz-bent no="II.">
        <template>Belirli sefer için yapılmış hizmet akti, akitte yazılı seferin sonunda geminin vardığı limanda yükünü boşaltmasıyla sona erer.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Akit süresinin uzaması">
    <mvz-fıkra no="1">
      <template>Belirli bir sefer için yapılmış olan hizmet aktinin sonunda gemiadamı işveren veya işveren vekilinin muvafakatiyle işe devam eder ve gemi de sefere çıkarsa, hizmet akti bu sefer süresince uzatılmış sayılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Belirli bir süre için yapılmış olan hizmet aktinin sonunda gemiadamı işveren veya işveren vekilinin muvafakatiyle işe devam ederse hizmet akti, aynı süre için uzatılmış sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Resim ve harçtan muafiyet">
    <mvz-fıkra no="1">
      <template>Gemiadamıyla işveren veya işveren vekili arasında yapılacak hizmet akitleri, her türlü resim ve harçtan muaftır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Deneme süresi">
    <mvz-fıkra no="1">
      <template>Süresi belirli olmayan hizmet akitlerinde deneme süresi en çok bir aydır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu süre içinde taraflar hizmet aktini bildirimsiz ve tazminatsız bozabilirler. Ancak gemiadamının çalıştığı günler için ücret hakkı saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="Çalışma ve kimlik karnesi">
    <mvz-fıkra no="1">
      <template>Mülga</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="Çalışma belgesi">
    <mvz-fıkra no="1">
      <template>İşinden ayrılan gemiadamına işveren veya işveren vekili tarafından işinin çeşidinin ne olduğunu ve süresini gösteren bir belge verilir. Bu belgeye gemiadamı isterse, kendisinin durumu ve davranışlariyle, çalışmasının ne yolda olduğu da ayrıca yazılır. İşveren veya işveren vekilinin belgedeki imzası, gemiadamı dilerse bağlama limanındaki liman reisliği tarafından onaylanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kamu hizmeti gören idarelere yahut kamu yararına yardımcı derneklere bağlı gemilerden çıkan gemiadamının aldığı belgeler hakkında yukarıki onay hükmü uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İşveren veya işveren vekili, gemiadamının istediği belgeyi vermemekte direnirse veyahut belgeye gemiadamı için doğru olmayan yazılar yazarsa, gemiadamının yahut yeni işine girdiği işverenin isteği üzerine, bağlama limanındaki liman reisliğince yapılacak inceleme sonucunu gösteren bir belge gemiadamına veya yeni işverene verilir. Liman reisliği tarafından yapılacak inceleme bir haftada bitirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kamu hizmeti gören idarelere bağlı gemilerden çıkan gemiadamına belge verilmek istenmez veyahut belgeye doğru olmayan yazılar yazılırsa, gerekli incelemenin yapılması için bu gemilerin bağlı oldukları makamlara başvurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Belgenin vaktinde verilmemesi veyahut belgede doğru olmayan yazılar bulunmasından zarar gören gemiadamı veyahut gemiadamını işe alan yeni işveren eski işverenden tazminat isteyebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu belgeler her türlü resim ve harçtan muaftır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="Engelli ve eski hükümlü çalıştırma">
    <mvz-fıkra no="1">
      <template>Bu kanunun kapsamına giren işveren veya işveren vekilleri, işyerlerinde İş Kanununun ve bununla ilgili yönetmeliğin bu konuda koyduğu hükümler, esaslar, ölçüler ve şartlara göre engelli ve eski hükümlü gemiadamı çalıştırmak zorundadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="Önelsiz fesih ve infisah">
    <mvz-fıkra no="1">
      <template>Süresi belirli olan veya olmayan yahut da sefer üzerine yapılan hizmet akti:</template>
      <mvz-bent no="I.">
        <template>İşveren veya işveren vekili tarafından:</template>
        <mvz-altbent no="a">
          <template>Gemiadamının herhangi bir limanda geminin hareketinden önce gemiye dönerek hizmete girmemesi veya gemiye hiç dönmemesi,</template>
        </mvz-altbent>
        <mvz-altbent no="b">
          <template>Gemiadamının gemide hizmet görmesinin tutukluluk, hapis veya gemide çalışmaktan menolunması gibi sebeplerle imkansız bir hal alması,</template>
        </mvz-altbent>
        <mvz-altbent no="c">
          <template>Gemiadamının işveren veya işveren vekiline karşı, kanuna, hizmet akitlerine sair iş ve çalışma şartlarına aykırı hareket etmesi,</template>
        </mvz-altbent>
        <mvz-altbent no="ç">
          <template>Gemiadamının işveren veya işveren vekiline karşı denizcilik kural ve teamüllerine veya ahlak ve adaba aykırı hareket etmesi,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="II.">
        <template>Gemiadamı tarafından:</template>
        <mvz-altbent no="a">
          <template>Ücretin kanun hükümleri veya hizmet akti gereğince ödenmemesi,</template>
        </mvz-altbent>
        <mvz-altbent no="b">
          <template>İşveren veya işveren vekilinin gemiadamına karşı, kanuna, hizmet akitlerine veya sair iş şartlarına aykırı hareket etmesi,</template>
        </mvz-altbent>
        <mvz-altbent no="c">
          <template>İşveren veya işveren vekilinin gemiadamına karşı denizcilik kural ve teamüllerine veya ahlak ve adaba aykırı hareket etmesi,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="III.">
        <template>İşveren, işveren vekili veya gemiadamı tarafından:</template>
        <mvz-altbent no="a">
          <template>Geminin herhangi bir sebeple 30 günden fazla bir süre seferden kaldırılması,</template>
        </mvz-altbent>
        <mvz-altbent no="b">
          <template>Gemiadamının herhangi bir sebeple sürekli olarak gemide çalışmasına engel bir hastalığa yakalanması veya engelli hâle gelmesi,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Hallerinde feshedilebilir.</template>
      </mvz-bent>
      <mvz-bent no="IV.">
        <template>Geminin kayba uğraması, terk edilmesi veya harp ganimeti ilan edilmesi veyahut Türk Bayrağından ayrılması hallerinde ise hizmet akti kendiliğinden bozulur.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="Fesih hakkını kullanma öneli">
    <mvz-fıkra no="1">
      <template>14 üncü maddede işveren, işveren vekili veya gemiadamına tanınan akti feshetmek yetkisi, iki taraftan birinin bu çeşit davranışlarda bulunduğunu öbür tarafın öğrendiği günden başlayarak (6) işgünü geçtikten ve herhalde fiilin vukuundan itibaren bir sene sonra kullanılamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu hallere dayanılarak akti süresi içinde fesheden taraf ayrıca mahkemeye başvurarak öbür taraftan bir tazminat istiyebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="Aktin çözülmesinde bildirim">
    <mvz-fıkra no="1">
      <template> </template>
      <mvz-bent no="A">
        <template>Süresi belirsiz hizmet akti, 14 üncü maddede yazılı durumlar dışında gemiadamının işe alınmasından itibaren altı ay geçmedikçe bozulamaz.</template>
      </mvz-bent>
      <mvz-bent no="B">
        <template>Süresi belirsiz hizmet akitlerinin çözülmesinden önce durumun diğer tarafa bildirilmesi gerekir.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Hizmet akti:</template>
        <mvz-altbent no="a">
          <template>İşi altı ay sürmüş olan gemiadamı için, bildirimin diğer tarafa yapılmasından başlayarak iki hafta sonra,</template>
        </mvz-altbent>
        <mvz-altbent no="b">
          <template>İşi altı aydan birbuçuk yıla kadar sürmüş olan gemiadamı için, bildirimin diğer tarafa yapılmasından başlayarak dört hafta sonra,</template>
        </mvz-altbent>
        <mvz-altbent no="c">
          <template>İşi birbuçuk yıldan üç yıla kadar sürmüş olan gemiadamı için bildirimin diğer tarafa yapılmasından başlayarak altı hafta sonra,</template>
        </mvz-altbent>
        <mvz-altbent no="ç">
          <template>İşi üç yıldan fazla sürmüş olan gemiadamı için, bildirimin diğer tarafa yapılmasından başlayarak sekiz hafta sonra,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Bozulmuş olur.</template>
      </mvz-bent>
      <mvz-bent no="C">
        <template>Öneller asgari olup toplu iş sözleşmesiyle veya hizmet akti ile artırılabilir.</template>
      </mvz-bent>
      <mvz-bent no="D">
        <template>Bildirme şartına uymayan taraf, yukarıda yazılı önellere uygun ücret tutarında tazminat ödemek zorundadır.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Gemiadamının sendikaya üye olması, şikayete başvurması gibi sebeplerle işinden çıkarılması hallerinde ve genel olarak hizmet aktini bozma hakkının kötüye kullanıldığını gösteren diğer durumlarda “B” bendinde yazılı önellere ait ücretlerin üç katı tutarı tazminat olarak ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Tarafların ayrıca tazminat isteme hakkı saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="Fesih hükmünün başlangıcı">
    <mvz-fıkra no="1">
      <template>14 ve 16 ncı maddelere göre hizmet aktinin feshinde fesih keyfiyeti, gemi seyir halinde ise, kararlaştırılmış limanda ve kararlaştırılmış liman değiştirildiği takdirde ilk uğrıyacağı limanda geminin emniyet altına alınmasına kadar uzatılmış sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="18" başlık="Feshin bildirilmesi">
    <mvz-fıkra no="1">
      <template>Hizmet aktinin işveren veya işveren vekili tarafından feshedilmesi halinde sebepleri ile birlikte gemiadamına yazılı olarak bildirilmesi şarttır. Bildirim imkanı olmıyan hallerde durum bir tutanakla tespit olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="19" başlık="Feshi kapsamayan hal">
    <mvz-fıkra no="1">
      <template>Geminin Türk Bayrağını taşıma hakkı bulunduğu sürece mülkiyetin kısmen veya tamamen herhangi bir şahsa geçmesi hizmet aktinin feshini gerektirmez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="20" başlık="Kıdem tazminatı">
    <mvz-fıkra no="1">
      <template>Bu Kanuna tabi gemi adamlarının hizmet akitlerinin:</template>
      <mvz-bent no="1.">
        <template>İşveren tarafından bu Kanunun 14 üncü maddesinin 1 inci bendinde gösterilen sebepler dışında,</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>Gemi adamı tarafından bu Kanunun 14 üncü maddesinin II nci ve III üncü bentleri uyarınca,</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Muvazzaf askerlik hizmeti dolayısıyla,</template>
      </mvz-bent>
      <mvz-bent no="4.">
        <template>Bağlı bulundukları kanunla kurulu kurum veya sandıklardan yaşlılık, emeklilik veya malullük aylığı, yahut toptan ödeme almak amacıyla,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Feshedilmesi veya gemi adamının ölümü veya 14 üncü maddenin 4 üncü bendi sebebiyle son bulması hallerinde gemi adamının işe başladığı tarihten itibaren hizmet akdinin devamı süresince her geçen tam yıl için işverence gemi adamına 30 günlük ücreti tutarında kıdem tazminatı ödenir. Bir yıldan artan süreler için de aynı oran üzerinden ödeme yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Gemi adamlarının kıdemleri hizmet akdinin devam etmiş veya fasılalarla yeniden akdedilmiş olmasına bakılmaksızın aynı işverenin bir veya değişik gemilerinde ve hizmetinde çalıştıkları süreler gözönüne alınarak hesaplanır. Geminin devir veya intikali yahut herhangi bir suretle bir işverenden başka bir işverene geçmesi veya başka bir yere nakli halinde gemiadamının kıdemi, işyeri veya işyerlerindeki hizmet akitleri sürelerinin toplamı üzerinden hesaplanır. 12/7/1975 tarihinden itibaren geminin devri veya herhangi bir suretle el değiştirmesi halinde işlemiş kıdem tazminatlarından her iki işveren sorumludur. Ancak işyerini devreden işverenlerin bu sorumlulukları gemiadamını çalıştırdıkları sürelerle ve devir esnasındaki gemiadamının aldığı ücret seviyesiyle sınırlıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>12/7/1975 tarihinden evvel işyeri devrolmuş veya herhangi bir suretle el değiştirmişse devir mukavelesinde aksine bir hüküm yoksa işlemiş kıdem tazminatlarından yeni işveren sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Gemiadamının birinci bendin 4 üncü fıkrası hükmünden faydalanabilmesi için aylık veya toptan ödemeye hak kazanmış bulunduğunu ve kendisine aylık bağlanması veya toptan ödeme yapılması için yaşlılık sigortası bakımından bağlı bulunduğu kuruma veya sandığa müracaat etmiş olduğunu belgelemesi şarttır. Gemiadamının ölümü halinde bu şart aranmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>T.C. Emekli Sandığı Kanunu ve Sosyal Sigortalar Kanununa veya yalnız Sosyal Sigortalar Kanununa tabi olarak sadece aynı ya da değişik kamu kuruluşlarında geçen hizmet sürelerinin birleştirilmesi suretiyle Sosyal Sigortalar Kanununa göre yaşlılık veya malullük aylığına ya da toptan ödemeye hak kazanan gemiadamına, bu kamu kuruluşlarında geçirdiği hizmet sürelerinin toplamı üzerinden son kamu kuruluşu işverenince kıdem tazminatı ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Yukarıda belirtilen kamu kuruluşlarında gemiadamının hizmet akdinin evvelce bu maddeye göre kıdem tazminatı ödenmesini gerektirmeyecek şekilde sona ermesi suretiyle geçen hizmet süreleri kıdem tazminatının hesabında dikkate alınmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Ancak, bu tazminatın T.C. Emekli Sandığına tabi olarak geçen hizmet süresine ait kısmı için ödenecek miktar, yaşlılık veya malullük aylığının başlangıç tarihinde T.C. Emekli Sandığı Kanununun yürürlükteki hükümlerine göre emeklilik ikramiyesi için öngörülen miktardan fazla olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Bu maddede geçen kamu kuruluşları deyimi genel, katma ve özel bütçeli idareler ile 468 sayılı Kanunun 4 üncü maddesinde sayılan kurumları kapsar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Aynı kıdem süresi için bir defadan fazla kıdem tazminatı veya ikramiye ödenmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Kıdem tazminatının hesaplanması, son ücret üzerinden yapılır. Sefer, parça başına akord, götürü veya yüzde usulü gibi ücretin sabit olmadığı hallerde son bir yıllık süre içinde ödenen ücretin o süre içinde çalışılan günlere bölünmesi suretiyle bulunacak ortalama ücret bu tazminatın hesabına esas tutulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="11">
      <template>Ancak, son bir yıl içinde işçi ücretine zam yapıldığı takdirde tazminata esas ücret, gemi adamının işten ayrılma tarihi ile zammın yapıldığı tarih arasında alınan ücretin aynı süre içinde çalışılan günlere bölünmesi suretiyle hesaplanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="12">
      <template>16 ncı maddenin (D) bendinde sözü geçen tazminat ile bu maddede yer alan kıdem tazminatına esas olacak ücretin hesabında 29 uncu maddenin birinci fıkrasında yazılı ücrete ilaveten gemiadamına sağlanmış olan para ve para ile ölçülmesi mümkün akdi ve kanundan doğan menfaatler de gözönünde tutulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="13">
      <template>Bu maddede belirtilen kıdem tazminatı ile ilgili 30 günlük süre hizmet akitleri veya toplu iş sözleşmeleri ile gemiadamı lehine değiştirilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="14">
      <template>Ancak, toplu sözleşmelerle ve hizmet akitleriyle belirlenen kıdem tazminatlarının yıllık miktarı, Devlet Memurları Kanununa tabi en yüksek Devlet memuruna 5434 sayılı T.C. Emekli Sandığı Kanunu hükümlerine göre bir hizmet yılı için ödenecek azami emeklilik ikramiyesini geçemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="15">
      <template>Gemiadamının ölümü halinde yukarıdaki hükümlere göre doğan tazminat tutarı, kanuni mirasçılarına ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="16">
      <template>Kıdem tazminatından doğan sorumluluğu işveren, özel şahıslara veya sigorta şirketlerine sigorta ettiremez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="17">
      <template>İşveren sorumluluğu altında ve sadece yaşlılık, emeklilik, malullük, ölüm ve toptan ödeme hallerine mahsus olmak kaydiyle Devlet veya kanunla kurulu kurumlarda veya % 50 hisseden fazlası Devlete ait bir bankada veya bir kurumda işveren tarafından kıdem tazminatı ile ilgili bir fon tesis edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="18">
      <template>Fon tesisi ile ilgili hususlar kanunla düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="21" başlık="Yurda iade">
    <mvz-fıkra no="1">
      <template>Hizmet aktinin, 14 üncü maddenin, I, II, III ve IV üncü bentlerine göre işveren veya işveren vekili veya gemiadamı tarafından yurt dışında feshi halinde, işveren veya işveren vekili gemiadamını hizmet aktinde başka hüküm yoksa, geminin bağlama limanına iade etmek ve gemiadamının iadeye ilişkin ve durumuna uygun yol, iaşe vesair zaruri masraflarını karşılamak veya ödemek zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Şu kadar ki, hizmet aktinin feshi 14 üncü maddenin 1 inci bendine ve II nci bendin (a) veya (b) fıkralarına göre yapılmış ise işveren veya işveren vekili yaptığı iade masraflarını gemiadamından yurtta isteyebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="22" başlık="Yabancı gemiadamının iadesi">
    <mvz-fıkra no="1">
      <template>Yabancı gemiadamiyle yapılan hizmet aktinde ayrı bir hüküm yoksa, işveren veya işveren vekili yabancı gemiadamını ikametgahının bulunduğu mahal limanına iade etmek zorundadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="23" başlık="Yurt içinde iade zorunluğu">
    <mvz-fıkra no="1">
      <template>Hizmet aktinin herhangi bir Türk limanında feshi halinde akitte başka hüküm yoksa, gemiadamının işveren veya işveren vekili tarafından 21 inci maddedeki ölçüler içinde bağlama limanına iadesi zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ancak, hizmet aktinin, 14 üncü maddesinin 1 inci bendine göre, feshi halinde bu madde hükmü uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="24" başlık="İade zorunluluğuna uymamak">
    <mvz-fıkra no="1">
      <template>İşveren veya işveren vekilinin 21 ve 23 üncü maddelerde belirtilen zorunluğa uymaması halinde, gemiadamı yurda dönmek için yaptığı durumuna uygun yol, iaşe vesair masrafları ve ayrıca 15 günlük ücreti tutarında bir tazminatı işveren veya işveren vekilinden isteyebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="25" başlık="İade hakkında yoksunluk">
    <mvz-fıkra no="1">
      <template>Yabancı bir memlekette işine son verilen veya hizmet akti yabancı bir memlekette sona eren gemiadamı o memlekette denizcilik işleriyle ilgili olsun veya olmasın, başka bir işverenle hizmet akti yaparsa eski işveren veya işveren vekilinin gemiadamını yurda iade zorunluluğu kalkar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>21, 22 ve 23 üncü maddelerde yazılı hallerde gemiadamı, işine son verilmesi yahutta hizmet aktinin sona ermesi gününden başlayarak bir hafta içinde yurda iade edilmesini istemezse işveren veya işveren vekili iade ile zorunlu tutulamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu kanunun 14 üncü maddesinin (1) numaralı bendinin (b) fıkrasında yazılı durumlar gemiadamına yüklenemiyecek sebepler altında doğmuşsa veya gemiadamı için hastalık vesair zorunlu sebepler meydana gelmişse bu maddenin ikinci fıkrasındaki bir haftalık süre, engellerin kalktığı günden itibaren başlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="26" başlık="İş süresi">
    <mvz-fıkra no="1">
      <template>Genel bakımdan iş süresi, günde sekiz ve haftada kırksekiz saattir. Bu süre haftanın iş günlerine eşit olarak bölünmek suretiyle uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İş süresi, gemiadamının işbaşında çalıştığı veya vardiya tuttuğu süredir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İşveren veya işveren vekili, gemiadamının vardiyalarını yemek ve dinlenme zamanlarını bir çizelge ile belirtmek ve bu çizelgeyi gemiadamlarının görebilecekleri bir yere asmak zorundadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="27" başlık="İstisnalar">
    <mvz-fıkra no="1">
      <template>Aşağıdaki işleri görenler bu kanunun iş sürelerine ilişkin hükümlerine tabi değildirler.</template>
      <mvz-bent no="1.">
        <template>Birden fazla kaptanın bulunduğu gemilerde birinci kaptan veya bu kanunun 2 nci maddesinin (C) fıkrasında yazılı olduğu şekilde kendisine vekalet eden kimse (kılavuz kaptanlar dahil),</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>Birden fazla makinistin bulunduğu gemilerde başmakinist,</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Doktor ve sağlık memurları,</template>
      </mvz-bent>
      <mvz-bent no="4.">
        <template>Hemşire ve hastabakıcılar,</template>
      </mvz-bent>
      <mvz-bent no="5.">
        <template>Asli görevleri can, mal ve gemi kurtarma olan kurtarma gemilerinde çalışan gemiadamları,</template>
      </mvz-bent>
      <mvz-bent no="6.">
        <template>Gemide kendi nam ve hesabına çalışanlar.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="28" başlık="Fazla saatlerle çalışma">
    <mvz-fıkra no="1">
      <template>Bu kanuna göre tespit edilmiş bulunan iş sürelerinin aşılması suretiyle yapılan çalışmalar, fazla saatlerde çalışma sayılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yapılacak fazla çalışmanın her saatine ödenecek ücret normal çalışma ücretinin saat başına düşen miktarı % 25 oranında artırılmak suretiyle bulunacak miktardan az olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Aşağıda yazılı haller fazla saatlerle çalışma sayılmaz.</template>
      <mvz-bent no="1.">
        <template>Geminin, gemideki şahısların veya gemi hamulesinin selameti için kaptanın yapılmasını zaruri gördüğü işler,</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>Gümrük, karantina vesair sıhhi formaliteler dolayısiyle yerine getirilmesinde zorunluluk bulunan ilave işler,</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Gemi seyir halinde veya limanda iken gemide yaptırılan  talimleri. Fazla saatlerle çalışmaları belgelemek üzere işveren veya işveren vekili noterden tasdikli ayrı bir defter tutmak zorundadır.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu defterde gemiadamına uygulanan zam nispetleriyle fazla çalışmanın yapıldığı gün ve o güne düşen miktarı ve gemiadamının hakettiği fazla çalışma ücreti gösterilir. Fazla saatlerle çalışma ücretlerinin asıl ücretler için hizmet aktinde gösterilmiş bulunan zaman, yer ve devrelerde, işveren veya işveren vekili tarafından gemiadamlarına tam olarak ödenmesi zorunludur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="29" başlık="Ücret">
    <mvz-fıkra no="1">
      <template>Ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkak gemiadamına işi karşılığında işveren veya işveren vekili tarafından ödenen bir meblağdır. Çalıştırılan gemiadamına ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakın özel olarak açılan banka hesabına yatırılmak suretiyle ödenmesi hususunda; tabi olduğu vergi mükellefiyeti türü, işletme büyüklüğü, çalıştırdığı gemiadamı sayısı, işyerinin bulunduğu il ve benzeri gibi unsurları dikkate alarak işverenleri veya işveren vekillerini zorunlu tutmaya, banka hesabına yatırılacak ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakın, brüt ya da kanuni kesintiler düşüldükten sonra kalan net miktar üzerinden olup olmayacağını belirlemeye Çalışma ve Sosyal Güvenlik Bakanlığı, Maliye Bakanlığı ve Hazine Müsteşarlığından sorumlu Devlet Bakanlığı müştereken  yetkilidir. Çalıştırdığı  gemiadamlarının  ücret,  prim,  ikramiye ve  bu nitelikteki her çeşit istihkakını özel olarak açılan banka hesapları vasıtasıyla ödeme zorunluluğuna tabi tutulan işverenler veya işveren vekilleri, gemiadamlarının ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakını özel olarak açılan banka hesapları dışında ödeyemezler. Gemiadamlarının ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakının özel olarak açılan banka hesaplarına yatırılmak suretiyle ödenmesine ilişkin diğer usûl ve esaslar anılan bakanlıklarca müştereken çıkarılacak yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakın, gemi adamına hizmet akdinde gösterilen yer ve devrelerde tam olarak ödenmesi, işverenler ile işveren vekillerinin birinci fıkra uyarınca zorunlu tutulduğu durumlarda ise özel olarak açılan banka hesabına yatırılması mecburidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ücret ödeme devresi bir aydan fazla olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Hizmet aktinin sona ermesi veya bozulması halinde işveren veya işveren vekili gemiadamının ücretini derhal ve tam olarak ödemek zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Haklı bir sebep olmaksızın işini yapmıyan gemiadamı, keyfiyet gemi jurnalina kaydedilmek ve jurnalı yoksa bir tutanakla belgelenmek şartiyle bu müddete ait ücretten mahrum edilir. Bu yüzden uğradığı zararın telafisi için işverenin tazminat istemek hakkı saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="30" başlık="Avans">
    <mvz-fıkra no="1">
      <template>İşveren veya işveren vekili, gemiadamlarının istekleri halinde kendilerine hizmet aktinde yazılı esaslara göre avans ödemeye zorunludur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="31" başlık="Ücret defteri">
    <mvz-fıkra no="1">
      <template>Her gemide, noterlikçe tasdikli bir ücret ödeme defteri tutulur. Şu kadar ki, liman seferi yapan gemilerde bu defter işveren bürosunda da tutulabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hizmet akitleri gereğince gemiadamlarına yapılacak her çeşit ödemelerin bu deftere kaydedilmesi ve kayıtların imza veya makbuzla belgelenmesi zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İstek halinde, bu kayıtların tasdikli bir örneği gemiadamına verilir. Bu muameleler her türlü resimden muaftır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Belgeye dayanmaksızın yapılan ödeme iddiaları muteber değildir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="32" başlık="Ücretin saklı kısmı">
    <mvz-fıkra no="1">
      <template>Gemiadamının ücretinin ayda 240 lirası haczedilemez veya başkasına devir ve temlik olunamaz. Ancak gemiadamının bakmak zorunda olduğu aile üyeleri için hakim tarafından takdir edilecek miktar bu paraya dahil değildir. Bu kayıtlamalar, nafaka borcu alacaklılarının haklarını kaldırmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="33" başlık="İşveren hesabına iaşe">
    <mvz-fıkra no="1">
      <template>Bu kanuna tabi gemilerde iaşe servisi kurulması zorunludur. Gemiadamları hizmete başladığı günden başlayarak hizmetten çıkış anına kadar gemide işveren tarafından bedelsiz iaşe olunurlar. İaşenin zorunlu sebeplerle uygulanamaması halinde işveren veya vekilince başkaca münasip bir iaşe imkanı sağlanır veya nakden ödeme usulü uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Limanlar içinde, şehir hatlarında, körfezlerde, göllerde ve akarsularda yolcu ve yük nakleden gemilerde, mavna, şat ve benzerlerinde iaşe servisi kurulması zorunlu değildir. Bu durumda işveren veya işveren vekili iaşe zorunluluğunu nakden ödemek suretiyle yerine getirir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="34" başlık="İkamet yeri sağlanması">
    <mvz-fıkra no="1">
      <template>Gemiadamlarına işe giriş gününden başlayarak işten çıkış gününe kadar rütbeleri, sayıları ve geminin büyüklüğüne uygun olarak ve yalnız kendileriyle eşyalarına ait olmak üzere gemi içinde ikamet yerleri bedelsiz olarak sağlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Herhangi bir zorunlu sebep yüzünden gemiadamlarının gemide ikametine imkan olmazsa işveren veya işveren vekili tarafından başka bir ikamet imkanı sağlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="35" başlık="İkamet yerleri ve iaşe hakkında">
    <mvz-fıkra no="1">
      <template>Bu Kanuna tabi gemilerde gemiadamları tahsis edilen yatma, dinlenme ve yemek yerleriyle gemide bulundurulacak ilaç, tıbbi alet ve malzeme ve revirlerde bulunması gereken şartlar ve gemiadamlarına verilecek iaşe maddelerinin ölçü ve nitelikleri bu şart ve niteliklerinden hangilerinin önemleri bakımından esasa ilişkin ve 1 inci derecede ve hangilerinin ise ikinci derecede sayılacakları ve iaşe ile ilgili ne çeşit kurullar kurulacağı ve bu kurulların görev ve yetkileri Çalışma ve Sosyal Güvenlik, Sağlık ve Sosyal Yardım ve Ulaştırma Bakanlıkları tarafından beraberce hazırlanacak bir yönetmelikte gösterilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Gemiadamı, işveren veya işveren vekili tarafından sağlanacak iaşenin yukarıda sözü geçen yönetmelikte gösterilen ölçülerden noksan olması halinde aradaki farkın bedelini veya iaşenin hiç verilmemesi halinde tamamının bedelini işveren veya işveren vekilinden isteyebilir. Şu kadar ki gemiadamının iddiasını, tazminde esas teşkil edecek iaşe ve şartlardaki aksamanın vuku bulduğu günde durumu işveren veya işveren vekiline veya kaptana bildirmesi şarttır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="36" başlık="İstisna">
    <mvz-fıkra no="1">
      <template>35 inci maddede sözü geçen yönetmelik hükümleri:</template>
      <mvz-bent no="a">
        <template>500 grostonilatodan daha küçük gemiler,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Balık avı ve benzeri işlerde çalışan gemiler,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Romorkörler,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Yüzer vinçler,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İçin uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="37" başlık="Asgari ücret">
    <mvz-fıkra no="1">
      <template>Gemiadamlarının asgari ücretleri, İş Kanununun ilgili maddesi gereğince tespit olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="38" başlık="Ücret kesintisi">
    <mvz-fıkra no="1">
      <template>İşveren veya işveren vekili toplu iş sözleşmesi ve hizmet akitlerinde gösterilmiş olan sebepler dışında gemiadamına ücret kesintisi cezası uygulayamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Gemiadamı ücretlerinden ceza olarak yapılacak kesintilerin gemiadamına hemen sebepleriyle bildirilmesi gerekir. Gemiadamı ücretlerinden bu yolda yapılacak kesintiler bir ayda üç gündelikten fazla olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Gemiadamlarından kesilen ücret kesimi cezaları hakkında İş Kanununun aynı konuya ilişkin diğer hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="39" başlık="Zarar karşılığı kesinti">
    <mvz-fıkra no="1">
      <template>Hizmet akitlerinde işveren veya işveren vekilinin tazminat karşılığı olarak gemiadamı ücretlerinden geçici olarak alıkoyacağı miktar on haftada eşit taksitlerle kesilmek üzere gemiadamının on günlük ücret tutarından fazla olamaz. Tazminat karşılığı bu kesintiler, bütün iş süresi içindir ve bundan bir miktar mahsubedilince yeniden aynı esaslar dairesinde kesinti yapılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tazminat kesintileri, mahsup yapılmasını gerektirecek bir zarar yapılmadan işten ayrılma hallerinde gemiadamına kesintisiz olarak geri verilir. Tazminat karşılığı geçici olarak alıkonulan paradan, mahsup yapılması gerektiği zaman gemiadamı isterse işveren kendisine mahsubun hangi esaslara göre yapıldığını anlatmak ve buna ait hesaplarla fatura ve başka belgeleri göstermek zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Tazminat karşılığı olarak alıkonulan paradan ancak o gemiadamı tarafından yapılan zarar için mahsup yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Tazminat kesintileri milli bankalardan birisine en geç üç ay içinde yatırılır. Banka faizleriyle diğer gelirleri işçilere iadesine kesinti ile birlikte ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="40" başlık="Yıllık ücretli izin">
    <mvz-fıkra no="1">
      <template>Aynı işveren emrinde veya aynı gemide bir takvim yılı içinde bir veya birkaç hizmet aktine dayanarak en az altı ay çalışmış olan gemiadamı, yıllık ücretli izine hak kazanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İzin süresi, altı aydan bir yıla kadar hizmeti olan gemiadamları için 15 günden ve bir yıl ve daha fazla hizmeti olanlar için yılda bir aydan az olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İzin işverenin uygun göreceği bir zamanda kullanılır. Bu haktan feragat edilemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bir aylık izin, tarafların rızasiyle aynı yıl içinde kullanılmak suretiyle ikiye bölünebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Gemiadamı, yıllık ücretli iznini yabancı bir memleket limanında veya hizmet aktinin yapılmış bulunduğu mahalden gayri bir yerde kullanmaya zorlanamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Gemiadamı, dilerse, işveren veya işveren vekilinden ücretli izne ilişkin olarak 7 güne kadar ücretsiz yol izni de isteyebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>(İptal)</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="41" başlık="Hafta tatili">
    <mvz-fıkra no="1">
      <template>Liman hizmeti ve şehir hattı gemilerinde gemiadamının haftada altı günden fazla çalıştırılması yasaktır. Bunlardan hafta tatili günü çalıştırılanlara, haftanın diğer bir gününde nöbetleşe izin verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="42" başlık="Hafta tatili ücreti">
    <mvz-fıkra no="1">
      <template>Bu kanunun uygulandığı gemilerde, haftanın tatilden önceki günlerinde sürekli olarak çalışmış bulunan gemiadamlarına çalışılmayan hafta tatili günü için işveren veya işveren vekili tarafından bir iş karşılığı olmaksızın ve ücret ödeme şekline bakılmaksızın bir gündelik tutarında ücret ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Evlenmelerde üç güne, ana ve babanın, karı ve kocanın, kardeş ve çocukların ölümünde iki güne kadar verilmesi gereken izin süreleriyle bir haftalık süre içinde kalmak üzere işveren tarafından verilen diğer izinler ve hekim raporlariyle verilen dinlenme ve hastalık izinleri, fiilen çalışılmış günler gibi hesaba katılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Zorlayıcı ve ekonomik bir sebep olmadan gemideki çalışmaların haftanın bir veya birkaç gününde işveren veya işveren vekili tarafından tatil edilmesi halinde, haftanın çalışılmayan günleri, ücretli hafta tatiline hak kazanmak için çalışılması gereken altı günün hesabında gözönünde tutulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Gemide işin bir haftadan fazla süre ile tatil edilmesini gerektiren zorlayıcı sebepler ortaya çıktığı zaman, bu süreye rastlayan hafta tatili ücreti, yarım gündelik tutarında ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kısa, yakın ve uzak sefer yapan gemilerde çalışan gemiadamlarına işveren veya işveren vekili tarafından geminin seferde bulunduğu müddete rastlayan hafta tatili günleri için yukarıdaki şartlar aranmaksızın ve bir iş karşılığı olmaksızın, ayrıca bir gündelik tutarında hafta tatili ücreti ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="43" başlık="Genel tatil ücreti">
    <mvz-fıkra no="1">
      <template>Bu kanun kapsamına giren gemilerde çalışan gemiadamlarına, 2739 sayılı Ulusal Bayram ve Genel Tatiller Kanunu ile anılan kanuna ek 3466 ve 221 sayılı kanunlarda yazılı bulunan ulusal bayram ve genel tatil günlerinde, bir iş karşılığı olmaksızın bir günlük ücreti tutarında tatil ücreti, ücret ödeme şekline bakılmaksızın ayrıca ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="44" başlık="Tatil ücretlerine girmeyen kısımlar">
    <mvz-fıkra no="1">
      <template>Fazla çalışma karşılığı olarak alınan ücret ve primlerle sosyal yardımlar, ulusal bayram, hafta tatili ve genel tatil günleri için verilen ücretlerin tespitinde hesaba katılmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="45" başlık="Geçici iş göremezlik">
    <mvz-fıkra no="1">
      <template>Gemiadamlarına, geçici iş göremezlik ödeneği ödenmesi gerektiği zamanlarda, geçici iş göremezlik süresine rastlıyan ulusal bayram, genel tatil ve hafta tatili ödenekleri, aynı ölçülerle ödeme yapan kurum ve sandıklar tarafından ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="46" başlık="Görevli ve yetkili mahkeme">
    <mvz-fıkra no="1">
      <template>Bu kanun kapsamına giren gemiadamlariyle bunların işveren veya işveren vekilleri arasında bu kanundan veya hizmet aktinden doğan davalar hakkında, 5521 sayılı kanun hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hizmet aktinde ayrıca bir hüküm yoksa dava, geminin bağlama limanında iş davalarını bakmaya yetkili mahkemede görülür.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="47" başlık="Bildirimler">
    <mvz-fıkra no="1">
      <template>Bildirimlerin ilgiliye yazılı olarak ve imza karşılığında yapılması gerekir. Bildirim yapılan kişi bunu imzalamazsa; durum o yerde tutanakla tespit edilir. Ancak, 7201 sayılı kanun kapsamına giren tebligat, anılan kanun hükümlerine göre yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="48" başlık="Saklı hükümler">
    <mvz-fıkra no="1">
      <template>Bu kanun hükümleri, gemiadamına daha elverişli hak ve menfaatler sağlayan kanun, toplu iş sözleşmesi, hizmet akti, örf ve adetlerden doğan haklara halel getirmez. Bu kanunun uygulanması sonucu olarak işverene düşen yükümlülükler, gemiadamlarının ücret vesair haklarının daha aşağı hadlere indirilmesine sebep tutulamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="49" başlık="Denetim ve teftiş">
    <mvz-fıkra no="1">
      <template>Bu kanun hükümlerinin gereği gibi yürütülmesini sağlamak üzere yapılması gereken takip, denetim ve teftişler Çalışma Bakanlığı tarafından yapılır. Bu konuda İş Kanununun iş hayatının denetim ve teftişine ilişkin hükümleri ve aynı kanunun bu hükümlerle ilgili ceza maddeleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="50" başlık="Ceza hükümleri">
    <mvz-fıkra no="1">
      <template> </template>
      <mvz-bent no="a">
        <template>Kanunun 5 inci maddesi gereğince gemi adamları ile yazılı akit yapmayan,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>(Mülga)</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>12 nci madde gereğince işinden ayrılan gemi adamına çalışma belgesi vermeyen, beş işçiye kadar (beş işçi dahil) işçi çalıştıran işveren veya vekili binbeşyüz Türk Lirası, daha fazla işçi çalıştıranlara üçbin Türk Lirası idarî para cezası verilir.</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>13 üncü madde gereğince engelli ve eski hükümlü gemi adamı çalıştırma ile ilgili kanun ve yönetmelik hükümlerine uymayan işveren veya işveren vekiline çalıştırmadığı her engelli veya eski hükümlü ve çalıştırmadığı her ay için ikibin Türk Lirası idarî para cezası verilir.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="51" başlık="">
    <mvz-fıkra no="1">
      <template> </template>
      <mvz-bent no="a">
        <template>20 nci madde gereğince gemiadamının kıdem tazminatını ödemeyen,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>28 inci madde gereğince gemiadamının fazla çalışma ücretini ödemeyen,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>29 uncu madde gereğince gemiadamının ücretini zamanında ve tam olarak ödemeyen,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>33 üncü maddede sözü geçen iaşe veya nakden ödeme zorunluluğuna uymayan,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>37 nci maddede sözü geçen asgari ücretten aşağı ücret ödeyen,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İşveren veya işveren vekili hakkında, bu durumda olan her gemiadamına karşılık, ödemediği meblağ veya temin ile mükellef olduğu iaşenin tekabül ettiği bedelin, bin Türk Lirasından aşağı olmamak üzere iki katı tutarında idarî para cezası verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template> </template>
      <mvz-bent no="a">
        <template>21 ve 23 üncü maddeler gereğince gemiadamının iade zorunluluğuna uymayan,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>26 ncı maddede gösterilen iş sürelerine uymayan,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İşveren veya işveren vekili hakkında bin Türk Lirası idarî para cezası verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Gemiadamının ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakını zorunlu tutulduğu halde özel olarak açılan banka hesabına yatırmayan işveren, işveren vekili hakkında, bu durumda olan her gemiadamı için bin iki yüz Yeni Türk Lirası idari para cezası verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Birinci fıkradaki fiiller yurt dışında işlendiği takdirde verilecek cezalar iki kat olarak uygulanır. 20 nci madde hükümlerine aykırı harekette bulunarak kıdem tazminatının öngörülen esaslar dışında veya saptanan miktar veya tavan aşılarak ödenmesi için emir veya talimat veren veya bu yolda hareket eden özel veya kamu kurumu veya kuruluşlarının yönetim kurulu üyeleri, genel müdür, müessese müdürü, muhasebe müdürü gibi yetkili sorumluları hakkında, fiil daha ağır cezayı gerektiren bir suç teşkil etmediği takdirde altı aydan iki seneye kadar hapis ve adlî para cezasına hükmolunur. Kanuna aykırı olarak fazla ödenen miktarın da ayrıca Hazine lehine re’sen tahsiline karar verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="52" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunun 35 inci maddesinde bahsi geçen yönetmelikte esasa müteallik ve birinci derecede olarak gösterilmiş bulunan vasıf ve şartlara riayet etmiyen işveren veya işveren vekili hakkında bin Türk Lirası idarî para cezası,</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İkinci derecede olarak gösterilen vasıf ve şartlara riayet etmiyen işveren veya işveren vekili hakkında beşyüz Türk Lirası idarî para cezası verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="53" başlık="">
    <mvz-fıkra no="1">
      <template> </template>
      <mvz-bent no="a">
        <template>Gemiadamı ücretlerinden 38 inci maddede gösterilen esaslar dışında para cezası uygulayan,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>39 uncu maddede sözü edilen zarar karşılığı kesintileri, anılan madde hükümlerine uymayarak yapan,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>40 ıncı madde gereğince gemiadamına yıllık ücretli izin vermeyen,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>41 inci madde gereğince gemiadamlarına hafta tatili izni uygulamayan,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>42 nci madde gereğince gemiadamına hafta tatili ücretini ödemeyen,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>43 üncü madde gereğince gemiadamına genel tatil ücretini ödemeyen,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İşveren veya işveren vekili hakkında beşyüz Türk Lirası idarî para cezası verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu kanundan doğan suçlara müteallik davalar, geminin bağlama limanındaki, sulh ceza mahkemelerinde görülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>(Mülga)</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="54" başlık="Yürürlükten kaldırılan kanunlar">
    <mvz-fıkra no="1">
      <template>10/3/1954 tarihli 6379 sayılı ve 25/5/1959 tarihli 7283 sayılı kanunlar yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="55" başlık="Yönetmelik">
    <mvz-fıkra no="1">
      <template>Bu kanunun 35 inci maddesinde sözü geçen yönetmelik çıkarılıncaya kadar, bu kanunla yürürlükten kaldırılan 6379 sayılı Kanunun 31 inci maddesine dayanılarak çıkarılmış bulunan 7/2/1958 tarihli ve 4/9968 sayılı Bakanlar Kurulu Kararnamesiyle yürürlüğe konulan (Gemiadamlarının Sağlık, İaşe ve İkamet Şartlarını Gösterir Tüzük) ün aynı konulara ilişkin hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bu Kanunda yazılı idarî para cezaları geminin bağlama limanının bulunduğu yer Çalışma ve Sosyal Güvenlik Bakanlığı bölge müdürünce verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>20 nci maddenin son fıkrası gereğince tesisi öngörülen Fona ilişkin kanun çıkarılıncaya kadar, kıdem tazminatının işveren tarafından doğrudan doğruya ödenmesine devam olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
