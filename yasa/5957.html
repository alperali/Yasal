  <mvz-künye tür="kanun" no="5957" başlık="SEBZE VE MEYVELER İLE YETERLİ ARZ VE TALEP DERİNLİĞİ BULUNAN DİĞER MALLARIN TİCARETİNİN DÜZENLENMESİ HAKKINDA KANUN"
             tarih="11/3/2010" rgazete-tarih="26/3/2010" rgazete-sayı="27533"
             düstur-tertip="5" düstur-cilt="49" />
    
  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, sebze ve meyveler ile arz ve talep derinliğine göre belirlenecek diğer malların ticaretinin kaliteli, standartlara ve gıda güvenilirliğine uygun olarak serbest rekabet şartları içinde yapılmasını, malların etkin şekilde tedarikini, dağıtımını ve satışını, üretici ve tüketicilerin hak ve menfaatlerinin korunmasını, meslek mensuplarının faaliyetlerinin düzenlenmesini, toptancı halleri ile pazar yerlerinin çağdaş bir sisteme kavuşturulmasını ve işletilmesini sağlamaktır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun, sebze ve meyveler ile arz ve talep derinliğine göre belirlenecek diğer malların her ne şekilde olursa olsun alımı, satımı ve devri ile toptancı halleri ve pazar yerlerinin kuruluş, işleyiş, yönetim ve denetimine ilişkin usul ve esasları, uygulanacak yaptırımları ve bakanlıklar, belediyeler ile diğer idarelerin görev, yetki ve sorumluluklarını kapsar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Tanımlar">
    <mvz-fıkra no="1">
      <template>Bu Kanunun uygulanmasında;</template>
      <mvz-bent no="a">
        <template>Bakanlık: Gümrük ve Ticaret Bakanlığını,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Belediye: 10/7/2004 tarihli ve 5216 sayılı Büyükşehir Belediyesi Kanunu ile 3/7/2005 tarihli ve 5393 sayılı Belediye Kanununa tabi belediyeleri,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Belediye toptancı hali: Belediyelerce kurulan toptancı hallerini,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Hal hakem heyeti: Üreticiler ile meslek mensupları arasında veya meslek mensuplarının kendi aralarında çıkan uyuşmazlıklara çözüm bulmak amacıyla il veya ilçe merkezlerinde oluşturulan heyetleri,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Hal rüsumu: Malları satın alanlarca toptan satış bedeli üzerinden ödenen meblağı,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>İlgili bakanlıklar: Çevre ve Şehircilik Bakanlığı ile Gıda, Tarım ve Hayvancılık Bakanlığını,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Komisyoncu: Malların toptan satışı amacıyla kendi adına ve başkası hesabına komisyon esası üzerinden çalışan meslek mensuplarını,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Künye: Malların üretim yerini, cinsini, miktarını, hangi üretici ve işletmeye ait olduğunu, varsa sertifika bilgilerini ve Bakanlık ile Gıda, Tarım ve Hayvancılık Bakanlığınca uygun görülecek diğer hususları ihtiva eden barkodlu etiketi veya bu bilgileri içeren belgeyi,</template>
      </mvz-bent>
      <mvz-bent no="ğ">
        <template>Mal: Ticarete konu sebze ve meyveler ile arz ve talep derinliğine göre belirlenecek et ve et ürünleri, süt ve süt ürünleri, su ve su ürünleri, bal ve yumurta gibi diğer gıda maddeleri ile kesme çiçek ve süs bitkilerini,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Meslek kuruluşları: Türkiye Odalar ve Borsalar Birliği, Türkiye Esnaf ve Sanatkârları Konfederasyonu ile Türkiye Ziraat Odaları Birliğini,</template>
      </mvz-bent>
      <mvz-bent no="ı">
        <template>Meslek mensubu: Malların ticaretiyle iştigal eden ilgili meslek odalarına kayıtlı kişileri,</template>
      </mvz-bent>
      <mvz-bent no="i">
        <template>Özel toptancı hali: Gerçek veya tüzel kişiler tarafından kurulan toptancı hallerini,</template>
      </mvz-bent>
      <mvz-bent no="j">
        <template>Pazar yerleri: Belediyelerce tespit edilecek yer ve günlerde kurulan üretici ve semt pazarlarını,</template>
      </mvz-bent>
      <mvz-bent no="k">
        <template>Pazarcı: Mallar ile belediyece müsaade edilen diğer gıda ve ihtiyaç maddelerini semt pazarlarında doğrudan tüketicilere perakende olarak satan meslek mensuplarını,</template>
      </mvz-bent>
      <mvz-bent no="l">
        <template>Perakendeci: Malları toptan temin ederek doğrudan tüketicilere perakende olarak satan meslek mensuplarını,</template>
      </mvz-bent>
      <mvz-bent no="m">
        <template>Semt pazarı: Üreticiler ve pazarcılar tarafından satışa sunulan mallar ile belediyece müsaade edilen diğer gıda ve ihtiyaç maddelerinin doğrudan tüketicilere perakende olarak satıldığı açık veya kapalı pazar yerlerini,</template>
      </mvz-bent>
      <mvz-bent no="n">
        <template>Toptancı hali: Bu Kanunda yer alan asgarî koşulları taşıyan projeler çerçevesinde belediyeler ile gerçek veya tüzel kişiler tarafından kurulan, malların ayrı ayrı yahut birlikte toptan alım ve satımı ile kaydının yapıldığı yerleri,</template>
      </mvz-bent>
      <mvz-bent no="o">
        <template>Toptancı hal konseyi: Malların ticaretinin bu Kanuna uygun olarak yapılmasının sağlanması hususunda görüş alışverişinde bulunmak ve alınacak önlemleri tespit etmek amacıyla ilgili kurum ve kuruluşların temsilcilerinden oluşan konseyi,</template>
      </mvz-bent>
      <mvz-bent no="ö">
        <template>Toptan satış miktarı: Bakanlıkça belirlenen mal miktarlarını,</template>
      </mvz-bent>
      <mvz-bent no="p">
        <template>Tüccar: Malların toptan satışı amacıyla kendi adına ve hesabına çalışan meslek mensuplarını,</template>
      </mvz-bent>
      <mvz-bent no="r">
        <template>Üretici: Malları üretenleri,</template>
      </mvz-bent>
      <mvz-bent no="s">
        <template>Üretici örgütü: Üreticilerce kurulan ve Bakanlıktan üretici örgütü belgesi almış olan tüzel kişilikleri,</template>
      </mvz-bent>
      <mvz-bent no="ş">
        <template>Üretici pazarı: Üreticilerin kendi ürettikleri malları perakende olarak doğrudan tüketicilere sattıkları açık veya kapalı pazar yerlerini,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>ifade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Toptancı hallerinin kurulması ve kapatılması">
    <mvz-fıkra no="1">
      <template>Toptancı halleri; imar planlarında belirlenmiş alanlarda, halin sınıfına, büyüklüğüne ve işlem hacmine göre yönetmelikle belirlenen müzayede, depolama, tasnifleme ve ambalajlama tesisleri ile laboratuvar ve soğuk hava deposu gibi diğer asgarî koşulları taşıyan projeler çerçevesinde gerçek veya tüzel kişiler ile belediye sınırları içinde belediyeler, büyükşehir belediye sınırları içinde büyükşehir belediyeleri tarafından kurulur. Gerçek veya tüzel kişiler tarafından toptancı hali kurulması ilgili belediyenin iznine tabidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Halin kuruluşu, en geç bir ay içinde ilgili belediye tarafından Bakanlığa bildirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Toptancı hallerinin kuruluşunda ve başka bir alana taşınmasında; malların arz ve talep derinliğinin bulunması, üretici ve tüketicinin korunması, toptancı hali sayısı ve bunların birbirlerine yakınlığı, üretici yoğunluğu ve tüketici piyasasının büyüklüğü, toptancı hali kurulacak yerin coğrafi konumu, mesken ve işyerlerine, gıda güvenilirliği bakımından risk oluşturan tesis ve benzeri yerlere uzaklığı ve ulaşım imkânları ile toptancı halinin çevreye, altyapıya ve trafiğe getireceği yükler dikkate alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Şehir içinde kalan, çevreye, altyapıya ve trafiğe yük getiren, ulaşım imkânları ve alan büyüklüğü yetersiz olan ve uygun çalışma ortamı bulunmayan toptancı halleri başka bir alana taşınabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>İmar planlarında toptancı hal yeri olarak belirlenmiş alanlar başka bir amaçla kullanılamaz ve bu alanların çevresi toptancı halinin faaliyetini engelleyecek veya insan sağlığına zarar verecek şekilde iskâna açılamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>İmar planında toptancı hal yeri olarak belirlenmiş alanlarda bulunan mülkiyeti Hazineye ait taşınmazlar toptancı hali kurulmak üzere; belediyelere bedelsiz olarak, üretici örgütlerine 2/7/1964 tarihli ve 492 sayılı Harçlar Kanununun 63 üncü maddesinde yer alan harca esas değeri, diğer gerçek veya tüzel kişilere ise rayiç bedeli üzerinden doğrudan satış yoluyla devredilir. Bu şekilde devredilen yerlerin, amacı dışında kullanılması, hukuken geçerli bir mazeret olmaksızın belirlenen sürede tesisin inşaatına başlanılmamış olması, inşaatı tamamlanmamış olması veya inşaatı tamamlanmasına rağmen faaliyete geçmemiş olması hâllerinde geri alınacağına yönelik olarak tapu kütüğüne şerh konulur ve bu şartların gerçekleşmesi durumunda taşınmazlar geri alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>İmar planında toptancı hal yeri olarak belirlenmiş alanlarda özel mülkiyete ait arazilerin bulunması halinde, bu araziler rızaen satın alma veya kamulaştırma yolu ile iktisap edilir. Bu yerler için kamu yararı kararı ilgili belediye tarafından verilir. Kamulaştırma işlemleri, belediyeler tarafından yürütülür. Özel toptancı halleri için yapılan kamulaştırma işlemlerinde kamulaştırma bedeli işletmeci tarafından belediyeye ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>İmar planlarında ayrılmış hal yerleri toptancı hali kurulmak üzere belediyeler tarafından yap-işlet, yap-işlet-devret ve üst hakkı tesisi modelleri ile gerçek veya tüzel kişilere devredilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Bu maddede öngörülen şartları taşımadığı Bakanlık veya belediyece tespit edilen toptancı halleri belediyece kapatılır. Halin kapatılışı, en geç bir ay içinde ilgili belediye tarafından Bakanlığa bildirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Toptancı hallerinin kurulmasına ve kapatılmasına ilişkin usul ve esaslar, ilgili bakanlıkların uygun görüşleri ve meslek kuruluşlarının görüşleri alınarak Bakanlıkça çıkarılacak yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Toptancı haline bildirim, malların toptan ve perakende alım satımı">
    <mvz-fıkra no="1">
      <template>Aşağıda belirtilen mallar bildirime tabidir:</template>
      <mvz-bent no="a">
        <template>Sınaî üretimde kullanılmak üzere satın alınan mallar.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>İhraç edilmek üzere satın alınan mallar.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>İlgili mevzuatı çerçevesinde ithal edilen mallar.</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>1/12/2004 tarihli ve 5262 sayılı Organik Tarım Kanunu kapsamında organik tarım faaliyetleri esaslarına uygun olarak üretilen ham, yarı mamul veya mamul haldeki sertifikalı ürünler.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Üretici örgütlerince toptancı hali dışında satılan mallar.</template>
      </mvz-bent>
      <mvz-bent no="e" durum="mülga">
        <template></template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>İyi tarım uygulamaları kapsamında sertifikalandırılan ürünler.</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Fatura veya müstahsil makbuzu ile üreticilerden satın alınan mallar.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Toptancı haline bildirim, Bakanlıkça belirlenecek usul ve esaslar çerçevesinde birinci fıkranın (a), (b), (ç), (d), (e), (f) ve (g) bentlerinde belirtilen malların üretildiği yerdeki toptancı haline, (c) bendinde belirtilen malların ise malın girdiği gümrük kapısının bulunduğu yerdeki toptancı haline yapılan beyan işlemidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Toptancı hali bulunmayan yerlerde hale bildirim işlemleri Bakanlıkça tespit edilecek belediye toptancı haline yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Henüz satışa konu olmayan ve depolarda muhafaza edilmek üzere gönderilen ya da buralarda muhafaza edilen mallar da üretildiği yerdeki toptancı haline bildirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Malların toptan alım ve satımı toptancı hallerinde yapılır. Ancak, bu maddenin birinci fıkrasının (a), (b), (c), (ç), (d) ve (f) bentlerinde belirtilen toptan alım ve satımlar ile perakende ya da toptancı halinde toptan olarak satmak veya münhasıran kendi tüketiminde kullanmak üzere fatura veya müstahsil makbuzu ile üreticilerden yapılan toptan alımlar toptancı haline bildirilmek kaydıyla toptancı hali dışında da yapılabilir. Elektronik ticaret yoluyla yapılan satışlar da bu madde kapsamındadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Malların perakende satışını yapanlar, bunların toptancı halinden satın alındığını veya toptancı haline bildirildiğini belgelemek zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Herhangi bir toptancı halinden satın alındığı veya herhangi bir toptancı haline bildirildiği belgelenen malların satışı engellenemez, bu mallar üzerinden mükerreren hal rüsumu alınamaz ve bunlar toptancı haline girmeye zorlanamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Toptancı hallerinde veya üretici örgütlerine satılan zirai ürün bedelleri üzerinden 31/12/1960 tarihli ve 193 sayılı Gelir Vergisi Kanununun 94 üncü maddesinin birinci fıkrasının (11) numaralı bendi uyarınca yapılacak vergi tevkifat oranı, ticaret borsalarında tescil ettirilerek satın alınan zirai ürün bedelleri üzerinden yapılan tevkifat oranı olarak uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Bakanlıkça, piyasada yeterli arz ve talep derinliği bulunduğu belirlenen diğer mallar hakkında da bu Kanun hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Belediyeler, malların toptan ve perakende alım satımına ilişkin hükümlerin uygulanmasını sağlamak amacıyla gerekli her türlü önlemi almakla yükümlüdür.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Üretici örgütleri, komisyoncular, alıcı ve satıcılar">
    <mvz-fıkra no="1">
      <template>Üreticilerce kurulan tüzel kişilikler, Bakanlıktan üretici örgütü belgesi almak kaydıyla üretici örgütü olarak kabul edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Üretici örgütleri, ortak veya üyeleri ile ortak veya üyeleri dışındaki üreticiler ile diğer üretici örgütlerine ait malların toptan veya perakende olarak alım ve satımını yapabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Komisyoncular, alıcı ve satıcı arasında aracılık etmek, onların haklarını gözetmek, meslekî bilgi ve deneyimlerine dayanarak piyasanın durumu hakkında en doğru bilgileri aktarmak ve piyasanın oluşumuna katkı sağlamakla görevlidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Komisyoncular aracılık faaliyetleri sırasında kendi kusurlarından kaynaklanan veya kötü niyete dayanan her türlü eylemlerinden sorumludur. Komisyoncuların sorumluluklarını düzenleyen diğer mevzuat hükümleri saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Komisyoncuların satış bedeli üzerinden alacakları komisyon oranı, yüzde sekizi aşmamak üzere taraflarca serbestçe tespit edilir. Bakanlık bu oranı yarıya kadar indirmeye yetkilidir. Fiilen aracılık hizmeti verilmedikçe komisyon ücreti alınamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Komisyoncular teslim aldıkları malları cinslerine, doğal özelliklerine, standartlarına, gıda güvenilirliğine ve kalitesine ilişkin şartlara göre özenle korumak ve gerekli bilgileri vermek, kanunî kesintileri satış bedelinden düştükten sonra mal bedelini satış tarihinden itibaren on beş iş günü içinde üreticiye veya üretici örgütüne ödemek zorundadır. Vadeli satışlarda bu süre otuz iş günü olarak uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Teslim alınan malların satış bedeli ile satın alınan malların alış bedelinden kanuni kesintiler dışında başka bir kesinti yapılamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Malların toptan satışı; üreticiler, üretici örgütleri, komisyoncular ve tüccarlar tarafından yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Hiçbir ayrım yapılmaksızın bütün gerçek veya tüzel kişiler, toptan satış miktarından az olmamak kaydıyla toptancı hallerinden mal satın alabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Ticari uygulamalar göz önünde bulundurularak ilgili yönetmelikle belirlenen durumlar dışında, sekizinci fıkrada sayılan kişiler toptancı halleri içinde kendi aralarında mal alamaz, satamaz veya  devredemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="11">
      <template>Perakende satış yapan üreticiler hariç toptan veya perakende satış yapan diğer satıcılar; malları cinsine, doğal özelliklerine, kalite ve standartlarına göre sınıflandırmak, gıda güvenilirliğine, teknik ve hijyenik şartlara uygun olarak ürünün özelliğine göre satışa sunmak ve satışa sunulan malların izlenebilirliğine yönelik bilgileri içeren ve Bakanlık ile Gıda, Tarım ve Hayvancılık Bakanlığınca belirlenecek teknik özelliklere sahip künyelerin kap veya ambalajlarının üzerinde bulundurulmasını sağlamak zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="12">
      <template>Mal bedelinin tam ve zamanında üreticiye ve üretici örgütüne ödenmesine ilişkin ispat yükümlülüğü meslek mensuplarına aittir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="13">
      <template>Bakanlık, gerekli görülmesi hâlinde, tarafların haklarının korunması ve yükümlülüklerinin tespit edilmesi, sözleşmelerin tarafların aleyhine dengesizliğe yol açmayacak ve iyi niyet kurallarına uygun düşecek biçimde düzenlenmesinin sağlanması amacıyla, üreticiler ile meslek mensupları arasında veya meslek mensuplarının kendi aralarında yaptığı alım satım işlemlerini düzenleyen sözleşmelerde bulunması gerekli asgarî şartları ve bilgileri belirlemeye yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="14">
      <template>Üretici örgütlerinin asgarî ortak veya üye sayıları ile bunların niteliklerine, taşıması gereken asgarî şartlara, ilgilendirilecekleri toptancı hallerine, yapacakları satışlara, sorumluluklarına, üretici örgütü belgesinin verilmesine ve iptaline, meslek mensuplarında aranılacak niteliklere, aracılık faaliyetlerine, haklarına, uymakla yükümlü oldukları kurallara ve üretici örgütleri ile meslek mensuplarına dair diğer hususlara ilişkin usul ve esaslar ilgili bakanlıkların uygun görüşleri ve meslek kuruluşlarının görüşleri alınarak Bakanlıkça çıkarılacak yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Serbest rekabet şartlarının korunması ve standardizasyon">
    <mvz-fıkra no="1">
      <template>Fiyatların, malların arz ve talebine bağlı olarak serbest rekabet şartlarına göre oluşması esastır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Meslek mensupları, serbest rekabeti engellemek amacıyla kendi aralarında veya üreticilerle ticarî anlaşmalar yapamaz, uyumlu eylemde bulunamaz ve hâkim durumlarını kötüye kullanamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bakanlık ve belediyeler, serbest rekabetin ortadan kaldırılmasına, engellenmesine ve bozulmasına yönelik eylemleri önlemek için gereken tedbirleri almakla görevli ve yetkilidir. 7/12/1994 tarihli ve 4054 sayılı Rekabetin Korunması Hakkında Kanunun ilgili hükümleri saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Üretici ve tüketicilerin hak ve menfaatlerinin korunması ve piyasada açıklığın sağlanması amacıyla, toptancı hallerinde alım satıma konu olan malların cins, miktar ve fiyatları ile Bakanlıkça uygun görülecek diğer hususlar, toptancı hallerince elektronik ortamda kayıtları tutularak uygun görülen sistem ve araçlarla kamuoyuna duyurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Ticarete konu malların ayıklanması, sınıflandırılması, hazırlanması, ambalajlanması, işaretlenmesi ve etiketlenmesine; taşıma ve muhafazasında kullanılan kap ve nakil vasıtalarına; gıda güvenilirliğine ve kalitesine ilişkin standartlar Bakanlıkça uygun görülmesi halinde ilgili mevzuatı çerçevesinde hazırlanıp mecburî uygulamaya konulur.  11/6/2010 tarihli ve 5996 sayılı Veteriner Hizmetleri, Bitki Sağlığı, Gıda ve Yem Kanunu hükümleri saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Pazar yerleri">
    <mvz-fıkra no="1">
      <template>Semt pazarları, imar planında belirlenmiş veya asıl tahsis amacını engellememek kaydıyla ayrılmış diğer alanlarda tüketici piyasasının büyüklüğü, ulaşım imkânları, semt pazarı sayısı ve bunların birbirlerine yakınlığı ile semt pazarının çevreye, altyapıya ve trafiğe getireceği yükler ile can ve mal güvenliği riski göz önünde bulundurularak kurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Semt pazarında bulunan toplam satış yeri sayısının en az yüzde yirmisi özel satış yeri olarak üreticilere ayrılır. Ayrılan satış yerlerine üreticilerden yeteri kadar talep olmaması veya boşalan satış yerlerinin doldurulamaması hâlinde diğer talep sahiplerine de tahsis  yapılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Üretici pazarları, yörede yetiştirilen mal miktarı ve çeşidi, üretim sezonu ile üretici ve tüketici talepleri dikkate alınarak semt pazarlarının kurulduğu günlerle aynı olmamak şartıyla kurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Üreticiler, pazar yerlerinde kendi ürettikleri mallar dışında ve toptan satış miktarının iki katından az olmamak üzere belediyelerce belirlenen miktarın üzerinde satış yapamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Belediyeler, modern pazar yerleri kurmak, işletmek ya da Bakanlığın belirleyeceği usul ve esaslar dahilinde yüzde ellisinden fazlasına sahip oldukları iştiraklerince kurulmasını ve işletilmesini sağlamak, pazar yerlerinde malların hijyenik şartlarda satışa sunulmasını sağlayıcı uygun çalışma ortamını oluşturmak ve altyapı ile çevre düzenlemelerini yapmak, tüketicinin korunmasına yönelik tedbirleri almak ve gerekli denetimleri yapmakla görevlidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Pazar yerlerinin kurulması ve kapatılmasına, işleyiş, yönetim ve denetimine, üretici ve pazarcılarda aranılacak niteliklere, bunların çalışmalarına, yapacakları satışlara, haklarına, uymakla yükümlü bulundukları kurallara ve faaliyetlerinin yürütülmesine dair diğer hususlara ilişkin usul ve esaslar ilgili bakanlıkların uygun görüşleri alınarak Bakanlıkça çıkarılacak yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Hal rüsumu">
    <mvz-fıkra no="1">
      <template>Toptancı halinde satılan mallardan yüzde bir, toptancı hali dışında satılan mallardan yüzde iki oranında hal rüsumu tahsil edilir. Ancak, Cumhurbaşkanınca aksi kararlaştırılmadıkça, üretici örgütlerince toptancı halinde satılan mallar ile toptancı haline bildirimde bulunmak şartıyla 4 üncü maddenin birinci fıkrasının (a), (b), (ç), (d), (e) ve (f) bentlerinde belirtilen mallardan hal rüsumu alınmaz. Cumhurbaşkanı, hal rüsumu oranlarını, değişen piyasa şartlarına göre, genel olarak veya mal bazında uygulanmak üzere yüzde doksanına kadar azaltmaya veya artırmaya yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>4 üncü maddenin birinci fıkrasının (a) bendinde belirtilen malların sınai üretimde kullanılmayan, (b) bendinde belirtilen malların ise ihraç edilmeyen kısmından birinci fıkraya göre hal rüsumu alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Gıda güvenilirliği ve kalitesi analizleri, Gıda, Tarım ve Hayvancılık Bakanlığınca yetkilen-dirilmiş kamu laboratuvarlarında veya özel laboratuvarlarda yapıldığı belgelenen mallar üzerinden alınacak hal rüsumu, yarısı oranında alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Hal rüsumunun tahakkuk, tahsil ve paylaşımına ilişkin usul ve esaslar Bakanlıkça çıkarılan yönetmelikle belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Dördüncü fıkra uyarınca belediye toptancı halinin bağlı olduğu belediye hesabında biriken tutarlar, ilgili belediyeye gelir olarak kaydedilir ve bu şekilde gelir olarak kaydedilen tutarların en az yüzde onu toptancı halinin temizlik, güvenlik, aydınlatma, bakım ve onarım ihtiyaçlarının karşılanması ve kapasitesinin arttırılması, ihtiyaç duyulan bilgi işlem sisteminin kurulması ve lüzumlu diğer teknik donanımın sağlanması, soğuk hava deposu, laboratuvar, tasnif ve ambalajlama ile diğer ortak tesislerin kurulması ve işletilmesi için harcanmak üzere, izleyen yıl belediye bütçesine ödenek olarak konulur. Bu şekilde ayrılan ödenekler amacı dışında kullanılamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Dördüncü fıkra uyarınca özel toptancı hali işletmecisi hesabında biriken tutarların yarısı aylık olarak izleyen ayın beşinci gününe kadar ilgili belediyeye ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Bu Kanun hükümlerine aykırı olarak;</template>
      <mvz-bent no="a">
        <template>Toptancı haline bildirilmeden toptancı hali dışında toptan alınıp satılan ya da toptancı halinde satılmak üzere bildirimde bulunulup toptancı hali dışında toptan satılan,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Sınaî üretimde kullanılmak veya ihraç edilmek üzere satın alınıp bu maddenin ikinci fıkrasına aykırı olarak iç piyasada satışa sunulan,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Toptancı halinden satın alınmadan veya toptancı haline bildirilmeden perakende satılan,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Miktarına, değerine, üretim şekline veya künyesinde belirtilen diğer hususlara ilişkin gerçeğe aykırı beyanda bulunulan,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>mallar için hal rüsumu, tespitin yapıldığı yerdeki toptancı halinde bir önceki gün o mallar için oluşan birim fiyatların en yükseği esas alınarak belirlenen toptan satış bedelinin yüzde yirmi beşi oranında cezalı olarak alınır. Hal rüsumunun cezalı olarak alınmasına belediye encümenince karar verilir. Cezalı hal rüsumu tahsil edilen mallar için önceden ödenen hal rüsumu varsa cezalı tahsil edilecek hal rüsumundan mahsup edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Cezalı hal rüsumundan, malları taşıyan nakliyeciler ya da depolayanlar mal sahibiyle birlikte müteselsilen sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Cezalı tahsil edilen hal rüsumları belediyece ayrı bir hesapta tutulur. Bu hesapta toplanan tutarın yarısı her ayın sonunda tespit ve/veya yakalama eylemine bizzat ve fiilen katılan kamu görevlilerine ikramiye olarak ödenir. Ancak, kamu görevlisine ödenen ikramiyenin tutarı olay başına (2.000) ve yılda (90.000) gösterge rakamının memur aylık katsayısı ile çarpımı sonucunda bulunacak tutarı geçemez. Hesapta kalan kısım ise belediyeye gelir olarak kaydedilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Toptancı hallerinin yönetimi">
    <mvz-fıkra no="1">
      <template>Belediye toptancı halleri, belediye teşkilatı bünyesinde norm kadro ilke ve standartlarına uygun olarak kurulan toptancı hal yönetim birimi tarafından yönetilir. Hal yönetim birimi, hal yöneticisi ile mevcut zabıta personeli arasından görevlendirilen hal zabıtası ve diğer personelden oluşur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Belediyeler, hal yönetim birimine bağlı olarak münhasıran toptancı hali ve bu çerçevedeki denetim hizmetlerinin yerine getirilmesinde istihdam edilmek üzere, halin büyüklüğüne ve işlem hacmine göre yeterli sayı ve nitelikte toptancı hali zabıtası görevlendirmek zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Belediyeler, kurdukları toptancı hallerinin işletilmesini belediye meclisince belirlenecek süre, bedel ve koşullarda devredebilir. Devir işlemlerinin tabi olacağı hükümler, devredilecek işletmelerde aranılacak şartlar ile devir işlemlerine ilişkin diğer usul ve esaslar Bakanlık ve Çevre ve Şehircilik Bakanlığınca birlikte belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Özel toptancı halleri, işletmecileri tarafından yönetilir. Özel toptancı halinde, hal yöneticisi ve diğer personel, işletmecisi tarafından istihdam olunur ve bu hallerde ilgili belediyece mevcut zabıta personeli arasından yeterli sayıda hal zabıtası görevlendirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Toptancı hallerinde, hal zabıtasına yardımcı olmak üzere 10/6/2004 tarihli ve 5188 sayılı Özel Güvenlik Hizmetlerine Dair Kanun hükümlerine göre özel güvenlik hizmeti sağlanabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Hal yöneticisinin; 14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanununun 48 inci maddesinin birinci fıkrasının (A) bendinin (4), (5), (6) ve (7) numaralı alt bentlerindeki şartları taşıması ve illerde en az lisans, diğer yerleşim yerlerinde ise en az lise mezunu olması zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Toptancı hallerinin işleyiş, yönetim ve denetimine, işlem görecek malların belirlenmesine, alım satım işlemlerinin nasıl yapılacağına, bildirim ve hal rüsumu ödeme yükümlülüğünün ne şekilde yerine getirileceğine, hizmet gereklerine göre oluşturulacak birimlere ve bunların görev ve yetkilerine, hal yöneticisinin diğer niteliklerine, hal zabıtasının sayısına ve bunlar ile özel güvenlik görevlilerinin çalışma yöntemine, hallerde tutulacak defter, belge ve kayıtlara ve bu konularla ilgili diğer hususlara ilişkin usul ve esaslar, ilgili bakanlıklar ile Maliye Bakanlığının görüşleri alınarak Bakanlıkça çıkarılacak yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Hal hakem heyeti ve Toptancı Hal Konseyi">
    <mvz-fıkra no="1">
      <template>Üreticiler ile meslek mensupları arasında veya meslek mensuplarının kendi aralarında bu Kanunun uygulanmasıyla ilgili olarak ortaya çıkan uyuşmazlıklara çözüm bulmak amacıyla il merkezlerinde bir hal hakem heyeti oluşturulur. Bakanlıkça gerekli görülen ilçe merkezlerinde de hal hakem heyeti oluşturulabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Başkanlığı, sanayi ve ticaret il müdürü veya görevlendireceği bir personel tarafından yürütülen hal hakem heyeti; tarım il müdürlüğü, belediye, baro, ziraat odası, ilgili mühendis odası, ticaret ve sanayi odası ile esnaf ve sanatkarlar odaları birliği tarafından görevlendirilecek birer üye ve en fazla üyeye sahip tüketici örgütü ile komisyoncu ve/veya tüccarların oluşturduğu dernekçe seçilecek birer temsilcinin katılımı ve o yerin mülki idare amirinin onayı ile oluşur. Ticaret ve sanayi odasının ayrı olarak kurulduğu yerlerde, ticaret ve sanayi odasından birer üye görevlendirilir. Esnaf ve sanatkarlar odaları birliği tarafından yapılacak görevlendirmeler ihtisas odalarının, ihtisas odası bulunmayan yerlerde ise karma odaların üyeleri arasından yapılır.  Birden fazla baro kurulan illerde hal hakem heyetlerine üye görevlendirilmesi, baroların eşit ve dönüşümlü temsili esas alınarak yapılır. Görevlendirmeye ilişkin usul ve esaslar Türkiye Barolar Birliği tarafından hazırlanan yönetmelikte gösterilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bakanlık taşra teşkilatının bulunmadığı yerlerde, hal hakem heyetinin başkanlığı, o yerin mülkî idare amiri veya görevlendireceği bir kamu görevlisi tarafından yürütülür. Tüketici örgütü bulunmayan yerlerde tüketiciler, tüketim kooperatifleri tarafından temsil edilir. Hal hakem heyetinin, o yerde ilgili kuruluşun bulunmamasından kaynaklanan noksan üyelikleri, belediye encümenince resen doldurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Hal hakem heyetlerinde, heyetin çalışmalarına ve kararlarına esas olacak dosyaları hazırlamak ve uyuşmazlığa ilişkin raporu sunmak üzere en az bir raportör görevlendirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Değeri elli bin Türk Lirasının altında bulunan uyuşmazlıklarda, hal hakem heyetlerine başvuru zorunludur. Bu uyuşmazlıklarda heyetin vereceği kararlar ilam hükmündedir. Bu kararlar 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanununun ilamların yerine getirilmesi hakkındaki hükümlerine göre yerine getirilir. Taraflar, bu kararlara karşı on beş gün içinde hal hakem heyetinin bulunduğu yerde ticarî davalara bakmakla görevli asliye ticaret mahkemesine itiraz edebilir. İtiraz, hal hakem heyeti kararının icrasını durdurmaz. Ancak, talep edilmesi şartıyla hâkim, hal hakem heyeti kararının icrasını tedbir yoluyla durdurabilir. Hal hakem heyeti kararlarına yapılan itiraz üzerine asliye ticaret mahkemesinin vereceği karar kesindir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Değeri elli bin Türk Lirası ve üstündeki uyuşmazlıklarda hal hakem heyetinin vereceği kararlar, asliye ticaret mahkemesinde delil olarak ileri sürülebilir. Bu maddede yer alan parasal sınırlar her takvim yılı başından geçerli olmak üzere o yıl için 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi hükümleri uyarınca tespit ve ilan edilen yeniden değerleme oranında arttırılır. Artırılan parasal sınırlar, her yıl aralık ayı içinde Bakanlıkça Resmî Gazete’de ilan edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>14 üncü madde dışındaki tüm uyuşmazlıklar, hal hakem heyetinin görev ve yetkileri kapsamındadır. Toptancı hali yönetimi veya personelinin uygulamalarından veyahut toptancı hallerinin ve pazar yerlerinin yönetim ve işleyişinden kaynaklanan uyuşmazlıklar da bu kapsama dâhildir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Hal hakem heyeti, uyuşmazlığa ilişkin konularla sınırlı olmak kaydıyla, ilgili kişi veya kuruluşlardan yazıyla bilgi ve belge isteyebilir. Bu istekler gecikmeksizin yerine getirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Hal hakem heyeti, en az altı üye ile toplanır ve katılanların yarısından bir fazlasının oyu ile karar alır. Oyların eşitliği durumunda başkanın bulunduğu taraf çoğunluk sayılır. Çekimser oy kullanılamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Hal hakem heyeti üyeleri, münhasıran kendileri, eşleri, ikinci derece dâhil kan veya kayın hısımları ve evlatlıkları ile bunların ortak veya üyesi oldukları tüzel kişilerin ilgili işlerinin görüşüldüğü toplantılara katılamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="11">
      <template>Hal hakem heyeti üyeleri ile raportörlere, katıldıkları her toplantı için  gösterge rakamının memur aylık katsayısı ile çarpımı sonucunda bulunacak miktarı geçmemek üzere Bakanlıkça belirlenen miktarlarda huzur hakkı ödenir. Ancak, huzur hakkı ödenecek toplantı sayısı bir ayda ikiden fazla olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="12">
      <template>Hal hakem heyeti üyeleri ile raportörlerinin, 657 sayılı Devlet Memurları Kanununun 48 inci maddesinin birinci fıkrasının (A) bendinin (1), (4), (5), (6) ve (7) numaralı alt bentlerindeki şartları taşıması zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="13">
      <template>Malların ticaretinin bu Kanunun amacına uygun olarak yapılmasının sağlanması hususunda karşılıklı bilgi ve görüş alışverişinde bulunmak, sorunları incelemek ve önlemleri tespit etmek, uygulamayla ilgili kurum ve kuruluşlar arasında işbirliğini sağlamak üzere Toptancı Hal Konseyi oluşturulmuştur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="14">
      <template>Konsey, yılda en az bir defa toplanır. Toplantıda alınan kararlar tavsiye niteliğinde olup öncelikle ele alınmak üzere ilgili mercilere iletilir. Konsey, gündemdeki konularla ilgili olmak üzere, diğer kurum temsilcilerini veya uzman kişileri toplantılara katılmak ve görüş bildirmek üzere davet edebilir. Konseyin sekreterya hizmetleri, Bakanlığın ilgili birimi tarafından yerine getirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="15">
      <template>Hal hakem heyetinin kuruluşu, görev ve yetkileri, üyelerinin belirlenmesi ve bunların diğer nitelikleri, görev süresi ile üyeliğin sona ermesi, kararları ve bu kararlara karşı yapılacak itirazların şekil ve süresi, Konseyin oluşumu, üyelerinin sayı ve nitelikleri, çalışmaları ile hal hakem heyeti ve Konseye ilişkin diğer hususlar Bakanlıkça çıkarılacak yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="Toptancı hallerindeki işyerleri ile pazar yerlerindeki satış yerlerinin işletilmesi">
    <mvz-fıkra no="1">
      <template>Belediye toptancı hallerindeki işyerleri, kiralama veya satış yoluyla işletilir. Ancak satılan işyeri sayısı, o haldeki toplam işyeri sayısının yüzde ellisini geçemez. Bu maddenin altıncı fıkrasındaki eylemlerin tespiti halinde satış işlemlerinin iptal edilip işyerlerinin geri alınacağına ilişkin olarak tapu kütüğüne şerh konulur ve bu şartların gerçekleşmesi durumunda taşınmazlar geri alınır. İşyerlerinin kiralanması veya satılması 8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanunu hükümlerine göre yapılır. Kira süresi en fazla on yıldır. Bakanlıkça belirlenen esaslara uygun olması kaydıyla, kira süresi sona erenlerle ihaleye çıkılmaksızın yeniden kira sözleşmesi yapılabilir. Kira süresi sona erenler açılacak kiralama ihalelerine tekrar katılabilir. Bir yıldan uzun süreli kira sözleşmelerinde ikinci ve izleyen yıllar kira bedelleri, Üretici Fiyatları Endeksi oranında arttırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Gerçek veya tüzel kişiler tarafından kurulan toptancı hallerindeki işyerleri, kiralama veya satış yoluyla işletilir ve bunlara ilişkin işlemler yetkili kişi veya organlarınca yürütülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Pazar yerlerindeki satış yerleri tahsis yoluyla işletilir. Tahsis, satış yeri bulunmayanlara öncelik verilmek suretiyle belediye encümeni tarafından yapılır ve belediye meclisince her yıl belirlenecek tarifeye göre ücret tahsil edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Toptancı hallerinde bulunan toplam işyeri sayısının en az yüzde yirmisi üretici örgütü yeri olarak ayrılır. Üretici örgütlerince, ayrılan işyerlerine yeteri kadar talep bulunmaması veya boşalan işyerlerinin doldurulamaması hâlinde diğer talep sahiplerine kiralama yapılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Başka bir alana taşınma hâlinde, toptancı hallerindeki işyerleri ile pazar yerlerindeki satış yerlerinin kullandırılmasında, mevcut hak sahiplerine öncelik verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Belediye toptancı hallerinde faaliyet gösteren işletmelerden veya pazar yerlerindeki satış yerlerini kullananlardan;</template>
      <mvz-bent no="a">
        <template>Kira bedeli veya tahsis ücretini belediyenin yazılı uyarısına rağmen ödemeyenler ile teminatını süresinde vermeyenlerin veya eksilen teminatını süresinde tamamlamayanların,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Pazar yerlerindeki satış yerinde, toptancı halinden satın alınmayan veya toptancı haline bildirilmeyen malları bir takvim yılı içinde beş defa satanların,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Hukuken geçerli bir mazereti bulunmaksızın; toptancı halindeki işyerini aralıksız on beş gün veya bir takvim yılında altmış gün kapatanlar ile pazar yerlerindeki satış yerini üst üste üç kez veya bir takvim yılında sekiz kez kullanmayanların,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Hal içinde 5 inci maddenin onuncu fıkrasına aykırı olarak kendi aralarında mal alan, satan veya devredenlerin,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Serbest rekabeti engellemek amacıyla kendi aralarında veya üreticilerle ticari anlaşmalar yapanların, uyumlu eylemde bulunanların veya hakim durumlarını kötüye kullananların,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>13 üncü maddenin birinci fıkrasının (a) bendinde belirtilen eylemleri gerçekleştirenlerin,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>13 üncü maddenin birinci fıkrasının (b), (h) ve (ı) bentlerinde belirtilen yasakları bir takvim yılında üç kez ihlal edenlerin,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Bir takvim yılı içinde üretici alacağını, süresi içinde üç kez ödemeyenlerin,</template>
      </mvz-bent>
      <mvz-bent no="ğ">
        <template>Halde yaptığı satışlarda, bir takvim yılında iki kez fatura düzenlemeyenlerin veya noksan fatura düzenleyenlerin,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Semt veya üretici pazarlarında, kendi ürettiği malların dışında veya belirlenen miktarın üzerinde bir takvim yılında üç kez satış yapan üreticilerin,</template>
      </mvz-bent>
      <mvz-bent no="ı">
        <template>Kiraladıkları işyerlerini Bakanlıkça belirlenen sebepler dışında başkasına devredenlerin ya da kiraladıkları veya satın aldıkları işyerlerini herhangi bir şekilde kullandıranların,</template>
      </mvz-bent>
      <mvz-bent no="i">
        <template>Satış yerlerini Bakanlıkça belirlenen sebepler dışında başkasına devredenlerin veya herhangi bir şekilde kullandıranların,</template>
      </mvz-bent>
      <mvz-bent no="j">
        <template>Belediyenin yazılı uyarısına rağmen, kira sözleşmesine aykırılığı yirmi gün içinde gidermeyenlerin,</template>
      </mvz-bent>
      <mvz-bent no="k">
        <template>Doğrudan veya dolaylı olarak aynı toptancı halinde birden fazla işyeri kiraladığı veya satın aldığı ya da aynı pazar yerinde ikiden fazla satış yeri tahsis edildiği  anlaşılanların,</template>
      </mvz-bent>
      <mvz-bent no="l">
        <template>İşyerinin kiralanması veya satılmasında ya da satış yerinin  tahsisinde ilgili yönetmelikte belirlenen şartları taşımadıkları veya sonradan kaybettikleri anlaşılanların,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>kira sözleşmelerinin feshine ya da satış işlemlerinin veya tahsislerinin iptaline belediye encümenince karar verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Kira sözleşmesinin feshine ya da satış işleminin veya tahsisin iptaline ilişkin kararın kendilerine tebliğinden itibaren, belediye toptancı halinde faaliyet gösterenler işyerlerini otuz gün içinde, pazar yerlerinde faaliyet gösterenler ise satış yerlerini yedi gün içinde tahliye etmeye mecburdur. Bu süre  sonunda tahliye edilmeyen yerler, belediye zabıtası tarafından tahliye ettirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Kira sözleşmesi feshedilenler ile satış işlemi veya tahsisi iptal edilenler ve bunların imzaya yetkili ortak veya üyesi oldukları tüzel kişiliklere, fesih veya iptale ilişkin belediye encümeni kararını takip eden bir yıl içinde doğrudan veya dolaylı olarak yeniden kiralama, satış veya tahsis yapılamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Özel toptancı halinde faaliyet gösterenlerin kira sözleşmeleri ve satış işlemleri, altıncı fıkranın (b), (h) ve (i) bentleri hariç anılan fıkrada belirtilen hallerde fesih veya iptal edilir. Kira sözleşmesi feshedilenler ile satış işlemi iptal edilenler ve bunların imzaya yetkili ortak veya üyesi oldukları tüzel kişiliklere fesih veya iptale ilişkin yetkili kişi veya organlarca verilen kararı takip eden bir yıl içinde doğrudan veya dolaylı olarak yeniden kiralama veya satış yapılamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="Teminat">
    <mvz-fıkra no="1">
      <template>Ticarî güvenin sağlanması ve tarafların haklarının korunması amacıyla, toptancı hallerinde faaliyet gösterenlerden, belediye meclisince belirlenen miktarda nakit, banka teminat mektubu, Hazine bonosu, Devlet tahvili, hisse senedi, gayrimenkul rehni, sigorta teminatı ve nakde çevrilebilir diğer kıymetler teminat olarak alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Teslim alınan malların cinslerine, doğal özelliklerine, standartlarına ve hijyenik şartlara göre özenle korunmaması veya toptancı halinden satın alınan malların bozuk ya da sıhhî olmaması nedeniyle meydana gelen zararlar ile süresi içinde üreticiye ödenmeyen mal bedelleri, ilgililerin talebi üzerine hal hakem heyeti veya mahkeme kararıyla verilen teminattan kesilerek ödenir. Teminattan karşılanamayan kısım genel hükümlere göre tahsil olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Teminatlar amacı dışında kullanılamaz, üzerine ihtiyati tedbir konulamaz ve haczedilemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yerine getirilmesi gereken bir yükümlülüğün bulunmadığı tespit edildikten sonra teminatlar ilgililere iade edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu madde kapsamında alınacak asgari teminatlara, bunların muhafazası, nakde çevrilmesi ve tamamlattırılmasına, zarar görene ödenmesine, toplam teminat tutarı içinde gayrimenkul rehni oranına, teminatın iadesine ve teminatlarla ilgili diğer hususlara ilişkin usul ve esaslar Bakanlıkça belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="Yasaklar">
    <mvz-fıkra no="1">
      <template>Malların toptan veya perakende ticaretinde;</template>
      <mvz-bent no="a">
        <template>Piyasada darlık yaratmak, fiyatların yükselmesine sebebiyet vermek veya fiyatların düşmesine engel olmak için malların belirli ellerde toplanması, satışından kaçınılması, stoklanması, yok edilmesi, bu amaçla propaganda yapılması veya benzeri davranışlarda bulunulması,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Malların, gıda güvenilirliğine, kalite ve standardına, teknik ve hijyenik şartlara aykırı olarak satışa sunulması,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Malın kalitesine, standardına veya gıda güvenilirliğine ilişkin belgelerde ya da künyesinde bilerek değişiklik yapılması, bunların tahrif veya taklit edilmesi ya da bunlarda üçüncü şahısları yanıltıcı ifadelere yer verilmesi,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Bu Kanun hükümlerine aykırı olarak üretici, üretici örgütleri veya tüccarların komisyonculuk faaliyetinde bulunması,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Malın miktarının, satış değerinin, komisyon oranı veya ücretinin ya da kanunî kesintilerin üreticiye gerçeğe uygun olmayarak intikal ettirilmesi,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Halde, toptan satış miktarının altında mal satılması,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Halde oluşan mal atıklarının ayıklanarak hal içinde ya da dışında toptan veya perakende satılması,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>İşyeri veya satış yerinde izin alınmaksızın değişiklik yapılması veya bu yerlere ilaveler yapılması,</template>
      </mvz-bent>
      <mvz-bent no="ğ">
        <template>İşyeri veya satış yeri bulunmaksızın toptancı halinde veya pazar yerinde toptan ya da perakende satış yapılması,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Aynı kap veya ambalaj içine değişik kalitede ve/veya üzerinde yazılı olan miktardan az mal konulması,</template>
      </mvz-bent>
      <mvz-bent no="ı">
        <template>Ölçü ve tartı aletlerinin hileli bir şekilde kullanılması ya da hileli olarak karışık veya standartlara aykırı mal satılması,</template>
      </mvz-bent>
      <mvz-bent no="i">
        <template>Toptancı halinde ya da pazar yerindeki işyeri veya satış yeri dışında ya da buralardaki geçiş yollarında mal teşhir edilmesi, satılması, mal veya boş kap bulundurulması,</template>
      </mvz-bent>
      <mvz-bent no="j">
        <template>Toptancı halinde veya pazar yerinde, çevreyi rahatsız edecek şekilde satış yapılması, alıcı veya tüketiciye karşı sözlü veya fiilî kötü muamelede bulunulması,</template>
      </mvz-bent>
      <mvz-bent no="k">
        <template>Toptancı halinde veya pazar yerinde, atık malzemelerin belirlenen şekilde veya alanlarda toplanmaması ya da satış yeri veya işyerinin temiz tutulmaması,</template>
      </mvz-bent>
      <mvz-bent no="l">
        <template>Malların etiketlenmesine, pazar yerine mal getirilmesine, bu yerlerde araç bulundurulmasına, satış yeri numarasını gösterir levhaya, üretici ve pazarcılarca kullanılacak kimlik kartlarına ve bunlarca giyilecek kıyafetlere ilişkin olarak bu Kanun uyarınca çıkarılan yönetmeliklerdeki usul ve esaslara aykırı hareket edilmesi,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>yasaktır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="Cezalar">
    <mvz-fıkra no="1">
      <template>Diğer kanunlara göre daha ağır bir ceza gerektirmediği takdirde;</template>
      <mvz-bent no="a">
        <template>13 üncü maddenin birinci fıkrasının (e) ve (l) bendine aykırı hareket edenler hakkında yüz Türk Lirası,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>13 üncü maddenin birinci fıkrasının (ğ), (i), (j) ve (k) bentlerine aykırı hareket edenler hakkında beş yüz Türk Lirası,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>5 inci maddenin beşinci, altıncı, yedinci ve onuncu fıkralarına, 13 üncü maddenin birinci fıkrasının (ç), (g), (h) ve (ı) bentlerine aykırı hareket edenler hakkında iki bin Türk Lirası,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Toptancı halinden satın alınmayan veya toptancı haline bildirilmeyen malları taşıyanlara veya bunları depolayanlara, 5 inci maddenin on üçüncü fıkrası uyarınca Bakanlıkça belirlenen asgarî şartları ve bilgileri sözleşmelerde bulundurmayanlara iki bin Türk Lirası,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>13 üncü maddenin birinci fıkrasının (d) ve (f) bentlerine aykırı hareket edenler hakkında üç bin Türk Lirası,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>5 inci maddenin on birinci fıkrası ile 13 üncü maddenin birinci fıkrasının (c) bendine aykırı hareket edenler hakkında beş bin Türk Lirası,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>6 ncı maddenin ikinci fıkrasına ve 13 üncü maddenin birinci fıkrasının (a) bendine aykırı hareket edenler ile gerçeğe aykırı analiz raporu düzenleyenler veya bu raporun düzenlenmesini sağlayanlar hakkında on bin Türk Lirası,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>15 inci maddenin ikinci fıkrası ile 17 nci maddenin üçüncü fıkrasına aykırı hareket edenlere ve 17 nci maddenin ikinci fıkrasına göre Bakanlık denetim elemanlarınca istenecek bilgi, belge ve defterler ile bunların örneklerini vermeyenlere veya bunları noksan ya da gerçeğe aykırı olarak verenlere, yazılı veya sözlü bilgi taleplerini karşılamayanlara iki bin Türk Lirası,</template>
      </mvz-bent>
      <mvz-bent no="ğ">
        <template>13 üncü maddenin birinci fıkrasının (b) bendi hükmüne aykırı hareket edenler hakkında iki bin Türk Lirası,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>idarî para cezası uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>13 üncü maddenin birinci fıkrasının (b), (h), (ı), (i), (j) ve (k) bentlerine aykırı hareketten dolayı bu maddede öngörülen idarî para cezaları pazar yerlerindeki satış yerlerini kullananlar için onda biri oranında uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu maddede öngörülen idarî para cezalarının verilmesini gerektiren fiillerin bir takvim yılı içinde tekrarı hâlinde, idarî para cezaları her tekrar için iki katı olarak uygulanır. Bu maddenin birinci fıkrasının (g) bendinde öngörülen idari para cezalarını Bakanlık, (ğ) bendinde öngörülen idari para cezalarını Gıda, Tarım ve Hayvancılık Bakanlığı, diğer idari para cezalarını ise doğrudan veya Bakanlığın talebi üzerine belediyeler uygulamaya yetkilidir. İdari para cezası uygulama yetkisi Bakanlıkta ilgili genel müdürlük, belediyelerde ise belediye encümenince kullanılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu maddede öngörülen idarî para cezalarının uygulanması, bu Kanunda öngörülen diğer müeyyidelerin uygulanmasına engel teşkil etmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>13 üncü maddenin birinci fıkrasının (i), (j), (k) ve (l) bentlerine bir takvim yılı içinde iki kez aykırı hareket edenler belediye encümeni kararıyla bir aya kadar faaliyetten men edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu Kanun hükümlerine aykırı hareket eden veya bu Kanunda belirtilen görevlerini Bakanlığın yazılı uyarısına rağmen yerine getirmeyen toptancı hallerine, Bakanlık tarafından elli bin Türk Lirası idarî para cezası verilir ve eylemin bir takvim yılı içinde tekrarı durumunda, toptancı halin faaliyetleri aykırılık giderilene kadar Bakanlık tarafından durdurulur. Bakanlık bu yetkisini mahallin mülkî idare amirine devredebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Bu Kanunun uygulanmasında hal işletmecileri ile bunlarca istihdam olunan personel, kendi kusurlarından ileri gelen zararlardan sorumludur. Bunlar, suç teşkil eden fiil ve hareketlerinden ve toptancı haline ait para ve mallar ile her türlü evrak, tutanak, rapor, defter ve diğer belgeler üzerinde işledikleri suçlardan dolayı, kamu görevlisi gibi cezalandırılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="Bakanlığın görev ve yetkileri">
    <mvz-fıkra no="1">
      <template>Bakanlık;</template>
      <mvz-bent no="a">
        <template>Hal kayıt sistemini kurmaya, işletmeye, bu sistemin kuruluş ve işletilmesine ilişkin usul ve esasları belirlemeye ve gerekli görülmesi hâlinde bu sistemin diğer kurumlar nezdinde tutulan kayıt sistemleriyle bağlanmasına yönelik çalışmalar yapmaya,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>İstatistiksel bilgileri değerlendirmeye ve yayımlamaya,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Sektörün gelişmesine ve elektronik ticaretin yaygınlaşmasına yönelik çalışmalar yapmaya,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Mevzuatın uygulanması ve uygulamada birliğin sağlanması amacıyla eğitim programları hazırlamaya ve uygulamaya, toplantı ve kongreler düzenlemeye,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Üretici ve tüketicinin korunması ve sağlıklı bir rekabet ortamının oluşturulması için gerekli önlemleri almaya, bu çerçevede ihraç ve ithal edilen mallara ilişkin olarak ilgili kuruluşlarla işbirliği içinde hareket etmeye,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Bu Kanunun uygulanmasıyla ilgili olarak her türlü idari tedbiri almaya, talimat vermeye, denetimi yapmaya, tebliğ ve yönetmelikler çıkarmaya,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Arz ve talep derinliği bulunan diğer malları, Gıda, Tarım ve Hayvancılık Bakanlığının uygun görüşünü alarak belirlemeye,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Bu Kanun kapsamında öngörülen diğer iş ve işlemleri yerine getirmeye,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>görevli ve yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Belediyeler ile gerçek veya tüzel kişiler, Bakanlıkça alınan önlemlere ve verilen talimatlara uymak zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Birinci fıkranın (a), (b), (c) ve (ç) bentlerinde belirtilen hususlara ilişkin giderler ile hal hakem heyetleri ve Toptancı Hal Konseyinin kuruluşuna ve çalışmalarına, hal hakem heyetleri üyelerine ve raportörlere yapılacak huzur hakkı ödemelerine ilişkin giderler Bakanlık bütçesine konulacak ödenekten karşılanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="Malların analizi, kaydı, izlenmesi ve duyurulması">
    <mvz-fıkra no="1">
      <template>Toptancı halleri, halde işlem gören malların gıda güvenilirliği analizini, Gıda, Tarım ve Hayvancılık Bakanlığınca belirlenecek usul ve esaslara göre Gıda, Tarım ve Hayvancılık Bakanlığınca yetkilendirilmiş kamu laboratuvarlarında veya özel laboratuvarlarda yaptırmakla görevli ve yükümlü kılınabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Analiz sonucunda gıda güvenilirliği ve kalitesi şartlarına uymadığı tespit edilen mallar, 11/6/2010 tarihli ve 5996 sayılı Veteriner Hizmetleri, Bitki Sağlığı, Gıda ve Yem Kanunu hükümlerine göre işlem tesis edilmek üzere ilgili mercilere bildirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Toptancı halleri, halde veya hale bildirilerek işlem gören malların cinsine, miktarına, fiyatına, alıcı ve satıcısına ilişkin bilgiler ile Bakanlıkça gerekli görülecek diğer hususları elektronik ortamda tutmak, bunlardan 6 ncı maddenin dördüncü fıkrasında belirtilenleri kamuoyuna duyurmak, hal kayıt sistemi için gerekli olan verileri sağlamak ve bunları sisteme aktarmak, hale giren ve çıkan malları kontrol altına almak ve denetlemekle görevli ve yükümlüdür. Bu görev ve yükümlülüklerin yerine getirilmesi için ihtiyaç duyulan bilgi işlem sisteminin kurulmasından ve lüzumlu diğer teknik donanımın sağlanmasından özel toptancı hali işletmecileri ile belediyeler sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Üçüncü fıkra uyarınca elektronik ortamda tutulan bilgilerin izlenmesi ve duyurulması, meslek mensuplarının kayıt altına alınması, bunlara yönelik veri tabanının oluşturulması ve toptancı halleri arasında ortak bilgi paylaşımının ve iletişimin sağlanması amacıyla, Bakanlık bünyesinde elektronik ortamda merkezi hal kayıt sistemi kurulur. Gerekli görülmesi halinde bu sistem, diğer kurumlar nezdinde tutulan kayıt sistemleriyle çevrimiçi olarak birbirine bağlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="Denetim">
    <mvz-fıkra no="1">
      <template>Bakanlık, denetim elemanları aracılığıyla toptancı halleri, pazar yerleri, hal hakem heyetleri, üretici örgütleri, meslek mensupları ile diğer gerçek veya tüzel kişiler nezdinde bu Kanunun uygulanmasıyla ilgili olarak her türlü araştırma, inceleme ve denetim yapmaya yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bakanlıkça görevlendirilen denetim elemanları, bu Kanun kapsamına giren hususlarda ilgili kamu kurum ve kuruluşları dâhil birinci fıkrada belirtilen kişilerden her türlü bilgi, belge ve defterleri istemeye, bunları incelemeye ve örneklerini almaya, işlem ve hesapları denetlemeye, ilgililerden yazılı ve sözlü bilgi almaya ve gerek duyulduğunda kolluk kuvvetleri ile belediye zabıtasından yardım talebinde bulunmaya yetkili olup; ilgililer istenilen bilgi, belge ve defterler ile bunların örneklerini noksansız ve gerçeğe uygun olarak vermek, yazılı ve sözlü bilgi taleplerini karşılamak ve her türlü yardım ve kolaylığı göstermekle yükümlüdür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Birinci fıkrada belirtilenler, denetim sonucunda Bakanlıkça verilecek talimatlara uymak zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Gıda, Tarım ve Hayvancılık Bakanlığı, bu Kanun kapsamında malların kalitesine, standardına ve gıda güvenilirliğine ilişkin gerekli denetimleri yapmakla görevli ve yetkilidir. Sağlık Bakanlığının, genel sağlığın korunması ve hijyen ile ilgili olarak diğer mevzuattan kaynaklanan görev ve yetkileri saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Belediyeler, yetki alanlarıyla sınırlı olmak kaydıyla bu Kanun ve ilgili yönetmelik hükümleri ile Bakanlık düzenlemeleri çerçevesinde gerekli denetim ve uygulamaları yapmakla görevli ve yetkilidir. Denetim yapmakla görevli, yetkili belediye personelinin talebi üzerine, kolluk kuvvetlerince gerekli yardım sağlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>İl ve ilçe merkezlerinin giriş ve çıkışları ile şehirlerarası yollarda kontrol ve denetim noktası kurulması ve işletilmesine ilişkin usul ve esaslar Bakanlık ve İçişleri Bakanlığınca birlikte belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="18" başlık="Yürürlükten kaldırılan ve uygulanmayacak hükümler">
    <mvz-fıkra no="1">
      <template>1/12/2004 tarihli ve 5262 sayılı Organik Tarım Kanununun 7 nci maddesinin dördüncü fıkrası, 22/3/1971 tarihli ve 1380 sayılı Su Ürünleri Kanununun 26 ncı maddesi, 12/9/1960 tarihli ve 80 sayılı 1580 Sayılı Belediye Kanununun 15 inci Maddesinin 58 inci Bendine Tevfikan Belediyelerce Kurulan Toptancı Hal’lerinin Sureti İdaresi Hakkında Kanun ile 24/6/1995 tarihli ve 552 sayılı Yaş Sebze ve Meyve Ticaretinin Düzenlenmesi ve Toptancı Halleri Hakkında Kanun Hükmünde Kararname yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>24/4/1969 tarihli ve 1163 sayılı Kooperatifler Kanununun, 18/4/1972 tarihli ve 1581 sayılı Tarım Kredi Kooperatifleri ve Birlikleri Kanununun, 1/6/2000 tarihli ve 4572 sayılı Tarım Satış Kooperatif ve Birlikleri Hakkında Kanunun, 29/6/2004 tarihli ve 5200 sayılı Tarımsal Üretici Birlikleri Kanununun ve 1380 sayılı Su Ürünleri Kanununun bu Kanuna aykırı hükümleri uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="Geçiş hükümleri" tür="GEÇİCİ">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihten önce kurulmuş olan toptancı hallerinden;</template>
      <mvz-bent no="a">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren bir yıl içinde 16 ncı maddenin üçüncü fıkrasında belirtilen görev ve yükümlülüklerini yerine getirmek için ihtiyaç duyulan bilgi işlem sistemini kurmayan ve lüzumlu diğer teknik donanımı sağlamayanlara,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren üç yıl içinde 3 üncü maddenin birinci fıkrasında belirtilen halin sınıfına, büyüklüğüne ve işlem hacmine göre yönetmelikle belirlenen müzayede, depolama, tasnifleme ve ambalajlama tesisleri ile laboratuvar ve soğuk hava deposu gibi diğer asgarî koşulları oluşturmayanlara,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Bakanlık tarafından yüz bin Türk Lirası idarî para cezası verilir. Bakanlık bu yetkisini mahallin mülkî idare amirine devredebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkra uyarınca idarî para cezası verilen toptancı hallerinden, idarî para cezasının verilmesine ilişkin kararı takip eden bir yıl içinde birinci fıkranın (a) veya (b) bentlerindeki hükümlerin gereğini yerine getirmeyenlerin faaliyetleri, aykırılık giderilene kadar Bakanlık tarafından durdurulur. Bakanlık bu yetkisini mahallin mülkî idare amirine devredebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Belediyeler, toptancı halleri ile ilgili faaliyette bulunmak üzere kendi aralarında 26/5/2005 tarihli ve 5355 sayılı Mahallî İdare Birlikleri Kanunu hükümlerine göre birlik kurabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Toptancı hallerinde tahsisli işyerleri, mevcut tahsis sahiplerine Kanunun yürürlüğe girdiği tarihten itibaren hiçbir işleme gerek kalmaksızın on sekiz yıl süreyle kiralanmış sayılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren, toptancı hallerde boşalan işyerleri 11 inci maddenin dördüncü fıkrasında belirtilen orana ulaşılana kadar üretici örgütlerine öncelik verilmek suretiyle kiralanır veya satılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren, semt pazarlarında boşalan satış yerleri 7 nci maddenin ikinci fıkrasında belirtilen orana ulaşılana kadar üreticilere öncelik verilmek suretiyle tahsis edilir .</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Bu Kanunda öngörülen yönetmelikler ile diğer düzenlemeler, bu Kanunun 19 uncu maddesinin (c) bendinde belirtilen yürürlük tarihinden itibaren altı ay içinde yürürlüğe konulur. Anılan düzenlemeler yürürlüğe girinceye kadar 552 sayılı Yaş Sebze ve Meyve Ticaretinin Düzenlenmesi ve Toptancı Halleri Hakkında Kanun Hükmünde Kararnameye dayanılarak çıkarılan yönetmeliklerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Bu Kanunun 4 üncü maddesinin dokuzuncu fıkrasına göre Bakanlıkça belirleme yapılıncaya kadar, 1380 sayılı Su Ürünleri Kanununun 26 ncı maddesine istinaden çıkarılan ikincil mevzuatın uygulanmasına devam edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
