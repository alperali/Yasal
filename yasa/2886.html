  <mvz-künye tür="kanun" no="2886" başlık="DEVLET İHALE KANUNU"
             tarih="8/9/1983" rgazete-tarih="10/9/1983" rgazete-sayı="18161"
             düstur-tertip="5" düstur-cilt="22" düstur-sayfa="573" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Esaslar">
    <mvz-madde no="1" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Genel bütçeye dahil dairelerle katma bütçeli idarelerin, özel idare ve belediyelerin alım, satım, hizmet, yapım, kira, trampa, mülkiyetin gayri ayni hak tesisi ve taşıma işleri bu Kanunda yazılı hükümlere göre yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada sayılan daire ve idarelere bağlı döner sermayeli kuruluşlar ile özel kanunlarla veya özel kanunların vermiş olduğu yetkiyle kurulmuş bulunan fonların yukarıda belirtilen işlerinin nasıl yapılacağı Cumhurbaşkanınca çıkarılacak yönetmelikte belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="İlkeler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürütülmesinde, ihtiyaçların en iyi şekilde, uygun şartlarla ve zamanında karşılanması ve ihalede açıklık ve rekabetin sağlanması esastır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Başka başka istekliler tarafından karşılanması mutat olan muhtelif işler bir eksiltmede toplanamaz. Ancak, ihalelerinin ayrı ayrı yapılacağı açıklanmak suretiyle ilanları bir arada yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda yazılı hallerden yararlanmak amacıyla ihale konusunu oluşturan işler kısımlara bölünemez. Ancak, istekli çıkmadığı takdirde, alım şekillerini değiştirecek mahiyette olmamak üzere önemli işlerin kısımlara ayrılması mümkündür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İhaleler kesin zaruret olmadıkça işin mahiyetine göre en uygun fiyatla temini mümkün olan mevsimlerde yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Arsası temin edilmemiş, mülkiyet ve kamulaştırma işlemleri tamamlanmamış olan ve gerekli olduğu halde imar durumu, tip yapılarda tatbikat, diğerlerinde avan projeleri ve bunlara dayalı keşifleri bulunmayan yapım işlerinde ihaleye çıkılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Ancak, arsa temin edilmesi, mülkiyet ve kamulaştırma işlemlerinin tamamlanması şartı; bina ve benzeri mahiyetteki inşaatlar dışındaki ihalelerde aranmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="İhale yetkilisi">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yazılı işleri yaptırmaya ve ihaleye, idarelerin ita amirleri yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında:</template>
        <mvz-bent no="a">
          <template>Alım, Satım: Taşınır ve taşınmaz mallar ile her türlü ihtiyaç maddeleri, hizmet ve hakların alım ve satımını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Hizmet: Kanun ve diğer mevzuata göre çalıştırılan aylıklı, ücretli, yevmiyeli ve sözleşmeli personel istimdamı hariç olmak üzere gerçek veya tüzelkişilere ücret karşılığında yaptırılan araştırma, sondaj, imalat, prototip imalat, istikşaf, etüt, harita plan, proje, kontrollük, müşavirlik ve benzeri her türlü hizmetleri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yapım: Her türlü inşaat, ihzarat, imalat, sondaj, tesisat, onarım, yıkma, değiştirme, iyileştirme, yenileştirme ve montaj işlerini,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Kira: Taşınır ve taşınmaz malların ve hakların kiralanmasını veya kiraya verilmesini,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Trampa ve Mülkiyetin Gayri Ayni Hak Tesisi: Borçlar Kanunu ile Türk Medeni Kanununun trampa ve mülkiyetin gayri ayni hak tesisi ile ilgili maddelerinde gösterilmiş işlemleri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Taşıma: Yükleme, taşıma, boşaltma, depolama ve bunlara ilişkin ambalaj işlerini,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Tahmin edilen bedel: İhale konusu olan işlerin tahmin edilen bedelini ve yapım işlerinde keşif bedelini,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Uygun bedel: Artırmalarda, tahmin edilen bedelden aşağı olmamak üzere, teklif edilen bedellerin en yükseğini; eksiltmelerde tahmin edilen bedeli geçmemek üzere, teklif edilen bedellerin tercihe layık görülenini, bedel tahmini yapılamayan ihalelerde teklif edilen bedellerin uygun görülenini,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>İdare: İhaleyi yapan daire, kurum ve kuruluşları,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>İstekli: İhaleye katılan gerçek veya tüzelkişi veya kişileri,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>İhale: Bu Kanunda yazılı usul ve şartlarla, işin istekliler arasından seçilecek birisi üzerine bırakıldığını gösteren ve yetkili mercilerin onayı ile tamamlanan sözleşmeden önceki işlemleri,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Müteahhit: Üzerine ihale yapılan istekli veya isteklileri,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Müşteri: Artırma sonunda kendisine ihale yapılan istekli veya isteklileri,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Şartname: Yapılacak işlerin genel, özel, teknik ve idari esas ve usullerini gösteren belge veya belgeleri,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Sözleşme: İdare ile müteahhit veya müşteri arasında yapılan yazılı anlaşmayı,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="İhaleye katılabilme şartları">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre yapılacak ihalelere katılabilmek için kanuni ikametgah sahibi olmak, gerekli nitelik ve yeterliği haiz bulunmak, istenilen teminat ve belgeleri vermek zorunludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="İhaleye katılamayacak olanlar">
      <mvz-fıkra no="1">
        <template>Aşağıdaki şahıslar doğrudan veya dolaylı olarak ihalelere katılamazlar:</template>
        <mvz-bent no="1.">
          <template>İhaleyi yapan idarenin;</template>
          <mvz-altbent no="a">
            <template>İta amirleri,</template>
          </mvz-altbent>
          <mvz-altbent no="b">
            <template>İhale işlemlerini hazırlamak, yürütmek, sonuçlandırmak ve denetlemekle görevli olanlar,</template>
          </mvz-altbent>
          <mvz-altbent no="c">
            <template>(a) ve (b) bentlerinde belirtilen şahısların eşleri ve ikinci dereceye kadar  kan ve sıhri hısımları,</template>
          </mvz-altbent>
          <mvz-altbent no="d">
            <template>(a), (b) ve (c) bentlerinde belirtilen şahısların ortakları .</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Bu Kanun ve diğer kanunlardaki hükümler gereğince geçici veya sürekli olarak kamu ihalelerine katılmaktan yasaklanmış olanlar.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Şartnameler">
      <mvz-fıkra no="1">
        <template>İhale konusu işlerin her türlü özelliğini belirten şartname ve varsa ekleri idarelerce hazırlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu şartnamelerde işin mahiyetine göre konulacak özel ve teknik şartlardan başka genel olarak aşağıdaki hususların da gösterilmesi zorunludur:</template>
        <mvz-bent no="a">
          <template>İşin niteliği, nevi ve miktarı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Taşınmaz malların satışı, kiraya verilmesi, trampa edilmesi ve üzerlerinde mülkiyetin gayri ayni hak tesisinde tapu kayıtlarına göre yeri, sınırı, yüzölçümü, varsa pafta, ada ve parsel numarası ve durumu,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Tahmin edilen bedeli, geçici teminat miktarı ve kesin teminata ait şartlar,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İşin yapılma yeri, teslim etme ve teslim alma şekil ve şartları,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İşe başlama ve işi bitirme tarihi, gecikme halinde alınacak cezalar,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İsteklilerde aranılan şartlar ve belgeler,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>İhaleyi yapıp yapmamakta ve uygun bedeli tespitte idarenin serbest olduğu,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>İhale kararının karar tarihinden itibaren en geç 15 işgünü içinde ita amirince onaylanacağı veya iptal edilebileceği,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Vergi, resim ve harçlarla sözleşme giderlerinin kimin tarafından ödeneceği,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Ödeme yeri ve şartlarıyla avans verilip verilmeyeceği, verilecekse şartları ve miktarı,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Sözleşme konusu işlerin malzeme veya birim fiyatlarındaki değişiklikler nedeniyle eğer ödenecekse fiyat farkının ne şekilde ödeneceği,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Süre uzatımı verilebilecek haller ve şartları,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>İşin süresinden önce bitirilmesinde fayda görülen hallerde erken bitirme primi verilecekse miktarı, şartları ve ödeme şekli,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>İhtilafların çözüm şekli.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Şartname genel esasları">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanı:</template>
        <mvz-bent no="a">
          <template>Tip şartnamelerin genel ve ortak esaslarını belirlemeye,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Şartnamelere konulmak üzere 7 nci maddede sayılan hususlarla ilgili veya bunlar dışındaki konularda genel esaslar tespit etmeye,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="İhale İşlemleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="İhaleye Hazırlık">
      <mvz-madde no="9" başlık="Tahmin edilen bedelin tespiti">
        <mvz-fıkra no="1">
          <template>Tahmin edilen bedel, idarelerce tespit edilir veya ettirilir. İşin özelliğine göre gerektiğinde bu bedel veya bu bedelin hesabında kullanılacak fiyatlar belediye, ticaret odası, sanayi odası, borsa gibi kuruluşlardan veya bilirkişilerden soruşturulur. Tahmin edilen bedel, bunun dayanaklarının da eklendiği bir hesap tutanağında gösterilir ve asıl evrak arasında saklanır. Bu bedel gerektiğinde ihale komisyonlarınca tahkik ettirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, yapım işlerinde bu işler için kanunların verdiği yetkiye dayanılarak ilgili dairelerce tespit edilmiş birim fiyatları varsa, bunlar uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Bedelin tahmin edilememesi">
        <mvz-fıkra no="1">
          <template>Sınai ve teknolojik zorunlulukların gerektirdiği durumlarda ilgili bakanın onayı alınmak suretiyle, bedel tahmini yapılmadan kapalı teklif usulüyle ihale yapılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Onay belgesi">
        <mvz-fıkra no="1">
          <template>İhalesi yapılacak her iş için bir onay belgesi hazırlanır. Onay belgesinde, ihale konusu olan işin nevi, niteliği, miktarı, varsa proje numarası, tahmin edilen bedeli, kullanılabilir ödenek tutarı, avans ve fiyat farkı verilecekse şartları, ihalede uygulanacak usul, yapılacaksa ilanın şekli ve adedi, alınacaksa geçici teminat miktarı belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Onay belgesinde ayrıca, Şartname ve eklerinin bir bedel karşılığında verilip verilmeyeceği, bedel karşılığı verilecekse bedelin ne olacağı gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Şartnamelerin verilmesi">
        <mvz-fıkra no="1">
          <template>İhalesi yapılacak işe ait şartnameler ve ekleri, özel kanunlarındaki hükümler saklı kalmak kaydıyla, ilgili idarelerce hazırlanır ve tasdikli örnekleri bedelsiz veya özelliklerine göre idarelerce takdir edilecek bir bedel karşılığında isteyenlere verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Şartname ve ekleri idarede bedelsiz görülebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="İhale komisyonları">
        <mvz-fıkra no="1">
          <template>İta amirleri, ilgili idarenin memurlarından birinin başkanlığında idareden, yapım işlerinde işin ehli veya uzmanı olmak şartıyla, en az bir kişi ve maliye memurunun katılmasıyla kurulacak komisyonları görevlendirirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Askeri ihale komisyonlarının kaç kişiden ibaret olacağı ve nasıl kurulacağı Cumhurbaşkanı kararı tespit edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>TBMM, Cumhurbaşkanlığı ve Sayıştay Başkanlığında teşkil edilecek satınalma komisyonlarında maliye memurluğu görevi, bu kuruluşların saymanlık işlerini yürüten muhasebe müdürü veya vazifelendireceği bir memur tarafından yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Askeri ihale komisyonları ile diğer ihale komisyonlarına katılacak maliye memuru, Maliye Bakanlığınca belirlenecek usule göre tespit edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İl özel idarelerine ait ihaleler, il daimi encümenince, belediyelere ait ihaleler belediye encümenince bu Kanun hükümlerine güre yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Komisyonlara yardımcı olmak üzere, ihale kararlarına katılmamak şartı ile gereği kadar memur ve uzman da görevlendirilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Komisyonların çalışması">
        <mvz-fıkra no="1">
          <template>İhale komisyonları eksiksiz olarak toplanır. Komisyon kararları çoğunlukla alınır. Oyların eşit olması halinde başkanın bulunduğu taraf çoğunlukta kabul edilir. Kararlarda çekimser kalınamaz. Muhalif kalan üye karşı oy gerekçesine kararın altına yazarak imzalamak zorundadır. Komisyon başkan ve üyeleri, oy ve kararlarından sorumludurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="İhale işlem dosyasının düzenlenmesi">
        <mvz-fıkra no="1">
          <template>İhale suretiyle yapılacak işler için bir işlem dosyası düzenlenir. Bu dosyada onay belgesi, varsa tahmin edilen bedele ilişkin hesap tutanağı, şartname ve ekleri, gerekli projeler, ilana ilişkin belge ve gazete nüshaları, sözleşme tasarısı ile saklanmasında yarar görülen diğer belgeler bulunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Şartnamelerde tekniğe uygun olmayan veya gerçekleşmesi mümkün bulunmayan kayıt ve şartların bulunduğu anlaşıldığı takdirde, komisyonlar ilgili idareye şartnameleri düzelttirmek üzere ihaleyi erteler. Bu durumda ihale, yeniden düzenlenecek şartnameye ve 19 uncu madde uyarınca yapılacak ilana göre göre yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="İsteklilerde aranacak nitelikler ve istenecek belgeler">
        <mvz-fıkra no="1">
          <template>İdarece ihalelerin en elverişli koşullarla sonuçlandırılmasını sağlamak amacıyla, isteklilerde belirli mali ve teknik yeterlik ve nitelikler aranabilir. Bunları tespite yarayan belgelerin neler olduğu, şartnamelerde gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İstekliler şartnamelerde yazılı belgeleri eksiksiz vermek ve Türkiye'de tebligat için adres göstermek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yapım işleriyle her türlü etüt, proje, kontrollük ve müşavirlik hizmetlerine ait ihalelerde, isteklilerde aranacak niteliklerin ve istenecek belgelerin neler olacağı, ne yolda ve kimlerce verileceği ve müteahhit sicillerinin ne biçimde tutulacağı Cumhurbaşkanınca çıkarılan yönetmelikle gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="İhalenin ilanı">
        <mvz-fıkra no="1">
          <template>İhale konusu olan işler aşağıdaki esas ve usullere göre isteklilere ilan yoluyla duyurulur:</template>
          <mvz-bent no="1.">
            <template>İhalenin yapılacağı yerdeki ilanlar:</template>
            <mvz-altbent no="a">
              <template>İhaleler, ihalenin yapılacağı yerde çıkan bir gazete ve bir internet haber sitesinde duyurulur.</template>
            </mvz-altbent>
            <mvz-altbent no="0">
              <template>Gazete ve internet haber sitesi ile yapılacak ilk ilan ile ihale günü arası 10 günden, son ilan ile ihale günü arası 5 günden az olamaz.</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>Gazete çıkmayan veya internet haber sitesi yönetimi bulunmayan yerlerdeki ihalelerin ilanı, bu fıkranın (a) bendinde yer alan süreler içinde Basın İlân Kurumu İlan Portalında yayınlanır.</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Diğer şehirlerde yapılacak ilanlar:</template>
            <mvz-altbent no="0">
              <template>Tahmin edilen bedeli her yıl Genel Bütçe Kanunu ile belirlenecek miktarı aşan ihale konusu işler (1) numaralı fıkraya göre yapılacak ilanlardan başka, bir internet haber sitesi ve trajı göz önüne alınarak ili Basın-İlan Kurumunca tespit olunacak günlük gazetelerden birinde, ihale tarihinden an az 10 gün önce birer defa daha ilan edilir.</template>
            </mvz-altbent>
          </mvz-bent>  
          <mvz-bent no="3.">
            <template>Resmi Gazete ile yapılacak ilanlar:</template>
            <mvz-altbent no="0">
              <template>Tahmin edilen bedeli (2) numaralı fıkra uyarınca belirlenecek miktarın üç katını aşan ihale konusu işler, ihale tarihinden en az 10 gün önce bir defa da Resmi Gazete'de ilan edilir.</template>
            </mvz-altbent>
          </mvz-bent>  
          <mvz-bent no="4.">
            <template>İdareler, işin önem ve özelliğine göre bu ilanları yurt içinde ve yurt dışında çıkan başka gazeteler veya internet haber siteleri ya da öteki yayın araçları ile de ayrıca yayınlatabilirler.</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Pazarlık usulü ile yapılacak ihaleler için idareler, ilan yapıp yapmamakta serbesttirler.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="İlanlarda bulunması zorunlu hususlar">
        <mvz-fıkra no="1">
          <template>İlanlarda aşağıdaki hususların belirtilmesi zorunludur.</template>
          <mvz-bent no="a">
            <template>İhale konusu olan işin niteliği, yeri ve miktarı,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Şartname ve eklerinin nereden ve hangi şartlarla alınacağı,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İhalenin nerede, hangi tarih ve saatte ve hangi usulle yapılacağı,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Varsa tahmin edilen bedel ve geçici teminat miktarı,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İsteklilerden aranılan belgelerin neler olduğu,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Kapalı teklif usulüyle yapılacak ihalelerde, tekliflerin hangi tarih ve saate kadar nereye verileceği.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Şartname ve eklerinde değişiklik halinde ilan">
        <mvz-fıkra no="1">
          <template>İlan yapıldıktan sonra şartname ve eklerinde değişiklik yapılamaz. Değişiklik yapılması zorunlu olursa, bunu gerektiren sebep ve zorunluluklar bir tutanakla tespit edilerek önceki ilanlar geçersiz sayılır ve iş yeniden aynı şekilde ilan olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="İlanın uygun olmaması">
        <mvz-fıkra no="1">
          <template>17 ve 18 inci maddelerdeki hükümlere uygun olmayan ilanlar geçersizdir. Bu durumda ilan yenilenmedikçe ihale yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İlanların geçersizliği ihale yapıldıktan sonra anlaşılırsa, ihale veya sözleşme feshedilir. Ancak, işde ivedilik ve ihalede Devletin yararı varsa, ihale ve sözleşme Maliye Bakanlığının uygun görüşü ve birinci derece ita amirinin onayı ile geçerli sayılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İhalenin veya sözleşmenin bozulması halinde, müteahhit veya müşterinin fesih tarihine kadar yapmış olduğu gerçek masrafları ile, varsa, tahakkuk etmiş hakedişleri verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="İlanı sakıncalı görülen hususlar">
        <mvz-fıkra no="1">
          <template>Askeri İhaleler ile Emniyet Genel Müdürlüğüne ve Milli İstihbarat Teşkilatına ait ihaleler için yapılacak ilanlarda birinci derece ita amiri tarafından sakıncalı görülen hususlara yer verilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Yabancı ülkelerde ilan">
        <mvz-fıkra no="1">
          <template>İdarelerince yabancı ülkelerdeki isteklilerin de girmesi yararlı görülen ihaleler için yeterli rekabeti sağlayacak biçimde yabancı ülkelerde ilan yapılabilir. Bu ilan ihale gününden en az 45 gün önce yapılır. İlanla ilgili usul ve yöntemler Milli Savunma, Dışişleri, Bayındırlık, Ticaret ve Enerji ve Tabii Kaynaklar bakanlıklarının görüşü alınarak, Maliye Bakanlığınca çıkarılacak bir yönetmelikte gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="İhalenin tatil gününe rastlaması">
        <mvz-fıkra no="1">
          <template>İhale için tespit olunan tarih, tatil gününe rastlamışsa ihale, tekrar ilana gerek kalmaksızın tatili takip eden ilk işgününde aynı yer ve saatte yapılır. İlandan sonra çalışma saati değişse de ihale ilan edilen saatte yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="Tekliflerin açılma zamanı">
        <mvz-fıkra no="1">
          <template>Tekliflerin açılma zamanı, idarelerin çalışma saati içinde olmak üzere tespit edilir. Açılma zamanı için, Posta, Telgraf, Telefon (PTT) veya Türkiye Radyo Televizyon (TRT) idarelerinin saat ayarı esas alınır. Teklifler açılmaya başlandıktan sonra, çalışma saatine bağlı kalmaksızın işleme devam olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="Geçici teminat">
        <mvz-fıkra no="1">
          <template>İsteklilerden, ihale konusu olan işin tahmin edilen bedelinin % 3'ü oranında geçici teminat alınır. 10 uncu madde uyarınca yapılacak ihalelerde geçici teminat teklif edilen bedelin, tasfiye idaresince yapılan taşınır mal satışlarında ise satışa esas bedelin % 3'ünden az olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Pazarlık usulü ile yapılacak ihalelerde, geçici teminat alıp almamakta idareler serbesttir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Teminat olarak kabul edilecek değerler">
        <mvz-fıkra no="1">
          <template>Geçici veya kesin teminat olarak kabul edilecek değerler aşağıda gösterilmiştir</template>
          <mvz-bent no="a">
            <template>Tedavüldeki Türk Parası,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bankalar ve özel finans kurumlarının verecekleri süresiz teminat mektupları,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Hazine Müsteşarlığınca ihraç edilen Devlet iç borçlanma senetleri veya bu senetler yerine düzenlenen belgeler .</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bankalarca ve özel finans kurumlarınca verilen teminat mektupları dışındaki teminatların istekliler tarafından mal sandıklarına yatırılması zorunlu olup, bunlar komisyonlarca teslim alınamaz. Üzerlerine ihale yapılanların teminat mektupları ihaleden sonra mal sandıklarına teslim edilir ve üzerlerine ihale yapılmayan isteklilerin geçici teminatları hemen geri verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Her ne suretle olursa olsun idarece alınan teminatlar haczedilemez ve üzerine ihtiyati tedbir konulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanun kapsamında teminat olarak kabul edilecek geçici, kesin ve avans teminat mektuplarının kapsam ve şeklini tespite Maliye Bakanlığı yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Teminat mektupları">
        <mvz-fıkra no="1">
          <template>Bankaların bu Kanun kapsamındaki işler için verecekleri geçici, kesin ve avans teminat mektuplarının sermaye ve yedek akçelerinin durumlarına göre miktar ve kapsamlarını ve şeklini tespite Maliye Bakanlığı yetkilidir. Kanun ve diğer mevzuata aykırı olarak düzenlenmiş banka teminat mektupları kabul edilmez. Üzerinde suç unsuru tespit edilen teminat mektupları gerekli kovuşturma yapılması için Maliye Bakanlığına intikal ettirilir. Her teminat mektubunda daha önce ilgili banka şubesince verilen teminat mektupları toplamı ile aynı şubenin limitlerinin de gösterilmesi zorunludur. Yabancı bankaların ve benzeri kredi kuruluşlarının kontrgarantilerine dayanarak bankaların verecekleri teminat mektupları, yukarıdaki miktarlara dahil değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Tekliflerin Değerlendirilmesi ve İhale Kararları">
      <mvz-madde no="28" başlık="Uygun bedelin tespiti">
        <mvz-fıkra no="1">
          <template>Artırmalarda uygun bedel; tahmin edilen bedelden aşağı olmamak üzere teklif edilen bedellerin en yükseğidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Eksiltmelerde uygun bedel; tahmin edilen bedeli geçmemek şartı ile, teklif edilen bedellerin tercihe layık görülenidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kapalı teklif usulüyle yapılan ihalelerde; bedel tahmini yapılmışsa uygun bedel, teklif edilen bedellerden tahmin edilen bedeli geçmemek şartıyla tercihe layık görüleni; bedel tahmini yapılmamışsa uygun bedel, teklif edilen bedellerin tercihe layık görülenidir. Tercih gerekçeleri kararlarda belirtilir. Ancak, bedel tahmini yapılmamış kapalı teklif usulü ihalelerde, ihalenin geçerli sayılması bizzat ilgili bakanın onayına bağlıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Milli firmalar lehine hangi orana kadar ayırım yapılabileceği Cumhurbaşkanınca tespit edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Uygun bedelin tercihinde kullanılacak kriterler ile eksiltmelerde kabul edilecek azami indirim miktar veya oranları; işin niteliği, nevi ve miktarı, birim fiyatları, istekli tarafından talep edilen avans miktarı ve isteklinin buna benzer teknik ve mali yeterliği ile ilgili diğer hususlar da gözönünde bulundurulmak ve gerektiğinde diğer bakanlıkların da görüşleri alınmak suretiyle her yıl Bayındırlık ve İskan Bakanının koordinatörlüğünde Milli Savunma, Maliye ve Gümrük, Tarım Orman ve Köy İşleri, Enerji ve Tabii Kaynaklar Bakanlarınca tespit olunarak Resmi Gazete'de yayımlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="Komisyonların ihaleyi yapıp yapmamakta serbest olması">
        <mvz-fıkra no="1">
          <template>Komisyonlar gerekçesini belirtmek suretiyle ihaleyi yapıp yapmamakta serbesttir. Komisyonların ihaleyi yapmama kararı kesindir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="Kararlarda belirtilmesi gereken hususlar">
        <mvz-fıkra no="1">
          <template>İhale komisyonlarınca alınan kararlar, komisyon başkan ve üyelerinin adları, soyadları ve esas görevleri belirtilerek imzalanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kararlarda isteklilerin isimleri, adresleri, teklif ettikleri bedeller, ihalenin hangi tarihte ve hangi istekli üzerine hangi gerekçelerle yapıldığı, ihale yapılmamış ise nedenleri belirtilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="İhale kararlarının onayı veya iptal edilmesi">
        <mvz-fıkra no="1">
          <template>İhale komisyonları tarafından alınan ihale kararları, ita amirlerince karar tarihinden itibaren en geç 15 işgünü içinde onaylanır veya iptal edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İta amirince karar iptal edilirse ihale hükümsüz sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="Kesinleşen ihale kararlarının bildirilmesi">
        <mvz-fıkra no="1">
          <template>İta amirince onaylanan ihale kararları, onaylandığı günden itibaren en geç 5 işgünü içinde, üzerine ihale yapılana veya vekiline, imzası alınmak suretiyle bildirilir veya iadeli taahhütlü mektupla tebligat adresine postalanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İhale kararlarının ita amirince iptal edilmesi halinde de, durum istekliye aynı şekilde bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="33" başlık="Zam ve indirim teklifleri">
        <mvz-fıkra no="1">
          <template>Teklifler verildikten sonra bu Kanunda yazılı haller dışında zam veya indirim teklifleri kabul edilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="34" başlık="İhalede hazır bulunmayan istekliler">
        <mvz-fıkra no="1">
          <template>İhale sırasında hazır bulunmayan veya noterden tasdikli vekaletnameyi haiz bir vekil göndermeyen istekliler, ihalenin yapılış tarzına ve sonucuna itiraz edemezler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="İhale Usulleri">
        <mvz-madde no="35" başlık="İhale usullerinin neler olduğu">
          <mvz-fıkra no="1">
            <template>Bu Kanunun 1 inci maddesinde yazılı işlerin ihalelerinde aşağıdaki usuller uygulanır:</template>
            <mvz-bent no="a">
              <template>Kapalı teklif usulü,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Belli istekliler arasında kapalı teklif usulü,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Açık teklif usulü,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Pazarlık usulü,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Yarışma usulü.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İşin gereğine göre bu usullerden hangisinin uygulanacağı, bu Kanun hükümlerine uyularak idarelerince tespit edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="36" başlık="İhalelerde kapalı teklif usulünün esas olduğu">
          <mvz-fıkra no="1">
            <template>Bu Kanunun 1 inci maddesinde yazılı işlere ilişkin ihalelerde, tekliflerin gizli olarak verilmesini sağlayan kapalı teklif usulü esastır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ancak, 44 üncü maddede gösterilen işler belli istekliler arasında kapalı teklif usulüyle, 45 inci maddede gösterilen işler açık teklif usulüyle, 51 inci maddede sayılan işler pazarlık, 52 nci maddede gösterilen işler de yarışma usulüyle yaptırılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      <mvz-b2 no="A" başlık="KAPALI TEKLİF USULÜ">
        <mvz-madde no="37" başlık="Tekliflerin hazırlanması">
          <mvz-fıkra no="1">
            <template>Kapalı teklif usulünde teklifler yazılı olarak yapılır. Teklif mektubu, bir zarfa konulup kapatıldıktan sonra zarfın üzerine isteklinin adı, soyadı ve tebligata esas olarak göstereceği açık adresi yazılır. Zarfın yapıştırılan yeri istekli tarafından imzalanır veya mühürlenir. Bu zarf geçici teminata ait alındı veya banka teminat mektubu ve istenilen diğer belgelerle birlikte ikinci bir zarfa konularak kapatılır. Dış zarfın üzerine isteklinin adı ve soyadı ile açık adresi ve teklifin hangi işe ait olduğu yazılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Teklif mektuplarının istekli tarafından imzalanması ve bu mektuplarda şartname ve eklerinin tamamen okunup kabul edildiğinin belirtilmesi, teklif edilen fiyatın rakam ve yazı ile açık olarak yazılması zorunludur. Bunlardan herhangi birine uygun olmayan veya üzerinde kazıntı, silinti veya düzeltme bulunan teklifler reddolunarak hiç yapılmamış sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="38" başlık="Tekliflerin verilmesi">
          <mvz-fıkra no="1">
            <template>Teklifler ilanda belirtilen saate kadar, sıra numaralı alındılar karşılığında komisyon başkanlığına verilir. Alındı numarası zarfın üzerine yazılır. Teklifler iadeli taahhütlü olarak da gönderilebilir. Bu takdirde dış zarfın üzerine komisyon başkanlığının adresi ile hangi işe ait olduğu, isteklinin adı ve soyadı ile açık adresi yazılır. Posta ile gönderilecek tekliflerin ilanda belirtilen saate kadar komisyon başkanlığına ulaşması şarttır. Postadaki gecikme nedeniyle işleme konulmayacak olan tekliflerin alınış zamanı bir tutanakla tespit edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Komisyon başkanlığına verilen teklifler herhangi bir sebeple geri alınamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="39" başlık="Dış zarfların açılması">
          <mvz-fıkra no="1">
            <template>Tekliflerin açılma saati gelince, kaç teklif verilmiş olduğu bir tutanakla belirtildikten sonra dış zarflar hazır bulunan istekliler önünde alınış sırasına göre açılarak, istenilen belgelerin ve geçici teminatın tam olarak verilmiş olup olmadığı aranır. Dış zarfın üzerindeki alındı sıra numarası iç zarfın üzerine de yazılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Belgeleri ile teminatı usulüne uygun ve tam olmayan isteklilerin teklif mektubunu taşıyan iş zarfları açılmayarak başkaca işleme konulmadan, diğer belgelerle birlikte kendilerine veya vekillerine iade olunur. Bunlar ihaleye katılamazlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="40" başlık="İç zarfların açılması ve son tekliflerin alınması">
          <mvz-fıkra no="1">
            <template>Teklif mektuplarını taşıyan iç zarflar açılmadan önce, ihaleye katılacaklardan başkası ihale odasından çıkarılır. Bundan sonra zarflar numara sırası ile açılarak, teklifler komisyon başkanı tarafından okunur veya okutulur ve bir listesi yapılır. Bu liste komisyon başkanı ve üyeleri tarafından imzalanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Şartnameye uymayan veya başka şartlar taşıyan veya 37 nci maddenin son fıkrası hükmüne uygun olmayan teklif mektupları kabul edilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kapalı teklif usûlü ile yapılan artırma ihalelerinde; geçerli en yüksek teklifin altında olmamak üzere, oturumda hazır bulunan isteklilerden sözlü veya yazılı teklif alınmak suretiyle ihale sonuçlandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Ancak, geçerli teklif sayısının üçten fazla olması durumunda bu işlem, geçerli en yüksek teklif üzerinden, oturumda hazır bulunan en yüksek üç teklif sahibi istekliyle, bu üç teklif ile aynı olan birden fazla teklifin bulunması halinde ise bu istekliler dahil edilmek suretiyle yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Komisyon, uygun gördüğü her aşamada oturumda hazır bulunan isteklilerden yazılı son tekliflerini alarak ihaleyi sonuçlandırabilir. Bu husus, ihale komisyonunca ikinci bir tutanakla tespit edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="41" başlık="İhale sonucunun karara bağlanması">
          <mvz-fıkra no="1">
            <template>40 ıncı madde gereğince kabul edilen teklifler incelenerek:</template>
            <mvz-bent no="a">
              <template>İhalenin yapıldığı, ancak ita amirinin onayına bağlı kaldığı</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Tekliflerin daha ayrıntılı bir şekilde incelenmesi için süreye ihtiyaç duyulduğu ve şartnamelerde daha uzun bir süre öngörülmemiş ise ihalenin 15 günü geçmemek üzere başka bir güne bırakıldığı,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İhalenin yapılmadığı,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Hususlarından birine karar verilir ve bu husus gerekçeli bir karar veya karar özeti halinde yazılarak, komisyon başkan ve üyeleri tarafından imzalanır ve durum hazır bulunanlara bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="42" başlık="Tekliflerin aynı olması" durum="mülga">
        </mvz-madde>
        <mvz-madde no="43" başlık="İhalenin yapılamaması">
          <mvz-fıkra no="1">
            <template>Kapalı teklif usulü ile yapılan ihalelerde, istekli çıkmadığı veya teklif olunan bedel komisyonca uygun görülmediği takdirde, ya yeniden aynı usulle ihale açılır veya idare yararı görüldüğü takdirde, ihalenin bitiş tarihinden itibaren 15 gün içinde iş pazarlıkla yaptırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İşin pazarlığa bırakılması halinde şartnamede belirtilen nitelik ve şartların aynen muhafazası zorunludur. Yeni ihale yapılıncaya kadar geçecek günler içinde aynı nitelikler korunarak günlük ihtiyaçlar oranında pazarlıkla mal alınabilir. Ancak ihale, şartnamede belirtilen nitelikte mal bulunmaması sebebiyle geri kalmış ise günlük ihtiyaçlar şartnameye bağlı kalmaksızın temin edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="B" başlık="BELLİ İSTEKLİLER ARASINDA KAPALI TEKLİF USULÜ">
        <mvz-madde no="44" başlık="Belli istekliler arasında yapılacak ihaleler">
          <mvz-fıkra no="1">
            <template>Uçak, harp gemisi, harp mühimmatı, elektronik cihaz, askeri tesisat ve levazımat, silah ve malzeme sistemleri, savunma sanayii ile ilgili faaliyetler ve bunlara ait her türlü yedek parça alımı; barajlar, enerji santralleri, sulama tesisleri, limanlar, rıhtımlar, hava meydanları, demiryolları, lokomotifler, karayolları, tüneller, köprüler, akaryakıt tesisleri, özelliği bulunan yapım işleri bedii ve teknik hususiyetleri taşıyan sanat işleri, kentlerin ulaşım sistemlerine ilişkin planlar, kentlerin harita, nazım ve imar planları, su, kanalizasyon ve enerji tesisleri ile bunların etüt ve proje işlerinin ihalesi; diğer ihale usulleri yerine teknik yeterlilikleri ve güçleri idarece kabul edilmiş en az üç istekli arasında kapalı teklif usulü ile yaptırılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Zorunlu nedenlerle üçten az istekliden teklif almak gerektiği takdirde Cumhurbaşkanınca bu hususta ayrıca karar alınması şarttır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu madde hükümlerine göre yapılacak ihalelerde, ihaleye katılacak isteklilerin isimleri belirtilmek suretiyle bizzat ilgili veya bağlı bulunulan bakanın onayının alınması zorunludur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu ihalelerle ilan yapılması zorunlu değildir. Gerekli görülen hallerde ihaleye davet edilecek isteklilerin seçimi için 17, 18 ve 19 uncu maddeleri hükümlerine bağlı kalınmaksızın önseçim ilanı yapılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="C" başlık="AÇIK TEKLİF USULÜ">
        <mvz-madde no="45" başlık="Açık teklif usulü ile yapılabilecek ihaleler">
          <mvz-fıkra no="1">
            <template>Bu Kanunun 1 inci maddesinde yazılı işlerden, tahmin edilen bedeli her yıl Genel Bütçe Kanunu ile tespit edilecek tutarı geçmeyen ihaleler açık teklif usulüyle yapılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="46" başlık="Açık teklif usulünün uygulanması">
          <mvz-fıkra no="1">
            <template>Açık teklif usulüne göre ihaleler, isteklilerin ihale komisyonları önünde tekliflerini sözlü olarak belirtmeleri suretiyle yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ancak; istekliler ilanda belirtilen ihale saatine kadar komisyon başkanlığına ulaşmış olmak şartıyla, 37 nci madde hükümlerine uygun olarak düzenleyecekleri tekliflerini iadeli taahhütlü bir mektupla da gönderebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Teklif sahibi komisyonda hazır bulunmadığı takdirde posta ile gönderilen teklif son ve kesin teklif olarak kabul edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="47" başlık="Açık teklif usulünde ihale">
          <mvz-fıkra no="1">
            <template>İlanda belirtilen ihale saati gelince, komisyon başkanı, isteklilerin belgelerini ve geçici teminat verip vermemiş olduklarını inceleyerek, kimlerin ihaleye katılabileceğini bildirir. Katılamayacakların belge ve teminatlarının geri verilmesi kararlaştırılır. Bu işlemler, istekliler önünde, bir tutanakla tespit edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tutanaktan sonra, ihaleye giremeyecekler ihale yerinden çıkartılır. Diğer istekliler, önce şartnameyi imzaya ve daha sonra, sıra ile tekliflerini belirtmeye çağrılır. Yapılacak teklifler ihaleye ait artırma ve eksiltme kağıdına yazılır ve teklif sahipleri tarafından imzalanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İlk teklifler bu suretle tespit edildikten sonra, komisyon başkanı, posta ile yapılmış teklifler varsa okutarak bu tekliflerin de ihaleye ait artırma ve eksiltme kağıdına yazılmasını sağlar. Bundan sonra istekliler sıra ile tekliflerde bulunmaya devam ederler. İhaleden çekilen isteklilerin bu durumları ihaleye ait artırma ve eksiltme kağıdına yazılır ve imzaları alınır. İlgilinin imzadan çekinmesi halinde durum ayrıca belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İhaleden çekilenler yeniden teklifte bulunamazlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Teklifler yapıldığı sırada, yapılan indirim veya artırımların işi uzatacağı anlaşılırsa; isteklilerden komisyon huzurunda son tekliflerini yazılı olarak bildirmeleri istenebilir. Daha önce ihaleden çekilmiş olanlar bu durumda yazılı teklif veremezler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="48" başlık="İhale sonucunun karara bağlanması">
          <mvz-fıkra no="1">
            <template>Sözlü veya yazılı son teklifler alındıktan sonra, ihale 41 inci maddeye göre karara bağlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="49" başlık="İhalenin yapılamaması">
          <mvz-fıkra no="1">
            <template>Açık teklif usulüyle yapılan ihalelerde istekli çıkmadığı, isteklilerin belgeleri veya son teklifleri uygun görülmediği takdirde, yeniden aynı usulle ihale açılır veya idare yararı görüldüğü takdirde, ihalenin bitiş tarihinden itibaren 15 gün içinde iş 43 üncü maddenin ikinci fıkrasında belirtilen esaslar dahilinde pazarlıkla yaptırılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="D" başlık="PAZARLIK USULÜ">
        <mvz-madde no="50" başlık="Pazarlık usulünde ihale">
          <mvz-fıkra no="1">
            <template>Pazarlık usulü ile yapılan ihalelerde teklif alınması belli bir şekle bağlı değildir. İhaleler, komisyon tarafından işin nitelik ve gereğine göre, bir veya daha fazla istekliden yazılı veya sözlü teklif almak ve bedel üzerinde anlaşmak suretiyle yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Pazarlığın ne suretle yapıldığı ve ne gibi tekliflerde bulunulduğu ve üzerine ihale yapılanların neden dolayı tercih edildiği pazarlık kararında gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="51" başlık="Pazarlık usulüyle yapılacak işler">
          <mvz-fıkra no="1">
            <template>Aşağıda yazılı işlerin ihalesi, pazarlık usulüyle yapılabilir;</template>
            <mvz-bent no="a">
              <template>Yer, özellik (askeri birliklerin kuruluş özellikleri dahil) ve nitelikleri itibariyle her yıl Genel Bütçe Kanununda gösterilecek belli tutarları aşmayan ve süreklilik göstermeyen, bu Kanunun 1 inci maddesinde gösterilen işler,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Silahlı Kuvvetlerin manevra ve planlı tatbikatlarının gerektirdiği ve acele olarak temini zorunlu her türlü ihtiyaçları; Silahlı Kuvvetler için Genelkurmay Başkanlığınca, güvenlik kuvvetleri için İçişleri Bakanlığınca tespit edilecek özel durumlardaki her türlü ihtiyaçları ve taşıma işleri,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Önceden düşünülmesi mümkün olmayan ani ve beklenmeyen olayların ortaya çıkması üzerine acele olarak yapılması gerekip, kapalı veya açık teklif usulünün uygulanmasına yeterli süre bulunmayan işler; diğer ihale usulleriyle temin edilemeyeceği açıkça belli olan işler; bilgisayar alımı, kiralanması, bakım ve onarımı; her çeşit araç ve gerecin yetkili servislerine yaptırılacak periyodik bakım ve onarımları; yedek parça ve lastik alımları,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>29 uncu maddeye göre ihalenin yapılmaması veya sözleşmenin bozulması nedeniyle, yeniden yapılacak ihalelerin sonuçlandırılmasına kadar geçecek süre içindeki ihtiyaç maddelerinin alımı,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>43 üncü ve 49 uncu maddeler uyarınca, pazarlık usulüyle sonuçlandırılacak işler,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>İdarelerin, müştereken veya iştirak halinde sahibi bulundukları taşınmaz mallardaki paylarının paydaşlara kiraya verilmesi,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Kullanışlarının özelliği, idarelere yararlı olması veya ivediliği nedeniyle kapalı veya açık teklif yöntemleriyle ihalesi uygun görülmeyen, Devletin özel mülkiyetindeki taşınır ve taşınmaz malların kiralanması, trampası ve mülkiyetin gayri ayni hak tesisi ile Devletin hüküm ve tasarrufu altındaki yerlerin kiralanması ve mülkiyetin gayri ayni hak tesisi,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Hazinenin veya Devlet Su İşleri Genel Müdürlüğünün mülkiyetinde veya Devletin hüküm ve tasarrufu altında bulunan yerlerdeki baraj, dalyan, voli yerleri, göller, havuzlar, nehirler ve nehir ağızlarındaki av yerleri ile deniz ve iç sularda belirlenmiş yerlerdeki su ürünleri üretim hakkının, 22.3.1971 tarihli ve 1380 sayılı Su Ürünleri Kanununa göre Tarım ve Orman Bakanlığınca kiraya verilmesi,</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Özellikleri nedeniyle belli isteklilere yaptırılmasında yarar görülen her türlü hizmet, eğitim, araştırma, etüt ve proje, planlama, müşavirlik, keşif, harita, fotoğraf, film, baskı, sergileme, kontrol, muayene işleri ile teknik, fikri ve güzel sanatlarla ilgili çalışmayı gerektiren diğer işler,</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Para, tahvil, senet, pul, altın, gümüş, mücevher gibi kıymetlerle, güzel sanatlarla ilgili veya tarihi değeri bulunan eşyanın özel ambalaj, koruma, sigorta ve taşıma işleri,</template>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Çabuk bozulan, saklanması tehlikeli olan, saklama giderleri değerine veya beklemeden doğacak yararına oranla yüksek bulunan malların satımı,</template>
            </mvz-bent>
            <mvz-bent no="l">
              <template>Tek kişi veya firma elinde bulunan taşınır mal, hak ve hizmetlerle, belirli taşınmaz malların alımı veya kiralanması,</template>
            </mvz-bent>
            <mvz-bent no="m">
              <template>Ordu binek ve yük hayvanları ile damızlık olarak veya aşı, serum üretmek veya kontrol ve araştırma işlerinde kullanılmak üzere hayvan alımı,</template>
            </mvz-bent>
            <mvz-bent no="n">
              <template>Milli Güvenlik nedeniyle gizli tutulması zorunluluğu Cumhurbaşkanınca kabul edilen işler,</template>
            </mvz-bent>
            <mvz-bent no="o">
              <template>Hazineye mal edilmiş batık gemiler ile denize düşmüş malların çıkarılması,</template>
            </mvz-bent>
            <mvz-bent no="p">
              <template>Özellikleri nedeniyle yabancı ülkelerden sağlanması zorunlu olan her türlü alım, kiralama, onarım, yaptırma, keşfettirme, montaj, sigorta, taşıma ve hizmet işleri.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>(a), (b), (c), (d), (i), (l) ve (p) bendlerinde yazılı işler için şartname düzenlenmesi, tahmini bedel tespiti, teminat alınması ve sözleşme yapılması zorunlu değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>(i), (l) ve (p) bendlerinde yazılı işlerde Maliye Bakanlığının uygun görüşü alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="E" başlık="YARIŞMA USULÜ">
        <mvz-madde no="52" başlık="Yarışma usulünün Uygulanması">
          <mvz-fıkra no="1">
            <template>İdareler her türlü etüt, plan, proje ve güzel sanatlara ilişkin işleri gerekli görüldüğünde, yarışma ile yaptırabilirler. Bu işlerin mesleki kontrollük hizmetleri, projesi uygulanacak olan yarışmacıya, pazarlıkla ihale edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İdareler kuruluş kanunları ile Cumhurbaşkanlığı kararnamelerinde yer alan işlere ilişkin yarışmaların yürütülmesiyle ilgili yönetmelikleri hazırlarlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mimarlık, mühendislik proje yarışmalarıyla ilgili yönetmelik Bayındırlık Bakanlığınca hazırlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Sözleşme">
      <mvz-madde no="53" başlık="İhalenin sözleşmeye bağlanması">
        <mvz-fıkra no="1">
          <template>Bütün ihaleler bir sözleşmeye bağlanır. Sözleşme, idare adına ita amiri tarafından imzalanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunda belirtilen özel hallerde sözleşme yapılması zorunlu değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="54" başlık="Kesin teminat">
        <mvz-fıkra no="1">
          <template>Taahhüdün, sözleşme ve şartname hükümlerine uygun olarak yerine getirilmesini sağlamak amacıyla, sözleşme yapılmasından önce müteahhit veya müşteriden ihale bedeli üzerinden hesaplanmak suretiyle % 6 oranında kesin teminat alınır.  Tasfiye idaresince yapılan taşınır mal satışlarında kesin teminat, ihale bedelinin % 6'sından az olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Müteahhit veya müşterinin bu zorunluluğa uymaması halinde, protesto çekmeye ve hüküm almaya gerek kalmaksızın ihale bozulur ve varsa geçici teminatı gelir kaydedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Verilen kesin teminat, teminat olarak kabul edilen diğer değerlerle değiştirilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sözleşmenin yapılmasından sonra geçici teminat iade edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="55" başlık="Yapım işlerinde kesin teminat">
        <mvz-fıkra no="1">
          <template>Tahmin edilen bedeli her yıl Genel Bütçe Kanunu ile tespit edilecek tutarı aşan etüt, proje, kontrollük ve müşavirlik hizmetleri ile yapım işlerinde alınmış bulunan geçici teminat, kesin teminata çevrilir; kesin teminatın geri kalanı müteahhidin hak edişlerine karşı verilecek paralardan % 10 alıkonularak kesin teminat tutarına çıkarılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Müteahhit isterse teminat olarak kabul edilecek kıymetler üzerinden kesin teminat da verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Keşfin ve sözleşmenin dışında kalmış fakat yapılması ihaleden sonra kararlaştırılmış işlerle, değişken fiyat esasına göre ihale edilmiş işlerde kesin teminat, artan iş veya fiyat farkı olarak ödenecek bedel oranında artırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="56" başlık="Kesin teminatın geri verilmesi">
        <mvz-fıkra no="1">
          <template>Kesin teminatın:</template>
          <mvz-bent no="a">
            <template>Taahhüdün sözleşme ve şartname hükümlerine uygun biçimde yerine getirildiği usulüne göre anlaşıldıktan ve müteahhidin bu işten dolayı idareye herhangi bir borcunun olmadığı tespit edildikten sonra, Sosyal Sigortalar Kurumundan ilişiksiz belgesinin getirilmesi halinde, tümü;</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yapım işlerinde (a) fıkrasındaki şartlardan ayrı olarak, geçici kabul tutanağının onaylanması ve geçici kabulde görülen kusurların giderilme bedelinin kesin teminatın yarısından fazla olmaması şartıyla, yarısı, kesin kabul işlemleri tamamlandıktan sonra ise, kalanı;</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Müteahhide geri verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Müteahhidin bu iş nedeniyle idareye ve Sosyal Sigortalar Kurumuna olan borçları ile ücret ve ücret sayılan ödemelerden yapılan kanuni vergi kesintilerinin kesin kabul tarihine kadar ödenmemesi halinde, teminat 54 üncü madde hükmüne göre paraya çevrilerek borçlarına karşılık tutulur. Varsa kalanı müteahhide geri verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="57" başlık="Sözleşme yapılmasında müteahhit veya müşterinin görev ve sorumluluğu">
        <mvz-fıkra no="1">
          <template>Sözleşme yapılması gerekli olan hallerde müteahhit veya müşteri 31 inci maddeye göre onaylanan ihale kararının veya Maliye Bakanlığının vizesi gereken hallerde bu vizenin yapıldığının bildirilmesini izleyen günden itibaren 15 gün içinde geçici teminatı kesin teminata çevirerek noterlikçe tescil edilmiş sözleşmeyi, idareye vermek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Satışlara ilişkin ihalelerde müşterinin aynı süre içinde ihale bedelini ve müşteriye ait bulunan vergi, resim ve harçları yatırması, diğer giderleri ödemesi gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu zorunluluklara uyulmadığı takdirde, protesto çekmeye ve hüküm almaya gerek kalmaksızın ihale bozulur ve varsa geçici teminat gelir kaydedilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="58" başlık="Taşınmaz malların müşteri tarafından adına tescil ettirilmesi">
        <mvz-fıkra no="1">
          <template>Bedeli, vergi, resim, harç ve diğer masrafları ödemiş olmak şartıyla, müşteri, şartnamede yazılı süre içinde taşınmaz malları namına tescil ettirmeye mecburdur. Aksi takdirde müşteri, vukua gelecek hasar, zarar, fuzuli işgal ve diğer sebeplerle idareden bir talepte bulunamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="59" başlık="Müşterinin süresi içinde taşınır malları teslim almaması">
        <mvz-fıkra no="1">
          <template>Taşınır mallar, bedeli ödendiği halde şartnamedeki süre içinde teslim alınmaz ise, idare bunları müşteri hesabına b u Kanun hükümleri dairesinde satmaya yetkilidir. Malların süresi içinde teslim alınmaması ve ikinci defa satılması sebebiyle tahakkuk edecek masraflar, varsa idarenin diğer alacakları, ikinci satış bedelinden mahsup edildikten sonra, geri kalan kısmı, ilk müracaatında verilmek üzere müşteri namına emanet hesabına alınır. Satış bedeli idarenin masraflarını ve alacaklarını karşılamazsa, farkı teminattan mahsup edilir ve artanı müşteriye geri verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sözleşmenin akdedilmiş olması halinde feshedilerek yukarıdaki hükümlere göre işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="60" başlık="İdarenin görev ve sorumluluğu">
        <mvz-fıkra no="1">
          <template>İdare 57 nci maddede yazılı süre içinde sözleşme yapılması hususunda kendisine düşen görevleri yapmak ve taşınmaz malların satımında, ferağa ait işlemleri tamamlamak, şartnamede belirtilen sınır ve evsafa göre satılan malları müşteriye teslim etmekle yükümlüdür. Bu yükümlülüğün yerine getirilmemesi halinde, müteahhit veya müşteri, sürenin bitmesinden itibaren en çok 15 gün içinde, 10 gün müddetli bir noter ihbarnamesi ile bildirmek şartıyla, taahhüdünden vazgeçebilir. Bu takdirde teminat geri verilir. Müteahhit veya müşteri, ihaleye girmek ve teminat vermek için yaptığı masrafları istemeye hak kazanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tebligatın 32 nci maddedeki sürede yapılmamasından dolayı idarenin zararına sebep olanlar hakkında kanuni işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="61" başlık="Sözleşme yapılması ve kesin teminat alınması zorunlu olmayan haller">
        <mvz-fıkra no="1">
          <template>57 nci maddede yazılı süre içinde taahhüdün şartname hükümlerine göre yerine getirilmesi ve bunun idarece uygun bulunması halinde, sözleşme yapılması ve kesin teminat alınması zorunlu değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="62" başlık="Müteahhit veya müşterinin sözleşmenin bozulmasına neden olması">
        <mvz-fıkra no="1">
          <template>Sözleşme yapıldıktan sonra 63 üncü maddede yazılı hükümler dışında müteahhit veya müşterinin taahhüdünden vazgeçmesi veya taahhüdünü, şartname ve sözleşme hükümlerine uygun olarak yerine getirmemesi üzerine, idarenin en az 10 gün süreli ve nedenleri açıkça belirtilen ihtarına rağmen aynı durumun devam etmesi halinde, ayrıca protesto çekmeye ve hüküm almaya gerek kalmaksızın kesin teminatı gelir kaydedilir ve sözleşme feshedilerek hesabı genel hükümlere göre tasfiye edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gelir kaydedilen kesin teminat, müteahhit veya müşterinin borcuna mahsup edilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="63" başlık="Sözleşmede belirtilen işin artış ve eksilişi">
        <mvz-fıkra no="1">
          <template>Yapım işlerine ait bir sözleşmenin uygulanması sırasında keşif ve sözleşmede öngörülmeyen iş artışı veya eksilişi zorunlu hale gelirse, müteahhit, keşif bedelinin % 30 oranına kadar olan değişikliği, süre hariç, sözleşme ve şartnamesindeki hükümler dairesinde yapmakla yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Keşif bedeli artışının % 30'u geçmesi halinde sözleşme feshedilir. Ancak, bu durumda müteahhit işin keşif bedeli ve % 30 keşif artışının karşılığı işleri sözleşme ve şartnamesindeki hükümler çerçevesinde yapmaya zorunludur. Taahhüdün % 30 keşif artışı ile bitmemesi ve tasfiye edilmesi halinde müteahhit, idareden hiçbir masraf ve tazminat isteyemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>% 30 oranından fazla artış; temel, tünel ve benzeri işler ile tabii afetler gibi nedenlerden ileri gelmiş ise; idarenin isteği, müteahhidin kabulü ve ilgili bakanın onayı ile süre hariç, aynı sözleşme ve şartname hükümleri içinde % 30'u geçen işler de aynı müteahhide yaptırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Keşif bedelinin % 70 inden daha düşük bedelle tamamlanacağı anlaşılan işlerde, müteahhit işi bitirmeye zorunludur. Bu durumda, müteahhide, belgelemek şartı ile yapmış olduğu gerçek giderlerine karşılık olarak, ihale bedelinin % 70'i ile yaptığı işin tutarı arasındaki bedel farkının % 5'ine kadar ödeme yapılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="64" başlık="Kiralarda sözleşme süresi">
        <mvz-fıkra no="1">
          <template>Kiraya verilecek taşınır ve taşınmaz malların kira süresi, on yıldan çok olamaz. Turistik tesis kurulacak yerlerin ve turistik tesislerin  ve enerji üretimi tesisleri ile iletim ve dağıtım tesis ve şebekelerinin ihtiyacı olan arazilerin  ve doğal gaz iletim, dağıtım ve depolama tesis ve şebekelerinin ihtiyacı olan arazilerin on yıldan fazla süre ile kiraya verilmesi mümkündür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Üç yıldan fazla süre ile kiraya verme işlerinde, önceden Maliye Bakanlığından izin alınması şarttır. Katma bütçeli idarelerde bu izin, idarelerin bağlı bulundukları bakanlıktan alınır. Özel İdare ve belediyeler için kendi özel kanunları uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Üç yıldan fazla süre ile kiraya verme işlerinde, kira bedeli her yıl şartname ve sözleşmesindeki esaslara göre yeniden tespit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="65" başlık="Su ürünleri istihsali hakkı kiralarında süre">
        <mvz-fıkra no="1">
          <template>Dalyan, voli yerleri, doğal ve yapay göller, barajlar, havuzlar, nehirler ve nehir ağızlarındaki sular, av yerleri ile deniz ve iç sulardaki su ürünleri istihsal hakkının kiralanmasında beş yıla kadar sözleşme yapmaya idareler yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, kiracı tarafından kurulacak ve tesisat yapılacak olan üretme yerleri onbeş yıla kadar kiraya verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu madde kapsamına giren kira işlerinde, kira bedeli her yıl şartname ve sözleşmesindeki esaslara göre yeniden tespit olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="66" başlık="Sözleşmenin devri">
        <mvz-fıkra no="1">
          <template>Sözleşme, ita amirinin yazılı izni ile başkasına devredilebilir. Ancak, devir alacaklarda ilk ihaledeki şartlar aranır. İzinsiz devir yapılması halinde, sözleşme bozulur ve müteahhit veya müşteri hakkında 62 nci madde hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="67" başlık="Müteahhit veya müşterinin ölümü">
        <mvz-fıkra no="1">
          <template>Müteahhit veya müşterinin ölümü halinde, yapılmış olan işler tasfiye edilerek kesin teminatı ve varsa sair alacakları varislerine verilir. Ancak, idare varislerden istekli olanlara, ölüm tarihinden itibaren 30 gün içinde kesin teminat verilmesi şartıyla sözleşmeyi devredebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="68" başlık="Müteahhit veya müşterinin iflası hali">
        <mvz-fıkra no="1">
          <template>Müteahhit veya müşterinin iflas etmesi halinde sözleşme bozulur. Bundan bir zarar doğarsa 62 nci maddeye göre işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="69" başlık="Müteahhit veya müşterinin ağır hastalığı, tutukluluk veya mahkûmiyet hali">
        <mvz-fıkra no="1">
          <template>Müteahhit veya müşteri sözleşmenin yerine getirilmesine engel olacak derecede ağır hastalık, tutukluluk veya hürriyeti bağlayıcı bir ceza nedeni ile taahhüdünü yapamayacak duruma girerse, bu hallerin oluşundan itibaren 30 gün içinde ilgili idarenin kabul edeceği birini vekil tayin etmek şartıyla taahhüdüne devam edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Eğer müteahhit veya müşteri kendi serbest iradesi ile vekil tayin etmek imkanından mahrum ise, yerine ilgililerce aynı süre içinde genel hükümlere göre bir kayyum tayin edilmesi istenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yukarıdaki hükümlerin uygulanmaması halinde sözleşme bozulur. Bundan bir zarar doğarsa 62 nci maddeye göre işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="70" başlık="Müteahhit veya müşterinin birden fazla olması hali">
        <mvz-fıkra no="1">
          <template>Birden fazla gerçek veya tüzelkişi tarafından birlikte yapılan taahhütlerde, müteahhitlerden veya müşterilerden birinin ölümü, iflası, tutuklu veya mahkûm olması gibi haller sözleşmenin devamına engel olmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birlikte yapılan taahhütlerde müteahhitlerden biri idareye (pilot firma) olarak bildirilmiş ise, pilot firmanın şahıs veya şirket olmasına göre ölüm, iflas veya dağılma hallerinde sözleşme kendiliğinden sona erer. Ancak, diğer müteahhitlerin teklifi ve idarenin uygun görmesi halinde sözleşme yenilenerek işe devam edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birlikte yapılan taahhütlerde gruba dahil pilot firmadan başka herhangi bir ortak şahsın ölümü veya ortak şirketin herhangi bir sebeple dağılması halinde, pilot firma ve grubun diğer ortakları, teminat dahil işin o ortağa yüklediği sorumlulukları da üzerlerine alarak işi bitirirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="İhale Usullerine Tabi Olmayan İşler">
    <mvz-madde no="71" başlık="İhtiyaçların kamu kuruluşlarından karşılanması">
      <mvz-fıkra no="1">
        <template>Aşağıda belirtilen durumlarda ihale işleri Maliye Bakanlığının uygun görüşü alınarak kıymet takdiri suretiyle yapılır.</template>
        <mvz-bent no="1.">
          <template>Bu Kanun kapsamına giren idarelerin kendi aralarında yaptıkları ihale işleri,</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>(1) numaralı fıkrada belirtilen idarelerin her türlü ihtiyaçlarının;</template>
          <mvz-altbent no="a">
            <template>Bu idarelere bağlı sabit veya döner sermayeli müesseseler ve özel bütçeli idarelerin kurdukları birliklerden,</template>
          </mvz-altbent>
          <mvz-altbent no="b">
            <template>Kamu iktisadi teşebbüsleri ile sermayesinin yarısından fazlası tek başına veya birlikte Devlete, kamu iktisadi teşebbüslerine veya mahalli idarelere ait kuruluşlardan,</template>
          </mvz-altbent>
          <mvz-altbent no="c">
            <template>Türk Silahlı Kuvvetlerini güçlendirmek amacıyla kurulmuş olan vakıflar ile sermayesinin yarısından fazlası bu vakıflara ait olan kuruluş, şirket ve müesseselerden,</template>
          </mvz-altbent>
          <mvz-altbent no="d">
            <template>Özel kanun veya Cumhurbaşkanlığı kararnameleri ile kurulan tüzelkişiliğe sahip ve ortaklarının veya kanunların öngördüğü durumlarda ortak olmayanların ürünlerini alan, işleyen, değerlendiren iyileştiren, satan, üretim ihtiyaçlarına yarayan araç ve gereçleri sağlayan ortaklıklar ve bunlara ait birliklerden,20</template>
          </mvz-altbent>
          <mvz-altbent no="e">
            <template>Özel kanunlar veya Cumhurbaşkanlığı kararnameleriyle kurulmuş ve kendilerine kamu görevi verilmiş tüzelkişiliğe sahip kuruluşlardan,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Temini ile ilgili ihale işleri.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>(2) numaralı fıkranın uygulanmasında, ihale konusu mal ve hizmetlerle, taşıma işlerinin bizzat o kuruluşlar tarafından üretilmesi ve yapılması zorunludur. Ancak, bu fıkrada yazılı olup kuruluş amaçları temel gıda ve günlük tüketim maddelerini alıp satmak olan kuruluşlar bakımından, sözü edilen günlük gıda ve tüketim maddeleri; sanayi kuruluşları bakımından da, imal edilecek mamullerin bünyesine giren hammade, yarı mamul, devre elemanları, aksesuar, yardımcı özel teçhizat ve bir bütün halinde kurulacak tesislerde kullanılan ve kuruluşun imalat sahasına girmeyen makine, teçhizat için bizzat üretim ve yapım şartı aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Bu usulle yapılan mal ve hizmet alımları ile yapım ve taşıma işlerinin kıymet takdirleri satış fiyatları Devletçe veya görevli mercilerce tespit olunanlar için bu fiyatlar esas alınmak suretiyle, fiyatları bu şekilde tespit olunmayanlar için ise 9 uncu maddedeki usule göre alıcı kuruluşlarca yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Satış fiyatları Devletçe veya görevli mercilerce tespit olunan mallar, dağıtımı yapan kuruluşlarda bulunmadığı belgelenmek şartıyla bu fiyatlarla en yakın piyasadan da satın alınabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İdarelere zorunluluk yükleyen özel hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="72" başlık="Kamu yararına çalışan derneklere taşınmaz malların satımı">
      <mvz-fıkra no="1">
        <template>Kamu yararına çalışan derneklere, kuruluş gayelerine uygun olarak kullanılmak üzere, Hazinenin özel mülkiyetinde kayıtlı bulunan ve kamu hizmetlerine tahsisli olmayan taşınmaz malları, satış tarihindeki alım satım rayici nazara alınarak kıymet takdiri suretiyle satılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yolla edinilen taşınmaz mallar veriliş maksadı dışında kullanılamaz ve satılamaz.  Ancak, satış tarihinden itibaren en az yirmi yıl geçen ve veriliş maksadına uygun olarak kullanılan taşınmazların, mevcut faaliyet aksatılmaksızın kısmen veya tamamen ticari amaçlarla değerlendirilmesinin kuruluş gayelerine daha fazla hizmet edeceği hallerde, elde edilecek gelirin yüzde otuzunun Hazineye verilmesi koşuluyla taşınmazların satış dahil değerlendirilmesine Maliye Bakanlığınca belirlenecek usul ve esaslara göre izin verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Beş yıl içinde kuruluş gayesine uygun olarak kullanılmadığı takdirde, taşınmaz mal, satış bedeli üzerinden Hazinece geri alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="73" başlık="Tarihi ve bedii değeri olan taşınmaz malların kiraya verilmesi">
      <mvz-fıkra no="1">
        <template>Tarihi ve bedii değeri olan taşınmaz mallar Kültür ve Turizm Bakanlığının görüşü alınarak, Maliye Bakanlığınca çıkarılacak bir yönetmelikte tespit olunacak esas ve şartlara göre, Maliye Bakanlığınca kiraya verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Vakıflara ait özel hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="74" başlık="Tarihi ve bedii değeri olmayan taşınmaz mallarla ilgili işlemler">
      <mvz-fıkra no="1">
        <template>Tarihi ve bedii değeri olanlar hariç Hazinenin özel mülkiyetindeki yerlerin satışı, kiraya verilmesi, trampası ve mülkiyetin gayri ayni hak tesisi ile Devletin hüküm ve tasarrufu altındaki yerlerin kiraya verilmesi, mülkiyetin gayri ayni hak tesisi esasları Maliye Bakanlığınca çıkarılacak yönetmelikte belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="75" başlık="Ecrimisil ve tahliye">
      <mvz-fıkra no="1">
        <template>Devletin özel mülkiyetinde veya hüküm ve tasarrufu altında bulunan taşınmaz malları, özel bütçeli idarelerin mülkiyetinde bulunan taşınmaz mallar ve Vakıflar Genel Müdürlüğü ile idare ve temsil ettiği mazbut vakıflara ait taşınmaz malların, gerçek ve tüzelkişilerce işgali üzerine, fuzuli şagilden, bu Kanunun 9 uncu maddesindeki yerlerden sorulmak suretiyle, idareden taşınmaz ve değerleme konusunda işin ehli veya uzmanı üç kişiden oluşan komisyonca tespit tarihinden geriye doğru beş yılı geçmemek üzere tespit ve takdir edilecek ecrimisil istenir. Ecrimisil talep edilebilmesi için, idarelerin işgalden dolayı bir zarara uğramış olması gerekmez ve fuzuli şagilin kusuru aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ecrimisile itiraz edilmemesi halinde yüzde yirmi, peşin ödenmesi halinde ise ayrıca yüzde onbeş indirim uygulanır. Ecrimisil fuzuli şagil tarafından rızaen ödenmez ise, 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre tahsil olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kira sözleşmesinin bitim tarihinden itibaren, işgalin devam etmesi halinde, sözleşmede hüküm varsa ona göre hareket edilir. Aksi halde ecrimisil alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşgal edilen taşınmaz mal, idarenin talebi üzerine, bulunduğu yer mülkiye amirince en geç 15 gün içinde tahliye ettirilerek, idareye teslim edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Köy sınırları içerisinde yer alan Hazinenin özel mülkiyetinde veya Devletin hüküm ve tasarrufu altında bulunan taşınmazların işgalcilerinden tahsil edilen ecrimisil gelirlerinin yüzde beşi, 442 sayılı Köy Kanununda belirlenen görevlerde kullanılmak kaydıyla, tahsilatı izleyen ay içinde bu gelirlerin elde edildiği köy tüzel kişiliği hesabına aktarılmak üzere emanet nitelikli hesaplara kaydedilir. Maliye Bakanlığı bu oranı iki katına kadar artırmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="76" başlık="Mahalli komisyonların yetkileri">
      <mvz-fıkra no="1">
        <template>Taşınır ve taşınmaz malların satış, kira, trampa edilmesi ve mülkiyetin gayri ayni hak tesislerinde, mahalli komisyonların ne miktara kadar ihaleye selahiyetleri oldukları, her yıl Genel Bütçe Kanununda gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="77" başlık="Kızılay derneğinden yapılacak alımlar">
      <mvz-fıkra no="1">
        <template>Kızılay derneğinde bulunan ilaçlarla, sağlık araç ve gereçleri, idarelerce doğrudan doğruya satın alınabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="78" başlık="İlaç ve gereç sağlanması">
      <mvz-fıkra no="1">
        <template>Kanunlar gereğince tedavisi sağlanan kişilerin kullanması gereken ilaç ve gereçlerin, ilgililer tarafından eczanelerden alınması halinde, idarelerle eczaneler arasında yapılacak anlaşmalar Maliye Bakanlığınca tespit edilecek esas ve usullere göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="79" başlık="Dış ülkelerdeki kuruluşların ihtiyaçları">
      <mvz-fıkra no="1">
        <template>İdarelerin yabancı ülkelerdeki kuruluşlarının yerel ihtiyaçlarının karşılanmasında taşınır ve taşınmaz malların alım, satım, kiralama ve kiraya verilmesinde uygulanacak esaslar Dışişleri, Milli Savunma, Maliye ve Bayındırlık bakanlıklarınca düzenlenecek bir yönetmelikle tespit edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="80" başlık="Yurt dışında bulunan gemi ve uçakların ihtiyaçlarının karşılanması">
      <mvz-fıkra no="1">
        <template>Yurt dışında bulunan gemi ve uçakların o yerden sağlanması zorunlu olan ihtiyaç maddelerinin alımı ile acele onarımlarının vesair giderlerinin yapılmasına ilişkin esaslar, Maliye ve Milli Savunma bakanlıklarınca müştereken hazırlanacak bir yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="81" başlık="Emanet suretiyle yapılacak işler">
      <mvz-fıkra no="1">
        <template>Aşağıda yazılı işler, ita amirlerince idare görevlilerinden oluşturulacak emanet komisyonları eliyle emaneten yaptırılabilir.</template>
        <mvz-bent no="a">
          <template>Tahmin edilen bedeli her yıl Genel Bütçe Kanununda gösterilen miktarı geçmeyen yapım, bakım ve onarım işleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İdarenin yeterli işgücü, makine, araç, gereç ve taşıtlara sahip olması halinde ve ihaleye konulması faydalı görülmeyen yapım ve taşıma işleri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Köy kalkınması ile ilgili yapım işleri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İstihkamların yapımı ve onarımı ile garnizonların altyapı işleri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Gizliliği olan işlerle yasak bölgelerde ve orman içindeki yapım ve taşıma işleri,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Toprak koruma, arazi iyileştirme ve orman amenajman işleri,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Can ve mal kaybı tehlikesi nedeniyle acele olarak gerçekleştirilmesi gereken yapım ve onarım işleri,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Sözleşmenin bozulması veya tasfiye edilmesi nedeniyle bitirilmemiş olup, süratle bitirilmesinde zorunluluk görülen işlerin tamamlanması,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Liman yapımı ve genişletilmesi, tarama yapılması, ulaşım güvenliği için batıkların çıkarılması ve dolgu işleri,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Silahlı Kuvvetlerle, güvenlik kuvvetlerinin araç ve gereçlerinin yapım, onarım ve bakımı,</template>
        </mvz-bent>
        <mvz-bent no="k">
