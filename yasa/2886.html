          <template>Parasal bağış dışındaki halk katkısının önem taşıması nedeniyle ihaleye konulmadan yaptırılmasında idaresince yarar görülen işler,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>İhaleye konulmasına imkan bulunmayan veya ihaleye konulduğu halde istekli çıkmayan ve beklemeye de tahammülü olmayan işler,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Demiryolu yapımında balast ve yol malzemesinin döşenmesi işleri,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Telgraf, telefon ve enerji hatlarının çekilmesi işleri,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Tuz çıkarma işleri,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>İlköğretim kurumları ve tesisleri ile ilkokul öğretmen konutları yapım, onarım ve bakım işleri.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıda belirtilen işler için işi yürütmekle görevli emanet komisyonları geçici süre ile işçi çalıştırabileceği gibi işin bünyesine giren gerekli madde, araç ve gereçleri öncelikle bunları kendileri üreten veya yapan ve sermayesinin yarıdan fazlası tek başına veya birlikte Devlete, kamu iktisadi teşebbüslerine veya belediyelere ait olan kuruluşlardan doğrudan doğruya tarife, yoksa piyasa satış bedelleri üzerinden alabilirler. Bu suretle sağlanması mümkün olmayan madde, araç ve gereçler teklif alınmak ve piyasa satış değerlerine uygunluğu belgelenmek şartıyla piyasadan sağlanır,</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu usulle yaptırılmasında gerek ve yarar görülen işler nevi itibariyle kısımlara ayrılmak suretiyle, araya bir müteahhit girmeksizin taşaronlara da yaptırılabilir,</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Nevi itibariyle kısımlara ayrılarak taşeronlara verilen işlerde: gerekli görülen malzeme taşeron tarafından temin edilmek şartıyla iş yaptırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Emanet komisyonları eliyle yapılabilecek işlere ait uygulama esasları, Cumhurbaşkanınca çıkarılacak bir yönetmelikte gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yukarıdaki bentlerde sayılan işlerle ilgili olarak idarelere zorunluluk yükleyen özel hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="82" başlık="Uluslararası antlaşmalar uyarınca yapılacak işler">
      <mvz-fıkra no="1">
        <template>Uluslararası antlaşmalar uyarınca Türkiye'de yapılacak ve karşılıkları yabancı Devlet veya Uluslararası kuruluşlarca sağlanacak işler, özel kanun, kararname ve antlaşmalar hükümlerine göre yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="İhale İşlerinde Yasaklar ve Sorumluluklar">
    <mvz-madde no="83" başlık="Yasak fiil ve davranışlar">
      <mvz-fıkra no="1">
        <template>İhale işlemlerinin hazırlanması, yürütülmesi ve sonuçlandırılması sırasında;</template>
        <mvz-bent no="a">
          <template>Hile, desise, vait, tehdit, nüfuz kullanma ve çıkar sağlama suretiyle veya başka yollarla ihaleye ilişkin işlemlere fesat karıştırmak veya buna teşebbüs etmek,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Açık teklif ve pazarlık usulü ile yapılan ihalelerde isteklileri tereddüde düşürecek veya rağbeti kıracak söz söylemek ve istekliler arasında anlaşmaya çağrıyı ima edecek işaret ve davranışlarda bulunmak veya ihalenin doğruluğunu bozacak biçimde görüşme ve tartışma yapmak,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İhale işlemlerinde sahte belge veya sahte teminat kullanmak veya kullanmaya teşebbüs etmek, taahhüdünü kötü niyetle yerine getirmemek, taahhüdünü yerine getirirken idareye zarar verecek işler yapmak veya işin yapılması veya teslimi sırasında hileli malzeme, araç veya usuller kullanmak,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yasaktır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="84" başlık="İdarelerce ihalelere katılmaktan geçici yasaklama">
      <mvz-fıkra no="1">
        <template>83 üncü maddede belirtilen fiil veya davranışlarda bulundukları anlaşılanlar, bu fiil ve davranışlar ihale safhasında vaki olmuşsa idarelerce o ihaleye iştirak ettirilmeyecekleri gibi fiil veya davranışlarının özelliğine göre ihaleyi yapan bakanlık veya ilgili bakanlık tarafından, haklarında bir yıla kadar bütün ihalelere katılmaktan yasaklama kararı verilir. Kararı veren idareler, bu kararı, Resmi Gazete'de ilan ettirirler. Bu kararlar ilgililerin müteahhitlik siciline de işlenir. İhalelere katılmaktan yasaklananlar, yasaklı oldukları süre içinde diğer idarelerce yapılacak ihalelere de müteahhit veya müşteri sıfatıyla katılamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Haklarında bu yolda işlem yapılanların sermayesinin çoğunluğuna sahip bulunduğu tespit edilen tüzel kişilere de aynı müeyyide uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Üzerine ihale yapıldığı halde usulüne göre sözleşme yapmayan istekliler ile sözleşme yapıldıktan sonra taahhüdünden vazgeçen ve mücbir sebepler dışında taahhüdünü sözleşme ve şartname hükümlerine uygun olarak yerine getirmeyen müteahhit veya müşteriler hakkında da, ihaleyi yapan bakanlık veya ilgili bakanlık tarafından, bir yıla kadar ihalelere katılmaktan yasaklama kararı verilir ve bu kararlar Resmi Gazete'de ilan ettirildiği gibi ilgililerin müteahhitlik sicillerine işlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>83 üncü maddede belirtilen fiil veya davranışlarda bulunanlar hariç olmak üzere, Türkiye genelinde faaliyet gösteren tüzel kişilerden; şube personeli, vekil, mümessil gibi yetkili temsilcilerin şahsi kusurlarından kaynaklanan ve bu maddenin üçüncü fıkrasında belirtilen fiil veya davranışları sebebiyle haklarında ihalelere katılmaktan yasaklama kararı verilmesi gerektiği idarece tespit edilenlerden, verilecek bir aylık süre içinde ihale bedelinin üç katı tutarında tazminatı peşin olarak ödeyenler hakkında ihaleden yasaklama kararı verilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İhaleyi yapan idareler, ihalelere katılmaktan yasaklamayı gerektirir bir durumla karşılaştıkları takdirde, gereğinin yapılması için bu durumu ilgili bakanlığa bildirmekle yükümlüdürler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="85" başlık="Ceza sorumluluğu ve sonuçları">
      <mvz-fıkra no="1">
        <template>83 üncü maddenin (c) bendinde yazılı fiil ve davranışları bu durumları iş tamamlandıktan ve kabul işlemi yapıldıktan sonra anlaşılmış olsa dahi tespit edilenler ile, o işteki ortak veya vekilleri haklarında ceza kovuşturması yapılır; hükmolunacak ceza ile birlikte bir yıldan üç yıla kadar bütün ihalelere girmekten mahkeme kararı ile yasaklanırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamına giren işlerden dolayı haklarında Türk Ceza Kanununun 342 nci maddesi ile son soruşturmanın açılmasına karar verilen müteahhitlere, yargılama sonuna kadar, hiçbir suretle yeni iş verilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanun kapsamına giren işlerden dolayı haklarında Türk Ceza Kanununun 339 340 ıncı maddeleri ile son soruşturmanın açılmasına karar verilen kontrol teşkilatı mensupları, yargılama sonuna kadar görevden uzaklaştırılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Türk Ceza Kanununun İkinci Kitabının Üçüncü Babının Üçüncü Faslında yer alan rüşvet verme suçu ile 339, 340 ve 342 nci maddelerine göre, bu Kanun kapsamındaki suçlar nedeniyle haklarında tekerrür hükümleri uygulananlar, mesleklerini icradan men olunurlar ve herhangi bir ad altında müteahhitlik yapamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu mahkümiyete ilişkin kararlar, ilgililerin meslek ve müteahhitlik sicillerine işlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="86" başlık="Görevlilerin Sorumluluğu">
      <mvz-fıkra no="1">
        <template>İhale, muayene ve kabul komisyon veya heyetlerinin başkan ve üyeleri ile diğer ilgililer, görevlerini kanuni gereklere göre tarafsızlıkla yapmadıkları ve taraflardan birinin zararına yol açacak ihmal ve kusurlu hareketlerde bulunduklarının tespiti halinde haklarında disiplin cezası uygulanacağı gibi, fiil ve davranışlarının özelliğine göre ceza kovuşturması da yapılır. Ayrıca, tarafların bu yüzden uğradıkları zarar ve ziyan da kendilerine ödettirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="87" başlık="Hileli inşaat ve onarım">
      <mvz-fıkra no="1">
        <template>Gayrimenkullerin yapım ve onarımlarında kesin kabul tarihinden itibaren 5 yıl içinde malzemenin hileli olmasından veya yapım ve onarımın teknik icaplara uygun olarak yapılmamasından ortaya çıkan zarar ve ziyan, Borçlar Kanununun 360 ıncı maddesi gereğince ve 363 üncü maddesindeki sürede müteahhide ikmal ve tazmin ettirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İdareler beş yıllık sürede ortaya çıkacak zarar ve noksanları tespit ile gereğinin yapılması için durumu ilgili mercilere bildirmekle ödevlidirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşin nezareti kendisine tevdi edilen mühendis, mimar ve memurlar hakkında da ayrıca bu Kanunun 86 ncı maddesi uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Çeşitli Hükümler">
    <mvz-madde no="88" başlık="Erken bitirme primi">
      <mvz-fıkra no="1">
        <template>Şartname ve sözleşmesinde tespit edilecek sürelerden önce tamamlanmasında idarelerce yarar görülen yapım işlerinde, esasları şartnamede tespit edilmek üzere müteahhitlere erken bitirme primi verilebilir. Süre uzatımı verilen işlerde hiç bir surette bu tür prim verilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="89" başlık="Özelliği bulunan işler">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerinin uygulanmasının mümkün olamayacağı haller ile, Türk Silahlı Kuvvetlerinin ve Emniyet Genel Müdürlüğünün yeniden teşkilatlanması, silah, araç ve gereçlerinin modern teknik gelişmelere uygun şekilde yenileştirilmesi ve Türk Silahlı Kuvvetlerinin Stratejik Hedef Planının gerçekleşmesi için temin edilecek mal ve hizmetlerin ihalesinde; ilgili bakanlığın teklif edeceği ihaleler için bu Kanun hükümleri dışında kalınmasına Cumhurbaşkanınca karar verilebilir. Bu ihalelerde uygulanacak usul ve esaslar idarelerince hazırlanarak ilgili bakanın onayı ile belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="90" başlık="Tarım ve orman ürünlerinde tercihli usuller ve tekel maddelerine ilişkin özel hükümler">
      <mvz-fıkra no="1">
        <template>Tarım ve orman ürünlerinin üretim, imal, kesme, toplama, taşıma gibi işlerinde ve bu ürünlerin satışlarında uygulanacak tercihli usullerle, tekel maddelerinin satımı ve tekelle ilgili ürünlerin üreticiden alımı hakkında, özel kanunlardaki hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="91" başlık="Muayene ve kabul işlemleri">
      <mvz-fıkra no="1">
        <template>Teslim edilen mal, hizmet, yapım veya yapılan işin muayene ve kabul işlemleri, idarelerce kurulacak en az üç kişilik muayene ve kabul heyetleri tarafından yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Muayene ve kabul işlemlerinin nasıl yapılacağı Cumhurbaşkanınca çıkarılacak bir yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="92" başlık="Sürelerin hesabı">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yazılı sürelerin hesaplanmasında hüküm bulunmayan hallerde, Borçlar Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="93" başlık="Tebligat">
      <mvz-fıkra no="1">
        <template>Bu Kanunda hüküm bulunmayan hallerde yapılacak tebliğler hakkında Tebligat Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="Son Hükümler">
    <mvz-madde no="1" başlık="Yerel yönetimlerin taşınmazlarının satışı" tür="Ek">
      <mvz-fıkra no="1">
        <template>İl özel idareleri ve belediyeler ile bunlar tarafından kurulan mahalli idare birliklerine ait taşınmazların satış bedeli peşin veya taksitle ödenebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Satış bedelinin taksitle ödenebileceği hususunun ihale ilanında belirtilmesi ve ihale üzerinde kalan isteklinin talep etmesi durumunda, ihale sonucu belirlenen satış bedeli; en az %25’i peşin, kalanı en fazla iki yılda ve en fazla 12 taksitle kanuni faiz ile birlikte ödenir. İhale ilanında ödeme şekli, taksit süresi ve sayısı belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Taksitli satışlarda taşınmazın satış bedelinden tahsil edilen peşinat düşüldükten sonra kalan tutar ile kanuni faizden ve sözleşmeden doğacak alacakların tamamını karşılayacak tutarda kesin ve süresiz banka teminat mektubu verilmesi veya satışı yapılan taşınmazın üzerinde 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanunu hükümleri uyarınca idare lehine kanuni ipotek tesis edilmesi halinde, taşınmaz tapuda alıcısı adına devredilir. Bu fıkra uyarınca teminat mektubu verilememesi veya kanuni ipotek tesis edilememesi durumunda taksitlerin tamamı ödenene kadar alıcı adına tapuda taşınmaz devri yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Alıcısı adına mülkiyet devri yapılmayan taşınmazlara ilişkin taksitli satışlarda, alıcı tarafından yükümlülüklerin yerine getirilmemesi durumunda, tahsil edilen tutarlardan ihale sırasında alınan geçici teminata isabet eden tutar ilgili idareye irat kaydedilerek kalanı alıcıya aynen iade edilir. Alıcısı adına mülkiyet devri yapılan taşınmazlara ilişkin taksitli satışlarda, alıcı tarafından yükümlülüklerin yerine getirilmemesi durumunda ise idarece, teminat mektubu paraya çevrilerek veya ipoteğin paraya çevrilmesi yoluyla takip yapılarak kalan borç faiziyle birlikte tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Vadesinde ödenmeyen taksit tutarları, 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 51 inci maddesine göre hesaplanacak faizle birlikte tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Satış, kira, trampa ve sınırlı ayni hak tesisi işlemleri ihalelerinde ihale konusu olan taşınmazın tahmin edilen bedelinin %3’ünden az olmamak üzere %30’una kadar geçici teminat alınabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esasları belirlemeye ve tereddütleri gidermeye Çevre, Şehircilik ve İklim Değişikliği Bakanlığı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Başlamış olan işler" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce ilanı yapılmak suretiyle başlamış olan ihale işlemleri ilgili olduğu kanun ve usullere göre sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tüzük ve yönetmelikler" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre çıkarılacak tüzük, şartname esasları ve yönetmelikler Kanunun yayımlandığı tarihten itibaren altı ay içinde hazırlanır ve Resmi Gazete ile yayımlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bunların yürürlüğe konulmasına kadar idareler, mevcut esaslar ve yönetmelik hükümlerini uygulamaya devam ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Terkin edilecek ecrimisiller" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce tespit ve takdir edilen, tebliğ edilen veya tahakkuk ettirilen ecrimisil alacaklarının tespit tarihinden geriye doğru beş yılı aşan kısmı hangi aşamada olursa olsun düzeltilir veya terkin edilir, tahsil edilmiş olanlar iade edilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce, 83 üncü maddede belirtilen fiil veya davranışlarda bulunanlar hariç olmak üzere, Türkiye genelinde faaliyet gösteren tüzel kişilerden; şube personeli, vekil, mümessil gibi yetkili temsilcilerin şahsi kusurlarından kaynaklanan ve 84 üncü maddenin üçüncü fıkrasında belirtilen fiil veya davranışları sebebiyle haklarında ihalelere katılmaktan yasaklama kararı verilmesi gerektiği idarece tespit edilenlerden henüz yasaklama kararı verilememiş olanlar hakkında da 84 üncü maddenin dördüncü fıkrası hükmü uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
