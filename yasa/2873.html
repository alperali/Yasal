  <mvz-künye tür="kanun" no="2873" başlık="MİLLİ PARKLAR KANUNU"
             tarih="9/8/1983" rgazete-tarih="11/8/1983" rgazete-sayı="18132"
             düstur-tertip="5" düstur-cilt="22" düstur-sayfa="508" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, yurdumuzdaki milli ve milletlerarası düzeyde değerlere sahip milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanlarının seçilip belirlenmesine, özellik ve karakterleri bozulmadan korunmasına, geliştirilmesine ve yönetilmesine ilişkin esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yer alan;</template>
        <mvz-bent no="a">
          <template>Milli park; bilimsel ve estetik bakımından, milli ve milletlerarası ender bulunan tabii ve kültürel kaynak değerleri ile koruma, dinlenme ve turizm alanlarına sahip tabiat parçalarını.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tabiat parkları; bitki örtüsü ve yaban hayatı özelliğine sahip, manzara bütünlüğü içinde halkın dinlenme ve eğlenmesine uygun tabiat parçalarını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Tabiat anıtı; tabiat ve tabiat olaylarının meydana getirdiği özelliklere ve bilimsel değere sahip ve milli park esasları dahilinde korunan tabiat parçalarını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Tabiatı koruma alanı; bilim ve eğitim bakımından önem taşıyan nadir, tehlikeye maruz veya kaybolmaya yüz tutmuş ekosistemler, türler ve tabii olayların meydana getirdiği seçkin örnekleri ihtiva eden ve mutlak korunması gerekli olup sadece bilim ve eğitim amaçlarıyla kullanılmak üzere ayrılmış tabiat parçalarını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Belirleme, Planlama ve Kamulaştırma">
    <mvz-madde no="3" başlık="Milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanlarının belirlenmesi">
      <mvz-fıkra no="1">
        <template>Orman ve Su İşleri Bakanlığınca millî park karakterine sahip olduğu tespit edilen alanlar, Cumhurbaşkanı kararı ile millî park olarak belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Orman ve orman rejimine tabi yerlerde tabiat parkı, tabiat anıtı ve tabiatı koruma alanları Orman ve Su İşleri Bakanının onayı ile belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Orman ve orman rejimi dışında kalan yerlerde tabiat parkı, tabiat anıtı ve tabiatı koruma alanı belirlenmesine veya Orman ve Su İşleri Bakanlığınca belirlenmiş olanların işlemlerinin tamamlanması için gerekli yerlerin orman rejimine alınmasına Cumhurbaşkanınca karar verilir ve bu alanlar Çevre ve Şehircilik Bakanlığınca tescil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="İşletme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre milli park olarak belirlenen yerlerin özellik ve nitelikleri gözönünde tutularak, koruma ve kullanma amaçlarını gerçekleştirmek üzere, kuruluş, geliştirme ve işletilmelerini kapsayan gelişme planı, ilgili bakanlıkların olumlu görüşleri ve gerektiğinde fiili katkılarıyla, Orman ve Su İşleri Bakanlığınca hazırlanır ve yürürlüğe konur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Gelişme planı uyarınca iskan ve yapılaşmaya konu olacak yerler için, imar mevzuatına göre imar uygulama planları, milli park gelişme planı hüküm ve kararlarına uygun olarak hazırlanır veya hazırlattırılarak Çevre ve Şehircilik Bakanlığının onayı ile yürürlüğe konulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Üçüncü madde hükümleri uyarınca tabiat parkı, tabiat anıtı ve tabiatı koruma alanı olarak belirlenen yerler için gerekli projeler, Kültür ve Turizm Bakanlığının görüşü alınarak Orman ve Su İşleri Bakanlığınca hazırlanır ve yürürlüğe konur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanun kapsamına giren yerlerdeki turizm bölge, alan ve merkezlerinde, turizm yatırımlarına ilişkin plan kararları Çevre ve Şehircilik ile Orman ve Su İşleri Bakanlıklarının görüşü alınarak sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Kamulaştırma">
      <mvz-fıkra no="1">
        <template>Milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanı sınırları içinde kalan yerlerdeki gerçek ve tüzelkişilere ait taşınmaz mallar ile her türlü tesisler, onaylı uygulama imar planına göre hazırlanacak projelerin gerçekleşmesi için, gerekli görüldüğünde, 6830 sayılı İstimlak Kanunu hükümlerine göre, Orman ve Su İşleri Bakanlığınca kamulaştırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Taşınmazların tahsisi">
      <mvz-fıkra no="1">
        <template>Milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanı içinde kalıp da, bu Kanunun uygulanması için gerekli olanlardan;</template>
        <mvz-bent no="a">
          <template>Hazineye ait taşınmaz mallar,  Orman ve Su İşleri Bakanlığının talebi üzerine,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Devletin hüküm ve tasarrufu altında bulunan yerler, resen Hazine adına tescilini takiben,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yukarıdaki (a) ve (b) bentlerinde belirlenenler dışında, kamu idareleri ile kamu kurum ve kuruluşlarına ait taşınmaz mallar ve irtifak hakları, 6830 sayılı İstimlak Kanununun 30 uncu maddesi uyarınca, belirlenecek bedelin ödenmesi şartıyla,</template>
        </mvz-bent>
        <mvz-bent no="d" durum="mülga">
          <template></template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Tahsis edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="İzin İşleri">
    <mvz-madde no="7" başlık="Kamu kurum ve kuruluşlarına verilecek izinler">
      <mvz-fıkra no="1">
        <template>Milli park veya tabiat parklarında, planlarına uygun olması şartıyla, kamu kurum ve kuruluşları tarafından yapılacak her türlü plan, proje ve yatırımlara Orman ve Su İşleri Bakanlığınca izin verilebilir ve uygulamalar bu Kanun hükümlerine göre denetlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak; bu Kanun kapsamına giren yerlerde tarihi ve arkeolojik sahalarda kazı, restorasyon ve bilimsel araştırmalar Kültür ve Turizm Bakanlığının iznine tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Gerçek ve özel hukuk tüzelkişilerine verilecek izinler">
      <mvz-fıkra no="1">
        <template>Turizm bölge, alan ve merkezleri dışında kalan milli parklar ve tabiat parklarında kamu yararı olmak şartıyla ve plan dahilinde, turistik amaçlı bina ve tesisler yapmak üzere gerçek ve özel hukuk tüzelkişileri lehine Maliye Bakanlığının görüşü alınarak Orman ve Su İşleri Bakanlığınca izin verilebilir. Bu izin üzerine gerçek ve özel hukuk tüzelkişileri lehine tesis edilecek intifa hakkı süresi kırkdokuz yılı geçemez. Bu süre sonunda bütün tesisler eksiksiz olarak Hazineye devredilir. Ancak, işletmesinin başarılı olduğu Kültür ve Turizm Bakanlığınca belgelenen hak sahiplerinin intifa hakkı, Orman ve Su İşleri Bakanlığınca tesisin rayiç değeri üzerinden belirlenecek bedelle doksandokuz seneye kadar uzatılabilir. Bu durumda Hazineye devir işlemi bu uzatma sonunda yapılır. Milli park ve tabiat parklarının gelişme planları kesinleşmeden bu Kanunda sözü edilen izin verilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Hakların devri">
      <mvz-fıkra no="1">
        <template>Orman ve Su İşleri Bakanlığınca kamu kurum ve kuruluşları ile gerçek ve özel hukuk tüzelkişileri lehine tesis olunan intifa hakları ve bu haklara dayanılarak yapılan ve yapılmakta olan tesislerin üçüncü şahıslara devri, Orman ve Su İşleri Bakanlığının muvafakatına bağlıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="İzin verilmeyecek yerler">
      <mvz-fıkra no="1">
        <template>Tabiat anıtları ve tabiatı koruma alanlarında 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanununun ilgili hükümleri saklı kalmak kaydıyla kullanma izni verilemez veya irtifak hakkı tesis edilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Petrol ve madenlerin aranması ve işletilmesi için izin verilmesi">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerde maden ve petrol kanunları gereğince araştırma ve işletme ruhsatnamesi veya imtiyazı, 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanununun ilgili hükümleri saklı kalmak kaydıyla Cumhurbaşkanı kararı ile verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Araştırma ve işletme faaliyetlerinde bu yerlerin korunması amacıyla riayet edilecek hususlar Orman ve Su İşleri Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Görevler">
    <mvz-madde no="12" başlık="Yapı ve tesisler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 7 nci ve 8 inci madde hükümleri saklı kalmak kaydıyla, milli parklar, tabiat parkları, tabiat anıtları ve tabiatı koruma alanlarındaki planların gerektirdiği her türlü hizmet ve faaliyetler ile koruma, yönetim, işletme, tanıtım, sportif, eğlenme ve dinlenme hizmetleri için gerekli her türlü altyapı, üstyapı ve diğer tesisler Orman ve Su İşleri Bakanlığınca yapılır veya yaptırılır, yönetilir veya işletilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Kaynakların geliştirilmesi">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerdeki ormanlarda, makilik ve fundalıklarda ve diğer arazi kullanma şekillerinde, koruma ve çok taraflı kullanımı esas tutan orman amenajman planlarına dayanılarak, tabiat varlıklarının korunmasını, geliştirilmesini ve devamlılığını sağlayacak teknik faaliyetler yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tabii çevre ve ekosistemlerin korunması ve iyileştirilmesi yönünden teknik ve bilimsel gereklere göre, Orman ve Su İşleri Bakanlığınca düzenlenecek rapora dayanılarak hazırlanacak özel amenajman planları uyarınca belirli yerlerde ve belirli sürelerde üretim, avlanma ve otlatma faaliyetlerine izin verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Koruma">
    <mvz-madde no="14" başlık="Yasaklanan faaliyetler">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerde;</template>
        <mvz-bent no="a">
          <template>Tabii ve ekolojik denge ve tabii ekosistem değeri bozulamaz,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yaban hayatı tahrip edilemez,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu sahaların özelliklerinin kaybolmasına veya değiştirilmesine sebep olan veya olabilecek her türlü müdahaleler ile toprak, su ve hava kirlenmesi ve benzeri çevre sorunları yaratacak iş ve işlemler yapılamaz,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Tabii dengeyi bozacak her türlü orman ürünleri üretimi, avlanma ve otlatma yapılamaz,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Onaylanmış planlarda belirtilen yapı ve tesisler ve Genelkurmay Başkanlığınca ihtiyaç duyulacak savunma sistemi için gerekli tesisler dışında kamu yararı açısından vazgeçilmez ve kesin bir zorunluluk bulunmadıkça her ne suretle olursa olsun hiçbir yapı ve tesis kurulamaz ve işletilemez veya bu alanlarda var olan yerleşim sahaları dışında iskan yapılamaz.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Tescil yasağı">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerdeki kamu idareleri, kamu kurum ve kuruluşları ve Hazineye ait taşınmaz mallar ile Devletin hüküm ve tasarrufu altında bulunan yerlerdeki mevcut açıklıkların ve var olan ağaçların, bitki örtüsünün yanması, her ne sebeple olursa olsun kesilmesi, sökülmesi, boğulması, budanması sonunda oluşacak açıklıkların ve arazinin çeşitli şekillerde düzeltilmesi suretiyle elde edilecek sahaların işgali, kullanılması, bu yerlere her türlü yapı ve tesis yapılması, bu yapı ve tesislerin tapuya tescili yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu gibi yapı ve tesislere hiçbir kayıt ve şart aranmadan doğrudan doğruya Orman ve Su İşleri Bakanlığınca el konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Koruma görevlileri ve alan kılavuzları">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren alanlarda; koruma hizmetleri ve suçların takibi 6831 sayılı Orman Kanununun beşinci fasıl dördüncü bölümünde yer alan suçların takibi ile ilgili hükümlere istinaden; orman muhafaza memurlarınca sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamına giren alanların kaynak değerlerinin korunarak kullanılmasına imkân sağlamak amacıyla uzun devreli gelişim planlarına uygun olarak yapılan ziyaretçi yönetim plânlarının etkin bir şekilde uygulanması ve korunan alanlara gelen ziyaretçilerin doğru bilgilendirilmesi bakımından ve korunan alan yönetiminden olumsuz etkilenen yöre insanının kayıplarının en aza indirilmesine imkân sağlanmak üzere, korunan alan sınırları dâhilinde ve yakın çevresinde yaşayan yöre insanının alan kılavuzu olarak yetiştirilmeleri konusunda Orman ve Su İşleri Bakanlığı ilgili kurum ve kuruluşlarla işbirliği içerisinde gerekli çalışmaları yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Eğitime alınacak alan kılavuzu adaylarının seçimi, eğitimleri, eğitim sonunda başarılı olanların görevlendirilmeleri ve çalışmalarına ilişkin esas ve usûller Çevre ve Orman Bakanlığınca çıkarılacak bir yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Altıncı Bölüm">
    <mvz-madde no="17" başlık="Döner sermaye gelirleri">
      <mvz-fıkra no="1">
        <template>Bu Kanuna tabi alanlardan elde edilecek gelirler, Orman ve Su İşleri Bakanlığı döner sermayesine gelir kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Fon gelirleri" durum="mülga">
    </mvz-madde>
    <mvz-madde no="19" başlık="Fonun kullanılması" durum="mülga">
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Cezalar">
    <mvz-madde no="20" başlık="">
      <mvz-fıkra no="1">
        <template>6831 sayılı Orman Kanunu ile 4915 sayılı Kara Avcılığı Kanunu ve 1380 sayılı Su Ürünleri Kanununda yasaklanan fiillerin bu Kanunun uygulandığı yerlerde işlenmesi halinde, cezalar bir misli artırılarak hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yazılı yasaklamalara ve mecburiyetlere aykırı hareket edenler hakkında, fiilleri daha ağır bir cezayı gerektirmediği takdirde, altı aya kadar hapis veya adlî para cezasına hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Son Hükümler">
    <mvz-madde no="22" başlık="Yönetmelikler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren altı ay içerisinde;</template>
        <mvz-bent no="a">
          <template>Bu Kanunun uygulanmasına ilişkin şekil ve esasları, görev, yetki ve sorumlulukları belirleyen yönetmelik Çevre ve Şehircilik ve Kültür ve Turizm Bakanlıklarının görüşleri alınarak Orman ve Su İşleri Bakanlığınca,</template>
        </mvz-bent>
        <mvz-bent no="b" durum="mülga">
          <template></template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Çıkarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yönetmelikler Resmi Gazate'de yayımlanarak yürürlüğe konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Uygulanmayan ve kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulandığı yerlerde, 6831 sayılı Orman Kanununun ek 3 üncü maddesinin (A) fıkrasının (c) bendi hükmü uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>20/3/1950 tarihli ve 5614 sayılı Abant Gölü Çevresinin Bolu Özel İdaresine Temlikine Dair Kanun yürürlükten kaldırılmıştır. Abant gölü çevresi Devlet ormanı olarak 6831 sayılı Orman Kanunu hükümlerine göre yönetilir ve işletilir. Ancak bu yerlerde mevcut yapı ve tesisler üzerinde Bolu Özel İdaresi ile diğer gerçek ve tüzelkişilerin kazanılmış hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki yerlerde mevcut yerleşim merkezlerinde ikamet edenler dışında bu yerlere gelen ziyaretçiler tarafından giriş kontrol merkezlerinde veya sahalar içindeki idare ve ziyaretçi merkezlerinde ödenecek olan ücretlere ilişkin usul ve esaslar Orman ve Su İşleri Bakanlığı tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Orman ve Su İşleri Bakanlığınca işletilen bu Kanuna tabi yerlerde giriş ücretini ödemeden giriş yaptığı tespit edilenlere Orman ve Su İşleri Bakanlığı bölge müdürlerince bu maddenin birinci fıkrasında belirlenen giriş ücretinin on katı tutarında idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Giriş ücretleri ve bu maddenin ikinci fıkrasında belirtilen idari para cezaları ilgiliye tebliğ tarihinden itibaren bir ay içinde ödenir. Bu sürede ödenmeyen giriş ücretleri ve idari para cezaları 21/7/1953 tarihli ve 6183 sayılı Âmme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre ilgili vergi dairesi tarafından takip ve tahsil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerde evvelce verilmiş kullanma izni, intifa ve irtifak hakları, geçerlilik süresi bitimine kadar sahibi tarafından kullanılmak üzere bu Kanun hükümlerine göre yeniden düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Tarım ve Orman Bakanlığında Doğa Koruma ve Milli Parklar Döner Sermayeli İşletmeleri olarak faaliyetlerini sürdüren döner sermaye işletmeleri, Doğa Koruma ve Milli Parklar Genel Müdürlüğü Döner Sermayeli İşletmeleri olarak faaliyetlerine devam eder. Tarım ve Orman Bakanlığı Doğa Koruma ve Milli Parklar Döner Sermayeli İşletmelerine ait kadro ve pozisyonlarında çalışmakta olan mevcut personel kadro ve pozisyonları ile birlikte hiçbir işleme gerek kalmaksızın Doğa Koruma ve Milli Parklar Genel Müdürlüğü Döner Sermayeli İşletmelerine devredilmiş sayılır. Tarım ve Orman Bakanlığı Doğa Koruma ve Milli Parklar Döner Sermayeli İşletmelerine ait her türlü taşınır, taşınmaz, taşıt, araç, gereç, malzeme, demirbaş, yazılı ve elektronik ortamdaki her türlü kayıt ve doküman ile yazılım uygulamaları, veri tabanı ve hizmet sunucuları, hizmetlerden doğan borç ve alacaklar ile hak ve yükümlülükler hiçbir işleme gerek kalmaksızın Doğa Koruma ve Milli Parklar Genel Müdürlüğü Döner Sermayeli İşletmelerine devredilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Doğa Koruma ve Milli Parklar Genel Müdürlüğünün merkez ve taşra teşkilatlanması tamamlanıncaya kadar bu maddenin yayımı tarihinden itibaren beş yılı geçmemek üzere muhasebe hizmetlerini Hazine ve Maliye Bakanlığı yürütmeye devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
