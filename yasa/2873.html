  <mvz-künye tür="kanun" no="2873" başlık="MİLLİ PARKLAR KANUNU"
             tarih="9/8/1983" rgazete-tarih="11/8/1983" rgazete-sayı="18132"
             düstur-tertip="5" düstur-cilt="22" düstur-sayfa="508" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, yurdumuzdaki milli ve milletlerarası düzeyde değerlere sahip milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanlarının seçilip belirlenmesine, özellik ve karakterleri bozulmadan korunmasına, geliştirilmesine ve yönetilmesine ilişkin esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yer alan;</template>
        <mvz-bent no="a">
          <template>Milli park; bilimsel ve estetik bakımından, milli ve milletlerarası ender bulunan tabii ve kültürel kaynak değerleri ile koruma, dinlenme ve turizm alanlarına sahip tabiat parçalarını.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tabiat parkları; bitki örtüsü ve yaban hayatı özelliğine sahip, manzara bütünlüğü içinde halkın dinlenme ve eğlenmesine uygun tabiat parçalarını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Tabiat anıtı; tabiat ve tabiat olaylarının meydana getirdiği özelliklere ve bilimsel değere sahip ve milli park esasları dahilinde korunan tabiat parçalarını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Tabiatı koruma alanı; bilim ve eğitim bakımından önem taşıyan nadir, tehlikeye maruz veya kaybolmaya yüz tutmuş ekosistemler, türler ve tabii olayların meydana getirdiği seçkin örnekleri ihtiva eden ve mutlak korunması gerekli olup sadece bilim ve eğitim amaçlarıyla kullanılmak üzere ayrılmış tabiat parçalarını,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Alan kılavuzu; korunan alanlarda ziyaretçi yönetimi için, alan sınırları dâhilinde ve yakın çevresinde yaşayan yöre insanları arasından Genel Müdürlükçe verilen eğitimi tamamlayarak kimlik almaya hak kazanmış kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Av ve doğa koruma memuru; bu Kanun ve Genel Müdürlüğün görev ve yetkilerinin düzenlendiği diğer mevzuat hükümleri çerçevesinde, mevzuata aykırılık oluşturan fiillerin takibi, biyolojik çeşitliliğin korunması, av ve yaban hayvanlarının bakımı, gözlenmesi ve sayımına yönelik gerekli işleri yapmak ve denetim faaliyetleri ile diğer faaliyetleri yürütmek üzere Genel Müdürlükçe çıkarılacak yönetmelikle belirlenen usul ve esaslar doğrultusunda eğitilen ve görevlendirilen Genel Müdürlük personelini,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Bakanlık; Tarım ve Orman Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Genel Müdürlük; Doğa Koruma ve Milli Parklar Genel Müdürlüğünü,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Belirleme, Planlama ve Kamulaştırma">
    <mvz-madde no="3" başlık="Milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanlarının belirlenmesi">
      <mvz-fıkra no="1">
        <template>Bakanlıkça millî park karakterine sahip olduğu tespit edilen alanlar, Cumhurbaşkanı kararı ile millî park olarak belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Orman ve orman rejimine tabi yerlerde tabiat parkı, tabiat anıtı ve tabiatı koruma alanları Tarım ve Orman Bakanının onayı ile belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Orman ve orman rejimi dışında kalan yerlerde tabiat parkı, tabiat anıtı ve tabiatı koruma alanı belirlenmesine veya Bakanlıkça belirlenmiş olanların işlemlerinin tamamlanması için gerekli yerlerin orman rejimine alınmasına Cumhurbaşkanınca karar verilir ve bu alanlar Çevre, Şehircilik ve İklim Değişikliği Bakanlığınca tescil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Planlama">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanı olarak belirlenen yerlerin özellik ve nitelikleri göz önünde tutularak, koruma ve kullanma amaçlarını gerçekleştirmek üzere, kuruluş, geliştirme ve işletilmelerini kapsayan uzun devreli gelişme planı, gelişme planı ve yönetim planı, ilgili bakanlıkların görüşleri alınarak Genel Müdürlükçe hazırlanır veya hazırlattırılır ve yürürlüğe konur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Planları uyarınca iskan ve yapılaşmaya konu olacak yerler için, imar mevzuatına göre imar planları, milli park ve tabiat parkı gelişme planı hüküm ve kararlarına uygun olarak hazırlanır veya hazırlattırılarak Çevre, Şehircilik ve İklim Değişikliği Bakanlığının onayı ile yürürlüğe konulur..</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanun kapsamına giren yerlerdeki kültür ve turizm koruma ve gelişim bölgeleri ile turizm merkezlerinde, turizm yatırımlarına ilişkin plan kararları Genel Müdürlüğün olumlu görüşü alınarak 12/3/1982 tarihli ve 2634 sayılı Turizmi Teşvik Kanunu uyarınca sonuçlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanlarının planlarına ilişkin usul ve esaslar Genel Müdürlükçe çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Kamulaştırma">
      <mvz-fıkra no="1">
        <template>Milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanı sınırları içinde kalan yerlerdeki gerçek ve tüzelkişilere ait taşınmaz mallar ile her türlü tesisler, onaylı uygulama imar planına göre hazırlanacak projelerin gerçekleşmesi için, gerekli görüldüğünde, 2942 sayılı Kamulaştırma Kanunu hükümlerine göre, Genel Müdürlükçe kamulaştırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Taşınmazların tahsisi">
      <mvz-fıkra no="1">
        <template>Milli park, tabiat parkı, tabiat anıtı ve tabiatı koruma alanı içinde kalıp da, bu Kanunun uygulanması için gerekli olanlardan;</template>
        <mvz-bent no="a">
          <template>Hazineye ait taşınmaz mallar, Genel Müdürlüğün talebi üzerine,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Devletin hüküm ve tasarrufu altında bulunan yerler, resen Hazine adına tescilini takiben,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yukarıdaki (a) ve (b) bentlerinde belirlenenler dışında, kamu idareleri ile kamu kurum ve kuruluşlarına ait taşınmaz mallar ve irtifak hakları, 2942 sayılı Kamulaştırma Kanununun 30 uncu maddesi uyarınca, belirlenecek bedelin ödenmesi şartıyla,</template>
        </mvz-bent>
        <mvz-bent no="d" durum="mülga">
          <template></template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Tahsis edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="İzin İşleri">
    <mvz-madde no="7" başlık="Kamu kurum ve kuruluşlarına verilecek izinler">
      <mvz-fıkra no="1">
        <template>Milli park veya tabiat parklarında, planlarına uygun olması şartıyla, kamu kurum ve kuruluşları tarafından yapılacak her türlü plan, proje ve yatırımlara Genel Müdürlükçe izin verilebilir ve uygulamalar bu Kanun hükümlerine göre denetlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak; bu Kanun kapsamına giren yerlerde tarihi ve arkeolojik sahalarda kazı, restorasyon ve bilimsel araştırmalar Kültür ve Turizm Bakanlığının iznine tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Gerçek ve özel hukuk tüzelkişilerine verilecek izinler">
      <mvz-fıkra no="1">
        <template>Kültür ve Turizm Koruma ve Gelişim Bölgeleri ile Turizm Merkezleri  dışında kalan milli parklar ve tabiat parklarında kamu yararı olmak şartıyla ve plan dahilinde, turistik amaçlı bina ve tesisler yapmak üzere gerçek ve özel hukuk tüzelkişileri lehine Çevre, Şehircilik ve İklim Değişikliği Bakanlığının  görüşü alınarak Bakanlıkça izin verilebilir. Bu izin üzerine gerçek ve özel hukuk tüzelkişileri lehine tesis edilecek intifa hakkı süresi kırkdokuz yılı geçemez. Bu süre sonunda bütün tesisler eksiksiz olarak Genel Müdürlüğün tasarrufuna geçer. Ancak, işletmesinin başarılı olduğu Kültür ve Turizm Bakanlığınca belgelenen hak sahiplerinin intifa hakkı, Bakanlıkça tesisin rayiç değeri üzerinden belirlenecek bedelle doksandokuz seneye kadar uzatılabilir. Bu durumda Genel Müdürlüğe devir işlemi bu uzatma sonunda yapılır. Milli park ve tabiat parklarının gelişme planları kesinleşmeden bu Kanunda sözü edilen izin verilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Korunan alanın yönetimi için gerekli olan ve sadece korunan alana hizmet veren tesislere yönelik olarak verilecek izinlerden bedel alınmaz. Ancak milli park ve tabiat parklarında, planlarına uygun olması, kamu yararı ve zaruret olması halinde, ulaşım, elektrik iletim ve nakil hattı, petrol ve doğalgaz iletim hattı, trafo, haberleşme, su, termal su, atık su, altyapı ve bunlarla ilgili yapı ve tesislerin yapılması maksadıyla gerçek kişiler ve özel hukuk tüzelkişileri lehine bedeli mukabilinde Bakanlıkça izin verilebilir, verilen izinler amacı dışında kullanılamaz ve uygulamalar bu Kanun hükümlerine göre denetlenir. İçme suyu temini açısından yapımı aciliyet gösteren ve kamu yararı açısından vazgeçilmez ve kesin bir zorunluluk arz eden tesisler için uzun devreli gelişme planı/gelişme planı şartı aranmaz. İlgili kurumların görüşleri alındıktan sonra yapılan tesisler uzun devreli gelişme planlarına/gelişme planlarına işlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Verilecek olan izinlerle ilgili usul ve esaslar Genel Müdürlükçe çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Hakların devri">
      <mvz-fıkra no="1">
        <template>Bakanlıkça kamu kurum ve kuruluşları ile gerçek ve özel hukuk tüzelkişileri lehine tesis olunan intifa hakları ve bu haklara dayanılarak yapılan ve yapılmakta olan tesislerin üçüncü şahıslara devri, Bakanlığın muvafakatına bağlıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="İzin verilmeyecek yerler">
      <mvz-fıkra no="1">
        <template>Tabiat anıtları ve tabiatı koruma alanlarında 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanununun ilgili hükümleri saklı kalmak kaydıyla kullanma izni verilemez veya irtifak hakkı tesis edilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Petrol ve madenlerin aranması ve işletilmesi için izin verilmesi">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerde maden ve petrol kanunları gereğince araştırma ve işletme ruhsatnamesi veya imtiyazı, 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanununun ilgili hükümleri saklı kalmak kaydıyla Cumhurbaşkanı kararı ile verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Araştırma ve işletme faaliyetlerinde bu yerlerin korunması amacıyla riayet edilecek hususlar Genel Müdürlükçe belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Görevler">
    <mvz-madde no="12" başlık="Yapı ve tesisler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 7 nci ve 8 inci madde hükümleri saklı kalmak kaydıyla, milli parklar, tabiat parkları, tabiat anıtları ve tabiatı koruma alanlarındaki planların gerektirdiği her türlü hizmet ve faaliyetler ile koruma, yönetim, işletme, tanıtım, sportif, eğlenme ve dinlenme hizmetleri için gerekli her türlü altyapı, üstyapı ve diğer tesisler Genel Müdürlükçe yapılır veya yaptırılır, yönetilir veya işletilir ya da işlettirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Korunan alan olarak belirlenen yerler için planlarına uygun olarak gerekli projeler Genel Müdürlükçe hazırlanır veya hazırlattırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde kapsamındaki yapı ve tesislerin yapılaşma koşullarına ait usul ve esaslar Genel Müdürlükçe çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Kaynakların geliştirilmesi">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerdeki ormanlarda, makilik ve fundalıklarda ve diğer arazi kullanma şekillerinde, koruma ve çok taraflı kullanımı esas tutan orman amenajman planlarına dayanılarak, tabiat varlıklarının korunmasını, geliştirilmesini ve devamlılığını sağlayacak teknik faaliyetler yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tabii çevre ve ekosistemlerin korunması ve iyileştirilmesi yönünden teknik ve bilimsel gereklere göre, Genel Müdürlükçe düzenlenecek rapora dayanılarak hazırlanacak özel amenajman planları uyarınca belirli yerlerde ve belirli sürelerde üretim, avlanma ve otlatma faaliyetlerine izin verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Koruma">
    <mvz-madde no="14" başlık="Yasaklanan faaliyetler">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerde;</template>
        <mvz-bent no="a">
          <template>Tabii ve ekolojik denge ve tabii ekosistem değeri bozulamaz,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yaban hayatı tahrip edilemez,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu sahaların özelliklerinin kaybolmasına veya değiştirilmesine sebep olan veya olabilecek her türlü müdahaleler ile toprak, su ve hava kirlenmesi ve benzeri çevre sorunları yaratacak iş ve işlemler yapılamaz,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Tabii dengeyi bozacak her türlü orman ürünleri üretimi, avlanma ve otlatma yapılamaz,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Onaylanmış planlarda belirtilen yapı ve tesisler ve Genelkurmay Başkanlığınca ihtiyaç duyulacak savunma sistemi için gerekli tesisler dışında kamu yararı açısından vazgeçilmez ve kesin bir zorunluluk bulunmadıkça her ne suretle olursa olsun hiçbir yapı ve tesis kurulamaz ve işletilemez veya bu alanlarda var olan yerleşim sahaları dışında iskan yapılamaz.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Tescil yasağı">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerdeki kamu idareleri, kamu kurum ve kuruluşları ve Hazineye ait taşınmaz mallar ile Devletin hüküm ve tasarrufu altında bulunan yerlerdeki mevcut açıklıkların ve var olan ağaçların, bitki örtüsünün yanması, her ne sebeple olursa olsun kesilmesi, sökülmesi, boğulması, budanması sonunda oluşacak açıklıkların ve arazinin çeşitli şekillerde düzeltilmesi suretiyle elde edilecek sahaların işgali, kullanılması, bu yerlere her türlü yapı ve tesis yapılması, bu yapı ve tesislerin tapuya tescili yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu gibi yapı ve tesislere hiçbir kayıt ve şart aranmadan doğrudan doğruya Genel Müdürlükçe el konulur. Bu Kanun kapsamında el konulan bütün yapı ve tesisler, inşa aşamasında olanlar da dâhil olmak üzere, hiçbir karar alınmasına lüzum kalmaksızın, Genel Müdürlük tarafından derhal yıkılır veya ihtiyaç görüldüğü takdirde Genel Müdürlükçe değerlendirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Koruma görevlileri ve alan kılavuzları">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren alanlarda; koruma hizmetleri ve suçların takibi 6831 sayılı Orman Kanununun beşinci fasıl dördüncü bölümünde yer alan suçların takibi ile ilgili hükümlere istinaden; av ve doğa koruma memurları, saha bekçileri ve orman muhafaza memurlarınca sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde kapsamındaki av ve doğa koruma memurları, saha bekçileri ve orman muhafaza memurlarının çalışma usul ve esasları Genel Müdürlükçe çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanun kapsamına giren alanların kaynak değerlerinin korunarak kullanılmasına imkân sağlamak amacıyla uzun devreli gelişim planlarına uygun olarak yapılan ziyaretçi yönetim plânlarının etkin bir şekilde uygulanması ve korunan alanlara gelen ziyaretçilerin doğru bilgilendirilmesi bakımından ve korunan alan yönetiminden olumsuz etkilenen yöre insanının kayıplarının en aza indirilmesine imkân sağlanmak üzere, korunan alan sınırları dâhilinde ve yakın çevresinde yaşayan yöre insanının alan kılavuzu olarak yetiştirilmeleri konusunda Genel Müdürlük ilgili kurum ve kuruluşlarla işbirliği içerisinde gerekli çalışmaları yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Eğitime alınacak alan kılavuzu adaylarının seçimi, eğitimleri, eğitim sonunda başarılı olanların görevlendirilmeleri ve çalışmalarına ilişkin esas ve usûller Genel Müdürlükçe çıkarılacak bir yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Altıncı Bölüm">
    <mvz-madde no="17" başlık="Döner sermaye gelirleri">
      <mvz-fıkra no="1">
        <template>Bu Kanuna tabi alanlardan elde edilecek gelirler, Genel Müdürlük döner sermayesine gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel Müdürlük ihtiyaç duyduğu hallerde ve lüzum gördüğü yerlerde görev ve hizmetleriyle ilgili döner sermayeli işletmeler kurabilir. Döner sermaye işletmesine tahsis edilen sermaye miktarını beş katına kadar artırmaya Cumhurbaşkanı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşletmelerin faaliyet alanları, gelirleri, giderleri ve denetimi ile diğer hususlar Hazine ve Maliye Bakanlığının uygun görüşü alınarak Genel Müdürlükçe çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Gelirler">
      <mvz-fıkra no="1">
        <template>Genel Müdürlüğün gelirleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Genel bütçeden yapılacak Hazine yardımları.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu Kanun kapsamındaki korunan alanlarda el konularak mülkiyetin kamuya geçirilmesine karar verilen her çeşit taşınmaz ve sair eşyanın satışından elde edilen gelirler.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>9/8/1983 tarihli ve 2872 sayılı Çevre Kanunu kapsamındaki sulak alanlarda el konularak mülkiyetin kamuya geçirilmesine karar verilen her çeşit taşınmaz ve sair eşyanın satışından elde edilen gelirler.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Genel Müdürlüğün mülkiyetinde bulunan taşınır ve taşınmaz malların satışından veya kiraya verilmesinden elde edilen gelirler.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Taahhütlerini tamamen veya kısmen yerine getirmeyen yüklenicilerden alınan tazminatlar ile gelir kaydedilen teminatlar.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İhale şartnamesi ve dokümanı satışları ile analiz, denetim, danışmanlık, etüt, deney ve benzeri hizmetler karşılığı alınan gelirler.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Bu Kanun ile 4915 sayılı Kanun kapsamında verilen idari para cezalarının yüzde yirmi beşi.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Döner sermaye yıl sonu kârı.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Her türlü bağış, yardım ve vasiyetler.</template>
        </mvz-bent>
        <mvz-bent no="a">
          <template>Diğer gelirler.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Fonun kullanılması" durum="mülga">
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Cezalar">
    <mvz-madde no="20" başlık="">
      <mvz-fıkra no="1">
        <template>6831 sayılı Orman Kanunu ile 4915 sayılı Kara Avcılığı Kanunu ve 1380 sayılı Su Ürünleri Kanununda yasaklanan fiillerin bu Kanunun uygulandığı yerlerde işlenmesi halinde, cezalar bir misli artırılarak hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 14 üncü maddesi ve 15 inci maddesinin birinci fıkrasıyla yasaklanan faaliyetleri yürütenler hakkında, fiilleri daha ağır bir cezayı gerektirmediği takdirde, bir yıldan üç yıla kadar hapis ve beş bin güne kadar adli para cezasına hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Son Hükümler">
    <mvz-madde no="22" başlık="Yönetmelikler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren altı ay içerisinde;</template>
        <mvz-bent no="a">
          <template>Bu Kanunun uygulanmasına ilişkin şekil ve esasları, görev, yetki ve sorumlulukları belirleyen yönetmelik Çevre, Şehircilik ve İklim Değişikliği ve Kültür ve Turizm Bakanlıklarının görüşleri alınarak Genel Müdürlükçe,</template>
        </mvz-bent>
        <mvz-bent no="b" durum="mülga">
          <template></template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Çıkarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yönetmelikler Resmi Gazate'de yayımlanarak yürürlüğe konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Uygulanmayan ve kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulandığı yerlerde, 6831 sayılı Orman Kanununun ek 3 üncü maddesinin (A) fıkrasının (c) bendi hükmü uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>20/3/1950 tarihli ve 5614 sayılı Abant Gölü Çevresinin Bolu Özel İdaresine Temlikine Dair Kanun yürürlükten kaldırılmıştır. Abant gölü çevresi Devlet ormanı olarak 6831 sayılı Orman Kanunu hükümlerine göre yönetilir ve işletilir. Ancak bu yerlerde mevcut yapı ve tesisler üzerinde Bolu Özel İdaresi ile diğer gerçek ve tüzelkişilerin kazanılmış hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki yerlerde mevcut yerleşim merkezlerinde ikamet edenler dışında bu yerlere gelen ziyaretçiler tarafından giriş kontrol merkezlerinde veya sahalar içindeki idare ve ziyaretçi merkezlerinde ödenecek olan ücretlere ilişkin usul ve esaslar Genel Müdürlük tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel Müdürlükçe işletilen bu Kanuna tabi yerlerde giriş ücretini ödemeden giriş yaptığı tespit edilenlere Genel Müdürlük bölge müdürlerince bu maddenin birinci fıkrasında belirlenen giriş ücretinin dört katı tutarında idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ücret ödenmeden yapılan girişlere ilişkin giriş ücretleri ve Genel Müdürlük tarafından bu Kanun ile 4915 sayılı Kanun kapsamında verilen idari para cezaları ilgiliye tebliğ tarihinden itibaren bir ay içinde ödenir. Bu süre içinde ödenmeyen giriş ücretleri ve kesinleşen idari para cezaları, Genel Müdürlüğün bildirimi üzerine 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre ilgili vergi dairesi tarafından tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tahsil edilen idari para cezalarının yüzde yirmi beşi Genel Müdürlük bütçesine, yüzde yetmiş beşi genel bütçeye gelir kaydedilir. Genel Müdürlüğün tahsil ettiği idari para cezalarından ayrılan genel bütçe payı ile vergi dairesince tahsil edilen giriş ücretinin tamamı ve idari para cezalarından ayrılan Genel Müdürlük payı, tahsilatın yapıldığı tarihi takip eden ayın sonuna kadar aktarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Genel Müdürlük, bu Kanunda ve ilgili mevzuatında sayılan faaliyetleri dolayısıyla yapılan işlemler yönünden 2/7/1964 tarihli ve 492 sayılı Harçlar Kanununa göre alınan harçlar ile tapu ve kadastro işlemlerinden kaynaklanan döner sermaye hizmet bedellerinden muaftır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten sonra, bu Kanun kapsamında kalan orman vasıflı olanlar dahil Hazine taşınmazlarından; ilgili mevzuatı uyarınca turizm amaçlı yatırım gerçekleştirilmek üzere Kültür ve Turizm Bakanlığınca kesin tahsis yapılanlar üzerinde, adına kesin tahsis yapılan gerçek veya tüzelkişiler lehine 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanunu uyarınca tapuda üst hakkı tesis edilmesi ve buna bağlı olarak tapuda sözleşme düzenlenmesi ile düzenlenecek sözleşme hükümlerinin yürütülmesine ilişkin işlemler Genel Müdürlük tarafından yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamında kalan kesin tahsisler ile bu kesin tahsislere istinaden tapuya tescil edilecek üst haklarına ait sözleşmeler uyarınca adına kesin tahsis yapılan ya da lehine üst hakkı tesis edilecek gerçek veya tüzelkişilerden alınması gereken kullanım/üst hakkı bedelleri ve hasılat payları, 3/7/2003 tarihli ve 4916 sayılı Çeşitli Kanunlarda ve Maliye Bakanlığının Teşkilât ve Görevleri Hakkında Kanun Hükmünde Kararnamede Değişiklik Yapılması Hakkında Kanunun geçici 2 nci maddesi uyarınca alınması gereken proje maliyet bedelinin %3’ü oranındaki bedeller ile 29/6/2001 tarihli ve 4706 sayılı Hazineye Ait Taşınmaz Malların Değerlendirilmesi ve Katma Değer Vergisi Kanununda Değişiklik Yapılması Hakkında Kanunun geçici 23 üncü maddesi uyarınca yapılacak süre uzatımı nedeniyle tespit edilecek yararlanma/ilave yararlanma bedellerinin hesaplanması, takip ve tahsili Genel Müdürlükçe gerçekleştirilir ve bu bedeller Genel Müdürlük Döner Sermayeli İşletmelerinin ilgili hesaplarına yatırılır.</template>
      </mvz-fıkra>
    </mvz-madde> 
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren yerlerde evvelce verilmiş kullanma izni, intifa ve irtifak hakları, geçerlilik süresi bitimine kadar sahibi tarafından kullanılmak üzere bu Kanun hükümlerine göre yeniden düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde> 
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bakanlıkta Doğa Koruma ve Milli Parklar Döner Sermayeli İşletmeleri olarak faaliyetlerini sürdüren döner sermaye işletmeleri, Genel Müdürlük Döner Sermayeli İşletmeleri olarak faaliyetlerine devam eder. Bakanlık Doğa Koruma ve Milli Parklar Döner Sermayeli İşletmelerine ait kadro ve pozisyonlarında çalışmakta olan mevcut personel kadro ve pozisyonları ile birlikte hiçbir işleme gerek kalmaksızın Genel Müdürlük Döner Sermayeli İşletmelerine devredilmiş sayılır. Bakanlık Doğa Koruma ve Milli Parklar Döner Sermayeli İşletmelerine ait her türlü taşınır, taşınmaz, taşıt, araç, gereç, malzeme, demirbaş, yazılı ve elektronik ortamdaki her türlü kayıt ve doküman ile yazılım uygulamaları, veri tabanı ve hizmet sunucuları, hizmetlerden doğan borç ve alacaklar ile hak ve yükümlülükler hiçbir işleme gerek kalmaksızın Genel Müdürlük Döner Sermayeli İşletmelerine devredilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel Müdürlüğün merkez ve taşra teşkilatlanması tamamlanıncaya kadar bu maddenin yayımı tarihinden itibaren beş yılı geçmemek üzere muhasebe hizmetlerini Hazine ve Maliye Bakanlığı yürütmeye devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarih itibarıyla, genel ve özel bütçe kapsamındaki kamu idarelerinde, mesleğe özel yarışma sınavına tabi tutularak girilen ve belirli bir yetiştirme programı sonrası yeterliklerini alarak kurumlarında müfettiş, denetçi, denetmen ve kontrolör kadrolarına atanıp yardımcılık ya da stajyerlikte geçen süreler dâhil en az beş yıl görev yapmış olanlardan Genel Müdürlükçe yapılacak yazılı ve/veya sözlü sınav sonucunda başarılı olanlar bu maddenin yürürlüğe girdiği tarihten itibaren altı ay içerisinde durumlarına uygun müfettiş kadrolarına naklen atanabilirler. Bu şekilde atananların müfettiş, denetçi, denetmen ve kontrolör kadrolarında geçen hizmet süreleri müfettiş; yardımcılık veya stajyerliklerde geçen hizmet süreleri ise müfettiş yardımcısı kadrolarında geçmiş sayılır ve bunlardan 375 sayılı Kanun Hükmünde Kararnamenin geçici 12 nci maddesi ve ilgili diğer mevzuat hükümleri uygulananlara ilişkin anılan düzenlemelerin uygulanmasına devam olunur. Bu madde uyarınca müfettiş olarak atanacakların sayısı onu geçemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Kültür ve turizm koruma ve gelişim bölgeleri ile turizm alan ve merkezleri sınırları içinde kalıp kalmadığına bakılmaksızın, bu Kanun kapsamındaki alanlarda yer alan orman vasıflı olanlar dahil Hazine taşınmazlarından; ilgili mevzuatı uyarınca turizm amaçlı yatırım gerçekleştirilmek üzere bu maddenin yürürlüğe girdiği tarihten önce Bakanlıkça kesin izin verilen veya Kültür ve Turizm Bakanlığınca kesin tahsis yapılan taşınmazların üzerinde, adına kesin izin verilen veya kesin tahsis yapılan gerçek veya tüzelkişiler lehine 4721 sayılı Kanun uyarınca Çevre, Şehircilik ve İklim Değişikliği Bakanlığınca tesis edilen üst haklarına ilişkin tapuda düzenlenen sözleşme hükümlerinin yürütülmesi ile bu kesin izin ve kesin tahsislerden henüz tapuda üst hakkı tesis edilmeyenler için tapuda üst hakkı tesis edilmesi ve buna bağlı olarak sözleşme düzenlenmesi ile düzenlenecek sözleşme hükümlerinin yürütülmesine ilişkin işlemler 1/1/2026 tarihinden itibaren Genel Müdürlük tarafından yapılır. Bu fıkra kapsamında kalan ve üzerinde daha önce Çevre, Şehircilik ve İklim Değişikliği Bakanlığınca üst hakkı tesis edilen taşınmazlara ait sözleşmelerin tarafı belirtilen tarihten itibaren sözleşmeler yenilenmeksizin Genel Müdürlüktür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamında kalan kesin izin veya kesin tahsisler ile bu kesin izin ve kesin tahsislere istinaden tapuya tescil edilen/edilecek üst haklarına ait sözleşmeler uyarınca adına kesin izin verilen veya kesin tahsis yapılan ya da lehine üst hakkı tesis edilen gerçek veya tüzelkişilerden alınması gereken kullanım/üst hakkı bedelleri ve hasılat payları 4916 sayılı Kanunun geçici 2 nci maddesi uyarınca alınması gereken proje maliyet bedelinin %3’ü oranındaki bedeller ile 4706 sayılı Kanunun geçici 23 üncü maddesi uyarınca yapılacak süre uzatımı nedeniyle tespit edilecek yararlanma/ilave yararlanma bedellerinden 1/1/2026 tarihinden sonra tahakkuk edecek bedellerin hesaplanması, takip ve tahsili Genel Müdürlükçe gerçekleştirilir ve 1/1/2026 tarihinden itibaren bu bedeller Genel Müdürlük Döner Sermayeli İşletmelerinin ilgili hesaplarına yatırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde kapsamında kalan kullanım/üst hakkı bedelleri ve hasılat payları, proje maliyet bedelinin %3’ü oranındaki bedeller ile süre uzatımı nedeniyle tespit edilen yararlanma/ilave yararlanma bedellerinden 1/1/2026 tarihinden önce tahakkuk edenlerin hesaplama, takip ve tahsiline Çevre, Şehircilik ve İklim Değişikliği Bakanlığınca devam edilir ve daha önce tahsil edilerek ilgili genel bütçe hesabına gelir kaydedilenler, Genel Müdürlük Döner Sermayeli İşletmelerinin ilgili hesaplarına aktarılmaz ve bunlar için herhangi bir iade veya mahsup işlemi yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde ile ek 3 üncü maddenin uygulamasına ilişkin usul ve esasları belirlemeye Çevre, Şehircilik ve İklim Değişikliği Bakanlığı ile Kültür ve Turizm Bakanlığının görüşü alınmak kaydıyla Genel Müdürlük yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce gerçekleşip Hazineye aktarılmamış olan döner sermaye yıl sonu kârları Genel Müdürlük bütçesine gelir kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
