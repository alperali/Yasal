  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="CUMHURİYETİN TEMEL ORGANLARI">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Yasama">
      <mvz-b1 no="I" başlık="Türkiye Büyük Millet Meclisi">
        <mvz-b2 no="A" başlık="Kuruluşu:">
          <mvz-madde no="75" başlık="">
            <mvz-fıkra no="1">
              <template>Türkiye Büyük Millet Meclisi genel oyla seçilen altıyüz milletvekilinden oluşur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Milletvekili seçilme yeterliliği">
          <mvz-madde no="76" başlık="">
            <mvz-fıkra no="1">
              <template>Onsekiz yaşını dolduran her Türk milletvekili seçilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>En az ilkokul mezunu olmayanlar, kısıtlılar, askerlikle ilişiği olanlar, kamu hizmetinden yasaklılar, taksirli suçlar hariç toplam bir yıl veya daha fazla hapis ile ağır hapis cezasına hüküm giymiş olanlar; zimmet, ihtilas, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, inancı kötüye kullanma, dolanlı iflas gibi yüz kızartıcı suçlarla, kaçakçılık, Resmî ihale ve alım satımlara fesat karıştırma, Devlet sırlarını açığa vurma, terör eylemlerine katılma ve bu gibi eylemleri tahrik ve teşvik suçlarından biriyle hüküm giymiş olanlar, affa uğramış olsalar bile milletvekili seçilemezler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Hakimler ve savcılar, yüksek yargı organları mensupları, yükseköğretim kurumlarındaki öğretim elemanları, Yükseköğretim Kurulu üyeleri, kamu kurum ve kuruluşlarının memur statüsündeki görevlileri ile yaptıkları hizmet bakımından işçi niteliği taşımayan diğer kamu görevlileri ve Silahlı Kuvvetler mensupları, görevlerinden çekilmedikçe, aday olamazlar ve milletvekili seçilemezler.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Türkiye Büyük Millet Meclisi ve Cumhurbaşkanının seçim dönemi">
          <mvz-madde no="77" başlık="">
            <mvz-fıkra no="1">
              <template>Türkiye Büyük Millet Meclisi ve Cumhurbaşkanlığı seçimleri beş yılda bir aynı günde yapılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Süresi biten milletvekili yeniden seçilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Cumhurbaşkanlığı seçiminde birinci oylamada gerekli çoğunluğun sağlanamaması halinde 101 inci maddedeki usule göre ikinci oylama yapılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="D" başlık="Seçimlerin geriye bırakılması ve ara seçimler">
          <mvz-madde no="78" başlık="">
            <mvz-fıkra no="1">
              <template>Savaş sebebiyle yeni seçimlerin yapılmasına imkan görülmezse, Türkiye Büyük Millet Meclisi, seçimlerin bir yıl geriye bırakılmasına karar verebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Geri bırakma sebebi ortadan kalkmamışsa, erteleme kararındaki usule göre bu işlem tekrarlanabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Türkiye Büyük Millet Meclisi üyeliklerinde boşalma olması halinde, ara seçime gidilir. Ara seçim, her seçim döneminde bir defa yapılır ve genel seçimden otuz ay geçmedikçe ara seçime gidilemez. Ancak, boşalan üyeliklerin sayısı, üye tamsayısının yüzde beşini bulduğu hallerde, ara seçimlerinin üç ay içinde yapılmasına karar verilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Genel seçimlere bir yıl kala, ara seçimi yapılamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Yukarıda yazılı hallerden ayrı olarak, bir ilin veya seçim çevresinin, Türkiye Büyük Millet Meclisinde üyesinin kalmaması halinde, boşalmayı takip eden doksan günden sonraki ilk Pazar günü ara seçim yapılır. Bu fıkra gereği yapılacak seçimlerde Anayasanın 127 nci maddesinin üçüncü fıkrası hükmü uygulanmaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="E" başlık="Seçimlerin genel yönetim ve denetimi">
          <mvz-madde no="79" başlık="">
            <mvz-fıkra no="1">
              <template>Seçimler, yargı organlarının genel yönetim ve denetimi altında yapılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Seçimlerin başlamasından bitimine kadar, seçimin düzen içinde yönetimi ve dürüstlüğü ile ilgili bütün işlemleri yapma ve yaptırma, seçim süresince ve seçimden sonra seçim konularıyla ilgili bütün yolsuzlukları, şikayet ve itirazları inceleme ve kesin karara bağlama ve Türkiye Büyük Millet Meclisi üyelerinin seçim tutanaklarını ve Cumhurbaşkanlığı seçim tutanaklarını kabul etme görevi Yüksek Seçim Kurulunundur. Yüksek Seçim Kurulunun kararları aleyhine başka bir mercie başvurulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Yüksek Seçim Kurulunun ve diğer seçim kurullarının görev ve yetkileri kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Yüksek Seçim Kurulu yedi asıl ve dört yedek üyeden oluşur. Üyelerin altısı Yargıtay, beşi Danıştay Genel Kurullarınca kendi üyeleri arasından üye tamsayılarının salt çoğunluğunun gizli oyu ile seçilir. Bu üyeler, salt çoğunluk ve gizli oyla aralarından bir başkan ve bir başkanvekili seçerler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Yüksek Seçim Kuruluna Yargıtay ve Danıştaydan seçilmiş üyeler arasından ad çekme ile ikişer yedek üye ayrılır. Yüksek Seçim Kurulu Başkanı ve Başkanvekili ad çekmeye girmezler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Anayasa değişikliklerine ilişkin kanunların halkoyuna sunulması, Cumhurbaşkanının halk tarafından seçilmesi işlemlerinin genel yönetim ve denetimi de milletvekili seçimlerinde uygulanan hükümlere göre olur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="F" başlık="Üyelikle ilgili hükümler">
          <mvz-b3 no="1" başlık="Milletin temsili">
            <mvz-madde no="80" başlık="">
              <mvz-fıkra no="1">
                <template>Türkiye Büyük Millet Meclisi üyeleri, seçildikleri bölgeyi veya kendilerini seçenleri değil, bütün Milleti temsil ederler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Andiçme">
            <mvz-madde no="81" başlık="">
              <mvz-fıkra no="1">
                <template>Türkiye Büyük Millet Meclisi üyeleri, göreve başlarken aşağıdaki şekilde andiçerler:</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>"Devletin varlığı ve bağımsızlığını vatanın ve milletin bölünmez bütünlüğünü, milletin kayıtsız ve şartsız egemenliğini koruyacağıma; hukukun üstünlüğüne, demokratik ve laik Cumhuriyete ve Atatürk ilke ve inkılaplarına bağlı kalacağıma; toplumun huzur ve refahı, milli dayanışma ve adalet anlayışı içinde herkesin insan haklarından ve temel hürriyetlerden yararlanması ülküsünden ve Anayasaya sadakattan ayrılmayacağıma; büyük Türk milleti önünde namusum ve şerefim üzerine andiçerim".</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Üyelikle bağdaşmayan işler">
            <mvz-madde no="82" başlık="">
              <mvz-fıkra no="1">
                <template>Türkiye Büyük Millet Meclisi üyeleri, Devlet ve diğer kamu tüzel kişilerinde ve bunlara bağlı kuruluşlarda; Devletin veya diğer kamu tüzelkişilerinin doğrudan doğruya ya da dolaylı olarak katıldığı teşebbüs ve ortaklıklarda; özel gelir kaynakları ve özel imkanları kanunla sağlanmış kamu yararına çalışan derneklerin ve Devletten yardım sağlayan ve vergi muafiyeti olan vakıfların, kamu kurumu niteliğindeki meslek kuruluşları ile sendikalar ve bunların üst kuruluşlarının ve katıldıkları teşebbüs veya ortaklıkların yönetim ve denetim kurullarında görev alamazlar, vekili olamazlar, herhangi bir taahhüt işini doğrudan veya dolaylı olarak kabul edemezler, temsilcilik ve hakemlik yapamazlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Türkiye Büyük Millet Meclisi üyeleri, yürütme organının teklif, inha, atama veya onamasına bağlı Resmî veya özel herhangi bir işle görevlendirilemezler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Türkiye Büyük Millet Meclisi üyeliği ile bağdaşmayan diğer görev ve işler kanunla düzenlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="4" başlık="Yasama dokunulmazlığı">
            <mvz-madde no="83" başlık="">
              <mvz-fıkra no="1">
                <template>Türkiye Büyük Millet Meclisi üyeleri, Meclis çalışmalarındaki oy ve sözlerinden, Mecliste ileri sürdükleri düşüncelerden, o oturumdaki Başkanlık Divanının teklifi üzerine Meclisce başka bir karar alınmadıkça bunları Meclis dışında tekrarlamak ve açığa vurmaktan sorumlu tutulamazlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Seçimden önce veya sonra bir suç işlediği ileri sürülen bir milletvekili, Meclisin kararı olmadıkça tutulamaz, sorguya çekilemez, tutuklanamaz ve yargılanamaz. Ağır cezayı gerektiren suçüstü hali ve seçimden önce soruşturmasına başlanılmış olmak kaydıyla Anayasanın 14 üncü maddesindeki durumlar bu hükmün dışındadır. Ancak, bu halde yetkili makam durumu hemen ve doğrudan doğruya Türkiye Büyük Millet Meclisine bildirmek zorundadır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Türkiye Büyük Millet Meclisi üyesi hakkında, seçiminden önce veya sonra verilmiş bir ceza hükmünün yerine getirilmesi, üyelik sıfatının sona ermesine bırakılır; üyelik süresince zamanaşımı işlemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Tekrar seçilen milletvekili hakkında soruşturma ve kovuşturma, Meclisin yeniden dokunulmazlığını kaldırmasına bağlıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Türkiye Büyük Millet Meclisindeki siyasi parti gruplarınca, yasama dokunulmazlığı ile ilgili görüşme yapılamaz ve karar alınamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="5" başlık="Milletvekilliğinin düşmesi">
            <mvz-madde no="84" başlık="">
              <mvz-fıkra no="1">
                <template>İstifa eden milletvekilinin milletvekilliğinin düşmesi, istifanın geçerli olduğu Türkiye Büyük Millet Meclisi Başkanlık Divanınca tespit edildikten sonra, Türkiye Büyük Millet Meclisi Genel Kurulunca kararlaştırılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Milletvekilliğinin kesin hüküm giyme veya kısıtlanma halinde düşmesi, bu husustaki kesin mahkeme kararının Genel Kurula bildirilmesiyle olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>82 nci maddeye göre milletvekilliğiyle bağdaşmayan bir görev veya hizmeti sürdürmekte ısrar eden milletvekilinin milletvekilliğinin düşmesine, yetkili komisyonun bu durumu tespit eden raporu üzerine Genel Kurul gizli oyla karar verir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Meclis çalışmalarına özürsüz veya izinsiz olarak bir ay içerisinde toplam beş birleşim günü katılmayan milletvekilinin milletvekilliğinin düşmesine, durumun Meclis Başkanlık Divanınca tespit edilmesi üzerine, Genel Kurulca üye tamsayısının salt çoğunluğunun oyuyla karar verilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>(Mülga)</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="6" başlık="İptal istemi">
            <mvz-madde no="85" başlık="">

              <template>"Cumhurbaşkanı sıfatıyla, Devletin varlığı ve bağımsızlığını, vatanın ve milletin bölünmez bütünlüğünü, milletin kayıtsız ve şartsız egemenliğini koruyacağıma, Anayasaya, hukukun üstünlüğüne, demokrasiye, Atatürk ilke ve inkılaplarına ve laik Cumhuriyet ilkesine bağlı kalacağıma, milletin huzur ve refahı, milli dayanışma ve adalet anlayışı içinde herkesin insan haklarından ve temel hürriyetlerinden yararlanması ülküsünden ayrılmayacağıma, Türkiye Cumhuriyetinin şan ve şerefini korumak, yüceltmek ve üzerime aldığım görevi tarafsızlıkla yerine getirmek için bütün gücümle çalışacağıma Büyük Türk Milleti ve tarih huzurunda, namusum ve şerefim üzerine andiçerim."</template>

        <mvz-b2 no="D" başlık="Görev ve yetkileri">

            <mvz-fıkra no="2">
              <template>Cumhurbaşkanı, Devlet başkanı sıfatıyla Türkiye Cumhuriyetini ve Türk Milletinin birliğini temsil eder; Anayasanın uygulanmasını, Devlet organlarının düzenli ve uyumlu çalışmasını temin eder.</template>

            <mvz-fıkra no="3">

              <template>Kanunların, Türkiye Büyük Millet Meclisi İçtüzüğünün tümünün veya belirli hükümlerinin Anayasaya şekil veya esas bakımından aykırı oldukları gerekçesiyle Anayasa Mahkemesinde iptal davası açar.</template>
            </mvz-fıkra>

            </mvz-fıkra>
            <mvz-fıkra no="9">
              <template>Üst kademe kamu yöneticilerini atar, görevlerine son verir ve bunların atanmalarına ilişkin usul ve esasları Cumhurbaşkanlığı kararnamesiyle düzenler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="10">
              <template>Yabancı devletlere Türkiye Cumhuriyetinin temsilcilerini gönderir, Türkiye Cumhuriyetine gönderilecek yabancı devlet temsilcilerini kabul eder.</template>

            <mvz-fıkra no="11">

            </mvz-fıkra>
            <mvz-fıkra no="13">
              <template>Milli güvenlik politikalarını belirler ve gerekli tedbirleri alır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="14">
              <template>Türkiye Büyük Millet Meclisi adına Türk Silahlı Kuvvetlerinin Başkomutanlığını temsil eder.</template>

            <mvz-fıkra no="15">

            <mvz-fıkra no="17">
              <template>Cumhurbaşkanı, yürütme yetkisine ilişkin konularda Cumhurbaşkanlığı kararnamesi çıkarabilir. Anayasanın ikinci kısmının birinci ve ikinci bölümlerinde yer alan temel haklar, kişi hakları ve ödevleriyle dördüncü bölümde yer alan siyasi haklar ve ödevler Cumhurbaşkanlığı kararnamesiyle düzenlenemez. Anayasada münhasıran kanunla düzenlenmesi öngörülen konularda Cumhurbaşkanlığı kararnamesi çıkarılamaz. Kanunda açıkça düzenlenen konularda Cumhurbaşkanlığı kararnamesi çıkarılamaz. Cumhurbaşkanlığı kararnamesi ile kanunlarda farklı hükümler bulunması halinde, kanun hükümleri uygulanır. Türkiye Büyük Millet Meclisinin aynı konuda kanun çıkarması durumunda, Cumhurbaşkanlığı kararnamesi hükümsüz hale gelir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="18">

            <mvz-fıkra no="19">

            <mvz-fıkra no="20">

        <mvz-b2 no="E" başlık="Cumhurbaşkanının cezai sorumluluğu">
          <mvz-madde no="105" başlık="">
            <mvz-fıkra no="1">
              <template>Cumhurbaşkanı hakkında, bir suç işlediği iddiasıyla Türkiye Büyük Millet Meclisi üye tamsayısının salt çoğunluğunun vereceği önergeyle soruşturma açılması istenebilir. Meclis, önergeyi en geç bir ay içinde görüşür ve üye tamsayısının beşte üçünün gizli oyuyla soruşturma açılmasına karar verebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Soruşturma açılmasına karar verilmesi halinde, Meclisteki siyasi partilerin, güçleri oranında komisyona verebilecekleri üye sayısının üç katı olarak gösterecekleri adaylar arasından her siyasi parti için ayrı ayrı ad çekme suretiyle kurulacak onbeş kişilik bir komisyon tarafından soruşturma yapılır. Komisyon, soruşturma sonucunu belirten raporunu iki ay içinde Meclis Başkanlığına sunar. Soruşturmanın bu sürede bitirilememesi halinde, komisyona bir aylık yeni ve kesin bir süre verilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Rapor Başkanlığa verildiği tarihten itibaren on gün içinde dağıtılır, dağıtımından itibaren on gün içinde Genel Kurulda görüşülür. Türkiye Büyük Millet Meclisi, üye tamsayısının üçte ikisinin gizli oyuyla Yüce Divana sevk kararı alabilir. Yüce Divan yargılaması üç ay içinde tamamlanır, bu sürede tamamlanamazsa bir defaya mahsus olmak üzere üç aylık ek süre verilir, yargılama bu sürede kesin olarak tamamlanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Hakkında soruşturma açılmasına karar verilen Cumhurbaşkanı, seçim kararı alamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Yüce Divanda seçilmeye engel bir suçtan mahkûm edilen Cumhurbaşkanının görevi sona erer.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Cumhurbaşkanının görevde bulunduğu sürede işlediği iddia edilen suçlar için görevi bittikten sonra da bu madde hükmü uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>

        <mvz-b2 no="F" başlık="Cumhurbaşkanı yardımcıları, Cumhurbaşkanına vekâlet ve bakanlar">

              <mvz-fıkra no="4">
                <template>Milli Güvenlik Kurulunun gündemi; Cumhurbaşkanı yardımcıları ve Genelkurmay Başkanının önerileri dikkate alınarak Cumhurbaşkanınca düzenlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Cumhurbaşkanı katılamadığı zamanlar Milli Güvenlik Kurulu Cumhurbaşkanı yardımcısının başkanlığında toplanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Milli Güvenlik Kurulu Genel Sekreterliğinin teşkilatı ve görevleri Cumhurbaşkanlığı kararnamesiyle düzenlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="III" başlık="Olağanüstü hal yönetimi">
        <mvz-b2 no="A" başlık="–*–">
          <mvz-b3 no="1" başlık="–*–">
            <mvz-madde no="119" başlık="">
              <mvz-fıkra no="1">
                <template>Cumhurbaşkanı; savaş, savaşı gerektirecek bir durumun başgöstermesi, seferberlik, ayaklanma, vatan veya Cumhuriyete karşı kuvvetli ve eylemli bir kalkışma, ülkenin ve milletin bölünmezliğini içten veya dıştan tehlikeye düşüren şiddet hareketlerinin yaygınlaşması, anayasal düzeni veya temel hak ve hürriyetleri ortadan kaldırmaya yönelik yaygın şiddet hareketlerinin ortaya çıkması, şiddet olayları nedeniyle kamu düzeninin ciddî şekilde bozulması, tabiî afet veya tehlikeli salgın hastalık ya da ağır ekonomik bunalımın ortaya çıkması hallerinde yurdun tamamında veya bir bölgesinde, süresi altı ayı geçmemek üzere olağanüstü hal ilan edebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Olağanüstü hal ilanı kararı, verildiği gün Resmî Gazetede yayımlanır ve aynı gün Türkiye Büyük Millet Meclisinin onayına sunulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Türkiye Büyük Millet Meclisi tatilde ise derhal toplantıya çağırılır; Meclis gerekli gördüğü takdirde olağanüstü halin süresini kısaltabilir, uzatabilir veya olağanüstü hali kaldırabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Cumhurbaşkanının talebiyle Türkiye Büyük Millet Meclisi her defasında dört ayı geçmemek üzere süreyi uzatabilir. Savaş hallerinde bu dört aylık süre aranmaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Olağanüstü hallerde vatandaşlar için getirilecek para, mal ve çalışma yükümlülükleri ile 15 inci maddedeki ilkeler doğrultusunda temel hak ve hürriyetlerin nasıl sınırlanacağı veya geçici olarak durdurulacağı, hangi hükümlerin uygulanacağı ve işlemlerin nasıl yürütüleceği kanunla düzenlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Olağanüstü hallerde Cumhurbaşkanı, olağanüstü halin gerekli kıldığı konularda, 104 üncü maddenin onyedinci fıkrasının ikinci cümlesinde belirtilen sınırlamalara tabi olmaksızın Cumhurbaşkanlığı kararnamesi çıkarabilir. Kanun hükmündeki bu kararnameler Resmî Gazetede yayımlanır, aynı gün Meclis onayına sunulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="7">
                <template>Savaş ve mücbir sebeplerle Türkiye Büyük Millet Meclisinin toplanamaması hâli hariç olmak üzere; olağanüstü hal sırasında çıkarılan Cumhurbaşkanlığı kararnameleri üç ay içinde Türkiye Büyük Millet Meclisinde görüşülür ve karara bağlanır. Aksi halde olağanüstü hallerde çıkarılan Cumhurbaşkanlığı kararnamesi kendiliğinden yürürlükten kalkar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Şiddet olaylarının yaygınlaşması ve kamu düzeninin ciddi şekilde bozulması sebepleriyle olağanüstü hal ilanı">
            <mvz-madde no="120" başlık="">
              <mvz-fıkra no="1">
                <template>Mülga</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Olağanüstü hallerle ilgili düzenleme">
            <mvz-madde no="121" başlık="">
              <mvz-fıkra no="1">
                <template>Mülga</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Sıkıyönetim, seferberlik ve savaş hali">
          <mvz-madde no="122" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>

      <mvz-b1 no="IV" başlık="İdare">
        <mvz-b2 no="A" başlık="İdarenin esasları">
          <mvz-b3 no="1" başlık="İdarenin bütünlüğü ve kamu tüzelkişiliği">
            <mvz-madde no="123" başlık="">
              <mvz-fıkra no="1">
                <template>İdare, kuruluş ve görevleriyle bir bütündür ve kanunla düzenlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İdarenin kuruluş ve görevleri, merkezden yönetim ve yerinden yönetim esaslarına dayanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kamu tüzelkişiliği, kanunla veya Cumhurbaşkanlığı kararnamesiyle kurulur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Yönetmelikler">
            <mvz-madde no="124" başlık="">
              <mvz-fıkra no="1">
                <template>Cumhurbaşkanı, bakanlıklar ve kamu tüzelkişileri, kendi görev alanlarını ilgilendiren kanunların ve Cumhurbaşkanlığı kararnamelerinin uygulanmasını sağlamak üzere ve bunlara aykırı olmamak şartıyla, yönetmelikler çıkarabilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hangi yönetmeliklerin Resmî Gazetede yayımlanacağı kanunda belirtilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Yargı yolu">
          <mvz-madde no="125" başlık="">
            <mvz-fıkra no="1">
              <template>İdarenin her türlü eylem ve işlemlerine karşı yargı yolu açıktır.  Kamu hizmetleri ile ilgili imtiyaz şartlaşma ve sözleşmelerinde bunlardan doğan uyuşmazlıkların milli veya milletlerarası tahkim yoluyla çözülmesi öngörülebilir. Milletlerarası tahkime ancak yabancılık unsuru taşıyan uyuşmazlıklar için gidilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yüksek Askerî Şûranın terfi işlemleri ile kadrosuzluk nedeniyle emekliye ayırma hariç her türlü ilişik kesme kararlarına karşı yargı yolu açıktır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>İdari işlemlere karşı açılacak davalarda süre, yazılı bildirim tarihinden başlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Yargı yetkisi, idarî eylem ve işlemlerin hukuka uygunluğunun denetimi ile sınırlı olup, hiçbir surette yerindelik denetimi şeklinde kullanılamaz. Yürütme görevinin kanunlarda gösterilen şekil ve esaslara uygun olarak yerine getirilmesini kısıtlayacak, idari eylem ve işlem niteliğinde veya takdir yetkisini kaldıracak biçimde yargı kararı verilemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>İdari işlemin uygulanması halinde telafisi güç veya imkansız zararların doğması ve idari işlemin açıkça hukuka aykırı olması şartlarının birlikte gerçekleşmesi durumunda gerekçe gösterilerek yürütmenin durdurulmasına karar verilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Kanun, olağanüstü hallerde,  seferberlik ve savaş halinde ayrıca milli güvenlik, kamu düzeni, genel sağlık nedenleri ile yürütmenin durdurulması kararı verilmesini sınırlayabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>İdare, kendi eylem ve işlemlerinden doğan zararı ödemekle yükümlüdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="İdarenin kuruluşu">
          <mvz-b3 no="1" başlık="Merkezi idare">
            <mvz-madde no="126" başlık="">
              <mvz-fıkra no="1">
                <template>Türkiye, merkezi idare kuruluşu bakımından, coğrafya durumuna, ekonomik şartlara ve kamu hizmetlerinin gereklerine göre, illere; iller de diğer kademeli bölümlere ayırılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İllerin idaresi yetki genişliği esasına dayanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kamu hizmetlerinin görülmesinde verim ve uyum sağlamak amacıyla, birden çok ili içine alan merkezi idare teşkilatı kurulabilir. Bu teşkilatın görev ve yetkileri kanunla düzenlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Mahalli idareler">
            <mvz-madde no="127" başlık="">
              <mvz-fıkra no="1">
                <template>Mahalli idareler; il, belediye veya köy halkının mahalli müşterek ihtiyaçlarını karşılamak üzere kuruluş esasları kanunla belirtilen ve karar organları, gene kanunda gösterilen, seçmenler tarafından seçilerek oluşturulan kamu tüzelkişileridir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Mahalli idarelerin kuruluş ve görevleri ile yetkileri, yerinden yönetim ilkesine uygun olarak kanunla düzenlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Mahalli idarelerin seçimleri, 67 nci maddedeki esaslara göre beş yılda bir yapılır.  Kanun, büyük yerleşim merkezleri için özel yönetim biçimleri getirebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Mahalli idarelerin seçilmiş organlarının, organlık sıfatını kazanmalarına ilişkin itirazların çözümü ve kaybetmeleri, konusundaki denetim yargı yolu ile olur. Ancak, görevleri ile ilgili bir suç sebebi ile hakkında soruşturma veya kovuşturma açılan mahalli idare organları veya bu organların üyelerini, İçişleri Bakanı, geçici bir tedbir olarak, kesin hükme kadar uzaklaştırabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Merkezi idare, mahalli idareler üzerinde, mahalli hizmetlerin idarenin bütünlüğü ilkesine uygun şekilde yürütülmesi, kamu görevlerinde birliğin sağlanması, toplum yararının korunması ve mahalli ihtiyaçların gereği gibi karşılanması amacıyla, kanunda belirtilen esas ve usuller dairesinde idari vesayet yetkisine sahiptir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Mahalli idarelerin belirli kamu hizmetlerinin görülmesi amacı ile, kendi aralarında Cumhurbaşkanının izni ile birlik kurmaları, görevleri, yetkileri, maliye ve kolluk işleri ve merkezi idare ile karşılıklı bağ ve ilgileri kanunla düzenlenir. Bu idarelere, görevleri ile orantılı gelir kaynakları sağlanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="D" başlık="Kamu hizmeti görevlileriyle ilgili hükümler">
          <mvz-b3 no="1" başlık="Genel ilkeler">
            <mvz-madde no="128" başlık="">
              <mvz-fıkra no="1">
                <template>Devletin, kamu iktisadi teşebbüsleri ve diğer kamu tüzelkişilerinin genel idare esaslarına göre yürütmekle yükümlü oldukları kamu hizmetlerinin gerektirdiği asli ve sürekli görevler, memurlar ve diğer kamu görevlileri eliyle görülür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Memurların ve diğer kamu görevlilerinin nitelikleri, atanmaları, görev ve yetkileri, hakları ve yükümlülükleri, aylık ve ödenekleri ve diğer özlük işleri kanunla düzenlenir.  Ancak, malî ve sosyal haklara ilişkin toplu sözleşme hükümleri saklıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Üst kademe yöneticilerinin yetiştirilme usul ve esasları, kanunla özel olarak düzenlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Görev ve sorumlulukları, disiplin kovuşturulmasında güvence">
            <mvz-madde no="129" başlık="">
              <mvz-fıkra no="1">
                <template>Memurlar ve diğer kamu görevlileri Anayasa ve kanunlara sadık kalarak faaliyette bulunmakla yükümlüdürler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Memurlar ve diğer kamu görevlileri ile kamu kurumu niteliğindeki meslek kuruluşları ve bunların üst kuruluşları mensuplarına savunma hakkı tanınmadıkça disiplin cezası verilemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Disiplin kararları yargı denetimi dışında bırakılamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Silahlı Kuvvetler mensupları ile hakimler ve savcılar hakkındaki hükümler saklıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Memurlar ve diğer kamu görevlilerinin yetkilerini kullanırken işledikleri kusurlardan doğan tazminat davaları, kendilerine rücu edilmek kaydıyla ve kanunun gösterdiği şekil ve şartlara uygun olarak, ancak idare aleyhine açılabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Memurlar ve diğer kamu görevlileri hakkında işledikleri iddia edilen suçlardan ötürü ceza kovuşturması açılması, kanunla belirlenen istisnalar dışında, kanunun gösterdiği idari merciin iznine bağlıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="E" başlık="Yükseköğretim kurumları ve üst kuruluşları">
          <mvz-b3 no="1" başlık="Yükseköğretim kurumları">
            <mvz-madde no="130" başlık="">
              <mvz-fıkra no="1">
                <template>Çağdaş eğitim-öğretim esaslarına dayanan bir düzen içinde milletin ve ülkenin ihtiyaçlarına uygun insan gücü yetiştirmek amacı ile; ortaöğretime dayalı çeşitli düzeylerde eğitim-öğretim, bilimsel araştırma, yayın ve danışmanlık yapmak, ülkeye ve insanlığa hizmet etmek üzere çeşitli birimlerden oluşan kamu tüzelkişiliğine ve bilimsel özerkliğe sahip üniversiteler Devlet tarafından kanunla kurulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kanunda gösterilen usul ve esaslara göre, kazanç amacına yönelik olmamak şartı ile vakıflar tarafından, Devletin gözetim ve denetimine tabi yükseköğretim kurumları kurulabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kanun, üniversitelerin ülke sathına dengeli bir biçimde yayılmasını gözetir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Üniversiteler ile öğretim üyeleri ve yardımcıları serbestçe her türlü bilimsel araştırma ve yayında bulunabilirler. Ancak, bu yetki, Devletin varlığı ve bağımsızlığı ve milletin ve ülkenin bütünlüğü ve bölünmezliği aleyhinde faaliyette bulunma serbestliği vermez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Üniversiteler ve bunlara bağlı birimler, Devletin gözetimi ve denetimi altında olup, güvenlik hizmetleri Devletçe sağlanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Kanunun belirlediği usul ve esaslara göre; rektörler Cumhurbaşkanınca, dekanlar ise Yükseköğretim Kurulunca seçilir ve atanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="7">
                <template>Üniversite yönetim ve denetim organları ile öğretim elemanları; Yükseköğretim Kurulunun veya üniversitelerin yetkili organlarının dışında kalan makamlarca her ne suretle olursa olsun görevlerinden uzaklaştırılamazlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="8">
                <template>Üniversitelerin hazırladığı bütçeler; Yükseköğretim Kurulunca tetkik ve onaylandıktan sonra Milli Eğitim Bakanlığına sunulur ve merkezi yönetim bütçesinin bağlı olduğu esaslara uygun olarak işleme tabi tutularak yürürlüğe konulur ve denetlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="9">
                <template>Yükseköğretim kurumlarının kuruluş ve organları ile işleyişleri ve bunların seçimleri, görev, yetki ve sorumlulukları üniversiteler üzerinde Devletin gözetim ve denetim hakkını kullanma usulleri, öğretim elemanlarının görevleri, unvanları, atama, yükselme ve emeklilikleri, öğretim elemanı yetiştirme, üniversitelerin ve öğretim elemanlarının kamu kuruluşları ve diğer kurumlar ile ilişkileri, öğretim düzeyleri ve süreleri, yükseköğretime giriş, devam ve alınacak harçlar, Devletin yapacağı yardımlar ile ilgili ilkeler, disiplin ve ceza işleri, mali işler, özlük hakları, öğretim elemanlarının uyacakları koşullar, üniversitelerarası ihtiyaçlara göre öğretim elemanlarının görevlendirilmesi, öğrenimin ve öğretimin hürriyet ve teminat içinde ve çağdaş bilim ve teknoloji gereklerine göre yürütülmesi, Yükseköğretim kuruluna ve üniversitelere Devletin sağladığı mali kaynakların kullanılması kanunla düzenlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="10">
                <template>Vakıflar tarafından kurulan yükseköğretim kurumları, mali ve idari konuları dışındaki akademik çalışmaları, öğretim elemanlarının sağlanması ve güvenlik yönlerinden, Devlet eliyle kurulan yükseköğretim kurumları için Anayasada belirtilen hükümlere tabidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Yükseköğretim üst kuruluşları">
            <mvz-madde no="131" başlık="">
              <mvz-fıkra no="1">
                <template>Yükseköğretim kurumlarının öğretimini planlamak, düzenlemek, yönetmek, denetlemek, yükseköğretim kurumlarındaki eğitim - öğretim ve bilimsel araştırma faaliyetlerini yönlendirmek bu kurumların kanunda belirtilen amaç ve ilkeler doğrultusunda kurulmasını, geliştirilmesini ve üniversitelere tahsis edilen kaynakların etkili bir biçimde kullanılmasını sağlamak ve öğretim elemanlarının yetiştirilmesi için planlama yapmak maksadı ile Yükseköğretim Kurulu kurulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yükseköğretim Kurulu, üniversiteler tarafından seçilen ve sayıları, nitelikleri, seçilme usulleri kanunla belirlenen adaylar arasından rektörlük ve öğretim üyeliğinde başarılı hizmet yapmış profesörlere öncelik vermek sureti ile Cumhurbaşkanınca atanan üyeler ve Cumhurbaşkanınca doğrudan doğruya seçilen üyelerden kurulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kurulun teşkilatı, görev, yetki, sorumluluğu ve çalışma esasları kanunla düzenlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Yükseköğretim kurumlarından özel hükümlere tabi olanlar">
            <mvz-madde no="132" başlık="">
              <mvz-fıkra no="1">
                <template>Türk Silahlı Kuvvetleri ve emniyet teşkilatına bağlı yükseköğretim kurumları özel kanunlarının hükümlerine tabidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="F" başlık="Radyo ve Televizyon Üst Kurulu, radyo ve televizyon kuruluşları ve kamuyla ilişkili haber ajansları">
          <mvz-madde no="133" başlık="">
            <mvz-fıkra no="1">
              <template>Radyo ve televizyon istasyonları kurmak ve işletmek kanunla düzenlenecek şartlar çerçevesinde serbesttir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Radyo ve televizyon faaliyetlerini düzenlemek ve denetlemek amacıyla kurulan Radyo ve Televizyon Üst Kurulu dokuz üyeden oluşur. Üyeler, siyasi parti gruplarının üye sayısı oranında belirlenecek üye sayısının ikişer katı olarak gösterecekleri adaylar arasından, her siyasi parti grubuna düşen üye sayısı esas alınmak suretiyle Türkiye Büyük Millet Meclisi Genel Kurulunca seçilir. Radyo ve Televizyon Üst Kurulunun kuruluşu, görev ve yetkileri, üyelerinin nitelikleri, seçim usulleri ve görev süreleri kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Devletçe kamu tüzelkişiliği olarak kurulan tek radyo ve televizyon kurumu ile kamu tüzelkişilerinden yardım gören haber ajanslarının özerkliği ve yayınlarının tarafsızlığı esastır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="G" başlık="Atatürk Kültür, Dil ve Tarih Yüksek Kurumu">
          <mvz-madde no="134" başlık="">
            <mvz-fıkra no="1">
              <template>Atatürkçü düşünceyi, Atatürk ilke ve inkılaplarını, Türk kültürünü, Türk tarihini ve Türk dilini bilimsel yoldan araştırmak, tanıtmak ve yaymak ve yayınlar yapmak amacıyla; Atatürk'ün manevi himayelerinde, Cumhurbaşkanının gözetim ve desteğinde, Cumhurbaşkanının görevlendireceği bakana bağlı; Atatürk Araştırma Merkezi, Türk Dil Kurumu, Türk Tarih Kurumu ve Atatürk Kültür Merkezinden oluşan, kamu tüzel kişiliğine sahip "Atatürk Kültür, Dil ve Tarih Yüksek Kurumu" kurulur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Türk Dil Kurumu ile Türk Tarih Kurumu için Atatürk'ün vasiyetnamesinde belirtilen mali menfaatler saklı olup kendilerine tahsis edilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Atatürk Kültür, Dil ve Tarih Yüksek Kurumunun; kuruluşu, organları, çalışma usulleri ve özlük işleri ile kuruluşuna dahil kurumlar üzerindeki yetkileri kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="H" başlık="Kamu kurumu niteliğindeki meslek kuruluşları">
          <mvz-madde no="135" başlık="">
            <mvz-fıkra no="1">
              <template>Kamu kurumu niteliğindeki meslek kuruluşları ve üst kuruluşları; belli bir mesleğe mensup olanların müşterek ihtiyaçlarını karşılamak, mesleki faaliyetlerini kolaylaştırmak, mesleğin genel menfaatlere uygun olarak gelişmesini sağlamak, meslek mensuplarının birbirleri ile ve halk ile olan ilişkilerinde dürüstlüğü ve güveni hakim kılmak üzere meslek disiplini ve ahlakını korumak maksadı ile kanunla kurulan ve organları kendi üyeleri tarafından kanunda gösterilen usullere göre yargı gözetimi altında, gizli oyla seçilen kamu tüzelkişilikleridir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kamu kurum ve kuruluşları ile kamu iktisadi teşebbüslerinde asli ve sürekli görevlerde çalışanların meslek kuruluşlarına girme mecburiyeti aranmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bu meslek kuruluşları, kuruluş amaçları dışında faaliyette bulunamazlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bu meslek kuruluşları ve üst kuruluşları organlarının seçimlerinde siyasi partiler aday gösteremezler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Bu meslek kuruluşları üzerinde Devletin idari ve mali denetimine ilişkin kurallar kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Amaçları dışında faaliyet gösteren meslek kuruluşlarının sorumlu organlarının görevine, kanunun belirlediği merciin veya Cumhuriyet savcısının istemi üzerine mahkeme kararıyla son verilir ve yerlerine yenileri seçtirilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Ancak, milli güvenliğin, kamu düzeninin, suç işlenmesini veya suçun devamını önlemenin yahut yakalamanın gerektirdiği hallerde gecikmede sakınca varsa, kanunla bir merci, meslek kuruluşlarını veya üst kuruluşlarını faaliyetten men ile yetkilendirilebilir. Bu merciin kararı, yirmidört saat içerisinde görevli hakimin onayına sunulur. Hakim, kararını kırksekiz saat içinde açıklar; aksi halde, bu idari karar kendiliğinden yürürlükten kalkar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="İ" başlık="Diyanet İşleri Başkanlığı">
          <mvz-madde no="136" başlık="">
            <mvz-fıkra no="1">
              <template>Genel idare içinde yer alan Diyanet İşleri Başkanlığı, laiklik ilkesi doğrultusunda, bütün siyasi görüş ve düşünüşlerin dışında kalarak ve milletçe dayanışma ve bütünleşmeyi amaç edinerek, özel kanununda gösterilen görevleri yerine getirir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="J" başlık="Kanunsuz emir">
          <mvz-madde no="137" başlık="">
            <mvz-fıkra no="1">
              <template>Kamu hizmetlerinde herhangi bir sıfat ve suretle çalışmakta olan kimse, üstünden aldığı emri, yönetmelik, Cumhurbaşkanlığı kararnamesi, kanun veya Anayasa hükümlerine aykırı görürse, yerine getirmez ve bu aykırılığı o emri verene bildirir. Ancak, üstü emrinde ısrar eder ve bu emrini yazı ile yenilerse, emir yerine getirilir; bu halde, emri yerine getiren sorumlu olmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Konusu suç teşkil eden emir, hiçbir suretle yerine getirilmez; yerine getiren kimse sorumluluktan kurtulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Askeri hizmetlerin görülmesi ve acele hallerde kamu düzeni ve kamu güvenliğinin korunması için kanunla gösterilen istisnalar saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Yargı">
      <mvz-b1 no="I" başlık="Genel hükümler">
        <mvz-b2 no="A" başlık="Mahkemelerin bağımsızlığı">
          <mvz-madde no="138" başlık="">
            <mvz-fıkra no="1">
              <template>Hakimler, görevlerinde bağımsızdırlar; Anayasaya, kanuna ve hukuka uygun olarak vicdanı kanaatlerine göre hüküm verirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Hiçbir organ, makam, merci veya kişi, yargı yetkisinin kullanılmasında mahkemelere ve hakimlere emir ve talimat veremez; genelge gönderemez; tavsiye ve telkinde bulunamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Görülmekte olan bir dava hakkında Yasama Meclisinde yargı yetkisinin kullanılması ile ilgili soru sorulamaz, görüşme yapılamaz veya herhangi bir beyanda bulunulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Yasama ve yürütme organları ile idare, mahkeme kararlarına uymak zorundadır; bu organlar ve idare, mahkeme kararlarını hiçbir suretle değiştiremez ve bunların yerine getirilmesini geciktiremez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Hakimlik ve savcılık teminatı">
          <mvz-madde no="139" başlık="">
            <mvz-fıkra no="1">
              <template>Hakimler ve savcılar azlolunamaz, kendileri istemedikçe Anayasada gösterilen yaştan önce emekliye ayrılamaz; bir mahkemenin veya kadronun kaldırılması sebebiyle de olsa, aylık, ödenek ve diğer özlük haklarından yoksun kılınamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Meslekten çıkarılmayı gerektiren bir suçtan dolayı hüküm giymiş olanlar, görevini sağlık bakımından yerine getiremeyeceği kesin olarak anlaşılanlar veya meslekte kalmalarının uygun olmadığına karar verilenler hakkında kanundaki istisnalar saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Hakimlik ve savcılık mesleği">
          <mvz-madde no="140" başlık="">
            <mvz-fıkra no="1">
              <template>Hakimler ve savcılar adli ve idari yargı hakim ve savcıları olarak görev yaparlar. Bu görevler meslekten hakim ve savcılar eliyle yürütülür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Hakimler, mahkemelerin bağımsızlığı ve hakimlik teminatı esaslarına göre görev ifa ederler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Hakim ve savcıların nitelikleri, atanmaları, hakları ve ödevleri, aylık ve ödenekleri, meslekte ilerlemeleri, görevlerinin ve görev yerlerinin geçici veya sürekli olarak değiştirilmesi, haklarında disiplin kovuşturması açılması ve disiplin cezası verilmesi, görevleriyle ilgili veya görevleri sırasında işledikleri suçlarından dolayı soruşturma yapılması ve yargılanmalarına karar verilmesi, meslekten çıkarmayı gerektiren suçluluk veya yetersizlik halleri ve meslek içi eğitimleri ile diğer özlük işleri mahkemelerin bağımsızlığı ve hakimlik teminatı esaslarına göre kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Hakimler ve savcılar altmışbeş yaşını bitirinceye kadar hizmet görürler; askeri hakimlerin yaş haddi, yükselme ve emeklilikleri kanunda gösterilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Hakimler ve savcılar, kanunda belirtilenlerden başka, Resmî ve özel hiçbir görev alamazlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Hakimler ve savcılar idari görevleri yönünden Adalet Bakanlığına bağlıdırlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Hakim ve savcı olup da adalet hizmetindeki idari görevlerde çalışanlar, hakimler ve savcılar hakkındaki hükümlere tabidirler. Bunlar, hakimler ve savcılara ait esaslar dairesinde sınıflandırılır ve derecelendirilirler, hakimlere ve savcılara tanınan her türlü haklardan yararlanırlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="D" başlık="Duruşmaların açık ve kararların gerekçeli olması">
          <mvz-madde no="141" başlık="">
            <mvz-fıkra no="1">
              <template>Mahkemelerde duruşmalar herkese açıktır. Duruşmaların bir kısmının veya tamamının kapalı yapılmasına ancak genel ahlakın veya kamu güvenliğinin kesin olarak gerekli kıldığı hallerde karar verilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Küçüklerin yargılanması hakkında kanunla özel hükümler konulur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bütün mahkemelerin her türlü kararları gerekçeli olarak yazılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Davaların en az giderle ve mümkün olan süratle sonuçlandırılması, yargının görevidir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="E" başlık="Mahkemelerin kuruluşu">
          <mvz-madde no="142" başlık="">
            <mvz-fıkra no="1">
              <template>Mahkemelerin kuruluşu, görev ve yetkileri, işleyişi ve yargılama usulleri kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Disiplin mahkemeleri dışında askerî mahkemeler kurulamaz. Ancak savaş halinde, asker kişilerin görevleriyle ilgili olarak işledikleri suçlara ait davalara bakmakla görevli askerî mahkemeler kurulabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="F" başlık="Devlet Güvenlik Mahkemeleri">
          <mvz-madde no="143" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="G" başlık="Adalet hizmetlerinin denetimi">
          <mvz-madde no="144" başlık="">
            <mvz-fıkra no="1">
              <template>Adalet hizmetleri ile savcıların idarî görevleri yönünden Adalet Bakanlığınca denetimi, adalet müfettişleri ile hâkim ve savcı mesleğinden olan iç denetçiler; araştırma, inceleme ve soruşturma işlemleri ise adalet müfettişleri eliyle yapılır. Buna ilişkin usul ve esaslar kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="H" başlık="Askeri yargı">
          <mvz-madde no="145" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="II" başlık="Yüksek mahkemeler">
        <mvz-b2 no="A" başlık="Anayasa Mahkemesi">
          <mvz-b3 no="1" başlık="Kuruluşu">
            <mvz-madde no="146" başlık="">
              <mvz-fıkra no="1">
                <template>Anayasa Mahkemesi onbeş üyeden kurulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Türkiye Büyük Millet Meclisi; iki üyeyi Sayıştay Genel Kurulunun kendi başkan ve üyeleri arasından, her boş yer için gösterecekleri üçer aday içinden, bir üyeyi ise baro başkanlarının serbest avukatlar arasından gösterecekleri üç aday içinden yapacağı gizli oylamayla seçer. Türkiye Büyük Millet Meclisinde yapılacak bu seçimde, her boş üyelik için ilk oylamada üye tam sayısının üçte iki ve ikinci oylamada üye tam sayısının salt çoğunluğu aranır. İkinci oylamada salt çoğunluk sağlanamazsa, bu oylamada en çok oy alan iki aday için üçüncü oylama yapılır; üçüncü oylamada en fazla oy alan aday üye seçilmiş olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Cumhurbaşkanı; üç üyeyi Yargıtay, iki üyeyi Danıştay  genel kurullarınca kendi başkan ve üyeleri arasından her boş yer için gösterecekleri üçer aday içinden; en az ikisi hukukçu olmak üzere üç üyeyi Yükseköğretim Kurulunun kendi üyesi olmayan yükseköğretim kurumlarının hukuk, iktisat ve siyasal bilimler dallarında görev yapan öğretim üyeleri arasından göstereceği üçer aday içinden; dört üyeyi üst kademe yöneticileri, serbest avukatlar, birinci sınıf hâkim ve savcılar ile en az beş yıl raportörlük yapmış Anayasa Mahkemesi raportörleri arasından seçer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Yargıtay, Danıştay  ve Sayıştay genel kurulları ile Yükseköğretim Kurulundan Anayasa Mahkemesi üyeliğine aday göstermek için yapılacak seçimlerde, her boş üyelik için,  en fazla oy alan üç kişi aday gösterilmiş sayılır. Baro başkanlarının serbest avukatlar arasından gösterecekleri üç aday için yapılacak seçimde  en fazla oy alan üç kişi aday gösterilmiş sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Anayasa Mahkemesine üye seçilebilmek için, kırkbeş yaşın doldurulmuş olması kaydıyla; yükseköğretim kurumları öğretim üyelerinin profesör veya doçent unvanını kazanmış, avukatların en az yirmi yıl fiilen avukatlık yapmış, üst kademe yöneticilerinin yükseköğrenim görmüş ve en az yirmi yıl kamu hizmetinde fiilen çalışmış, birinci sınıf hâkim ve savcıların adaylık dahil en az yirmi yıl çalışmış olması şarttır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Anayasa Mahkemesi üyeleri arasından gizli oyla ve üye tam sayısının salt çoğunluğu ile dört yıl için bir Başkan ve iki başkanvekili seçilir. Süresi bitenler yeniden seçilebilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="7">
                <template>Anayasa Mahkemesi üyeleri aslî görevleri dışında Resmî veya özel hiçbir görev alamazlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Üyelerin görev süresi ve üyeliğin sona ermesi">
            <mvz-madde no="147" başlık="">
              <mvz-fıkra no="1">
                <template>Anayasa Mahkemesi üyeleri oniki yıl için seçilirler. Bir kimse iki defa Anayasa Mahkemesi üyesi seçilemez. Anayasa Mahkemesi üyeleri altmışbeş yaşını doldurunca emekliye ayrılırlar. Zorunlu emeklilik yaşından önce görev süresi dolan üyelerin başka bir görevde çalışmaları ve özlük işleri kanunla düzenlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Anayasa Mahkemesi üyeliği, bir üyenin hakimlik mesleğinden çıkarılmayı gerektiren bir suçtan dolayı hüküm giymesi halinde kendiliğinden; görevini sağlık bakımından yerine getiremeyeceğinin kesin olarak anlaşılması halinde de, Anayasa Mahkemesi üye tamsayısının salt çoğunluğunun kararı ile sona erer.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Görev ve yetkileri">
            <mvz-madde no="148" başlık="">
              <mvz-fıkra no="1">
                <template>Anayasa Mahkemesi, kanunların, Cumhurbaşkanlığı kararnamelerinin ve Türkiye Büyük Millet Meclisi İçtüzüğünün Anayasaya şekil ve esas bakımlarından uygunluğunu denetler ve bireysel başvuruları karara bağlar. Anayasa değişikliklerini ise sadece şekil bakımından inceler ve denetler. Ancak, olağanüstü hallerde  ve savaş hallerinde çıkarılan Cumhurbaşkanlığı kararnamelerinin şekil ve esas bakımından Anayasaya aykırılığı iddiasıyla, Anayasa Mahkemesinde dava açılamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kanunların şekil bakımından denetlenmesi, son oylamanın, öngörülen çoğunlukla yapılıp yapılmadığı; Anayasa değişikliklerinde ise, teklif ve oylama çoğunluğuna ve ivedilikle görüşülemeyeceği şartına uyulup uyulmadığı hususları ile sınırlıdır. Şekil bakımından denetleme, Cumhurbaşkanınca veya Türkiye Büyük Millet Meclisi üyelerinin beşte biri tarafından istenebilir. Kanunun yayımlandığı tarihten itibaren on gün geçtikten sonra, şekil bozukluğuna dayalı iptal davası açılamaz; def'i yoluyla da ileri sürülemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Herkes, Anayasada güvence altına alınmış temel hak ve özgürlüklerinden, Avrupa İnsan Hakları Sözleşmesi kapsamındaki herhangi birinin kamu gücü tarafından, ihlal edildiği iddiasıyla Anayasa Mahkemesine başvurabilir. Başvuruda bulunabilmek için olağan kanun yollarının tüketilmiş olması şarttır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Bireysel başvuruda, kanun yolunda gözetilmesi gereken hususlarda inceleme yapılamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Bireysel başvuruya ilişkin usul ve esaslar kanunla düzenlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Anayasa Mahkemesi Cumhurbaşkanını, Türkiye Büyük Millet Meclisi Başkanını, Cumhurbaşkanı yardımcılarını, bakanları, Anayasa Mahkemesi, Yargıtay, Danıştay  Başkan ve üyelerini, Başsavcılarını, Cumhuriyet Başsavcıvekilini, Hakimler ve Savcılar  Kurulu ve Sayıştay Başkan ve üyelerini görevleriyle ilgili suçlardan dolayı Yüce Divan sıfatıyla yargılar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="7">
                <template>Genelkurmay Başkanı, Kara, Deniz ve Hava Kuvvetleri Komutanları  da görevleriyle ilgili suçlardan dolayı Yüce Divanda yargılanırlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="8">
                <template>Yüce Divanda, savcılık görevini Cumhuriyet Başsavcısı veya Cumhuriyet Başsavcıvekili yapar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="9">
                <template>Yüce Divan kararlarına karşı yeniden inceleme başvurusu yapılabilir. Genel Kurulun yeniden inceleme sonucunda verdiği kararlar kesindir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="10">
                <template>Anayasa Mahkemesi, Anayasa ile verilen diğer görevleri de yerine getirir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="4" başlık="Çalışma ve yargılama usulü">
            <mvz-madde no="149" başlık="">
              <mvz-fıkra no="1">
                <template>Anayasa Mahkemesi, iki bölüm ve Genel Kurul halinde çalışır. Bölümler, başkanvekili başkanlığında dört üyenin katılımıyla toplanır. Genel Kurul, Mahkeme Başkanının veya Başkanın belirleyeceği başkanvekilinin başkanlığında en az on üye ile toplanır. Bölümler ve Genel Kurul, kararlarını salt çoğunlukla alır. Bireysel başvuruların kabul edilebilirlik incelemesi için komisyonlar oluşturulabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Siyasî partilere ilişkin dava ve başvurulara, iptal ve itiraz davaları ile Yüce Divan sıfatıyla yürütülecek yargılamalara Genel Kurulca bakılır, bireysel başvurular ise bölümlerce karara bağlanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Anayasa değişikliğinde iptale, siyasî partilerin kapatılmasına ya da Devlet yardımından yoksun bırakılmasına karar verilebilmesi için toplantıya katılan üyelerin üçte iki oy çokluğu şarttır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Şekil bozukluğuna dayalı iptal davaları Anayasa Mahkemesince öncelikle incelenip karara bağlanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Anayasa Mahkemesinin kuruluşu, Genel Kurul ve bölümlerin yargılama usulleri, Başkan, başkanvekilleri ve üyelerin disiplin işleri kanunla; Mahkemenin çalışma esasları, bölüm ve komisyonların oluşumu ve işbölümü kendi yapacağı İçtüzükle düzenlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Anayasa Mahkemesi Yüce Divan sıfatıyla baktığı davalar dışında kalan işleri dosya üzerinde inceler. Ancak, bireysel başvurularda duruşma yapılmasına karar verilebilir. Mahkeme ayrıca, gerekli gördüğü hallerde sözlü açıklamalarını dinlemek üzere ilgilileri ve konu üzerinde bilgisi olanları çağırabilir ve siyasî partilerin kapatılmasına ilişkin davalarda, Yargıtay Cumhuriyet Başsavcısından sonra kapatılması istenen siyasî partinin genel başkanlığının veya tayin edeceği bir vekilin savunmasını dinler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="5" başlık="İptal davası">
            <mvz-madde no="150" başlık="">
              <mvz-fıkra no="1">
                <template>Kanunların, Cumhurbaşkanlığı kararnamelerinin, Türkiye Büyük Millet Meclisi İçtüzüğünün veya bunların belirli madde ve hükümlerinin şekil ve esas bakımından Anayasaya aykırılığı iddiasıyla Anayasa Mahkemesinde doğrudan doğruya iptal davası açabilme hakkı, Cumhurbaşkanına, Türkiye Büyük Millet Meclisinde en fazla üyeye sahip iki siyasi parti grubuna ve üye tamsayısının en az beşte biri tutarındaki üyelere aittir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="6" başlık="Dava açma süresi">
            <mvz-madde no="151" başlık="">
              <mvz-fıkra no="1">
                <template>Anayasa Mahkemesinde doğrudan doğruya iptal davası açma hakkı, iptali istenen kanun, Cumhurbaşkanlığı kararnamesi veya içtüzüğün Resmî Gazetede yayımlanmasından başlayarak altmış gün sonra düşer.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="7" başlık="Anayasaya aykırılığın diğer mahkemelerde ileri sürülmesi">
            <mvz-madde no="152" başlık="">
              <mvz-fıkra no="1">
                <template>Bir davaya bakmakta olan mahkeme, uygulanacak bir kanun veya Cumhurbaşkanlığı kararnamesinin hükümlerini Anayasaya aykırı görürse veya taraflardan birinin ileri sürdüğü aykırılık iddiasının ciddi olduğu kanısına varırsa, Anayasa Mahkemesinin bu konuda vereceği karara kadar davayı geri bırakır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Mahkeme, Anayasaya aykırılık iddiasını ciddi görmezse bu iddia, temyiz merciince esas hükümle birlikte karara bağlanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Anayasa Mahkemesi, işin kendisine gelişinden başlamak üzere beş ay içinde kararını verir ve açıklar. Bu süre içinde karar verilmezse mahkeme davayı yürürlükteki kanun hükümlerine göre sonuçlandırır. Ancak, Anayasa Mahkemesinin kararı, esas hakkındaki karar kesinleşinceye kadar gelirse, mahkeme buna uymak zorundadır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Anayasa Mahkemesinin işin esasına girerek verdiği red kararının Resmî Gazetede yayımlanmasından sonra on yıl geçmedikçe aynı kanun hükmünün Anayasaya aykırılığı iddiasıyla tekrar başvuruda bulunulamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="8" başlık="Anayasa Mahkemesinin kararları">
            <mvz-madde no="153" başlık="">
              <mvz-fıkra no="1">
                <template>Anayasa Mahkemesinin kararları kesindir. İptal kararları gerekçesi yazılmadan açıklanamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Anayasa Mahkemesi bir kanun veya Cumhurbaşkanlığı kararnamesinin tamamını veya bir hükmünü iptal ederken, kanun koyucu gibi hareketle, yeni bir uygulamaya yol açacak biçimde hüküm tesis edemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kanun, Cumhurbaşkanlığı kararnamesi veya Türkiye Büyük Millet Meclisi İçtüzüğü ya da bunların hükümleri, iptal kararlarının Resmî Gazetede yayımlandığı tarihte yürürlükten kalkar. Gereken hallerde Anayasa Mahkemesi iptal hükmünün yürürlüğe gireceği tarihi ayrıca kararlaştırabilir. Bu tarih, kararın Resmî Gazetede yayımlandığı günden başlayarak bir yılı geçemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>İptal kararının yürürlüğe girişinin ertelendiği durumlarda, Türkiye Büyük Millet Meclisi, iptal kararının ortaya çıkardığı hukuki boşluğu dolduracak kanun  teklifini öncelikle görüşüp karara bağlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>İptal kararları geriye yürümez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Anayasa Mahkemesi kararları Resmî Gazetede hemen yayımlanır ve yasama, yürütme ve yargı organlarını, idare makamlarını, gerçek ve tüzelkişileri bağlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Yargıtay">
          <mvz-madde no="154" başlık="">
            <mvz-fıkra no="1">
              <template>Yargıtay, adliye mahkemelerince verilen ve kanunun başka bir adli yargı merciine bırakmadığı karar ve hükümlerin son inceleme merciidir. Kanunla gösterilen belli davalara da ilk ve son derece mahkemesi olarak bakar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yargıtay üyeleri, birinci sınıfa ayrılmış adli yargı hakim ve Cumhuriyet savcıları ile bu meslekten sayılanlar arasından Hakimler ve Savcılar  Kurulunca üye tamsayısının salt çoğunluğu ile ve gizli oyla seçilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Yargıtay Birinci Başkanı, birinci başkanvekilleri ve daire başkanları kendi üyeleri arasından Yargıtay Genel Kurulunca üye tamsayısının salt çoğunluğu ve gizli oyla dört yıl için seçilirler; süresi bitenler yeniden seçilebilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Yargıtay Cumhuriyet Başsavcısı ve Cumhuriyet Başsavcıvekili, Yargıtay Genel Kurulunun kendi üyeleri arasından gizli oyla belirleyeceği beşer aday arasından Cumhurbaşkanı tarafından dört yıl için seçilirler. Süresi bitenler yeniden seçilebilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Yargıtayın kuruluşu, işleyişi, Başkan, başkanvekilleri, daire başkanları ve üyeleri ile Cumhuriyet Başsavcısı ve Cumhuriyet Başsavcıvekilinin nitelikleri ve seçim usulleri, mahkemelerin bağımsızlığı ve hakimlik teminatı esaslarına göre kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Danıştay">
          <mvz-madde no="155" başlık="">
            <mvz-fıkra no="1">
              <template>Danıştay, idari mahkemelerce verilen ve kanunun başka bir idari yargı merciine bırakmadığı karar ve hükümlerin son inceleme merciidir. Kanunla gösterilen belli davalara da ilk ve son derece mahkemesi olarak bakar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Danıştay, davaları görmek,  kamu hizmetleri ile ilgili imtiyaz şartlaşma ve sözleşmeleri hakkında iki ay içinde düşüncesini bildirmek,  idari uyuşmazlıkları çözmek ve kanunla gösterilen diğer işleri yapmakla görevlidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Danıştay üyelerinin dörtte üçü, birinci sınıf idari yargı hakim ve savcıları ile bu meslekten sayılanlar arasından Hakimler ve Savcılar  Kurulu; dörtte biri, nitelikleri kanunda belirtilen görevliler arasından Cumhurbaşkanı; tarafından seçilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Danıştay Başkanı, Başsavcı, başkanvekilleri ve daire başkanları, kendi üyeleri arasından Danıştay Genel Kurulunca üye tamsayısının salt çoğunluğu ve gizli oyla dört yıl için seçilirler. Süresi bitenler yeniden seçilebilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Danıştayın, kuruluşu, işleyişi, Başkan, Başsavcı, başkanvekilleri, daire başkanları ile üyelerinin nitelikleri ve seçim usulleri, idari yargının özelliği, mahkemelerin bağımsızlığı ve hakimlik teminatı esaslarına göre kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="D" başlık="Askeri Yargıtay">
          <mvz-madde no="156" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="E" başlık="Askeri Yüksek İdare Mahkemesi">
          <mvz-madde no="157" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="F" başlık="Uyuşmazlık Mahkemesi">
          <mvz-madde no="158" başlık="">
            <mvz-fıkra no="1">
              <template>Uyuşmazlık Mahkemesi adli ve idari yargı mercileri arasındaki görev ve hüküm uyuşmazlıklarını kesin olarak çözümlemeye yetkilidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Uyuşmazlık Mahkemesinin kuruluşu, üyelerinin nitelikleri ve seçimleri ile işleyişi kanunla düzenlenir. Bu mahkemenin Başkanlığını Anayasa Mahkemesince, kendi üyeleri arasından görevlendirilen üye yapar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Diğer mahkemelerle, Anayasa Mahkemesi arasındaki görev uyuşmazlıklarında, Anayasa Mahkemesinin kararı esas alınır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="III" başlık="Hakimler ve Savcılar  Kurulu">
        <mvz-madde no="159" başlık="">
          <mvz-fıkra no="1">
            <template>Hâkimler ve Savcılar  Kurulu, mahkemelerin bağımsızlığı ve hâkimlik teminatı esaslarına göre kurulur ve görev yapar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkimler ve Savcılar Kurulu onüç üyeden oluşur; iki daire halinde çalışır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kurulun Başkanı Adalet Bakanıdır. Adalet Bakanlığı Müsteşarı Kurulun tabiî üyesidir. Kurulun, üç üyesi birinci sınıf olup, birinci sınıfa ayrılmayı gerektiren nitelikleri yitirmemiş adlî yargı hâkim ve savcıları arasından, bir üyesi birinci sınıf olup, birinci sınıfa ayrılmayı gerektiren nitelikleri yitirmemiş idarî yargı hâkim ve savcıları arasından Cumhurbaşkanınca; üç üyesi Yargıtay üyeleri, bir üyesi Danıştay üyeleri, üç üyesi nitelikleri kanunda belirtilen yükseköğretim kurumlarının hukuk dallarında görev yapan öğretim üyeleri ile avukatlar arasından Türkiye Büyük Millet Meclisi tarafından seçilir. Öğretim üyeleri ile avukatlar arasından seçilen üyelerden, en az birinin öğretim üyesi ve en az birinin de avukat olması zorunludur. Kurulun Türkiye Büyük Millet Meclisi tarafından seçilecek üyeliklerine ilişkin başvurular, Meclis Başkanlığına yapılır. Başkanlık, başvuruları Anayasa ve Adalet Komisyonları Üyelerinden Kurulu Karma Komisyona gönderir. Komisyon her bir üyelik için üç adayı, üye tamsayısının üçte iki çoğunluğuyla belirler. Birinci oylamada aday belirleme işleminin sonuçlandırılamaması halinde ikinci oylamada üye tamsayısının beşte üç çoğunluğu aranır. Bu oylamada da aday belirlenemediği takdirde, her bir üyelik için en çok oyu alan iki aday arasında ad çekme usulü ile aday belirleme işlemi tamamlanır. Türkiye Büyük Millet Meclisi, Komisyon tarafından belirlenen adaylar arasından, her bir üye için ayrı ayrı gizli oyla seçim yapar. Birinci oylamada üye tamsayısının üçte iki çoğunluğu; bu oylamada seçimin sonuçlandırılamaması halinde, ikinci oylamada üye tamsayısının beşte üç çoğunluğu aranır. İkinci oylamada da üye seçilemediği takdirde en çok oyu alan iki aday arasında ad çekme usulü ile üye seçimi tamamlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Üyeler dört yıl için seçilir. Süresi biten üyeler bir kez daha seçilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kurul üyeliği seçimi, üyelerin görev süresinin dolmasından önceki otuz gün içinde yapılır. Seçilen üyelerin görev süreleri dolmadan Kurul üyeliğinin boşalması durumunda, boşalmayı takip eden otuz gün içinde, yeni üyelerin seçimi yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Kurulun, Adalet Bakanı ile Adalet Bakanlığı Müsteşarı dışındaki  üyeleri, görevlerinin devamı süresince; kanunda belirlenenler dışında başka bir görev alamazlar veya Kurul tarafından başka bir göreve atanamaz ve seçilemezler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Kurulun yönetimi ve temsili Kurul Başkanına aittir. Kurul Başkanı dairelerin çalışmalarına katılamaz. Kurul, kendi üyeleri arasından daire başkanlarını ve daire başkanlarından birini de başkanvekili olarak seçer. Başkan, yetkilerinden bir kısmını başkanvekiline devredebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Kurul, adlî ve idarî yargı hâkim ve savcılarını mesleğe kabul etme, atama ve nakletme, geçici yetki verme, yükselme ve birinci sınıfa ayırma, kadro dağıtma, meslekte kalmaları uygun görülmeyenler hakkında karar verme, disiplin cezası verme, görevden uzaklaştırma işlemlerini yapar; Adalet Bakanlığının, bir mahkemenin kaldırılması veya yargı çevresinin değiştirilmesi konusundaki tekliflerini karara bağlar; ayrıca, Anayasa ve kanunlarla verilen diğer görevleri yerine getirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Hâkim ve savcıların görevlerini; kanun ve diğer mevzuata  uygun olarak yapıp yapmadıklarını denetleme; görevlerinden dolayı veya görevleri sırasında suç işleyip işlemediklerini, hal ve eylemlerinin sıfat ve görevleri icaplarına uyup uymadığını araştırma ve gerektiğinde haklarında inceleme ve soruşturma işlemleri, ilgili dairenin teklifi ve Hâkimler ve Savcılar  Kurulu Başkanının oluru ile Kurul müfettişlerine yaptırılır. Soruşturma ve inceleme işlemleri, hakkında soruşturma ve inceleme yapılacak olandan daha kıdemli hâkim veya savcı eliyle de yaptırılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Kurulun meslekten çıkarma cezasına ilişkin olanlar dışındaki kararlarına karşı yargı mercilerine başvurulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>Kurula bağlı Genel Sekreterlik kurulur. Genel Sekreter, birinci sınıf hâkim ve savcılardan Kurulun teklif ettiği üç aday arasından Kurul Başkanı tarafından atanır. Kurul müfettişleri ile Kurulda geçici veya sürekli olarak çalıştırılacak hâkim ve savcıları, muvafakatlerini alarak atama yetkisi Kurula aittir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="12">
            <template>Adalet Bakanlığının merkez, bağlı ve ilgili kuruluşlarında geçici veya sürekli olarak çalıştırılacak hâkim ve savcılar ile adalet müfettişlerini ve hâkim ve savcı mesleğinden olan iç denetçileri, muvafakatlerini alarak atama yetkisi Adalet Bakanına aittir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="13">
            <template>Kurul üyelerinin seçimi, dairelerin oluşumu ve işbölümü, Kurulun ve dairelerin görevleri, toplantı ve karar yeter sayıları, çalışma usul ve esasları, dairelerin karar ve işlemlerine karşı yapılacak itirazlar ve bunların incelenmesi usulü ile Genel Sekreterliğin kuruluş ve görevleri kanunla düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="IV" başlık="Sayıştay">
        <mvz-madde no="160" başlık="">
          <mvz-fıkra no="1">
            <template>Sayıştay, merkezî yönetim bütçesi kapsamındaki kamu idareleri ile sosyal güvenlik kurumlarının bütün gelir ve giderleri ile mallarını Türkiye Büyük Millet Meclisi adına denetlemek ve sorumluların hesap ve işlemlerini kesin hükme bağlamak ve kanunlarla verilen inceleme, denetleme ve hükme bağlama işlerini yapmakla görevlidir. Sayıştayın kesin hükümleri hakkında ilgililer yazılı bildirim tarihinden itibaren onbeş gün içinde bir kereye mahsus olmak üzere karar düzeltilmesi isteminde bulunabilirler. Bu kararlar dolayısıyla idari yargı yoluna başvurulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Vergi, benzeri mali yükümlülükler ve ödevler hakkında Danıştay ile Sayıştay kararları arasındaki uyuşmazlıklarda Danıştay kararları esas alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahallî idarelerin hesap ve işlemlerinin denetimi ve kesin hükme bağlanması Sayıştay tarafından yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Sayıştayın kuruluşu, işleyişi, denetim usulleri, mensuplarının nitelikleri, atanmaları, ödev ve yetkileri, hakları ve yükümlülükleri ve diğer özlük işleri, Başkan ve üyelerinin teminatı kanunla düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>(Mülga)</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="MALİ VE EKONOMİK HÜKÜMLER">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Mali Hükümler">
      <mvz-b1 no="I" başlık="Bütçe">
        <mvz-b2 no="A" başlık="Bütçe ve kesinhesap">
          <mvz-madde no="161" başlık="">
            <mvz-fıkra no="1">
              <template>Kamu idarelerinin ve kamu iktisadî teşebbüsleri dışındaki kamu tüzel kişilerinin harcamaları yıllık bütçelerle yapılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Malî yıl başlangıcı ile merkezi yönetim bütçesinin hazırlanması, uygulanması ve kontrolü ile yatırımlar veya bir yıldan fazla sürecek iş ve hizmetler için özel süre ve usuller kanunla düzenlenir. Bütçe kanununa, bütçe ile ilgili hükümler dışında hiçbir hüküm konulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Cumhurbaşkanı bütçe kanun teklifini, malî yılbaşından en az yetmişbeş gün önce, Türkiye Büyük Millet Meclisine sunar. Bütçe teklifi Bütçe Komisyonunda görüşülür. Komisyonun ellibeş gün içinde kabul edeceği metin Genel Kurulda görüşülür ve malî yılbaşına kadar karara bağlanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bütçe kanununun süresinde yürürlüğe konulamaması halinde, geçici bütçe kanunu çıkarılır. Geçici bütçe kanununun da çıkarılamaması durumunda, yeni bütçe kanunu kabul edilinceye kadar bir önceki yılın bütçesi yeniden değerleme oranına göre artırılarak uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Türkiye Büyük Millet Meclisi üyeleri, Genel Kurulda kamu idare bütçeleri hakkında düşüncelerini her bütçenin görüşülmesi sırasında açıklarlar, gider artırıcı veya gelirleri azaltıcı önerilerde bulunamazlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Genel Kurulda kamu idare bütçeleri ile değişiklik önergeleri, üzerinde ayrıca görüşme yapılmaksızın okunur ve oylanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Merkezî yönetim bütçesiyle verilen ödenek, harcanabilecek tutarın sınırını gösterir. Harcanabilecek tutarın Cumhurbaşkanlığı kararnamesiyle aşılabileceğine dair bütçe kanununa hüküm konulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="8">
              <template>Carî yıl bütçesindeki ödenek artışını öngören değişiklik teklifleri ile carî ve izleyen yılların bütçelerine malî yük getiren tekliflerde, öngörülen giderleri karşılayabilecek malî kaynak gösterilmesi zorunludur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="9">
