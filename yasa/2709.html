              <template>Merkezî yönetim kesinhesap kanunu teklifi, ilgili olduğu malî yılın sonundan başlayarak en geç altı ay sonra Cumhurbaşkanı tarafından Türkiye Büyük Millet Meclisine sunulur. Sayıştay genel uygunluk bildirimini, ilişkin olduğu kesinhesap kanun teklifinin verilmesinden başlayarak en geç yetmişbeş gün içinde Meclise sunar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="10">
              <template>Kesinhesap kanunu teklifi ve genel uygunluk bildiriminin Türkiye Büyük Millet Meclisine verilmiş olması, ilgili yıla ait Sayıştayca sonuçlandırılamamış denetim ve hesap yargılamasını önlemez ve bunların karara bağlandığı anlamına gelmez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="11">
              <template>Kesinhesap kanunu teklifi, yeni yıl bütçe kanunu teklifiyle birlikte görüşülür ve karara bağlanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Bütçenin görüşülmesi">
          <mvz-madde no="162" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Bütçelerde değişiklik yapılabilme esasları">
          <mvz-madde no="163" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="D" başlık="Kesinhesap">
          <mvz-madde no="164" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="E" başlık="Kamu iktisadi teşebbüslerinin denetimi">
          <mvz-madde no="165" başlık="">
            <mvz-fıkra no="1">
              <template>Sermayesinin yarısından fazlası doğrudan doğruya veya dolaylı olarak Devlete ait olan kamu kuruluş ve ortaklıklarının Türkiye Büyük Millet Meclisince denetlenmesi esasları kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Ekonomik Hükümler">
      <mvz-b1 no="I" başlık="Planlama; Ekonomik ve Sosyal Konsey">
        <mvz-madde no="166" başlık="">
          <mvz-fıkra no="1">
            <template>Ekonomik, sosyal ve kültürel kalkınmayı, özellikle sanayiin ve tarımın yurt düzeyinde dengeli ve uyumlu biçimde hızla gelişmesini, ülke kaynaklarının döküm ve değerlendirilmesini yaparak verimli şekilde kullanılmasını planlamak, bu amaçla gerekli teşkilatı kurmak Devletin görevidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Planda milli tasarrufu ve üretimi artırıcı, fiyatlarda istikrar ve dış ödemelerde dengeyi sağlayıcı, yatırım ve istihdamı geliştirici tedbirler öngörülür; yatırımlarda toplum yararları ve gerekleri gözetilir; kaynakların verimli şekilde kullanılması hedef alınır. Kalkınma girişimleri, bu plana göre gerçekleştirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kalkınma planlarının hazırlanmasına, Türkiye Büyük Millet Meclisince onaylanmasına, uygulanmasına, değiştirilmesine ve bütünlüğünü bozacak değişikliklerin önlenmesine ilişkin usul ve esaslar kanunla düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Ekonomik ve sosyal politikaların oluşturulmasında Cumhurbaşkanına istişarî nitelikte görüş bildirmek amacıyla Ekonomik ve Sosyal Konsey kurulur. Ekonomik ve Sosyal Konseyin kuruluş ve işleyişi kanunla düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="II" başlık="Piyasaların denetimi ve dış ticaretin düzenlenmesi">
        <mvz-madde no="167" başlık="">
          <mvz-fıkra no="1">
            <template>Devlet, para, kredi, sermaye, mal ve hizmet piyasalarının sağlıklı ve düzenli işlemelerini sağlayıcı ve geliştirici tedbirleri alır; piyasalarda fiili veya anlaşma sonucu doğacak tekelleşme ve kartelleşmeyi önler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dış ticaretin ülke ekonomisinin yararına olmak üzere düzenlenmesi amacıyla ithalat, ihracat ve diğer dış ticaret işlemleri üzerine vergi ve benzeri yükümlülükler dışında ek mali yükümlülükler koymaya ve bunları kaldırmaya kanunla Cumhurbaşkanına yetki verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="III" başlık="Tabii servetlerin ve kaynakların aranması ve işletilmesi">
        <mvz-madde no="168" başlık="">
          <mvz-fıkra no="1">
            <template>Tabii servetler ve kaynaklar Devletin hüküm ve tasarrufu altındadır. Bunların aranması ve işletilmesi hakkı Devlete aittir. Devlet bu hakkını belli bir süre için, gerçek ve tüzelkişilere devredebilir. Hangi tabii servet ve kaynağın arama ve işletmesinin, Devletin gerçek ve tüzelkişilerle ortak olarak veya doğrudan gerçek ve tüzelkişiler eliyle yapılması, kanunun açık iznine bağlıdır. Bu durumda gerçek ve tüzelkişilerin uyması gereken şartlar ve Devletçe yapılacak gözetim, denetim usul ve esasları ve müeyyideler kanunda gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="IV" başlık="Ormanlar ve orman köylüsü">
        <mvz-b2 no="A" başlık="Ormanların korunması ve geliştirilmesi">
          <mvz-madde no="169" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet, ormanların korunması ve sahalarının genişletilmesi için gerekli kanunları koyar ve tedbirleri alır. Yanan ormanların yerinde yeni orman yetiştirilir, bu yerlerde başka çeşit tarım ve hayvancılık yapılamaz. Bütün ormanların gözetimi Devlete aittir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Devlet ormanlarının mülkiyeti devrolunamaz. Devlet ormanları kanuna göre, Devletçe yönetilir ve işletilir. Bu ormanlar zamanaşımı ile mülk edinilemez ve kamu yararı dışında irtifak hakkına konu olamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Ormanlara zarar verebilecek hiçbir faaliyet ve eyleme müsaade edilemez. Ormanların tahrip edilmesine yol açan siyasi propaganda yapılamaz; münhasıran orman suçları için genel ve özel af çıkarılamaz. Ormanları yakmak, ormanı yok etmek veya daraltmak amacıyla işlenen suçlar genel ve özel af kapsamına alınamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Orman olarak muhafazasında bilim ve fen bakımından hiçbir yarar görülmeyen, aksine tarım alanlarına dönüştürülmesinde kesin yarar olduğu tespit edilen yerler ile 31/12/1981 tarihinden önce bilim ve fen bakımından orman niteliğini tam olarak kaybetmiş olan tarla, bağ, meyvelik, zeytinlik gibi çeşitli tarım alanlarında veya hayvancılıkta kullanılmasında yarar olduğu tespit edilen araziler, şehir, kasaba ve köy yapılarının toplu olarak bulunduğu yerler dışında, orman sınırlarında daraltma yapılamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Orman köylüsünün korunması">
          <mvz-madde no="170" başlık="">
            <mvz-fıkra no="1">
              <template>Ormanlar içinde veya bitişiğindeki köyler halkının kalkındırılması, ormanların ve bütünlüğünün korunması bakımlarından, ormanın gözetilmesi ve işletilmesinde Devletle bu halkın işbirliğini sağlayıcı tedbirlerle, 31/12/1981 tarihinden önce bilim ve fen bakımından orman niteliğini tamamen kaybetmiş yerlerin değerlendirilmesi; bilim ve fen bakımından orman olarak muhafazasında yarar görülmeyen yerlerin tespiti ve orman sınırları dışına çıkartılması; orman içindeki köyler halkının kısmen veya tamamen bu yerlere yerleştirilmesi için Devlet eliyle anılan yerlerin ihya edilerek bu halkın yararlanmasına tahsisi kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Devlet, bu halkın işletme araç ve gereçleriyle diğer girdilerinin sağlanmasını kolaylaştırıcı tedbirleri alır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Orman içinden nakledilen köyler halkına ait araziler, Devlet ormanı olarak derhal ağaçlandırılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="V" başlık="Kooperatifçiliğin geliştirilmesi">
        <mvz-madde no="171" başlık="">
          <mvz-fıkra no="1">
            <template>Devlet, milli ekonominin yararlarını dikkate alarak, öncelikle üretimin artırılmasını ve tüketicinin korunmasını amaçlayan kooperatifçiliğin gelişmesini sağlayacak tedbirleri alır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>(Mülga)</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="VI" başlık="Tüketiciler ile esnaf ve sanatkarların korunması">
        <mvz-b2 no="A" başlık="Tüketicilerin korunması">
          <mvz-madde no="172" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet, tüketicileri koruyucu ve aydınlatıcı tedbirler alır, tüketicilerin kendilerini koruyucu girişimlerini teşvik eder.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Esnaf ve sanatkarların korunması">
          <mvz-madde no="173" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet, esnaf ve sanatkarı koruyucu ve destekleyici tedbirleri alır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="ÇEŞİTLİ HÜKÜMLER">
    <mvz-b1 no="I" başlık="İnkılap kanunlarının korunması">
      <mvz-madde no="174" başlık="">
        <mvz-fıkra no="1">
          <template>Anayasanın hiçbir hükmü, Türk toplumunu çağdaş uygarlık seviyesinin üstüne çıkarma ve Türkiye Cumhuriyetinin laiklik niteliğini koruma amacını güden, aşağıda gösterilen inkılap kanunlarının, Anayasanın halkoyu ile kabul edildiği tarihte yürürlükte bulunan hükümlerinin, Anayasaya aykırı olduğu şeklinde anlaşılamaz ve yorumlanamaz:</template>
          <mvz-bent no="1.">
            <template>3 Mart 1340 tarihli ve 430 sayılı Tevhidi Tedrisat Kanunu;</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>25 Teşrinisani 1341 tarihli ve 671 sayılı Şapka İktisası Hakkında Kanun;</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>30 Teşrinisani 1341 tarihli ve 677 sayılı Tekke ve Zaviyelerle Türbelerin Seddine ve Türbedarlıklar ile Bir Takım Unvanların Men ve İlgasına Dair Kanun;</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>17 Şubat 1926 tarihli ve 743 sayılı Türk Kanunu Medenisiyle kabul edilen, evlenme akdinin evlendirme memuru önünde yapılacağına dair medeni nikah esası ile aynı kanunun 110 uncu maddesi hükmü;</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>20 Mayıs 1928 tarihli ve 1288 sayılı Beynelmilel Erkamın Kabulü Hakkında Kanun;</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>1 Teşrinisani 1928 tarihli ve 1353 sayılı Türk Harflerinin Kabul ve Tatbiki hakkında Kanun;</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>26 Teşrinisani 1934 tarihli ve 2590 sayılı Efendi, Bey, Paşa gibi Lakap ve Unvanların Kaldırıldığına dair Kanun;</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>3 Kanunuevvel 1934 tarihli ve 2596 sayılı Bazı Kisvelerin Giyilemeyeceğine Dair Kanun.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="GEÇİCİ HÜKÜMLER">
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Anayasanın halkoylaması sonucu, Türkiye Cumhuriyeti Anayasası olarak kabul edildiğinin usulünce ilanı ile birlikte, halkoylaması tarihindeki Milli Güvenlik Konseyi Başkanı ve Devlet Başkanı, Cumhurbaşkanı sıfatını kazanarak, yedi yıllık bir dönem için, Anayasa ile Cumhurbaşkanına tanınan görevleri yerine getirir ve yetkileri kullanır. 18 Eylül 1980 tarihinde Devlet Başkanı olarak içtiği and yürürlükte kalır. Yedi yıllık sürenin sonunda Cumhurbaşkanlığı seçimi Anayasada öngörülen hükümlere göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cumhurbaşkanı, ilk genel seçimler sonucu Türkiye Büyük Millet Meclisi toplanıp; Başkanlık Divanı oluşuncaya kadar, 12 Aralık 1980 gün ve 2356 sayılı Kanunla teşekkül etmiş olan Milli Güvenlik Konseyinin Başkanlığını da yürütür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İlk milletvekili genel seçimleri sonunda Türkiye Büyük Millet Meclisi toplanıp göreve başlayıncaya kadar geçecek süre içinde, Cumhurbaşkanlığının herhangi bir surette boşalması halinde, Milli Güvenlik Konseyinin en kıdemli üyesi, Türkiye Büyük Millet Meclisi toplanıp Anayasaya göre yeni Cumhurbaşkanını seçinceye kadar, Cumhurbaşkanına vekalet eder ve O'nun Anayasadaki bütün görevlerini yerine getirir ve yetkilerini kullanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>12 Aralık 1980 gün ve 2356 sayılı Kanunla kuruluşu gösterilen Milli Güvenlik Konseyi, Anayasaya dayalı olarak hazırlanacak Siyasi Partiler Kanunu ile Seçim Kanununa göre yapılacak ilk genel seçimler sonucu Türkiye Büyük Millet Meclisi toplanıp Başkanlık Divanını oluşturuncaya kadar 2324 sayılı Anayasa Düzeni Hakkında Kanun ve 2485 sayılı Kurucu Meclis Hakkında Kanunlara göre görevlerini devam ettirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Anayasanın kabulünden sonra 2356 sayılı Kanunun 3 üncü maddesindeki Milli Güvenlik Konseyi Üyeliklerinden birisinin herhangi bir nedenle boşalması halinde doldurulması usulüne ilişkin hüküm uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Türkiye Büyük Millet Meclisi toplanıp göreve başladıktan sonra, Milli Güvenlik Konseyi, altı yıllık bir süre için Cumhurbaşkanlığı Konseyi haline dönüşür ve Milli Güvenlik Konseyi Üyeleri, Cumhurbaşkanlığı Konseyi Üyesi sıfatını alırlar. Milli Güvenlik Konseyi üyesi olarak 18 Eylül 1980 tarihinde içtikleri and yürürlükte kalır. Cumhurbaşkanlığı Konseyi Üyeleri, Anayasada Türkiye Büyük Millet Meclisi üyelerinin haiz bulundukları özlük hakları ile dokunulmazlığına sahip olurlar. Altı yıllık süre sonunda Cumhurbaşkanlığı Konseyinin hukuki varlığı sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Cumhurbaşkanlığı Konseyinin görevleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Türkiye Büyük Millet Meclisince kabul edilerek Cumhurbaşkanlığına gönderilen, Anayasada yazılı temel hak ve hürriyetlere ve ödevlere, laiklik ilkesine, Atatürk inkılaplarının, milli güvenliğin ve kamu düzeninin korunmasına, Türkiye Radyo - Televizyon Kurumuna, Milletlerarası andlaşmalara, dış ülkelere silahlı kuvvet gönderilmesine ve yabancı kuvvetlerin Türkiyeye kabulüne, olağanüstü yönetime, sıkıyönetim ve savaş haline dair kanunlar ile Cumhurbaşkanınca gerekli görülen diğer kanunları Cumhurbaşkanına tanınan onbeş günlük sürenin ilk on günü içinde incelemek;</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Cumhurbaşkanının istemi ve tespit edeceği süre içinde:</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Milletvekili genel seçimlerinin yenilenmesine, olağanüstü yönetim yetkisinin kullanılmasına ve alınacak tedbirlere, Türkiye Radyo - Televizyon Kurumunun yönetim ve gözetimine, gençliğin yetiştirilmesine ve Diyanet İşlerinin düzenlenmesine ilişkin  konuları incelemek ve görüş bildirmek;</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Cumhurbaşkanının istemine göre, iç ve dış güvenlik ile gerekli görülen diğer konularda inceleme ve araştırma yapmak ve sonuçlarını Cumhurbaşkanına sunmak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Anayasaya göre yapılacak ilk milletvekili genel seçimi sonucunda Türkiye Büyük Millet Meclisi toplanıp, Başkanlık Divanını oluşturması ile birlikte:</template>
        <mvz-bent no="a">
          <template>27 Ekim 1980 gün ve 2324 sayılı Anayasa Düzeni Hakkında Kanun,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>12 Aralık 1980 gün ve 2356 sayılı Milli Güvenlik Konseyi Hakkında Kanun,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>29 Haziran 1981 gün ve 2485 sayılı Kurucu Meclis Hakkında Kanun,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yürürlükten kalkar ve Milli Güvenlik Konseyi ile Danışma Meclisinin hukuki varlıkları sona erer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yapılacak ilk milletvekili genel seçimi sonucunun Yüksek Seçim Kurulunca ilanını takip eden onuncu gün, Türkiye Büyük Millet Meclisi Ankara'da, Türkiye Büyük Millet Meclisi binasında, saat 15.00 de kendiliğinden toplanır. Bu toplantıya en yaşlı Milletvekili Başkanlık eder. Bu toplantıda milletvekilleri andiçerler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Anayasaya göre kurulan Türkiye Büyük Millet Meclisinin toplantı ve çalışmaları için kendi içtüzükleri yapılıncaya kadar, Millet Meclisinin 12 Eylül 1980 tarihinden önce yürürlükte olan İçtüzüğünün, Anayasaya aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İlk milletvekili genel seçimi sonunda, Türkiye Büyük Millet Meclisi toplanıp, yeni Bakanlar Kurulu kuruluncaya kadar, iş başında olan Bakanlar Kurulunun görevi devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Anayasa ile kabul edilmiş olan yeni organ, kurum ve kurulların kuruluş, görev, yetki ve işleyişleri ile ilgili kanunlarla, Anayasada konulması veya değiştirilmesi öngörülen diğer kanunlar, Anayasanın kabulünden başlayarak Kurucu Meclisin görev süresi içerisinde, bu süre içerisinde yetiştirilemeyenler, seçimle gelen Türkiye Büyük Millet Meclisinin ilk toplantısını izleyen bir yıl sonuna kadar çıkartılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İlk genel seçimler sonucu toplanacak Türkiye Büyük Millet Meclisinin Başkanlık Divanı kurulduktan sonra altı yıllık süre içinde yapılacak Anayasa değişikliklerini Cumhurbaşkanı, Türkiye Büyük Millet Meclisine geri gönderebilir. Bu takdirde Türkiye Büyük Millet Meclisinin geri gönderilen Anayasa değişikliği hakkındaki kanunu, aynen kabul edip tekrar Cumhurbaşkanına gönderebilmesi, üye tamsayısının dörtte üç çoğunluğunun oyu ile mümkün olabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Mahalli İdare seçimleri en geç Türkiye Büyük Millet Meclisinin ilk toplantısını izleyen bir yıl içinde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Anayasanın halkoyu ile kabul edildiği tarihte Anayasa Mahkemesi asıl ve yedek üyesi olanların kadroları ile görevleri devam eder. Bunlardan Anayasa Mahkemesince belli görevlere seçilenlerin bu suretle kazanmış oldukları sıfatları saklı kalır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Anayasa Mahkemesi asıl üye sayısı onbire ininceye kadar boşalan asıl üye kadrosuna, asıl ve yedek üye sayısı toplamı onbeşe ininceye kadar da boşalan yedek üye kadrosuna seçim yapılmaz. Anayasa Mahkemesinin yeni düzenlemeye intibakı sağlanıncaya kadar asıl üye sayısının onbirden, asıl ve yedek üye sayıları toplamının onbeşden aşağı düşmesi nedeniyle yapılacak seçimlerde bu Anayasanın kabul ettiği esasa ve sıraya uyulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Anayasa Mahkemesi asıl üye sayısı onbire ininceye kadar dava ve işlerde 22/4/1962 gün ve 44 sayılı Kanunun öngördüğü toplanma yeter sayısı uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>13/5/1981 gün ve 2461 sayılı Hakimler ve Savcılar Yüksek Kurulu Kanununun geçici 1 inci maddesi uyarınca Yargıtay ve Danıştaydan Kurulun asıl ve yedek üyeliğine; 1730 sayılı Yargıtay Kanununa 25/6/1981 gün ve 2483 sayılı Kanunla eklenen geçici madde uyarınca Cumhuriyet Başsavcılığı ile Cumhuriyet Başsavcıvekilliğine; 6/1/1982 gün ve 2575 sayılı Danıştay Kanununun geçici 14 üncü maddesinin ikinci fıkrası uyarınca Danıştay Başkanlığına, Başsavcılığına, başkanvekilliklerine ve daire başkanlıklarına, Devlet Başkanınca seçilmiş bulunanlar, seçildikleri dönem için bu görevlerine devam ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>6/1/1982 gün ve 2576 sayılı Kanunun geçici maddelerinin idari mahkemeler Başkan ve üyeliklerine atamalara ilişkin hükümleri de saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Hakimler ve Savcılar Yüksek Kuruluna Yargıtaydan seçilmesi gereken bir asıl ve bir yedek üyenin seçimleri Anayasa'nın yürürlüğe girdiği tarihi izleyen yirmi gün içinde yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçilen üyeler göreve başlayıncaya kadar Kurul, toplantı yeter sayısını oluşturacak yedek üyenin katılmasıyla çalışmalarını yapar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Sendikaların gelirlerini Devlet bankalarında muhafaza etmelerine ilişkin yükümlülükleri, Anayasanın yürürlüğe girdiği tarihten itibaren en geç iki yıl içinde yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Anayasanın halkoylamasına ilişkin oy verme kütüğünde ve sandık listesinde kaydı ve oy kullanma yeterliği bulunduğu halde hukuki veya fiili herhangi bir mazereti olmaksızın halkoylamasına katılmayanlar, Anayasanın halkoylamasını takip eden beş yıl içinde yapılacak genel ve ara seçimleri ile mahalli seçimlere ve diğer halkoylamalarına katılamazlar, seçimlerde aday olamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesinden sonra yapılacak ilk genel seçimde, Anayasanın 67 nci maddesinin son fıkrası 10/6/1983 tarihli ve 2839 sayılı Milletvekili Seçimi Kanununun bağımsız adayların birleşik oy pusulasında yer almasına ilişkin hükümleri bakımından uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte Anayasa Mahkemesinin mevcut yedek üyeleri asıl üye sıfatını kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren otuz gün içinde, Türkiye Büyük Millet Meclisi bir üyeyi Sayıştay Genel Kurulunun ve bir üyeyi de baro başkanlarının gösterecekleri üçer aday içinden seçer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Türkiye Büyük Millet Meclisinin yapacağı üye seçimi için aday göstermek amacıyla;</template>
        <mvz-bent no="a">
          <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren beş gün içinde, Sayıştay Başkanı adaylık başvurusunu ilan eder. İlan tarihinden itibaren beş gün içinde adaylar Başkanlığa başvurur. Başvuru tarihinin sona erdiği günden itibaren beş gün içinde Sayıştay Genel Kurulunca seçim yapılır. Her Sayıştay üyesinin  oy kullanabileceği bu seçimde en fazla oy alan üç kişi aday gösterilmiş sayılır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren beş gün içinde, Türkiye Barolar Birliği Başkanlığı adaylık başvurusunu ilan eder. İlan tarihinden itibaren beş gün içinde adaylar Türkiye Barolar Birliği Başkanlığına başvurur. Başvuru tarihinin sona erdiği günden itibaren beş gün içinde Türkiye Barolar Birliği Başkanlığının ilanında gösterilen yer ve zamanda baro başkanları tarafından seçim yapılır. Her bir baro başkanının  oy kullanabileceği bu seçimde, en fazla oy alan üç kişi aday gösterilmiş sayılır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>(a) ve (b) bentleri uyarınca yapılan seçimlerin sonucunda aday gösterilmiş sayılanların isimleri seçimin yapıldığı günü takip eden gün Sayıştay ve Türkiye Barolar Birliği başkanlıklarınca Türkiye Büyük Millet Meclisi Başkanlığına bildirilir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>(c) bendi uyarınca yapılan bildirimden itibaren on gün içinde Türkiye Büyük Millet Meclisinde seçim yapılır. Her boş üyelik için yapılacak seçimde, ilk oylamada üye tamsayısının üçte iki ve ikinci oylamada üye tamsayısının salt çoğunluğu aranır; ikinci oylamada salt çoğunluk sağlanamazsa bu oylamada en çok oy alan iki aday için üçüncü oylama yapılır; üçüncü oylamada en fazla oy alan aday üye seçilmiş olur.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Cumhurbaşkanı, birer üyeyi Yargıtay ve Danıştay kontenjanlarından olan ilk üyeliklerin boşalmasından sonra Yükseköğretim Kurulunun kendi üyesi olmayan yükseköğretim kurumlarının hukuk, iktisat ve siyasal bilimler dallarında görev yapan öğretim üyeleri arasından göstereceği üçer aday içinden seçer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Anayasa Mahkemesi üyeliğine aday gösteren kurumların halen mevcut üyeleri ile kendi kontenjanlarından seçilmiş yedek üyeler, tamamlama seçiminde göz önünde bulundurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Anayasa Mahkemesinde halen belli görevlere seçilmiş olanların bu sıfatları seçilmiş oldukları sürenin sonuna kadar devam eder. Bu Kanunun yürürlüğe girdiği tarihte üye olanlar yaş haddine kadar görevlerine devam ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bireysel başvuruya ilişkin gerekli düzenlemeler iki yıl içinde tamamlanır. Uygulama kanununun yürürlüğe girdiği tarihten itibaren bireysel başvurular kabul edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren otuz gün içinde aşağıda belirtilen esas ve usuller dahilinde Hâkimler ve Savcılar Yüksek Kurulu üyeleri seçilir:</template>
        <mvz-bent no="a">
          <template>Cumhurbaşkanı, hâkimlik mesleğine alınmasına engel bir hali olmayan; yükseköğretim kurumlarının hukuk,  dallarında en az onbeş yıldan beri görev yapan öğretim üyeleri,  ile meslekte fiilen onbeş yılını doldurmuş avukatlar arasından dört üye seçer.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yargıtay Genel Kurulu, Yargıtay üyeleri arasından üç asıl ve üç yedek üye seçer. Bu Kanunun yürürlüğe girdiği tarihten itibaren yedi gün içinde Yargıtay Birinci Başkanı adaylık başvurusunu ilan eder. İlan tarihinden itibaren yedi gün içinde adaylar Birinci Başkanlığa başvurur. Başvuru tarihinin sona erdiği günden itibaren onbeş gün içinde Yargıtay Genel Kurulu seçim yapar. Her Yargıtay üyesinin  oy kullanabileceği seçimde, en fazla oy alan adaylar sırasıyla asıl ve yedek üye seçilmiş olur.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Danıştay Genel Kurulu, Danıştay üyeleri arasından iki asıl ve iki yedek üye seçer. Bu Kanunun yürürlüğe girdiği tarihten itibaren yedi gün içinde Danıştay Başkanı adaylık başvurusunu ilan eder. İlan tarihinden itibaren yedi gün içinde adaylar Başkanlığa başvurur. Başvuru tarihinin sona erdiği günden itibaren onbeş gün içinde Danıştay Genel Kurulu seçim yapar. Her Danıştay üyesinin  oy kullanabileceği seçimde, en fazla oy alan adaylar sırasıyla asıl ve yedek üye seçilmiş olur.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Türkiye Adalet Akademisi Genel Kurulu, kendi üyeleri arasından, Hâkimler ve Savcılar Yüksek Kuruluna bir asıl ve bir yedek üye seçer. Bu Kanunun yürürlüğe girdiği tarihten itibaren yedi gün içinde Türkiye Adalet Akademisi Başkanı adaylık başvurusunu ilan eder. İlan tarihinden itibaren yedi gün içinde adaylar Başkanlığa başvurur. Başvuru tarihinin sona erdiği günden itibaren onbeş gün içinde Türkiye Adalet Akademisi Genel Kurulu seçim yapar. Her üyenin  oy kullanabileceği seçimde, en fazla oy alan adaylar sırasıyla asıl ve yedek üye seçilmiş olur.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yedi asıl ve dört yedek üye birinci sınıf olup, birinci sınıfa ayrılmayı gerektiren nitelikleri yitirmemiş olan adlî yargı hâkim ve savcıları arasından, adlî yargı hâkim ve savcıları tarafından Yüksek Seçim Kurulunun yönetim ve denetiminde seçilir. Bu Kanunun yürürlüğe girdiği tarihten itibaren beş gün içinde Yüksek Seçim Kurulu adaylık başvurularını ilân eder. İlân tarihinden itibaren üç gün içinde adaylar Yüksek Seçim Kuruluna başvurur. Başvuru tarihinin sona erdiği günden itibaren iki gün içinde Yüksek Seçim Kurulu adayların başvurularını inceler ve aday listesini belirleyerek ilân eder. Takip eden iki gün içinde bu listeye karşı itiraz edilebilir. İtiraz süresinin sona erdiği günden itibaren iki gün içinde itirazlar incelenir, sonuçlandırılır ve kesin aday listesi ilân edilir. Yüksek Seçim Kurulunun kesin aday listesini ilân ettiği tarihten sonraki ikinci Pazar günü her ilde, il seçim kurulunun yönetim ve denetimi altında yapılacak seçimlerde, o ilde ve ilçelerinde görev yapan hâkim ve savcılar oy kullanır. İl seçim kurulları o ilde oy kullanacak hâkim ve savcıların sayısına göre sandık kurulları oluşturur. Sandık kurullarının işlem, tedbir ve kararlarına karşı yapılan şikâyet ve itirazlar il seçim kurulunca karara bağlanır. Adaylar propaganda yapamazlar; sadece, Yüksek Seçim Kurulu tarafından belirlenen usul ve esaslar çerçevesinde özgeçmişlerini bu iş için tahsis edilmiş bir internet sitesinde yayımlayabilirler.  Seçimlerde en çok oy alan adaylar sırasıyla asıl ve yedek üye seçilmiş olur. Kullanılacak oy pusulalarıyla ilgili diğer hususlar Yüksek Seçim Kurulu tarafından belirlenir. Yüksek Seçim Kurulu, oy pusulalarını kendisi bastırabileceği gibi gerektiğinde uygun göreceği il seçim kurulları vasıtasıyla bastırmaya da yetkilidir. Yapılacak seçimlerde, 26/4/1961 tarihli ve 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunun bu bende aykırı olmayan hükümleri uygulanır.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Üç asıl ve iki yedek üye birinci sınıf olup, birinci sınıfa ayrılmayı gerektiren nitelikleri yitirmemiş idarî yargı hâkim ve savcıları arasından, idarî yargı hâkim ve savcıları tarafından Yüksek Seçim Kurulunun yönetim ve denetiminde seçilir. Bölge idare mahkemelerinin bulunduğu illerde, il seçim kurulunun yönetim ve denetimi altında yapılacak bu seçimlerde, o bölge idare mahkemesinde ve yargı çevresi içerisinde kalan yerlerde görev yapan idarî yargı hâkim ve savcıları oy kullanır. Bu seçimler hakkında da (d) bendi hükümleri uygulanır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkranın (a), (ç), (d) ve (e) bentleri uyarınca seçilen Hâkimler ve Savcılar Yüksek Kurulunun asıl üyeleri bu Kanunun yürürlüğe girdiği tarihten sonraki otuzuncu günü takip eden iş günü görevlerine başlarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun yürürlüğe girdiği tarihte, Hâkimler ve Savcılar Yüksek Kurulunun Yargıtay ve Danıştaydan gelen asıl ve yedek üyelerinin görevleri, seçilmiş oldukları sürenin sonuna kadar devam eder. Bunlardan, Yargıtaydan gelen üyelerden görev süresini tamamlayanların yerine birinci fıkranın (b) bendi uyarınca seçilenler; Danıştaydan gelen üyelerden görev süresini tamamlayanların yerine birinci fıkranın (c) bendi uyarınca seçilenler, sırayla göreve başlarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkranın (b) ve (c) bentleri uyarınca seçilen üyelerden, üçüncü fıkra uyarınca göreve başlayanların görev süresi, birinci fıkranın (a), (ç), (d) ve (e) bentleri uyarınca seçilen diğer Kurul üyelerinin görev süresinin bittiği tarihte sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İlgili kanunlarda gerekli düzenlemeler yapılıncaya kadar, Hâkimler ve Savcılar Yüksek Kuruluna seçilen asıl üyeler, Yargıtay daire başkanı için ilgili mevzuatında öngörülen tüm malî ve sosyal haklar ile emeklilik hakkından aynen yararlanırlar. Ayrıca, Kurulun Başkanı dışındaki asıl üyelerine,  gösterge rakamının memur aylıklarına uygulanan katsayı ile çarpımı sonucu bulunacak miktarda aylık ek tazminat ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İlgili kanunlarda düzenleme yapılıncaya kadar, Hâkimler ve Savcılar Yüksek Kurulu;</template>
        <mvz-bent no="a">
          <template>Anayasa hükümlerine aykırı olmamak kaydıyla, yürürlükteki kanun hükümlerine göre Kurul şeklinde çalışır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İkinci fıkra uyarınca asıl üyelerinin göreve başladığı tarihten itibaren bir hafta içinde Adalet Bakanının başkanlığında toplanır ve bir geçici Başkanvekili seçer.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>En az onbeş üye ile toplanır ve üye tam sayısının salt çoğunluğu ile karar verir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Sekreterya hizmetleri Adalet Bakanlığı tarafından yürütülür.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kurul müfettişleri ile adalet müfettişleri atanıncaya kadar, mevcut adalet müfettişleri, Kurul müfettişi ve adalet müfettişi sıfatıyla görev yaparlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu madde hükümleri, ilgili kanunlarda gerekli düzenlemeler yapılıncaya kadar uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin Türkiye Büyük Millet Meclisinde kabul edildiği tarihte; soruşturmaya veya soruşturma ya da kovuşturma izni vermeye yetkili mercilerden, Cumhuriyet başsavcılıklarından ve mahkemelerden; Adalet Bakanlığına, Başbakanlığa, Türkiye Büyük Millet Meclisi Başkanlığına veya Anayasa ve Adalet komisyonları üyelerinden kurulu Karma Komisyon Başkanlığına intikal etmiş yasama dokunulmazlığının kaldırılmasına ilişkin dosyaları bulunan milletvekilleri hakkında, bu dosyalar bakımından, Anayasanın 83 üncü maddesinin ikinci fıkrasının birinci cümlesi hükmü uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin yürürlüğe girdiği tarihten itibaren onbeş gün içinde; Anayasa ve Adalet komisyonları üyelerinden kurulu Karma Komisyon Başkanlığında, Türkiye Büyük Millet Meclisi Başkanlığında, Başbakanlıkta ve Adalet Bakanlığında bulunan yasama dokunulmazlığının kaldırılmasına ilişkin dosyalar, gereğinin yapılması amacıyla, yetkili merciine iade edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template></template>
        <mvz-bent no="A">
          <template>Türkiye Büyük Millet Meclisinin 27’nci Yasama Dönemi milletvekili genel seçimi ve Cumhurbaşkanlığı seçimi 3/11/2019 tarihinde birlikte yapılır. Seçimin yapılacağı tarihe kadar Türkiye Büyük Millet Meclisi üyeleri ve Cumhurbaşkanının görevi devam eder. Meclisin seçim kararı alması halinde, 27’nci Yasama Dönemi milletvekili genel seçimi ve Cumhurbaşkanlığı seçimi birlikte yapılır.</template>
        </mvz-bent>
        <mvz-bent no="B">
          <template>Bu Kanunun yayımı tarihinden itibaren en geç altı ay içinde Türkiye Büyük Millet Meclisi, bu Kanunla yapılan değişikliklerin gerektirdiği Meclis İçtüzüğü değişikliği ile diğer kanuni düzenlemeleri yapar. Cumhurbaşkanlığı kararnamesiyle düzenleneceği belirtilen değişiklikler ise Cumhurbaşkanının göreve başlama tarihinden itibaren en geç altı ay içinde Cumhurbaşkanı tarafından düzenlenir.</template>
        </mvz-bent>
        <mvz-bent no="C">
          <template>Anayasanın 159 uncu maddesinde yapılan düzenlemeye göre Hâkimler ve Savcılar Kurulu üyeleri en geç otuz gün içinde seçilirler ve bu Kanunun yürürlüğe girdiği tarihten sonraki kırkıncı günü takip eden iş günü görevlerine başlarlar. Başvurular, bu maddenin yürürlüğe girdiği tarihten itibaren beş gün içinde Türkiye Büyük Millet Meclisi Başkanlığına yapılır. Başkanlık, başvuruları Anayasa ve Adalet Komisyonları Üyelerinden Kurulu Karma Komisyona gönderir. Komisyon on gün içinde her bir üyelik için üç adayı üye tamsayısının üçte iki çoğunluğuyla belirler. Birinci oylamada üçte iki çoğunlukla seçimin sonuçlandırılamaması halinde, ikinci ve üçüncü oylamalar yapılır; bu oylamalarda üye tamsayısının beşte üç çoğunluğunun oyunu alan aday seçilmiş olur. Beşte üç çoğunluğun sağlanamaması halinde üçüncü oylamada en çok oyu almış olan, seçilecek üyelerin iki katı aday arasından ad çekme usulü ile üye belirleme işlemi tamamlanır. Türkiye Büyük Millet Meclisi Genel Kurulu aynı usul ve nisapları gözeterek onbeş gün içinde seçimi tamamlar. Mevcut Hâkimler ve Savcılar Yüksek Kurulu üyeleri, yeni üyelerin göreve başlayacağı tarihe kadar görevlerine devam eder ve bu süre içinde yürürlükteki Kanun hükümlerine göre çalışır. Yeni üyeler, ilgili kanunda değişiklik yapılıncaya kadar mevcut Kanunun Anayasaya aykırı olmayan hükümleri uyarınca çalışır. Görevi sona eren ve Hâkimler ve Savcılar Kuruluna yeniden seçilmeyen üyelerden, talepleri halinde adli yargı hâkim ve savcıları arasından seçilenler Yargıtay üyeliğine, idari yargı hâkim ve savcıları arasından seçilenler Danıştay üyeliğine Hâkimler ve Savcılar Kurulunca seçilir; öğretim üyeleri ve avukatlar arasından seçilenler ise Danıştay üyeliğine Cumhurbaşkanınca atanır. Bu şekilde yapılan seçim ve atamalarda boş kadro olup olmadığına bakılmaz, seçilen ve atanan üye sayısı kadar Yargıtay ve Danıştay kadrolarına üye kadrosu ilave edilir.</template>
        </mvz-bent>
        <mvz-bent no="D">
          <template>Askerî Yargıtay ve Askerî Yüksek İdare Mahkemesinden Anayasa Mahkemesi üyeliğine seçilmiş bulunan kişilerin herhangi bir sebeple görevleri sona erene kadar üyelikleri devam eder.</template>
        </mvz-bent>
        <mvz-bent no="E">
          <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla Askerî Yargıtay, Askerî Yüksek İdare Mahkemesi ve askerî mahkemeler kaldırılmıştır.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren dört ay içinde; Askerî Yargıtay ve Askerî Yüksek İdare Mahkemesinin askerî hâkim sınıfından Başkan, Başsavcı, İkinci Başkan ve üyeleri ile diğer askerî hâkimler  tercihleri ve müktesepleri dikkate alınarak;</template>
          <mvz-altbent no="a">
            <template>Hâkimler ve Savcılar Kurulunca adli veya idari yargıda hâkim veya savcı olarak atanabilirler.</template>
          </mvz-altbent>
          <mvz-altbent no="b">
            <template>Aylık, ek gösterge, ödenek, yargı ödeneği, ek ödeme, malî, sosyal hak ve yardımlar ile diğer hakları yönünden emsali adli veya idari yargıya mensup hâkim ve savcılar, bunların dışındaki hak ve yükümlülükler yönünden ise bu Kanunun yürürlüğe girdiği tarihteki mevzuat hükümleri uygulanmaya devam edilmek suretiyle Millî Savunma Bakanlığınca mevcut sınıflarında, Bakanlık veya Genelkurmay Başkanlığının hukuk hizmetleri kadrolarına atanırlar. Bunlardan, emeklilik hakkını elde edenlerden yaş haddinden önce bu görevlerden kendi istekleriyle ayrılacaklara ödenecek tazminata ilişkin usul ve esaslar kanunla düzenlenir.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Kaldırılan askerî yargı mercilerinde görülmekte olan dosyalardan; kanun yolu incelemesi aşamasında olanlar ilgisine göre Yargıtay veya Danıştaya, diğer dosyalar ise ilgisine göre görevli ve yetkili adli veya idari yargı mercilerine dört ay içinde gönderilir.</template>
        </mvz-bent>
        <mvz-bent no="F">
          <template>Bu Kanunun yürürlüğe girdiği tarihte yürürlükte bulunan kanun hükmünde kararnameler, tüzükler, Başbakanlık ve Bakanlar Kurulu tarafından çıkarılan yönetmelikler ile diğer düzenleyici işlemler yürürlükten kaldırılmadıkça geçerliliğini sürdürür. Yürürlükte bulunan kanun hükmünde kararnameler hakkında 152 nci ve 153 üncü maddelerin uygulanmasına devam olunur.</template>
        </mvz-bent>
        <mvz-bent no="G">
          <template>Kanunlar ve diğer mevzuat ile Başbakanlık ve Bakanlar Kuruluna verilen yetkiler, ilgili mevzuatta değişiklik yapılıncaya kadar Cumhurbaşkanı tarafından kullanılır.</template>
        </mvz-bent>
        <mvz-bent no="H">
          <template>Anayasanın 67 nci maddesinin son fıkrası hükmü, bu Kanunun yürürlüğe girdiği tarihten sonra birlikte yapılacak ilk milletvekili genel seçimi ile Cumhurbaşkanlığı seçimi bakımından uygulanmaz.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="7-YEDİNCİ" başlık="SON HÜKÜMLER">
    <mvz-b1 no="I" başlık="Anayasanın değiştirilmesi, seçimlere ve halkoylamasına katılma:">
      <mvz-madde no="175" başlık="">
        <mvz-fıkra no="1">
          <template>Anayasanın değiştirilmesi Türkiye Büyük Millet Meclisi üye tamsayısının en az üçte biri tarafından yazıyla teklif edilebilir. Anayasanın değiştirilmesi hakkındaki teklifler Genel Kurulda iki defa görüşülür. Değiştirme teklifinin kabulü Meclisin üye tamsayısının beşte üç çoğunluğunun gizli oyuyla mümkündür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Anayasanın değiştirilmesi hakkındaki tekliflerin görüşülmesi ve kabulü, bu maddedeki kayıtlar dışında, kanunların görüşülmesi ve kabulü hakkındaki hükümlere tabidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Cumhurbaşkanı Anayasa değişikliklerine ilişkin kanunları, bir daha görüşülmek üzere Türkiye Büyük Millet Meclisine geri gönderebilir. Meclis, geri gönderilen Kanunu, üye tamsayısının üçte iki çoğunluğu ile aynen kabul ederse Cumhurbaşkanı bu Kanunu halkoyuna sunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Meclisce üye tamsayısının beşte üçü ile veya üçte ikisinden az oyla kabul edilen Anayasa değişikliği hakkındaki Kanun, Cumhurbaşkanı tarafından Meclise iade edilmediği takdirde halkoyuna sunulmak üzere Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Doğrudan veya Cumhurbaşkanının iadesi üzerine, Meclis üye tamsayısının üçte iki çoğunluğu ile kabul edilen Anayasa değişikliğine ilişkin kanun veya gerekli görülen maddeleri Cumhurbaşkanı tarafından halkoyuna sunulabilir. Halkoylamasına sunulmayan Anayasa değişikliğine ilişkin Kanun veya ilgili maddeler Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Halkoyuna sunulan Anayasa değişikliklerine ilişkin kanunların yürürlüğe girmesi için, halkoylamasında kullanılan geçerli oyların yarısından çoğunun kabul oyu olması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Türkiye Büyük Millet Meclisi Anayasa değişikliklerine ilişkin kanunların kabulü sırasında, bu Kanunun halkoylamasına sunulması halinde, Anayasanın değiştirilen hükümlerinden, hangilerinin birlikte hangilerinin ayrı ayrı oylanacağını da karara bağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Halkoylamasına, milletvekili genel ve ara seçimlerine ve mahalli genel seçimlere iştiraki temin için, kanunla para cezası dahil gerekli her türlü tedbir alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="II" başlık="Başlangıç ve kenar başlıklar">
      <mvz-madde no="176" başlık="">
        <mvz-fıkra no="1">
          <template>Anayasanın dayandığı temel görüş ve ilkeleri belirten başlangıç kısmı, Anayasa metnine dahildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Madde kenar başlıkları, sadece ilgili oldukları maddelerin konusunu ve maddeler arasındaki sıralama ve bağlantıyı gösterir. Bu başlıklar, Anayasa metninden sayılmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="III" başlık="Anayasanın yürürlüğe girmesi">
      <mvz-madde no="177" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Anayasa, halkoylaması sonucu kabul edilip Resmî Gazetede yayımlanması ile Türkiye Cumhuriyeti Anayasası olur ve aşağıda gösterilen istisnalar ile bu istisnaların yürürlüğe girmesine ait hükümler dışında bütünüyle yürürlüğe girer.</template>
          <mvz-bent no="a">
            <template>İKİNCİ KISIM II. Bölümdeki; kişi hürriyeti ve güvenliği, basın ve yayımla ilgili hükümler, toplantı hak ve hürriyetleri,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>III. Bölümdeki çalışma ile ilgili hükümler, toplu iş sözleşmesi, grev hakkı ve lokavt ile ilgili hükümler,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Bu hükümler yeni kanunları çıkarıldığında veya mevcut kanunlarda değişiklik yapıldığında ve her halde en geç Türkiye Büyük Millet Meclisi göreve başladığında yürürlüğe girer. Ancak bu hükümler yürürlüğe girinceye kadar mevcut kanunlar ve Milli Güvenlik Konseyinin bildiri ve kararları uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İKİNCİ KlSIM'daki; siyasi faaliyette bulunma hakları ile siyasi partilerle ilgili hükümler, bunlara dayalı olarak yeniden hazırlanacak Siyasi Partiler Kanununun;</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Seçme ve seçilme hakkı ise yine bu hükümlere dayalı olarak hazırlanacak Seçim Kanununun;</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Yayımlanması ile yürürlüğe girer.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>ÜÇÜNCÜ KISIM'daki; yasama ile ilgili hükümler;</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Bu hükümler ilk milletvekili genel seçimi sonucunun ilanı ile birlikte yürürlüğe girer. Ancak bu bölümdeki Türkiye Büyük Millet Meclisinin görev ve yetkilerine ilişkin hükümleri, 29 Haziran 1981 gün ve 2485 sayılı Kurucu Meclis Hakkında Kanun hükümleri saklı kalmak üzere Türkiye Büyük Millet Meclisi göreve başlayıncaya kadar Milli Güvenlik Konseyince yerine getirilir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>ÜÇÜNCÜ KISIM'daki; Cumhurbaşkanı başlığı altındaki görev ve yetkileri ile Devlet Denetleme Kurulu, Bakanlar Kurulu başlığı altındaki tüzükler, Milli Savunma, olağanüstü yönetim usulleri, idare başlığı altındaki mahalli idareler ile Atatürk Kültür, Dil ve Tarih Yüksek Kurumu hariç diğer hükümler ve Devlet Güvenlik Mahkemeleri hariç yargıya ilişkin bütün hükümler Anayasanın halkoylaması sonucunda kabulünün Resmî Gazetede ilanı ile birlikte yürürlüğe girer. Cumhurbaşkanı ve Bakanlar Kuruluna ait yürürlüğe girmeyen hükümler Türkiye Büyük Millet Meclisinin göreve başlaması ile, mahalli idareler ile Devlet Güvenlik Mahkemelerine ilişkin hükümler ise ilgili kanunların yayımlanması ile yürürlüğe girer.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Anayasanın halkoylaması sonucu kabulünün ilanıyle birlikte yürürlüğe girecek hükümleri ve mevcut ve kurulacak kurum, kuruluş ve kurullar için yeniden kanun yapılması veya mevcut kanunlarda değişiklik yapılması gerekiyorsa bunlara ilişkin işlemler mevcut kanunların Anayasaya aykırı olmayan hükümleri veya doğrudan Anayasa hükümleri, Anayasanın 11 inci maddesi gereğince uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Kesinhesap kanunu tasarılarının görüşülme usulünü düzenleyen 164 üncü maddenin ikinci fıkrası hükmü 1984 yılından itibaren uygulanmaya başlanır.</template>
