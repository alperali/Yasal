  <mvz-künye tür="kanun" no="2709" başlık="TÜRKİYE CUMHURİYETİ ANAYASASI"
             tarih="18/10/1982" rgazete-tarih="9/11/1982" rgazete-sayı="17863" rgazete-mükerrer="1"
             düstur-tertip="5" düstur-cilt="22" düstur-sayfa="3" />

  <mvz-giriş başlık="BAŞLANGIÇ">
    <mvz-fıkra no="1">
      <template>Türk Vatanı ve Milletinin ebedi varlığını ve Yüce Türk Devletinin bölünmez bütünlüğünü belirleyen bu Anayasa, Türkiye Cumhuriyetinin kurucusu, ölümsüz önder ve eşsiz kahraman Atatürk’ün belirlediği milliyetçilik anlayışı ve onun inkılap ve ilkeleri doğrultusunda;</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Dünya milletleri ailesinin eşit haklara sahip şerefli bir üyesi olarak, Türkiye Cumhuriyetinin ebedi varlığı, refahı, maddi ve manevi mutluluğu ile çağdaş medeniyet düzeyine ulaşma azmi yönünde;</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Millet iradesinin mutlak üstünlüğü, egemenliğin kayıtsız şartsız Türk Milletine ait olduğu ve bunu millet adına kullanmaya yetkili kılınan hiçbir kişi ve kuruluşun, bu Anayasada gösterilen hürriyetçi demokrasi ve bunun icaplarıyla belirlenmiş hukuk düzeni dışına çıkamayacağı;</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kuvvetler ayrımının, Devlet organları arasında üstünlük sıralaması anlamına gelmeyip, belli Devlet yetki ve görevlerinin kullanılmasından ibaret ve bununla sınırlı medeni bir işbölümü ve işbirliği olduğu ve üstünlüğün ancak Anayasa ve kanunlarda bulunduğu;</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Hiçbir faaliyetin Türk milli menfaatlerinin, Türk varlığının, Devleti ve ülkesiyle bölünmezliği esasının, Türklüğün tarihi ve manevi değerlerinin, Atatürk milliyetçiliği, ilke ve inkılapları ve medeniyetçiliğinin karşısında korunma göremeyeceği ve laiklik ilkesinin gereği olarak kutsal din duygularının, Devlet işlerine ve politikaya kesinlikle karıştırılamayacağı;</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Her Türk vatandaşının bu Anayasadaki temel hak ve hürriyetlerden eşitlik ve sosyal adalet gereklerince yararlanarak milli kültür, medeniyet ve hukuk düzeni içinde onurlu bir hayat sürdürme ve maddi ve manevi varlığını bu yönde geliştirme hak ve yetkisine doğuştan sahip olduğu;</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Topluca Türk vatandaşlarının milli gurur ve iftiharlarda, milli sevinç ve kederlerde, milli varlığa karşı hak ve ödevlerde, nimet ve külfetlerde ve millet hayatının her türlü tecellisinde ortak olduğu, birbirinin hak ve hürriyetlerine kesin saygı, karşılıklı içten sevgi ve kardeşlik duygularıyla ve "Yurtta sulh, cihanda sulh" arzu ve inancı içinde, huzurlu bir hayat talebine hakları bulunduğu;</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>FİKİR, İNANÇ VE KARARIYLA anlaşılmak, sözüne ve ruhuna bu yönde saygı ve mutlak sadakatle yorumlanıp uygulanmak üzere.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>TÜRK MİLLETİ TARAFINDAN, demokrasiye aşık Türk evlatlarının vatan ve millet sevgisine emanet ve tevdi olunur.</template>
    </mvz-fıkra>
  </mvz-giriş>
  <mvz-kısım no="1-BİRİNCİ" başlık="GENEL ESASLAR">
    <mvz-b1 no="I" başlık="Devletin şekli">
      <mvz-madde no="1" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Devleti bir Cumhuriyettir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="II" başlık="Cumhuriyetin nitelikleri">
      <mvz-madde no="2" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Cumhuriyeti, toplumun huzuru, milli dayanışma ve adalet anlayışı içinde, insan haklarına saygılı, Atatürk milliyetçiliğine bağlı, başlangıçta belirtilen temel ilkelere dayanan, demokratik, laik ve sosyal bir hukuk Devletidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="III" başlık="Devletin bütünlüğü, Resmî dili, bayrağı, milli marşı ve başkenti">
      <mvz-madde no="3" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye Devleti, ülkesi ve milletiyle bölünmez bir bütündür. Dili Türkçedir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bayrağı, şekli kanununda belirtilen, beyaz ay yıldızlı al bayraktır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Milli marşı "İstiklal Marşı"dır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Başkenti Ankara'dır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="IV" başlık="Değiştirilemeyecek hükümler">
      <mvz-madde no="4" başlık="">
        <mvz-fıkra no="1">
          <template>Anayasanın 1 inci maddesindeki Devletin şeklinin Cumhuriyet olduğu hakkındaki hüküm ile, 2 nci maddesindeki Cumhuriyetin nitelikleri ve 3 üncü maddesi hükümleri değiştirilemez ve değiştirilmesi teklif edilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="V" başlık="Devletin temel amaç ve görevleri">
      <mvz-madde no="5" başlık="">
        <mvz-fıkra no="1">
          <template>Devletin temel amaç ve görevleri, Türk milletinin bağımsızlığını ve bütünlüğünü, ülkenin bölünmezliğini, Cumhuriyeti ve demokrasiyi korumak, kişilerin ve toplumun refah, huzur ve mutluluğunu sağlamak; kişinin temel hak ve hürriyetlerini, sosyal hukuk devleti ve adalet ilkeleriyle bağdaşmayacak surette sınırlayan siyasal, ekonomik ve sosyal engelleri kaldırmaya, insanın maddi ve manevi varlığının gelişmesi için gerekli şartları hazırlamaya çalışmaktır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="VI" başlık="Egemenlik">
      <mvz-madde no="6" başlık="">
        <mvz-fıkra no="1">
          <template>Egemenlik, kayıtsız şartsız Milletindir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türk Milleti, egemenliğini, Anayasanın koyduğu esaslara göre, yetkili organları eliyle kullanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Egemenliğin kullanılması, hiçbir surette hiçbir kişiye, zümreye veya sınıfa bırakılamaz. Hiçbir kimse veya organ kaynağını Anayasadan almayan bir Devlet yetkisi kullanamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="VII" başlık="Yasama yetkisi">
      <mvz-madde no="7" başlık="">
        <mvz-fıkra no="1">
          <template>Yasama yetkisi Türk Milleti adına Türkiye Büyük Millet Meclisinindir. Bu yetki devredilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="VIII" başlık="Yürütme yetkisi ve görevi">
      <mvz-madde no="8" başlık="">
        <mvz-fıkra no="1">
          <template>Yürütme yetkisi ve görevi, Cumhurbaşkanı  tarafından, Anayasaya ve kanunlara uygun olarak kullanılır ve yerine getirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="IX" başlık="Yargı yetkisi">
      <mvz-madde no="9" başlık="">
        <mvz-fıkra no="1">
          <template>Yargı yetkisi, Türk Milleti adına bağımsız ve tarafsız mahkemelerce kullanılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="X" başlık="Kanun önünde eşitlik">
      <mvz-madde no="10" başlık="">
        <mvz-fıkra no="1">
          <template>Herkes, dil, ırk, renk, cinsiyet, siyasi düşünce, felsefi inanç, din, mezhep ve benzeri sebeplerle ayırım gözetilmeksizin kanun önünde eşittir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kadınlar ve erkekler eşit haklara sahiptir. Devlet, bu eşitliğin yaşama geçmesini sağlamakla yükümlüdür.  Bu maksatla alınacak tedbirler eşitlik ilkesine aykırı olarak yorumlanamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Çocuklar, yaşlılar, özürlüler, harp ve vazife şehitlerinin dul ve yetimleri ile malul ve gaziler için alınacak tedbirler eşitlik ilkesine aykırı sayılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Hiçbir kişiye, aileye, zümreye veya sınıfa imtiyaz tanınamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Devlet organları ve idare makamları bütün işlemlerinde  kanun önünde eşitlik ilkesine uygun olarak hareket etmek zorundadırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="XI" başlık="Anayasanın bağlayıcılığı ve üstünlüğü">
      <mvz-madde no="11" başlık="">
        <mvz-fıkra no="1">
          <template>Anayasa hükümleri, yasama, yürütme ve yargı organlarını, idare makamlarını ve diğer kuruluş ve kişileri bağlayan temel hukuk kurallarıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanunlar Anayasaya aykırı olamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="TEMEL HAKLAR VE ÖDEVLER">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-b1 no="I" başlık="Temel hak ve hürriyetlerin niteliği">
        <mvz-madde no="12" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, kişiliğine bağlı, dokunulmaz, devredilmez, vazgeçilmez temel hak ve hürriyetlere sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Temel hak ve hürriyetler, kişinin topluma, ailesine ve diğer kişilere karşı ödev ve sorumluluklarını da ihtiva eder.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="II" başlık="Temel hak ve hürriyetlerin sınırlanması">
        <mvz-madde no="13" başlık="">
          <mvz-fıkra no="1">
            <template>Temel hak ve hürriyetler, özlerine dokunulmaksızın yalnızca Anayasanın ilgili maddelerinde belirtilen sebeplere bağlı olarak ve ancak kanunla sınırlanabilir. Bu sınırlamalar, Anayasanın sözüne ve ruhuna, demokratik toplum düzeninin ve lâik Cumhuriyetin gereklerine ve ölçülülük ilkesine aykırı olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="III" başlık="Temel hak ve hürriyetlerin kötüye kullanılamaması">
        <mvz-madde no="14" başlık="">
          <mvz-fıkra no="1">
            <template>Anayasada yer alan hak ve hürriyetlerden hiçbiri, Devletin ülkesi ve milletiyle bölünmez bütünlüğünü bozmayı ve insan haklarına dayanan demokratik ve lâik Cumhuriyeti ortadan kaldırmayı amaçlayan faaliyetler biçiminde kullanılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Anayasa hükümlerinden hiçbiri, Devlete veya kişilere, Anayasayla tanınan temel hak ve hürriyetlerin yok edilmesini veya Anayasada belirtilenden daha geniş şekilde sınırlandırılmasını amaçlayan bir faaliyette bulunmayı mümkün kılacak şekilde yorumlanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu hükümlere aykırı faaliyette bulunanlar hakkında uygulanacak müeyyideler, kanunla düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="IV" başlık="Temel hak ve hürriyetlerin kullanılmasının durdurulması">
        <mvz-madde no="15" başlık="">
          <mvz-fıkra no="1">
            <template>Savaş, seferberlik  veya olağanüstü hallerde, milletlerarası hukuktan doğan yükümlülükler ihlal edilmemek kaydıyla, durumun gerektirdiği ölçüde temel hak ve hürriyetlerin kullanılması kısmen veya tamamen durdurulabilir veya bunlar için Anayasada öngörülen güvencelere aykırı tedbirler alınabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada belirlenen durumlarda da, savaş hukukuna uygun fiiller sonucu meydana gelen ölümler  dışında, kişinin yaşama hakkına, maddi ve manevi varlığının bütünlüğüne dokunulamaz; kimse din, vicdan, düşünce ve kanaatlerini açıklamaya zorlanamaz ve bunlardan dolayı suçlanamaz; suç ve cezalar geçmişe yürütülemez; suçluluğu mahkeme kararı ile saptanıncaya kadar kimse suçlu sayılamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="V" başlık="Yabancıların durumu">
        <mvz-madde no="16" başlık="">
          <mvz-fıkra no="1">
            <template>Temel hak ve hürriyetler, yabancılar için, milletlerarası hukuka uygun olarak kanunla sınırlanabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Kişinin Hakları ve Ödevleri">
      <mvz-b1 no="I" başlık="Kişinin dokunulmazlığı, maddi ve manevi varlığı">
        <mvz-madde no="17" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, yaşama, maddi ve manevi varlığını koruma ve geliştirme hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tıbbi zorunluluklar ve kanunda yazılı haller dışında, kişinin vücut bütünlüğüne dokunulamaz; rızası olmadan bilimsel ve tıbbi deneylere tabi tutulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kimseye işkence ve eziyet yapılamaz; kimse insan haysiyetiyle bağdaşmayan bir cezaya veya muameleye tabi tutulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>meşru müdafaa hali, yakalama ve tutuklama kararlarının yerine getirilmesi, bir tutuklu veya hükümlünün kaçmasının önlenmesi, bir ayaklanma veya isyanın bastırılması  veya olağanüstü hallerde yetkili merciin verdiği emirlerin uygulanması sırasında silah kullanılmasına kanunun cevaz verdiği zorunlu durumlarda meydana gelen öldürme fiilleri, birinci fıkra hükmü dışındadır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="II" başlık="Zorla çalıştırma yasağı">
        <mvz-madde no="18" başlık="">
          <mvz-fıkra no="1">
            <template>Hiç kimse zorla çalıştırılamaz. Angarya yasaktır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Şekil ve şartları kanunla düzenlenmek üzere hükümlülük veya tutukluluk süreleri içindeki çalıştırmalar; olağanüstü hallerde vatandaşlardan istenecek hizmetler; ülke ihtiyaçlarının zorunlu kıldığı alanlarda öngörülen vatandaşlık ödevi niteliğindeki beden ve fikir çalışmaları, zorla çalıştırma sayılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="III" başlık="Kişi hürriyeti ve güvenliği">
        <mvz-madde no="19" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, kişi hürriyeti ve güvenliğine sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Şekil ve şartları kanunda gösterilen:</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkemelerce verilmiş hürriyeti kısıtlayıcı cezaların ve güvenlik tedbirlerinin yerine getirilmesi; bir mahkeme kararının veya kanunda öngörülen bir yükümlülüğün gereği olarak ilgilinin yakalanması veya tutuklanması; bir küçüğün gözetim altında ıslahı veya yetkili merci önüne çıkarılması için verilen bir kararın yerine getirilmesi; toplum için tehlike teşkil eden bir akıl hastası, uyuşturucu madde veya alkol tutkunu, bir serseri veya hastalık yayabilecek bir kişinin bir müessesede tedavi, eğitim veya ıslahı için kanunda belirtilen esaslara uygun olarak alınan tedbirin yerine getirilmesi; usulüne aykırı şekilde ülkeye girmek isteyen veya giren, ya da hakkında sınır dışı etme yahut geri verme kararı verilen bir kişinin yakalanması veya tutuklanması; halleri dışında kimse hürriyetinden yoksun bırakılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Suçluluğu hakkında kuvvetli belirti bulunan kişiler, ancak kaçmalarını, delillerin yokedilmesini veya değiştirilmesini önlemek maksadıyla veya bunlar gibi tutuklamayı zorunlu kılan ve kanunda gösterilen diğer hallerde hakim kararıyla tutuklanabilir. Hakim kararı olmadan yakalama, ancak suçüstü halinde veya gecikmesinde sakınca bulunan hallerde yapılabilir; bunun şartlarını kanun gösterir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yakalanan veya tutuklanan kişilere, yakalama veya tutuklama sebepleri ve haklarındaki iddialar herhalde yazılı ve bunun hemen mümkün olmaması halinde sözlü olarak derhal, toplu suçlarda en geç hakim huzuruna çıkarılıncaya kadar bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Yakalanan veya tutuklanan kişi, tutulma yerine en yakın mahkemeye gönderilmesi için gerekli süre hariç en geç kırksekiz saat ve toplu olarak işlenen suçlarda en çok dört gün içinde hâkim önüne çıkarılır. Kimse, bu süreler geçtikten sonra hakim kararı olmaksızın hürriyetinden yoksun bırakılamaz. Bu süreler olağanüstü hal  ve savaş hallerinde uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Kişinin yakalandığı veya tutuklandığı, yakınlarına derhal bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Tutuklanan kişilerin, makul süre içinde yargılanmayı ve soruşturma veya kovuşturma sırasında serbest bırakılmayı isteme hakları vardır. Serbest bırakılma ilgilinin yargılama süresince duruşmada hazır bulunmasını veya hükmün yerine getirilmesini sağlamak için bir güvenceye bağlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Her ne sebeple olursa olsun, hürriyeti kısıtlanan kişi, kısa sürede durumu hakkında karar verilmesini ve bu kısıtlamanın kanuna aykırılığı halinde hemen serbest bırakılmasını sağlamak amacıyla yetkili bir yargı merciine başvurma hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Bu esaslar dışında bir işleme tâbi tutulan kişilerin uğradıkları zarar, tazminat hukukunun genel prensiplerine göre, Devletçe ödenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="IV" başlık="Özel hayatın gizliliği ve korunması">
        <mvz-b2 no="A" başlık="Özel hayatın gizliliği">
          <mvz-madde no="20" başlık="">
            <mvz-fıkra no="1">
              <template>Herkes, özel hayatına ve aile hayatına saygı gösterilmesini isteme hakkına sahiptir. Özel hayatın ve aile hayatının gizliliğine dokunulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Millî güvenlik, kamu düzeni, suç işlenmesinin önlenmesi, genel sağlık ve genel ahlâkın korunması veya başkalarının hak ve özgürlüklerinin korunması sebeplerinden biri veya birkaçına bağlı olarak, usulüne göre verilmiş hâkim kararı olmadıkça; yine bu sebeplere bağlı olarak gecikmesinde sakınca bulunan hallerde de kanunla yetkili kılınmış merciin yazılı emri bulunmadıkça; kimsenin üstü, özel kâğıtları ve eşyası aranamaz ve bunlara el konulamaz. Yetkili merciin kararı yirmidört saat içinde görevli hâkimin onayına sunulur. Hâkim, kararını el koymadan itibaren kırksekiz saat içinde açıklar; aksi halde, el koyma kendiliğinden kalkar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Herkes, kendisiyle ilgili kişisel verilerin korunmasını isteme hakkına sahiptir. Bu hak; kişinin kendisiyle ilgili kişisel veriler hakkında bilgilendirilme, bu verilere erişme, bunların düzeltilmesini veya silinmesini talep etme ve amaçları doğrultusunda kullanılıp kullanılmadığını öğrenmeyi de kapsar. Kişisel veriler, ancak kanunda öngörülen hallerde veya kişinin açık rızasıyla işlenebilir. Kişisel verilerin korunmasına ilişkin esas ve usuller kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Konut dokunulmazlığı">
          <mvz-madde no="21" başlık="">
            <mvz-fıkra no="1">
              <template>Kimsenin konutuna dokunulamaz. Millî güvenlik, kamu düzeni, suç işlenmesinin önlenmesi, genel sağlık ve genel ahlâkın korunması veya başkalarının hak ve özgürlüklerinin korunması sebeplerinden biri veya birkaçına bağlı olarak usulüne göre verilmiş hâkim kararı olmadıkça; yine bu sebeplere bağlı olarak gecikmesinde sakınca bulunan hallerde de kanunla yetkili kılınmış merciin yazılı emri bulunmadıkça; kimsenin konutuna girilemez, arama yapılamaz ve buradaki eşyaya el konulamaz. Yetkili merciin kararı yirmidört saat içinde görevli hâkimin onayına sunulur. Hâkim, kararını el koymadan itibaren kırksekiz saat içinde açıklar; aksi halde, el koyma kendiliğinden kalkar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Haberleşme hürriyeti">
          <mvz-madde no="22" başlık="">
            <mvz-fıkra no="1">
              <template>Herkes, haberleşme hürriyetine  sahiptir. Haberleşmenin  gizliliği esastır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Millî güvenlik, kamu düzeni, suç işlenmesinin önlenmesi, genel sağlık ve genel ahlâkın korunması veya başkalarının hak ve özgürlüklerinin korunması sebeplerinden biri veya birkaçına bağlı olarak usulüne göre verilmiş hâkim kararı olmadıkça; yine bu sebeplere bağlı olarak gecikmesinde sakınca bulunan hallerde de kanunla yetkili kılınmış merciin yazılı emri bulunmadıkça; haberleşme engellenemez ve gizliliğine dokunulamaz. Yetkili merciin kararı yirmidört saat içinde görevli hâkimin onayına sunulur. Hâkim, kararını kırksekiz saat içinde açıklar; aksi halde, karar kendiliğinden kalkar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>İstisnaların uygulanacağı kamu kurum ve kuruluşları kanunda belirtilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="V" başlık="Yerleşme ve seyahat hürriyeti">
        <mvz-madde no="23" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, yerleşme ve seyahat hürriyetine sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yerleşme hürriyeti, suç işlenmesini önlemek, sosyal ve ekonomik gelişmeyi sağlamak, sağlıklı ve düzenli kentleşmeyi gerçekleştirmek ve kamu mallarını korumak;</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Seyahat hürriyeti, suç soruşturma ve kovuşturması sebebiyle ve suç işlenmesini önlemek;</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Amaçlarıyla kanunla sınırlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Vatandaşın yurt dışına çıkma hürriyeti, ancak suç soruşturması veya kovuşturması sebebiyle hâkim kararına bağlı olarak sınırlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Vatandaş sınır dışı edilemez ve yurda girme hakkından yoksun bırakılamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="VI" başlık="Din ve vicdan hürriyeti">
        <mvz-madde no="24" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, vicdan, dini inanç ve kanaat hürriyetine sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>14 üncü madde hükümlerine aykırı olmamak şartıyla ibadet, dini ayin ve törenler serbesttir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kimse, ibadete, dini ayin ve törenlere katılmaya, dini inanç ve kanaatlerini açıklamaya zorlanamaz; dini inanç ve kanaatlerinden dolayı kınanamaz ve suçlanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Din ve ahlak eğitim ve öğretimi Devletin gözetim ve denetimi altında yapılır. Din kültürü ve ahlak öğretimi ilk ve ortaöğretim kurumlarında okutulan zorunlu dersler arasında yer alır. Bunun dışındaki din eğitim ve öğretimi ancak, kişilerin kendi isteğine, küçüklerin de kanuni temsilcisinin talebine bağlıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kimse, Devletin sosyal, ekonomik, siyasi veya hukuki temel düzenini kısmen de olsa, din kurallarına dayandırma veya siyasi veya kişisel çıkar yahut nüfuz sağlama amacıyla her ne suretle olursa olsun dini veya din duygularını yahut dince kutsal sayılan şeyleri istismar edemez ve kötüye kullanamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="VII" başlık="Düşünce ve kanaat hürriyeti">
        <mvz-madde no="25" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, düşünce ve kanaat hürriyetine sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Her ne sebep ve amaçla olursa olsun kimse, düşünce ve kanaatlerini açıklamaya zorlanamaz; düşünce kanaatleri sebebiyle kınanamaz ve suçlanamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="VIII" başlık="Düşünceyi açıklama ve yayma hürriyeti">
        <mvz-madde no="26" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, düşünce ve kanaatlerini söz, yazı, resim veya başka yollarla tek başına veya toplu olarak açıklama ve yayma hakkına sahiptir. Bu hürriyet Resmî makamların müdahalesi olmaksızın haber veya fikir almak ya da vermek serbestliğini de kapsar. Bu fıkra hükmü, radyo, televizyon, sinema veya benzeri yollarla yapılan yayımların izin sistemine bağlanmasına engel değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hürriyetlerin kullanılması, millî güvenlik, kamu düzeni, kamu güvenliği, Cumhuriyetin temel nitelikleri ve Devletin ülkesi ve milleti ile bölünmez bütünlüğünün korunması, suçların önlenmesi, suçluların cezalandırılması, Devlet sırrı olarak usulünce belirtilmiş bilgilerin açıklanmaması, başkalarının şöhret veya haklarının, özel ve aile hayatlarının yahut kanunun öngördüğü meslek sırlarının korunması veya yargılama görevinin gereğine uygun olarak yerine getirilmesi amaçlarıyla sınırlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>(Mülga)</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Haber ve düşünceleri yayma araçlarının kullanılmasına ilişkin düzenleyici hükümler, bunların yayımını engellememek kaydıyla, düşünceyi açıklama ve yayma hürriyetinin sınırlanması sayılmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Düşünceyi açıklama ve yayma hürriyetinin kullanılmasında uygulanacak şekil, şart ve usuller kanunla düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="IX" başlık="Bilim ve sanat hürriyeti">
        <mvz-madde no="27" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, bilim ve sanatı serbestçe öğrenme ve öğretme, açıklama, yayma ve bu alanlarda her türlü araştırma hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yayma hakkı, Anayasanın 1 inci, 2 nci ve 3 üncü maddeleri hükümlerinin değiştirilmesini sağlamak amacıyla kullanılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu madde hükmü yabancı yayınların ülkeye girmesi ve dağıtımının kanunla düzenlenmesine engel değildir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="X" başlık="Basın ve yayımla ilgili hükümler">
        <mvz-b2 no="A" başlık="Basın hürriyeti">
          <mvz-madde no="28" başlık="">
            <mvz-fıkra no="1">
              <template>Basın hürdür, sansür edilemez. Basımevi kurmak izin alma ve mali teminat yatırma şartına bağlanamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>(Mülga)</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Devlet, basın ve haber alma hürriyetlerini sağlayacak tedbirleri alır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Basın hürriyetinin sınırlanmasında, Anayasanın 26 ve 27 nci maddeleri hükümleri uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Devletin iç ve dış güvenliğini, ülkesi ve milletiyle bölünmez bütünlüğünü tehdit eden veya suç işlemeye ya da ayaklanma veya isyana teşvik eder nitelikte olan veya Devlete ait gizli bilgilere ilişkin bulunan her türlü haber veya yazıyı, yazanlar veya bastıranlar veya aynı amaçla, basanlar, başkasına verenler, bu suçlara ait kanun hükümleri uyarınca sorumlu olurlar. Tedbir yolu ile dağıtım hakim kararıyle; gecikmesinde sakınca bulunan hallerde de kanunun açıkça yetkili kıldığı merciin emriyle önlenebilir. Dağıtımı önleyen yetkili merci, bu kararını en geç yirmidört saat içinde yetkili hakime bildirir. Yetkili hakim bu kararı en geç kırksekiz saat içinde onaylamazsa, dağıtımı önleme kararı hükümsüz sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Yargılama görevinin amacına uygun olarak yerine getirilmesi için, kanunla belirtilecek sınırlar içinde, hakim tarafından verilen kararlar saklı kalmak üzere, olaylar hakkında yayım yasağı konamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Süreli veya süresiz yayınlar, kanunun gösterdiği suçların soruşturma veya kovuşturmasına geçilmiş olması hallerinde hakim kararıyla; Devletin ülkesi ve milletiyle bölünmez bütünlüğünün, milli güvenliğin, kamu düzeninin, genel ahlakın korunması ve suçların önlenmesi bakımından gecikmesinde sakınca bulunan hallerde de kanunun açıkça yetkili kıldığı merciin emriyle toplatılabilir. Toplatma kararı veren yetkili merci, bu kararını en geç yirmidört saat içinde yetkili hakime bildirir; hakim bu kararı en geç kırksekiz saat içinde onaylamazsa, toplatma kararı hükümsüz sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="8">
              <template>Süreli veya süresiz yayınların suç soruşturma veya kovuşturması sebebiyle zapt ve müsaderesinde genel hükümler uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="9">
              <template>Türkiye'de yayımlanan süreli yayınlar, Devletin ülkesi ve milletiyle bölünmez bütünlüğüne, Cumhuriyetin temel ilkelerine, milli güvenliğe ve genel ahlaka aykırı yayımlardan mahkum olma halinde, mahkeme kararıyla geçici olarak kapatılabilir. Kapatılan süreli yayının açıkça devamı niteliğini taşıyan her türlü yayın yasaktır; bunlar hakim kararıyla toplatılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Süreli ve süresiz yayın hakkı">
          <mvz-madde no="29" başlık="">
            <mvz-fıkra no="1">
              <template>Süreli veya süresiz yayın önceden izin alma ve mali teminat yatırma şartına bağlanamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Süreli yayın çıkarabilmek için kanunun gösterdiği bilgi ve belgelerin, kanunda belirtilen yetkili mercie verilmesi yeterlidir. Bu bilgi ve belgelerin kanuna aykırılığının tespiti halinde yetkili merci, yayının durdurulması için mahkemeye başvurur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Süreli yayınların çıkarılması, yayım şartları, mali kaynakları ve gazetecilik mesleği ile ilgili esaslar kanunla düzenlenir. Kanun, haber, düşünce ve kanaatlerin serbestçe yayımlanmasını engelleyici veya zorlaştırıcı siyasal, ekonomik, mali ve teknik şartlar koyamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Süreli yayınlar, Devletin ve diğer kamu tüzelkişilerinin veya bunlara bağlı  kurumların araç ve imkanlarından eşitlik esasına göre yararlanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Basın araçlarının korunması">
          <mvz-madde no="30" başlık="">
            <mvz-fıkra no="1">
              <template>Kanuna uygun şekilde basın işletmesi olarak kurulan basımevi ve eklentileri ile basın araçları, suç aleti olduğu gerekçesiyle zapt ve müsadere edilemez veya işletilmekten alıkonulamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="D" başlık="Kamu tüzel kişilerinin elindeki basın dışı kitle haberleşme araçlarından yararlanma hakkı">
          <mvz-madde no="31" başlık="">
            <mvz-fıkra no="1">
              <template>Kişiler ve siyasi partiler, kamu tüzel kişilerinin elindeki basın dışı kitle haberleşme ve yayım araçlarından yararlanma hakkına sahiptir. Bu yararlanmanın şartları ve usulleri kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kanun, millî güvenlik, kamu düzeni, genel ahlâk ve sağlığın korunması sebepleri dışında, halkın bu araçlarla haber almasını, düşünce ve kanaatlere ulaşmasını ve kamuoyunun serbestçe oluşmasını engelleyici kayıtlar koyamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="E" başlık="Düzeltme ve cevap hakkı">
          <mvz-madde no="32" başlık="">
            <mvz-fıkra no="1">
              <template>Düzeltme ve cevap hakkı, ancak kişilerin haysiyet ve şereflerine dokunulması veya kendileriyle ilgili gerçeğe aykırı yayınlar yapılması hallerinde tanınır ve kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Düzeltme ve cevap yayımlanmazsa, yayımlanmasının gerekip gerekmediğine hakim tarafından ilgilinin müracaat tarihinden itibaren en geç yedi gün içerisinde karar verilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="XI" başlık="Toplantı hak ve hürriyetleri">
        <mvz-b2 no="A" başlık="Dernek kurma hürriyeti">
          <mvz-madde no="33" başlık="">
            <mvz-fıkra no="1">
              <template>Herkes, önceden izin almaksızın dernek kurma ve bunlara üye olma ya da üyelikten çıkma hürriyetine sahiptir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Hiç kimse bir derneğe üye olmaya ve dernekte üye kalmaya zorlanamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Dernek kurma hürriyeti ancak, millî güvenlik, kamu düzeni, suç işlenmesinin önlenmesi, genel sağlık ve genel ahlâk ile başkalarının hürriyetlerinin korunması sebepleriyle ve kanunla sınırlanabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Dernek kurma hürriyetinin kullanılmasında uygulanacak şekil, şart ve usuller kanunda gösterilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Dernekler, kanunun öngördüğü hallerde hâkim kararıyla kapatılabilir veya faaliyetten alıkonulabilir. Ancak, millî güvenliğin, kamu düzeninin, suç işlenmesini veya suçun devamını önlemenin yahut yakalamanın gerektirdiği hallerde gecikmede sakınca varsa, kanunla bir merci, derneği faaliyetten men ile yetkilendirilebilir. Bu merciin kararı, yirmidört saat içinde görevli hâkimin onayına sunulur. Hâkim, kararını kırksekiz saat içinde açıklar; aksi halde, bu idarî karar kendiliğinden yürürlükten kalkar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Birinci fıkra hükmü, Silahlı Kuvvetler ve kolluk kuvvetleri mensuplarına ve görevlerinin gerektirdiği ölçüde Devlet memurlarına kanunla sınırlamalar getirilmesine engel değildir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Bu madde hükümleri vakıflarla ilgili olarak da uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Toplantı ve gösteri yürüyüşü düzenleme hakkı">
          <mvz-madde no="34" başlık="">
            <mvz-fıkra no="1">
              <template>Herkes, önceden izin almadan, silahsız ve saldırısız toplantı ve gösteri yürüyüşü düzenleme hakkına sahiptir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Toplantı ve gösteri yürüyüşü hakkı ancak,  millî güvenlik, kamu düzeni, suç işlenmesinin önlenmesi, genel sağlığın ve genel ahlâkın veya başkalarının hak ve özgürlüklerinin korunması amacıyla ve kanunla sınırlanabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Toplantı ve gösteri yürüyüşü düzenleme hakkının kullanılmasında uygulanacak şekil, şart ve usuller kanunda gösterilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="XII" başlık="Mülkiyet hakkı">
        <mvz-madde no="35" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, mülkiyet ve miras haklarına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu haklar, ancak kamu yararı amacıyla, kanunla sınırlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mülkiyet hakkının kullanılması toplum yararına aykırı olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="XIII" başlık="Hakların korunması ile ilgili hükümler">
        <mvz-b2 no="A" başlık="Hak arama hürriyeti">
          <mvz-madde no="36" başlık="">
            <mvz-fıkra no="1">
              <template>Herkes, meşru vasıta ve yollardan faydalanmak suretiyle yargı mercileri önünde davacı veya davalı olarak iddia ve savunma ile adil yargılanma hakkına sahiptir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Hiçbir mahkeme, görev ve yetkisi içindeki davaya bakmaktan kaçınamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Kanuni hakim güvencesi">
          <mvz-madde no="37" başlık="">
            <mvz-fıkra no="1">
              <template>Hiç kimse kanunen tabi olduğu mahkemeden başka bir merci önüne çıkarılamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bir kimseyi kanunen tabi olduğu mahkemeden başka bir merci önüne çıkarma sonucunu doğuran yargı yetkisine sahip olağanüstü merciler kurulamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Suç ve cezalara ilişkin esaslar">
          <mvz-madde no="38" başlık="">
            <mvz-fıkra no="1">
              <template>Kimse, işlendiği zaman yürürlükte bulunan kanunun suç saymadığı bir fiilden dolayı cezalandırılamaz; kimseye suçu işlediği zaman kanunda o suç için konulmuş olan cezadan daha ağır bir ceza verilemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Suç ve ceza zamanaşımı ile ceza mahkumiyetinin sonuçları konusunda da yukarıdaki fıkra uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Ceza ve ceza yerine geçen güvenlik tedbirleri ancak kanunla konulur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Suçluluğu hükmen sabit oluncaya kadar, kimse suçlu sayılamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Hiç kimse kendisini ve kanunda gösterilen yakınlarını suçlayan bir beyanda bulunmaya veya bu yolda delil göstermeye zorlanamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Kanuna aykırı olarak elde edilmiş bulgular, delil olarak kabul edilemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Ceza sorumluluğu şahsidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="8">
              <template>Hiç kimse, yalnızca sözleşmeden doğan bir yükümlülüğü yerine getirememesinden dolayı özgürlüğünden alıkonulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="9">
              <template>Mülga</template>
            </mvz-fıkra>
            <mvz-fıkra no="10">
              <template>Ölüm cezası ve genel müsadere cezası verilemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="11">
              <template>İdare, kişi hürriyetinin kısıtlanması sonucunu doğuran bir müeyyide uygulayamaz. Silahlı Kuvvetlerin iç düzeni bakımından bu hükme kanunla istisnalar getirilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="12">
              <template>Uluslararası Ceza Divanına taraf olmanın gerektirdiği yükümlülükler hariç olmak üzere vatandaş, suç sebebiyle yabancı bir ülkeye verilemez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="XIV" başlık="İspat hakkı">
        <mvz-madde no="39" başlık="">
          <mvz-fıkra no="1">
            <template>Kamu görev ve hizmetinde bulunanlara karşı, bu görev ve hizmetin yerine getirilmesiyle ilgili olarak yapılan isnatlardan dolayı açılan hakaret davalarında, sanık, isnadın doğruluğunu ispat hakkına sahiptir. Bunun dışındaki hallerde ispat isteminin kabulü, ancak isnat olunan fiilin doğru olup olmadığının anlaşılmasında kamu yararı bulunmasına veya şikayetçinin ispata razı olmasına bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="XV" başlık="Temel hak ve hürriyetlerin korunması">
        <mvz-madde no="40" başlık="">
          <mvz-fıkra no="1">
            <template>Anayasa ile tanınmış hak ve hürriyetleri ihlal edilen herkes, yetkili makama geciktirilmeden başvurma imkanının sağlanmasını isteme hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Devlet, işlemlerinde, ilgili kişilerin hangi kanun yolları ve mercilere başvuracağını ve sürelerini belirtmek zorundadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kişinin, Resmî görevliler tarafından vaki haksız işlemler sonucu uğradığı zarar da, kanuna göre, Devletçe tazmin edilir. Devletin sorumlu olan ilgili görevliye rücu hakkı saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Sosyal ve Ekonomik Haklar ve Ödevler">
      <mvz-b1 no="I" başlık="Ailenin korunması ve çocuk hakları">
        <mvz-madde no="41" başlık="">
          <mvz-fıkra no="1">
            <template>Aile, Türk toplumunun temelidir ve eşler arasında eşitliğe dayanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Devlet, ailenin huzur ve refahı ile özellikle ananın ve çocukların korunması ve aile planlamasının öğretimi ile uygulanmasını sağlamak için gerekli tedbirleri alır, teşkilatı kurar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Her çocuk, korunma ve bakımdan yararlanma, yüksek yararına açıkça aykırı olmadıkça, ana ve babasıyla kişisel ve doğrudan ilişki kurma ve sürdürme hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Devlet, her türlü istismara ve şiddete karşı çocukları koruyucu tedbirleri alır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="II" başlık="Eğitim ve öğrenim hakkı ve ödevi">
        <mvz-madde no="42" başlık="">
          <mvz-fıkra no="1">
            <template>Kimse, eğitim ve öğrenim hakkından yoksun bırakılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Öğrenim hakkının kapsamı kanunla tespit edilir ve düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Eğitim ve öğretim, Atatürk ilkeleri ve inkılapları doğrultusunda, çağdaş bilim ve eğitim esaslarına göre, Devletin gözetim ve denetimi altında yapılır. Bu esaslara aykırı eğitim ve öğretim yerleri açılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Eğitim ve öğretim hürriyeti, Anayasaya sadakat borcunu ortadan kaldırmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İlköğretim kız ve erkek bütün vatandaşlar için zorunludur ve Devlet okullarında parasızdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Özel ilk ve orta dereceli okulların bağlı olduğu esaslar, Devlet okulları ile erişilmek istenen seviyeye uygun olarak, kanunla düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>(İptal)</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Devlet, maddi imkanlardan yoksun başarılı öğrencilerin, öğrenimlerini sürdürebilmeleri amacı ile burslar ve başka yollarla gerekli yardımları yapar. Devlet, durumları sebebiyle özel eğitime ihtiyacı olanları topluma yararlı kılacak tedbirleri alır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Eğitim ve öğretim kurumlarında sadece eğitim, öğretim, araştırma ve inceleme ile ilgili faaliyetler yürütülür. Bu faaliyetler her ne suretle olursa olsun engellenemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Türkçeden başka hiçbir dil, eğitim ve öğretim kurumlarında Türk vatandaşlarına ana dilleri olarak okutulamaz ve öğretilemez. Eğitim ve öğretim kurumlarında okutulacak yabancı diller ile yabancı dille eğitim ve öğretim yapan okulların tabi olacağı esaslar kanunla düzenlenir. Milletlerarası andlaşma hükümleri saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="III" başlık="Kamu yararı">
        <mvz-b2 no="A" başlık="Kıyılardan yararlanma">
          <mvz-madde no="43" başlık="">
            <mvz-fıkra no="1">
              <template>Kıyılar, Devletin hüküm ve tasarrufu altındadır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Deniz, göl ve akarsu kıyılarıyla, deniz ve göllerin kıyılarını çevreleyen sahil şeritlerinden yararlanmada öncelikle kamu yararı gözetilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kıyılarla sahil şeritlerinin, kullanılış amaçlarına göre derinliği ve kişilerin bu yerlerden yararlanma imkan ve şartları kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Toprak mülkiyeti">
          <mvz-madde no="44" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet, toprağın verimli olarak işletilmesini korumak ve geliştirmek, erozyonla kaybedilmesini önlemek ve topraksız olan veya yeter toprağı bulunmayan çiftçilikle uğraşan köylüye toprak sağlamak amacıyla gerekli tedbirleri alır. Kanun, bu amaçla, değişik tarım bölgeleri ve çeşitlerine göre toprağın genişliğini tespit edebilir. Topraksız olan veya yeter toprağı bulunmayan çiftçiye toprak sağlanması, üretimin düşürülmesi, ormanların küçülmesi ve diğer toprak ve yeraltı servetlerinin azalması sonucunu doğuramaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu amaçla dağıtılan topraklar bölünemez, miras hükümleri dışında başkalarına devredilemez ve ancak dağıtılan çiftçilerle mirasçıları tarafından işletilebilir. Bu şartların kaybı halinde, dağıtılan toprağın Devletçe geri alınmasına ilişkin esaslar kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Tarım, hayvancılık ve bu üretim dallarında çalışanların korunması">
          <mvz-madde no="45" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet, tarım arazileri ile çayır ve mer'aların amaç dışı kullanılmasını ve tahribini önlemek, tarımsal üretim planlaması ilkelerine uygun olarak bitkisel ve hayvansal üretimi artırmak maksadıyla, tarım ve hayvancılıkla uğraşanların işletme araç ve gereçlerinin ve diğer girdilerinin sağlanmasını kolaylaştırır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Devlet, bitkisel ve hayvansal ürünlerin değerlendirilmesi ve gerçek değerlerinin üreticinin eline geçmesi için gereken tedbirleri alır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="D" başlık="Kamulaştırma">
          <mvz-madde no="46" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet ve kamu tüzel kişileri; kamu yararının gerektirdiği hallerde, gerçek karşılıklarını peşin ödemek şartıyla, özel mülkiyette bulunan taşınmaz malların tamamını veya bir kısmını, kanunla gösterilen esas ve usullere göre, kamulaştırmaya ve bunlar üzerinde idarî irtifaklar kurmaya yetkilidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kamulaştırma bedeli ile kesin hükme bağlanan artırım bedeli nakden ve peşin olarak ödenir. Ancak, tarım reformunun uygulanması, büyük enerji ve sulama projeleri ile iskân projelerinin gerçekleştirilmesi, yeni ormanların yetiştirilmesi, kıyıların korunması ve turizm amacıyla kamulaştırılan toprakların bedellerinin ödenme şekli kanunla gösterilir. Kanunun taksitle ödemeyi öngörebileceği bu hallerde, taksitlendirme süresi beş yılı aşamaz; bu takdirde taksitler eşit olarak ödenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kamulaştırılan topraktan, o toprağı doğrudan doğruya işleten küçük çiftçiye ait olanlarının bedeli, her halde peşin ödenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>İkinci fıkrada öngörülen taksitlendirmelerde ve herhangi bir sebeple ödenmemiş kamulaştırma bedellerinde kamu alacakları için öngörülen en yüksek faiz uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="E" başlık="Devletleştirme ve Özelleştirme">
          <mvz-madde no="47" başlık="">
            <mvz-fıkra no="1">
              <template>Kamu hizmeti niteliği taşıyan özel teşebbüsler, kamu yararının zorunlu kıldığı hallerde devletleştirilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Devletleştirme gerçek karşılığı üzerinden yapılır. Gerçek karşılığın hesaplanma tarzı ve usulleri kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Devletin, kamu iktisadi teşebbüslerinin ve diğer kamu tüzelkişilerinin mülkiyetinde bulunan işletme ve varlıkların özelleştirilmesine ilişkin esas ve usuller kanunla gösterilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Devlet, kamu iktisadi teşebbüsleri ve diğer kamu tüzelkişileri tarafından yürütülen yatırım ve hizmetlerden hangilerinin özel hukuk sözleşmeleri ile gerçek veya tüzelkişilere yaptırılabileceği veya devredilebileceği kanunla belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="IV" başlık="Çalışma ve sözleşme hürriyeti">
        <mvz-madde no="48" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, dilediği alanda çalışma ve sözleşme hürriyetlerine sahiptir. Özel teşebbüsler kurmak serbesttir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Devlet, özel teşebbüslerin milli ekonominin gereklerine ve sosyal amaçlara uygun yürümesini, güvenlik ve kararlılık içinde çalışmasını sağlayacak tedbirleri alır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="V" başlık="Çalışma ile ilgili hükümler">
        <mvz-b2 no="A" başlık="Çalışma hakkı ve ödevi">
          <mvz-madde no="49" başlık="">
            <mvz-fıkra no="1">
              <template>Çalışma, herkesin hakkı ve ödevidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Devlet, çalışanların hayat seviyesini yükseltmek, çalışma hayatını geliştirmek için çalışanları ve işsizleri korumak, çalışmayı desteklemek, işsizliği önlemeye elverişli ekonomik bir ortam yaratmak ve çalışma barışını sağlamak için gerekli tedbirleri alır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>(Mülga)</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Çalışma şartları ve dinlenme hakkı">
          <mvz-madde no="50" başlık="">
            <mvz-fıkra no="1">
              <template>Kimse, yaşına, cinsiyetine ve gücüne uymayan işlerde çalıştırılamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Küçükler ve kadınlar ile bedeni ve ruhi yetersizliği olanlar çalışma şartları bakımından özel olarak korunurlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Dinlenmek, çalışanların hakkıdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Ücretli hafta ve bayram tatili ile ücretli yıllık izin hakları ve şartları kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Sendika kurma hakkı">
          <mvz-madde no="51" başlık="">
            <mvz-fıkra no="1">
              <template>Çalışanlar ve işverenler, üyelerinin çalışma ilişkilerinde, ekonomik ve sosyal hak ve menfaatlerini korumak ve geliştirmek için önceden izin almaksızın sendikalar ve üst kuruluşlar kurma, bunlara serbestçe üye olma ve üyelikten serbestçe çekilme haklarına sahiptir. Hiç kimse bir sendikaya üye olmaya ya da üyelikten ayrılmaya zorlanamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Sendika kurma hakkı ancak, millî güvenlik, kamu düzeni, suç işlenmesinin önlenmesi, genel sağlık ve genel ahlâk ile başkalarının hak ve özgürlüklerinin korunması sebepleriyle ve kanunla sınırlanabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Sendika kurma hakkının kullanılmasında uygulanacak şekil, şart ve usuller kanunda gösterilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>(Mülga)</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>İşçi niteliği taşımayan kamu görevlilerinin bu alandaki haklarının kapsam, istisna ve sınırları gördükleri hizmetin niteliğine uygun olarak kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Sendika ve üst kuruluşlarının tüzükleri, yönetim ve işleyişleri, Cumhuriyetin temel niteliklerine ve demokrasi esaslarına aykırı olamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="D" başlık="Sendikal faaliyet">
          <mvz-madde no="52" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="VI" başlık="Toplu iş sözleşmesi, grev hakkı ve lokavt">
        <mvz-b2 no="A" başlık="Toplu iş sözleşmesi ve toplu sözleşme hakkı">
          <mvz-madde no="53" başlık="">
            <mvz-fıkra no="1">
              <template>İşçiler ve işverenler, karşılıklı olarak ekonomik ve sosyal durumlarını ve çalışma şartlarını düzenlemek amacıyla toplu iş sözleşmesi yapma hakkına sahiptirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Toplu iş sözleşmesinin nasıl yapılacağı kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>(Mülga)</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>(Mülga)</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Memurlar ve diğer kamu görevlileri, toplu sözleşme yapma hakkına sahiptirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Toplu sözleşme yapılması sırasında uyuşmazlık çıkması halinde taraflar Kamu Görevlileri Hakem Kuruluna başvurabilir. Kamu Görevlileri Hakem Kurulu kararları kesindir ve toplu sözleşme hükmündedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Toplu sözleşme hakkının kapsamı, istisnaları, toplu sözleşmeden yararlanacaklar, toplu sözleşmenin yapılma şekli, usulü ve yürürlüğü, toplu sözleşme hükümlerinin emeklilere yansıtılması, Kamu Görevlileri Hakem Kurulunun teşkili, çalışma usul ve esasları ile diğer hususlar kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Grev hakkı ve lokavt">
          <mvz-madde no="54" başlık="">
            <mvz-fıkra no="1">
              <template>Toplu iş sözleşmesinin yapılması sırasında, uyuşmazlık çıkması halinde işçiler grev hakkına sahiptirler.  Bu hakkın kullanılmasının ve işverenin lokavta başvurmasının usul ve şartları ile kapsam ve istisnaları kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Grev hakkı ve lokavt iyiniyet kurallarına aykırı tarzda, toplum zararına ve milli serveti tahrip edecek şekilde kullanılamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>(Mülga)</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Grev ve lokavtın yasaklanabileceği veya ertelenebileceği haller ve işyerleri kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Grev ve lokavtın yasaklandığı hallerde veya ertelendiği durumlarda ertelemenin sonunda, uyuşmazlık Yüksek Hakem Kurulunca çözülür. Uyuşmazlığın her safhasında taraflar da anlaşarak Yüksek Hakem Kuruluna başvurabilir. Yüksek Hakem Kurulunun kararları kesindir ve toplu iş sözleşmesi hükmündedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Yüksek hakem kurulunun kuruluş ve görevleri kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>(Mülga)</template>
            </mvz-fıkra>
            <mvz-fıkra no="8">
              <template>Greve katılmayanların işyerinde çalışmaları, greve katılanlar tarafından hiç bir şekilde engellenemez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="VII" başlık="Ücrette adalet sağlanması">
        <mvz-madde no="55" başlık="">
          <mvz-fıkra no="1">
            <template>Ücret emeğin karşılığıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Devlet, çalışanların yaptıkları işe uygun adaletli bir ücret elde etmeleri ve diğer sosyal yardımlardan yararlanmaları için gerekli tedbirleri alır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Asgarî ücretin tespitinde çalışanların geçim şartları ile ülkenin ekonomik durumu da gözönünde bulundurulur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="VIII" başlık="Sağlık, çevre ve konut">
        <mvz-b2 no="A" başlık="Sağlık hizmetleri ve çevrenin korunması">
          <mvz-madde no="56" başlık="">
            <mvz-fıkra no="1">
              <template>Herkes, sağlıklı ve dengeli bir çevrede yaşama hakkına sahiptir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Çevreyi geliştirmek, çevre sağlığını korumak ve çevre kirlenmesini önlemek Devletin ve vatandaşların ödevidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Devlet, herkesin hayatını, beden ve ruh sağlığı içinde sürdürmesini sağlamak; insan ve madde gücünde tasarruf ve verimi artırarak, işbirliğini gerçekleştirmek amacıyla sağlık kuruluşlarını tek elden planlayıp hizmet vermesini düzenler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Devlet, bu görevini kamu ve özel kesimlerdeki sağlık ve sosyal kurumlarından yararlanarak, onları denetleyerek yerine getirir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Sağlık hizmetlerinin yaygın bir şekilde yerine getirilmesi için kanunla genel sağlık sigortası kurulabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Konut hakkı">
          <mvz-madde no="57" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet, şehirlerin özelliklerini ve çevre şartlarını gözeten bir planlama çerçevesinde, konut ihtiyacını karşılayacak tedbirleri alır, ayrıca toplu konut teşebbüslerini destekler.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="IX" başlık="Gençlik ve spor">
        <mvz-b2 no="A" başlık="Gençliğin korunması">
          <mvz-madde no="58" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet, istiklal ve Cumhuriyetimizin emanet edildiği gençlerin müsbet ilmin ışığında, Atatürk ilke ve inkılapları doğrultusunda ve Devletin ülkesi ve milletiyle bölünmez bütünlüğünü ortadan kaldırmayı amaç edinen görüşlere karşı yetişme ve gelişmelerini sağlayıcı tedbirleri alır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Devlet, gençleri alkol düşkünlüğünden, uyuşturucu maddelerden, suçluluk, kumar ve benzeri kötü alışkanlıklardan ve cehaletten korumak için gerekli tedbirleri alır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Sporun geliştirilmesi ve tahkim">
          <mvz-madde no="59" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet, her yaştaki Türk vatandaşlarının beden ve ruh sağlığını geliştirecek tedbirleri alır, sporun kitlelere yayılmasını teşvik eder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Devlet başarılı sporcuyu korur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Spor federasyonlarının spor faaliyetlerinin yönetimine ve disiplinine ilişkin kararlarına karşı ancak zorunlu tahkim yoluna başvurulabilir. Tahkim kurulu kararları kesin olup bu kararlara karşı hiçbir yargı merciine başvurulamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="X" başlık="Sosyal güvenlik hakları">
        <mvz-b2 no="A" başlık="Sosyal güvenlik hakkı">
          <mvz-madde no="60" başlık="">
            <mvz-fıkra no="1">
              <template>Herkes, sosyal güvenlik hakkına sahiptir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Devlet, bu güvenliği sağlayacak gerekli tedbirleri alır ve teşkilatı kurar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Sosyal güvenlik bakımından özel olarak korunması gerekenler:">
          <mvz-madde no="61" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet harp ve vazife şehitlerinin dul ve yetimleriyle, malül ve gazileri korur ve toplumda kendilerine yaraşır bir hayat seviyesi sağlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Devlet, sakatların korunmalarını ve toplum hayatına intibaklarını sağlayıcı tedbirleri alır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Yaşlılar, Devletçe korunur, Yaşlılara Devlet yardımı ve sağlanacak diğer haklar ve kolaylıklar kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Devlet, korunmaya muhtaç çocukların topluma kazandırılması için her türlü tedbiri alır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Bu amaçlarla gerekli teşkilat ve tesisleri kurar veya kurdurur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="C" başlık="Yabancı ülkelerde çalışan Türk vatandaşları">
          <mvz-madde no="62" başlık="">
            <mvz-fıkra no="1">
              <template>Devlet, yabancı ülkelerde çalışan Türk vatandaşlarının aile birliğinin, çocuklarının eğitiminin, kültürel ihtiyaçlarının ve sosyal güvenliklerinin sağlanması, anavatanla bağlarının korunması ve yurda dönüşlerinde yardımcı olunması için gereken tedbirleri alır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="XI" başlık="Tarih, kültür ve tabiat varlıklarının korunması">
        <mvz-madde no="63" başlık="">
          <mvz-fıkra no="1">
            <template>Devlet, tarih, kültür ve tabiat varlıklarının ve değerlerinin korunmasını sağlar, bu amaçla destekleyici ve teşvik edici tedbirleri alır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu varlıklar ve değerlerden özel mülkiyet konusu olanlara getirilecek sınırlamalar ve bu nedenle hak sahiplerine yapılacak yardımlar ve tanınacak muafiyetler kanunla düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="XII" başlık="Sanatın ve sanatçının korunması">
        <mvz-madde no="64" başlık="">
          <mvz-fıkra no="1">
            <template>Devlet, sanat faaliyetlerini ve sanatçıyı korur. Sanat eserlerinin ve sanatçının korunması, değerlendirilmesi, desteklenmesi ve sanat sevgisinin yayılması için gereken tedbirleri alır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="XIII" başlık="Devletin iktisadi ve sosyal ödevlerinin sınırları">
        <mvz-madde no="65" başlık="">
          <mvz-fıkra no="1">
            <template>Devlet, sosyal ve ekonomik alanlarda Anayasa ile belirlenen görevlerini, bu görevlerin amaçlarına uygun öncelikleri gözeterek malî kaynaklarının yeterliliği ölçüsünde yerine getirir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Siyasi Haklar ve Ödevler">
      <mvz-b1 no="I" başlık="Türk vatandaşlığı">
        <mvz-madde no="66" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Devletine vatandaşlık bağı ile bağlı olan herkes Türktür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Türk babanın veya Türk ananın çocuğu Türktür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Vatandaşlık, kanunun gösterdiği şartlarla kazanılır ve ancak kanunda belirtilen hallerde kaybedilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hiçbir Türk, vatana bağlılıkla bağdaşmayan bir eylemde bulunmadıkça vatandaşlıktan çıkarılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Vatandaşlıktan çıkarma ile ilgili karar ve işlemlere karşı yargı yolu kapatılamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="II" başlık="Seçme, seçilme ve siyasi faaliyette bulunma hakları">
        <mvz-madde no="67" başlık="">
          <mvz-fıkra no="1">
            <template>Vatandaşlar, kanunda gösterilen şartlara uygun olarak seçme, seçilme ve bağımsız olarak veya bir siyasi parti içinde siyasi faaliyette bulunma ve halkoylamasına katılma hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Seçimler ve halkoylaması serbest, eşit, gizli, tek dereceli, genel oy, açık sayım ve döküm esaslarına göre, yargı yönetim ve denetimi altında yapılır. Ancak, yurt dışında bulunan Türk vatandaşlarının oy hakkını kullanabilmeleri amacıyla kanun, uygulanabilir tedbirleri belirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Onsekiz yaşını dolduran her Türk vatandaşı seçme ve halkoylamasına katılma haklarına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu hakların kullanılması kanunla düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Silah altında bulunan er ve erbaşlar ile askeri öğrenciler, taksirli suçlardan hüküm giyenler hariç ceza infaz kurumlarında bulunan hükümlüler oy kullanamazlar. Ceza infaz kurumları ve tutuk evlerinde oy kullanılması ve oyların sayım ve dökümünde seçim emniyeti açısından alınması gerekli tedbirler Yüksek Seçim Kurulu tarafından tespit edilir ve görevli hakimin yerinde yönetim ve denetimi altında yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Seçim kanunları, temsilde adalet ve yönetimde istikrar ilkelerini bağdaştıracak biçimde düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Seçim kanunlarında yapılan değişiklikler, yürürlüğe girdiği tarihten itibaren bir yıl içinde yapılacak seçimlerde uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="III" başlık="Siyasi partilerle ilgili hükümler">
        <mvz-b2 no="A" başlık="Parti kurma, partilere girme ve partilerden ayrılma">
          <mvz-madde no="68" başlık="">
            <mvz-fıkra no="1">
              <template>Vatandaşlar, siyasi parti kurma ve usulüne göre partilere girme ve partilerden ayrılma hakkına sahiptir. Parti üyesi olabilmek için onsekiz yaşını doldurmuş olmak gerekir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Siyasi partiler, demokratik siyasi hayatın vazgeçilmez unsurlarıdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Siyasi partiler önceden izin almadan kurulurlar ve Anayasa ve kanun hükümleri içerisinde faaliyetlerini sürdürürler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Siyasi partilerin tüzük ve programları ile eylemleri, Devletin bağımsızlığına, ülkesi ve milletiyle bölünmez bütünlüğüne, insan haklarına, eşitlik ve hukuk devleti ilkelerine, millet egemenliğine, demokratik ve laik Cumhuriyet ilkelerine aykırı olamaz; sınıf veya zümre diktatörlüğünü veya herhangi bir tür diktatörlüğü savunmayı ve yerleştirmeyi amaçlayamaz; suç işlenmesini teşvik edemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Hakimler ve savcılar, Sayıştay dahil yüksek yargı organları mensupları, kamu kurum ve kuruluşlarının memur statüsündeki görevlileri, yaptıkları hizmet bakımından işçi niteliği taşımayan diğer kamu görevlileri, Silahlı Kuvvetler mensupları ile yükseköğretim öncesi öğrencileri siyasi partilere üye olamazlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Yüksek öğretim elemanlarının siyasi partilere üye olmaları ancak kanunla düzenlenebilir. Kanun bu elemanların, siyasi partilerin merkez organları dışında kalan parti görevi almalarına cevaz veremez ve parti üyesi yüksek öğretim elemanlarının yüksek öğretim kurumlarında uyacakları esasları belirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Yüksek öğretim öğrencilerinin siyasi partilere üye olabilmelerine ilişkin esaslar kanunla düzenlenir</template>
            </mvz-fıkra>
            <mvz-fıkra no="8">
              <template>Siyasi partilere, Devlet, yeterli düzeyde ve hakça mali yardım yapar. Partilere yapılacak yardımın, alacakları üye aidatının ve bağışların tabi olduğu esaslar kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Siyasi partilerin uyacakları esaslar">
          <mvz-madde no="69" başlık="">
            <mvz-fıkra no="1">
              <template>Siyasi partilerin faaliyetleri, parti içi düzenlemeleri ve çalışmaları demokrasi ilkelerine uygun olur. Bu ilkelerin uygulanması kanunla düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Siyasi partiler, ticari faaliyetlere girişemezler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Siyasi partilerin gelir ve giderlerinin amaçlarına uygun olması gereklidir. Bu kuralın uygulanması kanunla düzenlenir. Anayasa Mahkemesince siyasi partilerin mal edinimleri ile gelir ve giderlerinin kanuna uygunluğunun tespiti, bu hususun denetim yöntemleri ve aykırılık halinde uygulanacak yaptırımlar kanunda gösterilir. Anayasa Mahkemesi, bu denetim görevini yerine getirirken Sayıştaydan yardım sağlar. Anayasa Mahkemesinin bu denetim sonunda vereceği kararlar kesindir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Siyasi partilerin kapatılması, Yargıtay Cumhuriyet Başsavcısının açacağı dava üzerine Anayasa Mahkemesince kesin olarak karara bağlanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Bir siyasi partinin tüzüğü ve programının 68 inci maddenin dördüncü fıkrası hükümlerine aykırı bulunması halinde temelli kapatma kararı verilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Bir siyasi partinin 68 inci maddenin dördüncü fıkrası hükümlerine aykırı eylemlerinden ötürü temelli kapatılmasına, ancak, onun bu nitelikteki fiillerin işlendiği bir odak haline geldiğinin Anayasa Mahkemesince tespit edilmesi halinde karar verilir.  Bir siyasî parti, bu nitelikteki fiiller o partinin üyelerince yoğun bir şekilde işlendiği ve bu durum o partinin büyük kongre veya genel başkan veya merkez karar veya yönetim organları veya Türkiye Büyük Millet Meclisindeki grup genel kurulu veya grup yönetim kurulunca zımnen veya açıkça benimsendiği yahut bu fiiller doğrudan doğruya anılan parti organlarınca kararlılık içinde işlendiği takdirde, söz konusu fiillerin odağı haline gelmiş sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Anayasa Mahkemesi, yukarıdaki fıkralara göre temelli kapatma yerine, dava konusu fiillerin ağırlığına göre ilgili siyasî partinin Devlet yardımından kısmen veya tamamen yoksun bırakılmasına karar verebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="8">
              <template>Temelli kapatılan bir parti bir başka ad altında kurulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="9">
              <template>Bir siyasi partinin temelli kapatılmasına beyan veya faaliyetleriyle sebep olan kurucuları dahil üyeleri, Anayasa Mahkemesinin temelli kapatmaya ilişkin kesin kararının Resmî Gazetede gerekçeli olarak yayımlanmasından başlayarak beş yıl süreyle bir başka partinin kurucusu, üyesi, yöneticisi ve deneticisi olamazlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="10">
              <template>Yabancı devletlerden, uluslararası kuruluşlardan ve Türk uyrukluğunda olmayan gerçek ve tüzel kişilerden maddi yardım alan siyasi partiler temelli olarak kapatılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="11">
              <template>Siyasî partilerin kuruluş ve çalışmaları, denetlenmeleri, kapatılmaları ya da Devlet yardımından kısmen veya tamamen yoksun bırakılmaları ile siyasî partilerin ve adayların seçim harcamaları ve usulleri yukarıdaki esaslar çerçevesinde kanunla düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="IV" başlık="Kamu hizmetlerine girme hakkı">
        <mvz-b2 no="A" başlık="Hizmete girme">
          <mvz-madde no="70" başlık="">
            <mvz-fıkra no="1">
              <template>Her Türk, kamu hizmetlerine girme hakkına sahiptir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Hizmete alınmada, görevin gerektirdiği niteliklerden başka hiçbir ayırım gözetilemez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="B" başlık="Mal bildirimi">
          <mvz-madde no="71" başlık="">
            <mvz-fıkra no="1">
              <template>Kamu hizmetine girenlerin mal bildiriminde bulunmaları ve bu bildirimlerin tekrarlanma süreleri kanunla düzenlenir. Yasama ve yürütme organlarında görev alanlar, bundan istisna edilemez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="V" başlık="Vatan hizmeti">
        <mvz-madde no="72" başlık="">
          <mvz-fıkra no="1">
            <template>Vatan hizmeti, her Türkün hakkı ve ödevidir. Bu hizmetin Silahlı Kuvvetlerde veya kamu kesiminde ne şekilde yerine getirileceği veya getirilmiş sayılacağı kanunla düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="VI" başlık="Vergi ödevi">
        <mvz-madde no="73" başlık="">
          <mvz-fıkra no="1">
            <template>Herkes, kamu giderlerini karşılamak üzere, mali gücüne göre, vergi ödemekle yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Vergi yükünün adaletli ve dengeli dağılımı, maliye politikasının sosyal amacıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Vergi, resim, harç ve benzeri mali yükümlülükler kanunla konulur, değiştirilir veya kaldırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Vergi, resim, harç ve benzeri mali yükümlülüklerin muaflık, istisnalar ve indirimleriyle oranlarına ilişkin hükümlerinde kanunun belirttiği yukarı ve aşağı sınırlar içinde değişiklik yapmak yetkisi Cumhurbaşkanına verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="VII" başlık="Dilekçe, bilgi edinme ve kamu denetçisine başvurma hakkı">
        <mvz-madde no="74" başlık="">
          <mvz-fıkra no="1">
            <template>Vatandaşlar ve karşılıklılık esası gözetilmek kaydıyla Türkiye’de ikamet eden yabancılar kendileriyle veya kamu ile ilgili dilek ve şikayetleri hakkında, yetkili makamlara ve Türkiye Büyük Millet Meclisine yazı ile başvurma hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kendileriyle ilgili başvurmaların sonucu gecikmeksizin, dilekçe sahiplerine yazılı olarak bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>(Mülga)</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Herkes, bilgi edinme ve kamu denetçisine başvurma hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Türkiye Büyük Millet Meclisi Başkanlığına bağlı olarak kurulan Kamu Denetçiliği Kurumu idarenin işleyişiyle ilgili şikâyetleri inceler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Kamu Başdenetçisi Türkiye Büyük Millet Meclisi tarafından gizli oyla dört yıl için seçilir. İlk iki oylamada üye tamsayısının üçte iki ve üçüncü oylamada üye tamsayısının salt çoğunluğu aranır. Üçüncü oylamada salt çoğunluk sağlanamazsa, bu oylamada en çok oy alan iki aday için dördüncü oylama yapılır; dördüncü oylamada en fazla oy alan aday seçilmiş olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu maddede sayılan hakların kullanılma biçimi, Kamu Denetçiliği Kurumunun kuruluşu, görevi, çalışması, inceleme sonucunda yapacağı işlemler ile Kamu Başdenetçisi ve kamu denetçilerinin nitelikleri, seçimi ve özlük haklarına ilişkin usul ve esaslar kanunla düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
  </mvz-kısım>
