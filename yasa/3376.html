  <mvz-künye tür="kanun" no="3376" başlık="ANAYASA DEĞİŞİKLİKLERİNİN HALKOYUNA SUNULMASI HAKKINDA KANUN"
             tarih="23/5/1987" rgazete-tarih="28/5/1987" rgazete-sayı="19473"
             düstur-tertip="5" düstur-cilt="26" />
  
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Anayasa gereğince yapılacak olan halk oylamalarında bu Kanun hükümleri uygulanır. Bu Kanunda hüküm bulunmayan hallerde 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri hakkında Kanunun bu Kanuna aykırı olmayan hükümleri tatbik edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Anayasa değişikliğinin halkoylaması, ilgili Anayasa değişikliği Kanununun Resmi Gazetede yayımını takip eden altmışıncı günden sonraki ilk pazar günü yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>Halkoyuna sunulma işlemleri, Yüksek Seçim Kurulunun yönetim ve denetiminde seçim kurullarınca yürütülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yüksek Seçim Kurulu, Anayasa değişikliklerinin halkoyuna sunulması için bütün tedbirleri alır ve hazırlıkları yapar. Kurul, halkoylamasının sağlıklı ve düzenli bir şekilde gerçekleşmesini sağlamak amacıyla gerekli ilke kararlarını almaya yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>Halkoylamasında Beyaz renk üzerinde "Evet", Kahverengi üzerinde "Hayır" ibareleri bulunan iki ayrı renkten müteşekkil birleşik oy pusulası kullanılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Halkoylamasına katılanlar, üzerinde özel işaret bulunan mühürü birleşik oy pusulasında tercih ettiği kısmın üzerine basarak oyunu kullanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="">
    <mvz-fıkra no="1">
      <template>Anayasa değişikliklerinin halka anlatılmasında;</template>
      <mvz-bent no="a">
        <template>298 sayılı Kanunun propaganda serbestliğine ilişkin hükümleri, halkoylaması gününden önceki yedinci günden başlayarak uygulanır.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Anayasa değişikliklerinin açıklanması ve tanıtılması amacıyla; özel kanunlardaki hükümler saklı kalmak üzere Türkiye Büyük Millet Meclisinde grubu bulunan siyasi partiler ve Cumhurbaşkanı halkoylaması gününden önceki yedinci günden itibaren, halkoylamasından önceki gün saat 18.00'e kadar radyo ve televizyonla aşağıdaki esaslara göre propaganda yapabilirler:</template>
        <mvz-altbent no="1">
          <template>Türkiye Büyük Millet Meclisinde grubu bulunan partilere 10'ar dakikalık ikişer konuşma,</template>
        </mvz-altbent>
        <mvz-altbent no="2">
          <template>İktidar partisine veya partilerine 10'ar dakikalık birer, iktidar ortağı partilerden büyük olanına ilaveten 10 dakikalık bir konuşma, (iktidar partisinin konuşması siyasi partilerin konuşmalarının tamamlanmasından sonra yapılır. İktidar ortağı partiler bulunuyor ise son konuşma en büyük iktidar ortağı partiye aittir.)</template>
        </mvz-altbent>
        <mvz-altbent no="3">
          <template>Cumhurbaşkanına, dilerse birisi en sonda olmak üzere 10'ar dakikalık iki konuşma, Hakkı verilir.</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Anayasa değişikliğine dair Kanun Resmi Gazetede yayımlandıktan sonra TRT'de, (b) fıkrasında belirtilenler dışında bu konuya ilişkin başka yayın yapılamaz.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>Oy verme kütüğünde ve sandık listesinde kayıtlı olan ve oy kullanma yeterliği bulunan her vatandaş halkoylamasına katılır ve oyunu kullanır. 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun uyarınca yabancı ülkelerdeki vatandaşlar halkoylamasından yirmi gün öncesinden başlayarak oylarını kullanabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Seçmen kütüğünde ve sandık listesinde kaydı ve oy kullanma yeterliği bulunduğu halde halkoylamasına, hukuki veya fiili mazereti olmaksızın katılmayanlar, İlçe seçim kurulu başkanı tarafından onikibinbeşyüz lira para cezası ile cezalandırılırlar. Ancak, halkoylaması gününden itibaren üç ay içinde hukuki veya fiili mazeretini bildiren ve mazereti İlçe seçim kurulu başkanınca geçerli görülenlerden bu para tahsil edilmez. İlçe seçim kurulu başkanınca verilen para cezası ile ilgili kararlar kesindir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="">
    <mvz-fıkra no="1">
      <template>Sandık, ilçe ve il seçim kurullarınca düzenlenecek tutanaklarda;</template>
      <mvz-bent no="a">
        <template>Sandık listesinde kayıtlı olanların sayısı,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Halkoylamasına katılanların sayısı,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Geçerli olan oyların sayısı,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Geçerli olmayan oyların sayısı,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Anayasa değişikliğine "Evet" oyu verenlerin sayısı,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Anayasa değişikliğine "Hayır" oyu verenlerin sayısı,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Ayrı ayrı gösterilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="">
    <mvz-fıkra no="1">
      <template>İl Seçim Kurulları, İlçe Seçim Kurullarından gelen tutanakları toplar. İl birleştirme tutanağında beliren sonuçları derhal en seri vasıta ile Yüksek Seçim Kuruluna bildirir ve tutanağın onaylı bir örneğini gönderir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yüksek Seçim Kurulu, İl Seçim Kurullarından gelen sonuçları birleştirerek ilan eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Geçerli oyların yarısından çoğu "Evet" ise, Anayasa değişikliği Türk Milleti tarafından kabul edilmiş olur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17.5.1987 tarih ve 3361 sayılı Kanunla kabul edilen, Anayasanın geçici 4 üncü maddesi ile ilgili olarak yapılacak halkoylamasında, Türkiye Büyük Millet Meclisinde grubu bulunan siyasi partilere ve Cumhurbaşkanına 10'ar dakikalık ikişer Radyo ve Televizyon konuşma hakkı verilir. Cumhurbaşkanı bu hakkını dilerse kullanır. Cumhurbaşkanınca bu hak kullanılırsa, konuşmalarından birisi en sonuncu konuşma olur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17.5.1987 tarih ve 3361 sayılı Kanunla kabul edilen, Anayasanın geçici 4 üncü maddesi ile ilgili halkoylaması 6.9.1987 Pazar günü bu Kanundaki esaslara göre yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17.5.1987 tarih ve 3361 sayılı Kanunla kabul edilen, Anayasanın geçici 4 üncü maddesi ile ilgili olarak yapılacak halk oylamasında oy vereceklerin kütüklere yazılması ve sandık listelerinin düzenlenmesi amacıyla bütün Türkiye'de aynı zamanda 1987 yılının Temmuz ayının ikinci pazar günü, Yüksek Seçim Kurulunun gözetim ve denetiminde yazım yaptırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Halkoylamasında kullanılacak seçmen kütüklerinin yazımında 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun ile ilgili diğer kanunların bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Halkoylamasında kullanılacak seçmen kütüklerinin yazımı ve halkoylamasının yapılması için Adalet Bakanlığı bütçesinin ilgili bölümüne yeterli miktar ödenek, Maliye ve Gümrük Bakanlığının yedek ödenek tertibinden aktarılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yüksek Seçim Kurulu, seçmen kütüklerinin süratle yazımının, daktilo edilmesinin ve kartların dağıtımının sağlanması için geçici ve yevmiyeli personel istihdam edebilir. Bu personele Yüksek Seçim Kurulu Başkanlığınca ikibin ila onbin lira arasında takdir edilecek gündelik ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu maddenin yürürlüğe girdiği tarihten sonra yapılacak ilk Anayasa değişikliğinin halkoyuna sunulmasında;</template>
      <mvz-bent no="a">
        <template>Bu Kanunun ikinci maddesindeki 120 günlük süre 40 gün, altıncı maddesindeki 40 günlük süre 10 gün olarak uygulanır.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Halkoylamasıyla ilgili olarak kanunlarda yer alan diğer bütün süreleri, gerektiğinde kısaltarak tespit ve ilana Yüksek Seçim Kurulu yetkilidir.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Yüksek Seçim Kurulu, halkoylamasında kullanılacak birleşik oy pusulalarını gerektiğinde uygun göreceği il seçim kurulları vasıtasıyla bastırmaya ve sandık kurullarına gönderilecek oy pusulalarının ihtiyacı dikkate alarak uygun göreceği adetlerle paketlenmesine karar vermeye yetkilidir.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Gerekli ödenek ilgili kuruluş bütçelerine Maliye ve Gümrük Bakanlığınca aktarılır.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
