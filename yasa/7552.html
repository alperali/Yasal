  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Başlangıç Hükümleri">
      <mvz-madde no="1" başlık="Amaç ve kapsam">
        <mvz-fıkra no="1">
          <template>Bu Kanunun amacı; yeşil büyüme vizyonu ve net sıfır emisyon hedefi doğrultusunda iklim değişikliğiyle mücadele etmektir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanun; iklim değişikliği ile mücadelede esas olan sera gazı emisyonlarının azaltılması ve iklim değişikliğine uyum faaliyetleri ile planlama ve uygulama araçlarını, gelirleri, izin ve denetimi ve bunlara ilişkin yasal ve kurumsal çerçevenin usul ve esaslarını kapsar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Tanımlar">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanmasında;</template>
          <mvz-bent no="a">
            <template>Adil geçiş: İklim değişikliğiyle mücadelede ve yeşil büyüme sürecinde; çocuklar, kadınlar, yaşlılar, engelliler gibi süreçten en fazla etkilenebilecek kişiler öncelikli olmak üzere herkesi kapsayacak, istihdam sürecinin uygun tedbirler alınarak yönetildiği ve yeni istihdam alanlarının oluşturulduğu, ekonomik, çevresel ve sosyal kazanımların en üst düzeyde tutulduğu politika ve uygulamaları,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bakan: Çevre, Şehircilik ve İklim Değişikliği Bakanını,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bakanlık: Çevre, Şehircilik ve İklim Değişikliği Bakanlığını,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Başkan: İklim Değişikliği Başkanını,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Başkanlık: İklim Değişikliği Başkanlığını,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Birincil piyasa: Tahsisatların piyasa katılımcılarına ihale yöntemiyle dağıtımını sağlamaya yönelik işlemlerin yapıldığı piyasayı,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Denkleştirme: Karbon kredilerinin Emisyon Ticaret Sistemi kapsamında veya gönüllü taahhütlerin yerine getirilmesinde kullanılmasını,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Emisyon Ticaret Sistemi (ETS): Sera gazı emisyonlarına, net sıfır emisyon hedefine uygun bir üst sınır belirlenmesi ilkesine dayalı olarak çalışan ve tahsisatların alınıp satılması suretiyle sera gazı emisyonu azaltımını teşvik eden ulusal ve/veya uluslararası piyasa temelli mekanizmayı,</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Emisyon Ticaret Sistemi piyasası (ETS piyasası): Tahsisatların ve/veya emisyon ticaretine ilişkin uygun görülen standartlaştırılmış diğer sözleşmelerin alım satımının gerçekleştirildiği, piyasa işletmecisi tarafından organize edilip işletilen ve düzenli faaliyet gösteren birincil ve ikincil piyasaları,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Esneklik mekanizmaları: ETS’de yer alan işletmelere tahsisat teslimat yükümlülüklerini yerine getirirken bir önceki veya bir sonraki dönemin tahsisatlarını kullanma hakkı ile denkleştirme kullanımı ve benzeri imkânlar sağlayan süreçleri,</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Gömülü sera gazı emisyonları: Bir ürünün üretim sürecinde ortaya çıkan doğrudan emisyonları ve ürünün üretim sürecinde elektrik, ısı, buhar, soğutma ve basınçlı hava gibi enerji kullanımından kaynaklanan dolaylı emisyonları,</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Gönüllü karbon piyasaları: Karbon kredilerinin gönüllülük esasına göre alım satımının yapıldığı piyasaları,</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>İkincil piyasalar: Tahsisatların, ücretsiz dağıtımı ve/veya birincil piyasada satışı sonrasında işlem gördüğü piyasaları,</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>İklim adaleti: İklim değişikliğinin ve iklim değişikliğini önleme ile uyuma yönelik çabaların neden olduğu eşitsizliği ortadan kaldırmayı amaçlayan politika ve uygulamaları,</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>İklim değişikliğine uyum: İklim değişikliğinin mevcut veya olası olumsuz etkilerini önlemeye, muhtemel zararları en aza indirmeye ya da ortaya çıkabilecek fırsatlardan yararlanmaya yönelik süreci,</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>İklim finansmanı: İklim değişikliği ile mücadele kapsamında sera gazı emisyonlarının azaltımı ve iklim değişikliğine uyum faaliyetlerini desteklemeyi amaçlayan kamu, özel ve alternatif finansman kaynaklarından sağlanan yerel, ulusal, uluslarüstü veya uluslararası finansmanı,</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>İklim değişikliğiyle mücadele teşviki: İklim değişikliği ile mücadele kapsamında; planlama ve uygulama araçları ile sera gazı emisyonlarının azaltımı ve iklim değişikliğine uyum faaliyetlerini destekleyen teşvikleri,</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Karbon fiyatlandırma araçları: Sera gazı emisyonlarının azaltımı amacıyla uygulanabilecek ETS ve/veya karbon esaslı vergiler ve benzeri araçları,</template>
          </mvz-bent>
          <mvz-bent no="ö">
            <template>Karbon kredisi: Sera gazı emisyonlarının azaltım veya giderim faaliyetlerinin bağımsız kuruluşlar tarafından geçerli kılınması, doğrulanması ve standart kuruluşu tarafından belgelendirilmesi sonucu elde edilen ve bir ton karbondioksit eşdeğeri cinsinden ifade edilen krediyi,</template>
          </mvz-bent>
          <mvz-bent no="p">
            <template>Karbondioksit eşdeğeri: Sera gazlarının miktarlarının ya da küresel ısınma potansiyellerinin karbondioksit gazı cinsinden ifade edildiği metrik ölçümü,</template>
          </mvz-bent>
          <mvz-bent no="r">
            <template>Merkezî uzlaştırma kuruluşu: Piyasa katılımcıları arasındaki ilgili yönetmelikle belirlenecek olan nakit takas ve teminat yönetimi gibi mali işlemleri yürütmek üzere kullanılan, 6/12/2012 tarihli ve 6362 sayılı Sermaye Piyasası Kanununa göre merkezî takas kuruluşu olarak kurulan kuruluşu,</template>
          </mvz-bent>
          <mvz-bent no="s">
            <template>Net sıfır emisyon: İnsan kaynaklı faaliyetler dolayısıyla atmosfere salınan sera gazı emisyonlarının teknoloji ve diğer yöntemlerle azaltılarak ve/veya yutak alanlar vasıtasıyla dengelenerek sera gazı emisyonlarında net artış olmamasını,</template>
          </mvz-bent>
          <mvz-bent no="ş">
            <template>Ortak fakat farklılaştırılmış sorumluluklar ve göreceli kabiliyetler: İklim değişikliği ile mücadelede ülkelerin farklı kapasiteleri ve sorumlulukları olduğunu kabul eden uluslararası anlaşmalarda kabul gören ilkeyi,</template>
          </mvz-bent>
          <mvz-bent no="t">
            <template>Ozon tabakasını incelten maddeler: Tek başına veya bir karışım hâlinde ozon tabakasını inceltme potansiyeline sahip ve 1/8/1990 tarihli ve 90/733 sayılı Bakanlar Kurulu kararıyla onaylanan Ozon Tabakasını İncelten Maddelere İlişkin Montreal Protokolü ile kontrol altına alınan kimyasalları ve izomerlerini,</template>
          </mvz-bent>
          <mvz-bent no="u">
            <template>Piyasa istikrar mekanizması: Tahsisatlara ilişkin fiyat istikrarını sağlamak amacıyla gerçekleştirilen iş ve işlemleri,</template>
          </mvz-bent>
          <mvz-bent no="ü">
            <template>Piyasa işletmecisi: Enerji Piyasaları İşletme Anonim Şirketini,</template>
          </mvz-bent>
          <mvz-bent no="v">
            <template>Planlama araçları: Kurum ve kuruluşlarca hazırlanan ve iklim değişikliği ile mücadeleye doğrudan ya da dolaylı olarak katkı sağlayan plan, program, strateji, eylem planı ve sair politika belgelerini,</template>
          </mvz-bent>
          <mvz-bent no="y">
            <template>Proje sahibi: Karbon kredisi üretecek faaliyeti geliştiren gerçek veya tüzel kişiyi,</template>
          </mvz-bent>
          <mvz-bent no="z">
            <template>Sera gazı emisyonu: Kızılötesi radyasyon emen ve yeniden salan, hem tabii ve hem de beşeri kaynaklı olabilen karbondioksit, metan, diazotoksit ve hidroflorokarbonlar, perflorokarbonlar, kükürt hekzaflorür gazlarının ve gaz benzeri diğer atmosfer bileşenlerin salımını,</template>
          </mvz-bent>
          <mvz-bent no="aa">
            <template>Sera gazı emisyonlarının azaltımı: Sera gazı emisyonlarının azaltılması ile yutak alanların korunması, artırılması ve iyileştirilmesi faaliyetlerini,</template>
          </mvz-bent>
          <mvz-bent no="bb">
            <template>Sınırda Karbon Düzenleme Mekanizması (SKDM): Gümrük bölgesinde, ithal edilen malların sera gazı emisyonlarının yönetimi mekanizmasını,</template>
          </mvz-bent>
          <mvz-bent no="cc">
            <template>Tahsisat: Misli nitelikte, devredilebilen, kaydi olarak ihraç edilen ve belirli bir süre boyunca bir ton karbondioksit eşdeğerinde sera gazı emisyon hakkını,</template>
          </mvz-bent>
          <mvz-bent no="çç">
            <template>Türkiye Yeşil Taksonomisi (Taksonomi): Belirlenen çevresel hedefler doğrultusunda iklim değişikliği ile mücadeleye katkı sağlayan ekonomik faaliyetlere ilişkin ilkeler ve kriterler belirleyerek iklim finansmanının harekete geçirilmesine katkıda bulunan sınıflandırma sistemlerini,</template>
          </mvz-bent>
          <mvz-bent no="dd">
            <template>Ulusal Katkı Beyanı: Başkanlık koordinasyonunda ilgili kurum ve kuruluşların iş birliğiyle uluslararası anlaşmalar ve standartlar gözetilerek sera gazı emisyonlarının azaltımı ve iklim değişikliğine uyum hedefleri ile taahhütlerini içerecek şekilde dönemsel olarak hazırlanan ve Birleşmiş Milletler İklim Değişikliği Çerçeve Sözleşmesi Sekretaryasına sunulan belgeyi,</template>
          </mvz-bent>
          <mvz-bent no="ee">
            <template>Ulusal tahsisat planı: Belirli bir döneme ilişkin, üst limit çerçevesinde belirlenen toplam tahsisat miktarını,</template>
          </mvz-bent>
          <mvz-bent no="ff">
            <template>Uluslararası karbon piyasaları: Ülkemizin taraf olduğu uluslararası anlaşmalar kapsamında Ulusal Katkı Beyanı hedeflerine ulaşmak amacıyla oluşturulan mekanizmaları,</template>
          </mvz-bent>
          <mvz-bent no="gg">
            <template>Uygulama araçları: İklim değişikliği ile mücadeleye yönelik finansman, teknoloji geliştirme ve transferi ile kapasite geliştirme faaliyetlerini,</template>
          </mvz-bent>
          <mvz-bent no="ğğ">
            <template>Yeşil iş: Çevrenin ve doğal kaynakların korunmasına ve çevre kalitesinin geliştirilmesine katkıda bulunarak sürdürülebilir kalkınmayı ve yeşil büyümeyi destekleyen işleri,</template>
          </mvz-bent>
          <mvz-bent no="hh">
            <template>Yutak alan: Ormanlar ve diğer ekosistemler vasıtasıyla karbonu emerek atmosferden uzaklaştıran, karbondioksit emisyonlarını dengeleyen süreci, aktiviteyi ve mekanizmayı,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Genel İlkeler ve Esaslar">
      <mvz-madde no="3" başlık="İlkeler">
        <mvz-fıkra no="1">
          <template>İklim değişikliği ile mücadelede genel ilkeler şunlardır:</template>
          <mvz-bent no="a">
            <template>İklim değişikliği ile mücadelede, ülkemizin ortak fakat farklılaştırılmış sorumluluklar ve göreceli kabiliyetler ilkesi dikkate alınarak, eşitlik, iklim adaleti, ihtiyatlılık, katılım, entegrasyon, sürdürülebilirlik, şeffaflık, adil geçiş ve ilerleme yaklaşımları esas alınır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kamu kurum ve kuruluşları ile gerçek ve tüzel kişiler, bu Kanun doğrultusunda kamu yararı gözetilerek alınacak tedbirlere ve düzenlemelere süresinde uymakla ve bunları uygulamakla yükümlüdür.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Ulusal Katkı Beyanında, net sıfır emisyon hedefi doğrultusunda ülkenin kalkınma öncelikleri ve özel koşulları göz önünde bulundurulur ve bu çerçevede önlemler alınır.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="Esaslar">
        <mvz-fıkra no="1">
          <template>Sera gazı emisyonlarının azaltımı ve iklim değişikliğine uyum faaliyetlerine ilişkin ilerlemeler yıllık bazda Başkanlıkça izlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanun kapsamında gerekli görülen tedbirlerin alınması amacıyla görev alanı dâhilinde; kurumlar arası koordinasyonu sağlamak, faaliyetleri ve standartları belirlemek, gelişmeleri izlemek, karbon fiyatlandırmasına ilişkin piyasaya dayalı mekanizmaları düzenlemekle Başkanlık yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu kurum ve kuruluşları ile gerçek ve tüzel kişiler; kendi yetki ve sorumlulukları çerçevesinde plan ve projeler yapar, yaptırır, uygular, destekler ve iş birliği yapar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>24/3/2016 tarihli ve 6698 sayılı Kişisel Verilerin Korunması Kanunu hükümleri saklı kalmak kaydıyla, Başkanlık; bu Kanunun uygulanmasına yönelik olarak gerekli gördüğü bilgi, belge ve veriyi; kamu kurum ve kuruluşları ile gerçek ve tüzel kişilerden doğrudan istemeye yetkilidir. Kendilerinden bilgi ve belge talebinde bulunulanlar; bunları istenilen sürede bedelsiz olarak Başkanlıkla paylaşmakla yükümlüdür. Başkanlık; kendi iş ve işlemleri için ihtiyaç duyduğu verileri de öncelikli olarak Ulusal Coğrafi Bilgi Platformundan temin eder. Temin ettiği veriler ile kendi ürettiği verileri de kamu kurum ve kuruluşları ile paylaşılmak üzere Ulusal Coğrafi Bilgi Platformuna aktarır. Başkanlık, Ulusal Coğrafi Bilgi Platformunda bulunmayan verileri ilgili kamu kurum ve kuruluşları ile protokol yaparak temin edebilir. Millî savunma ve millî güvenliğe ilişkin bilgi ve belgelerin paylaşılmasına dair usul ve esaslar Bakanlık ve ilgili bakanlık tarafından müşterek olarak belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu Kanunda Bakanlığa verilen yetkiler bakımından Bakanlık, sınırlarını açıkça belirlemek ve yazılı olmak kaydıyla gerektiğinde yetkilerini Başkanlığa devredebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>

  <mvz-kısım no="2-İKİNCİ" başlık="İklim Değişikliği ile Mücadele">
    <mvz-bölüm no="1-BİRİNCİ" başlık="İklim Değişikliği ile Mücadele Faaliyetleri">
      <mvz-madde no="5" başlık="Sera gazı emisyonlarının azaltım faaliyetleri">
        <mvz-fıkra no="1">
          <template>Sera gazı emisyonları; Ulusal Katkı Beyanı, net sıfır emisyon hedefi ve Başkanlık tarafından yayımlanan veya güncellenen strateji ve eylem planları doğrultusunda azaltılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ulusal Katkı Beyanında sektörel bazda belirtilen sera gazı emisyonlarının azaltım faaliyetleri, ilgili kurum ve kuruluşlara mevzuatla verilen görev ve sorumluluklar dâhilinde gerçekleştirilir. Ulusal Katkı Beyanında yer alan sektörel politikaların uygulanması ve hedeflere ulaşılması amacıyla ortaya çıkan ihtiyaçlar doğrultusunda bu maddedeki esaslar da dikkate alınarak ilgili kurum ve kuruluşların mevcut görev ve sorumlulukları gözden geçirilir. Bu kapsamda Bakanlığın ve ilgili kurumların görüşü alınarak Ulusal Katkı Beyanı ve net sıfır emisyon hedefi çerçevesinde ilgili kamu kurum ve kuruluşlarınca düzenleme yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlgili kamu kurum ve kuruluşları, orta ve uzun dönemli hedeflerini içeren planlama araçlarını sera gazı emisyonlarının azaltım faaliyetleri çerçevesinde; uyarlamak, hazırlamak, uygulamak, izlemek ve güncellemekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kurum ve kuruluşlar; net sıfır emisyon hedefi ve döngüsel ekonomi yaklaşımı ile uyumlu olacak şekilde, Ulusal Katkı Beyanında yer alan sektörlerde uygulanmak üzere enerji, su ve ham madde verimliliği, kirliliğin kaynağında önlenmesi, yenilenebilir enerji kullanımının artırılması, ürünlerin, işletmelerin, kurum ve kuruluşların karbon ayak izinin azaltılması, alternatif temiz veya düşük karbonlu yakıtların ve ham maddelerin kullanımı, elektrifikasyonun yaygınlaştırılması, temiz teknolojilerin geliştirilmesi ve kullanımının artırılması gibi azaltım önlemlerinin alınması, bu önlemlerin adil geçiş gereklilikleri gözetilerek uygulanması ile sıfır atık sisteminin kurulması, uygulanması ve izlenmesiyle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Net sıfır emisyon hedefinin sağlanmasına yönelik emisyonların dengelenmesi için orman, tarım, mera ve sulak alanlarda karbon yutağı kayıplarını engellemek üzere ilgili kurum ve kuruluşlarca tedbirler alınır, yutak alanların ve korunan alanların korunarak artırılması sağlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="İklim değişikliğine uyum faaliyetleri">
        <mvz-fıkra no="1">
          <template>Ulusal Katkı Beyanı, net sıfır emisyon hedefi ve Başkanlık tarafından yayımlanan veya güncellenen strateji ve eylem planları doğrultusunda; ilgili kurum ve kuruluşlarca iklim değişikliği ile ilişkili mevcut veya olası kayıp ve zararları önlemeye, riskleri en aza indirmeye veya fırsatlardan yararlanmaya yönelik uyum faaliyetleri gerçekleştirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ulusal Katkı Beyanında yer alan iklim değişikliğine uyum faaliyetleri, kurum ve kuruluşlara mevzuatla verilen görev ve sorumlulukları dâhilinde gerçekleştirilir. Ulusal Katkı Beyanında yer alan sektörel politikaların uygulanması ve hedeflere ulaşılması amacıyla ortaya çıkan ihtiyaçlar doğrultusunda bu maddedeki esaslar da dikkate alınarak ilgili kurum ve kuruluşların mevcut görev ve sorumlulukları gözden geçirilir. Bu kapsamda Bakanlığın ve ilgili kurumların görüşü alınarak Ulusal Katkı Beyanı ve net sıfır emisyon hedefi çerçevesinde ilgili kamu kurum ve kuruluşlarınca düzenleme yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlgili kamu kurum ve kuruluşları ulusal ve yerel ölçekte iklim değişikliğine uyumla ilgili planlama araçları ile etkilenebilirlik ve risk analizlerini; hazırlamak, hazırlatmak, hazırlanan bu araçları ve analizleri yatırım ve planlama faaliyetlerinde göz önünde bulundurmak ve bunları uygulamakla yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İklim değişikliğinin etkilerine karşı su kaynaklarının etkin yönetimini sağlamak üzere planlama araçları, ilgili kamu kurum ve kuruluşlarınca hazırlanır ve uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İlgili kamu kurum ve kuruluşları tarafından iklim değişikliğinin ekosistemlere ve biyolojik çeşitliliğe etkilerinin azaltılması ve sürdürülebilir ekosistem yönetimi için tedbirler alınır, denizel ve karasal korunan alanların muhafazası sağlanarak korunan alanların niteliği ve oranı yükseltilir ve iklim değişikliğinden etkilenen veya etkilenmesi muhtemel alanlarda arazi tahribatının dengelenmesi sağlanır. Çölleşme ve erozyonla mücadele ile ağaçlandırma ve toprak muhafaza kapsamında orman dışı alanlarda oluşturulan yutak alanların net sıfır emisyon hedefi doğrultusunda sürdürülebilir yönetimi sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>İlgili kamu kurum ve kuruluşları tarafından; tarım sektörünün sürdürülebilirliğini teminen iklim değişikliğine dirençli ürün deseni ile gıda güvenliğinin sağlanması hedefleri doğrultusunda; doğal kaynakların, ekosistemlerin ve biyolojik çeşitliliğin koruma kullanma dengesinin gözetilmesi ile ihtiyaç duyulan tekniklerin ve teknolojilerin yaygınlaştırılması suretiyle, tarım sektöründe ekosistem temelli uyum yaklaşımını, doğa temelli çözümleri ve su bütçesini dikkate alan planlama araçları geliştirilir ve buna uygun iklim değişikliğine dirençli uygulamalar yaygınlaştırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>İklim değişikliğine bağlı afetlerin neden olduğu kayıp ve zararların azaltılması amacıyla risk değerlendirme, izleme, bilgilendirme ve erken uyarı sistemleri; bütünleşik afet yönetimi esas alınarak geliştirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Planlama ve Uygulama Araçları">
      <mvz-madde no="7" başlık="Planlama araçları">
        <mvz-fıkra no="1">
          <template>Kurum ve kuruluşlarca hazırlanan plan, program, strateji, eylem planı ve sair politika belgelerinde; yeşil büyüme vizyonu ve net sıfır emisyon hedefi kapsamında iklim değişikliği ile mücadeleye yönelik Başkanlık tarafından yayımlanan strateji ve eylem planları ile bu Kanunda belirlenen esaslar dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İklim değişikliği strateji ve eylem planları; sera gazı emisyonlarının azaltımı ve iklim değişikliğine uyum faaliyetlerinin gerçekleştirilmesi amacıyla Başkanlık koordinasyonunda, ilgili kurum ve kuruluşların iş birliği ile dönemsel olarak ulusal ölçekte hazırlanır, uygulanır, uygulaması izlenir, değerlendirilir ve gerektiğinde ulusal veya bölgesel ölçekte güncellenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlin şartlarına uygun olarak strateji, eylem ve uygulama alanlarını belirlemek ve bunların uygulanmasını sağlamak üzere her ilde vali başkanlığında, ilgili kurum ve kuruluşların varsa il veya bölge teşkilat temsilcileri ile yerel yönetimlerin temsilcilerinden oluşan İl İklim Değişikliği Koordinasyon Kurulu kurulur. Kurulun sekretaryasını Bakanlık taşra teşkilatı yürütür ve Kurulun çalışma usul ve esasları Bakanlık tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yerel iklim değişikliği eylem planları; sera gazı emisyonlarının azaltımı ve iklim değişikliğine uyum amacıyla adil geçiş gereklilikleri gözetilerek her ilin bütüncül bir planı olacak şekilde vali koordinasyonunda; büyükşehirlerde büyükşehir belediyesi, diğer illerde il belediyesi ve il özel idaresi tarafından birlikte, ilgili kurum ve kuruluşların katılımıyla hazırlanır veya hazırlatılır ve karara bağlanmak üzere İl İklim Değişikliği Koordinasyon Kuruluna sunulur. Yerel iklim değişikliği eylem planlarının hazırlanması veya izlenmesi süreçlerinde, ilgili kurum ve kuruluşlar kendilerinden talep edilen belge, bilgi ve veriyi ilgili mevzuat hükümleri çerçevesinde paylaşır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sektörel etkilenebilirlik ve risk analizleri; strateji ve eylem planlarına esas teşkil etmek üzere iklim modelleri kullanılarak dönemsel olarak Başkanlık tarafından hazırlanır ve güncellenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Uygulama araçları">
        <mvz-fıkra no="1">
          <template>Bu Kanun kapsamında yer alan finansal araçlara ilişkin esaslar şunlardır:</template>
          <mvz-bent no="a">
            <template>Kurum ve kuruluşlarca iklim değişikliği ile mücadele amacıyla yapılacak faaliyetler ve yatırımlar için; iklim finansmanı ve iklim değişikliğiyle mücadele teşviki kaynaklarının geliştirilmesi, kullanılması, sigorta araçlarının geliştirilmesi, yeşil ve sürdürülebilir sermaye piyasası araçlarının, banka finansmanının ve diğer finansman araçlarının teşvik edilmesi esastır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Döngüsel ekonomi hedefleri ve sıfır atık uygulamaları çerçevesinde ürünlerin yeniden kullanımı, atıkların yan ürün, alternatif ham madde olarak kullanılması ve geri dönüşüm/geri kazanım ile elde edilen ürünlerin zorunlu kullanım oranlarının belirlenmesine yönelik çalışmalar ilgili bakanlıklarla koordineli olarak Bakanlık tarafından yapılır ve buna dair destek mekanizmaları geliştirilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bu Kanun kapsamında Başkanlık; ulusal, sektörel ve tematik raporlar hazırlar; finansal kaynakları iklim değişikliği ile mücadele yatırımlarına yönlendirmeyi kolaylaştırmak üzere iklim değişikliği teşvik mekanizmaları geliştirir, Türkiye Yeşil Taksonomisini kurar ve yürütür.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Türkiye Gümrük Bölgesinde ithal edilen malların gömülü sera gazı emisyonlarını ele almak için Sınırda Karbon Düzenleme Mekanizması kurulabilir. SKDM’ye ilişkin raporlama, kapsam, içerik, usul ve esaslar ilgili bakanlıklarla koordineli olarak Ticaret Bakanlığı tarafından belirlenir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanun kapsamında yer alan teknoloji araçlarına ilişkin esaslar şunlardır:</template>
          <mvz-bent no="a">
            <template>İlgili kurum ve kuruluşlarca hazırlanan planlama ve uygulama araçlarında teknolojik öz yeterlilik kapasitesinin artırılması öncelikli hedef olarak belirlenerek temiz teknolojilerin geliştirilmesi ve kullanımının yaygınlaştırılması esastır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başkanlık; karbon yakalama ve depolama teknolojileri, hidrojen teknolojisi gibi iklim değişikliği ile mücadeleye yönelik yeni teknolojik gelişmelerin takibi ile bu alanlardaki projelerin geliştirilmesi için ilgili kurumlarla iş birliği yapmaya, kurumların bu alanlarda çalışmalar yapmasını yönlendirmeye ve ilgili kurumlarla koordinasyon yapmaya yetkilidir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Başkanlığa bağlı ilgili kurumlarla koordineli olarak enstitüler ile araştırma ve uygulama merkezleri kurulabilir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanun kapsamında yer alan kapasite geliştirme araçlarına ilişkin esaslar şunlardır:</template>
          <mvz-bent no="a">
            <template>Kurum ve kuruluşlarca; kamuoyu farkındalığının artırılması ve toplumun iklim değişikliğinin etkileri konusunda duyarlı hâle getirilmesi için eğitim, bilinçlendirme ve kapasite geliştirme faaliyetleri gerçekleştirilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Tüm eğitim düzeylerinde müfredat ve öğretim programlarının güncellenmesi ve yeşil iş gücünün yetiştirilmesi için gerekli çalışmalar ilgili bakanlıklarla koordineli olarak Millî Eğitim Bakanlığı ve Yükseköğretim Kurulunca yapılır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddede belirtilen uygulamaların usul ve esasları, Bakanlık görüşü alınarak Ulusal Katkı Beyanı, uzun dönemli iklim değişikliği politika belgeleri ve belirlenen net sıfır emisyon hedefi doğrultusunda sorumlulukları dâhilinde ilgili kamu kurum ve kuruluşları tarafından belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Karbon Fiyatlandırma">
      <mvz-madde no="9" başlık="Emisyon Ticaret Sisteminin kurulması ve tahsisatların esasları">
        <mvz-fıkra no="1">
          <template>Başkanlık tarafından ETS kurulur, ulusal tahsisat planlaması hazırlanır ve tahsisatların dağıtımı yapılır. Bu kapsamda esneklik mekanizmaları ile piyasa istikrar mekanizmaları da geliştirilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Piyasa işletmecisi ETS piyasasını işletir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>ETS kapsamında esasları yönetmelikle belirlenen doğrudan sera gazı emisyonlarına neden olan faaliyetleri yürüten işletmelerin, bu faaliyetleri gerçekleştirebilmesi için Başkanlıktan sera gazı emisyon izni alması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yönetmelikle belirlenen usul ve esaslar kapsamında, sera gazı emisyon izninin geçerlilik süresi içerisinde tesisin niteliğinde veya işleyişinde gerçekleşen değişiklikler ile sera gazı emisyon izni sahibi gerçek veya tüzel kişilerde meydana gelecek değişiklikler neticesinde sera gazı emisyon izni Başkanlık tarafından güncellenir veya iptal edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>ETS kapsamına dâhil olan işletmeler tarafından doğrulanmış yıllık sera gazı emisyon değerine karşılık gelecek şekilde yıllık tahsisat tesliminde bulunulması zorunludur. Tahsisat teslim yükümlülüğünü yerine getirmeyen işletme, bir sonraki takvim yılına ilişkin tahsisatlarını teslim ederken 14 üncü maddenin dördüncü fıkrasının (c) bendinde belirtilen yaptırıma esas sera gazı emisyonlarına eşit miktarda tahsisatı da teslim etmekle yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>ETS kapsamında ücretsiz tahsisatlar, tarihsel emisyon verileri veya kıyaslama değerleri nispetinde sağlanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Ulusal tahsisat planları Resmî Gazete’de yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>ETS piyasasında işlem görecek tahsisatlara ilişkin iş ve işlemler 8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanunu hükümlerine tabi değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Tahsisatlar, teminat sözleşmelerine konu edilemez. Teslim yükümlülüğüne konu olan ücretsiz tahsisatlar ilk aktarıldığı işlem kayıt sistemindeki hesabından transfer edilmedikçe haczedilemez. Tahsisatların elektronik ortamda kayden ihracı ve bunlara ilişkin hakların hak sahipleri bazında izlenmesi zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Teslim yükümlülüğünü yerine getirme zamanından önce tesislerin faaliyetine son vermesi, işletmenin tasfiyesi, konkordato kararı alınmış olması teslim yükümlülüğünü yerine getirmesine engel teşkil etmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Bu Kanun kapsamında, mali uzlaştırma ile diğer mali işlemlere konu olan teminatlar ile oluşturulan temerrüt garanti hesabındaki varlıklar; amaçları dışında kullanılamaz, haczedilemez, rehnedilemez, idari mercilerin tasfiye kararlarından etkilenmez, iflas masasına dâhil edilemez ve üzerlerine ihtiyati tedbir konulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Görev, yetki ve sorumluluklar">
        <mvz-fıkra no="1">
          <template>Bu Kanunda ve diğer mevzuatta yer alan yetki ve sorumluluğa ilişkin hükümler saklı kalmak kaydıyla;</template>
          <mvz-bent no="a">
            <template>Karbon Piyasası Kurulu;</template>
            <mvz-altbent no="1">
              <template>Bakan başkanlığında; Çevre, Şehircilik ve İklim Değişikliği Bakanlığını, Enerji ve Tabii Kaynaklar Bakanlığını, Hazine ve Maliye Bakanlığını, Sanayi ve Teknoloji Bakanlığını, Ticaret Bakanlığını, Tarım ve Orman Bakanlığını, Ulaştırma ve Altyapı Bakanlığını temsilen birer bakan yardımcısı, Strateji ve Bütçe başkan yardımcısı, Sermaye Piyasası Kurulu Başkanı, Enerji Piyasası Düzenleme Kurumu Başkanı ve İklim Değişikliği Başkanından oluşur. Kurulun sekretaryasını Başkanlık yapar. Gerekli görüldüğü durumlarda, diğer kamu kurum ve kuruluşları, sivil toplum kuruluşları, meslek kuruluşları, üniversite ve özel sektör temsilcileri toplantılara oy hakkı olmaksızın davet edilebilir.</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Ulusal tahsisat planını onaylar, ETS piyasasında ücretsiz tahsisatların dağılımına karar verir, birincil piyasada satışa sunulacak tahsisat miktarını tespit eder, ETS kapsamında hangi oranda denkleştirme işlemlerinin kullanılabileceğine karar verir, ETS ile ilgili plan, politika, strateji ve eylemleri belirler; uluslararası karbon piyasasına konu olacak sektör, proje ve faaliyetleri tespit eder, ilgili sınırlamaları, ithal ve ihraca ilişkin temel politikayı belirler.</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Üye tam sayısının üçte iki çoğunluğu ile toplanır. Toplantı kararları açık oylama ve üye tam sayısının salt çoğunluğu ile alınır. Oyların eşit olması durumunda kurul başkanının kullandığı oy yönünde karar verilir.</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Danışma Kurulu; Türkiye Odalar ve Borsalar Birliği Başkanı başkanlığında; Müstakil Sanayici ve İşadamları Derneği, Türk Sanayicileri ve İşinsanları Derneği, Uluslararası Yatırımcılar Derneği, Türkiye İhracatçılar Meclisi, Dış Ekonomik İlişkiler Kurulu, Türkiye Bankalar Birliği, Türkiye Sigorta, Reasürans ve Emeklilik Şirketleri Birliği, Finansal Kurumlar Birliği, Türkiye Sermaye Piyasaları Birliği ve Türk Mühendis ve Mimar Odaları Birliği Çevre Mühendisleri Odasının karar alıcı düzeyde birer temsilcisi, Başkanlık temsilcisi ile gerektiğinde konusuna göre davet edilecek diğer kamu kurum ve kuruluşlarının, meslek kuruluşlarının, sivil toplum kuruluşlarının ve üniversitelerin birer temsilcisinden oluşur. Kurulun sekretaryasını Türkiye Odalar ve Borsalar Birliği yapar. Danışma Kurulu, ETS ve uluslararası karbon piyasası ile ilgili strateji ve eylemlere ilişkin istişari nitelikte kararlar alır. Bu kararları sekretarya, Karbon Piyasası Kuruluna sunulması amacıyla gerekçeleriyle birlikte Başkanlığa gönderir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Başkanlık; tahsisat süreçlerini yönetir, sera gazı emisyonlarının izleme, raporlama ve doğrulama sürecini yönetir, denkleştirme faaliyetlerini düzenler, karbon kredilerinin ETS kapsamında kullanımını belirler, uluslararası düzeyde karbon kredisi ithal etme ve ihraç etme konularında politika geliştirmeye ve karar vermeye yönelik iş ve işlemi yapar, diğer piyasalarla iş birliği yapar, ETS kapsamında karşılıklı tanıma anlaşmaları yapılması için plan ve politikaların belirlenmesi amacıyla çalışmalar yürütür.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Enerji Piyasası Düzenleme Kurumu; bu Kanun, 14/3/2013 tarihli ve 6446 sayılı Elektrik Piyasası Kanunu ile 20/2/2001 tarihli ve 4628 sayılı Enerji Piyasası Düzenleme Kurumunun Teşkilat ve Görevleri Hakkında Kanun uyarınca; ETS piyasası kapsamındaki piyasa bozucu davranışlara ilişkin piyasa gözetimi ve denetimine yönelik usul ve esasları Sermaye Piyasası Kurulunun görüşünü alarak belirler.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Piyasa işletmecisi; piyasalara ilişkin mali uzlaştırma işlemleri ile diğer mali işlemleri yürütür, piyasa bozucu davranışları Başkanlığa ve Enerji Piyasası Düzenleme Kurumuna bildirmekle yükümlüdür. Piyasa işletmecisi, tahsisatların ve emisyon ticaretine ilişkin Başkanlıkça ve Enerji Piyasası Düzenleme Kurumunca emisyon ticaretine ilişkin uygun görülen standartlaştırılmış diğer sözleşmelerin ETS piyasasında işlem görmesi için gerekli organizasyonu yapar ve piyasa işletmecisi görevlerini yerine getirir. Piyasa işletmecisi, tahsisatların ihracı, elde bulundurulması, transferi, iptali, itfası işlemlerinin yürütülmesi amacıyla işlem kayıt sistemini kurar, kaydi tahsisatları ve bunlara bağlı hakları elektronik ortamda hak sahipleri bazında kayden izler ve saklamasını yapar, kayıtların ilgili mevzuatta öngörülen çerçevede gizliliğini sağlar.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Merkezî uzlaştırma kuruluşu; ETS piyasasına ilişkin teminat yönetimi ve nakit takas faaliyetlerini yürütür.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Piyasa şeffaflığını sağlamak amacıyla ücretsiz tahsisat verileri, doğrulanmış yıllık sera gazı emisyon değerleri ve tesislerin tahsisat teslimat yükümlülüklerine ilişkin bilgiler Karbon Piyasası Kurulu kararı doğrultusunda kamuoyu ile paylaşılabilir. ETS piyasasında gerçekleştirilecek gözetim ve denetim faaliyetleri kapsamında Enerji Piyasası Düzenleme Kurumu ve piyasa işletmecisi tarafından talep edilecek bilgi ve belgeler bakımından 6446 sayılı Kanunun ilgili hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddede belirtilen uygulamalara, kapsama ve ETS’ye yönelik usul ve esaslar Başkanlık tarafından, bu usul ve esaslar doğrultusunda ETS piyasasının işleyişine ilişkin esaslar ise Bakanlık, Enerji ve Tabii Kaynaklar Bakanlığı ve Sermaye Piyasası Kurulu ile koordineli olarak Enerji Piyasası Düzenleme Kurumu tarafından belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Gönüllü karbon piyasaları ve denkleştirme">
        <mvz-fıkra no="1">
          <template>ETS kapsamında tahsisat yükümlülüklerinin bir bölümünün eşdeğer miktarda karbon kredisi ile karşılanması amacıyla denkleştirme yapılmasına izin verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>ETS ve gönüllü taahhütler kapsamında yapılacak denkleştirme işlemlerinde kullanılmak üzere, sera gazı emisyonlarının azaltımı veya giderim faaliyetleri ile yutak alanların artırılmasına yönelik faaliyetler aracılığıyla karbon kredisi üreten ulusal bir karbon kredilendirme ve denkleştirme sisteminin esasları Başkanlıkça belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddenin ikinci fıkrasında yer alan denkleştirme projelerine dair sunulan bilgi, belge ve verilerin hatalı/hileli olduğunun tespiti hâlinde, söz konusu denkleştirme miktarı tahsisat teslim yükümlülüğü için kullanılamaz ve tahsisat teslim yükümlülüğünün yerine getirilmemiş olduğu kabul edilir. Bu durumda proje sahibine 14 üncü maddenin dördüncü fıkrasının (c) bendinde belirtilen yaptırım uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddenin ikinci fıkrası kapsamında karbon kredilerinin kullanılması, üretimi ile ulusal karbon kredilendirme sisteminin kurulması ve uygulanmasına ilişkin esaslar Başkanlıkça belirlenir. Bu kapsamda ulusal standart ve metodolojilerin geliştirilmesi için ilgili kuruluşlarla iş birliği yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yurt içinde herhangi bir gönüllü karbon piyasasında ulusal veya uluslararası standartlarla karbon kredisi üretimine başlamış veya başlayacak olan yurt içinde gerçekleşen projelerin sahipleri; projelerini, Başkanlıkça belirlenen sürede karbon kredisi kayıt sistemine kayıt ettirmekle yükümlüdür. Başkanlık, bu madde kapsamında uluslararası standartları geliştiren kuruluşlarla iş birliği yapabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Gelirler, Yaptırımlar ve Çeşitli Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Gelirler ve Desteklerin Kullanımı">
      <mvz-madde no="12" başlık="Gelirler ve döner sermaye">
        <mvz-fıkra no="1">
          <template>Bu Kanunda belirlenen amaçlarda kullanılmak üzere aşağıda sayılan gelirler genel bütçenin (B) işaretli cetvelinde özel gelir olarak kaydedilir:</template>
          <mvz-bent no="a">
            <template>Sera gazı emisyon izni alınması kapsamında elde edilecek gelirler.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>ETS kapsamında birincil piyasadaki tahsisat satış gelirleri, piyasa istikrar mekanizması kaynaklı işlemlerden elde edilen gelirler.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Piyasa işletmecisinin ETS piyasasından elde ettiği gelirlerin yüzde ellisi.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Uluslararası karbon piyasalarında yetki verilen karbon kredileri için alınan katkı payları.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Bu Kanun kapsamında uygulanan idari para cezalarının yüzde ellisi.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel bütçenin (B) işaretli cetvelinde kaydedilen ve yukarıda sayılan gelirler karşılığı tutarların tamamı Başkanlık bütçesinde özel ödenek olarak öngörülür ve Başkanlık tarafından kullandırılır. Ödenek tutarını aşan gelir gerçekleşmeleri karşılığında ödenek eklemeye, ödenek kaydedilen tutarlardan yılı içinde harcanmayan kısımları ertesi yıl bütçelerine devren ödenek kaydetmeye Cumhurbaşkanı yetkilidir. Birinci fıkrada sayılan gelirlerin tahsili ve bütçede tahsis edilen ödeneklerin kullanımı ile ilgili usul ve esaslar Hazine ve Maliye Bakanlığı ile Strateji ve Bütçe Başkanlığının uygun görüşü üzerine Başkanlıkça çıkarılacak yönetmelik ile belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Başkanlık, döner sermaye işletmesi kurmaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Döner sermaye işletmesinin kuruluş sermayesi 10 milyon Türk lirasıdır. Anılan sermaye miktarını 5 katına kadar artırmaya Cumhurbaşkanı yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Döner sermaye işletmesinin faaliyet alanları, görevleri, gelirleri, giderleri, işleyişi, denetimi ve uygulamaya ilişkin usul ve esasları Hazine ve Maliye Bakanlığı ile Strateji ve Bütçe Başkanlığının uygun görüşüyle Başkanlık tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu maddede öngörülen gelirler, yeşil dönüşüm ve iklim değişikliğiyle mücadele amacı dışında kullanılamaz. Bu gelirlerin yüzde onuna kadar olan tutarı adil geçiş uygulamaları kapsamında yürütülecek faaliyetler için kullanılabilir. Bu kapsamda Başkanlık bütçesine özel ödenek olarak tahsis edilen kaynaklar münhasıran adil geçiş uygulamalarında kullanılmak üzere genel bütçe kapsamındaki idarelere özel ödenek şeklinde, merkezî yönetim kapsamındaki diğer idarelere ise ilgili mevzuatı çerçevesinde transfer edilebilir. Bu fıkra kapsamında diğer idarelere yapılan aktarmalar 10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununun 21 inci maddesi ve yılı merkezi yönetim bütçe kanununda düzenlenen ödenek aktarmalarına ilişkin sınırlamalara tabi değildir. Bu fıkra gereğince genel bütçe kapsamındaki idarelere aktarılan tutarlardan yılı içinde harcanmayan kısımları ertesi yıl bütçelerine devren ödenek kaydetmeye Cumhurbaşkanı yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Yeşil dönüşüm ve iklim değişikliği ile mücadele desteklerinin kullanımı">
        <mvz-fıkra no="1">
          <template>Türkiye’nin yeşil dönüşümünü ve iklim değişikliği ile mücadelesini desteklemek amacıyla; sera gazı emisyonlarının azaltımı veya iklim değişikliğine uyum potansiyeli yüksek olan iklim dostu yatırımlar ile yeşil büyümenin gerektirdiği araştırma, geliştirme ve sektörel teknolojik dönüşüm ihtiyacının karşılanmasına katkı sağlayan faaliyetlerin ve bu kapsamda uygulamaya konulan mekanizmaların desteklenmesi esastır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Karbon Piyasası Kurulu kararları doğrultusunda; ETS kapsamındaki sektörler başta olmak üzere bu Kanunda yer alan uygulamalara yönelik stratejik öncelikli sektörlerde faaliyet gösteren tüzel kişiler ile kamu kurum ve kuruluşlarının yeşil dönüşüm, iklim değişikliği ile mücadele ve adil geçiş desteklerini kullanması veya kullanımının teşvik edilmesi için uygun mekanizmalar oluşturulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kurum ve kuruluşların kendi mevzuatları çerçevesindeki gelirleri; iklim yatırımlarını yapmak, yaptırmak veya teşvik etmek ile iklim yatırımlarının risk algısını ve borçlanma maliyetlerini azaltmaya yönelik olarak sigortacılık araçlarının geliştirilmesini desteklemek, yeşil ve sürdürülebilir sermaye piyasası aracı ihraçlarını teşvik etmek, garanti temini ile hibe ve finansman maliyeti desteği de verebilecek şekilde finansal araçların geliştirilmesi ve bunların uygulanmasını desteklemek amacıyla ilgili kurum ve kuruluşların görevleri dâhilinde kullanılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yeşil dönüşüm ve iklim değişikliği ile mücadele desteklerinin kullanımında yıllara sari taahhütlerin stok tutarı; her yıl, bir önceki yıla ilişkin olarak 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi hükümleri uyarınca tespit ve ilan edilen yeniden değerleme oranında artırılmak suretiyle hesaplanan kesinleşmiş son dört yıl özel gelir gerçekleşme toplamının iki katını geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar; Hazine ve Maliye Bakanlığı ve Strateji ve Bütçe Başkanlığı ile ilgili kamu kurum ve kuruluşların görüşü alınarak Bakanlık tarafından belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Cezai Hükümler">
      <mvz-madde no="14" başlık="İdari nitelikteki yaptırımlar">
        <mvz-fıkra no="1">
          <template>Sera gazı emisyonlarının takibine ilişkin yasaklara veya sınırlamalara aykırı olarak;</template>
          <mvz-bent no="a">
            <template>Doğrulanmış sera gazı emisyonu raporunu süresi içerisinde sunmayanlara, 500.000 Türk lirasından 5.000.000 Türk lirasına kadar idari para cezası verilir. Bu bendin uygulanmasına ilişkin usul ve esaslar, tesislerin kurulu kapasitesine göre ihtiyatlı olarak hesaplanan yıllık emisyonu göz önünde bulundurularak yönetmelikle belirlenir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>ETS kapsamında olan işletmelere (a) bendindeki cezalar iki kat olarak uygulanır.</template>

        <mvz-fıkra no="2">

          <mvz-bent no="a">
            <template>Ozon tabakasını incelten maddeleri kullanan, ithal eden, ticaretini yapan ve piyasaya arz edenlere 2.500.000 Türk lirası,</template>

          <mvz-bent no="b">
            <template>Ozon tabakasını incelten maddeleri içeren ürünlere veya ekipmana bakım, onarım ve servis amaçlı hizmet veren gerçek ve tüzel kişilere 250.000 Türk lirası,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Ozon tabakasını incelten maddeleri içeren ürünlerin veya ekipmanın etiketlenmesi hükümlerine uymayanlara 120.000 Türk lirası,</template>

        </mvz-fıkra>
        <mvz-fıkra no="0">

        <mvz-fıkra no="3">
          <template>Florlu sera gazlarına ilişkin usul ve esaslara, yasaklara veya sınırlamalara aykırı olarak;</template>
          <mvz-bent no="a">
            <template>Florlu sera gazlarını kullanan, ticaretini yapan ve piyasaya arz edenlere 2.500.000 Türk lirası idari para cezası verilir ve 3 aydan 6 aya kadar Hidroflorokarbon Kontrol Belgesi verilmez.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Hidroflorokarbonları kotasız ve kotayı aşan miktarlarda ithal edenlere 1.000.000 Türk lirası idari para cezası verilir ve takip eden yıl, kotayı aşan miktar oranında kotasında kesintiye gidilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Florlu sera gazları içeren kapların ve ürünlerin veya ekipmanların etiketlenmesi hükümlerine uymayanlara 120.000 Türk lirası idari para cezası verilir.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Bildirim ve raporları veri tabanına süresi içerisinde girmeyen ya da verileri güncellemeyenlere 120.000 Türk lirası idari para cezası verilir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Florlu sera gazı içeren veya çalışması bu gazlara dayanan ekipmana müdahale eden gerçek ve tüzel kişilere 120.000 Türk lirası idari para cezası verilir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>ETS’ye ilişkin usul ve esaslara, yasaklara veya sınırlamalara aykırı olarak;</template>
          <mvz-bent no="a">
            <template>Sera gazı emisyonlarının takibine ilişkin mevzuat kapsamında doğrulanmış sera gazı emisyon raporunun zamanında sunulmaması durumunda, işlem kayıt sistemindeki hesaplarda yer alan tahsisatlar üzerinden teslim yükümlülüğünün ifası dışında işlem yapılması engellenir. Doğrulanmış sera gazı emisyon raporunun sunulmasıyla birlikte hesaplardaki engel kaldırılır. Raporun sunulması ile hesaplardaki engelin kaldırılması, idari para cezasının uygulanmasına engel teşkil etmez.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>ETS kapsamına dâhil olan işletmelerden sera gazı emisyon izni almadan faaliyet gösteren veya süresi biten veya iptal edilen sera gazı emisyon izni ile faaliyetlerine devam edenlerden;</template>
            <mvz-altbent no="1">
              <template>Doğrulanmış yıllık sera gazı emisyon raporu bulunan işletmelere, Başkanlığa son beş yıl içerisinde sunulan en yüksek emisyon değerine sahip raporda yer alan her bir ton karbondioksit eşdeğeri emisyon miktarı başına 5 Türk lirası,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Doğrulanmış yıllık sera gazı emisyon raporu bulunmayan işletmelere ise 1.000.000 Türk lirasından 10.000.000 Türk lirasına kadar idari para cezası verilir. Doğrulanmış sera gazı emisyon raporu bulunmayan işletmelere uygulanacak cezalarda sektör ve kapasite olarak doğrulanmış sera gazı emisyon raporu bulunan eşdeğer işletmelere göre değerlendirme yapılması esastır. Bu alt bendin hangi hâllerde ve hangi kapasitedeki tesise uygulanacağına ilişkin miktar ve esaslar Başkanlıkça çıkarılacak yönetmelikle belirlenir.</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="c">
            <template>ETS’ye ilişkin süresi içerisinde yükümlü olunan miktarda tahsisat tesliminde bulunmayanlara teslim edilmeyen her bir tahsisat için doğrulanmış sera gazı emisyon raporunun ait olduğu yılın son 3 ayına ait birincil piyasa ağırlıklı ortalama tahsisat fiyatı ile son 3 ayına ait ikincil piyasa ağırlıklı ortalama tahsisat fiyatının yüksek olanının 2 katı karşılığına denk gelecek şekilde idari para cezası uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>ETS kapsamındaki tahsisatlarını teslim etme yükümlülüklerini her yıl için en az %80 kadarını süresi içerisinde 3 yıl üst üste yerine getirmeyen işletmelerin sera gazı emisyon izni iptal edilir ve yeni sera gazı emisyon izni 3 aydan 6 aya kadar verilmez.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>11 inci maddenin beşinci fıkrasında belirtilen yükümlülüğü yerine getirmeyen proje sahiplerine, 120.000 Türk lirası idari para cezası verilir. İdari para cezası projenin kayıt yükümlülüğünü ortadan kaldırmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu Kanunda öngörülen bilgi, belge ve veri verme yükümlülüğünü yerine getirmeyen veya yanıltıcı beyanda bulunan gerçek kişilere ve özel hukuk tüzel kişilerine 170.000 Türk lirası idari para cezası verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu Kanuna tabi faaliyetler kapsamında, elektrik piyasası mevzuatının ilgili maddelerinin ihlali hâlinde Enerji Piyasası Düzenleme Kurumu tarafından 6446 sayılı Kanun ve ilgili mevzuat hükümleri çerçevesinde idari yaptırım uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Bu maddenin uygulanmasında 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanunu ile diğer kanunların fiilin suç oluşturması hâline ilişkin hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Bu Kanunda belirtilen idari para cezaları, bu cezaların verilmesini gerektiren fiillerin söz konusu cezaların ilgilisine tebliğ edildiği tarihten itibaren üç yıl içinde birinci tekrarında bir kat, ikinci ve müteakip tekrarında iki kat artırılarak verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Bu Kanun ve bu Kanun uyarınca yayımlanan yönetmeliklere aykırı davrananlara söz konusu aykırı faaliyeti düzeltmek için Bakanlıkça bir defaya mahsus olmak üzere ve bir yılı aşmamak koşuluyla süre verilebilir. Verilen süre sonunda aykırılık düzeltilmez ise faaliyet, aykırılık düzeltilene kadar Bakanlıkça kısmen veya tamamen durdurulur. Süre verilmesi ve faaliyetin durdurulması, bu Kanunda öngörülen idari para cezalarının uygulanmasına engel teşkil etmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Bu Kanun kapsamında her bir fiil için uygulanacak idari para cezası miktarı 50.000.000 Türk lirasını geçemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Denetim ve yaptırımlarda yetki">
        <mvz-fıkra no="1">
          <template>6446 sayılı Kanun hükümleri saklı kalmak kaydıyla, bu Kanunda yer alan yükümlülüklerin yerine getirilmemesinden kaynaklı olarak idari yaptırıma bağlanan fiillere ilişkin denetleme yetkisi Başkanlığa aittir. Yerinde inceleme ve denetim yapılması gereken durumlarda, gerekli görülmesi hâlinde denetleme, Başkanlığın ilgili birimleri ile iş birliği içerisinde Başkanlık adına Bakanlık taşra teşkilatı tarafından yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İlgililer; denetimlerde gerekli ortamın sağlanması ve istenilen tüm bilgi ve belgeler ile iklim değişikliğine neden olabilecek faaliyetlerle ilgili olarak, kullandıkları ham madde, yakıt, çıkardıkları ürün ve atıklar, emisyon miktarları, acil durum planları, izleme sistemleri ve sera gazı emisyon raporları ile diğer bilgi ve belgelerin talep edilmesi hâlinde Başkanlığa veya yetkili denetim birimine vermek, denetim esnasında her türlü kolaylığı göstermek veya yetkililerin yaptıracakları analiz ve ölçümlerin giderlerini karşılamak zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunda öngörülen idari yaptırım kararlarını verme yetkisi Başkanlığa aittir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="İdari yaptırımların uygulanması, tahsili ve kanun yolları">

          <template>Bu Kanunda öngörülen idari yaptırımların uygulanmasını gerektiren fiillerle ilgili olarak Başkanlıkça nitelikleri ve kapsamı yönetmelikle belirlenerek yetkilendirilen denetim elemanlarınca bir tutanak tanzim edilir. Bu tutanak Başkanlığa intikal ettirilir. Başkanlık, tutanağı değerlendirerek gerekli idari yaptırım kararını verir. İdari yaptırım kararı, 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümlerine göre Başkanlık tarafından ilgiliye tebliğ edilir.</template>

    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Çeşitli ve Son Hükümler">

        <mvz-fıkra no="2">
          <template>Bu Kanunda hüküm bulunmayan hâllerde, 9/8/1983 tarihli ve 2872 sayılı Çevre Kanununun, 5326 sayılı Kanunun, 6446 sayılı Kanunun, 4628 sayılı Kanunun ve diğer kanunların ilgili hükümleri niteliğine uygun düştüğü ölçüde uygulanır.</template>

          <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren 3 yıl içerisinde ETS kapsamı dâhilinde yer alacak işletmeler sera gazı emisyon izni almak zorundadır. Üç yıllık süre içerisinde işletmelerin; ETS kapsamında faaliyetlerine devam edebilmeleri için, bir kereye mahsus olmak üzere sera gazı emisyon izinlerinin olduğu kabul edilir. Gerekli görüldüğü takdirde Karbon Piyasası Kurulu kararı doğrultusunda Başkanlık; bu fıkrada yer alan süreyi, bitim tarihlerinden itibaren iki yıla kadar uzatmaya yetkilidir.</template>
