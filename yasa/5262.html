  <mvz-künye tür="kanun" no="562" başlık="ORGANİK TARIM KANUNU"
             tarih="1/12/2004" rgazete-tarih="3/12/2004" rgazete-sayı="25659"
             düstur-tertip="5" düstur-cilt="44" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; tüketiciye güvenilir, kaliteli ürünler sunmak üzere organik ürün ve girdilerin üretiminin geliştirilmesini sağlamak için gerekli tedbirlerin alınmasına ilişkin usul ve esasları belirlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, organik tarım faaliyetlerinin yürütülmesine ilişkin kontrol ve sertifikasyon hizmetlerinin yerine getirilmesi ve Bakanlığın denetim usul ve esasları ile yetki, görev ve sorumluluklara dair hususları kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen;</template>
        <mvz-bent no="a">
          <template>Bakanlık: Tarım ve Köyişleri Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Organik tarım faaliyetleri: Toprak, su, bitki, hayvan ve doğal kaynaklar kullanılarak organik ürün veya girdi üretilmesi ya da yetiştirilmesi, doğal alan ve kaynaklardan ürün toplanması, hasat, kesim, işleme, tasnif, ambalajlama, etiketleme, muhafaza, depolama, taşıma, pazarlama, ithalat, ihracat ile ürün veya girdinin tüketiciye ulaşıncaya kadar olan diğer işlemlerini,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kontrol ve sertifikasyon kuruluşu: Organik ürünün veya girdinin, üretiminden tüketiciye ulaşıncaya kadar olan tüm aşamalarını kontrol etmek ve sertifikalandırmak üzere Bakanlık tarafından yetki verilmiş gerçek veya tüzel kişileri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kontrol kuruluşu: Organik ürünün veya girdinin, üretiminden tüketiciye ulaşıncaya kadar olan tüm aşamalarını kontrol etmek üzere Bakanlık tarafından yetki verilmiş gerçek veya tüzel kişileri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Sertifikasyon kuruluşu: Tüm kontrolleri tamamlanmış organik ürün veya girdiyi, kontrol kuruluşunun yaptığı kontrol ve bu kontrole ilişkin bilgi ve belgeler ile gerek duyulan hallerde yaptıracağı analizlere dayanarak sertifikalandırmak üzere Bakanlık tarafından yetki verilmiş gerçek veya tüzel kişileri,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Yetkilendirilmiş kuruluş: Kontrol ve sertifikasyon kuruluşu, kontrol kuruluşu veya sertifikasyon kuruluşu olarak Bakanlık tarafından yetki verilmiş gerçek veya tüzel kişileri,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kontrol: Organik tarım faaliyetlerinin bu Kanuna uygun olarak yapılıp yapılmadığının belirlenmesi, düzenli kayıtların tutulması, sonuçların rapor edilmesi, gerek görülmesi halinde ürünün organik niteliğinin laboratuvar analizleri ile test edilmesini,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kontrolör: Kontrol ve sertifikasyon kuruluşu adına veya kontrol kuruluşu adına, organik tarım faaliyetlerinin her aşamasının ilgili mevzuata göre uygulanmasını kontrol etmek üzere Bakanlık tarafından yetki verilmiş gerçek kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Sertifiker: Kontrol ve sertifikasyon kuruluşu adına veya sertifikasyon kuruluşu adına, kontrolü tamamlanmış ürünün veya girdinin organik olduğunu onaylamak üzere Bakanlık tarafından yetki verilmiş gerçek kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Denetim: Organik tarım faaliyetlerinin, bu Kanuna uygun olarak yapılıp yapılmadığını tespit etmek amacıyla yetkilendirilmiş kuruluşlar, işletmeler ve müteşebbisler ile kontrolör ve sertifikerlerin, Bakanlık veya Bakanlık tarafından denetim yetkisi verilen kuruluşlarca yapılan her türlü denetimini,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>İşletme: Yetkilendirilmiş kuruluşun kontrolü altında, söz konusu kuruluşlarla sözleşme yapılmak suretiyle organik ürün üretilen, işlenen, depolanan ve pazarlanan yerleri,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Müteşebbis: Organik tarım faaliyeti yapan gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Sertifikasyon: Bütün kontrol yöntemlerinin uygulanması sonucu işletmenin, organik ürünün ve girdinin mevzuata uygun olarak belgelendirilmesini,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Sertifika: Bütün kontrol yöntemlerinin uygulanması sonucu işletmenin, organik ürünün ve organik girdinin mevzuata uygun olduğunu gösteren belgeyi,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Çalışma izni: Bu Kanuna göre çalışacak kontrolör, sertifikerler ile yetkilendirilmiş kuruluşlara Bakanlık tarafından verilen izni,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>Organik ürün: Organik tarım faaliyetleri esaslarına uygun olarak üretilmiş ham, yarı mamul veya mamul haldeki sertifikalı ürünü,</template>
        </mvz-bent>
        <mvz-bent no="r">
          <template>Organik girdi: Organik tarım faaliyetlerinde kullanılan materyali,</template>
        </mvz-bent>
        <mvz-bent no="s">
          <template>Organik ürün etiketi: Organik ürün veya ambalajı üzerinde yer alan, ürünü tanıtan veya içindekini belirten herhangi bir kelime, detay, ticarî marka, tescilli marka, paket üzerinde yer alan resim, sembol, doküman, ilân, tabela veya tasma gibi her türlü yazılı ve basılı bilgi ve materyali,</template>
        </mvz-bent>
        <mvz-bent no="t">
          <template>Organik ürün logosu: Nitelikleri ve kullanımı bu Kanun kapsamında çıkarılacak yönetmelikte tanımlanan basılı işareti,</template>
        </mvz-bent>
        <mvz-bent no="u">
          <template>Akreditasyon: Yeterliği onaylanmış kurum ve kuruluşlar tarafından; kontrol ve sertifikasyon kuruluşlarının, laboratuvarların ulusal ve uluslararası kabul görmüş teknik kriterlere göre değerlendirilmesini, yeterliğinin onaylanmasını ve düzenli aralıklarla denetlenmesini,</template>
        </mvz-bent>
        <mvz-bent no="v">
          <template>Organik: Bu Kanunda geçen organik kelimesi ekolojik ve biyolojik kelimeleriyle eşdeğer anlamı,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Komiteler, Yetkilendirilmiş Kuruluşlar ve Müteşebbis">
    <mvz-madde no="4" başlık="Komitelerin oluşumu, yetki, görev ve sorumlulukları">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında; organik tarımın geliştirilmesi yönünde çalışmalar yapmak ve Bakanlık içi koordinasyon ve değerlendirme hizmetleri ile yetkilendirilmiş kuruluşların, işletmelerin, müteşebbislerin, kontrolör ve sertifikerlerin faaliyetlerini izlemek üzere Bakanlık bünyesinde Organik Tarım Komitesi kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Organik tarımın ticaretini, tanıtımını, araştırmalarını ve diğer organik tarım faaliyet stratejilerini belirlemek ve Bakanlık dışı kurum ve kuruluşlarla koordinasyon ve izleme hizmetlerini yapmak üzere Organik Tarım Ulusal Yönlendirme Komitesi kurulur. Bu Komite; ilgili kamu kurum ve kuruluşları, meslek kuruluşları, sivil toplum örgütleri, üniversiteler ve özel sektör temsilcilerinden olmak üzere en az on kişiden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu komitelere bağlı olarak, yeter sayıda alt komite oluşturulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Organik Tarım Komitesi ve Organik Tarım Ulusal Yönlendirme Komitesinin oluşumu ve çalışma şekli ile ilgili usul ve esaslar Bakanlık tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Yetkilendirilmiş kuruluşlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında; organik tarım faaliyetlerinin her türlü kontrol ve sertifikalandırma işlemleri, Bakanlıkça veya Bakanlıkça yetkilendirilmiş kuruluşlarca yapılır. Yetkilendirilmiş kuruluşlar, yeterli ve tecrübeli personel ile teknik alt yapıya sahip olmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kontrol ve sertifikasyon kuruluşu veya sertifikasyon kuruluşu tarafından sertifikalandırılmamış ürünler, organik ürün veya organik girdi adı altında satılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kontrol ve sertifikasyon kuruluşu veya sertifikasyon kuruluşu organik olmayan tarımsal ürün ve girdilere, organik ürün veya organik girdi sertifikası veremez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yetkilendirilmiş kuruluşlar ile kontrolör ve sertifikerler, Bakanlıktan çalışma izni almak zorundadır. Yetkilendirilmiş kuruluşların çalışma izni bittiğinde, Bakanlıktan süre uzatımı almadan tekrar faaliyette bulunamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bakanlık tarafından verilen çalışma izni devredilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kontrol ve sertifikasyon kuruluşu, kontrol ve sertifikasyon olmak üzere iki ayrı birimden oluşur. Kontrol biriminde görev yapanlar sertifikasyon biriminde, sertifikasyon biriminde görev yapanlar da kontrol biriminde görev yapamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Yetkilendirilmiş kuruluşlar, bu Kanuna uygun olarak çıkarılacak yönetmelikte belirlenen dönemlerde Bakanlığa rapor vermek, bilgi ve belgelerini Bakanlık yetkililerine göstermek zorundadırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Yetkilendirilmiş kuruluşlar ile kontrolör ve sertifikerlerin; çalışma izni, izin süresi, süre uzatımı, izinlerinin iptali, görev ve yetkileri, yetki kullanımı, kontrol ve sertifikasyon sistemi ile kontrolör ve sertifiker çalıştırmaya ilişkin usul ve esaslar, Bakanlık tarafından çıkarılacak yönetmeliklerle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Müteşebbis">
      <mvz-fıkra no="1">
        <template>Müteşebbisler, yetkilendirilmiş kuruluş kontrolünde çalışmak zorunda olup, bu Kanun kapsamında Bakanlık tarafından çıkarılacak yönetmelik hükümlerine aykırı faaliyette bulunamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Müteşebbisler, kontrol veya denetim amacı ile Bakanlık yetkilileri ile Bakanlık tarafından yetkilendirilmiş kuruluşların yetkililerine; işletmeye giriş izni vermek ve muhasebe kayıtları ile diğer ilgili dokümanlarını göstermek zorundadırlar. Yetkilendirilmiş kuruluşlar, elde ettikleri bu bilgi ve belgeleri, Bakanlık dışında üçüncü şahıslara veremezler.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Uygulama Esasları">
    <mvz-madde no="7" başlık="Organik tarım faaliyetleri">
      <mvz-fıkra no="1">
        <template>Organik tarım faaliyetlerine ilişkin usul ve esaslar Bakanlık tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Orman sayılan yerlerde ürün toplanması ile ilgili usul ve esaslar, Çevre ve Orman Bakanlığının görüşü alınarak, Bakanlık tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hammaddesi tarımsal kaynaklı olan organik ürünlerden elde edilen nihai ürünlerin, imalat veya sanayi ürünü olması halinde, bu nihai ürünlerin üretilmesi ve tüketiciye ulaşıncaya kadar olan aşamalar ile ilgili usul ve esaslar Bakanlığın olumlu görüşü alınarak, ilgili bakanlıkça hazırlanacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Organik ürünlerin ve girdilerin reklam ve tanıtımı">
      <mvz-fıkra no="1">
        <template>Organik ürün ve girdilerin etiket ve logoları yalnızca organik ürünler ve girdiler için kullanılır. Organik ürünlerin ve girdilerin etiketi ve logosu, reklam ve tanıtımı; sahte, yanıltıcı veya ürünün yapısına, özelliklerine, içeriğine, kalitesine, orijinine ve üretim tekniklerine göre hatalı bir izlenim yaratacak, ürünün sahip olmadığı etki ve özelliklere atıfta bulunacak biçimde olamaz ve tüketiciyi yanıltacak yazı, resim, şekil ve benzerlerini içeremez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türkiye Cumhuriyeti sınırları içinde yayın yapan ulusal, bölgesel, yerel radyo ve televizyonların, üretici ve tüketicilerin bilinçlendirilmesi amacıyla organik tarımla ilgili ayda en az otuz dakika eğitici yayın yapmaları konusunda Radyo ve Televizyon Üst Kurulu gerekli tedbirleri alır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Organik ürünlerin ve girdilerin ihracatı">
      <mvz-fıkra no="1">
        <template>İhracat sertifikası olmayan organik ürün veya girdiler, organik ürün veya organik girdi adı altında ihraç edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İhraç edilen fakat alıcısı tarafından iade edilen ürün ve girdiler, mahrecine iade olarak kabul edilir. Söz konusu ürünler ve girdiler, ithalatta yapılan kontrol ve belgelerden muaf olup, gümrük idareleri tarafından sadece ayniyat tespiti yapılarak, ilgili mevzuat çerçevesinde yurda girişlerine izin verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Organik ürünlerin ve girdilerin ithalatı">
      <mvz-fıkra no="1">
        <template>İhracat sertifikası olmayan organik ürün veya girdiler, organik ürün veya organik girdi adı altında ithal edilemez. Gümrükler dahil yapılan kontrollerde, organik olmadığı tespit edilen ürün ve girdilerin, yurt içine organik ürün veya girdi adı altında sokulması, dağıtılması ve satışının yapılmasına izin verilmez. Bu ürün ve girdiler, sorumlu müteşebbise iade edilir ya da ilgili ulusal mevzuatına uygun olmaları halinde, yurt içinde organik olmayan ürün veya girdi olarak değerlendirilmesine izin verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Denetim">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında; yetkilendirilmiş kuruluşlar, işletmeler ve müteşebbisler ile kontrolör ve sertifikerlerin her türlü denetimi Bakanlık tarafından yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık gerekli gördüğü hallerde denetim yetkisini kısmen veya tamamen, akreditasyonu yapılmış; kamu kurum ve kuruluşlarına, özel sektör tüzel kişilerine ve üniversitelere devredebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Denetim hizmetlerinde çalışacak personelin yetki ve sorumlulukları ile hizmet içi eğitimine ilişkin usul ve esaslar, Bakanlık tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Ceza Hükümleri, Cezaların Tahsili ve İtiraz">
    <mvz-madde no="12" başlık="Ceza hükümleri">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine uymayanlara uygulanacak cezaî hükümler aşağıda belirtilmiştir:</template>
        <mvz-bent no="a">
          <template>5 inci maddenin ikinci fıkrasına aykırı hareket edenlere, onbin Türk Lirası idarî para cezası verilir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>5 inci maddenin üçüncü fıkrasına aykırı hareket ettiği tespit edilenlere, ellibin Türk Lirası idarî para cezası verilir. Fiilin tekrarı halinde, yetki ve izin belgeleri iptal edilir. Başka ad ve unvan altında olsa dahi, bu Kanun kapsamında çalışmalarına izin verilmez.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>5 inci maddenin dördüncü fıkrasına aykırı hareket edenlere, onbeşbin Türk Lirası idarî para cezası verilir. Fiilin tekrarı halinde, idarî para cezası iki katı olarak uygulanır ve kendilerine bir daha çalışma izni verilmez.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>5 inci maddenin beşinci fıkrasına aykırı hareket edenlere, yirmibin Türk Lirası idarî para cezası verilir. Fiilin tekrarı halinde, çalışma izinleri iptal edilir.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>5 inci maddenin altıncı fıkrasına aykırı hareket eden kuruluşlara, onbeşbin Türk Lirası idarî para cezası verilir. Fiilin tekrarı halinde, idarî para cezası iki katı olarak uygulanır ve çalışma izinleri iptal edilir.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>5 inci maddenin yedinci fıkrasına aykırı hareket edenlere, yirmibin Türk Lirası idarî para cezası verilir.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>6 ncı maddenin birinci fıkrasına aykırı hareket edenlere, onbin Türk Lirası idarî para cezası verilir.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>6 ncı maddenin ikinci fıkrasına aykırı hareket edenlere, yirmibin Türk Lirası idarî para cezası verilir.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>8 inci maddeye aykırı hareket edenlere, onbeşbin Türk Lirası idarî para cezası verilir. Aykırılık etiket bilgilerinden kaynaklanıyorsa, etiket bilgileri düzeltilinceye kadar ürüne el konulur ve yukarıdaki para cezası uygulanıp ürün piyasadan toplattırılır. Toplatma masrafları müteşebbisten tahsil edilir.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>9 uncu maddenin birinci fıkrası ile 10 uncu maddeye aykırı hareket edenlere, otuzbin Türk Lirası idarî para cezası verilir.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Bu Kanuna göre denetimleri engelleyen kişi ve kuruluşlara, onbin Türk Lirası idarî para cezası verilir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Cezaların tahsili ve itiraz">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yazılı olan idarî para cezaları, Bakanlık veya mahallî mülkî amir tarafından verilir.</template>
