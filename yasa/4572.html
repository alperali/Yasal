  <mvz-künye tür="kanun" no="4572" başlık="TARIM SATIŞ KOOPERATİF VE BİRLİKLERİ HAKKINDA KANUN"
             tarih="1/6/2000" rgazete-tarih="16/6/2000" rgazete-sayı="24081"
             düstur-tertip="5" düstur-cilt="39" />

  <mvz-madde no="1" başlık="Amaç, kuruluş ve sermaye">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı; tarım satış kooperatif ve birliklerine ilişkin hükümleri düzenlemek, bu kuruluşların kooperatifçilik ve kurumsal yönetim ilkelerine uygun olarak yönetilmelerini, özerk, güçlü ve bağımsız mali yapıyla piyasa koşullarında etkin, verimli ve sürdürülebilir bir şekilde faaliyet göstermelerini sağlamak ve tarım satış kooperatifçiliğini güçlendirmektir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Üreticiler; karşılıklı yardım, dayanışma ve kefalet suretiyle meslekî faaliyetleri ile ilgili ihtiyaçlarını sağlamak, ürünlerini daha iyi şartlarla değerlendirmek ve ekonomik menfaatlerini korumak amacıyla, aralarında sınırlı sorumlu, değişir sayıda ortaklı ve değişir sermayeli, tüzel kişiliği haiz tarım satış kooperatifleri kurabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bir tarım satış kooperatifinin kurulabilmesi için en az otuz üreticinin, bir tarım satış kooperatifleri birliğinin kurulabilmesi için en az üç tarım satış kooperatifinin bir araya gelmesi şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kooperatiflerin sermayeleri ortak üreticilerin; birliklerin sermayeleri ise ortak kooperatiflerin taahhüt edecekleri ortaklık paylarından oluşur. Ortaklık şartları, sermaye taahhüt oranı ve miktarları ile sermaye ödeme ve iadelerine ait usul ve esaslar örnek anasözleşmelerde gösterilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kooperatif ve birliklerdeki ortaklık payları rehin ve haciz edilemez. Ortaklık paylarının devri örnek anasözleşmede belirtilen şartlarla yapılabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Tanımlar">
    <mvz-fıkra no="1">
      <template>Bu Kanunda geçen;</template>
      <mvz-bent no="a">
        <template>Bakanlık: Sanayi ve Ticaret Bakanlığını,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Ortak: Kooperatifler açısından üretici ortaklarını, birlikler açısından bağlı kooperatifleri,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Kooperatif: Tarım satış kooperatiflerini,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Birlik: Tarım satış kooperatifleri birliklerini,</template>
      </mvz-bent>
      <mvz-bent no="e" durum="mülga">
        <template></template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>ifade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Çalışma konuları ve çalışmalarda uyulacak esaslar">
    <mvz-fıkra no="1">
      <template>Kooperatif ve birlikler; ortakların ve gerektiğinde diğer üreticilerin ürünlerinin daha iyi şartlarla değerlendirilmesi, mesleki faaliyetleri ile ilgili ihtiyaçlarının karşılanması ve ekonomik menfaatlerinin korunması konularında çalışırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kooperatif ve birliklerin çalışma konuları ile ürün alım ve değerlendirme işlemlerine, ürün alım bedelini hesaplama ve ödeme şekline, kredi kullanmalarına, yatırımlarına, gelir-gider farklarının dağıtımına ve giderlerin paylaşımına ilişkin usul ve esaslar örnek anasözleşmede gösterilir. Anasözleşmeyle, ortaklara elde ettiği ürünün tamamını veya belirli bir kısmını teslim etme ya da teslim edilmesi zorunlu asgari ürün miktarı şartı getirilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kooperatif ve birliklerin birbirleri ve ortakları ile üretim girdisi temini ve ürünlerin değerlendirilmesi amacıyla yaptıkları her türlü muameleden borsa tescil ücreti alınmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kooperatif ve birlik organları ile temsile yetkili personeli, tüm faaliyet ve kararlarında, iş ve işlemlerinde genel kabul görmüş rasyonel işletmecilik uygulamaları ile kurumsal yönetim ve kooperatifçilik ilkelerini dikkate alır, bu kuruluşların kuruluş amaçları doğrultusunda hareket eder; varlıklarını, mali yapısını ve rekabet gücünü koruyup geliştirme yönünde gerekli titizliği gösterir ve basiretli bir tacir gibi davranırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu Kanunda açıkça belirtilen nisaplar saklı kalmak üzere, birlik ve kooperatiflerde toplantı ve karar nisapları örnek anasözleşmede düzenlenir. Taşınmaz alım ve satımı ile imalat ve inşaat işlerinin yaptırılma yöntemi örnek anasözleşmede düzenlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bakanlık, kanunların emredici hükümlerine ve bu Kanunun amacına aykırı olmamak şartıyla, bu Kanunda örnek anasözleşmeyle düzenleneceği belirtilen hususlar ile kooperatif ve birliklerin çalışmalarına ilişkin gerekli gördüğü konularda düzenleme yapmaya ve kurumsal yönetim ilkeleri belirlemeye yetkilidir. Kooperatif ve birlikler, Bakanlık tarafından istenilecek bilgi ve belgeleri doğru, eksiksiz ve süresi içinde vermekle; oluşturulan elektronik veri tabanlarına Bakanlıkça istenen verilerin girişini sağlamakla yükümlüdür.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Organlar, temsil, genel müdürlük ve personel">
    <mvz-fıkra no="1">
      <template>Birlik ve kooperatif organları genel kurul ve yönetim kuruludur. Yönetim kurulu asıl ve yedek üyeleri genel kurulca seçilir. Birliklerde genel müdür, kooperatiflerde ise müdür veya vekilleri yönetim kurulunun doğal üyesidir. Genel müdür dışındaki birlik yönetim kurulu üyelerinin en az ikisi dört yıllık yükseköğretim kurumlarından mezun ve örnek anasözleşmede belirtilen niteliklere sahip kişiler arasından seçilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Genel kurul toplantılarına katılma hakkına sahip ortaklarda aranan şartlar ile birliklerin genel kurullarını teşkil eden kooperatiflerin temsilcilerinin sayısı, nitelikleri, görev süreleri ve seçilme esasları, kooperatif ve birlik yönetim kurulu üyelerinin sayısı ve bu üyelerde aranan şartlar örnek anasözleşmede belirlenir. Yönetim kurulu üyelerinin görev süresi en fazla dört yıl olup süresi dolan yönetim kurulu üyelerinin görevleri, altı ayı geçmemek üzere, yapılacak ilk genel kurul toplantısına kadar devam edebilir. Görev süresi sona erenler yeniden seçilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yönetim kurulu ayda bir kez olağan olarak toplanır. Kooperatif ve birlik işlerinin zorunlu kıldığı durumlarda, gerekçeli olarak, olağanüstü toplanabilir. Yönetim kurulu üyelerine ayda en fazla iki toplantı için huzur hakkı ve harcırah ödenebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Haklarında 24/4/1969 tarihli ve 1163 sayılı Kooperatifler Kanununda sayılan ve göreve seçilmelerine engel teşkil eden suçlar veya görevi kötüye kullanma suçu nedeniyle adli makamlarca dava açılması, Bakanlıkça 1163 sayılı Kanunun 90 ıncı maddesi gereği görevlerine tedbiren son verilmesi, bu Kanunun 5 inci maddesi kapsamında yapılan denetim sonucunda düzenlenen raporda ibra edilmemeleri yönünde görüş belirtilmesi veya genel kurula katılma hakkına sahip olanların beşte üçünün gündem maddelerinin görüşülmesine geçilmeden önce yazılı olarak talepte bulunması halleri dışında, yönetim kurulu üyelerinin görev süreleri dolmadan azli ve yerlerine yenilerinin seçilmesi ile ilgili hususlar, genel kurul toplantısı gündemine alınıp görüşülemez. Yukarıdaki hususların varlığı halinde ise, yönetim kurulu üyelerinin azli ve yerlerine yenilerinin seçilmesine ilişkin kararlar, hazırun cetvelinde imzası bulunanların yarıdan fazlasının oyuyla alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Birlik yönetim kurulu, karar organı olarak kanun, anasözleşme ve genel kurul kararları doğrultusunda birlik faaliyetlerinin yürütülmesine ilişkin ilke ve esasları saptar, yıllık iş programları, politika ve stratejiler ile personel politikasını belirler, iş ve işlemlerin bunlara uygun yürütülmesini gözetir, genel kurul ve yönetim kurulu kararlarının yerine getirilmesini denetler ve açıkça genel kurulun yetkisinde tanımlanan hususlar dışında birliğin işletme konusunun ve amacının gerçekleştirilmesi için gerekli olan kararları alır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Birliklerin işleri kanun, anasözleşme ve diğer mevzuat hükümleri ile genel kurul ve yönetim kurulu kararlarına uygun olarak, genel müdürün yönetim ve koordinasyonunda genel müdürlük tarafından yürütülür. Birlik genel müdürü, birlik faaliyetlerinin yönetilip yönlendirilmesinden sorumlu olup; kanun, anasözleşme, genel kurul ve yönetim kurulu kararları ile yıllık iş programları, politika ve stratejik hedefler doğrultusunda birlik faaliyetlerinin yürütülmesi için uygun idari yapıyı oluşturur, yönetir ve yönlendirir, yönetim kurulu tarafından belirlenen politikalar çerçevesinde ürün alım ve değerlendirme faaliyetlerini koordine eder ve personel planlaması yapar. Birliğin iş programı, politika ve stratejilerini hazırlar ve yönetim kurulu kararına sunar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Birlik genel müdürü ve varsa genel müdür yardımcıları, en az dört yıllık yükseköğretim kurumlarından mezun, kamu kurum ve kuruluşlarında ya da kooperatif ve birliklerde veya özel kuruluşlarda yönetim, pazarlama, ürün ticareti, denetim, finansman veya bu kuruluşların faaliyet konularında en az sekiz yıl çalışmış, 1163 sayılı Kanunda sayılan ve yönetim kurulu üyelik görevine seçilmeye engel teşkil eden suçlar veya görevi kötüye kullanma suçu nedeniyle mahkum olmayan kişiler arasından yönetim kurulunca atanır. Birlik genel müdürü ve genel müdür yardımcıları, yönetim kurulu tarafından birliğin amaç ve faaliyet konularının zorunlu kıldığı makul, kabul edilebilir ve objektif gerekçelere dayanılarak görevden alınabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Kooperatiflerin işleri kanun, anasözleşme ve diğer mevzuat hükümleri ile genel kurul ve yönetim kurulu kararlarına uygun olarak müdürler tarafından yürütülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Kooperatif ve birliklerde temsil yetkisinin kimler tarafından ve ne şekilde kullanılacağı örnek anasözleşmede gösterilir. Ancak, bu kuruluşları taahhüt altına koyabilmek için örnek anasözleşmede belirtilen imzaya yetkili kişilerden en az ikisinin müşterek imzaları ve bu müşterek imzalardan birinin, birliklerde genel müdüre, kooperatiflerde ise müdüre veya bulunmadığı durumlarda vekillerine ait olması şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Kooperatif ve birliklerde istihdam edilen müdür ve diğer personelde aranan şartlar ile atama, nakil, terfi, görevden alma, kadro ve özlük hakları ile sair esaslar, birlik yönetim kurulunca hazırlanan ve genel kurulca kabul edilen yönetmelikte gösterilir. Birlik ortağı olmayan kooperatiflerde söz konusu yönetmelik, yönetim kurulu tarafından hazırlanır ve genel kurulun onayı ile yürürlüğe girer. Kooperatiflerde müdürün en az dört yıllık yükseköğretim kurumlarından mezun olması şarttır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Bağımsız denetim ve alınması gereken tedbirler">
    <mvz-fıkra no="1">
      <template>Bakanlıkça ortak sayısı ve ciro gibi kıstaslar dikkate alınarak belirlenen birlikler, 13/1/2011 tarihli ve 6102 sayılı Türk Ticaret Kanununun ilgili hükümlerine göre bağımsız denetime tabidir.  Bağımsız denetim kapsamı dışında kalan birlikler ile kooperatifler 1163 sayılı Kanunun 69 uncu maddesi hükümlerine göre denetlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yönetim kurulu, doğrudan ya da Bakanlıkça yapılan denetim veya bu madde kapsamında yapılacak denetim sonucunda bir görüş olarak bildirilmiş ise, birlikte ve bir birliğe bağlı olmayan kooperatiflerde üst üste üç dönemin menfi gelir-gider farkı ile sonuçlanması veya her hâlükârda menfi gelir-gider farkının toplam aktif değerlerin yüzde onuna tekabül etmesi veya borç ödemede ve giderlerin karşılanmasında sorun yaşanması durumlarında, birlik ve ortak kooperatiflerin veya kooperatifin varlığını, gelişmesini ve devamını tehlikeye düşüren sebeplerin erken teşhisi, gerekli önlemlerin alınması ve riskin yönetilmesi amacıyla derhal uzmanlardan bir komite kurmak ve komitenin sağlıklı bir şekilde çalışmasını sağlamak üzere her türlü tedbiri almakla yükümlüdür. Uzman komitesi raporu, düzenlenmesini takip eden ilk genel kurul toplantısında, gündemde olmasa bile ayrı bir gündem maddesi olarak görüşülür. Genel kurulda, birlik veya kooperatifin varlığını ve faaliyetlerini geliştirip sürdürmesi için gerekli telafi edici tedbirlere ilişkin kararların alınması zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Birlik, denetim sonuçlarını da gözeterek, etkinliği ve verimliliği azalmış veya varlıklarının yarısı karşılıksız kalmış ortak kooperatiflerden durumlarının düzeltilmesini ister ve iki yıldan fazla olmamak üzere verilen sürede bir başka kooperatifle birleşme dahil, gerekli tedbirleri almayan kooperatifleri ortaklıktan çıkarır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kooperatifler, bağlı bulundukları birliğin mevzuata, anasözleşmelere ve genel kabul görmüş kooperatifçilik ve kurumsal yönetim ilkelerine aykırı olmamak koşuluyla faaliyet konularıyla ilgili olarak belirleyeceği ilke ve esaslara uymak ve uygulamak zorundadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Muafiyet ve istisnalar">
    <mvz-fıkra no="1">
      <template>Bu Kanuna göre kurulmuş bulunan kooperatifler ve birliklerin faaliyetlerinde;</template>
      <mvz-bent no="a">
        <template>Kooperatife ortak olmak üzere başvuran üreticilerle ortakların, kooperatifleriyle yapacakları her türlü işlemleri ve bunlarla ilgili kâğıt, belge, senet, beyanname, taahhütname, vekâletname, makbuz, kooperatif lehine yapacakları ipotek ve rehinler her türlü vergi, resim ve harçtan,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Ortak içi işlemler sonucu ortaya çıkan olumlu gelir gider farkları gelir ve kurumlar vergisinden,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Birbirlerinden ve ortaklarından aldıkları faiz ve komisyonlar, birbirleri ya da üçüncü şahıslarla yaptıkları her türlü gayrimenkul alım satımı (üçüncü şahıslara terettüp eden vergi, resim ve harçlar hariç), ayrıca üretim tesislerinin ve bu tesislere ilişkin gayrimenkullerin satışı, bağış ve diğer ivazsız iktisapları ile bütün işleri için düzenlenecek senet, beyanname, taahhütname, sözleşme, vekâletname ve lehlerine yapılacak ipotek ve rehinler kurumlar vergisi ve damga vergisi de dahil olmak üzere her türlü vergi, resim ve harçtan,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Sermaye ve yedek akçeleri ile taşınmaz malları ve bunların gelirleri, ihtiyaçları için satın aldıkları ve alacaklarını tahsil gayesiyle mülk edindikleri taşınmaz malları ve bunların bir önceki sahiplerine geri verilmesi işlemi ile gayrimenkullerine ilişkin her nev’i cins, kayıt, tashih, ifraz, taksim, birleştirme ve ruhsatlandırma işlemleri, depo, hizmet ve üretim tesisi inşaatları her türlü vergi, resim ve harçtan,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Yapacakları kredi işlemlerine ve temin edecekleri kredilere ilişkin senet, beyanname, taahhütname, sözleşme ve sair her türlü belge ile taşınmaz mallarına ait ipotek ve ipotek fekki, taşınır mallara ait rehin ve rehnin kaldırılması işlemleri, vekâletnameler, taahhütnameler ve sair evrak her türlü vergi, resim ve harçtan,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Ortakların kooperatiflerine ödedikleri sermaye paylarının çıkma ve çıkarılma hallerine bağlı olarak kendilerine iadesi sırasında, anasözleşmelerde gösterilen esaslara göre hesaplanacak iade tutarı ile ödenmiş sermaye payı tutarı arasında üretici lehine doğacak kazançlar gelir vergisinden, kooperatif ve birlikler açısından da kurumlar vergisinden,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Kooperatif veya birliklere yapılan bağışlar, ortaklardan yapılacak kesintilerden oluşturulacak fonlar, dağıtılan ya da dağıtılmayarak kooperatif faaliyetlerinde kullanılan risturna tabi gelirler, gelir ve kurumlar vergisinden,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Kooperatif ve birliklerin defter ve belgelerinin notere tasdik ettirilmesi işlemleri yalnızca noterlik ücretine tabi olup, vergi, resim ve harçtan,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>müstesnadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Gelir Vergisi Kanununa göre yapılacak tevkifat hükümleri ile katma değer vergisi hükümleri saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ancak, bu kuruluşların ortak dışı işlemlerden elde edecekleri gelir-gider farkları ayrı bir hesapta takip ve tespit edilerek vergi kanunları hükümlerine göre vergilendirilir. Kooperatif ve birliklerin ortaklarından aldıkları ürünleri, niteliğinde değişiklik olmayacak şekilde ilk işleme tesislerinde işleyerek üçüncü kişilere satmaları ortak içi işlem sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Örnek anasözleşmeler">
    <mvz-fıkra no="1">
      <template>Kooperatif ve birliklerin örnek anasözleşmeleri, birliklerin görüşü alınarak Bakanlıkça hazırlanır. Bakanlıkça, bu Kanunda açıkça örnek anasözleşmelerde düzenleneceği belirtilen hususlara ilişkin hükümlerde, birliklerin görüşü de alınarak doğrudan veya birliklerin yarıdan bir fazlasının yönetim kurullarının bu konudaki müşterek isteği ve Bakanlığın oluru ile değişiklik yapılabilir. Birliklerin yarıdan bir fazlasının müştereken değişiklik için başvurması halinde, Bakanlık başvuruyu en geç üç ay içinde değerlendirerek sonuçlandırır. Anasözleşmelerin diğer hükümlerindeki değişiklikler genel usullere göre yapılır. Örnek anasözleşmeler, ürün gruplarına göre de hazırlanabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kooperatif ve birlikler, yönetim kurulu kararıyla anasözleşmelerinin örnek anasözleşme değişikliklerine intibakını sağlar ve tescile tabi hususları karar tarihinden itibaren bir ay içinde ticaret siciline tescil ettirerek Bakanlığa bildirir. Anasözleşme intibakı ilk genel kurulda ortakların bilgisine sunulur. Anasözleşmelerini en çok altı ay içinde intibak ettirmeyen kooperatif ve birlikler dağılmış sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Yürürlükten kaldırılan, uygulanacak ve uygulanmayacak hükümler">
    <mvz-fıkra no="1">
      <template>21.10.1935 tarihli ve 2834 sayılı Tarım Satış Kooperatifleri ve Birlikleri Hakkında Kanun, 30.4.1985 tarihli ve 3186 sayılı Tarım Satış Kooperatifleri ve Birliklerinin Kuruluşu Hakkında Kanun Hükmünde Kararnamenin Değiştirilerek Kabulüne Dair Kanun ile bu Kanunda ek ve değişiklikler yapan kanunlar ve 25.12.1969 tarihli ve 1196 sayılı Tütün Tarım Satış Kooperatifleri ve Bölge Birlikleriyle Türkiye Tütün Tarım Satış Kooperatifleri Genel Birliği Kanunu yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun, 24.4.1969 tarihli ve 1163 sayılı Kooperatifler Kanununun ayrılmaz bir parçası olup, tarım satış kooperatif ve birlikleri hakkında sırasıyla, bu Kanun, bu Kanunda açıkça örnek anasözleşmelerde düzenleneceği belirtilen hususlarda örnek anasözleşmeler, 1163 sayılı Kooperatifler Kanunu ve 29.6.1956 tarihli ve 6762 sayılı Türk Ticaret Kanununun anonim şirketlerle ilgili hükümleri uygulanır.  Ancak, her halde 1163 sayılı Kanunun 45 inci maddesinin altıncı ve yedinci fıkraları, 55 inci maddesinin üçüncü fıkrası ve ek 5 inci maddesi hükümleri bu Kanuna tabi kooperatif ve birlikler hakkında da uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>17.7.1964 tarihli ve 506 sayılı Sosyal Sigortalar Kanununun ek 24 üncü maddesi ve bu Kanun kapsamındaki kooperatif ve birliklerin denetim kurulu üyeliklerine Devlet memurları arasından seçilenler için 14.7.1965 tarihli ve 657 sayılı Devlet Memurları Kanununun 28 inci maddesi hükümleri bu görevlere münhasıran uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>18/11/1960 tarihli ve 132 sayılı Türk Standardları Enstitüsü Kuruluş Kanununun 11 inci maddesinin birinci fıkrasının (B) bendi kooperatif ve birlikler hakkında uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici" durum="mülga">
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template></template>
      <mvz-bent no="a">
        <template>Tarım Satış Kooperatif ve Birliklerinin 1.5.2000 tarihi itibarıyla Destekleme ve Fiyat İstikrar Fonuna olan borçlarından, Tarım Satış Kooperatif ve Birliklerinin yeniden yapılandırma sürecinde, Yeniden Yapılandırma Kurulunun önerileri doğrultusunda tasfiyesi uygun görülenler ile bu borçların tasfiyesine kadar geçecek süre içinde doğacak faizin terkin edilmesine, Hazine Müsteşarlığının bağlı olduğu Bakanın teklifi üzerine Maliye Bakanı yetkilidir.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Türkiye Cumhuriyeti Ziraat Bankası Anonim Şirketi tarafından 99/13288 sayılı Bakanlar Kurulu Kararı uyarınca Tarım Satış Kooperatif ve Birliklerine Destekleme ve Fiyat İstikrar Fonu koşullarında kullandırılan ve 2001/2312 sayılı Bakanlar Kurulu Kararı uyarınca Hazine kaynağına dönüşen kredilerden birliklerin yeniden yapılandırılma sürecinde tasfiyesi uygun görülenlerin "tasfiye tarihi itibarıyla kaydi bakiyesinin" terkin edilmesine Hazine Müsteşarlığının bağlı olduğu Bakanın teklifi üzerine Maliye Bakanı yetkilidir.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Tarım Satış Kooperatif ve Birliklerinin 1.5.2000 tarihinden önce mevcut özel bünye faaliyetleri ile ilgili banka borçları, birliklerin yeniden yapılandırma sürecinde Yeniden Yapılandırma Kurulunun önerileri dikkate alınarak Hazine tarafından söz konusu borçların, hangi miktar ve koşullarda üstlenileceğine ve 28.3.2002 tarihli ve 4749 sayılı Kanun ve ilgili yıl bütçe kanunu hükümleri çerçevesinde üstlenilecek borçların tasfiye edilmesine ilişkin esas ve usuller Bakanlar Kurulunca belirlenir.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu maddenin yayımı tarihi itibarıyla kooperatif ve birliklerin kesinleşmiş en son bilançolarındaki açıkları yedek akçelerden ve fonlardan karşılanamadığı takdirde, bu bilanço açıklarını kapatmak üzere ve bilanço açıklarıyla sınırlı olmak kaydıyla ortaklara, en fazla sermaye taahhüt tutarları kadar, ek ödeme yükümlülüğü getirilir. Ek ödeme yükümlülüğü, ortaklığın çıkma veya çıkarılma nedeniyle sona ermesi hallerinde ödenecek sermaye paylarından düşülür ve ödenmiş sermaye payını aşan ek ödeme tutarı tahsil edilir. Ölüm nedeniyle ortaklık sona ermiş ise, ek ödeme yükümlülüğünün tahsili iade edilecek sermaye payı ile sınırlı tutulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ortak başına tekabül eden ek ödeme tutarı; bilanço açığı, değişken ve sabit giderler, ortakların teslim ettikleri ürün miktarları ve ortak sayısı gibi kriterler gözetilerek örnek anasözleşmede belirlenecek usul ve esaslara göre hesaplanır. Bu şekilde hesaplanan ek ödeme tutarları, her yıl, yine örnek anasözleşmede belirlenen usul ve esaslara göre güncellenir. Ek ödemelerin tahsili bu güncel tutarlar üzerinden yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ek ödeme tutarları kooperatif ve birlik gelir hesapları ile ilişkilendirilmeksizin bilançonun pasifinde özel bir fon hesabında izlenir ve bu fon hesabında izlenen tutarlar kooperatif ve birliklerin bilanço açıklarının kapatılmasında kullanılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Birliklerin 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun kapsamında takip edilenler de dahil olmak üzere, 1/5/2000 tarihinden sonra Destekleme ve Fiyat İstikrar Fonu Gider Hesabından ilgili mevzuat uyarınca kullandıkları krediler ile bu kredilere banka cari faizi veya TEFE/ÜFE aylık değişim oranından düşük olanı basit usulde uygulanmak suretiyle hesaplanarak eklenecek tutarın, bu maddede belirtilen hükümler uyarınca ödenmesi şartıyla, söz konusu kredilere ilişkin olarak bu maddenin yayımı tarihine kadar uygulanan faiz, cezai faiz, gecikme faizi, gecikme zammı gibi fer’i alacakların tamamının tahsilinden vazgeçilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tahsilinden vazgeçilen tutarlar birlikler tarafından kurum kazancına dahil edilmez, bilançonun pasifinde özel bir hesapta izlenir ve bu hesapta izlenen tutarlar, birliğin gelir-gider menfi farklarından mahsup edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yeniden yapılandırmaya konu edilecek anapara tutarının belirlenmesinde, her bir birliğin muhtelif tarihlerde kullandığı ve bakiyesi bulunan kredi toplamından, varsa yapılan ödemeler düşüldükten sonra elde edilecek tutar esas alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yeniden yapılandırmadan faydalanılabilmesi için ilgili birlik tarafından 6183 sayılı Kanun kapsamında takip edilen borçlar için ilgili vergi dairelerine, 6183 sayılı Kanun kapsamında takip edilmeyen borçlar için ise T.C. Ziraat Bankasının ilgili şubelerine, bu maddenin yayımı tarihinden itibaren iki ay içinde başvuruda bulunulur. Süresi içinde başvuruda bulunulmayan borçlar için ilgili mevzuat uyarınca borç ertelemesi yapılmaz ve borç tutarları 6183 sayılı Kanun kapsamında takibe konu edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yeniden yapılandırılan tutar, bu maddenin yayımını izleyen yıl başlamak üzere eşit taksitler halinde yılda bir ödenir ve ödemeler en fazla on beş yılda tamamlanır. Taksitlerin yıl içinde ödeneceği tarih, başvuru sırasında belirtilir. Yeniden yapılandırılmış olan borcun ilk taksit süresi içinde tamamen ödenmesi halinde, bu madde uyarınca yeniden hesaplanan faiz tutarlarından yüzde yirmi beş oranında indirim uygulanır. Yeniden yapılandırılan tutara taksit döneminde herhangi bir faiz uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>6183 sayılı Kanun kapsamında takip edilen borçlardan bu madde çerçevesinde yeniden yapılandırılanlara ilişkin işlemler, ilgili vergi dairesince yürütülür. İlgili vergi dairesi veya T.C. Ziraat Bankası şubesi tarafından tahsil edilen tutarlar, iki iş günü içinde genel bütçeye gelir kaydedilmek üzere T.C. Ziraat Bankası aracılığıyla Hazine Müsteşarlığının ilgili hesabına aktarılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Taksit tutarlarının vadelerinde kısmen veya tamamen ödenmemesi durumunda, ödenmeyen kısma 6183 sayılı Kanun ile belirlenen oranlarda gecikme zammı uygulanır. İki taksitin arka arkaya vadesinde ve tahakkuk eden gecikme zamları ile birlikte tam olarak ödenmemesi halinde yeniden yapılandırma işlemi iptal edilir ve birlikler ödedikleri tutar kadar bu madde hükmünden yararlanırlar. Kalan tutar 6183 sayılı Kanun kapsamında takibe konu edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Cumhurbaşkanınca belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Birliklerin bu Kanun uyarınca terkin ve tasfiye edilen 1/5/2000 tarihi öncesi borç anapara ve faiz tutarları ile 1/5/2000 tarihinden sonra birliklere kullandırılan Destekleme ve Fiyat İstikrar Fonu kredilerinin bu Kanunun geçici 4 üncü maddesi uyarınca tahsilinden vazgeçilen faizlerle oluşturdukları özel fon hesabından, birliğin gelir-gider menfi farklarının yanı sıra, ortak kooperatiflerden olan ve tahsil kabiliyeti kalmamış bulunan birlik alacakları ile bu maddenin yayımı tarihine kadar bu alacaklara ilişkin işleyen faiz ve gecikme zammı gibi fer’i alacakları da mahsup edilebilir. Kooperatiflerin birliklere olan bu kapsamdaki borçlarının, birlik bilançolarındaki özel fon tutarını aşması durumunda, birlik yönetim kurulu kararıyla aşan tutarların da tahsilinden vazgeçilebilir. Kooperatif borçlarının bu şekilde mahsup edilmesi veya tahsilinden vazgeçilmesi sermaye transferi olarak değerlendirilmez. Birliklerin ortak kooperatiflere yönelik 1/5/2000 tarihinden itibaren yaptıkları alacağın mahsup edilmesi ve tahsilinden vazgeçilmesi işlemleri, bu madde kapsamında yapılmış sayılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kooperatiflerin birliklere olan borçlarından mahsup edilen veya tahsilinden vazgeçilen tutarlar, kurum kazancına dahil edilmez, kooperatif gelir hesapları ile ilişkilendirilmeksizin bilançonun pasifinde özel bir fon hesabında izlenir ve bu fon hesabında izlenen tutarlar kooperatiflerin gelir-gider menfi farklarından mahsup edilebilir. Bu mahsuplar sonucu kalan tutarlar birlik ve kooperatiflerin özel fon hesabında tutulmaya devam olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Özel fon hesabı tutarlarının herhangi bir suretle işletmeden çekilmesi, sermayeye ilave dışında başka bir hesaba nakledilmesi, ortaklara dağıtılması veya işletmenin tasfiyesi, devredilmesi, bölünmesi hallerinde söz konusu tutarlar ilgili dönem kazancı ile ilişkilendirilmeksizin bu dönemde vergiye tabi tutulur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bakanlıkça bu maddenin yayımı tarihinden itibaren bir yıl içinde 7 nci madde çerçevesinde örnek anasözleşmeler hazırlanır. Anasözleşme değişiklikleri tescil ettirilinceye kadar mevcut anasözleşmelerin bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>4 üncü maddenin birinci ve ikinci fıkralarında yer alan birlik ve kooperatif yönetim kurulu üyelerine ilişkin hükümler ilk yönetim kurulu seçimlerinden itibaren uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>4 üncü maddenin dokuzuncu fıkrasında yer alan kooperatiflerde müdürlerin en az dört yıllık yükseköğrenim görmüş olma şartı, mevcut kooperatif müdürleri için bu görevleri sona erene kadar uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>1/5/2000 tarihinden sonra Destekleme ve Fiyat İstikrar Fonu (DFİF) kaynaklarından kredi kullanan ve bu maddenin yayımı tarihi itibarıyla kredi bakiyesi bulunan birliklerin, bu maddenin yayımını izleyen üç ay içinde tasfiye kararı almaları ve bu madde hükümlerinden yararlanmak için Bakanlığa başvurmaları hâlinde, tasfiye süreçlerinin tamamlanması ve birliğin ticaret sicil kayıtlarının silinmesini takiben, Hazine alacağına dönüşen DFİF kaynaklı kredi borçlarının ve 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre takip edilen borçları ile kamuya olan diğer borçlarının tasfiye kararının Türkiye Ticaret Sicili Gazetesi’nde yayımlandığı tarih itibarıyla bakiyelerinin terkin edilmesi hususunda Cumhurbaşkanı yetkilidir. Birliklerin kamu kurum ve kuruluşlarına olan borçları tasfiye işlemlerinin yürütülmesi ve sonuçlandırılmasına engel teşkil etmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tasfiye kararı alan birliklerin terkine konu borçlarına ve fer’ilerine tasfiye kararının Türkiye Ticaret Sicili Gazetesi’nde yayımlandığı tarihten itibaren faiz ve gecikme cezası tahakkuk ettirilmez. Terkine konu borçlara ilişkin olarak birlikler ve yöneticileri hakkında yürütülen icra, takip ve haciz işlemleri ilgili idarelerce durdurulur. Bu borçlara ilişkin olarak açılmış davalarda tasfiye ve terkin işlemleri tamamlanana kadar mahkemelerce yargılamanın durdurulmasına karar verilir. Tasfiye sürecinde, üzerinde takyidat bulunan varlıkların satılarak tasfiye edilmesi hâlinde, bütün takyidatlar bedel üzerine taşınmak suretiyle ilgili kamu idarelerince tasfiye kurulunun bildirimi üzerine kaldırılır. Tasfiye ve terkin işlemlerinin tamamlanması hâlinde, durdurulmuş olan icra, takip ve haciz işlemleri ile davalar kendiliğinden düşer.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Birliklerin tasfiyesine ilişkin kendi mevzuatlarındaki hükümler bu madde kapsamında tasfiye kararı alan birlikler hakkında uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Birliklerin varlıklarının tasfiyesi sonucunda elde edilecek gelir öncelikle personeline olan borçlarının ödenmesinde kullanılır. Artan değerler 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanununun 206 ncı maddesindeki sıraya göre dağıtılır. Tasfiye süreci tamamlandıktan sonra herhangi bir artı değer kalması durumunda kalan tutar Hazineye aktarılır. Bu maddeye konu kamu alacaklarından kaynaklanan bilanço açıkları için ortaklara ek ödeme yükümlülüğü getirilmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Tasfiye ve terkin işlemleri tamamlanmadan tasfiye kararından dönen birlikler için bu madde kapsamında tahakkuk ettirilmeyen faiz ve gecikme cezaları donduruldukları günden itibaren yeniden hesaplanarak tahakkuk ettirilir ve icra, takip ve haciz işlemleri ile durdurulmuş davalar yürütülmeye devam olunur. Tasfiye kararı alındığı tarih ile tasfiyenin kapatıldığı veya vazgeçme hâlinde vazgeçildiği tarih arasında her türlü zamanaşımı ve hak düşürücü süreler işlemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Borçları terkin edilen birliklerin, söz konusu borçlara ilişkin şahsi sorumluluğu, yargıya intikal eden konularda mahkeme kararı, yargıya intikal etmemiş olanlarda ise Bakanlık incelemesi sonucunda tespit edilmiş olan yönetim kurulu üyeleri ve yöneticileri başka bir kooperatif veya birlikte ortak, temsilci, yönetici ve yönetim kurulu üyesi olamazlar. Tasfiye olan birliğin faaliyet konusu ile ilgili başka bir birlik kurulamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Cumhurbaşkanı tarafından terkini uygun görülen borçlar ile tasfiye sonrasında Hazineye intikal eden varlıkları mahiyetlerine göre ilgili devlet hesaplarına kaydettirmeye Maliye Bakanı yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Bu maddenin uygulanmasına ve tasfiye işlemlerine ilişkin usul ve esaslar Cumhurbaşkanı Kararı ile belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>

      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
