            <template>Tanık veya bilirkişinin duruşma sırasında hazır bulunamayacağı veya oturduğu yerin uzaklığı nedeniyle bulunmasının güç olduğu anlaşılırsa, bu tanık veya bilirkişinin dinlenmesinde de birinci fıkra hükmü uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mağdur, şüpheli veya sanığın huzuru, tanıklardan birinin gerçeğe uygun tanıklık etmesine engel olabilecekse, o işte şüpheli veya sanığın bulunmamasına karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu işlerde hazır bulunmaya hakkı olanlar, işin geri bırakılmasına neden olmamak koşuluyla, işlerin yapılması gününden önce haberdar edilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Şüpheli veya sanık tutuklu ise, hâkim veya mahkeme tarafından ancak zorunlu sayılan hâllerde keşifte hazır bulundurulmasına karar verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="85" başlık="Yer gösterme">
          <mvz-fıkra no="1">
            <template>Cumhuriyet savcısı, kendisine yüklenen suç hakkında açıklamada bulunmuş olan şüpheliye yer gösterme işlemi yaptırabilir. 250 nci maddenin birinci fıkrası kapsamına giren suçlar söz konusu olduğunda, adli kolluk amiri de yer gösterme işlemi yaptırmaya yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturmayı geciktirmemek kaydıyla, müdafi de yer gösterme işlemi sırasında hazır bulunabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yer gösterme işlemi, 169 uncu maddeye uygun olarak tutanağa bağlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="86" başlık="Ölünün kimliğini belirleme ve adlî muayene">
          <mvz-fıkra no="1">
            <template>Engelleyici sebepler olmadıkça ölü muayenesinden veya otopsiden önce ölünün kimliği her suretle ve özellikle kendisini tanıyanlara gösterilerek belirlenir ve elde edilmiş bir şüpheli veya sanık varsa, teşhis edilmek üzere ölü ona da gösterilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ölünün adlî muayenesinde tıbbî belirtiler, ölüm zamanı ve ölüm nedenini belirlemek için tüm bulgular saptanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu muayene, Cumhuriyet savcısının huzurunda ve bir hekim görevlendirilerek yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="87" başlık="Otopsi">
          <mvz-fıkra no="1">
            <template>Otopsi, Cumhuriyet savcısının huzurunda biri adlî tıp, diğeri patoloji uzmanı veya diğer dallardan birisinin mensubu veya biri pratisyen iki hekim tarafından yapılır. Müdafi veya vekil tarafından getirilen hekim de otopside hazır bulunabilir. Zorunluluk bulunduğunda otopsi işlemi bir hekim tarafından da yapılabilir; bu durum otopsi raporunda açıkça belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Otopsi, cesedin durumu olanak verdiği takdirde, mutlaka baş, göğüs ve karnın açılmasını gerektirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ölümünden hemen önceki hastalığında öleni tedavi etmiş olan tabibe, otopsi yapma görevi verilemez. Ancak, bu tabibin otopsi sırasında hazır bulunması ve hastalığın seyri hakkında bilgi vermesi istenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Gömülmüş bulunan bir ceset, incelenmesi veya otopsi yapılması için mezardan çıkarılabilir. Bu husustaki karar, soruşturma evresinde Cumhuriyet savcısı, kovuşturma evresinde mahkeme tarafından verilir. Mezardan çıkarma kararı, araştırmanın amacını tehlikeye düşürmeyecekse ve ulaşılması da zor değilse ölünün bir yakınına derhâl bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yukarıdaki fıkralarda sözü edilen işlemler yapılırken, cesedin görüntüleri kayda alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="88" başlık="Yeni doğanın cesedinin adlî muayenesi veya otopsi">
          <mvz-fıkra no="1">
            <template>Yeni doğanın cesedi üzerinde adlî muayene veya otopside, doğum sırasında veya doğumdan sonra yaşam bulgularının varlığı ve olağan süresinde doğup doğmadığı ve biyolojik olarak yaşamını rahim dışında sürdürebilecek kadar olgunlaşmış olup olmadığı veya yaşama yeteneği bulunup bulunmadığı saptanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="89" başlık="Zehirlenme şüphesi üzerine yapılacak işlem">
          <mvz-fıkra no="1">
            <template>Zehirlenme şüphesi olan hâllerde organlardan parça alınırken, görünen şekli ile organın tahribatı tanımlanır. Ölüde veya başka yerlerde bulunmuş şüpheli maddeler, görevlendirilen uzman tarafından incelenerek tahlil edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhuriyet savcısı veya mahkeme, bu incelemenin, hekimin katılmasıyla veya onun yönetiminde yapılmasına karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Koruma Tedbirleri">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Yakalama ve Gözaltı">
        <mvz-madde no="90" başlık="Yakalama ve yakalanan kişi hakkında yapılacak işlemler">
          <mvz-fıkra no="1">
            <template>Aşağıda belirtilen hâllerde, herkes tarafından geçici olarak yakalama yapılabilir:</template>
            <mvz-bent no="a">
              <template>Kişiye suçu işlerken rastlanması.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Suçüstü bir fiilden dolayı izlenen kişinin kaçması olasılığının bulunması veya hemen kimliğini belirleme olanağının bulunmaması.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kolluk görevlileri, tutuklama kararı veya yakalama emri düzenlenmesini gerektiren ve gecikmesinde sakınca bulunan hâllerde; Cumhuriyet savcısına veya âmirlerine derhâl başvurma olanağı bulunmadığı takdirde, yakalama yetkisine sahiptirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Soruşturma ve kovuşturması şikâyete bağlı olmakla birlikte, çocuklara, beden veya akıl hastalığı, malûllük veya güçsüzlükleri nedeniyle kendilerini idareden aciz bulunanlara karşı işlenen suçüstü hallerinde kişinin yakalanması şikâyete bağlı değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kolluk, yakalandığı sırada kaçmasını, kendisine veya başkalarına zarar vermesini önleyecek tedbirleri aldıktan sonra, yakalanan kişiye kanunî haklarını derhal bildirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Birinci fıkraya göre yakalanıp kolluğa teslim edilen veya ikinci fıkra uyarınca görevlilerce yakalanan kişi ve olay hakkında Cumhuriyet savcısına hemen bilgi verilerek, emri doğrultusunda işlem yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Yakalama emrine konu işlemin yerine getirilmesi nedeniyle yakalama emrinin çıkarılma amacının ortadan kalkması durumunda mahkeme, hâkim veya Cumhuriyet savcısı tarafından yakalama emrinin derhâl iadesi istenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="91" başlık="Gözaltı">
          <mvz-fıkra no="1">
            <template>Yukarıdaki maddeye göre yakalanan kişi, Cumhuriyet Savcılığınca bırakılmazsa, soruşturmanın tamamlanması için gözaltına alınmasına karar verilebilir.  Gözaltı süresi, yakalama yerine en yakın hâkim veya mahkemeye gönderilmesi için zorunlu süre hariç, yakalama anından itibaren yirmidört saati geçemez. Yakalama yerine en yakın hâkim veya mahkemeye gönderilme için zorunlu süre oniki saatten fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gözaltına alma, bu tedbirin soruşturma yönünden zorunlu olmasına ve kişinin bir suçu işlediği şüphesini gösteren somut delillerin varlığına bağlıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Toplu olarak işlenen suçlarda, delillerin toplanmasındaki güçlük veya şüpheli sayısının çokluğu nedeniyle; Cumhuriyet savcısı gözaltı süresinin, her defasında bir günü geçmemek üzere, üç gün süreyle uzatılmasına yazılı olarak emir verebilir. Gözaltı süresinin uzatılması emri gözaltına alınana derhâl tebliğ edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Suçüstü hâlleriyle sınırlı olmak kaydıyla; kişi hakkında aşağıdaki bentlerde belirtilen suçlarda mülki amirlerce belirlenecek kolluk amirleri tarafından yirmi dört saate kadar, şiddet olaylarının yaygınlaşarak kamu düzeninin ciddi şekilde bozulmasına yol açabilecek toplumsal olaylar sırasında ve toplu olarak işlenen suçlarda kırk sekiz saate kadar gözaltına alınma kararı verilebilir. Gözaltına alma nedeninin ortadan kalkması hâlinde veya işlemlerin tamamlanması üzerine derhâl ve her hâlde en geç yukarıda belirtilen sürelerin sonunda Cumhuriyet savcısına, yapılan işlemler hakkında bilgi verilerek talimatı doğrultusunda hareket edilir. Kişi serbest bırakılmazsa yukarıdaki fıkralara göre işlem yapılır. Ancak kişi en geç kırk sekiz saat, toplu olarak işlenen suçlarda dört gün içinde hâkim önüne çıkarılır. Bu fıkra kapsamında kolluk tarafından gözaltına alınan kişiler hakkında da gözaltına ilişkin hükümler uygulanır.</template>
            <mvz-bent no="a">
              <template>Toplumsal olaylar sırasında işlenen cebir ve şiddet içeren suçlar.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununda yer alan;</template>
              <mvz-altbent no="1">
                <template>Kasten öldürme (madde 81, 82), taksirle öldürme (madde 85),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Kasten yaralama (madde 86, 87),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Cinsel saldırı (madde 102),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Çocukların cinsel istismarı (madde 103),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Hırsızlık (madde 141, 142),</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Yağma (madde 148, 149),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>Bulaşıcı hastalıklara ilişkin tedbirlere aykırı davranma (madde 195),</template>
              </mvz-altbent>
              <mvz-altbent no="9">
                <template>Fuhuş (madde 227),</template>
              </mvz-altbent>
              <mvz-altbent no="10">
                <template>Kötü muamele (madde 232),</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="c">
              <template>12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanununda yer alan suçlar.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>6/10/1983 tarihli ve 2911 sayılı Toplantı ve Gösteri Yürüyüşleri Kanununun 33 üncü maddesinin birinci fıkrasının (a) bendinde belirtilen suçlar.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>10/6/1949 tarihli ve 5442 sayılı İl İdaresi Kanununa dayanılarak ilan edilen sokağa çıkma yasağını ihlal etme.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>21/3/2007 tarihli ve 5607 sayılı Kaçakçılıkla Mücadele Kanununun 3 üncü maddesinde belirtilen suçlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yakalama işlemine, gözaltına alma ve gözaltı süresinin uzatılmasına ilişkin Cumhuriyet savcısının yazılı emrine karşı, yakalanan kişi, müdafii veya kanunî temsilcisi, eşi ya da birinci veya ikinci derecede kan hısımı, hemen serbest bırakılmayı sağlamak için sulh ceza hâkimine başvurabilir. Sulh ceza hâkimi incelemeyi evrak üzerinde yaparak derhâl ve nihayet yirmidört saat dolmadan başvuruyu sonuçlandırır. Yakalamanın veya gözaltına alma veya gözaltı süresini uzatmanın yerinde olduğu kanısına varılırsa başvuru reddedilir ya da yakalananın derhâl soruşturma evrakı ile Cumhuriyet Savcılığında hazır bulundurulmasına karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Gözaltı süresinin dolması veya sulh ceza hâkiminin kararı üzerine serbest bırakılan kişi hakkında yakalamaya neden olan fiille ilgili yeni ve yeterli delil elde edilmedikçe ve Cumhuriyet savcısının kararı olmadıkça bir daha aynı nedenle yakalama işlemi uygulanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Gözaltına alınan kişi bırakılmazsa, en geç bu süreler sonunda sulh ceza hâkimi önüne çıkarılıp sorguya çekilir. Sorguda müdafii de hazır bulunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="92" başlık="Gözaltı işlemlerinin denetimi">
          <mvz-fıkra no="1">
            <template>Cumhuriyet başsavcıları veya görevlendirecekleri Cumhuriyet savcıları, adlî görevlerinin gereği olarak, gözaltına alınan kişilerin bulundurulacakları nezarethaneleri, varsa ifade alma odalarını, bu kişilerin durumlarını, gözaltına alınma neden ve sürelerini, gözaltına alınma ile ilgili tüm kayıt ve işlemleri denetler; sonucunu Nezarethaneye Alınanlar Defterine kaydederler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="93" başlık="Yakalanan veya tutuklanan kişilerin nakli">
          <mvz-fıkra no="1">
            <template>Yakalanan veya tutuklanarak bir yerden diğer bir yere nakledilen kişilere, kaçacaklarına ya da kendisi veya başkalarının hayat ve beden bütünlükleri bakımından tehlike arz ettiğine ilişkin belirtilerin varlığı hâllerinde kelepçe takılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yakalanan kişinin mahkemeye götürülmesi</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="94" başlık="">
          <mvz-fıkra no="1">
            <template>Hâkim veya mahkeme tarafından verilen yakalama emri üzerine soruşturma veya kovuşturma evresinde yakalanan kişi, en geç yirmi dört saat içinde yetkili hâkim veya mahkeme önüne çıkarılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yakalanan kişi, en geç yirmi dört saat içinde yetkili hâkim veya mahkeme önüne çıkarılamıyorsa, aynı süre içinde yakalandığı yer adliyesinde, mevcut değil ise en yakın adliyede kurulu sesli ve görüntülü iletişim sisteminin kullanılması suretiyle yetkili hâkim veya mahkeme tarafından bu kişinin sorgusu yapılır veya ifadesi alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İfadesi alınmak amacıyla düzenlenen yakalama emri üzerine mesai saatleri dışında yakalanan ve belirlenen tarihte yargı mercii önünde hazır bulunmayı taahhüt eden kişinin serbest bırakılması, Cumhuriyet savcısı tarafından emredilebilir. Bu hüküm her yakalama emri için ancak bir kez uygulanabilir. Taahhüdünü yerine getirmeyen kişiye, yakalama emrinin düzenlendiği yer Cumhuriyet savcısı tarafından bin Türk lirası idari para cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="95" başlık="Yakalanan veya gözaltına alınanın durumunun yakınlarına bildirilmesi">
          <mvz-fıkra no="1">
            <template>Şüpheli veya sanık yakalandığında, gözaltına alındığında veya gözaltı süresi uzatıldığında, Cumhuriyet savcısının emriyle bir yakınına veya belirlediği bir kişiye gecikmeksizin haber verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yakalanan veya gözaltına alınan yabancı ise, yazılı olarak karşı çıkmaması halinde, durumu, vatandaşı olduğu devletin konsolosluğuna bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="96" başlık="Yakalamanın ilgililere bildirilmesi">
          <mvz-fıkra no="1">
            <template>Soruşturma ve kovuşturması şikâyete bağlı olan suç hakkında 90 ıncı maddenin üçüncü fıkrasına göre şikâyetten önce şüpheli yakalanmış olursa şikâyete yetkili olan kimseye ve bunlar birden fazla ise hiç olmazsa birine yakalama bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="97" başlık="Yakalama tutanağı">
          <mvz-fıkra no="1">
            <template>Yakalama işlemi bir tutanağa bağlanır. Bu tutanağa yakalananın, hangi suç nedeniyle, hangi koşullarda, hangi yer ve zamanda yakalandığı, yakalamayı kimlerin yaptığı, hangi kolluk mensubunca tespit edildiği, haklarının tam olarak anlatıldığı açıkça yazılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="98" başlık="Yakalama emri ve nedenleri">
          <mvz-fıkra no="1">
            <template>Soruşturma evresinde çağrı üzerine gelmeyen veya çağrı yapılamayan şüpheli hakkında, Cumhuriyet savcısının istemi üzerine sulh ceza hâkimi tarafından yakalama emri düzenlenebilir. Ayrıca, tutuklama isteminin reddi kararına itiraz halinde, itiraz mercii tarafından da yakalama emri düzenlenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yakalanmış iken kolluk görevlisinin elinden kaçan şüpheli veya sanık ya da tutukevi veya ceza infaz kurumundan kaçan tutuklu veya hükümlü hakkında Cumhuriyet savcıları ve kolluk kuvvetleri de yakalama emri düzenleyebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kovuşturma evresinde kaçak sanık hakkında yakalama emri re'sen veya Cumhuriyet savcısının istemi üzerine hâkim veya mahkeme tarafından düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yakalama emrinde, kişinin açık eşkâli, bilindiğinde kimliği ve yüklenen suç ile yakalandığında nereye gönderileceği gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="99" başlık="Yönetmelik">
          <mvz-fıkra no="1">
            <template>Gözaltına alınan kişilerin bulundurulacakları nezarethanelerin maddî koşulları, bu kişinin hangi görevlinin sorumluluğuna bırakılacağı, sağlık kontrolünün nasıl yapılacağı, gözaltı işlemlerine ilişkin kayıt ve defterlerin nasıl tutulacağı, gözaltına alınmanın başlangıcında ve bu tedbire son verildiğinde hangi tutanakların tutulacağı ve gözaltına alınan kişiye hangi belgelerin verileceği ile kolluk tarafından gerçekleştirilen yakalama işlemlerinin yürütülmesinde uyulacak kurallar, yönetmelikte gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Tutuklama">
        <mvz-madde no="100" başlık="Tutuklama nedenleri">
          <mvz-fıkra no="1">
            <template>Kuvvetli suç şüphesinin varlığını gösteren somut delillerin ve bir tutuklama nedeninin bulunması halinde, şüpheli veya sanık hakkında tutuklama kararı verilebilir. İşin önemi, verilmesi beklenen ceza veya güvenlik tedbiri ile ölçülü olmaması halinde, tutuklama kararı verilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aşağıdaki hallerde bir tutuklama nedeni var sayılabilir:</template>
            <mvz-bent no="a">
              <template>Şüpheli veya sanığın kaçması, saklanması veya kaçacağı şüphesini uyandıran somut olgular varsa.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Şüpheli veya sanığın davranışları;</template>
              <mvz-altbent no="1">
                <template>Delilleri yok etme, gizleme veya değiştirme,</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Tanık, mağdur veya başkaları üzerinde baskı yapılması girişiminde bulunma,</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="0">
              <template>Hususlarında kuvvetli şüphe oluşturuyorsa.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Aşağıdaki suçların işlendiği hususunda somut delillere dayanan kuvvetli şüphe sebeplerinin varlığı halinde, tutuklama nedeni var sayılabilir:</template>
            <mvz-bent no="a">
              <template>26.9.2004 tarihli ve 5237 sayılı Türk Ceza Kanununda yer alan;</template>
              <mvz-altbent no="1">
                <template>Soykırım ve insanlığa karşı suçlar (madde 76, 77, 78),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Göçmen kaçakçılığı ve insan ticareti (madde 79, 80)</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Kasten öldürme (madde 81, 82, 83),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Kasten yaralama (madde 86, fıkra 3, bent b, e ve f) ve neticesi sebebiyle ağırlaşmış kasten yaralama (madde 87),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>İşkence (madde 94, 95)</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Cinsel saldırı (birinci fıkra hariç, madde 102),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Çocukların cinsel istismarı (madde 103),</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>Hırsızlık (madde 141, 142) ve yağma (madde 148, 149),</template>
              </mvz-altbent>
              <mvz-altbent no="9">
                <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
              <mvz-altbent no="10">
                <template>Suç işlemek amacıyla örgüt kurma (iki, yedi ve sekizinci fıkralar hariç, madde 220),</template>
              </mvz-altbent>
              <mvz-altbent no="11">
                <template>Devletin Güvenliğine Karşı Suçlar (madde 302, 303, 304, 307, 308),</template>
              </mvz-altbent>
              <mvz-altbent no="12">
                <template>Anayasal Düzene ve Bu Düzenin İşleyişine Karşı Suçlar (madde 309, 310, 311, 312, 313, 314, 315),</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="b">
              <template>10.7.1953 tarihli ve 6136 sayılı Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunda tanımlanan silah kaçakçılığı (madde 12) suçları.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>18.6.1999 tarihli ve 4389 sayılı Bankalar Kanununun 22 nci maddesinin (3) ve (4) numaralı fıkralarında tanımlanan zimmet suçu.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>10.7.2003 tarihli ve 4926 sayılı Kaçakçılıkla Mücadele Kanununda tanımlanan ve hapis cezasını gerektiren suçlar.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>21.7.1983 tarihli ve 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanununun 68 ve 74 üncü maddelerinde tanımlanan suçlar.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>31.8.1956 tarihli ve 6831 sayılı Orman Kanununun 110 uncu maddesinin dört ve beşinci fıkralarında tanımlanan kasten orman yakma suçları.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>6/10/1983 tarihli ve 2911 sayılı Toplantı ve Gösteri Yürüyüşleri Kanununun 33 üncü maddesinde sayılan suçlar.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanununun 7 nci maddesinin üçüncü fıkrasında belirtilen suçlar.</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Kadına karşı işlenen kasten yaralama suçu.</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Sağlık kurum ve kuruluşlarında görev yapan personele karşı görevleri sırasında veya görevleri dolayısıyla işlenen kasten yaralama suçu.</template>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Millî Eğitim Bakanlığına bağlı resmî eğitim kurumlarında yönetici, öğretmen, usta öğretici, yabancı uyruklu öğrencilerin eğitimine yönelik Millî Eğitim Bakanlığı tarafından yürütülen projelerde öğretici/öğretmen veya rehber danışman; özel öğretim kurumlarında yönetici, öğretmen, uzman öğretici ve usta öğretici olarak görev yapanlar ile Millî Eğitim Bakanlığına bağlı resmî eğitim kurumları ve özel öğretim kurumlarında ders ücreti karşılığı ders okutanlara ve diğer kamu kurum ve kuruluşlarında görev yapan öğretmenlere karşı görevleri sırasında veya görevleri sebebiyle işlenen kasten yaralama suçu.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Sadece adlî para cezasını gerektiren suçlarda veya vücut dokunulmazlığına karşı kasten işlenenler hariç olmak üzere hapis cezasının üst sınırı iki yıldan fazla olmayan suçlarda tutuklama kararı verilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="101" başlık="Tutuklama kararı">
          <mvz-fıkra no="1">
            <template>Soruşturma evresinde şüphelinin tutuklanmasına Cumhuriyet savcısının istemi üzerine sulh ceza hâkimi tarafından, kovuşturma evresinde sanığın tutuklanmasına Cumhuriyet savcısının istemi üzerine veya re'sen mahkemece karar verilir. Bu istemlerde mutlaka gerekçe gösterilir ve adlî kontrol uygulamasının yetersiz kalacağını belirten hukukî ve fiilî nedenlere yer verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tutuklamaya, tutuklamanın devamına veya bu husustaki bir tahliye isteminin reddine ilişkin kararlarda;</template>
            <mvz-bent no="a">
              <template>Kuvvetli suç şüphesini,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Tutuklama nedenlerinin varlığını,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Tutuklama tedbirinin ölçülü olduğunu,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Adli kontrol uygulamasının yetersiz kalacağını,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>gösteren deliller somut olgularla gerekçelendirilerek açıkça gösterilir. Kararın içeriği şüpheli veya sanığa sözlü olarak bildirilir, ayrıca bir örneği yazılmak suretiyle kendilerine verilir ve bu husus kararda belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tutuklama istenildiğinde, şüpheli veya sanık, kendisinin seçeceği veya baro tarafından görevlendirilecek bir müdafiin yardımından yararlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Tutuklama kararı verilmezse, şüpheli veya sanık derhâl serbest bırakılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu madde ile 100 üncü madde gereğince verilen kararlara itiraz edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="102" başlık="Tutuklulukta geçecek süre">
          <mvz-fıkra no="1">
            <template>Ağır ceza mahkemesinin görevine girmeyen işlerde tutukluluk süresi en çok bir yıldır. Ancak bu süre, zorunlu hallerde gerekçeleri gösterilerek altı ay daha uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ağır ceza mahkemesinin görevine giren işlerde, tutukluluk süresi en çok iki yıldır. Bu süre, zorunlu hallerde, gerekçesi gösterilerek uzatılabilir; uzatma süresi toplam üç yılı, 5237 sayılı Türk Ceza Kanununun İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde tanımlanan suçlar ile 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu kapsamına giren suçlarda beş yılı geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddede öngörülen uzatma kararları, Cumhuriyet savcısının, şüpheli veya sanık ile müdafiinin görüşleri alındıktan sonra verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Soruşturma evresinde tutukluluk süresi, ağır ceza mahkemesinin görevine girmeyen işler bakımından altı ayı, ağır ceza mahkemesinin görevine giren işler bakımından ise bir yılı geçemez. Ancak, Türk Ceza Kanununun İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde tanımlanan suçlar, Terörle Mücadele Kanunu kapsamına giren suçlar ve toplu olarak işlenen suçlar bakımından bu süre en çok bir yıl altı ay olup, gerekçesi gösterilerek altı ay daha uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu maddede öngörülen tutukluluk süreleri, fiili işlediği sırada on beş yaşını doldurmamış çocuklar bakımından yarı oranında, on sekiz yaşını doldurmamış çocuklar bakımından ise dörtte üç oranında uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="103" başlık="Cumhuriyet savcısının tutuklama kararının geri alınmasını istemesi">
          <mvz-fıkra no="1">
            <template>Cumhuriyet savcısı, şüphelinin adlî kontrol altına alınarak serbest bırakılmasını sulh ceza hâkiminden isteyebilir. Hakkında tutuklama kararı verilmiş şüpheli ve müdafii de aynı istemde bulunabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturma evresinde Cumhuriyet savcısı adlî kontrol veya tutuklamanın artık gereksiz olduğu kanısına varacak olursa, şüpheliyi re'sen serbest bırakır. Kovuşturmaya yer olmadığı kararı verildiğinde şüpheli serbest kalır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="104" başlık="Şüpheli veya sanığın salıverilme istemleri">
          <mvz-fıkra no="1">
            <template>Soruşturma ve kovuşturma evrelerinin her aşamasında şüpheli veya sanık salıverilmesini isteyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Şüpheli veya sanığın tutukluluk hâlinin devamına veya salıverilmesine hâkim veya mahkemece karar verilir. Bu kararlara itiraz edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Dosya bölge adliye mahkemesine veya Yargıtaya geldiğinde salıverilme istemi hakkındaki karar, bölge adliye mahkemesi veya Yargıtay ilgili dairesi veya Yargıtay Ceza Genel Kurulunca dosya üzerinde yapılacak incelemeden sonra verilir; bu karar re'sen de verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="105" başlık="Usul">
          <mvz-fıkra no="1">
            <template>103 ve 104 üncü maddeler uyarınca yapılan istem üzerine, merciince Cumhuriyet savcısı, şüpheli, sanık veya müdafiin görüşü alındıktan sonra, üç gün içinde istemin kabulüne, reddine veya adlî kontrol uygulanmasına karar verilir.  103 üncü maddenin birinci fıkrasının birinci cümlesi uyarınca yapılan istemler hariç olmak üzere örgüt faaliyeti çerçevesinde işlenen suçlar bakımından bu süre yedi gün olarak uygulanır.  Duruşma dışında bu karar verilirken Cumhuriyet savcısı, şüpheli, sanık veya müdafiinin görüşü alınmaz. Bu kararlara itiraz edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="106" başlık="Salıverilenin yükümlülükleri">
          <mvz-fıkra no="1">
            <template>Salıverilmeden önce şüpheli veya sanık, yetkili yargı merciine veya tutukevinin müdürüne adresini ve varsa telefon numarasını bildirmekle yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Şüpheli veya sanığa soruşturmanın veya kovuşturmanın sona erdirileceği tarihe kadar, yeniden beyanda bulunmak suretiyle veya iadeli taahhütlü mektupla önceden verdiği adreslerdeki her türlü değişiklikleri bildirmesi ihtar olunur; ayrıca, ihtara uygun hareket etmediğinde, önceden bildirdiği adrese tebligatın yapılacağı bildirilir. Bu ihtarların yapıldığını belirten ve yeni adresleri içeren tutanak veya tutukevi müdürünün düzenleyeceği belgenin aslı veya örneği yargı merciine gönderilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="107" başlık="Tutuklananın durumunun yakınlarına bildirilmesi">
          <mvz-fıkra no="1">
            <template>Tutuklamadan ve tutuklamanın uzatılmasına ilişkin her karardan tutuklunun bir yakınına veya belirlediği bir kişiye, hâkimin kararıyla gecikmeksizin haber verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ayrıca, soruşturmanın amacını tehlikeye düşürmemek kaydıyla, tutuklunun tutuklamayı bir yakınına veya belirlediği bir kişiye bizzat bildirmesine de izin verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Şüpheli veya sanık yabancı olduğunda tutuklanma durumu, yazılı olarak karşı çıkmaması halinde, vatandaşı olduğu devletin konsolosluğuna bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="108" başlık="Tutukluluğun incelenmesi">
          <mvz-fıkra no="1">
            <template>Soruşturma evresinde şüphelinin tutukevinde bulunduğu süre içinde ve en geç otuzar günlük süreler itibarıyla tutukluluk hâlinin devamının gerekip gerekmeyeceği hususunda, Cumhuriyet savcısının istemi üzerine sulh ceza hâkimi tarafından 100 üncü madde hükümleri göz önünde bulundurularak, şüpheli veya müdafii dinlenilmek suretiyle karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tutukluluk durumunun incelenmesi, yukarıdaki fıkrada öngörülen süre içinde şüpheli tarafından da istenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hâkim veya mahkeme, tutukevinde bulunan sanığın tutukluluk hâlinin devamının gerekip gerekmeyeceğine her oturumda veya koşullar gerektirdiğinde oturumlar arasında ya da birinci fıkrada öngörülen süre içinde de re'sen karar verir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Adlî Kontrol">
        <mvz-madde no="109" başlık="Adlî kontrol">
          <mvz-fıkra no="1">
            <template>Bir suç sebebiyle yürütülen soruşturmada, 100 üncü maddede belirtilen tutuklama sebeplerinin varlığı halinde, şüphelinin tutuklanması yerine adlî kontrol altına alınmasına karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kanunda tutuklama yasağı öngörülen hallerde de, adlî kontrole ilişkin hükümler uygulanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Adlî kontrol, şüphelinin aşağıda gösterilen bir veya birden fazla yükümlülüğe tabi tutulmasını içerir:</template>
            <mvz-bent no="a">
              <template>Yurt dışına çıkamamak.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hâkim tarafından belirlenen yerlere, belirtilen süreler içinde düzenli olarak başvurmak.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Hâkimin belirttiği merci veya kişilerin çağrılarına ve gerektiğinde meslekî uğraşlarına ilişkin veya eğitime devam konularındaki kontrol tedbirlerine uymak.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Her türlü taşıtları veya bunlardan bazılarını kullanamamak ve gerektiğinde kaleme, makbuz karşılığında sürücü belgesini teslim etmek.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Özellikle uyuşturucu, uyarıcı veya uçucu maddeler ile alkol bağımlılığından arınmak amacıyla, hastaneye yatmak dahil, tedavi veya muayene tedbirlerine tâbi olmak ve bunları kabul etmek.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Şüphelinin parasal durumu göz önünde bulundurularak, miktarı ve bir defada veya birden çok taksitlerle ödeme süreleri, Cumhuriyet savcısının isteği üzerine hâkimce belirlenecek bir güvence miktarını yatırmak.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Silâh bulunduramamak veya taşıyamamak, gerektiğinde sahip olunan silâhları makbuz karşılığında adlî emanete teslim etmek.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Cumhuriyet savcısının istemi üzerine hâkim tarafından miktarı ve ödeme süresi belirlenecek parayı suç mağdurunun haklarını güvence altına almak üzere aynî veya kişisel güvenceye bağlamak.</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Aile yükümlülüklerini yerine getireceğine ve adlî kararlar gereğince ödemeye mahkûm edildiği nafakayı düzenli olarak ödeyeceğine dair güvence vermek.</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Konutunu terk etmemek.</template>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Belirli bir yerleşim bölgesini terk etmemek.</template>
            </mvz-bent>
            <mvz-bent no="l">
              <template>Belirlenen yer veya bölgelere gitmemek.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Maruz kaldığı ağır bir hastalık veya engellilik nedeniyle ceza infaz kurumu koşullarında hayatını yalnız idame ettiremediği 13/12/2004 tarihli ve 5275 sayılı Ceza ve Güvenlik Tedbirlerinin İnfazı Hakkında Kanunun 16 ncı maddesinin üçüncü fıkrası uyarınca tespit edilen şüpheli ile gebe olan veya doğurduğu tarihten itibaren altı ay geçmemiş bulunan kadın şüphelinin tutuklanması yerine adlî kontrol altına alınmasına karar verilebilir. Hakkında mahkûmiyet hükmü verilmiş ve bu hükümle ilgili olarak istinaf veya temyiz kanun yoluna başvurulmuş olması hâlinde, UYAP kayıtlarını incelemek suretiyle hükmü veren ilk derece mahkemesi de adlî kontrol kararı verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Hâkim veya Cumhuriyet savcısı (d) bendinde belirtilen yükümlülüğün uygulamasında şüphelinin meslekî uğraşılarında araç kullanmasına sürekli veya geçici olarak izin verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Adlî kontrol altında geçen süre, şahsî hürriyeti sınırlama sebebi sayılarak cezadan mahsup edilemez. Bu hüküm, maddenin üçüncü fıkrasının (e) ve (j) bentlerinde belirtilen hallerde uygulanmaz.  Ancak, (j) bendinde belirtilen konutunu terk etmemek yükümlülüğü altında geçen her iki gün, cezanın mahsubunda bir gün olarak dikkate alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Kanunlarda öngörülen tutukluluk sürelerinin dolması nedeniyle salıverilenler hakkında adlî kontrole ilişkin hükümler uygulanabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="110" başlık="Adlî kontrol kararı ve hükmedecek merciler">
          <mvz-fıkra no="1">
            <template>Şüpheli, Cumhuriyet savcısının istemi ve sulh ceza hâkiminin kararı ile soruşturma evresinin her aşamasında adlî kontrol altına alınabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkim, Cumhuriyet savcısının istemiyle, adlî kontrol uygulamasında şüpheliyi bir veya birden çok yeni yükümlülük altına koyabilir; kontrolun içeriğini oluşturan yükümlülükleri bütünüyle veya kısmen kaldırabilir, değiştirebilir veya şüpheliyi bunlardan bazılarına uymaktan geçici olarak muaf tutabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>109 uncu madde ile bu maddenin birinci ve ikinci fıkra hükümleri, gerekli görüldüğünde, görevli ve yetkili diğer yargı mercileri tarafından da, kovuşturma evresinin her aşamasında uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Şüpheli veya sanığın adli kontrol yükümlülüğünün devamının gerekip gerekmeyeceği hususunda en geç dört aylık aralıklarla; soruşturma evresinde Cumhuriyet savcısının istemi üzerine sulh ceza hâkimi, kovuşturma evresinde ise resen mahkeme tarafından 109 uncu madde hükümleri göz önünde bulundurularak karar verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="110/A" başlık="Adli kontrol altında geçecek süre">
          <mvz-fıkra no="1">
            <template>Ağır ceza mahkemesinin görevine girmeyen işlerde adli kontrol süresi en çok iki yıldır. Ancak bu süre, zorunlu hâllerde gerekçesi gösterilerek bir yıl daha uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ağır ceza mahkemesinin görevine giren işlerde, adli kontrol süresi en çok üç yıldır. Bu süre, zorunlu hâllerde, gerekçesi gösterilerek uzatılabilir; uzatma süresi toplam üç yılı, Türk Ceza Kanununun İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde tanımlanan suçlar ile Terörle Mücadele Kanunu kapsamına giren suçlarda dört yılı geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddede öngörülen adli kontrol süreleri, çocuklar bakımından yarı oranında uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="111" başlık="Adlî kontrol kararının kaldırılması">
          <mvz-fıkra no="1">
            <template>Şüpheli veya sanığın istemi üzerine, Cumhuriyet savcısının görüşünü aldıktan sonra hâkim veya mahkeme 110 uncu maddenin ikinci fıkrasına göre beş gün içinde karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Adlî kontrole ilişkin kararlara itiraz edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="112" başlık="Tedbirlere uymama">
          <mvz-fıkra no="1">
            <template>Adlî kontrol hükümlerini isteyerek yerine getirmeyen şüpheli veya sanık hakkında, hükmedilebilecek hapis cezasının süresi ne olursa olsun, yetkili yargı mercii hemen tutuklama kararı verebilir.  Hakkında mahkûmiyet hükmü verilmiş ve bu hükümle ilgili olarak istinaf veya temyiz kanun yoluna başvurulmuş olması hâlinde, UYAP kayıtlarını incelemek suretiyle hükmü veren ilk derece mahkemesi de tutuklama kararı verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra hükmü, azami tutukluluk süresinin dolması nedeniyle verilen adli kontrol tedbirinin ihlali hâlinde de uygulanabilir. Ancak, bu durumda tutuklama süresi ağır ceza mahkemesinin görevine giren işlerde dokuz aydan, diğer işlerde iki aydan fazla olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="113" başlık="Güvence">
          <mvz-fıkra no="1">
            <template>Şüpheli veya sanık tarafından gösterilecek güvence, aşağıda yazılı hususların yerine getirilmesini sağlar:</template>
            <mvz-bent no="a">
              <template>Şüpheli veya sanığın bütün usul işlemlerinde, hükmün infazında veya altına alınabileceği diğer yükümlülükleri yerine getirmek üzere hazır bulunması.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Aşağıda gösterilen sıraya göre ödemelerin yapılması:</template>
              <mvz-altbent no="1">
                <template>Katılanın yaptığı masraflar, suçun neden olduğu zararların giderilmesi ve eski hâle getirme; şüpheli veya sanık nafaka borçlarını ödememeleri nedeniyle kovuşturuluyorlarsa nafaka borçları.</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Kamusal giderler.</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Para cezaları.</template>
              </mvz-altbent>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Şüpheli veya sanığı güvence göstermeye zorunlu kılan kararda, güvencenin karşıladığı kısımlar ayrı ayrı gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="114" başlık="Önceden ödetme">
          <mvz-fıkra no="1">
            <template>Hâkim, mahkeme veya Cumhuriyet savcısı, şüpheli veya sanığın rızasıyla güvencenin mağdurun haklarını karşılayan veya nafaka borcuna ilişkin bulunan kısımlarının, istedikleri takdirde, mağdura veya nafaka alacaklılarına verilmesini emredebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturma ve kovuşturmanın konusunu oluşturan olaylar nedeniyle, mağdur veya nafaka alacaklısı lehinde bir yargı kararı verilmiş ise, şüpheli veya sanığın rızası olmasa da ödemenin yapılması emredilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="115" başlık="Güvencenin geri verilmesi">
          <mvz-fıkra no="1">
            <template>Hükümlü, 113 üncü maddenin birinci fıkrasının (a) bendinde yazılı bütün yükümlülükleri yerine getirmiş ise güvencenin 113 üncü maddenin birinci fıkrasının (a) bendini karşılayan ve aynı maddenin ikinci fıkrasına göre verilecek kararda belirtilen kısmı kendisine geri verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Güvencenin, suç mağduruna veya nafaka alacaklısına verilmemiş olan ikinci kısmı, kovuşturmaya yer olmadığı veya beraat kararları verildiğinde de şüpheli veya sanığa geri verilir. Aksi hâlde, geçerli mazereti dışında, güvence Devlet Hazinesine gelir yazılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hükümlülük hâlinde güvence 113 üncü maddenin birinci fıkrasının (b) bendinde yer alan hükümlere göre kullanılır, fazlası geri verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Arama ve Elkoyma">
        <mvz-madde no="116" başlık="Şüpheli veya sanıkla ilgili arama">
          <mvz-fıkra no="1">
            <template>Yakalanabileceği veya suç delillerinin elde edilebileceği hususunda makul şüphe varsa; şüphelinin veya sanığın üstü, eşyası, konutu, işyeri veya ona ait diğer yerler aranabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="117" başlık="Diğer kişilerle ilgili arama">
          <mvz-fıkra no="1">
            <template>Şüphelinin veya sanığın yakalanabilmesi veya suç delillerinin elde edilebilmesi amacıyla, diğer bir kişinin de üstü, eşyası, konutu, işyeri veya ona ait diğer yerler aranabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hâllerde aramanın yapılması, aranılan kişinin veya suçun delillerinin belirtilen yerlerde bulunduğunun kabul edilebilmesine olanak sağlayan olayların varlığına bağlıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu sınırlama, şüphelinin veya sanığın bulunduğu yerler ile, izlendiği sırada girdiği yerler hakkında geçerli değildir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="118" başlık="Gece yapılacak arama">
          <mvz-fıkra no="1">
            <template>Konutta, işyerinde veya diğer kapalı yerlerde gece vaktinde arama yapılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçüstü veya gecikmesinde sakınca bulunan hâller ile yakalanmış veya gözaltına alınmış olup da firar eden kişi veya tutuklu veya hükümlünün tekrar yakalanması amacıyla yapılan aramalarda, birinci fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="119" başlık="Arama kararı">
          <mvz-fıkra no="1">
            <template>Hâkim kararı üzerine veya gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısının, Cumhuriyet savcısına ulaşılamadığı hallerde ise kolluk amirinin yazılı emri ile kolluk görevlileri arama yapabilirler. Ancak, konutta, işyerinde ve kamuya açık olmayan kapalı alanlarda arama, hâkim kararı veya gecikmesinde sakınca bulunan hallerde Cumhuriyet savcısının yazılı emri ile yapılabilir. Kolluk amirinin yazılı emri ile yapılan arama sonuçları Cumhuriyet Başsavcılığına derhal bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Arama karar veya emrinde;</template>
            <mvz-bent no="a">
              <template>Aramanın nedenini oluşturan fiil,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Aranılacak kişi, aramanın yapılacağı konut veya diğer yerin adresi ya da eşya,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Karar veya emrin geçerli olacağı zaman süresi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Açıkça gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Arama tutanağına işlemi yapanların açık kimlikleri yazılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cumhuriyet savcısı hazır olmaksızın konut, işyeri veya diğer kapalı yerlerde arama yapabilmek için o yer ihtiyar heyetinden veya komşulardan iki kişi bulundurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Askerî mahallerde yapılacak arama, Cumhuriyet savcısının nezaretinde askerî makamların katılımıyla adlî kolluk görevlileri tarafından yerine getirilir. Gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısının yazılı emriyle de askerî makamların katılımıyla adlî kolluk görevlileri tarafından arama yapılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="120" başlık="Aramada hazır bulunabilecekler">
          <mvz-fıkra no="1">
            <template>Aranacak yerlerin sahibi veya eşyanın zilyedi aramada hazır bulunabilir; kendisi bulunmazsa temsilcisi veya ayırt etme gücüne sahip hısımlarından biri veya kendisiyle birlikte oturmakta olan bir kişi veya komşusu hazır bulundurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>117 nci maddenin birinci fıkrasında gösterilen hâllerde zilyet ve bulunmazsa yerine çağrılacak kişiye, aramaya başlamadan önce aramanın amacı hakkında bilgi verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kişinin avukatının aramada hazır bulunmasına engel olunamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="121" başlık="Arama sonunda verilecek belge">
          <mvz-fıkra no="1">
            <template>Aramanın sonunda hakkında arama işlemi uygulanan kimseye istemi üzerine aramanın 116 ve 117 nci maddelere göre yapıldığını ve 116 ncı maddede gösterilen durumda soruşturma veya kovuşturma konusu fiilin niteliğini belirten bir belge ve istemi üzerine elkonulan veya koruma altına alınan eşyanın listesini içeren bir defter ve eğer şüpheyi haklı kılan bir şey elde edilmemiş ise bunu belirten bir belge verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada belirtilen belgelerde, hakkında arama işlemi uygulanan kimsenin, elkonulan eşyanın mülkiyetine ilişkin görüş ve iddialarına da yer verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Koruma altına alınan veya elkonulan eşyanın tam bir defteri yapılır ve bu eşya resmî mühürle mühürlenir veya bir işaret konulur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="122" başlık="Belge veya kâğıtları inceleme yetkisi">
          <mvz-fıkra no="1">
            <template>Hakkında arama işlemi uygulanan kimsenin belge veya kâğıtlarını inceleme yetkisi, Cumhuriyet savcısı ve hâkime aittir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Belge ve kâğıtların zilyedi veya temsilcisi kendi mührünü de koyabilir veya imzasını atabilir. İleride mührün kaldırılmasına ve kâğıtların incelenmesine karar verildiğinde bu işlemin yapılmasında hazır bulunmak üzere, zilyedi veya temsilcisi ya da müdafii veya vekili çağrılır; çağrıya uyulmadığında gerekli işlem yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İnceleme sonucu soruşturma veya kovuşturma konusu suça ilişkin olmadığı anlaşılan belge veya kâğıtlar ilgilisine geri verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="123" başlık="Eşya veya kazancın muhafaza altına alınması ve bunlara elkonulması">
          <mvz-fıkra no="1">
            <template>İspat aracı olarak yararlı görülen ya da eşya veya kazanç müsaderesinin konusunu oluşturan malvarlığı değerleri, muhafaza altına alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yanında bulunduran kişinin rızasıyla teslim etmediği bu tür eşyaya elkonulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Muhafaza altına alınan veya elkonulan eşya ya da malvarlığı değerlerinin kıymeti tespit edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="124" başlık="İstenen eşyayı vermeyenler hakkında yapılacak işlem">
          <mvz-fıkra no="1">
            <template>123 üncü maddede yazılı eşya veya diğer malvarlığı değerlerini yanında bulunduran kişi, istem üzerine bu şeyi göstermek ve teslim etmekle yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kaçınma hâlinde bu şeyin zilyedi hakkında 60 ıncı maddede yer alan disiplin hapsine ilişkin hükümler uygulanır. Ancak, şüpheli veya sanık ya da tanıklıktan çekinebilecekler hakkında bu hüküm uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="125" başlık="İçeriği Devlet sırrı niteliğindeki belgelerin mahkemece incelenmesi">
          <mvz-fıkra no="1">
            <template>Bir suç olgusuna ilişkin bilgileri içeren belgeler, Devlet sırrı olarak mahkemeye karşı gizli tutulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Devlet sırrı niteliğindeki bilgileri içeren belgeler, ancak mahkeme hâkimi veya heyeti tarafından incelenebilir. Bu belgelerde yer alan ve sadece yüklenen suçu açıklığa kavuşturabilecek nitelikte olan bilgiler, hâkim veya mahkeme başkanı tarafından tutanağa kaydettirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu madde hükmü, hapis cezasının alt sınırı beş yıl veya daha fazla olan suçlarla ilgili olarak uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="126" başlık="Elkonulamayacak mektuplar, belgeler">
          <mvz-fıkra no="1">
            <template>Şüpheli veya sanık ile 45 ve 46 ncı maddelere göre tanıklıktan çekinebilecek kimseler arasındaki mektuplara ve belgelere; bu kimselerin nezdinde bulundukça elkonulamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="127" başlık="Elkoyma kararını verme yetkisi">
          <mvz-fıkra no="1">
            <template>Hâkim kararı üzerine veya gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısının, Cumhuriyet savcısına ulaşılamadığı hallerde ise kolluk amirinin yazılı emri ile kolluk görevlileri, elkoyma işlemini gerçekleştirebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kolluk görevlisinin açık kimliği, elkoyma işlemine ilişkin tutanağa geçirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hâkim kararı olmaksızın yapılan elkoyma işlemi, yirmidört saat içinde görevli hâkimin onayına sunulur. Hâkim, kararını elkoymadan itibaren kırksekiz saat içinde açıklar; aksi hâlde elkoyma kendiliğinden kalkar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Zilyedliğinde bulunan eşya veya diğer malvarlığı değerlerine elkonulan kimse, hâkimden her zaman bu konuda bir karar verilmesini isteyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Elkoyma işlemi, suçtan zarar gören mağdura gecikmeksizin bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Askerî mahallerde yapılacak elkoyma işlemi, Cumhuriyet savcısının nezaretinde askerî makamların katılımıyla adlî kolluk görevlileri tarafından yerine getirilir. Gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısının yazılı emriyle de askerî makamların katılımıyla adlî kolluk görevlileri tarafından elkoyma işlemi yapılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="128" başlık="Taşınmazlara, hak ve alacaklara elkoyma">
          <mvz-fıkra no="1">
            <template>Soruşturma veya kovuşturma konusu suçun işlendiğine ve bu suçlardan elde edildiğine dair somut delillere dayanan kuvvetli şüphe sebebi bulunan hallerde, şüpheli veya sanığa ait;</template>
            <mvz-bent no="a">
              <template>Taşınmazlara,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kara, deniz veya hava ulaşım araçlarına,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Banka veya diğer malî kurumlardaki her türlü hesaba,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Gerçek veya tüzel kişiler nezdindeki her türlü hak ve alacaklara,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kıymetli evraka,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Ortağı bulunduğu şirketteki ortaklık paylarına,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Kiralık kasa mevcutlarına,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Diğer malvarlığı değerlerine,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Elkonulabilir. Somut olarak belirlenen Bu taşınmaz, hak, alacak ve diğer malvarlığı değerlerinin şüpheli veya sanıktan başka bir kişinin zilyetliğinde bulunması halinde dahi, elkoyma işlemi yapılabilir.  Bu madde kapsamında elkoyma kararı alınabilmesi için ilgisine göre Bankacılık Düzenleme ve Denetleme Kurumu, Sermaye Piyasası Kurulu, Mali Suçları Araştırma Kurulu, Hazine Müsteşarlığı ve Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumundan, suçtan elde edilen değere ilişkin rapor alınır. Bu rapor en geç üç ay içinde hazırlanır. Özel sebepler zorunlu kıldığında bu süre talep üzerine iki ay daha uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra hükmü;</template>
            <mvz-bent no="a">
              <template>Türk Ceza Kanununda tanımlanan;</template>
              <mvz-altbent no="1">
                <template>Soykırım ve insanlığa karşı suçlar (madde 76, 77, 78),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Göçmen kaçakçılığı ve insan ticareti (madde 79, 80) ile organ veya doku ticareti (madde 91),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Hırsızlık (madde 141, 142),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Yağma (madde 148, 149),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Güveni kötüye kullanma (madde 155),</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Dolandırıcılık (madde 157, 158),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Hileli iflas (madde 161),</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
              <mvz-altbent no="9">
                <template>Parada sahtecilik (madde 197),</template>
              </mvz-altbent>
              <mvz-altbent no="10">
                <template>Suç işlemek amacıyla örgüt kurma (madde 220, fıkra üç),</template>
              </mvz-altbent>
              <mvz-altbent no="11">
                <template>İhaleye fesat karıştırma (madde 235),</template>
              </mvz-altbent>
              <mvz-altbent no="12">
                <template>Edimin ifasına fesat karıştırma (madde 236),</template>
              </mvz-altbent>
              <mvz-altbent no="13">
                <template>Tefecilik (madde 241),</template>
              </mvz-altbent>
              <mvz-altbent no="14">
                <template>Zimmet (madde 247),</template>
              </mvz-altbent>
              <mvz-altbent no="15">
                <template>İrtikap (madde 250)</template>
              </mvz-altbent>
              <mvz-altbent no="16">
                <template>Rüşvet (madde 252),</template>
              </mvz-altbent>
              <mvz-altbent no="17">
                <template>Devletin Güvenliğine Karşı Suçlar (madde 302, 303, 304, 305, 306, 307, 308),</template>
              </mvz-altbent>
              <mvz-altbent no="18">
                <template>Anayasal Düzene ve Bu Düzenin İşleyişine Karşı Suçlar (madde 309, 311, 312, 313, 314, 315, 316),</template>
              </mvz-altbent>
              <mvz-altbent no="19">
                <template>Devlet Sırlarına Karşı Suçlar ve Casusluk (madde 328, 329, 330, 331, 333, 334, 335, 336, 337) suçları.</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunda tanımlanan silah kaçakçılığı (madde 12) suçları,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bankalar Kanununun 22 nci maddesinin (3) ve (4) numaralı fıkralarında tanımlanan zimmet suçu,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kaçakçılıkla Mücadele Kanununda tanımlanan ve hapis cezasını gerektiren suçlar,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kültür ve Tabiat Varlıklarını Koruma Kanununun 68 ve 74 üncü maddelerinde tanımlanan suçlar,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Hakkında uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Taşınmaza elkonulması kararı, tapu kütüğüne şerh verilmek suretiyle icra edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kara, deniz ve hava ulaşım araçları hakkında verilen elkoyma kararı, bu araçların kayıtlı bulunduğu sicile şerh verilmek suretiyle icra olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Banka veya diğer malî kurumlardaki her türlü hesaba elkonulması kararı, teknik iletişim araçlarıyla ilgili banka veya malî kuruma derhâl bildirilerek icra olunur. Söz konusu karar, ilgili banka veya malî kuruma ayrıca tebliğ edilir. Elkoyma kararı alındıktan sonra, hesaplar üzerinde yapılan bu kararı etkisiz kılmaya yönelik işlemler geçersizdir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Şirketteki ortaklık paylarına elkoyma kararı, ilgili şirket yönetimine ve şirketin kayıtlı bulunduğu ticaret sicili müdürlüğüne teknik iletişim araçlarıyla derhâl bildirilerek icra olunur. Söz konusu karar, ilgili şirkete ve ticaret sicili müdürlüğüne ayrıca tebliğ edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Hak ve alacaklara elkoyma kararı, ilgili gerçek veya tüzel kişiye teknik iletişim araçlarıyla derhâl bildirilerek icra olunur. Söz konusu karar, ilgili gerçek veya tüzel kişiye ayrıca tebliğ edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Bu madde hükmüne göre alınan elkoyma kararının gereklerine aykırı hareket edilmesi halinde, Türk Ceza Kanununun "Muhafaza görevini kötüye kullanma" başlıklı 289 uncu maddesi hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Bu madde hükümlerine göre elkoymaya ve onuncu fıkra uyarınca kayyım atanmasına ancak hâkim karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Bu madde uyarınca elkonulan taşınmaz, hak ve alacakların idaresi gerektiğinde bu malvarlığı değerlerinin yönetimi amacıyla kayyım atanabilir. Bu durumda 133 üncü madde hükümleri kıyasen uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="128/A" başlık="Bilişim suçlarının işlenmesi suretiyle elde edilen menfaatin bulunduğu hesabın askıya alınması ve elkoyma">
          <mvz-fıkra no="1">
            <template>Türk Ceza Kanununda yer alan;</template>
            <mvz-bent no="a">
              <template>Nitelikli hırsızlık (madde 142, fıkra iki, bent e),</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Nitelikli dolandırıcılık (madde 158, fıkra bir, bent f ve l),</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Banka veya kredi kartlarının kötüye kullanılması (madde 245),</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>suçlarının işlendiği hususunda makul şüphe bulunması halinde banka, ödeme hizmeti sağlayıcısı veya kripto varlık hizmet sağlayıcısı nezdinde veya bunlar aracılığıyla yapılan ya da yapılmaya teşebbüs edilen işlemlere konu suçta kullanılan her türlü hesabın kırksekiz saate kadar askıya alınmasına ilgili banka, ödeme hizmeti sağlayıcısı veya kripto varlık hizmet sağlayıcısı tarafından karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Askıya alma işlemi ve hesap hareketleri, ilgili malî kurum tarafından tüm bilgi ve belgelerle birlikte derhal Cumhuriyet başsavcılığına bildirilir. Askıya alma işlemi ayrıca hesap sahibine de bildirilir. Hesap sahibi, askıya alma işleminin kaldırılması için Cumhuriyet başsavcılığına başvurabilir. Cumhuriyet savcısı, başvuru hakkında yirmidört saat içinde karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Askıya alma işlemi tamamlanmadan suça konu menfaatin başka bir malî kuruma transfer edildiğinin tespit edilmesi halinde bu durum, askıya alma işleminin yapılabilmesi için banka, ödeme hizmeti sağlayıcısı veya kripto varlık hizmet sağlayıcısı tarafından ilgili malî kuruma gecikmeksizin bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birinci fıkra uyarınca malî kurum tarafından askıya alınan veya Cumhuriyet savcısının yazılı emri üzerine askıya alınan hesapta bulunan suça konu menfaate hâkim kararı üzerine veya gecikmesinde sakınca bulunan hallerde Cumhuriyet savcısının yazılı emriyle askıya alma süresi içinde elkonulabilir. Hâkim kararı olmaksızın yapılan elkoyma işlemi yirmidört saat içinde görevli hâkimin onayına sunulur. Hâkim, kararını elkoymadan itibaren kırksekiz saat içinde açıklar; aksi halde elkoyma kendiliğinden kalkar. Bu madde hükümlerine göre elkoyma işlemi yapılabilmesi bakımından 128 inci maddede belirtilen rapor alma şartı aranmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Elkonulan suça konu menfaat, suçtan zarar gören mağdura ait olduğunun anlaşılması halinde soruşturma veya kovuşturma evresinde sahibine iade edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu madde uyarınca askıya alma işlemine karar veren gerçek ve tüzel kişiler, hukukî bakımdan sorumlu tutulmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Yürütülen bir soruşturma veya kovuşturma kapsamında Cumhuriyet savcısı, hâkim veya mahkeme tarafından banka, ödeme hizmeti sağlayıcısı veya kripto varlık hizmet sağlayıcısından istenen bilgi veya belgenin on gün içinde fiziki veya elektronik ortamda gönderilmesi zorunludur. İstenen bilgi veya belgenin gönderilmemesi ya da eksik gönderilmesi halinde Cumhuriyet savcısı tarafından ilgili banka, ödeme hizmeti sağlayıcısı veya kripto varlık hizmet sağlayıcısına elli bin Türk Lirasından üç yüz bin Türk Lirasına kadar idarî para cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>  
        <mvz-madde no="129" başlık="Postada elkoyma">
          <mvz-fıkra no="1">
            <template>Suçun delillerini oluşturduğundan şüphe edilen ve gerçeğin ortaya çıkarılması için soruşturma ve kovuşturmada adliyenin eli altında olması zorunlu sayılıp, posta hizmeti veren her türlü resmî veya özel kuruluşta bulunan gönderilere, hâkimin veya gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısının kararı ile elkonulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkim kararının veya Cumhuriyet savcısının emrinin kendilerine bildirilmesi üzerine elkoyma işlemini yerine getiren kolluk memurları, birinci fıkrada belirtilen gönderilerin içinde bulunduğu zarfları veya paketleri açamazlar. Elkonulan gönderiler, ilgili posta görevlilerinin huzuru ile mühür altına alınıp derhâl elkoyma kararını veya emrini veren hâkim veya Cumhuriyet savcısına teslim edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Elkoyma kararı veya emrinin aşağıda sayılan suçlarla ilgili olarak verilmesi halinde gönderilerin bulunduğu zarf veya paketler Cumhuriyet savcısının talimatıyla kolluk memurları tarafından açılabilir.</template>
            <mvz-bent no="a">
              <template>5237 sayılı Türk Ceza Kanununda yer alan;</template>
              <mvz-altbent no="1">
                <template>Tehlikeli maddelerin izinsiz olarak bulundurulması veya el değiştirmesi (madde 174),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="0">
              <template>suçları.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>10/7/1953 tarihli ve 6136 sayılı Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunun 12 nci ve 13 üncü maddelerinde tanımlanan suçlar.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>21/7/1983 tarihli ve 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanununun 67 nci ve 68 inci maddelerinde tanımlanan suçlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Soruşturma ve kovuşturmanın amacına zarar vermek olasılığı bulunmadıkça, alınmış tedbirler ilgililere bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Açılmamasına veya açılıp da içeriği bakımından adliyenin eli altında tutulmasına gerek bulunmadığına karar verilen gönderiler, hemen ilgililerine teslim olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="130" başlık="Avukat bürolarında arama, elkoyma ve postada elkoyma">
          <mvz-fıkra no="1">
            <template>Avukat büroları ancak mahkeme kararı ile ve kararda belirtilen olayla ilgili olarak Cumhuriyet savcısının denetiminde aranabilir. Baro başkanı veya onu temsil eden bir avukat aramada hazır bulundurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Arama sonucu elkonulmasına karar verilen şeyler bakımından bürosunda arama yapılan avukat, baro başkanı veya onu temsil eden avukat, bunların avukat ile müvekkili arasındaki meslekî ilişkiye ait olduğunu öne sürerek karşı koyduğunda, bu şey ayrı bir zarf veya paket içerisine konularak hazır bulunanlarca mühürlenir ve bu konuda gerekli kararı vermesi, soruşturma evresinde sulh ceza hâkiminden, kovuşturma evresinde hâkim veya mahkemeden istenir. Yetkili hâkim elkonulan şeyin avukatla müvekkili arasındaki meslekî ilişkiye ait olduğunu saptadığında, elkonulan şey derhâl avukata iade edilir ve yapılan işlemi belirten tutanaklar ortadan kaldırılır. Bu fıkrada öngörülen kararlar, yirmidört saat içinde verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Postada elkoyma durumunda bürosunda arama yapılan avukat veya baro başkanı veya onu temsil eden avukatın karşı koyması üzerine ikinci fıkrada belirtilen usuller uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="131" başlık="Elkonulan eşyanın iadesi">
          <mvz-fıkra no="1">
            <template>Şüpheliye, sanığa veya üçüncü kişilere ait elkonulmuş eşyanın, soruşturma ve kovuşturma bakımından muhafazasına gerek kalmaması veya müsadereye tabi tutulmayacağının anlaşılması halinde, re'sen veya istem üzerine geri verilmesine Cumhuriyet savcısı, hâkim veya mahkeme tarafından karar verilir. İstemin reddi kararlarına itiraz edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>128 inci madde hükümlerine göre elkonulan eşya veya diğer malvarlığı değerleri, suçtan zarar gören mağdura ait olması ve bunlara delil olarak artık ihtiyaç bulunmaması halinde, sahibine iade edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="132" başlık="Elkonulan eşyanın muhafazası veya elden çıkarılması">
          <mvz-fıkra no="1">
            <template>Elkonulan eşya, zarara uğraması veya değerinde esaslı ölçüde kayıp meydana gelme tehlikesinin varlığı halinde, hükmün kesinleşmesinden önce elden çıkarılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Elden çıkarma kararı, soruşturma evresinde hâkim, kovuşturma evresinde mahkeme tarafından verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Karar verilmeden önce eşyanın sahibi olan şüpheli, sanık veya ilgili diğer kişiler dinlenir; elden çıkarma kararı, kendilerine bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Elkonulan eşyanın değerinin muhafazası ve zarar görmemesi için gerekli tedbirler alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Elkonulan eşya, soruşturma evresinde Cumhuriyet Başsavcılığı, kovuşturma evresinde mahkeme tarafından, bakım ve gözetimiyle ilgili tedbirleri almak ve istendiğinde derhâl iade edilmek koşuluyla, muhafaza edilmek üzere, şüpheliye, sanığa veya diğer bir kişiye teslim edilebilir. Bu bırakma, teminat gösterilmesi koşuluna da bağlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Elkonulan eşya, delil olarak saklanmasına gerek kalmaması halinde, rayiç değerinin derhâl ödenmesi karşılığında, ilgiliye teslim edilebilir. Bu durumda müsadere kararının konusunu, ödenen rayiç değer oluşturur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="133" başlık="Şirket yönetimi için kayyım tayini">
          <mvz-fıkra no="1">
            <template>Suçun bir şirketin faaliyeti çerçevesinde işlenmekte olduğu hususunda kuvvetli şüphe sebeplerinin varlığı ve maddi gerçeğin ortaya çıkarılabilmesi için gerekli olması halinde; soruşturma ve kovuşturma sürecinde, hâkim veya mahkeme, şirket işlerinin yürütülmesiyle ilgili olarak kayyım atayabilir. Atama kararında, yönetim organının karar ve işlemlerinin geçerliliğinin kayyımın onayına bağlı kılındığı veya yönetim organının yetkilerinin ya da yönetim organının yetkileri ile birlikte ortaklık payları veya menkul kıymetler idare yetkilerinin tümüyle kayyıma verildiği açıkça belirtilir. Kayyım tayinine ilişkin karar, ticaret sicili gazetesinde ve diğer uygun vasıtalarla ilan olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkim veya mahkemenin kayyım hakkında takdir etmiş bulunduğu ücret, şirket bütçesinden karşılanır. Ancak, soruşturma veya kovuşturma konusu suçtan dolayı kovuşturmaya yer olmadığı veya beraat kararının verilmesi halinde; ücret olarak şirket bütçesinden ödenen paranın tamamı, kanunî faiziyle birlikte Devlet Hazinesinden karşılanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İlgililer, atanan kayyımın işlemlerine karşı, görevli mahkemeye 22.11.2001 tarihli ve 4721 sayılı Türk Medeni Kanunu ve 29.6.1956 tarihli ve 6762 sayılı Türk Ticaret Kanunu hükümlerine göre başvurabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu madde hükümleri ancak aşağıda sayılan suçlarla ilgili olarak uygulanabilir.</template>
            <mvz-bent no="a">
              <template>Türk Ceza Kanununda yer alan,</template>
              <mvz-altbent no="1">
                <template>Göçmen kaçakçılığı ve insan ticareti (madde 79, 80),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Parada sahtecilik (madde 197),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Fuhuş (madde 227),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Kumar oynanması için yer ve imkân sağlama (madde 228),</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Zimmet (madde 247),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Suçtan kaynaklanan malvarlığı değerlerini aklama (madde 282),</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>Silahlı örgüt (madde 314) veya bu örgütlere silah sağlama (madde 315),</template>
              </mvz-altbent>
              <mvz-altbent no="9">
                <template>Devlet Sırlarına Karşı Suçlar ve Casusluk (madde 328, 329, 330, 331, 333, 334, 335, 336, 337),</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="0">
              <template>Suçları,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ateşli Silahlar ve Bıçaklar İle Diğer Aletler Hakkında Kanunda tanımlanan silah kaçakçılığı (madde 12) suçları,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bankalar Kanununun 22 nci maddesinin (3) ve (4) numaralı fıkralarında tanımlanan zimmet suçu,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kaçakçılıkla Mücadele Kanununda tanımlanan ve hapis cezasını gerektiren suçlar,</template>
            </mvz-bent>
            <mvz-bent no="e">
