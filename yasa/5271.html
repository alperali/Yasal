              <template>13/12/1968 tarihli ve 1072 sayılı Rulet, Tilt, Langırt ve Benzeri Oyun Alet ve Makinaları Hakkında Kanunun 2 nci maddesinde belirtilen suç.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>24/4/1969 tarihli ve 1163 sayılı Kooperatifler Kanununun ek 2 nci maddesinin birinci fıkrasının (1) numaralı bendinde belirtilen suç.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhuriyet savcısı veya kolluk görevlileri, şüpheliyi, seri muhakeme usulü hakkında bilgilendirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cumhuriyet savcısı tarafından seri muhakeme usulünün uygulanması şüpheliye teklif edilir ve şüphelinin müdafii huzurunda teklifi kabul etmesi hâlinde bu usul uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cumhuriyet savcısı, Türk Ceza Kanununun 61 inci maddesinin birinci fıkrasında belirtilen hususları göz önünde bulundurarak, suçun kanuni tanımında öngörülen cezanın alt ve üst sınırı arasında tespit edeceği temel cezadan ve koşulları bulunduğu takdirde zincirleme suça ilişkin hükümler uygulandıktan sonra belirlenen cezadan yarı oranında indirim uygulamak suretiyle yaptırımı belirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Dördüncü fıkra uyarınca sonuç olarak belirlenen hapis cezası Cumhuriyet savcısı tarafından, koşulları bulunması hâlinde Türk Ceza Kanununun 50 nci maddesine göre seçenek yaptırımlara çevrilebilir veya 51 inci maddesine göre ertelenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu maddeye göre belirlenen yaptırımlar hakkında, Cumhuriyet savcısı tarafından, koşulları bulunması hâlinde 231 inci madde kıyasen uygulanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu madde kapsamında yaptırım uygulanması, güvenlik tedbirlerine ilişkin hükümlerin uygulanmasına engel teşkil etmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Cumhuriyet savcısı, şüpheli hakkında seri muhakeme usulünün uygulanmasını yazılı olarak görevli mahkemeden talep eder. Talep yazısında;</template>
            <mvz-bent no="a">
              <template>Şüphelinin kimliği ve müdafii,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Mağdur veya suçtan zarar görenlerin kimliği ile varsa vekili veya kanuni temsilcisi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İsnat olunan suç ve ilgili kanun maddeleri,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>İsnat olunan suçun işlendiği yer, tarih ve zaman dilimi,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Şüphelinin tutuklu olup olmadığı; tutuklanmış ise, gözaltına alma ve tutuklama tarihleri ile bunların süreleri,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>İsnat olunan suçu oluşturan olayların özeti,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Üçüncü fıkrada belirtilen şartların gerçekleştiği,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Belirlenen yaptırım ile beşinci ve altıncı fıkra uygulanmış ise bunlara ilişkin hususlar ve güvenlik tedbirleri,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>gösterilir.  Bu fıkraya aykırı olarak düzenlendiği, belirlenen yaptırımda maddi hata yapıldığı, yaptırım hakkında 231 inci veya Türk Ceza Kanununun 50 nci ve 51 inci maddelerinin uygulanmasında objektif koşulların gerçekleşmediği ya da teklif edilen cezanın mahiyetine uygun bir güvenlik tedbiri belirtilmediği anlaşılan talep yazısı, eksikliklerin tamamlanması amacıyla mahkemece Cumhuriyet başsavcılığına iade edilir. Cumhuriyet savcısı tarafından eksiklikler tamamlandıktan ve hatalı noktalar düzeltildikten sonra talep yazısı yeniden düzenlenerek mahkemeye gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Mahkeme, şüpheliyi müdafii huzurunda dinledikten sonra üçüncü fıkradaki şartların gerçekleştiği, eylemin seri muhakeme usulü kapsamında olduğu ve dosyadaki mevcut delillere göre mahkûmiyet kararı verilmesi gerektiği kanaatine varırsa talep yazısında belirtilen yaptırımdan daha ağır olmamak üzere dört ila yedinci fıkra hükümleri doğrultusunda hüküm kurar; aksi takdirde talebi reddeder ve soruşturmanın genel hükümlere göre sonuçlandırılması amacıyla dosyayı Cumhuriyet başsavcılığına gönderir. Mazeretsiz olarak mahkemeye gelmeyen şüpheli, bu usulden vazgeçmiş sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Seri muhakeme usulünün herhangi bir sebeple tamamlanamaması veya soruşturmanın genel hükümlere göre sonuçlandırılması amacıyla Cumhuriyet başsavcılığına gönderilmesi hâllerinde, şüphelinin seri muhakeme usulünü kabul ettiğine ilişkin beyanları ile bu usulün uygulanmasına dair diğer belgeler, takip eden soruşturma ve kovuşturma işlemlerinde delil olarak kullanılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>Suçun iştirak hâlinde işlenmesi durumunda şüphelilerden birinin bu usulün uygulanmasını kabul etmemesi hâlinde seri muhakeme usulü uygulanmaz.  Seri muhakeme usulü, bu kapsama giren bir suçun, kapsama girmeyen başka bir suçla birlikte işlenmiş olması hâlinde uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="12">
            <template>Seri muhakeme usulü, yaş küçüklüğü ve akıl hastalığı  hâllerinde uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="13">
            <template>Resmî mercilere beyan edilmiş olup da soruşturma dosyasında yer alan adreste bulunmama veya yurt dışında olma ya da başka bir nedenle şüpheliye ulaşılamaması hâlinde, seri muhakeme usulü uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="14">
            <template>Dokuzuncu fıkra kapsamında mahkemece kurulan hükme itiraz edilebilir. İtiraz mercii, itirazı üçüncü ve dokuzuncu fıkralardaki şartlar yönünden inceler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="15">
            <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Adalet Bakanlığı tarafından çıkarılan yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="251" başlık="Basit yargılama usulü">
          <mvz-fıkra no="1">
            <template>Asliye ceza mahkemesince, iddianamenin kabulünden sonra adli para cezasını ve/veya üst sınırı iki yıl veya daha az süreli hapis cezasını gerektiren suçlarda basit yargılama usulünün uygulanmasına karar verilebilir.  175 inci maddenin ikinci fıkrası uyarınca duruşma günü belirlendikten sonra basit yargılama usulü uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Basit yargılama usulünün uygulanmasına karar verildiği takdirde mahkemece iddianame; sanık, mağdur ve şikâyetçiye tebliğ edilerek, beyan ve savunmalarını iki hafta içinde yazılı olarak bildirmeleri istenir. Tebligatta duruşma yapılmaksızın hüküm verilebileceği hususu da belirtilir. Ayrıca, toplanması gereken belgeler, ilgili kurum ve kuruluşlardan talep edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Beyan ve savunma için verilen süre dolduktan sonra mahkemece duruşma yapılmaksızın ve Cumhuriyet savcısının görüşü alınmaksızın, Türk Ceza Kanununun 61 inci maddesi dikkate alınmak suretiyle, 223 üncü maddede belirtilen kararlardan birine hükmedilebilir. Mahkûmiyet kararı verildiği takdirde sonuç ceza dörtte bir oranında indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Mahkemece, koşulları bulunması hâlinde; kısa süreli hapis cezası seçenek yaptırımlara çevrilebilir veya hapis cezası ertelenebilir ya da uygulanmasına sanık tarafından yazılı olarak karşı çıkılmaması kaydıyla hükmün açıklanmasının geri bırakılmasına karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Hükümde itiraz usulü ile itirazın sonuçları belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Mahkemece gerekli görülmesi hâlinde bu madde uyarınca hüküm verilinceye kadar her aşamada duruşma açmak suretiyle genel hükümler uyarınca yargılamaya devam edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Basit yargılama usulü, yaş küçüklüğü, akıl hastalığı,  hâlleri ile soruşturma veya kovuşturma yapılması izne ya da talebe bağlı olan suçlar hakkında uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Basit yargılama usulü, bu kapsama giren bir suçun, kapsama girmeyen başka bir suçla birlikte işlenmiş olması hâlinde uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="252" başlık="Basit yargılama usulünde itiraz">
          <mvz-fıkra no="1">
            <template>251 inci madde uyarınca verilen hükümlere karşı itiraz edilebilir. Süresi içinde itiraz edilmeyen hükümler kesinleşir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İtiraz üzerine hükmü veren mahkemece dosya, o yerde birden fazla asliye ceza mahkemesi bulunması hâlinde tevzi kriterlerine göre belirlenen asliye ceza mahkemesine gönderilir ve bu mahkemece duruşma açılarak genel hükümlere göre yargılamaya devam olunur. Tek asliye ceza mahkemesinin bulunduğu yerlerde ise, aynı mahkemede yetkili başka bir hakim varsa bu hakim tarafından; aksi hâlde adli yargı ilk derece mahkemesi adalet komisyonu başkanınca görevlendirilen hakim tarafından duruşma açılır ve genel hükümlere göre yargılamaya devam olunur. Taraflar gelmese bile duruşma yapılır ve yokluklarında 223 üncü madde uyarınca hüküm verilebilir. Taraflara gönderilecek davetiyede bu husus yazılır. Duruşmadan önce itirazdan vazgeçilmesi hâlinde duruşma yapılmaz ve itiraz edilmemiş sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkeme, ikinci fıkra uyarınca hüküm verirken, 251 inci madde kapsamında basit yargılama usulüne göre verilen hükümle bağlı değildir. Ancak, itirazın sanık dışındaki kişiler tarafından yapıldığı hâllerde 251 inci maddenin üçüncü fıkrası uyarınca indirim uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İtiraz üzerine verilen hükmün sanık lehine olması hâlinde, bu hususların itiraz etmemiş olan diğer sanıklara da uygulanma olanağı varsa bu sanıklar da itiraz etmiş gibi verilen kararlardan yararlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İkinci fıkra uyarınca verilen hükümlere karşı genel hükümlere göre kanun yoluna başvurulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Birinci fıkradaki itirazın, süresinde yapılmadığı veya kanun yoluna başvuru hakkı bulunmayan tarafından yapıldığı mahkemesince değerlendirildiğinde dosya, 268 inci maddenin ikinci fıkrası uyarınca itirazı incelemeye yetkili olan mercie gönderilir. Mercii bu sebepler yönünden incelemesini yapar ve kararını gereği için mahkemesine gönderir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Birinci fıkradaki itirazın, yargılama giderine, vekâlet ücretine veya maddi hataya ilişkin olması hâlinde 268 inci maddenin ikinci fıkrası hükmü uygulanır. Mercii bu sebepler yönünden incelemesini yapar ve kararını gereği için mahkemesine gönderir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Uzlaşma ve Müsadere">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Uzlaşma">
        <mvz-madde no="253" başlık="Uzlaştırma">
          <mvz-fıkra no="1">
            <template>Aşağıdaki suçlarda, şüpheli ile mağdur veya suçtan zarar gören gerçek veya özel hukuk tüzel kişisinin uzlaştırılması girişiminde bulunulur:</template>
            <mvz-bent no="a">
              <template>Soruşturulması ve kovuşturulması şikâyete bağlı suçlar.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Şikâyete bağlı olup olmadığına bakılmaksızın, Türk Ceza Kanununda yer alan;</template>
              <mvz-altbent no="1">
                <template>Kasten yaralama (üçüncü fıkra hariç, madde 86; madde 88),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Taksirle yaralama (madde 89),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Tehdit (madde 106, birinci fıkra),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Konut dokunulmazlığının ihlali (madde 116),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>İş ve çalışma hürriyetinin ihlali (madde 117, birinci fıkra; madde 119, birinci fıkra (c) bendi),</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Hırsızlık (madde 141),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Güveni kötüye kullanma (üçüncü fıkra hariç, madde 155),</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>Dolandırıcılık (madde 157),</template>
              </mvz-altbent>
              <mvz-altbent no="9">
                <template>Suç eşyasının satın alınması veya kabul edilmesi (madde 165),</template>
              </mvz-altbent>
              <mvz-altbent no="10">
                <template>Çocuğun kaçırılması ve alıkonulması (madde 234),</template>
              </mvz-altbent>
              <mvz-altbent no="11">
                <template>Ticari sır, bankacılık sırrı veya müşteri sırrı niteliğindeki bilgi veya belgelerin açıklanması (dördüncü fıkra hariç, madde 239),</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="0">
              <template>suçları.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Mağdurun veya suçtan zarar görenin gerçek veya özel hukuk tüzel kişisi olması koşuluyla, suça sürüklenen çocuklar bakımından ayrıca, üst sınırı üç yılı geçmeyen hapis veya adli para cezasını gerektiren suçlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturulması ve kovuşturulması şikâyete bağlı olanlar hariç olmak üzere; diğer kanunlarda yer alan suçlarla ilgili olarak uzlaştırma yoluna gidilebilmesi için, kanunda açık hüküm bulunması gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Soruşturulması ve kovuşturulması şikâyete bağlı olsa bile, cinsel dokunulmazlığa karşı suçlarda, ısrarlı takip suçunda (madde 123/A) ve hakaret suçunda (madde 125) uzlaştırma yoluna gidilemez.  Uzlaştırma kapsamına giren bir suçun, bu kapsama girmeyen bir başka suçla birlikte aynı mağdura karşı işlenmiş olması hâlinde de uzlaşma hükümleri uygulanmaz. Ancak önödeme kapsamına giren bir suç ile uzlaştırma kapsamına giren bir suçun birlikte aynı mağdura karşı işlenmiş olması hâlinde uzlaştırma kapsamındaki suç bakımından uzlaşma hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Soruşturma konusu suçun uzlaşmaya tâbi olması ve kamu davası açılması için yeterli şüphenin bulunması hâlinde, dosya uzlaştırma bürosuna gönderilir. Büro tarafından görevlendirilen uzlaştırmacı, şüpheli ile mağdur veya suçtan zarar görene uzlaşma teklifinde bulunur. Şüphelinin, mağdurun veya suçtan zarar görenin reşit olmaması halinde, uzlaşma teklifi kanunî temsilcilerine yapılır. Uzlaştırmacı, uzlaşma teklifini açıklamalı tebligat veya istinabe yoluyla da yapabilir. Şüpheli, mağdur veya suçtan zarar gören, kendisine uzlaşma teklifinde bulunulduktan itibaren yedi gün içinde kararını bildirmediği takdirde, teklifi reddetmiş sayılır. 98</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Uzlaşma teklifinde bulunulması halinde, kişiye uzlaşmanın mahiyeti ve uzlaşmayı kabul veya reddetmesinin hukukî sonuçları anlatılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Resmî mercilere beyan edilmiş olup da soruşturma dosyasında yer alan adreste bulunmama veya yurt dışında olma ya da başka bir nedenle mağdura, suçtan zarar görene, şüpheliye veya bunların kanunî temsilcisine ulaşılamaması halinde, uzlaştırma yoluna gidilmeksizin soruşturma sonuçlandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Birden fazla kişinin mağduriyetine veya zarar görmesine sebebiyet veren bir suçtan dolayı uzlaştırma yoluna gidilebilmesi için, mağdur veya suçtan zarar görenlerin hepsinin uzlaşmayı kabul etmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Uzlaşma teklifinde bulunulması veya teklifin kabul edilmesi, soruşturma konusu suça ilişkin delillerin toplanmasına ve koruma tedbirlerinin uygulanmasına engel değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Bu Kanunda belirlenen hâkimin davaya bakamayacağı haller ile reddi sebepleri, uzlaştırmacı görevlendirilmesi ile ilgili olarak göz önünde bulundurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>Görevlendirilen uzlaştırmacıya soruşturma dosyasında yer alan ve Cumhuriyet savcısınca uygun görülen belgelerin birer örneği verilir. Uzlaştırma bürosu uzlaştırmacıya, soruşturmanın gizliliği ilkesine uygun davranmakla yükümlü olduğunu hatırlatır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="12">
            <template>Uzlaştırmacı, dosya içindeki belgelerin birer örneği kendisine verildikten itibaren en geç otuz gün içinde uzlaştırma işlemlerini sonuçlandırır. Uzlaştırma bürosu bu süreyi her defasında yirmi günü geçmemek üzere en fazla iki kez daha uzatabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="13">
            <template>Uzlaştırma müzakereleri gizli olarak yürütülür. Uzlaştırma müzakerelerine şüpheli, mağdur, suçtan zarar gören, kanunî temsilci, müdafi ve vekil katılabilir. Şüpheli, mağdur veya suçtan zarar görenin kendisi veya kanunî temsilcisi ya da vekilinin müzakerelere katılmaktan imtina etmesi halinde, uzlaşmayı kabul etmemiş sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="14">
            <template>Uzlaştırmacı, müzakereler sırasında izlenmesi gereken yöntemle ilgili olarak Cumhuriyet savcısıyla görüşebilir; Cumhuriyet savcısı, uzlaştırmacıya talimat verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="15">
            <template>Uzlaşma müzakereleri sonunda uzlaştırmacı, bir rapor hazırlayarak kendisine verilen belge örnekleriyle birlikte uzlaştırma bürosuna verir. Uzlaşmanın gerçekleşmesi halinde, tarafların imzalarını da içeren raporda, ne suretle uzlaşıldığı ayrıntılı olarak açıklanır.  Uzlaştırma bürosu soruşturma dosyasını, raporu ve varsa yazılı anlaşmayı Cumhuriyet savcısına gönderir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="16">
            <template>Uzlaşma teklifinin reddedilmesine rağmen, şüpheli ile mağdur veya suçtan zarar gören uzlaştıklarını gösteren belge ile en geç iddianamenin düzenlendiği tarihe kadar Cumhuriyet savcısına başvurarak uzlaştıklarını beyan edebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="17">
            <template>Cumhuriyet savcısı, uzlaşmanın, tarafların özgür iradelerine dayandığını ve edimin hukuka uygun olduğunu belirlerse raporu veya belgeyi mühür ve imza altına alarak soruşturma dosyasında muhafaza eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="18">
            <template>Uzlaştırmanın sonuçsuz kalması halinde tekrar uzlaştırma yoluna gidilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="19">
            <template>Uzlaşma sonucunda şüphelinin edimini def’aten yerine getirmesi halinde, hakkında kovuşturmaya yer olmadığı kararı verilir. Edimin yerine getirilmesinin ileri tarihe bırakılması, takside bağlanması veya süreklilik arzetmesi halinde, 171 inci maddedeki şartlar aranmaksızın, şüpheli hakkında kamu davasının açılmasının ertelenmesi kararı verilir. Erteleme süresince zamanaşımı işlemez. Kamu davasının açılmasının ertelenmesi kararından sonra, uzlaşmanın gereklerinin yerine getirilmemesi halinde, 171 inci maddenin dördüncü fıkrasındaki şart aranmaksızın, kamu davası açılır.  Uzlaşmanın sağlanması halinde, uzlaşma anında tespit edilemeyen veya uzlaşmadan sonra ortaya çıkan zararlar hariç, soruşturma konusu suç nedeniyle tazminat davası açılamaz; açılmış olan davadan feragat edilmiş sayılır. Şüphelinin, edimini yerine getirmemesi halinde uzlaşma raporu veya belgesi, 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanununun 38 inci maddesinde yazılı ilam mahiyetini haiz belgelerden sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="20">
            <template>Uzlaştırma müzakereleri sırasında yapılan açıklamalar, herhangi bir soruşturma ve kovuşturmada ya da davada delil olarak kullanılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="21">
            <template>Şüpheli, mağdur veya suçtan zarar görenden birine ilk uzlaşma teklifinde bulunulduğu tarihten itibaren, uzlaştırma girişiminin sonuçsuz kaldığı ve en geç, uzlaştırmacının raporunu düzenleyerek uzlaştırma bürosuna verdiği tarihe kadar dava zamanaşımı ile kovuşturma koşulu olan dava süresi işlemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="22">
            <template>Uzlaştırmacıya Adalet Bakanlığı tarafından belirlenen tarifeye göre ücret ödenir. Uzlaştırmacı ücreti ve diğer uzlaştırma giderleri, yargılama giderlerinden sayılır. Uzlaşmanın gerçekleşmesi halinde bu giderler Devlet Hazinesi tarafından karşılanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="23">
            <template>Uzlaşma sonucunda verilecek kararlarla ilgili olarak bu Kanunda öngörülen kanun yollarına başvurulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="24">
            <template>Her Cumhuriyet başsavcılığı bünyesinde uzlaştırma bürosu kurulur ve yeteri kadar Cumhuriyet savcısı ile personel görevlendirilir. Uzlaştırmacılar, hukuk fakültesi mezunlarının yer aldığı, Adalet Bakanlığı tarafından belirlenen uzlaştırmacı listelerinden görevlendirilir. Uzlaştırmacı, hazırladığı raporu, tutanakları ve varsa yazılı anlaşmayı büroya gönderir. Uzlaştırma süreci sonunda soruşturma dosyaları, uzlaştırma bürosunda görevli Cumhuriyet savcıları tarafından sonuçlandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="25">
            <template>Uzlaştırmacıların nitelikleri, eğitimi, sınavı, görev ve sorumlulukları, denetimi, eğitim verecek kişi, kurum ve kuruluşların nitelikleri ve denetimleri ile uzlaştırmacı sicili, uzlaştırmacılar ve eğitim kurumlarının listelerinin düzenlenmesi, Cumhuriyet başsavcılığı bünyesinde kurulan uzlaştırma bürolarının çalışma usul ve esasları, uzlaştırma teklifi ile müzakere usulü, uzlaştırma anlaşması ve raporda yer alacak konular ile uygulamaya dair diğer hususlara ilişkin usul ve esaslar, Adalet Bakanlığınca çıkarılan yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="254" başlık="Mahkeme tarafından uzlaştırma">
          <mvz-fıkra no="1">
            <template>Kamu davası açıldıktan sonra kovuşturma konusu suçun uzlaşma kapsamında olduğunun anlaşılması halinde, kovuşturma dosyası, uzlaştırma işlemlerinin 253 üncü maddede belirtilen esas ve usûle göre yerine getirilmesi için uzlaştırma bürosuna gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Uzlaşma gerçekleştiği takdirde, mahkeme, uzlaşma sonucunda sanığın edimini def’aten yerine getirmesi halinde, davanın düşmesine karar verir. Edimin yerine getirilmesinin ileri tarihe bırakılması, takside bağlanması veya süreklilik arzetmesi halinde durma kararı verilir. Durma süresince zamanaşımı işlemez. Uzlaşmanın gereklerinin yerine getirilmemesi halinde, mahkemece yargılamaya kaldığı yerden devam olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="255" başlık="Birden çok fail bulunması hâlinde uzlaşma">
          <mvz-fıkra no="1">
            <template>Aralarında iştirak ilişkisi olsun veya olmasın birden çok kişi tarafından işlenen suçlarda, ancak uzlaşan kişi uzlaşmadan yararlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Müsadere Usulü">
        <mvz-madde no="256" başlık="Başvuru">
          <mvz-fıkra no="1">
            <template>Müsadere kararı verilmesi gereken hâllerde, kamu davası açılmamış veya kamu davası açılmış olup da esasla beraber bir karar verilmemişse; karar verilmesi için, Cumhuriyet savcısı veya katılan, davayı görmeye yetkili mahkemeye başvurabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kamu davası açılmış olup da iade edilmesi gereken eşya veya malvarlığı değerleri ile ilgili olarak esasla birlikte bir karar verilmemiş olması durumunda, mahkemece re'sen veya ilgililerin istemi üzerine bunların iadesine karar verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="257" başlık="Duruşma ve karar">
          <mvz-fıkra no="1">
            <template>256 ncı maddeye göre verilmesi gereken kararlar, duruşmalı olarak verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Müsadere veya iade olunacak eşya veya diğer malvarlığı değerleri üzerinde hakkı olan kimseler de duruşmaya çağrılır. Bu kişiler, sanığın sahip olduğu hakları kullanabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Çağrıya uymamaları, işlemin ertelenmesine neden olmaz ve hükmün verilmesini engellemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="258" başlık="Kanun yolu">
          <mvz-fıkra no="1">
            <template>256 ncı maddeye göre verilecek hükümlere karşı Cumhuriyet savcısı, katılan ve 257 nci maddede belirlenen kişiler için istinaf yolu açıktır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="259" başlık="Suç konusu olmayan eşyanın müsaderesi">
          <mvz-fıkra no="1">
            <template>Suç konusu olmayıp sadece müsadereye tâbi bulunan eşyanın müsaderesine sulh ceza hâkimi tarafından duruşma yapılmaksızın karar verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="6-ALTINCI" başlık="Kanun Yolları">
    <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-madde no="260" başlık="Kanun yollarına başvurma hakkı">
        <mvz-fıkra no="1">
          <template>Hâkim ve mahkeme kararlarına karşı Cumhuriyet savcısı, şüpheli, sanık ve bu Kanuna göre katılan sıfatını almış olanlar ile katılma isteği karara bağlanmamış, reddedilmiş veya katılan sıfatını alabilecek surette suçtan zarar görmüş bulunanlar için kanun yolları açıktır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ağır ceza mahkemelerinde bulunan Cumhuriyet savcıları, ağır ceza mahkemesinin yargı çevresindeki asliye ceza mahkemelerinin; bölge adliye mahkemesinde bulunan Cumhuriyet savcıları, bölge adliye mahkemelerinin kararlarına karşı kanun yollarına başvurabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Cumhuriyet savcısı, sanık lehine olarak da kanun yollarına başvurabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="261" başlık="Avukatın başvurma hakkı">
        <mvz-fıkra no="1">
          <template>Avukat, müdafiliğini veya vekilliğini üstlendiği kişilerin açık arzusuna aykırı olmamak koşuluyla kanun yollarına başvurabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="262" başlık="Yasal temsilcinin ve eşin başvurma hakkı">
        <mvz-fıkra no="1">
          <template>Şüpheli veya sanığın yasal temsilcisi ve eşi, şüpheli veya sanığa açık olan kanun yollarına süresi içinde kendiliklerinden başvurabilirler. Şüphelinin veya sanığın başvurusuna ilişkin hükümler, bunlar tarafından yapılacak başvuru ve onu izleyen işlemler için de geçerlidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="263" başlık="Tutuklunun kanun yollarına başvurması">
        <mvz-fıkra no="1">
          <template>Tutuklu bulunan şüpheli veya sanık, zabıt kâtibine veya tutuklu bulunduğu ceza infaz kurumu ve tutukevi müdürüne beyanda bulunmak suretiyle veya bu hususta bir dilekçe vererek kanun yollarına başvurabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Zabıt kâtibine başvuru hâlinde, kanun yollarına başvuru beyanı veya dilekçesi ilgili deftere kaydedildikten sonra bu hususları belirten bir tutanak düzenlenerek tutuklu bulunan şüpheli veya sanığa bir örneği verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kurum müdürüne başvuru hâlinde ikinci fıkra hükmüne göre işlem yapılarak, tutanak ve dilekçe derhâl ilgili mahkemeye gönderilir. Zabıt kâtibi başvuruyu ilgili deftere kaydeder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Zabıt kâtibi veya kurum müdürü tarafından ikinci fıkra hükmüne göre işlem yapıldığı zaman kanun yolları için bu Kanunda belirlenen süreler kesilmiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="264" başlık="Kanun yolunun belirlenmesinde yanılma">
        <mvz-fıkra no="1">
          <template>Kabul edilebilir bir başvuruda kanun yolunun veya merciin belirlenmesinde yanılma, başvuranın haklarını ortadan kaldırmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu hâlde başvurunun yapıldığı merci, başvuruyu derhâl görevli ve yetkili olan mercie gönderir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="265" başlık="Cumhuriyet savcısının başvuru sonucunun kapsamı">
        <mvz-fıkra no="1">
          <template>Cumhuriyet savcısı tarafından aleyhine kanun yoluna gidilen karar, sanık lehine bozulabilir veya değiştirilebilir. Cumhuriyet savcısı, kanun yoluna sanık lehine başvurduğunda, yeniden verilen hüküm önceki hükümde tayin edilmiş olan cezadan daha ağır bir cezayı içeremez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="266" başlık="Başvurudan vazgeçilmesi ve etkisi">
        <mvz-fıkra no="1">
          <template>Kanun yoluna başvurulduktan sonra bundan vazgeçilmesi, mercii tarafından karar verilinceye kadar geçerlidir. Ancak, Cumhuriyet savcısı tarafından sanık lehine yapılan başvurudan onun rızası olmaksızın vazgeçilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Müdafiin veya vekilin başvurudan vazgeçebilmesi, vekâletnamede bu hususta özel yetkili kılınmış olması koşuluna bağlıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>150 nci maddenin ikinci fıkrası uyarınca, kendisine müdafi atanan şüpheli veya sanıklar yararına kanun yoluna başvurulduğunda veya başvurulan kanun yolundan vazgeçildiğinde şüpheli veya sanık ile müdafiin iradesi çelişirse müdafiin iradesi geçerli sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Olağan Kanun Yolları">
      <mvz-bölüm no="1-BİRİNCİ" başlık="İtiraz">
        <mvz-madde no="267" başlık="İtiraz olunabilecek kararlar">
          <mvz-fıkra no="1">
            <template>Hâkim kararları ile kanunun gösterdiği hâllerde, mahkeme kararlarına karşı itiraz yoluna gidilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="268" başlık="İtiraz usulü ve inceleme mercileri">
          <mvz-fıkra no="1">
            <template>Hâkim veya mahkeme kararına karşı itiraz, kanunun ayrıca hüküm koymadığı hâllerde 35 inci maddeye göre ilgililerin kararı öğrendiği günden itibaren iki hafta içinde kararı veren mercie verilecek bir dilekçe veya tutanağa geçirilmek koşulu ile zabıt kâtibine beyanda bulunmak suretiyle yapılır. Tutanakla tespit edilen beyanı ve imzayı mahkeme başkanı veya hâkim onaylar. 263 üncü madde hükmü saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kararına itiraz edilen hâkim veya mahkeme, itirazı yerinde görürse kararını düzeltir; yerinde görmezse en çok üç gün içinde, itirazı incelemeye yetkili olan mercie gönderir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İtirazı incelemeye yetkili merciler aşağıda gösterilmiştir:</template>
            <mvz-bent no="a">
              <template>Sulh ceza hâkimliği kararlarına yapılan itirazların incelenmesi, o yerde birden fazla sulh ceza hâkimliğinin bulunması hâlinde, numara olarak kendisini izleyen hâkimliğe; son numaralı hâkimlik için bir numaralı hâkimliğe; ağır ceza mahkemesinin bulunmadığı yerlerde tek sulh ceza hâkimliği varsa, yargı çevresinde görev yaptığı ağır ceza mahkemesinin bulunduğu yerdeki sulh ceza hâkimliğine; ağır ceza mahkemesinin bulunduğu yerlerde tek sulh ceza hâkimliği varsa, en yakın ağır ceza mahkemesinin bulunduğu yerdeki sulh ceza hâkimliğine aittir.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Sulh ceza hâkimliğinin tutuklama ve adli kontrole ilişkin verdiği kararlara karşı yapılan itirazların incelenmesi, yargı çevresinde bulunduğu asliye ceza mahkemesi hâkimine aittir. İtirazı incelemeye yetkili mercilerin farklı olduğu hâllerde, itirazların gecikmeksizin incelenmesi amacıyla, kararına itiraz edilen sulh ceza hâkimliği tarafından gerekli tedbirler alınır. Sulh ceza hâkimliği işleri, asliye ceza hâkimi tarafından görülüyorsa itirazı inceleme yetkisi ağır ceza mahkemesi başkanına aittir.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Asliye ceza mahkemesi hâkimi tarafından verilen kararlara yapılacak itirazların incelenmesi, yargı çevresinde bulundukları ağır ceza mahkemesine ve bu mahkeme ile başkanı tarafından verilen kararlar hakkındaki itirazların incelenmesi, o yerde ağır ceza mahkemesinin birden çok dairesinin bulunması hâlinde, numara olarak kendisini izleyen daireye; son numaralı daire için birinci daireye; o yerde ağır ceza mahkemesinin tek dairesi varsa, en yakın ağır ceza mahkemesine aittir.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Naip hâkim kararlarına yapılacak itirazların incelenmesi, mensup oldukları ağır ceza mahkemesi başkanına, istinabe olunan mahkeme kararlarına karşı yukarıdaki bentlerde belirtilen esaslara göre bulundukları yerdeki mahkeme başkanı veya mahkemeye aittir.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Bölge adliye mahkemesi ceza dairelerinin kararları ile Yargıtay ceza dairelerinin esas mahkeme olarak baktıkları davalarda verdikleri kararlara yapılan itirazlarda; üyenin kararını görevli olduğu dairenin başkanı, daire başkanı ile ceza dairesinin kararını numara itibarıyla izleyen ceza dairesi; son numaralı daire söz konusu ise birinci ceza dairesi inceler.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="269" başlık="İtirazın kararın yerine getirilmesinde etkisi">
          <mvz-fıkra no="1">
            <template>İtiraz, kararın yerine getirilmesinin geri bırakılması sonucunu doğurmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ancak, kararına itiraz edilen makam veya kararı inceleyecek merci, geri bırakılmasına karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="270" başlık="İtirazın Cumhuriyet savcısına ve karşı tarafa tebliği ile inceleme ve araştırma yapılması">
          <mvz-fıkra no="1">
            <template>İtirazı inceleyecek merci, yazı ile cevap verebilmesi için itirazı, Cumhuriyet savcısı ve karşı tarafa bildirebilir. Merci, inceleme ve araştırma yapabileceği gibi gerekli gördüğünde bunların yapılmasını da emredebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>101 ve 105 inci maddeler uyarınca yapılan itiraz üzerine Cumhuriyet savcısından görüş alınması durumunda, bu görüş şüpheli, sanık veya müdafiine bildirilir. Şüpheli, sanık veya müdafii üç gün içinde görüşünü bildirebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="271" başlık="Karar">
          <mvz-fıkra no="1">
            <template>Kanunda yazılı olan hâller saklı kalmak üzere, itiraz hakkında duruşma yapılmaksızın karar verilir. Ancak, gerekli görüldüğünde Cumhuriyet savcısı ve sonra müdafi veya vekil dinlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İtiraz yerinde görülürse merci, aynı zamanda itiraz konusu hakkında da karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Karar mümkün olan en kısa sürede verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Merciin, itiraz üzerine verdiği kararları kesindir; ancak ilk defa merci tarafından verilen tutuklama kararlarına karşı itiraz yoluna gidilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="İstinaf">
        <mvz-madde no="272" başlık="İstinaf">
          <mvz-fıkra no="1">
            <template>İlk derece mahkemelerinden verilen hükümlere karşı istinaf yoluna başvurulabilir. Ancak, onbeş yıl ve daha fazla hapis cezalarına ilişkin hükümler, bölge adliye mahkemesince re'sen incelenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümden önce verilip hükme esas teşkil eden veya başkaca kanun yolu öngörülmemiş olan mahkeme kararlarına karşı da hükümle birlikte istinaf yoluna başvurulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ancak;</template>
            <mvz-bent no="a">
              <template>Hapis cezasından çevrilen adlî para cezaları hariç olmak üzere, sonuç olarak belirlenen onbeşbin Türk Lirası dâhil adlî para cezasına mahkûmiyet hükümlerine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Üst sınırı beşyüz günü geçmeyen adlî para cezasını gerektiren suçlardan beraat hükümlerine,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kanunlarda kesin olduğu yazılı bulunan hükümlere,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Karşı istinaf yoluna başvurulamaz.  Bu suretle verilen hükümler tekerrüre esas olmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="273" başlık="İstinaf istemi ve süresi">
          <mvz-fıkra no="1">
            <template>İstinaf istemi, hükmün gerekçesiyle birlikte tebliğ edildiği tarihten itibaren iki hafta içinde hükmü veren mahkemeye bir dilekçe verilmesi veya zabıt kâtibine bir beyanda bulunulması suretiyle yapılır; beyan tutanağa geçirilir ve tutanak hâkime onaylattırılır. Tutuklu sanık hakkında 263 üncü madde hükmü saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ağır ceza mahkemelerinde bulunan Cumhuriyet savcıları, mahkemelerinin yargı çevresi içerisindeki asliye mahkemelerinin hükümlerine karşı, kararın o yer Cumhuriyet başsavcılığına geliş tarihinden itibaren iki hafta içinde istinaf yoluna başvurabilirler.107</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Sanık ve bu Kanuna göre katılan sıfatını almış olanlar ile katılma isteği karara bağlanmamış, reddedilmiş veya katılan sıfatını alabilecek surette suçtan zarar görmüş bulunanların dilekçe veya beyanında, başvuruya ilişkin nedenlerin gösterilmemesi inceleme yapılmasına engel olmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Cumhuriyet savcısı, istinaf yoluna başvurma nedenlerini gerekçeleriyle birlikte yazılı isteminde açıkça gösterir. Bu istem ilgililere tebliğ edilir. İlgililer, tebliğ tarihinden itibaren iki hafta içinde bu husustaki cevaplarını bildirebilirler.107</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="274" başlık="Eski hâle getirme süresi içinde istinaf süresinin işlemesi">
          <mvz-fıkra no="1">
            <template>Sanık, yokluğunda aleyhine verilen hükümlere karşı eski hâle getirme isteminde bulunabilir. Eski hâle getirme süresi içinde de istinaf süresi işler. Sanığın eski hâle getirme isteminde bulunduğu hâllerde, ayrıca istinaf isteminde bulunması gerekir. Bu hâlde istinaf istemi ile ilişkili işler, eski hâle getirme istemi hakkında karar verilinceye kadar ertelenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="275" başlık="İstinaf başvurusunun etkisi">
          <mvz-fıkra no="1">
            <template>Süresi içinde yapılan istinaf başvurusu, hükmün kesinleşmesini engeller.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="276" başlık="İstinaf isteminin hükmü veren mahkemece reddi">
          <mvz-fıkra no="1">
            <template>İstinaf istemi, kanunî sürenin geçmesinden sonra veya aleyhine istinaf yoluna başvurulamayacak bir hükme karşı yapılmışsa ya da istinaf yoluna başvuranın buna hakkı yoksa, hükmü veren mahkeme bir kararla dilekçeyi reddeder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İstinaf başvurusunda bulunan Cumhuriyet savcısı veya ilgililer, ret kararının kendilerine tebliğinden itibaren iki hafta içinde bölge adliye mahkemesinden bu hususta bir karar vermesini isteyebilirler. Bu takdirde dosya bölge adliye mahkemesine gönderilir. Ancak, bu nedenle hükmün infazı ertelenemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="277" başlık="İstinaf isteminin tebliği ve cevabı">
          <mvz-fıkra no="1">
            <template>276 ncı maddeye göre hükmü veren mahkemece reddedilmeyen istinaf dilekçesi veya beyana ilişkin tutanağın bir örneği karşı tarafa tebliğ olunur. Karşı taraf, tebliğ tarihinden itibaren iki hafta içinde yazılı olarak cevabını verebilir. 108</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Karşı taraf sanık ise, bir tutanağa bağlanmak üzere zabıt kâtibine yapılacak bir beyanla da cevabını verebilir. Cevap verildikten veya bunun için belirli süre bittikten sonra dava dosyası, bölge adliye mahkemesine gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>262 ve 263 üncü madde hükümleri saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="278" başlık="Dosyanın bölge adliye mahkemesinde tevzii">
          <mvz-fıkra no="1">
            <template>Dava dosyası, bölge adliye mahkemesine geldiğinde işbölümüne göre görevli ceza dairesine verilir. Daire, varsa tebligat eksikliklerinin giderilmesini sağlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="279" başlık="Dosya üzerinde ön inceleme">
          <mvz-fıkra no="1">
            <template>Dosya üzerinde yapılan ön inceleme sonunda;</template>
            <mvz-bent no="a">
              <template>Bölge adliye mahkemesinin yetkili olmadığının anlaşılması hâlinde dosyanın yetkili bölge adliye mahkemesine gönderilmesine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bölge adliye mahkemesine başvurunun süresi içinde yapılmadığının, incelenmesi istenen kararın bölge adliye mahkemesinde incelenebilecek kararlardan olmadığının, başvuranın buna hakkı bulunmadığının anlaşılması hâlinde istinaf başvurusunun reddine,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Karar verilir.  Bu kararlar itiraza tabidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="280" başlık="Bölge adliye mahkemesinde inceleme ve kovuşturma">
          <mvz-fıkra no="1">
            <template>Bölge adliye mahkemesi, dosyayı ve dosyayla birlikte sunulmuş olan delilleri inceledikten sonra;</template>
            <mvz-bent no="a">
              <template>İlk derece mahkemesinin kararında usule veya esasa ilişkin herhangi bir hukuka aykırılığın bulunmadığını, delillerde veya işlemlerde herhangi bir eksiklik olmadığını, ispat bakımından değerlendirmenin yerinde olduğunu saptadığında istinaf başvurusunun esastan reddine, 303 üncü maddenin birinci fıkrasının (a), (c), (d), (e), (f), (g) ve (h) bentlerinde yer alan ihlallerin varlığı hâlinde hukuka aykırılığın düzeltilerek istinaf başvurusunun esastan reddine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Cumhuriyet savcısının istinaf yoluna başvurma nedenine uygun olarak mahkumiyete konu suç için kanunda yazılı cezanın en alt derecesinin uygulanmasını uygun görmesi hâlinde, hukuka aykırılığın düzeltilerek istinaf başvurusunun esastan reddine,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Başka bir araştırmaya ihtiyaç duyulmadan cezayı kaldıran veya cezada indirim yapılmasını gerektiren şahsî sebeplere ya da şahsî cezasızlık sebeplerine bağlı olarak daha az ceza verilmesini veya ceza verilmesine yer olmadığına karar verilmesini gerektiren hâllerde, hukuka aykırılığın düzeltilerek istinaf başvurusunun esastan reddine,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Olayın daha fazla araştırılmasına ihtiyaç duyulmadan davanın reddine karar verilmesi veya güvenlik tedbirlerine ilişkin hatalı kararın düzeltilmesi gereken hâllerde hukuka aykırılığın düzeltilerek istinaf başvurusunun esastan reddine,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>İlk derece mahkemesinin kararında 289 uncu maddede belirtilen bir hukuka aykırılık nedeninin bulunması hâlinde hükmün bozulmasına ve dosyanın yeniden incelenmek ve hükmolunmak üzere hükmü bozulan ilk derece mahkemesine veya kendi yargı çevresinde uygun göreceği diğer bir ilk derece mahkemesine gönderilmesine,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Soruşturma veya kovuşturma şartının gerçekleşmediğinin veya önödeme ve uzlaştırma usulünün uygulanmadığının anlaşılması ya da davanın ilk derece mahkemesinde görülmekte olan bir dava ile birlikte yürütülmesinin zorunlu olması hâlinde hükmün bozulmasına ve dosyanın yeniden incelenmek ve hükmolunmak üzere hükmü bozulan ilk derece mahkemesine veya kendi yargı çevresinde uygun göreceği diğer bir ilk derece mahkemesine gönderilmesine,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Diğer hâllerde, gerekli tedbirleri aldıktan sonra davanın yeniden görülmesine ve duruşma hazırlığı işlemlerine başlanmasına,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Duruşma sonunda bölge adliye mahkemesi istinaf başvurusunu esastan reddeder veya ilk derece mahkemesi hükmünü kaldırarak yeniden hüküm kurar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci ve ikinci fıkra uyarınca verilen kararların sanık lehine olması hâlinde, bu hususların istinaf isteminde bulunmamış olan diğer sanıklara da uygulanma olanağı varsa bu sanıklar da istinaf isteminde bulunmuşçasına verilen kararlardan yararlanırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="281" başlık="Duruşma hazırlığı">
          <mvz-fıkra no="1">
            <template>Duruşma hazırlığı aşamasında bölge adliye mahkemesi daire başkanı veya görevlendireceği üye, 175 inci madde hükümlerine uygun olarak duruşma gününü saptar; gerekli çağrıları yapar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkemece, gerekli görülen tanıkların, bilirkişilerin dinlenilmesine ve keşfin yapılmasına karar verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="282" başlık="İstisnalar">
          <mvz-fıkra no="1">
            <template>Duruşma açıldığında aşağıda gösterilen istisnalar dışında bu Kanunun duruşma hazırlığı, duruşma ve karara ilişkin hükümleri uygulanır:</template>
            <mvz-bent no="a">
              <template>Duruşma, bu Kanunun öngördüğü genel hükümlere göre başladıktan sonra görevlendirilen üyenin inceleme raporu anlatılır.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>İlk derece mahkemesinin gerekçeli hükmü anlatılır.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İlk derece mahkemesinde dinlenilen tanıkların ifadelerini içeren tutanaklar ile keşif tutanakları ve bilirkişi raporu anlatılır.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Bölge adliye mahkemesi duruşma hazırlığı aşamasında toplanan delil ve belgeler, yapılmışsa keşif ve bilirkişi açıklamalarına ilişkin tutanak ve raporlar anlatılır.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Bölge adliye mahkemesi duruşmasında dinlenilmeleri gerekli görülen tanık ve bilirkişiler çağrılır.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Sanık, müdafii, katılan ve vekilinin davetiye tebliğ edilmesine rağmen duruşmaya gelmemesi hâlinde duruşmaya devam edilerek sanığın sorgu tutanakları anlatılmak suretiyle dava yokluklarında bitirilebilir. Ancak, 195 inci madde hükümleri saklı kalmak üzere, sanık hakkında verilecek ceza, ilk derece mahkemesinin verdiği cezadan daha ağır ise, her hâlde sanığın dinlenmesi gerekir.</template>
            </mvz-bent>
          </mvz-fıkra>

        <mvz-madde no="283" başlık="Sanık lehine başvurma hâlinde verilecek hüküm">

        <mvz-madde no="285" başlık="Özel kanunların temyize ilişkin hükümleri">
          <mvz-fıkra no="1">
            <template>23/4/2016 tarihli ve 6706 sayılı Cezaî Konularda Uluslararası Adlî İş Birliği Kanununun 18 inci maddesinin dördüncü fıkrası hükmü hariç; diğer kanunlarda temyiz edilebileceği veya haklarında Yargıtaya başvurulabileceği belirtilmiş olup da bölge adliye mahkemelerinin görev alanına giren dava ve işlere ilişkin ilk derece mahkemelerinin karar ve hükümlerine karşı istinaf yoluna başvurulur.</template>

        <mvz-madde no="287" başlık="Hükümden önceki kararların temyizi">

            <template>Hükümden önce verilip hükme esas teşkil eden veya başkaca kanun yolu öngörülmemiş olan mahkeme kararları da hükümle beraber temyiz olunabilir.</template>

          </mvz-fıkra>

        <mvz-madde no="289" başlık="Hukuka kesin aykırılık hâlleri">
