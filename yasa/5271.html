  <mvz-künye tür="kanun" no="5271" başlık="CEZA MUHAKEMESİ KANUNU"
             tarih="4/12/2004" rgazete-tarih="17/12/2004" rgazete-sayı="25673"
             düstur-tertip="5" düstur-cilt="44" />

  <mvz-kitap no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-kısım no="1-BİRİNCİ" başlık="Kapsam, Tanımlar, Görev ve Yetki">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Kapsam ve Tanımlar">
        <mvz-madde no="1" başlık="Kanunun kapsamı">
          <mvz-fıkra no="1">
            <template>Bu Kanun, ceza muhakemesinin nasıl yapılacağı hususundaki kurallar ile bu sürece katılan kişilerin hak, yetki ve yükümlülüklerini düzenler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="2" başlık="Tanımlar">
          <mvz-fıkra no="1">
            <template>Bu Kanunun uygulanmasında;</template>
            <mvz-bent no="a">
              <template>Şüpheli: Soruşturma evresinde, suç şüphesi altında bulunan kişiyi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Sanık: Kovuşturmanın başlamasından itibaren hükmün kesinleşmesine kadar, suç şüphesi altında bulunan kişiyi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Müdafi: Şüpheli veya sanığın ceza muhakemesinde savunmasını yapan avukatı,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Vekil: Katılan, suçtan zarar gören veya malen sorumlu kişiyi ceza muhakemesinde temsil eden avukatı,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Soruşturma: Kanuna göre yetkili mercilerce suç şüphesinin öğrenilmesinden iddianamenin kabulüne kadar geçen evreyi,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Kovuşturma: İddianamenin kabulüyle başlayıp, hükmün kesinleşmesine kadar geçen evreyi,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>İfade alma: Şüphelinin kolluk görevlileri veya Cumhuriyet savcısı tarafından soruşturma konusu suçla ilgili olarak dinlenmesini,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Sorgu: Şüpheli veya sanığın hâkim veya mahkeme tarafından soruşturma veya kovuşturma konusu suçla ilgili olarak dinlenmesini,</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Malen sorumlu: Yargılama konusu işin hükme bağlanması ve bunun kesinleşmesinden sonra, maddî ve malî sorumluluk taşıyarak hükmün sonuçlarından etkilenecek veya bunlara katlanacak kişiyi,</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Suçüstü:</template>
              <mvz-altbent no="1">
                <template>İşlenmekte olan suçu,</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Henüz işlenmiş olan fiil ile fiilin işlenmesinden hemen sonra kolluk, suçtan zarar gören veya başkaları tarafından takip edilerek yakalanan kişinin işlediği suçu,</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Fiilin pek az önce işlendiğini gösteren eşya veya delille yakalanan kimsenin işlediği suçu,</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Toplu suç: Aralarında iştirak iradesi bulunmasa da üç veya daha fazla kişi tarafından işlenen suçu,</template>
            </mvz-bent>
            <mvz-bent no="l">
              <template>Disiplin hapsi: Kısmî bir düzeni korumak amacıyla yaptırım altına alınmış olan fiil dolayısıyla verilen, seçenek yaptırımlara çevrilemeyen, önödeme uygulanamayan, tekerrüre esas olmayan, şartla salıverilme hükümleri uygulanamayan, ertelenemeyen ve adlî sicil kayıtlarına geçirilmeyen hapsi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İfade eder.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Görev">
        <mvz-madde no="3" başlık="Görev">
          <mvz-fıkra no="1">
            <template>Mahkemelerin görevleri kanunla belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="4" başlık="Re'sen görev kararı ve görevde uyuşmazlık">
          <mvz-fıkra no="1">
            <template>Davaya bakan mahkeme, görevli olup olmadığına kovuşturma evresinin her aşamasında re'sen karar verebilir. 6 ncı madde hükmü saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Görev konusunda mahkemeler arasında uyuşmazlık çıktığında, görevli mahkemeyi ortak yüksek görevli mahkeme belirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="5" başlık="Görevsizlik kararı verilmesi gereken hâl ve sonucu">
          <mvz-fıkra no="1">
            <template>İddianamenin kabulünden sonra; işin, davayı gören mahkemenin görevini aştığı veya dışında kaldığı anlaşılırsa, mahkeme bir kararla işi görevli mahkemeye gönderir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Adlî yargı içerisindeki mahkemeler bakımından verilen görevsizlik kararlarına karşı itiraz yoluna gidilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="6" başlık="Görevsizlik kararı verilemeyecek hâl">
          <mvz-fıkra no="1">
            <template>Duruşmada suçun hukukî niteliğinin değiştiğinden bahisle görevsizlik kararı verilerek dosya alt dereceli mahkemeye gönderilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="7" başlık="Görevli olmayan hâkim veya mahkemenin işlemleri">
          <mvz-fıkra no="1">
            <template>Yenilenmesi mümkün olmayanlar dışında, görevli olmayan hâkim veya mahkemece yapılan işlemler hükümsüzdür.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Bağlantılı Davalar">
        <mvz-madde no="8" başlık="Bağlantı kavramı">
          <mvz-fıkra no="1">
            <template>Bir kişi, birden fazla suçtan sanık olur veya bir suçta her ne sıfatla olursa olsun birden fazla sanık bulunursa bağlantı var sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun işlenmesinden sonra suçluyu kayırma, suç delillerini yok etme, gizleme veya değiştirme fiilleri de bağlantılı suç sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="9" başlık="Davaların birleştirilerek açılması">
          <mvz-fıkra no="1">
            <template>Bağlantılı suçlardan her biri değişik mahkemelerin görevine giriyorsa, bunlar hakkında birleştirilmek suretiyle yüksek görevli mahkemede dava açılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="10" başlık="Görülmekte olan davaların birleştirilmesi ve ayrılması">
          <mvz-fıkra no="1">
            <template>Kovuşturma evresinin her aşamasında, bağlantılı ceza davalarının birleştirilmesine veya ayrılmasına yüksek görevli mahkemece karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birleştirilen davalarda, bu davaları gören mahkemenin tâbi olduğu yargılama usulü uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İşin esasına girdikten sonra ayrılan davalara aynı mahkemede devam olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="11" başlık="Geniş bağlantı sebebiyle birleştirme">
          <mvz-fıkra no="1">
            <template>Mahkeme, bakmakta olduğu birden çok dava arasında bağlantı görürse, bu bağlantı 8 inci maddede gösterilen türden olmasa bile, birlikte bakmak ve hükme bağlamak üzere bu davaların birleştirilmesine karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Yetki">
        <mvz-madde no="12" başlık="Yetkili mahkeme">
          <mvz-fıkra no="1">
            <template>Davaya bakmak yetkisi, suçun işlendiği yer mahkemesine aittir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Teşebbüste son icra hareketinin yapıldığı, kesintisiz suçlarda kesintinin gerçekleştiği ve zincirleme suçlarda son suçun işlendiği yer mahkemesi yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suç, ülkede yayımlanan bir basılı eserle işlenmişse yetki, eserin yayım merkezi olan yer mahkemesine aittir. Ancak, aynı eserin birden çok yerde basılması durumunda suç, eserin yayım merkezi dışındaki baskısında meydana gelmişse, bu suç için eserin basıldığı yer mahkemesi de yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Soruşturulması ve kovuşturulması şikâyete bağlı olan hakaret suçunda eser, mağdurun yerleşim yerinde veya oturduğu yerde dağıtılmışsa, o yer mahkemesi de yetkilidir. Mağdur, suçun işlendiği yer dışında tutuklu veya hükümlü bulunuyorsa, o yer mahkemesi de yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Görsel veya işitsel yayınlarda da bu maddenin üçüncü fıkrası hükmü uygulanır. Görsel ve işitsel yayın, mağdurun yerleşim yerinde ve oturduğu yerde işitilmiş veya görülmüşse o yer mahkemesi de yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bilişim sistemlerinin, banka veya kredi kurumlarının ya da banka veya kredi kartlarının araç olarak kullanılması suretiyle işlenen suçlarda mağdurun yerleşim yeri mahkemeleri de yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="13" başlık="Özel yetki">
          <mvz-fıkra no="1">
            <template>Suçun işlendiği yer belli değilse, şüpheli veya sanığın yakalandığı yer, yakalanmamışsa yerleşim yeri mahkemesi yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Şüpheli veya sanığın Türkiye'de yerleşim yeri yoksa Türkiye'de en son adresinin bulunduğu yer mahkemesi yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkemenin bu suretle de belirlenmesi olanağı yoksa, ilk usul işleminin yapıldığı yer mahkemesi yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="14" başlık="Yabancı ülkede işlenen suçlarda yetki">
          <mvz-fıkra no="1">
            <template>Yabancı ülkede işlenen ve kanun hükümleri uyarınca Türkiye'de soruşturulması ve kovuşturulması gereken suçlarda yetki, 13 üncü maddenin birinci ve ikinci fıkralarına göre belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bununla birlikte Cumhuriyet savcısının, şüphelinin veya sanığın istemi üzerine Yargıtay, suçun işlendiği yere daha yakın olan yer mahkemesine yetki verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu gibi suçlarda şüpheli veya sanık Türkiye'de yakalanmamış, yerleşmemiş veya adresi yoksa; yetkili mahkeme, Adalet Bakanının istemi ve Yargıtay Cumhuriyet Başsavcısının başvurusu üzerine Yargıtay tarafından belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yabancı ülkelerde bulunup da diplomatik bağışıklıktan yararlanan Türk kamu görevlilerinin işledikleri suçlardan dolayı yetkili mahkeme Ankara mahkemesidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="15" başlık="Deniz, hava ve demiryolu taşıtlarında veya bu taşıtlarla işlenen suçlarda yetki">
          <mvz-fıkra no="1">
            <template>Suç, Türk bayrağını taşıma yetkisine sahip olan bir gemide veya böyle bir taşıt Türkiye dışında iken işlenmişse, geminin ilk uğradığı Türk limanında veya bağlama limanında bulunan mahkeme yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Türk bayrağını taşıma hakkına sahip olan hava taşıtları ile demiryolu taşıtları hakkında da yukarıdaki fıkra hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ülke içerisinde deniz, hava veya demiryolu taşıtlarında ya da bu taşıtlarla işlenen suçlarda, bunların ilk ulaştığı yer mahkemesi de yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Çevreyi kirletme suçu, yabancı bayrağı taşıyan bir gemi tarafından Türk kara suları dışında işlendiği takdirde, suçun işlendiği yere en yakın veya geminin Türkiye'de ilk uğradığı limanın bulunduğu yer mahkemesi yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="16" başlık="Bağlantılı suçlarda yetki">
          <mvz-fıkra no="1">
            <template>Yukarıdaki maddelere göre her biri değişik mahkemelerin yetkisi içinde bulunan bağlantılı ceza davaları, yetkili mahkemelerden herhangi birisinde birleştirilerek görülebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bağlantılı ceza davalarının değişik mahkemelerde bakılmasına başlanmış olursa, Cumhuriyet savcılarının istemlerine uygun olmak koşuluyla, mahkemeler arasında oluşacak uyuşma üzerine, bu davaların hepsi veya bir kısmı bu mahkemelerin birinde birleştirilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Uyuşulmazsa, Cumhuriyet savcısı veya sanığın istemi üzerine ortak yüksek görevli mahkeme birleştirmeye gerek olup olmadığına ve gerek varsa hangi mahkemede birleştirileceğine karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birleştirilmiş olan davaların ayrılması da bu suretle olur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="17" başlık="Yetkide olumlu veya olumsuz uyuşmazlık">
          <mvz-fıkra no="1">
            <template>Birkaç hâkim veya mahkeme arasında olumlu veya olumsuz yetki uyuşmazlığı çıkarsa, ortak yüksek görevli mahkeme, yetkili hâkim veya mahkemeyi belirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="18" başlık="Yetkisizlik iddiası">
          <mvz-fıkra no="1">
            <template>Sanık, yetkisizlik iddiasını, ilk derece mahkemelerinde duruşmada sorgusundan, bölge adliye mahkemelerinde incelemenin başlamasından ve duruşmalı işlerde inceleme raporunun okunmasından önce bildirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yetkisizlik iddiasına ilişkin karar, ilk derece mahkemelerinde sanığın sorgusundan önce, bölge adliye mahkemelerinde duruşmasız işlerde incelemenin hemen başlangıcında, duruşmalı işlerde inceleme raporu okunmadan önce verilir. Bu aşamalardan sonra yetkisizlik iddiasında bulunulamayacağı gibi mahkemeler de bu hususta re'sen karar veremez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yetkisizlik kararlarına karşı itiraz yoluna gidilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="19" başlık="Davanın nakli ve duruşmanın başka yerde yapılması">
          <mvz-fıkra no="1">
            <template>Yetkili hâkim veya mahkeme, hukukî veya fiilî sebeplerle görevini yerine getiremeyecek hâlde bulunursa; yüksek görevli mahkeme, davanın başka yerde bulunan aynı derecede bir mahkemeye nakline karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kovuşturmanın görevli ve yetkili olan mahkemenin bulunduğu yerde yapılması kamu güvenliği için tehlikeli olursa, davanın naklini Adalet Bakanı Yargıtaydan ister.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkeme, fiili sebepler veya güvenlik gerekçesiyle duruşmanın il sınırları içinde başka bir yerde yapılmasına karar verebilir. Bu karara karşı itiraz yolu açıktır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="20" başlık="Yetkili olmayan hâkim veya mahkemenin işlemleri">
          <mvz-fıkra no="1">
            <template>Yetkili olmayan hâkim veya mahkemece yapılan işlemler, sadece yetkisizlik nedeniyle hükümsüz sayılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="21" başlık="Gecikmesinde sakınca bulunan hâllerde yapılan işlemler">
          <mvz-fıkra no="1">
            <template>Bir hâkim veya mahkeme, yetkili olmasa bile, gecikmesinde sakınca bulunan hâllerde, yargı çevresi içerisinde gerekli işlemleri yapar.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="5-BEŞİNCİ" başlık="Hâkimin Davaya Bakamaması ve Reddi">
        <mvz-madde no="22" başlık="Hâkimin davaya bakamayacağı hâller">
          <mvz-fıkra no="1">
            <template>Hâkim;</template>
            <mvz-bent no="a">
              <template>Suçtan kendisi zarar görmüşse,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Sonradan kalksa bile şüpheli, sanık veya mağdur ile aralarında evlilik, vesayet veya kayyımlık ilişkisi bulunmuşsa,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Şüpheli, sanık veya mağdurun kan veya kayın hısımlığından üstsoy veya altsoyundan biri ise,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Şüpheli, sanık veya mağdur ile aralarında evlât edinme bağlantısı varsa,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Şüpheli, sanık veya mağdur ile aralarında üçüncü derece dahil kan hısımlığı varsa,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Evlilik sona ermiş olsa bile, şüpheli, sanık veya mağdur ile aralarında ikinci derece dahil kayın hısımlığı varsa,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Aynı davada Cumhuriyet savcılığı, adlî kolluk görevi, şüpheli veya sanık müdafiliği veya mağdur vekilliği yapmışsa,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Aynı davada tanık veya bilirkişi sıfatıyla dinlenmişse,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Hâkimlik görevini yapamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="23" başlık="Yargılamaya katılamayacak hâkim">
          <mvz-fıkra no="1">
            <template>Bir karar veya hükme katılan hâkim, yüksek görevli mahkemece bu hükme ilişkin olarak verilecek karar veya hükme katılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aynı işte soruşturma evresinde görev yapmış bulunan hâkim, kovuşturma evresinde görev yapamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yargılamanın yenilenmesi halinde, önceki yargılamada görev yapan hâkim, aynı işte görev alamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="24" başlık="Hâkimin reddi sebepleri ve ret isteminde bulunabilecekler">
          <mvz-fıkra no="1">
            <template>Hâkimin davaya bakamayacağı hâllerde reddi istenebileceği gibi, tarafsızlığını şüpheye düşürecek diğer sebeplerden dolayı da reddi istenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhuriyet savcısı; şüpheli, sanık veya bunların müdafii; katılan veya vekili, hâkimin reddi isteminde bulunabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bunlardan herhangi biri istediği takdirde, karar veya hükme katılacak hâkimlerin isimleri kendisine bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="25" başlık="Tarafsızlığını şüpheye düşürecek sebeplerden dolayı hâkimin reddi isteminin süresi">
          <mvz-fıkra no="1">
            <template>Tarafsızlığını şüpheye düşürecek sebeplerden dolayı bir hâkimin reddi, ilk derece mahkemelerinde sanığın sorgusu başlayıncaya; duruşmalı işlerde bölge adliye mahkemelerinde inceleme raporu ve Yargıtayda görevlendirilen üye veya tetkik hâkimi tarafından yazılmış olan rapor üyelere açıklanıncaya kadar istenebilir. Diğer hâllerde, inceleme başlayıncaya kadar hâkimin reddi istenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sonradan ortaya çıkan veya öğrenilen sebeplerle duruşma veya inceleme bitinceye kadar da hâkimin reddi istenebilir. Ancak bu istemin, ret sebebinin öğrenilmesinden itibaren yedi gün içinde yapılması şarttır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="26" başlık="Ret isteminin usulü">
          <mvz-fıkra no="1">
            <template>Hâkimin reddi, mensup olduğu mahkemeye verilecek dilekçeyle veya bu hususta zabıt kâtibine bir tutanak düzenlenmesi için başvurulması suretiyle yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ret isteminde bulunan, öğrendiği ret sebeplerinin tümünü bir defada açıklamak ve süresi içinde olguları ile birlikte ortaya koymakla yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Reddi istenen hâkim, ret sebepleri hakkındaki görüşlerini yazılı olarak bildirir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="27" başlık="Hâkimin reddi istemine karar verecek mahkeme">
          <mvz-fıkra no="1">
            <template>Hâkimin reddi istemine mensup olduğu mahkemece karar verilir. Ancak, reddi istenen hâkim müzakereye katılamaz. Bu nedenle mahkeme teşekkül edemezse bu hususta karar verilmesi;</template>
            <mvz-bent no="a">
              <template>Reddi istenen hâkim asliye ceza mahkemesine mensup ise bu mahkemenin yargı çevresi içerisinde bulunan ağır ceza mahkemesine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Reddi istenen hâkim ağır ceza mahkemesine mensup ise o yerde ağır ceza mahkemesinin birden fazla dairesinin bulunması hâlinde, numara olarak kendisini izleyen daireye, son numaralı daire için (1) numaralı daireye; o yerde ağır ceza mahkemesinin tek dairesi bulunması hâlinde ise, en yakın ağır ceza mahkemesine,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Aittir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ret istemi sulh ceza hâkimine karşı ise, yargı çevresi içinde bulunduğu asliye ceza mahkemesi ve tek hâkime karşı ise, yargı çevresi içerisinde bulunan ağır ceza mahkemesi karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bölge adliye mahkemesi ceza dairelerinin başkan ve üyelerinin reddi istemi, reddedilen başkan ve üye katılmaksızın görevli olduğu dairece incelenerek karara bağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Ret isteminin kabulü halinde, davaya bakmakla bir başka hâkim veya mahkeme görevlendirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="28" başlık="Ret istemi üzerine verilecek kararlar ve başvurulacak kanun yolları">
          <mvz-fıkra no="1">
            <template>Ret isteminin kabulüne ilişkin kararlar kesindir; kabul edilmemesine ilişkin kararlara karşı itiraz yoluna gidilebilir. İtiraz üzerine verilen ret kararı hükümle birlikte incelenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="29" başlık="Reddi istenen hâkimin yapabileceği işlemler">
          <mvz-fıkra no="1">
            <template>Reddi istenen hâkim, ret hakkında bir karar verilinceye kadar yalnız gecikmesinde sakınca olan işlemleri yapar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ancak, hâkimin oturum sırasında reddedilmesi hâlinde, bu konuda bir karar verilebilmesi için oturuma ara vermek gerekse bile ara vermeksizin devam olunur. Şu kadar ki, 216 ncı madde uyarınca tarafların iddia ve sözlerinin dinlenilmesine geçilemez ve ret konusunda bir karar verilmeden reddedilen hâkim tarafından veya onun katılımıyla bir sonraki oturuma başlanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ret isteminin kabulüne karar verildiğinde, gecikmesinde sakınca bulunan hâl nedeniyle yapılmış işlemler dışında, duruşma tekrarlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="30" başlık="Hâkimin çekinmesi ve inceleme mercii">
          <mvz-fıkra no="1">
            <template>Hâkim, yasaklılığını gerektiren sebeplere dayanarak çekindiğinde; merci, bir başka hâkimi veya mahkemeyi davaya bakmakla görevlendirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hâkim, tarafsızlığını şüpheye düşürecek sebepler ileri sürerek çekindiğinde, merci çekinmenin uygun olup olmadığına karar verir. Çekinmenin uygun bulunması halinde, davaya bakmakla bir başka hâkim veya mahkeme görevlendirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Gecikmesinde sakınca bulunan hâllerde yapılan işler hakkında 29 uncu madde hükmü uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="31" başlık="Ret isteminin geri çevrilmesi">
          <mvz-fıkra no="1">
            <template>Mahkeme, kovuşturma evresinde ileri sürülen hâkimin reddi istemini aşağıdaki durumlarda geri çevirir:</template>
            <mvz-bent no="a">
              <template>Ret istemi süresinde yapılmamışsa.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ret sebebi ve delili gösterilmemişse.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Ret isteminin duruşmayı uzatmak amacı ile yapıldığı açıkça anlaşılıyorsa.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hâllerde ret istemi, toplu mahkemelerde reddedilen hâkimin müzakereye katılmasıyla, tek hâkimli mahkemelerde de reddedilen hâkimin kendisi tarafından geri çevrilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu konudaki kararlara karşı itiraz yoluna başvurulabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="32" başlık="Zabıt kâtibinin reddi veya çekinmesi">
          <mvz-fıkra no="1">
            <template>Bu Bölümde yazılı hükümler zabıt kâtipleri hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Zabıt kâtibinin reddi veya kendisinin reddini gerektiren sebepleri bildirerek görevden çekinmesi hâlinde gereken karar, yanında çalıştığı mahkeme başkanı veya hâkim tarafından verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Aynı işte zabıt kâtibinin hâkim ile birlikte reddi istemi hakkında veya çekinmelerine karar verecek merci, hâkime göre belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Kararlar, Açıklanması ve Tebliği, Süreler ve Eski Hâle Getirme">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Kararlar, Açıklanması ve Tebliği">
        <mvz-madde no="33" başlık="Kararların verilmesi usulü">
          <mvz-fıkra no="1">
            <template>Duruşmada verilecek kararlar, Cumhuriyet savcısı, duruşmada hazır bulunan müdafi, vekil ve diğer ilgililer dinlendikten; duruşma dışındaki kararlar, Cumhuriyet savcısının yazılı veya sözlü görüşü alındıktan sonra verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="34" başlık="Kararların gerekçeli olması">
          <mvz-fıkra no="1">
            <template>Hâkim ve mahkemelerin her türlü kararı, karşı oy dahil, gerekçeli olarak yazılır. Gerekçenin yazımında 230 uncu madde göz önünde bulundurulur. Kararların örneklerinde karşı oylar da gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kararlarda, başvurulabilecek kanun yolu, süresi, mercii ve şekilleri belirtilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="35" başlık="Kararların açıklanması ve tebliği">
          <mvz-fıkra no="1">
            <template>İlgili tarafın yüzüne karşı verilen karar kendisine açıklanır ve isterse kararın bir örneği de verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Koruma tedbirlerine ilişkin olanlar hariç, aleyhine kanun yoluna başvurulabilecek hâkim veya mahkeme kararları, hazır bulunamayan ilgilisine tebliğ olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İlgili taraf serbest olmayan bir kişi veya tutuklu ise tebliğ edilen karar, kendisine okunup anlatılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="36" başlık="Tebligat ve yazışma usulü">
          <mvz-fıkra no="1">
            <template>Mahkeme başkanı veya hâkim, her türlü tebligatı, tüm gerçek veya özel hukuk tüzel kişileri veya kamu kurum ve kuruluşları ile ilgili yazışmaları yapar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İnfaz edilecek kararlar, Cumhuriyet Başsavcılığına verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="37" başlık="Tebligat usulleri">
          <mvz-fıkra no="1">
            <template>Tebligat, bu Kanunda belirtilen özel hükümler saklı kalmak koşuluyla, ilgili kanunda belirtilen hükümlere göre yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Uluslararası andlaşmalar, yazılı belgelerin doğrudan doğruya postayla veya diğer iletişim araçlarıyla gönderilmesini kabul ettiğinde; yurt dışına yapılan tebligat, iadeli taahhütlü posta veya diğer iletişim araçları ile gerçekleştirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="38" başlık="Cumhuriyet Başsavcılığına yapılan tebligat">
          <mvz-fıkra no="1">
            <template>Cumhuriyet Başsavcılığına yapılan tebligat, tebliği gereken evrakın aslının verilmesi suretiyle olur. Tebliğ ile bir süre işlemeye başlıyorsa verildiği gün, Cumhuriyet Başsavcılığı tarafından evrakın aslına yazılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="38/A" başlık="Elektronik işlemler">
          <mvz-fıkra no="1">
            <template>Her türlü ceza muhakemesi işlemlerinde Ulusal Yargı Ağı Bilişim Sistemi (UYAP) kullanılır. Bu işlemlere ilişkin her türlü veri, bilgi, belge ve karar, UYAP vasıtasıyla işlenir, kaydedilir ve saklanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kanunlarda gösterilen istisnalar hariç olmak üzere, dosyalar güvenli elektronik imza kullanılarak UYAP’tan incelenebilir ve her türlü ceza muhakemesi işlemi yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu Kanun kapsamında fiziki olarak hazırlanması öngörülen her türlü belge ve karar elektronik ortamda düzenlenebilir, işlenebilir, saklanabilir ve güvenli elektronik imza ile imzalanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Güvenli elektronik imza ile imzalanan belge ve kararlar diğer kişi veya kurumlara elektronik ortamda gönderilir. Güvenli elektronik imza ile imzalanarak gönderilen belge veya kararlar, gerekmedikçe fiziki olarak ayrıca düzenlenmez ve ilgili kurum ve kişilere gönderilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Elektronik imzalı belgenin elle atılan imzalı belgeyle çelişmesi halinde UYAP’ta kayıtlı olan güvenli elektronik imzalı belge geçerli kabul edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Güvenli elektronik imza ile imzalanan belge ve kararlarda, mühürleme işlemi ile kanunlarda birden fazla nüshanın düzenlenmesini öngören hükümler uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Zorunlu nedenlerle fiziki olarak düzenlenmiş belge veya kararlar, yetkili kişilerce taranarak UYAP’a aktarılır ve gerektiğinde ilgili birimlere elektronik ortamda gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Elektronik ortamdan fiziki örnek çıkartılması gereken hallerde tutanak veya belgenin aslının aynı olduğu belirtilerek hâkim, Cumhuriyet savcısı veya görevlendirilen yetkili kişi tarafından imzalanır ve mühürlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Elektronik ortamda yapılan işlemlerde süre gün sonunda biter.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Yargı birimlerinin ihtiyaç duyduğu nüfus, tapu, adlî sicil kaydı gibi dış bilişim sistemlerinden UYAP vasıtasıyla temin edilen bilgi, belge ve kayıtlar, zorunlu olmadıkça ayrıca fiziki olarak istenilmez. UYAP’tan dış bilişim sistemlerine gönderilen bilgi ve belgeler ayrıca zorunlu olmadıkça fiziki ortamda gönderilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>Ceza muhakemesi işlemlerinin UYAP’ta yapılmasına dair usul ve esaslar, Adalet Bakanlığı tarafından çıkarılacak yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Süreler ve Eski Hâle Getirme">
        <mvz-madde no="39" başlık="Sürelerin hesaplanması">
          <mvz-fıkra no="1">
            <template>Gün ile belirlenen süreler, tebligatın yapıldığının ertesi günü işlemeye başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Süre, hafta olarak belirlenmiş ise, tebligatın yapıldığı günün, son haftada isim itibarıyla karşılığı olan günün mesai saati bitiminde sona erer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Süre, ay olarak belirlenmiş ise tebligatın yapıldığı günün, son ayda sayı itibarıyla karşılığı olan günün mesai saati bitiminde sona erer. Son bulduğu ayda sayı itibarıyla karşılığı olan gün yoksa; süre, ayın son günü mesai saati bitiminde sona erer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Son gün bir tatile rastlarsa süre, tatilin ertesi günü biter.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="40" başlık="Eski hâle getirme">
          <mvz-fıkra no="1">
            <template>Kusuru olmaksızın bir süreyi geçirmiş olan kişi, eski hale getirme isteminde bulunabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kanun yoluna başvuru hakkı kendisine bildirilmemesi halinde de, kişi kusursuz sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="41" başlık="Eski hâle getirme dilekçesi">
          <mvz-fıkra no="1">
            <template>Eski hâle getirme dilekçesi, engelin kalkmasından itibaren iki hafta içinde, süreye uyulduğunda usule ilişkin işlemleri yapacak olan mahkemeye verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dilekçe sahibi, sürenin geçmesinde kusuru olmadığına ilişkin olguları, varsa belgelerini de ekleyerek açıklar. Dilekçe verildiği anda usule ilişkin yapılamayan işlemler de yerine getirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="42" başlık="Eski hâle getirme dilekçesi üzerine verilecek karar">
          <mvz-fıkra no="1">
            <template>Süresi içinde usul işlemi yapılsaydı, esasa hangi mahkeme hükmedecek idiyse, eski hâle getirme dilekçesi hakkında da o mahkeme karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eski hâle getirme isteminin kabulüne ilişkin karar kesindir; reddine ilişkin karara karşı itiraz yoluna gidilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Eski hâle getirme dilekçesi, kararın yerine getirilmesini durdurmaz; ancak, mahkeme yerine getirmeyi erteleyebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Tanıklık, Bilirkişi İncelemesi ve Keşif">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Tanıklık">
        <mvz-madde no="43" başlık="Tanıkların çağrılması">
          <mvz-fıkra no="1">
            <template>Tanıklar çağrı kâğıdı ile çağrılır. Çağrı kâğıdında gelmemenin sonuçları bildirilir. Tutuklu işlerde tanıklar için zorla getirme kararı verilebilir. Karar yazısında bu yoldan getirilmenin nedenleri gösterilir ve bunlara çağrı kâğıdı ile gelen tanıklar hakkındaki işlem uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu çağrı telefon, telgraf, faks, elektronik posta gibi araçlardan yararlanılmak suretiyle de yapılabilir. Ancak, çağrı kâğıdına bağlanan sonuçlar, bu durumda uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkeme, duruşmanın devamı sırasında hemen dinlenilmesi gerekli görülen tanıkların belirteceği gün ve saatte hazır bulundurulmasını görevlilere yazılı olarak emredebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cumhurbaşkanı kendi takdiri ile tanıklıktan çekinebilir. Tanıklık yapmayı istemesi halinde beyanı konutunda alınabilir ya da yazılı olarak gönderebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu madde hükümleri, kişinin ancak Cumhuriyet savcısı, hâkim veya mahkeme önünde tanık olarak dinlenmesi halinde uygulanabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="44" başlık="Çağrıya uymayan tanıklar">
          <mvz-fıkra no="1">
            <template>Usulüne uygun olarak çağrılıp da mazeretini bildirmeksizin gelmeyen tanıklar zorla getirilir ve gelmemelerinin sebep olduğu giderler takdir edilerek, kamu alacaklarının tahsili usulüne göre ödettirilir. Zorla getirilen tanık evvelce gelmemesini haklı gösterecek sebepleri sonradan bildirirse aleyhine hükmedilen giderler kaldırılır.  Zorla getirme kararı; telefon, telgraf, faks, elektronik posta gibi iletişim bilgilerinin dosyada bulunması hâlinde bu araçlardan yararlanılmak suretiyle de tanığa bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiilî hizmette bulunan askerler hakkındaki zorla getirme kararı askerî makamlar aracılığıyla infaz olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="45" başlık="Tanıklıktan çekinme">
          <mvz-fıkra no="1">
            <template>Aşağıdaki kimseler tanıklıktan çekinebilir:</template>
            <mvz-bent no="a">
              <template>Şüpheli veya sanığın nişanlısı.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Evlilik bağı kalmasa bile şüpheli veya sanığın eşi.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Şüpheli veya sanığın kan hısımlığından veya kayın hısımlığından üstsoy veya altsoyu.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Şüpheli veya sanığın üçüncü derece dahil kan veya ikinci derece dahil kayın hısımları.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Şüpheli veya sanıkla aralarında evlâtlık bağı bulunanlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yaş küçüklüğü, akıl hastalığı veya akıl zayıflığı nedeniyle tanıklıktan çekinmenin önemini anlayabilecek durumda olmayanlar, kanunî temsilcilerinin rızalarıyla tanık olarak dinlenebilirler. Kanunî temsilci şüpheli veya sanık ise, bu kişilerin çekinmeleri konusunda karar veremez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tanıklıktan çekinebilecek olan kimselere, dinlenmeden önce tanıklıktan çekinebilecekleri bildirilir. Bu kimseler, dinlenirken de her zaman tanıklıktan çekinebilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="46" başlık="Meslek ve sürekli uğraşıları sebebiyle tanıklıktan çekinme">
          <mvz-fıkra no="1">
            <template>Meslekleri ve sürekli uğraşıları sebebiyle tanıklıktan çekinebilecekler ile çekinme konu ve koşulları şunlardır:</template>
            <mvz-bent no="a">
              <template>Avukatlar veya stajyerleri veya yardımcılarının, bu sıfatları dolayısıyla veya yüklendikleri yargı görevi sebebiyle öğrendikleri bilgiler.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hekimler, diş hekimleri, eczacılar, ebeler ve bunların yardımcıları ve diğer bütün tıp meslek veya sanatları mensuplarının, bu sıfatları dolayısıyla hastaları ve bunların yakınları hakkında öğrendikleri bilgiler.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Malî işlerde görevlendirilmiş müşavirler ve noterlerin bu sıfatları dolayısıyla hizmet verdikleri kişiler hakkında öğrendikleri bilgiler.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıdaki fıkranın (a) bendinde belirtilenler dışında kalan kişiler, ilgilinin rızasının varlığı halinde, tanıklıktan çekinemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="47" başlık="Devlet sırrı niteliğindeki bilgilerle ilgili tanıklık">
          <mvz-fıkra no="1">
            <template>Bir suç olgusuna ilişkin bilgiler, Devlet sırrı olarak mahkemeye karşı gizli tutulamaz. Açıklanması, Devletin dış ilişkilerine, milli savunmasına ve milli güvenliğine zarar verebilecek; anayasal düzeni ve dış ilişkilerinde tehlike yaratabilecek nitelikteki bilgiler, Devlet sırrı sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tanıklık konusu bilgilerin Devlet sırrı niteliğini taşıması halinde; tanık, sadece mahkeme hâkimi veya heyeti tarafından zâbıt kâtibi dahi olmaksızın dinlenir. Hâkim veya mahkeme başkanı, daha sonra, bu tanık açıklamalarından, sadece yüklenen suçu açıklığa kavuşturabilecek nitelikte olan bilgileri tutanağa kaydettirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu madde hükmü, hapis cezasının alt sınırı beş yıl veya daha fazla olan suçlarla ilgili olarak uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cumhurbaşkanının tanıklığı söz konusu olduğunda sırrın niteliğini ve mahkemeye bildirilmesi hususunu kendisi takdir eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="48" başlık="Kendisi veya yakınları aleyhine tanıklıktan çekinme">
          <mvz-fıkra no="1">
            <template>Tanık, kendisini veya 45 inci maddenin birinci fıkrasında gösterilen kişileri ceza kovuşturmasına uğratabilecek nitelikte olan sorulara cevap vermekten çekinebilir. Tanığa cevap vermekten çekinebileceği önceden bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="49" başlık="Tanıklıktan çekinme sebebinin bildirilmesi">
          <mvz-fıkra no="1">
            <template>Mahkeme başkanı veya hâkim veya Cumhuriyet savcısı tarafından gerekli görüldüğünde 45, 46 ve 48 inci maddelerde gösterilen hâllerde tanık, tanıklıktan çekinmesinin dayanağını oluşturan olguları bildirir ve bu hususta gerektiğinde kendisine yemin verdirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="50" başlık="Yemin verilmeyen tanıklar">
          <mvz-fıkra no="1">
            <template>Aşağıdaki kimseler yeminsiz dinlenir:</template>
            <mvz-bent no="a">
              <template>Dinlenme sırasında onbeş yaşını doldurmamış olanlar.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ayırt etme gücüne sahip olmamaları nedeniyle yeminin niteliği ve önemini kavrayamayanlar.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Soruşturma veya kovuşturma konusu suçlara iştirakten veya bu suçlar nedeniyle suçluyu kayırmaktan ya da suç delillerini yok etme, gizleme veya değiştirmekten şüpheli, sanık veya hükümlü olanlar.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="51" başlık="Tanıklıktan çekinebilecek kimsenin çekinmemesi">
          <mvz-fıkra no="1">
            <template>45 inci madde gereğince tanıklıktan çekinebileceklere yemin verip vermemek hâkim veya mahkemenin takdirine bağlıdır. Ancak, tanık yemin etmekten çekinebilir. Bu hususun kendisine bildirilmesi gereklidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="52" başlık="Tanıkların dinlenmesi">
          <mvz-fıkra no="1">
            <template>Her tanık, ayrı ayrı ve sonraki tanıklar yanında bulunmaksızın dinlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tanıklar, kovuşturma evresine kadar ancak gecikmesinde sakınca bulunan veya kimliğin belirlenmesine ilişkin hâllerde birbirleri ile ve şüpheli ile yüzleştirilebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tanıkların dinlenmesi sırasındaki görüntü veya sesler kayda alınabilir. Ancak;</template>
            <mvz-bent no="a">
              <template>Mağdur çocukların,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Duruşmaya getirilmesi mümkün olmayan ve tanıklığı maddî gerçeğin ortaya çıkarılması açısından zorunlu olan kişilerin,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Tanıklığında bu kayıt zorunludur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Üçüncü fıkra hükmünün uygulanması suretiyle elde edilen ses ve görüntü kayıtları, sadece ceza muhakemesinde kullanılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="53" başlık="Tanığa görevinin önemini anlatma">
          <mvz-fıkra no="1">
            <template>Tanığa;</template>
            <mvz-bent no="a">
              <template>Dinlenmeden önce, gerçeği söylemesinin önemi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Gerçeği söylememesi halinde yalan tanıklık suçundan dolayı cezalandırılacağı,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Doğruyu söyleyeceği hususunda yemin edeceği,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Duruşmada mahkeme başkanı veya hâkimin açık izni olmadan mahkeme salonunu terk edemeyeceği,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Anlatılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="54" başlık="Tanıklara yemin verilmesi">
          <mvz-fıkra no="1">
            <template>Tanıklar, tanıklıktan önce ayrı ayrı yemin ederler. Gerektiğinde veya bir kimsenin tanık sıfatıyla dinlenilmesinin uygun olup olmadığında tereddüt varsa yemin, tanıklığından sonraya bırakılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturma evresinde Cumhuriyet savcıları da tanıklara yemin verirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="55" başlık="Yeminin biçimi">
          <mvz-fıkra no="1">
            <template>Tanığa verilecek yemin, tanıklıktan önce "Bildiğimi dosdoğru söyleyeceğime namusum ve vicdanım üzerine yemin ederim." ve 54 üncü maddeye göre tanıklıktan sonra verilmesi hâlinde "Bildiğimi dosdoğru söylediğime namusum ve vicdanım üzerine yemin ederim." biçiminde olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yemin edilirken herkes ayağa kalkar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="56" başlık="Yeminin yerine getirilmesi, sağır veya dilsizin yemini">
          <mvz-fıkra no="1">
            <template>Tanık, yüksek sesle tekrar ederek veya okuyarak yemin eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Okuma ve yazma bilen sağır veya dilsizler yemin biçimini yazarak ve imzalarını koyarak yemin ederler. Okuma ve yazma bilmeyen sağır veya dilsizler işaretlerinden anlayan bir tercüman aracılığıyla ve işaretle yemin ederler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="57" başlık="Tanığın tekrar dinlenmesi">
          <mvz-fıkra no="1">
            <template>Yemin ile dinlenen tanığın aynı soruşturma veya kovuşturma evresinde tekrar dinlenmesi gerektiğinde, yeniden yemin verilmeyip önceki yemini hatırlatılmakla yetinilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="58" başlık="Tanığa ilk önce sorulacak hususlar ve tanığın korunması">
          <mvz-fıkra no="1">
            <template>Tanığa, ilk önce adı, soyadı, yaşı, işi ve yerleşim yeri, işyerinin veya geçici olarak oturduğu yerin adresi, varsa telefon numaraları sorulur. Gerekirse tanıklığına ne dereceye kadar güvenilebileceği hakkında hâkimi aydınlatacak durumlara, özellikle şüpheli, sanık veya mağdur ile ilişkilerine dair sorular yöneltilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tanık olarak dinlenecek kişilerin kimliklerinin ortaya çıkması kendileri veya yakınları açısından ağır bir tehlike oluşturacaksa; kimliklerinin saklı tutulması için gerekli önlemler alınır. Kimliği saklı tutulan tanık, tanıklık ettiği olayları hangi sebep ve vesile ile öğrenmiş olduğunu açıklamakla yükümlüdür. Kimliğinin saklı tutulması için, tanığa ait kişisel bilgiler, Cumhuriyet savcısı, hâkim veya mahkeme tarafından muhafaza edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hazır bulunanların huzurunda dinlenmesi, tanık için ağır bir tehlike teşkil edecek ve bu tehlike başka türlü önlenemeyecekse ya da maddî gerçeğin ortaya çıkarılması açısından tehlike oluşturacaksa; hâkim, hazır bulunma hakkına sahip bulunanlar olmadan da tanığı dinleyebilir. Tanığın dinlenmesi sırasında ses ve görüntülü aktarma yapılır. Soru sorma hakkı saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Tanıklık görevinin yapılmasından sonra, kişinin kimliğinin saklı tutulması veya güvenliğinin sağlanması hususunda alınacak önlemler, ilgili kanunda düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İkinci, üçüncü ve dördüncü fıkra hükümleri, ancak bir örgütün faaliyeti çerçevesinde işlenen suçlarla ilgili olarak uygulanabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="59" başlık="Tanığa söylenecek şeyler ve sorulacak sorular">
          <mvz-fıkra no="1">
            <template>Tanık, dinlenmeden önce hakkında tanıklık yapacağı olayla ilgili olarak mahkeme başkanı veya hâkim tarafından, kendisine bilgi verilir; hazır olan sanık, tanığa gösterilir. Sanık hazır değilse kimliği açıklanır. Tanıktan, tanıklık edeceği konulara ilişkin bildiklerini söylemesi istenir ve tanıklık ederken sözü kesilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tanıklık edilen konuları aydınlatmak, tamamlamak ve bilgilerinin dayandığı durumları gereğince değerlendirebilmek için tanığa ayrıca soru yöneltilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="60" başlık="Tanıklıktan ve yeminden sebepsiz çekinme">
          <mvz-fıkra no="1">
            <template>Yasal bir sebep olmaksızın tanıklıktan veya yeminden çekinen tanık hakkında, bundan doğan giderlere hükmedilmekle beraber, yemininin veya tanıklığının gerçekleştirilmesi için dava hakkında hüküm verilinceye kadar ve her hâlde üç ayı geçmemek üzere disiplin hapsi verilebilir. Kişi, tanıklığa ilişkin yükümlülüğüne uygun davranması halinde, derhâl serbest bırakılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu tedbirleri almaya naip hâkim ve istinabe olunan mahkeme ile soruşturma evresinde sulh ceza hâkimi yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Davanın görüldüğü sırada bu tedbirler alındıktan ve yukarıdaki süreler suçun türüne göre tümüyle uygulandıktan sonra o dava veya aynı işe ilişkin diğer davada tekrar edilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Disiplin hapsi kararına itiraz edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="61" başlık="Tanığa verilecek tazminat ve giderler">
          <mvz-fıkra no="1">
            <template>Cumhuriyet savcısı veya mahkeme başkanı veya hâkim tarafından çağrılan tanığa, her yıl Adalet Bakanlığınca hazırlanan tarifeye göre kaybettiği zaman ile orantılı bir tazminat verilir. Tanık hazır olmak için seyahat etmek zorunda kalmışsa, yol giderleriyle tanıklığa çağrıldığı yerdeki ikamet ve beslenme giderleri de karşılanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra hükmüne istinaden ödenmesi gereken tazminat ve giderler, hiçbir vergi, resim ve harç alınmaksızın, ödenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Bilirkişi İncelemesi">
        <mvz-madde no="62" başlık="Bilirkişilere uygulanacak hükümler">
          <mvz-fıkra no="1">
            <template>Tanıklara ilişkin hükümlerden aşağıdaki maddelere aykırı olmayanlar bilirkişiler hakkında da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="63" başlık="Bilirkişinin atanması">
          <mvz-fıkra no="1">
            <template>Çözümü uzmanlığı, özel veya teknik bilgiyi gerektiren hâllerde bilirkişinin oy ve görüşünün alınmasına re'sen, Cumhuriyet savcısının, katılanın, vekilinin, şüphelinin veya sanığın, müdafiinin veya kanunî temsilcinin istemi üzerine karar verilebilir.  Ancak, genel bilgi veya tecrübeyle ya da hâkimlik mesleğinin gerektirdiği hukukî bilgiyle çözümlenmesi mümkün olan konularda bilirkişiye başvurulamaz.  Hukuk öğrenimi görmüş kişiler, hukuk alanı dışında ayrı bir uzmanlığa sahip olduğunu belgelendirmedikçe, bilirkişi olarak görevlendirilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bilirkişi atanması ve gerekçe gösterilerek sayısının birden çok olarak saptanması, hâkim veya mahkemeye aittir. Birden çok bilirkişi atanmasına ilişkin istemler reddedildiğinde de aynı biçimde karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Soruşturma evresinde Cumhuriyet savcısı da bu maddede gösterilen yetkileri kullanabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="64" başlık="Bilirkişi olarak atanabilecekler">
          <mvz-fıkra no="1">
            <template>Bilirkişiler, bölge adliye mahkemelerinin yargı çevreleri esas alınmak suretiyle bilirkişilik bölge kurulu tarafından hazırlanan listede yer alan kişiler arasından seçilir. Ancak, kendi bölge listesinde ilgili uzmanlık alanında bilirkişi olmasına rağmen, diğer bir bölgedeki bilirkişinin, görevlendirme yapılan yere daha yakın bir mesafede bulunması durumunda, bu listeden de görevlendirme yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bölge kurulunun hazırladığı listede bilgisine başvurulacak uzmanlık dalında bilirkişi bulunmaması hâlinde, diğer bölge kurullarının listelerinden, burada da bulunmaması hâlinde, Bilirkişilik Kanununun 10 uncu maddesinin (d), (e) ve (f) bentleri hariç birinci fıkrasında yer alan şartları da taşımak kaydıyla listelerin dışından bilirkişi görevlendirilebilir. Listelerin dışından görevlendirilen bilirkişiler, bölge kuruluna bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kanunların belirli konularda görevlendirdiği resmî bilirkişiler öncelikle atanırlar. Ancak kamu görevlileri, bağlı bulundukları kurumla ilgili davalarda bilirkişi olarak atanamazlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Listelere kaydedilen bilirkişiler, bilirkişilik bölge kurulu veya bulunduğu yer il adlî yargı adalet komisyonu huzurunda "Görevimi adalete bağlı kalarak, bilim ve fenne uygun olarak, tarafsızlıkla yerine getireceğime namusum ve vicdanım üzerine yemin ederim." sözlerini tekrarlayarak yemin ederler. Bu bilirkişilere görevlendirildikleri her işte yeniden yemin verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Listelerde yer almamış bilirkişiler, görevlendirildiklerinde kendilerini atamış olan merci huzurunda yukarıdaki fıkrada öngörülen biçimde yemin ederler. Yeminin yapıldığına ilişkin tutanak hâkim veya Cumhuriyet savcısı, zabıt kâtibi ve bilirkişi tarafından imzalanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Engel bulunan hâllerde yemin yazılı olarak verilebilir ve metni dosyaya konulur. Ancak bu hâle ilişkin gerekçenin kararda gösterilmesi zorunludur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="65" başlık="Bilirkişiliği kabul yükümlülüğü">
          <mvz-fıkra no="1">
            <template>Aşağıda belirtilen kişi veya kurumlar, bilirkişilik görevini kabul etmekle yükümlüdürler:</template>
            <mvz-bent no="a">
              <template>Resmî bilirkişilikle görevlendirilmiş olanlar ve 64 üncü maddede belirtilen listelerde yer almış bulunanlar.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>İncelemenin yapılması için bilinmesi gerekli fen ve sanatları meslek edinenler.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İncelemenin yapılması için gerekli mesleği yapmaya resmen yetkili olanlar.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="66" başlık="Atama kararı ve incelemelerin yürütülmesi">
          <mvz-fıkra no="1">
            <template>Bilirkişi incelemesi yaptırılmasına ilişkin kararda, cevaplandırılması uzmanlığı, özel veya teknik bilgiyi gerektiren sorularla inceleme konusu ve görevin yerine getirileceği süre belirtilir. Bu süre, işin niteliğine göre üç ayı geçemez. Özel sebepler zorunlu kıldığında bu süre, bilirkişinin istemi üzerine, kendisini atayan merciin gerekçeli kararıyla en çok üç ay daha uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Belirlenen süre içinde raporunu vermeyen bilirkişi hemen değiştirilebilir. Bu durumda bilirkişi, o ana kadar yaptığı işlemleri açıklayan bir rapor sunar ve görevi sebebiyle kendisine teslim edilmiş olan eşya ve belgeleri hemen geri verir.  Ayrıca, hukukî ve cezaî sorumluluğuna ilişkin hükümler saklı kalmak kaydıyla, bilirkişiye ücret ve masraf adı altında hiçbir ödeme yapılmamasına karar verilebilir ve gerekçesi gösterilerek gerekli yaptırımların uygulanması bilirkişilik bölge kurulundan istenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bilirkişi, görevini, kendisini atamış olan merci ile ilişki içinde yerine getirir, gerektiğinde bu mercie incelemelerindeki gelişmeler hakkında bilgi verir, yararlı görülecek tedbirlerin alınmasını isteyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bilirkişi, görevini yerine getirmek amacıyla bilgi edinmek için şüpheli veya sanık dışındaki kimselerin de bilgilerine başvurabilir. Bilirkişi, uzmanlık alanına girmeyen bir sorun bakımından aydınlatılmasını isteyecek olursa; hâkim, mahkeme veya Cumhuriyet savcısı, nitelikli ve konusunda bilgisiyle tanınmış kişilerle bir araya gelmesine izin verebilir. Bu şekilde çağrılan kişiler yemin eder ve verecekleri raporlar, bilirkişi raporunun tamamlayıcı bir bölümü olarak dosyaya konulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İlgililer de merciinden, incelemeler yapılırken bilirkişiye teknik nitelikte bilgiler verebilecek olan ve ismen belirleyecekleri kişileri dinlemeleri veya bazı araştırmaların yapılması hususlarında karar verilmesini isteyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Gerekli olması halinde, bilirkişi, mağdur, şüpheli veya sanığa mahkeme başkanı, hâkim veya Cumhuriyet savcısı aracılığı ile soru sorabilir. Ancak, mahkeme başkanı, hâkim veya Cumhuriyet savcısı, bilirkişinin doğrudan soru sormasına da izin verebilir. Muayene ile görevlendirilen hekim bilirkişi, görevini yerine getirirken zorunlu saydığı soruları, hâkim, Cumhuriyet savcısı ve müdafi bulunmadan da mağdur, şüpheli veya sanığa doğrudan doğruya yöneltebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bilirkişiye inceleyeceği şeyler mühür altında verilmeden önce bunların listesi ve sayımı yapılır. Bu hususlar bir tutanakla belirlenir. Bilirkişi, mühürlerin açılmasını ve yeniden konulmasını yine tutanakla belirtmek ve bir liste düzenlemekle yükümlüdür.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="67" başlık="Bilirkişi raporu, uzman mütalaası">
          <mvz-fıkra no="1">
            <template>İncelemeleri sona erdiğinde bilirkişi yaptığı işlemleri ve vardığı sonuçları açıklayan bir raporu, kendisinden istenen incelemeleri yaptığını ayrıca belirterek, imzalayıp ilgili mercie verir veya gönderir. Mühür altındaki şeyler de ilgili mercie verilir veya gönderilir ve bu husus bir tutanağa bağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birden çok atanmış bilirkişiler değişik görüşleri yansıtmışlarsa veya bunların ortak sonuçlar üzerinde ayrık görüşleri varsa, bu durumu gerekçeleri ile birlikte rapora yazarlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bilirkişi, raporunda ve sözlü açıklamaları sırasında çözümü uzmanlığı, özel veya teknik bilgiyi gerektiren hususlar dışında açıklama yapamaz; hâkim tarafından yapılması gereken hukukî nitelendirme ve değerlendirmelerde bulunamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bilirkişi tarafından düzenlenen rapor örnekleri, duruşma sırasında Cumhuriyet savcısına, katılana, vekiline, şüpheliye veya sanığa, müdafiine veya kanunî temsilciye doğrudan verilebileceği gibi; kendilerine iadeli taahhütlü mektupla da gönderilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bilirkişi incelemeleri tamamlandığında, yeni bilirkişi incelemesi yapılması veya itirazların bildirilmesi için istemde bulunabilmelerini sağlamak üzere Cumhuriyet savcısına, katılana, vekiline, şüpheliye veya sanığa, müdafiine veya kanunî temsilciye süre verilir. Bu kişilerin istemleri reddedildiğinde, üç gün içinde bu hususta gerekçeli bir karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Cumhuriyet savcısı, katılan, vekili, şüpheli veya sanık, müdafii veya kanunî temsilci, yargılama konusu olayla ilgili olarak veya bilirkişi raporunun hazırlanmasında değerlendirilmek üzere ya da bilirkişi raporu hakkında, uzmanından bilimsel mütalaa alabilirler. Sadece bu nedenle ayrıca süre istenemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="68" başlık="Duruşmada bilirkişinin açıklaması">
          <mvz-fıkra no="1">
            <template>Mahkeme, her zaman bilirkişinin duruşmada dinlenmesine karar verebileceği gibi, ilgililerden birinin istemesi halinde de açıklamalarda bulunmak üzere duruşmaya çağırabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yaptıkları açıklamalardan sonra mahkeme başkanı veya hâkim, çekilmelerine izin vermedikçe, bilirkişiler duruşma salonunda kalırlar; ancak salona teker teker alınıp birbirinden ayrı olarak dinlenmeleri zorunlu değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cumhuriyet savcısının, katılanın, vekilinin, şüphelinin veya sanığın, müdafiin veya kanunî temsilcinin istemi üzerine bilimsel mütalaa hazırlayan uzmanın duruşmada dinlenmesi hususunda da yukarıdaki fıkralar hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="69" başlık="Bilirkişinin reddi">
          <mvz-fıkra no="1">
            <template>Hâkimin reddini gerektiren sebepler, bilirkişi hakkında da geçerlidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhuriyet savcısı, katılan, vekili, şüpheli veya sanık, müdafii veya kanunî temsilci, ret hakkını kullanabilirler. Hâkim veya mahkeme tarafından atanan bilirkişinin adı ve soyadı, engel sebepler olmadıkça ret hakkına sahip olanlara bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ret istemini davayı görmekte olan hâkim veya mahkeme inceler. Soruşturma evresinde, Cumhuriyet savcısınca kabul edilmeyen ret istemi sulh ceza hâkimince incelenir. Reddi isteyen kişi, bunun nedenini, dayandığı olguları göstererek açıklamakla yükümlüdür.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="70" başlık="Bilirkişilikten çekinme, bilirkişi olarak dinlenemeyenler">
          <mvz-fıkra no="1">
            <template>Tanıklıktan çekinmeyi gerektirecek sebepler bilirkişiler hakkında da geçerlidir. Bilirkişi, geçerli diğer sebeplerle de görüş bildirmekten çekinebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="71" başlık="Görevini yapmayan bilirkişi hakkındaki işlem">
          <mvz-fıkra no="1">
            <template>Usulünce çağrıldığı hâlde gelmeyen veya gelip de yeminden, oy ve görüş bildirmekten çekinen bilirkişiler hakkında 60 ıncı maddenin birinci fıkrası hükmü uygulanır ve durum bilirkişilik bölge kuruluna bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="72" başlık="Bilirkişi gider ve ücreti">
          <mvz-fıkra no="1">
            <template>Bilirkişiye sarf etmiş olduğu emek ve mesaiyle orantılı bir ücret ile inceleme, ulaşım, konaklama ve diğer giderleri ödenir. Bu konuda, Adalet Bakanlığı tarafından çıkarılan ve her yıl güncellenen tarife esas alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="73" başlık="Sahte para ve değerler üzerinde yapılacak incelemeler">
          <mvz-fıkra no="1">
            <template>Para ve Devlet tarafından çıkarılan tahvil ve Hazine bonosu gibi değerler üzerinde işlenen sahtecilik suçlarında, elkonulan para ve değerlerin hepsi, bunların asıllarını tedavüle çıkaran kurumların merkez veya taşra birimlerine incelettirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yabancı devletlerin paraları ve değerleri hakkında da, yetkili Türk makamlarının görüşlerinin alınmasına karar verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Gözlem Altına Alınma, Muayene, Keşif ve Otopsi">
        <mvz-madde no="74" başlık="Gözlem altına alınma">
          <mvz-fıkra no="1">
            <template>Fiili işlediği yolunda kuvvetli şüpheler bulunan şüpheli veya sanığın akıl hastası olup olmadığını, akıl hastası ise ne zamandan beri hasta olduğunu ve bunun, kişinin davranışları üzerindeki etkilerini saptamak için; uzman hekimin önerisi üzerine, Cumhuriyet savcısının ve müdafiin dinlenmesinden sonra resmî bir sağlık kurumunda gözlem altına alınmasına, soruşturma evresinde sulh ceza hâkimi, kovuşturma evresinde mahkeme tarafından karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Şüpheli veya sanığın müdafii yoksa hâkim veya mahkemenin istemi üzerine, baro tarafından bir müdafi görevlendirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Gözlem süresi üç haftayı geçemez. Bu sürenin yetmeyeceği anlaşılırsa resmî sağlık kurumunun istemi üzerine, her seferinde üç haftayı geçmemek üzere ek süreler verilebilir; ancak sürelerin toplamı üç ayı geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Gözlem altına alınma kararına karşı itiraz yoluna gidilebilir; itiraz, kararın yerine getirilmesini durdurur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu madde hükmü, 223 üncü maddenin sekizinci fıkrası gereğince yargılamanın durması kararı verilmesi gereken hâllerde de uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="75" başlık="Şüpheli veya sanığın beden muayenesi ve vücudundan örnek alınması">
          <mvz-fıkra no="1">
            <template>Bir suça ilişkin delil elde etmek için şüpheli veya sanık üzerinde iç beden muayenesi yapılabilmesine ya da vücuttan kan veya benzeri biyolojik örneklerle saç, tükürük, tırnak gibi örnekler alınabilmesine; Cumhuriyet savcısı veya mağdurun istemiyle ya da re'sen hâkim veya mahkeme, gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısı tarafından karar verilebilir. Cumhuriyet savcısının kararı, yirmidört saat içinde hâkim veya mahkemenin onayına sunulur. Hâkim veya mahkeme, yirmidört saat içinde kararını verir. Onaylanmayan kararlar hükümsüz kalır ve elde edilen deliller kullanılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İç beden muayenesi yapılabilmesi veya vücuttan kan veya benzeri biyolojik örnekler alınabilmesi için müdahalenin, kişinin sağlığına zarar verme tehlikesinin bulunmaması gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İç beden muayenesi veya vücuttan kan veya benzeri biyolojik örnekler alınması, ancak tabip veya sağlık mesleği mensubu diğer bir kişi tarafından yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cinsel organlar veya anüs bölgesinde yapılan muayene de iç beden muayenesi sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Üst sınırı iki yıldan daha az hapis cezasını gerektiren suçlarda, kişi üzerinde iç beden muayenesi yapılamaz; kişiden kan veya benzeri biyolojik örneklerle saç, tükürük, tırnak gibi örnekler alınamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu madde gereğince alınacak hâkim veya mahkeme kararlarına itiraz edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Özel kanunlardaki alkol muayenesine ve kan örneği alınmasına ilişkin hükümler saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="76" başlık="Diğer kişilerin beden muayenesi ve vücuttan örnek alınması">
          <mvz-fıkra no="1">
            <template>Bir suça ilişkin delil elde etmek amacıyla, mağdurun vücudu üzerinde dış veya iç beden muayenesi yapılabilmesine veya vücudundan kan veya benzeri biyolojik örneklerle saç, tükürük, tırnak gibi örnekler alınabilmesine; sağlığını tehlikeye düşürmemek ve cerrahî bir müdahalede bulunmamak koşuluyla; Cumhuriyet savcısının istemiyle ya da re'sen hâkim veya mahkeme, gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısı tarafından karar verilebilir. Cumhuriyet savcısının kararı, yirmidört saat içinde hâkim veya mahkemenin onayına sunulur. Hâkim veya mahkeme, yirmidört saat içinde kararını verir. Onaylanmayan kararlar hükümsüz kalır ve elde edilen deliller kullanılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mağdurun rızasının varlığı halinde, bu işlemlerin yapılabilmesi için birinci fıkra hükmüne göre karar alınmasına gerek yoktur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Çocuğun soy bağının araştırılmasına gerek duyulması halinde; bu araştırmanın yapılabilmesi için birinci fıkra hükmüne göre karar alınması gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Tanıklıktan çekinme sebepleri ile muayeneden veya vücuttan örnek alınmasından kaçınılabilir. Çocuk ve akıl hastasının çekinmesi konusunda kanunî temsilcisi karar verir. Çocuk veya akıl hastasının, tanıklığın hukukî anlam ve sonuçlarını algılayabilecek durumda olması hâlinde, görüşü de alınır. Kanunî temsilci de şüpheli veya sanık ise bu konuda hâkim tarafından karar verilir. Ancak, bu hâlde elde edilen deliller davanın ileri aşamalarında şüpheli veya sanık olmayan kanunî temsilcinin izni olmadıkça kullanılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu madde gereğince verilen hâkim veya mahkeme kararlarına itiraz edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="77" başlık="Kadının muayenesi">
          <mvz-fıkra no="1">
            <template>Kadının muayenesi, istemi halinde ve olanaklar elverdiğinde bir kadın hekim tarafından yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="78" başlık="Moleküler genetik incelemeler">
          <mvz-fıkra no="1">
            <template>75 ve 76 ncı maddelerde öngörülen işlemlerle elde edilen örnekler üzerinde, soybağının veya elde edilen bulgunun şüpheli veya sanığa ya da mağdura ait olup olmadığının tespiti için zorunlu olması hâlinde moleküler genetik incelemeler yapılabilir. Alınan örnekler üzerinde bu amaçlar dışında tespitler yapılmasına yönelik incelemeler yasaktır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra uyarınca yapılabilen incelemeler, bulunan ve kime ait olduğu belli olmayan beden parçaları üzerinde de yapılabilir. Birinci fıkranın ikinci cümlesi, bu hâlde de uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="79" başlık="Hâkimin kararı ve inceleme yapılması">
          <mvz-fıkra no="1">
            <template>78 inci madde uyarınca moleküler genetik incelemeler yapılmasına sadece hâkim karar verebilir. Kararda inceleme ile görevlendirilen bilirkişi de gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yapılacak incelemeler için resmen atanan veya bilirkişilikle yükümlü olan ya da soruşturma veya kovuşturmayı yürüten makama mensup olmayan veya bu makamın soruşturma veya kovuşturmayı yürüten dairesinden teşkilât yapısı itibarıyla ve objektif olarak ayrı bir birimine mensup olan görevliler, bilirkişi olarak görevlendirilebilirler. Bu kişiler, teknik ve teşkilât bakımından uygun tedbirlerle yasak moleküler genetik incelemelerin yapılmasını ve yetkisiz üçüncü kişilerin bilgi edinmesini önlemekle yükümlüdürler. İncelenecek bulgu, bilirkişiye ilgilinin adı ve soyadı, adresi, doğum tarihi bildirilmeksizin verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="80" başlık="Genetik inceleme sonuçlarının gizliliği">
          <mvz-fıkra no="1">
            <template>75, 76 ve 78 inci madde hükümlerine göre alınan örnekler üzerinde yapılan inceleme sonuçları, kişisel veri niteliğinde olup, başka bir amaçla kullanılamaz; dosya içeriğini öğrenme yetkisine sahip bulunan kişiler tarafından bir başkasına verilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İnceleme sonuçları kimlik bilgilerinden arındırılmış şekilde mahsus bir sisteme kaydedilir ve bir örneği dosyasında delil olarak saklanmak üzere soruşturma veya kovuşturma makamına gönderilir. Sisteme kaydedilen ve dosyada delil olarak saklanan bilgiler, kovuşturmaya yer olmadığı kararına itiraz süresinin dolması, itirazın reddi, beraat veya ceza verilmesine yer olmadığı kararı verilip kesinleşmesi hâllerinde derhâl, diğer hallerde mahkeme kararının kesinleşmesinden itibaren yirmi yıl geçmesiyle Cumhuriyet savcısının huzurunda yok edilir ve bu husus dosyasında muhafaza edilmek üzere tutanağa geçirilir. Bilgisi sisteme kaydedilen kişi bu süre içinde kişisel verinin saklanmasını gerektiren amacın ortadan kalkması veya haklı bir nedenin bulunması halinde hâkim veya mahkemeden bu bilgilerin silinmesini talep edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu madde uyarınca sisteme kaydedilen bilgiler, yürütülmekte olan bir soruşturma veya kovuşturma kapsamında maddî gerçeğin ortaya çıkarılması amacıyla mahkeme, hâkim veya Cumhuriyet savcısı kararıyla kullanılabilir. Mahkeme veya hâkim kararlarına karşı itiraz yoluna; Cumhuriyet savcısının kararına karşı ise sulh ceza hâkimliğine başvurulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İnceleme sonuçlarının mahsus sistemde kaydedilmesi, saklanması ve imhası ile bu kayıtlardan yararlanmaya ilişkin esas ve usuller, Adalet Bakanlığı ve İçişleri Bakanlığı tarafından müştereken çıkarılacak yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="81" başlık="Fizik kimliğin tespiti">
          <mvz-fıkra no="1">
            <template>Üst sınırı iki yıl veya daha fazla hapis cezasını gerektiren bir suçtan dolayı şüpheli veya sanığın, kimliğinin teşhisi için gerekli olması halinde, Cumhuriyet savcısının emriyle fotoğrafı, beden ölçüleri, parmak ve avuç içi izi, bedeninde yer almış olup teşhisini kolaylaştıracak diğer özellikleri ile sesi ve görüntüleri kayda alınarak, soruşturma ve kovuşturma işlemlerine ilişkin dosyaya konulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kovuşturmaya yer olmadığı kararına itiraz süresinin dolması, itirazın reddi, beraat veya ceza verilmesine yer olmadığı kararı verilip kesinleşmesi hâllerinde söz konusu kayıtlar Cumhuriyet savcısının huzurunda derhâl yok edilir ve bu husus tutanağa geçirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="82" başlık="Yönetmelik">
          <mvz-fıkra no="1">
            <template>75 ilâ 81 inci maddelerde öngörülen işlemlerin yapılması ile ilgili usuller yönetmelikte gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="83" başlık="Keşif">
          <mvz-fıkra no="1">
            <template>Keşif, hâkim veya mahkeme veya naip hâkim ya da istinabe olunan hâkim veya mahkeme ile gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısı tarafından yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Keşif tutanağına, var olan durum ile olayın özel niteliğine göre varlığı umulup da elde edilemeyen delillerin yokluğu da yazılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="84" başlık="Keşifte, tanık veya bilirkişinin dinlenmesinde bulunabilecekler">
          <mvz-fıkra no="1">
            <template>Keşif yapılması sırasında şüpheli, sanık, mağdur ve bunların müdafii ve vekili hazır bulunabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
