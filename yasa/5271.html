            <template>Sanık, tanık veya bilirkişinin davetini veya savunma delillerinin toplanmasını istediğinde, bunların ilişkin olduğu olayları göstermek suretiyle bu husustaki dilekçesini duruşma gününden en az beş gün önce mahkeme başkanına veya hâkime verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu dilekçe üzerine verilecek karar, kendisine derhâl bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sanığın kabul edilen istemleri, Cumhuriyet savcısına da bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="178" başlık="Çağrılması reddedilen tanığın ve uzman kişinin doğrudan mahkemeye getirilmesi">
          <mvz-fıkra no="1">
            <template>Mahkeme başkanı veya hâkim, sanığın veya katılanın gösterdiği tanık veya uzman kişinin çağrılması hakkındaki dilekçeyi reddettiğinde, sanık veya katılan o kişileri mahkemeye getirebilir. Bu kişiler duruşmada dinlenir.  Ancak, davayı uzatmak amacıyla yapılan talepler reddedilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="179" başlık="Çağrılan tanıkların ad ve adreslerinin sanığa ve Cumhuriyet savcısına bildirilmesi">
          <mvz-fıkra no="1">
            <template>Sanık, doğrudan doğruya davet ettireceği veya duruşma sırasında getireceği bilirkişi ve tanıkların ad ve adreslerini Cumhuriyet savcısına makul süre içinde bildirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhuriyet savcısı da, iddianamede gösterilen veya sanığın istemi üzerine davet edilen tanık ve bilirkişiler dışında gerek mahkeme başkanı veya hâkim kararıyla, gerek kendiliğinden başka kimseleri davet ettirecek ise bunların ad ve adreslerini sanığa yine makul süre içinde bildirir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="180" başlık="Tanık ve bilirkişinin naiple veya istinabe yoluyla dinlenmeleri">
          <mvz-fıkra no="1">
            <template>Hastalık veya malûllük veya giderilmesi olanağı bulunmayan başka bir nedenle bir tanık veya bilirkişinin uzun ve önceden bilinmeyen bir zaman için duruşmada hazır bulunmasının olanaklı bulunmayacağı anlaşılırsa, mahkeme onun bir naiple veya istinabe yoluyla dinlenmesine karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hüküm, konutlarının yetkili mahkemenin yargı çevresi dışında bulunmasından dolayı getirilmesi zor olan tanık ve bilirkişinin dinlenmesinde de uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Davayı görmekte olan mahkeme, zorunluluk olmadıkça, büyükşehir belediye sınırları içerisinde bulunan şikâyetçi, katılan, sanık, müdafi veya vekil, tanık ve bilirkişilerin istinabe yoluyla dinlenmesine karar veremez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İstinabe olunan mahkeme, büyükşehir belediye sınırları içerisinde ise, ilgililer kendi yargı çevresinde bulunmasa da büyükşehir belediye sınırları içerisinde yerine getirilmesi gereken istinabe evrakını geri çevirmeksizin gereğini yapar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yukarıdaki fıkralar içeriğine göre tanık veya bilirkişinin aynı anda görüntülü ve sesli iletişim tekniğinin kullanılması suretiyle dinlenebilmeleri olanağının varlığı hâlinde bu yöntem uygulanarak ifade alınır. Buna olanak verecek teknik donanımın kurulmasına ve kullanılmasına ilişkin esas ve usuller yönetmelikte gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="181" başlık="Tanık ve bilirkişinin dinleneceği günün bildirilmesi">
          <mvz-fıkra no="1">
            <template>Tanık veya bilirkişilerin dinlenmesi için belirlenen gün, Cumhuriyet savcısına, suçtan zarar görene, vekiline, sanığa ve müdafiine bildirilir. Düzenlenen tutanağın örneği hazır bulunan Cumhuriyet savcısına ve müdafie verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yeniden keşif ve muayeneye ihtiyaç duyulursa, yukarıdaki fıkra hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tutuklu olan sanık, ancak tutuklu bulunduğu yer mahkemesinde yapılacak bu tür işlerde hazır bulundurulmasını isteyebilir. Ancak, hâkim veya mahkeme tarafından zorunlu sayılan hâllerde tutuklu bulunan şüpheli veya sanığın da bu tür işlerde hazır bulunmasına karar verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Duruşma">
        <mvz-madde no="182" başlık="Duruşmanın açıklığı">
          <mvz-fıkra no="1">
            <template>Duruşma herkese açıktır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Genel ahlâkın veya kamu güvenliğinin kesin olarak gerekli kıldığı hâllerde, duruşmanın bir kısmının veya tamamının kapalı yapılmasına mahkemece karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Duruşmanın kapalı yapılması konusundaki gerekçeli karar ile hüküm açık duruşmada açıklanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="183" başlık="Ses ve görüntü alıcı aletlerin kullanılması yasağı">
          <mvz-fıkra no="1">
            <template>180 inci maddenin beşinci fıkrası ile 196 ncı maddenin dördüncü fıkrası hükmü saklı kalmak üzere, adliye binası içerisinde ve duruşma başladıktan sonra duruşma salonunda her türlü sesli veya görüntülü kayıt veya nakil olanağı sağlayan aletler kullanılamaz. Bu hüküm, adliye binası içerisinde ve dışındaki diğer adlî işlemlerin icrasında da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="184" başlık="Açıklığın kaldırılması hakkında karar">
          <mvz-fıkra no="1">
            <template>182 nci maddede gösterilen hâllerde, açıklığın kaldırılması istemine ilişkin olarak yapılacak duruşma, istem üzerine veya mahkemece uygun görülürse kapalı yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="185" başlık="Zorunlu kapalılık">
          <mvz-fıkra no="1">
            <template>Sanık, onsekiz yaşını doldurmamış ise duruşma kapalı yapılır; hüküm de kapalı duruşmada açıklanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="186" başlık="Kapalılık kararının ve nedenlerinin yazılması">
          <mvz-fıkra no="1">
            <template>Açıklığın kaldırılması kararı, nedenleriyle birlikte tutanağa geçirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="187" başlık="Kapalı duruşmada bulunabilme">
          <mvz-fıkra no="1">
            <template>Kapalı duruşmada mahkeme, bazı kişilerin hazır bulunmasına izin verebilir. Bu hâlde adı geçenler, duruşmanın kapalı olmasını gerektiren hususları açıklamamaları bakımından uyarılırlar ve bu husus tutanağa yazılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kapalı duruşmanın içeriği hiçbir iletişim aracıyla yayımlanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Açık duruşmanın içeriği, millî güvenliğe veya genel ahlâka veya kişilerin saygınlık, onur ve haklarına dokunacak veya suç işlemeye kışkırtacak nitelikte ise; mahkeme, bunları önlemek amacı ile ve gerektiği ölçüde duruşmanın içeriğinin kısmen veya tamamen yayımlanmasını yasaklar ve kararını açık duruşmada açıklar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="188" başlık="Duruşmada hazır bulunacaklar">
          <mvz-fıkra no="1">
            <template>Duruşmada, hükme katılacak hâkimler ve Cumhuriyet savcısı ile zabıt kâtibinin ve Kanunun zorunlu müdafiliği kabul ettiği hâllerde müdafiin hazır bulunması şarttır.  Müdafiin mazeretsiz olarak duruşmaya gelmemesi veya duruşmayı terk etmesi halinde duruşmaya devam edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bir oturumda bitmeyecek davada, herhangi bir nedenle bulunamayacak üyenin yerine geçmek ve oya katılmak üzere yedek üye bulundurulabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="189" başlık="Birden çok Cumhuriyet savcısı ve avukatın duruşmaya katılması">
          <mvz-fıkra no="1">
            <template>Birden çok Cumhuriyet savcısı ve birden çok avukat aynı zamanda duruşmaya katılabilecekleri gibi aralarında işbölümü de yapabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ara verme</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="190" başlık="">
          <mvz-fıkra no="1">
            <template>Duruşmaya, ara verilmeksizin devam edilerek hüküm verilir. Ancak, zorunlu hâllerde davanın makul sürede sonuçlandırılmasını olanaklı kılacak surette duruşmaya ara verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>176 ncı maddede belirlenen süreye uyulmamış ise duruşmaya ara verilmesini istemeye hakkı olduğu sanığa hatırlatılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Duruşmanın başlaması</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="191" başlık="">
          <mvz-fıkra no="1">
            <template>Sanığın ve müdafiinin hazır bulunup bulunmadığı, çağrılmış tanık ve bilirkişilerin gelip gelmedikleri saptanarak duruşmaya başlanır. Sanık, duruşmaya bağsız olarak alınır. Mahkeme başkanı veya hâkim, duruşmanın başladığını, iddianamenin kabulü kararını okuyarak açıklar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tanıklar duruşma salonundan dışarı çıkarılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Duruşmada, sırasıyla;</template>
            <mvz-bent no="a">
              <template>Sanığın açık kimliği saptanır, kişisel ve ekonomik durumu hakkında kendisinden bilgi alınır,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>İddianame veya iddianame yerine geçen belgede yer alan suçlamanın dayanağını oluşturan eylemler ve deliller ile suçlamanın hukuki nitelendirmesi anlatılır,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Sanığa, yüklenen suç hakkında açıklamada bulunmamasının kanunî hakkı olduğu ve 147 nci maddede belirtilen diğer hakları bildirilir,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Sanık açıklamada bulunmaya hazır olduğunu bildirdiğinde, usulüne göre sorgusu yapılır.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="192" başlık="Başkan veya hâkimin görevi">
          <mvz-fıkra no="1">
            <template>Mahkeme başkanı veya hâkim, duruşmayı yönetir ve sanığı sorguya çeker; delillerin ikame edilmesini sağlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Duruşmada ilgili olanlardan biri duruşmanın yönetimine ilişkin olarak mahkeme başkanı tarafından emrolunan bir tedbirin hukuken kabul edilemeyeceğini öne sürerse mahkeme, bu hususta bir karar verir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="193" başlık="Sanığın duruşmada hazır bulunmaması">
          <mvz-fıkra no="1">
            <template>Kanunun ayrık tuttuğu hâller saklı kalmak üzere, hazır bulunmayan sanık hakkında duruşma yapılmaz. Gelmemesinin geçerli nedeni olmayan sanığın zorla getirilmesine karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sanık hakkında, toplanan delillere göre mahkûmiyet, ceza verilmesine yer olmadığı ve güvenlik tedbiri dışında bir karar verilmesi gerektiği kanısına varılırsa, sorgusu yapılmamış olsa da dava yokluğunda bitirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="194" başlık="Sanığın mahkemeden uzaklaşması">
          <mvz-fıkra no="1">
            <template>Mahkemeye gelen sanığın duruşmanın devamı süresince hazır bulunması sağlanır ve savuşmasının önüne geçmek için mahkeme gereken tedbirleri alır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sanık savuşur veya ara vermeyi izleyen oturuma gelmezse, önceden sorguya çekilmiş ve artık hazır bulunmasına mahkemece gerek görülmezse, dava yokluğunda bitirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="195" başlık="Sanığın yokluğunda duruşma">
          <mvz-fıkra no="1">
            <template>Suç, yalnız veya birlikte adlî para cezasını veya müsadereyi gerektirmekte ise; sanık gelmese bile duruşma yapılabilir. Bu gibi hâllerde sanığa gönderilecek davetiyede gelmese de duruşmanın yapılacağı yazılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="196" başlık="Sanığın duruşmadan bağışık tutulması">
          <mvz-fıkra no="1">
            <template>Mahkemece sorgusu yapılmış olan sanık veya bu hususta sanık tarafından yetkili kılındığı hâllerde müdafii isterse, mahkeme sanığı duruşmada hazır bulunmaktan bağışık tutabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sanık, alt sınırı beş yıl ve daha fazla hapis cezasını gerektiren suçlar hariç olmak üzere, istinabe suretiyle sorguya çekilebilir. Sorgu için belirlenen gün, Cumhuriyet savcısı ile sanık ve müdafiine bildirilir. Cumhuriyet savcısı ile müdafiin sorgu sırasında hazır bulunması zorunlu değildir. Sorgusundan önce sanığa, ifadesini esas mahkemesi huzurunda vermek isteyip istemediği sorulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sorgu tutanağı duruşmada okunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hâkim veya mahkemenin zorunlu gördüğü durumlarda, aynı anda görüntülü ve sesli iletişim tekniğinin kullanılması suretiyle yurt içinde bulunan sanığın sorgusu yapılabilir veya duruşmalara katılmasına karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Hastalık veya disiplin önlemi ya da zorunlu diğer nedenlerle yargılamanın yapıldığı yargı çevresi dışındaki bir hastahane veya tutukevine nakledilmiş olan sanığın, sorgusu yapılmış olmak koşuluyla, hazır bulundurulmasına gerek görülmeyen oturumlar için getirilmemesine mahkemece karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Yurt dışında bulunan sanığın, belirlenen duruşma tarihinde hazır bulunmasının zorluğu halinde, bu tarihten önce duruşma açılarak veya istinabe suretiyle sorgusu yapılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="197" başlık="Sanığın müdafi gönderebilmesi">
          <mvz-fıkra no="1">
            <template>Sanık hazır bulunmasa da müdafii bütün oturumlarda hazır bulunmak yetkisine sahiptir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="198" başlık="Sanık hazır bulunmaksızın yapılan duruşmada eski hâle getirme koşulu">
          <mvz-fıkra no="1">
            <template>Duruşma, sanık hazır bulunmaksızın yapılırsa, mahkemenin karar ve işlemlerinin kendisine tebliği tarihinden itibaren bir hafta içinde, sürenin geçmesinden doğan sonuçları gidermek için sanık, kanunî nedenlere dayanarak, mahkemenin o karar ve işlemleri hakkında eski hâle getirme isteminde bulunabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ancak, sanık kendi istemi üzerine duruşmadan bağışık tutulmuş veya müdafii aracılığıyla temsil edilmek yetkisini kullanmış olursa artık eski hâle getirme isteminde bulunamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="199" başlık="Sanığın zorla getirilebilmesi">
          <mvz-fıkra no="1">
            <template>Mahkeme, sanığın hazır bulunmasına ve zorla getirme kararı veya yakalama emriyle getirilmesine her zaman karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="200" başlık="Sorgu sırasında sanığın mahkeme salonundan çıkarılabilmesi">
          <mvz-fıkra no="1">
            <template>Sanığın yüzüne karşı suç ortaklarından birinin veya bir tanığın gerçeği söylemeyeceğinden endişe edilirse, mahkeme, sorgu ve dinleme sırasında o sanığın mahkeme salonundan çıkarılmasına karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sanık tekrar getirildiğinde, tutanaklar okunur ve gerektiğinde içeriği anlatılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="201" başlık="Doğrudan soru yöneltme">
          <mvz-fıkra no="1">
            <template>Cumhuriyet savcısı, müdafi veya vekil sıfatıyla duruşmaya katılan avukat; sanığa, katılana, tanıklara, bilirkişilere ve duruşmaya çağrılmış diğer kişilere, duruşma disiplinine uygun olarak doğrudan soru yöneltebilirler. Sanık ve katılan da mahkeme başkanı veya hâkim aracılığı ile soru yöneltebilir. Yöneltilen soruya itiraz edildiğinde sorunun yöneltilmesinin gerekip gerekmediğine, mahkeme başkanı karar verir. Gerektiğinde ilgililer yeniden soru sorabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Heyet halinde görev yapan mahkemelerde, heyeti oluşturan hâkimler, birinci fıkrada belirtilen kişilere soru sorabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="202" başlık="Tercüman bulundurulacak hâller">
          <mvz-fıkra no="1">
            <template>Sanık veya mağdur, meramını anlatabilecek ölçüde Türkçe bilmiyorsa; mahkeme tarafından atanan tercüman aracılığıyla duruşmadaki iddia ve savunmaya ilişkin esaslı noktalar tercüme edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Engelli olan sanığa veya mağdura, duruşmadaki iddia ve savunmaya ilişkin esaslı noktalar, anlayabilecekleri biçimde anlatılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci ve ikinci fıkra hükümleri, soruşturma evresinde dinlenen şüpheli, mağdur veya tanıklar hakkında da uygulanır. Bu evrede tercüman, hâkim veya Cumhuriyet savcısı tarafından atanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Ayrıca sanık;</template>
            <mvz-bent no="a">
              <template>İddianamenin anlatılması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Esas hakkındaki mütalaanın verilmesi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>üzerine sözlü savunmasını, kendisini daha iyi ifade edebileceğini beyan ettiği başka bir dilde yapabilir. Bu durumda tercüme hizmetleri, beşinci fıkra uyarınca oluşturulan listeden, sanığın seçeceği tercüman tarafından yerine getirilir. Bu tercümanın giderleri Devlet Hazinesince karşılanmaz. Bu imkân, yargılamanın sürüncemede bırakılması amacına yönelik olarak kötüye kullanılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Tercümanlar, il adlî yargı adalet komisyonlarınca her yıl düzenlenen listede yer alan kişiler arasından seçilirler. Cumhuriyet savcıları ve hâkimler yalnız bulundukları il bakımından oluşturulmuş listelerden değil, diğer illerde oluşturulmuş listelerden de tercüman seçebilirler. Bu listelerin düzenlenmesine ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Duruşmanın Düzen ve Disiplini">
        <mvz-madde no="203" başlık="Hâkim veya başkanın yetkisi">
          <mvz-fıkra no="1">
            <template>Duruşmanın düzeni, mahkeme başkanı veya hâkim tarafından sağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme başkanı veya hâkim, duruşmanın düzenini bozan kişinin, savunma hakkının kullanılmasını engellememek koşuluyla salondan çıkarılmasını emreder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kişi dışarı çıkarılması sırasında direnç gösterir veya karışıklıklara neden olursa yakalanır ve hâkim veya mahkeme tarafından, avukatlar hariç, verilecek bir kararla derhâl dört güne kadar disiplin hapsine konulabilir. Ancak çocuklar hakkında disiplin hapsi uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="204" başlık="Sanığın dışarı çıkarılması">
          <mvz-fıkra no="1">
            <template>Davranışları nedeniyle, hazır bulunmasının duruşmanın düzenli olarak yürütülmesini tehlikeye sokacağı anlaşıldığında sanık, duruşma salonundan çıkarılır. Mahkeme, sanığın duruşmada hazır bulunmasını dosyanın durumuna göre savunması bakımından zorunlu görmezse, oturumu yokluğunda sürdürür ve bitirir. Ancak, sanığın müdafii yoksa, mahkeme barodan bir müdafi görevlendirilmesini ister. Oturuma yeniden alınmasına karar verilen sanığa, yokluğunda yapılan işlemler açıklanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="205" başlık="Duruşma sırasında işlenen suç hakkında işlem">
          <mvz-fıkra no="1">
            <template>Bir kimse, duruşma sırasında bir suç işlerse, mahkeme olayı tespit eder ve bu hususta düzenleyeceği tutanağı yetkili makama gönderir; gerek görürse failin tutuklanmasına da karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Delillerin Ortaya Konulması ve Tartışılması">
        <mvz-madde no="206" başlık="Delillerin ortaya konulması ve reddi">
          <mvz-fıkra no="1">
            <template>Sanığın sorguya çekilmesinden sonra delillerin ortaya konulmasına başlanır.  Ancak, sanığın tebligata rağmen mazeretsiz olarak gelmemesi sebebiyle sorgusunun yapılamamış olması, delillerin ortaya konulmasına engel olmaz. Ortaya konulan deliller, sonradan gelen sanığa bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ortaya konulması istenilen bir delil aşağıda yazılı hâllerde reddolunur:</template>
            <mvz-bent no="a">
              <template>Delil, kanuna aykırı olarak elde edilmişse.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Delil ile ispat edilmek istenilen olayın karara etkisi yoksa.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İstem, sadece davayı uzatmak maksadıyla yapılmışsa.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cumhuriyet savcısı ile sanık veya müdafii birlikte rıza gösterirlerse, tanığın dinlenmesinden veya başka herhangi bir delilin ortaya konulmasından vazgeçilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="207" başlık="Delil ve olayın geç bildirilmesi">
          <mvz-fıkra no="1">
            <template>Delilin ortaya konulması istemi, bunun veya ispat edilmek istenen olayın geç bildirilmiş olması nedeniyle reddedilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="208" başlık="Tanığın duruşma salonundan ayrılması">
          <mvz-fıkra no="1">
            <template>Tanıklar, dinlendikten sonra ancak mahkeme başkanı veya hâkimin izniyle duruşma salonundan ayrılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="209" başlık="Duruşmada anlatılması zorunlu belge ve tutanaklar">
          <mvz-fıkra no="1">
            <template>Naip veya istinabe yoluyla sorgusu yapılan sanığa ait sorgu tutanakları, naip veya istinabe yoluyla dinlenen tanığın ifade tutanakları ile muayene ve keşif tutanakları gibi delil olarak kullanılacak belgeler ve diğer yazılar, adlî sicil özetleri ve sanığın kişisel ve ekonomik durumuna ilişkin bilgilerin yer aldığı belgeler, duruşmada anlatılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sanığa veya mağdura ait kişisel verilerin yer aldığı belgelerin, açıkça istemeleri halinde, kapalı oturumda anlatılmasına mahkemece karar verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="210" başlık="Duruşmada okunmayacak belgeler">
          <mvz-fıkra no="1">
            <template>Olayın delili, bir tanığın açıklamalarından ibaret ise, bu tanık duruşmada mutlaka dinlenir. Daha önce yapılan dinleme sırasında düzenlenmiş tutanağın veya yazılı bir açıklamanın okunması dinleme yerine geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tanıklıktan çekinebilecek olan kişi, duruşmada tanıklıktan çekindiğinde, önceki ifadesine ilişkin tutanak okunamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="211" başlık="Duruşmada okunmasıyla yetinilebilecek belgeler">
          <mvz-fıkra no="1">
            <template>a) Tanık veya sanığın suç ortağı ölmüş veya akıl hastalığına tutulmuş olur veya bulunduğu yer öğrenilemezse,</template>
            <mvz-bent no="b">
              <template>Tanık veya sanığın suç ortağının duruşmada hazır bulunması, hastalık, malûllük veya giderilmesi olanağı bulunmayan başka bir nedenle belli olmayan bir süre için olanaklı değilse,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İfadesinin önem derecesi itibarıyla tanığın duruşmada hazır bulunması gerekli sayılmıyorsa,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu kişilerin dinlenmesi yerine, daha önce yapılan dinleme sırasında düzenlenmiş tutanaklar ile kendilerinin yazmış olduğu belgeler okunabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cumhuriyet savcısı, katılan veya vekili, sanık veya müdafii birinci fıkrada belirtilenlerin dışında kalan tutanakların okunmasına birlikte rıza gösterebilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="212" başlık="Tanığın önceki ifadesinin okunması">
          <mvz-fıkra no="1">
            <template>Tanık, bir hususu hatırlayamadığını söylerse önceki ifadesini içeren tutanağın ilgili kısmı okunarak hatırlamasına yardım edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tanığın duruşmadaki ifadesiyle önceki ifadesi arasında çelişki bulunduğunda, evvelce alınmış ifadesi okunarak çelişkinin giderilmesine çalışılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="213" başlık="Sanığın önceki ifadesinin okunması">
          <mvz-fıkra no="1">
            <template>Aralarında çelişki bulunması halinde; sanığın, hâkim veya mahkeme huzurunda yaptığı açıklamalar ile Cumhuriyet savcısı tarafından alınan veya müdafiinin hazır bulunduğu kolluk ifadesine ilişkin tutanaklar duruşmada okunabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="214" başlık="Rapor, belge ve diğer yazıların okunması">
          <mvz-fıkra no="1">
            <template>Bir açıklamayı ve görüşü içeren resmî belge ve diğer yazılar ve fennî muayene ve doktor raporlarının okunmasından sonra gerekli görülürse belge ve diğer yazılar veya raporda imzası bulunanlar, açıklamada bulunmak üzere duruşmaya çağrılabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Açıklama ve görüş veya rapor bir kurul tarafından verilmişse mahkeme, kurulun görüşünü açıklamak üzere görevi, üyelerden birine vermeyi kurula önerebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bilimsel görüşlere ilişkin açıklama, bu Kanunun 68 inci madde hükümlerine göre yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="215" başlık="Dinleme ve okumadan sonra diyeceğin sorulması">
          <mvz-fıkra no="1">
            <template>Suç ortağının, tanığın veya bilirkişinin dinlenmesinden ve herhangi bir belgenin okunmasından sonra bunlara karşı bir diyecekleri olup olmadığı katılana veya vekiline, Cumhuriyet savcısına, sanığa ve müdafiine sorulur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="216" başlık="Delillerin tartışılması">
          <mvz-fıkra no="1">
            <template>Ortaya konulan delillerle ilgili tartışmada söz, sırasıyla katılana veya vekiline, Cumhuriyet savcısına, sanığa ve müdafiine veya kanunî temsilcisine verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhuriyet savcısı, katılan veya vekili, sanığın, müdafiinin veya kanunî temsilcisinin açıklamalarına; sanık ve müdafii ya da kanunî temsilcisi de Cumhuriyet savcısının ve katılanın veya vekilinin açıklamalarına cevap verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hükümden önce son söz, hazır bulunan sanığa verilir.  Bu aşamada zorunlu müdafiin hazır bulunmaması hükmün açıklanmasına engel teşkil etmez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="217" başlık="Delilleri takdir yetkisi">
          <mvz-fıkra no="1">
            <template>Hâkim, kararını ancak duruşmaya getirilmiş ve huzurunda tartışılmış delillere dayandırabilir. Bu deliller hâkimin vicdanî kanaatiyle serbestçe takdir edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yüklenen suç, hukuka uygun bir şekilde elde edilmiş her türlü delille ispat edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="218" başlık="Ceza mahkemelerinin ek yetkisi">
          <mvz-fıkra no="1">
            <template>Yüklenen suçun ispatı, ceza mahkemelerinden başka bir mahkemenin görev alanına giren bir sorunun çözümüne bağlı ise; ceza mahkemesi bu sorunla ilgili olarak da bu Kanun hükümlerine göre karar verebilir. Ancak, bu sorunla ilgili olarak görevli mahkemede dava açılması veya açılmış davanın sonuçlanması ile ilgili olarak bekletici sorun kararı verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kovuşturma evresinde mağdur veya sanığın yaşının ceza hükümleri bakımından tespitiyle ilgili bir sorunla karşılaşılması halinde; mahkeme, ilgili kanunda belirlenen usule göre bu sorunu çözerek hükmünü verir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="5-BEŞİNCİ" başlık="Duruşma Tutanağı">
        <mvz-madde no="219" başlık="Duruşma tutanağı">
          <mvz-fıkra no="1">
            <template>Duruşma için tutanak tutulur. Tutanak, mahkeme başkanı veya hâkim ile zabıt kâtibi tarafından imzalanır. Duruşmada yapılan işlemlerin teknik araçlarla kayda alınması halinde, bu kayıtlar vakit geçirilmeksizin yazılı tutanağa dönüştürülerek mahkeme başkanı veya hâkim ile zabıt kâtibi tarafından imzalanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme başkanının mazereti bulunursa tutanak, üyelerin en kıdemlisi tarafından imzalanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="220" başlık="Duruşma tutanağının başlığı">
          <mvz-fıkra no="1">
            <template>Duruşma tutanağının başlığında;</template>
            <mvz-bent no="a">
              <template>Duruşmanın yapıldığı mahkemenin adı,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Oturum tarihleri,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Hâkimin, Cumhuriyet savcısının ve zabıt kâtibinin adı ve soyadı,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>belirtilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="221" başlık="Duruşma tutanağının içeriği">
          <mvz-fıkra no="1">
            <template>Duruşma tutanağında;</template>
            <mvz-bent no="a">
              <template>Oturumlara katılan sanığın, müdafiin, katılanın, vekilinin, kanunî temsilcisinin, bilirkişinin, tercümanın, teknik danışmanın adı ve soyadı,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Duruşmanın seyrini ve sonuçlarını yansıtan ve yargılama usulünün bütün temel kurallarına uyulduğunu gösteren unsurlar,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Sanık açıklamaları,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Tanık ifadeleri,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Bilirkişi ve teknik danışman açıklamaları,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Okunan veya okunmasından vazgeçilen belge ve yazılar,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>İstemler, reddi halinde gerekçesi,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Verilen kararlar,</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Hüküm,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>yer alır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="222" başlık="Duruşma tutanağının ispat gücü">
          <mvz-fıkra no="1">
            <template>Duruşmanın nasıl yapıldığı, kanunda belirtilen usul ve esaslara uygun olarak yapılıp yapılmadığı, ancak tutanakla ispat olunabilir. Tutanağa karşı yalnız sahtecilik iddiası yöneltilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Kamu Davasının Sona Ermesi">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Duruşmanın Sona Ermesi ve Hüküm">
        <mvz-madde no="223" başlık="Duruşmanın sona ermesi ve hüküm">
          <mvz-fıkra no="1">
            <template>Duruşmanın sona erdiği açıklandıktan sonra hüküm verilir. Beraat, ceza verilmesine yer olmadığı, mahkûmiyet, güvenlik tedbirine hükmedilmesi, davanın reddi ve düşmesi kararı, hükümdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Beraat kararı;</template>
            <mvz-bent no="a">
              <template>Yüklenen fiilin kanunda suç olarak tanımlanmamış olması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yüklenen suçun sanık tarafından işlenmediğinin sabit olması,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Yüklenen suç açısından failin kast veya taksirinin bulunmaması,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Yüklenen suçun sanık tarafından işlenmesine rağmen, olayda bir hukuka uygunluk nedeninin bulunması,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Yüklenen suçun sanık tarafından işlendiğinin sabit olmaması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Hallerinde verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sanık hakkında;</template>
            <mvz-bent no="a">
              <template>Yüklenen suçla bağlantılı olarak yaş küçüklüğü, akıl hastalığı veya sağır ve dilsizlik hali ya da geçici nedenlerin bulunması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yüklenen suçun hukuka aykırı fakat bağlayıcı emrin yerine getirilmesi suretiyle veya zorunluluk hali ya da cebir veya tehdit etkisiyle işlenmesi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Meşru savunmada sınırın heyecan, korku ve telaş nedeniyle aşılması,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kusurluluğu ortadan kaldıran hataya düşülmesi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Hallerinde, kusurunun bulunmaması dolayısıyla ceza verilmesine yer olmadığı kararı verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İşlenen fiilin suç olma özelliğini devam ettirmesine rağmen;</template>
            <mvz-bent no="a">
              <template>Etkin pişmanlık,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Şahsî cezasızlık sebebinin varlığı,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Karşılıklı hakaret,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>İşlenen fiilin haksızlık içeriğinin azlığı,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Dolayısıyla, faile ceza verilmemesi hallerinde, ceza verilmesine yer olmadığı kararı verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yüklenen suçu işlediğinin sabit olması halinde, sanık hakkında mahkûmiyet kararı verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Yüklenen suçu işlediğinin sabit olması halinde, belli bir cezaya mahkûmiyet yerine veya mahkûmiyetin yanı sıra güvenlik tedbirine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Aynı fiil nedeniyle, aynı sanık için önceden verilmiş bir hüküm veya açılmış bir dava varsa davanın reddine karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Türk Ceza Kanununda öngörülen düşme sebeplerinin varlığı ya da soruşturma veya kovuşturma şartının gerçekleşmeyeceğinin anlaşılması hallerinde, davanın düşmesine karar verilir. Ancak, soruşturmanın veya kovuşturmanın yapılması şarta bağlı tutulmuş olup da şartın henüz gerçekleşmediği anlaşılırsa; gerçekleşmesini beklemek üzere, durma kararı verilir. Bu karara itiraz edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Derhâl beraat kararı verilebilecek hâllerde durma, düşme veya ceza verilmesine yer olmadığı kararı verilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Adlî yargı dışındaki bir yargı merciine yönelik görevsizlik kararı kanun yolu bakımından hüküm sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="224" başlık="Karar ve hükümlerde gerekli oy sayısı">
          <mvz-fıkra no="1">
            <template>Mahkemece karar ve hükümler oybirliği veya oyçokluğuyla verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Karşı oya tutanakta yer verilir; gerekçesi de tutanakta gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="225" başlık="Hükmün konusu ve suçu değerlendirmede mahkemenin yetkisi">
          <mvz-fıkra no="1">
            <template>Hüküm, ancak iddianamede unsurları gösterilen suça ilişkin fiil ve faili hakkında verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme, fiilin nitelendirilmesinde iddia ve savunmalarla bağlı değildir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Suç Niteliğinde Değişiklik">
        <mvz-madde no="226" başlık="Suçun niteliğinin değişmesi">
          <mvz-fıkra no="1">
            <template>Sanık, suçun hukukî niteliğinin değişmesinden önce haber verilip de savunmasını yapabilecek bir hâlde bulundurulmadıkça, iddianamede kanunî unsurları gösterilen suçun değindiği kanun hükmünden başkasıyla mahkûm edilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cezanın artırılmasını veya cezaya ek olarak güvenlik tedbirlerinin uygulanmasını gerektirecek hâller, ilk defa duruşma sırasında ortaya çıktığında aynı hüküm uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ek savunma verilmesini gerektiren hâllerde istem üzerine sanığa ek savunmasını hazırlaması için süre verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yukarıdaki fıkralarda yazılı bildirimler, sanığa ve varsa müdafie yapılır. Müdafii sanığa tanınan haklardan onun gibi yararlanır. Sanığın dosyada var olan son adresine bildirim yapılamaması veya bildirime rağmen duruşmaya gelmemesi halinde müdafie yapılan bildirimler yeterli kabul edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Karar ve Hüküm">
        <mvz-madde no="227" başlık="Müzakereye katılacak hâkimler">
          <mvz-fıkra no="1">
            <template>Müzakerede ancak karara ve hükme katılacak hâkimler bulunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme başkanı, hâkim ve savcı yardımcıları ile mahkemesinde staj yapmakta olan avukat adaylarının müzakere sırasında hazır bulunmalarına izin verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="228" başlık="Müzakerenin yönetimi">
          <mvz-fıkra no="1">
            <template>Müzakereyi mahkeme başkanı yönetir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="229" başlık="Oyların toplanması">
          <mvz-fıkra no="1">
            <template>Mahkeme başkanı, kıdemsiz üyeden başlayarak oyları ayrı ayrı toplar ve en sonra kendi oyunu verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme başkan ve üyelerinden hiçbiri herhangi bir konu veya sorun üzerinde azınlıkta kaldığını ileri sürerek oylamaya katılmaktan çekinemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Oylar dağılırsa sanığın en çok aleyhine olan oy, çoğunluk meydana gelinceye kadar kendisine daha yakın olan oya eklenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="230" başlık="Hükmün gerekçesinde gösterilmesi gereken hususlar">
          <mvz-fıkra no="1">
            <template>Mahkûmiyet hükmünün gerekçesinde aşağıdaki hususlar gösterilir:</template>
            <mvz-bent no="a">
              <template>İddia ve savunmada ileri sürülen görüşler.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Delillerin tartışılması ve değerlendirilmesi, hükme esas alınan ve reddedilen delillerin belirtilmesi; bu kapsamda dosya içerisinde bulunan ve hukuka aykırı yöntemlerle elde edilen delillerin ayrıca ve açıkça gösterilmesi.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Ulaşılan kanaat, sanığın suç oluşturduğu sabit görülen fiili ve bunun nitelendirilmesi; bu hususta ileri sürülen istemleri de dikkate alarak, Türk Ceza Kanununun 61 ve 62 nci maddelerinde belirlenen sıra ve esaslara göre cezanın belirlenmesi; yine aynı Kanunun 53 ve devamı maddelerine göre, cezaya mahkûmiyet yerine veya cezanın yanı sıra uygulanacak güvenlik tedbirinin belirlenmesi.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Cezanın ertelenmesine, hapis cezasının adlî para cezasına veya tedbirlerden birine çevrilmesine veya ek güvenlik tedbirlerinin uygulanmasına veya bu hususlara ilişkin istemlerin kabul veya reddine ait dayanaklar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Beraat hükmünün gerekçesinde, 223 üncü maddenin ikinci fıkrasında belirtilen hallerden hangisine dayanıldığının gösterilmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ceza verilmesine yer olmadığına dair kararın gerekçesinde, 223 üncü maddenin üçüncü ve dördüncü fıkralarında belirtilen hallerden hangisine dayanıldığının gösterilmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yukarıdaki fıkralarda belirtilen hükümlerin dışında başka bir karar veya hükmün verilmesi hâlinde bunun nedenleri gerekçede gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="231" başlık="Hükmün açıklanması ve hükmün açıklanmasının geri bırakılması">
          <mvz-fıkra no="1">
            <template>Duruşma sonunda, 232 nci maddede belirtilen esaslara göre duruşma tutanağına geçirilen hüküm fıkrası okunarak gerekçesi ana çizgileriyle anlatılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hazır bulunan sanığa ayrıca başvurabileceği kanun yolları, mercii ve süresi bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Beraat eden sanığa, tazminat isteyebileceği bir hâl varsa bu da bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hüküm fıkrası herkes tarafından ayakta dinlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Sanığa yüklenen suçtan dolayı yapılan yargılama sonunda hükmolunan ceza, iki yıl veya daha az süreli hapis veya adlî para cezası ise; mahkemece, hükmün açıklanmasının geri bırakılmasına karar verilebilir. Uzlaşmaya ilişkin hükümler saklıdır. Hükmün açıklanmasının geri bırakılması, müsadereye ilişkin hükümler hariç, kurulan hükmün sanık hakkında bir hukukî sonuç doğurmamasını ifade eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Hükmün açıklanmasının geri bırakılmasına karar verilebilmesi için;</template>
            <mvz-bent no="a">
              <template>Sanığın daha önce kasıtlı bir suçtan mahkûm olmamış bulunması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Mahkemece, sanığın kişilik özellikleri ile duruşmadaki tutum ve davranışları göz önünde bulundurularak yeniden suç işlemeyeceği hususunda kanaate varılması,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Suçun işlenmesiyle mağdurun veya kamunun uğradığı zararın; aynen iade, suçtan önceki hâle getirme veya tazmin suretiyle tamamen giderilmesi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Açıklanmasının geri bırakılmasına karar verilen hükümde, mahkûm olunan hapis cezası ertelenemez ve kısa süreli olması hâlinde seçenek yaptırımlara çevrilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Hükmün açıklanmasının geri bırakılması kararının verilmesi hâlinde sanık, beş yıl süreyle denetim süresine tâbi tutulur. Denetim süresi içinde, kişi hakkında kasıtlı bir suç nedeniyle bir daha hükmün açıklanmasının geri bırakılmasına karar verilemez. Bu süre içinde bir yıldan fazla olmamak üzere mahkemenin belirleyeceği süreyle, sanığın denetimli serbestlik tedbiri olarak;</template>
            <mvz-bent no="a">
              <template>Bir meslek veya sanat sahibi olmaması hâlinde, meslek veya sanat sahibi olmasını sağlamak amacıyla bir eğitim programına devam etmesine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bir meslek veya sanat sahibi olması hâlinde, bir kamu kurumunda veya özel olarak aynı meslek veya sanatı icra eden bir başkasının gözetimi altında ücret karşılığında çalıştırılmasına,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Belli yerlere gitmekten yasaklanmasına, belli yerlere devam etmek hususunda yükümlü kılınmasına ya da takdir edilecek başka yükümlülüğü yerine getirmesine,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>karar verilebilir. Denetim süresi içinde dava zamanaşımı durur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Altıncı fıkranın (c) bendinde belirtilen koşulu derhal yerine getiremediği takdirde; sanık hakkında mağdura veya kamuya verdiği zararı denetim süresince aylık taksitler hâlinde ödemek suretiyle tamamen gidermesi koşuluyla da hükmün açıklanmasının geri bırakılması kararı verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Denetim süresi içinde kasten yeni bir suç işlenmediği ve denetimli serbestlik tedbirine ilişkin yükümlülüklere uygun davranıldığı takdirde, açıklanması geri bırakılan hüküm ortadan kaldırılarak, davanın düşmesi kararı verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>Denetim süresi içinde kasten yeni bir suç işlemesi veya denetimli serbestlik tedbirine ilişkin yükümlülüklere aykırı davranması hâlinde, mahkeme hükmü açıklar. Ancak mahkeme, kendisine yüklenen yükümlülükleri yerine getiremeyen sanığın durumunu değerlendirerek; cezanın yarısına kadar belirleyeceği bir kısmının infaz edilmemesine ya da koşullarının varlığı hâlinde hükümdeki hapis cezasının ertelenmesine veya seçenek yaptırımlara çevrilmesine karar vererek yeni bir mahkûmiyet hükmü kurabilir. Açıklanan veya yeni kurulan hükme itiraz edilebilir. İtiraz mercii ancak bu fıkradaki koşullarla sınırlı olarak bir değerlendirme yapabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="12">
            <template>272 nci maddenin üçüncü fıkrası hükümleri saklı kalmak üzere, hükmün açıklanmasının geri bırakılması kararına karşı istinaf yoluna başvurulabilir. Bölge adliye mahkemesi tarafından verilen kararlar hakkında 286 ncı madde hükümleri uygulanır. 272 nci maddenin üçüncü fıkrası hükümleri saklı kalmak üzere, hükmün açıklanmasının geri bırakılması kararının ilk derece mahkemesi sıfatıyla bölge adliye mahkemesi veya Yargıtay tarafından verilmesi hâlinde temyiz yoluna gidilebilir. İstinaf ve temyiz yolunda karar ve hüküm, usul ve esasa ilişkin hukuka aykırılıklar yönünden incelenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="13">
            <template>Hükmün açıklanmasının geri bırakılması kararı, bunlara mahsus bir sisteme kaydedilir. Bu kayıtlar, ancak bir soruşturma veya kovuşturmayla bağlantılı olarak Cumhuriyet savcısı, hâkim veya mahkeme tarafından istenmesi hâlinde, bu maddede belirtilen amaç için kullanılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="14">
            <template>Bu maddenin hükmün açıklanmasının geri bırakılmasına ilişkin hükümleri, işkence ve eziyet suçları ile kamu görevlisinin görevi sebebiyle işlediği ve Anayasanın 17 nci maddesi kapsamında kötü muamele kabul edilebilecek suçlar hakkında uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="232" başlık="Hükmün gerekçesi ve hüküm fıkrasının içereceği hususlar">
          <mvz-fıkra no="1">
            <template>Hükmün başına, "Türk Milleti adına" verildiği yazılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükmün başında;</template>
            <mvz-bent no="a">
              <template>Hükmü veren mahkemenin adı,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hükmü veren mahkeme başkanının ve üyelerinin veya hâkimin, Cumhuriyet savcısının ve zabıt kâtibinin, katılanın, mağdurun, vekilinin, kanunî temsilcisinin ve müdafiin adı ve soyadı ile sanığın açık kimliği,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Beraat kararı dışında, suçun işlendiği yer, tarih ve zaman dilimi,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Sanığın gözaltında veya tutuklu kaldığı tarih ve süre ile halen tutuklu olup olmadığı,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Yazılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hükmün gerekçesi ve varsa karşı oy gerekçesi, tümüyle tutanağa geçirilmemişse açıklanmasından itibaren en geç onbeş gün içinde dava dosyasına konulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Karar ve hükümler bunlara katılan hâkimler tarafından imzalanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Hüküm sonucu tefhim edildikten sonra gerekçeli karar imzalanmadan hâkim ölür veya herhangi bir sebeple kararı imzalayamayacak hâle düşerse, yeni hâkim, tefhim edilen hükme uygun olarak gerekçeli kararı bizzat yazarak imzalar. Toplu mahkemelerde böyle bir durumun gerçekleşmesi hâlinde, hüküm diğer hâkimler tarafından imzalanır ve başkan veya en kıdemli hâkim tarafından, hükmün altına diğer hâkimin imza edememesinin sebebi yazılarak imza olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Hüküm fıkrasında, 223 üncü maddeye göre verilen kararın ne olduğunun, uygulanan kanun maddelerinin, verilen ceza miktarının, kanun yollarına başvurma ve tazminat isteme olanağının bulunup bulunmadığının, başvuru olanağı varsa süresi ve merciinin tereddüde yer vermeyecek şekilde açıkça gösterilmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Hükümlerin nüshaları ve özetleri mahkeme başkanı veya hâkim ile zabıt kâtibi tarafından imzalanır ve mühürlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="4-DÖRDÜNCÜ" başlık="Mağdur, Şikâyetçi, Malen Sorumlu, Katılan">
    <mvz-kısım no="1-BİRİNCİ" başlık="Suçun Mağduru ile Şikâyetçinin Hakları">
      <mvz-madde no="233" başlık="Suçun mağduru ile şikâyetçinin çağırılması">
        <mvz-fıkra no="1">
          <template>Mağdur ile şikâyetçi, Cumhuriyet savcısı veya mahkeme başkanı veya hâkim tarafından çağrı kâğıdı ile çağırılıp dinlenir.  Kovuşturma evresine geçildiğinde çağrı kâğıdına iddianame eklenir. Ayrıca, iddianameye ilişkin bilgiler ve duruşma tarihi; telefon, telgraf, faks, elektronik posta gibi iletişim bilgilerinin dosyada bulunması hâlinde bu araçlardan yararlanılmak suretiyle de bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu hususta yapılacak çağrı ve zorla getirme bakımından tanıklara ilişkin hükümler uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="234" başlık="Mağdur ile şikâyetçinin hakları">
        <mvz-fıkra no="1">
          <template>Mağdur ile şikâyetçinin hakları şunlardır:</template>
          <mvz-bent no="a">
            <template>Soruşturma evresinde;</template>
            <mvz-altbent no="1">
              <template>Delillerin toplanmasını isteme,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Soruşturmanın gizlilik ve amacını bozmamak koşuluyla Cumhuriyet savcısından belge örneği isteme,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Vekili bulunmaması halinde, cinsel saldırı, çocukların cinsel istismarı veya ısrarlı takip suçları ile kadına karşı işlenen kasten yaralama, işkence veya eziyet suçlarında ve alt sınırı beş yıldan fazla hapis cezasını gerektiren suçlarda, baro tarafından kendisine avukat görevlendirilmesini isteme,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>153 üncü maddeye uygun olmak koşuluyla vekili aracılığı ile soruşturma belgelerini ve elkonulan ve muhafazaya alınan eşyayı inceletme,</template>
            </mvz-altbent>
            <mvz-altbent no="5">
              <template>Cumhuriyet savcısının, kovuşturmaya yer olmadığı yönündeki kararına kanunda yazılı usule göre itiraz hakkını kullanma.</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kovuşturma evresinde;</template>
            <mvz-altbent no="1">
              <template>Duruşmadan haberdar edilme,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Kamu davasına katılma,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Tutanak ve belgelerden örnek isteme,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>Tanıkların davetini isteme,</template>
            </mvz-altbent>
            <mvz-altbent no="5">
              <template>Vekili bulunmaması halinde, cinsel saldırı, çocukların cinsel istismarı veya ısrarlı takip suçları ile kadına karşı işlenen kasten yaralama, işkence veya eziyet suçlarında ve alt sınırı beş yıldan fazla hapis cezasını gerektiren suçlarda, baro tarafından kendisine avukat görevlendirilmesini isteme,</template>
            </mvz-altbent>
            <mvz-altbent no="6">
              <template>Davaya katılmış olma koşuluyla davayı sonuçlandıran kararlara karşı kanun yollarına başvurma.</template>
            </mvz-altbent>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mağdur, onsekiz yaşını doldurmamış, sağır veya dilsiz ya da meramını ifade edemeyecek derecede malûl olur ve bir vekili de bulunmazsa, istemi aranmaksızın bir vekil görevlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu haklar, suçun mağdurları ile şikâyetçiye anlatılıp açıklanır ve bu husus tutanağa yazılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Soruşturma veya kovuşturma evresinde, dava nakli veya adlî tıp işlemleri nedeniyle yerleşim yeri dışında bir yere gitme zorunluluğu doğması hâlinde mağdurun yapmış olduğu konaklama, iaşe ve ulaşım giderleri, 10/2/1954 tarihli ve 6245 sayılı Harcırah Kanunu hükümlerine göre Adalet Bakanlığı bütçesinden karşılanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="235" başlık="Mağdur ile şikâyetçinin davete uymamaları">
        <mvz-fıkra no="1">
          <template>Mağdur, şikâyetçi veya vekilinin, dilekçelerinde veya tutanağa geçirilmiş olan beyanlarında belirttikleri adresleri tebligata esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu adrese çıkartılan çağrıya rağmen gelmeyen kimseye yeniden tebligatta bulunulmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belirtilen adresin yanlışlığı, eksikliği veya adres değişikliğinin bildirilmemesi nedeniyle tebligat yapılamaması hâllerinde adresin araştırılması gerekmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu kimselerin beyanının alınması zorunlu görüldüğü hâllerde üçüncü fıkra uygulanmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="236" başlık="Mağdur ile şikâyetçinin dinlenmesi">
        <mvz-fıkra no="1">
          <template>Mağdurun tanık olarak dinlenmesi halinde, yemin hariç, tanıklığa ilişkin hükümler uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İşlenen suçun etkisiyle psikolojisi bozulmuş çocuk veya mağdur, bu suça ilişkin soruşturma veya kovuşturmada tanık olarak bir defa dinlenebilir. Maddî gerçeğin ortaya çıkarılması açısından zorunluluk arz eden haller saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mağdur çocukların veya işlenen suçun etkisiyle psikolojisi bozulmuş olan diğer mağdurun tanık olarak dinlenmesi sırasında psikoloji, psikiyatri, tıp veya eğitim alanında uzman bir kişi bulundurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Cumhuriyet savcısı veya hâkim tarafından ifade ve beyanının özel ortamda alınması gerektiği ya da şüpheli veya sanık ile yüz yüze gelmesinde sakınca bulunduğu değerlendirilen çocuk veya mağdurların ifade ve beyanları özel ortamda uzmanlar aracılığıyla alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Türk Ceza Kanununun 103 üncü maddesinin ikinci fıkrasında düzenlenen suçlardan mağdur olan çocukların soruşturma evresindeki beyanları, bunlara yönelik hizmet veren merkezlerde Cumhuriyet savcısının nezaretinde uzmanlar aracılığıyla alınır. Mağdur çocuğun beyan ve görüntüleri kayda alınır. Kovuşturma evresinde ise ancak, maddi gerçeğin ortaya çıkarılması açısından mağdur çocuğun beyanının alınması veya başkaca bir işlem yapılmasında zorunluluk bulunması hâlinde bu işlem, mahkeme veya görevlendireceği naip hâkim tarafından bu merkezlerde uzmanlar aracılığıyla yerine getirilir. Mağdur çocuk yargı çevresi ve mülkî sınırlara bakılmaksızın en yakın merkeze götürülmek suretiyle bu fıkrada belirtilen işlemler yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Türk Ceza Kanununun 102 nci maddesinin ikinci fıkrasında düzenlenen suçlardan mağdur olanların soruşturma evresindeki beyanları bakımından da beşinci fıkra hükmü uygulanır. Ancak, beyan ve görüntülerin kayda alınmasında mağdurun rızası aranır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Beşinci ve altıncı fıkra kapsamında alınan beyan ve görüntü kayıtları dava dosyasında saklanır, kimseye verilmez ve gizliliği için gerekli tedbirler alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Beşinci ve altıncı fıkra kapsamında alınan beyan ve görüntü kayıtları, yazılı tutanağa dönüştürülür. Bu tutanak, talepte bulunan şüpheli, sanık, müdafii, mağdur, vekil veya kanuni temsilciye verilir. Beyan ve görüntü kayıtları bu kişilere soruşturma ve kovuşturma makamlarının gözetiminde gizliliği korunmak suretiyle izletilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Beşinci ve altıncı fıkrada belirtilen merkezler, devlet üniversiteleri tarafından da kurulabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Kamu Davasına Katılma">
      <mvz-madde no="237" başlık="Kamu davasına katılma">
        <mvz-fıkra no="1">
          <template>Mağdur, suçtan zarar gören gerçek ve tüzel kişiler ile malen sorumlu olanlar, ilk derece mahkemesindeki kovuşturma evresinin her aşamasında hüküm verilinceye kadar şikâyetçi olduklarını bildirerek kamu davasına katılabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanun yolu muhakemesinde davaya katılma isteğinde bulunulamaz. Ancak, ilk derece mahkemesinde ileri sürülüp reddolunan veya karara bağlanmayan katılma istekleri, kanun yolu başvurusunda açıkça belirtilmişse incelenip karara bağlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="238" başlık="Katılma usulü">
        <mvz-fıkra no="1">
          <template>Katılma, kamu davasının açılmasından sonra mahkemeye dilekçe verilmesi veya katılma istemini içeren sözlü başvurunun duruşma tutanağına geçirilmesi suretiyle olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Duruşma sırasında şikâyeti belirten ifade üzerine, suçtan zarar görenden davaya katılmak isteyip istemediği sorulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Cumhuriyet savcısının, sanık ve varsa müdafiinin dinlenmesinden sonra davaya katılma isteminin uygun olup olmadığına karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="239" başlık="Katılanın hakları">
        <mvz-fıkra no="1">
          <template>Mağdur veya suçtan zarar gören davaya katıldığında, cinsel saldırı, çocukların cinsel istismarı veya ısrarlı takip suçları ile kadına karşı işlenen kasten yaralama, işkence veya eziyet suçlarında ve alt sınırı beş yıldan fazla hapis cezasını gerektiren suçlarda, baro tarafından kendisine avukat görevlendirilmesini isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mağdur veya suçtan zarar görenin çocuk, sağır ve dilsiz veya kendisini savunamayacak derecede akıl hastası olması halinde avukat görevlendirilmesi için istem aranmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="240" başlık="Katılmanın davaya etkisi">
        <mvz-fıkra no="1">
          <template>Katılma davayı durdurmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tarihi belirlenmiş olan duruşma ve yargılama usulüne ilişkin diğer işlemler vaktin darlığından dolayı katılan kimse çağrılamayacak veya kendisine haber verilemeyecek olsa bile belirli gününde yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="241" başlık="Katılmadan önceki kararlara itiraz">
        <mvz-fıkra no="1">
          <template>Katılmadan önce verilmiş olan kararlar katılana tebliğ edilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu kararlara karşı kanun yoluna başvurabilmesi için Cumhuriyet savcısı için öngörülen sürenin geçmesiyle katılan da başvuru hakkını kaybeder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="242" başlık="Katılanın kanun yoluna başvurması">
        <mvz-fıkra no="1">
          <template>Katılan, Cumhuriyet savcısına bağlı olmaksızın kanun yollarına başvurabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Karar, katılanın başvurusu üzerine bozulursa, Cumhuriyet savcısı işi yeniden takip eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="243" başlık="Katılmanın hükümsüz kalması">
        <mvz-fıkra no="1">
          <template>Katılan, vazgeçerse veya ölürse katılma hükümsüz kalır. Mirasçılar, katılanın haklarını takip etmek üzere davaya katılabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="5-BEŞİNCİ" başlık="Özel Yargılama Usulleri">
    <mvz-kısım no="1-BİRİNCİ" başlık="Gaiplerin ve Kaçakların Yargılanması, Tüzel Kişilerin Soruşturmada ve Kovuşturmada Temsili, Bazı Suçlara İlişkin Muhakeme Usulü">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Gaiplerin Yargılanması">
        <mvz-madde no="244" başlık="Gaibin tanımı ve yapılabilecek işlemler">
          <mvz-fıkra no="1">
            <template>Bulunduğu yer bilinmeyen veya yurt dışında bulunup da yetkili mahkeme önüne getirilemeyen veya getirilmesi uygun bulunmayan sanık gaip sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gaip hakkında duruşma açılmaz; mahkeme, delillerin ele geçirilmesi veya korunması amacıyla gerekli işlemleri yapar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu işlemler naip hâkim veya istinabe olunan mahkeme aracılığıyla da yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu işlemler sırasında sanığın müdafii veya kanunî temsilcisi veya eşi hazır bulunabilir. Gerektiğinde, mahkemece barodan bir müdafi görevlendirilmesi istenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="245" başlık="Gaibe ihtar">
          <mvz-fıkra no="1">
            <template>Adresi bilinmeyen gaibe, mahkeme önüne gelmesi veya adresini bildirmesi hususları uygun bir iletişim aracıyla ihtar edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="246" başlık="Sanığa verilecek güvence belgesi">
          <mvz-fıkra no="1">
            <template>Mahkeme, gaip olan sanık hakkında duruşmaya gelmesi hâlinde tutuklanmayacağı hususunda bir güvence belgesi verebilir ve bu güvence koşullara bağlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sanık, hapis cezası ile mahkûm olur veya kaçmak hazırlığında bulunur veya güvence belgesinin bağlı olduğu koşullara uymazsa belgenin hükmü kalmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Kaçakların Yargılanması">
        <mvz-madde no="247" başlık="Kaçağın tanımı">
          <mvz-fıkra no="1">
            <template>Hakkındaki soruşturmanın veya kovuşturmanın sonuçsuz kalmasını sağlamak amacıyla yurt içinde saklanan veya yabancı ülkede bulunan ve bu nedenle Cumhuriyet savcısı veya mahkeme tarafından kendisine ulaşılamayan kişiye kaçak denir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hakkında, 248 inci maddenin ikinci fıkrasında belirtilen suçlardan dolayı soruşturma veya kovuşturma başlatılmış olan şüpheli veya sanığın, yetkili Cumhuriyet savcısı veya mahkemece usulüne göre yapılan tebligata uymamasından dolayı verilen zorla getirilme kararı da yerine getirilemez ise, Cumhuriyet savcısı veya mahkeme;</template>
            <mvz-bent no="a">
              <template>Çağrının bir gazete ile şüpheli veya sanığın bilinen konutunun kapısına asılmak suretiyle ilânına karar verir; yapılacak ilânlarda, onbeş gün içinde gelmediği takdirde 248 inci maddede gösterilen tedbirlere hükmedilebileceğini ayrıca açıklar,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bu işlemlerin yerine getirildiğinin bir tutanak ile saptanmasından itibaren onbeş gün içinde başvurmayan şüpheli veya sanığın kaçak olduğuna karar verir.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kaçak sanık hakkında kovuşturma yapılabilir. Ancak, daha önce sorgusu yapılmamış ise, mahkûmiyet ve ceza verilmesine yer olmadığı kararı verilemez. Güvenlik tedbirine karar verilmesi halinde kaçak sanık veya müdafii, savunma hakkının kullanılmak istendiğini belirterek yargılamanın yenilenmesini talep edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Duruşma yapılan hâllerde kaçak sanığın müdafii yoksa, mahkeme barodan bir avukat görevlendirilmesini ister.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="248" başlık="Zorlama amaçlı elkoyma ve teminat belgesi">
          <mvz-fıkra no="1">
            <template>Kaçağın Cumhuriyet savcısına başvurmasını veya duruşmaya gelmesini sağlamak amacıyla Türkiye'de bulunan mallarına, hak ve alacaklarına amaçla orantılı olarak Cumhuriyet savcısının istemi üzerine sulh ceza hâkimi veya mahkeme kararıyla elkonulabilir ve gerektiğinde idaresi için kayyım atanır. Elkoyma ve kayyım atama kararı müdafiine bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra hükmü;</template>
            <mvz-bent no="a">
              <template>Türk Ceza Kanununda tanımlanan;</template>
              <mvz-altbent no="1">
                <template>Soykırım ve insanlığa karşı suçlar (madde 76, 77, 78),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Göçmen kaçakçılığı ve insan ticareti (madde 79, 80),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Hırsızlık (madde 141, 142),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Yağma (madde 148, 149),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Güveni kötüye kullanma (madde 155),</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Dolandırıcılık (madde 157, 158),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Hileli iflas (madde 161),</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
              <mvz-altbent no="9">
                <template>Parada sahtecilik (madde 197),</template>
              </mvz-altbent>
              <mvz-altbent no="10">
                <template>Suç işlemek amacıyla örgüt kurma (madde 220),</template>
              </mvz-altbent>
              <mvz-altbent no="11">
                <template>Zimmet (madde 247),</template>
              </mvz-altbent>
              <mvz-altbent no="12">
                <template>İrtikâp (madde 250),</template>
              </mvz-altbent>
              <mvz-altbent no="13">
                <template>Rüşvet (madde 252),</template>
              </mvz-altbent>
              <mvz-altbent no="14">
                <template>İhaleye fesat karıştırma (madde 235),</template>
              </mvz-altbent>
              <mvz-altbent no="15">
                <template>Edimin ifasına fesat karıştırma (madde 236),</template>
              </mvz-altbent>
              <mvz-altbent no="16">
                <template>Devletin Güvenliğine Karşı Suçlar (madde 302, 303, 304, 305, 306, 307, 308),</template>
              </mvz-altbent>
              <mvz-altbent no="17">
                <template>Anayasal Düzene ve Bu Düzenin İşleyişine Karşı Suçlar (madde 309, 310, 311, 312, 313),</template>
              </mvz-altbent>
              <mvz-altbent no="18">
                <template>Silahlı örgüt (madde 314) veya bu örgütlere silah sağlama (madde 315),</template>
              </mvz-altbent>
              <mvz-altbent no="19">
                <template>Devlet Sırlarına Karşı Suçlar ve Casusluk (madde 328, 329, 330, 331, 333, 334, 335, 336, 337),</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="0">
              <template>Suçları,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunda tanımlanan silah kaçakçılığı (madde 12) suçları,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bankalar Kanununun 22 nci maddesinin (3) ve (4) numaralı fıkralarında tanımlanan zimmet suçu,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kaçakçılıkla Mücadele Kanununda tanımlanan ve hapis cezasını gerektiren suçlar,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kültür ve Tabiat Varlıklarını Koruma Kanununun 68 ve 74 üncü maddelerinde tanımlanan suçlar,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Hakkında uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Elkonulan mal, hak ve alacakların korunmasında, elkoymaya ilişkin hükümler uygulanır. Tedbirlere ilişkin kararların özetinin bir gazetede ilânına sulh ceza hâkimince veya mahkemece karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kaçak yakalandığında veya kendiliğinden gelerek teslim olduğunda elkoymanın kaldırılmasına karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kaçak hakkında 100 üncü ve sonraki maddeler gereğince, sulh ceza hâkimi veya mahkeme tarafından yokluğunda tutuklama kararı verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Sulh ceza hâkimi veya mahkeme elkoymaya karar verdiğinde, kaçağın yasal olarak bakmakla yükümlü bulunduğu yakınlarının alınan tedbirler nedeniyle yoksulluğa düşebileceklerini saptarsa, bunların geçimlerini sağlamak üzere, elkonulan mal varlığından sosyal durumları ile orantılı miktarda yardımda bulunulması konusunda kayyıma izin verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>246 ncı madde hükmü kaçaklar hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Bu kararlara karşı itiraz edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Tüzel Kişilerin Soruşturmada ve Kovuşturmada Temsili">
        <mvz-madde no="249" başlık="Tüzel kişinin temsili">
          <mvz-fıkra no="1">
            <template>Bir tüzel kişinin faaliyeti çerçevesinde işlenen suçlardan dolayı yapılan soruşturma ve kovuşturmada tüzel kişinin organ veya temsilcisi, katılan veya savunma makamı yanında yer alan sıfatıyla duruşmaya kabul edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu durumda, tüzel kişinin organ veya temsilcisi bu Kanunun katılana veya sanığa sağladığı haklardan yararlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci fıkra hükmü, sanığın aynı zamanda tüzel kişinin organ veya temsilcisi sıfatını taşıması hâlinde uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Bazı Suçlara İlişkin Muhakeme">
        <mvz-madde no="250" başlık="Seri muhakeme usulü">
          <mvz-fıkra no="1">
            <template>Soruşturma evresi sonunda aşağıdaki suçlarla ilgili olarak kamu davasının açılmasının ertelenmesine karar verilmediği takdirde seri muhakeme usulü uygulanır:</template>
            <mvz-bent no="a">
              <template>Türk Ceza Kanununda yer alan;</template>
              <mvz-altbent no="1">
                <template>Hakkı olmayan yere tecavüz (madde 154, ikinci ve üçüncü fıkra),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Genel güvenliğin kasten tehlikeye sokulması (madde 170, birinci ve üçüncü fıkra),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Trafik güvenliğini tehlikeye sokma (madde 179, ikinci ve üçüncü fıkra),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Gürültüye neden olma (madde 183),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Parada sahtecilik (madde 197, ikinci ve üçüncü fıkra),</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Mühür bozma (madde 203),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Resmi belgenin düzenlenmesinde yalan beyan (madde 206),</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>Kumar oynanması için yer ve imkan sağlama (madde 228, birinci fıkra),</template>
              </mvz-altbent>
              <mvz-altbent no="9">
                <template>Başkasına ait kimlik veya kimlik bilgilerinin kullanılması (madde 268),</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="0">
              <template>suçları.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>10/7/1953 tarihli ve 6136 sayılı Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunun 13 üncü maddesinin üçüncü fıkrası ile 15 inci maddesinin birinci, ikinci ve üçüncü fıkralarında belirtilen suçlar.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>31/8/1956 tarihli ve 6831 sayılı Orman Kanununun 93 üncü maddesinin birinci fıkrasında belirtilen suç.</template>
            </mvz-bent>
            <mvz-bent no="d">
