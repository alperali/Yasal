              <template>Kültür ve Tabiat Varlıklarını Koruma Kanununun 68 ve 74 üncü maddelerinde tanımlanan suçlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu madde uyarınca atanan kayyımların görevleriyle ilgili iş ve işlemlerinden dolayı tazminat davaları, 142 ila 144 üncü maddeler uyarınca Devlet aleyhine açılır. Devlet, ödediği tazminattan dolayı görevinin gereklerine aykırı hareket etmek suretiyle görevini kötüye kullanan kayyımlara bir yıl içinde rücu eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="134" başlık="Bilgisayarlarda, bilgisayar programlarında ve kütüklerinde arama, kopyalama ve elkoyma">
          <mvz-fıkra no="1">
            <template>Bir suç dolayısıyla yapılan soruşturmada, somut delillere dayanan kuvvetli şüphe sebeplerinin varlığı ve başka surette delil elde etme imkânının bulunmaması halinde, hâkim veya gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısı tarafından şüphelinin kullandığı bilgisayar ve bilgisayar programları ile bilgisayar kütüklerinde arama yapılmasına, bilgisayar kayıtlarından kopya çıkarılmasına, bu kayıtların çözülerek metin hâline getirilmesine karar verilir.  Cumhuriyet savcısı tarafından verilen kararlar yirmi dört saat içinde hâkim onayına sunulur. Hâkim kararını en geç yirmi dört saat içinde verir. Sürenin dolması veya hâkim tarafından aksine karar verilmesi hâlinde çıkarılan kopyalar ve çözümü yapılan metinler derhâl imha edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bilgisayar, bilgisayar programları ve bilgisayar kütüklerine şifrenin çözülememesinden dolayı girilememesi veya gizlenmiş bilgilere ulaşılamaması ya da işlemin uzun sürecek olması halinde çözümün yapılabilmesi ve gerekli kopyaların alınabilmesi için, bu araç ve gereçlere elkonulabilir. Şifrenin çözümünün yapılması ve gerekli kopyaların alınması halinde, elkonulan cihazlar gecikme olmaksızın iade edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bilgisayar veya bilgisayar kütüklerine elkoyma işlemi sırasında, sistemdeki bütün verilerin yedeklemesi yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Üçüncü fıkraya göre alınan yedekten bir kopya çıkarılarak şüpheliye veya vekiline verilir ve bu husus tutanağa geçirilerek imza altına alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bilgisayar veya bilgisayar kütüklerine elkoymaksızın da, sistemdeki verilerin tamamının veya bir kısmının kopyası alınabilir. Kopyası alınan veriler kâğıda yazdırılarak, bu husus tutanağa kaydedilir ve ilgililer tarafından imza altına alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="5-BEŞİNCİ" başlık="Telekomünikasyon Yoluyla Yapılan İletişimin Denetlenmesi">
        <mvz-madde no="135" başlık="İletişimin tespiti, dinlenmesi ve kayda alınması">
          <mvz-fıkra no="1">
            <template>Bir suç dolayısıyla yapılan soruşturma ve kovuşturmada, suç işlendiğine ilişkin somut delillere dayanan kuvvetli şüphe sebeplerinin varlığı ve başka suretle delil elde edilmesi imkânının bulunmaması durumunda, hâkim veya gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısının kararıyla şüpheli veya sanığın telekomünikasyon yoluyla iletişimi dinlenebilir, kayda alınabilir ve sinyal bilgileri değerlendirilebilir. Cumhuriyet savcısı kararını derhâl hâkimin onayına sunar ve hâkim, kararını en geç yirmi dört saat içinde verir. Sürenin dolması veya hâkim tarafından aksine karar verilmesi hâlinde tedbir Cumhuriyet savcısı tarafından derhâl kaldırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Talepte bulunulurken hakkında bu madde uyarınca tedbir kararı verilecek hattın veya iletişim aracının sahibini ve biliniyorsa kullanıcısını gösterir belge veya rapor eklenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Şüpheli veya sanığın tanıklıktan çekinebilecek kişilerle arasındaki iletişimi kayda alınamaz. Kayda alma gerçekleştikten sonra bu durumun anlaşılması hâlinde, alınan kayıtlar derhâl yok edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birinci fıkra hükmüne göre verilen kararda, yüklenen suçun türü, hakkında tedbir uygulanacak kişinin kimliği, iletişim aracının türü, telefon numarası veya iletişim bağlantısını tespite imkân veren kodu, tedbirin türü, kapsamı ve süresi belirtilir. Tedbir kararı en çok iki ay için verilebilir; bu süre, bir ay daha uzatılabilir.  Ancak, örgütün faaliyeti çerçevesinde işlenen suçlarla ilgili olarak gerekli görülmesi halinde, hâkim yukarıdaki sürelere ek olarak her defasında bir aydan fazla olmamak ve toplam üç ayı geçmemek üzere uzatılmasına karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Şüpheli veya sanığın yakalanabilmesi için, mobil telefonun yeri, hâkim veya gecikmesinde sakınca bulunan hallerde Cumhuriyet savcısının kararına istinaden tespit edilebilir. Bu hususa ilişkin olarak verilen kararda, mobil telefon numarası ve tespit işleminin süresi belirtilir. Tespit işlemi en çok iki ay için yapılabilir; bu süre, bir ay daha uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Şüpheli ve sanığın telekomünikasyon yoluyla iletişiminin tespiti, soruşturma aşamasında hâkim veya gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısı, kovuşturma aşamasında mahkeme kararına istinaden yapılır. Kararda, yüklenen suçun türü, hakkında tedbir uygulanacak kişinin kimliği, iletişim aracının türü, telefon numarası veya iletişim bağlantısını tespite imkân veren kodu ve tedbirin süresi belirtilir.  Cumhuriyet savcısı kararını yirmi dört saat içinde hâkimin onayına sunar ve hâkim, kararını en geç yirmi dört saat içinde verir. Sürenin dolması veya hâkim tarafından aksine karar verilmesi hâlinde kayıtlar derhâl imha edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu madde hükümlerine göre alınan karar ve yapılan işlemler, tedbir süresince gizli tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Bu madde kapsamında dinleme, kayda alma ve sinyal bilgilerinin değerlendirilmesine ilişkin hükümler ancak aşağıda sayılan suçlarla ilgili olarak uygulanabilir:</template>
            <mvz-bent no="a">
              <template>Türk Ceza Kanununda yer alan;</template>
              <mvz-altbent no="1">
                <template>Göçmen kaçakçılığı ve insan ticareti (madde 79, 80) ile organ veya doku ticareti (madde 91),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Kasten öldürme (madde 81, 82, 83),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>İşkence (madde 94, 95),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Cinsel saldırı (birinci fıkra hariç, madde 102),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Çocukların cinsel istismarı (madde 103),</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Nitelikli hırsızlık (madde 142) ve yağma (madde 148, 149) ile nitelikli dolandırıcılık (madde 158),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>Parada sahtecilik (madde 197),</template>
              </mvz-altbent>
              <mvz-altbent no="9">
                <template>Suç işlemek amacıyla örgüt kurma (madde 220, fıkra üç),</template>
              </mvz-altbent>
              <mvz-altbent no="10">
                <template>Fuhuş (madde 227),</template>
              </mvz-altbent>
              <mvz-altbent no="11">
                <template>İhaleye fesat karıştırma (madde 235),</template>
              </mvz-altbent>
              <mvz-altbent no="12">
                <template>Tefecilik (madde 241),</template>
              </mvz-altbent>
              <mvz-altbent no="13">
                <template>Rüşvet (madde 252),</template>
              </mvz-altbent>
              <mvz-altbent no="14">
                <template>Suçtan kaynaklanan malvarlığı değerlerini aklama (madde 282),</template>
              </mvz-altbent>
              <mvz-altbent no="15">
                <template>Devletin birliğini ve ülke bütünlüğünü bozmak (madde 302) ,</template>
              </mvz-altbent>
              <mvz-altbent no="16">
                <template>Anayasal Düzene ve Bu Düzenin İşleyişine Karşı Suçlar (madde 309, 311, 312, 313, 314, 315, 316),</template>
              </mvz-altbent>
              <mvz-altbent no="17">
                <template>Devlet Sırlarına Karşı Suçlar ve Casusluk (madde 328, 329, 330, 331, 333, 334, 335, 336, 337) suçları.</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunda tanımlanan silah kaçakçılığı (madde 12) suçları.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bankalar Kanununun 22 nci maddesinin (3) ve (4) numaralı fıkralarında tanımlanan zimmet suçu,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kaçakçılıkla Mücadele Kanununda tanımlanan ve hapis cezasını gerektiren suçlar.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kültür ve Tabiat Varlıklarını Koruma Kanununun 68 ve 74 üncü maddelerinde tanımlanan suçlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Bu maddede belirlenen esas ve usuller dışında hiç kimse, bir başkasının telekomünikasyon yoluyla iletişimini dinleyemez ve kayda alamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="136" başlık="Müdafiin bürosu ve yerleşim yeri">
          <mvz-fıkra no="1">
            <template>Şüpheli veya sanığa yüklenen suç dolayısıyla müdafiin bürosu, konutu ve yerleşim yerindeki telekomünikasyon araçları hakkında, 135 inci madde hükmü uygulanamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="137" başlık="Kararların yerine getirilmesi, iletişim içeriklerinin yok edilmesi">
          <mvz-fıkra no="1">
            <template>135 inci maddeye göre verilecek karar gereğince Cumhuriyet savcısı veya görevlendireceği adlî kolluk görevlisi, telekomünikasyon hizmeti veren kurum ve kuruluşların yetkililerinden iletişimin tespiti, dinlenmesi veya kayda alınması işlemlerinin yapılmasını ve bu amaçla cihazların yerleştirilmesini yazılı olarak istediğinde, bu istem derhâl yerine getirilir; yerine getirilmemesi hâlinde zor kullanılabilir. İşlemin başladığı ve bitirildiği tarih ve saat ile işlemi yapanın kimliği bir tutanakla saptanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>135 inci maddeye göre verilen karar gereğince tutulan kayıtlar, Cumhuriyet Savcılığınca görevlendirilen kişiler tarafından çözülerek metin hâline getirilir. Yabancı dildeki kayıtlar, tercüman aracılığı ile Türkçe'ye çevrilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>135 inci maddeye göre verilen kararın uygulanması sırasında şüpheli hakkında kovuşturmaya yer olmadığına dair karar verilmesi ya da aynı maddenin birinci fıkrasına göre hâkim onayının alınamaması halinde, bunun uygulanmasına Cumhuriyet savcısı tarafından derhâl son verilir. Bu durumda, yapılan tespit veya dinlemeye ilişkin kayıtlar Cumhuriyet savcısının denetimi altında en geç on gün içinde yok edilerek, durum bir tutanakla tespit edilir.  Beraat kararı verilmesi durumunda da tespit veya dinlemeye ilişkin kayıtlar, hâkim denetimi altında aynı usulle yok edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Tespit ve dinlemeye ilişkin kayıtların yok edilmesi halinde soruşturma veya kovuşturma evresinin bitiminden itibaren, en geç onbeş gün içinde, Cumhuriyet başsavcılığı veya mahkeme, tedbirin nedeni, kapsamı, süresi ve sonucu hakkında ilgilisine yazılı olarak bilgi verir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="138" başlık="Tesadüfen elde edilen deliller">
          <mvz-fıkra no="1">
            <template>Arama veya elkoyma koruma tedbirlerinin uygulanması sırasında, yapılmakta olan soruşturma veya kovuşturmayla ilgisi olmayan ancak, diğer bir suçun işlendiği şüphesini uyandırabilecek bir delil elde edilirse; bu delil muhafaza altına alınır ve durum Cumhuriyet Savcılığına derhâl bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Telekomünikasyon yoluyla yapılan iletişimin denetlenmesi sırasında, yapılmakta olan soruşturma veya kovuşturmayla ilgisi olmayan ve ancak, 135 inci maddenin altıncı fıkrasında sayılan suçlardan birinin işlendiği şüphesini uyandırabilecek bir delil elde edilirse; bu delil muhafaza altına alınır ve durum Cumhuriyet Savcılığına derhâl bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="6-ALTINCI" başlık="Gizli Soruşturmacı ve Teknik Araçlarla İzleme">
        <mvz-madde no="139" başlık="Gizli soruşturmacı görevlendirilmesi">
          <mvz-fıkra no="1">
            <template>Soruşturma konusu suçun işlendiği hususunda somut delillere dayanan kuvvetli şüphe sebeplerinin bulunması ve başka surette delil elde edilememesi hâlinde, kamu görevlileri gizli soruşturmacı olarak görevlendirilebilir. Bu madde uyarınca yapılacak görevlendirmeye hâkim tarafından karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturmacının kimliği değiştirilebilir. Bu kimlikle hukukî işlemler yapılabilir. Kimliğin oluşturulması ve devam ettirilmesi için zorunlu olması durumunda gerekli belgeler hazırlanabilir, değiştirilebilir ve kullanılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Soruşturmacı görevlendirilmesine ilişkin karar ve diğer belgeler ilgili Cumhuriyet Başsavcılığında muhafaza edilir. Soruşturmacının kimliği, görevinin sona ermesinden sonra da gizli tutulur.  Soruşturmacı, kovuşturma evresinde tanık olarak dinlenmesinin zorunlu olması halinde, duruşmada hazır bulunma hakkına sahip bulunanlar olmadan veya ses ya da görüntüsü değiştirilerek özel ortamda dinlenir. Bu durumda 27/12/2007 tarihli ve 5726 sayılı Tanık Koruma Kanununun 9 uncu maddesi hükmü kıyasen uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Soruşturmacı, faaliyetlerini izlemekle görevlendirildiği örgüte ilişkin her türlü araştırmada bulunmak ve bu örgütün faaliyetleri çerçevesinde işlenen suçlarla ilgili delilleri toplamakla yükümlüdür.  Hâkim, soruşturmacının yedinci fıkranın (a) bendinin (1) numaralı alt bendinde yer alan suç bakımından kamuya açık yerlerde ve işyerlerinde delil toplamak amacıyla ses veya görüntü kaydı yapmasına izin verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Soruşturmacı, görevini yerine getirirken suç işleyemez ve görevlendirildiği örgütün işlemekte olduğu suçlardan sorumlu tutulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Soruşturmacı görevlendirilmesi suretiyle elde edilen kişisel bilgiler, görevlendirildiği ceza soruşturması ve kovuşturması dışında kullanılamaz.  Suçla bağlantılı olmayan kişisel bilgiler derhâl yok edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu madde hükümleri ancak aşağıda sayılan suçlarla ilgili olarak uygulanabilir:</template>
            <mvz-bent no="a">
              <template>Türk Ceza Kanununda yer alan;</template>
              <mvz-altbent no="1">
                <template>Örgüt faaliyeti çerçevesinde işlenip işlenmediğine bakılmaksızın uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Suç işlemek amacıyla örgüt kurma (iki, yedi ve sekizinci fıkralar hariç, madde 220),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Silahlı örgüt (madde 314) veya bu örgütlere silah sağlama (madde 315).</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunda tanımlanan silah kaçakçılığı (madde 12) suçları.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kültür ve Tabiat Varlıklarını Koruma Kanununun 68 ve 74 üncü maddelerinde tanımlanan suçlar.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="140" başlık="Teknik araçlarla izleme">
          <mvz-fıkra no="1">
            <template>Aşağıdaki suçların işlendiği hususunda somut delillere dayanan kuvvetli şüphe sebepleri bulunması ve başka suretle delil elde edilememesi hâlinde, şüpheli veya sanığın kamuya açık yerlerdeki faaliyetleri ve işyeri teknik araçlarla izlenebilir, ses veya görüntü kaydı alınabilir:</template>
            <mvz-bent no="a">
              <template>Türk Ceza Kanununda yer alan;</template>
              <mvz-altbent no="1">
                <template>Göçmen kaçakçılığı ve insan ticareti (madde 79, 80) ile organ veya doku ticareti (madde 91),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Kasten öldürme (madde 81, 82, 83),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Nitelikli hırsızlık (madde 142) ve yağma (madde 148, 149) ile nitelikli dolandırıcılık (madde 158),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Parada sahtecilik (madde 197),</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Suç işlemek amacıyla örgüt kurma (madde 220, fıkra üç),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Fuhuş (madde 227)</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>İhaleye fesat karıştırma (madde 235),</template>
              </mvz-altbent>
              <mvz-altbent no="9">
                <template>Tefecilik (madde 241),</template>
              </mvz-altbent>
              <mvz-altbent no="10">
                <template>Rüşvet (madde 252),</template>
              </mvz-altbent>
              <mvz-altbent no="11">
                <template>Suçtan kaynaklanan malvarlığı değerlerini aklama (madde 282),</template>
              </mvz-altbent>
              <mvz-altbent no="12">
                <template>Devletin birliğini ve ülke bütünlüğünü bozmak (madde 302),</template>
              </mvz-altbent>
              <mvz-altbent no="13">
                <template>Anayasal Düzene ve Bu Düzenin İşleyişine Karşı Suçlar (madde 309, 311, 312, 313, 314, 315, 316),</template>
              </mvz-altbent>
              <mvz-altbent no="14">
                <template>Devlet Sırlarına Karşı Suçlar ve Casusluk (madde 328, 329, 330, 331, 333, 334, 335, 336, 337),</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="0">
              <template>Suçları.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunda tanımlanan silah kaçakçılığı (madde 12) suçları.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kaçakçılıkla Mücadele Kanununda tanımlanan ve hapis cezasını gerektiren suçlar.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kültür ve Tabiat Varlıklarını Koruma Kanununun 68 ve 74 üncü maddelerinde tanımlanan suçlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Teknik araçlarla izlemeye hâkim, gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısı tarafından karar verilir. Cumhuriyet savcısı tarafından verilen kararlar yirmi dört saat içinde hâkim onayına sunulur. Hâkim kararını en geç yirmi dört saat içinde verir. Sürenin dolması veya hâkim tarafından aksine karar verilmesi hâlinde kayıtlar derhâl imha edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Teknik araçlarla izleme kararı en çok üç haftalık süre için verilebilir. Bu süre gerektiğinde bir hafta daha uzatılabilir. Ancak, örgütün faaliyeti çerçevesinde işlenen suçlarla ilgili olarak gerekli görülmesi hâlinde, hâkim yukarıdaki sürelere ek olarak her defasında bir haftadan fazla olmamak ve toplam dört haftayı geçmemek üzere uzatılmasına karar verebilir.  Teknik araçlarla izleme tedbiri ile birlikte gizli soruşturmacı görevlendirilmesi halinde bu fıkrada belirtilen süreler bir kat artırılarak uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Elde edilen deliller, yukarıda sayılan suçlarla ilgili soruşturma ve kovuşturma dışında kullanılamaz; ceza kovuşturması bakımından gerekli olmadığı taktirde Cumhuriyet savcısının gözetiminde derhâl yok edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu madde hükümleri, kişinin konutunda uygulanamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="140/A" başlık="Yönetmelik">
          <mvz-fıkra no="1">
            <template>Bu Kanunun 135 ila 140 ıncı maddelerinde düzenlenen koruma tedbirlerinin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="7-YEDİNCİ" başlık="Koruma Tedbirleri Nedeniyle Tazminat">
        <mvz-madde no="141" başlık="Tazminat istemi">
          <mvz-fıkra no="1">
            <template>Suç soruşturması veya kovuşturması sırasında;</template>
            <mvz-bent no="a">
              <template>Kanunlarda belirtilen koşullar dışında yakalanan, tutuklanan veya tutukluluğunun devamına karar verilen,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kanunî gözaltı süresi içinde hâkim önüne çıkarılmayan,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kanunî hakları hatırlatılmadan veya hatırlatılan haklarından yararlandırılma isteği yerine getirilmeden tutuklanan,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kanuna uygun olarak tutuklandığı hâlde makul sürede yargılama mercii huzuruna çıkarılmayan ve bu süre içinde hakkında hüküm verilmeyen,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kanuna uygun olarak yakalandıktan veya tutuklandıktan sonra haklarında kovuşturmaya yer olmadığına veya beraatlerine karar verilen,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Mahkûm olup da gözaltı ve tutuklulukta geçirdiği süreleri, hükümlülük sürelerinden fazla olan veya işlediği suç için kanunda öngörülen cezanın sadece para cezası olması nedeniyle zorunlu olarak bu cezayla cezalandırılan,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Yakalama veya tutuklama nedenleri ve haklarındaki suçlamalar kendilerine, yazıyla veya bunun hemen olanaklı bulunmadığı hâllerde sözle açıklanmayan,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Yakalanmaları veya tutuklanmaları yakınlarına bildirilmeyen,</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Hakkındaki arama kararı ölçüsüz bir şekilde gerçekleştirilen,</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Eşyasına veya diğer malvarlığı değerlerine, koşulları oluşmadığı halde elkonulan veya korunması için gerekli tedbirler alınmayan ya da eşyası veya diğer malvarlığı değerleri amaç dışı kullanılan veya zamanında geri verilmeyen,</template>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Yakalama, adli kontrol veya tutuklama işlemine karşı Kanunda öngörülen başvuru imkânlarından yararlandırılmayan,48</template>
            </mvz-bent>
            <mvz-bent no="l">
              <template>Konutunu terk etmemek veya uyuşturucu, uyarıcı veya uçucu maddeler ile alkol bağımlılığından arınmak amacıyla hastaneye yatmak dâhil, tedavi veya muayene tedbirlerine tâbi olmak ve bunları kabul etmek şeklindeki adli kontrol yükümlülükleri uygulandıktan sonra haklarında kovuşturmaya yer olmadığına veya beraatlerine karar verilen Kişiler, maddî ve manevî her türlü zararlarını, Devletten isteyebilirler.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkranın (e), (f) ve (l) bentlerinde belirtilen kararları veren merciler, ilgiliye tazminat hakları bulunduğunu bildirirler ve bu husus verilen karara geçirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci fıkrada yazan hâller dışında, suç soruşturması veya kovuşturması sırasında kişisel kusur, haksız fiil veya diğer sorumluluk hâlleri de dâhil olmak üzere hâkimler ve Cumhuriyet savcılarının verdikleri kararlar veya yaptıkları işlemler nedeniyle tazminat davaları ancak Devlet aleyhine açılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Devlet, ödediği tazminattan dolayı görevinin gereklerine aykırı hareket etmek suretiyle görevini kötüye kullanan hâkimler ve Cumhuriyet savcılarına bir yıl içinde rücu eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="142" başlık="Tazminat isteminin koşulları">
          <mvz-fıkra no="1">
            <template>Karar veya hükümlerin kesinleştiğinin ilgilisine tebliğinden itibaren üç ay ve her hâlde karar veya hükümlerin kesinleşme tarihini izleyen bir yıl içinde tazminat isteminde bulunulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İstem, zarara uğrayanın oturduğu yer ağır ceza mahkemesinde ve eğer o yer ağır ceza mahkemesi tazminat konusu işlemle ilişkili ise ve aynı yerde başka bir ağır ceza dairesi yoksa, en yakın yer ağır ceza mahkemesinde karara bağlanır.  Ancak, 141 inci maddenin birinci fıkrasının (e), (f) ve (l) bentleri kapsamındaki istemler bakımından 9/1/2013 tarihli ve 6384 sayılı Tazminat Komisyonunun Görevleri ile Çalışma Usul ve Esasları Hakkında Kanun hükümleri uygulanır. Bu fıkra uyarınca 6384 sayılı Kanun kapsamında olmasına rağmen ağır ceza mahkemesine yapılan istemler, Komisyona gönderilir. Ağır ceza mahkemesinin görev alanına giren ve girmeyen istemler birlikte yapılmış ise ağır ceza mahkemesi görev alanına girmeyen istemleri ayırmak suretiyle Komisyona gönderir. Bu hâllerde ağır ceza mahkemesine yapılan istem tarihi esas alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tazminat isteminde bulunan kişinin dilekçesine, açık kimlik ve adresini, zarara uğradığı işlemin ve zararın nitelik ve niceliğini kaydetmesi ve bunların belgelerini eklemesi gereklidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Dilekçesindeki bilgi ve belgelerin yetersizliği durumunda mahkeme, eksikliğin bir ay içinde giderilmesini, aksi hâlde istemin reddedileceğini ilgiliye duyurur. Süresinde eksiği tamamlanmayan dilekçe, mahkemece, itiraz yolu açık olmak üzere reddolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Mahkeme, dosyayı inceledikten sonra yeterliliğini belirlediği dilekçe ve eki belgelerin bir örneğini Devlet Hazinesinin kendi yargı çevresindeki temsilcisine tebliğ ederek, varsa beyan ve itirazlarını iki hafta içinde yazılı olarak bildirmesini ister.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İstemin ve ispat belgelerinin değerlendirilmesinde ve tazminat hukukunun genel prensiplerine göre verilecek tazminat miktarının saptanmasında mahkeme gerekli gördüğü her türlü araştırmayı yapmaya veya hâkimlerinden birine yaptırmaya yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Mahkeme, kararını duruşmalı olarak verir. İstemde bulunan ile Hazine temsilcisi, açıklamalı çağrı kâğıdı tebliğine rağmen gelmezlerse, yokluklarında karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Karara karşı, istemde bulunan, Cumhuriyet savcısı veya Hazine temsilcisi, istinaf yoluna başvurabilir; inceleme öncelikle ve ivedilikle yapılır.  Karar yerinde görülmezse bölge adliye mahkemesince işin esası hakkında karar verilir. Bölge adliye mahkemelerince bu fıkra uyarınca verilen kararlar kesindir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Tazminat davaları nedeniyle Avukatlık Asgari Ücret Tarifesi gereğince hesaplanan nisbî avukatlık ücreti ödenir. Ancak, ödenecek miktar Tarifede sulh ceza hâkimliklerinde takip edilen işler için belirlenen maktu ücretten az, ağır ceza mahkemelerinde takip edilen davalar için belirlenen maktu ücretten fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Tazminata ilişkin mahkeme kararları, kesinleşmeden ve idari başvuru süreci tamamlanmadan icra takibine konulamaz. Kesinleşen mahkeme kararında hükmedilen tazminat ile vekâlet ücreti, davacı veya vekilinin davalı idareye yazılı şekilde bildireceği banka hesap numarasına, bu bildirimin yapıldığı tarihten itibaren otuz gün içinde ödenir. Bu süre içinde ödeme yapılmaması halinde, karar genel hükümler dairesinde infaz ve icra olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="143" başlık="Tazminatın geri alınması">
          <mvz-fıkra no="1">
            <template>Kovuşturmaya yer olmadığına ilişkin kararı sonradan kaldırılarak, hakkında kamu davası açılan ve mahkûm edilenlerle, yargılamanın aleyhte yenilenmesiyle beraat kararı kaldırılıp mahkûm edilenlere ödenmiş tazminatların mahkûmiyet süresine ilişkin kısmı, Cumhuriyet savcısının yazılı istemi ile aynı mahkemeden alınacak kararla kamu alacaklarının tahsiline ilişkin mevzuat hükümleri uygulanarak geri alınır. Bu karara itiraz edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İftira konusunu oluşturan suç veya yalan tanıklık nedeniyle gözaltına alınma ve tutuklama halinde; Devlet, iftira eden veya yalan tanıklıkta bulunan kişiye de rücu eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="144" başlık="Tazminat isteyemeyecek kişiler">
          <mvz-fıkra no="1">
            <template>Kanuna uygun olarak yakalanan, adli kontrol altına alınan veya tutuklanan kişilerden aşağıda belirtilenler tazminat isteyemezler:</template>
            <mvz-bent no="a" durum="mülga">
              <template></template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Tazminata hak kazanmadığı hâlde, sonradan yürürlüğe giren ve lehte düzenlemeler getiren kanun gereği, durumları tazminat istemeye uygun hâle dönüşenler.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Genel veya özel af, şikâyetten vazgeçme, uzlaşma gibi nedenlerle hakkında kovuşturmaya yer olmadığına veya davanın düşmesine karar verilen veya kamu davası geçici olarak durdurulan veya kamu davası ertelenen veya düşürülenler.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kusur yeteneğinin bulunmaması nedeniyle hakkında ceza verilmesine yer olmadığına karar verilenler.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Adlî makamlar huzurunda gerçek dışı beyanla suç işlediğini veya suça katıldığını bildirerek gözaltına alınmasına, adli kontrol altına alınmasına veya tutuklanmasına neden olanlar.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="5-BEŞİNCİ" başlık="İfade ve Sorgu">
      <mvz-bölüm no="1-BİRİNCİ" başlık="İfade veya Sorgu İçin Çağrı">
        <mvz-madde no="145" başlık="İfade veya sorgu için çağrı">
          <mvz-fıkra no="1">
            <template>İfadesi alınacak veya sorgusu yapılacak kişi davetiye ile çağrılır; çağrılma nedeni açıkça belirtilir; gelmezse zorla getirileceği yazılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="146" başlık="Zorla getirme">
          <mvz-fıkra no="1">
            <template>Hakkında tutuklama kararı verilmesi veya yakalama emri düzenlenmesi için yeterli nedenler bulunan veya 145 inci maddeye göre çağrıldığı halde gelmeyen şüpheli veya sanığın zorla getirilmesine karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Zorla getirme kararı, şüpheli veya sanığın açıkça kim olduğunu, kendisiyle ilgili suçu, gerektiğinde eşkâlini ve zorla getirilmesi nedenlerini içerir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Zorla getirme kararının bir örneği şüpheli veya sanığa verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Zorla getirme kararı ile çağrılan şüpheli veya sanık derhal, olanak bulunmadığında yol süresi hariç en geç yirmidört saat içinde çağıran hâkimin, mahkemenin veya Cumhuriyet savcısının önüne götürülür ve sorguya çekilir veya ifadesi alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Zorla getirme, bunun için haklı görülecek bir zamanda başlar ve hâkim, mahkeme veya Cumhuriyet savcısı tarafından, sorguya çekilmenin veya ifade almanın sonuna kadar devam eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Zorla getirme kararının yerine getirilememesinin nedenleri, köy veya mahalle muhtarı ile kolluk görevlisinin birlikte imzalayacakları bir tutanakla saptanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Çağrıya rağmen gelmeyen tanık, bilirkişi, mağdur ve şikâyetçi ile ilgili olarak da zorla getirme kararı verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="İfade ve Sorgu Usulü">
        <mvz-madde no="147" başlık="İfade ve sorgunun tarzı">
          <mvz-fıkra no="1">
            <template>Şüphelinin veya sanığın ifadesinin alınmasında veya sorguya çekilmesinde aşağıdaki hususlara uyulur:</template>
            <mvz-bent no="a">
              <template>Şüpheli veya sanığın kimliği saptanır. Şüpheli veya sanık, kimliğine ilişkin soruları doğru olarak cevaplandırmakla yükümlüdür.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kendisine yüklenen suç anlatılır.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Müdafi seçme hakkının bulunduğu ve onun hukukî yardımından yararlanabileceği, müdafiin ifade veya sorgusunda hazır bulunabileceği, kendisine bildirilir. Müdafi seçecek durumda olmadığı ve bir müdafi yardımından faydalanmak istediği takdirde, kendisine baro tarafından bir müdafi görevlendirilir.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>95 inci madde hükmü saklı kalmak üzere, yakalanan kişinin yakınlarından istediğine yakalandığı derhâl bildirilir.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Yüklenen suç hakkında açıklamada bulunmamasının kanunî hakkı olduğu söylenir.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Şüpheden kurtulması için somut delillerin toplanmasını isteyebileceği hatırlatılır ve kendisi aleyhine var olan şüphe nedenlerini ortadan kaldırmak ve lehine olan hususları ileri sürmek olanağı tanınır.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>İfade verenin veya sorguya çekilenin kişisel ve ekonomik durumu hakkında bilgi alınır.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>İfade ve sorgu işlemlerinin kaydında, teknik imkânlardan yararlanılır.</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>İfade veya sorgu bir tutanağa bağlanır. Bu tutanakta aşağıda belirtilen hususlar yer alır:</template>
              <mvz-altbent no="1">
                <template>İfade alma veya sorguya çekme işleminin yapıldığı yer ve tarih.</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>İfade alma veya sorguya çekme sırasında hazır bulunan kişilerin isim ve sıfatları ile ifade veren veya sorguya çekilen kişinin açık kimliği.</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>İfade almanın veya sorgunun yapılmasında yukarıdaki işlemlerin yerine getirilip getirilmediği, bu işlemler yerine getirilmemiş ise nedenleri.</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Tutanak içeriğinin ifade veren veya sorguya çekilen ile hazır olan müdafi tarafından okunduğu ve imzalarının alındığı.</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>İmzadan çekinme hâlinde bunun nedenleri.</template>
              </mvz-altbent>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="148" başlık="İfade alma ve sorguda yasak usuller">
          <mvz-fıkra no="1">
            <template>Şüphelinin ve sanığın beyanı özgür iradesine dayanmalıdır. Bunu engelleyici nitelikte kötü davranma, işkence, ilâç verme, yorma, aldatma, cebir veya tehditte bulunma, bazı araçları kullanma gibi bedensel veya ruhsal müdahaleler yapılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kanuna aykırı bir yarar vaat edilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yasak usullerle elde edilen ifadeler rıza ile verilmiş olsa da delil olarak değerlendirilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Müdafi hazır bulunmaksızın kollukça alınan ifade, hâkim veya mahkeme huzurunda şüpheli veya sanık tarafından doğrulanmadıkça hükme esas alınamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Şüphelinin aynı olayla ilgili olarak yeniden ifadesinin alınması ihtiyacı ortaya çıktığında, bu işlem ancak Cumhuriyet savcısı tarafından yapılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="6-ALTINCI" başlık="Savunma">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Müdafi Seçimi, Görevlendirilmesi, Görev ve Yetkileri">
        <mvz-madde no="149" başlık="Şüphelinin veya sanığın müdafi seçimi">
          <mvz-fıkra no="1">
            <template>Şüpheli veya sanık, soruşturma ve kovuşturmanın her aşamasında bir veya birden fazla müdafiin yardımından yararlanabilir; kanunî temsilcisi varsa, o da şüpheliye veya sanığa müdafi seçebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturma evresinde, ifade almada en çok üç avukat hazır bulunabilir.  Örgüt faaliyeti çerçevesinde işlenen suçlar bakımından yürütülen kovuşturmalarda, duruşmada en çok üç avukat hazır bulunabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Soruşturma ve kovuşturma evrelerinin her aşamasında avukatın, şüpheli veya sanıkla görüşme, ifade alma veya sorgu süresince yanında olma ve hukukî yardımda bulunma hakkı engellenemez, kısıtlanamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="150" başlık="Müdafiin görevlendirilmesi">
          <mvz-fıkra no="1">
            <template>Şüpheli veya sanıktan kendisine bir müdafi seçmesi istenir. Şüpheli veya sanık, müdafi seçebilecek durumda olmadığını beyan ederse, istemi halinde bir müdafi görevlendirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Müdafii bulunmayan şüpheli veya sanık; çocuk, kendisini savunamayacak derecede malul veya sağır ve dilsiz ise, istemi aranmaksızın bir müdafi görevlendirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Alt sınırı beş yıldan fazla hapis cezasını gerektiren suçlardan dolayı yapılan soruşturma ve kovuşturmada ikinci fıkra hükmü uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Zorunlu müdafilikle ilgili diğer hususlar, Türkiye Barolar Birliğinin görüşü alınarak çıkarılacak yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="151" başlık="Müdafi görevini yerine getirmediğinde yapılacak işlem ve müdafilik görevinden yasaklanma">
          <mvz-fıkra no="1">
            <template>150 nci madde hükmüne göre görevlendirilen müdafi, duruşmada hazır bulunmaz veya vakitsiz olarak duruşmadan çekilir veya görevini yerine getirmekten kaçınırsa, hâkim veya mahkeme derhâl başka bir müdafi görevlendirilmesi için gerekli işlemi yapar. Bu durumda mahkeme oturuma ara verebileceği gibi oturumun ertelenmesine de karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eğer yeni müdafi savunmasını hazırlamak için yeterli zaman olmadığını açıklarsa oturum ertelenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>149 uncu maddeye göre seçilen veya 150 nci maddeye göre görevlendirilen ve Türk Ceza Kanununun 220 ve 314 üncü maddesinde sayılan suçlar ile terör suçlarından şüpheli, sanık veya hükümlü olanların müdafilik veya vekillik görevini üstlenen avukat, hakkında bu fıkrada sayılan suçlar nedeniyle kovuşturma bulunması halinde müdafilik veya vekillik görevini üstlenmekten yasaklanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cumhuriyet savcısının yasaklamaya ilişkin talebi hakkında, hâkim veya mahkeme tarafından gecikmeksizin karar verilir. Bu kararlara karşı itiraz edilebilir. İtiraz sonucunda yasaklama kararının kaldırılması halinde avukat görevini devam ettirir. Müdafilik görevinden yasaklama kararı, kovuşturma konusu suçla sınırlı olmak üzere, bir yıl süre ile verilebilir. Ancak, kovuşturmanın niteliği itibariyle bu süreler altı aydan fazla olmamak üzere en fazla iki defa uzatılabilir. Soruşturma sonunda kovuşturmaya yer olmadığına dair karar verilmesi veya kovuşturma sonunda mahkûmiyet dışında bir karar verilmesi halinde, kesinleşmesi beklenmeksizin yasaklama kararı kendiliğinden kalkar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Görevden yasaklama kararı, şüpheli, sanık veya hükümlü ile yeni bir müdafi görevlendirilmesi için derhal ilgili baro başkanlığına bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Müdafi veya vekil görevden yasaklanmış bulunduğu sürece başka davalarla ilgili olsa bile müdafiliğini veya vekilliğini üstlendiği kişiyi ceza infaz kurumunda veya tutukevinde ziyaret edemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="152" başlık="Şüpheli veya sanığın birden fazla olması hâlinde savunma">
          <mvz-fıkra no="1">
            <template>Yararları birbirine uygun olan birden fazla şüpheli veya sanığın savunması aynı müdafie verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="153" başlık="Müdafiin dosyayı inceleme yetkisi">
          <mvz-fıkra no="1">
            <template>Müdafi, soruşturma evresinde dosya içeriğini inceleyebilir ve istediği belgelerin bir örneğini harçsız olarak alabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Müdafiin dosya içeriğini inceleme veya belgelerden örnek alma yetkisi, soruşturmanın amacını tehlikeye düşürebilecek ise Cumhuriyet savcısının istemi üzerine hâkim kararıyla kısıtlanabilir. Bu karar ancak aşağıda sayılan suçlara ilişkin yürütülen soruşturmalarda verilebilir:</template>
            <mvz-bent no="a">
              <template>26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununda yer alan;</template>
              <mvz-altbent no="1">
                <template>Kasten öldürme (madde 81, 82, 83),</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Cinsel saldırı (birinci fıkra hariç, madde 102),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Çocukların cinsel istismarı (madde 103),</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188),</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Suç işlemek amacıyla örgüt kurma (madde 220),</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Devletin Güvenliğine Karşı Suçlar (madde 302, 303, 304, 307, 308),</template>
              </mvz-altbent>
              <mvz-altbent no="7">
                <template>Anayasal Düzene ve Bu Düzenin İşleyişine Karşı Suçlar (madde 309, 310, 311, 312, 313, 314, 315, 316),</template>
              </mvz-altbent>
              <mvz-altbent no="8">
                <template>Devlet Sırlarına Karşı Suçlar ve Casusluk (madde 326, 327, 328, 329, 330, 331, 333, 334, 335, 336, 337).</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="b">
              <template>10/7/1953 tarihli ve 6136 sayılı Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunda tanımlanan silah kaçakçılığı (madde 12) suçları.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>19/10/2005 tarihli ve 5411 sayılı Bankacılık Kanununun 160 ıncı maddesinde tanımlanan zimmet suçu.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>21/3/2007 tarihli ve 5607 sayılı Kaçakçılıkla Mücadele Kanununda tanımlanan suçlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yakalanan kişinin veya şüphelinin ifadesini içeren tutanak ile bilirkişi raporları ve adı geçenlerin hazır bulunmaya yetkili oldukları diğer adli işlemlere ilişkin tutanaklar hakkında, ikinci fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Müdafi, iddianamenin mahkeme tarafından kabul edildiği tarihten itibaren dosya içeriğini ve muhafaza altına alınmış delilleri inceleyebilir; bütün tutanak ve belgelerin örneklerini harçsız olarak alabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu maddenin içerdiği haklardan suçtan zarar görenin vekili de yararlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="154" başlık="Müdafi ile görüşme">
          <mvz-fıkra no="1">
            <template>Şüpheli veya sanık, vekâletname aranmaksızın müdafii ile her zaman ve konuşulanları başkalarının duyamayacağı bir ortamda görüşebilir. Bu kişilerin müdafii ile yazışmaları denetime tâbi tutulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Türk Ceza Kanununun İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümlerinde tanımlanan suçlar ve Terörle Mücadele Kanunu kapsamına giren suçlar ile örgüt faaliyeti çerçevesinde işlenen uyuşturucu ve uyarıcı madde imâl ve ticareti suçları bakımından gözaltındaki şüphelinin müdafi ile görüşme hakkı Cumhuriyet savcısının istemi üzerine, hâkim kararıyla yirmidört saat süreyle kısıtlanabilir; bu zaman zarfında ifade alınamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="155" başlık="Kanunî temsilci veya eşin duruşmada hazır bulunması">
          <mvz-fıkra no="1">
            <template>Sanığın kanunî temsilcisine duruşma gün ve saati bildirilir ve duruşmaya kabul edilerek istemi üzerine dinlenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sanığın eşi hakkında da tebligat yapılmaksızın birinci fıkra hükmü uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="156" başlık="Müdafiin görevlendirilmesinde usul">
          <mvz-fıkra no="1">
            <template>150 nci maddede yazılı olan hâllerde, müdafi;</template>
            <mvz-bent no="a">
              <template>Soruşturma evresinde, ifadeyi alan merciin veya sorguyu yapan hâkimin istemi üzerine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kovuşturma evresinde, mahkemenin istemi üzerine,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Baro tarafından görevlendirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıda belirtilen hâllerde müdafi soruşturmanın veya kovuşturmanın yapıldığı yer barosunca görevlendirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Şüpheli veya sanığın kendisinin sonradan müdafi seçmesi halinde, baro tarafından görevlendirilen avukatın görevi sona erer.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="2-İKİNCİ" başlık="Soruşturma">
    <mvz-kısım no="1-BİRİNCİ" başlık="Suçlara İlişkin İhbarlar ve Soruşturma">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Soruşturmanın Gizliliği, Suçların İhbarı">
        <mvz-madde no="157" başlık="Soruşturmanın gizliliği">
          <mvz-fıkra no="1">
            <template>Kanunun başka hüküm koyduğu hâller saklı kalmak ve savunma haklarına zarar vermemek koşuluyla soruşturma evresindeki usul işlemleri gizlidir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="158" başlık="İhbar ve şikâyet">
          <mvz-fıkra no="1">
            <template>Suça ilişkin ihbar veya şikâyet, Cumhuriyet Başsavcılığına veya kolluk makamlarına yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Valilik veya kaymakamlığa ya da mahkemeye yapılan ihbar veya şikâyet, ilgili Cumhuriyet Başsavcılığına gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yurt dışında işlenip ülkede takibi gereken suçlar hakkında Türkiye'nin elçilik ve konsolosluklarına da ihbar veya şikâyette bulunulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bir kamu görevinin yürütülmesiyle bağlantılı olarak işlendiği iddia edilen bir suç nedeniyle, ilgili kurum ve kuruluş idaresine yapılan ihbar veya şikâyet, gecikmeksizin ilgili Cumhuriyet Başsavcılığına gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İhbar veya şikâyet yazılı veya tutanağa geçirilmek üzere sözlü olarak yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İhbar ve şikâyet konusu fiilin suç oluşturmadığının herhangi bir araştırma yapılmasını gerektirmeksizin açıkça anlaşılması veya ihbar ve şikâyetin soyut ve genel nitelikte olması durumunda soruşturma yapılmasına yer olmadığına karar verilir. Bu durumda şikâyet edilen kişiye şüpheli sıfatı verilemez. Soruşturma yapılmasına yer olmadığına dair karar, varsa ihbarda bulunana veya şikâyetçiye bildirilir ve bu karara karşı 173 üncü maddedeki usule göre itiraz edilebilir. İtirazın kabulü hâlinde Cumhuriyet başsavcılığı soruşturma işlemlerini başlatır. Bu fıkra uyarınca yapılan işlemler ve verilen kararlar, bunlara mahsus bir sisteme kaydedilir. Bu kayıtlar, ancak Cumhuriyet savcısı, hâkim veya mahkeme tarafından görülebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Yürütülen soruşturma sonucunda kovuşturma evresine geçildikten sonra suçun şikâyete bağlı olduğunun anlaşılması halinde; mağdur açıkça şikâyetten vazgeçmediği takdirde, yargılamaya devam olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="159" başlık="Şüpheli ölümün ihbarı">
          <mvz-fıkra no="1">
            <template>Bir ölümün doğal nedenlerden meydana gelmediği kuşkusunu doğuracak bir durumun varlığı veya ölünün kimliğinin belirlenememesi halinde; kolluk görevlisi, köy muhtarı ya da sağlık veya cenaze işleriyle görevli kişiler, durumu derhâl Cumhuriyet Başsavcılığına bildirmekle yükümlüdürler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra kapsamına giren hallerde ölünün gömülmesi ancak Cumhuriyet savcısı tarafından verilecek yazılı izne bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Soruşturma İşlemleri">
        <mvz-madde no="160" başlık="Bir suçun işlendiğini öğrenen Cumhuriyet savcısının görevi">
          <mvz-fıkra no="1">
            <template>Cumhuriyet savcısı, ihbar veya başka bir suretle bir suçun işlendiği izlenimini veren bir hâli öğrenir öğrenmez kamu davasını açmaya yer olup olmadığına karar vermek üzere hemen işin gerçeğini araştırmaya başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhuriyet savcısı, maddî gerçeğin araştırılması ve adil bir yargılamanın yapılabilmesi için, emrindeki adlî kolluk görevlileri marifetiyle, şüphelinin lehine ve aleyhine olan delilleri toplayarak muhafaza altına almakla ve şüphelinin haklarını korumakla yükümlüdür.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="161" başlık="Cumhuriyet savcısının görev ve yetkileri">
          <mvz-fıkra no="1">
            <template>Cumhuriyet savcısı, doğrudan doğruya veya emrindeki adlî kolluk görevlileri aracılığı ile her türlü araştırmayı yapabilir; yukarıdaki maddede yazılı sonuçlara varmak için bütün kamu görevlilerinden her türlü bilgiyi isteyebilir. Cumhuriyet savcısı, adlî görevi gereğince nezdinde görev yaptığı mahkemenin yargı çevresi dışında bir işlem yapmak ihtiyacı ortaya çıkınca, bu hususta o yer Cumhuriyet savcısından söz konusu işlemi yapmasını ister.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Adlî kolluk görevlileri, elkoydukları olayları, yakalanan kişiler ile uygulanan tedbirleri emrinde çalıştıkları Cumhuriyet savcısına derhâl bildirmek ve bu Cumhuriyet savcısının adliyeye ilişkin bütün emirlerini gecikmeksizin yerine getirmekle yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cumhuriyet savcısı, adlî kolluk görevlilerine emirleri yazılı; acele hâllerde, sözlü olarak verir.  Sözlü emir, en kısa sürede yazılı olarak da bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Diğer kamu görevlileri de, yürütülmekte olan soruşturma kapsamında ihtiyaç duyulan bilgi ve belgeleri, talep eden Cumhuriyet savcısına vakit geçirmeksizin temin etmekle yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kanun tarafından kendilerine verilen veya kanun dairesinde kendilerinden istenen adliye ile ilgili görev veya işlerde kötüye kullanma veya ihmalleri görülen kamu görevlileri ile Cumhuriyet savcılarının sözlü veya yazılı istem ve emirlerini yapmakta kötüye kullanma veya ihmalleri görülen kolluk âmir ve memurları hakkında Cumhuriyet savcılarınca doğrudan doğruya soruşturma yapılır. Vali ve kaymakamlar hakkında 2.12.1999 tarihli ve 4483 sayılı Memurlar ve Diğer Kamu Görevlilerinin Yargılanması Hakkında Kanun hükümleri, en üst dereceli kolluk amirleri hakkında ise, hâkimlerin görevlerinden dolayı tâbi oldukları yargılama usulü uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Vali ve kaymakamların kişisel suçları hakkında soruşturma ve kovuşturma yapma yetkisi, ilgilinin görev yaptığı yerin bağlı olduğu bölge adliye mahkemesinin bulunduğu yerdeki il Cumhuriyet başsavcılığı ve aynı yer ağır ceza mahkemesine aittir. Ağır ceza mahkemesinin görevine giren suçüstü hâllerinde soruşturma genel hükümlere göre yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Yetkisizlik kararı ile gelen bir soruşturmada Cumhuriyet savcısı, kendisinin de yetkisiz olduğu kanaatine varırsa yetkisizlik kararı verir ve yetkili savcılığın belirlenmesi için soruşturma dosyasını, yargı çevresinde görev yaptığı ağır ceza mahkemesine en yakın ağır ceza mahkemesine gönderir. Mahkemece bu konuda verilen karar kesindir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Türk Ceza Kanununun 302, 309, 311, 312, 313, 314, 315 ve 316 ncı maddelerinde düzenlenen suçlar hakkında, görev sırasında veya görevinden dolayı işlenmiş olsa bile Cumhuriyet savcılarınca doğrudan soruşturma yapılır. 1/11/1983 tarihli ve 2937 sayılı Devlet İstihbarat Hizmetleri ve Milli İstihbarat Teşkilatı Kanununun 26 ncı maddesi hükmü saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Seçimden önce veya sonra bir suç işlediği ileri sürülen milletvekili hakkında soruşturma ve kovuşturma yapma yetkisi, Ankara Cumhuriyet Başsavcılığı ve bu yer ağır ceza mahkemesine aittir. Soruşturmayı Cumhuriyet Başsavcısı veya görevlendireceği vekili bizzat yapar. Başsavcı veya vekili, suçun işlendiği yer Cumhuriyet savcısından soruşturmanın kısmen veya tamamen yapılmasını isteyebilir. Gecikmesinde sakınca bulunan hâllerde suçun işlendiği yer Cumhuriyet savcısı zorunlu olan delilleri toplar ve gerekmesi hâlinde alınacak kararlar bakımından bulunduğu yer sulh ceza hâkimliğinden talepte bulunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="162" başlık="Soruşturmada Cumhuriyet savcısının hâkim kararı istemi">
          <mvz-fıkra no="1">
            <template>Cumhuriyet savcısı, ancak hâkim tarafından yapılabilecek olan bir soruşturma işlemine gerek görürse, istemlerini bu işlemin yapılacağı yerin sulh ceza hâkimine bildirir. Sulh ceza hâkimi istenilen işlem hakkında, kanuna uygun olup olmadığını inceleyerek karar verir ve gereğini yerine getirir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="163" başlık="Soruşturmanın sulh ceza hâkimi tarafından yapılması">
          <mvz-fıkra no="1">
            <template>Suçüstü hâli ile gecikmesinde sakınca bulunan hâllerde, Cumhuriyet savcısına erişilemiyorsa veya olay genişliği itibarıyla Cumhuriyet savcısının iş gücünü aşıyorsa, sulh ceza hâkimi de bütün soruşturma işlemlerini yapabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kolluk âmir ve memurları, sulh ceza hâkimi tarafından emredilen tedbirleri alır ve araştırmaları yerine getirirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="164" başlık="Adlî kolluk ve görevi">
          <mvz-fıkra no="1">
            <template>Adlî kolluk; 4.6.1937 tarihli ve 3201 sayılı Emniyet Teşkilatı Kanununun 8, 9 ve 12 nci maddeleri, 10.3.1983 tarihli ve 2803 sayılı Jandarma Teşkilat, Görev ve Yetkileri Kanununun 7 nci maddesi, 2.7.1993 tarihli ve 485 sayılı Gümrük Müsteşarlığının Teşkilat ve Görevleri Hakkında Kanun Hükmünde Kararnamenin 8 inci maddesi ve 9.7.1982 tarihli ve 2692 sayılı Sahil Güvenlik Komutanlığı Kanununun 4 üncü maddesinde belirtilen soruşturma işlemlerini yapan güvenlik görevlilerini ifade eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturma işlemleri, Cumhuriyet savcısının emir ve talimatları doğrultusunda öncelikle adlî kolluğa yaptırılır. Adlî kolluk görevlileri, Cumhuriyet savcısının adlî görevlere ilişkin emirlerini yerine getirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Adlî kolluk, adlî görevlerin haricindeki hizmetlerde, üstlerinin emrindedir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="165" başlık="Diğer kolluk birimlerinin adlî kolluk görevi">
          <mvz-fıkra no="1">
            <template>Gerektiğinde veya Cumhuriyet savcısının talebi halinde, diğer kolluk birimleri de adlî kolluk görevini yerine getirmekle yükümlüdür. Bu durumda, kolluk görevlileri hakkında, adlî görevleri dolayısıyla bu Kanun hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="166" başlık="Değerlendirme raporu yetkisi">
          <mvz-fıkra no="1">
            <template>Cumhuriyet başsavcıları her yılın sonunda, o yerdeki adlî kolluğun sorumluları hakkında değerlendirme raporları düzenleyerek, mülkî idare amirlerine gönderir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="167" başlık="Yönetmelik">
          <mvz-fıkra no="1">
            <template>Adlî kolluk görevlilerinin nitelikleri ve bunların hizmet öncesi ve hizmet içi eğitimi, diğer hizmet birimleri ile ilişkileri, değerlendirme raporlarının düzenlenmesi, uzmanlık dallarına göre hangi bölümlerde çalıştırılacakları ve diğer hususlar; bu Kanunun yürürlük tarihinden itibaren altı ay içinde Adalet ve İçişleri Bakanlıklarınca müştereken çıkarılacak yönetmelikte belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="168" başlık="Adlî kolluğun olay yerinde aldığı tedbirlere uyulmaması halinde yetkisi">
          <mvz-fıkra no="1">
            <template>Olay yerinde görevine ait işlemlere başlayan adlî kolluk görevlisi, bunların yapılmasına engel olan veya yetkisi içinde aldığı tedbirlere aykırı davranan kişileri, işlemler sonuçlanıncaya kadar ve gerektiğinde zor kullanarak bundan men eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="169" başlık="Soruşturma evresinde yapılan işlemlerin tutanağa bağlanması">
          <mvz-fıkra no="1">
            <template>Şüphelinin ifadesinin alınması veya sorgusu, tanık ve bilirkişinin dinlenmesi veya bir keşif ve muayene sırasında Cumhuriyet savcısı veya sulh ceza hâkiminin yanında bir zabıt kâtibi bulunur. Acele hâllerde, yemin vermek koşuluyla, başka bir kimse, yazman olarak görevlendirilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Her soruşturma işlemi tutanağa bağlanır. Tutanak, adlî kolluk görevlisi, Cumhuriyet savcısı veya sulh ceza hâkimi ile hazır bulunan zabıt kâtibi tarafından imza edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Müdafi veya vekil sıfatıyla hazır bulunduğu işlemlerle ilgili tutanakta avukatın isim ve imzasına da yer verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Tutanak, işlemin yapıldığı yeri, tarihi, başlama ve bitiş saatini ve işleme katılan veya ilgisi bulunan kimselerin isimlerini içerir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İşlemde hazır bulunan ilgililerce onanmak üzere tutanağın kendilerini ilgilendiren kısımları okunur veya okumaları için kendilerine verilir. Bu husus tutanağa yazılarak ilgililere imza ettirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İmzadan kaçınma hâlinde nedenleri tutanağa geçirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Türk Ceza Kanununun İkinci Kitap Dördüncü Kısmının Dört, Beş, Altı ve Yedinci Bölümünde tanımlanan suçlar  ile 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanununun kapsamına giren suçlarla ilgili yürütülen soruşturma ve kovuşturmalarda, kolluk tarafından düzenlenen tutanaklara, ilgili görevlilerin açık kimlikleri yerine sadece sicil numaraları yazılır. Kolluk görevlilerinin ifadesine başvurulması gerektiği hâllerde çıkarılan davetiye veya çağrı kâğıdı, kolluk görevlisinin iş yeri adresine tebliğ edilir. Bu kişilere ait ifade ve duruşma tutanaklarında adres olarak iş yeri adresleri gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Kamu Davasının Açılması">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Kamu Davasının Açılması">
        <mvz-madde no="170" başlık="Kamu davasını açma görevi">
          <mvz-fıkra no="1">
            <template>Kamu davasını açma görevi, Cumhuriyet savcısı tarafından yerine getirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturma evresi sonunda toplanan deliller, suçun işlendiği hususunda yeterli şüphe oluşturuyorsa; Cumhuriyet savcısı, bir iddianame düzenler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Görevli ve yetkili mahkemeye hitaben düzenlenen iddianamede;</template>
            <mvz-bent no="a">
              <template>Şüphelinin kimliği,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Müdafii,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Maktul, mağdur veya suçtan zarar görenin kimliği,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Mağdurun veya suçtan zarar görenin vekili veya kanunî temsilcisi,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Açıklanmasında sakınca bulunmaması halinde ihbarda bulunan kişinin kimliği,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Şikâyette bulunan kişinin kimliği,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Şikâyetin yapıldığı tarih,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Yüklenen suç ve uygulanması gereken kanun maddeleri,</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Yüklenen suçun işlendiği yer, tarih ve zaman dilimi,</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Suçun delilleri,</template>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Şüphelinin tutuklu olup olmadığı; tutuklanmış ise, gözaltına alma ve tutuklama tarihleri ile bunların süreleri,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İddianamede, yüklenen suçu oluşturan olaylar, mevcut delillerle ilişkilendirilerek açıklanır; yüklenen suçu oluşturan olaylar ve suçun delilleriyle ilgisi bulunmayan bilgilere yer verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İddianamenin sonuç kısmında, şüphelinin sadece aleyhine olan hususlar değil, lehine olan hususlar da ileri sürülür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İddianamenin sonuç kısmında, işlenen suç dolayısıyla ilgili kanunda öngörülen ceza ve güvenlik tedbirlerinden hangilerine hükmedilmesinin istendiği; suçun tüzel kişinin faaliyeti çerçevesinde işlenmesi halinde, ilgili tüzel kişi hakkında uygulanabilecek olan güvenlik tedbiri açıkça belirtilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="171" başlık="Kamu davasını açmada takdir yetkisi">
          <mvz-fıkra no="1">
            <template>Cezayı kaldıran şahsî sebep olarak etkin pişmanlık hükümlerinin uygulanmasını gerektiren koşulların ya da şahsî cezasızlık sebebinin varlığı halinde, Cumhuriyet savcısı kovuşturmaya yer olmadığı kararı verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Uzlaştırma ve önödeme kapsamındaki suçlar hariç olmak üzere, Cumhuriyet savcısı, üst sınırı üç yıl veya daha az süreli hapis cezasını gerektiren suçlardan dolayı, yeterli şüphenin varlığına rağmen, kamu davasının açılmasının beş yıl süre ile ertelenmesine karar verebilir. Suçtan zarar gören veya şüpheli, bu karara 173 üncü madde hükümlerine göre itiraz edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kamu davasının açılmasının ertelenmesine karar verilebilmesi için;</template>
            <mvz-bent no="a">
              <template>Şüphelinin daha önce kasıtlı bir suçtan dolayı hapis cezası ile mahkûm olmamış bulunması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yapılan soruşturmanın, kamu davası açılmasının ertelenmesi halinde şüphelinin suç işlemekten çekineceği kanaatini vermesi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kamu davası açılmasının ertelenmesinin, şüpheli ve toplum açısından kamu davası açılmasından daha yararlı olması,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Suçun işlenmesiyle mağdurun veya kamunun uğradığı ve Cumhuriyet savcısı tarafından tespit edilen zararın, aynen iade, suçtan önceki hale getirme veya tazmin suretiyle tamamen giderilmesi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>koşullarının birlikte gerçekleşmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Erteleme süresi içinde kasıtlı bir suç işlenmediği takdirde, kovuşturmaya yer olmadığına karar verilir. Erteleme süresi içinde kasıtlı bir suç işlenmesi halinde kamu davası açılır. Erteleme süresince zamanaşımı işlemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kamu davasının açılmasının ertelenmesine ilişkin kararlar, bunlara mahsus bir sisteme kaydedilir. Bu kayıtlar, ancak bir soruşturma veya kovuşturmayla bağlantılı olarak Cumhuriyet savcısı, hâkim veya mahkeme tarafından istenmesi halinde, bu maddede belirtilen amaç için kullanılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu madde hükümleri;</template>
            <mvz-bent no="a">
              <template>Suç işlemek için örgüt kurmak, yönetmek veya örgüte üye olmak suçları ile örgüt faaliyeti çerçevesinde işlenen suçlar,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kamu görevlisi tarafından görevi sebebiyle veya kamu görevlisine karşı görevinden dolayı işlenen suçlar ile asker kişiler tarafından işlenen askerî suçlar,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Cinsel dokunulmazlığa karşı işlenen suçlar,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>hakkında uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Kovuşturmaya Yer Olmadığına Dair Karar, İtiraz ve İddianamenin İadesi">
        <mvz-madde no="172" başlık="Kovuşturmaya yer olmadığına dair karar">
          <mvz-fıkra no="1">
            <template>Cumhuriyet savcısı, soruşturma evresi sonunda, kamu davasının açılması için yeterli şüphe oluşturacak delil elde edilememesi veya kovuşturma olanağının bulunmaması hâllerinde kovuşturmaya yer olmadığına karar verir. Bu karar, suçtan zarar gören ile önceden ifadesi alınmış veya sorguya çekilmiş şüpheliye bildirilir. Kararda itiraz hakkı, süresi ve mercii gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kovuşturmaya yer olmadığına dair karar verildikten sonra kamu davasının açılması için yeterli şüphe oluşturacak yeni delil elde edilmedikçe ve bu hususta sulh ceza hâkimliğince bir karar verilmedikçe, aynı fiilden dolayı kamu davası açılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kovuşturmaya yer olmadığına dair kararın etkin soruşturma yapılmadan verildiğinin Avrupa İnsan Hakları Mahkemesinin kesinleşmiş kararıyla tespit edilmesi veya bu karar aleyhine Avrupa İnsan Hakları Mahkemesine yapılan başvuru hakkında dostane çözüm ya da tek taraflı deklarasyon sonucunda düşme kararı verilmesi üzerine, kararın kesinleşmesinden itibaren üç ay içinde talep edilmesi hâlinde yeniden soruşturma açılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="173" başlık="Cumhuriyet savcısının kararına itiraz">
          <mvz-fıkra no="1">
            <template>Suçtan zarar gören, kovuşturmaya yer olmadığına dair kararın kendisine tebliğ edildiği tarihten itibaren iki hafta içinde, bu kararı veren Cumhuriyet savcısının yargı çevresinde görev yaptığı ağır ceza mahkemesinin bulunduğu yerdeki sulh ceza hâkimliğine itiraz edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İtiraz dilekçesinde, kamu davasının açılmasını gerektirebilecek olaylar ve deliller belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sulh ceza hâkimliği, kararını vermek için soruşturmanın genişletilmesine gerek görür ise bu hususu açıkça belirtmek suretiyle, o yer Cumhuriyet başsavcılığından talepte bulunabilir; kamu davasının açılması için yeterli nedenler bulunmazsa, istemi gerekçeli olarak reddeder; itiraz edeni giderlere mahkûm eder ve dosyayı Cumhuriyet savcısına gönderir. Cumhuriyet savcısı, kararı itiraz edene ve şüpheliye bildirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Sulh ceza hâkimliği istemi yerinde bulursa, Cumhuriyet savcısı iddianame düzenleyerek mahkemeye verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Cumhuriyet savcısının kamu davasının açılmaması hususunda takdir yetkisini kullandığı hâllerde bu madde hükmü uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İtirazın reddedilmesi halinde aynı fiilden dolayı kamu davası açılabilmesi için 172 nci maddenin ikinci fıkrası uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="174" başlık="İddianamenin iadesi">
          <mvz-fıkra no="1">
            <template>Mahkeme tarafından, iddianamenin ve soruşturma evrakının verildiği tarihten itibaren onbeş gün içinde soruşturma evresine ilişkin bütün belgeler incelendikten sonra, eksik veya hatalı noktalar belirtilmek suretiyle;</template>
            <mvz-bent no="a">
              <template>170 inci maddeye aykırı olarak düzenlenen,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Suçun sübûtuna doğrudan etki edecek mevcut bir delil toplanmadan düzenlenen,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Önödemeye veya uzlaştırmaya ya da seri muhakeme usulüne tâbi olduğu soruşturma dosyasından açıkça anlaşılan işlerde önödeme veya uzlaştırma ya da seri muhakeme usulü uygulanmaksızın düzenlenen,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Soruşturma veya kovuşturma yapılması izne veya talebe bağlı olan suçlarda izin alınmaksızın veya talep olmaksızın düzenlenen,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İddianamenin Cumhuriyet Başsavcılığına iadesine karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun hukukî nitelendirilmesi sebebiyle iddianame iade edilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>En geç birinci fıkrada belirtilen süre sonunda iade edilmeyen iddianame kabul edilmiş sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cumhuriyet savcısı, iddianamenin iadesi üzerine, kararda gösterilen eksiklikleri tamamladıktan ve hatalı noktaları düzelttikten sonra, kovuşturmaya yer olmadığı kararı verilmesini gerektiren bir durumun bulunmaması halinde, yeniden iddianame düzenleyerek dosyayı mahkemeye gönderir. İlk kararda belirtilmeyen sebeplere dayanılarak yeniden iddianamenin iadesi yoluna gidilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İade kararına karşı Cumhuriyet savcısı itiraz edebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="3-ÜÇÜNCÜ" başlık="Kovuşturma Evresi">
    <mvz-kısım no="1-BİRİNCİ" başlık="Kamu Davasının Yürütülmesi">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Duruşma Hazırlığı">
        <mvz-madde no="175" başlık="İddianamenin kabulü ve duruşma hazırlığı">
          <mvz-fıkra no="1">
            <template>İddianamenin kabulüyle, kamu davası açılmış olur ve kovuşturma evresi başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme, iddianamenin kabulünden sonra duruşma gününü belirler ve duruşmada hazır bulunması gereken kişileri çağırır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="176" başlık="İddianamenin sanığa tebliği ve sanığın çağrılması">
          <mvz-fıkra no="1">
            <template>İddianame, çağrı kâğıdı ile birlikte sanığa tebliğ olunur.  Ayrıca, iddianameye ilişkin bilgiler ve duruşma tarihi; telefon, telgraf, faks, elektronik posta gibi iletişim bilgilerinin dosyada bulunması hâlinde bu araçlardan yararlanılmak suretiyle de bildirilir, ancak çağrı kâğıdına bağlanan sonuçlar bu durumda uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tutuklu olmayan sanığa tebliğ olunacak çağrı kâğıdına mazereti olmaksızın gelmediğinde zorla getirileceği yazılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tutuklu sanığın çağrılması duruşma gününün tebliği suretiyle yapılır. Sanıktan duruşmada kendisini savunmak için bir istemde bulunup bulunmayacağı ve bulunacaksa neden ibaret olduğunu bildirmesi istenir; müdafii de sanıkla birlikte davet olunur. Bu işlem, tutuklunun bulunduğu ceza infaz kurumunda cezaevi kâtibi veya bu işle görevlendirilen personel yanına getirilerek tutanak tutulmak suretiyle yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yukarıdaki fıkralar gereğince, çağrı kâğıdının tebliğiyle duruşma günü arasında en az bir hafta süre bulunması gerekir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="177" başlık="Sanığın savunma delillerinin toplanması istemi">
          <mvz-fıkra no="1">
