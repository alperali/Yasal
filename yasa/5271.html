        </mvz-madde>
        <mvz-madde no="291" başlık="Temyiz istemi ve süresi">
          <mvz-fıkra no="1">
            <template>Temyiz istemi, hükmün gerekçesiyle birlikte tebliğ edildiği tarihten itibaren iki hafta içinde hükmü veren mahkemeye bir dilekçe verilmesi veya zabıt kâtibine bir beyanda bulunulması suretiyle yapılır; beyan tutanağa geçirilir ve tutanak hâkime onaylattırılır. Tutuklu bulunan sanık hakkında 263 üncü madde hükmü saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="292" başlık="Eski hâle getirme süresi içinde temyiz süresinin işlemesi">
          <mvz-fıkra no="1">
            <template>Sanığın aleyhine, yokluğunda verilen hükümlerde eski hâle getirme istemiyle ilgili olarak 274 üncü madde hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="293" başlık="Temyiz başvurusunun etkisi">
          <mvz-fıkra no="1">
            <template>Süresi içinde yapılan temyiz başvurusu, hükmün kesinleşmesini engeller.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="294" başlık="Temyiz başvurusunun içeriği">
          <mvz-fıkra no="1">
            <template>Temyiz eden, hükmün neden dolayı bozulmasını istediğini temyiz başvurusunda göstermek zorundadır.  Cumhuriyet savcısı temyiz dilekçesinde, temyiz isteğinin sanığın yararına veya aleyhine olduğunu açıkça belirtir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Temyiz sebebi, ancak hükmün hukukî yönüne ilişkin olabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="295" başlık="Temyiz gerekçesi" durum="mülga">
        </mvz-madde>
        <mvz-madde no="296" başlık="Temyiz isteminin kabule değer sayılmamasından dolayı hükmü veren mahkemece reddi">
          <mvz-fıkra no="1">
            <template>Temyiz istemi, kanunî sürenin geçmesinden sonra yapılmış veya temyiz edilemeyecek bir hüküm temyiz edilmiş veya temyiz edenin buna hakkı yoksa, hükmü temyiz olunan bölge adliye veya ilk derece mahkemesi bir karar ile temyiz istemini reddeder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Temyiz eden, ret kararının kendisine tebliğinden itibaren iki hafta içinde Yargıtaydan bu hususta bir karar vermesini isteyebilir. Bu takdirde dosya Yargıtaya gönderilir. Ancak, bu nedenden dolayı hükmün infazı ertelenemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="297" başlık="Temyiz dilekçesinin tebliği ve cevabı, Yargıtay Cumhuriyet Başsavcılığının görevi">
          <mvz-fıkra no="1">
            <template>296 ncı maddeye göre hükmü veren bölge adliye mahkemesince reddedilmeyen temyiz istemine ilişkin dilekçesinin bir örneği karşı tarafa tebliğ olunur. Karşı taraf, tebliğ tarihinden itibaren iki hafta içinde yazılı olarak cevabını verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cevap verildikten veya bunun için belirli süre bittikten sonra dava dosyası, bölge adliye mahkemesi tarafından Yargıtay Cumhuriyet Başsavcılığına gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yargıtay Cumhuriyet Başsavcılığınca düzenlenen tebliğname, hükmü temyiz etmeleri veya aleyhlerine sonuç doğurabilecek görüş içermesi hâlinde sanık veya müdafii ile katılan veya vekillerine ilgili dairesince tebliğ olunur. İlgili taraf tebliğden itibaren iki hafta içinde yazılı olarak cevap verebilir.126</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Üçüncü fıkra uyarınca yapılacak tebligatlar, ilgililerin dava dosyasından belirlenen son adreslerine yapılmasıyla geçerli olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>262 ve 263 üncü madde hükümleri saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="298" başlık="Temyiz isteminin reddi">
          <mvz-fıkra no="1">
            <template>Yargıtay, süresi içinde temyiz başvurusunda bulunulmadığını, hükmün temyiz edilemez olduğunu, temyiz edenin buna hakkı olmadığını ya da temyiz dilekçesinin temyiz sebeplerini içermediğini saptarsa, temyiz istemini reddeder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="299" başlık="Duruşmalı inceleme">
          <mvz-fıkra no="1">
            <template>On yıl veya daha fazla hapis cezasına ilişkin hükümlerde, Yargıtay, incelemelerini uygun görmesi halinde duruşma yoluyla yapabilir. Duruşma gününden sanığa, katılana, müdafi ve vekile haber verilir. Sanık, duruşmada hazır bulunabileceği gibi, kendisini bir müdafi ile de temsil ettirebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sanık, tutuklu ise duruşmaya katılmak isteminde bulunamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="300" başlık="Duruşmada usul">
          <mvz-fıkra no="1">
            <template>Duruşmadan önce görevlendirilen üye veya tetkik hâkimi tarafından hazırlanan rapor üyelere açıklanır. Üyeler, ayrıca bizzat dosyayı incelerler. Bu hususlar gerçekleştikten sonra duruşma açılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Duruşmada Yargıtay Cumhuriyet Başsavcısı veya yerine görevlendirdiği Yargıtay Cumhuriyet savcısı, sanık, müdafii, katılan ve vekili iddia ve savunmalarını açıklar. Temyizi istemiş olan tarafa önce söz verilir. Her hâlde son söz sanığındır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="301" başlık="Temyizde incelenecek hususlar">
          <mvz-fıkra no="1">
            <template>Yargıtay, yalnız temyiz başvurusunda belirtilen hususlar ile temyiz istemi usule ilişkin noksanlardan kaynaklanmışsa, temyiz başvurusunda bunu belirten olaylar hakkında incelemeler yapar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="302" başlık="Temyiz isteminin esastan reddi veya hükmün bozulması">
          <mvz-fıkra no="1">
            <template>Bölge adliye mahkemesinin temyiz olunan hükmünün Yargıtayca hukuka uygun bulunması hâlinde temyiz isteminin esastan reddine karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yargıtay, temyiz edilen hükmü, temyiz başvurusunda gösterilen, hükmü etkileyecek nitelikteki hukuka aykırılıklar nedeniyle bozar. Bozma sebepleri ilâmda ayrı ayrı gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hüküm, temyiz dilekçesinde gösterilen sebeplerle bozulduğunda, dilekçede açıklanmış olmasa bile saptanan bütün diğer hukuka aykırılık hâlleri de ilâmda gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hükmün bozulmasına neden olan hukuka aykırılık, bu hükme esas olarak saptanan işlemlerden kaynaklanmış ise, bunlar da aynı zamanda bozulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>289 uncu madde hükümleri saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="303" başlık="Yargıtayca davanın esasına hükmedilecek hâller, hukuka aykırılığın düzeltilmesi">
          <mvz-fıkra no="1">
            <template>Hükme esas olarak saptanan olaylara uygulanmasında hukuka aykırılıktan dolayı hüküm bozulmuş ise, aşağıdaki hâllerde Yargıtay davanın esasına hükmedebileceği gibi hükümdeki hukuka aykırılığı da düzeltebilir:</template>
            <mvz-bent no="a">
              <template>Olayın daha ziyade aydınlanması gerekmeden beraate veya davanın düşmesine ya da alt ve üst sınırı olmayan sabit bir cezaya hükmolunması gerekirse.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yargıtay Cumhuriyet Başsavcılığının iddiasına uygun olarak sanığa kanunda yazılı cezanın en alt derecesini uygulamayı uygun görürse.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Mahkemece sabit görülen suçun unsurları, niteliği ve cezası hükümde doğru gösterilmiş olduğu hâlde sadece kanunun madde numarası yanlış yazılmış ise.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Hükümden sonra yürürlüğe giren kanun, suçun cezasını azaltmış ve mahkemece sanığa verilecek cezanın belirlenmesinde artırma sebebi kabul edilmemiş veya yeni bir kanun ile fiil suç olmaktan çıkarılmış ise birinci hâlde daha az bir cezanın hükmolunması ve ikinci hâlde hiç ceza hükmolunmaması gerekirse.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Sanığın açıkça saptanmış olan doğum ve suç tarihlerine göre verilecek cezanın belirlenmesinde gerekli indirim yapılmamış veya yanlış indirim yapılmış ise.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Artırma veya indirim sonucunda verilecek ceza süresi veya miktarının belirlenmesinde maddî hata yapılmış ise.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Türk Ceza Kanununun 61 inci maddesindeki sıralamanın gözetilmemesi yüzünden eksik veya fazla ceza verilmiş ise.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Harçlar Kanunu ile yargılama giderlerine ilişkin hükümlere ve Avukatlık Kanununa göre düzenlenen ücret tarifesine aykırılık mevcutsa.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="304" başlık="Yargıtay kararının gönderileceği merci">
          <mvz-fıkra no="1">
            <template>Yargıtayca 302 nci maddenin birinci fıkrası veya 303 üncü madde uyarınca verilen kararlara ilişkin dosya ilk derece mahkemesine, kararın bir örneği ise bölge adliye mahkemesine gönderilmek üzere Yargıtay Cumhuriyet Başsavcılığına verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yargıtay, dosyayı 303 üncü maddede belirtilenlerin dışında kalan hâllerde yeniden incelenmek ve hüküm verilmek üzere hükmü bozulan bölge adliye mahkemesine veya diğer bir bölge adliye mahkemesine gönderir.  Ancak bozma kararı,</template>
            <mvz-bent no="a">
              <template>İstinaf başvurusunun esastan reddi kararına ilişkin ise dosya, gereği için kararı veren ilk derece mahkemesine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hukuka aykırılığın düzeltilerek istinaf başvurusunun esastan reddi kararına ilişkin ise dosya, gereği için kararı veren ilk derece mahkemesine ya da bozma kararının içeriği doğrultusunda Yargıtayca uygun görülmesi halinde bölge adliye mahkemesine,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>gönderilir. Dosyanın ilk derece mahkemesine gönderildiği hallerde, kararın bir örneği de bölge adliye mahkemesine gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hüküm, mahkemenin hukuka aykırı olarak kendisini görevli veya yetkili görmesinden dolayı bozulmuşsa, Yargıtay aynı zamanda dosyayı görevli veya yetkili mahkemeye gönderir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İlk derece mahkemesi tarafından doğrudan temyiz yolu açık bulunan hükümlerle ilgili olarak verilen karara ilişkin dosya, hükmü veren ilk derece mahkemesine gönderilmek üzere Yargıtay Cumhuriyet Başsavcılığına verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="305" başlık="Yargıtayda hükmün açıklanması">
          <mvz-fıkra no="1">
            <template>Hüküm, 231 inci madde gereğince açıklanır. Buna olanak bulunmadığı takdirde duruşmanın bitiminden itibaren yedi gün içinde karar verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="306" başlık="Hükmün bozulmasının diğer sanıklara etkisi">
          <mvz-fıkra no="1">
            <template>Hüküm, sanık lehine bozulmuşsa ve bu hususların temyiz isteminde bulunmamış olan diğer sanıklara da uygulanması olanağı varsa, bu sanıklar da temyiz isteminde bulunmuşçasına hükmün bozulmasından yararlanırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="307" başlık="Davaya yeniden bakacak mahkemenin işlemleri">
          <mvz-fıkra no="1">
            <template>Yargıtaydan verilen bozma kararı üzerine davaya yeniden bakacak bölge adliye veya ilk derece mahkemesi, ilgililere bozmaya karşı diyeceklerini sorar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sanık, müdafii, katılan ve vekilinin dosyada varolan adreslerine de davetiye tebliğ olunamaması veya davetiye tebliğ olunmasına rağmen duruşmaya gelmemeleri nedeniyle bozmaya karşı beyanları saptanmamış olsa da duruşmaya devam edilerek dava yokluklarında bitirilebilir. Ancak, sanık hakkında verilecek ceza, bozmaya konu olan cezadan daha ağır ise, her hâlde dinlenmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yargıtaydan verilen bozma kararına uyulması hâlinde ilk derece mahkemesi tarafından verilen karara karşı, istinaf veya temyiz sınırlarına bakılmaksızın sadece temyiz yoluna başvurulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yargıtaydan verilen bozma kararına bölge adliye veya ilk derece mahkemesinin direnme hakkı vardır.  Direnme kararları, kararına direnilen daireye gönderilir.  Daire, mümkün olan en kısa sürede direnme kararını inceler ve yerinde görürse kararını düzeltir; görmezse dosyayı Yargıtay Ceza Genel Kuruluna gönderir. Direnme üzerine Yargıtay Ceza Genel Kurulunca verilen kararlara karşı direnilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Hüküm yalnız sanık tarafından veya onun lehine Cumhuriyet savcısı veya 262 nci maddede gösterilen kimselerce temyiz edilmişse, yeniden verilen hüküm, önceki hükümle belirlenmiş olan cezadan daha ağır olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Olağanüstü Kanun Yolları">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Cumhuriyet Başsavcısının İtiraz Yetkisi">
        <mvz-madde no="308" başlık="Yargıtay Cumhuriyet Başsavcısının itiraz yetkisi">
          <mvz-fıkra no="1">
            <template>Yargıtay ceza dairelerinin yargı yeri belirlenmesi ve görevsizlik kararları hariç olmak üzere tüm kararlarına karşı Yargıtay Cumhuriyet Başsavcısı, re’sen veya istem üzerine, dosyanın kendisine teslim edildiği tarihten itibaren üç ay içinde Ceza Genel Kuruluna itiraz edebilir. Sanığın lehine itirazda süre aranmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İtiraz üzerine dosya, kararına itiraz edilen daireye gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Daire, mümkün olan en kısa sürede itirazı inceler ve yerinde görürse kararını düzeltir; görmezse dosyayı Yargıtay Ceza Genel Kuruluna gönderir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İstem, sanık veya sanık adına kanun yoluna başvurma hakkı olanlar ile katılan, katılma isteği karara bağlanmamış ya da katılan sıfatını alabilecek surette suçtan zarar görmüş bulunanlar tarafından yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="308/A" başlık="Bölge adliye mahkemesi Cumhuriyet başsavcılığının itiraz yetkisi">
          <mvz-fıkra no="1">
            <template>Bölge adliye mahkemesi ceza dairelerinin kesin nitelikteki kararlarına karşı bölge adliye mahkemesi Cumhuriyet başsavcılığı, re’sen veya istem üzerine, kararın kendisine verildiği tarihten itibaren bir ay içinde kararı veren daireye itiraz edebilir. Sanığın lehine itirazda süre aranmaz.  Sanık aleyhine itiraz edilebilmesi için kararı etkileyecek nitelikte esaslı bir hatanın bulunması zorunlu olup, bu itiraz sanık veya müdafiine daire tarafından tebliğ olunur. Tebligat, ilgililerin dava dosyasından belirlenen son adreslerine yapılmasıyla geçerli olur. İlgililer, tebliğden itibaren iki hafta içinde yazılı olarak cevap verebilir.  Daire, mümkün olan en kısa sürede itirazı inceler ve yerinde görürse kararını düzeltir; görmezse dosyayı itirazı incelemek üzere ceza daireleri başkanlar kuruluna gönderir. Kurula gönderilen itiraz hakkında, kararına itiraz edilen dairenin başkanı veya görevlendireceği üye tarafından kurula sunulmak üzere bir rapor hazırlanır.  Kurulun itirazın kabulüne ilişkin kararları, gereği için dairesine gönderilir. Kurulun verdiği kararlar kesindir. Dörtten fazla ceza dairesi olan bölge adliye mahkemelerinde Hâkimler ve Savcılar Kurulu tarafından daire başkanları arasından belirlenen ve dört üyeden oluşan başkanlar kurulu bu incelemeyi yapar. Başkanlar kurulunun bu maddeye ilişkin çalışma usul ve esasları, Hâkimler ve Savcılar Kurulu tarafından belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Kanun Yararına Bozma">
        <mvz-madde no="309" başlık="Kanun yararına bozma">
          <mvz-fıkra no="1">
            <template>Hâkim veya mahkeme tarafından verilen ve istinaf veya temyiz incelemesinden geçmeksizin kesinleşen karar veya hükümde hukuka aykırılık bulunduğunu öğrenen Adalet Bakanlığı, o karar veya hükmün Yargıtayca bozulması istemini, yasal nedenlerini belirterek Yargıtay Cumhuriyet Başsavcılığına yazılı olarak bildirir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yargıtay Cumhuriyet Başsavcısı, bu nedenleri aynen yazarak karar veya hükmün bozulması istemini içeren yazısını Yargıtayın ilgili ceza dairesine verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yargıtayın ceza dairesi ileri sürülen nedenleri yerinde görürse, karar veya hükmü kanun yararına bozar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bozma nedenleri:</template>
            <mvz-bent no="a">
              <template>223 üncü maddede tanımlanan ve davanın esasını çözmeyen bir karara ilişkin ise, kararı veren hâkim veya mahkeme, gerekli inceleme ve araştırma sonucunda yeniden karar verir.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Mahkûmiyete ilişkin hükmün, davanın esasını çözmeyen yönüne veya savunma hakkını kaldırma veya kısıtlama sonucunu doğuran usul işlemlerine ilişkin ise, kararı veren hâkim veya mahkemece yeniden yapılacak yargılama sonucuna göre gereken hüküm verilir. Bu hüküm, önceki hükümle belirlenmiş olan cezadan daha ağır olamaz.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Davanın esasını çözüp de mahkûmiyet dışındaki hükümlere ilişkin ise, aleyhte sonuç doğurmaz ve yeniden yargılamayı gerektirmez.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Hükümlünün cezasının kaldırılmasını gerektiriyorsa cezanın kaldırılmasına, daha hafif bir cezanın verilmesini gerektiriyorsa bu hafif cezaya Yargıtay ceza dairesi doğrudan hükmeder.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu madde uyarınca verilen bozma kararına karşı direnilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="310" başlık="Yargıtay Cumhuriyet Başsavcısının kanun yararına başvurması">
          <mvz-fıkra no="1">
            <template>309 uncu maddede belirtilen yetki, aynı maddenin dördüncü fıkrasının (d) bendindeki hâllere özgü olmak üzere ve kanun yararına olarak re'sen Yargıtay Cumhuriyet Başsavcısı tarafından da kullanılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>309 uncu madde gereğince Adalet Bakanlığı tarafından başvurulduğunda bu yetki, artık Yargıtay Cumhuriyet Başsavcısı tarafından kullanılamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Yargılamanın Yenilenmesi">
        <mvz-madde no="311" başlık="Hükümlü lehine yargılamanın yenilenmesi nedenleri">
          <mvz-fıkra no="1">
            <template>Kesinleşen bir hükümle sonuçlanmış bir dava, aşağıda yazılı hâllerde hükümlü lehine olarak yargılamanın yenilenmesi yoluyla tekrar görülür:</template>
            <mvz-bent no="a">
              <template>Duruşmada kullanılan ve hükmü etkileyen bir belgenin sahteliği anlaşılırsa.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yemin verilerek dinlenmiş olan bir tanık veya bilirkişinin hükmü etkileyecek biçimde hükümlü aleyhine kasıt veya ihmal ile gerçek dışı tanıklıkta bulunduğu veya oy verdiği anlaşılırsa.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Hükme katılmış olan hâkimlerden biri, hükümlünün neden olduğu kusur dışında, aleyhine ceza kovuşturmasını veya bir ceza ile mahkûmiyetini gerektirecek biçimde görevlerini yapmada kusur etmiş ise.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Ceza hükmü hukuk mahkemesinin bir hükmüne dayandırılmış olup da bu hüküm kesinleşmiş diğer bir hüküm ile ortadan kaldırılmış ise.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Yeni olaylar veya yeni deliller ortaya konulup da bunlar yalnız başına veya önceden sunulan delillerle birlikte göz önüne alındıklarında sanığın beraatini veya daha hafif bir cezayı içeren kanun hükmünün uygulanması ile mahkûm edilmesini gerektirecek nitelikte olursa.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Ceza hükmünün, İnsan Haklarını ve Ana Hürriyetleri Korumaya Dair Sözleşmenin veya eki protokollerin ihlâli suretiyle verildiğinin ve hükmün bu aykırılığa dayandığının, Avrupa İnsan Hakları Mahkemesinin kesinleşmiş kararıyla tespit edilmiş olması veya ceza hükmü aleyhine Avrupa İnsan Hakları Mahkemesine yapılan başvuru hakkında dostane çözüm ya da tek taraflı deklarasyon sonucunda düşme kararı verilmesi. Bu hâlde yargılamanın yenilenmesi, Avrupa İnsan Hakları Mahkemesi kararının kesinleştiği tarihten itibaren bir yıl içinde istenebilir.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkranın (f) bendi hükümleri, 4.2.2003 tarihinde Avrupa İnsan Hakları Mahkemesinin kesinleşmiş kararları ile, 4.2.2003 tarihinden sonra Avrupa İnsan Hakları Mahkemesine yapılan başvurular üzerine verilecek kararlar hakkında uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="312" başlık="İnfazın geri bırakılması veya durdurulması">
          <mvz-fıkra no="1">
            <template>Yargılamanın yenilenmesi istemi hükmün infazını ertelemez. Ancak mahkeme, infazın geri bırakılmasına veya durdurulmasına karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="313" başlık="Yargılamanın yenilenmesine engel olmayan hâller">
          <mvz-fıkra no="1">
            <template>Hükmün infaz edilmiş olması veya hükümlünün ölümü, yargılamanın yenilenmesi istemine engel olmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ölenin eşi, üstsoyu, altsoyu, kardeşleri yargılamanın yenilenmesi isteminde bulunabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İkinci fıkrada sayılan kişilerin yokluğu hâlinde, Adalet Bakanı da yargılamanın yenilenmesi isteminde bulunabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="314" başlık="Sanık veya hükümlünün aleyhine yargılamanın yenilenmesi nedenleri">
          <mvz-fıkra no="1">
            <template>Kesinleşen bir hükümle sonuçlanmış olan bir dava aşağıda yazılı hâllerde sanık veya hükümlünün aleyhine olarak yargılamanın yenilenmesi yolu ile tekrar görülür:</template>
            <mvz-bent no="a">
              <template>Duruşmada sanığın veya hükümlünün lehine ileri sürülen ve hükme etkili olan bir belgenin sahteliği anlaşılırsa.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hükme katılmış olan hâkimlerden biri, aleyhine ceza kovuşturmasını veya bir ceza ile mahkûmiyetini gerektirecek nitelikte olarak görevlerini yapmada sanık veya hükümlü lehine kusur etmiş ise.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Sanık beraat ettikten sonra suçla ilgili olarak hâkim önünde güvenilebilir nitelikte ikrarda bulunmuşsa.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="315" başlık="Yargılamanın yenilenmesinin kabul edilmeyeceği hâl">
          <mvz-fıkra no="1">
            <template>Kanunun aynı maddesinde yer almış sınır içinde olmak üzere cezanın değiştirilmesi amacıyla yargılamanın yenilenmesi kabul edilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hatanın giderilebilmesini sağlayacak başka bir yol varsa, yargılamanın yenilenmesi yoluna gidilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="316" başlık="Bir suça dayanan yenileme istemlerinin kabulü koşulları">
          <mvz-fıkra no="1">
            <template>Bir suç iddiasına dayandırılan yenileme istemi, ancak bu fiilden dolayı kesinleşmiş bir mahkûmiyet hükmü verilmiş veya mahkûmiyeti gerektirecek nitelikte kuvvetli delil bulunmaması dışında bir nedenle ceza soruşturmasına başlanamamış veya sürdürülememişse kabul edilebilir. Bu madde, 311 inci maddenin birinci fıkrasının (e) bendinde yazılı hâlde uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="317" başlık="Yenileme istemi hakkında uygulanacak hükümler">
          <mvz-fıkra no="1">
            <template>Kanun yollarına başvurma hakkındaki genel hükümler, yargılamanın yenilenmesi istemi hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yargılamanın yenilenmesi istemi, bunun yasal nedenleri ile dayandığı delilleri içerir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="318" başlık="Yenileme isteminin kabule değer olup olmadığı kararı ve mercii">
          <mvz-fıkra no="1">
            <template>Yargılamanın yenilenmesi istemi, hükmü veren mahkemeye sunulur. Bu mahkeme, istemin kabule değer olup olmadığına karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>303 üncü madde gereğince Yargıtayın doğrudan hüküm kurduğu hâllerde de hükmü vermiş olan mahkemeye başvurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yargılamanın yenilenmesi isteminin kabule değer olup olmadığına dair olan karar, duruşma yapılmaksızın verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="319" başlık="Yenileme isteminin kabule değer görülmemesi nedenleri ve kabulü hâlinde yapılacak işlem">
          <mvz-fıkra no="1">
            <template>Yargılamanın yenilenmesi istemi, kanunda belirlenen şekilde yapılmamış veya yargılamanın yenilenmesini gerektirecek yasal hiçbir neden gösterilmemiş veya bunu doğrulayacak deliller açıklanmamış ise, bu istem kabule değer görülmeyerek reddedilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aksi hâlde yargılamanın yenilenmesi istemi, bir diyeceği varsa iki hafta içinde bildirmek üzere Cumhuriyet savcısı ve ilgili tarafa tebliğ olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu madde gereğince verilen kararlara itiraz edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="320" başlık="Delillerin toplanması">
          <mvz-fıkra no="1">
            <template>Mahkeme, yargılamanın yenilenmesi istemini yerinde bulursa delillerin toplanması için bir naip hâkimi veya istinabe olunan mahkemeyi görevlendirebileceği gibi; kendisi de bu hususları yerine getirebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Delillerin mahkemece veya naip hâkim tarafından veya istinabe suretiyle toplanması sırasında, soruşturmaya ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Delillerin toplanması bittikten sonra Cumhuriyet savcısı ve hakkında hüküm kurulmuş olan kişiden iki haftalık süre içinde görüş ve düşüncelerini bildirmeleri istenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="321" başlık="Yenileme isteminin esassız olmasından dolayı reddi, aksi takdirde kabulü">
          <mvz-fıkra no="1">
            <template>Yargılamanın yenilenmesi isteminde ileri sürülen iddialar, yeterli derecede doğrulanmaz veya 311 inci maddenin birinci fıkrasının (a) ve (b) bentleri ile 314 üncü maddesinin birinci fıkrasının (a) bendinde yazılı hâllerde işin durumuna göre bunların önce verilmiş olan hükme hiçbir etkisi olmadığı anlaşılırsa, yargılamanın yenilenmesi istemi esassız olması nedeniyle duruşma yapılmaksızın reddedilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aksi hâlde mahkeme, yargılamanın yenilenmesine ve duruşmanın açılmasına karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu madde gereğince verilen kararlara karşı itiraz yoluna gidilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="322" başlık="Duruşma yapılmaksızın yenileme isteminin incelenmesi">
          <mvz-fıkra no="1">
            <template>Hükümlü ölmüşse mahkeme yeniden duruşma yapmaksızın gerekli delilleri topladıktan sonra hükümlünün beraatine veya yargılamanın yenilenmesi isteminin reddine karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Diğer hâllerde de mahkeme, bu hususta yeterli delil varsa Cumhuriyet savcısının uygun görüşünü aldıktan sonra duruşma yapmaksızın hükümlünün derhâl beraatine karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkeme beraat kararı ile beraber önceki hükmün ortadan kaldırılmasını da karar altına alır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yargılamanın yenilenmesi isteminde bulunan kimse isterse, gideri Devlet Hazinesine ait olmak üzere önceki hükmün iptaline ilişkin karar Resmî Gazete ile ilân olunacağı gibi mahkemenin takdirine göre diğer gazetelerle de ilân edilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="323" başlık="Yeniden duruşma sonucunda verilecek hüküm">
          <mvz-fıkra no="1">
            <template>Yeniden yapılacak duruşma sonucunda mahkeme, önceki hükmü onaylar veya hükmün iptali ile dava hakkında yeniden hüküm verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yargılamanın yenilenmesi istemi hükümlünün lehine olarak yapılmışsa, yeniden verilecek hüküm önceki hükümle belirlenmiş olan cezadan daha ağır bir cezayı içeremez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yargılamanın yenilenmesi sonucunda beraat veya ceza verilmesine yer olmadığı kararının verilmesi halinde, önceki mahkûmiyet kararının tamamen veya kısmen infaz edilmesi dolayısıyla kişinin uğradığı maddî ve manevî zararlar bu Kanunun 141 ilâ 144 üncü maddeleri hükümlerine göre tazmin edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="7-YEDİNCİ" başlık="Yargılama Giderleri ve Çeşitli Hükümler">
    <mvz-kısım no="1-BİRİNCİ" başlık="Yargılama Giderleri">
      <mvz-madde no="324" başlık="Yargılama giderleri">
        <mvz-fıkra no="1">
          <template>Harçlar ve tarifesine göre ödenmesi gereken avukatlık ücretleri ile soruşturma ve kovuşturma evrelerinde yargılamanın yürütülmesi amacıyla Devlet Hazinesinden yapılan her türlü harcamalar ve taraflarca yapılan ödemeler yargılama giderleridir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hüküm ve kararda yargılama giderlerinin kimlere yükletileceği gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Giderlerin miktarı ile iki taraftan birinin diğerine ödemesi gereken paranın miktarını mahkeme başkanı veya hâkim belirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Devlete ait yargılama giderlerine ilişkin kararlar, Harçlar Kanunu hükümlerine göre; kişisel haklara ilişkin kararlar, 9.6.1932 tarihli ve 2004 sayılı İcra ve İflâs Kanunu hükümlerine göre yerine getirilir.  Devlete ait yargılama giderlerinin 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 106 ncı maddesindeki terkin edilmesi gereken tutarlardan az olması halinde, bu giderin Devlet Hazinesine yüklenmesine karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Türkçe bilmeyen ya da engelli olan şüpheli, sanık, mağdur veya tanık için görevlendirilen tercümanın giderleri, yargılama gideri sayılmaz ve bu giderler Devlet Hazinesince karşılanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="325" başlık="Sanığın yükümlülüğü">
        <mvz-fıkra no="1">
          <template>Cezaya veya güvenlik tedbirine mahkûm edilmesi hâlinde, bütün yargılama giderleri sanığa yüklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hükmün açıklanmasının geri bırakılması ve cezanın ertelenmesi hallerinde de birinci fıkra hükmü uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yargılamanın değişik evrelerinde yapılan araştırma veya işlemler nedeniyle giderler meydana gelmiş olup da, sonuç sanık lehine ortaya çıkmış ise, bu giderlerin sanığa yüklenmesinin hakkaniyete aykırı olacağı anlaşıldığında mahkeme, bunların kısmen veya tamamen Devlet Hazinesine yüklenmesine karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Hüküm kesinleşmeden sanık ölürse, mirasçılar giderleri ödemekle yükümlü tutulmazlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="326" başlık="Bağlantılı davalarda giderler">
        <mvz-fıkra no="1">
          <template>Birden çok suçtan dolayı aleyhinde kovuşturma yapılmış olan kimse, bunların bir kısmından mahkûm olmuş ise, beraat ettiği suçların duruşmasının gerektirdiği giderleri ödemekle yükümlü değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İştirak halinde işlenmiş bir suç nedeniyle mahkûm edilmiş olanlara, sebebiyet verdikleri yargılama giderleri ayrı ayrı yükletilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="327" başlık="Beraat veya ceza verilmesine yer olmadığı kararı verilmesi hâlinde gider">
        <mvz-fıkra no="1">
          <template>Hakkında beraat veya ceza verilmesine yer olmadığına karar verilen kişi, sadece kendi kusurundan ileri gelen giderleri ödemeye mahkûm edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu kişinin önceden ödemek zorunda kaldığı giderler, Devlet Hazinesince üstlenilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="328" başlık="Karşılıklı hakaret hâllerinde gider">
        <mvz-fıkra no="1">
          <template>Karşılıklı hakaret hâllerinde taraflardan biri veya her ikisi hakkında ceza verilmesine yer olmadığı kararının verilmesi; bunlardan birinin veya her ikisinin giderleri karşılamaya mahkûm edilmelerine engel olmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="329" başlık="Suç uydurma ve iftira gibi hâllerde gider">
        <mvz-fıkra no="1">
          <template>Suç uydurup iftirada bulunduğu sabit olan kimse, bu nedenle yapılmış giderleri ödemeye mahkûm edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="330" başlık="Kanun yollarına başvuru sonucunda gider">
        <mvz-fıkra no="1">
          <template>Kanun yollarından birine başvuran taraf, bu başvurusunu geri almasından veya başvurunun reddolunmasından ileri gelen giderleri öder. Kanun yollarına başvuran Cumhuriyet savcısı ise, sanığın ödemek zorunda bulunduğu giderler Devlet Hazinesine yükletilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kanun yoluna başvuranın istemi kısmen kabul olunmuş ise, mahkeme uygun gördüğü şekilde giderleri bölüştürür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kesinleşmiş bir hüküm ile sonuçlanan bir duruşma hakkındaki yargılamanın yenilenmesi isteminden ileri gelen giderler hakkında da aynı hüküm geçerlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Eski hâle getirme isteminden doğan giderler, hasım tarafının esassız karşı koymasından meydana gelmiş değilse, bu istemi ileri sürene yükletilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Çeşitli Hükümler">
      <mvz-madde no="331" başlık="Adlî tatil">
        <mvz-fıkra no="1">
          <template>Ceza işlerini gören makam ve mahkemeler her yıl bir eylülde başlamak üzere, yirmi temmuzdan otuz bir ağustosa kadar çalışmaya ara verirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Soruşturma ile tutuklu işlere ilişkin kovuşturmaların ve ivedi sayılacak diğer hususların tatil süresi içinde ne suretle yerine getirileceği, Hâkimler ve Savcılar Yüksek Kurulunca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tatil süresince bölge adliye mahkemeleri ile Yargıtay, yalnız tutuklu hükümlere ilişkin veya Meşhud Suçların Muhakeme Usulü Kanunu gereğince görülen işlerin incelemelerini yapar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Adlî tatile rastlayan süreler işlemez. Bu süreler tatilin bittiği günden itibaren üç gün uzatılmış sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="332" başlık="Bilgi isteme">
        <mvz-fıkra no="1">
          <template>Suçların soruşturma ve kovuşturması sırasında Cumhuriyet savcısı, hâkim veya mahkeme tarafından yazılı olarak istenilen bilgilere on gün içinde cevap verilmesi zorunludur. Eğer bu süre içinde istenen bilgilerin verilmesi imkânsız ise, sebebi ve en geç hangi tarihte cevap verilebileceği aynı süre içinde bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bilgi istenen yazıda yukarıdaki fıkra hükmü ile buna aykırı hareket etmenin Türk Ceza Kanununun 257 nci maddesine aykırılık oluşturabileceği yazılır. Bu durumda haklarında kamu davasının açılması, izin veya karar alınmasına bağlı bulunan kişiler hakkında, yasama dokunulmazlığı saklı kalmak üzere, doğrudan soruşturma yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="333" başlık="Yönetmelik">
        <mvz-fıkra no="1">
          <template>Bu Kanunda öngörülen yönetmelikler, aksine hüküm bulunmadıkça, ilgili bakanlıkların görüşü alınarak Adalet Bakanlığı tarafından çıkarılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="Kolluk görevlilerine yönelik özel hükümler" tür="Ek">
        <mvz-fıkra no="1">
          <template>Kolluk görevlileri hakkındaki öldürme, kasten yaralama, işkence, zor kullanma yetkisine ilişkin sınırın aşılması ve suç işlemek amacıyla örgüt kurma suçları ile örgüt faaliyeti çerçevesinde işlenen suçlarla ilgili iddialara ilişkin soruşturmaları Cumhuriyet savcıları bizzat ve öncelikle yapar. Bu suçlardan dolayı kolluk görevlileri hakkında açılan davalar, acele işlerden sayılır. Bu tür davaların kanun yolu incelemesi de öncelikli olarak yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 202 nci maddesinin beşinci fıkrasında öngörülen yönetmelik, Adalet Bakanlığınca bu maddeyi ihdas eden Kanunun yürürlüğe girdiği tarihten itibaren bir ay içinde çıkarılır. Bu yönetmelik uyarınca tercüman listeleri oluşturuluncaya kadar bu Kanunun 202 nci maddesinin dördüncü fıkrasında düzenlenen tercüme hizmetleri sanığın kendisi tarafından getirilen tercüman tarafından yerine getirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>İnsan Haklarını ve Ana Hürriyetleri Korumaya Dair Sözleşmenin veya eki protokollerin ihlali suretiyle bir ceza hükmünün verildiğini tespit eden Avrupa İnsan Hakları Mahkemesinin kesinleşmiş kararlarından, 15.6.2012 tarihi itibarıyla Avrupa Konseyi Bakanlar Komitesi önünde denetlenmekte bulunanlar bakımından bu Kanunun 311 inci maddesinin ikinci fıkrası hükmü uygulanmaz. Bu durumda olanlar, bu maddenin yürürlüğe girdiği tarihten itibaren üç ay içinde yargılamanın yenilenmesi talebinde bulunabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddenin yürürlüğe girdiği tarihe kadar milletvekilleri hakkında açılmış olan davalarda, bu maddeyi ihdas eden Kanun Hükmünde Kararname ile bu Kanunun 161 inci maddesine eklenen dokuzuncu fıkra hükmü uyarınca yetkisizlik ve görevsizlik kararı verilemez; bu davalara kesin hükümle sonuçlandırılıncaya kadar bu mahkemelerce bakılmaya devam olunur. Bu maddenin yürürlüğe girdiği tarihe kadar milletvekilleri hakkında başlatılmış soruşturmalarda da bu maddeyi ihdas eden Kanun Hükmünde Kararname ile bu Kanunun 161 inci maddesine eklenen dokuzuncu fıkra hükmü uyarınca yetkisizlik kararı verilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddeyi ihdas eden Kanunla 304 üncü maddenin ikinci fıkrasında yapılan düzenleme, bu maddenin yürürlüğe girdiği tarihten sonra Yargıtay tarafından verilen bozma kararları hakkında uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddeyi ihdas eden Kanunla;</template>
          <mvz-bent no="a">
            <template>102 nci maddede yapılan düzenleme, bu maddenin yayımlandığı tarihten itibaren üç ay sonra uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>236 ncı maddenin dördüncü ve beşinci fıkralarında yapılan düzenleme uyarınca kurulması gereken merkezler, en geç 1/9/2020 tarihine kadar faaliyete geçirilir. Bu tarihe kadar mevcut uygulamaya devam olunur.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>250 nci maddede düzenlenen seri muhakeme usulü ile 251 ve 252 nci maddelerde düzenlenen basit yargılama usulüne ilişkin hükümler, 1/1/2020 tarihinden itibaren uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>1/1/2020 tarihi itibarıyla kovuşturma evresine geçilmiş, hükme bağlanmış veya kesinleşmiş dosyalarda seri muhakeme usulü ile basit yargılama usulü uygulanmaz.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Bu maddenin yürürlüğe girdiği tarih itibarıyla, kovuşturma evresine geçilmiş dosyalarda kamu davasının açılmasının ertelenmesi hükümleri uygulanmaz.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>286 ncı maddenin üçüncü fıkrasında yapılan düzenleme, bu maddenin yayımlandığı tarihten itibaren on beş gün içinde talep etmek koşuluyla aynı suçlarla ilgili olarak bölge adliye mahkemelerince verilmiş kesin nitelikteki kararlar hakkında da uygulanır. Bu bendin uygulandığı hâlde, cezası infaz edilmekte olan hükümlülerin, 100 üncü madde uyarınca tutukluluğunun devam edip etmeyeceği hususu, hükmü veren ilk derece mahkemesince değerlendirilir.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>308/A maddesinde yapılan değişiklikle bölge adliye mahkemesi Cumhuriyet başsavcılığınca yapılan itirazların incelenmesine ilişkin getirilen usul, bu maddenin yayımlandığı tarihten önce itiraz yoluna başvurulup reddedilmiş olan itirazlar hakkında uygulanmaz.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Aile mahkemeleri ile çocuk ve çocuk ağır ceza mahkemelerinde görev yapan psikolog, pedagog ve sosyal çalışma görevlilerine ilişkin düzenlemeler, bu maddenin yayımlandığı tarihten itibaren altı ay sonra uygulanır.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddeyi ihdas eden Kanunla bu Kanunda yapılan düzenlemeler bakımından aşağıdaki hükümler uygulanır:</template>
          <mvz-bent no="a">
            <template>Eski hâle getirme kurumuna ilişkin olarak 41 inci maddenin birinci fıkrasında yapılan değişiklik, 1/6/2024 tarihinde ve sonrasında kalkan engeller bakımından uygulanır. Bu tarihten önce kalkan engeller bakımından bu maddeyi ihdas eden Kanunla yapılan değişiklikten önceki hükümlerin uygulanmasına devam olunur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kovuşturmaya yer olmadığına dair karara itiraz süresine ilişkin olarak 173 üncü maddenin birinci fıkrasında yapılan değişiklik, 1/6/2024 tarihinde ve sonrasında verilen kararlar hakkında uygulanır. Bu tarihten önce verilen kararlar hakkında bu maddeyi ihdas eden Kanunla yapılan değişiklikten önceki hükümlerin uygulanmasına devam olunur.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kanun yollarına başvuru şekli ve süreleri ile bu sürelerin tebliğden itibaren başlamasına ve cevap sürelerine ilişkin 268, 273, 276, 277, 291, 294, 296, 297, 308, 308/A, 319 ve 320 nci maddelerde yapılan değişiklikler, 1/6/2024 tarihinde ve sonrasında verilen kararlar hakkında uygulanır. Bu tarihten önce verilen kararlar hakkında bu maddeyi ihdas eden Kanunla yapılan değişikliklerden önceki hükümler ile yürürlükten kaldırılan hükümlerin uygulanmasına devam olunur.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Temyiz süresi ile bu sürenin kararın tebliğinden itibaren işlemeye başlamasına ve cevap süresine ilişkin 291, 296 ve 297 nci maddelerde yapılan değişiklikler, 23/3/2005 tarihli ve 5320 sayılı Ceza Muhakemesi Kanununun Yürürlük ve Uygulama Şekli Hakkında Kanunun 8 inci maddesinin birinci fıkrası kapsamında olup da 1/6/2024 tarihinde ve sonrasında verilen kararlar hakkında da uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Bu maddeyi ihdas eden Kanunla yürürlükten kaldırılan; 275 inci maddenin ikinci fıkrası, 293 üncü maddenin ikinci fıkrası ve 295 inci maddesi hükümlerinin, 1/6/2024 tarihinden önce verilen kararlar bakımından uygulanmasına devam olunur.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template></template>
          <mvz-bent no="a">
            <template>Bu maddeyi ihdas eden Kanunla 231 inci maddenin onbirinci ve onikinci fıkrasında yapılan kanun yoluna ilişkin değişiklikler, 1/6/2024 tarihi ve sonrasında verilen hükmün açıklanmasının geri bırakılması kararları hakkında uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>1/6/2024 tarihinden önce verilen hükmün açıklanmasının geri bırakılması kararları hakkında itiraz kanun yolunun uygulanmasına devam olunur. Bu itirazlar, bu maddeyi ihdas eden Kanunla 231 inci maddenin onikinci fıkrasında yapılan değişiklikten önceki hükümlere göre sonuçlandırılır.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>1/6/2024 tarihinden önce verilen hükmün açıklanmasının geri bırakılması kararlarıyla ilgili olarak 231 inci maddenin onbirinci fıkrası gereğince hükmün açıklanması veya yeniden kurulması hâlinde, bu maddeyi ihdas eden Kanunla 231 inci maddenin onbirinci fıkrasında yapılan değişiklikten önceki kanun yoluna ilişkin hükümler uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>1/6/2024 tarihinden önce verilen hükmün açıklanmasının geri bırakılması kararları bakımından sanığın kabul etmesi şartı aranmaya devam olunur.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddeyi ihdas eden Kanunla 141 inci maddede yapılan düzenlemeler, 1/6/2024 tarihinden sonra kesinleşen karar veya hükümler bakımından uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddeyi ihdas eden Kanunla 142 nci maddede yapılan değişiklikler, 1/6/2024 tarihinde ve sonrasında yapılan istemler bakımından uygulanır. Bu tarihten önce yapılan istemlere, kesinleşinceye kadar bu maddeyi ihdas eden Kanunla 142 nci maddede yapılan değişiklikten önceki hükümlere göre yargı mercilerince bakılmaya devam olunur. Bu fıkrada yer alan düzenlemeler ile bu maddeyi ihdas eden Kanunla 142 nci maddede yapılan değişiklikler, mülga 7/5/1964 tarihli ve 466 sayılı Kanun Dışı Yakalanan veya Tutuklanan Kimselere Tazminat Verilmesi Hakkında Kanun uyarınca yapılan veya yapılacak olan istemler hakkında da kıyasen uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddeyi ihdas eden Kanunla 5237 sayılı Kanunun 73 üncü maddesinin ikinci fıkrasında yapılan düzenleme, bu maddenin yürürlüğe girdiği tarih itibarıyla soruşturma veya kovuşturma evresine geçilmiş dosyalar bakımından uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="iptal">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddeyi ihdas eden Kanunla, 253 üncü maddenin yirmidördüncü fıkrasında yapılan düzenleme, bu maddenin yürürlüğe girdiği tarihten önce yapılan uzlaştırmacı yazılı sınavlarında başarılı olanlar hakkında uygulanmaz. Bu kişiler, diğer koşulları taşımaları halinde uzlaştırmacı siciline ve listelerine kaydedilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddenin yürürlüğe girdiği tarih itibarıyla 254 üncü maddenin ikinci fıkrası uyarınca hükmün açıklanmasının geri bırakılmasına karar verilen dosyalar bakımından bu maddeyi ihdas eden Kanunla 254 üncü maddenin ikinci fıkrasında yapılan değişiklik uygulanmaz. Bu dosyalar, 254 üncü maddenin ikinci fıkrasının değişiklikten önceki hükümlerine göre sonuçlandırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Soruşturma veya kovuşturma evresinde olup da bu maddenin yürürlüğe girdiği tarih itibarıyla uzlaşmanın sağlanmış olduğu dosyalar bakımından bu maddeyi ihdas eden Kanunla 253 üncü maddenin üçüncü fıkrasında yapılan değişiklik ve 5237 sayılı Kanunun 75 inci maddesinin altıncı fıkrasında yapılan değişiklik uygulanmaz. Bu dosyalar, 253 üncü maddenin üçüncü fıkrasının değişiklikten önceki hükümlerine göre sonuçlandırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="334" başlık="Yürürlük">
        <mvz-fıkra no="1">
          <template>Bu Kanun, 1 Haziran 2005 tarihinde yürürlüğe girer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="335" başlık="Yürütme">
        <mvz-fıkra no="1">
          <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
        </mvz-fıkra>
      </mvz-madde>
