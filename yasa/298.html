          </mvz-bent>
          <mvz-bent no="4.">
            <template>Seçim çevresindeki sandık kurullarının toplam sayısı,</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Sandık seçmen listesinde yazılı seçmenlerin toplam sayısı,</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Oy kullanan seçmenlerin toplam sayısı,</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>İtiraz edilmeksizin geçerli sayılan oy pusulalarının toplam sayısı,</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>İtiraz üzerine geçerli sayılan veya hesaba katılan oy pusulalarının toplam sayısı,</template>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>Geçerli oy pusulalarının toplam sayısı,</template>
          </mvz-bent>
          <mvz-bent no="10.">
            <template>Geçersiz sayılan veya hesaba katılmayan oy pusulalarının toplamı,</template>
          </mvz-bent>
          <mvz-bent no="11.">
            <template>Birleşik oy pusulasındaki sıralamaya göre siyasi partilerin adları ile her birinin aldığı toplam oy sayısı,</template>
          </mvz-bent>
          <mvz-bent no="12.">
            <template>Bağımsız adayların birleşik oy pusulasındaki sıraya göre ad ve soyadları ile her birinin aldığı toplam oy sayısı,</template>
          </mvz-bent>
          <mvz-bent no="13.">
            <template>Yüksek Seçim Kurulunca gerekli görülen diğer bilgiler,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>rakam ve yazı ile yazılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>İlçe birleştirme tutanak özeti ile denetim tutanağının imzalı ve mühürlü birer sureti, ilçe seçim kurulu başkanınca, kurulun siyasi partili üyelerine imza karşılığı verilir. Ayrıca, ilan süresi içinde yazılı talepte bulunan ve o seçim çevresinde seçime katılan siyasi parti ilçe başkanlıklarına ve bağımsız adaylara da bir defaya mahsus olmak üzere imza karşılığı verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Birden çok ilçe seçim kurulu bulunan ilçelerde, her ilçe seçim kurulu, kendisine bağlı bulunan sandık kurullarından gelen sandık sonuç tutanaklarını, yukarıda belirtilen usule göre birleştirdikten sonra, düzenleyeceği denetim ve birleştirme tutanak özetinin onaylı birer suretini, bir numaralı ilçe seçim kuruluna teslim eder. Birinci ilçe seçim kurulu, aldığı bu tutanaklardaki sonuçları, kendi düzenlediği özel tutanağa, sütun başlıkları altına toplam sayıları yazmak suretiyle veya ayrı bir tutanak düzenleyerek birleştirme işlemini yapar. Birinci ilçe seçim kurulunun düzenleyeceği ilçe birleştirme tutanak özetinin ilanı ve siyasi parti ve adaylara verilmesi hususunda da yukarıdaki fıkraya göre işlem yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>Milletvekili ve büyükşehir belediye başkanlığı seçimlerinde, ilçe birleştirme tutanağının ve özetinin onaylı birer sureti, ilçe seçim kurulu başkanı ile en az iki üye tarafından, en kısa sürede il seçim kuruluna teslim edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Asıl ve geçici ilçe seçim kurulu başkanları, sayım, döküm ve birleştirme iş ve işlemlerinin yapıldığı yerlerde, sandık kurulu başkanlarının, sandık çevresinde sahip oldukları yetkileri kullanabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="14">
          <template>Bu maddede belirtilen tutanaklar ile tutanak özetlerinin düzenlenmesi ve seçim sonuçlarının üst seçim kurullarına gönderilmesine dair usul ve esaslar Yüksek Seçim Kurulunca belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="İl Seçim Kurulunda Birleştirme">
      <mvz-madde no="109" başlık="İl seçim tutanakları">
        <mvz-fıkra no="1">
          <template>İl seçim kurulları, seçimle ilgili kanunların tutanak düzenlemeyi kendilerine görev olarak verdiği hallerde, ilçe seçim kurullarından gönderilen seçim tutanaklarını birleştirerek il seçim tutanaklarını düzenler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birleştirme sonucunu gösteren tutanağın içindekiler hazır bulunanlara ilan edilir, bir sureti il seçim kurulu başkanı tarafından il seçim kurulu kapısına asılır, asılan bu tutanak sureti bir hafta süre ile asılı kalır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>82 nci, 83 üncü ve 84 üncü maddeler gereğince sandık kurulu başkanlarının sandık yerinde haiz oldukları yetkileri, il seçim kurulu başkanları da sayım, döküm ve birleştirme işlerinin yapıldığı yerde, haizdirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="İtirazlar ve Şikayetler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
      <mvz-madde no="110" başlık="Kimlerin itiraz edebileceği">
        <mvz-fıkra no="1">
          <template>Bu kanunda gösterilen kurulların veya kurul başkanlarının kesin olmayan kararlarına karşı seçme yeterliğine sahip yurttaşlar, siyasi partiler veya bunların tüzüklerine göre kuruluş kademelerinin başkanları veya vekilleri, müşahitler, adaylar ve Cumhuriyet Senatosu üyeleri ile milletvekilleri itiraz edebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="111" başlık="İtiraz mercileri">
        <mvz-fıkra no="1">
          <template>Bu kanunda, kurulların kesin olduğu yazılı bulunmıyan kararlarına karşı, her kurulun bağlı olduğu üst kurul, itiraz merciidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yüksek Seçim Kurulunun re'sen veya itiraz üzerine vereceği kararlar kesindir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="112" başlık="İtirazın şekli">
        <mvz-fıkra no="1">
          <template>İtiraz yazı ile veya sözle yapılır. Sözle yapılacak itirazlar gerekçesiyle birlikte tutanağa yazılır. İtiraz edenin adı, soyadı, açık adresi yazılarak imza ettirilir. İmza bilmeyenlere parmak bastırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kimliğini ispat edemeyenlerin, delil ve gerekçe gösteremeyenlerin itirazları incelenmez, bu sebeple incelenmediği tutanağa yazılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yazılı itirazlarda da yukarıdaki şartlar aranır ve deliller itiraz dilekçesine eklenir. Gerekçesi ve delili olmayan yazılı itirazlar da incelenmez. Her iki halde de itirazın alındığına ve hangi tarihte yapıldığına dair, itiraz yapana alındı belgesi verilir. İtirazlar seçim kurulu başkanına yapılır. Seçim kurulu başkanı bulunamazsa, yazılı itiraz nöbetçi savcıya alındı belgesi ile yapılır. Savcı yapılan itirazın kaydını işleyerek hemen seçim kurulu başkanına gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Siyasi partiler, seçim başlangıcında partileri adına kimlerin itiraz edebileceklerini mühür ve imzalı bir yazı ile seçim kurullarına bildirirler. İtiraz edebileceklerin imza sirküleri parti başkanınca onaylanarak bildirilir. Parti adına itiraz edeceklerden kimlik aranmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İtirazlarda, delillerin hangi resmi makamlarda bulunduğunun bildirilmesi delil yerine geçer ve bu delili seçim kurulu temin eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Yüksek Seçim Kuruluna yapılacak itirazların yazılı olması lazımdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="113" başlık="İtiraz üzerine verilecek karar">
        <mvz-fıkra no="1">
          <template>Bir kurulun kararını itiraz yolu ile tetkik eden üst kurul, itirazı kabul ettiği takdirde, yapılması gereken işlem hakkında da karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurullar kararlarını salt çoğunlukla verirler. Oyların eşitliği halinde, başkanın katıldığı taraf tercih olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yüksek Seçim Kurulu, seçimin sonunda verilecek tutanaklara karşı yapılan itirazların incelenmesinde, tam sayısı ile toplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Diğer hususlarda kurulun mürettep adedinin çoğunluğu ile toplanabilir. Her iki halde de salt çoğunlukla karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Oyların eşitliği halinde Başkanın bulunduğu taraf tercih olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="114" başlık="Kararların bildirilmesi ve tebliği">
        <mvz-fıkra no="1">
          <template>İtiraz üzerine kesin olmayarak verilen kararlar, itiraz eden hazır ise sözle bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sözle bildirmelerde, kararın bildirildiği gün ve saat tutanağa geçirilerek kendisine de imza ettirilir. İsterse kararın bir örneği de verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İtiraz eden hazır değilse, seçim kurullarının bulunduğu kasaba veya şehirde, muayyen bir yer gösterilmiş olması halinde, karar, bu yere tebliğ olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kurulların kesin kararları tebliğ olunmaz. Ancak itiraz eden başvurduğu takdirde kendisine gösterilir ve isterse bir suret de verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="115" başlık="Resim ve harç">
        <mvz-fıkra no="1">
          <template>Şikayet ve itiraza ilişkin her türlü evrak, resim ve harcdan muaftır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Şikayet">
      <mvz-madde no="116" başlık="Tarifi ve mercii">
        <mvz-fıkra no="1">
          <template>Şikayet, kütüklerin düzenlenmesi ile görevli ilçe seçim kurulu başkanlariyle, kütüklerin düzenlenmesine memur edilen sair kimselerin ve il, ilçe seçim kurullariyle sandık kurullarının veya kurullar başkanlarının bu kanunun verdiği yetkilere dayanarak yaptıkları işlemlere ve aldıkları tedbirlere ve bunlara benzer sair muamelelerine veya herhangi bir kimsenin bu kanunun koyduğu yasak hükümlerine aykırı hareketlerine karşı bu işlemlerin, tedbirlerin sair muamelelerin düzeltilmesi, veyahut kanunun koyduğu yasaklara uymayanların, bu hareketlerinin önlenmesi maksadiyle yapılan müracaatlardır. Şikayet bu kurullara veya başkanlarına veya sair görevlilere sözlü veya yazı ile 110 uncu maddede gösterilenler tarafından yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="117" başlık="Şikayetin incelenmesi">
        <mvz-fıkra no="1">
          <template>Şikayet kabul edildiği takdirde, şikayete konu olan işlem veya tedbirler düzeltilir ve kanuna aykırı hareketler önlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Şikayet kabul edilmediği takdirde, derhal tutanağa geçirilerek karara bağlanır. Bu kararın bir sureti şikayetçiye verilir. Bu kararlara karşı kanunda ayrıca bir müddet tayin edilmemiş ise, kırksekiz saat içinde itiraz olunabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="118" başlık="İtiraz ve şikayetin işlemleri durduramaması">
        <mvz-fıkra no="1">
          <template>İşlemlere, tedbirlere ve kararlara karşı yapılan şikayet ve itirazlar, oy vermeye ve her türlü seçim işlerinin devamına engel olmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Kurulların Teşekkül ve İşlemlerine Karşı Şikayet ve İtiraz">
      <mvz-madde no="119" başlık="Sandık kurullarına ait itiraz ve şikayet">
        <mvz-fıkra no="1">
          <template>Sandık kurullarının teşkiline dair, ilçe seçim kurulu veya başkanı tarafından yapılan işlemlerin düzeltilmesi için, bu işlemlerin neticesinden itibaren en geç iki gün içinde şikayet yoliyle düzeltilmesi istenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Şikayetin reddine dair olan kararlara karşı, bildirilmesinden veya tebliğinden itibaren iki gün içinde il seçim kuruluna itiraz olunur. İl seçim kurulları, iki gün içinde kesin karar verirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu şikayetin yapılmamış olması sandık kurulunun teşekkülüne karşı itiraza engel değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ancak, bu itirazın teşekkülünden itibaren iki gün içinde il seçim kuruluna yapılması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İl seçim kurulunun vereceği karar kesindir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="120" başlık="İlçe seçim kurullarına ait itiraz ve şikayet">
        <mvz-fıkra no="1">
          <template>İlçe seçim kurulu teşkili işlemlerine karşı, il seçim kurullarına bunların teşekkülünden itibaren en geç iki gün içinde itiraz olunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İl seçim kurulları, itirazları en geç iki gün içinde, kesin olarak karara bağlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="121" başlık="İl seçim kurullarına ait itiraz ve şikayet">
        <mvz-fıkra no="1">
          <template>İl seçim kurullarının teşekkülüne karşı kurulun teşkilinden itibaren en geç üç gün içinde, Yüksek Seçim Kuruluna itiraz olunabilir. Yüksek Seçim Kurulu üç gün içinde bir karar verir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Sandık Seçmen Listelerine İtiraz">
      <mvz-madde no="122" başlık="Muhtarlık bölgesi askı listelerine itiraz">
        <mvz-fıkra no="1">
          <template>Muhtarlık bölgesi askı listelerine, siyasi partilerin 112 nci maddede belirtilen ilçe yetkilileri, o ilçede oturan seçmenlerle ilgili olarak ilçe seçim kurulları başkanlıklarına; genel merkez yetkilileri tüm seçmen kütüğü ile ilgili olarak Yüksek Seçim Kurulu Başkanlığına; seçmen niteliğini haiz vatandaşlar kendileri ile ilgili olarak ilçe seçim kurulu başkanlarına şikayet ve itirazda bulunabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Muhtarlık bölgesi askı listesine yapılan itirazlar; itirazın yapıldığı kurul başkanınca kesin karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Karar sureti; Seçmen Kütüğü Genel Müdürlüğüne gönderilir ve kütüğe işlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="123" başlık="Sandık bölgesi askı listelerine itiraz">
        <mvz-fıkra no="1">
          <template>Sandık bölgesi askı listesine; 14 üncü maddenin dördüncü fıkrasına göre ilan edilen siyasi parti il ve ilçe başkanları, ilçe seçim kurulu üyeleri, sandık askı listesindeki bilgilerin askı listesine ve itiraz sonucu verilen kararlara sandık ayırımının yasa ve genelgelere uygun olmadığı yolunda, ilçe seçim kuruluna askı süresince itiraz edebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu itiraz, ilçe seçim kurulu tarafından incelenir ve alınan karar itiraz edene ve il seçim kurulu başkanlığına bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu karara karşı, il seçim kuruluna muteriz itiraz edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İl seçim kurulunun kesin kararı, itiraz edilmeyen ilçe seçim kurulu başkanının kararları ile birlikte Yüksek Seçim Kurulu Seçmen Kütüğü Genel Müdürlüğüne gönderilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="124" başlık="Listelere itirazların yöntemi">
        <mvz-fıkra no="1">
          <template>Siyasi partilerin genel merkez yetkilileri ile Seçmen Kütüğü Genel Müdürü, 122 ve 123 üncü maddelerle bu maddede yazılı şikayet ve itirazlar üzerine verilen kesin kararların bir kez de Yüksek Seçim Kurulunda tetkik edilip karara bağlanmasını isteyebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>122 ve 123 üncü maddelerle bu maddede yazılı şikayet ve itirazların zaman, süre, inceleme ve sonuçlandırılma kuralları Yüksek Seçim Kurulunca, ilk askıdan en az bir ay önce yayınlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İtiraz üzerine verilecek kararların, seçmen kütüğünde değiştirdiği, çıkardığı veya eklediği bilgiler ayrı bir "güncelleştirme kütüğünde" saklanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="125" başlık="Adaylığa itiraz">
        <mvz-fıkra no="1">
          <template>Özel kanunlarında aykırı bir hüküm bulunmadığı takdirde, adaylıklarını koyanlara özel kanunları gereğince yapılacak ilandan itibaren iki gün içinde 110 uncu maddede gösterilenler tarafından adaylık şart veya vasıflarını haiz olmamaları sebebine dayanılarak itiraz edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Şu kadar ki, bir siyasi partinin listesinde yer alan adayların tespiti sırasında o partinin tüzük ve yönetmeliklerinde yazılı hükümlere aykırı davranıldığından bahisle, ilgili siyasi partinin üyesi olmayan kimseler tarafından itiraz edilemez. Bu tür itirazlarda, itiraz edenin aynı siyasi partiye kayıtlı olduğunu kanıtlayan belge eklenmemiş itiraz dilekçeleri işleme konulmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu itirazlar, seçimin özelliğine göre kanunen seçimi idare ile görevli seçim kurullarına yapılır ve bu kurulun kararına karşı kesin karar vermek yetkisini haiz üst seçim kuruluna da itiraz olunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İtirazın yazıyla yapılması ve itiraz dilekçesine itiraza sebep gösterilen belgelerin bağlanması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>(İptal)</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="126" başlık="İtirazın incelenmesi süresi">
        <mvz-fıkra no="1">
          <template>Adaylıklar özel kanunlarında gösterilen süre içinde kesinleşir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kesin karar vermeye yetkili üst kurullar, adaylıkların kesinleşmesi tarihinden önce itirazları karara bağlarlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Beşinci Bölüm">
      <mvz-madde no="127" başlık="Sandık kurullarının veya başkanlarının şikayet üzerine verecekleri kararlara itiraz">
        <mvz-fıkra no="1">
          <template>Sandık kurullarının veya başkanlarının işlemlerine ve her türlü sandıkbaşı işlerine 110 uncu maddeye göre yapılacak şikayetlerin reddine dair verilecek kararlara karşı ilgililer, derhal, ilçe seçim kurulu başkanına itiraz edebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İlçe seçim kurulu başkanı, itirazı derhal tetkik ederek kesin karara bağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Başkanın kararı, durumu tashih veya sandık kurulunun şikayet üzerine verdiği kararı iptal eder mahiyette ise, bu karar derhal sandık kurulu başkanına bildirilir, karara uymak mecburidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Şikayet ve itirazlar en geç seçim sonuçlarını tesbit eden tutanağın düzenlenmesine kadar yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="128" başlık="Sandık kurulu kararlarına ve tutanağa itiraz">
        <mvz-fıkra no="1">
          <template>Sandık kurullarının kararları, oyların sayım ve dökümü ile tutanakların düzenlenmesine ilişkin iş ve işlemleri aleyhine, ilçe seçim kuruluna itiraz olunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu itirazlar, sandık sonuç tutanağının düzenlenip başkan ve üyeler tarafından imzalanmasına kadar sözle veya yazıyla, sandık kurulları vasıtasıyla yapılabileceği gibi, oy verme gününden sonraki salı günü saat 15.00'e kadar doğrudan ilçe seçim kurullarına yazılı olarak yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sandık başı iş ve işlemlerine karşı, ilçe seçim kuruluna itiraz edilebilmesi için, önce sandık kuruluna şikâyet veya itirazda bulunulmuş olması şart değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İlçe seçim kurulları, itirazları en geç itirazın yapıldığı tarihten sonraki ikinci gün saat 17.00'ye kadar karara bağlar. İtirazı yapan hazır ise, karar kendisine bildirilir; değilse tebliğ edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İlçe seçim kurulları, yukarıda gösterilen itiraz süresi sona ermeden veya süresinde yapılan itirazları inceleyip bir karara bağlamadan önce, ilçe birleştirme tutanağını düzenleyemez. Bu hükme rağmen, bu tutanağın düzenlenmiş olması, üst seçim kurullarına itiraz için Kanunda öngörülen sürelere başlangıç teşkil etmez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="6-ALTINCI" başlık="Altıncı Bölüm">
      <mvz-madde no="129" başlık="İlçe seçim kurullarının veya başkanlarının şikayet üzerine verecekleri kararlarla sair kararlarına ve ilçe birleştirme tutanaklarına itiraz">
        <mvz-fıkra no="1">
          <template>İlçe seçim kurullarının veya başkanlarının, kendi işlemleri aleyhine vakı şikayet üzerine verdikleri kararlar ile, sair kararları aleyhine, en geç ilçe birleştirme tutanağının düzenlenmesine kadar; ilçe birleştirme tutanağının düzenlenmesi ve buna ait işlerle neticelerine karşı bu tutanağın düzenlenmesini takip eden gün saat on yediye kadar, doğrudan doğruya veya ilçe seçim kurulları eli ile il seçim kurullarına itiraz edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İlçe seçim kurullarının veya başkanlarının işlemlerine, tedbirlerine ve sair muamelelerine karşı yapılan şikayetlerin reddine dair verilen kararlara yapılan itirazlar, iki gün içinde kesin karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İtirazın kabulüne karar verildiği takdirde, bu karar en seri vasıta ile ilçe seçim kurulu başkanına bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sair itirazlar, iki gün içinde karara bağlanır, itiraz eden hazır ise kendisine sözle bildirilir. Hazır değil ise tebliğ olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="7-YEDİNCİ" başlık="Yedinci Bölüm">
      <mvz-madde no="130" başlık="İl seçim kurulu ve başkanlarının şikayet üzerine verecekleri kararlarla, sair kararlarına ve tutanaklara itiraz ve olağanüstü itiraz">
        <mvz-fıkra no="1">
          <template>İl seçim kurullarının kararlarına karşı aşağıdaki şekilde itiraz olunur:</template>
          <mvz-bent no="1.">
            <template>İl seçim kurullarıyla başkanlarının kendi işlemleri aleyhine vaki şikayetlerin reddine dair verdikleri kararlara, tebliğ veya tefhiminden itibaren üç gün,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Bu kurulların teşekkülüne, kurulun teşkilinden itibaren üç gün,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Oy verme günü işlemlerine ait kararlara karşı derhal,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Sair kararlar aleyhine bu kararların öğrenildiği tarihten itibaren üç gün içinde ve en geç il birleştirme tutanağının düzenlenmesini takip eden üçüncü gün saat 17.00 ye,</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Oyların dökümüne, sayımına, oyların seçilenlere göre ayrılmasına; il birleştirme tutanağının düzenlenmesinden sonraki üçüncü gün saat 17.00 ye,</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Seçilme yeterliğine; veya kendilerine tutanak verilenlerin, seçilmediğine veya seçimin sonucuna tesir edecek olaylara karşı, seçilenlere verilecek tutanağın düzenlenmesinden sonraki üçüncü gün saat 17.00 ye,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Kadar 110 uncu maddede yazılı kimseler tarafından doğrudan doğruya veya il seçim kurulları vasıtasıyla Yüksek Seçim Kuruluna itiraz edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Şu kadar ki; siyasi partilerin il başkanlarıyla genel merkezleri veya bağımsız aday tarafından tutanağın düzenlenmesinden sonra 7 gün içinde seçimin neticesine müessir olaylar ve haller sebebiyle yapılan itirazlar, seçimin sonucu hakkında kesin karar vermek yetkisine sahip olan kurullarca, seçimin neticesine müessir görüldüğü takdirde, alt kademelerce verilen kararların kesin veya kesinleşmiş olması veya kurullara derece derece ve müddeti içinde müracaat edilmemiş olması, bu itirazın incelenmesine ve reddine sebep teşkil etmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu itirazlar yazılı olarak yapılır. İtiraz dilekçesine, itiraz edenin adının, soyadının ve açık adresinin yazılması, ihbar ve iddia olunan vakıaların mahiyetinin ve gerekçesinin beyanının, delillerinin gösterilmesi ve belgelerinin bağlanması, bu belgelerin elde edilmesi mümkün değil ise, sebeplerinin ve nereden ve ne suretle temin olunabileceğinin bildirilmesi lazımdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ancak, adaylığın kesinleşmesinden sonra, adayın Türk olmadığına, yaşının kanunda gösterilenden küçük olduğuna, okur - yazar olmadığı veya seçilme yeterliğini kaybettiren bir mahkümiyeti bulunduğuna ilişkin iddialar dışındaki nedenlerle adaylara itiraz olunamaz. Bu hüküm olağanüstü itirazlar için de geçerlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu şartları haiz olmayan dilekçeler reddolunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="8-SEKİZİNCİ" başlık="Sekizinci Bölüm">
      <mvz-madde no="131" başlık="Yüksek Seçim Kurulunun işlem ve tedbirlerine karşı şikayet">
        <mvz-fıkra no="1">
          <template>Her türlü seçimin devamı sırasında, Yüksek Seçim Kurulunun itiraz eylediği veya itiraz yolu ile verdiği kararlar dışında kalan işlemleri, tedbirleri ve sair muameleleriyle, bu kanunda başka bir mercie şikayet veya başvurma yolu gösterilmemiş ve fakat alt kurulların görevleri sınırlarını aşmış olan veya bu mahiyette bulunan, kanuna aykırı hareketlerden dolayı 110 uncu maddede gösterilenler tarafından, yazılı olarak, doğrudan doğruya, Yüksek Seçim Kuruluna şikayet olunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yazılı şikayetlerin 112 nci maddedeki şartları ihtiva etmesi lazımdır. Bu şikayetler üzerine, Yüksek Seçim Kurulunca derhal ve kesin olarak karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="132" başlık="Tetkik ve tahkik usulü">
        <mvz-fıkra no="1">
          <template>Yüksek Seçim Kurulu evrak üzerinde, incelemeler yapar. Ayrıca lüzum gördüğü bilcümle tahkik ve her türlü tetkik işlemlerini de yapar. Gerekli mercilerden her türlü bilgi ve belgeleri ister. Bu mercilerin, en kısa bir zamanda ve en geç yedi gün içinde istenilen bilgi ve belgeyi vermeleri mecburidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurul başkanı, lüzum ve ihtiyaca göre, bu işlerde çalışmak üzere, Yargıtay ve Danıştay memurlarını da vazifelendirebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İtiraz dilekçesinin bir sureti, tutanağına itiraz edilene tebliğ olunur. Tutanağına itiraz olunan kimse, isterse yazı ile savunabileceği gibi, isteği üzerine, Yüksek Seçim Kurulunun tayin edeceği günde bizzat veya bir vekil marifetiyle kendini kurul huzurunda savunabilir. Kurul, yapılan itiraz ve ihbarları kendisine verildiği tarihten itibaren en geç üç ay içinde bir karara bağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kurulun kararı kesindir. Aleyhine hiçbir mercie ve kanun yoluna başvurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Seçimin özelliğine göre seçim sonuçları hakkında kesin karar vermeye yetkili mercie yapılacak itirazlarda da yukarıki 1 inci ve 3 üncü fıkralar hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Ancak, bu kurul itirazları onbeş gün içinde kesin karara bağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Yukarıki fıkralarda yazılı kararlar aleyhine hiçbir mercie ve kanun yoluna başvurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Tutanakların iptali halinde özel kanunlarındaki hükümler uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="7-YEDİNCİ" başlık="Seçim Suçları ve Cezaları">
    <mvz-madde no="133" başlık="Kurullara karşı suçlar">
      <mvz-fıkra no="1">
        <template>Hileli faaliyetlerle veya herhangi bir şekil ve surette cebir veya şiddet kullanarak veya tehdit ederek, bu Kanunda yazılı kurulların toplanmalarına veya görevlerinin ifasına mani olanlar, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıdaki fıkrada yazılı fiiller, silahla işlenirse, verilecek ceza üç yıldan aşağı olamaz. Bu fiiller, aralarından biri silahlı en az üç kişi tarafından birlikte işlendiği takdirde, failler hakkında beş yıldan onbeş yıla kadar hapis cezasına hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="134" başlık="Kurulların tedbirlerine riayetsizlik">
      <mvz-fıkra no="1">
        <template>Seçim işlerinin cereyanı sırasında, seçimin düzenli yürütülmesini sağlamak maksadı ile, bu Kanunda yazılı kurullar veyahut kurul başkanları tarafından alınan karar ve tedbirlere, ihtara rağmen riayet etmeyen kişilere ikiyüz Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Herhangi bir şekilde alınan karar ve tedbirlerin uygulanmasını zorlaştıran veyahut karar ve tedbirlerin neticesiz kalmasına sebebiyet veren kimseler, altı aya kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıda yazılı fiiller, görevli kimseler tarafından işlendiği ve fiilleri daha ağır cezayı gerektiren suç oluşturmadığı takdirde, birinci veya ikinci fıkraya göre verilecek ceza yarı oranında artırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="135" başlık="Kurul üyelerinin kurul kararlarına riayetsizliği">
      <mvz-fıkra no="1">
        <template>Bu kanunda yazılı kurulların çoğunlukla vermiş oldukları her çeşit kararlara riayet etmiyen kurul üyeleri, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="136" başlık="Kurul üyelerinin göreve gelmemesi">
      <mvz-fıkra no="1">
        <template>Kurullara seçildiği halde haklı sebep olmaksızın vazifesi başına gelmeyenler elli günden az olmamak üzere adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçim başladıktan sonra kuruldaki görevlerini haklı bir sebep olmaksızın terk edenler, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="137" başlık="Araç ve gereçlerin vaktinde gönderilmemesi">
      <mvz-fıkra no="1">
        <template>Seçim kurulları başkan ve üyelerinden herhangi biri veya bu Kanunda yazılı işlerden biriyle görevlendirilen kimseler sandık seçmen listelerini, aday listelerini, seçime ait kağıt ve paketleri ve oy pusulalarını, oy sandıklarını, oy zarflarını veya maddi ve malî vasıtaları ve bilcümle seçim araç ve gereçlerini vaktinde yerlerine göndermezler veya gönderilmesine mani olurlar veya teslim etmezler veya teslim almazlarsa, iki yıldan beş yıla kadar hapis cezasıyla cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu fiilleri görevlilerden başkaları yaparsa, cezanın alt sınırı bir yıldır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="138" başlık="Görevi kötüye kullanma">
      <mvz-fıkra no="1">
        <template>Bu Kanunun tatbiki ile görevli veya bu Kanuna göre görevlendirilen kimseler görevlerini her hangi bir şekilde kötüye kullandıkları takdirde, fiilleri bu Kanunda ayrı bir suç olarak tanımlanmamış ise, Türk Ceza Kanununun 257 nci maddesine göre verilecek ceza altıda birden üçte bire kadar artırılarak hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="139" başlık="Memur olanların cezaları">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="140" başlık="Seçmen kütüğü hazırlıklarına ilişkin suçlar">
      <mvz-fıkra no="1">
        <template>Seçmen kütüğünün düzenlenmesine esas teşkil edecek olan krokilerle, binalar cetvelini ilçe seçim kurulu başkanınca bildirilen süre içinde düzenleyerek vermeyenler veya kroki ve binalar cetvellerini seçmen kütüğünün düzenlenmesine elverişli bir şekilde yapmayanlar hakkında, Türk Ceza Kanununun 257 nci maddesinde yazılı cezalar altıda birden üçte bire kadar artırılarak hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sayım ve yazım ve denetim işlemleri sırasında, belli edilen esaslara aykırı harekette bulunanlarla, sorulara cevap vermeyenler veya bilerek gerçeğe aykırı cevap verenler yahut ilk sayım ve yazım gününde, ilan edilecek süreden önce bulundukları yeri terk edenlere, fiilleri suç oluşturmadığı takdirde yüz Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="141" başlık="Seçmen kütüğünün düzenlenmesi">
      <mvz-fıkra no="1">
        <template>Bu Kanunla görevlendirilmiş oldukları halde, belli, süre içinde ve şekillerine uygun olarak seçmen kütüğüne müteallik evrak ve vesikaları gereği gibi düzenlemeyen veya muhafaza etmeyenler veya gereken mercie vermeyenler altı aydan iki yıla kadar hapis cezası ile cezalandırılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu fiiller kayıtsızlık veya gereken dikkat ve itinanın gösterilmemesi sonucu husule gelmiş ise üç aydan bir seneye kadar hapis cezası hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıda yazılı fiil ve hareketler yüzünden herhangi bir bölgede, seçmen kütüğünün veya sandık seçmen listelerinin yazılması veya bu sebeple seçmenlerin oy vermesi imkansız hale gelmiş ise, birinci fıkrada yazılı halde bir seneden iki seneye kadar, ikinci fıkrada yazılı halde de altı aydan iki seneye kadar hapis cezası hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="142" başlık="Kütük düzenlemekle görevli olanların suçları">
      <mvz-fıkra no="1">
        <template>Seçmen kütüğüne yazılmak hakkı olmayan bir seçmeni yazan veya yazılmak hakkı olan bir seçmeni yazmayan veya kütüğe yazılmış olup da silinmesi gereken seçmenin adını silmeyen veya silinmemesi gerektiği halde o seçmenin adını silenler bir yıldan iki yıla kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Eğer bu fiiller kayıtsızlık ve görevde gereken dikkat ve itinanın gösterilmemesinden ileri gelmiş ise üç aydan altı aya kadar hapis cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="143" başlık="Seçme yeterliği olmayanların seçmen kütüğüne kaydı">
      <mvz-fıkra no="1">
        <template>Seçme yeterliği bulunmadığı halde kendisini veya bu yeterliği olmayan bir başkasını her ne suretle olursa olsun seçmen kütüğüne kaydettiren veya bu şekilde kaydedilmiş olanları seçmen kütüğünden silinmesine aynı şekilde mani olan veya seçme yeterliği bulunan birinin aynı fiil ve hareketlerle seçmen kütüğünden silinmesine sebep olan altı aydan iki seneye kadar hapis  cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">

  <mvz-kısım no="8-SEKİZİNCİ" başlık="Soruşturma ve Kovuşturma Usul ve Şekilleri">

      <mvz-fıkra no="1">
        <template>Seçim işleriyle görevlendirilenlerin oy verme günü ile bundan önceki yirmi dört saat içinde işledikleri bu Kanunda yazılı seçim suçlarından ötürü bağlı bulundukları kurullarca düzenlenmesi gereken seçim tutanaklarının tanzim edildiğinin ertesi günü soruşturma başlatılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu süre içinde ağır ceza mahkemesinin görevine giren suçlarla asliye ceza mahkemesinin görevine giren suçüstü hali, infazı gerektiren hükümler ve merciinden verilmiş tutuklama kararı veya yakalama emri dışında başka hiçbir sebepten dolayı bir seçmen hakkında soruşturma ve kovuşturma yapılamaz ve oy verme günü ile ondan önceki üç gün içerisinde seçmenin hürriyetini ve oy verme imkânını kaldıracak veya tahdid edecek idarî ve malî hiçbir tedbir alınamaz.</template>

    <mvz-madde no="174" başlık="Genel hükümlerin uygulanması">

        <template>Bu Kanunda yazılı suçlardan birini işleyenler veya bu Kanunun uygulanmasına taalluk edip de genel hükümlere göre cezalandırılmaları gerekenlerin sıfat ve memuriyetleri ne olursa olsun haklarında umumi hükümler dairesinde soruşturma ve kovuşturma yapılır.</template>

      <mvz-fıkra no="2">
        <template>Valiler hakkındaki soruşturma Yargıtay Cumhuriyet Başsavcısı veya Cumhuriyet Başsavcıvekili; kovuşturma ise Yargıtayın ilgili ceza dairesi tarafından umumi hükümlere göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yargıtay Cumhuriyet Başsavcısı soruşturmayı Yargıtay Cumhuriyet savcılarına da yaptırabilir. Ancak, kamu davasını açmak veya kovuşturmaya yer olmadığına dair karar vermek yetkisi Cumhuriyet Başsavcısına aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Soruşturma sırasında Başsavcı tarafından istenilen yakalama emri, tutuklama, tahliye, elkoyma ve aramaya Yargıtay ilgili ceza dairesi başkanı tarafından karar verilir. Bu kararlara karşı yapılan itirazları ise, numara itibariyle izleyen ceza dairesi inceler. Son numaralı daire başkanının kararı söz konusu ise, itirazları inceleme yetkisi Birinci Ceza Dairesine aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yargıtay Cumhuriyet Başsavcısı tarafından verilen kovuşturmaya yer olmadığına dair karara yapılan itirazı, soruşturma konusu suçun en ağırına bakmakla görevli ceza dairesini numara itibariyle izleyen ceza dairesi başkanı inceler. Soruşturma konusu suç, son numaralı ceza dairesinin görevine giriyorsa, itirazı inceleme yetkisi Birinci Ceza Dairesi Başkanına aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kaymakamlar hakkında soruşturma yapmaya ve kamu davası açmaya il Cumhuriyet başsavcısı veya başsavcıvekili ve kovuşturma yapmaya il ağır ceza mahkemesi yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Hâkimler ve Savcılar Kanunu hükümleri mahfuzdur.</template>

    <mvz-madde no="176" başlık="Seçim zamanında cevap hakkı">

  <mvz-kısım no="9-DOKUZUNCU" başlık="Çeşitli Hükümler">
    <mvz-madde no="181" başlık="Seçim giderleri:">

    <mvz-madde no="182" başlık="Ödenecek ücretler">

    <mvz-madde no="2" başlık="" tür="Ek">

    <mvz-madde no="11" başlık="" tür="Geçici">

        <template>29 uncu maddede öngörülen, daimi seçmen kütükleri bürolarında görevlendirilecek personel için gerekli kadrolar alınıncaya kadar, bu bürolarca yapılacak hizmetlerde çalıştırılmak üzere, ilçe seçim kurulu başkanları, 33 üncü maddede yazılı yetkiyi kullanabilirler. Bu takdirde, görevlerin nasıl yürütüleceği Yüksek Seçim Kurulu tarafından belli edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Daimi seçmen kütükleri bürolarında görevlendirilecek şef ve memurlarla ilgili atamaların herhangi bir nedenle tamamlanamamış bulunduğu ilçelerde de, yukarıdaki fıkra, hükmü uygulanabilir.</template>
      </mvz-fıkra>

    <mvz-madde no="12" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>26/4/1961 tarih ve 298 sayılı Kanunun 24/3/1973 tarih ve 1700 sayılı Kanunla değişik; 35 ve müteakip maddelerine göre bütün Türkiye'de 1979 yılının Mart ve Nisan ayları içinde yapılması gereken seçmen kütüklerinin denetimi bir ay ertelenmiştir. Bu denetim işlemi 1979 yılına münhasır olmak üzere sadece Cumhuriyet Senatosu üçte bir yenileme seçimlerinin yapılacağı (C) Grubu illeri ile boşalan Cumhuriyet Senatosu üyelikleri ve milletvekillikleri için ara seçimi yapılacak illerde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte görev yapmakta olan Yüksek Seçim Kurulu üyelerinin görevi 1981 yılı Ocak ayına kadar devam eder. 1980 yılının Aralık ayının ilk haftasında Yargıtay ve Danıştay üyeleri arasından ad çekme ile 3'er üye ayrılır. Ad çekme, Yüksek Seçim Kurulu huzurunda, kurul başkanı tarafından yapılır. Başkan ve başkanvekili bu ad çekmeye girmezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>1981 Ocak ayının ilk haftasında, Yargıtay ve Danıştay Genel Kurullarında, ad çekme sonucunda boşalan 3'er üyelik için seçim yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Geri kalan üyeliklerin seçimi 1983 Ocak ayında yenilenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesini takip eden bir aylık sürenin son haftasında, 15 inci maddede yazılı usulle il seçim kurulları, 18 ve 19 uncu maddelerde yazılı usulle ilçe seçim kurulları kurulur. Bu kurulların yenilenmesi, bu Kanunun yürürlüğe girmesini takip eden Ocak ayından bir yıl sonraki Ocak ayının son haftasında yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>24/3/1973 tarihli ve 1700 sayılı Kanunla değiştirilen 298 sayılı Kanunun 28 ve müteakip maddelerine göre, kadroları Adalet Bakanlığına bağlı daimi seçmen kütüğü bürolarında çalışan personelden, kadrolarıyla birlikte Seçmen Kütüğü Genel Müdürlüğüne geçmeleri Genel Müdürlükçe uygun görülmeyenler, Adalet Bakanlığınca başka görevlere atanırlar ve kadroları iptal edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İlk yazım, bu Kanunun yürürlüğe girdiği tarihten sonra gelen altmışıncı günü takibeden ilk pazar günü yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yazımda elde edilen bilgiler, ilgili ilçe seçim kurullarında liste haline getirilerek bu listeler ilçe seçim kurulu başkanlıklarında saklanır; geçici 17 nci maddenin uygulanmasında bu listelerde yazılı bilgiler esas alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümleri gereğince Seçmen Kütüğü Genel Müdürlüğü tarafından düzenlenecek seçmen kütüğünün ve bu kütüğe uygun olarak yayınlanacak sandık seçmen listelerinin hazırlanıp yayınlanmasında; 14 Ekim 1979 tarihinde Cumhuriyet Senatosu üçte bir yenileme, Cumhuriyet Senatosu üyeliği ile Milletvekili ara seçimleri yapılacak illere ve ilk sandık seçmen listelerinin yayınlanmasına kadar geçecek süre içinde mahalli idareler seçimleri yapılacak seçim çevrelerine öncelik verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlk yazım ve birinci bentte belirtilen seçimlerin yapılma tarihlerine göre; bu seçimlerin yapılacağı seçim çevrelerine ait kütük ve sandık seçmen listelerinin zaman darlığı sebebiyle Seçmen Kütüğü Genel Müdürlüğünce hazırlanıp yayınlanmasına ve yapılacak bu seçimlere yetiştirilmesine imkan olmadığının Yüksek Seçim Kurulunca tespit edilmesi halinde:</template>
        <mvz-bent no="a">
          <template>14 Ekim 1979 tarihinde yapılacak Cumhuriyet Senatosu üçte bir yenileme, Cumhuriyet Senatosu üyeliği ve milletvekili ara seçimlerinde, ilçe seçmen kütüğü bürolarının geçici 16 ncı maddeye göre yapılan ilk yazımla elde edilen bilgilerden çıkardığı listelere göre hazırlanacak sandık seçmen listeleri kullanılır.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Bu şekilde hazırlanan sandık seçmen listeleri, listelerin hazırlanmasından sonra bu illere bağlı bütün seçim çevrelerinde yapılacak mahalli idareler seçimleri içinde geçerlidir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu Kanunun yürürlüğe girdiği tarihten yukarıda (a) fıkrasında belirtilen şekilde sandık seçmen listelerinin hazırlanmasına kadar geçecek süre içinde, bütün seçim çevrelerinde yapılacak; belediye başkanlığı, belediye ve il genel meclisi üyelikleri, köy ve mahalle muhtarlıkları, ihtiyar heyeti ve meclisi üyelikleri seçimlerinde kullanılacak sandık seçmen listelerinin tanzim esaslarıyla, (a) fıkrasında yer alan ve ilk yazımla elde edilen bilgileri kapsayan listelerin düzenlenmesine, askıya çıkarılmasına ve askıdan indirilmesine, sandık seçmen listelerine ayrılmasına ve kesinleşmesine, itirazların süre ve şekillerine dair esasları Yüksek Seçim Kurulu tespit ve ilan eder.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 28 inci maddesinde tanımlanan seçmen kütüğü tam olarak oluşturulup işlerlik kazanıncaya kadar yapılacak seçimlerde ve halk oylamalarında kullanılacak seçmen kütüklerinin düzenlenmesi; kütüğe yazılma, muhtarlık bölgesi askı listelerinin düzenlenmesi, askıya çıkarılması, askı süresi, sandık seçmen listelerinin ayrılması, kesinleşmesi ve kütüğün güncelleştirilmesi esas ve ilkeler ile listelere itiraz yöntemleri ve süreleri, seçimlerin özellikleri gözetilmek suretiyle, Yüksek Seçim Kurulunca tespit ve ilan edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yüksek Seçim Kuruluna 1985 Ocak ayında seçilenlerin yerine Ocak 1990 tarihinde yenileme seçimi yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yüksek Seçim Kuruluna 1993/Ocak ayında seçilenlerin yerine Ocak/2000 tarihinde yenileme seçimi yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yüksek Seçim Kuruluna 1993 ve 1996 Ocak ayında Yargıtay ve Danıştay'dan seçilmiş üyeler ile bu üyelerin yerine seçilenler arasından ad çekme ile üçer kişi belirlenir. Başkan ve başkanvekili ad çekmeye girmezler. Belirlenen bu altı üye için 2001 Ocak ayının ikinci yarısında yenileme seçimi yapılır. Diğer beş üye için yenileme seçimleri 2004 Ocak ayında yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yüksek Seçim Kurulu; 28 inci maddede tanımlanan bilgisayar ortamında seçmen kütüğü oluşturmanın alt yapısını teşkil eden SEÇSİS Projesi kapsamında, seçmen olan vatandaşları bilgisayar kayıtlarına aktarmasına kadar, 36 ncı maddenin birinci fıkrasında öngörülen genel yazım ve denetleme yapılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>31/12/2016 son tarih olmak üzere milletvekili genel seçimi, cumhurbaşkanlığı seçimi ve halkoylamalarında 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunun 35 inci maddesindeki hükümlerle sınırlı kalınmaksızın Türkiye Cumhuriyeti kimlik numarası esas alınarak veya mevcut bilgilerle Yurt Dışı Seçmen Kütüğü oluşturulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İl seçim kurulu başkan ve üyeleri ile ilçe seçim kurulu başkanları, bu maddenin yürürlüğe girmesinden itibaren üç ay içinde, 15 inci ve 18 inci maddelerde bu maddeyi ihdas eden Kanunla yapılan değişikliklere göre yeniden belirlenir. Bu şekilde belirlenen başkan ve üyeler, önceki başkan ve üyelerin görev süresini tamamlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihte görev yapan 15 inci maddede yer alan il seçim kurulu ile 18 inci ve 19 uncu maddelerde yer alan ilçe seçim kurulunda bulunan siyasi partilerden alınan üyeler haricindeki kurul üyelerinin görev süresi 2025 yılı Ocak ayının son haftasında yapılacak olan yeni oluşuma kadar uzar. 2025 yılı Ocak ayının son haftasında kurullar tüm üyeleri ile yeniden oluşturulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" tür="Ek Geçici">
      <mvz-fıkra no="1">
        <template>Anayasaya dayalı olarak hazırlanacak Siyasi Partiler ve Seçim Kanununa göre yapılacak ilk genel seçimlerde; 1/7/1982 tarihli ve 2687 sayılı Kanun gereğince Anayasanın halkoyuna sunulması için hazırlanan seçmen kütükleri, aynı Kanunun ilgili hükümlerine göre güncelleştirilerek kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Güncelleştirme işlemi, Anayasa için yapılan halkoylamasına katılmayanların tesbit edilmesinden sonra, kütüklerin muhtarlık bölgesi askı listesi halinde askıya çıkarılması, bu listelerde ismi bulunmayanların ve yanlış yazılanların, başvurmalarına imkan sağlanması, yanlışlıkların düzeltilmesi ve eksiklerin giderilmesi suretiyle yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Askıya çıkarılma tarihi ve askı süresi ile itirazlar, itiraz belgeleri kütüklerin kesinleşme tarihi, evvelce yazılmamış olanların yeniden ne suretle yazılacağı ve yazılma şartları Yüksek Seçim Kurulunca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kütüklerde ismi bulunmayanlardan, seçmen kütüklerinin kesinleştiği tarihe kadar 21 yaşını bitirmiş olanlar, başvuruları üzerine seçmen kütüklerine kaydedilirler. Nüfus kütüğünde doğduğu ay ve günü belli olmayanlar o yılın son günü doğmuş gibi işleme tabi tutulurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" tür="Ek Geçici">
      <mvz-fıkra no="1">
        <template>1/7/1982 tarihli ve 2687 sayılı Kanunun 8 inci maddesine göre oy kullanma yeterliğine sahip olup yazım için gelen memurlara kendilerini yazdırmayanlardan, bu Kanun hükümlerine göre kütüklerin askı süresi içinde başvurarak kendilerini kütüğe yazdıranlar hakkında, bu suçtan dolayı takibat yapılmaz, ceza mahkümiyetleri sonuçlarını da kapsamak üzere ortadan kalkar. Ancak tahsil edilmiş para cezaları iade edilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu şekilde kütüğe kendilerini yazdıranlar, genel ve ara seçimleri ile mahalli seçimlerde ve halkoylamalarında oy kullanabilirler ve aday olabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" tür="Ek Geçici">
      <mvz-fıkra no="1">
        <template>Anayasanın halkoylamasına ilişkin oy verme kütüğünde ve sandık listesinde kaydı ve oy kullanma yeterliği bulunduğu halde hukuki veya fiili herhangi bir mazereti nedeniyle halkoylamasına katılmayan ve süresinde mazeretini ileri sürmeyen veya bu yönde başvuruda bulunduğu halde delil yetersizliği veya süre veya sair sebeplerle başvurusu reddedilenlerden, seçmen kütüklerinin askıdan indirildiği tarihten önce kayıtlı oldukları ilçe seçim kurulu başkanlıklarına başvurarak mazeretlerini tevsik edenler hakkında 24/9/1982 tarihli ve 2707 sayılı Kanunun 12 nci maddesinin birinci fıkrasında yazılı yasaklar uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Başvuruların incelenmesine ilişkin usul ve esaslar Yüksek Seçim Kurulunca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
