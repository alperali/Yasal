<mvz-künye tür="kanun" no="298" başlık="SEÇİMLERİN TEMEL HÜKÜMLERİ VE SEÇMEN KÜTÜKLERİ HAKKINDA KANUN"
             tarih="26/4/1961" rgazete-tarih="2/5/1961" rgazete-sayı="10796"
             düstur-tertip="4" düstur-cilt="1" düstur-sayfa="2553" />

  <mvz-kısım no="1-BİRİNCİ" başlık="İlkeler">
    <mvz-madde no="1" başlık="Kanunun kapsamı">
      <mvz-fıkra no="1">
        <template>Özel kanunlarına göre yapılacak Cumhurbaşkanı, milletvekili, il genel meclisi üyeliği, belediye başkanlığı, belediye meclisi üyeliği, muhtarlık, ihtiyar meclisi üyeliği, ihtiyar heyeti üyeliği seçimlerinde ve Anayasa değişikliklerine ilişkin kanunların halk oyuna sunulmasında bu Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Seçim esasları">
      <mvz-fıkra no="1">
        <template>Seçimler, serbest, eşit, tek dereceli genel oy esaslarına göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçmen oyunu kendisi kullanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Oy gizli verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Oyların sayımı, dökümü ve tutanaklara bağlanması açık olarak yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Seçim çevresi">
      <mvz-fıkra no="1">
        <template>Özel kanunlarındaki çevre ayırmaları saklı kalmak şartiyle, seçimlerde her il bir seçim çevresidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Seçim bölgesi">
      <mvz-fıkra no="1">
        <template>Seçimlerde, her muhtarlık, bir seçim bölgesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Sandık bölgesi">
      <mvz-fıkra no="1">
        <template>Seçimlerde, her seçim bölgesi gerektiği kadar sandık bölgesine ayrılır.  Aynı binada oturan seçmenler, hane bütünlüklerinin korunması ve aynı seçim bölgesinde kalmaları şartıyla, farklı sandık bölgelerine kaydedilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Seçmen">
      <mvz-fıkra no="1">
        <template>Onsekiz yaşını dolduran her Türk vatandaşı seçme ve halk oylamasına katılma hakkına sahiptir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Oy kullanamayacak olanlar">
      <mvz-fıkra no="1">
        <template>Aşağıda yazılı olanlar oy kullanamazlar:</template>
        <mvz-bent no="1.">
          <template>Silah altında bulunan erler, onbaşılar ve kıta çavuşları (Her ne sebeple olursa olsun, izinli bulunanlar da bu hükme tabidir),</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Askeri öğrenciler.</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Ceza infaz kurumlarında hükümlü olarak bulunanlar.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Seçmen olamayanlar">
      <mvz-fıkra no="1">
        <template>Aşağıdaki kimseler seçmen olamazlar:</template>
        <mvz-bent no="1.">
          <template>Kısıtlı olanlar,</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Kamu hizmetinden yasaklı olanlar.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Seçim Kurulları">
    <mvz-madde no="9" başlık="Seçim işlerinin yürütülmesi">
      <mvz-fıkra no="1">
        <template>Seçim işleri, seçim kurullarınca yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Valiler, kaymakamlar, belediye başkanları, muhtarlar ve bütün kamu görevlileri her türlü seçim işleri ve seçmen kütükleri yazımında, seçim kurullarının istediği bilgileri ve belgeleri, gecikmeden, süresinde ve doğru olarak göndermeye mecburdur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Seçim kurulları">
      <mvz-fıkra no="1">
        <template>Ankara'da bir Yüksek Seçim Kurulu, her seçim çevresinde bir il seçim kurulu, her ilçede bir ilçe seçim kurulu ve seçim bölgelerine konulacak her sandık için bir sandık kurulu bulunur.  Yurt dışında bulunan vatandaşların oy kullanmalarıyla ilgili seçim işlerini yönetmek üzere Ankara İl Seçim Kuruluna bağlı Yurt Dışı İlçe Seçim Kurulu oluşturulur. İhtiyaç duyulması halinde birden fazla yurt dışı ilçe seçim kurulu teşkil edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İl merkezlerinde, ayrıca bir merkez ilçe seçim kurulu teşkil olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Son nüfus sayımına göre nüfusu 200.000'i aşan ilçelerde, köy ve mahalle sınırları (seçim bölgeleri) esas alınarak ve mümkün olduğu nispette nüfus sayısında eşitlik gözetilerek; birden fazla ilçe seçim kurulu teşkil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İl belediyeleri ile ilçe belediyeleri dışında; ilçe dahilindeki (merkez ilçe dahil) diğer belediyeler; bölünme yapılmaksızın, mahalleleri ile birlikte bir bütün olarak ilçe seçim kurullarından birine bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Yüksek seçim kurulu">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Üye seçimi zamanı">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Karar verme">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>Yüksek Seçim Kurulunun görev ve yetkileri şunlardır:</template>
        <mvz-bent no="1.">
          <template>Seçimlerde, içine oy pusulası konulacak olan zarfların, icabında her seçim için başka başka renk ve ölçüde olmak ve gerek piyasada, gerek Devlet Malzeme Ofisince imal edilen veya ettirilen veya depolarında bulunan zarfların renk lerinden ve ölçülerinden farklı ve kağıdında "Türkiye Cumhuriyeti Yüksek Seçim Kurulu" filigranı bulunmak üzere, yeteri kadar özel zarf imal ettirmek ve bu imalatı, kağıt hamurundan başlıyarak zarfın, imaline ve teslim alınmasına kadar olan safhalarını; yapılacak işin hacmi, süresi ve niteliği dikkate alınarak belirleyeceği kendi üye veya üyelerinin veya imal ve teslim yerinde yetki vereceği ilçe seçim kurulu başkanının, il seçim kurulu başkanı ya da üyesi hakim veya hakimlerinin devamlı gözetim ve denetimi altında yaptırmak ve bu zarfları il seçim kurullarına, her ilin ihtiyacına yetecek sayıda, alındı belgeleri karşılığında göndermek,</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Özel zarfların imali için gerekli "Türkiye Cumhuriyeti Yüksek Seçim Kurulu" filigran kalıpları ile zarf ölçü kalıplarını yaptırıp gerekli miktarda kağıt ve zarf imalinden sonra saklamak,</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Katlanıp bir kenarı yapıştırıldıktan sonra zarf haline gelebilen "Türkiye Cumhuriyeti Yüksek Seçim Kurulu" filigranını taşıyan birleşik oy pusulalarını, her 400'ü ve her 400'lük paketi, aynı numarayı taşımak üzere bastırmak ve her sandık için bir paket, ilçe seçim kurullarına zamanında ulaştırmak,</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Bu Kanunda sözkonusu edilen bütün işlemlerin gerektirdiği form, evrak, liste ve görme engelli seçmenlerin kullanabilmesi için oy pusulalarına uygun şablon gibi her türlü basılı kağıdın tasarım ve baskısını yaptırmak, il ve ilçe seçim kurullarına zamanında ve ihtiyacı kadar ulaşımını sağlamak,</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>Tüzüklerine göre ilk genel kongresini yapmış olup, illerin en az yarısında ve en az altı ay evvel il ve ilçe teşkilatını kurmuş bulunan siyasi partilerin adlarını, 11 numaralı bentte belirlenen esaslar dâhilinde, ilçe seçim kurullarının yeniden kurulması için öngörülen ayların ikinci haftasında tespit ve ilan etmek,</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>İl ve İlçe seçim kurullarının teşekkülünü sağlamak, İl seçim kurullarının teşekkülüne, işlemlerine ve kararlarına karşı yapılacak itirazları, oy verme gününden önce ve itiraz konusunun gerektirdiği süratle, kesin karara bağlamak,</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>Adaylığa ait itirazlar hakkında bu Kanun ve özel kanunları gereğince kesin karar vermek,</template>
        </mvz-bent>
        <mvz-bent no="7.">
          <template>İl seçim kurullarınca, oy verme günü işlemleri hakkında verilmiş olan kararlara karşı yapılan itirazları derhal inceleyip kesin karara bağlamak,</template>
        </mvz-bent>
        <mvz-bent no="8.">
          <template>İl seçim kurullarınca düzenlenen tutanaklara karşı yapılan itirazları inceleyip kesin karara bağlamak,</template>
        </mvz-bent>
        <mvz-bent no="9.">
          <template>Seçimlerden sonra, kendisine süresi içinde yapılan, seçimin sonucuna müessir olacak ve o çevre seçiminin veya seçilenlerden bir veya birkaçının tutanağının iptalini gerektirecek mahiyette itirazları, altkurullara yapılan itirazların silsilesine ve sürelerine uygunluğunu araştırmaksızın inceleyip kesin karara bağlamak,</template>
        </mvz-bent>
        <mvz-bent no="10.">
          <template>İl seçim kurulları başkanlıklarınca seçim işlerinin yürütülmesi hakkında sorulacak hususları derhal cevaplandırmak ve seçimin bütün yurtta düzenle yapılmasını sağlayacak tedbirleri almak ve bu hususta gereken genelgeleri zamanında yapmak,</template>
        </mvz-bent>
        <mvz-bent no="11.">
          <template>Siyasi partilerin milletvekili genel ve ara seçimlerine ve belediye başkanlığı ile belediye meclisi, il genel meclisi üyelikleri genel ve ara seçimlerine katılabilmeleri için illerin en az yarısında, oy verme gününden en az altı ay evvel teşkilat kurmuş ve büyük kongrelerini yapmış olmaları  şarttır.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Bir ilde teşkilatlanma, merkez ilçesi dahil o ilin ilçelerinin en az üçte birinde teşkilat kurmayı gerektirir.  Seçime katılma yeterliliği elde eden parti, 22/4/1983 tarihli ve 2820 sayılı Siyasi Partiler Kanununda öngörülen ve parti tüzüğünde belirtilen süreler içinde, bu bentte belirlenen teşkilatlanma yeter sayısı esas alınarak ilçe, il ve büyük kongrelerini üst üste iki defa yapmamış ise seçime katılma yeterliliğini kaybeder. Bu esaslar dairesinde seçime katılabilecek siyasi partiler tespit ve seçimin başlangıç tarihinden on gün, seçimin yenilenmesi halinde yenileme kararının ilanından sonraki beş gün içinde ilan etmek.</template>
        </mvz-bent>
        <mvz-bent no="12.">
          <template>Seçmen Kütüğü Genel Müdürlüğü kuruluş ve işleyişi ve diğer çalışma konuları ile ilgili ilkeleri belirlemek, yönetmelikleri yayınlamak, programlarını yapmak ve denetlemek.</template>
        </mvz-bent>
        <mvz-bent no="13.">
          <template>Yurt Dışı İlçe Seçim Kurulunun oluşturulmasını ve yurt dışında bulunan vatandaşların oy kullanmalarını sağlamak üzere gerekli düzenlemeleri yapmak.</template>
        </mvz-bent>
        <mvz-bent no="14.">
          <template>Yurt dışı seçim iş ve işlemlerinde seçim takvimi süresince Yurt Dışı İlçe Seçim Kurulunun verdiği görevleri yapmak üzere, ihtiyaç görülmesi halinde, Dışişleri Bakanlığının görüşü alınarak bu Bakanlık mensupları arasından en az daire başkanı seviyesinde görevlendirme yapmak.</template>
        </mvz-bent>
        <mvz-bent no="15.">
          <template>Seçim türüne göre sandık bölgesi seçmen sayısını belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="16.">
          <template>Seçim güvenliği açısından gerekli görülmesi durumunda, vali veya il seçim kurulu başkanının oy verme gününden en geç bir ay önce talepte bulunması halinde, o yerdeki sandıkların en yakın seçim bölgelerine taşınmasına, sandık bölgelerinin birleştirilmesine, muhtarlık seçimleri hariç olmak üzere seçim bölgelerinin birleştirilmesi ile seçmen listelerinin karma şekilde düzenlenmesine ve bu hususların ilanına karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="17.">
          <template>Hastalığı veya engeli sebebiyle yatağa bağımlı olan seçmenlerin, muhtarlık seçimleri hariç, oy kullanmalarını sağlamak için seyyar sandık kurulu kurulmasına, oy kullanılmasına, sayım ve döküm ile birleştirme işlemlerine ilişkin usul ve esasları belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="18.">
          <template>Kanunla kendisine verilen başkaca görevleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="İl seçim kurulu">
      <mvz-fıkra no="1">
        <template>İl seçim kurulu bir başkan ve iki asıl üye ile iki yedek üyeden oluşur. İl seçim kurulu başkanı ve asıl üyeleri ile yedek üyeleri, iki yılda bir ocak ayının son haftasında, il merkezinde görev yapan, kınama veya daha ağır disiplin cezası almamış en az birinci sınıfa ayrılmış ve birinci sınıfa ayrılma niteliklerini kaybetmemiş hâkimler arasından, adli yargı ilk derece mahkemesi adalet komisyonunca ad çekme suretiyle tespit edilir. Ad çekmede ilk çıkan hâkim başkan, sonraki iki hâkim asıl ve son çıkan iki hâkim yedek üye olarak belirlenir. Ad çekmeye katılacak hâkim sayısının beşten az olması durumunda, bu hâkimler arasında ad çekme işlemi yapıldıktan sonra eksik kalan asıl ve yedek üyeler en kıdemli hâkimden başlayarak belirlenir. Ad çekmeye katılacak hâkimin bulunmaması durumunda ise başkan ve asıl üyeler ile yedek üyeler en kıdemli hâkimden başlayarak belirlenir. Bu suretle kurulan il seçim kurulu iki yıl süre ile görev yapar. Hâkimlerin kıdemi, 24/2/1983 tarihli ve 2802 sayılı Hâkimler ve Savcılar Kanununun 15 inci maddesine göre belirlenir. Ancak, bu kıdemin belirlenmesinde, kınama veya daha ağır disiplin cezası almış olanlar diğerlerinden kıdemsiz sayılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İl seçim kurulu başkanlığının boşalması halinde asıl ve yedek üyelerden en kıdemli hâkim, il seçim kuruluna başkanlık eder. İl seçim kurulu üyeliklerinde boşalma olması halinde ise birinci fıkradaki usulle boşalan üyelik tamamlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İl seçim kurulu başkanlığı ile asıl ve yedek üyeliklerini ve ilçe seçim kurulu başkanlığını yapacak olan hâkimlerden biri, herhangi bir sebeple bu görevi yapamaz ve o yerde bu görevi yapabilecek başka bir hâkim de bulunmazsa, o yerin bağlı olduğu ağır ceza mahkemesinin yargı çevresi içerisinde bulunan ve görevinden ayrılmasında sakınca görülmeyen bir hâkime, merciince bu yetki verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Eksiklerin, ağır ceza çevresi içerisindeki hâkimlerden tamamlanmasına imkân bulunmayan hâllerde, bu ağır ceza merkezine en yakın ağır ceza mahkemelerinin yargı çevresi içerisindeki hâkimlerden biri, yukarıdaki usûle göre yetki verilerek gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu suretle kendisine yetki verilen hâkimin gelip görevine başlamasına kadar seçim kurulu başkanlığını, kurulun kendi arasından gizli oyla seçeceği bir üye yapar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>İl seçim kurulunun başlıca görev ve yetkileri şunlardır:</template>
        <mvz-bent no="1.">
          <template>İl seçim çevresi içinde seçimin düzenle yürütülmesini sağlamak için gereken bütün tedbirleri almak ve seçim işlerini denetlemek,</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>İlçe seçim kurullarına oy sandıklarını ve bu kanunda yazılı diğer seçim araç ve gereçlerini göndermek,</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>İlçe seçim kurullarının teşekkülüne, işlemlerine ve kararlarına karşı yapılan itirazları inceliyerek derhal karara bağlamak,</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>İlçe seçim kurulları başkanlıklarınca seçim işlerinin yürütülmesi hakkında sorulacak hususları derhal cevaplandırmak,</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>Aday beyanname veya listelerini almak ve ilan etmek, bunlar hakkında yapılacak itirazları incelemek ve bu beyanname veya listelerden kanuna göre muteber olmıyanlar hakkında karar vermek, geçici ve kesin aday listelerini yerlerine göndermek ve ilan etmek,</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>İle bağlı ilçe seçim kurullarından gelen tutanakları birleştirerek il seçim çevresi için bir tutanak düzenlemek,</template>
        </mvz-bent>
        <mvz-bent no="7.">
          <template>Kanunla kendisine verilen başkaca görevleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Siyasi parti temsilcileri">
      <mvz-fıkra no="1">
        <template>Son Milletvekili ve Cumhuriyet Senatosu genel ve ara seçimlerinde kendi listesinden yasama meclislerinden birine seçilmiş en az bir üyeye sahip olan veya 14 üncü maddenin dördüncü bendi gereğince Yüksek Seçim Kurulunca tespit ve ilan edilen siyasi partilerden o il ve ilçede teşkilatı bulunanlar, il ve ilçe seçim kurullarında birer temsilci bulundururlar.  Ayrıca seçime katılan siyasi partilerden, en son yapılan milletvekili genel seçimlerinde en çok oy almış dört siyasi parti ve Türkiye Büyük Millet Meclisinde grubu bulunan siyasi partiler, o siyasi parti genel başkanları tarafından yazılı olarak yetki verilmiş olması şartıyla Yüksek Seçim Kurulunda da bir asıl bir yedek temsilci bulundurabilir. Bu temsilciler kurulun bütün çalışmalarına ve görüşmelerine katılırlar, oy kullanamazlar. Ancak, Yüksek Seçim Kurulunca 14 üncü maddenin onbirinci bendi gereğince yapılan ilandan seçime katılamayacağı anlaşılan veya o seçim çevresinde seçime katılmayan partilerin bu kurullarda temsilci bulundurma hakları sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Görüşülen iş hakkında siyasi partiler temsilcileri görüşlerini bildirirlerse, kurul, bunları da dinledikten sonra, kendi arasında işi görüşerek karar verir ve kararı temsilcilere bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Siyasi parti temsilcilerinin toplantılara katılmamaları, işlerin görüşülmesini durdurmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="İlçe seçim kurulu">
      <mvz-fıkra no="1">
        <template>İlçe seçim kurulu, iki yılda bir ocak ayının son haftasında, bir başkan ile altı asıl ve altı yedek üyeden kurulur ve iki yıl süre ile görev yapar.  İlçelerde, ilçede görev yapan kınama veya daha ağır disiplin cezası almamış en az birinci sınıfa ayrılmış ve birinci sınıfa ayrılma niteliklerini kaybetmemiş hâkimler arasından, merkez ilçelerde ise aynı nitelikleri haiz hâkimler arasından adli yargı ilk derece mahkemesi adalet komisyonunca ad çekme suretiyle belirlenen hâkim, kurulun başkanıdır.  Ad çekmeye katılacak hâkimin bulunmaması durumunda ise en kıdemli hâkim kurulun başkanıdır. Bu kurul asıl üyeleriyle toplanır. Bir asıl üyenin katılmadığı toplantıya, öncelikle o üyenin yedeği çağırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlçe ve merkez ilçe seçim kurulu başkanlığının boşalması halinde, başkan birinci fıkradaki usule göre belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Seçmen sayısı 25 000’i aşan ilçelerde seçim evrakının dağıtım ve toplanması sandık kurul başkanları ve en az bir üyenin eğitimi ile sandık kurullarından sonuçların alınması ve birleştirilerek bağlı olduğu ilçe seçim kuruluna teslim görevini niyabeten yerine getirmek amacıyla geçici ilçe seçim kurulları oluşturulabilir. Bu kurullar bir başkanla altı üyeden oluşur. İl ve ilçe seçim kurullarında görev almış hâkimlerden sonra gelen en kıdemli hâkimler bu kurullara başkanlık eder. Kurulun iki üyesi kurul başkanınca kamu görevlileri arasından belirlenir. Dört üye ise dört yedeği ile birlikte 19 uncu madde esaslarına göre siyasî partilerden alınır. Bu kurulların çalışma usûl ve esasları, kurulacağı ilçeler ile sayısı ve görev süresi Yüksek Seçim Kurulu tarafından kararlaştırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hâkimlerin kıdemi 2802 sayılı Kanunun 15 inci maddesine göre belirlenir. Ancak, bu kıdemin belirlenmesinde, kınama veya daha ağır disiplin cezası almış olanlar diğerlerinden kıdemsiz sayılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="İlçe seçim kurulu üyelikleri">
      <mvz-fıkra no="1">
        <template></template>
        <mvz-bent no="1.">
          <template>İlçe seçim kurulunun dört asıl ve dört yedek üyesi siyasi partilerden alınır. Bu üyeler aşağıda yazılı olduğu gibi belli edilir:</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>İlçe seçim kurulu başkanı, bu kurulun yeniden kurulması için yukarıdaki maddede öngörülen sürenin başında, ilçede teşkilatı bulunan ve son milletvekili genel seçiminde o ilçede en çok oy almış olan dört siyasi partiye birer asıl ve birer yedek üye adını iki gün içinde bildirmelerini tebliğ eder.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Bu işlemle belirlenen veya süresi içinde ad bildiren siyasi parti sayısı dörtten az olduğu takdirde, eksik kalan üyelikler, aynı şartları taşıyan diğer siyasi partilerden, o ilçede aldıkları oyların büyüklük sırasına göre, aynı usulle tamamlanır.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Oylarda eşitlik halinde ad çekilir.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Yukarıdaki hükümlerin uygulanmasına rağmen dört asıl ve dört yedek üyenin tümü belirlenemediği takdirde, 14 üncü maddenin dördüncü bendi gereğince Yüksek Seçim Kurulunun ilan ettiği siyasi partilerden o ilçede teşkilatı bulunanlar tespit edilerek  bunlar  arasında ad  çekilir. Ad çekmedeki sıraya göre, adı çıkan, eksik üyelik sayısı kadar siyasi partinin, yukarıda yazılan usulle bildireceği kimseler ilçe seçim kurulu üyesi olur.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>İlçe seçim kurulunun bu bentte gösterilen üyeliklerinden eksik kalanlar, ikinci bent hükümleri gereğince tamamlanır.</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Diğer iki asıl ve yedek üyelikle yukarıdaki bentte yazılan işlemler sonucunda eksik kalan asıl ve yedek üyelikler, ilçe merkezinde görev yapan ve toplam memuriyet süresi on yıldan fazla olan, yasama meclisleri veya yerel idare seçimlerinden birine siyasi parti adayı veya aday adayı olarak katılmamış ve evvelce hiç bir siyasi partiye kaydolmamış Devlet memurlarını gösteren, o ilçedeki görev süreleri esas alınarak düzenlenecek listenin ilk sekiz sırasında yer alanlar arasından ad çekme ile belli edilir. Ad çekme, birinci bent hükümleri gereğince tespit edilen asıl üyeler huzurunda ilçe seçim kurulu başkanı tarafından yapılır. Ad çekme sırasında, adları önce çıkanlar asıl, sonrakiler sıra ile yedek üye olur. Bu yoldan her asıl üyenin yedeği belirlenir. Ancak, aynı bakanlığa mensup memurlardan birden fazla asıl üye olamaz; zorunlu durumlar saklıdır.</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>İlçe seçim kurulu başkanı, siyasi partiler arasında yapılan ad çekmenin gün ve saatini, ad çekmeye katılan siyasi partilere tebliğ eder.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Görev süresi içinde asıl üyeliklerde vukubulacak boşalmalar, eksilen asıl üyenin yerine kendi yedeği getirilmek suretiyle doldurulur. Yedek üyeliklerdeki eksilmeler, eksilen üyenin niteliğine göre, seçilmesinde uygulanan hükümler gereğince tamamlanır.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>14 üncü maddenin onbirinci bendi gereğince yapılan tespit ve ilandan seçime katılamayacağı anlaşılan veya o seçim çevresinde seçime katılmayan partinin ilçe seçim kurulundaki üyelerinin görevi sona erer. Bu yoldan boşalan üyelikler, o seçim çevresinde seçime katılan ve ilçe seçim kurulunda üyesi bulunmayan partiler hakkında birinci bentte yazılan hükümlerin uygulanmasıyla belirlenir.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>İlçe seçim kurulunda boşalan göreve getirilen kimse, yerine geldiği üyenin süresini tamamlar.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>

        <mvz-bent no="4.">

          <template>Yurt dışı seçmen kütüğüne kayıtlı vatandaşların oy kullanmalarıyla ilgili seçim iş ve işlemlerinin düzenle yürütülmesini sağlamak ve gereken bütün tedbirleri almak.</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Yurt dışı sandık kurullarını kurmak.</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Oy pusulaları ile arkası kendi mührüyle mühürlenmiş oy zarflarını ve diğer seçim araç ve gereçlerini oy verme işleminin başlayacağı günden en geç yedi gün önce Dışişleri Bakanlığı aracılığıyla ilgili yurt dışı temsilciliklerinde hazır bulunacak şekilde göndermek veya gerekli görülmesi halinde oy sandığı, oy verme kabinleri gibi araçların mahallinden teminini Dışişleri Bakanlığından istemek.</template>

        <mvz-bent no="5.">

        <mvz-bent no="6.">

        <mvz-bent no="7.">

        <mvz-bent no="10.">
          <template>Yurt dışı seçmen kütüğüne yazılması için askı süresi içinde yapılan başvuruların kütüğe kaydedilmesine karar verildiği hâlde, kesinleşen yurt dışı seçmen kütüğünde ismi yer almayan seçmenlerin, yurt dışı seçmen kütüğünün kesinleşmesine bakılmaksızın kütüğe ilave edilmelerine karar vermek ve Seçmen Kütüğü Genel Müdürlüğüne göndermek.</template>
        </mvz-bent>
        <mvz-bent no="11.">
          <template>Yurt dışından ağzı mühürlü olarak gelen oy torbalarını genel esaslara uygun bir şekilde yurt içerisinde oy verme süresi bittikten sonra; bir başkan, bir kamu görevlisi üye ve son milletvekili genel seçiminde Türkiye genelinde en çok oy alan üç siyasi partinin bildirdiği bir asil bir yedek üyeden oluşan yeteri kadar sandık kurulu kurmak suretiyle denetimi altında açtırarak sayım ve dökümünü yaptırmak, tutanak tutturmak ve birleştirme işlemlerini yapmak, ayrıca geçici gümrük kapısı seçim kurullarından gelen sonuçları birleştirmek ve Ankara İl Seçim Kuruluna iletmek.</template>

        <template>Sandık kurulu başkanının göreve gelmemesi halinde, kamu görevlileri arasından belirlenen üye, bu üyenin de bulunmaması durumunda en yaşlı üye kurula başkanlık eder.</template>

      </mvz-fıkra>
      <mvz-fıkra no="6">

      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İlçe seçim kurulu başkanı, sandık kurulunun kalan bir asıl ve bir yedek üyesini belirlemek için önce, 22 nci maddenin birinci fıkrası uyarınca bildirilen listeden sandık kurulu başkanı olarak belirlenmeyenler arasından, ihtiyaç duyulan sandık kurulu üye sayısının iki katı kamu görevlisini ad çekme suretiyle tespit eder ve bu kişilerden mani hali bulunmayanları sandık kurulu asıl ve yedek üyesi olarak belirler.</template>

      <mvz-fıkra no="8">
        <template>Yukarıdaki fıkralar gereğince belirlenen sandık kurulu asıl üyelerinden göreve gelmeyenin yerine, öncelikle, gelmeyen üyenin yedeği alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Sandık kurulu başkan ve üyelikleri için ad çekme işlemleri, ilçe seçim kurulu huzurunda, bu kurulun başkanı tarafından yapılır.</template>

      <mvz-fıkra no="10">

    <mvz-madde no="27" başlık="And içme">
      <mvz-fıkra no="1">
        <template>Yüksek Seçim Kurulu, il ve ilçe seçim kurulları başkan, asıl ve yedek üyeleri, görevlerine başlamadan önce, kurul önünde birer birer şöyle and içerler:</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>“Hiçbir tesir altında kalmaksızın, hiç kimseden korkmadan, seçim sonuçlarının tam ve doğru olarak belirmesi için görevimi kanuna göre, dosdoğru yapacağıma namusum, vicdanım ve bütün mukaddesatım üzerine and içerim.”</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Seçim Öncesi İşleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Seçmen Kütükleri">
      <mvz-madde no="28" başlık="Tanımlar:">
        <mvz-fıkra no="A">
          <template>(Mülga)</template>
        </mvz-fıkra>
        <mvz-fıkra no="B">
          <template>Tanımlar:</template>
          <mvz-bent no="1.">
            <template>Bu Yasaya göre seçmen olan vatandaşları tek olarak tanımlayan ve seçmenin oturduğu yeri belirleyen bilgileri kapsayan bilgisayar ortamına "Seçmen Kütüğü" denilir.</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Seçmen Kütüğü, Yüksek Seçim Kuruluna bağlı olarak kurulan Seçmen Kütüğü Genel Müdürlüğü tarafından, bu Yasaya uygun olarak tasarlanacak, planlanacak, Yönetilecek ve yürütülecek çalışmalarla elde edilir.</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Bir seçmene ait ve seçmeni tanımlamak için kullanılan; adı, soyadı, doğum yılı ve doğum yeri gibi kayıtların her birine "Veri" denilir.</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Bir seçmeni tek olarak tanımlayan verilerin bütününe "Seçmene Ait Bilgi" denilir.</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Seçmenin devamlı oturduğu konutun bulunduğu ilçe, muhtarlık, sokak isimleri ile binanın kapı ve varsa daire numarası "Seçmenin Adresi" dir.</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Her seçmen; seçmen kütüğü sıra numarası, adı, soyadı, ana ve babasının adı, doğduğu ilçe, doğum yılı ile belirlenir ve tanımlanır.</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>Seçmen kütüğündeki bilgilerin; bu Kanunda yazıldığı şekilde değiştirilmesi, düzeltilmesi ve tamamlanmasına Seçmen Kütüğünün "Güncelleştirilme" si denilir.</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>Bu Kanuna göre seçmen olup, yurt dışında bulunan vatandaşların adres kayıt sistemindeki bilgilerine dayalı olarak oluşturulan bilgiler topluluğuna "Yurt Dışı Seçmen Kütüğü" denilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>

        <mvz-fıkra no="4">

        <mvz-fıkra no="9">
          <template>Seçim müdürlükleri için öncelikle adliye ve hükümet konaklarında yeterli nitelikte yer ayırmakla Cumhuriyet Başsavcıları ile mülki amirler görevlidir.</template>

      <mvz-madde no="31" başlık="Devamlı veya geçici personel ve görevlendirme yetkisi">
        <mvz-fıkra no="1">
          <template>Mülga</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="Yüksek seçim kurulunun kararlarının bağlayıcılığı">
        <mvz-fıkra no="1">
          <template>Seçmen kütüğünün kurulması, güncelleştirilmesi ve bundan elde edilecek liste, çizelge ve diğer malzemenin gerekli yerlere ulaştırılması ve dağıtılması için, Yüksek Seçim Kurulunca alınacak kararlar bütün kamu kuruluşlarını ve görevlilerini bağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yazım ve denetleme işlerinde görevlendirileceklerin ödev ve yetkileriyle yazım hazırlıkları, yazım ve denetimin yapılış ve yazım ve denetim formlarının şekilleri ve bunların ne gibi bilgileri taşıyacağı, ne suretle doldurulacağı, yazımda, denetlemede ve sürekli ara çalışmalarda ne cins evrak kullanılacağı, evrakın teslimi, yazımın denetlenmesi ilke, yöntem ve kuralları Yüksek Seçim Kurulunca belirtilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="33" başlık="Seçmen kütüğü düzenlenmesi">
        <mvz-fıkra no="1">
          <template>Seçmen kütüğü; adres kayıt sistemindeki yerleşim yeri adresi bilgileri esas alınarak Yüksek Seçim Kurulunca belirlenecek usul ve esaslara göre her yıl yeniden düzenlenir, sürekli bilgi toplama ile her seçim döneminde güncelleştirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Düzenleme, sürekli güncelleştirme ve genel denetleme kural, yöntem ve teknikleriyle Seçmen Kütüğü Genel Müdürlüğünün bilgi işlem; ilke, kural ve yöntemleri Yüksek Seçim Kurulunca düzenlenecek genelge ile belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yazım ve denetlemede toplanan bilgileri, seçmene ait bilgilerin verilerindeki değişimleri belirleyen ad, soyad, yaş, cinsiyet tashihi, seçme ehliyetini kaybetme, (kısıtlanma, kamu hizmetinden yasaklanma) veya yeniden kazanma gibi yargı kararlarına, vatandaşlıktan ıskat veya yeniden vatandaşlık hakkını kazandığını gösteren bilgiler ile vefat ettiğini tespit eden bilgilere seçim bölgesi içinde ve dışında vukubulan ikametgah değişikliklerine ait verilere, Yüksek Seçim Kurulunun belirleyeceği kural ve yönteme uygun olarak toplanacak diğer belgelere dayanılarak, seçmen kütüğü kurulur ve güncelleştirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>18/1/1984 tarihli ve 2972 sayılı Mahalli İdareler ile Mahalle Muhtarlıkları ve İhtiyar Heyetleri Seçimi Hakkında Kanun uyarınca yapılacak mahalli idareler genel seçiminde, birinci fıkra gereğince yerleşim yeri adresine göre oluşturulan seçimin başlangıç tarihinden üç ay önceki seçmen kütüğü üzerinden güncelleme işlemleri yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="34" başlık="Kütüğe yazılma esasları">
        <mvz-fıkra no="1">
          <template>Seçmenlik sıfatının tayininde esas, seçmen kütüğüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Seçmen kütüğünde; seçmenin; adı, soyadı, baba adı, ana adı doğum yılı, doğduğu ilçe adı, oturduğu yer adresi bulunması esastır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunun uygulanmasında herkes, nüfus kütüğünde yazılı bulunan doğduğu ay ve güne göre işleme tabi tutulur. Ancak, o yıl seçim yapılması durumunda seçmen listeleri hazırlanırken on sekiz yaşın doldurulmuş olmasının hesabında seçim günü (o gün dahil) esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Seçmene ait bilgi eksik ise; bilgi tamamlanıncaya kadar seçmen, sandık seçmen listesine yazılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Tamamlama kuralları; Yüksek Seçim Kurulunca belirlenir ve yayınlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Sandık bölgesinde oturan seçmenlere ait bilgileri kapsayan sandık seçmen listeleri seçmen kütüğünden çıkarılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Sandık seçmen listesinde yazılı olmayan seçmen oy veremez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Seçmen kütüğüne seçmen bir kez yazılır ve birden fazla oy kullanamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Yazım, görevlilerin insan oturan yerleri birer birer gezip seçmenleri görmeleri suretiyle yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Yazım memuru yazım sırasında, yazım yerinde bulunan seçmeni yazar. Seçmenin bildireceği oturduğu yerin adresi yazılır. Seri numaralı yazım formu her seçmene imzalatılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35" başlık="Yurt dışı seçmen kütüğü ve seçmen listeleri">
        <mvz-fıkra no="1">
          <template>Yurt dışı seçmen kütüğü, adres kayıt sistemindeki yerleşim yeri adresi bilgileri esas alınarak Yüksek Seçim Kurulunca belirlenecek usul ve esaslar çerçevesinde oluşturulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yurt dışı seçmen listeleri,  yurt dışı seçmen kütüğü esas alınarak Yüksek Seçim Kurulunca oluşturulur ve elektronik ortamda ilan edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="36" başlık="Genel yazım ve denetleme">
        <mvz-fıkra no="1">
          <template>Seçmen kütüğü; adres kayıt sistemindeki bilgiler esas alınarak her yıl güncelleştirilerek oluşturulur.  Kütük düzenlemesi nedeniyle seçmen hiçbir şekilde oy kullanma hakkından yoksun bırakılamaz. Adresi kapanmış olması sebebiyle adres kayıt sisteminde görünmeyenler, Nüfus ve Vatandaşlık İşleri Genel Müdürlüğünün adres kayıt sisteminde bulunan en son geçerli adres kayıt bilgileri kapsamında seçmen kütüğüne kaydedilirler. Gerektiğinde, seçmen kütüğünün dört yılda bir yeniden düzenlenmesi ve iki yılda bir denetlenmesi için gerekli bilgileri toplamak amacıyla, bütün Türkiye’de aynı zamanda Nisan ayının ikinci pazar günü yazım yapılmasına Yüksek Seçim Kurulunca karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yazım günü, saat 05.00'ten itibaren yazımın bittiği alışılmış araçlarla ilan edilinceye kadar görevlilerden başka kimselerin bulundukları yerden ayrılmaları yasaktır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ancak yazım ve denetim işleminin her halde aynı gün saat 19.00 a kadar bitirilmiş olması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yüksek Seçim Kurulu, kütüğün düzenlenmesi ve yazım sırasında, bu Kanunda öngörülen gereklere göre genelgelerle belirteceği diğer yöntem, teknik ve kuralları uygular.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yüksek Seçim Kurulunun bu Kanunun 14 üncü maddesinin dördüncü fıkrasına göre ilan edeceği siyasi parti ilçe başkanları, yazım memurunun yanına bir temsilci verebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Temsilci isimleri, ilçe seçim kurulunun isteği üzerine bildirilen sürede liste halinde teslim edilir. İsimleri bildirilen siyasi parti temsilcileri ilçe seçim kurulu başkanlığından aldıkları belge ile temsilcilik görevini yaparlar. Bu listedeki isimler ve görev yerleri sonradan değiştirilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Seçmen kütüğü yazımı sırasında, seçmenin oyunu kullanmasını engelleyecek bir engelliliği varsa, forma kaydedilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="Yazımda esas bilgi kaynakları">
        <mvz-fıkra no="1">
          <template>Seçmen kütüğü yazımı sırasında, formlara yazılacak bilginin tespitinde resmi belgeler esas tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yazım sırasında 38 inci maddeye göre düzenlenmiş kroki ve cetvelden yararlanılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Seçmenin devamlı oturduğu adresin tespitinde muhtarlıkların, varsa apartman yöneticilerinin kayıtlarından faydalanılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="Muhtarlık krokisi ve binalar cetveli">
        <mvz-fıkra no="1">
          <template>Şehir ve kasabalarda, ilçe seçim kurulu başkanının denetlemesi altında belediyeler, her muhtarlık için, iki yılda bir "Muhtarlık Krokisi" düzenlemek zorundadırlar.</template>
          <mvz-bent no="A">
            <template>Krokide:</template>
            <mvz-altbent no="1">
              <template>Muhtarlık sınırları ile, bu sınırlar içindeki sokakların adları ve her sokağın baş ve sonundaki binaların numaraları.</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Muhtarlık, sokaklara ayrılmamış dağınık yapılardan ibaret ise, bu dağınık yapılar numaraları ile birlikte, okunaklı şekilde gösterilir.</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="B">
            <template>Köylerde ve kroki yapılmasına teknik imkan bulunmayan şehir ve kasabalarda kroki yerini tutmak üzere, her muhtarlık için Binalar Cetveli düzenlenir.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Binalar Cetveli ilçe seçim kurulu başkanının denetimi altında, şehir ve kasabalarda belediyelerce, köylerde muhtarlıklarca yapılır.</template>
          </mvz-bent>
          <mvz-bent no="C">
            <template>Muhtarlıkta, numarası olmayan ve içinde insan oturan yerler bulunduğu takdirde, bu yerler numaralanır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıda (B) bendinde yazılı Binalar Cetveli, (C) bendinde numarasız yerlerin numaralanması işlemi, İstatistik Genel Müdürlüğünün Numaralama Yönetmeliği esaslarına göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Muhtarlık krokisi ve binalar cetveli, yıl sonu durumunu gösterecek şekilde düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yukarıdaki madde gereğince, her muhtarlık için düzenlenen kroki veya binalar cetvelinin onaylı birer örneği, ilçe seçim kurulu başkanı tarafından 14 üncü maddenin dördüncü fıkrasına göre ilan edilen siyasi partilerin ilçe başkanlıklarına, her iki yılda bir, Yüksek Seçim Kurulunun belirleyeceği ayda alındı belgesi karşılığı verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="Muhtarlık bölgesi askı listesi">
        <mvz-fıkra no="1">
          <template>Seçmen kütüğündeki yanlışların düzeltilmesi ve eksiklerin tamamlanması amacıyla;</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Seçmen kütüğünde yazılı adreslere göre aynı muhtarlıkta oturan ve seçmen kütüğünde yazılı seçmenlerin; seçmen kütüğü numarası, adı ve soyadı, ana ve baba adı, doğum yılı, doğum yeri, adresi yazılı olduğu ve seçmen soyadı alfabe sırasına göre sıralanmış listeye "Muhtarlık Bölgesi Askı Listesi" denir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Muhtarlık bölgesi askı listesi her yıl sonundaki kesinleşmiş mevcut bilgilere dayanılarak seçmen kütüğünden elde edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Muhtarlık bölgesi askı listesi; her yıl mart ayında;</template>
          <mvz-bent no="1.">
            <template></template>
            <mvz-altbent no="a">
              <template>Ait olduğu muhtarlığa iki nüsha,</template>
            </mvz-altbent>
            <mvz-altbent no="b">
              <template>14 üncü maddenin dördüncü fıkrasına göre ilan edilen siyasi partilerin o ilçedeki ilçe başkanlarına bir nüsha,</template>
            </mvz-altbent>
            <mvz-altbent no="c">
              <template>İlçe seçim kurulu işlerinde kullanılmak üzere iki nüsha ilçe seçim kurulu başkanlıklarına,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>İşlemlerde kullanılmak üzere bir nüsha il seçim kurulu başkanlıklarına,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Gönderilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="40" başlık="Askı zamanı ve süresi">
        <mvz-fıkra no="1">
          <template>Muhtarlık bölgesi askı listesi, seçim dönemlerinde muhtarlıklarda askıya çıkarılır ve iki hafta süreyle askıda kalır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Muhtarlık bölgesi askı listeleri, ait oldukları mahalle veya köylerde, halkın kolaylıkla görüp okuyabileceği yerlere asılır. Bunların asıldıkları tarih ve yerler, seçim bölgelerinin ayrıldığı sandık bölgelerini gösteren cetvel ile birlikte, mahalli gazetelerle ve ayrıca alışılmış araç ve usullerle ilan edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Listelerin hangi tarihlerde ve nerelere asıldığı, ilanın ne suretle yapıldığı, ilçe seçim kurulu başkanı tarafından görevlendirilen kimselerce bir tutanakla tespit olunur. Listelerin askıdan indirildiği tarih de ayrı bir tutanakla tespit edilir. Bu tutanaklar, ilçe seçim kurulu başkanı tarafından ayrı bir dosyada saklanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İlçe seçim kurulu başkanı, askı listelerinin asıldıkları tarih ve yerleri bir yazı ile mahallin mülki amirine derhal bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Asılı kaldıkları sürece, muhtarlık bölgesi askı listelerinin korunmasından; idare amirleriyle zabıta amir ve memurları sorumludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">

      <mvz-madde no="62" başlık="Matbua dağıtımı">
        <mvz-fıkra no="1">
          <template>El ilanı mahiyetindeki matbuaları dağıtacak kimselerin seçme yeterliğini haiz olmaları şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Devlet, katma bütçeli idareler, il özel idareleri, belediyelerle bunlara bağlı daire ve müesseseler, İktisadi Devlet teşekkülleri ve bunların kurdukları müesseseler ve ortaklıkları ile diğer kamu tüzel kişiliklerinde memur ve hizmetli olarak çalışanlar, ilan dağıtamazlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="63" başlık="Seçim süresince yapılamıyacak işler">
        <mvz-fıkra no="1">
          <template>62 nci maddede sayılanlarla, umumi menfaatlere hadim cemiyetler ve bunlarda görev almış bulunan memur ve hizmetliler seçimlerde de tarafsızlıklarını muhafaza etmek zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıda yazılı olanların, 5830 sayılı kanunda yazılı yasak hükümleri saklı kalmak üzere seçim süresince:</template>
          <mvz-bent no="a">
            <template>Siyasi partilere veya adaylara her ne nam ile olursa olsun bağış ve yardımlarda bulunmaları,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Memur ve hizmetlileriyle her türlü araç ve gereç ve imkanlarını siyasi bir partinin veya adayın emrinde veya her hangi bir siyasi faaliyette çalıştırmaları, kullanmaları veya kullandırmaları yasaktır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci fıkrada yazılı olanlarla, Bankalar Kanununa tabi teşekküllerin, siyasi bir partinin lehinde veya aleyhinde veya vatandaşın oyuna tesir etmek maksadiyle her türlü yayınlarda bulunmaları yasaktır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Daha önce basılmış ve yayınlanmış ve yukarıki fıkradaki mahiyeti taşıyan her türlü kitap, broşür, afiş ve bunlara benzer yayınlar da aynı hükme tabidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="64" başlık="Törenlere ait yasaklar">
        <mvz-fıkra no="1">
          <template>Seçim propagandasının başlangıç tarihinden oy verme gününü takip eden güne kadar olan süre içinde, 62 nci maddede sayılı bütün daire, teşekkül ve müesseselerle Bankalar Kanununa tabi teşekküllere ait kaynaklardan yapılan iş ve hizmetler dolayısıyla,  törenler tertiplemek, nutuklar söylemek, demeçler vermek ve bunlar hakkında her türlü vasıtayla yayınlarda bulunmak yasaktır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="65" başlık="Bakanlara ilişkin yasaklar">
        <mvz-fıkra no="1">
          <template>Seçim propagandasının başlangıç tarihinden oy verme gününü takip eden güne kadar olan süre içinde  bakanlarla, milletvekilleri, yurt içinde yapacakları seçim propagandası ile ilgili gezileri makam otomobilleri ve resmi hizmete tahsis edilen vasıtalarla yapamazlar. Bu maksatla yapacakları gezilerde, protokol icabı olan karşılama ve uğurlamalarla törenler yapılamaz ve resmi ziyafet verilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıda yazılı süre içinde  Bakanlar seçimle ilgili faaliyetlerinde ve konuşmalarında bu kanun hükümleriyle bağlıdırlar.</template>

      </mvz-madde>
      <mvz-madde no="66" başlık="Memurların gezilere katılma yasağı">
        <mvz-fıkra no="1">
          <template>Seçim propagandasının başlangıç tarihinden oy verme gününü takip eden güne kadar geçen süre içinde  bakanlar, milletvekilleri ve adayların seçim propagandası ile ilgili olarak yapacakları gezilere hiç bir memur katılamaz.</template>

    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Araçlar">
      <mvz-madde no="67" başlık="Araçların sağlanması">
        <mvz-fıkra no="1">
          <template>Seçim kurulu başkanları, seçim için gerekli bütün araçları ve parayı zamanında ve muntazam bir surette sağlamak ve yerlerine göndermekle yükümlüdürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu hususlarda kurul başkanlarının emirleri üzerine zabıta amir ve memurları, belediyeler ve muhtarlıklar gerekli yardımlarda bulunmak zorundadırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="68" başlık="Oy verme araçları ve teslimi">
        <mvz-fıkra no="1">
          <template>Oy sandıkları, eni 40, boyu 55, yüksekliği 50 santimetre, şeffaf, ısıya ve kırılmaya dayanıklı sert plastikten mamûl, kapağı iple bağlanıp mühürlenmeye elverişli ve kapağının üzerinde zarfların atılmasına uygun  bir açıklık olacak şekilde yaptırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birlikte yapılan Cumhurbaşkanı ve milletvekili seçimlerinde, oy pusulaları aynı zarfa konulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Seçimlerde kullanılacak oy verme kabinleri, oy vermenin gizliliğini sağlayacak şekilde yaptırılır. Kabinlerin ölçü ve standartları Yüksek Seçim Kurulunca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sandıkların ve oy kabinlerinin üzerinde Yüksek Seçim Kurulu ibaresi ve logosu bulunur. Yüksek Seçim Kurulu zorunlu hallerde, bu maddenin amacına uygun biçimde oy sandıklarının standartlarında gerekli değişiklikleri yapabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Seçimlerde kullanılacak mühür, mürekkep ve ıstampayı oyların iptaline yol açmayacak şekilde oluşturmaya Yüksek Seçim Kurulu yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Yüksek Seçim Kurulu Başkanlığı; il, ilçe seçim kurulları ile sandık kurulları mühürlerini,  ve seçim işleri için mahallerinde sağlanamayan gerekli her çeşit kırtasiye ve gereçleri zamanında il ve ilçe seçim kurulları başkanlıklarına gönderir ve o seçimde hangi malzemenin sandık kurulu başkanlarına teslim edileceğini belirler.35</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>İl seçim kurulu başkanları, oy verme gününden en az on gün önce ilçe seçim kurulları başkanlıklarına, ilçe seçim kurulu başkanları da oy verme gününden en az kırksekiz saat önce, aşağıda yazılı eşyadan o seçim için gerekli olanlarını sandık kurulları başkanlarına teslimini sağlarlar.</template>
          <mvz-bent no="1.">
            <template>Seçim bölgesinde her sandık için ağzı mühürlü bir kese içine konulmuş numaralı bir mühür, (Hangi sandığa, hangi numaralı mühürün verildiği bir tutanağa geçirilir.)</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Her seçim bölgesinde bulunacak kapalı oy verme yerleri sayısı toplamına eşit miktarda çevre adaylarının onaylı listesi ile 76 ncı maddede yazılı levha,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>İlçe seçim kurulu mühürü ile mühürlenmiş ve oy pusulalarının konulmasına mahsus zarfları havi bir paket,</template>

          <mvz-bent no="4.">
            <template>Oy sandıkları,</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Sandık sayısınca ıstampa ve mürekkebi,</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Sandık sayısınca örneğine uygun onaylı tutanak defteri,</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>Örneğine uygun basılı sayım cetvelleri,</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>Örneğine uygun basılı tutanak kağıtları,</template>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>Sandık sayısınca boş torba,</template>
          </mvz-bent>
          <mvz-bent no="10.">
            <template>Uygun sayıda kopya kalemi,</template>
          </mvz-bent>
          <mvz-bent no="11.">
            <template>Gerektiği takdirde oy verme yeri inşaası için malzeme,</template>
          </mvz-bent>
          <mvz-bent no="12.">
            <template>O seçim çevresinde, seçimin özelliğine göre yeteri kadar beyaz boş kağıt ve gerekli başka eşya,</template>
          </mvz-bent>
          <mvz-bent no="13.">
            <template>Her yaprağı ilçe seçim kurulu tarafından mühürlü ve sonu onaylı, iki nüsha sandık seçmen listesi,</template>
          </mvz-bent>
          <mvz-bent no="14.">
            <template>Siyasi partiler tarafından kapalı oy verme yerlerine konulmak üzere ilçe seçim kurulu başkanına teslim edilmiş bulunan basılı oy pusulaları,</template>
          </mvz-bent>
          <mvz-bent no="15.">
            <template>Her bağımsız adayın, yalnız kendi ad ve soyadını taşıyan, ilçe seçim kurulu başkanına teslim edilmiş bulunan oy pusulaları,</template>
          </mvz-bent>
          <mvz-bent no="16.">
            <template>Üstü ilçe seçim kurulunca mühürlü ve numaralı birleşik oy pusulası paketi,</template>
          </mvz-bent>
          <mvz-bent no="17.">
            <template>Her sandık için "Evet" yazılı mühür,</template>
          </mvz-bent>
          <mvz-bent no="18.">
            <template>(Mülga)</template>

      <mvz-madde no="69" başlık="Tutanak defteri">
        <mvz-fıkra no="1">
          <template>Her kurulda bir tutanak defteri bulunur. İl seçim kurulları, kendi tutanak defterlerini; ilçe seçim kurulları da kendi kurullarına ve sandık kurullarına ait tutanak defterlerini, sahifelerini numaralamak ve mühürlemek suretiyle onaylarlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
