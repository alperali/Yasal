  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Seçim Günü İşleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Sandık Başı İşleri">
      <mvz-madde no="70" başlık="Andiçme">
        <mvz-fıkra no="1">
          <template>Sandık kurulu başkan ve üyeleri, oy verme günü göreve başlamazdan önce, ilk iş olarak, sandık başında, sandık kurulu ve hazır bulunanlar önünde birer birer şöyle and içerler:</template>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>“Hiçbir tesir altında kalmaksızın, hiç kimseden korkmadan, seçim sonuçlarının tam ve doğru olarak belirmesi için, görevimi kanuna göre dosdoğru yapacağıma, namusum, vicdanım ve bütün mukaddesatım üzerine and içerim.”</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="71" başlık="Görev ve yetkiler">
        <mvz-fıkra no="1">
          <template>Sandık kurullarının başlıca görev ve yetkileri şunlardır:</template>
          <mvz-bent no="1.">
            <template>Sandık çevresinde seçimin düzenle geçmesi için gereken tedbirleri almak ve oy verme işlerini yürütmek ve denetlemek,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>İlçe seçim kurulunca belirlenen bina, yapı ve benzeri yerlerde, sandığın konulacağı yeri tayin etmek ve sokak başlarına bu yeri göze çarpacak surette gösterir işaretleri koymak veya alışılmış araçlar ile duyurmak,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Oy verme işleri hakkında ileri sürülecek itirazları incelemek ve bir karara, bağlamak ve kararlarını tutanak defterine geçirerek altını imzalamak,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Bu kararlardan itiraza uğrayanları derhal ilçe seçim kuruluna göndermek,</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Bu kanundaki esaslara göre sandığa atılmış olan oy pusulalarını saymak, dökümlerini ve sonuçlarını tutanağa geçirmek ve bunları seçim işlerine ait diğer evrak ile birlikte, derhal ilçe seçim kuruluna teslim etmek,</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Kendisine kanunla verilen başkaca görevleri yapmak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="72" başlık="Müşahitler">
        <mvz-fıkra no="1">
          <template>Siyasi partilerin müşahitleri ile adayları ve bağımsız adaylarla müşahitleri, sandıkbaşı işlemlerini takip etmek üzere hazır bulunabilirler. Bağımsız aday müşahitleri üçten fazla olursa, sandık kurulu başkanı bunlar arasında ad çeker. Adları ilk çıkan üç müşahit, sandık başında bırakılır. Diğerleri, sandık çevresi dışında kalabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="73" başlık="Kurulda çoğunluğun sağlanması">
        <mvz-fıkra no="1">
          <template>Sandık başında, oy verme başlamazdan önce veya oy verme sırasında, sandık kuruluna dahil siyasi parti üyelerinden biri veya birkaçı görevini yapmazsa, ceza hükümleri saklı kalmak üzere, yerine siyasi parti yedek üyelerinden biri getirilir. Bu dahi mümkün olmaz ve kurul üyeleri üçten aşağı düşerse, bu cihet tutanağa geçirilir ve eksikler, o seçim bölgesinde seçme yeterliğini haiz ve okur-yazar olanlar arasından, başkanın seçeceği kimselerle doldurulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="74" başlık="Sandığın konulacağı yer">
        <mvz-fıkra no="1">
          <template>Sandıkların konulacağı yerleri ve oy verme işinin vaktinde sona ermesi için gerekli tedbirleri ilçe seçim kurullarının denetiminde sandık kurulu tespit eder. Sandıkların konulacağı yerlerin belirlenmesinde seçmenin oyunu kolaylıkla, serbestçe ve gizli şekilde verebilmesi gözetilir. Engelli seçmenlerin oylarını rahatlıkla kullanabilmeleri için gerekli tedbirler alınır. Sandıklar okul (özel okullar ve özel dersaneler dahil) avlusu ve salonların elverişli kısımları gibi genel yerlere, yetmediği takdirde kiralanacak kahvehane, lokanta gibi yerlere konur. Kışla, karargah, ordugah gibi askeri bina ve tesislerle karakollara ve parti binalarına, muhtarlık odalarına sandık konulamaz. Üçten fazla sandık konulan binalarda bina sorumlularının görev esasları Yüksek Seçim Kurulunca belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="75" başlık="Kapalı oy verme yeri">
        <mvz-fıkra no="1">
          <template>Sandık kurulları, oy serbestliğini ve gizliliğini sağlayacak şekilde, yeteri kadar kapalı oy verme yeri hazırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Seçmen, oy pusulasını kapalı oy verme yerinde, kendi eliyle katlayıp, zamklı kenarını yapıştırmak, veya zarf kullanılan seçimlerde zarfa koyup kapatmak zorundadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="76" başlık="Oy verme yerinin nitelikleri">
        <mvz-fıkra no="1">
          <template>Kapalı oy verme yeri; içerisi dışardan gözetlenemeyecek ve oy pusulasını seçmenin inceleyip zarflıyabileceği şekil ve nitelikte olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Aday listeleri ve bu kanunun oy verme serbestliğine ve gizliliğine dair hükümlerinin levha halinde basılmış metni, kapalı oy verme yerinde asılı durur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kapalı oy verme yerinde masa veya benzeri bir şey bulundurulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="77" başlık="Sandığın, birleşik oy pusulalarının ve zarfların kurulca mühürlenmesi">
        <mvz-fıkra no="1">
          <template>Sandık kurulu başkanı, oy verme işlerine başlamadan önce, sandığın boş olduğunu hazır bulunan sandık kurulu üyeleri ile müşahitler önünde tespit ederek sandığı kapatır, mühür bozulmadan açılamıyacak şekilde sandık mühürü ile mühürler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birleşik oy pusulası kullanılan seçimlerde, (Katlanıp zamklı kenarı yapıştırılarak kapatılmak suretiyle zarf haline getirilen birleşik oy pusulaları) bu Kanunda "zarf" deyimi geçen hallerde zarf olarak kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Şu kadar ki, zarflar için öngörülen çift mühür bulunmasına ilişkin hükümler birleşik oy pusulalarına uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sandık kurulu, and içme, sandığı yerleştirme, kapalı oy verme yerini düzenleme işlerini bitirdikten sonra, hazır bulunanlar önünde, birleşik oy pusulalarını sayar, her birinin üzerine, sandık kurulu mühürünü basar, böylece üzerinde sandık kurulunun mühürü bulunan birleşik oy pusulalarının sayısını tesbit eder. Birleşik oy pusulası kullanılmayan seçimlerde, ilçe seçim kurulu başkanından teslim alınan ve ilçe seçim kurulu başkanlığı mühürünü taşıyan özel zarfları sayar, her birinin üzerine sandık kurulu mühürünü basar, böylece üzerinde biri ilçe seçim kurulunun, diğeri sandık kurulunun mühürleri bulunan çift mühürlü özel zarfların sayısını tespit eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sandık kurulu, bu madde gereğince yaptığı işlemleri tutanak defterine geçirip imzalar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="78" başlık="Birleşik oy pusulası ve zarflar">
        <mvz-fıkra no="1">
          <template>Cumhurbaşkanı, milletvekili, il genel meclisi üyeliği, belediye meclisi üyeliği ve belediye başkanlığı seçimlerinde, bu Kanun ve özel kanunlarında yer alan hükümlere göre filigranlı kağıttan hazırlanacak birleşik oy pusulaları kullanılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Oy zarfları, ön yüzünün sol üst köşesinde Türkiye Cumhuriyeti Yüksek Seçim Kurulu amblemi yer alacak şekilde Yüksek Seçim Kurulunca filigranlı kağıttan hazırlatılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Yasaklar ve Sandık Başı Düzeni">
      <mvz-madde no="79" başlık="İçki ve silah taşıma yasağı">
        <mvz-fıkra no="1">
          <template>Oy verme günü, her ne suretle olursa olsun, ispirtolu içki satılması, içkili yerlerle umumi mahallerde her çeşit ispirtolu içki satılması, verilmesi, içilmesi yasaktır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Oy verme günü, bütün umumi eğlence yerleri oy verme süresince kapalı kalır. Eğlence yeri niteliğini haiz lokantalarda yalnız yemek verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Oy verme günü, emniyet ve asayişi korumakla görevli olanlardan başka hiçbir kimse, köy, kasaba ve şehirlerde silah taşıyamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunun uygulanmasında silahtan maksat Türk Ceza Kanununun 6 ncı maddesinin birinci fıkrasının (f) bendinin (1), (2), (3) ve (5) numaralı alt bentlerinde gösterilenlerdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="80" başlık="Yayın yasağı">
        <mvz-fıkra no="1">
          <template>Seçim günü saat 18 e kadar radyolar ve her türlü yayın organları tarafından seçim ve seçim sonuçları ile ilgili haber, tahmin ve yorum yapılması yasaktır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Saat 18 ile 21 arasında ancak radyolarda Yüksek Seçim Kurulu tarafından seçim ile ilgili olarak verilecek haber ve tebliğler yayınlanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Saat 21 den sonra bütün yayınlar serbesttir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="81" başlık="Sandık çevresi">
        <mvz-fıkra no="1">
          <template>Sandık çevresi, oy sandığının konulduğu ve sandık kurulunun görev yaptığı oda, bölüm veya bu amaçla oluşturulan yerdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="82" başlık="Sandık çevresinde düzenin sağlanması ve yasaklar">
        <mvz-fıkra no="1">
          <template>Sandık çevresinde düzenin sağlanması sandık kurulu başkanına aittir. Sandık çevresinde alınacak tedbirler, o sandık çevresinde bulunma hakkına sahip kimselerin seçim iş ve işlemlerini takip etmelerini engelleyecek mahiyette olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sandık çevresinde, sandık kurulu başkan ve üyeleri, adaylar, milletvekilleri, o sandık bölgesinde kayıtlı seçmenler ve o sandıkta görevli müşahitler ile bina sorumluları ve çağrı veya ihbar üzerine gelen görevli kolluk güçlerinden başka kimse bulunamaz. Şu kadar ki, siyasi partilerin seçim kurullarına bildirdikleri itiraza yetkili kişiler ile temsilciler, seçim kurullarınca önceden kendilerine verilen belge ile sandık çevresinde bulunabilirler. Medya mensuplarının sandık çevresinde, sandık başı işlemlerine engel olmamak şartıyla, haber amacıyla görüntü ve bilgi elde etmeleri serbesttir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sandık çevresinde seçmenin oyunu tam bir serbestlikle ve gizli şekilde kullanmasına veya sandık kurulunun görevini yapmasına engel olmaya kalkışanlar ile oy verme, oyların sayım ve dökümü veya tutanaklara geçirilmesi gibi tüm sandık başı iş ve işlemlerinin düzenini bozmaya kalkışanları, başkan uyarır. Bu uyarının gereğini yerine getirmeyen kimse, kolluk gücü çağrılarak sandık çevresinden uzaklaştırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sandık kurulu başkanının bu maddede belirtilen görevini yapmaması halinde, sandık kurulu karar alarak ilgili hakkında yukarıda belirtilen yetkiyi kullanır ve durumu derhal ilçe seçim kurulu başkanına bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sandık çevresinde cebir, şiddet veya tehdit kullanarak sandık başı düzenini bozmaya kalkışanlar, sandık kurulu başkanı veya üyelerinden biri tarafından yapılan çağrı ya da seçmenlerin ihbarı üzerine gelen kolluk güçlerince derhal sandık çevresinden uzaklaştırılır ve gerekli yasal işlem yapılır. Seçmenlerce ihbar, o yer kolluk güçlerine şahsen yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Ceza infaz kurumları ve tutukevlerinde, yukarıda sayılan tedbirlere uymayanlar, cezaevi idaresinin görüşü alındıktan sonra, güvenliği zayıflatmayacak şekilde uygulama yapılarak, sandık çevresinden dışarı çıkarılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu madde uyarınca çağrılacak kolluk güçleri, başkanın talebine veya kurulun kararına uymak zorundadır. Bu madde uyarınca sandık çevresine gelen kolluk güçleri, başkanın talebine veya kurulun kararına uymak zorunda olup, çağrı veya ihbar sebebi ortadan kalkınca sandık çevresinden ayrılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Seçimin güvenliğini sağlamakla görevli kolluk güçleri hariç, özel güvenlik görevlileri ve belediye zabıtaları gibi görevliler de dâhil olmak üzere resmî üniforma ve silah taşıyan kişiler, sandığın konulduğu bina, yapı ve bunların müştemilatına giremezler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Sandığın konulduğu bina, yapı ve bunların müştemilatında hiç kimse, başkalarının görebileceği şekilde bir siyasi parti veya adaya ait rozet, amblem veya benzeri işaretler ya da propaganda amaçlı yayınlar taşıyamaz; yazılı, sözlü veya görüntülü propaganda yapamaz. Bu fıkra hükümlerine uymayan kişiler kolluk güçleri tarafından uzaklaştırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Sandık kurulunun görev yaptığı yerde cep telefonu ile görüşme yapmak yasaktır. Ancak sandık kurulu başkan ve üyelerinin, görevleri gereği yapacağı görüşmeler bu hükmün dışındadır. Bu hükme aykırı davranan kimseler kurul başkanı tarafından uyarılır. Bu uyarıya rağmen görüşmesini sürdüren kimse, derhal oradan çıkarılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Sandık çevresinde bir suç işlenmesi halinde, sandık kurulu, durumu tutanağa geçirir ve ilgili hakkında işlem yapılmak üzere kolluk güçlerini çağırır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>İlçe seçim kurulu başkanı, sandık çevresinde, sandık başı iş ve işlemlerinin düzen içinde yürütülmesini ve sandığın konulduğu bina, yapı ve bunların müştemilatında güvenliği ve bu Kanunda öngörülen yasaklara uyulmasını sağlayacak tedbirleri alır; seçmenin ve bu yerlerde bulunma hakkına sahip diğer kişilerin buralara serbestçe girmesini engelleyen veya güçleştiren her türlü hareketi önler. Bu kapsamda, ilçe seçim kurulu başkanınca verilen talimatlara sandık kurulları, mülki ve idari makamlar uymak zorundadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="83" başlık="Sandık alanında alınacak güvenlik önlemleri ve yasaklar">
        <mvz-fıkra no="1">
          <template>Mülga</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="84" başlık="Sandık alanında inzıbat tedbirleri">
        <mvz-fıkra no="1">
          <template>Mülga</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="85" başlık="Sandık çevresi dışındaki inzıbat tedbirleri">
        <mvz-fıkra no="1">
          <template>Sandık çevresi dışında, zabıtaya emir verme yetkisine sahip makamlarla, zabıta amir ve memurları tarafından alınacak tedbirler, seçmenin sandığın konulduğu bina, yapı ve bunların müştemilatına serbestçe girmesini engelleyici veya güçleştirici mahiyette olamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-fıkra no="2">
          <template>(Mülga)</template>
        </mvz-fıkra>
      <mvz-madde no="85/A" başlık="Ceza infaz kurumları ve tutukevlerinde kurulan sandıklarda uygulanacak esaslar">
        <mvz-fıkra no="1">
          <template>Ceza infaz kurumlarında ve tutukevlerinde kurulan sandıklarda uygulanacak esaslar bu Kanunun 81, 82, 83, 84 ve 85 inci maddeleri hükümleriyle bağlı kalınmaksızın Yüksek Seçim Kurulunca belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Oy Verme">
      <mvz-madde no="86" başlık="Oy verme yetkisi">
        <mvz-fıkra no="1">
          <template>Onaylı sandık seçmen listesinde yazılı her seçmen, oy verme yetkisine sahiptir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunda sayılan istisnalar dışında, sandık seçmen listesinde kaydı olmayanların oy kullanmalarına izin verilmez. Ancak, kesinleşen muhtarlık bölgesi askı listelerinde adı yazılı olduğu veya bu listelere yazılması için askı süresi içinde başvurduğu ve listeye kaydedilmesine karar verildiği halde, çoğaltılarak sandık kurullarına verilen sandık seçmen listelerinde ismi yer almayan seçmenlerin, muhtarlık bölgesi askı listelerinin kesinleşmesine bakılmaksızın, ilçe seçim kurulundaki liste ile oy verecekleri sandık seçmen listesine ilave edilmelerine, ilçe seçim kurulu başkanı tarafından karar verilir ve seçmene bu yolda verilecek bir yazı ile sandık kuruluna başvurması ve listeye dâhil edilmek suretiyle seçmenin oy kullanması sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Her seçmen, bu Kanunda sayılan istisnalar dışında, hangi sandık seçmen listesinde kayıtlı ise ancak o sandıkta oy kullanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bir seçmen aynı seçim türü için birden fazla oy kullanamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bir seçmen, hangi seçim çevresinin seçmeni ise ancak o seçim çevresinde yapılan seçimler için oy kullanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Oy verme gününe kadar, haklarında seçme yeterliğini kaybettiğine dair yetkili mercilerden resmî belge gelmiş bulunan seçmenler ile tutuklu sandık seçmen listesine kaydedilmiş olup da tahliye edilen veya taksirli suçlar dışında bir suçtan hüküm giyerek cezası kesinleşenlerin durumlarını gösteren resmî belge gelmiş bulunanlara, seçmen listesinde kayıtlı olsalar bile oy kullandırılmaz ve bu husus sandık kurulunca tutanağa geçirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="87" başlık="Kimliğin tespiti">
        <mvz-fıkra no="1">
          <template>Sandık seçmen listesinde yazılı seçmenin kimliği, nüfus hüviyet cüzdanı veya kimlik tespiti amacıyla düzenlenmiş ve Türkiye Cumhuriyeti kimlik numarasını taşıyan resmi belgelerle belirlenir. Hangi resmi belgelerin kimlik belirlenmesinde kabul edileceği, Yüksek Seçim Kurulunca seçimlerin başlangıcında tespit ve ilan edilir. Şu kadar ki, belediyeler ile köy ve mahalle muhtarlıklarınca tanzim ve tasdik edilen kimlik belgeleri bu maddenin uygulanmasında geçerli değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>(Mülga)</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Üzerinde Türkiye Cumhuriyeti kimlik numarası olmayan bir kimlik belgesi ibraz eden seçmenin oy kullanabilmesi için, bu belgelerin yanında ayrıca seçmen bilgi kâğıdını veya Türkiye Cumhuriyeti kimliğini ispata elverişli Yüksek Seçim Kurulu tarafından ilan edilen bir belgeyi de ibraz etmesi şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ceza infaz kurumları ve tutukevlerinde tutuklu ya da taksirli suçlardan hükümlü bulunan seçmenlerden yukarıda sayılan kimlik belgeleri bulunmayanlar için, cezaevi idaresince verilmiş belge, kimlik belgesi yerine geçer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="88" başlık="Oy verme düzeni">
        <mvz-fıkra no="1">
          <template>Hiçbir seçmene sandık başında müdahale, telkin veya tavsiyede bulunulamaz ve hiçbir seçmen oyunu kullandıktan sonra sandık başında kalamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="89" başlık="Oy verme süresi">
        <mvz-fıkra no="1">
          <template>Oy verme günü, saat sekizden on yediye kadar geçecek zaman, oy verme süresidir. Ancak, saat on yediye geldiği halde, sandık başında oylarını vermek üzere bekliyen seçmenler, başkan tarafından sayıldıktan sonra sıra ile oylarını kullanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Oy verme süresinin başlayış ve bitiş saatleri, sürenin korunması kaydıyla, mevsim ve bölge özellikleriyle ulaşım durumlarına göre, bütün yurtta veya gerekli görülen seçim çevrelerinde, seçim gününden en az bir hafta önce ilan edilmek koşuluyla, Yüksek Seçim Kurulunca tespit edilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="90" başlık="Oy vermede sıra">
        <mvz-fıkra no="1">
          <template>Oy verme günü sandık başına gelecek seçmenler, sandık kurulu önüne başkan tarafından sıra ile birer birer alınırlar. Gebeler, hastalar ve engelliler bekletilmezler. Yaşlılar önce alınabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="91" başlık="Oy vermeden önceki işler">
        <mvz-fıkra no="1">
          <template>Sandık kurulu önüne alınan kimse, kimlik belgesini başkana  verir ve kimliğini ispat eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başkan, seçmenin adını seçmen listesinde bulur ve masa üzerinde duran birleşik oy pusulasından bir tane vererek, sandık yerinde birden fazla oy verme yeri varsa hangi kapalı oy verme yerine gireceğini söyler ve birleşik oy pusulasını veya seçimin gereğine göre zarfları usulüne göre katlayıp yapıştırdıktan sonra çıkmasını anlatır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birleşik oy puslasını veya zarfı alan seçmen doğruca kapalı oy verme yerine gider ve oyunu kullanmadan başka yere gidemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kapalı oy verme yerine girmeyen veya birleşik oy puslasını alıp oy vermeyen seçmenden birleşik oy puslası geri alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="92" başlık="Kapalı oy verme yerinde seçmenin uyması gereken kurallar">
        <mvz-fıkra no="1">
          <template>Seçmen, kapalı oy verme yerinden dışarı çıkmadıkça, hiç kimse oraya giremez. Ancak, oy pusulasını hazırlamak için, kapalı oy verme yerinde, normal süreden fazla kalan seçmenler, kurul başkanı tarafından makul bir süre verilerek uyarılır. Bu uyarıya rağmen kapalı oy verme yerinden çıkmayan seçmen, oradan çıkarılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Seçmenin; cep telefonu, fotoğraf veya film makinesi gibi görüntü kaydedici veya haberleşme sağlayıcı cihazlarla kapalı oy verme yerine girmesi yasaktır. Bu tür cihazlar, kapalı oy verme yerine girmeden önce kapatılarak sandık kurulu başkanına teslim edilir ve oy kullanma işlemi bittikten sonra seçmene iade edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="93" başlık="Birleşik oy pusulasının atılması ve işaretleme">
        <mvz-fıkra no="1">
          <template>Kapalı oy verme yerinde birleşik oy puslasını katlayıp yapıştırdıktan sonra, seçmen burasını terkeder ve birleşik oy puslasını sandığa bizzat atar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Körler, felçliler veya bu gibi bedeni engellilikleri açıkça belli olanlar, bu seçim çevresi seçmeni olan akrabalarından birinin, akrabası yoksa diğer herhangi bir seçmenin yardımı ile oylarını kullanabilirler. Bir seçmen birden fazla malule refakat edemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kurul başkanı, oyunu kullanan seçmene kimlik kartını verirken seçmen listesindeki adı karşısına imzasını attırır. İmza atamayanların sol elinin başparmağının izinin alınmasıyla yetinilir. Bu parmağı olmayan seçmenin hangi parmağını bastığı yazılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="94" başlık="Sandık seçmen listesinde kayıtlı olmayan seçmenlerin oy kullanması">
        <mvz-fıkra no="1">
          <template>İlçe seçim kurulu başkanı, seçimin yapıldığı çevrede oy verme hakkına sahip olduğu halde, görev yaptığı sandığa ait seçmen listesinde kayıtlı bulunmayan;</template>
          <mvz-bent no="a">
            <template>Sandık kurulu başkan ve üyeleri ile bina sorumlularının,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Seçimin güvenliğini sağlamakla görevli kolluk güçlerinin,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İlçe seçim kurulu tarafından sandık kurulu üyelerini görev yerine ulaştırmak için görevlendirilmiş kişilerin,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>her birine seçmen olduğunu ve hangi seçimde oy kullanabileceğini gösteren ve sandık seçmen listesindeki bilgileri kapsayan bir belge verir. Ayrıca, bu seçmenlerin esas kayıtlı olduğu sandık seçmen listesine meşruhat verilmek üzere kayıtlı bulunduğu sandık kurulu başkanlığına durumu yazı ile bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu madde uyarınca, ilçe seçim kurulu başkanı tarafından kendilerine oy kullanma hakkı bulunduğuna ilişkin olarak belge verilen görevliler, bu belge ile görevli oldukları sandık bölgesinde oy verirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Milletvekilleri ile milletvekili adayları seçmen bilgi kağıdını göstermek suretiyle kayıtlı oldukları seçim çevresi dışında da oylarını kullanabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sandık kurulu, bu madde kapsamında oy kullanan kimselerin ilgili belgelerini, oy verme işleminden önce alır. Bu belgeler, diğer seçim evrakı ile birlikte ilçe seçim kuruluna teslim edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu madde uyarınca oy kullanan seçmenlerin ad ve soyadları ile kimlik bilgileri, oy kullandıkları sandık seçmen listesinin sonuna yazılarak karşısına imzaları alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="94/A" başlık="Yurt dışı seçmenlerin oy verme yöntemleri ve genel ilkeler">
        <mvz-fıkra no="1">
          <template>Yurt dışı seçmenlerin oy kullanmasında; sandık, gümrük kapılarında oy kullanma veya elektronik oylama yöntemlerinin birlikte veya ayrı ayrıuygulanmasına, seçim türüne ve yabancı ülkenin durumuna göre, Dışişleri Bakanlığının görüşü alınarak Yüksek Seçim Kurulunca karar verilir. Yurt dışı seçmen kütüğüne kayıtlı seçmenlerin oy kullanmalarına yönelik iş ve işlemlerde, Dışişleri Bakanlığının bilişim altyapısından faydalanılabilir. Dışişleri Bakanlığı, Yüksek Seçim Kurulunun belirleyeceği usul ve esaslar doğrultusunda, kullanılacak olan bilişim altyapısının oluşturulması ve güvenliği için gerekli tedbirleri alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Milletvekili genel seçimlerinde, üzerinde Yüksek Seçim Kurulu filigranı bulunan özel imal edilmiş kâğıtlara basılı birleşik oy pusulalarında; sadece seçime katılan siyasi partilerin özel işaretleri, kısaltılmış isimleri ve tam yazı halinde adlarıyla her siyasi parti için ayrılan bölümün altında çapı iki santimetre olan boş bir daire bulunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">

      <mvz-madde no="94/B" başlık="Yurt dışı seçmenlerin mektupla oy vermesi">
        <mvz-fıkra no="1">
          <template>Yüksek Seçim Kurulu, özel olarak imal ettirdiği oy pusulası ile özel renkte bastırılmış oy zarflarını, Yurt Dışı İlçe Seçim Kuruluna gönderir. Yurt Dışı İlçe Seçim Kurulu, arkası kendi mührüyle mühürlenmiş oy pusulası ile oy zarflarını, seçimlerin yapılacağı günün yetmişbeş gün öncesinden seçmenin yurt dışında kayıtlı olduğu adresine gönderir.</template>

        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mektupların gönderilmesi, güvenliği ve kimlik tespitine ilişkin usul ve esaslar, Posta ve Telgraf Teşkilatı Genel Müdürlüğünün görüşü alınarak Yüksek Seçim Kurulu tarafından belirlenir. Posta giderleri Yüksek Seçim Kurulunca karşılanır.</template>

        <mvz-fıkra no="6">

        <mvz-fıkra no="7">
          <template>Seçimin yapıldığı gün saat 17:00’dan itibaren oy torbaları Yurt Dışı İlçe Seçim Kurulunca açılarak sayım, döküm ve birleştirme işlemleri yapılır ve sonuçlar Ankara İl Seçim Kuruluna iletilir. Bu Kurulca da birleştirme tutanağı düzenlenerek Yüksek Seçim Kuruluna gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Yurt dışı seçmenler tarafından kullanılan toplam geçerli oy sayısı, Yüksek Seçim Kurulunca Türkiye genelinde kullanılan toplam geçerli oy sayısına ilave edilerek yurt düzeyinde genel oy miktarı ve her partinin ülke genelinde aldığı geçerli oy miktarı bulunur.</template>

          <template>Bu şekilde, 2839 sayılı Milletvekili Seçimi Kanununun 33 üncü maddesine esas teşkil eden toplam oylar bulunmuş olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Her seçim çevresinde geçerli toplam oy, Yurt Dışı İlçe Seçim Kurulundan Ankara İl Seçim Kuruluna gelen toplam oyun diğer seçim kurullarından gelen oylara bölünmesiyle elde edilen oranda artırılır. O seçim çevresinde kullanılan toplam oylarla bu şekilde hesaplanan toplam oy arasındaki fark partilere, Ankara İl Seçim Kurulundan gelen oydaki hisseleri oranında taksim edilir ve elde edilen rakamlar o seçim çevresinde aldıkları geçerli oylara ilave edilir. Böylece Milletvekili Seçimi Kanununun 34 üncü maddesinde belirlenen esas seçim çevresinde kullanılan geçerli toplam oy miktarı ve partilerin aldıkları toplam geçerli oy miktarı bulunur.</template>

      <mvz-madde no="94/C" başlık="Yurt dışı seçmenlerin sandıkta oy vermesi">
        <mvz-fıkra no="1">
          <template>Yurt dışı seçmen kütüğüne kayıtlı bulunan seçmenler, yurt dışı temsilciliklerimizde ve ihtiyaç duyulması halinde yerel makamların uygun göreceği diğer yerlerde kurulacak seçim sandıklarında seçimin yapılacağı günün kırkbeş gün öncesinden başlamak üzere, Yüksek Seçim Kurulunca belirlenen usul ve esaslar çerçevesinde düzenlenen oy verme gün takvimine göre, seçim gününden önceki üçüncü gün saat 17.00’ye kadar oy kullanabilirler. Ancak, yabancı ülkedeki seçmen sayısı gözetilerek oy kullanma gün süresi, Dışişleri Bakanlığının görüşü alınarak Yüksek Seçim Kurulunca kısaltılabilir. Oy kullanma saatleri mahalli saat ile 08.00-17.00 arasıdır. Yabancı ülkenin durumu gözönünde tutularak seçmenlerin hangi yurt dışı temsilciliğinde ve mahalde tatil günleri dâhil yirmidört saat, hangilerinde daha az süre ile oy kullanabileceğine, Dışişleri Bakanlığının görüşü alınarak Yüksek Seçim Kurulunca karar verilir ve alınan bu karar elektronik ortamda ilan edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hangi yurt dışı temsilciliğinde ve mahalde sandık kurulacağı, sandık kurulunun hangi görevlilerden oluşturulacağı Dışişleri Bakanlığının görüşü alınarak Yüksek Seçim Kurulunca belirlenir. Bu belirlemeye göre; sandık kurulu başkan ve üyelerinin seçimi Yurt Dışı İlçe Seçim Kurulunca yapılır. Sandık kurulu bir başkan, bir kamu görevlisi üye ve son milletvekili genel seçiminde Türkiye genelinde en çok oy alan üç siyasi partinin bildirdikleri birer isimden oluşur ve aynı usulle yedek üye seçilir. Siyasi partiler üye bildirmez ise eksiklik kamu görevlileri veya seçmenler arasından seçilecek üye ile doldurulur. Sandık kurulu başkan ve üye seçimleri, yurt dışında öncelikle sandığın kurulacağı yerde görevli kamu görevlisi ve seçmenler arasından yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Siyasi partiler yurt dışında her oy verme günü için ayrı sandık kurulu üyesi bildirebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sandık kurulu başkan ve üyeleri 70 inci madde hükmüne göre yemin ederek görevlerine başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sandık kurulları oy verme gizliliğini ve serbestliğini sağlayacak şekilde, yeteri kadar kapalı oy verme yeri hazırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Yüksek Seçim Kurulu, özel olarak imal ettirdiği oy pusulası ile özel renkte bastırılmış oy zarflarını Yurt Dışı İlçe Seçim Kuruluna gönderir. Yurt dışında kullanılacak olan oy sandıkları, oy kullanma kabinleri ve diğer oy kullanma araçlarının ebatları dâhil tüm özellikleri ile bir sandıkta oy kullanacak seçmen sayısı, yabancı ülkenin durumu gözönünde tutularak, Dışişleri Bakanlığının görüşü alınarak Yüksek Seçim Kurulu tarafından farklı olarak belirlenebilir.</template>

        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Sandık kurulları tarafından her gün oy verme süresinin bitim saati olan 17.00’de veya başka bir bitim saati belirlenmişse bu saatte, bu Kanunda belirtilen usullere göre sandık açılır. Çıkan oy zarfları açılmadan adedi, oy kullanan seçmen miktarı ve bunların birbirine uygunluğu bir tutanakla tespit edilir.</template>

          <template>Her dış temsilcilikte oyları saklamak ve ağzı mühürlü oy torbalarını Yüksek Seçim Kurulu tarafından belirlenecek yöntemlerle Yurt Dışı İlçe Seçim Kuruluna ulaştırmakla görevli olmak üzere; o yer misyon şefi veya en kıdemlinin başkanlığında, o temsilcilikte görevli bir kamu görevlisi üye ve son milletvekili genel seçiminde Türkiye genelinde en çok oy alan üç siyasi partinin bildirdikleri isimlerden oluşturulan sandık kurulu, Dışişleri Bakanlığının görüşü alınarak Yurt Dışı İlçe Seçim Kurulunca kurulur ve aynı usulle yedek üyeler seçilir. Siyasi partiler üye bildirmez ise eksiklik kamu görevlileri arasından seçilecek üye ile doldurulur.</template>

      <mvz-madde no="97" başlık="Kullanılmayan birleşik oy pusulaları ve zarflar">
        <mvz-fıkra no="1">
          <template>Oy zarflarından veya birleşik oy pusulalarından kullanılmayanlar sayılır, oylarını veren seçmen sayısına eklenir ve böylece kurula teslim edilen zarf veya birleşik oy pusulaları toplamına uygun olup olmadığı tespit edilir. Kullanılmayan zarflar veya birleşik oy pusulaları bir paket halinde mühürlenir ve üzerine sayısı yazılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bundan sonra, sandıktan çıkacak oy pusulalarının konmasına mahsus torbanın boş olduğu tespit edilir. Bütün bu işlemler tutanağa geçirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="98" başlık="Sandığın açılması ve zarfların sayımı">
        <mvz-fıkra no="1">
          <template>Sandık, yukarıdaki maddelerde belirtilen iş ve işlemler tamamlandıktan sonra, oy verme yerinde hazır bulunanların gözü önünde, sandık kurulu başkanı tarafından açılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sandıktan çıkan zarflar, sandık kurulu başkanı tarafından yüksek sesle iki defa sayılır. İki sayım arasında fark olursa, üçüncü sayım yapılarak sonucuna göre işlem yapılır ve o seçimde kullanılan toplam zarf sayısı tespit edilir. Tespit edilen zarf sayısı, o seçim türüne ait özel tutanağın ilgili yerine işlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bütün zarflar sayıldıktan sonra, geçerli olup olmaması yönünden kontrol edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sandık kurulunca verilen biçim ve renkte olmayan, üzerinde ilçe seçim kurulu ve sandık kurulu mührü bulunmayan, tamamı yırtılmış olan, üzerinde ilçe seçim kurulu ve sandık kurulu mührü dışında herhangi bir mühür, imza, yazı, parmak izi veya herhangi bir işaret bulunan zarflar geçersiz sayılır.  Ancak, üzerinde sandık kurulu mührü bulunmamasına rağmen Türkiye Cumhuriyeti Yüksek Seçim Kurulu filigranı, amblemi ve ilçe seçim kurulu mührü bulunan zarflar ile üzerinde leke veya çizik bulunsa dahi bunun özel işaret koymak amacıyla yapıldığı kesin olarak anlaşılamayan zarflar geçerli sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İtiraza uğrayan zarflar ile itiraza uğramadan geçersiz sayılan zarflar, başkan tarafından bir kenara ayrılır. Sandık kurulu, bütün zarflar kontrol edildikten sonra, itiraza uğrayan zarfları inceleyerek, geçerli veya geçersiz sayılması yönünde kararını verir. Bundan sonra, o sandıktan çıkan geçerli ve geçersiz oy zarflarının toplam sayısı ayrı ayrı o seçim türüne ait özel tutanağın ilgili yerine işlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Geçersiz zarflar paketlenir ve paketin üzeri mühürlenerek zarf sayısı yazılır. Bu zarflar saklanır ve kesinlikle açılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu işlemler yapıldıktan sonra, o sandıktan çıkan geçerli ve geçersiz zarfların toplam sayısı ile o seçim türü için oy kullanan seçmen sayısı karşılaştırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Zarf sayısı, o seçim türü için oy kullanan seçmen sayısına eşit veya eksik ise başkaca bir işlem yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Zarf sayısı oy kullanan seçmen sayısından fazla ise eşitliği sağlamak için önce geçersiz zarf sayısı düşülür. Geçersiz zarf sayısının düşülmesi halinde de eşitlik sağlanamıyorsa, sandık kurulu başkanı geçerli zarflar arasından, eşitliği sağlayacak sayıda zarfı gelişigüzel çeker ve bu zarflar açılmadan derhal yakılarak imha edilir. İmha edilen zarf sayısı tutanağa yazılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Yukarıda belirtilen işlemler bittikten sonra, geçerli oy zarfları sandığın içine tekrar konularak sayıma geçilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Bütün bu işlemler ayrıca tutanak defterine geçirilerek, sandık kurulu başkan ve üyeleri tarafından imzalanır ve mühürlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>Sandıklar, bütün seçimlere ait sayım ve döküm işlemleri bitinceye kadar oy verme yerinden çıkarılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="99" başlık="Oyların sayımı ve dökümü">
        <mvz-fıkra no="1">
          <template>Mülga</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="100" başlık="Zarfların açılması, oyların sayım ve dökümü">
        <mvz-fıkra no="1">
          <template>Oyların sayım ve dökümüne derhal başlanır, açık ve aralıksız yapılır. Yapılacak şikâyet ve itirazlar, işi durdurmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sandık kurulu başkanı, sayım ve döküm işine başlamadan önce, sayım ve döküm cetvellerinin boş ve yazısız olduğunu hazır bulunanlara gösterir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sandık kurulu başkanı, oy sayım ve dökümünün düzenini sağlamak bakımından;</template>
          <mvz-bent no="a">
            <template>Bir üyeyi sandıktaki zarfları kendisine vermek,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İki üyeyi okunan oy pusulalarını sayım ve döküm cetvellerine işlemek,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bir üyeyi okunan ve dökümü yapılan oy pusulalarını ve açılan zarfları masa üzerine düzenli biçimde yerleştirmek ve korumak,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>üzere görevlendirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sayım ve döküm cetvellerinde, ilk önce birleşik oy pusulasındaki sıraya göre siyasi partilerin adları soldan sağa doğru sütunların yukarısındaki hanelere yazılır. Daha sonra, varsa her bağımsız adaya bir sütun ayrılarak, bağımsız adayların ad ve soyadları, birleşik oy pusulasındaki sıraya göre sütunların yukarısındaki hanelere yazılır.  Bunlardan sonra, ittifak yapan siyasi partilerin bulunması halinde, ittifakların birleşik oy pusulasındaki sıralarına göre ortak oyları için yeteri kadar sütun ayrılır ve bu sütunların üzerine ittifakların unvanları yazılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sandık kurulu başkanı tarafından görevlendirilen üye, oy zarfını sandıktan teker teker alarak başkana verir. Başkan zarfı açarak içinden çıkan oy pusulasının ön yüzünü herkesin görebileceği ve işitebileceği şekilde okur.  Ancak aynı zarf içinde birden fazla oy kullanılan seçimlerde, zarfın içinden çıkan oy pusulaları okunmadan önce, seçim türüne göre ters çevrilerek tasnif edilip masanın üzerine konulur ve dokuzuncu fıkra uyarınca işlem yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Birleşik oy pusulası üzerinde hangi partiye veya bağımsız adaya ait yere "EVET" mührü basılmış ise, o partinin adı veya bağımsız adayın ad ve soyadı okunur. Muhtarlık seçimlerinde ise, zarfın içerisinden çıkan oy pusulaları, hangi muhtar veya üyelere ait ise onların adı ve soyadı okunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Birlikte yapılan Cumhurbaşkanı ve milletvekili seçimlerinde, önce Cumhurbaşkanı seçimine ait oy pusulalarının sayım ve dökümü yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Mahalli idare organları seçimlerinde;</template>
          <mvz-bent no="a">
            <template>Büyükşehirlerde, sırasıyla büyükşehir belediye başkanlığı, belediye başkanlığı, belediye meclisi üyeliği ve muhtarlık,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Diğer illerde, sırasıyla belediye başkanlığı, belediye meclisi üyeliği, il genel meclisi üyeliği ve muhtarlık,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>seçimlerine ait oy pusulalarının sayım ve dökümü yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Aynı zarf içinde birden fazla oy kullanılan seçimlerde, oy zarfı içinden eksik oy pusulası çıkmış ise eksik çıkan oyların hangi seçim türüne ait olduğu ve sayısı ile içinden hiç oy pusulası çıkmayan boş zarf sayısı toplamı, zarfların açılması bittikten sonra tespit edilip sandık sonuç tutanağına işlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Siyasi partilerin ve bağımsız adayların aldığı ve herhangi bir itiraza uğramadan geçerli sayılan her oy, okunmasını müteakiben, görevli üyeler tarafından, aynı anda sayım ve döküm cetvelinde o siyasi partiye veya bağımsız adaya ayrılmış bulunan sütundaki rakamlar birden başlamak üzere, sırasına göre çizilmek suretiyle, ayrı ayrı işaretlenir. Bu işlemin usulüne uygun yapılıp yapılmadığı, sandık kurulu başkanı tarafından sürekli denetlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Okunan geçerli oy pusulaları ve zarfları, görevli üye tarafından, masa üzerinde düzenli biçimde yerleştirilir ve muhafaza edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>İttifak alanı içerisinde, “EVET” mührünün;</template>
          <mvz-bent no="a">
            <template>Bir siyasi partiye ayrılan alana,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Hem bir siyasi partiye ayrılan alana hem de ittifak unvanı bölümüne,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İttifak unvanı bölümüne taşacak şekilde, bir siyasi partiye ayrılan alana,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>basılması halinde, bu oy pusulaları geçerli kabul edilir ve sayım döküm cetvelinde o siyasi partinin cetveldeki sütununa işaretlenir. Bu haller dışında, yalnız ittifak alanı içerisine “EVET” mührünün basıldığı her durumda, bu oy pusulaları da geçerli kabul edilir ve sayım döküm cetvelinde ittifakın ortak oyları sütununa rakamlar birden başlamak üzere, sırasına göre çizilmek suretiyle, ayrı ayrı işaretlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Geçersiz sayılan veya geçerli olmasına rağmen hesaba katılmaması gereken oy pusulaları ile geçerli olup olmadığı veya hesaba katılıp katılmaması yönünden tereddüt edilen veya itiraza uğrayan oy pusulaları, sayım ve döküm cetveline işlenmeksizin ayrılır ve sandık kurulu başkanı tarafından muhafaza altına alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="14">
          <template>Bütün zarfların açılıp okunması bittikten sonra; itiraz edilmeksizin geçerli sayılan ve her iki sayım ve döküm cetveline işlenen oy sayıları, her siyasi parti, bağımsız aday ve ittifakın ortak oyları sütununda işaretlenmiş son rakamlar karşılaştırılarak, her siyasi parti, bağımsız aday ve ittifakın ortak aldığı geçerli oy sayısının iki cetvelde de aynı olup olmadığı, başkan tarafından kontrol edilir. Oy sayıları aynı ise, her siyasi parti, bağımsız aday ve ittifakın ortak aldığı geçerli oylar toplanarak, itiraz edilmeksizin geçerli sayılan bu oyların toplam sayısı, o seçim türüne ait sandık kurulunca düzenlenecek özel tutanağa yazı ve rakamla işlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="15">
          <template>Siyasi partilerin, bağımsız adayların ve ittifakların ortak aldıkları ve kendi hanelerine işlenmiş geçerli oy sayılarını gösterir rakamların her iki sayım ve döküm cetvelinde de aynı olmaması halinde ikinci sayım yapılır. İkinci sayımda, geçerli tüm oy pusulaları yeniden, tek tek okunarak, boş ve yazısız ayrı iki sayım ve döküm cetveline işlenir. Bu cetvellerdeki oy sayıları aynı ise, her siyasi parti, bağımsız aday ve ittifakın ortak aldığı geçerli oylar toplanarak, itiraz edilmeksizin geçerli sayılan bu oyların toplam sayısı, o seçim türüne ait sandık kurulunca düzenlenecek özel tutanağa yazı ve rakamla işlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="16">
          <template>İkinci sayımda kullanılan sayım ve döküm cetvelinde yer alan oy sayıları da aynı çıkmazsa, yukarıda belirtilen usûle göre üçüncü sayım yapılır ve kurulun varsa siyasi partili olmayan, yoksa başkan tarafından belirlenecek üyesi tarafından tek sayım ve döküm cetveline işlenmek suretiyle, sonucuna göre işlem yapılır. Birden fazla sayım yapılan hallerde, bu sayımlarda kullanılan sayım ve döküm cetvellerinin üzerine, hangi sayıma ait olduğu büyük harflerle yazılır ve tüm cetveller muhafaza edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="17">
          <template>Açılan sandığa ait son geçerli zarf açılıp içindeki oy pusulası okunduktan sonra, sandık başkanı tarafından o sandığa ait açılmayan geçerli zarf olup olmadığı kontrol edilir ve açılan zarfların sayısı ile sandıktan çıkan ve tutanağa işlenmiş olan geçerli zarf sayısı karşılaştırılır ve sonuç, tutanak defterine işlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="18">
          <template>Geçerli oyların sayım ve döküm cetvellerine işlenmesinden sonra, hesaba katılıp katılmaması veya geçerli sayılıp sayılmaması yönünden tereddüt edilen veya itiraza uğrayan oy pusulaları, sandık kurulunca ayrı ayrı değerlendirilerek karara bağlanır ve bu karar, tutanak defterine yazıldıktan sonra mühürlenip imzalanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="19">
          <template>Sandık kurulu kararı ile geçerli sayılan veya hesaba katılan oy pusulaları, sayım ve döküm cetvelinde ait olduğu siyasi parti, bağımsız aday veya ittifakın ortak oyu için ayrılmış bulunan sütuna işlenir. Bu şekilde geçerli sayılan veya hesaba katılan oy pusulalarının toplam sayısı, o seçim türüne ait özel tutanakta ilgili yere işlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="20">
          <template>Geçerli sayılmayan veya hesaba katılmayan oy pusulaları, ayrı ayrı paket yapılarak bağlanır ve paketin üzeri mühürlenerek, sayısı yazılır ve saklanır. Bu oy pusulaları yakılmaz, yırtılmaz ve yok edilemez. Bunların sayısı, o seçim türüne ait özel tutanakta ilgili yere işlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="21">
          <template>Yukarıda belirtilen işlemler tamamlandıktan sonra, sayım ve döküm cetvelinde siyasi partilerin, bağımsız adayların ve ittifakların ortak aldığı oyların toplam sayısı, kendi sütununun altına rakamla ve yazı ile yazılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="22">
          <template>Sayım ve döküm cetvelinde, siyasi partilerin, bağımsız adayların ve ittifakların ortak aldığı oylar, orada bulunanlara, başkan tarafından yüksek sesle ilan edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="23">
          <template>Bu ilandan sonra, sayım ve döküm cetvelindeki sonuçlar, sandık sonuç tutanağına işlenir. Bu bilgilerin doğruluğu, sandık başkanı tarafından sayım ve döküm cetveli sonuçları ile karşılaştırıldıktan sonra, sandık sonuç tutanağı, başkan ve üyeler tarafından imzalanır ve mühürlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="24">
          <template>Bütün bu işlemler, tutanak defterine geçirilerek, sandık kurulu başkan ve üyeleri tarafından imzalanır ve mühürlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="25">
          <template>Parti müşahitleri, sayım masası başında yer alabilir ve oy pusulalarını görebilirler. Ancak, parti müşahitlerinin sayısı beşten fazla ise, hazır bulunanlar arasından başkan tarafından kurul önünde ad çekme suretiyle, sandık başında kalacak beş parti müşahidi her biri ayrı partiden olmak üzere tespit edilir. Diğer müşahitlerle bağımsız aday müşahitleri için sayım işlemini yakından takip edebilecekleri bir yer ayrılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="101" başlık="Geçerli olmayan oy pusulaları">
        <mvz-fıkra no="1">
          <template>Aşağıda yazılı;</template>
          <mvz-bent no="1.">
            <template>Sandık kurulunca verilen ve o seçim için düzenlenmiş biçim ve renkte olmayan,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Arkasında “Türkiye Cumhuriyeti Yüksek Seçim Kurulu” filigranı bulunmayan,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Arkasında sandık kurulu mührü bulunmayan,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Hiçbir yerine “EVET” mührü basılmamış olan,</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Siyasi partilere veya bağımsız adaylara ayrılan alanlardan birden fazlasına “EVET” mührü basılmış olan,</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Birden fazla siyasi partiye veya bağımsız adaya ayrılan alana taşmış “EVET” mührü bulunan,</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>Sandığın ait olduğu seçim çevresinden başka bir seçim çevresi için düzenlenmiş olan,</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>Bütünlüğü bozulacak şekilde yırtılmış veya koparılmış olan,</template>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>Üzerine “EVET” mührü dışında veya “EVET” mührü yerine herhangi bir özel işaret, herhangi bir isim, imza kaşesi, mühür veya parmak izi basılmış olan,</template>
          </mvz-bent>
          <mvz-bent no="10.">
            <template>Üzerinde yer alan siyasi partilere veya bağımsız adaylara ait bölümleri belirgin bir şekilde ve özel olarak karalanmış, çizilmiş veya işaretlenmiş olan,</template>
          </mvz-bent>
          <mvz-bent no="11.">
            <template>Üzerinde yer alan matbu yazıların ve şekillerin dışında yazılar veya harfler veya sayılar yazılmış veya şekiller çizilmiş olan,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>birleşik oy pusulaları geçerli değildir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak aşağıdaki haller oy pusulalarını geçersiz kılmaz:</template>
          <mvz-bent no="1.">
            <template>Zarfların açılması veya oyların okunması sırasında yırtılması.</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Bütünlüğü bozulmaksızın bir kısmının kazaen yırtılması.</template>
          </mvz-bent>
          <mvz-bent no="3.">
