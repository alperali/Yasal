  <mvz-künye tür="kanun" no="2972" başlık="MAHALLİ İDARELER İLE MAHALLE MUHTARLIKLARI VE İHTİYAR HEYETLERİ SEÇİMİ HAKKINDA KANUN"
             tarih="18/1/1984" rgazete-tarih="18/1/1984" rgazete-sayı="18285"
             düstur-tertip="5" düstur-cilt="23" düstur-sayfa="4" />  

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun mahalli idareler organlarının seçimlerine ilişkin esas ve usulleri düzenler. Bu amaçla:</template>
        <mvz-bent no="a">
          <template>İl genel meclisi üyelerinin,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Belediye başkanı ve belediye meclisi üyelerinin,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Köy ve mahalle muhtarları ile ihtiyar meclisi ve heyeti üyelerinin,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Seçim sistemi, usul, dönem ve zamanlarına ait esaslarla seçim çevrelerine, aday olabilme ve seçilme ilkelerine ait hükümleri kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Seçim sistemi ve usulü">
      <mvz-fıkra no="1">
        <template>Mahalli idareler seçimleri serbest, eşit, gizli, tek dereceli, genel oy, açık sayım ve döküm esaslarına göre, yargı yönetim ve denetimi altında yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İl genel meclisi ve belediye meclisi üyelikleri için yapılan seçimlerde, onda birlik baraj uygulamalı nispi temsil sistemi, belediye başkanlığı seçiminde ise çoğunluk sistemi uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Seçim çevresi">
      <mvz-fıkra no="1">
        <template>İl genel meclisi üyeleri seçimi için her ilçe bir seçim çevresidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Belediye başkanı ve belediye meclis üyeleri seçimi için, her belde bir seçim çevresidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Büyük şehirlerdeki seçim çevresi">
      <mvz-fıkra no="1">
        <template>Büyükşehir belediye başkanının seçiminde seçim çevresi, büyükşehir belediye sınırlarından oluşur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Seçilecek üye sayısı">
      <mvz-fıkra no="1">
        <template>Her seçim çevresinde, seçilecek üye sayısı aşağıdaki usule göre hesaplanır.</template>
        <mvz-bent no="a">
          <template>İl genel meclisi üyelikleri için, son genel nüfus sayımı sonuçlarına göre:</template>
          <mvz-altbent no="1">
            <template>Nüfusu 25 000'e kadar olan ilçelerde 2</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Nüfusu 25 001'den 50 000'e kadar olan ilçelerde 3</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Nüfusu 50 001'den 75 000'e kadar olan ilçelerde 4</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Nüfusu 75 001'den 100 000'e kadar olan ilçelerde 5</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Asıl üyelik ve aynı miktarda yedek üyelik hesaplanır.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Nüfusu 100 000'den yukarı olan ilçelerde fazla her 100 000 nüfus için bir asıl, bir yedek üye ilave olunur. Nüfusun 100 000'e bölünmesi hesabında artık sayı 50 000'den az olursa hesaba katılmaz, 50 000 'den fazla olursa artık sayıya da bir asıl, bir yedek üyelik hesap edilir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Belediye meclisi üyelikleri için son genel nüfus sayımı sonuçlarına göre:</template>
          <mvz-altbent no="1">
            <template>Nüfusu 10 000'e kadar olan beldelerde 9</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Nüfusu 10 001'den 20 000'e kadar olan beldelerde 11</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Nüfusu 20 001'den 50 000'e kadar olan beldelerde 15</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Nüfusu 50 001'den 100 000'e kadar olan beldelerde 25</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Nüfusu 100 001'den 250 000'e kadar olan beldelerde 31</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Nüfusu 250 001'den 500 000'e kadar olan beldelerde 37</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Nüfusu 500 001'den 1 000 000'a kadar olan beldelerde 45</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>Nüfusu 1 000 000'dan fazla olan beldelerde 55</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Asıl ve aynı sayıda yedek üyelik hesaplanır.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Büyük şehir belediye meclisine katılacak üye sayısı">
      <mvz-fıkra no="1">
        <template></template>
        <mvz-bent no="a">
          <template>Büyük şehir belediye meclisleri belediye hudutları içinde kalan ilçe seçim çevreleri için tespit edilen belediye meclisleri üye sayısının her ilçe için beşte biri alınmak suretiyle bulunacak toplam sayı kadar üyeden teşekkül eder.</template>
        </mvz-bent>  
        <mvz-bent no="0">
          <template>Bu hesaplamada artık sayılar nazara alınmaz.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yedek üyelikler de aynı usulle hesaplanır.</template>
        </mvz-bent>  
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Tespit ve ilan">
      <mvz-fıkra no="1">
        <template>Her seçim çevresi için seçilecek asıl ve yedek üye sayısı o seçim çevresinin bağlı olduğu il seçim kurulu tarafından tespit olunarak ilgili ilçe seçim kurullarına bildirilir. İlçe seçim kurulları durumu alışılmış usullerle ilan eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Seçim dönemi-seçim başlangıç tarihi ve seçim günü">
      <mvz-fıkra no="1">
        <template>Mahalli İdareler seçimleri beş yılda bir yapılır. Her seçim döneminin beşinci yılındaki 1 Ocak günü seçimin başlangıç tarihidir, Aynı yılın Mart ayının son Pazar günü oy verme günüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(Mülga)</template>
      </mev-fıkra>
      <mvz-fıkra no="3">
        <template>Yeni kurulan belediyelerin ilk belediye başkan ve belediye meclisi üyeleri seçimleri ile yeni kurulan illerde il genel meclisi üyeleri seçimi, yukarıdaki fıkralarda belirtilen ilk genel mahalli idareler seçimleri ile birlikte yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mahalli idareler seçiminin savaş hali nedeniyle bir yıla kadar ertelenmesi kanunla düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Seçilme yeterliliği">
      <mvz-fıkra no="1">
        <template>2839 sayılı Milletvekili Seçimi Kanununun 11 inci maddesinde belirtilen sakıncaları taşımamak şartıyla, on sekiz yaşını dolduran her Türk vatandaşı belediye başkanlığına, il genel meclisi ve belediye meclisi üyeliğine seçilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Seçim Öncesi İşleri">
    <mvz-madde no="10" başlık="Adaylık">
      <mvz-fıkra no="1">
        <template>Anayasa ve Kanunlarda yazılı şartlara uygun olarak, seçilme yeterliğine sahip olan her vatandaş, bir siyasi parti listesinden veya bağımsız olarak, il genel meclisi üyeliğine, belediye başkanlığına veya belediye meclisi üyeliğine adaylığını koyabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mahalli İdareler seçimlerinde aday tespiti 2820 sayılı Siyasi Partiler Kanununun 37 nci maddesindeki hükümlere göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ancak; 2820 sayılı Kanunun 37 ila 51 inci maddelerinde adı geçen "Yüksek Seçim Kurulu" yerine "ilçe seçim kurulları", "siyasi parti genel başkanlığı" yerine "siyasi parti ilçe başkanlıkları", keza büyük şehir belediyelerinde de il seçim kurulları, siyasi parti il başkanlıkları bu işlemleri yaparlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ayrıca:</template>
        <mvz-bent no="a">
          <template>Yapılan aday tespitinde belediye başkanlığı için bir aday, belediye meclisi üyeliklerine o seçim çevresi için tespit edilen üye adedi kadar asıl ve yedek olarak ayrı ayrı; il genel meclisi üyeliklerine o seçim çevresi için tespit olunan asıl ve yedek üyelikler sayısı kadar ayrı ayrı, aday belirlenir.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>İl genel meclisi üyeliklerine o seçim çevresi için tespit olunan asıl ve yedek üyelikler sayısı kadar ayrı ayrı, aday belirlenir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Önseçim çevresi belediye meclisi üyeliği ve belediye başkanlığı için belde; il genel meclisi üyeliği için ilçe; büyük şehir belediye başkanlıkları için o şehir belediye hudutları içidir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Siyasi partiler, belediye meclis üye sayısı 9 ve 11 olan beldelerde bir, 15 olan beldelerde iki, 25 ve 31 olan beldelerde üç, 37 olan beldelerde dört, 45 olan beldelerde beş, 55 olan beldelerde altı adet kontenjan adayı gösterirler. Kontenjan adayı adayların sıralamasına dahil edilmeyerek aday listelerinde kontenjan adayı olarak ayrıca yazılır. Siyasi partiler kontenjan adaylarını merkez yoklaması ile tespit ederler. Ancak, merkez karar ve yönetim organları bu yetkisini il veya ilçe yönetim kurullarına devredebilirler. Siyasi Partiler kontenjan adaylarını bu Kanunun 12 nci maddesindeki aday listesinde yer vermek suretiyle ilçe seçim kurullarına bildirirler. Kontenjan adayları bu Kanunun 18 inci maddesinin (f) bendinin ikinci fıkrasındaki aday listelerinde de yedek adaylardan sonra ayrıca yazılır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Önseçimle aday tespiti halinde, belediye başkanı ile belediye meclisi üye aday adayları müşterek liste ile önseçime katılabilirler. Bu halde, partili seçmen bu müşterek listeyi aynen veya bu müşterek listedeki mevcut aday adaylarından istediklerini çizmek ve bunların yerine diğer aday adaylarından isimler yazmak veya 2820 sayılı Siyasi Partiler Kanununun 46 ncı maddesinde belirtilen aday adayları listesine işaret koymak suretiyle oyunu kullanabilir. Siyasi partiler 2820 sayılı Siyasi Partiler Kanununun 46 ncı maddesinde belirtilen aday adayları listesi ile birlikte müşterek listeli aday adayları listelerini de ilçe seçim kurulu başkanlıklarına verirler.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Seçimlere katılacak Siyasi partiler hangi seçim çevrelerinde, hangi usul ve esaslarla aday tespiti yapacaklarını Yüksek Seçim Kuruluna bildirirler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bir siyasi partinin teşkilatı bulunmaması nedeniyle önseçim yapamadığı önseçim çevresinden adaylarını ve adayların sırasını o partinin merkez karar ve yönetim kurulu tespit eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Mahalli idare seçimlerinde siyasi parti adaylarından parti genel merkez yetkili organlarınca belirlenecek miktarda başvuru aidatı alınabilir. Bu aidatın miktarı en yüksek Devlet memurunun brüt aylığını geçemez. Belediye başkanlığı için bağımsız aday olanlar hakkında 2839 sayılı Milletvekili Seçimi Kanununun 21 inci maddesinin 2 nci fıkrası ile 41 inci maddesi hükmü kıyasen uygulanır. Seçim sonucunda belediye başkanlığına seçilen adaya aldığı oy miktarına bakılmaksızın alınan teminat iade olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Eksik adaylıkların tamamlanması">
      <mvz-fıkra no="1">
        <template>Herhangi bir sebeple, eksik aday göstermiş olan siyasi partilerin ilçe başkanlıklarına, ilçe seçim kurulu tarafından bu eksiğin tamamlanması gereği tebliğ olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlgili parti teşkilatı, bu tebliğden itibaren beş gün içinde aday listesini tamamlayamazsa, o parti o seçim çevresinden, eksik liste ile ilgili seçime katılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Siyasi partilerin merkez karar ve yönetim kurulları, süreyi geçirmemek amacı ile eksik listeyi tamamlama yetkisini önceden ilçe idare kurullarına verebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Siyasi partilerin aday listelerini vermeleri">
      <mvz-fıkra no="1">
        <template>Siyasi partilerin ilçe idare kurulları, seçime katılacakları çevrelere ait aday listelerini ilçe seçim kurullarına, alındı belgesi karşılığında, önseçim gününden en geç on gün sonraki gün saat 17.00'ye kadar verirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlçe seçim kurulları geçici aday listelerini mahallinde alışılmış usullerle ilan ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Büyük şehirler için siyasi partilerin il idare kurulları, belediye başkanı adaylarını alındı belgesi karşılığında önseçim gününden en geç on gün sonraki gün saat 17.00'ye kadar il seçim kuruluna verirler. Bağımsız adaylar da il seçim kuruluna başvururlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İl seçim kurulları geçici adayları mahallinde alışılmış usullerle ilan ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Bağımsız adayların müracaatı">
      <mvz-fıkra no="1">
        <template>İl genel meclisi üyeliği, belediye meclisi üyeliği ve belediye başkanlığına bağımsız olarak adaylığını koymak isteyenler, seçime katılacakları seçim çevresinin bulunduğu ilçe seçim kurulu başkanlığına, bu Kanunun adaylık için aradığı şart ve vasıfları haiz olduklarını belirten bir dilekçe ile başvururlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bağımsız adaylar Yüksek Seçim Kurulunca tespit edilen ön seçim tarihine kadar adaylık için başvurabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İlçe seçim kurulları, bağımsız adaylara ilişkin listeleri de, ait olduğu seçim çevresinde geçici listeler halinde alışılmış usullerle ilan ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bağımsız adaylık için başvuranlar, en yüksek derecedeki Devlet memurunun brüt aylığı kadar parayı ilgili mal sandığına yatırarak makbuzunu başvurma belgelerine eklerler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu miktar hazineye irad kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Adaylara karşı itiraz">
      <mvz-fıkra no="1">
        <template>Adaylıkların geçici olarak ilanından itibaren iki gün içinde ilçe seçim kuruluna itiraz edilebilir. İtirazlar, ilçe seçim kurulunca en geç iki gün içinde karara bağlanır. İlgililer kararlara karşı iki gün içinde, il seçim kuruluna itiraz edebilirler. İl seçim kurulu bu itirazları en çok iki gün içinde kesin olarak karara bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Siyasi partilerin aday listelerinde, yapılan itirazlar üzerine eksiklik husule geldiği takdirde, İlçe Seçim Kurulunun tebliğinden itibaren beş gün içinde bu eksikliklerini tamamlayamazlarsa, o partiler o seçim çevresinde, eksik liste ile ilgili seçime katılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Adayların incelenmesi">
      <mvz-fıkra no="1">
        <template>İlçe seçim kurulları, kendi seçim çevrelerinin adayları hakkında, yapacakları inceleme sonucunda bu Kanunda yazılı adaylık şartlarında noksanlık veya aykırılık bulunduğunu görürlerse, durumu geçici ilan tarihinden itibaren iki gün içinde ilgili adaya ve siyasi partilerin ilçe başkanlıklarına bildirirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlgili aday veya mensubu olduğu siyasi parti, bu bildirim üzerine en geç iki gün içinde il seçim kuruluna itiraz edebilir. İl seçim kurulu bu itirazı en geç iki gün içinde kesin karara bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İtirazı reddedilen bağımsız aday seçime katılma hakkını kaybeder. Siyasi parti adayları hakkında 14 üncü maddenin ikinci fıkrası hükmü uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Adayların ilanı">
      <mvz-fıkra no="1">
        <template>Adaylık kesinleştikten sonra, ilçe seçim kurulları, bütün adayları oy verme gününden önceki, 20 nci gün ilan eder. Adayların ilanından sonra, adaylıktan istifa, seçim sonuna kadar nazarı itibare alınmaz. Ancak, bu gibiler seçilmiş bulunurlarsa, istifaları hüküm ifade eder ve yerlerine kendilerinden sonra gelenler seçilmiş sayılırlar. Ölüm halinde de aynı şekilde hareket edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İl genel meclisi ve belediye meclisi üyeleri ile belediye başkanlarının adaylığı:</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="">
      <mvz-fıkra no="1">
        <template>Milletvekilleri, belediye başkanları, il genel meclisi ve belediye meclisi üyeleri ile muhtarlar mahalli idareler seçimlerinde adaylıklarını koyabilmek veya aday gösterilebilmek için görevlerinden istifa etmek zorunda değildirler. Milletvekilliği, belediye başkanlığı, il genel meclisi ve belediye meclisi üyeliği ile muhtarlık bir şahıs uhdesinde birleşemez. Bu görevlerin birisinde bulunanlardan bir diğerine seçilenler, seçim sonuçlarının kendilerine tebliğ edildiği tarihten itibaren 15 gün içinde tercih haklarını kullanırlar. Bu süre içinde tercih haklarını kullanmayanlar seçildikleri yeni görevi reddetmiş sayılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>

        <mvz-bent no="0">

        </mvz-bent>
        <mvz-bent no="0">
          <template>Yapılan çıkarmadan sonra geriye oyu kalan siyasi partilerin ve bağımsız adayların isimleri alt alta, kalan oyları da hizalarına yazılır. Bu sayılar önce bire, sonra ikiye, sonra üçe ... şeklinde devam edilmek suretiyle o seçim çevresinin çıkaracağı asıl üye sayısına ulaşıncaya kadar bölünür. Elde edilen paylar, siyasi parti ayırımı yapılmaksızın, en büyükten en küçüğe doğru sıralanır Belediye ve il genel meclisi üye tamsayısı kadar üyelikler, bu payların sahibi olan siyasi partilere ve bağımsız adaylara, sayıların büyüklük sırasına göre tahsis olunur.</template>

        <mvz-bent no="0">

        <mvz-bent no="0">

        <mvz-bent no="0">

          <template>Yedek üyelikler için de (a) ve (b) bentleri hükümleri uygulanır. Siyasi partilerin kazandıkları yedek üyeler, asıl üyeliğe seçilenlerden sonra gelen isimden itibaren sıra ile tespit olunur.</template>

      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>En az altı aydan beri o mahalle veya köyde oturmak şartıyla on sekiz yaşını dolduran her Türk vatandaşı, bu Kanunda ve bu Kanunun atıf yaptığı diğer kanunlarda öngörülen hükümlerce seçilmeye mani hali olmamak kaydıyla, muhtar, ihtiyar meclisi ve ihtiyar heyeti üyesi seçilebilir. Bunlar için ilkokul mezuniyeti şartı aranmaz; okur-yazar olmak yeterlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>442 sayılı Köy Kanununun 41 inci maddesi gereğince görevden uzaklaştırılan köy muhtarları ile 4541 sayılı Şehir ve Kasabalarda Mahalle Muhtar ve İhtiyar Heyetleri Teşkiline Dair Kanunun 18 inci maddesine göre sıfatları kaldırılan mahalle muhtar ve ihtiyar heyeti üyeleri tekrar aynı görevlere seçilemezler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="32" başlık="Seçim çevresi, oy verme ve seçim sistemi">
      <mvz-fıkra no="1">
        <template>Mahalle muhtarlığı ve ihtiyar heyeti için, mahalle; köy muhtarlığı ve ihtiyar meclisi için köy; seçim çevresidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mülga</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Muhtar ile ihtiyar meclisi veya heyeti üyelerinin seçiminde; muhtar ile bu Kanunun 30 uncu maddesinin (1) ve (2) fıkralarında gösterilen ihtiyar meclisi veya heyeti üye sayısı kadar ismin birlikte yazılı olduğu oy pusulası kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Muhtar, ihtiyar heyeti ve ihtiyar meclisi seçimleri ekseriyet sistemine göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu seçimler için kullanılacak oy pusulaları, basılabilir, teksir edilebilir ve her türlü araçla çoğaltılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="Boşalan muhtarlık, ihtiyar meclisi ve heyeti üyeliği için seçim yapılması">
      <mvz-fıkra no="1">
        <template>Köy veya mahalle muhtarlığının herhangi bir sebeple boşalması halinde ihtiyar meclisi veya heyetinin birinci üyesi durumu, yazılı olarak ilgili seçim kuruluna ve mahallin en büyük mülkiye amirine bildirmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Boşalan muhtarlıklar için her yıl haziran ayının ilk pazar günü seçim yapılır. Seçim yapılıncaya kadar muhtarlık görevi mahallin en büyük mülkiye amiri tarafından atanacak muhtar vekili tarafından yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Seçim döneminin sona ermesinden önce ihtiyar meclisi veya heyeti üye sayısının yedeklerinin de getirilmesinden sonra üye tamsayısının, köylerde tabii üyeler hariç, yarısına düşmesi halinde, muhtar, durumu bir hafta içinde ilgili seçim kurulu başkanlığına ve bilgi için de mahallin en büyük mülkiye amirine bildirmeye mecburdur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu bildirim üzerine ilçe seçim kurulu başkanlığınca durum 48 saat içinde ilan edilir. İlan tarihinden sonra gelen 60 ıncı günü takip eden ilk pazar günü oy verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İhtiyar meclisi veya heyeti seçiminin yapılması gerektiği hallerde köy veya mahalle muhtarlığı da boşalmış ise, haziran ayı beklenmeksizin her iki seçim beraber yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="34" başlık="Diğer işlemler">
      <mvz-fıkra no="1">
        <template>Muhtar, ihtiyar heyeti, ihtiyar meclisi seçimlerinde diğer işlemler bu Kanunda ve bu Kanunun atıf yaptığı diğer kanunlarda yazılı usul ve esaslara göre yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Seçmen kütüğüne kaydı ve sandık listesinde oy kullanma yeterliliği bulunduğu halde, mahalli idareler genel ve ara seçimlerine meşru mazeretleri olmaksızın katılmayanlar ilçe seçim kurulu başkanı tarafından 200 000 (ikiyüzbin) lira para cezası ile cezalandırılır. Bu karar kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Dağınık mahalle ve sair yerleşim yerleri bulunan köylerde veya köylerin birbirlerine yakın olduğu durumlarda seçim sandıklarının bir tek mahalle veya bir tek köyde toplanması, seçim gününden en az bir hafta önce ilan edilmek koşuluyla İlçe Seçim Kurulunca kararlaştırılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Subaylar, astsubaylar, hakimler ve savcılar ile yüksek yargı organları mensupları hariç olmak üzere, kamu kurumları ile kamu kurumu niteliğinde bir kuruluşta memur veya kadrolu işçi olarak çalışmakta iken bu görevinden ayrılarak Belediye Başkanı seçilmiş olup da yeniden aday olamayan veya seçilemeyenler, hizmet süreleri itibariyle veya yaş haddi nedeniyle emekliliğe hak kazanamamış olmaları kaydıyla, seçimlerin kesin sonuçlarının Yüksek Seçim Kurulunca ilanını takip eden iki ay içinde daha önceki kurumlarının bağlı bulunduğu bakanlığa başvurmaları halinde eski görevlerine veya istifa ettikleri tarihteki kurumun özelliği ve niteliğine uygun eşdeğer bir göreve atanabilirler. Ancak yargı kararı ile belediye başkanlığı görevi sona erenler ve istifa edenler hakkında bu hüküm uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Geçici Hükümler">
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun uyarınca yeni il genel meclisi seçimleri yapılarak il genel meclisleri ilk toplantılarını yapıncaya kadar 25/9/1980 gün ve 2304 sayılı 13/3/1329 tarihli İdarei Umumiyei Vilayat Kanunu Muvakkatına Ek Kanun hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun uyarınca yeni belediye başkan ve belediye meclisi üyeleri seçilinceye kadar, 25/9/1980 gün ve 2303 sayılı 3/4/1930 tarih ve 1580 sayılı Belediye Kanununa Ek Kanun ile 18/8/1981 gün ve 2508 sayılı 1580 sayılı Belediye Kanununa 2303 sayılı Kanunla Eklenen Geçici 3 üncü Maddenin Değiştirilmesine ve Bu Kanuna Üç Geçici Madde Eklenmesine Dair Kanun hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun yürürlüğe girdikten sonra, yapılacak ilk mahalli idareler seçimlerinde, siyasi partilerin aday tespiti için ön seçim yapılmaz. Bu seçime mahsus olmak üzere siyasi partiler, adaylarını aşağıdaki usullere göre tespit ederler:</template>
        <mvz-bent no="0">
          <template>Büyük şehir belediye başkanı adayları siyasi partilerin genel merkez karar ve yönetim kurullarınca tespit edilir.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>İllerde :</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>İl merkezi belediye başkanı ile belediye meclisi üyeleri, merkez ilçe beldelerinin belediye başkanları ile belediye meclisi üyeleri, merkez ilçeye isabet eden, il genel meclisi üyeleri adaylarını, siyasi partilerin il ve merkez ilçe idare kurulları birlikte toplanarak;</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>İlçelerde :</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>İlçe belediye başkanı ile belediye meclisi üyeleri; ilçe beldelerinin belediye başkanları ile belediye meclis üyeleri; ilçe seçim çevresine isabet eden il genel meclisi üyeleri adaylarını, siyasi partilerin ilçe idare kurulları toplanarak;</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Belirleyip, genel merkez karar ve yönetim kurulunun tensip ve tasdikine sunarlar.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Merkez karar ve yönetim kurulunun, her listeyi aynen kabul veya değiştirerek tasdik etmesi ile adaylar tespit olunur.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesinden sonra yapılacak ilk seçimde, seçmen kütüğünde ve sandık listesinde kaydı ve oy kullanma yerinde bulunduğu halde mahalli idareler ile mahalle muhtarlıkları ve ihtiyar heyetleri seçimlerine hukuki veya fiili mazereti olmaksızın katılmayanlar, ilçe seçim kurulu başkanı tarafından 2.500 lira para cezası ile cezalandırılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak seçim gününden sonraki üç ay içinde hukuki veya fiili mazeretini bildiren ve mazereti ilçe seçim kurulu başkanınca geçerli görülenlerden bu para tahsil edilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunda seçim usul ve esasları hükme bağlanan büyük şehir yönetiminin hukuki statüsü, bu Kanunun yürürlüğünü takip eden ilk seçimin oy verme gününden önce, 17/6/1982 gün ve 2680 sayılı Kamu Kurum ve Kuruluşlarının Kuruluş, Görev ve Yetkilerinin Düzenlenmesi ile ilgili Yetki Kanununda belirtilen esas ve usullere uygun olarak çıkarılacak kanun hükmünde kararnamelerle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesinden sonra yapılacak ilk mahalli idareler seçimlerinde 6 Kasım 1983 tarihinde yapılan milletvekili seçiminde kullanılan sandık seçmen listeleri güncelleştirilerek kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Güncelleştirme; sandık seçmen listelerinin askıya çıkarılması, listede ismi bulunmayanlar ile seçim gününe kadar 21 yaşını dolduracak olanların listeye yazılması suretiyle yapılır ve bu suretle oluşan listeler başka bir ilan vesair işleme tabi tutulmadan çoğaltılarak sandık seçmen listesi olarak kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Askı ve itiraz süreleri Yüksek Seçim Kurulunca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesini takip eden ilk mahalli idareler seçiminde oy verme günü 25 Mart 1984 tarihidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçim döneminin başlangıç tarihi Yüksek Seçim Kurulunca, yukarıdaki fıkrada belirtilen oy verme günü esas alınarak tespit ve ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yüksek Seçim Kurulu, bu seçimlere mahsus olmak üzere, bu Kanun ile 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun ve 2820 sayılı Siyasi Partiler Kanununun seçimlere ilişkin olarak tespit ettiği süreleri kısaltarak uygular.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesinden sonra yapılacak ilk mahalli idareler seçimlerinde, seçime katılma hakkı kazanacak partilerde 2839 sayılı Milletvekili Seçimi Kanununun 45 inci maddesi ile değişen 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunun 14 üncü maddesinin 4 ve 11 numaralı bentlerinde sözü edilen büyük kongresini yapmış olmaları şartı aranmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Geçici 7 nci maddeye göre yapılacak seçimlerde tayin yolu ile belediye başkanlığı görevini yürütenler aday oldukları takdirde kanuni süreleri içinde görevlerinden ayrılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Subaylar, astsubaylar, hakimler ve savcılar ile yüksek yargı organları mensupları hariç olmak üzere; mahalli idareler seçimlerinde aday olan memurlar seçimi kaybetmeleri halinde, Yüksek Seçim Kurulunca seçim sonuçlarının ilanını takip eden bir ay içinde müracaat etmeleri kaydıyla ve bu seçime mahsus olarak müktesep hakları ile eski veya eşdeğer bir göreve dönebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>2963 sayılı Kanunla kurulan ve halen adli ve mülki teşkilatı kurulmamış bulunan ilçelerde mahalli idareler seçimlerini yürütecek ilçe seçim kurulunu belirlemeye veya yeni ilçe seçim kurulları oluşturmaya Yüksek Seçim Kurulu yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>1993 yılında kurulacak belediyelerin organ seçimleri 1994 yılı Mart ayında yapılacak Mahalli İdareler Genel Seçimleri ile birlikte yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>27 Mart 1994 tarihinde yapılacak mahalli idareler seçimlerinde, Hakimler ve Savcılar, Yüksek Yargı Organları mensupları, Yüksek Öğretim kurumlarındaki öğretim elemanları, Yüksek Öğretim Kurulu üyeleri, kamu kurum ve kuruluşlarının memur statüsündeki görevlileri ile yaptıkları hizmet bakımından işçi niteliği taşımayan diğer kamu görevlileri ile subaylar ve astsubaylar 30.1.1994 tarihine kadar görevlerinden ayrılma isteğinde bulunmadıkça adaylıklarını koyamazlar ve aday gösterilemezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Subay ve astsubaylar hariç olmak üzere; birinci fıkrada sayılanların aday adaylığını veya adaylığı kaybetmeleri ve bir ay içinde müracaatları halinde hemen; seçimi kaybetmeleri halinde, Yüksek Seçim Kurulunca seçim sonuçlarının ilanını takip eden bir ay içinde müracaat etmeleri kaydıyla eski görevlerine veya kazanılmış hak veya aylık derecelerindeki başka bir göreve atanırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Ek Geçici Madde 1– 18.1.1984 tarih ve 2972 sayılı Kanunun 8 inci maddesi uyarınca 27 Mart 1994 tarihinde yapılacak Mahalli İdareler Seçimlerinde oy vereceklerin kütüklere yazılması ve sandık listelerinin düzenlenmesi amacıyla bütün Türkiye'de aynı zamanda 1993 yılının Kasım ayının ilk Pazar günü, Yüksek Seçim Kurulu'nun gözetim ve denetiminde yazım yaptırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun uyarınca, bilgisayar ortamında merkezi Seçmen Kütüğü oluşturulan yerlerde yazım işlemleri diğer illerden farklı olarak, yazım memurlarınca aynı gün konutlar dolaşılmak suretiyle bilgisayar ortamındaki mevcut merkezi seçmen kütüğünün güncelleştirilmesi biçiminde yapılır. Bununla ilgili esaslar Yüksek Seçim Kurulunca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Seçimde kullanılacak seçmen kütüklerinin yazımında 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun ile ilgili diğer Kanunların bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Ek Geçici Madde 2– Mahalli İdareler Seçimlerinde kullanılacak seçmen kütüklerinin yazımı ve seçimin yapılması için Adalet Bakanlığı bütçesinin ilgili bölümüne yeterli miktar ödenek, Maliye ve Gümrük Bakanlığının yedek ödenek tertibinden aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek Seçim Kurulu, seçmen kütüklerinin süratle yazımının, daktilo edilmesinin ve kartlarının dağıtımının sağlanması için geçici ve yevmiyeli personel istihdam edebilir. Bu personele Yüksek Seçim Kurulu Başkanlığınca 300 000 ila 500 000 lira arasında takdir edilecek gündelik ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Son Hükümler">
    <mvz-madde no="35" başlık="Propaganda serbestliği">
      <mvz-fıkra no="1">
        <template>Mahalle idareler seçimlerinde propaganda 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun dairesinde serbesttir. Ancak 298 sayılı Kanunun 52-55 inci maddeleri ile düzenlenen radyo ve televizyonda propagandaya ilişkin hükümleri, 52 inci maddenin son bendi hariç, bu seçimlerde uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, 298 Sayılı Kanunun 52 ila 55 inci maddeleri ile düzenlenen radyo ve televizyonda propagandaya ilişkin hükümleri mahalli idareler ara seçimlerinde resmi ve özel radyo ve televizyon kuruluşları bakımından uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Özel hüküm bulunmayan hallerde uygulama">
      <mvz-fıkra no="1">
        <template>Bu Kanunda özel hüküm bulunmayan hallerde 26/4/1961 gün ve 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun ile 22/4/1983 tarih 2820 sayılı Siyasi Partiler Kanunu, 10/6/1983 gün ve 2839 sayılı Milletvekili Seçimi Kanununun ve bunların ek ve değişikliklerinin bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>18/7/1963 gün ve 286 sayılı Köy Kanununda Değişiklik Yapılmasına Dair Kanunun,</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>18/7/1963 gün ve 287 sayılı Şehir ve Kasabalarda, Mahalle Muhtar ve İhtiyar Heyetleri Teşkiline Dair 4541 sayılı Kanunda değişiklik yapılmasını ve Bazı Kanunların Kaldırılması Hakkında Kanunun,</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>19/7/1963 günlü ve 306 sayılı İdarei Umumiyei Vilayat Kanununda Değişiklikler Yapılmasına ve İlgili Bazı Kanunların Kaldırılmasına Dair Kanun.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>19/7/1963 gün ve 307 sayılı Belediye Kanununda Değişiklik Yapılmasına Dair Kanunun,</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
