  <mvz-künye tür="kanun" no="1581" başlık="TARIM KREDİ KOOPERATİFLERİ VE BİRLİKLERİ KANUNU"
             tarih="18/4/1972" rgazete-tarih="28/4/1972" rgazete-sayı="14172"
             düstur-tertip="5" düstur-cilt="11" düstur-sayfa="2196" />
    
  <mvz-madde no="1" başlık="Kuruluş ve kapsam">
    <mvz-fıkra no="1">
      <template>Bu kanunda yazılı hükümlerden faydalanılmak suretiyle üreticiler, aralarında ekonomik menfaatlerini korumak ve özellikle meslek ve geçimleriyle ilgili ihtiyaçlarını sağlamak amaciyle karşılıklı yardım ilkesine dayanan ve tüzel kişiliği olan değişir ortaklı, değişir sermayeli Tarım Kredi Kooperatifleri kurabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tarımsal amaçlı kooperatifler hariç olmak üzere; ortak ürünleri üzerinde ticaret ve komisyonculuk yapanlar, faizle para veya mal olarak kredi verenler bu kooperatiflere giremezler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu esaslara göre kurulan bir veya birkaç il dahilindeki kooperatifler bölge birliklerini, en az 5 bölge birliği de, merkez birliğini kurarlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Merkez birliği tek üst kuruluş olup Ankara'dadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kooperatiflerin ve bölge birliklerinin çalışma alanı içinde birden fazla kooperatif ve bölge birliği kurulamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu Kanun hükümlerine göre kurulmuş olan Tarım Kredi Kooperatifleri ve birlikleri, Devletçe kooperatiflere verilen desteklerden yararlanırlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Tarifler">
    <mvz-fıkra no="1">
      <template>Bu Kanunda geçen;</template>
      <mvz-bent no="a">
        <template>Ortak deyimi,</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Bu kanuna göre kurulan Tarım Kredi Kooperatifleri ortaklarını,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Kooperatif deyimi,</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Bu kanun kapsamına giren Tarım Kredi Kooperatiflerini,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Bölge birliği deyimi,</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Kooperatifler tarafından kurulan Tarım Kredi Kooperatifleri bölge birliklerini,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Merkez Birliği deyimi,</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Faaliyeti bütün yurdu kapsıyan Tarım Kredi Kooperatifleri ve bölge birliklerinin bağlı bulundukları Türkiye Tarım Kredi Kooperatifleri Merkez Birliğini.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İfade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Amaç ve çalışma konuları">
    <mvz-fıkra no="1">
      <template>Kooperatiflerin, bölge ve merkez birliklerinin çalışma konuları şunlardır:</template>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>I – Kooperatifler</template>
      <mvz-bent no="A">
        <template>Ortaklarının;</template>
        <mvz-altbent no="a">
          <template>Kısa ve orta vadeli kredi ihtiyaçlarını karşılamak,</template>
        </mvz-altbent>
        <mvz-altbent no="b">
          <template>Ürünlerini değerlendirmek,</template>
        </mvz-altbent>
        <mvz-altbent no="c">
          <template>Müştereken yararlanabilecekleri her çeşit makina, ekipman ve tesisleri edinmek,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="B">
        <template>Ortak ve gerektiğinde diğer üreticilerin;</template>
        <mvz-altbent no="a">
          <template>Üretim ve zaruri tüketim maddeleri ile üretim araçlarını toptan sağlamak,</template>
        </mvz-altbent>
        <mvz-altbent no="b">
          <template>El sanatlarını geliştirmek ve mamullerini değerlendirmek,</template>
        </mvz-altbent>
        <mvz-altbent no="c">
          <template>Mesleki ve teknik yönden bilgilerini artırmak, sosyal ve kültürel konulariyle ilgili faaliyetlerde bulunmak, kurslar açmak ve seminerler tertip etmek,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="C">
        <template>Mevduat toplamak, bankacılık hizmetleri ve sigorta acenteliği yapmak.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>II – Bölge birlikleri</template>
      <mvz-bent no="a">
        <template>Kooperatiflerin finansman işlerini düzenlemek,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Ortak ürünlerinin değerlendirilmesiyle ilgili işleri yürütmek,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Gerektiğinde kooperatiflerin ihtiyaç duydukları üretim ve zaruri tüketim maddeleri ile üretim araçlarını toptan sağlamak veya imal etmek,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Kooperatiflerin işlerinin kooperatifçilik ilkelerine ve mevzuat hükümlerine uygun olarak yürütülmesini sağlamak üzere gerekli tedbirleri almak, teknik ve idari yardımlarda bulunmak ve ortakların genel ve mesleki eğitim faaliyetlerini düzenlemek,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Kooperatifleri denetlemek.</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Mevduat toplamak, bankacılık hizmetleri ve sigorta acenteliği yapmak.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template> Bölge birlikleri görevlerini merkez birliğinin tasvibi ile il veya ilçe merkezlerinde kuracakları şubeleri veya görevlendirecekleri kooperatifler aracılığı ile de yürütebilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>III – Merkez birliği</template>
      <mvz-bent no="a">
        <template>Kooperatif ve bölge birliklerinin bu kanuna ve kooperatifçilik ilkelerin uygun olarak gelişmesini sağlamak, kooperatifçilik ve mesleki eğitim faaliyetlerinde bulunmak,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Kooperatif ve bölge birliklerine finansman kaynakları temin etmek ve bunların geliştirilmesi için her türlü tedbirleri almak, kredi işlerinin düzenle yürütülmesini sağlamak,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Kooperatif ve bölge birliklerinin üretim ve zaruri tüketim maddeleri ile üretim araçlarını toptan sağlamak, imal etmek ve ortak ürünlerinin değerlendirilmesi ile ilgili faaliyetleri rasyonel bir şekilde düzenlemek ve bu konularda her türlü teşebbüse girişmek veya iştirak etmek ve gerekli tesisleri kurmak, faaliyet konusuna giren hususlarda ithalat ve ihracat yapmak,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Kooperatif ve bölge birliklerinin görev ve çalışma konularının düzenle yürütülmesini sağlamak üzere genel uygulama esaslarını tespit etmek,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Kooperatif ve bölge birliklerini denetlemek,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Kooperatiflerle, bölge ve merkez birliklerinin personel politikasını tespit etmek ve yürütmek,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Kooperatif ve bölge birliklerinin kuruluşuna karar vermek ve kuruluş merkezini ve çalışma alanını tespit etmek,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Kooperatif ve bölge birliklerinin finansman ihtiyaçlarını karşılamak üzere tahvil çıkarmak,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Hükümetçe görevlendirildiğinde, Devlet destekleme alımları ile ilgili faaliyetleri yürütmek,</template>
      </mvz-bent>
      <mvz-bent no="ı">
        <template>Kooperatiflerin ve bölge birliklerinin toplayacakları mevduatın kullanılma şekil ve şartları ile bu konudaki üst kuruluşlarla olan bağlantıları gösteren yönetmeliği hazırlıyarak Ticaret Bakanlığına sunmak,</template>
      </mvz-bent>
      <mvz-bent no="i">
        <template>Birlik ve Kooperatiflerce sağlanan kredi, araç ve gereçlerin kullanış şekil ve şartları ile amaca uygun olarak kullanıldığının kontrolunu gösteren bir yönetmelik hazırlamak,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Merkez ve bölge birlikleri ile Kooperatifler, kredi ihtiyaçlarını da karşılamak üzere, banka ve sigorta şirketi kurabilir veya bu gibi kuruluşlara iştirak edebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kooperatifler, bölge birlikleri ve Merkez Birliği tarafından kurulmuş olan şirketler ile bunların sermayesinin yüzde ellisinden fazlasına sahip olacak şekilde iştirakçi oldukları şirketlerde, yönetim kurulu başkanı veya üyesi ya da denetim kurulu üyesi olarak görevlendirilenlere, bu şirketlerin sadece birinden ücret veya huzur hakkı ödenebilir. Bu şekilde görevlendirilenlere diğer şirketler tarafından herhangi bir ad altında başkaca bir ödeme yapılmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Yönetim kurulu">
    <mvz-fıkra no="1">
      <template>Yönetim Kurulu;</template>
      <mvz-bent no="a">
        <template>Kooperatiflerde; genel kurula katılma hakkını haiz ortaklar arasından, genel kurulca dört yıl için seçilecek beş üyeden,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bölge birliklerinde; genel kurula katılma hakkını haiz temsilciler arasından, genel kurulca dört yıl için seçilecek yedi üyeden,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Merkez Birliğinde; genel kurula katılma hakkını haiz temsilciler arasından, genel kurulca dört yıl için seçilecek dokuz üyeden,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Teşekkül eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kooperatifler ve bölge birliklerinde yönetim kurulları bir başkan ve bir başkanvekili seçerler, Merkez Birliğinde ise Yönetim Kurulu bir Başkan ve iki başkanvekili seçer.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yönetim kurulu toplantılarında vekâleten oy kullanılamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yönetim kurulu üyeliklerine seçilenlerin, en az ilkokul mezunu olmaları şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kooperatif müdürleri, bölge müdürleri ve Merkez Birliği Genel Müdürü yönetim kurulu toplantılarına iştirak ederler; ancak, oy kullanma hakları yoktur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Kooperatif ve bölge birliklerinde yönetim kurulu üyelerine ve denetçilerine verilecek ücret veya huzur hakkının miktarı Merkez Birliği Yönetim Kurulu tarafından, Merkez Birliği Yönetim Kurulu üyeleri ve denetçilerine verilecek ücret veya huzur hakkının miktarı ise Merkez Birliği Genel Kurulu tarafından tespit edilir. Ancak, Merkez Birliği Yönetim Kurulu üyeleri ve denetçilerine verilecek ücret veya huzur hakkının aylık net tutarı brüt asgarî ücretin dört katıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Kooperatifler, bölge birlikleri ve Merkez Birliğinin yönetim kurulu üyeleri ve denetçileri, Tarım Kredi Kooperatiflerinin ve birliklerinin işletme ve iştirakleri ile bunların personelince kurulan vakıf veya derneklerde, bu kuruluşları temsilen yönetim veya denetim kurulu üyesi veya personeli olarak herhangi bir görev alamazlar. Ayrıca kooperatifler, bölge birlikleri ve Merkez Birliği çalışanları kooperatiflere ortak olamazlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Kooperatifler, bölge birlikleri ve Merkez Birliği tarafından yapılacak seçimlerin esasları, temsilcilerinin adedi, yönetim kurulu üyeleri ile kooperatif ve bölge birlikleri tarafından seçilecek temsilcilerde aranacak diğer nitelikler ve yönetim kurulu üyelerinin çeşitli ilçe, il ve bölgeleri temsil esasları ana sözleşmelerde tayin ve tespit edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Kooperatiflerde her ortak, bölge birlikleri ve Merkez Birliğinde her temsilci, genel kurullarda yalnız bir oy kullanma hakkına sahiptir, vekâleten oy kullanılmaz. Kooperatifler, bölge birlikleri ve Merkez Birliği genel kurul toplantıları dört yılda bir yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Yönetim">
    <mvz-fıkra no="1">
      <template>Kooperatifler, bölge birlikleri ve Merkez Birliğinde işler; kanun, ana sözleşme ve diğer mevzuat ile kooperatif üst kuruluşlarının belirleyeceği esaslara, genel kurul ve yönetim kurulu kararlarına uygun olarak müdürlük, bölge müdürlüğü ve Genel Müdürlük tarafından yürütülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Merkez Birliğinde Genel Müdür ve genel müdür yardımcıları, bölge birliklerinde bölge müdürleri ve kooperatiflerde müdürler Merkez Birliği Yönetim Kurulu tarafından atanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kooperatifler, bölge birlikleri ve Merkez Birliğine imzaya yetkili diğer personel, Genel Müdürün teklifi ve Merkez Birliği Yönetim Kurulunun onayı ile belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Genel müdür ve yardımcılarının, en az dört yıllık yüksek öğrenim yapmış, kamu kurum ve kuruluşlarında veya tarım kredi kooperatifleri ve birlikleri teşkilâtı ile tarım kredi kooperatiflerinin faaliyet alanı ile ilgili benzer bir kuruluşta en az sekiz yıl çalışmış olmaları şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kamu kurum ve kuruluşlarında görev yapmakta iken kurumlarının muvafakatı ve kendilerinin isteği üzerine bu Kanun kapsamında Genel Müdür ve Genel Müdür Yardımcısı olarak atananlar kurumlarından aylıksız izinli sayılırlar. Bunlardan 8.6.1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanunu hükümlerine tâbi olarak görev yapmakta olanların 5434 sayılı Kanun ile ilgileri devam ettirilir. Ayrıca, emeklilik hakları açısından Genel İdare Hizmetleri Sınıfına dahil aynı unvanlı kadrolar için tespit edilmiş olan ek gösterge, makam ve temsil tazminatları ile diğer malî haklardan da aynı esas ve usuller çerçevesinde yararlandırılırlar. Bu görevlerde geçirilen süreler, emekli keseneğine esas aylığın tespitinde dikkate alındığı gibi, makam tazminatı ve yüksek hâkimlik tazminatı ödenmesini gerektiren görevlerde geçmiş sayılır. Bunların bu Kanun kapsamında atandıkları kadro unvanına ilişkin emekli kesenekleri kendilerince, karşılıkları da bu Kanun kapsamında çalıştıkları kuruluş tarafından ödenir. Görevleri sona erenler, yazılı olarak istekte bulunmaları halinde önceki kurumlarında aylıksız izne ayrıldıkları tarihteki durumlarına uygun bir kadroya atanırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Kooperatifler, bölge birlikleri ve Merkez Birliği personelinin tayin, nakil ve görevden çıkarılması gibi esaslar; Merkez Birliği Yönetim Kurulunca kabul edilip, Genel Kurulun onayı ile yürürlüğe giren bir yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Yönetim kurulu üyeleri ve denetçiler ile personelin görevlerine son verilmesi">
    <mvz-fıkra no="1">
      <template>Yapılan inceleme ve soruşturma sonuçlarına göre görevleri ile ilgili olarak suç işledikleri anlaşılan ve bu fiilleri nedeniyle haklarında yargı mercilerince mahkûmiyet kararı verilen Merkez Birliği Yönetim Kurulu üyelerinin ve denetçilerinin görevlerine son verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Merkez Birliği Yönetim Kurulu üyelerinin görevlerine son verme işlemi, Merkez Birliği Yönetim Kurulunca gerçekleştirilir. İnceleme ve soruşturma sonuçlarına göre Merkez Birliği Yönetim Kurulu üyelerinin ekseriyetinin mahkûm olduklarının anlaşılması halinde, göreve son verme işlemi Tarım ve Köyişleri Bakanlığı tarafından yerine getirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Merkez Birliği denetçilerinin görevlerine son verme işlemi ise doğrudan Tarım ve Köyişleri Bakanlığı tarafından gerçekleştirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Merkez Birliği tarafından yaptırılacak inceleme ve soruşturma sonuçlarına göre suç işledikleri veya kusurlu oldukları anlaşılan ve görevden alınmaları uygun görülen kooperatif, bölge birlikleri ve Merkez Birliği personeli ile haklarında mahkûmiyet kararı verilen kooperatif ve bölge birlikleri yönetim kurulu üyeleri ve denetçilerinin görevlerine Merkez Birliği Yönetim Kurulunca son verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Personelin görevine son verilmesine ilişkin usûl ve esaslar 5 inci maddede belirtilen yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Kooperatifler, bölge birlikleri ve Merkez Birliği personelinin, 25.8.1971 tarihli ve 1475 sayılı Kanun, 22.5.2003 tarihli ve 4857 sayılı İş Kanunu ile 22.4.1926 tarihli ve 818 sayılı Borçlar Kanunu hükümlerine göre görevlerine son verilmesi halleri saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Seçimle işbaşına gelen ve göreve son verilme, çekilme veyahut diğer herhangi bir sebeple yönetim kurulu üyelikleri ve denetçilikleri sona erenlerin yerlerine, yönetim kurulu tarafından yedekleri çağırılır. Yönetim Kurulu üyelerinin ekseriyeti kaybetmesi halinde yedeklerin çağırılma işlemi Merkez Birliğinde denetçiler, bölge birliklerinde Merkez Birliği Yönetim Kurulu ve kooperatiflerde bölge birliği yönetim kurulu tarafından yerine getirilir. Merkez Birliğinde denetçiliklerin de tamamen boşalması halinde yedekleri çağırma işlemi, Tarım ve Köyişleri Bakanlığı tarafından yerine getirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Yedeklerin katılımı ile yönetim kurulu üyeliklerinin ve denetçiliklerinin sayısı tamamlanamaz ise kooperatifler için bölge birliği yönetim kurulunca, seçilme hakkını haiz ortaklar arasından; bölge birlikleri için Merkez Birliği Yönetim Kurulunca, Genel Kurula katılma hakkını haiz temsilciler arasından; Merkez Birliği için Tarım ve Köyişleri Bakanlığınca Genel Kurula katılma hakkını haiz temsilciler arasından atama yapılır. Atama ile gelenler, yerlerine atandıkları üyelerin süresini tamamlarlar.</template>

  <mvz-madde no="11" başlık="Finansman">

  <mvz-madde no="12" başlık="Alacak senetleri">
    <mvz-fıkra no="1">
      <template>Kooperatiflerin kredi ile ilgili alacak senetleri, kağıtları ve her türlü taahhütname ve sözleşmeler ortağın oturduğu veya kooperatifin bulunduğu köy veya mahalle ihtiyar heyetleri tarafından parasız olarak tasdik olunur. Bu suretle tasdik olunan senet ve belgeler İcra ve İflas Kanununun 38 inci maddesinde yazılı belgeler hükmündedir. Senetler vadelerinde protestoya tabi tutulmaz. Müracaat vukuunda bu tasdik muameleleri noterler tarafından da yapılır.</template>

  <mvz-madde no="15" başlık="Alacak sebebiyle mülk edinme">

        <template>Merkez Birliği kurulduktan sonra; bölge birlikleri çalışma alanına dahil edilmeyen kooperatifler için bölge birliğine ait;</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Görevleri yapar ve yetkileri kullanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>T.C. Ziraat Bankası memurlarından, önceden Bankanın muvafakatı alınmak şartiyle, Tarım Kredi Kooperatifleri bölge ve merkez birliklerinde kendilerine görev verilenler, görev aldıkları birliklerin kuruldukları tarihten itibaren beş yılı tecavüz etmemek üzere Bankaca asli görevlerinden ücretsiz izinli sayılırlar. Bu memurların yeni görevlerinde geçecek hizmetleri terfi ve emeklilik bakımından T.C. Ziraat Bankasında geçmiş sayılır ve 5434 sayılı Kanuna göre T. C. Emekli Sandığına verilmesi gereken kesenek ve karşılıkları kendileriyle mezkür birlikler tarafından ödenir. Memurun T.C. Ziraat Bankasının sosyal kuruluşlarındaki hakları aidat ödemek şartiyle devam eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu kanunda adı geçen bölge ve merkez birliklerinin kuruluş masrafları için kanunun yürürlüğe girdiği tarihten sonra kabul edilecek olan ilk Devlet Bütçesinden başlıyarak eşit taksitlerle 5 yıl içinde ödenmek üzere Türkiye Tarım Kredi Kooperatifleri Merkez Birliği emrine yüzmilyon lira yardım yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu kanunda sözü edilen yönetmelikler Merkez Birliği ilk Genel Kurul toplantısına kadar çıkarılır. Bu süre en geç beş yıldır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>T.K. Kooperatifleri Yardımlaşma Birliğinin, 1967/6-8677 sayılı Kararnameye istinaden T.K. Kooperatifleri adına gübre tedariki ve dağıtımı faaliyetinden elde ettiği ve edeceği karlar Kurumlar Vergisinden muaftır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Nitelikleri bu Kanunda gösterilen şartlara uymayan Merkez Birliği yönetim kurulu başkan ve üyeleriyle denetçilerinin görevleri bu Kanunun yayımı tarihinde sona erer.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu şekilde görevleri sona erenlerin yerlerine ilk genel kurula kadar görev yapmak üzere, gerekli nitelikleri taşıyanlar arasından Tarım Orman ve Köyişleri Bakanlığınca atama yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kooperatif, bölge birlikleri ve merkez birliğinin yapılacak ilk genel kurullarında, yönetim ve denetim organları, bu Kanun hükümlerine göre teşkil olunur. Genel Kurul toplantıları anasözleşmenin kabulünü takip eden aydan başlamak üzere en geç bir yıl içinde tamamlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Ancak, merkez birliği genel kurulu, bu Kanunun yayımı tarihinden sonraki altı ay içinde toplanamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Tarım Orman ve Köyişleri Bakanlığı, Hazine ve Dış Ticaret Müsteşarlığı ile T.C. Ziraat Bankası, Bölge Birlikleri ve Merkez Birliğinin yönetim ve denetim organlarının bu Kanun hükümlerine göre teşkilini beklemeksizin sözkonusu organlara kendi temsilcilerini tayin eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Kooperatifler, bölge birlikleri ve merkez birliği anasözleşmelerinde, bu Kanun doğrultusunda yapılacak değişiklikler en geç 3 ay içerisinde sonuçlandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yeni anasözleşmeler yürürlüğe girinceye kadar, mevcut anasözleşmelerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>1581 sayılı Tarım Kredi Kooperatifleri ve Birlikleri Kanunu ve ilgili anasözleşmeler ile diğer mevzuatta ve 14/12/1983 tarih ve 185 sayılı Kanun Hükmünde Kararnamede Tarım Kredi Kooperatifleri ve Birlikleri için, Ticaret Bakanlığna ve Bakanına veya Sanayi ve Ticaret Bakanlığına ve Bakanına verilen görev ve yetkiler, Tarım Orman ve Köyişleri Bakanlığına ve Bakanına devredilmiştir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="23" başlık="Yürürlüğe girme">
    <mvz-fıkra no="1">
      <template>Bu kanun yayımı tarihinden itibaren yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="24" başlık="Kanunu yürütecek makam">
    <mvz-fıkra no="1">
      <template>Bu kanun hükümlerini Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
