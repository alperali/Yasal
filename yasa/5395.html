  <mvz-künye tür="kanun" no="5395" başlık="ÇOCUK KORUMA KANUNU"
             tarih="3/7/2005" rgazete-tarih="15/7/2005" rgazete-sayı="25876"
             düstur-tertip="5" düstur-cilt="44" />
    
  <mvz-kısım no="1-BİRİNCİ" başlık="Amaç, Kapsam, Temel İlkeler, Koruyucu ve Destekleyici Tedbirler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam, Tanımlar ve Temel İlkeler">
      <mvz-madde no="1" başlık="Amaç">
        <mvz-fıkra no="1">
          <template>Bu Kanunun amacı, korunma ihtiyacı olan veya adli süreçteki çocukların korunmasına, haklarının ve esenliklerinin güvence altına alınmasına ilişkin usûl ve esasları düzenlemektir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Kapsam">
        <mvz-fıkra no="1">
          <template>Bu Kanun, korunma ihtiyacı olan çocuklar hakkında alınacak tedbirler ile adli süreçteki çocuklar hakkında uygulanacak güvenlik tedbirlerinin usûl ve esaslarına, çocuk mahkemelerinin kuruluş, görev ve yetkilerine ilişkin hükümleri kapsar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="Tanımlar">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanmasında;</template>
          <mvz-bent no="a">
            <template>Çocuk: Daha erken yaşta ergin olsa bile, onsekiz yaşını doldurmamış kişiyi; bu kapsamda,</template>
            <mvz-altbent no="1">
              <template>Korunma ihtiyacı olan çocuk: Bedensel, zihinsel, ahlaki, sosyal ve duygusal gelişimi ile kişisel güvenliği tehlikede olan, ihmal veya istismar edilen ya da suç mağduru çocuğu,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Adli süreçteki çocuk: Kanunlarda suç olarak tanımlanan bir fiili işlediği iddiası ile hakkında soruşturma veya kovuşturma yapılan ya da işlediği fiilden dolayı hakkında güvenlik tedbirine karar verilen çocuğu,</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Mahkeme: Çocuk mahkemeleri ile çocuk ağır ceza mahkemelerini,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Çocuk hâkimi: Hakkında kovuşturma başlatılmış olanlar hariç, adli süreçteki çocuklarla korunma ihtiyacı olan çocuklar hakkında uygulanacak tedbir kararlarını veren çocuk mahkemesi hâkimini,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kurum: Bu Kanun kapsamındaki çocuğun bakılıp gözetildiği, hakkında verilen tedbir kararlarının yerine getirildiği resmî veya özel kurumları,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Sosyal çalışma görevlisi: Psikolojik danışmanlık ve rehberlik, psikoloji, sosyoloji, çocuk gelişimi, öğretmenlik, aile ve tüketici bilimleri ve sosyal hizmet alanlarında eğitim veren kurumlardan mezun meslek mensuplarını,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>İfade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="Temel ilkeler">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanmasında, çocuğun haklarının korunması amacıyla;</template>
          <mvz-bent no="a">
            <template>Çocuğun yaşama, gelişme, korunma ve katılım haklarının güvence altına alınması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Çocuğun yarar ve esenliğinin gözetilmesi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Çocuk ve ailesinin herhangi bir nedenle ayrımcılığa tâbi tutulmaması,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Çocuk ve ailesi bilgilendirilmek suretiyle karar sürecine katılımlarının sağlanması,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Çocuğun, ailesinin, ilgililerin, kamu kurumlarının ve sivil toplum kuruluşlarının işbirliği içinde çalışmaları,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>İnsan haklarına dayalı, adil, etkili ve süratli bir usûl izlenmesi,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Soruşturma ve kovuşturma sürecinde çocuğun durumuna uygun özel ihtimam gösterilmesi,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Kararların alınmasında ve uygulanmasında, çocuğun yaşına ve gelişimine uygun eğitimini ve öğrenimini, kişiliğini ve toplumsal sorumluluğunu geliştirmesinin desteklenmesi,</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Çocuklar hakkında özgürlüğü kısıtlayıcı tedbirler ile hapis cezasına en son çare olarak başvurulması,</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Tedbir kararı verilirken kurumda bakım ve kurumda tutmanın son çare olarak görülmesi, kararların verilmesinde ve uygulanmasında toplumsal sorumluluğun paylaşılmasının sağlanması,</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Çocukların bakılıp gözetildiği, tedbir kararlarının uygulandığı kurumlarda yetişkinlerden ayrı tutulmaları,</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Çocuklar hakkında yürütülen işlemlerde, yargılama ve kararların yerine getirilmesinde kimliğinin başkaları tarafından belirlenememesine yönelik önlemler alınması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>İlkeleri gözetilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Koruyucu ve Destekleyici Tedbirler">
      <mvz-madde no="5" başlık="Koruyucu ve destekleyici tedbirler">
        <mvz-fıkra no="1">
          <template>Koruyucu ve destekleyici tedbirler, çocuğun öncelikle kendi aile ortamında korunmasını sağlamaya yönelik danışmanlık, eğitim, bakım, sağlık ve barınma konularında alınacak tedbirlerdir. Bunlardan;</template>
          <mvz-bent no="a">
            <template>Danışmanlık tedbiri, çocuğun bakımından sorumlu olan kimselere çocuk yetiştirme konusunda; çocuklara da eğitim ve gelişimleri ile ilgili sorunlarının çözümünde yol göstermeye,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Eğitim tedbiri, çocuğun bir eğitim kurumuna gündüzlü veya yatılı olarak devamına; iş ve meslek edinmesi amacıyla bir meslek veya sanat edinme kursuna gitmesine veya meslek sahibi bir ustanın yanına yahut kamuya ya da özel sektöre ait işyerlerine yerleştirilmesine,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bakım tedbiri, çocuğun bakımından sorumlu olan kimsenin herhangi bir nedenle görevini yerine getirememesi hâlinde, çocuğun resmî veya özel bakım yurdu ya da koruyucu aile hizmetlerinden yararlandırılması veya bu kurumlara yerleştirilmesine,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Sağlık tedbiri, çocuğun fiziksel ve ruhsal sağlığının korunması ve tedavisi için gerekli geçici veya sürekli tıbbî bakım ve rehabilitasyonuna, bağımlılık yapan maddeleri kullananların tedavilerinin yapılmasına,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Barınma tedbiri, barınma yeri olmayan çocuklu kimselere veya hayatı tehlikede olan hamile kadınlara uygun barınma yeri sağlamaya,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Yönelik tedbirdir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hakkında, birinci fıkranın (e) bendinde tanımlanan barınma tedbiri uygulanan kimselerin, talepleri hâlinde kimlikleri ve adresleri gizli tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tehlike altında bulunmadığının tespiti ya da tehlike altında bulunmakla birlikte veli veya vasisinin ya da bakım ve gözetiminden sorumlu kimsenin desteklenmesi suretiyle tehlikenin bertaraf edileceğinin anlaşılması hâlinde; çocuk, bu kişilere teslim edilir. Bu fıkranın uygulanmasında, çocuk hakkında birinci fıkrada belirtilen tedbirlerden birisine de karar verilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5/A" başlık="Yönlendirme tedbirleri">
        <mvz-fıkra no="1">
          <template>5 inci maddede düzenlenen koruyucu ve destekleyici tedbirlerin yanında bu maddede düzenlenen yönlendirme tedbirleri, ceza sorumluluğu olmayan adli süreçteki çocuklar bakımından, çocuklara özgü güvenlik tedbiri olarak anlaşılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yönlendirme tedbirleri olarak;</template>
          <mvz-bent no="a">
            <template>Sosyal ve toplumsal hizmetler tedbiri: Spor kulüpleri, gençlik merkezleri, spor tesisleri ile ilgili kamu kurum ve kuruluşlarında; Gençlik ve Spor Bakanlığı, Kültür ve Turizm Bakanlığı ile yerel yönetimler tarafından yerine getirilmek üzere çocukların 20 saatten 300 saate kadar psikososyal gelişimine katkı sağlayacak görev almalarına,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Dijital risklerden korunma tedbiri: Kullandığı telefon cihazı, telefon hattı veya her türlü bilgisayar, tablet ve benzeri dijital cihazın bildirilerek cihazın tedbir kararından sonraki hareketlerini Bilgi Teknolojileri ve İletişim Kurumu ile Siber Güvenlik Başkanlığı tarafından 3 aydan az 2 yıldan fazla olmamak üzere çeşitli takip yazılımlarıyla ilgili kurum denetimine açmaya, riskli olarak tanımlı bazı dijital mecralar, uygulamalar ve dijital platformlara erişimin engellenmesine,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kitap ve kütüphane tedbiri: Kütüphane ve okuma salonu gibi yerlerde Kültür ve Turizm Bakanlığı, Milli Eğitim Bakanlığı, üniversiteler ile yerel yönetimler tarafından yerine getirilmek üzere 20 saatten 300 saate kadar psikososyal gelişimine katkı sağlayacak görev almaya veya bu kuruluşların yetkililerince belirlenen eserleri okumaya,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Çevreye saygı ve çevre temizliği tedbiri: Tarım ve Orman Bakanlığı, Çevre, Şehircilik ve İklim Değişikliği Bakanlığı, üniversiteler ile yerel yönetimler tarafından yerine getirilmek üzere 20 saatten 300 saate kadar park, bahçe, sahil gibi belirlenecek bir bölgede çevre temizliği yapmaya, belirlenecek bitkilerin bakımı, ağaçlandırma ve çiçeklendirme faaliyetlerine katılmaya,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Tütün, nikotin, alkol, kumar, uyuşturucu ve uyarıcı madde ile davranışsal bağımlılık tedbiri: Sağlık Bakanlığı, Aile ve Sosyal Hizmetler Bakanlığı ve Yeşilay tarafından yerine getirilmek üzere çocukların sağlıkları için tehlike oluşturan bağımlılıklarının tedavi ve rehabilitasyonu için belirlenecek programları tamamlamaya,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>hükmedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu tedbirlerin yerine getirilmesinde 45 inci maddenin üçüncü ve dördüncü fıkraları uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Aile ve Sosyal Hizmetler Bakanlığı tarafından çıkarılacak yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Kuruma başvuru">
        <mvz-fıkra no="1">
          <template>Adlî ve idarî merciler, kolluk görevlileri, sağlık ve eğitim kuruluşları, sivil toplum kuruluşları, korunma ihtiyacı olan çocuğu Sosyal Hizmetler ve Çocuk Esirgeme Kurumuna bildirmekle yükümlüdür. Çocuk ile çocuğun bakımından sorumlu kimseler çocuğun korunma altına alınması amacıyla Sosyal Hizmetler ve Çocuk Esirgeme Kurumuna başvurabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sosyal Hizmetler ve Çocuk Esirgeme Kurumu kendisine bildirilen olaylarla ilgili olarak gerekli araştırmayı derhâl yapar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Koruyucu ve destekleyici tedbir kararı alınması">
        <mvz-fıkra no="1">
          <template>Çocuklar hakkında koruyucu ve destekleyici tedbir kararı; çocuğun anası, babası, vasisi, bakım ve gözetiminden sorumlu kimse, Sosyal Hizmetler ve Çocuk Esirgeme Kurumu ve Cumhuriyet savcısının istemi üzerine veya re'sen çocuk hâkimi tarafından alınabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tedbir kararı verilmeden önce çocuk hakkında sosyal inceleme yaptırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tedbirin türü kararda gösterilir. Bir veya birden fazla tedbire karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Hâkim, hakkında koruyucu ve destekleyici tedbire karar verdiği çocuğun denetim altına alınmasına da karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Hâkim, çocuğun gelişimini göz önünde bulundurarak koruyucu ve destekleyici tedbirin kaldırılmasına veya değiştirilmesine karar verebilir. Bu karar acele hâllerde, çocuğun bulunduğu yer hâkimi tarafından da verilebilir. Ancak bu durumda karar, önceki kararı alan hâkim veya mahkemeye bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Tedbirin uygulanması, onsekiz yaşın doldurulmasıyla kendiliğinden sona erer. Ancak hâkim, eğitim ve öğrenimine devam edebilmesi için ve rızası alınmak suretiyle tedbirin uygulanmasına belli bir süre daha devam edilmesine karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Mahkeme, korunma ihtiyacı olan çocuk hakkında, koruyucu ve destekleyici tedbir kararının yanında 22.11.2001 tarihli ve 4721 sayılı Türk Medenî Kanunu hükümlerine göre velayet, vesayet, kayyım, nafaka ve kişisel ilişki kurulması hususlarında da karar vermeye yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Tedbirlerde yetki">
        <mvz-fıkra no="1">
          <template>Korunma ihtiyacı olan çocuklar hakkında koruyucu ve destekleyici tedbirler, çocuğun menfaatleri bakımından kendisinin, ana, baba, vasisi veya birlikte yaşadığı kimselerin bulunduğu yerdeki çocuk hâkimince alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tedbir kararlarının uygulanması, kararı veren hâkim veya mahkemece en geç üçer aylık sürelerle incelettirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hâkim veya mahkeme; denetim memurları, çocuğun velisi, vasisi, bakım ve gözetimini üstlenen kimselerin, tedbir kararını yerine getiren kişi ve kuruluşun temsilcisi ile Cumhuriyet savcısının talebi üzerine veya re'sen çocuğa uygulanan tedbirin sonuçlarını inceleyerek kaldırabilir, süresini uzatabilir veya değiştirebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Acil korunma kararı alınması">
        <mvz-fıkra no="1">
          <template>Derhâl korunma altına alınmasını gerektiren bir durumun varlığı hâlinde çocuk, Sosyal Hizmetler ve Çocuk Esirgeme Kurumu tarafından bakım ve gözetim altına alındıktan sonra acil korunma kararının alınması için Kurum tarafından çocuğun Kuruma geldiği tarihten itibaren en geç beş gün içinde çocuk hâkimine müracaat edilir. Hâkim tarafından, üç gün içinde talep hakkında karar verilir. Hâkim, çocuğun bulunduğu yerin gizli tutulmasına ve gerektiğinde kişisel ilişkinin tesisine karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Acil korunma kararı en fazla otuz günlük süre ile sınırlı olmak üzere verilebilir. Bu süre içinde Kurumca çocuk hakkında sosyal inceleme yapılır. Kurum, yaptığı inceleme sonucunda, tedbir kararı alınmasının gerekmediği sonucuna varırsa bu yöndeki görüşünü ve sağlayacağı hizmetleri hâkime bildirir. Çocuğun, ailesine teslim edilip edilmeyeceğine veya uygun görülen başkaca bir tedbire hâkim tarafından karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kurum, çocuk hakkında tedbir kararı alınması gerektiği sonucuna varırsa hâkimden koruyucu ve destekleyici tedbir kararı verilmesini talep eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Akıl hastalığı, akıl zayıflığı, alkol, uyuşturucu veya uyarıcı madde bağımlılığı, davranışsal bağımlılık ya da ağır tehlike arz eden bulaşıcı hastalık nedeniyle kendisi veya başkaları açısından ciddi tehlike oluşturduğu değerlendirilen ve herhangi bir suretle Sağlık Bakanlığına veya üniversitelere bağlı yataklı sağlık kurumlarına gelen veya getirilen çocuk hakkında, tedaviye ihtiyaç bulunduğunun ilgili uzman hekim tarafından tespit edilmesi hâlinde, acil korunma kararı alınması amacıyla yirmi dört saat içinde rapor düzenlenir. Sağlık kurumu, uzman hekim raporunun düzenlendiği tarihten itibaren en geç yirmi dört saat içinde çocuk hâkimine başvurur. Başvurudan itibaren en geç kırk sekiz saat içinde ilgili dal uzman hekiminin yer aldığı üç uzman hekimden oluşan resmî sağlık kurulu tarafından düzenlenen rapor mahkemeye sunulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Hâkim, başvuru ve sağlık kurulu raporunu değerlendirerek talep hakkında en geç kırk sekiz saat içinde karar verir. Çocuğun sağlık kuruluşuna gelmesi veya getirilmesinden hâkim kararının sağlık kuruluşuna tebliğine kadar geçen sürede, çocuğa gerekli görülen tıbbî müdahale ve tedavi uygulanır. Bu süreçte ihtiyaç duyulması hâlinde kolluktan yardım istenebilir. Kolluk, bu kapsamda yapılan talepleri, kanunla kendisine tanınan yetkiler çerçevesinde yerine getirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Hâkim, çocuğun üstün yararını gözeterek çocuğun bulunduğu yerin gizli tutulmasına ve gerekli görmesi hâlinde kişisel ilişkinin kurulmasına veya sınırlandırılmasına karar verebilir. Hâkim, sağlık kurulu raporunu dikkate alarak acil korunma kararının kaldırılmasına, devamına veya çocuğun durumuna uygun başka bir koruyucu ve destekleyici tedbire karar verir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Bakım ve barınma kararlarının yerine getirilmesi">
        <mvz-fıkra no="1">
          <template>Sosyal Hizmetler ve Çocuk Esirgeme Kurumu tarafından, kendisine intikal eden olaylarda gerekli önlemler derhâl alınarak çocuk, resmî veya özel kuruluşlara yerleştirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Çocuklara özgü güvenlik tedbiri">
        <mvz-fıkra no="1">
          <template>Bu Kanunda düzenlenen koruyucu ve destekleyici tedbirler, hakkında adli süreç yürütülen ve ceza sorumluluğu olmayan çocuklar bakımından, çocuklara özgü güvenlik tedbiri olarak anlaşılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Akıl hastalığı">
        <mvz-fıkra no="1">
          <template>Adli süreçteki çocuğun aynı zamanda akıl hastası olması hâlinde, 26.9.2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 31 inci maddesinin birinci ve ikinci fıkraları kapsamına giren çocuklar hakkında, çocuklara özgü güvenlik tedbirleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Tedbir kararlarında usûl">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 7 nci maddesinin yedinci fıkrasında öngörülen durumlar hariç olmak üzere, hakkında adli süreç yürütülen ve ceza sorumluluğu olmayan çocuklarla korunma ihtiyacı olan çocuklar hakkında duruşma yapılmaksızın tedbir kararı verilir. Ancak, hâkim zaruret gördüğü hâllerde duruşma yapabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tedbir kararının verilmesinden önce yeterli idrak gücüne sahip olan çocuğun görüşü alınır, ilgililer dinlenebilir, çocuk hakkında sosyal inceleme raporu düzenlenmesi istenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Kanun yolu">
        <mvz-fıkra no="1">
          <template>Bu Kanun hükümlerine göre, çocuk hâkimi tarafından alınan tedbir kararlarına karşı itiraz yolu açıktır. İtiraz, 4.12.2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun itiraza ilişkin hükümlerine göre en yakın çocuk mahkemesine yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Soruşturma ve Kovuşturma">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Soruşturma">
      <mvz-madde no="15" başlık="Soruşturma">
        <mvz-fıkra no="1">
          <template>Adli süreçteki çocuk hakkındaki soruşturma çocuk bürosunda görevli Cumhuriyet savcısı tarafından bizzat yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Çocuğun ifadesinin alınması veya çocuk hakkındaki diğer işlemler sırasında, çocuğun yanında sosyal çalışma görevlisi bulundurulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Cumhuriyet savcısı soruşturma sırasında gerekli görüldüğünde çocuk hakkında koruyucu ve destekleyici tedbirlerin uygulanmasını çocuk hâkiminden isteyebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Çocuk hakkında kamu davası açılması hâlinde durum, gerekli idari tedbirlerin alınması amacıyla Aile ve Sosyal Hizmetler Bakanlığı ve Milli Eğitim Bakanlığı il veya ilçe müdürlüklerine bildirilir.</template>
        </mvz-fıkra>  
      </mvz-madde>
      <mvz-madde no="16" başlık="Çocuğun gözaltında tutulması">
        <mvz-fıkra no="1">
          <template>Gözaltına alınan çocuklar, kolluğun çocuk biriminde tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kolluğun çocuk biriminin bulunmadığı yerlerde çocuklar, gözaltına alınan yetişkinlerden ayrı bir yerde tutulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="İştirak hâlinde işlenen suçlar">
        <mvz-fıkra no="1">
          <template>Çocukların yetişkinlerle birlikte suç işlemesi hâlinde, soruşturma ve kovuşturma ayrı yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu hâlde de çocuklar hakkında gerekli tedbirler uygulanmakla beraber, mahkeme lüzum gördüğü takdirde çocuk hakkındaki yargılamayı genel mahkemedeki davanın sonucuna kadar bekletebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Davaların birlikte yürütülmesinin zorunlu görülmesi hâlinde, genel mahkemelerde, yargılamanın her aşamasında, mahkemelerin uygun bulması şartıyla birleştirme kararı verilebilir. Bu takdirde birleştirilen davalar genel mahkemelerde görülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Çocuğun nakli">
        <mvz-fıkra no="1">
          <template>Çocuklara zincir, kelepçe ve benzeri aletler takılamaz. Ancak; zorunlu hâllerde çocuğun kaçmasını, kendisinin veya başkalarının hayat veya beden bütünlükleri bakımından doğabilecek tehlikeleri önlemek için kolluk tarafından gerekli önlem alınabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Kamu davasının açılmasının ertelenmesi">
        <mvz-fıkra no="1">
          <template>Çocuğa yüklenen suçtan dolayı Ceza Muhakemesi Kanunundaki koşulların varlığı halinde, kamu davasının açılmasının ertelenmesi kararı verilebilir. Ancak, bu kişiler açısından erteleme süresi üç yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ceza Muhakemesi Kanununun 171 inci maddesinin ikinci fıkrasında belirtilen hapis cezasının üst sınırı, on beş yaşını doldurmamış çocuklar bakımından beş yıl olarak uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="Adlî kontrol">
        <mvz-fıkra no="1">
          <template>Adli süreçteki çocuklar hakkında soruşturma veya kovuşturma evrelerinde adlî kontrol tedbiri olarak Ceza Muhakemesi Kanununun 109 uncu maddesinde sayılanlar ile aşağıdaki tedbirlerden bir ya da birkaçına karar verilebilir:</template>
          <mvz-bent no="a">
            <template>Belirlenen çevre sınırları dışına çıkmamak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Belirlenen bazı yerlere gidememek veya ancak bazı yerlere gidebilmek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Belirlenen kişi ve kuruluşlarla ilişki kurmamak.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak bu tedbirlerden sonuç alınamaması, sonuç alınamayacağının anlaşılması veya tedbirlere uyulmaması durumunda tutuklama kararı verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Denetimli serbestlik müdürlüğü tarafından takip edilen çocuk için adli kontrol süresince rehberlik edecek bir uzman görevlendirilir ve çocuk hakkında yapılacak ihtiyaç değerlendirmesine göre iyileştirme çalışmaları yürütülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="Tutuklama yasağı">
        <mvz-fıkra no="1">
          <template>Onbeş yaşını doldurmamış çocuklar hakkında üst sınırı beş yılı aşmayan hapis cezasını gerektiren fiillerinden dolayı tutuklama kararı verilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Kovuşturma">
      <mvz-madde no="22" başlık="Duruşma">
        <mvz-fıkra no="1">
          <template>Çocuk, velisi, vasisi, mahkemece görevlendirilmiş sosyal çalışma görevlisi, çocuğun bakımını üstlenen aile ve kurumda bakılıyorsa kurumun temsilcisi duruşmada hazır bulunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme veya hâkim, çocuğun sorgusu veya çocuk hakkındaki diğer işlemler sırasında çocuğun yanında sosyal çalışma görevlisi bulundurabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Duruşmalarda hazır bulunan çocuk, yararı gerektirdiği takdirde duruşma salonundan çıkarılabileceği gibi sorgusu yapılmış çocuğun duruşmada hazır bulundurulmasına da gerek görülmeyebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Hükmün açıklanmasının geri bırakılması">
        <mvz-fıkra no="1">
          <template>Çocuğa yüklenen suçtan dolayı yapılan yargılama sonunda, Ceza Muhakemesi Kanunundaki koşulların varlığı halinde, mahkemece hükmün açıklanmasının geri bırakılmasına karar verilebilir. Ancak, bu kişiler açısından denetim süresi üç yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Adli süreçteki çocuklar hakkında yapılan yargılama sonunda hükmün açıklanmasının geri bırakılması kararı verilmesi hâlinde 5/A maddesinde düzenlenen yönlendirme tedbirlerinden uygun görülen biri veya birkaçı da denetimli serbestlik tedbiri olarak uygulanır. Bu fıkra uyarınca hükmedilecek yükümlülükler 5/A maddesinde belirtilen kurumlar tarafından yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Suçun işlenmesi nedeniyle mağdurun veya kamunun uğradığı zararın az olması hâlinde adli süreçteki çocuklar hakkında hükmün açıklanmasının geri bırakılması kararı verilebilmesi için zararın giderilmesi şartı aranmayabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="Uzlaşma">
        <mvz-fıkra no="1">
          <template>Ceza Muhakemesi Kanununun uzlaşmaya ilişkin hükümleri adli süreçteki çocuklar bakımından da uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Mahkemeler ve Cumhuriyet Savcılığı">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Mahkemelerin Kuruluş, Görev ve Yetkisi">
      <mvz-madde no="25" başlık="Mahkemelerin kuruluşu">
        <mvz-fıkra no="1">
          <template>Çocuk mahkemesi, tek hâkimden oluşur. Bu mahkemeler her il merkezinde kurulur. Ayrıca, bölgelerin coğrafi durumları ve iş yoğunluğu göz önünde tutularak belirlenen ilçelerde Hâkimler ve Savcılar Yüksek Kurulunun olumlu görüşü alınarak kurulabilir. İş durumunun gerekli kıldığı yerlerde çocuk mahkemelerinin birden fazla dairesi oluşturulabilir. Bu daireler numaralandırılır. Çocuk mahkemelerinde yapılan duruşmalarda Cumhuriyet savcısı bulunmaz. Mahkemelerin bulunduğu yerlerdeki Cumhuriyet savcıları, çocuk mahkemeleri kararlarına karşı kanun yoluna başvurabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Çocuk ağır ceza mahkemelerinde bir başkan ile yeteri kadar üye bulunur ve mahkeme bir başkan ve iki üye ile toplanır. Bu mahkemeler bölgelerin coğrafi durumları ve iş yoğunluğu göz önünde tutularak belirlenen yerlerde Hâkimler ve Savcılar Yüksek Kurulunun olumlu görüşü alınarak kurulur. İş durumunun gerekli kıldığı yerlerde çocuk ağır ceza mahkemelerinin birden fazla dairesi oluşturulabilir. Bu daireler numaralandırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Mahkemelerin görevi">
        <mvz-fıkra no="1">
          <template>Çocuk mahkemesi, asliye ceza mahkemesi ile sulh ceza mahkemesinin görev alanına giren suçlar bakımından, adli süreçteki çocuklar hakkında açılacak davalara bakar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Çocuk ağır ceza mahkemesi, çocuklar tarafından işlenen ve ağır ceza mahkemesinin görev alanına giren suçlarla ilgili davalara bakar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkemeler ve çocuk hâkimi, bu Kanunda ve diğer kanunlarda yer alan tedbirleri almakla görevlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Çocuklar hakkında açılan kamu davaları, Kanunun 17 nci maddesi hükümleri saklı kalmak kaydıyla bu Kanunla kurulan mahkemelerde görülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Mahkemelerin yargı çevresi">
        <mvz-fıkra no="1">
          <template>Çocuk mahkemelerinin yargı çevresi, kurulduğu il ve ilçenin mülkî sınırlarıyla belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Çocuk ağır ceza mahkemelerinin yargı çevresi, bulundukları il merkezi ve ilçeler ile bunlara adlî yönden bağlanan ilçelerin idarî sınırlarıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Coğrafi durum ve iş yoğunluğu göz önünde tutularak çocuk mahkemeleri ile çocuk ağır ceza mahkemelerinin yargı çevresinin belirlenmesine veya değiştirilmesine Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Yüksek Kurulunca karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="Hâkimlerin atanmaları">
        <mvz-fıkra no="1">
          <template>Mahkemelere, atanacakları bölgeye veya bir alt bölgeye hak kazanmış, adlî yargıda görevli, tercihan çocuk hukuku alanında uzmanlaşmış, çocuk psikolojisi ve sosyal hizmet alanlarında eğitim almış olan hâkimler ve Cumhuriyet savcıları arasından Hâkimler ve Savcılar Yüksek Kurulunca atama yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Atamalarda istekli olanlarla daha önce bu görevlerde bulunmuş olanlara öncelik tanınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Herhangi bir nedenle görevine gelemeyen hâkimin yerine bu hâkim görevine başlayıncaya veya Hâkimler ve Savcılar Yüksek Kurulunca yetkilendirme yapılıncaya kadar o yerdeki hâkimlerden hangisinin bakacağı, birinci fıkrada aranan nitelikler de gözetilerek adlî yargı adalet komisyonu başkanınca belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Cumhuriyet Savcılığı ve Kolluk">
      <mvz-madde no="29" başlık="Cumhuriyet savcılığı çocuk bürosu">
        <mvz-fıkra no="1">
          <template>Cumhuriyet başsavcılıklarında bir çocuk bürosu kurulur. Cumhuriyet başsavcısınca 28 inci maddenin birinci fıkrasında öngörülen nitelikleri haiz olanlar arasından yeterli sayıda Cumhuriyet savcısı, bu büroda görevlendirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="Çocuk bürosunun görevleri">
        <mvz-fıkra no="1">
          <template>Çocuk bürosunun görevleri;</template>
          <mvz-bent no="a">
            <template>Adli süreçteki çocuklar hakkındaki soruşturma işlemlerini yürütmek,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Çocuklar hakkında tedbir alınması gereken durumlarda, gecikmeksizin tedbir alınmasını sağlamak,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Korunma ihtiyacı olan, suç mağduru veya adli süreçteki çocuklardan yardıma, eğitime, işe, barınmaya ihtiyacı olan veya uyum güçlüğü çekenlere ihtiyaç duydukları destek hizmetlerini sağlamak üzere, ilgili kamu kurum ve kuruluşları ve sivil toplum kuruluşlarıyla işbirliği içinde çalışmak, bu gibi durumları çocukları korumakla görevli kurum ve kuruluşlara bildirmek,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Bu Kanunla ve diğer kanunlarla verilen görevleri yerine getirmektir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gecikmesinde sakınca bulunan hâllerde, bu görevler çocuk bürosunda görevli olmayan Cumhuriyet savcıları tarafından da yerine getirilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="Kolluğun çocuk birimi">
        <mvz-fıkra no="1">
          <template>Çocuklarla ilgili kolluk görevi, öncelikle kolluğun çocuk birimleri tarafından yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kolluğun çocuk birimi, korunma ihtiyacı olan veya adli süreçteki çocuklar hakkında işleme başlandığında durumu, çocuğun veli veya vasisine veya çocuğun bakımını üstlenen kimseye, baroya ve Sosyal Hizmetler ve Çocuk Esirgeme Kurumuna, çocuk resmî bir kurumda kalıyorsa ayrıca kurum temsilcisine bildirir. Ancak, çocuğu suça azmettirdiğinden veya istismar ettiğinden şüphelenilen yakınlarına bilgi verilmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Çocuk, kollukta bulunduğu sırada yanında yakınlarından birinin bulunmasına imkân sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kolluğun çocuk birimlerindeki personeline, kendi kurumları tarafından çocuk hukuku, çocuk suçluluğunun önlenmesi, çocuk gelişimi ve psikolojisi, sosyal hizmet gibi konularda eğitim verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Çocuğun korunma ihtiyacı içinde bulunduğunun bildirimi ya da tespiti veya hakkında acil korunma kararı almak için beklemenin, çocuğun yararına aykırı olacağını gösteren nedenlerin varlığı hâlinde kolluğun çocuk birimi, durumun gerektirdiği önlemleri almak suretiyle çocuğun güvenliğini sağlar ve mümkün olan en kısa sürede Sosyal Hizmetler ve Çocuk Esirgeme Kurumuna teslim eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="Görevlilerin eğitimleri">
        <mvz-fıkra no="1">
          <template>Mahkemelerde görevlendirilecek hâkimler ve Cumhuriyet savcıları ile sosyal çalışma görevlilerine ve denetimli serbestlik ve yardım merkezi şube müdürlüğünde görevli denetim görevlilerine, adaylık dönemlerinde Adalet Bakanlığınca belirlenen esaslara uygun çocuk hukuku, sosyal hizmet, çocuk gelişimi ve psikolojisi gibi konularda eğitim verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkemelere görevlendirilenlerin, görevleri süresince, alanlarında uzmanlaşmalarını sağlama ve kendilerini geliştirmelerine yönelik hizmet içi eğitim almaları sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hizmet öncesi ve hizmet içi eğitimin usûl ve esasları yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Sosyal İnceleme">
      <mvz-madde no="33" başlık="Sosyal çalışma görevlileri">
        <mvz-fıkra no="1">
          <template>Adalet Bakanlığınca en az lisans öğrenimi görmüş olanlar arasından yeterli sayıda sosyal çalışma görevlisi mahkemelere görevlendirilmek üzere adli destek ve mağdur hizmetleri müdürlüğüne atanır. Atamada; çocuk ve aile sorunları ile çocuk hukuku ve çocuk suçluluğunun önlenmesi alanlarında lisansüstü eğitim yapmış olanlar tercih edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanun kapsamındaki tedbirleri uygulayan sosyal çalışma görevlileri ile adli destek ve mağdur hizmetleri müdürlüğü bünyesinde görev yapmakta olup da mahkemelere görevlendirilen sosyal çalışma görevlilerine almakta oldukları aylıklarının  brüt tutarının yüzde ellisi oranında ödeme yapılır. Bu ödeme aynı veya benzer ünvanlı memur kadrosunda çalışan, hizmet yılı ve öğrenim durumu aynı olan emsali personel esas alınmak suretiyle bu kapsamda görev yapan sözleşmeli personele de yapılır. Bu ödeme, söz konusu personelin kadro veya pozisyonunun bulunduğu kurum tarafından yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci fıkra kapsamındaki sosyal çalışma görevlilerinin bulunmaması, görevin bunlar tarafından yapılmasında fiilî veya hukukî bir engel bulunması ya da başka bir uzmanlık dalına ihtiyaç duyulması gibi durumlarda, diğer kamu kurum ve kuruluşlarında çalışanlar ile serbest meslek icra eden birinci fıkrada öngörülen nitelikleri haiz kimseler de sosyal çalışma görevlisi olarak görevlendirilebilirler.  Bu şekilde görevlendirilenlere ayrıca ikinci fıkra kapsamında ödeme yapılmaz.2</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Hakkında sosyal inceleme yapılacak çocuğun, incelemeye tâbi tutulacak çevresi mahkemenin yetki alanı dışında ise, davayı gören mahkemenin talimatına bağlı olarak çocuğun bulunduğu yerdeki mahkemece inceleme yaptırılır. Büyükşehir belediye sınırları içinde kalan yerlerde bu inceleme, davayı gören mahkemeye bağlı olarak çalışan sosyal çalışma görevlilerince yapılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="34" başlık="Sosyal çalışma görevlilerinin görevleri">
        <mvz-fıkra no="1">
          <template>Sosyal çalışma görevlilerinin görevi;</template>
          <mvz-bent no="a">
            <template>Görevlendirildikleri çocuk hakkında derhâl sosyal inceleme yapmak, hazırladıkları raporları kendilerini görevlendiren mercie sunmak,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Adli süreçteki çocuğun ifadesinin alınması veya sorgusu sırasında yanında bulunmak,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bu Kanun kapsamında mahkemeler ve çocuk hâkimleri tarafından verilen diğer görevleri yerine getirmektir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İlgililer, sosyal çalışma görevlilerinin çalışmaları sırasında kendilerine yardımcı olmak ve çocuk hakkında istenen bilgileri vermek zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sosyal çalışma görevlilerinin, görevleri sırasında yaptıkları ve hâkim tarafından takdir edilen masrafları Cumhuriyet başsavcılığının suçüstü ödeneğinden ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35" başlık="Sosyal inceleme">
        <mvz-fıkra no="1">
          <template>Bu Kanun kapsamındaki çocuklar hakkında mahkemeler, çocuk hâkimleri veya Cumhuriyet savcılarınca gerektiğinde çocuğun bireysel özelliklerini ve sosyal çevresini gösteren inceleme yaptırılır. Sosyal inceleme raporu, çocuğun, işlediği fiilin hukukî anlam ve sonuçlarını algılama ve bu fiille ilgili olarak davranışlarını yönlendirme yeteneğinin mahkeme tarafından takdirinde göz önünde bulundurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Derhâl tedbir alınmasını gerektiren durumlarda sosyal inceleme daha sonra da yaptırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Onbeş yaşını doldurmamış çocuk hakkında sosyal inceleme yaptırılması zorunludur. Cumhuriyet savcısı, mahkeme veya çocuk hâkimi tarafından onbeş yaşını doldurmuş çocuk hakkında sosyal inceleme yaptırılmaması hâlinde, gerekçesi iddianamede veya kararda gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Denetim">
      <mvz-madde no="36" başlık="Denetim altına alma kararı">
        <mvz-fıkra no="1">
          <template>Hakkında koruyucu ve destekleyici tedbir kararı verilen, kamu davasının açılmasının ertelenmesi kararı onanan, hükmün açıklanmasının geri bırakılması kararı verilen çocuğun denetim altına alınmasına karar verilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="Denetim görevlisinin görevlendirilmesi">
        <mvz-fıkra no="1">
          <template>Denetim altına alınan çocukla ilgili olarak denetimli serbestlik ve yardım merkezi şube müdürlüğü tarafından bir denetim görevlisi görevlendirilir. Ancak, korunma ihtiyacı olan çocuklar veya suç tarihinde oniki yaşını bitirmemiş adli süreçteki çocuklar ile çocuğun aileye teslimi yönünde karar verilmesi hâlinde, bu çocuklar hakkında denetim görevi gözetim esaslarına göre Sosyal Hizmetler ve Çocuk Esirgeme Kurumu tarafından yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Görevlendirme sırasında çocuğun kişisel özellik ve ihtiyaçları dikkate alınır ve çocuğa kolay ulaşabilecek olanlar tercih edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="Denetim görevlisinin görevleri">
        <mvz-fıkra no="1">
          <template>Denetim görevlisinin görevleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Kararla ulaşılmak istenen amacın gerçekleşmesi için çocuğun eğitim, aile, kurum, iş ve sosyal çevreye uyumunu sağlamak üzere onu desteklemek, yardımcı olmak, gerektiğinde önerilerde bulunmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Çocuğa eğitim, iş, destek alabileceği kurumlar, hakları ve haklarını kullanma konularında rehberlik etmek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İhtiyaç duyacağı hizmetlerden yararlanmasında çocuğa yardımcı olmak.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kaldığı yerleri ve ilişki kurduğu kişileri ziyaret ederek çocuğun içinde yaşadığı şartları, ailesi ve çevresiyle ilişkilerini, eğitim ve iş durumunu, boş zamanlarını değerlendirme faaliyetlerini yerinde incelemek.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Alınan kararın uygulanmasını, bu uygulamanın sonuçlarını ve çocuk üzerindeki etkilerini izlemek, tâbi tutulduğu yükümlülüklerin yerine getirilmesini denetlemek.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Çocuğun gelişimi hakkında, üçer aylık sürelerle Cumhuriyet savcısı veya mahkemeye rapor vermek.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Denetim görevlisi, görevini yerine getirirken gerektiğinde çocuğun ana ve babası, vasisi, bakım ve gözetiminden sorumlu kimse ve öğretmenleriyle işbirliği yapar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Çocuğun ana ve babası, vasisi, bakım ve gözetiminden sorumlu kimse çocuğun devam ettiği okul, işyeri veya çocukla ilgili bilgiye sahip kurumların yetkilileri, denetim görevlisine yardımcı olmak, görevi gereğince istediği bilgileri vermek zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Çocuğun yakınları denetim görevlisinin yetkilerine müdahale edemezler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="Denetim plânı ve raporu">
        <mvz-fıkra no="1">
          <template>Çocuğa uygulanacak denetimin yöntemi, denetim görevlisince, sosyal incelemeyi yapan uzman veya sosyal çalışma görevlisi ile birlikte, görevlendirmeyi takip eden on gün içinde hazırlanacak bir plânla belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Denetim plânı hazırlanırken;</template>
          <mvz-bent no="a">
            <template>Çocuk hakkında alınan tedbirin amacı, niteliği ve süresi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Çocuğun ihtiyaçları,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Çocuğun içinde bulunduğu tehlike hâlinin ciddiyeti,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Çocuğun ana ve babası, vasisi, bakım ve gözetiminden sorumlu kimse tarafından çocuğa verilen desteğin derecesi,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Hakkında adli süreç yürütülmesi sebebiyle tedbir alınmış ise suç teşkil eden fiilin mahiyeti,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Çocuğun görüşü,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Denetim plânı, mahkeme veya çocuk hâkimince onaylandıktan sonra derhâl uygulanır. Denetim görevlisi, kararın uygulama biçimi, çocuk üzerindeki etkileri ile çocuğun ana ve babası, vasisi, bakım ve gözetiminden sorumlu kimselerin veya kurumların çocuğa karşı sorumluluklarını gereğince yerine getirip getirmedikleri, kararın değiştirilmesini gerektirir bir durum olup olmadığı ve istenen diğer hususlarda her ay, ayrıca talep hâlinde mahkeme veya çocuk hâkimine rapor verir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="40" başlık="Denetimin sona ermesi">
        <mvz-fıkra no="1">
          <template>Denetim, kararda öngörülen sürenin dolmasıyla sona erer. Tedbirden beklenen yararın elde edilmesi hâlinde denetim, sürenin dolmasından önce de kaldırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Denetim, çocuğun başka bir suçtan dolayı tutuklanması veya cezasının yerine getirilmesine başlanmakla sona erer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="41" başlık="Sosyal inceleme ve denetim raporları hakkında bilgi edinme">
        <mvz-fıkra no="1">
          <template>Sosyal inceleme raporu ile denetim plânı ve raporunun birer örneğini çocuğun avukatı veya yasal temsilcisi Cumhuriyet savcısından, mahkemeden veya çocuk hâkiminden alabilir. Çocuğa raporun içeriği hakkında bilgi verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, çocuk ve avukatı hariç olmak üzere birinci fıkrada gösterilen kişilerin sosyal inceleme raporu ile denetim plânı ve raporu hakkında bilgi sahibi olmasının çocuğun yararına aykırı olduğuna kanaat getirilirse, bunların incelenmesi kısmen veya tamamen yasaklanabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Çocuk Teslimi ve Çocukla Kişisel İlişki Kurulması">
    <mvz-madde no="41/A" başlık="Görevli ve yetkili birim">
      <mvz-fıkra no="1">
        <template>Çocuk teslimi veya çocukla kişisel ilişki kurulmasına dair aile mahkemeleri tarafından verilen ilam veya tedbir kararları, çocuğun üstün yararı esas alınarak, Adalet Bakanlığınca kurulan adli destek ve mağdur hizmetleri müdürlüklerince bu Kısım hükümlerine göre yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Müdürlüklerde müdür, yeteri kadar müdür yardımcısı ve personel ile psikolog, pedagog ve sosyal çalışmacı Adalet Bakanlığı tarafından görevlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Müdürlük bulunmayan yerlerde bu Kısım kapsamında yer alan görevler, Adalet Bakanlığınca belirlenen hukuk mahkemeleri yazı işleri müdürlüğü tarafından yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İlam ve tedbir kararlarının yerine getirilmesinde çocuğun yerleşim yeri müdürlüğü yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İlam ve tedbir kararları müdürlük tarafından görevlendirilen psikolog, pedagog, sosyal çalışmacı, çocuk gelişimci ve rehber öğretmen gibi uzmanlar, uzmanın bulunmadığı yerlerde ise öğretmen marifetiyle yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İlam ve tedbir kararlarını yerine getirmek için müdürlüğün talebi üzerine, valilikler tarafından kamu kurum ve kuruluşlarında görevli, beşinci fıkrada belirtilen uzmanların yer aldığı bir görevli listesi oluşturulur. Bu uzmanların yeterli sayıda olmaması hâlinde öğretmenler de listeye dâhil edilir. Bu listede yer alan uzman ve öğretmenlerin görev yapacakları yer ve tarihler müdürlükler tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41/B" başlık="Çocuk teslimine dair ilam veya tedbir kararlarının yerine getirilmesi">
      <mvz-fıkra no="1">
        <template>Çocuk teslimine dair ilam veya tedbir kararları, yükümlüsü tarafından rızasıyla yerine getirilmediği takdirde hak sahibi, ilam veya tedbir kararının yerine getirilmesi için müdürlüğe başvurabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Talebi alan müdürlük, her türlü iletişim vasıtasını kullanarak yükümlüyle irtibata geçer ve müdürlük tarafından belirlenen gün ve saatte hak sahibine teslim edilmek üzere çocuğun belirlenen yere getirilmesini derhâl bildirir; bu bildirimin yapıldığını veya yükümlüyle irtibat kurulamadığını tutanağa bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yükümlüyle irtibat kurulamaz veya yükümlü çocuğu getirmeyeceğini beyan ederse yahut yükümlü çocuğu belirlenen yere getirmezse müdürlük, derhâl yükümlüye, çocuğun teslimine dair bir teslim emri gönderir. Emir, 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümlerine göre yükümlüye tebliğ edilir. Bu emirde aşağıdaki hususlar yer alır:</template>
        <mvz-bent no="a">
          <template>Müdürlük tarafından belirlenen gün ve saatte çocuğu emirde belirtilen yere getirmek zorunda olduğu.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Çocuğu emirde belirtilen yere getirmesine engel teşkil edecek derecede haklı bir mazereti varsa teslim gününden önce müdürlüğe bildirimde bulunarak çocuğun müdürlükçe alınmasını talep etmesi gerektiği.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Çocuğu getirmez veya haklı mazereti nedeniyle müdürlükçe alınmasını talep etmezse, çocuğun, uzman veya öğretmen marifetiyle gerekirse kolluktan yardım alınarak ve zor kullanılarak teslim alınacağı.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Emrin gereğinin yerine getirilmemesi hâlinde disiplin hapsiyle cezalandırılacağı.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Müdürlükçe yapılan iş ve işlemlere karşı, öğrenme veya tebliğ tarihinden itibaren bir hafta içinde, işlemi yapan müdürlüğün bulunduğu yer aile mahkemesine şikâyette bulunabileceği.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Müdürlüğün belirlediği yere getirilen veya yükümlünün haklı mazereti nedeniyle müdürlükçe alınan çocuk hak sahibine teslim edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yükümlü, emrin gereğini yerine getirmezse, çocuk nerede bulunursa bulunsun müdürlük tarafından alınarak hak sahibine teslim edilir. Bu hâlde kolluktan yardım istenebilir. Kolluk birimleri, zor kullanma dâhil bu konudaki talepleri derhâl yerine getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Çocuk hak sahibine teslim edildikten sonra yükümlü haklı bir sebep olmaksızın çocuğu tekrar alırsa ayrıca yeni bir hükme veya yükümlüyle irtibata geçmeye ya da teslim emri tebliğine gerek olmaksızın çocuk beşinci fıkra uyarınca hak sahibine teslim edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Çocuğun üstün yararının gerektirdiği hâllerde müdürlük, yükümlüyle irtibata geçmeye veya teslim emri tebliğine gerek olmaksızın doğrudan beşinci fıkra hükmünü uygulayabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41/C" başlık="Çocukla kişisel ilişki kurulmasına dair ilam veya tedbir kararlarının yerine getirilmesi">
      <mvz-fıkra no="1">
        <template>Çocukla kişisel ilişki kurulmasına dair ilam veya tedbir kararları, yükümlüsü tarafından rızasıyla yerine getirilmediği takdirde hak sahibi, ilam veya tedbir kararının yerine getirilmesi için müdürlüğe başvurabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Talebi alan müdürlük, her türlü iletişim vasıtasını kullanarak yükümlüyle irtibata geçer; ilam veya tedbir kararında belirtilen gün ve saatte hak sahibine teslim edilmek üzere çocuğun müdürlük tarafından belirlenen yere getirilmesini derhâl bildirir; bu bildirimin yapıldığını veya yükümlüyle irtibat kurulamadığını tutanağa bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yükümlüyle irtibat kurulamaz veya yükümlü çocuğu getirmeyeceğini beyan ederse yahut belirlenen yere getirmezse müdürlük, derhâl yükümlüye, çocukla kişisel ilişki kurulmasına dair bir teslim emri gönderir. Emir, 7201 sayılı Kanun hükümlerine göre yükümlüye tebliğ edilir. Bu emirde aşağıdaki hususlar yer alır:</template>
        <mvz-bent no="a">
          <template>İlam veya tedbir kararında belirtilen gün ve saatte, gün ve saatin belirtilmemesi hâlinde müdürlük tarafından belirlenen gün ve saatte çocuğu emirde belirtilen yere getirmek zorunda olduğu.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Çocuğu emirde belirtilen yere getirmesine engel teşkil edecek derecede haklı bir mazereti varsa teslim gününden önce müdürlüğe bildirimde bulunarak çocuğun müdürlükçe alınmasını talep etmesi gerektiği.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İlam veya tedbir kararı kapsamında emrin tebliğinden sonraki dönemde de (a) ve (b) bentlerindeki yükümlülüğünün devam edeceği, bunun için yeniden emir çıkarılmayacağı.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Emrin gereğinin yerine getirilmemesi hâlinde disiplin hapsiyle cezalandırılacağı.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Yerleşim yeri veya iletişim bilgilerinin değişmesi hâlinde yeni adres veya iletişim bilgilerinin müdürlüğe derhâl bildirilmesi gerektiği.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Müdürlükçe yapılan iş ve işlemlere karşı, öğrenme veya tebliğ tarihinden itibaren bir hafta içinde, işlemi yapan müdürlüğün bulunduğu yer aile mahkemesine şikâyette bulunulabileceği.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Müdürlüğün belirlediği yere getirilen çocuk hak sahibine teslim edilir. Hak sahibine; ilam veya tedbir kararında belirtilen sürenin bitiminde çocuğu, belirlenen yere getirmek zorunda olduğu, çocuğu getirmez veya kendisinden kaynaklanmayan makul sebepler hariç olmak üzere geç getirirse disiplin hapsiyle cezalandırılacağı, hakkında suç duyurusunda bulunulacağı hususu tutanağa bağlanarak tebliğ edilir. Çocuk, belirlenen yere getirilmezse hak sahibi hakkında müdürlük tarafından suç duyurusunda bulunulur ve müteakip süreç hakkında yükümlü bilgilendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kişisel ilişki kurulmasından sonra hak sahibi tarafından teslim yerine getirilen çocuğun yükümlüye veya yükümlünün belirlediği kişiye teslimi mümkün olmazsa çocuk hak sahibinde bırakılır. Bu da mümkün olmazsa müdürlüğün talebi üzerine, aile ve sosyal hizmetler il müdürlüğü tarafından çocuğun geçici olarak barınmasına yönelik tedbirler alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yükümlü haklı mazereti nedeniyle çocuğun müdürlükçe alınmasını talep ederse, gerektiğinde hak sahibi de hazır bulundurulmak suretiyle çocuk, müdürlük tarafından yükümlüden alınarak hak sahibine teslim edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Hak sahibi, emrin yükümlüye tebliğinden sonraki dönemde, teslim saatinden en az kırk sekiz saat önce çocuğu teslim almaya geleceğini müdürlüğe yazılı olarak, elektronik ortamda veya başvuru aşamasında beyan ettiği iletişim kanalıyla bildirmek zorundadır. Hak sahibinin bildirimde bulunmadığı veya gelemeyeceğini bildirdiği hâllerde bu husus ve çocuğu emirde belirtilen yere getirme zorunluluğu bulunmadığı yükümlüye bildirilir. Tüm bu işlemler tutanak altına alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Çocukla kişisel ilişki kurulmasına dair işlemlerin çocuğun üstün yararını koruyacak şekilde yerine getirilebilmesi amacıyla müdürlüğün önerisi üzerine aile mahkemesince, çocuk, hak sahibi veya yükümlü hakkında danışmanlık tedbiri uygulanmasına karar verilebilir. Yükümlünün teslim emrine aykırı ilk hareketinde müdürlük yükümlü hakkında danışmanlık tedbiri uygulanmasını aile mahkemesinden talep eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>İlam veya tedbir kararını rızasıyla yerine getirdiğini iddia eden yükümlü, ikinci fıkra uyarınca yapılan bildirimin veya bu bildirim yapılamamışsa üçüncü fıkra uyarınca gönderilen teslim emrinin haksız olduğunu süresi içinde şikâyet yoluyla ileri sürebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Çocuğun yerleşim yerinin değişmesi hâlinde dosya resen ilgili yer müdürlüğüne gönderilir ve ilgili müdürlük işlemlere kaldığı yerden devam eder. Bu müdürlük, dosyadaki teslim emri kapsamında sadece teslimin gerçekleştirileceği yeni yeri yükümlüye tebliğ eder. Teslim yeri değişikliği hak sahibine her türlü iletişim vasıtasıyla bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Hak sahibi veya teslim yükümlüsü hakkında, 8/3/2012 tarihli ve 6284 sayılı Ailenin Korunması ve Kadına Karşı Şiddetin Önlenmesine Dair Kanun uyarınca gizlilik kararı ya da başka bir tedbire karar verilmesi hâlinde, teslim işlemleri bu kararlar dikkate alınarak yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Hak sahibi, teslim emrinin yükümlüye tebliğinden sonraki dönemde, teslim saatinden en az kırk sekiz saat önce çocuğu teslim almaya geleceğini müdürlüğe bildirdiği hâlde haklı bir mazeret olmaksızın art arda iki kez veya bir yılda üç kez gelmezse müdürlük tarafından dosyanın işlemden kaldırılmasına ve teslim emrinin hükümsüz hâle gelmesine karar verilir. Bu karar hak sahibi ve yükümlüye tebliğ edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Teslim emrinin tebliğinden sonraki dönemde yükümlü en az bir yıl boyunca emrin gereğini usulüne uygun bir şekilde yerine getirir ve müteakip dönemde de kişisel ilişki kurulmasına dair mahkeme kararına uygun olarak hareket edeceğini taahhüt ederse müdürlük, ilgili uzmanın kanaatini de alarak dosyanın işlemden kaldırılmasına ve teslim emrinin hükümsüz hâle gelmesine karar verebilir. Bu karar hak sahibi ve yükümlüye tebliğ edilir. Yükümlü bu taahhüdünü yerine getirmezse hak sahibinin talebiyle yükümlüye doğrudan teslim emri tebliğ edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41/D" başlık="Teslim mekânları">
      <mvz-fıkra no="1">
        <template>Çocuk teslimi ve çocukla kişisel ilişki kurulmasına dair ilam veya tedbir kararlarının yerine getirilmesine ilişkin işlemler, müdürlükçe belirlenen teslim mekânlarında gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Teslim işlemleri için müdürlüğün talebi üzerine, valilikler ve belediyeler tarafından elverişli teslim mekânları belirlenir, yoksa oluşturulur; araç tahsis edilir ve sürücü görevlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Teslim mekânlarının belirlenmesinde, oluşturulmasında, tefrişinde, bu mekânların güvenliğinin sağlanmasında ve teslim hizmetlerinin sunumunda, kamu kurum ve kuruluşları ile belediyeler, müdürlüğe her türlü desteği sağlamakla yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41/E" başlık="Şikâyet ve itiraz">
      <mvz-fıkra no="1">
        <template>Çocuk teslimi ve çocukla kişisel ilişki kurulmasına dair ilam veya tedbir kararlarının yerine getirilmesine ilişkin müdürlükçe yapılan işlem ve verilen kararlara karşı, öğrenme veya tebliğ tarihinden itibaren bir hafta içinde, işlemi yapan müdürlüğün bulunduğu yer aile mahkemesine şikâyette bulunulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mahkeme, yapılan işlemlerin yerine getirilmesini durdurabilir ve dosya üzerinden veya gerektiğinde ilgilileri dinlemek suretiyle ivedilikle karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Şikâyet üzerine verilen karara karşı, tebliğ tarihinden itibaren iki hafta içinde itiraz edilebilir. Mahkeme, itirazı incelemesi için dosyayı o yerde aile mahkemesinin birden fazla dairesinin bulunması hâlinde, numara olarak kendisini izleyen daireye, son numaralı daire için birinci daireye, o yerde aile mahkemesinin tek dairesi bulunması hâlinde asliye hukuk mahkemesine, aile mahkemesi hâkimi ile asliye hukuk mahkemesi hâkiminin aynı hâkim olması hâlinde ise en yakın aile mahkemesine veya asliye hukuk mahkemesine ivedilikle gönderir. İtiraz mercii, bir hafta içinde kararını verir. Merci, itirazı yerinde görürse işin esası hakkında karar verir. İtiraz üzerine verilen karar kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41/F" başlık="Çocuk teslimi ve çocukla kişisel ilişki kurulmasına dair ilam veya tedbir kararlarının yerine getirilmesine muhalefet">
      <mvz-fıkra no="1">
        <template>Çocuk teslimine dair ilam veya tedbir kararlarının yerine getirilmesine ilişkin teslim emrine aykırı hareket edenler ile emrin gereğinin yerine getirilmesini engelleyenler, bir ay içinde yapılacak şikâyet üzerine, fiil suç teşkil etse dahi, üç aya kadar disiplin hapsi ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çocukla kişisel ilişki kurulmasına dair ilam veya tedbir kararlarının yerine getirilmesine ilişkin teslim emrine aykırı hareket edenler ile emrin gereğinin yerine getirilmesini engelleyenler, bir ay içinde yapılacak şikâyet üzerine, üç günden on güne kadar disiplin hapsiyle cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kişisel ilişki kurulması için kendisine çocuk teslim edilen hak sahibi, ilam veya tedbir kararında belirtilen sürenin bitiminde çocuğu belirlenen yere getirmezse, bir ay içinde yapılacak şikâyet üzerine, fiil suç teşkil etse dahi, üç aya kadar disiplin hapsi ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıdaki fıkralar kapsamında şikâyete bakacak görevli ve yetkili mahkeme, işlemi yapan müdürlüğün bulunduğu yer aile mahkemesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Şikâyet olunana, şikâyet dilekçesi ile birlikte duruşma gün ve saatini bildiren davetiye gönderilir. Davetiyede, savunma ve delillerini duruşma gününe kadar bildirmesi gerektiği; duruşmaya gelmediği takdirde yargılamaya yokluğunda devam olunarak karar verileceği ihtar olunur. Mahkeme, duruşmaya gelen şikâyet olunanın, 5271 sayılı Kanunun 147 nci maddesinde belirtilen haklarını hatırlatarak savunmasını alır; gerekli araştırmayı yapar; dosyadaki delilleri değerlendirir; şikâyet olunanın teslim emrine aykırı hareket ettiğini veya emrin gereğinin yerine getirilmesini engellediğini yahut sürenin bitiminde çocuğu belirlenen yere getirmediğini tespit ederse disiplin hapsi ile cezalandırılmasına, aksi takdirde şikâyetin reddine karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Disiplin hapsi ile cezalandırmaya ilişkin kararlar, kesinleşmesini müteakip Cumhuriyet başsavcılığı tarafından infaz edilir. Bu kararlar kesinleştiği tarihten itibaren iki yıl geçtikten sonra yerine getirilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Şikâyetten vazgeçilmesi hâlinde veya birinci ve üçüncü fıkralar bakımından çocuğun velayet hakkı sahibine teslim edilmesi durumunda dava ve bütün sonuçlarıyla beraber ceza düşer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Yukarıdaki fıkralar uyarınca aile mahkemesince verilen kararlara karşı, 41/E maddesinin üçüncü fıkrası uyarınca itiraz edilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41/G" başlık="İçeriğin çıkarılması veya erişimin engellenmesi">
      <mvz-fıkra no="1">
        <template>Çocuk teslimi ve çocukla kişisel ilişki kurulması kapsamında çocuğun uzman veya öğretmen tarafından yükümlüden ya da hak sahibinden teslim alındığı veya diğerine teslim edildiği sırada kayda alınan ses veya görüntülerin internet ortamında yayınlanması nedeniyle kişilik haklarının ihlal edildiğini iddia eden ilgililer, 4/5/2007 tarihli ve 5651 sayılı İnternet Ortamında Yapılan Yayınların Düzenlenmesi ve Bu Yayınlar Yoluyla İşlenen Suçlarla Mücadele Edilmesi Hakkında Kanunun 9 uncu maddesi uyarınca içeriğin çıkarılması veya erişimin engellenmesini isteyebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41/H" başlık="Giderlerin karşılanması">
      <mvz-fıkra no="1">
        <template>Çocuk teslimi ve çocukla kişisel ilişki kurulmasına dair ilam veya tedbir kararlarının yerine getirilmesine ilişkin yapılacak işlemler, 2/7/1964 tarihli ve 492 sayılı Harçlar Kanunu ile diğer kanunlar uyarınca alınması gereken tüm harçlardan istisnadır. Ayrıca bu iş ve işlemlerin yürütülmesi için yapılacak tüm masraflar, avukatlık ücreti hariç, Adalet Bakanlığı bütçesinden karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çocuk teslimi ve çocukla kişisel ilişki kurulmasına dair ilam veya tedbir kararlarının yerine getirilmesine ilişkin işlemleri yerine getirmek üzere görevlendirilen uzman ve öğretmenlere bu kapsamda fiilen görev yaptıkları her teslim işlemi için, görevlendirilen diğer kişilere ise bu kapsamda görev yaptıkları her gün için (500) gösterge rakamının memur aylıklarına uygulanan katsayıyla çarpımı sonucu bulunacak tutarda ödeme yapılır. Bu kapsamda uzman ve öğretmenlere bir ayda yapılacak ödeme tutarı (10000) gösterge rakamının, görevlendirilen diğer kişilere ise (5000) gösterge rakamının memur aylıklarına uygulanan katsayıyla çarpımı sonucu bulunacak tutarı geçemez. Bu ödemeden damga vergisi hariç herhangi bir vergi ve kesinti yapılmaz. Bu fıkra uyarınca yapılacak ödemelerden kadrolu veya sözleşmeli olup olmadığına bakılmaksızın görevlendirilen tüm personel yararlanır. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Adalet Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41/İ" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kısmın uygulanmasına ilişkin usul ve esaslar Adalet Bakanlığı tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Çeşitli Hükümler">
    <mvz-madde no="42" başlık="Uygulanacak hükümler">
      <mvz-fıkra no="1">
        <template>Bu Kanunda hüküm bulunmayan hâllerde Ceza Muhakemesi Kanunu, Türk Medenî Kanunu, 18.6.1927 tarihli ve 1086 sayılı Hukuk Usulü Muhakemeleri Kanunu ile 24.5.1983 tarihli ve 2828 sayılı Sosyal Hizmetler ve Çocuk Esirgeme Kurumu Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Denetim konusunda bu Kanunda hüküm bulunmayan hâllerde, Denetimli Serbestlik ve Yardım Merkezleri ile Koruma Kurulları Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="Çocuğun giderleri">
      <mvz-fıkra no="1">
        <template>Çocuk hakkında verilen koruyucu ve destekleyici tedbir kararlarının giderleri Devletçe ödenir. Ödenecek miktar mahkemece verilecek bir karar ile tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türk Medenî Kanunu hükümlerine göre çocuğa bakmakla yükümlü olan kimsenin malî durumunun müsait olması hâlinde, Devletçe ödenen meblağın tahsili için ilgililere rücu edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Kamu görevlisi">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren görevlerle bağlantılı olarak kamu görevlileri hakkında 2.12.1999 tarihli ve 4483 sayılı Memurlar ve Diğer Kamu Görevlilerinin Yargılanması Hakkında Kanun hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="45" başlık="Kurumlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 5 inci maddesinde yer alan koruyucu ve destekleyici tedbirlerden;</template>
        <mvz-bent no="a">
          <template>(a) ve (e) bentlerinde yazılı danışmanlık ve barınma tedbirleri Milli Eğitim Bakanlığı, Sosyal Hizmetler ve Çocuk Esirgeme Kurumu ve yerel yönetimler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>(b) bendinde yazılı eğitim tedbiri Milli Eğitim Bakanlığı ve Çalışma ve Sosyal Güvenlik Bakanlığı,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>(c) bendinde yazılı bakım tedbiri Sosyal Hizmetler ve Çocuk Esirgeme Kurumu,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>(d) bendinde yazılı sağlık tedbiri Sağlık Bakanlığı,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Tarafından yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakım ve barınma tedbirlerinin yerine getirilmesi sırasında ihtiyaç duyulan kolluk hizmetlerinin yerine getirilmesi, çocukların rehabilitasyonu, eğitimi ve diğer bakanlıkların görev alanına giren diğer hususlarla ilgili olarak Sosyal Hizmetler ve Çocuk Esirgeme Kurumu tarafından yapılan her türlü yardım ve destek talepleri Milli Eğitim Bakanlığı, İçişleri Bakanlığı, Sağlık Bakanlığı, ilgili diğer bakanlıklar ile kamu kurum ve kuruluşları tarafından geciktirilmeksizin yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Koruyucu ve destekleyici tedbirlerin ilgili kurum veya kuruluş tarafından yerine getirilmesi sırasında gerekmesi hâlinde kolluktan yardım istenebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Koruyucu ve destekleyici tedbirlerin yerine getirilmesinde kurumların koordinasyonu merkezde Aile ve Sosyal Hizmetler Bakanlığı tarafından; il ve ilçelerde kurumların koordinasyonu ile takibi vali ve kaymakam tarafından sağlanır. Bu amaçla il ve ilçelerde sekretarya hizmetleri aile ve sosyal hizmetler il müdürlükleri tarafından yürütülür. Hâkim veya mahkeme tarafından verilen koruyucu ve destekleyici tedbir kararları, yerine getirilmek üzere ilgili kurum veya kuruluşa gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Çocuk hakkında verilen koruyucu ve destekleyici tedbir kararlarının gereklerine aykırı hareket eden ana, baba, vasi veya bakım ve gözetiminden sorumlu kimse, fiil suç teşkil etse dahi ihlal edilen tedbirin niteliğine ve aykırılığın ağırlığına göre çocuk hâkimi kararıyla üç günden on güne kadar tazyik hapsi ile cezalandırılır. Bu kararlara karşı 14 üncü madde uyarınca itiraz yoluna gidilebilir. Tazyik hapsine ilişkin kararlar, kesinleşmesini müteakip Cumhuriyet başsavcılığı tarafından yerine getirilir. Bu kararlar çocuk hâkimi tarafından ilgili kuruma bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="46" başlık="Kadrolar">
      <mvz-fıkra no="1">
        <template>Bu Kanun gereğince kurulacak mahkemelerin kuruluş ve çalışmaları için gerekli sınıflardan yeteri kadar kadro temin edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="47" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 5 ve 10 uncu maddelerinin uygulanmasına ilişkin usûl ve esaslar, Adalet Bakanlığı ile Sosyal Hizmetler ve Çocuk Esirgeme Kurumu tarafından müştereken, diğer maddelerin uygulanmasına ilişkin usûl ve esaslar ise Adalet Bakanlığı tarafından altı ay içinde çıkarılacak yönetmeliklerle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="48" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>7.11.1979 tarihli ve 2253 sayılı Çocuk Mahkemelerinin Kuruluşu, Görev ve Yargılama Usulleri Hakkında Kanun yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mevzuatta, yürürlükten kaldırılan 7.11.1979 tarihli ve 2253 sayılı Çocuk Mahkemelerinin Kuruluşu, Görev ve Yargılama Usulleri Hakkında Kanuna yapılan yollamalar, bu Kanunun ilgili hükümlerine yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Çalıştırma yasağı" tür="Ek">
      <mvz-fıkra no="1">
        <template>Cinsel saldırı, çocukların cinsel istismarı, reşit olmayanla cinsel ilişki, uyuşturucu veya uyarıcı madde imal ve ticareti, uyuşturucu veya uyarıcı madde kullanılmasını kolaylaştırma, müstehcenlik, fuhuş, insan ticareti, kasten öldürme suçlarından haklarında adli sicil ve arşiv kayıtlarında kesinleşmiş mahkûmiyet kararı bulunanlar; kamuya, özel sektöre veya sivil toplum kuruluşlarına ait her ne adla olursa olsun çocukların yoğun olarak bulunduğu çocuk hizmet birimleri, adli görüşme odaları, eğitim kuruluşları, çocuk etkinlik ve oyun evleri, okul, okul servisi, okul kantini, yurt, kreş, gündüz bakımevi, çocuk kulübü, internet kafeleri ve salonları, e-oyun yerleri, çocuk spor okulu, beden eğitimi ve spor tesisleri olarak işletilen iş yerlerini şahsen işletemez, bu iş yerlerinde çalıştırılamaz ve herhangi bir sıfatla fiilen bu iş yerlerinde görev alamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamına giren kişilere aynı fıkrada belirtilen iş yerlerinin açılması veya işletilmesi için izin ve ruhsat verilmez. Birinci fıkra kapsamındaki iş yerlerinin aynı fıkra kapsamındaki kişilerce işletildiğinin tespit edilmesi hâlinde bu kişilere iş yerinin devri için altı ay süre verilir ve bu sürede kişinin iş yerini fiilen işletmesine izin verilmez. Bu süre içinde devir işlemi yapılmadığı takdirde verilen izin ve ruhsatlar, bunları veren kamu kurum ve kuruluşları tarafından derhâl iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkra kapsamındaki iş yerlerinde çalışanlar, adli sicil ve arşiv bilgilerine dayanılarak oluşturulan bu iş yerlerinde çalışabileceğini gösterir resmî belgeyi altı ayda bir işverene ibraz etmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkraya aykırı olarak işçi çalıştıran kişiye, mahallîn mülki idare amiri tarafından bu fıkraya aykırı olarak çalıştırdığı her bir kişi başına brüt asgari ücretin üç katı tutarında idari para cezası verilir. Aykırılığın cezanın tebliğinden itibaren bir ay içinde giderilmediğinin tespiti hâlinde, birinci fıkraya aykırı olarak çalıştırılan her bir kişi başına brüt asgari ücretin yedi katı tutarında idari para cezası verilir. Bu cezanın tebliğinden itibaren bir ay içinde aykırılığın hâlen giderilmemiş olması hâlinde, ilgili kamu kurum ve kuruluşları tarafından verilen izin ve ruhsatlar derhâl iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar, Adalet Bakanlığı ile Aile ve Sosyal Hizmetler Bakanlığı tarafından müştereken belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>2253 sayılı Kanun gereğince kurulan çocuk mahkemelerinde derdest bulunan ve bu Kanun ile kurulan çocuk mahkemesinin görevine giren dava ve işler, bu mahkemeler faaliyete geçtiğinde çocuk mahkemesine devredilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel ceza mahkemelerinde görülmekte olan ve bu Kanunun yürürlüğe girdiği tarihte onsekiz yaşını doldurmuş olan sanıklar hakkındaki dava ve işler çocuk mahkemeleri ile çocuk ağır ceza mahkemelerine devredilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çocuk mahkemeleri ile çocuk ağır ceza mahkemeleri bulunmayan yerlerde, bu mahkemeler kurulup göreve başlayıncaya kadar çocuklar tarafından işlenen suçlara ait soruşturma ve kovuşturmalar Cumhuriyet başsavcılığı ve görevli mahkemelerce bu Kanun hükümlerine göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Çocuk mahkemesi bulunmayan yerlerde, bu mahkeme kurulup göreve başlayıncaya kadar korunma ihtiyacı olan çocuklar hakkında tedbir kararları görevli aile veya asliye hukuk mahkemelerince alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Adalet Bakanlığının koordinatörlüğünde ilgili bakanlıklar ve bağlı kuruluşlar bu Kanunun yürürlüğü tarihinden itibaren altı ay içinde koruyucu ve destekleyici tedbirleri yerine getirmek üzere gerekli tedbirleri alır. Ayrıca, ilgili bakanlıklar ve bağlı kuruluşlar bu amaçla sivil toplum kuruluşlarıyla işbirliğine gidebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun Dördüncü Kısmının uygulanmasına ilişkin yönetmelik, bu maddeyi ihdas eden Kanunun yürürlüğe girdiği tarihten itibaren altı ay içinde çıkarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun Dördüncü Kısmının uygulanmasına, Adalet Bakanlığınca belirlenen il veya ilçelerde başlanır ve birinci fıkra uyarınca çıkarılan yönetmeliğin yürürlüğe girdiği tarihten itibaren en geç bir yılın sonunda ülke genelinde uygulamaya geçilir. Dördüncü Kısmın hangi il veya ilçede ne zaman uygulanacağı Adalet Bakanlığının resmî internet sitesinde duyurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkra uyarınca Dördüncü Kısmın henüz uygulanmadığı yerlerde, 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanununun, bu maddeyi ihdas eden Kanunla yürürlükten kaldırılan 25, 25/a ve 25/b maddelerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce gerçekleşen ve 2004 sayılı Kanunun mülga 341 inci maddesi kapsamında kalan eylemlere ilişkin şikâyetler, icra mahkemelerince sonuçlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin yürürlüğe girdiği tarihten sonra;</template>
        <mvz-bent no="a">
          <template>Üçüncü fıkra gereğince 2004 sayılı Kanunun mülga 25, 25/a, 25/b maddeleri uyarınca icra dairelerince,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Dördüncü Kısım gereğince müdürlüklerce,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>yürütülen çocuk teslimi veya çocukla kişisel ilişki kurulması sürecindeki emre veya kararın yerine getirilmesine muhalefet eylemleri bakımından 41/F maddesi uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İkinci fıkra uyarınca Dördüncü Kısmın uygulanmaya başlandığı il ve ilçelerde, çocuk teslimi veya çocukla kişisel ilişki kurulmasına dair ilamların icrasına ilişkin derdest takip dosyaları, icra dairesince teslim veya kişisel ilişki kurulması işlemleriyle sınırlı olmak üzere resen işlemden kaldırılır. Şu kadar ki, çocuğun, bu tarih itibarıyla kişisel ilişki kurulması kapsamında hak sahibinde bulunduğu hâller bakımından dosya, çocuğun yükümlüye teslim edilmesinden sonra işlemden kaldırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu maddenin yürürlüğe girdiği tarihten itibaren çocuk teslimi veya çocukla kişisel ilişki kurulmasına dair ilamların icrası için icra daireleri nezdinde yapılacak takip işlemleri, 492 sayılı Kanun ile diğer kanunlar uyarınca alınması gereken tüm harçlardan istisnadır. İşlemleri yerine getiren icra müdürlerine 8/5/1991 tarihli ve 3717 sayılı Adli Personel ile Devlet Davalarını Takip Edenlere Yol Gideri ve Tazminat Verilmesi ile 492 Sayılı Harçlar Kanununun Bir Maddesinin Yürürlükten Kaldırılması Hakkında Kanunun 2 nci maddesinde, uzman ve öğretmenlere ise 41/H maddesinde belirtilen esaslara göre ücret ödenir. Bu iş ve işlemler için yapılacak tüm masraflar, avukatlık ücreti hariç, Adalet Bakanlığı bütçesinden karşılanır. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Adalet Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu maddede kabul edilen usul ve esaslar, 22/11/2007 tarihli ve 5717 sayılı Uluslararası Çocuk Kaçırmanın Hukuki Yön ve Kapsamına Dair Kanun uyarınca yapılacak çocuk teslim işlemleri bakımından da uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="49" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanunun;</template>
        <mvz-bent no="a">
          <template>Suça sürüklenen ve hakkında bakım tedbiri uygulanan çocuklar hakkında Sosyal Hizmetler ve Çocuk Esirgeme Kurumu tarafından yerine getirilecek hizmetlere ilişkin hükümler ile 5 inci maddesinin birinci fıkrasının (e) bendi yayımı tarihinden itibaren altı ay sonra,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>37 nci maddesinin birinci fıkrasının ikinci cümlesi ile 5 inci maddesinin birinci fıkrasının (a) bendi yayımı tarihinden itibaren bir yıl sonra,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Diğer hükümleri yayımı tarihinde,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="50" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
