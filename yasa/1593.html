  <mvz-künye tür="kanun" no="1593" başlık="UMUMİ HIFZISSIHHA KANUNU"
             tarih="24/4/1930" rgazete-tarih="6/5/1930" rgazete-sayı="1489"
             düstur-tertip="3" düstur-cilt="11" düstur-sayfa="143" />
    
  <mvz-bap no="1-BİRİNCİ" başlık="Sıhhi teşkilat">
    <mvz-fasıl no="1-BİRİNCİ" başlık="Devlet hidematı sıhhiyesi ve sıhhi Merciler">
      <mvz-madde no="1" başlık="">
        <mvz-fıkra no="1">
          <template>Memleketin sıhhi şartlarını ıslah ve milletin sıhhatine zarar veren bütün hastalıklar veya sair muzır amillerle mücadele etmek ve müstakbel neslin sıhatli olarak yetişmesini temin ve halkı tıbbi ve içtimai muavenete mazhar eylemek umumi Devlet hizmetlerindendir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="">
        <mvz-fıkra no="1">
          <template>Umumi sıhhat ve içtimai muavenet hizmetlerine ait Devlet vazaifi Sıhhat ve İçtimai Muavenet Vekaleti tarafından ifa ve hususi idarelerle belediyelere ve sair mahalli idarelere bırakılan hizmetlerin sureti icrası murakabe olunur. Milli Müdafaa teşkilatına ait sıhhi işler müstesna olmak üzere bütün sıhhat ve içtimai muavenet işlerinin mercii ve murakıbı bu Vekalettir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhat ve İçtimai Muavenet Vekaleti bütçeleriyle muayyen hatlar dahilinde olarak aşağıda yazılı hizmetleri doğrudan doğruya ifa eder:</template>
          <mvz-bent no="1">
            <template>Doğumu  teshil ve çocuk ölümünü tenkis edecek tedbirler.</template>
          </mvz-bent>
          <mvz-bent no="2">
            <template>Validelerin doğumdan evvel ve doğumdan sonra sıhhatlerinin vikayesi.</template>
          </mvz-bent>
          <mvz-bent no="3">
            <template>Memlekete sari ve salgın hastalıkların hulülüne mümanaat.</template>
          </mvz-bent>
          <mvz-bent no="4">
            <template>Dahilde her nevi intani, sari ve salgın hastalıklarla veya çok miktarda vefiatı intaç ettiği görülen sair muzır amillerle mücadele.</template>
          </mvz-bent>
          <mvz-bent no="5">
            <template>Tababet ve şubeleri sanatlarının icrasına nezaret.</template>
          </mvz-bent>
          <mvz-bent no="6">
            <template>ilaçları ve bütün zehirli müessir ve uyuşturucu maddelerle yalnız hayvanlar için serumlar ve aşıları murakabe hariç olmak üzere her nevi serum ve aşıları murakabe.</template>
          </mvz-bent>
          <mvz-bent no="7">
            <template>Çocukluk ve gençlik hıfzıssıhhasına ait işlerle çocuk sıhhat ve bünyesinin muhafaza ve tekamülüne ait tesisatın murakabesi.</template>
          </mvz-bent>
          <mvz-bent no="8">
            <template>Mektep hıfzıssıhhası.</template>
          </mvz-bent>
          <mvz-bent no="9">
            <template>Mesai ve san'at hıfzıssıhhası işleri.</template>
          </mvz-bent>
          <mvz-bent no="10">
            <template>Maden suları ile sair havassı şifaiyesi olan sulara nezaret.</template>
          </mvz-bent>
          <mvz-bent no="11">
            <template>Hıfzıssıhha müesseseleri ve bakteriyoloji laboratuvarları ve alelümum hayati muayene ve tahlillere mahsus müesseseler küşat ve idaresi.</template>
          </mvz-bent>
          <mvz-bent no="12">
            <template>Mesleki tedrisat müesseseleri küşat ve idare veya mümasili müessesatı murakabe ve bunlara müsaade itası.</template>
          </mvz-bent>
          <mvz-bent no="13">
            <template>Mecnunlarla sair ruhi hastalıklara mahsus tedavihaneler veya malül veya herhangi bir noksanii hilkate malik olanları kabul edecek yurt veya müesseseler tesis ve idare.</template>
          </mvz-bent>
          <mvz-bent no="14">
            <template>Muhacrin sıhhat işleri.</template>
          </mvz-bent>
          <mvz-bent no="15">
            <template>Hapisanelerin ahvali sıhhiyesine nezaret.</template>
          </mvz-bent>
          <mvz-bent no="16">
            <template>Tıbbi istatistiklerin tanzimi.</template>
          </mvz-bent>
          <mvz-bent no="17">
            <template>Sıhhi neşriyat ve propagandalar.</template>
          </mvz-bent>
          <mvz-bent no="18">
            <template>Vesaiti münakale umuru sıhhiyesinin nezaret.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="">
        <mvz-fıkra no="1">
          <template>Doğrudan doğruya şehir ve kasabalar, köyler hıfzıssıhhasına veya tıbbi ve içtimai muavenete mütaallik işlerin ifası belediyelere ve idarei hususiyelere ve sair mahalli idarelere tevdi edilir. Vekalet indelicap bu idarelere rehber olmak üzere bazı mahallerde nümune tesisatı vücude getirir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="2-İKİNCİ" başlık="Sıhhat ve İçtimai Muavenet teşkilatı">
      <mvz-madde no="5" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhat ve içtimai Muavenet Vekaleti 3 üncü maddede zikredilen hizmetleri ifa için hususi teşkilat kanununa tevfikan teşkil edilmiş fenni ve idari şubelerden mürekkeptir. Kanunu mahsusuna tevfikan mülhak bütçe ile idare olunan Hudutlar ve Sahiller Sıhhat Umum Müdürlüğü, Sıhhat ve İçtimai Muavenet Vekaletine merbut olarak ifayı vazife eyler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="">
        <mvz-fıkra no="1">
          <template>Her vilayette Sıhhat ve İçtimai Muavenet Vekaletine merbut olmak üzere bir Sıhhat ve İçtimai Muavenet Müdürü bulunur. Sıhhat müdürleri bulundukları vilayetlerde Vekaletin en büyük memuru olmakla beraber valilerin sıhhi müşaviridirler. Valiler mevcut sıhhi mevzuata tevfikan sıhhiye müdürlerini istihdam ederler ve sıhhi hususlarda onların rey ve mütalealarını alırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhat ve İçtimai Muavenet müdürleri bulundukları vilayetin sıhhi umur ve muamelelerinden vali ile beraber mesul olup bütün sıhhi mevzuat ve emirlerin iyi tatbikına nezaretle mükelleftir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="">
        <mvz-fıkra no="1">
          <template>Her kazada ve icabı takdirinde nahiye merkezlerinde bir veya mütaaddit Hükümet tabipleri istihdam olunur. Hükümet tabipleri doğrudan doğruya vilayet sıhhiye müdürünün emri altında olup memur oldukları mahallerin sıhhi umur ve muamelelerinden mesuldür ve kaymakamın sıhhi hususatta sıhhi müşaviridir. Hükümet tabiplerinin maiyyetlerinde sıhhi işlerde kendilerine muavenette bulunmak üzere küçük sıhhat memurları istihdam edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhat ve İçtimai Muavenet Vekaleti üçüncü ve dördüncü maddelerde zikredilen vazifeleri ifa ve müesseseleri idare etmek üzere tabipler, baytarlar, eczacılar, sair sıhhi ve idari memurlar tayin ve istihdam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="3-ÜÇÜNCÜ" başlık="Yüksek Sıhhat Şürası">
      <mvz-madde no="10 - 15" başlık="" durum="mülga">
      </mvz-madde>
      <mvz-madde no="16" başlık="">
        <mvz-fıkra no="1">
          <template>Yüksek Sıhhat Şürası azasına her devrei içtimaiyeye mahsus olmak üzere her sene bütçesinde miktarı muharrer bir hakkı huzur verilir. Ankara haricinden gelenlere harcırahları ve vekaletçe tayin olunacak yevmiyeleri ita olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="" durum="mülga">
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="4-DÖRDÜNCÜ" başlık="Vilayet Hususi İdareleri ve Belediyeler">
      <mvz-madde no="18" başlık="">
        <mvz-fıkra no="1">
          <template>Vilayet hususi idareleri bütçelerinde hususi kanuna tevfikan tefrik ve Sıhhat ve İçtimai Muavenet Vekaletinin tensibi ile sarfolunan sıhhi ve içtimai işlere mahsus tahsisat, vilayet merkezinde veya tensip olunacak sair mahallerde açılacak hastaneler ve dispanserlerle seyyar etıbba teşkilatına ve seyyar etüv tedarikine ve tephirat ve tathirat istasyonları tesisine ve verem ve frengi ve çocuk vefiyatı mücadelesine muhtas hıfzıssıhhai içtimaiye dispanserlerine ve sıtma ve frengi ilacı tedarikine ve Sıtma Kanununda tasrih edilen ahvalde sıtma membalarının izalesine sarfolunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="">
        <mvz-fıkra no="1">
          <template>Vilayetler hususi idarelerine ait sıhhi teşkilat ve tesisat mahalli Sıhhat ve İçtimai Muavenet müdürlerinin murakabesi altında bulunup bunlara ait muamelat mevzuata tevfikan sıhhat müdürleri tarafından ifa olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="">
        <mvz-fıkra no="1">
          <template>Belediyelerin umumi hıfzıssıhha ve içtimai muavenete taallük eden mesailden ifasile mükellef oldukları vazifelere aşağıda zikredilmiştir.</template>
          <mvz-bent no="1">
            <template>İçilecek ve kullanılacak evsafı fenniyeyi haiz su celbi.</template>
          </mvz-bent>
          <mvz-bent no="2">
            <template>Lağım ve mecralar tesisatı.</template>
          </mvz-bent>
          <mvz-bent no="3">
            <template>Mezbaha inşaatı.</template>
          </mvz-bent>
          <mvz-bent no="4">
            <template>Mezarlıklar tesisatı ve mevta defni ve nakli işleri.</template>
          </mvz-bent>
          <mvz-bent no="5">
            <template>Her nevi muzahrafatın teb'it ve imhası.</template>
          </mvz-bent>
          <mvz-bent no="6">
            <template>Meskenlerin sıhhi ahvaline nezaret.</template>
          </mvz-bent>
          <mvz-bent no="7">
            <template>Sıcak ve soğuk hamamlar tesisi.</template>
          </mvz-bent>
          <mvz-bent no="8" durum="mülga">
            <template></template>
          </mvz-bent>
          <mvz-bent no="9">
            <template>Umumi mahallerde halkın sıhhatine zarar veren amilleri izale.</template>
          </mvz-bent>
          <mvz-bent no="10">
            <template>Sari hastalıklarla mücadale işlerine muavenet.</template>
          </mvz-bent>
          <mvz-bent no="11">
            <template>Hususi eczane bulunmayan yerlerde eczane küşadı.</template>
          </mvz-bent>
          <mvz-bent no="12">
            <template>İlk tıbbi imdat ve muavenet teşkilatı.</template>
          </mvz-bent>
          <mvz-bent no="13">
            <template>Hastane, dispanser, süt çocuğu, muayene ve tedavi evi, aceze ve ihtiyar yurtları ve doğum evi tesis ve idaresi.</template>
          </mvz-bent>
          <mvz-bent no="14">
            <template>Meccani doğum yardımı için ebe istihdamı.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="">
        <mvz-fıkra no="1">
          <template>Vilayet hususi idareleriyle belediyelerin 18 ve 20 inci maddelerde gösterilen hizmetlerini ifa için kanunu mahsuslarına tevfikan Vekaletçe tayin olunan etıbba ve sair memurin istihdam olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="">
        <mvz-fıkra no="1">
          <template>Belediyeler ve vilayetler hususi idarelerince sıhhi ve içtimai hizmetlerden hangilerinin ifası mecburi ve hangilerinin ihtiyari olduğu hususi kanunlarına tevfikan tayin ve bu hizmetlerde istihdam edilecek tabip ve memurların kadroları İcra Vekilleri Heyetince musaddak bir talimatname ile tesbit olunur. Hükümet tabipleri olmayan yerlerde belediye tabipleri nizamnamesine tevfikan Hükümet tabiplerinin ifasiyle muvazzaf oldukları vazifelerle mükelleftirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="5-BEŞİNCİ" başlık="Vilayetler ve kazalar umumi hıfzıssıhha meclisleri">
      <mvz-madde no="23" başlık="">
        <mvz-fıkra no="1">
          <template>Her vilayet merkezinde bir umumi hıfzıssıhha meclisi toplanır. Bu meclis mahalli sıhhat ve içtimai muavenet müdürü, nafıa mühendisi, maarif, baytar müdürü, mevcutsa sahil sıhhiye merkezi tabibi, bir hükümet ve belediye tabibi ve hastane baştabibi ile garnizon ve kıt'a bulunan yerlerde en büyük askeri tabip ve serbest sanat icra eden bir tabip ve bir eczacıdan ve belediye reisinden mürekkeptir. Meclis valinin veya valiye bilvekale sıhhiye müdürünün riyaseti altında içtima eder. Valinin tensip edeceği bir zat kitabet vazifesini ifa ve zabıtları tanzim eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="">
        <mvz-fıkra no="1">
          <template>Kazalarda bu meclisler kaymakamın riyaseti altında Hükümet tabibi, mevcut ise bir Hükümet baytarı ve askeri tabip, belediye tabibi ve serbest icrayi san'at eden ve kaymakam tarafından intihap edilen bir tabip ve serbest eczacı ile belediye reisinden terekküp eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="">
        <mvz-fıkra no="1">
          <template>Umumi hıfzıssıhha meclisleri müntehap azası her üç senede bir değişir. Eski azanın yeniden intihabı caizdir. Her defa tebeddülünde kaymakamlar tarafından vilayetlere, valilerce de Sıhhat ve İçtimai Muavenet Vekaletine bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="">
        <mvz-fıkra no="1">
          <template>Umumi hıfzıssıhha meclisleri alelade ayda bir kere içtima ederler. Ahvali fevkalâdede veya bir sari ve salgın hastalık zuhurunda valinin daveti veya Sıhhat ve İçtimai Muavenet Vekaletinin talebi üzerine daha sık toplanırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="">
        <mvz-fıkra no="1">
          <template>Umumi hıfzıssıhha meclisleri mahallin sıhhi ahvalini daima nazarı dikkat önünde bulundurarak şehir ve kasaba ve köyler sıhhi vaziyetinin ıslahına ve mevcut mahzurların izalesine yarayan tedbirleri alırlar. Sari ve salgın hastalıklar hakkında istihbaratı tanzim, sari ve içtimai hastalıklardan korunmak çareleri ve sıhhi hayatın faideleri hakkında halkı tenvir ve bir sari hastalık zuhurunda hastalığın izalesi için alınan tedbirlerin ifasına muavenet eylerler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="">
        <mvz-fıkra no="1">
          <template>Umumi hıfzıssıhha meclislerinin mukarreratından mahalli vazifeler ve salahiyetler arasında bulunan işler vali veya kaymakam tarafından icra olunur ve istizana muhtaç olanlar kaymakamlıkça vilayetten ve vilayetçe Sıhhat ve İçtimai Muavenet Vekaletinden sorulur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
  </mvz-bap>
  <mvz-bap no="2-İKİNCİ" başlık="Sari ve salgın hastalıklarla mücadele">
    <mvz-fasıl no="1-BİRİNCİ" başlık="Hudutlar ve sahiller sıhhi müdafaası">
      <mvz-madde no="29" başlık="">
        <mvz-fıkra no="1">
          <template>Beşinci maddede zikredilen Hudutlar ve Sahiller Sıhhat Umum Müdürlüğü beynelmilel seyrüsefer ve ticaret sebepleriyle intikal eden beşeri ve salgın hastalıklara karşı milli hudutlar ve sahilleri müdafaa vazifesiyle mükelleftir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="">
        <mvz-fıkra no="1">
          <template>Hudutlar ve Sahiller Umum Müdürlüğü mer'i olan beynelmilel mukaveleler ve Devletçe mevzu mevzuat ile Sıhhat ve İçtimai Muavenet Vekaleti tarafından bu mukaveleler ve mevzuatın layıkı ile tatbikını temin için verilen emirler dairesinde vazifeyi ifa eyler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="">
        <mvz-fıkra no="1">
          <template>Bir Türk limanından diğer bir Türk limanına veya ecnebi limanlarından bir Türk limanına gelen her gemi hareket ettiği limandan bir sıhhat patentası almakla mükelleftir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="" durum="mülga">
      </mvz-madde>
      <mvz-madde no="33" başlık="">
        <mvz-fıkra no="1">
          <template>Türk gemilerinin patentaları üzerinde konsolosluk vizesinin bulunmasını mecburi kılan memleketlere mensup gemilerin Türk limanlarına ihtilât etmek üzere geldikleri ve hareket limanlarında Türk konsolosu mevcut bulunduğu takdirde bunların patentaları üzerinde konsolos vizesi bulunması mecburidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="34" başlık="">
        <mvz-fıkra no="1">
          <template>Patentayı hamil olmaksızın boğazlara gelen transit gemilerin gösterecekleri sıhhi beyanname veyahut uğradıkları ecnebi limanlarından aldıkları gümrük veya liman permilerinde o limanın sıhhi durumu hakkında salahiyet sahibi makamlar tarafından verilmiş sıhhi meşruhat patenta yerine kaim olur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35" başlık="">
        <mvz-fıkra no="1">
          <template>33 üncü maddede zikredilen vizelere mukabil mahsus kanun mucibince alınacak resimler konsolosluklar tarafından ve konsolos bulunmıyan limanlardan vizesiz olarak gelen gemilerden de muvasalat limanlarında mahalli hükümet memurları tarafından tahsil olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="36" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhat patentaları üzerinde yapılan her türlü tahrifler veya salahiyettar makamatça tasdik edilmemiş tashihler patentayı hükümden düşürür. Bir geminin hareketinden evvel 48 saat zarfında verilmiş patentalar muteber olup daha evvel verilenlerin hükmü yoktur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="">
        <mvz-fıkra no="1">
          <template>Bir geminin hareket limanında kolera, veba, sarıhümma, lekelihümma ve çiçek vakaları ve yahut Sıhhat ve İçtimai Muavenet Vekaletince tayin ve ilân edilecek sair tehlikeli bir maraz salgını mevcut olmadığı halde verilmiş olan patentalar temiz addolunur. Bu hastalıklardan hariçten geldiği tebeyyün eden münferit vakaların zuhuru patentaların temiz addedilmesine mani olmazsa da bu vakalar patentalarda işaret edilmiş olmalıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="">
        <mvz-fıkra no="1">
          <template>37 nci maddede zikredilen hastalıklardan hariçten gelmiş olmadığı tahakkuk eden kolera, veba ve sarı humma vakalariyle çiçek ve lekeli humma salgınlarının zuhurunu bildiren patentalar ile mebdeinde temiz olduğu halde Türkiye limanlarından birine gelinceye kadar seyahat müddeti esnasında geminin sıhhi durumunda vukua gelen değişiklik dolayısiyle evsafı değişen patentalar bulaşık addolunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="">
        <mvz-fıkra no="1">
          <template>Hiç bir patentayı hamil olmıyarak Türkiye limanlarına gelen gemiler bulaşık patenta ile gelmiş gemiler gibi muameleye tabi olurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="40" başlık="">
        <mvz-fıkra no="1">
          <template>Ecnebi limanlarından gelen tekmil gemiler ilk vasıl oldukları Türk limanında ve munhasıran Türk limanları arasında muntazam sefer yapan milli yolcu gemileri ise ilk hareket ettikleri ve vardıkları son Türk limanlarında sıhhi muameleye (Sıhhi istintak, pratika, patenta veya vize almak) tabi olup aynı seferde uğrayacakları diğer Türk limanlarında içlerinde bulaşık hastalıklardan musap veya ölü bulunmamak şartiyle tekrar sıhhi muameleye (Pratika ve vize) tabi tutulmadan serbestçe yolcularını çıkarır ve hareket ederler; şu kadar ki,vapurun sıhhi durumunu tevsik için gemi tabibi veya sıhhat memuru numunesine uygun bir bülteni doldurarak limanda sahil sıhhiye idaresine göndermekle mükelleftir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Muntazam seferler yapan vapurlar haricinde kalan diğer büyük ve küçük bütün gemiler sahil sıhhiye teşkilatı bulunan her Türk limanında sıhhi muameleye tabi olup sahil sıhhiye teşkilatı bulunmıyan limanlarda yalnız hareketlerinde vize almakla mükellef tutulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ancak Türk veya ecnebi limanlarından gerek Akdeniz veya Karadeniz boğazlarına vasıl olan tekmil gemiler, transit olarak geçseler dahi, ol bapta mevzu hükümler dairesinde Boğazlarda sıhhi muameleye tabi olurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="41" başlık="">
        <mvz-fıkra no="1">
          <template>Ecnebi limanlardan ilk Türk limanına vasıl olan gemilerle Boğazlarda sıhhi muameleye tabi tutulan gemiler muvasalatları akabinde ve talimatnamelerle tayin olunan saatlerde Hudut ve Sahiller Sıhhat Umum Müdürlüğü tabip veya memurları tarafından ziyaret ve patentaları ile sıhhi vaziyetleri tetkik olunur. Bu memurlar tarafından serbest pratika verilmedikçe gemilere başkalarının girmesi ve gemilerden 47 nci madde mezkür talimatname hükümleri haricinde kimsenin çıkması memnudur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Buharlı veya motörlü alelumum şilepler, Boğazlar hariç olmak üzere uğradıkları bütün Türk limanlarında ve diğer yelkenli motörlü veya kürekli bilümum deniz nakil vasıtaları ise hem Boğazlarda ve hem uğradıkları tekmil Türk limanlarında sıhhi muamelelerini karada sahil sıhhiye dairesinde veya bu vazifeyi gören makama müracaatla yaptırırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="42" başlık="">
        <mvz-fıkra no="1">
          <template>Kaza, fırtına veya ahvali fevkalade sebebiyle bir limana ilticaya mecbur olan gemiler dahi patentalarını veyahut 35 inci maddede yazılı vesikaları mevcut olduğu takdirde göstermeğe ve o limandan hareketlerinde vize almağa mecburdurlar. Bu gemiler sahil sıhhat memurlarının murakabesi altında limanda kalıp ihtiyaçlarını da temin edebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="43" başlık="">
        <mvz-fıkra no="1">
          <template>Türk limanlarına gelen ecnebi harb gemileriyle ecnebi donanmalarına mensup muavin sefineler ve hükümdarları, Devlet Reislerini ve Türkiye Cumhuriyeti Hükümetini ziyarete gelen zatları hamil hususi yatlar ve gemiler patenta ibrazına mecbur değildirler. Kara ile ihtilat etmek ve serbest paratika almak istedikleri takdirde behemehal sıhhi muameleye ve icabında sıhhi tedbirlere tabi tutulurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="44" başlık="">
        <mvz-fıkra no="1">
          <template>Türk harb sefineleri ve ticaret ile münasebeti olmayıp Hükümete ait bulunan sair  gemiler  munhasıran  hizmetlerine  ait  işler  için  Türk limanları arasında seyrüsefer  ettikleri  ve hiçbir bulaşık limana uğramadıkları ve yolcu,  asker  ve  sair  eşhas nakleylemedikleri takdirde Türk limanlarına girip çıktıkları zamanlar sıhhi muameleye tabi değildirler. Fakat gemi içinde sari hastalık zuhur ettiği takdirde bu gemilerin kaptanları muvasalat limanlarındaki hudut ve sahiller sıhhat memurlarına haber vermeğe mecburdurlar. Bu takdirde tıbbi muayene yapılmadan ve serbest pratika verilmeden kara ile ihtilat edemezler. 37 nci maddede zikredilen hastalıklarla bulaşık limanlardan gelen bu nevi gemiler sair ticaret sefineleri hakkındaki hükme tabidirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="45" başlık="">
        <mvz-fıkra no="1">
          <template>Türk limanlarından birinde sari hastalık zuhur ederse Sıhhat ve İçtimai Muavenet Vekaletinin emriyle bu limandan hareket eden tekmil gemiler, mütaakiben uğrıyacakları Türk limanlarında ihtilattan evvel sıhhi muayeneye tabi tutulurlar.</template>
        </mvz-fıkra>

      <mvz-madde no="46" başlık="">

          <template>43 ve 44 üncü maddelerde zikredilen gemilerle ve küçük mesafelere gidip hiçbir yere uğramıyarak avdet eden tenezzüh, balıkçı ve süngerci ve tahlisiye gemileri müstesna olmak üzere Türkiye limanlarından ihtilât ederek çıkan her Türk ve ecnebi gemisi bir sıhhat patentasını hamil olur.</template>

      <mvz-madde no="47" başlık="">

          <template>Limanlarda gemilerin muvasalat ve hareketlerinde icrası icap eden sıhhi muamele, patentaların şekli, vasıf ve sureti itası, yolcu, mürettebatın ve eşyanın tathiri, bulaşık patentalı gemilere tatbikı icap eden sıhhi tedbirler, muhtelif hastalıklara ait vakalarda yapılacak muamele ve limanlarla hudutlarda müesses tahaffuzanelerin idare sureti ve yirmi dokuzuncu maddede zikredilen sıhhi müdafaaya mütaallik sair bütün muameleler mevcut mukavele ve kanunlara nazaran Sıhhat ve İçtimai Muavenet Vekaletince neşredilecek talimatnamelerle tayin olunur.</template>

      <mvz-madde no="48" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye konsolosları bulundukları mahalde zuhur eden ve 37 nci maddede zikredilen hastalık vakalarını ve bunlar hakkında ittihaz edilen tedbirleri Sıhhat ve İçtimai Muavenet Vekaletine muntazaman bildirirler. Yalnız bunlardan kolera, veba ve sarıhümmadan her vakanın telgrafla ihbarı lazım gelip diğer hastalıklar ancak salgın şekli aldıkları takdirde mektup ile haber verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="49" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye limanlarına sari ve salgın hastalıkların duhulüne mani olmak için aşağıda zikredilen tedbirler ittihaz edilir:</template>
          <mvz-bent no="1">

          <mvz-bent no="2">

          </mvz-bent>
          <mvz-bent no="3">
            <template>Hastaların tahaffuzane veya sari hastalıklar hastanelerinde şifa buluncıya kadar tedavi ve etrafı için tehlikeleri zail oluncıya kadar tecridi.</template>
          </mvz-bent>
          <mvz-bent no="4">
            <template>Gemilerin ve sıhhat memurlarının görecekleri lüzum üzerine tathiri kabil olan ticaret eşyasiyle zati eşyanın ve gemi eşyasının fenni tathiri.</template>
          </mvz-bent>
          <mvz-bent no="5">
            <template>Hastalık amilini nakle vasıta olan haşeratın ve hayvanların itlafı.</template>

        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu tedbirlerin tatbikı için lazım gelen zaman zarfında gemilerin limanlarda tevkifine hudutlar ve sahiller sıhhat memurları salahiyettardırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="50" başlık="">
        <mvz-fıkra no="1">
          <template>Sari ve salgın hastalıkların nakline vasıta olup fenni tathiri mümkün veya faydalı olmıyan her nevi eşyanın gemilerden tahliye edilmesine veya kara veya deniz tarikiyle memlekete ithaline mümaneata Sıhhat ve İçtimai Muavenet Vekaleti salahiyettardır. Vekalet bu hususta müstaceliyetine binaen karar ittihaz ederek gümrüklere ve postaya tebligat icra ettikten sonra keyfiyeti Cumhurbaşkanının tasvibine arzeder.</template>

      <mvz-madde no="51" başlık="">

          <template>Türkiye ve ecnebi limanlarından bulaşık veya şüpheli olanlar Sıhhat ve İçtimai Muavenet Vekaletince ilan olunur. Bu takdirde bu limanlar müvaredatı, gemilerin patentaları bulaşık olmasa dahi 49 uncu maddede zikredilen tedbirlerden birine tabi olur. Alınan tedbirler Hariciye Vekaletince alakadar devletlere mer'i mukaveleler dairesinde tebliğ olunur.</template>

      <mvz-madde no="52" başlık="">

          <template>Bütün Türkiye limanlarında sıhhi muamele ifası Hudut ve Sahiller Sıhhat Umum Müdürlüğü memurlarına aittir. Bunların bulunmadığı mahallerde Sıhhat ve İçtimai Muavenet Vekaletinin göstereceği lüzum üzerine, Hükümet veya belediye tabipleri, liman reisleri veyahut nahiye müdürleri ile gümrük memurları mevzuat hükümleri dairesinde sıhhi müdafaaya terettüp eden vazifeleri ifa ederler.</template>

      </mvz-madde>
      <mvz-madde no="53" başlık="">

          <template>Hudutlar ve Sahiller Sıhhat Umum Müdürlüğü hizmetlerine ait olan resimler ve tathir, tephir, tahaffuzhane masrafları ve kanuna muhalif hareket eden gemi kaptanlarından alınması icap eden para cezası mahsus kanuna tevfikan tahsil olunur.</template>

      <mvz-madde no="54" başlık="">
        <mvz-fıkra no="1">
          <template>Komşu memleketlerden birinde 37 nci maddede zikredilen hastalıklar zuhur ettiği takdirde kara hudutlarında Sıhhat ve İçtimai Muavenet Vekaletince vürut edecek yolcularla zati ve ticari eşya hakkında aşağıdaki tedbirler alınır:</template>

          </mvz-bent>
          <mvz-bent no="4">

          <mvz-bent no="5">

      <mvz-madde no="55" başlık="">

          <template>Komşu memleketlerdeki salgın hastalıkların memleket için tehlikeyi mucip bir şekilde devam eyleyerek adi tedbirler ile bu tehlikenin izalesine imkan görülmediği zamanlarda hudutların hastalık bulunan memlekete mücavir kısmı Cumhurbaşkanı karariyle muvakkaten seddolunarak her türlü münakaleler tatil olunabilir.</template>

      </mvz-madde>
      <mvz-madde no="56" başlık="">
        <mvz-fıkra no="1">
          <template>37 nci maddede zikredilen hastalıklardan birinin hüküm sürdüğü memleketlerden hava nakil vasıtalariyle vürut eden yolcu ve eşyalar hakkında 54 üncü maddede yazılan tedbirler Sıhhat ve İçtimai Muavenet Vekaletinin münasip göreceği hallerde hudutlarda veya bu vasıtaların karaya indikleri mahallerde tatbik olunur.</template>

    <mvz-fasıl no="2-İKİNCİ" başlık="Memleket dahilinde sari ve salgın hastalıklarla mücadele">
      <mvz-madde no="57" başlık="">
        <mvz-fıkra no="1">
          <template>Kolera, veba (Bübon veya zatürree şekli), lekeli humma, karahumma (hummayi tiroidi) daimi surette basil çıkaran mikrop hamilleri dahi - paratifoit humması veya her nevi gıda maddeleri tesemmümatı, çiçek, difteri (Kuşpalazı) - bütün tevkiatı dahi sari beyin humması (İltihabı sahayai dimağii şevkii müstevli), uyku hastalığı (İltihabı dimağii sari), dizanteri (Basilli ve amipli), lohusa humması (Hummai nifası) ruam, kızıl, şarbon, felci tıfli (İltihabı nuhai kuddamii sincabii haddı tifli), kızamık, cüzam (Miskin), hummai racia ve malta humması hastalıklarından biri zuhur eder veya bunların birinden şüphe edilir veyahut bu hastalıklardan vefiyat vuku bulur veya mevtin bu hastalıklardan biri sebebiyle husule geldiğinden şüphe olunursa aşağıdaki maddelerde zikredilen kimseler vak'ayı haber vermeğe mecburdurlar. Kudurmuş veya kuduz şüpheli bir hayvan tarafından ısırılmaları, kuduza müptela hastaların veya kuduzdan ölenlerin ihbarı da mecburidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="58" başlık="">
        <mvz-fıkra no="1">
          <template>İcrayı sanat eder her tabip 57 nci maddede zikredilen vakaları kati veya muhtemel teşhis vaz'ını mütaakıp ilk 24 saat zarfında sıhhiye dairesine, hükümet veya belediye tabibi bulunmadığı takdirde polis veya jandarma karakoluna hastanın isim ve adresiyle beraber tahriren veya şifahen haber verir. Polis ve jandarma daireleri ittila hasıl eyledikleri bu vakaları hiç vakit kaybetmeden alakadar makamlara bildireceklerdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="59" başlık="">
        <mvz-fıkra no="1">
          <template>Sari hastalıkların haber verilmesini kolaylaştırmak üzere Sıhhat ve İçtimai Muavenet Vekaletince hazırlanıp arzu eden tabiplere tevzi edilecek ihbarnameler postalarca meccanen naklolunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="60" başlık="">
        <mvz-fıkra no="1">
          <template>57 nci maddede yazılan hastalıklara uğrayan birisinin ikametgahı değiştiğini, hastalığı haber vermekle mükellef olanlar öğrendikleri takdirde bu nakli ihbara mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="61" başlık="">
        <mvz-fıkra no="1">
          <template>Hastane baştabipleri, mektep, fabrika, imalathane, hayır müesseseleri, ticarethane ve mağaza, otel, pansiyon, han, hamam, hapisane sahip veya müstecirleri ve müdürleri, apartman kapıcıları bulundukları mahallede, köy ihtiyar heyetleri köylerinde zuhur eden ve eczacılar, diş tabipleri ve ebeler, hasta bakıcıları, ölü tabutlıyan ve yıkayanlar sanatlarını icra sebebiyle muttali oldukları 57 nci maddede zikredilen vakaları derakap alakadar makamlara tebliğ ve ihbara mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="62" başlık="">
        <mvz-fıkra no="1">
          <template>Deniz veya nehirlerde seyrüsefer eden her nevi sefinelerde 57 nci maddedeki vakalardan biri zuhur ettiği takdirde geminin kaptan ve reisi ilk limanda vakayı hükümete haber vermeğe mecburdur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="63" başlık="">
        <mvz-fıkra no="1">
          <template>Limanlarda gemilere sıhhat patentası vermekle mükellef sahil sıhhat memurları veya teşkilat bulunmıyan mahallerde sahil sıhhiye işlerine bakmakla mükellef memurlar 57 nci maddede yazılı hastalıklardan ancak kolera, vebaya ait hakiki vakaları ve çiçek ve lekelihumma salgın halinde ise zuhur eden vakaları limanlardan hareket edecek bilumum gemilerin sıhhat patentalarına işaret ederler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>57 nci maddede yazılı sair hastalıkların ancak salgın halini aldıkları zamanlarda ve Sıhhat ve İçtimai Muavenet Vekaletinden verilecek emir üzerine tahakkuk eden vaka adetleri hakkında da patentalara şerh verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="64" başlık="">
        <mvz-fıkra no="1">
          <template>57 nci maddede zikredilenlerden başka her hangi bir hastalık istilai şekil aldığı veya böyle bir tehlike baş gösterdiği takdirde o hastalığın veya her hangi bir hastalık şeklinin memleketin her tarafında veya bir kısmında ihbarı mecburi olduğunu neşrü ilâna ve o hastalığa karşı bu kanunda mezkür tedabirin kaffesini veya bir kısmını tatbika Sıhhat ve İçtimai Muavenet Vekaleti salahiyettardır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="65" başlık="">
        <mvz-fıkra no="1">
          <template>Sari bir hastalık zuhur ettiği veya zuhurundan şüphelenildiği veya sari ve salgın bir hastalıktan vefat vuku bulduğu veyahut vefatın sari ve salgın bir hastalık tesiri ile husule geldiğinden şüphe edildiği ihbar olunur olunmaz hükümet tabipleri veya bulunmadığı mahallerde belediye tabipleri mahallinde lazım gelen tetkikatı icra ve hastalığın muhakkak olup olmadığını ve zuhuru sebeplerini tahkik ile mafevke işar eyler. Sari hastalıklar tetkikatı yapan tabiplere bütün Devlet kuvvetleri müzaherete mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="66" başlık="">
        <mvz-fıkra no="1">
          <template>65 inci maddede zikredilen tahkikat, sari ve istilai bir maraz zuhuru ihbar olunmadığı ve fakat Hükümetçe sari bir hastalık vukuundan şüphelenildiği takdirde dahi yapılabilir. Bu surette sari hastalık tetkikatı yapan sıhhat memurları lüzum gördükleri mahallerde hastaları veya maraz amillerini ve sebeplerini taharriye salahiyettardırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="67" başlık="">
        <mvz-fıkra no="1">
          <template>57 nci maddede zikrolunan sari ve salgın hastalıklar vakaları hakkında tetkikat yapan tabip bu tetkikatı kolaylaştırmak üzere hastanın yanına girmeğe ve hastayı ve icabına göre evin sair sakinlerini muayeneye ve hastalığın sureti zuhur ve seyrine dair izahat ve malumat talebine salahiyettardır. Bu hususta mümaneatı görülenler bu kanunda zikredilen ahkamı mahsusa mucibince cezalandırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="68" başlık="">
        <mvz-fıkra no="1">
          <template>Tabip bulunmıyan mahallerde Sıhhat ve İçtimai Muavenet Vekaletinin emri ile sari ve salgın hastalıklar hakkında tetkikat yapmağa, bu husus için yetiştirilmiş küçük sıhhat memurları mezundurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="69" başlık="">
        <mvz-fıkra no="1">
          <template>Sari ve salgın bir hastalığın vukuu tahakkuk eylediği takdirde sıhhat memurları derakap lazımgelen tedbirlerin ittihazına ve bütün idari makamlar bu tedbirlerin tatbik ve icrası hususunda muavenete mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="70" başlık="">
        <mvz-fıkra no="1">
          <template>Sari ve salgın bir hastalıktan vefat eylediği zan ve şüphe edilen eşhas üzerinde, alakadar tabip tarafından lüzum gösterildiği takdirde, fethimeyit icra olunabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="71" başlık="">
        <mvz-fıkra no="1">
          <template>Sari ve salgın bir hastalığın hüküferma olduğu veya tehdit eylediği mahallerde Sıhhat ve İçtimai Muavenet Vekaletince bütün cenazelerin defninden evvel bir tabip tarafından muayenesi mecburiyeti ilan edilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="72" başlık="">
        <mvz-fıkra no="1">
          <template>57 nci maddede zikredilen hastalıklardan biri zuhur ettiği veya zuhurundan şüphelenildiği takdirde aşağıda gösterilen tedbirler tatbik olunur:</template>
          <mvz-bent no="1">
            <template>Hasta olanların veya hasta olduğundan şüphe edilenlerin ve hastalığı neşrü tamim eylediği tetkikatı fenniye ile tebeyyün edenlerin fennen icap eden müddet zarfında ve sıhhat memurlarınca hanelerinde veya sıhhi ve fenni şartları haiz mahallerde tecrit ve müşahede altına vaz'ı.</template>
          </mvz-bent>
          <mvz-bent no="2">
            <template>Hastalara veya hastalığa maruz bulunanlara serum veya aşı tatbikı.</template>
          </mvz-bent>
          <mvz-bent no="3">
            <template>Eşhas, eşya, elbise, çamaşır ve binaların ve fennen intana maruz olduğu tebeyyün eden sair bilcümle mevaddın fenni tathiri.</template>
          </mvz-bent>
          <mvz-bent no="4">
            <template>Hastalık neşreden haşarat ve hayvanatın itlafı.</template>
          </mvz-bent>
          <mvz-bent no="5">
            <template>Memleket dahilinde seyahat eden eşhasın icap eden mahallerde muayenesi ve eşyalarının tathiri.</template>
          </mvz-bent>
          <mvz-bent no="6">
            <template>Hastalığın sirayet ve intişarına sebebiyet veren gıda maddelerinin sarf ve istihlakinin men'i.</template>
          </mvz-bent>
          <mvz-bent no="7">
            <template>Dahilinde sari ve salgın hastalıklardan biri zuhur eden umumi mahallerin tehlike zail oluncaya kadar set ve tahliyesi.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="73" başlık="">
        <mvz-fıkra no="1">
          <template>Kolera ve veba ve ruam musaplarından gayrı hastaların evlerinde tecrit edilmelerine müsaade olunur. Yalnız alakadar sıhhi memurlar tarafından bu tecridin müessir olmasını temin edecek şartların mevcudiyeti kabul edilmiş olmalıdır. Bu takdirde hastaların evlerine bir alameti mahsusa vazedilerek hariçle olan ihtilat menedilir. Kolera, veba, ruam musaplariyle bulunduğu mahallerde tecridi mümkün ve kafi görülmiyen sair hastalık musapları ve kolera ve vebayı neşir ve sirayet ettirmeleri muhtemel olanlar icap ederse cebri tecride tabi olurlar. Cebri tecrit, hastaların veya bu maddede zikredilen şüphelilerin Hükümetçe tayin edilecek mahallerde, her türlü ihtilattan memnu olarak ve zabıta murakabesi altında bulundurulmalarıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="74" başlık="">
        <mvz-fıkra no="1">
          <template>Hastaların tecrit ve tedavisine mahsus vasıf ve şartları haiz hususi yerleri olmayan mektep, fabrika ve imalathanelerle mütaaddit kimselerin bir arada bulunduğu umumi her nevi müessese ve mebanide sari hastalıklara musap kimselerin alıkonulması memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="75" başlık="">
        <mvz-fıkra no="1">
          <template>Kuduz olan veya kudurmuş olduğundan şüphe edilen hayvanlar tarafından ısırılmış olanların vakit kaybetmeden en yakın kuduz tedavi müessesesine izam olunmaları mecburidir. Bunlardan fakir olanların yol masrafları belediye veya köy sandıklarınca ve bu sandıklar veremedikleri takdirde idarei hususiyelerce tediye olunur ve bunlar Devlete ait umumi nakil vasıtalarından meccanen istifade ederler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="76" başlık="">
        <mvz-fıkra no="1">
          <template>Etrafında bulunanlara sari ve salgın hastalıklardan birini nakle vasıta olduğu muhakkak olan kimseler muvakkaten ve bu zail oluncaya kadar meslek san’atlarının icrasından hıfzıssıhha meclisleri karariyle menolunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="77" başlık="">
        <mvz-fıkra no="1">
          <template>Sari ve salgın hastalıklardan birinin hüküm sürdüğü veya tehdit ettiği mahallerde Sıhhat ve İçtimai Muavenet Vekaletinin tasvibiyle bütün umumi mahallerde vuku bulacak içtimalar tahdit veya menolunabilir. Bundan başka hastalarla hastalığı şüpheli olanların ve hastalığın sirayet ve neşrine vasıta olabilecek eşyanın fenni tathiratile mahzur ve mazarratı izale edilmeksizin nakillerine ve bütün kara ve deniz ve hava nakil vasıtalarının fenni tathir ve tephire tabi tutulmadan seyrüseferlerine mümaneat edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="78" başlık="">
        <mvz-fıkra no="1">
          <template>Hususi kanuna tevfikan açılmış olan şahıslara ait laboratuvarlarda ve Sıhhat Vekaletince tayin edilecek müessesatı resmiyenin gayrisinde kolera, veba ve ruam mikropları kültürlerinin bulunması memnudur. Diğer sari hastalıklar mikroplarının iyi muhafazasından ve bir mahalden diğerine naklinde yapılacak takayyüdattan laboratuvar sahipleri mesuldür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="79" başlık="">
        <mvz-fıkra no="1">
          <template>Su ile sirayet ettiği fennen muhakkak olan hastalıklardan birinin salgın halinde hüküm sürdüğü mahallerde veya bu mevkilerin etraf ve civarında bulunan umumi banyolar ve kuyular, aptesaneler ve şehir ve kasaba veya köylere gelen suların ve çamaşır yıkamağa mahsus umumi mahallerin ve dere, nehir gibi cari sularla göl sularından şüpheli olanlarının istimali memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="80" başlık="">
        <mvz-fıkra no="1">
          <template>Askeri kuvvetler arasında veya askeri müesseselerde 57 nci maddede mezkür sari ve salgın hastalıklardan biri zuhur ettiği takdirde bu kanunda zikredilen tedabirin ifasına hususi teşkilatı sıhhiyeleri mecburdur. Bu hallerde Milli Müdafaa Vekaleti vukuatın zuhur ve seyrinden Sıhhat ve İçtimai Muavenet Vekaletini daimi surette malumattar edecek ve halkı sirayetten korumak için müştereken ittihaz ve kabul edilecek tedbirleri tatbik eyleyecektir. Sıhhat Vekaletince halk arasında görülen sari hastalıklar vakalarından Milli Müdafaa Vekaleti vaktinde haberdar edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="81" başlık="">
        <mvz-fıkra no="1">
          <template>Sari ve salgın hastalıklar amilleriyle bulaştığı muhakkak veya şüpheli olupta tathiri ve tephiri masarifi kıymetinden ziyadeye baliğ olacağı anlaşılan veya tephir ve tathiri mümkün görülmeyen eşya ve mevaddı saire imha olunur. Tathir ve tephir masarifi kıymetinden ziyadeye baliğ olacağı anlaşılan eşyanın sahibi tarafından arzu edildiği takdirde tathir masarifi kendisi tarafından deruhte edilerek tathiri icra edilir. İmha edilen mevat ve eşya Hükümetçe her kimin elinden alınmış ise belediye ve köy ihtiyar heyetlerince tayin edilecek bedeli o şahsa tazmin olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="82" başlık="">
        <mvz-fıkra no="1">
          <template>Sari ve salgın hastalıklardan birinden vefat edip hususi tedabire tabi olarak defni iktiza eden cenazeler alakadar memurların nezareti altında tabutlanıp defnolunurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="83" başlık="">
        <mvz-fıkra no="1">
          <template>Cebri tecride tabi olarak müessesatta veya evlerinde tecrit edilen kimselerle 76 ncı maddede zikredilen şahıslardan muhtaç olanlarının kendileri ve ailelerinin iaşeleri masarifi Hükümetçe tesviye edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="84" başlık="">
        <mvz-fıkra no="1">
          <template>Sari hastalıkların zuhur ve intişarına mani olmak üzere münasip fasılalarla umumi mebaninin, nakil vasıtalarının, otel, han ve her nevi temaşa yerleri ve saire gibi içtima yerlerinin veya lüzum görülecek sair müessesatın neşir ve ilan edilecek şartlar dahilinde tathir ve tephirine ve hastalık nakleden haşerat ve hayvanatı itlaf etmeğe Sıhhat ve İçtimai Muavenet Vekaleti mezundur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="85" başlık="">
        <mvz-fıkra no="1">
          <template>Müstamel elbise ev eşyası ve sairenin fennen tathir edilmeden satılması memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="86" başlık="">
        <mvz-fıkra no="1">
          <template>İçinde sari ve salgın hastalıklardan biri çıkan binalarla bitişik binalar sahipleri hastalığın izalesine hadim ve yayılmasına mani olmak üzere sıhhiye memurlarının gösterecekleri sıhhi mahzurları ıslaha mecburdurlar. Sahipleri yapmazsa Hükümet veya belediyelerce yapılıp, masarifi, maliye memurlarınca Tahsili Emval Kanununa tevfikan tahsil olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="87" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhat ve İçtimai Muavenet Vekaletince 57 nci maddede zikredilen hastalıkların her birine karşı yapılacak mücadele tedbirlerini ve tathirat ve tephirat ve itlafı haşerat ve hayvanat usullerini ve tathirata tabi binalar ve eşya ve sairenin ne zamanlarda ve ne suretle tephir ve tathir edileceklerini mübeyyin bir yönetmelik neşrolunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="88" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye dahilinde her fert çiçek aşısı ile mükerrenen aşılanmağa mecburdur. Bu aşının, icrası tarzı ve vesikaların ne suretle ita olunacağı ve aşılarının fennen geri bırakılması icap eden kimseler 87 nci maddede yazılan yönetmelikte zikredilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="89" başlık="">
        <mvz-fıkra no="1">
          <template>Türkiye hudutları dahilinde doğan her çocuk doğumu takip eden ilk dört ay zarfında aşılanır. Çocuğun peder ve validesi aşı mecburiyetinin ifa edilmesinden aynı suretle mesuldürler. Ebeveyni olmayan çocuklar veya ebeveyni nezdinde bulunmayan çocuklar için çocuğu bakmak üzere kabul eden şahıslar veya müesseseler müdürleri mesuldürler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="90" başlık="">
        <mvz-fıkra no="1">
          <template>Otuz yaşına kadar olan her şahıs çiçek aşısını beş senede bir tekrar ettirmeğe mecburdur. Çiçek salgını vukuunda sıhhat memurları tarafından lüzum görülecek bütün eşhasa çiçek aşısı tatbikı mecburidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="91" başlık="">
        <mvz-fıkra no="1">
          <template>Çiçek aşısı Hükümetçe hazırlanır ve meccanen tevzi ve tatbik olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="92" başlık="">
        <mvz-fıkra no="1">
          <template>Askeri makamlar, askeri hizmetlerini ifa esnasında ve kanunen muayyen olan müddetlerde askerlerin çiçek aşılarını muntazaman ifaya mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="93" başlık="">
        <mvz-fıkra no="1">
          <template>Ticari ve sınai bütün müesseseler sahipleri müstahdemlerini kendi vesaitiyle kanunun gösterdiği müddetlerde çiçek aşısı ile aşılamağa mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="94" başlık="">
        <mvz-fıkra no="1">
          <template>Kanuni mühlet zarfında mükerreren aşılandığını vesikalarla ispat edemiyenlerin Devlet, belediye hizmetlerinde veya hususi ve umumi ticaret ve sanayi müesseselerinde, büyük çiftliklerde istihdamı veya mekteplere kabulü memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="95" başlık="">
        <mvz-fıkra no="1">
          <template>Sari hastalıklara karşı kullanılan her nevi serum ve aşılar Hükümet tarafından ihzar edilir. Hariçten getirilenlerin Sıhhat ve İçtimai Muavenet Vekaletince tayin olunan vasıf ve şartları haiz olmaları mecburidir. Dahilde beşeri serum ve aşı imali Sıhhat ve İçtimai Muavenet Vekaletinin müsaadesine ve murakabesine tabidir. Bu müesseselerin vasıfları ve şartları Vekaletçe tayin olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="96" başlık="">
        <mvz-fıkra no="1">
          <template>Kuduz aşısı ihzar ve tatbikı için iktiza eden müesseseler Sıhhat ve İçtimai Muavenet Vekaletince veya onun müsaade ve murakabesi altında resmi teşkilatı tarafından açılır ve aşı meccanen tatbik olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="3-ÜÇÜNCÜ" başlık="Sıtma ile mücadele">
      <mvz-madde no="97" başlık="">
        <mvz-fıkra no="1">
          <template>Sıtmalı olduğu Sıhhat ve İçtimai Muavenet Vekaletince neşir ve ilan edilecek mahallerde sıtmanın her türlü şekillerinin 58, 59, 60, 61 inci maddelerde musarrah olduğu veçhile ihbarı mecburidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="98" başlık="">
        <mvz-fıkra no="1">
          <template>Sıtma mücadelesi, hususi kanununa ve talimatnamelerine tevfikan icra olunur. Askeri makamlar Sıhhat Vekaletince kabul edilen esaslar dahilinde askeri kıtaat ve teşkilatta sıtma mücadelesi yaparlar ve yapılan tedbirleri sıtma mücadele reislerine veya sıhhat müdürlüklerine bildirirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="4-DÖRDÜNCÜ" başlık="Trahom ile mücadele">
      <mvz-madde no="99" başlık="">
        <mvz-fıkra no="1">
          <template>Ahalisinin büyük bir kısmının trahom hastalığına müptela olduğu tahakkuk eden mahallerde Sıhhat ve İçtimai Muavenet Vekaleti tarafından mücadele heyetleri teşkil edilir ve iktiza eden müesseseler açılır. Buralarda hastalığın tedavisi için hastalar üzerinde yapılacak bütün tedbirler ve ameliyeler meccanen icra olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="100" başlık="">
        <mvz-fıkra no="1">
          <template>Trahomlu olduğu Vekaletçe neşrü ilan edilecek mahallerde trahom hastalığının ve ihtilatlarının 58, 59, 60, 61 inci maddelerde tasrih edildiği üzere ihbarı mecburidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="101" başlık="">
        <mvz-fıkra no="1">
          <template>Trahom mücadele mıntıkalarında teşkil edilecek heyetler bütün ahaliyi muayene ve tescile ve trahoma müptela olduğu anlaşılan hastaları tedavi maksadı ile müesseselere celbe ve iktiza eden tedaviyi tatbika salahiyettardır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="102" başlık="">
        <mvz-fıkra no="1">
          <template>Gerek trahom mücadele mıntakalarında ve gerekse memleketin sair aksamında trahomun sari devresine musap olan hastaların bu devre devam ettiği müddetçe mektep, fabrika, imalathane veya sair resmi, hususi müessesata devamları menolunur. Trahom mücadele mıntakalarındaki çocukların tedrisatı için Sıhhat ve Maarif Vekaletlerince müştereken hususi tedbirler ittihaz olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Askeri makamlar Sıhhat Vekaletince kabul edilen esaslar dahilinde askeri kıtaat ve teşkilatta trahom mücadelesi yaparlar ve yapılan tedbirleri mahallerindeki sıhhat memurlarına bildirirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="5-BEŞİNCİ" başlık="Zührevi hastalıklarla mücadele">
      <mvz-madde no="103" başlık="">
        <mvz-fıkra no="1">
          <template>Vücudun hangi kısmında ve ne şekilde tezahür ederse etsin frengi, belsoğukluğu ve yumuşak şankr müptela her şahıs kendisini Türkiye'de sanat icrasına mezun bir tabibe tedavi ettirmeğe mecburdur. Çocukları tedavi ettirmek mecburiyeti ana ve babalarına veya bu çocuklara bakan ve himaye eden kimselerle müesseselere racidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="104" başlık="">
        <mvz-fıkra no="1">
          <template>Sanatını icra eden her tabip her ay nihayetinde protokol defterlerindeki kayıtlara nazaran o ay zarfında kendilerine müracaat eden frengili hastaların ismini, yaşını ve hastalığının devrini, evvelce bir tabip tarafından tedavi edilip edilmediğini Sıhhat ve İçtimai Muavenet Vekaletine bildirmek üzere bulunduğu mıntıkanın Sıhhat ve İçtimai Muavenet Müdürlüğüne yazı ile bildirir. Mahrem olarak alınacak bu ihbaratı ifşa eden memurlar hakkında Devletin mahrem kayıtlarını ifşa ve vazifei memuriyetini suiistimal etmenin istilzam ettiği mücazat tayin olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="105" başlık="">
        <mvz-fıkra no="1">
          <template>Frengi ve belsoğukluğu ve yumuşak şankr müptelaları bütün resmi sıhhat müesseselerinde veya Hükümet ve belediye tabipleri tarafından parasız tedavi edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="106" başlık="">
        <mvz-fıkra no="1">
          <template>Zührevi hastalıklardan biriyle musap olduğundan şüphe ve bu hastalıkları etrafına neşrü tamim ettiğinden endişe edilen kimseleri muayeneye sevk ve sıhhi hallerine dair birer rapor talep etmeğe alakadar Sıhhat ve İçtimai Muavenet Müdürleri ve Hükümet tabipleri mezundurlar. Bu gibi şahıslar arzu ettikleri takdirde kendilerini hususi bir tabibe muayene ettirerek ondan alacakları raporu ibraz edebilirler. Bu hususta imzasız ve adressiz ihbarat mesmu olamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="107" başlık="">
        <mvz-fıkra no="1">
          <template>Zührevi bir hastalığa müptela olduğu tahakkuk ederek hastalığı etrafına neşir ve sirayet ettirdiğinden şüphe edilen kimseler cebren tedaviye sevk olunabileceği gibi hastalığın sirayetine mani olmak üzere bir hastanede tecrit ve tedavi altına alınabilir. Bu hususta kuvvei cebriye istimali dahi caizdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="108" başlık="">
        <mvz-fıkra no="1">
          <template>Zührevi hastalıklardan birine musap hastalardan biri tedaviyi ikmal etmeden ortadan kaybolduğu takdirde tedavi eden tabibi,mıntıkası Sıhhat ve İçtimai Muavenet Müdürlüğüne yazı ile malümat vermeğe mecburdur. Sıhhat müdürleri tedaviden ayrılan bu hastanın diğer bir tabip tarafından veya herhangi resmi müessesede tedavi edilip edilmediğini icap ederse bizzat hastanın kendisinden izahat alarak tahkika ve tedavi edilmediği tahakkuk edenleri 107 nci madde mucibince tedaviye sevke mezundur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="109" başlık="">
        <mvz-fıkra no="1">
          <template>Her tabip tedavi altında bulunan zührevi hastalıklar musaplarının ellerine bu hastalığın tehlikesini ve sirayet yollarını bildirecek, nümunesi Sıhhat ve İçtimai Muavenet Vekaletince tesbit edilmiş bir (Vesayayi sıhhiye varakası) vermeğe mecburdur. Hasta çocuk olduğu takdirde bu izahat ve vesaya varakası hastanın ana ve babasına ve olmazsa sair yakınına verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="110" başlık="">
        <mvz-fıkra no="1">
          <template>Zührevi hastalıklardan birine düçar olduğunu bildiği veya görünüşe nazaran veyahut tedavisi altında bulunduğu tabiplerinin izahatıyla bu hastalıklardan birine müptela olduğunu bilmesi lazım geldiği halde hastalığı bir diğerine sirayet ettirenler hakkında bu Kanunda mezkur mücazat tatbik olunur. Frengili bir çocuğun frengiye musap olduğunu bildiği halde salim bir süt anneye emzirtmek memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="111" başlık="">
        <mvz-fıkra no="1">
          <template>Ahalisinden bir kısmının frengiye musap olduğu anlaşılan veya şüphe edilen mıntakalarda Sıhhat ve İçtimai Muavenet Vekaleti tarafından mücadele heyetleri teşkil ve lazım gelen müesseseler açılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="112" başlık="">
        <mvz-fıkra no="1">
          <template>Frengi mücadele heyetleri,mıntakaları dahilinde bütün ahaliyi muayene ve tescile ve frengiye müptela olduğu anlaşılan hastaları tedavi maksadıyle müesseselere celp ve iktiza eden müdavatı tatbika salahiyettardırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Askeri kıtalarda teşkilatta zührevi hastalıklarla mücadele askeri makamlarca temin olunur. Sirayet devresinde zührevi hastalıklar musapları fenni usulle tedavi edilmedikçe terhis edilmez.Askerlik esnasında frengili olduğu tesbit edilenlerin künye defterleri, gördükleri tedavi tarzı hakkındaki malumat ile beraber Müdafaai Milliye Vekaletince Sıhhat Vekaletine gönderilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="6-ALTINCI" başlık="Veremle mücadele">
      <mvz-madde no="113" başlık="">
        <mvz-fıkra no="1">
          <template>Akciğer ve hançere vereminin her sari şeklinde musap olanlarla veremin herhangi seriri şekline musap olarak vefat edenlerin isim ve adresleriyle ihbarı mecburidir.Musaplar sekiz gün ve vefatlar yirmi dört saat zarfında hastalığı veya ölümü teşhis ve tesbit eden her tabip tarafından en yakın sıhhiye dairesine şifahen veya tahriren ihbar edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="114" başlık="">
        <mvz-fıkra no="1">
          <template>Veremli hastanın ikametgah değiştirmesi halinde nakilden haberdar olan tabip derakap keyfiyeti ve nakledilecek mahalli evvelce hastayı haber verdiği sıhhiye dairesine ihbara mecburdur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="115" başlık="">
        <mvz-fıkra no="1">
          <template>Hastanelerde, doğum evlerinde, hapisanelerde, sair resmi veya hususi müesesatı sıhhiye ve hayriyedeki bütün veremli hastalarla buralarda vukua gelen verem vefiyatı yirmi dört saat zarfında o müessesenin müdürü tarafından ihbar edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Askeri kıtaat ve teşkilatta tedavi edilen veya vefat eden veremliler buralardaki askeri tabipler tarafından ve mensup oldukları kumandanlıklar vasitasiyle alakadar sıhhat makamlarına ihbar olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="116" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhat ve İçtimai Muavenet Vekaletince küşat edilen verem dispanserlerinin mevcut olduğu mahallerde verem musaplarının doğrudan doğruya dispanser tababetine ihbar edilmesi vekaletçe neşrü ilan edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="117" başlık="">
        <mvz-fıkra no="1">
          <template>Resmi bakteroyoloji laboratuvarları veremlilere ait olup tabipler tarafından gönderilen maddeleri meccanen muayene ve neticesini gönderen tabiplere iş'ar ederler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="118" başlık="">
        <mvz-fıkra no="1">
          <template>Hükümet veya belediye tabiplerinin veya tabibi müdavilerinin talebi üzerine veremlilerin ikametgahları ve eşyaları meccanen tathir ve tephir olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="119" başlık="">
        <mvz-fıkra no="1">
          <template>Sari şekilde verem hastalığına musap olduğu tebeyyün eden ve etrafında bulunan kimseleri intana duçar edeceğinden şüphe olunan hastaları hastane veya sair bir müessesede tecrit veya tedaviye veya meslek ve sanatları dolayısiyle küçük çocukları verem intanına duçar edecekleri tahakkuk edenleri meslek ve sanatlarını icradan men'e Sıhhat ve İçtimai Muavenet Vekaleti salahiyettardır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="120" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhat ve İçtimai Muavenet Vekaleti fennen lüzum göreceği eşhasa veremden vikayeye matuf tedbirleri tatbika mezundur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="121" başlık="">
        <mvz-fıkra no="1">
          <template>Veremle mücadele cemiyetlerine ait müesseselerle bu cemiyetler tarafından tatbik edilen mücadele tedbirleri Sıhhat ve İçtimai Muavenet Vekale tinin murakabesine tabidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="7-YEDİNCİ" başlık="Geçen fasıllar arasında müşterek hükümler">
      <mvz-madde no="122" başlık="">
        <mvz-fıkra no="1">
          <template>Evlenecek erkek ve kadınlar evlenmeden evvel tıbbi muayeneye tabidir. Bu muayenenin sureti icrası ve teferrüatı hakkında Cumhurbaşkanınca çıkarılan yönetmelik neşrolunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="123" başlık="">
        <mvz-fıkra no="1">
          <template>Frengi, belsoğukluğu ve yumuşak şankr ve cüzzama ve bir marazı akliye müptela olanların evlenmesi memnudur. Bu hastalıklar usulü dairesinde tedavi edilip sirayet tehlikesi geçtiğine veya şifa bulduğuna dair tabip raporu ibraz olunmadıkça musapların nikahları aktolunmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="124" başlık="">
        <mvz-fıkra no="1">
          <template>İlerlemiş sari vereme musap olanların nikahı altı ay tehir olunur. Bu müddet zarfında salah eseri görülmezse bu müddet altı ay daha temdit edilir. Bu müddet hitamında alakadar tabipler her iki tarafa bu hastalığın tehlikesini ve evlenmenin mazarratını bildirmeğe mecburdur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="125" başlık="">
        <mvz-fıkra no="1">
          <template>Süt annelik yapacak kadınlar zührevi hastalıklarla sari vereme ve cüzzama musap olmadıklarını müspit tabip raporları alırlar. Raporlar her altı ayda bir tecdit olunur. Bu raporu olmayan kadınların süt annelik etmesi ve rapor talep etmeden herhangi bir kadının süt anneliğe kabul edilmesi memnudur. Resmi tabipler süt annelik edecek kadınları meccanen muayene ve raporlarını ita ederler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="126" başlık="">
        <mvz-fıkra no="1">
          <template>Gıda üretim ve satış yerleri ve toplu tüketim yerleri ile insan bedenine temasın söz konusu olduğu temizlik hizmetlerine yönelik sanatların ifa edildiği iş yeri sahipleri ve bu iş yerlerinin işletenleri, çalışanlarına, hijyen konusunda bu iş yerlerindeki meslek ve faaliyetin gerektirdiği eğitimi vermeye veya çalışanların bu eğitimi almalarını sağlamaya, belirtilen eğitimleri almış kişileri çalıştırmaya, çalışan kişiler ise bu eğitimleri almaya mecburdurlar. Bizzat çalışmaları durumunda, iş yeri sahipleri ve işletenleri de bu fıkra kapsamındadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bulaşıcı bir hastalığı olduğu belgelenenler ile iş yerinin faaliyet ve hizmetlerinden doğrudan yararlananları rahatsız edecek nitelikte ve görünür şekilde açık yara veya cilt hastalığı bulunanlar, bizzat çalışan iş yeri sahipleri ve işletenleri de dâhil olmak üzere, alınacak bir raporla hastalıklarının iyileştiği belgeleninceye kadar, birinci fıkrada belirtilen iş yerlerinde çalışamaz ve çalıştırılamazlar. Çalışanlar, hastalıkları konusunda işverene bilgi vermekle yükümlüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="127" başlık="">
        <mvz-fıkra no="1">
          <template>126 ncı maddede belirtilen iş yerlerindeki hijyen eğitimine yönelik hususlara, bu iş yerlerinde çalışmaya engel bulaşıcı hastalıkların ve cilt hastalıklarının neler olduğuna, iyileşme hâlinin belirlenmesine, hangi meslek ve sanat erbabının 126 ncı madde kapsamında olduğuna ilişkin usûl ve esaslar, Sağlık, İçişleri, Çevre ve Şehircilik ve Gıda, Tarım ve Hayvancılık Bakanlıklarınca müştereken çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>126 ncı maddede belirtilen iş yerlerinde bulaşıcı bir hastalık veya bir salgın hastalık çıkması durumunda, bu hastalıkla alakalı gerekli incelemeler, analiz masrafları iş yeri sahipleri ve işletenlerince karşılanmak üzere ilgili kurumlar tarafından yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>126 ncı maddede belirtilen iş yerlerinde bulaşıcı bir hastalık veya bir salgın hastalık çıkması hâlinde doğacak hukukî sorumluluklar ile bu durumdan zarar gören kişi veya kurumların hukukî yol vasıtasıyla talep edebilecekleri tazminat ödemeleri veya olabilecek diğer ödemeler iş yeri sahiplerine ve işletenlerine aittir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
  </mvz-bap>
  <mvz-bap no="3-ÜÇÜNCÜ" başlık="Umumi kadınlar hakkında ahkam">
    <mvz-madde no="128" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="129" başlık="">
      <mvz-fıkra no="1">
        <template>Fuhşu, sanat ve maişet vasıtası ittihaz eden kadınlardan zührevi hastalıkların her türlü eşkaline, cüzzam, cerp, empetigo, entertrigo, müterakki verem veya Sıhhat ve İçtimai Muavenet Vekaletinin fennen lüzum göreceği sair hastalıklara musap olanların sanatlarının icrasına icap ederse kuvvei cebriye istimali ile mümanaat olunur. Bunlar lüzum görülürse bir müessesede tecrit ve tedavi edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="130" başlık="">
      <mvz-fıkra no="1">
        <template>Umumi evlerde her nevi ispirtolu içkilerin istihlaki memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="131" başlık="">
      <mvz-fıkra no="1">
        <template>Fuhuş sebebiyle intişar eden hastalıklara karşı tedbir ittihazı masarifi belediyelere aittir. Bu husus için umumi evler sahiplerinden 128 inci maddede zikredilen yönetmelikte gösterilecek bir ücret alınabilirse de umumi kadınlardan şahsan her nevi resim veya ücret cibayeti usulü mülgadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="132" başlık="">
      <mvz-fıkra no="1">
        <template>Umumi kadınlara mütaallik gerek ahlaki ve gerek intizamı umuminoktai nazarından yapılacak takibat ve sagirlerin fuhuş telkinatından vikayesimahsus kanunlarına tevfikan ait olduğu daireler tarafından icra olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="4-DÖRDÜNCÜ" başlık="Muhacerete ait sıhhi işler">
    <mvz-madde no="133" başlık="">
      <mvz-fıkra no="1">
        <template>Türkiye'de tavattun etmek üzere topluca ve kafile halinde gelen ecnebi tabiiyetindeki şahıslar veya tabiiyetini terkederek Türkiye tabiiyetine dahil olmak isteyen muhacirler Sıhhat ve İçtimai Muavenet ve Dahiliye Vekaletlerince müştereken tayin edilecek hudut kapılarından veya limanlarından memlekete dahil olurlar. Türkiye'de azami üç ay kalmak veya tavattun etmek isteyen ecnebilerle tabiiyetini terkederek Türk tabiiyetini kabul etmek isteyen şahıslar münferiden veya bir aile halinde geldikleri takdirde her taraftan memlekete dahil olabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="134" başlık="">
      <mvz-fıkra no="1">
        <template>57 nci maddede zikredilen sari ve salgın hastalıklardan veya zührevi hastalıklardan birine musap olanlar, cüzzam, trahom ve Sıhhat ve İçtimai Muavenet Vekaletince tayin olunacak hastalıklardan birine duçar olanların ve mecnunların ve fuhuşla melüf kadınların 133 üncü maddede mezkür kimseler meyanında memlekete girmesi memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="135" başlık="">
      <mvz-fıkra no="1">
        <template>134 üncü maddedeki memnuiyite ait istisnalar ve bütün muhacirlere veya tavattun etmek üzere gelen ecnebilere tatbik edilecek sıhhi tedbirler ve bunların iskan edilecekleri mahallere kadar sevk ve murakabeleri tarzları Sıhhat ve İçtimai Muavenet ve Dahiliye Vekaletlerince müştereken tesbit olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="136" başlık="">
      <mvz-fıkra no="1">
        <template>134 üncü maddede zikredilen hastalıklardan birine musap olan şahısları getiren gemiler ve şimendifer idareleri bunları tekrar getirdikleri yerlere iadeye veya sıhhat memurları tarafından müşahede, tecrit ve tedavi altına alınmak üzere bu memurlar tarafından gösterilecek mahalle kadar sevke mecburdurlar. Bu husustaki masarif bu nakil vasıtaları idarelerine aittir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="137" başlık="">
      <mvz-fıkra no="1">
        <template>Ecnebi memleketlerden gelen her vapur kaptanı sıhhi muamele esnasında hudutlar ve sahiller sıhhat memurlarına limına çıkacak yolcuların ve kara ile ihtilat edecek taifenin ve topluca ve kafile halinde Türkiyeye gelmek üzere bulunan eşhasın isimlerini bildiren bir liste verecek ve bunların içinde hasta mevcut olduğu takdirde gemi tabibinin tasdikiyle musap olduğu veya musabiyetinden şüphe edildiği hastalık bildirilecektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="138" başlık="">
      <mvz-fıkra no="1">
        <template>Topluca ve kafile halinde muhacir nakleden Türk ve ecnebi gemilerin hükümetlerince musaddak bir tabibi ve hastalık ve müstacel ahvalde kullanmağa mahsus ecza ve tıbbi levazımı olmalıdır. Vapurların her tarafı ve bilhassa muhacirlerin bulunduğu mahaller gayet temiz ve sıhhi şeraiti haiz olacak ve muhacirler hava şedaidinden mahfuz olarak nakledilecektir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="5-BEŞİNCİ" başlık="Gemiler, demiryolları ve sair nakliyat vasıtaları sıhhi işleri">
    <mvz-madde no="139" başlık="">
      <mvz-fıkra no="1">
        <template>Yolcu taşıyan Türk gemilerinde hususi kanunda gösterilen şartlar dahilinde istihdam edilecek tabiplerin Türkiye'de sanat icrasına mezun ve Sıhhat ve İçtimai Muavenet Vekaletince tasdik edilmiş olması lazımdır. Bu tabipler gemi tabipliğine tayin olunmak için bu bapta neşredilecek talimatnameye tevfikan Vekaletçe bir imtihana tabi tutulurlar ve imtihanda muvaffak olanlara gemi tabipliği vazifesini ifa edebileceklerini mübeyyin bir vesika verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="140" başlık="">
      <mvz-fıkra no="1">
        <template>139 uncu maddede zikredilen vesikayı hamil olmayan tabiplerin gemi tabipliklerinde istihdamı memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="141" başlık="">
      <mvz-fıkra no="1">
        <template>Yolcu gemilerinde bulunması lazım gelen ilaç ve tıbbi levazım ile hasta tedavisi için tefrik edilen mahaller ve bu gemilerin şerait ve yolcu mahallerinin sıhhi vasıfları ve izdihama mani olacak ve yolcuların selamet ve emniyetini temin eyleyecek tedbirler Sıhhat ve İçtimai Muavenet ve İktisat Vekaletlerince müştereken bir yönetmelik ile tesbit olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="142" başlık="">
      <mvz-fıkra no="1">
        <template>Gemi tabipleri, gemi dahilindeki mürettebat ile üçüncü sınıf yolcuları ve deniz tutması, kaza veya sari hastalık vukuunda diğer sınıf yolcuları meccanen tedaviye mecburdur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="143" başlık="">
      <mvz-fıkra no="1">
        <template>Gemi tabipleri musaddak bir defter tutarak her seferdeki sıhhi vakaları hastalananların esami ve hastalıklarını ve yapılan tedaviyi umumiyetle geminin sıhhi hallerini kayıt ve imza ve kaptana tasdik ettirir. Bu defter seferden mebde limanına avdette orada sahiller sıhhi işlerine nezaretle mükellef memurlara ibraz olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="144" başlık="">
      <mvz-fıkra no="1">
        <template>Gemi tabibi memleketi sari ve salgın hastalıklardan korunmağa matuf tedbirleri teshil ve bu hususta ait olduğu makamlarca verilecek emirler ve talimatın icrası ile mükelleftir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="145" başlık="">
      <mvz-fıkra no="1">
        <template>Gerek uzun sefer yapan ve gerekse limanlar dahilinde veya kısa mesafeler içinde veya nehirlerde işleyen her nevi merakıp, sahiller sıhhi işlerine nezaretle mükellef memurlar tarafından murakabeye tabidir. Gemilerin kaptanları veya reisleri sari ve salgın hastalıkların zuhuruna mani olmak üzere gerek gemilerde ve gerekse mürettebata tatbikına bu makamlarca lüzum gösterilecek tedbirlere riayetle mükelleftir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="146" başlık="">
      <mvz-fıkra no="1">
        <template>Demiryolu, tramvay, otobüs ve omnibüs gibi umumi nakil vasıtaları vagon ve arabalarında sari va salgın hastalıkların intikal ve sirayetine mani olmak üzere tatbikına sıhhi memurlarca lüzum gösterilecek tedbirlerin ifasına, bu nakil vasıtaları idareleri mecburdurlar. Şahıslara ait ve fakat umumi nakil işlerinde kullanılan vasıtalar sahipleri dahi aynı mecburiyete tabidirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="147" başlık="">
      <mvz-fıkra no="1">
        <template>Sari ve salgın hastalıklara müptela şahıslar ancak sıhhat memurlarının müsaadesi ile ve bu husustaki kaidelere riayet etmek şartı ile umumi nakil vasıtaları ile naklolunabilir. Müsaadesiz umumi nakil vasıtaları ile sari hastalık musaplarının nakli memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="148" başlık="">
      <mvz-fıkra no="1">
        <template>Sıhhat ve İçtimai Muavanet Vekaletince görülecek lüzum üzerine sari ve salgın hastalıkların zuhur ettiği mahallerden gelen yolcu ve eşyanın muayenesi için şimendifer istasyonlarında muayene mevkileri tesis olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="149" başlık="">
      <mvz-fıkra no="1">
        <template>Şimendifer idarelerince büyük demiryolu istasyonlarında ve yolcu katarlarında kaza ve müstacel hastalık vakalarında istimal edilecek levazım ve mevaddı tıbbiyenin hazır bulundurulması mecburidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="150" başlık="">
      <mvz-fıkra no="1">
        <template>Gemi süvarileri ve çarkçı ve dümencileri, demiryolu makinistleri, otomobil ve otobüs şoförleri veya lüzum görülecek sair vesaiti nakliye müstahdeminin hizmete duhulden evvel bedeni, akli, ruhi ve basari, üzni muayenelerinin icrasına mütaallik olmak üzere hususi hükümler vazedilecek ve bu muayenelere tabi olmadan hiç bir şahıs bu gibi hizmetlere kabul edilmeyecektir. Bu muayeneler resmi sıhhat müesseseleri tarafından meccanen yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="6-ALTINCI" başlık="Çocuk hıfzıssıhhası">
    <mvz-fasıl no="1-BİRİNCİ" başlık="Çocukluk ve gençlik koruması">
      <mvz-madde no="151" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhat ve İçtimai Muavenet Vekaleti küçük çocuk hıfzıssıhhası ve bunlarda görülen vefiyatın azaltılması için lazım gelen müesseseler açarak idare eder ve çocuk hıfzıssıhhası faydalarının halk arasında intişar ve tatbikını teshil edecek tedbirleri ittihaz eyler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="152" başlık="">
        <mvz-fıkra no="1">
          <template>çocuk düşürmeğe vasıta olup Sıhhat ve İçtimai Muavenet Vekaletince tayin olunacak alat ve levazımın ithal ve satışı memnudur. Bunların tababette müstamel envaı Sıhhat ve İçtimai Muavenet Vekaletinin tayin edeceği şartlar dairesinde ithal edilir ve eczanelerde reçete ile satılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="153" başlık="">
        <mvz-fıkra no="1">
          <template>Devletin resmi müesseselerinde doğum yardımı meccanidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gebe veya rahmindeki bebek için tıbbi zorunluluk bulunması hâlinde doğum, sezaryen ameliyatı ile yaptırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Gerekli tedbirlerin alınmasına rağmen, doğumu takiben anne veya bebekte meydana gelebilecek istenmeyen sonuçlardan dolayı hekim sorumlu tutulamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="154" başlık="">
        <mvz-fıkra no="1">
          <template>Hükümet ve belediye tabipleri ve ebeleri fakir kadınların doğurmasından meccanen yardıma mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="155" başlık="">
        <mvz-fıkra no="1">
          <template>Kendisi ve çocuğunun sıhhati için bir zarar husule getirmeyeceği bir tabip tarafından tahriren tasdik edilmedikçe kadınların doğumlarından mukaddem üç hafta ve doğurmasını mütaakip yine üç hafta zarfında fabrika, imalathane ve umumi ve hususi müesseselerde çalışması ve çalıştırılması memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="156" başlık="" durum="mülga">
      </mvz-madde>
      <mvz-madde no="157" başlık="">
        <mvz-fıkra no="1">
          <template>Sütninelik edecek kadınlar kendi çocuklarının yedi aylıktan fazla olduğuna dair resmi vesikalar ibraz etmedikleri ve kafi emzirme kabiliyeti mevcut olmadığı takdirde sütninelik etmelerine müsaade edilmez. Süt annenin çocuğu yedi aylıktan küçük olduğu halde bunun başka kadın tarafından emzirildiği ispat olunmak lazımdır. Bu vesikalar süt annelerin 125 inci maddede gösterilen muayenesi esnasında talep edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="158" başlık="">
        <mvz-fıkra no="1">
          <template>Yedi yaşından aşağı olan metrük, öksüz veya babası ve anası hayatta çocukları gerek para ile ve gerek parasız kabul ederek bakan resmi ve hususi bütün müesseseler Sıhhat ve İçtimai Muavenet Vekaletinin murakabe ve teftişine bağlıdır. Bu tarzdaki müesseselerin küşadı, sahipleri tarafından Vekalete ihbar olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="159" başlık="">
        <mvz-fıkra no="1">
          <template>Nezdine yedi yaşından aşağı çocukları para mukabilinde bakmak üzere alan eşhasın evvela mahalli belediyesinden müsaadei mahsusa alması mecburidir. Belediye heyeti sıhhiyesince bu gibi eşhasın ikametgahı ve sair şartları muvafık görüldüğü tasdik edilmeden bu müsaade ita edilmez. Bu gibi eşhasın ikametgahları da 158 inci maddede bahsedilen teftişe tabidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="160" başlık="">
        <mvz-fıkra no="1">
          <template>Kabul ettikleri çocukların sıhhat ve hayatlarını muhafaza için lazım gelen vasıtalar noksan olur veya çocukların sıhhat ve hayatını duçarı tehlike eden mahzurlar mevcut bulunursa 158 ve 159 uncu maddelerde zikredilen müesseseler ve şahıslar, sıhhat memurlarının tahriri ihtarlariyle bu noksanlar ve mahzurları izaleye mecburdurlar. Bu ihtarları on beş gün zarfında icra ettirmeyenlerin çocukları nezdlerinde bulundurmalarına müsaade edilmez ve müesseseleri kapatılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="161" başlık="">
        <mvz-fıkra no="1">
          <template>Metrük çocukları altı yaşını ikmal edinceye kadar mahalli belediyeleri, belediye olmayan yerlerde köy heyeti ihtiyariyeleri himayeye mecburdurlar. Hususi müesseseleri olmayan yerlerde belediyeler bu çocukları icap ederse bir ücret mukabilinde bakılmak ve büyütülmek üzere aileler nezdine verirler.  Altı yaşından sonra bu çocukların himayesi ve tahsil ettirilmesi Maarif Vekaletince deruhde olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="162" başlık="">
