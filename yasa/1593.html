        <mvz-fıkra no="1">
          <template>Nüfusu on binden fazla olan mahallerde belediyeler bir "Süt çocuğu muayene ve müşavere evi" tesis ederler. Bu müesseselerin vasıf ve şartları ve vazifeleri Sıhhat Vekaletince tayin olunur. Nüfusu kırk binden fazla olan mahallerde bunlara merbut olmak üzere bir "Süt damlası"tesis edilir. Nüfusu yüz binden fazla olan mahallerde bu müesseseler ihtiyaca göre tezyit olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="163" başlık="">
        <mvz-fıkra no="1">
          <template>Bilümum mekteplerin bina ve sıhhi şartları ve sari salgın hastalıklardan vikayeleri hususları Sıhhat ve içtimai Muavenet Vekaletinin murakabesi altındadır. Yalnız talebenin şahıslarına ait sıhhi murakabe bu mekteplerin tabi oldukları makamlar, cemiyetler veya şahıslar tarafından ifa edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="164" başlık="">
        <mvz-fıkra no="1">
          <template>Alelümum mekteplerde muayyen fasılalarla talebenin beden, ruh ve göz ve kulaklarına ait muayeneler mekteplerin hususi tabipleri tarafından icra ve her talebeye mahsus ayrı kayıt varakalarına tesbit olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="165" başlık="">
        <mvz-fıkra no="1">
          <template>On yaşından aşağı çocuğun babası, anası veya öksüz olanlarda sair hısımları tarafından hayat ve sıhhatı ve ahlakını tehlikeye maruz bırakacak fena muameleye, teşviklere veya cebre duçar olduğu takdirde bunların belediye veya Devlet müesseselerine kabul edilmek üzere nezdinde bulunduğu kimselerden ayrılması caizdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="166" başlık="">
        <mvz-fıkra no="1">
          <template>On iki yaşından aşağı çocukların yanlarında ebeveyni veya velileri olduğu halde dahi meyhanelere girmesi ve on sekiz yaşından aşağı gençlere her nevi ispirtolu içki verilmesi veya satılması memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="167" başlık="">
        <mvz-fıkra no="1">
          <template>On iki yaşından aşağı çocukların, sinema ve tiyatro ve dans salonu ve bar gibi mahallere getirilmesi ve kabul edilmesi memnudur. Altı yaşından yukarı olanların gündüzün terbiyevi veya hususi mahiyette olan sinema veya tiyatrolara getirilmesine müsaade olunabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="168" başlık="">
        <mvz-fıkra no="1">
          <template>Her şehir ve kasaba belediyeleri o şehir ve kasabanın vüs'at ve nüfusunun adedine göre icap eden büyüklükte küçük çocukların temiz hava almasına mahsus bir veya mütaaddit bahçeler ve spor meydanları vücude getirmeğe mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="169" başlık="">
        <mvz-fıkra no="1">
          <template>Kız liselerinde ve orta tahsilli kız mekteplerinde mektep idarelerince münasip görülecek sınıflarda talebeye fenni çocuk bakımı usulleri nazari ve ameli surette öğretilmek üzere haftada laakal bir saatlik mahsus bir ders küşat olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="2-İKİNCİ" başlık="Süt hakkında">
      <mvz-madde no="170 - 172" başlık="" durum="mülga">
      </mvz-madde>
    </mvz-fasıl>
  </mvz-bap>
  <mvz-bap no="7-YEDİNCİ" başlık="İşçiler hıfzıssıhhası">
    <mvz-madde no="173" başlık="">
      <mvz-fıkra no="1">
        <template>On iki yaşından aşağı bütün çocukların fabrika ve imalathane gibi her türlü sanat müesseseleriyle maden işlerinde amele ve çırak olarak istihdamı memnudur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>On iki yaş ile on altı arasında bulunan kız ve erkek çocuklar günde azami sekiz saatten fazla çalıştırılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="174" başlık="">
      <mvz-fıkra no="1">
        <template>On iki yaş ile on altı yaş arasında bulunan çocukların saat yirmiden sonra gece çalışmaları memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="175" başlık="">
      <mvz-fıkra no="1">
        <template>Bütün amele için gece hizmetleriyle yer altında icrazı lazımgelen işler 24 saatte sekiz saatten fazla devam edemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="176" başlık="">
      <mvz-fıkra no="1">
        <template>Mahalli belediyelerince bar, kabare, dans salonları, kahve, gazino ve hamamlarda on sekiz yaşından aşağı çocukların istihdamı menolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="177" başlık="">
      <mvz-fıkra no="1">
        <template>Gebe kadınlar doğumlarından evvel üç ay zarfında çocuğunun ve kendisinin sihhatine zarar veren ağır hizmetlerde kullanılamaz. Doğurduktan sonra 155 inci maddede tayin edilen muayyen müddet istirahatını mütaakıp işe başlıyan emzikli kadınlara ilk altı ay zarfında çocuğunu emzirmek üzere mesai zamanlarında yarımşar saatlik iki fasıla verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="178" başlık="">
      <mvz-fıkra no="1">
        <template>Her nevi sanat müesseseleri ve maden ocakları ve inşaat yerleri dahilinde veya yakınında ispirtolu meşrubat satışı veya umumi evler açılması memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="179" başlık="">
      <mvz-fıkra no="1">
        <template>Aşağıdaki mevaddı ihtiva eylemek üzere işçilerin sıhhatini korumak için İktisat ve Sıhhat ve İçtimai Muavenet Vekaletleri tarafından müşteken bir nizamname yapılır.</template>
        <mvz-bent no="1">
          <template>İş mahallerinin ve bunlara ait ikametgah ve saire gibi müştemilatın haiz olması lazımgelen sıhhi vasıf ve şartlar.</template>
        </mvz-bent>
        <mvz-bent no="2">
          <template>İş mahallerinde kullanılan alat ve edevat, makineler ve iptidai maddeler yüzünden zuhuru melhuz kaza, sari veya mesleki hastalıkların zuhuruna mani tedabir ve vesait.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kadınlarla 12 den 16 yaşına kadar çocukların istihdamı memnu olan sıhhate mugayir ve muhataralı işlerin neden ibaret olduğu iş kanununda tasrih edilecektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="180" başlık="" durum="mülga">
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="8-SEKİZİNCİ" başlık="Yenilecek ve içilecek şeyler ile kullanılacak bazı maddeler">
    <mvz-madde no="181" başlık="">
      <mvz-fıkra no="1">
        <template>umumi sıhhate taalük edip (183) ncü maddede envaı zikredilen eşya ve levazım, Sıhhat ve İçtimai Muavenet Vekaletinin teftiş ve murakabesine tabidir. Belediye teşekkül etmiş olan mahallerde bu murakabe vekaletin bu kanun dairesinde ıstar edeceği nizamnamelerle talimatlara tevfikan belediye tarafından ve belediyelerin bulunmadığı yerlerde vekalet sıhhi teşkilatına mensup memurlar tarafından icra edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sağlık ve Sosyal Yardım Bakanlığı belediyelerin bu teftiş ve murakabe hizmetlerini sürekli kontrol edebileceği gibi, lüzum gördüğü yerlerde veya lüzum görülen işlerde doğrudan doğruya teftiş ve murakabe etmek üzere memur görevlendirir. Gerektiğinde  183 üncü maddede sayılan eşya ve levazımın bakanlıkça tespit edilecek laboratuvarlarda tetkikini sağlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="182" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="183" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="184" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="185" başlık="">
      <mvz-fıkra no="1">
        <template>183 üncü maddede zikredilen eşya ve levazımı bunların gerek evsaf ve terkibi ve gerekse nezafetsizliği dolayısiyle kullananların sıhhatini az veya çok ihlal edecek surette muhafaza veya sevketmek veya bu nevi eşya ve levazımı satmak üzere nezdinde bulundurmak, satılığa çıkarmak veya satmak ve yahut gıda maddelerine ait olduğu herkesçe malüm ve üzerinde buna dair alamet mevcut bulunan kaplar derununa muzır ve zehirli maddeler koyarak satılığa çıkarmak memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="186" başlık="">
      <mvz-fıkra no="1">
        <template>Halkı aldatmak üzere gıda maddelerini ve 183 üncü maddenin ikinci fıkrasında mezkür eşyayı taklit veya tağşiş etmek veya mahlütluğunu ve bunun nisbetini bildirmeyerek taklit veyahut mağşuş gıda maddelerini satmak üzere nezdinde bulundurmak, satılığa çıkarmak ve satmak memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="187" başlık="">
      <mvz-fıkra no="1">
        <template>Gıda maddelerini yanlış unvan ve vasıflarla veya halkın aldan masını mucip olabilecek alametlerle ticarete çıkarmak, satmak üzere nezdinde bulundurmak ve satmak memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="188 - 193" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="194" başlık="">
      <mvz-fıkra no="1">
        <template>Sokaklarda, pazar yerlerinde seyyar olarak gıda maddeleri ve 183 üncü maddede zikredilen eşya ve levazımı satanların sattıkları eşya dahi teftişe tabi olup bunlardan lüzumuna göre nümune alınabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="195" başlık="">
      <mvz-fıkra no="1">
        <template>Seyyar esnaf, alakadar memurların teftişlerini ve numune almalarını kolaylaştırmaya ve kendilerine istedikleri izahatı vermeye mecburdurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="196" başlık="">
      <mvz-fıkra no="1">
        <template>Teftiş yapan memurların vakı teftişlerine ait olmak üzere merbut oldukları makamlara tevdi eyliyecekleri raporlarla kanuna muhalif hallerin ihbarı müstesna olmak üzere teftişleri esnasında muttali oldukları malümatı ve bazı gıda maddelerinin ihzar tarzlarına dair sanat esrarını ifşa eylemeleri memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="197" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanunun mer'iyeti tarihinden itibaren beş sene zarfında her mahallin belediyesi o yerin ihtiyacına muvafık vüs'atte Dahiliye ve Sıhhat ve İçtimai Muavenet Vekaletlerince evsaf ve şeraiti ile beraber yapılacak bir nizamnamenin göstereceği tiplerden birisini kabul ederek bir mezbaha inşa ettirecek veya mevcut olanı bu esasa göre ıslah eyleyecektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="198" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="199" başlık="">
      <mvz-fıkra no="1">
        <template>bu kanunda zikredilen kullanılacak eşya ve levazımın ayrı ayrı hususi vasıflarını ve bunların ne gibi ahvalde bozulmuş, taklit veya tağşiş edilmiş addedilebileceğini ve tahlil için alınacak nümune miktarını gösterir bir nizamname Sıhhat ve İçtimai Muavenet Vekaletince tanzim olunacaktır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="9-DOKUZUNCU" başlık="Maden suları ve kaplıcalar">
    <mvz-madde no="200" başlık="">
      <mvz-fıkra no="1">
        <template>Türkiye Cumhuriyeti arazisi dahilinde bulunan her nevi maden suları ile kaplıcaları işletmek için hususi hükümlerine tevfikan alınması lazımgelen müsaade ile beraber bu suların şifalı hassalarının Sıhhat ve İçtimai Muavenet Vekaleti tarafından tasdik edilmiş olması lazımdır. Bu vekaletçe şifalı hassaları veya tesisatının fenne muvafık olduğu tasdik edilmeyen maden suları bu nam ve unvan ile ticarete çıkarılamayacağı gibi kaplıcalara da tedavi maksadiyle eşhas kabul edilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="201" başlık="">
      <mvz-fıkra no="1">
        <template>İçmeğe mahsus maden suları ile yıkanmağa mahsus her nevi sıcak, soğuk kaplıcaların işletilmesinden evvel sahipleri veyahut bir şirket namına ise o şirketin idare meclisi reisi tarafından bir istida ile Sıhhat ve İçtimai Muavenet Vekaletine müracaat edilir. Bu istidaya suyun işletilmesi için vekaleti aidesinden istihsal edilmiş olan ruhsatname sureti ve mütehassıs bir mühendis tarafından yapılan menbaın nısıf kutru asgari beş yüz metrelik bir daire dahilindeki etraf ve civarının 1/200 mikyasında bir haritasiyle beraber suyun hikemi vasıflarını ve miktarını ve ne suretle bendedildiğini, mevcut veya mutasavver tesisatın şekil ve vasıflarını gösterir bir beyanname ve bir de tahlil raporu leffolunur.  Vekaletçe lüzum görüldüğü takdirde mahsus memurlar vasıtasiyle sudan nümune alınıp Devletmüessesatında suyun tahlili tekrar icra ettirilir. Bu husustaki masarif istida sahibine aittir. Hali hazırda mevcut ve işletilmekte olan maden suları ve kaplıcalar da bu mecburiyete tabidirler. Bunların sahip veya müstecirlere kanunun mer'iyeti tarihinden itibaren bir sene zarfında bu maddede zikredilen vesikaları Sıhhat ve İçtimai Muavenet Vekaletine tevdi ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="202" başlık="">
      <mvz-fıkra no="1">
        <template>Maden suları ve kaplıcalar sıhhi noktai nazardan Sıhhat ve İçtimai Muavenet Vekaletinin murakabesi altında olup bunlar her zaman teftişe tabidirler. Bu sanayi sahip veya müstecirleri bu hususta her türlü kolaylığı göstermeğe mecburdurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="203" başlık="">
      <mvz-fıkra no="1">
        <template>İçilmeğe mahsus olarak hususi kablar derununda ticarete çıkarılan maden suları derununa her nevi kimyevi maddeler veya suyun terkibine yabancı gazlar ilavesi memnudur. Maden suları derununda mevcut bazı gazların çoğaltılması için aynı cinsten sun'i gaz ilave etmek caiz isede bunun evvelce Sıhhat ve İçtimai Muavenet Vekaletine ihbar edilmesi ve suyu havi kablar üzerine sun'i gaz ilave edildiğinin aşikar surette yazılması lazımdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="204" başlık="">
      <mvz-fıkra no="1">
        <template>Şifalı hassaları kabul edilmiş olan maden suları ve kaplıcaların etrafında bir himaye mıntakası tesisini sahip veya müstecirleri talep edebilirler. Bunun için bir istida ve esbabı mucibe ve laakal üç senedenberi tedavi maksadiyle gelen kimselerin adedini bildiren bir beyanname ile Sıhhat ve İçtimai Muavenet Vekaletine müracaat olunur. İstida üzerine Sıhhat ve İçtimai Muavenet ve İktisat Vekaletleri müştereken talebi tetkik ettikten başka mahallinde tefahhus ettirerek suyun umumun menfaatına yarayıp yaramadığını tesbit ve himaye mıntakasının hududu tayin olunur. Bu himaye mıntakası dahilinde her nevi yer altı toprak ameliyatı ve sondaj icrası memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="205" başlık="">
      <mvz-fıkra no="1">
        <template>Sıhhat ve İçtimai Muavenet Vekaleti tesisatın vüs'atine ve müracaat eden hastaların miktarına göre havassı şifaiyeyi haiz içme ve kaplıca mahallerinde fenni hususattan da mes'ul olmak üzere Vekaletçe ihtısası tasdikli bir tabibin istihdamını sahip veya müstecir veyahut heyeti idaresinden talep edebilir. Bu takdirde görülecek lüzum üzerine daimi veya tedavi mevsimine munhasır olmak üzere ihtiyaca göre bir veya bir kaç tabip tayini mecburidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="206" başlık="">
      <mvz-fıkra no="1">
        <template>Ecnebi memleketlerinden gelecek maden suları için evvelemirde Sıhhat ve İçtimai Muavenet Vekaletinden memlekete ithal için müsaade alınır. Vekaletçe ithaline müsaade edilmeyen maden sularının gümrüklerce geçirilmesine müsaade edilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="207" başlık="">
      <mvz-fıkra no="1">
        <template>Gerek dahilde imal ve gerekse hariçten ithal olunan bütün suni maden suları ile gazlı sular üzerinde, suni olduğuna dair alıcının görebileceği tarzda yazılmış bir etiketin bulunması mecburidir. Bu nevi suni maden sularına malik olmadıkları şifalı hassalar atıf ve isnat edilmek suretiyle her çeşit reklam icrası memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="208" başlık="">
      <mvz-fıkra no="1">
        <template>Hududu dahilinde veya yakınında havassı şifaiyesi ve umumun istifadesine yaradığı ait olduğu dairelerce kabul ve tasdik edilen bir veya mütaaddit madeni menbalar veya kaplıcalar bulunan şehir ve kasabalar belediyelerinin talebi üzerine Sıhhat ve İçtimai Muavenet ve Dahiliye ve İktisat Vekaletlerince yapılacak tetkikat neticesinde o şehir ve kasaba içme veya kaplıca mahalli olarak ilan olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="209" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="210" başlık="">
      <mvz-fıkra no="1">
        <template>209 uncu maddedeki resim, içme veya kaplıca mahalli olarak ilan edilen şehir ve kasabada mütemekkin olmayıp mevsiminde buralarda gelenlerden cibayet edilir. Harb malülleri ve mecruhları ve hükümetçe meccanen tedavisine lüzum görülen hastalar ve fakirliği musaddak olanlar bu resimden muaftırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="10-ONUNCU" başlık="Mezarlıklar, ölülerin defni, mezardan çıkarılması ve nakli">
    <mvz-fasıl no="1-BİRİNCİ" başlık="Mezarlıklar ve ölülerin defni">
      <mvz-madde no="211" başlık="">
        <mvz-fıkra no="1">
          <template>Mezarlık ittihaz olunan yerlerden başka yerlere ölü defni memnudur. Fevkalade hallerde ve sıhhi mahzur mevcut olmadığı takdirde Cumhurbaşkanı karariyle muayyen ve malüm mezarlıklar haricinde ölü defnine müsaade edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="212" başlık="">
        <mvz-fıkra no="1">
          <template>Her şehir ve kasaba belediyesi şehir ve kasabanın haricinde ve meskenlerden kafi miktar uzakta olmak üzere şehir ve kasabanın nüfusuna ve senelik vefiyatı umumiyesine nisbetle lazım gelen bir veya müteaddit mezarlık mahalli tesisine mecburdur. Mezarlık olmak üzere intihap edilecek mahallerin toprağı, vasıfları ve civarındaki meskenler veya su menbaları için sıhhi bir mahzur bulunup bulunmadığı ve mesahai sathiyesinin kifayeti sıhhiye memurlarınca tayin olunur. Bu mezarlıkların tanzim ve iyi bir halde muhafazası mahalli belediyelerine aittir. Mezarlıkların etrafı behemehal duvarlarla tahdit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="213" başlık="">
        <mvz-fıkra no="1">
          <template>Köyler için tesis edilecek mezarlık mahalleri bu köylerin merbut olduğu kaza kaymakamlarınca Hükümet tabiplerinin mutalaası alınarak tayin olunur. Mütaaddit ve yekdiğerine mücavir köyler için bir mezarlık mahalli tesis olunabilir. Köy mezarlıklarının iyi halde muhafazaları ihtiyar heyetlerine aittir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="214" başlık="">
        <mvz-fıkra no="1">
          <template>Fenni şartları ve vasıfları haiz olmayan ve sıhhi mahzurları görülen mevcut mezarlıklar hali üzerine terk olunarak yeni mezarlıklar ihdas ve tesis edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="215" başlık="">
        <mvz-fıkra no="1">
          <template>Bu kanunun tarifi dahilinde defin ruhsatiyesi alınmadıkça ve ibraz olunmadıkça hiç bir cenazenin defni caiz değildir. Ruhsatnameler mevtanın hüviyetini, adresini, bilindiği halde vefatın sebebini muhtevi olacak ve defnine ruhsat verildiği sarahatla kaydedilecektir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="216" başlık="">
        <mvz-fıkra no="1">
          <template>Defin ruhsatiyeleri belediye tabipleri, toplum sağlığı merkezi tabipleri ile aile hekimleri tarafından mevtanın muayenesinden sonra verilir ve bu ruhsatiyelerin yerleşim yeri bazında hangi tabipler tarafından verileceği Türkiye Halk Sağlığı Kurumu tarafından belirlenir. Ölümüne sebep olan hastalık esnasında tedavi eden tabibin verdiği ruhsatname resmi tabipler tarafından tasdik edilmek şartiyle muteberdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="217" başlık="">
        <mvz-fıkra no="1">
          <template>Hükümet veya belediye tabipleri icabı halinde esbabı vefatı tayine medar olmak üzere tabibi müdavinin raporunu talep edebilirler. Tabibi müdaviler talep vukuunda bu raporu vermeğe mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="218" başlık="">
        <mvz-fıkra no="1">
          <template>Bütün hastane ve sair sıhhi müesseselerde ölenlere ait defin ruhsatiyeleri o müessesenin müdür ve baştabibi tarafından verilir ve usulü dairesinde resmi tabipler tarafından tasdik edilir. Kendine ait hususi mezarlığı olan müesseselerdeki ölülerin ismi ve hüviyeti sebebi vefatiyle birlikte yirmidört saat zarfında belediye dairesine bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="219" başlık="">
        <mvz-fıkra no="1">
          <template>Tabip bulunmayan yerlerde ölülerin muayeneleri küçük sıhhat memurları veya bu iş için yetiştirilmiş veya tavzif edilmiş memurin tarafından icra ve ruhsatnameleri verilir. Bunların bulunmadığı yerlerde defin ruhsatiyesi ya jandarma karakol kumandanları veya köy muhtarları tarafından ita olunur. Her şehir, kasaba veya köyde ölü muayenesi yapacak ve defin ruhsatını verecek olanlar en büyük mülkiye memuru tarafından tayin ve ilan olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="220" başlık="">
        <mvz-fıkra no="1">
          <template>Her belediye ve belediye olmayan yerlerde defin ruhsatiyesi verenler nezdinde vefiyatın kayıt ve zaptına mahsus bir defter bulundurulacak ve bu deftere meyitin ismi, adresi, tarihi vefatı, malüm ise mevti intaç eden hastalık ve defin ruhsatiyesi verenin ismi kaydedilecektir. Bu malümat her ay nihayetinde toplanarak öbür ayın on beşine kadar en yakın Hükümet tabibi ve sıhhiye müdiriyetine bildirilir ve sıhhat daireleri tarafından da mahalli nüfus idarelerine ihbar olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="221" başlık="">
        <mvz-fıkra no="1">
          <template>Ölü muayene edenler veya defin ruhsatnamesi verenler vefat sebebinin kazaen veya bir sari hastalık neticesi olduğuna dair şüphe veya kanaat hasıl ettikleri takdirde ait olduğu makamı haberdar etmeden defin ruhsatiyesi veremezler. Tabip olmayan yerlerde sari hastalık şüphesiyle vefat edenler içindefin ruhsatiyesi verilip hadiseden akabinde makamı aidesine malümat verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="222" başlık="">
        <mvz-fıkra no="1">
          <template>Her şehir ve kasabada cenazelerin bulunduğu mahalden mezarlığa kadar ne suretle nakledilecekleri hakkında mahalli sıhhiye memurlarının mutalaası alınmak şartiyle belediyelerce bir talimatname çıkarılır. Cenazelerin kolayca ve usulü dairesinde nakline nezaret ve bu bapta lazım gelen vasıtaların ihzarına belediyeler mecburdurlar. Umumi nakil vesaitinin cenaze nakline veya cenaze nakline mahsus vasıtaların sair hususlara tahsisi memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="223" başlık="">
        <mvz-fıkra no="1">
          <template>Mezarlıklarda her mezara bir ölü defnolunur ve mezarlıkların mebni olduğu arazinin tabiatına nazaran tayin olunacak zaman mürur etmeden aynı mahalde ikinci bir ölünün defnine ruhsat verilmez. Bu müddet beş seneden aşağı olmaz. Mezarlıkların vüs'ati müsait olan mahallerde münasip bir mahal ayrılarak isteyenlere aile mezarlığı olarak satılması caizdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="224" başlık="">
        <mvz-fıkra no="1">
          <template>Ölülerin yakılması için fenni usulü dairesinde fırınlar yaptırmak istiyen belediyeler evvel emirde bu hususta Sıhhat ve İçtimai Muavenet Vekaletine müracaat ederek hazırlattıkları projeleri tasdik ettirip müsaade aldıktan sonra tesisata başlıyabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="225" başlık="">
        <mvz-fıkra no="1">
          <template>Bir cesedi ihrak fırınlarında yaktırmak için aşağıda yazılı vesikaların vücudu lazımdır:</template>
          <mvz-bent no="1">
            <template>Ölünün hastalığı esnasında tedavisiyle meşgul olmadığı malüm ve sabit olan resmi bir tabip tarafından verilmiş olup vefatın her hangi gayritabii bir sebepten mütevellit olmadığını bildiren bir rapor ve defin ruhsatiyesi.</template>
          </mvz-bent>
          <mvz-bent no="2">
            <template>Cesedinin yakılmasını arzu ettiğini mübeyyin olup mevtanın hayatta ikenyazdığı vesika veya bu hususta şifahen arzu izhar ettiğini işitenlerden laakal üç zatın tahriri şehadet ve tasdikleri.</template>
          </mvz-bent>
          <mvz-bent no="3">
            <template>Müteveffanın ölümünü mucip olan sebebin herhangi cinai bir fiilden münbais olduğuna dair hiç bir şüphe mevcut olmadığını bildiren ve mahalli polis idaresi tarafından verilen vesika.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İşbu vesikalar ihraktan laakal yirmi dört saat evvel mahalli belediyesine ibraz olunarak alelüsul vefat defteri mahsusuna işaret edildikten sonra ihrak müsaadesi verilir. Defnedilen ölülerin defninden sonra ihrak için kabirden çıkarılmalarına müsaade edilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="226" başlık="">
        <mvz-fıkra no="1">
          <template>İhrak neticesi cesetten hasıl olan bakaya hususi kablar derununda mezarlık dahilinde bir dairei mahsusada hıfzedilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="2-İKİNCİ" başlık="Ölülerin çıkarılması ve nakli">
      <mvz-madde no="227" başlık="">
        <mvz-fıkra no="1">
          <template>Cesetlerin tamamiyle tahallül ve tefessühünden evvel mezarlar açılarak ölülerin çıkarılması için behemehal mahalli belediyesinin müsaadesi alınmak lazımdır. Bu hususta sıhhat memurlarının mutalaası alınmalıdır. Adli otopsiler bu hükümden müstesnadır. Yalnız mahalli belediyesine keyfiyet bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="228" başlık="">
        <mvz-fıkra no="1">
          <template>Bir ölünün gerek defninden evvel ve gerek defninden sonra bir kasabadan diğerine nakli için vefat veya defin mahalli olan şehir veya kasaba belediyesinin vesikası istihsal olunur. Bu vesikanın alınması için ölü henüz defnedilmemiş ise defnine ruhsat verildiğini mübeyyin vesikanın ibrazı lazım gelir. Defnedilmiş ölüler için evvelce vefiyat hakkındaki defteri mahsusuna işaret edilmiş olan kayıtların bir sureti çıkarılır ve bundan başka da her iki halde vefatın sebebi nakli halinde sıhhi bir mahzur tevellüt etmiyeceğine dair tabibin tasdiki iktıza eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="229" başlık="">
        <mvz-fıkra no="1">
          <template>Kolera, veba, çiçek, şarbon, cüzam ve ruam hastalıklarından vefat edenlerin nakli memnu olduğu gibi kolera, veba, çiçek veya lekeli humma hastalıklarından vefat etmiş olanların bir sene geçmedikçe mezardan çıkarılarak başka bir mahalle nakilleri de memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="230" başlık="">
        <mvz-fıkra no="1">
          <template>Bir şehir ve kasabadan diğerine nakledilecek ölülerin Sıhhat ve İçtimai Muavenet Vekaletince tertip edilerek belediyelere tebliğ olunacak talimatnamede mündemiç fenni usuller dahilinde tabutlanması lazımdır. Bu tarzda tabutlanmayan ölülerin nakline mümanaat edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="231" başlık="">
        <mvz-fıkra no="1">
          <template>Şimendiferlerle nakledilecek ölüler 228 inci maddede gösterildiği surette müsaade alındıktan ve ölünün tabutlanmasının usulü fenniyesi veçhile yapıldığı tevsik olunduktan sonra şimendifer idaresine teslim ve ancak seyri seri ile naklolunur. Hava tarikiyle sevkedilecek ölüler için aynı surette muamele olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="232" başlık="">
        <mvz-fıkra no="1">
          <template>Uzun müddet devam edecek nakiller için veya sıcak mevsimlerde, sıhhat memurlar tarafından talep edildiği takdirde, ölülerin tahnit edilmesi mecburidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="233" başlık="">
        <mvz-fıkra no="1">
          <template>Deniz tarikiyle yapılacak ölü nakliyatı için evvelce ait olduğu makamdan istihsal edilen vesikalar ölünün gemiye tahmilinden evvel bulunduğu limandaki Hudutlar ve Sahiller Sıhhat Umum Müdürlüğünün memuruna veyahut hudutlar ve sahiller sıhhat işlerine nezaret edenlere tasdik ettirilmelidir. Başka suretle ölülerin gemilere yükletilmesi memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="234" başlık="">
        <mvz-fıkra no="1">
          <template>Ecnebi memleketlerden getirilen ölülerin nakline müsaade edildiğini ve naklinde sıhhi mahzur bulunmadığını tevsik için mahalli idareden verilmiş ölü nakil vesikası ibraz edilmesi mecburidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
  </mvz-bap>
  <mvz-bap no="11-ONBİRİNCİ" başlık="Şehir ve kasabalar hıfzıssıhhası">
    <mvz-fasıl no="1-BİRİNCİ" başlık="İçilecek ve kullanılacak sular">
      <mvz-madde no="235" başlık="">
        <mvz-fıkra no="1">
          <template>Hususi kanuna tevfikan belediyelerce idare edilen sularla işletilmesi şirketlere bırakılan suların sıhhi hususları Sıhhat ve İçtimai Muavenet Vekaletinin murakabesine tabidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="236" başlık="">
        <mvz-fıkra no="1">
          <template>İçilmek ve kullanılmak için getirilecek suların fennen içilmesine müsaada edilecek evsafta olması şarttır. Olmadığı takdirde bunların fennen icap ettiği surette temizlenmesine ve evsafının ıslahına belediyeler mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="237" başlık="">
        <mvz-fıkra no="1">
          <template>Şehir ve kasabalarda tevzi edilmek üzere celbedilen su menbalarının etrafında behemehal bir himaye mıntakası tesis edilmelidir. Bu mıntakaların hudutları sıhhat memurları huzuriyle ihtisas erbabı tarafından menbaın gıda havzası üzerinde tayin edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="238" başlık="">
        <mvz-fıkra no="1">
          <template>Himaye mıntakası olmak üzere menbalar etrafında tayin ve tahdit edilen arazi belediye mıntakası haricinde de olsa belediye tarafından Belediye İstimlak Kanununa tevfikan istimlaki mecburi olup bu arazinin mesken yapılmak, ekilmek ve sair her hangi hususlar için istimali memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="239" başlık="">
        <mvz-fıkra no="1">
          <template>Suları içilmeğe ve ev işlerinde kullanılmağa mahsus hususi ve umumi kuyuların ve sarnıçların televvüs eyledikleri veya televvüse maruz bulundukları takdirde bunların ıslahını takibe belediyeler mecburdurlar. Sahipleri tarafından ıslah ve televvüs tehlikesi bertaraf edilmiyen kuyular masarifi sahibinden Devlet emvali gibi tahsil edilmek üzere belediye tarafından ıslah edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="240" başlık="">
        <mvz-fıkra no="1">
          <template>Umuma satılan menba suları mahalli belediyesinin sıhhi murakebesi altında bulunur. Bunlara ve bütün içme suları nakliyatına ait kapların vasıfları ve bu kablara doldurma ve sevkleri tarzı belediyelerce tayin olunur. Menbaların sahipleri veya müstecirleri menbaların ve su nakledenler suların televvüsten vikayesi için gösterilecek tedbirleri tatbika mecburdur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="241" başlık="">
        <mvz-fıkra no="1">
          <template>Sularının içilmesi fennen ve sıhhat için tehlikeli olan menba, kuyu, çeşme ve saire gibi mahallere belediyece o suyun mazarratlı olduğunu gösteren ve harici tesirler ile yazıları bozulmayan levhalar asılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="242" başlık="">
        <mvz-fıkra no="1">
          <template>Dere, nehir ve çayların ve çeşmelerin televvüsünü mucip tesisat yapılmasına veya eşhas tarafından bu tarzda telvisat ikaına mümanaat olunur. Fabrika sularının fenni mahzurları tahakkuk eden yerlerde mazarratı izale edilmeden nehir ve derelere dökülmesi memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="243" başlık="">
        <mvz-fıkra no="1">
          <template>Buz fabrikaları ve imalathaneleri sıhhi murakabe altında bulunur. Buz imal edilecek sular behemehal 236 ncı maddede zikredilen içme suları evsafını haiz olmalıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="2-İKİNCİ" başlık="Mecralar ve müzahrefat imhası">
      <mvz-madde no="244" başlık="">
        <mvz-fıkra no="1">
          <template>Mahsus kanununa tevfikan belediyelerce inşa ettirilmiş ve ettirilecek lağım ve çirkef mecralarının fenni mahzuru olmadığı kabul ve tasdik edilmedikçe dere, çay, nehirlere akıtılması memnudur. Fenni usul dairesinde mecralar muhteviyatının imhası için kullanılacak sahaların meskenlerden uzak olması ve bunların istimlak edilerek başka suretle istimal edilmemesi lazımdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="245" başlık="">
        <mvz-fıkra no="1">
          <template>Mecra inşası mümkün olmayan yerlerde yapılacak çukurların fenni vasıf ve şartları Sıhhat ve İçtimai Muavenet vekaletince tayin olunur. Bu çukurların muayyen fasılalarla temizlenmesi için belediyelerce münasip ve sıhhi mahzurlardan salim tahliye ve nakil vasıtaları tedarik olunup ücret mukabilinde halka tahsis edilir. Çukurlar muhteviyatının dökülmesi için madde 244 de yazılı olduğu tarzda bir saha tahsis edilmelidir. Beşeri mevaddı gaitanın her nevi sebze ve saire zeriyatında gübre olarak istimali memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="246" başlık="">
        <mvz-fıkra no="1">
          <template>Yirmi binden fazla nüfusu olan şehirlerde umumi caddelerde veya belediyelerce tayin edilecek mıntakalar içinde hayvan ahırı bulundurulması memnudur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="247" başlık="">
        <mvz-fıkra no="1">
          <template>Şehirler ve kasabalar belediye hudutları dahilinde görülen hayvan leşlerinin ortadan kaldırılması ve mazarratlarının izalesi belediyeye aittir. Köyler ve köyler civarındakiler köy ihtiyar heyetlerince gömülürler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="248" başlık="">
        <mvz-fıkra no="1">
          <template>Belediyesi olan her şehir ve kasabada sokakların yıkanmak ve süpürülmek suretiyle temiz tutulması mecburidir. Toplanan süprüntüler bunların etrafa yayılmasına ve dökülmesine mani olacak vasıtalarla nakledilerek şehir ve kasabanın vaziyetine göre en münasip olarak kabul edilen şekilde imha veya ihrak edilir. Nüfusu elli binden fazla olan şehirlerde bu süprüntüden istifade edilmek üzere lazımgelen tesisat yapılır. Sokaklarda veya evler içinde süprüntü birikip kalmaması için belediyelerce tedabir ittihaz olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="249" başlık="">
        <mvz-fıkra no="1">
          <template>Belediyelerce şehir ve kasaba dahilinde telvisata meydan vermemek üzere münasip mahallerde fenne muvafık şekilde aptes yerleri tesis ve mevcutları ıslah olunur. Belediye teşkilatı olmayan yerlerde bu mecburiyet köy ihtiyar heyetlerine aittir. Cadde ve sokaklarda ve meskenler kurbünde ve belediyelerce tayin edilecek hudutlar dahilinde açıktan defihacet etmek kati surette menedilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="3-ÜÇÜNCÜ" başlık="Meskenler">
      <mvz-madde no="250" başlık="">
        <mvz-fıkra no="1">
          <template>Mahalli belediyelerin ruhsatı olmaksızın her nevi mesken ve umuma mahsus binalar inşası memnudur. Müsaadenin istihsali için binanın projesi belediyeye tevdi edilir. Bunlardan umuma mahsus binalara ait bulunanlar hakkında sıhhiye heyetinin mutalaası alındıktan ve meskenlere ait olanların Sıhhat Vekaleti tarafından tesbit edilecek, sıhhi şartlara muvafık bulunduğu ve her nevi binanınki mevzu nizamlara da uygun olduğu anlaşıldıktan sonra proje sahibine iade ve inşaata müsaade olunur. Bina sahipleri projelerin tevdiinden itibaren nihayet yirmi gün zarfında bir cevap almadıkları takdirde inşaata başlamakta muhtardırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="251" başlık="">
        <mvz-fıkra no="1">
          <template>Müsaade talep edilmeden veya teklif olunan sıhhi şartlar nazarı dikkate alınmadan inşaat yapıldığı takdirde bu inşaatın itmamına ve itmam edilmiş ise sıhhi şartları veya müsaade muamelesini ikmal etmedikçe iskanına ve istimaline mümanaat olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="252" başlık="">
        <mvz-fıkra no="1">
          <template>Yeni inşa edilerek sahibi oturacak veya kiraya verilecek binaların ilk defa iskanından evvel içinde oturacaklar için sıhhi ve fenni mahzurları olmadığı belediyelerce tasdik edilmeden iskan ve icari memnudur. Bu tasdik için binanın, aralarında bir sıhhat memuru da bulunduğu bir heyet tarafından tetkiki ve rapor verilmesi lazımdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="253" başlık="">
        <mvz-fıkra no="1">
          <template>Nüfusu elli binden fazla olan şehirlerde belediyeler ikametgahların sıhhi şartlarını daima nazarı teftişte bulundurmak üzere bir meskenler idaresi tesisine mecburdurlar. Bu idareler azami iki odayı havi evlerle daha büyük olmakla beraber kiraya verilen evleri, bekar ikametgahlarını ve pansiyonları ve ameleye tahsis edilen veya odaları, bodrum ve tavan aralarında bulunan ve icara verilen ikametgahları teftiş ve murakabe ederler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="254" başlık="">
        <mvz-fıkra no="1">
          <template>İnşaatı itmam edilmiş olsun veya olmasın içinde oturanların veya komşularının sıhhatine veya hayatına ehemmiyetli zarar vereceği anlaşılan meskenlerin ıslahına sahipleri mecburdurlar. Bunun için meskenler idaresi olan yerlerde bu idarelerin mevcut bulunmayan mahallerde belediyenin sıhhat ve fen memurlarının verecekleri esbabı mucibeli raporlar belediye reislerince vilayetlerde valiye ve kazalarda kaymakamlara tevdi edilir. Vali ve kaymakamlar esbabı mucibeli raporları mahalli hıfzıssıhha meclislerine tevdi ile karar talep eyler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="255" başlık="">
        <mvz-fıkra no="1">
          <template>Hıfzıssıhha meclislerince verilen karar belediyelerce zikredilen esbabı mucibeyi kabul ve tasvip eder veya ret eyler mahiyette olsa da her iki halde bu kararlar Vilayet İdare Heyetlerinin temyizen tasdikiyle muteber olur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="256" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhi mahzurları görülen binaların sahipleri belediyelerin esbabı mucibeli raporlarını görmeğe salahiyettar oldukları gibi hıfzıssıhha meclisleri huzurunda beyanı mutalaa etmeğe veya vekilleri vasıtasiyle fikirlerini söyletmeğe mezundurlar. Bu husustaki müzakerattan, laakal 15 gün evvel binaların sahipleri keyfiyetten tahriren haberdar edilmelidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="257" başlık="">
        <mvz-fıkra no="1">
          <template>Mahzurları görülen binaların hıfzıssıhha meclisleri kararı ve Vilayet İdare Heyetlerinin tasvibiyle takarrür eden tadilat, ıslahat veya tamirat icra edilmeden tamamen veya kısmen mesken olarak istimali memnudur. Etrafında bulunanların hayat ve sıhhati için tehlike iras eden binalar hakkında da aynı suretle muamele icra edilir ve bu tehlikenin vukuu yakın olduğu takdirde belediyelerce tehlikenin süratle izalesi temin ve masarifi Devlet emvali gibi sahibinden tahsil olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="4-DÖRDÜNCÜ" başlık="Hanlar, oteller ve umumi mahaller">
      <mvz-madde no="258" başlık="">
        <mvz-fıkra no="1">
          <template>Bütün oteller, hanlar ve misafirhanelerin sıhhi şartları mecburi ve asgari olarak ihtiva etmeleri lazım gelen müştemilatı belediyelerce, belediye hudutları haricindeki yerlerde vilayet veya kaza sıhhat memurlarınca tayin ve murakabe edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="259" başlık="">
        <mvz-fıkra no="1">
          <template>Sıhhi şartları haiz olmayan ve hastalıkların intikaline vasıta olduğu görülen, otel, han ve sair misafirhaneler her türlü mahzurdan salim bir surette ıslahı sabit oluncaya kadar kapatılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="260" başlık="">
        <mvz-fıkra no="1">
          <template>Otelcilik, hancılık edecek veya her hangi suretle olursa olsun ücretle misafir kabul edecek olanlar hususi müsaadeyi haiz olmalıdır. Bu müsaadeler belediye hudutları dahilinde belediyelerce, bu hudutlar haricinde valiler veya kaymakamlarca ita edilir. Müsaade verilmeden evvel bu mahallerin sıhhi mahzurlardan ari ve lazım gelen şartları haiz olduğu sıhhat memurlarınca da tesbit olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="261" başlık="">
        <mvz-fıkra no="1">
          <template>Bütün eğlence mahalleri, tiyatro, sinema, bar ve gazino ve kahve ve emsali yerler ve halkın bir arada toplanmasına mahsus sair umumi mahaller ve hamamlarda halkın sıhhatini vikaye ve selametini temin için riayeti lazım gelen tedbirler mahalli belediyelerce neşrü ilan olunur. Bu tedbirlere kısmen veya tamamen riayet edilmiyen mahallerde her türlü içtimalar menedilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="5-BEŞİNCİ" başlık="Yeni tesis olunacak veya tevsi edilecek şehir ve kasabalar">
      <mvz-madde no="262" başlık="">
        <mvz-fıkra no="1">
          <template>Nüfusu yirmi bin veya daha ziyade olan şehir ve kasabalar belediyeleri bu kanunun mer'iyeti tarihindan itibaren üç sene zarfında şehir veya kasabanın tevsi ve ıslahı için bir müstakbel şekil projesi tanzim etmeğe mecburdur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu proje yeniden yapılacak veya ıslah edilecek sokakların istikamet ve genişliğini, meydanların, umumi mahallerin, bahçelerin ve abidelerin yerlerini ve vaziyetlerini gösteren bir haritayı ve yapılacak tesisatın senelere taksim edilmiş olmak üzere belediye meclisinde tasdik edilmiş bir programı ihtiva etmelidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="263" başlık="">
        <mvz-fıkra no="1">
          <template>Nüfusu yirmi binden az ve beş binden fazla olan şehir ve kasabalar belediyeleri de nüfusları her iki nüfus tahriri devresi arasında % 15 miktarında bir çoğalma gösterdikleri takdirde bu tarzda bir proje ihzarına mecbur oldukları gibi nüfusu her neye baliğ olursa olsun 228 inci maddede yazılı olduğu veçhile içme veya kaplıca mahalli olarak kabul edilen şehir ve kasabalarda bu projeyi tanzim ettirirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="264" başlık="" durum="mülga">
      </mvz-madde>
      <mvz-madde no="265" başlık="">
        <mvz-fıkra no="1">
          <template>Belediyelerce tanzim ettirilecek olan bu plan ve projeler icabında tetkik edilmek üzere Dahiliye ve Sıhhat ve İçtimai Muavenet Vekaletlerince talep edilebilir. Bu takdirde bu vekaletlerce teklif edilecek tadilatın kabulü mecburidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="266" başlık="">
        <mvz-fıkra no="1">
          <template>Her şehir ve kasaba belediyesi bu kanunun mer'iyeti tarihinden itibaren bir sene zarfında o şehir veya kasabanın ihtiyaçlarına göre bu kanunun gösterdiği sıhhi hususlara ait bir zabıta talimatnamesi tertip eder. Bu nizamname, meskenlerin ihtiva etmeleri lazım gelen asgari müştemilatı, umumi ve müşterek ikametgahlardaki ikamet şeraitini, gıda maddeleri satılan veya sair temizliğe mütaallik işlerle iştigal edilen mahallerin, han, otel, misafirhane, eğlence mahalleriyle bütün umumi yerlerin sıhhi şartlarını ve umumiyetle şehrin sıhhat ve temizliğine taallük eden hususlara ait riayetleri lazımgelen kaideleri ihtiva eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="267" başlık="">
        <mvz-fıkra no="1">
          <template>Belediyelerin mensup oldukları vilayetler vasıtasiyle gönderecekleri sıhhi zabıta talimatnameleri Dahiliye ve Sıhhat ve İçtimai Muavenet Vekaletince tetkik ve tasvip edilmeden mer'iyete konulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu talimatnamede yapılacak esasa mütaallik tadiller aynı şartlara tabidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
  </mvz-bap>
  <mvz-bap no="12-ONİKİNCİ" başlık="Gayrisıhhi müesseseler">
    <mvz-madde no="268" başlık="">
      <mvz-fıkra no="1">
        <template>Civarında ikamet eden halkın sıhhat ve istirahatini ihlal eden müesseseler ve atelyeler bu kanunun neşrinden itibaren, resmi müsaade istihsal edilmeksizin açılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="269" başlık="">
      <mvz-fıkra no="1">
        <template>268 inci maddede zikredilen müesseseler ve atelyeler üç sınıfa tefrik olunur:</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Birinci sınıf - Hususi meskenlerden behemehal uzak bulundurulmaları icap edenler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İkinci sınıf - Hususi meskenlerden behemehal uzaklaştırılması icap etmemekle beraber müsaade verilmezden evvel civarında ikamet edenlerin sıhhat ve istirahatleri üzerine gerek tesisatları ve gerekse vaziyetleri itibariyle bir mazarrat yapmayacağına kanaat husulü için tetkikat yapılması iktiza eden müesseseler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Üçüncü sınıf - Meskenlerin yanında kalabilmekle beraber yalnız sıhhi nezarete tabi tutulması icap eden müesseselerdir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="270" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanuna müteferri olmak üzere bu üç sınıf müessese ve atelyelerin bir listesi Sıhhat ve İçtimai Muavenet Vekaletince İktisat Vekaletinin de mutalaası alınmak şartiyle tanzim olunur. Bu listede münderiç olmayan müessese ve atelyelerin hangi sınıftan addedileceği badehu yine aynı suretle tayin edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="271" başlık="">
      <mvz-fıkra no="1">
        <template>Birinci sınıf müesseselerin tesisi için ancak Sıhhat ve İçtimai Muavenet Vekaletince müsaade olunur ve İktisat Vekaletine malümat verilir. Bu hususta müsaade almak üzere müessesenin bulunduğu mahalde en büyük mülkiye memuruna bir istida ile müracaat edilir. Bu istida müessesenin nevi ne ile iştigal edeceği ve sair tafsilat kaydedilmelidir. Bu müracaat evrakı mahalli sıhhatmemurlarının raporiyle Sıhhat ve İçtimai Muavenet Vekaletine gönderilir. Vekaletçe icabında yaptırılacak tetkikat ve tahkikattan sonra resmi müsaade verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="272" başlık="">
      <mvz-fıkra no="1">
        <template>İkinci ve üçüncü sınıf müesseselerin tesisi için mahalli sıhhat memurlarının muvafık raporları üzerine mahalli en büyük mülkiye memurunca resmi müsaade verilir ve Sıhhat ve İktisat Vekaletlerine bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="273" başlık="">
      <mvz-fıkra no="1">
        <template>Birinci sınıf müesseseler ve atelyeler civarında ve Sıhhat ve İçtimai Muavenet Vekaletince tasdik edilecek mesafe dahilinde meskenler veya insanların ikametine mahsus sair mahallerin bulunması memnudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="274" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanunun neşri tarihinde mevcut olup civarında mukim halkın sıhhat ve istirahatlerini ihlal eylediği mahalli sıhhat memurlarının raporu ve Vilayet İdare Heyetine tasvibi ile tebeyyün eden birinci sınıfa dahil müesseselerin İktisat ve Sıhhat ve İçtimai Muavenet Vekaletleri karariyle nakli ve sahibinin mümanaatı halinde seddi caizdir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="275" başlık="">
      <mvz-fıkra no="1">
        <template>Birinci sınıfa dahil bulunan müessese ve atelyelerden işbu kanundan evvel tesis edilmiş olanlar başka bir mahalle naklettikleri veya faaliyetlerini altı ay müddetle tatil eyledikleri takdirde yeniden tesis edilecek müessese mahiyetinde telakki edilerek müsaade istihsali lazım gelir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="13-ONÜÇÜNCÜ" başlık="Sıhhi istatistik ve coğrafya ve propaganda">    
    <mvz-madde no="276" başlık="">
      <mvz-fıkra no="1">
        <template>Sıhhat ve İçtimai Muavenet Vekaletine ait istatistik hizmetleri aşağıda gösterilmiştir:</template>
        <mvz-bent no="1">
          <template>Doğum, evlenme, ölüm ve ölüm sebepleri.</template>
        </mvz-bent>
        <mvz-bent no="2">
          <template>Kara, deniz, hava tarikleri üzerinde yapılan sıhhi tedbirler.</template>
        </mvz-bent>
        <mvz-bent no="3">
          <template>Hastane, dispanser, sanatoryumlardaki ve sair tedavi müesseselerindeki hastalar ve zaifler halinekahette bulunanlar.</template>
        </mvz-bent>
        <mvz-bent no="4">
          <template>Sari ve istilai hastalıklar.</template>
        </mvz-bent>
        <mvz-bent no="5">
          <template>Meslek hastaları.</template>
        </mvz-bent>
        <mvz-bent no="6">
          <template>Memleketin sıhhi coğrafyasına ait malümat.</template>
        </mvz-bent>
        <mvz-bent no="7">
          <template>Sıhhi ve içtimai hizmetlere taallük edip Yüksek Sıhhat Şürası tarafından tayin edilecek sair mesail.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="277" başlık="">
      <mvz-fıkra no="1">
        <template>Devlete ait hava rasat müesseseleri Sıhhat Vekaletinin tıbbi ve sıhhi istatistik ve coğrafya tanzimi için icap eden her nevi malümatı itaya mecburdurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="278" başlık="">
      <mvz-fıkra no="1">
        <template>Devlet umumi istatistik dairesi her ay nihayetinde 276 ncı maddede zikredilen hususlara mütaallik olup ittıla hasıl eylediği ihsai malümatı Sıhhat ve İçtimai Muavenet Vekaletine verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="279" başlık="">
      <mvz-fıkra no="1">
        <template>Bilümum hususi hastaneler, sanatoryumlar, dispanserler müdürleri Sıhhat ve İçtimai Muavenet Vekaletince talep edilecek istatistikleri muayyen mühletler dahilinde vermeğe mecburdurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="280" başlık="">
      <mvz-fıkra no="1">
        <template>Sıhhat ve İçtimai Muavenet Vekaleti sari ve salgın hastalıklardan korunma, çocuk büyütme ve sıhhi şartlar dairesinde yaşama gibi sıhhi meseleler hakkında halkı tenvir için kitap, levha, risale neşreder, sıhhi propaganda müessesatı yapar ve konferanslar verdirir ve her nevi sinema filimleri gösterir. Bu gibi hizmetler meccanidir.İcabı takdirinde lazım gelen vasıtaları haiz seyyar sıhhi propoganda kolları teşkil olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ana sütü ile beslenmenin önem ve üstünlüğünün öğretilmesi, yaygınlaştırılması,süt çocukları ve küçük çocukları besleme yönteminin öğretilmesi konularındaki eğitim ve öğretim; halk eğitimi ve beslenme konularında uygulamalı eğitim yapan gerçek ve tüzelkişilerle birlikte, Sağlık ve Sosyal Yardım Bakanlığı tarafından sağlanır. Bu eğitim, ana sütü ile beslenmenin yaygınlaştırılmasını önleyici veya çocuk besinlerini reklam edici nitelikte olamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="281" başlık="">
      <mvz-fıkra no="1">
        <template>Bütün mekteplerde en son ilmi müktesebata tevfikan hıfzıssıhha dersi tedrisatı mecburidir. Bu dersler mütehassıs zat tarafından tedris ve programları Maarif Vekaletiyle Sıhhat ve İçtimai Muavenet Vekaleti tarafından müştereken tesbit olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="14-ONDÖRDÜNCÜ" başlık="Ceza hükümleri">       
    <mvz-madde no="282" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yazılı olan yasaklara aykırı hareket edenler veya zorunluluklara uymayanlara, fiilleri ayrıca suç oluşturmadığı takdirde, ikiyüzelli Türk Lirasından bin Türk Lirasına kadar idarî para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="283" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yazılı belediye vazifelerine taallûk edip 266 ncı maddede gösterilen sıhhi zabıta nizamnamesinde mezkur memnuiyetlere muhalif hareket edenlerle mecburiyetlere riayet etmeyenler, 15/5/1930 tarihli ve 1608 sayılı Kanunla değişik 16/4/1924 tarihli ve 486 sayılı Kanun mucibince cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="284" başlık="">
      <mvz-fıkra no="1">
        <template>66 ve 67 inci maddelerde zikredildiği üzere sari hastalıklar hakkında tetkikatta bulunmağa salahiyettar memurlara muhalefet eden kimseler Türk Ceza Kanununun 195 inci maddesi mucibince cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="285" başlık="">
      <mvz-fıkra no="1">
        <template>78 inci maddede yazılı memnuiyete rağmen laboratuvarlarında kolera ve veba ve ruam kültürleri bulunduranlar elli günden az olmamak üzere adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="286" başlık="">
      <mvz-fıkra no="1">
        <template>Tathir ve tephir edilmeden satılığa çıkarılan 85 inci maddede yazılı eşyaya vaziyed ve tathiratı icra ve bu hizmetten mütevellit bütün masarif sahibinden tahsil olunduktan sonra iade olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="287" başlık="">
      <mvz-fıkra no="1">
        <template>101 inci maddede zikredilen tedbirlere muhalefet edenler veya tedaviye icabet etmeyenler, Kabahatler Kanununun 32 nci maddesine göre cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="288" başlık="">
      <mvz-fıkra no="1">
        <template>103 üncü maddedeki mecburiyete riayet etmeyenlere, yüz Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="289" başlık="">
      <mvz-fıkra no="1">
        <template>109 uncu maddedeki mecburiyete riayet etmeyen tabiplere yüzelli Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="290" başlık="">
      <mvz-fıkra no="1">
        <template>110 uncu maddede yazılı yasaklara aykırı hareket edenler, Türk Ceza Kanunu hükümlerine göre cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="291" başlık="">
      <mvz-fıkra no="1">
        <template>112 nci maddede gösterilen tedbirlere riayet etmeyen ve tedaviye icabet eylemeyenler, Kabahatler Kanununun 32 nci maddesine göre cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="292" başlık="">
      <mvz-fıkra no="1">
        <template>137 nci maddede gösterilen mecburiyete riayet etmeyen gemi süvarilerine ikiyüzelli Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="293" başlık="">
      <mvz-fıkra no="1">
        <template>138 inci maddedeki şeraite muvafık olmayan gemilerin kaptanları, Gemi Sağlık Resmi Kanununda yer alan para cezalarının on katı idarî para cezasıyla cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="294" başlık="">
      <mvz-fıkra no="1">
        <template>Sıhhat ve İçtimai Muavenet Vekaletiyle İktisat Vekaleti tarafından 141 inci maddede gösterildiği veçhile müştereken tespit edilen yönetmelikte mündemiç levazım ve saireyi bulundurmayan ve yolcuların selamet ve emniyetini temin eyleyecek tedbirlere riayet etmeyen gemi sahip veya süvarilerine dörtyüz Türk Lirası idarî para cezası verilir ve bu levazım ikmal edilinceye kadar gemilerin seyrüseferlerine mümanaat olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunda yazılı olan idarî para cezaları mahallî mülkî amir tarafından verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="295" başlık="">
      <mvz-fıkra no="1">
        <template>179 uncu maddede zikredilen nizamname ile Sıhhat ve İçtimai Muavenet ve İktisat Vekaletlerince müştereken tespit edilen tedbirlere riayet etmeyen iş sahiplerine beşyüz Türk Lirası idarî para cezası verilir. Bu yüzden şahsî veya umumi zarar hasıl olduğu takdirde ahkamı umumiye mucibince takibatı kanuniye ifa edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="296" başlık="">
      <mvz-fıkra no="1">
        <template>185 inci maddedeki memnuiyet hilafına hareket edenler altı aya kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="297" başlık="">
      <mvz-fıkra no="1">
        <template>186 ve 187 nci maddelerdeki fiilleri işleyenler, üç aydan altı aya kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="298" başlık="">
      <mvz-fıkra no="1">
        <template>205 inci maddedeki mecburiyete riayet edilmeyen mahaller, gerekli yükümlülükler yerine getirilinceye kadar mahallî mülkî amir tarafından faaliyetten men edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="299" başlık="">
      <mvz-fıkra no="1">
        <template>215 inci maddede zikredilen defin ruhsatiyesi olmadan cenaze defneden mezar bekçileri veya ölü sahipleri Kabahatler Kanununun 32 nci maddesine göre cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="300" başlık="">
      <mvz-fıkra no="1">
        <template>227 inci maddede zikredilen istisna haricinde lazım gelen müsaadeyi almadan herhangi suretle olursa olsun mezarları açanlar altı aydan bir seneye kadar hapsedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="301" başlık="">
      <mvz-fıkra no="1">
        <template>Müsaadesiz olarak bir şehir ve kasabadan diğerine ölü nakledenler Kabahatler Kanununun 32 nci maddesine göre cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="302" başlık="">
      <mvz-fıkra no="1">
        <template>Belediyelerce 252 nci maddeye tevfikan sıhhi mahzuru olmadığı tasdik edilmeden sahip oldukları binaları iskan ettirenler veya icara verenlere yüz Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="15-ONBEŞİNCİ" başlık="Umumi hükümler">
    <mvz-madde no="303" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanunda zikredilen sıhhat memurları; Devlet, belediye ve idarei hususiye işlerinde kullanılan tabipler ve Sıhhat ve İçtimai Muavenet Vekaletinin lüzum göreceği ve mezuniyet vereceği hususlarda tabiplerin maiyetinde bulunan küçük sıhhat memurlarıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="304" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanunda zikredilen nizamname, talimatname ve saire kanunun mer'iyeti tarihinden itibaren bir sene zarfında tertip ve ikmal olunur. Elyevm mevcut ve aynı işlere müteallik nizamname ve talimatnamenin hükümleri bu kanun hükümlerine tearuz etmedikçe yenileri neşredilinceye kadar muteberdir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="305" başlık="">
      <mvz-fıkra no="1">
        <template>İşbu kanunda yazılı resmi vazifeleri ve muameleleri yapacak olan Hükümet ve belediye hekimleri ile küçük sıhhiye memurları veya bunların makamına kaim olacak sair memurlar bu muamelelerden dolayı hiç bir sebep ile alakadarlardan ücret alamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="306" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanunun mer'iyeti tarihinden itibaren 28 Haziran 1300 tarihli ceraimi sıhhiye kanunu ve 1316 tarihli mamulatı dahiliyeden olan sade yağlarının muhafazai safiyetine dair nizamname ve 1323 tarihli aşı nizamnamesi ve 31 Mart 1336 tarihli emrazı sariye ve istilaiye nizamnamesi ve 25 Ağustos 1330 tarihli tifo aşısının lüzum görülecek mahallerde tatbikının mecburi olduğuna dair kararname ve 1 Haziran 1331 tarihli Kastamonu vilayeti ve Bolu sancağı frengi mücadele teşkilatı sıhhiyesi hakkındaki nizamname ve 30 Eylül 1331 tarihli kolera aşısının lüzum görülecek mahallerde tatbikı mecburi olduğuna dair olan irade ve 4 Nisan 1333 tarihli sakarinin gümrüklerden imrarı hakkındaki kanun ve 5 Şubat 1337 tarihli ve 90 numaralı frenginin men ve tahdidi sirayeti hakkındaki kanun ve 26 Şubat 1927 tarihli emrazı sariye ve istilaiye nizamnamesine ilave edilen ahkam hakkındaki kanun hükümleri mülgadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="307" başlık="">
      <mvz-fıkra no="1">
        <template>Şubat 1331 tarihli Sıhhiye Nezareti teşkilatına ait kanunla teşkil edilmiş olan Meclisi Alii Sıhhi mülgadır.Muhtelif kanunlarla bu meclise verilmiş olan vazifeler Yüksek Sıhhat Şürası tarafından ifa kılınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu kanunda yazılı suçları işleyenler hakkında 303 üncü maddede yazılı kimseler tarafından düzenlenen tutanaklar aksi sabit oluncaya kadar muteberdir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 69 uncu maddesi gereğince alınmış olan tedbirlerden çevre sağlığı ile ilgili olanlara uyulmaması halinde 303 üncü maddede yazılı yetkililerce 10 liradan 30 liraya kadar para cezası alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu cezaya tebliğ tarihinden itibaren 15 gün içinde o yer sulh ceza hakimliğine itirazda bulunulabilir. Süresinde itiraz olunmaz veya itiraz reddedilirse bu para cezaları yetkili memurlarca derhal tahsil olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu tahsilat Muhasebei Umumiye Kanunu hükümlerine göre sağlık ocakları veya Hükümet tabipliklerinde görevlendirilecek muhasip mutemetleri vasıtasiyle ve mutemet makbuzları karşılığında yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tahsilat derhal yapılmadığı takdirde tebliğ tarihinden itibaren üç gün içinde ilgili yerlere ödeyenler hakkında ayrıca takibat yapılmaz. Bu süre içinde ödenmeyen cezalar iki kat olarak 15 gün içerisinde tahsil olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu süre içinde de ödenmeyen cezalar üç kat olarak Amme Alacaklarının Tahsil Usulü hakkındaki 6183 sayılı Kanun hükümlerine göre sağlık ocakları veya Hükümet tabipliklerince tahsil olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 185, 186, 187 inci maddelerinde sayılan yasaklara aykırı fiilleri sebebiyle mahküm edilenler hakkında da Türk Ceza Kanununun 402 nci maddesinin ikinci fıkrası hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamına giren ve umumun sıhhatine  ilişkin davalara, mahkemelerce, 3005 sayılı Meşhud Suçların Muhakeme Usulü Kanununun 1 inci maddesindeki yer ve 4 üncü maddesindeki zaman kaydına bakılmaksızın suçüstü hükümlerine göre bakılır ve hükümler kesinleştikten sonra bunların birer sureti Cumhuriyet savcılıklarınca doğrudan doğruya Sağlık ve Sosyal Yardım Bakanlığına gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>127 nci maddede belirtilen yönetmelik, bu maddenin yayımı tarihinden itibaren altı ay içinde yürürlüğe konulur ve anılan yönetmelik yürürlüğe girinceye kadar ilgili mevzuat hükümlerinin uygulanmasına devam edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="308" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanun neşri tarihinden itibaren altı ay sonra mer'idir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="309" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanun hükümlerinin icrasına İcra Vekilleri Heyeti memurdur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
