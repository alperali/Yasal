  <mvz-künye tür="kanun" no="6284" başlık="AİLENİN KORUNMASI VE KADINA KARŞI ŞİDDETİN ÖNLENMESİNE DAİR KANUN"
             tarih="8/3/2012" rgazete-tarih="20/3/2012" rgazete-sayı="28239"
             düstur-tertip="5" düstur-cilt="52" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam, Temel İlkeler ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç, kapsam ve temel ilkeler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; şiddete uğrayan veya şiddete uğrama tehlikesi bulunan kadınların, çocukların, aile bireylerinin ve tek taraflı ısrarlı takip mağduru olan kişilerin korunması ve bu kişilere yönelik şiddetin önlenmesi amacıyla alınacak tedbirlere ilişkin usul ve esasları düzenlemektir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun uygulanmasında ve gereken hizmetlerin sunulmasında aşağıdaki temel ilkelere uyulur:</template>
        <mvz-bent no="a">
          <template>Türkiye Cumhuriyeti Anayasası ile Türkiye’nin taraf olduğu uluslararası sözleşmeler, özellikle Kadınlara Yönelik Şiddet ve Aile İçi Şiddetin Önlenmesi ve Bunlarla Mücadeleye İlişkin Avrupa Konseyi Sözleşmesi ve yürürlükteki diğer kanuni düzenlemeler esas alınır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Şiddet mağdurlarına verilecek destek ve hizmetlerin sunulmasında temel insan haklarına dayalı, kadın erkek eşitliğine duyarlı, sosyal devlet ilkesine uygun, adil, etkili ve süratli bir usul izlenir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Şiddet mağduru ve şiddet uygulayan için alınan tedbir kararları insan onuruna yaraşır bir şekilde yerine getirilir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bu Kanun kapsamında kadınlara yönelik cinsiyete dayalı şiddeti önleyen ve kadınları cinsiyete dayalı şiddetten koruyan özel tedbirler ayrımcılık olarak yorumlanamaz.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yer alan;</template>
        <mvz-bent no="a">
          <template>Bakanlık: Aile ve Sosyal Politikalar Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ev içi şiddet: Şiddet mağduru ve şiddet uygulayanla aynı haneyi paylaşmasa da aile veya hanede ya da aile mensubu sayılan diğer kişiler arasında meydana gelen her türlü fiziksel, cinsel, psikolojik ve ekonomik şiddeti,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Hâkim: Aile mahkemesi hâkimini,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Kadına yönelik şiddet: Kadınlara, yalnızca kadın oldukları için uygulanan veya kadınları etkileyen cinsiyete dayalı bir ayrımcılık ile kadının insan hakları ihlaline yol açan ve bu Kanunda şiddet olarak tanımlanan her türlü tutum ve davranışı,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Şiddet: Kişinin, fiziksel, cinsel, psikolojik veya ekonomik açıdan zarar görmesiyle veya acı çekmesiyle sonuçlanan veya sonuçlanması muhtemel hareketleri, buna yönelik tehdit ve baskıyı ya da özgürlüğün keyfî engellenmesini de içeren, toplumsal, kamusal veya özel alanda meydana gelen fiziksel, cinsel, psikolojik, sözlü veya ekonomik her türlü tutum ve davranışı,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Şiddet mağduru: Bu Kanunda şiddet olarak tanımlanan tutum ve davranışlara doğrudan ya da dolaylı olarak maruz kalan veya kalma tehlikesi bulunan kişiyi ve şiddetten etkilenen veya etkilenme tehlikesi bulunan kişileri,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Şiddet önleme ve izleme merkezleri: Şiddetin önlenmesi ile koruyucu ve önleyici tedbirlerin etkin olarak uygulanmasına yönelik destek ve izleme hizmetlerinin verildiği, çalışmalarını yedi gün yirmidört saat esası ile yürüten merkezleri,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Şiddet uygulayan: Bu Kanunda şiddet olarak tanımlanan tutum ve davranışları uygulayan veya uygulama tehlikesi bulunan kişileri,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Tedbir kararı: Bu Kanun kapsamında, şiddet mağdurları ve şiddet uygulayanlar hakkında hâkim, kolluk görevlileri ve mülkî amirler tarafından, istem üzerine veya resen verilecek tedbir kararlarını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Koruyucu ve Önleyici Tedbirlere İlişkin Hükümler">
    <mvz-madde no="3" başlık="Mülkî amir tarafından verilecek koruyucu tedbir kararları">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında korunan kişilerle ilgili olarak aşağıdaki tedbirlerden birine, birkaçına veya uygun görülecek benzer tedbirlere mülkî amir tarafından karar verilebilir:</template>
        <mvz-bent no="a">
          <template>Kendisine ve gerekiyorsa beraberindeki çocuklara, bulunduğu yerde veya başka bir yerde uygun barınma yeri sağlanması.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Diğer kanunlar kapsamında yapılacak yardımlar saklı kalmak üzere, geçici maddi yardım yapılması.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Psikolojik, meslekî, hukukî ve sosyal bakımdan rehberlik ve danışmanlık hizmeti verilmesi.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Hayatî tehlikesinin bulunması hâlinde, ilgilinin talebi üzerine veya resen geçici koruma altına alınması.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Gerekli olması hâlinde, korunan kişinin çocukları varsa çalışma yaşamına katılımını desteklemek üzere dört ay, kişinin çalışması hâlinde ise iki aylık süre ile sınırlı olmak kaydıyla, on altı yaşından büyükler için her yıl belirlenen aylık net asgari ücret tutarının yarısını geçmemek ve belgelendirilmek kaydıyla Bakanlık bütçesinin ilgili tertibinden karşılanmak suretiyle kreş imkânının sağlanması.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Gecikmesinde sakınca bulunan hâllerde birinci fıkranın (a) ve (ç) bentlerinde yer alan tedbirler, ilgili kolluk amirlerince de alınabilir. Kolluk amiri evrakı en geç kararın alındığı tarihi takip eden ilk işgünü içinde mülkî amirin onayına sunar. Mülkî amir tarafından kırksekiz saat içinde onaylanmayan tedbirler kendiliğinden kalkar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Hâkim tarafından verilecek koruyucu tedbir kararları">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında korunan kişilerle ilgili olarak aşağıdaki koruyucu tedbirlerden birine, birkaçına veya uygun görülecek benzer tedbirlere hâkim tarafından karar verilebilir:</template>
        <mvz-bent no="a">
          <template>İşyerinin değiştirilmesi.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kişinin evli olması hâlinde müşterek yerleşim yerinden ayrı yerleşim yeri belirlenmesi.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanunundaki şartların varlığı hâlinde ve korunan kişinin talebi üzerine tapu kütüğüne aile konutu şerhi konulması.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Korunan kişi bakımından hayatî tehlikenin bulunması ve bu tehlikenin önlenmesi için diğer tedbirlerin yeterli olmayacağının anlaşılması hâlinde ve ilgilinin aydınlatılmış rızasına dayalı olarak 27/12/2007 tarihli ve 5726 sayılı Tanık Koruma Kanunu hükümlerine göre kimlik ve ilgili diğer bilgi ve belgelerinin değiştirilmesi.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Hâkim tarafından verilecek önleyici tedbir kararları">
      <mvz-fıkra no="1">
        <template>Şiddet uygulayanlarla ilgili olarak aşağıdaki önleyici tedbirlerden birine, birkaçına veya uygun görülecek benzer tedbirlere hâkim tarafından karar verilebilir:</template>
        <mvz-bent no="a">
          <template>Şiddet mağduruna yönelik olarak şiddet tehdidi, hakaret, aşağılama veya küçük düşürmeyi içeren söz ve davranışlarda bulunmaması.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Müşterek konuttan veya bulunduğu yerden derhâl uzaklaştırılması ve müşterek konutun korunan kişiye tahsis edilmesi.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Korunan kişilere, bu kişilerin bulundukları konuta, okula ve işyerine yaklaşmaması.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Çocuklarla ilgili daha önce verilmiş bir kişisel ilişki kurma kararı varsa, kişisel ilişkinin refakatçi eşliğinde yapılması, kişisel ilişkinin sınırlanması ya da tümüyle kaldırılması.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Gerekli görülmesi hâlinde korunan kişinin, şiddete uğramamış olsa bile yakınlarına, tanıklarına ve kişisel ilişki kurulmasına ilişkin hâller saklı kalmak üzere çocuklarına yaklaşmaması.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Korunan kişinin şahsi eşyalarına ve ev eşyalarına zarar vermemesi.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Korunan kişiyi iletişim araçlarıyla veya sair surette rahatsız etmemesi.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Bulundurulması veya taşınmasına kanunen izin verilen silahları kolluğa teslim etmesi.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Silah taşıması zorunlu olan bir kamu görevi ifa etse bile bu görevi nedeniyle zimmetinde bulunan silahı kurumuna teslim etmesi.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Korunan kişilerin bulundukları yerlerde alkol ya da uyuşturucu veya uyarıcı madde kullanmaması ya da bu maddelerin etkisinde iken korunan kişilere ve bunların bulundukları yerlere yaklaşmaması, bağımlılığının olması hâlinde, hastaneye yatmak dâhil, muayene ve tedavisinin sağlanması.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Bir sağlık kuruluşuna muayene veya tedavi için başvurması ve tedavisinin sağlanması.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Gecikmesinde sakınca bulunan hâllerde birinci fıkranın (a), (b), (c) ve (d) bentlerinde yer alan tedbirler, ilgili kolluk amirlerince de alınabilir. Kolluk amiri evrakı en geç kararın alındığı tarihi takip eden ilk işgünü içinde hâkimin onayına sunar. Hâkim tarafından yirmidört saat içinde onaylanmayan tedbirler kendiliğinden kalkar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda belirtilen tedbirlerle birlikte hâkim, 3/7/2005 tarihli ve 5395 sayılı Çocuk Koruma Kanununda yer alan koruyucu ve destekleyici tedbirler ile 4721 sayılı Kanun hükümlerine göre velayet, kayyım, nafaka ve kişisel ilişki kurulması hususlarında karar vermeye yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Şiddet uygulayan, aynı zamanda ailenin geçimini sağlayan yahut katkıda bulunan kişi ise 4721 sayılı Kanun hükümlerine göre nafakaya hükmedilmemiş olması kaydıyla hâkim, şiddet mağdurunun yaşam düzeyini göz önünde bulundurarak talep edilmese dahi tedbir nafakasına hükmedebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Suçlara ilişkin saklı tutulan hükümler">
      <mvz-fıkra no="1">
        <template>Kişinin silah bulundurması, uyuşturucu veya uyarıcı madde kullanmasının suç oluşturması dolayısıyla ya da fiilinin başka bir suç oluşturması nedeniyle;</template>
        <mvz-bent no="a">
          <template>Soruşturma ve kovuşturma evresinde koruma tedbirlerine veya denetimli serbestlik tedbirlerine,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Mahkûmiyet hâlinde ceza veya güvenlik tedbirlerinin infazına ve bu çerçevede uygulanabilecek olan denetimli serbestlik tedbirlerine,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ilişkin kanun hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="İhbar">
      <mvz-fıkra no="1">
        <template>Şiddet veya şiddet uygulanma tehlikesinin varlığı hâlinde herkes bu durumu resmi makam veya mercilere ihbar edebilir. İhbarı alan kamu görevlileri bu Kanun kapsamındaki görevlerini gecikmeksizin yerine getirmek ve uygulanması gereken diğer tedbirlere ilişkin olarak yetkilileri haberdar etmekle yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Tedbir kararının verilmesi, tebliği ve gizlilik">
      <mvz-fıkra no="1">
        <template>Tedbir kararı, ilgilinin talebi, Bakanlık veya kolluk görevlileri ya da Cumhuriyet savcısının başvurusu üzerine verilir. Tedbir kararları en çabuk ve en kolay ulaşılabilecek yer hâkiminden, mülkî amirden ya da kolluk biriminden talep edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tedbir kararı ilk defasında en çok altı ay için verilebilir. Ancak şiddet veya şiddet uygulanma tehlikesinin devam edeceğinin anlaşıldığı hâllerde, resen, korunan kişinin ya da Bakanlık veya kolluk görevlilerinin talebi üzerine tedbirlerin süresinin veya şeklinin değiştirilmesine, bu tedbirlerin kaldırılmasına veya aynen devam etmesine karar verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Koruyucu tedbir kararı verilebilmesi için, şiddetin uygulandığı hususunda delil veya belge aranmaz. Önleyici tedbir kararı, geciktirilmeksizin verilir. Bu kararın verilmesi, bu Kanunun amacını gerçekleştirmeyi tehlikeye sokabilecek şekilde geciktirilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tedbir kararı, korunan kişiye ve şiddet uygulayana tefhim veya tebliğ edilir. Tedbir talebinin reddine ilişkin karar ise sadece korunan kişiye tebliğ edilir. Gecikmesinde sakınca bulunan hâllerde ilgili kolluk birimi tarafından verilen tedbir kararı şiddet uygulayana bir tutanakla derhâl tebliğ edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tedbir kararının tefhim ve tebliğ işlemlerinde, tedbir kararına aykırılık hâlinde şiddet uygulayan hakkında zorlama hapsinin uygulanacağı ihtarı yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Gerekli bulunması hâlinde, tedbir kararı ile birlikte talep üzerine veya resen, korunan kişi ve diğer aile bireylerinin kimlik bilgileri veya kimliğini ortaya çıkarabilecek bilgileri ve adresleri ile korumanın etkinliği bakımından önem taşıyan diğer bilgileri, tüm resmi kayıtlarda gizli tutulur. Yapılacak tebligatlara ilişkin ayrı bir adres tespit edilir. Bu bilgileri hukuka aykırı olarak başkasına veren, ifşa eden veya açıklayan kişi hakkında 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun ilgili hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Talep hâlinde ilgililere kişisel eşya ve belgelerinin kolluk marifetiyle teslimi sağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="İtiraz">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre verilen kararlara karşı tefhim veya tebliğ tarihinden itibaren iki hafta içinde ilgililer tarafından aile mahkemesine itiraz edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hâkim tarafından verilen tedbir kararlarına itiraz üzerine dosya, o yerde aile mahkemesinin birden fazla dairesinin bulunması hâlinde, numara olarak kendisini izleyen daireye, son numaralı daire için birinci daireye, o yerde aile mahkemesinin tek dairesi bulunması hâlinde asliye hukuk mahkemesine, aile mahkemesi hâkimi ile asliye hukuk mahkemesi hâkiminin aynı hâkim olması hâlinde ise en yakın asliye hukuk mahkemesine gecikmeksizin gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İtiraz mercii kararını bir hafta içinde verir. İtiraz üzerine verilen kararlar kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Tedbir kararlarının bildirimi ve uygulanması">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre alınan tedbir kararları, Bakanlığın ilgili il ve ilçe müdürlükleri ile verilen kararın niteliğine göre Cumhuriyet başsavcılığına veya kolluğa en seri vasıtalarla bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamında ilgili mercilere yapılan başvurular ile bu başvuruların kabul ya da reddine ilişkin kararlar, başvuru yapılan merci tarafından Bakanlığın ilgili il ve ilçe müdürlüklerine derhâl bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Korunan kişinin geçici koruma altına alınmasına ilişkin koruyucu tedbir kararı ile şiddet uygulayan hakkında verilen önleyici tedbir kararlarının yerine getirilmesinden, hakkında koruyucu veya önleyici tedbir kararı verilen kişilerin yerleşim yeri veya bulunduğu ya da tedbirin uygulanacağı yer kolluk birimi görevli ve yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tedbir kararının, kolluk amirince verilip uygulandığı veya korunan kişinin kollukta bulunduğu hâllerde, kolluk birimleri tarafından kişi, Bakanlığın ilgili il veya ilçe müdürlüklerine ivedilikle ulaştırılır; bunun mümkün olmaması hâlinde giderleri Bakanlık bütçesinin ilgili tertibinden karşılanmak üzere kendisine ve beraberindekilere geçici olarak barınma imkânı sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tedbir kararının ilgililere tefhim veya tebliğ edilmemesi, kararın uygulanmasına engel teşkil etmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Hakkında barınma yeri sağlanmasına karar verilen kişiler, Bakanlığa ait veya Bakanlığın gözetim ve denetimi altında bulunan yerlere yerleştirilir. Barınma yerlerinin yetersiz kaldığı hâllerde korunan kişiler; mülkî amirin, acele hâllerde kolluğun veya Bakanlığın talebi üzerine kamu kurum ve kuruluşlarına ait sosyal tesis, yurt veya benzeri yerlerde geçici olarak barındırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İşyerinin değiştirilmesi yönündeki tedbir kararı, kişinin tabi olduğu ilgili mevzuat hükümlerine göre yetkili merci veya kişi tarafından yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Kolluk görevleri">
      <mvz-fıkra no="1">
        <template>Kolluk görevleri, kolluğun merkez ve taşra teşkilâtında bu Kanunda belirtilen hizmetlerle ilgili olarak, çocuk ve kadının insan hakları ile kadın erkek eşitliği konusunda eğitim almış ve ilgili kolluk birimlerince belirlenmiş olan yeteri kadar personel tarafından yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Teknik yöntemlerle takip">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre verilen tedbir kararlarının uygulanmasında hâkim kararı ile teknik araç ve yöntemler kullanılabilir. Ancak, bu suretle, kişilerin ses ve görüntüleri dinlenemez, izlenemez ve kayda alınamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Teknik araç ve yöntemlerle takibe ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Tedbir kararlarına aykırılık">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre hakkında tedbir kararı verilen şiddet uygulayan, bu kararın gereklerine aykırı hareket etmesi hâlinde, fiili bir suç oluştursa bile ihlal edilen tedbirin niteliğine ve aykırılığın ağırlığına göre hâkim kararıyla üç günden on güne kadar zorlama hapsine tabi tutulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tedbir kararının gereklerine aykırılığın her tekrarında, ihlal edilen tedbirin niteliğine ve aykırılığın ağırlığına göre zorlama hapsinin süresi onbeş günden otuz güne kadardır. Ancak zorlama hapsinin toplam süresi altı ayı geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Zorlama hapsine ilişkin kararlar, Cumhuriyet başsavcılığınca yerine getirilir. Bu kararlar Bakanlığın ilgili il ve ilçe müdürlüklerine bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Merkezlerin Kurulması, Destek Hizmetleri ve Kurumlararası Koordinasyon">
    <mvz-madde no="14" başlık="Şiddet önleme ve izleme merkezlerinin kurulması">
      <mvz-fıkra no="1">
        <template>Bakanlık, gerekli uzman personelin görev yaptığı ve tercihen kadın personelin istihdam edildiği, şiddetin önlenmesi ile koruyucu ve önleyici tedbirlerin etkin olarak uygulanmasına yönelik destek ve izleme hizmetlerinin verildiği, çalışmalarını yedi gün yirmidört saat esasına göre yürüten, çalışma usul ve esasları yönetmelikle belirlenen, şiddet önleme ve izleme merkezlerini kurar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurulan merkezlerde şiddetin önlenmesi ile koruyucu ve önleyici tedbirlerin etkin olarak uygulanmasına yönelik izleme çalışmaları yapılır ve destek hizmetleri verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Destek hizmetleri">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında şiddetin önlenmesi ve verilen tedbir kararlarının etkin olarak uygulanmasının izlenmesi bakımından şiddet önleme ve izleme merkezleri tarafından verilecek destek hizmetleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Koruyucu ve önleyici tedbir kararları ile zorlama hapsinin verilmesine ve uygulanmasına ilişkin veri toplayarak bilgi bankası oluşturmak, tedbir kararlarının sicilini tutmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Korunan kişiye verilen barınma, geçici maddi yardım, sağlık, adlî yardım hizmetleri ve diğer hizmetleri koordine etmek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Gerekli hâllerde tedbir kararlarının alınmasına ve uygulanmasına yönelik başvurularda bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bu Kanun kapsamındaki şiddetin sonlandırılmasına yönelik bireysel ve toplumsal ölçekte programlar hazırlamak ve uygulamak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bakanlık bünyesinde kurulan çağrı merkezinin bu Kanunun amacına uygun olarak yaygınlaştırılması ve yapılan müracaatların izlenmesini sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bu Kanun kapsamındaki şiddetin sonlandırılması için çalışan ilgili sivil toplum kuruluşlarıyla işbirliği yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Korunan kişilerle ilgili olarak şiddet önleme ve izleme merkezleri tarafından verilecek destek hizmetleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Kişiye hakları, destek alabilecekleri kurumlar, iş bulma ve benzeri konularda rehberlik etmek ve meslek edindirme kurslarına katılmasına yönelik faaliyetlerde bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Verilen tedbir kararıyla ulaşılmak istenen amacın gerçekleşmesine yönelik önerilerde bulunmak ve yardımlar yapmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Tedbir kararlarının uygulanmasının sonuçlarını ve kişiler üzerindeki etkilerini izlemek.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Psiko-sosyal ve ekonomik sorunların çözümünde yardım ve danışmanlık yapmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hâkimin isteği üzerine; kişinin geçmişi, ailesi, çevresi, eğitimi, kişisel, sosyal, ekonomik ve psikolojik durumu hakkında ayrıntılı sosyal araştırma raporu hazırlayıp sunmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İlgili merci tarafından istenilmesi hâlinde, tedbirlerin uygulanmasının sonuçları ve ilgililer üzerindeki etkilerine dair rapor hazırlamak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>29/5/1986 tarihli ve 3294 sayılı Sosyal Yardımlaşma ve Dayanışmayı Teşvik Kanunu hükümleri uyarınca maddi destek sağlanması konusunda gerekli rehberliği yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Şiddet uygulayanla ilgili olarak şiddet önleme ve izleme merkezleri tarafından verilecek destek hizmetleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Hâkimin isteği üzerine; kişinin geçmişi, ailesi, çevresi, eğitimi, kişisel, sosyal, ekonomik ve psikolojik durumu ile diğer kişiler ve toplum açısından taşıdığı risk hakkında ayrıntılı sosyal araştırma raporu hazırlayıp sunmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İlgili makam veya merci tarafından istenilmesi hâlinde, tedbirlerin uygulanmasının sonuçları ve ilgililer üzerindeki etkilerine dair rapor hazırlamak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Teşvik edici, aydınlatıcı ve yol gösterici mahiyette olmak üzere kişinin;</template>
          <mvz-altbent no="1">
            <template>Öfke kontrolü, stresle başa çıkma, şiddeti önlemeye yönelik farkındalık sağlayarak tutum ve davranış değiştirmeyi hedefleyen eğitim ve rehabilitasyon programlarına katılmasına,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Alkol, uyuşturucu, uçucu veya uyarıcı madde bağımlılığının ya da ruhsal bozukluğunun olması hâlinde, bir sağlık kuruluşunda muayene veya tedavi olmasına,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Meslek edindirme kurslarına katılmasına,</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yönelik faaliyetlerde bulunmak.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Şiddet mağduru ile şiddet uygulayana yönelik hizmetler, zorunlu hâller dışında farklı birimlerde sunulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Kurumlararası koordinasyon ve eğitim">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerinin yerine getirilmesinde kurumlararası koordinasyon Bakanlık tarafından gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu kurum ve kuruluşları ile diğer gerçek ve tüzel kişiler, bu Kanunun uygulanmasıyla ilgili olarak kendi görev alanına giren konularda işbirliği ve yardımda bulunmak ve alınan tedbir kararlarını ivedilikle yerine getirmekle yükümlüdür. Gerçek ve tüzel kişiler, bu Kanun kapsamında Bakanlık çalışmalarını desteklemek ve ortak çalışmalar yapmak üzere teşvik edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Türkiye Radyo ve Televizyon Kurumu ile ulusal, bölgesel ve yerel yayın yapan özel televizyon kuruluşları ve radyolar, ayda en az doksan dakika kadınların çalışma yaşamına katılımı, özellikle kadın ve çocukla ilgili olmak üzere şiddetle mücadele mekanizmaları ve benzeri politikalar konusunda Bakanlık tarafından hazırlanan ya da hazırlattırılan bilgilendirme materyallerini yayınlamak zorundadır. Bu yayınlar, asgari otuz dakikası 17.00-22.00 saatleri arasında olmak üzere 08.00-22.00 saatleri arasında yapılır ve yayınların kopyaları her ay düzenli olarak Radyo ve Televizyon Üst Kuruluna teslim edilir. Bu saatler dışında yapılan yayınlar aylık doksan dakikalık süreye dâhil edilmez. Bu süreler Radyo ve Televizyon Üst Kurulu tarafından denetlenir. Televizyon kuruluşları ve radyolarda yayınlanacak bilgilendirme materyalleri, Bakanlık birimleri tarafından üniversiteler, ilgili meslek kuruluşları ve sivil toplum kuruluşlarının da görüşleri alınarak hazırlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunda öngörülen görevlerin yerine getirilmesi sırasında kamu kurum ve kuruluşlarının personeli Bakanlık görevlilerine yardımcı olurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tüm kamu kurum ve kuruluşları ile kamu kurumu niteliğindeki meslek kuruluşları, personel ve üyelerinin bu Kanunun etkin bir biçimde uygulanması amacıyla Bakanlığın hazırlayıp koordine edeceği, kadının insan hakları ile kadın erkek eşitliği konusunda eğitim programlarına katılmasını sağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İlköğretim ve ortaöğretim müfredatına, kadının insan hakları ve kadın erkek eşitliği konusunda eğitime yönelik dersler konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Mali Hükümler">
    <mvz-madde no="17" başlık="Geçici maddi yardım yapılması">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre geçici maddi yardım yapılmasına karar verilmesi hâlinde, onaltı yaşından büyükler için her yıl belirlenen aylık net asgari ücret tutarının otuzda birine kadar günlük ödeme yapılır. Korunan kişinin birden fazla olması hâlinde, ilave her bir kişi için bu tutarın yüzde yirmisi oranında ayrıca ödeme yapılır. Ancak, ödenecek tutar hiçbir şekilde belirlenen günlük ödeme tutarının bir buçuk katını geçemez. Korunan kişilere barınma yeri sağlanması hâlinde bu fıkrada belirlenen tutarlar yüzde elli oranında azaltılarak uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu ödemeler, Bakanlık bütçesine, geçici maddi yardımlar için konulan ödenekten karşılanır. Yapılan ödemeler, şiddet uygulayandan tebliğ tarihinden itibaren bir ay içinde tahsil edilir. Bu şekilde tahsil edilemeyenler 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre ilgili vergi dairesi tarafından takip ve tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Korunan kişinin gerçeğe aykırı beyanda bulunduğunun tespiti hâlinde yapılan yardımlar, bu kişiden 6183 sayılı Kanun hükümlerine göre tahsil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Nafaka">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre nafakaya karar verilmesi hâlinde, kararın bir örneği, resen nafaka alacaklısının veya borçlusunun yerleşim yeri icra müdürlüğüne gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Nafaka ödemekle yükümlü kılınan kişinin Sosyal Güvenlik Kurumu ile bağlantısı olması durumunda, korunan kişinin başvurusu aranmaksızın nafaka, ilgilinin aylık, maaş ya da ücretinden icra müdürlüğü tarafından tahsil edilir. İcra müdürlüklerinin nafakanın tahsili işlemlerine ilişkin posta giderleri Cumhuriyet başsavcılığının suçüstü ödeneğinden karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Sağlık giderleri">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre hakkında koruyucu tedbir kararı verilen kişilerden genel sağlık sigortalısı olmayan ve genel sağlık sigortalısının bakmakla yükümlü olduğu kişi kapsamına da girmeyen veya genel sağlık sigortası prim borcu sebebiyle fiilen genel sağlık sigortasından yararlanamayan ya da diğer mevzuat hükümleri gereğince tedavi yardımından yararlanma hakkı bulunmayanlar; bu hâllerin devamı süresince, 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 60 ıncı maddesinin birinci fıkrasının (c) bendinin (1) numaralı alt bendi kapsamında, gelir testine tabi tutulmaksızın genel sağlık sigortalısı sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun hükümlerine göre hakkında önleyici tedbir kararı verilen kişinin aynı zamanda rehabilitasyonunun veya tedavi edilmesinin gerekli olduğuna karar verilmesi hâlinde, genel sağlık sigortası kapsamında karşılanmayan rehabilitasyon hizmetlerine yönelik giderler ile rehabilitasyon hizmetleri kapsamında verilmesi gereken diğer sağlık hizmetlerinin giderleri Bakanlık bütçesinin ilgili tertiplerinden karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Harçlar ve masraflardan, vergilerden muafiyet ve davaya katılma">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki başvurular ile verilen kararların icra ve infazı için yapılan işlemlerden yargılama giderleri, harç, posta gideri ve benzeri hiçbir ad altında masraf alınmaz. Bu Kanunun 17 nci maddesi uyarınca yapılan ödemeler gelir vergisi ile veraset ve intikal vergisinden, bu ödemeler için düzenlenen kâğıtlar ise damga vergisinden müstesnadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık, gerekli görmesi hâlinde kadın, çocuk ve aile bireylerine yönelik olarak uygulanan şiddet veya şiddet tehlikesi dolayısıyla açılan idarî, cezaî, hukukî her tür davaya ve çekişmesiz yargıya katılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Çeşitli ve Son Hükümler">
    <mvz-madde no="21" başlık="Kadrolar">
      <mvz-fıkra no="1">
        <template>Ekli listede yer alan kadrolar ihdas edilerek 13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnamenin eki (I) sayılı cetvelin Aile ve Sosyal Politikalar Bakanlığına ait bölümüne eklenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasına ilişkin usul ve esaslar altı ay içinde, Adalet, İçişleri, Maliye, Milli Eğitim ve Sağlık Bakanlıklarının görüşleri alınmak suretiyle Bakanlık tarafından hazırlanan yönetmeliklerle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Yürürlükten kaldırılan hükümler ve atıflar">
      <mvz-fıkra no="1">
        <template>14/1/1998 tarihli ve 4320 sayılı Ailenin Korunmasına Dair Kanun yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mevzuatta 4320 sayılı Kanuna yapılan atıflar bu Kanuna yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun yürürlüğe girmesinden önce 4320 sayılı Kanun hükümlerine göre verilen kararların uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Şiddet önleme ve izleme merkezlerinin faaliyete geçmesi" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 14 üncü maddesinde kurulması öngörülen şiddet önleme ve izleme merkezleri, Kanunun yürürlüğe girdiği tarihten itibaren iki yıl içinde Bakanlık tarafından belirlenecek illerde pilot uygulama yapılmak üzere kurulur. Kuruluşları tamamlanıncaya kadar merkezlerin görevlerinin Bakanlığın hangi birimlerince yürütüleceği Bakanlık tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
