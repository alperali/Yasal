  <mvz-künye tür="kanun" no="1416" başlık="ECNEBİ MEMLEKETLERE GÖNDERİLECEK TALEBE HAKKINDA KANUN"
             tarih="8/4/1929" rgazete-tarih="16/4/1929" rgazete-sayı="1169"
             düstur-tertip="3" düstur-cilt="10" düstur-sayfa="407" />
    
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Umumi ve mülhak bütçe ile idare olunan Devlet devairi ve inhisar idarelerinin, vilayetlerin, şehremanetleri ile belediyelerin, ticaret odalarının ve mukavelenameleri mucibince talebe göndermeğe mecbur olan şirketlerin tahsil için ecnebi memleketlere gönderecekleri talebe bu kanun ahkamına tabidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Birinci maddede sayılan makamlar tarafından ecnebi memleketlere gönderilecek talebe Maarif Vekaletince yazılı ve sözlü sınav ile seçilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu makamlar göndermek istedikleri talebenin  adedini, ihtisas zümresini ve bu talebede aradıkları evsafı ve okutmak istedikleri memleketleri ve takip etmesini arzu eyledikleri tahsil planının esaslı cihetlerini her sene Nisan nihayetine kadar Maarif Vekaletine bildirirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Maarif Vekaleti de o sene ecnebi memleketlere gönderilecek talebin evsafını, tahsil şartlarını alakadar tedris müesseselerine tebliğ ve gazetelerle ilan eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamında yurt dışına gönderilecek öğrencilerin seçimi yazılı ve sözlü sınavla olur. Yazılı sınav Millî Eğitim Bakanlığınca veya düzenlenecek protokolle Ölçme, Seçme ve Yerleştirme Merkezi tarafından yapılır. Millî Eğitim Bakanlığınca, Akademik Personel ve Lisansüstü Eğitimi Giriş Sınavı yazılı sınav yerine kullanılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Öğrencilerin seçiminde yazılı sınav ve sözlü sınav ile mezuniyet not ortalaması Bakanlıkça belirlenecek ağırlıklarla dikkate alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Sözlü sınava çağrılan adaylar;</template>
      <mvz-bent no="a">
        <template>Genel alan bilgisi konularına ilişkin bilgi düzeyi,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bir konuyu kavrayıp özetleme, ifade kabiliyeti ve muhakeme gücü,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>İletişim becerileri, öz güveni ve ikna kabiliyeti,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Bilimsel ve teknolojik gelişmelere açıklığı,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Akademik çalışmalara yatkınlığı,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>yönlerinden Bakanlıkça oluşturulacak komisyon tarafından değerlendirilir. Adaylar, komisyon tarafından (a) ila (d) bentlerinde belirtilen özelliklerin her biri için yirmişer puan üzerinden değerlendirilir ve verilen puanlar ayrı ayrı tutanağa geçirilir. Bunun dışında sözlü sınav ile ilgili herhangi bir kayıt sistemi kullanılmaz. Sözlü sınav soru ve cevaplarının önceden hazırlanması zorunlu değildir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Sözlü sınav komisyonu; Bakanlık personeli, öğretim elemanları ve Bakanlıkça uygun görülen ilgili kurum personeli arasından Bakanlıkça seçilen bir başkan ve iki asıl üyeden oluşur. Bakanlık, aynı usulle asıl üye sayısı kadar yedek üye belirler. Asıl üyelerin bulunmadığı durumlarda yedek üyeler komisyonda görev yapar. Bakanlık, gerekli durumlarda uygun görülen yerlerde birden fazla komisyon ve bütün komisyonlar için ortak yedek üye listesi oluşturabilir. Yurt dışına gönderilecek öğrencilerin seçimi, başvuru şartları ile sınavlara ilişkin diğer usul ve esaslar Bakanlık tarafından yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>İmtihan merkezlerinde teşkil edilecek sıhiye heyetleri namzetlerin muayenelerini yaparak ecnebi memleketinde tahsillerine mani olacak arızalardan salim bulunup bulunmadıklarını tayin ederler. Namzetler bu heyetin vereceği sıhhat raporlarını almadan müsabaka imtihanına  giremezler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="">
    <mvz-fıkra no="1">
      <template>İmtihan sualleri Maarif Vekaletince tayin edilecek mütehassıslardan mürekkep bir komisyon tarafından tertip olunur. Bu komisyon lüzum gördüğü takdirde sual tanzimini hariçteki mütehassıslara da havale edebilir. Ancak başka dairelerden gönderilecek mütehassıslar dahi aza sıfatiyle komisyona iştirak ederler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>İmtihanların yapılacağı tarih, müessese ve merkez her sene Maarif Vekaleti tarafından tayin ve en az on beş gün evvel ilan olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="">
    <mvz-fıkra no="1">
      <template>İmtihanlar Maarif Vekaleti tarafından her merkezde teşkil edilecek heyetler huzurunda yapılır. Bu heyetlerin teşekkül ve çalışma usulleri bir talimatname ile tesbit olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="">
    <mvz-fıkra no="1">
      <template>İmtihan evrakı, sualleri tertip eden komisyon tarafından tetkik edilir. Her derse ait imtihan evrakı biri alakadar vekaletten memur edilmek üzere en az iki zat tarafından tetkik olunur. Ecnebi lisanı notu diğer derslerden musavi derecede not alanlar arasında tercih sebebi olarak nazarı itibara alınır. Sualleri tertip eden komisyon icabında ders zümrelerine emsal kabul edebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="">
    <mvz-fıkra no="1">
      <template>Elyevm tahsilde bulunan ve bundan böyle gönderilecek olan her talebeye Maarif Vekaletince tahsil şartlarını gösteren etraflı birer plan verilir. Lüzum ve zaruret takdirinde bu planlar (2) nci madde hükmü nazarı dikkate alınarak Maarif Vekaleti tarafından tadil edilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="">
    <mvz-fıkra no="1">
      <template>Müsabakada kazanan ve gönderilmeleri kararlaştırılan talebeden bu kanun ile kendilerine tahmil olunan mecburiyetleri ifa edeceklerine dair Maarif Vekaletince birer taahhütname alınır ve bu taahhütnamelerin tasdikli birer sureti alakadar makamlara verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="">
    <mvz-fıkra no="1">
      <template>Bir talebenin tahsilini ikmal etmesi o talebenin tahsil planında gösterilen merhaleleri geçmesi demektir. Hastalık veya herhangi meşru ve fevkalade bir hal vakı olmadıkça talebenin tahsil planında gösterilen müddette tahsilini bitirmemesi o talebenin geriye çağırılmasını icap ettirir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="">
    <mvz-fıkra no="1">
      <template>Umumi ve mülhak bütçe ile idare olunan dairelerin tahsilde bulunan veya yeniden gönderecekleri talebe için her sene bütçeleriyle kabul olunacak tahsisat her daire namına ayrı ayrı maddeleri ihtiva etmek üzere Maarif Vekaleti bütçesinde açılacak bir fasılda cem olunur. Diğer makamlar kendi hesaplarına tahsilde bulunan ve yeniden gönderilecek olan talebenin Maarif Vekaletinden alacakları miktara göre senelik tahsisatının tediyesini her sene Nisan nihayetine kadar Maliye Vekaletine tahriren taahhüt ederler. Bu taahhütler yekünu bir taraftan varidat bütçesine ithal diğer taraftanda Maarif Vekaleti bütçesindeki talebe tahsisatı faslına bir madde olarak vazolunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="">
    <mvz-fıkra no="1">
      <template>Öğrenci ödeneği, bütün öğrencileri kapsamak üzere her yıl Millî Eğitim ve Maliye Bakanlıklarınca tespit edilecek aylık miktar ile zaruri giderler toplamından teşekkül eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun kapsamında yurt dışına gönderilenlerin bakmakla yükümlü oldukları eş ve çocuklarının tedavi giderleri, sürekli görevle yurt dışına gönderilen Devlet memurlarının bakmakla yükümlü oldukları kişiler için 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununda belirlenmiş olan usul ve esaslar çerçevesinde ilgili kamu kurum ve kuruluşlarınca karşılanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="">
    <mvz-fıkra no="1">
      <template>Maarif Vekaleti ecnebi memleketlerde tahsilde bulunan talebenin daimi ve muntazam bir surette teftiş ve murakabesi vazifesi ile mükellef olmak üzere azami dört Maarif Müfettişinden ve Askeri Fabrikaları Umum Müdürlüğüne mensup bir müfettişten mürekkep bir teftiş heyeti bulundurur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Her müfettişe müteferrik ve müstacel masraflar için Cumhurbaşkanı karariyle üç bin liraya kadar avans vermeğe Maarif Vekaleti selahiyettardır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="">
    <mvz-fıkra no="1">
      <template>Müfettişler mühim ve müstacel sebepler dolayısiyle bir talebenin bulunduğu şehir veya müesseseyi tebdil edebilirler. Askeri Fabrikalara mensup talebeler sınıfını muhafaza etmek suretiyle bu ahkama tabidir. Bu takdirde azami bir hafta zarfında Vekaleti keyfiyetten haberdar ederler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="">
    <mvz-fıkra no="1">
      <template>Müfettişler kendi hesaplarına tahsilde bulunan Türk talebenin vaziyetini  ve çalışmalarını aileleri tarafından vukubulacak müracaat üzerine teftiş ederler  ve  neticeden  kendilerine  malümat  verirler.  Bu  talebeden  milli  şeref ve haysiyeti  kıracak  surette  hareket  ettikleri  müfettişler   tarafından   tesbit  edilenler, velileriyle talebenin tahsilde bulunduğu memleket elçiliğine ve Maarif Vekaletine bildirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="">
    <mvz-fıkra no="1">
      <template>Maarif Vekaleti her talebenin tahsilini ikmal etmesinden altı ay evvel keyfiyeti ait olduğu makama bildirir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tahsilini ikmal ile avdet eden talebe iki ay zarfında taahhütname ile merbut olduğu makama müracaata mecburdur. Müracaatından itibaren mensup olduğu makamca bu talebeye bir vazifeye tayin edilmedikçe üç ay müddetle ecnebi memleketlerde tahsilde bulunan talebe için itası mukarrer asgari aylığının yarısı aylık tahsisat olarak verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="18" başlık="">
    <mvz-fıkra no="1">
      <template>Avdet ve müracaat etmiş olan bir talebe ihtisası dahilinde kendisine teklif olunacak hizmeti kabule mecburdur. Ancak bu mecburiyet müracaatından itibaren üç ay nihayetine kadar bir hizmete tayin edilmiyenler için sakıt olur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci maddede sayılı makamlardan belediyeler, ticaret odaları ve şirketler tarafından tahsile gönderilen talebe müstesna olmak şartiyle diğer makamlara ait talebe için 10 uncu maddeye tevfikan bu talebenin taahhütnameleri ahkamının tatbikı ile vazifedar olanlar avdet edecek talebeyi açıkta bırakmamak üzere zamanında bütçeleri ile tahsisat teklif etmemek veya münhal bir vazifeyi hazır bulundurmamak gibi tedabiri evveliyeyi ittihazda ve intihap ve tayin ile mükellef olanlar tahsilden avdet ve müracaat eden talebeyi ihtisasları dahilinde münhal bir hizmete kanuni sebepler olmaksızın tayin için muktazi muameleleri ifade ihmal ve terahi gösterdikleri takdirde o talebenin ecnebi memleketlerde tahsili uğrunda ihtiyar edilmiş masrafı ödemeğe mecburdurlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Taahhütname ile merbut olduğu makam tarafından kendisine müracaatından itibaren iki ay zarfında iş gösterilmeyen talebeyi üçüncü ay hitamına kadar Devletin herhangi bir dairesi hizmete tayin edebilir ve bu takdirde talebenin taahhütnamesindeki mecburiyeti kendisini hizmete tayin eden daireye intikal eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="19" başlık="">
    <mvz-fıkra no="1">
      <template>Geriye çağrılan talebe ile tahsillerini bitirerek iki ay zarfında avdet eylemeyen, 17 nci ve 18 inci maddeler mucibince müracaat ve teklif olunan hizmetleri kabul etmeyen talebe ile bunlardan mecburi hizmet müddeti içinde istifa eden veyahut memuriyetten ihraç cezasına uğrayanlar, 657 sayılı Devlet Memurları Kanununun ek 34 üncü maddesine göre tahsil masraflarını faizleriyle birlikte ödemeye mecburdur.  Faiz borcunun hesaplanmasında, öğrencilerin taahhüdünü ihlal ettiği tarih faiz başlangıç tarihi olarak esas alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yurt dışına gönderilenlerden ruh veya beden sağlığının öğrenimini sürdürmesine imkân tanımaması durumu, eğitim ve araştırma hastaneleri veya üniversite hastanelerinden alınacak sağlık kurulu raporu ve bu hususla ilgili olarak Millî Eğitim Bakanlığınca istenen diğer destekleyici belgeler ile tespit edilenlerin öğrencilikle ilişiği kesilir. Bu kişilerden tahsil masrafı istenmez ve bu kişiler mecburi hizmetle yükümlü tutulmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="20" başlık="">
    <mvz-fıkra no="1">
      <template>Evvelce kendi hesaplarına tahsile gitmiş olan talebeden tahsillerine devam edemiyecek vaziyete düşmüş olanlar, bulundukları resmi müesseselerde imtihan geçirmiş ve bu imtihanlarda muvaffakiyet temin etmiş bulundukları takdirde müfettişliğin mütalaası alındıktan sonra zümresine ait tahsisat mevcut olmak ve dairesince muvafakat olunmak şartiyle bu kanun ahkamına tabi talebe arasına alınabilirler. Ecnebi memleketlerde resmi hiç bir imtihan geçirmemiş olanların bu kanun ahkamına tabi talebe meyanına alınabilmesi için Maarif Vekaletince açılacak müsabaka imtihanlarına iştirak etmeleri şarttır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="21" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun uyarınca mecburi hizmet karşılığı yurt dışına gönderilenler öğrenimlerini başarıyla tamamladıktan sonra mecburi hizmet yükümlülüklerini ifa etmek üzere, adlarına gönderildikleri kurumların ilgili kadrolarına atanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Millî Eğitim Bakanlığında istihdam edilmek üzere Millî Eğitim Bakanlığı adına ve hesabına bu Kanun kapsamında yurt dışına gönderilenlerden gönderildikleri ülkede doktora öğrenimlerini tamamladıktan sonra mecburi hizmet yükümlülüklerini ifa etmek üzere yurda dönenler, Millî Eğitim Uzmanı kadrolarına atanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu kişilerin yurt dışında lisansüstü eğitim amacıyla geçirdikleri sürelerin tamamı, Bakanlıkça belirlenen yurt dışında azami eğitim süresini geçmemek üzere, memuriyette geçmiş sayılarak, bu sürelerin her yılı bir kademe ilerlemesine ve her üç yılı bir derece yükselmesine esas olacak şekilde değerlendirilir ve 657 sayılı Kanunun 68 inci maddesinin (B) fıkrasında öngörülen çalışma sürelerinin hesabında da dikkate alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kamu kurum ve kuruluşlarında memur olarak çalışırken bu Kanun kapsamında yurt dışına gönderilmeye hak kazananlara, öğrenim süreleri boyunca kurumları tarafından aylıksız izin verilir. Bu kişiler öğrenimlerini başarıyla tamamlayıp mecburi hizmet yükümlülüklerini ifa etmek üzere aylıksız izinli olarak ayrıldıkları kadrolarına döndükten sonra, adına öğrenim gördükleri kurumların ilgili kadrolarına en geç altı ay içerisinde naklen atanırlar. Aylıksız izin sebebinin ortadan kalkmasından itibaren iki ay içinde görevine dönmeyenler, memuriyetten çekilmiş sayılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yükseköğretim kurumları adına ve Millî Eğitim Bakanlığı hesabına lisansüstü öğrenim görenlerin mecburi hizmet yükümlülüklerinin, yükseköğretim kurumları ile kamu kurum ve kuruluşlarına devrine Yükseköğretim Kurulunun uygun görüşü üzerine Millî Eğitim Bakanlığınca karar verilir. Kamu kurum ve kuruluşları adına lisansüstü öğrenim görenlerin mecburi hizmet yükümlülüklerinin kamu kurum ve kuruluşları ile yükseköğretim kurumlarına devrine ise Millî Eğitim Bakanlığınca karar verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Yükseköğretim kurumları adına yurt dışına gönderilenlerin öğrenimlerini izlemek ve değerlendirmek üzere adına öğrenim gördükleri yükseköğretim kurumu tarafından danışman atanır. Yükseköğretim kurumları adına yurt dışına gönderilenlerden doktora öğrenimlerini başarıyla tamamlayanların, mecburi hizmet yükümlülüklerini ifa etmek üzere adına öğrenim gördükleri yükseköğretim kurumunun atama kriterlerini karşılamaları şartıyla doktor öğretim üyesi kadrolarına, atama kriterlerini sağlamamaları halinde ise öğretim görevlisi kadrolarına ataması yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Kamu kurum ve kuruluşlarınca staj amacıyla yabancı ülkelere gönderilecek memurlar hakkında bu Kanun hükümleri uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanun uyarınca mecburi hizmet karşılığı yurt dışına gönderilenlerden, bu maddenin yürürlüğe girdiği tarihten önce, eğitimin herhangi bir aşamasında öğrencilikle ilişikleri kesilenler, öğrenim sürelerinin bitiminde mecburi hizmetlerini tamamlamak üzere görevlerine başlamayanlar, görevlerine başlayıp da yükümlü bulundukları mecburi hizmetini bitirmeden görevlerinden ayrılanlar ile göreve başladıktan sonra mecburi hizmetle yükümlü bulundukları süre içerisinde kadrolarıyla ilişiği kesilenlerden haklarında borç takibi işlemi devam edenler, bu maddenin yürürlüğe girdiği tarihten itibaren üç ay içerisinde başvurmaları halinde, kendilerine döviz olarak yapılmış olan her türlü masraflar için, imzaladıkları yüklenme senedi ile muteber imzalı müteselsil kefalet senedi hükümleri dikkate alınmaksızın ve ilgililere ödeme yapma sonucunu doğurmaksızın,  14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanununun ek 34 üncü maddesinin ikinci fıkrası hükümlerine göre bu maddenin yürürlüğe girdiği tarihten önceki süreler için faiz uygulanmaksızın hesaplanacak tutarlarla yükümlü tutulurlar. Ancak, 657  sayılı  Devlet Memurları Kanununun ek 34 üncü maddesinin yürürlüğe girdiği tarihten önce yüklenme senedi ile muteber imzalı müteselsil kefalet senedi alınanların döviz borçları, ilgili adına fiilen ödemenin yapıldığı tarihteki T.C. Merkez Bankasınca tespit ve ilân edilen efektif satış kuru üzerinden Türk Lirasına çevrilerek bunlar adına Türk Lirası olarak yapılan harcama tutarına eklenir. Bu şekilde hesaplanacak borç, sarf tarihinden bu Kanunun yürürlüğe girdiği tarihe kadar geçen süre için 1/1/2006 tarihinden geçerli olmak üzere tespit ve ilân edilen kanunî faiz işletilerek hesaplanır. Bu şekilde hesaplanacak borç miktarından ilgilinin bu zamana kadar yaptığı tüm ödemeler mahsup edilir; fazla ödenen tutar var ise ilgililere geri ödeme zorunluluğu doğurmaz. Kalan borç var ise ilgilinin durumu ve ödettirilecek meblağ dikkate alınarak azamî beş yıla kadar taksitlendirilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bunlardan borçlarını mecburi hizmet yaparak ödemek isteyenler, bu maddenin yürürlüğe girdiği tarihten itibaren üç ay içerisinde Milli Eğitim Bakanlığına müracaat etmeleri halinde, 657 sayılı Devlet Memurları Kanununun 48 inci maddesinde belirtilen genel şartları taşımaları kaydıyla, müracaat tarihinden itibaren üç ay içerisinde atamaları yapılır ve atandıkları kurumlarında, yurt içinde veya yurt dışında görmüş oldukları öğrenim sürelerine ilişkin olarak genel hükümler çerçevesinde belirlenen mecburi hizmet yükümlülüklerini yerine getirirler ve ilgililer adına öğrenimleri nedeniyle çıkarılmış olan her türlü borç tutarlarının takibinden vazgeçilerek tahsilat işlemine son verilir. Bunların daha önce ödemiş oldukları tutarların bulunması halinde, bu meblağa isabet eden süreler faiz borcu dikkate alınmaksızın ilgililerin mecburi hizmet sürelerinden indirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu Kanun kapsamında yurt dışına gönderilen öğrenciler, yurt dışında resmî öğrenci olarak geçirmiş oldukları öğrenim sürelerinin 18 yaşının tamamlanmasından sonraki döneme ait olan kısmını, halen tâbi oldukları sosyal güvenlik kurumuna bu maddenin yürürlük tarihinden itibaren üç ay içinde müracaat etmeleri ve müracaat tarihi itibarıyla bulundukları görev ile derece ve kademe ya da basamak ya da prime esas kazanç tutarı üzerinden bu süreye ilişkin olarak hesaplanacak prim, kesenek, kurum karşılığı gibi toplam yükümlülük tutarını müracaatın kabul tarihinden itibaren oniki ayda eşit taksitler halinde ödemek suretiyle borçlanabilirler. Taksit ödeme dönemi sonunda borcunun tamamını ödemiş olduğu tespit olunanların borçlanmış oldukları bu süreler, emekliliğe tâbi toplam hizmet süresinin hesabında ve sigortalılık ya da iştirakçiliğin başlangıç tarihinin tespitinde dikkate alınır. Aylık taksitlerini zamanında ödemeyenlerin önceki aylara ilişkin olarak ödemiş oldukları tutarlar, süresi geçen son taksit tarihinden itibaren otuz gün içinde ilgililere iade olunur. Başvuru tarihi itibarıyla herhangi bir sosyal güvenlik kurumuna tâbi olmayanlardan, daha önce herhangi bir sosyal güvenlik kurumuna tâbi çalışması olanlar en son tâbi oldukları sosyal güvenlik kurumuna, daha önce herhangi bir sosyal güvenlik kurumuna tâbi çalışması olmayanlar ise Sosyal Güvenlik Kurumuna  müracaatta bulunurlar ve bunların borçlanacakları süreye ilişkin olarak ödeyecekleri toplam tutar, 8/5/1985 tarihli ve 3201 sayılı Yurt Dışında Bulunan Türk Vatandaşlarının Yurt Dışında Geçen Sürelerinin Sosyal Güvenlikleri Bakımından Değerlendirilmesi Hakkında Kanunun 4 üncü maddesi uyarınca Bakanlar Kurulu tarafından belirlenen günlük tutar esas alınarak tespit olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanun uyarınca mecburi hizmet karşılığı yurt dışına gönderilenlerden, bu maddenin yürürlüğe girdiği tarihten önce, borcunun tamamını ödemeden veya mecburi hizmetini tamamlamadan vefat edenlerin borç yükümlülükleri ortadan kalkar. Buna bağlı olarak, borçlunun kendisi, mirasçıları ve kefilleri hakkındaki her türlü borç yükümlülükleri ortadan kaldırılır ve her türlü borç takibi işlemlerine son verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>21 inci madde hükümlerinden, yurt dışına eğitim amacıyla gönderilenlerden öğrenimlerini tamamlayıp mecburi hizmet yükümlülüklerini ifa etmeye başlayanlar (bu yükümlülüklerini bitirenler dâhil) ile hâlen yurt dışında eğitimlerine devam edenler de yararlandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunla değiştirilen 3 üncü madde hükümleri, yurt dışına gönderilecek öğrencilerin seçimine yönelik olarak 2013 yılında gerçekleştirilen sınavlar hakkında da uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun 19 uncu maddesinin faiz borcunun hesaplanmasına ilişkin hükmü, halen öğrenimlerine devam eden öğrenciler hakkında da uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunun geçici 1 inci maddesinin birinci fıkrası kapsamına girmesine rağmen anılan maddede belirtilen sürelerde borçlarının yeniden hesaplanması için müracaat etmeyenler ile söz konusu madde yürürlüğe girdiği tarihten bu maddenin yayımlandığı tarihe kadar geçen süre içinde anılan maddede belirtilen nedenlerle haklarında borç takibi yapılanlar veya yapılması gerekenlerin, kendilerine döviz olarak yapılmış olan her türlü masrafa ilişkin borç tutarları, bu maddenin yayımlandığı tarihi izleyen üç ay içerisinde Millî Eğitim Bakanlığına başvurmaları hâlinde, imzaladıkları yüklenme senedi ile muteber imzalı müteselsil kefalet senedi hükümleri dikkate alınmaksızın ve ilgililere önceden ödedikleri faizlerin geri iade yapma sonucu doğurmaksızın bu maddenin üçüncü ve dördüncü fıkralarındaki şekilde yeniden hesaplanır ve başvuru süresi içinde tahsilat işlemi durdurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>5/8/1996 tarihinden sonra yüklenme senedi ile muteber imzalı müteselsil kefalet senedi alınanlar hakkında 657 sayılı Kanunun ek 34 üncü maddesinin ikinci fıkrası hükümlerine göre bu maddenin yürürlüğe girdiği tarihten önceki süreler için herhangi bir ferî alacak hesaplanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bunların daha önce ödemiş oldukları tutar ile mecburi hizmetlerinde değerlendirilen sürelere isabet eden tutar, yukarıdaki şekilde belirlenecek tutardan düşülür. Bu madde uyarınca vazgeçilen borç tutarına isabet eden vekâlet ücreti de dâhil yargılama giderleri tahsil edilmez. Hesaplanan borç tutarı, ilgilinin durumu ve ödenmesi gereken meblağ dikkate alınarak yüklenme senedi ile muteber imzalı müteselsil kefalet senedi alınması kaydıyla azami beş yıla kadar taksitlendirilebilir. Bu fıkra kapsamında düzenlenen yüklenme senedi ile muteber imzalı müteselsil kefalet senedi damga vergisi ve noter harcından müstesnadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Ancak terör örgütlerine veya   Devletin milli güvenliğine karşı faaliyette bulunduğuna karar verilen yapı, oluşum veya gruplara   iltisakı yahut bunlarla irtibatı olduğu gerekçesi ile öğrencilikle veya mecburi hizmetle yükümlü bulundukları süre içerisinde kadrolarıyla ilişiği kesilenler hakkında bu madde hükümleri uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
