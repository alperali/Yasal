  <mvz-künye tür="kanun" no="3218" başlık="SERBEST BÖLGELER KANUNU"
             tarih="6/6/1985" rgazete-tarih="15/6/1985" rgazete-sayı="18785"
             düstur-tertip="5" düstur-cilt="24" düstur-sayfa="469" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun; ihracata yönelik yatırım ve üretimi teşvik etmek, doğrudan yabancı yatırımları ve teknoloji girişini hızlandırmak, işletmeleri ihracata yönlendirmek ve uluslararası ticareti geliştirmek amacıyla serbest bölgelerin kurulması, yer ve sınırlarıyla faaliyet konularının belirlenmesi, yönetimi, işletilmesi, bölgelerdeki yapı ve tesislerin teşkili ile ilgili hususları kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Yetki">
      <mvz-fıkra no="1">
        <template>Türkiye'de serbest bölgelerin yer ve sınırlarını belirlemeye Cumhurbaşkanı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Serbest bölgelerin, kamu kurum ve kuruluşlarınca, yerli veya yabancı gerçek veya tüzelkişilerce kurulmasına, işletilmesine Cumhurbaşkanınca izin verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanun uygulamasında;</template>
        <mvz-bent no="a">
          <template>İşletici: Serbest bölgeyi işleten kamu kurum ve kuruluşunu, yerli ve yabancı gerçek veya tüzelkişileri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kullanıcı: Faaliyet ruhsatı alan ve bölgede belli bir işyeri bulunan gerçek veya tüzelkişiyi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Döviz: Türkiye Cumhuriyet Merkez Bankası tarafından konvertibl sayılan paralar veya ödemeyi sağlayan her nevi hesap ve belgeleri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Faaliyet konuları ve koordinasyon">
      <mvz-fıkra no="1">
        <template>Serbest bölgelerde, Yüksek Planlama Kurulunca uygun görülecek her türlü sınai, ticari ve hizmetle ilgili faaliyetler yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üretici işletmelerin talepleri hariç olmak üzere, fiyat, kalite ve standartlarla ilgili olarak kamu kurum ve kuruluşlarına kanunlarla ve diğer mevzuatla verilen yetkiler serbest bölgelerde uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Serbest bölgelerde yapılan faaliyetleri değerlendirmek, bu bölgelerin geliştirilmesine ve sorunların çözümüne ilişkin stratejileri belirlemek ve önerilerde bulunmak üzere Serbest Bölgeler Koordinasyon Kurulu oluşturulmuştur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Serbest Bölgenin Düzenlenmesi">
    <mvz-madde no="5" başlık="Bölgenin düzenlenme esasları">
      <mvz-fıkra no="1">
        <template>Serbest bölge ilan edilen yerlerde ihtiyaç duyulacak arazi ve tesisler Kamulaştırma Kanunu hükümlerine göre sağlanabilir.  Cumhurbaşkanı bu arazi ve tesislerin acele kamulaştırılmasını kararlaştırabilir. Arazi ve tesislerin kamulaştırılmasında kamulaştırma bedelleri ile kamulaştırma işlemlerinin gerektirdiği diğer giderlerin, kamulaştırma talebinde bulunan işletici tarafından karşılanması Cumhurbaşkanınca kararlaştırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yerli veya yabancı gerçek veya tüzel kişiler Ekonomi Bakanlığından ruhsat almak kaydıyla serbest bölgelerde faaliyette bulunabilirler. Serbest bölgelerde faaliyette bulunan yatırımcı kullanıcılara Hazinenin özel mülkiyetinde bulunan arazi, arsa ve binalar kiralanabilir veya bunlar üzerinde 49 yıla kadar irtifak hakkı tesis edilebilir.    Devletin hüküm ve tasarrufu altındaki yerler ile bunlar üzerinde bulunan bina ve tesisler kiralanabilir veya aynı süre ile kullanma izni verilebilir. Türk Silahlı Kuvvetlerinin kullanımına tahsis edilen arazi ve binalar için Milli Savunma Bakanlığının görüşü alınır. Arazisi özel mülkiyete ait serbest bölgelerde kullanıcı niteliğini haiz olmayan mülk sahipleri, aidat ve benzeri bölge katılım bedelleri bakımından kullanıcılarla aynı mali yükümlülüklere tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Serbest bölgede arazinin kullanımı, yapı ve tesislerin projelendirilmesi, kurulması ve kullanılmasıyla ilgili diğer bütün izinler ve ruhsatlar bölge müdürlüğünce verilir ve denetlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Serbest bölgelerin asayiş hizmetleri polis tarafından yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Muafiyet ve teşvikler">
      <mvz-fıkra no="1">
        <template>Serbest bölgeler, Türkiye Gümrük Bölgesinin parçaları olmakla beraber; yer ve sınırları Cumhurbaşkanınca belirlenmiş, serbest dolaşımda olmayan eşyanın herhangi bir gümrük rejimine tabi tutulmaksızın ve serbest dolaşıma sokulmaksızın, gümrük mevzuatında öngörülen haller dışında kullanılmamak ya da tüketilmemek kaydıyla konulduğu, ithalat vergileri ile ticaret politikası önlemlerinin ve kambiyo mevzuatının uygulanması bakımından Türkiye Gümrük Bölgesi dışında olduğu kabul edilen ve serbest dolaşımdaki eşyanın bir serbest bölgeye konulması nedeniyle normal olarak eşyanın ihracına bağlı olanaklardan yararlandığı yerlerdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu bölgelerde gümrük ve kambiyo mükellefiyetine dair mevzuat hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kullanıcıların tutmak zorunda oldukları defterler ile düzenleyecekleri belgelere ilişkin olarak, 4.1.1961 tarihli ve 213 sayılı Vergi Usul Kanununun hükümlerine bağımlı olmaksızın düzenleme yapmaya Maliye Bakanlığı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanun kapsamında kazançları gelir veya kurumlar vergisinden istisna tutulan kullanıcılar ve işleticiler, yatırım ve üretim safhalarında Cumhurbaşkanınca belirlenecek vergi dışı teşviklerden yararlandırılır. Bu Kanun kapsamında kazançları gelir veya kurumlar vergisinden istisna tutulmayan kullanıcılar, yatırım ve işletme safhalarında bu Kanun kapsamında yararlanılmayan vergi ve vergi dışı teşviklerden ilgili mevzuat hükümleri çerçevesinde yararlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Serbest bölgelerin gelir ve harcamaları">
      <mvz-fıkra no="1">
        <template>Serbest bölgelerden elde edilen gelirlerden;</template>
        <mvz-bent no="a">
          <template>Faaliyet ruhsatı ve izin belgesi karşılığı tahsil edilecek ücretler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yurt dışından bölgeye getirilen malların CIF değeri üzerinden binde 1 ve bölgeden Türkiye’ye çıkarılan malların FOB değeri üzerinden binde 9 oranında, peşin olarak ödenecek ücretler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Serbest bölgeyi işleten gerçek veya tüzel kişilerle yapılacak sözleşmeler uyarınca tahsil edilecek tutarlar,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bölge faaliyetlerinden sağlanan diğer gelirler,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İlgili idare tarafından sözleşmeler gereği tüzel kişilere yapılan gelir payı aktarmaları düşüldükten sonra Türkiye Cumhuriyet Merkez Bankası nezdinde açılacak bir özel hesaba yatırılır. Bu hesapta toplanan tutarlardan ret ve iadeler düşüldükten sonra kalan tutar, Ekonomi Bakanlığı merkez ödemelerini yapan merkez saymanlığı hesabına yatırılır. Merkez saymanlık hesabına yatırılan meblağ bütçeye gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Serbest bölgelerde yatırım ve tesis safhasında kullanılan mallar, tevsi ve kapasite artırmak amacıyla getirilen mallar, kullanıcının kendisine ait olmayan bakım ve onarım maksadıyla getirilen mallar, bölgelere geçici olarak getirilen araç, gereç ve ekipmanlar, fason üretim amacıyla getirilen mallar, 6/2/2004 tarihinden sonra faaliyet ruhsatı alanlardan imalatçı kullanıcıların dışındaki kullanıcılar tarafından yurt dışından bölgeye getirilen ve/veya bölgeden Türkiye'ye çıkarılan mallar birinci fıkranın (b) bendi hükmü uyarınca bir ücrete tâbi tutulmaz. Ancak, bakım ve onarım ile fason üretimde yaratılan katma değer üzerinden ve 6/2/2004 tarihinden sonra faaliyet ruhsatı alanlardan imalatçı kullanıcıların dışındaki kullanıcılar tarafından yurt dışından getirilerek bölge içinde satılan mallardan bu ücret alınır.  Ücrete tabi olarak yurt dışından getirilen mallar ile imalatçı kullanıcılar tarafından üretilen malların, bölge içinde satılması ve sonrasında Türkiye’ye çıkarılması hallerinde birinci fıkranın (b) bendi hükmü uyarınca ücret alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Cumhurbaşkanı stratejik, büyük ölçekli veya öncelikli yatırımlar ile konusu, sektörü ve niteliği itibarıyla proje bazında desteklenmesine karar verilen yatırımlara yönelik olarak bu maddede yer alan oranları bölge, sektör, faaliyet alanı veya yatırım türü itibarıyla sıfıra kadar indirmeye, farklılaştırmaya veya kanuni seviyesine kadar artırmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Türkiye Cumhuriyet Merkez Bankası nezdinde oluşturulan özel hesabın işleyişine ilişkin usul ve esaslar Maliye Bakanlığının uygun görüşü üzerine Ekonomi Bakanlığınca çıkarılacak yönetmelikle belirlenir. Gelirlerin zamanında yatırılmaması halinde 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Mal ve Hizmetler">
    <mvz-madde no="8" başlık="Bölgedeki mallar">
      <mvz-fıkra no="1">
        <template>Serbest bölge ile Türkiye'nin diğer yerleri arasında yapılacak ticaret, dış ticaret rejimine tabidir. Serbest bölge ile diğer ülkeler ve serbest bölgeler arasında dış ticaret rejimi uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Serbest bölgelerde faaliyette bulunan işletmelerde yatırım amaçlı olarak kullanılan makine ve ekipmanın bakım onarım ihtiyaçlarının Türkiye’nin diğer yerlerinde karşılanması, bölge faaliyetleri sonucu ortaya çıkan atık ve hurdaların Türkiye’ye çıkarılması, Türkiye’nin diğer yerlerinde yapılacak film çekim faaliyetlerinde kullanılacak araç-gereç ve ekipmanın bölgeden geçici çıkışı ve benzeri özellik arz eden durumlarda vergi mükellefiyetine ilişkin hükümler hariç olmak üzere, iş ve işlemlerin basitleştirilmesine ilişkin usul ve esaslar Ekonomi Bakanlığı ile Gümrük ve Ticaret Bakanlığınca müştereken belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bedeli 5000 ABD doları veya karşılığı Türk Lirasını geçmeyen Türkiye mahreçli mallar, isteğe bağlı olarak ihracat işlemine tabi tutulmayabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Kambiyo ve hizmetler">
      <mvz-fıkra no="1">
        <template>Serbest bölgelerdeki faaliyetlerle ilgili her türlü ödemeler dövizle yapılır. Cumhurbaşkanı ödemelerin Türk Lirası olarak yapılmasına da karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Serbest bölgede gemi ve liman hizmetleri işletici tarafından yapılır veya kamu kurum ve kuruluşlarına, gerçek veya tüzelkişilere yaptırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Serbest bölgelerde, kullanıcıların ihtiyacı olan doğal gaz altyapısını kurmak ve işletmek, kamu kuruluşları ve özel kuruluşlardan doğal gazı satın alarak bölge içinde dağıtım ve satışını yapmak, işleticinin yetki ve sorumluluğundadır. İşleticinin izni olmaksızın doğal gaz ihtiyacı başka bir yerden karşılanamaz ve bu amaçla münferiden tesis kurulamaz. Bu fıkranın uygulanmasına ilişkin usul ve esaslar ile bölge içi doğal gaz dağıtım ve satışı nedeniyle kullanıcılardan tahsil edilecek bedele ilişkin üst limit Ticaret Bakanlığı tarafından yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşleticinin talebi ve bölgede faaliyet gösteren doğal gaz dağıtım şirketinin kabulü halinde, doğal gaz dağıtım şirketleri serbest bölgeler içinde şebeke yatırımı yaparak veya yapılmış şebekeyi mülkiyeti ile birlikte devralarak Enerji Piyasası Düzenleme Kurulu tarafından belirlenen koşullar çerçevesinde serbest bölge içinde doğal gaz dağıtım faaliyeti gerçekleştirebilir. Doğal gaza ilişkin faaliyetlerin işletici tarafından yürütüldüğü serbest bölgelerde, doğal gaz iletim ve dağıtım lisansı sahibi şirketlerin herhangi bir hak, yetki veya sorumluluğu bulunmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Çalışma ve Sosyal Güvenlik, Kaldırılan ve Uygulanmayan Hükümler, Yönetmelik">
    <mvz-madde no="10" başlık="Çalışma ve sosyal güvenlik esasları">
      <mvz-fıkra no="1">
        <template>Serbest bölgelerde, faaliyet gösterecek işyerlerinde yabancı uyruklu yönetici ve vasıflı personel çalıştırılabilir. Buna ait esaslar yönetmelikte belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Serbest bölgelerde Türkiye Cumhuriyeti sosyal güvenlik mevzuatı hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>21 Aralık 1953 tarihli ve 6209 sayılı Serbest Bölge Kanunu yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Uygulanmayan hükümler">
      <mvz-fıkra no="1">
        <template>Serbest bölgelerde  4875 sayılı Doğrudan Yabancı Yatırımlar Kanunu, 5393 sayılı Belediye Kanununun ölüm ve yangın halleri, kanalizasyonların inşa ve tamiri ile içme, kullanma, endüstri suyunu sağlamaya ve gaz, su, elektrik sarfiyatını denetlemeye yönelik maddeleri dışında kalan hükümleri, 5682 sayılı Pasaport Kanunu, 5683 sayılı Yabancıların Türkiye'de İkamet ve Seyahatleri Hakkında Kanun ile diğer kanunların bu Kanuna aykırı hükümleri uygulanmaz. Ayrıca, 5 inci maddenin ikinci fıkrasında belirtilen işlemler, 2886 sayılı Devlet İhale Kanunu hükümlerine tabi değildir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Uygulama yönetmeliği">
      <mvz-fıkra no="1">
        <template>Bu Kanunda düzenlenmesi yönetmeliğe bırakılan konularla, serbest bölgelerde faaliyette bulunacak işleticilerin teşekkül tarzı, görev, yetki ve sorumlulukları, bu işleticilere ve kullanıcılara verilecek, faaliyet ruhsatları ve iptali, bunların sınai ve ticari sicillerinin tutulması, hesaba yapacakları ödemeler, serbest bölge ile ilgili faaliyetlerin tabi olacağı esaslar, bölgelere giriş için verilecek izin belgesi ile görev kartları, ikamet izni ve çalışma esasları ve serbest bölgelerin işletilmesine dair diğer hususlar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="İşletme sözleşmelerinin yenilenmesi, değiştirilmesi ve süre uzatımı" tür="Ek">
      <mvz-fıkra no="1">
        <template>İşletme sözleşmesinin sona ermesinden önce, işletici tarafından işletme sözleşmesinde belirtilen taahhütlerin yerine getirilmiş olması ve Ekonomi Bakanlığının geleceğe yönelik yatırım taleplerinin kabul edilmesi halinde; 7 nci maddenin birinci fıkrasının (c) bendi kapsamındaki gelirlerin artırılması veya Ekonomi Bakanlığının mali yükümlülüklerinin azaltılması bakımından mevcut sözleşmelerdeki hükümler yeniden düzenlenmek suretiyle, sözleşme süresi Ekonomi Bakanlığınca belirlenen süreler itibarıyla uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada yer alan şartların sağlanamaması veya sair nedenlerle işletme sözleşmesi sona erecek serbest bölgelerde, işletme izninin 49 yılı geçmemek üzere yeniden verilmesine ilişkin iş ve işlemlerde Ekonomi Bakanlığınca 24/11/1994 tarihli ve 4046 sayılı Özelleştirme Uygulamaları Hakkında Kanunda düzenlenen usul ve esaslar kıyas yoluyla uygulanır. Bu usule göre belirlenecek kamu kurum veya kuruluşları ile yerli veya yabancı gerçek veya tüzel kişilere, Cumhurbaşkanı kararı ile işletme izni verilebilir. Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkra kapsamında yürütülen çalışmalar tamamlanıncaya kadar geçecek sürede iş ve işlemler Bakanlık tarafından yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Yurt dışında bölgeler kurulması" tür="Ek">
      <mvz-fıkra no="1">
        <template>3/6/2011 tarihli ve 637 sayılı Ekonomi Bakanlığının Teşkilat ve Görevleri Hakkında Kanun Hükmünde Kararnamenin 12 nci maddesinde yer alan serbest bölgeler, özel bölgeler, dış ticaret merkezleri ve lojistik merkezlerin yurt dışında kurulacağı ülkeleri belirlemeye Cumhurbaşkanı yetkilidir. Bu bölgelerin, Türkiye’de yerleşik bir şirket eliyle kurulmasına ve işletilmesine Cumhurbaşkanınca izin verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen bölgelerin kurulmasına, işletilmesine ve tasfiyesine ilişkin usul ve esasları belirlemeye Cumhurbaşkanı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yurt dışında kurulan bölgelere Türkiye’de yerleşik şirketlerce yapılacak yatırımlara yönelik devlet yardımlarını belirlemeye Cumhurbaşkanı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Mevzuatta Serbest Bölgeler Koordinasyon Kuruluna yapılmış olan atıflar, Cumhurbaşkanınca belirlenen kurul veya mercie yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten sonra geçici 2 nci madde uyarınca ilk kez faaliyete geçecek serbest bölgelerde, işleticilerin serbest bölgelerin işletilmesi ile ilgili faaliyetlerden elde ettikleri kazançları, 30 yılı geçmemek ve Ticaret Bakanlığınca kendilerine verilecek ilk faaliyet ruhsatında belirtilen süre ile sınırlı olmak üzere gelir veya kurumlar vergisinden müstesnadır. Bu istisna, münhasıran alım satım veya depo işletmeciliği faaliyet ruhsatı sahibi kullanıcılardan elde edilen kazançlar ile 31/12/1960 tarihli ve 193 sayılı Gelir Vergisi Kanunu ile 13/6/2006 tarihli ve 5520 sayılı Kurumlar Vergisi Kanunu uyarınca yapılacak vergi kesintilerini kapsamaz. Bu maddenin uygulanmasına ilişkin usul ve esasları belirlemeye Hazine ve Maliye Bakanlığı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Üstyapıların tahliyesi ve malların tasfiyesi" tür="Ek">
      <mvz-fıkra no="1">
        <template>Arazisi Hazinenin özel mülkiyetinde bulunan serbest bölgelerde, faaliyet ruhsatı iptal edilen kiracı kullanıcılar ile üstyapının bağlı olduğu faaliyet ruhsatı iptal edilen yatırımcı kullanıcılara, üstyapıda bulunan mallarının tahliyesi için bir aydan az altı aydan fazla olmamak üzere süre verilir. Bu sürenin sonunda kullanıcıya ait olup üstyapıdan çıkarılmayan mallar üzerinde kullanıcının her türlü tasarruf yetkisi kalkar ve bu mallar serbest bölge müdürünün başkanlığında oluşturulacak bir komisyon marifetiyle sayım ve tespit yapılarak tutanağa bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2" durum="iptal">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Komisyon tarafından tutanağa bağlanan mallar, 27/10/1999 tarihli ve 4458 sayılı Gümrük Kanunu hükümlerine göre tasfiye edilmek üzere ilgili idareye teslim edilir. Bu malların satış bedeli ile ilgili olarak 4458 sayılı Kanunun 180 inci maddesinin birinci fıkrası hükümleri uygulanmaz. Bu malların satış bedelinden gümrük vergileri, hizmet karşılığı alacaklar ve yapılmış masraflar, satış için yapılmış masraflar ayrılarak bakiye bedel hak sahiplerine dağıtılmak üzere ilgili birimlere gönderilir ve varsa artan para kullanıcı adına emanet hesabına alınır. Emanete alınan para talep edilmesi halinde kullanıcıya ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde hükümleri, arazisi Hazinenin özel mülkiyetinde bulunan serbest bölgelerde; faaliyet ruhsatının süresi sona eren kiracı kullanıcılar ile üstyapının bağlı olduğu faaliyet ruhsatının süresi sona eren yatırımcı kullanıcılar için de uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici" durum="mülga">
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun bir serbest bölge için, o serbest bölgenin faaliyete geçmesinden itibaren uygulanır. Faaliyete geçiş tarihi ise, o serbest bölge alanını çevreleyen çit, kule ve kapı inşaatlarının tamamlanması ve bölge müdürlüğü, polis ve gümrük birimlerinin göreve başlaması suretiyle bölgenin resmen açılış tarihidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarih itibarıyla bu Kanuna göre kurulan serbest bölgelerde faaliyette bulunmak üzere ruhsat almış mükelleflerin;</template>
        <mvz-bent no="a">
          <template>Bu bölgelerde gerçekleştirdikleri faaliyetleri dolayısıyla elde ettikleri kazançları, bu maddenin yürürlüğe girdiği tarih itibarıyla faaliyet ruhsatlarında belirtilen süre ile sınırlı olmak üzere gelir veya kurumlar vergisinden müstesnadır. Bu istisnanın 31.12.1960 tarihli ve 193 sayılı Gelir Vergisi Kanununun 94 üncü maddesinin birinci fıkrasının (6) numaralı bendinin (b) alt bendi kapsamında yapılacak tevkifata etkisi yoktur.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu bölgelerde istihdam ettikleri personele ödedikleri ücretler 31.12.2008 tarihine kadar gelir vergisinden müstesnadır. Ancak, bu maddenin yürürlüğe girdiği tarih itibarıyla ruhsatlarında belirtilen süre 31.12.2008 tarihinden daha önceki bir tarihte sona eriyorsa, istisna uygulamasında ruhsatta yer alan sürenin bitiş tarihi dikkate alınır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu bölgelerde gerçekleştirdikleri faaliyetleri ile ilgili olarak yaptıkları işlemler 31.12.2008 tarihine kadar her türlü vergi, resim ve harçtan müstesnadır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Avrupa Birliğine tam üyeliğin gerçekleştiği tarihi içeren yılın vergilendirme döneminin sonuna kadar;</template>
        <mvz-bent no="a">
          <template>Serbest bölgelerde üretim faaliyetinde bulunan mükelleflerin bu bölgelerde imal ettikleri ürünlerin yurt dışına, serbest bölge içine veya diğer serbest bölgelere satışından elde ettikleri kazançları ile serbest bölgelerde, bakım, onarım, montaj, demontaj, elleçleme, ayrıştırma, ambalajlama, etiketleme, test etme, depolama hizmeti alanlarında faaliyette bulunan ve hizmetin tamamını Türkiye’de yerleşmiş olmayan kişilerle, işyeri, kanuni ve iş merkezi yurt dışında bulunanlara veren hizmet işletmelerinin, söz konusu hizmetlere konu malların serbest bölgelerden Türkiye’ye herhangi bir şekilde girişi olmaksızın yabancı bir ülkeye gönderilmesi şartıyla bu hizmetlerden elde ettikleri kazançları gelir veya kurumlar vergisinden müstesnadır. Bu istisnanın 193 sayılı Gelir Vergisi Kanununun 94 üncü maddesinin birinci fıkrasının (6) numaralı bendinin (b) alt bendi ile 5520 sayılı Kurumlar Vergisi Kanununun 15 inci ve 30 uncu maddeleri uyarınca yapılacak tevkifata etkisi yoktur.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu bölgelerde üretilen ürünlerin FOB bedelinin en az %85’ini yurt dışına ihraç eden mükelleflerin istihdam ettikleri personele ödedikleri ücretler üzerinden asgari geçim indirimi uygulandıktan sonra hesaplanan gelir vergisi, verilecek muhtasar beyanname üzerinden tahakkuk eden vergiden indirilmek suretiyle terkin edilir. Bu oranı %50’ye kadar indirmeye ve kanuni seviyesine kadar yükseltmeye Cumhurbaşkanı yetkilidir. Cumhurbaşkanı bu yetkiyi, stratejik, büyük ölçekli veya öncelikli yatırımlar ile konusu, sektörü ve niteliği itibarıyla proje bazında desteklenmesine karar verilen yatırımlara yönelik olarak, bölge, sektör ya da faaliyet alanı itibarıyla farklılaştırarak veya kademelendirerek kullanabilir. Yıllık satış tutarı bu oranın altında kalan mükelleflerden zamanında tahsil edilmeyen vergiler cezasız olarak, gecikme zammıyla birlikte tahsil edilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu bölgelerde gerçekleştirilen faaliyetlerle ilgili olarak yapılan işlemler ve düzenlenen kağıtlar damga vergisi ve harçlardan müstesnadır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esasları belirlemeye Maliye Bakanlığı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici" durum="mülga">
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce serbest bölgelerde faaliyet ruhsatı almış olan kullanıcılara kiralanan arazi, arsa ve binalardan Hazinenin mülkiyetinde bulunanların ruhsat ve kira süresi, Ekonomi Bakanlığınca 49 yıla kadar uzatılabilir. Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Serbest bölgeler, Avrupa Birliğine tam üyeliğin gerçekleştiği tarihe kadar, gümrük rejimleri açısından Türkiye Gümrük Bölgesi dışında, menşe hükümlerinin uygulanması bakımından ise Türkiye Gümrük Bölgesi sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce bölge içi doğal gaz şebekesi yatırımı işleticilerce yapılmış olan serbest bölgelerde, işleticilerin bölge içi doğal gaz dağıtım ve satış faaliyetleri, 9 uncu maddenin üçüncü fıkrasına uygun olarak devam eder. Bu maddenin yürürlüğe girdiği tarihten önce bölge içi doğal gaz şebekesi yatırımı doğal gaz dağıtım şirketlerince yapılmış olan serbest bölgelerde, işleticilerin bölge içi doğal gaz dağıtım ve satış yetkisi doğal gaz dağıtım şirketlerine devredilmiş sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
