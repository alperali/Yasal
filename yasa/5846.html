      <mvz-b2 no="II" başlık="Haklara tecavüzün önlenmesi">
        <mvz-madde no="81" başlık="">
          <mvz-fıkra no="1">
            <template>Musiki ve sinema eserlerinin çoğaltılmış nüshaları ile süreli olmayan yayınlara bandrol yapıştırılması zorunludur. Ayrıca, kolay kopyalanmaya müsait diğer eserlerin çoğaltılmış nüshalarına da eser veya hak sahibinin talebi üzerine bandrol yapıştırılması zorunludur. Bandroller, Bakanlıkça bastırılır ve satılır. Bakanlıkça belirlenen satış fiyatı üzerinden meslek birlikleri aracılığı ile de bandrol satışı yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bandrol alınabilmesi için, bandrol talebinde bulunanın yasal hak sahibi olduğunu beyan eden bir taahhütnameyi doldurması zorunludur. Bakanlıkça tespit edilen diğer evrak ve belgelerle birlikte başvuru yapılır. Bakanlık, bu başvuru üzerine başka bir işleme gerek kalmaksızın on iş günü içinde bandrol vermek mecburiyetindedir. Beyana müstenit yapılan bu işlemlerden Bakanlık sorumlu tutulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bandrol yapıştırılması zorunlu nüshaların tespit edilmesi ve çoğaltılmasına ilişkin materyalleri üreten veya bu materyallerin dolum ve çoğaltımını yapan yerler, bu maddede belirtilen taahhütnamenin bir kopyasını almak, saklamak ve istendiğinde yetkili makamlara ibraz etmekle yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bandrol yükümlülüğüne aykırı ya da bandrolsüz olarak bir eseri çoğaltıp satışa arz eden, satan, dağıtan veya ticarî amaçla satın alan ya da kabul eden kişi bir yıldan beş yıla kadar hapis ve beşbin güne kadar adlî para cezasıyla cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bakanlık ile mülkî idare amirleri bandrollenmesi zorunlu olan nüshaların ve süreli olmayan yayınların, bandrollü olup olmadıklarını her zaman denetleyebilir. Gerekli görüldüğünde, mülkî idare amirleri re’sen veya Bakanlığın talebi ile bu denetimi gerçekleştirmek üzere illerde denetim komisyonu oluşturabilir. İhtiyaç hâlinde, bu komisyonlarda Bakanlık ve ilgili alan meslek birlikleri temsilcileri de görev alabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu denetimler sırasında bu Kanunda koruma altına alınan hakların ihlal edildiğinin tespiti hâlinde 75 inci maddenin üçüncü fıkrası uyarınca işlem yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu Kanun kapsamında korunan, yasal olarak çoğaltılmış, bandrollü nüshaların da yol, meydan, pazar, kaldırım, iskele, köprü ve benzeri yerlerde satışı yasaktır. Bu yasağa aykırı hareket edenler, Kabahatler Kanununun 38 inci maddesinin birinci fıkrasına göre cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Bu maddede belirtilen hususların uygulanmasına ilişkin usul ve esaslar Bakanlık tarafından çıkarılacak bir yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Sahte bandrol üreten, satışa arz eden, satan, dağıtan, satın alan, kabul eden veya kullanan kişi üç yıldan yedi yıla kadar hapis ve beşbin güne kadar adlî para cezasıyla cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Bir eserle ilgili olarak usulüne uygun biçimde temin edilmiş bandrolleri başka bir eser üzerinde tatbik eden kişi, bir yıldan beş yıla kadar hapis ve binbeşyüz güne kadar adlî para cezasıyla cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>Yetkisi olmadığı hâlde, hileli davranışlarla bandrol temin eden kişi bir yıldan üç yıla kadar hapis cezasıyla cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="12">
            <template>Yetkisi olmayan kişilere bandrol temin eden kişi iki yıldan beş yıla kadar hapis ve beşbin güne kadar adlî para cezasıyla cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="13" durum="iptal">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="14">
            <template>Bu Kanunda tanımlanan suçların bir tüzel kişinin faaliyeti çerçevesinde işlenmesi hâlinde, ilgili tüzel kişi hakkında Türk Ceza Kanununun tüzel kişilere özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>

            <template>Bu Kanunun radyo-televizyon yayınlarıyla ilgili hükümleri;</template>
            <mvz-bent no="1.">
              <template>Merkezleri Türkiye Cumhuriyeti sınırları içinde olan veya,</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Türkiye Cumhuriyeti sınırları içindeki yansıtıcı ile yayınlanan,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Radyo-televizyon programlarına uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu Kanunun  bağlantılı haklarla ilgili hükümleri, Türkiye Cumhuriyetinin taraf olduğu bir uluslararası andlaşma hükümlerine göre korunan icracı sanatçılara, yapımcılara ve radyo-televizyon kuruluşlarına da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İcracı sanatçıların hakları, icranın tesbitinin yapıldığı tarihten başlayarak, yetmiş yıl devam eder. İcra tespit edilmemiş ise bu süre, icranın ilk aleniyet kazanmasıyla başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Yapımcıların hakları, ilk tespitin yapıldığı tarihten başlayarak yetmiş yıl devam eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Radyo-televizyon kuruluşlarının hakları, programın ilk yayınlandığı tarihten başlayarak 70 yıl devam eder.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Haksız rekabet">
      <mvz-b2 no="I" başlık="Ad ve alametler">
        <mvz-madde no="83" başlık="">
          <mvz-fıkra no="1">
            <template>Bir eserin ad ve alametleri ile çoğaltılmış nüshaların şekilleri, iltibasa meydan verebilecek surette diğer bir eserde veya çoğaltılmış nüshalarında kullanılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>1 inci fıkra hükmü umumen kullanılan ve ayırt edici bir vasfı bulunmıyan ad, alamet ve dış şekiller hakkında uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddenin uygulanması kanunun 1 inci, 2 nci ve 3 üncü bölümlerindeki şartların tahakkukuna bağlı değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Basın Kanununun 14 üncü maddesinin mevkute adları hakkındaki hükmü mahfuzdur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Tecavüz eden tacir olmasa bile, birinci fıkra hükmüne aykırı hareket edenler hakkında haksız rekabete mütaallik hükümler uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="İşaret, resim ve ses">
        <mvz-madde no="84" başlık="">
          <mvz-fıkra no="1">
            <template>Bir işareti, resim veya sesi, bunları nakle yarıyan bir alet üzerine tesbit eden veya ticari maksatlarla haklı olarak çoğaltan yahut yayan kimse, aynı işaretin, resmin veya sesin 3 üncü bir kişi tarafından aynı vasıtadan faydalanılmak suretiyle çoğaltılmasını veya yayımlanmasını menedebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tevacüz eden tacir olmasa bile birinci fıkra hükmüne aykırı hareket edenler hakkında haksız rekabete mütaallik hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Eser mahiyetinde olmıyan her nevi fotoğraflar, benzer usullerle tesbit edilen resimler ve sinema mahsulleri hakkında da bu madde hükmü uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Mektuplar">
      <mvz-madde no="85" başlık="">
        <mvz-fıkra no="1">
          <template>Eser mahiyetinde olmasa bile, mektup, hatıra ve buna benzer yazılar yazanların ve bunlar ölmüş ise 19 uncu maddenin birinci fıkrasında yazılı kimselerin muvafakati olmadan yayınlanamaz. Meğer ki, yazanın ölümünden itibaren on yıl geçmiş bulunsun.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mektuplar birinci fıkradaki şartlardan başka muhatap veya muhatap ölmüş ise 19 uncu maddenin birinci fıkrasında yazılı kimselerin muvafakati olmadan yayımlanamaz; meğer ki, muhatabın ölümünden itibaren 10 yıl geçmiş bulunsun.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yukarıdaki hükümlere aykırı hareket edenler hakkında Borçlar Kanununun 49 uncu maddesi ve Türk Ceza Kanununun 132, 134, 139 ve 140 ıncı maddeleri hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birinci ve ikinci fıkra hükümlerine göre yayımın caiz olduğu hâllerde de 4721 sayılı Türk Medenî Kanununun 24 üncü maddesi hükmü saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Resim ve portreler">
      <mvz-b2 no="I" başlık="Genel olarak">
        <mvz-madde no="86" başlık="">
          <mvz-fıkra no="1">
            <template>Eser mahiyetinde olmasalar bile, resim ve portreler tasvir edilenin, tasvir edilen ölmüşse 19 uncu maddenin birinci fıkrasında sayılanların muvafakati olmadan tasvir edilenin ölümünden 10 yıl geçmedikçe, teşhir veya diğer suretlerle umuma arzedilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkradaki muvafakatin alınması:</template>
            <mvz-bent no="1.">
              <template>Memleketin siyasi ve içtimai hayatında rol oynıyan kimselerin resimleri;</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Tasvir edilen kimselerin iştirak ettiği geçit resmi veya resmi tören yahut genel toplantıları gösteren resimler;</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Günlük hadiselere mütaallik resimlerle radyo ve filim haberleri;</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>için şart değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci fıkra hükmüne aykırı hareket edenler hakkında Borçlar Kanununun 49 uncu maddesi ile koşulları varsa, Türk Ceza Kanununun 134, 139 ve 140 ıncı maddeleri hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birinci ve ikinci fıkra hükümlerine göre yayımın caiz olduğu hâllerde de Türk Medenî Kanununun 24 üncü maddesi hükmü saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="İstisnalar">
        <mvz-madde no="87" başlık="">
          <mvz-fıkra no="1">
            <template>Aksi kararlaştırılmamış ise, bir kimsenin sipariş üzerine yapılan resim veya portresinden, sipariş veren veya tasvir edilen ve yahut bunların mirasçıları fotoğraf aldırtabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hüküm baskı usulü ile yapılan portre ve resimler hakkında cari değildir. Şu kadar ki, bu suretle vücuda getirilen resim ve portrelerin birinci fıkrada sayılanlar için tedariki mümkün olmaz veya nispeten büyük güçlüğü mucip olursa bunların da fotoğrafları aldırılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="E" başlık="Kanunlar ihtilafı">
      <mvz-madde no="88" başlık="" durum="mülga">
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanuna göre çıkarılacak yönetmelikler Resmi Gazetede yayımlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunla sağlanan koruma, bu madde ile getirilen değişikliğin yürürlüğe girdiği sırada;</template>
          <mvz-bent no="a">
            <template>1. T.C. vatandaşı eser sahipleri ve eser sahiplerinin hakları ile bağlantılı hak sahipleri tarafından üretilmiş Türkiye’de mevcut bütün eserlere, tespit edilmiş icralara ve fonogramlara.</template>
          </mvz-bent>
          <mvz-bent no="a">
            <template>2. Türkiye’nin taraf olduğu uluslararası sözleşmelere ve anlaşmalara taraf diğer ülkelerde üretilmiş ve bu ülkelerde koruma süresi dolmadığı için kamuya mal olmamış yabancı eserlere, tespit edilmiş icralara ve fonogramlara.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkranın uygulanması sonucu koruma kapsamına alınan eserlerin, tespit edilmiş icraların ve fonogramların yasal kopyalarının mülkiyetini elinde bulunduran kişiler, bu Kanunun yürürlüğe girdiği tarihi takip eden altı aylık sürenin sonuna kadar yazılı bir izne gerek kalmaksızın bu kopyaları satabilir veya elden çıkarabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bununla birlikte, eserler, tespit edilmiş icralar ve fonogramlara ilişkin olmak üzere bu Kanun çerçevesinde eser sahipleri ve diğer hak sahiplerine sağlanan hakların kullanılması eser veya bağlantılı hak sahiplerinin iznine tabidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunun sinema eseri sahipliği ile ilgili hükümleri, 4110 sayılı Kanunun yürürlüğe girdiği 12/6/1995 tarihinden sonra yapımına başlanan sinema eserlerine uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Komşu Haklara ilişkin uygulamalar hakkındaki esaslar, Kanunun yürürlüğe girdiği tarihten itibaren 6 ay içerisinde çıkarılacak yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Eser ve eser sahibi ile eser üzerindeki haklardan herhangi birinin sahibi veya eserin kullanımına ilişkin süreler ve şartlar ile ilgili olarak eser nüshaları üzerinde bulunan veya eserin topluma sunulması sırasında görülen bilgiler ve bu bilgileri temsil eden sayılar veya kodlar yetkisiz olarak ortadan kaldırılamaz ve değiştirilemez. Bilgileri ve bilgileri temsil eden sayıları ve kodları yetkisiz olarak değiştirilen veya ortadan kaldırılan eserlerin asılları veya kopyaları dağıtılamaz, dağıtılmak üzere ithal edilemez, yayınlanamaz veya topluma iletilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıdaki fıkra hükümleri fonogramlar ve fonogramlarda tespit edilmiş icralar bakımından da uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Dijital iletim de dahil olmak üzere işaret, ses ve/veya görüntü nakline yarayan araçlarla servis ve bilgi içerik sağlayıcılar tarafından eser sahipleri ile bağlantılı hak sahiplerinin bu Kanunda tanınmış haklarının ihlâli halinde, hak sahiplerinin başvuruları üzerine ihlâle konu eserler içerikten çıkarılır. Bunun için hakları haleldar olan gerçek veya tüzel kişi öncelikle bilgi içerik sağlayıcısına başvurarak üç gün içinde ihlâlin durdurulmasını ister. İhlâlin devamı halinde bu defa, Cumhuriyet savcısına yapılan başvuru üzerine, üç gün içinde servis sağlayıcıdan ihlâle devam eden bilgi içerik sağlayıcısına verilen hizmetin durdurulması istenir. İhlâlin durdurulması halinde bilgi içerik sağlayıcısına yeniden servis sağlanır. Servis sağlayıcılar, bilgi içerik sağlayıcılarının isimlerini gösterir listeyi her ayın ilk iş günü Bakanlığa bildirir. Servis sağlayıcılar ile bilgi içerik sağlayıcıları, Bakanlıkça istendiği takdirde her türlü bilgi ve belgeyi vermekle yükümlüdür. Bu maddede belirtilen hususların uygulanmasına ilişkin usul ve esaslar Bakanlık tarafından çıkarılacak bir yönetmelikle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="" tür="Ek" durum="mülga">
      </mvz-madde>
      <mvz-madde no="6" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunda geçen “Kültür ve Turizm” ibareleri “Kültür” olarak değiştirilmiştir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunun;</template>
          <mvz-bent no="a">
            <template>13 üncü maddesi uyarınca alınacak kayıt ve tescil ücretleri,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>41 inci maddesi uyarınca alınacak uzlaştırma komisyonu başvuru ücretleri,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>81 inci maddesi uyarınca tahsil edilecek bandrol ücretleri,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Kültür ve Turizm Bakanlığı Merkez Saymanlık Müdürlüğü hesabına yatırılır ve bütçeye gelir kaydedilir. Bandrol yaptırılması için gerekli ödenek Bakanlık bütçesine konulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>41 inci madde uyarınca kurulacak komisyonlarda görev yapan komisyon üyelerine, yılda on toplantı gününden fazla olmamak üzere her toplantı günü için (2000) gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutar üzerinden toplantı ücreti Bakanlık bütçesinden ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bir veri tabanının içeriğinin oluşturulmasına, doğrulanmasına veya sunumuna nitelik ve nicelik açısından esaslı bir nispet dahilinde yatırım yapan veri tabanı yapımcısı, ayrıca, veri tabanının içeriğinin önemli bir kısmının veya tamamının;</template>
          <mvz-bent no="a">
            <template>Herhangi bir araç ile herhangi bir şekilde sürekli veya geçici olarak başka bir ortama aktarılması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Herhangi bir yolla dağıtılması, satılması, kiralanması veya topluma iletilmesi,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Hususlarında bu Kanunda sayılan istisnalar ile kamu güvenliği, idarî ve yargı işlemlerinin gerektirdiği istisnalar dışında izin vermek veya yasaklamak hakkına sahiptir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Veri tabanı yapımcısına sağlanan koruma aleniyet tarihinden itibaren onbeş yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Veri tabanının içeriğinde esaslı bir değişiklik meydana getiren ve yeni bir yatırım gerektiren, nitelik ve nicelik açısından yapılan her türlü ekleme, çıkarma veya değişiklik sonucu bu yeni yatırımdan doğan veri tabanı kendi koruma koşullarına hak kazanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu maddede tanınmış hakları ihlâl edenler hakkında bu Kanunun 72 nci maddesinin (3) numaralı bendi hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bakanlıkça, fikrî mülkiyet haklarının takibi ve korunmasını sağlamak amacıyla ve soruşturma ve kovuşturmalarda kullanılmak üzere, bu Kanunda bahsi geçen meslek birlikleri, umuma açık mahaller, radyo-televizyon kuruluşları ile fikir ve sanat eserlerinin tespit edilmesi ve çoğaltılmasına ilişkin materyalleri üreten ve/veya bu materyallerin dolum, çoğaltım ve satışını yapan veya herhangi bir şekilde yayan yerlerin dahil olduğu ortak bir veri tabanı oluşturulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gerekli teknik alt yapı ve donanım, erişim, kullanım, yetkilendirme, veri tabanının oluşturulmasına ilişkin diğer tüm hususlar Bakanlıkça çıkarılacak bir yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Aşağıda belirtilen hâllerde idarî para cezası uygulanır:</template>
          <mvz-bent no="1.">
            <template>İlgili tüzel kişi hakkında verilecek idarî para cezasının üst sınırı ellibin Türk Lirasıdır.</template>
          </mvz-bent>
          <mvz-bent no="2." durum="mülga">
            <template></template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu madde hükümlerine göre verilen idarî para cezalarından tahsil edilen miktarın yüzde ellisi Kültür ve Turizm Bakanlığının hesabına aktarılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Ders kitapları dahil, alenileşmiş veya yayımlanmış yazılı ilim ve edebiyat eserlerinin engelliler için üretilmiş bir nüshası yoksa hiçbir ticarî amaç güdülmeksizin bir engellinin kullanımı için kendisi veya üçüncü bir kişi tek nüsha olarak ya da engellilere yönelik hizmet veren eğitim kurumu, vakıf veya dernek gibi kuruluşlar tarafından ihtiyaç kadar kaset, CD, braill alfabesi ve benzeri formatlarda çoğaltılması veya ödünç verilmesi bu Kanunda öngörülen izinler alınmadan gerçekleştirilebilir. Bu nüshalar hiçbir şekilde satılamaz, ticarete konu edilemez ve amacı dışında kullanılamaz ve kullandırılamaz. Ayrıca bu nüshalar üzerinde hak sahipleri ile ilgili bilgilerin bulundurulması ve çoğaltım amacının belirtilmesi zorunludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="İkramiye" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 81 inci maddesine aykırı olarak çoğaltılan nüsha ve yayınların yakalanması halinde, bu Kanun hükümleri ve ilgili diğer mevzuat hükümleri çerçevesinde suça konu olan materyalleri yakalama işlemine fiilen katılan, önleme, izleme ve soruşturmakla görevli olan denetim komisyonu başkan ve üyelerinden kamu görevlisi olanlara ikramiye ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir denetim faaliyeti çerçevesinde yapılan el koymalar neticesinde denetim komisyonu başkan ve üyelerine verilebilecek ikramiyenin toplam tutarı, ellibin gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarı geçemez. İkramiye tutarı ilgililere eşit olarak paylaştırılır. Bir kişiye ödenecek ikramiyenin yıllık toplam tutarı kırkbin gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarı geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ödenecek ikramiyenin yüzde ellisi, nüsha ve yayınlar sahipsiz yakalanmışsa mahkemesince verilecek olan müsadere kararını, sahipli yakalanmış ise kamu davası açılmasını, kalan yüzde ellisi ise müsadereye veya mahkûmiyete ilişkin hükmün kesinleşmesini takip eden bir ay içinde Bakanlık bütçesinin ilgili tertibinden ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunun 81 inci maddesinin yedinci fıkrası ile satış yapılması yasaklanmış olan yerlerde satılan yasal nüshalara el konulması halinde ikramiye ödenmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu maddeye göre ödenecek ikramiyelerden herhangi bir vergi ve kesinti yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Denetim komisyonlarının oluşumu ve çalışma esasları ile ödenecek ikramiyenin hesabında el konulan materyalin niteliği ve miktarı dikkate alınarak belirlenecek göstergeler ile bu maddenin uygulanmasına ilişkin diğer usûl ve esaslar İçişleri Bakanlığı ve Maliye Bakanlığının uygun görüşü alınarak Bakanlık tarafından çıkarılacak yönetmelik ile düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="F" başlık="Geçici hükümler">
      <mvz-b2 no="I" başlık="İntikal hükümleri">
        <mvz-b3 no="1" başlık="Genel olarak">
          <mvz-madde no="1" başlık="" tür="Geçici">
            <mvz-fıkra no="1">
              <template>Aşağıdaki maddelerde aksi tayin edilmemiş ise bu kanun hükümleri, yürürlükten önce ilk defa memleket içinde umuma arz yahut sicile kayıt edilmiş eserlere de uygulanır. Eser veya mahsulün 8 Mayıs 1326 tarihli Hakkı Telif Kanunu hükümlerine dahil olup olmaması durumu değiştirmez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu Kanunun yürürlüğe girmesinden önce alenileşmiş eserlere mütaallik koruma süreleri bu kanuna göre hesap edilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Mevzuat ve sözleşmelerde kullanılan hakkı telif, telif hakları, edebi mülkiyet, güzel sanatlar mülkiyeti ve buna benzer tabirlerden bu kanunun benzer hallerde tanıdığı hak ve salahiyetler anlaşılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bu Kanunun yürürlüğe girmesinden önce eser üzerindeki haklar veya bunların kullanılışı tamamen veya kısmen başka birine bırakılmışsa bu kanunla eser sahibine tanınan yeni ve daha geniş hak ve salahiyetler de devredilmiş sayılmaz. Aynı hüküm koruma süresinin eskisine nispetle daha uzun olması haline veya eski kanunun korunmadığı eser ve mahsullere de uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Müktesep hakların korunması">
          <mvz-madde no="2" başlık="" tür="Geçici">
            <mvz-fıkra no="1">
              <template>Eski kanundaki süreler daha uzunsa bu kanunun yayımlanmasından önce yayımlanan eserler hakkında o süreler cereyan eder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu Kanunun yayımlanmasından önce bir eserin haklı olarak yapılan bir tercüme veya işlenmesi yayımlanmış ise tercüme eden veya işliyenin eski kanun hükümlerine göre iktisap ettiği hak ve salahiyetlere halel gelmez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Eski kanun  hükümlerine  göre caiz olupta bu kanunla menedilen bir tercümenin yayımlanmasına,  bu  kanunun  yürürlüğe  girmesi tarihinden evvel başlanılmış bulunursa, yayımlanma tamamlanabilir. Şu kadar ki, bu yayımlanma müddeti bir seneyi geçemez. Aynı hüküm umumi mahallerde temsil edilmek üzere bu nevi temsil müesseselerine teslim edilen tercüme eserler hakkında da tatbik edilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Eski kanun hükümlerine göre caiz olupta bu kanunla menedilen bir çoğaltmaya, bu kanunun yayımlanması tarihinde başlanılmış bulunursa çoğaltılma tamamlanabilir ve çoğaltılmış nüshalar yayımlanabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Bu Kanunun yürürlüğe girmesi zamanında mevcut olupta eski kanun hükümlerine göre çoğaltılması caiz olan nüshaların yayımlanmasına devam edilebilir. Aynı hüküm, işaret, resim ve ses nakline yarıyan aletlerle güzel sanat eserlerinin çoğaltılmasına yarıyan kalıp ve buna benzer vasıtalar hakkında da uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Yukarki fıkranın tanıdığı salahiyeti kullanmak istiyen kimse kanunun yürürlüğe girmesinden itibaren 6 ay içinde bu nüsha ve aletleri salahiyetli makama bildirerek mühürletmeye mecburdur. Gerekirse teferruat bir yönetmelikle tayin olunabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="3" başlık="" tür="Geçici">
            <mvz-fıkra no="1">
              <template>Meslek birliklerinin ve federasyonunun, ilk genel kurul toplantılarını yapmaları için tüzükte öngörülen üye sayısını tamamlayıp, seçimleri yapılıncaya kadar mecburi organların başkan ve üyeleri Kültür ve Turizm Bakanlığının önerisi üzerine, Bakanlar Kurulu Kararı ile belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="4" başlık="" tür="Geçici">
            <mvz-fıkra no="1">
              <template>5846 sayılı Fikir ve Sanat Eserleri Kanununun 43 üncü maddesine göre çıkarılmış olan 15/3/1980 tarih ve 8/423 sayılı Bakanlar Kurulu kararnamesi ve bu kararnameye göre çıkarılacak ücret tarifesi, 15/3/1980 tarihinden geçerli olmak üzere 31/12/1985 tarihine kadar uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bakanlar Kurulu Kararnamesine göre çıkarılacak ücret tarifesi gereğince, yetki belgesiyle meslek birliğine devredilen eserler için ödemeler, hak sahiplerine dağıtılmak üzere ilgili meslek birliğine; diğer hallerde doğrudan mali hak sahiplerine yapılır. Bu ödemeler Türkiye Radyo - Televizyon Kurumunca en geç 31/12/1985 tarihine kadar yerine getirilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Meslek birliği, Türkiye Radyo - Televizyon Kurumu tarafından verilen bordro üzerinden kendi hissesini mahsup ederek, bakiyesini kendisine yapılan ödemeyi takip eden iki yıl içinde üyesi olan hak sahiplerine öder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>İki yıl içinde üyelerce talep olunmayan ücretler, 44 üncü maddeye göre Kültür ve Turizm Bakanlığı adına bir milli bankada açılacak özel hesaba yatırılır.</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="5" başlık="" tür="Geçici">
            <mvz-fıkra no="1">
              <template>Bu Kanunun yürürlüğe girmesinden önce kurulmuş olan meslek birlikleri, tip statülerin yayımından itibaren bir yıl içinde Kültür Bakanlığının gözetiminde, Kanunun ilgili hükümleri ve tip statü ilkeleri doğrultusunda yeni meslek birliklerine dönüştürülürler ve bu süre içinde yapacakları genel kurul toplantısı ile yeni organlarını oluştururlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Birinci fıkra hükümlerine uymayan meslek birlikleri, birinci yılın sonunda kendiliğinden dağılmış sayılır.</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="6" başlık="" tür="Geçici">
            <mvz-fıkra no="1">
              <template>Bu Kanunun 41 ve 43 üncü maddelerinde tarifelerin belirlenmesi ve sözleşmelerin yapılmasına ilişkin öngörülen usul, bu maddelerde yer alan süreler beklenmeksizin Kanunun yayımı tarihinden itibaren carî yıl esas alınmak suretiyle uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu Kanunun yayımı tarihinden önce meslek birlikleri ile umuma açık mahaller ve yayın kuruluşları arasında imzalanmış bulunan yayın sözleşmeleri, bütün hükümleri ile bu sözleşmelerde belirtilen sürelerin sonuna kadar geçerlidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bu Kanunun yürürlüğe girmesinden itibaren en geç bir ay içerisinde bu Kanunun 41 ve 43 üncü maddelerinde öngörülen sınıflandırma yapılır. Bu sınıflandırmaya bağlı olarak tarifelerin meslek birlikleri tarafından en geç bir ay içerisinde ilk defa ilân edilmesinden veya duyurulmasından itibaren altı ay içinde izin almak ve sözleşme yapmak üzere meslek birliklerine müracaat eden mahaller ve/veya yayın kuruluşları üçer aylık dönemler için meslek birlikleri tarifesinin 1/4'ünü ödeyerek eser, icra, fonogram, yapım ve yayınları kullanmaya ve/veya iletimini yapmaya en fazla altı ay süreyle devam edebilirler. Bu fıkra hükümleri bu Kanunun 41 ve 43 üncü maddelerinde öngörülen usulün uygulanmasına engel teşkil etmez.</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="7" başlık="" tür="Geçici">
            <mvz-fıkra no="1">
              <template>Bu Kanunun yayımı tarihinden önce, illerde oluşturulmuş olan denetim komisyonlarından, 81 inci madde hükümleri çerçevesinde faaliyetlerini sürdürmesine gerek görülmeyenlerin her türlü araç, gereç ve malzemeleri il kültür ve turizm müdürlüklerine devredilir.</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="8" başlık="" tür="Geçici">
            <mvz-fıkra no="1">
              <template>Bu Kanunla değiştirilen maddelerde öngörülen yönetmelikler, bu Kanunun yayımı tarihinden itibaren altı ay içinde hazırlanılarak yürürlüğe konulur. Ek 9 uncu maddede öngörülen veri tabanı bu Kanunun yayımı tarihinden itibaren bir yıl içinde oluşturulur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Kaldırılan hükümler">
        <mvz-madde no="89" başlık="">
          <mvz-fıkra no="1">
            <template>8 Mayıs 1326 tarihli Hakkı Telif Kanuniyle diğer kanunların bu kanuna aykırı hükümleri kaldırılmıştır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="G" başlık="Son hükümler">
      <mvz-b2 no="I" başlık="Kanunun yürürlüğe girmesi">
        <mvz-madde no="90" başlık="">
          <mvz-fıkra no="1">
            <template>Bu Kanunun 42 ve 43 üncü maddeleri hükümleri kanunun yayımı tarihinden itibaren, diğer hükümleri 1 Ocak 1952 tarihinde yürürlüğe girer.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Kanunun yürütülmesine memur makam">
        <mvz-madde no="91" başlık="">
          <mvz-fıkra no="1">
            <template>Bu Kanunun hükümlerini Bakanlar Kurulu yürütür.</template>
          </mvz-fıkra>
        </mvz-madde>

    </mvz-b1>
