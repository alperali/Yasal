  <mvz-bölüm no="1-BİRİNCİ" başlık="Fikir ve Sanat Eserleri">
    <mvz-b1 no="A" başlık="Giriş">
      <mvz-madde no="1" başlık="Amaç">
        <mvz-fıkra no="1">
          <template>Bu Kanunun amacı, fikir ve sanat eserlerini meydana getiren eser sahipleri ile bu eserleri icra eden veya yorumlayan icracı sanatçıların, seslerin ilk tespitini yapan fonogram yapımcıları ile filmlerin ilk tespitini gerçekleştiren yapımcıların ve radyo-televizyon kuruluşlarının ürünleri üzerindeki manevi ve mali haklarını belirlemek, korumak, bu ürünlerden yararlanma şartlarını düzenlemek, öngörülen esas ve usullere aykırı yararlanma halinde yaptırımları tespit etmektir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1/A" başlık="Kapsam">
        <mvz-fıkra no="1">
          <template>Bu Kanun, fikir ve sanat eserlerini meydana getiren eser sahipleri ile bu eserleri icra eden veya yorumlayan icracı sanatçıların, seslerin ilk tespitini yapan fonogram yapımcıları ile filmlerin ilk tespitini gerçekleştiren yapımcıların ve radyo-televizyon kuruluşlarının ürünleri üzerindeki manevi ve mali haklarını, bu haklara ilişkin tasarruf esas ve usullerini, yargı yollarını ve yaptırımları ile Kültür Bakanlığının görev, yetki ve sorumluluğunu kapsamaktadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1/B" başlık="Tanımlar">
        <mvz-fıkra no="1">
          <template>Bu Kanunda geçen tanımlardan;</template>
          <mvz-bent no="a">
            <template>Eser: Sahibinin hususiyetini taşıyan ve ilim ve edebiyat, musiki, güzel sanatlar veya sinema eserleri olarak sayılan her nevi fikir ve sanat mahsullerini,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Eser sahibi: Eseri meydana getiren  kişiyi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İşlenme eser: Diğer bir eserden istifade suretiyle vücuda getirilip de bu esere nispetle müstakil olmayan ve işleyenin hususiyetini taşıyan fikir ve sanat mahsullerini,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Derleme eser: Özgün eser üzerindeki haklar saklı kalmak kaydıyla, ansiklopediler ve antolojiler gibi muhtevası seçme ve düzenlemelerden oluşan ve bir düşünce yaratıcılığı sonucu olan eseri,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Tespit: Seslerin veya ses temsillerinin veya ses ve görüntülerin anlaşılabilecek, çoğaltılabilecek veya iletilebilecek şekilde bir araca kaydedilmesi işlemini,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Fonogram: Sinema eseri gibi görsel-işitsel eserler içindeki ses tespitleri hariç olmak üzere, bir icrada yer alan seslerin veya diğer seslerin veya ses temsillerinin tespit edildiği ses taşıyıcısı fiziki ortamı,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Bilgisayar programı: Bir bilgisayar sisteminin özel bir işlem veya görev yapmasını sağlayacak bir şekilde düzene konulmuş bilgisayar emir dizgesini ve bu emir dizgesinin oluşum ve gelişimini sağlayacak hazırlık çalışmalarını,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Arayüz: Bilgisayarın donanım ve yazılım unsurları arasında karşılıklı etkilenme ve bağlantıyı oluşturan program bölümlerini,</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Araişlerlik: Bilgisayar program bölümlerinin fonksiyonel olarak birlikte çalışması ve karşılıklı etkilenmesi ve alışverişi yapılan bilginin karşılıklı kullanım yeteneğini,</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Bağlantılı haklar: Eser sahibinin manevi ve mali haklarına zarar vermemek kaydıyla komşu hak sahipleri ile filmlerin ilk tespitini gerçekleştiren film yapımcılarının sahip oldukları hakları,</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Komşu haklar: Eser sahibinin manevi ve mali haklarına zarar vermemek kaydıyla ve eser sahibinin izniyle bir eseri özgün bir biçimde yorumlayan, tanıtan, anlatan, söyleyen, çalan ve çeşitli biçimlerde icra eden sanatçıların, bir icra ürünü olan veya sair sesleri ilk defa tespit eden fonogram yapımcıları ile radyo-televizyon kuruluşlarının sahip oldukları hakları,</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Bakanlık: Kültür ve Turizm Bakanlığını,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>İfade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Fikir ve sanat eserlerinin çeşitleri">

            <mvz-bent no="1.">
              <template>Herhangi bir şekilde dil ve yazı ile ifade olunan eserler ve her biçim altında ifade edilen bilgisayar programları ve bir sonraki aşamada program sonucu doğurması koşuluyla bunların hazırlık tasarımları,</template>
            </mvz-bent>
            <mvz-bent no="2.">

              <template>Bedii vasfı bulunmayan her nevi teknik ve ilmi mahiyette fotoğraf eserleriyle, her nevi haritalar, planlar, projeler, krokiler, resimler, coğrafya ve topoğrafyaya ait maket ve benzerleri, herçeşit mimarlık ve şehircilik tasarım ve projeleri, mimari maketler, endüstri, çevre ve sahne tasarım ve projeleri.</template>

          <mvz-fıkra no="2">
            <template>Arayüzüne temel oluşturan düşünce ve ilkeleri de içine almak üzere, bir bilgisayar programının herhangi bir ögesine temel oluşturan düşünce ve ilkeler eser sayılmazlar.</template>
          </mvz-fıkra>

            </mvz-bent>
            <mvz-bent no="2.">

            </mvz-bent>
            <mvz-bent no="3.">
              <template>Mimarlık eserleri,</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>El işleri ve küçük sanat eserleri, minyatürler ve süsleme sanatı ürünleri ile tekstil, moda tasarımları,</template>
            </mvz-bent>
            <mvz-bent no="5.">
              <template>Fotoğrafik eserler ve slaytlar,</template>

            <mvz-bent no="6.">
              <template>Grafik eserler,</template>

            <mvz-bent no="7.">
              <template>Karikatür eserleri,</template>

            <template>Sinema eserleri, her nevi bedii, ilmi, öğretici veya teknik mahiyette olan veya günlük olayları tespit eden filmler veya sinema filmleri gibi, tespit edildiği materyale bakılmaksızın, elektronik veya mekanik veya benzeri araçlarla gösterilebilen, sesli veya sessiz, birbiriyle ilişkili hareketli görüntüler dizisidir.</template>
          </mvz-fıkra>
        </mvz-madde>

          <mvz-fıkra no="1">
            <template>Diğer bir eserden istifade suretiyle vücuda getirilip de bu esere nispetle müstakil olmayan ve aşağıda başlıcaları yazılı fikir ve sanat mahsulleri işlenmedir:</template>

              <template>Henüz yayımlanmamış olan bir eserin ilmi araştırma ve çalışma neticesinde yayımlanmaya elverişli hale getirilmesi (İlmi bir araştırma ve çalışma mahsulü olmayan alelade transkripsiyonlarla faksimileler bundan müstesnadır.);</template>
            </mvz-bent>
            <mvz-bent no="9.">

            <mvz-bent no="11.">
              <template>Belli bir maksada göre ve hususi bir plan dahilinde verilerin ve materyallerin seçilip derlenmesi sonucu ortaya çıkan ve bir araç ile okunabilir veya diğer biçimdeki veri tabanları (Ancak, burada sağlanan koruma, veri tabanı içinde bulunan veri ve materyalin korunması için genişletilemez)</template>

            <template>İstifade edilen eserin sahibinin haklarına zarar getirmemek şartıyla oluşturulan ve İşleyenin hususiyetini taşıyan işlenmeler, bu kanuna göre eser sayılır.</template>
          </mvz-fıkra>

  <mvz-bölüm no="2-İKİNCİ" başlık="Eser Sahibi">
    <mvz-b1 no="A" başlık="Tarif">
      <mvz-b2 no="I" başlık="Genel olarak">
        <mvz-madde no="8" başlık="">
          <mvz-fıkra no="1">
            <template>Bir eserin sahibi, onu meydana getirendir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir işlenmenin ve derlemenin sahibi, asıl eser sahibinin hakları mahfuz kalmak şartıyla onu işleyendir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sinema eserlerinde; yönetmen, özgün müzik bestecisi, senaryo yazarı ve diyalog yazarı, eserin birlikte sahibidirler. Canlandırma tekniğiyle yapılmış sinema eserlerinde, animatör de eserin birlikte sahipleri arasındadır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Eser sahiplerinin birden fazla oluşu">
        <mvz-madde no="9" başlık="">
          <mvz-fıkra no="1">
            <template>Birden fazla kimselerin birlikte vücuda getirdikleri eserin kısımlara ayrılması mümkünse, bunlardan her biri vücuda getirdiği kısmın sahibi sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aksi kararlaştırılmış olmadıkça, eseri birlikte vücuda getirenlerden her biri bütün eserin değiştirilmesi veya yayımlanması için diğerlerinin iştirakini isteyebilir. Diğer taraf muhik bir sebep olmaksızın iştirak etmezse, mahkemece müsaade verilebilir. Aynı hüküm mali hakların kullanılmasında da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Eser sahipleri arasındaki birlik">
        <mvz-madde no="10" başlık="">
          <mvz-fıkra no="1">
            <template>Birden fazla kimsenin iştirakiyle vücuda getirilen eser ayrılmaz bir bütün teşkil ediyorsa, eserin sahibi, onu vücuda getirenlerin birliğidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birliğe adi şirket hakkındaki hükümler uygulanır. Eser sahiplerinden biri, birlikte yapılacak bir muameleye muhik bir sebep olmaksızın müsaade etmezse, bu müsaade mahkemece verilebilir. Eser sahiplerinden her biri, birlik menfaatlerine tecavüz edildiği takdirde tek başına hareket edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bir eserin vücuda getirilmesinde yapılan teknik hizmetler veya teferruata ait yardımlar, iştirake esas teşkil etmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birden fazla kimsenin iştiraki ile vücuda getirilen eser, ayrılmaz bir bütün teşkil ediyorsa bir sözleşmede veya hizmet şartlarında veya eser meydana getirildiğinde yürürlükte olan herhangi bir yasada aksi öngörülmediği takdirde birlikte eser üzerindeki haklar eser sahiplerini bir araya getiren gerçek veya tüzel kişi tarafından kullanılır. Sinema eseri ile ilgili haklar saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Eser sahipliği hakkında karineler">
      <mvz-b2 no="I" başlık="Sahibinin adı belirtilen eserlerde">
        <mvz-madde no="11" başlık="">
          <mvz-fıkra no="1">
            <template>Yayımlanmış eser nüshalarında veya bir güzel sanat eserinin aslında, o eserin sahibi olarak adını veya bunun yerine tanınmış müstear adını kullanan kimse, aksi sabit oluncaya kadar o eserin sahibi sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Umumi yerlerde veya radyo-televizyon aracılığı ile verilen konferans ve temsillerde, mutad şekilde eser sahibi olarak tanıtılan kimse o eserin sahibi sayılır, meğer ki, birinci fıkradaki karine yoluyla diğer bir kimse eser sahibi sayılsın.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Sahibinin adı belirtilmeyen eserlerde">
        <mvz-madde no="12" başlık="">
          <mvz-fıkra no="1">
            <template>Yayımlanmış olan bir eserin sahibi 11 inci maddeye göre belli olmadıkça, yayımlayan ve o da belli değilse çoğaltan, eser sahibine ait hak ve salahiyetleri kendi namına kullanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu salahiyetler, 11 inci maddenin 2 nci fıkrasındaki karine ile eser sahibinin belli olmadığı hallerde konferansı verene veya temsili icra ettirene aittir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddeye göre salahiyetli kimselerle asıl hak sahipleri arasındaki münasebetlere, aksi kararlaştırılmamışsa, adi vekalet hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Fikri Haklar">
    <mvz-b1 no="A" başlık="Eser sahibinin hakları">
      <mvz-b2 no="I" başlık="Genel olarak">
        <mvz-madde no="13" başlık="">
          <mvz-fıkra no="1">
            <template>Fikir ve sanat eserleri üzerinde sahiplerinin mali ve manevi menfaatleri bu kanun dairesinde himaye görür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eser sahibine tanınan hak ve salahiyetler eserin bütününe ve parçalarına şamildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Filmlerin ilk tespitini gerçekleştiren film yapımcıları ile seslerin ilk tespitini gerçekleştiren fonogram yapımcıları, hak ihdas etmek amacı taşımaksızın, sahip oldukları hakların ihlâl edilmemesi, hak sahipliklerinin belirlenmesinde ispat kolaylığı sağlanması ve malî haklara ilişkin yararlanma yetkilerinin takip edilmesi maksadıyla, sinema ve müzik eserlerini içeren yapımlarının kayıt ve tescilini yaptırırlar. Aynı maksatla, eser sahiplerinin talebi üzerine, bu Kanun kapsamında korunan tüm eserlerin kayıt ve tescili yapılabilir, malî haklara ilişkin yararlanma yetkileri de kayıt altına alınabilir. Beyana müstenit yapılan bu işlemlerden Bakanlık sorumlu tutulamaz. Ancak, kayıt ve tescil işlemlerine esas teşkil edecek işlemlerde, mevcut olmadığını bildiği veya bilmesi icap ettiği veya kendisine ait olmayan malî ve manevî haklara ilişkin yanlış beyanda bulunanlar, bu Kanunda öngörülen hukukî ve cezaî müeyyidelere tâbidirler. Bu Kanun kapsamında yapılan tüm kayıt ve tescil işlemlerine ilişkin ücretler Bakanlık tarafından belirlenir. Kayıt ve tescilin usul ve esasları, ücretlerinin belirlenmesi ile diğer hususlar Bakanlıkça çıkarılacak bir yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Manevi haklar">
        <mvz-b3 no="1" başlık="Umuma arz salahiyeti">
          <mvz-madde no="14" başlık="">
            <mvz-fıkra no="1">
              <template>Bir eserin umuma arzedilip edilmemesini, yayımlanma zamanını ve tarzını munhasıran eser sahibi tayin eder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bütünü veya esaslı bir kısmı alenileşmemiş olan, yahut ana hatları her hangi bir suretle henüz umuma tanıtılmıyan bir eserin muhtevası hakkında ancak o eserin sahibi malumat verebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Eserin umuma arzedilmesi veya yayımlanma tarzı, sahibinin şeref ve itibarını zedeleyecek mahiyette ise eser sahibi, başkasına yazılı izin vermiş olsa bile eserin gerek aslının gerek işlenmiş şeklinin umuma tanıtılmasını veya yayımlanmasını menedebilir. Menetme yetkisinden sözleşme ile vazgeçmek hükümsüzdür. Diğer tarafın tazminat hakkı saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Adın belirtilmesi salahiyeti">
          <mvz-madde no="15" başlık="">
            <mvz-fıkra no="1">
              <template>Eseri, sahibinin adı veya müstear adı ile yahut adsız olarak, umuma arzetme veya yayımlama hususunda karar vermek salahiyeti munhasıran eser sahibine aittir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bir güzel sanat eserinden çoğaltma ile elde edilen kopyelerle bir işlenmenin aslı veya çoğaltılmış nüshaları üzerinde asıl eser sahibinin ad veya alametinin, kararlaştırılan veya adet olan şekilde belirtilmesi ve vücuda getirilen eserin bir kopye veya işlenme olduğunun açıkça gösterilmesi şarttır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bir eserin kimin tarafından vücuda getirildiği ihtilaflı ise, yahut her hangi bir kimse eserin sahibi olduğunu iddia etmekte ise, hakiki sahibi, hakkının tesbitini mahkemeden isteyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Eser niteliğindeki mimari yapılarda, yazılı istem üzerine eserin görülen bir yerine eser sahibinin uygun göreceği malzeme ile silinmeyecek biçimde eser sahibinin adı yazılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Eserde değişiklik yapılmasını menetmek">
          <mvz-madde no="16" başlık="">
            <mvz-fıkra no="1">
              <template>Eser sahibinin izni olmadıkça eserde veyahut eser sahibinin adında kısaltmalar, ekleme ve başka değiştirmeler yapılamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kanunun veya eser sahibinin müsaadesiyle bir eseri işleyen, umuma arzeden, çoğaltan, yayımlayan, temsil eden veya başka bir suretle yayan kimse; işleme, çoğaltma, temsil veya yayım tekniği icabı zaruri görülen değiştirmeleri eser sahibinin hususi bir izni olmaksızın da yapabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Eser sahibi kayıtsız ve şartsız olarak yazılı izin vermiş olsa bile şeref ve itibarını zedeleyen veya eserin mahiyet ve hususiyetlerini bozan her türlü değiştirilmeleri menedebilir. Menetme yetkisinden bu hususta sözleşme yapılmış olsa bile vazgeçmek hükümsüzdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="4" başlık="Eser sahibinin zilyed ve malike karşı hakları">
          <mvz-madde no="17" başlık="">
            <mvz-fıkra no="1">
              <template>Eser sahibi, gerekli durumlarda, aslın maliki ve zilyedinden, koruma şartlarını yerine getirmek kaydıyla, 4 üncü maddenin 1 inci ve 2 nci bentlerinde sayılan güzel sanat eserlerinin ve 2 nci maddenin 1 inci bendinde ve 3 üncü maddede sayılıp da yazarlarla bestecilerin el yazısıyla yazılmış eserlerinin asıllarından geçici bir süre için yararlanmayı talep etme hakkına sahiptir. Eser sahibinin bu hakkı, bu eserlerin ticaretini yapanlar tarafından eseri satın alan veya elde eden kişilere müzayede ve satış kataloğu veya ilgili belgeler ile açıklanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Aslın maliki, eser sahibi ile yapmış olduğu sözleşme şartlarına göre eser üzerinde tasarruf edebilir. Ancak eseri bozamaz ve yok edemez ve eser sahibinin haklarına zarar veremez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Eserin tek ve özgün olması durumunda eser sahibi, kendisine ait tüm dönemleri kapsayan çalışma ve sergilerde kullanmak amacıyla, koruma şartlarını yerine getirerek iade edilmek üzere eseri isteyebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Hakların kullanılması">
        <mvz-b4 no="a" başlık="Genel olarak">
          <mvz-madde no="18" başlık="">
            <mvz-fıkra no="1">
              <template>Mali hakları kullanma yetkisi münhasıran eser sahibine aittir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Aralarındaki özel sözleşmeden veya işin mahiyetinden aksi anlaşılmadıkça; memur, hizmetli ve işçilerin işlerini görürken meydana getirdikleri eserler üzerindeki haklar bunları çalıştıran veya tayin edenlerce kullanılır. Tüzel kişilerin uzuvları hakkında da bu kural uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bir eserin yapımcısı veya yayımcısı, ancak eserin sahibi ile yapacağı sözleşmeye göre mali hakları kullanabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b4>
        <mvz-b4 no="b" başlık="Hakları kullanabilecek kimseler">
          <mvz-madde no="19" başlık="">
            <mvz-fıkra no="1">
              <template>Eser sahibi 14 ve 15 inci maddelerin birinci fıkralariyle kendisine tanınan salahiyetlerin kullanılış tarzlarını tesbit etmemişse yahut bu hususu her hangi bir kimseye bırakmamışsa bu salahiyetlerin ölümünden sonra kullanılması, vasiyeti tenfiz memuruna; bu tayin edilmemişse sırasiyle sağ kalan eşi ile çocuklarına ve mansup mirasçılarına, ana - babasına, kardeşlerine aittir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Eser sahibinin ölümünden sonra yukarıdaki fıkrada sayılan kimseler eser sahibine 14, 15 ve 16 ncı maddelerin üçüncü fıkralarında tanınan hakları eser sahibinin ölümünden itibaren yetmiş yıl kendi namlarına kullanabilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Eser sahibi veya birinci ve ikinci fıkralara göre salahiyetli olanlar, salahiyetlerini kullanmazlarsa; eser sahibinden veya halefinden mali bir hak iktisap eden kimse meşru bir menfaati bulunduğunu ispat şartiyle, eser sahibine 14, 15 ve 16 ncı maddelerin üçüncü fıkralarında tanınan hakları kendi namına kullanabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Salahiyetli kimseler birden fazla olup müdahale hususunda birleşemezlerse; mahkeme, eser sahibinin muhtemel arzusuna en uygun bir şekilde basit yargılama usulü ile ihtilafı halleder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>18 inci madde ile yukarıdaki fıkralarda sayılan salahiyetli kimselerden hiçbiri bulunmaz veya bulunup da salahiyetlerini kullanmazlarsa yahut ikinci fıkrada belirlenen süreler bitmişse, eser memleketin kültürü bakımından önemli görüldüğü takdirde, Kültür ve Turizm Bakanlığı 14, 15, 16 ncı maddelerin üçüncü fıkralarında eser sahibine tanınan hakları kendi namına kullanabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b4>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Mali haklar">
        <mvz-b3 no="1" başlık="Genel olarak">
          <mvz-madde no="20" başlık="">
            <mvz-fıkra no="1">
              <template>Henüz alenileşmemiş bir eserden her ne şekil ve tarzda olursa olsun faydalanma hakkı münhasıran eser sahibine aittir. Alenileşmiş bir eserden eser sahibine münhasıran tanınan faydalanma hakkı, bu Kanunda mali hak olarak gösterilenlerden ibarettir. Mali haklar birbirine bağlı değildir. Bunlardan birinin tasarrufu ve kullanılması diğerine tesir etmez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2" durum="mülga">
              <template></template>
            </mvz-fıkra>
            <mvz-fıkra no="3" durum="mülga">
              <template></template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bir işlenmenin sahibi, kendisine bu sıfatla tanınan mali hakları, işleme hususunun serbest olduğu haller dışında, asıl eser sahibinin müsaade ettiği nispette kullanabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Çeşitleri">
          <mvz-b4 no="a" başlık="İşleme hakkı">
            <mvz-madde no="21" başlık="">
              <mvz-fıkra no="1">
                <template>Bir eserden, onu işlemek suretiyle faydalanma hakkı munhasıran eser sahibine aittir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b4>
          <mvz-b4 no="b" başlık="Çoğaltma hakkı">
            <mvz-madde no="22" başlık="">
              <mvz-fıkra no="1">
                <template>Bir eserin aslını veya kopyalarını, herhangi bir şekil veya yöntemle, tamamen veya kısmen, doğrudan veya dolaylı, geçici veya sürekli olarak çoğaltma hakkı münhasıran eser sahibine aittir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eserlerin aslından ikinci bir kopyasının çıkarılması ya da eserin işaret, ses ve görüntü nakil ve tekrarına yarayan, bilinen ya da ileride geliştirilecek olan her türlü araca kayıt edilmesi, her türlü ses ve müzik kayıtları ile mimarlık eserlerine ait plan, proje ve krokilerin uygulanması da çoğaltma sayılır. Aynı kural, kabartma ve delikli kalıplar hakkında da geçerlidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Çoğaltma hakkı, bilgisayar programının geçici çoğaltılmasını gerektirdiği ölçüde, programın yüklenmesi, görüntülenmesi, çalıştırılması, iletilmesi ve depolanması fiillerini de kapsar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b4>
          <mvz-b4 no="c" başlık="Yayma hakkı">
            <mvz-madde no="23" başlık="">
              <mvz-fıkra no="1">
                <template>Bir eserin aslını veya çoğaltılmış nüshalarını, kiralamak, ödünç vermek, satışa çıkarmak veya diğer yollarla dağıtmak hakkı münhasıran eser sahibine aittir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eser sahibinin izniyle yurt dışında çoğaltılmış nüshaların yurt içine getirilmesi ve bunlardan yayma yoluyla faydalanma hakkı münhasıran eser sahibine aittir. Yurt dışında çoğaltılmış nüshalar her ne surette olursa olsun eser sahibinin ve/veya eser sahibinin iznini haiz yayma hakkı sahibinin izni olmaksızın ithal edilemez. Kiralama ve kamuya ödünç verme yetkisi eser sahibinde kalmak kaydıyla, belirli nüshaların hak sahibinin yayma hakkını kullanması sonucu mülkiyeti devredilerek ülke sınırları içinde ilk satışı veya dağıtımı yapıldıktan sonra bunların yeniden satışı eser sahibine tanınan yayma hakkını ihlal etmez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bir eserin veya çoğaltılmış nüshalarının kiralanması veya ödünç verilmesi şeklinde yayımı, eser sahibinin çoğaltma hakkına zarar verecek şekilde, eserin yaygın kopyalanmasına yol açamaz. Bu maddenin uygulanmasına ilişkin usul ve esaslar Kültür Bakanlığınca hazırlanacak bir yönetmelikle düzenlenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b4>
          <mvz-b4 no="ç" başlık="Temsil hakkı">
            <mvz-madde no="24" başlık="">
              <mvz-fıkra no="1">
                <template>Bir eserden,  doğrudan doğruya yahut işaret, ses veya resim nakline yarayan aletlerle umumi mahallerde okumak, çalmak, oynamak ve göstermek gibi temsil suretiyle faydalanma hakkı munhasıran eser sahibine aittir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Temsilin umuma arzedilmek üzere vukubulduğu mahalden başka bir yere herhangi bir teknik vasıta ile nakli de eser sahibine aittir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Temsil hakkı; eser sahibinin veya meslek birliğine üye olması halinde, yetki belgesinde belirttiği yetkiler çerçevesinde meslek birliğinin yazılı izni olmadan, diğer gerçek ve tüzelkişilerce kullanılamaz. Ancak, 33 üncü ve 43 üncü maddelerdeki hükümler saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b4>
          <mvz-b4 no="d" başlık="İşaret, ses ve/veya görüntü nakline yarayan araçlarla umuma iletim hakkı">
            <mvz-madde no="25" başlık="">
              <mvz-fıkra no="1">
                <template>Bir eserin aslını veya çoğaltılmış nüshalarını, radyo-televizyon, uydu ve kablo gibi telli veya telsiz yayın yapan kuruluşlar vasıtasıyla veya dijital iletim de dahil olmak üzere işaret, ses ve/veya görüntü nakline yarayan araçlarla yayınlanması ve yayınlanan eserlerin bu kuruluşların yayınlarından alınarak başka yayın kuruluşları tarafından yeniden yayınlanması suretiyle umuma iletilmesi hakkı munhasıran eser sahibine aittir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eser sahibi, eserinin aslı ya da çoğaltılmış nüshalarının telli veya telsiz araçlarla satışı veya diğer biçimlerde umuma dağıtılmasına veya sunulmasına ve gerçek kişilerin seçtikleri yer ve zamanda eserine erişimini sağlamak suretiyle umuma iletimine izin vermek veya yasaklamak hakkına da sahiptir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bu madde ile düzenlenen umuma iletim yoluyla eserlerin dağıtım ve sunumu eser sahibinin yayma hakkını ihlal etmez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b4>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Süreler">
          <mvz-b4 no="a" başlık="Genel olarak">
            <mvz-madde no="26" başlık="">
              <mvz-fıkra no="1">
                <template>Eser sahibine tanınan mali haklar zamanla mukayyettir. 46 ve 47 nci maddelerdeki haller dışında koruma süresinin bitiminden sonra herkes, eser sahibine tanınan mali haklardan faydalanabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bir eserin aslı veya işlenmeleri için tanınan koruma süreleri birbirine tabi değildir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bu hüküm 9 uncu maddenin birinci fıkrasındaki eserler hakkında da uygulanır. Koruma süresi, eserin alenileşmesinden önce cereyana başlamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Forma veya fasikül halinde yayımlanan eserlerde son forma veya fasikülün yayımlandığı tarih, eserin aleniyeti tarihi sayılır. Fasıla ile yayımlanan mütaaddit ciltlerden müteşekkil eserlerin her bir cildi ile bülten, risale, mevkute ve yıllıklar gibi eserlerde aleniyet tarihi bunlardan her birinin yayımlanma tarihidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="5">
                <template>Aleniyet tarihinden başlıyan süreler eserin ilk defa alenileştiği veya dördüncü fıkraya göre alenileşmiş sayıldığı yıldan sonraki senenin ilk gününden itibaren hesap olunur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="6">
                <template>Eser sahibinin ölümünden itibaren başlıyan sürelerin hesabında, eser sahibinin öldüğü seneyi takip eden yılın ilk günü başlangıç tarihi sayılır. 10 uncu maddenin birinci fıkrasında zikredilen hallerde süre, eser sahiplerinden son sağ kalanının ölüm tarihinden sonra başlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b4>
          <mvz-b4 no="b" başlık="Sürelerin devamı">
            <mvz-madde no="27" başlık="">
              <mvz-fıkra no="1">
                <template>Koruma süresi eser sahibinin yaşadığı müddetçe ve ölümünden itibaren 70 yıl devam eder  Bu süre, eser sahibinin birden fazla olması durumunda, hayatta kalan son eser sahibinin ölümünden itibaren yetmiş yıl geçmekle son bulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Sahibinin ölümünden sonra alenileşen eserlerde koruma süresi ölüm tarihinden sonra 70 yıldır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>12 nci maddenin birinci fıkrasındaki hallerde koruma süresi, eserin aleniyet tarihinden sonra 70 yıldır; meğer ki eser sahibi bu sürenin bitmesinden önce adını açıklamış bulunsun,</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>İlk eser sahibi tüzelkişi ise, koruma süresi aleniyet tarihinden itibaren 70 yıldır.</template>
              </mvz-fıkra>
            </mvz-madde>
