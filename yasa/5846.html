    <mvz-b1 no="B" başlık="Tahditler">
      <mvz-b2 no="I" başlık="Amme intizamı mülahazasiyle">
        <mvz-madde no="30" başlık="">
          <mvz-fıkra no="1">
            <template>Eser sahibine tanınan haklar, eserin ispatı maksadiyle mahkeme ve diğer resmi makamlar huzurunda ve alelıtlak zabıta ve ceza işlerinde bir muameleye konu teşkil etmek üzere kullanılmasına mani değildir.  Fotoğraflar, umumi emniyet mülahazasiyle veya adli maksatlar için sahibinin rızası alınmaksızın, resmi makamlar veya bunların emriyle başkaları tarafından her şekilde çoğaltılabilir ve yayılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eserin her hangi bir suretle ticaret mevkiine konmasını, temsilini veya diğer şekillerde kullanılmasını meneden yahut müsaade veya kontrole bağlı tutan kamu hukuku hükümleri mahfuzdur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Genel menfaat mülahazasiyle">
        <mvz-b3 no="1" başlık="Mevzuat ve içtihatlar">
          <mvz-madde no="31" başlık="">
            <mvz-fıkra no="1">
              <template>Resmen yayımlanan veya ilan olunan kanun, Cumhurbaşkanlığı kararnamesi, yönetmelik, tebliğ, genelge ve kazai kararların çoğaltılması, yayılması, işlenmesi veya her hangi bir suretle bunlardan faydalanma serbesttir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Nutuklar">
          <mvz-madde no="32" başlık="">
            <mvz-fıkra no="1">
              <template>Büyük Millet Meclisinde ve diğer resmi meclis ve kongrelerde, mahkemelerde, umumi toplantılarda söylenen söz ve nutukların, haber ve malümat verme maksadiyle çoğaltılması, umumi mahallerde okunması veya radyo vasıtasiyle ve başka suretle yayımı serbesttir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Hadisenin mahiyeti ve vaziyetin icabı gerektirmediği hallerde söz ve nutuk sahiplerinin adı zikredilmeyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bu söz ve nutukları birinci fıkrada zikredilenden başka bir maksatla çoğaltmak veya diğer bir suretle yaymak eser sahibine aittir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Temsil serbestisi">
          <mvz-madde no="33" başlık="">
            <mvz-fıkra no="1">
              <template>Yayımlanmış bir eserin; tüm eğitim ve öğretim kurumlarında, yüzyüze eğitim ve öğretim maksadıyla doğrudan veya dolaylı kâr amacı gütmeksizin temsili, eser sahibinin ve eserin adının mutat şekilde açıklanması şartıyla serbesttir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="4" başlık="Eğitim ve öğretim için seçme ve toplama eserler">
          <mvz-madde no="34" başlık="">
            <mvz-fıkra no="1">
              <template>Yayımlanmış musiki, ilim ve edebiyat eserlerinden ve alenileşmiş güzel sanat eserlerinden, maksadın haklı göstereceği bir nispet dahilinde iktibaslar yapılmak suretiyle, hal ve vaziyetinden eğitim ve öğretim gayesine tahsis edildiği anlaşılan seçme ve toplama eserler vücuda getirilmesi serbesttir. 2 nci maddenin üçüncü bendinde ve 4 üncü maddenin birinci fıkrasının birinci ve beşinci bentlerinde gösterilen neviden eserler, ancak seçme ve toplama eserin münderecatını aydınlatmak üzere iktibas edilebilir. Ancak bu serbestlik, hak sahibinin meşru menfaatlerine haklı bir sebep olmadan zarar verir veya eserden normal yararlanma ile çelişir şekilde kullanılamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Münhasıran okullara mahsus olarak hazırlanan ve Milli Eğitim Bakanlığı tarafından onanan (okul-radyo) yayımları için de birinci fıkra hükümleri uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Yayımlanmış musiki, ilim ve edebiyat eserlerinden ve alenileşmiş güzel sanat eserlerinden, iktibaslar yapılmak suretiyle eğitim ve öğretim gayesi dışında seçme ve toplama eserler vücuda getirilmesi ancak eser sahibinin izniyle mümkündür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bütün bu hallerde eser ve eser sahibinin adı mutat şekilde zikredilmek icap eder.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="5" başlık="İktibas serbestisi">
          <mvz-madde no="35" başlık="">
            <mvz-fıkra no="1">
              <template>Bir eserden aşağıdaki hallerde iktibas yapılması caizdir:</template>
              <mvz-bent no="1.">
                <template>Alenileşmiş bir eserin bazı cümle ve fıkralarının müstakil bir ilim ve edebiyat eserine alınması;</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Yayımlanmış bir bestenin en çok tema, motif, pasaj ve fikir nevinden parçalarının müstakil bir musiki eserine alınması;</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Alenileşmiş güzel sanat eserlerinin ve yayımlanmış diğer eserlerin, maksadın haklı göstereceği bir nispet dahilinde ve münderacatını aydınlatmak maksadiyle bir ilim eserine konulması;</template>
              </mvz-bent>
              <mvz-bent no="4.">
                <template>Alenileşmiş güzel sanat eserlerinin ilmi konferans veya derslerde, konuyu aydınlatmak için projeksiyon ve buna benzer vasıtalarla gösterilmesi.</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İktibasın belli olacak şekilde yapılması lazımdır. İlim eserlerinde, iktibas hususunda kullanılan eserin ve eser sahibinin adından başka bu kısmın alındığı yer belirtilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="6" başlık="Gazete münderecatı">
          <mvz-madde no="36" başlık="">
            <mvz-fıkra no="1">
              <template>Basın Kanununun 15 inci maddesi hükmü mahfuz kalmak üzere basın veya radyo tarafından umuma yayılmış bulunan günlük havadisler ve haberler serbestçe iktibas olunabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Gazete veya dergilerde çıkan içtimai, siyasi veya iktisadi günlük meselelere mütaallik makale ve fıkraların iktibas hakkı sarahaten mahfuz tutulmamışsa aynen veya işlenmiş şekilde diğer gazete ve dergiler tarafından alınması ve radyo vasıtasiyle veya diğer bir suretle yayılması serbesttir. İktibas hakkı mahfuz tutulsa bile sözü geçen makale ve fıkraların kısaltılarak basın özetleri şeklinde alınması, radyo vasıtasiyle veya diğer bir suretle yayılması caizdir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bütün bu hallerde, iktibas edilen gazete, dergi ve ajansın ve eğer bunlar da başka bir kaynaktan alınmışlarsa o kaynağın adı, tarih ve sayısından başka makale sahiplerinin adı, müstear adı veya alameti zikredilmek icabeder.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="7" başlık="Haber">
          <mvz-madde no="37" başlık="">
            <mvz-fıkra no="1">
              <template>Haber mahiyetinde olmak ve bilgilendirme kapsamını aşmamak kaydıyla, günlük hadiselere bağlı olarak fikir ve sanat eserlerinden bazı parçaların işaret, ses ve/veya görüntü nakline yarayan vasıtalara alınması mümkündür. Bu şekilde alınmış parçaların çoğaltılması, yayılması, temsil edilmesi veya radyo ve televizyon gibi araçlarla yayınlanması serbesttir. Bu serbestlik, hak sahibinin hukuki menfaatlerine zarar verecek şekilde veya eserden normal yararlanmaya aykırı biçimde kullanılamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Hususi menfaat mülahazasiyle">
        <mvz-b3 no="1" başlık="Şahsan kullanma">
          <mvz-madde no="38" başlık="">
            <mvz-fıkra no="1">
              <template>Bütün fikir ve sanat eserlerinin,  kâr amacı güdülmeksizin şahsen kullanmaya mahsus çoğaltılması mümkündür. Ancak, bu çoğaltma hak sahibinin meşru menfaatlerine haklı bir sebep olmadan zarar veremez ya da eserden normal yararlanmaya aykırı olamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2" durum="mülga">
              <template></template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Sözleşmede belirleyici hükümlerinin yokluğu durumunda, hata düzeltme de dahil, bilgisayar programının düşünüldüğü amaca uygun kullanımı için gerekli olduğu durumda, bilgisayar programının onu hukuki yollardan edinen kişi tarafından çoğaltılması ve işlenmesi serbesttir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bilgisayar programını yasal yollardan edinen kişinin programı yüklemesi, çalıştırması ve hataları düzeltmesi sözleşme ile önlenemez. Bilgisayar programının kullanımı için gerekli olduğu sürece, bilgisayar programını kullanma hakkına sahip kişinin bir adet yedekleme kopyası yapması sözleşme ile önlenemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Bilgisayar programının kullanım hakkına sahip kişinin yapmaya hak kazandığı bilgisayar programının yüklenmesi, görüntülenmesi, çalıştırılması, iletilmesi veya depolanması fiillerini ifa ettiği sırada, bilgisayar programının herhangi bir ögesi altında yatan düşünce ve ilkeleri belirlemek amacı ile, programın işleyişini gözlemlemesi, tetkik etmesi ve sınaması serbesttir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Bağımsız yaratılmış bir bilgisayar programı ile diğer programların ara işlerliğini gerçekleştirmek üzere gerekli bilgileri elde etmek için, bilgisayar programının çoğaltılması ve işlenmesi anlamında kod'un çoğaltılmasının ve kod formunun çevirisinin de zorunlu olduğu durumlarda, bu fiillerin ifası aşağıdaki şartların karşılanması halinde serbesttir:</template>
              <mvz-bent no="1.">
                <template>Bu fiillerin, ruhsat sahibi veya bir bilgisayar programının kopyasını kullanma hakkı sahibi diğer bir kişi tarafından veya onların adına bunu yapmaya yetkili kişi tarafından ifa edilmesi,</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Araişlerliği gerçekleştirmek için gerekli bilginin, (1) numaralı bentte belirtilen kişilerin kullanımlarına sunulmaması,</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Bu fiillerin, araişlerliği gerçekleştirmek için gereken program parçaları ile sınırlı olması.</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Yukarıdaki fıkra hükümleri, onun uygulanması ile elde edilen bilgilerin;</template>
              <mvz-bent no="1.">
                <template>Bağımsız yaratılmış bilgisayar programının araişlerliğini gerçekleştirmenin dışında diğer amaçlar için kullanılmasına,</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Bağımsız yaratılmış bilgisayar programının araişlerliği için gerekli olduğu durumlar dışında başkalarına verilmesine,</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>İfade ediliş bakımından esastan benzer bir bilgisayar programının geliştirilmesi, üretilmesi veya pazarlanması veya fikri hakları ihlal eden herhangi diğer bir fiil için kullanılmasına,</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>İzin vermez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="8">
              <template>Altıncı ve Yedinci fıkra hükümleri, programdan normal yararlanma ile çelişir veya hak sahibinin meşru yararlarına makul olmayan müdahale eder şekilde kullanılmasına izin verecek tarzda yorumlanamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Bestekarlara tanınan haklar">
          <mvz-madde no="39" başlık="" durum="mülga">
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Kopye ve teşhir">
          <mvz-madde no="40" başlık="">
            <mvz-fıkra no="1">
              <template>Umumi yollar, caddeler ve meydanlara, temelli kalmak üzere konulan güzel sanat eserlerini; resim, grafik, fotoğraf ve saire ile çoğaltma, yayma, umumi mahallerde projeksiyonla gösterme, radyo ve benzeri vasıtalarla yayımlama caizdir. Bu salahiyet mimarlık eserlerinde yalnız dış şekle munhasırdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Üzerlerine, sahibi tarafından sarahaten menedici bir kayıt konulmuş olmadıkça güzel sanat eserleri, malikleri veya bunların muvafakatiyle başkaları tarafından umumi mahallerde teşhir edilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Açık artırma ile satılacak eserler umuma teşhir olunabilir. Umumi mahallerde teşhir edilen veya açık artırmaya konulan bir eseri sergi veya artırmayı tertip eden kimseler tarafından bu maksatlarla çıkarılacak kataloğ, kılavuz veya bunlara benzer matbualar vasıtasiyle çoğaltma ve yayma caizdir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bu hallerde, aksine yerleşmiş adet yoksa, eser sahibinin adının zikrinden vazgeçilebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="4" başlık="Umuma açık mahallerde eser, icra, fonogram, yapım ve yayınların kullanılması ve/veya iletilmesine ilişkin esaslar">
          <mvz-madde no="41" başlık="">
            <mvz-fıkra no="1">
              <template>Girişi ücretli veya ücretsiz umuma açık mahaller; eser, icra, fonogram, yapım ve yayınların kullanım ve/veya iletimine ilişkin 52 nci maddeye uygun sözleşme yaparak hak sahiplerinden veya üyesi oldukları meslek birliklerinden izin alır ve sözleşmelerde yazılı malî hak ödemelerini bu madde hükümlerine göre yaparlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Eser, icra, fonogram, yapım ve yayınları kullanan ve/veya ileten umuma açık mahaller; mahallin bulunduğu bölgenin özelliği, mahallin nitelik ve niceliği, fikrî mülkiyete konu eser, icra, fonogram, yapım ve yayınların mahalde sunulan ürün veya hizmetin ayrılmaz bir parçası ve ürün veya hizmete katkısı olup olmadığı ve benzeri hususlar dikkate alınmak suretiyle sınıflandırılır veya sınıflandırma dışı bırakılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Faaliyet gösterdikleri sektörlerde; eser sahipleri ve/veya bağlantılı hak sahipleri meslek birlikleri, yapılan sınıflandırmaya bağlı olarak eser, icra, fonogram, yapım ve yayınların kullanımından ve/veya iletiminden kaynaklanan ödemelere ilişkin tarifeleri tespit ederler. Meslek birlikleri ile umuma açık mahaller arasındaki sözleşmeler, bu tarife bedelleri veya taraflarca yapılabilecek müzakereler sonucu belirlenecek bedeller üzerinden yapılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Tarifelere ilişkin sözleşmelerde takvim yılı esas alınır ve bu tarifeler takvim yılı başından itibaren geçerli olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Bu madde hükümlerinin uygulanmasını teminen:</template>
              <mvz-bent no="1.">
                <template>Meslek birlikleri temsil ettikleri eser, icra, fonogram ve yapımlar ile üyelerine ilişkin bilgileri, Bakanlığa bildirmek zorundadırlar. Bu bildirimler her üç ayda bir güncellenir ve Bakanlıkça oluşturulan ortak bir veri tabanı üzerinden ilgili taraflara açılır.</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Eser sahipleri alanında kurulmuş meslek birlikleri veya bağlantılı hak sahipleri alanında kurulmuş meslek birlikleri veya aynı sektörlerde faaliyet gösteren meslek birlikleri, biraraya gelerek protokole bağlamak suretiyle ortak tarifeler belirleyebilirler. Ortak tarifeler protokole taraf meslek birlikleri açısından bağlayıcıdır.</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Meslek birlikleri, tarifeler veya ortak tarifeleri her takvim yılının dokuzuncu ayında kullanıcıları temsil eden ve kanunla kurulmuş kamu kurumu niteliğindeki meslek kuruluşları ile Bakanlığa bildirirler ve kamuoyuna duyururlar. Umuma açık mahaller, müzakere ve sözleşme yapılmasına ilişkin verecekleri bağlayıcı nitelikteki yetki belgeleri ile üye oldukları meslek kuruluşları aracılığıyla da tarifeleri veya ortak tarifeleri müzakere edebilir ve sözleşme yapabilirler. Ancak, tarifelerin götürü usulde tespit edilmesi halinde umuma açık mahaller sadece meslek kuruluşları aracılığı ile müzakere edebilir ve sözleşme yapabilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Onuncu ayda umuma açık mahaller veya meslek kuruluşları ile meslek birlikleri arasında tarifeler veya ortak tarifeler üzerinde uzlaşma sağlanamaması ve sözleşme yapılamaması halinde, en geç bu ayın sonuna kadar, meslek birlikleri ve/veya meslek kuruluşları tarafından bu tarifelerin Bakanlıkça oluşturulacak uzlaştırma komisyonunda müzakere edilmesi talep edilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="8">
              <template>Uzlaştırma komisyonu, taraflardan birinin talebi ve Bakanlığın uygun görmesi halinde, tarifeleri müzakere etmek üzere, Bakanlık tarafından talep tarihinden itibaren onbeş gün içinde oluşturulur. Komisyon Bakanlıktan bir, Rekabet Kurumundan iki temsilci ve ilgili meslek birlikleri ile kullanıcıları temsil eden meslek kuruluşlarının birer temsilcisinden oluşur. Bakanlık temsilcisi aynı zamanda komisyon başkanıdır. Aynı usulle, komisyon üye sayısı kadar yedek üye seçilir. Komisyonun sekretarya hizmetleri Bakanlık ilgili birimi tarafından yürütülür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="9">
              <template>Komisyon, oluşturulduğu tarihten itibaren onbeş gün içinde, raporunu hazırlayarak, Bakanlığa ve taraflara bildirir. Umuma açık mahaller ve meslek birlikleri, Komisyon raporunun açıklandığı tarihten itibaren onbeş gün içinde, meslek birliklerinin açıklamış oldukları tarifeleri veya müzakereler neticesinde mutabakata vardıkları tarifeleri sözleşmeye bağlayabilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="10">
              <template>Meslek birliklerince belirlenen tarife veya ortak tarifeler üzerinden sözleşmenin yapılmaması halinde, taraflar yargı yoluna başvurabilirler. Yargılama sürecinde, bir önceki yıl sözleşme yapmış olan mahaller, ilgili meslek birlikleri aksini bildirmedikçe, dava konusu tarifenin 1/4'ünü dava sonuçlanıncaya kadar her üç ayda bir meslek birlikleri adına açılmış banka hesabına yatırmak suretiyle eser, icra, fonogram, yapım ve yayınları kullanabilir ve/veya iletebilirler. Bir önceki yıl sözleşme yapmamış umuma açık mahaller ile ilk defa sözleşme yapacak umuma açık mahallerin bu fıkrada öngörüldüğü şekilde eser, icra, fonogram, yapım ve yayınları kullanabilmeleri ve/veya iletebilmeleri ise ilgili meslek birliklerinin iznine bağlıdır. Dava sonuçlanıncaya kadar bu şekilde ödenen miktar, mahkeme kararıyla tespit edilen tarife bedelinden mahsup edilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="11">
              <template>Tarifelerin tespit edilmesinde ve uzlaşmazlıkların hallinde, bu Kanunun 42/A maddesinin üçüncü fıkrasında yer alan, tarife tespitine ilişkin esaslar dikkate alınır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="12">
              <template>Mahallerde kullanılan ve/veya iletimi yapılan eser, icra, fonogram, yapım ve yayınlar üzerinde hak sahibi olan gerçek veya tüzel kişiler, bunların kullanımına ve/veya iletimine ilişkin ödemelerin yapılmasını  yetki verdikleri meslek birlikleri aracılığı ile talep edebilirler. Sinema eserleri bakımından bu fıkranın uygulanması zorunlu değildir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="13">
              <template>Sınıflandırma, uzlaştırma komisyonuna başvuru halinde Bakanlıkça alınacak ücretler ve uzlaştırma komisyonunun çalışması ile bu maddenin uygulanmasına ilişkin diğer usul ve esaslar Bakanlıkça çıkarılacak yönetmelik ile belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Hükümete tanınan yetkiler">
        <mvz-b3 no="1" başlık="Meslek birliklerinin kurulması">
          <mvz-madde no="42" başlık="">
            <mvz-fıkra no="1">
              <template>Eser sahipleri ve eser sahiplerinin hakları ile bağlantılı hak sahipleri,  ile bu Kanunun 52 nci maddesine uygun biçimde düzenlenmiş sözleşmelerle eser veya hak sahibinden malî hakları kullanma yetkilerini devralarak bu Kanunun 10 uncu maddesine göre ilim-edebiyat eserleri üzerindeki hakları kullanarak, süreli olmayan yayınları çoğaltan ve yayanlar  üyelerinin ortak çıkarlarını korumak ve bu Kanun ile tanınmış hakların idaresini ve takibini, alınacak ücretlerin tahsilini ve hak sahiplerine dağıtımını sağlamak üzere, Cumhurbaşkanınca çıkarılan yönetmelik ve tip statülere uygun olarak tespit edilecek alanlarda birden fazla meslek birliği kurabilirler. Eser sahipleri veya icracı sanatçılar bakımından zorunlu organlarının asıl üye sayısının dört katı kadar ; yapımcılar veya radyo-televizyon kuruluşları bakımından bu organların asıl üye sayısının iki katı kadar üye olma niteliklerini taşıyan gerçek veya tüzel kişiler meslek birliği olarak faaliyet gösterebilmek için izin almak üzere Bakanlığa başvurmak zorundadırlar. Meslek birlikleri bu izni aldıktan sonra kuruldukları alanda faaliyet gösterirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Aynı alanda, başka bir meslek birliğinin kurulabilmesi için, yukarıda zikredilen kurucu üye sayılarından az olmamak kaydıyla o alanda kurulmuş en fazla üyesi olan meslek birliğinin üye tam sayısının 1/3’ü kadar üye olma niteliklerini taşıyan gerçek veya tüzel kişiler faaliyet izni almak üzere Bakanlığa başvururlar. Bakanlığın bu başvuruyu uygun bularak izin vermesi halinde faaliyet gösterirler. Her birlik ihtiyaçlar doğrultusunda şubeler açarak çalışabilir. Aynı alanda kurulmuş en az iki meslek birliği, Cumhurbaşkanınca çıkarılan yönetmelik ve tip statülerin belirlediği usul ve esaslar çerçevesinde federasyon kurabilir. Aynı alanda birden fazla federasyon kurulamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Meslek birlikleri ve federasyon özel hukuka tabi tüzelkişilerdir. Üyeleri sermaye koymak, kar ve zarara, hukuki mesuliyete iştirak etmekle yükümlü tutulamazlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Meslek birliklerinin ve federasyonun tip statülerinde genel kurul, yönetim kurulu, denetleme kurulu, teknik - bilim kurulu ve haysiyet kurulu mecburi organ olarak düzenlenir. Bu birliklerin ve federasyonun kurulması, kontrolü; denetlenmesi ile ilk genel kurullarını toplayabilmeleri için gerekli en az üye sayısı, diğer ihtiyari organları, kurullarının teşekkül tarzı, üye sayısı ve görevleri üyeliğe girme, çıkma ve çıkarılma şartları, şubelerini kurabilecekleri bölgelerin tespiti, yurt içi ve yurt dışındaki kamu kurum ve kuruluşları, gerçek ve özel hukuk tüzelkişileri ile olan ilişkileri, bu ilişkilerdeki hak ve yetkileri, üyeleriyle olan mali ilişkileri, elde edilen telif ücreti ve tazminatların dağıtımı ve diğer usul ve esaslara ilişkin hususlar; Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>4/10/1983 tarihli ve 2908 sayılı Dernekler Kanununun 21 inci maddesinin ikinci fıkrası, 30, 37, 40, 42, 43, 44, 45, 48, 65, 66, 67, 68, 69, 70 ve 90 ıncı maddeleri, bu maddeye göre kurulacak meslek birlikleri ve federasyon için de ceza hükümleriyle birlikte uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Eser sahipleri ile bağlantılı hak sahiplerinin bu Kanunla tanınmış  hakları,  ülke  içinde  bu  maddeye  göre  kurulan   meslek   birlikleri   dışında;   başka  birlik, dernek ve benzeri kuruluşlar tarafından takip edilemez. Bu maddede geçen üyelik, kurucu üye sayısı ve üye tam sayısı gibi hususlar bu Kanunun yürürlüğe girdiği tarihten önce kurulmuş olan meslek birlikleri için de aranır. Bütün meslek birlikleri Kanunun yürürlüğe girmesinden itibaren altı ay içerisinde bu maddede getirilen esaslara uygun hale gelmek mecburiyetindedirler. Bu süre içinde bu şartı yerine getirmeyen meslek birlikleri altı ay sonunda kendiliğinden dağılmış sayılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Meslek birliklerinin yükümlülükleri ve tarife tespitine ilişkin esaslar">
          <mvz-madde no="42/A" başlık="">
            <mvz-fıkra no="1">
              <template>Bu Kanunun 42 nci maddesinde öngörülen amaçlarla hakların idaresini sağlamak üzere kurulan meslek birlikleri;</template>
              <mvz-bent no="1.">
                <template>Temsil ettikleri eser, icra, fonogram ve yapımlar ile üyelerine ilişkin tüm bilgileri Bakanlığa bildirmek ve ilgili kişilere açık bu bildirimi her üç ayda bir güncellemekle,</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Üyesi olan hak sahiplerinin faaliyetlerinden kaynaklanan haklarının idaresini hakkaniyete uygun koşullarda sağlamakla,</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Üyelerinin haklarının idaresine ilişkin faaliyetlerinden elde ettikleri gelirleri, dağıtım plânlarına uygun olarak hak sahiplerine dağıtmakla,</template>
              </mvz-bent>
              <mvz-bent no="4.">
                <template>Yazılı talepte bulunan ilgili kişilere, temsil ettikleri eser, icra, fonogram ve yapımlar ile ilgili bilgileri vermekle,</template>
              </mvz-bent>
              <mvz-bent no="5.">
                <template>Sözleşme yapılırken idare ettikleri haklara ilişkin olarak hakkaniyete uygun davranmakla, kendi maddî ve/veya manevî menfaatleri bakımından gerekli gördükleri indirim veya ödeme kolaylıklarını sağlamakla,</template>
              </mvz-bent>
              <mvz-bent no="6.">
                <template>Sözleşme yapılabilmesi için idaresini sağladıkları haklara ilişkin ücret tarifelerini süresinde belirlemek ve belirlenen tarifeleri ve bu tarifelerdeki her türlü değişikliği süresinde duyurmakla,</template>
              </mvz-bent>
              <mvz-bent no="7.">
                <template>Hesaplarını yeminli malî müşavirlere onaylatmakla,</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>Yükümlüdürler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yukarıdaki fıkranın radyo-televizyon kuruluşlarının yayınları bakımından uygulanmasında Radyo ve Televizyon Üst Kurulu kayıtları esas alınır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Tarifelerin tespit edilmesinde; tarifelerin uluslararası uygulamaların ülkenin ekonomik ve toplumsal koşullarına uyarlanabilirliği göz önünde bulundurularak makul seviyede belirlenmesi ile teknolojik alandaki değişimlerin yanı sıra eser, icra, fonogram, yapım ve yayınların yaratıldığı ve kullanıldığı sektörlerin yapısını tahrip edici, üretimi ve kullanımı engelleyici ve genel kabul görmüş uygulamalara zarar verici bir etki yaratılmaması, rekabeti bozucu şartlar oluşturulmaması, yapılan sınıflandırma, ilgili sektörlerdeki ürün fiyatları ve bu sektörlerin gayrisafi millî hâsıladaki payı, eser, icra, fonogram, yapım ve yayınların kullanım ve/veya iletim sıklığı, birim fiyat veya götürü usulü ödeme, ödeme plânı ve benzeri hususlar esas alınır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Aynı alanda ve/veya sektörde faaliyet gösteren birlikler, tarife tespitinde, sözleşme yapılmasında ve bu Kanunun uygulanması ile ilgili diğer iş ve işlemlerde birlikte hareket edebilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Ortak tarife yapılmış olması halinde, aynı alanda faaliyet gösteren meslek birlikleri, tarifelere esas olmak üzere her takvim yılının başında, alandaki temsil kabiliyetleri ile temsil ettikleri eser, icra, fonogram, yapım ve yayınlara ilişkin kullanım oranlarını tespit ederek Bakanlığa bildirmek zorundadırlar. Bu oranların tespitinde anlaşma sağlanamaması ve/veya bu oranların Bakanlığa bildirilmemesi halinde, Bakanlıkça oluşturulacak bir komisyon bu tespiti yapar. Bu tespit yapılıncaya kadar, sözleşme yapmış kullanıcılar, ödemeleri gereken meblağı, Bakanlığın talebi üzerine mahkemece belirlenmiş tevdi mahalline yatırırlar. Burada toplanan meblağ, komisyon çalışma giderleri mahsup edildikten sonra, ilgili meslek birlikleri arasında, komisyonca tespit edilen orana ya da herhangi bir aşamada, birliklerin aralarında anlaşmaları halinde, mutabakata vardıkları kullanım oranına göre paylaştırılır. Komisyon Bakanlık, Rekabet Kurumu ve ilgili meslek birliklerini temsilen birer kişiden oluşur. Bakanlık temsilcisi aynı zamanda komisyon başkanıdır. Komisyon kararlarına yargı yolu açık olup, görevli mahkeme ilgili ihtisas mahkemesidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Bu maddede belirtilen esaslar çerçevesinde yapılması gereken bildirimlere ilişkin yükümlülüklerini yerine getirmediği belirlenen meslek birliklerinin dağıtıma ilişkin hesabına Bakanlıkça, mahkemeden yükümlülüklerini yerine getirinceye kadar tedbir konulması istenebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Meslek birliğine üye eser veya bağlantılı hak sahiplerinin alenileşmiş veya yayımlanmış tüm eser, icra, fonogram, yapım ve yayınlarına ilişkin haklarının takibi meslek birliğine verilecek yetki belgesine göre yapılır. Yetki belgesine ilişkin usul ve esaslar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Meslek birliklerinin denetimi">
          <mvz-madde no="42/B" başlık="">
            <mvz-fıkra no="1">
              <template>Meslek birlikleri, idarî ve malî açıdan Bakanlığın denetimine tâbidir. Bakanlık, meslek birliklerinin bu Kanunla belirlenmiş görev ve yükümlülükleri yerine getirip getirmediklerini her zaman kendisi denetleyebileceği gibi bu denetimin bağımsız denetim kuruluşlarına yaptırılmasını meslek birliklerinden de isteyebilir. Bu kuruluşlarca yapılan denetimlere ilişkin raporların bir örneği Bakanlığa gönderilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Denetimler sırasında, denetim yapmakla görevlendirilenler tarafından istenecek her türlü defter, belge ve bilgilerin ibraz edilmesi veya verilmesi, kasa veya veznenin kontrol ettirilmesi, yönetim yerleri, şubeler ve eklentilerine girme gibi taleplerin yerine getirilmesi zorunludur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Meslek birlikleri tarafından;</template>
              <mvz-bent no="1.">
                <template>Bu Kanunun 42 ve 42/A maddeleri ile bu maddede belirlenen görev ve yükümlülüklerin yerine getirilmediği,</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Sözleşmelere uygun tahsilat veya dağıtımın yapılmadığı ya da yanlış ve haksız dağıtım yapıldığı,</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Tarifelerin bu Kanunun 42/A maddesinin üçüncü fıkrasında belirlenen esaslara göre düzenlenmediği,</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>Tespit edildiği takdirde, bu birlikler Bakanlıkça yazılı olarak bir defa uyarılır, uyarının tebliği tarihinden itibaren otuz gün içinde kusurun giderilmemesi halinde, meslek birliği ikinci kez uyarılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Yukarıdaki fıkrada bahsi geçen kusurların ikinci uyarıyı takip eden otuz gün içinde de giderilmemesi veya yapılan denetimlerde, birlik kayıtlarında ve diğer iş ve işlemlerinde mevzuata aykırılık tespit edilmesi halinde, Bakanlık en geç üç ay içinde olağanüstü genel kurul yapmak üzere üyeleri davet eder. Olağanüstü genel kurul yapılıncaya kadar, birliğin iş ve işlemlerinde suiistimali görülenler tedbiren işten el çektirilir, Bakanlıkça yerine atama yapılır veya sırası gelen yedek üye göreve çağrılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Bu Kanunun 42 ve 42/A maddeleri ile bu madde hükümleri, 42 nci madde çerçevesinde kurulacak federasyonlar için de uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="4" başlık="Eser, icra, fonogram ve yapımların yayınlanmasına ve/veya iletilmesine ilişkin esaslar">
          <mvz-madde no="43" başlık="">
            <mvz-fıkra no="1">
              <template>Radyo-televizyon kuruluşları, uydu ve kablolu yayın kuruluşları ile mevcut veya ileride bulunacak teknik imkânlardan yararlanarak yayın ve/veya iletim yapacak kuruluşlar, yayınlarında yararlanacakları opera, bale, tiyatro ve benzeri sahneye konmuş eserlerle ilgili olarak hak sahiplerinden önceden izin almak zorundadırlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu kuruluşlar sahneye konmuş eserler dışında kalan eser, icra, fonogram ve yapımlar için ilgili alan meslek birlikleri ile 52 nci maddeye uygun sözleşme yaparak izin almak, söz konusu yayın ve/veya iletimlere ilişkin ödemeleri bu birliklere yapmak ve kullandıkları eser, icra, fonogram ve yapımlara ilişkin listeleri bu birliklere bildirmek zorundadırlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>3984 sayılı Radyo ve Televizyonların Kuruluş ve Yayınları Hakkında Kanun çerçevesinde faaliyet gösteren radyo-televizyon kuruluşları Radyo ve Televizyon Üst Kurulu tarafından, anılan Kanun dışında kalan ve yayın ve/veya iletim yapan diğer kuruluşlar ise Bakanlık tarafından sınıflandırılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Faaliyet gösterdikleri sektörlerde eser sahipleri ve/veya bağlantılı hak sahipleri meslek birlikleri, yapılan sınıflandırmaya bağlı olarak eser, icra, fonogram ve yapımların yayın ve/veya iletiminden kaynaklanan ödemelere ilişkin tarifeleri tespit ederler. Meslek birlikleri ile kuruluşlar arasındaki sözleşmeler, bu tarife bedelleri veya taraflarca yapılan müzakereler sonucu belirlenecek bedeller üzerinden yapılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Meslek birliklerinin temsil ettikleri eser, icra, fonogram ve yapımlar ile üyelerine ilişkin bildirim zorunluluğu, tarifelerin belirlenmesi, duyurulması, müzakere edilmesi, sözleşme yapılması, uzlaşmazlıkların halli ve diğer hususlarda bu Kanunun 41 inci maddesinin dört ilâ onüçüncü fıkraları uygulanır. Ancak yayın ve/veya iletim yapan kuruluşlar bakımından 41 inci maddenin altıncı fıkrasının son cümlesinin uygulanması zorunlu değildir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Ayrıca, 41 inci maddenin 10 uncu fıkrasının uygulanması bakımından, Türkiye Radyo Televizyon Kurumu, yayınlarında yer verdiği eser, icra, fonogram ve yapımları her üç ayda bir meslek birliklerince belirlenen yıllık tarifenin 1/4'ünü yatırmak suretiyle kullanabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="5" başlık="Fikir ve sanat eserlerinin işaretlenmesi">
          <mvz-madde no="44" başlık="">
            <mvz-fıkra no="1">
              <template>Fikrî mülkiyet haklarının korunması ve etkin bir şekilde takibinin sağlanması amacıyla, sadece süreli yayınlar basan yerler dışında, fikir ve sanat eserlerinin tespit edilmesi ve çoğaltılmasına ilişkin materyalleri üreten ve/veya bu materyallerin dolum, çoğaltım ve satışını yapan veya herhangi bir şekilde yayan   ve umuma arz eden yerler, Bakanlıkça ücret mukabili sertifikalandırılır. Bakanlıkça belirlenen yerler, Bakanlıkça onaylanmış bir yazılım ile Bakanlıkça belirlenecek kriterlere uygun bir donanımı bulundurmak, gerekli alt yapıyı oluşturmak ve gerçekleştirdikleri işlemleri her takvim yılı itibarıyla Bakanlığa bildirmek zorundadır. Bu yerler ve malî hak sahipleri ayrıca, Bakanlıkça gerekli görülecek işaret ve seri numaraları ile uluslararası standartlara uygun kodları, taşıyıcı materyaller üzerinde bulundurmakla müştereken yükümlüdürler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Her türlü boş video kaseti, ses kaseti, bilgisayar disketi, CD, DVD gibi taşıyıcı materyaller ile, fikir ve sanat eserlerinin çoğaltılmasına yarayan her türlü teknik cihazı ticari amaçlı imal veya ithal eden gerçek ve tüzel kişiler, imalat veya ithalat bedeli üzerinden yüzde üçü geçmemek üzere Cumhurbaşkanı kararıyla belirlenecek orandaki miktarı keserek, ay içinde topladıkları meblağı, sonraki ayın en geç yarısına kadar Kültür Bakanlığı adına bir ulusal bankada açılacak özel hesaba yatırmakla yükümlüdürler.  Özel hesapta toplanan bu tutarların dörtte biri Kültür ve Turizm Bakanlığı Merkez Saymanlığı hesabına aktarılır ve bütçeye gelir kaydedilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bu hesapta kalan miktarlar fikrî mülkiyet sisteminin güçlendirilmesi ile kültürel ve sanatsal faaliyetlerin yürütülmesi amacıyla kullanılır. Bu hesapta kalan miktarın dağıtımı ve kullanımına ilişkin usul ve esaslar Kültür ve Turizm Bakanlığınca çıkarılacak bir yönetmelikle belirlenir. Yurt içindeki ve yurt dışındaki kültür mirasının korunmasına yönelik faaliyetler için Bakanlık bütçesine gerekli ödenek konulur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar ile alınacak ücretler Bakanlıkça çıkarılacak bir yönetmelikle belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="6" başlık="Güzel sanat eserlerinin satış bedellerinden pay verilmesi">
          <mvz-madde no="45" başlık="">
            <mvz-fıkra no="1">
              <template>Mimarî eserler hariç olmak üzere, bu Kanunun 4 üncü maddesinde sayılan güzel sanat eserlerinin asılları ile eser sahibinin kendisinin sınırlı sayıda meydana getirdiği veya eser sahibinin kontrolünde ve izniyle meydana getirilmiş ve eser sahibi tarafından imzalanmış veya başka bir şekilde işaretlenmiş olmaları nedeniyle özgün eser olduğu kabul edilen kopyaları, 2 nci maddenin (1) numaralı bendinde ve 3 üncü maddede sayılıp da yazarlarla bestecilerin el yazısıyla yazılmış eserlerinin asıllarından biri, eser sahibi veya mirasçıları tarafından bir defa satıldıktan sonra, koruma süresi içinde, bir sergide veya açık artırmada yahut bu gibi eşyayı satan bir mağazada veya başka şekillerde satış konusu olarak el değiştirdikçe, bu satış bedeli ile bir önceki satış bedeli arasında açık bir nispetsizlik bulunması halinde, her satışta, satışı gerçekleştiren gerçek veya tüzel kişi, bedel farkından münasip bir payı eser sahibine, o ölmüşse miras hükümlerine göre ikinci dereceye kadar  yasal mirasçılarına ve eşine, bunlar da yoksa ilgili alan meslek birliğine Cumhurbaşkanı kararıyla belirlenecek usul ve esaslar çerçevesinde ödemekle yükümlüdür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kararda:</template>
              <mvz-bent no="1.">
                <template>Bedel farkının yüzde onunu geçmemek şartiyle farkın nispetine göre tesbit edilecek bir pay tarifesi;</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Bedeli kararda tesbit edilecek miktarı aşmıyan satışların pay vermek borcundan muaf tutulacağı;</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Eser nevileri itibariyle mesleki birliğin hangi kolunun ilgili sayılabileceği;</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>gösterilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Satışın vukubulduğu müessese sahibi satıcı ile birlikte müteselsilen mesuldür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Cebri satış hallerinde pay ancak diğer alacaklar tamamen ödendikten sonra ödenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Pay verme borcunun zamanaşımı, bu borcun doğumunu intaç eden satıştan itibaren beş yıldır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="7" başlık="Devletin faydalanma salahiyeti">
          <mvz-madde no="46" başlık="">
            <mvz-fıkra no="1">
              <template>Çoğaltma ve yayımı eser sahibi tarafından açıkça men edilmemiş olan ve umumi kütüphane, müze ve benzeri müesseselerde saklı bulunan henüz yayımlanmamış veya alenileşmemiş eserler, mali haklarla ilgili koruma süresi dolmuş olmak şartıyla, bulunduğu kamu kurum ve kuruluşuna ait olur. Bunlardan kamu kurum ve kuruluşları ile bilimsel vesair amaçla yararlanmak isteyen kişi ve kuruluşların izin alacakları merci ve bunlardan alınacak ücretlerle bu ücretlerin hangi kültürel gayelerde sarfedileceği ve diğer hususlar, Cumhurbaşkanınca çıkarılan yönetmelikle belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="8" başlık="Kamuya maletme">
          <mvz-madde no="47" başlık="">
            <mvz-fıkra no="1">
              <template>Bu hususta karar verilebilmesi için eserin, Türkiye’de veya Türkiye dışında Türk vatandaşları tarafından vücuda getirilmiş olması gerekir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Cumhurbaşkanı kararında;</template>
              <mvz-bent no="1.">
                <template>Eser ve sahibinin adı,</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Hakları kullanacak makam veya müessese,</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Hak sahiplerine, talep üzerine ödenecek bedelin nasıl belirleneceği ve bu bedelin hangi kurum tarafından ödeneceği,</template>
              </mvz-bent>
              <mvz-bent no="4.">
                <template>Eserden gelir elde edilmesi hâlinde bu gelirin hangi gayelere tahsis edileceği,</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>yazılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Cumhurbaşkanı kararında belirtilen eserin, topluma ulaşması sağlanacak şekilde yayımlanması zorunludur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Sözleşme ve Tasarruflar">
    <mvz-b1 no="A" başlık="Hayatta vaki tasarruflar">
      <mvz-b2 no="I" başlık="Asli iktisap">
        <mvz-madde no="48" başlık="">
          <mvz-fıkra no="1">
            <template>Eser sahibi veya mirasçıları kendilerine kanunen tanınan mali hakları süre, yer ve muhteva itibariyle mahdut veya gayrimahdut, karşılıklı veya karşılıksız olarak başkalarına devredebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mali hakları sadece kullanma salahiyeti de diğer bir kimseye bırakılabilir. (Ruhsat).</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukardaki fıkralarda sayılan tasarruf muameleleri henüz vücuda getirilmemiş veya tamamlanacak olan bir esere taallük etmekte ise batıldır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Devren iktisap">
        <mvz-madde no="49" başlık="">
          <mvz-fıkra no="1">
            <template>Eser sahibi veya mirasçılarından mali bir hak veya böyle bir hakkı kullanma ruhsatını iktisap etmiş olan bir kimse, ancak bunların yazılı muvafakatiyle bu hakkı veya kullanma ruhsatını diğer birine devredebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İşleme hakkının devrinde, devren iktisap eden kimse hakkında da eser sahibi veya mirasçılarının aynı suretle muvafakatı şarttır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Sözleşmeler">
        <mvz-b3 no="1" başlık="Vücuda getirilecek eserler">
          <mvz-madde no="50" başlık="">
            <mvz-fıkra no="1">
              <template>48 ve 49 uncu maddelerde sayılan tasarruf muamelelerine dair taahhütler, eser henüz vücuda getirilmeden önce yapılmış olsa dahi muteberdir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Eser sahibinin ileride vücuda getireceği eserlerin bütününe veya muayyen bir nevi'ine taallük eden bu kabil taahhütleri taraflardan her biri, ihbar tarihinden bir yıl sonra hüküm ifade etmek üzere feshedebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Eser tamamlanmadan önce, eser sahibi ölür veya tamamlama kabiliyetini zayi eder, yahut kusuru olmaksızın eserin tamamlanması imkansız hale gelirse zikri geçen taahhütler kendiliğinden münfesih olur. Diğer tarafın iflas etmesi veya sözleşme uyarınca devraldığı mali hakları kullanmaktan aciz duruma düşmesi yahut kusuru olmaksızın kullanmanın imkansız hale gelmesi hallerinde de aynı hüküm caridir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="İlerideki faydalanma imkanları">
          <mvz-madde no="51" başlık="">
            <mvz-fıkra no="1">
              <template>İleride çıkarılacak mevzuatın eser sahibine tanıması muhtemel mali hakların devrine veya bunların başkaları tarafından kullanılmasına mütaallik sözleşmeler batıldır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İleride çıkarılacak mevzuatla mali hakların şümulünün genişletilmesi veya koruma süresinin uzatılmasından doğacak salahiyetlerden vazgeçmeyi yahut bunların devrini ihtiva eden sözleşmeler hakkında aynı hüküm caridir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="IV" başlık="Şekil">
        <mvz-madde no="52" başlık="">
          <mvz-fıkra no="1">
            <template>Mali haklara dair sözleşme ve tasarrufların yazılı olması ve konuları olan hakların ayrı ayrı gösterilmesi şarttır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="V" başlık="Tekeffül">
        <mvz-b3 no="1" başlık="Hakkın mevcut olmaması">
          <mvz-madde no="53" başlık="">
            <mvz-fıkra no="1">
              <template>Mali bir hakkı başkasına devreden veya kullanma ruhsatını veren kimse, iktisap edene karşı hakkın mevcudiyetini Borçlar Kanununun 169 ve 171 inci maddeleri hükmünce zamindir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Haksız fiillerden ve sebepsiz mal iktisabından doğan talepler mahfuzdur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Salahiyetin mevcut olmaması">
          <mvz-madde no="54" başlık="">
            <mvz-fıkra no="1">
              <template>Mali bir hakkı yahut kullanma ruhsatını devre salahiyetli olmıyan kimseden iktisap eden, hüsnüniyet sahibi olsa bile himaye görmez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Salahiyeti olmaksızın mali bir hakkı başkasına devreden veya kullanma ruhsatını veren kimse; salahiyeti bulunmadığına diğer tarafın vakıf olduğunu veya vakıf olması lazımgeldiğini ispat etmedikçe tasarrufun hükümsüz kalmasından doğan zararı tazminle mükelleftir. Kusur halinde mahkeme; hakkaniyet gerektiriyorsa daha geniş bir tazminata hükmedebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Haksız fiillerden ve sebepsiz mal iktisabından doğan talepler mahfuzdur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="VI" başlık="Yorum kaideleri">
        <mvz-b3 no="1" başlık="Şümul">
          <mvz-madde no="55" başlık="">
            <mvz-fıkra no="1">
              <template>Aksi kararlaştırılmış olmadıkça mali bir hakkın devri veya bir ruhsatın verilmesi eserin tercüme veya sair işlenmelerine şamil değildir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Ruhsat">
          <mvz-madde no="56" başlık="">
            <mvz-fıkra no="1">
              <template>Ruhsat; mali hak sahibinin başkalarına da aynı ruhsatı vermesine mani değilse (basit ruhsat), yalnız bir kimseye mahsus olduğu takdirde (tam ruhsat) tır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kanun veya sözleşmeden aksi anlaşılmadıkça her ruhsat basit sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Basit ruhsatlar hakkında hasılat kirasına, tam ruhsatlar hakkında intifa hakkına dair hükümler uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Mülkiyetin intikali">
          <mvz-madde no="57" başlık="">
            <mvz-fıkra no="1">
              <template>Asıl veya çoğaltılmış nüshalar üzerindeki mülkiyet hakkının devri, aksi kararlaştırılmış olmadıkça, fikri hakların devrini ihtiva etmez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bir güzel sanat eseri üzerinde çoğaltma hakkını haiz olan bir kimseden kalıp ve sair çoğaltma aletlerinin zilyedliğini iktisap eden kimse, aksi kararlaştırılmamışsa, çoğaltma hakkını da iktisap etmiş sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3" durum="mülga">
              <template></template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="VII" başlık="Cayma hakkı">
        <mvz-madde no="58" başlık="">
          <mvz-fıkra no="1">
            <template>Mali bir hak veya ruhsat iktisap eden kimse, kararlaştırılan süre içinde ve eğer bir süre tayin edilmemişse icabı hale göre münasip bir zaman içinde hak ve salahiyetlerden gereği gibi faydalanmaz ve bu yüzden eser sahibinin menfaatleri esaslı surette ihlal edilirse eser sahibi sözleşmeden cayabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cayma hakkını kullanmak isteyen eser sahibi sözleşmedeki hakların kullanılması için noter vasıtasiyle diğer tarafa münasip bir mehil vermeye mecburdur. Hakkın kullanılması, iktisap eden kimse için imkansız olur veya tarafından reddedilir yahut bir mehil verilmesi halinde eser sahibinin menfaatleri esaslı surette tehlikeye düşmekte ise mehil tayinine lüzum yoktur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Verilen mehil neticesiz geçerse veya mehil tayinine lüzum yoksa noter vasıtasiyle yapılacak ihbar ile cayma tamam olur. Cayma ihbarının tebliğinden itibaren 4 hafta geçtikten sonra caymaya karşı itiraz davası açılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İktisap edenin mali hakkı kullanmamakta kusuru yoksa veya eser sahibinin kusuru daha ağır ise hakkaniyet gerektiği hallerde iktisap eden, münasip bir tazminat istiyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Cayma hakkından önceden vazgeçme caiz olmadığı gibi bu hakkın dermeyanını iki yıldan fazla bir süre için meneden takyitler de hükümsüzdür.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="VIII" başlık="Hakkın eser sahibine avdeti">
        <mvz-madde no="59" başlık="">
          <mvz-fıkra no="1">
            <template>Eser sahibi veya mirasçıları mali bir hakkı muayyen bir gaye zımnında yahut muayyen bir süre için devretmişlerse gayenin ortadan kalkması veya sürenin geçmesiyle ilgili hak, sahibine avdet eder. Bu hüküm, başkasına devrine sözleşme ile müsaade edilmemiş olan mali bir hakkı iktisap eden kimsenin ölümü yahut iflası halinde cari değildir; meğer ki, işin mahiyeti icabı, hakkın kullanılması, iktisap edenin şahsına bağlı bulunsun.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Muayyen bir gaye zımnında veya muayyen bir süre için verilen ruhsatlar birinci fıkrada sayılan hallerde son bulur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Vazgeçme">
      <mvz-madde no="60" başlık="">
        <mvz-fıkra no="1">
          <template>Eser sahibi yahut mirasçıları, kendilerine kanunen tanınan mali haklardan, önceden vakı tasarruflarını ihlal etmemek şartiyle, bir resmi senet tanzimi ve bu hususun Resmi Gazete'de ilanı suretiyle vazgeçebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Vazgeçme, ilan tarihinden başlıyarak koruma süresinin bitmesi halindeki hukuki neticeleri doğurur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Haciz ve rehin">
      <mvz-b2 no="I" başlık="Caiz olmayan haller">
        <mvz-madde no="61" başlık="">
          <mvz-fıkra no="1">
            <template>İcra ve İflas Kanununun 24 ve 30 uncu maddelerinin hükümleri mahfuz kalmak şartiyle:</template>
            <mvz-bent no="1.">
              <template>Eser sahibinin veya mirasçılardan birinin mülkiyeti altında bulunan henüz alenileşmemiş bir eserin müsvedde veya asılları;</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Sinema eserleri hariç olmak üzere birinci bentte zikredilen eserler üzerindeki mali haklar;</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Eser sahibinin, mali haklara dair hukuki muamelelerden doğan paradan gayrı alacakları;</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Kanuni veya akdi bir rehin hakkının, cebri icranın veya hapis hakkının konusu olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Caiz olan haller">
        <mvz-madde no="62" başlık="">
          <mvz-fıkra no="1">
            <template>Aşağıdaki hükümler dairesinde:</template>
            <mvz-bent no="1.">
              <template>Alenileşmiş bir eserin müsveddesi veya aslı;</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Yayımlanmış bir eserin çoğaltılmış nüshaları;</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Eser sahibinin korunmaya layık olan manevi menfaatlerini ihlal etmemek şartiyle alenileşmiş bir eser üzerindeki mali hakları;</template>
            </mvz-bent>
            <mvz-bent no="4.">
              <template>Eser sahibinin mali haklara dair hukuki muamelelerden doğan para alacakları;</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Kanuni veya akdi bir rehin hakkının, cebri icranın yahut hapis hakkının konusunu teşkil edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada sayılan konulara dair rehin sözleşmesinin muteber olması için yazılı şekilde yapılması lazımdır. Sözleşmede rehin olarak verilenler ayrı ayrı gösterilmelidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Güzel sanat eserlerine ait kalıplar ve sair çoğaltma vasıtaları, birinci fıkranın üçüncü bendinde yazılı mali haklar üzerinde cebri icra tatbikı için lüzumlu görüldüğü nispette zilyed olan kimselerden geçici olarak alınabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Mimarlık eserleri hariç olmak üzere güzel sanat eserlerinin asılları ve eser sahibine yahut mirasçılarına ait musiki, ilim ve edebiyat eserlerinin müsveddeleri, birinci fıkranın üçüncü bendinde yazılı mali haklar üzerinde cebri icra tatbikı için lüzumlu görüldüğü nispette zilyed olan kimselerden geçici olarak alınabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="Ç" başlık="Miras">
      <mvz-b2 no="I" başlık="Genel olarak">
        <mvz-madde no="63" başlık="">
          <mvz-fıkra no="1">
            <template>Bu Kanunun tanıdığı mali haklar miras yolu ile intikal eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mali haklar üzerinde ölüme bağlı tasarruflar yapılması caizdir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Müşterek eser sahiplerinden birinin ölümü">
        <mvz-madde no="64" başlık="">
          <mvz-fıkra no="1">
            <template>Eseri birlikte vücuda getirenlerden biri, eserin tamamlanmasından yahut alenileşmesinden önce ölürse hissesi, diğerleri arasında taksime uğrar. Bunlar, ölenin mirasçılarına münasip bir bedel ödemekle mükelleftirler. Miktar üzerinde uzlaşamazlarsa bunu mahkeme tayin eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eseri birlikte vücuda getirenlerden biri eserin alenileşmesinden sonra ölürse diğerleri, ölenin mirasçılariyle birliği devam ettirip ettirmemekte serbesttirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Devama karar vermeleri halinde, sağ kalan eser sahipleri mirasçılardan birliğe karşı haklarının kullanılması hususunda bir temsilci tayinini talep edebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Devama karar verilmediği takdirde birinci fıkra hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Mirasçıların birden fazla oluşu">
        <mvz-madde no="65" başlık="">
          <mvz-fıkra no="1">
            <template>Eser sahibinin terekesinde bu kanunun tanıdığı mali haklar mevcut olupta Medeni Kanunun 581 inci maddesi uyarınca bir temsilci tayin edilmişse, temsilci, bu haklar üzerinde yapacağı muameleler için mirasçıların kararını almaya mecburdur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Hukuk ve Ceza Davaları">
    <mvz-b1 no="A" başlık="Hukuk davaları">
      <mvz-b2 no="I" başlık="Tecavüzün ref'i davası">
        <mvz-b3 no="1" başlık="Genel olarak">
          <mvz-madde no="66" başlık="">
            <mvz-fıkra no="1">
              <template>Manevi ve mali hakları tecavüze uğrıyan kimse tecavüz edene karşı  tecavüzün ref'ini dava edebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Tecavüz, hizmetlerini ifa ettikleri sırada bir işletmenin temsilcisi veya müstahdemleri tarafından yapılmışsa işletme sahibi hakkında da dava açılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Tecavüz edenin veya ikinci fıkrada yazılı kimselerin kusuru şart değildir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Mahkeme, eser sahibinin manevi ve mali haklarını, tecavüzün şümulünu, kusurun olup olmadığını, varsa ağırlığını ve tecavüzün ref'i halinde tecavüz edenin düçar olması muhtemel zararları takdir ederek halin icabına göre tecavüzün ref'i için lüzumlu göreceği tedbirlerin tatbikına karar verir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Eser sahibi, ikamet ettiği yerde de tecavüzün ref'i ve men davası açabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Manevi haklara tecavüz halinde">
          <mvz-madde no="67" başlık="">
            <mvz-fıkra no="1">
              <template>Henüz alenileşmemiş bir eser, sahibinin rızası olmaksızın veya arzusuna aykırı olarak umuma arzedildiği takdirde tecavüzün ref'i davası, ancak umuma arz keyfiyetinin çoğaltılmış nüshaların yayımlanması suretiyle vakı olması halinde açılabilir. Aynı hüküm, esere, sahibinin arzusuna aykırı olarak adının konulduğu hallerde de caridir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Eser üzerinde sahibinin adı hiç konulmamış veya yanlış konulmuş yahut konulan ad iltibasa meydan verecek mahiyette olupta eser sahibi 15 inci maddede zikredilen tesbit davasından başka tecavüzün ref'ini talep etmişse, tecavüz eden gerek aslına, gerek tedavülde bulunan çoğaltılmış nüshalar üzerine eser sahibinin adını derç etmeye mecburdur. Masrafı tecavüz edene ait olmak üzere, hükmün en fazla 3 gazetede ilanı talep edilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>32, 33, 34, 35, 36, 39 ve 40 ıncı maddelerde sayılan hallerde yanlış veya kifayetsiz kaynak tasrih edilmiş veyahut hiç kaynak gösterilmemişse ikinci fıkra hükmü uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Eser haksız olarak değiştirilmiş ise hak sahibi aşağıdaki taleplerde bulunabilir:</template>
              <mvz-bent no="1.">
                <template>Eser sahibi, eserin değiştirilmiş şekilde çoğaltılmasının yayım ve temsilinin, yayım ve temsilinin, radyo ile yayımının menedilmesini ve tecavüz edenin, tedavülde bulunan çoğaltılmış nüshalardaki değişiklikleri düzeltmesini veya bunların eski haline getirilmesini talep edebilir. Değişiklik, eserin, gazete, dergi veya radyo ile yayımı sırasında yapılmışsa eser sahibi, masrafı tecavüz edene ait olmak üzere, eseri değiştirilmiş şekilde yayımlamış olan bütün gazete, dergi ve radyo idarelerinden değişikliğin ilan yolu ile düzeltilmesini talep edebilir.</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Güzel sanat eserlerinde eser sahibi asıldaki değişikliğin kendisi tarafından yapılmadığını veya eserdeki adının kaldırılmasını yahut değiştirilmesini talep edebilir. Eski halin iadesi mümkün ise değişikliğin izalesi ammenin veya malikin menfaatlerini esaslı surette haleldar etmiyorsa eser sahibi eseri eski hale getirebilir.</template>
              </mvz-bent>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Mali haklara tecavüz halinde">
          <mvz-madde no="68" başlık="">
            <mvz-fıkra no="1">
              <template>Eseri, icrayı, fonogramı veya yapımları hak sahiplerinden bu Kanuna uygun yazılı izni almadan, işleyen, çoğaltan, çoğaltılmış nüshaları yayan, temsil eden veya hertürlü işaret, ses veya görüntü nakline yarayan araçlarla umuma iletenlerden, izni alınmamış hak sahipleri sözleşme yapılmış olması halinde isteyebileceği bedelin veya bu Kanun hükümleri uyarınca tespit edilecek rayiç bedelin en çok üç kat fazlasını isteyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İzinsiz çoğaltılan kopyalar satışa çıkarılmamışsa hak sahibi çoğaltılmış kopyaların, çoğaltmaya yarayan film, kalıp ve benzeri araçların imhasını veya üretim maliyet fiyatını geçmeyecek uygun bir bedel karşılığında kendisine verilmesini ya da sözleşme olması durumunda isteyebileceği miktarın üç kat fazlasını talep edebilir. Bu husus, izinsiz çoğaltanın hukuki sorumluluğunu ortadan kaldırmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>İzinsiz çoğaltılan kopyalar satışa çıkarılmışsa hak sahibi, tecavüz edenin elinde bulunan nüshalar hakkında ikinci fıkradaki şıklardan birini kullanabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>İkinci ve üçüncü fıkraların eser sahibinden başka hak sahiplerince uygulanabilmesi için eser sahibinin bu Kanunun 52 nci maddesine uygun yazılı çoğaltma izni aranır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Hak sahiplerinden biri, ikinci ve üçüncü fıkralar uyarınca talepte bulunduklarında Ceza Muhakemesi Kanununun el koymaya ilişkin hükümleri delil elde etmek amacı dışında uygulanmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Bedel talebinde bulunan kişi, tecavüz edene karşı onunla bir sözleşme yapmış olması halinde haiz olabileceği bütün hak ve yetkileri ileri sürebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Tecavüzün men'i davası">
        <mvz-madde no="69" başlık="">
          <mvz-fıkra no="1">
            <template>Mali veya manevi haklarında tecavüz tehlikesine maruz kalan eser sahibi muhtemel tecavüzün önlenmesini dava edebilir. Vakı olan tecavüzün devam veya tekrarı muhtemel görülen hallerde de aynı hüküm caridir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>66 ncı maddenin ikinci, üçüncü ve dördüncü fıkralarının hükümleri burada da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Tazminat davası">
        <mvz-madde no="70" başlık="">
          <mvz-fıkra no="1">
            <template>Manevi hakları haleldar edilen kişi, uğradığı manevi zarara karşılık manevi tazminat ödenmesi için dava açabilir. Mahkeme, bu para yerine veya bunlara ek olarak başka bir manevi tazminat şekline de hükmedebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mali hakları haleldar edilen kimse, tecavüz edenin kusuru varsa haksız fiillere mütaallik hükümler dairesinde tazminat talep edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci ve ikinci fıkralardaki hallerde, tecavüze uğrayan kimse tazminattan başka temin edilen karın kendisine verilmesini de istiyebilir. Bu halde 68 inci madde uyarınca talep edilen bedel indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Ceza davaları">
      <mvz-b2 no="I" başlık="Suçlar">
        <mvz-b3 no="1" başlık="Manevi, mali veya bağlantılı haklara tecavüz">
          <mvz-madde no="71" başlık="">
            <mvz-fıkra no="1">
              <template>Bu Kanunda koruma altına alınan fikir ve sanat eserleriyle ilgili manevi, mali veya bağlantılı hakları ihlal ederek:</template>
              <mvz-bent no="1.">
                <template>Bir eseri, icrayı, fonogramı veya yapımı hak sahibi kişilerin yazılı izni olmaksızın işleyen, temsil eden, çoğaltan, değiştiren, dağıtan, her türlü işaret, ses veya görüntü nakline yarayan araçlarla umuma ileten, yayımlayan ya da hukuka aykırı olarak işlenen veya çoğaltılan eserleri satışa arz eden, satan, kiralamak veya ödünç vermek suretiyle ya da sair şekilde yayan, ticarî amaçla satın alan, ithal veya ihraç eden, kişisel kullanım amacı dışında elinde bulunduran ya da depolayan kişi hakkında bir yıldan beş yıla kadar hapis veya adlî para cezasına hükmolunur.</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Başkasına ait esere, kendi eseri olarak ad koyan kişi altı aydan iki yıla kadar hapis veya adlî para cezasıyla cezalandırılır. Bu fiilin dağıtmak veya yayımlamak suretiyle işlenmesi hâlinde, hapis cezasının üst sınırı beş yıl olup, adlî para cezasına hükmolunamaz.</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Bir eserden kaynak göstermeksizin iktibasta bulunan kişi altı aydan iki yıla kadar hapis veya adlî para cezasıyla cezalandırılır.</template>
              </mvz-bent>
              <mvz-bent no="4.">
                <template>Hak sahibi kişilerin izni olmaksızın, alenileşmemiş bir eserin muhtevası hakkında kamuya açıklamada bulunan kişi, altı aya kadar hapis cezası ile cezalandırılır.</template>
              </mvz-bent>
              <mvz-bent no="5.">
                <template>Bir eserle ilgili olarak yetersiz, yanlış veya aldatıcı mahiyette kaynak gösteren kişi, altı aya kadar hapis cezası ile cezalandırılır.</template>
              </mvz-bent>
              <mvz-bent no="6.">
                <template>Bir eseri, icrayı, fonogramı veya yapımı, tanınmış bir başkasının adını kullanarak çoğaltan, dağıtan, yayan veya yayımlayan kişi, üç aydan bir yıla kadar hapis veya adlî para cezasıyla cezalandırılır.</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu Kanunun ek 4 üncü maddesinin birinci fıkrasında bahsi geçen fiilleri yetkisiz olarak işleyenler ile bu Kanunda tanınmış hakları ihlâl etmeye devam eden bilgi içerik sağlayıcılar hakkında, fiilleri daha ağır cezayı gerektiren bir suç oluşturmadığı takdirde, üç aydan iki yıla kadar hapis cezasına hükmolunur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Hukuka aykırı olarak üretilmiş, işlenmiş, çoğaltılmış, dağıtılmış veya yayımlanmış bir eseri, icrayı, fonogramı veya yapımı satışa arz eden, satan veya satın alan kişi, kovuşturma evresinden önce bunları kimden temin ettiğini bildirerek yakalanmalarını sağladığı takdirde, hakkında verilecek cezadan indirim yapılabileceği gibi ceza vermekten de vazgeçilebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="2" başlık="Teknolojik önlemleri etkisiz kılma">
          <mvz-madde no="72" başlık="">
            <mvz-fıkra no="1">
              <template>Bu Kanunda yer alan hakların korunması amacıyla eser, icra, fonogram, yapım ve yayınların kullanımının kontrolünü sağlamak üzere erişim kontrolü veya şifreleme gibi koruma yöntemi ya da çoğaltım kontrol mekanizması uygulamalarıyla sağlanan etkili teknolojik önlemleri etkisiz kılmaya yönelik;</template>
              <mvz-bent no="a">
                <template>Ürün ve araçları imal veya ithal eden, dağıtan, satan, kiraya veren veya ticari amaçla elinde bulunduranlar,</template>
              </mvz-bent>
              <mvz-bent no="b">
                <template>Ürün ve araçların reklam, pazarlama, tasarım veya uygulama hizmetlerini sunanlar,</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>altı aydan iki yıla kadar hapis cezasıyla cezalandırılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b3>
        <mvz-b3 no="3" başlık="Diğer suçlar">
          <mvz-madde no="73" başlık="" durum="mülga">
          </mvz-madde>
        </mvz-b3>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Fail">
        <mvz-madde no="74" başlık="" durum="mülga">
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Soruşturma ve kovuşturma">
        <mvz-madde no="75" başlık="">
          <mvz-fıkra no="1">
            <template>71 ve 72 nci maddelerde sayılan suçlardan dolayı soruşturma ve kovuşturma yapılması şikâyete bağlıdır. Yapılan şikâyetin geçerli kabul edilebilmesi için hak sahiplerinin veya üyesi oldukları meslek birliklerinin haklarını kanıtlayan belge ve sair delilleri Cumhuriyet başsavcılığına vermeleri gerekir. Bu belge ve sair delillerin şikâyet süresi içinde Cumhuriyet başsavcılığına verilmemesi hâlinde kovuşturmaya yer olmadığı kararı verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu Kanunda yer alan soruşturma ve kovuşturması şikâyete bağlı suçlar dolayısıyla başta Millî Eğitim Bakanlığı, Kültür ve Turizm Bakanlığı yetkilileri olmak üzere ilgili gerçek ve tüzel kişiler tarafından, eser üzerinde manevi ve malî hak sahibi kişiler şikâyet haklarını kullanabilmelerini sağlamak amacıyla durumdan haberdar edilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Şikâyet üzerine Cumhuriyet savcısı suç konusu eşya ile ilgili olarak 5271 sayılı Ceza Muhakemesi Kanunu hükümlerine göre elkoyma koruma tedbirinin alınmasına ilişkin gerekli işlemleri yapar. Cumhuriyet savcısı ayrıca, gerek görmesi hâlinde, hukuka aykırı olarak çoğaltıldığı iddia edilen eserlerin çoğaltılmasıyla sınırlı olarak faaliyetin durdurulmasına karar verebilir. Ancak, bu karar yirmidört saat içinde hâkimin onayına sunulur. Hâkim tarafından yirmidört saat içinde onaylanmayan karar hükümsüz kalır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Çeşitli hükümler">
      <mvz-b2 no="I" başlık="Görev ve ispat">
        <mvz-madde no="76" başlık="">
          <mvz-fıkra no="1">
            <template>Bu Kanunun düzenlediği hukuki ilişkilerden doğan dava ve işler ile bu Kanundan kaynaklanan ceza davalarında görevli mahkeme, Sınai Mülkiyet Kanununun 156 ncı maddesinin birinci fıkrasında belirtilen mahkemelerdir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu Kanun kapsamında açılacak hukuk davalarında mahkeme, davacının iddianın doğruluğu hakkında kuvvetli kanaat oluşturmaya yeter miktar delil sunması hâlinde, korunmakta olan eserler, fonogramlar, icralar, filmler ve yayınları kullananların, bu Kanunda öngörülen izin ve yetkileri aldıklarına dair belgeleri veya tüm yararlanılan eser, fonogram, icra, film ve yayınların listelerini sunmasını isteyebilir. Belirtilen belge veya listelerin sunulamaması tüm eser, fonogram, icra, film ve yayınların haksız kullanılmakta olduğuna karine teşkil eder.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="İhtiyati tedbirler ve gümrüklerde geçici olarak el koyma">
        <mvz-madde no="77" başlık="">
          <mvz-fıkra no="1">
            <template>Esaslı bir zararın veya ani bir tehlikenin yahut emrivakilerin önlenmesi için veya diğer her hangi bir sebepten dolayı zaruri ve bu hususta ileri sürülen iddialar kuvvetle muhtemel görülürse hukuk mahkemesi, bu Kanunla tanınmış olan hakları ihlal veya tehdide maruz kalanların ya da meslek birliklerinin talebi üzerine, davanın açılmasından önce veya sonra diğer tarafa bir işin yapılmasını veya yapılmamasını, işin yapıldığı yerin kapatılmasını veya açılmasını emredebileceği gibi, bir eserin çoğaltılmış nüshalarının veya hasren onu imale yarıyan kalıp ve buna benzer sair çoğaltma vasıtalarının ihtiyati tedbir yolu ile muhafaza altına alınmasına karar verebilir. Kararda, emre muhalefetin İcra ve İflas Kanununun 343 üncü maddesindeki cezai neticeleri doğuracağı açıklanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">

            <mvz-bent no="0">
              <template>Eser sahibinin manevi ve mali haklarına zarar vermemek kaydıyla ve eser sahibinin izniyle bir eseri özgün bir biçimde yorumlayan, tanıtan, anlatan, söyleyen, çalan ve çeşitli biçimlerde icra eden sanatçıların, bir icra ürünü olan veya sair sesleri ilk defa tespit eden fonogram yapımcıları ile radyo-televizyon kuruluşlarının aşağıda belirtilen komşu hakları vardır.</template>
