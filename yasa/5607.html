  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, kaçakçılık fiilleri ve yaptırımları ile kaçakçılığı önleme, izleme, araştırma usûl ve esaslarını belirlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yer alan;</template>
        <mvz-bent no="a">
          <template>Gümrük vergileri: Gümrük idaresi veya başka idarelerce, eşyanın ithali veya ihracına bağlı olarak uygulanan vergiler ile diğer malî yükümlülükleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Gümrüklenmiş değer: Uluslararası kıymet sözleşmesine göre belirlenecek; ithal eşyası için eşyanın CIF kıymeti ile gümrük vergileri toplamını, ihraç eşyası için FOB kıymeti ile gümrük vergileri toplamını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Akaryakıt: Benzin, gaz yağı, jet yakıtı, motorin, fuel-oil, sıvılaştırılmış petrol gazları, doğal gaz gibi akaryakıt ürünleri ile akaryakıt yerine kullanılan petrol türevleri ve bunların karışımları ile akaryakıt yerine kullanılan diğer ürünleri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Kaçakçılık Fiilleri">
    <mvz-madde no="3" başlık="Kaçakçılık suçları">
      <mvz-fıkra no="1">
        <template>Eşyayı, gümrük işlemlerine tabi tutmaksızın ülkeye sokan kişi, bir yıldan beş yıla kadar hapis ve on bin güne kadar adlî para cezası ile cezalandırılır. Eşyanın, gümrük kapıları dışından ülkeye sokulması halinde, verilecek ceza üçte birinden yarısına kadar artırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Eşyayı, aldatıcı işlem ve davranışlarla gümrük vergileri kısmen veya tamamen ödenmeksizin ülkeye sokan kişi, iki yıldan beş yıla kadar hapis ve on bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Transit rejimi çerçevesinde taşınan serbest dolaşımda bulunmayan eşyayı, rejim hükümlerine aykırı olarak gümrük bölgesinde bırakan kişi, bir yıldan üç yıla kadar hapis ve beş bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Belli bir amaç için kullanılmak veya işlenmek üzere ülkeye geçici ithalat ve dahilde işleme rejimi çerçevesinde getirilen eşyayı, hile ile yurt dışına çıkarmış gibi işlem yapan kişi, bir yıldan üç yıla kadar hapis ve beş bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Birinci ila dördüncü fıkralarda tanımlanan fiillerin işlenmesine iştirak etmeksizin, bunların konusunu oluşturan eşyayı, bu özelliğini bilerek ve ticarî amaçla satın alan, satışa arz eden, satan, taşıyan veya saklayan kişi, bir yıldan üç yıla kadar hapis ve beş bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Özel kanunları gereğince gümrük vergilerinden kısmen veya tamamen muaf olarak ithal edilen eşyayı, ithal amacı dışında başka bir kullanıma tahsis eden, satan veya devreden ya da bu özelliğini bilerek satın alan veya kabul eden kişi, altı aydan iki yıla kadar hapis ve beş bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İthali kanun gereği yasak olan eşyayı ülkeye sokan kişi, fiil daha ağır bir cezayı gerektiren suç oluşturmadığı takdirde, iki yıldan altı yıla kadar hapis ve yirmi bin güne kadar adlî para cezası ile cezalandırılır. İthali yasak eşyayı, bu özelliğini bilerek satın alan, satışa arz eden, satan, taşıyan veya saklayan kişi, aynı ceza ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>İhracı kanun gereği yasak olan eşyayı ülkeden çıkaran kişi, fiil daha ağır cezayı gerektiren başka bir suç oluşturmadığı takdirde bir yıldan üç yıla kadar hapis ve beş bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>İlgili kanun hükümlerine göre teşvik, sübvansiyon veya parasal iadelerden yararlanmak amacıyla ihracat gerçekleşmediği hâlde gerçekleşmiş gibi gösteren ya da gerçekleştirilen ihracata konu malın cins, miktar, evsaf veya fiyatını değişik gösteren kişi, bir yıldan beş yıla kadar hapis ve on bin güne kadar adlî para cezası ile cezalandırılır. Beyanname ve eki belgelerde gösterilen ile gerçekte ihraç edilen eşya arasında yüzde onu aşmayan bir fark bulunması halinde, sadece 27/10/1999 tarihli ve 4458 sayılı Gümrük Kanunu hükümlerine göre işlem yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Kaçakçılık suçunun konusunu oluşturan eşyanın akaryakıt ile tütün, tütün mamulleri, makaron, yaprak sigara kâğıdı, etil alkol, metanol ve alkollü içkiler olması halinde, yukarıdaki fıkralara göre verilecek cezalar yarısından iki katına kadar artırılır, ancak bu fıkranın uygulanması suretiyle verilecek ceza üç yıldan az olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Ulusal marker uygulamasına tabi olup da, Enerji Piyasası Düzenleme Kurumunun belirlediği seviyenin altında ulusal marker içeren veya hiç içermeyen akaryakıtı;</template>
        <mvz-bent no="a">
          <template>Ticari amaçla üreten, bulunduran veya nakleden,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Satışa arz eden veya satan,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu özelliğini bilerek ve ticari amaçla satın alan,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>kişi iki yıldan beş yıla kadar hapis ve yirmi bin güne kadar adli para cezası ile cezalandırılır. Ancak, marker içermeyen veya seviyesi geçersiz olan akaryakıtın kaçak olarak yurda sokulduğunun anlaşılması hâlinde, onuncu fıkra hükmüne istinaden cezaya hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Enerji Piyasası Düzenleme Kurumundan izin alınmadan; akaryakıt haricinde kalan solvent, madenî yağ, baz yağ, asfalt ve benzeri petrol ürünlerinden akaryakıt üreten veya bunları doğrudan akaryakıt yerine ikmal ederek üreten, satışa arz eden, satan, bulunduran, bu özelliğini bilerek ticarî amaçla satın alan, taşıyan veya saklayan kişi, iki yıldan beş yıla kadar hapis ve yirmi bin güne kadar adlî para cezası ile cezalandırılır.  Akaryakıt yerine kullanılan diğer ürünler yönünden de bu fıkra uyarınca cezaya hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Her türlü üretim, iletim ve dağıtım hatları dahil olmak üzere sıvı veya gaz halindeki hidrokarbonlarla, hidrokarbon türevi olan yakıtları nakleden boru hatlarından, depolarından veya kuyulardan kanunlara aykırı şekilde alınan ürünleri satışa arz eden, satan, bulunduran, bu özelliğini bilerek ticarî amaçla satın alan, taşıyan veya saklayan kişi, iki yıldan beş yıla kadar hapis ve yirmi bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="14">
        <template>Kaçak akaryakıt veya sahte ulusal marker elde etmeye, satmaya ya da herhangi bir piyasa faaliyetine konu etmeye yarayacak şekilde lisansa esas teşkil eden belgelerde belirlenenlere aykırı olarak sabit ya da seyyar tank, düzenek veya ekipman bulunduranlar iki yıldan beş yıla kadar hapis ve yirmi bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="15">
        <template>Ulusal markeri yetkisiz olarak üreten, satışa arz eden, satan, yetkisiz kişilerden satın alan, kabul eden, bu özelliğini bilerek nakleden veya bulunduranlar, iki yıldan beş yıla kadar hapis ve yirmi bin güne kadar adlî para cezası ile cezalandırılır. Ulusal markerin kimyasal özelliklerini taşımasa bile, bu madde yerine kullanılmak amacıyla üretilen kimyasal terkipler hakkında da bu fıkra hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="16">
        <template>Tütün mamulleri, makaron, yaprak sigara kâğıdı, etil alkol, metanol ve alkollü içkilerin ambalajlarına kamu kurumlarınca uygulanan bandrol, etiket, hologram, pul, damga veya benzeri işaretlerin taklitlerini imal eden veya ülkeye sokanlar ile bunları bilerek bulunduran, nakleden, satan ya da kullananlar üç yıldan altı yıla kadar hapis ve yirmi bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="17">
        <template>Tütün mamulleri, makaron, yaprak sigara kâğıdı, etil alkol, metanol ve alkollü içkilerin ambalajlarına kamu kurumlarınca uygulanan bandrol, etiket, hologram, pul, damga veya benzeri işaretleri; ilgili mevzuatta belirlenen şekilde temin etmesine rağmen belirlenen ürünlerde kullanmaksızın bedelli veya bedelsiz olarak yayanlar, bunları alma veya kullanma hakkı olmadığı halde sahte evrak veya dokümanlarla veya herhangi bir biçimde ilgili kurum ve kuruluşları yanıltarak temin edenler, bunları taklit veya tahrif ederek ya da konulduğu üründen kaldırarak, değiştirerek ya da her ne suretle olursa olsun tedarik ederek amacı dışında kullananlar üç yıldan altı yıla kadar hapis ve yirmi bin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="18">
        <template>Ambalajlarında bandrol, etiket, hologram, pul, damga veya benzeri işaret bulunmayan ya da taklit veya yanıltıcı bandrol, etiket, hologram, pul, damga veya benzeri işaretleri taşıyan tütün mamulleri, makaron, yaprak sigara kâğıdı, etil alkol, metanol ve alkollü içkileri;</template>
        <mvz-bent no="a">
          <template>Ticari amaçla üreten, bulunduran veya nakleden,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Satışa arz eden veya satan,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu özelliğini bilerek ve ticari amaçla satın alan,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>kişi üç yıldan altı yıla kadar hapis ve yirmi bin güne kadar adli para cezası ile cezalandırılır. Ancak, tütün mamullerinin, makaron, yaprak sigara kâğıdı, etil alkol, metanol ve alkollü içkilerin kaçak olarak yurda sokulduğunun anlaşılması hâlinde, onuncu fıkra hükmüne istinaden cezaya hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="19" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="20">
        <template>Ticari amaçla; makaron veya yaprak sigara kâğıdını, içine kıyılmış tütün, parçalanmış tütün ya da tütün harici herhangi bir madde doldurulmuş olarak satanlara, satışa arz edenlere, bulunduran ve nakledenlere üç yıldan altı yıla kadar hapis cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="21">
        <template>Tarım ve Orman Bakanlığından yetki belgesi almadan veya bildirimde bulunmadan tütün ticareti yapanlara iki yıldan beş yıla kadar hapis cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="22">
        <template>Yukarıdaki fıkralarda tanımlanan fiiller, teşebbüs aşamasında kalmış olsa bile, tamamlanmış gibi cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="23">
        <template>Yukarıdaki fıkralarda tanımlanan suçların konusunu oluşturan eşyanın değerinin fahiş olması hâlinde, verilecek cezalar yarısından bir katına kadar artırılır.  Eşyanın değerinin hafif olması hâlinde verilecek cezalar yarısına kadar, pek hafif olması hâlinde ise üçte birine kadar indirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Nitelikli haller">
      <mvz-fıkra no="1">
        <template>Bu Kanunda tanımlanan suçların , bir örgütün faaliyeti çerçevesinde işlenmesi halinde, verilecek ceza iki kat artırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunda tanımlanan suçların , üç veya daha fazla kişi tarafından birlikte işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda tanımlanan suçların, tüzel kişinin faaliyeti çerçevesinde veya yararına olarak işlenmesi halinde, ayrıca bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunda tanımlanan suçların, kaçakçılık fiillerini önlemek, izlemek, araştırmak ve soruşturmakla görevli kişiler tarafından veya meslek ve sanatın sağladığı kolaylıklardan yararlanmak suretiyle işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanunda tanımlanan suçların , belgede sahtecilik yapılarak işlenmesi halinde, ayrıca bu suçtan dolayı da cezaya hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kaçakçılık fiillerini önlemek, izlemek ve araştırmakla görevli olup da bu Kanunda tanımlanan suçların işlenmesine kasten göz yuman kişi, işlenen suçun müşterek faili olarak sorumlu tutulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kaçakçılık suçunun konusunu oluşturan eşyanın, Devletin siyasî, iktisadî veya askerî güvenliğini bozacak ya da çevre veya toplum sağlığını tehdit edecek nitelikte olması halinde, fiil daha ağır cezayı gerektiren bir suç oluşturmadığı takdirde, verilecek hapis cezası on yıldan az olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Kaçak akaryakıt satışının, 3 üncü maddenin on dördüncü fıkrasında belirtildiği şekilde sabit ya da seyyar tank, düzenek veya ekipman kullanılarak gerçekleştirilmesi halinde verilecek cezalar iki kat artırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Tütün ve tütün mamulleri, alkollü içkiler, akaryakıt, uyuşturucu, silah ve mühimmat, elektronik eşya ve canlı hayvan, et, çay, şeker, zeytin gibi gıda maddeleri ile gerekli görülen hallerde diğer kaçakçılık türleri ile ilgili mahkûmiyet hükmü kesinleşenler, Gümrük ve Ticaret Bakanlığınca kamuoyuna ilan edilebilir. Bu ilanın süresi, nasıl yapılacağı ve ilan edilecek kaçakçılık türleri gibi hususlar Gümrük ve Ticaret Bakanlığınca çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Etkin pişmanlık">
      <mvz-fıkra no="1">
        <template>3 üncü maddede tanımlanan suçlardan  birine iştirak etmiş olan kişi; resmî makamlar tarafından haber alınmadan önce, fiili, diğer failleri ve kaçak eşyanın saklandığı yerleri merciine haber verirse, verilen bilginin, faillerin yakalanmasını veya kaçak eşyanın ele geçirilmesini sağlaması halinde cezalandırılmaz. Haber alındıktan sonra fiilin bütünüyle ortaya çıkmasına hizmet ve yardım eden kişiye verilecek ceza üçte iki oranında indirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yedinci fıkrası hariç, 3 üncü maddede tanımlanan suçlardan birini işlemiş olan kişi, etkin pişmanlık göstererek suç konusu eşyanın gümrüklenmiş değerinin iki katı kadar parayı Devlet Hazinesine;</template>
        <mvz-bent no="a">
          <template>Soruşturma evresi sona erinceye kadar ödediği takdirde, hakkında bu Kanunda tanımlanan kaçakçılık suçlarından dolayı verilecek ceza yarı oranında,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kovuşturma evresinde hüküm verilinceye kadar ödediği takdirde, hakkında bu Kanunda tanımlanan kaçakçılık suçlarından dolayı verilecek ceza üçte bir oranında,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>indirilir. Bu husus, soruşturma evresinde Cumhuriyet savcısı tarafından şüpheliye ihtar edilir. Soruşturma evresinde ihtar yapılmaması hâlinde kovuşturma evresinde hâkim tarafından sanığa ihtar yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İkinci fıkra hükmü, mükerrirler hakkında veya suçun bir örgütün faaliyeti çerçevesinde işlenmesi hâlinde uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>

  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Usûl Hükümleri">
    <mvz-madde no="9" başlık="Arama ve elkoyma">
      <mvz-fıkra no="1">
        <template>Kaçak eşya, her türlü silâh, mühimmat, patlayıcı ve uyuşturucu maddelerin bulunduğundan şüphe edilen her türlü kap, ambalaj veya taşımaya yarayan diğer araçlar ile kişilerin üzerlerinde yapılacak arama ve elkoymalar, 4/12/2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanunu uyarınca yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Gümrük salonları ve gümrük kapılarında kaçak eşya sakladığından kuşkulanılan kişilerin üzeri, eşyası, yükleri ve araçları gümrük kontrolü amacıyla gümrük görevlilerince aranabilir. Yapılan arama sonucunda tespit edilen kaçak eşyaya derhal elkonulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Gümrük bölgesine, Gümrük Kanunu gereğince belirlenen kapı ve yollardan başka yerlerden girmek, çıkmak veya geçmek yasaktır. Bu yerlerde rastlanacak kişi ve her nevi taşıma araçları yetkili memurlar tarafından durdurulur ve kişilerin eşya, yük ve üzerleri ile varsa taşıma araçları aranır. Yapılan arama sonucunda tespit edilen kaçak eşyaya derhal elkonulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Kaçak eşya naklinde kullanılan taşıta elkoyma">
      <mvz-fıkra no="1">
        <template>Bu Kanunda tanımlanan suçların işlenmesinde kullanılan taşıtlara, Ceza Muhakemesi Kanununun 128 inci maddesinin dördüncü fıkrası hükmüne göre elkonulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>13 üncü maddenin birinci fıkrasının (a) bendi kapsamına girmesi, Türkiye’de sicile kayıtlı olmaması ya da soruşturma ve kovuşturma devam ederken, kaçakçılık suçunun işlenmesinde tekrar kullanılması halinde, elkonulan taşıt, elkoyma kararı veren mercilerce alıkonulur. Sahibinin taşıtın değeri kadar teminatı alıkoyma tarihinden itibaren otuz gün içinde gümrük idaresine teslim etmesi halinde, taşıt sahibine iade edilir. Aksi takdirde, tasfiye idaresi tarafından soruşturma ve kovuşturma sonucu beklenmeksizin derhal tasfiye olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kaçak eşya naklinde kullanıldığı şüphesiyle fiilen gümrük idaresine veya yediemine teslim edilmiş ve hakkında elkoyma kararı bulunmakla birlikte ikinci fıkra uyarınca alıkonulmayan taşıtlar, gümrük idaresince yapılacak tebligattan itibaren doksan gün içinde muhafaza ve diğer masraflar karşılanmak suretiyle sahibi tarafından teslim alınmaması halinde, tasfiye idaresi tarafından soruşturma ve kovuşturma sonucu beklenmeksizin derhal tasfiye olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tasfiyenin satış suretiyle gerçekleşmesi halinde, satıştan elde edilen gelirden taşıtın muhafaza edilmesi ve satışı için gerekli olan bütün masraflar karşılandıktan sonra kalan miktar, kovuşturma sonucuna göre işlem yapılmak üzere emanet hesabına alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İkinci fıkra hükmünün uygulanmasındaki değerden, kara taşıtlarında kasko değeri; deniz taşıtlarında, tekne ve makine sigortasına esas teşkil eden değer; sigortasız taşıtlar ile hava ve demiryolu taşıtlarında ise piyasa değeri anlaşılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Elkonulan eşyanın muhafazası">
      <mvz-fıkra no="1">
        <template>Kaçak şüphesiyle elkonulan eşya ile 10 uncu maddenin ikinci fıkrası gereğince alıkonulan her türlü taşıt ve araç; miktarı, cinsi, markası, tipi, modeli, seri numarası gibi eşyanın ayırıcı özelliklerini gösterir bir tutanakla gümrük idaresine teslim edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Gümrük idaresi, kaçak eşya ve taşıtların muhafazası için gerekli görülen yerlerde depo temin eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>10 uncu maddenin ikinci fıkrası hükümlerine göre alıkonularak gümrük idaresine teslim edilen deniz taşıtları, teminatla teslim alınmaması halinde, muhafaza ve zorunlu bakım giderleri sahiplerince ya da donatanlarınca karşılanmak üzere gümrük idaresince belirlenen liman işletme müdürlüğüne teslim edilir. Masraflar, sahiplerince ya da donatanlarınca karşılandığı sürece, taşıtın tasfiyesi yoluna gidilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Muhafazası özel tesis ve tertibatı gerektiren veya gümrük idaresinin depolama kapasitesini aşan eşya, özelliklerine göre doğrudan ilgili idarelere, bunun mümkün olmaması halinde büyükşehirler dahil ilçelerde kaymakam, illerde valinin uygun göreceği yerlere konulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanun uyarınca el konulan ve ambalajlarında kamu kurumlarınca uygulanan bandrol, etiket, hologram, pul, damga veya benzeri işaret bulunmayan tütün mamulleri, etil alkol, metanol, alkollü içkiler, makaron ve yaprak sigara kâğıdı ile ilaç, ilaç hammaddeleri, ilaç hammaddesi içeren ürünler, tıbbi cihaz ve malzemeler, ısıtılarak ya da yakılarak tüketilen ve nikotin içersin içermesin tütün mamulünü taklit eder tarzda kullanılan elektronik sigara ve elektronik nargile dahil her türlü mamul ve bu mamullerin tüketiminde kullanılan elektronik cihaz, aksam, yedek parça ve solüsyonlar el koyan idarelerce numune alınmak veya numune alınması mümkün olmaması halinde ayırt edici bilgilerin tespiti yapılmak suretiyle tutanağa bağlanarak imha edilir. Ancak ilaç, ilaç hammaddeleri, ilaç hammaddesi içeren ürünler, tıbbi cihaz ve malzemeler ile etil alkolden imha haricindeki yöntemlerle tasfiye edilmesi uygun görülenler ilgili bakanlıkların görüşü alınarak Ticaret Bakanlığı tarafından çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kaçak akaryakıt hariç el konulan ve alıkonulan her türlü eşya, yük hayvanı ve taşıtların muhafazası, depolanması, yüklenmesi, boşaltılması, nakliyesi ve imhası gibi nedenlerle el konulduğu andan itibaren yapılan masraflar, Gümrük ve Ticaret Bakanlığı döner sermaye işletmesi gelirlerinden karşılanır. Bu kapsamda yapılacak her türlü mal, araç, gereç ve hizmet alımlarında 4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanunu hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Dördüncü, beşinci ve altıncı fıkralara ilişkin usul ve esaslar İçişleri Bakanlığı ve Maliye Bakanlığının görüşü alınarak Gümrük ve Ticaret Bakanlığınca çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Kaçak akaryakıt, yakalandığı ildeki il özel idaresine, il özel idaresi bulunmayan yerlerde ise yatırım izleme ve koordinasyon başkanlığına, miktarı, cinsi ve özelliklerini gösterir bir tutanakla yakalandığı yerde teslim edilir. Kaçak akaryakıtın muhafazası, depolanması, yüklenmesi, boşaltılması ve nakliyesi gibi nedenlerle yapılan masraflar duruma göre il özel idaresi veya yatırım izleme ve koordinasyon başkanlığı tarafından karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Yasak eşyanın geri gönderilmesi">
      <mvz-fıkra no="1">
        <template>Yabancı ülkelerden gelen yasak eşya, yükleme veya taşıma belgelerinde belirtilerek gümrüğe getirilirse, teminat altında ve gerekli güvenlik tedbirleri alınarak geldiği yere veya diğer bir ülkeye iade ve sevk olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kaçakçılık fiilinin konusunu, toplum ve çevre sağlığı yönünden tehlikeli ve zararlı eşya ile atık maddelerin oluşturması halinde, ilgililer hakkında soruşturma işlemleri başlatılmakla birlikte, bunlar gümrük yetkilileri tarafından derhal getirildiği ülkeye iade edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Müsadere">
      <mvz-fıkra no="1">
        <template>Bu Kanunda tanımlanan suçlarla ilgili olarak 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun eşya ve kazanç müsaderesine ilişkin hükümleri uygulanır. Ancak kaçak eşya taşımasında bilerek kullanılan veya kullanılmaya teşebbüs edilen her türlü taşıma aracının müsadere edilebilmesi için aşağıdaki koşullardan birinin gerçekleşmesi gerekir:</template>
        <mvz-bent no="a">
          <template>Kaçak eşyanın, suçun işlenmesini kolaylaştıracak veya fiilin ortaya çıkmasını engelleyecek şekilde özel olarak hazırlanmış gizli tertibat içerisinde saklanmış veya taşınmış olması.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kaçak eşyanın, taşıma aracı yüküne göre miktar veya hacim bakımından tamamını veya ağırlıklı bölümünü oluşturması veya naklinin, bu aracın kullanılmasını gerekli kılması.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Taşıma aracındaki kaçak eşyanın, Türkiye’ye girmesi veya Türkiye’den çıkması yasak veya toplum veya çevre sağlığı açısından zararlı maddelerden olması.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Etkin pişmanlık nedeniyle fail hakkında cezaya hükmolunmaması veya kamu davasının düşmesine karar verilmesi, sadece suç konusu eşya ile ilgili olarak müsadere hükümlerinin uygulanmasına engel teşkil etmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Mülkiyetin kamuya geçirilmesi" durum="mülga">
    </mvz-madde>
    <mvz-madde no="15" başlık="Kaim değer">
      <mvz-fıkra no="1">
        <template>Bu Kanunda tanımlanan suçlar  dolayısıyla müsadere  yaptırımının konusunu oluşturan eşyanın kaim değerinden, bu eşyanın gümrüklenmiş değeri anlaşılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Tasfiye">
      <mvz-fıkra no="1">
        <template>Bu Kanunda tanımlanan suçların konusunu oluşturması dolayısıyla müsadere yaptırımının uygulanabileceği eşya, sahibine iade edilemez. Kaçak şüphesiyle el konulan kaçak akaryakıt hariç her türlü eşya hakkında, el koyma tarihinden itibaren altı ay, ancak eşyanın zarara uğraması veya değerinde esaslı ölçüde kayıp meydana gelme tehlikesinin varlığı veya muhafazasının ciddi külfet oluşturması halinde bir ay içinde, gerekli tespitler yaptırılarak soruşturma aşamasında hâkim, kovuşturma aşamasında mahkeme tarafından tasfiye kararı verilir. Bu süreler içinde karar verilmemesi halinde eşya derhal tasfiye edilir. Bu fıkra kapsamında tasfiye edilecek eşyadan tasfiye edilmeden önce numune alınması mümkün olan durumlarda numune alınır, numune alınması mümkün olmayan durumlarda eşyanın her türlü ayırt edici özellikleri tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Satılarak tasfiye edilen eşya veya taşıtların satış bedeli emanet hesabına alınır. Tasfiye edilen eşya veya taşıtların sahibine iadesine karar verilmesi halinde, satış bedeli Gümrük Kanununun 180 inci maddesi hükümleri çerçevesinde el koyma tarihinden iade tarihine kadar geçen süre için kanuni faizi ile birlikte hak sahibine ödenir. Emanet hesabında bulunan tutarın hak sahibine yapılacak ödemeyi karşılamaması halinde aradaki fark, eşyanın imha edilmiş olması halinde ise imha edilen eşyanın bedeli, gümrük idaresince genel bütçenin ilgili tertibinden karşılanarak hak sahibine ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Elkonulan eşyanın iadesine karar verilmesi halinde, bu kararların uygulanmasında yürürlükte olan gümrük ve dış ticaret mevzuatı uyarınca işlem yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun uygulamasında tasfiye, tasfiye idaresi tarafından Gümrük Kanunu hükümlerine göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16/A" başlık="Kaçak akaryakıtın tasfiyesi">
      <mvz-fıkra no="1">
        <template>Bu Kanun uyarınca el konulan kaçak akaryakıttan teknik düzenlemelere uygun olanlar, il özel idareleri, il özel idaresi bulunmayan yerde yatırım izleme ve koordinasyon başkanlıkları tarafından, numune alınmak suretiyle kamu kurum ve kuruluşları ile mahalli idarelerin kullanımına bedelsiz tahsis edilerek veya satışı yapılarak tasfiye edilir ve teslim tutanağı ile numune en yakın gümrük idaresine teslim edilir. Kara, hava ve deniz hudut kapılarında el konulan kaçak akaryakıt numune alınarak, gümrüğe terk edilen veya terk edilmiş sayılan akaryakıt ise numune alınmaksızın gümrük idarelerinin, gerektiği hallerde kamu kurum ve kuruluşları ile mahalli idarelerin de kullanımına bedelsiz tahsis edilerek veya satışı yapılarak tasfiye edilir. Satış bedelleri ilgili il özel idaresinin veya yatırım izleme ve koordinasyon başkanlığının bütçesine gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sahipsiz olarak yakalanan kaçak akaryakıtın ulusal marker saha ölçüm sonucunun, Enerji Piyasası Düzenleme Kurumu tarafından belirlenen şart ve seviyede olmaması halinde bahse konu ürünler analizi yapılmaksızın teknik düzenlemelere aykırı kabul edilir ve tasfiye edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Numune analiz sonuçları teknik düzenlemelere uygun olmayan kaçak akaryakıt, il özel idaresi veya yatırım izleme ve koordinasyon başkanlığı tarafından en yakın rafinericiye satılır. Bu satışta ürünlerin satış bedeli, beyaz ürünlerde benzin, motorin türleri, nafta, gaz yağı, jet yakıtı ve solvent türleri, rafineride bir önceki ay sonunda oluşan ham petrol/devir maliyet fiyatından, diğer ürünlerde ise yüzde altmışından az olamaz. Satış bedeli ilgili il özel idaresinin veya yatırım izleme ve koordinasyon başkanlığının bütçesine gelir olarak kaydedilir. Rafineriler teknik düzenlemelere uygun olmayan, üretim süreçlerine zarar vermeyecek evsafta olduğu numune analiz sonuçlarıyla kanıtlanan kaçak akaryakıtı teslim almakla yükümlüdür. Yapılan analiz sonucunda rafineri işlem süreçlerine zarar vereceği anlaşılan kaçak akaryakıt, bertaraf ve/veya enerji geri kazanımı amacıyla geçici faaliyet belgesi ve/veya çevre lisansı almış olan atık yakma ve beraber yakma tesislerinde bertaraf ettirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yargılamanın, tasfiye edilen kaçak akaryakıt sahiplerinin lehine sonuçlanması halinde; satışı yapılan kaçak akaryakıtın toplam satış bedelinden vergiler düşüldükten sonra kalan tutarı, akaryakıtın tahsis edilmiş olması halinde ise vergiler hariç üçüncü fıkra hükümlerine göre belirlenen bedeli, el koyma tarihinden kararın kesinleştiği tarihe kadar geçen süre için kanuni faiz ilave edilerek ilgili kurum bütçesinden hak sahibine ödenir. Gerekli ödenek, Maliye Bakanlığınca ilgili kurumlara aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu madde kapsamında veya akaryakıt kaçakçılığı ile mücadele konusunda Ticaret Bakanlığı, İçişleri Bakanlığı, Enerji Piyasası Düzenleme Kurumu, il özel idareleri ve yatırım izleme ve koordinasyon başkanlıkları tarafından yapılacak her türlü mal, araç, gereç ve hizmet alımlarında 4734 sayılı Kanun, kaçak akaryakıt satışında 8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanunu hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar, Enerji Piyasası Düzenleme Kurumunun görüşü alınarak Ticaret Bakanlığı ve İçişleri Bakanlığı tarafından müştereken çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Çeşitli Hükümler">
    <mvz-madde no="17" başlık="Yetkili merciler">
      <mvz-fıkra no="1" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamına giren suçlar dolayısıyla açılan davalar, Adalet Bakanlığının teklifi üzerine Hakimler ve Savcılar Yüksek Kurulunca belirlenen asliye ceza mahkemelerinde görülür. Ancak bu suçlarla bağlantılı olarak resmî belgede sahtecilik suçunun işlenmesi halinde, görevli mahkeme ağır ceza mahkemesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Davaya katılma">
      <mvz-fıkra no="1">
        <template>Bu Kanunda tanımlanan suçlar dolayısıyla açılan davalarda mahkeme, iddianamenin bir örneğini ilgili gümrük idaresine de gönderir. Başvurusu üzerine, ilgili gümrük idaresi açılan davaya katılan olarak kabul edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Kaçakçılığı önleme, izleme ve araştırmakla görevli olanlar">
      <mvz-fıkra no="1">
        <template>Mülkî amirler, Gümrük Müsteşarlığı personeli ile Emniyet Genel Müdürlüğü, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığına bağlı personel, bu Kanunla yaptırım altına alınan fiilleri önleme, izleme ve araştırmakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kaçakçılığı önleme, izleme ve soruşturmakla görevli olanlar, operasyon gerektiren kaçakçılık olaylarından haberdar olduklarında kanunî görevlerini yapmaya başlar ve aynı zamanda mahallin en büyük mülkî amirine de bilgi verirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kaçakçılığı önleme, izleme ve soruşturmakla görevli olanların bu Kanun kapsamına giren suçlarla ilgili bilgi ve belge talepleri, kamu veya özel, gerçek veya tüzel kişilerce, savunma hakkına ilişkin hükümler saklı kalmak kaydıyla eksiksiz olarak karşılanmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun 3 üncü maddesi kapsamındaki suçları ihbar edenler ile 23 üncü maddesi gereğince ikramiye ödenmesi öngörülen muhbirlerin kimliği izinleri olmadıkça veya ihbarın niteliği haklarında suç oluşturmadıkça hiçbir şekilde açıklanamaz. Bu kişiler hakkında tanıkların korunmasına ilişkin hükümler uygulanır.  Bu Kanunun 3 üncü maddesi ile 23 üncü maddesinin birinci fıkrasının (a) ve (b) bentlerinde belirtilen suçlardan elde edilen malvarlığı değerlerini ihbar edenler ile bu suçlardan kaynaklanan malvarlığı değerlerini aklama suçunu ihbar edenler hakkında da bu fıkra hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Tutanaklar">
      <mvz-fıkra no="1">
        <template>Kaçakçılık fiillerinin izlenmesine ilişkin tutanakların;</template>
        <mvz-bent no="a">
          <template>Tarih, yer, düzenleyenlerin unvan ve isimleri, hâkim kararının tarih ve sayısı ile Cumhuriyet savcısının yazılı emri ile yapılması durumunda emrin tarih ve sayısını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Olay ve kanıtlarını, suç  konusu eşya ve taşıma araçlarının ayrıntılı olarak türü, kapsamı, miktar ve nitelikleri ile nerede ve ne suretle el konulduklarını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İlgilinin kimlik, iş ve yerleşim yeri ile varsa ifadesini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>kapsaması ve imza altına alınması gereklidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşlemde hazır bulunan ilgililerce onanmak üzere tutanağın kendilerini ilgilendiren kısımları okunur veya okumaları için kendilerine verilir. Bu husus tutanağa yazılarak ilgililere imza ettirilir. İmzadan kaçınma halinde nedenleri tutanağa geçirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Kontrollü teslimat">
      <mvz-fıkra no="1">
        <template>Bu Kanun çerçevesinde yapılacak kontrollü teslimat işlemleri, 13/11/1996 tarihli ve 4208 sayılı Kanunun 10 uncu, 11 inci ve 13 üncü maddeleri hükümleri çerçevesinde Gümrük Müsteşarlığı, Emniyet Genel Müdürlüğü, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı tarafından yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Silâh kullanma yetkisi">
      <mvz-fıkra no="1">
        <template>Gümrük Kanunu gereğince belirlenen kapı ve yollardan başka yerlerden gümrük bölgesine girmek, çıkmak veya geçmek isteyen kişiye “dur” uyarısında bulunulmasına rağmen bu uyarıya uymaması halinde, havaya ateş edilmek suretiyle uyarı yinelenir. Ancak silâhla karşılığa yeltenilmesi ve sair surette meşru müdafaa durumuna düşülmesi halinde, yetkili memurlar saldırıyı etkisiz kılacak oranda doğrudan hedefe ateş edebilir. Memurların silâh kullanmalarından dolayı haklarında soruşturma ve kovuşturma açılması halinde, bağlı bulunduğu kurum tarafından avukat sağlanır ve avukatlık ücreti kurumlarınca karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kaçakçılığı önleme, izleme ve araştırmakla yükümlü olanlar, gümrük bölgesindeki her nevi deniz araçlarına yanaşıp yük ve belgelerini incelemeye yetkilidir. Görevlilerin yanaşmasına izin vermeyerek kaçan veya kaçmaya teşebbüs eden her nevi deniz araçlarına uluslararası deniz işaretlerine göre telsiz, flama, mors ve benzeri işaretlerle durması ihtar olunur. Bu ihtara uymayan deniz araçlarına uyarı mahiyetinde ateş edilir. Buna da uymayıp kaçmaya devam ettiği takdirde durmaya zorlayacak şekilde üzerine ateş edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="İkramiyeler">
      <mvz-fıkra no="1">
        <template>Kaçak zannı ile eşya yakalanması halinde muhbir ve elkoyma ikramiyesine hak kazananlara aşağıdaki esas ve usullere göre ikramiye ödenir.</template>
        <mvz-bent no="a">
          <template>10/7/1953 tarihli ve 6136 sayılı Ateşli Silâhlar ve Bıçaklar ile Diğer Aletler Hakkında Kanunun 12 nci maddesine aykırılık suçlarından yakalanan silâh ve mermiler ile Türk Ceza Kanununun 174 üncü maddesine muhalefet suçlarından yakalanan maddelerin olay tarihine göre Milli Savunma Bakanlığınca her yıl belirlenen değeri esas alınarak, sahipli yakalanması halinde değerinin yüzde yirmibeşi kamu davasının açılmasını, yüzde yetmişbeşi ise mahkûmiyete ilişkin hükmün veya müsadere kararının kesinleşmesini takip eden üç ay içinde; sahipsiz yakalanmışsa yakalanan eşya değerinin yüzde ellisi müsadere kararının kesinleşmesini takip eden üç ay içinde,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Uyuşturucu madde ve uyuşturucu madde elde etmek amacıyla ekilen bitki yakalamalarında, her türlü uyuşturucu maddenin birim miktarı ve uyuşturucu madde elde edilen bitkilerin ekili olduğu alanın yüzölçümü esas alınarak Cumhurbaşkanınca tespit edilecek sabit bir rakamın memur aylık katsayısı ile çarpımı sonucu bulunacak değerinin; 3 üncü maddenin on sekizinci ve on dokuzuncu fıkraları kapsamında gerçekleştirilen yakalamalarda ise, Cumhurbaşkanınca paket, kilogram ve litre bazında tespit edilecek sabit rakamların memur aylık katsayısı ile çarpımı sonucu bulunacak değerinin; sahipli yakalanmış ise yarısı kamu davasının açılmasını, diğer yarısı mahkûmiyete ilişkin hükmün veya müsadere kararının kesinleşmesini takip eden üç ay içinde, sahipsiz yakalanmış ise tamamı müsadere kararının kesinleşmesini takip eden üç ay içinde,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu maddenin (a) ve (b) bentlerindeki durumlar dışındaki ikramiye ödemelerinde, çıkış kaçağı eşyanın FOB, giriş kaçağı eşyanın CIF kıymeti esas alınır. Sahipsiz yakalanan eşyanın değeri, mahallin en büyük mülkî amirinin görevlendireceği Maliye Bakanlığı, Gümrük Müsteşarlığı ve sanayi ve ticaret odası temsilcilerinden oluşan üç kişilik heyet tarafından belirlenir. Kaçak eşya sahipli yakalanmışsa kıymetinin yüzde ellisi, sahipsiz yakalanmışsa yüzde yirmibeşi mahkûmiyete, etkin pişmanlıkta kamu davasının açılmamasına, eşyanın müsaderesine  ilişkin kararların kesinleşmesini takip eden üç ay içinde,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>elkoyma ikramiyesine hak kazananların bağlı olduğu kurum bütçesinin ilgili tertibinden ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dağıtılacak ikramiyenin yüzde ellisi muhbirlere, yüzde ellisi elkoyma ikramiyesine hak kazananlara verilir. İhbarsız yakalama olaylarında ikramiyenin tamamı elkoyma ikramiyesine hak kazananlara ödenir. Kaçakçılığı önleme, izleme ve soruşturmakla yükümlü olanlara muhbir ikramiyesi ödenmez. Kaçakçılığı önleme, izleme ve soruşturmakla görevli olanlardan yakalama işlemine bizzat ve fiilen katılanlar ile yapılan soruşturmada iletişimin tespiti, dinlenmesi, kayda alınması, gizli soruşturmacı ve teknik araçla izleme tedbirlerinde görevlendirilmek veya bilgi toplama, analiz, değerlendirme, fiziki takip ya da planlama veya sevk idare çalışmalarında bulunmak suretiyle katkı sağlayanlar elkoyma ikramiyesine hak kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddeye göre ödenecek ikramiyeler, damga vergisi hariç vergi, resim ve harca tâbi tutulmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde gereğince elkoyma ikramiyesine hak kazananlara verilecek ikramiyenin tutarı olay başına (30.000) gösterge rakamının, kamu davasının açılması, mahkûmiyet, müsadere kararının kesinleştiği tarihteki memur aylık katsayısı ile çarpımı sonucu bulunacak tutarı geçemez. Ancak bir yılda ödenecek ikramiye (120.000) gösterge rakamının memur aylık katsayısıyla çarpımı sonucu bulunacak tutarı geçemez. Bu fıkra hükmü bu maddenin altıncı fıkrası kapsamında yapılacak ikramiye ödemeleri hakkında uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Müşterek operasyonlarda ve kontrollü teslimat uygulamalarında ikramiye ödenmesi ve ikramiye ödemelerine esas birim fiyatların tespitine ilişkin usul ve esaslar ile altıncı fıkra hariç bu maddenin uygulanmasına ilişkin diğer hususlar, Maliye ve Millî Savunma bakanlıklarının görüşü alınarak Gümrük ve Ticaret Bakanlığı ve İçişleri Bakanlığı tarafından müştereken çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kaçak akaryakıtın yakalanması halinde, ihbar edenlere ve yakalayan kamu görevlilerine aşağıdaki usul ve esaslara göre ikramiye ödenir:</template>
        <mvz-bent no="a">
          <template>Bir ihbar sonucunda kaçak akaryakıtın sahipli yakalanması halinde (d) bendine göre belirlenecek tutara göre hesaplanacak toplamın yüzde onu tutarında ihbar edene, yüzde onu tutarında elkoyma ikramiyesine hak kazananlara kamu davasının açılmasını takip eden üç ay içinde ikramiye ödenir. Kaçak akaryakıta ilişkin mahkûmiyet hükmünün veya müsadere kararının kesinleşmesini takip eden üç ay içinde (d) bendine göre belirlenecek tutara göre hesaplanacak toplamın yüzde on beşi tutarında ihbar edene, yüzde on beşi tutarında yakalama eylemine bizzat ve fiilen katılan kamu görevlilerine ilave ikramiye ödenir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bir ihbar olmadan kaçak akaryakıtın sahipli yakalanması halinde (d) bendine göre belirlenecek tutara göre hesaplanacak toplamın yüzde onu tutarında elkoyma ikramiyesine hak kazananlara kamu davasının açılmasını takip eden üç ay içinde ikramiye ödenir. Kaçak akaryakıta ilişkin mahkûmiyet hükmünün veya müsadere kararının kesinleşmesini takip eden üç ay içinde (d) bendine göre belirlenecek tutara göre hesaplanacak toplamın yüzde onbeşi tutarında yakalama eylemine bizzat ve fiilen katılan kamu görevlilerine ilave ikramiye ödenir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yakalanan kaçak akaryakıtın sahipli olmaması halinde, bu fıkra kapsamında ihbar edenlere ve elkoyma ikramiyesine hak kazananlara ödenecek ikramiyeler yüzde elli eksik ödenir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bu fıkraya göre yapılacak ikramiye ödemeleri ilgili kurumların bütçesinden karşılanır. Gerekli ödenek, Maliye Bakanlığınca ilgili kurumlara aktarılır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bu fıkra kapsamında yapılacak ikramiye ödemelerine ilişkin usul ve esaslar ile ödemelere esas alınacak tutarlar ve bu fıkranın uygulanmasına ilişkin diğer hususlar, Maliye Bakanlığının görüşü alınarak Gümrük ve Ticaret Bakanlığı ile İçişleri Bakanlığı tarafından müştereken çıkarılan yönetmelikle düzenlenir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>10/11/1988 tarihli ve 3497 sayılı Kara Sınırlarının Korunması ve Güvenliği Hakkında Kanun uyarınca görev verilen Kara Kuvvetleri Komutanlığı hudut birlikleri  personeli ile yardım talep edilmesi halinde kaçakçılıkla mücadele görevi verilen Deniz Kuvvetleri Komutanlığı personeline de bu maddede düzenlenen usul ve esaslara göre ikramiye ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Cumhurbaşkanınca belirlenecek birim miktarını aşmayan uyuşturucu veya uyarıcı madde yakalamalarında, kamu davası açılmasını müteakip ve kabul edilen iddianame sayısı üzerinden, örgütlü suçlarda muhbir ve elkoyma ikramiyesine hak kazananlara, bireysel suçlarda ise sadece elkoyma ikramiyesine hak kazananlara, Cumhurbaşkanınca tespit edilecek sabit rakamların memur aylık katsayısı ile çarpımı sonucu bulunacak değer, tek seferde ikramiye olarak ödenir. Bu durumda birinci fıkranın (b) bendi kapsamında ayrıca ikramiye ödemesi yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu maddenin birinci fıkrasında belirtilen ikramiye ödemelerinde muhbir ve elkoyma ikramiyesine hak kazananlara ödenecek ikramiye tutarı 3.000 gösterge rakamının olayın olduğu tarihteki memur maaş katsayısı ile çarpımı sonucu bulunacak tutardan az olması durumunda ikramiye talep dosyası hazırlanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Kriminal laboratuvar">
      <mvz-fıkra no="1">
        <template>Kaçakçılık fiillerinin önlenme, izlenme ve araştırılması çerçevesinde görev yapmak üzere Gümrük Müsteşarlığınca kriminal laboratuvarlar kurulur. Bu laboratuvarların çalışma usûl ve esasları Gümrük Müsteşarlığınca çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Geçici ve Son Hükümler">
    <mvz-madde no="25" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>10/7/2003 tarihli ve 4926 sayılı Kaçakçılıkla Mücadele Kanunu yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Diğer kanunlarda mülga 7/1/1932 tarihli ve 1918 sayılı Kaçakçılığın Men ve Takibine Dair Kanun ile bu Kanunla yürürlükten kaldırılan Kaçakçılıkla Mücadele Kanununa yapılan atıflar, bu Kanuna yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>21/12/2000 tarihli ve 4616 sayılı 23 Nisan 1999 Tarihine Kadar İşlenen Suçlardan Dolayı Şartla Salıverilmeye, Dava ve Cezaların Ertelenmesine Dair Kanun uyarınca davanın ertelenmesine karar verilmesi halinde, deneme süresinin dolup dolmadığına bakılmaksızın, elkonulan eşya derhal tasfiye edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Gümrük idaresi, kaçak şüphesiyle elkonulan eşya ile 10 uncu maddenin ikinci fıkrası gereğince alıkonulan taşıt ve araçların muhafazası için 1/1/2012 tarihine kadar kaçak eşya depoları kurar veya mevcut depolardan kiralamak veya satın almak yoluyla yararlanır. Kaçak eşya depoları için gerekli olan giderleri karşılamak üzere Gümrük Müsteşarlığı bütçesine, yeterli ödenek konulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>11 inci maddenin ikinci fıkrasındaki depo ve tesisler temin edilinceye kadar, kaçak şüphesiyle elkonulan eşya ile 10 uncu maddenin ikinci fıkrası gereğince alıkonulan her türlü taşıt ve araç, en yakın gümrük idaresine veya gümrük idaresince izin verilen yerlere miktar, cins, marka, tip, model, seri numarası gibi eşyanın ayırıcı özelliklerini gösterir bir tutanakla teslim edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Eşyanın miktar bakımından fazla olması veya saklanması özel tesis ve tertibatı gerektirmesi halinde, eşya, özelliklerine göre doğrudan ilgili idarelere, bunun mümkün olmaması halinde İçişleri Bakanlığı ve Gümrük Müsteşarlığınca belirlenecek usûl ve esaslara göre mahallin en büyük mülkî amirinin uygun göreceği bir yere konulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunla yürürlükten kaldırılan Kaçakçılıkla Mücadele Kanununun 35 inci maddesinin (g) bendi uyarınca Gümrük Müsteşarlığınca harcanmasını teminen emanet hesabında bulunan tutar, 11 inci maddede belirtilen amaçlar doğrultusunda kullanılmak üzere bir yandan bütçenin (B) işaretli cetveline gelir, diğer yandan Gümrük Müsteşarlığı bütçesinin ilgili tertiplerine ödenek olarak kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>31/12/2011 tarihine kadar, bu Kanunun 23 üncü maddesinin birinci fıkrasının (a) ve (b) bentlerinde sayılan durumlar dışında kalan kaçakçılık fiillerine ilişkin adlî ve idarî para cezalarının tahsilini müteakip yüzde ellisi; davaların izlenmesi, savunulması ve soruşturulması sırasında yapılan tahlil, ekspertiz işleri ile Gümrük Müsteşarlığınca kurulacak kriminal laboratuvar cihaz ve sarf malzemesinin temini ve 11 inci maddede belirtilen amaçlar doğrultusunda kullanılmak üzere bir yandan bütçenin (B) işaretli cetveline gelir, diğer yandan Gümrük Müsteşarlığı bütçesinin ilgili tertiplerine ödenek olarak kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Mülga Kaçakçılığın Men ve Takibine Dair Kanun ile bu Kanunla yürürlükten kaldırılan Kaçakçılıkla Mücadele Kanununa göre kaçak zannı ile elkonulan veya Gümrük Kanununa göre Devlete intikal ederek kamu kurum ve kuruluşları ile mahalli idarelerde muhafaza edilmekte olan akaryakıtlardan bu Kanunun yürürlüğe girdiği tarih itibarıyla tasfiyesi yapılmamış olanlar, bunları muhafaza eden kamu kurum ve kuruluşları ile mahalli idarelere bedelsiz tahsis edilmiş sayılır. Bu şekilde tahsis edilen akaryakıtlardan herhangi bir vergi ve resim alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kaçak zannı ile elkonulan akaryakıtlardan yargılama sonucunda mahkemesince, sahibine iadesine karar verilenlerin bedeli, Hazineden karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>31/3/2007 tarihinden önce, kaçak eşya naklinde kullanılması nedeniyle elkonulan veya alıkonulan taşıma araçları hakkında bu Kanunun 16 ncı maddesi hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddenin yayımı tarihinden önce gümrük idaresine teslim edilen ve ambalajlarında kamu kurumlarınca uygulanan bandrol, etiket, hologram, pul, damga veya benzeri işaret bulunmayan tütün mamulleri, etil alkol, metanol ve alkollü içkiler numune alınarak gümrük idaresince derhal imha edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin yayımı tarihinden önce gümrük idaresine teslim edilmemiş ve ambalajlarında kamu kurumlarınca uygulanan bandrol, etiket, hologram, pul, damga veya benzeri işaret bulunmayan tütün mamulleri, etil alkol, metanol ve alkollü içkiler 11 inci maddenin beşinci fıkrası uyarınca derhal imha edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin yayımı tarihinden önce kaçak akaryakıt ile birinci ve ikinci fıkralar kapsamı dışındaki kaçak şüphesiyle el konulan eşya hakkında, bu maddenin yayımı tarihinden itibaren üç ay içinde gerekli tespitler yaptırılarak soruşturma aşamasında hâkim, kovuşturma aşamasında mahkeme tarafından tasfiye kararı verilir. Bu süreler içinde karar verilmemesi halinde eşya derhal tasfiye edilir. Bu fıkra kapsamında tasfiye edilecek eşya tasfiye edilmeden önce numune alınması mümkün olan eşyadan numune alınır, numune alınması mümkün olmayan eşyanın her türlü ayırt edici özellikleri tespit edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>16/A maddesinin altıncı fıkrası ile 23 üncü maddenin beşinci ve altıncı fıkralarında belirtilen yönetmelikler altı ay içinde yürürlüğe konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yayımı tarihinden önce işlenen 3/1/2002 tarihli ve 4733 sayılı Tütün ve Alkol Piyasası Düzenleme Kurumu Teşkilat ve Görevleri Hakkında Kanun ile 4/12/2003 tarihli ve 5015 sayılı Petrol Piyasası Kanununa muhalefet suçlarında, lehe hükümlerin uygulanması usulü 4/11/2004 tarihli ve 5252 sayılı Türk Ceza Kanununun Yürürlük ve Uygulama Şekli Hakkında Kanunun 9 uncu maddesi hükmüne göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun yayımı tarihinden önce işlenen bu Kanuna muhalefet kabahatlerinde, lehe hükümlerin uygulanması usulü 5252 sayılı Kanunun 9 uncu maddesi hükmüne göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>12/11/2012 tarihli ve 6360 sayılı On Dört İlde Büyükşehir Belediyesi ve Yirmi Yedi İlçe Kurulması ile Bazı Kanun ve Kanun Hükmünde Kararnamelerde Değişiklik Yapılmasına Dair Kanun ile tüzel kişiliği kaldırılan il özel idarelerinin mülkiyetinde bulunan ve kaçak akaryakıtın tasfiyesi için kullanılan her türlü tesis, depo, araç ve gereç ile diğer tüm teknik teçhizat, tüzel kişiliğin kalktığı tarih itibarıyla hiçbir işleme gerek kalmaksızın bulunduğu yerdeki defterdarlığa devredilmiş sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 3 üncü maddesinin ikinci fıkrası uyarınca gümrük vergilerinin kısmen eksik ödenmesi nedeniyle açılan kamu davalarında, bu maddenin yürürlüğe girdiği tarihten önce el konulan ve müsadere kararı verilmemiş kara taşıtları ile ilgili olarak;</template>
        <mvz-bent no="a">
          <template>Taşıtın tasfiyesinin tamamlanmamış olması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu maddenin yürürlüğe girdiği ayı takip eden altıncı ayın sonuna kadar ilgili gümrük idaresine başvurulması ve taşıtın ilk iktisabında ödenmesi gereken özel tüketim vergisinin %25’ine tekabül eden tutarın başvuru tarihinden itibaren bir ay içinde ilgili tahsil dairesine ödenmesi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>şartlarının birlikte gerçekleşmesi halinde el koyma kararı kaldırılır ve el konulan aracın sahibine iade edilmesine karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen kamu davalarında, eşyanın müsaderesi yerine eşyanın gümrüklenmiş değerinin ödenmesine karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkranın uygulanmasına ilişkin usul ve esasları tespit etmeye Adalet Bakanlığı ve Gümrük ve Ticaret Bakanlığı ile Maliye Bakanlığı müştereken yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 3 üncü maddesinin ikinci fıkrası uyarınca gümrük vergilerinin kısmen eksik ödenmesi nedeniyle başlatılan bir soruşturma veya kovuşturma kapsamında bulunan ve müsadere kararı verilmemiş kara taşıtları ile ilgili olarak;</template>
        <mvz-bent no="a">
          <template>Taşıtın tasfiyesinin tamamlanmamış olması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>31/12/2019 tarihine kadar ilgili gümrük idaresine başvurulması ve taşıtın ilk iktisabında ödenmesi gereken özel tüketim vergisinin %25’ine tekabül eden tutarın, başvuru sahibine tebliğ edildiği tarihten itibaren bir ay içinde ilgili tahsil dairesine ödenmesi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>şartlarının birlikte gerçekleşmesi hâlinde, araç hakkında el koyma ve müsadere kararı verilmez, mevcut el koyma kararı kaldırılır ve el konulan aracın sahibine iade edilmesine karar verilir. İadesi talep edilen ulaşım araçlarının muhafazasına ilişkin masraflar araç sahibince ödenir. Cumhurbaşkanı bu fıkrada yer alan başvuru süresini altı aya kadar uzatmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>4458 sayılı Kanunun geçici 10 uncu maddesi kapsamında iade edilen araçlar hakkında el koyma veya müsadere kararı verilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci ve ikinci fıkrada belirtilen durumlarda, eşyanın müsaderesi yerine eşyanın gümrüklenmiş değerinin ödenmesine karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkranın uygulanmasına ilişkin usul ve esasları tespit etmeye Adalet Bakanlığı ve Ticaret Bakanlığı ile Hazine ve Maliye Bakanlığı müştereken yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Haklarında hüküm verilmiş olup da dosyası infaz aşamasında olanlar, bu maddenin yürürlüğe girdiği tarihten itibaren doksan gün içinde suç konusu eşyanın gümrüklenmiş değerinin iki katı kadar parayı Devlet Hazinesine ödedikleri takdirde Kanunun 5 inci maddesinin ikinci fıkrasının (b) bendinde bu maddeyi ihdas eden Kanunla yapılan düzenlemeden faydalanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin yürürlüğe girdiği tarihte bu Kanunun kapsamına giren suçlardan dolayı kanun yolu incelemesinde bulunan dosyalardan, 3 üncü ve 5 inci maddede bu maddeyi ihdas eden Kanunla yapılan düzenlemeler nedeniyle lehe değerlendirme yapılması gereken dosyalar hakkında bozma kararı verilir. Yargıtay Cumhuriyet başsavcılığında bulunan dosyalar ise gelişlerindeki usule uygun olarak ilk derece mahkemelerine gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>30/9/2020 tarihine kadar bu Kanun kapsamında el konulan ve bulaşıcı salgın hastalıkla mücadele ile doğrudan ilgili tıbbi cihaz ve malzemeler, test materyali, plazma, etil alkol, izopropil alkol, gliserol, maske, eldiven, tulum, galoş, kolonya, dezenfektan, dezenfeksiyon cihazları, solunum cihazı, yoğun bakım malzemesi, ilaç, aşı, ilk yardım araç-gereçleri ve bunların üretiminde kullanılan cihaz ve malzemeler, delil olarak saklanmasına gerek bulunmaması halinde yeteri kadar numune alındıktan, bunun mümkün olmaması halinde her türlü ayırt edici özelliği tespit edildikten sonra, el koyan idare veya ilgili kamu kurumu tarafından soruşturma evresinde hâkim veya kovuşturma evresinde mahkemeden tahsisi talep edilebilir. Talep üzerine verilen kararlara karşı itiraz edilebilir. Hakim veya mahkemece tahsisi uygun bulunan eşyanın soruşturma veya kovuşturma sonunda iadesine karar verildiği takdirde eşyanın rayiç değerinden varsa gümrük vergileri ve para cezaları ayrıldıktan sonra kalan tutar, tahsis yapılan kurum tarafından eşya sahibine ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cumhurbaşkanı birinci fıkrada yer alan süreyi 3 aya kadar uzatmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce kaçak zannı ile el konulan ve 11 inci maddenin beşinci fıkrası kapsamına giren eşya hakkında aynı fıkra uyarınca işlem yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihte defterdarlıkların veya çevre, şehircilik ve iklim değişikliği il müdürlüklerinin mülkiyetinde bulunan ve kaçak akaryakıtın tasfiyesi için kullanılan her türlü tesis, depo, araç ve gereç ile diğer tüm teknik teçhizat hiçbir işleme gerek kalmaksızın en geç üç ay içerisinde bulunduğu yerdeki yatırım izleme ve koordinasyon başkanlığına devredilir. Söz konusu devirler gerçekleşene kadar akaryakıt tasfiyesi için gerekli işlemler ilgili defterdarlık veya çevre, şehircilik ve iklim değişikliği il müdürlüklerince yürütülmeye devam edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
