  <mvz-künye tür="kanun" no="6326" başlık="TURİST REHBERLİĞİ MESLEK KANUNU"
             tarih="7/6/2012" rgazete-tarih="22/6/2012" rgazete-sayı="28331"
             düstur-tertip="5" düstur-cilt="52" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; turist rehberliği mesleğine kabule, mesleğin icrasına ve turist rehberliği meslek kuruluşlarının kuruluş ve işleyişine ilişkin usul ve esasları düzenlemektir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun; turist rehberliği mesleğine kabule, meslek içi eğitime ve mesleğin icrasına, turist rehberleri odaları ile turist rehberleri odaları birliklerinin kuruluşuna, organlarının niteliklerine ve seçimlerine, organlık niteliğini yitirme hâl ve usullerine, görev ve yetkilerine, çalışma usullerine, üyeleri ile olan karşılıklı hak ve yükümlülüklerine, gelir ve giderleri ile bütçelerine, Kültür ve Turizm Bakanlığının mesleğe ilişkin görev ve yetkilerine, meslek kuruluşlarıyla iş birliğine ve turist rehberliği meslek kuruluşlarının Bakanlıkça denetlenmesine ilişkin usul ve esasları kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Bakanlık: Kültür ve Turizm Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Birlik: Turist rehberleri odaları birliklerini,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Çalışma kartı: Eylemli turist rehberlerine, kayıtlı oldukları oda tarafından bir yıl süreyle geçerli olmak üzere mesleği fiilen icra edebileceklerine ilişkin olarak verilen izin belgesini,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Eylemli turist rehberi: Çalışma kartı sahibi olup fiilen turist rehberliği hizmeti sunma hak ve yetkisine sahip turist rehberini,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Eylemsiz turist rehberi: Ruhsatname sahibi olup çalışma kartı olmayan turist rehberini,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Meslek: Turist rehberliği mesleğini,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Meslek kuruluşları: Turist rehberleri odaları ve birliklerini,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Oda: Turist rehberleri odalarını,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Ruhsatname: Mesleğe kabul koşullarını taşıyan turist rehberlerine Bakanlık tarafından verilen belgeyi,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Turist rehberi: Bu Kanun hükümleri uyarınca mesleğe kabul edilerek turist rehberliği hizmetini sunma hak ve yetkisine sahip olan gerçek kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Turist rehberliği hizmeti: Seyahat acentalığı faaliyeti niteliğinde olmamak kaydıyla kişi veya grup hâlindeki yerli veya yabancı turistlerin gezi öncesinde seçmiş oldukları dil kullanılarak ülkenin kültür, turizm, tarih, çevre, doğa, sosyal veya benzeri değerleri ile varlıklarının kültür ve turizm politikaları doğrultusunda tanıtılarak gezdirilmesini veya seyahat acentaları tarafından düzenlenen turların gezi programının seyahat acentasının yazılı belgelerinde tanımladığı ve tüketiciye satıldığı şekilde yürütülüp acenta adına yönetilmesini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Turist Rehberliği">
    <mvz-madde no="3" başlık="Mesleğe kabul">
      <mvz-fıkra no="1">
        <template>Turist rehberi unvanı mesleğe kabulle kazanılır ve mesleğe kabul için aşağıdaki koşullar aranır:</template>
        <mvz-bent no="a">
          <template>Türkiye Cumhuriyeti vatandaşı olmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Başvuru tarihi itibarıyla onsekiz yaşını doldurmuş olmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Üniversitelerin turist rehberliği bölümlerinin ön lisans, lisans veya yüksek lisans programlarından mezun olmak veya üniversitelerin turist rehberliği bölümü dışındaki diğer bölümlerinden en az lisans düzeyinde mezun olduktan sonra turizm sektörünün ihtiyaçları da dikkate alınarak belirlenen dillerde, gerektiği hâllerde belirlenen bölgelerde, yönetmelikle kurs ve sınavlara ilişkin belirlenen usul ve esaslar çerçevesinde Bakanlığın talebiyle Bakanlığın gözetim ve denetimi altında birlikler veya konusunda uzmanlaşmış kamu kurum ve kuruluşları tarafından düzenlenen ülkesel veya bölgesel turist rehberliği eğitim programını başarıyla tamamlamak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bakanlık tarafından belirlenen yabancı dillerden birinde, mesleğe kabul sınavına başvuru tarihinden önceki son beş yıl içinde Ölçme, Seçme ve Yerleştirme Merkezi Başkanlığı (ÖSYM) tarafından yapılan Yabancı Dil Bilgisi Seviye Tespit Sınavından (YDS) en az 75 puan almış olmak veya ÖSYM tarafından YDS’ye eşdeğerliliği kabul edilen uluslararası yabancı dil sınavlarında bu puana denk yabancı dil yeterlilik belgesine sahip olmak; Bakanlığın sınav yapılmasını istediği yıl içerisinde ÖSYM tarafından sınav takvimine alınmayan dillerde ise Bakanlığın talebiyle Bakanlığın gözetim ve denetimi altında birlikler veya konusunda uzmanlaşmış kamu kurum ve kuruluşlarınca yapılan yabancı dil sınavında başarılı olmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Maliyetlerin katılımcılardan karşılanması kaydıyla, Bakanlığın talebiyle Bakanlığın gözetim ve denetimi altında birlikler veya konusunda uzmanlaşmış kamu kurum ve kuruluşlarınca düzenlenen uygulama gezisini tamamlamak ve gezi sonunda yapılan sınavda başarılı olmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile Devletin egemenlik alametlerine ve organlarının saygınlığına karşı suçlar, Devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, milli savunmaya karşı suçlar, Devlet sırlarına karşı suçlar ve casusluk, zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından; bu Kanuna veya 21/7/1983 tarihli ve 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanununa muhalefetten mahkûm olmamak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Daha önce meslekten çıkarılmamış olmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen mesleğe kabul koşullarının tümünü yerine getirenler, Bakanlığın talebiyle konusunda uzmanlaşmış kamu kurum ve kuruluşları tarafından yapılan mesleğe kabul sınavında başarılı olmaları hâlinde başarılı oldukları yabancı dilde turist rehberi olmaya hak kazanır. Birinci fıkranın (ç) bendinde belirtilen mesleğe kabul koşulunu yerine getiremeyenler, diğer mesleğe kabul koşullarını yerine getirmeleri ve Bakanlığın talebiyle konusunda uzmanlaşmış kamu kurum ve kuruluşları tarafından yapılan mesleğe kabul sınavında başarılı olmaları hâlinde, katıldıkları uygulama gezisine bağlı olarak bölgesel veya ülkesel Türkçe turist rehberi olmaya hak kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çince başta olmak üzere ülkemize yönelik turizm potansiyelini karşılamak amacıyla Bakanlıkça kültür ve turizm politikaları doğrultusunda belirlenecek Uzak Doğu dillerindeki adaylar için birinci fıkranın (c) bendindeki koşul aranmaz. Bu kişiler birinci fıkrada belirtilen diğer koşulları yerine getirmek ve en az ön lisans düzeyinde üniversite mezunu olmak kaydıyla turizm sektörünün bu alandaki acil ihtiyaçlarını karşılamak üzere Bakanlığın talebiyle Bakanlığın gözetim ve denetimi altında birlikler veya konusunda uzmanlaşmış kamu kurum ve kuruluşları tarafından, yönetmelik ile belirlenen usul ve esaslar çerçevesinde yapılan en az yüz saatlik eğitim programı ile uygulama gezisini başarıyla tamamlamaları şartıyla katıldıkları uygulama gezisine bağlı olarak ilgili yabancı dilde bölgesel veya ülkesel turist rehberi olmaya hak kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Üniversitelerin sanat tarihi ve arkeoloji bölümlerinden lisans düzeyinde mezun olanlar için birinci fıkranın (c) bendinde düzenlenen turist rehberliği eğitim programına katılma koşulu aranmaz. Bu kişiler, birinci fıkrada belirtilen diğer koşulları yerine getirmek, Bakanlığın talebiyle Bakanlığın gözetim ve denetimi altında birlikler veya konusunda uzmanlaşmış kamu kurum ve kuruluşları tarafından, yönetmelik ile belirlenen usul ve esaslar çerçevesinde yapılan en az yüz saatlik eğitim programı ile uygulama gezisini başarıyla tamamlamaları şartıyla başarılı oldukları yabancı dilde, katıldıkları uygulama gezisine bağlı olarak bölgesel veya ülkesel turist rehberi olmaya hak kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Mesleğe kabul başvurusu Bakanlığa yapılır. Bakanlık, otuz gün içinde gerekli incelemeleri yapar, başvuruyu kabul ettiği takdirde ruhsatnameyi düzenler, başvuruyu reddettiği hâllerde ret kararını gerekçesi ile birlikte başvuru sahibine bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Mesleğe kabul koşullarını taşımamalarına rağmen mesleğe kabul edilmiş olanlar, mesleğe kabulü engelleyen bir suçtan hüküm giyenler ile mesleğe engel hâli ortaya çıkanlar Bakanlık kararı ile meslekten çıkarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Birinci fıkranın (c) bendinde, üçüncü ve dördüncü fıkralarda belirtilen eğitim programının, birinci fıkranın (ç) bendinde belirtilen yabancı dil bilgisi seviye tespit sınavının ve (d) bendinde belirtilen uygulama gezisinin Bakanlığın talebine rağmen altı ay içerisinde birlikler tarafından düzenlenmemesi hâlinde eğitim programı, yabancı dil seviye tespit sınavı ve uygulama gezisi Bakanlık tarafından düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Mesleğin icrası, odaya üyelik ve meslek sicilleri">
      <mvz-fıkra no="1">
        <template>Meslek, bu maddede belirtilen usul ve esaslar çerçevesinde serbest meslek şeklinde veya 22/5/2003 tarihli ve 4857 sayılı İş Kanunu hükümlerine tabi olarak icra edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Turist rehberlerinin, yerleşim yerinin bulunduğu ilde kurulmuş odalardan birine, yerleşim yeri olan ilde oda kurulmamışsa en yakın ilde kurulmuş odalardan birine üye olmaları zorunludur. Hangi odaların hangi illerdeki turist rehberlerini üye olarak kaydedebilecekleri Bakanlıkça belirlenir. Turist rehberleri birden fazla odaya üye olamaz. Turist rehberlerinin oda üyeliğine kabulü için mesleğe kabul edilerek ruhsatname almış ve mesleğe kabul koşullarını kaybetmemiş olmaları gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Eylemli ve eylemsiz turist rehberlerinin ad, soyad ve sicil numaraları ilgili birliğin resmî internet sitesinde yayınlanır. Meslek sadece eylemli turist rehberleri tarafından icra edilebilir. Eylemli turist rehberi olabilmek için bir yıl süreyle geçerli olan çalışma kartının alınması zorunludur. Odaya üyelik koşullarını kaybetmiş veya odaya karşı yükümlülüklerini yerine getirmemiş olanlara çalışma kartı verilmez. Çalışma kartı almayan veya eylemsiz turist rehberi olarak kalmak üzere yazılı beyanda bulunan turist rehberleri eylemsiz turist rehberi olarak sicile işlenir. Eylemsiz turist rehberleri, meslek kuruluşları organlarının seçimlerinde oy kullanamaz ve bu organlarda görev alamazlar. Aralıksız sekiz yıl süreyle eylemsiz turist rehberi olarak kalanların eylemli turist rehberi olabilmeleri için, Bakanlık tarafından yapılan sınava katılarak başarılı olmaları gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Eylemli turist rehberlerinin ödeyecekleri aidat, onaltıyaşını doldurmuş olanlar için belirlenen aylık asgari ücretin brüt tutarının yüzde yirmisinden fazla olamaz. Eylemsiz turist rehberleri, eylemli turist rehberlerinin ödediği aidatın beşte biri oranında aidat öder. Turist rehberleri ilgili birlik tarafından yıllık olarak belirlenen oda aidatını iki eşit taksit hâlinde üyesi bulundukları odaya öderler. Süresi içinde ödenmeyen aidatlar kanuni faizi ile birlikte genel hükümlere göre tahsil edilir. İstisnasız tüm aidat alınmayacak hâller, Birlik tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Meslek, sadece çalışma kartında belirtilen yabancı dillerde, turist rehberinin Türkçe turist rehberi olması ya da tura katılanların Türkçe bilmeleri ve talep etmeleri hâlinde ise Türkçe olarak hukuka ve meslek etik ilkelerine uygun olarak icra edilir. Turist rehberleri mesleki onur ve itibarla bağdaşmayan herhangi bir faaliyet veya eylemde bulunamazlar. Mesleğin icrasında Türkiye’nin kültür, turizm, tarih, çevre, doğa, sosyal ve benzeri değerlerinin ve varlıklarının, Bakanlığın kültür ve turizm politikaları doğrultusunda tanıtılması esastır. Meslek etik ilkeleri yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Turist rehberleri; tur, paket tur, ulaşım veya konaklama gibi seyahat acentalığı faaliyeti kapsamına giren hizmetleri vermemek koşuluyla yalnızca turist rehberliği hizmeti sunabilir ve mesleğe ilişkin nitelik ve özelliklerini göstermek üzere yönetmelikle belirlenen usul ve esaslar çerçevesinde reklam ve tanıtım yapabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Meslek sicilleri odalar tarafından tutulur ve sicil işlemleri gecikmeksizin ilgili birliğe bildirilir. Birlik, veri tabanı oluşturur ve bu veri tabanını Bakanlığın kullanımına sunar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Disiplin cezaları ve soruşturma usulü">
      <mvz-fıkra no="1">
        <template>Mesleğini bu Kanun hükümlerine uygun olarak icra etmeyen ve meslek kuralları ile etik ilkelerine uymayan turist rehberleri hakkında aşağıdaki disiplin cezaları uygulanır:</template>
        <mvz-bent no="a">
          <template>Uyarma cezası; mesleğin icrasında daha dikkatli davranması gerektiğinin turist rehberine yazılı olarak bildirilmesidir. Uyarma cezası aşağıdaki hâllerde verilir:</template>
          <mvz-altbent no="1">
            <template>Meslek icra edilirken çalışma kartının veya turist rehberliği sözleşmesinin bulundurulmaması.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Meslek icra edilirken çalışma kartının görünür şekilde taşınmaması.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kınama cezası; mesleğini icra ederken kusurlu davrandığının turist rehberine yazılı olarak bildirilmesidir. Kınama cezası aşağıdaki hâllerde verilir:</template>
          <mvz-altbent no="1">
            <template>Tüketicinin yanıltılması suretiyle iş alınması.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Fiilin niteliği ve sonuçları itibarıyla daha ağır bir disiplin cezasını gerektirmediği hâllerde işin taahhüde aykırı olarak ifa edilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Meslek etik ilkelerine aykırı davranılması.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Turist rehberliği sözleşmesi yapmadan veya taban ücretin altında çalışılması.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Uyarma cezasının uygulandığı tarihten itibaren altı ay içinde ikinci kez uyarma cezası gerektiren bir fiilin işlenmesi.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Meslekten geçici men cezası; turist rehberinin mesleği icra etmesinin bir aydan bir yıla kadar yasaklanmasıdır. Meslekten geçici men cezası aşağıdaki hâllerde verilir:</template>
          <mvz-altbent no="1">
            <template>haklı veya zorunlu bir neden olmaksızın turun süre ve güzergâhının değiştirilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Yetkililerce yapılan denetimlerde bilgi vermekten kaçınılması.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Gerçeğin gizlenmesi, yalan veya eksik bilgi verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Turist gruplarına veya turistik kuruluşlara kasıtlı olarak zarar verilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Turizm meslek kuruluşlarına, yöneticilerine, çalışanlarına veya mesleğe karşı güven ve itibarı zedeleyecek veya turizme zarar verecek nitelikte haksız söz ve davranışlarda veya seyahat acentalığı niteliğinde faaliyette bulunulması.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Kanuni istisnalar saklı olmak üzere mesleğin çalışma kartı alınmadan veya çalışma kartında belirtilen dil veya diller dışında icra edilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Bölgesel turist rehberlerinin, bölgesi dışında turist rehberliği faaliyetinde bulunması.</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>Seçimlerin bu Kanuna ve bu Kanun uyarınca belirlenen kurallara uygun şekilde yapılmasının engellenmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="9">
            <template>Aynı yıl içinde iki kez kınama cezası alınması.</template>
          </mvz-altbent>
          <mvz-altbent no="10">
            <template>Bu Kanunun 7 nci maddesinin altıncı fıkrasında belirtilen fiilin beş yıl içinde iki kez işlenmesi.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Meslekten çıkarma cezası; ruhsatnamesinin geri alınarak turist rehberi unvanının kaldırılması ve turist rehberinin oda üyeliğinden silinmesidir. Meslekten çıkarma cezası aşağıdaki hâllerde verilir:</template>
          <mvz-altbent no="1">
            <template>Ülke yararına ve milli onura aykırı hareket, söz ve davranışlarda bulunulması.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>İki kez seyahat acentalığı niteliğinde faaliyette bulunulması.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Turist rehberi unvanı, ruhsatname veya çalışma kartı kullanılarak suç işlendiğinin veya işlenmesine yardım edildiğinin mahkeme kararıyla tespit edilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Mesleğe ilişkin iş ve işlemlerde sahte belge kullanılması veya yalan beyanda bulunulması.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Meslekten geçici men cezası uygulanan ilk fiilin işlendiği tarihten itibaren beş yıl içinde toplamı iki yılı aşacak şekilde meslekten geçici men cezası gerektiren fiillerin işlenmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Kanuni istisnalar saklı olmak üzere çalışma kartı almadan turist rehberliği hizmeti sunulduğunun iki kez tespit edilmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Bu Kanunun 7 nci maddesinin altıncı fıkrasında belirtilen fiilin beş yıl içinde üç kez işlenmesi.</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Meslekten geçici men veya çıkarma cezası alanlara ilişkin bilgiler ilgili birlik tarafından gecikmeksizin Türkiye Seyahat AcentalarıBirliğine bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Uyarma ve kınama cezasını gerektiren hâllerde üye olunan odanın yönetim kurulu; meslekten geçici men ve meslekten çıkarma cezasını gerektiren hâller ile oda ve birlik organlarının üyelerinin fiillerinde ise ilgili birlik yönetim kurulu tarafından resen veya oda yönetim kurulunun başvurusu üzerine ilgili birlik disiplin kurulu tarafından disiplin soruşturması başlatılır. Fiilin ilgili birliğe bildirilmesinden itibaren bir yıl içinde disiplin soruşturması sonuçlandırılır. Disiplin soruşturmasına ilişkin diğer usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Turist rehberi ücretleri">
      <mvz-fıkra no="1">
        <template>Taban ücret tarifesi, birlikler ile Türkiye Seyahat Acentaları Birliğinin görüşleri alınarak Bakanlık tarafından net ücret üzerinden belirlenir ve her yıl 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi hükümleri uyarınca tespit ve ilan edilen yeniden değerleme oranından az olmamak kaydıyla artırılarak en geç aralık ayında, izleyen takvim yılının başından itibaren yürürlüğe girmek üzere Bakanlık tarafından ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mesleğin Türkçe olarak icra edilmesi hâlinde, ücretler birinci fıkra kapsamında belirlenen taban ücretin yüzde yetmişinden az olmamak üzere Bakanlık tarafından belirlenir ve ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Turist rehberleri, Bakanlık tarafından belirlenerek ilan edilen ücretlerin altında turist rehberliği hizmeti sunamazlar. Bu ücretlerin altında çalışılabilecek sosyal ve kamusal nitelikli turist rehberliği hizmetleri yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Turist rehberlerinin tur için belirlenen ücreti ihtiva eden yazılı turist rehberliği sözleşmesi yapmaları zorunludur. Haklı nedenlerin bulunduğu hâllerde ve daha sonra yazılı olarak düzenlenmek kaydıyla e-posta, faks, telefon mesajı ve benzeri yollarla sözleşme yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tur için yazılı sözleşme yapmayan veya taban ücretin altında ücret ile çalışan turist rehberi, ilgili birlik tarafından her bir fiil için ayrı ayrı olmak, birlik bütçesine gelir kaydedilmek ve üç günlük taban ücretinden az olmamak üzere turun toplam süresine karşılık gelen taban ücret kadar idari para cezasıyla cezalandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Mesleğin korunması">
      <mvz-fıkra no="1">
        <template>Turist rehberliği hizmetleri sadece turist rehberleri tarafından sunulur. Başka sıfat veya unvanlarla icra edilen ancak bu Kanun uyarınca turist rehberliği niteliği taşıyan her türlü hizmetin yürütülmesinde mesleği icra etme koşullarını taşıyan kişiler çalıştırılır. Kamu kurum ve kuruluşlarının resmî faaliyetlerinde turist rehberliği hizmeti verecek ruhsatname sahibi bir kamu görevlisinin görevlendirilmiş olması hâlinde ayrıca turist rehberi bulundurulması zorunlu değildir.  Millî Eğitim Bakanlığına bağlı okul ve kurumlar tarafından öğrencilere yönelik olarak öğretmen refakatinde ve ticari amaç gözetilmeksizin yapılan geziler bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamı dışında hangi ad altında olursa olsun turist rehberliği niteliğinde bir faaliyet yürütülmesine hak kazandıracak eğitim programları düzenlenemez veya belge verilemez. Bu hükme aykırı hareket edenler hakkında Bakanlık tarafından fiilin ağırlığı ile süresi dikkate alınarak beşbin Türk Lirasından onbeşbin Türk Lirasına kadar idari para cezası uygulanır. Bu fiillerin işlenmesi durumu mesleğe engel hâl oluşturur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ruhsatname sahibi olmadan turist rehberliği hizmeti sunanlar bu fiilin tekrarı hâlinde mesleğe kabul edilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İkinci fıkrada yasaklanan fiilleri işleyenler ile ruhsatname sahibi olmadan veya meslekten geçici olarak men edilmiş veya çıkarılmış olmasına rağmen turist rehberliği hizmeti sunanlar, birlik tarafından veya ilgili mülki idare amirlerince faaliyetten men edilir .</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ruhsatname sahibi olmadan rehberlik hizmetinde bulunulamaz, bulunanlar hakkında hizmet verilen kişi sayısı ve bölgenin özellikleri dikkate alınarak ilgili mülki idare amiri tarafından yirmibeşbin Türk Lirasından yüzbin Türk Lirasına kadar idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Turist rehberliği hizmetinin verilmesi sırasında, bu hizmeti alanların bilgisi ve onayı dışında alışveriş amaçlı belirli bir işletmeye gönderilmeleri karşılığında kendisine veya yönlendireceği kişiye herhangi bir menfaat temin eden turist rehberleri hakkında ilgili mülki idare amiri tarafından yirmibeşbin Türk Lirasından yüzbin Türk Lirasına kadar idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Eylemsiz turist rehberlerinden turist rehberliği hizmeti sunanlar, Bakanlık tarafından binbeşyüz Türk Lirası idari para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu Kanuna göre verilen idari para cezaları tebliğ tarihinden itibaren bir ay içinde tahsil edilir. Bu Kanunda hüküm bulunmayan hâllerde idari para cezaları hakkında 30/3/2005 tarihli ve 5326 sayılı Kabahatler Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Turist rehberliği hizmetleri ile ilgili olarak bu Kanunda öngörülen her türlü denetim, yönetmelikle belirlenen usul ve esaslar çerçevesinde Bakanlık veya meslek kuruluşları tarafından yapılır. Denetimlerde iş birliği yapılması amacıyla ihtiyaç duyulması veya Türkiye Seyahat Acentaları Birliğinin talebi hâlinde Türkiye Seyahat Acentaları Birliğinden temsilci alınabilir. Bakanlık ve meslek kuruluşları gerek gördüğünde kolluk güçlerinden yardım alır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Meslek Kuruluşları">
    <mvz-madde no="8" başlık="Meslek kuruluşlarının nitelikleri, kurulması ve görevleri">
      <mvz-fıkra no="1">
        <template>Bu Kanunda belirtilen görevleri yapmak ve yetkileri kullanmak ve odaların üst kuruluşu olmak üzere tüzel kişiliğe sahip ve kamu kurumu niteliğinde meslek kuruluşu niteliğinde birlikler, Türkiye genelinde kayıtlı toplam meslek mensubu sayısının yüzde otuzüçüne sahip odaların Bakanlığa yapacakları başvuru üzerine kurulabilir. Birden fazla meslek birliği kurulabilir. Başvuru ile ilgili usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sınırları içinde en az yüzelli turist rehberinin yerleşim yerinin bulunduğu her ilde, o ilde kayıtlı toplam meslek mensubu sayısının yüzde otuzüçünün valiliğe başvurusu üzerine tüzel kişiliğe sahip ve kamu kurumu niteliğinde meslek kuruluşu olan oda kurulabilir. Odaların merkezleri kuruldukları ildir. Aynı ilde birden fazla oda kurulabilir. Odaların yetki çevresi coğrafi olarak yakın iller ve çalışma bölgesi dikkate alınarak Bakanlık tarafından belirlenir. Ancak oda olmayan illerde en az elli turist rehberinin oda merkezinin bulunacağı ili belirten başvurusu üzerine Bakanlık tarafından tüzel kişiliğe sahip kamu kurumu niteliğinde meslek kuruluşu olan bölgesel odalar kurulabilir. Odalar, birliğin üyesidir. Üye sayısı ellinin veya il bazında kayıtlı olan toplam turist rehberi sayısının en az yüzde yirmisinin altına düşen odalar, bu durumun tespit edildiği tarihten itibaren altı aylık süre sonunda da devam etmesi hâlinde; iki mali yıl üst üste bilançosu menfi bakiye veren odalar ise ikinci bilançonun açıklanmasını müteakiben ilgili birlik yönetim kurulunun kararıyla kapatılarak tasfiye edilir ve tasfiye sonucunda kalan malvarlığı ilgili birliğe devredilir. Bölgesel odalar, odalar hakkındaki hükümlere tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Meslek kuruluşlarının görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Üyelerinin müşterek ihtiyaçlarını karşılamak ve mesleki faaliyetlerini kolaylaştırmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Mesleğin genel menfaatlerine ve ulusal turizm ve tanıtım politikalarına uygun olarak ifa edilmesini ve gelişmesini sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Meslek mensuplarının birbirleri ve halkla olan ilişkileri ile mesleğin icrasında dürüstlüğü ve güveni hakim kılmak üzere; meslek etiğini ve disiplini korumak, turist rehberleri arasındaki haksız rekabetin önlenmesi hususunda gerekli tedbirleri almak, turist rehberlerinin yetiştirilmesi için kurs, seminer ve eğitim programları düzenlemek, meslek konusunda araştırma ve incelemeler yapmak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bakanlıkça istenilen konularda görüş bildirmek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bu Kanun ve ilgili mevzuatta belirtilen görevleri yerine getirmek.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birlik, odalara sınırlarını açıkça belirlemek şartıyla yetki devri yapabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Birlik yönetim kurulu, oda bulunmayan illerde temsilcilik açabilir veya talepleri hâlinde odalara temsilcilik açma yetkisi verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Meslek kuruluşları, faaliyetlerini gerektiğinde turizm sektöründeki özel veya resmî kurum ve kuruluşlarla iş birliği içerisinde yürütebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bakanlık, turist rehberliği hizmetleri ve ilgili her türlü faaliyetin bu Kanun ve ilgili mevzuatta belirtilen usul ve esaslar çerçevesinde icra edilmesini sağlamak ve mevzuata aykırı şekilde icra edilmesini önlemek amacıyla, gerektiğinde meslek kuruluşlarıyla iş birliği yaparak gerekli tedbirleri alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Birlikler, faaliyet alanı ile ilgili ulusal ve uluslararası kuruluşlara üye olabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu Kanun hükümleri dışında meslek kuruluşu kurulamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Denetim ve gözetim">
      <mvz-fıkra no="1">
        <template>Bakanlık, meslek kuruluşlarının ve iştiraklerinin her türlü iş, işlem, faaliyet ve hesaplarını müfettişler ve kontrolörler aracılığıyla gerektiğinde ve en geç üç yılda bir zorunlu olarak denetleme yetkisini haizdir. Meslek kuruluşları denetim esnasında her türlü bilgiyi vermek ve belgeyi göstermekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Meslek kuruluşlarının organ üyeleri ile personeli, görevlerini yerine getirirken görevleriyle ilgili suç teşkil eden fiil ve hareketlerinden, meslek kuruluşlarının paralarıyla para hükmündeki evrak, senet ve sair varlıkları ile muhasebe ve muamelata ilişkin her çeşit defter ve evrak ile ilgili olarak işledikleri suçlardan dolayı kamu görevlisi gibi cezalandırılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada belirtilen yükümlülüklerini yerine getirmeyen veya ikinci fıkrada belirtilen suçlardan dolayı haklarında kovuşturmaya başlanan ya da yapılan denetim bakımından görevi başında kalması sakıncalı görülen meslek kuruluşunun personeli Bakanlık müfettişinin teklifi üzerine üç ay süre ile Bakanlık tarafından geçici olarak görevden uzaklaştırılabilir. Gerekli görülmesi hâlinde bir defaya mahsus olmak üzere bu süre Bakanlık tarafından üç ay daha uzatılabilir. Görevden uzaklaştırılan personele, uzaklaştırma süresi boyunca yapılacak ödemelerin üçte ikisi ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde kapsamında görevden uzaklaştırılanlar; denetim sırasında veya denetimin tamamlanmasından sonra Bakanlık kararıyla veya haklarında kovuşturmaya yer olmadığına karar verildiği ya da mahkûmiyetlerine karar verilmediği takdirde görevlerine dönerler. Görevine iade edilenlerin uzaklaştırma süresi boyunca mahrum kaldığı ödemeleri, kanuni faizleri ile birlikte istihdam edildikleri meslek kuruluşu tarafından ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Milli güvenliğin, kamu düzeninin, suç işlenmesini veya suçun devamını önlemenin yahut yakalamanın gerektirdiği hâllerde gecikmede sakınca varsa, birliklerin ve odaların organları Bakanlık tarafından faaliyetten men edilebilir. Faaliyetten men kararı, yirmidört saat içinde görevli hakimin onayına sunulur. Hakim, kararını kırksekiz saat içinde açıklar; aksi hâlde, bu idari karar kendiliğinden yürürlükten kalkar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bakanlık, bu madde kapsamında açılan davaları katılan sıfatıyla takip edebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Meslek kuruluşlarının organları, seçimleri, görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>Odaların organları genel kurul, yönetim kurulu ve denetim kurulu; birliklerin organları genel kurul, yönetim kurulu, denetim kurulu ve disiplin kuruludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Oda genel kurulu, en az altı aydır eylemli olan oda üyesi turist rehberlerinden; birlik genel kurulu oda başkanları ile her oda genel kurulunun kendi üyeleri arasından her elli üyesi için bir delege olmak ve üç yıl görev yapmak üzere seçeceği delegelerden oluşur. Ayrıca, delege sayısı kadar, delege sıfatının yitirildiği hâllerde seçilme sıraları esas alınarak o görev dönemini tamamlamak üzere yedek delege seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Meslek kuruluşları genel kurullarının görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Yönetim kurulunun geçmiş dönem faaliyetleri ile bilançosunu gösteren raporun, bilanço gelir ve gider hesaplarının okunup müzakere edilerek kabulü veya reddine, yönetim kurulunun ibra edilip edilmemesine ve denetim kurulu raporunun okunarak kabul edilip edilmemesine ve denetim kurulu üyelerinin ibra edilip edilmemesine karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yeni dönem çalışma programının ve yönetim kurulu tarafından hazırlanan tahmini bütçenin görüşülerek kabulüne veya reddine karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İhtiyaç duyulan taşınmazların satın alınması veya mevcut taşınmazların satılması veya üzerinde ipotek dâhil ayni hak tesis edilmesi hususunda yönetim kuruluna yetki vermek.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Sermaye şirketi, kooperatif veya vakıf kurma ya da kurulu bulunanlara katılma kararı almak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İş, işlem veya faaliyetleri nedeniyle hukuki veya cezai sorumluluğu tespit edilen organ üyeleri hakkında dava açılmasına ve bunların görevde kalıp kalmamasına karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Yönetim kurulu tarafından sunulan hususları görüşüp karara bağlamak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Olağan toplantılarda, katılanların beşte biri tarafından görüşülmesi, gündemden çıkarılması veya gündeme alınması önerilen konuları gündeme almak, gündemden çıkarmak veya görüşerek karara bağlamak.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Bu Kanun ve diğer mevzuatla verilen görevleri yerine getirmek.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Genel kurul, genel kurul üyelerinin dörtte birinin noter onaylı yazılı başvurusu üzerine yönetim kurulu tarafından olağanüstü toplantıya çağrılır. Olağanüstü toplantıda çağrıda belirlenen gündem dışında görüşme yapılamaz. Olağanüstü toplantıyla ilgili her türlü işlem ve faaliyetler yönetim kurulunca yürütülür. Yönetim kurulunun haklı nedenlerle bu görevi yerine getirememesi hâlinde bu işlem ve faaliyetlerin kimler tarafından yürütüleceği odalarda birlik tarafından, birlikte ise Bakanlık tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Meslek kuruluşlarının genel kurullarının çalışma usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Başkanların seçimine ve yönetim kurullarının oluşumuna ve çalışmasına ilişkin usul ve esaslar aşağıda gösterilmiştir:</template>
        <mvz-bent no="a">
          <template>Meslek kuruluşlarının yönetim kurulları, başkan dâhil olmak üzere beş asıl üyeden oluşur. Oda yönetim kurullarında asıl üye sayısı odaya üye her ikiyüz turist rehberi için birer kişi artırılır, ancak yönetim kurulu asıl üye sayısı başkan dâhil olmak üzere dokuzu aşamaz. Başkan ve yönetim kurulu üyeleri üç yıllık süre için seçilir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Oda başkanları ile oda yönetim kurulunun asıl ve yedek üyeleri oda genel kurulu tarafından oda üyesi eylemli turist rehberleri arasından, birlik başkanı ile birlik yönetim kurulunun asıl ve yedek üyeleri birlik genel kurulu tarafından birlik genel kurul üyeleri arasından seçilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Seçimlerde her üyenin aday olma hakkı vardır. Oy pusulalarında aday olanların adları alfabetik sıraya göre sıralanır. Oy pusulaları adayların adları yanına işaret konacak kare şeklindeki kutulara yer verilmek suretiyle çoğaltılır ve ilçe seçim kurulu mührü ile mühürlendikten sonra kullanılır. Oylar pusulada yer alan adaylardan seçilecek üye veya temsilcilik sayısınca adayın ismi yanındaki kutu işaretlenmek suretiyle kullanılır. Oy verme işlemi gizli oy, açık tasnif esaslarına göre yapılır. Üye listesinde adı yazılı bulunmayan meslek mensupları oy kullanamaz. Oylar, oy verenin kimliğini resmî kuruluşlarca verilen belgeyle ispat etmesinden ve listedeki isminin karşısındaki yeri imzalamasından sonra kullanılır. Oylar, üzerinde ilçe seçim kurulu mührü bulunan ve oy verme sırasında sandık kurulu başkanı tarafından verilen zarflara konulmak suretiyle kullanılır. Seçilecek kişi sayısından fazla adayın işaretlendiği veya mühürsüz oy pusulası ve zarfla kullanılan oylar geçersiz sayılır.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Seçime katılan adayların adları alt alta ve aldıkları geçerli oy adlarının hizalarına yazılır. Adayların aldıkları oylar en büyükten en küçüğe doğru sıralanır. Asıl ve yedek üyelikler, adaylara rakamlarının büyüklük sırasına göre tahsis olunur. Sona kalan üye veya temsilcilik için oyların eşit olması hâlinde, bunların arasında ad çekilmek suretiyle tahsis yapılır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yönetim kurulları en az ayda bir kez toplanır. Başkanlık sıfatı dâhil yönetim kurulu üyeliği ölüm, istifa, görevi yerine getirmeye engel hastalık, meslekten çıkarma veya mazeretsiz olarak üç kere üst üste toplantıya katılmama hâllerinde sona erer. Başkanlık sıfatının yitirildiği hâllerde, yönetim kurulu asıl üyeleri kendi aralarından görev süresini tamamlamak üzere bir başkan seçer. Başkan seçilen asıl üyenin yerine seçilme sırasına göre birinci yedek üye asıl üyelik sıfatını kazanır. Birlik başkanı seçilen oda başkanı oda başkanlığı sıfatını yitirir. Aynı kişi, üst üste iki dönemden fazla başkan olarak seçilemez. Yönetim kurulu asıl veya yedek üyelerinin, kurulun karar yeter sayısının altına düşmesi sonucunu doğuracak şekilde istifası hâlinde üç ay içinde yapılacak seçimlere kadar odalar birlik, birlik ise Bakanlık tarafından görevlendirilen üç kişilik kurul tarafından yönetilir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Meslek kuruluşlarının yönetim kurullarının görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Genel kurul kararlarının gereğini yerine getirmek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Genel kurul gündemini hazırlamak ve genel kurulu toplantıya çağırmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yıllık bilanço, faaliyet raporu ve tahmini bütçeyi hazırlayıp genel kurula sunmak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bütçe içinde ödenek aktarmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Gerekli hâllerde başkanın teklifi üzerine sınırları açıkça belirtilmek kaydıyla meslek kuruluşunu münferit olarak temsil edecek üyeleri yetkilendirmek.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Genel kurulun verdiği yetki dâhilinde taşınmazlara ilişkin alım, satım, ipotek dâhil ayni hak tesisi ve mülkiyete ilişkin benzeri işlemleri yapmak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Faaliyetler için gereksinim duyulan taşınmazları kiralamak ve gerekli hâllerde kira sözleşmesini feshetmek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Faaliyetler için gereksinim duyulan taşınırları satın almak veya kiralamak, mevcutları satmak veya kiralamak.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Üyelik işlemlerini denetlemek.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Üyelerin mesleki faaliyetlerini denetlemek ve tüketici şikayetlerini değerlendirmek.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Sosyal tesisler kurmak ve işletmek.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Bu Kanun ve diğer mevzuatla verilen görevleri yerine getirmek.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Yönetim kurulları üye tam sayısının salt çoğunluğu ile karar alır. Yönetim kurullarının çalışma usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Denetim kurullarının oluşumuna ve çalışmasına ilişkin usul ve esaslar aşağıda gösterilmiştir:</template>
        <mvz-bent no="a">
          <template>Meslek kuruluşlarının denetim kurulları, ilgili genel kurul üyeleri arasından, üç yıl için seçilen üç asıl ve üç yedek üyeden oluşur. Denetim kurulları ilk toplantılarında kendi üyeleri arasından bir başkan seçer. Denetim kurulları en az ayda bir toplanır ve yaptıkları denetim sonuçlarını üç ayda bir yönetim kuruluna ve dönem sonunda da genel kurula rapor hâlinde sunar. Denetim kurulu üyeliği ölüm, istifa, görevi yerine getirmeye engel hastalık, meslekten çıkarma veya mazeretsiz olarak üst üste üç toplantıya katılmama hâllerinde sona erer. Bu durumda, yedek üyelerden en fazla oy alan üye denetim kurulunca yazılı olarak göreve çağrılır. Denetim kurulu asıl veya yedek üyelerinin, kurulun karar yeter sayısının altına düşmesi sonucunu doğuracak şekilde istifası hâlinde ilk genel kurul toplantısına kadar odalarda birlik, birlikte Bakanlık tarafından bir denetçi atanır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Denetim kurulları, olağan genel kurul toplantısından en az bir ay öncesinde ve başkanın uygun göreceği diğer tarihlerde denetim yapar. Yapılan her denetim sonucunda bir denetim raporu düzenlenir. Denetim raporu sadece hukuka ve mali kurallara uygunluk hususlarında oy çokluğuyla düzenlenir, muhalif üyeler gerekçelerini rapora eklemek zorundadır. Denetim raporları genel kurul toplantısından en az bir hafta önce genel kurul üyelerinin incelemesine sunulur ve genel kurulda okunur. Denetim kurullarının çalışma usul ve esasları yönetmelikle belirlenir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>(b) bendi hükümleri saklı kalmak kaydıyla denetim kurulları oyçokluğuyla alacakları kararlarla, hukuka ve mali kurallara uygunluğuna dair tereddüt duydukları hususları yönetim kuruluna bildirir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Birlik disiplin kurulu, aday olan veya genel kurul üyelerince aday gösterilen genel kurul üyeleri arasından üç asıl ve iki yedek, genel kurul üyelerince aday gösterilen avukat veya hukuk fakültesi öğretim üyeleri arasından iki asıl ve bir yedek olmak üzere birlik genel kurulunca üç yıl için seçilen beş asıl ve üç yedek üyeden oluşur. Asıl üyelerin üyelik sıfatını yitirdiği hâllerde yedek üyeler seçilme usulüne göre seçilme sıraları esas alınarak asıl üye sıfatını kazanır. Birlik disiplin kurulu, turist rehberlerinin disiplin işlemlerini bu Kanun ve ilgili mevzuatta öngörülen usul ve esaslar çerçevesinde yürütür. Birlik disiplin kurulu, üye tam sayısının salt çoğunluğuyla karar alır. Birlik disiplin kurulunun görev, yetki ve sorumlulukları ile çalışma usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Meslek kuruluşu organlarına seçilenlerin organ üyeliği, oda üyeliğinin veya turist rehberi sıfatının kaybedilmesi hâlinde sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Seçimler aşağıdaki usul ve esaslara göre yapılır:</template>
        <mvz-bent no="a">
          <template>Organ üyelerinin seçimleri, bu Kanunda yazılı usul ve esaslara göre gizli oyla ve yargı gözetimi altında yapılır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Genel kurullar tarafından seçim yapılan hâllerde, genel kurula katılma hakkına sahip olanları gösteren liste, toplantının gündemi, yeri, günü, saati ile çoğunluk olmadığı takdirde yapılacak ikinci toplantıya ilişkin hususları belirten bir yazı ilgili yönetim kurulu tarafından üç nüsha olarak ve toplantı tarihinden en az otuz gün önce, ilgili meslek kuruluşunun merkezinin bulunduğu yer ilçe seçim kurulu başkanlığına sunulur. Bir yerde birden fazla ilçe seçim kurulu bulunduğu takdirde görevli ilçe seçim kurulu, il seçim kurulunca belirlenir. İlçe seçim kurulu başkanlığı, gerektiğinde ilgili kayıt ve belgeleri de getirtip incelemek suretiyle varsa noksanları tamamlattırdıktan sonra genel kurula katılma hakkına sahip olanları belirleyen listeyi başvuru tarihini izleyen on gün içinde onaylar. Bu süre içinde onay verilmemesi hâlinde sunulan liste kesinleşmiş sayılır. Onaylanan veya kesinleşmiş sayılan liste, ilgisine göre birlik veya odanın merkezindeki ilan tahtasında ve elektronik ortamda yedi gün süreyle ilan edilir. Birlik genel kurulları tarafından seçim yapıldığı takdirde aynı süre içinde odalara yazılı bildirim yapılır. İlan süresini veya yazılı bildirim hâlinde bildirimi izleyen üç gün içinde ilçe seçim kuruluna itiraz edilebilir. İtirazlar ilçe seçim kurulu tarafından incelenir ve en geç yedi gün içinde kesin olarak karara bağlanır. Bu suretle kesinleşen listeler seçimin yapılacağı meslek kuruluşuna gönderilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yönetim kurulunca seçim yapılan hâllerde, toplantıdan yedi gün önce seçimi yapan meslek kuruluşunun merkezinin bulunduğu ilçe seçim kurulu başkanlığına başvurulur.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Seçimde görevli hâkimlere 26/4/1961 tarihli ve 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanuna göre ücret ödenir. Bu ücret ve diğer seçim giderleri, ilgili meslek kuruluşu tarafından karşılanır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Seçimler sırasında görevli hâkime veya sandık kurulu başkanı veya üyelerine karşı işlenen suçlar kamu görevlisine karşı işlenmiş sayılır.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Seçimlere ilişkin diğer usul ve esaslar yönetmelikle düzenlenir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Meslek kuruluşu organlarının üyelerine yapılan ödemeler yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="14">
        <template>Turist rehberleri, odaların yönetim ve denetim, birliklerin ise yönetim, denetim ve disiplin kurullarından sadece birinde görev alabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="15">
        <template>Organ üyeleri; organ üyeliklerine seçim dışında, kendilerini, eşlerini veya üçüncü dereceye kadar kan ve kayın hısımlarını ilgilendiren konuların görüşüldüğü toplantılara katılamaz ve oy kullanamazlar. Bu hâllerde toplantı çoğunluğu sağlanamazsa yedek üyeler sırasıyla davet edilerek toplantı çoğunluğu sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="16">
        <template>Meslek kuruluşları amaçları dışında herhangi bir faaliyette bulunamazlar. Kuruluş amaçları dışında faaliyet gösteren veya bu Kanunda belirtilen asli görevlerini Bakanlığın uyarısına rağmen yerine getirmeyen meslek kuruluşlarının sorumlu organlarının görevlerine son verilmesine Bakanlığın veya bu kuruluşların bulundukları yer Cumhuriyet savcılığının istemi üzerine o yerdeki asliye hukuk mahkemesince karar verilir. Görevlerine son verilen organların yerine bu Kanun ve ilgili mevzuattaki usul ve esaslara göre en geç üç ay içinde yapılacak genel kurul toplantısına kadar, odalar birlik tarafından, birlik ise Bakanlık tarafından görevlendirilen üç kişilik kurul tarafından yönetilir. Görevlerine son verilen organ üyelerinin her türlü hukuki ve cezai sorumlulukları saklıdır. Organların bu fıkra hükümleri gereğince görevlerine son verilmesine neden olan ve mahkeme kararında belirtilen tasarrufları hükümsüzdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="17">
        <template>Meslek kuruluşlarının hukuki temsilcileri başkanlarıdır. Başkanın teklifi üzerine yönetim kurulu kendi üyeleri arasından en fazla iki başkan yardımcısı seçer. Başkan yardımcıları başkanın verdiği yetki dâhilinde veya başkanın yokluğu hâlinde başkanın görevlerini yerine getirirler. Başkan, genel kurul ile yönetim kurulunun yetkileri saklı olmak üzere, meslek kuruluşu adına düzenlenen taahhütname, sözleşme ve vekâlet gibi meslek kuruluşunu hukuken bağlayan hukuki işlemleri yapmaya yetkilidir. Başkan bu yetkisinin başkan yardımcılarından birinin, yönetim kurulunun bir üyesinin veya genel sekreterin imzasıyla müşterek olarak kullanılmasına karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="18">
        <template>Meslek kuruluşları bünyesinde kurulan hizmet birimleri ile bunların görev ve yetkileri, genel kurul tarafından karara bağlanır. İdari işleri yürütmek üzere bir genel sekreter, en fazla iki genel sekreter yardımcısı ile yeterli sayıda çalışandan oluşan genel sekreterlik oluşturulur. Genel sekreter başkanın teklifi üzerine yönetim kurulu tarafından, genel sekreter yardımcıları ise genel sekreterin teklifi üzerine başkan tarafından atanır. Genel sekreterin yürüteceği iş, sorumluluk, görev ve yetkileri yönetim kurulu tarafından, genel sekreter yardımcılarının ise genel sekreter tarafından belirlenir. Başkan, idari işlere ilişkin tek başına sahip olduğu karar ve imza yetkilerinden gerekli gördüklerini genel sekretere devredebilir. Hizmet birimlerinde çalıştırılan personelin ücretleri ile mali ve sosyal hakları yönetim kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Meslek kuruluşlarının gelir ve giderleri">
      <mvz-fıkra no="1">
        <template>Meslek kuruluşlarının gelirleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Düzenledikleri belgeler için alınan ücretler.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sosyal, kültürel ve eğitim faaliyetlerinden elde edilen gelirler.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bağış ve yardımlar.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yayın gelirleri.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yapılan hizmetler karşılığı alınan ücretler.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Taşınır ve taşınmaz sermaye iratları, iştirak ve şirket kârları ve döviz gelirleri.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kamu kurum ve kuruluşlarından alınan destek ve yardımlar.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Aidat, ceza ve diğer gelirler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Odaların bir takvim yılı içinde elde ettikleri gelirden, yüzde yirmiyi aşmayacak oranda birlik genel kurulu tarafından belirlenen tutar birliğe gelir olarak kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Meslek kuruluşları bu Kanun ve diğer mevzuat uyarınca öngörülen görevlerini yerine getirmek üzere gereken giderleri, bütçelerinde belirlenen veya yönetim kurullarında belirtilen şekilde yapabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Meslek kuruluşları, kuruluş amaçlarını gerçekleştirmek için taşınır ve taşınmaz almaya, satmaya, inşa, ifraz, tevhit ve rehnetmeye, burs vermeye, bağış ve yardımda bulunmaya, sosyal faaliyetleri desteklemek ve özendirmek amacıyla yardım yapmaya, bu Kanun hükümleri çerçevesinde şirket veya vakıf kurmaya ya da kurulu şirketlere iştirak etmeye, derneklere ve kooperatiflere üye olmaya ve benzeri hukuki işlemleri yapmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Çeşitli ve Son Hükümler">
    <mvz-madde no="12" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Turist rehberliği niteliğindeki hizmet, faaliyet ve bunlara yönelik sözleşmeler, turist rehberlerinin disiplin, sicil ve çalışma kartlarına ilişkin hususlar ile meslekte uzmanlığa yönelik kurs, seminer ve eğitim programları birlik tarafından çıkarılan yönetmelik ile düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlığın meslek kuruluşları üzerindeki idari ve mali denetimine ilişkin usul ve esaslar ile bu Kanunla Bakanlığa verilen yetki ve görevlere ilişkin hükümlerin uygulanmasına dair hususlar Bakanlık tarafından çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Değiştirilen hükümler">
      <mvz-fıkra no="1" durum="işlenmiş">
        <template>(16/4/2003 tarihli ve 4848 sayılı Kültür ve Turizm Bakanlığı Teşkilât ve Görevleri Hakkında Kanun ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="2" durum="işlenmiş">
        <template>(14/9/1972 tarihli ve 1618 sayılı Seyahat Acentaları ve Seyahat Acentaları Birliği Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Saklı tutulan haklar" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla rehberlik kimlik kartına sahip olanların hakları, bu Kanunun 3 üncü maddesinin birinci fıkrasının (a), (e) ve (f) bentlerinde öngörülen koşulları taşımaları ve bu Kanuna göre kurulan ilgili odaya kuruluş tarihinden itibaren altı ay içinde kaydolmaları şartıyla saklıdır. Ancak başvuruda bulunan rehberlerin rehberlik kimlik kartları ruhsatname ile değiştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bölgesel rehberlik kimlik kartına sahip olan rehberler, bu Kanuna göre kurulan ilgili odaya kuruluş tarihinden itibaren altı ay içinde kaydolmak şartıyla sadece rehberlik kimlik kartında belirtilen bölgede, dil veya dillerde faaliyet gösterebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun yürürlüğe girdiği tarihte Bakanlık tarafından açılmış olan rehberlik kurslarına kaydolanlar, süresine ve niteliğine bakılmaksızın bu eğitimi tamamlamaları ve bu Kanunun 3 üncü maddesinin birinci fıkrasında öngörülen koşulları taşımaları kaydıyla mesleğe kabul edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ülkesel veya bölgesel rehberlik kimlik kartına sahip iken, vize yükümlülüğünü yerine getirmemesi veya kamu kurum ve kuruluşlarında çalışmaları ya da ilgili mevzuatları gereği başka iş ve hizmet yasağı nedeniyle meslekten men edilenler, meslekten çıkarılanlar veya rehberlik kimlik kartı iptal edilenler, bir yıl içinde Bakanlığa başvurmaları, bu Kanunun 3 üncü maddesinin birinci fıkrasının (a), (b) ve (e) bentlerinde öngörülen koşulları taşımaları ve Bakanlık tarafından yapılan sınavda başarılı olmaları kaydıyla mesleğe kabul edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Seçim ve devir işlemleri" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte 7/6/2005 tarihli ve 5362 sayılı Esnaf ve Sanatkarlar Meslek Kuruluşları Kanununa göre kurulmuş bulunan rehberlik meslek kuruluşları, tüm alacak, borç ve malvarlıklarıyla birlikte bu Kanun hükümlerine tabi rehber odası niteliğini kazanırlar ve faaliyetlerini bu Kanuna tabi olarak yürütürler. Bu kuruluşların bu Kanun uyarınca yapılması gerekli organ seçimleri, bu Kanunun yürürlüğe girdiği tarihten itibaren üç ay içinde yapılır. Bu kuruluşlar borçtan arî malvarlıklarının yüzde yirmisini veya buna karşılık gelen nakit meblağı birlik organlarının seçimini izleyen üç ay içinde birliğe devrederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunda öngörülen seçimler, bu Kanunun yürürlüğe girdiği tarihten itibaren bir yıl içinde tamamlanır. Birliğin genel kurulu ve yönetim kuruluna verilen görevler, bu süre içinde, birinci fıkra uyarınca oda niteliğini kazanan rehberlik meslek kuruluşlarının başkanlarından oluşan ve üye sayısının çoğunluğuyla toplanıp karar alan bir kurul tarafından yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanun uyarınca yapılan devir işlemleri kapsamında yapılacak işlemler her türlü vergi ve harçtan, düzenlenen kağıtlar ise damga vergisinden istisnadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Taban ücret tarifesi" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre yeni taban ücret tarifesi belirlenene kadar mevcut taban ücret tarifesinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Rehberlik kimlik kartının ruhsatname ile değiştirilmesi" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarih itibarıyla bu Kanunun geçici 1 inci maddesinin birinci fıkrası kapsamında rehberlik kimlik kartını ruhsatname ile değiştirmeyenlerin rehberlik kimlik kartları, bu Kanunun 3 üncü maddesinin birinci fıkrasının (a), (e) ve (f) bentlerindeki koşulları taşımaları ve bu Kanuna göre kurulan ilgili odaya kaydolmaları şartıyla, bu maddenin yürürlüğe girdiği tarihten itibaren bir yıl içinde başvurmaları hâlinde ruhsatname ile değiştirilir. Bu süre Bakanlık tarafından bir yıl uzatılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Yabancı dil yeterliliği bakımından saklı tutulan haklar" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun geçici 4 üncü maddesi kapsamında rehberlik kimlik kartını ruhsatname ile değiştirenlerin, bu Kanunun 3 üncü maddesinin birinci fıkrasının (ç) bendinde belirtilen belgeyi sunmaları zorunludur. Aksi takdirde Türkçe turist rehberi olarak mesleklerini icra edebilirler. Yabancı dil yeterliliğini belgelemeleri hâlinde ise çalışma kartı alarak, yeniden başarılı oldukları dilde mesleklerini icra edebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Mesleğe yeniden kabul sınavı" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun geçici 1 inci maddesinin dördüncü fıkrası kapsamında Bakanlıkça yapılan sınava katılmayanlar ile sınavda başarısız olanlar bu maddenin yürürlük tarihinden itibaren bir yıl içinde Bakanlığa başvurmaları, bu Kanunun 3 üncü maddesinin birinci fıkrasının (a), (b) ve (e) bentlerinde öngörülen koşulları taşımaları ve Bakanlık tarafından yapılan sınavda başarılı olmaları kaydıyla mesleğe kabul edilir. Bu madde kapsamında mesleğe kabul edilenlerin bu Kanunun 3 üncü maddesinin birinci fıkrasının (ç) bendinde belirtilen belgeyi sunmaları zorunludur. Aksi takdirde Türkçe turist rehberi olarak mesleklerini icra edebilirler. Yabancı dil yeterliliğini belgelemeleri hâlinde ise çalışma kartı alarak, yeniden başarılı oldukları dilde mesleklerini icra edebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
