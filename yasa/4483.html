  <mvz-künye tür="kanun" no="4483" başlık="MEMURLAR VE DİĞER KAMU GÖREVLİLERİNİN YARGILANMASI HAKKINDA KANUN"
             tarih="2/12/1999" rgazete-tarih="4/12/1999" rgazete-sayı="23896"
             düstur-tertip="5" düstur-cilt="39" />
    
  <mvz-madde no="1" başlık="Amaç">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, memurlar ve diğer kamu görevlilerinin görevleri sebebiyle işledikleri suçlardan dolayı yargılanabilmeleri için izin vermeye yetkili mercileri belirtmek ve izlenecek usulü düzenlemektir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanun, Devletin ve diğer kamu tüzel kişilerinin genel idare esaslarına göre yürüttükleri kamu hizmetlerinin gerektirdiği asli ve sürekli görevleri ifa eden memurlar ve diğer kamu görevlilerinin görevleri sebebiyle işledikleri suçlar hakkında uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Görevleri ve sıfatları sebebiyle özel soruşturma ve kovuşturma usullerine tabi olanlara ilişkin kanun hükümleri ile suçun niteliği yönünden kanunlarda gösterilen soruşturma ve kovuşturma usullerine ilişkin hükümler saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ağır cezayı gerektiren suçüstü hali genel hükümlere tabidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Disiplin hükümleri saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>765 sayılı Türk Ceza Kanununun 243 ve 245 inci maddeleri ile 1412 sayılı Ceza Muhakemeleri Usulü Kanununun 154 üncü maddesinin dördüncü fıkrası kapsamında açılacak soruşturma ve kovuşturmalarda bu Kanun hükümleri uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="İzin vermeye yetkili merciler">
    <mvz-fıkra no="1">
      <template>Soruşturma izni yetkisi</template>
      <mvz-bent no="a">
        <template>İlçede görevli memurlar ve diğer kamu görevlileri hakkında kaymakam,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>İlde ve merkez ilçede görevli memurlar ve diğer kamu görevlileri ile kaymakamlar hakkında vali,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Bölge düzeyinde teşkilatlanan kurum ve kuruluşlarda görev yapan memurlar ve diğer kamu görevlileri hakkında görev yaptıkları ilin valisi,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Cumhurbaşkanına veya Cumhurbaşkanlığına bağlı, ilgili veya ilişkili kuruluşlar ve bakanlıkların merkez ve bağlı veya ilgili kuruluşlarında görev yapan diğer memur ve kamu görevlileri hakkında o kuruluşun en üst idari amiri,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>(b) ve (c) bentlerindeki hükümler saklı kalmak kaydıyla Cumhurbaşkanı kararıyla atanan memurlar ve diğer kamu görevlileri hakkında Cumhurbaşkanı veya ilgili bakan,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Türkiye Büyük Millet Meclisinde görevli memurlar ve diğer kamu görevlileri hakkında Türkiye Büyük Millet Meclisi Genel Sekreteri, Türkiye Büyük Millet Meclisi Genel Sekreteri ve yardımcıları hakkında Türkiye Büyük Millet Meclisi Başkanı,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Cumhurbaşkanlığında görevli memurlar ve diğer kamu görevlileri hakkında Cumhurbaşkanlığı Genel Sekreteri, Cumhurbaşkanlığı Genel Sekreteri hakkında Cumhurbaşkanı,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Büyükşehir belediye başkanları, il ve ilçe belediye başkanları; büyükşehir, il ve ilçe belediye meclisi üyeleri ile il genel meclisi üyeleri hakkında İçişleri Bakanı,</template>
      </mvz-bent>
      <mvz-bent no="i">
        <template>İlçelerdeki belde belediye başkanları ve belde belediye meclisi üyeleri hakkında kaymakam, merkez ilçelerdeki belde belediye başkanları ve belde belediye meclisi üyeleri hakkında bulundukları ilin valisi,</template>
      </mvz-bent>
      <mvz-bent no="j">
        <template>Köy ve mahalle muhtarları ile bu Kanun kapsamına giren diğer memurlar ve kamu görevlileri hakkında ilçelerde kaymakam, merkez ilçede vali,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Yokluklarında ise vekilleri tarafından bizzat kullanılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yetkili mercilerin saptanmasında, memur veya kamu görevlisinin suç tarihindeki görevi esas alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ast memur ile üst memurun aynı fiile iştiraki halinde izin, üst memurun bağlı olduğu merciden istenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Olayın yetkili mercie iletilmesi, işleme konulmayacak ihbar ve şikayetler">
    <mvz-fıkra no="1">
      <template>Cumhuriyet başsavcıları, memurlar ve diğer kamu görevlilerinin bu Kanun kapsamına giren suçlarına ilişkin herhangi bir ihbar veya şikayet aldıklarında veya böyle bir durumu öğrendiklerinde ivedilikle toplanması gerekli ve kaybolma ihtimali bulunan delilleri tespitten başka hiçbir işlem yapmayarak ve hakkında ihbar veya şikayette bulunulan memur veya diğer kamu görevlisinin ifadesine başvurmaksızın evrakın bir örneğini ilgili makama göndererek soruşturma izni isterler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Diğer makam ve memurlarla kamu görevlileri de, bu Kanun kapsamına giren bir suç işlendiğini ihbar, şikayet, bilgi, belge veya bulgulara dayanarak öğrendiklerinde durumu izin vermeye yetkili mercie iletirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu Kanuna göre memurlar ve diğer kamu görevlileri hakkında yapılacak ihbar ve şikâyetlerin soyut ve genel nitelikte olmaması, ihbar veya şikâyetlerde kişi veya olay belirtilmesi, iddiaların ciddî bulgu ve belgelere dayanması, ihbar veya şikâyet dilekçesinde dilekçe sahibinin doğru ad, soyad ve imzası ile iş veya ikametgâh adresinin bulunması zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Üçüncü fıkradaki şartları taşımayan ihbar ve şikâyetler Cumhuriyet başsavcıları ve izin vermeye yetkili merciler tarafından işleme konulmaz ve durum, ihbar veya şikâyette bulunana bildirilir. Ancak iddiaların, sıhhati şüpheye mahal vermeyecek belgelerle ortaya konulmuş olması halinde ad, soyad ve imza ile iş veya ikametgâh adresinin doğruluğu şartı aranmaz. Başsavcılar ve yetkili merciler ihbarcı veya şikâyetçinin kimlik bilgilerini gizli tutmak zorundadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Ön inceleme">
    <mvz-fıkra no="1">
      <template>İzin vermeye yetkili merci, bu Kanun kapsamına giren bir suç işlediğini bizzat veya yukarıdaki maddede yazılı şekilde öğrendiğinde bir ön inceleme başlatır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Cumhuriyet başsavcılıkları ile izin vermeye yetkili merciler ihbar ve şikâyetler konusunda daha önce sonuçlandırılmış bir ön inceleme olması halinde müracaatı işleme koymazlar. Ancak ihbar veya şikâyet eden kişilerin konu ile ilgili olarak daha önceki ön incelemenin neticesini etkileyecek yeni belge sunması halinde müracaatı işleme koyabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ön inceleme, izin vermeye yetkili merci tarafından bizzat yapılabileceği gibi, görevlendireceği bir veya birkaç denetim elemanı veya hakkında inceleme yapılanın üstü konumundaki memur ve kamu görevlilerinden biri veya birkaçı eliyle de yaptırılabilir. İnceleme yapacakların, izin vermeye yetkili merciin bulunduğu kamu kurum veya kuruluşunun içerisinden belirlenmesi esastır. İşin özelliğine göre bu merci, anılan incelemenin başka bir kamu kurum veya kuruluşunun elemanlarıyla yaptırılmasını da ilgili kuruluştan isteyebilir. Bu isteğin yerine getirilmesi, ilgili kuruluşun takdirine bağlıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yargı mensupları ile yargı kuruluşlarında çalışanlar ve askerler, başka mercilerin ön incelemelerinde görevlendirilemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Ön inceleme ile görevlendirilen kişiler birden fazla ise içlerinden biri başkan olarak belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Ön inceleme yapanların yetkisi ve rapor">
    <mvz-fıkra no="1">
      <template>Ön inceleme ile görevlendirilen kişi veya kişiler, bakanlık müfettişleri ile kendilerini görevlendiren merciin bütün yetkilerini haiz olup, bu Kanunda hüküm bulunmayan hususlarda Ceza Muhakemeleri Usulü Kanununa göre işlem yapabilirler; hakkında inceleme yapılan memur veya diğer kamu görevlisinin ifadesini de almak suretiyle yetkileri dahilinde bulunan gerekli bilgi ve belgeleri toplayıp, görüşlerini içeren bir rapor düzenleyerek durumu izin vermeye yetkili mercie sunarlar. Ön inceleme birden çok kişi tarafından yapılmışsa, farklı görüşler raporda gerekçeleriyle ayrı ayrı belirtilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yetkili merci bu rapor üzerine soruşturma izni verilmesine veya verilmemesine karar verir. Bu kararlarda gerekçe gösterilmesi zorunludur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Süre">
    <mvz-fıkra no="1">
      <template>Yetkili merci, soruşturma izni konusundaki kararını suçun 5 inci maddenin birinci fıkrasına göre öğrenilmesinden itibaren ön inceleme dahil en geç otuz gün içinde verir. Bu süre, zorunlu hallerde onbeş günü geçmemek üzere bir defa uzatılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yetkili merci, herhalde yukarıdaki fıkrada belirtilen süreler içinde memur veya diğer kamu görevlisi hakkında soruşturma izni verilmesi veya verilmemesi konusunda karar vermek zorundadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Soruşturma izninin kapsamı">
    <mvz-fıkra no="1">
      <template>Soruşturma izni, şikayet, ihbar veya iddia konusu olaylar ile bunlara bağlı olarak ileride soruşturma sırasında ortaya çıkabilecek konuları kapsar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Soruşturma sırasında izin verilen olay ve konudan tamamen ayrı veya farklı bir suç olarak nitelendirilebilecek bir fiil ortaya çıktığında, yeniden izin alınması zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Suçun hukuki niteliğinin değişmesi, yeniden izin alınmasını gerektirmez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="İtiraz">
    <mvz-fıkra no="1">
      <template>Yetkili merci, soruşturma izni verilmesine veya verilmemesine ilişkin kararını Cumhuriyet başsavcılığına, hakkında inceleme yapılan memur veya diğer kamu görevlisine ve varsa şikayetçiye bildirir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Soruşturma izni verilmesine ilişkin karara karşı hakkında inceleme yapılan memur veya diğer kamu görevlisi; soruşturma izni verilmemesine ilişkin karara karşı ise Cumhuriyet başsavcılığı veya şikayetçi, izin vermeye yetkili merciler tarafından verilen işleme koymama kararına karşı da şikâyetçi itiraz yoluna gidebilir. İtiraz süresi, yetkili merciin kararının tebliğinden itibaren on gündür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İtiraza, 3 üncü maddenin (e), (f), (g) (Cumhurbaşkanınca verilen izin hariç) ve (h) bentlerinde sayılanlar için Danıştay İkinci Dairesi, diğerleri için yetkili merciin yargı çevresinde bulunduğu bölge idare mahkemesi bakar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>İtirazlar, öncelikle incelenir ve en geç üç ay içinde karara bağlanır. Verilen kararlar kesindir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="İştirak halinde işlenen suçlar">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamındaki suçların iştirak halinde işlenmesi durumunda memur olmayan, memur olanla; ast memur, üst memurla aynı mahkemede yargılanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="Soruşturma izninin gönderileceği merci">
    <mvz-fıkra no="1">
      <template>Soruşturma izninin itiraz edilmeden veya itirazın reddi sonunda kesinleşmesi ya da soruşturma izni verilmemesine ilişkin karara karşı yapılan itirazın kabulü üzerine dosya, derhal yetkili ve görevli Cumhuriyet başsavcılığına gönderilir. İzin üzerine ilgili Cumhuriyet başsavcılığı, Ceza Muhakemeleri Usulü Kanunu ve diğer kanunlardaki yetkilerini kullanmak suretiyle hazırlık soruşturmasını yürütür ve sonuçlandırır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="Hazırlık soruşturmasını yapacak merciler">
    <mvz-fıkra no="1">
      <template>Hazırlık soruşturması genel hükümlere göre yetkili ve görevli Cumhuriyet Başsavcılığı tarafından yapılır. Ancak Cumhurbaşkanlığı Genel Sekreteri, Türkiye Büyük Millet Meclisi Genel Sekreteri, Bakan yardımcıları ve valiler ile ilgili olarak yapılacak olan hazırlık soruşturması Yargıtay Cumhuriyet Başsavcısı veya Başsavcıvekili, kaymakamlar ile ilgili hazırlık soruşturması ise il Cumhuriyet başsavcısı veya başsavcıvekili tarafından yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hazırlık soruşturması sırasında hâkim kararı alınmasını gerektiren hususlarda; Cumhurbaşkanlığı Genel Sekreteri, Türkiye Büyük Millet Meclisi Genel Sekreteri, Bakan yardımcıları ve valiler için Yargıtayın ilgili ceza dairesine, kaymakamlar için il asliye ceza mahkemesine, diğerleri için ise genel hükümlere göre yetkili ve görevli sulh ceza hâkimine başvurulur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="Yetkili ve görevli mahkeme">
    <mvz-fıkra no="1">
      <template>Davaya bakmaya yetkili ve görevli mahkeme, genel hükümlere göre yetkili ve görevli mahkemedir. Ancak Cumhurbaşkanlığı Genel Sekreteri, Türkiye Büyük Millet Meclisi Genel Sekreteri, Bakan yardımcıları ve valiler için yetkili ve görevli mahkeme Yargıtayın ilgili ceza dairesi, kaymakamlar için ise il ağır ceza mahkemesidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="Vekillerin durumu">
    <mvz-fıkra no="1">
      <template>Bu Kanunun uygulanmasında vekiller, asillerin tabi olduğu usule tabidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="Cumhuriyet başsavcılığınca re'sen dava açılacak haller">
    <mvz-fıkra no="1">
      <template>Memurlar ve diğer kamu görevlileri hakkındaki ihbar ve şikayetlerin ihbar veya şikayet edileni mağdur etmek amacıyla ve  uydurma bir suç isnadı suretiyle yapıldığı hazırlık soruşturması sonucunda anlaşılır veya yargılama sonucunda sabit olursa haksız isnatta bulunanlar hakkında yetkili ve görevli Cumhuriyet başsavcılığınca re'sen soruşturmaya geçilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Memurlar ve diğer kamu görevlilerinin yukarıdaki fıkrada belirtilen durumlarda kamu davası açılması için Cumhuriyet başsavcılığına başvurma ve haksız isnatta bulunanlar hakkında genel hükümlere göre tazminat davası açma hakları saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="Memurin Muhakematı Hakkında Kanunu Muvakkata yapılan atıflar">
    <mvz-fıkra no="1">
      <template>Kanunlarda Memurin Muhakematı Hakkında Kanunu Muvakkatın uygulanacağı belirtilen hallerde bu Kanun hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kanunlarda Memurin Muhakematı Hakkında Kanunu Muvakkatın uygulanmayacağı belirtilen hallerde genel hükümler uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="Değiştirilen hükümler" durum="işlenmiş">
    <mvz-fıkra no="1">
      <template>(22.1.1990 tarihli ve 399 sayılı Kanun Hükmünde Kararnamenin 11 inci maddesi ile ilgili olup, yerine işlenmiştir.)</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="18" başlık="Yürürlükten kaldırılan hükümler">
    <mvz-fıkra no="1">
      <template>4 Şubat 1329 tarihli Memurin Muhakematı Hakkında Kanunu Muvakkat yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bu Kanuna ya da başka kanunlara göre ön inceleme, disiplin soruşturması veya diğer idari soruşturmaları yapmakla görevlendirilenler ile teftiş ya da denetim elemanlarının bu görevleriyle ilgili olarak yaptıkları işlemlerden, yürüttükleri faaliyetlerden, düzenledikleri raporlar ile görüş yazılarında belirttikleri kanaatlerinden veya kanunla verilen yetkilere dayanarak aldıkları tedbirlerden dolayı kişisel kusur, haksız fiil veya diğer sorumluluk hâlleri de dâhil olmak üzere ancak idare aleyhine tazminat davası açılabilir. Ancak bu görevlilerin suç sayılan eylemleri ile kin, garez ve hatıra dayalı olarak veya baskı veya telkinle kanaat oluşturduğu ya da değiştirdiği kesinleşmiş yargı ya da disiplin kurulu kararıyla tespit edilirse, idarenin görevliye rücu hakkı saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ön inceleme, disiplin soruşturması veya diğer idari soruşturmalar ile teftiş ya da denetim sonucunda düzenlenen raporlara dayanarak karar verenler veya işlem tesis edenlerle, bu kararları ya da işlemleri hazırlayan ve inha ya da teklif edenler hakkında da birinci fıkra hükmü uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girmesinden önce Memurin Muhakematı Hakkında Kanunu Muvakkat hükümlerine göre başlatılmış bulunan işlemler, adı geçen Kanun hükümlerine göre sonuçlandırılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girmesinden önce Memurlar ve Diğer Kamu Görevlilerinin Yargılanması Hakkında Kanuna göre Yargıtayın ilgili ceza dairesinde ve il ağır ceza mahkemesinde açılmış davalar ile Danıştayca itirazen incelenen kararlar, bu Kanunun yürürlüğe girmesini müteakip genel hükümlere göre yetkili ve görevli mahkemelere devredilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Ek 1 inci madde hükmü, bu maddenin yürürlüğe girdiği tarihte; görülmekte olan davalar, kesinleşmemiş hükümler ile miktar veya değeri itibarıyla temyiz veya karar düzeltme yoluna gidilemediği için kesinleşen hükümler bakımından da uygulanır ve davaya idare aleyhine devam olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu maddenin yürürlüğe girdiği tarihten önce verilen ve miktar veya değeri itibarıyla temyiz veya karar düzeltme yoluna başvurulamayan hükümler için, bu maddenin yürürlüğe girdiği tarihten itibaren iki hafta içinde kanun yollarına başvurulabilir. Bu fıkra uyarınca yapılan kanun yolu başvuruları üzerine verilen kararlar, tahsil edilmiş tazminat bedelinin geri istenmesi hakkını doğurmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Görevli mahkemede idare aleyhine devam olunacak davada, kanun yolları incelemesinde ilk olarak ek 1 inci maddede öngörülen dava şartlarının mevcut olup olmadığına bakılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu maddenin yürürlüğe girdiği tarihten önce başlamış işlemler, 2/7/2018 tarihli ve 703 sayılı Kanun Hükmünde Kararname ile değiştirilen 3 üncü, 12 nci ve 13 üncü maddelerin söz konusu değişikliklerden önceki usul ve esaslarına göre sonuçlandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu maddenin yürürlüğe girdiği tarihte müşterek kararla atanmış olanlar hakkında bu Kanun Hükmünde Kararname ile değiştirilen 3 üncü maddenin değiştirilmeden önceki hali uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="19" başlık="Yürürlük">
