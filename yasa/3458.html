  <mvz-künye tür="kanun" no="3458" başlık="MÜHENDİSLİK VE MİMARLIK HAKKINDA KANUN"
             tarih="17/6/1938" rgazete-tarih="28/6/1938" rgazete-sayı="3945"
             düstur-tertip="3" düstur-cilt="19" düstur-sayfa="527" />
    
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Türkiye Cumhuriyeti hududları dahilinde mühendislik ve mimarlık unvan ve salahiyeti ile sanat icra etmek isteyenlerin aşağıda yazılı vesikalardan birini haiz olmaları şarttır:</template>
      <mvz-bent no="a">
        <template>Mühendislik veya mimarlık tahsilini gösteren Türk yüksek mekteblerinden verilen diplomalar;</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Programlarının yüksek mühendis veya mimar mektebleri programlarına muadil olduğu kabul edilen bir ecnebi yüksek mühendis veya yüksek mimar mektebinden diploma almış olanlara usulüne tevfikan verilecek ruhsatnameler;</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Türk Teknik Okulu mühendis kısmı ile programlarının buna muadil olduğu kabul edilen memleket dahilindeki diğer mühendis veya mimar mekteblerinden verilen diplomalar;</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Programlarının Türk Teknik Okulu Mühendis kısmı programlarına muadil olduğu kabul olunan bir ecnebi mühendis veya mimar mektebinden diploma almış olanlara usulüne tevfikan verilecek ruhsatnameler.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Yukarıki maddenin (b) ve (d) fıkralarında yazılı ecnebi memleketlerden mezun olanlara ruhsatname verilebilmek için çıktıkları mektebin asli talebesi olarak tahsil dereceleri geçirmiş ve mektebin bütün tedrisatını muntazaman ve fiilen takib etmiş ve mektebde cari usullere göre geçirilmesi lazım gelen bütün imtihanları bitirmiş bulunmaları şarttır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>Birinci maddenin (a) ve (b) fıkralarında yazılı vesikaları haiz bulunanlara (Yüksek mühendis) veya (Yüksek mimar) ve (c) ve (d) fıkralarında yazılı vesikaları haiz bulunanlara da (Mühendis) veya (Mimar) unvanı verilir. Bu unvanlar diploma veya ruhsatnamelere de derç olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>Mühendislik veya mimarlık tahsilini gösteren Türk veya ecnebi yüksek mekteblerinde cari usullere göre doktora imtihanı vererek buna mahsus diplomayı almış olanlar doktor mühendis unvanını taşırlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="">
    <mvz-fıkra no="1">
      <template>Programları Türk yüksek mühendis veya yüksek mimar mektebi programlarından dun ve teknik okulu programlarından yüksek olan ve fakat bulunduğu memleketçe yüksek mekteblerden sayılan bir mühendis veya mimar mektebini 2 nci maddede yazılı şartlar dairesinde bitirmek suretile diploma almış olanlara (mühendis) veya (mimar) şehadetnamesi verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Geçen fıkrada yazılı mekteblerden mezun olanlar yüksek mühendis veya yüksek mimar ruhsatnamesi almak istedikleri takdirde yüksek mühendis veya yüksek mimar mektebinin alakalı ihtısas şubeleri ders programları mucibince okumadıkları derslerin imtihanlarını muvaffakiyetle geçirmiş olmaları şarttır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunda yazılı ruhsatnamenin verilmesi ve mekteb programları muadeletlerinin tetkikı ve bu işlerle uğraşacak heyetin teşkili usulleri ve ruhsatnamelerden alınacak harç miktarları alakalı vekaletlerin mütaleaları alınarak Nafıa Vekaletince hazırlanacak bir nizamname ile tesbit olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="">
    <mvz-fıkra no="1">
      <template>1 inci maddede belirtilen diploma veya ruhsatnamelerden birine haiz olmayanlar Türkiye’de mühendis veya mimar unvanı ile istihdam olunamazlar, imzalarla sanat icra edemezler, bu unvanları kullanarak rey veremezler ve imza da koyamazlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="">
    <mvz-fıkra no="1">
      <template>Yukarıdaki madde hükümlerine aykırı harekette bulunanlar, altı aydan iki yıla kadar hapis ve adlî para cezası ile cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci maddede yazılı diploma ve ruhsatnameyi haiz olmayanları bu vesikaları haiz olanlara mahsus unvan ve salahiyetle işlerinde kullanan kimselerle hükmi şahsiyetlerin mümessilleri de ayni suretle cezaya mahküm edilirler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="">
    <mvz-fıkra no="1">
      <template>Devlet daire ve müesseselerile belediye hizmetlerinde bulunan Yüksek mühendis, Yüksek mimar, mühendis, mimar ve fen memurları çalışma saatleri dışında bile olsa ücretli veya ücretsiz hususi surette sanatlarını icra edemezler. Ancak serbest meslek erbabı bulunmayan ve mahallin belediye veya Nafıa idarelerinin müracaatı ve en büyük mülkiye amirinin muvafakatile zaruret bulunduğu tahakkuk eden yerlerde tasdik ve murakabesi kendilerine veya mensub oldukları mahalli idarelere aid olmıyan memleketin umranile alakalı hususi mesleki işleri devamlı olmamak ve hariçte bir yazıhane açmamak ve asıl vazifelerinin çalışma saatleri dışında yapmak şartile birinci fıkrada yazılı memurlar iş kabul edebilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Profesörlük, öğretmenlik ve doçentlik birinci fıkrada yazılı memnuiyet hükmünden müstesnadır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="">
    <mvz-fıkra no="1">
      <template>1035 ve 3077 sayılı kanunlar ilga edilmiştir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>3077 sayılı Kanunun neşrinden evvel 1035 sayılı Kanuna göre mühendis veya mimar unvanile verilmiş olan diplomalarla ruhsatnameler, Yüksek mühendis veya yüksek mimarlık unvanile verilecek ruhsatnameler hükmünde olup bu kanunun neşrinden itibaren en çok altı ay içinde bu mühendis ve mimarlar diploma ve ruhsatnamelerini yeni unvanlarına göre değiştirmek mecburiyetindedirler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun neşri tarihinden muteberdir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerinin icrasına İcra Vekilleri Heyeti memurdur.</template>
    </mvz-fıkra>
  </mvz-madde>
