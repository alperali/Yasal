            <template>hâlinde, denetimli serbestlik müdürlüğünün talebi üzerine, koşullu salıverilme tarihine kadar olan cezasının infazı için açık ceza infaz kurumuna gönderilmesine, denetimli serbestlik müdürlüğünün bulunduğu yer infaz hâkimi tarafından karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Hükümlü hakkında denetimli serbestlik tedbiri uygulanmaya başlandıktan sonra işlediği iddia olunan ve cezasının alt sınırı bir yıl veya daha fazla hapis cezasını gerektiren kasıtlı bir suçtan dolayı kamu davası açılmış olması hâlinde, denetimli serbestlik müdürlüğünün talebi üzerine infaz hâkimi tarafından, hükümlünün açık ceza infaz kurumuna gönderilmesine karar verilebilir. Kovuşturma sonucunda beraat, ceza verilmesine yer olmadığı, davanın reddi veya düşme kararı verilmesi hâlinde, hükümlünün cezasının infazına denetimli serbestlik tedbiri uygulanarak devam olunmasına infaz hâkimi tarafından karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Denetimli serbestlik müdürlüğüne müracaat etmesi gereken sürenin bitiminden itibaren iki gün geçmiş olmasına karşın müracaat etmeyenler ile  ceza infaz kurumuna iade kararı verilmesine rağmen iki gün içinde en yakın Cumhuriyet başsavcılığına teslim olmayan hükümlüler hakkında, 5237 sayılı Türk Ceza Kanununun 292 nci ve 293 üncü maddelerinde yazılı hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Yükümlülüklerin gereklerine ve denetim planına uygun davranan hükümlünün koşullu salıverilmesi hakkında denetimli serbestlik müdürlüğü tarafından hazırlanan gerekçeli rapor, 107 nci ve 108 inci maddeler uyarınca işlem yapılmak üzere ilgili mahkemeye gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Denetimli serbestlik tedbiri uygulanarak cezaların infazına ilişkin esas ve usuller yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="106" başlık="Adlî para cezasının infazı">
          <mvz-fıkra no="1">
            <template>Adlî para cezası, Türk Ceza Kanununun 52 nci maddesinin birinci fıkrasında belirtilen usule göre tayin olunacak bir miktar paranın Devlet Hazinesine ödenmesinden ibarettir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Adlî para cezasını içeren ilâm Cumhuriyet Başsavcılığına verilir. Cumhuriyet savcısı otuz gün içinde adlî para cezasının ödenmesi için hükümlüye 20 nci maddenin üçüncü fıkrası uyarınca bir ödeme emri tebliğ eder.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hükümlü, tebliğ olunan ödeme emri üzerine belli süre içinde adli para cezasını ödemezse, Cumhuriyet savcısının kararı ile ödenmeyen kısma karşılık gelen gün miktarı hapis cezasına çevrilerek, hükümlünün iki saat çalışması karşılığı bir gün olmak üzere kamuya yararlı bir işte çalıştırılmasına karar verilir. Günlük çalışma süresi, en az iki saat ve en fazla sekiz saat olacak şekilde denetimli serbestlik müdürlüğünce belirlenir. Hükümlünün, hakkında hazırlanan programa ve denetimli serbestlik görevlilerinin bu kapsamdaki uyarı ve önerilerine uymaması hâlinde, çalıştığı günler hapis cezasından mahsup edilerek kalan kısmın tamamı açık ceza infaz kurumunda yerine getirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Çocuklar hakkında hükmedilen adlî para cezasının ödenmemesi hâlinde, bu ceza hapse çevrilemez. Bu takdirde onbirinci fıkra hükmü uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Adlî para cezasının hapse çevrileceği mahkeme ilâmında yazılı olmasa bile üçüncü fıkra hükmü Cumhuriyet Başsavcılığınca uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Hükümde, adlî para cezası takside bağlanmamış ise, bir aylık süre içinde adlî para cezasının üçte birini ödeyen hükümlünün isteği üzerine geri kalan kısmının birer ay ara ile iki eşit taksitte ödenmesine izin verilir. İlk taksidin süresinde ödenmemesi hâlinde, verilen ikinci takside ilişkin izin hükümsüz kalır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Adlî para cezası yerine çektirilen hapis süresi üç yılı geçemez. Birden fazla hükümle adlî para cezalarına mahkûmiyet hâlinde bu süre beş yılı geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Hükümlü, hapis yattığı veya kamuya yararlı işte çalıştığı günlerin dışındaki günlere karşılık gelen parayı öderse hapisten çıkartılır veya kamuya yararlı işte çalıştırılma sona erer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>16 ncı madde hükümleri saklı kalmak üzere, adlî para cezasından çevrilen hapsin infazı ertelenemez ve bunun infazında koşullu salıverilme hükümleri uygulanmaz. Hapse çevrilmiş olmasına rağmen hak yoksunlukları bakımından esas alınacak olan adlî para cezasıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>İnfaz edilen hapsin veya kamuya yararlı işte çalışmanın süresi, adlî para cezasını tamamıyla karşılamamış olursa, geri kalan adlî para cezasının tahsili için ilâm, Cumhuriyet Başsavcılığınca mahallin en büyük mal memuruna verilir. Bu makamlarca 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanuna göre kalan adlî para cezası tahsil edilir.</template>
          </mvz-fıkra>
        </mvz-madde>

      <mvz-bölüm no="2-İKİNCİ" başlık="Koşullu Salıverilme, Mükerrirlere Özgü İnfaz Rejimi ve Denetimli Serbestlik Tedbiri">
        <mvz-madde no="107" başlık="Koşullu salıverilme">
          <mvz-fıkra no="1">
            <template>Koşullu salıverilmeden yararlanabilmek için mahkûmun kurumdaki infaz süresini iyi hâlli olarak geçirmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ağırlaştırılmış müebbet hapis cezasına mahkûm edilmiş olanlar otuz yılını, müebbet hapis cezasına mahkûm edilmiş olanlar yirmidört yılını, diğer süreli hapis cezalarına mahkûm edilmiş olanlar cezalarının yarısını infaz kurumunda çektikleri takdirde, koşullu salıverilmeden yararlanabilirler.  Ancak, Türk Ceza Kanununun;</template>
            <mvz-bent no="a">
              <template>Kasten öldürme suçlarından (madde 81, 82 ve 83) süreli hapis cezasına mahkûm olanlar,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Neticesi sebebiyle ağırlaşmış yaralama suçundan (madde 87, fıkra iki, bent d) süreli hapis cezasına mahkûm olanlar,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İşkence suçundan (madde 94 ve 95) ve eziyet suçundan (madde 96) süreli hapis cezasına mahkûm olanlar,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Cinsel saldırı (madde 102, ikinci fıkra hariç), reşit olmayanla cinsel ilişki (madde 104, ikinci ve üçüncü fıkra hariç) ve cinsel taciz (madde 105) suçlarından süreli hapis cezasına mahkûm olanlar,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Cinsel dokunulmazlığa karşı işlenen suçlardan (madde 102, 103, 104 ve 105) hapis cezasına mahkûm olan çocuklar,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Özel hayata ve hayatın gizli alanına karşı suçlardan (madde 132, 133, 134, 135, 136, 137 ve 138) süreli hapis cezasına mahkûm olanlar,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Uyuşturucu veya uyarıcı madde imal ve ticareti suçundan (madde 188) hapis cezasına mahkûm olan çocuklar,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Devlet sırlarına karşı suçlar ve casusluk suçlarından (madde 326 ilâ 339) süreli hapis cezasına mahkûm olanlar,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>cezalarının üçte ikisini infaz kurumunda çektikleri takdirde, koşullu salıverilmeden yararlanabilirler. Ayrıca, suç işlemek için örgüt kurmak veya yönetmek ya da örgütün faaliyeti çerçevesinde işlenen suçlar ile Terörle Mücadele Kanunu kapsamına giren suçlardan mahkûm olan çocuklar ile 1/1/1983 tarihli ve 2937 sayılı Devlet İstihbarat Hizmetleri ve Milli İstihbarat Teşkilatı Kanunu kapsamına giren suçlardan mahkûm olanlar hakkında koşullu salıverilme oranı üçte iki olarak uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Koşullu salıverilme için infaz kurumunda geçirilmesi gereken süre;</template>
            <mvz-bent no="a">
              <template>Birden fazla ağırlaştırılmış müebbet hapis cezasına veya ağırlaştırılmış müebbet hapis cezası ile müebbet hapis cezasına mahkûmiyet hâlinde otuzaltı,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Birden fazla müebbet hapis cezasına mahkûmiyet hâlinde otuz,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bir ağırlaştırılmış müebbet hapis cezası ile süreli hapis cezasına mahkûmiyet hâlinde en fazla otuzaltı,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Bir müebbet hapis cezası ile süreli hapis cezasına mahkûmiyet hâlinde en fazla otuz,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Birden fazla süreli hapis cezasına mahkûmiyet hâlinde en fazla yirmisekiz,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Yıldır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Suç işlemek için örgüt kurmak veya yönetmek ya da örgütün faaliyeti çerçevesinde işlenen suçtan dolayı mahkûmiyet hâlinde; ağırlaştırılmış müebbet hapis cezasına mahkûm edilmiş olanlar otuzaltı yılını, müebbet hapis cezasına mahkûm edilmiş olanlar otuz yılını, süreli hapis cezasına mahkûm edilmiş olanlar cezalarının üçte ikisini infaz kurumunda çektikleri takdirde, koşullu salıverilmeden yararlanabilirler.  Koşullu salıverilme oranı üçte ikiden fazla olan suçlar bakımından ise tabi oldukları koşullu salıverilme oranı uygulanır. Ancak, bu süreler;</template>
            <mvz-bent no="a">
              <template>Birden fazla ağırlaştırılmış müebbet hapis cezasına veya ağırlaştırılmış müebbet hapis cezası ile müebbet hapis cezasına mahkûmiyet hâlinde kırk,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Birden fazla müebbet hapis cezasına mahkûmiyet hâlinde otuzdört,</template>

            <mvz-bent no="c">
              <template>Bir ağırlaştırılmış müebbet hapis cezası ile süreli hapis cezasına mahkûmiyet hâlinde en fazla kırk,</template>

            <mvz-bent no="d">

          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Koşullu salıverilme süresinin hesaplanmasında, hükümlünün onbeş yaşını dolduruncaya kadar infaz kurumunda geçirdiği bir gün, iki gün olarak dikkate alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Koşullu salıverilen hükümlünün tâbi tutulacağı denetim süresi, yukarıdaki fıkralara göre infaz kurumunda geçirilmesi gereken süre kadardır. Ancak süreli hapislerde hakederek tahliye tarihini geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Hükümlü, denetim süresinde, infaz kurumunda öğrendiği meslek veya sanatı icra etmek üzere, bir kamu kurumunda veya özel olarak aynı meslek veya sanatı icra eden bir başkasının gözetimi altında, ücret karşılığında çalıştırılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Onsekiz yaşından küçük olan hükümlüler, denetim süresinde eğitimlerine, gerektiğinde barınma imkânı da bulunan bir kurumda devam ederler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>İnfaz hâkimi, denetim süresinde hükümlüye rehberlik edecek bir uzman kişiyi görevlendirebilir. Bu kişi, kötü alışkanlıklar edinebileceği çevrelerden uzak kalması ve sorumluluk bilinciyle iyi bir hayat sürmesini temin hususunda hükümlüye öğütte bulunur; eğitim gördüğü kurum yetkilileri veya yanında çalıştığı kişilerle görüşerek, istişarelerde bulunur; hükümlünün davranışları, sosyal uyumu ve sorumluluk bilincindeki gelişme hakkında üçer aylık sürelerle rapor düzenleyerek infaz hâkimine verir.  İnfaz hâkimi ayrıca, iki yılı geçmemek üzere denetim süresi içinde hükümlünün denetimli serbestlik müdürlüğünce belirlenecek yükümlülüklere tabi tutulmasına karar verebilir. Bu karar gereğince denetimli serbestlik müdürlüğü, risk ve ihtiyaçlarını dikkate alarak hükümlüyü;</template>
            <mvz-bent no="a">
              <template>Belirli bir bölgede denetim ve gözetim altında bulundurma,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Belirlenen yer veya bölgelere gitmeme,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Belirlenen programlara katılma,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>yükümlülüklerinden bir veya birden fazlasına tabi tutar. Denetimli serbestlik müdürlüğü hükümlünün risk ve ihtiyaçlarını dikkate alarak yükümlülükleri değiştirebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>İnfaz hâkimi, koşullu salıverilen hükümlünün kişiliğini ve topluma uyumdaki başarısını göz önünde bulundurarak; denetim süresinin, denetimli serbestlik tedbiri uygulanmadan veya herhangi bir yükümlülük belirlemeden geçirilmesine karar verebileceği gibi, denetimli serbestlik tedbiri uygulanmasını veya belirlenen yükümlülükleri denetim süresi içinde kaldırabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>Hükümlünün koşullu salıverilmesi hakkında ceza infaz kurumu idaresi tarafından hazırlanan gerekçeli rapor, infaz işlemlerinin yapıldığı yer infaz hâkimliğine verilir. İnfaz hâkimi, bu raporu uygun bulursa hükümlünün koşullu salıverilmesine dosya üzerinden karar verir; raporu uygun bulmadığı takdirde gerekçesini kararında gösterir. Bu kararlara karşı itiraz yoluna gidilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="12">
            <template>Koşullu salıverilen hükümlünün, denetim süresinde hapis cezasını gerektiren kasıtlı bir suç işlemesi veya kendisine yüklenen yükümlülüklere, infaz hâkiminin uyarısına rağmen, uymamakta ısrar etmesi hâlinde koşullu salıverilme kararı geri alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="13">
            <template>Koşullu salıverilme kararının geri alınması hâlinde hükümlünün;</template>
            <mvz-bent no="a">
              <template>Sonraki suçu işlediği tarihten itibaren başlamak ve hak ederek tahliye tarihini geçmemek koşuluyla sonraki işlediği her bir suç için verilen hapis cezasının iki katı sürenin,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yükümlülüklerine aykırı davranması hâlinde, bu yükümlülüklere uymama tarihi ile hak ederek salıverilme tarihi arasındaki süreyi geçmemek koşuluyla ihlalin niteliğine göre takdir edilecek bir sürenin,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Ceza infaz kurumunda aynen çektirilmesine karar verilir. Koşullu salıverilme kararının geri alınmasından sonra aynı hükmün infazı ile ilgili bir daha koşullu salıverilme kararı verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="14">
            <template>Denetim süresi yükümlülüklere uygun ve iyi hâlli olarak geçirildiği takdirde, ceza infaz edilmiş sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="15">
            <template>Hükümlü, geri kalan süre içinde işlediği kasıtlı bir suçtan dolayı hapis cezasına mahkûm edilirse ya da bağlı tutulduğu yükümlülükleri yerine getirmezse hükmü veren ilk derece mahkemesinin bulunduğu yer infaz hâkimliği, cezaların toplandığı hâller ile hükmün bölge adliye mahkemesi veya Yargıtay tarafından verilmiş olması hâlinde ise 101 inci maddenin ikinci fıkrasına göre belirlenen infaz hâkimliği tarafından koşullu salıverilme kararının geri alınmasına dosya üzerinden karar verilir. Bu kararlara karşı itiraz yolu açıktır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="16">
            <template>5237 sayılı Türk Ceza Kanununun İkinci Kitap, Dördüncü Kısım, "Devletin Güvenliğine Karşı Suçlar" başlıklı Dördüncü Bölüm, "Anayasal Düzene ve Bu Düzenin İşleyişine Karşı Suçlar" başlıklı Beşinci Bölüm, "Milli Savunmaya Karşı Suçlar" başlıklı Altıncı Bölüm altında yer alan suçlardan birinin bir örgütün faaliyeti çerçevesinde işlenmesi dolayısıyla ağırlaştırılmış müebbet hapis cezasına mahkûmiyet hâlinde, koşullu salıverilme hükümleri uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="108" başlık="Mükerrirlere ve bazı suç faillerine özgü infaz rejimi ve denetimli serbestlik tedbiri">
          <mvz-fıkra no="1">
            <template>Tekerrür hâlinde işlenen suçtan dolayı mahkûm olunan;</template>
            <mvz-bent no="a">
              <template>Ağırlaştırılmış müebbet hapis cezasının otuzdokuz yılının,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Müebbet hapis cezasının otuzüç yılının,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Birden fazla süreli hapis cezasına mahkûmiyet hâlinde en fazla otuziki yılının,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Süreli hapis cezasının üçte ikisinin,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İnfaz kurumunda iyi hâlli olarak çekilmesi durumunda, koşullu salıverilmeden yararlanılabilir.  Ancak, koşullu salıverilme oranı üçte ikiden fazla olan suçlar bakımından tabi oldukları koşullu salıverilme oranı uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tekerrür nedeniyle koşullu salıverme süresine eklenecek miktar, tekerrüre esas alınan cezanın en ağırından fazla olamaz.  İkinci defa tekerrür halinde bu fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İkinci defa tekerrür hükümlerinin uygulanması durumunda birinci fıkradaki koşullu salıverilme süreleri uygulanır.  Ancak, süreli hapis cezaları bakımından koşullu salıverilme oranı dörtte üç olarak uygulanır.  Hükümlü hakkında ikinci defa tekerrür hükümlerinin uygulanacağı hükümde belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İnfaz hâkimi, mükerrir hakkında cezanın infazının tamamlanmasından sonra başlamak ve bir yıldan az olmamak üzere denetim süresi belirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Tekerrür dolayısıyla belirlenen denetim süresinde, koşullu salıverilmeye ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İnfaz hâkimi, mükerrir hakkında denetim süresinin uzatılmasına karar verebilir. Denetim süresi en fazla beş yıla kadar uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Cezanın infazı tamamlandıktan sonra devam eden denetim süresi içinde, bu madde hükümlerine göre kendilerine yüklenen yükümlülüklere ve yasaklara aykırı hareket eden mükerrirler, infaz hâkimi kararı ile disiplin hapsine tabi tutulur. Disiplin hapsinin süresi on beş günden az ve üç aydan fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Çocuğa karşı işlenen bir suçtan dolayı ağırlaştırılmış müebbet hapis cezasına veya müebbet hapis cezasına mahkûmiyet hâlinde birinci fıkradaki koşullu salıverilme süreleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Birinci fıkradaki koşullu salıverme süreleri, 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 102 nci maddesinin ikinci fıkrasında tanımlanan cinsel saldırı suçundan, 103 üncü maddesinde tanımlanan çocukların cinsel istismarı suçundan, 104 üncü maddesinin ikinci ve üçüncü fıkrasında tanımlanan reşit olmayanla cinsel ilişki suçundan, 188 inci maddesinde tanımlanan uyuşturucu veya uyarıcı madde imal ve ticareti suçundan dolayı hapis cezasına mahkûm olanlar hakkında da uygulanır.  Ancak, süreli hapis cezaları bakımından koşullu salıverilme oranı, dörtte üç olarak uygulanır. 188 inci madde hariç olmak üzere bu suçlardan dolayı hapis cezasına mahkûm olanlar hakkında, cezanın infazı sırasında ve koşullu salıverildikleri takdirde denetim süresi içinde, aşağıdaki tedavi veya yükümlülüklerden bir veya birkaçına infaz hâkimi tarafından karar verilir:</template>
            <mvz-bent no="a">
              <template>Tıbbi tedaviye tabi tutulmak</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Tedavi amaçlı programlara katılmak</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Suçun mağdurunun oturduğu ve çalıştığı yerleşim bölgesinde ikamet etmekten yasaklanmak</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Mağdurun bulunduğu yerlere yaklaşmaktan yasaklanmak</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Çocuklarla bir arada olmayı gerektiren bir ortamda çalışmaktan yasaklanmak</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Çocuklar hakkında bakım ve gözetim yükümlülüğünü gerektiren faaliyet icra etmekten yasaklanmak</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Dokuzuncu fıkra hükümleri çocuklar hakkında uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>Bu maddenin dokuzuncu fıkrasının uygulanmasına ilişkin usul ve esaslar, Sağlık Bakanlığının görüşü alınmak suretiyle Adalet Bakanlığı tarafından hazırlanan yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Tedbirler ve Tutukluluk">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Kısa Süreli Hapis Cezasına Seçenek Yaptırımlar ile Kısa Süreli Hapis Cezalarının Özel İnfaz Şekilleri">
        <mvz-madde no="109" başlık="Seçenekli yaptırımların uygulanması">
          <mvz-fıkra no="1">
            <template>Kısa süreli hapis cezası yerine Türk Ceza Kanununun 50 nci maddesine göre hükmedilen seçenekli yaptırımların infazında uygulanacak rejim, Cumhurbaşkanınca çıkarılan yönetmelikte gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="110" başlık="Özel infaz usulleri">
          <mvz-fıkra no="1">
            <template>İnfaz hâkimi, hükümlünün talebi üzerine kasten işlenen suçlarda toplam üç yıl, taksirle öldürme suçu hariç olmak üzere taksirle işlenen suçlarda ise toplam beş yıl veya daha az süreli hapis cezasının;</template>
            <mvz-bent no="a">
              <template>Her hafta cuma günleri saat 19.00’da girmek ve pazar günleri aynı saatte çıkmak suretiyle hafta sonları,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hafta sonları hariç, her gün saat 19.00’da girmek ve ertesi gün saat 07.00’de çıkmak suretiyle geceleri,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Ceza infaz kurumlarında çektirilmesine karar verebilir.  (a) bendinde belirtilen infaz usulü, hükümlünün iş yaşamı ve ailevi durumu ile ceza infaz kurumlarının düzen ve işleyişine göre ceza infaz kurumu tarafından, süresi aynı olmak koşuluyla hafta içi günlerde de uygulanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkûmiyete konu suç nedeniyle doğmuş zararın aynen iade, suçtan önceki hâle getirme veya tazmin suretiyle tamamen giderilmesine dair hukukî sorumlulukları saklı kalmak üzere;</template>
            <mvz-bent no="a">
              <template>Kadın, çocuk veya altmışbeş yaşını bitirmiş kişilerin mahkûm oldukları toplam üç yıl,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yetmiş yaşını bitirmiş kişilerin mahkûm oldukları toplam dört yıl,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Yetmişbeş yaşını bitirmiş kişilerin mahkûm oldukları toplam beş yıl,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Seksen yaşını bitirmiş kişilerin mahkûm oldukları toplam altı yıl,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>veya daha az süreli hapis cezasının konutunda çektirilmesine infaz hâkimi tarafından karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ağırlaştırılmış müebbet hapis cezasına mahkûm olanlar hariç olmak üzere hapis cezasına mahkûm olan veya adli para cezası infaz sürecinde hapis cezasına çevrilen hükümlülerden 16 ncı maddenin üçüncü fıkrasında belirlenen usule göre maruz kaldığı ağır bir hastalık veya engellilik nedeniyle ceza infaz kurumu koşullarında hayatını yalnız idame ettiremeyeceği tespit edilen ve toplum güvenliği bakımından ağır ve somut tehlike oluşturmayacağı değerlendirilenlerin cezasının konutunda çektirilmesine infaz hâkimi tarafından karar verilebilir. Mahkûmun durumu, Cumhuriyet başsavcılığınca birer yıllık dönemlere göre 16 ncı maddenin üçüncü fıkrasında belirlenen usule göre incelettirilir. İnceleme sonuçlarına göre hükümlünün iyileştiğinin tespit edilmesi halinde infaz hâkimi, cezanın konutta çektirilmesine dair kararı kaldırır. Mahkûm, denetimli serbestlik müdürlüğü ve bulunduğu yer kolluk makamlarınca izlenir. Toplam cezası on yıldan fazla olan hükümlülerin elektronik cihazların kullanılması suretiyle takibi zorunludur. Bu fıkrada yazılı yükümlülüklere aykırı hareket edilmesi hâlinde cezanın konutunda çektirilmesine dair karar infaz hâkimliğince kaldırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Doğurduğu tarihten itibaren altı ay geçen ve toplam beş yıl veya daha az süreli hapis cezasına mahkûm olan ya da adli para cezası infaz sürecinde hapis cezasına çevrilen hükümlü kadınların cezasının konutunda çektirilmesine infaz hâkimi tarafından karar verilebilir. Bu fıkra uyarınca talepte bulunulabilmesi için kadının doğurduğu tarihten itibaren bir yıl altı ay geçmemiş olması gerekir. Konutta infaza karar verdikten sonra çocuk ölmüş veya anasından başka birine verilmiş olursa infaz hâkimi konutta infaz uygulamasına ilişkin kararını kaldırır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Cezanın özel infaz usulüne göre çektirilmesine karar verilenler hakkında tabi oldukları infaz rejimine göre koşullu salıverilme ve denetimli serbestlik tedbiri uygulanarak cezanın infazı hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Cezanın özel infaz usulüne göre çektirilmesi kararı, infaza başlandıktan sonra da verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>İnfaz hâkimi talep üzerine, cezanın özel infaz usulüne göre çektirilmesi sırasında bu usulün uygulanmasına son verebilir. Özel infaz usulünün gereklerine geçerli bir mazeret olmaksızın uyulmaması hâlinde ise bu usulün uygulanmasına son verilir ve bu hâlde infaza genel hükümlere göre ceza infaz kurumlarında devam edilir. Özel infaz usulüne göre geçirilen süre, infaz aşamasında mahsup edilir. Bu fıkranın uygulandığı hâllerde 105/A maddesi hükümleri uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Bu madde hükümlerine göre verilen kararlara itiraz yolu açıktır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Üçüncü ve dördüncü fıkra hariç, bu madde hükümleri;</template>
            <mvz-bent no="a">
              <template>Terör suçları ile örgüt kurmak, yönetmek veya örgüte üye olmak suçlarından ya da örgüt faaliyeti kapsamında işlenen suçlardan mahkûm olanlar,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Cinsel dokunulmazlığa karşı işlenen suçlardan mahkûm olanlar,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Adlî para cezası infaz sürecinde hapis cezasına çevrilenler,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Koşullu salıverilme kararının geri alınması nedeniyle cezası aynen infaz edilenler,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>105/A maddesinin altıncı ve yedinci fıkraları uyarınca açık ceza infaz kurumuna gönderilenler,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>hakkında uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Tutuklama Kararının Yerine Getirilmesi">
        <mvz-madde no="111" başlık="Tutuklama kararının yerine getirildiği kurumlar">
          <mvz-fıkra no="1">
            <template>Tutuklular, iç ve dış güvenlik görevlisi bulunan, firara karşı teknik, mekanik, elektronik veya fizikî engelleri olan, 34 üncü maddede sayılan hâller dışında oda ve koridor kapıları sürekli olarak kapalı tutulan ve yasal zorunluluklar ayrık, dışarıyla irtibat ve haberleşme olanağı bulunmayan normal güvenlik esasına dayalı tutukevlerinde veya maddî olanak bulunmadığı hâllerde diğer kapalı ceza infaz kurumlarının bu amaca ayrılmış bölümlerinde tutulurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Eylem ve davranışları ile 9 uncu madde kapsamına giren tutuklular, yüksek güvenlikli tutukevlerinde veya buna olanak bulunmadığı hâllerde yüksek güvenlikli kapalı ceza infaz kurumlarının tutuklulara ayrılan bölümlerinde barındırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kadın, çocuk ve gençlik tutukevleri müstakil olarak kurulabilir. Tutuklular, tutukevlerinde veya maddî olanak bulunmadığı hâllerde kapalı ceza infaz kurumlarının tutuklulara ayrılan bölümlerinde, büyükler, kadınlar, gençler, çocuklar olmak üzere ve suç türleri de gözetilerek ayrı yerlerde barındırılırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="112" başlık="Tutukevine kabul">
          <mvz-fıkra no="1">
            <template>Sanığın tutukevine kabul edilebilmesi için hâkim veya mahkeme tarafından verilmiş bir tutuklama kararının bulunması zorunludur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tutuklunun tutukevine konulduğu, kararı veren hâkim veya mahkemeye gün ve saati belirtilerek bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="113" başlık="Tutukluların barındırılması">
          <mvz-fıkra no="1">
            <template>Tutuklular, maddî olanaklar elverdiğince suç türlerine ve taşıdıkları güvenlik riskine göre ayrı odalarda barındırılırlar. Aralarında husumet bulunanlar ile iştirak hâlinde suç işlemiş olanlar aynı odalarda barındırılmazlar ve birbirleri ile temas etmelerini engelleyecek tedbirler alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Tutukluların Hakları ve Kısıtlayıcı Önlemler">
        <mvz-madde no="114" başlık="Tutukluların hakları">
          <mvz-fıkra no="1">
            <template>Tutuklulardan çalışmaları istenebilir; ancak, buna mecbur tutulamazlar. Tutuklular istediklerinde idare, barındırıldıkları odalarda çalışmalarına izin verebilir. Odada çalışma imkânı yoksa, tutukluların iş yerlerinde çalışmalarına da izin verilebilir. Bu takdirde kendileri hakkında çalışmakta olan hükümlülere ait rejim uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturma ve kovuşturma evrelerinde tutuklular, kurumun bu husustaki genel düzenine uymak suretiyle ziyaretçi kabul edebilirler. Ancak soruşturma evresinde Cumhuriyet savcısı, kovuşturma evresinde hâkim veya mahkeme, soruşturmanın veya davanın selameti bakımından tutuklunun ziyaretçi kabulünü yasaklayabilir veya bu hususta kısıtlamalar koyabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tutukluların yazılı haberleşmeleri ile telefonla görüşmeleri, soruşturma evresinde Cumhuriyet savcısı, kovuşturma evresinde hâkim veya mahkemesince kısıtlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Tutuklu, savunması için istediği müdafii seçmek ve görevlendirmek hakkına sahiptir. Her dereceden kurum görevlileri bu hususta tutukluya tavsiyelerde bulunamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Tutuklunun müdafii ile olan haberleşmesine ve kurum düzeni çerçevesinde temas ve görüşmelerine hiçbir suretle engel olunamaz ve kısıtlamalar konulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Özel kanunda yer alan hükümler saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="115" başlık="Kısıtlayıcı önlemler">
          <mvz-fıkra no="1">
            <template>Tehlikeli hâlde bulunan, delil karartma tehlikesi olan, soruşturmanın amacını veya tutukevinin güvenliğini tehlikeye düşüren veya suçun tekrarına olanak verecek davranışlarda bulunan tutuklulara soruşturma evresinde Cumhuriyet savcısı, kovuşturma evresinde hâkim veya mahkemesince aşağıdaki tedbirler uygulanabilir:</template>
            <mvz-bent no="a">
              <template>Tutuklunun tek başına, sıkı bir rejim altında muhafaza edilmesi ve kaldığı odanın kamera ile izlenmesi.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Belirli süre ile dışarıyla ilişkisinin, ziyaretçi kabulünün ve telefon görüşmelerinin kısıtlanması.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Gerekiyorsa kendisine veya başkalarına zarar vermesini önleyici biçimde hazırlanmış özel bir odada barındırılması ve kaldığı odanın kamera ile izlenmesi.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Saldırganlık göstermesi hâlinde belirli süreyle kelepçelenmesi veya hareketlerinin engellenmesi.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Yüksek güvenlikli bir kuruma nakledilmesi.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="116" başlık="Tutukluların yükümlülükleri">
          <mvz-fıkra no="1">
            <template>Bu Kanunun; yüksek güvenlikli kapalı ceza infaz kurumları, hapis cezasının infazının hastalık nedeni ile ertelenmesi, kuruma alınma ve kayıt işlemleri, hükümlüler ile yakınları ve ilgililerin bilgilendirilmesi, cezayı çekme, güvenlik ve iyileştirme programına ve sağlığın korunması kurallarına uyma, bina ve eşyaların korunması, kapıların açılmaması ve temasın önlenmesi, oda ve eklentilerinde bulundurulabilecek kişisel eşyalar, arama, disiplin cezalarının niteliği ve uygulanma koşulları, kınama, bazı etkinliklere katılmaktan alıkoyma, ücret karşılığı çalışılan işten yoksun bırakma, haberleşme veya iletişim araçlarından yoksun bırakma veya kısıtlama, ziyaretçi kabulünden yoksun bırakma, hücreye koyma, çocuk hükümlüler hakkında uygulanabilecek disiplin tedbirleri ve cezaları, disiplin soruşturması, disiplin cezasını gerektiren eylemlerin tekrarı, disiplin cezalarının infazı ve kaldırılması, yönetim tarafından alınabilecek tedbirler, zorlayıcı araçların kullanılması, ödüllendirme, şikâyet ve itiraz, nakiller, disiplin nedeniyle nakil, zorunlu nedenlerle nakil, hastalık nedeniyle nakil, nakillerde alınacak tedbirler, avukat ve noterle görüşme hakkı, kültür ve sanat etkinliklerine katılma, ifade özgürlüğü, kütüphaneden yararlanma, süreli veya süresiz yayınlardan yararlanma hakkı, telefonla haberleşme hakkı, radyo, televizyon yayınları ile internet olanaklarından yararlanma hakkı, mektup, faks ve telgrafları alma ve gönderme hakkı, bu Kanunda sayılan günlerde dışarıdan gönderilen hediyeyi kabul etme hakkı, din ve vicdan özgürlüğü, muayene ve tedavi istekleri, hükümlülerin beslenmesi, iyileştirme programlarının belirlenmesi, hükümlülerin sayısı ve uygulanacak güvenlik tedbirleri, eğitim programları, öğretimden yararlanma, muayene ve tedavileri, sağlık denetimi, hastaneye sevk, infazı engelleyecek hastalık hâli, kendilerine verilen yiyecek ve içecekleri reddetmeleri, ziyaret, yabancı hükümlüleri ziyaret, ziyaret ve görüşlerde uygulanacak esaslar, beden eğitimi, kütüphane ve kurslardan yararlanma konularında 9, 16, 21, 22, 26 ilâ 28, 34 ilâ 53, 55 ilâ 62, 65 ilâ 76 ve 78 ila 88 inci maddelerinde düzenlenmiş hükümlerin tutukluluk hâliyle uzlaşır nitelikte olanları tutuklular hakkında da uygulanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İkinci derece dâhil kan veya kayın hısımlarından birinin ya da eşinin ölümü hâlinde, tutukluya, ceza infaz kurumu en üst amirinin önerisi ve Cumhuriyet başsavcılığının onayı ile soruşturmanın veya kovuşturmanın selameti ve güvenlik bakımından sakınca oluşturmaması koşuluyla, dış güvenlik görevlisinin refakatinde yol süresi dışında iki güne kadar cenazeye katılması için izin verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ana, baba, eş, kardeş, çocuk ile eşin anne veya babasından birinin yaşamsal tehlike oluşturacak önemli ve ağır hastalık hâllerinin bulunduğunun sağlık kurulu raporu ile belgelendirilmesi durumunda tutukluya, soruşturmanın veya kovuşturmanın selameti ve güvenlik bakımından sakınca oluşturmaması koşuluyla, ceza infaz kurumu en üst amirinin önerisi ve Cumhuriyet başsavcılığının onayı ile dış güvenlik görevlisinin refakatinde yol süresi dışında, bunlardan her biri için  toplam iki defaya mahsus olmak üzere hasta ziyareti amacıyla bir güne kadar izin verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İkinci ve üçüncü fıkraya göre izin verilen tutuklunun, izin süresi içinde gece konaklaması gerektiği takdirde, kendi evi veya ikinci fıkrada belirtilen bir yakınının evinde, güvenli görülen başka bir yerde ya da gidilen yerde bulunan kapalı ceza infaz kurumunda kalmasına, güvenlik hususu değerlendirilmek ve gerekli güvenlik tedbirleri alınmak suretiyle, gidilen yerin valisi tarafından karar verilir. Yurt dışına çıkmasını gerektirmesi durumunda tutukluya, bu madde gereğince izin verilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Dördüncü fıkra ile 94 üncü maddenin ikinci fıkrasının uygulamasına ilişkin usul ve esaslar Adalet ve İçişleri bakanlıklarınca müştereken hazırlanacak yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Son Hükümler">
        <mvz-madde no="117" başlık="Hapis cezalarının ve tedbirlerin infazında göz önünde bulundurulacak ve uygulanacak diğer kanunlardaki hükümler">
          <mvz-fıkra no="1">
            <template>Cezanın kesinleşmesinden sonra asker edilen kişiler hakkındaki hapis cezasının infazı ve geri bırakılması hususunda da 21.6.1927 tarihli ve 1111 sayılı Askerlik Kanununun 39 uncu maddesi göz önünde bulundurulur ve uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="118" başlık="Asker edilen kişilerin cezalarının infazı">
          <mvz-fıkra no="1">
            <template>Sırf askerî suçlar ile askerî disiplin suçları ayrık olmak üzere, askere alınmadan önce ve askerlikleri sırasında işledikleri suçlardan dolayı er ve erbaşlar ile yedek astsubay ve yedek subaylar hakkında kısa süreli hapis cezaları yerine hükmedilen Türk Ceza Kanununun 50 nci maddesinin birinci fıkrasının (c), (e) ve (f) bentlerinde yazılı tedbirler ile bu Kanunun 106 ncı maddesinde yazılı adlî para cezasının yerine getirilmesi askerlik hizmetlerinin sonuna bırakılır. Bu süreler içinde zamanaşımı işlemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="119" başlık="Bu Kanunda geçen terimlerin etkisi">
          <mvz-fıkra no="1">
            <template>Bu Kanunda kullanılan terimler, mevzuatta bunun karşılığı olarak kullanılmış olan terimlerin yerini alır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="120" başlık="Diğer kanunlarda yapılan yollamalar">
          <mvz-fıkra no="1">
            <template>Diğer kanunlarda 13.7.1965 tarihli ve 647 sayılı Cezaların İnfazı Hakkında Kanunun hapis cezaları ile tedbirlerin infazına ilişkin hükümlerine yapılan yollamalar bu Kanunda düzenlenen ilgili hükümlere yapılmış sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="121" başlık="Yönetmelikler">
          <mvz-fıkra no="1">
            <template>Bu Kanun gereğince çıkarılması gereken yönetmelikler, Cumhurbaşkanı veya ilgili bakanlıklar tarafından çıkarılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="122" başlık="Yürürlükten kaldırılan hükümler">
          <mvz-fıkra no="1">
            <template>13.7.1965 tarihli ve 647 sayılı Cezaların İnfazı Hakkında Kanun ile 14.6.1930 tarihli ve 1721 sayılı Hapishane ve Tevkifhanelerin İdaresi Hakkında Kanunun 3, 4 ve 6 ncı maddeleri yürürlükten kaldırılmıştır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="1" başlık="" tür="Ek" durum="iptal">
        </mvz-madde>
        <mvz-madde no="1" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>26.9.2004 tarihli ve 5237 sayılı Türk Ceza Kanunu dışındaki diğer kanunlarda yer alan adlî para cezasının ödenmemesi hâlinde, hükümlüler bir gün beşyüz Türk Lirası hesabı ile hapsedilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="2" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>14.7.2004 tarihli ve 5218 sayılı Kanunun 1 inci maddesi ile değişik 3.8.2002 tarihli ve 4771 sayılı Çeşitli Kanunlarda Değişiklik Yapılmasına İlişkin Kanunla; ölüm cezaları, müebbet ağır hapis cezasına dönüştürülen terör suçluları ile ölüm cezaları ağırlaştırılmış müebbet ağır hapis cezasına dönüştürülen veya ağırlaştırılmış müebbet ağır hapis cezasına mahkûm olan terör suçluları, koşullu salıverilme hükümlerinden yararlanamaz. Bunlar hakkında, ağırlaştırılmış müebbet ağır hapis cezası, hayatı boyunca devam eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="3" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>Bu maddenin yürürlüğe girdiği tarih itibarıyla koşullu salıverilmelerine bir yıldan az süre kalan;</template>
            <mvz-bent no="a">
              <template>Açık ceza infaz kurumunda bulunan,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kapalı ceza infaz kurumunda bulunup da açık ceza infaz kurumuna ayrılma şartlarını taşıyan,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>iyi hâlli hükümlülerin talepleri hâlinde, cezalarının koşullu salıverilme tarihine kadar olan kısmının denetimli serbestlik tedbiri uygulanmak suretiyle infazına karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Koşullu salıverilmelerine bir yıl kala açık ceza infaz kurumuna ayrılma hakkını kazanan hükümlüler, bu infaz usulünden en fazla altı ay süreyle yararlanırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddenin yürürlüğe girdiği tarih itibarıyla 105 inci maddenin dördüncü fıkrası hükmüne göre mahkûmiyet sürelerinin geriye kalan yarısı kamuya yararlı bir işte çalışmak suretiyle infaz edilmekte olan hükümlüler hakkında aşağıdaki şekilde işlem yapılır:</template>
            <mvz-bent no="a">
              <template>Koşullu salıverilme süresini tamamlamayanların cezalarının infazına 105/A maddesi hükümleri uyarınca devam olunur.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Koşullu salıverilme süresini tamamlayanların infaz dosyası 107 nci ve 108 inci maddeler uyarınca işlem yapılmak üzere ilgili mahkemeye gönderilir.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="4" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>Bu Kanunun 105/A maddesinin birinci fıkrasının (a) bendinde ve ikinci fıkrasında belirtilen altı aylık süre şartı ile birinci fıkrasının (b) bendinde belirtilen cezanın belirli bir süre infaz edilmesine ilişkin şart 31/12/2020 tarihine kadar uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="5" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>7 Kasım 1982 tarihinden önce işlemiş olduğu bir suç dolayısıyla hürriyeti bağlayıcı cezaya mahkûm olan kişi hakkında, mahkûm olduğu cezanın infazı sürecinde koşullu salıverildikten sonra deneme süresi içinde işlediği yeni bir suç sebebiyle koşullu salıverilme kararı geri alınmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="6" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>30/3/2020 tarihine kadar işlenen suçlar bakımından; 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun kasten öldürme suçları (madde 81, 82 ve 83), üstsoya, altsoya, eşe veya kardeşe ya da beden veya ruh bakımından kendisini savunamayacak durumda bulunan kişiye karşı işlenen kasten yaralama ve neticesi sebebiyle ağırlaşmış yaralama suçları, neticesi sebebiyle ağırlaşmış yaralama suçu (madde 87, fıkra iki, bent d), işkence suçu (madde 94 ve 95), eziyet suçu (madde 96), cinsel dokunulmazlığa karşı işlenen suçlar (madde 102, 103, 104 ve 105), özel hayata ve hayatın gizli alanına karşı suçlar (madde 132, 133, 134, 135, 136, 137 ve 138), uyuşturucu veya uyarıcı madde imal ve ticareti suçu (madde 188) ve İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde tanımlanan suçlar ile 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu kapsamına giren suçlar hariç olmak üzere, 105/A maddesinin birinci fıkrasında yer alan “bir yıl”lık süre, “üç yıl” olarak uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>30/3/2020 tarihine kadar işlenen suçlar bakımından, Türk Ceza Kanununun kasten öldürme suçları (madde 81, 82 ve 83), cinsel dokunulmazlığa karşı işlenen suçlar (madde 102, 103, 104 ve 105), özel hayata ve hayatın gizli alanına karşı suçlar (madde 132, 133, 134, 135, 136, 137 ve 138) ve İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde tanımlanan suçlar ile Terörle Mücadele Kanunu kapsamına giren suçlar hariç olmak üzere;</template>
            <mvz-bent no="a">
              <template>Sıfır-altı yaş grubu çocuğu bulunan kadın hükümlüler ile yetmiş yaşını bitirmiş hükümlüler hakkında 105/A maddesinin üçüncü fıkrasında yer alan “iki yıl”lık süre, “dört yıl” olarak uygulanır.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Maruz kaldığı ağır bir hastalık, engellilik veya kocama nedeniyle hayatını yalnız idame ettiremeyen altmışbeş yaşını bitirmiş hükümlülerin koşullu salıverilmeleri için ceza infaz kurumlarında geçirmeleri gereken süreler, azami süre sınırına bakılmaksızın 105/A maddesinde düzenlenen denetimli serbestlik tedbiri uygulanmak suretiyle infaz edilebilir. Ağır hastalık, engellilik veya kocama hâli, Adalet Bakanlığınca belirlenen tam teşekküllü hastanelerin sağlık kurullarınca veya Adlî Tıp Kurumunca düzenlenen bir raporla belgelendirilir.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci ve ikinci fıkra hükümleri, iyi hâlli olmak koşuluyla kapalı ceza infaz kurumlarında bulunan hükümlüler hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>30/3/2020 tarihine kadar işlenen suçlar bakımından, tabi olduğu infaz rejimine göre belirlenen koşullu salıverilme süresinin hesaplanmasında, hükümlünün onbeş yaşını dolduruncaya kadar ceza infaz kurumunda geçirdiği bir gün, üç gün; onsekiz yaşını dolduruncaya kadar ceza infaz kurumunda geçirdiği bir gün, iki gün olarak dikkate alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="7" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>Maliye Bakanlığınca Adalet Bakanlığına tahsis edilen Hazinenin özel mülkiyetindeki taşınmazlar, Devletin hüküm ve tasarrufu altındaki yerler ve Adalet Bakanlığına tahsis edilen ya da izin verilen mülkiyeti kamu kurum ve kuruluşlarına ait taşınmazlar üzerinde, bu maddenin yürürlüğe girdiği tarihten 31/12/2020 tarihine kadar, yılı yatırım programında yer alma ve ödeneği bulunma şartı aranmaksızın, 3/5/1985 tarihli ve 3194 sayılı İmar Kanunu kapsamında imar planı yapım ve onay süreleri beklenilmeksizin, birinci ve ikinci derece arkeolojik sit alanları ile doğal sit alanları hariç olmak üzere özel kanunlar kapsamında kalan yerlerde bu kanunlardaki kısıtlamalara tabi olmaksızın, vaziyet planı ve avan proje üzerinde, 4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanununun 21 inci maddesinin birinci fıkrasının (b) bendinin tabi olduğu usule göre ceza infaz kurumlarının yapım işi ihalesi yapılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra uyarınca yapılacak olan ceza infaz kurumlarının, 25/2/1998 tarihli ve 4342 sayılı Mera Kanunu kapsamında kalan yerler üzerinde yapılmasının gerekmesi halinde, Adalet Bakanlığının talebi üzerine bu yerlerin tahsis amaçları, 4342 sayılı Kanun hükümlerine tabi olmaksızın ve ot bedeli alınmaksızın değiştirilerek tapuda Hazine adına tescil edilir ve bu taşınmazlar Maliye Bakanlığı tarafından Adalet Bakanlığına tahsis edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="8" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>5237 sayılı Kanunun İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde ve 220 nci maddesinde düzenlenen suçlar ve cinsel dokunulmazlığa karşı işlenen suçlar ile bunların mülga 765 sayılı Türk Ceza Kanunundaki karşılığı olan suçlardan ve 3713 sayılı Kanun kapsamına giren suçlardan hükümlü ve tutuklu olanlar ile bu Kanunun 9 uncu maddesinin üçüncü fıkrası kapsamında kalan hükümlü ve tutuklular hakkında verilenler hariç olmak üzere; 1/8/2017 tarihinden önceki eylemler nedeniyle bu Kanunun 39 ila 46 ncı maddeleri uyarınca verilen disiplin cezası ve tedbirleri, infaz edilmeleri kaydıyla 48 inci maddedeki süre ve karar şartı aranmaksızın idare ve gözlem kurulunca verilecek iyi hal kararı üzerine kaldırılır. 55 inci madde hükümleri saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="9" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>5237 sayılı Türk Ceza Kanununun İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde ve 220 nci maddesinde düzenlenen suçlardan, cinsel dokunulmazlığa karşı işlenen suçlardan ve 3713 sayılı Kanun kapsamına giren suçlardan hükümlü ve tutuklu olanlar ile Kanunun 9 uncu maddesinin üçüncü fıkrası kapsamında kalan hükümlü ve tutuklular hakkında verilenler hariç olmak üzere; 30/3/2020 tarihinden önceki eylemler nedeniyle Kanunun 39 ilâ 46 ncı maddeleri uyarınca verilen disiplin cezası ve tedbirleri, infaz edilmeleri kaydıyla 48 inci maddedeki süre ve karar şartı aranmaksızın idare ve gözlem kurulunca verilecek iyi hâl kararı üzerine kaldırılır. 55 inci madde hükümleri saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu maddeyi ihdas eden Kanunla 89 uncu maddede yapılan değişiklikler, 1/1/2021 tarihinden itibaren uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>105/A maddesinin altıncı fıkrasında yer alan “beş gün”lük süre, 1/1/2021 tarihine kadar “yirmibeş gün” olarak uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>5237 sayılı Kanunun 102, 103, 104, 105 ve 188 inci maddelerinde düzenlenen suçlardan 18/6/2014 tarihli ve 6545 sayılı Kanunun yürürlüğe girdiği 28/6/2014 tarihinden önce işlenmiş olanlar için verilen süreli hapis cezaları bakımından koşullu salıverilme oranı üçte iki olarak uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Covid-19 salgın hastalığının ülkemizde görülmüş olması sebebiyle, açık ceza infaz kurumlarında bulunanlar ile kapalı ceza infaz kurumunda bulunup da açık ceza infaz kurumlarına ayrılmaya hak kazanan hükümlüler, 105/A maddesi kapsamında denetimli serbestlik tedbiri uygulanarak cezasının infazına karar verilen hükümlüler ve 106 ncı madde veya diğer kanunlar uyarınca denetimli serbestlik tedbirinden yararlanan hükümlüler, 31/5/2020 tarihine kadar izinli sayılır. Salgının devam etmesi hâlinde bu süre, Sağlık Bakanlığının önerisi üzerine Adalet Bakanlığı tarafından her defasında iki ayı geçmemek üzere ondokuz kez uzatılabilir. Bu fıkra uyarınca izinli sayılanlar hakkında 95 ve 97 nci madde hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Türk Ceza Kanununun İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde tanımlanan suçlar, Terörle Mücadele Kanunu kapsamına giren suçlar ve örgüt faaliyeti kapsamında işlenen suçlar hariç olmak üzere, toplam hapis cezası on yıldan az olanlar bir ayını, on yıl ve daha fazla olanlar ise üç ayını kapalı ceza infaz kurumunda geçirmiş olan iyi hâlli hükümlülerden ilgili mevzuat uyarınca açık ceza infaz kurumlarına ayrılmalarına bir yıl veya daha az süre kalanlar, talepleri hâlinde açık ceza infaz kurumlarına gönderilebilirler. Bu hükümlüler, açık ceza infaz kurumlarında barındırılır. İlgili mevzuat uyarınca açık ceza infaz kurumlarına ayrılmaya, beşinci fıkrada belirtilen süreler içinde hak kazandıkları takdirde beşinci fıkra uyarınca izinli sayılırlar. Beşinci fıkrada belirtilen sürenin tamamlanmasından sonra ise açık ceza infaz kurumlarına ayrılmaya hak kazanıp kazanmadıklarına bakılmaksızın, 95 inci maddede düzenlenen izin hakkından yararlanırlar. Bu fıkra hükmü 31/7/2023 tarihine kadar uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="10" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>31/7/2023 tarihi itibarıyla geçici 9 uncu maddenin beşinci fıkrası uyarınca Covid-19 salgın hastalığı nedeniyle izinde bulunan hükümlüler, izin bitimini takip eden onbeş gün içinde infaz işlemlerinin devam ettiği kurumlara dönmek zorundadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>31/7/2023 tarihi itibarıyla geçici 9 uncu maddenin beşinci fıkrası uyarınca Covid-19 salgın hastalığı nedeniyle izinde bulunan ve ilgili mevzuat uyarınca cezalarının denetimli serbestlik tedbiri uygulanmak suretiyle infazına beş yıl ve daha az süre kalan hükümlülerin talebi aranmaksızın, cezalarının koşullu salıverilme tarihine kadar olan kısmının denetimli serbestlik tedbiri uygulanmak suretiyle infazına infaz hakimi tarafından karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıdaki fıkralar uyarınca, izinden dönecek hükümlüler ile hakkında denetimli serbestlik kararı verilecek hükümlülere ilişkin hususlar, Adalet Bakanlığının resmî internet sitesinde duyurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>105/A maddesi kapsamında denetimli serbestlik tedbiri uygulanmak suretiyle cezası infaz edilip geçici 9 uncu maddenin beşinci fıkrası uyarınca Covid-19 salgın hastalığı nedeniyle 31/7/2023 tarihi itibarıyla izinde bulunan hükümlüler, koşullu salıverilme tarihine kadar olan süreleri 105/A maddesinin beşinci fıkrasında belirtilen yükümlülüklere tabi olmadan geçirirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Geçici 9 uncu maddenin altıncı fıkrası uyarınca açık ceza infaz kurumuna gönderilen hükümlüler, 31/7/2023 tarihi itibarıyla açık ceza infaz kurumuna ayrılmış sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Türk Ceza Kanununun İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümünde tanımlanan suçlar, Terörle Mücadele Kanunu kapsamına giren suçlar ve örgüt faaliyeti kapsamında işlenen suçlar hariç olmak üzere, 31/7/2023 tarihi itibarıyla kapalı ceza infaz kurumlarında bulunan hükümlülerden, toplam hapis cezası on yıldan az ise bir ayını, on yıl ve daha fazla ise üç ayını bu kurumlarda geçirip ilgili mevzuat uyarınca açık ceza infaz kurumlarına ayrılmasına üç yıl veya daha az süre kalanlar, bu şartların oluştuğu tarih itibarıyla açık ceza infaz kurumlarına ayrılabilir. Bu hükümlüler ile 31/7/2023 tarihinde geçici 9 uncu maddenin altıncı fıkrası kapsamında açık ceza infaz kurumunda bulunan hükümlüler, talepleri hâlinde en az üç ay açık ceza infaz kurumunda kalmış olmak şartıyla ilgili mevzuat uyarınca cezaların denetimli serbestlik tedbiri altında infazı uygulamasından üç yıl erken yararlandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Altıncı fıkra hükümleri 31/7/2023 tarihi itibarıyla;</template>
            <mvz-bent no="a">
              <template>Hapis cezasının infazı 16, 16/A ve 17 nci maddeleri kapsamında ertelenmiş olan,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hapis cezasının infazı durdurulmuş olan,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>hükümlüler hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Koşullu salıverilmenin geri alınması nedeniyle 31/7/2023 tarihi itibarıyla cezası aynen infaz edilen  hükümlülerin bu cezalarının infazı bakımından altıncı fıkra hükümleri uygulanmaz. Bu hükümlülerin 31/7/2023 tarihi itibarıyla kesinleşmiş ancak infaz edilmemiş diğer hapis cezaları bakımından altıncı fıkra hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="11" başlık="" tür="GEÇİCİ">
          <mvz-fıkra no="1">
            <template>Bu maddeyi ihdas eden Kanunla 105/A maddesinin birinci fıkrasında yapılan düzenleme, bu maddenin yürürlüğe girdiği tarihten önce işlenen suçlar bakımından uygulanmaz.</template>
