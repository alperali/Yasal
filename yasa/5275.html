              <template>İznin ertelenmesi cezası altmış gün sonunda,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Kapalı ceza infaz kurumuna iade cezası altmış gün sonunda,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Odaya kapatma cezası doksan gün sonunda,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Kendiliğinden kalkmış sayılır. (a) bendi hariç, bu fıkradaki diğer süreler karar tarihinden, firar hâlinde infaz tarihinden itibaren başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Çocuğun bulunduğu kurumun disiplin kurulu, kurum kurallarına uyma, iyileştirme programında ilerleme veya verilen ceza ile amaçlanan sonucun gerçekleşmesi durumunda, çocuk hakkında verilen disiplin cezasını süre koşulu aranmaksızın her zaman kaldırabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="49" başlık="Yönetim tarafından alınabilecek tedbirler">
          <mvz-fıkra no="1">
            <template>Yönetim, disiplin soruşturması yapılan hükümlünün odasını, iş ve çalışma yerini değiştirebilir, hükümlüyü kurumun başka kesimine nakledebilir veya diğer hükümlülerden ayırabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kurumun düzeninin ve kişilerin güvenliklerinin ciddî tehlikeyle karşı karşıya kalması hâlinde, asayiş ve düzeni sağlamak için Kanunda açıkça belirtilmeyen diğer tedbirler de alınır. Tedbirlerin uygulanması, disiplin cezasının verilmesine engel olmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="50" başlık="Zorlayıcı araçların kullanılması">
          <mvz-fıkra no="1">
            <template>Hiçbir hâlde zincir ve demire vurmak tedbir olarak uygulanmaz. Kelepçe ve bedensel hareketleri kısıtlayıcı araçlar;</template>
            <mvz-bent no="a">
              <template>Yetkili makamın önüne getirildiğinde çıkarılmak kaydıyla, sevk ve nakil sırasında kaçmayı önlemek için,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hekimin talimat ve gözetiminde olmak üzere tıbbî nedenlerle,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Diğer kontrol usûllerinin yetersizliği hâlinde hükümlünün kendisine veya başkalarına zarar vermesine veya eşyayı tahrip etmesine engel olmak için kurum en üst amirinin emriyle,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Kullanılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Çocuk hükümlüler için birinci fıkranın (a) bendi hükmü uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="51" başlık="Ödüllendirme">
          <mvz-fıkra no="1">
            <template>Hükümlüler, kurum içindeki veya dışındaki genel durumları, eğitim ve iyileştirme faaliyetlerine etkin katılımları, kurum düzenine karşı tutumları ve kendilerine verilen işlerdeki gayretleri dikkate alınarak teşvik esaslı ödüllerden yararlandırılabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu madde hükümleri, çocuk hükümlüler için de geçerlidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hükümlülere verilebilecek ödüller şunlardır:</template>
            <mvz-bent no="a">
              <template>Kapalı ceza infaz kurumlarında bulunan evli hükümlüler, en geç üç ayda bir kez olmak üzere, üç saatten yirmidört saate kadar eşleri ile kurum veya eklentilerinde ceza infaz kurumu personelinin yakın nezareti olmaksızın mahrem şekilde görüştürülebilir.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Çocuk hükümlülere, en geç  ayda bir kez olmak üzere, üç saatten yirmidört saate kadar ana ve babasıyla veya vasisiyle ya da ana veya babasıyla birlikte kardeşiyle kurum ya da eklentilerinde ceza infaz kurumu personelinin yakın nezareti olmaksızın aile görüşmesi yaptırılabilir.19</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Haftalık ziyaret süresi iki saate kadar uzatılabilir.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kapalı ziyaret yerine açık ziyaret yaptırılabilir.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Üst üste kullanılmayan en fazla üç haftalık ziyaret süresi toplu olarak kullandırılabilir.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Haftalık telefonla görüşme süresi veya sayısı iki katına kadar artırılabilir.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Sosyal, kültürel veya sportif etkinliklerden öncelikli veya daha uzun süreli yararlanmaları sağlanabilir.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Haftalık harcama miktarı yarı oranında artırılabilir.</template>
            </mvz-bent>
            <mvz-bent no="ı">
              <template>Tek kişilik odalarda televizyon bulundurma imkânı verilebilir.</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Hediye verilebilir.</template>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Takdir belgesi veya tavsiye mektubu verilebilir.</template>
            </mvz-bent>
            <mvz-bent no="l">
              <template>Çocuk hükümlüler için kurum bünyesinde gerçekleştirilen tören veya anma günü ya da doğum günlerinde çocukların ailelerinin de etkinliklere katılması sağlanabilir.</template>
            </mvz-bent>
            <mvz-bent no="m">
              <template>Çocuk hükümlünün yanında kalacağı bir yakınının olmaması nedeniyle kullanamadığı özel izinler yerine kurum idaresinin uygun gördüğü gün kadar eğitimevinin bulunduğu il sınırları içinde gündüzleri iznini geçirmesi ve gece eğitimevinde kalması imkânı verilebilir.</template>
            </mvz-bent>
            <mvz-bent no="n">
              <template>Çocuk eğitimevinde kalan hükümlünün hafta sonunda bir gün, kurum idaresinin uygun gördüğü süre kadar, kurum dışına çıkmasına izin verilebilir.</template>
            </mvz-bent>
            <mvz-bent no="o">
              <template>Çocuk eğitimevinde kalan hükümlü, kamu kurum ve kuruluşlarının gençlik kampı veya gençlik merkezi gibi imkânlarından yararlandırılabilir.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Ödüllendirme sisteminin usul ve esasları ile bu ödüllerden yararlanmanın kapsam ve şartları, suç türleri dikkate alınarak yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="52" başlık="Şikâyet ve itiraz">
          <mvz-fıkra no="1">
            <template>Disiplin cezalarına ve tedbirlerine karşı şikâyet ve itiraz durumunda 16.5.2001 tarihli ve 4675 sayılı İnfaz Hâkimliği Kanunu hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Diğer mevzuattan kaynaklanan dilekçe ve şikâyet hakkı saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="9-DOKUZUNCU" başlık="Hükümlülerin Nakilleri">
        <mvz-madde no="53" başlık="Nakiller">
          <mvz-fıkra no="1">
            <template>Hükümlüler, kendi istekleri veya toplu sevk, disiplin, asayiş ve güvenlik, hastalık, eğitim, öğretim, suç ve yargılama yeri nedenleriyle başka bir kuruma nakledilebilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü nakilden önce aranır ve kurum hekimine, yoksa diğer bir resmî hekime muayene ettirilir; muayene sonucu yola çıkarılamayacağı anlaşılanlar, kurumun en üst amirince derhâl resmî bir sağlık kuruluşuna sevk edilir. Mazeretinin, biri hastalığın uzmanı olmak üzere en az iki uzman hekimin imzaladığı ve hastane başhekiminin onayladığı resmî rapor ile belgelenmesi hâlinde nakil, mazeret ortadan kalkıncaya kadar geri bırakılır ve durum Adalet Bakanlığına bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="54" başlık="Kendi istekleri ile nakil">
          <mvz-fıkra no="1">
            <template>Hükümlülerin kendi istekleri ile bulundukları kurumdan başka kurumlara nakledilebilmeleri için;</template>
            <mvz-bent no="a">
              <template>Gitmek istedikleri kurumlardan durumlarına uygun en az üç yeri belirten bir dilekçe vermeleri,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Nakil giderlerini peşin olarak ödemeyi kabul etmeleri,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Ceza infaz kurumlarında bulunulması gereken sürenin üç aydan fazla olması,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>İyi hâl göstermeleri, disiplin cezası almamış veya kaldırılmış olması,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>İstekte bulunulan kurumda yer, kapsama gücü ve sınıfının uygun bulunması ve tutukevi olmaması,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Mahkûmiyet sürelerine uygun hükümlülerin barındırıldığı bir kurum olması,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Daha önce disiplin nedeniyle ayrılmak zorunda kaldıkları kurum olmaması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Gerekir.  Çocuk hükümlüler ile maddi durumunun yetersiz olduğunu belgelendiren hükümlüler bakımından bu fıkranın (b) bendi uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hükümlüler nakledildikleri kurumlarda, eğitim öğretim veya hastalık nedeniyle nakil hariç, bir yıl kalmak zorundadırlar. Çocuklar bakımından bu süre altı ay olarak uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="55" başlık="Disiplin nedeniyle nakil">
          <mvz-fıkra no="1">
            <template>Hükümlü, hücreye koyma cezasını gerektiren eylemlerde bulunması hâlinde kurum yönetimince hakkında disiplin işlemi yapılır ve kurum en üst amirinin istemi üzerine Bakanlıkça başka kurumlara nakledilebilir. Disiplin cezaları yeni kurumlarda çektirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hükümlüler nakledildikleri kurumlarda, mahkeme kararı, kurum güvenliği, can güvenliği veya hastalık sebepleriyle nakil hariç, altı ay kalmak zorundadırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="56" başlık="Zorunlu nedenlerle nakil">
          <mvz-fıkra no="1">
            <template>Kurumların elverişsiz ve yetersiz kalması, kapsama gücünün aşılması, kullanılamaz hâle gelmesi, asayiş, güvenlik, doğal afet, yangın ve büyük onarım gibi zorunlu nedenlerle başka kurumlara nakledilmeleri gerekli görülen hükümlüler, yargı çevresi dışında Adalet Bakanlığınca belirlenen ve konumlarına uygun olan diğer kurumlara nakledilebilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="57" başlık="Hastalık nedeniyle nakil">
          <mvz-fıkra no="1">
            <template>Hastaneye sevki zorunlu görülen hükümlü, bulunduğu yere en yakın tam teşekküllü Devlet veya üniversite hastanesinin hükümlü koğuşuna yatırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hastanelere gönderilen hükümlülerin başka yerlerdeki hastanelere sevki, sağlık kurulu raporuyla, acil ve yaşamsal tehlikesi bulunması hâlinde, varsa biri hastalığın uzmanı olmak üzere iki uzman hekim tarafından verilip, başhekim tarafından onaylanan ve hastalığın sebebi, tedavinin hangi sebeple bulunduğu hastanede gerçekleştirilemediği, hastaya nerede ve ne tür bir tedavi gerektiğini açıkça belirten bir raporla mümkündür. Bu durumda da en yakın ve hükümlü koğuşu bulunan Devlet veya üniversite hastaneleri tercih edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hükümlünün bu hastanelerde kontrol ve tedavisinin devam edip etmeyeceğinin sağlık kurulu raporuyla belgelendirilmesi gerekir; aksi hâlde hükümlü ait olduğu kuruma iade edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hükümlü, acil hâller dışında özel sağlık kuruluşlarında tedavi edilemez. Acil hâllerin varlığı hâlinde Adalet Bakanlığına bilgi verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Hükümlü, sağlık nedenleriyle bulunduğu kurumda kalmasının uygun olmadığı, kurum hekiminin önerisi ve en üst amirinin isteği üzerine alınacak sağlık kurulu raporuyla belirlendiği takdirde, başka kurumlara nakledilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="58" başlık="Nakillerde alınacak tedbirler">
          <mvz-fıkra no="1">
            <template>Hükümlülerin kuruma veya başka bir yere götürülüp getirilmesi sırasında, halkla bir araya gelmelerine ve başkaları tarafından görülmelerine engel olacak tedbirler alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü, havalandırma ve ışık durumu yetersiz araçlarla, eziyet verici veya onur kırıcı şekilde nakledilemez. Nakil sırasında alınacak tedbirler, hükümlünün firarını önleyici ve yukarıdaki fıkrada yazılı engelleri gerçekleştirici sınırları aşamaz, birbirleriyle ve görevlilerle herhangi bir tartışmaya girmelerini engelleyici boyutları geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Çocuk eğitimevlerine nakiller kurum görevlisinin nezaretinde yapılır. Açık ceza infaz kurumlarına nakiller ise kurum görevlisi olmaksızın yapılır. Bu hâlde hükümlünün, aynı il sınırları içinde bulunan ceza infaz kurumları arasındaki nakillerde aynı gün içinde; farklı illerde bulunan ceza infaz kurumları arasındaki nakillerde ise kurum amirinin kırksekiz saati geçmeyecek şekilde belirleyeceği süre içinde, nakledildiği açık ceza infaz kurumuna giriş yapması gerekir. Belirlenen sürelerde açık ceza infaz kurumuna giriş yapmayan hükümlüler hakkında 97 nci madde hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Görevli nezaretinde yapılan nakiller sırasında hükümlünün iaşe ve bedensel ihtiyaçları giderilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Ceza İnfaz Kurumunda Hükümlünün Hakları, Güvenceleri ve Kısıtlamalar">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Savunma Haklarının Kullanılması, Kültür ve Sanat Etkinliklerine Katılma, İfade Özgürlüğü">
        <mvz-madde no="59" başlık="Avukat ve noterle görüşme hakkı">
          <mvz-fıkra no="1">
            <template>Hükümlü, avukatlık mesleğinin icrası çerçevesinde avukatları ile vekâletnamesi olmaksızın en çok üç kez görüşme hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Avukat ve noter ile görüşme, meslek kimliklerinin ibrazı üzerine, tatil günleri dışında ve çalışma saatleri içinde, bu iş için ayrılan görüşme yerlerinde, konuşulanların duyulamayacağı, ancak güvenlik nedeniyle görülebileceği bir biçimde yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Avukatlar, vekâletnameleri olsa da aynı anda birden fazla hükümlü ile görüşme yapamazlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Görüşme sırasında; hükümlünün avukatına veya avukatın hükümlüye verdiği belge veya belge örnekleri, dosyalar ve aralarındaki konuşmaya ilişkin olarak kendilerinin tuttukları kayıtlar incelenemez; hükümlünün avukatı ile yaptığı görüşme dinlenemez ve kayda alınamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Türk Ceza Kanununun 220 nci maddesinde ve İkinci Kitap Dördüncü Kısım Dördüncü, Beşinci, Altıncı ve Yedinci Bölümlerinde tanımlanan suçlar ile 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu kapsamına giren suçlardan mahkûm olanların avukatları ile görüşmelerinde, toplumun ve ceza infaz kurumunun güvenliğinin tehlikeye düşürüldüğüne, terör örgütü veya diğer suç örgütlerinin yönlendirildiğine, bu örgütlere emir ve tâlimat verildiğine veya yorumları ile gizli, açık ya da şifreli mesajlar iletildiğine ilişkin bilgi, bulgu veya belge elde edilmesi hâlinde, Cumhuriyet başsavcılığının istemi ve infaz hâkiminin kararıyla, üç ay süreyle; görüşmeler teknik cihazla sesli veya görüntülü olarak kaydedilebilir, hükümlü ile avukatın yaptığı görüşmeleri izlemek amacıyla görevli görüşmede hazır bulundurulabilir, hükümlünün avukatına veya avukatın hükümlüye verdiği belge veya belge örnekleri, dosyalar ve aralarındaki konuşmalara ilişkin tuttukları kayıtlara elkonulabilir veya görüşmelerin gün ve saatleri sınırlandırılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İnfaz hakimliği hükümlünün; kurallara uyumunu, toplum veya ceza infaz kurumu bakımından arz ettiği tehlikeyi ve rehabilitasyon çalışmalarındaki gelişimini değerlendirerek, kararda belirttiği süreyi üç aydan fazla olmamak üzere müteaddit defa uzatabileceği gibi kısaltılmasına veya sonlandırılmasına da karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Beşinci fıkra kapsamına giren hükümlünün yaptığı görüşmenin, aynı fıkrada belirtilen amaca yönelik yapıldığının anlaşılması hâlinde, görüşmeye derhal son verilerek, bu husus gerekçesiyle birlikte tutanağa bağlanır. Görüşme başlamadan önce taraflar bu hususta uyarılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Hükümlü hakkında, yedinci fıkra uyarınca tutanak tutulması hâlinde, Cumhuriyet başsavcılığının istemiyle hükümlünün avukatlarıyla görüşmesi infaz hâkimince altı ay süreyle yasaklanabilir. Yasaklama kararı, hükümlüye ve yeni bir avukat görevlendirilmesi için derhal ilgili baro başkanlığına bildirilir. Cumhuriyet başsavcılığı baro tarafından bildirilen avukatın değiştirilmesini baro başkanlığından isteyebilir. Bu fıkra hükmüne göre görevlendirilen avukata, 23/3/2005 tarihli ve 5320 sayılı Ceza Muhakemesi Kanununun Yürürlük ve Uygulama Şekli Hakkında Kanunun 13 üncü maddesine göre ücret ödenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>İnfaz hâkimi tarafından bu madde uyarınca verilen kararlara karşı 4675 sayılı Kanuna göre itiraz edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Bu madde hükümleri 9 uncu maddenin üçüncü fıkrasına göre yüksek güvenlikli ceza infaz kurumlarında bulunan hükümlüler ile beşinci fıkradaki suçlardan hükümlü olup, başka bir suçtan dolayı şüpheli veya sanık sıfatıyla avukatıyla görüşen hükümlüler hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="11">
            <template>Tutuklular hakkında bu madde hükümlerine göre karar vermeye soruşturma aşamasında sulh ceza hâkimi, kovuşturma aşamasında mahkeme yetkilidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="12">
            <template>Türkiye Cumhuriyetinin taraf olduğu uluslararası sözleşmelere ve karşılıklılık esasına uygun olmak koşuluyla, Yabancı ülkelerde haklarında soruşturma veya kovuşturma yapılmakta olan, yabancı ülke veya uluslararası yargı mercilerinde dava açmak isteyen, leh veya aleyhine açılmış davası olan Türk vatandaşı veya yabancı uyruklu hükümlülerle yabancı uyruklu avukatları, bu soruşturma ve kovuşturma, açılacak veya açılmış davalarla sınırlı olmak ve vekâletname sunmak koşuluyla görüşebilirler. Vekâletnamesi olmayan yabancı uyruklu avukatlar, hükümlü ile Türkiye barolarına kayıtlı bir avukatla birlikte görüşme yapabilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="60" başlık="Kültür ve sanat etkinliklerine katılma, ifade özgürlüğü">
          <mvz-fıkra no="1">
            <template>Ceza infaz kurumlarında, olanaklar elverdiğince, kültürün ve sanatın çeşitli dallarını temsil eden programlar hazırlanır ve hükümlülerin bunlara katılmaları hususundaki usûller düzenlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu programların temel hedefi, hükümlülerin ifade yeteneklerini geliştirmelerini ve bilgilerini artırmalarını sağlamaktır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kurumun kültür ve sanat programları, Adalet Bakanlığınca belirlenen esaslara göre kurum en üst amiri tarafından düzenlenir. Bu maksatla Devletin kültür ve sanat işleriyle görevli kuruluşları gerekli yardımları yaparlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hükümlülerin ifade özgürlüğü çerçevesinde gerçekleştirebilecekleri yayın etkinlikleri, kurumda çalışma esaslarını düzenleyen hükümlere ve bu husustaki koşullara bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="61" başlık="Kütüphaneden yararlanma">
          <mvz-fıkra no="1">
            <template>Ceza infaz kurumlarında, kurumun büyüklüğüne göre, kütüphane veya kitaplık oluşturulur. Kütüphanelerde veya kitaplıklarda verilen derslere kaynaklık edecek kitapların yanı sıra olanaklar ölçüsünde hükümlülerin boş zamanlarını değerlendirmelerini, okuma alışkanlığı edinmelerini ve kültür bakımından ufuklarını geliştirmelerini sağlayacak kitaplar da bulundurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlüye kurum kütüphanesinden yararlanma imkânı verilir.  Ayrıca, hükümlüler kamu kurum ve kuruluşlarına bağlı kütüphanelerde bulunan ve 62 nci maddedeki şartları taşıyan yayınlardan yararlandırılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu hizmet, gezici kitaplıklarla da yerine getirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="62" başlık="Süreli veya süresiz yayınlardan yararlanma hakkı">
          <mvz-fıkra no="1">
            <template>Hükümlü, mahkemelerce yasaklanmamış olması koşuluyla süreli ve süresiz yayınlardan bedelini ödeyerek yararlanma hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Resmî kurumlar, üniversiteler, kamu kurumu niteliğindeki meslek kuruluşları ile mahkemelerce yasaklanmamış olması koşuluyla Cumhurbaşkanınca vergi muafiyeti tanınan vakıflar ve kamu yararına çalışan dernekler tarafından çıkartılan gazete, kitap ve basılı yayınlar, hükümlülere ücretsiz olarak ve serbestçe verilir. Eğitim ve öğretimine devam eden hükümlülerin ders kitapları denetime tâbi tutulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kurum disiplinini, düzenini veya güvenliğini bozan ya da tehlikeye düşüren, hükümlülerin iyileştirilmesi amacına ulaşmayı zorlaştıran yahut müstehcen haber, yazı, fotoğraf ve yorumları kapsayan hiçbir yayın hükümlüye verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Basın İlân Kurumu aracılığıyla resmî ilan ve reklam yayınlama hakkı bulunmayan gazeteler, ceza infaz kurumuna kabul edilmez. Ancak ilan ve reklamın geçici süreyle kesilmesi hâli, bu hükmün dışındadır. Yabancı dilde yayımlanmış gazete ve dergilerin ceza infaz kurumuna kabul edilmesinde Adalet Bakanlığı yetkilidir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Günlük Yaşamda Haklar ve Yükümlülükler">
        <mvz-madde no="63" başlık="Hükümlünün barındırılması ve yatırılması">
          <mvz-fıkra no="1">
            <template>Tehlikeli hâli bulunan hükümlü ancak bir veya üç kişilik odalarda, diğer hükümlüler ise kurumun fizikî yapısı, kapasite durumu ve güvenlik gerekleri göz önüne alınarak cezaevi yönetimi tarafından belirlenecek sayıda mahkûmun kalabileceği odalarda barındırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Her hükümlüye yöresel iklime uygun nitelikte tek tip yatak ve yeterli sayıda yatak takımı verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kadınların erkeklerle, hükümlülerin tutuklularla, çocukların yetişkinlerle, örgüt veya çıkar amaçlı örgüt suçluları ile terör suçlularının Kanunda sayılan hâller dışında bir araya gelmelerine ve bağlantı kurmalarına izin verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Oda ve kısımlarda iklim koşulları göz önüne alınarak yeterli yer, ışık, ısınma, havalandırma ve hijyen sağlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="64" başlık="Hükümlünün giydirilmesi">
          <mvz-fıkra no="1">
            <template>Muhtaç hükümlülere talepleri hâlinde, idare tarafından iklime ve sağlığa uygun giysiler verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlülerin giysileri, iç ve dış güvenlik görevlilerinin giymekte olduğu üniformalara benzer şekil ve renkte olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="65" başlık="Hükümlünün bakıma muhtaç çocuklarının barındırılması">
          <mvz-fıkra no="1">
            <template>Anaları hükümlü olup da dışarıda korumasına bırakılacak kimsesi bulunmayan sıfır-altı yaş grubundaki çocuklar, analarının yanında kalabilirler. Bu çocuklar gündüzleri ceza infaz kurumu bünyesindeki veya Sosyal Hizmetler ve Çocuk Esirgeme Kurumu veya diğer kurum ve kuruluşlara ait kreş ve gündüz bakımevlerinde barındırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Analarının yanında kalan çocuklara, yaş ve durumlarına ve ihtiyaçlarına göre yiyecek ve içecek verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Üç yaşını doldurmuş çocuklar, hâkim kararıyla çocuk yuvalarına veya yetiştirme yurtlarına yerleştirilebilirler. Bu çocukların belirlenecek bir program ve usule göre zaman zaman analarıyla temasları sağlanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="66" başlık="Hükümlünün telefon ile haberleşme hakkı">
          <mvz-fıkra no="1">
            <template>Kapalı ceza infaz kurumlarındaki hükümlüler, Cumhurbaşkanınca çıkarılan yönetmelikte belirlenen esas ve usullere göre idarenin kontrolündeki ücretli telefonlar ile görüşme yapabilirler. Telefon görüşmesi idarece dinlenir ve kayıt altına alınır. Bu hak, tehlikeli hâlde bulunan ve örgüt mensubu hükümlüler bakımından kısıtlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Açık ceza infaz kurumları ile çocuk eğitimevlerinde hükümlüler, ücretli telefonlarla serbestçe görüşme yapabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Açık ve kapalı ceza infaz kurumlarındaki hükümlüler altsoy, üstsoy, eş ve kardeşlerinin ölüm, ağır hastalık, salgın hastalık veya doğal afet hâllerinde, kuruma ait telefon ve faks cihazından derhâl yararlandırılırlar. Görüşmeler, tutanak ile belgelenir ve tutanaklar özel bir dosyada saklanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hükümlüler açık ve kapalı ceza infaz kurumlarında, çocuk eğitimevlerinde araç telefonu, telsiz telefon veya cep telefonu ve benzeri iletişim araçlarını bulunduramaz ve kullanamazlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="67" başlık="Hükümlünün radyo, televizyon yayınları ile internet olanaklarından yararlanma hakkı">
          <mvz-fıkra no="1">
            <template>Hükümlü, ceza infaz kurumlarında merkezî yayın sistemi bulunduğu takdirde bu sisteme bağlı olarak radyo ve televizyon yayınlarını izleme hakkına sahiptir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Merkezî yayın sistemi bulunmayan kurumlarda, yararlı olmayan yayınların izlenmesini ve dinlenmesini engelleyecek önlemler alınmak suretiyle bağımsız anten kullanılarak televizyon ve radyo izlenmesine ve dinlenmesine izin verilir. Bu cihazlar, bedeli kendisi tarafından ödenmek koşuluyla hükümlü adına kurumca satın alınır. Her ne biçimde olursa olsun dışardan gelenler tarafından getirilen radyo, televizyon ve bilgisayarlar kuruma alınmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kapalı ve açık ceza infaz kurumları ile çocuk eğitimevlerinde ancak, eğitim ve iyileştirme programları çerçevesinde kurum yönetimince belirlenen yerlerde görsel ve işitsel eğitim araç ve gereçlerinin kullanımına izin verilebilir. Eğitim ve iyileştirme programları gerekli kıldığı takdirde denetim altında internetten yararlanılabilir. Hükümlü, odasında bilgisayar bulunduramaz. Ancak, Adalet Bakanlığının uygun görmesi hâlinde eğitim ve kültürel amaçlı olarak bilgisayarın ceza infaz kurumuna alınmasına izin verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu haklar, tehlikeli hâlde bulunan veya örgüt mensubu hükümlüler bakımından kısıtlanabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="68" başlık="Hükümlünün mektup, faks ve telgrafları alma ve gönderme hakkı">
          <mvz-fıkra no="1">
            <template>Hükümlü, bu maddede belirlenen kısıtlamalar dışında, kendisine gönderilen mektup, faks ve telgrafları alma ve ücretleri kendisince karşılanmak koşuluyla, gönderme hakkına sahiptir.  Hükümlü, usul ve esasları Adalet Bakanlığınca belirlenmek suretiyle, gerekli teknik altyapının bulunduğu kurumlarda elektronik yöntemlerle de mektup alıp gönderebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü tarafından gönderilen ve kendisine gelen mektup, faks ve telgraflar; mektup okuma komisyonu bulunan kurumlarda bu komisyon, olmayanlarda kurumun en üst amirince denetlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kurumun asayiş ve güvenliğini tehlikeye düşüren, görevlileri hedef gösteren, terör ve çıkar amaçlı suç örgütü veya diğer suç örgütleri mensuplarının haberleşmelerine neden olan, kişi veya kuruluşları paniğe yöneltecek yalan ve yanlış bilgileri, tehdit ve hakareti içeren mektup, faks ve telgraflar hükümlüye verilmez. Hükümlü tarafından yazılmış ise gönderilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hükümlü tarafından resmî makamlara veya savunması için avukatına gönderilen mektup, faks ve telgraflar denetime tâbi değildir.  Bu iletiler, alıcısı dışındaki kişilerin erişimini engelleyici tüm tedbirler alınarak hükümlünün talebine göre posta yoluyla veya elektronik ortamda alıcısına ulaştırılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kamu düzeninin korunması ile kişi, toplum ve kurum güvenliğinin sağlanması veya suç işlenmesinin önlenmesi amacıyla terör suçları, örgüt kurmak, yönetmek veya örgüte üye olmak suçları ile örgüt faaliyeti kapsamında işlenen suçlardan mahkûm olan veya tehlikeli hâlde bulunan ya da dışarı ile iletişiminin kurum güvenliği açısından tehlikeli olabileceği değerlendirilen hükümlülere gelen veya bu hükümlüler tarafından gönderilen mektup, faks ve telgraflar dijital olarak kaydedilebilir veya fiziki olarak saklanabilir. Bunlar, amacı dışında kullanılamaz, kanunda açıkça belirtilen hâller dışında hiçbir kişi veya kurumla paylaşılamaz, herhangi bir soruşturma veya kovuşturmaya konu edilmemiş ise en geç bir yıl sonunda silinir veya imha edilir. Silme veya imha işlemi Cumhuriyet savcısı tarafından denetlenir. Bu fıkra hükmü dördüncü fıkra bakımından uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="69" başlık="Hükümlüye dışarıdan gönderilen hediyeyi kabul etme hakkı">
          <mvz-fıkra no="1">
            <template>Kapalı ceza infaz kurumlarındaki hükümlü, iki ayda bir kez, ayrıca dinî bayram, yılbaşı veya kendi doğum günlerinde dışarıdan gönderilen ve kurum güvenliği için tehlikeli olmayan bir hediyeyi kabul etme hakkına sahiptir. Çocuk ve altmış beş yaşını tamamlamış hükümlüler ile beraberinde çocuğu bulunan kadın hükümlüler, idare ve gözlem kurulu tarafından alınacak karar doğrultusunda belirtilen zaman dilimi dışında da hediye kabul edebilir. Bunun esas ve usulleri yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="70" başlık="Din ve vicdan özgürlüğü">
          <mvz-fıkra no="1">
            <template>Hükümlü, ceza infaz kurumunda, mensup bulunduğu dinin ibadetlerini, düzeni bozmayacak ve çalışmayı engellemeyecek biçimde serbestçe yerine getirebilir ve ibadette kullanılan eşyayı, dinî yaşamı bakımından zorunlu olan kitap ve eserleri temin ve bulunduğu yerlerde muhafaza edebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlünün, mensup bulunduğu dinin görevlilerince ziyaret edilmesine ve onlarla iletişim kurmasına, kurum güvenliğini tehlikeye düşürmemek koşuluyla izin verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="71" başlık="Hükümlünün muayene ve tedavi istekleri">
          <mvz-fıkra no="1">
            <template>Hükümlü, beden ve ruh sağlığının korunması, hastalıklarının tanısı için muayene ve tedavi olanaklarından, tıbbî araçlardan yararlanma hakkına sahiptir. Bunun için hükümlü öncelikle kurum revirinde, mümkün olmaması hâlinde Devlet veya üniversite hastanelerinin mahkûm koğuşlarında tedavi ettirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Türk Ceza Kanununun 191 inci maddesinde yer alan kullanmak için uyuşturucu veya uyarıcı madde satın almak, kabul etmek veya bulundurmak ya da uyuşturucu veya uyarıcı madde kullanmak suçundan hükümlü olanların tedavi ve rehabilitasyon programlarına katılması zorunludur. Bu suçtan hükümlü olanlar için tedavi ve rehabilitasyon programlarının uygulanacağı müstakil ceza infaz kurumları açılabileceği gibi mevcut ceza infaz kurumlarının bir bölümü de bu amaç için düzenlenebilir. Tedavi ve rehabilitasyon birimleri ile programlarının asgari standartları Sağlık Bakanlığının uygun görüşü alınarak Adalet Bakanlığınca belirlenir. Tedavi ve rehabilitasyon programlarının başarılı olabilmesi amacıyla hükümlünün izin, ziyaret ve görüşme hakları uzman görüşü doğrultusunda geçici olarak kısıtlanabilir. Başka bir suçtan hükümlü olup uyuşturucu veya uyarıcı madde bağımlısı olduğu tespit edilen hükümlüler hakkında da bu fıkra hükmü uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="72" başlık="Hükümlünün beslenmesi">
          <mvz-fıkra no="1">
            <template>Hükümlüye Adalet ve Sağlık bakanlıklarınca birlikte belirlenecek kalori esasına göre, sağlıklı ve güçlü kalması için nitelik ve nicelik olarak besleyici, sağlık koşullarına uygun, makul çeşitlilikte, yaş, sağlık, çalıştığı işin özelliği, dinî ve kültürel gerekleri göz önünde tutularak besin verilir ve içme suyu sağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü, kendisine verilen günlük besin ve ihtiyaç maddeleri dışındaki ihtiyaçlarını kurum kantininden sağlayabilir. Kantini bulunmayan kurumlarda, bu maddeler, idarenin izin ve kontrolü altında dışardan sağlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hasta hükümlüye, kurum hekiminin belirleyeceği besinler verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kurumda annesiyle birlikte kalan çocuklara ve süt emziren annelere durumlarına uygun gıda verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="4-DÖRDÜNCÜ" başlık="İyileştirme">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Bireyselleştirme">
        <mvz-madde no="73" başlık="İyileştirme programlarının belirlenmesi">
          <mvz-fıkra no="1">
            <template>Hükümlünün geçmişi, suçluluk nedenleri, suç sicili, fizik yeteneği ve ruhsal yapısı, kişisel doğası, arz edebileceği tehlike hâlleri, hapis cezasının süresi, salıverildikten sonraki beklentisi dikkate alınarak, toplumun hukuka uygun hareket eden ve üretken bir üyesi olarak yaşamını sürdürmesini sağlayacak ve bireysel ihtiyaçlarına uygun bir biçimde iyileştirme programları uygulanır. Bu programların hazırlanması ve uygulanması amacıyla ceza infaz kurumlarında eğitim ve psiko-sosyal hizmet servisleri oluşturulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü, amaca uygun iyileştirme gereklerinin gerçekleştirilebileceği kurumlara veya bölümlere yerleştirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="74" başlık="Hükümlülerin sayısı ve uygulanacak güvenlik tedbirleri">
          <mvz-fıkra no="1">
            <template>Hükümlülerin yerleştirildikleri kurum veya bölümlerde bireyselleştirmeyi mümkün kılacak sayıda bulundurulmalarına özen gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İyileştirme programları uygulanan grupların özelliklerine göre değişik güvenlik tedbirlerine yer verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tehlikeli hâlde oldukları saptanan hükümlüler, bireyselleştirilmeleri için yapılacak çalışmalarda on kişiyi aşacak biçimde gruplandırılamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Eğitim">
        <mvz-madde no="75" başlık="Eğitim programları">
          <mvz-fıkra no="1">
            <template>Ceza infaz kurumlarında bulunduğu süre içinde hükümlüye, kişiliğini geliştirecek, eğitimini güçlendirecek, yeni beceriler elde etmesini, suç işleme eğilimini yok etmeyi sağlayacak ve salıverilme sonrasına hazırlayacak programlar uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlünün yaş, ceza süresi ve yeteneklerine öncelik verilerek ekonomik ve kültür durumuna uygun biçimde düzenlenen eğitim programları; temel eğitim, orta ve yüksek öğretim, meslek eğitimi, din eğitimi, beden eğitimi, kütüphane ve psiko-sosyal hizmet konularını kapsar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="76" başlık="Öğretimden yararlanma">
          <mvz-fıkra no="1">
            <template>Açık ceza infaz kurumları ile çocuk eğitimevlerinde bulunan hükümlülerin tüm öğretim türlerinden; diğer ceza infaz kurumlarında bulunan hükümlülerin ise kurum içinde verilebilen yaygın, dışarıdan ve açık öğretim programlarından yararlanmaları sağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kapalı ceza infaz kurumunda bulunan hükümlüler, kurum içinde açılan örgün öğretim programlarına kurum disiplin, düzen ve güvenliğini tehlikeye düşürmeyecek şekilde, kurumsal kapasite ve imkânların uygunluğu ölçüsünde devam edebilir. Yaş, eğitim düzeyi, engellilik durumu, sosyal ve ekonomik durum ile benzeri ölçütlere göre ihtiyacı olan hükümlülere öncelik verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kayıtlı olduğu eğitim kurumlarının ilgili mevzuatına göre gerekli şartları taşıyan ve kapalı ceza infaz kurumunda bulunan hükümlülerin sınavları, kişi ve kurum güvenliği ile kurum disiplin ve düzeninin bozulmasını önleyici tedbirler alınarak aşağıda belirtilen usule göre ceza infaz kurumu içinde yapılır:</template>
            <mvz-bent no="a">
              <template>Kayıtlı oldukları ortaöğretim, ön lisans, lisans ve benzeri öğretim programları kapsamındaki sınavlar ile mesleki yeterlilik gibi yazılı veya sözlü sınavlar, ilgili kurum ile koordinasyon sağlanarak öncelikle çevrim içi, bunun mümkün olmaması hâlinde ise ilgili eğitim kurumu görevlisinin gözetiminde yüz yüze yapılır.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hükümlüler, merkezî sınavlar ile açık öğretim kurumları sınavlarına, sınav merkezi olarak belirlenen ceza infaz kurumlarında katılır.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kurum ve kuruluşlar ile üniversiteler, sınavlara ilişkin olarak üçüncü fıkrada belirtilen konularda gerekli düzenlemeleri yapmak ve tedbirleri almakla yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Açık ceza infaz kurumları ile çocuk eğitimevlerinde bulunan hükümlülerin öğretimden yararlanması veya sınavlara katılması, hükümlünün; başarısız olması, devamsızlık göstermesi, eğitim ve sınav alanlarında bu Kanunda yazılı disiplin cezasını gerektiren eylemlerden birini gerçekleştirmesi veya öğretim programının ceza infaz kurumunun işleyişine yer ve zaman itibarıyla uygun olmaması hâlleri dışında engellenemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu maddenin uygulanmasına ve sınavlara ilişkin usul ve esaslar Milli Eğitim Bakanlığı ve Yükseköğretim Kurulunun görüşü alınarak Adalet Bakanlığınca çıkarılan yönetmelikle belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="77" başlık="Dernekler, vakıflar, gönüllü kuruluşlar ve kamu kurum ve kuruluşları ile ilişkiler">
          <mvz-fıkra no="1">
            <template>Hükümlülerin iyileştirilme çabalarında başarıya ulaşılması için dernekler, vakıflar ve gönüllü kişi ve kuruluşlar ile işbirliği yapılabilir. Kamu kurum ve kuruluşları bu maksatla olanakları ölçüsünde, gerekli yardımları yapmakla yükümlüdürler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Sağlığın Korunması ve Tıbbî Müdahâleler">
        <mvz-madde no="78" başlık="Hükümlünün muayene ve tedavisi">
          <mvz-fıkra no="1">
            <template>Kurumun sağlık koşullarının düzenlenmesi, hükümlünün acil veya olağan muayene ve tedavisi kurumun hekimi tarafından yapılır. Genel veya hastalık nedeniyle yapılan tüm muayene ve tedavi sonuçları, sağlık izleme kartına işlenir ve dosyasında saklanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sağlık Bakanlığı ve Çalışma ve Sosyal Güvenlik Bakanlığı ile üniversitelerin sağlık kuruluşları, hükümlülerin tedavileri bakımından gerekli yardımları yapmakla görevlidirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Rızası olsa bile hiçbir hükümlü üzerinde tıbbî deney yapılamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="79" başlık="Sağlık denetimi">
          <mvz-fıkra no="1">
            <template>Kurum hekimi, kurumu ayda en az bir kez denetleyerek genel ve özel önlem alınması gereken hastalıklar ile kurumda sağlık koşulları yönünden alınması gereken önerileri içeren bir rapor düzenler ve kurum yönetimine verir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="80" başlık="Hastaneye sevk">
          <mvz-fıkra no="1">
            <template>Hükümlünün sağlık nedeniyle hastaneye sevkine gerek duyulduğunda durum, kurum hekimi tarafından derhâl bir raporla ceza infaz kurumu yönetimine bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="81" başlık="İnfazı engelleyecek hastalık hâli">
          <mvz-fıkra no="1">
            <template>Kurum hekimi veya görevli hekim tarafından yapılan muayene ve incelemeler sonucunda hükümlünün cezasını yerine getirmesine engel olabilecek hastalığı saptanırsa durum, kurum yönetimine bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="82" başlık="Hükümlünün kendisine verilen yiyecek ve içecekleri reddetmesi">
          <mvz-fıkra no="1">
            <template>Hükümlüler, hangi nedenle olursa olsun, kendilerine verilen yiyecek ve içecekleri sürekli olarak reddettikleri takdirde; bu hareketlerinin kötü sonuçları ile bırakacağı bedensel ve ruhsal hasarlar konusunda ceza infaz kurumu hekimince bilgilendirilirler. Psiko-sosyal hizmet birimince de bu hareketlerinden vazgeçmeleri yolunda çalışmalar yapılır ve sonuç alınamaması hâlinde, beslenmelerine kurum hekimince belirlenen rejime göre uygun ortamda başlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Beslenmeyi reddederek açlık grevi veya ölüm orucunda bulunan hükümlülerden, birinci fıkra gereğince alınan tedbirlere ve yapılan çalışmalara rağmen hayatî tehlikeye girdiği veya bilincinin bozulduğu hekim tarafından belirlenenler hakkında, isteklerine bakılmaksızın kurumda, olanak bulunmadığı takdirde derhâl hastaneye kaldırılmak suretiyle muayene ve teşhise yönelik tıbbî araştırma, tedavi ve beslenme gibi tedbirler, sağlık ve hayatları için tehlike oluşturmamak şartıyla uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıda belirtilen hâller dışında, bir sağlık sorunu olup da muayene ve tedaviyi reddeden hükümlülerin sağlık veya hayatlarının ciddî tehlike içinde olması veya ceza infaz kurumunda bulunanların sağlık veya hayatları için tehlike oluşturan bir durumun varlığı hâlinde de ikinci fıkra hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu maddede öngörülen tedbirler, kurum hekiminin tavsiye ve yönetimi altında uygulanır. Ancak, kurum hekiminin zamanında müdahale edememesi veya gecikmesi hükümlü için hayatî tehlike doğurabilecek ise, bu tedbirlere ikinci fıkrada belirtilen şartlar aranmaksızın başvurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu madde uyarınca hükümlülerin sağlıklarının korunması ve tedavilerine yönelik zorlayıcı tedbirler, onur kırıcı nitelikte olmamak şartıyla uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Dışarıyla İlişkiler">
        <mvz-madde no="83" başlık="Hükümlüyü ziyaret">
          <mvz-fıkra no="1">
            <template>Hükümlü, belgelendirilmesi koşuluyla eşi, üçüncü dereceye kadar kan ve kayın hısımları ile vasisi veya kayyımı tarafından haftada bir kez ve ayrıca kuruma kabullerinde, zorunlu hâller dışında bir daha değiştirilmemek üzere, ad ve adreslerini bildirdiği en fazla üç kişi tarafından, yarım saatten az ve bir buçuk saatten fazla olmamak üzere çalışma saatleri içinde ziyaret edilebilir.  Çocuk hükümlüler için ziyaret süresi bir saatten az, üç saatten fazla olmamak üzere belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada belirtilenler dışındaki kimselerin ziyaretine Cumhuriyet Başsavcılığı tarafından yazılı olarak izin verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Görüşler, koşul ve süreleri Adalet Bakanlığınca hazırlanan yönetmelikle kapalı ve açık olmak üzere iki biçimde yaptırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Önceden bilgilendirilmek suretiyle, kapalı ceza infaz kurumlarında bulunan ve terör suçları, örgüt kurmak, yönetmek veya örgüte üye olmak suçları ile örgüt faaliyeti kapsamında işlenen suçlardan mahkûm olan veya tehlikeli hâlde bulunan ya da dışarı ile iletişiminin kurum güvenliği açısından tehlikeli olabileceği değerlendirilen hükümlülerin birinci ve ikinci fıkra kapsamındaki kişilerle yapacakları görüşmeler, kamu düzeninin korunması ile kişi, toplum ve kurum güvenliğinin sağlanması veya suç işlenmesinin önlenmesi amacıyla kurum yönetimi tarafından dinlenebilir ve elektronik cihazlar da dâhil olmak üzere kaydedilebilir. Bu fıkra uyarınca tutulan kayıtlar, amacı dışında kullanılamaz ve kanunda açıkça belirtilen hâller dışında hiçbir kişi veya kurumla paylaşılamaz. Bu kayıtlar herhangi bir soruşturma ve kovuşturmaya konu edilmemiş ise en geç bir yıl sonunda silinir. Silme işlemi Cumhuriyet savcısı tarafından denetlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="84" başlık="Yabancı hükümlüleri ziyaret">
          <mvz-fıkra no="1">
            <template>Yabancı hükümlülerin, vatandaşı olduğu devletin diplomatik temsilciliği veya konsolosluğunun ziyaret istemleri, mevzuatta belirlenen esas ve usûllere uygun olarak geciktirilmeden yerine getirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Diplomatik temsilciliği veya konsolosluğu bulunmayan devletler vatandaşlığındaki hükümlüler ile mülteci veya vatansız olan hükümlülerin, yararlarını koruyan devletin diplomatik temsilciliği veya bu gibi kimseleri koruma görevini üstlenmiş ulusal veya uluslararası kuruluşlarla görüştürülmelerinde yukarıdaki fıkra hükmü uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>83 üncü madde hükümleri saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="85" başlık="Adalet Bakanlığının ziyaret izni verme yetkisi">
          <mvz-fıkra no="1">
            <template>Kurum, kurul ve kuruluşlar, heyet hâlinde veya bireysel olarak ceza infaz kurumlarını ziyaret edebilmek ve hükümlülerle görüşebilmek için Adalet Bakanlığından izin almak zorundadırlar. Bilimsel araştırma yapanlarla görsel ve yazılı basın mensupları hakkında da bu hüküm uygulanır. Adalet Bakanlığı talepte bulunan kişilerin hükümlüleri ziyaret etmelerine de izin verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü, denetim amacıyla Türkiye'nin taraf olduğu uluslararası sözleşmelerle yetkisi kabul edilen kurum ve kuruluşların temsilcileri tarafından gerekçesi belirtilmek suretiyle ve Adalet Bakanlığının izniyle ziyaret edilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu ziyaret ve görüşmelerde güvenliği tehlikeye düşürmeyecek tedbirler kurum yönetimince alınır. Ziyaret ve görüşmeler yasal zorunluluk olmadıkça kurum görevlilerinin gözetiminde yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Güvenlik bakımından bir araya getirilemeyecek hükümlülerle toplu görüşme yapılamaz. Önceden izin verilmiş olsa bile doğal afet, yangın ve ayaklanma gibi olağanüstü durumlarda ziyaret ve görüşmeler ertelenebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="86" başlık="Ziyaret ve görüşlerde uyulacak esaslar">
          <mvz-fıkra no="1">
            <template>Kapalı ve açık ceza infaz kurumlarına ziyaret veya görüşe gelen resmî heyet ve özel kişiler, kurum güvenliğini tehlikeye sokacak davranışlarda bulunamaz, kurum güvenliği için alınan ve uygulanan yasal ve idarî tedbirlerin değiştirilmesini isteyemezler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kurumun düzen ve güvenliğini, hükümlülerin sağlığını bozabilecek nitelikteki eşya ve maddeler ile her türlü iletişim araçları ve taşıma izin belgesi olsa da silâhlar kuruma sokulamaz. Ziyaret ve görüşlerde hükümlülere para, kıymetli evrak ve eşya verilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kurum görevlileri ve dış güvenlik görevlileri dahil olmak üzere, sıfat ve görevi ne olursa olsun, ceza infaz kurumlarına girenler duyarlı kapıdan geçmek zorundadır. Bu kişilerin üstleri metal dedektörle aranır; eşyaları x-ray cihazından veya benzeri güvenlik sistemlerinden geçirilir, ayrıca şüphe hâlinde elle aranır. Bu cihazların bulunmadığı yerlerde arama ve kontrol elle yapılır. Ancak milletvekilleri, mülkî amirler, hâkim, Cumhuriyet savcıları ve bu sınıftan sayılanlar, avukatlar, noterler, ceza infaz kurumları ve tutukevleri kontrolörleri, izleme kurulu başkan ve üyeleri, uluslararası sözleşmelerle yetkileri tanınmış kişi ve kuruluşların temsilcileri, ceza infaz kurumu ve tutukevi koruma birlik komutanı ile kurum müdürünün üstleri ağır cezayı gerektiren suçüstü hâlleri dışında elle aranamaz. Duyarlı kapı cihazının ikazının sürmesi hâlinde bu kişiler ancak, elle aramayı kabul ettikleri takdirde kuruma girebilirler. Ziyaret yerleri de ziyaret öncesi ve bitiminde aranır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Ceza infaz kurumlarına giren avukatlarca savunmaya ilişkin olduğu yazılı olarak beyan edilen belge ve dosyalar incelemeye tâbi tutulmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Konusu suç teşkil etmemekle birlikte ceza infaz kurumlarına sokulması yasak olan her türlü eşya, çıkışta sahibine verilmek üzere idare tarafından muhafaza altına alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Hükümlüler, odalarından çıkış ve dönüşlerinde ayrı yerlerde ve farklı memurlarca üst ve eşya aramasına tâbi tutulurlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Aramalarda insan onuruna saygı esastır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Ziyaret ve görüşlerde kurallara uymayan heyet ve kişilerin ziyaret ve görüşmeleri sürdürmelerine derhâl son verilir. Suç oluşturan davranışlar, ilgili idarî ve adlî makamlara bildirilir. Görüşme hakkına sahip özel kişilerin kurum güvenliğinin korunması amacıyla alınan tedbirlere aykırı davranışları ve istekleri nedeniyle görüşme hakları, kurumun en üst amirince bir aydan bir yıla kadar kısıtlanabilir. Mevzuatın avukatlar bakımından getirdiği hükümler saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="5-BEŞİNCİ" başlık="Beden Eğitimi ve Boş Zaman Etkinlikleri">
        <mvz-madde no="87" başlık="Beden eğitimi">
          <mvz-fıkra no="1">
            <template>Hükümlünün toplumsal, ruhsal ve bedensel gelişmelerini sağlamak amacıyla fizik ve ruhsal sağlık durumlarının elverdiği ölçüde spor, beden eğitimi ve eğlendirici etkinliklere katılmasına müsaade olunur ve olanaklar ölçüsünde yer ve araç sağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Açık havada çalışmayan veya kapalı ceza infaz kurumlarında bulunan hükümlüye, hava koşulları elverdiği ölçüde, günde en az bir saat açık havada gezinmek olanağı verilir. Bu süre içerisinde bireysel spor da yapılabilir. Kurum dışındaki etkinliklere açık ceza infaz kurumları ile çocuk eğitimevlerinde bulunan hükümlüler katılabilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="88" başlık="Kütüphane ve kurslardan yararlanma">
          <mvz-fıkra no="1">
            <template>Hükümlü, çalışma saatleri dışında ve belirlenecek düzene göre idarece tertiplenen kurslara katılabilir ve kütüphaneden yararlanabilir. Bu konudaki programlar uzmanların önerileri ve hükümlünün istekleri dikkate alınarak kurum yönetimince belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="6-ALTINCI" başlık="Salıverilme İçin Hazırlama">
        <mvz-madde no="89" başlık="Hükümlülerin değerlendirilmesi ve iyi hâlin belirlenmesi">
          <mvz-fıkra no="1">
            <template>Hükümlüler, ceza infaz kurumlarında bulundukları tüm aşamalarda, ceza infaz kurumlarının düzen ve güvenliği amacıyla konulmuş kurallara uyup uymadığı, haklarını iyi niyetle kullanıp kullanmadığı, yükümlülüklerini eksiksiz yerine getirip getirmediği, uygulanan iyileştirme programlarına göre toplumla bütünleşmeye hazır olup olmadığı, tekrar suç işleme ve mağdura veya başkalarına zarar verme riskinin düşük olup olmadığı hususlarında idare ve gözlem kurulu tarafından iyi hâlin belirlenmesine esas olmak üzere en geç altı ayda bir değerlendirmeye tabi tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra uyarınca yapılacak değerlendirmede, infazın tüm aşamalarında hükümlülerin katıldığı iyileştirme ve eğitim-öğretim programları ile spor ve sosyal faaliyetler, kültür ve sanat programları, aldığı sertifikalar, kitap okuma alışkanlığı, diğer hükümlü ve tutuklular ile ceza infaz kurumu görevlileri ve dışarıyla olan ilişkileri, işlediği suçtan dolayı duyduğu pişmanlığı, ceza infaz kurumu kuralları ile kurum bünyesindeki çalışma kurallarına uyumu ve aldığı disiplin cezaları dikkate alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Toplam on yıl ve daha fazla hapis cezasına mahkûm olanlar ile terör suçları, örgüt kurmak, yönetmek veya örgüte üye olmak suçları, örgüt faaliyeti kapsamında işlenen suçlar, kasten öldürme suçları, cinsel dokunulmazlığa karşı işlenen suçlar ve uyuşturucu veya uyarıcı madde imal ve ticareti suçlarından mahkûm olanlar hakkında yapılacak açık ceza infaz kurumuna ayırmaya, denetimli serbestlik tedbiri uygulanarak cezanın infazına ve koşullu salıverilmeye ilişkin değerlendirmelerde idare ve gözlem kuruluna Cumhuriyet başsavcısı veya belirleyeceği bir Cumhuriyet savcısı başkanlık eder. Ayrıca, idare ve gözlem kuruluna Cumhuriyet başsavcısı tarafından belirlenen bir izleme kurulu üyesi ile Aile, Çalışma ve Sosyal Hizmetler Bakanlığı ve Sağlık Bakanlığı il veya ilçe müdürlükleri tarafından belirlenen birer uzman kişi katılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İdare ve gözlem kuruluna Aile, Çalışma ve Sosyal Hizmetler Bakanlığı ve Sağlık Bakanlığı ile izleme kurulundan katılan üyelere katıldıkları her bir toplantı günü için memur maaş katsayısının (500) rakamı ile çarpılması sonucu bulunacak miktarda huzur hakkı ödenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kanunlarda iyi hâlliliğin arandığı durumlarda, hükümlülerin tutum ve davranışlarının değerlendirilmesi bakımından bu madde hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Açık ceza infaz kurumuna ayırmaya, denetimli serbestlik tedbiri uygulanarak cezanın infazına ve koşullu salıverilmeye ilişkin olarak tutum ve davranışları olumsuz değerlendirilen hükümlülerin yeniden değerlendirilmeye tabi tutulma süreleri bir yılı geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>İdare ve gözlem kurulu tarafından yapılacak değerlendirmelere esas olacak ilkeler ve kurulun bu maddeye ilişkin çalışma usul ve esasları ile tutum ve davranışları olumsuz değerlendirilen hükümlülerin yeniden değerlendirilmeye tabi tutulma süreleri yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="90" başlık="Salıverilme öncesi için önlem ve ilişkiler">
          <mvz-fıkra no="1">
            <template>Hükümlünün salıverildikten sonraki geleceğini düzenlemeyi düşünmesini sağlayıcı tedbirler alınır ve toplumla uyumu ile ailesinin çıkarları için bu konularda hizmet veren resmî ve özel kuruluş veya kişilerle ilişki kurması doğrultusunda katkı ve yardımda bulunulur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="91" başlık="Hükümlüye iş bulmada yardım">
          <mvz-fıkra no="1">
            <template>Hükümlü, salıverildiğinde iş bulması veya kendi işini kurması yönünde özendirilir. Bu konuda gönüllü kişi ve kuruluşlar ile resmî kurumlarla işbirliği yapılır. Bu husustaki ayrıntılar Cumhurbaşkanınca çıkarılan yönetmelikte gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="7-YEDİNCİ" başlık="İzinler">
        <mvz-madde no="92" başlık="Kapalı ceza infaz kurumu dışına çıkma hâlleri">
          <mvz-fıkra no="1">
            <template>Hükümlü; izin, hastaneye, Cumhuriyet Başsavcılığına veya duruşmaya sevk, eğitim, öğretim, işyurdu, cezanın ertelenmesi, salıverilme, nakil, deprem, sel gibi doğal afet ve yangın hâlleri dışında ve yetkili makamca verilmiş yazılı bir emir olmadıkça kapalı kurumun dışına çıkarılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Terör ve örgüt faaliyeti çerçevesinde işlenen suçlarla ilgili olarak alınan bilgilerin doğruluğunun araştırılması bakımından zorunlu görülen hâllerde, hükümlü veya tutuklular, rızaları alınmak koşuluyla, ilgili makamın ve Cumhuriyet Başsavcılığının talebi üzerine sulh ceza hâkimi kararı ile geçici sürelerle ceza infaz kurumundan alınabilirler. Bu süreler, hükümlü veya tutuklu dinlendikten sonra işin niteliğine göre, her defasında dört günü ve hiçbir surette onbeş günü geçmemek üzere hâkim tarafından tayin olunur ve hükümlülük ve tutuklulukta geçmiş sayılır. Ceza infaz kurumundan ayrılış ve dönüşlerinde hükümlü veya tutuklunun sağlık durumu doktor raporu ile tespit edilir. Yer gösterme sırasında yapılan işlemlere ilişkin belgelerin bir örneği ilgilinin dosyasında muhafaza edilmek üzere Cumhuriyet Başsavcılığına gönderilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="93" başlık="İzinler">
          <mvz-fıkra no="1">
            <template>Yüksek güvenlikli ceza infaz kurumlarında bulunanlar dışındaki hükümlülere mazeret izni, özel izin veya iş arama izni verilebilir. İzinde geçen süreler hükümlülükte geçmiş sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İzinlerin kullandırılması ile ilgili ayrıntılar Cumhurbaşkanınca çıkarılan yönetmelikte gösterilir.32</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="94" başlık="Mazeret izni">
          <mvz-fıkra no="1">
            <template>Hükümlülük süresinin onda birini iyi hâlle geçirmiş olanlara hükümlünün isteği ile;</template>
            <mvz-bent no="a">
              <template>Ana, baba, eş, kardeş veya çocuğunun ölümü nedeniyle ceza infaz kurumu en üst amirinin önerisi ve Cumhuriyet Başsavcılığının onayı ile,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Yukarıdaki bentte sayılan yakınlarından birisinin yaşamsal tehlike oluşturacak önemli ve ağır hastalık hâllerinin veya deprem, su baskını, yangın gibi felâketler nedeniyle zarara uğradıklarının belgelendirilmesi koşuluyla kurum en üst amirinin görüşü, Cumhuriyet Başsavcılığının önerisi ve Adalet Bakanlığının onayı ile,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Yol dışında on güne kadar mazeret izni verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu Kanunun 25 inci maddesi kapsamına girenler hariç, yüksek güvenlikli ceza infaz kurumunda bulunanlar da dâhil olmak üzere, güvenlik bakımından sakınca oluşturmaması koşuluyla tehlikeli olmayan hükümlünün, dış güvenlik görevlisinin refakatinde bulunmak şartıyla, talebi ve Cumhuriyet Başsavcısının onayıyla;</template>
            <mvz-bent no="a">
              <template>İkinci derece dahil kan veya kayın hısımlarından birinin ya da eşinin ölümü nedeniyle cenazesine katılması için yol süresi dışında iki güne kadar,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Sağlık Kurulu raporu ile belgelendirilmesi şartıyla ana, baba, eş, kardeş, çocuk ile eşin anne veya babasından birinin yaşamsal tehlike oluşturacak önemli ve ağır hastalık hâllerinin bulunması nedeniyle bunlardan her biri için  toplam iki defaya mahsus olmak üzere hasta ziyareti amacıyla yol süresi dışında bir güne kadar,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>izin verilebilir.  Hükümlünün, izin süresi içinde gece konaklaması gerektiği takdirde, kendi evi veya (a) bendinde belirtilen bir yakınının evinde, güvenli görülen başka bir yerde ya da gidilen yerde bulunan kapalı ceza infaz kurumunda kalmasına, güvenlik hususu değerlendirilmek ve gerekli güvenlik tedbirleri alınmak suretiyle, gidilen yerin valisi tarafından karar verilir. Yurt dışına çıkmasını gerektirmesi durumunda hükümlüye, bu madde gereğince izin verilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="95" başlık="Özel izin">
          <mvz-fıkra no="1">
            <template>Açık ceza infaz kurumlarında bulunanlarla kapalı ceza infaz kurumunda olup da açık ceza infaz kurumlarına ayrılmaya hak kazananlara, aileleriyle bağlarını sürdürmelerini veya güçlendirmelerini ve dış dünyaya uyumlarını sağlamak amacıyla kurum en üst amirinin önerisi ve Cumhuriyet Başsavcılığının onayı ile üç ayda bir, yol hariç yedi güne kadar izin verilebilir.  Hastalık veya doğal afet gibi zorunlu hâllerde bu izinler birleştirilerek kullandırılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="96" başlık="İş arama izni">
          <mvz-fıkra no="1">
            <template>Ceza infaz kurumlarında hükümlülük sürelerinin en az altı ayını kesintisiz geçirmiş ve koşullu salıverilmelerine bir ay kalmış hükümlülere olağan yaşantılarına döndüklerinde uyum sorunu ile karşılaşmamaları ve iş bulma olanakları sağlanmak üzere kurum en üst amirinin önerisi ve Cumhuriyet Başsavcılığının onayı ile çalışma günleri içinde sekiz saate kadar izin verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="97" başlık="İzinden dönmeme, geç dönme">
          <mvz-fıkra no="1">
            <template>İzinden dönmeyen veya iki günden fazla bir süre geçtikten sonra dönen hükümlüler hakkında Türk Ceza Kanununun 292 nci ve izleyen maddelerinde yazılı hükümler uygulanır.  Salgın hastalık, doğal afet, savaş veya seferberlik durumunda bu sebeplerden dolayı izinden dönemeyen veya geç dönen hükümlülere ceza verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İzin süresini iki gün veya daha az bir süre geçiren hükümlüler hakkında disiplin işlemi yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İzinden dönmeyen veya iki günden fazla bir süre geçtikten sonra dönen hükümlüler ile firar eden hükümlülere bir daha özel izin verilmez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="8-SEKİZİNCİ" başlık="İnfazla İlgili Kararlar">
        <mvz-madde no="98" başlık="Mahkûmiyet hükmünün yorumunda veya çektirilecek cezanın hesabında duraksama">
          <mvz-fıkra no="1">
            <template></template>
            <mvz-bent no="a">
              <template>Mahkûmiyet hükmünün yorumunda duraksama olursa veya sonradan yürürlüğe giren kanun hükmünün Türk Ceza Kanununun 7 nci maddesi kapsamında değerlendirilmesi gerekirse, hükmü veren mahkemeden,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Çektirilecek cezanın hesabında duraksama olursa ya da cezanın kısmen veya tamamen yerine getirilip getirilemeyeceği ileri sürülürse, infaz hâkimliğinden,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>duraksamanın giderilmesi veya yerine getirilecek cezanın belirlenmesi için karar istenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra uyarınca yapılan başvurular cezanın infazını ertelemez. Ancak, mahkeme veya infaz hâkimliği olayın özelliğine göre infazın ertelenmesine veya durdurulmasına karar verebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="99" başlık="Birden fazla hükümdeki cezaların toplanması">
          <mvz-fıkra no="1">
            <template>Bir kişi hakkında hükmolunan herbir ceza diğerinden bağımsızdır, varlıklarını ayrı ayrı korurlar. Ancak, bir kişi hakkında başka başka kesinleşmiş hükümler bulunur ise, 107 nci maddenin uygulanabilmesi yönünden infaz hâkimliğinden bir toplama kararı istenir.  Adli para cezasından çevrilen ve ceza infaz kurumunda infaz edilme aşamasına gelen hapis cezaları da toplama kararına dahil edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="100" başlık="Hastanede geçen sürenin cezadan indirilmesi">
          <mvz-fıkra no="1">
            <template>Cezanın infazına başlandıktan sonra hastalık nedeniyle hükümlünün ceza infaz kurumundan hastaneye kaldırılması hâlinde burada geçirdiği süre, cezadan indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ancak, cezanın infazını durdurmak için hükümlü, hastalığına kasten neden olmuşsa bu hükümden yararlanamaz. Bu hâlde Cumhuriyet savcısı infaz hâkimliğinden bir karar verilmesini ister.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="101" başlık="İnfaz sırasında verilecek kararların mercii ve usulü">
          <mvz-fıkra no="1">
            <template>Cezanın infazı sırasında, 98 ilâ 100 üncü maddeler gereğince mahkemeden veya infaz hâkimliğinden alınması gereken kararlar duruşma yapılmaksızın verilir. Karar verilmeden önce Cumhuriyet savcısı ve hükümlünün görüşlerini yazılı olarak bildirmeleri istenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>99 uncu madde gereğince cezaların toplanması gerektiğinde bu hususta hüküm verme yetkisi, en fazla cezaya hükmetmiş bulunan mahkemenin bulunduğu yer infaz hâkimliğine, bu durumda birden çok infaz hâkimliği yetkili ise son hükmü vermiş olan mahkemenin bulunduğu yer infaz hâkimliğine aittir. En fazla cezanın;</template>
            <mvz-bent no="a">
              <template>Yargıtay tarafından ilk derece mahkemesi sıfatıyla verilmesi hâlinde Ankara infaz hâkimliğince,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bölge adliye mahkemesi tarafından ilk derece mahkemesi sıfatıyla verilmesi hâlinde bölge adliye mahkemesinin bulunduğu il infaz hâkimliğince,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bölge adliye mahkemesi tarafından duruşma açmak suretiyle verilmesi hâlinde ise hükmü kaldırılan ilk derece mahkemesinin bulunduğu yer infaz hâkimliğince,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>bu hususta karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu madde uyarınca verilen kararlara karşı itiraz yoluna gidilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="5-BEŞİNCİ" başlık="Salıverilme Öncesi ve Sonrası Hükümlüye ve Eski Hükümlüye Yardım">
      <mvz-bölüm no="1-BİRİNCİ" başlık="İnfaz Kurumuna Dış Yardımlar ve Hükümlüler Arası Yardımlaşmalar">
        <mvz-madde no="102" başlık="İnfaz kurumuna dış yardımlar">
          <mvz-fıkra no="1">
            <template>Hükümlülerin ceza infaz kurumlarından salıverilmelerinden önce veya salıverilmelerinden sonra kişisel zorluklarını aşmalarını, iyileştirilmelerini ve dışarıdaki yaşama uyumlarını sağlamak amacıyla ilgili bakanlıklar, kamu kurum ve kuruluşları ile kamu tüzel kişileri görev alanlarına giren konularda gerekli desteği ve hizmeti vermekle yükümlüdürler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu konuda gönüllü kişi, kurum ve kuruluşlardan yardım alınabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu yükümlülük ve yardımların yöntem ve esasları Cumhurbaşkanınca çıkarılan yönetmelikte belirlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="103" başlık="Hükümlüler arası yardımlaşma">
          <mvz-fıkra no="1">
            <template>Meslek ve sanatlarında becerili olan hükümlüler, çalışma yeteneğine sahip ve istekli diğer hükümlülere, yönetimle işbirliği yaparak ceza infaz kurumunda ve salıverilmelerinden sonraki yaşamlarında iş, meslek veya sanat öğrenmelerini sağlamak amacıyla katkıda bulunabilirler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Denetimli Serbestlik ve Yardım Merkezi ile Koruma Kurulları">
        <mvz-madde no="104" başlık="Denetimli serbestlik ve yardım merkezleri ile koruma kurulları">
          <mvz-fıkra no="1">
            <template>Cezaları ertelenen, salıverilen veya haklarında hapis cezası dışında herhangi bir tedbire hükmedilen hükümlülerin toplum içinde izlenmesi, iyileştirilmesi, psiko-sosyal problemlerinin çözülmesi, salıverme sonrası korunması ve yargılanan kişiler hakkında sosyal araştırma raporlarının düzenlenmesi ve mağdurun korunması gibi görevleri yerine getirmek üzere denetimli serbestlik ve yardım merkezleri kurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Salıverilme sonrasında hükümlülere iş sağlanması için koruma kurulları kurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Denetimli serbestlik ve yardım merkezleri ile koruma kurullarının kuruluşu, çalışma yöntem ve esasları, ilgili kanununda düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="2-İKİNCİ" başlık="Diğer Cezalar, Tedbirler, Koşullu Salıverilme ve Tutukluluk">
    <mvz-kısım no="1-BİRİNCİ" başlık="Diğer Cezalar">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Kamuya Yararlı Bir İşte Çalıştırma ve Adlî Para Cezalarının İnfazı">
        <mvz-madde no="105" başlık="Kamuya yararlı bir işte çalıştırma">
          <mvz-fıkra no="1">
            <template>Türk Ceza Kanununun 50 nci maddesinin birinci fıkrasının (f) bendinde yer alan kısa süreli hapis cezasının yaptırım seçeneklerinden kamuya yararlı bir işte çalıştırma; hükümlünün, ücretsiz olarak iki saat çalışması karşılığı bir gün olmak üzere bir kamu kurumunun veya kamu yararına hizmet veren bir özel kuruluşun belirli hizmetlerinde çalıştırılmasıdır.  Günlük çalışma süresi, en az iki saat ve en fazla sekiz saat olacak şekilde denetimli serbestlik müdürlüğünce belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Denetimli serbestlik müdürlükleri, bölgelerinde bulunan bu tür kurumlardan hükümlüleri ne suretle çalıştırabileceklerine dair bilgi alırlar ve hizmetler listesini oluştururlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="4" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="5" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="105/A" başlık="Denetimli serbestlik tedbiri uygulanarak cezanın infazı">
          <mvz-fıkra no="1">
            <template>Hükümlülerin dış dünyaya uyumlarını sağlamak, aileleriyle bağlarını sürdürmelerini ve güçlendirmelerini temin etmek amacıyla, açık ceza infaz kurumunda veya çocuk eğitimevinde bulunan ve koşullu salıverilmesine bir yıl veya daha az süre kalan iyi hâlli hükümlülerin talebi hâlinde, cezalarının koşullu salıverilme tarihine kadar olan kısmının denetimli serbestlik tedbiri uygulanmak suretiyle infazına, ceza infaz kurumu idaresince hazırlanan değerlendirme raporu dikkate alınarak, hükmün infazına ilişkin işlemleri yapan Cumhuriyet başsavcılığının bulunduğu yer infaz hâkimi tarafından karar verilebilir.  Hükümlünün bu infaz usulünden yararlanabilmesi için beş günden az olmamak üzere koşullu salıverilme tarihine kadar ceza infaz kurumunda geçirmesi gereken sürenin en az onda birini ceza infaz kurumunda geçirmiş olması gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Açık ceza infaz kurumuna ayrılma şartları oluşmasına karşın, iradesi dışındaki bir nedenle açık ceza infaz kurumuna ayrılamayan veya bu nedenle kapalı ceza infaz kurumuna geri gönderilen iyi hâlli hükümlüler, diğer şartları da taşımaları hâlinde, birinci fıkrada düzenlenen infaz usulünden yararlanabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıdaki fıkralarda düzenlenen infaz usulünden;</template>
            <mvz-bent no="a">
              <template>Sıfır-altı yaş grubunda çocuğu bulunan ve koşullu salıverilmesine iki yıl veya daha az süre kalan kadın hükümlüler,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Maruz kaldıkları ağır bir hastalık, engellilik veya kocama nedeniyle hayatlarını yalnız idame ettiremeyen ve koşullu salıverilmesine üç yıl veya daha az süre kalan hükümlüler,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>diğer şartları da taşımaları hâlinde yararlanabilirler. Ağır hastalık, engellilik veya kocama hâli, Adlî Tıp Kurumundan alınan veya Adalet Bakanlığınca belirlenen tam teşekküllü hastanelerin sağlık kurullarınca düzenlenip Adlî Tıp Kurumunca onaylanan bir raporla belgelendirilmelidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Adli para cezasının ödenmemesi nedeniyle, cezası hapse çevrilen hükümlüler yukarıdaki fıkralardaki infaz usulünden yararlanamazlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Denetimli serbestlik tedbiri uygulanmak suretiyle cezasının infazına karar verilen hükümlünün, koşullu salıverilme tarihine kadar;</template>
            <mvz-bent no="a">
              <template>Kamuya yararlı bir işte ücretsiz olarak çalıştırılması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bir konut veya bölgede denetim ve gözetim altında bulundurulması,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Belirlenen yer veya bölgelere gitmemesi,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Belirlenen programlara katılması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>yükümlülüklerinden bir veya birden fazlasına tabi tutulmasına, denetimli serbestlik müdürlüğünce karar verilir. Hükümlünün risk ve ihtiyaçları dikkate alınarak yükümlülükleri değiştirilebilir.  Türk Ceza Kanununun 191 inci maddesinde yer alan kullanmak için uyuşturucu veya uyarıcı madde satın almak, kabul etmek veya bulundurmak ya da uyuşturucu veya uyarıcı madde kullanmak suçundan hükümlü olanlar ayrıca tedavi ve rehabilitasyon programlarına katılma yükümlülüğüne tabi tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Hükümlünün;</template>
            <mvz-bent no="a">
              <template>Ceza infaz kurumundan ayrıldıktan sonra, talebinde belirttiği denetimli serbestlik müdürlüğüne beş gün içinde müracaat etmemesi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hakkında belirlenen yükümlülüklere, denetimli serbestlik müdürlüğünün hazırladığı denetim ve iyileştirme programına, denetimli serbestlik görevlilerinin bu kapsamdaki uyarı ve önerileriyle hakkında hazırlanan denetim planına uymamakta ısrar etmesi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Ceza infaz kurumuna geri dönmek istemesi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
