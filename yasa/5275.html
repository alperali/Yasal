  <mvz-künye tür="kanun" no="5275" başlık="CEZA VE GÜVENLİK TEDBİRLERİNİN İNFAZI HAKKINDA KANUN"
             tarih="13/12/2004" rgazete-tarih="29/12/2004" rgazete-sayı="25685"
             düstur-tertip="5" düstur-cilt="44" />

  <mvz-kitap no="1-BİRİNCİ" başlık="Amaç ve Temel İlkeler, Hapis Cezası ve Güvenlik Tedbirleri">
    <mvz-kısım no="1-BİRİNCİ" başlık="Amaç ve Temel İlkeler">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Kanunun Amacı">
        <mvz-madde no="1" başlık="Amaç">
          <mvz-fıkra no="1">
            <template>Bu Kanunun amacı, ceza ve güvenlik tedbirlerinin infazına ilişkin usûl ve esasları düzenlemektir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Temel İlkeler">
        <mvz-madde no="2" başlık="İnfazda temel ilke">
          <mvz-fıkra no="1">
            <template>Ceza ve güvenlik tedbirlerinin infazına ilişkin kurallar hükümlülerin ırk, dil, din, mezhep, milliyet, renk, cinsiyet, doğum, felsefî inanç, millî veya sosyal köken ve siyasî veya diğer fikir yahut düşünceleri ile ekonomik güçleri ve diğer toplumsal konumları yönünden ayırım yapılmaksızın ve hiçbir kimseye ayrıcalık tanınmaksızın uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ceza ve güvenlik tedbirlerinin infazında zalimane, insanlık dışı, aşağılayıcı ve onur kırıcı davranışlarda bulunulamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="3" başlık="İnfazda temel amaç">
          <mvz-fıkra no="1">
            <template>Ceza ve güvenlik tedbirlerinin infazı ile ulaşılmak istenilen temel amaç, öncelikle genel ve özel önlemeyi sağlamak, bu maksatla hükümlünün yeniden suç işlemesini engelleyici etkenleri güçlendirmek, toplumu suça karşı korumak, hükümlünün; yeniden sosyalleşmesini teşvik etmek, üretken ve kanunlara, nizamlara ve toplumsal kurallara saygılı, sorumluluk taşıyan bir yaşam biçimine uyumunu kolaylaştırmaktır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="4" başlık="İnfazın koşulu">
          <mvz-fıkra no="1">
            <template>Mahkûmiyet hükümleri kesinleşmedikçe infaz olunamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="5" başlık="İnfazın dayanakları ve kimin tarafından izleneceği">
          <mvz-fıkra no="1">
            <template>Mahkeme, kesinleşen ve yerine getirilmesini onayladığı cezaya ilişkin hükmü Cumhuriyet Başsavcılığına gönderir. Bu hükme göre cezanın infazı Cumhuriyet savcısı tarafından izlenir ve denetlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Hapis Cezaları ve Güvenlik Tedbirleri">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Hapis Cezaları ve Güvenlik Tedbirlerinin İnfazında Gözetilecek İlkeler">
        <mvz-madde no="6" başlık="Hapis cezalarının infazında gözetilecek ilkeler">
          <mvz-fıkra no="1">
            <template>Hapis cezalarının infaz rejimi, aşağıda gösterilen temel ilkelere dayalı olarak düzenlenir:</template>
            <mvz-bent no="a">
              <template>Hükümlüler ceza infaz kurumlarında güvenli bir biçimde ve kaçmalarını önleyecek tedbirler alınarak düzen, güvenlik ve disiplin çerçevesinde tutulurlar.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ceza infaz kurumlarında hükümlülerin düzenli bir yaşam sürdürmeleri sağlanır. Hürriyeti bağlayıcı cezanın zorunlu kıldığı hürriyetten yoksunluk, insan onuruna saygının korunmasını sağlayan maddî ve manevî koşullar altında çektirilir. Hükümlülerin, Anayasada yer alan diğer hakları, infazın temel amaçları saklı kalmak üzere, bu Kanunda öngörülen kurallar uyarınca kısıtlanabilir.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Cezanın infazında hükümlünün iyileştirilmesi hususunda mümkün olan araç ve olanaklar kullanılır. Hükümlünün kanun  ve yönetmeliklerle tanınmış haklarının dokunulmazlığını sağlamak üzere cezanın infazında ve iyileştirme çabalarında kanunîlik ve hukuka uygunluk ilkeleri esas alınır.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>İyileştirmeye gereksinimleri olmadığı saptanan hükümlülere ilişkin infaz rejiminde, bu hükümlülerin kişilikleriyle orantılı bireyselleştirilmiş programlara yer verilmesine özen gösterilir ve bu hususlar yönetmeliklerde düzenlenir.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Cezanın infazında adalet esaslarına uygun hareket edilir. Bu maksatla ceza infaz kurumları kanun  ve yönetmeliklerin verdiği yetkilere dayanarak nitelikli elemanlarca denetlenir.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Ceza infaz kurumlarında hükümlülerin yaşam hakları ile beden ve ruh bütünlüklerini korumak üzere her türlü koruyucu tedbirin alınması zorunludur.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Hükümlünün infazın amacına uygun olarak kanun  ve yönetmeliklerin belirttiği hükümlere uyması zorunludur.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Kanunlarda gösterilen tutum, davranış ve eylemler ile kurum düzenini ihlâl edenler hakkında Kanunda belirtilen disiplin cezaları uygulanır. Cezalara, Kanunda belirtilen merciler, sürelerine uygun olarak hükmederler. Cezalara karşı savunma ve itirazlar da Kanunun gösterdiği mercilere yapılır.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="7" başlık="İyileştirmede başarı ölçütü">
          <mvz-fıkra no="1">
            <template>Hapis cezalarının infazında hükümlülerin iyileştirilmeleri amacını güden programların başarısı, elde ettikleri yeni tutum ve becerilerle orantılı olarak ölçülür. Bunun için iyileştirme çabalarına yönelik olarak hükümlünün istekli bulunması teşvik edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hapis cezasının, kendisinde var olan zararlı etki yapıcı niteliğini mümkün olduğu ölçüde azaltacak biçimde düzenlenecek programlar, usûller, araçlar ve zihniyet doğrultusunda yerine getirilmesi esasına uyulur. İyileştirme araçları hükümlünün sağlığını ve kişiliğine olan saygısını korumasını sağlayacak usûl ve esaslara göre uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Ceza İnfaz Kurumlarının Türleri">
        <mvz-madde no="8" başlık="Kapalı ceza infaz kurumları">
          <mvz-fıkra no="1">
            <template>Kapalı ceza infaz kurumları, iç ve dış güvenlik görevlileri bulunan, firara karşı teknik, mekanik, elektronik veya fizikî engellerle donatılmış, oda ve koridor kapıları kapalı tutulan, ancak mevzuatın belirttiği hâllerde aynı oda dışındaki hükümlüler arasında ve dış çevre ile temasın olanaklı bulunduğu, yeterli düzeyde güvenlik sağlanmış ve hükümlünün gereksinimine göre bireysel, grup hâlinde veya toplu olarak iyileştirme yöntemlerinin uygulanabileceği tesislerdir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="9" başlık="Yüksek güvenlikli kapalı ceza infaz kurumları">
          <mvz-fıkra no="1">
            <template>Yüksek güvenlikli kapalı ceza infaz kurumları, iç ve dış güvenlik görevlilerine sahip, firara karşı teknik, mekanik, elektronik ve fizikî engellerle donatılmış, oda ve koridor kapıları sürekli kapalı tutulan, ancak mevzuatın belirttiği hâllerde aynı oda dışındaki hükümlüler arasında ve dış çevre ile temasların geçerli olduğu sıkı güvenlik rejimine tâbi hükümlülerin bir veya üç kişilik odalarda barındırıldıkları tesislerdir. Bu kurumlarda bireysel veya grup hâlinde iyileştirme yöntemleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ağırlaştırılmış müebbet hapis cezasına mahkûm olanlar ile süresine bakılmaksızın, suç işlemek amacıyla örgüt kurmak, yönetmek veya bu örgütün faaliyeti çerçevesinde, Türk Ceza Kanununda yer alan;</template>
            <mvz-bent no="a">
              <template>İnsanlığa karşı suçlardan (madde 77, 78),</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kasten öldürme suçlarından (madde 81, 82),</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Uyuşturucu veya uyarıcı madde imal ve ticareti suçundan (madde 188),</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Devletin güvenliğine karşı suçlardan (madde 302, 303, 304, 307, 308),</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Anayasal düzene ve bu düzenin işleyişine karşı suçlardan (madde 309, 310, 311, 312, 313, 314, 315),</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Mahkûm olanların cezaları, bu kurumlarda infaz edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Eylem ve tutumları nedeniyle tehlikeli hâlde bulunan ve özel gözetim ve denetim altında bulundurulmaları gerekli olduğu saptananlar ile bulundukları kurumlarda düzen ve disiplini bozanlar veya iyileştirme tedbir, araç ve usûllerine ısrarla karşı koyanlar bu kurumlara gönderilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birinci fıkrada tanımı yapılan kurumların ihtiyacı karşılama bakımından yetersiz olması hâlinde, diğer kapalı ceza infaz kurumlarının yüksek güvenlikli bölümleri kullanılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Müebbet hapis cezasına hükümlülerden, 107 nci maddede belirtilen koşullu salıverilme süresinin üçte ikisini, süreli hapis cezasına hükümlülerden toplam cezalarının üçte birini, üçüncü fıkrada belirtilen hükümlülerden geriye kalan toplam cezalarının üçte birini bu kurumlarda geçirerek iyi hâl gösterenlerin, tutum ve kişiliklerine uygun diğer ceza infaz kurumlarına gönderilmelerine karar verilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="10" başlık="Kadın kapalı ceza infaz kurumları">
          <mvz-fıkra no="1">
            <template>Kadın kapalı ceza infaz kurumları, kadın hükümlülerin hapis cezalarının infaz edildiği Kanunun 8 ve 9 uncu maddelerine göre kurulmuş kurumlardır. Bu kurumlarda iç güvenlik görevlileri kadınlardan oluşturulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu maksatla kurulmuş kurumların ihtiyacı karşılama bakımından yetersiz olması hâlinde, kadın hükümlülerin hapis cezaları diğer kurumların, erkek hükümlülerin kaldığı bölümlerle bağlantısı olmayan bölümlerinde infaz edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="11" başlık="Çocuk kapalı ceza infaz kurumları">
          <mvz-fıkra no="1">
            <template>Çocuk tutukluların ya da çocuk eğitimevlerinden disiplin veya diğer nedenlerle kapalı ceza infaz kurumlarına nakillerine karar verilen çocukların barındırıldıkları ve firara karşı engelleri olan iç ve dış güvenlik görevlileri bulunan, eğitim ve öğretime dayalı kurumlardır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Oniki-onsekiz yaş grubu çocuklar, cinsiyetleri ve fizikî gelişim durumları göz önüne alınarak bu kurumların ayrı ayrı bölümlerinde barındırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu hükümlüler, kendilerine özgü kurumun bulunmadığı hâllerde kapalı ceza infaz kurumlarının çocuklara ayrılan bölümlerine yerleştirilirler. Kurumlarda ayrı bölümlerin bulunmaması hâlinde, kız çocukları kadın kapalı ceza infaz kurumlarının bir bölümünde veya diğer kapalı ceza infaz kurumlarının kendilerine ayrılan bölümlerinde barındırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu kurumlarda çocuklara eğitim ve öğretim verilmesi ilkesine tam olarak uyulur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="12" başlık="Gençlik kapalı ceza infaz kurumları">
          <mvz-fıkra no="1">
            <template>Gençlik kapalı ceza infaz kurumları, cezanın infazına başlandığı tarihte onsekiz yaşını bitirmiş olup da yirmibir yaşını doldurmamış genç hükümlülerin cezalarını çektikleri, eğitim ve öğretim esasına dayalı, firara karşı engelleri olan, iç ve dış güvenlik görevlileri bulunan kurumlardır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu hükümlüler için ayrı bir kurum kurulamadığı takdirde, yukarıdaki fıkra kapsamındaki hükümlüler, diğer kapalı ceza infaz kurumlarının gençlere ayrılan bölümlerinde bu maddedeki esaslara göre barındırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>9 uncu madde kapsamındaki gençlerin cezaları, gençlik kapalı ceza infaz kurumlarının güvenlikli bölümlerinde yerine getirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="13" başlık="Gözlem ve sınıflandırma merkezleri">
          <mvz-fıkra no="1">
            <template>Hükümlülerin durumlarına uygun kurumlara ayrımı, 23 üncü maddede belirtilen gözlem ve sınıflandırma merkezlerince yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gözlem ve sınıflandırma merkezlerinin kuruluş, görev, çalışma esas ve usûlleri yönetmelikte gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="14" başlık="Açık ceza infaz kurumları">
          <mvz-fıkra no="1">
            <template>Açık ceza infaz kurumları, hükümlülerin iyileştirilmelerinde, çalıştırılmaları ve meslek edindirilmelerine öncelik verilen, firara karşı engelleri ve dış güvenlik görevlisi bulunmayan, güvenlik bakımından kurum görevlilerinin gözetim ve denetimi ile yetinilen kurumlardır. Açık ceza infaz kurumları ihtiyaca göre ayrıca;</template>
            <mvz-bent no="a">
              <template>Kadın açık ceza infaz kurumları,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Gençlik açık ceza infaz kurumları,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Şeklinde kurulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aşağıdaki hâllerde hükümlüler hakkında verilen cezalar doğrudan açık ceza infaz kurumlarında yerine getirilir:</template>
            <mvz-bent no="a">
              <template>Terör suçları, örgüt kurmak, yönetmek veya örgüte üye olmak suçları ile örgüt faaliyeti kapsamında işlenen suçlar ve cinsel dokunulmazlığa karşı işlenen suçlardan mahkûm olanlar ile ikinci defa mükerrir olanlar ve koşullu salıverilme kararının geri alınması nedeniyle cezası aynen infaz edilenler hariç olmak üzere, kasıtlı suçlardan toplam üç yıl veya daha az hapis cezasına mahkûm olanlar.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Taksirli suçlardan toplam beş yıl veya daha az süreyle hapis cezasına mahkûm olanlar.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Adlî para cezası infaz sürecinde hapis cezasına çevrilenler.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanunu gereğince tazyik hapsine tabi tutulanlar.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hükümlülerin kapalı ceza infaz kurumundan açık ceza infaz kurumuna ayrılmalarına 89 uncu madde uyarınca yapılan değerlendirme sonucunda karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Toplam on yıl ve daha fazla hapis cezasına mahkûm olanlar ile terör suçları, örgüt kurmak, yönetmek veya örgüte üye olmak suçları, örgüt faaliyeti kapsamında işlenen suçlar, kasten öldürme suçları, cinsel dokunulmazlığa karşı işlenen suçlar ve uyuşturucu veya uyarıcı madde imal ve ticareti suçlarından mahkûm olanların kapalı ceza infaz kurumundan açık ceza infaz kurumuna ayrılmalarına ilişkin idare ve gözlem kurulu kararları, infaz hâkiminin onayından sonra uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Doğrudan açık ceza infaz kurumuna alınanlar dahil olmak üzere bu kurumlarda bulunan hükümlülerden;</template>
            <mvz-bent no="a">
              <template>Firar edenler veya başka bir fiilden dolayı haklarında tutuklama kararı verilenler idare ve gözlem kurulu kararıyla,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kınamadan başka bir disiplin cezası alıp, bu cezası kesinleşmiş olanlar veya asayiş ve düzenin sağlanması amacıyla disiplin cezası kesinleşmemiş olsa bile eylemi kurum düzeni ya da kişi güvenliği bakımından tehlike oluşturanlar idare ve gözlem kurulu kararıyla,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Açık ceza infaz kurumu şartlarına veya çalışma koşullarına uyum sağlayamayacakları saptananlar idare ve gözlem kurulunun kararı ve infaz hâkiminin onayıyla,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>kapalı ceza infaz kurumlarına gönderilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Hükümlülerin, suç ve ceza türlerine göre, açık ceza infaz kurumlarına ayrılıp ayrılmamalarına, açık ceza infaz kurumlarında geçirecekleri sürelere, kapalı ceza infaz kurumlarına gönderilmelerine, doğrudan açık ceza infaz kurumlarına alınmalarına, doğrudan açık ceza infaz kurumlarına alınanların kapalı ceza infaz kurumlarına gönderilmelerine ve diğer hususlara ilişkin usul ve esaslar yönetmelikte gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="15" başlık="Çocuk eğitimevleri">
          <mvz-fıkra no="1">
            <template>Çocuk eğitimevleri; çocuk hükümlüler hakkında verilen cezaların, hükümlülerin eğitilmeleri, meslek edinmeleri ve yeniden toplumla bütünleştirilmeleri amaçları güdülerek yerine getirildiği tesislerdir. Bu kurumlarda firara karşı engel bulundurulmaz; kurum güvenliği iç güvenlik görevlilerinin gözetim ve sorumluluğunda sağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kurum içinde veya dışında herhangi bir eğitim ve öğretim programına devam eden ve onsekiz yaşını dolduran çocukların, eğitim ve öğretimlerini tamamlayabilmeleri bakımından yirmibir yaşını bitirinceye kadar bu tesislerde kalmalarına izin verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Haklarında tutuklama kararı bulunanlar ile 11 inci madde kapsamına girenler hariç olmak üzere, bu tesislerde bulunan çocuk hükümlüler kapalı ceza infaz kurumlarına gönderilmezler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Cezanın İnfazının Ertelenmesi">
        <mvz-madde no="16" başlık="Hapis cezasının infazının hastalık nedeni ile ertelenmesi">
          <mvz-fıkra no="1">
            <template>Akıl hastalığına tutulan hükümlünün cezasının infazı geriye bırakılır ve hükümlü, iyileşinceye kadar Türk Ceza Kanununun 57 nci maddesinde belirtilen sağlık kurumunda koruma ve tedavi altına alınır. Sağlık kurumunda geçen süreler cezaevinde geçmiş sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Diğer hastalıklarda cezanın infazına, resmî sağlık kuruluşlarının mahkûmlara ayrılan bölümlerinde devam olunur. Ancak bu durumda bile hapis cezasının infazı, mahkûmun hayatı için kesin bir tehlike teşkil ediyorsa mahkûmun cezasının infazı iyileşinceye kadar geri bırakılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıdaki fıkralarda belirtilen geri bırakma kararı, Adlî Tıp Kurumunca düzenlenen ya da Adalet Bakanlığınca belirlenen tam teşekküllü hastanelerin sağlık kurullarınca düzenlenip Adlî Tıp Kurumunca onaylanan rapor üzerine, infazın yapıldığı yer Cumhuriyet Başsavcılığınca verilir. Geri bırakma kararı, mahkûmun tâbi olacağı yükümlülükler belirtilmek suretiyle kendisine ve yasal temsilcisine tebliğ edilir. Mahkûmun geri bırakma süresi içinde bulunacağı yer, kendisi veya yasal temsilcisi tarafından ilgili Cumhuriyet Başsavcılığına bildirilir. Mahkûmun sağlık durumu, geri bırakma kararını veren Cumhuriyet Başsavcılığınca veya onun istemi üzerine, bulunduğu veya tedavisinin yapıldığı yer Cumhuriyet Başsavcılığınca, sağlık raporunda belirtilen sürelere, bir süre bulunmadığı takdirde birer yıllık dönemlere göre bu fıkrada yazılı usule uygun olarak incelettirilir. İnceleme sonuçlarına göre geri bırakma kararını veren Cumhuriyet Başsavcılığınca, geri bırakmanın devam edip etmeyeceğine karar verilir. Geri bırakma kararını veren Cumhuriyet Başsavcılığının istemi üzerine, mahkûmun izlenmesine yönelik tedbirler, bildirimin yapıldığı yerde bulunan kolluk makam ve memurlarınca yerine getirilir. Bu fıkrada yazılı yükümlülüklere aykırı hareket edilmesi hâlinde geri bırakma kararı, kararı veren Cumhuriyet Başsavcılığınca kaldırılır. Bu karara karşı infaz hâkimliğine başvurulabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hapis cezasının infazı, gebe olan veya doğurduğu tarihten itibaren bir yıl altı ay geçmemiş bulunan kadınlar hakkında geri bırakılır. Çocuk ölmüş veya anasından başka birine verilmiş olursa, doğumdan itibaren iki ay geçince ceza infaz olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kapalı ceza infaz kurumuna girdikten sonra gebe kalanlardan koşullu salıverilmesine altı yıldan fazla süre kalanlar ile eylem ve tutumları nedeniyle tehlikeli sayılanlar hakkında dördüncü fıkra hükümleri uygulanmaz. Bu kişilerin cezasının dördüncü fıkrada öngörülen kısmı, ceza infaz kurumlarında kendileri için düzenlenen uygun yerlerde infaz olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Maruz kaldığı ağır bir hastalık veya engellilik nedeniyle ceza infaz kurumu koşullarında hayatını yalnız idame ettiremeyen ve toplum güvenliği bakımından ağır ve somut tehlike oluşturmayacağı değerlendirilen mahkûmun cezasının infazı üçüncü fıkrada belirlenen usule göre iyileşinceye kadar geri bırakılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="16/A" başlık="Çocuğunun hastalığı nedeniyle kadın hükümlünün cezasının infazının ertelenmesi">
          <mvz-fıkra no="1">
            <template>İnfazına başlanmış olsa bile, toplam on yıl veya daha az süreli hapis cezasına mahkûm olan veya adli para cezası infaz sürecinde hapis cezasına çevrilen kadın hükümlünün, engelliliği nedeniyle bakıma muhtaç olan veya ağır bir hastalığa maruz kalan on sekiz yaşını doldurmamış çocuğunun bulunması ve toplum güvenliği bakımından ağır ve somut tehlike oluşturmayacağının değerlendirilmesi hâlinde, cezasının infazı Cumhuriyet Başsavcılığınca bir yıla kadar ertelenebilir. Erteleme süresi her defasında altı ayı geçmemek üzere en çok dört kez uzatılabilir. Erteleme süresi içinde zamanaşımı işlemez. Çocuğun engellilik nedeniyle bakıma muhtaç olma veya ağır hastalık hâli, 16 ncı maddenin üçüncü fıkrasına göre belirlenir. Erteleme süresi içinde; hükümlünün ertelemenin amacına veya yükümlülüklere aykırı davrandığının denetimli serbestlik müdürlüğü veya kolluk birimlerince tespit edilmesi, hükümlü hakkında kasten işlenen bir suçtan dolayı kamu davası açılması veya çocuğun iyileşmesi hâlinde, erteleme kararı kaldırılarak ceza derhâl infaz olunur. Hükümlü, Cumhuriyet savcısı tarafından erteleme süresi içinde;</template>
            <mvz-bent no="a">
              <template>Belirli bir yerleşim bölgesini terk etmemek,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Belirlenen yerlere, belirtilen süreler içinde düzenli olarak başvurmak,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Ekonomik durumu göz önünde bulundurularak belirlenen güvence miktarını yatırmak,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>yükümlülüklerinden en az birine tâbi tutulur. Hükümlü hakkında ayrıca Cumhuriyet savcısı tarafından yurt dışına çıkamama yükümlülüğü konulur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="17" başlık="Hükümlünün istemiyle infazın ertelenmesi">
          <mvz-fıkra no="1">
            <template>Kasten işlenen suçlarda üç yıl, taksirle işlenen suçlarda ise beş yıl veya daha az süreli hapis cezalarının infazı, çağrı üzerine gelen hükümlünün istemi üzerine, Cumhuriyet Başsavcılığınca ertelenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Erteleme, her defasında bir yılı geçmemek üzere en fazla iki kez uygulanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Erteleme süresi içinde, hükümlü hakkında kasten işlenen bir suçtan dolayı kamu davası açılması hâlinde, erteleme kararı kaldırılarak ceza derhal infaz olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birinci fıkrada belirtilen hapis cezalarının infazına başlanmış olsa bile, hükümlünün yükseköğrenimini bitirebilmesi, ana, baba, eş veya çocuklarının ölümü veya bu kişilerin sürekli hastalık veya malullükleri nedeniyle ailenin ticari faaliyetlerinin yürütülebilmesinin veya tarım topraklarının işlenebilmesinin imkânsız hâle gelmesi veya hükümlünün eş veya çocuklarının sürekli hastalık veya malullükleri nedeniyle bakıma muhtaç olmaları ya da hükümlünün hastalığının sürekli bir tedaviyi gerektirmesi gibi zorunlu ve çok ivedi hâllerde, Cumhuriyet Başsavcılığınca bir yılı geçmeyen sürelerle hapis cezasının infazına ara verilebilir. Ancak bu ara verme iki defadan fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Erteleme isteminin kabulü, güvence gösterilmesine veya diğer bir şarta bağlanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu madde hükümleri;</template>
            <mvz-bent no="a">
              <template>Terör suçları, örgüt faaliyetleri çerçevesinde işlenen suçlar ve cinsel dokunulmazlığa karşı işlenen suçlardan mahkûm olanlar,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Mükerrirlere özgü infaz rejimi uygulanmasına karar verilenler,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Disiplin veya tazyik hapsine mahkûm olanlar,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>hakkında uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="17/A" başlık="Mahkemece infazın ertelenmesi veya durdurulması">
          <mvz-fıkra no="1">
            <template>Birlikte işlenmiş olup da 4/12/2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun 280 inci maddesinin üçüncü fıkrası ve 306 ncı maddesinin uygulanma olanağının bulunduğu hâllerde, hükmü veren ilk derece mahkemesinden infazın ertelenmesine veya durdurulmasına ilişkin karar verilmesi istenebilir. Karar verilmeden önce Cumhuriyet savcısı ve hükümlünün görüşlerini yazılı olarak bildirmesi istenebilir. Karar, duruşma açılmaksızın verilir ve bu karara karşı itiraz yoluna gidilebilir. Erteleme veya durdurma talebinin kabulü, güvence gösterilmesine veya diğer bir şarta bağlanabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="18" başlık="Akıl hastalığı dışında ruhsal rahatsızlığı olan hükümlülerin cezalarının infazı">
          <mvz-fıkra no="1">
            <template>Hapsedilme ve diğer nedenlerden kaynaklanan akıl hastalığı dışında ruhsal rahatsızlıkları bulunup da ruh ve sinir hastalıkları hastanelerinde tutulmaları gerekli görülmeyerek infaz kurumlarına geri gönderilenlerin cezaları, belirlenen infaz kurumlarının mahsus bölümlerinde infaz edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada belirtilenlerin cezalarının infazı için belirlenen infaz kurumlarının ihtiyaç duyduğu uzman ve diğer tıp görevlileri, Sağlık Bakanlığınca karşılanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="19" başlık="Yakalama emri">
          <mvz-fıkra no="1">
            <template>Hükümlü, hapis cezası veya güvenlik tedbirinin infazı için gönderilen çağrı kâğıdının tebliği üzerine on gün içinde gelmez, kaçar ya da kaçacağına dair şüphe uyandırırsa, Cumhuriyet savcısı yakalama emri çıkarır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kasten işlenen suçlarda üç yıl, taksirle işlenen suçlarda ise beş yıldan fazla hapis cezasının infazı için doğrudan yakalama emri çıkarılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Adlî para cezasından çevrilen hapsin infazında hükümlüye öncelikle çağrı kâğıdı gönderilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hakkında yakalama emri çıkarılan hükümlünün yakalanabilmesi amacıyla gerektiğinde konutta, işyerinde ve kamuya açık olmayan kapalı alanlarda arama yapılabilmesi bakımından Ceza Muhakemesi Kanununun 119 uncu maddesi hükümleri uygulanır. Hâkim tarafından verilecek arama kararları sulh ceza hâkimi tarafından verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Hükümlülerin Ceza İnfaz Kurumlarına Kabul İşlemleri">
        <mvz-madde no="20" başlık="Cumhuriyet Başsavcılığınca yapılacak işlemler">
          <mvz-fıkra no="1">
            <template>Hapis cezasını içeren kesinleşmiş mahkûmiyet kararları, mahkemece, hangi hükümlü ve hangi cezanın infazına ilişkin olduğu açıkça belirtilmek suretiyle Cumhuriyet Başsavcılığına verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhuriyet Başsavcılığınca infaz defterine kaydedilen ilâmdaki cezanın süresi gözetilerek hükümlü hakkında çağrı kâğıdı veya yakalama emri çıkarılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Çağrı kâğıdı, hükümde gösterilen adrese tebliğ edilir. Hükümlü, adres değişikliklerini mahkemeye veya Cumhuriyet Başsavcılığına bildirmekle yükümlüdür. Aksi hâlde hükümde gösterilen adreste yapılan tebligat geçerlidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hükümlüye, Cumhuriyet Başsavcılığınca düzenlenen ceza infaz kurumuna alındığı ve salıverileceği tarih ile ceza süresini ve cezanın hangi hükme ilişkin bulunduğunu belirten bir belge verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="21" başlık="Kuruma alınma ve kayıt işlemleri">
          <mvz-fıkra no="1">
            <template>Haklarında kesinleşmiş hapis cezasını içeren mahkûmiyet ve ödenmeyen adlî para cezalarının hapse çevrilmesine ilişkin karar bulunanlar, Cumhuriyet Başsavcılığının yazılı emriyle ceza infaz kurumuna gönderilirler. Üstleri ve eşyaları arandıktan sonra kabul odalarına konulur ve hekim muayenesinden sonra kuruma yerleştirme işlemleri yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ceza infaz kurumuna alınan hükümlülerin adı ve soyadı, işledikleri suç, cezalarının türü ve süresi, mahkûmiyet ilâmının tarih ve numarası ve infaza başlandığı gün "hükümlü defteri"ne kayıt olunur. Bu defterdeki sıra numarası, hükümlünün numarasını oluşturur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tanıya yönelik olarak hükümlülerin parmak ve avuç içi izleri alınır, fotoğrafları çekilir, kan grupları, vücutlarının dış özellikleri ve ölçüleri belirlenir. Kayıt altına alınan söz konusu bilgiler hükümlünün kişisel dosyasında veya elektronik ortamda saklanır. Bu bilgiler, Kanunun zorunlu kıldığı hâller dışında hiçbir kurum ve kişiye verilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="22" başlık="Hükümlüler ile yakınları ve ilgililerin bilgilendirilmesi">
          <mvz-fıkra no="1">
            <template>Hükümlülere, kuruma alındıklarında uygulanacak iyileştirme çalışmaları, disiplin suçları ve cezaları, bilgi edinme ve şikâyet yolları, hak ve sorumlulukları gibi konular ile kurumdaki yaşam biçimine uyum sağlamaları için gereken bilgiler, kurum yöneticileri tarafından sözlü olarak anlatılır ve yazılı olarak tebliğ olunur. İnfaz sonrası koruma ve yardım konusunda ayrıca bilgi verilir. Türkçe bilmeyen yabancı uyruklu hükümlülere kendi dilinde, mümkün olmadığında İngilizce, Fransızca veya Almanca olarak bildirilir. Duyma ve konuşma engellilere işaret diliyle anlatılır. Görme engellilere ise kendi alfabeleri ile yazılmış kitapçık verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlülerin ceza infaz kurumlarına alınmalarında, başka kuruma nakillerinde ve hastaneye yatırılmalarında, istekleri üzerine ailelerine veya gösterdikleri kişilere; hükümlü yabancı ise, yazılı olarak karşı çıkmaması hâlinde, uyruğu olduğu devletin diplomatik temsilcilik veya konsolosluğuna durum bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Askerlik çağına giren, hâlen silâh altında bulunan kişilerin ceza infaz kurumlarına alınmalarında, başka kuruma nakillerinde veya kurumda iken askerlik çağına girmeleri veya salıverilmeleri hâlinde durum, kayıtlı bulundukları askerlik şubesine bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hükümlülerin ölümü hâlinde de yukarıdaki hükümler uygulanır ve ayrıca durum ailelerine derhâl bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="5-BEŞİNCİ" başlık="Hükümlülerin Sınıflandırılması ve Cezaların İnfazı">
        <mvz-madde no="23" başlık="Hükümlülerin gözlem ve sınıflandırılması">
          <mvz-fıkra no="1">
            <template>Hükümlülerin gözlem ve sınıflandırılması aşağıdaki esaslara göre yapılır:</template>
            <mvz-bent no="a">
              <template>Hükümlülerin kişisel özellikleri, bedensel, aklî ve sağlık durumları, suç işlemeden önceki yaşamları, sosyal çevre ve ilişkileri, sanat ve meslek faaliyetleri, ahlâkî eğilimleri, suça bakış açıları, hükümlülük süreleri ve suç türleri belirlenerek, durumlarına uygun infaz kurumlarına ayrılmaları ve bunlara göre saptanacak infaz ve iyileştirme rejimi; gözlem, inceleme ve değerlendirme yöntemiyle çalışan gözlem ve sınıflandırma merkezlerinde veya kapalı ceza infaz kurumlarının bu hizmete ayrılan bölümlerinde yapılır. Hükümlüler, işledikleri suç tiplerine, gösterdikleri eğilimlere, tutum ve davranışları nedeniyle sıkı gözetim ve denetim altında bulundurulmaları gerekip gerekmediğine göre yüksek güvenlikli ceza infaz kurumlarına veya normal güvenlikli ceza infaz kurumlarına veya açık ceza infaz kurumlarına gönderilirler.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bu merkezlerde; mümkün olduğunca kriminoloji, penoloji, davranış bilimleri, adalet psikolojisi veya ceza hukuku alanında bilgi ve deneyime sahip yöneticiler, psikiyatri uzmanı, hekim, adlî tıp uzmanı, psikolog, pedagog, çocuk gelişimcisi, sosyal çalışmacı, psikolojik danışman, rehberlik uzmanı ve öğretmen gibi uzman görevliler ile diğer kurum görevlileri bulundurulur.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kadın, çocuk ve genç hükümlüler ile ilgili gözlem ve sınıflandırma, gerekli görülen yer veya bölgelerdeki ayrı gözlem ve sınıflandırma merkezlerinde veya bunların noksanlığı hâlinde kadın, çocuk ve kadın ve erkek gençlik kapalı ceza infaz kurumlarının bu hizmete ayrılan bölümlerinde yerine getirilir.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Hükümlülerin gözlemleri, gözlem kurulunca kuruma kabul tarihinden başlayarak tek kişilik odalarda yapılır. Ancak kurumun tek kişilik odası bulunmaması veya kısıtlı sayıda olması durumunda tahsis edilmiş özel bölümlerinde de yapılabilir.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Ağırlaştırılmış müebbet hapis ve müebbet hapis cezalarına veya iki yıldan fazla süreli hapis cezasına mahkûm olanlar, haklarında uygulanacak rejimi ve gönderilmeleri gereken infaz kurumunu ve bu maksatla kişisel ve sosyal özelliklerini belirlemek için Kanunda gösterilen esaslar uyarınca gözleme tâbi tutulurlar. Gözlem süresi altmış günü geçemez.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Hükümlü; kişiliğine, sair hâllerine, suçun işlenmesindeki özelliklere göre gerektiğinde gözleme tâbi tutulmayabilir.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Gözlem sonunda, gözlem merkezi hükümlüye ait dosyayı görüşü ile birlikte Adalet Bakanlığına gönderir. Gözlem sonucuna göre hükümlünün gönderileceği infaz kurumu Bakanlıkça belirlenir.  Ancak, yapılan gözlem ve sınıflandırma sonunda idare ve gözlem kurulunca aynı ceza infaz kurumunda veya o yer Cumhuriyet Başsavcılığına bağlı diğer ceza infaz kurumlarında kalması uygun bulunan hükümlülerin dosyaları Bakanlığa gönderilmez ve cezalarının infazına, bulundukları veya Cumhuriyet Başsavcılığınca gönderilecekleri bağlı ceza infaz kurumlarında devam olunur.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kısa süreli hapis cezaları, Kanunda gösterilen esaslara göre infaz olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="24" başlık="Hükümlülerin gruplandırılması">
          <mvz-fıkra no="1">
            <template>Hükümlüler;</template>
            <mvz-bent no="a">
              <template>İlk defa suç işleyenler, mükerrirler, itiyadî suçlular veya suç işlemeyi meslek edinenler,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Aklî ve bedensel durumları nedeniyle veya yaşları itibarıyla özel bir infaz rejimine tâbi tutulması gerekenler,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Tehlike hâli taşıyanlar,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Terör suçluları,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Suç örgütlerine veya çıkar amaçlı suç örgütlerine mensup olan suçlular,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>gibi gruplara ayrılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlüler ayrıca yaşları, hükümlülük süreleri ve suç türleri itibarıyla da gruplandırılırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="25" başlık="Ağırlaştırılmış müebbet hapis cezasının infazı">
          <mvz-fıkra no="1">
            <template>Ağırlaştırılmış müebbet hapis cezasının infazı rejimine ait esaslar aşağıda gösterilmiştir:</template>
            <mvz-bent no="a">
              <template>Hükümlü, tek kişilik odada barındırılır.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hükümlüye, günde bir saat açık havaya çıkma ve spor yapma hakkı tanınır.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Risk ve güvenlik gerekleri ile iyileştirme ve eğitim çalışmalarında gösterdiği gayret ve iyi hâle göre; hükümlünün, açık havaya çıkma ve spor yapma süresi uzatılabileceği gibi kendisi ile aynı ünitede kalan hükümlülerle temasta bulunmasına sınırlı olarak izin verilebilir.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Hükümlü, yaşadığı yerin olanak verdiği ve idare kurulunun uygun göreceği bir sanat veya meslek etkinliğini yürütebilir.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Hükümlü, kurum idare kurulunun uygun gördüğü hâllerde ve onbeş günde bir kez olmak üzere (f) bendinde gösterilen kişilere, süresi on dakikayı geçmemek üzere telefon edebilir.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Hükümlüyü; eşi, altsoy ve üstsoyu, kardeşleri ve vasisi, belirlenen gün, saat ve koşullar içerisinde onbeş günlük aralıklarla ve günde bir saati geçmemek üzere ziyaret edebilirler.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Hükümlü hiçbir suretle ceza infaz kurumu dışında çalıştırılamaz ve kendisine izin verilmez.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Hükümlü, kurum iç yönetmeliğinde belirtilenlerin dışında herhangi bir spor ve iyileştirme faaliyetine katılamaz.</template>
            </mvz-bent>
            <mvz-bent no="ı">
              <template>Hükümlünün cezasının infazına, hiçbir surette ara verilemez. Hükümlü hakkında uygulanacak tüm sağlık tedbirleri, tıbbî tetkik ve zorunluluklar hariç ceza infaz kurumlarında, mümkün olmadığı takdirde tam teşekküllü Devlet ya da üniversite hastanelerinin tek kişilik ve yüksek güvenlikli mahkûm koğuşlarında uygulanır.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="6-ALTINCI" başlık="Hükümlünün Yükümlülükleri">
        <mvz-madde no="26" başlık="Cezayı çekme, güvenlik ve iyileştirme programına uyma">
          <mvz-fıkra no="1">
            <template>Hükümlü, hapis cezasının yerine getirilmesine katlanma ve bu amaçla düzenlenen infaz rejimine uygun tutum ve davranışlar içinde bulunmakla yükümlüdür.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü, ceza infaz kurumunun güvenlik ve iyileştirme programlarına tam bir uyum göstermekle yükümlüdür. Her ne amaçla olursa olsun, bilerek kendi yaşamlarını ve bedensel bütünlüklerini tehlikeye düşürecek eylemlere girişmeleri, cezanın yerine getirilmesine katlanma yükümlülüğünün ihlâli sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="27" başlık="Sağlığın korunması kurallarına uyma">
          <mvz-fıkra no="1">
            <template>Hükümlü, sağlığının korunması ve salgın hastalıkların önlenmesi için gerekli ve alınmış tedbirlere uymak, kişi sağlığı için tehlike doğuran durumları gecikmeksizin kurum yönetimine bildirmek, kendi ve içinde yaşadığı ortamın temizliğine uygun davranışlar göstermek zorundadır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü, hem kendi, hem de diğer hükümlülerin sağlığını tehlikeye düşürebilecek eylemlerden kaçınmakla yükümlüdür.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="28" başlık="Bina ve eşyanın korunması">
          <mvz-fıkra no="1">
            <template>Hükümlü, barındırıldığı odayı, kurum binasını, yönetimce kendisine bırakılan şeyleri düzenli bir biçimde kullanmak ve bunlarla diğer kişilere ait eşyayı özenle korumakla yükümlüdür.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="29" başlık="Hükümlülerin çalıştırılması">
          <mvz-fıkra no="1">
            <template>Kurum hekimi tarafından ruhsal ve bedensel olarak sağlıklı olduğu belirlenen meslek sahibi olmayan hükümlüler ile meslek sahibi olan istekliler, kurum imkânları ölçüsünde belirlenen ücret karşılığında atölye veya işyurtlarında çalıştırılabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Çalıştırmanın amacı, hükümlülerin salıverilmelerinden sonra yaşamlarını sürdürecek meslek ve sanatları öğrenmelerini sağlamak, çalışma ve üretme isteklerini geliştirmek veya güçlendirmektir. Çalıştırmada hükümlünün yeteneği, becerisi, eğilimi, zihinsel ve bedensel durumları göz önünde bulundurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Çocuk hükümlülerin çalıştırılması yalnızca meslek eğitimine yönelik olur. Öğretim kurumlarına veya örgün eğitime devam eden çocuk ile genç hükümlüler, öğretim yılı içinde atölye ve işyerlerinde çalıştırılmazlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bunların çalıştırılmalarında 5.6.1986 tarihli ve 3308 sayılı Meslekî Eğitim Kanununun bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="30" başlık="Kurum dışında çalıştırma">
          <mvz-fıkra no="1">
            <template>Açık ceza infaz kurumlarında bulunanlar ile kapalı ceza infaz kurumlarında bulunup da açık ceza infaz kurumlarına ayrılmaya hak kazanmış hükümlüler, salıverilmelerinden sonra yaşamlarını sürdürecek meslek ve sanatları öğrenmelerini sağlamak, çalışma ve üretme isteklerini geliştirmek veya güçlendirmek, yeniden topluma kazandırmak ve iyileştirilmelerini temin etmek amacıyla kurum dışındaki iş alanlarında çalıştırılabilirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Açık ceza infaz kurumlarında bulunanlar ceza infaz kurumu görevlileri gözetiminde, kapalı ceza infaz kurumunda bulunanlar ise iç ve dış güvenlik görevlilerince alınacak tedbirler altında çalıştırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Çocuk eğitimevlerinde bulunan hükümlülerin, kurum dışında çalıştırılmaları sırasında kurum görevlilerinin gözetimi ve muhafazası aranmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İş alanlarına sahip kuruluşların hükümlü çalıştırmaları teşvik olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Açık ceza infaz kurumlarında bulunan hükümlülerden istekli olanlar, ceza infaz kurumu görevlilerinin denetiminde, kamu kurum ve kuruluşlarının iş alanlarında, geceleyin bu kurum ve kuruluşlar tarafından barındırılmak suretiyle çalıştırılabilirler. Bu şekilde çalıştırılan süre, azami süre sınırına bakılmaksızın 105/A maddesi uyarınca denetimli serbestlik tedbiri uygulanmak suretiyle infaz edilecek süreye ilave edilir.   Bu hükümlülerin gündeliği, işyurtları bünyesinde çalıştırılan usta hükümlülere ödenen gündelikten az olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Hükümlülerin kurum dışında çalışma esasları ile beşinci fıkra kapsamında çalıştırılacak hükümlülere uygulanmayacak kısıtlayıcı hükümler Cumhurbaşkanınca çıkarılan yönetmelikte gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu madde kapsamında çalıştırılan hükümlüler hakkında, 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 5 inci maddesinin birinci fıkrasının (a) bendinde belirtilen hükümler uygulanır. Bu durumda prim ödeme yükümlülüğü, hükümlünün çalıştırıldığı kurum ve kuruluşlar tarafından yerine getirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="31" başlık="Kurum hizmetinde çalıştırma">
          <mvz-fıkra no="1">
            <template>İyi halli hükümlüler, idare ve gözlem kurulu kararı ile kurum yönetimi tarafından durumlarına uygun kurum içi hizmetlerde çalıştırılabilir. Çocuk hükümlüler, kendi yaşam alanları veya eğitsel amaçlar dışında çalıştırılamazlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü, yöneticilerin ve görevlilerin kişisel işlerinde çalıştırılamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="32" başlık="Ücret ve sosyal haklar">
          <mvz-fıkra no="1">
            <template>Çalışan hükümlülere ürettiklerinden elde edilen gelirden, çalışmaları karşılığı ücret ödenir ve bu hükümlüler sosyal haklardan yararlandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sosyal güvenlik kurumlarına tâbi olanlar ile bunların hak sahiplerine yapılan her türlü yardım ve giderler, kendi mevzuatları çerçevesinde ilgili sosyal güvenlik kurumunca karşılanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="7-YEDİNCİ" başlık="Ceza İnfaz Kurumlarında Düzen ve Güvenlik">
        <mvz-madde no="33" başlık="Kurumların iç güvenliği">
          <mvz-fıkra no="1">
            <template>Kurumların iç güvenliği, Adalet Bakanlığına bağlı infaz ve koruma görevlileri tarafından sağlanır. İç güvenlik görevlileri, gerektiğinde dış güvenlik görevlileri ile işbirliği yapar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Açık kurumlar ile çocuk eğitimevlerindeki idare ile infaz ve koruma görevlileri; firarların önlenmesi, asayiş ve disiplinin sağlanması için gözetim ve denetimle yükümlüdürler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yüksek güvenlikli kapalı ceza infaz kurumları ile diğer kapalı ceza infaz kurumlarının yüksek güvenlikli bölümlerinde kalan tutuklu ve hükümlülerle ilgili olarak ceza infaz kurumlarında düzenlenen tutanaklara, ilgili görevlinin açık kimliği yerine sadece sicil numarası yazılır. Bu kapsamdaki kurum görevlilerinin ifadesine başvurulması hâlinde çıkarılan davetiye veya çağrı kâğıdı görevlinin iş yeri adresine tebliğ edilir. Bu kişilere ait ifade ve duruşma tutanaklarında adres olarak sadece iş yeri adresi gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="34" başlık="Kapıların açılmaması ve temasın önlenmesi">
          <mvz-fıkra no="1">
            <template>Kapalı ceza infaz kurumlarında oda ve koridor kapıları kapalı tutulur. Kapılar aşağıdaki hâllerde açılır:</template>
            <mvz-bent no="a">
              <template>Kurum hekimine, revir, hamam ve berbere gitme, başka odaya nakil.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hastane ve duruşmaya gönderme ve başka kuruma nakil.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Tahliye, ziyaret, arama, sayım, denetim, eğitim, öğretim, spor ve iyileştirme çalışmaları, kurumda çalıştırma.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kurullara çağrılma.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Ölüm, deprem veya yangın gibi olağanüstü hâller.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Cezaevi idaresince gerekli görülen hâller.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlüler, yukarıda sayılan hâller dışında, diğer odalardaki hükümlüler ve kurum görevlileri ile temasta bulunamazlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="35" başlık="Oda ve eklentilerinde bulundurulabilecek kişisel eşyalar">
          <mvz-fıkra no="1">
            <template>Kapalı ceza infaz kurumlarında bulunan hükümlülerin oda ve eklentilerinde bulundurabilecekleri veya bulunduramayacakları kişisel eşya, gıda, tıbbî malzeme ve diğer ihtiyaç maddeleri yönetmelikle düzenlenir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="36" başlık="Arama">
          <mvz-fıkra no="1">
            <template>Kurumlarda, odalar ve eklentilerinde, hükümlülerin üst ve eşyasında habersiz olarak her zaman arama yapılabilir. Her ay bir kez mutlaka arama yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aramalar, gerektiğinde dış güvenlik görevlileri veya kolluk kuvvetleriyle veya diğer kamu görevlilerince ortaklaşa gerçekleştirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="8-SEKİZİNCİ" başlık="Disiplin Ceza ve Tedbirleri, Ödüllendirme">
        <mvz-madde no="37" başlık="Disiplin cezalarının niteliği ve uygulama koşulları">
          <mvz-fıkra no="1">
            <template>Hükümlü hakkında kurumda, düzenli bir yaşamın sürdürülmesi, güvenliğin ve disiplinin sağlanması bakımından kanun,  yönetmelikler ile idarenin uyulmasını emrettiği veya gerekli kıldığı davranış ve tutumları, kusurlu olarak ihlâl ettiğinde, eyleminin niteliği ile ağırlık derecesine göre Kanunda belirtilen disiplin cezaları uygulanır.  Hükümlünün duruşma, sağlık, eğitim ve çalışma gibi nedenlerle geçici olarak kurum dışında bulunduğu yerler de bu fıkranın uygulanması bakımından kurum olarak kabul edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suç oluşturan eylemlerden dolayı açılan kamu davası, disiplin soruşturması yapılmasını ve cezanın uygulanmasını engellemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="38" başlık="Disiplin cezaları ve tedbirleri">
          <mvz-fıkra no="1">
            <template>Çocuklar haricindeki hükümlüler hakkında uygulanabilecek disiplin cezaları ağırlık derecesine göre şunlardır:</template>
            <mvz-bent no="a">
              <template>Kınama.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bazı etkinliklere katılmaktan alıkoyma.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Ücret karşılığı çalışılan işten yoksun bırakma.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Haberleşme veya iletişim araçlarından yoksun bırakma veya kısıtlama.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Ziyaretçi kabulünden yoksun bırakma.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Hücreye koyma.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Toplu, bedensel, zalimane, insanlık dışı veya küçültücü cezalar disiplin cezası olarak uygulanamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="39" başlık="Kınama">
          <mvz-fıkra no="1">
            <template>Kınama cezası, hükümlüye eyleminin kötü niteliğinin ve uygunsuzluğunun açıklanması ve tekrarı durumunda doğuracağı sonuçlara dikkatinin çekilmesidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kınama cezasını gerektiren eylemler şunlardır:</template>
            <mvz-bent no="a">
              <template>Mektuplarda tehdit, hakaret ve sövme gibi çirkin ifadeler kullanmak.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hükümlü ve tutuklulara karşı edep ve nezakete aykırı şekilde konuşmak veya davranışlarda bulunmak.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İdareden habersiz mektup göndermek.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Görevlilere hediye vermek veya buna kalkışmak.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Görevlilere herhangi bir taahhütte bulunmak.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>İdarece belirtilen miktardan fazla para bulundurmak.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Hükümlü kimliğini yanında bulundurmamak.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Yatma plânına uymamak.</template>
            </mvz-bent>
            <mvz-bent no="ı">

        <mvz-madde no="41" başlık="Ücret karşılığı çalışılan işten yoksun bırakma">

            </mvz-bent>
            <mvz-bent no="e">
              <template>Başkalarının ciddiyetle çalışmalarını engellemek.</template>

            <mvz-bent no="f">

            <mvz-bent no="g">

        <mvz-madde no="42" başlık="Haberleşme veya iletişim araçlarından yoksun bırakma veya kısıtlama">
          <mvz-fıkra no="1">
            <template>Haberleşme veya iletişim araçlarından yoksun bırakma veya kısıtlama cezası, hükümlünün bir aydan üç aya kadar mektup, faks ve telgraf almak ve yollamaktan, televizyon izlemekten, radyo dinlemekten, telefon etmekten ve diğer iletişim araçlarından yararlanmaktan tamamen veya kısmen yoksun bırakılmasıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu cezayı gerektiren eylemler şunlardır:</template>
            <mvz-bent no="a">
              <template>Protesto amacıyla idarece verilen yemeği topluca almama eylemine katılmak.</template>
            </mvz-bent>
            <mvz-bent no="b">

            </mvz-bent>
            <mvz-bent no="d">
              <template>Odalarda, eklentilerinde ve diğer alanlarda ilâç ve gıda maddesi stoku yapmak.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Gereksiz olarak marş söylemek veya slogan atmak.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Kurum idaresine bildirilen telefon numarası aracılığıyla ya da teknik müdahale ile başka bir hatta yönlendirme yapmak suretiyle görüşme hakkı olmayan kişilerle görüşmek.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hükümlüye gelen mektup, faks ve telgraflar, disiplin cezasının infazından sonra kendisine verilir. Aynı türden olsa bile sonraki disiplin cezasının infazına bu işlem yapılmadan başlanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Anne, baba, eş, çocuk ve kardeşlerin ölüm veya ağır hastalıkları ile doğal afet hâllerinde yapılması gereken haberleşmeler ve avukat ile ilişkilerde bu madde hükmü uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="43" başlık="Ziyaretçi kabulünden yoksun bırakma">
          <mvz-fıkra no="1">
            <template>Ziyaretçi kabulünden yoksun bırakma cezası, hükümlünün bir aydan üç aya kadar ziyaretçi görüşüne çıkarılmamasıdır.</template>

            </mvz-bent>

            <mvz-bent no="e">
              <template>Hükümlülerin haberleşmelerini, ziyaretçileriyle görüşmelerini, iyileştirme ve eğitim programları çerçevesinde eğitim ve spor, meslek kazandırma ve işyurdu çalışmaları ile diğer sosyal ve kültürel faaliyetlere katılmalarını, kurum hekimince muayene ve tedavi edilmelerini, avukat tayin etmelerini, mahkemelere veya Cumhuriyet Başsavcılıklarına gitmelerini, kurum görevlileri ile görüşmelerini, salıverilenlerin kurum dışına çıkmalarını her ne suretle olursa olsun engellemek, hükümlü ve tutukluları bu fiillere teşvik etmek, bu yolda talimat vermek, mevzuatın hükümlü ve tutuklulara tanıdığı sair her türlü görüşme ve temas olanaklarını engellemek.</template>
            </mvz-bent>
            <mvz-bent no="f">

        <mvz-madde no="44" başlık="Hücreye koyma">

        <mvz-madde no="45" başlık="Çocuk hükümlüler hakkında uygulanabilecek disiplin tedbirleri">

            <template>Çocuk hükümlüler hakkında uygulanabilecek disiplin tedbirleri, çocuğun disiplin cezası gerektiren eyleminin gerçekleşme riskinin bulunması hâlinde bu riski ortadan kaldırmak veya soruşturma sürerken giderilmesi güç ve imkânsız zararların doğmasını önlemek amacıyla uygulanan ve ceza niteliği taşımayan koruma ve önleme amaçlı tedbirlerdir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Çocuklar hakkında uygulanabilecek disiplin tedbirleri şunlardır:</template>

              <template>Teşvik esaslı ayrıcalıkları ertelemek.</template>

              <template>Bulunduğu kurumun başka bir kısmına nakletmek.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Meslek eğitiminin bütünlüğünü ve sürekliliğini bozmayacak şekilde çalıştığı işyerini veya atölyeyi değiştirmek.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Belli yerlere girmesini yasaklamak.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Bazı eşyaları bulundurmasını veya kullanmasını yasaklamak.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="46" başlık="Çocuk hükümlüler hakkında uygulanabilecek disiplin cezaları">
          <mvz-fıkra no="1">
            <template>Uyarma: Çocuğa eyleminin niteliğinin kötü ve uygunsuz olduğunun açıklanması ve tekrarı durumunda doğuracağı sonuçlara dikkatinin çekilmesidir. Uyarma cezasını gerektiren eylemler şunlardır:</template>

            <mvz-bent no="e">

            <mvz-bent no="f">

            </mvz-bent>
            <mvz-bent no="ı">
              <template>Kişisel durumu, adresi ve buna benzer konularda kurum görevlilerini yanlış bilgilendirmek, yalan söylemek.</template>

              <template>Kılık ve kıyafetine, kişisel temizliğine dikkat etmemek.</template>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Katıldığı etkinlikler ve derslerle ilgili olarak bulundurması gereken araç ve gereçleri yanında bulundurmamak.</template>

            <mvz-bent no="l">
              <template>Kurum içinde katılması gereken faaliyetlere katılmamak, geç katılmak veya katıldıktan sonra izinsiz ayrılmak.</template>

            </mvz-bent>
            <mvz-bent no="h">
              <template>İyileştirme ve eğitim faaliyetlerinde kendisine verilen ödev ve görevleri yapmamak.</template>
            </mvz-bent>
            <mvz-bent no="ı">
              <template>Resmî kurumlardan, kurum kitaplığından, atölye ve derslik gibi yerlerden aldığı kitap, araç ve gereçleri zamanında geri vermemek, eksik vermek ve bunlara zarar vermek.</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Dikkatsizlikle kurumun bina, eklenti ve donanımları ile kuruma ait taşınır ve taşınmaz malları veya başkasına ait herhangi bir eşyayı yakmak, kırmak veya hasara uğratmak.</template>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Üzerinde bulundurulmasına izin verilmeyen veya bulundurabileceğinden fazla eşya veya para bulundurmak.</template>
            </mvz-bent>
            <mvz-bent no="l">
              <template>Yasaklanmış her tür yayını kuruma veya kuruma bağlı yerlere sokmak veya yanında bulundurmak.</template>
            </mvz-bent>
            <mvz-bent no="m">
              <template>Kurum eşyasına, kendisinin veya arkadaşlarının araç ve gereçlerine ahlâk dışı, ideolojik veya siyasî amaç taşıyan resim, amblem ve benzerlerini yapmak, yazılar yazmak ve asmak.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Harcamalarına sınır koyma: Çocuğun daha önce onarma, tazmin etme ve eski hâle getirme cezası verilmiş olan davranışı ikinci kez tekrarlaması hâlinde çalışması karşılığında aldığı ücret ve ailesinden gelen paranın haftalık harcama limitinin üçte birinin otuz gün süre ile kesilmesidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bazı etkinliklere katılmaktan alıkoyma: Çocuğun otuz güne kadar sosyal, kültürel ve sportif faaliyetlere katılmaktan yoksun bırakılmasıdır. Bu disiplin cezasını gerektiren eylemler şunlardır:</template>
            <mvz-bent no="a">
              <template>Kumar oynamak.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kavga etmek.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Dikkatsiz davranışı sonucu başkalarının güvenliğini veya sağlığını tehlikeye düşürmek.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Katıldığı kurum dışı faaliyetlerden zamanında dönmemek ve uyması gereken koşullara uymamak.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kullanması için kendisine verilen bir şeyi satmak veya başkasına vermek.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Kurum veya dış güvenlik görevlilerine rüşvet vermek.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Suç örgütlerine ait her türlü yayın, bez afiş, pankart, resim, sembol, işaret ve benzeri eşyayı kurumun herhangi bir yerine asmak veya teşhir etmek ya da bulundurmak.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Katıldığı faaliyetlerin akışını ve düzenini engelleyici ve bozucu nitelikte kastî davranışlarda bulunmak, faaliyeti yürüten kişinin uyarısına rağmen bu davranışlarına devam etmek.</template>
            </mvz-bent>
            <mvz-bent no="ı">
              <template>Arkadaşlarının verilen görevleri yapmasına engel olmak.</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Başkasına ait eşyaya kasten zarar vermek.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Teşvik esaslı ayrıcalıkları geri alma: Çocuğun, daha önce bazı faaliyetlere katılmaktan alıkoyma cezası verilmiş olan davranışı ikinci kez tekrarlaması hâlinde, teşvik esaslı ayrıcalıkların otuz gün süre ile geri alınmasıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>İznin ertelenmesi veya ziyaretlerin kapalı şekilde yaptırılması: Disiplin cezasını gerektiren eylemin niteliğine ve ağırlık derecesine göre çocuğun izninin altmış güne kadar ertelenmesi veya kapalı ceza infaz kurumlarında açık ziyaretlerin altmış güne kadar kapalı şekilde yaptırılmasıdır. Bu disiplin cezasını gerektiren eylemler şunlardır:</template>
            <mvz-bent no="a">
              <template>Diğer çocuklar üzerinde nüfuz kurmak ve husumet hislerini tahrike çalışmak, imtiyaz ve menfaat hırsları yaratmak.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Her türlü bağımlılık yapıcı maddeyi kuruma getirmek, kullanmak, bulundurmak, satmak, kullanmış olarak kuruma gelmek.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Başkalarına ait para ve eşyayı almak için zor kullanmak, haraç almak.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Taarruz ve firara yarayacak ve gerektiğinde bu işler için kullanılabilecek madde ve aletleri yapmak, saklamak, bulundurmak.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>İdareye ait olup kendisine verilmemiş bulunan yatak, battaniye, karyola ve dolap gibi eşyayı zapt etmek veya satmak ya da maddi menfaat karşılığı diğer çocuklara kullandırmak.13</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Kurum görevlilerine hakaret etmek, karşı gelmek.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Başkalarının güvenliğini veya sağlığını tehlikeye sokan davranışlarda bulunmak.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Mazeretsiz olarak izinden dönmesi gereken zamandan geç dönmek ve uyması gereken koşullara uymamak.</template>
            </mvz-bent>
            <mvz-bent no="ı">
              <template>Kuruma yasak eşya sokmak, başkasına vermek veya satmak.</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Okul, işyeri gibi gitmesi gereken bir yere gitmemek, katılması gereken faaliyetlere katılmamak.</template>
            </mvz-bent>
            <mvz-bent no="k">
              <template>Hakaret veya iftira etmek, alçaltıcı söz söylemek veya davranışta bulunmak, başkalarını bu tür davranışlara kışkırtmak.</template>
            </mvz-bent>
            <mvz-bent no="l">
              <template>Suç örgütlerinin propaganda ve eğitim faaliyetlerini yapmak veya yaptırmak.</template>
            </mvz-bent>
            <mvz-bent no="m">
              <template>Kurum dışına izinsiz çıkmak.</template>
            </mvz-bent>
            <mvz-bent no="n">
              <template>Kurumca verilen kimlik kartında veya kendisine verilen her tür belgede tahrifat yapmak, sahte belge düzenlemek, kullanmak.</template>
            </mvz-bent>
            <mvz-bent no="o">
              <template>İyileştirme ve eğitim faaliyetlerinin yapılmasına engel olmak, katılanları faaliyetleri terk etmeye zorlamak veya kışkırtmak.</template>
            </mvz-bent>
            <mvz-bent no="p">
              <template>Kasten başkasını yaralamak.</template>
            </mvz-bent>
            <mvz-bent no="r">
              <template>Kurumda güvenlik amacıyla oluşturulan teknik, mekanik veya elektronik cihaz ya da sistemleri kasten etkisiz veya çalışamaz hâle getirmek yahut amacı dışında kullanmak.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Kapalı ceza infaz kurumuna iade: Çocuğun, eyleminin nitelik ve ağırlığına göre çocuk kapalı ceza infaz kurumlarına, bulunmadığı hâllerde kapalı ceza infaz kurumlarının çocuklara ayrılan bölümlerine altı ay, bu fıkrada sayılan disiplin eylemlerinin ikinci veya daha fazla tekrarı hâlinde ise bir yıl süre ile iadesidir. Çocuk, bu fıkra dışında işlenen disiplin suçları ve disiplin cezalarından dolayı çocuk kapalı infaz kurumuna iade edilemez. Kapalı ceza infaz kurumuna iadeyi gerektiren eylemler şunlardır:</template>
            <mvz-bent no="a">
              <template>Kurum içinde veya dışında başkasını neticesi sebebiyle ağırlaşmış şekilde yaralamak ya da yaralayıcı, öldürücü her türlü âlet, silâh ve patlayıcı madde kullanmak suretiyle herhangi bir kimseyi yaralamaya teşebbüs etmek, yaralamak.14</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bir kimseyi rızası hilafına alıkoymak.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Şiddet ve tehdit ile kurum görevlilerinin görevini engellemek.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Firara teşebbüs etmek veya firar etmek.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kasten kurumun bina, eklenti ve donanımları ile taşınır ve taşınmaz mallarını yakmak veya yakmaya teşebbüs etmek, ağır hasar vermek.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Hükümlü ve tutukluları idareye karşı kışkırtmak, isyan çıkartmak veya isyana teşebbüs etmek.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Adam öldürmek veya öldürmeye teşebbüs etmek.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Cinsel saldırı, çocukların cinsel istismarı ve cinsel tacizde bulunmak veya bunlara teşebbüs ve bu tür davranışlara kışkırtmak.</template>
            </mvz-bent>
            <mvz-bent no="ı">
              <template>Görevlilere, diğer çocuklara işkence yapmak veya yaptırmak.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Odaya kapatma cezası: Sekizinci fıkrada belirtilen kapalı infaz kurumunda bulunan çocuğun, aynı fıkrada belirtilen eylemlerde bulunması hâlinde, beş güne kadar açık havaya çıkma hakkı saklı kalmak üzere, gece ve gündüz tek başına bir odada tutulmasıdır. Bu ceza, çocuğun kurum görevlilerine istediği zaman ulaşmasına engel olunmayacak şekilde uygulanır. Çocuk, cezanın infazı öncesinde, sırasında ve sonrasında doktor kontrolünden geçirilir. Cezanın infazı sırasında çocuğun; ailesi, avukatı ve yasal temsilcisiyle görüşmesine izin verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="47" başlık="Disiplin soruşturması">
          <mvz-fıkra no="1">
            <template>Uyarma, kınama ve bazı etkinliklere katılmaktan alıkoyma cezaları kurumun en üst amiri tarafından verilir ve uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlülerin diğer disiplin cezalarını gerektiren eylemlerinin öğrenilmesinden itibaren derhâl ve en geç beş gün içinde kurum en üst amirince atanan bir görevli tarafından soruşturmaya başlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Soruşturma en geç onbeş gün içinde tamamlanır. Firar hâlinde bu süre hükümlünün yakalandığının öğrenildiği tarihte başlar. Düzenlenen rapor ve ekleri disiplin kuruluna sunulur. Soruşturma süresi eylemin ve soruşturmanın niteliğine göre infaz hâkiminin yazılı onayı ile yedi güne kadar uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Savunma alınmadan disiplin cezası verilemez. Haklarında disiplin soruşturması yapılanlara, yüklenen eylemin niteliği ve sonuçları ile üç gün içinde savunmalarını vermeleri, aksi hâlde bu haklarından vazgeçmiş sayılacakları yazılı olarak bildirilir. Savunma yazılı olarak sunulabileceği gibi sözlü olarak da yapılabilir. Sözlü savunma tutanakla saptanır. Türkçe bilmeyenlerle, sağır ve dilsizlerin savunmaları tercüman aracılığıyla alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Disiplin cezaları disiplin kurulunca evrak üzerinden görüşülerek en geç üç gün içinde karara bağlanır. Disiplin kurulu, yasada yazılı disiplin cezası uygulanmasına veya disiplin cezası verilmesine yer olmadığına karar verebilir. Disiplin kurulu kararları gerekçeli olarak yazılır ve kararda şikâyet mercii ve süresi açıkça gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Disiplin kurulu kararı, haklarında soruşturma yapılanlara yönetim tarafından derhâl tebliğ edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Kurumun iç düzenini ve hükümlülerin yaşam ve beden bütünlüklerinin ciddî tehlike altında bulunması nedeniyle derhâl tedbir alınması zorunlu olan hâllerde, kurumun en üst amiri 49 uncu maddede belirtilen tedbirleri almakla beraber soruşturmayı başlatır. Bu hâlde infaz hâkimine bilgi verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Disiplin soruşturması hükümlünün barındırıldığı ceza infaz kurumu disiplin kurulu tarafından yapılır. Hükümlünün ceza infaz kurumu dışındaki eylemleri nedeniyle yapılacak disiplin soruşturması, hükümlünün eylem öncesi en son barındırıldığı ceza infaz kurumu disiplin kurulu tarafından yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="48" başlık="Disiplin cezasını gerektiren eylemlerin tekrarı, disiplin cezalarının infazı ve kaldırılması">
          <mvz-fıkra no="1" durum="iptal">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir eylemden dolayı verilen disiplin cezası kesinleştikten sonra bu cezanın infazı tamamlanıp kaldırılması için dördüncü fıkrada belirtilen süreler geçinceye kadar yeniden disiplin cezasını gerektiren bir eylemde bulunan hükümlü hakkında, her defasında bir üst ceza uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Disiplin cezalarının infazı;</template>
            <mvz-bent no="a">
              <template>Hücreye koyma ve odaya kapatma cezasının infazına, infaz hâkiminin onayı ile başlanır. Hücreye koyma ve odaya kapatma cezasına ilişkin diğer hükümler saklı kalmak üzere, kesinleşen disiplin cezalarının infazına derhâl başlanır. Birden fazla disiplin cezası verilmiş olması hâlinde, bu cezalar kesinleşme tarihleri sırasına göre ayrı ayrı infaz edilir. Bir cezanın infazı tamamlanmadan diğerinin infazına başlanmaz.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Disiplin cezalarının tamamı infaz edilip kaldırılmadıkça koşullu salıverilme işlemi yapılmaz, ancak bu süre hakederek salıverme tarihini geçemez.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Hücreye koyma cezasına ilişkin disiplin cezalarının infazından önce ve infazı sırasında hükümlü, hekim tarafından muayene edilir. İlgilinin bu cezaya katlanamayacağı anlaşılırsa cezanın infazı sonraya bırakılır veya hekiminin belirleyeceği aralıklarla infaz edilir. Koşullu salıverilme tarihine kadar hükümlünün iyileşemeyeceğinin tam teşekküllü Devlet veya üniversite hastanesi sağlık kurulu raporu ile saptanması hâlinde hücreye koyma cezası infaz edilmez; yerine 44 üncü maddenin ikinci fıkrasının uygulandığı hâllerde iki ay, üçüncü fıkrasının uygulandığı hâllerde dört ay süreyle ziyaretçi kabulünden yoksun bırakma cezası uygulanır. Raporlar infaz dosyasına konulur.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İnfaz edildiği tarihten itibaren disiplin cezasının kaldırılmasında ve iyi hâlin kazanılmasında aşağıda belirtilen süreler esas alınır;</template>
            <mvz-bent no="a">
              <template>Kınama cezası onbeş gün,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bazı etkinliklere katılmaktan alıkoyma cezası bir ay,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Ücret karşılığı çalışılan işten yoksun bırakma cezası üç ay,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Haberleşme veya iletişim araçlarından yoksun bırakma veya kısıtlama cezası üç ay,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Ziyaretçi kabulünden yoksun bırakma cezası üç ay,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Hücreye koyma cezası 44 üncü maddenin ikinci fıkrasındaki hâllerde altı ay, üçüncü fıkrasındaki hâllerde bir yıl,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Hücre cezasına karşılık ziyaretçi kabulünden yoksun bırakma cezası, (f) bendinde belirtilen süre,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Sonunda disiplin cezası almamak ve iyi hâlli olmak koşuluyla (a) ve (b) bentlerinde belirtilen cezalar kurum en üst amiri tarafından, diğer bentlerde belirtilen cezalar, kurumun en üst amirinin önerisi ve disiplin kurulu kararıyla kaldırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Çocuk hükümlüler hakkında verilen disiplin cezaları;</template>
            <mvz-bent no="a">
              <template>Uyarma ve kınama cezaları kararla birlikte,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Onarma, tazmin etme ve eski hâle getirme cezası yedi gün sonunda,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Harcamalarına sınır koyma cezası otuz gün sonunda,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Bazı etkinliklere katılmaktan alıkoyma cezası otuz gün sonunda,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Teşvik esaslı ayrıcalıkları geri alma cezası otuz gün sonunda,</template>
            </mvz-bent>
            <mvz-bent no="f">
