  <mvz-künye tür="kanun" no="2108" başlık="MUHTAR ÖDENEK VE SOSYAL GÜVENLİK YASASI"
             tarih="29/8/1977" rgazete-tarih="10/9/1977" rgazete-sayı="16053"
             düstur-tertip="5" düstur-cilt="16" düstur-sayfa="2456" />

  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Köy muhtarları ile şehir ve kasaba mahalle muhtarlarına, 14.750 gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak miktarda aylık ödenek verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu ödenek damga vergisi hariç herhangi bir vergi ve kesintiye tabi tutulmaz.  Bu ödeneğin net tutarının net asgari ücret tutarının altında kalması halinde aradaki fark, ödenek için öngörülen usul ve esaslar çerçevesinde herhangi bir vergi ve kesintiye tabi tutulmaksızın ayrıca ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu ödeneğin karşılığı her yıl İçişleri Bakanlığı bütçesine konulur ve yılı içinde söz konusu bütçeden il özel idare ile yatırım izleme ve koordinasyon başkanlıkları bütçelerine aktarılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Muhtar ödeneği, her ayın onbeşinci günü il özel idareleri tarafından ilgililere peşin olarak ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Mülga</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>Köy ve mahalle muhtarlarından bir sosyal güvenlik kurumundan emekli aylığı almakta bulunanların bu aylıkları muhtarlık ödeneği ve harçlardan alacakları prim dolayısıyle kesilmez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 4 üncü maddesinin birinci fıkrasının (a) ve (c) bentleri kapsamında sigortalı sayılmayı gerektirecek bir çalışması bulunmayan veya bu kapsamda aylık almayan köy ve mahalle muhtarları, 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi kapsamında sigortalı sayılırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkra kapsamında bulunanların prime esas kazanç alt sınırı üzerinden hesaplanacak sosyal güvenlik primleri, il özel idareleri veya yatırım izleme ve koordinasyon başkanlıkları tarafından doğrudan Sosyal Güvenlik Kurumuna ödenir. Sosyal güvenlik primlerinin karşılığı her yıl İçişleri Bakanlığı bütçesine konulur ve yılı içinde söz konusu bütçeden il özel idare ve yatırım izleme ve koordinasyon başkanlıkları bütçelerine aktarılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="">
    <mvz-fıkra no="1">
      <template>Mülga</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>Köy ve mahalle muhtarlarına verilecek ödeneğin özel idare bütçelerine aktarılması, köy ve mahalle muhtarlarına ödenmesinin esas ve usulleri; mahalle muhtarlarının harç tahsilatının ve paylarının ödenme biçimi ile köy ve mahalle ve ihtiyar heyetleri tarafından verilecek resmi evraka ait basılı kağıtların tip, örnek ve bedellerine ilişkin hususlar Maliye ve Gümrük Bakanlığının görüşü alınarak İçişleri Bakanlığınca çıkarılacak bir yönetmelikle belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="">
    <mvz-fıkra no="1">
      <template>18/3/1924 tarihli ve 442 sayılı Köy Kanunu ile 15/4/1944 tarihli ve 4541 sayılı Şehir ve Kasabalarda Mahalle Muhtar ve İhtiyar Heyetleri Teşkiline dair Kanunun bu Kanuna aykırı hükümleri yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="">
    <mvz-fıkra no="1">
      <template>15/4/1944 gün ve 4541 sayılı Şehir ve Kasabalarda mahalle Muhtar ve İhtiyar Heyeti Teşkiline Dair Yasa ile ilgili olup yerine işlenmiştir.</template>
    </mvz-fıkra>
  </mvz-madde>
