  <mvz-künye tür="kanun" no="5941" başlık="ÇEK KANUNU"
             tarih="14/12/2009" rgazete-tarih="20/12/2009" rgazete-sayı="27438"
             düstur-tertip="5" düstur-cilt="49" />

  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, çek defterlerinin içeriklerine, çek düzenlenmesine, kullanımına, çek hamillerinin korunmalarına ve kayıt dışı ekonominin denetim altına alınması önlemlerine katkıda bulunmaya ilişkin esaslar ile çekin karşılıksız çıkması ve belirlenen diğer yükümlülüklere aykırılık hâllerinde ilgililer hakkında uygulanacak yaptırımları belirlemektir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunda hüküm bulunmayan hâllerde genel hükümler uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Bankanın araştırma yükümlülüğü, çek hesapları ve çek defterleri">
    <mvz-fıkra no="1">
      <template>Bankalar, çek hesabı açılması ile ilgili olarak bu Kanunla kendilerine verilen görev ve yükümlülükleri yerine getirirken, çek hesabı açtırmak isteyenin yasaklı olup olmadığını bu Kanun hükümlerine göre araştırırlar; ayrıca ilgili kişinin ekonomik ve sosyal durumunun belirlenmesinde gerekli basiret ve özeni gösterirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bankalar, çek hesabı açtırmak isteyenlerin yasaklılık durumuna ilişkin Risk Merkezi ile adli sicil kayıtlarını ve açık kimliklerini saptamak için fotoğraflı nüfus cüzdanı, pasaport veya sürücü belgesi örneklerini, yerleşim yeri belgelerini, vergi kimlik numaralarını, tacir olanların ayrıca ticaret sicili kayıtlarını, esnaf ve sanatkâr olanların ise esnaf ve sanatkâr sicili kayıtlarını almak ve çek hesabının kapatılması hâlinde bunları, hesabın kapatıldığı tarihten itibaren on yıl süreyle saklamakla yükümlüdür. Yerleşim yeri yurt dışında bulunan kişiler, bankaya kendileri ile ilgili olarak Türkiye’de bir adres bildirmek zorundadır. Çekin karşılığının tamamen veya kısmen bulunmaması hâlinde, çek düzenleyenin bankaca bilinen adresleri, talebi hâlinde hamile verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Çek hesabı ilgilinin, vekilin veya yasal temsilcisinin imzası olmadan açılamaz. Çek hesabı açılmasını veya mevcut çek hesabından çek defteri verilmesini isteyen kişi, her defasında tacir veya esnaf ve sanatkâr olup olmadığı ve kendisi hakkında çek düzenleme ve çek hesabı açma yasağı bulunmadığı hususunda bankaya yazılı beyanda bulunur. Tüzel kişiler adına verilecek beyannamede ayrıca, tüzel kişinin yönetim organında görev yapan, temsilcisi olan veya imza yetkilisi olan kişilerin çek düzenleme ve çek hesabı açma yasağı bulunmadığı belirtilir.  Muhatap banka; gerçek veya tüzel kişi adına açılması talep olunan çek hesaplarında bunların, sermaye şirketlerinde ayrıca yönetim organında görev yapanlar ile ticaret siciline tescil edilen şirket yetkililerinin çek hesabı açma yasağının bulunmadığı hususunu kontrol ederek, yasağın bulunmadığına ilişkin sorgulama sonucunu muhafaza eder. Bankalar çek hesabı açtıkları kişiler ile çek hesabı sahibi tüzel kişi ise hesap açılış tarihi itibarıyla tüzel kişi tarafından bildirilen işlem yetkililerini 13/1/2011 tarihli ve 6102 sayılı Türk Ticaret Kanununun 780 inci maddesinin üçüncü fıkrasında belirtilen sisteme kaydeder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Hakkında çek düzenleme ve çek hesabı açma yasağı kararı bulunan gerçek kişinin, yönetim organında görev yaptığı veya ticaret siciline tescil edilen yetkilisi olduğu tüzel kişiye çek defteri verilmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Çek defterleri bankalarca bastırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Çek defterlerinin baskı şeklini belirleyen esaslar, Maliye Bakanlığı, Türkiye Bankalar Birliği ve Türkiye Katılım Bankaları Birliğinin görüşü alınarak, Türkiye Cumhuriyet Merkez Bankasınca Resmî Gazete’de yayımlanacak tebliğle düzenlenir. Tacir olan ve tacir olmayan kişilere verilecek çekler ile hamiline düzenlenecek çekler, açıkça ayırt edilebilecek biçimde bastırılır. Hamiline düzenlenecek çekler için sadece bu çeklere ilişkin işlemlerin işlendiği ayrı çek hesapları açılır. Hamiline düzenlenecek çeklerde, hamiline çek defteri yapraklarının kullanılması gerekir. Çek yapraklarının üzerinde “hamiline” ibaresi matbu olarak yer alır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Çek defterinin her bir yaprağına;</template>
      <mvz-bent no="a">
        <template>Çek hesabının numarası,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Çek hesabının bulunduğu banka şubesinin adı,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Çek hesabı sahibi gerçek kişinin adı ve soyadı, tüzel kişinin adı,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Çek hesabı sahibi gerçek veya tüzel kişinin vergi kimlik numarası,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Çekin basıldığı tarih,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Çek hesabı sahibi gerçek kişi ise Türkiye Cumhuriyeti kimlik numarası; tüzel kişilerde ise varsa Merkezi Sicil Kayıt Sistemi (MERSİS) numarası,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Çek hesabı sahibi ile düzenleyenin farklı kişiler olması hâlinde, ayrıca düzenleyenin Türkiye Cumhuriyeti kimlik numarası,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>yazılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Tüzel kişi adına çek düzenleyen kişinin adı ve soyadı, düzenlenen çek üzerine açıkça yazılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Türk Ticaret Kanunundaki unsurları taşıması kaydıyla, düzenlenen çekin bu maddede yer alan koşullara aykırı olması çekin geçerliliğini etkilemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Çek hesabı, ancak sahibinin veya yasal temsilcisinin yazılı talebi ya da mevduat veya katılım fonu zamanaşımı süresinin dolması üzerine kapatılabilir. Çek hesabı kapatıldıktan sonra, üzerinde yazılı bulunan düzenleme tarihine göre kanunî ibraz süresi içinde ibraz edilen çekler karşılıksızdır işlemine tabi tutulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="11">
      <template>Esnaf ve sanatkâr odalarına kayıtlı olanlardan, tacir kişilere özgü çek hesabı açtıranlar hakkında bu Kanunun tacirlere ilişkin hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="İbraz, ödeme, çekin karşılıksız olduğunun tespiti ve gecikme cezası">
    <mvz-fıkra no="1">
      <template>Karşılığı bulunan çek, hesabın bulunduğu muhatap bankanın herhangi bir şubesine ibraz edildiğinde hamilin varsa vergi kimlik numarası saptandıktan sonra ödenir. Ancak çek, hesabın bulunduğu şubeden başka bir şubeye ibraz edildiğinde, o şubece karşılığı sorulmak suretiyle ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>“Karşılıksızdır” işlemi, muhatap bankanın hamile kanunen ödemekle yükümlü olduğu miktarın dışında, çek bedelinin karşılanamayan kısmıyla sınırlı olarak yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Muhatap banka, ibraz eden düzenleyici dışındaki hamile, süresinde ibraz edilen her çek yaprağı için;</template>
      <mvz-bent no="a">
        <template>Karşılığının hiç bulunmaması hâlinde,</template>
        <mvz-altbent no="1">
          <template>Çek bedeli bin Türk Lirası veya üzerinde ise bin Türk Lirası,</template>
        </mvz-altbent>
        <mvz-altbent no="2">
          <template>Çek bedeli bin Türk Lirasının altında ise çek bedelini,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Karşılığının kısmen bulunması hâlinde,</template>
        <mvz-altbent no="1">
          <template>Çek bedeli bin Türk Lirası veya altında ise, çek bedelini aşmamak koşuluyla, kısmî karşılığı bin Türk Lirasına tamamlayacak bir miktarı,</template>
        </mvz-altbent>
        <mvz-altbent no="2">
          <template>Çek bedeli bin Türk Lirasının üzerinde ise, çek bedelini aşmamak koşuluyla, kısmî karşılığa ilave olarak bin Türk Lirasını,</template>
        </mvz-altbent>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>ödemekle yükümlüdür. Bu husus, hesap sahibi ile muhatap banka arasında çek defterinin teslimi sırasında yapılmış olan dönülemeyecek bir gayri nakdî kredi sözleşmesi hükmündedir. Bu fıkradaki miktar, Türkiye İstatistik Kurumu tarafından yayımlanan fiyat endekslerindeki yıllık değişmeler göz önünde tutularak Türkiye Cumhuriyet Merkez Bankası tarafından her yıl Ocak ayında belirlenir ve Resmî Gazete’de yayımlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Hamilin talepte bulunması hâlinde, karşılıksızdır işlemi; çekin arka yüzüne tahsil için bankaya ibraz edildiği tarih, hesap durumu, bankanın yükümlülüğü çerçevesinde ödediği miktar ve ibraz eden gerçek kişinin adı ve soyadı yazılmak, bu kişinin tüzel kişi adına bedeli tahsil etmesi hâlinde bu husus belirtilmek ve bu kişi ile birlikte banka yetkilisi tarafından imzalanmak suretiyle yapılır. Banka tarafından ödenen miktar düşüldükten sonra karşılıksız kalan tutar açıkça belirtilir. Hamilin imzalamaktan kaçınması hâlinde, karşılıksızdır işlemi yapılmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Muhatap bankanın üçüncü fıkraya göre ödemekle yükümlü olduğu tutar dahil, kısmî ödemenin hamil tarafından kabul edilmemesi hâlinde, ikinci fıkra hükmüne göre karşılıksızdır işlemi yapılır; ibraz tarihi ile ödememe nedeni çekin üzerine yazılır ve çek, üzerine imzası alınarak hamiline geri verilir; ön ve arka yüzünün fotokopisi banka tarafından saklanır. Çek hesabında hiç karşılığın bulunmaması ve hamilin sadece muhatap bankanın üçüncü fıkraya göre ödemekle yükümlü olduğu tutarın ödenmesini talep etmesi hâlinde de bu fıkra hükmüne göre işlem yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Muhatap bankanın üçüncü fıkraya göre ödemekle yükümlü olduğu tutar dahil kısmî ödeme hâlinde, çekin ön ve arka yüzünün onaylı fotokopisi ücretsiz olarak hamile verilir. Çek hamili, bu fotokopiyle müracaat borçlularına veya kambiyo senetleri hakkındaki takip usullerine başvurabileceği gibi, icra mahkemesine şikâyette bulunurken dilekçesine bu fotokopiyi ekleyebilir ve bunu icra daireleri ile mahkemelerde ispat aracı olarak kullanabilir. Mahkeme veya icra dairesinin istemi hâlinde çekin aslı bu mercilere gönderilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Banka;</template>
      <mvz-bent no="a">
        <template>Çekin karşılığının hesapta bulunmasına rağmen hamiline ödenmesinin geciktirilmesi,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Kanunen ödemekle yükümlü olduğu miktarın hamile ödenmesinin geciktirilmesi,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>hâllerinde, çek hamiline, her geçen gün için binde üç gecikme cezası öder. Bu hâllerde 4/12/1984 tarihli ve 3095 sayılı Kanuni Faiz ve Temerrüt Faizine İlişkin Kanun hükümleri uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Üzerinde yazılı bulunan düzenleme tarihinden önce ibraz edilen çekin karşılığının Türk Ticaret Kanununun 707 nci maddesi uyarınca kısmen veya tamamen ödenmemiş olması hâlinde, bu çekle ilgili olarak hukukî takip yapılamaz. İleri düzenleme tarihli çekle ilgili olarak hukukî takip yapılabilmesi için, çekin üzerindeki düzenleme tarihine göre kanunî ibraz süresi içinde bankaya ibraz edilmesi ve karşılıksızdır işlemine tabi tutulması şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Çekin, üzerinde yazılı baskı tarihinden itibaren beş yıl içinde ibraz edilmemesi hâlinde, muhatap bankanın üçüncü fıkraya göre ödemekle yükümlü olduğu tutara ilişkin sorumluluğu sona erer.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Lehine karekodlu çek düzenlenen lehdar, teslim aldığı çeki Türk Ticaret Kanununun 780 inci maddesinin üçüncü fıkrasında belirtilen sisteme kaydeder. Karekodlu çekin sisteme kaydedildiği tarihten sonra çek düzenleyen tüzel kişinin temsilcilerinde meydana gelen değişiklikler, çek hesabı sahibi tüzel kişinin sorumluluğunu ortadan kaldırmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Bankaların bildirim yükümlülüğü">
    <mvz-fıkra no="1">
      <template>Hamiline çek hesabı sahiplerinin açık kimlikleri, adresleri, vergi kimlik numaraları, bu hesaplardan ödeme yapılan kişilere ait bu bilgiler ile bu kişilere yapılan ödemelerin tutarları ve üzerinde vergi kimlik numarası bulunmayan çeklere ilişkin bilgiler, ilgili bankalar tarafından, dönemler itibarıyla, Gelir İdaresi Başkanlığına elektronik ortamda bildirilir. Bildirim dönemleri ve süreleri Türkiye Bankalar Birliği ve Türkiye Katılım Bankaları Birliğinin görüşleri alınarak Gelir İdaresi Başkanlığı tarafından belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tacir tüzel kişi veya onun faaliyetleri ile ilişkilendirilmek kaydıyla, tüzel kişinin gerçek kişi ortakları, ortakların ilgili bulunduğu veya tüzel kişinin veya ortaklarının etkisi altında bulundurduğu gerçek kişiler ile tüzel kişinin yönetim organında görev alan veya temsilcisi sıfatını taşıyan gerçek kişiler adına açılmış olan çek hesapları, tacir tüzel kişiye ait kabul edilir. Söz konusu ilişkinin varlığına yönelik emarelerin bulunması hâlinde, hesabın bulunduğu banka şubesi durumu Gelir İdaresi Başkanlığına bildirir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bankalar, hamiline çek defteri yaprağını kullanmadan hamiline çek düzenlendiğini tespit etmeleri hâlinde, mevcut delilleriyle birlikte durumu, tespit tarihinden itibaren en geç bir hafta içinde Cumhuriyet başsavcılığına ve Gelir İdaresi Başkanlığına bildirmekle yükümlüdür.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Ceza sorumluluğu, çek düzenleme ve çek hesabı açma yasağı">
    <mvz-fıkra no="1">
      <template>Üzerinde yazılı bulunan düzenleme tarihine göre kanuni ibraz süresi içinde ibrazında, çekle ilgili olarak “karşılıksızdır” işlemi yapılmasına sebebiyet veren kişi hakkında, hamilin şikâyeti üzerine, her bir çekle ilgili olarak, binbeşyüz güne kadar adli para cezasına hükmolunur. Ancak, hükmedilecek adli para cezası; çek bedelinin karşılıksız kalan miktarı,  az olamaz. Mahkeme ayrıca, çek düzenleme ve çek hesabı açma yasağına; bu yasağın bulunması hâlinde, çek düzenleme ve çek hesabı açma yasağının devamına hükmeder. Yargılama sırasında da resen mahkeme tarafından koruma tedbiri olarak çek düzenleme ve çek hesabı açma yasağına karar verilir. Çek düzenleme ve çek hesabı açma yasağı, çek hesabı sahibi gerçek veya tüzel kişi, bu tüzel kişi adına çek keşide edenler ve karşılıksız çekin bir sermaye şirketi adına düzenlenmesi durumunda ayrıca yönetim organı ile ticaret siciline tescil edilen şirket yetkilileri hakkında uygulanır. Koruma tedbiri olarak verilen çek düzenleme ve çek hesabı açma yasağı kararlarına karşı yapılan itirazlar bakımından 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanununun 353 üncü maddesinin birinci fıkrası hükmü uygulanır. Bu suçtan dolayı açılan davalar icra mahkemesinde görülür ve İcra ve İflas Kanununun 347, 349, 350, 351, 352 ve 353 üncü maddelerinde düzenlenen yargılama usulüne ilişkin hükümler uygulanır. Bu davalar çekin tahsil için bankaya ibraz edildiği veya çek hesabının açıldığı banka şubesinin bulunduğu yer ya da hesap sahibinin yahut şikâyetçinin yerleşim yeri mahkemesinde görülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkra hükmüne göre çek karşılığını ilgili banka hesabında bulundurmakla yükümlü olan kişi, çek hesabı sahibidir. Çek hesabı sahibinin tüzel kişi olması hâlinde, bu tüzel kişinin mali işlerini yürütmekle görevlendirilen yönetim organının üyesi, böyle bir belirleme yapılmamışsa yönetim organını oluşturan gerçek kişi veya kişiler, çek karşılığını ilgili banka hesabında bulundurmakla yükümlüdür. Birinci fıkra uyarınca hakkında çek düzenleme ve çek hesabı açma yasağı kararı verilenler, yasaklılıkları süresince sermaye şirketlerinin yönetim organlarında görev alamazlar. Ancak, hakkında yasaklama kararı verilenlerin mevcut organ üyelikleri görev sürelerinin sonuna kadar devam eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Çek hesabı sahibi gerçek kişi, kendisi adına çek düzenlemek üzere bir başkasını temsilci veya vekil olarak tayin edemez. Gerçek kişinin temsilcisi veya vekili olarak çek düzenlenmesi hâlinde, bu çekten dolayı hukukî ve cezai sorumluluk çek hesabı sahibine aittir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Çek düzenleme ve çek hesabı açma yasağı kararı ile ilgili olarak, herhangi bir adres değişikliği bildiriminde bulunulmadığı sürece ilgilinin çek hesabı açtırırken bildirdiği adrese 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanununun 35 inci maddesine göre derhal tebligat çıkarılır. Adresin bankaya yanlış bildirilmesi veya fiilen terkedilmiş olması hâlinde de, tebligat yapılmış sayılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Hakkında çek düzenleme ve çek hesabı açma yasağı kararı verilmiş olan kişi, elindeki bütün çek yapraklarını ait olduğu bankalara iade etmekle yükümlüdür. Bu kişi adına yeni bir çek hesabı açılamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Hakkında çek düzenleme ve çek hesabı açma yasağı kararı verilmiş olan kişi, kararın kendisine tebliğ edildiği tarihten itibaren on gün içinde, düzenlemiş bulunduğu ve henüz karşılığı tahsil edilmemiş olan çekleri, düzenleme tarihlerini, miktarlarını ve varsa lehtarlarını da göstermek suretiyle, muhatap bankaya liste hâlinde vermekle yükümlüdür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Çek düzenleme ve çek hesabı açma yasağı kararına ilişkin bilgiler, güvenli elektronik imza ile imzalandıktan sonra, Adalet Bakanlığı Ulusal Yargı Ağı Bilişim Sistemi (UYAP) aracılığıyla MERSİS ile Risk Merkezine elektronik ortamda bildirilir. Hakkında çek hesabı açma yasağı kararı verilen kişiler, Risk Merkezi tarafından bankalara bildirilir. Bu bildirimler ile bankalara yapılacak duyurulara ilişkin esas ve usuller, Adalet Bakanlığının uygun görüşü alınarak Risk Merkezi tarafından belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Karşılıksız kalan bir çekle ilgili olarak yapılan yargılama neticesinde mahkeme tarafından beraat, ceza verilmesine yer olmadığı, davanın düşmesi veya davanın reddine karar verilmesi hâlinde, aynı kararda, çek düzenleme ve çek hesabı açma yasağının kaldırılmasına karar verilir. Çek düzenleme ve çek hesabı açma yasağının kaldırılmasına ilişkin kararların kesinleşmesi üzerine, bu kararlar, MERSİS ile Risk Merkezine sekizinci fıkradaki usullere göre bildirilir ve ilan olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Birinci fıkrada tanımlanan suç nedeniyle, ön ödeme, uzlaşma ve hükmün açıklanmasının geri bırakılmasına ilişkin hükümler uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="11">
      <template>Birinci fıkra uyarınca verilen adli para cezalarının ödenmemesi durumunda, bu ceza, 13/12/2004 tarihli ve 5275 sayılı Ceza ve Güvenlik Tedbirlerinin İnfazı Hakkında Kanunun 106 ncı maddesinin üçüncü fıkrasında yer alan kamuya yararlı bir işte çalıştırma kararı verilmeksizin doğrudan hapis cezasına çevrilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Etkin pişmanlık ve çek düzenleme ve çek hesabı açma yasağının kaldırılması">
    <mvz-fıkra no="1">
      <template>Karşılıksız kalan çek bedelinin, çekin üzerinde yazılı bulunan düzenleme tarihine göre kanunî ibraz tarihinden itibaren işleyecek 3095 sayılı Kanuna göre ticarî işlerde temerrüt faiz oranı üzerinden hesaplanacak faizi ile birlikte tamamen ödeyen kişi hakkında,</template>
      <mvz-bent no="a">
        <template>Yargılama aşamasında mahkeme tarafından davanın düşmesine,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Mahkûmiyet hükmünün kesinleşmesinden sonra mahkeme tarafından hükmün bütün sonuçlarıyla ortadan kaldırılmasına,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>karar verilir. Çek düzenleme ve çek hesabı açma yasağının kaldırıldığı, MERSİS ile Risk Merkezine 5 inci maddenin sekizinci fıkrasındaki usullere göre bildirilir ve ilan olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Şikâyetten vazgeçme hâlinde de birinci fıkra hükmü uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kişi, mahkûm olduğu cezanın tamamen infaz edildiği tarihten itibaren üç yıl ve her halde yasağın konulduğu tarihten itibaren on yıl geçtikten sonra, hükmü veren mahkemeden çek düzenleme ve çek hesabı açma yasağının kaldırılmasını isteyebilir; mahkemenin vereceği karara itiraz edebilir. Bu itiraz bakımından İcra ve İflas Kanununun 353 üncü maddesinin birinci fıkrası hükmü uygulanır. Çek düzenleme ve çek hesabı açma yasağının kaldırılmasına ilişkin karar kesinleştiğinde, yasağın kaldırıldığı, MERSİS ile Risk Merkezine 5 inci maddenin sekizinci fıkrasındaki usullere göre bildirilir ve ilan olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Diğer ceza hükümleri">
    <mvz-fıkra no="1">
      <template>Tacirin ticarî işletmesiyle ilgili iş ve işlemlerinde, tacir olmayan kişinin çek defterini kullanarak çek düzenleyen ve düzenleten kişi altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tacir olmayan kişiye tacir kişiye verilmesi gereken çek defteri veren banka görevlisi hakkında elli günden yüzelli güne kadar adlî para cezasına hükmolunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>2 nci maddenin üçüncü fıkrasındaki yükümlülüğe aykırı olarak bankaya gerçek dışı beyanda bulunan kişi, üç aydan iki yıla kadar hapis cezası ile cezalandırılır. Beyanname almadan veya beyannameye rağmen, hakkında çek düzenleme ve çek hesabı açma yasağı bulunan kişiye veya bu kişinin yönetim organında görev yaptığı veya temsilcisi ya da imza yetkilisi olduğu tüzel kişiye çek defteri veren banka görevlileri elli günden yüzelli güne kadar adlî para cezası ile cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kısmen veya tamamen karşılığı bulunmayan çekle ilgili olarak, talebe rağmen, karşılıksızdır işlemi yapmayan banka görevlisi, şikâyet üzerine bir yıla kadar hapis cezası ile cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Karşılığı tahsil edilmek üzere bankaya ibraz edilen çekin karşılığının hesapta mevcut olmasına rağmen, hamile ödemede bulunmayan ya da bankanın kanunen ödemekle yükümlü olduğu miktarı hamile ödemeyen banka görevlisi, şikâyet üzerine bir yıla kadar hapis cezası ile cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Hakkında çek düzenleme ve çek hesabı açma yasağı kararı verilmiş olan kişi, buna rağmen çek düzenlerse, fiil daha ağır cezayı gerektiren başka bir suç oluşturmadığı takdirde, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Hakkında çek düzenleme ve çek hesabı açma yasağı kararı verilmiş olan kişi adına çek hesabı açan banka görevlisi, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Çek defteri basmaya veya bastırmaya kanunen yetkili kılınanlar dışında çek defteri basanlar ve bastıranlar iki yıldan beş yıla kadar hapis ve binbeşyüz güne kadar adlî para cezasıyla cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Hamiline çek defteri yaprağını kullanmadan hamiline çek düzenleyen kişi, bu aykırılığı içeren her bir çekle ilgili olarak, Cumhuriyet savcısı tarafından üçyüz Türk Lirasından üçbin Türk Lirasına kadar idarî para cezası ile cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>2 nci maddenin, sağlanması ve saklanması gereken bilgi ve belgelere ilişkin hükmüne aykırı hareket edilmesi veya çekin karşılıksız çıkması dolayısıyla hamili tarafından talep edilmesi üzerine düzenleyicinin banka kayıtlarındaki adreslerinin kendisine verilmemesi hâlinde, ilgili bankaya Cumhuriyet savcısı tarafından beşyüz Türk Lirasından beşbin Türk Lirasına kadar idarî para cezası verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Hesaben ödeme">
    <mvz-fıkra no="1">
      <template>Türkiye Cumhuriyet Merkez Bankası, çeklerin banka şubeleri arasında hesaben ödenmesini sağlayacak tüzel kişiliği haiz sistemi kurmaya ve gözetimi altında yürütmeye yetkilidir. Türkiye Cumhuriyet Merkez Bankası, bu yetkiyi uygun göreceği başka bir kuruluş aracılığıyla da kullanabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hesaben ödeme sisteminin kuruluş ve işleyişi, Türkiye Cumhuriyet Merkez Bankasınca çıkarılacak ve Resmî Gazete’de yayımlanacak bir yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yönetmelikte belirtilen esaslar çerçevesinde çeklerin fizikî olarak ibraz edilmeksizin sadece çek bilgileri üzerinden bankalararası takas odaları aracılığı ile elektronik ortamda muhatap bankaya gönderilerek işlem görmesi, 6762 sayılı Türk Ticaret Kanununun 710 uncu maddesine göre takas odasına ibraz hükmündedir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Takas odaları aracılığıyla ibraz edilmiş çekler için, 3 üncü maddenin üçüncü fıkrasında belirlenen sorumluluk miktarı dâhil, kısmî ödeme yapılmaz. Bu durum, muhatap bankanın sorumluluk tutarını ödeme yükümlülüğünü ortadan kaldırmaz. Ancak, takas odaları aracılığıyla ibraz edilen çekin, hesapta yeterli karşılığının olmadığının belirlenmesi hâlinde muhatap banka tarafından, hesapta bulunan kısmî karşılık tutarı, çeki ibraz eden hamil lehine onbeş gün süreyle bloke edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Yürürlükten kaldırılan mevzuat">
    <mvz-fıkra no="1">
      <template>19/3/1985 tarihli ve 3167 sayılı Çekle Ödemelerin Düzenlenmesi ve Çek Hamillerinin Korunması Hakkında Kanun ile 26/2/2003 tarihli ve 4814 sayılı Çekle Ödemelerin Düzenlenmesi ve Çek Hamillerinin Korunması Hakkında Kanunda Değişiklik Yapılmasına İlişkin Kanunun geçici 1 ilâ geçici 5 inci maddeleri yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="Geçiş hükümleri" tür="GEÇİCİ">
    <mvz-fıkra no="1">
      <template>Bankalar, Türkiye Cumhuriyet Merkez Bankasınca bu Kanunun yürürlüğe girdiği tarihten itibaren bir ay içinde, 2 nci maddeye göre yayımlanacak tebliğde belirlenen esaslara uygun olarak yeni çek defterleri bastırırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bankalar, 1/7/2010 tarihine kadar müşterilerine yeni çek defterlerini verir ve ellerindeki eski çek defterlerini imha ederler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bankaların müşterilerine verdikleri eski çek defterleriyle ilgili olarak, 3167 sayılı Kanun hükümlerinin uygulanmasına devam olunur. 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 7 nci maddesi hükmü saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu Kanunun yürürlüğe girdiği tarihe kadar 3167 sayılı Kanunun 16 ncı maddesinde tanımlanan suçtan dolayı açılmış olan davalar bakımından asliye ceza mahkemesinin görevi devam eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>31/12/2011 tarihine kadar, üzerinde yazılı düzenleme tarihinden önce çekin ödenmek için muhatap bankaya ibrazı geçersizdir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu Kanunun 5 inci maddesinin sekizinci fıkrası uyarınca yapılacak bildirimler, 1/7/2010 tarihine kadar yazılı ortamda yapılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Bu Kanunla yürürlükten kaldırılan 3167 sayılı Kanunun 6 ncı maddesi uyarınca kurulmuş olan Bankalararası Takas Odaları Merkezi, bu Kanunun 8 inci maddesinde öngörülen tüzel kişiliği haiz sistem kuruluncaya kadar faaliyetlerine devam eder ve yeni kurulacak tüzel kişiliğe herhangi bir işleme gerek kalmaksızın devrolunur. Yeni kurulacak tüzel kişilik bu devir nedeniyle doğacak her türlü vergi, resim, harç ve fondan muaftır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="GEÇİCİ">
    <mvz-fıkra no="1">
      <template>3167 sayılı Kanunun 16 ncı maddesinde tanımlanan suçtan dolayı, 1/11/2009 tarihi itibarıyla, haklarında soruşturma veya kovuşturma başlatılmış ya da kesinleşmiş bir hükümle mahkûm olan kişilerin;</template>
      <mvz-bent no="a">
        <template>Şikâyetçi ile belirledikleri miktarın belirli vadelerde ödenmesi hususunda anlaşmaya varmaları ve anlaşmanın bir nüshasının şikâyetçi veya yasal temsilcisi tarafından Cumhuriyet başsavcılığına veya mahkemeye verilmesi hâlinde, anlaşmada öngörülen süre kadar soruşturma veya kovuşturmanın durmasına, hükmün infazının ertelenmesine veya durdurulmasına karar verilir. Anlaşmaya varılmış olması, şikâyetçi bakımından şikâyetin geri alınması sonucunu doğurmaz.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bu Kanunun 6 ncı maddesi hükmüne göre ödenmesi gereken miktarı belirli vadelerde ödeyeceğini taahhüt etmesi ve taahhütnamenin, kendisi veya yasal temsilcisi tarafından Cumhuriyet başsavcılığına veya mahkemeye verilmesi hâlinde, anlaşma aranmaksızın, taahhütnamede belirtilen süre kadar, soruşturma veya kovuşturmanın durmasına, hükmün infazının ertelenmesine veya durdurulmasına karar verilir. Bu durumda, ödeme süresi, taahhütnamenin yapıldığı tarihten itibaren iki yılı geçemez. Taahhütnamede yer alacak birinci yıl taksidi, borcun üçte birinden az olamaz. Taahhütnamenin bir örneği alacaklıya gönderilir.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkrada yazılı anlaşma veya taahhütnamenin en geç 1/4/2010 tarihine kadar düzenlenmiş ve mercîlerine verilmiş olması şarttır. Birinci fıkranın (b) bendinden yararlanan kişi, taahhütnamede belirttiği süre içinde şikâyetçi ile anlaşmaya varması ve bu anlaşmanın bir nüshasının şikâyetçi veya yasal temsilcisi tarafından mercilerine verilmiş olması hâlinde, aynı fıkranın (a) bendi hükmünden yararlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Soruşturma veya kovuşturmanın durması hâlinde dava zamanaşımı; hükmün infazının ertelenmesi veya durdurulması hâlinde ise ceza zamanaşımı işlemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Anlaşmanın gereği gibi ifa edilmiş veya bu Kanunun 6 ncı maddesi hükmüne göre ödenmesi gereken miktarın ödenmiş olması hâlinde; kovuşturmaya yer olmadığına, davanın düşmesine veya hükmün bütün sonuçlarıyla ortadan kaldırılmasına karar verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Şikâyetçinin başvurusu üzerine, anlaşma veya taahhüde uyulmadığının tespiti hâlinde, soruşturmaya, kovuşturmaya veya hükmün infazına devam edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Soruşturma veya kovuşturması durdurulan ya da hükmün infazı ertelenen veya durdurulan kişi hakkında Ceza Muhakemesi Kanununun 109 uncu maddesinin üçüncü fıkrasının (a) bendinde yer alan adlî kontrol tedbirine karar verilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="GEÇİCİ">
    <mvz-fıkra no="1">
      <template>Bankalar, Türkiye Cumhuriyet Merkez Bankasınca bu maddenin yayımı tarihinden itibaren bir ay içinde 2 nci maddeye göre yayımlanacak tebliğde belirlenen esaslara uygun olarak yeni çek defterleri bastırırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bankalar, 31/12/2012 tarihine kadar müşterilerine yeni çek defterlerini verir ve ellerindeki eski çek defterlerini imha ederler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu Kanunun bu maddenin yayımı tarihinden önce yürürlükte bulunan hükümleri ile mülga 3167 sayılı Kanun hükümleri gereğince düzenlenmiş olan eski çeklerin hukukî geçerliliği devam eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bankaların müşterilerine verdikleri eski çek defterleriyle ilgili olarak, muhatap bankanın 3 üncü maddenin üçüncü fıkrasına göre ödemekle yükümlü olduğu tutara ilişkin sorumluluğu 30/6/2018 tarihinde sona erer.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>31/12/2025 tarihine kadar, üzerinde yazılı düzenleme tarihinden önce çekin ödenmek için muhatap bankaya ibrazı geçersizdir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu maddenin yayımı tarihinden önce verilen çek düzenleme ve çek hesabı açma yasağı kararlarına ilişkin kayıtlar, 6 ncı maddede düzenlenen yasağın kaldırılmasına ilişkin şartlar oluşuncaya kadar Türkiye Cumhuriyet Merkez Bankasında tutulmaya devam olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Bu Kanun hükümlerine göre suç karşılığı uygulanan yaptırımı, idarî yaptırıma dönüştürülen fiiller nedeniyle,</template>
      <mvz-bent no="a">
        <template>Soruşturma evresinde bulunan dosyalar hakkında Cumhuriyet başsavcılığınca,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Kovuşturma evresinde bulunan dosyalar hakkında mahkemece,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>idarî yaptırım kararı verilir. Yargıtay Cumhuriyet Başsavcılığında bulunan dosyalar hakkında Yargıtay Cumhuriyet Başsavcılığınca, Yargıtayın ilgili dairesinde bulunan dosyalar hakkında ise ilgili dairece, bu Kanuna göre işlem yapılmak üzere dava dosyası hükmü veren mahkemeye gönderilir ve bu mahkeme tarafından duruşma yapılmaksızın karar verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="GEÇİCİ">
    <mvz-fıkra no="1">
      <template>Bu maddenin yürürlüğe girmesinden önce verilen çek düzenleme ve çek hesabı açma yasağına ilişkin kayıtlar, bu Kanun gereğince silinmesini gerektiren şartlar oluşuncaya kadar Türkiye Cumhuriyet Merkez Bankasında tutulmaya devam olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="GEÇİCİ">
    <mvz-fıkra no="1">
      <template>5 inci maddede tanımlanan ve 30/4/2021 tarihine kadar işlenen suçtan dolayı mahkûm olanların cezalarının infazı durdurulur. Hükümlü 30/6/2022 tarihine kadar çek bedelinin bu fıkrada değişiklik yapan Kanunun yayımı tarihi itibarıyla ödenmeyen kısmının onda birini alacaklıya ödemek zorundadır. Kalan kısmını 30/6/2022 tarihinden itibaren ikişer ay arayla on beş eşit taksitle ödemesi durumunda mahkemece, ceza mahkûmiyetinin bütün sonuçlarıyla ortadan kaldırılmasına karar verilir. 30/6/2022 tarihine kadar çek bedelinin ödenmeyen kısmının onda birinin ödenmemesi halinde alacaklının şikâyeti üzerine mahkemece hükmün infazının devamına karar verilir. Hükümlü taksitlerden birini süresi içinde ilk defa ödemediği takdirde ödemediği bu taksit, sürenin sonuna bir taksit olarak eklenir. Kalan taksitlerden birini daha ödemediği takdirde alacaklının şikâyeti üzerine mahkemece hükmün infazının devamına karar verilir. Bu fıkra hükümleri, 30/4/2021 tarihine kadar işlenmiş ve yargılaması devam eden suçlar bakımından, çek bedelinin ödenmeyen kısmının onda birinin 30/6/2022 tarihine kadar ve bu fıkrada belirtilen taksitlerin süreleri içinde alacaklıya ödenmesi koşuluyla, infaz aşamasında uygulanabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hükmün infazının durdurulması hâlinde ceza zamanaşımı işlemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu madde uyarınca infazı durdurulan kişi hakkında mahkemece Ceza Muhakemesi Kanununun 109 uncu maddesinin üçüncü fıkrasının (a) bendinde yer alan adlî kontrol tedbirine karar verilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu madde uyarınca verilecek kararlarda, hükmü veren icra ceza mahkemesi yetkilidir. Mahkemece bu madde uyarınca verilecek tüm kararlar alacaklıya tebliğ edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu madde uyarınca verilecek kararlara karşı itiraz kanun yoluna gidilebilir. İtirazın incelenmesinde İcra ve İflas Kanununun 353 üncü maddesinin birinci fıkrasında belirlenen itiraz usulü uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu madde hükümleri her bir suç için ancak bir kez uygulanabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
