  <mvz-künye tür="kanun" no="3201" başlık="YURT DIŞINDA BULUNAN TÜRK VATANDAŞLARININ YURT DIŞINDA GEÇEN SÜRELERİNİN SOSYAL GÜVENLİKLERİ BAKIMINDAN DEĞERLENDİRİLMESİ HAKKINDA KANUN"
             tarih="8/5/1985" rgazete-tarih="22/5/1985" rgazete-sayı="18761"
             düstur-tertip="5" düstur-cilt="24" düstur-sayfa="401" /> 
  
  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Türk vatandaşları ile doğumla Türk vatandaşı olup da çıkma izni almak suretiyle Türk vatandaşlığını kaybedenlerin on sekiz yaşını doldurduktan sonra Türk vatandaşı olarak yurt dışında geçen ve belgelendirilen sigortalılık süreleri ve bu süreleri arasında veya sonunda her birinde bir yıla kadar olan işsizlik süreleri ile yurt dışında ev kadını olarak geçen süreleri, bu Kanunda belirtilen sosyal güvenlik kuruluşlarına prim ödenmemiş olması ve istekleri hâlinde, bu Kanun hükümlerine göre sosyal güvenlikleri bakımından değerlendirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Tanımlar">
    <mvz-fıkra no="1">
      <template>Bu Kanunda geçen:</template>
      <mvz-bent no="a">
        <template>Sosyal güvenlik kuruluşları; Sosyal Güvenlik Kurumu ile 17/7/1964 tarihli ve 506 sayılı Sosyal Sigortalar Kanununun geçici 20 nci maddesine tabi sandıkları,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Sosyal güvenlik kanunları; 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu, 506 sayılı Sosyal Sigortalar Kanununun geçici 20 nci maddesi ile 24/5/1983 tarihli ve 2829 sayılı Sosyal Güvenlik Kurumlarına Tabi Olarak Geçen Hizmetlerin Birleştirilmesi Hakkında Kanun ile bu kanunlara ait ek ve değişiklikleri,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Sürelerin Değerlendirilmesi; Türk vatandaşlığını haiz olanların 1 inci maddede belirtilen sürelerinin istekleri halinde değerlendirilmesini,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>(Mülga)</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İfade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Başvurulacak kuruluşlar">
    <mvz-fıkra no="1">
      <template>Bu Kanunun 1 inci maddesinde belirtilenler ile yurt dışında çalışmakta iken veya yurda kesin dönüş yaptıktan sonra ölenlerin Türk vatandaşı olan hak sahipleri Sosyal Güvenlik Kurumuna müracaat etmek suretiyle bu Kanunla getirilen haklardan yararlanırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Sosyal güvenlik sözleşmeleri uygulanmak suretiyle kendilerine veya hak sahiplerine kısmi aylık bağlanmış olanların borçlanma işlemleri Sosyal Güvenlik Kurumunca yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Borçlanma tutarı ve borçlanma tutarının iadesi">
    <mvz-fıkra no="1">
      <template>Borçlanılacak her bir gün için tahakkuk ettirilecek borç tutarı, başvuru tarihindeki 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 82 nci maddesinde belirtilen prime esas asgari ve azamî günlük kazanç arasında seçilecek günlük kazancın %45’idir. Ancak, prime esas asgari günlük kazancın altında olmamak üzere borçlanma tutarına esas alt sınırı farklı bir miktarda belirlemeye Cumhurbaşkanı yetkilidir.   Tahakkuk ettirilen borç tutarı, tebliğ edildiği tarihten itibaren üç ay içerisinde ödenir. Ödeme yapılan gün sayısı prim ödeme gün sayısına ve prime esas kazanca dahil edilir. Tahakkuk ettirilen prim borcunu tebligat tarihinden itibaren üç ay içerisinde ödemeyenler için yeniden başvuru şartı aranır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Borçlanmadan sonradan vazgeçenler ile yapılan borçlanma sonrasında aylık bağlanması için gerekli şartları yerine getiremeyenlere ve bunların hak sahiplerine talepleri üzerine yaptıkları ödemeler, faizsiz olarak iade edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ancak yurt dışında iken borçlanma isteğinde bulunacak sigortalı veya hak sahipleri Yeni Türk Lirası olarak bildirilecek tutarın karşılığını cinsinden, Türkiye'de ise Yeni Türk Lirası olarak öderler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Süre tespiti, sigortalılığın başlangıcı ve sürelerin değerlendirilmesi">
    <mvz-fıkra no="1">
      <template>Yurt dışındaki sigortalılık sürelerinin tespitinde, bunu belirten ve istek sahibinin ibraz edeceği ispatlayıcı belgelerde kayıtlı bulunan tarihler arasındaki son tarihten geriye doğru olmak üzere gün sayıları esas alınır, bu tespitte 1 yıl 360 gün, 1 ay 30 gün hesaplanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Sosyal güvenlik kanunlarına tabi hizmetleri olanların, borçlandıkları gün sayısı, prim ödeme gün sayıları ile ilgili hizmetlerine katılır. Sigortalılığın başlangıç tarihinden önceki süreler borçlanılmış ise, sigortalılığın başlangıç tarihi, borçlanılan gün sayısı kadar geriye götürülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Sosyal güvenlik kuruluşlarına tabi hizmeti bulunmayan istek sahiplerinin sigortalılıklarının başlangıç tarihi, borçlarını tamamen ödedikleri tarihten borçlanılan gün sayısı kadar geriye götürülen tarihtir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yurt dışı hizmet borçlanmasına ait süreler 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi kapsamında geçmiş sigortalılık süresi olarak kabul edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Sosyal güvenlik sözleşmesi yapılmış ülkelerdeki hizmetlerini, bu Kanuna göre borçlananların, sözleşme yapılan ülkede ilk defa çalışmaya başladıkları tarih, ilk işe giriş tarihi olarak dikkate alınmaz. Ancak, uluslararası sosyal güvenlik sözleşmelerinde Türk sigortasına girişinden önce âkit ülke sigortasına girdiği tarihin Türk sigortasına girdiği tarih olarak kabul edileceğine ilişkin özel hüküm bulunan ülkelerdeki sigortalılık sürelerini borçlananların âkit ülkede ilk defa çalışmaya başladıkları tarih, ilk işe giriş tarihi olarak kabul edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Türkiye’deki sigortalılığın başlangıç tarihinden önceki sürelerin borçlandırılması hâlinde bu süreler 5510 sayılı Kanunun 41 inci maddesinde yer alan hükümler esas alınarak Türkiye’deki sigortalılık başlangıç tarihinden, Türkiye’de sigortalılık yok ise borçlanma tutarının tamamen ödendiği tarihten geriye götürülen sürelere ait ilgili aylara mal edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Aylık tahsisi ve aylığın başlama tarihi">
    <mvz-fıkra no="A">
      <template>Bu Kanuna göre değerlendirilen sürelere istinaden aylık tahsisi yapılabilmesi için;</template>
      <mvz-bent no="a">
        <template>Yurda kesin dönülmüş olması,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Tahakkuk ettirilen  borcunun tamamının ödenmiş olması,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>borcunun tamamının ödenmesinden sonra yazılı istekte bulunulması,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Yukarıdaki şartları yerine getirenlerden tahsise hak kazananların aylıkları, yazılı istek tarihini takip eden ay başından itibaren başlatılmak üzere 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu ve 506 sayılı Kanunun geçici 20 nci maddesi hükümlerine göre bağlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="B">
      <template>Kanun hükümlerinden yararlanmak suretiyle aylık bağlananlardan tekrar yurt dışında yabancı ülke mevzuatına tabi çalışanlar, ikamete dayalı bir sosyal sigorta ya da sosyal yardım ödeneği alanların aylıkları, tekrar çalışmaya başladıkları veya ikamete dayalı bir ödenek almaya başladıkları tarihten itibaren kesilir. Türkiye'de sigortalı olarak çalışmaya başlayanlar hakkında 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun sosyal güvenlik destek primine tabi olarak çalışılmasına ilişkin hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Yurt içinde veya yurt dışında çalışması sona erenlerin veya ikamete dayalı bir ödenek alanlardan ödenekleri sona erenlerin, aylıklarının tekrar ödenmesi için yazılı talepte bulunmaları halinde, talep tarihini izleyen ay başından itibaren aylıkları tekrar ödenmeye başlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="C">
      <template>Yurt dışında zorunlu sigortalılığa tabi olsalar dahi kısa süreli çalışma olarak adlandırılan işlerde çalışanların aylıkları bu madde kapsamında değerlendirilmez ve kesilmez. Bu maddede geçen kısa süreli çalışmaya tabi işler yönetmelik ile belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="T.C. Emekli Sandığınca bağlanacak aylığa ait esaslar">
    <mvz-fıkra no="1">
      <template>Mülga</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Bu Kanundan yararlanamayacaklar">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlük tarihinden önce veya sonra, 30/5/1978 tarih ve 2147 sayılı Kanun ve sosyal güvenlik kanunlarına göre kendilerine veya hak sahiplerine aylık bağlanmış olanlar ile aylık bağlanması için müracaat edip de aylığa hak kazanmış durumda bulunanlar bu Kanundan yararlanamazlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Kısmi aylıklar">
    <mvz-fıkra no="1">
      <template>Sosyal güvenlik sözleşmeleri uygulanmak suretiyle sosyal güvenlik kanunlarına göre kendilerine veya hak sahiplerine kısmi aylık bağlanmış olanlar, talep ettikleri takdirde, 4 üncü madde hükmüne göre tahakkuk ettirilen borçlarını tamamen ödemeleri şartıyla kısmi aylıkları, borçlarını ödedikleri tarihi takip eden aybaşından itibaren kısmi aylığın başlangıç tarihi esas alınarak mülga 2829 sayılı Kanun ya da 5510 sayılı Kanunun 53 üncü maddesi uyarınca tespit edilecek statüye göre ilgili sosyal güvenlik kuruluşunca tam aylığa çevrilir. Bu uygulamada borç miktarının tahakkukunda sözleşme akdedilen ülkenin sigorta kurumlarınca gönderilmiş olan hizmet cetvelindeki, tam aylığa yeterli olan gün sayıları nazara alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ancak, istekleri halinde sigortalı veya hak sahipleri, hizmet cetvelindeki gün sayılarının tamamını da borçlanabilirler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Sosyal güvenlik sözleşmeleri ile transferi sağlanan primlerin iadesi">
    <mvz-fıkra no="1">
      <template>Türk vatandaşları hesabına yabancı ülkelerdeki sosyal güvenlik kurumlarına yatırılmış bulunan primlerin, ülkelerarası anlaşmalarla Türkiye'ye transferlerinin sağlanması halinde;</template>
      <mvz-bent no="a">
        <template>Transfer olunan primlere ilişkin sürelerin tamamını bu Kanuna göre borçlanarak, tahakkuk ettirilen 1 borcunu da ödemiş olanlara, transfer olunan primlerin tamamı,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Transfer olunan primlere ilişkin sürelerin bir kısmını bu Kanuna göre borçlanarak tahakkuk ettirilen 1 borcunu da ödemiş olanlara, transfer olunan primlerin borçlandıkları süreye isabet eden orandaki miktarı,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Transfer tarihindeki cari kur üzerinden Türk Lirası karşılığı olarak ilgili sosyal güvenlik kuruluşunca sigortalıya, hak sahiplerine veya mirasçılarına iade edilir.</template>
    </mvz-fıkra>
  </mvz-madde>

  <mvz-madde no="6" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Sosyal güvenlik sözleşmesi imzalanmamış ülkelerden 1/1/1989 tarihinden bu maddenin yürürlüğe girdiği tarihe kadar zorunlu göçe tabi tutulan, Türk vatandaşı olup Türkiye’de ikamet eden ve 1/7/1976 tarihli ve 2022 sayılı Kanun dahil olmak üzere sosyal güvenlik kuruluşlarından gelir veya aylık almamak koşulu ile yurt dışında geçen ve belgelendirilen çalışma süreleri bu Kanuna göre borçlandırılmak suretiyle yaşlılık aylığı bağlanmasında sosyal güvenlikleri bakımından değerlendirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu maddenin yürürlüğe girdiği tarihten önce hizmet borçlanması talebinde bulunanlardan; borç tahakkuku yapılmış olanların, borç tahakkuku ile ilgili işlemleri devam edenlerin, tahakkuk ettirilen borçlarını ödeyenlerin ve borçlandıkları yurtdışı hizmetleri dikkate alınarak aylık bağlanmış olanların kazanılmış hakları saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>5510 sayılı Kanunun yürürlüğe girdiği tarihten sonra ilk defa aynı Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında sigortalı olarak çalışmaya başlayanların 5510 sayılı Kanunun yürürlüğe girdiği tarihten önceki yurtdışı borçlanma süreleri de, aynı Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi kapsamında değerlendirilir. Bunların aylıklarının hesabında 5510 sayılı Kanunun geçici 2 nci maddesi hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu Kanunun uygulamasında 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrası, 82 nci maddesi, 106 ncı maddesinin birinci fıkrasının (24) numaralı bendi ve geçici 7 nci maddesinin dördüncü fıkrası bu maddenin yayımı tarihinde yürürlüğe girmiş sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Davalardan vazgeçenlerin işlemleri" tür="Geçici">
    <mvz-fıkra no="1">
      <template>1 inci madde ile 5 inci maddenin beşinci fıkrasında bu maddeyi ihdas eden Kanunla yapılan değişiklikler, bu maddenin yürürlüğe girdiği tarihten önce Kurum aleyhine, bu Kanunun bu maddenin yürürlük tarihinden önceki 1 inci maddesi ile 5 inci maddesinin beşinci fıkrası uyarınca açılmış ve henüz sonuçlanmamış davalardan feragat edenler hakkında da uygulanır. Davadan feragat edilmesi hâlinde davacı aleyhine yargılama giderlerine hükmedilmez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Kısmi aylık bağlanmış olanlar dahil olmak üzere bu maddenin yürürlük tarihinden önce yurt dışında geçen sürelerini borçlanma talebinde bulunanlardan tahakkuk ettirilen borçlarını yasal süresi içinde ödeyenlerin, sigortalılık sürelerinin hangi statüde değerlendirileceğinin ve tahakkuk ettirilecek borç tutarının tespitinde önceki hükümler esas alınır.</template>
    </mvz-fıkra>
  </mvz-madde>
