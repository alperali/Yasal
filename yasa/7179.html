  <mvz-künye tür="kanun" no="7179" başlık="ASKERALMA KANUNU"
             tarih="25/6/2019" rgazete-tarih="26/6/2019" rgazete-sayı="30813"
              />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, yükümlülük esasına göre silahaltına alınacakların yoklama, sınıflandırma, celp, sevk, erteleme, muafiyet, muvazzaflık işlemleri ile cezalı yükümlülere yapılacak işlemler, Türk Silahlı Kuvvetlerinden çeşitli statülerde görev yaparken ayrılan personel dâhil olmak üzere yedeklik dönemleri ile Türk Silahlı Kuvvetlerine çeşitli statülerde katılan personelin askerlik yükümlülüğünü yerine getirmiş sayılması ve bunlardan askerlik hizmetini tamamlamamış bulunanların işlemlerine ilişkin usul ve esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, Türkiye Cumhuriyeti vatandaşı olan her erkek için uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Askerlik çağı: Nüfus kayıtlarına göre her erkeğin 20 yaşına girdiği yılın ocak ayının birinci gününden başlayan ve 41 yaşına girdiği yılın ocak ayının birinci gününde biten süreyi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Askerlik hizmeti: Türkiye Cumhuriyeti Anayasasının 72 nci maddesine göre her Türkün hak ve ödevi olan vatan hizmetinin bu Kanun esaslarına göre yerine getirilmesini,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Askerlik şubesi: Yükümlülerin nüfusuna kayıtlı bulundukları yer askerlik şubesini,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bakanlık: Milli Savunma Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bakaya: Sevke tabi olduğu hâlde sevkini yaptırmayanlar ile sevk edildiği birliğe katılmayanları,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bedelli askerlik: Kanunda belirtilen yararlanma şartlarını taşımak kaydıyla bedelli askerliğe seçilenlerin belirlenen bedeli ödemesi ve temel askerlik eğitimi yapması şartı ile yerine getirilen askerlik hizmetini,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Celp ve sevk: Yükümlülerin silahaltına alınmak üzere çağrılması ve birliklerine gönderilmesini,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Çok vatandaşlık: Türk vatandaşının aynı anda birden çok vatandaşlığa sahip olmasını,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Dövizle askerlik: Yurt dışında bulunan vatandaşlarımızdan bu Kanunda belirtilen usul ve esasları yerine getirenlerin askerlik hizmetini yerine getirmiş sayılmalarını,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Er: İhtiyaçları Devlet tarafından üstlenilen rütbesiz asker kişileri,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Erbaş: İhtiyaçları Devlet tarafından üstlenilen onbaşı ve çavuş rütbelerini haiz asker kişileri,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Erteleme: Bu Kanunda yazılı nedenlerle askerlik hizmetine alımın geçici süreyle geri bırakılmasını,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Firar: Kıtasından veya görevi icabı bulunmak zorunda olduğu yerden izinsiz olarak altı günden fazla uzaklaşmayı,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Geçici terhis: Kanuni bir mazerete dayalı olarak askerlik hizmet süresinin geçici olarak durdurulmasını,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Geç iltihak bakayası: Sevkini yaptırdığı hâlde kendisine tanınan yol süresi dışında birliğine katılanları,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Hava değişimi/izin tecavüzü: Kıtasından veya görevini yapmakta olduğu yerden izin, istirahat veya hava değişimi alarak ayrılanlardan, dönmeye mecbur bulundukları günden itibaren altı gün içerisinde özürsüz olarak gelmemeyi,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Hizmet süresi: Bu Kanunda belirtilen muvazzaf askerlik sürelerini,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Muafiyet: Bu Kanunda yazılı nedenlerle askerlik hizmetinin yerine getirilmemesini,</template>
        </mvz-bent>
        <mvz-bent no="ö">
          <template>Muvazzaf: Askerlik hizmetini yerine getirmek üzere silahaltına alınanları,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>Muvazzaflık dönemi: Yükümlünün sevk belgesinde yazılı sevk tarihi ile başlayıp terhis tarihine kadar geçen süreyi,</template>
        </mvz-bent>
        <mvz-bent no="r">
          <template>Noksan hizmetli: Tabi olduğu muvazzaflık süresinden eksik hizmet yaptığı tespit edilenleri,</template>
        </mvz-bent>
        <mvz-bent no="s">
          <template>Sağlık kararı: Yükümlülerin askerliğe elverişli olup olmadıkları hakkında tek hekim veya sağlık kurullarınca verilen kararı,</template>
        </mvz-bent>
        <mvz-bent no="ş">
          <template>Sağlık kurulu: Sağlık Bakanlığınca belirlenen sağlık raporu vermeye yetkili sağlık kuruluşları bünyesinde oluşturulan heyeti,</template>
        </mvz-bent>
        <mvz-bent no="t">
          <template>Saklı: Yirmi yaşına girmiş oldukları hâlde isimlerini nüfus kayıtlarına geçirmemiş bulunanları,</template>
        </mvz-bent>
        <mvz-bent no="u">
          <template>Sefer görev emri: Sefer görevi verilen yedek personelin seferberlik ve savaş hâlinde nereye gideceğini, ne kadar zaman içinde birliğine katılacağını ve katılacağı birliğin seferberlik numarasını bildiren belgeyi,</template>
        </mvz-bent>
        <mvz-bent no="ü">
          <template>Sınıflandırma: Yükümlülerin; sağlık durumları, öğrenimleri, meslekleri, fiziki yetenekleri ve Bakanlıkça tespit edilecek diğer niteliklerinin bilgi sistemi ortamında değerlendirilmesini,</template>
        </mvz-bent>
        <mvz-bent no="v">
          <template>Silahaltı davetiyesi: Barışta manevra, tatbikat, atış ve konferanslar gibi öğretim ve eğitim maksadıyla silahaltına alınacak personelle araçların çağrılmasına ilişkin belgeyi,</template>
        </mvz-bent>
        <mvz-bent no="y">
          <template>Temel askerlik eğitimi: Silahaltına alınan yükümlülere sınıf farkı gözetmeksizin bedenen ve ruhen askerlik hizmetine hazırlayıcı temel bilgi, beceri ve alışkanlıkları kazandırmak amacıyla verilen ve süresi Bakanlıkça belirlenen eğitimi,</template>
        </mvz-bent>
        <mvz-bent no="z">
          <template>Terhis: Muvazzaflık hizmet süresini tamamlayan veya tamamlamış kabul edilen yükümlülerin, yedeklik döneminde silahaltına alınıp hizmetine ihtiyaç kalmayanlar ile özel kanunlarla Türk Silahlı Kuvvetlerine katılan ve resmî bir kıyafet taşıyan kişilerin çeşitli nedenlerle Türk Silahlı Kuvvetlerinden ayrılmalarını,</template>
        </mvz-bent>
        <mvz-bent no="aa">
          <template>Yedek astsubay: Yedek astsubay adaylarından öğrenimini müteakip astsubay astçavuş nasbedilenleri,</template>
        </mvz-bent>
        <mvz-bent no="bb">
          <template>Yedek astsubay adayı: Yapılan seçim ve sınıflandırma sonucu yedek astsubay statüsüne ayrılanlardan, astsubay astçavuş nasbedilinceye kadar geçen dönemde bulunan yükümlüleri,</template>
        </mvz-bent>
        <mvz-bent no="cc">
          <template>Yedek astsubay aday adayı: İki veya üç yıl süreli yükseköğretim kurumlarından mezun olanlar ve bunların yetkili makamlarca dengi olduğu kabul edilen yurt dışı öğrenim kurumu mezunları ile dört yıl ve daha fazla süreli yükseköğretim kurumlarından mezun olanlar ve bunların yetkili makamlarca dengi olduğu kabul edilen yurt dışı öğrenim kurumu mezunlarından istekli olan yükümlüleri,</template>
        </mvz-bent>
        <mvz-bent no="çç">
          <template>Yedek personel: Bu Kanun hükümlerine göre askerlik hizmetini yerine getirenler ile yerine getirmiş sayılanları,</template>
        </mvz-bent>
        <mvz-bent no="dd">
          <template>Yedek subay: Yedek subay adaylarından öğrenimini müteakip asteğmen nasbedilenleri,</template>
        </mvz-bent>
        <mvz-bent no="ee">
          <template>Yedek subay adayı: Yapılan seçim ve sınıflandırma sonucu yedek subay statüsüne ayrılanlardan, asteğmen nasbedilinceye kadar geçen dönemde bulunan yükümlüleri,</template>
        </mvz-bent>
        <mvz-bent no="ff">
          <template>Yedek subay aday adayı: Dört yıl ve daha fazla süreli yükseköğretim kurumlarından mezun olanlar ile yetkili makamlarca dengi olduğu kabul edilen yurt dışı öğrenim kurumu mezunu olan yükümlüleri,</template>
        </mvz-bent>
        <mvz-bent no="gg">
          <template>Yedeklik dönemi: Muvazzaflık döneminin bitiminden askerlik çağının sonuna kadar olan süreyi,</template>
        </mvz-bent>
        <mvz-bent no="ğğ">
          <template>Yedeklik hizmeti: Yedek personelin, yedeklik dönemi içerisinde ihtiyaç duyulduğunda silahaltına alınarak yerine getirdiği askerlik hizmetini,</template>
        </mvz-bent>
        <mvz-bent no="hh">
          <template>Yoklama: Yükümlülerin sağlık muayenelerinin yapılarak askerliğe elverişli olup olmadıkları, öğrenim durumları, meslekleri ve niteliklerinin tespitini,</template>
        </mvz-bent>
        <mvz-bent no="ıı">
          <template>Yoklama dönemi: Askerlik çağının başlangıcından muvazzaflık hizmetinin başlangıç tarihine kadar geçen süreyi,</template>
        </mvz-bent>
        <mvz-bent no="ii">
          <template>Yoklama kaçağı: Tabi olduğu yoklama yılı içerisinde yoklamasını yaptırmayanları,</template>
        </mvz-bent>
        <mvz-bent no="jj">
          <template>Yükümlü: Askerlik hizmetini bu Kanun hükümleri gereğince yerine getirmek veya yerine getirmiş sayılmak zorunda olan erkek Türk vatandaşını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Genel Esaslar">
    <mvz-madde no="4" başlık="Askerlik yükümlülüğü">
      <mvz-fıkra no="1">
        <template>Türkiye Cumhuriyeti vatandaşı olan her erkek, askerlik hizmeti yapmaya mecburdur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Askerlik hizmeti bu Kanun hükümlerine göre yedek subay, yedek astsubay, erbaş ve er olarak yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Askeralma işlemleri Bakanlıkça yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Savaş veya savaşı gerektirecek bir durumun baş göstermesi hâlinde, bu Kanuna tabi yükümlülerin askerlik hizmetini yerine getirmek üzere silahaltına alınmalarının esasları Cumhurbaşkanı tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Askerlik çağı ve hizmet süresi">
      <mvz-fıkra no="1">
        <template>Askerlik çağı; yoklama, muvazzaflık ve yedeklik olmak üzere üç döneme ayrılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hizmet süresi; erbaş ve erler için altı ay, yedek subay ve yedek astsubaylar için on iki aydır. Hizmet sürelerini, ihtiyaca göre bir katına kadar artırmaya veya yarısına kadar azaltmaya Cumhurbaşkanınca karar verilebilir. Bu şekilde belirlenen hizmet süresi altı aydan az olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Erbaş ve erlerden istekli olanlar, sıralı disiplin amirlerinin olumlu değerlendirmesi ile terhise hak kazandığı tarihten itibaren Bakanlıkça uygun görülecek sayıda ve altı ay süre ile sınırlı olmak üzere bu Kanun hükümlerine göre askerlik hizmetlerine devam eder ve bu sürenin sonunda terhis edilir. Bu şekilde askerlik hizmetine devam edenlerin vazgeçme talepleri kabul edilmez. Bunlar hakkında muvazzaflık dönemi için askerlik hizmetinden sayılmayan sürelere ilişkin hükümler uygulanmaz. Bu yükümlüler hakkında ilk altı aylık hizmet süresi için ayrı, diğer altı aylık hizmet süresi için ayrı terhis belgesi tanzim edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Üçüncü fıkra kapsamında askerlik hizmetine devam edenlerin sayı, istek, tercih durumları ve özlük hakları bu Kanun hükümlerine uygun olarak ilgili kuvvet komutanlıkları tarafından yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Askerlik hizmetine devam etmek için müracaat edenlerde aşağıdaki nitelikler aranır:</template>
        <mvz-bent no="a">
          <template>Kamusal hakları kullanmaktan yoksun bırakılmamış olmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Cezaları ertelenmiş, seçenek yaptırımlardan birisine çevrilmiş, genel ya da özel af kanunları kapsamına girmiş veya haklarında hükmün açıklanmasının geri bırakılmasına karar verilmiş olsa dahi;</template>
          <mvz-altbent no="1">
            <template>Devletin güvenliğine karşı işlenen suçlar, halkı askerlikten soğutmak, Türk Milletini, Türkiye Cumhuriyeti Devletini, Devletin kurum ve organlarını aşağılama ile zimmet, irtikâp, iftira, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, yalan tanıklık, yalan yere yemin, suç uydurma, cinsel saldırı, cinsel taciz, kişiyi hürriyetinden yoksun bırakmak, fuhuş, gayri tabii mukarenet, hileli iflas gibi yüz kızartıcı veya şeref ve haysiyet kırıcı suçlar ile kaçakçılık, ihaleye fesat karıştırma, Devlet sırlarını açığa vurma suçlarından,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Firar, amir veya üste fiilen taarruz, emre itaatsizlikte ısrar, üste hakaret, mukavemet, fesat ve isyan suçlarından,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>22/5/1930 tarihli ve 1632 sayılı Askerî Ceza Kanununun 148 inci maddesinde belirtilen suçlardan,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>birisinden mahkûm olmamak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Taksirli suçlar hariç olmak üzere bir suçtan bir ay veya daha fazla hapis cezası ile mahkûm olmamak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Milli Güvenlik Kurulunca devletin millî güvenliğine karşı faaliyette bulunduğuna karar verilen yapı, oluşum veya gruplara ya da terör örgütlerine üyeliği, mensubiyeti veya iltisakı yahut bunlarla irtibatı bulunmamak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Terör örgütleriyle eylem birliği içerisinde olmamış, bu örgütlere yardım etmemiş, kamu imkân ve kaynaklarını bu örgütleri desteklemeye yönelik kullanmamış ya da kullandırmamış, bu örgütlerin propagandasını yapmamış olmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Arşiv araştırması olumlu sonuçlanmış olmak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Birlik Komutanlığınca hakkında olumlu nitelik belgesi doldurulmuş olmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Üçüncü fıkra kapsamında askerlik hizmetine devam edenlerden;</template>
        <mvz-bent no="a">
          <template>Disiplinsizlik ve ahlaki durum nedeniyle sıralı disiplin amirlerinin her türlü bilgi ve belgeye dayanarak düzenleyeceği nitelik belgesine göre askerlik hizmetine devam etmesi uygun görülmeyenler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Hizmetlerinde yetersiz ve başarısız oldukları sıralı disiplin amirlerinin her türlü bilgi ve belgeye dayanarak düzenleyeceği nitelik belgesi ile anlaşılanlar,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yetkili sağlık kurullarınca bu süre içerisinde hakkında “askerliğe elverişli değildir” kararlı sağlık raporu düzenlenmiş olanlar ile herhangi bir nedenle verilen istirahat veya hava değişimi süreleri toplamı yirmi günü geçenler,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yasa dışı siyasi, yıkıcı ve bölücü faaliyetlerde bulunanlar ile tutum ve davranışlarıyla bu görüşleri benimsediği tespit edilenler,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Herhangi bir suç sebebiyle on günden fazla tutuklu kalanlar,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Beşinci fıkrada belirtilen suçlardan hakkında mahkûmiyet kararı göreve başladıktan sonra kesinleşenler,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>asgari tabur komutanı ve eşiti askerî kurum amirince (Deniz ve Hava Kuvvetleri Komutanlıklarında eşiti) terhis edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Üçüncü fıkra kapsamında askerlik hizmetine devam edenlere bu görevlerinin devamı süresince, net asgari ücretten az olmamak üzere, 23/2/1961 tarihli ve 257 sayılı Er ve Erbaş Harçlıkları Kanunu hükümlerine göre harçlık ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Yedek subay ve yedek astsubay yetiştirme süreleri Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Askerlik hizmeti, askere ilk sevk sırasında verilen sevk belgesinde yazılı sevk tarihinde başlar. Belirtilen sürelerden fazla askerlik yapanların fazla hizmetleri, askerlik çağının sonundan iki kat olarak düşülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Askerlik çağı, Cumhurbaşkanınca beş yıla kadar uzatılabilir veya kısaltılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Bu Kanunda tespit edilen esaslar dışında muvazzaflık hizmetini yapmadıkça veya yapmış sayılmadıkça hiçbir yükümlü askerlik çağı dışına çıkarılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="İhtiyacın tespiti ve tahsisi">
      <mvz-fıkra no="1">
        <template>Genelkurmay Başkanlığı, Türk Silahlı Kuvvetlerinin ihtiyaç miktarını ve tahsis oranını Bakanlığa bildirir. Bakanlıkça ihtiyaç miktarı ve oranlarına göre tahsis yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Yedek subay seçimi">
      <mvz-fıkra no="1">
        <template>Dört yıl veya daha fazla süreli yükseköğretim kurumlarından mezun olanlar ile yetkili makamlarca dengi olduğu kabul edilen yurt dışı öğrenim kurumu mezunu olanlardan, Türk Silahlı Kuvvetlerinin ihtiyaç miktarı kadarı yedek subay adayı olarak ayrılır. Türk Silahlı Kuvvetlerinin ihtiyaç duyduğu yedek subay miktarından fazla olan yükümlülerden; istekli olanlardan ihtiyaç miktarı kadarı askerlik hizmetini yedek astsubay, diğerleri erbaş ve er olarak yerine getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yükümlülerin yedek subay adayı statüsüne ayrılmasında öncelikle Türk Silahlı Kuvvetlerinin ihtiyacı olmak üzere yükümlülerin istekleri de dikkate alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Yedek astsubay seçimi">
      <mvz-fıkra no="1">
        <template>Türk Silahlı Kuvvetlerinin ihtiyacı kadar yedek astsubay adayları;</template>
        <mvz-bent no="a">
          <template>İki veya üç yıl süreli yükseköğretim kurumlarından mezun olanlar ile yetkili makamlarca dengi olduğu kabul edilen yurt dışı öğrenim kurumu mezunu olanlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Dört yıl ve daha fazla süreli yükseköğretim kurumlarından mezun olanlar ile yetkili makamlarca dengi olduğu kabul edilen yurt dışı öğrenim kurumu mezunlarından istekli olanlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>arasından seçilir. Türk Silahlı Kuvvetlerinin ihtiyaç duyduğu yedek astsubay miktarından fazla olan yükümlüler askerlik hizmetini erbaş ve er olarak yerine getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yükümlülerin yedek astsubay adayı statüsüne ayrılmasında öncelikle Türk Silahlı Kuvvetlerinin ihtiyacı olmak üzere yükümlülerin istekleri de dikkate alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Bedelli Askerlik">
    <mvz-madde no="9" başlık="Bedelli askerlik">
      <mvz-fıkra no="1">
        <template>İstekli ve askerliğe elverişli olanlardan Türk Silahlı Kuvvetlerinin ihtiyacı dikkate alınarak Bakanlıkça belirlenecek sayıda yükümlü, 240.000 gösterge rakamının ödemenin yapıldığı gün geçerli olan memur aylık katsayısı ile çarpımı sonucu bulunacak bedel tutarını silahaltına alınmadan önce Bakanlıkça belirlenecek sürede peşin ödemeleri ve bir aylık temel askerlik eğitimini tamamlamaları hâlinde askerlik hizmetini yerine getirmiş sayılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İstekli sayısının bedelli askerlik için belirlenen sayıdan fazla olması hâlinde, bedelli askerlikten yararlanabilecek olanlar kura ile seçilir. İstekli sayısının yararlandırılacak sayısından az olması durumunda kura çekimi yapılmadan tüm istekliler bedelli askerlik hizmeti için seçilir.    Seçim sonrasında bedelli askerlikten yararlanma hakkı elde edip de vazgeçenlere yeni bir hak verilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu uygulama kapsamında tahsil edilen tutarlar genel bütçeye gelir kaydedilmek üzere Bakanlık merkez muhasebe birimi hesabına yatırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bedel ödenmesi ve uygulamaya ilişkin esaslar Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu madde kapsamında sevke tabi olanlardan katılmayarak bakaya kalanlar ile aynı celpte sevke tabi tutulan emsallerinin terhise hak kazanacağı tarihe kadar katılmayanlar kapsam dışına çıkarılarak bu kişilere erbaş ve er statüsünde askerlik hizmetleri tamamlattırılır. Kapsam dışına çıkartılanlara talepleri hâlinde geri ödeme yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bedelli askerlik hizmetinden;</template>
        <mvz-bent no="a">
          <template>Fiilî askerlik hizmetine başlayanlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Müracaat tarihine kadar yoklama kaçağı, saklı veya bakaya olanlardan, bedelli askerliğe müracaat edip de seçim öncesi vazgeçenler veya müracaat tarihinden itibaren iki ay içinde ödemelerini yapmayanlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yararlanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Müracaat tarihine kadar yoklama kaçağı, saklı veya bakaya olanlar hakkında, yoklama kaçağı, saklı veya bakaya kalınan tarihten müracaat tarihine kadar geçen sürenin her ayı için, bu maddenin birinci fıkrasındaki tutara ilave olarak ek bedel alınır. Ek bedel, 3.500 gösterge rakamının ödemenin yapıldığı gün geçerli olan memur aylık katsayısı ile geçerli mazeretler hariç yoklama kaçağı, saklı ve bakaya kaldıkları toplam sürenin her ayının çarpımı sonucu bulunur. Bu fıkrada belirlenen ek bedele esas sürenin hesabında, 1 ila 30 gün bir ay kabul edilir. Bir ayı aşan günler müteakip aya eklenerek hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Seferberlik ve savaş hâlinde bu madde hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Öğretmenler, Emniyet Hizmetleri Sınıfı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı Mensupları ile Tabiplerin Askerlik Hizmeti">
    <mvz-madde no="10" başlık="Öğretmenlerin askerlik hizmeti">
      <mvz-fıkra no="1">
        <template>Milli Eğitim Bakanlığının ihtiyaç göstermesi ve Bakanlığın uygun görmesi üzerine, yedek subay aday adayı olarak silahaltına alınacaklardan, Milli Eğitim Bakanlığı tarafından öğretmenlik mesleğini fiilen icra edenler arasından bildirilenler, temel askerlik eğitimini takiben Milli Eğitim Bakanlığı emrine verilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra uyarınca öğretmen olarak ayrılan ve göreve başlayan yükümlülere, 27/7/1967 tarihli ve 926 sayılı Türk Silâhlı Kuvvetleri Personel Kanununda asteğmenler için tespit edilen aylık, ödenek, yardım ve tazminatlar Milli Eğitim Bakanlığınca ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu yükümlüler; öğretmenlik görevleri sırasında resmî elbise giyemezler, emsali yedek subaylar kadar hizmet yaparlar, hizmetleri askerlik şubelerinden sevk tarihinde başlar, görev yerleri Milli Eğitim Bakanlığınca belirlenir, hizmetleri sonunda asteğmen olarak terhis edilirler, bu görevleri sırasında usulüne göre öğretmenlik mesleği ile ilişkileri kesilenler kalan hizmetlerini er olarak tamamlamak üzere kıtalara sevk edilirler ve Milli Eğitim Bakanlığı ile de ilişikleri kesilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Milli Eğitim Bakanlığı emrine verilenler hakkında firar, hava değişimi/izin tecavüzü, yoklama kaçağı, bakaya ve geç iltihak suretiyle bakaya kalmak suçlarına ilişkin 1632 sayılı Kanun ile kısa süreli kaçma ve izin süresini geçirme disiplinsizliklerine ilişkin 31/1/2013 tarihli ve 6413 sayılı Türk Silahlı Kuvvetleri Disiplin Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Bakanlık ile Milli Eğitim Bakanlığınca müştereken belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Seferberlik ve savaş hâlinde bu madde hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Emniyet Hizmetleri Sınıfı mensuplarının askerlik hizmeti">
      <mvz-fıkra no="1">
        <template>Emniyet Teşkilatı kadrolarında kadro ve/veya rütbeleri ile ilişkisi devam eden Emniyet Hizmetleri Sınıfına mensup personel ile polis eğitim ve öğretim kurumlarında öğrenim görenler veya bu kurumların giriş sınavlarını kazananlardan askerlik hizmetini yapmamış olanların her türlü askerlik işlemleri ertelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamındakilerden, Emniyet Hizmetleri Sınıfında on yıllık hizmet süresini, kamu görevinden sayılmayacak hâller hariç olmak üzere tamamlayanlar askerlik hizmetini yerine getirmiş sayılır. Geçici süreli görevlendirmeler, yurt dışı misyon koruma, yurt dışında eğitim ve diğer görevler sebebiyle geçirilen süreler de on yıllık hizmet süresinin hesabında dikkate alınır. Bu yükümlüler ile ilgili bilgiler, İçişleri Bakanlığınca Bakanlığa bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>On yıllık süre, birinci fıkra kapsamındaki eğitim ve öğretim kurumlarından mezun olarak fiilen göreve başlanılan tarihte başlar. On yıllık süreyi tamamlamadan herhangi bir nedenle Emniyet Hizmetleri Sınıfından ayrılan, başka kuruma nakledilen veya bu süre içinde meslekten ilişiği kesilen personel, bu Kanun hükümlerine göre askerlik hizmetini yerine getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Fiilî askerlik hizmeti başladıktan sonra birinci fıkra kapsamındaki eğitim ve öğretim kurumlarında öğrenim hakkı elde edenler tabi oldukları askerlik hizmet süresini tamamlamak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Seferberlik ve savaş hâlinde bu madde hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Jandarma Genel Komutanlığı ile Sahil Güvenlik Komutanlığı mensuplarının askerlik hizmeti">
      <mvz-fıkra no="1">
        <template>Jandarma ve Sahil Güvenlik Akademisinde veya Jandarma Genel Komutanlığı ile Sahil Güvenlik Komutanlığı adına üniversite, fakülte veya yüksekokullar ile meslek yüksekokullarında öğrenim görenler veya bu kurumların giriş sınavlarını kazananlardan askerlik hizmetini yapmamış olanların her türlü askerlik işlemleri ertelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı kadrolarında görevli muvazzaf ve sözleşmeli subay veya astsubaylar ile uzman erbaş ve sözleşmeli erbaş ve erlerin hizmette geçirdikleri sürelerin görevlerinden ayrıldıktan ve ilişikleri kesildikten sonra askerlik yükümlülüğünden sayılmasına ilişkin 48 inci madde hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Görevlerinden ayrılan veya ilişikleri kesilen uzman jandarmaların hizmette geçirdikleri sürelerin tamamı askerlik hizmetinden sayılır. Sayılan hizmet süresi erbaş ve erlerin tabi olduğu hizmet süresini karşılayanlar askerlik hizmetini yapmış sayılır. Hizmet süresini karşılamayanların eksik kalan süreleri, erbaş ve erlerin tabi olduğu hizmet süresi esas alınarak, bu Kanun hükümlerine göre erbaş ve er olarak tamamlattırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Jandarma ve Sahil Güvenlik Akademisinden veya Jandarma Genel Komutanlığı ile Sahil Güvenlik Komutanlığı adına okudukları üniversite, fakülte veya yüksekokullar ile meslek yüksekokullarından ilişiği kesilenlerin bu okullarda okudukları sürelerin askerlik hizmetinden sayılmasına ilişkin sürelerinin hesabında 46 ncı madde hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Tabiplerin askerlik hizmeti">
      <mvz-fıkra no="1">
        <template>Bakanlık ile Sağlık Bakanlığınca her celp ve/veya atama döneminde müştereken belirlenen yer ve miktarda yedek subay aday adayı olarak silahaltına alınacak tabipler temel askerlik eğitimini takiben Devlet hizmeti yükümlülüğünü yapmak üzere Sağlık Bakanlığı emrine verilir ve bu yükümlülüğü yerine getirinceye kadar geçici terhis edilir. Bunların her türlü özlük işleri Devlet hizmeti yükümlülüğünün devamı süresince Sağlık Bakanlığınca yürütülür. Bunlardan usulüne uygun olarak Devlet hizmeti yükümlülüğünü yerine getirdikleri Sağlık Bakanlığınca Bakanlığa bildirilenler askerlik hizmetini yerine getirmiş sayılır ve asteğmen olarak terhis edilir. Sağlık Bakanlığındaki bu görevleri sırasında usulüne göre tabiplik mesleği ile ilişkileri kesilenler kalan hizmetlerini er olarak tamamlamak üzere Sağlık Bakanlığı ile ilişikleri kesilerek Bakanlığa bildirilir. Devlet hizmeti yükümlülüğünü usulüne uygun olarak tamamlamayanlar hakkında 35 inci madde hükümleri uygulanır. Noksan hizmetin hesabında Devlet hizmeti yükümlülüğünde geçen süre dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık ile Sağlık Bakanlığınca her celp ve/veya atama döneminde müştereken belirlenen yer ve miktarda askerlik hizmetini yedek subay olarak yerine getiren tabipler Devlet hizmeti yükümlülüğünü tamamlamış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Bakanlık ile Sağlık Bakanlığınca müştereken belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Seferberlik ve savaş hâlinde bu madde hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Yoklama, Celp ve Sevk">
    <mvz-madde no="14" başlık="Yoklamanın genel esasları">
      <mvz-fıkra no="1">
        <template>Askerlik çağına gireceklerin kimlik bilgileri elektronik ortamda İçişleri Bakanlığından alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Askerlik çağına girenler ile bunlarla işleme tabi daha yaşlı doğumluların yoklaması, her yıl 1 Ocak günü başlar ve o yılın 31 Aralık  gününe kadar devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Askerlik çağına girmeden önce yaşları değişenlerin yoklamaları, değişen yaşlarına göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Askerlik çağına girdikten sonra yapılan yaş değişiklikleri, askerlik işlemlerinde dikkate alınmaz. Ancak kendi isteği dışındaki mahkeme kararına istinaden resen yapılan yaş değişiklikleri kabul edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Sağlık muayene ve onay işlemleri">
      <mvz-fıkra no="1">
        <template>Yükümlülerin sağlık muayeneleri Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı Sağlık Yeteneği Yönetmeliğinde belirtilen usul ve esaslara göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sağlık muayeneleri; öncelikle yükümlünün kayıtlı olduğu aile hekimi, yoksa müracaat ettiği askerlik şubesine en yakın resmî sağlık kuruluşundaki hekim tarafından yapılır. Aile hekimlerince veya resmî sağlık kuruluşunca hakkında karar verilmeyenler Sağlık Bakanlığınca belirlenen en yakın yetkili sağlık kurullarına sevk edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Askerliğe elverişli olup olmadıklarının tespiti için memuriyet mahalli dışındaki Sağlık Bakanlığınca belirlenen yetkili sağlık kurullarına gönderilmelerinde zaruret görülenlerin harcırahı, 10/2/1954 tarihli ve 6245 sayılı Harcırah Kanunu hükümlerine göre ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yapılacak sağlık muayenelerinden herhangi bir ücret veya katkı payı alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yükümlüler hakkında verilecek ertesi yıla bırakma, sevk geciktirmesi veya “askerliğe elverişli değildir” kararlı sağlık raporlarını tanzim etmeye yetkili makam, Sağlık Bakanlığınca belirlenen yetkili sağlık kuruluşunun sağlık kuruludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>“Askerliğe elverişli değildir” kararlı sağlık kurulu raporları, Bakanlığın onayını müteakip kesinleşir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Yurt dışında yaşayan yükümlülerin sağlık muayeneleri Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı Sağlık Yeteneği Yönetmeliğinde belirtilen esaslara göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Askerlik şubelerince engel durumunu bildirir geçerli sağlık raporu olanların raporları, askerliğe elverişli olup olmadıklarının tespiti için Bakanlığa gönderilir. Bakanlıkça bu raporlar Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı Sağlık Yeteneği Yönetmeliğinde belirtilen esaslara göre onaylanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Sağlık kararları">
      <mvz-fıkra no="1">
        <template>Yoklaması yapılanlar; askerliğe elverişli olanlar, geçici rahatsızlığı bulunanlar ve askerliğe elverişli olmayanlar olarak ayrılır. Askerliğe elverişli olmayanlar silahaltına alınmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Sağlık kararına itiraz">
      <mvz-fıkra no="1">
        <template>Haklarında verilen sağlık kararına itiraz edenler yeniden muayeneye gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Şikâyet ve ihbar edilenler ile idarece yeniden muayenesine lüzum görülenler">
      <mvz-fıkra no="1">
        <template>Muayeneleri sonucunda tanzim edilen askerlik yükümlülüğü ile ilgili sağlık raporları hakkında şikâyet veya ihbar edilen yükümlülerin sağlık durumları yurt içinde Sağlık Bakanlığı, yurt dışında Dışişleri Bakanlığı tarafından araştırılır. Araştırma sonucunda raporu gerçeği yansıtmadığına kanaat getirilenler, Sağlık Bakanlığınca belirlenen yetkili sağlık kurullarına sevk edilir. Sağlık kurulları tarafından verilen raporlara göre kesin işlem yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Muayeneleri sonucunda tanzim edilen raporlar hakkında idarece yeniden muayenesine lüzum görülenler, Sağlık Bakanlığınca belirlenen yetkili sağlık kurullarına sevk edilir. Sağlık kurulları tarafından verilen raporlara göre kesin işlem yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde kapsamında muayeneye sevk edilenlere, 15 inci maddenin üçüncü fıkrasına göre harcırah, silahaltında ise yol ve iaşe bedeli ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Yükümlülerin sorumlulukları">
      <mvz-fıkra no="1">
        <template>Yoklamaya tabi yükümlüler, Türkiye Cumhuriyeti kimlik numarası bulunan kimliği, öğrenim durumlarını, varsa meslek ve niteliklerini gösterir belgeler ile birlikte yurt içinde askerlik şubelerinde, yurt dışında elçilik veya konsolosluklarda bizzat hazır bulunmaya veya e-Devlet üzerinden bu işlemleri tamamlamaya mecburdur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yoklamaya tabi yükümlülerden yoklamada bulunamayacak derecede hastalığı bulunanlar ile tutuklu/hükümlü olanlar, usulüne uygun rapor göndermeye ve hükümlülük veya tutukluluklarını bildirmeye mecburdurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sevke tabi tutulan yükümlüler bizzat askerlik şubesinden veya e-Devlet üzerinden sevk belgelerini almaya ve kendilerine tebliğ edilen tarihte birliklerine katılmaya mecburdur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Erteleme">
      <mvz-fıkra no="1">
        <template>Yoklamaları veya askere sevkleri sırasında geçici rahatsızlığı nedeniyle askerlik yapamayacakları anlaşılanlar ile tutuklu ve hükümlü olanların askerlik işlemleri ertelenir. Geçici rahatsızlığı nedeniyle erteleme kararı verilenler rapor bitiminde yeniden muayeneye tabi tutulurlar. Aynı rahatsızlık nedeniyle ertelemesi üç yıl süreyle devam edenler hakkında askerliğe elverişli olup olmadıkları kararı verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yükümlülerin askerlikleri, lise veya dengi okullarda öğrenim görenler için 22 yaşını, fakülte ve yüksekokullar ile meslek yüksekokullarında öğrenim görenler için 28 yaşını tamamladıkları yılın sonunu geçmemek kaydıyla, mezun oluncaya veya ilişikleri kesilinceye kadar ertelenir. Bu kapsamda;</template>
        <mvz-bent no="a">
          <template>Bitirdiği okulun dengi veya daha alt seviyedeki bir öğretim kurumuna kayıt yaptıranların askerlikleri ertelenmez.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Çift anadal programına kayıtlı yükümlülerin bir programdan mezun olmaları hâlinde askerlik erteleme işlemleri diğer anadal programındaki öğrenciliğine göre yürütülür.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yoklama kaçağı veya bakaya kaldıktan sonra ya da 21 inci maddenin birinci fıkrası gereğince yoklama kaçağı olarak muayenesi yapılarak sınıflandırma kaynağına alınacaklardan; sevke tabi tutulacağı celp tarihine kadar okula kayıt yaptıranların bu fıkra kapsamında askerlikleri ertelenmez.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yurt dışında yükseköğretim kurumlarında öğrenim görenlerin askerlikleri, öğrenciliklerinin yetkili Türk makamlarınca tanınmasını müteakip yukarıdaki esaslara göre ertelenir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Öğrenim kurumlarından terk, ilişiği kesilen veya mezun olanlardan;</template>
        <mvz-bent no="a">
          <template>Lise veya dengi okuldan mezun olduğunu belgeleyenlerin askerlikleri istekleri hâlinde mezuniyet tarihinden itibaren üç yıl, mesleki ve teknik lise mezunları için ilave üç yıl, fakülte veya yüksekokul ile meslek yüksekokulundan ilişikleri kesilenler ile yüksekokul ve meslek yüksekokulu mezunlarının askerlikleri ise mezuniyet ya da ilişik kesme tarihinden itibaren iki yıl süreyle ertelenir. Bu erteleme süreleri lise veya dengi okul mezunları için 22, mesleki ve teknik lise mezunları için 25, fakülte veya yüksekokul ile meslek yüksekokulundan ilişikleri kesilenler ile yüksekokul ve meslek yüksekokulu mezunları için 28 yaşını tamamladıkları yılın sonunu geçemez.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Dört yıl ve daha uzun süreli yükseköğretim kurumlarından mezun olan yükümlülerin askerlikleri istekleri hâlinde iki yıla, yüksek lisans eğitimini tamamlayanların ise bir yıla kadar ertelenir. Yurt dışındaki öğrenim kurumlarından mezun olanlara, talepleri hâlinde, denklik işlemlerini tamamlayabilmeleri için ayrıca bir yılı geçmemek üzere erteleme hakkı tanınabilir. Bu bent gereğince yapılan erteleme süreleri 32 yaşını tamamladıkları yılın sonunu geçemez.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Erteleme süresi içerisinde yükseköğretim kurumuna kayıt yaptıranların askerlikleri öğrencilik nedeniyle ertelenir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Askerlik çağına girmeden önce lise veya dengi okullar yahut yüksekokullar veya meslek yüksekokullarından mezun olanlar ile fakülte veya yüksekokul ile meslek yüksekokulundan ilişiği kesilenlerin ertelemeleri, askerlik çağına girdikleri yıldan itibaren başlar.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bakanlıkça belirlenecek esaslar çerçevesinde;</template>
        <mvz-bent no="a">
          <template>Dört yıl ve daha uzun süreli yükseköğretim kurumlarından mezun olanlardan kamu kurum ve kuruluşlarında görevli olup hizmetinin özelliği sebebiyle ertelenmesine ihtiyaç duyulan kamu personelinin,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Devlet veya kendi hesaplarına yurt içinde veya yurt dışında staj ve yüksek lisans yapanların,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>bağlı oldukları bakanlığın, Cumhurbaşkanlığı ile Türkiye Büyük Millet Meclisi gibi herhangi bir bakanlığa bağlı veya ilgili bakanlığı bulunmayan kurum personeli ile staj ve yüksek lisans yapanların ilgili kurum amirinin teklifi üzerine, 32 yaşını tamamladıkları yılın sonuna kadar askerlikleri ertelenebilir.</template>
        <mvz-bent no="c">
          <template>Devlet veya kendi hesaplarına yurt içinde veya yurt dışında sanatta yeterlik, doktora veya ihtisas yapanların,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yükseköğrenim mezunlarından mesleklerine ait staj ve ihtisaslarını ikmal ettikten sonra, yurt içinde veya yurt dışında, çalıştıkları bilim dallarına dünya ölçüsünde bir yenilik veya ilerleme getiren orijinal araştırmalarda bulundukları, çalıştıkları ilim müesseselerince belgelenen ve talep edilenlerin,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Aktif spor hayatının Bakanlıkça çıkarılan yönetmelikte belirtilen şartlarda devam ettiğinin belgelendirilmesi ve müteakip ertelemesi için Bakanlıkça belirlenecek oran kadar kadroya girmek kaydıyla Gençlik ve Spor Bakanlığınca bildirilenlerin,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>bağlı oldukları bakanlığın, Cumhurbaşkanlığı ile Türkiye Büyük Millet Meclisi gibi herhangi bir bakanlığa bağlı veya ilgili bakanlığı bulunmayan kurum personeli ile ihtisas ve doktora yapanların ilgili kurum amirinin teklifi üzerine, 35 yaşını tamamladıkları yılın sonuna kadar askerlikleri ertelenebilir.</template>
        <mvz-bent no="e">
          <template>Yoklama kaçağı veya bakayalar ile 21 inci maddenin birinci fıkrası gereğince yoklama kaçağı olarak muayenesi yapılarak sınıflandırma kaynağına alınacakların, sevke tabi tutulacağı celp tarihine kadar geçen süre içinde bu fıkra kapsamında askerlikleri ertelenmez. Ancak, ertelemelerine neden olan görev, staj, yüksek lisans, ihtisas veya doktora öğrenimi başlangıç tarihleri ile sporcuların erteleme kapsamındaki kulüpleri ile yaptıkları sözleşme başlangıç tarihleri, yoklama kaçağı veya bakaya kaldıkları tarihten önce olanların ertelemeleri yapılabilir.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>10/10/2024 tarihli ve 7528 sayılı Öğretmenlik Mesleği Kanunu kapsamında Millî Eğitim Bakanlığı tarafından Millî Eğitim Akademisinde hazırlık eğitimine alınan öğretmen adaylarından askerlik yükümlülüğü bulunanların askerlik hizmetleri, Millî Eğitim Bakanlığının teklifi üzerine Millî Eğitim Akademisindeki eğitimleri süresince ertelenir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Erteleme şartlarını taşımadığı, bilgi veya belgeleri gerçeği yansıtmadığı hâlde askerliği ertelendiği tespit edilenlerin askerlik işlemleri, erteleme işlemi yapılmadan önceki durumları, erteleme şartlarını kaybettiği tespit edilenlerin ise, erteleme şartlarını kaybettikleri tarihteki durumları dikkate alınarak yürütülür. Askerlik işlemlerinin yürütülmesine ilişkin görevlerini veya sorumluluklarını zamanında yerine getirmediği tespit edilenler hakkında Cumhuriyet savcılıklarına suç duyurusunda bulunulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Savaş zamanı hariç olmak üzere, bir baba veya ananın iki oğlundan biri askerdeyken diğer oğlunun, ikiden fazla oğlu olanlardan ikisi askerde iken diğerlerinin askerlik işlemleri, baba veya ananın talebi üzerine oğullarından biri muvazzaf askerlik hizmetini bitirinceye kadar ertelenir. Bu fıkranın uygulanmasında 20 yaşından küçük olanlar ile geçime yardım edemeyecek derecedeki maluller hesaba katılmaz. Bu işlemler celp ve sevk zamanında, birlikte askere alınacaklar için ise baba veya ana hangisinin bırakılmasını isterse, onun bırakılması suretiyle yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Türkiye Büyük Millet Meclisi üyelerinin askerlikleri üyelik sıfatlarının sona erdiği tarihe kadar ertelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu madde kapsamında askerlikleri ertelenenler, seferberlik ve savaş hâlinde lüzum ve ihtiyaca göre askere sevk edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Yoklama kaçağı, saklı, bakaya ve geç iltihak bakayaları">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yazılı mazereti bulunduğuna dair belge ibraz etmeyenlerden;</template>
        <mvz-bent no="a">
          <template>Tabi olduğu yoklama yılı içerisinde yoklamasını yaptırmayanlar yoklama kaçağı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>20 yaşına girmiş oldukları hâlde isimlerini nüfus kayıtlarına geçirmemiş bulunanlar saklı,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sevke tabi olduğu hâlde sevkini yaptırmayanlar ile sevk edildiği birliğe katılmayanlar bakaya,</template>

        <mvz-bent no="ç">
          <template>Sevkini yaptırdığı hâlde kendisine tanınan yol süresi dışında birliğine katılanlar geç iltihak bakayası,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>olarak kabul edilir. Bu durumda bulunan yükümlüler hakkında 24 üncü madde hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yoklama kaçağı ve saklılardan; erteleme hakkı bulunanların talepleri hâlinde yoklamaları yapılmadan ertelenir, erteleme hakkı bulunmayanlardan, muayeneleri neticesinde askerliğe elverişli olduğu anlaşılanlar ilk sınıflandırma kaynağına alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yoklama kaçağı ve saklılardan sınıflandırıldıktan sonra bu Kanunda yazılı bir mazeret nedeniyle ertelemesi yapılanlar, ertelemelerinin bitimini müteakip ilk celp döneminde sevk edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Cezaevinden tahliye olanlar hariç er statüsündeki bakayalar ele geçirilmelerini müteakip derhâl sevk edilirler. Bunlardan bu Kanunda yazılı bir mazeret nedeniyle ertelemesi yapılanlar erteleme bitimini müteakip ilk mesai gününde sevk edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yedek subay ve yedek astsubay adayı statüsündeki bakayalar ise ele geçirildikten sonraki ilk celp döneminde sevk edilirler. Bunlardan bu Kanunda yazılı bir mazeret nedeniyle ertelemesi yapılanlar erteleme bitimini müteakip ilk celp döneminde sevk edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Celp ve sevk esasları">

        <template>Yoklamaları neticesinde askerliğe elverişli oldukları tespit edilenler Bakanlıkça belirlenecek esaslara göre askere sevk edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Barışta ve seferde silahaltına alınan yükümlülere yol ve iaşe bedeli ödenir.</template>

    <mvz-madde no="23" başlık="Sevke ilişkin mazeret hâlleri">

        <template>Askere sevk için çağrıldıkları hâlde;</template>

        <mvz-bent no="c">

        </mvz-bent>
        <mvz-bent no="ç">
          <template>Sevkten önceki veya sonraki on beş gün içinde eşinin, ikinci derece dâhil kan veya kayın hısımlarından birinin ölümü,</template>
        </mvz-bent>
        <mvz-bent no="d">

        </mvz-bent>

          <template>Sevkten önceki veya sonraki iki ay içinde çocuğunun doğması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
