      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamındaki yükümlülerden bakaya olanlara bu süreleri için 24 üncü maddenin birinci fıkrası hükmü uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkranın (b) bendi kapsamındakiler istirahati bitiminde derhâl sevk edilir. Diğerleri ise müteakip celbe bırakılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Seferberlik ve savaş hâlinde bu madde hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Yoklama kaçağı, saklı ve bakayalara verilecek cezalar">
      <mvz-fıkra no="1">
        <template>Barışta, kabul edilebilir bir özrü olmaksızın;</template>
        <mvz-bent no="a">
          <template>Yoklama kaçakları ve saklılar için, yoklama kaçağı kaldıkları tarihten,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakayalar için, bakaya kaldıkları tarihten,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Geç iltihak bakayaları için, kendilerine tanınan yol süresinin bitiminden,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yedeklerden çağrılanlar için, birlikte işleme tabi olanların en son gönderilme tarihinden,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>itibaren kaçak kaldıkları gün süresi kadar idari para cezası ile cezalandırılır. Bunlardan kendiliğinden gelenler her gün karşılığı 5 Türk lirası, yakalananlar ise her gün karşılığı 10 Türk lirası idari para cezası ile cezalandırılır. Bu fıkra kapsamında belirlenen idari para cezalarının yeniden değerlendirmesinde 30/3/2005 tarihli ve 5326 sayılı Kabahatler Kanununun 17 nci maddesinin yedinci fıkrası, bir Türk lirasının küsuru dikkate alınarak uygulanır. İdari para cezaları tebliğinden itibaren bir ay içinde ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yapılan muayenelerinde askerliğe elverişli olmadıkları anlaşılanlar, askerlikten muafiyet hakkı olanlar ile bu Kanunda belirtilen nedenlerle erteleme hakkı olduğu hâlde süresi içerisinde işlem yaptırmayanlara erteleme sürelerine denk gelen günler için idari para cezası uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İdari para cezası vermeye yetkili makam; askerlik şubesine bizzat müracaat eden yükümlüler için müracaat ettiği, kolluk kuvvetleri tarafından getirilen yükümlüler için ise getirildiği askerlik şubesi başkanı; bunun dışındaki durumlar için ise nüfusa kayıtlı olduğu yer askerlik şubesi başkanıdır. Yükümlünün bizzat müracaat ettiği veya getirildiği askerlik şubesi başkanınca uygulanan idari para cezası derhâl yükümlünün nüfusa kayıtlı olduğu yer askerlik şubesi başkanlığına bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Barışta, birinci fıkra uyarınca verilen idari para cezası kesinleştikten sonra birinci fıkrada sayılan eylemlerden herhangi birini işleyenler ile bu eylemleri seferberlik ve savaş hâlinde işleyenler hakkında askerlik şubelerince suç dosyaları hazırlanarak yükümlünün nüfusa kayıtlı olduğu yer Cumhuriyet başsavcılığına gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Terör örgütü üyeleri ile Devletin millî güvenliğine karşı faaliyette bulunanların silahaltına alınmaları">
      <mvz-fıkra no="1">
        <template>Terör örgütlerine veya Millî Güvenlik Kurulunca Devletin millî güvenliğine karşı faaliyette bulunduğuna karar verilen yapı, oluşum veya gruplara üyeliği, mensubiyeti veya iltisakı yahut bunlarla irtibatı olan ve askerliğe elverişli oldukları anlaşılan yükümlülerden, yoklama kaçağı ve bakayalar dâhil bu Kanunda yazılı geçerli mazereti olmayanlar, Bakanlıkça belirlenecek celp ve sevk esaslarına göre silahaltına alınırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Yoklama kaçaklarının ve bakayaların takibi">
      <mvz-fıkra no="1">
        <template>Yoklama kaçakları ve bakayalar, askerlik ödevlerini yerine getirmek maksadıyla yakalanmaları için Bakanlıkça İçişleri Bakanlığına bildirilirler. Yakalanarak muhafaza altına alınanlar, mesai saatleri içerisinde en yakın askerlik şubesine getirilirler. Mesai saatleri dışında veya askerlik şubesinin bulunmadığı yerlerde yakalananlar ilgili kolluk kuvveti tarafından hazırlanan tutanağa istinaden derhâl serbest bırakılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Yoklama, celp ve sevk duyuruları">
      <mvz-fıkra no="1">
        <template>Yoklama, celp ve sevk ile ilgili hususlar, Bakanlık tarafından Türkiye Radyo Televizyon Kurumu ve diğer ulusal yayın yapan televizyon ve radyo kanalları aracılığıyla zorunlu yayın kapsamında duyurulur. Ayrıca Bakanlığın resmî internet sitesinde ve e-Devlet sisteminde ilan edilir. Bu duyuru ve ilan yükümlülere tebliğ mahiyetindedir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Duyurular ulusal yayın yapan televizyon ve radyo kanalları tarafından Bakanlıkça talep edilen tarihlerde ve 19.00-23.00 saatleri arasında en az bir kez yayımlanır. Radyo ve Televizyon Üst Kurulu, duyuruların yayımlandığı kanalları, tarih ve saati Bakanlığa bildirir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Muvazzaflık">
    <mvz-madde no="28" başlık="İzin süreleri">
      <mvz-fıkra no="1">
        <template>Erbaş ve erlere muvazzaflık hizmetinin her ayı için bir gün izin verilir. 5 inci maddenin üçüncü fıkrası kapsamında askerlik hizmetine devam edenlere muvazzaflık hizmetinin her ayı için ilave bir gün izin verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Askerlik hizmetinin gerektirdiği görev ve yükümlülükleri yerine getirme konusunda gayret ve çalışmaları sonucu emsalleri arasında üstün başarı gösteren erbaş ve erlerden, muvazzaf askerlik hizmetleri boyunca, disiplin amiri, disiplin kurulu veya mahkemelerden herhangi bir ceza almamış olanlara, azami üç güne kadar ilave izin verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Radyoaktif ışınla çalışan erbaş ve erlere, her ay için iki gün ilave izin verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Muvazzaflık hizmeti esnasında eşi doğum yapan ya da eşi veya ikinci derece dâhil kan veya kayın hısımlarından biri vefat eden erbaş ve erlere, talepleri üzerine ilave on gün izin verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Askerlik hizmetini yedek subay ve yedek astsubay olarak yerine getirecek yükümlülerin izinleri 926 sayılı Kanunda belirtilen sürelere göre oranlanarak verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu madde kapsamında verilen izinler askerlik hizmet süresinden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Birinci fıkra kapsamındaki izinler için bir defa, dördüncü fıkra kapsamındaki izinlerde ise her defasında gidiş ve dönüş yol ve iaşe bedelleri birlik komutanlıklarınca ödenir. Birinci fıkra kapsamındaki izinlerde bir defa gidiş ve dönüş yol süresi verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu maddede yazılı izinlerin dışında afet ve acil durumlarda izin vermeye, Cumhurbaşkanı yetkilidir. Verilecek bu izinlerin askerlik hizmetinden sayılıp sayılmayacağı Cumhurbaşkanınca tespit edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Sağlık izin süreleri">
      <mvz-fıkra no="1">
        <template>Erbaş ve erlerin hava değişimi ve istirahatte geçen sürelerinin, tabi olduğu hizmet süresinin her ayı için bir günlük kısmı askerlik hizmetinden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yedek subay ve yedek astsubaylardan hastalananlar, muvazzaf subay/astsubay emsalleri gibi sıhhi izin süresine tabi tutulurlar. Sıhhi izin süresince, özlük hakları saklı kalmak kaydıyla, yedek subay veya yedek astsubaylıkta alınan sıhhi izin sürelerinin, tabi olduğu hizmet süresinin her ayı için bir günlük kısmı askerlik hizmetinden sayılır. Bu süreye yedek subay veya yedek astsubay adaylığında alınan istirahat veya hava değişimi süreleri de dâhil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yedek subay adayları veya yedek astsubay adaylarının kanuni mazeretlerine dayalı olarak sınıf okulundan ayrı geçirilen sürenin, sınıf okulu toplam süresinin üçte birinden fazla olması hâlinde veya sınıfı görevini yapamaz raporu alanlar hakkında geçici terhis işlemi yapılır. Bir sonraki dönemde hastalıklarının devam etmediği sağlık raporu ile saptananlar ve yeniden sınıflandırılanlar yeni dönemin tamamına katılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Firar ve hava değişimi/izin tecavüzü">
      <mvz-fıkra no="1">
        <template>Firar ve hava değişimi/izin tecavüzü durumundaki yükümlüler hakkında tanzim edilen suç dosyası, suçun oluşması için öngörülen sürelerin geçmesini müteakip, soruşturma izni vermeye yetkili komutan veya askerî kurum amiri tarafından ilgili kanun hükümleri uyarınca soruşturma izni verilmesi hâlinde, yetkili Cumhuriyet savcılıklarına gönderilir. Yapılan bu işlemler ayrıca kayıtlı oldukları askerlik şubelerine bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Haklarında adli makamlarca çıkarılmış yakalama kararı olan firar ve hava değişimi/izin tecavüzü durumundaki yükümlüler ele geçirilinceye kadar kolluk kuvvetlerince aranır. Kolluk kuvvetlerince yakalananlar en yakın adli makama teslim edilir ve adli makamın talimatı doğrultusunda işlem yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Haklarında adli makamlarca çıkarılmış yakalama kararı olmayan firar ve hava değişimi/izin tecavüzü durumundaki yükümlülerden, kendiliğinden gelen ya da kolluk kuvvetleri tarafından askerlik şubelerine teslim edilenler serbest olarak birlik ve kurumlarına sevk edilir, bunlara yol ve iaşe bedeli ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kısa süreli kaçma ve izin süresini geçirme disiplinsizliklerini işleyen yükümlülerden kendiliğinden askerlik şubelerine gelenler serbest olarak birlik ve kurumlarına sevk edilir, bunlara yol ve iaşe bedeli ödenmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Askerlik hizmetinden sayılan diğer süreler">
      <mvz-fıkra no="1">
        <template>Muvazzaflık hizmeti esnasında sağlık kuruluşlarında tanı ve tedavide geçen süreler askerlik hizmetinden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yargılama sonucu beraat edenlerin gözaltı ve tutukluluk süreleri askerlik hizmetinden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Terörle mücadele görevi sırasında veya bu görevinden dolayı alıkonulan veya kaybolanların yeniden birliklerine dönmeleri hâlinde durumları, mensup oldukları kuvvet komutanlıklarınca teşkil edilecek kurul tarafından incelenir. Kaçırılma veya kaybolma ile ilgili olarak kusurlu görülenler hakkında soruşturma dosyası tanzim edilerek yetkili adli makamlara intikal ettirilir. Kurul tarafından kusursuz görülenler ile haklarında kovuşturmaya yer olmadığı veya beraat kararı verilenlerin birliklerinden ayrı geçirdiği süreler hizmetten sayılır ve ödenmemiş özlük hakları ödenir. Yedek subay ve yedek astsubaylar hakkında 926 sayılı Kanunun ek 30 uncu maddesi hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="32" başlık="Askerlik hizmetinden sayılmayan diğer süreler">
      <mvz-fıkra no="1">
        <template>Aşağıdaki süreler muvazzaflık ve yedeklik hizmeti sürelerinden sayılmaz:</template>
        <mvz-bent no="a">
          <template>Firar, hava değişimi/izin tecavüzü suçları ile kısa süreli kaçma ve izin süresini geçirme disiplinsizliklerinde geçen süreler</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Mahkemelerin hükmettiği hapis cezalarının infazında geçen süreler</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>6413 sayılı Kanunda hizmetten sayılmayacağı açık olarak belirtilmiş disiplin cezaları</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Kendilerini askerliğe elverişsiz hâle getirmeye veya getirtmeye teşebbüs ettikleri mahkeme kararı ile sabit olanların yargılanmalarına esas eylemleri dolayısıyla ortaya çıkan rahatsızlıklar ile uyuşturucu veya uyarıcı madde kullanması nedeniyle mahkeme tarafından haklarında tedaviye karar verilenlerin bu karar nedeniyle yatarak gördüğü tedaviler veya istirahatte ya da hava değişiminde geçirdikleri süreler</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="Yedek subay veya yedek astsubay olmaya engel hâller">
      <mvz-fıkra no="1">
        <template>Yedek subay veya yedek astsubay, yedek subay adayı veya yedek astsubay adayı, yedek subay aday adayı veya yedek astsubay aday adayı iken;</template>
        <mvz-bent no="a">
          <template>1632 sayılı Kanunun 30 uncu maddesi ile 926 sayılı Kanunun 50 nci maddesinde belirtilen suçlardan mahkûm olanlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Süresine bakılmaksızın kamu hizmetlerinden yasaklı olanlar ile idari karar sonucu kamu hizmetlerinden çıkarılanlar,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yedek subay veya yedek astsubaylardan askerlik hizmet süresini tamamlamadan çeşitli nedenlerle Türk Silahlı Kuvvetleriyle ilişikleri kesilen veya mahkeme kararı ile ya da haklarında verilen mahkûmiyet kararının sonucu olarak Türk Silahlı Kuvvetlerinden çıkarılanlar,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yedek subay adayı veya yedek astsubay adaylarından Bakanlıkça bu konuda çıkarılan yönetmelikte belirlenen usul ve esaslar çerçevesinde;</template>
          <mvz-altbent no="1">
            <template>Disiplinsizlik ve ahlaki durumları nedeniyle yedek subay veya yedek astsubay olması uygun görülmeyenler,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Türk Silahlı Kuvvetlerinin manevi şahsiyetine gölge düşüren veya askerliğin şeref ve haysiyetiyle bağdaşmayacak eylemlerde bulunanlar ile tutum ve davranışlarıyla yasa dışı siyasi, yıkıcı, bölücü ideolojik görüşü benimsemiş olduğu anlaşılanlar,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Yedek subay veya yedek astsubay eğitim ve öğretiminde başarı gösteremeyenler,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Subay, astsubay, uzman erbaş ve sözleşmeli erbaş veya er olarak görev yaparken askerlik hizmet süresini tamamlamadan disiplinsizlik veya ahlaki nedenlerle Türk Silahlı Kuvvetleriyle ilişikleri kesilen veya mahkeme kararı ile ya da haklarında verilen mahkûmiyet kararının sonucu olarak Türk Silahlı Kuvvetlerinden çıkarılanlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>askerlik hizmetini er statüsünde tamamlar. Bunların askerlik hizmeti erbaş ve erlerin hizmet süresi kadardır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="34" başlık="Katılış, statü değişikliği ve terhis">
      <mvz-fıkra no="1">
        <template>Sevk edilen yükümlülerin katılışları, birlik veya kurumlarınca Bakanlığa bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Terhis edilen yükümlüler için birlik komutanlığı veya kurum amirliğince terhis belgesi tanzim edilerek yükümlüye verilir ve kıta şahsi dosyası ile birlikte kayıtlı olduğu askerlik şubesine gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Askerlik hizmetini yapmakta iken yedek subay veya yedek astsubay olma hakkını veren öğrenim kurumlarından mezun olanların yedek subay veya yedek astsubay olarak statü değişikliği talepleri dikkate alınmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Noksan hizmetlilere ilişkin işlemler">
      <mvz-fıkra no="1">
        <template>Noksan hizmetli yükümlülere öncelikle 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümlerine göre askerlik hizmet süresinin tamamlatılması maksadıyla askerlik şubesince tebligat yapılır. Tebligat tarihinden itibaren noksan hizmetini tamamlamak üzere iki aylık süre içerisinde askerlik şubesine müracaat etmeyenler hakkında 24 üncü maddede belirtilen bakayalara ilişkin hükümler uygulanır. Noksan hizmetin tamamlatılmasına ilişkin usul ve esaslar Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamında tebligat yapılmış olmasına rağmen iki aylık süre içerisinde askerlik şubesine müracaat etmeyenler, yakalanmaları için Bakanlıkça İçişleri Bakanlığına bildirilirler. Yakalananlar mesai saatleri içerisinde en yakın askerlik şubesine getirilirler. Mesai saatleri dışında veya askerlik şubesinin bulunmadığı yerlerde yakalananlar ilgili kolluk kuvveti tarafından hazırlanan tutanağa istinaden derhâl serbest bırakılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Tutuklu ve hükümlü işlemleri">
      <mvz-fıkra no="1">
        <template>Askerlik hizmetine başlamadan önce veya askerlikleri sırasında işledikleri suçlardan dolayı, bir yıl ve daha az süreli hapis cezasına hükmedilenler ile 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 50 nci maddesinin birinci fıkrasının (c), (e) ve (f) bentlerinde yazılı tedbirler veya adli para cezasına mahkûm edilen yükümlüler hakkında verilen ceza ve tedbirlerin yerine getirilmesi askerlik hizmetlerinin sonuna bırakılır. Bu durumdakiler terhis edildikleri zaman serbest bırakılmayıp cezalarının çektirilmesi için kıta ve kurumlarınca bulundukları yer Cumhuriyet savcılıklarına teslim edilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir yıldan fazla hürriyeti bağlayıcı cezaya hükmedilenler kıta ve kurumlarınca bulundukları yer Cumhuriyet savcılıklarına teslim edilirler. Bunlardan askerlikle ilişiği olanlara tahliyelerinde cezaevi idarelerince on beş günlük süre içerisinde askerlik şubesine müracaat edecekleri tebliğ edilir ve buna ilişkin belge askerlik şubesine gönderilir. Askerlik şubelerine kendilerine tanınan süre içerisinde gelmeyenler hakkında bakaya hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İnfazları geri bırakılan mahkûmiyetler için zamanaşımı işlemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Diploma, sertifika ve ehliyet gibi belgeler">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre silahaltına alınan ve askerlik yükümlülüğünü yerine getirmekte olan erbaş ve erlerden ilgili mevzuat hükümlerine uygun olarak alınmış bir diploma, sertifika veya ehliyet gibi belgelere sahip olanlar özel kanunlarda belirtilen koşullara uyulması şartıyla, yetkili komutanlık/amirliklerin onayı ile bu belgelerin kendilerine verdiği yetki kapsamındaki görevlerde çalıştırılabilir, mesleki hizmetlerin yürütülmesinde görevlendirilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Yurt Dışı Erteleme ve Dövizle Askerlik">
    <mvz-madde no="38" başlık="Yurt dışı erteleme">
      <mvz-fıkra no="1">
        <template>Yabancı ülkelerde;</template>
        <mvz-bent no="a">
          <template>Çalışma iznini de ihtiva eden oturma izni veya doğrudan çalışma iznine sahip olarak işçi, işveren veya bir meslek ya da sanat mensubu sıfatı ile bulunanlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yabancı bandıralı gemilerde gemi adamı statüsünde bulunanlar,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İkamet eden çok vatandaşlık hakkına sahip olanlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>durumlarını ispata yarayan belgeler ile bağlı bulundukları Türk konsolosluklarına başvurmaları hâlinde, bunların her türlü askerlik işlemleri, Bakanlık tarafından belirlenecek usul ve esaslara uygun olarak 35 yaşını tamamladıkları yılın sonuna kadar ertelenebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Erteleme şartlarını haiz olmadıkları anlaşılanlar, erteleme süresi içinde herhangi bir takvim yılının yarısından fazlasını yurt içinde geçirenler, erteleme nedeni ortadan kalkanlar ile kendi istekleriyle erteleme hakkından vazgeçenlerin ertelemeleri iptal edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="39" başlık="Dövizle askerlik">
      <mvz-fıkra no="1">
        <template>Türkiye Cumhuriyeti tarafından tanınmış yabancı ülkelerde; iltica başvurusu dışında elde ettikleri çalışma iznini de ihtiva eden oturma izni veya doğrudan çalışma iznine sahip olarak işçi, işveren veya bir meslek ya da sanat mensubu sıfatını haiz olanlar ile bir iş sözleşmesine bağlı olarak yabancı bandıralı gemilerde gemi adamı sertifikasında yazılı mesleğini icra edenlerden;</template>
        <mvz-bent no="a">
          <template>Yurt içinde geçirilen süreler hariç olmak üzere, en az üç yıl süre ile fiilen çalışanlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakanlıkça verilecek uzaktan eğitimi alanlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>durumlarını ispata yarayan belgelerle birlikte bağlı bulundukları Türk konsoloslukları aracılığı ile askerlik şubelerine başvurmaları, 9 uncu maddedeki gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarın Türkiye Cumhuriyet Merkez Bankasınca döviz miktarının yatırılacağı gün tespit edilen döviz alış kuruna göre avro veya karşılığı kadar konvertibl yabancı ülke parasını başvuru tarihinde peşin ödemeleri hâlinde askerlik hizmetini yerine getirmiş sayılırlar. Uzaktan eğitime ilişkin usul ve esaslar Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yurt dışında ikamet eden ve çok vatandaşlık hakkına sahip olanlar ile yurt dışında doğup yurt dışında ikamet eden ve süresiz ikamet iznine sahip olanlar en az üç yıl süre ile fiilen yabancı ülkelerde bulunmaları hâlinde çalışma şartı aranmadan birinci fıkrada belirtilen esaslara göre bu madde hükümlerinden yararlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dövizle askerlik hizmetinden yararlanmak üzere yaptıkları başvuruları kabul edilenlerden;</template>
        <mvz-bent no="a">
          <template>Ödemeleri gereken yabancı ülke parasını ödemeyenler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ücret veya maaşları yurt içinden transfer edilenler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yabancı ülkelerde resmî görevle bulunanlar,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Dövizle askerlik hizmeti dışında diğer statülerde fiilî askerlik hizmetine başlamış olanlar,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Oturma veya çalışma iznini iltica nedeniyle aldığı anlaşılanlar,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Müracaatına ait belgelerde sahtecilik yapmak veya resmî belgenin düzenlenmesinde yalan beyanda bulunarak idareyi yanıltmak suretiyle dövizle askerlik başvurusunda bulunduğu anlaşılanlar,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Yararlanma şartlarından herhangi birini taşımadıkları sonradan tespit edilenler,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>dövizle askerlik hizmetinden faydalanamazlar. Bu durumda bulunan yükümlülerin müracaatları Bakanlık tarafından iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Başvuruları iptal edilenlerin, ödemede bulunmalarına rağmen başvuru işlemleri tamamlanmamış olanların, fazla ödemede bulunduğu anlaşılanların ödemiş olduğu tutarlar talepleri hâlinde kendilerine, vekillerine veya mirasçılarına iade tarihindeki kura göre Türk lirası olarak yurt içinde gösterecekleri banka hesabına iade edilir. Ödeme ve başvuru işlemlerini tamamladıktan sonra dövizle askerlik hizmeti kapsamından çıkartılmalarını talep edenlere, askerliğe elverişsiz hâle gelenlere, vefat edenlere, Türk vatandaşlığından çıkmalarına izin verilenler ile Türk vatandaşlığını kaybedenlere geri ödeme yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ödeme ve başvuru işlemlerini tamamladıktan sonra dövizle askerlik hizmeti kapsamından çıkartılmalarını talep edenlerin istekleri kabul edilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Üçüncü fıkranın (e) bendi kapsamında başvuruları Bakanlık tarafından iptal edilenler yeniden dövizle askerlik hizmetinden faydalanma şartlarını taşısalar dahi bu madde hükümlerinden faydalanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Yapılan ödemeler, Dışişleri Bakanlığınca Türkiye Cumhuriyet Merkez Bankasında Hazine adına açılacak özel döviz hesabına avro olarak kaydedilir. Bu tutarlar Türkiye Cumhuriyet Merkez Bankasınca transfer tarihindeki döviz alış kuru üzerinden Türk lirasına çevrilerek Hazine ve Maliye Bakanlığı Merkez Saymanlığı hesabına aktarılır ve bütçeye gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Döviz tahsilatı ve özel döviz hesabına aktarılması ile ilgili oluşacak transfer ücreti ve diğer masraflar yurt dışı temsilcilikler tarafından yükümlülerden tahsil edilir. Transfer ücreti ve diğer masraflar, Hazine ve Maliye Bakanlığının görüşü alınarak Dışişleri Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Mülga 21/6/1927 tarihli ve 1111 sayılı Askerlik Kanununa göre dövizle askerlik kapsamından çıkarılanlar, bu Kanun kapsamında yeniden dövizle askerlik hizmetinden yararlanamazlar. Kapsamdan çıkarılanlar ile aynı Kanuna göre işlem görmüş olanların ödemiş oldukları dövizlerin geri ödenmesine ilişkin usul ve esaslar Bakanlıkça çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Bu madde kapsamında dövizle askerlik hizmetinden faydalanmak isteyenlerin işlemlerinin yapılmasında yetki ve sorumluluk Dışişleri Bakanlığındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Seferberlik ve savaş hâlinde bu madde hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Sağlanan Haklar ve Yaptırımlar">
    <mvz-madde no="40" başlık="Sağlanan haklar">
      <mvz-fıkra no="1">
        <template>Muvazzaflık hizmetini, 9 uncu madde kapsamında yerine getirenler hariç olmak üzere, erbaş ve er olarak yapanlara aşağıda belirtilen haklar sağlanır:</template>
        <mvz-bent no="a">
          <template>Muhtaç asker ailelerine yapılan yardım miktarı Cumhurbaşkanınca belirlenir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Askerî öğrenci, dış kaynaktan muvazzaf subay/astsubay, sözleşmeli subay/astsubay, uzman erbaş ve sözleşmeli erbaş/er temininde;</template>
          <mvz-altbent no="1">
            <template>İlk altı aylık askerlik hizmetini tamamlayarak terhis olanlara sınav tam notunun yüzde beşine kadar, 5 inci maddenin üçüncü fıkrası kapsamında askerlik hizmetine devam edip bu sürenin sonunda terhis olanlara ise yüzde on beşine kadar,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Meslek yüksekokulu veya mesleki ve teknik lise mezunlarından; ilk altı aylık askerlik hizmetini tamamlayarak terhis olanlara sınav tam notunun yüzde onuna kadar, 5 inci maddenin üçüncü fıkrası kapsamında askerlik hizmetine devam edip bu sürenin sonunda terhis olanlara ise yüzde yirmisine kadar,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>ilave puan verilebilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Toplu Konut İdaresinin yaptığı konutların tahsisinde, kendi üzerine kayıtlı konutu olmayanlar, öncelikli istifade ettirilebilir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Hizmette geçen süre içinde kamunun ve belediyelerin işlettiği deniz ve şehir içi toplu taşıma hizmetlerinden ücretsiz yararlanır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hizmette geçen süre içinde müze ve ören yeri gibi yerlerden ücretsiz yararlanır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>5 inci maddenin üçüncü fıkrası kapsamında askerlik hizmetine devam edenler hakkında birinci fıkranın (a) bendi uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>5 inci maddenin üçüncü fıkrası kapsamında askerlik hizmetine devam edip bu sürenin sonunda terhis olanlardan, 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 41 inci maddesinin birinci fıkrasının (b) bendi kapsamında hizmet borçlanması talebinde bulunanların; 5 inci maddenin üçüncü fıkrası kapsamında geçmiş olan sürelerin taleplerinde 5510 sayılı Kanunun 82 nci maddesine göre prime esas günlük kazanç alt sınırının %45’i ile çarpımı neticesinde hesaplanacak kısmı, borcun Sosyal Güvenlik Kurumu Başkanlığınca Bakanlığa tebliğ edildiği tarihi takip eden üç ay içinde ilgili Bakanlıkça ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Teknik bilimler meslek yüksekokulundan veya meslek yüksekokullarının teknik bölümlerinden mezun olanlar ve mesleki ve teknik lise mezunları ile tarım, turizm ve mevsimlere bağlı sektörlerde faaliyet gösteren yükümlülerin askere sevki Türk Silahlı Kuvvetlerinin ihtiyaç ve önceliklerine göre mesleklerine uygun sınıflandırma ve istedikleri celp döneminde silahaltına alınma taleplerine ilişkin usul ve esaslar Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41" başlık="Yaptırımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında kendilerine tanınan erteleme süreleri dikkate alınmak şartıyla askerlik yükümlülüğünü yerine getirmeyen öğrencilerin kayıtları askerlik hizmetini yerine getirene kadar Bakanlığın talebi üzerine ilgili ortaöğretim ve yükseköğretim kurumlarınca geçici olarak dondurulur. Bu şekilde kayıtları dondurulanlardan herhangi bir harç veya öğrenim katkı payı alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yoklama kaçakları ve bakayalar ile barışta tatbikat ve ferdî seferberlik eğitimi bakayaları kamu hizmetine veya özel hizmete alınamazlar. Bunları kamu hizmetine veya özel hizmete alanlar hakkında askerlik şubelerince mahallin Cumhuriyet başsavcılığına suç duyurusunda bulunulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yoklama kaçağı, saklı ve bakayalar ile barışta tatbikat ve ferdî seferberlik eğitimi bakayalarına 24 üncü maddede yer alan yaptırımlar uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="9-DOKUZUNCU" başlık="Askerlik Muafiyeti">
    <mvz-madde no="42" başlık="Yükümlüler, kamu görevlileri ve sivillerden hayatını kaybedenlerin yakınlarının muafiyet hakları">
      <mvz-fıkra no="1">
        <template>Askerlik hizmetini yerine getirmekte iken ölen, hakkında gaiplik kararı verilen, maluliyet aylığı bağlanmasını gerektirecek biçimde malul olanlar ile terhis edildikten sonra askerlik hizmetinin sebep ve tesiri ile hayatını kaybettiği mahkeme kararı ile sabit olanların;</template>
        <mvz-bent no="a">
          <template>Baba ve annesinin müşterek olarak talep ettiği veya baba ya da annesinden biri ölmüş ise sağ olanın talep ettiği kardeşlerinden biri, istekli olmadıkça silahaltına alınmaz veya silahaltında ise terhis edilir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Baba ve annenin müştereken anlaşamadıkları veya her ikisinin de ölmüş olması durumunda; öncelikle silahaltında olan kardeşi var ise istekli olması hâlinde terhis edilir, silahaltında kardeşi yok ise veya silahaltındaki kardeşi terhis olmak istemez ise askerlik hizmet sırası gelen ilk kardeş istekli olmadıkça silahaltına alınmaz.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu kapsamında hayatını kaybedenlerden;</template>
        <mvz-bent no="a">
          <template>Askerlik hizmetini yerine getirmekte olan yükümlüler ile 3713 sayılı Kanunun 21 inci maddesinin birinci fıkrasının (j) bendi kapsamına giren sivillerin kendilerinden olma çocukları ile aynı anne ve babadan olma kardeşlerinin tamamı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>15 Temmuz 2016 tarihinde gerçekleştirilen darbe teşebbüsü ve terör eylemi ile bu eylemin devamı niteliğindeki eylemlere, görevi olmadığı hâlde mukavemet ederken şehit olanların kendinden olma erkek çocukları ile aynı anne ve babadan kardeşlerinin tamamı,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Güvenlik korucuları dâhil kamu görevlilerinin kendilerinden olma çocuklarının tamamı ile aynı anne ve babadan olma kardeşlerinden biri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>istekli olmadıkça silahaltına alınmaz ve silahaltındakiler istekleri hâlinde terhis edilir. Kardeşlerden hangisinin askerlik hizmetinden muaf tutulacağı birinci fıkranın (a) ve (b) bentlerinde düzenlenen usule göre belirlenir. Kardeşlerden muafiyet kapsamına girmeyenler ile muafiyet kapsamına girmekle birlikte bu muafiyetten yararlanmak istemeyenlerin askerlik hizmetini yerine getireceği yerler Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde hükümleri seferberlik ve savaş hâlinde uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="Vatandaşlığa sonradan alınanlara uygulanacak erteleme ve muafiyet">
      <mvz-fıkra no="1">
        <template>Türk vatandaşlığını sonradan kazananlar askerliklerini, vatandaşlığı kazandığı tarihteki yaş ve öğrenim durumlarına göre o yıl askerlik çağına giren yükümlüler gibi yaparlar. Bunlardan Türk vatandaşlığına alınmadan önce gelmiş oldukları ülkelerde askerlik yaptıklarını veya askerlik hizmetini yerine getirmiş sayıldıklarını belgeleyenler ile vatandaşlığa alındıkları yıl 22 ve daha büyük yaşta olanlar askerlik yapmış sayılırlar. Bunların askerlikleri, istekleri hâlinde vatandaşlığa alındıkları tarihten itibaren iki yıl süreyle ertelenir. Ertelemelerinin sona ereceği yıl yoklamaları yapılarak o yıl askerlik çağına giren doğumlularla işlem görürler. Bunlar, seferberlik hâlinde ihtiyaca göre askere sevk edilebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çeşitli nedenlerle Türk vatandaşlığını kaybettikten sonra yeniden Türk vatandaşlığını kazananların askerlik işlemleri, önceki askerlik safahatları dikkate alınarak bu Kanunun durumlarına uyan hükümlerine göre yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde hükümlerinden, soybağına bağlı olarak Türk vatandaşlığına sonradan alınanlar yararlanamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Kuzey Kıbrıs Türk Cumhuriyetinde askerlik yapanlar">
      <mvz-fıkra no="1">
        <template>Kuzey Kıbrıs Türk Cumhuriyeti kanunlarına göre zorunlu askerlik hizmetini yerine getirdiklerini belgelendiren Türk vatandaşları bu Kanun hükümlerine göre askerlik yapmış sayılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="45" başlık="Özel durumlarda muafiyet ve erteleme">
      <mvz-fıkra no="1">
        <template>İki ülkeden birinde yapılan askerlik hizmetinin sayılmasına dair ikili anlaşmalar kapsamında askerlik hizmetinden muaf tutulacak ya da ertelenecek yükümlülerin işlemleri anlaşma hükümlerine göre yürütülür. Yapılan anlaşmalar kapsamında uygulanacak muafiyet ve ertelemeye ilişkin usul ve esaslar Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Barışta, olağanüstü hâl veya seferberlik hâllerinde veya savaşta, askerliğini henüz yapmadan, Milli Güvenlik Kurulunca gerekli görülen sahalarda Bakanlığın teklifi üzerine Cumhurbaşkanınca özel olarak görevlendirilen gönüllüler, Cumhurbaşkanınca belirlenen şartlara uydukları takdirde askerlik hizmetinden muaf tutulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="46" başlık="Askerî okullardan ayrılanlar">
      <mvz-fıkra no="1">
        <template>Askerî öğrenci olarak okudukları Milli Savunma Üniversitesi ve diğer üniversite, fakülte veya yüksekokullar ile meslek yüksekokullarından ilişiği kesilenlerin, bu okullarda ay olarak okudukları sürenin üçte biri muvazzaflık hizmetinden sayılır. Askerlik hizmetinden sayılan sürenin erbaş ve erlerin tabi olduğu hizmet süresini karşılaması hâlinde bunlar askerlik hizmetini yerine getirmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamındakilerden yedek subay adayı veya yedek astsubay adayı olma hakkı bulunanlar, istekli olmaları ve aday seçilmeleri hâlinde daha önceki hizmet süreleri dikkate alınmaksızın yedek subay veya yedek astsubayların hizmet süresine tabi tutulur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="10-ONUNCU" başlık="Tazminat ve Tedaviye İlişkin Hükümler">
    <mvz-madde no="47" başlık="Tazminat">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında askerlik yükümlülüğünü yerine getirenlere; askere sevk edildiği tarihten geçerli olmak üzere; erbaş ve erler için askerlik hizmet süresinin bitiş tarihine, yedek subay veya yedek astsubaylar için sınıf okulunda geçen sürenin bitiş tarihine kadar ölenler ile sakatlanma sebebiyle süresinden önce terhis edilenlerden veya süresinde terhis edilmiş olsa bile yapılan tedaviye rağmen askerliğe elverişsiz hâle gelecek şekilde sakatlanmış olanlardan, 8/6/1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanunu veya 5510 sayılı Kanun kapsamında aylık bağlanmaması veya 3/11/1980 tarihli ve 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanun gereğince tazminat ödenmemesi kaydıyla; ölenlerin dul ve yetimlerine 400.000 gösterge rakamının, sakatlananlara ise Vazife Malullüklerinin Nevileri ile Dereceleri Hakkında Nizamname hükümlerine göre tespit edilecek sakatlık derecelerine göre aşağıda belirlenen gösterge rakamlarının memur aylık katsayısı ile çarpımı sonucunda bulunacak miktar kadar, bir defaya mahsus olmak üzere tazminat ödenir. Ancak, tazminata konu durumun gerçekleştiği tarihte bakaya, firar, hava değişimi/izin tecavüzünde bulunanlar ile kendini askerliğe yaramayacak hâle getirmek ve askerlikten kurtulmak için hile yapmak suçundan hüküm giyenlerin, suça konu eylemleri sonucu ölüm ve sakatlanma nedeniyle ve intihar sonucu meydana gelen ölüm ve sakatlanma olaylarında bu ödeme yapılmaz. Bu tazminattan damga vergisi dışında herhangi bir vergi kesintisi yapılmaz ve bu tazminat haczedilemez. Tazminatın ödenmesine ilişkin usul ve esaslar Bakanlıkça hazırlanan yönetmelikle belirlenir.</template>
        <mvz-literal konu="Ödenecek tazminat göstergesi" tür="çizelge">
          <template>
            <table class="table table-sm small text-center">
              <thead>
                <tr>
                  <th scope="col">Sakatlık Derecesi</th>
                  <th scope="col">Ödenecek Tazminat Göstergesi</th>
                </tr>
              </thead>
              <tbody>
                <tr><td>1</td><td>400.000</td></tr>
                <tr><td>2</td><td>360.000</td></tr>
                <tr><td>3</td><td>330.000</td></tr>
                <tr><td>4</td><td>300.000</td></tr>
                <tr><td>5</td><td>270.000</td></tr>
                <tr><td>6</td><td>240.000</td></tr>
              </tbody>
            </table>
          </template>
        </mvz-literal>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Vatani görevini yapmakta iken barışta ve savaşta, yurt içinde ve yurt dışında, görev esnasında veya görev dışında görevlerinden dolayı, bir saldırıya veya kazaya uğrayanlardan sağlık kurumlarında tedavisi devam edenlere, olay/kaza tarihinden itibaren otuz altı ayı geçmemek üzere, terhislerini takip eden ay başından itibaren ve tedavi gördüğü sağlık kurumunca düzenlenen “tedavisinin devam ettiğini belirtir” sağlık kurul raporuna istinaden;</template>
        <mvz-bent no="a">
          <template>Erbaş ve erlere, görevdeki uzman çavuşun (bir yıllık, karargâhta görevli, bekâr) aldığı net maaşın üçte ikisi (27/6/1989 tarihli ve 375 sayılı Kanun Hükmünde Kararnamenin 28 inci maddesinde belirtilen ek tazminatlar ile 14/7/1964 tarihli ve 500 sayılı Kıbrıs’a Gönderilecek Türk Askeri Birliği Mensuplarının Aylık ve Ücretleriyle Çeşitli İstihkakları ve Birliğin Başka Giderleri Hakkında Kanuna göre ödenen tazminat ve yabancı dil tazminatı hariç),</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yedek subaylara, görevdeki emsali yedek subayın (karargâhta görevli, bekâr) net maaşının üçte ikisi (375 sayılı Kanun Hükmünde Kararnamenin 28 inci maddesinde belirtilen ek tazminatlar ile 500 sayılı Kanuna göre ödenen tazminat ve yabancı dil tazminatı hariç),</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yedek astsubaylara, görevdeki emsali yedek astsubayın (karargâhta görevli, bekâr) net maaşının üçte ikisi (375 sayılı Kanun Hükmünde Kararnamenin 28 inci maddesinde belirtilen ek tazminatlar ile 500 sayılı Kanuna göre ödenen tazminat ve yabancı dil tazminatı hariç),</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>her ay sağlık yardımı olarak, bağlı olduğu Bakanlık ve İçişleri Bakanlığı tarafından ilgili bütçe tertibinden ödenir. Bu ödemeden sigorta primi dâhil hiçbir kesinti yapılmaz ve tedavi süresinde yapılan sağlık yardımı personelden tahsil edilmez. Olay/kaza durumu, keyif verici içki ve her çeşit maddeler kullanmaktan, her ne suretle olursa olsun kendisine veya başkalarına menfaat sağlamak veya zarar vermek maksadından doğmuş olursa sağlık yardımı ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tedavisi devam edenlerden;</template>
        <mvz-bent no="a">
          <template>5434 sayılı Kanunun mülga 45 inci maddesi kapsamında vazife malulü ya da mülga 64 üncü maddesi kapsamında harp malulü aylığı bağlananlar ile 5510 sayılı Kanunun 47 nci maddesi kapsamında vazife/harp malulü aylığı bağlananlara aylık bağlanma tarihini takip eden ay başından itibaren,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Malullük durumu oluşmaksızın tedavisi kesin işlemli sağlık kurulu raporu ile sonlandırılanlara, raporunu takip eden ay başından itibaren,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>sağlık yardımı ödemesi sonlandırılır. Tedavi süresinde yapılan sağlık yardımı personelden tahsil edilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="11-ONBİRİNCİ" başlık="Türk Silahlı Kuvvetlerinden Ayrılan Çeşitli Statüdeki Personel İşlemleri">
    <mvz-madde no="48" başlık="Muvazzaf ve sözleşmeli subay veya astsubaylar ile uzman erbaş ve sözleşmeli erbaş ve er iken ayrılanlar">
      <mvz-fıkra no="1">
        <template>Türk Silahlı Kuvvetlerinden ayrılan veya ilişiği kesilenlerin hizmette geçen sürelerinin askerlik hizmetinden sayılmasına ilişkin esaslar şunlardır:</template>
        <mvz-bent no="a">
          <template>Türk Silahlı Kuvvetleri adına okudukları Milli Savunma Üniversitesi ve diğer üniversite, fakülte veya yüksekokullar ile meslek yüksekokullarından mezun olmayı müteakip muvazzaf subay ve astsubay nasbedilenlerin, bu okullarda ay olarak geçen sürelerinin üçte biri ile muvazzaf subay ve astsubaylıkta geçen sürelerinin tamamı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Dış kaynaktan temin edilen muvazzaf subay ve astsubaylar ile bunların adaylarından deneme süresinin bitimine kadar ayrılanların temel eğitimde ve muvazzaf subay ve astsubaylıkta ay olarak hizmette geçen sürelerinin üçte biri, deneme süresi sonrasında geçen sürelerinin tamamı,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sözleşmeli subay veya sözleşmeli astsubayların ve bunların adaylarının ön sözleşme ve sözleşme sürelerinin toplamının üçte biri,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Uzman erbaşların sözleşme döneminde ay olarak geçen sürelerinin üçte biri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Sözleşmeli erbaş ve erler ile sözleşmeli er adaylarından, ön sözleşme ve sözleşme döneminde ay olarak hizmette geçen sürelerinin üçte biri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Türk Silahlı Kuvvetlerinin ihtiyacı olan statülerde istihdam edilmek üzere temini silahaltında iken gerçekleştirilen yükümlülerin silahaltında geçirilen sürelerinin tamamı,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>askerlik hizmetinden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sayılan hizmet süresi erbaş ve erlerin tabi olduğu hizmet süresini karşılayanlar askerlik hizmetini yapmış sayılır. Hizmet süresini karşılamayanların eksik kalan süreleri, erbaş ve erlerin tabi olduğu hizmet süresi esas alınarak, bu Kanun hükümlerine göre erbaş ve er olarak tamamlattırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yedek subay veya yedek astsubay adayı olma hakkı bulunanlar, yedek subay veya yedek astsubay olmaya istekli olmaları ve yedek subay adayı veya yedek astsubay adayı seçilmeleri hâlinde daha önceki hizmet süreleri dikkate alınmaksızın yedek subay veya yedek astsubayların hizmet süresine tabi tutulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sözleşmesi feshedilen uzman erbaşlar ile sözleşmeli erbaş ve erlerin varsa kalan askerlik hizmeti, ilgilinin ilişiği kesilmeden, Bakanlıkça belirlenecek birliklerde erbaş ve er olarak tamamlattırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Özel kanunlarda yer alan askerlik yükümlülüğüne ilişkin düzenlemelerden bu Kanuna aykırı olanlar uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="12-ONİKİNCİ" başlık="Yedeklik Dönemi">
    <mvz-madde no="49" başlık="Seferberlik kaynağı">
      <mvz-fıkra no="1">
        <template>Askerlik hizmetini yerine getiren yükümlüler ile Türk Silahlı Kuvvetlerinden çeşitli nedenlerle ayrılan personel seferberlik kaynağına alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yedek personel seferberlik ve savaş hâlinde ihtiyaca göre askere sevk edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="50" başlık="Yaş sınırı">
      <mvz-fıkra no="1">
        <template>Yedek personelden; yedek subay ve yedek astsubaylara 5434 sayılı Kanun, uzman erbaşlara 18/3/1986 tarihli ve 3269 sayılı Uzman Erbaş Kanunu hükümleriyle belirlenen yaş sınırları esaslarına göre, erbaş ve erlere ise askerlik çağının sonuna kadar yükümlülük verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="51" başlık="Silahaltına çağrılma">
      <mvz-fıkra no="1">
        <template>Yedek personel seferberlik ve savaş hâli, olağanüstü hâller ile barış şartlarında tatbikat ve eğitim için kısmen veya tamamen çağrılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak tatbikat veya eğitim için çağrılmış olanların tatbikat veya eğitim süresi kırk beş günü geçemez. Seferberlik ve savaş hâli durumu ile olağanüstü hâllerde bu süre Cumhurbaşkanınca lüzumu kadar uzatılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="52" başlık="Sefer görev emri ve tebliği">
      <mvz-fıkra no="1">
        <template>Seferde görev alacak yedek personele bu görevlerinin barışta en son görev yaptığı birlik ve kurumlarca tebliği esastır. Birlik ve kurumlarca tebliğ edilemeyenler ile sonradan sefer görev emri verilenlerin tebliğ işlemleri askerlik şubelerince yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Barışta tatbikat veya eğitim için askerlik şubesine çağrılan yedek personel askerlik şubesine gelerek silahaltı davetiyesini almak zorundadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="53" başlık="Silahaltına alınan Devlet memurları ve işçiler">
      <mvz-fıkra no="1">
        <template>Devlet memuru olan yedek personel silahaltına alındığında silahaltında bulunduğu sürece 657 sayılı Kanun gereğince izinli sayılır. Seferberlik ve savaş hâli sona erdiğinde, bu personel barış zamanında görev yaptığı memuriyetin eşiti olan memuriyete geri döner. Barış zamanında seferberlik tatbikatları ve ferdî seferberlik eğitimlerine katılıp terhis edilen Devlet memurları atanmış olduğu memuriyete geri döner.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşçi olan yedek personelden silahaltına alınanlar için ilgili kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="54" başlık="Silahaltına alınanların terfi ve kıyafetleri">
      <mvz-fıkra no="1">
        <template>Yedek subay ve yedek astsubayların terfilerine ilişkin usul ve esaslar hakkında, 926 sayılı Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yedek personel silahaltına alındığında askerî üniforma giymeye mecburdur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="55" başlık="Silahaltına alınan yükümlülerin devam eden ve biten adli kovuşturmaları">
      <mvz-fıkra no="1">
        <template>Seferberlik ve savaş hâlinde; silahaltına alınacak yedek personel ile muvazzaf olarak askerlik hizmetini yerine getiren yükümlülerden alt sınırı beş yıl hapis ve daha fazla hapis cezasını gerektiren suçlar hariç olmak üzere diğer bir suç ile sanık olanların yargılamaları veya mahkûm oldukları cezanın infazı terhis sonrasına bırakılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Terhis sonrasına bırakılan bu süreler için dava ve ceza zamanaşımı süresi işlemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="56" başlık="Celp, sevk, katılış ve bakayalar">
      <mvz-fıkra no="1">
        <template>Seferberlik ilan edildikten sonra birliğine askerlik şubesi vasıtasıyla gitmek isteyen yedek personelin sevki, askerlik şubesi başkanlıklarının sırasıyla mahallî ve merkezî planlama kapsamında icra edeceği faaliyetler ile sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sefer görevi alan yedek personel; seferberlik ilanında, askerlik şubeleri aracılığıyla sevk edilmek isteyenler ilan saatinden başlayarak altı saat içinde en yakın askerlik şubesine başvurmaya, kendiliğinden birliğe katılmak isteyenler ise ilan saatinden başlayarak kırk sekiz saat içinde birliğe katılmaya mecburdur. Yurt dışında bulunanlar en geç altı saat içinde konsolosluk veya elçiliklere başvurmak ve kırk sekiz saat içinde birliğine katılmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yabancı memleketlerde bulunanlar bulundukları yerin elçilik veya konsolosluklarınca çağrılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Seferberlik ve savaş hâllerinde birliğe katılışlarda gecikme olması hâlinde yükümlüler mazeretlerini belgelemek zorundadır. Yurt içinden ve yurt dışından Kanunda belirtilen süreden sonra yapılan katılışlarda mazeretlerini belgelemeyenler hakkında 24 üncü madde hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Seferberlik tatbikatlarına ve ferdî seferberlik eğitimlerine sevk için çağrıldıkları hâlde 23 üncü maddedeki mazeretlere sahip olan yedek personel, bu mazeretlerini kanıtlayan belgeleri askerlik şubesine teslim etmek zorundadır. Bunlar hakkında bakaya işlemi yapılmaz. Mazeret bitimini müteakip yedek personel birliklerine sevk edilir. Bu mazeretler dışındaki nedenlerle silahaltına çağrılıp birlikte işleme tabi olduğu kişilerin en son gönderilme tarihine kadar askerlik şubesine gelmeyenler ile askerlik şubesine gelip sevk evrakını alanlardan, kendilerine verilen yol süresi sonunda birlikte işleme tabi olduğu kişilerin en son gönderilme tarihine kadar birliğine katılmayanlar bakaya olarak kabul edilirler ve haklarında 24 üncü ve 26 ncı madde hükümleri uygulanır ve eksik hizmetleri tamamlattırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="57" başlık="Yedek personelin ertelemesi">
      <mvz-fıkra no="1">
        <template>Yedek personelin erteleme usul ve esasları Cumhurbaşkanlığınca çıkarılan yönetmelik ile belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="58" başlık="Sağlık sorunu bulunanlar">
      <mvz-fıkra no="1">
        <template>Barış zamanı ile seferberlik ve savaş hâlinde sağlık durumunda değişiklik olduğunu beyan eden sefer görev emri almış yedek personel sağlık durumlarının tespiti için askerlik şubesi başkanlıklarınca Sağlık Bakanlığınca belirlenen en yakın yetkili sağlık kurullarına sevk edilir. Alacakları sağlık kurulu raporuna göre işlem yapılır. Sevk belgesini aldıktan sonra istirahat raporu alanların istirahatleri sonunda kalan hizmetleri tamamlattırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="59" başlık="Terhis">
      <mvz-fıkra no="1">
        <template>Seferberlik ve savaş hâlinde terhis tarihi Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>

    <mvz-madde no="60" başlık="Askerlik şubeleri">
      <mvz-fıkra no="1">
        <template>Askerlik şubeleri, kendi şubelerine kayıtlı yükümlüler hakkında yaptıkları işlemleri, diğer askerlik şubelerine kayıtlı yükümlüler hakkında da yapar ve neticesini ilgili askerlik şubesine bildirir.</template>

    <mvz-madde no="61" başlık="Yönetmelik">

        <template>Bu Kanunun uygulanması ile ilgili usul ve esasların belirlenmesine ilişkin yönetmelik, bu Kanunun yayımı tarihinden itibaren altı ay içinde Bakanlıkça hazırlanır.</template>

    <mvz-madde no="63" başlık="Yürürlükten kaldırılan kanunlar">
      <mvz-fıkra no="1">
        <template>21/6/1927 tarihli ve 1111 sayılı Askerlik Kanunu ile 16/6/1927 tarihli ve 1076 sayılı Yedek Subaylar ve Yedek Askeri Memurlar Kanunu yürürlükten kaldırılmıştır.</template>

      <mvz-fıkra no="2">

      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Geçiş hükümleri" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce, mülga 1111 sayılı Kanun kapsamında erteli durumda bulunanlar için, erteleme şartlarını kaybetmedikleri sürece mülga 1111 sayılı Kanundaki yaş süreleri geçerlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığının erbaş ve er ile askerlik yükümlüsü ihtiyacı İçişleri Bakanlığınca Bakanlığa bildirilir ve bu Kanun hükümleri çerçevesinde Bakanlık tarafından Cumhurbaşkanı kararı ile belirlenecek süre ile karşılanır. Bu suretle Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı emrine yükümlülük esası ile verilen personel hakkında diğer yükümlülerin tabi olduğu hükümler uygulanır. 5 inci maddenin üçüncü fıkrası kapsamında askerlik hizmetine devam edenlerden Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı emrine verilenlerin sayı, istek, tercih durumları ve özlük hakları bu Kanun hükümlerine uygun olarak ilgisine göre Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığı tarafından yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun yürürlüğe girdiği tarihte her ne sebeple olursa olsun henüz fiilî askerlik hizmetine başlamamış yoklama kaçağı, bakaya veya saklı olanlardan; istekli olanlar, 1/11/2019 tarihine kadar başvurmaları ve bu tarihe kadar 9 uncu maddede belirlenen bedeli peşin ödemeleri şartıyla kuraya tabi tutulmaksızın 9 uncu madde hükümlerinden yararlandırılırlar. Bu kapsamda bedelli askerlik yükümlülüğünü tamamlayanlar hakkında mülga 1111 sayılı Kanun ile 24 üncü madde gereğince verilen idari para cezalarının tahsilinden vazgeçilir. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun yürürlüğe girdiği tarihte askerlik hizmetine erbaş ve er olarak devam edenlerden altı aylık hizmet süresini tamamlayan ve 5 inci maddenin üçüncü fıkrası kapsamında askerlik hizmetine devam etmek için istekli olanlar hakkında 5 inci maddede belirtilen esaslar uygulanır. Bunlardan talepleri kabul edilenler altı ay süre ile sınırlı olmak üzere askerlik hizmetine devam ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanunun yürürlüğe girdiği tarihte askerlik hizmet süresini tamamlayan erbaş ve erlerin terhis tarihi, bölgedeki ulaşım imkânları dikkate alınarak memleketlerine sevk edildikleri tarihtir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanunun yürürlüğe girdiği tarihte askerlik hizmet süresini tamamlayanlar ile hâlen muvazzaflık hizmetini yerine getirenler hakkında mülga 1111 sayılı Kanun gereğince verilen idari para cezalarından ödenmemiş olanların tahsilinden vazgeçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren altı ay içerisinde muvazzaflık hizmetine başlayanlar hakkında mülga 1111 sayılı Kanun ile 24 üncü madde gereğince verilen idari para cezalarından askere sevk tarihi itibarıyla ödenmemiş olanların tahsilinden vazgeçilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Mülga 1111 sayılı Kanun gereği dövizle askerlik kapsamından çıkarılanların askerlik hizmetini yapmış sayılmasına ilişkin usul ve esaslar" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Mülga 1111 sayılı Kanuna göre dövizle askerlik kapsamından çıkarılanlardan; ödemeleri gereken yabancı ülke parasını ödemedikleri veya herhangi bir takvim yılında toplam olarak 184 gün ve daha fazla süreyle yurt içinde bulundukları için dövizle askerlik kapsamından çıkarılanların, yurt dışı temsilciliklere veya askerlik şubelerine kendileri, vekilleri ya da vasileri aracılığıyla 31/12/2025 tarihine kadar müracaat etmeleri ve 40.000 gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarın müracaat tarihinde Türkiye Cumhuriyet Merkez Bankasınca tespit edilen döviz alış kuruna göre avro veya karşılığı kadar konvertibl yabancı ülke parasını müracaat tarihinden itibaren 10 iş günü içinde ayrıca ödemeleri hâlinde;</template>

          <template>Önceden ödemiş oldukları döviz tutarı, müracaat tarihindeki 39 uncu maddenin birinci fıkrasında öngörülen tutardan az olanlar, eksik kalan tutarı müracaat tarihinden itibaren 10 iş günü içinde ödemeleri hâlinde askerlik hizmetini yerine getirmiş sayılır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Önceden ödemiş oldukları döviz tutarı, müracaat tarihindeki 39 uncu maddenin birinci fıkrasında öngörülen tutara eşit veya bu tutardan fazla olanlar ise askerlik hizmetini yerine getirmiş sayılır. Ancak bunların fazladan ödedikleri döviz geri ödenmez.</template>
