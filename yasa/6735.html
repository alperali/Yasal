  <mvz-künye tür="kanun" no="6735" başlık="ULUSLARARASI İŞGÜCÜ KANUNU"
             tarih="28/7/2016" rgazete-tarih="13/8/2016" rgazete-sayı="29800"
             düstur-tertip="5" düstur-cilt="57" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; uluslararası işgücüne ilişkin politikaların belirlenmesi, uygulanması, izlenmesi ile yabancılara verilecek çalışma izni ve çalışma izni muafiyetlerine dair iş ve işlemlerde izlenecek usul ve esasları, yetki ve sorumlulukları ve uluslararası işgücü alanındaki hak ve yükümlülükleri düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun; Türkiye’de çalışmak için başvuruda bulunan veya çalışan, bir işveren yanında mesleki eğitim görmek üzere başvuruda bulunan veya görmekte olan, staj yapmak üzere başvuruda bulunan veya staj yapan yabancılar ile Türkiye’de geçici nitelikte hizmet sunumu amacıyla bulunan sınırötesi hizmet sunucusu yabancıları ve yabancı çalıştıran veya çalıştırmak üzere başvuruda bulunan gerçek ve tüzel kişileri kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalışma izni almaktan muaf tutulan yabancıların iş ve işlemleri bu Kanun hükümlerine göre yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun uygulanmasında, Türkiye’nin taraf olduğu ikili veya çok taraflı anlaşmalar ile uluslararası sözleşme hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Bağımsız çalışma izni: Yabancıya Türkiye’de kendi ad ve hesabına çalışma hakkı veren çalışma iznini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakanlık: Çalışma ve Sosyal Güvenlik Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Çalışma izni: Bakanlıkça resmî bir belge şeklinde düzenlenen ve geçerlilik süresi içinde yabancıya Türkiye’de çalışma ve ikamet hakkı veren izni,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Çalışma izni muafiyeti: Bakanlıkça resmî bir belge şeklinde düzenlenen ve geçerlilik süresi içinde yabancıya Türkiye’de çalışma izni almaksızın çalışma ve ikamet hakkı veren muafiyeti,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Genel Müdürlük: Uluslararası İşgücü Genel Müdürlüğünü,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Kanuni çalışma izni süresi: Yabancının, kanuni yükümlülüklerinin yerine getirilmesi suretiyle çalışma izniyle çalıştığı süreyi,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Sınırötesi hizmet sunucusu: Türkiye’de geçici nitelikte olmak üzere ve herhangi bir hizmet sunumu amacıyla bulunan ve ücretini Türkiye’deki ya da Türkiye dışındaki bir kaynaktan alan yabancıyı,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Süresiz çalışma izni: Yabancıya, Türkiye’de süresiz çalışma hakkı veren çalışma iznini,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Turkuaz Kart: Yabancıya, Türkiye’de süresiz çalışma hakkı, mevzuat hükümlerine göre eş ve bakmakla yükümlü olduğu çocuklarına ise ikamet hakkı veren belgeyi,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Uzun dönem ikamet izni: 4/4/2013 tarihli ve 6458 sayılı Yabancılar ve Uluslararası Koruma Kanununun 42 nci maddesi uyarınca verilen ikamet iznini,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Yabancı: Türkiye Cumhuriyeti Devleti ile vatandaşlık bağı bulunmayan kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Yetkili aracı kurum: Nitelikleri ve görev çerçevesi yönetmelikle belirlenen ve Bakanlık tarafından yetkilendirilen kurum veya kuruluşu,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Uluslararası İşgücü Politikasının Belirlenmesi ve İzlenmesi">
    <mvz-madde no="4" başlık="Uluslararası işgücü politikasının belirlenmesi">
      <mvz-fıkra no="1">
        <template>Bakanlık, Uluslararası İşgücü Politikası Danışma Kurulu kararlarını dikkate alarak uluslararası işgücüne ilişkin politika belirlemeye ve belirlenen politikayı uygulamaya yönelik ulusal ve uluslararası düzeyde faaliyette bulunmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Uluslararası işgücü politikası; uluslararası işgücü hareketliliği ve bölgesel gelişmeler ile Göç Politikaları Kurulu kararları, istihdam ve çalışma hayatına ilişkin gelişmeler, sektörel ve ekonomik dönemsel değişiklikler, kalkınma plan ve programları, yabancının uyruğunda bulunduğu ülkeyle ikili ekonomik, sosyal ve kültürel ilişkiler, Türkiye’nin taraf olduğu ikili veya çok taraflı anlaşmalar ve uluslararası sözleşmeler, kamu düzeni, kamu güvenliği ve kamu sağlığı dikkate alınarak belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bakanlık, uluslararası işgücü politikasının hazırlanmasında ilgili kurum ve kuruluşların görüşlerini alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="5" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="6" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="7" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="8" durum="mülga">
        <template></template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Uluslararası işgücünün izlenmesi ve değerlendirilmesi">
      <mvz-fıkra no="1">
        <template>Bakanlık, yabancı istihdamı taleplerini almak, değerlendirmek ve uluslararası işgücünün etkilerini izlemek üzere Yabancı Başvuru, Değerlendirme ve İzleme Sistemi kurar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık, kamu güvenliğine ilişkin hususlar saklı kalmak üzere; yabancılara, yabancı istihdamı ihtiyacına ve bu Kanun kapsamındaki diğer hususlara ilişkin olarak kamu kurum ve kuruluşları ile gerçek ve tüzel kişilerden bilgi ve belge talep edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bilgi paylaşımına ilişkin usul ve esaslar, ilgili kurum ve kuruluşların görüşleri alınarak Bakanlık tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Çalışma İzni ve Muafiyet">
    <mvz-madde no="6" başlık="Çalışma izninde yetki ve yükümlülük">
      <mvz-fıkra no="1">
        <template>Çalışma izni, 4 üncü maddeye göre belirlenen uluslararası işgücü politikası esas alınarak Bakanlıkça verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamında yer alan yabancıların çalışma izni olmaksızın Türkiye’de çalışmaları veya çalıştırılmaları yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Diğer kanunlarda ya da Türkiye’nin taraf olduğu ikili veya çok taraflı anlaşmalar veya uluslararası sözleşmelerde çalışma izni almadan çalışabileceği belirtilen yabancılar, bu Kanuna göre çalışma izni almadan çalışabilir veya çalıştırılabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>29/5/2009 tarihli ve 5901 sayılı Türk Vatandaşlığı Kanununun 28 inci maddesi kapsamında olanların çalışma hakkı saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Çalışma izni başvurusu ve değerlendirilmesi">
      <mvz-fıkra no="1">
        <template>Çalışma izni başvuruları yurt içinde doğrudan Bakanlığa, yurt dışında yabancının vatandaşı olduğu veya yasal olarak bulunduğu ülkedeki Türkiye Cumhuriyeti büyükelçilikleri veya başkonsolosluklarına yapılır. Yurt dışında yapılan çalışma izni başvuruları Türkiye Cumhuriyeti büyükelçilikleri veya başkonsolosluklarınca Bakanlığa iletilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalışma izni başvuruları yetkili aracı kurum tarafından da yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çalışma izni uzatma başvurusu, çalışma izni süresinin dolmasına altmış gün kalmasından itibaren ve her durumda çalışma izni süresi dolmadan yapılır. Bu süre dolduktan sonra yapılan uzatma başvuruları reddedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Çalışma izni başvurusu uluslararası işgücü politikasına göre değerlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bakanlıkça gerek görülen hâllerde, ilgili kamu kurum ve kuruluşları ile kamu kurumu niteliğindeki meslek kuruluşlarının görüşleri dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bakanlık, Uluslararası İşgücü Politikası Danışma Kurulu kararları doğrultusunda çalışma izni başvurusunun değerlendirilmesinde ve çalışma izni puanlama sisteminin oluşturulmasında kullanılacak kriterleri belirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Başvuruda eksik bilgi veya belgelerin olması hâlinde, bu eksiklikler tamamlanıncaya kadar başvurunun değerlendirilmesi ertelenir. Erteleme süresi, bilgi veya belge eksikliklerinin tamamlanmasını geciktiren mücbir bir sebebin varlığının resmî bir makamdan belgelendirildiği hâller dışında otuz günü aşamaz. Erteleme süresi sonunda eksiklikleri tamamlanmayan başvurular reddedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Usulüne uygun olarak yapılan başvuruların değerlendirilmesi, bilgi ve belgelerin tam olması kaydıyla otuz gün içinde tamamlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Ön izin">
      <mvz-fıkra no="1">
        <template>Mesleki yeterlilik gerektiren sağlık ve eğitim hizmetlerinde çalışacak yabancıların çalışma izni başvurularının değerlendirilmesinde ön izin alınması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sağlık hizmetlerinde Sağlık Bakanlığı, eğitim hizmetlerinde Millî Eğitim Bakanlığı bu hizmetlerde mesleki faaliyette bulunacak yabancılara ön izin vermeye yetkili olup ön izin alınması gereken meslekler anılan bakanlıkların görüşü alınarak Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ön izin alan yabancıların çalışma izni başvurularının değerlendirilmesinde, bu Kanunun 9 uncu maddesinin birinci fıkrasının (d) bendi hükmü uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>4/11/1981 tarihli ve 2547 sayılı Yükseköğretim Kanununun 34 üncü maddesi uyarınca çalışacak yabancı uyruklu öğretim elemanlarına çalışma izni, Yükseköğretim Kurulunun ilgili mevzuata göre vereceği ön izne istinaden Bakanlıkça verilir. Ön izne istinaden çalışacak yabancı öğretim elemanlarının çalışma izni başvurularının değerlendirilmesinde, bu Kanunun 7 nci maddesinin dördüncü, beşinci ve altıncı fıkraları ile (f), (g) ve (ğ) bentleri saklı kalmak üzere 9 uncu maddesinin birinci fıkrası uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Çalışma izni uzatma başvuruları da ilgili bakanlığın veya Yükseköğretim Kurulunun ön iznine tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>28/2/2008 tarihli ve 5746 sayılı Araştırma, Geliştirme ve Tasarım Faaliyetlerinin Desteklenmesi Hakkında Kanun ve ilgili mevzuat kapsamında Ar-Ge Merkezi Belgesi olan firmalarda Ar-Ge personeli olarak çalışacak yabancıların çalışma izni başvuruları Bilim, Sanayi ve Teknoloji Bakanlığının olumlu görüşü olması hâlinde değerlendirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Çalışma izni başvurusunun reddi">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 7 nci maddesine göre yapılan değerlendirme neticesinde;</template>
        <mvz-bent no="a">
          <template>Uluslararası işgücü politikasına uygun olmayan,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sahte veya yanıltıcı bilgi ve belgelerle yapılan,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yabancı istihdam edilmesine ilişkin gerekçesi yeterli görülmeyen,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Diğer kanunlarda Türk vatandaşlarına hasredilen iş ve meslekler için yapılan,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Gerekli nitelik ve uzmanlığı taşımadığı anlaşılan yabancılara ilişkin olan,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bakanlıkça belirlenen değerlendirme kriterlerini karşılamayan,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>6458 sayılı Kanunun 7 nci, 15 inci ve 54 üncü maddeleri kapsamında olduğu İçişleri Bakanlığınca bildirilen yabancılara ilişkin olan,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kamu düzeni, kamu güvenliği veya kamu sağlığı açısından Türkiye’de çalışmasında sakınca görülen yabancılara ilişkin olan,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Dışişleri Bakanlığının uygun görüşü olması durumu hariç, Türkiye Cumhuriyetinin tanımadığı veya diplomatik ilişkisinin bulunmadığı ülke vatandaşları için yapılan,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kanuni süresi içinde yapılmayan veya eksiklikleri tamamlanmayan,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>başvurular reddedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Çalışma izni türleri">
      <mvz-fıkra no="1">
        <template>Başvurunun olumlu değerlendirilmesi hâlinde yabancıya, iş veya hizmet sözleşmesinin süresini aşmamak koşuluyla, gerçek veya tüzel kişiye ya da kamu kurum veya kuruluşuna ait belirli bir işyerinde veya bunların aynı işkolundaki işyerlerinde belirli bir işte çalışmak şartıyla ilk başvuruda en çok bir yıl geçerli çalışma izni verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun 7 nci maddesine göre yapılacak uzatma başvurusunun olumlu değerlendirilmesi hâlinde yabancıya aynı işverene bağlı olarak ilk uzatma başvurusunda en çok iki yıl, sonraki uzatma başvurularında ise en çok üç yıla kadar çalışma izni verilir. Ancak, farklı bir işveren yanında çalışmak üzere yapılan başvurular bu maddenin birinci fıkrası kapsamında değerlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Türkiye’de uzun dönem ikamet izni veya en az sekiz yıl kanuni çalışma izni olan yabancılar süresiz çalışma iznine başvurabilir. Ancak, yabancının başvuru şartlarını taşıması yabancıya mutlak hak sağlamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Süresiz çalışma izni olan yabancı, uzun dönem ikamet izninin sağladığı tüm haklardan yararlanır. Süresiz çalışma izni olan yabancı, özel kanunlardaki düzenlemeler hariç, sosyal güvenliğe ilişkin kazanılmış hakları saklı kalmak ve bu hakların kullanımında ilgili mevzuat hükümlerine tabi olmak şartıyla, Türk vatandaşlarına tanınan haklardan yararlanır. Süresiz çalışma izni olan yabancının seçme, seçilme ve kamu görevlerine girme hakkı ile askerlik hizmeti yapma yükümlülüğü yoktur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>13/1/2011 tarihli ve 6102 sayılı Türk Ticaret Kanununa göre kurulmuş olan;</template>
        <mvz-bent no="a">
          <template>Limited şirketlerin şirket ortağı olan müdürü,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Anonim şirketlerin şirket ortağı olan yönetim kurulu üyesi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sermayesi paylara bölünmüş komandit şirketlerin yönetici olan komandite ortağı,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>olan yabancılar çalışma izni alarak çalışabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Profesyonel meslek mensubu yabancılara, diğer kanunlarda belirtilen özel şartların sağlanması kaydıyla bağımsız çalışma izni verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bağımsız çalışma izninin uluslararası işgücü politikası doğrultusunda değerlendirilmesinde, yabancının; eğitim düzeyi, mesleki deneyimi, bilim ve teknolojiye katkısı, Türkiye’deki faaliyetinin veya yatırımının ülke ekonomisine ve istihdama etkisi, yabancı şirket ortağı ise sermaye payı ile Uluslararası İşgücü Politikası Danışma Kurulu önerileri doğrultusunda Bakanlıkça belirlenecek diğer hususlar dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bağımsız çalışma izni, bu maddede yer alan süre sınırlamalarına tabi olmaksızın süreli olarak düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Turkuaz Kart">
      <mvz-fıkra no="1">
        <template>Uluslararası işgücü politikası doğrultusunda; eğitim düzeyi, mesleki deneyimi, bilim ve teknolojiye katkısı, Türkiye’deki faaliyetinin veya yatırımının ülke ekonomisine ve istihdama etkisi ile Uluslararası İşgücü Politikası Danışma Kurulu önerileri ve Bakanlıkça belirlenen usul ve esaslara göre başvurusu uygun görülen yabancılara Turkuaz Kart verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Turkuaz Kart, ilk üç yılı geçiş süresi olmak kaydıyla verilir. Bakanlık, geçiş süresi içinde işveren veya yabancıdan yürütülen faaliyetlere ilişkin bilgi ve belge talep edebilir. Geçiş süresi içinde 15 inci madde uyarınca iptal edilmeyen Turkuaz Kartta yer alan geçiş süresi kaydı, yabancının başvurusu hâlinde kaldırılır ve süresiz Turkuaz Kart verilir. Bu başvuru, geçiş süresinin dolmasına yüz seksen gün kalmasından itibaren, her durumda geçiş süresi dolmadan yapılır. Bu süre dolduktan sonra geçiş süresi kaydının kaldırılmasına ilişkin yapılan başvuru reddedilir ve Turkuaz Kart geçersiz hale gelir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Turkuaz Kart sahibi yabancının, mevzuat hükümlerine göre eş ve bakmakla yükümlü olduğu çocuklarına Turkuaz Kart sahibi yakını olduğunu gösteren ve ikamet izni yerine geçen belge verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Turkuaz Kart sahibi yabancı bu Kanunda düzenlenen süresiz çalışma izninin sağladığı haklardan yararlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Turkuaz Kart uygulamasında; akademik alanda uluslararası kabul görmüş çalışmaları bulunanlar ile bilim, sanayi ve teknolojide ülkemiz bakımından stratejik kabul edilen bir alanda öne çıkmış olanlar ya da ihracat, istihdam veya yatırım kapasitesi olarak ulusal ekonomiye önemli katkı sağlayan ya da sağlaması öngörülenler nitelikli yabancı olarak değerlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Geçici koruma sağlanan yabancılara bu madde hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Çalışma izninin mahiyeti">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre verilen çalışma izni veya çalışma izni muafiyeti, 6458 sayılı Kanunun 27 nci maddesi uyarınca ikamet izni yerine geçer. Ancak, 6458 sayılı Kanunda tanımlanan mülteci ya da ikincil koruma statüsü dışında yabancının herhangi bir nedenle ikamet izni olması yabancıya çalışma hakkı vermez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yurt dışından yapılan başvuruya istinaden çalışma izni verilen yabancı, çalışma izninin geçerliliğinin başladığı tarihten itibaren altı ay içinde Türkiye’ye gelmek zorundadır. Bu süre içinde Türkiye’ye gelmeyen yabancının çalışma izni iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Türkiye’nin taraf olduğu ikili veya çok taraflı sözleşmelerle sağlanan haklar saklı kalmak kaydıyla ve karşılıklılık ilkesi çerçevesinde çalışma izinleri; iş piyasasındaki durum ve çalışma hayatındaki gelişmeler, istihdama ilişkin sektörel ve ekonomik konjonktür koşullarının gerekli kıldığı hâllerde, belirli bir süre için tarım, sanayi veya hizmet sektörleri, belirli bir meslek, işkolu veya mülki ve coğrafi alan itibarıyla sınırlandırılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Çalışma izni muafiyeti">
      <mvz-fıkra no="1">
        <template>Çalışma izni muafiyeti kapsamında olan yabancılar, çalışma izni muafiyeti almak kaydıyla çalışabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalışma izni muafiyeti başvuruları yurt içinde doğrudan Bakanlığa, yurt dışında yabancının vatandaşı olduğu veya yasal olarak bulunduğu ülkedeki Türkiye Cumhuriyeti büyükelçilikleri ya da başkonsolosluklarına yapılır. Yurt dışında yapılan bu başvurular Türkiye Cumhuriyeti büyükelçilikleri veya başkonsolosluklarınca Bakanlığa iletilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çalışma izni muafiyeti başvuruları yetkili aracı kurum tarafından da yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Çalışma izni muafiyeti başvurusunda bu Kanunun 7 nci maddesinin dördüncü, beşinci ve yedinci fıkraları uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Başvurusu olumlu değerlendirilen yabancılara Bakanlıkça çalışma izni muafiyeti düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Çalışma izni muafiyetiyle geçirilen süreler, kanuni çalışma izni veya ikamet izni sürelerinin hesabında dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>6102 sayılı Kanuna göre kurulmuş anonim şirketlerin Türkiye’de ikamet etmeyen yönetim kurulu üyesi ve diğer şirketlerin yönetici sıfatı olmayan ortağı ile Türkiye’de gerçekleştirdiği faaliyetleri yüz seksen gün içinde doksan günü geçmeyen sınırötesi hizmet sunucusu, çalışma izni muafiyeti kapsamında değerlendirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Dışişleri Bakanlığına yapılacak başvurular">
      <mvz-fıkra no="1">
        <template>Yabancı ülkelerin Türkiye’deki diplomatik ve konsüler temsilciliklerinin;</template>
        <mvz-bent no="a">
          <template>Bağlı birimi olarak faaliyet gösteren okullarda, kültür kurumlarında ve din kurumlarında görevli yabancılar, çalışma izni muafiyeti,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>18/4/1961 tarihli Diplomatik İlişkiler Hakkında Viyana Sözleşmesi ve 24/4/1963 tarihli Konsolosluk İlişkileri Hakkında Viyana Sözleşmesi kapsamında bağlı birimi sayılmayan okul, kültür veya din kurumlarında görevli yabancılar çalışma izni</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>almak kaydıyla çalışabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yabancı ülkelerin Türkiye’deki diplomatik ve konsüler temsilciliklerinde diplomatik kadro üyesi, konsolosluk memuru, idari ve teknik kadro üyesi ve konsolosluk hizmetlisi, Türkiye’deki uluslararası kuruluşlarda uluslararası memur ve idari ve teknik personel olarak görev yapan kişilerin;</template>
        <mvz-bent no="a">
          <template>Eş ve çocukları ile karşılıklılık esasına veya ilgili ülkeyle yapılmış bulunan ikili anlaşmaya göre belirlenmiş yakınları; bu Kanunda, ilgili ikili anlaşmada ve mevzuatta zikredilen çalışma izni muafiyeti hükümleri saklı kalmak kaydıyla Türkiye’de çalışma izni alarak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Özel hizmetinde çalışan yabancılar, çalışma izni muafiyeti alarak,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>çalışabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin ikinci fıkrasının (b) bendinde belirtilen yabancıların, aynı fıkrada belirtilen statüde olmayan işveren yanında çalışmak üzere yurt içinden yapacakları çalışma izni veya çalışma izni muafiyeti başvuruları kabul edilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde kapsamındaki başvurular Dışişleri Bakanlığına yapılır. Dışişleri Bakanlığınca uygun görülen başvurular Bakanlığa iletilir. Bakanlığa iletilen bu başvurulara çalışma izni veya çalışma izni muafiyeti düzenlenmesinde İçişleri Bakanlığının olumlu görüşü aranır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Çalışma izni ve çalışma izni muafiyetinin geçerliliği ve iptali">
      <mvz-fıkra no="1">
        <template>Çalışma izni ve çalışma izni muafiyeti, sürenin sona ermesi veya Bakanlıkça iptal edilmesiyle geçerliliğini kaybeder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yabancının veya işverenin talebi dışında çalışma izni veya çalışma izni muafiyeti, yabancının;</template>
        <mvz-bent no="a">
          <template>Çalışma izni veya çalışma izni muafiyetinin geçerlilik tarihinden itibaren altı ay içinde Türkiye’ye gelmemesi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İçişleri Bakanlığı veya Dışişleri Bakanlığının uygun görüşünün bulunması hâli hariç, pasaportunun veya pasaport yerine geçen belgesinin geçerlilik süresinin uzatılmaması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu Kanunda belirtilen hükümlere aykırı olarak çalıştığının tespiti,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Çalışmasının herhangi bir nedenle sona ermesi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Çalışma izni başvurusunun sahte veya yanıltıcı bilgi ve belgelerle yapıldığının sonradan tespiti,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>11 inci madde kapsamında olması ve geçiş süresi içinde talep edilen bilgi ve belgeleri sunmaması ya da bunların niteliklerini kaybettiğinin anlaşılması,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>6458 sayılı Kanunun 7 nci, 15 inci ve 54 üncü maddeleri kapsamında olduğunun İçişleri Bakanlığınca bildirilmesi,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kamu düzeni, kamu güvenliği veya kamu sağlığı açısından Türkiye’de çalışmasında sakınca olduğunun ilgili kamu kurum ve kuruluşlarınca bildirilmesi,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Sağlık sebepleri veya zorunlu kamu hizmeti gibi mücbir sebepler dışında süreli çalışma izinlerinde aralıksız olarak altı aydan, bağımsız ve süresiz çalışma izinlerinde ise aralıksız olarak bir yıldan uzun süre Türkiye dışında kalması,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Turkuaz Kart sahibi olması hâlinde yurt dışında kalış süresinin Bakanlıkça belirlenen süreyi aşması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>durumlarında iptal edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="İstisnalar">
    <mvz-madde no="16" başlık="Çalışma izninin istisnai olarak verilebileceği yabancılar">
      <mvz-fıkra no="1">
        <template>Bakanlıkça belirlenen uluslararası işgücü politikasına uygun olarak;</template>
        <mvz-bent no="a">
          <template>Eğitim düzeyi, ücreti, mesleki deneyimi, bilim ve teknolojiye katkısı ve benzeri özellikleri itibarıyla nitelikli işgücü olarak değerlendirilen,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bilim ve teknolojiye katkısı, yatırım veya ihracat düzeyi, sağlayacağı istihdamın büyüklüğü ve benzeri özellikleri itibarıyla nitelikli yatırımcı olarak değerlendirilen,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Belirli bir süre için işvereni tarafından Türkiye’de gerçekleştirilen bir projede istihdam edilen,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>İçişleri Bakanlığı veya Dışişleri Bakanlığı tarafından Türk soylu olduğu bildirilen,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kuzey Kıbrıs Türk Cumhuriyeti vatandaşı,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Avrupa Birliği üyesi ülke vatandaşı,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>6458 sayılı Kanun uyarınca uluslararası koruma başvurusu sahibi, şartlı mülteci, geçici koruma sağlanan veya vatansız ya da mağdur destek sürecinden yararlanan insan ticareti mağduru,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Bir Türk vatandaşı ile evli ve eşiyle Türkiye’de evlilik birliği içinde yaşayan,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Yabancı devletlerin ve uluslararası kuruluşların Türkiye’deki temsilciliklerinde diplomatik dokunulmazlığı olmadan çalışan,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Alanındaki başarısı ile uluslararası düzeyde temayüz etmiş olarak bilimsel, kültürel, sanatsal veya sportif amaçla Türkiye’ye gelen,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Sınırötesi hizmet sunucusu,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yabancılara bu Kanunun 7 nci, 9 uncu ve 10 uncu maddelerinin uygulanmasına ilişkin istisnalar tanınabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Uluslararası koruma kapsamında olan yabancılar">
      <mvz-fıkra no="1">
        <template>6458 sayılı Kanun uyarınca uluslararası koruma talebinde bulunan ve henüz başvurusu hakkında son karar verilmemiş veya şartlı mülteci yabancılar; uluslararası koruma başvurusu tarihinden, geçici koruma sağlanan yabancılar ise geçici koruma kimlik belgesinin düzenlendiği tarihten altı ay sonra çalışma izni veya çalışma izni muafiyeti almak için başvurabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamında çalışma izni veya çalışma izni muafiyetine başvuru hakkı tanınan yabancılara çalışma izni veya çalışma izni muafiyeti verilmesinde İçişleri Bakanlığının olumlu görüşü aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Geçerli çalışma izni veya çalışma izni muafiyetine sahip olunması bu yabancılara Türkiye’de mutlak kalış hakkı sağlamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Çalışma izni, 10 uncu maddede belirtilen sürelerle verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>6458 sayılı Kanunun;</template>
        <mvz-bent no="a">
          <template>77 nci maddesi uyarınca uluslararası koruma başvurusunun geri çekilmesi veya geri çekilmiş sayılması, 85 inci maddesi uyarınca uluslararası koruma statüsünün sona ermesi veya 86 ncı maddesi uyarınca uluslararası koruma statüsünün iptali hâlinde İçişleri Bakanlığının bildirimi üzerine,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>91 inci maddesi uyarınca sağlanan geçici korumanın Cumhurbaşkanı kararıyla sonlandırılması veya bireysel olarak sona ermesi ya da iptali hâlinde Cumhurbaşkanı kararı veya İçişleri Bakanlığının bildirimi üzerine,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>verilmiş olan çalışma izni veya çalışma izni muafiyetleri Bakanlıkça iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Uluslararası koruma başvuru sahibi, uluslararası koruma statüsü sahibi ve geçici koruma sağlanan yabancıların çalışma ve çalışma izni veya çalışma izni muafiyeti başvurusu hakkının il, süre, sektör, işkolu, iş ve meslek bakımından Göç Politikaları Kurulu kararları ve Bakanlığın uluslararası işgücü politikası dikkate alınarak uygulanması ve sınırlandırılmasına ilişkin usul ve esaslar İçişleri Bakanlığının görüşü alınarak Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Serbest bölgelerde çalışacak yabancılar">
      <mvz-fıkra no="1">
        <template>6/6/1985 tarihli ve 3218 sayılı Serbest Bölgeler Kanunu kapsamında çalışacak yabancıların çalışma izni başvuruları Ekonomi Bakanlığına yapılır. Ekonomi Bakanlığı tarafından yapılan değerlendirme neticesinde çalışma izni alması uygun görülen yabancılar Bakanlığa bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde kapsamında Ekonomi Bakanlığınca bildirilen yabancılara, bu Kanunun 9 uncu maddesinin birinci fıkrasının (f), (g) ve (ğ) bentleri hükümleri saklı kalmak kaydıyla Bakanlıkça çalışma izni düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun 21 inci, 22 nci ve 23 üncü maddeleri, 3218 sayılı Kanun kapsamındaki serbest bölgelerde uygulanmaz. Bu maddelerde düzenlenen konularda 3218 sayılı Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Yabancı öğrenciler">
      <mvz-fıkra no="1">
        <template>Türkiye’de bir yükseköğretim kurumunda örgün öğretim programlarına kayıtlı yabancı öğrenciler, çalışma izni almak kaydıyla çalışabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yabancı öğrencilerden ön lisans ve lisans düzeyinde öğrenim görmekte olanlar, öğrenimlerinin ilk yılının tamamlanmasından sonra çalışma iznine başvurabilir ve 22/5/2003 tarihli ve 4857 sayılı İş Kanunu uyarınca kısmi süreli çalışabilirler. Örgün öğretim programlarına kayıtlı lisansüstü öğrenciler için bu sınırlamalar uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yabancı öğrencilere verilen çalışma izinleri, geçerli öğrenci ikamet iznini ve bu ikamet izninin sağladığı hakları sona erdirmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yabancı öğrencilerin çalışmasına ilişkin usul ve esaslar Göç Politikaları Kurulunca belirlenen esaslar dikkate alınmak suretiyle, İçişleri Bakanlığının görüşü alınarak Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Türkiye’de yükseköğrenimini tamamlayan yabancının mezuniyet tarihinden itibaren bir yıl içinde çalışma izni başvurusu yapması hâlinde, başvuru Uluslararası İşgücü Politikası Danışma Kurulunca belirlenen esaslar doğrultusunda değerlendirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Yabancı mühendis ve mimarlar">
      <mvz-fıkra no="1">
        <template>Öğrenimlerini Türkiye’de bir yükseköğretim kurumunun mühendislik ve mimarlık fakültelerinde veya yurt dışında ilgili ülke makamları ve Yükseköğretim Kurulu tarafından tanınmış bir yükseköğretim kurumunda tamamlayarak mühendis ve mimar unvanlarını almış olan yabancılar bu Kanuna göre proje bazlı ve geçici süre ile çalışma izni alarak mühendislik ve mimarlık mesleklerini icra edebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="İtiraz, Yükümlülük, Denetim ve Cezalar">
    <mvz-madde no="21" başlık="İdari itiraz ve yargı yolu">
      <mvz-fıkra no="1">
        <template>Çalışma izni veya çalışma izni muafiyeti başvurusunun reddi ve düzenlenen belgelerin iptali kararları, yabancı çalıştıran işverene veya bağımsız çalışma izni, süresiz çalışma izni ya da Turkuaz Kart sahibi yabancıya 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümlerine göre tebliğ edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlığın bu Kanun kapsamında verdiği kararlara karşı ilgililer tarafından tebliğ tarihinden itibaren otuz gün içinde Bakanlığa itiraz edilebilir. İtirazın reddedilmesi hâlinde idari yargı yoluna başvurulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Bildirim ve sosyal güvenlik yükümlülüğü">
      <mvz-fıkra no="1">
        <template>Yabancı çalıştıran işverenler ile süresiz veya bağımsız çalışma izni bulunan yabancılar, çalışma izninin veya çalışma izni muafiyeti kapsamında çalışmanın başlaması ve sona ermesi durumu ile çalışma izni veya çalışma izni muafiyetinin iptalini gerektirecek hâlleri on beş gün içinde Bakanlığa bildirmekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalışma izni veya çalışma izni muafiyeti alan yabancılar ile yabancı çalıştıran işverenler, sosyal güvenlik mevzuatından kaynaklanan yükümlülüklerini kanuni süresi içinde 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu hükümlerine göre yerine getirirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Türkiye’nin taraf olduğu sosyal güvenlik sözleşmeleri hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Denetleme yetkisi">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki yabancıların ve işverenlerin bu Kanundan doğan yükümlülüklerini yerine getirip getirmedikleri Bakanlık iş müfettişleri ile Sosyal Güvenlik Kurumu müfettişleri ve sosyal güvenlik denetmenleri tarafından denetlenir. Bu Kanun gereğince yapılacak teftiş, denetim ve soruşturmalar, uygulamakla yükümlü olunan mevzuatın teftiş, denetim ve soruşturma hükümlerine göre yapılır ve bu hükümlere göre ilgili yaptırımlar uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu idarelerinin denetim elemanları ile kolluk kuvvetlerinin, kendi mevzuatları gereğince işyerlerinde yapacakları her türlü denetim, inceleme ve kontrol sırasında yabancı çalıştıran işverenler ile yabancıların bu Kanundan doğan yükümlülüklerini yerine getirmediklerini tespit etmeleri hâlinde, durum Bakanlığa bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkraya göre yapılan denetimler ve ikinci fıkraya göre yapılan bildirimler üzerine, gönderilen tutanaklara ve denetim raporlarına göre, bu Kanunda yer alan idari yaptırımlar Çalışma ve İş Kurumu il müdürünce uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanuna göre verilen idari para cezaları, tebliğinden itibaren bir ay içinde ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanuna göre;</template>
        <mvz-bent no="a">
          <template>Bildirim yükümlülüğünü yerine getirmeksizin,</template>
          <mvz-altbent no="1">
            <template>Bağımsız veya süresiz çalışma izni ile çalışan yabancıya dört yüz Türk lirası,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Yabancı çalıştıran işverene her bir yabancı için dört yüz Türk lirası,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Çalışma izni olmaksızın,</template>
          <mvz-altbent no="1">
            <template>Bir işverene bağlı olarak çalışan yabancıya iki bin dört yüz Türk lirası,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Bağımsız çalışan yabancıya dört bin sekiz yüz Türk lirası,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Yabancı çalıştıran işverene veya işveren vekiline her bir yabancı için altı bin Türk lirası,</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>tutarında idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Beşinci fıkrada sayılan fiillerin tekrarı hâlinde idari para cezaları bir kat artırılarak uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu Kanuna göre verilen idari para cezaları genel bütçeye gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Çalışma izni bulunmadan çalıştığı tespit edilen yabancılar sınır dışı edilmek üzere İçişleri Bakanlığına bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>İşveren veya işveren vekili, çalışma izni bulunmayan yabancının ve varsa eş ve çocuklarının konaklama giderlerini, ülkelerine dönmeleri için gerekli masrafları ve gerektiğinde sağlık harcamalarını karşılamak zorundadır. Bu gider, masraf ve harcamaların Göç İdaresi Genel Müdürlüğü bütçesinden karşılanması hâlinde, bu madde gereğince ödenen tutarlar, 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun uyarınca işveren veya işveren vekilinden tahsil edilir. Bu fıkranın uygulanmasına ilişkin usul ve esaslar İçişleri Bakanlığı ve Bakanlıkça müştereken belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Çeşitli Hükümler">
    <mvz-madde no="24" başlık="Çalışma izni ve çalışma izni muafiyetinin düzenlenmesi ve şekli">
      <mvz-fıkra no="1">
        <template>Çalışma izni ve çalışma izni muafiyeti, yabancının pasaport veya pasaport yerine geçen belgelerinin geçerlilik süresinden altmış gün daha kısa süreli ve her yabancı için ayrı verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalışma izni ve çalışma izni muafiyeti belgelerinin şekli ve içeriği Bakanlıkça belirlenir. Bu belgelerin basım ve dağıtım işlemleri Bakanlıkça yerine getirilir. Değerli kâğıt bedellerinin tahsiline ilişkin usul ve esaslar, Bakanlık ve Maliye Bakanlığınca müştereken belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanuna ilişkin;</template>
        <mvz-bent no="a">
          <template>Çalışma izni ve çalışma izni muafiyeti başvuru şartları ve işlemleri ile bunların kapsam, tür ve süreleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Çalışma izni muafiyeti kapsamında değerlendirilecek yabancılar ve çalışma alanları,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yabancıdan ve işverenden istenecek bilgi ve belgeler,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>İlgili kurum ve kuruluşlardan görüş alınmasına ilişkin süre, kapsam, içerik, bildirim ve benzeri hususlar,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Çalışma izni hükümlerinin istisnai uygulanması ve bu kapsama alınabilecek; gerçek kişi yabancıların eğitim düzeyi, ücreti, mesleki deneyimi, bilim ve teknolojiye katkısı, şirket ortaklarının sermaye payı ile tüzel kişilerin yatırım veya ihracat düzeyi, sağlayacağı istihdamın büyüklüğü ve benzeri özellikleri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bu Kanunun 16 ncı maddesi uyarınca çalışma izinlerinin istisnai olarak uygulanacağı yabancılara, bu Kanunun 7 nci, 9 uncu ve 10 uncu maddeleri hükümlerinin farklı uygulanmasına ilişkin hususlar,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Çalışma izni başvurusunun değerlendirilmesinde, reddinde ve çalışma izni puanlama sisteminin oluşturulmasında esas alınacak kriterler,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Belge düzenlenmesi ve teslimine ilişkin hususlar,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Çalışma izninin iptaline ve geçerliliğini yitirmesine ilişkin hususlar,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Sınırötesi hizmet sunucularının tanımı, türleri ile bu kapsamda sayılanlara ilişkin diğer hususlar,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Bu Kanunun 16 ncı maddesi uyarınca projede istihdam edilmeleri kaydıyla çalışma izinlerinin istisnai olarak verileceği yabancılara ve bu projelerin niteliklerine ilişkin hususlar,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Yetkili aracı kurumun nitelikleri, görev çerçevesi ve yetkilendirmeye ilişkin usul ve esaslar,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Benzeri özel düzenleme gerektirebilecek konular ve bu konulara bağlı bildirimler,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Uygulamaya yönelik diğer hususlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Bakanlıkça çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ekonomi Bakanlığı ve Bakanlıkça çıkarılan müşterek yönetmelikle;</template>
        <mvz-bent no="a">
          <template>3218 sayılı Kanun gereği serbest bölgelerde çalışacak yabancıların çalışma izni başvuruları ve çalışma izni belgesi düzenlenmesine ilişkin hususlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>5/6/2003 tarihli ve 4875 sayılı Doğrudan Yabancı Yatırımlar Kanunu kapsamındaki yabancı sermayeli şirket ve kuruluşlarda çalışma izni verilecek personelin tanımı ile çalışma izinlerine ilişkin özel nitelikteki diğer usul ve esaslar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Atıf yapılan hükümler">
      <mvz-fıkra no="1">
        <template>Diğer mevzuatta, 27/2/2003 tarihli ve 4817 sayılı Yabancıların Çalışma İzinleri Hakkında Kanuna yapılmış olan atıflar bu Kanuna yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Diğer mevzuatta yer alan “çalışma izni muafiyet teyit belgesi” veya “çalışma izni muafiyet belgesi” ibarelerinden bu Kanunda yer alan “çalışma izni muafiyeti”, “çalışma izni belgesi” ibaresinden ise bu Kanunda yer alan “çalışma izni” anlaşılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Yürürlükten kaldırılan ve değiştirilen hükümler">
      <mvz-fıkra no="1">
        <template>(27/1/1954 tarihli ve 6235 sayılı Türk Mühendis ve Mimar Odaları Birliği Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(21/2/1963 tarihli ve 210 sayılı Değerli Kağıtlar Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(2/7/1964 tarihli ve 492 sayılı Harçlar Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(4/11/1981 tarihli ve 2547 sayılı Yükseköğretim Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>(9/1/1985 tarihli ve 3146 sayılı Çalışma ve Sosyal Güvenlik Bakanlığının Teşkilat ve Görevleri Hakkında Kanun ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>(6/6/1985 tarihli ve 3218 sayılı Serbest Bölgeler Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>27/2/2003 tarihli ve 4817 sayılı Yabancıların Çalışma İzinleri Hakkında Kanun yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>(5/6/2003 tarihli ve 4875 sayılı Doğrudan Yabancı Yatırımlar Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>(29/5/2009 tarihli ve 5901 sayılı Türk Vatandaşlığı Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>(4/4/2013 tarihli ve 6458 sayılı Yabancılar ve Uluslararası Koruma Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Bu Kanuna ekli listede yer alan kadrolar ihdas edilerek 13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnamenin eki (I) sayılı Cetvelin Çalışma ve Sosyal Güvenlik Bakanlığına ait bölümüne eklenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="EK">
      <mvz-fıkra no="1">
        <template>Mevzuatta Uluslararası İşgücü Politikası Danışma Kuruluna yapılmış olan atıflar, Cumhurbaşkanınca belirlenen kurul veya mercie yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Geçiş hükümleri" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önceki mevzuat hükümlerine göre Bakanlıkça veya diğer kanunların verdiği yetkiye dayanarak diğer kamu kurum ve kuruluşlarınca verilmiş olan çalışma izinleri, sürelerinin sonuna kadar geçerlidir. Bu çalışma izinleri 15 inci madde uyarınca süresinin sona ermesi veya iptal edilmesi hâlinde geçerliliğini kaybeder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin yürürlüğe girdiği tarihten önceki mevzuat hükümlerine göre Bakanlıkça verilmiş ve geçerliliğini sürdüren süresiz çalışma izinleri, iptal edilmediği sürece geçerlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce yapılan ve işlemleri devam eden çalışma izni başvurularında, bu Kanunla yapılan değişikliklerden önceki mevzuat hükümlerinin başvuru sahibi lehine olan hükümleri dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun uygulanmasına ilişkin düzenlemeler yürürlüğe girinceye kadar mevcut düzenlemelerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin yürürlüğe girdiği tarihten itibaren altı ay süreyle başka bir işleme gerek kalmaksızın Bakanlıkta mevcut genel müdür yardımcısı ve daire başkanı kadrolarının birimler arasında yeniden dağılımını yapmaya Çalışma ve Sosyal Güvenlik Bakanı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
