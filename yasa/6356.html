  <mvz-künye tür="kanun" no="6356" başlık="SENDİKALAR VE TOPLU İŞ SÖZLEŞMESİ KANUNU"
             tarih="18/10/2012" rgazete-tarih="7/11/2012" rgazete-sayı="28460"
             düstur-tertip="5" düstur-cilt="53" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, işçi ve işveren sendikaları ile konfederasyonların kuruluşu, yönetimi, işleyişi, denetlenmesi, çalışma ve örgütlenmesine ilişkin usul ve esaslar ile işçilerin ve işverenlerin karşılıklı olarak ekonomik ve sosyal durumları ile çalışma şartlarını belirlemek üzere toplu iş sözleşmesi yapmalarına, uyuşmazlıkları barışçı yollarla çözümlemelerine, grev ve lokavta başvurmalarına ilişkin usul ve esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Bakanlık: Çalışma ve Sosyal Güvenlik Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Çerçeve sözleşme: Ekonomik ve Sosyal Konseyde temsil edilen işçi ve işveren konfederasyonlarına üye işçi ve işveren sendikaları arasında işkolu düzeyinde yapılan sözleşmeyi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Görevli makam: İşyeri toplu iş sözleşmesi için işyerinin, işletme toplu iş sözleşmesi için işletme merkezinin bağlı bulunduğu Çalışma ve İş Kurumu İl Müdürlüğünü, aynı Çalışma ve İş Kurumu İl Müdürlüğünün yetki alanına giren işyerleri için yapılacak grup toplu iş sözleşmelerinde bu işyerlerinin bağlı bulunduğu Çalışma ve İş Kurumu İl Müdürlüğünü, birden fazla Çalışma ve İş Kurumu İl Müdürlüğünün yetki alanına giren işyerlerini kapsayacak grup toplu iş sözleşmesi için ise Bakanlığı,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Grup toplu iş sözleşmesi: İşçi sendikası ile işveren sendikası arasında, birden çok üye işverene ait aynı işkolunda kurulu işyerlerini ve işletmeleri kapsayan toplu iş sözleşmesini,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İşletme toplu iş sözleşmesi: Bir gerçek veya tüzel kişiye ya da bir kamu kurum veya kuruluşuna ait aynı işkolundaki birden çok işyerini kapsayan sözleşmeyi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İşveren vekili: İşveren adına işletmenin bütününü yönetenleri,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Konfederasyon: Değişik işkollarında en az beş sendikanın bir araya gelerek oluşturdukları tüzel kişiliğe sahip kuruluşu,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kuruluş: Sendika ve konfederasyonları,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Sendika: İşçilerin veya işverenlerin çalışma ilişkilerinde, ortak ekonomik ve sosyal hak ve çıkarlarını korumak ve geliştirmek için en az yedi işçi veya işverenin bir araya gelerek bir işkolunda faaliyette bulunmak üzere oluşturdukları tüzel kişiliğe sahip kuruluşları,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Toplu iş sözleşmesi: İş sözleşmesinin yapılması, içeriği ve sona ermesine ilişkin hususları düzenlemek üzere işçi sendikası ile işveren sendikası veya sendika üyesi olmayan işveren arasında yapılan sözleşmeyi,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Üst kuruluş: Konfederasyonları,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Yönetici: Kuruluşun ve şubesinin yönetim kurulu üyelerini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren vekilleri, bu Kanunun uygulanması bakımından işveren sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun uygulanması bakımından işçi, işveren ve işyeri kavramları 22/5/2003 tarihli ve 4857 sayılı İş Kanununda tanımlandığı gibidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İş sözleşmesi dışında ücret karşılığı iş görmeyi taşıma, eser, vekâlet, yayın, komisyon ve adi şirket sözleşmesine göre bağımsız olarak meslekî faaliyet olarak yürüten gerçek kişiler de bu Kanunun ikinci ila altıncı bölümleri bakımından işçi sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Kuruluş Esasları ve Organlar">
    <mvz-madde no="3" başlık="Kuruluş serbestisi">
      <mvz-fıkra no="1">
        <template>Kuruluşlar, bu Kanundaki kuruluş usul ve esaslarına uyarak önceden izin almaksızın kurulur. Sendikalar kuruldukları işkolunda faaliyette bulunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu işveren sendikalarının, aynı işkolundaki kamu işverenleri tarafından kurulması ve faaliyette bulunması şartı aranmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="İşkolları">
      <mvz-fıkra no="1">
        <template>İşkolları bu Kanuna ekli (1) sayılı cetvelde gösterilmiştir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir işyerinde yürütülen asıl işe yardımcı işler de, asıl işin girdiği işkolundan sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bir işkoluna giren işler, işçi ve işveren konfederasyonlarının görüşü alınarak ve uluslararası normlar göz önünde bulundurularak Bakanlıkça çıkarılacak bir yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="İşkolunun tespiti">
      <mvz-fıkra no="1">
        <template>Bir işyerinin girdiği işkolunun tespiti Bakanlıkça yapılır. Bakanlık, tespit ile ilgili kararını Resmî Gazete’de yayımlar. Bu tespite karşı ilgililer, kararın yayımından itibaren on beş gün içinde dava açabilir. Mahkeme iki ay içinde kararını verir.  Karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi iki ay içinde kararını verir.  Bu karara karşı temyiz yoluna başvurulması hâlinde Yargıtay, uyuşmazlığı iki ay içinde kesin olarak karara bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yeni bir toplu iş sözleşmesi için yetki süreci başlamış ise işkolu değişikliği tespiti bir sonraki dönem için geçerli olur. İşkolu tespit talebi ve buna ilişkin açılan davalar, yetki işlemlerinde ve yetki tespit davalarında bekletici neden sayılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşkolu değişikliği yürürlükteki toplu iş sözleşmesini etkilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Kuruculuk şartları">
      <mvz-fıkra no="1">
        <template>Fiil ehliyetine sahip ve fiilen çalışan gerçek veya tüzel kişiler sendika kurma hakkına sahiptir. Ancak 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan mal varlığı değerlerini aklama ve kaçakçılık suçlarından birinden mahkûmiyeti bulunanlar sendika kurucusu olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren sendikası kurucusunun tüzel kişi olması hâlinde tüzel kişiyi temsil eden gerçek kişide de birinci fıkrada belirtilen şartlar aranır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Kuruluş usulü">
      <mvz-fıkra no="1">
        <template>Kuruluşlar, kurucularının kuruluşun merkezinin bulunacağı ilin valiliğine dilekçelerine ekli olarak kuruluş tüzüğünü vermeleriyle tüzel kişilik kazanır. Sendikalar için kurucuların kurucu olabilme şartlarına sahip olduklarını ifade eden yazılı beyanları; üst kuruluşlar için ilgili kuruluşların genel kurul kararları dilekçeye eklenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Vali, tüzük ve kurucuların listesini on beş gün içerisinde Bakanlığa gönderir. Bakanlık; kuruluşun adını, merkezini ve tüzüğünü on beş gün içinde resmî internet sitesinde ilan eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tüzüğün veya bu maddede sayılan belgelerin içerdikleri bilgilerin kanuna aykırılığının tespit edilmesi ya da bu Kanunda öngörülen kuruluş şartlarının sağlanmadığının anlaşılması hâlinde ilgili valilik kanuna aykırılık veya eksikliklerin bir ay içinde giderilmesini ister. Bu süre içinde kanuna aykırılığın veya eksikliğin giderilmemesi hâlinde, Bakanlığın veya ilgili valiliğin başvurusu üzerine mahkeme, gerekli gördüğü takdirde kurucuları da dinleyerek üç iş günü içinde kuruluşun faaliyetinin durdurulmasına karar verebilir. Mahkeme kanuna aykırılığın veya eksikliğin giderilmesi için altmış günü aşmayan bir süre verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tüzük ve belgelerin kanuna uygun hâle getirilmesi üzerine mahkeme durdurma kararını kaldırır. Verilen süre sonunda tüzük ve belgelerin kanuna uygun hâle getirilmemesi hâlinde ise mahkeme kuruluşun kapatılmasına karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tüzük değişiklikleri ikinci fıkra hükmüne göre ilan edilir. Tüzük değişikliği ve kanuna aykırılık veya eksikliğin bulunduğu diğer işlemlerde de yukarıdaki hükümler uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Kuruluşların tüzüğü">
      <mvz-fıkra no="1">
        <template>Kuruluşların tüzüklerinde aşağıdaki hususların yer alması gerekir:</template>
        <mvz-bent no="a">
          <template>Adı, merkezi ve adresi</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Amacı</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sendikanın faaliyet göstereceği işkolu</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Sendika kurucularının ad ve soyadları, kimlik bilgileri, meslek ve sanatları ve yerleşim yerleri; üst kuruluşları kuran sendikaların işkolları ile ad ve adresleri</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Üye olma, üyelikten çıkma ve çıkarılmanın şartları</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Genel kurulun oluşumu, toplanma zamanı, görev ve yetkileri, üye ve delegelerinin oy kullanmaları, çalışma usul ve esasları ile toplantı ve karar yeter sayıları</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Genel kurul dışında kalan organlar, bu organların oluşumu, görev, yetki ve sorumlulukları, çalışma usul ve esasları ile toplantı ve karar yeter sayıları</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Şube veya bölge şubelerinin nasıl kurulacağı, birleştirileceği veya kapatılacağı, görev ve yetkileri, genel kurullarının toplantılarına ve kararlarına ilişkin usul ve esaslar ile sendika genel kurulunda şube ve bölge şubelerinin nasıl temsil edileceği</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Üyelerce ödenecek aidat ve sendika yöneticilerinin ücretleri ile ilgili usul ve esaslar</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Demirbaşların satış ve terkininde uygulanacak usul ve esaslar</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>İç denetim usulleri</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Tüzüğün değiştirilme usulleri</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Sona erme hâlinde mallarının tasfiye şekli</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Organlarının oluşumuna kadar kuruluşun işlerini yürütmeye ve kuruluşu temsile yetkili geçici yönetim kurulu üyelerinin ad ve soyadları ile yerleşim yerleri</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Organlara dair ortak hükümler">
      <mvz-fıkra no="1">
        <template>Kuruluşun ve şubelerinin organları; genel kurul, yönetim kurulu, denetleme kurulu ve disiplin kuruludur. Bu organlardan genel kurul dışında kalanların üye sayıları üçten az dokuzdan fazla; konfederasyonların yönetim kurullarının üye sayıları beşten az yirmi ikiden fazla ve şubelerin genel kurul dışındaki kurullarının üye sayıları üçten az beşten fazla olamaz. Genel kurul dışındaki organlara asıl üye sayısı kadar yedek üye seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kuruluşlar ihtiyaca göre başka organlar da kurabilir. Ancak genel kurul ile yönetim, denetim ve disiplin kurullarının görev ve yetkileri bu organlara devredilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kuruluşların genel kurul dışındaki organlarına seçilebilmek için 6 ncı maddede aranan şartlara sahip olmak gerekir. Bu şartlara sahip olmayan birinin seçildiğini tespit eden valiliğin veya Bakanlığın başvurusu üzerine mahkeme, bu kişinin görevine son verir. Mahkemenin kararı kesindir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Genel kurul dışındaki organlara seçilen üyelerin ad ve soyadları ile açılan ve kapatılan şubeler, ilgili valiliğe bildirilir ve 7 nci maddenin ikinci fıkrasına göre ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Genel kurul dışındaki organlara seçilenlerin 6 ncı maddede sayılan suçlardan biri ile mahkûm olmaları hâlinde görevleri kendiliğinden sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kuruluş ve şube yönetim, denetleme ve disiplin kurulu üyelerinin görevleri, milletvekili veya belediye başkanı seçilmeleri hâlinde kendiliğinden son bulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Tüzükte daha yüksek bir yeter sayı öngörülmemişse, genel kurul dışında kalan organlar için; toplantı yeter sayısı kurul üye sayısının salt çoğunluğu, karar yeter sayısı toplantıya katılanların salt çoğunluğudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Genel kurulun oluşması">
      <mvz-fıkra no="1">
        <template>Kuruluşların genel kurulu, tüzüğüne göre üye veya delegelerden oluşur. Kuruluş ve şubelerin yönetim, denetleme ve disiplin kurulu üyeleri, bu sıfatla kendi genel kurullarına delege olarak katılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Delege sıfatı, bir sonraki olağan genel kurul için yapılacak delege seçimi tarihine kadar devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Delege seçiminin usul ve esasları kuruluşun tüzüğü ile belirlenir. Ancak tüzüklere delege seçilebilmeyi engelleyici hükümler konulamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Genel kurulun görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>Genel kurulun görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Organların seçimi</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tüzük değişikliği</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yapılacak ilk genel kurula sunulması ve geçmişe etkili olmaması kaydıyla ilgili makamlar veya mahkemelerce kanuna aykırı görülerek düzeltilmesi istenen konular hakkında yönetim kuruluna yetki verilmesi</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Yönetim kurulu ve denetleme kurulu raporları ile yeminli mali müşavir raporlarının görüşülmesi</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yönetim kurulu ve denetleme kurulunun ibrası</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bütçenin kabulü</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Yönetim kurulu, denetleme kurulu ve disiplin kurulu üyelerine verilecek ücret, tazminat, ödenek ve yolluklar ile sosyal hakların belirlenmesi</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Taşınmaz satın alınması veya mevcut taşınmazların satılması hususunda yönetim kuruluna yetki verilmesi</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Üst kuruluş kurucusu olma, üst kuruluşlara üye olma veya üyelikten çekilme</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Şube açma, birleştirme veya kapatma, bu konuda tüzükte belirlenen esaslar doğrultusunda yönetim kuruluna yetki verilmesi</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Birleşme veya katılma</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Uluslararası kuruluşun kurucusu olma, uluslararası kuruluşlara üye olma veya üyelikten çekilme</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Kuruluşun feshi</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Mevzuat veya tüzükte genel kurulca yapılması öngörülen diğer işlemleri yerine getirme ve başka bir organa bırakılmamış konuları karara bağlama</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şube genel kurulları, sadece birinci fıkranın (a), (ç), (d) ve (k) bentlerinde belirtilen görevleri yerine getirir. Şube genel kurullarının mali ibra yetkisi yoktur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Genel kurulun toplantı zamanı">
      <mvz-fıkra no="1">
        <template>Kuruluşların ilk genel kurulu tüzel kişiliğin kazanılmasından, şubelerin ilk genel kurulu ise kuruluş tarihinden itibaren altı ay içinde yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Olağan genel kurul en geç dört yılda bir toplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İki genel kurul toplantısı arasındaki döneme ait faaliyet ve hesap raporu, yeminli mali müşavir raporu, denetleme kurulu raporu ve gelecek döneme ait bütçe teklifi toplantı tarihinden on beş gün önce genel kurula katılacaklara gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Olağanüstü genel kurul, yönetim kurulu veya denetleme kurulunun gerekli gördüğü hâllerde ya da genel kurul üye veya delegelerinin beşte birinin yazılı isteği üzerine altmış gün içinde yazılı istekteki konuları öncelikle görüşmek üzere toplanır. Talep tarihi itibarıyla olağan genel kurul toplantı tarihine altı aydan az bir süre kalması hâlinde olağanüstü genel kurula gidilemez; ancak, isteğe konu olan hususlar olağan genel kurul gündemine alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Genel kurula çağrı yönetim kurulu tarafından yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yukarıdaki hükümlere aykırı hareket eden kuruluş veya şube yönetim kuruluna; kuruluşun üyelerinden birinin veya durumu tespit eden Bakanlığın başvurusu üzerine, mahkeme kararıyla işten el çektirilir. Mahkeme, ayrıca genel kurulu kanun ve tüzük hükümlerine göre en kısa zamanda toplamak ve yeni yönetim kurulu seçilinceye kadar kuruluşu yönetmekle görevli olmak üzere 22/11/2001 tarihli ve 4721 sayılı Türk Medeni Kanunu hükümleri gereğince bir veya üç kayyım tayin eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Genel kurulun toplantı ve karar yeter sayıları">
      <mvz-fıkra no="1">
        <template>Genel kurulun toplantı yeter sayısı üye veya delege tam sayısının salt çoğunluğudur. Tüzükte daha yüksek bir yeter sayı belirlenebilir. İlk toplantıda yeter sayı sağlanamazsa ikinci toplantı en çok on beş gün sonraya bırakılır. Bu toplantıya katılanların sayısı, üye veya delege tam sayısının üçte birinden az olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Delegelerin veya üyelerin genel kurula katılmaları ve oy kullanmaları engellenemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Genel Kurulun karar yeter sayısı toplantıya katılan üye veya delege sayısının salt çoğunluğudur. Ancak bu sayı üye veya delege tam sayısının dörtte birinden az olamaz. Tüzükte daha yüksek bir yeter sayı belirlenmemişse, tüzük değişikliği, fesih, birleşme, katılma, üst kuruluşun veya uluslararası kuruluşun kurucusu olma, üst kuruluşlara ve uluslararası kuruluşlara üyelik ile üyelikten çekilme hâllerinde karar yeter sayısı üye veya delege tam sayısının salt çoğunluğudur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Genel kurulda yapılacak seçimlerde uyulacak esaslar">
      <mvz-fıkra no="1">
        <template>Genel kurulda yönetim kurulu, denetleme kurulu ve disiplin kuruluna üye seçimi ile delege seçimi, yargı gözetimi altında serbest, eşit, gizli oy, açık sayım ve döküm esasına ve tüzük hükümlerine göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçim yapılacak genel kurul toplantılarından en az on beş gün önce genel kurula katılacak üye veya delegeleri belirleyen listeler, toplantının gündemi, yeri, günü, saati ve çoğunluk olmadığı takdirde yapılacak ikinci toplantıya ilişkin hususları belirten bir yazı ile birlikte yetkili seçim kurulu başkanlığına verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hâkim, seçime katılacak ve oy kullanacak üye veya delegeleri belirleyen listeleri inceleyerek onaylar ve ilan edilmek üzere bir nüshasını ilgili kuruluş veya şubeye verir. İlgili kuruluş onaylı listeyi genel kurul toplantı tarihinden yedi gün önce kuruluş merkez veya şube binasında asmak suretiyle ilan eder. İlan süresi üç gündür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İlan süresi içerisinde seçim kurulu başkanlığına yapılacak itirazlar, en geç iki gün içinde incelenir ve kesin olarak karara bağlanır. Bu suretle kesinleşen listeler ile toplantıya ilişkin diğer hususlar hâkim tarafından onaylanarak ilgili kuruluş veya şubeye gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Seçim kurulu başkanlığı, kuruluşun üyesi olmayan kişiler arasından bir başkan ve seçimlerde aday olmayan üyeler arasından iki üye belirleyerek seçim sandık kurulunu oluşturur. Seçim sandık kurulu yedek başkan ve üyeleri de aynı şekilde belirlenir. Seçim sandık kurulu, seçimlerin yapılması ve oyların sayımı ile görevlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Seçimlerde aday olanların listeleri, başkanlık divanınca düzenlenerek ilgili seçim kurulu başkanlığına mühürlenmek üzere verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Listede adı bulunanlar, resmî kimlik belgesi göstermek ve listeyi imzalamak suretiyle oy kullanır. Oy, sandık kurulu başkanı tarafından adayları gösteren ve seçim kurulu başkanlığınca mühürlenmiş listedeki isimlerin işaretlenmesi suretiyle kullanılır. Seçilecek organı oluşturan üye sayısından fazla adayın işaretlendiği oy pusulaları ile diğer kâğıtlara yazılan oylar geçersiz sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Seçim süresinin sonunda seçim sonuçları, seçim sandık kurulu tarafından bir tutanakla tespit edilir ve bir nüshası seçim yerinde asılmak suretiyle duyurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Kullanılan oylar ve diğer belgeler tutanağın bir nüshası ile birlikte üç ay süreyle saklanmak üzere yetkili seçim kurulu başkanlığına verilir. Seçim sonuçları anılan başkanlık tarafından derhâl ilan edilir ve ilgili kuruluş veya şubesine bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Seçimler sırasında sandık kurulu başkanı ve üyelerine karşı işlenen suçlar, kamu görevlilerine karşı işlenmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Seçimde görev alan seçim kurulu ve seçim sandık kurulu üyelerine 26/4/1961 tarihli ve 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunda belirtilen esaslara göre ilgili kuruluşça ücret ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Seçimlere itiraz">
      <mvz-fıkra no="1">
        <template>Genel kurulda yapılan organ ve delege seçimlerinin devamı sırasında yapılan işlemlere ilişkin olarak seçim sonuç tutanaklarının düzenlenmesinden itibaren iki gün içinde yapılacak itirazlar hâkim tarafından aynı gün incelenir ve kesin olarak karara bağlanır. İtiraz süresinin geçmesi ve itirazların karara bağlanmasından hemen sonra hâkim, 14 üncü madde hükümlerine göre kesin sonuçları ilan eder ve ilgili kuruluş veya şubesine bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık veya kuruluş ya da şubesinin üye ve delegeleri; kanun ve tüzük hükümlerine aykırı olarak genel kurul ve seçim yapılması veya seçim sonuçlarını etkileyecek ölçüde bir usulsüzlük ya da kanuna aykırı uygulama iddiasıyla, bu işlemlerin veya genel kurulun iptali için genel kurul tarihinden itibaren bir ay içerisinde dava açabilir. Dava basit yargılama usulüne göre iki ay içerisinde sonuçlandırılır.  Karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi bir ay içinde kararını verir.  Bu karara karşı temyiz yoluna başvurulması hâlinde Yargıtayca on beş gün içinde kesin olarak karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Genel kurulun veya genel kurulda yapılan organ seçiminin iptaline karar verildiği takdirde mahkeme; genel kurulu kanun ve tüzük hükümlerine göre en kısa zamanda toplamak, seçimleri yapmak ve yeni yönetim kurulu seçilinceye kadar kuruluşu yönetmekle görevli olmak üzere, 4721 sayılı Kanun hükümleri gereğince bir veya üç kayyım tayin eder ve görev sürelerini belirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Genel kurul dışında yapılan delege seçimi">
      <mvz-fıkra no="1">
        <template>Genel kurul dışında yapılan delege seçimleri üyeler tarafından serbest, eşit, gizli oy, açık sayım ve döküm esasına ve tüzük hükümlerine göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel kurul dışında yapılan delege seçimlerine seçim sonuçlarının ilanından sonra iki gün içinde yapılacak itirazlar, mahkeme tarafından kesin olarak karara bağlanır. Delege seçiminin mahkeme tarafından iptal edilmesi hâlinde, seçimler on beş gün içinde yenilenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Üyelik">
    <mvz-madde no="17" başlık="Sendika üyeliği ve üyeliğin kazanılması">
      <mvz-fıkra no="1">
        <template>On beş yaşını dolduran ve bu Kanun hükümlerine göre işçi sayılanlar, işçi sendikalarına üye olabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun anlamında işveren sayılanlar, işveren sendikalarına üye olabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sendikaya üye olmak serbesttir. Hiç kimse sendikaya üye olmaya veya olmamaya zorlanamaz. İşçi veya işverenler aynı işkolunda ve aynı zamanda birden çok sendikaya üye olamaz. Ancak aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok sendikaya üye olabilir. İşçi ve işverenlerin bu hükme aykırı şekilde birden çok sendikaya üye olmaları hâlinde sonraki üyelikler geçersizdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bir işyerinde yardımcı işlerde çalışan işçiler de, işyerinin girdiği işkolunda kurulu bir sendikaya üye olabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Sendikaya üyelik, Bakanlıkça sağlanacak elektronik başvuru sistemine e-Devlet kapısı üzerinden üyelik başvurusunda bulunulması ve sendika tüzüğünde belirlenen yetkili organın kabulü ile e-Devlet kapısı üzerinden kazanılır. Üyelik başvurusu, sendika tarafından otuz gün içinde reddedilmediği takdirde üyelik talebi kabul edilmiş sayılır. Haklı bir neden gösterilmeden üyelik başvurusu kabul edilmeyenler, bu kararın kendilerine tebliğinden itibaren otuz gün içinde dava açabilir. Mahkemenin kararı kesindir. Mahkemenin davacı lehine karar vermesi hâlinde üyelik, red kararının alındığı tarihte kazanılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Üyelik aidatı">
      <mvz-fıkra no="1">
        <template>Üyelik aidatının miktarı kuruluşların tüzüklerinde belirtilen usul ve esaslara göre genel kurul tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üyelik ve dayanışma aidatları, yetkili işçi sendikasının işverene yazılı başvurusu üzerine, işçinin ücretinden kesilmek suretiyle ilgili sendikaya ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıdaki hükümlere göre ödenmesi gereken aidatı kesmeyen veya kesmesine rağmen bir ay içinde ilgili işçi sendikasına ödemeyen işveren, bildirim şartı aranmaksızın aidat miktarını bankalarca işletme kredilerine uygulanan en yüksek faiziyle birlikte ödemekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Üye aidatının tahsiline ilişkin usul ve esaslar Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Sendika üyeliğinin sona ermesi ve askıya alınması">
      <mvz-fıkra no="1">
        <template>İşçi veya işveren, sendikada üye kalmaya veya üyelikten ayrılmaya zorlanamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Her üye, e-Devlet kapısı üzerinden çekilme bildiriminde bulunmak suretiyle üyelikten çekilebilir. E-Devlet kapısı üzerinden yapılan çekilme bildirimi elektronik ortamda eş zamanlı olarak Bakanlığa ve sendikaya ulaşır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çekilme, sendikaya bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır. Çekilenin bir aylık süre içinde başka bir sendikaya üye olması hâlinde yeni üyelik bu sürenin bitimi tarihinde kazanılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sendika üyeliğinden çıkarılma kararı genel kurulca verilir. Karar, e-Devlet kapısı üzerinden Bakanlığa elektronik ortamda bildirilir ve çıkarılana yazı ile tebliğ edilir. Çıkarılma kararına karşı üye, kararın tebliğinden itibaren otuz gün içinde mahkemeye itiraz edebilir. Mahkeme iki ay içinde kesin olarak karar verir. Üyelik, çıkarılma kararı kesinleşinceye kadar devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşveren veya işveren vekili sıfatını kaybedenlerin sendika ve üst kuruluşlardaki üyelikleri ve görevleri, bu sıfatı kaybettikleri tarihte kendiliğinden sona erer. Ancak, tüzel kişiliği temsilen işveren vekili sıfatı ile işveren sendikalarına üye olanların bu sıfatı kaybetmeleri hâlinde tüzel kişiliğin üyeliği düşmez. Bu durumda işveren vekilinin kuruluş organlarındaki görevleri sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Sosyal Güvenlik Kurumundan yaşlılık veya malullük aylığı ya da toptan ödeme alarak işten ayrılan işçilerin sendika üyeliği sona erer. Ancak çalışmaya devam edenler ile kuruluş ve şubelerinin yönetim, denetleme ve disiplin kurullarındaki görevleri sırasında yaşlılık veya malullük aylığı ya da toptan ödeme alanların üyeliği, görevleri süresince ve yeniden seçildikleri sürece devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İşkolunu değiştirenin sendika üyeliği kendiliğinden sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>İşçi kuruluşu ve şubelerinin organlarında görev almak üyeliği sona erdirmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>İşçi sendikası üyesinin bir yılı geçmemek üzere işsiz kalması üyeliğini etkilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Herhangi bir askeri ödev nedeniyle silah altına alınan üyenin üyelik ilişkisi bu süre içinde askıda kalır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Üyeliğin kazanılması ile üyeliğin sona ermesine ilişkin usul ve esaslar Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Üst kuruluşlara üyelik">
      <mvz-fıkra no="1">
        <template>Üst kuruluş üyeliğine başvuru genel kurul kararına bağlıdır. Üst kuruluş üyeliği, tüzükte belirlenen yetkili organın kabulüyle kazanılır. Aynı zamanda birden fazla üst kuruluşa üye olunamaz. Aksi hâlde sonraki üyelikler geçersizdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üst kuruluş üyeliğinden çekilme genel kurul kararına bağlıdır. Çekilme, üst kuruluşa bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Üst kuruluş üyeliğinden çıkarılma, üst kuruluş genel kurulu kararıyla olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Üye olma, üyelikten çekilme ve çıkarılma kararları, üst kuruluş tarafından bir ay içerisinde Bakanlığa bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Uluslararası işçi ve işveren kuruluşlarına üyelik">
      <mvz-fıkra no="1">
        <template>Kuruluşlar tüzüklerinde gösterilen amaçlarını gerçekleştirmek üzere uluslararası işçi ve işveren kuruluşlarının kurucusu olabilir, bu kuruluşlara serbestçe üye olabilir ve üyelikten çekilebilir, iş birliğinde bulunabilir, üye ve temsilci gönderebilir veya kabul edebilir ve dış temsilcilik açabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Uluslararası işçi ve işveren kuruluşları Dışişleri Bakanlığının görüşü alınmak suretiyle İçişleri Bakanlığının izniyle Türkiye’de temsilcilik açabilir ve üst kuruluşlara üye olabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıdaki fıkralara aykırılık hâlinde İçişleri Bakanlığınca üyeliğin iptal edilmesi, temsilciliğin faaliyetinin durdurulması veya kapatılması için, kuruluş merkezinin veya temsilciliğin bulunduğu yerde dava açılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kuzey Kıbrıs Türk Cumhuriyeti’nde faaliyet gösteren işçi ve işveren kuruluşları Türkiye’de kurulu üst kuruluşlara üye olabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Kuruluşların katılması veya birleşmesi">
      <mvz-fıkra no="1">
        <template>Bir kuruluşun aynı nitelikteki bir kuruluşa katılması hâlinde, katılan kuruluşun bütün hak, borç, yetki ve çıkarları katıldığı kuruluşa kendiliğinden geçer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aynı nitelikteki bir kuruluşla birleşen kuruluşların bütün hak, borç, yetki ve çıkarları birleşme sonucu meydana getirdikleri yeni tüzel kişiliğe kendiliğinden geçer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Katılan veya birleşen kuruluşun üyeleri, kendiliğinden katıldıkları veya yeni meydana getirdikleri kuruluşun üyesi olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Katılımın yapıldığı ya da yeni meydana getirilen kuruluş, durumu bir ay içerisinde Bakanlığa bildirir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Güvenceler">
    <mvz-madde no="23" başlık="İşçi kuruluşu yöneticiliğinin güvencesi">
      <mvz-fıkra no="1">
        <template>İşçi kuruluşunda yönetici olduğu için çalıştığı işyerinden ayrılan işçinin iş sözleşmesi askıda kalır. Yönetici dilerse işten ayrıldığı tarihte iş sözleşmesini bildirim süresine uymaksızın veya sözleşme süresinin bitimini beklemeksizin fesheder ve kıdem tazminatına hak kazanır. Yönetici, yöneticilik süresi içerisinde iş sözleşmesini feshederse kıdem tazminatı fesih tarihindeki emsal ücret üzerinden hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İş sözleşmesi askıya alınan yönetici; sendikanın tüzel kişiliğinin sona ermesi, seçime girmemek, yeniden seçilmemek veya kendi isteği ile çekilmek suretiyle görevinin sona ermesi hâlinde, sona erme tarihinden itibaren bir ay içinde ayrıldığı işyerinde işe başlatılmak üzere işverene başvurabilir. İşveren, talep tarihinden itibaren bir ay içinde bu kişileri o andaki şartlarla eski işlerine veya eski işlerine uygun bir diğer işe başlatmak zorundadır. Bu kişiler süresi içinde işe başlatılmadığı takdirde, iş sözleşmeleri işverence feshedilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıda sayılan nedenler dışında yöneticilik görevi sona eren sendika yöneticisine ise başvuruları hâlinde işveren tarafından kıdem tazminatı ödenir. Ödenecek tazminatın hesabında, işyerinde çalışılmış süreler göz önünde bulundurulur ve fesih anında emsalleri için geçerli olan ücret ve diğer hakları esas alınır. İşçinin iş kanunlarından doğan hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="İşyeri sendika temsilciliğinin güvencesi">
      <mvz-fıkra no="1">
        <template>İşveren, işyeri sendika temsilcilerinin iş sözleşmelerini haklı bir neden olmadıkça ve nedenini yazılı olarak açık ve kesin şekilde belirtmedikçe feshedemez. Fesih bildiriminin tebliği tarihinden itibaren bir ay içinde, temsilci veya üyesi bulunduğu sendika dava açabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dava basit yargılama usulüne göre sonuçlandırılır.  Mahkemece verilen karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi kesin olarak karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Temsilcinin işe iadesine karar verilirse fesih geçersiz sayılarak temsilcilik süresini aşmamak kaydıyla fesih tarihi ile kararın kesinleşme tarihi arasındaki ücret ve diğer hakları ödenir. Kararın kesinleşmesinden itibaren altı iş günü içinde temsilcinin işe başvurması şartıyla, altı iş günü içinde işe başlatılmaması hâlinde, iş ilişkisinin devam ettiği kabul edilerek ücreti ve diğer hakları temsilcilik süresince ödenmeye devam edilir. Bu hüküm yeniden temsilciliğe atanma hâlinde de uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşveren, yazılı rızası olmadıkça işyeri sendika temsilcisinin işyerini değiştiremez veya işinde esaslı tarzda değişiklik yapamaz. Aksi hâlde değişiklik geçersiz sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu madde hükümleri işyerinde çalışmaya devam eden yöneticiler hakkında da uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Sendika özgürlüğünün güvencesi">
      <mvz-fıkra no="1">
        <template>İşçilerin işe alınmaları; belli bir sendikaya girmeleri veya girmemeleri, belli bir sendikadaki üyeliği sürdürmeleri veya üyelikten çekilmeleri veya herhangi bir sendikaya üye olmaları veya olmamaları şartına bağlı tutulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren, bir sendikaya üye olan işçilerle sendika üyesi olmayan işçiler veya ayrı sendikalara üye olan işçiler arasında, çalışma şartları veya çalıştırmaya son verilmesi bakımından herhangi bir ayrım yapamaz. Ücret, ikramiye, prim ve paraya ilişkin sosyal yardım konularında toplu iş sözleşmesi hükümleri saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşçiler, sendikaya üye olmaları veya olmamaları, iş saatleri dışında veya işverenin izni ile iş saatleri içinde işçi kuruluşlarının faaliyetlerine katılmaları veya sendikal faaliyette bulunmalarından dolayı işten çıkarılamaz veya farklı işleme tabi tutulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşverenin  yukarıdaki fıkralara aykırı hareket etmesi hâlinde işçinin bir yıllık ücret tutarından az olmamak üzere sendikal tazminata hükmedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Sendikal bir nedenle iş sözleşmesinin feshi hâlinde işçi, 4857 sayılı Kanunun , 20 ve 21 inci madde hükümlerine göre dava açma hakkına sahiptir. İş sözleşmesinin sendikal nedenle feshedildiğinin tespit edilmesi hâlinde, 4857 sayılı Kanunun 21 inci maddesine göre işçinin başvurusu, işverenin işe başlatması veya başlatmaması şartına bağlı olmaksızın sendikal tazminata karar verilir. Ancak işçinin işe başlatılmaması hâlinde, ayrıca 4857 sayılı Kanunun 21 inci maddesinin birinci fıkrasında belirtilen tazminata hükmedilmez. İşçinin 4857 sayılı Kanunun yukarıdaki hükümlerine göre dava açmaması ayrıca sendikal tazminat talebini engellemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İş sözleşmesinin sendikal nedenle feshedildiği iddiası ile açılacak davada, feshin nedenini ispat yükümlülüğü işverene aittir. Feshin işverenin ileri sürdüğü nedene dayanmadığını iddia eden işçi, feshin sendikal nedene dayandığını ispatla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Fesih dışında işverenin sendikal ayrımcılık yaptığı iddiasını işçi ispat etmekle yükümlüdür. Ancak işçi sendikal ayrımcılık yapıldığını güçlü biçimde gösteren bir durumu ortaya koyduğunda, işveren davranışının nedenini ispat etmekle yükümlü olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Yukarıdaki hükümlere aykırı olan toplu iş sözleşmesi ve iş sözleşmesi hükümleri geçersizdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>İşçinin iş kanunları ve diğer kanunlara göre sahip olduğu hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Faaliyetler">
    <mvz-madde no="26" başlık="Kuruluşların faaliyetleri">
      <mvz-fıkra no="1">
        <template>Kuruluşlar, tüzüklerinde yer alan konularda serbestçe faaliyette bulunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kuruluşlar, çalışma hayatından, mevzuattan, örf ve adetten doğan uyuşmazlıklarda işçi ve işverenleri temsilen; sendikalar, yazılı başvuruları üzerine iş sözleşmesinden ve çalışma ilişkisinden doğan hakları ile sosyal güvenlik haklarında üyelerini ve mirasçılarını temsilen dava açmak ve bu nedenle açılmış davada davayı takip yetkisine sahiptir. Yargılama sürecinde üyeliğin sona ermesi üyenin yazılı onay vermesi kaydıyla bu yetkiyi etkilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kuruluşlar, faaliyetlerinden yararlanmada üyeleri arasında eşitlik ilkesi ve ayrımcılık yasaklarına uymakla yükümlüdür. Kuruluşlar, faaliyetlerinde toplumsal cinsiyet eşitliğini gözetir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kuruluşların kendi faaliyetleri ile üyelerine sağladıkları hak ve çıkarların üyesi olmayanlara uygulanması, bu Kanunun yedinci ila on ikinci bölümlerinde yer alan hükümler saklı kalmak kaydıyla yazılı onaylarına bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kuruluşlar, tüzükleriyle belirlenen amaçları dışında faaliyette bulunamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İşçiler ve işçi kuruluşları işveren kuruluşlarına, işveren kuruluşları da işçi kuruluşlarına üye olamaz; gerek doğrudan doğruya, gerek temsilcileri veya mensupları veya araya koyacakları diğer kimseler aracılığıyla biri diğerinin kurulmasına, yönetim ve faaliyetine müdahalede bulunamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kuruluşlar siyasi partilerin ad, amblem, rumuz veya işaretlerini kullanamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Kuruluşlar ticaretle uğraşamaz. Ancak, kuruluşlar genel kurul kararıyla nakit mevcudunun yüzde kırkından fazla olmamak kaydıyla sanayi ve ticaret kuruluşlarına yatırımda bulunabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Kuruluşlar elde ettikleri gelirleri üyeleri ve mensupları arasında dağıtamaz. Ancak sendikaların grev ve lokavt süresince tüzüklerine göre üyelerine yapacakları yardımlar ile kuruluşların eğitim amaçlı yardımları bu hükmün dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>İşveren sendikaları, tüzüklerinde hüküm bulunmak ve şartları genel kurul kararıyla belirlenmek kaydıyla, işçilerin sigorta primlerinin işveren payının ödemelerinde kullanılmak ve nakit mevcudunun yüzde otuz beşini aşmamak üzere karşılıksız yardıma dayalı dayanışma ve yardım fonu oluşturabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="İşyeri sendika temsilcisinin atanması ve görevleri">
      <mvz-fıkra no="1">
        <template>Toplu iş sözleşmesi yapmak üzere yetkisi kesinleşen sendika; işyerinde işçi sayısı elliye kadar ise bir, elli bir ile yüz arasında ise en çok iki, yüz bir ile beş yüz arasında ise en çok üç, beş yüz bir ile bin arasında ise en çok dört, bin bir ile iki bin arasında ise en çok altı, iki binden fazla ise en çok sekiz işyeri sendika temsilcisini işyerinde çalışan üyeleri arasından atayarak on beş gün içinde kimliklerini işverene bildirir. Bunlardan biri baş temsilci olarak görevlendirilebilir. Temsilcilerin görevi, sendikanın yetkisi süresince devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sendika tüzüğünde işyeri sendika temsilcisinin seçimle belirlenmesine ilişkin hüküm bulunması hâlinde, seçilen üye temsilci olarak atanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşyeri sendika temsilcileri ve baş temsilcisi; işyeri ile sınırlı olmak kaydı ile işçilerin dileklerini dinlemek ve şikâyetlerini çözümlemek, işçi ve işveren arasındaki iş birliğini, çalışma barışını ve uyumunu sağlamak, işçilerin hak ve çıkarlarını gözetmek ve iş kanunları ile toplu iş sözleşmelerinde öngörülen çalışma şartlarının uygulanmasına yardımcı olmakla görevlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşyeri sendika temsilcileri, işyerindeki işlerini aksatmamak ve iş disiplinine aykırı olmamak şartı ile görevlerini yerine getirir. İşyerlerinde, sendika temsilcilerine görevlerini hızlı ve etkili biçimde yapmalarına imkân verecek kolaylıklar sağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Kuruluşların Gelirleri, Denetimi ve Kapatılması">
    <mvz-madde no="28" başlık="Kuruluşların gelirleri ve giderleri">
      <mvz-fıkra no="1">
        <template>Kuruluşların gelirleri;</template>
        <mvz-bent no="a">
          <template>Üyelik ve dayanışma aidatları,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tüzüklerine göre yapabilecekleri faaliyetlerden sağlanacak gelirler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bağışlar,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Mal varlığı gelirleri, mal varlığı değerlerinin devir, temlik ve satışlarından doğan kazançlardan,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ibarettir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kuruluşlar; kamu kurum ve kuruluşları, siyasi partiler, esnaf ve küçük sanatkâr kuruluşları ile kamu kurumu niteliğindeki meslek kuruluşlarından yardım ve bağış alamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşçi kuruluşları, işverenler ve bu Kanun ve diğer kanunlara göre kurulan işveren kuruluşlarından; işveren kuruluşları da işçilerden ve bu Kanun ve diğer kanunlara göre kurulu işçi kuruluşlarından yardım ve bağış alamaz. Kuruluşlar, yurt dışındaki kişi, kurum ve kuruluşlardan Bakanlığa önceden bildirimde bulunmak suretiyle yardım ve bağış alabilir. Ancak, işçi kuruluşları yurt dışında kurulu işveren ve işveren kuruluşlarından; işveren kuruluşları ise işçi ve işçi kuruluşlarından yardım ve bağış alamaz. Nakdî yardım ve bağışların bankalar aracılığıyla alınması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıdaki hükümlere aykırı olarak yardım ve bağış alınması hâlinde üyelerden birinin veya Bakanlığın başvurması üzerine, mahkeme kararıyla, alınan yardım Hazineye aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kuruluşlar, tüm nakdî gelirlerini bankaya yatırmak zorundadır. Zorunlu giderleri için kasalarında tutacakları nakit miktarı genel kurullarınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kuruluşlar, gelirlerini bu Kanunda ve tüzüklerinde gösterilen faaliyetleri dışında kullanamaz veya bağışlayamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kuruluşlar, yönetim kurulu kararıyla ve nakit mevcudunun yüzde onunu aşmamak kaydıyla;</template>
        <mvz-bent no="a">
          <template>Yurt içi ve yurt dışındaki doğal afet bölgelerine doğrudan veya yetkili makamlar aracılığıyla konut, eğitim ve sağlık tesisleri kurulması amacıyla kamu kurum ve kuruluşlarına,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Aile ve Sosyal Politikalar Bakanlığı ile koordinasyon hâlinde, 8/6/1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanununun mülga 64 üncü maddesi ve 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 47 nci maddesinin sekizinci fıkrasında sayılanlar ile 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu, 3/11/1980 tarihli ve 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanun, 17/7/2004 tarihli ve 5233 sayılı Terör ve Terörle Mücadeleden Doğan Zararların Karşılanması Hakkında Kanunun ek 1 inci maddesi hükümlerine göre nakdî tazminat ödenmesi veya aylık bağlanması hakkı bulunanlara,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bakanlıkla yapılacak işbirliği protokolü çerçevesinde, kadın istihdamını destekleyici faaliyetler kapsamında kullanılması şartıyla Bakanlığa,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ayni ve nakdî yardımda bulunabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Kuruluşların denetimi ve şeffaflık">
      <mvz-fıkra no="1">
        <template>Kuruluşların denetimi, kanun ve kuruluşun tüzük hükümlerine göre denetleme kurulları tarafından yapılır. Denetimde, yönetim ve işleyişin, gelir, gider ve bilançoların ve bunlarla ilgili işlemlerin kanun, tüzük ve genel kurul kararlarına uygunluğu incelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kuruluşların gelir ve giderlerine ilişkin mali denetimleri, en geç iki yılda bir 1/6/1989 tarihli ve 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre denetim yetkisine sahip yeminli mali müşavirlerce yapılır. Bu denetimin yapılmış olması, denetleme kurulunun yükümlülüğünü ortadan kaldırmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kuruluşlar; faaliyet, dış denetim ve denetleme kurulu raporları ile genel kurul kararlarını uygun vasıtalarla derhâl yayınlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kuruluşların ve şubelerin kurucu ve yöneticileri, kendileri, eşleri ve velayetleri altında bulunan çocuklarına ait mal bildirimlerini 19/4/1990 tarihli ve 3628 sayılı Mal Bildiriminde Bulunulması, Rüşvet ve Yolsuzluklarla Mücadele Kanunu ve ilgili yönetmeliklere göre vermek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İç ve dış denetim esasları, işçi ve işveren konfederasyonlarının görüşleri alınarak Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Tutulacak defter ve kayıtlar">
      <mvz-fıkra no="1">
        <template>Kuruluşlar, aşağıda yazılı defter ve kayıtları tutmak zorundadır:</template>
        <mvz-bent no="a">
          <template>Üye kayıt ve üyelik sona erme listeleri</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Genel kurul, yönetim kurulu, denetleme kurulu ve disiplin kurulu karar defterleri</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Gelen ve giden evrak kayıt defterleri ile zimmet defteri</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Aidat kayıtları, yevmiye ve envanter defterleri ile defterikebir</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Gelirlere ilişkin kayıt ve defterler</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununa göre demirbaş sınıfına giren her türlü eşya veya malzeme demirbaş defterine kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kuruluşların tutmak zorunda oldukları dosya, üye kayıt ve üyelik sona erme listeleri, defter ve kayıtlar ile bunların tutulmasındaki usul ve esaslar Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Kapatma">
      <mvz-fıkra no="1">
        <template>Anayasada belirtilen Cumhuriyetin niteliklerine ve demokratik esaslara aykırı faaliyetlerde bulunan kuruluş, merkezlerinin bulunduğu yer Cumhuriyet Başsavcısının talebi üzerine mahkeme kararı ile kapatılır. Aykırı davranış bireysel olarak yöneticiler tarafından gerçekleştirildiği takdirde, mahkemece sadece o yöneticilerin görevine son verilmesine karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıdaki fıkra uyarınca açılan davalar nedeniyle mahkeme, yargılama süresince talep üzerine veya resen kuruluşun faaliyetlerinin durdurulmasına ve yöneticilerinin geçici olarak görevden alınmasına karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıdaki hükümler veya bu Kanunda öngörülen diğer faaliyeti durdurma hâllerinde, kuruluşların mallarının yönetimi ve çıkarlarının korunması ve durdurma süresi sonunda yeniden faaliyete geçebilmesi için genel kurul yapılması, 4721 sayılı Kanun hükümleri gereğince tayin olunacak bir veya üç kayyım tarafından sağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="32" başlık="Kuruluşun sona ermesi hâlinde malların devri">
      <mvz-fıkra no="1">
        <template>Tüzüğünde hüküm bulunması kaydıyla tüzel kişiliği sona eren sendikanın mal varlığı bu Kanuna göre kurulmuş aynı nitelikteki bir kuruluşa ya da üyesi bulunduğu üst kuruluşa; üst kuruluş üyesi değilse aynı nitelikteki bir üst kuruluşa bırakılabilir. Üst kuruluşun sona ermesi hâlinde, mal varlığı üyesi bulunan kuruluşlara bırakılabilir. Tüzükte hüküm bulunmaması hâlinde feshe karar veren genel kurul, mal varlığını yukarıdaki esaslara göre devredebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tüzükte hüküm olmaması ya da fesih hâlinde; genel kurul kararının bulunmaması veya devrin ilgili kuruluş tarafından kabul edilmemesi hâlinde, tasfiye sonucunda kalacak paralar İşsizlik Sigortası Fonuna aktarılır ve mallar Türkiye İş Kurumuna devredilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Toplu İş Sözleşmesinin Genel Esasları">
    <mvz-madde no="33" başlık="Toplu iş sözleşmesi ve çerçeve sözleşmenin içeriği">
      <mvz-fıkra no="1">
        <template>Toplu iş sözleşmesi, iş sözleşmesinin yapılması, içeriği ve sona ermesine ilişkin hükümleri içerir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu iş sözleşmesi, tarafların karşılıklı hak ve borçları ile sözleşmenin uygulanması ve denetimini ve uyuşmazlıkların çözümü için başvurulacak yolları düzenleyen hükümleri de içerebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çerçeve sözleşme, sözleşmenin tarafı olan işçi ve işveren sendikasının üyeleri hakkında uygulanır ve meslekî eğitim, iş sağlığı ve güvenliği, sosyal sorumluluk ve istihdam politikalarına ilişkin düzenlemeleri içerebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Çerçeve sözleşme, taraflardan birinin çağrısı ve karşı tarafın çağrıya olumlu cevap vermesi ile en az bir, en çok üç yıl için yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Toplu iş sözleşmeleri ve çerçeve sözleşmeler, Anayasaya ve kanunların emredici hükümlerine aykırı düzenlemeler içeremez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="34" başlık="Toplu iş sözleşmesinin kapsamı ve düzeyi">
      <mvz-fıkra no="1">
        <template>Bir toplu iş sözleşmesi aynı işkolunda bir veya birden çok işyerini kapsayabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir gerçek ve tüzel kişiye veya bir kamu kurum ve kuruluşuna ait aynı işkolunda birden çok işyerinin bulunduğu işyerlerinde, toplu iş sözleşmesi ancak işletme düzeyinde yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Grup toplu iş sözleşmesi, tarafların anlaşması üzerine bir işçi sendikası ile bir işveren sendikası arasında, birden çok üye işverene ait aynı işkolunda kurulu işyerleri ve işletmeleri kapsamak üzere yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşletme toplu iş sözleşmesi yapılacak işyerlerinin aranılan niteliğe sahip olup olmadıklarına ilişkin uyuşmazlıklar, işletme merkezinin bulunduğu yerdeki mahkemede on beş gün içinde karara bağlanır.  Karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi on beş gün içinde kesin olarak karar verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Toplu iş sözleşmesinin şekli ve süresi">
      <mvz-fıkra no="1">
        <template>Toplu iş sözleşmesi yazılı olarak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu iş sözleşmesi en az bir ve en çok üç yıl süreli olarak yapılabilir. Toplu iş sözleşmesinin süresi, sözleşmenin imzalanmasından sonra taraflarca uzatılamaz, kısaltılamaz ve sözleşme süresinden önce sona erdirilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Faaliyetleri bir yıldan az süren işlerde uygulanmak üzere yapılan toplu iş sözleşmelerinin süresi bir yıldan az olabilir. İşin bitmemesi hâlinde bu sözleşmeler bir yılın sonuna kadar uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Toplu iş sözleşmesi süresinin bitmesinden önceki yüz yirmi gün içinde, yeni sözleşme için yetki başvurusunda bulunulabilir. Ancak, yapılacak toplu iş sözleşmesi önceki sözleşme sona ermedikçe yürürlüğe giremez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Toplu iş sözleşmesinin hükmü">
      <mvz-fıkra no="1">
        <template>Toplu iş sözleşmesinde aksi belirtilmedikçe iş sözleşmeleri toplu iş sözleşmesine aykırı olamaz. İş sözleşmelerinin toplu iş sözleşmesine aykırı hükümlerinin yerini toplu iş sözleşmesindeki hükümler alır. Toplu iş sözleşmesinde iş sözleşmelerine aykırı hükümlerin bulunması hâlinde ise iş sözleşmesinin işçi yararına olan hükümleri geçerlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sona eren toplu iş sözleşmesinin iş sözleşmesine ilişkin hükümleri yenisi yürürlüğe girinceye kadar iş sözleşmesi hükmü olarak devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Tarafların durumunda değişiklik">
      <mvz-fıkra no="1">
        <template>Toplu iş sözleşmesine taraf olan sendikanın tüzel kişiliğinin sona ermesi, faaliyetinin durdurulması, işçi sendikasının yetkiyi kaybetmesi ve toplu iş sözleşmesinin uygulandığı işyerlerinde işverenin veya işyerinin girdiği işkolunun değişmesi toplu iş sözleşmesini sona erdirmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu görüşmeye çağrı tarihinde bir işveren sendikasına üye bulunan işveren, sendika üyeliğinin sona ermesi hâlinde sendikaya yapılmış olan çağrı ile bağlı kalır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sözleşmenin imzalanması tarihinde taraf işveren sendikasının üyesi olan işveren, sendikası ile ilişkisinin kesilmesi hâlinde yapılmış olan sözleşme ile bağlı kalır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="38" başlık="İşyerinin veya bir bölümünün devri">
      <mvz-fıkra no="1">
        <template>İşletme toplu iş sözleşmesi kapsamında olan ya da toplu iş sözleşmesi bulunan bir işyeri veya işyerinin bir bölümünün devrinde, devralan işverenin aynı işkoluna giren işyeri veya işyerlerinde yürürlükte bir toplu iş sözleşmesi var ise; devralınan işyeri veya işyerlerinde uygulanan toplu iş sözleşmesinden doğan hak ve borçlar, iş sözleşmesi hükmü olarak devam eder. Devralan işverenin işyeri ya da işyerlerinde uygulanan bir toplu iş sözleşmesi yok ise; devralınan işyerinde yürürlükteki toplu iş sözleşmesinden doğan hak ve borçlar, yeni bir toplu iş sözleşmesi yapılıncaya kadar toplu iş sözleşmesi hükmü olarak devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu iş sözleşmesi bulunmayan bir işyerinin işletme toplu iş sözleşmesi tarafı olan bir işverence devralınması durumunda işyeri, işletme toplu iş sözleşmesi kapsamına girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="39" başlık="Toplu iş sözleşmesinden yararlanma">
      <mvz-fıkra no="1">
        <template>Toplu iş sözleşmesinden taraf işçi sendikasının üyeleri yararlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu iş sözleşmesinden, sözleşmenin imzalanması tarihinde taraf sendikaya üye olanlar yürürlük tarihinden, imza tarihinden sonra üye olanlar ise üyeliklerinin taraf işçi sendikasınca işverene bildirildiği tarihten itibaren yararlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren üyeler de, iş sözleşmelerinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Toplu iş sözleşmesinin imzası sırasında taraf işçi sendikasına üye olmayanlar, sonradan işyerine girip de üye olmayanlar veya imza tarihinde taraf işçi sendikasına üye olup da ayrılanlar veya çıkarılanların toplu iş sözleşmesinden yararlanabilmeleri, toplu iş sözleşmesinin tarafı olan işçi sendikasına dayanışma aidatı ödemelerine bağlıdır. Bunun için işçi sendikasının onayı aranmaz. Dayanışma aidatı ödemek suretiyle toplu iş sözleşmesinden yararlanma, talep tarihinden geçerlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Dayanışma aidatının miktarı, üyelik aidatından fazla olmamak kaydıyla sendika tüzüğünde belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Faaliyeti durdurulmuş sendikalara dayanışma aidatı ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu Kanun anlamında işveren vekilleri ile toplu iş sözleşmesi görüşmelerine işvereni temsilen katılanlar, toplu iş sözleşmesinden yararlanamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Grev sonunda yapılan toplu iş sözleşmesinden, 65 inci maddeye göre zorunlu olarak çalışanlar dışında işyerinde çalışmış olanlar aksine hüküm bulunmadıkça yararlanamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="40" başlık="Teşmil">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanı; teşmili yapılacak işyerinin kurulu bulunduğu işkolunda en çok üyeye sahip sendikanın yapmış olduğu bir toplu iş sözleşmesini, o işkolundaki işçi veya işveren sendikalarının veya ilgili işverenlerden birinin ya da Çalışma ve Sosyal Güvenlik Bakanının talebi üzerine, Yüksek Hakem Kurulunun görüşünü aldıktan sonra tamamen veya kısmen ya da zorunlu değişiklikleri yaparak, o işkolunda toplu iş sözleşmesi bulunmayan işyeri veya işyerlerine teşmil edebilir. Yüksek Hakem Kurulu bu konudaki görüşünü on beş iş günü içinde bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Teşmil kararında teşmilin gerekçesi açıklanır. Yürürlüğe gireceği tarih de belirtilmek suretiyle teşmil kararı Resmî Gazete’de yayımlanır, ancak yürürlük tarihi Resmî Gazete’de yayım tarihinden önceki bir tarih olarak belirlenemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Teşmil edilen toplu iş sözleşmesinin sona ermesi ile teşmil kararı da ortadan kalkar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Cumhurbaşkanı teşmil kararını, gerekçesini de açıklayarak gerekli gördüğünde yürürlükten kaldırabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Toplu iş sözleşmesinin, tarafların hak ve borçlarını düzenleyen hükümleri ile özel hakeme başvurma hakkındaki hükümleri teşmil edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yetki için başvurulduktan sonra bu işlem tamamlanıncaya kadar veya yetki belgesi alındıktan sonra yetki devam ettiği sürece, kapsama giren işyerleri için teşmil kararı alınamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Toplu iş sözleşmesinin teşmil edildiği işletme veya işyerinde her zaman yetki için başvurulabilir ve yeni toplu iş sözleşmesinin yapılmasıyla birlikte teşmil uygulaması kendiliğinden sona erer.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Toplu İş Sözleşmesinin Yapılması">
    <mvz-madde no="41" başlık="Yetki">
      <mvz-fıkra no="1">
        <template>Kurulu bulunduğu işkolunda çalışan işçilerin en az yüzde birinin üyesi bulunması şartıyla işçi sendikası, toplu iş sözleşmesinin kapsamına girecek işyerinde başvuru tarihinde çalışan işçilerin yarıdan fazlasının, işletmede ise yüzde kırkının kendi üyesi bulunması hâlinde bu işyeri veya işletme için toplu iş sözleşmesi yapmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşletme toplu iş sözleşmeleri için işyerleri bir bütün olarak dikkate alınır ve yüzde kırk çoğunluk buna göre hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşletmede birden çok sendikanın yüzde kırk veya fazla üyesinin olması durumunda başvuru tarihinde en çok üyeye sahip sendika toplu iş sözleşmesi yapmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bir işveren sendikası, üyesi işverenlere ait işyeri veya işyerleri, sendika üyesi olmayan bir işveren ise kendi işyeri veya işyerleri için toplu iş sözleşmesi yapmaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bir işkolunda çalışan işçilerin yüzde birinin tespitinde Bakanlıkça her yıl ocak ve temmuz aylarında yayımlanan istatistikler esas alınır. Bu istatistiklerde her bir işkolundaki toplam işçi sayısı ile işkollarındaki sendikaların üye sayıları yer alır. Yayımlanan istatistik, toplu iş sözleşmesi ve diğer işlemler için yeni istatistik yayımlanıncaya kadar geçerlidir. Yetki belgesi almak üzere başvuran veya yetki belgesi alan işçi sendikasının yetkisini daha sonra yayımlanacak istatistikler etkilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yayımından itibaren on beş gün içinde itiraz edilmeyen istatistik kesinleşir. İstatistiğin gerçeğe uymadığı gerekçesiyle bu süre içinde Ankara İş Mahkemesine başvurulabilir. Mahkeme bu itirazı on beş gün içinde sonuçlandırır.  Mahkemece verilen karar hakkında, ilgililerce veya Bakanlıkça istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi bir ay içinde kararını verir. Bu karara karşı temyiz yoluna başvurulması hâlinde Yargıtay, temyiz talebini bir ay içinde kesin olarak karara bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bakanlık, yetkili sendikanın belirlenmesinde ve istatistiklerin düzenlenmesinde kendisine gönderilen üyelik ve üyelikten çekilme bildirimleri ile Sosyal Güvenlik Kurumuna yapılan işçi bildirimlerini esas alır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Yetki tespiti için başvuru">
      <mvz-fıkra no="1">
        <template>Toplu iş sözleşmesi yapmak isteyen işçi sendikası Bakanlığa başvurarak yetkili olduğunun tespitini ister. İşveren sendikası veya sendika üyesi olmayan işveren de Bakanlığa başvurarak yetkili işçi sendikasının tespitini isteyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık, kayıtlarına göre başvuru tarihi itibarıyla bir işçi sendikasının yetkili olduğunu tespit ettiğinde, başvuruyu, işyeri veya işletmedeki işçi ve üye sayısını, o işkolunda kurulu işçi sendikaları ile taraf olacak işveren sendikası veya sendika üyesi olmayan işverene altı iş günü içinde bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşçi sendikasının yetki şartlarına sahip olmadığının ya da işyerinde yetki şartlarına sahip bir işçi sendikasının bulunmadığının tespiti hâlinde, bu bilgiler sadece başvuruyu yapan tarafa bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sigortalılığın başlangıcı ile sona ermesine ilişkin bildirimlerden yasal süresi içinde Sosyal Güvenlik Kurumuna yapılmayanlar, yetkili işçi sendikasının tespitinde dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yetki tespiti ile ilgili usul ve esaslar Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="Yetki itirazı">
      <mvz-fıkra no="1">
        <template>Kendilerine 42 nci madde uyarınca gönderilen tespit yazısını alan işçi veya işveren sendikaları veya sendika üyesi olmayan işveren; taraflardan birinin veya her ikisinin yetki şartlarına sahip olmadığı veya kendisinin bu şartları taşıdığı yolundaki itirazını, nedenlerini de göstererek yazının kendilerine tebliğ edildiği tarihten itibaren altı iş günü içinde mahkemeye yapabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İtiraz dilekçesi görevli makama kayıt ettirildikten sonra mahkemeye verilir. Kurulu bulunduğu işkolunda çalışan işçilerin yüzde birinden daha az üyesi bulunan işçi sendikası, yetki itirazında bulunamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İtiraz dilekçesinde veya ekinde somut delillerin yer almaması hâlinde itiraz incelenmeksizin reddedilir. İşçi ve üye sayılarının tespitinde maddi hata ve süreye ilişkin itirazları mahkeme altı iş günü içinde duruşma yapmaksızın kesin olarak karara bağlar.  Bunların dışındaki itirazlar için mahkeme, duruşma yaparak karar verir ve bu karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi bir ay içinde kararını verir.  Bu karara karşı temyiz yoluna başvurulması hâlinde Yargıtay bir ay içinde kesin olarak karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>42 nci maddenin üçüncü fıkrası uyarınca kendisine yetki şartlarına sahip olmadığı bildirilen işçi sendikası, altı iş günü içinde yetkili olup olmadığının tespiti için dava açabilir. Mahkeme açılan davayı o işkolunda çalışan işçilerin en az yüzde birini üye kaydeden işçi sendikaları ile işveren sendikası veya sendika üyesi olmayan işverene de bildirir. Mahkeme davayı iki ay içinde sonuçlandırır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İtiraz, karar kesinleşinceye kadar yetki işlemlerini durdurur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Yetki belgesi">
      <mvz-fıkra no="1">
        <template>Tespit yazısına süresi içinde itiraz edilmemişse sürenin bitimini takip eden altı iş günü içinde; yapılan itiraz reddedilmişse ya da kendisine yetki şartlarına sahip olmadığı bildirilen sendikanın itirazı sonucunda yetki şartlarına sahip olduğunu tespit eden kesinleşmiş mahkeme kararının tebliğ edildiği tarihten itibaren altı iş günü içinde; ilgili sendikaya, Bakanlıkça bir yetki belgesi verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="45" başlık="Yetki belgesi bulunmaksızın yapılan toplu iş sözleşmesi">
      <mvz-fıkra no="1">
        <template>Yetki belgesi bulunmaksızın yapılan bir toplu iş sözleşmesinde taraflardan birinin veya ikisinin yetki şartlarına sahip olmadığı ve bu nedenle sözleşmenin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde, ilgililerce veya Bakanlıkça mahkemede dava yolu ile ileri sürülebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Talep hâlinde mahkeme, toplu iş sözleşmesinin uygulanmasını dava sonuna kadar durdurabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="46" başlık="Toplu görüşmeye çağrı">
      <mvz-fıkra no="1">
        <template>Taraflardan biri, yetki belgesinin alındığı tarihten itibaren on beş gün içinde karşı tarafı toplu görüşmeye çağırır. Çağrı tarihi, çağrıyı yapan tarafça derhâl görevli makama bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu süre içerisinde çağrı yapılmazsa, yetki belgesinin hükmü kalmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çağrıyı yapan taraf, toplu görüşmede ileri süreceği tekliflerin bütününü çağrı süresi içinde karşı tarafa vermek zorundadır. Ancak, tarafların toplu görüşme gereği ileri sürecekleri tekliflerde değişiklik yapma hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="47" başlık="Toplu görüşmenin başlaması ve süresi">
      <mvz-fıkra no="1">
        <template>Çağrının karşı tarafa tebliğ edildiği tarihten itibaren altı iş günü içinde taraflar toplu görüşmenin yer, gün ve saatini aralarında anlaşarak belirler ve bunu görevli makama yazı ile bildirir. Anlaşmaya varılamazsa, taraflardan birinin başvurusu üzerine, yapılacak ilk toplantının yeri, günü ve saati görevli makamca derhâl belirlenir ve taraflara bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşçi sendikası, çağrı tarihinden itibaren otuz gün içinde yapılacak olan ilk toplantıya gelmez veya aynı süre içinde toplu görüşmeye başlamazsa yetkisi düşer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Toplu görüşmenin süresi, ilk toplantı tarihinden itibaren altmış gündür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="48" başlık="Toplu iş sözleşmesinin imzalanması, tevdi edilmesi ve işyerinde ilanı">
      <mvz-fıkra no="1">
        <template>Toplu görüşmenin sonunda bir anlaşmaya varılırsa dört nüsha olarak düzenlenecek olan toplu iş sözleşmesi, taraf temsilcilerince imzalanır ve iki nüshası altı iş günü içinde çağrıyı yapan tarafça görevli makama tevdi edilir. Görevli makam sözleşmenin bir nüshasını Bakanlığa gönderir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren, bir toplu iş sözleşmesi veya toplu iş sözleşmesi hükmündeki özel hakem veya Yüksek Hakem Kurulu kararı ile toplu hak uyuşmazlıklarında verilmiş mahkeme veya özel hakem kararlarını, işyeri veya işyerlerinde işçiler tarafından görülebilecek yerlere asmakla yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="9-DOKUZUNCU" başlık="Toplu İş Uyuşmazlıklarının Çözümü">
    <mvz-madde no="49" başlık="Uyuşmazlığın tespiti">
      <mvz-fıkra no="1">
        <template>Toplu görüşme için kararlaştırılan ilk toplantıya taraflardan biri gelmez veya geldiği hâlde görüşmeye başlamazsa, toplu görüşmeye başladıktan sonra toplantıya devam etmezse veya taraflar toplu görüşme süresi içerisinde anlaşamadıklarını bir tutanakla tespit ederlerse ya da toplu görüşme süresi anlaşma olmaksızın sona ererse, taraflardan biri uyuşmazlığı altı iş günü içinde görevli makama bildirir. Aksi takdirde işçi sendikasının yetkisi düşer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="50" başlık="Arabuluculuk">
      <mvz-fıkra no="1">
        <template>Uyuşmazlık yazısını alan görevli makam altı iş günü içinde taraflardan en az birinin katılımı ile veya katılım olmazsa resen, resmî listede bir arabulucu görevlendirir. Tarafların resmî arabulucu listesindeki bir arabulucu ismi üzerinde anlaşma sağlamaları hâlinde, belirlenen kişi görevli makam tarafından o uyuşmazlıkta arabulucu olarak görevlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Arabulucu, tarafların anlaşmaya varması için her türlü çabayı harcar ve ilgililere önerilerde bulunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabulucunun görevi kendisine yapılacak bildirimden itibaren on beş gün sürer. Bu süre tarafların anlaşması ile en çok altı iş günü uzatılabilir ve görevli makama bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Arabulucu, tarafların anlaşmasını sağlarsa 48 inci madde hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Arabuluculuk süresinin sonunda anlaşma sağlanamamışsa, arabulucu üç iş günü içinde uyuşmazlığı belirleyen bir tutanak düzenler ve uyuşmazlığın sona erdirilmesi için gerekli gördüğü önerileri de ekleyerek görevli makama tevdi eder. Görevli makam, tutanağı en geç üç iş günü içinde taraflara tebliğ eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Taraflar ve diğer bütün ilgililer, arabulucunun anlaşmazlık konusu ile ilgili istediği her türlü bilgi ve belgeyi vermekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Görevli makam, uyuşmazlığın kapsamını ve niteliğini de dikkate alarak arabulucuya ödenmesi gereken ücreti yönetmelikte belirtilen alt ve üst sınırlar içerisinde belirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="51" başlık="Yüksek Hakem Kuruluna başvurma">
      <mvz-fıkra no="1">
        <template>Grev oylaması sonucunda grev yapılmaması yönündeki kararın kesinleşmesinden itibaren altı iş günü içinde işçi sendikası; grev ve lokavtın yasak olduğu uyuşmazlıklarda 50 nci maddenin beşinci fıkrasında belirtilen tutanağın tebliğinden ya da erteleme süresinin uyuşmazlıkla sonuçlanması hâlinde sürenin bitiminden itibaren taraflardan biri altı iş günü içinde Yüksek Hakem Kuruluna başvurabilir. Aksi takdirde işçi sendikasının yetkisi düşer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek Hakem Kurulu kararları kesindir ve toplu iş sözleşmesi hükmündedir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="52" başlık="Özel hakeme başvurma">
      <mvz-fıkra no="1">
        <template>Taraflar, anlaşarak toplu hak veya çıkar uyuşmazlıklarının her safhasında özel hakeme başvurabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu iş sözleşmesine, taraflardan birinin başvurması üzerine özel hakeme gidileceğine dair hükümler konulabilir. Toplu iş sözleşmesinde aksine hüküm yoksa 12/1/2011 tarihli ve 6100 sayılı Hukuk Muhakemeleri Kanununun özel hakeme ilişkin hükümleri uygulanır. Toplu hak uyuşmazlıklarında özel hakem kararları genel hükümlere tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
