        <template>Toplu çıkar uyuşmazlıklarında taraflar özel hakeme başvurma hususunda yazılı olarak anlaşma yaparlarsa, bundan sonra arabuluculuk, grev ve lokavt, kanuni hakemlik hükümleri uygulanmaz. Toplu çıkar uyuşmazlıklarında özel hakem kararları toplu iş sözleşmesi hükmündedir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Uyuşmazlığın her safhasında taraflar anlaşarak özel hakem olarak Yüksek Hakem Kurulunu da seçebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="53" başlık="Yorum davası ve eda davasında faiz">
      <mvz-fıkra no="1">
        <template>Uygulanmakta olan bir toplu iş sözleşmesinin yorumundan doğan uyuşmazlıklarda sözleşmenin taraflarınca dava açılabilir. Mahkeme en geç iki ay içinde karar verir.  Karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi, uyuşmazlığı iki ay içinde kesin olarak karara bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu iş sözleşmesine dayanan eda davalarında, temerrüt tarihinden itibaren işletme kredilerine uygulanan en yüksek faiz oranı uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="10-ONUNCU" başlık="Yüksek Hakem Kurulunun Kuruluşu ve Çalışma Esasları">
    <mvz-madde no="54" başlık="Kuruluşu">
      <mvz-fıkra no="1">
        <template>Yüksek Hakem Kurulu, Yargıtayın bu Kanundan doğan uyuşmazlıklara bakmakla görevli dairelerinin başkanları arasından başkanlık süresi en fazla olanın başkanlığında;</template>
        <mvz-bent no="a">
          <template>Cumhurbaşkanınca, bakanlıklar bünyesi dışında, işçi veya işveren kuruluşları ile hiçbir şekilde bağlantısı bulunmayan ve siyasi parti organlarında görevli olmayan, ekonomi, işletme, sosyal politika veya iş hukuku konularında bilgi ve tecrübe sahibi olanlar arasından seçilecek bir üye,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Üniversitelerin iş ve sosyal güvenlik hukuku anabilim dalı öğretim üyeleri arasından Yükseköğretim Kurulunca seçilecek bir üye,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bakanlık Çalışma Genel Müdürü,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>İşçi sendikaları konfederasyonlarından kendisine mensup işçi sayısı en yüksek olan konfederasyonca seçilecek iki üye,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İşverenler adına en çok işveren mensubu olan işveren sendikaları konfederasyonunca biri kamu işverenlerinden olmak üzere seçilecek iki üyeden,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>oluşur. Ancak uyuşmazlık konusunun tarafı olan sendikanın bağlı bulunduğu işçi konfederasyonunun farklı olması hâlinde, bağlı bulunduğu konfederasyonun seçeceği bir üye, uyuşmazlık konusunun tarafı olan sendikanın bağlı bulunduğu bir başka işveren sendikaları konfederasyonu bulunması hâlinde de sendikanın bağlı bulunduğu konfederasyonun seçeceği bir üye, ikinci üyenin yerine Kurul üyesi olarak toplantıya katılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçimle gelen üyeler, iki yıl için seçilir ve yeniden seçilmeleri mümkündür. İşçi ve işverenler adına seçilecek üyelerde 6 ncı maddedeki kurucular için öngörülen şartlar aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Seçimle gelen her bir üye için aynı şekilde ikişer yedek üye seçilir. Kurul Başkanlığı için birinci ve ikinci yedekler, Yargıtay Hukuk Genel Kurulunca hukuk daireleri başkanları arasından seçilir. Yüksek Hakem Kuruluna katılacak üyelerin seçilmesi, her seçim döneminden üç ay önce Bakanlıkça ilgili makam ve kuruluşlardan istenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="55" başlık="Yönetim yapısı">
      <mvz-fıkra no="1">
        <template>Yüksek Hakem Kurulunun yazışma ve uzmanlık hizmetlerini yürütmek üzere Yüksek Hakem Kurulu Başkanlığına bağlı olarak bir genel sekreterlik kurulur. Genel sekreter başkanın teklifi üzerine genel usullere göre atanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek Hakem Kurulunun talebi üzerine Cumhurbaşkanlığınca yeteri kadar raportör ve uzman atanır veya görevlendirilir. Ancak, işçi veya işveren kuruluşlarında çalışmakta olanlar, raportör veya uzman olarak görevlendirilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="56" başlık="Çalışma esasları">
      <mvz-fıkra no="1">
        <template>Yüksek Hakem Kurulu başvuru dilekçesinin alındığı günden başlayarak altı iş günü içinde başkan ve en az beş üyenin katılımı ile toplanır. Mazeretli veya izinli olan asıl başkan veya üyenin yerini aynı gruptan yedek başkan veya yedek üyelerden biri alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek Hakem Kurulu, uyuşmazlığı dosya üzerinde inceler. Gerekli görüldüğü durumlarda taraflar ve ilgililerden uyuşmazlıkla ilgili her türlü bilgi ve belgeyi isteyebilir. Taraflar ve diğer bütün ilgililer, Yüksek Hakem Kurulunun istediği bilgi ve belgeyi vermekle yükümlüdür. Yüksek Hakem Kurulu, görüşlerini öğrenmek istediği kişileri çağırıp dinler veya bunların görüşlerini yazı ile bildirmelerini ister. Bunlar hakkında 6100 sayılı Kanunun tanıklara ve bilirkişilere ilişkin hükümleri uygulanır. Taraflar da, bilgilendirmek amacıyla Kurulda dinlenmelerini isteyebilir, bilgi ve belge sunabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yüksek Hakem Kurulu toplantıya katılanların çoğunluğu ile karar verir. Oyların eşitliği hâlinde başkanın bulunduğu taraf çoğunluğu sağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde gereğince yapılacak ödemeleri karşılamak üzere gerekli ödenek Bakanlık bütçesine konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="57" başlık="Hakeme ve arabulucuya başvurma yönetmeliği">
      <mvz-fıkra no="1">
        <template>Yüksek Hakem Kurulunun çalışma usul ve esasları; Yüksek Hakem Kurulunun başkan ve üyeleri ile bu Kurulda görevlendirilecek uzman ve raportörlere ödenecek tazminatlar; bilirkişi ve tanıklara verilecek ücretler ve toplu çıkar uyuşmazlıklarında özel hakem incelemesinde uygulanacak usul hükümleri; arabulucuların nitelikleri, seçimi, ücretleri ve görevlendirilmeleri Maliye Bakanlığının görüşü alınarak Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="11-ONBİRİNCİ" başlık="Grev ve Lokavt">
    <mvz-madde no="58" başlık="Grevin tanımı">
      <mvz-fıkra no="1">
        <template>İşçilerin, topluca çalışmamak suretiyle işyerinde faaliyeti durdurmak veya işin niteliğine göre önemli ölçüde aksatmak amacıyla, aralarında anlaşarak veya bir kuruluşun aynı amaçla topluca çalışmamaları için verdiği karara uyarak işi bırakmalarına grev denir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu iş sözleşmesinin yapılması sırasında uyuşmazlık çıkması hâlinde, işçilerin ekonomik ve sosyal durumları ile çalışma şartlarını korumak veya geliştirmek amacıyla, bu Kanun hükümlerine uygun olarak yapılan greve kanuni grev denir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kanuni grev için aranan şartlar gerçekleşmeden yapılan grev kanun dışıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="59" başlık="Lokavtın tanımı">
      <mvz-fıkra no="1">
        <template>İşyerinde faaliyetin tamamen durmasına neden olacak tarzda, işveren veya işveren vekili tarafından kendi kararıyla veya bir kuruluşun verdiği karara uyarak, işçilerin topluca işten uzaklaştırılmasına lokavt denir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu iş sözleşmesinin yapılması sırasında uyuşmazlık çıkması ve işçi sendikası tarafından grev kararı alınması hâlinde bu Kanun hükümlerine uygun olarak yapılan lokavta kanuni lokavt denir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kanuni lokavt için aranan şartlar gerçekleşmeden yapılan lokavt kanun dışıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="60" başlık="Kanuni grev ve lokavt kararının alınması ve uygulamaya konulması">
      <mvz-fıkra no="1">
        <template>Grev kararı, 50 nci maddenin beşinci fıkrasında belirtilen uyuşmazlık tutanağının tebliği tarihinden itibaren altmış gün içinde alınabilir ve bu süre içerisinde altı iş günü önceden karşı tarafa bildirilecek tarihte uygulamaya konulabilir. Bu süre içerisinde, grev kararının alınmaması veya uygulanacağı tarihin karşı tarafa bildirilmemesi hâlinde toplu iş sözleşmesi yapma yetkisi düşer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Uyuşmazlığın tarafı olan işveren sendikası veya sendika üyesi olmayan işveren, grev kararının kendisine tebliğinden itibaren altmış gün içinde lokavt kararı alabilir ve bu süre içerisinde altı iş günü önceden karşı tarafa bildirilecek tarihte uygulamaya koyabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Grev ve lokavt kararları, kararı alan tarafça işyeri veya işyerlerinde derhâl ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bildirilen tarihte başlamayan grev hakkı veya lokavt düşer. Süresi içinde grev kararı uygulamaya konulmamışsa ve alınmış bir lokavt kararı da yoksa veya lokavt da süresi içinde uygulamaya konulmamışsa yetki belgesinin hükmü kalmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Grev ve lokavt kararlarının uygulanacağı tarih, kararı alan tarafça karşı tarafa tebliğ edilmek üzere notere ve bir örneği de görevli makama tevdi edilir. Uygulama tarihi, kararı alan tarafça ayrıca işyeri veya işyerlerinde derhâl ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>(İptal)</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kanuni grev kararı alınan bir uyuşmazlıkta Çalışma ve Sosyal Güvenlik Bakanı uyuşmazlığın çözümü için bizzat arabuluculuk yapabileceği gibi bir kişiyi de arabulucu olarak görevlendirebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="61" başlık="Grev oylaması">
      <mvz-fıkra no="1">
        <template>Grev kararının işyerinde ilan edildiği tarihte o işyerinde çalışan işçilerin en az dörtte birinin ilan tarihinden itibaren altı iş günü içinde işyerinin bağlı bulunduğu görevli makama yazılı başvurusu üzerine, görevli makamca talebin yapılmasından başlayarak altı iş günü içinde grev oylaması yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Oylamaya ilişkin itirazlar, oylama gününden başlayarak üç iş günü içinde mahkemeye yapılır. İtiraz, mahkemece üç iş günü içinde kesin olarak karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Oylamada grev ilanının yapıldığı tarihte işyerinde çalışan işçilerden oylamaya katılanların salt çoğunluğu grevin yapılmaması yönünde karar verirse, bu uyuşmazlıkta alınan grev kararı uygulanamaz. Bu durumda 60 ıncı maddenin birinci fıkrasında belirtilen sürenin sonuna kadar anlaşma sağlanamazsa veya 51 inci maddenin birinci fıkrasında belirtilen süre içerisinde işçi sendikası Yüksek Hakem Kuruluna başvurmazsa yetki belgesinin hükmü kalmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşletme toplu iş sözleşmesi yapılmasına ilişkin uyuşmazlıkta grev oylaması talebi, işletmenin her bir işyerinin bağlı bulunduğu görevli makama yapılır. Grev oylaması isteyen işçilerin sayısının yeterli orana ulaşıp ulaşmadığının tespiti ile grev oylamasının sonuçları işletme merkezinin bağlı bulunduğu görevli makamda toplanır ve toplu sonuç orada belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Grup toplu iş sözleşmesi yapılmasına ilişkin uyuşmazlıkta grev oylaması talebi, grubun her bir işyerinin bağlı bulunduğu görevli makama yapılır. Grev oylaması isteyen işçilerin sayısının yeterli orana ulaşıp ulaşmadığının tespiti ile grev oylamasının sonuçları her işyeri için ayrıca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Grev oylamasının usul ve esasları Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="62" başlık="Grev ve lokavt yasakları">
      <mvz-fıkra no="1">
        <template>Can ve mal kurtarma işlerinde; cenaze işlerinde ve mezarlıklarda; şehir şebeke suyu, elektrik, doğal gaz, petrol üretimi, tasfiyesi ve dağıtımı ile nafta veya doğalgazdan başlayan petrokimya işlerinde;  Millî Savunma Bakanlığı ile Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığınca doğrudan işletilen işyerlerinde; kamu kuruluşlarınca yürütülen itfaiye  ve hastanelerde grev ve lokavt yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Cumhurbaşkanı, genel hayatı önemli ölçüde etkileyen doğa olaylarının gerçekleştiği yerlerde bu durumun devamı süresince yürürlükte kalmak kaydıyla gerekli gördüğü işyerlerinde grev ve lokavtı yasaklayabilir. Yasağın kalkmasından itibaren altmış gün içinde altı iş günü önce karşı tarafa bildirilmek kaydıyla grev ve lokavt uygulamasına devam edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Başladığı yolculuğu yurt içindeki varış yerlerinde bitirmemiş deniz, hava, demir ve kara ulaştırma araçlarında grev ve lokavt yapılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="63" başlık="Grev ve lokavtın ertelenmesi">
      <mvz-fıkra no="1">
        <template>Karar verilmiş veya başlanmış olan kanuni bir grev veya lokavt; genel sağlığı veya millî güvenliği,  bozucu nitelikte ise Cumhurbaşkanı bu uyuşmazlıkta grev ve lokavtı altmış gün süre ile erteleyebilir. Erteleme süresi, kararın yayımı tarihinde başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Erteleme kararının yürürlüğe girmesi üzerine, 60 ıncı maddenin yedinci fıkrasına göre belirlenen arabulucu, uyuşmazlığın çözümü için erteleme süresince her türlü çabayı gösterir. Erteleme süresi içerisinde taraflar aralarında anlaşarak uyuşmazlığı özel hakeme de götürebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Erteleme süresinin sonunda anlaşma sağlanamazsa, altı iş günü içinde taraflardan birinin başvurusu üzerine uyuşmazlık Yüksek Hakem Kurulunca çözülür. Aksi takdirde işçi sendikasının yetkisi düşer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="64" başlık="Grev ve lokavtın uygulanması">
      <mvz-fıkra no="1">
        <template>İşçiler greve katılıp katılmamakta serbesttir. Greve katılan işçiler ile lokavta maruz kalan işçiler işyerinden ayrılmak zorundadır. Greve katılmayan veya katılmaktan vazgeçenlerin işyerinde çalışmaları hiçbir şekilde engellenemez. Ancak, işveren bu işçileri çalıştırıp çalıştırmamakta serbesttir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Greve katılan veya lokavta maruz kalan işçilerin işyerine giriş çıkışı engellemeleri yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Grev başlamadan önce üretilen ürünlerin satılmasına ve işyeri dışına çıkarılmasına engel olunamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Greve katılmayıp çalışan işçilerin ürettiği ürünlerin satılmasına ve işyeri dışına çıkarılmasına, işyeri için gerekli maddelerin, araç ve gereçlerin işyerine sokulmasına engel olunamaz. Bu fıkraya göre işlerin görülmesinde 68 inci madde hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Grev esnasında greve karar veren sendikanın kusurlu hareketi sonucu grev uygulanan işyerinde neden olunan maddi zarardan sendika sorumludur. Yetkili işçi sendikasının kararı olmadan işçi ya da yöneticilerin bireysel eylemlerinden kaynaklanan zararlardan kusuru olan yönetici ya da işçi sorumludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="65" başlık="Kanuni grev ve lokavta katılamayacak işçiler">
      <mvz-fıkra no="1">
        <template>Hiçbir surette üretim veya satışa yönelik olmamak kaydıyla niteliği bakımından sürekli olmasında teknik zorunluluk bulunan işlerde faaliyetin devamlılığını veya işyeri güvenliğini, makine ve demirbaş eşyalarının, gereçlerinin, hammadde, yarı mamul ve mamul maddelerin bozulmamasını ya da hayvan ve bitkilerin korunmasını sağlayacak sayıda işçi, kanuni grev ve lokavt sırasında çalışmak, işveren de bunları çalıştırmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Grev ve lokavt dışında kalacak işçilerin niteliği, sayısı ve yedekleri, işveren veya işveren vekili tarafından toplu görüşmenin başlamasından itibaren altı iş günü içinde işyerinde yazı ile ilan edilir ve bu ilanın bir örneği taraf işçi sendikasına tebliğ edilir. Bu tebliğden itibaren altı iş günü içinde işçi sendikası mahkemeye itirazda bulunmazsa ilan hükümleri kesinleşir. İtiraz hâlinde mahkeme altı iş günü içinde kesin olarak karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Grev ve lokavta katılamayacak işçiler her ne sebeple olursa olsun kanuni süre içinde tespit edilmemiş ise işveren veya işçi sendikası çalışacak işçi sayısının tespitini süre geçtikten sonra da görevli makamdan isteyebilir. Görevli makam bu tespiti en kısa zamanda yaparak taraflara tebliğ eder. Gerekli hâllerde görevli makam resen tespitte bulunabilir. Görevli makamın tespitine karşı, taraflardan her biri mahkemeye altı iş günü içinde itiraz edebilir. Mahkeme altı iş günü içinde kesin olarak karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Grev ve lokavtın uygulanacağı dönemde hangi işçilerin işyerinde çalışmaya devam edecekleri görevli makamca grev ve lokavt kararının bildirilmesinden itibaren üç iş günü içinde resen tespit edilerek ilgili işverene ve işçilere yazı ile bildirilir. O işyerinde çalışan ve toplu görüşmede taraf olan işçi sendikası ve şubesinin yöneticileri bu hükme tabi tutulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşveren, grev ve lokavta katılamayacak işçilerden herhangi bir nedenle çalışmayanların yerine görevli makamın yazılı izni ile yeni işçi alabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="66" başlık="Grev hakkının ve lokavtın güvencesi">
      <mvz-fıkra no="1">
        <template>Toplu iş sözleşmelerine ve iş sözleşmelerine, grev hakkı veya lokavttan vazgeçilmesine veya bunların kısıtlanmasına dair konulacak hükümler geçersizdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kanuni bir grev kararının alınmasına katılma, teşvik etme, greve katılma veya greve katılmaya teşvik etme nedeniyle bir işçinin iş sözleşmesi feshedilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Grev ve lokavt süresince işçiler, sigorta yardımlarından 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun ilgili hükümlerine göre yararlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="67" başlık="Kanuni grev ve lokavtın iş sözleşmelerine etkisi">
      <mvz-fıkra no="1">
        <template>Kanuni greve katılan, greve katılmayan veya katılmaktan vazgeçip de grev nedeniyle çalıştırılamayan ve kanuni lokavta maruz kalan işçilerin iş sözleşmeleri grev ve lokavt süresince askıda kalır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren, grev ve lokavt nedeniyle iş sözleşmeleri askıda kalan işçilerin grev veya lokavtın başlamasından önce işleyen ücretlerini ve eklerini olağan ödeme gününde ödemek zorundadır. Ödemeyi yapacak personel de bunun için çalışmakla yükümlüdür. Aksi hâlde 65 inci maddenin beşinci fıkrası hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Grev ve lokavt süresince iş sözleşmeleri askıda kalan işçilere bu dönem için işverence ücret ve sosyal yardımlar ödenemez, bu süre kıdem tazminatı hesabında dikkate alınmaz. Toplu iş sözleşmelerine ve iş sözleşmelerine bunların aksine hüküm konulamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="68" başlık="İşçi alma ve başka işe girme yasağı">
      <mvz-fıkra no="1">
        <template>İşveren, kanuni bir grev veya lokavt süresince, 67 nci madde hükmü gereğince iş sözleşmeleri askıda kalan işçilerin yerine, sürekli ya da geçici olarak başka işçi alamaz veya başkalarını çalıştıramaz. Ancak greve katılamayacak ve lokavta maruz bırakılamayacak işçilerden, ölen, kendi isteği ile ayrılan veya iş sözleşmesi işveren tarafından haklı nedenle feshedilenlerin yerine yeni işçi alınabilir. İşverenin bu yasağa aykırı hareketi, taraf sendikanın yazılı başvurusu hâlinde görevli makamca denetlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Greve katılmayan veya katılmaktan vazgeçen işçiler, ancak kendi işlerinde çalıştırılabilir. Bu işçilere, greve katılan işçilerin işleri yaptırılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kanuni bir grev ve lokavt dolayısıyla iş sözleşmeleri askıda kalan işçiler, grev veya lokavt süresince başka bir işverenin yanında çalışamaz. Aksi hâlde işçinin iş sözleşmesi işverence haklı nedenle feshedilebilir. Ancak kısmi süreli iş sözleşmesi ile çalışan işçiler, kanuni haftalık çalışma süresini tamamlayacak süreyi aşmamak üzere başka bir işverenin işyerinde çalışabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="69" başlık="Kanuni grev ve lokavtın konut haklarına etkisi">
      <mvz-fıkra no="1">
        <template>İşveren, kanuni bir grev veya lokavt süresince greve katılan veya lokavta uğrayan işçilerin oturdukları ve kendisi tarafından sağlanmış olan konutlardan çıkmalarını isteyemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren, bu konutlarda oturan işçilerden, grev ve lokavt süresi içinde konutların onarımı, su, gaz, aydınlatma ve ısıtma giderleri ile rayiç kirayı talep edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşveren, konutların su, gaz, aydınlatma ve ısıtma hizmetlerini, kanuni grev ve lokavt süresince kısıntıya uğratamaz. Ancak bu hizmetlerin kanuni grev ve lokavt yüzünden kısıntıya uğramış olanlarının devamı, işçiler tarafından istenemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="70" başlık="Kanun dışı grev ve lokavtın sonuçları">
      <mvz-fıkra no="1">
        <template>Kanun dışı grev yapılması hâlinde işveren, grevin yapılması kararına katılan, grevin yapılmasını teşvik eden, greve katılan veya katılmaya ya da devama teşvik eden işçilerin iş sözleşmelerini haklı nedenle feshedebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kanun dışı bir grev yapılması hâlinde bu grev nedeniyle işverenin uğradığı zararlar, greve karar veren işçi kuruluşu veya kanun dışı grev herhangi bir işçi kuruluşunca kararlaştırılmaksızın yapılmışsa, bu greve katılan işçiler tarafından karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kanun dışı lokavt yapılması hâlinde işçiler iş sözleşmelerini haklı nedenle feshedebilir. İşveren, bu işçilerin lokavt süresine ilişkin iş sözleşmesinden doğan bütün haklarını bir iş karşılığı olmaksızın ödemek ve uğradıkları zararları tazmin etmekle yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="71" başlık="Tespit davası">
      <mvz-fıkra no="1">
        <template>Taraflardan her biri, karar verilen veya uygulanmakta olan bir grev veya lokavtın kanun dışı olup olmadığının tespitini mahkemeden her zaman talep edebilir. Mahkeme bir ay içinde karar verir.  Karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi bir ay içinde kesin olarak karar verir. Verilecek karar, tarafları, işçi ve işveren sendikasının üyelerini bağlar ve ceza davaları için kesin delil teşkil eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hâkim tedbir olarak dava konusu grev veya lokavtın durdurulmasına karar verebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="72" başlık="Grev hakkının ve lokavtın kötüye kullanılması">
      <mvz-fıkra no="1">
        <template>Taraflardan birinin veya Çalışma ve Sosyal Güvenlik Bakanının başvurusu üzerine mahkemece, grev hakkı veya lokavtın iyi niyet kurallarına aykırı tarzda toplum zararına veya millî servete zarar verecek şekilde kullanıldığının tespit edilmesi hâlinde, uygulanmakta olan grev veya lokavtın durdurulmasına karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kanuni bir lokavtın işyerini temelli olarak kapalı tutmak amacıyla yapıldığı kesinleşmiş mahkeme kararıyla belirlenirse, mahkeme kararının lokavt yapmış işverene veya işveren sendikasına bildirilmesi ile birlikte lokavt durdurulur. Mahkeme kararına rağmen lokavtın uygulanmaya devam edilmesi, işçilere 70 inci madde hükümlerinden yararlanma hakkı verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="73" başlık="Grev ve lokavt gözcüleri">
      <mvz-fıkra no="1">
        <template>İşyerinde grev ilan etmiş olan işçi sendikası, kanuni bir grev kararına uyulmasını sağlamak için güç kullanmaksızın ve tehditte bulunmaksızın kendi üyelerinin grev kararına uyup uymadıklarını denetlemek amacıyla, işyerinin giriş ve çıkış yerlerine, kendi üyeleri arasından en çok dörder grev gözcüsü koyabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Grev gözcüleri, işyerine giriş ve çıkışlara engel olamaz, giren ve çıkanları kontrol amacıyla dahi durduramaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşyerinde lokavt ilan etmiş olan işveren sendikası, kanuni bir lokavt kararına uyulmasını sağlamak için güç kullanmaksızın ve tehditte bulunmaksızın kendi üyelerinin lokavt kararına uyup uymadıklarını denetlemek amacıyla lokavtın kapsamına giren işyerlerine gözcüler gönderebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="74" başlık="Grev ve lokavt hâlinde mülkî amirin yetkileri">
      <mvz-fıkra no="1">
        <template>Mahallin en büyük mülkî amirleri halkın günlük yaşamı için zorunlu olan ve aksaması muhtemel hizmet ve ihtiyaçları karşılayacak, işyerinde faaliyetin devamlılığını sağlayacak tedbirleri alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Grev ve lokavtın uygulanması sırasında mahallin en büyük mülkî amirinin kamu düzenine ilişkin alacağı tedbirler, kanuni bir grev veya lokavtın uygulanmasını engelleyici nitelik taşıyamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="75" başlık="Grev ve lokavtı sona erdirme kararı">
      <mvz-fıkra no="1">
        <template>Kanuni bir grev veya lokavtı sona erdirme kararı, kararı alan tarafça ertesi iş günü sonuna kadar yazı ile karşı tarafa ve görevli makama bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Grevin veya lokavtın sona erdiği, görevli makam tarafından işyerinde ilan edilir. Kanuni grev ve lokavt, ilanın yapılması ile sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Grevin uygulanmasına son verilmesi lokavtın, lokavtın uygulanmasına son verilmesi grevin kaldırılmasını gerektirmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Grevi uygulayan işçi sendikasının herhangi bir nedenle kapatılması, feshedilmesi veya infisah etmesi hâllerinde grev ve alınmış bir karar varsa lokavt kendiliğinden sona erer ve yetki belgesi hükümsüz olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Lokavtı uygulayan işveren sendikasının herhangi bir nedenle kapatılması, feshedilmesi veya infisah etmesi hâllerinde lokavt kendiliğinden sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Grevi uygulayan sendikanın, yetki tespiti için başvurduğu tarihte işyerindeki üyesi işçilerin dörtte üçünün sendika üyeliğinden ayrıldıklarının tespiti hâlinde, ilgililerden biri grevin sona erdirilmesi için mahkemeye başvurabilir. Mahkemece belirlenecek tarihte grevin sona ereceği ikinci fıkradaki usule göre ilan edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="12-ONİKİNCİ" başlık="Çeşitli ve Son Hükümler">
    <mvz-madde no="76" başlık="Sendikanın faaliyetinin durdurulması">
      <mvz-fıkra no="1">
        <template>Sendikanın faaliyetinin durdurulması hâlinde, yedinci ila on ikinci bölümlerde belirtilen işlemler ve uygulamalar, durdurma kararıyla birlikte askıya alınır. Bu işlemler ve uygulamalar, sendikanın faaliyete geçmesi ile kaldığı yerden devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="77" başlık="Tutanaklar ve sicil">
      <mvz-fıkra no="1">
        <template>Çalışma ve İş Kurumu İl Müdürlüğü bu Kanun gereğince kendisine tevdi edilen tutanak ve yazıları aldığı tarihten başlayarak üç iş günü içinde Bakanlığa gönderir. Bir nüshasını da dosyasında saklar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık, toplu iş sözleşmeleri için bir sicil tutar. Toplu iş sözleşmesinin metni üzerinde anlaşmazlık çıktığı takdirde, Bakanlıkça sicile kaydedilmiş metin esas alınır. Sicilin tutulmasına ilişkin usul ve esaslar Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="78" başlık="Ceza hükümleri">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre;</template>
        <mvz-bent no="a">
          <template>6 ncı maddede belirtilen sendikalar için kurucu olabilme şartlarına sahip olduğuna ilişkin gerçeğe aykırı beyanda bulunanlar, fiilleri daha ağır bir cezayı gerektirmediği takdirde yediyüz Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>14 üncü maddeye göre yapılacak seçimlerle ilgili oylamalara ve bu oylamaların sayım ve dökümüne hile karıştıranlar, fiilleri daha ağır bir cezayı gerektirmediği takdirde beşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>17 nci maddeye aykırı olarak üye kaydedenler ile 19 uncu maddeye aykırı olarak üye kalmaya veya üyelikten ayrılmaya zorlayanlar, fiilleri daha ağır bir cezayı gerektirmediği takdirde her bir üyelik için yediyüz Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>26 ncı maddenin altıncı fıkrasına aykırı hareket edenler ile yedinci fıkrasına göre siyasi partilerin ad, amblem, rumuz veya işaretlerinin kullanılmasına karar veren veya kullananlar beşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>28 inci maddenin ikinci ve üçüncü fıkralarına aykırı hareket eden kuruluşların yetkili sorumluları binbeşyüz Türk Lirası, fiilin tekrarı hâlinde ise ayrıca bağış miktarı kadar,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bu Kanunda kanuni grev veya lokavt için belirtilen şartlar gerçekleşmeksizin alınan bir grev veya lokavt kararının uygulanması hâlinde; grev veya lokavta karar verenler, böyle bir grev veya lokavta karar verilmesine veya uygulanmasına veya bunlara katılmaya veya devama zorlayan veya teşvik edenler ile lokavta katılanlar ve devam edenler fiilleri daha ağır bir cezayı gerektirmediği takdirde beşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kanun dışı greve katılanlar ve devam edenler yediyüz Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kanuni bir grev veya lokavt kararının bu Kanunda yazılı usul ve esaslar dışında uygulanması hâlinde, bu kararı uygulayanlar, uygulanmasına veya devamına zorlayanlar veya teşvik edenler beşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Grev veya lokavtın mahkeme kararıyla sürekli veya geçici, tamamen veya kısmen yasaklanmasına rağmen, kararı kaldırmayanlar, uygulamaya devam edenler, devamına teşvik edenler, zorlayanlar, katılan ve katılmaya devam edenler fiilleri daha ağır bir cezayı gerektirmediği takdirde beşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Greve katıldıkları veya lokavta maruz kaldıkları hâlde, grev veya lokavtın uygulandığı işyerlerinden ayrılmayanlar ile işçileri bu eylemlere zorlayan veya teşvik edenler fiilleri daha ağır bir cezayı gerektirmediği takdirde yediyüz Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>65 inci maddede belirtilen izni almadan yeni işçi alan işveren, izinsiz aldığı her bir işçiyle ilgili olarak yediyüz Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>68 inci madde hükmüne aykırı olarak grev yapan işçilerin yerine işçi çalıştıran işveren veya işveren vekili, aldığı her bir işçiyle ilgili olarak binbeşyüz Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>İşçi sendikasının üyesi olmayan grev gözcüleri ile 73 üncü madde hükümlerine aykırı davranan grev gözcüleri binbeşyüz Türk Lirası,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>idari para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin birinci fıkrasının (a) ve (d) bentlerinde belirtilen fiilleri işleyenler, idari yaptırım kararının kesinleşmesinden itibaren beş yıl süreyle sendika organlarında görev alamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada öngörülen idari yaptırımlar, gerekçesi belirtilmek suretiyle Çalışma ve İş Kurumu İl Müdürünce verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="79" başlık="Görevli ve yetkili mahkeme">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasından doğan uyuşmazlıklar iş davalarına bakmakla görevli ve yetkili mahkemelerde görülür. Ancak yedinci ila on birinci bölümlerin uygulanmasından doğan uyuşmazlıklar için, görevli makamın bulunduğu yer mahkemesi yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="80" başlık="Diğer kanunların uygulanması">
      <mvz-fıkra no="1">
        <template>Kuruluşlar hakkında, bu Kanunda hüküm bulunmayan hâllerde 4721 sayılı Kanun ile 4/11/2004 tarihli ve 5253 sayılı Dernekler Kanununun bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplu iş sözleşmeleri hakkında, bu Kanunda hüküm olmayan hâllerde 4721 sayılı Kanun ve 11/1/2011 tarihli ve 6098 sayılı Türk Borçlar Kanunu ile iş sözleşmesini düzenleyen diğer kanunların bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda aksi öngörülmedikçe, bu Kanunun uygulanmasına ilişkin tebligat 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümlerine göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="81" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>5/5/1983 tarihli ve 2821 sayılı Sendikalar Kanunu, 5/5/1983 tarihli ve 2822 sayılı Toplu İş Sözleşmesi, Grev ve Lokavt Kanunu ve 30/1/1950 tarihli ve 5521 sayılı İş Mahkemeleri Kanununun 1 inci maddesinin ikinci fıkrasının (A) bendi yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Diğer mevzuatta 2821 ve 2822 sayılı kanunlara yapılan atıflar bu Kanuna yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="EK">
      <mvz-fıkra no="1">
        <template>İptal</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="EK">
      <mvz-fıkra no="1">
        <template>Hükümet, kamu işveren sendikaları ile işçi sendikaları konfederasyonları arasında;</template>
        <mvz-bent no="a">
          <template>10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununa ekli (I), (II), (III) ve (IV) sayılı cetvellerde yer alan kamu idareleri ile bunlara bağlı döner sermayeli kuruluşlar, kanunla kurulan fonlar ve kefalet sandıkları, özel kanunlarla kurulan diğer kamu kurum ve kuruluşları, hizmetlerini genel bütçenin transfer tertiplerinden yardım alarak yürüten kamu kurum ve kuruluşlarında,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu iktisadi teşebbüsleri ve bağlı ortaklıkları , birlikte ya da ayrı ayrı sermayesinin %50’sinden fazlası kamu kurum ve kuruluşlarına ait olan her türlü işletme ve şirketler, 24/11/1994 tarihli ve 4046 sayılı Özelleştirme Uygulamaları Hakkında Kanun çerçevesinde özelleştirme kapsamında veya programında bulunanlardan sermayesinin %50’sinden fazlası kamuya ait kuruluşlarda,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İl özel idareleri, belediyeler ve bunların üyesi olduğu mahalli idare birlikleri, belediyelerin bağlı kuruluşları, müessese ve işletmeleri ile bunların birlikte ya da ayrı ayrı sermayesinin %50’sinden fazlasına sahip oldukları şirketlerde,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>çalıştırılan işçilerin mali ve sosyal haklarını belirlemek üzere kamu toplu iş sözleşmeleri çerçeve anlaşma protokolü imzalanabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Kuruluşlar bu Kanun gereği yapmak zorunda oldukları tüzük değişikliklerini bu Kanunun yayımı tarihinden itibaren bir yıl içinde yönetim kurulu kararıyla gerçekleştirir. Tüzük değişiklikleri, yapılacak ilk genel kurulun onayına sunulur. Ancak, sendikalar faaliyet göstereceği işkolunu, bu Kanunun 4 üncü maddesinin üçüncü fıkrasında belirtilen yönetmeliğin yayımı tarihinden itibaren bir ay içerisinde yönetim kurulu kararıyla belirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bakanlık, 19 uncu maddede belirtilen yönetmeliğin yayımı tarihinden itibaren altı ay içinde kayıtlarında yer alan üye listelerini işçi sendikalarına gönderir. Sendikalar, varsa itirazlarını bir ay içinde Bakanlığa bildirir. Bakanlık, itirazları en geç bir ay içinde karara bağlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasına ilişkin düzenlemeler, bu Kanunun yayımı tarihinden itibaren bir yıl içinde yürürlüğe konulur. Bu düzenlemeler yürürlüğe girinceye kadar, mülga 2821 ve 2822 sayılı kanunlara dayanılarak yürürlüğe konulan düzenlemelerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>17 nci maddenin beşinci fıkrasında belirtilen sendika üyeliğinin kazanılması ve 19 uncu maddenin ikinci ve dördüncü fıkralarında belirtilen sendika üyeliğinden çekilme işlemlerinin e-Devlet kapısı üzerinden yapılması; bu Kanunun yürürlüğe girdiği tarihten itibaren birinci yılın sonuna kadar, mülga 2821 sayılı Kanunun 22 nci maddesinin üçüncü ve beşinci fıkraları ile 25 inci maddesinin ikinci fıkrası hükümlerine göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Kanunun yayımı tarihinde sendika yöneticisi olduğu için iş sözleşmesini feshetmiş olan yöneticiler hakkında 23 üncü maddenin ikinci ve üçüncü fıkra hükümleri uygulanır. Ancak 23 üncü maddenin ikinci fıkrasındaki nedenlerden biri ile görevi sona eren yöneticiler, bu tarihten itibaren bir ay içerisinde işverene başvurmak kaydıyla emsal ücret üzerinden kıdem tazminatına hak kazanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mülga 2822 sayılı Kanunun 12 nci maddesine göre Bakanlıkça yayımlanan 2009 Temmuz istatistiğinde kurulu bulunduğu işkolunda çalışan işçilerin en az yüzde onunu üyesi bulunduran işçi sendikaları ile 2009 Temmuz istatistiği sonrasında 15/9/2012 tarihine kadar kurulmuş işçi sendikalarının bu fıkrayı değiştiren maddenin yürürlüğe girdiği tarihten itibaren bir yıl içinde yapacakları yetki tespit başvuruları 41 inci maddede yer alan işyeri veya işletme çoğunluğu şartlarına göre sonuçlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun yürürlük tarihinden önce başlamış toplu iş sözleşmesi görüşmeleri ve toplu iş uyuşmazlıkları mülga 2822 sayılı Kanun ve bu Kanuna dayalı tüzük ve yönetmeliklere göre sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>5018 sayılı Kanuna ekli (I), (II), (III) ve (IV) sayılı cetvellerde yer alan kamu idareleri ile bunlara bağlı döner sermayeli kuruluşlar, 375 sayılı Kanun Hükmünde Kararnameye ekli (I) sayılı listede yer alan idareler ile birlikte veya ayrı ayrı sermayesinin yarısından fazlası il özel idareleri, belediyeler ve bağlı kuruluşlarına ait şirketler, anılan Kanun Hükmünde Kararnamenin geçici 23 üncü ve geçici 24 üncü maddeleri uyarınca sürekli işçi kadrolarına, geçici işçi pozisyonlarına veya işçi statüsüne geçirilen işçilerinden; geçişten önce işçinin çalıştığı alt işveren işyerinin girdiği işkolu mevcut işyerinin girdiği işkolu ile aynı olanları o işkolundaki mevcut işyerinden, farklı olanları ise geçişten önce işçinin çalıştığı alt işveren işyerinin girdiği işkolunda yeni tescil edilecek işyerlerinden Sosyal Güvenlik Kurumuna bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamındaki işyerlerinin her biri bu Kanunun uygulanması bakımından bağımsız bir işyeri sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkra kapsamında yeni tescil edilen işyerlerinden bildirilen işçiler, bu madde kapsamındaki idarelerde geçiş işleminden önce alt işveren işçileri için Yüksek Hakem Kurulu tarafından karara bağlanan ve en son sona erecek olan toplu iş sözleşmesinin sona ermesiyle birlikte 4 üncü maddeye uygun şekilde Sosyal Güvenlik Kurumuna bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddenin uygulanmasında bu Kanunun bu maddeye aykırı diğer hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="82" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="83" başlık="Yürütme">
