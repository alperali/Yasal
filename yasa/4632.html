  <mvz-künye tür="kanun" no="4632" başlık="BİREYSEL EMEKLİLİK TASARRUF VE YATIRIM SİSTEMİ KANUNU"
             tarih="28/3/2001" rgazete-tarih="7/4/2001" rgazete-sayı="24366"
             düstur-tertip="5" düstur-cilt="40" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, kamu sosyal güvenlik sisteminin tamamlayıcısı olarak, bireylerin emekliliğe yönelik tasarruflarının yatırıma yönlendirilmesi ile emeklilik döneminde ek bir gelir sağlanarak refah düzeylerinin yükseltilmesi, ekonomiye uzun vadeli kaynak yaratarak istihdamın artırılması ve ekonomik kalkınmaya katkıda bulunulmasını teminen, gönüllü katılıma dayalı ve belirlenmiş katkı esasına göre oluşturulan bireysel emeklilik sisteminin düzenlenmesi ve denetlenmesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun kapsamı, emeklilik şirketlerinin kuruluş, çalışma, yönetim ve denetimine, kişilerin sisteme katılma, ayrılma ve emeklilik koşullarına, emeklilik yatırım fonlarının kuruluşuna, katkıların bu fonlarda toplanmasına ve değerlendirilmesine, aracılık hizmetlerine, kamuya açıklanacak bilgilerin kapsamına ve bireysel emeklilikle ilgili diğer hususlara ilişkin esas ve usulleri düzenlemektir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda hüküm bulunmayan hallerde sermaye piyasası ve sigortacılık mevzuatının ilgili hükümleri ve genel hükümler uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen deyimlerden;</template>
        <mvz-bent no="a">
          <template>Bakanlık: Kurumun ilişkili olduğu Bakanlığı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kurum: Sigortacılık ve Özel Emeklilik Düzenleme ve Denetleme Kurumunu,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kurul: Sigortacılık ve Özel Emeklilik Düzenleme ve Denetleme Kurulunu,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Katılımcı: Emeklilik sözleşmesine göre ad ve hesabına şirket nezdinde bireysel emeklilik hesabı açılan gerçek kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Katkı payı: Emeklilik sözleşmesi hükümlerine göre ödenmesi gereken tutarı,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Şirket: Emeklilik şirketini,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Fon: Emeklilik yatırım fonunu,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Portföy yöneticisi: Sermaye Piyasası Kurulundan portföy yöneticiliği yetki belgesi almış ve Sermaye Piyasası Kurulunca uygun görülen portföy yönetim şirketini,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Saklayıcı: Emeklilik yatırım fonu portföyündeki varlıkların saklandığı ve Sermaye Piyasası Kurulunca uygun görülen saklama kuruluşunu,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Bireysel emeklilik hesabı : Emeklilik sözleşmesi çerçevesinde katılımcı ad ve hesabına ödenen katkılar ve bu katkılara ilişkin her türlü getirinin katılımcı bazında izlendiği hesabı,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Birikim : Bireysel emeklilik hesabındaki katkılar ile bunların getirilerinin toplamını,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Bireysel emeklilik aracıları: Emeklilik şirketlerinin emeklilik sözleşmelerine aracılık eden veya bunları emeklilik şirketi adına yapan kişileri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Bireysel Emeklilik Danışma Kurulu">
    <mvz-madde no="3" başlık="Yapısı ve görevleri">
      <mvz-fıkra no="1">
        <template>Bireysel emeklilik politikalarını belirlemek ve bunların gerçekleştirilmesi için alınması gerekli önlemler konusunda önerilerde bulunmak üzere Bireysel Emeklilik Danışma Kurulu kurulmuştur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bireysel Emeklilik Danışma Kurulunun sekretarya hizmetleri Kurum tarafından yürütülür. Bireysel Emeklilik Danışma Kurulunun çalışma esas ve usulleri Bireysel Emeklilik Danışma Kurulunun uygun görüşü alınarak Kurumca bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Emeklilik Sözleşmesi">
    <mvz-madde no="4" başlık="Emeklilik sistemine katılma ve emeklilik sözleşmesi">
      <mvz-fıkra no="1">
        <template>Sisteme katılmak için şirket ile emeklilik sözleşmesi akdedilir. Emeklilik sözleşmesi; şirket nezdinde bireysel emeklilik hesabı açılması, hesaba katkı payı ödenmesi, ödenen katkı paylarının tercih edilen fonlarda yatırıma yönlendirilmesi ve hesapta biriken paraların hak sahiplerine ödenmesine ilişkin esas ve usuller ile tarafların bu kapsamdaki diğer hak ve yükümlülüklerini düzenleyen sözleşmedir. Emeklilik sözleşmesi, katılımcı ile bireysel emeklilik sözleşmesi şeklinde veyahut bir istihdam ilişkisine dayalı olarak veya katılımcı adına bir kuruluş ile grup emeklilik sözleşmesi şeklinde yapılabilir. Emeklilik sözleşmesine ve emeklilik sözleşmesinde bulunacak hususlara ilişkin esas ve usuller Sermaye Piyasası Kurulunun görüşü alınarak Kurum tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Katılımcının ve şirketin hak ve yükümlülükleri">
      <mvz-fıkra no="1">
        <template>Emeklilik sözleşmesinde belirtilen esaslar dahilinde, şirket nezdinde katılımcı adına açılan bireysel emeklilik hesabına katkı yapılır.  Türkiye’de kanuni yerleşim yeri bulunmayan Türkiye Cumhuriyeti vatandaşları ve 29/5/2009 tarihli ve 5901 sayılı Türk Vatandaşlığı Kanununun 28 inci maddesi kapsamındaki kişiler tarafından yabancı para cinsinden katkı payı ödenebilir. Şirket, katkı paylarını, en geç şirkete intikalini takip eden ikinci iş gününde yatırıma yönlendirmek zorundadır. Katılımcı, emeklilik sözleşmesinde yer alan şartlar çerçevesinde, katkı payını birden fazla fon arasında paylaştırabilir. Katılımcı, bireysel emeklilik hesabındaki birikimlerinin başka bir emeklilik şirketine aktarılmasını talep edebilir. Aktarım talebinde bulunulması halinde şirket, bildirimin ulaşmasından itibaren en geç on iş günü içinde talebi yerine getirmekle ve birikimlerle birlikte hesaba ilişkin bilgi ve belgeleri aktarmakla yükümlüdür. Başka bir şirkete aktarım talebinde bulunulabilmesi için şirkette en az bir yıl süreyle kalınmış olması gereklidir. Kurum, bu süreyi üç yılı aşmamak üzere yeniden belirlemeye yetkilidir. Aktarıma, aktarım talebine ve şirkette kalınması gereken süreye ilişkin esas ve usuller Sermaye Piyasası Kurulunun görüşü alınarak Kurum tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddede öngörülen paylaştırma, aktarım ve yatırıma yönlendirme yükümlülüklerini belirlenen süreler içinde gereği gibi yerine getirmeyen şirket, fon birim pay fiyatı değişikliklerini dikkate alarak bu işlemden dolayı varsa katılımcının birikiminde oluşan parasal kaybı hesaplar ve katılımcının hesabına öder. Katılımcının hesabının bulunmadığı durumlarda ise ödeme doğrudan katılımcıya yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Grup emeklilik sözleşmesinin akdedilmesine taraf olan dernek, vakıf, tüzel kişiliği haiz bir meslek kuruluşu veya sair kuruluş yahut grup ile işverenler tarafından çalışanları veya üyeleri hesabına kısmen veya tamamen katkı payı ödenmesi halinde, bu katkılar ile getirileri bireysel emeklilik hesaplarında ayrı olarak takip edilir ve bu hesaplardaki birikimlere ilişkin hakların kullanımı ve yükümlülükler Kurumca belirlenen esas ve usûller çerçevesince grup emeklilik sözleşmesinde belirlenir. Katılımcının bu birikimlere hak kazanma süresi her halde katılımcının grup emeklilik sözleşmesine giriş tarihinden itibaren yedi yılı aşamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Emekli olma ve emeklilik seçenekleri">
      <mvz-fıkra no="1">
        <template>Katılımcı, sisteme giriş tarihinden itibaren en az on yıl sistemde bulunmak koşulu ile ellialtı yaşını tamamladıktan sonra emekli olmaya hak kazanır. Emekliliğe hak kazanan katılımcı, bireysel emeklilik hesabındaki birikimlerinin bir program dahilinde ödenmesini, tamamının defaten ödenmesini ya da yapacağı yıllık gelir sigortası sözleşmesi çerçevesinde kendisine maaş bağlanmasını talep edebilir. Katılımcının bu madde kapsamında birikimlerin ödenmesini talep etmesi veya başka bir şirket veya hayat sigorta şirketi ile yıllık gelir sigortası sözleşmesi yapması halinde şirket, katılımcının hesabındaki birikimleri bildirimin ulaşmasından itibaren en geç on iş günü içinde katılımcıya öder veya ilgili şirkete aktarır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yıllık gelir sigortası, toplu veya belirli süreler içinde yapılan katkılara göre sigortalının yaşaması halinde hemen veya belli bir süre sonra başlayan, sigortalıya veya lehdarlarına ömür boyu veya belirli süreler için yapılan düzenli ödemelerdir. Yıllık gelir sigortası sözleşmesine göre belirlenen emeklilik maaşı, aylık, üçer aylık, altı aylık veya yıllık olarak ödenebilir. Yıllık gelir sigortası sözleşmelerinde, yıllık gelir sigortası genel şartları çerçevesinde ilgili şirketin üstlenmiş olduğu rizikonun, tazminat yükümlülüğünün türü ve kapsamının, tarafların hak ve yükümlülüklerinin, ödeme dönemlerinin, sözleşme süresi ve sözleşmeyi sona erdiren hallerin ve ilgili diğer hususların belirtilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Emeklilik sözleşmesi süresi içinde, katılımcının vefat etmesi halinde lehdarı, malûliyet durumunun ortaya çıkması halinde ise katılımcı, bireysel emeklilik hesabındaki birikimlerin kendisine ödenmesini talep edebilir. Katılımcının emekliliğe hak kazanmadan sistemden ayrılma talebinde bulunması halinde şirket, bildirimin ulaşmasından itibaren yirmi iş günü içinde katılımcının birikimlerini tamamen öder.  Ancak Kurumca belirlenen hallerde ve koşullarda katılımcıya sistemden ayrılmadan, Devlet katkısı hesabındaki tutarlar hariç hesabındaki birikim tutarının yüzde ellisine kadar kısmen ödeme yapılabilir.  Bu durumda kısmen yapılan ödeme tutarının yüzde yirmibeşini aşmamak üzere Devlet katkısı hesabındaki tutardan da ödeme yapılabilir.  Bu fıkra kapsamında yapılacak işlemlere ilişkin, Devlet katkısına dair uygulamalar dahil olmak üzere, esas ve usuller Bakanlığın uygun görüşü alınarak Kurum tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddede öngörülen aktarma ve ödeme yükümlülüklerini belirlenen süreler içinde gereği gibi yerine getirmeyen şirket, fon birim pay fiyatı değişikliklerini dikkate alarak bu işlemden dolayı varsa katılımcının birikiminde oluşan parasal kaybı hesaplayarak katılımcının hesabına öder. Katılımcının hesabının bulunmadığı durumlarda ise ödeme katılımcının kendisine yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Emeklilik sözleşmesi veya yıllık gelir sigortası sözleşmesi hükümlerine göre, hak sahiplerine ödenmesi gereken tutar, ödemeyi gerektiren tarihten itibaren on yıl içinde hak sahipleri tarafından aranmamış ise, onuncu yılı takip eden yılbaşından itibaren altı ay içerisinde hak sahiplerinin adı, soyadı ve hak kazandıkları para miktarını gösterir şekilde tanzim edilecek bir cetvel ile Kurum emrine Türkiye Cumhuriyet Merkez Bankasına aktarılır. Türkiye Cumhuriyet Merkez Bankasına yatırılan bu paralar iki yıl içinde sahipleri tarafından aranmadığı takdirde Hazineye gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Emeklilik planlarına ilişkin uygulama esasları ile yıllık gelir sigortasına ilişkin tarife ve teknik esaslar serbestçe belirlenir. Kurul, gerekli gördüğü hallerde uygulama esasları ile tarife ve teknik esasları Kurumun onayına tâbi kılabilir. Bu madde kapsamında hak sahiplerinin bulunması için şirket ve Türkiye Cumhuriyet Merkez Bankası tarafından yapılması gereken araştırmalara, söz konusu tutarın on yıllık süre içerisinde şirketçe ve iki yıllık süre içerisinde Türkiye Cumhuriyet Merkez Bankasınca değerlendirilmesine ilişkin esas ve usûller Sermaye Piyasası Kurulunun uygun görüşü alınarak Kurum tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kurum, 5 inci madde ile bu maddede belirtilen işlem sürelerini, sunulan fonların içerdiği yatırım araçlarının vade yapısı ve fiyatlama sürelerini dikkate alarak altı aya kadar uzatmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Giriş aidatı, yönetim ve fon işletim giderleri">
      <mvz-fıkra no="1">
        <template>Şirket, katılımcının sisteme ilk kez katılması sırasında ve yeni bir bireysel emeklilik hesabı açtırması halinde giriş aidatı talep edebilir. Söz konusu giriş aidatları bireysel emeklilik hesabına ödenen katkılardan ayrı olarak azamî bir yıl içerisinde taksitler halinde de ödenebilir. Katkı payı, fon varlıkları veya fon gelirleri üzerinden yönetim gideri ve fon işletim masrafı kesintisi yapılabilir. Bireysel emeklilik hesaplarından yapılacak her türlü kesintilerin ve giriş aidatlarının emeklilik sözleşmesinde ve yapılacak ilan ve reklamlarda açık olarak belirtilmesi zorunludur. Giriş aidatı, yönetim ve fon işletim giderleri miktar ya da oranları ve bunlara ilişkin esas ve usuller Sermaye Piyasası Kurulunun uygun görüşü alınarak Kurum tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Emeklilik Şirketine İlişkin Düzenlemeler">
    <mvz-madde no="8" başlık="Kuruluş esasları ve kuruluş izni">
      <mvz-fıkra no="1">
        <template>Emeklilik şirketi, bu Kanuna göre kurulan ve bireysel emeklilik sisteminde faaliyet göstermek üzere bu Kanun ile ihdas edilen emeklilik branşında ruhsat almış şirketi ifade eder. Şirket, 21.12.1959 tarihli ve 7397 sayılı Sigorta Murakabe Kanunu hükümlerine göre hayat ve ferdi kaza sigortaları branşlarında da ruhsat alabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şirketin emeklilik branşı dışında başka bir branşta da faaliyet göstermesi halinde her bir branşa ait hesaplar ayrı tutulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Şirket kuruluş izni Kurul tarafından verilir. Kurulacak şirketin ticaret unvanında "emeklilik" ibaresinin bulunması zorunludur. Kuruluş izni için Kuruma başvuruda bulunulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurulacak şirketin;</template>
        <mvz-bent no="a">
          <template>Anonim şirket şeklinde kurulması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Faaliyet konusunun bu Kanunda belirtilen faaliyetlerle sınırlandırılmış olması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sermayesinin yirmi trilyon liradan az olmaması ve ödenmiş sermayesinin asgarî on trilyon olması ve kalanının üç yıl içerisinde ödenmesinin taahhüt edilmesi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hisse senetlerinin nakit karşılığı çıkarılması ve tamamının nama yazılı olması,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Ana sözleşmesinin bu Kanun hükümlerine uygun olması,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İş planı ve sistem tasarımı ile yapılabilirlik raporlarının sunulması,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kurucularının;</template>
          <mvz-altbent no="1">
            <template>Tasfiyeye tâbi tutulan bankerler, bankalar, sigorta şirketleri ile para ve sermaye piyasalarında faaliyet gösteren diğer kurumlarda doğrudan ve dolaylı yüzde on veya daha fazla bir oranda pay sahibi olmaması,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>İlgili mevzuat çerçevesinde faaliyetlerinin tamamen veya belirli faaliyet alanları itibariyle sürekli veya başvuru tarihinden önceki bir yıl içerisinde bir ay veya daha fazla süreyle geçici süreyle durdurulma kararı verilmemiş olması,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Müflis veya konkordato ilan etmiş olmaması, Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı beş yıl veya daha fazla süreyle hapis cezasına ya da devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar,  zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, bilişim sistemini engelleme, bozma, verileri yok etme veya değiştirme, banka veya kredi kartlarının kötüye kullanılması, suçtan kaynaklanan malvarlığı değerlerini aklama, terörün finansmanı, kaçakçılık, vergi kaçakçılığı veya haksız mal edinme suçlarından mahkûm olmaması,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Emeklilik şirketi olmanın gerektirdiği malî güç ve itibara sahip olması,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>gerekir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Sermayenin en az yüzde ellibirinin malî piyasalar konusunda yeterli bilgi ve tecrübeye sahip tüzel kişilere ait olması ve tüzel kişi kurucuların yönetim ve denetimine sahip gerçek kişilerin, bu maddenin dördüncü fıkrasının (g) bendinin (4) numaralı alt bendi hariç kurucularda aranan şartları taşımaları gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kuruluş izni için gerekli sermaye tutarı, Devlet İstatistik Enstitüsü Toptan Eşya Fiyat Endeksinin iki katının gerektirdiği miktar ve sınırları aşmamak üzere Kurum tarafından artırılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Faaliyet ruhsatı">
      <mvz-fıkra no="1">
        <template>Kuruluş izni alan şirketin faaliyete geçebilmesi için emeklilik branşında faaliyet ruhsatı alması zorunludur. Emeklilik branşı faaliyet ruhsatı Kurum tarafından verilir. Faaliyet ruhsatı almak üzere Kuruma yapılan başvurularda;</template>
        <mvz-bent no="a">
          <template>İki yıl içinde en az yüzbin katılımcıya hizmet verecek biçimde gerekli her türlü planlamanın yapılmış olması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İş planı ve sistem tasarımında öngörülen düzenlemelerin yapılmış olması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Fiziksel mekan, teknik ve idarî alt yapı ile insan kaynakları uyumunun sağlanmış olması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Şartları aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kuruluşa ilişkin verilen izin, izin tarihinden itibaren bir yıl içinde emeklilik branşı faaliyet ruhsatı almak üzere başvurunun yapılmamış veya gerekli belgelerin süresi içinde tamamlanmamış olması halinde kendiliğinden geçersiz olur. Emeklilik branşında faaliyet ruhsatı alan şirketin, ruhsatın veriliş tarihinden itibaren en geç üç ay içerisinde fon kurmak amacıyla Sermaye Piyasası Kuruluna başvurması gerekir. Şirketin fon kurma başvurusunun Sermaye Piyasası Kuruluna zamanında yapılmaması veya başvurusunun reddedilmesi halinde, verilmiş olan kuruluş izni ve faaliyet ruhsatı kendiliğinden geçersiz olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kuruluş izni ve faaliyet ruhsatı başvurularında istenecek bilgi ve belgeler ile diğer esas ve usuller Sermaye Piyasası Kurulunun uygun görüşü alınarak Kurumca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Emeklilik ile ilgili kavramların kullanımı, ilan, reklam ve açıklanacak bilgiler">
      <mvz-fıkra no="1">
        <template>Kanunla kurulmuş sosyal güvenlik kurumları, 17.7.1964 tarihli ve 506 sayılı Kanunun geçici 20 nci maddesi kapsamında kurulan sandıklar ve 13.7.1967 tarihli ve 903 sayılı Kanun ile değişik 743 sayılı Türk Kanunu Medenîsi hükümleri kapsamında kurulan vakıflar hariç olmak üzere, bu Kanun kapsamında bulunmayan gerçek ve tüzel kişiler bu Kanunda düzenlenen faaliyetlerde bulundukları izlenimini verecek şekilde "Emeklilik", "Emeklilik Planı", "Emeklilik Fonu" ve "Emeklilik Yatırım Fonu" gibi kavramları veya aynı işlevi gören ifadeleri kullanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şirket ve bireysel emeklilik aracıları, katılımcılara, üçüncü kişilere ve kuruluşlara karşı gerçeğe aykırı, yanıltıcı ve aldatıcı beyanda bulunamazlar ve ilan, reklam ve broşürleri ile bu amaca yönelik her türlü faaliyetlerinde bu nitelikteki ifadelere yer veremezler. Bireysel emeklilik sisteminde katılımcılara veya kamuya açıklanacak bilgiler, açıklanma dönemleri ve süreleri ile ilan ve reklamlara ilişkin esas ve usuller Sermaye Piyasası Kurulunun uygun görüşü alınarak Kurumca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Şirketin sorumlulukları ve bireysel emeklilik aracıları">
      <mvz-fıkra no="1">
        <template>Şirket;</template>
        <mvz-bent no="a">
          <template>Emeklilik sözleşmelerine ilişkin Kurumun belirleyeceği esaslara göre bankalardan hizmet almakla,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Emeklilik sözleşmesi çerçevesinde tahsil edilen katkıların fona yönlendirilmesini sağlamak ve bireysel emeklilik hesaplarının ve ilgili diğer kayıtların güncelleştirilmesi işlemlerini gerçekleştirmekle,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Portföy yöneticilerinin, şirketin genel fon yönetim stratejisine ve kararlarına göre fon portföyünü yönetmesini sağlamakla,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Katılımcılarının bireysel emeklilik hesaplarına ait günlük bilgilere erişimine olanak sağlamakla,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Fon portföyünde yer alan varlıklar, fonun performansı, malî tabloları gibi konularda katılımcılara düzenli bilgi verilmesini sağlamakla,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kurum ve Sermaye Piyasası Kurulu tarafından istenecek bilgi, belge ve tablolar ile bireysel emeklilik kayıt sisteminin belirlenecek esas ve usullere göre hazırlanmasını sağlamakla,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kurumun belirleyeceği esas ve usuller çerçevesinde şirketin, Sermaye Piyasası Kurulunun belirleyeceği esas ve usuller çerçevesinde de fonun iç denetimini sağlamakla,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Bireysel emeklilik hesaplarının ve emeklilik faaliyetlerinin sürekliliğini ve fon varlıklarının korunmasını sağlamak üzere, kayıtların ve varlıkların saklanması konusunda gerekli tedbirleri almakla,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Katılımcıların hak ve menfaatleri ile bireysel emeklilik sisteminin işleyişini tehlikeye sokabilecek hareketlerden kaçınmakla, mevzuat ve işletme planı esaslarına uygun faaliyette bulunmakla, uygun tavsiyede bulunmakla, iyiniyet kurallarına uygun hareket etmekle ve bireysel emeklilik aracılarının bu esaslara uygun hareket etmesini sağlayacak tedbirleri almakla,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bireysel emeklilik aracıları, Kurumca belirlenen esaslar dahilinde emeklilik gözetim merkezince tutulan Bireysel Emeklilik Aracıları Siciline kaydolmak zorundadır. Bireysel emeklilik aracılarında aranacak nitelik ve şartlara, faaliyetlerine, yapamayacakları işlere, sicile kaydetme ve silmeye ve diğer hususlara ilişkin esas ve usuller Kurumca düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bireysel emeklilik aracıları;</template>
        <mvz-bent no="a">
          <template>Mesleğin icaplarına, iyiniyet kurallarına ve mevzuata uygun faaliyette bulunmakla,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Katılımcıların hak ve menfaatleri ile bireysel emeklilik sisteminin işleyişini tehlikeye sokabilecek hareketlerden kaçınmakla,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Katılımcının yaşı ve beklentilerine göre, sistemin uzun vadeli yapısını ve vergi düzenlemelerini de göz önünde bulundurarak katılımcıya uygun tavsiyede bulunmakla,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Meslekî yeterliliğe ilişkin tamamlayıcı eğitim programına katılmakla,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurumca, bu madde hükmüne aykırı hareket ettiği belirlenen bireysel emeklilik aracısının işlenen fiilin ağırlığına göre satış yetkisi geçici süreyle durdurulur yahut lisansı iptal edilir. Aracılarda aranan nitelik ve şartları kaybeden bireysel emeklilik aracılarının lisansları Kurumca iptal edilir. Lisansı iptal edilen aracıların kayıtları Bireysel Emeklilik Aracıları Sicilinden silinir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Şirketin teşkilât ve organları">
      <mvz-fıkra no="1">
        <template>Şirketin yönetim kurulu beş kişiden az olamaz. Şirket genel müdürü ve yokluğunda vekili yönetim kurulunun doğal üyesidir. Yönetim kurulu üyelerinin salt çoğunluğunun bu maddede genel müdür için öngörülen meslekî deneyim süresi hariç diğer şartları haiz olması gerekir. Denetim kurulu üyelerinin, genel müdürün, genel müdür yardımcılarının ve başka unvanlarla istihdam edilseler dahi yetki ve görevleri itibariyle genel müdür yardımcısına denk veya daha üst konumlarda imza yetkisini haiz diğer yöneticilerin, bu maddenin üçüncü fıkrasında öngörülen şartları haiz olmaları, en az lisans düzeyinde öğrenim görmüş olmaları ve sigortacılık veya işletmecilik alanında meslekî deneyime sahip olmaları şarttır. Asgarî meslekî deneyim süresi, genel müdür için on yıl, genel müdür yardımcıları ve başka unvanlarla istihdam edilseler dahi yetki ve görevleri itibariyle genel müdür yardımcısına denk veya daha üst konumlarda imza yetkisini haiz diğer yöneticiler için yedi yıldır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel müdür ve genel müdür yardımcısı olarak atanacakların, bu maddede aranan şartları taşıdıklarını gösteren belgelerle birlikte Kuruma bildirilmesi gerekir. Bunların atanmaları, bildirimin alındığı tarihten itibaren on iş günü içerisinde Kurumca olumsuz görüş bildirilmediği takdirde yapılabilir. Herhangi bir nedenle görevden ayrılan genel müdür ve genel müdür yardımcılarının, görevden ayrılma nedenleri şirket ve görevden ayrılan tarafından, ayrılış tarihinden itibaren on iş günü içerisinde Kuruma bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanun hükümlerine aykırı hareketlerinden dolayı hapis veya bir defadan fazla ağır para cezası ile cezalandırılanlar ile durumları bu Kanunun 8 inci maddesinin dördüncü fıkrasının (g) bendinin 4 numaralı alt bendi hariç olmak üzere (g) bendine uymayanlar, hiç bir şirkette yönetim kurulu üyesi, denetim kurulu üyesi, genel müdür, genel müdür yardımcısı veya birinci derecede imza yetkisini haiz görevli olarak çalıştırılamazlar. Şirket, bu gibi kişilerin imza yetkilerini derhal kaldırmak zorundadır. Yapılan denetlemeler sonucunda, bu Kanun veya ilgili diğer mevzuat hükümlerini ihlal ettikleri ve şirketin emin bir şekilde çalışmasını tehlikeye düşürdükleri tespit edilen şirket yöneticileri ve görevlilerinin, haklarında kanunî kovuşturma istenmesini müteakip Kurumun talebi üzerine geçici olarak imza yetkilerinin kaldırılması zorunludur. Bu kimseler Kurumun izni olmadıkça imza yetkisini haiz personel olarak hiç bir şirkette çalıştırılamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Anasözleşme değişiklikleri, hisse ve malvarlıklarının devri ve şirket birleşmeleri">
      <mvz-fıkra no="1">
        <template>Şirketlerin anasözleşmelerinin değiştirilmesinde Kurumun uygun görüşü aranır. Kurumca uygun görülmeyen değişiklik tasarıları genel kurulda görüşülemez. Sicil memuru, Kurumun uygun görüşü olmaksızın anasözleşme değişikliklerini Ticaret Siciline tescil edemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir gerçek veya tüzel kişinin, şirketin sermayesinin doğrudan veya dolaylı olarak yüzde on veya fazlasını temsil eden payları edinmesi ile bir ortağa ait payların şirket sermayesinin yüzde onunu, yüzde yirmisini, yüzde otuzüçünü ya da yüzde ellisini aşması sonucunu doğuran hisse edinimleri ile bir ortağa ait payların söz konusu oranların altına düşmesi sonucunu doğuran hisse devirleri Kurumun iznine tâbidir. Oy hakkı edinilmesi ile hisselerin rehnedilmesinde de bu hüküm uygulanır. Yönetim ve denetim kurullarına üye belirleme imtiyazı veren veya intifa hakkı tanınan hisse senetlerinin devri, yukarıdaki oransal sınırlara bakılmaksızın Kurumun iznine tâbidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Şirketin tüm aktif ve pasiflerini diğer bir emeklilik şirketine devretmesi ya da bir veya birkaç emeklilik şirketi ile birleşmesi Kurumun iznine tâbidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Şirket sermayesinin yüzde on ve daha fazlasına sahip olan tüzel kişilerin sermayesinin doğrudan veya dolaylı olarak bu maddenin ikinci fıkrasında belirtilen oranlar veya esaslar dahilinde el değiştirmesi Kurumun iznine tâbidir. İzin devralan ortağın kurucularda aranan şartları taşıması kaydıyla verilebilir. Bu fıkra hükmü tüzel kişi ortağın yönetim ve denetimini belirleyen sermaye paylarının bir başka tüzel kişiye ait olması halinde, gerçek kişi ortak ya da ortaklara ulaşıncaya kadar uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu madde hükümlerine aykırı olarak yapılan tescil işlemleri hükümsüzdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Şirkette hisse edinilmesine ve devrine, şirketin malvarlıklarının devrine, şirket ortaklarının bu Kanunda aranan nitelikleri kaybetmeleri halinde temettü hakkı hariç ortağa ait hakların kullanımına, dolaylı pay sahipliğine, şirketlerin birleşmesine ve diğer hususlara ilişkin esas ve usuller Sermaye Piyasası Kurulunun uygun görüşü alınarak Kurumca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Malî bünyenin güçlendirilmesi ve şirket uygulamalarının iyileştirilmesi">
      <mvz-fıkra no="1">
        <template>Şirketin, katılımcıların hak ve menfaatlerini tehlikeye sokabilecek uygulamalar yaptığının, sözleşmelerden doğan yükümlülüklerini yerine getiremediğinin veya malî bünyesinin katılımcıların hak ve menfaatlerini tehlikeye düşürecek düzeyde zayıflamakta olduğunun tespiti hallerinde Kurul, şirketin yönetim kurulundan;</template>
        <mvz-bent no="a">
          <template>Şirketin iş süreçlerinin, teknik altyapısının ve uygulamalarının iyileştirilmesine yönelik gerekli tedbirlerin alınmasını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sermayenin artırılmasını, ödenmemiş kısmının ödenmesini, sermayeye mahsuben ödeme yapılması için ortaklara çağrıda bulunulmasını veya kâr dağıtımının durdurulmasını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İştiraklerin ve sabit değerlerin kısmen veya tamamen elden çıkarılmasını veya elden çıkarılmasının durdurulmasını, yeni iştirak ve sabit değerler edinilmemesini,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Serbest varlıkların gösterilecek bir bankada bloke edilmesini ve bu varlıklar üzerinde izinsiz tasarruf edilmemesini,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Şirketin malî bünyesini düzeltmeye yönelik diğer tedbirlerin alınmasını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>isteyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şirket, alınması talep edilen tedbirlerin bildiriminden itibaren on iş günü içerisinde iyileştirme planını hazırlayıp Kuruma göndermek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İyileştirme planında öngörülen önlemlerin zamanında alınmaması veya bu tedbirlerin uygulanmasına rağmen bu maddenin birinci fıkrasında belirlenen hususların devam etmesi ya da şirketin malî bünyesindeki zayıflamanın bu maddenin birinci fıkrasında yer alan safhaların uygulanması durumunda dahi şirketin malî durumunun düzeltilmesine imkân bulunmadığının tespit edilmesi hallerinde Kurul, şirketin;</template>
        <mvz-bent no="a">
          <template>Yeni sözleşme akdetme ve temdit yetkisini kaldırmaya,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yönetim kurulu üyelerinin tamamını veya bir kısmını görevden alarak veya üye sayısını artırarak yönetim kuruluna üye atamaya,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Fonları ve varsa diğer branşlara ait portföylerini belirlenecek esaslar dahilinde diğer şirketlere devretmeye,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Faaliyet ruhsatlarını iptal etmeye,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İflasını istemeye,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Gerekli görülen diğer tedbirleri almaya,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Emeklilik Yatırım Fonuna İlişkin Düzenlemeler">
    <mvz-madde no="15" başlık="Emeklilik yatırım fonu ve fon içtüzüğü">
      <mvz-fıkra no="1">
        <template>Fon, şirket tarafından emeklilik sözleşmesi çerçevesinde alınan ve katılımcılar adına bireysel emeklilik hesaplarında izlenen katkıların, riskin dağıtılması ve inançlı mülkiyet esaslarına göre işletilmesi amacıyla oluşturulan malvarlığıdır. Fonun tüzel kişiliği yoktur. Fon, bu Kanunda yer alan amaçlar dışında kullanılamaz ve kurulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şirketin, fon içtüzüğü, emeklilik sözleşmesi ve Sermaye Piyasası Kurulunca belirlenecek diğer belgelerle birlikte, fon kurmak üzere Sermaye Piyasası Kuruluna başvurması zorunludur. Kuruluş izni almak üzere yapılacak başvurularda istenilecek şartlara ilişkin esas ve usuller Kurumun uygun görüşü alınarak Sermaye Piyasası Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Fon içtüzüğü, katılımcı ile şirket, saklayıcı ve portföy yöneticisi arasında fon portföyünün inançlı mülkiyet esaslarına göre saklanmasını ve vekalet akdi hükümlerine göre yönetimini konu alan ve genel işlem şartlarını içeren iltihaki bir sözleşmedir.  Sermaye Piyasası Kurulu tarafından uygun görülen fon içtüzüğü, izin belgesi tarihini takip eden altı iş günü içinde şirketin merkezinin bulunduğu yerin ticaret siciline tescil edilir ve Türkiye Ticaret Sicili Gazetesinde ilan olunur. Fon içtüzüğüne yönelik esas ve usuller Kurumun uygun görüşü alınarak Sermaye Piyasası Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Fonun faaliyete geçmesine ilişkin esaslar">
      <mvz-fıkra no="1">
        <template>Şirket, fon kuruluş izni tarihinden itibaren en geç altı ay içerisinde Sermaye Piyasası Kurulu tarafından belirlenen belgelerle birlikte katılma belgelerinin kayda alınması talebiyle Sermaye Piyasası Kuruluna başvurmak zorundadır. Bu süre içerisinde Sermaye Piyasası Kuruluna başvuru yapılmaması halinde, fon içtüzüğü şirket tarafından ticaret sicilinden terkin ettirilir ve buna ilişkin belgeler terkini takip eden altı iş günü içerisinde Sermaye Piyasası Kuruluna gönderilir. Fonun kayda alınma başvurusunun Sermaye Piyasası Kurulunca değerlendirilebilmesi için;</template>
        <mvz-bent no="a">
          <template>Fon içtüzüğünün şirketin merkezinin bulunduğu yerin ticaret siciline tescil ve Türkiye Ticaret Sicili Gazetesinde ilan edilmiş olması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yeterli mekân, teknik donanım ve örgütlenmenin sağlanmış, fon hizmet biriminin ve fon kurulunun oluşturulmuş, iç denetim sisteminin kurulmuş, personelin buna uygun görev ve sorumluluklarının belirlenmiş olması ve bu konularda gerekli belgelerin hazırlanmış olması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Muhasebe kayıt ve belge sistemi ile düzenli iş akışı ve haberleşmeyi sağlayacak teknik alt yapının kurulmuş olması,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Fonlara ilişkin insan kaynaklarının belirlenmiş olması,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>En az bir portföy yöneticisi ile portföy yönetim sözleşmesinin imzalanmış olması,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Şirketin bu Kanunda öngörülen kuruluş şartlarını kaybetmemiş olması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sermaye Piyasası Kurulunca yapılacak değerlendirme sonucu uygun görülen ve fon içtüzüğünde yer alan, kurulacak olan asgari üç fonun her biri için ayrı ayrı olmak üzere, şirketin ödenmiş sermayesinin asgari yirmide biri tutarındaki fon miktarına karşılık gelen pay sayısı Sermaye Piyasası Kurulu kaydına alınır ve fon portföyleri öncelikle bu paylara karşılık gelen tutar ile oluşturulur. Katılımcılardan toplanan katkılar karşılığında verilecek payların fon içtüzüğünde öngörülen tutara karşılık gelen payları aşması halinde, yeni pay sayısının artırılması ve artırılan payların Sermaye Piyasası Kurulu kaydına alınması talebiyle Sermaye Piyasası Kuruluna başvurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sermaye Piyasası Kurulu tarafından, Kurumun uygun görüşü alınmak kaydıyla, üçer aylık dönemlerin son iş günü itibarıyla fon net varlık değerinin yüzbinde beşini aşmamak üzere kayda alma ücreti alınır ve üçer aylık dönemleri izleyen on iş günü içinde tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Şirkete ve katılımcılara ait fondaki pay adedi, fon miktarı, fonun faaliyet ilke ve esasları, örgüt yapısı, muhasebe, belge ve kayıt düzeni, katılımcıların bilgilendirilmesi ve bunlara ilişkin esas ve usuller Kurumun uygun görüşü alınarak Sermaye Piyasası Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Fonun malvarlığına, fon portföyüne ve fon varlıklarının saklanmasına ilişkin ilkeler">
      <mvz-fıkra no="1">
        <template>Fonun malvarlığı, şirketin bu Kanundan, 28.7.1981 tarihli ve 2499 sayılı Sermaye Piyasası Kanunundan, emeklilik sözleşmesinden, fon içtüzüğünden ve ilgili mevzuattan doğan yükümlülüklerini yerine getirmesi ve sorumluluğunu karşılaması dışında hiçbir amaçla kullanılamaz.  Fon malvarlığı rehnedilemez, portföye ilişkin olarak yapılan işlemler haricinde teminat gösterilemez, üçüncü şahıslar tarafından haczettirilemez ve iflas masasına dahil edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bireysel emeklilik hesabındaki fon paylarından, katılımcının sistemde bulunduğu ay sayısı ile asgarî ücret tutarının çarpımına karşılık gelen birikim tutarı ve bu Kanunun 6 ncı maddesi kapsamında bireysel emeklilik sisteminden emekli olanlara yapılan yıllık gelir sigortası ödemelerinin aylık ödemeye isabet eden miktarının nafaka borçları hariç olmak üzere asgarî ücret tutarına kadar olan kısmı haczedilemez, rehnedilemez, iflas masasına dahil edilemez. Bu fıkradaki hükümlerin uygulanmasında rehin, haciz veya iflas tarihinde geçerli brüt asgarî ücret tutarı esas alınır.  11/1/2011 tarihli ve 6098 sayılı Türk Borçlar Kanununun ilgili hükümlerine göre bireysel emeklilik sözleşmelerinin yahut bu sözleşmelerden kaynaklı alacağın devredilmesi durumunda, 5 inci ve 6 ncı maddelerde belirtilen hakların kullanımı ile söz konusu uygulamaya ilişkin diğer esas ve usuller Kurum tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Şirket, Sermaye Piyasası Kurulu tarafından belirlenen türlerden olmak üzere para ve sermaye piyasası araçlarından, kıymetli madenlerden veya Sermaye Piyasası Kurulu tarafından belirlenen diğer yatırım araçlarından oluşan farklı portföy yapılarına sahip en az üç fon kurmak zorundadır. Fon kuruluşuna, şirketlerin katılımcılarına diğer şirketlerin fonlarını sunmasına ve fon portföy sınırlamalarına ilişkin ilkeler ile fon portföyündeki varlıkların değerlendirilmesine ilişkin esas ve usuller Kurumun uygun görüşü alınarak Sermaye Piyasası Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sermaye Piyasası Kurulu, fon payı alım satımının Türkiye Cumhuriyet Merkez Bankası tarafından günlük alım satım kurları ilan edilen yabancı paralar üzerinden yapılmasına izin verebilir. Bu kapsamda yapılacak izin başvurularının değerlendirilmesinde Kurumun ve Türkiye Cumhuriyet Merkez Bankasının görüşü alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Fon portföyündeki varlıklar saklayıcı nezdinde saklanır. Katılımcıların sahip oldukları ve fondaki katkılarını gösteren pay adedi de, saklayıcı nezdinde katılımcı bazında ve katılımcıların erişebileceği şekilde izlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Fon portföyünün yönetimi">
      <mvz-fıkra no="1">
        <template>Fon portföyü, portföy yöneticileri tarafından yönetilir. Portföy yöneticileri, portföyü bu Kanun, 2499 sayılı Sermaye Piyasası Kanunu, fon içtüzüğü, emeklilik sözleşmesi ve ilgili mevzuat hükümlerine göre yönetmekle yükümlüdür. Alınacak portföy yönetim hizmetine ilişkin esaslar bu konuda şirket ve portföy yöneticileri arasında yapılacak portföy yönetim sözleşmesi ile belirlenir.  Portföy yönetim sözleşmelerinin Sermaye Piyasası Kurulunca belirlenen asgarî unsurlara uygun olması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şirket, portföy yöneticilerinin, fon yönetiminde gerekli özen ve basireti göstermemeleri, Sermaye Piyasası Kurulunun portföy yöneticiliğine ilişkin ilkelerine aykırı hareket etmeleri, malî bünyelerinin zayıfladığının tespit edilmesi gibi durumlarda, portföy yönetim sözleşmesini feshedip, Sermaye Piyasası Kurulunca uygun görülen başka portföy yöneticileri ile portföy yönetim sözleşmesi imzalayabilir. Yukarıdaki koşulların varlığı halinde Sermaye Piyasası Kurulu da portföy yöneticilerinin değişmesini isteyebilir. Portföy yönetim sözleşmesine ilişkin esas ve usuller Kurumun uygun görüşü alınarak Sermaye Piyasası Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Fonların birleştirilmesi ve devri">
      <mvz-fıkra no="1">
        <template>Aynı şirkete ait fonlar, şirketin talebi üzerine veya re’sen Sermaye Piyasası Kurulu tarafından birleştirilebilir. Fon, ancak başka bir emeklilik yatırım fonu ile birleştirilebilir. Söz konusu birleştirmelere yönelik esas ve usuller Kurumun uygun görüşü alınarak Sermaye Piyasası Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Fon süresiz olarak kurulur. Sermaye Piyasası Kurulu;</template>
        <mvz-bent no="a">
          <template>Şirketin bir yıl öncesinden fesih ihbarında bulunması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Şirketin fon kurmaya ilişkin şartlarını kaybetmesi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Şirketin malî bünyesinin zayıflaması nedeniyle bu Kanunun 14 üncü maddesi kapsamına alınması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Hallerinde, fon malvarlığını bir başka şirkete Kurumun uygun görüşünü alarak devredebilir. Devir işlemlerine ilişkin esas ve usuller Kurumun uygun görüşü alınarak Sermaye Piyasası Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Denetim ve Bağımsız Dış Denetim">
    <mvz-madde no="20" başlık="Denetim">
      <mvz-fıkra no="1" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şirketin bu Kanun çerçevesinde yürütülen emeklilik faaliyetleri ile sigortacılık faaliyetleri Kurumun denetimine tâbidir. Şirketin fonlarına, portföy yöneticilerine ve saklayıcılara ilişkin hesap ve işlemleri ise Sermaye Piyasası Kurulunun denetimine tâbidir. Denetimlere ilişkin raporlar, konularına göre Kurum veya Sermaye Piyasası Kurulu tarafından değerlendirilir ve sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20/A" başlık="Emeklilik gözetim merkezi">
      <mvz-fıkra no="1">
        <template>Kurum, bireysel emeklilik sisteminin güvenli ve etkin biçimde işletilmesini sağlamak, katılımcıların hak ve menfaatlerini korumak amacıyla şirketlerin ve bireysel emeklilik aracılarının faaliyetlerinin gözetim ve denetimine yönelik alt yapı oluşturulmasına, portföy yönetim şirketlerinin emeklilik yatırım fonlarına ilişkin faaliyetlerinin Sermaye Piyasası Kurulunca gözetimine yönelik altyapı oluşturularak raporlama yapılmasına, bireysel emeklilik hesaplarına, emeklilik planlarına, işlemlerin konsolidasyonuna, katılımcılara ait bilgilerin saklanmasına, kamunun ve katılımcıların bilgilendirilmesine, istatistik üretimine, bireysel emeklilik aracıları siciline ve bireysel emeklilik aracıları sınavına ilişkin işlemlerin yapılması ile hayat sigortaları ve diğer sigorta branşlarına ilişkin verilebilecek diğer görevleri yerine getirmek üzere özel hukuk hükümlerine göre kurulmuş bir tüzel kişiyi emeklilik gözetim merkezi olarak görevlendirebilir. Emeklilik gözetim merkezinin ana sözleşmesinde yer alması gereken hususlar Kurumca belirlenir ve bu ana sözleşmede yapılacak değişikliklerde Kurumun uygun görüşü aranır. Emeklilik şirketleri, Kurumun uygun görmesi halinde hayat branşında faaliyet gösteren sigorta şirketleri ile diğer kurum ve kuruluşlar emeklilik gözetim merkezine ortak olabilir. Emeklilik gözetim merkezi, Kurumun denetimine tâbidir. Bu Kanun kapsamındaki şirket, kurum, kuruluş ve kişiler, bu Kanuna istinaden verilen görevlerin yerine getirilmesini teminen talep edilen bilgi ve belgeleri emeklilik gözetim merkezine aktarır. Emeklilik gözetim merkezinin çalışma esas ve usûlleri Kurum tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Bağımsız dış denetim">
      <mvz-fıkra no="1">
        <template>Şirketin yıl sonu malî tablolarının bağımsız denetim kuruluşları tarafından denetlenmesi zorunludur. Fonların hesap ve işlemleri ayrıca yılda en az bir defa bağımsız dış denetime tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Ceza Hükümleri">
    <mvz-madde no="22" başlık="İdarî yaptırımlar">
      <mvz-fıkra no="1">
        <template>Konularına göre Kurum veya Sermaye Piyasası Kurulu kararıyla ve gerekçesi belirtilmek suretiyle bu Kanuna tâbi gerçek ve tüzel kişilere, bu Kanunun;</template>
        <mvz-bent no="a">
          <template>4 üncü maddesi hükümlerine aykırı emeklilik sözleşmesi düzenlenmesi halinde üçbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>5 inci maddesinde öngörülen aktarma yükümlülüğüne aykırılık halinde ikibin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>5 inci maddesinde öngörülen paylaştırma ve yatırıma yönlendirme yükümlülüğüne aykırılık halinde ikibin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>6 ncı maddesinde öngörülen ödeme veya aktarma yükümlülüğüne aykırılık halinde ikibin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>6 ncı maddesinin son fıkrasında öngörülen tasdik yükümlülüğünün yerine getirilmeden sözleşmelerin uygulamaya konulması halinde üçbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>7 nci maddesinde öngörülen katılımcı tarafından ödenecek giderler veya ücretler konusunda bilgilendirme yükümlülüğüne aykırılık halinde ikibin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>10 uncu maddesinin birinci fıkrası hükümlerine aykırı olarak belirtilen kavramların kullanılması halinde yedibinbeşyüz Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>10 uncu maddesinin ikinci fıkrası hükümlerine aykırı olarak ilan ve reklam faaliyetinde bulunulması halinde onbeşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>10 uncu maddesinin ikinci fıkrasında öngörülen katılımcılara bilgi verilmesi yükümlülüğüne aykırılık halinde ikibin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>11 inci maddesinin birinci ve üçüncü fıkralarında öngörülen sorumlulukların yerine getirilmemesi halinde üçbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>11 inci maddesinin ikinci fıkrası hükümlerine aykırı olarak aracılık faaliyetinde bulunulması veya aracılık hizmeti sağlanması hallerinde altıbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>12 nci maddesinin birinci fıkrası hükümlerine aykırı olarak belirtilen nitelikleri haiz olmayan kişilerin çalıştırılması halinde onbeşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>12 nci maddesinin ikinci fıkrasında öngörülen bildirim yükümlülüğünün yerine getirilmemesi halinde üçbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>12 nci maddesinin üçüncü fıkrası hükümlerine aykırı olarak belirtilen kişilerin yasaklanan görevlerde çalıştırılması halinde onbeşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>13 üncü maddesinin birinci fıkrası hükümlerine aykırı olarak anasözleşme değişikliklerinin tescil edilmesi halinde onbeşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>13 üncü maddesinin üçüncü fıkrası hükümlerine aykırı olarak malvarlıklarının devri veya bir başka şirketle birleşilmesi halinde onbeşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="r">
          <template>21 inci maddesinde öngörülen bağımsız dış denetim yükümlülüğünün yerine getirilmemesi halinde onbeşbin Türk Lirası,</template>
        </mvz-bent>
        <mvz-bent no="s">
          <template>Bakanlık, Kurum ve Sermaye Piyasası Kurulu tarafından alınan kararlara, çıkarılan yönetmelik ve tebliğler ile yapılan diğer düzenlemelere uyulmaması halinde, yukarıdaki fıkralarda, sigortacılık mevzuatı ve sermaye piyasası mevzuatında öngörülmüş bir cezanın olmadığı hallerde ikibin Türk Lirası,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıda belirtilen idarî para cezalarının uygulanmasından önce ilgili kuruluş veya kişilerin savunmaları alınır. Savunma istendiğine ilişkin yazının tebliğ tarihinden itibaren bir ay içinde savunma verilmemesi halinde savunma hakkından feragat edildiği kabul edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İdarî para cezalarının verilmesini gerektiren fiillerin tekrarı halinde, verilen para cezası iki katı, izleyen tekrarlarda üç katı artırılarak uygulanır. Bu cezaların verildiği tarihten itibaren iki yıl içinde idarî para cezasının verilmesini gerektiren aynı fiil işlenmediği takdirde önceki cezalar tekrarda esas alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun 23 üncü maddesinin birinci fıkrasında öngörülen suçu işleyenler hakkında kanunî kovuşturmaya geçilmekle birlikte, gecikmesinde sakınca bulunan hallerde Kurumun talebi üzerine valiliklerce bunların işyerleri geçici olarak kapatılır; ilan ve reklamları durdurulur ya da toplatılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Ceza sorumluluğu">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre gereken izinleri almaksızın emeklilik faaliyetinde bulunan veya ticaret unvanları ve her türlü belgeleri ve ilan ve reklamları ve kamuoyuna yaptıkları açıklamalarda bu Kanunda belirtilen kuruluşların adını kullanan ya da 10 uncu madde hükümlerine aykırı olarak bu Kanunda düzenlenen faaliyetlerde bulundukları izlenimini yaratacak söz ve deyimleri kullanan gerçek kişiler ile tüzel kişilerin görevlileri üç yıldan beş yıla kadar hapis ve üçyüz günden ikibin güne kadar adlî para cezası ile cezalandırılır. Ayrıca idarî tedbir olarak bu faaliyetlerin yürütülmesine mani olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şirketin yönetim kurulu başkanı ve üyeleri ile imza yetkisini haiz mensupları, portföy yönetim şirketinin yönetim kurulu başkanı ve üyeleri ile imza yetkisini haiz mensupları, görevleri dolayısıyla kendilerine tevdi olunan veya muhafazaları, denetimleri ve sorumlulukları altında bulunan şirkete ait para veya diğer varlıkları zimmetine geçirirlerse, Türk Ceza Kanununun, zimmet suçuna ilişkin hükümlerine göre verilecek ceza beşte bir oranında artırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda gösterilen yetkili mercilerin ve denetim görevlilerinin istedikleri bilgi ve belgeleri vermeyen ya da denetim görevlilerinin görevlerini yapmalarına engel olan gerçek kişilerle tüzel kişilerin görevli ve ilgilileri bir yıldan üç yıla kadar hapis ve yüz günden az olmamak üzere adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanuna tâbî gerçek ve tüzel kişilerin bu Kanunda gösterilen merciler ile denetim görevlilerine, mahkemelere ve diğer resmi dairelere hitaben düzenledikleri veya yayımladıkları belgelerde yapılan gerçeğe aykırı beyanlarından dolayı bunları veya bunların düzenlenmesine esas olan her türlü belgeleri imzalayanlar hakkında, Türk Ceza Kanununun belgede sahtecilik suçuna ilişkin hükümlerine göre verilecek ceza bir kat artırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanuna tâbî kuruluşların itibarını kırabilecek veya servetine zarar verebilecek bir hususa kasten sebep olan ya da bu yolda asılsız haber yayanlar, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır. Bu fiilin basın ve yayın yoluyla işlenmesi halinde verilecek ceza yarı oranında artırılır. İsimleri belirtilmese dahi bu Kanuna tâbi kuruluşların güvenilirliği konusunda kamuoyunda tereddüte yol açarak bu kuruluşların malî bünyelerinin olumsuz etkilenmesine neden olabilecek nitelikte asılsız haberleri yukarıda belirtilen araçlarla yayınlayanlar dörtyüz günden üçbin güne kadar adlî para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanunun uygulanmasında ve uygulanmasının denetiminde görev alanlar, görevleri sırasında bu Kanun kapsamında faaliyet gösteren gerçek ve tüzel kişiler, bunların iştirakleri ve kuruluşları ile katılımcıya ait öğrendikleri sırları, bu Kanuna ve özel kanunlarına göre yetkili olanlardan başkasına açıklayamazlar ve kendi yararlarına kullanamazlar. Bu yükümlülük bu kişilerin görevden ayrılmalarından sonra da devam eder. Bu yükümlülüğe uymayan kimseler Türk Ceza Kanununun 239 uncu maddesine göre cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu Kanuna tâbi kuruluşların mensupları ve diğer görevlileri, sıfat ve görevleri dolayısıyla bu Kanuna tâbi kuruluşlara veya emeklilik sözleşmesi ile ilgili kişilere ait öğrendikleri sırları bu konuda kanunen açıkça yetkili kılınan mercilerden başkasına açıklayamazlar. Bu yükümlülük görevden ayrılmalarından sonra da devam eder. Bu madde hükmüne aykırı davrandığı tespit edilen kişiler Türk Ceza Kanununun 239 uncu maddesine göre cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu maddenin altıncı ve yedinci fıkralarında yazılı kişiler, öğrendikleri sırları kendileri ya da başkaları için yarar sağlamak amacıyla açıklarlarsa, haklarında Türk Ceza Kanununun 239 uncu maddesine göre verilecek ceza yarı oranında artırılır.</template>
