  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Diğer Hükümler">
    <mvz-madde no="26" başlık="Yönetmelikler">
      <mvz-fıkra no="1">
        <template>Bu Kanunda Kurulun, Kurumun ve Sermaye Piyasası Kurulunun belirlemeye yetkili kılındığı hususlar yönetmeliklerle düzenlenir. Bu Kanun kapsamında çıkarılacak yönetmelikler, Kanunun yayımı tarihinden itibaren en geç altı ay içerisinde çıkarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Devlet katkısı" tür="Ek">
      <mvz-fıkra no="1">
        <template>İşveren tarafından ödenenler hariç Türkiye Cumhuriyeti vatandaşı katılımcılar ile 5901 sayılı Kanunun 28 inci maddesi kapsamındaki katılımcılar adına bireysel emeklilik hesabına ödenen katkı paylarının yüzde otuzuna karşılık gelen tutar, şirketler tarafından emeklilik gözetim merkezine iletilen bilgiler esas alınarak Devlet katkısı olarak emeklilik gözetim merkezince hesaplanır. Cumhurbaşkanı, yabancı para cinsinden yapılan katkı payı ödemeleri için bu oranı yüzde ona kadar indirmeye yetkilidir. Devlet katkısı, Bakanlık bütçesine konulan ödenekten katılımcıların ilgili hesaplarına şirketler aracılığıyla aktarılmak üzere emeklilik gözetim merkezine ödenir. Bir katılımcı için bir takvim yılında ödenen ve Devlet katkısı tutarının hesaplanmasına esas teşkil eden katkı paylarının toplamı ilgili takvim yılına ait hesaplamaya ilişkin dönemin sona erdiği tarihte geçerli brüt asgari ücretin hesaplama dönemine isabet eden toplam tutarını aşamaz. Şu kadar ki, anılan sınırı aşan katkı payları için, Bakanlığın uygun görüşüyle, Kurumca belirlenecek usul ve esaslar çerçevesinde, ilgili katkı payının ödendiği yılı takip eden takvim yıllarında da Devlet katkısı hesaplaması ve ödemesi yapılabilir. Bu ödenekten bütçenin diğer kalemlerine hiçbir şekilde aktarma yapılamaz. Devlet katkısı, katkı payı ödemelerinden ayrı olarak takip edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Katılımcılardan bu maddenin yürürlüğe girdiği tarihten sonra;</template>
        <mvz-bent no="a">
          <template>En az üç yıl sistemde kalanlar Devlet katkısı hesabındaki tutarın yüzde onbeşine,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>En az altı yıl sistemde kalanlar Devlet katkısı hesabındaki tutarın yüzde otuzbeşine,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>En az on yıl sistemde kalanlar Devlet katkısı hesabındaki tutarın yüzde altmışına,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>hak kazanır. Bu sürelerin hesabında emeklilik sözleşmesi esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bireysel emeklilik sisteminden emeklilik hakkı kazananlar ile bu sistemden vefat veya malûliyet nedeniyle ayrılanlar Devlet katkısı hesabındaki tutarın tamamına hak kazanır. Devlet katkısı hesabındaki tutarlardan hak kazanılan tutarlar sistemden ayrılma veya emeklilik durumunda katılımcıya ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Vefat veya malûliyet hariç sistemden emekli olmadan ayrılan katılımcıların Devlet katkısı hesabındaki varsa hak kazanılmayan tutarlar genel bütçeye gelir kaydedilir .  Ödenmediği veya eksik ödendiği tespit edilen tutarlar, ödenmesi gereken tarihten itibaren 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 51 inci maddesinde belirtilen gecikme zammı oranına göre hesaplanan faiziyle birlikte 6183 sayılı Kanun hükümlerine göre tahsil edilmek üzere emeklilik gözetim merkezi tarafından ilgili vergi dairesine bildirilir. Tahsil edilen tutarlar genel bütçeye gelir kaydedilir ve tahsilata ilişkin bilgi, vergi dairesince Bakanlığa iletilir. Devlet katkısının hesaplanmasına, ilgili hesaba ve hak sahiplerine ödenmesine, yatırıma yönlendirilmesine, ödeme ve yatırıma yönlendirme işlemlerinin yerine getirileceği sürelere ve bu madde uyarınca yapılacak diğer işlemlere ilişkin esas ve usuller Bakanlığın uygun görüşüyle, Kurumca belirlenir.12</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Devlet katkısı hesabındaki tutarlardan hak sahiplerince aranmayan kısımların zamanaşımına uğramasına ilişkin olarak 6 ncı madde hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Katılımcıların Devlet katkısına esas teşkil eden katkı paylarının doğru hesaplanmasından şirketler sorumludur. Haksız olarak yapıldığı tespit edilen Devlet katkısı, ödeme tarihinden itibaren 6183 sayılı Kanunun 51 inci maddesinde belirtilen gecikme zammı oranına göre hesaplanan faiziyle birlikte 6183 sayılı Kanun hükümlerine göre tahsil edilmek üzere emeklilik gözetim merkezi tarafından ilgili şirketin bağlı olduğu vergi dairesine bildirilir. Tahsil edilen tutarlar genel bütçeye gelir kaydedilir ve tahsilata ilişkin bilgi, vergi dairesince Bakanlığa iletilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Devlet katkısı hesabındaki tutarlar haczedilemez, rehnedilemez, iflas masasına dâhil edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu madde kapsamında; Devlet katkısının Bakanlıkça emeklilik gözetim merkezine, emeklilik gözetim merkezince şirketlere, şirketlerce katılımcıların hesaplarına ödenmesi yahut hak kazanılmayan tutarların şirketlerce geri ödenmesi için Kurumca tanımlanan azami ikişer iş günlük işlem süreleri için emeklilik gözetim merkezi ve şirketlerden nema talep edilmez. Emeklilik gözetim merkezi tarafından gerçekleştirilen işlemler için Bakanlıkça veya Kurumca emeklilik gözetim merkezine ücret ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Katkı payının şirket hesaplarına nakden intikal ettiği tarihten önceki bir tarihte Devlet katkısı hesaplamasına konu edilmesi nedeniyle erken ödenen Devlet katkısı tutarlarına, Devlet katkısının Bakanlıkça fiilen ödendiği tarih ile ödenmesi gereken tarih arasındaki süre için, emeklilik gözetim merkezi tarafından 6183 sayılı Kanunun 51 inci maddesinde belirtilen gecikme zammı oranı esas alınarak gecikme bedeli hesaplanır. Hesaplanan bedelin, Devlet katkısının Bakanlıkça ödenmesi gereken tarihten şirketin ödeme yaptığı tarihe kadar 6183 sayılı Kanunun 51 inci maddesinde belirtilen gecikme zammı oranına göre hesaplanan faiziyle birlikte ilgili vergi dairesine ödenmesi gerektiği hususu emeklilik gözetim merkezi tarafından şirkete ve 6183 sayılı Kanun hükümlerine göre gerekli takibatın yapılması amacıyla durum şirketin bağlı olduğu vergi dairesine bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Bu madde çerçevesinde, Bakanlık hesabına emeklilik şirketlerince yapılan ödemelerden, ilgili mevzuatında belirlenen usul ve esaslar dahilinde fazla veya yersiz ödendiği tespit edilenler, Bakanlık bütçesine konulan ödenekten emeklilik şirketlerinin ilgili hesaplarına aktarılmak üzere emeklilik gözetim merkezine ödenir. Fazladan ödenen tutarlar için ayrıca faiz ödenmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Çalışanların otomatik olarak bir emeklilik planına dâhil edilmesi" tür="Ek">
      <mvz-fıkra no="1">
        <template>Türk vatandaşı veya 29/5/2009 tarihli ve 5901 sayılı Türk Vatandaşlığı Kanununun 28 inci maddesi kapsamında olup kırk beş yaşını doldurmamış olanlardan; 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 4 üncü maddesinin birinci fıkrasının (a) ve (c) bentlerine göre çalışmaya başlayanlar ile 17/7/1964 tarihli ve 506 sayılı Sosyal Sigortalar Kanununun geçici 20 nci maddesi kapsamında kurulmuş olan sandıkların iştirakçisi olarak çalışmaya başlayanlar, işverenin bu Kanun hükümlerine göre düzenlediği bir emeklilik sözleşmesiyle emeklilik planına dâhil edilir.  Kırk beş yaşını doldurmuş çalışanlar, talep etmeleri halinde anılan planlara dahil edilebilir. İşveren, çalışanını ancak otomatik katılım için emeklilik planı düzenleme konusunda Kurumca uygun görülen şirketlerden birinin sunacağı emeklilik planına dâhil edebilir. Cumhurbaşkanı, bu madde uyarınca emeklilik planına dâhil edilecek işyerleri ile çalışanları ve bu kapsamdaki uygulama esaslarını belirlemeye yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalışan katkı payı, çalışanın 5510 sayılı Kanunun 80 inci maddesi çerçevesinde belirlenen prime esas kazancının yüzde üçüne karşılık gelen tutardır.  506 sayılı Kanunun geçici 20 nci maddesi kapsamında kurulmuş olan sandıkların iştirakçisi olan çalışanlar için bu çalışanların bağlı bulunduğu sandığa, katılım payı, kesenek veya diğer adlar altında ödediği tutarların hesaplanmasına esas kazancının yüzde üçüne karşılık gelen tutardır. Bu oranı iki katına kadar artırmaya, yüzde bire kadar azaltmaya veya katkı payına maktu limit getirmeye Cumhurbaşkanı yetkilidir. Bu tutar, en geç çalışanın ücretinin ödeme gününü takip eden iş günü, bu Kanun hükümleri uyarınca işveren tarafından şirkete aktarılır. İşveren bu madde uyarınca katkı payını zamanında şirkete aktarmaz veya geç aktarırsa çalışanın 5 inci maddedeki hesaplama yöntemi uyarınca varsa birikiminde oluşan parasal kaybından sorumludur. Çalışan, otomatik katılıma ilişkin emeklilik sözleşmesinde belirlenen tutardan daha yüksek bir tutarda kesinti yapılmasını işverenden talep edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çalışan, emeklilik planına dâhil olduğunun kendisine bildirildiği tarihi müteakip iki ay içinde sözleşmeden cayabilir.  Bu süreyi üç katına kadar artırmaya Cumhurbaşkanı yetkilidir. Cayma hâlinde, ödenen katkı payları, varsa hesabında bulunan yatırım gelirleri ile birlikte on iş günü içinde çalışana iade edilir. Şirket, cayma süresince ödenen katkı paylarının değer kaybetmemesini sağlayacak şekilde fon yönetiminden sorumludur. Cayma hakkını kullanmayan çalışan Kurumca belirlenen hâllerde katkı payı ödemesine ara verilmesini talep edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Çalışan adına bireysel emeklilik hesabına ödenen katkı payları üzerinden ek 1 inci maddedeki usul ve esaslara göre bu madde uyarınca ayrıca Devlet katkısı sağlanır. Çalışanın bu madde kapsamında cayma hakkını kullanmaması hâlinde, sisteme girişte bir defaya mahsus olmak üzere, ek 1 inci maddedeki Devlet katkısı hak etme ve ödeme koşuluna tabi olmak kaydıyla, bin Türk lirası tutarında ilave Devlet katkısı sağlanır. Cumhurbaşkanı, bu tutarı yarısına kadar artırmaya veya yarısına kadar azaltmaya yetkilidir. Emeklilik hakkının kullanılması hâlinde, hesabında bulunan birikimi en az on yıllık, yıllık gelir sigortası sözleşmesi kapsamında almayı tercih eden çalışana, birikiminin yüzde beşi karşılığı ek Devlet katkısı ödemesi yapılır. Bu madde hükmüne göre çalışan katkı payının takip ve tahsil sorumluluğu şirkete aittir. Bakanlığın uygun görüşüyle, Kurum takip ve tahsil sorumluluğunun bu amaçla yetkilendirilecek bir kuruluşça yerine getirilmesine karar verebilir. Bankalar, Sosyal Güvenlik Kurumu, 506 sayılı Kanunun geçici 20 nci maddesi kapsamındaki sandıklar ile bunların ilgili bulundukları kuruluşlar ve ilgili diğer kamu kurumları, çalışan katkı payının takip ve tahsili ile Devlet katkısının hesaplanması için ihtiyaç duyulan verileri, Bakanlığın uygun görüşüyle, Kurumca belirlenen usul ve esaslara göre emeklilik gözetim merkezi ile bu maddeye göre takip ve tahsil sorumluluğu ile yetkilendirilecek kuruluşa aktarır. Emeklilik gözetim merkezi ile bu maddeye göre yetkilendirilecek kuruluş, söz konusu verileri şirketler ile paylaşabilir. Bu verilerden kişisel nitelikte olanlar, veri sahibinin açık rızasının alınmasına gerek olmaksızın ilgili kuruluşlar arasında paylaşılabilir ve veri paylaşımı, kişisel verilerin korunmasına ilişkin mevzuat hükümlerine aykırılık teşkil etmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu madde kapsamında sunulan emeklilik planları kapsamında şirketlerce 7 nci madde uyarınca fon işletim gideri kesintisi dışında başka bir kesinti yapılamaz. Çalışan katkı payı, işverenin taraf olduğu 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanunu kapsamındaki haciz ve iflas yoluyla takip bakımından işçi alacağı niteliğinde imtiyazlı bir alacaktır. İşverenler bu madde kapsamındaki yükümlülükleri bakımından Çalışma ve Sosyal Güvenlik Bakanlığı tarafından denetlenir. İşverenin bu madde kapsamındaki yükümlülüklerine ve bu madde uyarınca yürürlüğe konulan düzenlemelere uymaması hâlinde, her bir ihlal için Çalışma ve Sosyal Güvenlik Bakanlığınca yüz Türk lirası idari para cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bakanlığın uygun görüşüyle, Kurul, belirleyeceği esaslar dâhilinde, bu Kanun kapsamında sağlanan Devlet katkısının, ilgililerin hesaben takip edebilmesini sağlayacak şekilde taahhüt olarak hesaplanmasına, taahhüt olarak hesaplanan bu tutarların nemalandırılmasına ve ek 1 inci maddede belirtilen hak kazanma koşulları dikkate alınarak nemalarıyla birlikte ödenmesine karar vermeye; bu Kanun kapsamında sağlanan Devlet katkısının nemalandırılmasına, bin Türk lirası tutarındaki ilave Devlet katkısının yıllar itibarıyla yeniden değerlemesine ve ek devlet katkısının azami limiti ile iade edilmesine ilişkin usul ve esasları belirlemeye yetkilidir. Bu Kanun uyarınca yapılacak bildirimler, Bakanlığın uygun görüşüyle, Kurumun belirleyeceği usul ve esaslar çerçevesinde  elektronik iletişim araçları ile de yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Çalışanın işvereni aracılığıyla bir emeklilik planına dâhil olması, işveren tarafından şirket ve plan belirlenmesinde göz önünde bulundurulacak kriterler, katkı paylarının yatırıma yönlendirileceği fonlar, işverenin şirket ile yapacağı sözleşme, cayma hakkı, çalışanın işyerinin değişmesi hâlinde işverenin çalışanı bir emeklilik planına dâhil etmesi, işyeri değişikliğinde birikimin aktarılması, çalışma ilişkisi sona eren çalışanın talebi üzerine ilgili emeklilik planına ödeme yapması, ara verme, sistemden ayrılma, Devlet katkısının ödenmesi ve bu maddenin uygulanmasına ilişkin diğer usul ve esaslar Bakanlığın uygun görüşüyle, Kurum tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunda belirtilen yönetmelik ve tebliğler yürürlüğe girinceye kadar, yürürlükteki mevzuatın bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun yayımı tarihinden önce, hayat branşında faaliyet gösteren ve yeni poliçe akdetme yetkisi olan sigorta şirketleri, bu Kanunun yürürlük tarihinden itibaren beş yıl içerisinde başvurmak ve Kanunun 8 inci maddesinde öngörülen şartları yerine getirmekle emeklilik şirketine dönüşürler. Söz konusu şirketlere emeklilik branşında ruhsat verilebilmesi için, bu Kanunun 9 uncu maddesinde öngörülen şartların yerine getirilmesi ve emeklilik branşı dışında kalan branşlara ilişkin yasal yükümlülüklerin tamamını karşılayacak yeterli teminatın gösterilmiş olması gerekir. Ayrıca, bu şirketlerin hastalık sigortası portföyünün, sigortalıların tüm hak ve yükümlülüklerinin korunarak, emeklilik ruhsatının verildiği tarihten itibaren iki yıl içerisinde devredilmesi şarttır. Hayat sigorta şirketlerinin "sigorta şirketi" statüsünden "emeklilik şirketi" statüsüne geçişine, bu şirketlere faaliyet ruhsatı verilmesinde aranılacak şartlara, portföy devri yükümlülüklerine ve diğer hususlara ilişkin esas ve usuller Kurumca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin ikinci fıkrası kapsamında emeklilik şirketine dönüşen şirketler ile hayat branşında faaliyet gösteren ve yeni poliçe akdetme yetkisi olan sigorta şirketlerinden kurulacak emeklilik şirketine asgari yüzde on payla kurucu ortak olanlar, mevcut birikimli hayat sigortalılarının talep etmeleri ve sigortalıların bu Kanunda öngörülen şartları haiz olmaları halinde, Kurumca belirlenecek esas ve usullere göre, sigortalılarının birikimlerini tüm hak ve yükümlülükleri ile birlikte bireysel emeklilik sistemine aktarırlar. Söz konusu birikimlerin aktarımı, aktarım işleminin bu Kanunun yürürlük tarihinden itibaren beş yıl içerisinde gerçekleştirilmesi şartıyla, her türlü vergi, resim ve harçtan müstesna olup, intibak ettirilen ve emeklilik sözleşmesi imzalamış katılımcılardan sisteme giriş aidatı alınmaz ve masraf kesintileri yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun yayımı tarihinden önce 7397 sayılı Kanuna göre tasdik edilmiş hayat sigortası tarifeleri ile bunlara ilişkin tablo, ilan, reklam ve broşürlerde bu Kanunun 10 uncu maddesinde öngörülen kavramların yer alması halinde, söz konusu ifadelerin bu Kanunun yayımı tarihinden itibaren bir yıl içerisinde değiştirilmesi zorunludur. Gerek görüldüğü takdirde bu süre Kurumca bir yıldan fazla olmamak üzere artırılabilir. Söz konusu değişikliklerin yapılmaması halinde, bu tarifelere istinaden yeni sözleşme akdedilemez ve bunlara ilişkin tablo, ilan, reklam ve broşürler kullanılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yetkili organlarınca karar alınması kaydıyla, üyelerine veya çalışanlarına emekliliğe yönelik taahhütte bulunan dernek, vakıf, sandık, tüzel kişiliği haiz meslek kuruluşu veya sair ticaret şirketleri nezdinde 16/4/2012 tarihi itibarıyla mevcut bulunan emeklilik taahhüt planları kapsamındaki yurt içi ya da yurt dışındaki birikimler ve taahhütlere ilişkin tutarlar (plan esaslarına göre aktarım tarihine kadar mutat yapılan ödemeler nedeniyle oluşanlar dahil), 31/12/2017 tarihine kadar kısmen veya tamamen bireysel emeklilik sistemine aktarılabilir. Belirlenmiş katkı esasına göre yürütülen emeklilik taahhüt planlarından yapılan aktarımlarda ilgili kuruluşun yetkili organlarınca karar alınması şartı aranmayabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Beşinci fıkra kapsamında bireysel emeklilik sistemine aktarılan tutarlar gelir vergisinden müstesnadır.  Kurumca uygun görülen programlı geri ödeme tutarları hariç, aktarım tarihinden itibaren üç yıl içinde katılımcı tarafından malûliyet ve ölüm haricindeki bir nedenle, aktarılan birikimlerin bir kısmının veya tamamının alınarak sistemden çıkılması durumunda, aktarım nedeniyle istisnadan yararlanılan tutar üzerinden yüzde 3,75 oranında gelir vergisi tevkifatı yapılır. Aktarım yapan üyelerin sistemde kazanacakları süreye ve üyelerden sosyal güvenlik sistemi ve tabi olduğu vakıf senedi kapsamında emeklilik hakkı kazanmış olanların aktarım sonrası sistemde emeklilik hakkı kazanacağı yaşa ilişkin esas ve usuller Kurumca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bireysel emeklilik sistemine aktarılan tutarlar, gelir ve kurumlar vergisi mükelleflerince daha önce gider kaydedilmemişse, aktarıldığı yılın ticari kazancının tespitinde dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Beşinci fıkrada belirtilen aktarımın yapılması amacıyla gerçekleştirilen taşınmaz veya iştirak hissesi satışından doğacak kazancın, bu kapsamda aktarılan kısma isabet eden tutarı kurumlar vergisinden müstesnadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Beşinci fıkra kapsamında yapılan işlemler her türlü harçtan, düzenlenen kâğıtlar damga vergisinden, lehe alınan paralar banka ve sigorta muameleleri vergisinden müstesnadır. Şu kadar ki, bu istisna aktarılacak tutarla sınırlı olarak uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Bu madde kapsamında emeklilik sözleşmesi akdetmiş olan katılımcılardan, aktarıma ilişkin olarak giriş aidatı dahil herhangi bir kesinti yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Bu kapsamda aktarılan tutarlar aktarım sonrasında 31/12/1960 tarihli ve 193 sayılı Gelir Vergisi Kanununun bireysel emeklilik sistemine ilişkin hükümleri çerçevesinde vergilendirilir. Bu madde kapsamında yapılacak aktarıma ve bireysel emeklilik sisteminde hak kazanılacak süreye ilişkin usul ve esasları belirlemeye Kurum yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Üyelerine veya çalışanlarına emekliliğe yönelik taahhütte bulunan dernek, vakıf, sandık, tüzel kişiliği haiz meslek kuruluşu veya sair ticaret şirketinin emekliliğe yönelik faaliyetlerinin aktüeryal denetimini Kurum yapar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddeyi ihdas eden Kanunun yürürlüğe girdiği tarihte kırk beş yaşını doldurmamış olan çalışanlar ile 506 sayılı Kanunun geçici 20 nci maddesi kapsamında kurulmuş olan sandıkların iştirakçisi olarak çalışanlardan Kanunun yürürlüğe girdiği tarihte kırk beş yaşını doldurmamış olanlar, ek 2 nci madde hükümleri çerçevesinde otomatik olarak emeklilik planına dâhil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>1/1/2013 ila bu maddenin yürürlüğe girdiği tarih arasındaki sürede, katkı payının şirket hesaplarına nakden intikal ettiği tarihten önceki bir tarihte Devlet katkısı hesaplamasına konu edilmesi nedeniyle, erken ödenen Devlet katkısı tutarlarına Devlet katkısının Kurumca fiilen ödendiği tarih ile ödenmesi gereken tarih arasındaki süre için, emeklilik gözetim merkezi tarafından 6183 sayılı Kanunun 51 inci maddesinde belirtilen gecikme zammı oranı esas alınarak gecikme bedeli hesaplanır. Hesaplanan bedelin, Devlet katkısının Kurumca ödenmesi gereken tarihten şirketin ödeme yaptığı tarihe kadar 6183 sayılı Kanunun 51 inci maddesinde belirtilen gecikme zammı oranına göre hesaplanan faiziyle birlikte ilgili vergi dairesine ödenmesi gerektiği hususu emeklilik gözetim merkezi tarafından şirkete ve 6183 sayılı Kanun hükümlerine göre gerekli takibatın yapılması amacıyla durum ilgili şirketin bağlı olduğu vergi dairesine bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>1/1/2013 ila bu maddenin yürürlüğe girdiği tarih arasındaki sürede, erken ödenen Devlet katkısı tutarları kapsamında, ilgili dönemde gerçekleştirilmiş olan iade işlemleri geçerliliğini korur.</template>
