        </mvz-bent>
        <mvz-bent no="c">
          <template>Yedi gün içinde ilk inceleme yapılır ve dava dilekçesi ile ekleri tebliğe çıkarılır.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Savunma süresi dava dilekçesinin tebliğinden itibaren üç gün olup, bu süre bir defaya mahsus olmak üzere en fazla üç gün uzatılabilir. Savunmanın verilmesi veya savunma verme süresinin geçmesiyle dosya tekemmül etmiş sayılır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yürütmenin durdurulması talebine ilişkin olarak verilecek kararlara itiraz edilemez.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bu davalar dosyanın tekemmülünden itibaren en geç on beş gün içinde karara bağlanır. Ara kararı verilmesi, keşif, bilirkişi incelemesi ya da duruşma yapılması gibi işlemler ivedilikle sonuçlandırılır.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Verilen nihai kararlara karşı tebliğ tarihinden itibaren beş gün içinde temyiz yoluna başvurulabilir.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Temyiz dilekçeleri üç gün içinde incelenir ve tebliğe çıkarılır. Bu Kanunun 48 inci maddesinin bu maddeye aykırı olmayan hükümleri kıyasen uygulanır.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Temyiz dilekçelerine cevap verme süresi beş gündür.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Danıştay evrak üzerinde yaptığı inceleme sonunda, maddi vakalar hakkında edinilen bilgiyi yeterli görürse veya temyiz sadece hukuki noktalara ilişkin ise yahut temyiz olunan karardaki maddi yanlışlıkların düzeltilmesi mümkün ise işin esası hakkında karar verir. Aksi hâlde gerekli inceleme ve tahkikatı kendisi yaparak esas hakkında yeniden karar verir. Ancak, ilk inceleme üzerine verilen kararlara karşı yapılan temyizi haklı bulduğu hâllerde kararı bozmakla birlikte dosyayı geri gönderir. Temyiz üzerine verilen kararlar kesindir.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Temyiz istemi en geç on beş gün içinde karara bağlanır. Karar en geç yedi gün içinde tebliğe çıkarılır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Millî Eğitim Bakanlığı ile Ölçme, Seçme ve Yerleştirme Merkezi tarafından yapılan merkezî ve ortak sınavlar, bu sınavlara ilişkin iş ve işlemler ile sınav sonuçları hakkında açılan davalarda verilen yürütmenin durdurulması ve iptal kararları, söz konusu sınava katılan kişilerin lehine sonuç doğuracak şekilde uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20/C" başlık="Askerî hizmete ilişkin idari işlem ve eylemlerden doğan uyuşmazlıklara dair hükümler">
      <mvz-fıkra no="1">
        <template>Bu madde; Millî Savunma Bakanlığı kadrolarında çalışan kamu görevlileri ile 25/6/2019 tarihli ve 7179 sayılı Askeralma Kanunu kapsamında askerlik hizmetini yerine getiren yedek subaylar ve yedek astsubaylar ile erbaş ve erleri ilgilendiren ve askerî hizmete ilişkin idari işlem ve eylemlerden doğan uyuşmazlıklar hakkında uygulanır.  Bu uyuşmazlıkların çözümünde ilgilinin görev yaptığı yerin idari yargı yetkisi yönünden bağlı olduğu bölge idare mahkemesinin bulunduğu yerdeki idare mahkemesi yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dava dilekçelerinde, 3 üncü maddenin ikinci fıkrasında sayılanlara ilaveten bu madde kapsamındakilerin sicili, varsa sınıfı ve rütbesi de gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dilekçeler ile davalara ilişkin her türlü evrak, 4 üncü maddede belirtilen yerlere ilaveten ilgili idari yargı merciine gönderilmek üzere en yakın amirlere verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Savaş hâlinde yürütmenin durdurulmasına karar verilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Olağanüstü hâller sebebiyle alınan tedbirlerin uygulanmasında görevlendirilenlerin naklen atanmalarına ilişkin iptal davalarında, yürütmenin durdurulmasına karar verilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yüksek Askerî Şûranın terfi işlemleri ile kadrosuzluk nedeniyle emekliye ayırma işlemleri hariç her türlü ilişik kesme kararlarına karşı yargı yolu açıktır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Sonradan ibraz olunan belgeler">
      <mvz-fıkra no="1">
        <template>Dilekçeler ve savunmalarla birlikte verilmeyen belgeler, bunların vaktinde ibraz edilmelerine imkan bulunmadığına mahkemece kanaat getirilirse, kabul ve diğer tarafa tebliğ edilir. Bu belgeler duruşmada ibraz edilir ve diğer taraf cevabını hemen verebileceğini beyan eder veya cevap vermeye lüzum görmezse, ayrıca tebliğ edilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Davaların karara bağlanması">
      <mvz-fıkra no="1">
        <template>Konular aydınlandığında meseleler sırasıyla oya konulur ve karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>15 nci maddede sayılan sebeplerden biri ile veya yargılama usullerine ilişkin meselelerde azınlıkta kalanlar işin esası hakkında da oylarını kullanırlar. Azınlıkta kalanların görüşleri, kararların altına yazılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Tutanaklar">
      <mvz-fıkra no="1">
        <template>Her dava dosyası için görüşmelere katılan başkan ve üyelerin, Danıştayda düşünce veren savcının, tetkik hakiminin ve tarafların ad ve soyadlarını, incelenen dosya numarasını, kısaca dava konusunu ve verilen kararın neticesini, çoğunlukta ve azınlıkta bulunanları gösteren bir tutanak düzenlenir. Bu tutanaklar görüşmelere katılanlar tarafından aynı toplantıda imzalanır ve dosyalarında saklanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Kararlarda bulunacak hususlar">
      <mvz-fıkra no="1">
        <template>Kararlarda:</template>
        <mvz-bent no="a">
          <template>Tarafların ve varsa vekillerinin veya temsilcilerinin ad ve soyadları yahut unvanları ve adresleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Davacının ileri sürdüğü olayların ve dayandığı hukuki sebeplerin özeti istem sonucu ile davalının savunmasının özeti,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Danıştayda görülen davalarda tetkik hakimi ve savcının ad ve soyadları ile düşünceleri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Duruşmalı davalarda duruşma yapılıp yapılmadığı, yapılmış ise hazır bulunan taraflar ve vekil veya temsilcilerinin ad ve soyadları,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Kararın dayandığı hukuki sebepler ile gerekçesi ve hüküm: tazminat davalarında hükmedilen tazminatın miktarı,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Yargılama giderleri ve hangi tarafa yükletildiği,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kararın tarihi ve oybirliği ile mi, oyçokluğu ile mi verildiği,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kararı veren mahkeme başkan ve üyelerinin veya hakiminin ad ve soyadları ve imzaları ve varsa karşı oyları,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Kararı veren dairenin veya mahkemenin adı ve dosyanın esas ve karar numarası,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Belirtilir.  Kararlar, verildiği tarihten itibaren otuz gün içinde yazılır ve imzalanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Kararların saklanması ve tebliği">
      <mvz-fıkra no="1">
        <template>Kararın mahkeme başkanı ve üyeleri veya hakimi tarafından imzalı asıllarından biri, karar dosyasına, diğeri de dava dosyasına konur; mahkeme mührü ve başkan yahut hakim, Danıştayda daire veya kurul başkanı veya görevlendireceği bir üye imzasıyla tasdikli birer örneği de taraflara tebliğ edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Tarafların kişilik veya niteliğinde değişiklik">
      <mvz-fıkra no="1">
        <template>Dava esnasında ölüm veya herhangi bir sebeple tarafların kişilik veya niteliğinde değişiklik olursa, davayı takip hakkı kendisine geçenin başvurmasına kadar; gerçek kişilerden olan tarafın ölümü halinde, idarenin mirasçılar aleyhine takibi yenilemesine kadar dosyanın işlemden kaldırılmasına ilgili mahkemece karar verilir. Dört ay içinde yenileme dilekçesi verilmemiş ise, varsa yürütmenin durdurulması kararı kendiliğinden hükümsüz kalır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yalnız öleni ilgilendiren davalara ait dilekçeler iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Davacının gösterdiği adrese tebligat yapılamaması halinde, yeni adresin bildirilmesine kadar dava dosyası işlemden kaldırılır ve varsa yürütmenin durdurulması kararı kendiliğinden hükümsüz kalır. Dosyanın işlemden kaldırıldığı tarihten başlayarak bir yıl içinde yeni adres bildirilmek suretiyle yeniden işleme konulması istenmediği takdirde, davanın açılmamış sayılmasına karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Dosyaların işlemden kaldırılmasına ve davanın açılmamış sayılmasına dair kararlar diğer tarafa tebliğ edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Yürütmenin durdurulması">
      <mvz-fıkra no="1">
        <template>Danıştayda veya idari mahkemelerde dava açılması dava edilen idari işlemin yürütülmesini durdurmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay veya idari mahkemeler, idari işlemin uygulanması halinde telafisi güç veya imkânsız zararların doğması ve idari işlemin açıkça hukuka aykırı olması şartlarının birlikte gerçekleşmesi durumunda, davalı idarenin savunması alındıktan veya savunma süresi geçtikten sonra gerekçe göstererek yürütmenin durdurulmasına karar verebilirler. Uygulanmakla etkisi tükenecek olan idari işlemlerin yürütülmesi, savunma alındıktan sonra yeniden karar verilmek üzere, idarenin savunması alınmaksızın da durdurulabilir.  Ancak, kamu görevlileri hakkında tesis edilen atama, naklen atama, görev ve unvan değişikliği, geçici veya sürekli görevlendirmelere ilişkin idari işlemler, uygulanmakla etkisi tükenecek olan idari işlemlerden sayılmaz. Yürütmenin durdurulması kararlarında idari işlemin hangi gerekçelerle hukuka açıkça aykırı olduğu ve işlemin uygulanması halinde doğacak telafisi güç veya imkânsız zararların neler olduğunun belirtilmesi zorunludur. Sadece ilgili kanun veya Cumhurbaşkanlığı Kararnamesi hükmünün iptali istemiyle Anayasa Mahkemesine başvurulduğu gerekçesiyle yürütmenin durdurulması kararı verilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dava dilekçesi ve eklerinden yürütmenin durdurulması isteminin yerinde olmadığı anlaşılırsa, davalı idarenin savunması alınmaksızın istem reddedilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Vergi mahkemelerinde, vergi uyuşmazlıklarından doğan davaların açılması, tarh edilen vergi, resim ve harçlar ile benzeri mali yükümlerin ve bunların zam ve cezalarının dava konusu edilen bölümünün tahsil işlemlerini durdurur. Ancak, 26 ncı maddenin 3 üncü fıkrasına göre işlemden kaldırılan vergi davası dosyalarında tahsil işlemi devam eder. Bu şekilde işlemden kaldırılan dosyanın yeniden işleme konulması ile ihtirazi kayıtla verilen beyannameler üzerine yapılan işlemlerle tahsilat işlemlerinden dolayı açılan davalar, tahsil işlemini durdurmaz. Bunlar hakkında yürütmenin durdurulması istenebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yürütmenin durdurulması istemli davalarda 16 ncı maddede yazılı süreler kısaltılabileceği gibi, tebliğin memur eliyle yapılmasına da karar verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yürütmenin durdurulması kararları teminat karşılığında verilir; ancak, durumun gereklerine göre teminat aranmayabilir. Taraflar arasında teminata ilişkin olarak çıkan anlaşmazlıklar, yürütmenin durdurulması hakkında karar veren daire, mahkeme veya hakim tarafından çözümlenir. İdareden ve adli yardımdan faydalanan kimselerden teminat alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Yürütmenin durdurulması istemleri hakkında verilen kararlar; Danıştay dava dairelerince verilmişse konusuna göre İdari veya Vergi Dava Daireleri Kurullarına, bölge idare mahkemesi kararlarına karşı en yakın bölge idare mahkemesine, idare ve vergi mahkemeleri ile tek hakim tarafından verilen kararlara karşı bölge idare mahkemesine  kararın tebliğini izleyen günden itibaren yedi gün içinde bir defaya mahsus olmak üzere itiraz edilebilir. İtiraz edilen merciler, dosyanın kendisine gelişinden itibaren yedi gün içinde karar vermek zorundadır. İtiraz üzerine verilen kararlar kesindir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Yürütmenin durdurulması kararı verilen dava dosyaları öncelikle incelenir ve karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Yürütmenin durdurulmasına dair verilen kararlar onbeş gün içinde yazılır ve imzalanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Aynı sebeplere dayanılarak ikinci kez yürütmenin durdurulması isteminde bulunulamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Kararların sonuçları">
      <mvz-fıkra no="1">
        <template>Danıştay, bölge idare mahkemeleri, idare ve vergi mahkemelerinin esasa ve yürütmenin durdurulmasına ilişkin kararlarının icaplarına göre idare, gecikmeksizin işlem tesis etmeye veya eylemde bulunmaya mecburdur. Bu süre hiçbir şekilde kararın idareye tebliğinden başlayarak otuz günü geçemez.        Ancak disiplin hükümleri saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Konusu belli bir miktar paranın ödenmesini gerektiren davalarda hükmedilen miktar ile her türlü davalarda hükmedilen vekalet ücreti ve yargılama giderleri, davacının veya vekilinin davalı idareye yazılı şekilde bildireceği banka hesap numarasına, bu bildirim tarihinden itibaren, birinci fıkrada belirtilen usul ve esaslar çerçevesinde yatırılır. Birinci fıkrada belirtilen süreler içinde ödeme yapılmaması halinde, genel hükümler dairesinde infaz ve icra olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Danıştay, bölge idare mahkemeleri, idare ve vergi mahkemeleri kararlarına göre işlem tesis edilmeyen veya eylemde bulunulmayan hallerde idare aleyhine Danıştay ve ilgili idari mahkemede maddi ve manevi tazminat davası açılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mahkeme kararlarının süresi içinde kamu görevlilerince yerine getirilmemesi hâlinde tazminat davası ancak ilgili idare aleyhine açılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Vergi uyuşmazlıklarına ilişkin mahkeme kararlarının idareye tebliğinden sonra bu kararlara göre tespit edilecek vergi, resim, harçlar ve benzeri mali yükümler ile zam ve cezaların miktarı ilgili idarece mükellefe bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Tazminat ve vergi davalarında idarece, mahkeme kararının tebliğ tarihi ile ödeme tarihi arasındaki süreye 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 48 inci maddesine göre belirlenen tecil faizi oranında hesaplanacak faiz ödenir. Ancak mahkeme kararının davacıya tebliği ile banka hesap numarasının idareye bildirildiği tarih arasında geçecek süre için faiz işlemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Açıklama">
      <mvz-fıkra no="1">
        <template>Danıştay, bölge idare mahkemeleri, idare ve vergi mahkemelerince verilen kararlar yeterince açık değilse, yahut birbirine aykırı hüküm fıkralarını taşıyorsa, taraflardan her biri kararın açıklanmasını veya aykırılığın giderilmesini isteyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Açıklama dilekçeleri karşı taraf sayısından bir nüsha fazla verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kararı vermiş olan daire veya mahkeme işi inceler ve gerek görürse dilekçenin bir örneğini, belirleyeceği süre içinde cevap vermek üzere, karşı tarafa tebliğ eder, cevap iki nüsha olarak verilir. Bunlardan biri, açıklama veya aykırılığın kaldırılmasını isteyen tarafa gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Görevli daire veya mahkemenin bu husustaki kararı, taraflara tebliğ olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Açıklama veya aykırılığın kaldırılması, kararın yerine getirilmesine kadar istenebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Yanlışlıkların düzeltilmesi">
      <mvz-fıkra no="1">
        <template>İki tarafın adı ve soyadı ile sıfatı ve iddiaları sonucuna ilişkin yanlışlıklar ile hüküm fıkrasındaki hesap yanlışlıklarının düzeltilmesi de istenebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>29 uncu maddenin son fıkrası dışında kalan hükümleri, bu istekler hakkında da uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yanlışlıkların düzeltilmesine karar verilirse, düzeltme ilamın altına yazılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Hukuk Usulü Muhakemeleri Kanunu ile Vergi Usul Kanununun uygulanacağı haller">
      <mvz-fıkra no="1">
        <template>Bu Kanunda hüküm bulunmayan hususlarda; hakimin davaya bakmaktan memnuiyeti ve reddi, ehliyet, üçüncü şahısların davaya katılması, davanın ihbarı, tarafların vekilleri, dosyanın taraflar ve ilgililerce incelenmesi, feragat ve kabul, teminat, mukabil dava, bilirkişi, keşif, delillerin tespiti, yargılama giderleri, adli yardım hallerinde ve duruşma sırasında tarafların mahkemenin sukünunu ve inzibatını bozacak hareketlerine karşı yapılacak işlemler, elektronik işlemler ile ses ve görüntü nakledilmesi yoluyla duruşma icrasında Hukuk Usulü Muhakemeleri Kanunu hükümleri uygulanır.  Ancak, davanın ihbarı  Danıştay, mahkeme veya hakim tarafından re'sen yapılır.  Bilirkişiler, bilirkişilik bölge kurulları tarafından hazırlanan listelerden seçilir ve bilirkişiler hakkında Bilirkişilik Kanunu ve 12/1/2011 tarihli ve 6100 sayılı Hukuk Muhakemeleri Kanununun ilgili hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun ve yukarıdaki fıkra uyarınca Hukuk Usulü Muhakemeleri Kanununa atıfta bulunulan haller saklı kalmak üzere, vergi uyuşmazlıklarının çözümünde Vergi Usul Kanununun ilgili hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="İdari Davalarda Yetki ve Bağlantı ile Görevsizlik ve Yetkisizlik Hallerinde Yapılacak İşlemler">
    <mvz-madde no="32" başlık="İdari davalarda genel yetki">
      <mvz-fıkra no="1">
        <template>Göreve ilişkin hükümler saklı kalmak şartıyla bu Kanunda veya özel kanunlarda yetkili idare mahkemesinin gösterilmemiş olması halinde, yetkili idare mahkemesi, dava konusu olan idari işlemi veya idari sözleşmeyi yapan idari merciin bulunduğu yerdeki idare mahkemesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun uygulanmasında yetki kamu düzenindendir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="Kamu görevlileri ile ilgili davalarda yetki">
      <mvz-fıkra no="1">
        <template>Kamu görevlilerinin atanması ve nakilleri ile ilgili davalarda yetkili mahkeme, kamu görevlilerinin yeni veya eski görev yeri idare mahkemesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu görevlilerinin görevlerine son verilmesi, emekli edilmeleri veya görevden uzaklaştırılmaları ile ilgili davalarda yetkili mahkeme, kamu görevlisinin son görev yaptığı yer idare mahkemesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kamu görevlilerinin görevle ilişkisinin kesilmesi sonucunu doğurmayan disiplin cezaları ile ilerleme, yükselme, sicil, intibak ve diğer özlük ve parasal hakları ve mahalli idarelerin organları ile bu organların üyelerinin geçici bir tedbir olarak görevden uzaklaştırılmalarıyla ilgili davalarda yetkili mahkeme ilgilinin görevli bulunduğu yer idare mahkemesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Özel kanunlardaki hükümler saklı kalmak kaydıyla, hâkim ve savcıların mali ve sosyal haklarına ve sicillerine ilişkin konularla, müfettiş hal kâğıtlarına karşı açacakları ve idare mahkemelerinin görevine giren davalarda yetkili mahkeme, hâkim veya savcının görev yaptığı yerin idari yargı yetkisi yönünden bağlı olduğu bölge idare mahkemesine en yakın bölge idare mahkemesinin bulunduğu yer idare mahkemesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="34" başlık="Taşınmaz mallara ilişkin davalarda yetki">
      <mvz-fıkra no="1">
        <template>İmar, kamulaştırma, yıkım, işgal, tahsis, ruhsat ve iskan gibi taşınmaz mallarla ilgili mevzuatın uygulanmasında veya bunlara bağlı her türlü haklara veya kamu mallarına ilişkin idari davalarda yetkili mahkeme taşınmaz malların bulunduğu yer idare mahkemesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Köy, belediye ve özel idareleri ilgilendiren mevzuatın uygulanmasına ilişkin davalarla sınır uyuşmazlıklarında yetkili mahkeme, mülki idari birimin, köy, belediye veya mahallenin bulunduğu yahut yeni bağlandığı yer idare mahkemesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Taşınır mallara ilişkin davalarda yetki">
      <mvz-fıkra no="1">
        <template>Taşınır mallara ilişkin davalarda yetkili mahkeme, taşınır malın bulunduğu yer idare mahkemesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Tam yargı davalarında yetki">
      <mvz-fıkra no="1">
        <template>İdari sözleşmelerden doğanlar dışında kalan tam yargı davalarında yetkili mahkeme, sırasıyla:</template>
        <mvz-bent no="a">
          <template>Zararı doğuran idari uyuşmazlığı çözümlemeye yetkili,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Zarar, bayındırlık ve ulaştırma gibi bir hizmetten veya idarenin herhangi bir eyleminden doğmuş ise, hizmetin görüldüğü veya eylemin yapıldığı yer,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Diğer hallerde davacının ikametgahının bulunduğu yer.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İdari mahkemesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Vergi uyuşmazlıklarında yetki">
      <mvz-fıkra no="1">
        <template>Bu Kanununa göre vergi uyuşmazlıklarında yetkili mahkeme:</template>
        <mvz-bent no="a">
          <template>Uyuşmazlık konusu vergi, resim, harç ve benzeri mali yükümleri tarh ve tahakkuk ettiren, zam ve cezaları kesen,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Gümrük Kanununa göre alınması gereken vergilerle Vergi Usul Kanunu gereğince şikayet yoluyla vergi düzeltme taleplerinin reddine ilişkin işlemlerde; vergi, resim, harç ve benzeri mali yükümleri tarh ve tahakkuk ettiren,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Amme Alacaklarının Tahsil Usulu Kanunun uygulanmasında, ödeme emrini düzenleyen,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Diğer uyuşmazlıklarda dava konusu işlemi yapan,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Dairenin bulunduğu yerdeki vergi mahkemesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="38" başlık="Bağlantılı davalar">
      <mvz-fıkra no="1">
        <template>Aynı maddi veya hukuki sebepten doğan ya da biri hakkında verilecek hüküm, diğerini etkileyecek nitelikte olan davalar bağlantılı davalardır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İdare mahkemesi, vergi mahkemesi veya Danıştaya veya birden fazla idare veya vergi mahkemelerine açılmış bulunan davalarda bağlantının varlığına taraflardan birinin isteği üzerine veya doğrudan doğruya mahkemece karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bağlantılı davalardan birinin Danıştayda bulunması halinde dava dosyası Danıştaya gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bağlantılı davalar, değişik bölge idare mahkemesinin yargı çevrelerindeki mahkemelerde bulunduğu takdirde dosyalar Danıştaya gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bağlantılı davalar aynı bölge idare mahkemesinin yargı çerçevesindeki mahkemelerde bulunduğu takdirde dosyalar o yer bölge idare mahkemesine gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="39" başlık="Bağlantının Danıştayca incelenmesi">
      <mvz-fıkra no="1">
        <template>Danıştayın dava konusu uyuşmazlığı incelemeye yetkili dairesi, bağlantılı dava dosyalarını öncelikle ve ivedilikle inceler ve karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay bağlantının bulunduğuna karar verdiği takdirde:</template>
        <mvz-bent no="a">
          <template>Davalardan biri Danıştayda açılmış ve çözümlenmesi Danıştayın görevine dahil bir uyuşmazlıkla ilgili ise, davaların tümü Danıştayda görülür ve durum ilgili mahkemelere ve taraflara bildirilir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Davaların çözümlenmesi, ayrı bölge idare mahkemesinin yargı çevresindeki idare veya vergi mahkemelerinin görevlerine giren uyuşmazlıklarla ilgili ise Danıştayın ilgili dairesi yetkili mahkemeyi kararında belirtir ve dosyaları bu mahkemeye göndererek diğer mahkemeye veya mahkemelere durumu bildirir. Yetkili mahkeme de durumu ilgililere duyurur.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Danıştayca verilen karar bağlantı bulunmadığı yolunda ise, dosyalar İlgili mahkemelere geri gönderilir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="40" başlık="Bağlantının Bölge İdare Mahkemesince incelenmesi">
      <mvz-fıkra no="1">
        <template>Bölge idare mahkemesi bağlantılı dava dosyalarını öncelikle ve ivedilikle inceler ve kararını verir. Bölge idare mahkemesince verilen karar, bağlantının bulunduğu yolunda ise, yetkili mahkeme kararda belirtilmek suretiyle dosyalar yetkili mahkemeye gönderilir. Durum ayrıca diğer mahkemeye de duyurulur. Yetkili kılınan mahkeme durumu ilgililere bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bölge idare mahkemesince verilen karar bağlantı olmadığı yolunda ise, dosyalar ilgili mahkemelere geri gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41" başlık="Bağlantının mahkemelerce kabul edilmemesi">
      <mvz-fıkra no="1">
        <template>Bağlantı iddiaları mahkemelerce kabul edilmediği takdirde, bu hususta verilen ara kararı taraflara tebliğ edilir. Taraflar, tebliğ tarihini izleyen onbeş gün içerisinde, aynı yargı çevresindeki mahkemeler için o yer bölge idare mahkemesine, 38 nci maddenin 2 ve 3 ncü fıkrasındaki durumlarla ilgili davalar için Danıştaya başvuruda bulunabilirler. Başvuru üzerine bölge idare mahkemesi veya Danıştay görevli dairesince durum, yukarıdaki maddelerde yazılı usullere göre incelenerek karara bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Bağlantılı davalarla ilgili diğer esaslar">
      <mvz-fıkra no="1">
        <template>Bağlantının varlığı yolunda idare ve vergi mahkemelerince veya bu konuda yapılacak itiraz üzerine bölge idare mahkemesi veya Danıştayca bağlantı hakkında karar verilinceye kadar usuli işlemler durur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bağlantıya ilişkin işlemler sonuçlandırıldıktan sonra bu davalara bakmakla yetkili kılınan mahkeme veya Danıştay, davalara bırakıldığı yerden devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bağlantının bulunup bulunmadığı yolundaki bölge idare mahkemesi ve Danıştay kararları kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="Görevsizlik ve yetkisizlik hallerinde yapılacak işlem">
      <mvz-fıkra no="1">
        <template>İdare ve vergi mahkemeleri, idari yargının görev alanına giren bir davada görevsizlik veya yetkisizlik sebebiyle davanın reddine karar verirlerse dosyayı Danıştaya veya görevli ve yetkili idare veya vergi mahkemesine gönderirler.</template>
        <mvz-bent no="a">
          <template>Görevsizlik sebebiyle gönderilen dosyalarda Danıştay, davayı görevi içinde görmezse dosyanın yetkili ve görevli mahkemeye gönderilmesine karar verir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Görevsizlik veya yetkisizlik sebebiyle dosyanın gönderildiği mahkeme kendisini görevsiz veya yetkisiz gördüğü takdirde, söz konusu mahkeme ile ilk görevsizlik veya yetkisizlik kararını veren mahkeme aynı bölge idare mahkemesinin yargı çevresinde ise, uyuşmazlık bölge idare mahkemesince, aksi halde Danıştayca çözümlenir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Görev ve yetki uyuşmazlıklarında Danıştay ve bölge idare mahkemesince verilen kararlar ilgili mahkemelere bildirilir ve bu husus taraflara tebliğ olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Danıştay ve bölge idare mahkemesince görev ve yetki uyuşmazlıkları ile ilgili olarak verilen kararlar kesindir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde hükümleri gereğince verilen kararlar ile görevli ve yetkili kılınan mahkemeye yeniden dava açılması halinde harç alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Merci tayini">
      <mvz-fıkra no="1">
        <template>Yetkili mahkemenin bir davaya bakmasına fiili veya hukuki bir engel çıktığı veya iki mahkemenin yargı çevresi sınırlarında tereddüt edildiği veya iki mahkemenin de aynı davaya bakmaya yetkili olduklarına karar verdikleri hallerde dava dosyaları, tarafların veya mahkemelerin istemi üzerine merci tayini için:</template>
        <mvz-bent no="a">
          <template>Uyuşmazlığın aynı yargı çevresindeki mahkeme veya mahkemeler arasında çıkması halinde, o yargı çevresindeki bölge idare mahkemesine,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sair hallerde Danıştaya,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay ve bölge idare mahkemesi görevli ve yetkili mahkemeyi kararlaştırır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Danıştay ve bölge idare mahkemesinin bu konuda vereceği kararlar kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Kararlara Karşı Başvuru Yolları">
    <mvz-madde no="45" başlık="İstinaf">
      <mvz-fıkra no="1">
        <template>İdare ve vergi mahkemelerinin kararlarına karşı, başka kanunlarda farklı bir kanun yolu öngörülmüş olsa dahi, mahkemenin bulunduğu yargı çevresindeki bölge idare mahkemesine, kararın tebliğinden itibaren otuz gün içinde istinaf yoluna başvurulabilir.  Ancak, konusu otuz bir bin Türk lirasını geçmeyen; vergi davaları, tam yargı davaları ve idari işlemlere karşı açılan iptal davaları hakkında idare ve vergi mahkemelerince verilen kararlar kesin olup, bunlara karşı istinaf yoluna başvurulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İstinaf, temyizin şekil ve usullerine tabidir. İstinaf başvurusuna konu olacak kararlara karşı yapılan kanun yolu başvurularında dilekçelerdeki hitap ve istekle bağlı kalınmaksızın dosyalar bölge idare mahkemesine gönderilir.  Bölge idare mahkemesinin 48 inci maddenin yedinci fıkrası uyarınca verdiği kararlara karşı tebliğ tarihini izleyen günden itibaren yedi gün içinde temyiz yoluna başvurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bölge idare mahkemesi, yaptığı inceleme sonunda ilk derece mahkemesi kararını hukuka uygun bulursa istinaf başvurusunun reddine karar verir. Karardaki maddi yanlışlıkların düzeltilmesi mümkün ise gerekli düzeltmeyi yaparak aynı kararı verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bölge idare mahkemesi, ilk derece mahkemesi kararını hukuka uygun bulmadığı takdirde istinaf başvurusunun kabulü ile ilk derece mahkemesi kararının kaldırılmasına karar verir. Bu hâlde bölge idare mahkemesi işin esası hakkında yeniden bir karar verir. İnceleme sırasında ihtiyaç duyulması hâlinde kararı veren mahkeme veya başka bir yer idare ya da vergi mahkemesi istinabe olunabilir. İstinabe olunan mahkeme gerekli işlemleri öncelikle ve ivedilikle yerine getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bölge idare mahkemesi, ilk inceleme üzerine verilen kararlara karşı yapılan istinaf başvurusunu haklı bulduğu, davaya görevsiz veya yetkisiz mahkeme yahut reddedilmiş veya yasaklanmış hâkim tarafından bakılmış olması hâllerinde, istinaf başvurusunun kabulü ile ilk derece mahkemesi kararının kaldırılmasına karar vererek dosyayı ilgili mahkemeye gönderir. Bölge idare mahkemesinin bu fıkra uyarınca verilen kararları kesindir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bölge idare mahkemelerinin 46 ncı maddeye göre temyize açık olmayan kararları kesindir.  Bu kararlar, dosyayla birlikte kararı veren ilk derece mahkemesine gönderilir ve bu mahkemelerce yedi gün içinde tebliğe çıkarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İstinaf başvurusuna konu edilen kararı veren ya da karara katılan hâkim, aynı davanın istinaf yoluyla bölge idare mahkemesince incelenmesinde bulunamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>İvedi yargılama usulüne tabi olan davalarda istinaf yoluna başvurulamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="46" başlık="Temyiz">
      <mvz-fıkra no="1">
        <template>Danıştay dava dairelerinin nihai kararları ile bölge idare mahkemelerinin aşağıda sayılan davalar hakkında verdikleri kararlar, başka kanunlarda aksine hüküm bulunsa dahi Danıştayda, kararın tebliğinden itibaren otuz gün içinde temyiz edilebilir:</template>
        <mvz-bent no="a">
          <template>Düzenleyici işlemlere karşı açılan iptal davaları.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Konusu dokuz yüz yirmi bin Türk lirasını aşan; vergi davaları, tam yargı davaları ve idari işlemler hakkında açılan davalar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Konusu iki yüz yetmiş bin Türk lirasını aşıp dokuz yüz yirmi bin Türk lirasını aşmayan; vergi davaları, tam yargı davaları ve idari işlemler hakkında açılan ve istinaf kanun yolu incelemesinde kaldırma kararı üzerine yeniden karar verilen davalar.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Belli bir meslekten, kamu görevinden veya öğrencilik statüsünden çıkarılma sonucunu doğuran işlemlere karşı açılan iptal davaları.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Belli bir ticari faaliyetin icrasını süresiz veya otuz gün yahut daha uzun süreyle engelleyen işlemlere karşı açılan iptal davaları.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Müşterek kararnameyle yapılan atama, naklen atama ve görevden alma işlemleri ile daire başkanı ve daha üst düzey kamu görevlilerinin atama, naklen atama ve görevden alma işlemleri hakkında açılan iptal davaları.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>İmar planları, parselasyon işlemlerinden kaynaklanan davalar.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Tabiat Varlıklarını Koruma Merkez Komisyonu ve Kültür Varlıklarını Koruma Yüksek Kurulunca itiraz üzerine verilen kararlar ile 18/11/1983 tarihli ve 2960 sayılı Boğaziçi Kanununun uygulanmasından doğan davalar.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Maden, taşocakları, orman, jeotermal kaynaklar ve doğal mineralli sular ile ilgili mevzuatın uygulanmasına ilişkin işlemlere karşı açılan davalar.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Ülke çapında uygulanan öğrenim ya da bir meslek veya sanatın icrası veyahut kamu hizmetine giriş amacıyla yapılan sınavlar hakkında açılan davalar.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Liman, kruvaziyer limanı, yat limanı, marina, iskele, rıhtım, akaryakıt ve sıvılaştırılmış petrol gazı boru hattı gibi kıyı tesislerine işletme izni verilmesine ilişkin mevzuatın uygulanmasından doğan davalar.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>8/6/1994 tarihli ve 3996 sayılı Bazı Yatırım ve Hizmetlerin Yap-İşlet-Devret Modeli Çerçevesinde Yaptırılması Hakkında Kanunun uygulanmasından ve 16/7/1997 tarihli ve 4283 sayılı Yap-İşlet Modeli ile Elektrik Enerjisi Üretim Tesislerinin Kurulması ve İşletilmesi ile Enerji Satışının Düzenlenmesi Hakkında Kanunun uygulanmasından doğan davalar.</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>6/6/1985 tarihli ve 3218 sayılı Serbest Bölgeler Kanununun uygulanmasından doğan davalar.</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>3/7/2005 tarihli ve 5403 sayılı Toprak Koruma ve Arazi Kullanımı Kanununun uygulanmasından doğan davalar.</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Düzenleyici ve denetleyici kurullar tarafından görevli oldukları piyasa veya sektörle ilgili olarak alınan kararlara karşı açılan davalar.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="47" başlık="Temyiz edilemeyecek kararlar">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="48" başlık="Temyiz dilekçesi">
      <mvz-fıkra no="1">
        <template>Temyiz istemleri Danıştay Başkanlığına hitaben yazılmış dilekçeler ile yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Temyiz dilekçelerinin 3 üncü madde esaslarına göre düzenlenmesi gereklidir, düzenlenmemiş ise eksikliklerin onbeş gün içinde tamamlatılması hususu, kararı veren Danıştay veya bölge idare mahkemesince ilgiliye tebliğ olunur. Bu sürede eksiklikler tamamlanmazsa temyiz isteminde bulunulmamış sayılmasına Danıştay veya bölge idare mahkemesince karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Temyiz dilekçeleri, ilgisine göre kararı veren bölge idare mahkemesine, Danıştaya veya 4 üncü maddede belirtilen mercilere verilir ve kararı veren bölge idare mahkemesi veya Danıştayca karşı tarafa tebliğ edilir. Karşı taraf tebliğ tarihini izleyen otuz gün içinde cevap verebilir. Cevap veren, kararı süresinde temyiz etmemiş olsa bile düzenleyeceği dilekçesinde, temyiz isteminde bulunabilir. Bu takdirde bu dilekçeler temyiz dilekçesi yerine geçer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kararı veren Danıştay veya bölge idare mahkemesi, cevap dilekçesi verildikten veya cevap süresi geçtikten sonra dosyayı dizi listesine bağlı olarak, Danıştaya veya Kurula gönderir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yürütmenin durdurulması isteği bulunan temyiz dilekçeleri, karşı tarafa tebliğ edilmeden dosya ile birlikte, yürütmenin durdurulması istemi hakkında karar verilmek üzere kararı veren bölge idare mahkemesince Danıştay Başkanlığına, Danıştayın ilk derece mahkemesi olarak baktığı davalarda, görevli dairece konusuna göre İdari veya Vergi Dava Daireleri Kuruluna gönderilir. Danıştayda görevli daire veya kurul tarafından yürütmenin durdurulması istemi hakkında karar verildikten sonra tebligat bu daire veya kurulca yapılarak dosya tekemmül ettirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Temyiz dilekçesi verilirken gerekli harç ve giderlerin tamamının ödenmemiş olması halinde kararı veren; merci tarafından verilecek yedi günlük süre içerisinde tamamlanması, aksi halde temyizden vazgeçilmiş sayılacağı hususu temyiz edene yazılı olarak bildirilir. Verilen süre içinde harç ve giderler tamamlanmadığı takdirde, ilgili merci, kararın temyiz edilmemiş sayılmasına karar verir. Temyizin kanuni süre geçtikten sonra yapılması veya kesin bir karar hakkında olması halinde de kararı veren merci, temyiz isteminin reddine karar verir. İlgili merciin bu kararları ile bu maddenin 2 nci fıkrasında belirtilen temyiz isteminde bulunulmamış sayılmasına ilişkin kararlarına karşı, tebliğ tarihini izleyen günden itibaren yedi gün içinde temyiz yoluna başvurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Temyiz dilekçesi verilirken gerekli harç ve giderlerin ödenmemiş olduğu, dilekçenin 3 üncü madde esaslarına göre düzenlenmediği, temyizin kanuni süre içinde yapılmadığı veya kesin bir karar hakkında olduğunun anlaşıldığı hâllerde, 2 ve 6 ncı fıkralarda sözü edilen kararlar, dosyanın gönderildiği Danıştayın ilgili dairesi ve kurulunca, kesin olarak verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="49" başlık="Temyiz incelemesi üzerine verilecek kararlar">
      <mvz-fıkra no="1">
        <template>Temyiz incelemesi sonunda Danıştay;</template>
        <mvz-bent no="a">
          <template>Kararı hukuka uygun bulursa onar. Kararın sonucu hukuka uygun olmakla birlikte gösterilen gerekçeyi doğru bulmaz veya eksik bulursa, kararı, gerekçesini değiştirerek onar.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kararda yeniden yargılama yapılmasına ihtiyaç duyulmayan maddi hatalar ile düzeltilmesi mümkün eksiklik veya yanlışlıklar varsa kararı düzelterek onar.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Temyiz incelemesi sonunda Danıştay;</template>
        <mvz-bent no="a">
          <template>Görev ve yetki dışında bir işe bakılmış olması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Hukuka aykırı karar verilmesi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Usul hükümlerinin uygulanmasında kararı etkileyebilecek nitelikte hata veya eksikliklerin bulunması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>sebeplerinden dolayı incelenen kararı bozar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kararların kısmen onanması ve kısmen bozulması hâllerinde kesinleşen kısım Danıştay kararında belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Danıştayın ilk derece mahkemesi olarak baktığı davaların temyizen incelenmesinde bu madde ile ısrar hariç 50 nci madde hükümleri kıyasen uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Temyize konu edilen kararı veren ya da karara katılan hâkim aynı davanın temyiz incelemesinde görev alamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="50" başlık="Temyizen verilen karar üzerine yapılacak işlem">
      <mvz-fıkra no="1">
        <template>Temyiz incelemesi sonucunda verilen karar, dosyayla birlikte kararı veren mercie gönderilir.  Ancak Danıştay ilgili dairesinin onamaya ilişkin kararları, dosyayla birlikte kararı veren ilk derece mahkemesine, kararın bir örneği de bölge idare mahkemesine gönderilir. Bu kararlar, dosyanın geldiği tarihten itibaren yedi gün içinde taraflara tebliğe çıkarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Temyiz incelemesi sonucunda verilen bozma kararı üzerine ilgili merci, dosyayı öncelikle inceler ve varsa gerekli tahkik işlemlerini tamamlayarak yeniden karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bölge idare mahkemesi, Danıştayca verilen bozma kararına uyabileceği gibi kararında ısrar da edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Danıştayın bozma kararına uyulduğu takdirde, bu kararın temyiz incelemesi, bozma kararına uygunlukla sınırlı olarak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bölge idare mahkemesi, bozmaya uymayarak kararında ısrar ederse, ısrar kararının temyizi hâlinde, talep, konusuna göre Danıştay İdari veya Vergi Dava Daireleri Kurulunca incelenir ve karara bağlanır. Danıştay İdari ve Vergi Dava Daireleri Kurulları kararlarına uyulması zorunludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="51" başlık="Kanun yararına temyiz">
      <mvz-fıkra no="1">
        <template>İdare ve vergi mahkemeleri ile bölge idare mahkemelerinin kesin olarak verdiği kararlar ile istinaf veya temyiz incelemesinden geçmeden kesinleşmiş bulunan kararlardan niteliği bakımından yürürlükteki hukuka aykırı bir sonucu ifade edenler, ilgili bakanlıkların göstereceği lüzum üzerine veya kendiliğinden Başsavcı tarafından kanun yararına temyiz olunabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Temyiz isteği yerinde görüldüğü takdirde karar, kanun yararına bozulur. Bu bozma kararı, daha önce kesinleşmiş olan merci kararının hukuki sonuçlarını kaldırmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bozma kararının bir örneği ilgili bakanlığa gönderilir ve Resmi Gazete'de yayımlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="52" başlık="Temyiz veya istinaf istemlerinde yürütmenin durdurulması">
      <mvz-fıkra no="1">
        <template>Temyiz veya istinaf yoluna başvurulmuş olması, hakim, mahkeme veya Danıştay kararlarının yürütülmesini durdurmaz. Ancak, bu kararların teminat karşılığında yürütülmesinin durdurulmasına temyiz istemini incelemeye yetkili Danıştay dava dairesi, kurulu veya istinaf başvurusunu incelemeye yetkili bölge idare mahkemesince karar verilebilir.  Davanın reddine ilişkin kararlara karşı temyiz ya da istinaf yoluna başvurulması halinde, dava konusu işlem hakkında yürütmenin durdurulması kararı verilebilmesi 27 nci maddede öngörülen koşulun varlığına bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İptal davalarında teminat istenmeyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İdareden ve adli yardımdan yararlananlardan teminat alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Temyiz ve istinaf incelemesi sırasında yürütmenin durdurulması istemleri hakkında verilen kararlar kesindir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kararın bozulması, kararın yürütülmesini kendiliğinden durdurur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="53" başlık="Yargılamanın yenilenmesi">
      <mvz-fıkra no="1">
        <template>Danıştay ile bölge idare, idare ve vergi mahkemelerinden verilen kararlar hakkında, aşağıda yazılı sebepler dolayısıyla yargılamanın yenilenmesi istenebilir.</template>
        <mvz-bent no="a">
          <template>Zorlayıcı sebepler dolayısıyla veya lehine karar verilen tarafın eyleminden doğan bir sebeple elde edilemeyen bir belgenin kararın verilmesinden sonra ele geçirilmiş olması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Karara esas olarak alınan belgenin, sahteliğine hükmedilmiş veya sahte olduğu mahkeme veya resmi bir makam huzurunda ikrar olunmuş veya sahtelik hakkındaki hüküm karardan evvel verilmiş olup da, yargılamanın yenilenmesini isteyen kimsenin karar zamanında bundan haberi bulunmamış olması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Karara esas olarak alınan bir ilam hükmünün, kesinleşen bir mahkeme kararıyla bozularak ortadan kalkması,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bilirkişinin kasıtla gerçeğe aykırı beyanda bulunduğunun mahkeme kararıyla belirlenmesi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Lehine karar verilen tarafın, karara etkisi olan bir hile kullanmış olması,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Vekil veya kanuni temsilci olmayan kimseler ile davanın görülüp karara bağlanmış bulunması,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Çekinmeye mecbur olan başkan, üye veya hakimin katılmasıyla karar verilmiş olması,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Tarafları, konusu ve sebebi aynı olan bir dava hakkında verilen karara aykırı yeni bir kararın verilmesine neden olabilecek kanuni bir dayanak yokken, aynı mahkeme yahut başka bir mahkeme tarafından önceki ilamın hükmüne aykırı bir karar verilmiş bulunması.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Hükmün, İnsan Haklarını ve Ana Hürriyetleri Korumaya Dair Sözleşmenin veya eki protokollerin ihlâli suretiyle verildiğinin, Avrupa İnsan Hakları Mahkemesinin kesinleşmiş kararıyla tespit edilmiş olması  veya hüküm aleyhine Avrupa İnsan Hakları Mahkemesine yapılan başvuru hakkında dostane çözüm ya da tek taraflı deklarasyon sonucunda düşme kararı verilmesi.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yargılamanın yenilenmesi istekleri esas kararı vermiş olan mahkemece karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yargılamanın yenilenmesi süresi, (1) numaralı fıkranın (h) bendinde yazılı sebep için on yıl, (1) numaralı fıkranın (ı) bendinde yazılı sebep için Avrupa İnsan Hakları Mahkemesi kararının kesinleştiği tarihten itibaren bir yıl ve diğer sebepler için altmış gündür. Bu süreler, dayanılan sebebin istemde bulunan yönünden gerçekleştiği tarihi izleyen günden başlatılarak hesaplanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="54" başlık="Kararın düzeltilmesi">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="55" başlık="Yargılamanın yenilenmesi usulü">
      <mvz-fıkra no="1">
        <template>İsteğin ilişkin olduğu konu, diğer bir daire veya mahkemenin görevine girmiş ise karar bu daire veya mahkemece verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Karşı tarafın savunması alındıktan sonra istekler incelenir ve kanunda yazılı sebepler varsa davaya yeniden bakılarak karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yargılamanın yenilenmesi  istemleri, kanunda yazılı sebeplere dayanmıyor ise, istemin reddine karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yargılamanın yenilenmesi  istemlerinde duruşma yapılması, görevli daire veya mahkemenin kararına bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu madde ile 53 üncü madde hükümleri saklı kalmak kaydıyla, yargılamanın yenilenmesinde  bu Kanunun diğer hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Çeşitli Hükümler">
    <mvz-madde no="56" başlık="Danıştayda çekinme ve ret">
      <mvz-fıkra no="1">
        <template>Davaya bakmakta olan dava dairesi başkan ve üyelerinin çekinme veya reddi halinde, bunlar hariç tutulmak suretiyle, o daire kurulu tamamlanarak, bu husus incelenir, çekinme veya ret istemi yerinde görülürse işin esası hakkında da bu kurulca karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çekinen veya reddedilenler ikiden fazla ise bu husustaki istem, idari dava dairesi başkan ve üyeleri için İdari Dava Daireleri Kurulunda, vergi dava dairesi başkan ve üyeleri için Vergi Dava Daireleri Kurulunda incelenir. Çekinen veya reddedilen başkan ve üyeler bu kurullara katılamazlar. Üye noksanı diğer dava dairelerinden tamamlanır. Bu kurullarca çekinme veya ret istemi kabul edildiği takdirde davanın esası hakkında da bu kurullarca karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İdari Dava Daireleri Kurulu ile Vergi Dava Daireleri Kurulu başkan ve üyelerinden bir kısmının davaya bakmaktan çekinmesi veya reddi halinde noksan üyelikler diğer dava dairelerinden tamamlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İdari ve Vergi Dava Daireleri Kurullarının toplanmasına engel olacak sayıda ret istemlerinde bulunulamaz ve çekinilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Danıştay Tetkik hakimleri ve savcıları sebeplerini bildirerek çekinebilecekleri gibi taraflarca da reddedilebilirler. Bunlar hakkındaki çekinme veya ret istemleri davaya bakmakla görevli daire tarafından incelenerek karara bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="57" başlık="Mahkemelerde çekinme ve ret">
      <mvz-fıkra no="1">
        <template>Tek hakimle görülen davalarda hakimin reddi istemi, reddedilen hakimin katılmadığı idare veya vergi mahkemesince incelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İtiraz üzerine veya doğrudan davaya bakmakta olan bölge idare mahkemesi ile idare ve vergi mahkemesi başkan ve üyelerinin reddi istemi, reddedilen başkan ve üyenin katılmadığı bölge idare, idare ve vergi mahkemesince incelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İdare ve vergi mahkemelerinde reddedilen başkan ve üye birden çok ise istem bölge idare mahkemesince incelenir. Bölge idare mahkemelerinde reddedilen başkan veya üye birden çok ise istem Danıştayca incelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Danıştayca ve bu mahkemelerce ret istemleri yerinde görülürse işin esası hakkında da karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Davaya bakmaktan çekinme halinde diğer bir hakimin görevlendirilmesi ile mahkemenin noksan üyesinin tamamlanması veya görevli mahkemenin belirlenmesinde yukarıdaki hükümler uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="58" başlık="İdari davalarda delillerin tespiti">
      <mvz-fıkra no="1">
        <template>Taraflar, idari dava açtıktan sonra bu davalara ilişkin delillerin tespitini ancak davaya bakan Danıştay, idare ve vergi mahkemelerinden isteyebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Davaya bakan Danıştay, İdare ve Vergi Mahkemeleri istemi uygun gördüğü takdirde üyelerden birini bu işle görevlendirebileceği gibi, tespitin mahalli idari veya adli yargı mercilerince yaptırılmasına da karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Delillerin tespiti istemi, ivedilikle karara bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="59" başlık="Yol giderleri, tazminat ve gündelikler">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensupları ile Danıştayda görevli idari yargı hakim ve savcılarından keşif, bilirkişi incelemesi veya delillerin tespiti için görevlendirilenlere gerçek yol giderleri ile görevde geçen günler için net aylık tutarlarının otuzda biri oranında gündelik verilir. Bu gündelikler, zorunlu giderleri karşılamazsa, aradaki fark belgelere dayalı olmak şartı ile ayrıca ödenir. Ancak, bu suretle yapılacak ödemeler, gündeliklerin yüzde ellisini geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bölge idare, idare ve vergi mahkemeleri hakimleri ile diğer görevlilerin yol giderleri ve tazminatları hakkında 3717 sayılı Adli Personel ile Devlet Davalarını Takip edenlere Yol Giderleri ve Tazminat Verilmesi ile 492 Sayılı Harçlar Kanununun Bir Maddesinin Yürürlükten Kaldırılması Hakkında Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="60" başlık="Tebliğ işleri ve ücretler">
      <mvz-fıkra no="1">
        <template>Danıştay ile bölge idare, idare ve vergi mahkemelerine ait her türlü tebliğ işleri, Tebligat Kanunu hükümlerine göre yapılır. Bu suretle yapılacak tebliğlere ait ücretler ilgililer tarafından peşin olarak ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="61" başlık="Çalışmaya ara verme">
      <mvz-fıkra no="1">
        <template>Bölge idare, idare ve vergi mahkemeleri her yıl bir eylülde başlamak üzere, yirmi temmuzdan otuz bir ağustosa kadar çalışmaya ara verirler. Ancak, yargı çevresine dahil olduğu bölge idare mahkemesinin bulunduğu il merkezi dışında kalan ve sadece bir idare veya bir vergi mahkemesi bulunan yerlerdeki idari yargı mercileri çalışmaya ara vermeden yararlanamazlar. Bu mahkemeler, 62 nci maddedeki sınırlamaya tabi olmaksızın görevlerine devam ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalışmaya ara verme süresi içinde; bölge idare mahkemesi başkanının önerisi üzerine, Hâkimler ve Savcılar Yüksek Kurulunca, birden fazla idari yargı mercii olan yerlerde idare veya vergi mahkemeleri başkan ve üyeleri arasından görevlendirilecek yeteri kadar hâkimin katıldığı bir nöbetçi mahkeme kurulur. Bölge idare mahkemeleri için ise bölge idare mahkemesi başkanının önerisi üzerine, Hâkimler ve Savcılar Yüksek Kurulunca, tüm daire başkan ve üyeleri arasından görevlendirilecek yeterli sayıda nöbetçi daire kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çalışmaya ara vermeden yararlanamayanlar ve nöbetçi kalanların yıllık izin hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="62" başlık="Nöbetçi mahkemenin görevleri">
      <mvz-fıkra no="1">
        <template>Nöbetçi mahkeme çalışmaya ara verme süresi içinde aşağıda yazılı işleri görür:</template>
        <mvz-bent no="a">
          <template>Yürütmenin durdurulmasına ve delillerin tespitine ait işler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kanunen belli süre içinde karara bağlanması gereken işler.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="63" başlık="Kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>Vergi Usul Kanununun Vergi uyuşmazlıklarına ilişkin 379 ila 412 nci madde hükümleri, bu Kanunla kurulan vergi mahkemelerinin göreve başladıkları tarihte yürürlükten kalkar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Parasal sınırların artırılması" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen parasal sınırlar; her yıl, bir önceki yıla ilişkin olarak 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi hükümleri uyarınca tespit ve ilan edilen yeniden değerleme oranında, takvim yılı başından geçerli olmak üzere artırılmak suretiyle uygulanır. Bu şekilde belirlenen sınırların bin Türk lirasını aşmayan kısımları dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>17 nci madde uyarınca duruşma yapılmasının zorunlu olduğu davalar ile 45 inci ve 46 ncı maddeler uyarınca istinaf veya temyiz yoluna başvurulabilecek kararların belirlenmesinde davanın açıldığı tarihteki parasal sınır esas alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Belediyeler ile il özel idarelerinin seçilmiş organlarının organlık sıfatlarını kaybetmelerine ilişkin olarak yetkili mercilerden Danıştaya gönderilen dosyalar; belediye başkanlarının düşmesi istemine dair ise belediye başkanlarının, belediye meclislerinin veya il genel meclislerinin feshi istemine ilişkin ise meclis başkanvekilinin savunması onbeş gün içinde alındıktan sonra veya bu süre içerisinde savunma verilmediği takdirde sürenin bittiği tarihte tekemmül etmiş sayılır ve kanunlarda gösterilen karar süreleri bu tarihten itibaren işlemeye başlar. Karar dosya üzerinden verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kararlara karşı tebliğini izleyen günden itibaren onbeş gün içerisinde İdari Dava Daireleri Kuruluna itiraz edilebilir. İtiraz bir ay içerisinde sonuçlandırılır. İtiraz üzerine verilen karar kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>İptal</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında, 27/10/1980 tarih ve 2324 sayılı Anayasa Düzeni Hakkında Kanun hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yeni Anayasa yürürlüğe girinceye ve Sayıştayla ilgili yasal bir düzenleme yapılıncaya kadar, Sayıştayın yargı kararlarına karşı açılan davalar, idari yargı mercilerinin denetimi dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 45 inci maddesinin değişik (1) numaralı fıkrasında yazılı uyuşmazlıklarla ilgili olarak verilen nihaî kararlardan, değişikliğin yürürlüğe girdiği tarihten önce verilen kararlar ile Danıştayın bozma kararı üzerine kararı bozulan mahkemece verilen kararlar, Danıştayda temyiz edilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte kesinleşmiş olan Avrupa İnsan Hakları Mahkemesi kararlarına ilişkin yargılamanın yenilenmesi istemleri, bu Kanunun yürürlüğe girdiği tarihten itibaren bir yıl içinde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bölge idare, idare ve vergi mahkemelerinde evrak büroları oluşturuluncaya kadar dilekçeler mahkeme başkanı veya hâkim tarafından havale edilmeye devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun 45 inci maddesinin (1) numaralı fıkrasında yazılı uyuşmazlıklarla ilgili olarak ilk derece mahkemelerince verilen nihaî kararlardan, bu maddeyi ihdas eden Kanunun yayımı tarihinden önce verilen kararlar ile Danıştayın bozma kararı üzerine kararı bozulan mahkemece verilen kararlar, Danıştayda temyiz edilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddeyi ihdas eden Kanunla, bu Kanunun 16 ncı maddesinin dördüncü fıkrasına eklenen hüküm, kanun yolu aşaması dâhil, yürürlük tarihinde derdest olan davalarda da uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İvedi yargılama usulü hariç olmak üzere bu Kanunla idari yargıda kanun yollarına ilişkin getirilen hükümler, 2576 sayılı Kanunun, bu Kanunla değişik 3 üncü maddesine göre kurulan bölge idare mahkemelerinin tüm yurtta göreve başlayacakları tarihten sonra verilen kararlar hakkında uygulanır. Bu tarihten önce verilmiş kararlar hakkında, kararın verildiği tarihte yürürlükte bulunan kanun yollarına ilişkin hükümler uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bölge idare mahkemelerinin faaliyete geçme tarihine kadar idare ve vergi mahkemeleri tarafından verilen kararlara yapılan itirazlarda bu Kanunla düzenlenen istinaf kanun yolu için öngörülen harçlar alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İvedi yargılama usulüne ilişkin olmak üzere, 18/6/2014 tarihli ve 6545 sayılı Kanunun yürürlüğe girmesinden sonra on beş gün içinde temyiz kanun yoluna başvurulmadığı için temyiz talebi reddedilen kararlara karşı, bu fıkrayı ihdas eden Kanunun yayımı tarihinden itibaren on beş gün, bu fıkrayı ihdas eden Kanunun yayımı tarihinden önce aynı gerekçeyle temyiz talebi reddedilmekle birlikte bu fıkrayı ihdas eden Kanunun yayımı tarihinden sonra tebliğ edilen kararlara karşı da bu kararların tebliğ tarihinden itibaren on beş gün içinde yeniden temyiz yoluna başvurulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarih itibarıyla, kaldırılan Askeri Yüksek İdare Mahkemesinin tarafsız ve bağımsız olmadığı iddiasıyla Avrupa İnsan Hakları Mahkemesine yaptığı başvuru derdest olanlar, bu tarihten itibaren üç ay içinde Ankara idare mahkemelerinden yargılamanın yenilenmesini isteyebilirler. Bu süre içinde istemde bulunmayanlar, Avrupa İnsan Hakları Mahkemesince münhasıran iç hukuk yollarının tüketilmediği gerekçesiyle verilen kabul edilemezlik kararının kendilerine tebliğinden itibaren üç ay içinde de istemde bulunabilirler. Süresinde istemde bulunulması halinde yargılama yeniden yapılarak karar verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce 10 uncu, 11 inci ve 13 üncü maddeler uyarınca idareye yapılmış başvurular bakımından, belirtilen maddelerde bu Kanunla yapılan değişikliklerden önceki süreler uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>6/2/2023 tarihinde meydana gelen depremler nedeniyle genel hayata etkili afet bölgesi olarak kabul edilen yerlerde, bu depremlerin ve akabinde meydana gelen depremlerin etkisiyle oluşan hasarlarla bağlantılı olması kaydıyla, hak sahipliğine ilişkin işlemler hariç olmak üzere hasar tespit raporlarına dayalı olarak tesis edilen idari işlemlere karşı açılan iptal davalarında aşağıdaki hükümler uygulanır:</template>
        <mvz-bent no="a">
          <template>On gün içinde ilk inceleme yapılır ve dava dilekçesi ile ekleri tebliğe çıkarılır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Savunma verme süresi dava dilekçesinin tebliğinden itibaren on beş gün olup, bu süre bir defaya mahsus olmak üzere en fazla on gün uzatılabilir. Savunmanın verilmesi veya savunma verme süresinin geçmesiyle dosya tekemmül etmiş sayılır. Savunma dilekçesinde bina askı koduna yer verilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yürütmenin durdurulması talebine ilişkin olarak verilen kararlara itiraz edilemez.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Keşif ve bilirkişi incelemesi yapılması gereken hâllerde, dosyanın tekemmülünden itibaren on beş gün içinde keşif yapılır. Tarafların hak ve menfaatlerinin korunması bakımından zorunluluk bulunan hâllerde keşif ve bilirkişi incelemesi, ilk incelemeyi müteakiben de yapılabilir. Bilirkişi raporları on beş gün içinde mahkemeye teslim edilir. Bilirkişilere ve bilirkişi raporlarına, raporun tebliğinden itibaren yedi gün içinde itiraz edilebilir.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Duruşma yapılması, tarafların istemine ve mahkemenin kararına bağlıdır. Duruşma davetiyeleri, duruşma gününden en az on beş gün önce taraflara gönderilir.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bu davalar dosyanın tekemmülünden veya ara karar, keşif, bilirkişi incelemesi ya da duruşma yapılması gereken hâllerde bunların tamamlanmasından itibaren en geç on beş gün içinde karara bağlanır.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Elektronik tebligat adresi bulunmayan taraflara keşif ve duruşma günü, öncelikle 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanununun 7 nci maddesine göre yapılır.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Verilen nihai kararlara karşı tebliğ tarihinden itibaren on beş gün içinde istinaf yoluna başvurulabilir.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>İstinaf dilekçeleri on gün içinde incelenir ve tebliğe çıkarılır.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>İstinaf dilekçelerine cevap verme süresi on beş gündür.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>İstinaf istemi en geç iki ay içinde karara bağlanır. İstinaf incelemesi aşamasında, istinabe olunan mahkeme gerekli işlemleri on beş gün içinde yerine getirir.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Tam yargı davalarıyla bu madde kapsamındaki iptal davaları birlikte görülemez. Bu maddenin yürürlüğe girdiği tarihten önce, birlikte açılmış olan iptal ve tam yargı davaları ayrılır ve bu davalar bulunduğu aşamadan itibaren görülmeye devam olunur.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Bu maddede süre öngörülmeyen hâllerde her türlü iş ve işlemler ivedilikle sonuçlandırılır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddede düzenlenmeyen hususlarda bu Kanunun diğer hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce açılmış olan davalar hakkında da bu madde hükümleri bulunduğu aşamadan itibaren uygulanır. Ancak, bu maddenin yürürlüğe girdiği tarihten önce işlemeye başlamış olan savunma, bilirkişi raporuna itiraz, istinaf kanun yoluna başvuru ve istinaf dilekçesine cevap verme süreleri bakımından genel hükümler uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="64" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="65" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
