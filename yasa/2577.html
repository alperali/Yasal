  <mvz-künye tür="kanun" no="2577" başlık="İDARİ YARGILAMA USULÜ KANUNU"
             tarih="6/1/1982" rgazete-tarih="20/1/1982" rgazete-sayı="17580"
             düstur-tertip="5" düstur-cilt="21" düstur-sayfa="147" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Esaslar">
    <mvz-madde no="1" başlık="Kapsam ve nitelik">
      <mvz-fıkra no="1">
        <template>Danıştay, bölge idare mahkemeleri, idare mahkemeleri ve vergi mahkemelerinin görevine giren uyuşmazlıkların çözümü, bu Kanunda gösterilen usullere tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay, bölge idare mahkemeleri, idare mahkemeleri ve vergi mahkemelerinde yazılı yargılama usulü uygulanır ve inceleme evrak üzerinde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="İdari dava türleri ve idari yargı yetkisinin sınırı">
      <mvz-fıkra no="1">
        <template>İdari dava türleri şunlardır:</template>
        <mvz-bent no="a">
          <template>İdarî işlemler hakkında yetki, şekil, sebep, konu ve maksat yönlerinden biri ile hukuka aykırı olduklarından dolayı iptalleri için menfaatleri ihlâl edilenler tarafından açılan iptal davaları,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İdari eylem ve işlemlerden dolayı kişisel hakları doğrudan muhtel olanlar tarafından açılan tam yargı davaları,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Tahkim yolu öngörülen imtiyaz şartlaşma ve sözleşmelerinden doğan uyuşmazlıklar hariç, kamu hizmetlerinden birinin yürütülmesi için yapılan her türlü idari sözleşmelerden dolayı taraflar arasında çıkan uyuşmazlıklara ilişkin davalar.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İdari yargı yetkisi, idari eylem ve işlemlerin hukuka uygunluğunun denetimi ile sınırlıdır. İdari mahkemeler; yerindelik denetimi yapamazlar, yürütme görevinin kanunlarda ve Cumhurbaşkanlığı Kararnamelerinde gösterilen şekil ve esaslara uygun olarak yerine getirilmesini kısıtlayacak, idari eylem ve işlem niteliğinde veya idarenin takdir yetkisini kaldıracak biçimde yargı kararı veremezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="İdari davaların açılması">
      <mvz-fıkra no="1">
        <template>İdari davalar, Danıştay, idare mahkemesi ve vergi mahkemesi başkanlıklarına hitaben yazılmış imzalı dilekçelerle açılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dilekçelerde;</template>
        <mvz-bent no="a">
          <template>Tarafların ve varsa vekillerinin veya temsilcilerinin ad ve soyadları veya unvanları ve adresleri ile gerçek kişilere ait Türkiye Cumhuriyeti kimlik numarası,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Davanın konu ve sebepleri ile dayandığı deliller,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Davaya konu olan idari işlemin yazılı bildirim tarihi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Vergi, resim, harç, benzeri mali yükümler ve bunların zam ve cezalarına ilişkin davalarla tam yargı davalarında uyuşmazlık konusu miktar,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Vergi davalarında davanın ilgili bulunduğu verginin veya vergi cezasının nevi ve yılı, tebliğ edilen ihbarnamenin tarihi ve numarası ve varsa mükellef hesap numarası,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dava konusu kararın ve belgelerin asılları veya örnekleri dava dilekçesine eklenir. Dilekçeler ile bunlara ekli evrakın örnekleri karşı taraf sayısından bir fazla olur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Dilekçelerin verileceği yerler">
      <mvz-fıkra no="1">
        <template>Dilekçeler ve savunmalar ile davalara ilişkin her türlü evrak, Danıştay veya ait olduğu mahkeme başkanlıklarına veya bunlara gönderilmek üzere idare veya vergi mahkemesi başkanlıklarına, idare veya vergi mahkemesi bulunmayan yerlerde büyükşehir belediyesi sınırları içerisinde kalıp kalmadığına bakılmaksızın asliye hukuk hakimliklerine veya yabancı memleketlerde Türk konsolosluklarına verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Aynı dilekçe ile dava açılabilecek haller">
      <mvz-fıkra no="1">
        <template>Her idari işlem aleyhine ayrı ayrı dava açılır. Ancak, aralarında maddi veya hukuki yönden bağlılık yada sebep-sonuç ilişkisi bulunan birden fazla işleme karşı bir dilekçe ile de dava açılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birden fazla şahsın müşterek dilekçe ile dava açabilmesi için davacıların hak veya menfaatlerinde iştirak bulunması ve davaya yol açan maddi olay veya hukuki sebeplerin aynı olması gerekir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Dilekçe üzerine uygulanacak işlem">
      <mvz-fıkra no="1">
        <template>Danıştay, idare mahkemesi ve vergi mahkemesi başkanlıklarına veya 4 ncü maddede yazılı yerlere verilen dilekçelerin harç ve posta ücretleri alındıktan sonra deftere derhal kayıtları yapılarak kayıt tarih ve sayısı dilekçenin üzerine yazılır. Dava bu kaydın yapıldığı tarihte açılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Davacılara, kayıt tarih ve sayısını gösteren imzalı ve mühürlü, pulsuz bir alındı kağıdı verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>4 ncü maddede yazılı diğer yerlere verilen dilekçeler, en geç üç gün içinde Danıştay veya ait olduğu mahkeme başkanlığına taahhütlü olarak gönderilir. Bu yerlerde harç pulları bulunmadığı takdirde bunlara karşılık alınan paraların miktarı ve alındı kağıdının tarih ve sayısı dilekçelere yazılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Herhangi bir sebeple harcı veya posta ücreti verilmeden veya eksik harç veya posta ücreti ile dava açılmış olması halinde, otuz gün içinde harcın ve posta ücretinin verilmesi ve tamamlanması hususu daire başkanı veya görevlendireceği tetkik hakimi, mahkeme başkanı veya hakim tarafından ilgiliye tebliğ olunur. Tebligata rağmen gereği yerine getirilmediği takdirde bildirim aynı şekilde bir daha tekrarlanır. Harç veya posta ücreti süresi içinde verilmez veya tamamlanmazsa davanın açılmamış sayılmasına karar verilir ve davacıya tebliğ olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Dava açıldıktan sonra posta ücretinde tebliğ işlemlerinin yapılmasını engelleyecek şekilde azalma olması halinde, otuz gün içinde posta ücretinin tamamlanması daire başkanı veya görevlendireceği tetkik hakimi, mahkeme başkanı veya hakim tarafından ilgiliye tebliğ olunur. Tebligata rağmen gereği yerine getirilmediği takdirde bildirim aynı şekilde bir daha tekrarlanır. Posta ücreti süresi içinde tamamlanmazsa dosyanın işlemden kaldırılmasına karar verilir. Bu kararın tebliği tarihinden başlayarak üç ay içinde, noksanı tamamlanmak suretiyle yeniden işleme konulması istenmediği takdirde davanın açılmamış sayılmasına karar verilir ve davacıya tebliğ olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>4 ve 5 inci fıkralardaki tebligat re'sen genel bütçeden yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Dava açma süresi">
      <mvz-fıkra no="1">
        <template>Dava açma süresi, özel kanunlarında ayrı süre gösterilmeyen hallerde Danıştayda ve idare mahkemelerinde altmış ve vergi mahkemelerinde otuz gündür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu süreler;</template>
        <mvz-bent no="a">
          <template>İdari uyuşmazlıklarda; yazılı bildirimin yapıldığı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Vergi, resim ve harçlar ile benzeri mali yükümler ve bunların zam ve cezalarından doğan uyuşmazlıklarda: Tahakkuku tahsile bağlı olan vergilerde tahsilatın; tebliğ yapılan hallerde veya tebliğ yerine geçen işlemlerde tebliğin; tevkif yoluyla alınan vergilerde istihkak sahiplerine ödemenin; tescile bağlı vergilerde tescilin yapıldığı ve idarenin dava açması gereken konularda ise ilgili merci veya komisyon kararının idareye geldiği;</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Tarihi izleyen günden başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Adresleri belli olmayanlara özel kanunlarındaki hükümlere göre ilan yoluyla bildirim yapılan hallerde, özel kanununda aksine bir hüküm bulunmadıkça süre, son ilan tarihini izleyen günden itibaren onbeş gün sonra işlemeye başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İlanı gereken düzenleyici işlemlerde dava süresi, ilan tarihini izleyen günden itibaren başlar. Ancak bu işlemlerin uygulanması üzerine ilgililer, düzenleyici işlem veya uygulanan işlem yahut her ikisi aleyhine birden dava açabilirler. Düzenleyici işlemin iptal edilmemiş olması bu düzenlemeye dayalı işlemin iptaline engel olmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Sürelerle ilgili genel esaslar">
      <mvz-fıkra no="1">
        <template>Süreler, tebliğ, yayın veya ilan tarihini izleyen günden itibaren işlemeye başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tatil günleri sürelere dahildir. Şu kadarki, sürenin son günü tatil gününe rastlarsa, süre tatil gününü izleyen çalışma gününün bitimine kadar uzar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda yazılı sürelerin bitmesi çalışmaya ara verme zamanına rastlarsa bu süreler, ara vermenin sona erdiği günü izleyen tarihten itibaren yedi gün uzamış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Görevli olmayan yerlere başvurma">
      <mvz-fıkra no="1">
        <template>Çözümlenmesi Danıştayın, idare ve vergi mahkemelerinin görevlerine girdiği halde, adli  yargı yerlerine açılmış bulunan davaların görev noktasından reddi halinde, bu husustaki kararların kesinleşmesini izleyen günden itibaren otuz gün içinde görevli mahkemede dava açılabilir. Görevsiz yargı merciine başvurma tarihi, Danıştaya, idare ve vergi mahkemelerine başvurma tarihi olarak kabul edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Adli  yargı yerlerine açılan ve görevsizlik sebebiyle reddedilen davalarda, görevsizlik kararının kesinleşmesinden sonra birinci fıkrada yazılı otuz günlük süre geçirilmiş olsa dahi, idari dava açılması için öngörülen süre henüz dolmamış ise bu süre içinde idari dava açılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="İdari makamların sükutu">
      <mvz-fıkra no="1">
        <template>İlgililer, haklarında idari davaya konu olabilecek bir işlem veya eylemin yapılması için idari makamlara başvurabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Otuz gün içinde bir cevap verilmezse istek reddedilmiş sayılır. İlgililer otuz günün bittiği tarihten itibaren dava açma süresi içinde, konusuna göre Danıştaya, idare ve vergi mahkemelerine dava açabilirler. Otuz günlük süre içinde idarece verilen cevap kesin değilse ilgili bu cevabı, isteminin reddi sayarak dava açabileceği gibi, kesin cevabı da bekleyebilir. Bu takdirde dava açma süresi işlemez. Ancak, bekleme süresi başvuru tarihinden itibaren dört ayı geçemez. Dava açılmaması veya davanın süreden reddi hallerinde, otuz günlük sürenin bitmesinden sonra yetkili idari makamlarca cevap verilirse, cevabın tebliğinden itibaren altmış gün içinde dava açabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Üst makamlara başvurma">
      <mvz-fıkra no="1">
        <template>İlgililer tarafından idari dava açılmadan önce, idari işlemin kaldırılması, geri alınması, değiştirilmesi veya yeni bir işlem yapılması üst makamdan, üst makam yoksa işlemi yapmış olan makamdan, idari dava açma süresi içinde istenebilir. Bu başvurma, işlemeye başlamış olan idari dava açma süresini durdurur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Otuz gün içinde bir cevap verilmezse istek reddedilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İsteğin reddedilmesi veya reddedilmiş sayılması halinde dava açma süresi yeniden işlemeye başlar ve başvurma tarihine kadar geçmiş süre de hesaba katılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="İptal ve tam yargı davaları">
      <mvz-fıkra no="1">
        <template>İlgililer haklarını ihlal eden bir idari işlem dolayısıyla Danıştaya ve idare ve vergi mahkemelerine doğrudan doğruya tam yargı davası veya iptal ve tam yargı davalarını birlikte açabilecekleri gibi ilk önce iptal davası açarak bu davanın karara bağlanması üzerine, bu husustaki kararın veya kanun yollarına başvurulması halinde verilecek kararın tebliği veya bir işlemin icrası sebebiyle doğan zararlardan dolayı icra tarihinden itibaren dava süresi içinde tam yargı davası açabilirler. Bu halde de ilgililerin 11 nci madde uyarınca idareye başvurma hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Doğrudan doğruya tam yargı davası açılması">
      <mvz-fıkra no="1">
        <template>İdari eylemlerden hakları ihlal edilmiş olanların idari dava açmadan önce, bu eylemleri yazılı bildirim üzerine veya başka süretle öğrendikleri tarihten itibaren bir yıl ve her halde eylem tarihinden itibaren beş yıl içinde ilgili idareye başvurarak haklarının yerine getirilmesini istemeleri gereklidir. Bu isteklerin kısmen veya tamamen reddi halinde, bu konudaki işlemin tebliğini izleyen günden itibaren veya istek hakkında otuz gün içinde cevap verilmediği takdirde bu sürenin bittiği tarihten itibaren, dava süresi içinde dava açılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Görevli olmayan adli  yargı mercilerine açılan tam yargı davasının görev yönünden reddi halinde sonradan idari yargı mercilerine açılacak davalarda, birinci fıkrada öngörülen idareye başvurma şartı aranmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Dilekçeler üzerine ilk inceleme">
      <mvz-fıkra no="1">
        <template>Dilekçeler Danıştayda Evrak Müdürlüğünce kaydedilir ve Genel Sekreterlikçe görevli dairelere havale olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bölge idare, idare ve vergi mahkemelerinde dilekçeler, evrak bürosunca kaydedilerek ilgili mahkemelere havale olunur. Dilekçe sahibine evrakın tarih ve sayısını gösterir ücretsiz bir alındı kâğıdı verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dilekçeler, Danıştayda daire başkanının görevlendireceği bir tetkik hakimi, idare ve vergi mahkemelerinde ise mahkeme başkanı veya görevlendireceği bir üye tarafından:</template>
        <mvz-bent no="a">
          <template>Görev ve yetki,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İdari merci tecavüzü,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Ehliyet,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İdari davaya konu olacak kesin ve yürütülmesi gereken bir işlem olup olmadığı,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Süre aşımı,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Husumet,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>3 ve 5 inci maddelere uygun olup olmadıkları,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yönlerinden sırasıyla incelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Dilekçeler bu yönlerden kanuna aykırı görülürse durum; görevli daire veya mahkemeye bir rapor ile bildirilir. Tek hakimle çözümlenecek dava dilekçeleri için rapor düzenlenmez ve 15 inci madde hükümleri ilgili hakim tarafından uygulanır. 3 üncü fıkraya göre yapılacak inceleme ve bu fıkra ile 5 inci fıkraya göre yapılacak işlemler dilekçenin alındığı tarihten itibaren en geç onbeş gün içinde sonuçlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İlk incelemeyi yapanlar, bu noktalardan kanuna aykırılık görmezler veya daire veya mahkeme tarafından ilk inceleme raporu yerinde görülmezse, tebligat işlemi yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yukarıdaki hususların ilk incelemeden sonra tespit edilmesi halinde de davanın her safhasında 15 nci madde hükmü uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="İlk inceleme üzerine verilecek karar">
      <mvz-fıkra no="1">
        <template>Danıştay veya idare ve vergi mahkemelerince yukarıdaki maddenin 3 üncü fıkrasında yazılı hususlarda kanuna aykırılık görülürse, 14 üncü maddenin;</template>
        <mvz-bent no="a">
          <template>3/a bendine göre adli  yargının görevli olduğu konularda açılan davaların reddine; idari yargının görevli olduğu konularda ise görevli veya yetkili olmayan mahkemeye açılan davanın görev veya yetki yönünden reddedilerek dava dosyasının görevli veya yetkili mahkemeye gönderilmesine,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>3/c, 3/d ve 3/e bentlerinde yazılı hallerde davanın reddine,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>3/f bendine göre, davanın hasım gösterilmeden veya yanlış hasım gösterilerek açılması halinde, dava dilekçesinin tespit edilecek gerçek hasma tebliğine,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>3/g bendinde yazılı halde otuzgün içinde 3 ve 5 inci maddelere uygun şekilde yeniden düzenlenmek veya noksanları tamamlanmak yahut (c) bendinde yazılı hallerde, ehliyetli olan şahsın avukat olmayan vekili tarafından dava açılmış ise otuzgün içinde bizzat veya bir avukat vasıtasıyla dava açılmak üzere dilekçelerin reddine,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>3/b bendinde yazılı halde dilekçelerin görevli idare merciine tevdiine,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dilekçelerin görevli mercie tevdii halinde, Danıştaya veya ilgili mahkemeye başvurma tarihi, merciine başvurma tarihi olarak kabul edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dilekçelerin 3 ncü maddeye uygun olmamaları dolayısıyla reddi halinde yeni dilekçeler için ayrıca harç alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İlk inceleme üzerine Danıştay veya mahkemelerce verilen; bu maddenin 1/a bendinde belirtilen idari yargının görevli olduğu konularda davanın görev ve yetki yönünden reddine ilişkin kararlarla, 1/c bendinde yazılı gerçek hasma tebliğ ve 1/d bendindeki dilekçe red kararları dışında, ilgisine göre istinaf ya da temyiz yoluna başvurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>1 inci fıkranın (d) bendine göre dilekçenin reddedilmesi üzerine, yeniden verilen dilekçelerde aynı yanlışlıklar yapıldığı takdirde dava reddedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Tebligat ve cevap verme">
      <mvz-fıkra no="1">
        <template>Dava dilekçelerinin ve eklerinin birer örneği davalıya, davalının vereceği savunma davacıya tebliğ olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Davacının ikinci dilekçesi davalıya, davalının vereceği ikinci savunma da davacıya tebliğ edilir. Buna karşı davacı cevap veremez. Ancak, davalının ikinci savunmasında, davacının cevaplandırmasını gerektiren hususlar bulunduğu, davanın görülmesi sırasında anlaşılırsa, davacıya cevap vermesi için bir süre verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Taraflar, yapılacak tebliğlere karşı, tebliğ tarihinden itibaren otuz gün içinde cevap verebilirler. Bu süre, ancak haklı sebeplerin bulunması halinde, taraflardan birinin isteği üzerine görevli mahkeme kararı ile otuz günü geçmemek ve bir defaya mahsus olmak üzere uzatılabilir. Sürenin geçmesinden sonra yapılan uzatma talepleri kabul edilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Taraflar, sürenin geçmesinden sonra verecekleri savunmalara veya ikinci dilekçelere dayanarak hak iddia edemezler.  Ancak, tam yargı davalarında dava dilekçesinde belirtilen miktar, süre veya diğer usul kuralları gözetilmeksizin nihai karar verilinceye kadar, harcı ödenmek suretiyle bir defaya mahsus olmak üzere artırılabilir ve miktarın artırılmasına ilişkin dilekçe otuz gün içinde cevap verilmek üzere karşı tarafa tebliğ edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Davalara ilişkin işlem dosyalarının aslı veya onaylı örneği idarenin savunması ile birlikte, Danıştay veya ilgili mahkeme başkanlığına gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Danıştayda ilk derece mahkemesi sıfatıyla görülen davalarda savcının esas hakkındaki yazılı düşüncesi taraflara tebliğ edilir. Taraflar, tebliğden itibaren on gün içinde görüşlerini yazılı olarak bildirebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Duruşma">
      <mvz-fıkra no="1">
        <template>Danıştay ile idare ve vergi mahkemelerinde açılan iptal ve yirmibeşbin Türk Lirasını aşan tam yargı davaları ile tarh edilen vergi, resim ve harçlarla benzeri mali yükümler ve bunların zam ve cezaları toplamı yirmibeşbin Türk Lirasını aşan vergi davalarında, taraflardan birinin isteği üzerine duruşma yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Temyiz ve istinaflarda duruşma yapılması tarafların istemine ve Danıştay veya ilgili bölge idare mahkemesi kararına bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Duruşma talebi, dava dilekçesi ile cevap ve savunmalarda yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>1 ve 2 nci fıkralarda yer alan kayıtlara bağlı olmaksızın Danıştay, mahkeme ve hakim kendiliğinden duruşma yapılmasına karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Duruşma davetiyeleri duruşma gününden en az otuz gün önce taraflara gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Duruşmalara ilişkin esaslar">
      <mvz-fıkra no="1">
        <template>Duruşmalar açık olarak yapılır. Genel ahlakın veya kamu güvenliğinin gerekli kıldığı hallerde, görevli daire veya mahkemenin kararı ile, duruşmanın bir kısmı veya tamamı gizli olarak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Duruşmaları başkan yönetir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Duruşmalarda taraflara ikişer defa söz verilir. Taraflardan yalnız biri gelirse onun açıklamaları dinlenir; hiç biri gelmezse duruşma açılmaz, inceleme evrak üzerinde yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Danıştayda görülen davaların duruşmalarında savcının bulunması şarttır. Taraflar dinlendikten sonra savcı yazılı düşüncesini açıklar. Bundan sonra taraflara son olarak ne diyecekleri sorulur ve duruşmaya son verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Duruşmalı işlerde savcılar, keşif, bilirkişi incelemesi veya delil tespiti yapılmasını yahut işlem dosyasının getirtilmesini istedikleri takdirde, bu istekleri görevli daire veya kurul tarafından kabul edilmezse, işin esası hakkında ayrıca yazılı olarak düşünce bildirirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Duruşmalı işlerde karar verilmesi">
      <mvz-fıkra no="1">
        <template>Duruşma yapıldıktan sonra en geç onbeş gün içinde karar verilir. Ara kararı verilen hallerde, bu kararın yerine getirilmesi üzerine, dosyalar öncelikle incelenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Dosyaların incelenmesi">
      <mvz-fıkra no="1">
        <template>Danıştay, bölge idare mahkemeleri ile idare ve vergi mahkemeleri, bakmakta oldukları davalara ait her türlü incelemeyi kendiliğinden yapar. Mahkemeler belirlenen süre içinde lüzum gördükleri evrakın gönderilmesini ve her türlü bilgilerin verilmesini taraflardan ve ilgili diğer yerlerden isteyebilirler. Bu husustaki kararların, ilgililerce, süresi içinde yerine getirilmesi mecburidir. Haklı sebeplerin bulunması halinde bu süre, bir defaya mahsus olmak üzere uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflardan biri ara kararının icaplarını yerine getirmediği takdirde, bu durumun verilecek karar üzerindeki etkisi mahkemece önceden takdir edilir ve arakararında bu husus ayrıca belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ancak, istenen bilgi ve belgeler Devletin güvenliğine veya yüksek menfaatlerine veya Devletin güvenliği ve yüksek menfaatleriyle birlikte yabancı devletlere de ilişkin ise, Cumhurbaşkanı ya da ilgili Cumhurbaşkanı yardımcısı veya bakan, gerekçesini bildirmek suretiyle, söz konusu bilgi ve belgeleri vermeyebilir.  Verilmeyen bilgi ve belgelere dayanılarak ileri sürülen savunmaya göre karar verilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Danıştay, bölge idare, idare ve vergi mahkemelerinde dosyalar, bu Kanun ve diğer kanunlarda belirtilen öncelik veya ivedilik durumları ile Danıştay için Başkanlar Kurulunca; diğer mahkemeler için Hakimler ve Savcılar Yüksek Kurulunca konu itibariyle tespit edilip Resmi Gazete'de ilan edilecek öncelikli işler gözönünde bulundurulmak suretiyle geliş tarihlerine göre incelenir ve tekemmül ettikleri sıra dahilinde bir karara bağlanır. Bunların dışında kalan dosyalar ise tekemmül ettikleri sıraya göre ve tekemmül tarihinden itibaren en geç altı ay içinde sonuçlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bölge idare mahkemelerindeki istinaf kanun yolu incelemeleri ile idare ve vergi mahkemelerinde heyet halinde görülen davalarda, birinci fıkrada belirtilen bilgi ve belgelerin istenmesine ve ek süre verilmesine ilişkin ara kararları daire başkanı, mahkeme başkanı veya dosyanın havale edildiği üye tarafından da verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20/A" başlık="İvedi yargılama usulü">
      <mvz-fıkra no="1">
        <template>İvedi yargılama usulü aşağıda sayılan işlemlerden doğan uyuşmazlıklar hakkında uygulanır:</template>
        <mvz-bent no="a">
          <template>İhaleden yasaklama kararları hariç ihale işlemleri.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Acele kamulaştırma işlemleri.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Özelleştirme Yüksek Kurulu kararları.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>12/3/1982 tarihli ve 2634 sayılı Turizmi Teşvik Kanunu uyarınca yapılan satış, tahsis ve kiralama işlemleri.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>9/8/1983 tarihli ve 2872 sayılı Çevre Kanunu uyarınca, idari yaptırım kararları hariç çevresel etki değerlendirmesi sonucu alınan kararlar.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>16/5/2012 tarihli ve 6306 sayılı Afet Riski Altındaki Alanların Dönüştürülmesi Hakkında Kanun uyarınca alınan Cumhurbaşkanı kararları.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İvedi yargılama usulünde:</template>
        <mvz-bent no="a">
          <template>Dava açma süresi otuz gündür.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu Kanunun 11 inci maddesi hükümleri uygulanmaz.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yedi gün içinde ilk inceleme yapılır ve dava dilekçesi ile ekleri tebliğe çıkarılır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Savunma süresi dava dilekçesinin tebliğinden itibaren on beş gün olup, bu süre bir defaya mahsus olmak üzere en fazla on beş gün uzatılabilir. Savunmanın verilmesi veya savunma verme süresinin geçmesiyle dosya tekemmül etmiş sayılır.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Yürütmenin durdurulması talebine ilişkin olarak verilecek kararlara itiraz edilemez.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Bu davalar dosyanın tekemmülünden itibaren en geç bir ay içinde karara bağlanır. Ara kararı verilmesi, keşif, bilirkişi incelemesi ya da duruşma yapılması gibi işlemler ivedilikle sonuçlandırılır.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Verilen nihai kararlara karşı tebliğ tarihinden itibaren on beş gün içinde temyiz yoluna başvurulabilir.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Temyiz dilekçeleri üç gün içinde incelenir ve tebliğe çıkarılır. Bu Kanunun 48 inci maddesinin bu maddeye aykırı olmayan hükümleri kıyasen uygulanır.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Temyiz dilekçelerine cevap verme süresi on beş gündür.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Danıştay evrak üzerinde yaptığı inceleme sonunda, maddi vakıalar hakkında edinilen bilgiyi yeterli görürse veya temyiz sadece hukuki noktalara ilişkin ise yahut temyiz olunan karardaki maddi yanlışlıkların düzeltilmesi mümkün ise işin esası hakkında karar verir. Aksi hâlde gerekli inceleme ve tahkikatı kendisi yaparak esas hakkında yeniden karar verir. Ancak, ilk inceleme üzerine verilen kararlara karşı yapılan temyizi haklı bulduğu hâllerde kararı bozmakla birlikte dosyayı geri gönderir. Temyiz üzerine verilen kararlar kesindir.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Temyiz istemi en geç iki ay içinde karara bağlanır. Karar en geç bir ay içinde tebliğe çıkarılır.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20/B" başlık="Merkezî ve ortak sınavlara ilişkin yargılama usulü">
      <mvz-fıkra no="1">
        <template>Millî Eğitim Bakanlığı ile Ölçme, Seçme ve Yerleştirme Merkezi tarafından yapılan merkezî ve ortak sınavlar, bu sınavlara ilişkin iş ve işlemler ile sınav sonuçları hakkında açılan davalara ilişkin yargılama usulünde:</template>

        </mvz-bent>
