  <mvz-künye tür="kanun" no="2839" başlık="MİLLETVEKİLİ SEÇİMİ KANUNU"
             tarih="10/6/1983" rgazete-tarih="13/6/1983" rgazete-sayı="18076"
             düstur-tertip="5" düstur-cilt="22" düstur-sayfa="380" /> 

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, milletvekili seçimi sistem ve usulünü, seçim çevreleriyle milletvekili sayısını, seçim dönemi ve zamanını, ara seçimi, seçimin yenilenmesi, seçilebilme ve aday olma esasları ile milletvekili seçimine ilişkin ilkeleri ve uygulamaları düzenler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Seçim sistemi ve usulü">
      <mvz-fıkra no="1">
        <template>Milletvekili seçimi tek derecelidir. Seçim nispi temsil sistemine göre, genel, eşit ve gizli oyla, bütün yurtta aynı günde yargı yönetim ve denetimi altında yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçmen, oyunu tam bir serbestlikle kendisi kullanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Oyların sayımı, dökümü ve tutanaklara bağlanması, açık olarak yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Milletvekili sayısı ve dağılımı">
      <mvz-fıkra no="1">
        <template>Milletvekili sayısı 600’dür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Seçim çevreleri ve çıkaracağı milletvekili sayısı">
      <mvz-fıkra no="1">
        <template>İllerin çıkaracağı milletvekili sayısının tespitinde toplam milletvekili sayısından  her il'e önce bir milletvekili verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Son genel nüfus sayımı ile belli olan Türkiye nüfusu, birinci fıkradaki illere verilen milletvekili sayısı çıkarıldıktan sonra kalan milletvekili sayısına bölünmek suretiyle bir sayı elde edilir. İl nüfusunun bu sayıya bölünmesi ile her ilin ayrıca çıkaracağı milletvekili sayısı tespit olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Nüfusu milletvekili çıkarmaya yetmeyen illerin nüfusları ile artık nüfus bırakan illerin artık nüfusları büyüklüklerine göre sıraya konulur ve ilk hesapta iller arasında bölüştürülmemiş bulunan milletvekillikleri bu sıraya göre dağıtılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Son kalan milletvekilliğinin verilmesinde, iki veya daha fazla ilin eşit nüfus veya nüfus artığı göstermesi halinde, bunlar arasında ad çekilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yapılan tespit sonunda, çıkaracağı milletvekili sayısı 18'e kadar olan iller, bir seçim çevresi sayılır. Çıkaracağı milletvekili sayısı 19'dan 35'e kadar olan iller iki, 36 ve daha fazla olan iller üç seçim çevresine bölünür. Bu seçim çevreleri, numara sırasına göre adlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu illerin seçim çevreleri belirlenirken:</template>
        <mvz-bent no="a">
          <template>Seçim çevreleri, mümkün olduğu ölçüde eşit veya birbirine yakın sayıda milletvekili çıkaracak şekilde oluşturulur.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Mümkün olduğu ölçüde ilçelerin mülki bütünlüğü dikkate alınır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Aynı seçim çevresinde yer alacak ilçelerin nüfus ve coğrafi yakınlıkları ile ulaşım imkanları gözönünde bulundurulur.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu illerin milletvekili sayısının seçim çevrelerine dağıtımında; seçim çevrelerinin çıkaracakları milletvekili sayısı, nüfusları bakımından illerin milletvekili sayısını tespit etmeye ilişkin esaslara göre belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Seçim çevreleri ve çıkaracakları milletvekili sayısının ilanı">
      <mvz-fıkra no="1">
        <template>Seçim çevreleri ve her seçim çevresinin çıkaracağı milletvekili sayısı, Yüksek Seçim Kurulu tarafından,  genel nüfus sayımı sonuçlarının açıklanmasından itibaren en geç altı ay içinde, 4 üncü madde uyarınca tespit edilerek Resmi Gazete, radyo ve televizyonla ilan edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Seçim dönemi, seçimin başlangıcı ve seçim günü:">
      <mvz-fıkra no="1">
        <template>Türkiye Büyük Millet Meclisinin seçimleri beş yılda bir Cumhurbaşkanı seçimi ile birlikte aynı gün yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir önceki seçimin yapıldığı tarihten itibaren beş yılın dolmasından önceki son Pazar günü oy verilir. Oy verme gününden geriye doğru hesaplanacak altmış günlük sürenin ilk günü seçimin başlangıç tarihidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Savaş sebebiyle yeni seçimlerin yapılmasına imkan görülmezse, Türkiye Büyük Millet Meclisi, seçimlerin bir yıl geriye bırakılmasına karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Geri bırakma sebebi ortadan kalkmamışsa, erteleme kararındaki usule göre bu işlem tekrarlanabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Ara seçimi">
      <mvz-fıkra no="1">
        <template>Türkiye Büyük Millet Meclisi üyeliklerinde boşalma olması halinde, ara seçime gidilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ara seçimleri, her seçim döneminde bir defa yapılır ve genel seçimden otuz ay geçmedikçe ara seçime gidilemez. Ancak, boşalan üyeliklerin sayısı, üye tamsayısının yüzde beşini bulduğu hallerde, ara seçimlerinin üç ay içinde yapılmasına Türkiye Büyük Millet Meclisince karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Genel seçimlere bir yıl kala ara seçimi yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıda yazılı haller dışında, bir ilin veya seçim çevresinin Türkiye Büyük Millet Meclisinde üyesinin kalmaması halinde, boşalmayı takip eden doksan günden sonraki ilk Pazar günü o seçim çevresinde ara seçim yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Seçimin yenilenmesi">
      <mvz-fıkra no="1">
        <template>Seçim dönemi bitmeden önce, seçimin yenilenmesine Türkiye Büyük Millet Meclisi veya Cumhurbaşkanınca karar verilmesi halinde, durum Bakanlar Kurulu tarafından kırksekiz saat içinde ilan olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yenileme kararı Türkiye Büyük Millet Meclisi tarafından verilmişse Meclis, seçimin yapılacağı tarihi de belirler. Yenileme kararının Cumhurbaşkanınca verilmesi halinde, bu kararın verildiği günden sonra gelen doksanıncı günü takip eden ilk Pazar günü oy verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Sürelerin tespiti">
      <mvz-fıkra no="1">
        <template>Seçimlerin yenilenmesine veya ara seçimi yapılmasına karar verildiği hallerde, Yüksek Seçim Kurulu, bu Kanun ile 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunun ve 2820 sayılı Siyasi Partiler Kanununun seçimlere ilişkin olarak tespit ettiği süreleri kısaltarak uygulayabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Seçilme yeterliği">
      <mvz-fıkra no="1">
        <template>Onsekiz yaşını dolduran her Türk vatandaşı milletvekili seçilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Milletvekili seçilemeyecek olanlar">
      <mvz-fıkra no="1">
        <template>Aşağıda yazılı olanlar milletvekili seçilemezler:</template>
        <mvz-bent no="a">
          <template>İlkokul mezunu olmayanlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kısıtlılar,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Askerlikle ilişiği olanlar,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kamu hizmetinden yasaklılar,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Taksirli suçlar hariç, toplam bir yıl veya daha fazla hapis veya süresi ne olursa olsun ağır hapis cezasına hüküm giymiş olanlar,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Affa uğramış olsalar bile;</template>
          <mvz-altbent no="1">
            <template>Basit ve nitelikli zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, inancı kötüye kullanma, dolanlı iflas gibi yüz kızartıcı suçlar ile istimal ve istihlak kaçakçılığı dışında kalan kaçakçılık suçları, resmî ihale ve alım satımlara fesat karıştırma veya Devlet sırlarını açığa vurma suçlarından biriyle mahkûm olanlar,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Türk Ceza Kanununun İkinci Kitabının, birinci babında yazılı suçlardan veya bu suçların işlenmesini aleni olarak tahrik etme suçundan mahkum olanlar,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Terör eylemlerinden mahkûm olanlar,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Türk Ceza Kanununun 536 ncı maddesinin birinci, ikinci ve üçüncü fıkralarında yazılı eylemlerle aynı Kanunun 537 nci maddesinin birinci, ikinci, üçüncü, dördüncü ve beşinci fıkralarında yazılı eylemleri siyasi ve ideolojik amaçlarla işlemekten mahkum olanlar.</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Seçim Öncesi İşleri">
    <mvz-madde no="12" başlık="Adaylık">
      <mvz-fıkra no="1">
        <template>Bir siyasi partiye mensup olsun veya olmasın seçilme yeterliğine sahip her Türk vatandaşı bu Kanun hükümlerine göre milletvekilliğine adaylığını koyabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunun 14 üncü maddesinin 11 inci fıkrası gereğince Yüksek Seçim Kurulunun tespit ve ilan ettiği seçime katılabilecek siyasi partiler, 2820 sayılı Siyasi Partiler Kanunu hükümlerine göre, bütün seçim çevrelerinde aday gösterebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12/A" başlık="Seçim İttifakı">
      <mvz-fıkra no="1">
        <template>Seçimlere katılma yeterliliği taşıyan siyasi partiler, ittifak yaparak seçime katılabilir. İttifak yapan siyasi partiler, kendi aday listelerini verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İttifak yaparak seçime katılma kararı alan siyasi partiler, seçimin başlangıç tarihinden itibaren en geç yedi gün içinde, genel başkanların imzalarını ihtiva eden ittifak protokolünü Yüksek Seçim Kuruluna teslim eder. Aday listelerinin teslim edilmesi için belirlenen tarihten iki gün öncesine kadar, aynı usulle ittifak protokolünde değişiklik yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İttifak protokolünde; siyasi partilerce belirlenmesi halinde, ittifak unvanı ve kanunlara aykırı olmayan diğer hususlar yer alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Siyasi partiler, aday listelerinin teslim edilmesi için belirlenen tarihten üç gün öncesine kadar, Yüksek Seçim Kuruluna bildirimde bulunmak suretiyle ittifaktan vazgeçebilir. Bu durum, Yüksek Seçim Kurulunca aynı ittifak içerisindeki diğer siyasi partilere derhal bildirilir. Vazgeçme halinde, ittifak diğer partiler arasında devam eder. İttifaktan vazgeçmenin bildirilmesini takip eden gün saat 17.00’ye kadar, ittifak içerisindeki diğer siyasi partiler ittifak protokolünü değiştirebilir veya ittifaktan vazgeçebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar ile seçim ittifakına ilişkin diğer hususlar Yüksek Seçim Kurulunca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="İller toplamının en az yarısında tam aday göstermeyen siyasi partilerin durumu">
      <mvz-fıkra no="1">
        <template>Herhangi bir sebeple iller toplamının en az yarısında 12 nci maddede öngörülen sayı kadar aday göstermemiş olan veya bu illerin seçim çevrelerinin herhangi birinde 12 nci maddede öngörülen sayıdan eksik aday göstermiş bulunan siyasi partilerin genel merkezlerindeki yetkili organlarına Yüksek Seçim Kurulu tarafından, eksiklerin derhal tamamlanması lüzumu bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlgili parti teşkilatı bu tebliğden itibaren iki gün içinde eksik kalan adaylıkları doldurur. Aksi takdirde o siyasi parti bütün seçim çevrelerinde seçime katılma hakkını kaybeder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="İller toplamının yarısından fazlasında aday gösteren partilerin durumu">
      <mvz-fıkra no="1">
        <template>Siyasi partiler tarafından iller toplamının yarısından fazlasında 12 nci maddede öngörülen sayı kadar aday gösterilmiş olmakla beraber yarıyı geçen seçim çevrelerinin bir veya bir kaçında eksik aday gösterilmesi halinde, Yüksek Seçim Kurulunca o partinin genel merkezindeki yetkili organlarına aday listelerinin tamamlanması lüzumu bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlgili parti teşkilatı bu tebliğden itibaren iki gün içinde o çevrelerin listelerindeki eksikleri tamamlar. Aksi takdirde, yukarıdaki madde hükmü saklı kalmak şartıyla, adayları eksik kalan seçim çevresinde o siyası parti, seçime katılma hakkını kaybeder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="İtiraz üzerine meydana gelen eksikler">
      <mvz-fıkra no="1">
        <template>Siyasi partilerin aday listelerinde, yapılan itirazlar üzerine eksiklik husule geldiği takdirde, Yüksek Seçim Kurulunun tebliğinden itibaren iki gün içinde bu eksikler tamamlanır. Aksi takdirde yukarıdaki maddeler hükümleri, bu hallerde de uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Siyasi partilerin adayları ve bağımsız adaylar">
      <mvz-fıkra no="1">
        <template>Siyasi partiler anlaşarak müşterek liste halinde aday gösteremezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Siyasi partilere kayıtlı olmayan kimselerin, herhangi bir siyasi parti tarafından aday gösterilmeleri, kendilerinin yazılı muvafakatlarına bağlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Seçimlere katılma yeterliliği taşıyan siyasi partinin seçime katılmaması halinde, bu partinin üyesi, kendisinin ve üyesi olduğu siyasi partinin yazılı muvafakati alınarak, başka bir siyasi parti tarafından aday gösterilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bir kimse aynı zamanda değişik siyasi partiden veya aynı partiden aynı seçim için birden fazla seçim çevresinden aday olamaz, aday gösterilemez ve seçilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bağımsız adaylar da, aynı seçim için birden fazla seçim çevresinde aday olamaz ve seçilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bir kimse Cumhurbaşkanlığına ve milletvekilliğine aynı anda aday olamaz ve aday gösterilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Kurullarda görevli hakimlerin durumu">
      <mvz-fıkra no="1">
        <template>Yüksek Seçim Kurulu ve il seçim kurulu başkan ve üyeleri ile ilçe seçim kurulu başkanları, bu görevlerinden ancak adaylıklarını koymaları halinde çekilebilirler. Adaylığı tercih edenler, bu tercih haklarını genel ve ara seçimlerin başlangıcından bir ay önce, seçimin yenilenmesine karar verilmesi halinde yenileme kararının ilanından başlayarak yedi gün içinde kullanabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Adaylığı tercih edenler, 18 ve 19 uncu maddelerde, memurlar hakkında konulan kayıtlara tabi olurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İl ve ilçe seçim kurullarında görevlendirilen hakimlerin görevli bulundukları seçim çevrelerinde, eşleri ve ikinci dereceye kadar  kan ve sıhri hısımları adaylıklarını koydukları veya aday gösterildikleri takdirde, bu hakimler seçim kurullarındaki görevlerinden çekilmek ve durumu derhal yetkili merciine bildirmek zorundadırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yüksek Seçim Kurulu Başkanı ve üyeleri, eşleri ve ikinci dereceye kadar (bu derece dahil) kan ve sıhri hısımları hakkındaki işlemlerde kurul toplantılarına katılamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Adaylık için görevden çekilmesi gerekenler">
      <mvz-fıkra no="1">
        <template>Hakimler ve savcılar, yüksek yargı organları mensupları, yüksek öğretim kurumlarındaki öğretim elemanları, Yükseköğretim Kurulu, Radyo ve Televizyon Üst Kurulu üyeleri, kamu kurumu ve kuruluşlarının memur statüsündeki görevlileri ile yaptıkları hizmet bakımından işçi niteliği taşımayan diğer kamu görevlileri, aday olmak isteyen belediye başkanları ve subaylar ile astsubaylar, aday olmak isteyen siyasi partilerin il ve ilçe yönetim kurulu başkan ve üyeleri ile belediye meclisi üyeleri, il genel meclisi üyeleri, kamu kurumu niteliğindeki meslek kuruluşları ile sendikalar, kamu bankaları ile üst birliklerin ve bunların üst kuruluşlarının ve katıldıkları teşebbüs veya ortaklıkların yönetim ve denetim kurullarında görev alanlar genel ve ara seçimlerin başlangıcından bir ay önce seçimin yenilenmesine karar verilmesi halinde yenileme kararının ilanından başlayarak yedi gün içinde görevlerinden ayrılma isteğinde bulunmadıkça adaylıklarını koyamazlar ve aday gösterilemezler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Görevden ayrılmaya ilişkin hükümler">
      <mvz-fıkra no="1">
        <template>18 inci madde kapsamına girenlerin ayrılma istekleri en yakın amire verilecek bir dilekçeyle yapılır. Dilekçedeki imzanın sahibine ait olduğu, amir tarafından onanır ve doğruca bağlı bulunduğu bakanlığa veya kuruma derhal gönderilir. Dilekçe sahibine, dilekçenin alındığına dair bir belge ve mertebeler silsilesiyle amirlere de bilgi verilir. Aynı esaslar dairesinde telgrafla da müracaat yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dilekçenin bakanlığa veya kuruma geldiği tarihten itibaren, en geç on gün içinde ayrılma isteğinin kabul edildiği dilekçe sahibine ve amirlerine tebliğ olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Subay ve astsubayların savaş ve seferberlik hallerindeki ayrılma istekleri hariç olmak üzere, ayrılma hakkını kazanmış olanların, ayrılma istekleri reddedilemez. 1402 sayılı Sıkıyönetim Kanununun 2 nci maddesinin yedinci fıkrası hükmü saklıdır. Ayrılma istekleri kabul edilen subay ve astsubaylardan milletvekili seçilmemiş olanlar sonradan bu isteklerinden vazgeçemezler ve silahlı kuvvetlere dönemezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ayrılma hakkını kazanmamış olduklarından dolayı, ayrılma istekleri reddedilenler, aday listesine giremezler ve adaylıklarını koyamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ayrılma istekleri kabul edilenler, görev başında bulundukları sürece propaganda mahiyetinde hiç bir harekette bulunamazlar. Subaylar ile astsubaylar ve görevleri gereği resmi elbise giyenler, resmi elbiseyle propaganda yapamaz ve bu mahiyette herhangi bir harekette bulunamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Siyasi partilerin aday listelerini vermeleri">
      <mvz-fıkra no="1">
        <template>Siyasi partilerin genel merkezleri, seçime katılacakları seçim çevrelerine ait aday listeleri  Yüksek Seçim Kuruluna alındı belgesi karşılığında ön seçim gününden en geç on gün sonraki gün, saat 17.00'ye kadar verirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek Seçim Kurulu, bunları derhal il seçim kurullarına bildirir. Yüksek Seçim Kurulu, bütün siyasi partilerin aday listelerini Resmi Gazete ve radyo ile il seçim kurulları da kendi çevrelerine ait olanları alışılmış araçlarla geçici listeler halinde ilan ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Bağımsız adayların müracaatı">
      <mvz-fıkra no="1">
        <template>Bağımsız milletvekili adaylığı için yapılacak başvuru, adayın milletvekili seçilmek istediği çevrenin il seçim kurulu başkanlığına, bu Kanunun adaylık için aradığı şart ve nitelikleri taşıdığını belirten bir yazı ile  yapılır. Kurul başkanlığı başvurunun alındığına ilişkin bir belge verir ve derhal Yüksek Seçim Kuruluna duyurur. Yüksek Seçim Kurulu bu başvuruları, il seçim kurulları da kendi çevrelerine ait olanları, alışılmış araçlarla geçici listeler halinde ilan ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bağımsız adaylık için başvuranlar, en yüksek derecedeki Devlet memuruna mali haklar kapsamında yapılmakta olan her türlü ödemelerin bir aylık brüt tutarını ilgili mal sandığına emaneten yatırıp makbuzunu milletvekili seçilebilmek için gerekli başvurma belgelerine eklerler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Adaylara karşı itiraz">
      <mvz-fıkra no="1">
        <template>Adayların geçici olarak ilanından itibaren iki gün içinde il seçim kuruluna itiraz edilebilir. İtirazlar, İl seçim kurullarınca, en geç iki gün içinde karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlgililer, bu kararlara karşı iki gün içinde Yüksek Seçim Kuruluna itiraz edebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yüksek Seçim Kurulu, üç gün içinde ve en geç, kesin aday listelerinin ilanı gününe kadar bu itirazları karara bağlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Adayların incelenmesi">
      <mvz-fıkra no="1">
        <template>Bir il, bir kaç seçim çevresine bölünmüş olsa bile il seçim kurulları, kendi seçim çevrelerinin adayları hakkında yaptıkları inceleme sonunda, bu Kanunda yazılı adaylık şartlarında noksanlık veya aykırılık bulunduğunu görürlerse, durumu geçici ilan tarihinden itibaren iki gün içinde ilgili adaya, siyasi partilerin il başkanlarına ve Yüksek Seçim Kuruluna bildirirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Adayların ilanı">
      <mvz-fıkra no="1">
        <template>Adaylıklar kesinleştikten sonra, Yüksek Seçim Kurulu bütün adayları oy verme gününden önceki ellibeşinci gün, seçim çevreleri itibariyle Resmi Gazete ve radyo ile ilan eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İl seçim kurulları da kendi seçim çevrelerindeki adayları, Yüksek Seçim Kurulunun belirttiği tarihte, alışılmış araçlarla ilan ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Adaylıktan istifa ve ölüm">
      <mvz-fıkra no="1">
        <template>Aday listelerinin kesinleştiği tarihten, oy verme günü saat 17.00'ye kadar ölüm veya istifa nedeniyle aday listelerinde meydana gelecek eksilmeler, listelerin tamamlanmasını gerektirmez. Ancak, aday listelerinde yukarıdaki nedenlerle boşalma olması halinde listedeki adaylar liste sırasına göre kaydırılmak suretiyle boşalan yerler doldurulur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Seçim Günü İşleri">
    <mvz-madde no="26" başlık="Kullanılacak oy pusulasının şekli">
      <mvz-fıkra no="1">
        <template>Milletvekili seçimlerinde kullanılacak siyasi partilerin birleşik oy pusulaları ile bağımsız adayların oy pusulaları aşağıdaki esaslar dahilinde hazırlanır:</template>
        <mvz-bent no="a">
          <template>Oy pusulaları, 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunun 14 üncü maddesinin (1) numaralı bendindeki esaslara uygun olarak, kağıdında "Türkiye Cumhuriyeti Yüksek Seçim Kurulu" filigranı bulunan kağıtlara Yüksek Seçim Kurulu tarafından bastırılır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Birleşik oy pusulasının en üstüne "Siyasi Partiler ve Bağımsız Adaylar" ibaresi yazılır. Bu ibarenin altına seçime katılan siyasi parti temsilcileri huzurunda Yüksek Seçim Kurulu tarafından çekilen kura sırasına göre, en başta ve ortada partinin özel işaretinin altında kısaltılmış adı, onun altında da tam yazı halinde adı, onun altında koyu renkli harflerle parti genel başkanının adı ve soyadı, belirli bir aralık veya çizgiden sonra çapı iki santimetre olan bir boş daire basılır ve bütün bunların altı çizilir. Bu çizginin altına o partinin kesinleşen aday listesinde yer alan adayların ad ve soyadları, aldıkları sıra numarasına göre yazılır.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>İttifak yapan siyasi partiler, kuraya ittifak olarak dâhil edilir ve oy pusulasında yan yana yer alır. Bu partilerin ittifak içerisindeki sıraları da kurayla belirlenir. İttifak yapan siyasi partilerin sütunlarının üzerinde; kısa kenarı iki santimetre, uzun kenarı bu partilerin sütunlarının genişliği ile sütunlarının aralığı toplamı kadar olan, dikdörtgen şeklinde ittifak unvanının yer alacağı ortak bir bölüm bulunur. İttifakın unvanı yoksa, ittifak unvanı bölümüne yalnız “İTTİFAK” ibaresi yazılır. Unvanı olmayan ittifakın birden fazla olması halinde, bunlar başvuru sırasına göre numaralandırılır. İttifak unvanı bölümü ile aralarındaki boşluk dâhil ittifak yapan siyasi partilerin sütunlarının tamamı ittifak alanıdır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Siyasi parti sütunları arasında 0,75 santimetre ve iki çizgi ile belirlenmiş bir aralık bırakılır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bağımsız adaylar, birleşik oy pusulasının en sağ tarafındaki siyasi parti sütunundan sonra ve aynı hizada olmak üzere, 0,75 santimetre aralık bırakılarak, dikey ve kalın bir çizgi çizildikten sonra yerleştirilir. Bir seçim çevresinde birden fazla bağımsız aday varsa sıra, aralarında çekilecek kura ile belirlenir. Başta ve ortada bağımsız adayın adı ve soyadı yazılır. Belirli bir aralık veya çizgiden sonra çapı iki santimetre olan bir boş daire basılır ve bunların altı çizilir. Birden fazla bağımsız aday sütunları arasında, 0,75 santimetre ve iki çizgi ile belirlenmiş bir aralık bırakılır.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Siyasi parti sütunlarının altında bağımsız adaylara yer verilmez. Ancak, bağımsız aday sayısının fazla olması ve bunların oy pusulasına yerleştirilmesinin mümkün olmaması halinde, siyasi parti adaylarından sonra kalın bir çizgi çizildikten ve beş santimetre boşluk bırakıldıktan sonra tekrar bir çizgi çizilerek, kalan bağımsız adaylar filigranlı kağıt ebadına uygun olarak yerleştirilir.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Oy pusulasında, genel başkan ve adayların nüfus kimlik belgelerindeki ad ve soyadları tam olarak yazılır. Herhangi bir kısaltma, unvan veya sıfat kullanılamaz.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Birleşik oy pusulasında siyasi partilerin özel işaretleri, tüzüğüne uygun biçimde renkli olarak bastırılır. Siyasi partilerin oy pusulasında kullanılacak özel işareti, adı ve kısaltılmış adının belirlenmesinde parti tüzüğü esas alınır. Tüzüklerine göre, kısaltılmış adları mevcut olmayan siyasi partilerin, birleşik oy pusulalarında tam adı yazılır. Birleşik oy pusulalarında, bağımsız adaylar için herhangi bir özel işaret veya ibare kullanılamaz.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yurt dışı seçmenler tarafından kullanılacak birleşik oy pusulaları, bu maddede öngörülen usul ve esaslara göre hazırlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Birleşik oy pusulalarının mahalline yollanması ve mühürlenmesi">
      <mvz-fıkra no="1">
        <template>Her sandıkta kullanılacak birleşik oy pusulaları dörtyüzlük paketler haline getirilerek Yüksek Seçim Kurulunca numaralanıp mühürlendikten sonra yeteri kadar zarf ile birlikte seçim çevrelerine gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Paketleri alan ilçe seçim kurulları, hangi numaralı paketin hangi sandık kuruluna verildiğini bir tutanakla tespit eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Paketi alan sandık kurulu, oy verme günü, oy vermeye başlamadan evvel paketi açar ve birleşik oy pusulalarının tamamını sandık kurulu mühürü ile mühürler. Sandık kuruluna gelen seçmene bu oy pusulalarından bir adet verilirken sandık kurulu mühürünü taşıdığı ve hiçbir tarafında herhangi bir işaret bulunmadığı kurul üyelerine, müşahitlere ve seçmene gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Siyasi partilerin kesin adaylarının ad ve soyadları liste sırasına göre il seçim kurullarınca basılı listeler halinde oy verme ve sandık alanında görülebilir yerlere asılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Oyların kullanma şekli">
      <mvz-fıkra no="1">
        <template>Seçmen, Yüksek Seçim Kurulu tarafından yaptırılıp sandık kurullarına kadar ulaştırılmış bulunan ve sandık kurulu başkanında oy verme süresince bulundurulması mecburi olan ve birleşik oy pusulası ile birlikte kendisine verilen "Evet" yazılı mühürü alarak oyunu kullanmak üzere kapalı oy verme yerine girer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçmen, "Evet" mührünü sadece tercih ettiği siyasî partiye veya varsa yalnızca oy vermek istediği bağımsız adaya ait özel daire içine basmak ve oy pusulasını zarfa koymak suretiyle oyunu kullanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Oyunu kullanan seçmen oy pusulasını katlayarak zarfa koyar ve zarfı yapıştırır. "Evet" yazılı mühürü sandık kurulu başkanına geri verir ve oyunu sandığa atar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Seçmen, "Evet" mührünü bastığı siyasî partiye veya bağımsız adaya oy vermiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="6" durum="mülga">
        <template></template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Geçerli oyların hesabı">
      <mvz-fıkra no="1">
        <template>Bir seçim çevresinde seçime katılan siyasi partinin 28 inci maddenin ikinci fıkrası uyarınca almış olduğu geçerli oyların toplamı siyasi partinin o seçim çevresinde almış olduğu geçerli oyu gösterir.  Ancak aynı ittifak içerisindeki siyasi partilerin her birinin geçerli oyu; ittifakı oluşturan siyasi partilerin o seçim çevresinde tek başına aldıkları oy sayısına, ittifakın ortak oylarından gelen payın ilave edilmesiyle elde edilir. İttifak yapan her bir partiye ortak oylardan gelen pay; ittifak yapan siyasi partilerin tek başına aldıkları oyun bu partilerin toplam oyuna bölünmesi ile elde edilen katsayının ittifakın ortak oyu ile çarpımı sonucu elde edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bağımsız adayın almış olduğu geçerli oy, 28 inci maddenin ikinci fıkrası uyarınca elde ettiği geçerli oyların toplamıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci ve ikinci fıkralar uyarınca siyasi partiler ile bağımsız adayların aldıkları geçerli oyların toplamı o seçim çevresinin geçerli oylarını gösterir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ülke düzeyindeki geçerli oylar, bütün seçim çevrelerine ait geçerli oyların toplamıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Sayımın tutanağa geçirilmesi" durum="mülga">
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Seçimden Sonra Yapılacak İşler">
    <mvz-madde no="31" başlık="İlçelerde seçim sonuçlarının birleştirilmesi">
      <mvz-fıkra no="1">
        <template>İlçe seçim kurulu, sandık tutanaklarının birleştirilmesinde, siyasi partiler ile bağımsız adayların herbirinin aldıkları oy sayısını ve ittifakların ortak oy sayısı ile ortak oylarından gelen payı tespit ederek tutanağa geçirir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="32" başlık="İl Seçim kurullarında birleştirme">
      <mvz-fıkra no="1">
        <template>İl seçim kurulu, ilçe seçim kurullarından gelen tutanakları, yukarıdaki maddede belirtilen şekilde birleştirir ve her seçim çevresindeki;</template>
        <mvz-bent no="a">
          <template>Seçmenlerin sayısını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Oylarını kullanan seçmenlerin sayısını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İtiraz edilmiş veya ihtilaflı görülmüş olup da, geçerli sayılarak hesaba katılan oy pusulaları sayısını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Geçerli sayılmayan ve hesaba katılmayan oy pusulaları sayısını,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Geçerli sayılan ve hesaba katılan oy pusulaları genel toplamını,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Seçime katılmış olan siyasi partiler ve bağımsız adaylar ile ittifakların her birinin aldığı oy sayısını,</template>
        </mvz-bent>
        <mvz-bent no="g" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="h" durum="mülga">
          <template></template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Seçim çevrelerine göre ayrı ayrı tutanağa geçirir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="Genel baraj ve hesaplanması">
      <mvz-fıkra no="1">
        <template>Genel seçimlerde ülke genelinde, ara seçimlerde seçim yapılan çevrelerin tümünde, geçerli oyların yüzde yedisini geçmeyen partiler milletvekili çıkaramazlar.  Seçim ittifakı yapılması halinde, yüzde yedilik barajın hesaplanmasında ittifak yapan siyasi partilerin aldıkları geçerli oyların toplamı esas alınır ve bu siyasi partiler için ayrıca baraj hesaplaması yapılmaz. Bir siyasi parti listesinde yer almış bağımsız adayların seçilebilmesi de listesinde yer aldığı siyasi partinin ülke genelinde ve ara seçimlerde seçim yapılan çevrelerin tümünde yüzde yedilik barajı aşması ile mümkündür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İl seçim kurulları, yukarıdaki maddeye göre, birleştirme tutanağını düzenledikten sonra sonuçları en seri şekilde telgrafla, ayrıca telefon veya telsizle Yüksek Seçim Kuruluna bildirirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yüksek Seçim Kurulu, bütün illerden bu şekilde alınan bilgilere göre, Türkiye genelinde geçerli oyların toplamını yapar ve her siyasi partinin ve ittifakın aldığı geçerli oy toplamını genel geçerli oy toplamına bölerek, siyasi partilerin ve ittifakların ülke genelinde aldığı oy yüzdesini hesaplar ve yüzde yedilik barajı aşan siyasi partilerin ve ittifakların isimlerini il seçim kurullarına bildirir ve ilan eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu ilandan sonra, bir veya bir kaç seçim çevresinde, seçimin iptaline karar verilmesi ülke genelinde alınan oy yüzdesinin yeniden tespitini gerektirmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="34" başlık="Bir seçim çevresinde siyasi partiler, ittifaklar ve bağımsız adayların elde edecekleri milletvekili sayısının hesabı">
      <mvz-fıkra no="1">
        <template>Bağımsız adaylar ve 33 üncü maddede yazılı oranı aşan siyasi partiler ile bu oranı aşan ittifakı oluşturan partilerin, bir seçim çevresinde elde edecekleri milletvekili sayısı aşağıdaki şekilde hesaplanır:</template>
      </mvz-fıkra>
      <mvz-fıkra no="2" durum="iptal">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Seçime katılmış siyasi partilerin ve bağımsız adayların adları alt alta ve aldıkları geçerli oy sayıları da hizalarına yazılır. Siyasi partilerin oy sayıları, önce bire, sonra ikiye, sonra üçe.... ila o çevrenin çıkaracağı milletvekili sayısına ulaşıncaya kadar bölünür. Elde edilen paylar ile bağımsız adayların aldıkları oylar ayrım yapılmaksızın en büyükten en küçüğe doğru sıralanır. Seçim çevresinden çıkacak milletvekili sayısı kadar bu payların sahibi olan siyasi partilere  ve bağımsız adaylara rakamların büyüklük sırasına göre milletvekili tahsis olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Son kalan milletvekilliği için birbirine eşit rakamlar bulunduğu takdirde, bunlar arasında ad çekilmek suretiyle tahsis yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Seçime katılan siyasi partilerden veya ittifaklardan hiçbirisi yukarıdaki maddede yazılı oranı aşamamış ise milletvekilleri üçüncü ve dördüncü fıkra hükümlerine göre paylaştırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>İttifakın aldığı oy toplamı genel barajı geçtiği takdirde, seçim çevrelerinde milletvekili hesabı ve dağılımı, ittifak içerisinde yer alan her bir partinin o seçim çevresinde almış olduğu oy sayısı dikkate alınarak üçüncü fıkra hükümlerine göre yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="34/A" başlık="Siyasi partilerin çıkaracakları ülke seçim çevresi milletvekili sayısının hesabı" durum="iptal">
    </mvz-madde>
    <mvz-madde no="35" başlık="Siyasi parti adaylarından seçilenlerin tespiti">
      <mvz-fıkra no="1">
        <template>İl seçim kurulu başkanı alınan sonuçlara göre, o seçim çevresinden; siyasi parti aday listelerinde ve varsa bağımsız adaylardan seçilenleri tespit eder ve tutanağın bir suretini o seçim çevresinde ilan ettirir. Diğer bir suretini, bir hafta süre ile il seçim kurulu kapısına astırır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Milletvekili seçilenlerin Yüksek Seçim Kuruluna bildirilmesi ve tutanakların verilmesi">
      <mvz-fıkra no="1">
        <template>Milletvekili seçilenler belli olur olmaz, seçilenlerin ad ve soyadları ve parti adayı iseler mensup oldukları siyasi parti, il seçim kurullarınca en seri şekilde telgrafla, ayrıca telefon veya telsiz ile seçim çevreleri de gösterilerek Yüksek Seçim Kuruluna bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Milletvekili seçilenlere il seçim kurulu tarafından, milletvekili seçildiklerine dair derhal bir tutanak verilir. Bu tutanaklardan iki örneği de Yüksek Seçim Kurulu Başkanlığına en seri vasıtayla gönderilir.  Yüksek Seçim Kurulu Başkanlığı tutanaklardan birini Türkiye Büyük Millet Meclisi Başkanlığına verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Seçim sonuçlarının yayımı">
      <mvz-fıkra no="1">
        <template>Yukarıdaki maddenin birinci fıkrası uyarınca il seçim kurullarından bilgi verildikçe, Yüksek Seçim Kurulu bu bilgileri bekletmeden radyo ve televizyon ile derhal yayımlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bütün illerden verilecek bilgiler tamamlanır tamamlanmaz, tasdikli tutanak suretlerinin alınması veya itiraz varsa bu itirazın incelenerek karara bağlanması beklenmeksizin, her partinin kazandığı milletvekili sayısı ve milletvekili seçilenlerin ad ve soyadları Yüksek Seçim Kurulunca Türkiye Radyo ve Televizyonları ile derhal yayımlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Seçim sonuçlarını gösteren tutanakların bütün illerden gönderilmesi üzerine, Yüksek Seçim Kurulu, en kısa zamanda Radyo ve Televizyon ve Resmi Gazete ile ikinci bir bildiri yayımlayarak, iller ve seçim çevreleri itibariyle, milletvekili seçilenlerin ad ve soyadlarını, seçmen sayısını, oy kullanan seçmen sayısını, katılma oranını, geçerli oy pusulası sayısını her parti ile bağımsız adayların kazandıkları oy sayısını açıklar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Devlete ait bütün ulaştırma ve haberleşme araçları, seçim kurulları arasında seçimle ilgili haber, yazı, bilgi ve malzemenin ulaştırılmasında öncelikle kullanılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="38" başlık="Seçim sonuçlarının Devlet İstatistik Enstitüsü Başkanlığı tarafından yayımlanması">
      <mvz-fıkra no="1">
        <template>Devlet İstatistik Enstitüsü Başkanlığı, Yüksek Seçim Kurulu tarafından kendisine verilecek belgelere dayanarak, iller, seçim çevreleri ve ilçeler, seçim bölgeleri ve sandık bölgeleri itibariyle, sandık kurulları tutanaklarında bulunan bilgileri en geç, seçimi takip eden bir yıl içinde yayımlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="39" başlık="Seçimin veya tutanağın iptali">
      <mvz-fıkra no="1">
        <template>Oyların dökümüne, sayımına veya bu oyların partiler ile bağımsız adaylara bölümüne ilişkin olarak milletvekili tutanaklarına yapılan itiraz üzerine yeniden yapılan döküm, sayım ve hesap sonucunda tutanakların iptaline karar verildiği takdirde, yeniden yapılacak döküm, sayım ve hesap sonucuna göre seçilmiş oldukları anlaşılanlara Yüksek Seçim Kurulu tarafından tutanakları verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir seçim çevresinde yapılan seçimin, seçim işlemleri sebebiyle iptaline karar verildiği takdirde, o seçim çevresinde yeniden seçim yapılır ve Yüksek Seçim Kurulu seçimin iptaline dair kararla birlikte o çevrede, seçimin yapılacağını Resmi Gazete ve diğer vasıtalarla derhal ilan eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu ilandan sonra gelen doksanıncı günü takip eden ilk Pazar günü oy verme günüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıdaki fıkralar dışında milletvekillerinden bir veya birkaçının tutanaklarının iptaline karar verildiği takdirde, tutanakları iptal olunan milletvekilleri yerine, 34 ve 35 inci madde esaslarına göre sıradaki adaya tutanak verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Sırada olanlar yetmediği takdirde, açık kalan milletvekillikleri için Kanunun ara seçimi hakkında kabul ettiği hükümlere uyulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="40" başlık="Seçim belgelerinin saklanması">
      <mvz-fıkra no="1">
        <template>Hesaba katılan ve katılmayan ve itiraza uğramış olan oy pusulaları, sayım ve döküm cetvelleri ve milletvekilliğine seçilme tutanakları ve seçimle ilgili diğer her türlü evrak, iki yıl süre ile ilçelerde ilçe seçim kurulu başkanı, illerde il seçim kurulu başkanı tarafından saklanır ve Yüksek Seçim Kurulunun talebi olmadıkça hiçbir yere gönderilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Çeşitli Hükümler">
    <mvz-madde no="41" başlık="Bağımsız adayların emaneten yatırdıkları para hakkında yapılacak işlemler">
      <mvz-fıkra no="1">
        <template>Milletvekili seçimi sonucunda bağımsız adayın aldığı oy seçilmesine yetmezse emanete alınan para Hazineye gelir yazılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ölen veya kanuni süre içinde adaylıktan vazgeçen veya adaylıkları reddedilen veya yukarıdaki fıkrada belirtilen sayıdan çok oy alan bağımsız adaylara veya kanuni mirasçılarına seçimden sonra müracaat etmeleri halinde emanetteki para geri verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Özel hüküm bulunmayan hallerdeki uygulama">
      <mvz-fıkra no="1">
        <template>Bu Kanunda özel hüküm bulunmayan hallerde, 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunun bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüksek Seçim Kurulu, milletvekili seçimlerinin sağlıklı ve düzenli bir şekilde gerçekleşmesini sağlamak amacıyla gerekli ilke kararları almaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Değiştirilen Kanun Hükümleri">
    <mvz-madde no="43" başlık="">
      <mvz-fıkra no="1">
        <template>26/4/1961 tarih ve 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunun maddelerinde bulunan “Cumhuriyet Senatosuna ilişkin hükümler” madde metinlerinden çıkarılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="">
      <mvz-fıkra no="1">
        <template>-61: Bu maddeler 24 Nisan 1961 tarih ve 298 sayılı “Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun” un 7, 14, 52, 103, 149, 151, 152, 153, 157, 159, 160, 161, 162, 164, 168, 169, 170 ve 180 inci maddelerinde değişiklik yapılmasına dair olup adı geçen kanundaki yerlerine işlenmişlerdir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="62" başlık="">
      <mvz-fıkra no="1">
        <template>22 Nisan 1983 tarih ve 2820 sayılı “Siyasi Partiler Kanunu”nun geçici 6 ncı maddesinin değiştirilmesine dair olup adı geçen kanundaki yerine işlenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Geçici Hükümler">
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten sonra yapılacak milletvekili seçimi için oy verme günü 6 Kasım 1983 tarihidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçim döneminin başlangıç tarihi Yüksek Seçim Kurulunca, yukarıdaki fıkrada belirtilen oy verme günü esas alınarak tespit ve ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yüksek Seçim Kurulu, bu Kanun ile 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanun ve 2820 sayılı Siyasi Partiler Kanununun seçimlere ilişkin olarak tespit ettiği süreleri kısaltarak uygulayabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>6 Kasım 1983 tarihinde yapılacak Türkiye Büyük Millet Meclisi seçimlerinin bu Kanunun 6 ncı maddesinde öngörülen beş yıllık süresinin hesabında, oy verme günü olarak Ekim 1983 ayının ikinci Pazar gününün tarihi esas alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten sonra yapılacak ilk milletvekili seçiminde siyasi partilerin seçime katılabilmeleri için büyük kongrelerini yapmış olmaları şartı aranmaz. Ancak, Yüksek Seçim Kurulunca tespit ve ilan edilecek seçim döneminin başlangıç tarihine kadar illerin en az yarısında teşkilat kurmuş olmaları gerekir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>2820 sayılı Siyasi Partiler Kanununun geçici dördüncü maddesinde, siyasi parti kurucuları üzerinde, Milli Güvenlik Konseyinin incelemede bulunmak ve haklarında olumsuz karar alınanların değiştirilmesini talebetmek yetkisi, aynı kanunun geçici altıncı maddesine göre, bu Kanunun yürürlüğe girmesini müteakip yapılacak ilk milletvekili genel seçimleri için siyasi partilerin kurucular kurulunca tespit edilecek milletvekilleri adayları hakkında da aşağıdaki esaslara göre uygulanır.</template>
        <mvz-bent no="a">
          <template>Milli Güvenlik Konseyi; Siyasi Partilerce hazırlanan milletvekili aday listelerini, Yüksek Seçim Kurulu Başkanlığı tarafından geçici olarak ilan edildiği tarihten itibaren oniki gün içinde inceler.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yukarıdaki (a) bendi hükümlerine göre yapılan inceleme sonunda Milli Güvenlik Konseyince hakkında olumsuz karar alınan milletvekili adaylarının isimleri ilgili siyasi parti listelerinden çıkartılmak üzere Yüksek Seçim Kurulu Başkanlığına bildirilir. Milli Güvenlik Konseyinin adaylar hakkında aldığı bu karar kesindir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Milli Güvenlik Konseyinin (a) bendi uyarınca ilk incelemesi sırasında haklarında olumsuz karar alınması nedeniyle siyasi parti aday listelerinden çıkartılan milletvekili adaylarının yerine, ilgili siyasi partiler iki gün içinde yeni adaylarını birer yedeği ile beraber sıralarını da belirtmek suretiyle Yüksek Seçim Kurulu Başkanlığı aracılığıyla Milli Güvenlik Konseyine bildirebilirler.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Milli Güvenlik Konseyi bildirilen bu adaylar üzerindeki incelemesini yedi gün içinde tamamlar.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Yapılan inceleme sonunda Milli Güvenlik Konseyince adaylıkları olumlu görülenlerin adları Yüksek Seçim Kurulu Başkanlığına bildirilir.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kanunun siyasi partilerin seçimlere katılabilmelerine ilişkin hükümleri saklı kalmak koşuluyla Milli Güvenlik Konseyi tarafından olumsuz karar alınmak suretiyle listeden çıkartılmış bulunan adaylar nedeniyle listenin, herhangi bir nedenle tamamlanamamış olması o siyasi partinin kalan adaylarla seçime katılmasına engel olmaz.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten sonra yapılacak ilk milletvekili genel seçiminde; Milli Güvenlik Konseyi, Yüksek Seçim Kurulu Başkanlığı tarafından geçici olarak ilan edilen listedeki bağımsız adayların durumunu, ilan tarihinden itibaren oniki gün içinde inceler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hakkında olumsuz karar alınan bağımsız aday, listeden çıkarılmak üzere Yüksek Seçim Kurulu Başkanlığına bildirilir. Milli Güvenlik Konseyinin bağımsız adaylar hakkında aldığı bu kararlar kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesini müteakip, yapılacak ilk milletvekili genel seçimlerinde, seçmenler “Evet” mühürünü sadece tercih ettiği siyasi partiye veya varsa yalnızca bir bağımsız adaya ait özel daire içine basmak suretiyle oylarını kullanırlar. Adaylar için tercih işareti kullanılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçmen tarafından ilgili siyasi partiye ait özel daire içine mühür basıldıktan sonra o partiye ait listede tercih işaretleri konmuş ise bu işaretler oy pusulasını geçersiz kılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sayımın tutanağa geçirilmesi, ilçelerde, il seçim kurullarındaki birleştirme işlemleri yukarıdaki fıkraların esasları gözönünde bulundurularak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>34 üncü madde uyarınca partilerin kazandığı milletvekillikleri sayısı tespit edildikten sonra birleşik oy pusulasında yeralan parti listesindeki sıraya göre o partiden milletvekilliğine seçilenler tespit edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren en geç otuz gün içinde Yüksek Seçim Kurulu tarafından son genel nüfus sayımı sonuçlarına göre, 4 üncü madde uyarınca seçim çevreleri ve her seçim çevresinin çıkaracağı milletvekili sayısı tespit edilerek Resmi Gazete, radyo ve televizyonla ilan edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten sonraki ilk milletvekili genel seçimlerinde ilçe seçim kurulu, bir başkan ile altı asıl ve altı yedek üyeden oluşur. İlçe seçim kurulunun iki asıl ve iki yedek üyesi memurlar arasından, dört asıl ve dört yedek üyesi seçim çevresinde seçime katılmış siyasi parti üyeleri arasından seçilir. O seçim çevresinde dörtten fazla siyasi parti seçime katılmış ise, ilçe seçim kurulunun partili asıl üyelerinin hangi partilerden alınacağı, ilçe seçim kurulu başkanı tarafından kura ile tespit edilir. Bu halde partili yedek üyeler asıl üyelik alamayan siyasi partilere öncelik verilmek suretiyle aynı şekilde kura ile belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu seçim çevresinde dörtten az siyasi parti seçime katıldığı takdirde ilçe seçim kurulunun boş kalan üyelikleri, parti üyesi olmayan ve bu görevi yapabilecek kişilerin seçilmesi suretiyle tamamlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten sonraki ilk milletvekili genel seçimlerinde sandık kurulu bir başkan ile altı asıl ve altı yedek üyeden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlçe seçim kurulu başkanı;</template>
        <mvz-bent no="a">
          <template>Sandık kurulunun başkanı ile iki asıl ve iki yedek üyesini memurlar arasından,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sandık kurulunun partili dört asıl ve dört yedek üyesini o seçim çevresinde seçime katılmış bulunan siyasi parti üyeleri arasından,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Seçer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>O seçim çevresinde dörtten fazla siyasi parti seçime katılmış ise her sandık kurulu için ayrı ayrı olmak üzere ilçe seçim kurulu başkanı tarafından kura ile sandık kurullarının asıl üyeliğinin hangi siyasi partilere verileceği tespit edilir. Bu halde sandık kurullarının partili yedek üyeleri asıl üyelik alamayan siyasi partilere öncelik verilmek suretiyle aynı şekilde kura ile belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sandık kurulu üyesi olarak görevlendirilecek memur bulunamadığı veya o seçim çevresinde dörtten az siyasi parti seçime katıldığı takdirde, kurulun boş kalan üyelikleri parti üyesi olmayan ve bu görevi yapabilecek kişilerin seçilmesi suretiyle tamamlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yapılacak ilk milletvekili genel seçimlerinde;</template>
        <mvz-bent no="a">
          <template>Önceden kütüğe yazıldıkları halde oy verme tarihinde kısıtlı veya kamu hizmetlerinden yasaklı olanlar veya ceza infaz kurumlarında hükümlü veya tutuklu olarak bulunanlar oy kullanamazlar.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yazım veya güncelleştirme sırasında hükümlü veya tutuklu oldukları için kütüğe yazılmayanlardan, bilahare tahliye edilenler oy verme gününden önceki onbeşinci gün saat 17.00’ye kadar ikametgahlarının bulunduğu yer ilçe seçim kuruluna tahliye edildiklerine ilişkin belge ile birlikte başvurmaları ve oy verme yeterliğine sahip olmaları halinde sürenin geçmiş ve kütüğün kesinleşmiş olmasına bakılmaksızın kütüğe ve ikametgahlarının bulunduğu sandık listelerine dahil edilmelerine ilçe seçim kurullarınca karar verilir.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İlk milletvekili genel seçiminde kullanılacak seçmen kütüklerinin yazım veya güncelleştirilmesi sırasında yurt dışında bulunan Türk vatandaşları seçim gününden önceki onbeşinci gün saat 17.00’ye kadar ikametgahlarının bulunduğu yer ilçe seçim kuruluna pasaportlarıyla başvurmaları ve oy verme yeterliğine sahip olmaları halinde sürenin geçmiş ve kütüğün kesinleşmiş olmasına bakılmaksızın kütüğe ve sandık listelerine dahil edilmelerine ilçe seçim kurullarınca karar verilir ve durum, hangi sandıkta oy kullanabilecekleri de belirtilmek suretiyle pasaportlarına işlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İlk milletvekili genel seçiminde kullanılacak seçmen kütüklerinin yazım veya güncelleştirilmesi sırasında er, onbaşı, kıta çavuşu veya askeri öğrenci oldukları için kütüğe yazılmayanlardan; terhis edilen veya askerlikle ilişiği kesilenler ile subay veya astsubay olanlar oy verme gününden önceki onbeşinci gün saat 17.00 ye kadar ikametgahlarının bulunduğu yer ilçe seçim kurullarına bu durumlarına ilişkin belge ile birlikte başvurmaları ve oy verme yeterliğine sahip olmaları halinde sürenin geçmiş ve kütüğün kesinleşmiş olmasına bakılmaksızın kütüğe ve ikametgahlarının bulunduğu sandık listelerine dahil edilmelerine ilçe seçim kurullarınca karar verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="" tür="Geçici" durum="mülga">
    </mvz-madde>
    <mvz-madde no="13" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>10.6.1983 tarih ve 2839 Sayılı Milletvekili Seçimi Kanununun 27.10.1995 Tarih ve 4125 Sayılı Kanunla Değişik 20 nci maddesinin birinci fıkrasındaki on günlük süre, 20 nci Dönem Milletvekili Seçimlerinde onbeş gün olarak uygulanır ve bu süre kısaltılamaz. Yüksek Seçim Kurulu seçim takvimi düzenlemesini buna göre yapar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="" tür="Geçici" durum="iptal">

  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Son Hükümler">
    <mvz-madde no="63" başlık="Seçimde oy kullanmayanlar">
      <mvz-fıkra no="1">
        <template>Seçmen kütüğünde kaydı ve sandık listesinde oy kullanma yeterliği bulunduğu halde, Milletvekilliği genel ve ara seçimlerinde meşru mazeretleri olmaksızın katılmayanlar, ilçe seçim kurulu başkanı tarafından onbin lira para cezasıyla cezalandırılırlar. Bu karar kesindir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="64" başlık="Yürürlükten kaldırılan kanunlar">
      <mvz-fıkra no="1">
        <template>24/5/1961 tarih ve 304 sayılı Cumhuriyet Senatosu Üyelerinin Seçimi Kanunu ile 25/5/1961 tarih ve 306 sayılı Milletvekili Seçimi Kanunu ve bu kanunların bütün ek ve değişiklikleri yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>

    <mvz-madde no="66" başlık="Yürütme">
