  <mvz-künye tür="kanun" no="2684" başlık="İLKÖĞRETİM VE ORTAÖĞRETİMDE PARASIZ YATILI VEYA BURSLU ÖĞRENCİ OKUTMA VE BUNLARA YAPILACAK SOSYAL YARDIMLARA İLİŞKİN KANUN"
             tarih="17/6/1982" rgazete-tarih="19/6/1982" rgazete-sayı="17729"
             düstur-tertip="5" düstur-cilt="21" düstur-sayfa="353" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Esaslar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, Milli Eğitim Bakanlığına bağlı ilköğretim ve ortaöğretim kurumlarında öğrencilerin parasız yatılı veya burslu okumalarına ve bunlara yapılacak sosyal yardımlara ilişkin esasları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, Milli Eğitim Bakanlığına bağlı ilköğretim ve ortaöğretim kurumlarında parasız yatılı veya burslu okumaya hak kazanan öğrencileri kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen:</template>
        <mvz-bent no="a">
          <template>“Parasız yatılı okuma” sözünden, bu Kanunda belirtilen şartları taşıyan öğrencilerin ilköğretim ve ortaöğretim kurumlarında karşılıksız olarak barındırılmak, beslenmek, giydirilmek ve kendilerine harçlık verilmek suretiyle okutulmaları;</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>“Burslu okuma” sözünden, bu Kanunda belirtilen şartları taşıyan öğrencilerin ilköğretim ikinci kademe ve ortaöğretim kurumlarında Cumhurbaşkanı kararı ile tespit edilecek miktarda karşılıksız olarak para yardımı yapılması suretiyle okutulmaları;</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Anlaşılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Parasız Yatılı ve Burslu Okuma ile İlgili Hükümler">
    <mvz-madde no="4" başlık="Parasız yatılı ve burslu okuyacak öğrencilerin tespiti">
      <mvz-fıkra no="1">
        <template>Milli Eğitim Bakanlığı, ilköğretim ve ortaöğretim kurumlarında, kalkınma planlarında öngörülen hedefler doğrultusunda parasız yatılı ve burslu öğrenci okutur. Parasız yatılı ve burslu okumak için maddi imkanlardan yoksun ve başarılı olmak esastır. Ancak sınavsız olarak parasız yatılı öğrenciliğe kabul edilenler ile 6972 sayılı Korunmaya Muhtaç Çocuklar Hakkında Kanuna göre yetiştirme yurtlarından gelen veya aynı Kanun gereğince haklarında tedbir kararı verilmiş olan öğrencilerden, parasız yatılı veya burslu okumak isteyenlerin ailelerinin maddi durumları dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Parasız yatılı ve burslu öğrenci kontenjanları illerin, gelişmişlik durumları ve öğrenci sayıları dikkate alınarak her yıl Milli Eğitim Bakanlığınca tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Parasız yatılı okuma veya burslu okuma hakkından yararlanacak öğrencilere ait kontenjanların, 6972 sayılı Korunmaya Muhtaç Çocuklar Hakkında Kanunda yer alan korunmaya muhtaç çocuklar, öğretmen çocukları ve oturdukları yerde ilköğretim kurumu bulunmadığından öğrenim hakkından yararlanamayan çocuklar için tespitine ve bunlara ait yüzdeler karşılığındaki sayıların belirlenmesine dair esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Parasız yatılı olarak okutulacak veya burs verilecek öğrencilerin sayısı, seçilmeleri, sınavları ve kabulleri ile ilgili esaslar her yıl Milli Eğitim Bakanlığınca ilan edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Sınavsız olarak parasız yatılı alınacak öğrenciler">
      <mvz-fıkra no="1">
        <template>Durumları 5434 sayılı T. C. Emekli Sandığı Kanununun 65 nci maddesinin (d) fıkrası, 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanun, 2453 sayılı Yurt Dışında Görevli Personele Tazminat Verilmesi ve Aylık Bağlanması Hakkında Kanun ile 2566 sayılı Bazı Kamu Görevlilerine Nakdi Tazminat Verilmesi ve Aylık Bağlanması Hakkında Kanun hükümlerine uyan kişilerin çocukları; doğal afetler, savaş ve olağanüstü haller sebebiyle korunmaya muhtaç duruma düşmüş olan çocuklar ve ayrıca görev yaptıkları yerde çocuğunun devam edeceği düzeyde okul bulunmayan öğretmenlerin çocuklarından Milli Eğitim Bakanlığınca tespit edilecek kontenjan kadarı sınavsız olarak parasız yatılı öğrenciliğe alınırlar. Ancak, bu gibi öğrencilerden özel giriş sınavı ve kayıt - kabul şartları bulunan eğitim - öğretim kurumlarına alınacakların, bu kurumların kayıt - kabul şartlarını taşımaları ve sınavlarını kazanmaları gereklidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ayrıca, Milli Eğitim Bakanlığınca belirlenecek esaslar ve kontenjan dahilinde, Cumhurbaşkanlığının müsaadesi alınarak yabancı uyruklu öğrencilere de sınavsız olarak parasız yatılılık hakkı tanınabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci ve ikinci fıkralarda belirtilenler dışında, Milli Eğitim Bakanlığınca tespit edilecek yerlerde görev yapan öğretmenlerin çocukları da sınavsız olarak parasız yatılı öğrenciliğe alınırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Parasız yatılı veya burslu okuma süresi">
      <mvz-fıkra no="1">
        <template>Durumları 11 nci madde hükümleri dışında kaldığı sürece, ilköğretim ve ortaöğretim kurumlarında parasız yatılı veya burslu okuyan öğrencinin parasız yatılı veya burslu okuma durumu ortaöğretimini tamamlayıncaya kadar devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Burs ödeme">
      <mvz-fıkra no="1">
        <template>İlköğretim ikinci kademe ve orta öğretim kurumları öğrencilerine Maliye ve Gümrük Bakanlığı ile Milli Eğitim Gençlik ve Spor Bakanlığınca müştereken tespit edilen miktar kadar burs verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Burslu öğrencilerin bursları, burs almaya hak kazandıkları tarihi takip eden aybaşından itibaren okullarınca ödenir. Ödemeye tatil aylarında da devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Son sınıf öğrencilerinden okulu bitirenlerin bursları, güz dönemi sınavlarının sona erdiği tarihi takip eden aybaşında kesilir. Ancak, ilköğretim ikinci kademe son sınıf öğrencilerinin bursları ortaöğretim kurumlarına devam etmeleri halinde kesilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Parasız yatılı öğrencilere ayrıca burs verilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Parasız yatılı ve burslu okuma arasında geçişler">
      <mvz-fıkra no="1">
        <template>Bir defaya mahsus olmak üzere parasız yatılı öğrenciler burslu, burslu öğrenciler parasız yatılı öğrenciliğe geçirilebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Başka kurum burslarından faydalanma">
      <mvz-fıkra no="1">
        <template>Parasız yatılı veya burslu okuma imkanından faydalanan öğrenciler, başka kurumlarca verilen bursu seçtikleri takdirde bu Kanunda öngörülen parasız yatılı veya burslu okuma haklarından faydalanamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Sosyal yardımlar">
      <mvz-fıkra no="1">
        <template>Parasız yatılı öğrencilere eğitim araç ve gereçleri, yiyecek, giyecek, harçlık ve diğer ihtiyaçları ile ilgili sosyal yardımlar yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Parasız yatılı ve burslu öğrencilerin muayene ve tedavi giderleri Milli Eğitim Bakanlığınca karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Parasız yatılı veya burslu öğrenciliğin sona ermesi">
      <mvz-fıkra no="1">
        <template>Aşağıdaki hallerde parasız yatılı veya burslu okuma hakkı sona erer:</template>
        <mvz-bent no="a">
          <template>İlköğretim kurumlarının birinci ve ikinci kademesi ile ortaöğretim kurumlarındaki öğrenimlerinin her birinde bir defadan fazla bir üst sınıfa devam etme hakkını kazanamamak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Taksirli suçlar ile kabahat nevinden olanlar hariç olmak üzere ertelenmiş olsa dahi bir suçtan dolayı mahkum olmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bir öğretim yılı veya daha fazla okul ile ilişiğini kesen disiplin cezası almış olmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Milli Eğitim Bakanlığınca kabul edilebilir bir mazerete dayanmaksızın kendiliğinden öğrenimini terk ederek okuldan ayrılmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Parasız yatılı veya burslu okumaktan vazgeçmek.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Tatil aylarında okulda kalacak öğrenciler">
      <mvz-fıkra no="1">
        <template>Tatil aylarında parasız yatılı öğrencilerden kalacak yeri olmayanların okullarda veya belli yerlerde toplanmak suretiyle barındırılmalarına ve sosyal yardımlardan faydalandırılmalarına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Parasız yatılı ve burslu okumanın karşılıksız oluşu">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre parasız yatılı veya burslu okumak suretiyle okulu bitirenlerle herhangi bir sebeple okuldan ayrılan öğrenciler hiçbir şekilde mecburi hizmet, tazminat veya geri ödeme ile yükümlü tutulmazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Çeşitli Hükümler">
    <mvz-madde no="14" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>İlköğretim ve ortaöğretim kurumlarının parasız yatılı veya burslu olarak alınacak öğrencilerde aranacak şartlara; seçme – sıralama sınavlarına; kontenjanların tespiti ile dağıtımına; parasız yatılı öğrencilikten burslu öğrenciliğe, burslu öğrencilikten parasız yatılı öğrenciliğe geçirilmeye; sosyal yardımlara; parasız yatılı veya burslu öğrenciliğin sona ermesine; parasız yatılı veya burslu öğrencilerin bir okuldan başka bir okula nakillerine ilişkin hususlarla bu Kanunun uygulanmasına ilişkin diğer hususlar, Cumhurbaşkanınca çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Yürürlükten kaldırılan kanunlar">
      <mvz-fıkra no="1">
        <template>Aşağıdaki kanunlar yürürlükten kaldırılmıştır.</template>
        <mvz-bent no="a">
          <template>8/6/1926 tarih ve 915 sayılı Lise ve Orta Mekteplere Alınacak Leyli Meccani Talebe Hakkında Kanun ile bu Kanuna Müzeyyel 19/5/1932 tarih ve 1967 sayılı Kanun.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>5/5/1928 tarih ve 1237 sayılı Meccani Leyli Talebenin Mecburi Hizmetlerine Dair Kanun ile bu Kanuna Müzeyyel 30/5/1929 tarih ve 1484 sayılı ve 25/5/1938 tarih ve 3400 sayılı kanunlar.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>2684 sayılı Temeleğitim ve Orta öğretimde Parasız Yatılı veya Burslu Öğrenci Okutma ve Bunlara Yapılacak Sosyal Yardımlara İlişkin Kanunda ve diğer kanunlarda geçen “Temeleğitim” deyimi “İlköğretim” olarak değiştirilmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yayımı tarihinden önce İlköğretim ve ortaöğretim kurumlarında parasız yatılı veya burslu olarak öğrenimlerine devam etmekte olanlar bu Kanun hükümlerinden, daha önce okuldan her ne sebeple olursa olsun ayrılmış veya mezun olmuş öğrenciler ise bu Kanunun sadece 13 ncü maddesi hükmünden faydalanırlar. Ancak kanunun yayımı tarihine kadar ödenmiş olan parasız yatılı veya burs karşılığı paralar geri verilmez ve hizmet karşılığı aranmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre çıkarılacak yönetmelik yürürlüğe konuluncaya kadar mevcut yönetmeliğin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Parasız yatılı okulların kapasitelerinin artırılması maksadıyla beş yıllık bir plan hazırlanır ve bunun uygulanması için bütçede yeterli ödenek ayrılır. Öngörülen kapasiteye ulaşılıncaya kadar öğretmen çocuklarından sınavsız olarak parasız yatılı alınacak öğrenciler için boş pansiyon kapasitelerinden yararlanılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
