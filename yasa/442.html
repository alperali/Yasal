  <mvz-künye tür="kanun" no="442" başlık="KÖY KANUNU"
             tarih="18/3/1924" rgazete-tarih="7/4/1924" rgazete-sayı="68"
             düstur-tertip="3" düstur-cilt="5" düstur-sayfa="336" />
    
  <mvz-fasıl no="1-BİRİNCİ" başlık="(Birinci Fasıl)">
    <mvz-madde no="1" başlık="">
      <mvz-fıkra no="1">
        <template>Nüfusu iki binden aşağı yurtlara (köy) ve nüfusu iki bin ile yirmi bin arasında olanlara (kasaba) ve yirmi binden çok nüfusu olanlara (şehir) denir. Nüfusu iki binden aşağı olsa dahi belediye teşkilatı mevcut olan nahiye, kaza ve vilayet merkezleri kasaba itibar olunur. Ve Belediye Kanununa tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="">
      <mvz-fıkra no="1">
        <template>Cami, mektep, otlak, yaylak, baltalık gibi orta malları bulunan ve toplu veya dağınık evlerde oturan insanlar bağ ve bahçe ve tarlalariyle birlikte bir köy teşkil ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="">
      <mvz-fıkra no="1">
        <template>Bu kanunun hükmü başlar başlamaz her köyün sınırı ihtiyar meclisi tarafından bir kağıda yazılır. Sınır için komşu köyler ile aralarında uzlaşamadıkları yerler varsa bu da gösterilir ve yazılan sınır kağıdı ihtiyar meclisince mühürlenerek nahiye müdürüne gönderilir. Nahiye müdürü de bu sınır kağıdını kaza veya vilayete gönderir. Oralarda idare meclisince sınır kağıdı tetkik ve tasdik olunduktan sonra tasdikli bir örneği tekrar köy ihtiyar meclisine verilmek üzere nahiye müdürüne yollandığı gibi asıl sınır kağıdı da tasdikli olarak tapu idaresine verilir. İki köy arasında uzlaşılamayan sınırlar için idare meclisleri tahkikat ve tetkikat yaparak sınırı beşinci maddeye göre çizip her iki köye de tasdikli birer örneğini gönderir ve bu katidir. Kazadaki bütün köylerin tasdikli sınır kağıtları tapuca bir deftere yazılıp defterin altı idare meclisine tasdik ettirilir. Ayrıca bu tasdikli defterin bir sureti de tapuca çıkarılıp idare meclisinde saklanmak üzere verilir. Köy sınırlarına ait işlerde Devlet daireleri ve mahkemelerce bu tasdikli defterler esastır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="">
      <mvz-fıkra no="1">
        <template>Bir köyün sınırı aşağıda tarif edildiği şekilde çizilir.</template>
        <mvz-bent no="1.">
          <template>Eskiden beri bir köyün sayılan bütün tarla, bağ, bahçe, çayır, zeytinlik palamutluk, baltalık ve ortaklar sınır içinde kalmalı.</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Dağlık ve ormanlık havalide ötede beride dağınık olan evler, tarlalar, meralar parça parça en yakın köye bağlı sayılmakla beraber bunlar sınır haricinde bırakılmalı yalnız her birinin adı sınır kağıdının altında yazılmalı.</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Sınır mümkün olduğu kadar kolay anlaşılacak surette dereler, tepeler, yollar veya diğer değişmiyen işaretli yerlerden geçmeli ve bu dere, tepe ve yolların veya işaretli yerlerin köylüce adları ne ise behemehal sınırda sırasiyle yazılmalı.</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>Eğer bir köyün sınırını derelerden, tepelerden, yollardan veya diğer değişmiyen işaretli yerlerden geçirmek kabil olmazsa o halde sınır mümkün olduğu kadar düz yapılmalı ve büyük taşlar dikilerek sınır gösterilmeli.</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>Bir köy ahalisinden bazı kimselerin başka bir köy arazisi içinde kalan dağınık tarla, bağ, bahçe gibi yerleri sahibinin bulunduğu köyün sınırında değil öteki köyün sınırında gösterilmeli.</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>Bir köyün sınırı mutlaka diğer köyün sınıriyle birleşmek lazım gelmez. İki köyün sınırları arasında eskidenberi hiçbir köyün malı sayılmıyan boş arazi, dağlar, ormanlar, yaylaklar varsa bunlar gene sınırın dışında bırakılmalı.</template>
        </mvz-bent>
        <mvz-bent no="7.">
          <template>Bir köyün malı olan yaylaların o köy ihtiyar meclisi tarafından ayrıca sınırı çizilmekle beraber bu sınır kağıdı asıl köyün sınır kağıdı ile birleştirilmeli.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="">
      <mvz-fıkra no="1">
        <template>İki köy arasında nizalı sınırların çizilmesi için Hükümetin emriyle iki köy heyeti ihtiyariyesi bir araya toplanarak işin kendi aralarında düzeltilmesi için çalışılır. Gene uzlaşamadıkları halde idare meclisi tetkikat ve tahkikat yaparak altı ay içinde doğrudan doğruya sınırı çizer ve bu kati olur. Beş sene müddetle değiştirilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir köy sınırı; bu kanun mucibince çizildikten beş sene sonra hasıl olacak lüzum ve ihtiyaç üzerine ihtiyar meclisi sınırın büyültülüp küçültülmesi için müracaatta bulunabilir. Şayet bu sınırın büyütülmesi veya küçültülmesi başka bir köye dokunmuyorsa vilayet veya kaza idare meclisleri karariyle sınır tashih olunur ve tasdikli deftere yazılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sınırın büyültülmesi veya küçültülmesi başka bir köye dokunuyorsa bu maddenin birinci fıkrasına göre mesele halledilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="">
      <mvz-fıkra no="1">
        <template>Birkaç köy arasında müşterek olan sıvat, sulak, pınar ve baltalık gibi yerler eğer bir köy sınırı içinde kalıyorsa o köyün malı olmakla beraber diğer köyler de eskisi gibi istifade ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu gibi müşterek yerler bir köy sınırı içinde kalmıyorsa buralardan istifade eden köylerin müştereken malı olup her köyün sınır kağıdında bu hakları yazılır ve müştereken koruyup eskisi gibi istifade ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="">
      <mvz-fıkra no="1">
        <template>Köy bir yerden bir yere götürülebilen veya götürülemeyen mallara sahip olan ve işbu kanun ile kendisine verilen işleri yapan başlı başına bir varlıktır. Buna (şahsı manevi) denir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="">
      <mvz-fıkra no="1">
        <template>Köyün orta malı kanun karşısında Devlet malı gibi korunur. Bu türlü mallara el uzatanlar Devlet malına el uzatanlar gibi ceza görürler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="">
      <mvz-fıkra no="1">
        <template>İşbu kanun ile köye verilen işleri görmek (Köy muhtarının) ve (İhtiyar meclisinin) vazifesidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="">
      <mvz-fıkra no="1">
        <template>Muhtar, köyün başıdır. İşbu kanuna göre köy işlerinde söz söylemek, emir vermek ve emrini yaptırmak muhtarın hakkıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Muhtar Devletin memurudur. Devlet işlerinde vazifesini (36) ncı maddeye göre yapar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="">
      <mvz-fıkra no="1">
        <template>Köy muhtarının ve yapacağı işte köy muhtariyle birlik olanlara köy işlerinde fenalıkları anlaşılırsa Devlet memuru gibi muhakeme edilirler ve ceza görürler.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-fasıl>
  <mvz-fasıl no="2-İKİNCİ" başlık="Köy işleri">
    <mvz-madde no="12" başlık="">
      <mvz-fıkra no="1">
        <template>Köye ait işler ikiye ayrılır:</template>
        <mvz-bent no="1.">
          <template>Mecburi olan işler;</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Köylünün isteğine bağlı olan işler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Köylü mecburi olan işleri görmezse ceza görür. İsteğine bağlı olan işlerde ceza yoktur. Ancak köylünün isteğine bağlı bu gibi işlerde köy derneğinin yarısından çoğu hükmederler ve vilayete bağlı olan yerlerde vali ve kazaya bağlı olan köylerde kaymakamın rızasını alırlarsa o iş bütün köylü için mecburi olur. Ve yapmayan ceza görür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="">
      <mvz-fıkra no="1">
        <template>Köylünün mecburi işleri şunlardır:</template>
        <mvz-bent no="1.">
          <template>Sıtma, sivrisinek tarafından aşılandığı ve sivrisinek de su birikintilerinde barındığı ve ürediği için her şeyden evvel köy sınırı dahilindeki su birikintilerini kurutmak;</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Köye kapalı yoldan içilecek su getirmek ve çeşme yapmak, köyün içtiği su kapalı geliyorsa yolunda delik deşik bırakmamak ve mezarlıktan veya süprüntülük ve gübrelikten geçiyorsa yolunu değiştirmek;</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Köylerdeki kuyu ağızlarına bir arşın yüksekliğinde bilezik ve etrafını iki metre eninde harçlı döşeme ile çevirmek;</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>Evlerde odalarla ahırları bir duvarla birbirinden ayırmak;</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>Köyün her evinde üstü kapalı ve kuyulu veya lağımlı bir hela yapmak ve köyün münasip bir yerinde herkes için kuyusu kapalı veya lağımlı bir (hela) yapmak;</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>Evlerden dökülecek pis suların kuyu, çeşme, pınar sularına karışmayarak ayrıca akıp gitmesi için üstü kapalı akıntı yapmak;</template>
        </mvz-bent>
        <mvz-bent no="7.">
          <template>Köyde evlerin etrafını ve köyün sokaklarını temiz tutmak, her ev kendi önünü süpürmek;</template>
        </mvz-bent>
        <mvz-bent no="8.">
          <template>Çeşme, kuyu ve pınar başlarında gübre, süprüntü  bulundurmayıp daima temiz tutmak, ve fazla sular etrafa yayılarak bataklık yapmaması için akıntı yapmak;</template>
        </mvz-bent>
        <mvz-bent no="9.">
          <template>Köyün süprüntü ve gübreliğini köyden uzakça yol üstü olmayan sapa ve rüzgaraltı yerlerde yapmak ve herkese o gübrelikten ayrı yerler gösterilmek;</template>
        </mvz-bent>
        <mvz-bent no="10.">
          <template>Her köyün bir başından öbür başına kadar çaprazlama iki yol yapmak (bu yollar köy meydanından geçecektir.)</template>
        </mvz-bent>
        <mvz-bent no="11.">
          <template>Köyün büyüklüğüne göre orta yerinde ve mümkün olamazsa kenarında bir meydan açmak;</template>
        </mvz-bent>
        <mvz-bent no="12.">
          <template>Köy meydanının bir tarafında ihtiyar meclisinin toplanıp köyün işlerini görüşmeleri için bir köy odası yapmak;</template>
        </mvz-bent>
        <mvz-bent no="13.">
          <template>Köy, yol üzerinde uğrak ve konuk ise köy odası yanında ocaklı ve ahırlı bir konuk odası yapmak;</template>
        </mvz-bent>
        <mvz-bent no="14.">
          <template>Köyde bir mescit yapmak (yeniden yapılacak ise köy meydanının bir tarafına yapılacaktır.);</template>
        </mvz-bent>
        <mvz-bent no="15.">
          <template>Köyde maarif idarelerinin vereceği örneğe göre bir mektep yapmak (yeniden yapılacak ise köyün en havadar bir tarafına yapılacak ve mektebin her halde bir bahçesi bulunacaktır.);</template>
        </mvz-bent>
        <mvz-bent no="16.">
          <template>Köy yollarının ve meydanının etrafına ve köyün içinde ve etrafındaki su kenarlarına ve mezarlıklara ve mezarlık ile köy arasına ağaç dikmek. (Köylü her sene adam başına en az bir ağaç dikecek ve bu ağaç tamamen tutup yeşilleninceye kadar ağaca bakacak ve yeni dikilmişlere hayvanların sürünerek ve kemirerek zarar vermesinin önünü almak için etrafına çalı çırpı sarıp muhkemce bağlayacaktır.);</template>
        </mvz-bent>
        <mvz-bent no="17.">
          <template>Köy korusunu muhafaza etmek;</template>
        </mvz-bent>
        <mvz-bent no="18.">
          <template>Köyden Hükümet merkezine veya komşu köylere giden yolların kendi sınırı içindeki kısmını yapmak ve onarmak ve yollar üzerindeki küçük hendek ve derelerin üstlerine köprü yapmak ve yol üzerinden gelip gitmeğe zorluk verecek şeyleri kırmak, kaldırmak. (Bir yol üzerindeki işlerin köyden köy sınırının bittiği yere kadar olanı o köyündür.);</template>
        </mvz-bent>
        <mvz-bent no="19.">
          <template>Köy halkından askerde bulunanların ve bakacağı olmayan öksüzlerin tarlalarını, bağ ve bahçelerini (imece) yoluyla sürüp ekmek, harmanlarını kaldırmak;</template>
        </mvz-bent>
        <mvz-bent no="20.">
          <template>Köy namına nalbant, bakkal, arabacı dükkanları yaptırmak;</template>
        </mvz-bent>
        <mvz-bent no="21.">
          <template>Köye ortaklaşa korucu, sığırtmaç, danacı ve çoban tutmak;</template>
        </mvz-bent>
        <mvz-bent no="22.">
          <template>Köyde insanlarda salgın ve bulaşık bir hastalık çıkarsa veya firengili adam görülürse o gün bir adam yollayarak Hükümete haber vermek. (Bu haber üzerine kazadan memur gelinceye kadar hastanın yanına bakacaklardan başkalarını sokmamak lazımdır.);</template>
        </mvz-bent>
        <mvz-bent no="23.">
          <template>Köy hayvanlarında salgın ve bulaşık bir hastalık görülürse o gün bir adam yollayarak Hükümete haber vermek; bu haber üzerine kazadan bir memur gelinciye kadar hasta olan hayvanı diğerlerinden ayırmak ve hasta hayvan ile beraber bulunmuş olan hayvanları köyün hasta olmayan hayvanları ile karıştırmamak;</template>
        </mvz-bent>
        <mvz-bent no="24.">
          <template>Köyde su basması olursa birleşerek selin yolunu değiştirmek;</template>
        </mvz-bent>
        <mvz-bent no="25.">
          <template>Ekine, mahsule, yemişli, yemişsiz ağaçlara, bağlara, bahçelere zarar veren kuşları, böcekleri, tırtılları öldürmek. (Bunun için hangi türlü kuşların ve böceklerin hangi zamanlarda ve nasıl öldürülmesi lazım geldiği Hükümetten sorulacak ve nasıl öğretilirse öyle yapılacaktır.);</template>
        </mvz-bent>
        <mvz-bent no="26.">
          <template>Köy halkının ekilmiş ve dikilmiş mahsullerini, ağaçlarını her türlü zarar ve ziyandan muhafaza etmek;</template>
        </mvz-bent>
        <mvz-bent no="27.">
          <template>Mecbur olmadıkça yol üzerine halkın kolaylıkla gelip geçmesine dokunacak şeyler koymamak;</template>
        </mvz-bent>
        <mvz-bent no="28.">
          <template>Birdenbire yıkılarak altında adam ve hayvanat kalacak derecede çürümüş veya eğilmiş duvar veya damları bir sakatlık çıkarmaması için  yıktırmak veya tamir ettirmek;</template>
        </mvz-bent>
        <mvz-bent no="29.">
          <template>(Köy içinde bila zaruretin hayvan koşturmamak).</template>
        </mvz-bent>
        <mvz-bent no="30.">
          <template>Muhafazasına mecbur oldukları yırtıcı ve azgın hayvanları başı boş salıvermemek;</template>
        </mvz-bent>
        <mvz-bent no="31.">
          <template>Devlet parasını kıymetinden aşağı aldırtmamak;</template>
        </mvz-bent>
        <mvz-bent no="32.">
          <template>Bir adamın suda veya başka suretle başına bir felaket gelince onu kurtarmak elinde iken yardım etmek;</template>
        </mvz-bent>
        <mvz-bent no="33.">
          <template>Köyde çürümüş ve kokmuş meyva vesair sıhhate muzır şeyler köyden dışarıya götürülür ve gömülür;</template>
        </mvz-bent>
        <mvz-bent no="34.">
          <template>Bir hayvana götüremeyecek kadar yük yüklettirmemek;</template>
        </mvz-bent>
        <mvz-bent no="35.">
          <template>Yaylımlara başlı başına hayvan salmamak ve ortaklaşa çayırları biçmemek;</template>
        </mvz-bent>
        <mvz-bent no="36.">
          <template>Bir yeri kazarak başkalarının hayvan ve davarlarının düşüp ölmesine ve sakatlanmasına sebep olmasına meydan vermemek;</template>
        </mvz-bent>
        <mvz-bent no="37.">
          <template>İhtiyar meclisleri tarafından şahitlik için çağrılınca her halde gelmek ve eğer gelmeyecek kadar mazereti varsa bildirmek.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="">
      <mvz-fıkra no="1">
        <template>Yapılması köylünün isteğine bağlı olan şeyler şunlardır:</template>
        <mvz-bent no="1.">
          <template>Köyün evlerinde ahırları odalardan ayrı bir yere yapmak;</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Ev, ahır, hela duvarlarının iç ve dışları senede bir defa badanalanmak;</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Her köyün bir başından öbür başına kadar olan yolları taş kaldırma ile döşemek;</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>Köy mezarlığının köyden ve caddeden uzak bir yerde, suların geldiği tarafta değil, akıp gittiği tarafta olmasına çalışmak ve etrafını duvarla çevirerek içersine hayvan girmesinin önünü almak ve mezarlığa gübre süprüntü dökmemek, herkesin mezarlarına iyi bakmak;</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>Köyde bir çamaşırlık yapmak;</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>Köyde bir hamam yapmak;</template>
        </mvz-bent>
        <mvz-bent no="7.">
          <template>Pazar ve çarşı yerleri yapmak;</template>
        </mvz-bent>
        <mvz-bent no="8.">
          <template>Köyün sınırı içinde münasip yerlerde ve tepelerde orman yetiştirmek;</template>
        </mvz-bent>
        <mvz-bent no="9.">
          <template>Köyü, kasaba ve komşu köylere bitiştiren yolların iki kenarına ağaç dikmek ve köy sınırı içindeki yabani ağaçları aşılamak;</template>
        </mvz-bent>
        <mvz-bent no="10.">
          <template>Köyde ekilip biçilen ve toplanan mahsulatın veya yapılan eşyanın değeriyle satılabilmesi için köy namına alıcı adam aramak;</template>
        </mvz-bent>
        <mvz-bent no="11.">
          <template>Köy tarla ve bahçelerini sulamak için bütün köye ortaklaşa ark yapmak;</template>
        </mvz-bent>
        <mvz-bent no="12.">

        <mvz-bent no="21.">
          <template>Yemeklik ve para ile köy fıkarasına ve öksüzlere yardım etmek, kimsesiz çocukları sünnet ettirmek ve kızları evlendirmek için yardım etmek ve fukara cenazelerinin kefen vesairesinin tedarikine çalışmak;</template>

        <mvz-bent no="23.">

        <mvz-bent no="26.">

        <mvz-bent no="28.">

        </mvz-bent>
        <mvz-bent no="29.">
          <template>Köy korusu olmayan yerlerde koru yetiştirmek;</template>
        </mvz-bent>
        <mvz-bent no="30.">
          <template>Köyde sağlık işlerine bakmak üzere bir sağlık korucusu bulundurmak, yok ise vilayet veya kaza merkezinde açılacak sağlık derslerine adam göndererek yetiştirmek suretiyle köyde istihdam etmek;</template>
        </mvz-bent>
        <mvz-bent no="31.">

        <mvz-bent no="32.">

  <mvz-fasıl no="3-ÜÇÜNCÜ" başlık="İmece ve köy parası">
    <mvz-madde no="15" başlık="">
      <mvz-fıkra no="1">
        <template>Köy işlerinin bir çoğu bütün köylü birleşerek imece ile yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="">
      <mvz-fıkra no="1">
        <template>Köy gelirleri, köy işlerini gören köyün aylıklı adamlarının aylık ve yıllıklariyle köy sınırları içinde yapılacak mecburi köy işlerine yetmezse:</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>En yüksek haddi yirmi lirayı aşmamak üzere herkesin hal ve vaktine göre köy ihtiyar meclisi karariyle köyde oturanlara ve köyde maddi alakası bulunanlara salma salınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="">
      <mvz-fıkra no="1">
        <template>Köy parası şunlardır:</template>
        <mvz-bent no="1.">
          <template>İhtiyar meclisi tarafından köylüye salınacak para;</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>İşbu kanuna göre alınacak ceza paraları;</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Köy namına yazılı emlak ve arazi geliri;</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>Yoliyle vakfedilen arazi ve emlak geliri;</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>Avarrız gelirleri (ağaç, arazi, emlak, para);</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>Hediye ve bağışlanmış paralar ve mallar, (ianat ve teberruat);</template>
        </mvz-bent>
        <mvz-bent no="7.">
          <template>Köy namına ekilen tarla geliri;</template>
        </mvz-bent>
        <mvz-bent no="8.">
          <template>Köy tezgah ve ambar ve dükkanları geliri;</template>
        </mvz-bent>
        <mvz-bent no="9.">
          <template>Mühürlenecek ilmühaberlerden alınacak para, (bu para ihtiyar meclisince yapılıp kaymakam veya vali tarafından tasdik olunan cetvele göre alınır);</template>
        </mvz-bent>
        <mvz-bent no="10.">
          <template>Köy sınırı içindeki taş, kireç, tuğla, kiremit, çorak, kil gibi ocaklardan alınacak para (nısıf kutru elliden yüz metreye kadar olanlardan);</template>
        </mvz-bent>
        <mvz-bent no="11.">
          <template>Çay ve nehirler üzerindeki kayık ve sallardan alınacak para, (senenin altı ayı işleyenlere mahsustur. Bundan fazla işleyenler vilayet idarelerinindir);</template>
        </mvz-bent>
        <mvz-bent no="12.">
          <template>Köy sınırı içindeki otlaklardan ve meralardan fazlasının kira paraları;</template>
        </mvz-bent>
        <mvz-bent no="13.">
          <template>Köyde satılmak için kesilen hayvanlardan alınacak para, (zephiye resmi);</template>
        </mvz-bent>
        <mvz-bent no="14.">
          <template>Köy sınırı içinde satılan hayvanlardan alınacak ihtisap resmi;</template>
        </mvz-bent>
        <mvz-bent no="15.">
          <template>Köy sınırı içinde sahipsiz ağaçların ve yemişlerin geliri;</template>
        </mvz-bent>
        <mvz-bent no="16.">
          <template>Köy sınırı içindeki kaplıcalar, maden suları, (şimdiye kadar belediye, idarei hususiye, maliye, evkaf ve eşhas tarafından yoliyle elde edilenler hariç);</template>
        </mvz-bent>
        <mvz-bent no="17.">
          <template>Geliri yetişmeyen köylerde muhtar, imam, katip, korucu, sığırtmaç, danacı gibi köy adamlarının aylıkları veya senelikleri için salınacak para veya mahsuller.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="">
      <mvz-fıkra no="1">
        <template>Köy namına harcanacak para iki türlüdür. Biri köylünün isteğine bağlı olmayan, diğeri köylünün isteğine bağlı olandır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="">
      <mvz-fıkra no="1">
        <template>Köylünün isteğine bağlı olmayarak harcanacak paralar şunlardır :</template>

        <mvz-bent no="3.">

        <mvz-bent no="4.">

        </mvz-bent>
        <mvz-bent no="5.">
          <template>12 nci madde mucibince isteğe bağlı iken mecburi yapılan işlere lazım olacak paralar,</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>Köy işine bakacak adamların aylığı.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>

  <mvz-fasıl no="4-DÖRDÜNCÜ" başlık="Köy Muhtarının ve ihtiyar meclisi azalarının seçilme yolu">

  <mvz-fasıl no="5-BEŞİNCİ" başlık="Muhtarın göreceği işler">

      <mvz-madde no="36" başlık="">

            <template>Hükümet tarafından bildirilecek kanunları, nizamları köy içinde ilan etmek ve halka anlatmak ve kanunlar, nizamlar, talimatlar, emirler ile kendisine verilecek işleri görmek;</template>

          </mvz-bent>
          <mvz-bent no="7.">
            <template>Her ay içinde köyde doğan, ölen, nikahlanan ve boşananların defterini yapıp ertesi ayın onuncu gününden evvel nüfus memuruna vermek ve köyün nüfus defterini birlikte götürerek vukuatı yürüttürmek;</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>Vergi toplamak için gelen tahsildarlara yol göstermek, yardım etmek ve tahsildarların yolsuzluğunu görürse Hükümete haber vermek.</template>

          <mvz-bent no="9.">
            <template>Asker toplamak ve bakaya ve kaçakları Hükümete haber vermek;</template>
          </mvz-bent>
          <mvz-bent no="10.">

          <mvz-bent no="12.">
            <template>Köy sınırı içinde yangın ve sel olursa köylüleri toplayıp söndürmeğe ve çevirmeğe çalışmak, (orman yangınlarında sınırdan dışarı olsa dahi yardıma mecburdurlar.);</template>

          <mvz-bent no="13.">
            <template>Mahkemelerden gönderilen celpname ve her türlü tezkere ve hükümleri lazım gelenlere bildirerek istenilen işleri yapmak ve mahkeme mubaşirine ve jandarmaya vazifesinde kolaylık göstermek;</template>

          <mvz-bent no="14.">

          </mvz-bent>
          <mvz-bent no="15.">

      <mvz-madde no="38" başlık="">

      <mvz-madde no="40" başlık="">
        <mvz-fıkra no="1">
          <template>Köy muhtarının köylü faydasına olmayan kararlarını kaymakam bozabilir. Fakat, onun yerine kaymakam kendiliğinden karar veremez. Karar, gene köylü tarafından verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="41" başlık="">
        <mvz-fıkra no="1">
          <template>İl merkezine bağlı köylerde vali, ilçelere bağlı köylerde kaymakamlar, muhtarın köy işlerini ve kanunlarla verilen diğer görevlerini yapmadığını görürlerse muhtara yazılı ihtarda bulunurlar. Buna rağmen iş görmeyen muhtar, yetkili idare kurulu karariyle görevinden uzaklaştırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    <mvz-b1 no="A" başlık="İhtiyar meclisinin göreceği işler">
      <mvz-madde no="42" başlık="">
        <mvz-fıkra no="1">
          <template>İhtiyar meclisi en az haftada bir defa toplanıp konuşur. İhtiyar meclisini muhtar toplanmağa çağırır. İhtiyar meclisi köy muhtarının çağırmadığı ve meclisin toplanma günü olmadığı vakitlerde dahi köy muhtarına haber vererek kendi isteği ile toplanabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="43" başlık="">
        <mvz-fıkra no="1">
          <template>İhtiyar meclisi köy işlerini en ziyade lazım olandan başlıyarak bir sıraya koyar ve biri yapılıp bittikten sonra sırasiyle hepsini köylüye gördürmeğe çalışır. Evvel yapılması lazım gelen sağlık, yol, mektep işlerinin geri bırakıldığı haber alınır veya şikayet edilirse köyün bağlı olduğu kaymakam veya vali tarafından gösterilen yolda yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="44" başlık="">
        <mvz-fıkra no="1">
          <template>İhtiyar meclisinin göreceği işler şunlardır:</template>
          <mvz-bent no="1.">
            <template>İhtiyar meclisi köylüye ait işleri konuşur ve hangi işleri köylü tarafından kendileri çalışarak doğrudan doğruya ve hangi işlerin para ile veya ırgat ile görülebileceğine karar verir. "Köy işlerinden köy ahalisinin imece ile çalışarak yapacakları işi, köylünün çift ve çubuğu ile uğraşmadıkları boş zamanlara bırakır."</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>İhtiyar Meclisi bu Kanunun 13 ve 14 üncü maddelerinde yazılı mecburi ve ihtiyari işleri yapmak için lüzumu halinde köy sınırı içindeki gayrimenkulleri değer pahasiyle satın alır. Mal sahibi razı olmazsa köyün bağlı bulunduğu kaza veya vilayet idare heyeti işi gözden geçirir. İdare heyetinin kararına söz yoktur.</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Tarlası olmayan veya yetişmeyen köylüye köyün sınırı içinden boz haliden bir parça ayırıp vermek ve tasarrufu malsandığına veya sair dairelere geçmiş olan araziyi köy namına satın alıp arazisi olmayanlara vermek ve bedelini taksitle köy sandığına ödetmek mecburidir.</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>İhtiyar meclisi köylünün kaçar gün çalışacağını kestirir.</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Köy işi için beher köylüye haline göre salınacak paranın ne olacağını keser.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="45" başlık="">
        <mvz-fıkra no="1">
          <template>Paranın harcanmasında hiçbir fenalık olmamasına ve faydasız yere para verilmemesine köy muhtarı ve ihtiyar meclisi azaları göz kulak olurlar ve paranın harcanmasında fenalık ve yolsuzluk olduğu Hükümetçe anlaşılırsa kaza idare meclisinin hükmü ile Tahsili Emval Kanununa göre köy muhtarı ve ihtiyar meclisi azasının malları satılarak köylünün parası ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="46" başlık="">
        <mvz-fıkra no="1">
          <template>Mecburi işleri gördürmeyen ve toplanması isteğe bağlı olmayan paraları toplamayan ve toplattırmayan köy muhtarı ve ihtiyar meclisi üyelerine köyün bağlı bulunduğu idare kurulunca 10 liradan 50 liraya kadar para cezası hükmolunur. Bu ceza Maliyece Tahsili Emval Kanununa tevfikan tahsil ve köy sandığına teslim olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="İki ve daha ziyade köylere düşen işler">
      <mvz-madde no="47" başlık="">
        <mvz-fıkra no="1">
          <template>İki ve daha ziyade köyler arasındaki işler için o köylerin muhtar ve ihtiyar meclisleri kendi aralarında kararlaştıracakları bir köyde toplanarak konuşurlar ve ne türlü yapılacağını ve her köyün o işte ne türlü yardım edeceğini kararlaştırırlar ve ondan sonra Hükümete haber vererek alacakları izne göre işe başlarlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="48" başlık="">
        <mvz-fıkra no="1">
          <template>İki veya daha ziyade köylere düşen işler için köylerin ihtiyar meclisleri kendi aralarında anlaşamazlarsa bunlardan bir tarafın dilemesi üzerine köyün bağlı olduğu Hükümet reisi işe karışır ve o köylerin ihtiyar meclislerini toplıyarak işi bitirir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-fasıl>
  <mvz-fasıl no="6-ALTINCI" başlık="İhtiyar meclislerinin göreceği davalar">
    <mvz-madde no="49 - 52" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="53" başlık="">
      <mvz-fıkra no="1">
        <template>İhtiyar meclisleri köylünün iki tarafın uzlaşmasiyle bitirilebilen her türlü işlerini görürler. (Sulh).</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="54 - 55" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="56" başlık="">
      <mvz-fıkra no="1">
        <template>13 üncü maddede yazılan mecburi işleri yapmayan köylüden ihtiyar meclisinin karariyle haline göre bir kuruştan yüz kuruşa kadar ceza alınır. Ceza parasını vermeyenler hakkında (66) ncı maddeye göre muamele yapılır. Cezaya mahküm olan adam o işten gene kaçarsa evvelki ceza iki kat olarak alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İhtiyar meclisince salınan parayı ödemeyenlerden iki katı (66) ncı maddeye göre tahsil olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-fasıl>
  <mvz-fasıl no="7-YEDİNCİ" başlık="Davaların nasıl görüleceği">
    <mvz-madde no="57 - 65" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="66" başlık="">
      <mvz-fıkra no="1">
        <template>Köyce salının parayı ve ihtiyar meclisince hükmedilen paraları vermeyenlere yirmi bir gün zarfında borcunu vermesi için köy muhtarı tarafından haber gönderilir. Yirmi bir günün sonunda borçlu gene borcunu vermezse ihtiyar meclisinin mazbatası Hükümete gönderilir. Vali veya kaymakam veya nahiye müdürü aşağıdaki usule göre parayı tahsil ve köy sandığına veya ihtiyar meclisi vasıtasıyle alacaklılara teslim eder. Şöyle ki:</template>
        <mvz-bent no="1.">
          <template>Borçlu veya cezalıya lazım olandan gayrı ev eşyası satılmak suretiyle alınır. Fazla eşyası bulunamazsa veyahut alınan eşya borcu ödeyemezse bir yerden diğer bir yere götürülebilen diğer malları, bu da yoksa tarla bağ ve bahçe gibi bir yerden diğer bir yere götürülemiyen malları satılır. Çift ve çubuğu ve çift hayvanatı satılamaz.</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Ev eşyasiyle bir yerden diğer bir yere naklonulabilen her nevi eşya haczi gününden başlıyarak üç gün içinde ihtiyar meclisinin gözü önünde ve kasabada belediye vasıtasıyle sattırılır. Yetecek kadarı köy sandığına veya alacaklıya ve üst tarafı mal sahibine verilir. Üç gün içinde borcunu verenlerin malı geri verilir.</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Oturduğu ev ile geçimi için lazım olan tarla, bağ, bahçenin ve dört senelik mahsulü veya kirası borca yetişen ve bir yerden diğer yere götürülemiyen malların satılması yasaktır.</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>Haczolunan ve bir yerden diğer yere götürülemiyen mallar yirmi gün müddetle müzayedeye çıkarılır. Bu müddet bittikte sürülen peyler kafi görülürse on gün müddetle askıya alınır ve on gün bitince herkaç kuruşa çıkmış ise Hükümetçe talibine ihale olunur.</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>Satılan şeylere köy ihtiyar meclisi azaları doğrudan doğruya kendileri veya başkaları vasıtasiyle pey süremezler ve satın alamazlar.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="67" başlık="" durum="mülga">
    </mvz-madde>
  </mvz-fasıl>
  <mvz-fasıl no="8-SEKİZİNCİ" başlık="Köy korucuları ve göreceği işler">
      <mvz-madde no="68" başlık="">
        <mvz-fıkra no="1">
          <template>Köy sınırı içinde herkesin ırzını, canını ve malını korumak için köy korucuları bulundurulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="69" başlık="">
        <mvz-fıkra no="1">
          <template>Her köyde en aşağı bir korucu bulunur. Nüfusu binden yukarı köylerde her beş yüz kişiye bir korucu daha tutulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="70" başlık="">
        <mvz-fıkra no="1">
          <template>Korucular ihtiyar meclisi tarafından tutulur ve köy muhtarının vereceği haber üzerine kaymakamın buyurultusu ile işe başlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="71" başlık="">
        <mvz-fıkra no="1">
          <template>Korucuların 22 yaşından küçük ve altmış yaşından büyük olmaması ve bir cürüm ile cezalandırılmamış ve iyi huylu tanınmış bulunması ve herkesle kavga çıkarmak, serhoşluk gibi huysuzlukları olmaması şarttır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="72" başlık="">
        <mvz-fıkra no="1">
          <template>Korucular köy muhtarının emri altındadır. Resmi işlerde onun her emrini tutmağa mecburdur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="73" başlık="">
        <mvz-fıkra no="1">
          <template>Korucular silahlıdırlar. Kendilerine karşı gelenler jandarmaya karşı gelmiş gibi ceza görürler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="74" başlık="">
        <mvz-fıkra no="1">
          <template>Köy muhtarı ve ihtiyar meclisi mahsul zamanlarında çapulcular ve eşkiya türemiş ise yağmadan köy halkını korumak için köylünün eli silah tutanlarından lüzumu kadarını gönüllü güvenlik korucusu ayırarak bunların isimlerini bir kağıda yazıp kaymakama götürür. Kaymakamın müsaadesi olursa bu gönüllü güvenlik korucuları asıl korucularla beraber yağmacılara ve eşkiyaya karşı köy ve köylüyü korurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Cumhurbaşkanınca tespit edilecek illerde; olağanüstü hal ilanını gerektiren sebeplere ve şiddet hareketlerine ait ciddi belirtilerin köyde veya çevrede ortaya çıkması veya her ne sebeple olursa olsun köylünün canına ve malına tecavüz hareketlerinin artması hallerinde, valinin teklifi ve İçişleri Bakanının onayı ile yeteri kadar güvenlik korucusu görevlendirilmesi kararlaştırılabilir. Bu şekilde görevlendirilecek güvenlik korucusu sayısı 40.000 kişiyi geçemez. Cumhurbaşkanı bu sayıyı yüzde elliye kadar artırmaya yetkilidir. Görevlendirmeyi gerektiren hallerin ortadan kalkması durumunda veya idarî zaruret hallerinde görevlendirmeye ilişkin aynı usûl uygulanmak suretiyle güvenlik korucusu olarak yapılan görevlendirmelere son verilebilir.  Güvenlik korucularından 55 yaşını dolduranların görevleriyle ilişikleri kesilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Güvenlik korucularının görev alanı, görevli oldukları köyün hudutları içinde kalan alandır. Gerektiğinde vali veya kaymakam onayı ile güvenlik korucularının görev alanları, geçici ve süresi belirli olarak köy hudutları dışına genişletilebilir ve görev yerleri değiştirilebilir. Güvenlik korucuları diğer bir ilin valisinin talebi üzerine, istihdam edildikleri ilin valisinin onayı ile geçici ve süresi belirli olarak iller arasında görevlendirilebilir. Bu durumda, güvenlik korucusunun harcırahı görevlendirildiği valilik tarafından ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Köy Korucuları ve Güvenlik Korucularının görevde bulundukları süre içinde yaralanmaları, engelli hâle gelmeleri veya ölümleri halinde "2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanun" hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Güvenlik korucularına hizmetin devamı süresince her ay 11.500 gösterge rakamının memur aylıklarına uygulanan aylık katsayısı ile çarpımı sonucunda bulunacak miktarda ücret ödenir. Bu ücret, herhangi bir vergi ve kesintiye tâbi tutulmaksızın ve peşin olarak ödenir.  Bu ücret ile 27/6/1989 tarihli ve 375 sayılı Kanun Hükmünde Kararnamenin 28 inci maddesinin (B) fıkrası kapsamında ödenen ek tazminat toplamının, içinde bulunulan yılın Ocak ayına ilişkin net asgari ücret tutarının (sadece kendisi için asgari geçim indirimi uygulanan) altında kalması halinde aradaki fark, ücret için öngörülen usul ve esaslar çerçevesinde tazminat olarak ayrıca ödenir. Güvenlik korucuları arasından, toplam güvenlik korucusu sayısının yüzde onunu geçmeyecek şekilde tefrik edilen korucu başlarına güvenlik korucularına ödenen ücretin yüzde onu kadar ilave ücret ödenir. Ay sonundan önce kendi isteğiyle görevden ayrılanlar ile disiplin hükümlerinin uygulanması sonucu görevlerine son verilenler hariç olmak kaydıyla, görevlerine son verilen veya ölen güvenlik korucuları için önceden peşin ödenmiş olan ücretin kalan günlere isabet eden tutarı geri alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Güvenlik korucularından güvenlik güçleriyle birlikte operasyonlara katılanların iaşeleri, birlikte operasyona katıldıkları güvenlik güçlerinin bağlı olduğu birimlerce ve bu birimlerin bütçesinden karşılanmak üzere sağlanır. Bu Kanunda belirtilen görevler ile tabii afetlerde ve diğer olağanüstü hal ve durumlarda emsallerine göre başarılı görev yaptıkları görülen veya büyük yararlılık gösteren güvenlik korucularına, valinin teklifi ve İçişleri Bakanının onayı ile yılda bir defa aylık ücretlerinin iki katına kadar ödül verilebilir. Bir malî yılda bu şekilde ödül verilecek güvenlik korucusu sayısı, o ilde görevli güvenlik korucusu sayısının yüzde birini geçemez.  Güvenlik güçleriyle birlikte operasyonlara katılan güvenlik korucularına herhangi bir vergi ve kesintiye tâbi tutulmaksızın her ay 225 gösterge rakamının memur aylık katsayısı ve operasyona çıktıkları gün sayısı ile çarpımı sonucu bulunacak tutarda ek tazminat ayrıca ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Güvenlik korucusu olarak görevlendirilenler hakkında 22/5/2003 tarihli ve 4857 sayılı İş Kanunu ile 25/8/1999 tarihli ve 4447 sayılı İşsizlik Sigortası Kanunu hükümleri uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Bu maddeye göre güvenlik korucularına yapılacak harcamalar, İçişleri Bakanlığı bütçesine konulacak ödenekten bu Bakanlıkça karşılanır ve ödemeler il valilikleri tarafından yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Valinin teklifi ve İçişleri Bakanının uygun görmesi halinde, bu Kanunun mülga ek 16 ncı ve mülga ek 17 nci maddeleri ile 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun ek 15 inci maddesi çerçevesinde görevden ilişiği kesilmiş güvenlik korucuları operasyonel faaliyetler maksadıyla tekrar göreve çağrılabilirler. Ayrıca, gönüllü güvenlik korucuları da aynı usulle operasyonel faaliyetlerde görevlendirilebilirler. Bu şekilde görevlendirilenler, bu maddenin üçüncü fıkrasında belirtilen harcırahtan ve yedinci fıkrasında belirtilen ek tazminattan yararlandırılırlar. Bu ödemeler dolayısıyla her ne ad altında olursa olsun kamudan aldıkları ödemelerden kesinti yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Teröristle mücadelede görev alan güvenlik korucuları ile gönüllü güvenlik korucularının, bu görevlerin ifasından doğduğu iddia edilen suçlardan dolayı yapılan soruşturma ve kovuşturmalarda müdafi olarak belirlediği en fazla üç avukatın ücreti İçişleri Bakanlığı bütçesine konulacak ödenekten valilikler tarafından karşılanır. Güvenlik korucuları ile gönüllü güvenlik korucularının avukatlık ücretinin ödeme usul ve esasları yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    <mvz-b1 no="A" başlık="Güvenlik korucularına verilecek disiplin cezalarının çeşitleri ile ceza uygulanacak fiil ve haller">
      <mvz-madde no="74/A" başlık="">
        <mvz-fıkra no="1">
          <template> </template>
          <mvz-bent no="a">
            <template>Uyarma: Güvenlik korucularına görevlerinde ve davranışlarında daha dikkatli olması gerektiğinin yazı ile bildirilmesidir. Uyarma cezasını gerektiren fiil ve haller şunlardır:</template>
            <mvz-altbent no="1">
              <template>Verilen emir ve görevlerin tam ve zamanında yapılmasında, görev mahallinde belirlenen usul ve esasların yerine getirilmesinde kayıtsızlık göstermek ve düzensiz davranmak,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>Özürsüz veya izinsiz olarak göreve geç gelmek veya görevi erken terk etmek,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>Kurumunca belirlenen tasarruf tedbirlerine riayet etmemek,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>Usulsüz müracaat veya şikâyette bulunmak,</template>
            </mvz-altbent>
            <mvz-altbent no="5">
              <template>Güvenlik koruculuğu vakarına yakışmayan tutum ve davranışta bulunmak,</template>
            </mvz-altbent>
            <mvz-altbent no="6">
              <template>Görevine karşı kayıtsızlık göstermek veya ilgisiz kalmak,</template>
            </mvz-altbent>
            <mvz-altbent no="7">
              <template>Belirlenen kılık ve kıyafet hükümlerine aykırı davranmak,</template>
            </mvz-altbent>
            <mvz-altbent no="8">
              <template>Görevin iş birliği içerisinde yapılması ilkesine aykırı davranışlarda bulunmak.</template>
            </mvz-altbent>
          </mvz-bent>
          <mvz-bent no="b">

      <mvz-madde no="80" başlık="">
        <mvz-fıkra no="1">
          <template>Vazifesinde kayıtsızlığı ve tembelliği ve aşağıda sayılan yasak işleri yapan korucular, ihtiyar meclisi tarafından ilk defasında tekdir, ikincisinde tevbih olunur ve her iki ceza da tezkerelerine işaret edilir. Üçüncü defasında işten çıkarılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="81" başlık="">
        <mvz-fıkra no="1">
          <template>Koruculara yasak olan işler şunlardır:</template>
          <mvz-bent no="1.">
            <template>Koruculuktan başka iş yapmak: mesela dükkan, kahvehane, han açıp işletmek veya bunlara ortaklık etmek;</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Köylüden herhangi birinin veya kendi hizmetinde bulunmak için izinsiz vazifesini terketmek;</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Koruduğu bağ ve bahçe ve ekinlerden fuzuli faydalanmak;</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Kendi hayvanlarını otlatmak ve köye çobanlık etmek;</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Levha, elbise ve silah ve cüzdanını üzerinde taşımamak veya değiştirmek.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="82" başlık="">
        <mvz-fıkra no="1">
          <template>Silahını ve cephanesini kayıtsızlığı yüzünden kaybeden veya isteğiyle aharın eline geçmesine sebep olan korucu hemen çıkarılarak hakkında ayrıca ceza yapılmak üzere Hükümete haber verilir ve silah ve cephane parası ödettirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-fasıl>
  <mvz-fasıl no="9-DOKUZUNCU" başlık="Köy imamları">
    <mvz-madde no="83" başlık="">
      <mvz-fıkra no="1">
        <template>Köy imamları köy derneğinin intihabı ve müftünün buyurultusiyle tayin olunurlar. Bu kanunun neşri tarihinde mevcut olan imamlar yeniden buyrultu almağa mecburdurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="84" başlık="">
      <mvz-fıkra no="1">
        <template>İmam olacaklar yirmi dördüncü maddeye göre (ikinci fıkrasından başka) lazım gelen sıfatları haiz olmakla beraber ilmihal, amalierbaa ve kafi derecede Türkiye coğrafyası ve Türk ve İslam tarihini ve sağlık işlerini bilmek ve okunaklı yazı yazmak lazımdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="85" başlık="">
      <mvz-fıkra no="1">
        <template>Köy imamlarına köyce şimdiye kadar ne veriliyorsa gene o verilecektir. Ancak verilen şeyler, ihtiyar meclisi vasıtasiyle toplanır ve verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="86" başlık="">
      <mvz-fıkra no="1">
        <template>Bir köyde birden fazla imam bulunursa ihtiyar meclisinde aza olarak bulunacak imamı kaymakam seçer.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-fasıl>
  <mvz-fasıl no="10-ONUNCU" başlık="Müteferrik maddeler">
    <mvz-madde no="87" başlık="" durum="mülga">
    </mvz-madde>
    <mvz-madde no="88" başlık="">
      <mvz-fıkra no="1">
        <template>Ecnebi tebaası köylerde ikamet etmek için Dahiliye Vekaletinden resmi tezkere alacaklardır. Bu tezkerelerin verilip verilmemesi ve ikamet müddetlerinin azaltılıp çoğaltılması Dahiliye Vekaletine aittir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="89" başlık="">
      <mvz-fıkra no="1">
        <template>İşbu Köy Kanunu kadın ve erkek nüfusu yüz elliden yukarı olan köyler içindir. Nüfusu yüz elliden aşağı olan köyler bu kanuna göre köy ahalisinden seçim hakkı olanların yarısından çoğunun istemesiyle etrafındaki bir saat ve ondan aşağı olan köylerden birine bağlanırlar veyahut vali veya kaymakam bu kanunun hangi maddeleri yapılacağını ayrıca emreder. Bu kabil köyler hiçbir köye bağlanmaz ve vali veya kaymakam da hiçbir emir vermezse eski göreneklerine göre işlerini yaparlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="90" başlık="">
      <mvz-fıkra no="1">
        <template>Yüz elli nüfustan aşağı birkaç köy bir arada bulunursa her köydeki seçim hakkı onların yarısından çoğunun isteğiyle birleşerek bu kanuna göre bir köy olurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="91" başlık="">
      <mvz-fıkra no="1">
        <template>İşbu kanunun bir tanesini köy odasında diğer bir tanesini de köyün cami veyahut mektebinde bulundurmayan köy muhtarı kaymakamın emriyle köy sandığına beş lira ceza parası verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="92" başlık="">
      <mvz-fıkra no="1">
        <template>İşbu kanundaki cezayinakdiler köy sandığının varidatıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="93" başlık="">
      <mvz-fıkra no="1">
        <template>Köy mühürleri bu kanuna merbut numune veçhile bir çeşitle vilayetlerce yaptırılıp gönderilir. Köy mühürü bir kutu içinde bulundurulur ve üzeri ihtiyar meclisinin en az iki azası tarafından mühürlenir ve ihtiyar meclisi önünde açılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="94" başlık="">
      <mvz-fıkra no="1">
        <template>İşbu Köy Kanunu köy mekteplerinde çocuklara belletilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="95" başlık="">
      <mvz-fıkra no="1">
        <template>İşbu kanuna muhalif ve köylere ait bütün kanunlar, nizamlar ve maddeler kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Salma köyde oturanlar için hane başına tevzi edilir. Bir hanede oturanların kendilerine ait gelirleri olduğu takdirde bunlar dahi ayrı hane sahibi sayılırlar. Salma tevzi edilirken her hanenin tediye kudreti esas olarak gözönünde tutulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Köy haricinde oturup da köyde maddi alakası bulunanların vergi miktarı, o köydeki alaka ve istifadelerinin derecesi nisbetiyle ölçülür ve ona göre tayin olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Köyün aylıklı adamlarının ücretleriyle mecburi işlerden başka hiç bir iş için ve hiç bir nam ve maksatla salma salınamaz. Bu suretle toplanan paralar bu işlerden maada hiç bir yere ve hizmete tahsis olunamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Köy İhtiyar meclisi salınacak salmanın nisbet, cins ve mikdarını İkincikanun ayı içinde tayin ve tevzi cetvellerini tanzim ederek on beş gün müddetle umumun görebileceği yerlere asmak suretiyle ilan ve hariçte bulunanlara tebliğ eder. Salınan salmalarda kanun hükümlerine uygunsuzluk veya nisbetsizlik olduğunu iddia edenler ilan veya tebliğ müddetinin hitamından itibaren on gün içinde itirazlarını köy muhtarına söylerler veya yazı ile bildirirler ve müracaatlarını tutulacak deftere yazdırarak bir ilmühaber alırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Köy ihtiyar meclisi bir hafta içinde itirazlara bakarak kararını vermeğe ve itiraz edenlere bildirmeğe mecburdur. Bu kararlar aleyhine tebliğ tarihinden itibaren on beş gün içinde merkez kazasında valiye, diğer kazalarda kaymakamlara müracaat edilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Salma kararlarının köy karar defterine geçirilmesi ve tadilatının işaret olunması mecburidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Salma mükellefiyetini aynen veya nakden ifa edemiyenler bedenen çalıştırılabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Seçim tutanaklarının verilmesi ilçe seçim kurullarına aittir. Bu kurullar, muhtarlığa ve ihtiyar meclisi asıl ve yedek üyeliklerini kazananların tutanaklarını geciktirmeksizin verir. İlçe seçim kurulu başkanı köy muhtarlığına ve ihtiyar meclisi asıl ve yedek üyeliğine seçilenleri gösteren tutanağın bir suretini o seçim çevresinde derhal ilan ettirir. Diğer bir suretini de bir hafta süre ile ilçe seçim kurulu kapısına astırır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Muhtarlıkları, ihtiyar meclisi asıl ve yedek üyeliklerini kazananların köyler itibariyle bir listesi ilçe seçim kurullarınca vali veya kaymakamlara verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>İlçe seçim kurullarının kararlarına; 26 Nisan 1961 tarihli ve 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkındaki Kanunun 129 uncu maddesinde belirtilen süreler içinde, seçimin iptaline dair kararlarına da 15 gün zarfında, İl seçim kurullarına itiraz edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İl seçim kurulları itirazları inceleyerek en geç bir ay içinde kesin olarak karara bağlarlar. İl seçim kurullarınca muhtar ve ihtiyar meclisi seçimlerinin iptali halinde aşağıda yazıldığı şekilde hareket edilir.</template>
        <mvz-bent no="A">
          <template>Muhtar ve ihtiyar meclisi seçimi iptal edilmişse eski muhtar ve ihtiyar meclisi yeni seçim yapılıncaya kadar görevlerine devam ederler.</template>
        </mvz-bent>
        <mvz-bent no="B">
          <template>Sadece muhtar seçimi iptal edilmişse yeni muhtar seçilinceye kadar muhtarlık görevlerini yeni seçilen birinci üye görür. (Muhtarın geçici olarak görevini yapamayacağı hallerde de görevi, aldıkları oy sırasına göre üyeler tarafından yürütülür.)</template>
        </mvz-bent>
        <mvz-bent no="C">
          <template>Yalnız ihtiyar meclisi seçimi iptal edilmişse eski meclis yeni seçime kadar görevine devam eder.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Devlet İstatistik Enstitüsü İlçe seçim kurulları tarafından seçimi takip eden bir ay zarfında kendisine intikal ettirilecek belgelere dayanarak köyler itibariyle seçmenler sayısını, oy kullananlar sayısını ve muteber sayılan oy sayısını, seçimi takip eden bir yıl içinde yayımlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ara seçimlerinin sonuçları Devlet İstatistik Enstitüsü tarafından yayımlanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Köy muhtarı, köy ihtiyar meclisinin olumlu kararını aldıktan sonra, köy yerleşme planının yapılmasını bağlı bulunduğu mülki amirinden talep edebilir. Köy yerleşme planı, köy yerleşik ve gelişme alanını ihtiva eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Valilikçe resen veya köy muhtarının talebi uygun bulunduğu takdirde, köy yerleşme planının yapılması için Köy Yerleşme Alanı Tespit Komisyonuna gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Köy Yerleşme Alanı Tespit Komisyonu, Vali Yardımcısı başkanlığında Maliye ve Gümrük, Bayındırlık ve İskan, Tarım Orman ve Köyişleri Bakanlıkları ve Tapu Kadastro Genel Müdürlüğü mahalli kuruluşlarının birer teknik elemanı ile köy temsilcisinden oluşur. Gerektiğinde bu komisyona ilgili diğer kuruluşlardan da uzman eleman iştirak ettirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Komisyon, köyün halihazır ve gelişme durumunu dikkate alarak, konut ve genel ihtiyaçlarına göre köy yerleşme planını düzenler. Bu plan üzerinde Tarım Orman ve Köyişleri Bakanlığı, meri İmar Kanunu ve bu konudaki yönetmelik hükümlerine tabi olmaksızın, parsellerin konumunu belirleyen işleri yapar veya yaptırır. Bu plan valilikçe onaylanarak kesinleştirilir ve yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Komisyon kararı ve köy yerleşme planı köy muhtarlığına tebliğ edilir. İtiraz edilmezse valinin onayı ile kesinleşir. Köy muhtarı köy ihtiyar meclisinin kararına dayanarak komisyon kararına karşı en geç 30 gün içinde valiliğe itiraz edebilir, itiraz valilikçe 15 gün içinde karara bağlanır. Bu karar kesindir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kesinleşen kararlar Tarım Orman ve Köyişleri Bakanlığı tarafından uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Köy yerleşme plânında konut alanı ve köy genel ihtiyaçlarına ayrılan yerler, Devletin hüküm ve tasarrufu altında bulunan seyrangâh, yol ve panayır yerleri gibi alanlar ve Hazinenin mülkiyetinde olup kamu hizmetine tahsis edilmemiş taşınmazlardan, 4342 sayılı Mera Kanununun 5 inci maddesi hükümleri uyarınca incelenmesine müteakip mera, yaylak ve kışlak ile otlak ve çayır olarak yararlanılamayacağı anlaşılan yerler köy yerleşme plânının onayı ile bu vasıflarını kendiliğinden kaybeder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak bu madde kapsamında Hazinenin mülkiyetinde olup kamu hizmetine tahsis edilmemiş taşınmazların devri Maliye Bakanlığının görüşü alınmak suretiyle yapılır ve valilikçe köy tüzel kişiliği adına tapuya tescil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Köy tüzelkişiliği adına, köy yerleşme planına göre en çok 2000 m2 olmak üzere tescil edilen parseller köyde ikamet eden ve köy nüfusuna kayıtlı olup evi bulunmayan ihtiyaç sahiplerine ihtiyar meclisi kararı ile rayiç bedel üzerinden satılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Satış bedeli peşin veya en çok 5 yılda ve 5 eşit taksitle tahsil edilerek, o köyün imar işlerinde kullanılmak üzere köy sandığına yatırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Köy ihtiyar meclisince satılan parseller üzerine satış tarihinden itibaren en geç 5 yıl içinde bina yapılması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hak sahipleri bu yerleri 10 yıl müddetle başkalarına devir ve temlik edemezler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>6831 sayılı, Orman, 2634 sayılı Turizmi Teşvik, 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma, 1051 sayılı Kanunla değişik 7269 sayılı Umumi Hayata Müessir Afetler Dolayısıyla Alınacak Tedbirlerle Yapılacak Yardımlara Dair ve 2565 sayılı Askeri Yasak Bölgeler ve Güvenlik Bölgeleri Kanunları bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun hükümleri, belediye mücavir alanında bulunan köyler için, valinin teklifi ve Bayındırlık ve İskan Bakanlığının onayı ile uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Komisyonun teşkili, çalışma ve karar verme esas ve usulleri, köy tüzelkişiliği adına yapılacak tesciller, köy yerleşme planı düzenleme esas ve usulleri, ihtiyaç sahiplerinde aranan vasıflar, devir yasakları, taşınmaz malların amaca uygun kullanılma esasları, rayiç bedel tayini, satış esasları ve diğer hususlar, bir yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yönetmelik, kanunun yürürlüğe girdiği tarihten itibaren en geç iki ay içinde Tarım Orman ve Köyişleri Bakanlığı ile Tapu ve Kadastro Genel Müdürlüğünce ve ilgili kuruluşların görüşleri alınarak hazırlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="" tür="Ek" durum="mülga">
    </mvz-madde>
    <mvz-madde no="17" başlık="" tür="Ek" durum="mülga">
    </mvz-madde>
    <mvz-madde no="18" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Güvenlik korucuları ile korucu başlarının; görevlendirme şekilleri, göreve alınmalarında aranacak şartlar, görevleri, uygulanacak disiplin cezaları ve görevlerine son verilmesini gerektiren haller, disiplin amirleri, yararlanacakları giyim eşyaları ile bunların şekli ve verilme zamanları, eğitim ve denetim usûl ve esasları, sicil ve izinleri, ilk müracaatlarında sahip olmaları gereken sağlık şartları, başka bir işte çalışma hakları ile bu Kanunda yer alan diğer hususlara ilişkin uygulamalar Cumhurbaşkanınca çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Diğer mevzuatta geçen “geçici köy korucusu” ibarelerinden “güvenlik korucusu”; “gönüllü köy korucusu” ibarelerinden “gönüllü güvenlik korucusu” anlaşılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>31/12/2009 tarihinden önce belediye haline dönüşmek veya başka bir belediyenin sınırlarına dâhil olmak suretiyle tüzel kişiliğini kaybeden köylerde, kendilerine bu Kanunun ek 13 üncü maddesine göre taşınmaz satışı yapılan hak sahipleri hakkında satış bedelinin ödenmesi kaydıyla ek 13 üncü maddede öngörülen diğer şartlar uygulanmaz. Bu maddenin yürürlüğe girdiği tarih itibarıyla henüz kesinleşmemiş davalarda da bu madde hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddeyi düzenleyen Kanun ile ek 16 ncımaddede yapılan değişiklik sonucu anılan madde kapsamına girenlerden müracaat edenler, bu maddenin yürürlüğe girdiği tarihi takip eden ay başından itibaren anılan madde hükümlerinden yararlandırılır. Ancak bu maddenin yürürlüğe girdiği tarihten önceki dönem için herhangi bir ödeme yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>27/5/2007 tarihli ve 5673 sayılı Köy Kanununda ve Bazı Kanunlarda Değişiklik Yapılmasına Dair Kanunun yürürlüğe girdiği tarihten önce geçici köy koruculuğu yapanlardan ek 16 ncıve ek 17 nci maddelerde yer alan şartları taşıyanlara yazılı müracaatları üzerine bu maddenin yürürlüğe girdiği tarihi takip eden ay başından itibaren bu madde hükümleri uygulanır. Ancak geçmiş süreler için herhangi bir ödeme yapılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihte güvenlik korucusu olanlardan, bu maddenin yürürlüğe girdiği tarih itibarıyla;</template>
        <mvz-bent no="a">
          <template>49 yaşını dolduranların görevleriyle ilişiği bu maddenin yürürlüğe girdiği tarihten itibaren altı ay içinde kesilir ve bunlara önceden peşin ödenmiş olan ücretin kalan günlere isabet eden tutarı geri alınmaz.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>44 yaşını doldurmuş ancak 50 yaşından gün almamış ve hizmet süresi onbeş yıl ve üzeri olanlardan bu maddenin yürürlüğe girdiği tarihten itibaren altı ay içinde başvuruda bulunanların görevleriyle ilişiği başvuru tarihinden itibaren altı ay içinde kesilir ve bunlara önceden peşin ödenmiş olan ücretin kalan günlere isabet eden tutarı geri alınmaz.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamında ilişiği kesilenlere bu Kanunun ek 16 ncı maddesinin birinci fıkrası uyarınca aylık bağlanır. Aylık miktarı hesaplanırken onbeş yıldan daha az hizmeti olanlar için onbeş yıl esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkra kapsamında ilişiği kesilenlerin yerine aynı yerleşim biriminde görev yapmak üzere öncelikle ve sırasıyla varsa 30 yaşını doldurmamış olmak kaydıyla çocuklarından birisi, yoksa kardeşlerinden birisi güvenlik korucusu olarak görevlendirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkranın (b) bendine göre ilişiği kesilen güvenlik korucularına, ilişiklerinin kesildiği tarihi takip eden aybaşından 50 yaşından gün alacakları tarihi takip eden aybaşına kadar olan ay sayısının, en son aldıkları aylık ücretleri ile ilişiklerinin kesildiği tarihi takip eden aybaşında bu Kanunun ek 16 ncı maddesi uyarınca bağlanan ilk aylıkları arasında oluşan farkın yarısı ile çarpımı sonucu bulunacak tutarda tazminat defaten ödenir. Verilecek tazminat tutarından herhangi bir vergi ve kesinti yapılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce güvenlik koruculuğu görevi sona ermiş olanlardan mülga ek 16 ncı veya mülga ek 17 nci madde hükümleri kapsamında aylık bağlanmasına, tazminat veya ölüm yardımı ödenmesine hak kazananlar hakkında anılan mülga madde hükümlerinin uygulanmasına devam olunur. Ayrıca, mülga ek 16 ncı madde kapsamında aylık bağlanmasına hak kazanan güvenlik korucularının vefatı halinde, 5510 sayılı Kanun hükümlerine göre hak sahiplerine, müracaat tarihini takip eden aybaşından itibaren aylık bağlanır ve geçmişe dönük herhangi bir ödeme yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra uyarınca bu Kanunun mülga ek 16 ncı madde hükümlerine göre bağlanarak ödenen aylıklar dosya bazında, 8/2/2006 tarihli ve 5454 sayılı Kanunun 1 inci maddesi uyarınca yapılacak ek ödeme dâhil 5510 sayılı Kanunun ek 19 uncu maddesi ile belirlenmiş olan tutardan az olamaz. Vefat halinde ise bu tutarın hak sahiplerinin hisseleri oranı esas alınarak tespit olunacak tutarından az olamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun ek 13 üncü maddesine göre satışı yapılan taşınmazlara ilişkin olarak anılan maddede belirlenen süre içerisinde binalarını yapmayan ya da taksitlerini ödemeyen hak sahipleri ile 31/12/2028 tarihinden önce süreleri dolacak olan hak sahiplerine binalarını yapmaları veya taksitlerini ödemeleri amacıyla 31/12/2028 tarihine kadar ek süre verilir. Ancak bu süre içerisinde de hak sahiplerince bina yapılmaması veya taksitlerin ödenmemesi durumunda, bu taşınmazlar köy tüzel kişiliği adına, tüzel kişiliğini kaybeden köylerde ise ilgili belediye adına resen tapuda tescil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="96" başlık="">
      <mvz-fıkra no="1">
        <template>İşbu kanunun hükümleri neşir ve ilanı tarihinden başlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="97" başlık="">
      <mvz-fıkra no="1">
        <template>İşbu kanunun hükümlerini yaptırmağa Dahiliye ve Adliye Vekilleri memurdur.</template>
      </mvz-fıkra>
    </mvz-madde>
