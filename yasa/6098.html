            <mvz-b3 no="1" başlık="Zapttan sorumluluk">
              <mvz-madde no="309" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir üçüncü kişinin kiralananda kiracının hakkıyla bağdaşmayan bir hak ileri sürmesi durumunda kiraya veren, kiracının bildirimi üzerine davayı üstlenmek ve kiracının uğradığı her türlü zararı gidermekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Üçüncü kişinin sözleşmenin kurulmasından sonra üstün hak sahibi olması">
              <mvz-b4 no="a" başlık="Kiralananın el değiştirmesi">
                <mvz-madde no="310" başlık="">
                  <mvz-fıkra no="1">
                    <template>Sözleşmenin kurulmasından sonra kiralanan herhangi bir sebeple el değiştirirse, yeni malik kira sözleşmesinin tarafı olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Kamulaştırmaya ilişkin hükümler saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Üçüncü kişinin sınırlı ayni hak sahibi olması">
                <mvz-madde no="311" başlık="">
                  <mvz-fıkra no="1">
                    <template>Sözleşmenin kurulmasından sonra üçüncü bir kişi, kiralanan üzerinde kiracının hakkını etkileyen bir ayni hak sahibi olursa, kiralananın el değiştirmesiyle ilgili hükümler kıyas yoluyla uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Tapu siciline şerh">
                <mvz-madde no="312" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmaz kiralarında, sözleşmeyle kiracının kiracılık hakkının tapu siciline şerhi kararlaştırılabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Kiracının borçları">
          <mvz-b2 no="I" başlık="Kira bedelini ödeme borcu">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="313" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiracı, kira bedelini ödemekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İfa zamanı">
              <mvz-madde no="314" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiracı, aksine sözleşme ve yerel âdet olmadıkça, kira bedelini ve gerekiyorsa yan giderleri, her ayın sonunda ve en geç kira süresinin bitiminde ödemekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Kiracının temerrüdü">
              <mvz-madde no="315" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiracı, kiralananın tesliminden sonra muaccel olan kira bedelini veya yan gideri ödeme borcunu ifa etmezse, kiraya veren kiracıya yazılı olarak bir süre verip, bu sürede de ifa etmeme durumunda, sözleşmeyi feshedeceğini bildirebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiracıya verilecek süre en az on gün, konut ve çatılı işyeri kiralarında ise en az otuz gündür. Bu süre, kiracıya yazılı bildirimin yapıldığı tarihi izleyen günden itibaren işlemeye başlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Özenle kullanma ve komşulara saygı gösterme borcu">
            <mvz-madde no="316" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı, kiralananı, sözleşmeye uygun olarak özenle kullanmak ve kiralananın bulunduğu taşınmazda oturan kişiler ile komşulara gerekli saygıyı göstermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiracının bu yükümlülüğüne aykırı davranması durumunda kiraya veren, konut ve çatılı işyeri kirasında, en az otuz gün süre vererek, aykırılığın giderilmesi, aksi takdirde sözleşmeyi feshedeceği konusunda yazılı bir ihtarda bulunur. Diğer kira ilişkilerinde ise, kiraya veren, kiracıya önceden bir ihtarda bulunmaksızın, yazılı bir bildirimle sözleşmeyi hemen feshedebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Konut ve çatılı işyeri kirasında, kiracının kiralanana kasten ağır bir zarar vermesi, kiracıya verilecek sürenin yararsız olacağının anlaşılması veya kiracının bu yükümlülüğe aykırı davranışının kiraya veren veya aynı taşınmazda oturan kişiler ile komşular bakımından çekilmez olması durumlarında kiraya veren, yazılı bir bildirimle sözleşmeyi hemen feshedebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Temizlik ve bakım giderlerini ödeme borcu">
            <mvz-madde no="317" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı, kiralananın olağan kullanımı için gerekli temizlik ve bakım giderlerini ödemekle yükümlüdür. Bu konuda yerel âdete de bakılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Ayıpları kiraya verene bildirme borcu">
            <mvz-madde no="318" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı, kendisinin gidermekle yükümlü olmadığı ayıpları kiraya verene gecikmeksizin bildirmekle yükümlüdür; aksi takdirde bundan doğan zarardan sorumludur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Ayıpların giderilmesine ve kiralananın gösterilmesine katlanma borcu">
            <mvz-madde no="319" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı, kiralananın ayıplarının giderilmesine ya da zararların önlenmesine yönelik çalışmalara katlanmakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiracı, bakım, satış ya da sonraki kiralama için zorunlu olduğu ölçüde, kiraya verenin ve onun belirlediği üçüncü kişinin kiralananı gezip görmesine izin vermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kiraya veren, çalışmaları ve kiralananın gezilip görüleceğini uygun bir süre önce kiracıya bildirmek ve bunların yapıldığı sırada kiracının yararlarını göz önünde tutmak zorundadır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Kiracının kira bedelinin indirilmesine ve zararının giderilmesine ilişkin hakları saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Özel durumlar">
          <mvz-b2 no="I" başlık="Kiralananda yenilik ve değişiklik yapılması">
            <mvz-b3 no="1" başlık="Kiraya veren tarafından">
              <mvz-madde no="320" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiraya veren, kiralananda, kira sözleşmesinin feshini gerektirmeyen ve kiracıdan katlanması beklenebilecek olan yenilik ve değişiklikler yapabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu yenilik ve değişikliklerin yapılması sırasında kiraya veren, kiracının menfaatlerini gözetmekle yükümlüdür. Kiracının, kira bedelinin indirilmesine ve zararının giderilmesine ilişkin hakları saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Kiracı tarafından">
              <mvz-madde no="321" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiracı, kiraya verenin yazılı rızasıyla kiralananda yenilik ve değişiklikler yapabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yenilik ve değişikliklere rıza gösteren kiraya veren, yazılı olarak kararlaştırılmış olmadıkça, kiralananın eski durumuyla geri verilmesini isteyemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kiracı, aksine yazılı bir anlaşma yoksa, kiraya verenin rızasıyla yaptığı yenilik ve değişiklikler sebebiyle kiralananda ortaya çıkan değer artışının karşılığını isteyemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Alt kira ve kullanım hakkının devri">
            <mvz-madde no="322" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı, kiraya verene zarar verecek bir değişikliğe yol açmamak koşuluyla, kiralananı tamamen veya kısmen başkasına kiraya verebileceği gibi, kullanım hakkını da başkasına devredebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiracı, konut ve çatılı işyeri kiralarında, kiraya verenin yazılı rızası olmadıkça, kiralananı başkasına kiralayamayacağı gibi, kullanım hakkını da devredemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Alt kiracı, kiralananı kiracıya tanınandan başka biçimde kullandığı takdirde kiracı, kiraya verene karşı sorumlu olur. Bu durumda kiraya veren, kiracısına karşı sahip olduğu hakları alt kiracıya veya kullanım hakkını devralana karşı da kullanabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Kira ilişkisinin devri">
            <mvz-madde no="323" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı, kiraya verenin yazılı rızasını almadıkça, kira ilişkisini başkasına devredemez. Kiraya veren, işyeri kiralarında haklı sebep olmadıkça bu rızayı vermekten kaçınamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiraya verenin yazılı rızasıyla kira ilişkisi kendisine devredilen kişi, kira sözleşmesinde kiracının yerine geçer ve devreden kiracı, kiraya verene karşı borçlarından kurtulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>İşyeri kiralarında devreden kiracı, kira sözleşmesinin bitimine kadar ve en fazla iki yıl süreyle devralanla birlikte müteselsilen sorumlu olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Kiralananın kullanılmaması">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="324" başlık="">
                <mvz-fıkra no="1">
                  <template>Kullanıma elverişli bulundurulduğu sürece kiralanan, kiracının kendisinden kaynaklanan bir sebeple kullanılmasa veya sınırlı olarak kullanılsa bile kiracı, kira bedelini ödemekle yükümlüdür. Bu durumda, kiraya verenin yapmaktan kurtulduğu giderler kira bedelinden indirilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Kiralananın sözleşmenin bitiminden önce geri verilmesi">
              <mvz-madde no="325" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiracı, sözleşme süresine veya fesih dönemine uymaksızın kiralananı geri verdiği takdirde, kira sözleşmesinden doğan borçları, kiralananın benzer koşullarla kiraya verilebileceği makul bir süre için devam eder. Kiracının bu sürenin geçmesinden önce kiraya verenden kabul etmesi beklenebilecek, ödeme gücüne sahip ve kira ilişkisini devralmaya hazır yeni bir kiracı bulması hâlinde, kiracının kira sözleşmesinden doğan borçları sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiraya veren, yapmaktan kurtulduğu giderler ile kiralananı başka biçimde kullanmakla elde ettiği veya elde etmekten kasten kaçındığı yararları kira bedelinden indirmekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Takastan feragat yasağı">
            <mvz-madde no="326" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı ve kiraya veren, kira sözleşmesinden doğan alacaklarını takas etme hakkından önceden feragat edemezler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Sözleşmenin sona ermesi">
          <mvz-b2 no="I" başlık="Sürenin geçmesi">
            <mvz-madde no="327" başlık="">
              <mvz-fıkra no="1">
                <template>Açık veya örtülü biçimde bir süre belirlenmişse, kira sözleşmesi bu sürenin sonunda kendiliğinden sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Taraflar, bu durumda, açık bir anlaşma olmaksızın kira ilişkisini sürdürürlerse, kira sözleşmesi belirsiz süreli sözleşmeye dönüşür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Belirsiz süreli kira sözleşmelerinde fesih bildirimi">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="328" başlık="">
                <mvz-fıkra no="1">
                  <template>Belirsiz süreli kira sözleşmelerinde taraflardan her biri, daha uzun bir fesih bildirim süresi veya başka bir fesih dönemi kararlaştırılmış olmadıkça, yasal fesih dönemlerine ve fesih bildirim sürelerine uyarak sözleşmeyi feshedebilir. Fesih dönemlerinin hesabında, kira sözleşmesinin başlangıç tarihi esas alınır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Sözleşmede veya kanunda belirtilen fesih dönemine veya bildirim süresine uyulmamışsa, bildirim bir sonraki fesih dönemi için geçerli olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Taşınmaz ve taşınır yapı kiralarında">
              <mvz-madde no="329" başlık="">
                <mvz-fıkra no="1">
                  <template>Taraflardan her biri, bir taşınmaza veya taşınır bir yapıya ilişkin kira sözleşmesini yerel âdette belirlenen kira döneminin sonu için veya böyle bir âdetin bulunmaması durumunda, altı aylık kira döneminin sonu için, üç aylık fesih bildirim süresine uyarak feshedebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Taşınır kiralarında">
              <mvz-madde no="330" başlık="">
                <mvz-fıkra no="1">
                  <template>Taraflardan her biri, bir taşınıra ilişkin kira sözleşmesini üç gün önceden yapılacak fesih bildirim süresine uyarak her zaman feshedebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiraya verenin meslekî faaliyeti gereği kiraya verdiği ve kiracının da özel kullanımına yarayan taşınır bir malın kiracısı, kira sözleşmesini, üç aylık kira dönemi sonu için en az bir ay önceden yapacağı bir fesih bildirimiyle sona erdirebilir. Bu durumda kiraya verenin, zararının giderilmesini isteme hakkı yoktur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Olağanüstü fesih">
            <mvz-b3 no="1" başlık="Önemli sebepler">
              <mvz-madde no="331" başlık="">
                <mvz-fıkra no="1">
                  <template>Taraflardan her biri, kira ilişkisinin devamını kendisi için çekilmez hâle getiren önemli sebeplerin varlığı durumunda, sözleşmeyi yasal fesih bildirim süresine uyarak her zaman feshedebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hâkim, durum ve koşulları göz önünde tutarak, olağanüstü fesih bildiriminin parasal sonuçlarını karara bağlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Kiracının iflası">
              <mvz-madde no="332" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiracı, kiralananın tesliminden sonra iflas ederse kiraya veren, işleyecek kira bedelleri için güvence verilmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiraya veren, güvence verilmesi için kiracı ve iflas masasına yazılı olarak uygun bir süre verir. Bu süre içinde kendisine güvence verilmezse kiraya veren, sözleşmeyi herhangi bir fesih bildirim süresine uymaksızın hemen feshedebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Kiracının ölümü">
              <mvz-madde no="333" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiracının ölmesi durumunda mirasçıları, yasal fesih bildirim süresine uyarak en yakın fesih dönemi sonu için sözleşmeyi feshedebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="G" başlık="Kiralananın geri verilmesi">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="334" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı kiralananı ne durumda teslim almışsa, kira sözleşmesinin bitiminde o durumda geri vermekle yükümlüdür. Ancak, kiracı sözleşmeye uygun kullanma dolayısıyla kiralananda meydana gelen eskimelerden ve bozulmalardan sorumlu değildir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiracının, sözleşmenin sona ermesi hâlinde, sözleşmeye aykırı kullanmadan doğacak zararları giderme dışında, başkaca bir tazminat ödeyeceğini önceden taahhüt etmesine ilişkin anlaşmalar geçersizdir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kiralananın gözden geçirilmesi ve kiracıya bildirme">
            <mvz-madde no="335" başlık="">
              <mvz-fıkra no="1">
                <template>Kiraya veren, geri verme sırasında kiralananın durumunu gözden geçirmek ve kiracının sorumlu olduğu eksiklikleri ve ayıpları ona hemen yazılı olarak bildirmek zorundadır. Bu bildirim yapılmazsa, kiracı her türlü sorumluluktan kurtulur. Ancak, teslim alma sırasında olağan incelemeyle belirlenemeyecek olan eksikliklerin ve ayıpların varlığı hâlinde, kiracının sorumluluğu devam eder. Kiraya veren, bu tür eksiklikleri ve ayıpları belirlediğinde, kiracıya hemen yazılı olarak bildirmek zorundadır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="H" başlık="Kiraya verenin hapis hakkı">
          <mvz-b2 no="I" başlık="Konusu">
            <mvz-madde no="336" başlık="">
              <mvz-fıkra no="1">
                <template>Taşınmaz kiralarında kiraya veren, işlemiş bir yıllık ve işlemekte olan altı aylık kira bedelinin güvencesi olmak üzere, kiralananda bulunan ve kiralananın döşenmesine veya kullanılmasına yarayan taşınırlar üzerinde hapis hakkına sahiptir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiraya verenin hapis hakkı, alt kiracının asıl kiracıya olan kira borcunu aşmamak üzere, alt kiracının kiralanana getirdiği aynı nitelikteki taşınırları da kapsar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Hapis hakkı, kiracının haczedilemeyen malları üzerinde kullanılamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Üçüncü kişilere ait olan eşya">
            <mvz-madde no="337" başlık="">
              <mvz-fıkra no="1">
                <template>Üçüncü kişilerin, kiraya verenin kiracıya ait olmadığını bildiği veya bilmesi gerektiği eşya ile çalınmış, kaybolmuş veya başka bir biçimde malikinin elinden iradesi dışında çıkmış eşya üzerindeki hakları, kiraya verenin hapis hakkından önce gelir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiraya veren, kiracı tarafından kiralanana getirilmiş olan taşınırların kiracının mülkiyetinde olmadığını kira sözleşmesi devam ederken öğrendiği hâlde, sözleşmeyi en yakın fesih döneminin sonu için feshetmezse, bu eşya üzerindeki hapis hakkını kaybeder.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Hakkın kullanılması">
            <mvz-madde no="338" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı, taşınmak veya kiralananda bulunan taşınırları başka bir yere taşımak istediği takdirde, kiraya veren, alacağını güvence altına almasını sağlayacak miktardaki taşınırı, sulh hâkiminin veya icra müdürünün kararıyla alıkoyabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Alıkoyma kararının konusu olan eşya, gizlice veya zorla götürülürse, götürülmelerinden başlayarak on gün içinde kolluk gücünün yardımıyla kiralanana geri getirilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Konut ve Çatılı İşyeri Kiraları">
        <mvz-b1 no="A" başlık="Uygulama alanı">
          <mvz-madde no="339" başlık="">
            <mvz-fıkra no="1">
              <template>Konut ve çatılı işyeri kiralarına ilişkin hükümler, bunlarla birlikte kullanımı kiracıya bırakılan eşya hakkında da uygulanır. Ancak bu hükümler, niteliği gereği geçici kullanıma özgülenmiş taşınmazların altı ay ve daha kısa süreyle kiralanmalarında uygulanmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kamu kurum ve kuruluşlarının, hangi usul ve esaslar içinde olursa olsun yaptıkları bütün kira sözleşmelerine de bu hükümler uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Bağlantılı sözleşme">
          <mvz-madde no="340" başlık="">
            <mvz-fıkra no="1">
              <template>Konut ve çatılı işyeri kiralarında sözleşmenin kurulması ya da sürdürülmesi, kiracının yararı olmaksızın, kiralananın kullanımıyla doğrudan ilişkisi olmayan bir borç altına girmesine bağlanmışsa, kirayla bağlantılı sözleşme geçersizdir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Kullanma giderleri">
          <mvz-madde no="341" başlık="">
            <mvz-fıkra no="1">
              <template>Kiracı, konut ve çatılı işyeri kiralarında, sözleşmede aksi öngörülmemişse veya aksine yerel âdet yoksa, ısıtma, aydınlatma ve su gibi kullanma giderlerine katlanmakla yükümlüdür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Giderlere katlanan taraf, bu giderleri ispat edici belgelerin birer örneğini, istem üzerine diğer tarafa vermek zorundadır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Kiracının güvence vermesi">
          <mvz-madde no="342" başlık="">
            <mvz-fıkra no="1">
              <template>Konut ve çatılı işyeri kiralarında sözleşmeyle kiracıya güvence verme borcu getirilmişse, bu güvence üç aylık kira bedelini aşamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Güvence olarak para veya kıymetli evrak verilmesi kararlaştırılmışsa kiracı, kiraya verenin onayı olmaksızın çekilmemek üzere, parayı vadeli bir tasarruf hesabına yatırır, kıymetli evrakı ise bir bankaya depo eder. Banka, güvenceleri ancak iki tarafın rızasıyla veya icra takibinin kesinleşmesiyle ya da kesinleşmiş mahkeme kararına dayanarak geri verebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kiraya veren, kira sözleşmesinin sona ermesini izleyen üç ay içinde kiracıya karşı kira sözleşmesiyle ilgili bir dava açtığını veya icra ya da iflas yoluyla takibe giriştiğini bankaya yazılı olarak bildirmemişse banka, kiracının istemi üzerine güvenceyi geri vermekle yükümlüdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Kira bedeli">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="343" başlık="">
              <mvz-fıkra no="1">
                <template>Kira sözleşmelerinde kira bedelinin belirlenmesi dışında, kiracı aleyhine değişiklik yapılamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Belirlenmesi">
            <mvz-madde no="344" başlık="">
              <mvz-fıkra no="1">
                <template>Tarafların yenilenen kira dönemlerinde uygulanacak kira bedeline ilişkin anlaşmaları, bir önceki kira yılında tüketici fiyat endeksindeki oniki aylık ortalamalara göre değişim oranını geçmemek koşuluyla geçerlidir. Bu kural, bir yıldan daha uzun süreli kira sözleşmelerinde de uygulanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Taraflarca bu konuda bir anlaşma yapılmamışsa, kira bedeli, bir önceki kira yılının tüketici fiyat endeksindeki oniki aylık ortalamalara göre değişim oranını geçmemek koşuluyla hâkim tarafından, kiralananın durumu göz önüne alınarak hakkaniyete göre belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Taraflarca bu konuda bir anlaşma yapılıp yapılmadığına bakılmaksızın, beş yıldan uzun süreli veya beş yıldan sonra yenilenen kira sözleşmelerinde ve bundan sonraki her beş yılın sonunda, yeni kira yılında uygulanacak kira bedeli, hâkim tarafından tüketici fiyat endeksindeki oniki aylık ortalamalara göre değişim oranı, kiralananın durumu ve emsal kira bedelleri göz önünde tutularak hakkaniyete uygun biçimde belirlenir. Her beş yıldan sonraki kira yılında bu biçimde belirlenen kira bedeli, önceki fıkralarda yer alan ilkelere göre değiştirilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Sözleşmede kira bedeli yabancı para olarak kararlaştırılmışsa 20/2/1930 tarihli ve 1567 sayılı Türk Parasının Kıymetini Koruma Hakkında Kanun hükümleri saklı kalmak şartıyla, beş yıl geçmedikçe kira bedelinde değişiklik yapılamaz. Ancak, bu Kanunun, “Aşırı ifa güçlüğü” başlıklı 138 inci maddesi hükmü saklıdır. Beş yıl geçtikten sonra kira bedelinin belirlenmesinde, yabancı paranın değerindeki değişiklikler de göz önünde tutularak üçüncü fıkra hükmü uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Dava açma süresi ve kararın etkisi">
            <mvz-madde no="345" başlık="">
              <mvz-fıkra no="1">
                <template>Kira bedelinin belirlenmesine ilişkin dava her zaman açılabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ancak, bu dava, yeni dönemin başlangıcından en geç otuz gün önceki bir tarihte açıldığı ya da kiraya veren tarafından bu süre içinde kira bedelinin artırılacağına ilişkin olarak kiracıya yazılı bildirimde bulunulmuş olması koşuluyla, izleyen yeni kira dönemi sonuna kadar açıldığı takdirde, mahkemece belirlenecek kira bedeli, bu yeni kira döneminin başlangıcından itibaren kiracıyı bağlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Sözleşmede yeni kira döneminde kira bedelinin artırılacağına ilişkin bir hüküm varsa, yeni kira döneminin sonuna kadar açılacak davada mahkemece belirlenecek kira bedeli de, bu yeni dönemin başlangıcından itibaren geçerli olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Kiracı aleyhine düzenleme yasağı">
            <mvz-madde no="346" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracıya, kira bedeli ve yan giderler dışında başka bir ödeme yükümlülüğü getirilemez. Özellikle, kira bedelinin zamanında ödenmemesi hâlinde ceza koşulu ödeneceğine veya sonraki kira bedellerinin muaccel olacağına ilişkin anlaşmalar geçersizdir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Konut ve çatılı işyeri kiralarında sözleşmenin sona ermesi">
          <mvz-b2 no="I" başlık="Bildirim yoluyla">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="347" başlık="">
                <mvz-fıkra no="1">
                  <template>Konut ve çatılı işyeri kiralarında kiracı, belirli süreli sözleşmelerin süresinin bitiminden en az onbeş gün önce bildirimde bulunmadıkça, sözleşme aynı koşullarla bir yıl için uzatılmış sayılır. Kiraya veren, sözleşme süresinin bitimine dayanarak sözleşmeyi sona erdiremez. Ancak, on yıllık uzama süresi sonunda kiraya veren, bu süreyi izleyen her uzama yılının bitiminden en az üç ay önce bildirimde bulunmak koşuluyla, herhangi bir sebep göstermeksizin sözleşmeye son verebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Belirsiz süreli kira sözleşmelerinde, kiracı her zaman, kiraya veren ise kiranın başlangıcından on yıl geçtikten sonra, genel hükümlere göre fesih bildirimiyle sözleşmeyi sona erdirebilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Genel hükümlere göre fesih hakkının kullanılabileceği durumlarda, kiraya veren veya kiracı sözleşmeyi sona erdirebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Bildirimin geçerliliği">
              <mvz-b4 no="a" başlık="Şekil">
                <mvz-madde no="348" başlık="">
                  <mvz-fıkra no="1">
                    <template>Konut ve çatılı işyeri kiralarında fesih bildiriminin geçerliliği, yazılı şekilde yapılmasına bağlıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Aile konutu">
                <mvz-madde no="349" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aile konutu olarak kullanılmak üzere kiralanan taşınmazlarda kiracı, eşinin açık rızası olmadıkça kira sözleşmesini feshedemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu rızanın alınması mümkün olmazsa veya eş haklı sebep olmaksızın rızasını vermekten kaçınırsa kiracı, hâkimden bu konuda bir karar vermesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Kiracı olmayan eşin, kiraya verene bildirimde bulunarak kira sözleşmesinin tarafı sıfatını kazanması hâlinde kiraya veren, fesih bildirimi ile fesih ihtarına bağlı bir ödeme süresini kiracıya ve eşine ayrı ayrı bildirmek zorundadır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Dava yoluyla">
            <mvz-b3 no="1" başlık="Kiraya verenden kaynaklanan sebeplerle">
              <mvz-b4 no="a" başlık="Gereksinim, yeniden inşa ve imar">
                <mvz-madde no="350" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kiraya veren, kira sözleşmesini;</template>
                    <mvz-bent no="a">
                      <template>1. Kiralananı kendisi, eşi, altsoyu, üstsoyu veya kanun gereği bakmakla yükümlü olduğu diğer kişiler için konut ya da işyeri gereksinimi sebebiyle kullanma zorunluluğu varsa,</template>
                    </mvz-bent>
                    <mvz-bent no="b">
                      <template>2. Kiralananın yeniden inşası veya imarı amacıyla esaslı onarımı, genişletilmesi ya da değiştirilmesi gerekli ve bu işler sırasında kiralananın kullanımı imkânsız ise,</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="0">
                    <template>belirli süreli sözleşmelerde sürenin sonunda, belirsiz süreli sözleşmelerde kiraya ilişkin genel hükümlere göre fesih dönemine ve fesih bildirimi için öngörülen sürelere uyularak belirlenecek tarihten başlayarak bir ay içinde açacağı dava ile sona erdirebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Yeni malikin gereksinimi">
                <mvz-madde no="351" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kiralananı sonradan edinen kişi, onu kendisi, eşi, altsoyu, üstsoyu veya kanun gereği bakmakla yükümlü olduğu diğer kişiler için konut veya işyeri gereksinimi sebebiyle kullanma zorunluluğu varsa, edinme tarihinden başlayarak bir ay içinde durumu kiracıya yazılı olarak bildirmek koşuluyla, kira sözleşmesini altı ay sonra açacağı bir davayla sona erdirebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Kiralananı sonradan edinen kişi, dilerse gereksinim sebebiyle sözleşmeyi sona erdirme hakkını, sözleşme süresinin bitiminden başlayarak bir ay içinde açacağı dava yoluyla da kullanabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Kiracıdan kaynaklanan sebeplerle">
              <mvz-madde no="352" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiracı, kiralananın teslim edilmesinden sonra, kiraya verene karşı, kiralananı belli bir tarihte boşaltmayı yazılı olarak üstlendiği hâlde boşaltmamışsa kiraya veren, kira sözleşmesini bu tarihten başlayarak bir ay içinde icraya başvurmak veya dava açmak suretiyle sona erdirebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiracı, bir yıldan kısa süreli kira sözleşmelerinde kira süresi içinde; bir yıl ve daha uzun süreli kira sözleşmelerinde ise bir kira yılı veya bir kira yılını aşan süre içinde kira bedelini ödemediği için kendisine yazılı olarak iki haklı ihtarda bulunulmasına sebep olmuşsa kiraya veren, kira süresinin ve bir yıldan uzun süreli kiralarda ihtarların yapıldığı kira yılının bitiminden başlayarak bir ay içinde, dava yoluyla kira sözleşmesini sona erdirebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kiracının veya birlikte yaşadığı eşinin aynı ilçe veya belde belediye sınırları içinde oturmaya elverişli bir konutu bulunması durumunda kiraya veren, kira sözleşmesinin kurulması sırasında bunu bilmiyorsa, sözleşmenin bitiminden başlayarak bir ay içinde sözleşmeyi dava yoluyla sona erdirebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Dava süresinin uzaması">
              <mvz-madde no="353" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiraya veren, en geç davanın açılması için öngörülen sürede dava açacağını kiracıya yazılı olarak bildirmişse, dava açma süresi bir kira yılı için uzamış sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Dava sebeplerinin sınırlılığı">
              <mvz-madde no="354" başlık="">
                <mvz-fıkra no="1">
                  <template>Dava yoluyla kira sözleşmesinin sona erdirilmesine ilişkin hükümler, kiracı aleyhine değiştirilemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Yeniden kiralama yasağı">
              <mvz-madde no="355" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiraya veren, gereksinim amacıyla kiralananın boşaltılmasını sağladığında, haklı sebep olmaksızın, kiralananı üç yıl geçmedikçe eski kiracısından başkasına kiralayamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yeniden inşa ve imar amacıyla boşaltılması sağlanan taşınmazlar, eski hâli ile, haklı sebep olmaksızın üç yıl geçmedikçe başkasına kiralanamaz. Eski kiracının, yeniden inşa ve imarı gerçekleştirilen taşınmazları, yeni durumu ve yeni kira bedeli ile kiralama konusunda öncelik hakkı vardır. Bu hakkın, kiraya verenin yapacağı yazılı bildirimi izleyen bir ay içinde kullanılması gerekir; bu öncelik hakkı sona erdirilmedikçe, taşınmaz üç yıl geçmeden başkasına kiralanamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kiraya veren, bu hükümlere aykırı davrandığı takdirde, eski kiracısına son kira yılında ödenmiş olan bir yıllık kira bedelinden az olmamak üzere tazminat ödemekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="6" başlık="Kiracının ölümünde sözleşmenin sürdürülmesi">
              <mvz-madde no="356" başlık="">
                <mvz-fıkra no="1">
                  <template>Ölen kiracının ortakları veya bu ortakların aynı meslek ve sanatı yürüten mirasçıları ve ölen kiracı ile birlikte aynı konutta oturanlar, sözleşmeye ve kanun hükümlerine uydukları sürece, taraf olarak kira sözleşmesini sürdürebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Ürün Kirası">
        <mvz-b1 no="A" başlık="Tanımı">
          <mvz-madde no="357" başlık="">
            <mvz-fıkra no="1">
              <template>Ürün kirası kiraya verenin, kiracıya, ürün veren bir şeyin veya hakkın kullanılmasını ve ürünlerin devşirilmesini bedel karşılığında bırakmayı üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ürüne katılmalı kira, kira bedelinin devşirilecek ürünün belli bir oranı olarak kararlaştırıldığı ürün kirasıdır. Bu oran sözleşmeyle kararlaştırılmamışsa, yerel âdete göre belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Genel hükümlerin uygulanması">
          <mvz-madde no="358" başlık="">
            <mvz-fıkra no="1">
              <template>Bu ayırımda ürün kirasına ilişkin özel hüküm bulunmadıkça, kira sözleşmesine ilişkin genel hükümler uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Tutanak düzenleme">
          <mvz-madde no="359" başlık="">
            <mvz-fıkra no="1">
              <template>Kira sözleşmesi, araç ve gereçleri, hayvanları, devredilen eşyayı veya stoklanmış malları da içeriyorsa taraflar, bunların değerlerini birlikte takdir ederek iki nüsha düzenleyecekleri tutanağa geçirip imzalayarak, birbirlerine vermekle yükümlüdürler.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Kiraya verenin borçları">
          <mvz-b2 no="I" başlık="Teslim borcu">
            <mvz-madde no="360" başlık="">
              <mvz-fıkra no="1">
                <template>Kiraya veren, birlikte kiralanmış taşınır şeyler varsa bunlar da içinde olmak üzere, kiralananı, sözleşmenin amacına uygun biçimde kullanılmaya ve işletilmeye elverişli bir durumda kiracıya teslim etmek ve sözleşme süresince bu durumda bulundurmakla yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Esaslı onarımlar">
            <mvz-madde no="361" başlık="">
              <mvz-fıkra no="1">
                <template>Kiraya veren, kira süresi içinde yapılması zorunlu olan esaslı onarımları, kiracı tarafından bildirilir bildirilmez, gideri kendisine ait olmak üzere yapmakla yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Kiracının borçları">
          <mvz-b2 no="I" başlık="Kira bedelini ve yan giderleri ödeme borcu">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="362" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiracı, sözleşmede aksine bir hüküm veya yerel âdet olmadıkça, kira bedelini ve yan giderleri her kira yılının ve en geç kira süresinin sonunda ödemekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiracı, kiralananın tesliminden sonra vadesi gelmiş kira bedelini veya yan giderleri ödemezse kiraya veren, kiracıya yazılı olarak en az altmış günlük bir önel verip, bu önel içinde ödememesi durumunda sözleşmeyi feshedeceğini bildirebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Olağanüstü durumlarda kira bedelinden indirim">
              <mvz-madde no="363" başlık="">
                <mvz-fıkra no="1">
                  <template>Tarımsal bir taşınmazın her zamanki verimi, olağanüstü felaket veya doğal olaylar yüzünden önemli ölçüde azalırsa kiracı, kira bedelinden orantılı bir miktarın indirilmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu haktan başlangıçta feragat, ancak kira bedelinin belirlenmesi sırasında bu gibi durumların meydana gelmesi olasılığı göz önünde tutulmuş veya doğan zarar bir sigorta ile karşılanmış ise, geçerli olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kiralananı kullanma ve işletme borcu">
            <mvz-madde no="364" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı, kiralananı özgülendiği amaca uygun ve iyi bir biçimde işletmekle, özellikle ürün vermeye elverişli bir durumda bulundurmakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiracı, kiraya verenin izni olmaksızın, kiralananın işletme usulünü, kira süresinin bitiminden sonra etkisi görülebilecek biçimde değiştiremez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Bakım borcu">
            <mvz-madde no="365" başlık="">
              <mvz-fıkra no="1">
                <template>Kiracı, kiralananın bakımını gereği gibi sağlamakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiracı, yerel âdete uygun olarak küçük onarımları yapmak, bozulan veya kullanılmayla yok olan düşük değerli araç ve gereçlerin yerine yenilerini koymak zorundadır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Alt kira ve kullanım hakkını devir yasağı">
          <mvz-madde no="366" başlık="">
            <mvz-fıkra no="1">
              <template>Kiracı, kiraya verenin rızası olmaksızın kiralananı başkasına kiraya veremeyeceği gibi, kullanım ve işletme hakkını da başkasına devredemez. Ancak kiracı, kiralananda bulunan bazı yerleri, kiraya veren için zarar doğuracak bir değişikliği gerektirmemek koşuluyla kiraya verebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kiracının, başkasıyla yaptığı bu kira sözleşmelerine, alt kiraya ilişkin kurallar, kıyas yoluyla uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="G" başlık="Sözleşmenin sona ermesi">
          <mvz-b2 no="I" başlık="Sona erme sebepleri">
            <mvz-b3 no="1" başlık="Sürenin geçmesi">
              <mvz-madde no="367" başlık="">
                <mvz-fıkra no="1">
                  <template>Belirli süreli kira sözleşmesi, sürenin bitiminde kendiliğinden sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ancak, tarafların örtülü olarak sözleşmeyi sürdürmeleri hâlinde, aksi kararlaştırılmadıkça, kira sözleşmesi birer yıl için yenilenmiş sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Yenilenen kira sözleşmesi yasal bildirim süresine uyularak, her kira yılının sonu için feshedilebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Fesih bildirimi">
              <mvz-madde no="368" başlık="">
                <mvz-fıkra no="1">
                  <template>Belirsiz süreli sözleşmede, fesih bildirim süresi sözleşme veya yerel âdetle belirlenmemişse, en az altı aylık bir bildirim süresine uyulmak koşuluyla, taraflardan her biri sözleşmeyi feshedebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Aksine bir anlaşma yoksa, tarımsal taşınmazlara ilişkin ürün kiralarında yerel âdetçe uygulanan bahar veya güz mevsimleri için; diğer ürün kiralarında ise herhangi bir zaman için fesih bildirimi yapılabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Olağanüstü fesih">
              <mvz-b4 no="a" başlık="Önemli sebepler">
                <mvz-madde no="369" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taraflardan biri, kira ilişkisinin devamını kendisi için çekilmez hâle getiren önemli sebeplerin varlığı durumunda, sözleşmeyi yasal fesih bildirim süresine uyarak her zaman feshedebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Hâkim, durum ve koşulları göz önünde tutarak, olağanüstü fesih bildiriminin parasal sonuçlarını karara bağlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Kiracının iflası">
                <mvz-madde no="370" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kiracının iflası hâlinde sözleşme, iflasın açıldığı anda, kendiliğinden sona erer. Ancak, kiraya veren, işlemekte olan kira ve tutanağa geçirilen eşya için yeterli güvence verildiği takdirde, sözleşmeyi kira yılının sonuna kadar sürdürmekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Kiracının ölümü">
                <mvz-madde no="371" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kiracının ölümü hâlinde, onun mirasçıları ve kiraya veren, altı aylık yasal fesih bildirim sürelerine uymak koşuluyla, sözleşmeyi feshedebilirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sona ermenin sonuçları">
            <mvz-b3 no="1" başlık="Geri verme">
              <mvz-madde no="372" başlık="">
                <mvz-fıkra no="1">
                  <template>Kira süresinin bitiminde kiracı, kiralananı, tutanağa geçirilmiş olan bütün eşyalarla birlikte ve bulundukları durumda geri vermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiracı, iyi işletilme durumunda kaçınılabilecek olan değer eksiklikleri için tazminat ödemekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kiracı, kiralanana göstermekle yükümlü olduğu özen çerçevesinde meydana gelen değer artışları için tazminat isteyemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Tutanağa geçirilmiş eşya">
              <mvz-madde no="373" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiralanan teslim edilirken tutanağa geçirilmiş olan eşyalara değer biçilmişse kiracı, kira sözleşmesi sona erince, bunları özdeş tür ve değerde olmak üzere geri vermekle veya değer eksikliklerini gidermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiracı, kiraya verenin kusurunu ya da mücbir sebebin varlığını ispat ederek geri vermekten veya tazminat ödemekten kurtulabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kiracı, kendisinin yaptığı masraflardan veya emeğinden doğan değer artışı için tazminat isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Ürün ve yetişme giderleri">
              <mvz-madde no="374" başlık="">
                <mvz-fıkra no="1">
                  <template>Tarımsal bir taşınmazın kiracısı, kira sözleşmesinin sona erdiği anda henüz devşirilmemiş ürünler üzerinde bir hak ileri süremez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ancak kiracı, ürünün yetişmesi için yapmış olduğu tarım giderlerinin hâkim tarafından belirlenecek miktarını, kiraya verenden tazminat olarak isteyebilir ve bu tazminat işlemiş kiralardan indirilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Saman, gübre ve benzerleri">
              <mvz-madde no="375" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiralananı geri veren kiracı, düzenli bir işletmenin gerektirdiği oranda, son yılın samanlarını, hayvan yataklarını, kuru ot ve gübrelerini kiralananda bırakmakla yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiracı, almış olduğundan daha fazlasını bırakıyorsa, bıraktığı fazlalık için tazminat isteme hakkına sahiptir; aldığından daha az bırakıyorsa, eksikleri tamamlamak veya değer eksikliğini gidermekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="H" başlık="Hayvan kirası">
          <mvz-b2 no="I" başlık="Konusu">
            <mvz-madde no="376" başlık="">
              <mvz-fıkra no="1">
                <template>Tarımsal bir taşınmazın kirasıyla bağlantılı olmayan geviş getirici hayvanların kirasında, aksine anlaşma veya yerel âdet yoksa, kiralanan hayvanların kira süresi içindeki bütün ürünleri kiracının olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiracı, kiralanan hayvanları beslemek, onlara iyi bakmak ve kiraya verene para veya hayvanlardan elde ettiği ürünün belli bir payını ödemekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sorumluluk">
            <mvz-madde no="377" başlık="">
              <mvz-fıkra no="1">
                <template>Aksine anlaşma veya yerel âdet yoksa kiracı, kiralanan hayvanların uğradığı bir zarardan, bu zararın, korumada dikkat ve özen gösterildiği hâlde meydana gelmiş olduğunu ispat etmedikçe sorumludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kiracı, kendi kusuruyla sebebiyet vermediği olağanüstü koruma giderleri için kiraya verenden tazminat isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kiracı, önemli kazaları ya da hastalıkları gecikmeksizin kiraya verene bildirmekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Fesih">
            <mvz-madde no="378" başlık="">
              <mvz-fıkra no="1">
                <template>Aksine anlaşma veya yerel âdet yoksa, belirsiz bir süre için yapılan sözleşmeyi, taraflardan her biri, dilediği zaman feshedebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ancak, fesih dürüstlük kurallarına aykırı ve uygun olmayan bir zamanda yapılamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Ödünç Sözleşmeleri">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Kullanım Ödüncü">
        <mvz-b1 no="A" başlık="Tanımı">
          <mvz-madde no="379" başlık="">
            <mvz-fıkra no="1">
              <template>Kullanım ödüncü sözleşmesi, ödünç verenin bir şeyin karşılıksız olarak kullanılmasını ödünç alana bırakmayı ve ödünç alanın da o şeyi kullandıktan sonra geri vermeyi üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Hükümleri">
          <mvz-b2 no="I" başlık="Ödünç alanın kullanım hakkı">
            <mvz-madde no="380" başlık="">
              <mvz-fıkra no="1">
                <template>Ödünç alan, ödünç konusunu ancak sözleşmede kararlaştırılan şekilde, sözleşmede hüküm yoksa niteliğine veya özgülendiği amaca göre kullanabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ödünç alan, ödünç konusunu başkasına kullandıramaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Ödünç alan, bu hükümlere aykırı davrandığı durumlarda, beklenmedik hâllerden doğan zararlardan da sorumludur. Ancak, bu hükümlere uymuş olsaydı bile zararın doğacağını ispat ederse sorumluluktan kurtulur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Bakım ve koruma giderleri">
            <mvz-madde no="381" başlık="">
              <mvz-fıkra no="1">
                <template>Ödünç alan, ödünç konusunun olağan bakım ve koruma giderlerini karşılamakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ödünç alan, ödünç verenin yararına yapmak zorunda kaldığı olağanüstü giderlerin ödenmesini isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Müteselsil sorumluluk">
            <mvz-madde no="382" başlık="">
              <mvz-fıkra no="1">
                <template>Bir şeyi birlikte ödünç alanlar, ondan müteselsilen sorumlu olurlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Sona ermesi">
          <mvz-b2 no="I" başlık="Amacı belirlenmiş kullanmada">
            <mvz-madde no="383" başlık="">
              <mvz-fıkra no="1">
                <template>Kullanma için belirli bir süre öngörülmemişse, ödünç alanın, ödünç konusunu sözleşme uyarınca kullanmış olmasıyla veya kullanabilecek kadar bir zaman geçmesiyle sözleşme sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ödünç alan, ödünç konusunu sözleşmeye aykırı olarak kullanır, onu bozar veya kullanmak için başka bir kimseye verirse ya da önceden bilinmeyen bir durum yüzünden ödünç verenin ivedi gereksinimi ortaya çıkarsa, ödünç veren o şeyi daha önce geri isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Amacı belirlenmemiş kullanmada">
            <mvz-madde no="384" başlık="">
              <mvz-fıkra no="1">
                <template>Ödünç konusu, kullanım süresi ve hangi amaçla kullanılacağı belirlenmeden verilmişse, ödünç veren onu dilediği zaman geri isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Ödünç alanın ölümü">
            <mvz-madde no="385" başlık="">
              <mvz-fıkra no="1">
                <template>Kullanım ödüncü sözleşmesi, ödünç alanın ölmesiyle kendiliğinden sona erer.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Tüketim Ödüncü">
        <mvz-b1 no="A" başlık="Tanımı">
          <mvz-madde no="386" başlık="">
            <mvz-fıkra no="1">
              <template>Tüketim ödüncü sözleşmesi, ödünç verenin, bir miktar parayı ya da tüketilebilen bir şeyi ödünç alana devretmeyi, ödünç alanın da aynı nitelik ve miktarda şeyi geri vermeyi üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Hükümleri">
          <mvz-b2 no="I" başlık="Faiz">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="387" başlık="">
                <mvz-fıkra no="1">
                  <template>Ticari olmayan tüketim ödüncü sözleşmesinde, taraflarca kararlaştırılmış olmadıkça faiz istenemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ticari tüketim ödüncü sözleşmesinde, taraflarca kararlaştırılmamış olsa bile faiz istenebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Faize ilişkin özel kurallar">
              <mvz-madde no="388" başlık="">
                <mvz-fıkra no="1">
                  <template>Tüketim ödüncü sözleşmesinde faiz oranı belirlenmemişse, kural olarak ödünç alma zamanında ve yerinde o tür ödünçlerde geçerli olan faiz oranı uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Sözleşmede aksine bir hüküm yoksa, belirlenen faiz, yıllık olarak ödenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Faizin anaparaya eklenerek birlikte yeniden faiz yürütülmesi kararlaştırılamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Zamanaşımı">
            <mvz-madde no="389" başlık="">
              <mvz-fıkra no="1">
                <template>Ödünç alanın, ödünç konusunun teslimine ve ödünç verenin de bu şeyin teslim alınmasına ilişkin istemleri, diğer tarafın bu konuda temerrüde düşmesinden başlayarak altı ayın geçmesiyle zamanaşımına uğrar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Ödünç alanın ödeme güçsüzlüğü">
            <mvz-madde no="390" başlık="">
              <mvz-fıkra no="1">
                <template>Ödünç alan, ödünç sözleşmesinin kurulmasından sonra ödeme güçsüzlüğüne düşerse ödünç veren, ödünç konusunun tesliminden kaçınabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ödünç veren, ödünç alanın sözleşmenin kurulmasından önce ödeme güçsüzlüğüne düşmüş olduğunu daha sonra öğrenmişse, aynı hakka sahiptir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Para yerine verilen şeyler">
          <mvz-madde no="391" başlık="">
            <mvz-fıkra no="1">
              <template>Ödünç alana, sözleşmede kararlaştırılan para yerine, kıymetli evrak veya ticari mallar verilirse, borcun tutarı, bunların teslim zamanı ve yerindeki borsa ya da piyasa değeri üzerinden hesaplanır; aksine yapılan sözleşme geçersizdir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Geri verme zamanı">
          <mvz-madde no="392" başlık="">
            <mvz-fıkra no="1">
              <template>Ödüncün geri verilmesi konusunda belirli bir gün ya da bildirim süresi veya borcun geri istendiği anda muaccel olacağı kararlaştırılmamışsa ödünç alan, ilk istemden başlayarak altı hafta geçmedikçe ödüncü geri vermekle yükümlü değildir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="6-ALTINCI" başlık="Hizmet Sözleşmeleri">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Genel Hizmet Sözleşmesi">
        <mvz-b1 no="A" başlık="Tanımı">
          <mvz-madde no="393" başlık="">
            <mvz-fıkra no="1">
              <template>Hizmet sözleşmesi, işçinin işverene bağımlı olarak belirli veya belirli olmayan süreyle işgörmeyi ve işverenin de ona zamana veya yapılan işe göre ücret ödemeyi üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İşçinin işverene bir hizmeti kısmi süreli olarak düzenli biçimde yerine getirmeyi üstlendiği sözleşmeler de hizmet sözleşmesidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Genel hizmet sözleşmesine ilişkin hükümler, kıyas yoluyla çıraklık sözleşmesine de uygulanır; özel kanun hükümleri saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Kurulması">
          <mvz-madde no="394" başlık="">
            <mvz-fıkra no="1">
              <template>Hizmet sözleşmesi, kanunda aksine bir hüküm olmadıkça özel bir şekle bağlı değildir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bir kimse, durumun gereklerine göre ancak ücret karşılığında yapılabilecek bir işi belli bir zaman için görür ve bu iş de işveren tarafından kabul edilirse, aralarında hizmet sözleşmesi kurulmuş sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Geçersizliği sonradan anlaşılan hizmet sözleşmesi, hizmet ilişkisi ortadan kaldırılıncaya kadar, geçerli bir hizmet sözleşmesinin bütün hüküm ve sonuçlarını doğurur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="İşçinin borçları">
          <mvz-b2 no="I" başlık="Bizzat çalışma borcu">
            <mvz-madde no="395" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmeden veya durumun gereğinden aksi anlaşılmadıkça, işçi yüklendiği işi bizzat yapmakla yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Özen ve sadakat borcu">
            <mvz-madde no="396" başlık="">
              <mvz-fıkra no="1">
                <template>İşçi, yüklendiği işi özenle yapmak ve işverenin haklı menfaatinin korunmasında sadakatle davranmak zorundadır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İşçi, işverene ait makineleri, araç ve gereçleri, teknik sistemleri, tesisleri ve taşıtları usulüne uygun olarak kullanmak ve bunlarla birlikte işin görülmesi için kendisine teslim edilmiş olan malzemeye özen göstermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>İşçi, hizmet ilişkisi devam ettiği sürece, sadakat borcuna aykırı olarak bir ücret karşılığında üçüncü kişiye hizmette bulunamaz ve özellikle kendi işvereni ile rekabete girişemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>İşçi, iş gördüğü sırada öğrendiği, özellikle üretim ve iş sırları gibi bilgileri, hizmet ilişkisinin devamı süresince kendi yararına kullanamaz veya başkalarına açıklayamaz. İşverenin haklı menfaatinin korunması için gerekli olduğu ölçüde işçi, hizmet ilişkisinin sona ermesinden sonra da sır saklamakla yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Teslim ve hesap verme borcu">
            <mvz-madde no="397" başlık="">
              <mvz-fıkra no="1">
                <template>İşçi, üstlendiği işin görülmesi sırasında üçüncü kişiden işveren için aldığı şeyleri ve özellikle paraları derhâl ona teslim etmek ve bunlar hakkında hesap vermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İşçi, hizmetin ifasından dolayı elde ettiği şeyleri de derhâl işverene teslim etmekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Fazla çalışma borcu">
            <mvz-madde no="398" başlık="">
              <mvz-fıkra no="1">
                <template>Fazla çalışma, ilgili kanunlarda belirlenen normal çalışma süresinin üzerinde ve işçinin rızasıyla yapılan çalışmadır. Ancak, normal süreden daha fazla çalışmayı gerektiren bir işin yerine getirilmesi zorunluluğu doğar, işçi bunu yapabilecek durumda bulunur ve aynı zamanda kaçınması da dürüstlük kurallarına aykırı olursa işçi, karşılığı verilmek koşuluyla, fazla çalışmayı yerine getirmekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Özel kanunlardaki hükümler saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Düzenlemelere ve talimata uyma borcu">
            <mvz-madde no="399" başlık="">
              <mvz-fıkra no="1">
                <template>İşveren, işin görülmesi ve işçilerin işyerindeki davranışlarıyla ilgili genel düzenlemeler yapabilir ve onlara özel talimat verebilir. İşçiler, bunlara dürüstlük kurallarının gerektirdiği ölçüde uymak zorundadırlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="VI" başlık="İşçinin sorumluluğu">
            <mvz-madde no="400" başlık="">
              <mvz-fıkra no="1">
                <template>İşçi, işverene kusuruyla verdiği her türlü zarardan sorumludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu sorumluluğun belirlenmesinde; işin tehlikeli olup olmaması, uzmanlığı ve eğitimi gerektirip gerektirmemesi ile işçinin işveren tarafından bilinen veya bilinmesi gereken yetenek ve nitelikleri göz önünde tutulur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="İşverenin borçları">
          <mvz-b2 no="I" başlık="Ücret ödeme borcu">
            <mvz-b3 no="1" başlık="Ücret">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="401" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşveren, işçiye sözleşmede veya toplu iş sözleşmesinde belirlenen; sözleşmede hüküm bulunmayan hâllerde ise, asgari ücretten az olmamak üzere emsal ücreti ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Fazla çalışma ücreti">
                <mvz-madde no="402" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşveren, fazla çalışma için işçiye normal çalışma ücretini en az yüzde elli fazlasıyla ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşveren, işçinin rızasıyla fazla çalışma ücreti yerine, uygun bir zamanda fazla çalışmayla orantılı olarak izin verebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="İşin sonucundan pay alma">
                <mvz-madde no="403" başlık="">
                  <mvz-fıkra no="1">
                    <template>Sözleşmeyle işçiye ücretle birlikte üretilenden, cirodan veya kârdan belli bir pay verilmesi kararlaştırılmışsa, hesap dönemi sonunda bu pay, yasal hükümler veya genellikle kabul edilmiş ticari esaslar göz önünde tutularak belirlenir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşçiye belli bir pay verilmesi kararlaştırılan hâllerde, payın hesaplanmasında uyuşulamazsa işveren, işçiye veya onun yerine, birlikte kararlaştırdıkları ya da hâkimin atadığı bilirkişiye bilgi vermek ve bilginin dayanağını oluşturan işletmeyle ilgili defter ve belgeleri incelemesine sunmak; kârdan bir pay verilmesi kararlaştırılmışsa, işveren işçiye, istemi üzerine ayrıca yıl sonu kâr zarar cetvelini vermek zorundadır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Aracılık ücreti">
                <mvz-madde no="404" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşçiye belli işlerde aracılık yapması karşılığında işverence bir ücret ödeneceği kararlaştırılmışsa, aracılık yapılan işlemin üçüncü kişi ile geçerli olarak kurulmasıyla işçinin istem hakkı doğar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Borçların kısım kısım ifa edileceği sözleşmeler ile sigorta sözleşmelerinde, her kısma ilişkin ücret isteminin bu kısma ilişkin borcun muaccel olmasıyla veya yerine getirilmesiyle doğacağı yazılı olarak kararlaştırılabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>İşçinin aracılığı suretiyle işveren ile üçüncü kişi arasında kurulan sözleşme, işveren tarafından kusuru olmaksızın ifa edilmezse veya üçüncü kişi borçlarını yerine getirmezse, ücret istemine yönelik hak sona erer. Sadece kısmi ifa hâlinde, ücretten orantılı olarak indirim yapılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Sözleşmeyle işçiye, kendisine ödenecek aracılık ücretinin hesabını tutma yükümlülüğü getirilmemişse, işveren işçiye ücretin muaccel olduğu her dönem için, bu ücrete tabi işlemleri de içeren yazılı hesap vermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="5">
                    <template>Hesabı gözden geçirme ihtiyacı ortaya çıkarsa işveren, işçiye veya onun yerine, birlikte kararlaştırdıkları ya da hâkimin atadığı bilirkişiye bilgi vermek ve bilginin dayanağını oluşturan işletmeyle ilgili defter ve belgeleri onun incelemesine sunmak zorundadır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="e" başlık="İkramiye">
                <mvz-madde no="405" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşveren, bayram, yılbaşı ve doğum günü gibi belirli günler dolayısıyla işçilerine özel ikramiye verebilir. Ancak, işçilerin ikramiyeyi istem hakları bu konuda anlaşmanın veya çalışma şartının ya da işverenin tek taraflı taahhüdünün varlığı hâlinde doğar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Hizmet sözleşmesi ikramiyenin verildiği dönemden önce sona ermişse, ikramiyenin çalıştığı süreye yansıyan bölümü ödenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Ücretin ödenmesi">
              <mvz-b4 no="a" başlık="Ödeme süresi">
                <mvz-madde no="406" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aksine âdet olmadıkça, işçiye ücreti her ayın sonunda ödenir. Ancak, hizmet sözleşmesi veya toplu iş sözleşmesiyle daha kısa ödeme süreleri belirlenebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Daha kısa bir ödeme süresi kararlaştırılmamışsa veya aksine âdet yoksa, aracılık ücreti her ayın sonunda ödenir. Ancak, işlemlerin yapılması altı aydan daha uzun bir süre gerektirdiği takdirde, aracılık ücreti asıl ücrete ek olarak kararlaştırılmışsa, yazılı anlaşmayla ödeme daha ileri bir tarihe bırakılabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Asıl ücrete ek olarak üretilenden pay verilmesi öngörülen hâllerde, ürün payı belirlenir belirlenmez, cirodan veya kârdan pay verilmesi kararlaştırılan hâllerde ise payın, hesap dönemini izleyen en geç üç ay içinde belirlenerek ödenmesi şarttır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>İşveren, işçiye zorunlu ihtiyacının ortaya çıkması hâlinde ve hakkaniyet gereği ödeyebilecek durumda ise, hizmetiyle orantılı olarak avans vermekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Ücretin korunması">
                <mvz-madde no="407" başlık="">
                  <mvz-fıkra no="1">
                    <template>Çalıştırılan işçilerin ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkaktan o ay içinde ödenenlerin özel olarak açılan banka hesabına yatırılmak suretiyle ödenmesi hususunda; tabi olduğu vergi mükellefiyeti türü, işletme büyüklüğü, çalıştırdığı işçi sayısı, işyerinin bulunduğu il ve benzeri unsurları dikkate alarak iş sahiplerini zorunlu tutmaya, banka hesabına yatırılacak ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakın, brüt ya da kanuni kesintiler düşüldükten sonra kalan net miktar üzerinden olup olmayacağını belirlemeye Cumhurbaşkanlığı yetkilidir. Çalıştırdığı işçilerin ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakını özel olarak açılan banka hesapları vasıtasıyla ödeme zorunluluğuna tabî tutulan iş sahipleri, işçilerinin ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakını özel olarak açılan banka hesapları dışında ödeyemezler. Her ödeme döneminde, işçiye hesap pusulası verilir. İşçilerin ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkaklarının özel olarak açılan banka hesabına yatırılmak suretiyle ödenmesine ilişkin diğer ûsul ve esaslar, anılan bakanlıklarca müştereken çıkarılacak yönetmelikle düzenlenir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşveren, işçiden olan alacağı ile ücret borcunu işçinin rızası olmadıkça takas edemez. Ancak, işçinin kasten sebebiyet verdiği yargı kararıyla sabit bir zarardan doğan alacaklar, ücretin haczedilebilir kısmı kadar takas edilebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Ücretin işveren lehine kullanılacağına ilişkin anlaşmalar geçersizdir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="İşgörme ediminin ifasının engellenmesi hâlinde ücret">
              <mvz-b4 no="a" başlık="İşverenin temerrüdü hâlinde">
                <mvz-madde no="408" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşveren, işgörme ediminin yerine getirilmesini kusuruyla engellerse veya edimi kabulde temerrüde düşerse, işçiye ücretini ödemekle yükümlü olup, işçiden bu edimini daha sonra yerine getirmesini isteyemez. Ancak, işçinin bu engelleme sebebiyle yapmaktan kurtulduğu giderler ile başka bir iş yaparak kazandığı veya kazanmaktan bilerek kaçındığı yararlar ücretinden indirilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="İşçinin çalışmayı durdurması hâlinde">
                <mvz-madde no="409" başlık="">
                  <mvz-fıkra no="1">
                    <template>Uzun süreli bir hizmet ilişkisinde işçi, hastalık, askerlik veya kanundan doğan çalışma ve benzeri sebeplerle kusuru olmaksızın, iş gördüğü süreye oranla kısa bir süre için işgörme edimini ifa edemezse işveren, başka bir yolla karşılanmadığı takdirde, o süre için işçiye hakkaniyete uygun bir ücret ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Ücret alacağının haczi, devri ve rehnedilmesi">
              <mvz-madde no="410" başlık="">
                <mvz-fıkra no="1">
                  <template>İşçilerin ücretinin dörtte birinden fazlası haczedilemez, başkasına devredilemez ve rehnedilemez. Ancak, işçinin bakmakla yükümlü olduğu aile bireyleri için hâkim tarafından takdir edilecek miktar, bu orana dâhil değildir. Nafaka alacaklılarının hakları saklıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Gelecekteki ücret alacaklarının devredilmesi veya rehnedilmesi geçersizdir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Parça başına veya götürü iş">
              <mvz-b4 no="a" başlık="İş verme">
                <mvz-madde no="411" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşçi, sözleşme gereğince yalnız bir işveren için sadece parça başına veya götürü iş yapmayı üstlenmişse işveren, ona yeterli iş vermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşveren, kendi kusuru olmaksızın sözleşmede öngörülen parça başına veya götürü iş sağlayamayacak durumda bulunduğu veya işletme koşulları geçici olarak gerektirdiği takdirde işçiye, ücreti zaman esasına göre öder. Bu durumda, zamana göre ödenecek ücret, anlaşmada veya hizmet ya da toplu iş sözleşmesinde belirlenmemişse işveren, işçiye parça başına veya götürü olarak daha önce aldığı ortalama ücrete eşdeğer bir ücret ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Parça başına veya götürü ya da zamana göre iş sağlayamayan işveren, en azından işgörme edimini kabulde temerrüt hükümleri uyarınca zamana göre işgörmede ödeyeceği ücreti ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Birim ücreti">
                <mvz-madde no="412" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşçi, sözleşme gereğince parça başına veya götürü olarak çalışmayı üstlendiği takdirde işveren, her işin başlamasından önce ona ödenecek birim ücretini bildirmekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu bildirimi yapmayan işveren, aynı veya benzer bir iş için belirlenmiş olan birim ücretini ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="İş araç ve malzemeleri">
            <mvz-madde no="413" başlık="">
              <mvz-fıkra no="1">
                <template>Aksine anlaşma veya yerel âdet yoksa, işveren işçiye bu iş için gerekli araçları ve malzemeyi sağlamakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
