                    <template>Teslim edilecek şey, borsada kayıtlıysa veya piyasa fiyatı varsa ya da yapılacak gidere oranla değeri az ise, satışın açık artırma yoluyla yapılması zorunlu olmadığı gibi, hâkim, önceden ihtarda bulunma koşulunu aramaksızın satışa izin verebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Tevdi konusunu geri alma">
                <mvz-madde no="109" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklı, tevdi edilen şeyi kabul ettiğini açıklamış veya tevdi bir rehnin ortadan kaldırılması sonucunu doğurmuş olmadıkça borçlu, tevdi edilen şeyi geri alabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tevdi edilen şey geri alındığı anda alacak, bütün yan haklarıyla birlikte varlığını sürdürür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Diğer edimlerde">
              <mvz-madde no="110" başlık="">
                <mvz-fıkra no="1">
                  <template>Borcun konusu bir şeyin teslimini gerektirmiyorsa, alacaklının temerrüdü hâlinde borçlu, borçlunun temerrüdüne ilişkin hükümlere göre sözleşmeden dönebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Diğer ifa engelleri">
          <mvz-madde no="111" başlık="">
            <mvz-fıkra no="1">
              <template>Borçlunun kusuru olmaksızın, alacağın kime ait olduğunda veya alacaklının kimliğinde duraksama sebebiyle ya da alacaklıdan kaynaklanan diğer kişisel bir sebeple borç, alacaklıya veya temsilcisine ifa edilemezse borçlu, alacaklının temerrüdünde olduğu gibi, tevdi ya da sözleşmeden dönme hakkını kullanabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Borçların İfa Edilmemesinin Sonuçları">
        <mvz-b1 no="A" başlık="Borcun ifa edilmemesi">
          <mvz-b2 no="I" başlık="Giderim borcu">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="112" başlık="">
                <mvz-fıkra no="1">
                  <template>Borç hiç veya gereği gibi ifa edilmezse borçlu, kendisine hiçbir kusurun yüklenemeyeceğini ispat etmedikçe, alacaklının bundan doğan zararını gidermekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yapma ve yapmama borçlarında">
              <mvz-madde no="113" başlık="">
                <mvz-fıkra no="1">
                  <template>Yapma borcu, borçlu tarafından ifa edilmediği takdirde alacaklı, masrafı borçluya ait olmak üzere edimin kendisi veya başkası tarafından ifasına izin verilmesini isteyebilir; her türlü giderim isteme hakkı saklıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yapmama borcuna aykırı davranan borçlu, bu aykırı davranışının doğurduğu zararı gidermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Alacaklı, ayrıca borca aykırı durumun ortadan kaldırılmasını veya bu konuda masrafı borçluya ait olmak üzere kendisinin yetkili kılınmasını isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sorumluluğun ve giderim borcunun kapsamı">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="114" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlu, genel olarak her türlü kusurdan sorumludur. Borçlunun sorumluluğunun kapsamı, işin özel niteliğine göre belirlenir. İş özellikle borçlu için bir yarar sağlamıyorsa, sorumluluk daha hafif olarak değerlendirilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Haksız fiil sorumluluğuna ilişkin hükümler, kıyas yoluyla sözleşmeye aykırılık hâllerine de uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Sorumsuzluk anlaşması">
              <mvz-madde no="115" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlunun ağır kusurundan sorumlu olmayacağına ilişkin önceden yapılan anlaşma kesin olarak hükümsüzdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Borçlunun alacaklı ile hizmet sözleşmesinden kaynaklanan herhangi bir borç sebebiyle sorumlu olmayacağına ilişkin olarak önceden yaptığı her türlü anlaşma kesin olarak hükümsüzdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Uzmanlığı gerektiren bir hizmet, meslek veya sanat, ancak kanun ya da yetkili makamlar tarafından verilen izinle yürütülebiliyorsa, borçlunun hafif kusurundan sorumlu olmayacağına ilişkin önceden yapılan anlaşma kesin olarak hükümsüzdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Yardımcı kişilerin fiillerinden sorumluluk">
              <mvz-madde no="116" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlu, borcun ifasını veya bir borç ilişkisinden doğan hakkın kullanılmasını, birlikte yaşadığı kişiler ya da yanında çalışanlar gibi yardımcılarına kanuna uygun surette bırakmış olsa bile, onların işi yürüttükleri sırada diğer tarafa verdikleri zararı gidermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yardımcı kişilerin fiilinden doğan sorumluluk, önceden yapılan bir anlaşmayla tamamen veya kısmen kaldırılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Uzmanlığı gerektiren bir hizmet, meslek veya sanat, ancak kanun veya yetkili makamlar tarafından verilen izinle yürütülebiliyorsa, borçlunun yardımcı kişilerin fiillerinden sorumlu olmayacağına ilişkin anlaşma kesin olarak hükümsüzdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Borçlunun temerrüdü">
          <mvz-b2 no="I" başlık="Koşulları">
            <mvz-madde no="117" başlık="">
              <mvz-fıkra no="1">
                <template>Muaccel bir borcun borçlusu, alacaklının ihtarıyla temerrüde düşer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Borcun ifa edileceği gün, birlikte belirlenmiş veya sözleşmede saklı tutulan bir hakka dayanarak taraflardan biri usulüne uygun bir bildirimde bulunmak suretiyle belirlemişse, bu günün geçmesiyle; haksız fiilde fiilin işlendiği, sebepsiz zenginleşmede ise zenginleşmenin gerçekleştiği tarihte borçlu temerrüde düşmüş olur. Ancak sebepsiz zenginleşenin iyiniyetli olduğu hâllerde temerrüt için bildirim şarttır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Hükümleri">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-b4 no="a" başlık="Gecikme tazminatı">
                <mvz-madde no="118" başlık="">
                  <mvz-fıkra no="1">
                    <template>Temerrüde düşen borçlu, temerrüde düşmekte kusuru olmadığını ispat etmedikçe, borcun geç ifasından dolayı alacaklının uğradığı zararı gidermekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Beklenmedik hâlden sorumluluk">
                <mvz-madde no="119" başlık="">
                  <mvz-fıkra no="1">
                    <template>Temerrüde düşen borçlu, beklenmedik hâl sebebiyle doğacak zarardan sorumludur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Borçlu, temerrüde düşmekte kusuru olmadığını veya borcunu zamanında ifa etmiş olsaydı bile beklenmedik hâlin ifa konusu şeye zarar vereceğini ispat ederek bu sorumluluktan kurtulabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Temerrüt faizi">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="120" başlık="">
                  <mvz-fıkra no="1">
                    <template>Uygulanacak yıllık temerrüt faizi oranı, sözleşmede kararlaştırılmamışsa, faiz borcunun doğduğu tarihte yürürlükte olan mevzuat hükümlerine göre belirlenir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Sözleşme ile kararlaştırılacak yıllık temerrüt faizi oranı, birinci fıkra uyarınca belirlenen yıllık faiz oranının yüzde yüz fazlasını aşamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Akdî faiz oranı kararlaştırılmakla birlikte sözleşmede temerrüt faizi kararlaştırılmamışsa ve yıllık akdî faiz oranı da birinci fıkrada belirtilen faiz oranından fazla ise, temerrüt faizi oranı hakkında akdî faiz oranı geçerli olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Faizlerde, iratlarda ve bağışlamada temerrüt faizi">
                <mvz-madde no="121" başlık="">
                  <mvz-fıkra no="1">
                    <template>Faiz veya irat borcunu ya da bağışladığı bir miktar parayı ödemekte temerrüde düşen borçlu, icra takibine girişildiği veya dava açıldığı günden başlayarak, temerrüt faizi ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Buna aykırı olarak yapılan anlaşmalar, ceza koşulu hükümlerine tabi olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Temerrüt faizine, ayrıca temerrüt faizi yürütülemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Aşkın zarar">
              <mvz-madde no="122" başlık="">
                <mvz-fıkra no="1">
                  <template>Alacaklı, temerrüt faizini aşan bir zarara uğramış olursa, borçlu kendisinin hiçbir kusuru bulunmadığını ispat etmedikçe, bu zararı da gidermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Temerrüt faizini aşan zarar miktarı görülmekte olan davada belirlenebiliyorsa, davacının istemi üzerine hâkim, esas hakkında karar verirken bu zararın miktarına da hükmeder.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Karşılıklı borç yükleyen sözleşmelerde">
              <mvz-b4 no="a" başlık="Süre verilmesi">
                <mvz-madde no="123" başlık="">
                  <mvz-fıkra no="1">
                    <template>Karşılıklı borç yükleyen sözleşmelerde, taraflardan biri temerrüde düştüğü takdirde diğeri, borcun ifa edilmesi için uygun bir süre verebilir veya uygun bir süre verilmesini hâkimden isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Süre verilmesini gerektirmeyen durumlar">
                <mvz-madde no="124" başlık="">
                  <mvz-fıkra no="1">
                    <template>Aşağıdaki durumlarda süre verilmesine gerek yoktur:</template>
                    <mvz-bent no="1.">
                      <template>Borçlunun içinde bulunduğu durumdan veya tutumundan süre verilmesinin etkisiz olacağı anlaşılıyorsa.</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Borçlunun temerrüdü sonucunda borcun ifası alacaklı için yararsız kalmışsa.</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Borcun ifasının, belirli bir zamanda veya belirli bir süre içinde gerçekleşmemesi üzerine, ifanın artık kabul edilmeyeceği sözleşmeden anlaşılıyorsa.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Seçimlik haklar">
                <mvz-madde no="125" başlık="">
                  <mvz-fıkra no="1">
                    <template>Temerrüde düşen borçlu, verilen süre içinde, borcunu ifa etmemişse veya süre verilmesini gerektirmeyen bir durum söz konusu ise alacaklı, her zaman borcun ifasını ve gecikme sebebiyle tazminat isteme hakkına sahiptir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacaklı, ayrıca borcun ifasından ve gecikme tazminatı isteme hakkından vazgeçtiğini hemen bildirerek, borcun ifa edilmemesinden doğan zararın giderilmesini isteyebilir veya sözleşmeden dönebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Sözleşmeden dönme hâlinde taraflar, karşılıklı olarak ifa yükümlülüğünden kurtulurlar ve daha önce ifa ettikleri edimleri geri isteyebilirler. Bu durumda borçlu, temerrüde düşmekte kusuru olmadığını ispat edemezse alacaklı, sözleşmenin hükümsüz kalması sebebiyle uğradığı zararın giderilmesini de isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Sürekli edimli sözleşmelerde">
                <mvz-madde no="126" başlık="">
                  <mvz-fıkra no="1">
                    <template>İfasına başlanmış sürekli edimli sözleşmelerde, borçlunun temerrüdü hâlinde alacaklı, ifa ve gecikme tazminatı isteyebileceği gibi, sözleşmeyi feshederek, sözleşmenin süresinden önce sona ermesi yüzünden uğradığı zararın giderilmesini de isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Borç İlişkilerinin Üçüncü Kişilere Etkisi">
        <mvz-b1 no="A" başlık="Alacaklıya halef olma">
          <mvz-madde no="127" başlık="">
            <mvz-fıkra no="1">
              <template>Alacaklıya ifada bulunan üçüncü kişi, aşağıdaki hâllerde ifası ölçüsünde alacaklının haklarına halef olur:</template>
              <mvz-bent no="a">
                <template>1. Başkasının borcu için rehnedilen bir şeyi rehinden kurtardığı ve bu şey üzerinde mülkiyet veya başka bir ayni hakkı bulunduğu takdirde.</template>
              </mvz-bent>
              <mvz-bent no="b">
                <template>2. Alacaklıya ifada bulunan üçüncü kişinin ona halef olacağı, borçlu tarafından ifadan önce alacaklıya bildirildiği takdirde.</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Diğer halefiyet hâllerine ilişkin kanun hükümleri saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Üçüncü kişinin fiilini üstlenme">
          <mvz-madde no="128" başlık="">
            <mvz-fıkra no="1">
              <template>Üçüncü bir kişinin fiilini başkasına karşı üstlenen, bu fiilin gerçekleşmemesinden doğan zararı gidermekle yükümlüdür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Belirli bir süre için yapılan üstlenmede, sürenin bitimine kadar üstlenene edimini ifa etmesi için yazılı olarak başvurulmaması hâlinde, üstlenenin sorumluluğunun sona ereceği kararlaştırılabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Üçüncü kişi yararına sözleşme">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="129" başlık="">
              <mvz-fıkra no="1">
                <template>Kendi adına sözleşme yapan kişi, sözleşmeye üçüncü kişi yararına bir edim yükümlülüğü koydurmuşsa, edimin üçüncü kişiye ifa edilmesini isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Üçüncü kişi veya üçüncü kişiye halef olanlar da, tarafların amacına veya örf ve âdete uygun düştüğü takdirde edimin ifasını isteyebilirler. Bu durumda, üçüncü kişi veya ona halef olanlar bu hakkı kullanmak istediklerini borçluya bildirdikten sonra, alacaklı borçluyu ibra edemeyeceği gibi, borcun nitelik ve kapsamını da değiştiremez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sorumluluk sigortalarında">
            <mvz-madde no="130" başlık="">
              <mvz-fıkra no="1">
                <template>Başkasını çalıştıran kişi, çalıştırdığı kişiye karşı hukuki sorumluluğunu güvence altına almak üzere sigorta yaptırmışsa, sigortadan doğan haklar doğrudan doğruya çalışana ait olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ancak, çalışana ödenecek sigorta tazminatı, genel hükümlere göre ödenecek tazminattan indirilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Diğer hukuki sorumluluk sigortalarına ilişkin kanun hükümleri saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Borçların ve Borç İlişkilerinin Sona Ermesi, Zamanaşımı">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Sona Erme Hâlleri">
        <mvz-b1 no="A" başlık="Asıl borca bağlı hak ve borçların sona ermesi">
          <mvz-madde no="131" başlık="">
            <mvz-fıkra no="1">
              <template>Asıl borç ifa ya da diğer bir sebeple sona erdiği takdirde, rehin, kefalet, faiz ve ceza koşulu gibi buna bağlı hak ve borçlar da sona ermiş olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İşlemiş faizin ve ceza koşulunun ifasını isteme hakkı sözleşmeyle veya ifa anına kadar yapılacak bir bildirimle saklı tutulmuş ise ya da durum ve koşullardan saklı tutulduğu anlaşılmaktaysa, bu faizler ve ceza koşulu istenebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Taşınmaz rehnine, kıymetli evraka ve konkordatoya ilişkin özel hükümler saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="İbra">
          <mvz-madde no="132" başlık="">
            <mvz-fıkra no="1">
              <template>Borcu doğuran işlem kanunen veya taraflarca belli bir şekle bağlı tutulmuş olsa bile borç, tarafların şekle bağlı olmaksızın yapacakları ibra sözleşmesiyle tamamen veya kısmen ortadan kaldırılabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Yenileme">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="133" başlık="">
              <mvz-fıkra no="1">
                <template>Yeni bir borçla mevcut bir borcun sona erdirilmesi, ancak tarafların bu yöndeki açık iradesi ile olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Özellikle mevcut borç için kambiyo taahhüdünde bulunulması veya yeni bir alacak senedi ya da yeni bir kefalet senedi düzenlenmesi, tarafların açık yenileme iradeleri olmadıkça yenileme sayılmaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Cari hesaplarda">
            <mvz-madde no="134" başlık="">
              <mvz-fıkra no="1">
                <template>Çeşitli kalemlerin bir cari hesaba sadece kaydedilmiş olması, borcun yenilenmiş olduğu anlamına gelmez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ancak, hesabın kesilmiş ve hesap sonucu diğer tarafça kabul edilmiş olması durumunda, borç yenilenmiş olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Kalemlerden birinin güvencesi varsa, aksi kararlaştırılmadıkça, hesap kesilip sonucun kabul edilmiş olması, güvenceyi sona erdirmez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Birleşme">
          <mvz-madde no="135" başlık="">
            <mvz-fıkra no="1">
              <template>Alacaklı ve borçlu sıfatlarının aynı kişide birleşmesiyle borç sona erer. Ancak, üçüncü kişilerin alacak üzerinde önceden mevcut olan hakları birleşmeden etkilenmez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Birleşme geçmişe etkili olarak ortadan kalkarsa, borç varlığını sürdürür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Taşınmaz rehni ve kıymetli evraka ilişkin özel hükümler saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="E" başlık="İfa imkânsızlığı">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="136" başlık="">
              <mvz-fıkra no="1">
                <template>Borcun ifası borçlunun sorumlu tutulamayacağı sebeplerle imkânsızlaşırsa, borç sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Karşılıklı borç yükleyen sözleşmelerde imkânsızlık sebebiyle borçtan kurtulan borçlu, karşı taraftan almış olduğu edimi sebepsiz zenginleşme hükümleri uyarınca geri vermekle yükümlü olup, henüz kendisine ifa edilmemiş olan edimi isteme hakkını kaybeder. Kanun veya sözleşmeyle borcun ifasından önce doğan hasarın alacaklıya yükletilmiş olduğu durumlar, bu hükmün dışındadır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Borçlu ifanın imkânsızlaştığını alacaklıya gecikmeksizin bildirmez ve zararın artmaması için gerekli önlemleri almazsa, bundan doğan zararları gidermekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kısmi ifa imkânsızlığı">
            <mvz-madde no="137" başlık="">
              <mvz-fıkra no="1">
                <template>Borcun ifası borçlunun sorumlu tutulamayacağı sebeplerle kısmen imkânsızlaşırsa borçlu, borcunun sadece imkânsızlaşan kısmından kurtulur. Ancak, bu kısmi ifa imkânsızlığı önceden öngörülseydi taraflarca böyle bir sözleşmenin yapılmayacağı açıkça anlaşılırsa, borcun tamamı sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Karşılıklı borç yükleyen sözleşmelerde, bir tarafın borcu kısmen imkânsızlaşır ve alacaklı kısmi ifaya razı olursa, karşı edim de o oranda ifa edilir. Alacaklının böyle bir ifaya razı olmaması veya karşı edimin bölünemeyen nitelikte olması durumunda, tam imkânsızlık hükümleri uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Aşırı ifa güçlüğü">
            <mvz-madde no="138" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmenin yapıldığı sırada taraflarca öngörülmeyen ve öngörülmesi de beklenmeyen olağanüstü bir durum, borçludan kaynaklanmayan bir sebeple ortaya çıkar ve sözleşmenin yapıldığı sırada mevcut olguları, kendisinden ifanın istenmesini dürüstlük kurallarına aykırı düşecek derecede borçlu aleyhine değiştirir ve borçlu da borcunu henüz ifa etmemiş veya ifanın aşırı ölçüde güçleşmesinden doğan haklarını saklı tutarak ifa etmiş olursa borçlu, hâkimden sözleşmenin yeni koşullara uyarlanmasını isteme, bu mümkün olmadığı takdirde sözleşmeden dönme hakkına sahiptir. Sürekli edimli sözleşmelerde borçlu, kural olarak dönme hakkının yerine fesih hakkını kullanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu madde hükmü yabancı para borçlarında da uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Takas">
          <mvz-b2 no="I" başlık="Koşulları">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="139" başlık="">
                <mvz-fıkra no="1">
                  <template>İki kişi, karşılıklı olarak bir miktar para veya özdeş diğer edimleri birbirine borçlu oldukları takdirde, her iki borç muaccel ise her biri alacağını borcuyla takas edebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacaklardan biri çekişmeli olsa bile takas ileri sürülebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Zamanaşımına uğramış bir alacağın takası, ancak takas edilebileceği anda henüz zamanaşımına uğramamış olması koşuluyla ileri sürülebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Kefalet hâlinde">
              <mvz-madde no="140" başlık="">
                <mvz-fıkra no="1">
                  <template>Asıl borçlunun takası ileri sürme hakkı bulundukça, kefili de alacaklıya ifada bulunmaktan kaçınabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Üçüncü kişi yararına sözleşme hâlinde">
              <mvz-madde no="141" başlık="">
                <mvz-fıkra no="1">
                  <template>Üçüncü kişi yararına borçlanan kişi, bu borcu ile sözleşmenin diğer tarafından olan alacağını takas edemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Borçlunun iflası hâlinde">
              <mvz-madde no="142" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlunun iflası hâlinde alacaklılar, muaccel olmasalar bile, alacaklarını, müflise olan borçları ile takas edebilirler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Hükümleri">
            <mvz-madde no="143" başlık="">
              <mvz-fıkra no="1">
                <template>Takas, ancak borçlunun takas iradesini alacaklıya bildirmesiyle gerçekleşir. Bu durumda her iki borç, takas edilebilecekleri anda daha az olan borç tutarınca sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Cari hesapla ilgili ticarete ilişkin özel teamüller saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Alacaklının rızasıyla takas edilebilir alacaklar">
            <mvz-madde no="144" başlık="">
              <mvz-fıkra no="1">
                <template>Aşağıdaki alacaklar takas haklarının doğumundan sonra, ancak alacaklıların rızasıyla takas edilebilir:</template>
                <mvz-bent no="a">
                  <template>1. Tevdi edilmiş eşyanın geri verilmesine veya bedeline ilişkin alacaklar.</template>
                </mvz-bent>
                <mvz-bent no="b">
                  <template>2. Haksız olarak alınmış veya aldatma sonucunda alıkonulmuş eşyanın geri verilmesine veya bedeline ilişkin alacaklar.</template>
                </mvz-bent>
                <mvz-bent no="c">
                  <template>3. Nafaka ve işçi ücreti gibi, borçlunun ve ailesinin bakımı için zorunlu olup, özel niteliği gereği, doğrudan alacaklıya verilmesi gereken alacaklar.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Takastan feragat">
            <mvz-madde no="145" başlık="">
              <mvz-fıkra no="1">
                <template>Borçlu, takas hakkından önceden de feragat edebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Zamanaşımı">
        <mvz-b1 no="A" başlık="Süreler">
          <mvz-b2 no="I" başlık="On yıllık zamanaşımı">
            <mvz-madde no="146" başlık="">
              <mvz-fıkra no="1">
                <template>Kanunda aksine bir hüküm bulunmadıkça, her alacak on yıllık zamanaşımına tabidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Beş yıllık zamanaşımı">
            <mvz-madde no="147" başlık="">
              <mvz-fıkra no="1">
                <template>Aşağıdaki alacaklar için beş yıllık zamanaşımı uygulanır:</template>
                <mvz-bent no="1.">
                  <template>Kira bedelleri, anapara faizleri ve ücret gibi diğer dönemsel edimler.</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Otel, motel, pansiyon ve tatil köyü gibi yerlerdeki konaklama bedelleri ile lokanta ve benzeri yerlerdeki yeme içme bedelleri.</template>
                </mvz-bent>
                <mvz-bent no="3.">
                  <template>Küçük sanat işlerinden ve küçük çapta perakende satışlardan doğan alacaklar.</template>
                </mvz-bent>
                <mvz-bent no="4.">
                  <template>Bir ortaklıkta, ortaklık sözleşmesinden doğan ve ortakların birbirleri veya kendileri ile ortaklık arasındaki; bir ortaklığın müdürleri, temsilcileri, denetçileri ile ortaklık veya ortaklar arasındaki alacaklar.</template>
                </mvz-bent>
                <mvz-bent no="5.">
                  <template>Vekâlet, komisyon ve acentalık sözleşmelerinden, ticari simsarlık ücreti alacağı dışında, simsarlık sözleşmesinden doğan alacaklar.</template>
                </mvz-bent>
                <mvz-bent no="6.">
                  <template>Yüklenicinin yükümlülüklerini ağır kusuruyla hiç ya da gereği gibi ifa etmemesi dışında, eser sözleşmesinden doğan alacaklar.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Sürelerin kesinliği">
            <mvz-madde no="148" başlık="">
              <mvz-fıkra no="1">
                <template>Bu ayırımda belirlenen zamanaşımı süreleri, sözleşmeyle değiştirilemez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Zamanaşımının başlangıcı">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="149" başlık="">
                <mvz-fıkra no="1">
                  <template>Zamanaşımı, alacağın muaccel olmasıyla işlemeye başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacağın muaccel olmasının bir bildirime bağlı olduğu hâllerde, zamanaşımı bu bildirimin yapılabileceği günden işlemeye başlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Dönemsel edimlerde">
              <mvz-madde no="150" başlık="">
                <mvz-fıkra no="1">
                  <template>Ömür boyunca gelir ve benzeri dönemsel edimlerde, alacağın tamamı için zamanaşımı, ifa edilmemiş ilk dönemsel edimin muaccel olduğu günde işlemeye başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacağın tamamı zamanaşımına uğramışsa, ifa edilmemiş dönemsel edimler de zamanaşımına uğramış olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Sürelerin hesaplanması">
            <mvz-madde no="151" başlık="">
              <mvz-fıkra no="1">
                <template>Süreler hesaplanırken zamanaşımının başladığı gün sayılmaz ve zamanaşımı ancak sürenin son günü de hak kullanılmaksızın geçince gerçekleşmiş olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zamanaşımı sürelerinin hesaplanmasında da, borçların ifasındaki sürelerin hesaplanmasına ilişkin hükümler uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Bağlı alacaklarda zamanaşımı">
          <mvz-madde no="152" başlık="">
            <mvz-fıkra no="1">
              <template>Asıl alacak zamanaşımına uğrayınca, ona bağlı faiz ve diğer alacaklar da zamanaşımına uğramış olur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Zamanaşımının durması">
          <mvz-madde no="153" başlık="">
            <mvz-fıkra no="1">
              <template>Aşağıdaki durumlarda zamanaşımı işlemeye başlamaz, başlamışsa durur:</template>
              <mvz-bent no="1.">
                <template>Velayet süresince, çocukların ana ve babalarından olan alacakları için.</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Vesayet süresince, vesayet altında bulunanların vasiden veya vesayet işlemleri sebebiyle Devletten olan alacakları için.</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Evlilik devam ettiği sürece, eşlerin diğerinden olan alacakları için.</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Hizmet ilişkisi süresince, ev hizmetlilerinin onları çalıştıranlardan olan alacakları için.</template>
              </mvz-bent>
              <mvz-bent no="5.">
                <template>Borçlu, alacak üzerinde intifa hakkına sahip olduğu sürece.</template>
              </mvz-bent>
              <mvz-bent no="6.">
                <template>Alacağı, Türk mahkemelerinde ileri sürme imkânının bulunmadığı sürece.</template>
              </mvz-bent>
              <mvz-bent no="7.">
                <template>Alacaklı ve borçlu sıfatının aynı kişide birleşmesinde, birleşmenin ileride geçmişe etkili olarak ortadan kalkması durumunda, bu durumun ortaya çıkmasına kadar geçecek sürece.</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Zamanaşımını durduran sebeplerin ortadan kalktığı günün bitiminde zamanaşımı işlemeye başlar veya durmadan önce başlamış olan işlemesini sürdürür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Zamanaşımının kesilmesi">
          <mvz-b2 no="I" başlık="Sebepleri">
            <mvz-madde no="154" başlık="">
              <mvz-fıkra no="1">
                <template>Aşağıdaki durumlarda zamanaşımı kesilir:</template>
                <mvz-bent no="1.">
                  <template>Borçlu borcu ikrar etmişse, özellikle faiz ödemiş veya kısmen ifada bulunmuşsa ya da rehin vermiş veya kefil göstermişse.</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Alacaklı, dava veya def’i yoluyla mahkemeye veya hakeme başvurmuşsa, icra takibinde bulunmuşsa ya da iflas masasına başvurmuşsa.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Birlikte borçlulara etkisi">
            <mvz-madde no="155" başlık="">
              <mvz-fıkra no="1">
                <template>Zamanaşımı müteselsil borçlulardan veya bölünemeyen borcun borçlularından birine karşı kesilince, diğerlerine karşı da kesilmiş olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zamanaşımı asıl borçluya karşı kesilince, kefile karşı da kesilmiş olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Zamanaşımı kefile karşı kesilince, asıl borçluya karşı kesilmiş olmaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Yeni sürenin başlaması">
            <mvz-b3 no="1" başlık="Borcun ikrar edilmesi veya karara bağlanması hâlinde">
              <mvz-madde no="156" başlık="">
                <mvz-fıkra no="1">
                  <template>Zamanaşımının kesilmesiyle, yeni bir süre işlemeye başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Borç bir senetle ikrar edilmiş veya bir mahkeme ya da hakem kararına bağlanmış ise, yeni süre her zaman on yıldır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Alacaklının fiili hâlinde">
              <mvz-madde no="157" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir dava veya def’i yoluyla kesilmiş olan zamanaşımı, dava süresince tarafların yargılamaya ilişkin her işleminden veya hâkimin her kararından sonra yeniden işlemeye başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Zamanaşımı, icra takibiyle kesilmişse, alacağın takibine ilişkin her işlemden sonra yeniden işlemeye başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Zamanaşımı, iflas masasına başvurma sebebiyle kesilmişse, iflasa ilişkin hükümlere göre alacağın yeniden istenmesi imkânının doğumundan itibaren yeniden işlemeye başlar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Davanın reddinde ek süre">
          <mvz-madde no="158" başlık="">
            <mvz-fıkra no="1">
              <template>Dava veya def’i; mahkemenin yetkili veya görevli olmaması ya da düzeltilebilecek bir yanlışlık yapılması yahut vaktinden önce açılmış olması nedeniyle reddedilmiş olup da o arada zamanaşımı veya hak düşürücü süre dolmuşsa, alacaklı altmış günlük ek süre içinde haklarını kullanabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Taşınır rehni ile güvenceye bağlanmış alacakta">
          <mvz-madde no="159" başlık="">
            <mvz-fıkra no="1">
              <template>Alacağın bir taşınır rehniyle güvenceye bağlanmış olması, bu alacak için zamanaşımının işlemesine engel olmaz; bununla birlikte alacaklının, hakkını rehinden alma yetkisi devam eder.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="G" başlık="Zamanaşımından feragat">
          <mvz-madde no="160" başlık="">
            <mvz-fıkra no="1">
              <template>Zamanaşımından önceden feragat edilemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Müteselsil borçlulardan birinin feragat etmiş olması, diğerlerine karşı ileri sürülemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bölünemez bir borcun borçlularından birinin feragat etmiş olması durumunda da aynı hüküm uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Asıl borçlunun feragati de kefile karşı ileri sürülemez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="H" başlık="İleri sürülmesi">
          <mvz-madde no="161" başlık="">
            <mvz-fıkra no="1">
              <template>Zamanaşımı ileri sürülmedikçe, hâkim bunu kendiliğinden göz önüne alamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Borç İlişkilerinde Özel Durumlar">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Teselsül">
        <mvz-b1 no="A" başlık="Müteselsil borçluluk">
          <mvz-b2 no="I" başlık="Doğuşu">
            <mvz-madde no="162" başlık="">
              <mvz-fıkra no="1">
                <template>Birden çok borçludan her biri, alacaklıya karşı borcun tamamından sorumlu olmayı kabul ettiğini bildirirse, müteselsil borçluluk doğar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Böyle bir bildirim yoksa, müteselsil borçluluk ancak kanunda öngörülen hâllerde doğar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Dış ilişki">
            <mvz-b3 no="1" başlık="Hükümleri">
              <mvz-b4 no="a" başlık="Borçluların sorumluluğu">
                <mvz-madde no="163" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklı, borcun tamamının veya bir kısmının ifasını, dilerse borçluların hepsinden, dilerse yalnız birinden isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Borçluların sorumluluğu, borcun tamamı ödeninceye kadar devam eder.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Borçluların savunmaları">
                <mvz-madde no="164" başlık="">
                  <mvz-fıkra no="1">
                    <template>Müteselsil borçlulardan biri, alacaklıya karşı, ancak onunla kendi arasındaki kişisel ilişkilerden veya müteselsil borcun sebep ya da konusundan doğan def’i ve itirazları ileri sürebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Müteselsil borçlulardan biri ortak def’i ve itirazları ileri sürmezse, diğerlerine karşı sorumlu olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Borçluların bireysel davranışı">
                <mvz-madde no="165" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kanun veya sözleşme ile aksi belirlenmedikçe, borçlulardan biri kendi davranışıyla diğer borçluların durumunu ağırlaştıramaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Borcun sona ermesi">
              <mvz-madde no="166" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlulardan biri, ifa veya takasla borcun tamamını veya bir kısmını sona erdirmişse, bu oranda diğer borçluları da borçtan kurtarmış olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Borçlulardan biri, alacaklıya ifada bulunmaksızın borçtan kurtulmuşsa, diğer borçlular bundan, ancak durumun veya borcun niteliğinin elverdiği ölçüde yararlanabilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Alacaklının borçlulardan biriyle yaptığı ibra sözleşmesi, diğer borçluları da ibra edilen borçlunun iç ilişkideki borca katılma payı oranında borçtan kurtarır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="İç ilişki">
            <mvz-b3 no="1" başlık="Paylaşım">
              <mvz-madde no="167" başlık="">
                <mvz-fıkra no="1">
                  <template>Aksi kararlaştırılmadıkça veya borçlular arasındaki hukuki ilişkinin niteliğinden anlaşılmadıkça, borçlulardan her biri, alacaklıya yapılan ifadan, birbirlerine karşı eşit paylarla sorumludurlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kendisine düşen paydan fazla ifada bulunan borçlunun, ödediği fazla miktarı diğer borçlulardan isteme hakkı vardır. Bu durumda borçlu, her bir borçluya ancak payı oranında rücu edebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Borçlulardan birinden alınamayan miktarı, diğer borçlular eşit olarak üstlenmekle yükümlüdürler.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Alacaklıya halef olma">
              <mvz-madde no="168" başlık="">
                <mvz-fıkra no="1">
                  <template>Diğerlerine rücu hakkına sahip olan borçlulardan her biri, ifa ettiği miktar oranında alacaklının haklarına halef olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacaklı diğerlerinin zararına olarak borçlulardan birinin durumunu iyileştirirse, bunun sonuçlarına katlanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Müteselsil alacaklılık">
          <mvz-madde no="169" başlık="">
            <mvz-fıkra no="1">
              <template>Müteselsil alacaklılık, borçlunun, alacaklılardan her birine borcun tamamını isteme hakkını tanıdığı veya kanunun belirlediği durumlarda doğar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Borçlu, alacaklılardan birine yaptığı ifayla, bütün alacaklılara karşı borcundan kurtulmuş olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Alacaklılardan birinin icraya veya mahkemeye başvurmuş olduğu kendisine bildirilmedikçe, borçlu onlardan dilediği birine ifada bulunabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Aksi kararlaştırılmadıkça veya alacaklılar arasındaki hukuki ilişkinin niteliğinden anlaşılmadıkça, alacaklılardan her birinin edim üzerindeki hakları eşittir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Kendisine düşen paydan fazlasını elde eden alacaklı, bu fazlalığı payını alamamış olan diğer alacaklılara ödemekle yükümlüdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Koşullar">
        <mvz-b1 no="A" başlık="Geciktirici koşul">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="170" başlık="">
              <mvz-fıkra no="1">
                <template>Bir sözleşmenin hüküm ifade etmesi, gerçekleşip gerçekleşmeyeceği bilinmeyen bir olguya bırakılmışsa, sözleşme geciktirici koşula bağlanmış olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aksi kararlaştırılmamışsa, geciktirici koşula bağlı sözleşme, ancak koşulun gerçekleştiği andan başlayarak hüküm ifade eder.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Koşulun askıda olduğu sıradaki durum">
            <mvz-madde no="171" başlık="">
              <mvz-fıkra no="1">
                <template>Koşul gerçekleşinceye kadar borçlu, borcun gereği gibi ifasını engelleyecek her türlü davranıştan kaçınmakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Koşula bağlı hakkı tehlikeye düşürülen alacaklı, alacağı koşula bağlı olmayan alacaklıların haklarını korumak üzere başvurabilecekleri önlemleri alabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Koşulun gerçekleşmesinden önce yapılan tasarruflar, koşulun hükümlerini zedelediği oranda geçersiz olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Koşul gerçekleşinceye kadar elde edilen yararlar">
            <mvz-madde no="172" başlık="">
              <mvz-fıkra no="1">
                <template>Borcun konusunu oluşturan şey, koşulun gerçekleşmesinden önce kendisine verilen alacaklı, koşul gerçekleşirse, koşulun gerçekleşmesine kadar elde ettiği yararların sahibi olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Koşul gerçekleşmezse alacaklı, elde ettiği yararları geri vermekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Bozucu koşul">
          <mvz-madde no="173" başlık="">
            <mvz-fıkra no="1">
              <template>Sona ermesi önceden gerçekleşip gerçekleşmeyeceği bilinmeyen bir olguya bırakılan sözleşme, bozucu koşula bağlanmış olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bozucu koşula bağlanmış sözleşmenin hükümleri, koşulun gerçekleştiği anda ortadan kalkar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Aksi kararlaştırılmadıkça veya işin niteliğinden anlaşılmadıkça sona erme, geçmişe etkili olmaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Ortak hükümler">
          <mvz-b2 no="I" başlık="Koşulun gerçekleşmesi">
            <mvz-madde no="174" başlık="">
              <mvz-fıkra no="1">
                <template>Koşul, taraflardan birinin bizzat yerine getirmesi gerekli bir davranış değilse, o tarafın ölümü hâlinde mirasçısı onun yerine geçebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Dürüstlük kurallarına aykırı engelleme">
            <mvz-madde no="175" başlık="">
              <mvz-fıkra no="1">
                <template>Taraflardan biri, koşulun gerçekleşmesine dürüstlük kurallarına aykırı olarak engel olursa, koşul gerçekleşmiş sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Taraflardan biri, koşulun gerçekleşmesini dürüstlük kurallarına aykırı biçimde sağlarsa, koşul gerçekleşmemiş sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Yasak koşullar">
            <mvz-madde no="176" başlık="">
              <mvz-fıkra no="1">
                <template>Bir koşul, hukuka veya ahlaka aykırı bir yapma veya yapmama fiilini sağlamak amacıyla konulmuşsa, bu koşula bağlı hukuki işlem kesin olarak hükümsüzdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Bağlanma Parası, Cayma Parası ve Ceza Koşulu">
        <mvz-b1 no="A" başlık="Bağlanma parası">
          <mvz-madde no="177" başlık="">
            <mvz-fıkra no="1">
              <template>Sözleşme yapılırken bir kimsenin vermiş olduğu bir miktar para, cayma parası olarak değil sözleşmenin yapıldığına kanıt olarak verilmiş sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Aksine sözleşme veya yerel âdet olmadıkça, bağlanma parası esas alacaktan düşülür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Cayma parası">
          <mvz-madde no="178" başlık="">
            <mvz-fıkra no="1">
              <template>Cayma parası kararlaştırılmışsa, taraflardan her biri sözleşmeden caymaya yetkili sayılır; bu durumda parayı vermiş olan cayarsa verdiğini bırakır; almış olan cayarsa aldığının iki katını geri verir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Ceza koşulu">
          <mvz-b2 no="I" başlık="Alacaklının hakları">
            <mvz-b3 no="1" başlık="Cezanın sözleşmenin ifası ile ilişkisi">
              <mvz-madde no="179" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir sözleşmenin hiç veya gereği gibi ifa edilmemesi durumu için bir ceza kararlaştırılmışsa, aksi sözleşmeden anlaşılmadıkça alacaklı, ya borcun ya da cezanın ifasını isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ceza, borcun belirlenen zaman veya yerde ifa edilmemesi durumu için kararlaştırılmışsa alacaklı, hakkından açıkça feragat etmiş veya ifayı çekincesiz olarak kabul etmiş olmadıkça, asıl borçla birlikte cezanın ifasını da isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Borçlunun, kararlaştırılan cezayı ifa ederek sözleşmeyi, dönme veya fesih suretiyle sona erdirmeye yetkili olduğunu ispat etme hakkı saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Ceza ile zarar arasındaki ilişki">
              <mvz-madde no="180" başlık="">
                <mvz-fıkra no="1">
                  <template>Alacaklı hiçbir zarara uğramamış olsa bile, kararlaştırılan cezanın ifası gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacaklının uğradığı zarar kararlaştırılan ceza tutarını aşıyorsa alacaklı, borçlunun kusuru bulunduğunu ispat etmedikçe aşan miktarı isteyemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Kısmi ifanın yanması">
              <mvz-madde no="181" başlık="">
                <mvz-fıkra no="1">
                  <template>Ceza koşuluna ilişkin hükümler, dönme durumunda ifa edilmiş olan kısmın alacaklıya kalacağını öngören sözleşmelere de uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taksitle satışa ilişkin hükümler saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Cezanın miktarı, geçersizliği ve indirilmesi">
            <mvz-madde no="182" başlık="">
              <mvz-fıkra no="1">
                <template>Taraflar, cezanın miktarını serbestçe belirleyebilirler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Asıl borç herhangi bir sebeple geçersiz ise veya aksi kararlaştırılmadıkça sonradan borçlunun sorumlu tutulamayacağı bir sebeple imkânsız hâle gelmişse, cezanın ifası istenemez. Ceza koşulunun geçersiz olması veya borçlunun sorumlu tutulamayacağı bir sebeple sonradan imkânsız hâle gelmesi, asıl borcun geçerliliğini etkilemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Hâkim, aşırı gördüğü ceza koşulunu kendiliğinden indirir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Borç İlişkilerinde Taraf Değişiklikleri">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Alacağın Devri">
        <mvz-b1 no="A" başlık="Koşulları">
          <mvz-b2 no="I" başlık="İradi devir">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="183" başlık="">
                <mvz-fıkra no="1">
                  <template>Kanun, sözleşme veya işin niteliği engel olmadıkça alacaklı, borçlunun rızasını aramaksızın alacağını üçüncü bir kişiye devredebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Borçlu, devir yasağı içermeyen yazılı bir borç tanımasına güvenerek alacağı devralmış olan üçüncü kişiye karşı, alacağın devredilemeyeceğinin kararlaştırılmış bulunduğu savunmasını ileri süremez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Şekli">
              <mvz-madde no="184" başlık="">
                <mvz-fıkra no="1">
                  <template>Alacağın devrinin geçerliliği, yazılı şekilde yapılmış olmasına bağlıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacağın devri sözü verme, şekle bağlı değildir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Yasal veya yargısal devir ve etkisi">
            <mvz-madde no="185" başlık="">
              <mvz-fıkra no="1">
                <template>Alacağın devri kanun veya mahkeme kararı gereğince gerçekleşmişse, bu devir özel bir şekle ve önceki alacaklının rızasını açıklamasına gerek olmaksızın, üçüncü kişilere karşı ileri sürülebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Devrin hükümleri">
          <mvz-b2 no="I" başlık="Borçlunun durumu">
            <mvz-b3 no="1" başlık="İyiniyetle yapılan ifa">
              <mvz-madde no="186" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlu, alacağın devredildiği, devreden veya devralan tarafından kendisine bildirilmemişse, önceki alacaklıya; alacak birkaç kez devredilmişse, son devralan yerine önceki devralanlardan birine iyiniyetle ifada bulunarak borcundan kurtulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İfadan kaçınma ve tevdi">
              <mvz-madde no="187" başlık="">
                <mvz-fıkra no="1">
                  <template>Kime ait olduğu çekişmeli bulunan bir alacağın borçlusu, ifadan kaçınabilir ve alacağın konusunu hâkim tarafından belirlenen yere tevdi etmekle borçtan kurtulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Borçlu, alacağın çekişmeli olduğunu bildiği hâlde ifada bulunursa, bundan doğacak sonuçlardan sorumlu olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Dava konusu olan çekişme mahkemece henüz sonuca bağlanmamış ve borç da muaccel ise, taraflardan her biri borçluyu, edimi tevdi etmeye zorlayabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Borçluya ait savunmalar">
              <mvz-madde no="188" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlu, devri öğrendiği sırada devredene karşı sahip olduğu savunmaları, devralana karşı da ileri sürebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Borçlu, devri öğrendiği anda muaccel olmayan alacağını, devredilen alacaktan önce veya onunla aynı anda muaccel olması koşuluyla borcu ile takas edebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Öncelik hakları ve bağlı hakların geçişi">
            <mvz-madde no="189" başlık="">
              <mvz-fıkra no="1">
                <template>Alacağın devri ile devredenin kişiliğine özgü olanlar dışındaki öncelik hakları ve bağlı haklar da devralana geçer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Asıl alacakla birlikte işlemiş faizler de devredilmiş sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Senet ve belgelerin teslimi ve bilgi verilmesi">
            <mvz-madde no="190" başlık="">
              <mvz-fıkra no="1">
                <template>Devreden, devralana alacak senedi ile elinde bulunan ispatla ilgili diğer belgeleri teslim etmek ve alacağını ileri sürebilmesi için gerekli bilgileri vermekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Garanti">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="191" başlık="">
                <mvz-fıkra no="1">
                  <template>Alacak, bir edim karşılığında devredilmişse devreden, devir sırasında alacağın varlığını ve borçlunun ödeme gücüne sahip olduğunu garanti etmiş olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacak bir edim karşılığı olmaksızın devredilmiş ya da kanun gereğince başkasına geçmişse, devreden veya önceki alacaklı, alacağın varlığından ve borçlunun ödeme gücünden sorumlu değildir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İfaya yönelik devir">
              <mvz-madde no="192" başlık="">
                <mvz-fıkra no="1">
                  <template>Alacaklı, alacağını borcu ifaya yönelik olarak devretmekle birlikte borca mahsup edilecek miktarı belirlememişse devralan, ancak borçludan aldığı veya gereken özeni gösterseydi alabilecek olduğu miktarı, kendi alacağına mahsup etmek zorundadır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Sorumluluğun kapsamı">
              <mvz-madde no="193" başlık="">
                <mvz-fıkra no="1">
                  <template>Devralan garanti ile yükümlü olan devredenden aşağıdaki istemlerde bulunabilir:</template>
                  <mvz-bent no="1.">
                    <template>İfa ettiği karşı edimin faizi ile birlikte geri verilmesini.</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Devrin sebep olduğu giderleri.</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Borçluya karşı devraldığı alacağı elde etmek için yaptığı ve sonuçsuz girişimlerin yol açtığı giderleri.</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Devreden kusursuzluğunu ispat etmedikçe uğradığı diğer zararlarını.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Özel hükümlerin saklılığı">
          <mvz-madde no="194" başlık="">
            <mvz-fıkra no="1">
              <template>Bazı hakların devrine özgü olarak kanunla konulmuş bulunan hükümler saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Borcun Üstlenilmesi">
        <mvz-b1 no="A" başlık="İç üstlenme sözleşmesi">
          <mvz-madde no="195" başlık="">
            <mvz-fıkra no="1">
              <template>Borçlu ile iç üstlenme sözleşmesi yapan kişi, borcu bizzat ifa ederek veya alacaklının rızasıyla borcu üstlenerek, borçluyu borcundan kurtarma yükümlülüğü altına girmiş olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Borçlu, iç üstlenme sözleşmesinden doğan borçlarını ifa etmedikçe, diğer taraftan yükümlülüğünü yerine getirmesini isteyemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Borçlu, borcundan kurtarılmamışsa, diğer taraftan güvence isteyebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Dış üstlenme sözleşmesi">
          <mvz-b2 no="I" başlık="Öneri ve kabul">
            <mvz-madde no="196" başlık="">
              <mvz-fıkra no="1">
                <template>Borçlunun yerine yenisinin geçmesi ve borcundan kurtarılması, borcu üstlenen ile alacaklı arasında yapılacak sözleşmeyle olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İç üstlenme sözleşmesinin, üstlenen veya onun izni ile borçlu tarafından alacaklıya bildirilmesi, dış üstlenme sözleşmesinin yapılmasına ilişkin öneri anlamına gelir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Alacaklının kabulü açık veya örtülü olabilir. Alacaklı, çekince ileri sürmeksizin üstlenenin ifasını kabul eder veya onun borçlu sıfatı ile yaptığı diğer herhangi bir işleme rıza gösterirse, borcun üstlenilmesini kabul etmiş sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Önerinin bağlayıcılığı">
            <mvz-madde no="197" başlık="">
              <mvz-fıkra no="1">
                <template>Borcun üstlenilmesine ilişkin öneri alacaklı tarafından her zaman kabul edilebilir. Ancak, üstlenen veya önceki borçlu, kabul için bir süre koyabilir. Alacaklı bu sürenin bitimine kadar susarsa, öneri reddedilmiş sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Önerinin alacaklı tarafından kabul edilmesinden önce yeni bir iç üstlenme sözleşmesi yapılır ve bu ikinci üstlenmeye ilişkin olarak alacaklıya öneride bulunulursa, ilk öneride bulunan, önerisi ile bağlı olmaktan kurtulur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Borçlunun değişmesinin sonuçları">
          <mvz-b2 no="I" başlık="Bağlı hak ve borçlar">
            <mvz-madde no="198" başlık="">
              <mvz-fıkra no="1">
                <template>Borçlu değişmiş olsa bile, alacaklının borçlunun kişiliğine özgü olanlar dışındaki bağlı hakları saklı kalır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bununla birlikte borcun güvencesi olarak rehin veren üçüncü kişinin ve kefilin sorumlulukları, ancak onların borcun üstlenilmesine yazılı olarak rıza göstermeleri hâlinde devam eder.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Savunmalar">
            <mvz-madde no="199" başlık="">
              <mvz-fıkra no="1">
                <template>Üstlenilen borca ilişkin savunmaları ileri sürme hakkı, yeni borçluya geçer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Dış üstlenme sözleşmesinden aksi anlaşılmadıkça yeni borçlu, alacaklıya karşı önceki borçlunun ileri sürebileceği kişisel savunmalarda bulunamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Yeni borçlu, iç üstlenme sözleşmesinden kaynaklanan savunmaları alacaklıya karşı ileri süremez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Sözleşmenin hükümsüzlüğü">
          <mvz-madde no="200" başlık="">
            <mvz-fıkra no="1">
              <template>Dış üstlenme sözleşmesi hükümsüz hâle gelirse, iyiniyetli üçüncü kişilerin hakları saklı kalmak üzere, eski borç bütün bağlı borçlarıyla birlikte varlığını sürdürür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bundan başka, borcu üstlenen üstlenme sözleşmesinin hükümsüz hâle gelmesinde ve alacaklının zarara uğramasında kendisine bir kusur yüklenemeyeceğini ispat etmedikçe alacaklı, önceden sağlanmış güvenceyi yitirmesi yüzünden veya başka herhangi bir sebeple uğradığı zararın giderilmesini üstlenenden isteyebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Borca katılma">
          <mvz-madde no="201" başlık="">
            <mvz-fıkra no="1">
              <template>Borca katılma, mevcut bir borca borçlunun yanında yer almak üzere, katılan ile alacaklı arasında yapılan ve katılanın, borçlu ile birlikte borçtan sorumlu olması sonucunu doğuran bir sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Borca katılan ile borçlu, alacaklıya karşı müteselsilen sorumlu olurlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Malvarlığının veya işletmenin devralınması">
          <mvz-madde no="202" başlık="">
            <mvz-fıkra no="1">
              <template>Bir malvarlığını veya bir işletmeyi aktif ve pasifleri ile birlikte devralan, bunu alacaklılara bildirdiği veya ticari işletmeler için Ticaret Sicili Gazetesinde, diğerleri için Türkiye genelinde dağıtımı yapılan gazetelerden birinde yayımlanacak ilanla duyurduğu tarihten başlayarak, onlara karşı malvarlığındaki veya işletmedeki borçlardan sorumlu olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bununla birlikte, iki yıl süreyle önceki borçlu da devralanla birlikte müteselsil borçlu olarak sorumlu kalır. Bu süre, muaccel borçlar için, bildirme veya duyuru tarihinden; daha sonra muaccel olacak borçlar için ise, muacceliyet tarihinden işlemeye başlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Borçların bu yoldan üstlenilmesinin sonuçları, dış üstlenme sözleşmesinden doğan sonuçlarla özdeştir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bildirme veya ilanla duyurma yükümlülüğü devralan tarafından yerine getirilmedikçe, ikinci fıkrada öngörülen iki yıllık süre işlemeye başlamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="G" başlık="İşletmelerin birleşmesi ve şekil değiştirmesi">
          <mvz-madde no="203" başlık="">
            <mvz-fıkra no="1">
              <template>Bir işletme, başka bir işletme ile aktif ve pasiflerin karşılıklı olarak devralınması ya da birinin diğerine katılması yoluyla birleştirilirse, her iki işletmenin alacaklıları, bir malvarlığının devralınmasından doğan haklara sahip olup, bütün alacaklarını yeni işletmeden alabilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bir tek kişiye ait olup da, kollektif veya komandit ortaklık hâline dönüştürülen bir işletmenin borçları hakkında da aynı hüküm uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="H" başlık="Özel hükümlerin saklılığı">
          <mvz-madde no="204" başlık="">
            <mvz-fıkra no="1">
              <template>Mirasın paylaşılması ve rehinli taşınmazların devri konusundaki borcun üstlenilmesine ilişkin özel hükümler saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Sözleşmenin Devri ve Sözleşmeye Katılma">
        <mvz-b1 no="A" başlık="Sözleşmenin devri">
          <mvz-madde no="205" başlık="">
            <mvz-fıkra no="1">
              <template>Sözleşmenin devri, sözleşmeyi devralan ile devreden ve sözleşmede kalan taraf arasında yapılan ve devredenin bu sözleşmeden doğan taraf olma sıfatı ile birlikte bütün hak ve borçlarını devralana geçiren bir anlaşmadır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Sözleşmeyi devralan ile devreden arasında yapılan ve sözleşmede kalan diğer tarafça önceden verilen izne dayanan veya sonradan onaylanan anlaşma da, sözleşmenin devri hükümlerine tabidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Sözleşmenin devrinin geçerliliği, devredilen sözleşmenin şekline bağlıdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Kanundan doğan halefiyet hâlleri ile diğer özel hükümler saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Sözleşmeye katılma">
          <mvz-madde no="206" başlık="">
            <mvz-fıkra no="1">
              <template>Sözleşmeye katılma, mevcut bir sözleşmeye taraflardan birinin yanında yer almak üzere, katılan ile bu sözleşmenin tarafları arasında yapılan ve katılanın, yanında yer aldığı tarafla birlikte, onun hak ve borçlarına sahip olması sonucunu doğuran bir anlaşmadır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Anlaşmada aksi kararlaştırılmamışsa, sözleşmeye katılan ile yanında yer aldığı taraf, sözleşmenin diğer tarafına karşı müteselsilen alacaklı ve borçlu olurlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Sözleşmeye katılmanın geçerliliği, katılma konusu sözleşmenin şekline bağlıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Özel Borç İlişkileri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Satış Sözleşmesi">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Genel Hükümler">
        <mvz-b1 no="A" başlık="Tanımı ve hükümleri">
          <mvz-madde no="207" başlık="">
            <mvz-fıkra no="1">
              <template>Satış sözleşmesi, satıcının, satılanın zilyetlik ve mülkiyetini alıcıya devretme, alıcının ise buna karşılık bir bedel ödeme borcunu üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Sözleşme ile aksi kararlaştırılmadıkça veya aksine bir âdet bulunmadıkça, satıcı ve alıcı borçlarını aynı anda ifa etmekle yükümlüdürler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Durum ve koşullara göre belirlenmesi mümkün olan bedel, kararlaştırılmış bedel hükmündedir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Yarar ve hasar">
          <mvz-madde no="208" başlık="">
            <mvz-fıkra no="1">
              <template>Kanundan, durumun gereğinden veya sözleşmede öngörülen özel koşullardan doğan ayrık hâller dışında, satılanın yarar ve hasarı; taşınır satışlarında zilyetliğin devri, taşınmaz satışlarında ise tescil anına kadar satıcıya aittir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Taşınır satışlarında, alıcının satılanın zilyetliğini devralmada temerrüde düşmesi durumunda zilyetliğin devri gerçekleşmişçesine satılanın yarar ve hasarı alıcıya geçer.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Satıcı alıcının isteği üzerine satılanı ifa yerinden başka bir yere gönderirse, yarar ve hasar, satılanın taşıyıcıya teslim edildiği anda alıcıya geçer.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Taşınır Satışı">
        <mvz-b1 no="A" başlık="Konusu">
          <mvz-madde no="209" başlık="">
            <mvz-fıkra no="1">
              <template>Taşınır satışı, Türk Medenî Kanunu uyarınca taşınmaz sayılanlar dışında kalan ve diğer kanunlarda taşınır olarak belirtilen şeylerin satışıdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ürünler, bir yapının yıkıntıları ve taş ocağından çıkarılacak taşlar gibi, taşınmazdan ayrıldıktan sonra mülkiyeti devredilecek bütünleyici parçaların satılması da taşınır satışıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Satıcının borçları">
          <mvz-b2 no="I" başlık="Zilyetliğin devri">
            <mvz-b3 no="1" başlık="Kural">
              <mvz-madde no="210" başlık="">
                <mvz-fıkra no="1">
                  <template>Satıcı, satılanın mülkiyetini geçirmek amacıyla, zilyetliğini alıcıya devretmekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Devir ve taşıma giderleri">
              <mvz-madde no="211" başlık="">
                <mvz-fıkra no="1">
                  <template>Aksine sözleşme veya âdet yoksa, ölçme ve tartma gibi devir giderleri satıcıya, satılanı devralmak üzere yapılan giderler ve satılanın ifa yerinden başka yere taşınması gerektiğinde, taşıma giderleri alıcıya aittir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Gidersiz devir kararlaştırılmışsa, satıcı taşıma giderlerini üstlenmiş sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Liman ve gümrük giderleri olmaksızın devir kararlaştırılmışsa satıcı, dış satım, transit ve dış alım vergilerini üstlenmiş sayılır; ancak satılanın alıcı tarafından devralındığı sırada ödenmiş olan tüketim vergilerini üstlenmiş sayılmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Satıcının temerrüdü">
              <mvz-b4 no="a" başlık="Kural ve ayrık durum">
                <mvz-madde no="212" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satıcının temerrüdü hâlinde, borçlunun temerrüdüne ilişkin genel hükümler uygulanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Zilyetliğin devri için belirli bir süre konulmuş olan ticari satışlarda, satıcı temerrüde düşerse alıcının, devir isteminden vazgeçerek borcun ifa edilmemesinden doğan zararının giderilmesini istediği kabul edilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Alıcı, satılanın devredilmesini isteme niyetinde ise, belirlenen sürenin bitiminde bunu satıcıya hemen bildirmek zorundadır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Giderim borcu ve kapsamı">
                <mvz-madde no="213" başlık="">
                  <mvz-fıkra no="1">
                    <template>Borcunu ifa etmeyen satıcı, alıcının bu yüzden uğradığı zararı gidermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satıcı borcunu ifa etmezse alıcı, satış bedeli ile kendisine devredilmeyen satılanın yerine, bir başkasını satın almak için dürüstlük kurallarına uygun olarak ödediği bedel arasındaki farka göre hesaplanacak zararın giderilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Satılan, borsada kayıtlı veya piyasa fiyatı bulunan mallardan ise alıcı, onun yerine bir başkasını satın alma zorunda olmaksızın, satış bedeli ile belirlenmiş ifa günündeki piyasa fiyatı arasındaki farka göre hesaplanacak zararın giderilmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Zapttan sorumluluk">
            <mvz-b3 no="1" başlık="Konusu">
              <mvz-madde no="214" başlık="">
                <mvz-fıkra no="1">
                  <template>Satış sözleşmesinin kurulduğu sırada var olan bir hak dolayısıyla, satılanın tamamı veya bir kısmı bir üçüncü kişi tarafından alıcının elinden alınırsa satıcı, bundan dolayı alıcıya karşı sorumlu olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alıcı, elinden alınma tehlikesini sözleşmenin kurulduğu sırada biliyor idiyse satıcı, ayrıca üstlenmiş olmadıkça bundan dolayı sorumlu olmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Satıcı, üçüncü kişinin hakkını gizlemişse, sorumluluğunu kaldırma veya sınırlama konusunda yapılmış olan anlaşma kesin olarak hükümsüzdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
