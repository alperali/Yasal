            <template>Düzenlenmesine kanun veya yetkili makamlarca izin verilmiş olmadıkça, piyango ve diğer şans oyunlarından doğan alacaklar hakkında dava açılamaz ve takip yapılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İzin verilmemiş olan durumlarda, piyango ve diğer şans oyunları için de kumara ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yabancı ülkelerde kendi kurallarına uygun olarak düzenlenen piyango ve diğer şans oyunları, Türkiye’de yetkili makamlarca bunlara ait biletlerin satılmasına izin verilmiş olmadıkça, yasal korumadan yararlanamazlar.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="17-ONYEDİNCİ" başlık="Ömür Boyu Gelir ve Ölünceye Kadar Bakma Sözleşmeleri">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Ömür Boyu Gelir Sözleşmesi">
        <mvz-b1 no="A" başlık="Tanımı">
          <mvz-madde no="607" başlık="">
            <mvz-fıkra no="1">
              <template>Ömür boyu gelir sözleşmesi, gelir borçlusunun gelir alacaklısına, içlerinden birinin veya üçüncü bir kişinin ömrü boyunca belirli dönemsel edimlerde bulunmayı üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Sözleşme, aksine açık bir hüküm yoksa, gelir alacaklısının ömrü boyunca yapılmış sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Gelir borçlusunun veya üçüncü bir kişinin ömrüyle sınırlı olarak bağlanmış olan gelir, aksi kararlaştırılmamışsa gelir alacaklısının mirasçılarına geçer.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Şekli">
          <mvz-madde no="608" başlık="">
            <mvz-fıkra no="1">
              <template>Ömür boyu gelir sözleşmesi, yazılı şekilde yapılmadıkça geçerli olmaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Gelir alacaklısının hakları">
          <mvz-b2 no="I" başlık="Hakkın kullanılması">
            <mvz-madde no="609" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmede aksi kararlaştırılmamışsa ömür boyu gelir, her altı ayda bir ve peşin olarak ödenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Gelirin süresi ömrüne bağlanmış olan kişi, peşin ödeme öngörülen dönemin sona ermesinden önce ölse bile, o döneme ait gelirin tamamı gelir borçlusu tarafından borçlanılmış sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Gelir borçlusu iflas ederse, gelir alacaklısı, gelir borçlusunun yükümlü olduğu dönemsel gelirin elde edilebilmesi için ilgili sosyal güvenlik kurumunca ödenmesi gereken anaparaya denk düşen bir parayı iflas masasına kaydettirme hakkını elde eder.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Devredilebilmesi">
            <mvz-madde no="610" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmeyle aksi kararlaştırılmamışsa gelir alacaklısı, haklarını başkasına devredebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Ölünceye Kadar Bakma Sözleşmesi">
        <mvz-b1 no="A" başlık="Tanımı">
          <mvz-madde no="611" başlık="">
            <mvz-fıkra no="1">
              <template>Ölünceye kadar bakma sözleşmesi, bakım borçlusunun bakım alacaklısını ölünceye kadar bakıp gözetmeyi, bakım alacaklısının da bir malvarlığını veya bazı malvarlığı değerlerini ona devretme borcunu üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bakım borçlusu, bakım alacaklısı tarafından mirasçı atanmışsa, ölünceye kadar bakma sözleşmesine miras sözleşmesine ilişkin hükümler uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Şekli">
          <mvz-madde no="612" başlık="">
            <mvz-fıkra no="1">
              <template>Ölünceye kadar bakma sözleşmesi, mirasçı atanmasını içermese bile, miras sözleşmesi şeklinde yapılmadıkça geçerli olmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Sözleşme, Devletçe tanınmış bir bakım kurumu tarafından yetkili makamların belirlediği koşullara uyularak yapılmışsa, geçerliliği için yazılı şekil yeterlidir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Güvencesi">
          <mvz-madde no="613" başlık="">
            <mvz-fıkra no="1">
              <template>Bakım borçlusuna bir taşınmazını devretmiş olan bakım alacaklısı, haklarını güvence altına almak üzere, bu taşınmaz üzerinde satıcı gibi yasal ipotek hakkına sahiptir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Konusu">
          <mvz-madde no="614" başlık="">
            <mvz-fıkra no="1">
              <template>Bakım alacaklısı, sözleşmenin kurulmasıyla bakım borçlusunun aile topluluğuna katılmış olur. Bakım borçlusu, almış olduğu malların değerine ve bakım alacaklısının daha önce sahip olduğu sosyal durumuna göre hakkaniyetin gerektirdiği edimleri, bakım alacaklısına ifa etmekle yükümlüdür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bakım borçlusu, bakım alacaklısına özellikle uygun gıda ve konut sağlamak, hastalığında gerekli özenle bakmak ve onu tedavi ettirmek zorundadır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kabul ettikleri kişilere ölünceye kadar bakma amacıyla kurulmuş olan kurumların bakım borcunun kapsamı ve ifası, kendilerince hazırlanarak yetkili makamların onayından geçen genel düzenlemelerle belirlenir. Bu düzenlemeler, sözleşmenin içeriğinden sayılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="E" başlık="İptali ve tenkisi">
          <mvz-madde no="615" başlık="">
            <mvz-fıkra no="1">
              <template>Bakım alacaklısı, ölünceye kadar bakma sözleşmesi yüzünden kanuna göre nafaka yükümlüsü olduğu kişilere karşı yükümlülüğünü yerine getirme imkânını kaybediyorsa, bundan yoksun kalanlar sözleşmenin iptalini isteyebilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Hâkim, sözleşmenin iptali yerine, bakım borçlusunun ifa edeceği edimlerden mahsup edilmek üzere, bakım alacaklısının nafaka yükümlüsü olduğu kişilere nafaka ödemesine karar verebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Mirasçıların tenkis ve alacaklıların iptal davası açma hakları saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Sona ermesi">
          <mvz-b2 no="I" başlık="Önel verilerek fesih">
            <mvz-madde no="616" başlık="">
              <mvz-fıkra no="1">
                <template>Tarafların edimleri arasında önemli ölçüde oransızlık bulunur ve fazla alan taraf kendisine bağışta bulunulma amacı güdüldüğünü ispat edemezse diğer taraf, altı ay önce bildirimde bulunmak koşuluyla, sözleşmeyi her zaman feshedebilir. Bu oransızlığın tespitinde, ilgili sosyal güvenlik kurumunca, bakım borçlusuna verilenin değerine denk düşen anapara değeri ile bağlanacak irat arasındaki fark esas alınır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Sözleşmenin sona erdirilmesi anına kadar geçen sürede ifa edilmiş edimler, anapara ve faiziyle birlikte değerlendirilerek, denkleştirme sonucunda alacaklı çıkan tarafa geri verilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Önel verilmeksizin fesih">
            <mvz-madde no="617" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmeden doğan borçlara aykırı davranılması sebebiyle sözleşmenin devamı çekilmez hâle gelir veya başkaca önemli sebepler sözleşmenin devamını imkânsız hâle getirir ya da aşırı ölçüde güçleştirirse, taraflardan her biri sözleşmeyi önel vermeksizin feshedebilir. Sözleşme bu sebeplerden birine dayanılarak feshedildiği takdirde kusurlu taraf, aldığı şeyi geri verir ve kusursuz tarafa, bu yüzden uğradığı zarara karşılık uygun bir tazminat ödemekle yükümlü olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Hâkim, sözleşmenin önel verilmeksizin feshini yerinde bulabileceği gibi, taraflardan birinin istemiyle veya kendiliğinden, aile topluluğu içinde yaşamalarına son vererek, bakım alacaklısına ömür boyu gelir bağlayabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Bakım borçlusunun ölümü">
            <mvz-madde no="618" başlık="">
              <mvz-fıkra no="1">
                <template>Bakım borçlusu ölürse bakım alacaklısı, bir yıl içinde sözleşmenin feshini isteyebilir. Bu durumda bakım alacaklısı, bakım borçlusunun iflası hâlinde, iflas masasından isteyebileceği miktara eşit bir paranın kendisine ödenmesini, bakım borçlusunun mirasçılarından isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="G" başlık="Devredilemezlik, iflas ve haciz hâlinde istem">
          <mvz-madde no="619" başlık="">
            <mvz-fıkra no="1">
              <template>Bakım alacaklısı, hakkını başkasına devredemez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bakım borçlusunun iflası hâlinde bakım alacaklısı, borçlunun ödemekle yükümlü olduğu dönemsel gelirin elde edilebilmesi için ilgili sosyal güvenlik kurumunca ödenmesi gereken anapara değerine eşit bir parayı, iflas masasına alacak kaydettirme hakkını elde eder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bakım alacaklısı, bu alacağını karşılamak üzere, üçüncü kişilerce borçluya karşı yürütülmekte olan hacze katılabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="18-ONSEKİZİNCİ" başlık="Adi Ortaklık Sözleşmesi">
      <mvz-b1 no="A" başlık="Tanımı">
        <mvz-madde no="620" başlık="">
          <mvz-fıkra no="1">
            <template>Adi ortaklık sözleşmesi, iki ya da daha fazla kişinin emeklerini ve mallarını ortak bir amaca erişmek üzere birleştirmeyi üstlendikleri sözleşmedir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir ortaklık, kanunla düzenlenmiş ortaklıkların ayırt edici niteliklerini taşımıyorsa, bu bölüm hükümlerine tabi adi ortaklık sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Ortaklar arasındaki ilişki">
        <mvz-b2 no="I" başlık="Katılım payı">
          <mvz-madde no="621" başlık="">
            <mvz-fıkra no="1">
              <template>Her ortak, para, alacak veya başka bir mal ya da emek olarak, ortaklığa bir katılım payı koymakla yükümlüdür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Sözleşmede aksi kararlaştırılmamışsa katılım payları, ortaklığın amacının gerektirdiği önem ve nitelikte ve birbirine eşit olmak zorundadır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bir ortağın katılım payı, bir şeyin kullandırılmasından oluşuyorsa kira sözleşmesindeki; bir şeyin mülkiyetinden oluşuyorsa satış sözleşmesindeki hasara, ayıptan ve zapttan sorumluluğa ilişkin hükümler kıyas yoluyla uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Kazanç ve zarar">
          <mvz-b3 no="1" başlık="Kazancın paylaşılması">
            <mvz-madde no="622" başlık="">
              <mvz-fıkra no="1">
                <template>Ortaklar, niteliği gereği ortaklığa ait olan bütün kazançları aralarında paylaşmakla yükümlüdürler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Kazanç ve zarara katılma">
            <mvz-madde no="623" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmede aksi kararlaştırılmamışsa, her ortağın kazanç ve zarardaki payı, katılım payının değerine ve niteliğine bakılmaksızın eşittir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Sözleşmede ortakların kazanç veya zarara katılım paylarından biri belirlenmişse bu belirleme, diğerindeki payı da ifade eder.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bir ortağın zarara katılmaksızın yalnız kazanca katılacağına ilişkin anlaşma, ancak katılma payı olarak yalnızca emeğini koymuş olan ortak için geçerlidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Ortaklığın kararları">
          <mvz-madde no="624" başlık="">
            <mvz-fıkra no="1">
              <template>Ortaklığın kararları, bütün ortakların oybirliğiyle alınır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Sözleşmede kararların oy çokluğuyla alınacağı belirtilmişse çoğunluk, ortak sayısına göre belirlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Ortaklığın yönetimi">
          <mvz-madde no="625" başlık="">
            <mvz-fıkra no="1">
              <template>Yönetim, sözleşme veya kararla yalnızca bir veya birden çok ortağa ya da üçüncü bir kişiye bırakılmış olmadıkça, bütün ortaklar ortaklığı yönetme hakkına sahiptir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ortaklık, ortakların tümü veya birkaçı tarafından yönetilmekte ise, bunlardan her biri, diğerleri katılmaksızın işlem yapabilir; ancak ortaklığı yönetmeye yetkili olan her ortak, tamamlanmasından önce işleme itiraz etmek suretiyle, bu işlemin yapılmasını engelleyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Ortaklığa genel yetkili bir temsilci atanması ve ortaklığın olağan dışı işlerinin yürütülmesi için, bütün ortakların oybirliği gereklidir. Ancak, gecikmesinde sakınca olan hâllerde, bu konuda yönetici ortaklardan her biri yetkilidir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="V" başlık="Ortaklar arasındaki sorumluluk">
          <mvz-b3 no="1" başlık="Rekabet yasağı">
            <mvz-madde no="626" başlık="">
              <mvz-fıkra no="1">
                <template>Ortaklar, kendilerinin veya üçüncü kişilerin menfaatine olarak, ortaklığın amacını engelleyici veya zarar verici işleri yapamazlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Ortakların yaptıkları giderler ve işler">
            <mvz-madde no="627" başlık="">
              <mvz-fıkra no="1">
                <template>Ortaklardan birinin ortaklık işleri için yaptığı giderlerden veya üstlendiği borçlardan dolayı diğer ortaklar, ona karşı sorumlu olurlar; bu ortağın, yönetim işleri yüzünden doğrudan doğruya uğradığı zararlar ile ortaklığın yönetiminden kaynaklanan tehlikeler sonucunda doğan zararları, diğer ortaklar gidermekle yükümlüdürler.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ortaklığa avans olarak para veren ortak, verdiği günden başlamak üzere faiz isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Yükümlü olmadığı hâlde ortaklık işleri için emek sarfetmiş olan bir ortak, hakkaniyetin gerektirdiği bir karşılık ödenmesini isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Özen borcu">
            <mvz-madde no="628" başlık="">
              <mvz-fıkra no="1">
                <template>Her ortak, ortaklık işlerinde kendi işlerinde olduğu ölçüde çaba ve özen göstermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Her ortak, diğerlerine karşı, kendi kusuruyla verdiği zararları, başka işlerde ortaklığa sağladığı menfaatlerle mahsup ettirme hakkı olmaksızın gidermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Ortaklık işlerini ücret karşılığı yürüten ortak, vekâlet hükümlerine göre sorumlu olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="VI" başlık="Yönetim yetkisinin kaldırılması ve sınırlanması">
          <mvz-madde no="629" başlık="">
            <mvz-fıkra no="1">
              <template>Ortaklık sözleşmesiyle ortaklardan birine verilen yönetim yetkisi, haklı bir sebep olmaksızın, diğer ortaklarca kaldırılamaz ve sınırlanamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ortaklık sözleşmesinde yetkinin kaldırılamayacağına ilişkin bir hüküm bulunsa bile, haklı bir sebep varsa, diğer ortaklardan her biri yönetim yetkisini kaldırabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Haklı sebepler, özellikle yönetici ortağın görevini aşırı ölçüde ihmal etmesi veya iyi yönetim için gerekli olan yeteneği kaybetmesi durumlarında vardır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="VII" başlık="Yönetici ortaklar ile diğer ortaklar arasındaki ilişki">
          <mvz-b3 no="1" başlık="Genel olarak">
            <mvz-madde no="630" başlık="">
              <mvz-fıkra no="1">
                <template>Kanunun bu bölümünde veya ortaklık sözleşmesinde aksine hüküm bulunmadıkça, yönetici ortaklar ile diğer ortaklar arasındaki ilişkiler, vekâlet sözleşmesine ilişkin hükümlere tabidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ortaklığı yönetme yetkisi bulunmayan bir ortağın, ortaklığın işlerini görmesi veya bu yetkiye sahip ortağın yetkisini aşması hâllerinde, vekâletsiz işgörmeye ilişkin hükümler uygulanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Yönetici ortaklar, yılda en az bir defa hesap vermek ve kazanç paylarını ortaklara ödemekle yükümlüdürler. Hesap döneminin uzatılmasına ilişkin anlaşma kesin olarak hükümsüzdür. Ortaklığı yönetenin ortaklardan birisi olmaması durumunda da aynı kural uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Ortaklık işlerini inceleme">
            <mvz-madde no="631" başlık="">
              <mvz-fıkra no="1">
                <template>Yönetim yetkisi olmasa bile, her ortağın, ortaklığın işleyişi hakkında bilgi alma, defter ve kayıtlarını inceleme, bunlardan örnek alma ve mali durumu hakkında özet çıkarma hakkı vardır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aksine sözleşmeler kesin olarak hükümsüzdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="VIII" başlık="Ortaklar arasındaki ve ortaklık yapısındaki değişiklikler">
          <mvz-b3 no="1" başlık="Yeni ortak alımı ve alt katılım">
            <mvz-madde no="632" başlık="">
              <mvz-fıkra no="1">
                <template>Ortaklığa, yeni bir ortak alınması, bütün ortakların rızasına bağlıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ortaklardan biri tek taraflı olarak bir üçüncü kişiyi ortaklıktaki payına ortak eder veya payını ona devrederse, bu üçüncü kişi ortak sıfatını kazanamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Ortaklıktan çıkma ve çıkarılma">
            <mvz-b4 no="a" başlık="Genel olarak">
              <mvz-madde no="633" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir ortağın fesih bildiriminde bulunması, kısıtlanması, iflası, tasfiyedeki payının cebrî icra yoluyla paraya çevrilmesi veya ölmesi hâlinde, sözleşmede ortaklığın diğer ortaklarla devam edeceğine ilişkin bir hüküm varsa, bu durumlardan biri gerçekleştiğinde, o ortak veya temsilcisi ya da ölen ortağın mirasçısı ortaklıktan çıkabilir veya diğer ortaklar tarafından yazılı olarak yapılacak bir bildirimle ortaklıktan çıkarılabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="b" başlık="Ortaklık payının tasfiyesi">
              <mvz-madde no="634" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir ortağın ortaklıktan çıkması veya çıkarılması durumunda payı, diğer ortaklara payları oranında kendiliğinden geçer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Diğer ortaklar, ortaklıktan çıkan veya çıkarılan ortağa, kullanımını ortaklığa bıraktığı eşyayı geri vermekle yükümlü oldukları gibi, kendisini ortaklığın muaccel borçlarından doğan müteselsil sorumluluktan kurtararak, ortak sıfatının sona erdiği tarihte ortaklık tasfiye edilmiş olsaydı ödenmesi gereken tasfiye payını ödemekle yükümlüdürler. Ortaklığın henüz muaccel olmayan borçları için diğer ortaklar, çıkan veya çıkarılan ortağı borçtan kurtarmak yerine, kendisine bir güvence verebilirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Çıkan veya çıkarılan ortağın tasfiye payı, ortaklık sıfatının sona erdiği tarih itibarıyla, mali işlerde uzman bir kişiye hesaplattırılır. Tarafların uzman kişi üzerinde anlaşamamaları durumunda bu kişi, hâkim tarafından atanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="c" başlık="Malvarlığının yetersizliği">
              <mvz-madde no="635" başlık="">
                <mvz-fıkra no="1">
                  <template>Ortaklık sıfatının sona erdiği tarihte, ortaklığın malvarlığı, borçlarını karşılamaya yetmezse, çıkan veya çıkarılan ortak, payına düşen borç tutarını, zarara katılmaya ilişkin düzenlemeler çerçevesinde diğer ortaklara ödemekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="d" başlık="Tamamlanmamış işler">
              <mvz-madde no="636" başlık="">
                <mvz-fıkra no="1">
                  <template>Çıkan veya çıkarılan ortak, ortak olduğu dönemde henüz sonuçlanmamış işlerden doğan kâra veya zarara katılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ortaklık sıfatı sona eren kişi, o hesap yılı sonu itibarıyla, tamamlanmış olan işler sebebiyle varsa ortaklıktan kendisine düşecek kâr payını; devam eden işler hakkında da gerekli bilgiyi isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
          </mvz-b3>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Ortakların üçüncü kişilerle ilişkisi">
        <mvz-b2 no="I" başlık="Temsil">
          <mvz-madde no="637" başlık="">
            <mvz-fıkra no="1">
              <template>Kendi adına ve ortaklık hesabına bir üçüncü kişi ile işlemde bulunan ortak, bu kişiye karşı bizzat kendisi alacaklı ve borçlu olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ortaklardan biri, ortaklık veya bütün ortaklar adına bir üçüncü kişi ile işlem yaparsa, diğer ortaklar ancak temsile ilişkin hükümler uyarınca, bu kişinin alacaklısı veya borçlusu olurlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kendisine yönetim görevi verilen ortağın, ortaklığı veya bütün ortakları üçüncü kişilere karşı temsil etme yetkisi var sayılır. Ancak, temsil yetkisine sahip yönetici ortağın yapacağı önemli tasarruf işlemlerine ilişkin yetkinin, bütün ortakların oybirliğiyle verilmiş olması ve yetki belgesinde bu hususun açıkça belirtilmiş olması şarttır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Temsilin sonuçları">
          <mvz-madde no="638" başlık="">
            <mvz-fıkra no="1">
              <template>Ortaklık için edinilen veya ortaklığa devredilen şeyler, alacaklar ve ayni haklar, ortaklık sözleşmesi çerçevesinde elbirliği hâlinde bütün ortaklara ait olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ortaklık sözleşmesinde aksine bir hüküm bulunmadıkça, bir ortağın alacaklıları, haklarını ancak o ortağın tasfiyedeki payı üzerinde kullanabilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Ortaklar, birlikte veya bir temsilci aracılığı ile, bir üçüncü kişiye karşı, ortaklık ilişkisi çerçevesinde üstlendikleri borçlardan, aksi kararlaştırılmamışsa müteselsilen sorumlu olurlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="D" başlık="Ortaklığın sona ermesi">
        <mvz-b2 no="I" başlık="Sona erme sebepleri">
          <mvz-b3 no="1" başlık="Genel olarak">
            <mvz-madde no="639" başlık="">
              <mvz-fıkra no="1">
                <template>Ortaklık, aşağıdaki durumlarda sona erer:</template>
                <mvz-bent no="1.">
                  <template>Ortaklık sözleşmesinde öngörülen amacın gerçekleşmesi veya gerçekleşmesinin imkânsız duruma gelmesiyle.</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Sözleşmede ortaklığın mirasçılarla sürdürülmesi konusunda bir hüküm yoksa, ortaklardan birinin ölmesiyle.</template>
                </mvz-bent>
                <mvz-bent no="3.">
                  <template>Sözleşmede ortaklığın devam edeceğine ilişkin bir hüküm yoksa, bir ortağın kısıtlanması, iflası veya tasfiyedeki payının cebrî icra yoluyla paraya çevrilmesiyle.</template>
                </mvz-bent>
                <mvz-bent no="4.">
                  <template>Bütün ortakların oybirliğiyle karar vermesiyle.</template>
                </mvz-bent>
                <mvz-bent no="5.">
                  <template>Ortaklık için kararlaştırılmış olan sürenin bitmesiyle.</template>
                </mvz-bent>
                <mvz-bent no="6.">
                  <template>Ortaklık sözleşmesinde feshi bildirme hakkı saklı tutulmuş veya ortaklık belirsiz bir süre için ya da ortaklardan birinin ömrü boyunca kurulmuşsa, bir ortağın fesih bildiriminde bulunmasıyla.</template>
                </mvz-bent>
                <mvz-bent no="7.">
                  <template>Haklı sebeplerin bulunması hâlinde, her zaman başkaca koşul aranmaksızın, fesih istemi üzerine mahkeme kararıyla.</template>
                </mvz-bent>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Belirsiz süreli ortaklık">
            <mvz-madde no="640" başlık="">
              <mvz-fıkra no="1">
                <template>Ortaklık, belirsiz süre için veya ortaklardan birinin ömrü boyunca sürmek üzere kurulmuşsa, ortaklardan her biri, altı ay önceden fesih bildiriminde bulunabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Fesih bildirimi, dürüstlük kurallarına aykırı olarak ve özellikle uygun olmayan bir zamanda yapılamaz. Fesih bildirimi, ancak hesap yılı sonunda hüküm ifade eder.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Sözleşmede öngörülmüş olan sürenin bitiminden sonra ortaklık, ortakların örtülü iradesiyle sürdürülürse, belirsiz süreli ortaklığa dönüşür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Sona ermenin ortaklığın yönetimine etkisi">
          <mvz-madde no="641" başlık="">
            <mvz-fıkra no="1">
              <template>Ortaklık, fesih bildiriminden başka bir yolla sona ererse, bir ortağın ortaklık işlerini yönetme konusundaki yetkisi, sona ermeyi öğrendiği veya durumun gerektirdiği özeni gösterseydi öğrenebileceği zamana kadar, kendisi hakkında devam eder.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ortaklık, ortaklardan birinin ölümüyle sona ererse, ölen ortağın mirasçısı, durumu hemen diğer ortaklara bildirmekle yükümlüdür. Mirasçı, gerekli önlemler alınıncaya kadar, ölen ortağın daha önce yürütmekte olduğu işlere, dürüstlük kuralları çerçevesinde devam eder. Diğer ortaklar da, geçici olarak, ortaklık işlerini aynı şekilde yürütmeye devam ederler.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Tasfiye">
          <mvz-b3 no="1" başlık="Katılım payı için yapılacak işlem">
            <mvz-madde no="642" başlık="">
              <mvz-fıkra no="1">
                <template>Katılım payı olarak bir şeyin mülkiyetini koyan ortak, ortaklığın sona ermesi üzerine yapılacak tasfiye sonucunda, o şeyi olduğu gibi geri alamaz; ancak koyduğu katılım payına ne değer biçilmişse, o değeri isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu değer belirlenmemişse, geri alma, o şeyin katılım payı olarak konduğu zamandaki değeri üzerinden yapılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Kazanç ve zararın paylaşımı">
            <mvz-madde no="643" başlık="">
              <mvz-fıkra no="1">
                <template>Ortaklığın borçları ödendikten ve ortaklardan her birinin ortaklığa verdiği avanslar ile ortaklık için yaptığı giderler ve koymuş olduğu katılım payı geri verildikten sonra bir şey artarsa, bu kazanç, ortaklar arasında paylaşılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ortaklığın, borçlar, giderler ve avanslar ödendikten sonra kalan varlığı, ortakların koydukları katılım paylarının geri verilmesine yetmezse, zarar ortaklar arasında paylaşılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Tasfiye usulü">
            <mvz-madde no="644" başlık="">
              <mvz-fıkra no="1">
                <template>Ortaklığın sona ermesi hâlinde tasfiye, yönetici olmayan ortaklar da dâhil olmak üzere, bütün ortakların elbirliğiyle yapılır. Ancak, ortaklık sözleşmesinde, ortaklardan biri tarafından kendi adına ve ortaklık hesabına belirli bazı işlemlerin yapılması öngörülmüşse, bu ortak, ortaklığın sona ermesinden sonra da o işlemleri tek başına yapmak ve diğerlerine hesap vermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ortaklar, tasfiye işlerini yürütmek üzere tasfiye görevlisi atayabilirler. Bu konuda anlaşamamaları hâlinde, ortaklardan her biri, tasfiye görevlisinin hâkim tarafından atanması isteminde bulunabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Tasfiye görevlisine ödenecek ücret, sözleşmede buna ilişkin bir hüküm veya ortaklarca oybirliğiyle verilmiş bir karar yoksa tasfiyenin gerektirdiği emek ile ortaklık malvarlığının geliri göz önünde tutularak hâkim tarafından belirlenir ve ortaklık malvarlığından, buna imkân bulunamazsa, ortaklardan müteselsilen karşılanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Tasfiye usulüne veya tasfiye sonucunda her bir ortağa dağıtılacak paya ilişkin olarak doğabilecek uyuşmazlıklar, ilgililerin istemi üzerine hâkim tarafından çözüme bağlanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Üçüncü kişilere karşı sorumluluk">
          <mvz-madde no="645" başlık="">
            <mvz-fıkra no="1">
              <template>Ortaklığın sona ermesi, üçüncü kişilere karşı olan yükümlülükleri değiştirmez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Türk Medenî Kanunu ile ilişkisi</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="646" başlık="">
            <mvz-fıkra no="1">
              <template>Bu Kanun, 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanununun Beşinci Kitabı olup, onun tamamlayıcısıdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yürürlükten kaldırılan Kanun</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="647" başlık="">
            <mvz-fıkra no="1">
              <template>22/4/1926 tarihli ve 818 sayılı Borçlar Kanunu yürürlükten kaldırılmıştır.</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="1" başlık="" tür="GEÇİCİ">
            <mvz-fıkra no="1">
              <template>Konut kiraları bakımından bu maddenin yürürlüğe girdiği tarih ilâ 1/7/2023  tarihleri arasında yenilenen kira dönemlerinde uygulanacak kira bedeline ilişkin anlaşmalar, bir önceki kira yılına ait kira bedelinin yüzde yirmi beşini geçmemek koşuluyla geçerlidir. Bir önceki kira yılının tüketici fiyat endeksindeki oniki aylık ortalamalara göre değişim oranının yüzde yirmi beşin altında kalması halinde değişim oranı geçerlidir. Bu kural, bir yıldan daha uzun süreli kira sözleşmelerinde de uygulanır. Bu oranları geçecek şekilde yapılan sözleşmeler, fazla miktar yönünden geçersizdir. Bu fıkra hükmü, 344 üncü maddenin ikinci fıkrası uyarınca hâkim tarafından verilecek kararlar bakımından da uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
          <mvz-madde no="2" başlık="" tür="GEÇİCİ">
            <mvz-fıkra no="1">
              <template>Konut kiraları bakımından 2/7/2023 ilâ 1/7/2024  tarihleri arasında yenilenen kira dönemlerinde uygulanacak kira bedeline ilişkin anlaşmalar, bir önceki kira yılına ait kira bedelinin yüzde yirmi beşini geçmemek koşuluyla geçerlidir. Bir önceki kira yılının tüketici fiyat endeksindeki oniki aylık ortalamalara göre değişim oranının yüzde yirmi beşin altında kalması halinde değişim oranı geçerlidir. Bu kural, bir yıldan daha uzun süreli kira sözleşmelerinde de uygulanır. Bu oranları geçecek şekilde yapılan sözleşmeler, fazla miktar yönünden geçersizdir. Bu fıkra hükmü, 344 üncü maddenin ikinci fıkrası uyarınca hâkim tarafından verilecek kararlar bakımından da uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
