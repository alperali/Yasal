                  <template>Vekâlet veren, vekilin kendi adına ve vekâlet veren hesabına edinmiş olduğu taşınır eşyanın iflas masasından ayrılarak kendisine verilmesini isteyebilir. Vekilin sahip olduğu hapis hakkından iflas masası da yararlanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Vekâlet verenin borçları">
            <mvz-madde no="510" başlık="">
              <mvz-fıkra no="1">
                <template>Vekâlet veren, vekâletin gereği gibi ifası için vekilin yaptığı giderleri ve verdiği avansları faiziyle birlikte ödemek ve yüklendiği borçlardan onu kurtarmakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vekil, vekâletin ifası sebebiyle uğradığı zararın giderilmesini vekâlet verenden isteyebilir. Ancak vekâlet veren, kusuru bulunmadığını ispat ederek bu sorumluluktan kurtulabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Birlikte vekâlet verenlerin ve birlikte vekillerin sorumluluğu">
            <mvz-madde no="511" başlık="">
              <mvz-fıkra no="1">
                <template>Bir kişiye birlikte vekâlet verenler, vekile karşı müteselsil olarak sorumludurlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vekâleti birlikte üstlenenler, vekâletin ifasından müteselsil olarak sorumludurlar ve yetkilerini başkalarına devir hakları olmadıkça, vekâlet vereni, ancak birlikte yaptıkları fiil ve işlemleriyle borç altına sokabilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Sona ermesi">
          <mvz-b2 no="I" başlık="Sebepleri">
            <mvz-b3 no="1" başlık="Tek taraflı sona erdirme">
              <mvz-madde no="512" başlık="">
                <mvz-fıkra no="1">
                  <template>Vekâlet veren ve vekil, her zaman sözleşmeyi tek taraflı olarak sona erdirebilir. Ancak, uygun olmayan zamanda sözleşmeyi sona erdiren taraf, diğerinin bundan doğan zararını gidermekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Ölüm, ehliyetin kaybedilmesi ve iflas">
              <mvz-madde no="513" başlık="">
                <mvz-fıkra no="1">
                  <template>Sözleşmeden veya işin niteliğinden aksi anlaşılmadıkça sözleşme, vekilin veya vekâlet verenin ölümü, ehliyetini kaybetmesi ya da iflası ile kendiliğinden sona ermiş olur. Bu hüküm, taraflardan birinin tüzel kişi olması durumunda, bu tüzel kişiliğin sona ermesinde de uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vekâletin sona ermesi vekâlet verenin menfaatlerini tehlikeye düşürüyorsa, vekâlet veren veya mirasçısı ya da temsilcisi, işleri kendi başına görebilecek duruma gelinceye kadar, vekil veya mirasçısı ya da temsilcisi, vekâleti ifaya devam etmekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Hükümleri">
            <mvz-madde no="514" başlık="">
              <mvz-fıkra no="1">
                <template>Vekilin sözleşmenin sona erdiğini öğrenmeden önce yaptığı işlerden, vekâlet veren ya da mirasçıları sözleşme devam ediyormuş gibi sorumludur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Kredi Mektubu ve Kredi Emri">
        <mvz-b1 no="A" başlık="Kredi mektubu">
          <mvz-madde no="515" başlık="">
            <mvz-fıkra no="1">
              <template>Kredi mektubu, mektup gönderenin gönderilene bir üst sınır belirleyerek veya belirlemeksizin, kredi mektubundan yararlanacak belirli kişiye istemde bulunacağı miktarda para ve benzeri şeyleri verme konusundaki vekâletini içeren belgedir. Kredi mektubu, vekâlet sözleşmesi ve havale hükümlerine tabidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Üst sınır belirlenmeksizin verilmiş olan kredi mektubunda mektuptan yararlanacak kişi, bu mektupla ilgili olanlar arasındaki ilişkiye açıkça uygun olmayan fazla bir istemde bulunursa mektup gönderilen, durumu gönderene bildirmek ve cevap alıncaya kadar ödemeyi ertelemek zorundadır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kredi mektubuyla verilen vekâlet, ancak gönderilen tarafından belirli bir miktar için kabul edildiği takdirde geçerli olur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Kredi emri">
          <mvz-b2 no="I" başlık="Tanımı ve şekli">
            <mvz-madde no="516" başlık="">
              <mvz-fıkra no="1">
                <template>Bir kimse kendi adına ve hesabına kredi emri verenin sorumluluğu altında bir üçüncü kişiye kredi açmak veya krediyi yenilemek için emir almış ve kabul etmişse, kredi emri verilen vekâletini aşmadıkça emri veren, kredi borcundan kefil gibi sorumlu olur. Ancak, kredi emri yazılı olmadıkça emri veren sorumlu olmaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kredi emrinden yararlananın ehliyetsizliği">
            <mvz-madde no="517" başlık="">
              <mvz-fıkra no="1">
                <template>Kredi emrini veren, kredi emrinden yararlananın ehliyetsizliğini ileri sürerek kredi emri verilene karşı sorumluluktan kurtulamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Kredi emri verilenin önel vermesi">
            <mvz-madde no="518" başlık="">
              <mvz-fıkra no="1">
                <template>Kredi emri verilen, kredi emrinden yararlanana kendiliğinden önel verir veya kendisine talimat verildiği hâlde kredi emrinden yararlanana başvurmayı ihmal ederse, kredi emri veren sorumluluktan kurtulur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Taraflar arasındaki ilişki">
            <mvz-madde no="519" başlık="">
              <mvz-fıkra no="1">
                <template>Kredi emri veren ile kredi emrinden yararlanan arasındaki ilişkiye, kefil ile asıl borçlu arasındaki ilişkiyi düzenleyen hükümler uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Simsarlık Sözleşmesi">
        <mvz-b1 no="A" başlık="Tanımı ve şekli">
          <mvz-madde no="520" başlık="">
            <mvz-fıkra no="1">
              <template>Simsarlık sözleşmesi, simsarın taraflar arasında bir sözleşme kurulması imkânının hazırlanmasını veya kurulmasına aracılık etmeyi üstlendiği ve bu sözleşmenin kurulması hâlinde ücrete hak kazandığı sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Simsarlık sözleşmesine, kural olarak vekâlete ilişkin hükümler uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Taşınmazlar konusundaki simsarlık sözleşmesi, yazılı şekilde yapılmadıkça geçerli olmaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Ücret">
          <mvz-b2 no="I" başlık="Hak etme zamanı">
            <mvz-madde no="521" başlık="">
              <mvz-fıkra no="1">
                <template>Simsar, ancak yaptığı faaliyet sonucunda sözleşme kurulursa ücrete hak kazanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Simsarın faaliyeti sonucunda kurulan sözleşme geciktirici koşula bağlanmışsa ücret, koşulun gerçekleşmesi hâlinde ödenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Simsarlık sözleşmesinde simsarın yapacağı giderlerin kendisine ödeneceği kararlaştırılmışsa, simsarın faaliyeti sözleşmenin kurulmasıyla sonuçlanmamış olsa bile giderleri ödenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Ücretin belirlenmesi">
            <mvz-madde no="522" başlık="">
              <mvz-fıkra no="1">
                <template>Ücret, belirlenmemişse tarifeye, tarife yoksa teamüle göre ödenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Simsarın haklarını kaybetmesi">
            <mvz-madde no="523" başlık="">
              <mvz-fıkra no="1">
                <template>Simsar, üstlendiği borcuna aykırı davranarak diğer tarafın menfaatine hareket eder veya dürüstlük kurallarına aykırı olarak diğer taraftan ücret sözü alırsa, ücrete ve yaptığı giderlere ilişkin haklarını kaybeder.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Evlenme simsarlığı">
            <mvz-madde no="524" başlık="">
              <mvz-fıkra no="1">
                <template>Evlenme simsarlığından doğan ücret hakkında dava açılamaz ve takip yapılamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Ücretten indirim">
            <mvz-madde no="525" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmede aşırı bir ücret kararlaştırılmışsa, borçlunun istemi üzerine, bu ücret hâkim tarafından hakkaniyete uygun olarak indirilebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="10-ONUNCU" başlık="Vekâletsiz İşgörme">
      <mvz-b1 no="A" başlık="İşgörenin hak ve borçları">
        <mvz-b2 no="I" başlık="İşin görülmesi">
          <mvz-madde no="526" başlık="">
            <mvz-fıkra no="1">
              <template>Vekâleti olmaksızın başkasının hesabına işgören, o işi sahibinin menfaatine ve varsayılan iradesine uygun olarak görmekle yükümlüdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Sorumluluk">
          <mvz-madde no="527" başlık="">
            <mvz-fıkra no="1">
              <template>Vekâletsiz işgören, her türlü ihmalinden sorumludur. Ancak, işgören bu işi, işsahibinin karşılaştığı zararı veya zarar tehlikesini gidermek üzere yapmışsa, sorumluluğu daha hafif olarak değerlendirilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İşgören, işsahibinin açıkça veya örtülü olarak yasaklamış olmasına karşın bu işi yapmışsa ve işsahibinin yasaklaması da hukuka veya ahlaka aykırı değilse, beklenmedik hâlden de sorumlu olur. Ancak, işgören o işi yapmamış olsaydı bile, bu zararın beklenmedik hâl sonucunda gerçekleşeceğini ispat ederse sorumluluktan kurtulur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="İşgörenin ehliyetsizliği">
          <mvz-madde no="528" başlık="">
            <mvz-fıkra no="1">
              <template>İşgören, sözleşme ehliyetinden yoksunsa, yaptığı işlemden ancak zenginleştiği ölçüde veya iyiniyetli olmaksızın elinden çıkardığı zenginleşme miktarıyla sorumlu olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Haksız fiillerden doğan daha kapsamlı sorumluluk saklıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="B" başlık="İşsahibinin hak ve borçları">
        <mvz-b2 no="I" başlık="İşin işsahibinin menfaatine yapılması hâlinde">
          <mvz-madde no="529" başlık="">
            <mvz-fıkra no="1">
              <template>İşsahibi, işin kendi menfaatine yapılması hâlinde, işgörenin, durumun gereğine göre zorunlu ve yararlı bulunan bütün masrafları faiziyle ödemek ve gördüğü iş dolayısıyla üstlendiği edimleri ifa etmek ve hâkimin takdir edeceği zararı gidermekle yükümlüdür. Bu hüküm, umulan sonuç gerçekleşmemiş olsa bile, işi yaparken gereken özeni göstermiş olan işgören hakkında da uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İşgören, yapmış olduğu giderleri alamadığı takdirde, sebepsiz zenginleşme hükümlerine göre ayırıp alma hakkına sahiptir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="İşin işgörenin menfaatine yapılması hâlinde">
          <mvz-madde no="530" başlık="">
            <mvz-fıkra no="1">
              <template>İşsahibi, kendi menfaatine yapılmamış olsa bile, işgörmeden doğan faydaları edinme hakkına sahiptir; ancak zenginleştiği ölçüde, işgörenin masraflarını ödemek ve giriştiği borçlardan onu kurtarmakla yükümlüdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="İşin işsahibi tarafından uygun bulunması hâlinde">
          <mvz-madde no="531" başlık="">
            <mvz-fıkra no="1">
              <template>İşsahibi yapılan işi uygun bulmuşsa, vekâlet hükümleri uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="11-ONBİRİNCİ" başlık="Komisyon Sözleşmesi">
      <mvz-b1 no="A" başlık="Alım veya satım komisyonculuğu">
        <mvz-b2 no="I" başlık="Tanımı">
          <mvz-madde no="532" başlık="">
            <mvz-fıkra no="1">
              <template>Alım veya satım komisyonculuğu, komisyoncunun ücret karşılığında, kendi adına ve vekâlet verenin hesabına kıymetli evrak ve taşınırların alım veya satımını üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu bölümdeki hükümler saklı kalmak üzere, komisyon sözleşmelerine vekâlet hükümleri uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Komisyoncunun borçları">
          <mvz-b3 no="1" başlık="Bildirme ve sigortalama borcu">
            <mvz-madde no="533" başlık="">
              <mvz-fıkra no="1">
                <template>Komisyoncu, yaptığı iş hakkında vekâlet vereni bilgilendirmek ve özellikle talimatının yerine getirildiğini kendisine hemen bildirmekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vekâlet verenin talimatı olmadıkça komisyoncu, sözleşmenin konusunu oluşturan şeyleri sigorta ettirmekle yükümlü değildir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Özen borcu">
            <mvz-madde no="534" başlık="">
              <mvz-fıkra no="1">
                <template>Satılmak üzere kendisine gönderilen eşya açıkça ayıplı ise komisyoncu, vekâlet verenin taşıyıcıya karşı haklarının korunması için gerekeni yapmak, zararı tespit ettirmek, olabildiğince eşyayı koruma altına almak ve durumdan vekâlet vereni hemen bilgilendirmekle yükümlüdür; aksi takdirde, her türlü ihmalinden doğan zarardan sorumlu olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Satılmak üzere gönderilen eşya kısa sürede bozulabilecek nitelikte ise komisyoncu, vekâlet vereni hemen bilgilendirmek koşuluyla eşyayı satmakla yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Vekâlet verenin belirlediği bedel">
            <mvz-madde no="535" başlık="">
              <mvz-fıkra no="1">
                <template>Vekâlet verenin belirlediği bedelin altında mal satan komisyoncu, malı satmasaydı vekâlet verenin daha fazla zarar göreceğini ve durumun yeniden talimat almaya elverişli bulunmadığını ispat etmedikçe, belirlenen bedel ile satış bedeli arasındaki farkı gidermekle yükümlüdür. Bunun dışında komisyoncu, kusuru varsa, talimatına aykırı davranmasından dolayı vekâlet verenin uğradığı diğer zararlardan da sorumludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vekâlet verenin belirlediği bedelin altında mal alan veya üstünde satan komisyoncu, bu işlemlerden doğan farkı alıkoyamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="4" başlık="Veresiye satma ve teslim almadan ödeme">
            <mvz-madde no="536" başlık="">
              <mvz-fıkra no="1">
                <template>Komisyoncu, vekâlet verenin izni olmaksızın malı veresiye satar veya malı teslim almadan bedelini öderse, bundan doğan zarara katlanmak zorundadır. Ancak, vekâlet veren yasaklamadıkça, malı satış yerindeki ticari teamüle göre veresiye de satabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="5" başlık="Komisyoncunun garantisi">
            <mvz-madde no="537" başlık="">
              <mvz-fıkra no="1">
                <template>Yetkisi olmaksızın veresiye mal satması dışında, komisyoncu işlemde bulunduğu borçluların ödememelerinden ve diğer borçlarını ifa etmemelerinden sorumlu olmaz. Ancak, komisyoncu açıkça garanti vermişse veya bulunduğu yerdeki ticari teamül gerektiriyorsa sorumlu olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Garanti veren komisyoncunun bundan dolayı ayrıca ücret isteme hakkı vardır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Komisyoncunun hakları">
          <mvz-b3 no="1" başlık="Ödediği paralar ve yaptığı giderler">
            <mvz-madde no="538" başlık="">
              <mvz-fıkra no="1">
                <template>Komisyoncu, vekâlet verenin yararı için yaptığı bütün giderleri ve ödediği paraları faiziyle birlikte isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Komisyoncu, ardiye ve taşıma bedellerini vekâlet verenin hesabına geçirebilirse de, kendi çalışanlarının ücretlerini geçiremez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Komisyon ücreti">
            <mvz-b4 no="a" başlık="İsteme hakkı">
              <mvz-madde no="539" başlık="">
                <mvz-fıkra no="1">
                  <template>Komisyoncu, ücretinin ödenmesini kendisine verilen işi yapınca isteyebileceği gibi, işin yapılmaması vekâlet verene yükletilebilen bir sebepten kaynaklanması hâlinde de isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Komisyoncu, başka sebeplerle işin yapılamaması durumunda, ancak emeğinin yerel âdete göre belirlenecek karşılığını isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="b" başlık="Kaybedilmesi">
              <mvz-madde no="540" başlık="">
                <mvz-fıkra no="1">
                  <template>Komisyoncu, vekâlet verene karşı dürüstlük kurallarına aykırı davranır, özellikle ona satın aldığından fazla veya sattığından eksik bir bedel bildirirse, ücret alma hakkını kaybeder.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bedelin gerçekleşen bedelden farklı gösterilmesi durumunda vekâlet veren, komisyoncuyu gerçekleşen bedel üzerinden satılanın alıcısı veya satıcısı sayma hakkına sahiptir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Hapis hakkı">
            <mvz-madde no="541" başlık="">
              <mvz-fıkra no="1">
                <template>Komisyoncunun, sattığı malın bedeli ve satın aldığı mal üzerinde hapis hakkı vardır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="4" başlık="Malın açık artırmayla satılması">
            <mvz-madde no="542" başlık="">
              <mvz-fıkra no="1">
                <template>Komisyoncuya verilen malın satılamaması veya satış emrinden cayılması durumunda vekâlet veren, malı geri almakta ya da o malla ilgili başka işlem yapmakta aşırı ölçüde gecikirse komisyoncu, malı bulunduğu yer mahkemesinden karar alarak açık artırmayla sattırabilir. Ancak, mal borsada kayıtlıysa veya piyasa fiyatı varsa ya da yapılacak masrafa oranla değeri azsa, hâkim satışın başka bir yolla yapılmasına da karar verebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Malın bulunduğu yerde vekâlet veren ya da temsilcisi hazır bulunmazsa, satış kararı vekâlet veren dinlenmeksizin de verilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Malın hızla değer kaybetmesi hâli dışında, artırmanın yer ve zamanının mahkemece vekâlet verene bildirilmesi zorunludur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="5" başlık="Komisyoncunun kendisiyle işlem yapması">
            <mvz-b4 no="a" başlık="Bedel ve ücret">
              <mvz-madde no="543" başlık="">
                <mvz-fıkra no="1">
                  <template>Borsada kayıtlı veya piyasa fiyatı bulunan kambiyo senetleri veya diğer kıymetli evrakı ya da ticari malları satmaya veya satın almaya yetkili kılınan komisyoncu, vekâlet veren tarafından aksine talimat verilmemişse, satın alacağı mal yerine kendi mallarını satabilir veya satacağı malı kendisi için satın alabilir. Bu hâllerde, komisyoncunun kendisiyle işlem yaptığı andaki değerler esas alınır; komisyoncunun, komisyon işlerinde alışılmış olan ücret ve giderlerini, bu hâllerde bile isteme hakkı vardır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Komisyoncu, bu tür bir işlemin yapıldığını aynı gün vekâlet verene bildirmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Diğer hâllerde satış hükümleri uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="b" başlık="İşlemi kendisiyle yapmış sayılma">
              <mvz-madde no="544" başlık="">
                <mvz-fıkra no="1">
                  <template>Komisyoncu, kendisinin doğrudan doğruya alıcı veya satıcı olabildiği durumlarda, sözleşmenin diğer tarafını göstermeksizin vekâletin yerine getirildiğini vekâlet verene bildirirse, işlemi kendisiyle yapmış sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="c" başlık="İşlemi kendisiyle yapma hakkının düşmesi">
              <mvz-madde no="545" başlık="">
                <mvz-fıkra no="1">
                  <template>Vekâlet verenin vekâleti geri aldığı haberi komisyoncuya ulaştığı anda, komisyoncunun işlemi kendisiyle yapma hakkı düşer. Ancak, bu haber kendisine ulaşmadan önce komisyoncu, işlemin yapıldığı bildirimini göndermişse, bu hüküm uygulanmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
          </mvz-b3>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Diğer komisyon işleri">
        <mvz-madde no="546" başlık="">
          <mvz-fıkra no="1">
            <template>Malzemesi işsahibi tarafından verilmek üzere imal edilecek taşınırlar hakkındaki komisyon işleri, eşya mislî şeylerden olmasa da, alım ve satım komisyonculuğu hükmündedir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Alım ve satım komisyonculuğu sayılmayan işleri, ücret karşılığında kendi adına ve vekâlet verenin hesabına üstlenen alım ve satım komisyoncusu ile komisyon işlerini kendisine meslek edinmeyip arada bir üstlenen tacir hakkında da bu bölüm hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Taşıma işleri komisyonculuğu hakkındaki özel hükümler saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="12-ONİKİNCİ" başlık="Ticari Temsilciler, Ticari Vekiller ve Diğer Tacir Yardımcıları">
      <mvz-b1 no="A" başlık="Ticari temsilci">
        <mvz-b2 no="I" başlık="Tanımı ve yetki verilmesi">
          <mvz-madde no="547" başlık="">
            <mvz-fıkra no="1">
              <template>Ticari temsilci, işletme sahibinin, ticari işletmeyi yönetmek ve işletmeye ilişkin işlemlerde ticaret unvanı altında, ticari temsil yetkisi ile kendisini temsil etmek üzere, açıkça ya da örtülü olarak yetki verdiği kişidir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İşletme sahibi, ticari temsilcilik yetkisi verildiğini ticaret siciline tescil ettirmek zorundadır; ancak ticari işletme sahibinin ticari temsilcinin fiillerinden sorumluluğu, tescilin yapılmış olmasına bağlı değildir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Temsil yetkisinin kapsamı">
          <mvz-madde no="548" başlık="">
            <mvz-fıkra no="1">
              <template>Ticari temsilci, iyiniyetli üçüncü kişilere karşı, işletme sahibi adına kambiyo taahhüdünde bulunmaya ve onun adına işletmenin amacına giren her türlü işlemleri yapmaya yetkili sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ticari temsilci, açıkça yetkili kılınmadıkça, taşınmazları devredemez veya bir hak ile sınırlandıramaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Temsil yetkisinin sınırlandırılması">
          <mvz-madde no="549" başlık="">
            <mvz-fıkra no="1">
              <template>Temsil yetkisi, bir şubenin işleriyle sınırlandırılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Temsil yetkisi, birden çok kişinin birlikte imza atmaları koşuluyla da sınırlandırılabilir. Bu durumda, diğerlerinin katılımı olmaksızın temsilcilerden birinin imza atmış olması, işletme sahibini bağlamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Temsil yetkisine ilişkin yukarıdaki sınırlamalar, ticaret siciline tescil edilmedikçe, iyiniyetli üçüncü kişilere karşı hüküm doğurmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Temsil yetkisine ilişkin diğer sınırlamalar, tescil edilmiş olsalar bile, iyiniyetli üçüncü kişilere karşı ileri sürülemez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Temsil yetkisinin sona ermesi">
          <mvz-madde no="550" başlık="">
            <mvz-fıkra no="1">
              <template>Temsil yetkisinin verildiği ticaret siciline tescil edilmemiş olsa bile, sona erdiği tescil edilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Temsil yetkisinin sona erdiği ticaret siciline tescil ve ilan edilmediği sürece, bu yetki iyiniyetli üçüncü kişiler için geçerliliğini korur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Ticari vekil">
        <mvz-madde no="551" başlık="">
          <mvz-fıkra no="1">
            <template>Ticari vekil, bir ticari işletme sahibinin, kendisine ticari temsilcilik yetkisi vermeksizin, işletmesini yönetmek veya işletmesinin bazı işlerini yürütmek için yetkilendirdiği kişidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu yetki, işletmenin alışılmış bütün işlemlerini kapsar. Ancak, ticari vekil açıkça yetkili kılınmadıkça, ödünç olarak para veya benzerlerini alamaz, kambiyo taahhüdünde bulunamaz, dava açamaz ve açılmış davayı takip edemez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Diğer tacir yardımcıları">
        <mvz-madde no="552" başlık="">
          <mvz-fıkra no="1">
            <template>Toptan, yarı toptan veya perakende satışlarla uğraşan ticari işletmelerin görevli veya hizmetlileri, o ticari işletme içinde, müşterilerin kolaylıkla görebilecekleri bir yerde ve kolayca okuyabilecekleri bir biçimde, yazıyla aksine duyuru yapılmış olmadıkça, aşağıdaki işlemler için yetkilidirler:</template>
            <mvz-bent no="1.">
              <template>Ticari işletmenin alışılmış bütün satış işlemlerini yapmak.</template>
            </mvz-bent>
            <mvz-bent no="2.">
              <template>Yetkili oldukları işlemler hakkında faturaları imzalamak.</template>
            </mvz-bent>
            <mvz-bent no="3.">
              <template>Ticari işletmenin alışılmış işlemlerinden doğan borçların ifa edilmesine veya bunların hiç ya da gereği gibi ifa edilmemesine ilişkin ihtar veya diğer açıklamaları işletme sahibi adına yapmak; bu nitelikteki ihtar veya diğer açıklamaları, özellikle alışılmış işlem dolayısıyla teslim edilmiş mallara ilişkin ayıp bildirimlerini ticari işletme adına kabul etmek.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Toptan, yarı toptan veya perakende satışlarla uğraşan ticari işletmelerin görevli veya hizmetlileri, kendilerine yazıyla yetki verilmiş olmadıkça, işletme dışında ve kasa görevlileri atanmışsa, işletme içinde satış bedellerini isteyip alamazlar. Bu kişiler, satış bedellerini almaya yetkili bulundukları hâllerde, faturaları kapatmaya veya makbuz vermeye de yetkilidirler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="D" başlık="Rekabet yasağı">
        <mvz-madde no="553" başlık="">
          <mvz-fıkra no="1">
            <template>Bir işletmenin bütün işlerini yöneten veya işletme sahibinin hizmetinde bulunan ticari temsilciler, ticari vekiller veya diğer tacir yardımcıları, işletme sahibinin izni olmaksızın, doğrudan doğruya veya dolaylı olarak, kendilerinin ya da bir üçüncü kişinin hesabına işletmenin yaptığı türden bir iş yapamayacakları gibi, kendi hesaplarına bu tür işlemleri üçüncü kişilere de yaptıramazlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Buna aykırı davranırlarsa işletme sahibi, aralarındaki hukuki ilişkiden doğan hakları saklı kalmak kaydıyla, uğradığı zararın giderilmesini isteyebileceği gibi, bunun yerine, ticari temsilcinin, ticari vekilin veya diğer tacir yardımcısının kendi hesabına yaptığı veya üçüncü kişilere yaptırdığı işlerin kendi hesabına yapılmış sayılmasını ve bu işler dolayısıyla aldıkları ücretin verilmesini veya aynı işlerden doğan alacağın devredilmesini isteyebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="E" başlık="Ticari temsilcilerin, ticari vekillerin ve diğer tacir yardımcılarının yetkilerinin sona ermesi">
        <mvz-madde no="554" başlık="">
          <mvz-fıkra no="1">
            <template>İşletme sahibi, ticari temsilcilerin, ticari vekillerin ve diğer tacir yardımcılarının yetkilerini, aralarındaki hizmet, vekâlet, ortaklık ve benzeri sözleşmelerden doğan hakları saklı kalmak koşuluyla, her zaman geri alabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İşletme sahibinin fiil ehliyetini kaybetmesi veya ölümü, ticari temsilcilerin, ticari vekillerin ve diğer tacir yardımcılarının yetkisini sona erdirmez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="13-ONÜÇÜNCÜ" başlık="Havale">
      <mvz-b1 no="A" başlık="Tanımı">
        <mvz-madde no="555" başlık="">
          <mvz-fıkra no="1">
            <template>Havale, havale edenin, kendi hesabına, para, kıymetli evrak ya da diğer bir mislî eşyayı havale alıcısına vermek üzere havale ödeyicisini; bunları kendi adına kabul etmek üzere havale alıcısını yetkili kıldığı bir hukuki işlemdir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Hükümleri">
        <mvz-b2 no="I" başlık="Havale eden ile havale alıcısı arasındaki ilişki">
          <mvz-madde no="556" başlık="">
            <mvz-fıkra no="1">
              <template>Havale, havale edenin havale alıcısına olan borcunun ifası amacıyla yapılıyorsa, bu borç ancak havale ödeyicisinin borcu ifa etmesiyle sona erer.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Havaleyi kabul etmiş olan havale alıcısı, havale ödeyicisine başvurarak havalede belirlenen süre içinde alacağını elde edememişse, bu alacağı, havale edene karşı yeniden ileri sürebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Alacaklı olan havale alıcısı, havaleyi kabul etmek istemezse, durumu borçlu olan havale edene gecikmeksizin bildirmek zorundadır; bildirmezse bundan doğan zararı gidermekle yükümlü olur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Havale ödeyicisinin borcu">
          <mvz-madde no="557" başlık="">
            <mvz-fıkra no="1">
              <template>Havale ödeyicisi, çekince belirtmeksizin havaleyi kabul ettiğini havale alıcısına bildirirse, ifa ile yükümlü olur ve ona karşı, ancak aralarındaki ilişkiden veya havalenin içeriğinden doğan savunmaları ileri sürebilir; havale eden ile kendi arasındaki ilişkiden doğan savunmaları ileri süremez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Havale ödeyicisi, havale edene borçlu ise, borcu havale alıcısına ifa etmesi, havale edene yapacağı ifaya oranla daha fazla yük getirmiyorsa, borcu havale alıcısına ifa etmekle yükümlüdür. Bu durumda, havale eden ile aralarında aksi kararlaştırılmamışsa havale ödeyicisinin, ifadan önce havaleyi kabul ettiğini havale alıcısına açıklamasına gerek yoktur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="İfa edilmeme hâlinde bildirim">
          <mvz-madde no="558" başlık="">
            <mvz-fıkra no="1">
              <template>Havale ödeyicisi, havale alıcısının istemesine karşın ifadan kaçınır veya havale konusunu ifa etmeyeceğini önceden açıklarsa havale alıcısı, durumu gecikmeksizin havale edene bildirmekle yükümlüdür; bildirmezse, bu yüzden havale edenin uğrayacağı zarardan sorumlu olur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Geri alma">
        <mvz-madde no="559" başlık="">
          <mvz-fıkra no="1">
            <template>Havale eden, havale alıcısına verdiği yetkiyi her zaman geri alabilir. Ancak, havale alıcısının yararına, özellikle onun alacağını elde etmesi amacıyla verdiği yetkiyi geri alamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Havale ödeyicisi, havale alıcısına havaleyi kabul ettiğini açıklamadığı sürece havale eden, ona verdiği yetkiyi geri alabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Havale edenin iflası hâlinde, henüz kabul edilmemiş olan havale kendiliğinden sona erer.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="D" başlık="Kıymetli evrak konusunda havale">
        <mvz-madde no="560" başlık="">
          <mvz-fıkra no="1">
            <template>Kıymetli evraka bağlanmış alacağın, hâmile ödenmesi amacıyla yapılan yazılı havaleler hakkında, bu bölüm hükümleri uygulanır. Bu durumda havale ödeyicisi karşısında her hamil, havale alıcısı sayılır. Buna karşılık, havale eden ile havale alıcısı arasındaki ilişkiye özgü haklar, sadece alacağı devreden ile devralan arasında doğmuş olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Çekler ve poliçe benzeri havaleler hakkındaki özel hükümler saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="14-ONDÖRDÜNCÜ" başlık="Saklama Sözleşmeleri">
      <mvz-b1 no="A" başlık="Genel saklama sözleşmesi">
        <mvz-b2 no="I" başlık="Tanımı">
          <mvz-madde no="561" başlık="">
            <mvz-fıkra no="1">
              <template>Saklama sözleşmesi, saklayanın, saklatanın kendisine bıraktığı bir taşınırı güvenli bir yerde koruma altına almayı üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Açıkça öngörüldüğü veya durum ve koşullar gerektirdiği takdirde, saklayan ücret isteyebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Saklatanın borçları">
          <mvz-madde no="562" başlık="">
            <mvz-fıkra no="1">
              <template>Saklatan, sözleşmenin ifasının zorunlu kıldığı bütün masrafları ödemekle yükümlüdür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Saklatan, kendi kusurundan ileri gelmediğini ispat etmedikçe, saklayanın saklamadan doğan zararlarını gidermekle yükümlüdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Saklayanın borçları">
          <mvz-b3 no="1" başlık="Kullanım yasağı">
            <mvz-madde no="563" başlık="">
              <mvz-fıkra no="1">
                <template>Saklayan, saklatanın izni olmadıkça saklananı kullanamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu yasağa aykırı davranırsa, saklatana uygun bir kullanım bedeli ödemekle yükümlü olduğu gibi, kullanmamış olsaydı bile bu zararın doğacağını ispat etmedikçe, beklenmedik hâlden doğacak zararlardan da sorumlu olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Geri verme">
            <mvz-b4 no="a" başlık="Genel olarak">
              <mvz-madde no="564" başlık="">
                <mvz-fıkra no="1">
                  <template>Saklama sözleşmesinde bir süre belirlenmiş olsa bile saklayan, saklatanın her zaman ileri sürebileceği istemi üzerine, saklananı bütün çoğalmalarıyla birlikte geri vermekle yükümlüdür. Ancak saklatan, saklayanın belirlenen süreyi dikkate alarak yapmış olduğu masrafları ödemekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="b" başlık="Özel durumlar">
              <mvz-madde no="565" başlık="">
                <mvz-fıkra no="1">
                  <template>Saklayan, belirlenmiş olan sürenin sona ermesinden önce saklananı geri veremez. Ancak saklayan, öngörülemeyen durumlar dolayısıyla sözleşmenin devamı saklanan için tehlikeli veya kendisi için zararlı olursa, belirlenen sürenin sona ermesinden önce de geri verebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Süre belirlenmemişse, saklayan saklananı her zaman geri verebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Birden çok kişi bir şeyi saklanmak üzere verirse, sözleşmede aksine bir hüküm bulunmadıkça veya hepsinin rızası olmadıkça, saklayan saklananı onlardan birine geri vermekle sorumluluktan kurtulamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="c" başlık="Geri verme yeri">
              <mvz-madde no="566" başlık="">
                <mvz-fıkra no="1">
                  <template>Saklanan, masrafları ve hasarı saklatana ait olmak üzere, korunması gereken yerde geri verilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Saklayanların sorumluluğu">
            <mvz-madde no="567" başlık="">
              <mvz-fıkra no="1">
                <template>Bir şeyi birlikte saklamak üzere alanlar, müteselsilen sorumlu olurlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="4" başlık="Üçüncü kişilerin iddiaları">
            <mvz-madde no="568" başlık="">
              <mvz-fıkra no="1">
                <template>Bir üçüncü kişi, saklanan üzerinde ayni hak iddiasında bulunsa bile, saklanan haczedilmedikçe veya saklayana karşı istihkak davası açılmadıkça saklayan, onu saklatana geri vermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Haciz konulması veya istihkak davası açılması hâlinde saklayan, durumu hemen saklatana bildirmek zorundadır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Güvenilirkişiye bırakma">
          <mvz-madde no="569" başlık="">
            <mvz-fıkra no="1">
              <template>Birden çok kişi, haklarını korumak üzere, hukuki durumu çekişmeli veya belirsiz olan şeyi, bir güvenilirkişiye bırakırlarsa, bu kişi, saklatanların tamamının rızası veya hâkimin kararı olmadıkça, onu hiçbirine geri veremez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Mislî şeylerin saklanması">
        <mvz-madde no="570" başlık="">
          <mvz-fıkra no="1">
            <template>Saklayanın kendisine bırakılan parayı aynen geri vermek zorunda olmaksızın mislen geri vermesi açıkça veya örtülü olarak kararlaştırılmışsa, o paranın yararı ve hasarı kendisine ait olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Paranın mühürsüz ve açık olarak bırakılmış olması, örtülü anlaşma sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Saklayan, saklatan tarafından kendisine açıkça yetki verilmedikçe, saklanan diğer mislî eşya veya kıymetli evrak üzerinde tasarrufta bulunamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Ardiyeciye bırakma">
        <mvz-b2 no="I" başlık="Senet çıkarma">
          <mvz-madde no="571" başlık="">
            <mvz-fıkra no="1">
              <template>Saklamak üzere ticari mal kabul ettiğini açıkça kamuya bildiren ardiyeci, saklatılan malı temsil eden senet çıkarmaya izin verilmesini, yetkili makamdan isteyebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Ardiyecinin saklama borcu">
          <mvz-madde no="572" başlık="">
            <mvz-fıkra no="1">
              <template>Ardiyeci, kendisine bırakılan malları bir komisyoncu gibi özenle saklamak ve mallarda ayrıca önlem alınmasını gerektiren bir değişiklik olursa, durumu imkân ölçüsünde saklatana bildirmekle yükümlüdür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ardiyeci, saklatana, malların durumunu incelemesi ve örnek alması için, alışılmış iş zamanlarında; gerekli koruma önlemlerini alabilmesi için de her zaman izin vermek zorundadır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Bırakılan şeylerin karışması">
          <mvz-madde no="573" başlık="">
            <mvz-fıkra no="1">
              <template>Ardiyeci açıkça yetkili kılınmadıkça, aynı tür ve nitelikteki mislî şeyleri birbirine karıştıramaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yetkiye dayanılarak karıştırılan bu gibi şeyler üzerinde, saklatanlardan her biri, hakkıyla orantılı bir pay isteyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bu durumda ardiyeci, saklatanların birlikte hazır bulunmasına gerek olmaksızın saklatanlardan her birinin payını ayırabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Ardiyecinin hakları">
          <mvz-madde no="574" başlık="">
            <mvz-fıkra no="1">
              <template>Ardiyeci, kararlaştırılmış veya alışılmış olan ardiye ücretini ve saklamadan doğmayan bakım, taşıma ve gümrük gibi bütün giderlerini isteyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bu giderler hemen; ardiye ücreti ise her üç ayda bir ve her hâlde malların tümünün veya bir bölümünün geri alınması sırasında ödenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Ardiyeci, mallara zilyet bulunduğu veya eşyayı temsil eden herhangi bir senet vasıtasıyla onlar üzerinde tasarruf etme yetkisine sahip olduğu sürece, alacakları için bu mallar üzerinde hapis hakkına sahiptir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="V" başlık="Malların geri verilmesi">
          <mvz-madde no="575" başlık="">
            <mvz-fıkra no="1">
              <template>Ardiyeci, ticari malları, genel saklama sözleşmesinde olduğu gibi geri vermekle yükümlüdür. Ancak, saklayanın sözleşmede öngöremeyeceği sebeplerle, süresinden önce geri verme yetkisi bulunduğu durumlarda bile ardiyeci, kararlaştırılmış olan sürenin sonuna kadar malları korumak zorundadır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="D" başlık="Konaklama yeri, garaj, otopark ve benzeri yerleri işletenlere bırakma">
        <mvz-b2 no="I" başlık="Konaklama yeri işletenlerin sorumluluğu">
          <mvz-b3 no="1" başlık="Koşulları ve kapsamı">
            <mvz-madde no="576" başlık="">
              <mvz-fıkra no="1">
                <template>Otel, motel, pansiyon, tatil köyü gibi yerleri işletenler, konaklayanların getirdikleri eşyanın yok olması, zarara uğraması veya çalınmasından sorumludurlar. Ancak işletenler, zararın bizzat konaklayana veya onu ziyarete gelen ya da beraberinde veya hizmetinde bulunan kimseye yükletilebilecek kusurdan, mücbir sebepten ya da eşyanın niteliğinden doğduğunu ispat etmekle, bu sorumluluktan kurtulurlar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu sorumluluk, işletenlere veya çalışanlarına bir kusur yüklenmedikçe, konaklayanlardan her biri için, günlük konaklama ücretinin üç katını aşamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Kıymetli eşya">
            <mvz-madde no="577" başlık="">
              <mvz-fıkra no="1">
                <template>Kıymetli eşya veya oldukça önemli miktarda para veya kıymetli evrak, işletene saklanması için bırakılmamışsa, işleten ancak kendisinin veya çalışanlarının kusuru hâlinde sorumlu olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İşleten, bunları saklamak üzere almış veya almaktan kaçınmışsa, eşyanın tam değerinden sorumludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Konaklayanın kendi yanında saklaması gereken eşya ile para ve benzeri şeyler hakkında, onun diğer eşyasına ilişkin sorumluluk kuralı uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Sorumluluğun kalkması">
            <mvz-madde no="578" başlık="">
              <mvz-fıkra no="1">
                <template>Konaklayan zararını öğrenir öğrenmez işletene bildirmezse, istem hakkını kaybeder.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İşleten böyle bir sorumluluk üstlenmediğini veya sorumluluğu bu Kanunda gösterilmemiş olan bir koşula bağladığını, herhangi bir yolla ilan etse bile, sorumluluktan kurtulamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Garaj, otopark ve benzeri yerleri işletenlerin sorumluluğu">
          <mvz-madde no="579" başlık="">
            <mvz-fıkra no="1">
              <template>Garaj, otopark ve benzeri yerleri işletenler, kendilerine bırakılan veya çalışanlarınca kabul edilen hayvan, at arabası, bunlara ait koşum ve benzeri eşya ile motorlu taşıt ve eklentilerinin yok olmasından, zarara uğramasından veya çalınmasından sorumludurlar. Ancak işletenler, zararın saklatan veya ziyaretçisi ya da beraberinde veya hizmetinde bulunan kimseye yükletilebilecek kusurdan, mücbir sebepten ya da eşyanın niteliğinden doğduğunu ispat etmekle, bu sorumluktan kurtulurlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Ancak, garaj, otopark ve benzeri yerleri işletenlerin sorumluluğu, kendilerine veya çalışanlarına bir kusur yüklenmedikçe, saklananların her biri için alınan günlük saklama ücretinin on katını aşamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>İşleten böyle bir sorumluluk üstlenmediğini veya sorumluluğu bu Kanunda gösterilmemiş olan bir koşula bağladığını, herhangi bir yolla ilan etse bile, sorumluluktan kurtulamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Hapis hakkı">
          <mvz-madde no="580" başlık="">
            <mvz-fıkra no="1">
              <template>İşletenler, kendilerine bırakılan veya konaklama yerlerine, garaj, otopark ve benzeri yerlere konulan eşya veya hayvanlar üzerinde, ücretlerini veya saklama giderlerinden doğan alacaklarını güvenceye almak için hapis hakkına sahiptirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kiraya verenin hapis hakkına ilişkin hükümler, kıyas yoluyla burada da uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="15-ONBEŞİNCİ" başlık="Kefalet Sözleşmesi">
      <mvz-b1 no="A" başlık="Tanımı">
        <mvz-madde no="581" başlık="">
          <mvz-fıkra no="1">
            <template>Kefalet sözleşmesi, kefilin alacaklıya karşı, borçlunun borcunu ifa etmemesinin sonuçlarından kişisel olarak sorumlu olmayı üstlendiği sözleşmedir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Koşulları">
        <mvz-b2 no="I" başlık="Asıl borç">
          <mvz-madde no="582" başlık="">
            <mvz-fıkra no="1">
              <template>Kefalet sözleşmesi, mevcut ve geçerli bir borç için yapılabilir. Ancak, gelecekte doğacak veya koşula bağlı bir borç için de, bu borç doğduğunda veya koşul gerçekleştiğinde hüküm ifade etmek üzere kefalet sözleşmesi kurulabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yanılma veya ehliyetsizlik sebebiyle borçlunun sorumlu olmadığı bir borç için kişisel güvence veren kişi, yükümlülük altına girdiği sırada, sözleşmeyi sakatlayan eksikliği biliyorsa, kefaletle ilgili kanun hükümlerine göre sorumlu olur. Aynı kural, borçlu yönünden zamanaşımına uğramış bir borca kefil olan kişi hakkında da uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kanundan aksi anlaşılmadıkça kefil, bu bölümde kendisine tanınan haklardan önceden feragat edemez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Şekil">
          <mvz-madde no="583" başlık="">
            <mvz-fıkra no="1">
              <template>Kefalet sözleşmesi, yazılı şekilde yapılmadıkça ve kefilin sorumlu olacağı azamî miktar ile kefalet tarihi belirtilmedikçe geçerli olmaz. Kefilin, sorumlu olduğu azamî miktarı, kefalet tarihini ve müteselsil kefil olması durumunda, bu sıfatla veya bu anlama gelen herhangi bir ifadeyle yükümlülük altına girdiğini kefalet sözleşmesinde kendi el yazısıyla belirtmesi şarttır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kendi adına kefil olma konusunda özel yetki verilmesi ve diğer tarafa veya bir üçüncü kişiye kefil olma vaadinde bulunulması da aynı şekil koşullarına bağlıdır. Taraflar, yazılı şekle uyarak kefilin sorumluluğunu borcun belirli bir miktarıyla sınırlandırmayı kararlaştırabilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kefalet sözleşmesinde sonradan yapılan ve kefilin sorumluluğunu artıran değişiklikler, kefalet için öngörülen şekle uyulmadıkça hüküm doğurmaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Eşin rızası">
          <mvz-madde no="584" başlık="">
            <mvz-fıkra no="1">
              <template>Eşlerden biri mahkemece verilmiş bir ayrılık kararı olmadıkça veya yasal olarak ayrı yaşama hakkı doğmadıkça, ancak diğerinin yazılı rızasıyla kefil olabilir; bu rızanın sözleşmenin kurulmasından önce ya da en geç kurulması anında verilmiş olması şarttır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kefalet sözleşmesinde sonradan yapılan ve kefilin sorumlu olacağı miktarın artmasına veya adi kefaletin müteselsil kefalete dönüşmesine ya da kefil yararına olan güvencelerin önemli ölçüde azalmasına sebep olmayan değişiklikler için eşin rızası gerekmez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Ticaret siciline kayıtlı ticari işletmenin sahibi veya ticaret şirketinin ortak ya da yöneticisi tarafından işletme veya şirketle ilgili olarak verilecek kefaletler, mesleki faaliyetleri ile ilgili olarak esnaf ve sanatkârlar siciline kayıtlı esnaf veya sanatkârlar tarafından verilecek kefaletler, 27/12/2006 tarihli ve 5570 sayılı Kamu Sermayeli Bankalar Tarafından Yürütülen Faiz Destekli Kredi Kullandırılmasına Dair Kanun kapsamında kullanılacak kredilerde verilecek kefaletler ile tarım kredi, tarım satış ve esnaf ve sanatkârlar kredi ve kefalet kooperatifleri ile kamu kurum ve kuruluşlarınca kooperatif ortaklarına kullandırılacak kredilerde verilecek kefaletler için eşin rızası aranmaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="C" başlık="İçeriği">
        <mvz-b2 no="I" başlık="Türlerine göre">
          <mvz-b3 no="1" başlık="Adi kefalet">
            <mvz-madde no="585" başlık="">
              <mvz-fıkra no="1">
                <template>Adi kefalette alacaklı, borçluya başvurmadıkça, kefili takip edemez; ancak, aşağıdaki hâllerde doğrudan doğruya kefile başvurabilir:</template>
                <mvz-bent no="1.">
                  <template>Borçlu aleyhine yapılan takibin sonucunda kesin aciz belgesi alınması.</template>
                </mvz-bent>
                <mvz-bent no="2.">
                  <template>Borçlu aleyhine Türkiye’de takibatın imkânsız hâle gelmesi veya önemli ölçüde güçleşmesi.</template>
                </mvz-bent>
                <mvz-bent no="3.">
                  <template>Borçlunun iflasına karar verilmesi.</template>
                </mvz-bent>
                <mvz-bent no="4.">
                  <template>Borçluya konkordato mehli verilmiş olması.</template>
                </mvz-bent>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Alacak, kefaletten önce veya kefalet sırasında rehinle de güvence altına alınmışsa, adi kefalette kefil, alacağın öncelikle rehin konusundan alınmasını isteyebilir. Ancak, borçlunun iflasına veya kendisine konkordato mehli verilmesine karar verilmişse, bu hüküm uygulanmaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Sadece açığın kapatılması için kefil olunmuşsa, borçlu aleyhine yapılan takibin kesin aciz belgesi alınmasıyla sonuçlanması veya borçlu aleyhine Türkiye’de takibatın imkânsız hâle gelmesi ya da konkordatonun kesinleşmesi durumlarında, doğrudan doğruya kefile başvurulabilir. Sözleşmede, bu durumlarda alacaklının, önce asıl borçluya başvurmak zorunda olduğu kararlaştırılabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Müteselsil kefalet">
            <mvz-madde no="586" başlık="">
              <mvz-fıkra no="1">
                <template>Kefil, müteselsil kefil sıfatıyla veya bu anlama gelen herhangi bir ifadeyle yükümlülük altına girmeyi kabul etmişse alacaklı, borçluyu takip etmeden veya taşınmaz rehnini paraya çevirmeden kefili takip edebilir. Ancak, bunun için borçlunun, ifada gecikmesi ve ihtarın sonuçsuz kalması veya açıkça ödeme güçsüzlüğü içinde olması gerekir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Alacak, teslime bağlı taşınır rehni veya alacak rehni ile güvenceye alınmışsa, rehnin paraya çevrilmesinden önce kefile başvurulamaz. Ancak, alacağın rehnin paraya çevrilmesi yoluyla tamamen karşılanamayacağının önceden hâkim tarafından belirlenmesi veya borçlunun iflas etmesi ya da konkordato mehli verilmesi hâllerinde, rehnin paraya çevrilmesinden önce de kefile başvurulabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="Birlikte kefalet">
            <mvz-madde no="587" başlık="">
              <mvz-fıkra no="1">
                <template>Birden çok kişi, aynı borca birlikte kefil oldukları takdirde, her biri kendi payı için adi kefil gibi, diğerlerinin payı için de kefile kefil gibi sorumlu olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Borçluyla birlikte veya kendi aralarında müteselsil kefil olarak yükümlülük altına giren kefillerden her biri, borcun tamamından sorumlu olur. Ancak, bir kefil, kendisiyle birlikte daha önce veya aynı zamanda müteselsilen yükümlü bulunan ve Türkiye’de takip edilebilen bütün kefillere karşı takibe girişilmiş olmadıkça, kendi payından fazlasını ödemekten kaçınabilir. Bir kefil, bu hakkı, diğer kefillerin kendi paylarını ödemiş veya ayni güvence sağlamış olmaları durumunda da kullanabilir. Aksine anlaşmalar saklı kalmak kaydıyla, borcu ödeyen kefil, kendi paylarını daha önce ödememiş olmaları ölçüsünde, diğer kefillere karşı rücu hakkına sahiptir. Bu hak, borçluya rücudan önce de kullanılabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Alacaklı, kefilin aynı alacak için başka kişilerin de kefil olduğunu veya olacağını varsayarak kefalet ettiğini biliyor veya bilmesi gerekiyorsa, bu varsayımın sonradan gerçekleşmemesi veya kefillerden birinin alacaklı tarafından kefalet borcundan kurtarılması ya da kefaletinin hükümsüz olduğuna karar verilmesi durumunda kefil, kefalet borcundan kurtulur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Birbirlerinden bağımsız olarak aynı borç için kefil olanlardan her biri, kefalet borcunun tamamından sorumlu olur. Ancak, borcu ödeyen kefil aksine anlaşma olmadıkça, diğerlerine toplam kefalet miktarındaki payı oranında rücu hakkına sahiptir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="4" başlık="Kefile kefil ve rücua kefil">
            <mvz-madde no="588" başlık="">
              <mvz-fıkra no="1">
                <template>Alacaklıya, kefilin borcu için güvence veren kefile kefil, kefil ile birlikte, adi kefil gibi sorumludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Rücua kefil, kefilin borçludan rücu alacağı için güvence veren kefildir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Ortak hükümler">
          <mvz-b3 no="1" başlık="Kefil ile alacaklı arasındaki ilişki">
            <mvz-b4 no="a" başlık="Sorumluluğun kapsamı">
              <mvz-madde no="589" başlık="">
                <mvz-fıkra no="1">
                  <template>Kefil, her durumda kefalet sözleşmesinde belirtilen azamî miktara kadar sorumludur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Aksi sözleşmede kararlaştırılmamışsa kefil, belirtilen azamî miktarla sınırlı olmak üzere, aşağıdakilerden sorumludur:</template>
                  <mvz-bent no="1.">
                    <template>Asıl borç ile borçlunun kusur veya temerrüdünün yasal sonuçları.</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Alacaklının, kefile, onun borcu ödeyerek yapılmalarını önleyebileceği uygun bir zaman önce bildirmesi koşuluyla, borçluya karşı yönelttiği takip ve davaların masrafları ile gerektiğinde rehinlerin kefile tesliminin ve rehin haklarının devrinin sebep olduğu masraflar.</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>İşlemiş bir yıllık ve işlemekte olan yıla ait akdî faizler ile gerektiğinde tahvil karşılığında ödünç verilen anaparanın işlemiş bir yıllık ve işlemekte olan yıla ait faizleri.</template>
                  </mvz-bent>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Sözleşmede açıkça kararlaştırılmamışsa kefil, borçlunun sadece kefalet sözleşmesinin kurulmasından sonraki borçlarından sorumludur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Kefilin, asıl borç ilişkisinin hükümsüz hâle gelmesinin sebep olduğu zarardan ve ceza koşulundan sorumlu olacağına ilişkin anlaşmalar kesin olarak hükümsüzdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="b" başlık="Kefilin takibi">
              <mvz-madde no="590" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlunun iflası sebebiyle asıl borç daha önce muaccel olsa bile, belirlenen vadeden önce kefile karşı takibat yapılamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bütün kefalet türlerinde kefil, ayni güvence karşılığında hâkimden, mevcut rehinler paraya çevrilinceye ve borçlu aleyhine yapılan takip sonucunda kesin aciz belgesi alınıncaya veya konkordato kararına kadar kendisine karşı yöneltilen takibin durdurulmasına karar verilmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Asıl borcun muaccel olması, alacaklı veya borçlunun önceden süre içeren bildirimde bulunmasına bağlıysa, kefalet borcu için bu süre, bildirimin kefile yapıldığı tarihte işlemeye başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Yerleşim yeri yabancı bir ülkede olan borçlunun borcunu ödemesi, döviz işlemleri veya havale ile ilgili yasaklar gibi sebeplerle, o yabancı ülkenin yasal düzenlemeleri gereği imkânsız hâle gelmiş veya sınırlandırılmışsa, yerleşim yeri Türkiye’de olan kefil, takibe bu sebeple itiraz edebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="c" başlık="Def’iler">
              <mvz-madde no="591" başlık="">
                <mvz-fıkra no="1">
                  <template>Kefil, asıl borçluya veya mirasçılarına ait olan ve asıl borçlunun ödeme güçsüzlüğünden doğmayan bütün def’ileri alacaklıya karşı ileri sürme hakkına sahip olduğu gibi, bunları ileri sürmek zorundadır. Yanılma veya sözleşme yapma ehliyetsizliği ya da zamanaşımına uğramış bir borç sebebiyle borçlunun yükümlü olmadığı bir borca bilerek kefalet hâli bu hükmün dışındadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Asıl borçlu kendisine ait olan bir def’iden vazgeçmiş olsa bile kefil, yine de bu def’iî alacaklıya karşı ileri sürebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kefil, asıl borçluya ait def’ilerin varlığını bilmeksizin ödemede bulunursa, rücu hakkına sahip olur. Buna karşılık asıl borçlu, kefilin bu def’ileri bildiğini veya bilmesi gerektiğini ispat ederse kefil, bunlar ileri sürülmüş olsaydı ödemeden kurtulacağı ölçüde rücu hakkını kaybeder.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Kumar veya bahisten doğan bir borca kefalette kefil, borcun bu niteliğini bilmiş olsa bile, asıl borçlunun sahip olduğu def’ileri ileri sürebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="d" başlık="Özen gösterme, rehin ve borç senetlerinin teslimi">
              <mvz-madde no="592" başlık="">
                <mvz-fıkra no="1">
                  <template>Alacaklı, kefalet sırasında var olan veya daha sonra asıl borçludan alacağın özel güvencesi olmak üzere elde ettiği rehin haklarını, güvenceyi ve rüçhan haklarını kefilin zararına olarak azaltırsa, zararın daha az olduğu alacaklı tarafından ispat edilmedikçe, kefilin sorumluluğu da buna uygun düşen bir miktarda azalır. Kefilin fazladan ödediği miktarın geri verilmesini isteme hakkı saklıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Çalışanlara kefalet hâlinde alacaklı, çalışanlar üzerinde yükümlü olduğu gözetimi ihmal eder veya kendisinden beklenebilen özeni göstermezse ve borç da bu sebeple doğmuş ya da bu özeni göstermesi hâlinde ulaşamayacağı ölçüde artmış olursa, bu borcu veya borcun artan kısmını kefilden isteyemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Alacaklı, borcu ödeyen kefile haklarını kullanmasına yarayabilecek borç senetlerini teslim etmek ve gerekli bilgileri vermekle yükümlüdür. Alacaklı, kefalet sırasında var olan veya asıl borçlu tarafından alacak için sonradan sağlanan rehinleri ve diğer güvenceleri de kefile teslim etmek veya bunların devri için gerekli işlemleri yapmak zorundadır. Alacaklının, diğer alacakları sebebiyle sahip olduğu rehin ve hapis hakları, kefilin haklarından sıraca önce geldikleri ölçüde saklıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Alacaklı, haklı bir sebep olmaksızın yükümlülüklerini yerine getirmez, ağır kusuruyla mevcut belgeleri veya rehinleri ya da sorumlu olduğu diğer güvenceleri elinden çıkarırsa, kefil borcundan kurtulur. Bu durumda kefil, ödediğinin geri verilmesini ve varsa ek zararının giderilmesini isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="e" başlık="Ödemenin kabulünü isteme">
              <mvz-madde no="593" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlunun iflası sebebiyle olsa bile, borç muaccel olduğu takdirde kefil, alacaklıdan yapacağı ödemeyi kabul etmesini her zaman isteyebilir. Bir borca birden çok kişinin kefil olması durumunda alacaklı, kefillerden biri tarafından yapılacak kısmi ödemeyi, bunu öneren kefile düşen paydan az olmamak koşuluyla, kabul etmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacaklı haklı bir sebep olmaksızın ödemeyi kabul etmekten kaçınırsa, kefil borcundan kurtulur; birlikte müteselsil kefalette ise, kefillerin sorumluluğu kendilerine düşen pay miktarınca azalır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Alacaklının rızası varsa kefil, asıl borcu muaccel olmasından önce de ödeyebilir. Ancak, bu durumda kefil, asıl borçluya karşı rücu hakkını borcun muaccel olmasından önce kullanamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="f" başlık="Bildirim, iflasta ve konkordatoda kayıt">
              <mvz-madde no="594" başlık="">
                <mvz-fıkra no="1">
                  <template>Asıl borçlu, anaparanın veya yarım yıllık döneme ait faizin ödenmesinde ya da yıldan yıla yapılması öngörülen anapara ödemelerinde altı ay gecikirse, alacaklının durumu kefile bildirmesi gerekir. İstek hâlinde alacaklı, her zaman asıl borcun kapsamı hakkında kefile bilgi vermek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Asıl borçlunun iflasına karar verilmiş veya borçlu konkordato istemişse alacaklı, alacağını kaydettirmek ve haklarının korunması için gerekeni yapmak zorundadır. Alacaklının, borçlunun iflas ettiğini veya borçluya konkordato mehli verildiğini öğrendiği anda, durumu kefile bildirmesi gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Alacaklı, yukarıdaki fıkralarda öngörülen gereklerden birini yerine getirmezse, bundan dolayı kefilin uğradığı zarar miktarınca ona karşı haklarını kaybeder.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Kefil ile borçlu arasındaki ilişki">
            <mvz-b4 no="a" başlık="Güvence verilmesini ve borçtan kurtarılmasını isteme hakkı">
              <mvz-madde no="595" başlık="">
                <mvz-fıkra no="1">
                  <template>Kefil, aşağıdaki durumlarda asıl borçludan güvence verilmesini ve borç muaccel olmuşsa, borçtan kurtarılmasını isteyebilir:</template>
                  <mvz-bent no="1.">
                    <template>Asıl borçlu, kefile karşı üstlendiği yükümlülüklere, özellikle belli bir süre içinde kendisini borçtan kurtarma vaadine aykırı davranmışsa.</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Asıl borçlu temerrüde düşmüşse veya yerleşim yerini diğer bir ülkeye nakletmesi yüzünden takibat önemli ölçüde güçleşmişse.</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Asıl borçlunun mali durumunun kötüleşmesi, güvencelerin değer kaybetmesi veya borçlunun kusuru sonucunda kefil için mevcut tehlike, kefaletin yapıldığı tarihe göre önemli ölçüde artmışsa.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="b" başlık="Kefilin rücu hakkı">
              <mvz-madde no="596" başlık="">
                <mvz-fıkra no="1">
                  <template>Kefil, alacaklıya ifada bulunduğu ölçüde, onun haklarına halef olur. Kefil, bu hakları asıl borç muaccel olunca kullanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kefil, aksi kararlaştırılmamışsa, rehin hakları ile aynı alacak için sağlanmış diğer güvencelerden sadece kefalet anında var olan veya bizzat asıl borçlu tarafından, sonradan özellikle bu alacak için verilmiş bulunanlara halef olur. Alacaklıya kısmen ifada bulunan kefil, rehin hakkının sadece bunu karşılayan kısmına halef olur. Alacaklının rehin konusu üzerinde geriye kalan alacak hakkı, kefilin rehin hakkından ön sırada gelir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kefil ile asıl borçlu arasındaki hukuki ilişkiden doğan istem ve def’iler saklıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Bir alacağın güvencesini oluşturan rehin paraya çevrildiği veya borç rehin veren malik tarafından ödendiği takdirde malik, kefile karşı rücu hakkını, ancak kefil ile kendisi arasında böyle bir anlaşma varsa ya da rehin sonradan bir üçüncü kişi tarafından verilmişse kullanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="5">
                  <template>Kefilin rücu hakkına ilişkin zamanaşımı, kefilin alacaklıya ifada bulunduğu anda işlemeye başlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="6">
                  <template>Kefil, dava hakkı vermeyen veya yanılma ya da ehliyetsizlik sebebiyle asıl borçluyu bağlamayan bir borç için ödemede bulunduğu takdirde, asıl borçluya karşı rücu hakkına sahip değildir. Ancak, kefil zamanaşımına uğramış bir asıl borçtan sorumlu olmayı borçlunun vekili sıfatıyla üstlenmişse asıl borçlu, ona karşı vekâlet sözleşmesi hükümleri uyarınca sorumlu olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="c" başlık="Kefilin bildirim yükü">
              <mvz-madde no="597" başlık="">
                <mvz-fıkra no="1">
                  <template>Borcu tamamen veya kısmen ödeyen kefil, durumu borçluya bildirmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kefil, bu bildirimde bulunmazsa ve ödemeyi bilmeyen veya bilmesi gerekmeyen borçlu da alacaklıya ifada bulunursa, rücu hakkını kaybeder.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Kefilin, alacaklıya karşı sebepsiz zenginleşmeden doğan dava hakkı saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
          </mvz-b3>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="D" başlık="Sona ermesi">
        <mvz-b2 no="I" başlık="Kanun gereğince">
          <mvz-madde no="598" başlık="">
            <mvz-fıkra no="1">
              <template>Hangi sebeple olursa olsun, asıl borç sona erince, kefil de borcundan kurtulur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Borçlu ve kefil sıfatı aynı kişide birleşmiş olursa, alacaklı için kefaletten doğan özel yararlar saklı kalır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bir gerçek kişi tarafından verilmiş olan her türlü kefalet, buna ilişkin sözleşmenin kurulmasından başlayarak on yılın geçmesiyle kendiliğinden ortadan kalkar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Kefalet, on yıldan fazla bir süre için verilmiş olsa bile, uzatılmış veya yeni bir kefalet verilmiş olmadıkça kefil, ancak on yıllık süre doluncaya kadar takip edilebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Kefalet süresi, en erken kefaletin sona ermesinden bir yıl önce yapılmak kaydıyla, kefilin kefalet sözleşmesinin şekline uygun yazılı açıklamasıyla, azamî on yıllık yeni bir dönem için uzatılabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Kefaletten dönme">
          <mvz-madde no="599" başlık="">
            <mvz-fıkra no="1">
              <template>Gelecekte doğacak bir borca kefalette, borçlunun borcun doğumundan önceki mali durumu, kefalet sözleşmesinin yapılmasından sonra önemli ölçüde bozulmuşsa veya mali durumunun, kefalet sırasında kefilin iyiniyetle varsaydığından çok daha kötü olduğu ortaya çıkmışsa, kefil alacaklıya yazılı bir bildirimde bulunarak, borç doğmadığı sürece her zaman kefalet sözleşmesinden dönebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kefil, alacaklının kefalete güvenmesi sebebiyle uğradığı zararı gidermekle yükümlüdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Süreli kefalette">
          <mvz-madde no="600" başlık="">
            <mvz-fıkra no="1">
              <template>Süreli kefalette kefil, sürenin sonunda borcundan kurtulur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Süreli olmayan kefalette">
          <mvz-madde no="601" başlık="">
            <mvz-fıkra no="1">
              <template>Süreli olmayan kefalette kefil, asıl borç muaccel olunca, adi kefalette her zaman ve müteselsil kefalette ise, kanunun öngördüğü hâllerde, alacaklıdan, bir ay içinde borçluya karşı dava ve takip haklarını kullanmasını, varsa rehnin paraya çevrilmesi yoluyla takibe geçmesini ve ara vermeden takibe devam etmesini isteyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Borç, alacaklının borçluya yapacağı bildirim sonucunda muaccel olacaksa kefil, kefalet sözleşmesinin kurulduğu tarihten bir yıl sonra alacaklıdan, bu bildirimi yapmasını ve borç bu suretle muaccel olunca, yukarıdaki fıkra hükümleri uyarınca takip ve dava haklarını kullanmasını isteyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Alacaklı, kefilin bu istemlerini yerine getirmezse, kefil borcundan kurtulur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="V" başlık="Çalışanlara kefalette">
          <mvz-madde no="602" başlık="">
            <mvz-fıkra no="1">
              <template>Çalışanlara süreli olmayan kefalette kefil, her üç yılda bir, ertesi yılın sonunda geçerli olmak üzere sözleşmeyi feshettiğini bildirebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="E" başlık="Uygulama alanı">
        <mvz-madde no="603" başlık="">
          <mvz-fıkra no="1">
            <template>Kefaletin şekline, kefil olma ehliyetine ve eşin rızasına ilişkin hükümler, gerçek kişilerce, kişisel güvence verilmesine ilişkin olarak başka ad altında yapılan diğer sözleşmelere de uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="16-ONALTINCI" başlık="Kumar ve Bahis">
      <mvz-b1 no="A" başlık="Alacağın dava ve takip edilememesi">
        <mvz-madde no="604" başlık="">
          <mvz-fıkra no="1">
            <template>Kumar ve bahisten doğan alacak hakkında dava açılamaz ve takip yapılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kumar veya bahis için bilerek verilen avanslar ve ödünç paralar ile kumar ve bahis niteliğinde oldukları takdirde, borsada işlem gören malların, yabancı paraların ve kıymetli evrakın fiyat farkı esası üzerine yapılan vadeli satışlar hakkında da aynı hüküm uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Borç senedi verme ve isteyerek ödeme">
        <mvz-madde no="605" başlık="">
          <mvz-fıkra no="1">
            <template>Kumar oynayan veya bahse giren kişi tarafından imzalanmış adi borç veya kambiyo senedi üçüncü bir kişiye devredilmiş olsa bile, hiçbir kimse bunlara dayanarak dava açamaz ve takip yapamaz. Kıymetli evrakın iyiniyetli üçüncü kişilere sağladığı haklar saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kumar ve bahis borcu için isteyerek yapılan ödemeler geri alınamaz. Ancak, kumar veya bahsin usulüne göre yürütülmesi beklenmedik olayla veya diğer tarafın fiiliyle engellenmişse ya da diğer taraf kumar veya bahse hile karıştırmışsa, isteyerek yapılan ödeme geri alınabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Piyango ve diğer şans oyunları">
        <mvz-madde no="606" başlık="">
          <mvz-fıkra no="1">
