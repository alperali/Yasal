<mvz-künye tür="kanun" no="6098" başlık="TÜRK BORÇLAR KANUNU"
             tarih="11/1/2011" rgazete-tarih="4/2/2011" rgazete-sayı="27836"
             düstur-tertip="5" düstur-cilt="50" />  
  
  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Borç İlişkisinin Kaynakları">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Sözleşmeden Doğan Borç İlişkileri">
        <mvz-b1 no="A" başlık="Sözleşmenin kurulması">
          <mvz-b2 no="I" başlık="İrade açıklaması">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="1" başlık="">
                <mvz-fıkra no="1">
                  <template>Sözleşme, tarafların iradelerini karşılıklı ve birbirine uygun olarak açıklamalarıyla kurulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İrade açıklaması, açık veya örtülü olabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İkinci derecedeki noktalar">
              <mvz-madde no="2" başlık="">
                <mvz-fıkra no="1">
                  <template>Taraflar sözleşmenin esaslı noktalarında uyuşmuşlarsa, ikinci derecedeki noktalar üzerinde durulmamış olsa bile, sözleşme kurulmuş sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İkinci derecedeki noktalarda uyuşulamazsa hâkim, uyuşmazlığı işin özelliğine bakarak karara bağlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Sözleşmelerin şekline ilişkin hükümler saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Öneri ve kabul">
            <mvz-b3 no="1" başlık="Süreli öneri">
              <mvz-madde no="3" başlık="">
                <mvz-fıkra no="1">
                  <template>Kabul için süre belirleyerek bir sözleşme yapılmasını öneren, bu sürenin sona ermesine kadar önerisiyle bağlıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kabul bu süre içinde kendisine ulaşmazsa; öneren, önerisiyle bağlılıktan kurtulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Süresiz öneri">
              <mvz-b4 no="a" başlık="Hazır olanlar arasında">
                <mvz-madde no="4" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kabul için süre belirlenmeksizin hazır olan bir kişiye yapılan öneri hemen kabul edilmezse; öneren, önerisiyle bağlılıktan kurtulur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Telefon, bilgisayar gibi iletişim sağlayabilen araçlarla doğrudan iletişim sırasında yapılan öneri, hazır olanlar arasında yapılmış sayılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Hazır olmayanlar arasında">
                <mvz-madde no="5" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kabul için süre belirlenmeksizin hazır olmayan bir kişiye yapılan öneri, zamanında ve usulüne uygun olarak gönderilmiş bir yanıtın ulaşmasının beklenebileceği ana kadar, önereni bağlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Öneren, önerisini zamanında ulaşmış sayabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Zamanında gönderilen kabul, önerene geç ulaşır ve öneren onunla bağlı olmak istemezse, durumu hemen kabul edene bildirmek zorundadır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Örtülü kabul">
              <mvz-madde no="6" başlık="">
                <mvz-fıkra no="1">
                  <template>Öneren, kanun veya işin özelliği ya da durumun gereği açık bir kabulü beklemek zorunda değilse, öneri uygun bir sürede reddedilmediği takdirde, sözleşme kurulmuş sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Ismarlanmayan şeyin gönderilmesi">
              <mvz-madde no="7" başlık="">
                <mvz-fıkra no="1">
                  <template>Ismarlanmamış bir şeyin gönderilmesi öneri sayılmaz. Bu şeyi alan kişi, onu geri göndermek veya saklamakla yükümlü değildir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Bağlayıcı olmayan öneri ve herkese açık öneri">
              <mvz-madde no="8" başlık="">
                <mvz-fıkra no="1">
                  <template>Öneren, önerisi ile bağlı olmama hakkının saklı olduğunu açıkça belirtirse veya işin özelliğinden ya da durumun gereğinden bağlanma niyetinde olmadığı anlaşılırsa, önerisi kendisini bağlamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Fiyatını göstererek mal sergilenmesi veya tarife, fiyat listesi ya da benzerlerinin gönderilmesi, aksi açıkça ve kolaylıkla anlaşılmadıkça öneri sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="6" başlık="İlan yoluyla ödül sözü verme">
              <mvz-madde no="9" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir sonucun gerçekleşmesi karşılığında ödül vereceğini ilan yoluyla duyuran kimse, sözünü yerine getirmekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ödül sözü veren, sonucun gerçekleşmesinden önce sözünden cayarsa veya sonucun gerçekleşmesini engellerse, dürüstlük kurallarına uygun olarak yapılan giderleri ödemekle yükümlüdür. Ancak, bir ya da birden çok kişiye ödenecek giderlerin toplamı, ödülün değerini aşamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Ödül sözü veren, giderlerinin ödenmesini isteyenlerin beklenen sonucu gerçekleştiremeyeceklerini ispat ederse, giderleri ödeme yükümlülüğünden kurtulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="7" başlık="Önerinin ve kabulün geri alınması">
              <mvz-madde no="10" başlık="">
                <mvz-fıkra no="1">
                  <template>Geri alma açıklaması, diğer tarafa öneriden önce veya aynı anda ulaşmış ya da daha sonra ulaşmakla birlikte diğer tarafça öneriden önce öğrenilmiş olursa, öneri yapılmamış sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu kural, kabulün geri alınmasında da uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Hazır olmayanlar arasında kurulan sözleşmenin hüküm anı">
            <mvz-madde no="11" başlık="">
              <mvz-fıkra no="1">
                <template>Hazır olmayanlar arasında kurulan sözleşmeler, kabulün gönderildiği andan başlayarak hüküm doğurur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Açık bir kabulün gerekli olmadığı durumlarda, sözleşme önerinin ulaşma anından başlayarak hüküm doğurur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Sözleşmelerin şekli">
          <mvz-b2 no="I" başlık="Genel kural">
            <mvz-madde no="12" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmelerin geçerliliği, kanunda aksi öngörülmedikçe, hiçbir şekle bağlı değildir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kanunda sözleşmeler için öngörülen şekil, kural olarak geçerlilik şeklidir. Öngörülen şekle uyulmaksızın kurulan sözleşmeler hüküm doğurmaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Yazılı şekil">
            <mvz-b3 no="1" başlık="Yasal şekil">
              <mvz-b4 no="a" başlık="Kapsamı">
                <mvz-madde no="13" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kanunda yazılı şekilde yapılması öngörülen bir sözleşmenin değiştirilmesinde de yazılı şekle uyulması zorunludur. Ancak, sözleşme metniyle çelişmeyen tamamlayıcı yan hükümler bu kuralın dışındadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu kural, yazılı şekil dışındaki geçerlilik şekilleri hakkında da uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Unsurları">
                <mvz-madde no="14" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yazılı şekilde yapılması öngörülen sözleşmelerde borç altına girenlerin imzalarının bulunması zorunludur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Kanunda aksi öngörülmedikçe, imzalı bir mektup, asılları borç altına girenlerce imzalanmış telgraf, teyit edilmiş olmaları kaydıyla faks veya buna benzer iletişim araçları ya da güvenli elektronik imza ile gönderilip saklanabilen metinler de yazılı şekil yerine geçer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="İmza">
                <mvz-madde no="15" başlık="">
                  <mvz-fıkra no="1">
                    <template>İmzanın, borç altına girenin el yazısıyla atılması zorunludur. Güvenli elektronik imza da, el yazısıyla atılmış imzanın bütün hukuki sonuçlarını doğurur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İmzanın el yazısı dışında bir araçla atılması, ancak örf ve âdetçe kabul edilen durumlarda ve özellikle çok sayıda çıkarılan kıymetli evrakın imzalanmasında yeterli sayılır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Görme engellilerin talepleri halinde imzalarında şahit aranır. Aksi takdirde görme engellilerin imzalarını el yazısı ile atmaları yeterlidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="İmza yerine geçen işaretler">
                <mvz-madde no="16" başlık="">
                  <mvz-fıkra no="1">
                    <template>İmza atamayanlar, imza yerine usulüne göre onaylanmış olması koşuluyla, parmak izi, el ile yapılmış bir işaret ya da mühür kullanabilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Kambiyo senetlerine ilişkin hükümler saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İradi şekil">
              <mvz-madde no="17" başlık="">
                <mvz-fıkra no="1">
                  <template>Kanunda şekle bağlanmamış bir sözleşmenin taraflarca belirli bir şekilde yapılması kararlaştırılmışsa, belirlenen şekilde yapılmayan sözleşme tarafları bağlamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Herhangi bir belirleme olmaksızın yazılı şekil kararlaştırılmışsa, yasal yazılı şekle ilişkin hükümler uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Borç tanıması">
          <mvz-madde no="18" başlık="">
            <mvz-fıkra no="1">
              <template>Borcun sebebini içermemiş olsa bile borç tanıması geçerlidir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Sözleşmelerin yorumu, muvazaalı işlemler">
          <mvz-madde no="19" başlık="">
            <mvz-fıkra no="1">
              <template>Bir sözleşmenin türünün ve içeriğinin belirlenmesinde ve yorumlanmasında, tarafların yanlışlıkla veya gerçek amaçlarını gizlemek için kullandıkları sözcüklere bakılmaksızın, gerçek ve ortak iradeleri esas alınır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Borçlu, yazılı bir borç tanımasına güvenerek alacağı kazanmış olan üçüncü kişiye karşı, bu işlemin muvazaalı olduğu savunmasında bulunamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Genel işlem koşulları">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="20" başlık="">
              <mvz-fıkra no="1">
                <template>Genel işlem koşulları, bir sözleşme yapılırken düzenleyenin, ileride çok sayıdaki benzer sözleşmede kullanmak amacıyla, önceden, tek başına hazırlayarak karşı tarafa sunduğu sözleşme hükümleridir. Bu koşulların, sözleşme metninde veya ekinde yer alması, kapsamı, yazı türü ve şekli, nitelendirmede önem taşımaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aynı amaçla düzenlenen sözleşmelerin metinlerinin özdeş olmaması, bu sözleşmelerin içerdiği hükümlerin, genel işlem koşulu sayılmasını engellemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Genel işlem koşulları içeren sözleşmeye veya ayrı bir sözleşmeye konulan bu koşulların her birinin tartışılarak kabul edildiğine ilişkin kayıtlar, tek başına, onları genel işlem koşulu olmaktan çıkarmaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Genel işlem koşullarıyla ilgili hükümler, sundukları hizmetleri kanun veya yetkili makamlar tarafından verilen izinle yürütmekte olan kişi ve kuruluşların hazırladıkları sözleşmelere de, niteliklerine bakılmaksızın uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kapsamı">
            <mvz-b3 no="1" başlık="Yazılmamış sayılma">
              <mvz-madde no="21" başlık="">
                <mvz-fıkra no="1">
                  <template>Karşı tarafın menfaatine aykırı genel işlem koşullarının sözleşmenin kapsamına girmesi, sözleşmenin yapılması sırasında düzenleyenin karşı tarafa, bu koşulların varlığı hakkında açıkça bilgi verip, bunların içeriğini öğrenme imkânı sağlamasına ve karşı tarafın da bu koşulları kabul etmesine bağlıdır. Aksi takdirde, genel işlem koşulları yazılmamış sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Sözleşmenin niteliğine ve işin özelliğine yabancı olan genel işlem koşulları da yazılmamış sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yazılmamış sayılmanın sözleşmeye etkisi">
              <mvz-madde no="22" başlık="">
                <mvz-fıkra no="1">
                  <template>Sözleşmenin yazılmamış sayılan genel işlem koşulları dışındaki hükümleri geçerliliğini korur. Bu durumda düzenleyen, yazılmamış sayılan koşullar olmasaydı diğer hükümlerle sözleşmeyi yapmayacak olduğunu ileri süremez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Yorumlanması">
            <mvz-madde no="23" başlık="">
              <mvz-fıkra no="1">
                <template>Genel işlem koşullarında yer alan bir hüküm, açık ve anlaşılır değilse veya birden çok anlama geliyorsa, düzenleyenin aleyhine ve karşı tarafın lehine yorumlanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Değiştirme yasağı">
            <mvz-madde no="24" başlık="">
              <mvz-fıkra no="1">
                <template>Genel işlem koşullarının bulunduğu bir sözleşmede veya ayrı bir sözleşmede yer alan ve düzenleyene tek yanlı olarak karşı taraf aleyhine genel işlem koşulları içeren sözleşmenin bir hükmünü değiştirme ya da yeni düzenleme getirme yetkisi veren kayıtlar yazılmamış sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="İçerik denetimi">
            <mvz-madde no="25" başlık="">
              <mvz-fıkra no="1">
                <template>Genel işlem koşullarına, dürüstlük kurallarına aykırı olarak, karşı tarafın aleyhine veya onun durumunu ağırlaştırıcı nitelikte hükümler konulamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Sözleşmenin içeriği">
          <mvz-b2 no="I" başlık="Sözleşme özgürlüğü">
            <mvz-madde no="26" başlık="">
              <mvz-fıkra no="1">
                <template>Taraflar, bir sözleşmenin içeriğini kanunda öngörülen sınırlar içinde özgürce belirleyebilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kesin hükümsüzlük">
            <mvz-madde no="27" başlık="">
              <mvz-fıkra no="1">
                <template>Kanunun emredici hükümlerine, ahlaka, kamu düzenine, kişilik haklarına aykırı veya konusu imkânsız olan sözleşmeler kesin olarak hükümsüzdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Sözleşmenin içerdiği hükümlerden bir kısmının hükümsüz olması, diğerlerinin geçerliliğini etkilemez. Ancak, bu hükümler olmaksızın sözleşmenin yapılmayacağı açıkça anlaşılırsa, sözleşmenin tamamı kesin olarak hükümsüz olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Aşırı yararlanma">
            <mvz-madde no="28" başlık="">
              <mvz-fıkra no="1">
                <template>Bir sözleşmede karşılıklı edimler arasında açık bir oransızlık varsa, bu oransızlık, zarar görenin zor durumda kalmasından veya düşüncesizliğinden ya da deneyimsizliğinden yararlanılmak suretiyle gerçekleştirildiği takdirde, zarar gören, durumun özelliğine göre ya sözleşme ile bağlı olmadığını diğer tarafa bildirerek ediminin geri verilmesini ya da sözleşmeye bağlı kalarak edimler arasındaki oransızlığın giderilmesini isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zarar gören bu hakkını, düşüncesizlik veya deneyimsizliğini öğrendiği; zor durumda kalmada ise, bu durumun ortadan kalktığı tarihten başlayarak bir yıl ve her hâlde sözleşmenin kurulduğu tarihten başlayarak beş yıl içinde kullanabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Önsözleşme">
            <mvz-madde no="29" başlık="">
              <mvz-fıkra no="1">
                <template>Bir sözleşmenin ileride kurulmasına ilişkin sözleşmeler geçerlidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Kanunlarda öngörülen istisnalar dışında, önsözleşmenin geçerliliği, ileride kurulacak sözleşmenin şekline bağlıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="G" başlık="İrade bozuklukları">
          <mvz-b2 no="I" başlık="Yanılma">
            <mvz-b3 no="1" başlık="Yanılmanın hükümleri">
              <mvz-madde no="30" başlık="">
                <mvz-fıkra no="1">
                  <template>Sözleşme kurulurken esaslı yanılmaya düşen taraf, sözleşme ile bağlı olmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yanılma hâlleri">
              <mvz-b4 no="a" başlık="Açıklamada yanılma">
                <mvz-madde no="31" başlık="">
                  <mvz-fıkra no="1">
                    <template>Özellikle aşağıda sayılan yanılma hâlleri esaslıdır:</template>
                    <mvz-bent no="1.">
                      <template>Yanılan, kurulmasını istediği sözleşmeden başka bir sözleşme için iradesini açıklamışsa.</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Yanılan, istediğinden başka bir konu için iradesini açıklamışsa.</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Yanılan, sözleşme yapma iradesini, gerçekte sözleşme yapmak istediği kişiden başkasına açıklamışsa.</template>
                    </mvz-bent>
                    <mvz-bent no="4.">
                      <template>Yanılan, sözleşmeyi yaparken belirli nitelikleri olan bir kişiyi dikkate almasına karşın başka bir kişi için iradesini açıklamışsa.</template>
                    </mvz-bent>
                    <mvz-bent no="5.">
                      <template>Yanılan, gerçekte üstlenmek istediğinden önemli ölçüde fazla bir edim için veya gerçekte istediğinden önemli ölçüde az bir karşı edim için iradesini açıklamışsa.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Basit hesap yanlışlıkları sözleşmenin geçerliliğini etkilemez; bunların düzeltilmesi ile yetinilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Saikte yanılma">
                <mvz-madde no="32" başlık="">
                  <mvz-fıkra no="1">
                    <template>Saikte yanılma, esaslı yanılma sayılmaz. Yanılanın, yanıldığı saiki sözleşmenin temeli sayması ve bunun da iş ilişkilerinde geçerli dürüstlük kurallarına uygun olması hâlinde yanılma esaslı sayılır. Ancak bu durumun karşı tarafça da bilinebilir olması gerekir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="İletmede yanılma">
                <mvz-madde no="33" başlık="">
                  <mvz-fıkra no="1">
                    <template>Sözleşmenin kurulmasına yönelik iradenin haberci veya çevirmen gibi bir aracı ya da bir araç tarafından yanlış iletilmiş olması hâlinde de yanılma hükümleri uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Yanılmada dürüstlük kuralları">
              <mvz-madde no="34" başlık="">
                <mvz-fıkra no="1">
                  <template>Yanılan, yanıldığını dürüstlük kurallarına aykırı olarak ileri süremez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Özellikle diğer tarafın, sözleşmenin yanılanın kasdettiği anlamda kurulmasına razı olduğunu bildirmesi durumunda, sözleşme bu anlamda kurulmuş sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Yanılmada kusur">
              <mvz-madde no="35" başlık="">
                <mvz-fıkra no="1">
                  <template>Yanılan, yanılmasında kusurlu ise, sözleşmenin hükümsüzlüğünden doğan zararı gidermekle yükümlüdür. Ancak, diğer taraf yanılmayı biliyor veya bilmesi gerekiyorsa, tazminat istenemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hâkim, hakkaniyetin gerektirdiği durumlarda, ifadan beklenen yararı aşmamak kaydıyla, daha fazla tazminata hükmedebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Aldatma">
            <mvz-madde no="36" başlık="">
              <mvz-fıkra no="1">
                <template>Taraflardan biri, diğerinin aldatması sonucu bir sözleşme yapmışsa, yanılması esaslı olmasa bile, sözleşmeyle bağlı değildir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Üçüncü bir kişinin aldatması sonucu bir sözleşme yapan taraf, sözleşmenin yapıldığı sırada karşı tarafın aldatmayı bilmesi veya bilecek durumda olması hâlinde, sözleşmeyle bağlı değildir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Korkutma">
            <mvz-b3 no="1" başlık="Hükmü">
              <mvz-madde no="37" başlık="">
                <mvz-fıkra no="1">
                  <template>Taraflardan biri, diğerinin veya üçüncü bir kişinin korkutması sonucu bir sözleşme yapmışsa, sözleşmeyle bağlı değildir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Korkutan bir üçüncü kişi olup da diğer taraf korkutmayı bilmiyorsa veya bilecek durumda değilse, sözleşmeyle bağlı kalmak istemeyen korkutulan, hakkaniyet gerektiriyorsa, diğer tarafa tazminat ödemekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Koşulları">
              <mvz-madde no="38" başlık="">
                <mvz-fıkra no="1">
                  <template>Korkutulan, içinde bulunduğu durum bakımından kendisinin veya yakınlarından birinin kişilik haklarına ya da malvarlığına yönelik ağır ve yakın bir zarar tehlikesinin doğduğuna inanmakta haklı ise, korkutma gerçekleşmiş sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bir hakkın veya kanundan doğan bir yetkinin kullanılacağı korkutmasıyla sözleşme yapıldığında, bu hakkı veya yetkiyi kullanacağını açıklayanın, diğer tarafın zor durumda kalmasından aşırı bir menfaat sağlamış olması hâlinde, korkutmanın varlığı kabul edilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="İrade bozukluğunun giderilmesi">
            <mvz-madde no="39" başlık="">
              <mvz-fıkra no="1">
                <template>Yanılma veya aldatma sebebiyle ya da korkutulma sonucunda sözleşme yapan taraf, yanılma veya aldatmayı öğrendiği ya da korkutmanın etkisinin ortadan kalktığı andan başlayarak bir yıl içinde sözleşme ile bağlı olmadığını bildirmez veya verdiği şeyi geri istemezse, sözleşmeyi onamış sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aldatma veya korkutmadan dolayı bağlayıcılığı olmayan bir sözleşmenin onanmış sayılması, tazminat hakkını ortadan kaldırmaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="H" başlık="Temsil">
          <mvz-b2 no="I" başlık="Yetkili temsil">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-b4 no="a" başlık="Temsilin hükmü">
                <mvz-madde no="40" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yetkili bir temsilci tarafından bir başkası adına ve hesabına yapılan hukuki işlemin sonuçları, doğrudan doğruya temsil olunanı bağlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Temsilci, hukuki işlemi yaparken bu sıfatını bildirmezse, hukuki işlemin sonuçları kendisine ait olur. Ancak, karşı taraf bir temsil ilişkisinin varlığını durumdan çıkarıyor veya çıkarması gerekiyor ya da hukuki işlemi temsilci veya temsil olunandan biri ile yapması farksız ise, hukuki işlemin sonuçları doğrudan doğruya temsil olunana ait olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Diğer durumlarda alacağın devri veya borcun üstlenilmesine ilişkin hükümler uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Temsil yetkisinin içeriği ve derecesi">
                <mvz-madde no="41" başlık="">
                  <mvz-fıkra no="1">
                    <template>Başkası adına ve hesabına temsil kamu hukukundan doğmuşsa, temsil yetkisinin içeriği ve derecesi bu konudaki yasal hükümlere; temsil hukuksal bir işlemden doğmuşsa, temsil yetkisinin içeriği ve derecesi o hukuksal işleme göre belirlenir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Temsil yetkisi üçüncü kişilere bildirilmişse temsil yetkisinin içeriği ve derecesi, bu bildirime göre belirlenir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Hukuki işlemden doğan yetki">
              <mvz-b4 no="a" başlık="Yetkinin sınırlanması ve geri alınması">
                <mvz-madde no="42" başlık="">
                  <mvz-fıkra no="1">
                    <template>Temsil olunan, hukuki bir işlemden doğan temsil yetkisini her zaman sınırlayabilir veya geri alabilir. Ancak, taraflar arasındaki hizmet, vekâlet veya ortaklık sözleşmeleri gibi hukuki ilişkilerden doğabilecek haklar saklıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Temsil olunan, bu hakkından önceden feragat edemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Temsil olunan verdiği yetkiyi üçüncü kişilere açıkça veya dolaylı biçimde bildirmişse, bu yetkiyi tamamen veya kısmen geri aldığını onlara bildirmediği takdirde, yetkinin geri alındığını iyiniyetli üçüncü kişilere karşı ileri süremez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Ölüm, ehliyetsizlik ve diğer durumlar">
                <mvz-madde no="43" başlık="">
                  <mvz-fıkra no="1">
                    <template>Hukuki işlemden doğan temsil yetkisi, aksi taraflarca kararlaştırılmadıkça veya işin özelliğinden anlaşılmadıkça, temsil olunanın veya temsilcinin ölümü, gaipliğine karar verilmesi, fiil ehliyetini kaybetmesi veya iflas etmesi durumlarında sona erer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu hüküm, bir tüzel kişiliğin sona ermesi durumunda da uygulanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Tarafların karşılıklı kişisel hakları saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Yetki belgesinin geri verilmesi">
                <mvz-madde no="44" başlık="">
                  <mvz-fıkra no="1">
                    <template>Temsilciye yetki belgesi verilmişse, yetkinin sona ermesi durumunda temsilci, bu belgeyi temsil olunana geri vermekle veya hâkimin belirleyeceği yere bırakmakla yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Temsil olunan veya halefleri, temsilcinin belgeyi geri vermesi için gerekeni yapmazlarsa, bundan dolayı iyiniyetli üçüncü kişilerin zararını gidermekle yükümlüdürler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Yetkinin sona erdiğinin ileri sürülememesi">
                <mvz-madde no="45" başlık="">
                  <mvz-fıkra no="1">
                    <template>Temsilci, yetkisinin sona ermiş olduğunu bilmediği sürece, temsil olunan veya halefleri, temsilcinin yapmış olduğu hukuki işlemlerin sonuçlarıyla bağlıdırlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu kural, üçüncü kişilerin yetkinin sona ermiş olduğunu bildikleri durumlarda uygulanmaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Yetkisiz temsil">
            <mvz-b3 no="1" başlık="Onama hâlinde">
              <mvz-madde no="46" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir kimse yetkisi olmadığı hâlde temsilci olarak bir hukuki işlem yaparsa, bu işlem ancak onadığı takdirde temsil olunanı bağlar.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yetkisiz temsilcinin kendisiyle işlem yaptığı diğer taraf, temsil olunandan, uygun bir süre içinde bu hukuki işlemi onayıp onamayacağını bildirmesini isteyebilir. Bu süre içinde işlemin onanmaması durumunda, diğer taraf bu işlemle bağlı olmaktan kurtulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Onamama hâlinde">
              <mvz-madde no="47" başlık="">
                <mvz-fıkra no="1">
                  <template>Temsil olunanın açık veya örtülü olarak hukuki işlemi onamaması hâlinde, bu işlemin geçersiz olmasından doğan zararın giderilmesi, yetkisiz temsilciden istenebilir. Ancak, yetkisiz temsilci, işlemin yapıldığı sırada karşı tarafın, kendisinin yetkisiz olduğunu bildiğini veya bilmesi gerektiğini ispat ederse, kendisinden zararın giderilmesi istenemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hakkaniyet gerektiriyorsa, kusurlu yetkisiz temsilciden diğer zararların giderilmesi de istenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Sebepsiz zenginleşmeden doğan haklar saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Saklı hükümler">
            <mvz-madde no="48" başlık="">
              <mvz-fıkra no="1">
                <template>Ortaklık temsilcileri ile organlarının ve ticari vekillerin yetkisine ilişkin hükümler saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Haksız Fiillerden Doğan Borç İlişkileri">
        <mvz-b1 no="A" başlık="Sorumluluk">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="49" başlık="">
              <mvz-fıkra no="1">
                <template>Kusurlu ve hukuka aykırı bir fiille başkasına zarar veren, bu zararı gidermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zarar verici fiili yasaklayan bir hukuk kuralı bulunmasa bile, ahlaka aykırı bir fiille başkasına kasten zarar veren de, bu zararı gidermekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Zararın ve kusurun ispatı">
            <mvz-madde no="50" başlık="">
              <mvz-fıkra no="1">
                <template>Zarar gören, zararını ve zarar verenin kusurunu ispat yükü altındadır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Uğranılan zararın miktarı tam olarak ispat edilemiyorsa hâkim, olayların olağan akışını ve zarar görenin aldığı önlemleri göz önünde tutarak, zararın miktarını hakkaniyete uygun olarak belirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Tazminat">
            <mvz-b3 no="1" başlık="Belirlenmesi">
              <mvz-madde no="51" başlık="">
                <mvz-fıkra no="1">
                  <template>Hâkim, tazminatın kapsamını ve ödenme biçimini, durumun gereğini ve özellikle kusurun ağırlığını göz önüne alarak belirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Tazminatın irat biçiminde ödenmesine hükmedilirse, borçlu güvence göstermekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İndirilmesi">
              <mvz-madde no="52" başlık="">
                <mvz-fıkra no="1">
                  <template>Zarar gören, zararı doğuran fiile razı olmuş veya zararın doğmasında ya da artmasında etkili olmuş yahut tazminat yükümlüsünün durumunu ağırlaştırmış ise hâkim, tazminatı indirebilir veya tamamen kaldırabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Zarara hafif kusuruyla sebep olan tazminat yükümlüsü, tazminatı ödediğinde yoksulluğa düşecek olur ve hakkaniyet de gerektirirse hâkim, tazminatı indirebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Özel durumlar">
            <mvz-b3 no="1" başlık="Ölüm ve bedensel zarar">
              <mvz-b4 no="a" başlık="Ölüm">
                <mvz-madde no="53" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ölüm hâlinde uğranılan zararlar özellikle şunlardır:</template>
                    <mvz-bent no="1.">
                      <template>Cenaze giderleri.</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Ölüm hemen gerçekleşmemişse tedavi giderleri ile çalışma gücünün azalmasından ya da yitirilmesinden doğan kayıplar.</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Ölenin desteğinden yoksun kalan kişilerin bu sebeple uğradıkları kayıplar.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Bedensel zarar">
                <mvz-madde no="54" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bedensel zararlar özellikle şunlardır:</template>
                    <mvz-bent no="1.">
                      <template>Tedavi giderleri.</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Kazanç kaybı.</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Çalışma gücünün azalmasından ya da yitirilmesinden doğan kayıplar.</template>
                    </mvz-bent>
                    <mvz-bent no="4.">
                      <template>Ekonomik geleceğin sarsılmasından doğan kayıplar.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Belirlenmesi">
                <mvz-madde no="55" başlık="">
                  <mvz-fıkra no="1">
                    <template>Destekten yoksun kalma zararları ile bedensel zararlar, bu Kanun hükümlerine ve sorumluluk hukuku ilkelerine göre hesaplanır. Kısmen veya tamamen rücu edilemeyen sosyal güvenlik ödemeleri ile ifa amacını taşımayan ödemeler, bu tür zararların belirlenmesinde gözetilemez; zarar veya tazminattan indirilemez. Hesaplanan tazminat, miktar esas alınarak hakkaniyet düşüncesi ile artırılamaz veya azaltılamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu Kanun hükümleri, her türlü idari eylem ve işlemler ile idarenin sorumlu olduğu diğer sebeplerin yol açtığı vücut bütünlüğünün kısmen veya tamamen yitirilmesine ya da kişinin ölümüne bağlı zararlara ilişkin istem ve davalarda da uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Manevi tazminat">
                <mvz-madde no="56" başlık="">
                  <mvz-fıkra no="1">
                    <template>Hâkim, bir kimsenin bedensel bütünlüğünün zedelenmesi durumunda, olayın özelliklerini göz önünde tutarak, zarar görene uygun bir miktar paranın manevi tazminat olarak ödenmesine karar verebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ağır bedensel zarar veya ölüm hâlinde, zarar görenin veya ölenin yakınlarına da manevi tazminat olarak uygun bir miktar paranın ödenmesine karar verilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Haksız rekabet">
              <mvz-madde no="57" başlık="">
                <mvz-fıkra no="1">
                  <template>Gerçek olmayan haberlerin yayılması veya bu tür ilanların yapılması ya da dürüstlük kurallarına aykırı diğer davranışlarda bulunulması yüzünden müşterileri azalan veya onları kaybetme tehlikesiyle karşılaşan kişi, bu davranışlara son verilmesini ve kusurun varlığı hâlinde zararının giderilmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ticari işlere ait haksız rekabet hakkında Türk Ticaret Kanunu hükümleri saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Kişilik hakkının zedelenmesi">
              <mvz-madde no="58" başlık="">
                <mvz-fıkra no="1">
                  <template>Kişilik hakkının zedelenmesinden zarar gören, uğradığı manevi zarara karşılık manevi tazminat adı altında bir miktar para ödenmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hâkim, bu tazminatın ödenmesi yerine, diğer bir giderim biçimi kararlaştırabilir veya bu tazminata ekleyebilir; özellikle saldırıyı kınayan bir karar verebilir ve bu kararın yayımlanmasına hükmedebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Ayırt etme gücünün geçici kaybı">
              <mvz-madde no="59" başlık="">
                <mvz-fıkra no="1">
                  <template>Ayırt etme gücünü geçici olarak kaybeden kişi, bu sırada verdiği zararları gidermekle yükümlüdür. Ancak, ayırt etme gücünü kaybetmede kusuru olmadığını ispat ederse, sorumluluktan kurtulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Sorumluluk sebeplerinin çokluğu">
            <mvz-b3 no="1" başlık="Sebeplerin yarışması">
              <mvz-madde no="60" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir kişinin sorumluluğu, birden çok sebebe dayandırılabiliyorsa hâkim, zarar gören aksini istemiş olmadıkça veya kanunda aksi öngörülmedikçe, zarar görene en iyi giderim imkânı sağlayan sorumluluk sebebine göre karar verir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Müteselsil sorumluluk">
              <mvz-b4 no="a" başlık="Dış ilişkide">
                <mvz-madde no="61" başlık="">
                  <mvz-fıkra no="1">
                    <template>Birden çok kişi birlikte bir zarara sebebiyet verdikleri veya aynı zarardan çeşitli sebeplerden dolayı sorumlu oldukları takdirde, haklarında müteselsil sorumluluğa ilişkin hükümler uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="İç ilişkide">
                <mvz-madde no="62" başlık="">
                  <mvz-fıkra no="1">
                    <template>Tazminatın aynı zarardan sorumlu müteselsil borçlular arasında paylaştırılmasında, bütün durum ve koşullar, özellikle onlardan her birine yüklenebilecek kusurun ağırlığı ve yarattıkları tehlikenin yoğunluğu göz önünde tutulur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tazminatın kendi payına düşeninden fazlasını ödeyen kişi, bu fazla ödemesi için, diğer müteselsil sorumlulara karşı rücu hakkına sahip ve zarar görenin haklarına halef olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="VI" başlık="Hukuka aykırılığı kaldıran hâller">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="63" başlık="">
                <mvz-fıkra no="1">
                  <template>Kanunun verdiği yetkiye dayanan ve bu yetkinin sınırları içinde kalan bir fiil, zarara yol açsa bile, hukuka aykırı sayılmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Zarar görenin rızası, daha üstün nitelikte özel veya kamusal yarar, zarar verenin davranışının haklı savunma niteliği taşıması, yetkili kamu makamlarının müdahalesinin zamanında sağlanamayacak olması durumunda kişinin hakkını kendi gücüyle koruması veya zorunluluk hâllerinde de fiil, hukuka aykırı sayılmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Sorumluluk">
              <mvz-madde no="64" başlık="">
                <mvz-fıkra no="1">
                  <template>Haklı savunmada bulunan, saldıranın şahsına veya mallarına verdiği zarardan sorumlu tutulamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kendisini veya başkasını açık ya da yakın bir zarar tehlikesinden korumak için diğer bir kişinin mallarına zarar verenin, bu zararı giderim yükümlülüğünü hâkim hakkaniyete göre belirler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Hakkını kendi gücüyle koruma durumunda kalan kişi, durum ve koşullara göre o sırada kolluk gücünün yardımını zamanında sağlayamayacak ise ve hakkının kayba uğramasını ya da kullanılmasının önemli ölçüde zorlaşmasını önleyecek başka bir yol da yoksa, verdiği zarardan sorumlu tutulamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Kusursuz sorumluluk">
          <mvz-b2 no="I" başlık="Hakkaniyet sorumluluğu">
            <mvz-madde no="65" başlık="">
              <mvz-fıkra no="1">
                <template>Hakkaniyet gerektiriyorsa; hâkim, ayırt etme gücü bulunmayan kişinin verdiği zararın, tamamen veya kısmen giderilmesine karar verir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Özen sorumluluğu">
            <mvz-b3 no="1" başlık="Adam çalıştıranın sorumluluğu">
              <mvz-madde no="66" başlık="">
                <mvz-fıkra no="1">
                  <template>Adam çalıştıran, çalışanın, kendisine verilen işin yapılması sırasında başkalarına verdiği zararı gidermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Adam çalıştıran, çalışanını seçerken, işiyle ilgili talimat verirken, gözetim ve denetimde bulunurken, zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederse, sorumlu olmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Bir işletmede adam çalıştıran, işletmenin çalışma düzeninin zararın doğmasını önlemeye elverişli olduğunu ispat etmedikçe, o işletmenin faaliyetleri dolayısıyla sebep olunan zararı gidermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Adam çalıştıran, ödediği tazminat için, zarar veren çalışana, ancak onun bizzat sorumlu olduğu ölçüde rücu hakkına sahiptir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Hayvan bulunduranın sorumluluğu">
              <mvz-b4 no="a" başlık="Giderim yükümlülüğü">
                <mvz-madde no="67" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir hayvanın bakımını ve yönetimini sürekli veya geçici olarak üstlenen kişi, hayvanın verdiği zararı gidermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Hayvan bulunduran, bu zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederse sorumlu olmaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Hayvan, bir başkası veya bir başkasına ait hayvan tarafından ürkütülmüş olursa, hayvanı bulunduranın, bu kişilere rücu hakkı saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Alıkoyma hakkı">
                <mvz-madde no="68" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir kişinin hayvanı, başkasının taşınmazı üzerinde bir zarar verdiği takdirde, taşınmazın zilyedi, o hayvanı yakalayabilir, zararı giderilinceye kadar alıkoyabilir; hatta durum ve koşullar haklı gösteriyorsa hayvanı diğer yollarla etkisiz hâle getirebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bu durumda, taşınmazın zilyedi derhâl hayvan sahibine bilgi vermek ve sahibini bilmiyorsa, onun bulunması için gerekli girişimleri yapmak zorundadır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Yapı malikinin sorumluluğu">
              <mvz-b4 no="a" başlık="Giderim yükümlülüğü">
                <mvz-madde no="69" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir binanın veya diğer yapı eserlerinin maliki, bunların yapımındaki bozukluklardan veya bakımındaki eksikliklerden doğan zararı gidermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İntifa ve oturma hakkı sahipleri de, binanın bakımındaki eksikliklerden doğan zararlardan, malikle birlikte müteselsilen sorumludurlar.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Sorumluların, bu sebeplerle kendilerine karşı sorumlu olan diğer kişilere rücu hakkı saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Zarar tehlikesini önleme">
                <mvz-madde no="70" başlık="">
                  <mvz-fıkra no="1">
                    <template>Bir başkasına ait bina veya diğer yapı eserlerinden zarar görme tehlikesiyle karşılaşan kişi, bu tehlikenin giderilmesi için gerekli önlemlerin alınmasını hak sahiplerinden isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Kişilerin ve malların korunması hakkındaki kamu hukuku kuralları saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Tehlike sorumluluğu ve denkleştirme">
            <mvz-madde no="71" başlık="">
              <mvz-fıkra no="1">
                <template>Önemli ölçüde tehlike arzeden bir işletmenin faaliyetinden zarar doğduğu takdirde, bu zarardan işletme sahibi ve varsa işleten müteselsilen sorumludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bir işletmenin, mahiyeti veya faaliyette kullanılan malzeme, araçlar ya da güçler göz önünde tutulduğunda, bu işlerde uzman bir kişiden beklenen tüm özenin gösterilmesi durumunda bile sıkça veya ağır zararlar doğurmaya elverişli olduğu sonucuna varılırsa, bunun önemli ölçüde tehlike arzeden bir işletme olduğu kabul edilir. Özellikle, herhangi bir kanunda benzeri tehlikeler arzeden işletmeler için özel bir tehlike sorumluluğu öngörülmüşse, bu işletme de önemli ölçüde tehlike arzeden işletme sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Belirli bir tehlike hâli için öngörülen özel sorumluluk hükümleri saklıdır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Önemli ölçüde tehlike arzeden bir işletmenin bu tür faaliyetine hukuk düzenince izin verilmiş olsa bile, zarar görenler, bu işletmenin faaliyetinin sebep olduğu zararlarının uygun bir bedelle denkleştirilmesini isteyebilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Zamanaşımı">
          <mvz-b2 no="I" başlık="Kural">
            <mvz-madde no="72" başlık="">
              <mvz-fıkra no="1">
                <template>Tazminat istemi, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten başlayarak iki yılın ve her hâlde fiilin işlendiği tarihten başlayarak on yılın geçmesiyle zamanaşımına uğrar. Ancak, tazminat ceza kanunlarının daha uzun bir zamanaşımı öngördüğü cezayı gerektiren bir fiilden doğmuşsa, bu zamanaşımı uygulanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Haksız fiil dolayısıyla zarar gören bakımından bir borç doğmuşsa zarar gören, haksız fiilden doğan tazminat istemi zamanaşımına uğramış olsa bile, her zaman bu borcu ifadan kaçınabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Rücu isteminde">
            <mvz-madde no="73" başlık="">
              <mvz-fıkra no="1">
                <template>Rücu istemi, tazminatın tamamının ödendiği ve birlikte sorumlu kişinin öğrenildiği tarihten başlayarak iki yılın ve her hâlde tazminatın tamamının ödendiği tarihten başlayarak on yılın geçmesiyle zamanaşımına uğrar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Tazminatın ödenmesi kendisinden istenilen kişi, durumu birlikte sorumlu olduğu kişilere bildirmek zorundadır. Aksi takdirde zamanaşımı, bu bildirimin dürüstlük kurallarına göre yapılabileceği tarihte işlemeye başlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Yargılama">
          <mvz-b2 no="I" başlık="Ceza hukuku ile ilişkisinde">
            <mvz-madde no="74" başlık="">
              <mvz-fıkra no="1">
                <template>Hâkim, zarar verenin kusurunun olup olmadığı, ayırt etme gücünün bulunup bulunmadığı hakkında karar verirken, ceza hukukunun sorumlulukla ilgili hükümleriyle bağlı olmadığı gibi, ceza hâkimi tarafından verilen beraat kararıyla da bağlı değildir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aynı şekilde, ceza hâkiminin kusurun değerlendirilmesine ve zararın belirlenmesine ilişkin kararı da, hukuk hâkimini bağlamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Tazminat hükmünün değiştirilmesi">
            <mvz-madde no="75" başlık="">
              <mvz-fıkra no="1">
                <template>Bedensel zararın kapsamı, karar verme sırasında tam olarak belirlenemiyorsa hâkim, kararın kesinleşmesinden başlayarak iki yıl içinde, tazminat hükmünü değiştirme yetkisini saklı tutabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Geçici ödemeler">
            <mvz-madde no="76" başlık="">
              <mvz-fıkra no="1">
                <template>Zarar gören, iddiasının haklılığını gösteren inandırıcı kanıtlar sunduğu ve ekonomik durumu da gerektirdiği takdirde hâkim, istem üzerine davalının zarar görene geçici ödeme yapmasına karar verebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Davalının yaptığı geçici ödemeler, hükmedilen tazminata mahsup edilir; tazminata hükmedilmezse hâkim, davacının aldığı geçici ödemeleri, yasal faizi ile birlikte geri vermesine karar verir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Sebepsiz Zenginleşmeden Doğan Borç İlişkileri">
        <mvz-b1 no="A" başlık="Koşulları">
          <mvz-b2 no="I" başlık="Genel olarak">
            <mvz-madde no="77" başlık="">
              <mvz-fıkra no="1">
                <template>Haklı bir sebep olmaksızın, bir başkasının malvarlığından veya emeğinden zenginleşen, bu zenginleşmeyi geri vermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu yükümlülük, özellikle zenginleşmenin geçerli olmayan veya gerçekleşmemiş ya da sona ermiş bir sebebe dayanması durumunda doğmuş olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Borçlanılmamış edimin ifası">
            <mvz-madde no="78" başlık="">
              <mvz-fıkra no="1">
                <template>Borçlanmadığı edimi kendi isteğiyle yerine getiren kimse, bunu ancak, kendisini borçlu sanarak yerine getirdiğini ispat ederse geri isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zamanaşımına uğramış bir borcun ifasından veya ahlaki bir ödevin yerine getirilmiş olmasından kaynaklanan zenginleşmeler geri istenemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Borç olmadığı hâlde ödenmiş olan edimin geri istenmesine ilişkin diğer kanun hükümleri saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Geri vermenin kapsamı">
          <mvz-b2 no="I" başlık="Zenginleşenin yükümlülüğü">
            <mvz-madde no="79" başlık="">
              <mvz-fıkra no="1">
                <template>Sebepsiz zenginleşen, zenginleşmenin geri istenmesi sırasında elinden çıkmış olduğunu ispat ettiği kısmın dışında kalanı geri vermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zenginleşen, zenginleşmeyi iyiniyetli olmaksızın elden çıkarmışsa veya elden çıkarırken ileride geri vermek zorunda kalabileceğini hesaba katması gerekiyorsa, zenginleşmenin tamamını geri vermekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Giderleri isteme hakkı">
            <mvz-madde no="80" başlık="">
              <mvz-fıkra no="1">
                <template>Zenginleşen iyiniyetli ise, yaptığı zorunlu ve yararlı giderleri, geri verme isteminde bulunandan isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Zenginleşen iyiniyetli değilse, zorunlu giderlerinin ve yararlı giderlerinden sadece geri verme zamanında mevcut olan değer artışının ödenmesini isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Zenginleşen, iyiniyetli olup olmadığına bakılmaksızın, diğer giderlerinin ödenmesini isteyemez. Ancak, kendisine karşılık önerilmezse, o şey ile birleştirdiği ve zararsızca ayrılması mümkün bulunan eklemeleri geri vermeden önce ayırıp alabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Geri istenememe">
          <mvz-madde no="81" başlık="">
            <mvz-fıkra no="1">
              <template>Hukuka veya ahlaka aykırı bir sonucun gerçekleşmesi amacıyla verilen şey geri istenemez. Ancak, açılan davada hâkim, bu şeyin Devlete mal edilmesine karar verebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Zamanaşımı">
          <mvz-madde no="82" başlık="">
            <mvz-fıkra no="1">
              <template>Sebepsiz zenginleşmeden doğan istem hakkı, hak sahibinin geri isteme hakkı olduğunu öğrendiği tarihten başlayarak iki yılın ve her hâlde zenginleşmenin gerçekleştiği tarihten başlayarak on yılın geçmesiyle zamanaşımına uğrar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Zenginleşme, zenginleşenin bir alacak hakkı kazanması suretiyle gerçekleşmişse diğer taraf, istem hakkı zamanaşımına uğramış olsa bile, her zaman bu borcunu ifadan kaçınabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Borç İlişkisinin Hükümleri">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Borçların İfası">
        <mvz-b1 no="A" başlık="Genel olarak">
          <mvz-b2 no="I" başlık="Şahsen ifa zorunluluğunun olmaması">
            <mvz-madde no="83" başlık="">
              <mvz-fıkra no="1">
                <template>Borcun, bizzat borçlu tarafından ifa edilmesinde alacaklının menfaati bulunmadıkça borçlu, borcunu şahsen ifa etmekle yükümlü değildir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="İfanın konusu">
            <mvz-b3 no="1" başlık="Kısmen ifa">
              <mvz-madde no="84" başlık="">
                <mvz-fıkra no="1">
                  <template>Borcun tamamı belli ve muaccel ise, alacaklı kısmen ifayı reddedebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacaklı kısmen ifayı kabul ederse borçlu, borcun kendisi tarafından ikrar olunan kısmını ifadan kaçınamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Bölünemeyen borç">
              <mvz-madde no="85" başlık="">
                <mvz-fıkra no="1">
                  <template>Bölünemeyen bir borcun birden çok alacaklısı varsa, alacaklılardan her biri, borcun alacaklıların tamamına ifasını isteyebilir. Borçlu, edimini alacaklıların hepsine birden ifa etmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bölünemeyen borcun birden çok borçlusu varsa, borçlulardan her biri borcun tamamını ifa etmekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Durumun gereğinden aksi anlaşılmadıkça, ifada bulunan borçlu, alacaklıya halef olur ve diğer borçlulardan payları oranında alacağını isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Çeşit borcu">
              <mvz-madde no="86" başlık="">
                <mvz-fıkra no="1">
                  <template>Çeşit borçlarında hukuki ilişkiden ve işin özelliğinden aksi anlaşılmadıkça, edimin seçimi borçluya aittir. Ancak borçlunun seçeceği edim, ortalama nitelikten daha düşük olamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Seçimlik borç">
              <mvz-madde no="87" başlık="">
                <mvz-fıkra no="1">
                  <template>Seçimlik borçlarda, hukuki ilişkiden ve işin özelliğinden aksi anlaşılmadıkça, edimlerden birinin seçimi borçluya aittir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Faiz">
              <mvz-madde no="88" başlık="">
                <mvz-fıkra no="1">
                  <template>Faiz ödeme borcunda uygulanacak yıllık faiz oranı, sözleşmede kararlaştırılmamışsa faiz borcunun doğduğu tarihte yürürlükte olan mevzuat hükümlerine göre belirlenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Sözleşme ile kararlaştırılacak yıllık faiz oranı, birinci fıkra uyarınca belirlenen yıllık faiz oranının yüzde elli fazlasını aşamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="İfa yeri">
          <mvz-madde no="89" başlık="">
            <mvz-fıkra no="1">
              <template>Borcun ifa yeri, tarafların açık veya örtülü iradelerine göre belirlenir. Aksine bir anlaşma yoksa, aşağıdaki hükümler uygulanır;</template>
              <mvz-bent no="1.">
                <template>Para borçları, alacaklının ödeme zamanındaki yerleşim yerinde,</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Parça borçları, sözleşmenin kurulduğu sırada borç konusunun bulunduğu yerde,</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Bunların dışındaki bütün borçlar, doğumları sırasında borçlunun yerleşim yerinde,</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="0">
              <template>ifa edilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Alacaklının yerleşim yerinde ifası gereken bir borcun doğumundan sonra alacaklının yerleşim yerini değiştirmesi sebebiyle ifa önemli ölçüde güçleşmişse borç, alacaklının önceki yerleşim yerinde ifa edilebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="İfa zamanı">
          <mvz-b2 no="I" başlık="Süreye bağlanmamış borç">
            <mvz-madde no="90" başlık="">
              <mvz-fıkra no="1">
                <template>İfa zamanı taraflarca kararlaştırılmadıkça veya hukuki ilişkinin özelliğinden anlaşılmadıkça her borç, doğumu anında muaccel olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Süreye bağlı borç">
            <mvz-b3 no="1" başlık="Aya ilişkin sürelerde vade">
              <mvz-madde no="91" başlık="">
                <mvz-fıkra no="1">
                  <template>Borcun ifası için bir ayın başlangıcı veya sonu belirlenmişse, bundan ayın birinci ve sonuncu günü; ayın ortası belirlenmişse, bundan da ayın onbeşinci günü anlaşılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Borcun ifası için gün belirtilmeksizin sadece ay belirlenmişse, bundan o ayın son günü anlaşılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Diğer sürelerde vade">
              <mvz-madde no="92" başlık="">
                <mvz-fıkra no="1">
                  <template>Bir borcun veya taraflardan birine düşen herhangi bir yükümlülüğün sözleşmenin kurulmasından başlayarak belli bir sürenin sonunda ifası gerekiyorsa, ifa zamanı aşağıdaki biçimde belirlenir:</template>
                  <mvz-bent no="1.">
                    <template>Gün olarak belirlenmiş süre, sözleşmenin kurulduğu gün sayılmaksızın, bu sürenin son günü dolmuş olur. Sekiz veya onbeş gün olarak belirlenmiş süre ise, bir veya iki haftayı değil, tam sekiz veya onbeş günü ifade eder.</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Hafta olarak belirlenmiş süre, son haftanın sözleşmenin kurulduğu güne ismen uyan gününde dolmuş olur.</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Ay olarak veya yıl, yarıyıl ve yılın dörtte biri gibi birden çok ayı içeren bir zaman olarak belirlenmiş süre, sözleşmenin kurulduğu gün ayın kaçıncı günü ise, son ayın bunu karşılayan gününde dolmuş olur. Son ayda bunu karşılayan gün yoksa süre, bu ayın son günü dolmuş sayılır.</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Yarım aydan onbeş günlük süre anlaşılır. Bir veya birden çok ay ve yarım ay olarak belirlenmiş sürenin dolduğu gün, son aya onbeş gün eklenerek belirlenir.</template>
                  </mvz-bent>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu kurallar, sürenin sözleşmenin kurulmasından başka bir andan işlemeye başladığı durumlarda da uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Borçlu, belirli bir süre içinde yerine getirilmesi gereken bir borcu, bu sürenin dolmasından önce ifa etmekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Tatil günleri">
              <mvz-madde no="93" başlık="">
                <mvz-fıkra no="1">
                  <template>İfa zamanı veya sürenin son günü, kanunlarda tatil olarak kabul edilen bir güne rastlarsa, kendiliğinden bu günü izleyen ve tatil olmayan ilk güne geçer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Aksine anlaşma geçerlidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="İş saatlerinde ifa">
            <mvz-madde no="94" başlık="">
              <mvz-fıkra no="1">
                <template>Borç, alışılmış iş saatlerinde ifa ve kabul edilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Sürenin uzatılması">
            <mvz-madde no="95" başlık="">
              <mvz-fıkra no="1">
                <template>Süre uzatılmış ise yeni süre, aksi kararlaştırılmış olmadıkça, önceki sürenin sona ermesini izleyen birinci günden başlar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Erken ifa">
            <mvz-madde no="96" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmenin hükümlerinden veya özelliğinden ya da durumun gereğinden tarafların aksini kastettikleri anlaşılmadıkça borçlu, edimini sürenin sona ermesinden önce ifa edebilir. Ancak, kanun veya sözleşme ya da âdet gereği olmadıkça borçlu, erken ifada bulunması sebebiyle indirim yapamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="VI" başlık="Karşılıklı borç yükleyen sözleşmelerde">
            <mvz-b3 no="1" başlık="İfada sıra">
              <mvz-madde no="97" başlık="">
                <mvz-fıkra no="1">
                  <template>Karşılıklı borç yükleyen bir sözleşmenin ifası isteminde bulunan tarafın, sözleşmenin koşullarına ve özelliklerine göre daha sonra ifa etme hakkı olmadıkça, kendi borcunu ifa etmiş ya da ifasını önermiş olması gerekir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İfa güçsüzlüğü">
              <mvz-madde no="98" başlık="">
                <mvz-fıkra no="1">
                  <template>Karşılıklı borç yükleyen bir sözleşmede, taraflardan birinin borcunu ifada güçsüzlüğe düşmesi ve özellikle iflas etmesi ya da hakkındaki haciz işleminin sonuçsuz kalması sebebiyle diğer tarafın hakkı tehlikeye düşerse bu taraf, karşı edimin ifası güvence altına alınıncaya kadar kendi ediminin ifasından kaçınabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hakkı tehlikeye düşen taraf, ayrıca uygun bir sürede istediği güvence verilmezse sözleşmeden dönebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Ödeme">
          <mvz-b2 no="I" başlık="Ülke parası ile">
            <mvz-madde no="99" başlık="">
              <mvz-fıkra no="1">
                <template>Konusu para olan borç Ülke parasıyla ödenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Ülke parası dışında başka bir para birimiyle ödeme yapılması kararlaştırılmışsa, sözleşmede aynen ödeme veya bu anlama gelen bir ifade bulunmadıkça borç, ödeme günündeki rayiç üzerinden Ülke parasıyla da ödenebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Ülke parası dışında başka bir para birimiyle belirlenmiş ve sözleşmede aynen ödeme ya da bu anlama gelen bir ifade de bulunmadıkça, borcun ödeme gününde ödenmemesi üzerine alacaklı, bu alacağının aynen veya vade ya da fiilî ödeme günündeki rayiç üzerinden Ülke parası ile ödenmesini isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Mahsup">
            <mvz-b3 no="1" başlık="Kısmen ödemede">
              <mvz-madde no="100" başlık="">
                <mvz-fıkra no="1">
                  <template>Borçlu, faiz veya giderleri ödemede gecikmemiş ise, kısmen yaptığı ödemeyi ana borçtan düşme hakkına sahiptir. Aksine anlaşma yapılamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacaklı, alacağın bir kısmı için kefalet, rehin veya başka bir güvence almış ise, borçlu kısmen yaptığı ödemeyi, güvence altına alınan veya güvencesi daha iyi olan kısma mahsup etme hakkına sahip değildir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Birden çok borçta">
              <mvz-b4 no="a" başlık="Borçlu ve alacaklının bildirimine göre">
                <mvz-madde no="101" başlık="">
                  <mvz-fıkra no="1">
                    <template>Birden çok borcu bulunan borçlu, ödeme gününde bu borçlardan hangisini ödemek istediğini alacaklıya bildirebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Borçlu bildirimde bulunmazsa, yapılan ödeme, kendisi tarafından derhâl itiraz edilmiş olmadıkça, alacaklının makbuzda gösterdiği borç için yapılmış sayılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Kanuna göre">
                <mvz-madde no="102" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kanunen geçerli bir açıklama yapılmadığı veya makbuzda bir açıklık bulunmadığı durumda ödeme, muaccel borç için yapılmış sayılır. Birden çok borç muaccel ise ödemenin, borçluya karşı ilk olarak takip edilen borç için yapılmış olduğu kabul edilir. Takip yapılmamış ise ödeme, vadesi ilk önce gelmiş olan borç için yapılmış olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Birden çok borcun vadesi aynı zamanda gelmişse, mahsup orantılı olarak; borçlardan hiçbirinin vadesi gelmemişse ödeme, güvencesi en az olan borç için yapılmış sayılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Makbuz ve senetlerin geri verilmesi">
            <mvz-b3 no="1" başlık="Borçlunun hakkı">
              <mvz-madde no="103" başlık="">
                <mvz-fıkra no="1">
                  <template>Borcu ödeyen borçlu, bir makbuz ve borcun tamamı ödenmişse, buna ilişkin borç senedinin geri verilmesini veya iptalini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Borcun tamamı ödenmemiş veya borç senedi alacaklıya başkaca haklar da vermekte ise borçlu, ancak makbuz verilmesini ve ödemenin borç senedine işlenmesini isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Hükümleri">
              <mvz-madde no="104" başlık="">
                <mvz-fıkra no="1">
                  <template>Faiz veya kira bedeli gibi dönemsel edimlerden biri için, alacaklı tarafından çekince belirtilmeksizin makbuz verilmişse, önceki dönemlere ait edimler de ifa edilmiş sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alacaklı anaparanın tamamı için makbuz vermişse, faizlerini de almış olduğu kabul edilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Borç senedi borçluya geri verilmişse, borç sona ermiş sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Senedin geri verilememesi">
              <mvz-madde no="105" başlık="">
                <mvz-fıkra no="1">
                  <template>Alacaklı, borç senedini kaybettiğini iddia ederse, borçlunun istemi üzerine, borcu ödeme sırasında, kendisine borç senedinin iptalini ve borcun sona ermiş olduğunu gösteren resmen düzenlenmiş veya usulüne göre onaylanmış bir belge vermek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kıymetli evrakın iptaline ilişkin hükümler saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Alacaklının temerrüdü">
          <mvz-b2 no="I" başlık="Koşulları">
            <mvz-madde no="106" başlık="">
              <mvz-fıkra no="1">
                <template>Yapma veya verme edimi gereği gibi kendisine önerilen alacaklı, haklı bir sebep olmaksızın onu kabulden veya borçlunun borcunu ifa edebilmesi için kendisi tarafından yapılması gereken hazırlık fiillerini yapmaktan kaçınırsa, temerrüde düşmüş olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Alacaklı, müteselsil borçlulardan birine karşı temerrüde düşerse, diğerlerine karşı da temerrüde düşmüş olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Hükümleri">
            <mvz-b3 no="1" başlık="Bir şeyin teslimine ilişkin edimlerde">
              <mvz-b4 no="a" başlık="Tevdi hakkı">
                <mvz-madde no="107" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alacaklının temerrüde düşmesi durumunda borçlu, hasar ve giderleri alacaklıya ait olmak üzere, teslim edeceği şeyi tevdi ederek borcundan kurtulabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Tevdi yerini, ifa yerindeki hâkim belirler. Bununla birlikte ticari mallar, hâkim kararı olmadan da bir ardiyeye tevdi edilebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Satma hakkı">
                <mvz-madde no="108" başlık="">
                  <mvz-fıkra no="1">
                    <template>Sözleşmenin konusu olan şeyin niteliği veya işin özelliği tevdi edilmesine uygun düşmez veya teslim edilecek şey bozulabilir ya da bakımı, korunması veya tevdi edilmesi önemli bir gideri gerektirir ise, borçlu, alacaklıya önceden ihtarda bulunması koşuluyla, hâkimin izniyle onu açık artırma yoluyla sattırıp bedelini tevdi edebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
