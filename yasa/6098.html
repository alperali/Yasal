                <template>İşçi işverenle anlaşarak kendi araç veya malzemesini işin görülmesine özgülerse, aksi anlaşmada kararlaştırılmadıkça veya yerel âdet bulunmadıkça işveren, bunun için işçiye uygun bir karşılık ödemekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Giderler">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="414" başlık="">
                <mvz-fıkra no="1">
                  <template>İşveren, işin görülmesinin gerektirdiği her türlü harcama ile işçiyi işyeri dışında çalıştırdığı takdirde, geçimi için zorunlu olan harcamaları da ödemekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yazılı olarak yapılmış bir hizmet veya toplu iş sözleşmesinde, bizzat işçi tarafından karşılanması kararlaştırılan harcamaların, işçiye götürü biçimde günlük, haftalık veya aylık olarak ödenmesi öngörülebilir. Ancak bu ödeme, zorunlu harcamaları karşılayacak miktardan az olamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Zorunlu harcamaların kısmen veya tamamen işçi tarafından bizzat karşılanmasına ilişkin anlaşmalar geçersizdir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Taşıma araçları">
              <mvz-madde no="415" başlık="">
                <mvz-fıkra no="1">
                  <template>İşçi, işin görülmesi için işverenle anlaşarak işverenin veya kendisinin sağladığı bir taşıma aracı kullanıyorsa, taşıtın işletilmesi ve bakımı için gerekli olağan giderler, hizmet için kullanıldığı ölçüde işverence karşılanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İşçi işverenle anlaşarak, işin görülmesinde kendi motorlu aracını kullanıyorsa, işveren ayrıca bu araçla ilgili vergiyi, zorunlu mali sorumluluk sigortası primini ve aracın yıpranması karşılığında uygun bir tazminatı hizmet için kullanıldığı ölçüde işçiye ödemekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İşçi işverenle anlaşarak, hizmetin görülmesinde kendisine ait diğer taşıma araçlarını ve hayvanlarını kullanıyorsa işveren, bunların kullanma ve bakımı için gerekli olan olağan giderleri hizmet için kullanıldığı ölçüde karşılamakla yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Giderlerin ödenmesi">
              <mvz-madde no="416" başlık="">
                <mvz-fıkra no="1">
                  <template>İşçinin yapmış olduğu giderlerden doğan alacağı, daha kısa bir süre kararlaştırılmamışsa veya yerel âdet yoksa, her defasında ücretle birlikte ödenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İşçi, sözleşmeden doğan borçlarını yerine getirmek için düzenli olarak masraf yapıyorsa, kendisine en az ayda bir olmak üzere belirli aralıklarla uygun bir avans verilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="İşçinin kişiliğinin korunması">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="417" başlık="">
                <mvz-fıkra no="1">
                  <template>İşveren, hizmet ilişkisinde işçinin kişiliğini korumak ve saygı göstermek ve işyerinde dürüstlük ilkelerine uygun bir düzeni sağlamakla, özellikle işçilerin psikolojik ve cinsel tacize uğramamaları ve bu tür tacizlere uğramış olanların daha fazla zarar görmemeleri için gerekli önlemleri almakla yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İşveren, işyerinde iş sağlığı ve güvenliğinin sağlanması için gerekli her türlü önlemi almak, araç ve gereçleri noksansız bulundurmak; işçiler de iş sağlığı ve güvenliği konusunda alınan her türlü önleme uymakla yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İşverenin yukarıdaki hükümler dâhil, kanuna ve sözleşmeye aykırı davranışı nedeniyle işçinin ölümü, vücut bütünlüğünün zedelenmesi veya kişilik haklarının ihlaline bağlı zararların tazmini, sözleşmeye aykırılıktan doğan sorumluluk hükümlerine tabidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Ev düzeni içinde çalışmada">
              <mvz-madde no="418" başlık="">
                <mvz-fıkra no="1">
                  <template>İşçi işverenle birlikte ev düzeni içinde yaşıyorsa işveren, yeterli gıda ve uygun bir barınak sağlamakla yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İşçi, kusuru olmaksızın hastalık veya kaza gibi sebeplerle işgörme edimini yerine getiremezse işveren, sosyal sigortalar yardımlarından yararlanamayan, bir yıla kadar çalışmış işçinin bakımını ve tedavisini, iki hafta süreyle sağlamak zorundadır. İşçinin bir yılı aşan her hizmet yılı için söz konusu süre, dört haftayı aşmamak üzere ikişer gün artırılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İşveren, işçinin gebeliğinde ve doğum yapması durumunda da aynı edimleri yerine getirmekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Kişisel verilerin kullanılmasında">
              <mvz-madde no="419" başlık="">
                <mvz-fıkra no="1">
                  <template>İşveren, işçiye ait kişisel verileri, ancak işçinin işe yatkınlığıyla ilgili veya hizmet sözleşmesinin ifası için zorunlu olduğu ölçüde kullanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Özel kanun hükümleri saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Ceza koşulu ve ibra">
            <mvz-madde no="420" başlık="">
              <mvz-fıkra no="1">
                <template>Hizmet sözleşmelerine sadece işçi aleyhine konulan ceza koşulu geçersizdir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İşçinin işverenden alacağına ilişkin ibra sözleşmesinin yazılı olması, ibra tarihi itibarıyla sözleşmenin sona ermesinden başlayarak en az bir aylık sürenin geçmiş bulunması, ibra konusu alacağın türünün ve miktarının açıkça belirtilmesi, ödemenin hak tutarına nazaran noksansız ve banka aracılığıyla yapılması şarttır. Bu unsurları taşımayan ibra sözleşmeleri veya ibraname kesin olarak hükümsüzdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Hakkın gerçek tutarda ödendiğini ihtiva etmeyen ibra sözleşmeleri veya ibra beyanını muhtevi diğer ödeme belgeleri, içerdikleri miktarla sınırlı olarak makbuz hükmündedir. Bu hâlde dahi, ödemelerin banka aracılığıyla yapılmış olması zorunludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>İkinci ve üçüncü fıkra hükümleri, destekten yoksun kalanlar ile işçinin diğer yakınlarının isteyebilecekleri dâhil, hizmet sözleşmesinden doğan bütün tazminat alacaklarına da uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="VI" başlık="Tatil ve izinler">
            <mvz-b3 no="1" başlık="Hafta tatili ve iş arama izni">
              <mvz-madde no="421" başlık="">
                <mvz-fıkra no="1">
                  <template>İşveren, işçiye her hafta, kural olarak pazar günü veya durum ve koşullar buna imkân vermezse, bir tam çalışma günü tatil vermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İşveren, belirsiz süreli hizmet sözleşmesinin feshi hâlinde, bildirim süresi içinde işçiye ücretinde bir kesinti olmaksızın, günde iki saat iş arama izni vermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İzin saatlerinin ve günlerinin belirlenmesinde, işyerinin ve işçinin haklı menfaatleri göz önünde tutulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yıllık izin">
              <mvz-b4 no="a" başlık="Süresi">
                <mvz-madde no="422" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşveren, en az bir yıl çalışmış olan işçilere yılda en az iki hafta ve onsekiz yaşından küçük işçiler ile elli yaşından büyük işçilere de en az üç hafta ücretli yıllık izin vermekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="İndirimi">
                <mvz-madde no="423" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşçi, bir hizmet yılı içinde kendi kusuruyla toplam bir aydan daha uzun bir süreyle hizmeti yerine getirmediği takdirde işveren, çalışılmayan her tam ay için, yıllık ücretli izin süresinden bir gün indirim yapabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşçi, bir hizmet yılı içinde kendi kusuru olmaksızın hastalık, kaza, yasal bir yükümlülüğün veya kamu görevinin yerine getirilmesi gibi kişiliğine bağlı sebeplerle en çok üç ay süreyle işgörme edimini yerine getiremediği takdirde, işveren yıllık ücretli izin süresinden indirim yapamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>İşveren, gebelik ve doğum yapma sebebiyle işgörme edimini en çok üç ay süreyle yerine getiremeyen kadın işçinin yıllık ücretli izin süresinden indirim yapamaz.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Hizmet veya toplu iş sözleşmeleriyle, işçinin aleyhine hüküm doğuracak şekilde, ikinci ve üçüncü fıkra hükümlerine aykırı düzenleme yapılamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Kullanılması">
                <mvz-madde no="424" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yıllık ücretli izinler, kural olarak aralıksız biçimde verilir; ancak tarafların anlaşmasıyla ikiye bölünerek de kullanılabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşveren, yıllık ücretli izin tarihlerini, işyerinin veya ev düzeninin menfaatleriyle bağdaştığı ölçüde, işçinin isteklerini göz önünde tutarak belirler.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Ücreti">
                <mvz-madde no="425" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşveren, yıllık ücretli iznini kullanan her işçiye, yıllık ücretli izin süresine ilişkin ücretini, ilgili işçinin izne başlamasından önce peşin olarak ödemek veya avans olarak vermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşçi, hizmet ilişkisi devam ettiği sürece, işverenden alacağı para ve başka menfaatler karşılığında yıllık ücretli izin hakkından feragat edemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Hizmet sözleşmesinin herhangi bir sebeple sona ermesi hâlinde, işçinin hak kazanıp da kullanamadığı yıllık izin sürelerine ait ücreti, sözleşmenin sona erdiği tarihteki ücreti üzerinden kendisine veya hak sahiplerine ödenir. Bu ücrete ilişkin zamanaşımı, hizmet sözleşmesinin sona erdiği tarihte işlemeye başlar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="VII" başlık="Hizmet belgesi">
            <mvz-madde no="426" başlık="">
              <mvz-fıkra no="1">
                <template>İşveren, işçinin isteği üzerine her zaman, işin türünü ve süresini içeren bir hizmet belgesi vermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İşçinin açıkça istemde bulunması hâlinde, hizmet belgesinde onun işgörmedeki becerisi ile tutum ve davranışları da belirtilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Hizmet belgesinin zamanında verilmemesinden veya belgede doğru olmayan bilgiler bulunmasından zarar gören işçi veya işçiyi işe alan yeni işveren, eski işverenden tazminat isteyebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="E" başlık="Sınaî ve fikrî mülkiyet hakkı">
          <mvz-madde no="427" başlık="">
            <mvz-fıkra no="1">
              <template>Hizmet buluşları üzerinde işçinin ve işverenin hakları, bunların kazanılması ile diğer sınaî ve fikrî mülkiyet hakları konusunda özel kanun hükümleri uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="F" başlık="Hizmet ilişkisinin devri">
          <mvz-b2 no="I" başlık="İşyerinin tamamının veya bir bölümünün devri">
            <mvz-fıkra no="2">
              <template>MADDE 428 İşyerinin tamamı veya bir bölümü hukuki bir işlemle başkasına devredildiğinde, devir tarihinde işyerinde veya bir bölümünde mevcut olan hizmet sözleşmeleri, bütün hak ve borçları ile birlikte devralana geçer.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>İşçinin hizmet süresine bağlı hakları bakımından, onun devreden işveren yanında işe başladığı tarih esas alınır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Yukarıdaki hükümlere göre devir hâlinde, devirden önce doğmuş olan ve devir tarihinde ödenmesi gereken borçlardan, devreden ve devralan işveren müteselsilen sorumludurlar. Ancak, devreden işverenin bu yükümlülüklerden doğan sorumluluğu, devir tarihinden itibaren iki yıl ile sınırlıdır.</template>
            </mvz-fıkra>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sözleşmenin devri">
            <mvz-madde no="429" başlık="">
              <mvz-fıkra no="1">
                <template>Hizmet sözleşmesi, ancak işçinin yazılı rızası alınmak suretiyle, sürekli olarak başka bir işverene devredilebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Devir işlemiyle, devralan, bütün hak ve borçları ile birlikte, hizmet sözleşmesinin işveren tarafı olur. Bu durumda, işçinin, hizmet süresine bağlı hakları bakımından, devreden işveren yanında işe başladığı tarih esas alınır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="G" başlık="Sözleşmenin sona ermesi">
          <mvz-b2 no="I" başlık="Belirli süreli sözleşmede">
            <mvz-madde no="430" başlık="">
              <mvz-fıkra no="1">
                <template>Belirli süreli hizmet sözleşmesi, aksi kararlaştırılmadıkça, fesih bildiriminde bulunulmasına gerek olmaksızın, sürenin bitiminde kendiliğinden sona erer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Belirli süreli sözleşme, süresinin bitiminden sonra örtülü olarak sürdürülüyorsa, belirsiz süreli sözleşmeye dönüşür. Ancak, esaslı bir sebebin varlığı hâlinde, üst üste belirli süreli hizmet sözleşmesi kurulabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Taraflardan her biri, on yıldan uzun süreli hizmet sözleşmesini on yıl geçtikten sonra, altı aylık fesih bildirim süresine uyarak feshedebilir. Fesih, ancak bu süreyi izleyen aybaşında hüküm ifade eder.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Sözleşmenin fesih bildirimiyle sona ereceği kararlaştırılmış ve iki taraf da fesih bildiriminde bulunmamışsa, sözleşme belirsiz süreli sözleşmeye dönüşür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Belirsiz süreli sözleşmede">
            <mvz-b3 no="1" başlık="Genel olarak fesih hakkı">
              <mvz-madde no="431" başlık="">
                <mvz-fıkra no="1">
                  <template>Taraflardan her birinin, belirsiz süreli sözleşmeyi fesih sürelerine uyarak feshetme hakkı vardır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Fesih bildirim süresi">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="432" başlık="">
                  <mvz-fıkra no="1">
                    <template>Belirsiz süreli hizmet sözleşmelerinin feshinden önce, durumun diğer tarafa bildirilmesi gerekir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Hizmet sözleşmesi; bildirimin diğer tarafa ulaşmasından başlayarak, hizmet süresi bir yıla kadar sürmüş olan işçi için iki hafta sonra; bir yıldan beş yıla kadar sürmüş işçi için dört hafta ve beş yıldan fazla sürmüş işçi için altı hafta sonra sona erer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bu süreler kısaltılamaz; ancak sözleşmeyle artırılabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>İşveren, fesih bildirim süresine ait ücreti peşin vermek suretiyle hizmet sözleşmesini feshedebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="5">
                    <template>Fesih bildirim sürelerinin, her iki taraf için de aynı olması zorunludur; sözleşmede farklı süreler öngörülmüşse, her iki tarafa da en uzun olan fesih bildirim süresi uygulanır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="6">
                    <template>Hizmet sözleşmesinin askıya alındığı hâllerde fesih bildirim süreleri işlemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Deneme süresi içinde">
                <mvz-madde no="433" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taraflar, hizmet sözleşmesine iki ayı aşmamak koşuluyla deneme süresi koyabilirler. Deneme süresi konulmuşsa taraflar, bu süre içinde fesih süresine uymak zorunda olmaksızın, hizmet sözleşmesini tazminatsız feshedebilirler.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşçinin çalıştığı günler için ücret ve diğer hakları saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Feshe karşı koruma">
            <mvz-madde no="434" başlık="">
              <mvz-fıkra no="1">
                <template>Hizmet sözleşmesinin fesih hakkının kötüye kullanılarak sona erdirildiği durumlarda işveren, işçiye fesih bildirim süresine ait ücretin üç katı tutarında tazminat ödemekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Derhâl fesih">
            <mvz-b3 no="1" başlık="Koşulları">
              <mvz-b4 no="a" başlık="Haklı sebepler">
                <mvz-madde no="435" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taraflardan her biri, haklı sebeplerle sözleşmeyi derhâl feshedebilir. Sözleşmeyi fesheden taraf, fesih sebebini yazılı olarak bildirmek zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Sözleşmeyi fesheden taraftan, dürüstlük kurallarına göre hizmet ilişkisini sürdürmesi beklenemeyen bütün durum ve koşullar, haklı sebep sayılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="İşverenin ödeme güçsüzlüğüne düşmesi">
                <mvz-madde no="436" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşverenin ödeme güçsüzlüğüne düşmesi hâlinde işçi, sözleşmeden doğan hakları uygun bir süre içinde işveren tarafından güvenceye bağlanmazsa, sözleşmeyi derhâl feshedebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Sonuçları">
              <mvz-b4 no="a" başlık="Haklı sebeple fesihte">
                <mvz-madde no="437" başlık="">
                  <mvz-fıkra no="1">
                    <template>Haklı fesih sebepleri, taraflardan birinin sözleşmeye uymamasından doğmuşsa o taraf, sebep olduğu zararı, hizmet ilişkisine dayanan bütün haklar göz önünde tutularak, tamamen gidermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Diğer durumlarda hâkim, bütün durum ve koşulları göz önünde tutarak haklı sebeple feshin maddi sonuçlarını serbestçe değerlendirir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Haklı sebebe dayanmayan fesihte">
                <mvz-madde no="438" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşveren, haklı sebep olmaksızın hizmet sözleşmesini derhâl feshederse işçi, belirsiz süreli sözleşmelerde, fesih bildirim süresine; belirli süreli sözleşmelerde ise, sözleşme süresine uyulmaması durumunda, bu sürelere uyulmuş olsaydı kazanabileceği miktarı, tazminat olarak isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Belirli süreli hizmet sözleşmesinde işçinin hizmet sözleşmesinin sona ermesi yüzünden tasarruf ettiği miktar ile başka bir işten elde ettiği veya bilerek elde etmekten kaçındığı gelir, tazminattan indirilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Hâkim, bütün durum ve koşulları göz önünde tutarak, ayrıca miktarını serbestçe belirleyeceği bir tazminatın işçiye ödenmesine karar verebilir; ancak belirlenecek tazminat miktarı, işçinin altı aylık ücretinden fazla olamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="İşçinin haksız olarak işe başlamaması veya işi bırakması">
                <mvz-madde no="439" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşçi, haklı sebep olmaksızın işe başlamadığı veya aniden işi bıraktığı takdirde işveren, aylık ücretin dörtte birine eşit bir tazminat isteme hakkına sahiptir. İşverenin, ayrıca ek zararlarının giderilmesini isteme hakkı da vardır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>İşveren zarara uğramamışsa veya uğradığı zarar işçinin aylık ücretinin dörtte birinden az ise, hâkim tazminatı indirebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Tazminat isteme hakkı takas yoluyla sona ermemişse işveren, işçinin işe başlamamasından veya işi bırakmasından başlayarak otuz gün içinde, dava veya takip yoluyla bu hakkını kullanmak zorundadır. Aksi takdirde, tazminat isteme hakkı düşer.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="V" başlık="İşçinin veya işverenin ölümü">
            <mvz-b3 no="1" başlık="İşçinin ölümü">
              <mvz-madde no="440" başlık="">
                <mvz-fıkra no="1">
                  <template>Sözleşme, işçinin ölümüyle kendiliğinden sona erer. İşveren, işçinin sağ kalan eşine ve ergin olmayan çocuklarına, yoksa bakmakla yükümlü olduğu kişilere, ölüm gününden başlayarak bir aylık; hizmet ilişkisi beş yıldan uzun bir süre devam etmişse, iki aylık ücret tutarında bir ödeme yapmakla yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="İşverenin ölümü">
              <mvz-madde no="441" başlık="">
                <mvz-fıkra no="1">
                  <template>İşverenin ölümü hâlinde, yerini mirasçıları alır. Bu durumda işyerinin tamamının veya bir bölümünün devri ile gerçekleşen hizmet ilişkisinin devrine ilişkin hükümler kıyas yoluyla uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hizmet sözleşmesi ağırlıklı olarak işverenin kişiliği dikkate alınmak suretiyle kurulmuşsa, onun ölümüyle kendiliğinden sona erer. Ancak, işçi sözleşmenin süresinden önce sona ermesi yüzünden uğradığı zarar için, mirasçılardan hakkaniyete uygun bir tazminat isteminde bulunabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="VI" başlık="Sözleşmenin sona ermesinin sonuçları">
            <mvz-b3 no="1" başlık="Borçların muaccel olması">
              <mvz-madde no="442" başlık="">
                <mvz-fıkra no="1">
                  <template>Sözleşmenin sona ermesiyle, sözleşmeden doğan bütün borçlar muaccel olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Muacceliyet anı, işçinin aracılığı suretiyle kurulan hukuki ilişkilerde üçüncü kişinin üstlendiği borç, hizmet sözleşmesinin sona ermesinden sonra tamamen veya kısmen ifa edilecekse altı aya; dönemsel edimler içeren ilişkilerde bir yıla; sigorta sözleşmelerinde veya ifası altı aydan uzun bir süreye yayılmış olan işlerde ise iki yıla kadar, yazılı bir anlaşmayla ertelenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Üretilenden pay verilmesi öngörülen hâllerde ürün payı belirlenir belirlenmez, cirodan veya kârdan pay verilmesi kararlaştırılan hâllerde ise pay, hesap dönemini izleyen en geç üç ay sonunda muaccel olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Geri verme yükümlülüğü">
              <mvz-madde no="443" başlık="">
                <mvz-fıkra no="1">
                  <template>Sözleşmenin sona ermesi durumunda, taraflardan her biri, diğerinden veya üçüncü bir kişiden diğerinin hesabına, hizmetle ilişkili olarak almış olduğu şeyleri geri vermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İşçi, özellikle motorlu taşıtları ve trafik izin belgelerini, alacaklarından fazla olduğu ölçüde ücret ve masraf avanslarını geri vermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Tarafların hapis hakları saklıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="VII" başlık="Rekabet yasağı">
            <mvz-b3 no="1" başlık="Koşulları">
              <mvz-madde no="444" başlık="">
                <mvz-fıkra no="1">
                  <template>Fiil ehliyetine sahip olan işçi, işverene karşı, sözleşmenin sona ermesinden sonra herhangi bir biçimde onunla rekabet etmekten, özellikle kendi hesabına rakip bir işletme açmaktan, başka bir rakip işletmede çalışmaktan veya bunların dışında, rakip işletmeyle başka türden bir menfaat ilişkisine girişmekten kaçınmayı yazılı olarak üstlenebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Rekabet yasağı kaydı, ancak hizmet ilişkisi işçiye müşteri çevresi veya üretim sırları ya da işverenin yaptığı işler hakkında bilgi edinme imkânı sağlıyorsa ve aynı zamanda bu bilgilerin kullanılması, işverenin önemli bir zararına sebep olacak nitelikteyse geçerlidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Sınırlandırılması">
              <mvz-madde no="445" başlık="">
                <mvz-fıkra no="1">
                  <template>Rekabet yasağı, işçinin ekonomik geleceğini hakkaniyete aykırı olarak tehlikeye düşürecek biçimde yer, zaman ve işlerin türü bakımından uygun olmayan sınırlamalar içeremez ve süresi, özel durum ve koşullar dışında iki yılı aşamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Hâkim, aşırı nitelikteki rekabet yasağını, bütün durum ve koşulları serbestçe değerlendirmek ve işverenin üstlenmiş olabileceği karşı edimi de hakkaniyete uygun biçimde göz önünde tutmak suretiyle, kapsamı veya süresi bakımından sınırlayabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Aykırı davranışların sonuçları">
              <mvz-madde no="446" başlık="">
                <mvz-fıkra no="1">
                  <template>Rekabet yasağına aykırı davranan işçi, bunun sonucu olarak işverenin uğradığı bütün zararları gidermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Yasağa aykırı davranış bir ceza koşuluna bağlanmışsa ve sözleşmede aksine bir hüküm de yoksa, işçi öngörülen miktarı ödeyerek rekabet yasağına ilişkin borcundan kurtulabilir; ancak, işçi bu miktarı aşan zararı gidermek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İşveren, ceza koşulu ve doğabilecek ek zararlarının ödenmesi dışında, sözleşmede yazılı olarak açıkça saklı tutması koşuluyla, kendisinin ihlal veya tehdit edilen menfaatlerinin önemi ile işçinin davranışı haklı gösteriyorsa, yasağa aykırı davranışa son verilmesini de isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Sona ermesi">
              <mvz-madde no="447" başlık="">
                <mvz-fıkra no="1">
                  <template>Rekabet yasağı, işverenin bu yasağın sürdürülmesinde gerçek bir yararının olmadığı belirlenmişse sona erer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Sözleşme, haklı bir sebep olmaksızın işveren tarafından veya işverene yüklenebilen bir nedenle işçi tarafından feshedilirse, rekabet yasağı sona erer.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="2-İKİNCİ" başlık="Pazarlamacılık Sözleşmesi">
        <mvz-b1 no="A" başlık="Tanımı ve kurulması">
          <mvz-b2 no="I" başlık="Tanımı">
            <mvz-madde no="448" başlık="">
              <mvz-fıkra no="1">
                <template>Pazarlamacılık sözleşmesi, pazarlamacının sürekli olarak, bir ticari işletme sahibi işveren hesabına ve işletmesinin dışında, her türlü işlemin yapılmasına aracılık etmeyi veya yazılı anlaşma varsa, bu anlaşmada belirtilen işlemleri yapmayı, işletme sahibi işverenin de buna karşılık ücret ödemeyi üstlendiği sözleşmedir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kurulması">
            <mvz-madde no="449" başlık="">
              <mvz-fıkra no="1">
                <template>Pazarlamacılık sözleşmesi, sözleşmenin süresini, sona ermesini, pazarlamacının yetkilerini, ücret ve masrafların nasıl ödeneceğini, taraflardan birinin yerleşim yeri yabancı ülkede ise uygulanacak hukukun ve yetkili mahkemenin hangisi olduğunu içerir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yukarıdaki fıkra uyarınca sözleşmede yer alması öngörülen hususlar taraflarca belirlenmemişse, kanun hükümleri ve alışılmış hizmet koşulları uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Pazarlamacının yükümlülük ve yetkileri">
          <mvz-b2 no="I" başlık="Yükümlülükleri">
            <mvz-madde no="450" başlık="">
              <mvz-fıkra no="1">
                <template>Pazarlamacı, talimata uymamasını zorunlu kılan haklı bir sebep olmadıkça, kendisine verilen talimata uygun olarak müşterileri ziyaret etmekle yükümlüdür; işverenin izni olmadıkça, kendisi veya üçüncü kişiler hesabına işlem yapamaz, aracılık edemez.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Pazarlamacı, işlem yapmaya yetkiliyse, talimatta öngörülen fiyatlara ve diğer işlem koşullarına uymak zorundadır; işveren razı olmadıkça, bunlarda değişiklik yapamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Pazarlamacı, pazarlama faaliyetleri ile ilgili olarak düzenli biçimde ayrıntılı bilgi vermek, aldığı siparişleri işverene derhâl ulaştırmak ve müşteri çevresini ilgilendiren önemli olayları bildirmekle yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Garanti">
            <mvz-madde no="451" başlık="">
              <mvz-fıkra no="1">
                <template>Pazarlamacının, müşterilerin ödememelerinden veya diğer yükümlülüklerini ifa etmemelerinden sorumlu olacağına ya da alacağın tahsili için yapılacak masrafları tamamen veya kısmen karşılayacağına ilişkin anlaşmalar, kesin olarak hükümsüzdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Pazarlamacı, kendi müşteri çevresiyle işlem yapıyorsa, müşterilerin borçlarını ifa etmemesi durumunda, işverenin her bir işlemde uğrayacağı zararın dörtte birini geçmemek üzere karşılamayı, uygun bir ek komisyon kararlaştırılması koşuluyla yazılı olarak üstlenebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Sigorta sözleşmelerinde aracılık yapan pazarlamacılar, bir primin tamamının veya bir kısmının ödenmemesi sebebiyle, bunun tahsili için dava veya icra takibi yoluna başvurulması durumunda, bu amaçla yapılacak masrafların en çok yarısını karşılayacaklarını, yazılı olarak üstlenebilirler.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Yetkileri">
            <mvz-madde no="452" başlık="">
              <mvz-fıkra no="1">
                <template>Aksine yazılı anlaşma olmadıkça pazarlamacı, sadece işlemlere aracılık etmeye yetkilidir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Pazarlamacı, işlem yapmaya yetkili kılınmışsa yetkisi, bu işlerin icrası için gereken bütün olağan hukuki işlem ve fiilleri kapsar; özel yetki verilmedikçe müşterilerden tahsilat yapamaz ve ödeme günlerini değiştiremez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="İşverenin özel yükümlülükleri">
          <mvz-b2 no="I" başlık="Faaliyet alanı">
            <mvz-madde no="453" başlık="">
              <mvz-fıkra no="1">
                <template>Pazarlamacıya belirli bir pazarlama alanında veya belirli bir müşteri çevresinde faaliyette bulunma yetkisi verilmiş ve aksine yazılı anlaşma da yapılmamışsa işveren, başkalarına aynı alan veya çevrede faaliyette bulunma yetkisi veremez; ancak, kendisi üçüncü kişilerle işlem yapabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Sözleşmenin pazarlama alanı veya müşteri çevresine ilişkin hükmünün değiştirilmesini gerektiren bir sebep varsa işveren, söz konusu hükmü, sözleşmede fesih bildirim süresi öngörülmüş olsa bile, bu süreye uymadan tek taraflı olarak değiştirebilir; ancak, bu durumda pazarlamacının tazminat ve hizmet sözleşmesini haklı sebeple sona erdirme hakkı saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Ücret">
            <mvz-b3 no="1" başlık="Genel olarak">
              <mvz-madde no="454" başlık="">
                <mvz-fıkra no="1">
                  <template>İşveren, pazarlamacıya sadece belirli bir miktardan veya bu miktarla birlikte komisyondan oluşan bir ücret ödemekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ücretin tamamının veya önemli kısmının komisyondan oluşacağına ilişkin yazılı anlaşma, kararlaştırılan komisyonun, pazarlamacının faaliyetinin uygun karşılığını oluşturması koşuluyla geçerlidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Deneme süresi için ödenecek ücret, serbestçe kararlaştırılabilir. Ancak, deneme süresi iki ayı geçemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Komisyon">
              <mvz-madde no="455" başlık="">
                <mvz-fıkra no="1">
                  <template>Pazarlamacı, belirli bir pazarlama alanı veya belirli bir müşteri çevresinde faaliyette bulunma yetkisi sadece kendisine verilmişse, kendisinin veya işverenin bu alan veya çevrede yaptığı bütün işlerde kararlaştırılmış ya da alışılmış olan komisyonun ödenmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Belirli bir pazarlama alanı veya belirli müşteri çevresinde faaliyette bulunma yetkisi pazarlamacıyla birlikte başkalarına da verilmişse pazarlamacıya, sadece kendisinin aracılık ettiği veya bizzat yaptığı işler için komisyon ödenir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Komisyonun muaccel olması anında, yapılan işin değeri henüz kesin olarak belirlenemiyorsa komisyon, önce alışılmış olan en az değeri üzerinden, geri kalanı ise, en geç işin yerine getirilmesinde ödenir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Pazarlama faaliyetinin engellenmesi">
              <mvz-madde no="456" başlık="">
                <mvz-fıkra no="1">
                  <template>Pazarlamacının pazarlama işlerini yürütmesi, kendi kusuru olmaksızın imkânsız hâle gelir ve sözleşme veya kanun gereği bu hâlde bile kendisine ücret ödenmesi gerekirse ücret, sabit ücrete ve komisyonun kaybı sebebiyle ödenebilecek uygun tazminata göre belirlenir. Ancak komisyon, ücretin beşte birinden az ise, komisyon kaybı sebebiyle tazminat ödenmeyeceği yazılı olarak kararlaştırılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Pazarlamacı, pazarlama işlerini kendi kusuru olmaksızın yürütme imkânını bulamamasına karşın ücretinin tamamını almışsa, işverenin istemi üzerine, kendisinin yapabileceği ve kendisinden beklenebilecek işleri onun işletmesinde yapmakla yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Harcamalar">
            <mvz-madde no="457" başlık="">
              <mvz-fıkra no="1">
                <template>Pazarlamacı, aynı zamanda birden fazla işveren hesabına faaliyette bulunuyorsa, aksi yazılı şekilde kararlaştırılmadıkça, her işveren, pazarlamacının harcamalarına eşit olarak katılmakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Harcamaların tamamen veya kısmen sabit ücrete veya komisyona dâhil edilmesine ilişkin anlaşmalar kesin olarak hükümsüzdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Hapis hakkı">
            <mvz-madde no="458" başlık="">
              <mvz-fıkra no="1">
                <template>Pazarlamacılık ilişkisinden doğan muaccel alacaklar ile işverenin ödeme güçsüzlüğüne düşmesi durumunda, henüz muaccel olmayan alacakların güvence altına alınması için pazarlamacı, taşınırlar, kıymetli evrak ve tahsil yetkisine dayanarak müşterilerden almış olduğu paralar üzerinde hapis hakkına sahiptir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Pazarlamacı, araç ve taşıma belgelerini, fiyat tarifelerini, müşterilerle ilgili kayıtlar ile diğer belgeleri alıkoyamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Sona ermesi">
          <mvz-b2 no="I" başlık="Özel fesih süresi">
            <mvz-madde no="459" başlık="">
              <mvz-fıkra no="1">
                <template>Komisyon, sabit ücretin en az beşte birini oluşturuyor ve önemli mevsimlik dalgalanmalardan etkileniyorsa işveren, bir önceki mevsimin sona ermesinden beri kendisiyle çalışmaya devam eden pazarlamacının sözleşmesini, yeni mevsim sırasında iki aylık fesih süresine uyarak feshedebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aynı koşullar altında pazarlamacı da, kendisini bir önceki mevsim sonuna kadar çalıştırmış ve bundan sonra da çalıştırmaya devam eden işverene karşı, bir sonraki mevsimin başlamasına kadar olan dönemde, iki aylık fesih süresine uyarak sözleşmeyi feshedebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Özel sonuçlar">
            <mvz-madde no="460" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmenin sona ermesi hâlinde, pazarlamacının bizzat yaptığı veya yapılmasına aracılık ettiği bütün işlemler ile kabul ve yerine getirme zamanına bakılmaksızın, sözleşmenin sona ermesine kadar işverene iletilen bütün siparişler için komisyon ödenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Sözleşmenin sona ermesi hâlinde pazarlamacı, pazarlamacılık faaliyetinde bulunması için kendisine verilen örnek ve modelleri, fiyat tarifelerini, müşterilerle ilgili kayıtları ve diğer belgeleri işverene geri vermekle yükümlüdür. Ancak, pazarlamacının hapis hakkı saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Evde Hizmet Sözleşmesi">
        <mvz-b1 no="A" başlık="Tanımı ve çalışma koşulları">
          <mvz-b2 no="I" başlık="Tanımı">
            <mvz-madde no="461" başlık="">
              <mvz-fıkra no="1">
                <template>Evde hizmet sözleşmesi, işverenin verdiği işi, işçinin kendi evinde veya belirleyeceği başka bir yerde, bizzat veya aile bireyleriyle birlikte bir ücret karşılığında görmeyi üstlendiği sözleşmedir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Çalışma koşullarının bildirilmesi">
            <mvz-madde no="462" başlık="">
              <mvz-fıkra no="1">
                <template>İşveren, işçiye her yeni iş verişinde genel çalışma koşulları dışında kalan ve o işe özgü özellikleri bildirir; gerekiyorsa işçi tarafından sağlanacak malzemeyi, bu malzemenin sağlanması için kendisine ne miktarda ödemede bulunacağını ve iş için ödeyeceği ücreti de işçiye yazılı olarak bildirir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İşin verilmesinden önce malzeme için ödenecek bedel ve iş için ödenecek ücret yazıyla bildirilmemişse, bu işlerde uygulanan alışılmış bedel ve ücret ödenir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="İşçinin özel borçları">
            <mvz-b3 no="1" başlık="İşin yapılması">
              <mvz-madde no="463" başlık="">
                <mvz-fıkra no="1">
                  <template>İşçi, işe zamanında başlamak, işi kararlaştırılan zamanda bitirmek ve çalışmanın sonucunu işverene teslim etmekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İş, işçinin kusuruyla ayıplı olarak görülmüşse işçi, giderilmesi mümkün olan ayıpları, masrafı kendisine ait olmak üzere gidermek zorundadır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Malzeme ve iş araçları">
              <mvz-madde no="464" başlık="">
                <mvz-fıkra no="1">
                  <template>Malzeme ve iş araçları işveren tarafından sağlanmışsa, işçi bunları gereken özeni göstererek kullanmak, bundan dolayı hesap vermek, ayrıca kalan malzeme ile iş araçlarını da işverene teslim etmekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İşçi işi görürken, kendisine teslim edilen malzemenin veya iş araçlarının bozuk olduğunu belirlerse, durumu hemen işverene bildirir ve işe devam etmeden önce, onun talimatını bekler.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İşçi, kendisine teslim edilen malzeme veya iş araçlarını kendi kusuruyla kullanılmaz hâle getirirse, işverene karşı onun kullanılmaz hâle geldiği gündeki rayiç bedeli kadar sorumludur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="İşverenin özel borçları">
            <mvz-b3 no="1" başlık="Ürünün kabulü">
              <mvz-madde no="465" başlık="">
                <mvz-fıkra no="1">
                  <template>İşveren, işçinin üreterek teslim ettiği ürünü inceler; varsa bulduğu ayıpları teslimden başlayarak bir hafta içinde işçiye bildirir. Süresinde bildirim yapılmamışsa, ürün mevcut durumuyla kabul edilmiş sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Ücret">
              <mvz-b4 no="a" başlık="Ödenmesi">
                <mvz-madde no="466" başlık="">
                  <mvz-fıkra no="1">
                    <template>Yapılan işin ücreti, işçi, işveren tarafından aralıksız olarak çalıştırıldığı takdirde, onbeş günde bir veya işçinin rızasıyla ayda bir; aralıklı olarak çalıştırıldığı takdirde, ürünün her tesliminde ödenir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Her ücret ödenmesinde işçiye, bir hesap özeti verilir. Hesap özetinde, varsa kesintilerin miktarı ve sebebi de gösterilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Çalışmanın engellenmesi hâlinde">
                <mvz-madde no="467" başlık="">
                  <mvz-fıkra no="1">
                    <template>İşçiyi aralıksız biçimde çalıştıran işveren, ürünü kabulde temerrüde düştüğü veya işçinin kişiliğinden kaynaklanan sebeplerle ve kusuru olmaksızın çalışma engellendiği takdirde, hizmet ediminin engellenmesi durumundaki ücret ödenmesine ilişkin hükümler gereğince, ona ücretini ödemekle yükümlüdür. Diğer durumlarda işveren, bu hükümlere göre ücret ödemekle yükümlü değildir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Sona ermesi">
            <mvz-madde no="468" başlık="">
              <mvz-fıkra no="1">
                <template>İşçiye deneme amacıyla bir iş verilmişse, aksi kararlaştırılmadıkça, sözleşme deneme süresi için kurulmuş sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>İşçi, işveren tarafından aralıksız olarak çalıştırıldığı takdirde, aksi kararlaştırılmadıkça, sözleşme belirsiz süreyle yapılmış sayılır; diğer durumlarda sözleşmenin belirli süreyle yapıldığı kabul edilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Genel hükümlerin uygulanması">
          <mvz-madde no="469" başlık="">
            <mvz-fıkra no="1">
              <template>Pazarlamacılık sözleşmesine ve evde hizmet sözleşmesine ilişkin hüküm bulunmayan hâllerde, hizmet sözleşmesinin genel hükümleri uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="7-YEDİNCİ" başlık="Eser Sözleşmesi">
      <mvz-b1 no="A" başlık="Tanımı">
        <mvz-madde no="470" başlık="">
          <mvz-fıkra no="1">
            <template>Eser sözleşmesi, yüklenicinin bir eser meydana getirmeyi, işsahibinin de bunun karşılığında bir bedel ödemeyi üstlendiği sözleşmedir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Hükümleri">
        <mvz-b2 no="I" başlık="Yüklenicinin borçları">
          <mvz-b3 no="1" başlık="Genel olarak">
            <mvz-madde no="471" başlık="">
              <mvz-fıkra no="1">
                <template>Yüklenici, üstlendiği edimleri işsahibinin haklı menfaatlerini gözeterek, sadakat ve özenle ifa etmek zorundadır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Yüklenicinin özen borcundan doğan sorumluluğunun belirlenmesinde, benzer alandaki işleri üstlenen basiretli bir yüklenicinin göstermesi gereken meslekî ve teknik kurallara uygun davranışı esas alınır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Yüklenici, meydana getirilecek eseri doğrudan doğruya kendisi yapmak veya kendi yönetimi altında yaptırmakla yükümlüdür. Ancak, eserin meydana getirilmesinde yüklenicinin kişisel özellikleri önem taşımıyorsa, işi başkasına da yaptırabilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="4">
                <template>Aksine âdet veya anlaşma olmadıkça yüklenici, eserin meydana getirilmesi için kullanılacak olan araç ve gereçleri kendisi sağlamak zorundadır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Malzeme bakımından">
            <mvz-madde no="472" başlık="">
              <mvz-fıkra no="1">
                <template>Malzeme yüklenici tarafından sağlanmışsa yüklenici, bu malzemenin ayıplı olması yüzünden işsahibine karşı, satıcı gibi sorumludur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Malzeme işsahibi tarafından sağlanmışsa yüklenici, onları gereken özeni göstererek kullanmakla ve bundan dolayı hesap ve artanı geri vermekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Eser meydana getirilirken, işsahibinin sağladığı malzemenin veya eserin yapılması için gösterdiği yerin ayıplı olduğu anlaşılır veya eserin gereği gibi ya da zamanında meydana getirilmesini tehlikeye düşürecek başka bir durum ortaya çıkarsa, yüklenici bu durumu hemen işsahibine bildirmek zorundadır; bildirmezse bundan doğacak sonuçlardan sorumlu olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="3" başlık="İşe başlama ve yürütme">
            <mvz-madde no="473" başlık="">
              <mvz-fıkra no="1">
                <template>Yüklenicinin işe zamanında başlamaması veya sözleşme hükümlerine aykırı olarak işi geciktirmesi ya da işsahibine yüklenemeyecek bir sebeple ortaya çıkan gecikme yüzünden bütün tahminlere göre yüklenicinin işi kararlaştırılan zamanda bitiremeyeceği açıkça anlaşılırsa, işsahibi teslim için belirlenen günü beklemek zorunda olmaksızın sözleşmeden dönebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Meydana getirilmesi sırasında, eserin yüklenicinin kusuru yüzünden ayıplı veya sözleşmeye aykırı olarak meydana getirileceği açıkça görülüyorsa, işsahibi bunu önlemek üzere vereceği veya verdireceği uygun bir süre içinde yükleniciye, ayıbın veya aykırılığın giderilmesi; aksi takdirde hasar ve masrafları kendisine ait olmak üzere, onarımın veya işe devamın bir üçüncü kişiye verileceği konusunda ihtarda bulunabilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="4" başlık="Ayıp sebebiyle sorumluluk">
            <mvz-b4 no="a" başlık="Ayıbın belirlenmesi">
              <mvz-madde no="474" başlık="">
                <mvz-fıkra no="1">
                  <template>İşsahibi, eserin tesliminden sonra, işlerin olağan akışına göre imkân bulur bulmaz eseri gözden geçirmek ve ayıpları varsa, bunu uygun bir süre içinde yükleniciye bildirmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taraflardan her biri, giderini karşılayarak, eserin bilirkişi tarafından gözden geçirilmesini ve sonucun bir raporla belirlenmesini isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="b" başlık="İşsahibinin seçimlik hakları">
              <mvz-madde no="475" başlık="">
                <mvz-fıkra no="1">
                  <template>Eserdeki ayıp sebebiyle yüklenicinin sorumlu olduğu hâllerde işsahibi, aşağıdaki seçimlik haklardan birini kullanabilir:</template>
                  <mvz-bent no="a">
                    <template>1. Eser işsahibinin kullanamayacağı veya hakkaniyet gereği kabule zorlanamayacağı ölçüde ayıplı ya da sözleşme hükümlerine aynı ölçüde aykırı olursa sözleşmeden dönme.</template>
                  </mvz-bent>
                  <mvz-bent no="b">
                    <template>2. Eseri alıkoyup ayıp oranında bedelden indirim isteme.</template>
                  </mvz-bent>
                  <mvz-bent no="c">
                    <template>3. Aşırı bir masrafı gerektirmediği takdirde, bütün masrafları yükleniciye ait olmak üzere, eserin ücretsiz onarılmasını isteme.</template>
                  </mvz-bent>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İşsahibinin genel hükümlere göre tazminat isteme hakkı saklıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Eser, işsahibinin taşınmazı üzerinde yapılmış olup, sökülüp kaldırılması aşırı zarar doğuracaksa işsahibi, sözleşmeden dönme hakkını kullanamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="c" başlık="İşsahibinin sorumluluğu">
              <mvz-madde no="476" başlık="">
                <mvz-fıkra no="1">
                  <template>Eserin ayıplı olması, yüklenicinin açıkça yaptığı ihtara karşın, işsahibinin verdiği talimattan doğmuş bulunur veya herhangi bir sebeple işsahibine yüklenebilecek olursa işsahibi, eserin ayıplı olmasından doğan haklarını kullanamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="d" başlık="Eserin kabulü">
              <mvz-madde no="477" başlık="">
                <mvz-fıkra no="1">
                  <template>Eserin açıkça veya örtülü olarak kabulünden sonra, yüklenici her türlü sorumluluktan kurtulur; ancak, onun tarafından kasten gizlenen ve usulüne göre gözden geçirme sırasında fark edilemeyecek olan ayıplar için sorumluluğu devam eder.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İşsahibi, gözden geçirmeyi ve bildirimde bulunmayı ihmal ederse, eseri kabul etmiş sayılır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Eserdeki ayıp sonradan ortaya çıkarsa işsahibi, gecikmeksizin durumu yükleniciye bildirmek zorundadır; bildirmezse eseri kabul etmiş sayılır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="e" başlık="Zamanaşımı">
              <mvz-madde no="478" başlık="">
                <mvz-fıkra no="1">
                  <template>Yüklenici ayıplı bir eser meydana getirmişse, bu sebeple açılacak davalar, teslim tarihinden başlayarak, taşınmaz yapılar dışındaki eserlerde iki yılın; taşınmaz yapılarda ise beş yılın ve yüklenicinin ağır kusuru varsa, ayıplı eserin niteliğine bakılmaksızın yirmi yılın geçmesiyle zamanaşımına uğrar.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
          </mvz-b3>
        </mvz-b2>
        <mvz-b2 no="II" başlık="İşsahibinin borçları">
          <mvz-b3 no="1" başlık="Bedelin muacceliyeti">
            <mvz-madde no="479" başlık="">
              <mvz-fıkra no="1">
                <template>İşsahibinin bedel ödeme borcu, eserin teslimi anında muaccel olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Eserin parça parça teslim edilmesi kararlaştırılmış ve bedel parçalara göre belirlenmişse, her parçanın bedeli onun teslimi anında muaccel olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Bedel">
            <mvz-b4 no="a" başlık="Götürü bedel">
              <mvz-madde no="480" başlık="">
                <mvz-fıkra no="1">
                  <template>Bedel götürü olarak belirlenmişse yüklenici, eseri o bedelle meydana getirmekle yükümlüdür. Eser, öngörülenden fazla emek ve masrafı gerektirmiş olsa bile yüklenici, belirlenen bedelin artırılmasını isteyemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ancak, başlangıçta öngörülemeyen veya öngörülebilip de taraflarca göz önünde tutulmayan durumlar, taraflarca belirlenen götürü bedel ile eserin yapılmasına engel olur veya son derece güçleştirirse yüklenici, hâkimden sözleşmenin yeni koşullara uyarlanmasını isteme, bu mümkün olmadığı veya karşı taraftan beklenemediği takdirde sözleşmeden dönme hakkına sahiptir. Dürüstlük kurallarının gerektirdiği durumlarda yüklenici, ancak fesih hakkını kullanabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Eser, öngörülenden az emek ve masrafı gerektirmiş olsa bile işsahibi, belirlenen bedelin tamamını ödemekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
            <mvz-b4 no="b" başlık="Değere göre bedel">
              <mvz-madde no="481" başlık="">
                <mvz-fıkra no="1">
                  <template>Eserin bedeli önceden belirlenmemiş veya yaklaşık olarak belirlenmişse bedel, yapıldığı yer ve zamanda eserin değerine ve yüklenicinin giderine bakılarak belirlenir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b4>
          </mvz-b3>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Sözleşmenin sona ermesi">
        <mvz-b2 no="I" başlık="Yaklaşık bedelin aşılması">
          <mvz-madde no="482" başlık="">
            <mvz-fıkra no="1">
              <template>Başlangıçta yaklaşık olarak belirlenen bedelin, işsahibinin kusuru olmaksızın aşırı ölçüde aşılacağı anlaşılırsa işsahibi, eser henüz tamamlanmadan veya tamamlandıktan sonra sözleşmeden dönebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Eser, işsahibinin arsası üzerine yapılıyorsa işsahibi, bedelden uygun bir miktarın indirilmesini isteyebileceği gibi, eser henüz tamamlanmamışsa, yükleniciyi işe devamdan alıkoyarak, tamamlanan kısım için hakkaniyete uygun bir bedel ödemek suretiyle sözleşmeyi feshedebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Eserin yok olması">
          <mvz-madde no="483" başlık="">
            <mvz-fıkra no="1">
              <template>Eser teslimden önce beklenmedik olay sonucu yok olursa işsahibi, eseri teslim almada temerrüde düşmedikçe yüklenici, yaptığı işin ücretini ve giderlerinin ödenmesini isteyemez. Bu durumda malzemeye gelen hasar, onu sağlayana ait olur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Eserin işsahibince verilen malzeme veya gösterilen arsanın ayıbı veya işsahibinin talimatına uygun yapılması yüzünden yok olması durumunda yüklenici, doğabilecek olumsuz sonuçları zamanında bildirmişse, yaptığı işin değerini ve bu değere girmeyen giderlerinin ödenmesini isteyebilir. İşsahibinin kusuru varsa, yüklenicinin ayrıca zararının giderilmesini de isteme hakkı vardır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Tazminat karşılığı fesih">
          <mvz-madde no="484" başlık="">
            <mvz-fıkra no="1">
              <template>İşsahibi, eserin tamamlanmasından önce yapılmış olan kısmın karşılığını ödemek ve yüklenicinin bütün zararlarını gidermek koşuluyla sözleşmeyi feshedebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="İşsahibi yüzünden ifanın imkânsızlaşması">
          <mvz-madde no="485" başlık="">
            <mvz-fıkra no="1">
              <template>Eserin tamamlanması, işsahibi ile ilgili beklenmedik olay dolayısıyla imkânsızlaşırsa yüklenici, yaptığı işin değerini ve bu değere girmeyen giderlerini isteyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>İfa imkânsızlığının ortaya çıkmasında işsahibi kusurluysa, yüklenicinin ayrıca tazminat isteme hakkı vardır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="V" başlık="Yüklenicinin ölümü veya yeteneğini kaybetmesi">
          <mvz-madde no="486" başlık="">
            <mvz-fıkra no="1">
              <template>Yüklenicinin kişisel özellikleri göz önünde tutularak yapılmış olan sözleşme, onun ölümü veya kusuru olmaksızın eseri tamamlama yeteneğini kaybetmesi durumunda kendiliğinden sona erer. Bu durumda işsahibi, eserin tamamlanan kısmından yararlanabilecek ise, onu kabul etmek ve karşılığını vermekle yükümlüdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="8-SEKİZİNCİ" başlık="Yayım Sözleşmesi">
      <mvz-b1 no="A" başlık="Tanımı">
        <mvz-madde no="487" başlık="">
          <mvz-fıkra no="1">
            <template>Yayım sözleşmesi, bir fikir ve sanat eseri sahibinin veya halefinin, o eseri yayımlanmak üzere yayımcıya bırakmayı, yayımcının da onu çoğaltarak yayımlamayı üstlendiği sözleşmedir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Şekli">
        <mvz-madde no="488" başlık="">
          <mvz-fıkra no="1">
            <template>Yayım sözleşmesinin geçerliliği, yazılı şekilde yapılmış olmasına bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Hükümleri">
        <mvz-b2 no="I" başlık="Yayımlatma hakkının geçişi ve sorumluluk">
          <mvz-madde no="489" başlık="">
            <mvz-fıkra no="1">
              <template>Yayım sözleşmesiyle eser sahibinin hakları, sözleşmenin ifasının gerektirdiği ölçüde ve süreyle yayımcıya geçer.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yayımlatan, yayımcıya karşı, sözleşmenin kurulduğu anda eseri yayımlatma hakkının bulunmamasından sorumlu olduğu gibi, eser korunmakta ise, telif hakkının olmamasından da sorumludur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Eserin tamamı veya bir bölümü yayımlanmak üzere başka bir yayımcıya bırakılmış ya da yayımlatanın bilgisi altında yayımlanmış ise yayımlatan, yayım sözleşmesinin yapılmasından önce, bunu karşı tarafa bildirmek zorundadır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Yayımlatanın tasarruf hakkı">
          <mvz-madde no="490" başlık="">
            <mvz-fıkra no="1">
              <template>Yayımlatan, sözleşmede kararlaştırılan süre sona ermedikçe veya süre belirlenmemişse kararlaştırılan baskı adedinin tükenmesi için alışılmış süre geçmedikçe, eserin tamamı veya bir bölümü üzerinde, yayımcının zararına olacak biçimde tasarrufta bulunamaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Süreli yayınlarda yer alan kısa yazılar, yayımlatan tarafından her zaman, başka yerde de yayımlatılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Yayımlatan, toplama bir eserin kendisine ait bölümlerini veya dergilerde çıkan uzun yazılarını, yayımın bitmesinden başlayarak üç ay geçmedikçe yeniden yayımlatamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Basım sayısı ve baskı adedinin belirlenmesi">
          <mvz-madde no="491" başlık="">
            <mvz-fıkra no="1">
              <template>Sözleşmede basım sayısı belirtilmemişse, yayımcının ancak bir basım yapma hakkı vardır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Taraflar, sözleşmenin süresini veya baskı adedini kararlaştırmak zorundadırlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Sözleşmede yayımcıya belirli birkaç basım veya bütün yeni basımları yapma yetkisi verildiği hâllerde, yayımcı eserin baskı adedi tükenmiş iken yeni bir basım yapmayı ihmal ederse, yayımlatan yeni basım için yayımcıya uygun bir süre verir. Yayımcı, verilen süre içinde basımı gerçekleştirmezse; yayımlatan sözleşmeden cayabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Çoğaltma ve dağıtım">
          <mvz-madde no="492" başlık="">
            <mvz-fıkra no="1">
              <template>Yayımcı, eseri hiçbir kısaltma, ekleme ve değişiklik yapmaksızın uygun biçimde çoğaltmakla yükümlüdür; ayrıca, satışın artırılması için gerekli tanıtım ve dağıtımı yapmak ve bu konuda her türlü önlemi almak zorundadır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Satış fiyatını, eserin satılmasını güçleştirmemek koşuluyla yayımcı belirler.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="V" başlık="Düzeltme ve iyileştirme">
          <mvz-madde no="493" başlık="">
            <mvz-fıkra no="1">
              <template>Yayımcının menfaatlerini zedelememek ve onun sorumluluğunu artırmamak koşuluyla, eser sahibi eserde düzeltme ve iyileştirme, halefleri ise ancak güncelleştirme yapabilir. Bu düzeltme ve iyileştirme gerektirdiği hâlde sözleşmede öngörülmemiş giderler, yayımlatan tarafından karşılanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yayımcı, eser sahibine eserini iyileştirme, haleflerine de güncelleştirme imkânı vermeden yeni bir basım yapamaz ve onu çoğaltamaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="VI" başlık="Birarada basım ve ayrı ayrı yayım">
          <mvz-madde no="494" başlık="">
            <mvz-fıkra no="1">
              <template>Bir eser sahibinin birden çok eserini ayrı ayrı yayımlama hakkı, yayımcıya bunların bir arada basılması yetkisini vermez.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Aynı şekilde, eser sahibinin bütün eserlerini veya bunlardan yalnız bir türünü birarada yayımlama hakkı, yayımcıya bunlar içinden her birinin ayrı ayrı basıp yayma hakkını vermez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="VII" başlık="Çeviri hakkı">
          <mvz-madde no="495" başlık="">
            <mvz-fıkra no="1">
              <template>Çeviri hakkının yayımcıya geçebilmesi, bunun sözleşmede açıkça belirtilmiş olmasına bağlıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="VIII" başlık="Bedel isteme hakkı">
          <mvz-b3 no="1" başlık="Bedelin belirlenmesi">
            <mvz-madde no="496" başlık="">
              <mvz-fıkra no="1">
                <template>Sözleşmede aksi kararlaştırılmış olmadıkça yayımlatan, bedel ödenmesini isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bedel ödenmesi gereken hâllerde ödenecek miktar belli değilse bedel, hâkim tarafından belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Yayımcının birden fazla basım yapma hakkı varsa, ilk basım için kararlaştırılan bedel ve diğer koşulların, sonraki basımlar için de uygulanacağı kabul edilmiş sayılır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
          <mvz-b3 no="2" başlık="Bedelin ödenme zamanı, satış hesapları ve bedelsiz alma hakkı">
            <mvz-madde no="497" başlık="">
              <mvz-fıkra no="1">
                <template>Bedel, eser bütün olarak yayımlanacaksa tamamının; cilt, fasikül, forma gibi bölümler hâlinde yayımlanacaksa, her bölümün basımından ve satışa hazır duruma getirilmesinden sonra ödenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Taraflar, bedeli satış miktarına bağlamışlarsa yayımcı, satış hesaplarını tutmak, çıkarmak ve teamüle uygun ispat edici belgeleri hazırlamakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Aksi kararlaştırılmadıkça yayımlatanın, eserden, teamül uyarınca verilmesi gereken miktarda bedelsiz alma hakkı vardır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b3>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="D" başlık="Sona ermesi">
        <mvz-b2 no="I" başlık="Eserin yok olması">
          <mvz-madde no="498" başlık="">
            <mvz-fıkra no="1">
              <template>Eser, yayımcıya teslimden sonra beklenmedik hâl sonucu yok olsa bile, yayımcı bedeli ödemekle yükümlüdür.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Eserin başka bir örneği kendisinde varsa, eser sahibinin bu örneği yayımcıya vermesi gerekir; başka bir örneği bulunmamakla birlikte, az bir çabayla yeniden meydana getirilebilecekse eser sahibi, eseri meydana getirerek teslim etmekle yükümlüdür. Eser sahibi her iki durumda da uygun bir karşılık isteyebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Basılanın yok olması">
          <mvz-madde no="499" başlık="">
            <mvz-fıkra no="1">
              <template>Eserin tamamlanmış olan baskı adedinin tamamı veya bir bölümü, satışa sunulmadan önce beklenmedik hâl sonucu yok olursa yayımcı, yayımlatana ayrıca bir bedel ödemeksizin yok olan miktarı, gideri kendisine ait olmak üzere yeniden basabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yayımcı, aşırı masraf gerektirmeksizin yok olanların yerine yenilerini koyabilecek ise, bunu yapmakla yükümlüdür.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Kişisel sebeplerle sona ermesi">
          <mvz-madde no="500" başlık="">
            <mvz-fıkra no="1">
              <template>Eser sahibi eseri tamamlamadan önce ölür veya tamamlama yeteneğini yitirir ya da eseri tamamlaması kendi kusuru olmaksızın imkânsız duruma gelirse, sözleşme kendiliğinden sona erer. Ancak, sözleşmenin tamamı veya bir bölümünün yerine getirilmesi mümkün ve hakkaniyete uygun bulunursa hâkim, sözleşme ilişkisinin devam etmesine ve bunun için gereken değişikliklerin yapılmasına karar verebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yayımcı iflas ederse yayımlatan, eseri başka bir yayımcıya verebilir; ancak, iflas anında henüz muaccel olmamış borcun yerine getirileceği konusunda güvence gösterilmişse, yayımlatan eseri başka bir yayımcıya veremez.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="E" başlık="Sipariş üzerine yayım sözleşmesi">
        <mvz-madde no="501" başlık="">
          <mvz-fıkra no="1">
            <template>Bir veya birkaç kişi, yayımcının belirlediği plana göre bir eser meydana getirmeyi üstlenirlerse, sadece sözleşmeyle kararlaştırılan ücrete hak kazanırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu durumda, sözleşme konusu mali haklar yayımcıya ait olur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="9-DOKUZUNCU" başlık="Vekâlet İlişkileri">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Vekâlet Sözleşmesi">
        <mvz-b1 no="A" başlık="Tanımı">
          <mvz-madde no="502" başlık="">
            <mvz-fıkra no="1">
              <template>Vekâlet sözleşmesi, vekilin vekâlet verenin bir işini görmeyi veya işlemini yapmayı üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Vekâlete ilişkin hükümler, niteliklerine uygun düştükleri ölçüde, bu Kanunda düzenlenmemiş olan işgörme sözleşmelerine de uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Sözleşme veya teamül varsa vekil, ücrete hak kazanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Kurulması">
          <mvz-madde no="503" başlık="">
            <mvz-fıkra no="1">
              <template>Kendisine bir işin görülmesi önerilen kişi, bu işi görme konusunda resmî sıfata sahipse veya işin yapılması mesleğinin gereği ise ya da bu gibi işleri kabul edeceğini duyurmuşsa, bu öneri onun tarafından hemen reddedilmedikçe, vekâlet sözleşmesi kurulmuş sayılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Hükümleri">
          <mvz-b2 no="I" başlık="Vekâletin kapsamı">
            <mvz-madde no="504" başlık="">
              <mvz-fıkra no="1">
                <template>Vekâletin kapsamı, sözleşmede açıkça gösterilmemişse, görülecek işin niteliğine göre belirlenir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Vekâlet, özellikle vekilin üstlendiği işin görülmesi için gerekli hukuki işlemlerin yapılması yetkisini de kapsar.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Vekil, özel olarak yetkili kılınmadıkça dava açamaz, sulh olamaz, hakeme başvuramaz, iflas, iflasın ertelenmesi ve konkordato talep edemez, kambiyo taahhüdünde bulunamaz, bağışlama yapamaz, kefil olamaz, taşınmazı devredemez ve bir hak ile sınırlandıramaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Vekilin borçları">
            <mvz-b3 no="1" başlık="Talimata uygun ifa">
              <mvz-madde no="505" başlık="">
                <mvz-fıkra no="1">
                  <template>Vekil, vekâlet verenin açık talimatına uymakla yükümlüdür. Ancak, vekâlet verenden izin alma imkânı bulunmadığında, durumu bilseydi onun da izin vereceği açık olan hâllerde, vekil talimattan ayrılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bunun dışındaki durumlarda vekil, talimattan ayrılırsa, bundan doğan zararı karşılamadıkça işi görmüş olsa bile, vekâlet borcunu ifa etmiş olmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Şahsen ifa, sadakat ve özen gösterme">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="506" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vekil, vekâlet borcunu bizzat ifa etmekle yükümlüdür. Ancak vekile yetki verildiği veya durumun zorunlu ya da teamülün mümkün kıldığı hâllerde vekil, işi başkasına yaptırabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Vekil üstlendiği iş ve hizmetleri, vekâlet verenin haklı menfaatlerini gözeterek, sadakat ve özenle yürütmekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Vekilin özen borcundan doğan sorumluluğunun belirlenmesinde, benzer alanda iş ve hizmetleri üstlenen basiretli bir vekilin göstermesi gereken davranış esas alınır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="İşin üçüncü kişiye gördürülmesi hâlinde">
                <mvz-madde no="507" başlık="">
                  <mvz-fıkra no="1">
                    <template>Vekil, yetkisi dışına çıkarak işi başkasına gördürdüğünde, onun fiilinden kendisi yapmış gibi sorumludur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Vekil başkasına vekâlet vermeye yetkili ise, sadece seçmede ve talimat vermede gerekli özeni göstermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Vekâlet veren, her iki durumda da vekilin kendi yerine koyduğu kişiye karşı sahip olduğu hakları, doğrudan doğruya o kişiye karşı ileri sürebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Hesap verme">
              <mvz-madde no="508" başlık="">
                <mvz-fıkra no="1">
                  <template>Vekil, vekâlet verenin istemi üzerine yürüttüğü işin hesabını vermek ve vekâletle ilişkili olarak aldıklarını vekâlet verene vermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vekil, vekâlet verene tesliminde geciktiği paranın faizini de ödemekle yükümlüdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Edinilen hakların vekâlet verene geçişi">
              <mvz-madde no="509" başlık="">
                <mvz-fıkra no="1">
                  <template>Vekilin, kendi adına ve vekâlet veren hesabına gördüğü işlerden doğan üçüncü kişilerdeki alacağı, vekâlet verenin vekile karşı bütün borçlarını ifa ettiği anda, kendiliğinden vekâlet verene geçer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Vekilin iflası hâlinde vekâlet veren, bu alacağın kendisine geçmiş olduğunu iflas masasına karşı da ileri sürebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
