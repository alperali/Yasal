            <mvz-b3 no="2" başlık="Yargılama usulü">
              <mvz-b4 no="a" başlık="Davanın bildirimi">
                <mvz-madde no="215" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satılanın elinden alınması tehlikesi ile karşılaşan alıcı, kendisine karşı açılan davayı satıcıya bildirdiği zaman satıcı, durumun gereğine göre ve yargılama usulü uyarınca ya alıcının yanında davaya katılmak ya da alıcı yerine geçerek üçüncü kişiye karşı davayı takip etmek ve savunmak zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Bildirme, davaya katılmaya ve savunmaya elverişli bir zamanda yapılmışsa, alıcının aleyhinde verilen hüküm, onun ağır kusuru yüzünden verildiği ispat edilmedikçe, satıcı için de sonuç doğurur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Dava, kendisine yüklenilemeyen sebeplerden dolayı satıcıya bildirilmemişse satıcı, zamanında bildirilmiş olsaydı daha elverişli bir hüküm elde edilebileceğini ispatladığı ölçüde sorumluluktan kurtulur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Mahkeme kararı olmaksızın satılanı verme">
                <mvz-madde no="216" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satıcının zapttan sorumluluğu aşağıdaki hâllerde devam eder:</template>
                    <mvz-bent no="a">
                      <template>1. Alıcı, bir mahkeme kararı beklemeksizin üçüncü kişinin hakkını dürüstlük kurallarına uygun olarak tanımış ve satılanı ona vermişse.</template>
                    </mvz-bent>
                    <mvz-bent no="b">
                      <template>2. Alıcı, üçüncü kişinin kendisine karşı dava açmasını beklemeden, satıcıyı satılan üzerindeki hak iddiasına ilişkin uyuşmazlığı dava yoluyla çözümlemesi, aksi takdirde tahkim yoluna başvuracağı konusunda gecikmeksizin uyarmış ve bundan sonuç alamadığı için tahkim yoluna başvurmuşsa.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satıcının sorumluluğu, alıcının satılanı üçüncü kişiye vermekle yükümlü olduğunu ispat etmesi durumunda da devam eder.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Alıcının hakları">
              <mvz-b4 no="a" başlık="Tam zapt hâlinde">
                <mvz-madde no="217" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satılanın tamamı alıcının elinden alınmışsa, satış sözleşmesi kendiliğinden sona ermiş sayılır ve alıcı satıcıdan aşağıdaki istemlerde bulunabilir:</template>
                    <mvz-bent no="1.">
                      <template>Satılandan elde ettiği veya elde etmeyi ihmal eylediği ürünlerin değeri indirilerek, ödemiş olduğu satış bedelinin faizi ile birlikte geri verilmesini.</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Satılanı elinden alan üçüncü kişiden isteyemeyeceği giderleri.</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Davayı satıcıya bildirmekle kaçınılabilecek olanlar dışında kalan bütün yargılama giderleri ile yargılama dışındaki giderleri.</template>
                    </mvz-bent>
                    <mvz-bent no="4.">
                      <template>Satılanın tamamen elinden alınması yüzünden doğrudan doğruya uğradığı diğer zararları.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satıcı, kendisine hiçbir kusur yüklenemeyeceğini ispat etmedikçe, alıcının satılanın elinden alınması yüzünden uğramış olduğu diğer zararları da gidermekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Kısmi zapt hâlinde">
                <mvz-madde no="218" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satılanın bir kısmı elinden alınmış veya satılan sınırlı ayni bir hakla yüklenmişse alıcı, sadece bu yüzden uğradığı zararın giderilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ancak alıcının, satılandaki bu durumu bilseydi onu satın almayacağı durum ve koşullardan anlaşılıyorsa, alıcı hâkimden sözleşmenin sona ermesine karar vermesini isteyebilir. Bu durumda alıcı, satılanın elinde kalmış olan kısmını o zamana kadar elde etmiş olduğu yararlarla birlikte, satıcıya geri vermekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Ayıptan sorumluluk">
            <mvz-b3 no="1" başlık="Konusu">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="219" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satıcı, alıcıya karşı herhangi bir surette bildirdiği niteliklerin satılanda bulunmaması sebebiyle sorumlu olduğu gibi, nitelik veya niteliği etkileyen niceliğine aykırı olan, kullanım amacı bakımından değerini ve alıcının ondan beklediği faydaları ortadan kaldıran veya önemli ölçüde azaltan maddi, hukuki ya da ekonomik ayıpların bulunmasından da sorumlu olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satıcı, bu ayıpların varlığını bilmese bile onlardan sorumludur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Hayvan satışında">
                <mvz-madde no="220" başlık="">
                  <mvz-fıkra no="1">
                    <template>Hayvan satışında satıcı, yazılı olarak üstlenmedikçe veya ağır kusuru olmadıkça ayıptan sorumlu olmaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Sorumsuzluk anlaşması">
              <mvz-madde no="221" başlık="">
                <mvz-fıkra no="1">
                  <template>Satıcı satılanı ayıplı olarak devretmekte ağır kusurlu ise, ayıptan sorumluluğunu kaldıran veya sınırlayan her anlaşma kesin olarak hükümsüzdür.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Alıcının bildiği ayıplar">
              <mvz-madde no="222" başlık="">
                <mvz-fıkra no="1">
                  <template>Satıcı, satış sözleşmesinin kurulduğu sırada alıcı tarafından bilinen ayıplardan sorumlu değildir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Satıcı, alıcının satılanı yeterince gözden geçirmekle görebileceği ayıplardan da, ancak böyle bir ayıbın bulunmadığını ayrıca üstlenmişse sorumlu olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Gözden geçirme ve satıcıya bildirme">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="223" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alıcı, devraldığı satılanın durumunu işlerin olağan akışına göre imkân bulunur bulunmaz gözden geçirmek ve satılanda satıcının sorumluluğunu gerektiren bir ayıp görürse, bunu uygun bir süre içinde ona bildirmek zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alıcı gözden geçirmeyi ve bildirimde bulunmayı ihmal ederse, satılanı kabul etmiş sayılır. Ancak, satılanda olağan bir gözden geçirmeyle ortaya çıkarılamayacak bir ayıp bulunması hâlinde, bu hüküm uygulanmaz. Bu tür bir ayıbın bulunduğu sonradan anlaşılırsa, hemen satıcıya bildirilmelidir; bildirilmezse satılan bu ayıpla birlikte kabul edilmiş sayılır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Hayvan satışında">
                <mvz-madde no="224" başlık="">
                  <mvz-fıkra no="1">
                    <template>Hayvan satışında satıcının sorumlu olacağı süre yazılı olarak belirlenmemiş ve ayıp da hayvanın gebeliğine ilişkin değilse satıcı, ancak ayıbın devrin yapıldığı veya alıcının devralmada temerrüdünün gerçekleştiği günden başlayarak dokuz gün içinde kendisine bildirilmesi ve ayrıca, hayvanın bilirkişilerce gözden geçirilmesinin aynı süre içinde yetkili makamdan istenmesi hâlinde sorumlu olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Satıcının ağır kusurunun sonuçları">
              <mvz-madde no="225" başlık="">
                <mvz-fıkra no="1">
                  <template>Ağır kusurlu olan satıcı, satılandaki ayıbın kendisine süresinde bildirilmemiş olduğunu ileri sürerek sorumluluktan kısmen de olsa kurtulamaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Satıcılığı meslek edinmiş kişilerin bilmesi gereken ayıplar bakımından da aynı hüküm geçerlidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="6" başlık="Satılanın başka yerden gönderilmesi">
              <mvz-madde no="226" başlık="">
                <mvz-fıkra no="1">
                  <template>Başka yerden gönderilen satılanın ayıplı olduğunu ileri süren alıcı, bulunduğu yerde satıcının temsilcisi yoksa, satılanın korunması için gerekli önlemleri geçici olarak almakla yükümlüdür. Alıcı, ayıplı olduğunu ileri sürdüğü satılanın korunması için gerekli önlemleri almaksızın onu satıcıya geri gönderemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alıcı, satılanın durumunu gecikmeksizin usulüne göre tespit ettirmekle yükümlüdür. Bunu yaptırmazsa, ileri sürdüğü ayıbın, satılanın kendisine ulaştığı zamanda var olduğunu ispat yükü alıcıya düşer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Satılanın kısa zamanda bozulma tehlikesi varsa, alıcı onu bulunduğu yerdeki mahkeme aracılığıyla sattırmaya yetkili, hatta satıcının yararı gerektiriyorsa sattırmakla yükümlüdür. Alıcı, durumu satıcıya en kısa zamanda bildirmezse, bundan doğan zarardan sorumlu olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="7" başlık="Alıcının seçimlik hakları">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="227" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satıcının satılanın ayıplarından sorumlu olduğu hâllerde alıcı, aşağıdaki seçimlik haklardan birini kullanabilir:</template>
                    <mvz-bent no="1.">
                      <template>Satılanı geri vermeye hazır olduğunu bildirerek sözleşmeden dönme.</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Satılanı alıkoyup ayıp oranında satış bedelinde indirim isteme.</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Aşırı bir masrafı gerektirmediği takdirde, bütün masrafları satıcıya ait olmak üzere satılanın ücretsiz onarılmasını isteme.</template>
                    </mvz-bent>
                    <mvz-bent no="4.">
                      <template>İmkân varsa, satılanın ayıpsız bir benzeri ile değiştirilmesini isteme.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alıcının genel hükümlere göre tazminat isteme hakkı saklıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Satıcı, alıcıya aynı malın ayıpsız bir benzerini hemen vererek ve uğradığı zararın tamamını gidererek seçimlik haklarını kullanmasını önleyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Alıcının, sözleşmeden dönme hakkını kullanması hâlinde, durum bunu haklı göstermiyorsa hâkim, satılanın onarılmasına veya satış bedelinin indirilmesine karar verebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="5">
                    <template>Satılanın değerindeki eksiklik satış bedeline çok yakın ise alıcı, ancak sözleşmeden dönme veya satılanın ayıpsız bir benzeriyle değiştirilmesini isteme haklarından birini kullanabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Satılanın yok olması veya ağır biçimde zarara uğraması">
                <mvz-madde no="228" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alıcıya ayıplı olarak devredilmiş olan satılanın ayıptan, beklenmedik hâlden veya mücbir sebepten dolayı yok olması veya ağır biçimde zarara uğraması, alıcının sözleşmeden dönme hakkını kullanmasını engellemez. Bu durumda alıcı, satılandan elinde ne kalmışsa onu geri vermekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satılan alıcıya yüklenebilen bir sebep yüzünden yok olmuşsa veya alıcı onu başkasına devretmişse ya da biçimini değiştirmişse alıcı, ancak değerindeki eksiklik karşılığının satış bedelinden indirilmesini isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="8" başlık="Dönmenin sonuçları">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="229" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satış sözleşmesinden dönen alıcı, satılanı, ondan elde ettiği yararları ile birlikte satıcıya geri vermekle yükümlüdür. Buna karşılık alıcı da, satıcıdan aşağıdaki istemlerde bulunabilir:</template>
                    <mvz-bent no="1.">
                      <template>Ödemiş olduğu satış bedelinin, faiziyle birlikte geri verilmesi.</template>
                    </mvz-bent>
                    <mvz-bent no="2.">
                      <template>Satılanın tamamen zaptında olduğu gibi, yargılama giderleri ile satılan için yapmış olduğu giderlerin ödenmesi.</template>
                    </mvz-bent>
                    <mvz-bent no="3.">
                      <template>Ayıplı maldan doğan doğrudan zararının giderilmesi.</template>
                    </mvz-bent>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satıcı, kendisine hiçbir kusur yüklenemeyeceğini ispat etmedikçe, alıcının diğer zararlarını da gidermekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Birden çok mal satışında">
                <mvz-madde no="230" başlık="">
                  <mvz-fıkra no="1">
                    <template>Birden çok mal veya birden çok parçadan oluşan bir mal, birlikte satılmış olup da bunlardan bazıları ayıplı çıkarsa, dönme hakkı bunlardan ancak ayıplı çıkanlar için kullanılabilir. Ancak, alıcıya veya satıcıya önemli bir zarar vermeksizin ayıplı parçanın diğerinden ayrılmasına imkân yoksa, dönme hakkının satılanın tamamını kapsaması zorunludur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satılanın aslı için satıştan dönülmesi, ayrı satış bedeli gösterilerek satılmış olsalar bile, eklentilerini de kapsar; fakat eklentiler için dönme, satılanın aslını kapsamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="9" başlık="Zamanaşımı">
              <mvz-madde no="231" başlık="">
                <mvz-fıkra no="1">
                  <template>Satıcı daha uzun bir süre için üstlenmiş olmadıkça, satılanın ayıbından doğan sorumluluğa ilişkin her türlü dava, satılandaki ayıp daha sonra ortaya çıksa bile, satılanın alıcıya devrinden başlayarak iki yıl geçmekle zamanaşımına uğrar. Alıcının satılanın kendisine devrinden başlayarak iki yıl içinde bildirdiği ayıptan doğan def’i hakkı, bu sürenin geçmiş olmasıyla ortadan kalkmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Satıcı, satılanı ayıplı olarak devretmekte ağır kusurlu ise, iki yıllık zamanaşımı süresinden yararlanamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Alıcının borçları">
          <mvz-b2 no="I" başlık="Satış bedelinin ödenmesi ve satılanın devralınması">
            <mvz-madde no="232" başlık="">
              <mvz-fıkra no="1">
                <template>Alıcı, satış sözleşmesinde kararlaştırılmış olduğu biçimde satış bedelini ödemek ve kendisine sunulan satılanı devralmakla yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Aksine yerel âdet veya anlaşma yoksa, satılanın hemen devralınması gereklidir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Satış bedelinin belirlenmesi">
            <mvz-madde no="233" başlık="">
              <mvz-fıkra no="1">
                <template>Alıcı, satış bedelini belirtmeksizin, malı alacağını kesin olarak bildirmişse satış, ifa yeri ve zamanındaki ortalama piyasa fiyatı üzerinden yapılmış sayılır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Satış bedeli, satılanın ağırlığına göre hesaplanıyorsa, darası indirilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bazı ticari malların satışında, daralı ağırlıktan miktar olarak ya da yüzde hesabıyla bir indirim yapılmasına veya bedelin, daralı ağırlık üzerinden belirlenmesine ilişkin ticari teamüller saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Satış bedelinin muacceliyeti ve faizi">
            <mvz-madde no="234" başlık="">
              <mvz-fıkra no="1">
                <template>Aksine sözleşme yoksa, satılan alıcının zilyetliğine girince satış bedeli muaccel olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Faiz istenebileceği konusunda bir teamül varsa veya alıcı maldan ürün ya da diğer verimler elde etme imkânına sahip ise ya da belirli günün geçmesiyle temerrüdün gerçekleşmesi durumunda, ayrıca bir ihtara gerek olmaksızın satış bedeline faiz istenebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Alıcının temerrüdü">
            <mvz-b3 no="1" başlık="Satıcının dönme hakkı">
              <mvz-madde no="235" başlık="">
                <mvz-fıkra no="1">
                  <template>Satılanın, ancak satış bedeli ödendikten sonra veya ödenme anında devredilmesi gereken durumlarda alıcı temerrüde düşerse satıcı, herhangi bir işlem gerekmeksizin satıştan dönebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bu hakkını kullanmak isteyen satıcı, durumu gecikmeksizin alıcıya bildirmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Satılanın zilyetliği satış bedeli ödenmeden alıcıya devredilmişse, alıcının temerrüdü sebebiyle satıcının dönme hakkını kullanarak satılanı geri alması, bu hakkın sözleşmede açıkça saklı tutulmasına bağlıdır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Zararın hesaplanması ve giderimi">
              <mvz-madde no="236" başlık="">
                <mvz-fıkra no="1">
                  <template>Borcunu ifa etmeyen alıcı, satıcının bu yüzden uğradığı zararı gidermekle yükümlüdür.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Satıcı, satış bedelini ödemede temerrüde düşmüş olan alıcıdan, bu bedel ile satılanın başkasına dürüstlük kurallarına uygun olarak satışından elde ettiği bedel arasındaki farka göre hesaplanacak zararın giderilmesini isteyebilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Satılan, borsada kayıtlı veya piyasa fiyatı bulunan mallardan ise satıcı, böyle bir satışa gerek kalmaksızın alıcıdan, satış bedeli ile malın belirlenmiş ödeme günündeki fiyatı arasındaki farka göre hesaplanacak zararın giderilmesini isteyebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="3-ÜÇÜNCÜ" başlık="Taşınmaz Satışı ve Satış İlişkisi Doğuran Haklar">
        <mvz-b1 no="A" başlık="Şekil">
          <mvz-madde no="237" başlık="">
            <mvz-fıkra no="1">
              <template>Taşınmaz satışının geçerli olabilmesi için, sözleşmenin resmî şekilde düzenlenmesi şarttır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Taşınmaz satışı vaadi, geri alım ve alım sözleşmeleri, resmî şekilde düzenlenmedikçe geçerli olmaz.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Önalım sözleşmesinin geçerliliği, yazılı şekilde yapılmış olmasına bağlıdır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Satış ilişkisi doğuran haklar">
          <mvz-b2 no="I" başlık="Süresi ve şerhi">
            <mvz-madde no="238" başlık="">
              <mvz-fıkra no="1">
                <template>Önalım, geri alım ve alım hakları en çok on yıllık süre için kararlaştırılabilir ve kanunlarda belirlenen süreyle tapu siciline şerh edilebilir.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Devredilmesi ve miras yoluyla geçmesi">
            <mvz-madde no="239" başlık="">
              <mvz-fıkra no="1">
                <template>Aksine anlaşma olmadıkça, sözleşmeden doğan önalım, alım ve geri alım hakları devredilemez, ancak miras yoluyla geçer.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu hakların devredilebileceği sözleşmeyle kararlaştırılmışsa, devir işlemi hakkın kurulması için öngörülen şekilde yapılmadıkça geçerli olmaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Önalım hakkı">
            <mvz-b3 no="1" başlık="İleri sürülmesi">
              <mvz-madde no="240" başlık="">
                <mvz-fıkra no="1">
                  <template>Önalım hakkı, taşınmazın satışı ya da ekonomik bakımdan satışa eşdeğer her türlü işlemin yapılması hâllerinde kullanılabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taşınmazın, mirasın paylaşımında mirasçılardan birine özgülenmesi, cebrî artırma yoluyla satışı ve kamu hizmetlerinin yerine getirilmesi ve bunlara benzer amaçlarla edinilmesi hâllerinde önalım hakkı kullanılamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Koşulları ve hükümleri">
              <mvz-madde no="241" başlık="">
                <mvz-fıkra no="1">
                  <template>Satıcı veya alıcı, satış sözleşmesinin yapıldığını ve içeriğini önalım hakkı sahibine noter aracılığıyla bildirmek zorundadır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Önalım hakkı kullanıldıktan sonra satış sözleşmesi ortadan kaldırılırsa ya da alıcının şahsından kaynaklanan sebeplerle onaylanmazsa, bu durum önalım hakkı sahibine karşı ileri sürülemez.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Önalım hakkını kuran sözleşmede aksi öngörülmemişse, önalım hakkı sahibi taşınmazı, satıcının üçüncü kişiyle kararlaştırdığı satışa ilişkin koşullarla kazanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Ekonomik bakımdan satışa eşdeğer işlemlerde de yukarıdaki hükümler uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Kullanılması ve hükümleri">
              <mvz-madde no="242" başlık="">
                <mvz-fıkra no="1">
                  <template>Sözleşmeden doğan önalım hakkını kullanmak isteyen hak sahibi, bu hak şerhedilmiş ve taşınmazın mülkiyeti alıcı adına tescil edilmişse alıcıya; aksi takdirde satıcıya karşı, satışın veya ekonomik bakımdan satışa eşdeğer başka bir işlemin kendisine bildirildiği tarihten başlayarak üç ay ve her hâlde satışın yapılmasından başlayarak iki yıl içinde dava açmak zorundadır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Taşınmaz satışı">
          <mvz-b2 no="I" başlık="Koşullu satış ve mülkiyetin saklı tutulması">
            <mvz-madde no="243" başlık="">
              <mvz-fıkra no="1">
                <template>Bir taşınmazın koşula bağlı satışında, koşul gerçekleşmedikçe tapu siciline tescil yapılamaz.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Taşınmaz satışında mülkiyeti saklı tutma koşulu da tescil edilemez.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Sorumluluk">
            <mvz-madde no="244" başlık="">
              <mvz-fıkra no="1">
                <template>Aksine sözleşme olmadıkça, satılan taşınmaz, satış sözleşmesinde yazılı yüzölçümü tutarını kapsamıyorsa satıcı, eksiği için alıcıya tazminat ödemekle yükümlüdür.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Satılan taşınmaz, resmî bir ölçüme dayanılarak tapu siciline yazılmış olan yüzölçümü tutarını içermiyorsa satıcı, özellikle üstlenmiş olmadıkça tazminat ile yükümlü değildir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="3">
                <template>Bir yapının ayıplı olmasından doğan davalar, mülkiyetin geçmesinden başlayarak beş yılın ve satıcının ağır kusuru varsa yirmi yılın geçmesiyle zamanaşımına uğrar.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Yarar ve hasar">
            <mvz-madde no="245" başlık="">
              <mvz-fıkra no="1">
                <template>Satılanın tescilden sonraki bir zamanda alıcı tarafından teslim alınması için sözleşmeyle bir süre belirlenmişse, onun yarar ve hasarı, alıcıya teslimle geçer. Bu hüküm, alıcının satılanı teslim almada temerrüde düşmesi durumunda da uygulanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Bu sözleşmenin geçerliliği, yazılı şekilde yapılmış olmasına bağlıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Taşınır satışına ilişkin kuralların uygulanması">
            <mvz-madde no="246" başlık="">
              <mvz-fıkra no="1">
                <template>Taşınır satışına ilişkin kurallar, kıyas yoluyla taşınmaz satışında da uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
      <mvz-ayırım no="4-DÖRDÜNCÜ" başlık="Bazı Satış Türleri">
        <mvz-b1 no="A" başlık="Örnek üzerine satış">
          <mvz-b2 no="I" başlık="Tanımı">
            <mvz-madde no="247" başlık="">
              <mvz-fıkra no="1">
                <template>Örnek üzerine satış, tarafların sözleşmenin konusu olan malın alıcıya veya üçüncü bir kişiye bırakılan bir örneğe ya da tespit ettikleri bir mala uygun olması üzerinde anlaşmalarıyla yapılan satıştır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="İspat yükü">
            <mvz-madde no="248" başlık="">
              <mvz-fıkra no="1">
                <template>Örnek üzerine satışta kendisine örnek verilen taraf, elindeki örneğin kendisine verilmiş örnek olduğunu ispat yükü altında olmayıp, örneğin biçimi değişmiş olsa bile, bu değişiklik gözden geçirmenin zorunlu bir sonucu ise, alıcının iddiası doğru sayılır. Ancak, karşı tarafın her hâlde bunun aksini ispat hakkı vardır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Örnek, alıcının elindeyken bozulmuş veya yok olmuşsa, kusuru olmasa bile, satılanın örneğe uygun olmadığını ispat yükü alıcıya düşer.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Beğenme koşuluyla satış">
          <mvz-b2 no="I" başlık="Tanımı">
            <mvz-madde no="249" başlık="">
              <mvz-fıkra no="1">
                <template>Beğenme koşuluyla satış, alıcının satılanı deneyerek veya gözden geçirerek beğenmesi koşuluyla yapılan satıştır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Hükümleri">
            <mvz-madde no="250" başlık="">
              <mvz-fıkra no="1">
                <template>Beğenme koşuluyla satışta alıcı, satılanı kabul etmekte veya hiçbir sebep göstermeksizin geri vermekte serbesttir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Satılan, alıcının zilyetliğine geçmiş olsa bile, satılanın mülkiyeti, beğenme koşulunun gerçekleştiği ana kadar satıcıda kalır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Deneme veya gözden geçirme">
            <mvz-b3 no="1" başlık="Satıcının yanında">
              <mvz-madde no="251" başlık="">
                <mvz-fıkra no="1">
                  <template>Deneme veya gözden geçirme satıcının yanında yapılmak gerekip de alıcı, satılanı sözleşme veya âdete göre gerekli süre içinde kabul edip etmediğini açıklamazsa, satıcı sözleşmeyle bağlılıktan kurtulur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Böyle bir süre belirlenmemişse, satıcı uygun bir süre geçtikten sonra, satılanı kabul edip etmediğini bildirmesi için alıcıya ihtarda bulunabilir; bu ihtara hemen cevap verilmezse satıcı, sözleşmeyle bağlılıktan kurtulur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Alıcının yanında">
              <mvz-madde no="252" başlık="">
                <mvz-fıkra no="1">
                  <template>Satılan, denenmeksizin veya gözden geçirilmeksizin alıcıya verilmişse, sözleşme veya âdete göre gereken süre içinde veya böyle bir süre yoksa, satıcının ihtarı üzerine alıcı, satılanı beğenmediğini hemen bildirmez veya onu geri vermezse, beğenme koşulu gerçekleşmiş olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Alıcının, herhangi bir çekince belirtmeksizin satış bedelinin tamamını veya bir kısmını ödemesiyle ya da satılanı deneme veya gözden geçirme amacını aşacak biçimde kullanmasıyla da beğenme koşulu gerçekleşmiş olur.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Kısmi ödemeli satışlar">
          <mvz-b2 no="I" başlık="Taksitle satış">
            <mvz-b3 no="1" başlık="Tanımı, şekli ve içeriği">
              <mvz-madde no="253" başlık="">
                <mvz-fıkra no="1">
                  <template>Taksitle satış, satıcının, satılan taşınırı alıcıya satış bedelinin ödenmesinden önce teslim etmeyi, alıcının da satış bedelini kısım kısım ödemeyi üstlendikleri satıştır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Taksitle satış sözleşmesi, yazılı şekilde yapılmadıkça geçerli olmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Malın satıcının ticari faaliyeti kapsamında satılması hâlinde, sözleşmede aşağıdaki hususlar belirtilir:</template>
                  <mvz-bent no="1.">
                    <template>Tarafların adı ve yerleşim yeri.</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Satışın konusu.</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Satılanın peşin satış bedeli.</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Taksitle ödeme sebebiyle belirtilecek ilave bedel.</template>
                  </mvz-bent>
                  <mvz-bent no="5.">
                    <template>Toplam satış bedeli.</template>
                  </mvz-bent>
                  <mvz-bent no="6.">
                    <template>Alıcının nakden veya aynen üstlendiği diğer bütün edimler.</template>
                  </mvz-bent>
                  <mvz-bent no="7.">
                    <template>Peşinat ve taksitlerin tutarı ile vadesi ve ikiden az olmamak üzere taksit sayısı.</template>
                  </mvz-bent>
                  <mvz-bent no="8.">
                    <template>Alıcının yedi gün içinde sözleşme yapılması konusundaki irade açıklamasını geri alma hakkı.</template>
                  </mvz-bent>
                  <mvz-bent no="9.">
                    <template>Öngörülmüşse, mülkiyetin saklı tutulmasına veya satış bedeli alacağının devrine ilişkin anlaşma kayıtları.</template>
                  </mvz-bent>
                  <mvz-bent no="10.">
                    <template>Temerrüt veya vadenin ertelenmesi durumunda, yasal faiz oranının yüzde otuz fazlasını geçmemek üzere ödenecek faiz.</template>
                  </mvz-bent>
                  <mvz-bent no="11.">
                    <template>Sözleşmenin kurulduğu yer ve tarih.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Yasal temsilcinin rızası">
              <mvz-madde no="254" başlık="">
                <mvz-fıkra no="1">
                  <template>Ayırt etme gücüne sahip bir küçük veya kısıtlı tarafından yapılmış olan taksitle satış sözleşmesinin geçerliliği, yasal temsilcinin yazılı rızasına bağlıdır. Bu durumda rızanın, en geç sözleşmenin kurulduğu anda verilmiş olması gerekir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Sözleşmenin hüküm ve sonuçlarını doğurması ve geri alma açıklaması">
              <mvz-madde no="255" başlık="">
                <mvz-fıkra no="1">
                  <template>Taksitle satış sözleşmesi, alıcı bakımından, taraflarca imzalanmış sözleşmenin bir nüshasının eline geçmesinden yedi gün sonra hüküm ve sonuçlarını doğurur. Alıcı, bu süre içinde irade açıklamasını geri aldığını satıcıya yazılı olarak bildirebilir. Bu haktan önceden feragat edilemez. Geri alma bildiriminin sürenin son gününde postaya verilmiş olması, sonuç doğurması için yeterlidir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Satıcı geri alma süresi içinde malı alıcıya devretmişse alıcı, malı ancak olağan bir gözden geçirmenin gerektirdiği ölçüde kullanabilir; aksi takdirde sözleşme hüküm ve sonuçlarını doğurmuş olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Alıcının geri alma hakkını kullanması hâlinde, kendisinden cayma parası istenemez.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Tarafların hak ve borçları">
              <mvz-b4 no="a" başlık="Peşinatı ödeme borcu ve sözleşmenin süresi">
                <mvz-madde no="256" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alıcı, peşin satış bedelinin en az onda birini en geç teslim anında peşin olarak, satış bedelinin geri kalan kısmını da sözleşmenin kurulmasını izleyen üç yıl içinde ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Cumhurbaşkanı, satılanın türüne göre peşinat miktarı ile yasal ödeme sürelerini yarıya kadar indirebileceği gibi, iki katına kadar çıkartabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Kanunda belirlenen asgari peşinatı tamamen almaksızın, satılanı alıcıya devreden satıcı, peşinatın ödenmeyen kısmı üzerinde istem hakkını kaybeder.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Peşinattan vazgeçilmesi karşılığında, satış bedelinde yapılacak artırma hükümsüzdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Alıcının def’ileri">
                <mvz-madde no="257" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alıcı, satıcının taksitle satıştan doğan alacağı ile kendisinin satıcıdan olan alacağını takas etme hakkından önceden feragat edemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alacağın devredilmesi durumunda alıcının, satış bedeli alacağına ilişkin def’ileri sınırlanamaz ve ortadan kaldırılamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Satış bedelinin tamamen ödenmesi">
                <mvz-madde no="258" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taksit borcu kambiyo senedine bağlanmış olmadıkça, alıcı satış bedelinin kalan kısmını her zaman bir defada ödeyerek borcundan kurtulabilir. Bu durumda, peşin satış bedeline ilave edilen bedelin ödenmemiş taksitlere isabet eden kısmı, yarısından az olmamak üzere ödeme süresinin kısaltılmasına uygun olarak indirilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="5" başlık="Alıcının temerrüdü">
              <mvz-b4 no="a" başlık="Satıcının seçimlik hakkı">
                <mvz-madde no="259" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alıcı peşinatı ödemede temerrüde düşerse satıcı, sadece peşinatı isteyebilir veya sözleşmeden dönebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Alıcı taksitleri ödemede temerrüde düşerse satıcı, muaccel olmuş taksitlerin veya geri kalan satış bedelinin tamamının bir defada ödenmesini isteyebilir ya da sözleşmeden dönebilir. Satıcının geri kalan satış bedelinin tamamını isteyebilmesi veya sözleşmeden dönebilmesi, ancak bu hakkı açık biçimde saklı tutmuş olmasına ve alıcının kararlaştırılan satış bedelinin en az onda birini oluşturan ve birbirini izleyen en az iki taksidi veya en az dörtte birini oluşturan bir taksidi ya da en son taksidi ödemede temerrüde düşmüş olmasına bağlıdır. Ancak, satıcının dönme dolayısıyla isteyebileceği miktar, ödenmiş olan taksitler tutarına eşit veya daha fazla ise satıcı sözleşmeden dönemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Satıcı, satış bedelinin geri kalan kısmının tamamen ödenmesini isteme veya sözleşmeden dönme haklarını kullanmadan önce, alıcıya en az onbeş günlük bir süre tanımak zorundadır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Sözleşmeden dönme">
                <mvz-madde no="260" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satıcı, alıcının taksitleri ödemede temerrüde düşmesi sebebiyle satılanın alıcıya devrinden sonra sözleşmeden dönerse, her iki taraf aldığını geri vermekle yükümlüdür. Satıcı, ayrıca hakkaniyete uygun bir kullanım bedeli ve satılanın olağandışı kullanılması sebebiyle değerinin azalması hâlinde tazminat da isteyebilir. Ancak satıcı, sözleşme zamanında ifa edilmiş olsaydı elde edecek olduğundan fazlasını isteyemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satıcı, alıcının peşinatı ödemede temerrüde düşmesi yüzünden satılanın devrinden önce sözleşmeden dönerse, alıcıdan sadece ödenmeyen peşinat üzerinden, sözleşmeden döndüğü tarihe kadar işleyecek yasal faiz ile sözleşmenin kurulmasından sonra, satılanın uğramış olduğu değer kaybı sebebiyle tazminat isteyebilir. Ceza koşulu kararlaştırılmışsa, peşin satış bedelinin yüzde onunu aşamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Hâkimin müdahalesi">
                <mvz-madde no="261" başlık="">
                  <mvz-fıkra no="1">
                    <template>Hâkim, temerrüde düşen alıcının borçlarını ödeyeceği konusunda güvence vermesi ve satıcının da bu yeni düzenleme dolayısıyla herhangi bir zararının söz konusu olmaması koşuluyla, alıcıya ödeme kolaylıkları sağlayabilir ve satıcının satılanı geri almasını yasaklayabilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="6" başlık="Yetkili mahkeme ve tahkim">
              <mvz-madde no="262" başlık="">
                <mvz-fıkra no="1">
                  <template>Yerleşim yeri Türkiye’de olan alıcı, tarafı olduğu taksitle satış sözleşmesinden doğacak uyuşmazlıklar konusunda, yerleşim yerindeki mahkemenin yetkisinden önceden feragat edemeyeceği gibi, tahkim sözleşmesi de yapamaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="7" başlık="Uygulama alanı">
              <mvz-madde no="263" başlık="">
                <mvz-fıkra no="1">
                  <template>Taksitle satışa ilişkin hükümler, aynı ekonomik amaçla yapılan işlemlere de uygulanır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Bir taşınırı edinme amacıyla yapılan ödünç sözleşmelerinde satıcının, mülkiyeti saklı tutma kaydı ile birlikte veya bundan bağımsız olarak satış bedeli alacağını ödünç verene devretmesi veya satıcı ile ödünç verenin başka surette anlaşarak, alıcının satış bedelini daha sonra taksitler hâlinde ödemek üzere malın teslimini sağlamaları durumunda, taksitle satışa ilişkin hükümler kıyas yoluyla uygulanır. Ödünç sözleşmesinde, taksitle satış sözleşmelerine konulması zorunlu olan hususların yer alması şarttır. Ancak, bunlardan peşin satış bedeli ile toplam satış bedeli yerine, ödünç alınan miktar ile ödünç verene ödenecek toplam ödünç miktarı gösterilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Peşin satışla bağlantılı taksitle ödünç sözleşmelerinde, ödünç verene, yasal asgari peşinatın ödenmiş ve peşin satış bedelinin ödünç sözleşmesinin yapılması sırasında herhangi bir ilave yapılmaksızın tamamen karşılanmış olması hâlinde, taksitle satışa ilişkin hükümler uygulanmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>Alıcının tacir sıfatıyla hareket ettiği veya malın bir ticari işletmenin ihtiyacı için ya da meslekî amaçlarla satın alınması durumunda, taksitle satışa ilişkin hükümlerden sadece 259 uncu maddenin ikinci fıkrası, 260 ıncı maddenin birinci fıkrası ve 261 inci maddesi hükümleri uygulanır.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Ön ödemeli taksitle satış">
            <mvz-b3 no="1" başlık="Tanımı, şekli ve içeriği">
              <mvz-madde no="264" başlık="">
                <mvz-fıkra no="1">
                  <template>Ön ödemeli taksitle satış, alıcının taşınır bir malın satış bedelini önceden kısım kısım ödemeyi, satıcının da bedelin tamamen ödenmesinden sonra satılanı alıcıya devretmeyi üstlendikleri satıştır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Ön ödemeli taksitle satış sözleşmesi, yazılı şekilde yapılmadıkça geçerli olmaz. Sözleşmede aşağıdaki hususlar belirtilir:</template>
                  <mvz-bent no="1.">
                    <template>Tarafların adı ve yerleşim yeri.</template>
                  </mvz-bent>
                  <mvz-bent no="2.">
                    <template>Satışın konusu.</template>
                  </mvz-bent>
                  <mvz-bent no="3.">
                    <template>Toplam satış bedeli.</template>
                  </mvz-bent>
                  <mvz-bent no="4.">
                    <template>Taksitlerin sayısı, tutarı, vadesi ve sözleşmenin süresi.</template>
                  </mvz-bent>
                  <mvz-bent no="5.">
                    <template>Taksitleri kabule yetkili banka.</template>
                  </mvz-bent>
                  <mvz-bent no="6.">
                    <template>Alıcıya karşı üstlenilen faiz miktarı.</template>
                  </mvz-bent>
                  <mvz-bent no="7.">
                    <template>Alıcının yedi gün içinde sözleşme yapılması konusundaki irade açıklamasını geri alma hakkı.</template>
                  </mvz-bent>
                  <mvz-bent no="8.">
                    <template>Alıcının sözleşmeden cayma hakkı ve bu sebeple ödeyeceği cayma parası.</template>
                  </mvz-bent>
                  <mvz-bent no="9.">
                    <template>Sözleşmenin kurulduğu yer ve tarih.</template>
                  </mvz-bent>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Tarafların hak ve borçları">
              <mvz-b4 no="a" başlık="Ödemelerin güvenceye bağlanması">
                <mvz-madde no="265" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ödeme süresi bir yıldan daha uzun veya belirsiz olan sözleşmelerde alıcı, ödemeleri sözleşmede belirtilen bir bankada kendi adına açılacak gelir getiren bir tasarruf veya yatırım hesabına yatırmakla yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Banka, her iki tarafın çıkarlarını gözetmek zorundadır. Açılan hesaptan her iki tarafın rızasıyla ödeme yapılabilir. Bu rıza önceden verilemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Ödeme süresi bir yıldan daha uzun veya belirsiz olan sözleşmelerde alıcı, satılanın devrine kadar 269 uncu madde uyarınca sözleşmeden cayarsa satıcı, bu hesap üzerindeki bütün haklarını kaybeder.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Alıcının malın devrini isteme hakkı">
                <mvz-madde no="266" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alıcı satış bedelinin tamamını ödedikten sonra, her zaman malın kendisine devredilmesini isteyebilir. Ancak, satıcı malı başkasından sağlayarak devredecek ise alıcı, bunun için kendisine uygun bir süre tanımak zorundadır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satıcının malı alıcıya devredebilmesi için, taksitle satışa ilişkin koşullara uyulması gerekir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Alıcı birden çok şey satın almış veya seçim hakkını saklı tutmuş ise, satılanın kısım kısım devredilmesini, ancak 256 ncı maddede öngörülen asgari peşinatı ödedikten sonra isteyebilir. Satılanın eşya topluluğu oluşturduğu hâllerde bu istemde bulunulamaz. Satış bedelinin tamamen ödenmemesi hâlinde, satıcıdan satılanı kısmen devretmesi, ancak geri kalan kısmın yüzde onunun kendisine güvence olarak bırakılması koşuluyla istenebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Satış bedelinin ödenmesi">
                <mvz-madde no="267" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ödeme süresi bir yıldan daha uzun veya belirsiz olan sözleşmelerde satış bedelinin, satılanın devri anında tamamen ödenmiş olması gerekir. Satılanın devredilmesini isteyen alıcı, hesabındaki bakiyeden, satış bedelinin en çok üçte birlik kısmını satıcı lehine serbest bırakabilir. Ancak, sözleşmenin kuruluşu sırasında buna ilişkin taahhütte bulunulamaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Satış bedelinin belirlenmesi">
                <mvz-madde no="268" başlık="">
                  <mvz-fıkra no="1">
                    <template>Satıcının sözleşmenin kurulduğu sırada belirlenen toplam satış bedeline ek bir bedel isteme hakkını saklı tutan bütün kayıtlar geçersizdir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ödenecek toplam satış bedeli sözleşmede belirlenmiş olmakla birlikte, devredilecek eşya önceden belirlenmemiş ve satıcı tarafından bu eşyayı seçme hakkı alıcıya tanınmış ise satıcı, peşin satıştaki olağan bedelleri göz önünde tutmak suretiyle alıcının yapacağı seçime tam olarak uymakla yükümlüdür.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Buna aykırı anlaşmalar, ancak alıcının yararına olduğu ölçüde geçerlidir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Sözleşmenin sona ermesi">
              <mvz-b4 no="a" başlık="Cayma hakkı">
                <mvz-madde no="269" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ödeme süresi bir yıldan daha uzun veya belirsiz olan sözleşmelerde alıcı, malın devrine kadar her zaman sözleşmeden cayabilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Sözleşmeden cayma hâlinde alıcı tarafından ödenmesi öngörülen cayma parası, durumun özelliğine ve sözleşmenin kurulması ile cayma arasında geçen süreye bakılarak belirlenir. Ancak, bu miktar satıcının toplam alacağının yüzde ikisinden az ve yüzde beşinden fazla olamaz. Alıcı, yapmış olduğu ödemelerin cayma parasını aşan kısmının, getirileri ile birlikte kendisine geri verilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Alıcının ölmesi veya kazanç elde etmekten sürekli olarak yoksun kalması sebebiyle ön ödemeleri yapamayacak duruma düşmesi ya da sözleşmenin yerine olağan koşullarla yapılacak bir taksitle satış sözleşmesinin konulmasına ilişkin önerisinin satıcı tarafından kabul edilmemesi yüzünden sözleşmeden cayılmış olursa, cayma parası istenemez.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Sözleşmenin süresi">
                <mvz-madde no="270" başlık="">
                  <mvz-fıkra no="1">
                    <template>Ön ödemeleri ifa borcu, beş yılın geçmesiyle sona erer.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ödeme süresi bir yıldan daha uzun veya belirsiz olan sözleşmelerde alıcı, sekiz yıl geçtiği hâlde satılanın devri isteminde bulunmazsa, satıcı kendisini uyararak üç aylık süre tanır. Alıcı bu süre içinde kayıtsız kalırsa satıcı, alıcıya sözleşmeden cayma hâlinde tanınan haklara sahip olur.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Alıcının temerrüdü">
                <mvz-madde no="271" başlık="">
                  <mvz-fıkra no="1">
                    <template>Alıcı bir veya daha çok ön ödemede temerrüde düşerse satıcı, ancak vadesi gelmiş olan ödemeleri isteyebilir. Bununla birlikte, toplam alacağın en az onda birini oluşturan ve birbirini izleyen iki ön ödemenin veya toplam alacağın en az dörtte birini oluşturan bir tek ön ödemenin ya da sonuncu ön ödemenin vadesi gelmişse satıcı, ayrıca alıcıya tanıyacağı bir aylık ödeme süresinin geçmesinden sonra sözleşmeden dönme hakkına sahip olur.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Satıcı, ödeme süresi bir yıl veya daha az olan sözleşmeden dönerse, 260 ıncı maddenin ikinci fıkrası hükmü kıyas yoluyla uygulanır. Süresi bir yılı aşan sözleşmelerde satıcı, ancak 269 uncu maddenin ikinci fıkrasında öngörülen cayma parasını ve alıcıya ödenmesi gereken ortalama banka mevduat faizini aşan zararlarının giderilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Bir yıldan daha uzun süreli sözleşmelerde temerrüde düşmüş olan alıcının malın devrini istemesi hâlinde satıcı, yasal anapara faizi ile birlikte, devir isteminden sonra malın değerinde oluşacak eksilmelerin giderilmesini isteyebilir. Ceza koşulu öngörülmüşse miktarı, satış bedelinin yüzde onunu geçemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Satılanın devredilmiş olduğu hâllerde, dönme konusunda 260 ıncı maddenin birinci fıkrası hükmü uygulanır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Uygulama alanının sınırlanması">
              <mvz-madde no="272" başlık="">
                <mvz-fıkra no="1">
                  <template>Alıcının tacir sıfatıyla hareket etmesi veya malın bir ticari işletmenin ihtiyacı için ya da meslekî amaçlarla satın alınması durumunda, 264 ilâ 271 inci maddeler uygulanmaz.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Ortak hükümler">
            <mvz-madde no="273" başlık="">
              <mvz-fıkra no="1">
                <template>Taksitle satışa ilişkin hükümlerden yasal temsilcinin rızasına, sözleşmenin hüküm ve sonuçlarını doğurmasına ve geri alma açıklamasına, alıcının def’ilerine, satıcının alacağının devrine, hâkim tarafından sağlanan ödeme kolaylıklarına ve yetkili mahkeme ile tahkime ilişkin olanlar, ön ödemeli taksitle satışa da uygulanır.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Satılanı devir süresi bir yıldan daha uzun veya belirsiz olan taksitle satışta alıcı, satılanın devrinden önce ödemeleri yapmakla yükümlü ise, ön ödemeli taksitle satışa ilişkin hükümler kıyas yoluyla uygulanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
        <mvz-b1 no="D" başlık="Açık artırma yoluyla satış">
          <mvz-b2 no="I" başlık="Tanımı">
            <mvz-madde no="274" başlık="">
              <mvz-fıkra no="1">
                <template>Açık artırma yoluyla satış; yeri, zamanı ve koşulları önceden belirlenerek, hazır olanlar arasından en yüksek bedeli öneren ile yapılan satıştır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Kurulması">
            <mvz-madde no="275" başlık="">
              <mvz-fıkra no="1">
                <template>Satıcı artırma koşullarında aksi yönde bir irade açıklamasında bulunmamışsa, herkesin katılabileceği isteğe bağlı açık artırmalarda satış sözleşmesi, artırmayı yönetenin en yüksek bedeli öneren kişiye ihale etmesiyle kurulmuş olur.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Cebrî artırma yoluyla satış, artırmayı yöneten memurun en yüksek bedeli öneren kişiye ihale etmesiyle kurulmuş olur.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Hükümleri">
            <mvz-b3 no="1" başlık="Artırmaya katılanın bağlandığı an">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="276" başlık="">
                  <mvz-fıkra no="1">
                    <template>Artırmaya katılan kişi, satış için konulmuş olan koşullar çerçevesinde önerisiyle bağlıdır.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Aksine bir koşul yoksa, öneride bulunanın bağlılığı, kendisinden daha yüksek bir öneri yapılmasıyla sona erer veya daha yüksek öneri olup olmadığının sorulması üzerine böyle bir önerinin olmadığının anlaşılması hâlinde, önerisinin hemen kabul edilmemesiyle ortadan kalkar.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Taşınmazın açık artırma yoluyla satışında">
                <mvz-madde no="277" başlık="">
                  <mvz-fıkra no="1">
                    <template>Taşınmazın açık artırma yoluyla satışında, ihalenin veya reddinin artırmadan hemen sonra yapılması gerekir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Öneride bulunanın bağlılığının artırmadan sonra da devam edeceğini öngören koşul geçersizdir. Ancak, bu kural cebrî artırmalarda ve ihalenin bir kamu görevlisince onaylanması gerektiği durumlarda uygulanmaz.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Ödemenin peşin olması gereği">
              <mvz-madde no="278" başlık="">
                <mvz-fıkra no="1">
                  <template>Artırma koşullarında aksi kararlaştırılmamışsa, ihale bedelinin peşin ödenmesi gerekir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>İhale bedeli peşin olarak veya artırma koşulları uyarınca ödenmezse satıcı, satıştan hemen dönebilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="3" başlık="Mülkiyetin geçmesi">
              <mvz-madde no="279" başlık="">
                <mvz-fıkra no="1">
                  <template>Artırmada taşınır bir mal alan kişi, onun mülkiyetini ihale anında kazanır. Artırmadan alınan taşınmazın mülkiyeti, ancak tapu siciline tescille alıcıya geçer.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Artırma görevlisi, satış tutanağında gösterilen taşınmazın alıcı adına tescilini hemen tapu idaresine bildirir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>Cebrî artırma sonucunda yapılan ihalelerde mülkiyetin geçmesine ilişkin özel hükümler saklıdır.</template>
                </mvz-fıkra>
                <mvz-fıkra no="4">
                  <template>İsteğe bağlı özel artırmalarda mülkiyetin geçmesi genel hükümlere tabidir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="4" başlık="Zapttan ve ayıptan sorumluluk">
              <mvz-madde no="280" başlık="">
                <mvz-fıkra no="1">
                  <template>Cebrî artırmalarda zapttan ve ayıptan sorumluluğa ilişkin hükümler uygulanmaz.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Artırmadan mal alan kişi, o mala, tapu siciline veya satış koşullarına ya da kanuna göre belirli olan durumu, hakları ve yükleri ile birlikte malik olur.</template>
                </mvz-fıkra>
                <mvz-fıkra no="3">
                  <template>İsteğe bağlı açık artırmalarda satıcı, satılanın zaptından ve ayıplarından sorumludur. Ancak, aldatma durumu dışında, artırma koşullarında açıkça belirtip duyurmak suretiyle bu sorumluluktan kurtulabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Artırmanın iptali">
            <mvz-madde no="281" başlık="">
              <mvz-fıkra no="1">
                <template>Hukuka veya ahlaka aykırı yollara başvurularak ihalenin gerçekleştirilmesi sağlanmışsa her ilgili, iptal sebebini öğrendiği günden başlayarak on gün ve her hâlde ihale tarihini izleyen bir yıl içinde ihalenin iptalini mahkemeden isteyebilir.</template>
              </mvz-fıkra>
              <mvz-fıkra no="2">
                <template>Cebrî artırmalar hakkında özel hükümler saklıdır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
        </mvz-b1>
      </mvz-ayırım>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Mal Değişim Sözleşmesi">
      <mvz-b1 no="A" başlık="Tanımı">
        <mvz-madde no="282" başlık="">
          <mvz-fıkra no="1">
            <template>Mal değişim sözleşmesi, taraflardan birinin diğer tarafa bir veya birden çok şeyin zilyetlik ve mülkiyetini, diğer tarafın da karşı edim olarak başka bir veya birden çok şeyin zilyetlik ve mülkiyetini devretmeyi üstlendiği sözleşmedir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Tabi olduğu hükümler">
        <mvz-madde no="283" başlık="">
          <mvz-fıkra no="1">
            <template>Satış sözleşmesine ilişkin hükümler, mal değişim sözleşmesine de uygulanır; buna göre taraflardan her biri, vermeyi üstlendiği şey bakımından satıcı, kendisine verilmesi üstlenilen şey bakımından alıcı durumundadır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Zapttan ve ayıptan sorumluluk">
        <mvz-madde no="284" başlık="">
          <mvz-fıkra no="1">
            <template>Satış sözleşmesinin zapttan ve ayıptan sorumluluğa ilişkin hükümleri uygun düştüğü ölçüde, mal değişim sözleşmesine de uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Bağışlama Sözleşmesi">
      <mvz-b1 no="A" başlık="Tanımı">
        <mvz-madde no="285" başlık="">
          <mvz-fıkra no="1">
            <template>Bağışlama sözleşmesi, bağışlayanın sağlararası sonuç doğurmak üzere, malvarlığından bağışlanana karşılıksız olarak bir kazandırma yapmayı üstlendiği sözleşmedir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Henüz edinilmemiş olan bir haktan feragat etmek veya bir mirası reddetmek, bağışlama değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ahlaki bir ödevin yerine getirilmesi de bağışlama sayılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Bağışlama ehliyeti">
        <mvz-b2 no="I" başlık="Bağışlayan için">
          <mvz-madde no="286" başlık="">
            <mvz-fıkra no="1">
              <template>Fiil ehliyetine sahip olan herkes, eşler arasındaki mal rejiminden veya miras hukukundan doğan sınırlamalar saklı kalmak üzere, bağışlama yapabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bağışlamayı izleyen bir yıl içinde başlatılmış bir yargılama sonucunda bağışlayanın, savurganlığı yüzünden kısıtlanmasına karar verilirse, o bağışlama mahkemece iptal edilebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Bağışlanan için">
          <mvz-madde no="287" başlık="">
            <mvz-fıkra no="1">
              <template>Fiil ehliyeti bulunmayan kişi ayırt etme gücüne sahipse, bağışlamayı kabul edebilir. Ancak, bağışlananın yasal temsilcisi bu kişinin bağışlamayı kabulünü yasaklar veya bağışlanılan şeyin geri verilmesini emrederse, bağışlama ortadan kalkar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Kurulması">
        <mvz-b2 no="I" başlık="Bağışlama sözü verme">
          <mvz-madde no="288" başlık="">
            <mvz-fıkra no="1">
              <template>Bağışlama sözü vermenin geçerliliği, bu sözleşmenin yazılı şekilde yapılmasına bağlıdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bir taşınmazın veya taşınmaz üzerindeki ayni bir hakkın bağışlanması sözü vermenin geçerliliği, ancak resmî şekilde yapılmış olmasına bağlıdır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Şekle uyulmaması sebebiyle geçersiz olan bağışlama sözü verme, bağışlayan tarafından yerine getirildiğinde, elden bağışlama hükmündedir. Ancak, geçerliliği resmî şekle bağlanmış olan bağışlamalarda bu hüküm uygulanmaz.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Elden bağışlama">
          <mvz-madde no="289" başlık="">
            <mvz-fıkra no="1">
              <template>Elden bağışlama, bağışlayanın bir taşınırını bağışlanana teslim etmesiyle kurulmuş olur.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Koşullu bağışlama">
          <mvz-madde no="290" başlık="">
            <mvz-fıkra no="1">
              <template>Bağışlama, bir koşula bağlanarak yapılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yerine getirilmesi bağışlayanın ölümüne bağlı olan bağışlamada, vasiyete ilişkin hükümler uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Yüklemeli bağışlama">
          <mvz-madde no="291" başlık="">
            <mvz-fıkra no="1">
              <template>Bağışlayan bağışlamasına yüklemeler koyabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bağışlayan, sözleşme gereğince bağışlanan tarafından kabul edilmiş olan yüklemelerin yerine getirilmesini isteyebilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Kamu yararına olarak bağışlamaya konulmuş olan bir yüklemenin yerine getirilmesini isteme yetkisi, bağışlayanın ölümünden sonra, ilgili kamu kurumuna geçer.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bağışlama konusunun değeri, yüklemenin yerine getirilmesi masraflarını karşılamaz ve aşan kısım kendisine ödenmezse bağışlanan, yüklemeyi yerine getirmekten kaçınabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="V" başlık="Bağışlayana dönme koşullu bağışlama">
          <mvz-madde no="292" başlık="">
            <mvz-fıkra no="1">
              <template>Bağışlayan, bağışlananın kendisinden önce ölmesi durumunda, bağışlama konusunun kendisine dönmesi koşulunu koyabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bağışlama konusu, taşınmaza veya taşınmaz üzerindeki bir ayni hakka ilişkin ise, bağışlayana dönme koşulu tapu siciline şerh verilebilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="VI" başlık="Bağışlama önerisinin geri alınması">
          <mvz-madde no="293" başlık="">
            <mvz-fıkra no="1">
              <template>Bir kimse başkasına bağışlamayı önerdiği bir malı, başka mallarından fiilen ayırmış olsa bile, bağışlananın kabulüne kadar, bağışlama önerisini geri alabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
      <mvz-b1 no="D" başlık="Bağışlayanın sorumluluğu">
        <mvz-madde no="294" başlık="">
          <mvz-fıkra no="1">
            <template>Bağışlayan, bağışlamadan doğan zarardan bu zarara ağır kusuruyla sebep olmadıkça, bağışlanana karşı sorumlu değildir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bağışlayan, bağışlanılan şey veya alacak hakkında ayrıca garanti sözü vermişse, bununla sorumlu olur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="E" başlık="Bağışlamanın ortadan kalkması">
        <mvz-b2 no="I" başlık="Bağışlamanın geri alınması">
          <mvz-madde no="295" başlık="">
            <mvz-fıkra no="1">
              <template>Bağışlayan, aşağıdaki durumlardan biri gerçekleşmişse, elden bağışlamayı veya yerine getirdiği bağışlama sözünü geri alabilir ve bağışlananın istem tarihindeki zenginleşmesi ölçüsünde, bağışlama konusunun geri verilmesini isteyebilir:</template>
              <mvz-bent no="1.">
                <template>Bağışlanan, bağışlayana veya yakınlarından birine karşı ağır bir suç işlemişse.</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Bağışlanan, bağışlayana veya onun ailesinden bir kimseye karşı kanundan doğan yükümlülüklerine önemli ölçüde aykırı davranmışsa.</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Bağışlanan, yüklemeli bağışlamada haklı bir sebep olmaksızın yüklemeyi yerine getirmemişse.</template>
              </mvz-bent>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Bağışlama sözü vermenin geri alınması ve ifadan kaçınma">
          <mvz-madde no="296" başlık="">
            <mvz-fıkra no="1">
              <template>Bağışlama sözü veren, aşağıdaki durumlarda sözünü geri alabilir ve onu ifadan kaçınabilir:</template>
              <mvz-bent no="1.">
                <template>Elden bağışlanılan bir malın geri verilmesini isteyebileceği sebeplerden biri varsa.</template>
              </mvz-bent>
              <mvz-bent no="2.">
                <template>Mali durumu, sonradan sözün yerine getirilmesini kendisi için olağanüstü ağır kılacak ölçüde değişmişse.</template>
              </mvz-bent>
              <mvz-bent no="3.">
                <template>Bağışlama sözü verdikten sonra, kendisi için yeni aile yükümlülükleri doğmuş veya bu yükümlülükleri önemli ölçüde ağırlaşmışsa.</template>
              </mvz-bent>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bağışlama sözü verenin borcunu ödeme güçsüzlüğü belirlenir veya iflasına karar verilirse, ifa yükümlülüğü ortadan kalkar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Geri alma hakkının süresi ve mirasçılara geçmesi">
          <mvz-madde no="297" başlık="">
            <mvz-fıkra no="1">
              <template>Bağışlayan, geri alma sebebini öğrendiği günden başlayarak bir yıl içinde bağışlamayı geri alabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Bağışlayan bir yıllık süre dolmadan ölürse, geri alma hakkı mirasçılarına geçer ve mirasçıları bu sürenin sona ermesine kadar bu hakkı kullanabilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bağışlayan, sağlığında geri alma sebebini öğrenememişse, mirasçıları, ölümünden başlayarak bir yıl içinde bağışlamayı geri alma hakkını kullanabilirler.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bağışlanan, bağışlayanı kasten ve hukuka aykırı olarak öldürür veya onun geri alma hakkını kullanmasını engellerse, mirasçıları bağışlamayı geri alabilirler.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Bağışlayanın ölümü">
          <mvz-madde no="298" başlık="">
            <mvz-fıkra no="1">
              <template>Aksi kararlaştırılmamışsa, dönemsel edimleri içeren bağışlama, bağışlayanın ölümüyle sona erer.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Kira Sözleşmesi">
      <mvz-ayırım no="1-BİRİNCİ" başlık="Genel Hükümler">
        <mvz-b1 no="A" başlık="Tanımı">
          <mvz-madde no="299" başlık="">
            <mvz-fıkra no="1">
              <template>Kira sözleşmesi, kiraya verenin bir şeyin kullanılmasını veya kullanmayla birlikte ondan yararlanılmasını kiracıya bırakmayı, kiracının da buna karşılık kararlaştırılan kira bedelini ödemeyi üstlendiği sözleşmedir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="B" başlık="Kira süresi">
          <mvz-madde no="300" başlık="">
            <mvz-fıkra no="1">
              <template>Kira sözleşmesi, belirli ve belirli olmayan bir süre için yapılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Kararlaştırılan sürenin geçmesiyle herhangi bir bildirim olmaksızın sona erecek kira sözleşmesi belirli sürelidir; diğer kira sözleşmeleri belirli olmayan bir süre için yapılmış sayılır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b1>
        <mvz-b1 no="C" başlık="Kiraya verenin borçları">
          <mvz-b2 no="I" başlık="Teslim borcu">
            <mvz-madde no="301" başlık="">
              <mvz-fıkra no="1">
                <template>Kiraya veren, kiralananı kararlaştırılan tarihte, sözleşmede amaçlanan kullanıma elverişli bir durumda teslim etmek ve sözleşme süresince bu durumda bulundurmakla yükümlüdür. Bu hüküm, konut ve çatılı işyeri kiralarında kiracı aleyhine değiştirilemez; diğer kira sözleşmelerinde ise, kiracı aleyhine genel işlem koşulları yoluyla bu hükme aykırı düzenleme yapılamaz.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="II" başlık="Vergi ve benzeri yükümlülüklere katlanma borcu">
            <mvz-madde no="302" başlık="">
              <mvz-fıkra no="1">
                <template>Kiralananla ilgili zorunlu sigorta, vergi ve benzeri yükümlülüklere, aksi kararlaştırılmamış veya kanunda öngörülmemiş ise, kiraya veren katlanır.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="III" başlık="Yan giderlere katlanma borcu">
            <mvz-madde no="303" başlık="">
              <mvz-fıkra no="1">
                <template>Kiraya veren, kiralananın kullanımıyla ilgili olmak üzere, kendisi veya üçüncü kişi tarafından yapılan yan giderlere katlanmakla yükümlüdür.</template>
              </mvz-fıkra>
            </mvz-madde>
          </mvz-b2>
          <mvz-b2 no="IV" başlık="Kiraya verenin kiralananın ayıplarından sorumluluğu">
            <mvz-b3 no="1" başlık="Kiralananın teslim anındaki ayıplarından sorumluluk">
              <mvz-madde no="304" başlık="">
                <mvz-fıkra no="1">
                  <template>Kiralananın önemli ayıplarla teslimi hâlinde kiracı, borçlunun temerrüdüne veya kiraya verenin kiralananın sonradan ayıplı duruma gelmesinden doğan sorumluluğuna ilişkin hükümlere başvurabilir.</template>
                </mvz-fıkra>
                <mvz-fıkra no="2">
                  <template>Kiralananın önemli olmayan ayıplarla tesliminde ise kiracı, kiralananda sonradan ortaya çıkan ayıplardan dolayı kiraya verenin sorumluluğuna ilişkin hükümlere başvurabilir.</template>
                </mvz-fıkra>
              </mvz-madde>
            </mvz-b3>
            <mvz-b3 no="2" başlık="Kiralananın sonradan ayıplı hâle gelmesinden sorumluluk">
              <mvz-b4 no="a" başlık="Genel olarak">
                <mvz-madde no="305" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kiralanan sonradan ayıplı duruma gelirse kiracı, kiraya verenden ayıpların giderilmesini veya kira bedelinden ayıpla orantılı bir indirim yapılmasını ya da zararının giderilmesini isteyebilir. Ancak, zararın giderilmesi istemi diğer seçimlik hakların kullanılmasını önlemez.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Önemli ayıp durumunda kiracının sözleşmeyi fesih hakkı saklıdır.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="b" başlık="Ayıbın giderilmesini isteme ve fesih">
                <mvz-madde no="306" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kiracı, kiraya verenden kiralanandaki ayıbın uygun bir sürede giderilmesini isteyebilir; bu sürede ayıp giderilmezse kiracı, ayıbı kiraya veren hesabına gidertebilir ve bundan doğan alacağını kira bedelinden indirebilir veya kiralananın ayıpsız bir benzeri ile değiştirilmesini isteyebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="2">
                    <template>Ayıbın, kiralananın öngörülen kullanıma elverişliliğini ortadan kaldırması ya da önemli ölçüde engellemesi ve verilen sürede giderilmemesi hâlinde kiracı, sözleşmeyi feshedebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="3">
                    <template>Kiraya veren, kiralanandaki ayıbı gidermek yerine, uygun bir süre içinde ayıpsız benzeriyle değiştirebilir.</template>
                  </mvz-fıkra>
                  <mvz-fıkra no="4">
                    <template>Kiraya veren, kiracıya aynı malın ayıpsız bir benzerini hemen vererek ve uğradığı zararın tamamını gidererek, onun seçimlik haklarını kullanmasını önleyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="c" başlık="Kira bedelinin indirilmesi">
                <mvz-madde no="307" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kiracı, kiralananın kullanımını etkileyen ayıpların varlığı hâlinde, bu ayıpların kiraya veren tarafından öğrenilmesinden ayıbın giderilmesine kadar geçen süre için, kira bedelinden ayıpla orantılı bir indirim yapılmasını isteyebilir.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
              <mvz-b4 no="d" başlık="Zararın giderimi">
                <mvz-madde no="308" başlık="">
                  <mvz-fıkra no="1">
                    <template>Kiraya veren, kusuru olmadığını ispat etmedikçe, kiralananın ayıplı olmasından doğan zararları kiracıya ödemekle yükümlüdür.</template>
                  </mvz-fıkra>
                </mvz-madde>
              </mvz-b4>
            </mvz-b3>
          </mvz-b2>
          <mvz-b2 no="V" başlık="Üçüncü kişinin ileri sürdüğü haklar sebebiyle sorumluluk">
