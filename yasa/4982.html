  <mvz-künye tür="kanun" no="4982" başlık="BİLGİ EDİNME HAKKI KANUNU"
             tarih="9/10/2003" rgazete-tarih="24/10/2003" rgazete-sayı="25269"
             düstur-tertip="5" düstur-cilt="42" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; demokratik ve şeffaf yönetimin gereği olan eşitlik, tarafsızlık ve açıklık ilkelerine uygun olarak kişilerin bilgi edinme hakkını kullanmalarına ilişkin esas ve usulleri düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun; kamu kurum ve kuruluşları ile kamu kurumu niteliğindeki meslek kuruluşlarının faaliyetlerinde uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>1.11.1984 tarihli ve 3071 sayılı Dilekçe Hakkının Kullanılmasına Dair Kanun hükümleri saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(İptal)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen;</template>
        <mvz-bent no="a">
          <template>Kurum ve kuruluş: Bu Kanunun 2 nci maddesinde geçen ve kapsama dahil olan bilgi edinme başvurusu yapılacak bütün makam ve mercileri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Başvuru sahibi: Bu Kanun kapsamında bilgi edinme hakkını kullanarak kurum ve kuruluşlara başvuran gerçek ve tüzel kişileri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bilgi: Kurum ve kuruluşların sahip oldukları kayıtlarda yer alan bu Kanun kapsamındaki her türlü veriyi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Belge: Kurum ve kuruluşların sahip oldukları bu Kanun kapsamındaki yazılı, basılı veya çoğaltılmış dosya, evrak, kitap, dergi, broşür, etüt, mektup, program, talimat, kroki, plân, film, fotoğraf, teyp ve video kaseti, harita, elektronik ortamda kaydedilen her türlü bilgi, haber ve veri taşıyıcılarını,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bilgi veya belgeye erişim: İstenen bilgi veya belgenin niteliğine göre, kurum ve kuruluşlarca, başvuru sahibine söz konusu bilgi veya belgenin bir kopyasının verilmesini, kopya verilmesinin mümkün olmadığı hâllerde, başvuru sahibinin bilgi veya belgenin aslını inceleyerek not almasına veya içeriğini görmesine veya işitmesine izin verilmesini,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kurul: Bilgi Edinme Değerlendirme Kurulunu,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Bilgi Edinme Hakkı ve Bilgi Verme Yükümlülüğü">
    <mvz-madde no="4" başlık="Bilgi edinme hakkı">
      <mvz-fıkra no="1">
        <template>Herkes bilgi edinme hakkına sahiptir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Türkiye'de ikamet eden yabancılar ile Türkiye'de faaliyette bulunan yabancı tüzel kişiler, isteyecekleri bilgi kendileriyle veya faaliyet alanlarıyla ilgili olmak kaydıyla ve karşılıklılık ilkesi çerçevesinde, bu Kanun hükümlerinden yararlanırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Türkiye'nin taraf olduğu uluslararası sözleşmelerden doğan hak ve yükümlülükleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Bilgi verme yükümlülüğü">
      <mvz-fıkra no="1">
        <template>Kurum ve kuruluşlar, bu Kanunda yer alan istisnalar dışındaki her türlü bilgi veya belgeyi başvuranların yararlanmasına sunmak ve bilgi edinme başvurularını etkin, süratli ve doğru sonuçlandırmak üzere, gerekli idarî ve teknik tedbirleri almakla yükümlüdürler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun yürürlüğe girdiği tarihten itibaren diğer kanunların bu Kanuna aykırı hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Bilgi Edinme Başvurusu">
    <mvz-madde no="6" başlık="Başvuru usulü">
      <mvz-fıkra no="1">
        <template>Bilgi edinme başvurusu, başvuru sahibinin adı ve soyadı, imzası, oturma yeri veya iş adresini, başvuru sahibi tüzel kişi ise tüzel kişinin unvanı ve adresi ile yetkili kişinin imzasını ve yetki belgesini içeren dilekçe ile istenen bilgi veya belgenin bulunduğu kurum veya kuruluşa yapılır. Bu başvuru, kişinin kimliğinin ve imzasının veya yazının kimden neşet ettiğinin tespitine yarayacak başka bilgilerin yasal olarak belirlenebilir olması kaydıyla elektronik ortamda veya diğer iletişim araçlarıyla da yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dilekçede, istenen bilgi veya belgeler açıkça belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="İstenecek bilgi veya belgenin niteliği">
      <mvz-fıkra no="1">
        <template>Bilgi edinme başvurusu, başvurulan kurum ve kuruluşların ellerinde bulunan veya görevleri gereği bulunması gereken bilgi veya belgelere ilişkin olmalıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurum ve kuruluşlar, ayrı veya özel bir çalışma, araştırma, inceleme ya da analiz neticesinde oluşturulabilecek türden bir bilgi veya belge için yapılacak başvurulara olumsuz cevap verebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İstenen bilgi veya belge, başvurulan kurum ve kuruluştan başka bir yerde bulunuyorsa, başvuru dilekçesi bu kurum ve kuruluşa gönderilir ve durum ilgiliye yazılı olarak bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Yayımlanmış veya kamuya açıklanmış bilgi veya belgeler">
      <mvz-fıkra no="1">
        <template>Kurum ve kuruluşlarca yayımlanmış veya yayın, broşür, ilân ve benzeri yollarla kamuya açıklanmış bilgi veya belgeler, bilgi edinme başvurularına konu olamaz. Ancak, yayımlanmış veya kamuya açıklanmış bilgi veya belgelerin ne şekilde, ne zaman ve nerede yayımlandığı veya açıklandığı başvurana bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Gizli bilgileri ayırarak bilgi veya belge verme">
      <mvz-fıkra no="1">
        <template>İstenen bilgi veya belgelerde, gizlilik dereceli veya açıklanması yasaklanan bilgiler ile açıklanabilir nitelikte olanlar birlikte bulunuyor ve bunlar birbirlerinden ayrılabiliyorsa, söz konusu bilgi veya belge, gizlilik dereceli veya açıklanması yasaklanan bilgiler çıkarıldıktan sonra başvuranın bilgisine sunulur. Ayırma gerekçesi başvurana yazılı olarak bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Bilgi veya belgeye erişim">
      <mvz-fıkra no="1">
        <template>Kurum ve kuruluşlar, başvuru sahibine istenen belgenin onaylı bir kopyasını verirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bilgi veya belgenin niteliği gereği kopyasının verilmesinin mümkün olmadığı veya kopya çıkarılmasının aslına zarar vereceği hâllerde, kurum ve kuruluşlar ilgilinin;</template>
        <mvz-bent no="a">
          <template>Yazılı veya basılı belgeler için, söz konusu belgenin aslını incelemesi ve not alabilmesini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ses kaydı şeklindeki bilgi veya belgelerde bunları dinleyebilmesini,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Görüntü kaydı şeklindeki bilgi veya belgelerde bunları izleyebilmesini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>sağlarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bilgi veya belgenin yukarıda belirtilenlerden farklı bir şekilde elde edilmesi mümkün ise, belgeye zarar vermemek koşuluyla bu olanak sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Başvurunun yapıldığı kurum ve kuruluş, erişimine olanak sağladığı bilgi veya belgeler için başvuru sahibinden erişimin gerektirdiği maliyet tutarı kadar bir ücreti bütçeye gelir kaydedilmek üzere tahsil edebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Bilgi veya belgeye erişim süreleri">
      <mvz-fıkra no="1">
        <template>Kurum ve kuruluşlar, başvuru üzerine istenen bilgi veya belgeye erişimi onbeş iş günü içinde sağlarlar. Ancak istenen bilgi veya belgenin, başvurulan kurum ve kuruluş içindeki başka bir birimden sağlanması; başvuru ile ilgili olarak bir başka kurum ve kuruluşun görüşünün alınmasının gerekmesi veya başvuru içeriğinin birden fazla kurum ve kuruluşu ilgilendirmesi durumlarında bilgi veya belgeye erişim otuz iş günü içinde sağlanır. Bu durumda, sürenin uzatılması ve bunun gerekçesi başvuru sahibine yazılı olarak ve onbeş iş günlük sürenin bitiminden önce bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>10 uncu maddede belirtilen bilgi veya belgelere erişim için gereken maliyet tutarının idare tarafından başvuru sahibine bildirilmesiyle onbeş iş günlük süre kesilir. Başvuru sahibi onbeş iş günü içinde ücreti ödemezse talebinden vazgeçmiş sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Başvuruların cevaplandırılması">
      <mvz-fıkra no="1">
        <template>Kurum ve kuruluşlar, bilgi edinme başvurularıyla ilgili cevaplarını yazılı olarak veya elektronik ortamda başvuru sahibine bildirirler. Başvurunun reddedilmesi hâlinde bu kararın gerekçesi ve buna karşı başvuru yolları belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="İtiraz usulü">
      <mvz-fıkra no="1">
        <template>Bilgi edinme istemi  reddedilen başvuru sahibi, yargı yoluna başvurmadan önce kararın tebliğinden itibaren onbeş gün içinde Kurula itiraz edebilir. Kurul, bu konudaki kararını otuz iş günü içinde verir. Kurum ve kuruluşlar, Kurulun istediği her türlü bilgi veya belgeyi onbeş iş günü içinde vermekle yükümlüdürler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurula itiraz, başvuru sahibinin idarî yargıya başvurma süresini durdurur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Bilgi Edinme Değerlendirme Kurulu">
      <mvz-fıkra no="1">
        <template>Bilgi edinme başvurusuyla ilgili yapılacak itirazlar üzerine,  verilen kararları incelemek ve kurum ve kuruluşlar için bilgi edinme hakkının kullanılmasına ilişkin olarak kararlar vermek üzere; Bilgi Edinme Değerlendirme Kurulu oluşturulmuştur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurul; birer üyesi Yargıtay ve Danıştay genel kurullarının kendi kurumları içinden önerecekleri ikişer aday, birer üyesi ceza hukuku, idare hukuku ve anayasa hukuku alanlarında profesör veya doçent unvanına sahip kişiler, bir üyesi Türkiye Barolar Birliğinin baro başkanı seçilme yeterliliğine sahip kişiler içinden göstereceği iki aday, iki üyesi en az genel müdür düzeyinde görev yapmakta olanlar ve bir üyesi de Adalet Bakanının önerisi üzerine bu Bakanlıkta idarî görevlerde çalışan hâkimler arasından Cumhurbaşkanınca seçilecek dokuz üyeden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurul üyeliğine önerilen adayların muvafakatları aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurul Başkanı, kurul üyelerince kendi aralarından seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurul, en az ayda bir defa veya ihtiyaç duyulduğu her zaman Başkanın çağrısı üzerine toplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kurul üyelerinin görev süreleri dört yıldır. Görev süresi sona erenler yeniden seçilebilirler. Görev süresi dolmadan görevinden ayrılan üyenin yerine aynı usule göre seçilen üye, yerine seçildiği üyenin görev süresini tamamlar. Yeni seçilen Kurul göreve başlayıncaya kadar önceki Kurul görevine devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kurul üyelerine 10.2.1954 tarihli ve 6245 sayılı Harcırah Kanunu hükümleri saklı kalmak kaydıyla fiilen görev yaptıkları her gün için (3000) gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak miktarda huzur hakkı ödenir. Bu ödemelerde damga vergisi hariç herhangi bir kesinti yapılmaz.  Bir ayda fiilen görev yapılan gün sayısının dördü aşması halinde, aşan günler için huzur hakkı ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Kurul, belirleyeceği konularda komisyonlar ve çalışma grupları kurabilir; ayrıca gerekli gördüğü takdirde, ilgili bakanlık ile diğer kurum ve kuruluşların ve sivil toplum örgütlerinin temsilcilerini bilgi almak üzere toplantılarına katılmaya davet edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Kurulun sekretarya hizmetleri Adalet Bakanlığı tarafından yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Kurulun görev ve çalışmalarına ilişkin esas ve usuller Cumhurbaşkanlığınca hazırlanarak yürürlüğe konulacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Bilgi Edinme Hakkının Sınırları">
    <mvz-madde no="15" başlık="Yargı denetimi dışında kalan işlemler">
      <mvz-fıkra no="1">
        <template>Yargı denetimi dışında kalan idarî işlemlerden kişinin çalışma hayatını ve mesleki onurunu etkileyecek nitelikte olanlar, bu Kanun kapsamına dahildir. Bu şekilde sağlanan bilgi edinme hakkı işlemin yargı denetimine açılması sonucunu doğurmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Devlet sırrına ilişkin bilgi veya belgeler">
      <mvz-fıkra no="1">
        <template>Açıklanması hâlinde Devletin emniyetine, dış ilişkilerine, millî savunmasına ve millî güvenliğine açıkça zarar verecek ve niteliği itibarıyla Devlet sırrı olan gizlilik dereceli bilgi veya belgeler, bilgi edinme hakkı kapsamı dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Ülkenin ekonomik çıkarlarına ilişkin bilgi veya belgeler">
      <mvz-fıkra no="1">
        <template>Açıklanması ya da zamanından önce açıklanması hâlinde, ülkenin ekonomik çıkarlarına zarar verecek veya haksız rekabet ve kazanca sebep olacak bilgi veya belgeler, bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="İstihbarata ilişkin bilgi veya belgeler">
      <mvz-fıkra no="1">
        <template>Sivil ve askerî istihbarat birimlerinin görev ve faaliyetlerine ilişkin bilgi veya belgeler, bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, bu bilgi ve belgeler kişilerin çalışma hayatını ve meslek onurunu etkileyecek nitelikte ise, istihbarata ilişkin bilgi ve belgeler bilgi edinme hakkı kapsamı içindedir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="İdarî soruşturmaya ilişkin bilgi veya belgeler">
      <mvz-fıkra no="1">
        <template>Kurum ve kuruluşların yetkili birimlerince yürütülen idarî soruşturmalarla ilgili olup, açıklanması veya zamanından önce açıklanması hâlinde;</template>
        <mvz-bent no="a">
          <template>Kişilerin özel hayatına açıkça haksız müdahale sonucunu doğuracak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kişilerin veya soruşturmayı yürüten görevlilerin hayatını ya da güvenliğini tehlikeye sokacak,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Soruşturmanın güvenliğini tehlikeye düşürecek,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Gizli kalması gereken bilgi kaynağının açığa çıkmasına neden olacak veya soruşturma ile ilgili benzeri bilgi ve bilgi kaynaklarının temin edilmesini güçleştirecek,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>bilgi veya belgeler, bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Adlî soruşturma ve kovuşturmaya ilişkin bilgi veya belgeler">
      <mvz-fıkra no="1">
        <template>Açıklanması veya zamanından önce açıklanması hâlinde;</template>
        <mvz-bent no="a">
          <template>Suç işlenmesine yol açacak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Suçların önlenmesi ve soruşturulması ya da suçluların kanunî yollarla yakalanıp kovuşturulmasını tehlikeye düşürecek,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yargılama görevinin gereğince yerine getirilmesini engelleyecek,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Hakkında dava açılmış bir kişinin adil yargılanma hakkını ihlâl edecek,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Nitelikteki bilgi veya belgeler, bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>4.4.1929 tarihli ve 1412 sayılı Ceza Muhakemeleri Usulü Kanunu, 18.6.1927 tarihli ve 1086 sayılı Hukuk Usulü Muhakemeleri Kanunu, 6.1.1982 tarihli ve 2577 sayılı İdari Yargılama Usulü Kanunu ve diğer özel kanun hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Özel hayatın gizliliği">
      <mvz-fıkra no="1">
        <template>Kişinin izin verdiği hâller saklı kalmak üzere, özel hayatın gizliliği kapsamında, açıklanması hâlinde kişinin sağlık bilgileri ile özel ve aile hayatına, şeref ve haysiyetine, meslekî ve ekonomik değerlerine haksız müdahale oluşturacak bilgi veya belgeler, bilgi edinme hakkı kapsamı dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu yararının gerektirdiği hâllerde, kişisel bilgi veya belgeler, kurum ve kuruluşlar tarafından, ilgili kişiye en az yedi gün önceden haber verilerek yazılı rızası alınmak koşuluyla açıklanabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Haberleşmenin gizliliği">
      <mvz-fıkra no="1">
        <template>Haberleşmenin gizliliği esasını ihlâl edecek bilgi veya belgeler, bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Ticarî sır">
      <mvz-fıkra no="1">
        <template>Kanunlarda ticarî sır olarak nitelenen bilgi veya belgeler ile, kurum ve kuruluşlar tarafından gerçek veya tüzel kişilerden gizli kalması kaydıyla sağlanan ticarî ve malî bilgiler, bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Fikir ve sanat eserleri">
      <mvz-fıkra no="1">
        <template>Fikir ve sanat eserlerine ilişkin olarak yapılacak bilgi edinme başvuruları hakkında ilgili kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Kurum içi düzenlemeler">
      <mvz-fıkra no="1">
        <template>Kurum ve kuruluşların, kamuoyunu ilgilendirmeyen ve sadece kendi personeli ile kurum içi uygulamalarına ilişkin düzenlemeler hakkındaki bilgi veya belgeler, bilgi edinme hakkının kapsamı dışındadır. Ancak, söz konusu düzenlemeden etkilenen kurum çalışanlarının bilgi edinme hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Kurum içi görüş, bilgi notu ve tavsiyeler">
      <mvz-fıkra no="1">
        <template>Kurum ve kuruluşların faaliyetlerini yürütmek üzere, elde ettikleri görüş, bilgi notu, teklif ve tavsiye niteliğindeki bilgi veya belgeler, kurum ve kuruluş tarafından aksi kararlaştırılmadıkça bilgi edinme hakkı kapsamındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bilimsel, kültürel, istatistik, teknik, tıbbî, malî, hukukî ve benzeri uzmanlık alanlarında yasal olarak görüş verme yükümlülüğü bulunan kişi, birim ya da kurumların görüşleri, kurum ve kuruluşların alacakları kararlara esas teşkil etmesi kaydıyla bilgi edinme istemlerine açıktır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Tavsiye ve mütalaa talepleri">
      <mvz-fıkra no="1">
        <template>Tavsiye ve mütalaa talepleri bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Gizliliği kaldırılan bilgi veya belgeler">
      <mvz-fıkra no="1">
        <template>Gizliliği kaldırılmış olan bilgi veya belgeler, bu Kanunda belirtilen diğer istisnalar kapsamına girmiyor ise, bilgi edinme başvurularına açık hâle gelir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Çeşitli ve Son Hükümler">
    <mvz-madde no="29" başlık="Ceza hükümleri">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında ihmâli, kusuru veya kastı bulunan memurlar ve diğer kamu görevlileri hakkında, işledikleri fiillerin genel hükümler çerçevesinde ceza kovuşturması gerektirmesi hususu saklı kalmak kaydıyla, tâbi oldukları mevzuatta yer alan disiplin cezaları uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunla erişilen bilgi ve belgeler ticarî amaçla çoğaltılamaz ve kullanılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Rapor düzenlenmesi">
      <mvz-fıkra no="1">
        <template>Kurum ve kuruluşlar, bir önceki yıla ait olmak üzere;</template>
        <mvz-bent no="a">
          <template>Kendilerine yapılan bilgi edinme başvurularının sayısını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Olumlu cevaplanarak bilgi veya belgelere erişim sağlanan başvuru sayısını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Reddedilen başvuru sayısı ve bunların dağılımını gösterir istatistik bilgileri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Gizli ya da sır niteliğindeki bilgiler çıkarılarak ya da bu nitelikteki bilgiler ayrılarak bilgi veya belgelere erişim sağlanan başvuru sayısını,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Başvurunun reddedilmesi üzerine itiraz edilen başvuru sayısı ile bunların sonuçlarını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Gösterir bir rapor hazırlayarak, bu raporları her yıl Şubat ayının sonuna kadar Bilgi Edinme Değerlendirme Kuruluna gönderirler. Bağlı, ilgili ve ilişkili kamu kurum ve kuruluşları raporlarını bağlı, ilgili ya da ilişkili oldukları bakanlık vasıtasıyla iletirler. Kurul, hazırlayacağı genel raporu, söz konusu kurum ve kuruluşların raporları ile birlikte her yıl Nisan ayının sonuna kadar Türkiye Büyük Millet Meclisine gönderir. Bu raporlar takip eden iki ay içinde Türkiye Büyük Millet Meclisi Başkanlığınca kamuoyuna açıklanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanması ile ilgili esas ve usullerin belirlenmesine ilişkin yönetmelik, Kanunun yayımını takip eden altı ay içinde Cumhurbaşkanlığı tarafından hazırlanarak  yürürlüğe konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="32" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinden itibaren altı ay sonra yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Cumhurbaşkanı yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
