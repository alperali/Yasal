  <mvz-künye tür="kanun" no="7269" başlık="UMUMİ HAYATA MÜESSİR AFETLER DOLAYISİYLE ALINACAK TEDBİRLERLE YAPILACAK YARDIMLARA DAİR KANUN"
             tarih="15/5/1959" rgazete-tarih="25/5/1959" rgazete-sayı="10213"
             düstur-tertip="3" düstur-cilt="40" düstur-sayfa="1046" />
    
  <mvz-giriş başlık="GENEL HÜKÜMLER"></mvz-giriş>
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>Deprem (Yer sarsıntısı), yangın, su baskını, yer kayması, kaya düşmesi, çığ, tasman ve benzeri afetlerde; yapıları ve kamu tesisleri genel hayata etkili olacak  derecede zarar gören veya görmesi muhtemel olan yerlerde alınacak tedbirlerle yapılacak yardımlar hakkında bu kanun hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Afete uğrayan meskün yerlerin büyüklüğü o yerin tamamında veya bir kesiminde yıkılan, oturulmaz hale gelen bina sayısı, zarar gören yapı ve tesislerin genel hayata etki derecesi, mahallin ekonomik ve sosyal özellikleri, zararın kamu oyundaki tepkisi, normal hayat düzenindeki aksamalar ve benzeri hususlar gözönünde tutulmak suretiyle afetlerin genel hayata etkililiğine ilişkin temel kurallar, İçişleri ve Maliye Bakanlıklarının mütalaaları da alınarak İmar ve İskan Bakanlığınca hazırlanacak bir yönetmelikle belirtilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yukarda yazılı afetlerin meydana gelmesinde veya muhtemel olması halinde zararın o yerin genel hayatına etkili olup olmadığına, yönetmelik esasları gereğince, İmar ve İskan Bakanlığı tarafından karar verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Şu kadar ki, afetin maydana gelmesi halinda bu kanun gereğince alınması lazımgelen acil tedbirlerin ittihazına afetin meydana geldiği bölgenin valisi yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Su baskınına uğramış veya uğrayabilir bölgeler, İmar ve İskan Bakanlığının teklifi üzerine Devlet Su İşlerinin bağlı bulunduğu Bakanlıkça; yer sarsıntısı, yer kayması, kaya düşmesi ve çığ gibi afetlere uğramış veya uğrayabilir bölgeler ise, İmar ve İskan Bakanlığınca tespit ve bunlardan şehir ve kasabalarda meydana gelen ve gelebileceklerin sınırları imar planına, imar planı bulunmıyan kasaba ve köylerde de belli edildikçe harita veya krokilere işlenmek suretiyle, afete maruz bölge olarak Cumhurbaşkanınca kararlaştırılır ve bu suretle tespit olunan sınırlar,  ilgili valiliklerce mahallinde ilan olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Mahalli şart ve özellikler dolayısiyle yangın afetine uğraması muhtemel olan sahalar, şehir ve kasabalarda belediye meclisleri, köylerde ihtiyar heyetleri tarafından tespit ve kaymakamların mütalaası alındıktan sonra valilerin tasvibi üzerine ilgili bölgelerde ilan olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>İkinci maddeye göre ilan edilen afet bölgelerinde yeniden yapılacak, değiştirilecek, büyütülecek veya esaslı tamir görecek resmi ve özel bütün yapıların tabi olacağı teknik şartlar, Bayındırlık Bakanlığının mütalaası da alınarak İmar ve İskan Bakanlığınca hazırlanacak bir yönetmelikle tespit olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Belediye hudutları ve varsa mücavir sahalar dahilinde ilgili belediyeler, bunun dışında kalan yerlerde vali ve kaymakamlar bu yönetmelik esaslarının uygulanmasını sağlamakla yükümlüdürler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yönetmelik esaslarına aykırı olan yapılar hakkında; yukarda belirtilen merciler tarafından sahiplerine tebligat yapılarak, en çok 3 aylık süre içinde hatanın ve tehlikeli durumun giderilmesi bildirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Verilen süre içinde sahiplerince ıslah edilmiyen bina veya bina kısımları belediye hudutları ve mücavir saha dahilinde belediye encümenlerince diğer yerlerde ise il veya ilçe idare kurullarınca, yıkma parası yıkıntı malzemesinden karşılanmak, yetmemesi halinde kalan kısmı afetler fonundan tamamlanmak üzere yıktırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>İmar ve İskan Bakanlığı bu konuda gerekli kontrol ve denetime yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Yer kayması, kaya düşmesi, çığ gibi afetlere uğrıyabilecek meskün yerlerde alınacak önleyici tedbirler İmar ve İskan Bakanlığınca, su baskınına uğrıyabilecek yerlerde ise, Devlet Su İşlerinin bağlı bulunduğu bakanlıkça alınır. Bu işlere ilişkn ödenek, tedbirleri almakla görevli bakanlıkça karşılanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>İçişleri, İmar ve İskan, Bayındırlık, Sağlık ve Sosyal Yardım ve Tarım Bakanlıklarınca acil yardım teşkilatı ve programları hakkında genel esasları kapsayan bir yönetmelik yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu yönetmelik esasları dairesinde afetin meydana gelmesinden sonra yapılacak kurtarma, yaralıları tedavi, barındırma, ölüleri gömme, yangınları söndürme, yıkıntıları temizleme ve felaketzedeleri iaşe gibi hususlarda uygulanmak üzere görev ve görevlileri tayin, toplanma yerlerini tespit eden bir program valiliklerce düzenlenir ve gereken vasıtalar hazırlanarak muhafaza olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu programların uygulanması, valiliklerce kurulacak kurtarma ve yardım komitelerince sağlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Ancak 7126 sayılı Sivil Müdafaa Kanununa göre teşkilat kurulan yerlerde acil kurtarma ve yardım işleri, yukarda belirtilen komite ile sözü geçen sivil savunma teşkilatı tarafından müştereken yürütülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>İlçe, bucak ve köylerde tafsilâtlı çalışma muhtıraları ve uygulama programları tasdikli il muhtıra ve programlarındaki esaslar dairesinde ilçelerde kaymakamlar, bucak ve köylerde bucak müdürleri tarafından düzenlenir; il kurtarma ve yardım komitesinin incelemesinden sonra valilerin onayı ile kesinleşir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="">
    <mvz-fıkra no="1">
      <template>Birinci maddede yazılı afetlerden vatandaş hayatının ve milli servetin korunması maksadiyle lüzumlu tedbirleri araştırmak, ilgili vekalet ve müesseselerle iş birliği yaparak öğretim ve yayımlarda bulunmak, afetlerin neticelerini tahlil ederek umumun faydalanmasına sunmak üzere İmar ve İskan Vekaletine bağlı ve hükmi şahsiyeti haiz enstitü veya kurumlar kurulabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Mülkiye amirlerine verilen olağanüstü yetkiler">
    <mvz-fıkra no="1">
      <template>Afetlerin meydana gelmesinden sonra vali ve kaymakamlar (Askerler ve hakim sınıfından bulunanlar hariç olmak üzere) 18 - 65 yaş arasındaki bütün erkeklere görev vermeye, bedeli, ücreti veya kirası sonradan ödenmek üzere canlı, cansız, resmi ve özel her türlü taşıt araçlarına ve gerekli makina, alat ve edevatına el koymaya ve hiçbir kayda ve merasime tabi olmaksızın tedavi, kurtarma, yedirme, giydirme ve barındırma gibi işlerle bu gibi işlerin gerektirdiği acil satınalmaları ve kiralamayı yapmaya, Devlete, mahalli idarelere, evkafa, İktisadi Devlet Teşekkülleri ile bunlara bağlı kurumlara ilişkin her türlü taşınmaz malları; yetmemesi halinde de diğer tüzel kişiler ile gerçek kişilere ait bina ve müştemilatı ile bahçe ve arsa gibi araziyi geçici olarak işgale yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu yetkinin kullanma süresi, afetin sona ermesinden itibaren 15 gündür. Bu süre, gerektiğinde İmar ve İskan Bakanlığınca uzatılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yedirme, giydirme, barındırma, onarım için afetzedelere nakdi ödemede bulunulması önleme için harcama yapılması İmar ve İskan Bakanlığının muvafakatine bağlıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu madde gereğince yapılacak harcamalar ve ödemeler borçlandırmaya tabi tutulmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kendilerinden yardım istenilen afet bölgesi civarındaki vali ve kaymakamlar yukarıdaki fıkralarda yazılı yetkilerini kullanarak bütün imkan ve vasıtalarla yardıma mecburdurlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Mükellefiyetler">
    <mvz-fıkra no="1">
      <template>Afet bölgelerinde veya civarında bulunan ordu, jandarma, kıta birlik ve müessese kumandanları, hazarda, kendilerinden vali veya kaymakamlar tarafından istenilecek yardımları üstlerinden emir beklemeksizin yapmaya mecburdurlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="">
    <mvz-fıkra no="1">
      <template>Rasat istasyonları vuku muhtemel afetleri bu bölgelerin en  büyük mülkiye amirine derhal bildirmeye mecburdurlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ellerinde muhabere vasıtaları, haber ulaştırma imkanları bulunan mülki ve askeri bütün resmi makam ve müesseseler afetlerin vukuu haberini mahallin en büyük mülkiye amirine derhal bildirmekle mükelleftir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Afetlerin vukuunu ihbar veya yardım talepleri için yapılacak telgraf, telefon, telsiz muhaberelerini, telgraf ve telefon merkezleri, demiryolu istasyonları, askeri muhabere teşkilleri her işe tercihan parasız kabule ve muhataplarına ulaştırmaya mecburdurlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>İcabında radyo istasyonlarından da parasız istifade edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunda yazılı afetlerin vukuunda ilk yardımları mahallerine yetiştirmek maksadiyle bu bölgelere mülkiye amirleri ve alakalı makam ve müesseseler tarafından gönderilecek kurtarma ve yardım ekipleri, her türlü malzeme, makina, alat, yiyecek, giyecek ve barınma eşya ve maddeleri, umumi, hususi ve mülhak bütçeli idarelerle bunlara bağlı müesseseler ve İktisadi Devlet Teşekküllerinin, vilayetlere, belediye ve köylere ait olan ve bunlara bağlı bulunan mü- esseselerin elinde bulunan her türlü kara, deniz, ve hava nakil vasıtaları ile, bedeli sonradan ödenmek üzere, sevk edilir. İhtiyaç hissedilen mahallerde bu mecburiyet ve mükellefiyetler hakiki şahıslarla her türlü şirket ve müesseselere de teşmil edilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="">
    <mvz-fıkra no="1">
      <template>Gerek yukarda yazılı afetlerin vukuunda,gerek her türlü kurtarma, barındırma, yardım, söndürme, sevk ve tevzi işlerinde çalışanlardan yaralanan veya engelli hâle gelen yahut hastalananlar en yakın hastaneye veya tedavi yerlerine sevk edilirler. Mülki ve askeri hastane ve tedavi yerleriyle umumi, mülhak, hususi bütçeli idarelere, belediye, hakiki ve hükmi şahıslara ait bütün hastane ve tedavi yerleri bunları hemen kabul ve tedavi etmeye mecburdurlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Resmi hastane ve tedavi evlerinde bulunanlara parasız bakılır. Resmi hastane ve tedavi evlerinde yer olmaması veya tedavi imkanı bulunmaması gibi sebeplerle zaruri olarak hususi hastanelerde yapılan tedavi ücretleri sonradan bu kanun mucibince ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="4" durum="mülga">
      <template></template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="">
    <mvz-fıkra no="1">
      <template>Birinci maddede yazılı afetlerin vukuunda ilk kurtarma işlerinde en çok üç güne kadar çalıştırılacaklara bedeni hizmetlerinden dolayı ücret verilmez. Çalıştıkları müddetçe parasız ekmek ve katık verilir. Bunların beraberlerinde getirdikleri veya emir üzerine verdikleri alat ve edevat, malzeme ve vasıtalardan tamire muhtaç hale gelenler bedeli sonradan ödenmek üzere tamir ettirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Zıyaa uğrayanlarla tamiri imkansız olanların bedeli rayiç üzerinden bilahara müstehiklerine ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="Tazminat, ikramiye ve avans">
    <mvz-fıkra no="1">
      <template></template>
      <mvz-bent no="a">
        <template>Bu kanun mucibince kendilerine vazife verilmiş olanlardan memur bulunmayanların vazifelerinin ifası sırasında vukubulan kazalarda ölenlerin mirascılarına veya malül kalanlara ödenecak tazminat,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Afetler dolayısiyle memur olan ve olmayanlardan fevkalade yararlık gösterenlere verilebilecek ikramiyeler,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Afete maruz kalan bölgelerde Umumi Muvazeneden, mülhak bütçeli idarelerden, hususi idare ve belediyelerden, 2847 ve 3659 sayılı kanuna tabi müesseselerden maaş ve ücret alan memur ve müstahdemlerle emekli, dul ve yetimlerden yardıma muhtaç olacak derecede malen veya bedenen ehemmiyetli zarara uğrayanlara üç aylık istihkaklarını geçmemek üzere verilebilecek avansla bu avansların ne suretle istirdat edileceği ve vefat edenlere ait avansların kısmen veya tamamen geri alınıp alınamayacağı ve diğer hususlara dair esaslar Cumhurbaşkanınca belirlenir.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="Afet bölgelerinde yapılacak teknik işler">
    <mvz-fıkra no="1">
      <template></template>
      <mvz-bent no="a">
        <template>Yapılacak işlemlere esas olmak üzere İmar ve İskan Bakanlığınca kurulacak fen kurulları tarafından, afetin meydana geldiği arazinin durumu ile bütün yapılar ve kamu tesisleri incelenerek, hasar tespit raporu düzenlenir.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Gereken hallerde, yapılarda meydana gelen hasarı tespit etmek üzere Bayındırlık ve İskan Bakanlığının isteği üzerine diğer bakanlık, kurum ve kuruluşlar, mahalli idareler, üniversiteler ve meslek odaları, konusunda deneyimli yeteri kadar inşaat mühendisi ve/veya mimarı hasar tespiti çalışmalarında derhal görevlendirmekle yükümlüdürler.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Arazinin tehlikeli durumu ve binaların gördüğü hasar bakımından yıktırılması ve boşaltılması gerekenler hakkında, o il ve ilçenin en büyük mülkiye amirine ayrı bir rapor verilir. Bu makamlarca böyle binalar derhal boşalttırılır. Yıkılması gerekenler için en çok 3 gün süre verilerek tehlikenin giderilmesi sahiplerine bildirilir. Mahallinde sahibi bulunmadığı takdirde durum, mahalli vasıtalarla ilan edilmek suretiyle, bildiri yapılmış sayılır.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template> Mal sahibi veya vekili, bu bildiriye karşı 3 gün içinde yetkili idare kurullarına itiraz edebilir. İdare kurulları bu itirazı en geç 3 gün içinde inceler ve karara bağlar.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Süresinde itiraz olunmayan, yahut itiraz olunup da idare kurullarınca yıkılması onaylanan binaları mal sahibi yıkmadığı takdirde bu binalara el konularak yıkma parası yıkıntıdan elde edilecek malzeme bedelinden ödenmek üzere, mahallin en büyük mülkiye amirinin emri ile yıktırılır.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template> Yapılacak asıl işlemlere esas olmak üzere, fen kurulları tarafından düzenlenen teknik mahiyetteki hasar tespit raporlarına mahallî ilân tarihinden itibaren otuz gün içinde itiraz edilebilir.  Gayrimenkulleri kesin bir şekilde hasarsız olarak tespit edilenlerin veya gayrimenkullerinin hasar tespiti hiç yapılmayanların, yargı yoluna gitmeden önce, mahallî ilân tarihinden itibaren otuz gün içinde ilgili idareye başvurmaları zorunludur.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Hasar görmüş, fakat ıslahı mümkün olan binaların fen kurullarının göstereceği şartlara göre tamiri yapılıncaya kadar içine girilmesine ve oturulmasına izin verilemez. Bu binalar 1 yıl içinde tamir ettirilmediği ve itiraz da olmadığı takdirde yukarıdaki esaslar dahilinde yıktırılır.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>İtiraz halinde, bu itiraz yukarıdaki mahalli idare kurullarınca 5 gün içinde incelenir ve karara bağlanır. İtiraz sebepleri yerinde görüldüğü takdirde süre 6 ay daha uzatılır.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Resmi daire ve müesseselere ait binalardan bu madde gereğince yıktırılması gerekenler yıkma masrafları ilgili daire ve müesseselerce sonradan karşılanmak şartiyle fon hesabından ödenerek yıktırılır.</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Yer kayması, kaya düşmesi gibi afetlerde, tehlikenin devamı veya tekrarı ihtimali üzerine boşaltılan binaların tehlikeye karşı kesin tedbir alınıncaya kadar işgaline veya hasara uğrıyanların tamirine müsaade edilmez. Tedbir alınamıyacağına karar verildiği takdirde tehlikeli mahal içindeki binalar, yukardaki esaslar dahilinde yıktırılır. İmar ve İskan Bakanlığınca afete karşı arazide gerekli tedbirlerin alınması, tehlikeye maruz yapıların yıkılması ve topluluğun başka yere taşınmasından daha ekonomik görülürse, bu tedbirlerin alınması için lüzumlu ödenek 33 üncü maddede yazılı fondan ödenir. Tehlikenin giderilmesiyle ilgili tedbirler için yapılan harcamalar borçlanmaya tabi tutulmaz.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Afete uğrayanların veya uğraması muhtemel olanların bulundukları yerlerde veya başka yerlerde geçici olarak barınmalarını sağlamak üzere, baraka ve konutlar inşa edilebilir, ettirilebilir, kiralanabilir veya satınalınabilir.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Bu tedbirlerin, kısa zamanda yerine getirilmesinin mümkün olamıyacağı hallerde, geçici iskan tedbirlerini kendileri almak isteyenlere nakdi yardım da yapılabilir.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Geçici barındırma işleri için gerekli ödenek ile afetzedelere nakden yapılacak yardımların miktarı ve barınaklarda oturulacak süre İmar ve İskan Bakanlığınca tespit olunur.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Bu bend gereğince yapılacak harcamalar ve ödemeler borçlandırmaya tabi tutulmaz.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="">
    <mvz-fıkra no="1">
      <template>İkinci madde gereğince tespit ve ilan olunan afet bölgelerine dahil şehir, kasaba ve köylerde bina ve mesken yapımı, fen kurullarınca tehlikeli görülen ve sınırları krokilerle tespit olunan yerler, İmar ve İskan Bakanlığınca yapı ve ikamet için yasaklanmış afet bölgeleri sayılır ve durum, belediyesi olan yerlerde belediyesince, köylerde ise ihtiyar meclislerince hemen ilan edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Belediyesi olan yerlerde belediyeler, olmıyan yerlerde ihtiyar meclisleri bu yasaklanmış afet bölgesi hükmünü uygulamakla görevlidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Hilafına hareket edildiği takdirde, mevcut ve yapılmakta olan binalar, yıkma parası yıkıntı malzemesinden karşılanmak, yetmemesi halinde kalan kısmı afetler fonundan tamamlanmak üzere vali ve kaymakamların emri ile yıktırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yasaklanmış afet bölgesi sınırları, alınacak tedbirlerle tehlikenin önlenmesi oranında daraltılır veya tamamen kaldırılır. Bu husus da aynı şekilde duyurulur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="">
    <mvz-fıkra no="1">
      <template>Afet dolayısiyle hasara uğramış şehir ve kasabaların imar planı mevcut olup da İmar ve İskan Bakanlığınca değiştirilmesi gerekli görülmediği takdirde, inşaata mevzuat dairesinde hemen izin verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Mevcut imar planının kısmen değiştirilmesi gerekli görülen şehir ve kasabalarda, bu değişiklik planları, İmar ve İskan Bakanlığınca 5 ay zarfında yaptırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İmar veya istikamet planı olmıyan veya olup da tamamen değiştirilmesi gereken yerlerde halihazır harita ve imar veya istikamet planı İmar ve İskan Bakanlığınca öncelikle yapılır veya yaptırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu planlar yapılıncaya kadar gelecekteki planlara göre esaslı inşaat yaptırılmasına İmar ve İskan Bakanlığınca izin verilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yukarıda yazılı hallerde veya yerinin değiştirilmesi gereken şehir ve kasabalarda ilgililerin afetten masun yerlerde gösterilecek arsalar üzerinde, ilk barınma tedbiri olarak geçici baraka inşaasına izin verilebilir. Bu türlü geçici inşaatın, imar planı olan yerlerde, afetin vukuundan; imar planı olmıyan veya değiştirilen veya yerleri değiştirilecek olan şehir ve kasabalarda, yeni planların onanmasından itibaren bir yıl içinde sahipleri tarafından yıkılması mecburidir. Aksi halde masrafları yıkıntı bedelinden ödenmek üzere mahallin en büyük mülkiye amirinin emri ile belediyelerce yıktırılır. Bu bir yıllık süre zaruret halinde ilgili valiliğin teklifi üzerine İmar ve İskan Bakanlığınca gerektiği kadar uzatılabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="Afet Bölgelerindeki bir topluluğun kaldırılarak başka yerlere taşınması">
    <mvz-fıkra no="1">
      <template>Genel hayata etkili afetlerden önce veya sonra kesin lüzum üzerine meskün bir topluluğun bir kısmının veya tamamının kaldırılarak başka mahallere toplu olarak veyahut dağıtılarak yerleştirilmesi İçişleri, Maliye, Bayındırlık, Sağlık ve Sosyal Yardım, Tarım, Milli Eğitim, Sanayi, İmar ve İskan ve köylerde Köy İşlerine bakan Bakanlıklar mütehassıs temsilcilerinden kurulacak bir komite incelendikten sonra Cumhurbaşkanı Kararı ile İmar ve İskan Bakanlığı tarafından yaptırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ancak bu toplu nakiller aynı belediye ve köy sınırları içinde ise Cumhurbaşkanı kararına lüzum kalmaksızın İçişleri ve İmar ve İskan Bakanlıklarınca müştereken yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Taşınma yeri afet bölgesinin bulunduğu il sınırları dışında tespit edildiği takdirde, afetzedelerin taşınması ile ilgili giderler İmar ve İskan Bakanlığınca afetler fonundan karşılanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="Kıymet takdiri, parselleme ve dağıtma">
    <mvz-fıkra no="1">
      <template>Afet gören yerlerde hasara uğrıyan kısımlar içinde bulunan taşınmaz mallarla, yine aynı yerde, üzerine bina yaptırılmak üzere İmar ve İskan Bakanlığınca tespit edilen taşınmaz malların kıymetleri aşağıdaki maddelerde gösterildiği şekilde takdir ve tespit edilir. (Yeniden yerleşme yapılmayacak afet yerlerindeki taşınmaz mallar için kıymet belgesi düzenlenmez.)</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu kıymetlere göre taşınmaz mallar için birer kıymet belgesi tanzimine ve bu belgelerin sahiplerine verilmesi karşılığında sözü geçen taşınmaz malları Hazine adına tescil ettirmeye İmar ve İskan Bakanlığı yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Tescil sırasında, vergi kıymet ve vukuat belgeleri aranmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="18" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanuna göre afet sebebiyle İmar ve İskan Bakanlığınca lüzum görülecek yerlerin kadastrosu ilanların yapılmasına kadastro komisyonlarının kurulmasına lüzum kalmaksızın kadastro postalarına belediyece ve köy ihtiyar heyetince iki bilirkişi verilmek ve tasarruf tetkikleri, mahalli kadastro müdürü ve tapu memuru tarafından ifa olunmak suretiyle 2613 sayılı Kadastro ve Tapu Tahrir Kanununa göre öncelikle Tapu ve Kadastro Genel Müdürlüğünce yaptırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Anlaşmazlıklar mahalli mahkemelerce hallolunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Sözü edilen kadastro işlerine ilişkin uygulama İmar ve İskan Bakanlığı ile Tapu ve Kadastro Genel Müdürlüğünün bağlı olduğu Bakanlık arasında müştereken tespit edilecek esaslar dahilinde yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="19" başlık="">
    <mvz-fıkra no="1">
      <template>17 nci maddedeki taşınmaz malların bedelleri, köylerde köy ihtiyar heyetlerinden bir kişi, mahallin en büyük mülkiye amirince görevlendirilecek bir fen elemanı ve mahalli maliye veya tapu teşkilatından bir kişiden, şehir ve kasabalarda işe belediye meclisi üyelerinden bir, mahalli maliye veya tapu teşkilatından bir ve en büyük mülkiye amirince görevlendirilecek bir teknik elemandan meydana gelecek üç kişilik komisyon marifetiyle takdir ettirilir. Teknik eleman bulunmayan yerlerde bu işlerden anlıyan bir kimse komisyona alınır. Komisyonlar mahallin en büyük mülkiye amirleri tarafından teşkil edilir. Komisyonlar aralarında seçecekleri başkanın başkanlığında çalışır ve çoğunluğa göre karar verir. Komisyon üyeleri istinkaf edemezler ve çekimser oy kullanamazlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Sözü geçen taşınmaz malların yüz ölçülerini, özelliklerini ve takdir edilen bedeli içine alan cetveller, 10 gün süre ile, mahalli imkan ve şartlara göre ilan olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Takdir edilen kıymete karşı ilan süresinin bitiminden itibaren 7 gün içinde taşınmaz malın bulunduğu yerdeki Asliye Hukuk Mahkemesinde dava açılabilir. Davanın açıldığı tarihten itibaren, 8 gün içinde taraflar mahkemeye çağırılırlar. Bu davalar basit muhakeme usulüne tabidir ve diğer davalara tercihli olarak görülür. Davanın açılması veya temyiz talebi, bu kanuna göre yapılacak işlemleri ve inşaat işlerini hiçbir suretle durduramaz. Bu davalar dolayısiyle, mahkemelerce ihtiyati tedbir kararı verilemez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="20" başlık="">
    <mvz-fıkra no="1">
      <template>19 uncu maddede yazılı itiraz müddetinin sonunda itiraz edilmiyen veya itiraz  edilip  kesinleşmiş  hükümle  tesbit edilmiş olan kıymetleri gösteren belgeler, sahipleri adına tanzim olunarak belediye ve köy ihtiyar heyetlerince müracaatlarında kendilerine veya kanuni mümessillerine verilir. Hisseli veya intikali yapılmamış gayrimenkullerin kıymet belgeleri hissedarları veya kanuni mirascıları adına tanzim olunur. Bu kıymet belgelerinin kayıtları kaymakam veya vali tarafından tasdikli defterlerde tutulur. Tapuda kaydı bulunmıyan veya mülkiyeti ihtilaflı veyahut veraset ilamı ibraz edilmemiş olan gayrimenkullere ait kıymet belgelerine mülk sahibinin veya mutasarrıfının adı yazılmıyarak sadece ada ve parsel sayısı, yüzölçüsü ve evsafı ile takdir edilen bedeli kaydedilir. Bunlar belediye veya köy kasasında muhafaza edilerek sahipleri belli oldukça isimleri yazılıp kendilerine verilir. Bu nevi belgelere ait bedeller Türkiye Emlak Kredi Bankasında mahfuz tutulur. İlan tarihinden itibaren 10 yıl içinde sahibi çıkmıyan kıymet belgeleri hükümsüz addedilir ve bankadaki mukabilleri fon hesabına iade olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="21" başlık="">
    <mvz-fıkra no="1">
      <template>Afet bölgesi içinde ve dışında tespit olunan imar ve iskan alanları içindeki taşınmaz mallardan Hazineye, özel idareye, belediyeye, köy tüzel kişiliğine veya katma bütçeli dairelere ait olanlardan (Vakıflar Genel Müdürlüğü taşınmaz malları ile, Hazineye, özel idare ve belediyeye ait taşınmaz mallardan bir kamu hizmetine tahsis edilenler hariç) ihtiyaca tekabül eden miktarı, İmar ve İskan Bakanlığının isteği üzerine bedelsiz olarak bu işe tahsis ve temlik olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Afet sahaları içinde ve dışında yeniden kurulacak iskan yerleri (Şehir, kasaba, köy) ile mevcut iskan sahalarına yapılacak eklemeler için, yukarıdaki hükümler dairesinde arazi temini mümkün olmayan hallerde (Normal gelişme alanlarına öncelik verilmek şartiyle) arazi ve bina satınalınabileceği gibi, kamulaştırma mevzuatı dahilinde, kamulaştırma da yapılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu maddeye göre sağlanan taşınmaz mallar İmar ve İskan Bakanlığının isteği üzerine, ayrıca ferağ şartı aranmaksızm Hazine adına re'sen tescil olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="22" başlık="">
    <mvz-fıkra no="1">
      <template>17 ve 21 inci maddeler gereğince sağlanan taşınmaz mallar, birleştirildikten sonra İmar ve İskan Bakanlığınca onanmış imar ve istikamet planlarına göre parsellere ayrılır. Bu suretle meydana gelen parseller adı geçen Bakanlığın isteği üzerine ilgili tapu dairesince tescil olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="23" başlık="">
    <mvz-fıkra no="1">
      <template>Hazine mülkiyetine geçen arsalardan İmar ve İskan Bakanlığınca görülen lüzum üzerine, toplu inşaat yapılmıyan yerlerde bu kanundan faydalanacak olanlardan yapısını belli süre içerisinde yapmayı taahhüt edenlere noter huzurunda kura çekilerek arsaları verilebileceği gibi, bunlara ayrıca teknik yardım ve borçlandırmak suretiyle yapı malzemesi ve para yardımıda yapılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Üzerinde toplu inşaat yapılacak veya yukardaki fıkraya göre verilecek arsaların bedelleri İmar ve İskan Bakanlığınca tespit edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ellerinde kıymet belgesi bulunanların borçlarından bu belge tutarı düşülür; fazlası kendilerine ödenir ve noksanı borçlandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kıymet belgesi sahiplerinden bina yapmayacaklara istedikleri takdirde arsa verilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>İmar planında kamu hizmet tesisleriyle ibadet yerleri için gösterilen yerler İmar ve İskan Bakanlığının izni ile ilgili müesseselere bedelsiz olarak verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Yukarıdaki fıkralar gereğince dağıtım ve tahsise tabi tutulan arsalar, İmar ve İskan Bakanlığının isteği üzerine, tapu dairesi tarafından tahsis edildikleri şahıslar, hissedarlar veya varisleri adına tescil olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="24" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunda yazılı afetler sebebiyle kullanılamayacak hale gelmiş olan binalar, arsa hükmünde olup kıymet takdirine ithal edilmiyen enkaz ve malzeme mal sahibine aittir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="25" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunun şümulüne giren gayrimenkullerin vergi borçları tapuca tescil muamelesinin yapılmasına mani teşkil etmez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="26" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanun hükümlerine göre inşa edilecek binalarla yapılacak (Yol, kanalizasyon, su, elektrik gibi) amme tesisleri İmar ve İskan Bakanlığınca yapılır veya yaptırılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="27" başlık="">
    <mvz-fıkra no="1">
      <template>İnşa edilecek binalar için yapılacak harcamalar ile, üzerine bina yapılan arsaların bedelleri o binaların maliyetini teşkil eder. Harita alımı,imar planı ve proje düzenlenmesi, araştırma ve gerekli teknik yardım giderleri ile yeniden yapılacak veya tamir edilecek kamuya ait yol, su, elektrik ve kanalizasyon tesisleri giderleri borçlandırmaya tabi tutulmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Taşınmaz mal için bu şekilde tespit edilen maliyet bedellerinden sahiplerine ait kıymet belgelerindeki miktarlar çıktıktan sonra, geri kalanı borçlandırmaya esas tutulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kıymet belgelerindeki bedellerin fazla olması halinde aradaki fark sahiplerine ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="28" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanundan faydalanmak suretiyle inşaat kredisi verilmesini ya da bina yaptırılmasını isteyenlerin, Bayındırlık ve İskân Bakanlığınca yapılacak yardıma ilişkin olarak mahallî ilân tarihinden itibaren iki ay içinde mahallin en büyük mülkî amirine yazılı başvuruda bulunmaları ve taahhütname vermeleri zorunludur. Bayındırlık ve İskân Bakanlığı bu süreyi bir ay uzatmaya yetkilidir. Bu müracaatın yapılmasında ve alınmasında hasar tespit raporlarında yer alan hasar oranlarına bakılmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kamulaştırma sahasındaki bina sahipleri için bu süre kamulaştırma kararının kendilerine bildirilmesi veya ilan tarihinden itibaren hesaplanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İhale suretiyle yapılacak inşaatlarda ihale tarihinden, emanet usulü ile yapılacak inşaatlarda emanet kararının alınmasından sonra İmar ve İskan Bakanlığınca haklı görülmiyecek bir sebeple taahhüdünden dönenlerden, kusurlarının derecesine göre, 500 liradan 2000 liraya kadar tazminat alınarak fona yatırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yapılarını kendileri yapacak olanlardan ise, arsaların elde edilme işlemlerinin sonuçlandırılmasından sonra taahhüdünden dönenlerin; bunlara ait yapı ve arsalar satılarak muacceliyet kesbeden borçları kapatılır. Satış bedeli borçlandırma bedelinden az olursa farkı tahsilinde fona yatırılmak üzere Türkiye Emlak Kredi Bankası tarafından kendi alacağı gibi taahhütname sahibinden tahsil olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="29" başlık="">
    <mvz-fıkra no="1">
      <template>Yıkılan, yanan veya ağır hasara uğrayan veya uğraması muhtemel olan binalarla imar planları gereğince kamulaştırılmasında zorunluluk bulunan yerlerdeki binalarda oturan ailelere hak sahibi olmak şartıyla konut yaptırılır veya kredi verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Aynı bina içinde hak sahibi ebeveyn ile birlikte oturan evli kişilerin durumu, Bayındırlık ve İskan Bakanlığınca bu konuda hazırlanacak yönetmelik gereğince takdir ve tespit edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kendilerine ait olmayan arsa veya arazi üzerine inşaat ruhsatı almaksızın bina inşa eden yapı sahipleri ile yer kayması, su baskını, kaya düşmesi ve benzeri sebeplerle imar planında yapı yapılması sakıncalı olarak belirlenen yerlerde ruhsatsız olarak yapılan yapıların sahipleri haksahibi olarak kabul edilmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kendisine veya eşine ait o yerde aynı cins müstakil hasarsız başka bir binası veya dairesi olan ailelere bina ve inşaat kredisi verilemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yıkık olduğu veya ağır, orta ve az derecede hasar gördüğü belirlenen binalardan mülkiyeti tüzel kişilere ait olanlara yardım yapılmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Afete uğramasıyla ekonomik ve sosyal hayatı kesintiye uğratan dükkan ve fırın gibi binalar için de sahiplerine, borçlandırma hükümleri dairesinde, Bayındırlık ve İskan Bakanlığı'nca belirlenecek esaslara göre inşaat kredisi verilebilir. O yerde kendisine veya eşine ait müstakil hasarsız başka bir işyeri bulunanlar, bu yardımdan faydalanamazlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Hasarlı bina veya işyeri sigortalı ise yapılacak yardımdan sigorta tutarı indirilmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Zorunlu deprem sigortası kapsamındaki binalar için, bu Kanundan ve ilgili diğer mevzuattan doğan Devletin konut kredisi açma ve bina yaptırma yükümlülükleri, zorunlu deprem sigortası yaptırılmamış olmasının tespit edilmesiyle birlikte ortadan kalkar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="30" başlık="">
    <mvz-fıkra no="1">
      <template>İştirak veya müşterek mülkiyet halinde bulunan bina için hissedarlarına bu kanun hükümlerinden faydalanılarak yine aynı şekilde hisseli olmak üzere yalnız bir bina yaptırılır. Ancak, yıkılan, yanan, ağır hasara uğrayan, yahut afetle ilgili kamulaştırma dolayısiyle yıktırılması gereken yerlerdeki binalarla,afete uğrıyabilecek bölgelerdeki binalarda, birden fazla aile ikamet ettiği takdirde, her aile bu kanun hükümlerinden ayrı ayrı faydalanabilirler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="31" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanuna veya afete ilişkin hükümler taşıyan diğer kanunlara göre, yapılan veya yaptırılan binalardan ve çeşitli biçimlerde iktisap olunan arsa veya arazilerden türlü sebeplerle arta kalanlar halihazır durumlarıyla, aşağıdaki öncelik sırasına göre;</template>
      <mvz-bent no="a">
        <template>Afetten zarar gören veya zarar görmesi muhtemel bulunanlardan hak sahibi olanlara, bu Kanun esaslarına göre,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Kamu kurum ve kuruluşlarına, faizsiz ve en çok 2 yıl vade ile,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Mahalli belediyeler, İl Özel İdareleri, köy tüzelkişileri ile gerçek ve tüzelkişilere, % 25 (yüzde yirmibeş) peşin alınmak kaydıyla % 20 (yüzde yirmi) faiz ve en çok 5 yıl vade ile,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Valiliklerince tespit ve Bayındırlık ve İskan Bakanlığınca onaylanacak rayiç bedel üzerinden satılabilir veya devredilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Türlü sebeplerle artakalan arazi, arsa veya binaların satış veya devredilmesine, satılamayanların veya devredilemeyenlerin kiralanmasına dair esaslar Bayındırlık ve İskan Bakanlığınca hazırlanacak yönetmelikle belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Birinci fıkrada belirtilen bina, arsa ve araziler, Cumhurbaşkanı kararı ile kamu kurum ve kuruluşlarına bedelsiz olarak devredilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="32" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanun dairesinde inşa edilen binaların 1837 sayılı kanunun muaddel 4 üncü ve 6188 sayılı kanunun 13 üncü maddelerindeki muafiyetten istifade edebilmesi için bu maddeler mucibince verilmesi meşrut olan beyannameler, binaların hak sahiplerine teslimi tarihinden itibaren üç ay içerisinde verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="33" başlık="Mali hükümler">
    <mvz-fıkra no="1">
      <template>Aşağıda sayılan gelirler Bayındırlık ve İskân Bakanlığı Merkez Saymanlık Müdürlüğü hesabına yatırılır ve bütçeye gelir kaydedilir:</template>
      <mvz-bent no="a">
        <template>Bu Kanun uyarınca borçlu bulunan hak sahiplerince yatırılacak taksit ve faiz ödemeleri.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bu Kanun uyarınca yaptırılan ve ihtiyaç fazlası olduğu anlaşılan konutların satışından elde edilecek gelirler.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Bu Kanun uyarınca kamulaştırılan veya satın alınan araziler üzerinde oluşturulan ve ihtiyaç fazlası olduğu anlaşılan arsaların satışından elde edilen gelirler.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Nakdi yardım ve bağışlar.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun gereğince yapılacak ödemeler Bayındırlık ve İskân Bakanlığı bütçesinde yer alan afet tertiplerinden yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Acil durumlarda il valilikleri adına açılacak acil afet hesaplarına, Bayındırlık ve İskân Bakanlığı bütçesinin afet tertiplerinden ödeme yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu hesaplardan yapılacak harcamaların belgeleri il özel idaresinde saklanır ve il özel idare bütçesi ile birlikte Sayıştayca denetlenir. Yıl sonunda harcanmayan miktarlar ile faiz gelirleri birinci fıkrada belirtilen hesaba yatırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Afet tertipleri ve acil afet hesaplarından verilecek avanslar ile yapılacak yardım ve harcamaların usul ve esasları Maliye Bakanlığı ve Bayındırlık ve İskân Bakanlığınca müştereken hazırlanacak bir yönetmelikle belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Tabiî afet nedeniyle kamu kurum ve kuruluşları ile gerçek ve tüzel kişiler tarafından her ne ad altında olursa olsun toplanan nakdî bağış ve yardımlar, Maliye Bakanlığı Merkez Saymanlık Müdürlüğü adına açılacak özel hesaplarda toplanır ve nemalandırılır. Gerektiğinde döviz hesabı da açılabilir. Bu hesaplarda toplanan tutarlar Maliye Bakanlığınca ihtiyaca göre ilgili kurum bütçelerine özel gelir ve ödenek kaydedilmek suretiyle kullandırılır. Bu ödeneklerden yılı içerisinde kullanılmayan tutarları, ertesi yıl bütçesine devren özel gelir ve ödenek kaydetmeye Maliye Bakanı yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Çeşitli kanunlarda Afetler Fonuna yapılan atıflar, afet tertiplerine veya acil afet hesaplarına yapılmış sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>

  <mvz-madde no="36" başlık="">
    <mvz-fıkra no="1">
      <template></template>
      <mvz-bent no="a">
        <template>Afet sebebiyle yeniden inşa ve onarılacak yapılarla bunlara ait yol,su, elektrik ve kanalizasyon tesisleri, kadastro, harita ve İmar Planı yapımı,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Arazi, bina, yapı malzemesi, her türlü makina,motorlu taşıt araç,gereç, alat, edevat alınması ve sağlanması,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Afetlerin zararını önleme, gerekli tedbirleri araştırma, etüt,kiralama, taşıma, yıktırma ve personele yapılacak ödemeler,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Konut yapan tüzel kişilerle ortaklık kurmak veya bu amaçla çalışan kuruluşlara iştirak etmek,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Afet hizmetlerine ilişkin diğer işler için ayrılacak para miktarı ile,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Afete uğrayanlara veya uğraması muhtemel olanlara inşaat ve onarım için ne şekilde yardım yapılacağı, miktarı, istekliler arasında gözetilecek sıra esasları, müracaat ve istek şekilleri,inşa olunacak binaların yerleri,sayıları, tipleri, yapı şartları, inşa tarzları, çeşitli kısımların boyutları ve diğer hususlar,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İmar ve İskan Bakanlığınca tespit ve ifa olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
