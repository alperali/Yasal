  </mvz-madde>
  <mvz-madde no="40" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanuna göre arsa olarak dağıtılan veya üzerinde bina inşa edilen taşınmaz mallar, hak sahiplerine borçlandırma senetleri imza ettirilmek sureti ile verilir. Bayındırlık ve İskan Bakanlığınca o yerde borçlandırmanın ilanı tarihinden itibaren Bakanlıkça kabul edilebilir mazereti dışında 2 ay içerisinde borçlanmalarını yapmayanlarla, borçlanmasını yapmış olmasına rağmen binayı Bakanlıkça mahallinde yaptırılacak duyurudan itibaren 45 gün içinde teslim almayanların hak sahipliği kendiliğinden sona erer.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu taşınmaz mallar üzerine, Türkiye Emlak Kredi Bankasının isteği ile, bu banka lehine, tapu dairelerince borçlandırma senetlerine dayanılarak, kanuni ipotek tesis olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Konut ve konut inşaası ve sair yardımlar için yapılacak borçlandırmalar faizsizdir. Dükkan ve fırın gibi yerler için yapılacak borçlandırmalar ise yıllık % 4 (Yüzde dört) faize tabidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Borçluların hesaplarına tahakkuk ettirilecek faizler, banka ve sigorta işlemleri vergisinden muaftır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Borçlandırma bedelleri, konut, konut inşası, arsa ve sair yardımlarda en az 20 ve en çok 30; dükkan ve fırın gibi yerler için yapılan yardımlarda ise,en az 5 ve on çok 15 yılda ve eşit taksitler halinde tahsil edilerek fon hesabına yatırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>İlk taksit, ihaleli ve emanet işlerinde inşaatların bitirilip hak sahiplerine teslimi tarihinden itibaren iki yıl sonra, Evini Yapana Yardım Yönteminde ve orta hasarlı konut ve işyerlerinin onarımında ise son kredi diliminin hak sahibine ödendiği tarihten itibaren iki yıl sonra başlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Vadesinde ödenmeyen taksitlere dair borç, gecikilen her gün için yıllık % 5 gecikme faizi ile tahsil olunur. Vadesinden önce iki yıllık taksitten az olmamak kaydı ile mevcut borcu defaten ödeyen  hak sahibinin  borcu % 20 indirime tâbi tutulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Evini yapana yardım yöntemi ile konut veya işyerinin yapımı için yatırım programında yılı ödeneği ayrılan hak sahiplerinden, 29 uncu maddeye göre yürürlüğe konulan yönetmelikte belirtilen mücbir sebeplerin dışında mazereti olmadan iki yıl içinde konut veya işyerlerinin inşaatına başlamayanlar ile mücbir sebep kapsamında mazereti bulunanlardan mücbir sebebin ortadan kalktığı tarihten itibaren kırkbeş gün içinde inşaatına başlamayanların veya ayrılan ödeneğinin bir kısmını kullandıktan sonra inşaatına devam etmeyen hak sahiplerinin, konutlarının veya işyerlerinin yapımı yatırım programından çıkarılır ve hak sahipliği kendiliğinden sona erer.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Yılı ödeneği ayrılan hak sahiplerinden kendilerine açılan kredinin bir kısmını kullanıp inşaatın geri kalan kısmını kendi imkânları ile projesine uygun olmak kaydıyla fen ve sanat kurallarına uygun olarak tamamlayan hak sahiplerinden, açılan kredinin;</template>
      <mvz-bent no="a">
        <template>% 20'sine kadarını kullanmış olanların kredileri defaten faizsiz olarak,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>% 20'lik dilimden fazlasını kullanmış olanların kredileri ilk iki yılı ödemesiz, konutlar için onbeş yılda faizsiz, işyerleri için yedi yılda ve yıllık % 4 faizli olarak yıllık eşit taksitler halinde,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>tahsil edilir. Vadesinde ödenmeyen taksitlerden geçen günler için yıllık % 5 gecikme faizi tahsil olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Yılı ödeneği ayrılmasına rağmen mücbir sebep bulunmadığı halde iki yıl içinde inşaatına devam etmeyen hak sahiplerinden, açılan kredinin;</template>
      <mvz-bent no="a">
        <template>% 35'ine kadarını kullanmış olanların kredileri defaten ve yıllık % 5 faizli olarak,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>% 35'lik dilimden fazlasını kullanmış olanların kredileri beş yılda ve yıllık % 5 faizli olarak yıllık eşit taksitler halinde,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>tahsil edilir. Vadesinde ödenmeyen taksit miktarları için tebligat tarihinden itibaren tahsil tarihine kadar geçen günler için 4/12/1984 tarihli ve 3095 sayılı Kanuni Faiz ve Temerrüt Faizine İlişkin Kanundaki temerrüt faizi oranları uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="11">
      <template>Üstüste üç yıl taksidini ödemeyenlerin borçları muacceliyet kesbedeceği gibi, borcun tamamı ödenmeden taşınmaz malların başkalarına satılması halinde de borcun tamamı muacceliyet kesbeder. Bu hükmün uygulanmasında maliyet bedelinden yapılan indirimler tekrar borca eklenmek suretiyle hesaba katılır. Özel afet kanunlarına göre yapılan binalar hakkında da bu fıkra hükmü uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="12">
      <template>Muacceliyet kesbeden hesaplar bankaca kendi usul ve mevzuatına göre takip edilir. Satışa çıkarılan taşınmaz mallara istekli çıkmadığı takdirde, banka en son yapılan satışta, takdir edilen kıymetin % 50 sine (Yüzde ellisine) kadar ihaleye iştirak ederek fon hesabına satın alabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="13">
      <template>Bu şekilde satın alınan mallar, 31 inci maddeye göre işlem yapılmak üzere, İmar ve İskan Bakanlığına devredilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="14">
      <template>Rehin açıkları ile rehinsiz alacaklardan tahsili mümkün olmayan alacaklar haciz vesikasına bağlandıktan sonra fon hesabından mahsup edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="15">
      <template>Afetten hasar görmüş binaların onarımı veya kendi yapısını kendi yapacak kimse için yapılan para yardımlarına ait borçlandırmalarda; taşınmaz malı tapusuz ise, kadastro işlemleri sonuçlanıncaya kadar ilgili kimsenin varsa başka tapulu taşınmaz malının ipotek edilmesi, yoksa, kefalet suretiyle borçlandırma yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="16">
      <template>Banka lehine tesis olunacak ipotek muamelesi bu maddenin 1 inci fıkrasına göre tapu dairelerince takrir alınmadan yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="17">
      <template>İnşaatın devamı sırasında veya bitiminden itibaren bir yıl içinde, genel hayata etkili olsun olmasın, ikinci bir afetle binanın zarar görmesi halinde borçlandırma miktarından zarar oranında indirim yapılır. Afetzede isterse,borçlandırma hükümleri dairesinde, İmar ve İskan Bakanlığınca tespit olunacak miktarda yeniden inşaat yardımı yapılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="18">
      <template>Bu kanuna ve afetle ilgili hüküm taşıyan diğer kanunlara göre, ayrı tarihlerde iki defa hak sahibi olarak konut yardımı gören veya görecek olanlardan, genel hayata etkili üçüncü bir afetten konutları oturulamıyacak derecede zarar gören hak sahiplerinin ödeme güçlerini kaybetmeleri halinde, Cumhurbaşkanı Kararı ile önceki borç bakiyeleri terkin olunabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="41" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="42" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunun uygulanması dolayısiyle taşınmaz malların alım, satım, ipotek, tapu - kadastro işlemleri, yeniden inşa edilecek veya onarılacaklarla ilgili ihale, sözleşme, ruhsatname ve sair işlemler ve bu kanundan faydalanacakların verecekleri beyanname, taahhütname ve yapacakları sözleşmeler her türlü vergi, resim ve harçtan muaftır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tapu işlemleri sırasında 27/7/1967 gün ve 930 sayılı kanunun tasarruf bonosu tevdiatı ile ilgili hükümleri uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="43" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanunun birinci maddesinde yazılı afetlerden önce veya sonra alınacak tedbirler arasında:</template>
      <mvz-bent no="a">
        <template>Ecnebi memleketlerden ithal veya iç piyasadan tedarik olunacak her türlü vasıta, makina, alat, gıda maddeleri ve giyim eşyası, tesis ve inşaat malzemesinin deniz, demir ve havayolları vasıtaları ile yapılan nakliyatında asgari ücret tarifeleri tatbik olunur.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Türkiye Kızılay Derneği tarafından bu amaçla yapılacak nakliyat dahi bu hükme tabidir.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>4, 6, 8 ve 9 uncu maddelerde sözü edilen yükümlülerden taşıma ücreti alınmaz.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Şehir, kasaba ve köylerde afete uğrayanların veya uğraması muhtemel olanların geçici veya devamlı inşaat veya tesisat işlerinde kullanılmak üzere, İmar ve İskan Bakanlığının isteği üzerine, lüzumlu orman emvali orman idaresince, Devlet müesseselerinden temini gereken diğer inşaat malzemesi de ilgili Devlet müesseselerince, en yakın istif yeri, depo veya fabrikalarından, kesme taşıma ve imal masrafları karşılığında, öncelikle tahsis olunur.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>İmar ve İskan Bakanlığı,gerektiğinde bu malzemeleri depo etmeğe yetkilidir.</template>
      </mvz-bent>
      <mvz-bent no="0">
        <template>Tahsis olunacak veya stok edilecek orman emvali ve diğer malzemenin cins, miktar ve niteliği İmar ve İskan Bakanlığınca tespit olunur.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>İmar ve İskan Bakanlığınca dış memleketlerden, mevcut kotalara bağlı kalınmaksızın, öncelikle ve ivedilikle, baraka, hazır konut, çadır, her türlü yapı malzemesi, makina (İş ve yapı makinaları dahil), motorlu taşıt, araç, gereç, alat, edevat, cihaz, yedek parça ithal edilebilir veya ettirilebilir. İthal edilen bu mallar gümrük resminden, bu resimle birlikte alınan diğer vergi ve resimlerle belediye hissesinden ve ithalatla ilgili Hazine hissesinden muaftır.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="44" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="45" başlık="">
    <mvz-fıkra no="1">
      <template>Afetlerden zarar görenlere yardımda bulunmak üzere kurulan Milli Yardım Komitesi ile mahalli yardım komitelerine makbuz mukabilinde yapılacak bağış ve yardımlar her türlü vergi, resim ve harcdan müstesna olduğu gibi bunların gelir ve kurumlar vergileri mükellefleri tarafından masraf kaydı da caizdir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Afetlerden zarar görenlere tahsis edilmek üzere tertip edilen temsil, konser ve spor eğlenceleri de her türlü vergi, resim ve harctan muaf tutulur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="46" başlık="">
    <mvz-fıkra no="1">
      <template>33 üncü maddede yazılı afet tertiplerinden yapılacak sarfiyat Artırma, Eksiltme ve İhale, Divanı Muhasebat ve Muhasebei Umumiye kanunlarına tabi değildir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="47" başlık="Ceza hükümleri">
    <mvz-fıkra no="1">
      <template></template>
      <mvz-bent no="a">
        <template>Yardıma davet anında şehir, kasaba ve köylerde bulunup da makbul bir mazeretleri olmaksızın salahiyetli memurlar tarafından yapılan davete icabet etmeyenler veya icabet edip de çalışmayanlar veya verilen işi yapmayanlar hakkında vali veya kaymakamlar tarafından yüz Türk Lirası idarî para cezası verilir.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Afet bölgelerinde felaketzedelere yardım maksadıyla devlet daire ve müesseseleriyle hususi idareler, belediyeler ve köyler ve amme menafiine hadim hayır  cemiyetleri  tarafından  bedelli  veya  bedelsiz  olarak verilen inşaat  malzemesi veya alat ve edevatı veya diğer malları satan veya devreden veya başka maksatlarla kullananlar hakkında, fiilleri daha ağır cezayı istilzam etmediği takdirde, yüz günden az olmamak üzere adlî para cezasına hükmolunur.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Devlet veya devlete bağlı idarelerle sermayesinin en az yarısı devlete ait müessese memurlarına afet dolayısıyla verilen vazifeyi ifada ihmal ve suiistimallerinden veya bu maksatla kendilerine verilen para ve malları zimmete geçirmelerinden veya suç teşkil eden sair fiillerinden dolayı haklarında kamu görevlileri hakkındaki ceza hükümleri tatbik olunur.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="48" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="49" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="50" başlık="Çeşitli hükümler">
    <mvz-fıkra no="1">
      <template>Bu kanunda yazılı vazife ve hizmetlere tahsis edilmiş olan menkul ve gayrimenkul mallarla her türlü hak ve alacaklar, para ve para hükmündeki kıymetli evrak Devlet mallarından sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="51" başlık="">
    <mvz-fıkra no="1">
      <template></template>
      <mvz-bent no="a">
        <template>4373 sayılı kanunun bu kanuna muhalif hükümleri,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>4623 sayılı kanun,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>5607 sayılı kanun,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>2510 sayılı İskan Kanununun 5098 sayılı kanunla muaddel 8 inci maddesi,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>1593 sayılı Umumi Hıfzıssıhha Kanununun 264 üncü maddesi,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>mer'iyetten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bu kanun gereğince yapılacak bina ve tesislere gerekli inşaat malzemeleri, İmar ve İskan Bakanlığının isteği üzerine ilgili resmi müesseselerce öncelikle tahsis olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bir yerin genel hayatına etkili tabii afetler dolayısiyle, kurulan yerlere içme suyu getirilmesi, bağlantı yollarının ve elektrik tesislerinin yapılması meskün yeri tehdideden dere ve sel yataklarının ıslahı ve diğer hizmetler İmar ve İskan Bakanlığının isteği üzerine ilgili Bakanlık ve müesseselerce öncelikle yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Afete uğrayan ve bu kanuna göre hak sahibi olan vatandaşların Hazineye ve diğer kamu kurumlarına olan borçları geçim durumları gözönüne alınarak İmar ve İskan Bakanlığının teklifi üzerine, adı geçen kurumlarca ertelenir. (Vergi Usul Kanunu ile Amme Alacaklarının Tahsil Usulü hakkındaki Kanun hükümleri saklıdır.)</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Gerek bu kanuna veya afetlerle ilgili hükümler kapsıyan öteki kanunlara göre emanet, ihale veya evini yapana yardım yoliyle yapılan veya yaptırılacak olan binaların, gerekse geçici 6 ncı madde hükmünden faydalananların borçları, ilgililerin geçim durumları ve bölgenin özelliği dolayısiyle bina maliyetlerini artırıcı yönden unsurların tesir derecesi gözönünde bulundurularak, zorunlu hallerde Cumhurbaşkanı karariyle maliyet ve borçlandırma bedellerinin yarısına kadar indirim yapılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu hükümden kimlerin ne miktarda ve ne ölçüde faydalanacağına ilişkin esaslar İmar ve İskan Bakanlığınca hazırlanacak bir yönetmelikle tespit olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu madde hükmü her bina için bir defa uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>İmar ve İskan Bakanlığı, afet hizmetlerini süratle ele almak, düzeninde yürütmek ve sonuçlandırmak üzere, gerekli teşkilatı kurar; bu teşkilatın merkez, bölge ve mahalli kademe ve üniteleri bu Bakanlıkça tespit olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="3" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Afet hizmetlerinin yoğunlaştığı ve şümullendiği hallerde, ilgili Bakanlıklar ve kurumlar, İmar ve İskan Bakanının isteği üzerine, yeteri kadar teknik ve idari personeli, hizmet için lüzumlu araç, gereç ve malzemeyi ve bunların kullanılması ve tamiri ile ilgili ekipmanı, geçici olarak, bu teşkilat emrine vermekle yükümlüdürler. Geçici personelin maaş, ücret, yevmiye ve benzer hakları esas dairelerince ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>33 üncü maddeye göre tesis olunan afet tertiplerinden yapılacak harcamaların denetimi, Sayıştayca, ait olduğu yılın sonunda Afet Harcamaları Yönetmeliği esaslarına göre yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="" tür="Ek" durum="mülga">
  </mvz-madde>
  <mvz-madde no="8" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>1 inci ve 2 nci derece deprem bölgelerindeki köy yerleşim yerleri ile kasaba, ilçe ve il merkezlerinde meydana gelen depremler nedeniyle, orta hasar gördüğü teknik ekiplerce tespit edilen ve betonarme olmayan konutların hak sahiplerine kendilerinin isteği halinde, orta hasarlı konutlarını yıkıp, yeniden yapmak koşuluyla bir defaya mahsus olmak üzere Bayındırlık ve İskan Bakanlığınca gerekli miktarda, bu Kanunda öngörülen borçlandırma ve kredilendirme usulleri çerçevesinde arsa ve kredi verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>1 inci maddede öngörülen afetlerle ilgili olarak yeni yerleşim alanları sağlanması amacıyla mera vasfı taşıyan yerlerin tahsis amacı, 4342 sayılı Mera Kanunu hükümlerine göre değiştirilerek, Hazine adına arsa olarak tescil ettirilir. Bu arsalar, tescil tarihi itibarıyla öngörülen amaçla kullanılmak üzere Bayındırlık ve İskân Bakanlığına tahsis edilmiş sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Orman Bakanlığınca, bilim ve fen bakımından orman olarak muhafazasında hiçbir yarar görülmeyen ve tarım alanına dönüştürülmesi de mümkün olmayan orman sınırları dışına çıkarılmış ve çıkarılacak alanlar, genel hayatı etkileyen doğal afet yerlerinde afete maruz kalan kamu kurum ve kuruluşları ile diğer afetzedelerin iskanlarını temin için Bayındırlık ve İskan Bakanlığına devredilebilir. Devredilen bu  yerler üzerinde 2924 sayılı Orman Köylülerinin Kalkınmalarının Desteklenmesi Hakkında Kanun hükümlerine göre hak sahibi statüsünde kişiler bulunması halinde bu hak sahiplerine ait yerler. Bayındırlık ve İskan Bakanlığınca bedeli Afetler Fonundan karşılanmak üzere kamulaştırılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Genel hayatı etkileyen afete maruz yerlerde afetzedelerin iskanı için Cumhurbaşkanlığınca görevlendirilen bir kurum veya kuruluşun veya Bayındırlık ve İskan Bakanlığının teklifi üzerine Orman Bakanlığınca belirlenen alanlarda, 3402 sayılı Kadastro Kanununun 22 nci maddesinin kadastrosu yapılmış olan yerlerin ikinci defa kadastroya tabi tutulamayacağına ilişkin hükmü uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Birinci fıkraya göre Bayındırlık ve İskan Bakanlığına devredilecek alanların tespiti amacıyla Orman Bakanlığınca yeteri kadar orman kadastro komisyonu görevlendirilir ve bu tespit sırasında ilan süresi bir hafta, itiraz süresi bir ay olarak uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>6831 sayılı Kanunun 1 inci maddesine göre ilk defa yapılacak orman kadastrosu uygulamasındaki işlemlere ilişkin sürelerde de üçüncü fıkra hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>6831 sayılı Orman Kanununun 17 nci maddesinin üçüncü fıkrası hükümlerine göre, Devlet ormanları, kamu yararı gözetilerek afet bölgesinde bulunan kamu kurum ve kuruluşları ile doğal afete maruz kalan afetzedelerin iskanının temini için Bayındırlık ve İskan Bakanlığına 49 yıl süre ile bedelsiz olarak tahsis edilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Genel bütçeye dahil olmayan kamu kurum ve kuruluşlarınca doğal afete maruz kalan bölgelere yapılacak bağış ve yardımlar ile eğitim amacıyla yapılmış veya yapılacak olan yardımlar 1050 sayılı Muhasebei Umumiye Kanunu, 2886 sayılı Devlet İhale Kanunu ve 832 sayılı Sayıştay Kanunu hükümlerine tabi değildir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bayındırlık ve İskan Bakanlığı tarafından Toplu Konut İdaresi Başkanlığına, bu Kanun veya afetlere ilişkin hükümler taşıyan diğer kanunlara göre hak sahibi  olan ailelere verilmek üzere konut yaptırılabilir ya da Başkanlığın yaptığı veya yapacağı konutlar satın alınabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Söz konusu işlerin karşılığı, Bayındırlık ve İskan Bakanlığı bütçesinin ilgili tertiplerinden Toplu Konut İdaresine kaynak aktarmak suretiyle sağlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>1 inci maddenin birinci fıkrasında belirtilen afetler nedeniyle afet yaşanılan yerlerde elektrik ve/veya doğal gaz tüketim bedellerinin tahakkuk ve/veya tahsilatlarının süresinin ve kapsamının belirlenerek 1 yıla kadar ertelenmesi ile elektrik ve/veya doğal gaz dağıtım ve/veya tedarik şirketlerinin söz konusu ertelemeden kaynaklanan anapara haricindeki tüketicilerden tahsil edilmeyen bedellere ilişkin finansman maliyetinin, gecikme zammı tutarını geçmemek üzere Enerji ve Tabii Kaynaklar Bakanlığı bütçesinden karşılanmasına Cumhurbaşkanınca karar verilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Finansman maliyeti kapsamına girecek maliyet unsurları da dâhil olmak üzere bu maddenin uygulanmasına ilişkin usul ve esaslar, Hazine ve Maliye Bakanlığının görüşü alınarak Enerji ve Tabii Kaynaklar Bakanlığı tarafından yürürlüğe konulan yönetmelikle belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu kanunun yürürlüğe girmesinden önce;</template>
      <mvz-bent no="A">
        <template>1958 yılında vukubulan sel baskınından zarar gören Çankırı Vilayet Merkezi,</template>
      </mvz-bent>
      <mvz-bent no="B">
        <template>1958 yılında vukubulan sel baskınından zarar gören Kırşehir Vilayetinin Kızılca ve Örcün köyleri,</template>
      </mvz-bent>
      <mvz-bent no="C">
        <template>1958 yılında vukubulan yangında zarar gören Bursa Vilayeti Merkezi,</template>
      </mvz-bent>
      <mvz-bent no="D">
        <template>Yer kaymasından zarar gören Malatya Vilayetinin Darende Kazasına bağlı Sultanlı Köyü,</template>
      </mvz-bent>
      <mvz-bent no="E">
        <template>Sel baskınından ve toprak kaymasından zarar gören Niğde Vilayetinin Merkez Kazasına bağlı Gümüşler Kasabası ile Aksaray Kazasına bağlı Çimeli-Uzartık Köyü,</template>
      </mvz-bent>
      <mvz-bent no="F">
        <template>Yer sarsıntısından zarar gören Muş Vilayetinin Malazgirt Kazası hakkında da bu kanun hükümleri tatbik olunur.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci  fıkrada  yazılı  mahallerde  vukua  gelen  afetler  dolayısiyle  1959  mali yılı Muvazenei Umumiye Kanununa bağlı (A/2)  işaretli  cetvelin  İmar  ve  İskan  Vekaleti  kısmının  751  inci  (Yer  sarsıntısı  ve  diğer  afetlerden  zarar  gören bölgelere yardım) faslındaki tahsisattan Türkiye Kızılay Umumi Merkezi Reisliğine devrolunan ve bu kanunun yürürlüğe girdiği tarihte bakiye kalan meblağ, bu kanunla tesis edilen fona devredilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>6409, 6610, 6683, 6746, 7010, 7048 sayılı kanunlara göre yapılmakta olan işler o kanunlardaki hükümler dairesinde neticelendirilir. Şu kadar ki, bütçelerle verilmiş olan tahsisat bu işlerin neticelendirilmesine kifayet etmediği takdirde bu kanunla tesis edilen fondan lüzumlu miktarları İmar ve İskan Vekaleti tefrik edebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>1959 Mali yılı Muvazenei Umumiye Kanununa bağlı (A/1) işaretli cetvelin İmar ve İskan Vekaleti kısmının 421 inci faslı ile aynı cetvelin Toprak ve İskan İşleri Umum Müdürlüğü kısmının 425 inci faslının 50 nci maddesinde tabii afetler için konulmuş tahsisatları bu kanunla teşkil edilen fona devretmeye Maliye Vekili mezundur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Fonun toplanma ve paraların sarf şekli talimatname ile tayin olununcaya kadar geçecek zaman zarfında tatbik olunacak esaslar Maliye ve İmar ve İskan Vekaletlerince müştereken tesbit olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu kanunun yürürlüğe girdiği tarihten önce vuku bulan umumi hayata müessir afetlerin vuku bulduğu yerlerde de bu kanun hükümlerini tatbika İcra Vekilleri Heyeti salahiyetlidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu kanunun yayımı tarihinden önce afet bölgelerinde, afetten zarar görenlere Türkiye Emlak Kredi Bankasının kendi kaynaklarından yapılan ikrazat ile, adı geçen bankanın yine kendi kaynaklarından inşa ederek borçlandırma suretiyle afetzedelere tahsis ettiği konutların maliyet bedelleri ve bu kanunun yayımı tarihine kadar bu hesaplara tahakkuk ettirip, henüz tahsil edemediği faiz, masraf ve anaparadan ibaret borç bakiyesi ve halen tahsis edemediği konutların maliyet bedelleri bu kanunla teşkil olunan fondan karşılanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Fona intikal eden şahıs borçları içindeki faizler kaldırılarak faizsiz borç üzerinden yapılacak borçlandırmalar, vade ve tahsil işleriyle ilişkin uygulamalar 40 ıncı maddeye göre yürütülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Ancak, Türkiye Emlak Kredi Bankasının bu alacaklarının fon hesabından tasfiye edilebilmesi ve afetzedelerden zarar görenlerin 40 ıncı madde hükmünden faydalanabilmeleri için, zarar gören kimselerin:</template>
      <mvz-bent no="a">
        <template>O yerde, afetin vukuu tarihinde meskene malik olması ve bu meskenin afet dolayısiyle oturulmaz bir hale gelmiş bulunması,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Türkiye Emlak Kredi Bankasının borç verdiği bu paralarla yapılan veya bankanın yaptırarak tahsis ettiği veya edeceği binanın mesken olarak yapılmış olması,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yukardaki esaslara göre fondan karşılanacak borçlar kanunun yürürlüğe girdiği tarihi takip eden takvim yılından itibaren 15 yıl içinde fonun mali imkanlarına uygun taksitlerle ve yüzde 5 faizle birlikte İmar ve İskan Bakanlığınca, Türkiye Emlak Kredi Bankasına ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu kanunun çeşitli maddelerinde düzenlenmesi öngörülen yönetmelikler hazırlanıncaya kadar mevcut yönetmeliklerin bu kanuna aykırı olmıyan hükümlerinin uygulanmasına devam olunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihten önce borçlanma işlemleri tamamlanmadan kullanılan binaların hak sahiplerinin; borçlanması gerekan tarih ile borçlandığı tarih arasındaki gecikmiş taksitleri, geri kalan borçlanma yıllarında ödeyeceği taksit sayısına eşit olarak bölünmek sureti ile ilave edilir. Ancak, geri kalan borçlanma süresi 5 yıldan az ise bu süre 5 yıla çıkarılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Borçlandırma işlemleri bu Kanunun yayımı tarihinden itibaren bir yıl içerisinde maliyet bedeli üzerinden tamamlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bir yıl içerisinde borçlanma işlemini tamamlamayanlar kullandıkları konutlardan tahliye ettirilir ve kullandıkları süre için Valilikçe tespit ettirilecek emsal kira bedeli kendilerinden tahsil edilerek Fon'a gelir kaydedilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihten önce afet nedeniyle yaptırılmış binalara hak sahibi olmadığı halde yerleştirilmiş bulunan ve halen mülkiyeti üzerlerine devir edilmemiş olanlara, oturdukları binalar, rayiç bedeli karşılığında devredilir. Bu bedelin bir yıl içinde defaten veya en çok 4 taksitte Fon'a yatırılması şarttır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihten önce borçlandığı halde binasını devir almayanlara Bakanlıkça mahallinde yaptırılacak duyuru ile 2 ay süre tanınır. Bu süre içinde binasını teslim almayanların hak sahipliği kendiliğinden sona erer. Teslim alanlar için geçici 8 inci madde hükümleri uygulanır. Teslim alınmayan binalar 31 inci maddeye göre yeniden değerlendirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Afetten zarar gören veya zarar görmesi muhtemel bulunanlardan çeşitli nedenlerle hak sahibi olamayanlara bir defaya mahsus olmak üzere Bakanlıkça mahallinde yapılacak duyuru tarihinden itibaran 3 ay içinde başvuranlara rayiç bedel üzerinden satış yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Valiliklerce yapılacak satış işleminde fazla müracaat halinde gerektiğinde kura usulüne başvurulur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Mart 1992 tarihinde Erzincan, Gümüşhane ve Tunceli İllerinde Vuku Bulan Deprem Afetine İlişkin Hizmetlerin Yürütülmesi Hakkında Kanun kapsamına giren yörelerde köy yerleşim birimlerindeki orta hasarlı konutlar ile merkez ve ilçe mahallelerindeki betonarme olmayan konutların hak sahiplerine kendilerinin isteği halinde ve orta hasarlı konutlarını yıkıp yeniden yapmak koşuluyla Kanunun öngördüğü borçlandırma usulleri çerçevesinde ve bir defaya mahsus olmak üzere 65 milyon lira kredi verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17 Ağustos ve 12 Kasım 1999 tarihinde vuku bulan depremler dolayısıyla genel hayata etkili afete maruz bölgede yer alan illerde afete maruz kalanların, hasar tespiti ve hak sahipliği işlemlerine dair esas ve usullerin belirlenmesi ile geçici ve kesin iskanlarının temini amacıyla yeni yerleşim alanlarının tespiti ve prefabrik veya kalıcı konutların, kamu yapıları ve tesislerinin inşaat ve esaslı onarım işlerinin yapımı için her türlü alım, satım, hizmet, yapım,kira, trampa, mülkiyetin gayri ayni hakları tesis etmede ve taşıma işlerinde Bayındırlık ve İskan Bakanlığı yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ancak, Milli Savunma Bakanlığının inşaat, milli ve Nato altyapı hizmetleri ile Ulaştırma Bakanlığına bağlı genel müdürlüklere kanunlar ile yapım yetkisi verilmiş olan özel ihtisas işleri birinci fıkra hükmüne tabi değildir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Gerçek ve tüzel kişiler, deprem bölgesindeki konut ve işyeri ihtiyacını karşılamak ve hibe edilmek üzere Bayındırlık ve İskan Bakanlığınca gösterilecek yerlerde ve bu Bakanlıkça belirlenecek tip projelere uygun konut yapabilir veya yaptırabilir. Ayrıca, gerçek ve tüzel kişiler deprem bölgesinde okul, hastane, sağlık ocağı ve benzeri sosyal alt yapı ihtiyacını karşılamak ve hibe edilmek üzere ilgili bakanlık ile Bayındırlık ve İskan Bakanlığınca gösterilecek ve onaylanacak projelere uygun olarak yapı yapabilir veya yaptırabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu kapsamda yapılacak işler ile 1999 yılı yatırım programı gereğince afet bölgesinde yapılacak işler; 1050 sayılı Muhasebei Umumiye Kanununa, 2886 sayılı Devlet İhale Kanununa, 832 sayılı Sayıştay Kanununun vize ve tescil hükümlerine ve 3194 sayılı İmar Kanununun plan ve parselasyon ile ilgili işlemlerindeki askı, ilan, itirazlara dair sürelere ilişkin hükümlerine tabi değildir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Afetzedelerin yerleşmelerini çok hızlı bir şekilde sağlayabilmek amacıyla; araştırma, sondaj, imalat, prototip imalat, keşif, etüt, harita, plan, proje, müşavirlik, kontrollük ve benzeri her türlü hizmetleri müşavirlik firmaları vasıtasıyla yaptırmaya Bayındırlık ve İskan Bakanlığı yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Türk Ticaret Kanununa ve Vergi Usul Kanununa göre tutulması ve tasdiki zorunlu defterleri ile kullanmak mecburiyetinde bulunduğu belgelerini 17 Ağustos ve 12 Kasım 1999 tarihlerinde vuku bulan depremler nedeniyle kaybeden mükellefler, durumu öğrendiği tarihten itibaren 2 ay içinde yetkili mahkemeden kendisine bir belge verilmesini isteyebilir. Mahkeme gerekli gördüğü delillerin toplanmasını da emredebilir. Böyle bir belge almamış olan mükellef, defterlerini ve belgelerini ibrazdan kaçınmış sayılır. Ancak tabii afete uğrayan yerlerde bulunan mükellefin il veya ilçe idare kurullarından defter ve belgelerinin zayi olduğuna ilişkin olarak alacağı belge de yetkili mahkemeden alınmış belge hükmündedir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17 Ağustos 1999 tarihinde vuku bulan deprem dolayısıyla genel hayata etkili afete maruz bölgede yer alan illerde afete maruz kalan Türk Silahlı Kuvvetlerinin kullanımındaki yapı ve tesisler ve oturdukları kamu konutları hasara uğrayan personel ile birlik, karargah ve tesislerin konuş yeri değişikliği sebebiyle atanan personelin geçici ve kesin iskan ihtiyacının karşılanması amacıyla yapılacak tesislerin; hasar tespiti,deprem bölgesinde veya zorunlu hallerde başka bir bölgede yeniden inşası ve esaslı onarım işlerinin yapımı ve tesislerin işletilmesine ve tefrişine yönelik her türlü alım, satım, hizmet, yapım, kira trampa, mülkiyetin gayri ayni hakları tesis etmede ve taşıma işlerinde Milli Savunma ve İçişleri bakanlıkları yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Deprem nedeniyle hasar gören bu yapı ve tesislerin bir an önce inşası ve esaslı onarımının sağlanması amacıyla; araştırma, sondaj, imalat, prototip imalat, keşif, etüt, harita, plan, proje, müşavirlik, kontrollük ve benzeri her türlü hizmetleri müşavirlik firmaları vasıtasıyla yaptırmaya Milli Savunma ve İçişleri bakanlıkları yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu kapsamda yapılacak işler ile 1999 yılı yatırım programı gereğince afet bölgesinde yapılacak işler; 1050 sayılı Muhasebei Umumiye Kanununa, 2886 sayılı Devlet İhale Kanununa, 832 sayılı Sayıştay Kanununun vize ve tescil hükümlerine ve 3194 sayılı İmar Kanununun plan ve parselasyon ile ilgili işlemlerindeki askı, ilan, itirazlara dair sürelere ilişkin hükümlerine tabi değildir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17 Ağustos 1999 tarihinde vuku bulan deprem dolayısıyla genel hayata etkili afete maruz bölgede yer alan illerde afete maruz kalanlardan bu Kanun kapsamında hak sahibi olanlar ile doğal afet nedeniyle; ikamet ettiği konutu hasara uğrayan veya eşini ya da birinci derecede yakınını kaybeden kişilerden bu durumlarını il valiliklerince verilecek belgelerle tevsik edenlerin konut ihtiyacını karşılamak ve bunlara hibe edilmek üzere, Maliye Bakanlığınca, Bayındırlık ve İskan Bakanlığına tahsis edilmiş olan hazine arazi ve arsaları üzerinde gerçek ve tüzel kişiler tarafından konut yapılmasına izin verilebilir. Ancak tahsis edilen hazine arazi ve arsasının devir ve temlikine ilişkin işlemler, konutların afetzedelere teslim edildiği tarihte yapılır. Bu şekilde konut sahibi olacak hak sahiplerine ayrıca bu Kanun hükümlerine göre konut veya konut kredisi verilmez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="18" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17 Ağustos 1999 tarihinde vuku bulan deprem nedeniyle hizmet bina ve tesislerinin tamamen tahrip olması sonucunda başka bölgelere nakledilen kamu personeline, Başbakan onayı ile belirlenecek miktarda ve onsekiz ayı geçmemek üzere geçici barınma yardımı yapılır. Bu yardım için gerekli kaynak, 23/7/1995 tarihli ve 4123 sayılı Kanunun 5 inci maddesi kapsamında sağlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="19" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17 Ağustos ve 12 Kasım 1999 tarihlerinde vuku bulan depremlerin yol açtığı hasarların giderilmesi  amacıyla Dünya Bankası, Avrupa Konseyi Kalkınma Bankası, Avrupa Yatırım Bankası ve benzeri uluslararası finans kuruluşlarından sağlanacak olan dış kredi ve hibelerde finans edilecek geçici 13 ve 14 üncü maddeler kapsamındaki tüm işler Başbakanlık tarafından koordine edilir ve Başbakanlıkça görevlendirilen bir kurum veya kuruluş tarafından yürütülür.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="20" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Geçici 19 uncu madde kapsamında sağlanacak dış kredi ve hibelerle finanse edilecek projelerin uygulanması dolayısıyla taşınmaz malların alım, satım, ipotek, tapu-kadastro işlemleri, satın alınacak yahut yeniden inşa edilecek veya onarılacak taşınır ve taşınmaz mallarla ilgili ihale, sözleşme, ruhsatname ve sair işlemler, yapım işleri ve alt yapı ile ilgili her türlü belediye işlemleri ve bu uygulamadan faydalanacakların verecekleri beyanname, taahhütname ve yapacakları sözleşmeler, eğitime katkı payı da dahil olmak üzere her türlü vergi, resim, katkı payı ve harçtan muaftır. Söz konusu projeler kapsamında bulunan her türlü yapı malzemesi, makine , motorlu taşıt, araç, gereç, alet, edevat, cihaz ve yedek parça ithal edilebilir veya ithal ettirilebilir. İthal edilen bu mallar gümrük vergisi ve bu vergi ile birlikte alınan her türlü vergi, resim, harç, fon ve diğer mali mükellefiyetlerden muaftır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="21" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17/8/1999 ve 12/11/1999 tarihlerinde meydana gelen depremler nedeniyle yıkılan veya ağır ve orta derecede hasar gören % 70 seviyesinde tamamlanmış konut kooperatiflerinin üyelerine yalnız bir kooperatif ve bir tek üyelik için hak sahipliği tanınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hak sahiplerinin tespitinde, kooperatif yönetim kurulunca hazırlanmış ve imza altına alınmış olan noterden onaylı en son üye isim listesi esas alınır. Bu üyelik, 29 uncu maddeye göre hak sahibi kabul edildikten sonra kredi borcu ödeninceye kadar değiştirilemez veya bu hak başkasına devredilemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Konut kooperatiflerinin inşaat seviyelerinin tespiti, aşağıdaki sıralamaya göre;</template>
      <mvz-bent no="a">
        <template>Kredi kullanılan kuruluşun teknik elemanlarınca hazırlanan en son ekspertiz raporundan,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Kredi kullanılmamışsa belediyelerin vizelerinden,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>İnşaat ihale yolu ile yapılıyorsa hak ediş raporlarından,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Bunların dışında, kullanılan ve fiş, fatura gibi belgeler ile belgelendirilen malzemelerden,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>tespit olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bitmiş, fakat iskan edilmeyen kooperatif binalarından yıkılan veya ağır hasar görenlere bir üyelik hakkı için 6 milyar lira kredi verilir. İnşaatın seviyesine göre, belirlenecek kredi miktarı %70 ila %100 arasında değişen inşaat seviyesi yüzdesi ile kredi üst limiti olan 6 milyar liranın çarpımı ile bulunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bitmiş, fakat iskan edilmeyen kooperatif binalarından orta hasar görenlere bir üyelik hakkı için 2 milyar lira kredi verilir. İnşaatın seviyesine göre belirlenecek kredi miktarı; %70 ila %100 arasında değişen inşaat seviyesi yüzdesi ile kredi üst limiti olan 2 milyar liranın çarpımı ile bulunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Üyeler, olağan veya olağanüstü genel kurul kararı ile yönetim kuruluna kredi kullanma, kredi ile yapılacak iş ve işlemleri yapma ve yürütme konularında yetki verirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Konut kooperatifi üyesi hak sahiplerinden; konutları yıkılan veya ağır ve orta derecede hasar görenlere yukarıda belirtilen yardımlar dışında başka bir yardım yapılmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Yönetim kurulu üyeleri, bu Kanun Hükmünde Kararnameye göre yapılacak iş ve işlemlerde Devlet memurları gibi sorumlu tutulur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="22" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17 Ağustos ve 12 Kasım 1999 tarihlerinde vuku bulan depremler nedeniyle hak sahiplerinin kesin iskanlarının sağlanması için yeni yerleşim alanlarında yapılacak kalıcı konutların, alan içi ve alan dışı alt yapı tesislerini oluşturacak karayolu, demiryolu, su, elektrik, doğalgaz ve kanalizasyon tesisleri için gerekli olan alanların kamulaştırılması ve irtifak hakkı tesisi Bayındırlık ve İskan Bakanlığınca bu Kanunun ilgili hükümlerine göre ve bedeli Afetler Fonundan karşılanmak üzere öncelikle yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="23" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>17 Ağustos 1999 ve 12 Kasım 1999 tarihlerinde meydana gelen depremler sonucunda işyerlerinin ağır hasar görmesi nedeniyle bireysel borçlanmada bulunmuş veya bulunmamış hak sahiplerinden üst üste üç taksidini ödememiş olanların veya taksitlerini ödemekle birlikte kendi istekleriyle hak sahipliğinden vazgeçtiklerini bu maddenin yürürlüğe girdiği tarihten itibaren üç ay içerisinde yazılı olarak beyan edenlerin hak sahipliği, il idare kurulu kararıyla düşürülür ve bu iş yerleri tapu sicilinde Hazine adına tescil edilir. Hak sahipliği düşürülenlerden tazminat alınmaz. Hak sahipliğinin düşürüldüğü tarihe kadar hak sahipleri tarafından ödenen tutar, Afet ve Acil Durum Yönetimi Başkanlığı tarafından kanuni faizi ile birlikte hak sahibine geri ödenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="24" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Diğer kanunlardaki sınırlamalara tabi olmaksızın, mülkiyeti; 13 Mayıs 2014 tarihinde Manisa ili Soma ilçesinde meydana gelen maden kazasında hayatını kaybeden kişilerin mirasçılarına devredilmek üzere; gerçek ve/veya tüzel kişiler tarafından bedelsiz olarak yapılacak konutlar için ihtiyaç duyulan taşınmazlar Afet ve Acil Durum Yönetimi Başkanlığınca maliklerinden bağış, satın alma, kamulaştırma, devir ve temlik veya tahsis yolu ile edinilebilir. Hazinenin özel mülkiyetinde veya Devletin hüküm ve tasarrufu altında bulunan taşınmazlar ile bu Kanunun ek 10 uncu maddesi kapsamında olanlar dâhil orman sınırları dışına çıkarılmış ve çıkarılacak alanlarda bulunan taşınmazlardan aynı amaçla ihtiyaç duyulanlar ise Maliye Bakanlığınca adı geçen Başkanlığa tahsis edilir. Bu taşınmazlardan özelleştirme kapsamında olanlar için ayrıca Özelleştirme Yüksek Kurulu kararı aranmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkraya göre edinilen taşınmazların üzerine yapılan konutlar, adı geçen Başkanlık tarafından maden kazasında hayatını kaybeden kişilerin mirasçıları adına kura ile bedelsiz olarak tapuda devir ve tescil olunur. Bu konutlardan arta kalanlar Maliye Bakanlığınca genel hükümlere göre değerlendirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="25" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bursa İli Gemlik İlçesinde deprem tehlikesi altında bulunan yapıların dönüştürülebilmesi ve yeni yerleşim yerlerinin belirlenmesi için orman olarak muhafazasında bilim ve fen bakımından hiçbir yarar görülmeyen ve tarım alanına da dönüştürülmesi mümkün olmayan yerlerden, sınırları Cumhurbaşkanınca belirlenen alanlar, Orman Genel Müdürlüğünce orman sınırları dışına çıkarılarak tapuda Hazine adına resen tescil edilir. Bu alanlar Çevre ve Şehircilik Bakanlığının tasarrufuna geçer. Bu alanlarda 21/6/1987 tarihli ve 3402 sayılı Kadastro Kanununun 22 nci maddesinin kadastrosu yapılmış olan yerlerin ikinci defa kadastroya tabi tutulamayacağına ilişkin hükmü uygulanmaz. Bu alanların tespiti amacıyla Orman Genel Müdürlüğünce yeteri kadar orman kadastro komisyonu görevlendirilir. Bu tespit sırasında ilan süresi bir hafta, itiraz süresi ise bir ay olarak uygulanır. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Cumhurbaşkanınca belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">

  <mvz-madde no="27" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>6/2/2023 tarihinde meydana gelen depremler nedeniyle genel hayata etkili afet bölgesi olarak kabul edilen yerlerde bu Kanundan faydalanmak suretiyle inşaat kredisi verilmesini ya da bina yaptırılmasını isteyenlerin hak sahipliği başvurusunun yapılacağına dair duyuru, mahallinde mülki idare amirliğince ve Afet ve Acil Durum Yönetimi Başkanlığı resmî internet sitesinde ilan edilir. Duyuruda, ilan tarihinden itibaren iki ay içinde mahallinde mülki idare amirliklerine veya Afet ve Acil Durum Yönetimi Başkanlığınca belirlenen başvuru merkezlerine yazılı olarak ya da e-Devlet Kapısı üzerinden başvuru yapılabileceği belirtilir. Afet ve Acil Durum Yönetimi Başkanlığı gerektiğinde başvurular için en fazla bir ay ek süre verebilir. Başvuru sonuçları, mahallinde mülki idare amirliğince, Afet ve Acil Durum Yönetimi Başkanlığı resmî internet sitesinde ve e-Devlet Kapısı üzerinden ilan edilir. Bu fıkra uyarınca yapılacak ilanlar, 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümlerine göre yapılmış tebligat yerine geçer. Hak sahibi kabul edilmeyenler, onbeş gün içinde mahallinde mülki idare amirliklerine veya Afet ve Acil Durum Yönetimi Başkanlığı tarafından belirlenen başvuru merkezlerine yazılı olarak ya da e-Devlet Kapısı üzerinden itiraz edebilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>6/2/2023 tarihinde meydana gelen depremler nedeniyle genel hayata etkili afet bölgesi olarak kabul edilen yerlerde Çevre, Şehircilik ve İklim Değişikliği Bakanlığı fen heyetleri tarafından tespit edilmiş olan yıkık veya ağır hasarlı konut, işyeri ve ahır sahibi afetzedeler için bu Kanun hükümleri gereğince hak sahibi olmak ve borçlandırmaları yapılmak kaydıyla konut, işyeri, ahır ve her türlü altyapı ve sosyal donatıların inşası veya kredi desteği sağlanmasına ilişkin olarak 29 uncu maddenin sekizinci fıkrasında belirtilen hususlar aranmaksızın işlem yapılır. Ayrıca belirtilen işlemlerin yapılmasında aynı maddenin üçüncü fıkrasında yer alan kısıtlamalar da uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>6/2/2023 tarihinde meydana gelen depremler nedeniyle genel hayata etkili afet bölgesi olarak kabul edilen yerlerde orta hasarlı olarak tespit edilen ve güçlendirilmesi fen ve sanat kurallarına göre elverişli olmadığı için yıktırılan konut, işyeri ve ahırla ilgili 29 uncu maddenin üçüncü ve sekizinci fıkraları hariç olmak üzere, ağır hasarlı konut, işyeri ve ahıra ilişkin hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>6/2/2023 tarihinde meydana gelen depremler nedeniyle genel hayata etkili afet bölgesi olarak kabul edilen yerlerde depremlerin yol açtığı hasarların giderilmesi amacıyla uluslararası kuruluşlardan sağlanacak dış kredi ve hibelerle finanse edilecek projelerin uygulanması dolayısıyla taşınmaz malların alım, satım, ipotek, tapu-kadastro işlemleri, satın alınacak yahut yeniden inşa edilecek veya onarılacak taşınır ve taşınmaz mallarla ilgili ihale, sözleşme, ruhsatname ve sair işlemler, yapım işleri ve altyapı ile ilgili her türlü belediye işlemleri ve bu uygulamadan faydalanacakların verecekleri beyanname, taahhütname ve yapacakları sözleşmeler her türlü vergi, resim, katılma payı, ücret ve harçtan müstesnadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>6/2/2023 tarihinde meydana gelen depremler nedeniyle genel hayata etkili afet bölgesi olarak kabul edilen yerlerde depremlerin yol açtığı hasarların giderilmesi amacıyla yürütülen ulusal ve uluslararası projeler kapsamında bulunan her türlü prefabrik, konteyner ve benzeri geçici barınma malzemesi, yapı malzemesi, makine , afet ve acil durum faaliyetlerinde kullanılacak motorlu taşıtlar, araç, gereç, teçhizat, alet, edevat, cihaz ve yedek parça, afet ve acil durum faaliyetleri kapsamında kullanılacak yardım malzemeleri, afet ve lojistik donanımı, teçhizatı, nakil vasıtaları ve taşıtları Ticaret Bakanlığının uygun görüşü alınarak Afet ve Acil Durum Yönetimi Başkanlığınca ithal edilebilir veya ithal ettirilebilir. İthal edilen bu mallar gümrük vergisi ve bu vergi ile birlikte alınan her türlü vergi, resim, harç, fon ve diğer mali mükellefiyetlerden müstesnadır.</template>
