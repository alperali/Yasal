  <mvz-madde no="1" başlık="Amaç">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı; iş mahkemelerinin kuruluş, görev, yetki ve yargılama usulünü düzenlemektir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="İş mahkemelerinin kuruluşu">
    <mvz-fıkra no="1">
      <template>İş mahkemeleri, Hâkimler ve Savcılar Kurulunun olumlu görüşü alınarak, tek hâkimli ve asliye mahkemesi derecesinde Adalet Bakanlığınca lüzum görülen yerlerde kurulur. Bu mahkemelerin yargı çevresi, 26/9/2004 tarihli ve 5235 sayılı Adlî Yargı İlk Derece Mahkemeleri ile Bölge Adliye Mahkemelerinin Kuruluş, Görev ve Yetkileri Hakkında Kanun hükümlerine göre belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İş durumunun gerekli kıldığı yerlerde iş mahkemelerinin birden fazla dairesi oluşturulabilir. Bu daireler numaralandırılır. İhtisaslaşmanın sağlanması amacıyla, gelen işlerin yoğunluğu ve niteliği dikkate alınarak, daireler arasındaki iş dağılımı Hâkimler ve Savcılar Kurulu tarafından belirlenebilir. Bu kararlar Resmî Gazete’de yayımlanır. Daireler, tevzi edilen davalara bakmak zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İş mahkemesi kurulmamış olan yerlerde bu mahkemenin görev alanına giren dava ve işlere, o yerdeki asliye hukuk mahkemesince, bu Kanundaki usul ve esaslara göre bakılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Dava şartı olarak arabuluculuk">
    <mvz-fıkra no="1">
      <template>Kanuna, bireysel veya toplu iş sözleşmesine dayanan işçi veya işveren alacağı ve tazminatı ile işe iade talebiyle açılan davalarda, arabulucuya başvurulmuş olması dava şartıdır.  Bu alacak ve tazminatla ilgili itirazın iptali, menfi tespit ve istirdat davaları hakkında birinci cümle hükmü uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Davacı, arabuluculuk faaliyeti sonunda anlaşmaya varılamadığına ilişkin son tutanağın aslını veya arabulucu tarafından onaylanmış bir örneğini dava dilekçesine eklemek zorundadır. Bu zorunluluğa uyulmaması hâlinde mahkemece davacıya, son tutanağın bir haftalık kesin süre içinde mahkemeye sunulması gerektiği, aksi takdirde davanın usulden reddedileceği ihtarını içeren davetiye gönderilir. İhtarın gereği yerine getirilmez ise dava dilekçesi karşı tarafa tebliğe çıkarılmaksızın davanın usulden reddine karar verilir. Arabulucuya başvurulmadan dava açıldığının anlaşılması hâlinde herhangi bir işlem yapılmaksızın davanın, dava şartı yokluğu sebebiyle usulden reddine karar verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İş kazası veya meslek hastalığından kaynaklanan maddi ve manevi tazminat ile bunlarla ilgili tespit, itiraz ve rücu davaları hakkında birinci fıkra hükmü uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Arabuluculuk Daire Başkanlığı, sicile kayıtlı arabuluculardan bu madde uyarınca arabuluculuk yapmak isteyenleri, varsa uzmanlık alanlarını da belirterek, görev yapmak istedikleri adli yargı ilk derece mahkemesi adalet komisyonlarına göre listeler ve listeleri ilgili komisyon başkanlıklarına bildirir. Komisyon başkanlıkları, bu listeleri kendi yargı çevrelerindeki arabuluculuk bürolarına, arabuluculuk bürosu kurulmayan yerlerde ise görevlendirecekleri sulh hukuk mahkemesi yazı işleri müdürlüğüne gönderir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Başvuru karşı tarafın, karşı taraf birden fazla ise bunlardan birinin yerleşim yerindeki veya işin yapıldığı yerdeki arabuluculuk bürosuna, arabuluculuk bürosu kurulmayan yerlerde ise görevlendirilen yazı işleri müdürlüğüne yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Arabulucu, komisyon başkanlıklarına bildirilen listeden büro tarafından belirlenir. Ancak tarafların listede yer alan herhangi bir arabulucu üzerinde anlaşmaları hâlinde bu arabulucu görevlendirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Başvuran taraf, kendisine ve elinde bulunması hâlinde karşı tarafa ait her türlü iletişim bilgisini arabuluculuk bürosuna verir. Büro, tarafların resmi kayıtlarda yer alan iletişim bilgilerini araştırmaya da yetkilidir. İlgili kurum ve kuruluşlar, büro tarafından talep edilen bilgi ve belgeleri vermekle yükümlüdür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Taraflara ait iletişim bilgileri, görevlendirilen arabulucuya büro tarafından verilir. Arabulucu bu iletişim bilgilerini esas alır, ihtiyaç duyduğunda kendiliğinden araştırma da yapabilir. Elindeki bilgiler itibarıyla her türlü iletişim vasıtasını kullanarak görevlendirme konusunda tarafları bilgilendirir ve ilk toplantıya davet eder.  Bilgilendirme ve davete ilişkin işlemlerini belgeye bağlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Arabulucu, görevlendirmeyi yapan büronun yetkili olup olmadığını kendiliğinden dikkate alamaz. Karşı taraf en geç ilk toplantıda, yerleşim yeri ve işin yapıldığı yere ilişkin belgelerini sunmak suretiyle arabuluculuk bürosunun yetkisine itiraz edebilir. Bu durumda arabulucu, dosyayı derhâl ilgili sulh hukuk mahkemesine gönderilmek üzere büroya teslim eder. Mahkeme, harç alınmaksızın dosya üzerinden yapacağı inceleme sonunda yetkili büroyu kesin olarak karara bağlar ve dosyayı büroya iade eder. Mahkeme kararı büro tarafından 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümleri uyarınca taraflara tebliğ edilir. Yetki itirazının reddi durumunda aynı arabulucu yeniden görevlendirilir ve onuncu fıkrada belirtilen süreler yeni görevlendirme tarihinden başlar. Yetki itirazının kabulü durumunda ise kararın tebliğinden itibaren bir hafta içinde yetkili büroya başvurulabilir. Bu takdirde yetkisiz büroya başvurma tarihi yetkili büroya başvurma tarihi olarak kabul edilir. Yetkili büro, altıncı fıkra uyarınca arabulucu görevlendirir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Arabulucu, yapılan başvuruyu görevlendirildiği tarihten itibaren üç hafta içinde sonuçlandırır. Bu süre zorunlu hâllerde arabulucu tarafından en fazla bir hafta uzatılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="11">
      <template>Arabulucu, taraflara ulaşılamaması, taraflar katılmadığı için görüşme yapılamaması yahut yapılan görüşmeler sonucunda anlaşmaya varılması veya varılamaması hâllerinde arabuluculuk faaliyetini sona erdirir ve son tutanağı düzenleyerek durumu derhâl arabuluculuk bürosuna bildirir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="12">
      <template>Taraflardan birinin geçerli bir mazeret göstermeksizin ilk toplantıya katılmaması sebebiyle arabuluculuk faaliyetinin sona ermesi durumunda toplantıya katılmayan taraf, son tutanakta belirtilir ve bu taraf davada kısmen veya tamamen haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu tutulur.  Ayrıca bu taraf lehine Avukatlık Asgari Ücret Tarifesine göre belirlenen vekâlet ücretinin yarısına hükmedilir. Her iki tarafın da ilk toplantıya katılmaması sebebiyle sona eren arabuluculuk faaliyeti üzerine açılacak davalarda tarafların yaptıkları yargılama giderleri kendi üzerlerinde bırakılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="13">
      <template>Tarafların arabuluculuk faaliyeti sonunda anlaşmaları hâlinde, arabuluculuk ücreti, Arabuluculuk Asgari Ücret Tarifesinin eki Arabuluculuk Ücret Tarifesinin İkinci Kısmına göre aksi kararlaştırılmadıkça taraflarca eşit şekilde karşılanır. Bu durumda ücret, Tarifenin Birinci Kısmında belirlenen iki saatlik ücret tutarından az olamaz. İşe iade talebiyle yapılan görüşmelerde tarafların anlaşmaları durumunda, arabulucuya ödenecek ücretin belirlenmesinde işçiye işe başlatılmaması hâlinde ödenecek tazminat miktarı ile çalıştırılmadığı süre için ödenecek ücret ve diğer haklarının toplamı, Tarifenin İkinci Kısmı uyarınca üzerinde anlaşılan miktar olarak kabul edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="14">
      <template>Arabuluculuk faaliyeti sonunda taraflara ulaşılamaması, taraflar katılmadığı için görüşme yapılamaması veya iki saatten az süren görüşmeler sonunda tarafların anlaşamamaları hâllerinde, iki saatlik ücret tutarı Tarifenin Birinci Kısmına göre Adalet Bakanlığı bütçesinden ödenir. İki saatten fazla süren görüşmeler sonunda tarafların anlaşamamaları hâlinde ise iki saati aşan kısma ilişkin ücret aksi kararlaştırılmadıkça taraflarca eşit şekilde Tarifenin Birinci Kısmına göre karşılanır. Adalet Bakanlığı bütçesinden ödenen ve taraflarca karşılanan arabuluculuk ücreti, yargılama giderlerinden sayılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="15">
      <template>Asıl işveren-alt işveren ilişkisinin varlığı hâlinde işe iade talebiyle arabulucuya başvurulduğunda, anlaşmanın gerçekleşebilmesi için işverenlerin arabuluculuk görüşmelerine birlikte katılmaları ve iradelerinin birbirine uygun olması aranır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="16">
      <template>Bu madde uyarınca arabuluculuk bürosu tarafından yapılması gereken zaruri giderler; arabuluculuk faaliyeti sonunda anlaşmaya varılması hâlinde anlaşma uyarınca taraflarca ödenmek, anlaşmaya varılamaması hâlinde ise ileride haksız çıkacak taraftan tahsil olunmak üzere Adalet Bakanlığı bütçesinden karşılanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="17">
      <template>Arabuluculuk bürosuna başvurulmasından son tutanağın düzenlendiği tarihe kadar geçen sürede zamanaşımı durur ve hak düşürücü süre işlemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="18">
      <template>Arabuluculuk görüşmelerine taraflar bizzat, kanuni temsilcileri veya avukatları aracılığıyla katılabilirler. İşverenin yazılı belgeyle yetkilendirdiği çalışanı da görüşmelerde işvereni temsil edebilir ve son tutanağı imzalayabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="19">
      <template>Arabuluculuk görüşmeleri, taraflarca aksi kararlaştırılmadıkça, arabulucuyu görevlendiren büronun bağlı bulunduğu adli yargı ilk derece mahkemesi adalet komisyonunun yetki alanı içinde yürütülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="20">
      <template>13/6/1952 tarihli ve 5953 sayılı Basın Mesleğinde Çalışanlarla Çalıştıranlar Arasındaki Münasebetlerin Tanzimi Hakkında Kanunda düzenlenen gazeteci ile 20/4/1967 tarihli ve 854 sayılı Deniz İş Kanununda düzenlenen gemiadamı, bu madde kapsamında işçi sayılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="21">
      <template>Bu maddede hüküm bulunmayan hâllerde niteliğine uygun düştüğü ölçüde 7/6/2012 tarihli ve 6325 sayılı Hukuk Uyuşmazlıklarında Arabuluculuk Kanunu hükümleri uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="22">
      <template>Arabuluculuğa başvuru usulü, arabulucunun görevlendirilmesi ve arabuluculuk görüşmelerine ilişkin diğer hususlar Adalet Bakanlığınca yürürlüğe konulan yönetmelikle belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Sosyal Güvenlik Kurumuna başvuru zorunluluğu">
    <mvz-fıkra no="1">
      <template>31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu ile diğer sosyal güvenlik mevzuatından kaynaklanan uyuşmazlıklarda, hizmet akdine tabi çalışmaları nedeniyle zorunlu sigortalılık sürelerinin tespiti talepleri hariç olmak üzere, dava açılmadan önce Sosyal Güvenlik Kurumuna başvurulması zorunludur. Diğer kanunlarda öngörülen süreler saklı kalmak kaydıyla yapılan başvuruya altmış gün içinde Kurumca cevap verilmezse talep reddedilmiş sayılır. Kuruma karşı dava açılabilmesi için taleplerin reddedilmesi veya reddedilmiş sayılması şarttır. Kuruma başvuruda geçirilecek süre zamanaşımı ve hak düşürücü sürelerin hesaplanmasında dikkate alınmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hizmet akdine tabi çalışmaları nedeniyle zorunlu sigortalılık sürelerinin tespiti talebi ile işveren aleyhine açılan davalarda, dava Kuruma resen ihbar edilir. İhbar üzerine davaya davalı yanında ferî müdahil olarak katılan Kurum, yanında katıldığı taraf başvurmasa dahi kanun yoluna başvurabilir. Kurum, yargılama sonucu verilecek kararı kesinleştikten sonra uygulamakla yükümlüdür.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Görev">
    <mvz-fıkra no="1">
      <template>İş mahkemeleri;</template>
      <mvz-bent no="a">
        <template>5953 sayılı Kanuna tabi gazeteciler, 854 sayılı Kanuna tabi gemiadamları, 22/5/2003 tarihli ve 4857 sayılı İş Kanununa veya 11/1/2011 tarihli ve 6098 sayılı Türk Borçlar Kanununun İkinci Kısmının Altıncı Bölümünde düzenlenen hizmet sözleşmelerine tabi işçiler ile işveren veya işveren vekilleri arasında, iş ilişkisi nedeniyle sözleşmeden veya kanundan doğan her türlü hukuk uyuşmazlıklarına,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>İdari para cezalarına itirazlar ile 5510 sayılı Kanunun geçici 4 üncü maddesi kapsamındaki uyuşmazlıklar hariç olmak üzere Sosyal Güvenlik Kurumu veya Türkiye İş Kurumunun taraf olduğu iş ve sosyal güvenlik mevzuatından kaynaklanan uyuşmazlıklara,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Diğer kanunlarda iş mahkemelerinin görevli olduğu belirtilen uyuşmazlıklara,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>ilişkin dava ve işlere bakar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Yetki">
    <mvz-fıkra no="1">
      <template>İş mahkemelerinde açılacak davalarda yetkili mahkeme, davalı gerçek veya tüzel kişinin davanın açıldığı tarihteki yerleşim yeri mahkemesi ile işin veya işlemin yapıldığı yer mahkemesidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Davalı birden fazla ise bunlardan birinin yerleşim yeri mahkemesi de yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İş kazasından doğan tazminat davalarında, iş kazasının veya zararın meydana geldiği yer ile zarar gören işçinin yerleşim yeri mahkemesi de yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>İş mahkemelerinin yetkilerine ilişkin olarak diğer kanunlarda yer alan hükümler saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu madde hükümlerine aykırı yetki sözleşmeleri geçersizdir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Yargılama usulü ve kanun yolları">
    <mvz-fıkra no="1">
      <template>İş mahkemelerinde basit yargılama usulü uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Davaların yığılması hâlinde, her bir talebe ilişkin vakıalar bakımından ispat yükü ve deliller ayrı ayrı değerlendirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>12/1/2011 tarihli ve 6100 sayılı Hukuk Muhakemeleri Kanununun kanun yollarına ilişkin hükümleri, iş mahkemelerince verilen kararlar hakkında da uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kanun yoluna başvuru süresi, ilamın taraflara tebliğinden itibaren işlemeye başlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kanun yoluna başvurulan kararlar, bölge adliye mahkemesi ve Yargıtayca ivedilikle karara bağlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Temyiz edilemeyen kararlar">

      </mvz-bent>
      <mvz-bent no="c">

  <mvz-madde no="9" başlık="Hüküm bulunmayan hâller">
    <mvz-fıkra no="1">
      <template>Bu Kanunda hüküm bulunmayan hâllerde 6100 sayılı Kanun hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Yürürlükten kaldırılan hükümler">
    <mvz-fıkra no="1">

  <mvz-madde no="1" başlık="Geçiş hükümleri" tür="GEÇİCİ">
    <mvz-fıkra no="1">
      <template>Mülga 5521 sayılı Kanun gereğince kurulan iş mahkemeleri, bu Kanun uyarınca kurulmuş iş mahkemeleri olarak kabul edilir. Bu maddenin yürürlüğe girdiği tarihten önce açılmış olan davalar, açıldıkları mahkemelerde görülmeye devam olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunun dava şartı olarak arabuluculuğa ilişkin hükümleri, bu hükümlerin yürürlüğe girdiği tarih itibarıyla ilk derece mahkemeleri ve bölge adliye mahkemeleri ile Yargıtayda görülmekte olan davalar hakkında uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Başka mahkemelerin görev alanına girerken bu Kanunla iş mahkemelerinin görev alanına dâhil edilen dava ve işler, iş mahkemelerine devredilmez; kesinleşinceye kadar ilgili mahkemeler tarafından görülmeye devam olunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>İlk derece mahkemeleri tarafından bu Kanunun yürürlüğe girdiği tarihten önce verilen kararlar, karar tarihindeki kanun yoluna ilişkin hükümlere tabidir.</template>
    </mvz-fıkra>
  </mvz-madde>
