  <mvz-künye tür="kanun" no="7528" başlık="ÖĞRETMENLİK MESLEĞİ KANUNU"
             tarih="10/10/2024" rgazete-tarih="18/10/2024" rgazete-sayı="32696" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Başlangıç Hükümleri">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; eğitim öğretim hizmetlerini yürüten öğretmenlerin seçilmelerini, yetiştirilmelerini, atanmalarını, haklarını, ödev ve sorumluluklarını, ödül ve cezalarını, kariyer basamaklarında ilerlemelerini ve öğretmenlik mesleğine ilişkin diğer hususlar ile Millî Eğitim Akademisinin kurulması, görevleri, teşkilat yapısı ve personeline ilişkin konuları düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun;</template>
        <mvz-bent no="a">
          <template>Millî Eğitim Bakanlığına bağlı eğitim kurumlarında görev yapan öğretmen ve yöneticileri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Özel kanunlarındaki hükümler saklı kalmak kaydıyla 5 inci, 6 ncı, 20 nci, 24 üncü, 25 inci ve 33 üncü madde hükümleri bakımından özel öğretim kurumlarında görev yapan öğretmenler ile bu kurumlarda öğretmenliğe atanma şartını taşıyan yöneticileri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>20 nci ve 33 üncü madde hükümleri bakımından Millî Eğitim Bakanlığı dışında diğer kamu kurum ve kuruluşlarında görev yapan öğretmenleri,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Millî Eğitim Akademisinin kuruluşu, organları, hizmet birimleri, görevleri ve personeline ilişkin hususları,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen;</template>
        <mvz-bent no="a">
          <template>Akademi: Millî Eğitim Akademisini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Alan: Öğretmenlerin mezun oldukları öğretim programına bağlı olarak atandıkları öğretmenlik alanını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bakan: Millî Eğitim Bakanını,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bakanlık: Millî Eğitim Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Ders yılı: Millî Eğitim Bakanlığına bağlı resmî eğitim kurumlarında derslerin başladığı günden derslerin kesildiği güne kadar geçen süreyi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Dönem: Programı ve takvimi Bakanlıkça belirlenen öğretmenliğe hazırlık eğitiminin on haftadan az on dört haftadan fazla olmayacak şekilde planlanan her bir bölümünü,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Eğitim kurumu: Bakanlığa bağlı her kademe ve türdeki resmî örgün ve yaygın eğitim faaliyetlerinin yürütüldüğü kurumlar ile bu kurumlarda yürütülen eğitim öğretim etkinlikleri için program hazırlama, eğitim araç ve gereci üretme, inceleme, değerlendirme, öğrenci ve öğrenci adaylarına uygulanacak seçme ve/veya yarışma sınavları için gerekli iş ve işlemleri yürütme, rehberlik ve sosyal hizmetler verme yoluyla yardımcı ve destek olan Bakanlığa bağlı resmî kurumları,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Eğitim öğretim yılı: Ders yılının başladığı tarihten, ertesi ders yılının başladığı tarihe kadar geçen süreyi,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Eğitim personeli: Akademinin eğitim faaliyetlerini yürütmek üzere 30 uncu madde kapsamında istihdam edilenleri,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Eğitim ve uygulama merkezi: Akademinin görev alanına giren eğitim faaliyetlerinin yürütüldüğü merkezi,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Hazırlık eğitimi: Akademi tarafından teorik ve uygulamalı olarak verilen öğretmenlik mesleğine hazırlık amaçlı eğitimi,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>İlçe grubu: İllerde coğrafi özellikler ve ulaşım imkânları dikkate alınarak iki veya daha fazla ilçenin bir araya getirilmesiyle oluşturulan grubu,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Kademe: Eğitim kurumlarının anaokulu, ilkokul, ortaokul ve lise şeklindeki düzeylerini,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Norm kadro: Bakanlığa bağlı eğitim kurumlarında bulunması gereken yönetici ve öğretmen sayısını,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Öğretmen: Bakanlığa bağlı eğitim kurumlarında 14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanununun 4 üncü maddesinin (A) ve (B) fıkraları kapsamında öğretmen kadro ve pozisyonlarında görev yapanlar ile bu Kanunda münhasıran belirtilen hükümler bakımından özel öğretim kurumlarında 8/2/2007 tarihli ve 5580 sayılı Özel Öğretim Kurumları Kanunu kapsamında görev yapan öğretmenleri, bu kurumlarda öğretmenliğe atanma şartlarını taşıyan yöneticileri ve Bakanlık dışındaki kamu kurum ve kuruluşlarında görev yapan öğretmenleri,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Öğretmen adayı: Akademide hazırlık eğitimine alınanları,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Tür: Aynı kademedeki eğitim kurumlarından farklı eğitim programı uygulayan eğitim kurumlarını,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Yönetici: Öğretmen kadro ve pozisyonlarında görev yapanlardan Bakanlığa bağlı resmî eğitim kurumları ile Akademiye bağlı eğitim ve uygulama merkezlerinde müdürlük ve müdür yardımcılığı görevlerini ikinci görev kapsamında yürütenleri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Temel ilkeler">
      <mvz-fıkra no="1">
        <template>Öğretmen ve yöneticilerin;</template>
        <mvz-bent no="a">
          <template>Nitelikleri ile görev, yetki ve sorumluluklarının öğretmenlik mesleğinin gereklerine uygun olarak belirlenmesi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Atama, görevlendirme ve meslek içinde ilerlemelerinde liyakat ve kariyer esaslarına uyulması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Eğitim öğretim faaliyetleri ve meslekleriyle ilgili kararlara katılımlarının teşvik edilmesi ve bunun için uygun ortamların sağlanması,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Mesleğe giriş öncesinde yetiştirilmelerinin ve meslek içinde sürekli gelişimlerinin sağlanması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>esastır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Hak, Ödev ve Sorumluluklar">
    <mvz-madde no="5" başlık="Öğretmenlerin hak, ödev ve sorumlulukları">
      <mvz-fıkra no="1">
        <template>Öğretmenler;</template>
        <mvz-bent no="a">
          <template>Öğrencilerini; Atatürk inkılap ve ilkelerine ve Anayasada ifadesini bulan Atatürk milliyetçiliğine bağlı, Türk Milletinin millî, ahlaki, insani, manevi ve kültürel değerlerini benimseyen, koruyan ve geliştiren; ailesini, vatanını, milletini seven ve daima yüceltmeye çalışan, insan haklarına ve Anayasanın başlangıcındaki temel ilkelere dayanan demokratik, laik ve sosyal bir hukuk Devleti olan Türkiye Cumhuriyetine karşı görev ve sorumluluklarını bilen ve bunları davranış hâline getirmiş erdemli insanlar olarak yetiştirir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Öğrencilerin bedensel, zihinsel, duygusal, sosyal ve ahlaki bakımdan gelişimi için çaba gösterir, bu doğrultuda meslektaşları, aile ve veli ile iş birliği yapar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Öğrencilerin öğrenme biçimleri ile ilgi ve yeteneklerini dikkate alır ve kişilik haklarına saygı gösterir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Öğrencilerin, eğitim öğretim ortamında her türlü olumsuz söz, tavır ve davranışlardan korunmaları için çaba gösterir.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bakanlıkça belirlenen öğretim programları çerçevesinde öğrencilerin gelişim özelliklerine ve öğrenme ihtiyaçlarına uygun eğitim araç ve gereçlerini seçer, bu özellik ve ihtiyaçlara uygun öğretim yöntem ve tekniklerini uygular.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Eğitim öğretim faaliyetlerini, 14/6/1973 tarihli ve 1739 sayılı Millî Eğitim Temel Kanununda düzenlenen Türk millî eğitiminin genel amaçları ve temel ilkeleri ile Bakanlıkça belirlenen öğretim programlarına uygun olarak planlar ve yürütür.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Eğitim öğretim faaliyetlerinin etkili bir şekilde yürütülebilmesi için okul içi ve okul dışı imkânları kullanır.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Eğitim öğretim faaliyetlerinin niteliğinin artırılması için meslektaşlarıyla iş birliği yapar ve eğitim kurumu yönetimine destek verir.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Görev yaptığı eğitim kurumundaki eğitim öğretim faaliyetlerini ve sorumluluklarını aksatmadan mesleki açıdan kendini geliştirir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Öğretmenler; derse girmek, nöbet tutmak, merkezî veya mahallî yapılan sınavlarda görev almak, kurul ve komisyonlara, tören ve toplantılara, öğrencilere yönelik düzenlenecek etkinlikler ile kulüp faaliyetlerine katılmak, öğrenci rehberlik hizmetlerini yürütmek, uygulama gerektiren eğitimleri koordine etmek ve eğitim öğretim süreçlerine ilişkin diğer iş ve işlemleri yürütmekle görevlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Öğretmenler mevzuatta açıkça belirlenen hususlar ile olağanüstü hâl, genel afet ve salgın hastalık durumları haricinde meslekleriyle ilgili olmayan iş ve faaliyetlerde rızaları dışında görevlendirilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Öğretmenlerin bu maddede belirtilen hak, ödev ve sorumluluklarına ilişkin usul ve esaslar ile eğitim öğretim süreçlerindeki diğer görevleri okul tür ve kademelerine göre Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Yöneticilerin ödev ve sorumlulukları">
      <mvz-fıkra no="1">
        <template>Yöneticiler;</template>
        <mvz-bent no="a">
          <template>Anayasa, kanunlar ve ilgili diğer mevzuat hükümleri doğrultusunda Türk millî eğitiminin genel amaç ve temel ilkelerine uygun olarak yönetim ve denetim görevlerini yürütür.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Eğitim öğretim programlarının amaçlarına uygun yürütülmesini sağlar ve öğrencilerin bedensel, zihinsel, duygusal, sosyal ve ahlaki bakımdan gelişimine yönelik çalışmalara liderlik eder.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Eğitim öğretim faaliyetlerinin sağlıklı, güvenli ve huzurlu bir ortamda yürütülmesi için gerekli tedbirleri alır.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Eğitim kurumunun sürekli gelişim göstermesi ve eğitim öğretimin kalitesinin yükselmesi için çaba gösterir ve bu amaçlar doğrultusunda tüm kaynakların etkin, etkili ve verimli kullanılmasını sağlar.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Öğretmen ve diğer çalışanların ilgi ve yeteneklerini, görev ve sorumluluklarını esas alarak iş bölümü yapar ve tüm çalışanlara görevlerinin ifasında rehberlik eder.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yöneticilerin bu maddede belirtilen ödev ve sorumluluklarına ilişkin hususlar okul tür ve kademelerine göre Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Öğretmenlerin Nitelikleri, Seçimi, Hazırlık Eğitimi, Öğretmenliğe Atama ve Yer Değiştirme">
    <mvz-madde no="7" başlık="Öğretmenlerin nitelikleri ve seçimi">
      <mvz-fıkra no="1">
        <template>Öğretmenlik; genel kültür, özel alan eğitimi ve öğretmenlik meslek bilgisi bakımından hazırlığı gerektiren özel bir ihtisas mesleğidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Öğretmen olarak istihdam edilecekler, öğretmenlik mesleğine kaynak teşkil eden en az lisans düzeyinde yükseköğretim programlarından veya bunlara denkliği kabul edilen yurt dışı yükseköğretim programlarından mezun olan ve hazırlık eğitiminde başarılı olanlar arasından seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Öğretmen olarak istihdam edileceklerde genel kültür, özel alan eğitimi ve öğretmenlik meslek bilgisi bakımından aranacak nitelikler ile öğretmenlik alanlarına kaynak teşkil edecek yükseköğretim programları, söz konusu nitelikler esas alınarak Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Hazırlık eğitimi">
      <mvz-fıkra no="1">
        <template>Öğretmenlik mesleği yeterlikleri çerçevesinde belirlenen teorik ve uygulamalı derslerden oluşan hazırlık eğitimi, Akademi tarafından verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Öğretmenlik mesleğinin gerektirdiği bilgi, beceri, tutum ve değerleri içeren öğretmenlik mesleği yeterlikleri Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hazırlık eğitiminin süresi dört dönemdir. Bu süre, öğretmen adayının mezun olduğu yükseköğretim programına göre üç dönem olarak uygulanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hazırlık eğitiminin içeriği, süresi ve hazırlık eğitimine ilişkin diğer hususlar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Hazırlık eğitimine alınacakların belirlenmesi">
      <mvz-fıkra no="1">
        <template>Hazırlık eğitimine alınacaklarda;</template>
        <mvz-bent no="a">
          <template>Türk vatandaşı olmak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu haklarından mahrum bulunmamak,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama, kaçakçılık, uyuşturucu veya uyarıcı madde imal ve ticareti, uyuşturucu veya uyarıcı madde kullanılmasını kolaylaştırma, kullanmak için uyuşturucu veya uyarıcı madde satın almak, kabul etmek veya bulundurmak ya da uyuşturucu veya uyarıcı madde kullanmak, hayâsızca hareketler, müstehcenlik ve fuhuş suçları ile cinsel dokunulmazlığa karşı suçlardan mahkûm olmamak,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Devlet memurluğundan çıkarılmamış veya 25 inci maddeye göre öğretmenliği sona ermemiş olmak,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Askerlikle ilgisi bulunmamak, muvazzaf askerlik hizmetini yapmış veya muvazzaf askerlik hizmeti ertelenmiş ya da yedek sınıfa geçirilmiş olmak,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Öğretmenliğe atanacağı alan için Bakanlıkça belirlenen yükseköğretim programlarından mezun olmak,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Ölçme, Seçme ve Yerleştirme Merkezi Başkanlığı tarafından yapılan sınavlardan alanlara göre Bakanlıkça belirlenecek sınav puanına sahip olmak,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Sağlık durumu yönünden öğretmenlik görevini yapmasına engel bir durumu olmamak,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>şartları aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hazırlık eğitimine alınacak adaylar, atama izni verilen pozisyon sayısını geçmemek üzere, birinci fıkranın (f) bendinde belirtilen sınav puanı üstünlüğüne göre belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>24/5/1983 tarihli ve 2828 sayılı Sosyal Hizmetler Kanunu, 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu kapsamındaki ve millî sporcu statüsündeki öğretmen adaylarının hazırlık eğitimine alınmasında, birinci fıkranın (f) bendinde belirtilen şart dışındaki diğer şartlar aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hazırlık eğitimine alınacaklara 7/4/2021 tarihli ve 7315 sayılı Güvenlik Soruşturması ve Arşiv Araştırması Kanununa göre güvenlik soruşturması ve arşiv araştırması yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Hazırlık eğitiminde başarı">
      <mvz-fıkra no="1">
        <template>Hazırlık eğitiminde her bir teorik dersten en az iki yazılı sınav yapılır. Her bir dersten not ortalaması yüz üzerinden altmış ve üzerinde olanlar başarılı sayılır. Teorik derslerden başarısız olanlara, başarısız oldukları her bir ders için ek bir sınav hakkı verilir. Ek sınavdan altmış ve üzerinde puan alanlar ilgili dersten başarılı sayılır. Ek sınavlar sonunda herhangi bir dersten başarısız olanların Akademiyle ilişiği kesilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hazırlık eğitiminde edinilen bilgi, beceri, tutum ve davranışların eğitim öğretim ortamına yansıtılmasındaki başarı düzeyini belirlemek amacıyla öğretmen adayı üç defa değerlendirmeye tabi tutulur. Söz konusu değerlendirme, uygulamadan sorumlu eğitim personeli, uygulamanın yapıldığı eğitim kurumunun müdürü ve uygulama öğretmeni tarafından; Bakanlıkça belirlenen öğretmenlik mesleği yeterlikleri esas alınarak Akademi tarafından öğretmenlik atama alanlarına göre oluşturulan değerlendirme formu üzerinden yapılır. Uygulamadan sorumlu eğitim personeli, eğitim kurumu müdürü ve uygulama öğretmeni tarafından ayrı ayrı doldurulan değerlendirme formlarında verilen puanların aritmetik ortalaması alınarak değerlendirme puanı belirlenir. Birinci değerlendirme puanının yüzde yirmisi, ikinci değerlendirme puanının yüzde otuzu, üçüncü değerlendirme puanının yüzde ellisi alınarak uygulamalı ders başarı puanı belirlenir. Öğretmen adaylarından uygulamalı ders başarı puanı yüz üzerinden yetmiş ve üzerinde olanlar başarılı sayılır. Uygulamalı derslerde başarısız olanların Akademiyle ilişiği kesilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hazırlık eğitiminin sonunda, teorik derslerin başarı notlarının aritmetik ortalamasının yüzde kırkı, uygulamalı derslerin başarı notlarının aritmetik ortalamasının yüzde altmışı toplanarak atamaya esas başarı puanı belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hazırlık eğitimine devam zorunludur. Öğretmen adaylarından belgeye dayalı sağlık mazeretleri sebebiyle hazırlık eğitimi süresince toplam yirmi gün ve üzeri hazırlık eğitimine katılamayan veya katılamayacak olanların, mazeretlerinin ortadan kalkmasını takip eden ilk hazırlık eğitimi programına tekrar alınmak üzere kayıtları dondurulur. Belgeye dayalı sağlık mazeretleri dışında öğretmen adaylarına mazeretlerine bağlı olarak hazırlık eğitimi süresince on güne kadar izin verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Uygulama öğretmeninin, öğretmen adayıyla aynı alanda olmak şartıyla uygulamalı eğitimin yapıldığı eğitim kurumundaki sırasıyla; başöğretmen, uzman öğretmen, en fazla hizmet süresi bulunan öğretmenler arasından belirlenmesi esastır. Öğretmen adayının uygulamalı eğitime katıldığı eğitim kurumunda aynı alanda öğretmen bulunamaması hâlinde aynı sıralama dikkate alınarak farklı alandan uygulama öğretmeni görevlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu maddenin uygulanmasına ilişkin hususlar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Akademi ile ilişiğin kesilmesi">
      <mvz-fıkra no="1">
        <template>Öğretmen adaylarından;</template>
        <mvz-bent no="a">
          <template>9 uncu maddenin birinci fıkrasında düzenlenen şartlardan herhangi birini taşımadığı sonradan anlaşılanların veya hazırlık eğitimi sırasında bu şartlardan herhangi birini kaybedenlerin,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Disiplin soruşturması sonucunda Akademiden çıkarma ile tecziye edilenlerin,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Hazırlık eğitiminde başarısız olanların,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Akademi ile ilişiği kesilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Disiplin cezaları ve disiplin cezası gerektiren fiil ve davranışlar">
      <mvz-fıkra no="1">
        <template>Öğretmen adaylarına uygulanacak disiplin cezaları ile bu cezalara karşılık gelen fiil ve davranışlar şunlardır:</template>
        <mvz-bent no="a">
          <template>Kınama; öğretmen adayına, fiil ve davranışında kusurlu olduğunun bildirilmesidir. Kınama cezasını gerektiren fiil ve davranışlar şunlardır:</template>
          <mvz-altbent no="1">
            <template>Ders, seminer, sınav, uygulama ve diğer eğitim öğretim ortamlarında yürütülen çalışmaların düzenini bozmak; bu çalışmalara geç gelmeyi veya erken ayrılmayı alışkanlık hâline getirmek.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Sınavlarda kopya çekmeye teşebbüs etmek.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Hazırlık eğitimine mazeretsiz olarak toplam iki gün katılmamak.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Akademinin sunduğu imkânlardan hakkı olmaksızın yararlanmak veya bu imkânlardan başkasını yararlandırmak.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Akademi personelini ya da öğretmen adaylarını kaba veya yaralayıcı sözle rencide etmek.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Akademinin düzen ve işleyişini olumsuz etkileyen davranışlarda bulunmak.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Akademide yürütülen eğitim faaliyetlerine ilişkin ses veya görüntüleri ilgili mevzuatında belirlenmiş usuller dışında paylaşmak.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ödeme kesintisi; 14 üncü maddede düzenlenen ödemeden 1/10 oranında kesinti yapılmasıdır. Ödeme kesintisi gerektiren fiil ve davranışlar şunlardır:</template>
          <mvz-altbent no="1">
            <template>Akademi yetkililerince istenilen bilgileri kasıtlı olarak eksik veya gerçeğe aykırı bildirmek.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Akademiye ait alanlarda alkollü içki içmek veya Akademiye sarhoş gelmek.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Hazırlık eğitimine mazeretsiz olarak toplam dört gün katılmamak.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Kasıtlı olarak Akademi bünyesinde mevcut bina, demirbaş eşya ve benzeri malzemeyi tahrip etmek veya bilişim sistemine zarar vermek.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Kişilerin şeref ve haysiyetini zedeleyen söz, davranış veya yazılı eylemlerde bulunmak.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Akademi personelini veya öğretmen adaylarını tehdit etmek.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Sınavlarda kopya çekmek veya çektirmek.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Akademiden çıkarma; öğretmen adayının, Akademiden ilişiğinin kesilmesidir. Akademiden çıkarmayı gerektiren fiil ve davranışlar şunlardır:</template>
          <mvz-altbent no="1">
            <template>Terör örgütlerine veya Devletin millî güvenliğine karşı faaliyette bulunduğuna karar verilen yapı, oluşum veya grupların siyasi ve ideolojik görüşleri doğrultusunda propaganda yapmak, eylem düzenlemek veya düzenlenmiş eylemlere etkin biçimde katılmak.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Bölücü, yıkıcı, ahlak dışı veya şiddeti özendiren sesli, sözlü, yazılı veya görüntülü içerikleri oluşturmak veya bunları çoğaltmak.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Akademinin faaliyetlerini engelleyici eylemlerde veya saldırıda bulunmak.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Akademi görevlilerine veya öğretmen adaylarına karşı cebir ve şiddet kullanmak.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Uyuşturucu veya uyarıcı maddeleri temin etmek, kullanmak, taşımak, bulundurmak, başkalarına vermek, bunların imal veya ticaretini yapmak.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Akademide 10/7/1953 tarihli ve 6136 sayılı Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanuna aykırı olarak ateşli silahlarla mermilerini ve bıçaklarla saldırı ve savunmada kullanılmak üzere özel olarak yapılmış bulunan diğer aletleri, patlayıcı maddeleri taşımak veya bulundurmak.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Akademinin bilişim sistemine yasal olmayan yollarla girerek kendisine veya başkasının yararına haksız bir çıkar sağlamak ya da kişilerin mağduriyetine neden olmak.</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>Cinsel davranışlarda bulunmak suretiyle kişilerin vücut dokunulmazlıklarını ihlal etmek.</template>
          </mvz-altbent>
          <mvz-altbent no="9">
            <template>Hazırlık eğitimine giriş başvurusunda veya hazırlık eğitimi sürecinde istenilen belgeleri gerçeğe aykırı düzenlenmiş veya tahrif edilmiş olarak sunmak.</template>
          </mvz-altbent>
          <mvz-altbent no="10">
            <template>Hazırlık eğitimine mazeretsiz olarak toplamda altı gün katılmamak.</template>
          </mvz-altbent>
          <mvz-altbent no="11">
            <template>Kendi yerine başkasını sınava sokmak veya başkasının yerine sınava girmek.</template>
          </mvz-altbent>
          <mvz-altbent no="12">
            <template>Soruşturma ile görevlendirilenleri tehdit etmek veya bunlara saldırıda bulunmak.</template>
          </mvz-altbent>
          <mvz-altbent no="13">
            <template>Yüz kızartıcı ve utanç verici fiil ve davranışlarda bulunmak.</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada sayılan ve disiplin cezası verilmesini gerektiren fiil ve davranışlara nitelik ve ağırlıkları itibarıyla benzer eylemlerde bulunanlara da aynı neviden disiplin cezaları verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Disiplin Kurulu ve disiplin cezalarının uygulanmasına ilişkin hususlar">
      <mvz-fıkra no="1">
        <template>Disiplin Kurulu; Akademi Başkanı tarafından Akademik Kurul üyeleri arasından üç, Akademide görevli daire başkanları arasından iki üye olmak üzere her bir eğitim programı süresi için belirlenecek beş üyeden oluşur. Aynı usulle beş yedek üye belirlenir. Disiplin Kurulu ilk toplantısında kendi üyeleri arasından bir üyeyi Başkan olarak seçer.</template>
        <mvz-bent no="a">
          <template>Disiplin Kurulunun çalışma usulü:</template>
          <mvz-altbent no="1">
            <template>Akademiden çıkarma cezası için eğitim ve uygulama merkezi müdürü tarafından yaptırılan soruşturmaya ait dosya, Disiplin Kuruluna tevdi edilir.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Disiplin Kurulu, Disiplin Kurulu Başkanının çağrısı üzerine belirlenecek yer, gün ve saatte toplanır.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Toplantı gündeminin hazırlanması, ilgililere duyurulması, kurul çalışmalarının düzenli yürütülmesi Disiplin Kurulu Başkanı tarafından sağlanır.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Disiplin Kurulu üye tam sayısı ile toplanır. Mazereti nedeniyle toplantıya katılamayan üyenin yerine yedek üye toplantıya katılır.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Disiplin Kurulunda raportörlük görevi, Başkanın görevlendireceği üye tarafından yürütülür. Raportör üye, havale edilecek dosyanın incelenmesini en geç on gün içinde tamamlar.</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>Kurulda öncelikle raportörün açıklamaları dinlenir. Disiplin Kurulu, kendine intikal eden dosyaların incelenmesinde, gerekli gördüğü takdirde, soruşturma konusuna ilişkin her nevi evrakı incelemeye, ilgili eğitim ve uygulama merkezi ve kurumlardan bilgi almaya, yeminli tanık ve bilirkişi dinlemeye veya niyabeten dinletmeye, mahallen keşif yapmaya veya yaptırmaya yetkilidir.</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>Hakkında Akademiden çıkarma cezası istenen öğretmen adayı soruşturma evrakını inceleme, tanık dinletme, Disiplin Kurulunda sözlü veya yazılı olarak kendisi veya vekili vasıtasıyla savunma yapma hakkına sahiptir.</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>Görüşmelerin bitiminde oylama yapılır ve karar Başkan tarafından açıklanır.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Disiplin Kurulunun oylama ve karar şekli:</template>
          <mvz-altbent no="1">
            <template>Disiplin Kurulu, soruşturmada eksiklik olduğunun tespiti hâlinde bu eksikliklerin giderilmesi talebiyle dosyayı iade edebilir.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Disiplin Kurulu oy çokluğu ile karar alır.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Disiplin Kurulu üyeleri, soruşturmasını yürüttüğü dosyanın toplantılarına katılamaz ve oy kullanamaz.</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Disiplin soruşturması başlatma ve ceza verme yetkisi:</template>
        <mvz-bent no="a">
          <template>Öğretmen adaylarının işledikleri disiplin suçlarından dolayı soruşturma açmaya eğitim ve uygulama merkezi müdürü yetkilidir. Soruşturma, yetkili eğitim ve uygulama merkezi müdürü veya Akademi Başkanının, eğitim ve uygulama merkezi yönetici veya eğitim personeli ya da Akademi Başkanlığı personeli arasından belirleyeceği muhakkikler eliyle yürütülür.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Eğitim ve uygulama merkezi müdürü, gerekçesini belirtmek suretiyle Akademi Başkanından eğitim ve uygulama merkezi dışından muhakkik görevlendirilmesini talep edebilir. Akademi Başkanı talebi uygun gördüğü takdirde muhakkik görevlendirir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kınama ve ödeme kesintisi cezaları eğitim ve uygulama merkezi müdürü; Akademiden çıkarma cezası Disiplin Kurulu tarafından verilir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Eğitim ve uygulama merkezi müdürü, muhakkikler tarafından önerilen disiplin cezasını aynen verebilir, hafifletebilir veya reddedebilir.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Disiplin Kurulu teklif edilen cezayı kabul eder veya reddeder. Ret hâlinde eğitim ve uygulama merkezi müdürü ret kararının gerekçesini de göz önüne alarak söz konusu ceza teklifini yetkisi sınırlılığında hafifletebilir veya tamamen kaldırabilir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Disiplin soruşturmasına, disipline konu olay öğrenilince derhâl başlanılması ve soruşturmanın soruşturmaya başlanılmasından itibaren en geç otuz gün içinde sonuçlandırılması esastır. Soruşturma bu süre içinde tamamlanamaz ise muhakkikler gerekçeli olarak ek süre talep edebilir. Eğitim ve uygulama merkezi müdürü sunulan gerekçeyi ve zamanaşımı sürelerini de dikkate alarak otuz güne kadar ek süre verebilir. Akademi Başkanı tarafından yapılan görevlendirmelerde ek süre verilmesi hâlinde Akademi Başkanına bilgi verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Disiplin soruşturmasında uyulması gereken hususlar:</template>
        <mvz-bent no="a">
          <template>Disiplin soruşturmasında gizlilik esastır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Muhakkik, savunma isteme ve disiplin cezası verme yetkisi hariç olmak üzere soruşturma konusuyla sınırlı her türlü evrakı incelemeye, hakkında soruşturma yapılanın ifadesini almaya, soruşturma yapılan tarafından gösterilen veya bilgisi olabileceğini değerlendirdiği kişilerden bilgi istemeye ve/veya bunları dinlemeye yetkilidir. İfade alınırken tanığa ve bilirkişi tayini durumunda bilirkişiye yemin ettirilir; tanığın veya bilirkişinin kimliği, adresi ve benzeri açıklayıcı bilgiler belirtilir. İfade tutanağı, soruları ve cevapları belirtecek şekilde düzenlenir; muhakkik, görevlendirilmesi hâlinde kâtip ve ifade sahibi tarafından imzalanır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Akademi personeli, muhakkiklerin istedikleri her türlü bilgi, dosya ve başka belgeleri hiçbir gecikmeye mahal bırakmaksızın verir ve istenecek yardımları yerine getirir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Muhakkikler, hakkında soruşturma açılan kişi ve eylemlerle sınırlı olmak üzere soruşturmayı yürütür ve tamamlar. Soruşturma esnasında soruşturulan eylemin dışında başka disiplin suçlarının işlendiğini veya aynı suç kapsamında başka öğretmen adaylarının soruşturmaya dâhil edilmesi gerektiğini tespit eden muhakkikler, durumu eğitim ve uygulama merkezi müdürüne bildirerek ek soruşturma onayı talep ederler.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Öğretmen adayının, disiplin suçunu işledikten sonra Akademiden her ne sebeple olursa olsun ayrılmış olması, soruşturma açılmasına, soruşturmanın devamına ve disiplin cezalarının uygulanmasına engel teşkil etmez.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Soruşturma sonuçlandığında bir rapor düzenlenir. Raporda soruşturma onayı, fiilin işlendiği tarih, soruşturmaya başlama tarihi, soruşturulanın kimliği, isnat edilen suç konuları, soruşturmanın safhaları, deliller ve alınan ifadeler özetlenir. İsnat edilen suçun sabit olup olmadığı tartışılır ve sabit bulunması hâlinde eyleme uyan disiplin cezası teklif edilir. Soruşturmayla ilgili belgelerin asıl veya suretleri bir dizi pusulasına bağlanarak rapora eklenir. Soruşturma raporu, dosya ile birlikte soruşturmayı açan merciye tevdi edilir.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Aynı olaydan dolayı, öğretmen adayı hakkında ceza kovuşturmasının başlamış olması, disiplin soruşturmasını geciktirmez. Öğretmen adayı hakkında ceza kovuşturması açılmış olması, mahkûm olması veya olmaması disiplin cezasının verilmesine engel teşkil etmez.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Disiplin cezalarını verme süresi:</template>
        <mvz-bent no="a">
          <template>Eğitim ve uygulama merkezi müdürü soruşturmanın tamamlandığı günden itibaren kınama ve ödeme kesintisi cezalarını on gün içinde vermek zorundadır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Akademiden çıkarma cezası soruşturmaya ait dosyanın Disiplin Kuruluna tevdi edilmesinden itibaren azami bir ay içinde Disiplin Kurulu tarafından karara bağlanmak zorundadır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Disiplin cezası verme zamanaşımı:</template>
        <mvz-bent no="a">
          <template>Hazırlık eğitimi süresinde işlenen disiplin cezasını gerektiren fiil ve davranışların öğrenildiği tarihten itibaren;</template>
          <mvz-altbent no="1">
            <template>Kınama ve ödeme kesintisi gerektiren fiil ve davranışlarda altı ay,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Akademiden çıkarma cezası gerektiren fiil ve davranışlarda bir yıl,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>içinde disiplin cezası verilmediği takdirde ceza verme yetkisi zamanaşımına uğrar.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Disiplin cezasını gerektiren fiil ve davranışların işlenildiği tarihten itibaren nihayet iki yıl içinde disiplin cezası verilmediği takdirde ceza verme yetkisi zamanaşımına uğrar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Disiplin cezasının yargı kararıyla iptal edilmesi hâlinde, kararın tebliğ edildiği tarihten itibaren bir ay içinde kararın gerekçelerine göre yeni bir disiplin cezası tesis edilebilir veya dosya işlemden kaldırılabilir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Akademiden çıkarma cezası gerektiren bir fiil ve davranış nedeniyle hakkında disiplin soruşturması yürütülen öğretmen adaylarının, soruşturma tamamlanıncaya kadar sözleşmeli öğretmenlik pozisyonlarında istihdamı ertelenir. Akademide hazırlık eğitimini tamamladıktan sonra Akademiden çıkarma cezası uygulananlar sözleşmeli öğretmen olarak istihdam edilmez. Sözleşmeli öğretmen olarak istihdam edildikten sonra Akademiden çıkarma cezası uygulananların sözleşmesi feshedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Savunmanın alınması:</template>
        <mvz-bent no="a">
          <template>Disiplin cezaları öğretmen adayının savunması alındıktan sonra verilir. Savunma için verilen süre on günden az olamaz.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Akademiden çıkarma cezalarına ilişkin savunma isteminde öğretmen adayının talebi veya Disiplin Kurulunun kararı üzerine sözlü savunma yapılabilir. Sözlü savunma yapmak için Disiplin Kurulu tarafından davet edilen öğretmen adayları, savunmalarını, davet bildiriminin kendilerine ulaştığı tarihten itibaren on gün içinde isterlerse yazılı olarak da sunabilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Savunma isteminde;</template>
          <mvz-altbent no="1">
            <template>İsnat edilen fiil, teklif edilen ceza ve ispat araçlarının nelerden ibaret olduğu,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Yazılı savunmanın verilen süre içinde yapılması,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Sözlü savunma yapılacaksa belirlenen gün, saat ve yerde hazır bulunulması,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Belirtilen süre içinde yazılı savunma sunulmadığı veya sözlü savunma yapılmak üzere belirlenen gün, saat ve yerde hazır bulunulmadığı takdirde savunma hakkından vazgeçilmiş sayılacağı ve mevcut bilgi ve belgelere dayanılmak suretiyle karar verileceği,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>yazılı olarak bildirilir.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Geçerli bir özür bildiren veya mücbir sebep dolayısıyla yazılı savunma vermediği veya sözlü savunma davetine uymadığı anlaşılan öğretmen adaylarına uygun bir süre verilir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Disiplin cezalarına itiraz:</template>
        <mvz-bent no="a">
          <template>Öğretmen adayı tarafından, cezanın tebliğini izleyen beş iş günü içinde, eğitim ve uygulama merkezi yönetimi aracılığıyla;</template>
          <mvz-altbent no="1">
            <template>Kınama ve ödeme kesintisi cezasına karşı Disiplin Kuruluna,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Akademiden çıkarma cezasına karşı Akademik Kurula,</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>itiraz edilebilir.</template>
        <mvz-bent no="b">
          <template>Disiplin cezalarına itirazlar;</template>
          <mvz-altbent no="1">
            <template>Disiplin Kurulu tarafından yirmi gün,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Akademik Kurul tarafından otuz gün,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>içinde karara bağlanır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Disiplin Kurulu üyesi olan Akademik Kurul üyeleri, Akademik Kurula yapılan itirazlara ilişkin toplantılara katılamaz ve oy kullanamazlar. Akademik Kurul oy çokluğuyla karar alır. Oyların eşitliği hâlinde Başkanın kullandığı oy yönünde çoğunluk sağlanmış sayılır.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Disiplin Kurulu ve Akademik Kurul itirazı kabul veya ret kararı verir. İtirazın kabul edilmesi hâlinde verilen ceza kaldırılır. İtirazın kabul edilmesi durumunda, eğitim ve uygulama merkezi müdürü on beş gün içinde kabul gerekçesini de dikkate almak suretiyle fiile uygun alt ceza takdir edebilir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Disiplin cezası verilmesine sebep olmuş bir eylemin, hazırlık eğitimi süresi içinde tekerrüründe bir derece ağır ceza uygulanır. Ancak, hazırlık eğitimi süresi içinde aynı derecede cezayı gerektiren, farklı fiil veya davranışlar nedeniyle verilen disiplin cezalarının üçüncü uygulamasında bir derece ağır ceza verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Disiplin soruşturmasının sonucunun bildirilmesi ve cezaların uygulanması:</template>
        <mvz-bent no="a">
          <template>Disiplin soruşturmasının sonucu, hakkında disiplin soruşturması yürütülen öğretmen adayı ile varsa mağdura bildirilir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Disiplin cezaları verildikleri tarihten itibaren uygulanır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Öğretmen adaylarına tebligat, 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümlerine göre yapılır.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Disiplin Kurulunun görev ve sorumlulukları ile disiplin cezalarının uygulanmasına ilişkin diğer hususlar Bakanlıkça çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Öğretmen adaylarına ilişkin mali ve sosyal hükümler">
      <mvz-fıkra no="1">
        <template>Öğretmen adaylarına, hazırlık eğitimi sürecinde her ay (23.310) gösterge rakamının memur aylık katsayısı ile çarpımı sonucu bulunacak tutarda ödeme yapılır. Bu ödeme, damga vergisi hariç herhangi bir vergi ve kesintiye tabi tutulmaz. 10 uncu maddenin dördüncü fıkrası kapsamında kaydı dondurulanlara bu süre boyunca ödeme yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Öğretmen adaylarından askerlik yükümlülüğü bulunanların askerlik hizmetleri, Akademideki eğitimleri süresince ertelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Öğretmen adayları hazırlık eğitim sürelerinde 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu kapsamında genel sağlık sigortalısı sayılırlar. Bu kişiler adına Sosyal Güvenlik Kurumuna ödenecek primler, öğretmen adaylarına birinci fıkrada öngörülen ödemeden bağımsız olarak Bakanlık bütçesinden karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Sözleşmeli öğretmenlikte istihdam">
      <mvz-fıkra no="1">
        <template>Hazırlık eğitimini başarıyla tamamlayanlar, 9 uncu maddenin birinci fıkrasının (a), (b), (c), (ç), (d) ve (g) bentlerinde belirlenen şartları taşımak ve 7315 sayılı Kanuna göre güvenlik soruşturması ve arşiv araştırması yapılmış olmak kaydıyla 657 sayılı Kanunun 4 üncü maddesinin (B) fıkrası kapsamında sözleşmeli öğretmen olarak istihdam edilir. Bunların eğitim kurumlarına yerleştirilmeleri 10 uncu maddenin üçüncü fıkrasına göre belirlenen atamaya esas başarı puanı esas alınarak tercihleri doğrultusunda yapılır. Tercihte bulunmayanlar ile tercihlerine yerleşemeyenlere boş kalan eğitim kurumları için yeniden tercih hakkı verilir. İkinci tercih döneminde tercihte bulunmayanlar ile tercihlerine yerleştirilemeyenler Bakanlıkça kura ile yerleştirilir. Yerleştirildikleri eğitim kurumlarında mazeretsiz olarak göreve başlamayanlar ile göreve başladığı hâlde mazeretsiz olarak görevlerinden ayrılanlar, hazırlık eğitimi sonunda aldıkları atamaya esas başarı puanıyla sözleşmeli öğretmenlik için yeniden başvuruda bulunamaz ve yerleştirildikleri tarih itibarıyla bir yıl süreyle hazırlık eğitimine alınmazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sözleşmeli öğretmenler, can güvenliği ve sağlık mazeretleri hariç olmak üzere, üç yıl süreyle başka bir yere atanamaz. Aile birliği mazeretine bağlı yer değiştirmelerde sözleşmeli olarak istihdam edilen öğretmenin eşi bu öğretmene tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sözleşmeli öğretmenlikte istihdam ve bu maddenin uygulanmasına ilişkin diğer hususlar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Kadrolu öğretmenliğe atama">
      <mvz-fıkra no="1">
        <template>Üç yıllık çalışma süresini tamamlayan sözleşmeli öğretmenler talepleri hâlinde görev yaptıkları yerde öğretmen kadrolarına atanır. Öğretmen kadrolarına atananlar mazerete bağlı olarak yapılacak yer değiştirmeler hariç olmak üzere bir yıl süreyle yer değiştiremezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde hükümlerine göre öğretmen kadrolarına atananların sözleşmeli öğretmen pozisyonlarında geçirdikleri hizmet süreleri, öğrenim durumlarına göre yükselebilecekleri dereceleri aşmamak kaydıyla kazanılmış hak aylık derece ve kademelerinin tespiti ile hizmet puanı hesaplamasında dikkate alınır. Bunlar, atandıkları kadronun mali ve sosyal haklarına göreve başladığı tarihi takip eden ay başından itibaren hak kazanır ve önceki pozisyonlarında aldıkları mali ve sosyal haklar hakkında herhangi bir mahsuplaşma yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde kapsamında öğretmen kadrolarına atananlara iş sonu tazminatı ödenmez. Bunların önceden iş sonu tazminatı ödenmiş süreleri hariç, iş sonu tazminatına esas olan toplam hizmet süreleri, 8/6/1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanunu uyarınca ödenecek emekli ikramiyesine esas toplam hizmet süresinin hesabında dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde kapsamında öğretmen kadrolarına atanan sözleşmeli öğretmenler hakkında 657 sayılı Kanunda düzenlenen adaylık hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin uygulanmasına ilişkin diğer hususlar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Hizmet puanı">
      <mvz-fıkra no="1">
        <template>657 sayılı Kanunun 4 üncü maddesinin (A) fıkrası kapsamında görev yapan öğretmen ve yöneticilere, görev yerlerinin coğrafi durumu, ekonomik ve sosyal yönden gelişmişlik düzeyi, görev yaptığı eğitim kurumunun özellikleri, ulaşım şartları ile hizmet gereklerinin karşılanması hususları göz önünde bulundurularak görev yaptıkları her takvim yılı karşılığında hizmet puanı verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hizmet puanına ilişkin usul ve esaslar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Öğretmenlerin yer değişikliği">
      <mvz-fıkra no="1">
        <template>Öğretmenlerin yer değiştirme suretiyle atamaları, her yıl yapılan atama plan ve programları çerçevesinde eğitim öğretim faaliyetlerini etkilemeyecek şekilde sonuçlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Öğretmenlerin sağlık ve can güvenliği mazeretlerine bağlı yer değiştirmeleri yıl içinde yer değiştirme takvimine tabi olmaksızın, diğer mazeretlere bağlı yer değiştirmeleri ise yarıyıl ve/veya yaz tatilinde yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Öğretmenlerin mazeret durumlarına ve isteğe bağlı yer değiştirmeleri, Bakanlığın öğretmen ihtiyacı ve öğretmenin tercihi dikkate alınarak hizmet puanı üstünlüğüne göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mazeret durumlarına bağlı yer değiştirme istekleri hizmet puanı yetersizliği nedeniyle yerine getirilemeyenlere, 657 sayılı Kanunun 72 nci maddesi kapsamına girenlerin hakları saklı kalmak kaydıyla, talepleri hâlinde istekte bulundukları yere atanmaya hak kazanıncaya kadar aylıksız izin verilebilir. Bu şekilde aylıksız izin verilen öğretmenler, bağlı bulundukları il/ilçe millî eğitim müdürlüklerine bu amaçla tahsis edilmiş bulunan boş öğretmen kadrolarına aylıksız izinli olmak şartıyla atanır. Bunların atandıkları bu kadrolar aylıksız izin süresiyle sınırlı olarak saklı tutulur. Ancak aylıksız izne ayrılan öğretmenler, üçüncü yılın sonuna kadar istedikleri yere atamalarının yapılamaması hâlinde durumlarına uygun boş öğretmen kadrolarına öncelikle atanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Öğretmenlerin atamaları, Bakanlıkça il/ilçe emrine veya doğrudan eğitim kurumuna yapılır. Bakanlıkça il/ilçe emrine atama yapılması hâlinde öğretmenlerin atandıkları ildeki görev yerleri, hizmet puanları dikkate alınarak il millî eğitim müdürünün teklifine göre valilerce belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kadrolarının bulunduğu eğitim kurumlarında norm kadro fazlası olan öğretmenler, il içerisinde boş norm kadrosu bulunan eğitim kurumlarına yer değiştirme talebinde bulunabilir. Hizmet puanı yetersizliği nedeniyle talepte bulundukları eğitim kurumlarına atanamayanlar ile talepte bulunmayanların atamaları, öncelikle aynı ilçe grubu içerisinde boş norm kadrosu bulunan eğitim kurumlarına olmak üzere ilgili valilerce il içerisinde resen yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Öğretmenlerin isteğe ve mazeret durumlarına bağlı yer değiştirme suretiyle atamaları ile hizmet bölgeleri, hizmet alanları, ilçe grupları ve bu maddenin uygulanmasına ilişkin diğer hususlar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Mesleki Gelişim, Kariyer ve Yönetici Görevlendirme">
    <mvz-madde no="19" başlık="Mesleki gelişim">
      <mvz-fıkra no="1">
        <template>Bakanlıkça öğretmen ve yöneticilerin mesleki gelişimlerinde sürekliliği sağlamak üzere planlı, sürdürülebilir, izlenebilir ve mesleki uygulamalarla bütünleşik mesleki gelişim faaliyetleri düzenlenir. Bu faaliyetler, merkezî veya mahallî olarak gerçekleştirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Öğretmen ve yöneticilere yönelik düzenlenecek mesleki gelişim faaliyetleri; talep ve ihtiyaçlara, eğitim alanında yaşanan değişim ve gelişmeler ile Bakanlık politikalarına uygun olarak belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bakanlıkça öğretmen ve yöneticilerin kişisel ve mesleki gelişimleri için görev yaptıkları okul türü ve kademesi ile atama alanları dikkate alınarak beşer yıllık dönemleri içeren bireysel mesleki gelişim planları hazırlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mesleki gelişim faaliyetleri düzenli olarak izlenir, değerlendirilir ve değerlendirme sonuçları planlanacak mesleki gelişim faaliyetlerinde dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Öğretmen ve yöneticilerin mesleki gelişimlerine ilişkin oluşturulacak planlar, programlar, uygulama ve uygulamaların değerlendirilmesine ilişkin usul ve esaslar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Öğretmenlik mesleğinde kariyer">
      <mvz-fıkra no="1">
        <template>Öğretmenlik mesleği; öğretmen, uzman öğretmen ve başöğretmen olmak üzere üç kariyer basamağından oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Öğretmenlerden; öğretmenlikte en az on yıl hizmeti olan, kademe ilerlemesinin durdurulması cezası bulunmayan ve Akademi tarafından uzman öğretmenlik için düzenlenen eğitimi tamamlayanlara uzman öğretmen ünvanı verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Uzman öğretmenlerden; uzman öğretmenlikte en az on yıl hizmeti olan, kademe ilerlemesinin durdurulması cezası bulunmayan ve Akademi tarafından başöğretmenlik için düzenlenen eğitimi tamamlayanlara başöğretmen ünvanı verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kademe ilerlemesinin durdurulması cezası almış olanlar, cezaları özlük dosyasından silindikten sonra uzman öğretmen veya başöğretmen ünvanı için başvuruda bulunabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Öğretmen ünvanından, bu göreve atanmanın atamaya yetkili amir tarafından onaylandığı tarihten, uzman öğretmen veya başöğretmen ünvanından ise uzman öğretmen/başöğretmen sertifikasının düzenlendiği tarihten itibaren yararlanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Uzman öğretmen veya başöğretmen ünvanı alanlara her ünvan için ayrı ayrı olmak üzere bir derece verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Öğretmenlik mesleği kariyer basamaklarında ilerlemede başvuru, sertifikaların düzenlenmesi ile uygulamaya ilişkin diğer hususlar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Yönetici görevlendirme">
      <mvz-fıkra no="1">
        <template>Eğitim kurumu müdürü veya müdür yardımcısı olarak ilk defa görevlendirilecek adaylar, Akademi tarafından düzenlenen yönetici yetiştirme programına alınır. Bu programa katılacak yönetici adayları yazılı ve/veya sözlü sınavlardan altmış ve üzerinde puan alanlar arasından puan üstünlüğüne göre belirlenir. Yazılı ve sözlü sınavın birlikte yapılması hâlinde başarı puanı, yazılı ve sözlü sınav puanının aritmetik ortalaması alınarak belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yönetici yetiştirme programına alınanlardan bu program sonunda yapılan yazılı sınavda altmış ve üzerinde puan alanlar başarılı sayılır. Bunlar tercihleri de dikkate alınarak bu fıkraya göre yapılan yazılı sınavda alınan puan üstünlüğüne göre vali onayı ile yönetici olarak görevlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yöneticiler dört ders yılı için görevlendirilir. Yöneticiler aynı eğitim kurumunda aynı ünvanla en fazla sekiz ders yılı görev yapabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yöneticilerin aynı eğitim kurumunda veya bir başka eğitim kurumuna yeniden yönetici olarak görevlendirilmelerinde Bakanlıkça belirlenecek başarı ölçütleri dikkate alınır. Bu madde kapsamındaki görevlendirmeler özlük hakları, atama ve terfi yönünden kazanılmış hak doğurmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yönetici olarak görevlendirileceklerde aranacak şartlar, yöneticilerin aynı eğitim kurumunda veya bir başka eğitim kurumuna yeniden yönetici olarak görevlendirilmeleri ve bu görevlendirmelerde esas alınacak başarı ölçütleri, Akademi tarafından verilecek eğitimler, uygulanacak sınavlar ile bu maddenin uygulanmasına ilişkin diğer hususlar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Özel program ve proje uygulanan eğitim kurumlarına yönetici görevlendirme ve öğretmen atama">
      <mvz-fıkra no="1">
        <template>Yurt içi veya yurt dışında, yerli veya yabancı kurum ve kuruluşlarla veya başka ülkelerle iş birliği anlaşması çerçevesinde kurulan ve ulusal veya uluslararası proje yürüten okul ve kurumlara, Bakan onayı ile özel program ve proje uygulayan okul ve kurum olarak seçilenler ile Bakan onayıyla doğrudan Bakanlık merkez teşkilatına bağlanan kurumlara yapılacak öğretmen atamaları ve yönetici görevlendirmeleri Bakan tarafından yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>4/11/1981 tarihli ve 2547 sayılı Yükseköğretim Kanununun 38 inci maddesi kapsamında üniversitelerde görev yapan öğretim elemanlarına birinci fıkra kapsamında okul müdürlüğü görevi verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Öğretim elemanları ile Bakanlık kadrolarında görev yapmakta olan öğretmenlerin bu madde kapsamındaki okul ve kurumlara atanma ve görevlendirilmelerinde bu Kanun, 657 sayılı Kanun ve diğer mevzuatın sınavlar ve atanmaya ilişkin hükümleri uygulanmaz. Bu madde kapsamındaki okul ve kurumlara yönetici görevlendirmeleri özlük hakları, atanma ve terfi yönünden kazanılmış hak doğurmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Ödül ve Disiplin">
    <mvz-madde no="23" başlık="Başarı ve üstün başarı belgesi ile ödül">
      <mvz-fıkra no="1">
        <template>Öğretmen ve yöneticilere 657 sayılı Kanunun 122 nci maddesi kapsamında başarı belgesi, üstün başarı belgesi ve ödül verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Disiplin hükümleri">
      <mvz-fıkra no="1">
        <template>Öğretmen ve yöneticiler hakkında 657 sayılı Kanunun disiplin hükümleri uygulanır. Ancak öğretmen ve yöneticilerden;</template>
        <mvz-bent no="a">
          <template>Öğrencilere ve eğitim süreçlerine ilişkin ses veya görüntüleri ilgili mevzuatında belirlenmiş usuller dışında paylaşanlara kınama,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İlgili mevzuatı gereği yapılanlar dışında öğrencilere menfaat karşılığında özel ders veren veya özel ders için yönlendirme yapanlara, öğretmenlik mesleğiyle bağdaşmayacak şekilde öğrencilere olumsuz örnek teşkil edecek söz, davranış, hâl ve hareketlerde bulunanlara, öğrencilerin ders başarılarının değerlendirilmesinde taraflı davrananlara, eğitim öğretim sürecinde Bakanlıkça onaylanan öğretim programının belirlediği amaç ve hedeflere aykırı faaliyet ve uygulamalar yapanlara aylıktan kesme,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>cezası verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Öğretmenliğin sona ermesi">
      <mvz-fıkra no="1">
        <template>657 sayılı Kanunun ilgili hükümleri saklı kalmak kaydıyla, 5237 sayılı Kanunda düzenlenen uyuşturucu veya uyarıcı madde imal ve ticareti, uyuşturucu veya uyarıcı madde kullanılmasını kolaylaştırma, kullanmak için uyuşturucu veya uyarıcı madde satın almak, kabul etmek veya bulundurmak ya da uyuşturucu veya uyarıcı madde kullanmak, hayâsızca hareketler, müstehcenlik ve fuhuş suçları ile cinsel dokunulmazlığa karşı suçlardan mahkûm olanların öğretmenliği sona erer.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Millî Eğitim Akademisinin Kuruluşu ve Görevleri">
    <mvz-madde no="26" başlık="Kuruluş">
      <mvz-fıkra no="1">
        <template>Öğretmen adaylarının mesleğe hazırlanması, öğretmen, yönetici ve diğer personelin mesleki gelişimi, kariyer basamaklarında ilerlemeleri ve görevde yükselmeleri için eğitim programları hazırlamak, uygulamak ve değerlendirmek üzere Bakanlığa bağlı Millî Eğitim Akademisi kurulmuştur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Gerekli görülen yerlerde Akademi bünyesinde eğitim ve uygulama merkezleri açılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Akademinin personel, denetim, bakım ve onarım, koruma ve güvenlik, taşınır ve taşınmaz, araç, gereç, malzeme, demirbaş ve taşıtlar ile benzeri ihtiyaçları için gerekli iş ve işlemler Bakanlığın ilgili birimleri tarafından yerine getirilir. Akademinin giderleri için öngörülen ödenekler Bakanlık bütçesinde yer alır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Akademinin görevleri">
      <mvz-fıkra no="1">
        <template>Akademinin görevleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Öğretmenlik mesleğine hazırlık eğitimi programlarını hazırlamak ve uygulamak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yönetici yetiştirme programlarını hazırlamak ve uygulamak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Öğretmen, yönetici ve diğer personelin kariyer basamaklarında ilerlemeleri ve görevde yükselmelerine yönelik eğitim programlarını hazırlamak ve uygulamak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Öğretmen, yönetici ve diğer personelin sahip olması gereken yeterlikleri belirlemek ve gelişen şartlara göre güncellemek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Öğretmenlere; öğretmenlik mesleğinin gerektirdiği bilgi, beceri, tutum ve değerler ile dijital yeterlikleri kazandıracak eğitim faaliyetleri planlamak ve uygulamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Öğretmen, yönetici ve diğer personelin eğitim ihtiyaçlarını belirlemek, bu ihtiyacı karşılayacak eğitim programlarını hazırlamak, uygulamak ve eğitimlerin etkinliğini izlemek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Talepleri uygun görülmesi hâlinde, giderleri kurumlarınca veya kendilerince karşılanmak kaydıyla özel öğretim kurumlarında görev yapan personele eğitim vermek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Talepleri uygun görülmesi hâlinde, giderleri kurumlarınca veya kendilerince karşılanmak kaydıyla diğer kamu kurum ve kuruluşlarının personeline eğitim vermek.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Eğitim öğretim alanında bilimsel ve teknolojik gelişmeleri takip etmek; görev alanına giren konularda yayın yapmak, araştırma, geliştirme, proje faaliyetleri ve bilimsel çalışmalar yürütmek.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Görev alanıyla ilgili konularda yurt içi veya yurt dışı üniversiteler ile diğer kurum ve kuruluşlarla iş birliği gerçekleştirmek.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Bakan tarafından verilecek diğer görevleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Akademi İzleme ve Yönlendirme Kurulu">
      <mvz-fıkra no="1">
        <template>Akademi İzleme ve Yönlendirme Kurulu; Bakanın ya da Bakanın görevlendireceği bir bakan yardımcısının başkanlığında, Akademi Başkanı, Özel Öğretim Kurumları Genel Müdürü, Personel Genel Müdürü, bir Yükseköğretim Kurulu üyesi, Bakan tarafından diğer kamu kurum ve kuruluşları ile üniversitelerden belirlenecek birer temsilciden olmak üzere yedi üyeden oluşur. Üniversitelerden belirlenecek üyenin görevlendirilmesi ilgili mevzuat uyarınca yapılır. Gündeme göre ilgili Bakanlık hizmet birimi amirleri Başkanın daveti üzerine toplantılara katılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Akademi İzleme ve Yönlendirme Kurulu, Akademinin görev alanına giren konularda politika ve stratejileri belirler; gerçekleştirilen çalışmaları izler ve değerlendirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Akademi İzleme ve Yönlendirme Kurulu, yılda en az iki kez toplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Akademi İzleme ve Yönlendirme Kurulunun sekretarya hizmetleri Akademi Başkanlığı tarafından yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Akademi Başkanlığı ve Akademik Kurul">
      <mvz-fıkra no="1">
        <template>Akademi Başkanlığı; Akademi Başkanı, Akademik Kurul ve sayısı onu geçmemek üzere hizmet birimlerinden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Akademi Başkanı, Akademinin en üst amiri olup doğrudan Bakana bağlı olarak görev yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Akademi Başkanı, Akademinin temsil ve yönetiminden, Akademi faaliyetlerinin yürütülmesi ve denetiminden sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Akademik Kurula Akademi Başkanı başkanlık eder. Akademik Kurul bir başkan ve on üyeden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Akademik Kurul, Akademinin görev alanına giren konularda Akademi İzleme ve Yönlendirme Kurulu tarafından belirlenen politikaların uygulanmasına ilişkin standartları, öğretmen, yönetici ve diğer personelin sahip olması gereken yeterlikleri, Akademi tarafından düzenlenecek eğitimlerin programlarını ve Akademinin yıllık çalışma planını hazırlar ve Bakan onayına sunar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Akademik Kurul, Akademiden çıkarma cezalarına karşı yapılan itirazları inceleyerek karara bağlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Eğitim personeli">
      <mvz-fıkra no="1">
        <template>Bakanlık, Akademi hizmet birimlerinde görevlendirmek ve Akademinin eğitim faaliyetlerini yürütmek üzere 657 sayılı Kanunun 4 üncü maddesinin (B) fıkrası hükümleri çerçevesinde eğitim personeli istihdam edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kamu kurum ve kuruluşlarının kadrolarında 657 sayılı Kanunun 4 üncü maddesinin (A) fıkrasına tabi kadrolar ile 11/10/1983 tarihli ve 2914 sayılı Yükseköğretim Personel Kanununa tabi öğretim elemanı kadrolarında bulunanların bu madde kapsamında sözleşmeli personel pozisyonlarında istihdam edilmesi hâlinde kadrolarıyla ilişiği kesilir. Bunlardan, 5510 sayılı Kanunun geçici 4 üncü maddesi uyarınca haklarında 5434 sayılı Kanun hükümleri uygulanmaya devam edilenlerin, emekli kesenekleri kendilerince, kurum karşılıkları Bakanlık tarafından karşılanmak suretiyle söz konusu Kanun ile ilgileri devam ettirilir ve haklarında iş sonu tazminatı hükümleri uygulanmaz. Bu şekilde 5434 sayılı Kanunla ilgileri devam ettirilenlerin emeklilik hak ve yükümlülüklerinin tespitinde, önceden emeklilik hak ve yükümlülüklerine esas alınmakta olan kadro, görev veya pozisyonları aynı şekilde dikkate alınmaya devam olunur. Ayrıca, bu şekilde geçen süreleri kıdem aylıkları ile 5434 sayılı Kanunun mülga ek 68 inci ve mülga ek 73 üncü maddelerinde belirtilen sürelerin hesabında dikkate alınır ve bunların emeklilik keseneğine esas aylık kazanılmış hak aylık derece ve kademeleri de genel hükümler çerçevesinde yükseltilmeye ve ilerletilmeye devam olunur. Bu fıkra kapsamında istihdam edilenler, kendisinin sözleşmeyi feshetmesi veya Bakanlıkça sözleşmesinin feshedilmesi hâlinde fesih işlemi ile birlikte başka bir işleme gerek kalmaksızın yönetici kadroları dışında önceki kadrosuna kendiliğinden atanmış sayılır. Bunların durumlarına uygun boş kadro bulunmaması hâlinde atama işlemi ile birlikte söz konusu kadrolar kendiliğinden ihdas edilmiş sayılır. Bu kadroların herhangi bir nedenle boşalması hâlinde herhangi bir işleme gerek olmaksızın söz konusu kadrolar kendiliğinden iptal edilmiş sayılır. Bu madde uyarınca önceki kurumlarına dönen kişilerin Akademide geçen hizmetleri kazanılmış hak aylık derece ve kademelerinde değerlendirilir ve bunların Akademide geçen süreleri diğer özlük işlemleri bakımından kendi kurumlarında geçmiş sayılır. Bunlara sözleşmenin feshi durumunda iş sonu tazminatı ödenmez ve bunların Akademide sözleşmeli personel pozisyonunda geçen süreleri emeklilik ikramiyesinin hesabında dikkate alınır. Bu fıkra kapsamında istihdam edilenlerden, sözleşmeli personel pozisyonunda iken emekliye ayrılanların veya vefat edenlerin sözleşmeli personel pozisyonuna atanmadan önceki kadrolarında 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (c) bendi kapsamında geçen sürelerine emekli ikramiyesi ödenmez ve bu süreler ödenecek iş sonu tazminatının hesabında dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde kapsamında sözleşmeli personel olarak istihdam edilecek kişi ile Bakan veya yetkili kılması hâlinde Akademi Başkanı arasında hizmet sözleşmesi imzalanır. Sözleşmeli personelin; görev yeri, görevi dâhilinde yapacağı işlerin tanımları, uyacakları mesleki ve etik kurallar, ödev, yetki ve sorumlulukları ile diğer hususlar hizmet sözleşmesinde belirtilir. Hizmet sözleşmesi yazılı olarak bir yıllık yapılır. Bu süre sonunda tekrar sözleşme imzalanabilir. Sözleşme süresinin sona ermesi hâlinde yeni sözleşme yapılıncaya kadar sözleşme süresi üç aya kadar uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Akademide eğitim personeli olarak istihdam edilenlerden;</template>
        <mvz-bent no="a">
          <template>Profesör, doçent ve doktor öğretim üyesi ünvanına sahip olanlar haftada asgari on saat ders vermekle yükümlüdür. Bunlara, haftada on saati aşan ders görevleri için bu ders görevlerinin fiilen yapılması şartıyla haftada en çok yirmi saate kadar ek ders ücreti ödenir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>(a) bendi kapsamında bulunmayanlar haftada asgari on beş saat ders vermekle yükümlüdür. Bunlara, haftada on beş saati aşan ders görevleri için bu ders görevlerinin fiilen yapılması şartıyla haftada en çok on beş saate kadar ek ders ücreti ödenir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Fiilen yapmış oldukları ders görevleri karşılığında eğitim personelinden;</template>
        <mvz-bent no="a">
          <template>Profesör ünvanına sahip olanlara ders saati başına (320),</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Doçent ünvanına sahip olanlara ders saati başına (270),</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Doktor öğretim üyesi ünvanına sahip olanlara ders saati başına (220),</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>(a), (b) ve (c) bentleri kapsamında bulunmayanlara ders saati başına (160),</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>gösterge rakamının memur aylık katsayısıyla çarpımı sonucu bulunacak tutarda ek ders ücreti ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Sözleşmeli personelden; araştırma, proje, yayın ve benzeri bilimsel çalışmalarda görevlendirilenlere haftada beş saati geçmemek kaydıyla ayrıca ders ücreti ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Sözleşmeli personel kazanç getirici başka bir iş yapamaz, resmî veya özel herhangi bir müessesede maaşlı, ücretli veya sözleşmeli olarak görev alamaz, 657 sayılı Kanunda Devlet memurları için yasaklanmış bulunan fiil ve eylemlerde bulunamaz ve siyasi partilere üye olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Sözleşmeli personel, istihdam edildiği hizmet biriminde, yönetici olarak görevlendirilebilir. Bu görevleri yürüttükleri sürece kendilerine, bu görevlerinden dolayı ilave bir ücret ödenmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Akademide görevlendirme">
      <mvz-fıkra no="1">
        <template>Akademide, yükseköğretim kurumlarıyla iş birliği yapılarak 2547 sayılı Kanunun 38 inci maddesi hükümlerine göre geçici olarak öğretim elemanı görevlendirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamında istihdam edilen personelin Akademideki çalışma süresi yükseköğretim kurumlarında geçmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Eğitim personeli dışında, yüksek öğrenimli olmak koşuluyla Akademide ders vermek üzere görevlendirilenlere, haftada otuz saate kadar ek ders görevi verilebilir. Bunlara, fiilen yapmış oldukları ders görevleri karşılığında ders saati başına ünvanları dikkate alınarak 30 uncu maddenin beşinci fıkrasında belirlenmiş gösterge rakamları üzerinden ek ders ücreti ödenir.</template>

  <mvz-bölüm no="7-YEDİNCİ" başlık="Çeşitli ve Son Hükümler">

      <mvz-fıkra no="1">
        <template>Bakanlığa bağlı resmî eğitim kurumlarında yönetici, öğretmen, usta öğretici, yabancı uyruklu öğrencilerin eğitimine yönelik Bakanlık tarafından yürütülen projelerde öğretici/öğretmen veya rehber danışman; özel öğretim kurumlarında yönetici, öğretmen, uzman öğretici ve usta öğretici olarak görev yapanlar ile Bakanlığa bağlı resmî eğitim kurumları ve özel öğretim kurumlarında ders ücreti karşılığı ders okutanlara ve diğer kamu kurum ve kuruluşlarında görev yapan öğretmenlere karşı görevleri sebebiyle işlenen 5237 sayılı Kanunun 86 ncı maddesi kapsamındaki kasten yaralama, 106 ncı maddesi kapsamındaki tehdit, 125 inci maddesi kapsamındaki hakaret ve 265 inci maddesi kapsamındaki görevi yaptırmamak için direnme suçlarında;</template>
