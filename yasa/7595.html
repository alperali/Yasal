  <mvz-künye tür="kanun" no="7595" başlık="MİLLÎ DAYANIŞMA VE TOPLUMSAL BÜTÜNLEŞMENİN GÜÇLENDİRİLMESİNE DAİR KANUN"
             tarih="10/8/2026" rgazete-tarih="18/8/2026" rgazete-sayı="33344"

  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, PKK/KCK terör örgütünün ve bununla bağlantılı her türlü oluşumun fiilî varlığına son verdiğinin ve kontrolü altında bulunan her türlü silah ve mühimmatı teslim ettiğinin güvenlik kurumlarınca tespiti ve bu tespitin teyidine dair Milli Güvenlik Kurulu Kararının Resmî Gazete’de yayımlanmasını müteakip, yürütülen soruşturma ve kovuşturmalar ile verilen mahkûmiyet hükümlerinin infazının ertelenmesi işlemlerinin ve yapılacak diğer işlemlerin belirlenmesidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun hükümleri, PKK/KCK terör örgütünü kurma veya yönetme, örgüte üye olma veya bilerek ve isteyerek yardım etme ve örgütün propagandasını yapma suçları ile bu örgütün faaliyeti kapsamında işlenen suçları ve bu örgüt lehine işlenen 7/2/2013 tarihli ve 6415 sayılı Terörizmin Finansmanının Önlenmesi Hakkında Kanunda düzenlenen suçları kapsar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Tanımlar">
    <mvz-fıkra no="1">
      <template>Bu Kanunda geçen;</template>
      <mvz-bent no="a">
        <template>Örgüt: PKK/KCK terör örgütünü ve bununla bağlantılı her türlü oluşumlarını,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Kurul: Bu Kanunun 7 nci maddesi uyarınca oluşturulacak Kurulu,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>ifade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Soruşturma ve kovuşturmaların ertelenmesi">
    <mvz-fıkra no="1">
      <template>Örgütün fiilî varlığına son verdiğinin ve kontrolü altında bulunan her türlü silah ve mühimmatı teslim ettiğinin güvenlik kurumlarınca tespiti ve bu tespitin teyidine dair Milli Güvenlik Kurulu Kararının Resmî Gazete’de yayımlanmış olması koşuluyla, örgüt faaliyeti çerçevesinde işlenen kasten öldürme suçu ile 1/6/2005 tarihinden önce işlenen müebbet hapis veya ağırlaştırılmış müebbet hapis cezasını gerektiren suçlardan dolayı yürütülen soruşturma ve kovuşturmalar hariç olmak üzere, 1 inci madde kapsamına giren ve üst sınırı on beş yıl veya daha az cezayı gerektiren suçlardan dolayı yürütülen soruşturma ve kovuşturmalar beş yıl, on beş yıldan fazla hapis cezası ile müebbet hapis veya ağırlaştırılmış müebbet hapis cezasını gerektiren suçlardan dolayı yürütülen soruşturma ve kovuşturmalar on yıl süreyle ertelenir. Erteleme süresi içinde dava zamanaşımı işlemez. Bu suçlarla ilgili dosya ve suçun ispatına yarayan deliller, erteleme kararının verildiği tarihten itibaren erteleme süresince muhafaza edilir. Müsadereye konu eşya ve malvarlığı değerleri hakkında erteleme kararıyla birlikte tasfiye kararı verilir ve Hazineye irat kaydedilir. Karar, kanun yollarına başvurma hakkı bulunanlara tebliğ edilir. Kararda başvuru ve itiraz hakkı ile süresi ve mercii gösterilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkra uyarınca Cumhuriyet savcısı tarafından verilen kararlara karşı kanun yollarına başvurma hakkı bulunanlar iki hafta içinde sulh ceza hâkimliğine başvurabilir. Birinci fıkra uyarınca kovuşturmanın ertelenmesine ilişkin mahkeme tarafından verilen kararlara karşı da iki hafta içinde itiraz edilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Milli Güvenlik Kurulu Kararının Resmî Gazete’de yayımlanmasından önce işlenmiş olup da 1 inci madde kapsamına giren suçlardan dolayı bu tarihten sonra başlatılacak soruşturmaların yapılması, Kurulun iznine bağlıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Koruma tedbirleri ve kanun yolu incelemesinde bulunan dosyalar">
    <mvz-fıkra no="1">
      <template>3 üncü madde uyarınca erteleme kararı verilecek suçlardan dolayı verilmiş olan tutuklama ve adli kontrole ilişkin koruma tedbirleri, soruşturma veya kovuşturmanın bulunduğu evredeki yetkili hâkim veya mahkeme ile bölge adliye mahkemesi veya Yargıtay ilgili ceza dairesi tarafından değerlendirilir ve koşullarının bulunması hâlinde bu tedbirlerin kaldırılmasına karar verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>3 üncü madde uyarınca erteleme kararı verilecek suçlarla ilgili istinaf veya temyiz kanun yolu incelemesinde bulunan dosyalar hakkında bozma kararı verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Erteleme kararlarının kaydedilmesi ve yeniden suç işlenmesi">
    <mvz-fıkra no="1">
      <template>3 üncü madde uyarınca verilen erteleme kararları, bunlara mahsus bir sisteme kaydedilir. Bu kayıtlar, ancak bir soruşturma veya kovuşturmayla bağlantılı olarak Cumhuriyet savcısı, hâkim veya mahkeme tarafından istenmesi hâlinde, ikinci fıkrada belirtilen amaç için kullanılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Erteleme kararının verildiği tarihten itibaren erteleme süresi içinde terör suçlarından birinin işlenmesi hâlinde, erteleme kararı kaldırılarak soruşturma ve kovuşturmaya devam olunur. Mahkûmiyet hâlinde verilen cezanın infazı, 6 ncı madde uyarınca ertelenmez ve mahkûmiyet hükümlerinin tüm sonuçları doğar. Belirtilen süre suç işlenmeksizin geçirildiği takdirde kovuşturma yapılmasına yer olmadığı veya düşme kararı verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Mahkûmiyet hükümlerinin infazının ertelenmesi">
    <mvz-fıkra no="1">
      <template>Örgütün fiilî varlığına son verdiğinin ve kontrolü altında bulunan her türlü silah ve mühimmatı teslim ettiğinin güvenlik kurumlarınca tespiti ve bu tespitin teyidine dair Milli Güvenlik Kurulu Kararının Resmî Gazete’de yayımlanmış olması koşuluyla, örgüt faaliyeti çerçevesinde işlenen kasten öldürme suçundan mahkûm olanlar ile 1/6/2005 tarihinden önce işlenen suçlar nedeniyle müebbet hapis veya ağırlaştırılmış müebbet hapis cezasına mahkûm olanlar hariç olmak üzere, 1 inci madde kapsamına giren suçlardan;</template>
      <mvz-bent no="a">
        <template>Toplam on beş yıl veya daha az hapis cezasına mahkûm olan hükümlülerin cezalarının infazı beş yıl süreyle,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Toplam on beş yıldan fazla hapis cezası ile müebbet hapis veya ağırlaştırılmış müebbet hapis cezasına mahkûm olan hükümlülerin cezalarının infazı on yıl süreyle,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>infaz hâkiminin kararıyla ertelenir. Bu fıkranın uygulanması, müsadere kararlarının yerine getirilmesini engellemez. Erteleme süresi içinde ceza zamanaşımı işlemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkra uyarınca infaz hâkimi tarafından verilen erteleme kararlarına karşı itiraz edilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Birinci fıkra uyarınca verilen erteleme kararları, 5 inci maddenin birinci fıkrasına göre oluşturulan sisteme kaydedilir. Bu kayıtlar, ancak bir soruşturma veya kovuşturmayla bağlantılı olarak Cumhuriyet savcısı, hâkim veya mahkeme tarafından istenmesi hâlinde, dördüncü fıkrada belirtilen amaç için kullanılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Erteleme kararının verildiği tarihten itibaren erteleme süresi içinde terör suçlarından birinin işlenmesi hâlinde, infaz hâkimi tarafından erteleme kararı kaldırılarak cezanın infazının devamına karar verilir. Belirtilen süre suç işlenmeksizin geçirildiği takdirde verilen ceza infaz edilmiş sayılır. Erteleme kararlarının takibi Cumhuriyet başsavcılıklarınca yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Takip, koordinasyon ve uygulama">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamındaki faaliyetlerin uygulanmasının takibi ve değerlendirilmesi; Kanunun Resmî Gazete’de yayımlanmasını müteakiben, Cumhurbaşkanı Yardımcısının başkanlığında Adalet Bakanı, Dışişleri Bakanı, İçişleri Bakanı, Milli Savunma Bakanı, Cumhurbaşkanlığı Genel Sekreteri, Milli İstihbarat Teşkilatı Başkanı ve Milli Güvenlik Kurulu Genel Sekreterinden müteşekkil Kurul tarafından yapılır. İhtiyaç hâlinde Kurul tarafından; alt komisyonlar oluşturulabilir, bakanlık, kurum ve kuruluşların temsilcileri ile gerekli görülen kişiler Kurul ve komisyon toplantılarına davet edilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kurul tarafından, sürecin örgüt nezdindeki ilerlemesini sağlamak üzere alt komisyonlarda görevlendirme yapılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>1 inci maddede belirtilen Milli Güvenlik Kurulu Kararının Resmî Gazete’de yayımlanmasını müteakiben bu Kanunun amacı ve kapsamı doğrultusunda; örgütün tamamen tasfiyesi ve bu duruma ilişkin gözlem raporları uyarınca dönemsel olarak Kurul tarafından değerlendirme yapılabilir. Kurulun gerekli görmesi hâlinde adli, idari ve yasal düzenlemeler konusunda talepte bulunulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu Kanun uyarınca verilen erteleme kararları, 1 inci maddede belirtilen Milli Güvenlik Kurulu Kararının Resmî Gazete’de yayımlanmasını müteakiben dönemsel olarak Kurul tarafından değerlendirilir ve gerekli görülmesi hâlinde;</template>
      <mvz-bent no="a">
        <template>Soruşturma ve kovuşturmalar nedeniyle doğan hak yoksunluğunun tüm sonuçlarıyla ortadan kaldırılması, sulh ceza hâkimliğinden veya mahkemesinden,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Mahkûmiyet hükümleri nedeniyle doğan hak yoksunluğunun tüm sonuçlarıyla ortadan kaldırılması, infaz hâkimliğinden,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Kurul tarafından talep edilir. Talep hakkında ilgili mercii tarafından karar verilir. Bu kararlara karşı itiraz edilebilir. Bu fıkranın (b) bendi uyarınca talepte bulunulabilmesi için beş yıl olarak verilen erteleme kararları bakımından kararın verildiği tarihten itibaren iki yıl, on yıl olarak verilen erteleme kararları bakımından ise üç yıl geçmiş olması gerekir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kurul, çalışmaları hakkında Türkiye Büyük Millet Meclisini düzenli olarak bilgilendirir. Türkiye Büyük Millet Meclisi Başkanlığınca bu Kanun kapsamındaki faaliyetleri izlemek üzere İzleme Komisyonu kurulur. İzleme Komisyonu, bu Kanun kapsamındaki faaliyetleri izler ve tavsiyelerde bulunabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Kurulun sekreterya hizmetleri Cumhurbaşkanlığı Genel Sekreterliği tarafından yerine getirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Silah ve malzeme teslimi">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamındaki örgüt mensuplarının beraberinde getirdikleri yahut beyan ettikleri silah, mühimmat, araç, gereç, patlayıcı madde ve her türlü malzeme kayıt altına alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar, güvenlik kurumlarının görüşü alınarak İçişleri Bakanlığı ve Milli Savunma Bakanlığı tarafından belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Süre">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümleri, 1 inci maddede belirtilen Milli Güvenlik Kurulu Kararının Resmî Gazete’de yayımlanmasını müteakiben altı ay içinde bu Kanun hükümlerinden yararlanmak istediğini bulundukları yerdeki Cumhuriyet başsavcılıklarına veya Kurul tarafından görev verilen kurumlara yazılı olarak bildirenlere uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Görev ve sorumluluk">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamında verilen görevler, ilgili kamu kurum ve kuruluşlarınca ivedilikle yerine getirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunun amaç ve faaliyetleri kapsamında verilen görevleri yerine getiren kişilerin bu görevleri nedeniyle hukuki, idari veya cezai sorumluluğu doğmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="Yürürlük">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="Yürütme">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Cumhurbaşkanı yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
