  <mvz-künye tür="kanun" no="4681" başlık="CEZA İNFAZ KURUMLARI VE TUTUKEVLERİ İZLEME KURULLARI KANUNU"
             tarih="14/6/2001" rgazete-tarih="21/6/2001" rgazete-sayı="24439"
             düstur-tertip="5" düstur-cilt="40" />

  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, yürürlükteki mevzuat ve ülkemizin taraf olduğu uluslararası sözleşmelerle belirlenen ilkeler çerçevesinde ceza infaz kurumları ve tutukevlerinin yönetim, işleyiş ve uygulamalarını yerinde görmek, incelemek, bilgi almak ve tespitlerini rapor haline getirerek yetkili ve ilgili mercilere sunmak üzere, ceza infaz kurumları ve tutukevleri izleme kurullarının kurulmasına, görev ve yetkilerine ilişkin esas ve usulleri düzenlemektir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunda tekil veya çoğul olarak geçen "izleme kurulu" terimi, ceza infaz kurumları ve tutukevleri izleme kurullarını ifade eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3" durum="mülga">
      <template></template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="İzleme kurullarının kuruluşu">
    <mvz-fıkra no="1">
      <template>Bulunduğu yargı çevresinde ceza infaz kurumu veya tutukevi olan her adlî yargı adalet komisyonunca bir izleme kurulu kurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İzleme kurulu, başkanla birlikte beş asıl ve üç yedek üyeden oluşur. Asıl üyelerden en az birinin kadınlardan seçilmesi zorunludur. Üyeler dört yıl için seçilir. Süresi dolan üyeler yeniden seçilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İzleme kurulunun yetki alanı, adlî yargı adalet komisyonunun bulunduğu yargı çevresi ile sınırlıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yargı çevresinde müdürlük teşkilâtı olan birden çok ceza infaz kurumu ve tutukevi bulunması halinde buna uygun sayıda izleme kurulu kurulabilir. Bu durumda her izleme kurulunun yetki alanı, adlî yargı adalet komisyonunca belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>İzleme kuruluna çalışmaları için ilgili adlî yargı adalet komisyonunun bulunduğu binada bir yer ayrılır. İzleme kurulunun sekretarya hizmetleri, aynı adlî yargı adalet komisyonunun bürosu tarafından yürütülür.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="İzleme kurulu üyelerinde aranacak nitelikler">
    <mvz-fıkra no="1">
      <template>İzleme kurullarına başkan ve üye seçilebilmek için 14.7.1965 tarihli ve 657 sayılı Devlet Memurları Kanununda öngörülen genel şartlara ek olarak aşağıdaki nitelikler aranır:</template>
      <mvz-bent no="1.">
        <template>Otuzbeş yaşını doldurmuş olmak.</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>Tıp, eczacılık, hukuk, kamu yönetimi, sosyoloji, psikoloji, sosyal hizmetler, eğitim bilimleri ve benzeri alanlarda en az dört yıllık yüksek öğretim kurumlarından veya bunlara denkliği kabul edilen yurt dışındaki yüksek öğretim kurumlarından mezun olmak ve mesleği ile ilgili olarak kamu kurum ve kuruluşlarında ya da özel sektörde en az on yıl çalışmış bulunmak.</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Kişisel nitelikleri ile çevresinde dürüst, güvenilir ve ahlaklı olarak tanınmış olmak.</template>
      </mvz-bent>
      <mvz-bent no="4.">
        <template>Herhangi bir siyasî partinin merkez, il veya ilçe teşkilâtlarında görevli bulunmamak.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="İzleme kurullarına seçilemeyecek olanlar">
    <mvz-fıkra no="1">
      <template>Aşağıda yazılı kişiler, izleme kurulu başkan ve üyeliğine seçilemez :</template>
      <mvz-bent no="1.">
        <template>Ceza infaz kurumları ve tutukevleri ile ilgili ihale, alım, satım ve benzeri hukukî ilişkilere taraf olanlar.</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>Görev yapacakları ceza infaz kurumları veya tutukevlerinde bulunan hükümlü ve tutuklulardan birisinin işlediği suçtan kendileri veya ikinci derece dahil hısımları zarar görenler.</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Görev yapacakları ceza infaz kurumları ve tutukevlerindeki hükümlü ve tutuklulardan biri ile aralarında evlilik, vesayet veya ikinci derece dahil hısımlık ilişkisi bulunanlar.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="İzleme kurulu üyelerinin seçimi ve andiçmesi">
    <mvz-fıkra no="1">
      <template>İzleme kurullarının üyeleri, 3 ve 4 üncü maddelerde yazılı şartlara durumları uygun olan kişilerden re’sen veya o yerdeki ilgili kamu kurumu niteliğindeki meslek kuruluşlarının görüşleri alınarak ya da o yerin en büyük mülkî âmirinin yardımıyla belirlenecek olanlar ile doğrudan başvuranlar arasından adlî yargı adalet komisyonunca oybirliğiyle seçilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Üyeler, göreve başlamadan önce adlî yargı adalet komisyonunun önünde aşağıdaki şekilde andiçerler:</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>"Üstlendiğim görevi Anayasa ve kanunlar gereğince tam bir dikkat, dürüstlük ve tarafsızlıkla yürüteceğime namusum ve şerefim üzerine andiçerim."</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Andiçme tutanağı dosyalarında saklanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="İzleme kurullarının görev ve yükümlülükleri">
    <mvz-fıkra no="1">
      <template>İzleme kurullarının görevleri şunlardır :</template>
      <mvz-bent no="1.">
        <template>Ceza infaz kurumları ve tutukevlerindeki infaz ve ıslah uygulamalarına ilişkin işlem ve faaliyetleri yerinde görmek, incelemek, yönetici ve görevlilerden bilgi almak, hükümlü ve tutukluları dinlemek.</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>Hükümlü ve tutukluların naklinde kullanılan araçlar ile adliye binalarında bekletildikleri veya sağlık kuruluşlarında tedavi gördükleri bölümleri yerinde görmek, incelemek, yönetici ve görevlilerden bilgi almak, hükümlü ve tutukluları dinlemek.</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Ceza infaz kurumları ve tutukevlerinde infaz ve ıslah, hükümlü ve tutukluların sağlık ve yaşam koşulları, iç güvenlik, sevk ve nakil işlemleri ile ilgili olarak gördükleri aksaklık ve eksiklikleri yetkili mercilere bildirmek.</template>
      </mvz-bent>
      <mvz-bent no="4.">
        <template>Ceza infaz kurumları ve tutukevleri ile ilgili tespitlerini ve aldıkları bilgileri değerlendirerek en az dört ayda bir rapor düzenlemek, raporun bir örneğini Adalet Bakanlığına, Türkiye Büyük Millet Meclisi İnsan Haklarını İnceleme Komisyonu Başkanlığına, Kamu Denetçiliği Kurumuna, Türkiye İnsan Hakları ve Eşitlik Kurumuna, izleme kurulunun bulunduğu yargı çevresindeki Cumhuriyet başsavcılığına ve  infaz hâkimliğine göndermek.</template>
      </mvz-bent>
      <mvz-bent no="5.">
        <template>Kanunlarla verilen diğer görevleri yapmak.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İzleme kurulu üyeleri, görevleri sırasında edindikleri bilgileri ve düzenlenen raporları yetkili mercilerin izni olmaksızın açıklayamazlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Adalet Bakanlığı, cezaevi güvenliğine ilişkin hususlar müstesna olmak üzere, her yıl bir önceki yıla ait izleme kurullarınca düzenlenen raporların sayısını, konularını, yerine getirilen ve getirilmeyen önerileri ve gerekçelerini bir rapor ile kamuoyuna açıklar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="İzleme kurullarının çalışma esas ve usulleri">
    <mvz-fıkra no="1">
      <template>Her izleme kurulu, kendisini seçen adlî yargı adalet komisyonu başkanının çağrısı üzerine ve onun başkanlığında yapacağı ilk toplantısında üyeleri arasından iki yıl için bir başkan, bir başkan yardımcısı ve bir raportör seçer. Süresi dolanlar, bu görevlere yeniden seçilebilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İzleme kurulları, en az üç ayda bir olağan olarak toplanır. Başkan, izleme kurulunu gerektiğinde re’sen veya üye tamsayısının salt çoğunluğunun görüşülecek konuyu da belirten yazılı istemi üzerine olağanüstü toplantıya çağırır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İzleme kurulu, asıl üyelerin salt çoğunluğu ile toplanır. Salt çoğunluğun sağlanamaması hâlinde kıdem sırasına göre yedek üyeler toplantıya katılır. Raporlar, katılan üyelerin salt çoğunluğu ile kabul edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Çalışmalar yürütülürken ceza infaz kurumu veya tutukevinin güvenliğini etkileyebilecek konularda kurum idaresine bilgi verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>İzleme kurulu, ilgili olduğu ceza infaz kurumu veya tutukevini en az iki ayda bir olmak üzere, gerekli gördüğü her zaman ziyaret edebilir. Bu ziyarete katılanların sayısı üçüncü fıkrada öngörülen toplantı yeter sayısından az olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>İzleme kurullarının çalışma esas ve usulleri ile yapacakları ziyaretlerin şekli ve bu Kanunun uygulanmasına ilişkin diğer hususlar yönetmelikte gösterilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="İzleme kurulu üyeliğinin sona ermesi">
    <mvz-fıkra no="1">
      <template>Aşağıdaki hallerde izleme kurulu üyelerinin görevine adlî yargı adalet komisyonunca son verilir:</template>
      <mvz-bent no="1.">
        <template>İzleme kurulu üyeliğine seçilme şartlarını sonradan kaybetmek.</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>İzinsiz veya haklı bir mazereti olmaksızın bir yıl içinde iki toplantıya katılmamak.</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Hastalık veya diğer bir nedenle görevini yapmakta acze düşmek.</template>
      </mvz-bent>
      <mvz-bent no="4.">
        <template>İzleme kurulu üyeliğiyle bağdaşmayan tutum ve davranışlarda bulunmak.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Görevine son verilenler, bir daha izleme kurulunda görev alamazlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Herhangi bir nedenle boşalan üyeliklere, en geç iki ay içinde aynı usulle yeni üye seçilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="İzleme kurulu üyelerine karşı işlenen suçlar ve kurul üyelerinin cezaî sorumluluğu">
    <mvz-fıkra no="1">
      <template>İzleme kurulunun görevi ile ilgili olarak kurul üyelerine karşı işlenen suçlar hakkında Devlet memurlarına karşı işlenen suçlara, kurul üyelerinin görevleri sebebiyle işledikleri suçlar hakkında Devlet memurlarının işledikleri suçlara ilişkin hükümler uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İzleme kurulu üyelerinin görevleri sebebiyle işledikleri suçlardan dolayı soruşturma izni, adlî yargı adalet komisyonu başkanınca verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Malî hükümler">
    <mvz-fıkra no="1">
      <template>İzleme kurulu başkan ve üyelerine her toplantı için 2000 gösterge rakamının Devlet memurlarına uygulanan aylık katsayıyla çarpımı sonucunda bulunacak miktarda huzur ücreti ödenir. Ancak, bir ayda en çok iki toplantı için ödeme yapılabilir. Cumhurbaşkanı, yukarıda belirtilen gösterge rakamını iki katına kadar artırmaya yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İzleme kurulu üyelerine ayrıca 10.2.1954 tarihli ve 6245 sayılı Harcırah Kanunu hükümlerine göre birinci derece Devlet memurlarına ödenen miktarda harcırah ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İzleme kurullarının görevleriyle ilgili her türlü harcamaları, Adalet Bakanlığı bütçesine bu amaçla konulan ödenekten karşılanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yayımı tarihinden itibaren altı ay içinde adlî yargı adalet komisyonlarınca izleme kurulları oluşturulur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunda öngörülen yönetmelik, bu Kanunun yayımı tarihinden itibaren altı ay içinde Adalet Bakanlığınca hazırlanır ve Resmî Gazete’de yayımlanarak yürürlüğe konur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
