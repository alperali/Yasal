  <mvz-künye tür="kanun" no="5393" başlık="BELEDİYE KANUNU"
             tarih="3/7/2005" rgazete-tarih="13/7/2005" rgazete-sayı="25874"
             düstur-tertip="5" düstur-cilt="44" />
    
  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
      <mvz-madde no="1" başlık="Amaç">
        <mvz-fıkra no="1">
          <template>Bu Kanunun amacı, belediyenin kuruluşunu, organlarını, yönetimini, görev, yetki ve sorumlulukları ile çalışma usûl ve esaslarını düzenlemektir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Kapsam">
        <mvz-fıkra no="1">
          <template>Bu Kanun belediyeleri kapsar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="Tanımlar">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanmasında;</template>
          <mvz-bent no="a">
            <template>Belediye: Belde sakinlerinin mahallî müşterek nitelikteki ihtiyaçlarını karşılamak üzere kurulan ve karar organı seçmenler tarafından seçilerek oluşturulan, idarî ve malî özerkliğe sahip kamu tüzel kişisini,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Belediyenin organları: Belediye meclisini, belediye encümenini ve belediye başkanını,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Belde: Belediyesi bulunan yerleşim yerini,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Mahalle: Belediye sınırları içinde, ihtiyaç ve öncelikleri benzer özellikler gösteren ve sakinleri arasında komşuluk ilişkisi bulunan idarî birimi,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>İfade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Belediyenin Kuruluşu ve Sınırları">
      <mvz-madde no="4" başlık="Kuruluş">
        <mvz-fıkra no="1">
          <template>Nüfusu 5.000 ve üzerinde olan yerleşim birimlerinde belediye kurulabilir. İl ve ilçe merkezlerinde belediye kurulması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İçme ve kullanma suyu havzaları ile sit ve diğer koruma alanlarında ve meskûn sahası kurulu bir belediyenin sınırlarına 5.000 metreden daha yakın olan yerleşim yerlerinde belediye kurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Köylerin veya muhtelif köy kısımlarının birleşerek belediye kurabilmeleri için meskûn sahalarının, merkez kabul edilecek yerleşim yerinin meskûn sahasına azami 5.000 metre mesafede bulunması ve nüfusları toplamının 5.000 ve üzerinde olması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bir veya birden fazla köyün köy ihtiyar meclisinin kararı veya seçmenlerinin en az yarısından bir fazlasının mahallin en büyük mülkî idare amirine yazılı başvurusu ya da valinin kendiliğinden buna gerek görmesi durumunda, valinin bildirimi üzerine, mahallî seçim kurulları, onbeş gün içinde köyde veya köy kısımlarında kayıtlı seçmenlerin oylarını alır ve sonucu bir tutanakla valiliğe bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İşlem dosyası valinin görüşüyle birlikte Çevre ve Şehircilik Bakanlığına gönderilir ve o yerde belediye kurulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Yeni iskân nedeniyle oluşturulan ve nüfusu 5.000 ve üzerinde olan herhangi bir yerleşim yerinde belediye kurulabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Sınırların tespiti">
        <mvz-fıkra no="1">
          <template>Yeni kurulan bir belediyenin sınırları, kuruluşu izleyen altı ay içinde aşağıdaki şekilde tespit edilir:</template>
          <mvz-bent no="a">
            <template>Eskiden beri o yerleşim yerine ait sayılan tarla, bağ, bahçe, çayır, mera, otlak, yaylak, zeytinlik, palamutluk, fundalık gibi yerler ile kumsal ve plajlar belediye sınırı içine alınır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Belediye sınırlarını dere, tepe, yol gibi belirli ve sabit noktalardan geçirmek esastır. Bunun mümkün olmaması durumunda, sınır düz olarak çizilir ve işaretlerle belirtilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Belediyenin sınırları içinde kalan ve eskiden beri komşu belde veya köy halkı tarafından yararlanılan yayla, çayır, mera, koru, kaynak ve mesirelik gibi yerlerden geleneksel yararlanma hakları devam eder. Bu haklar için sınır kâğıdına şerh konulur.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Çizilen sınırların geçtiği yerlerin bilinen adları sınır kâğıdına yazılır. Ayrıca yetkili fen elemanı tarafından düzenlenen kroki sınır tespit tutanağına eklenir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Sınırların kesinleşmesi">
        <mvz-fıkra no="1">
          <template>Belediye sınırları, belediye meclisinin kararı ve kaymakamın görüşü üzerine valinin onayı ile kesinleşir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kesinleşen sınırlar, valilikçe yerinde uygulanmak suretiyle taraflara gösterilir ve durum bir tutanakla belirlenir. Kesinleşen sınır kararları ile dayanağı olan belgelerin birer örneği; belediyesine, mahallî tapu dairesine, il özel idaresine ve o yerin mülkî idare amirine gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kesinleşen sınırlar zorunlu nedenler olmadıkça beş yıl süre ile değiştirilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Sınır uyuşmazlıklarının çözümü">
        <mvz-fıkra no="1">
          <template>Bir il dâhilindeki beldeler veya köyler arasında sınır uyuşmazlığı çıkması hâlinde ilgili belediye meclisi ve köy ihtiyar meclisi ile kaymakamın görüşleri otuz gün süre verilerek istenir. Vali, bu görüşleri değerlendirerek sınır uyuşmazlığını karara bağlar. Büyükşehir belediyesi sınırları içinde kalan ilçe ve ilk kademe belediyelerinin sınır değişikliklerinde büyükşehir belediye meclisinin de görüşü alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İl ve ilçe sınırlarının değiştirilmesini gerektirecek sınır uyuşmazlıklarında 5442 sayılı İl İdaresi Kanunu hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Birleşme ve katılma">
        <mvz-fıkra no="1">
          <template>Belde, köy veya bunların bazı kısımlarının bir başka beldeye katılabilmesi için bu yerlerin meskûn sahalarının katılınacak beldenin meskûn sahasına uzaklığı 5.000 metreden fazla olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir belde veya köyün veya bunların bazı kısımlarının meskûn sahasının, komşu bir beldenin meskûn sahası ile birleşmesi veya bu sahalar arasındaki mesafenin 5.000 metrenin altına düşmesi ve buralarda oturan seçmenlerin yarısından bir fazlasının komşu beldeye katılmak için başvurması hâlinde, katılınacak belde sakinlerinin oylarına başvurulmaksızın, katılmak isteyen köy veya belde veya bunların kısımlarında başvuruya ilişkin oylama yapılır. Oylama sonucunun olumlu olması hâlinde başvuruya ait evrak, valilik tarafından katılınacak belediyeye gönderilir. Belediye meclisi evrakın gelişinden itibaren otuz gün içinde başvuru hakkındaki kararını verir. Belediye meclisinin uygun görmesi hâlinde katılım gerçekleşir. Büyükşehirlerde birleşme ve katılma işlemleri, katılınacak ilçe veya ilk kademe belediye meclisinin görüşü üzerine, büyükşehir belediye meclisinde karara bağlanır. Katılma sonrası oluşacak yeni sınır hakkında, 6 ncı maddeye göre işlem yapılır ve sonuç Çevre ve Şehircilik Bakanlığına bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bir beldenin bazı kısımlarının komşu bir beldeye katılmasında veya yeni bir belde ya da köy kurulmasında, beldenin nüfusunun 5.000'den aşağı düşmemesi gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Büyükşehir belediyesi bulunan yerlerde ayrılma yoluyla yeni bir belde kurulması için belde nüfusunun 100.000'den aşağı düşmemesi ve yeni kurulacak beldenin nüfusunun 20.000'den az olmaması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu madde uyarınca gerçekleşen katılmalarda, katılınan belde ile bazı kısımları veya tümü katılan köy veya belde arasında; taşınır ve taşınmaz mal, hak, alacak ve borçların devri ve paylaşımı, aralarında düzenlenecek protokolle belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Birleşme ve katılma işlemlerinde bu maddede düzenlenmeyen hususlarda 4 üncü madde hükmüne göre işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Mahalle ve yönetimi">
        <mvz-fıkra no="1">
          <template>Mahalle, muhtar ve ihtiyar heyeti tarafından yönetilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediye sınırları içinde mahalle kurulması, kaldırılması, birleştirilmesi, bölünmesi, adlarıyla sınırlarının tespiti ve değiştirilmesi, belediye meclisinin kararı ve kaymakamın görüşü üzerine valinin onayı ile olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Muhtar, mahalle sakinlerinin gönüllü katılımıyla ortak ihtiyaçları belirlemek, mahallenin yaşam kalitesini geliştirmek, belediye ve diğer kamu kurum ve kuruluşlarıyla ilişkilerini yürütmek, mahalle ile ilgili konularda görüş bildirmek, diğer kurumlarla iş birliği yapmak ve kanunlarla verilen diğer görevleri yapmakla yükümlüdür.  Belediye sınırları içinde nüfusu 500’ün altında mahalle kurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Belediye, mahallenin ve muhtarlığın ihtiyaçlarının karşılanması ve sorunlarının çözümü için bütçe imkânları ölçüsünde gerekli ayni yardım ve desteği sağlar; kararlarında mahallelinin ortak isteklerini göz önünde bulundurur ve hizmetlerin mahallenin ihtiyaçlarına uygun biçimde yürütülmesini sağlamaya çalışır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Belde adının değiştirilmesi">
        <mvz-fıkra no="1">
          <template>Bir beldenin adı, belediye meclisi üye tam sayısının en az dörtte üç çoğunluğunun kararı ve valinin görüşü üzerine İçişleri Bakanlığının onayı ile değiştirilir. Bu karar Resmî Gazetede yayımlanır. Beldenin adının değişmesi ile belediyenin adı da değişmiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Tüzel kişiliğin sona erdirilmesi">
        <mvz-fıkra no="1">
          <template>Meskûn sahası, bağlı olduğu il veya ilçe belediyesi ile nüfusu 50.000 ve üzerinde olan bir belediyenin sınırına, 5.000 metreden daha yakın duruma gelen belediye ve köylerin tüzel kişiliği; genel imar düzeni veya temel alt yapı hizmetlerinin gerekli kılması durumunda kaldırılarak bu belediyeye katılır. Tüzel kişiliği kaldırılan belediyenin mahalleleri, katıldıkları belediyenin mahalleleri hâline gelir. Tüzel kişiliği kaldırılan belediye ile köylerin taşınır ve taşınmaz mal, hak, alacak ve borçları katıldıkları belediyeye intikal eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Nüfusu 2.000’in altına düşen belediyeler köye dönüştürülür. Tüzel kişiliği kaldırılan belediyenin tasfiyesi il özel idaresi tarafından yapılır. Bu belediyenin taşınır ve taşınmaz malları ile hak, alacak ve borçları ilgili köy tüzel kişiliğine intikal eder. İntikal eden borçların karşılanamayan kısımları il özel idaresi tarafından üstlenilir ve vali tarafından İller Bankasına bildirilir. İller Bankası bu miktarı, takip eden ayın genel bütçe vergi gelirleri tahsilat toplamının belediyelere ayrılan kısmından keserek ilgili il özel idaresi hesabına aktarır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tüzel kişiliği kaldırılan belediyelerin bulunduğu yerleşim birimlerinde, hizmetlerin aksamadan yürütülmesi amacıyla, ilgili belediye veya büyükşehir belediyesi ve köye dönüşen yerlerde il özel idaresi veya köylere hizmet götürme birlikleri tarafından içme suyu, kanalizasyon, temizlik, çöp toplama, ulaşım, itfaiye ve diğer hizmetlerin yürütülmesi için gerekli tedbirler alınır ve ihtiyaç durumuna göre bu hizmetleri yürütmek üzere hizmet birimleri kurulabilir. Büyükşehir belediye sınırları içinde açılacak hizmet birimlerini yönetmek üzere, büyükşehir belediye meclis üyeleri veya diğer belediye personeli arasından görevlendirme yapılabilir. Mahalli hizmetlerin aksamadan yürütülmesi için vali veya kaymakamlar ilgili kuruluşlar arasında koordinasyonu sağlar ve gerekli tedbirleri alır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Kararlarının uygulanması ve nüfus">
        <mvz-fıkra no="1">
          <template>4, 6, 7, 8 ve 9 uncu maddelerde belirtilen kararlar kesinleşme tarihini takip eden yılın ocak ayının birinci gününden itibaren yürürlüğe girer. 4 üncü maddeye göre belediye kurulan yerlerde 2972 sayılı Mahallî İdareler ile Mahalle Muhtarlıkları ve İhtiyar Heyetleri Seçimi Hakkında Kanunun 29 uncu maddesine göre seçim yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>8 inci maddede geçen birleşme ve katılmalara, 9 uncu maddede geçen mahalle kaldırılmasına, 11 inci maddede geçen belediye ve köy tüzel kişiliğinin kaldırılmasına veya bir beldenin köye dönüştürülmesine dair kararlar ilk mahallî idareler seçimlerinde uygulanır ve seçimler bu yerlerin yeni durumlarına göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birleşme, katılma veya tüzel kişiliğin kaldırılması sonucu tüzel kişiliği ilk mahallî idare seçimlerine kadar devam edecek olan belediye ve köylerde, birleşme ve katılma işleminin gerçekleştiği  tarihten itibaren yeni nazım ve uygulama planı yapılmaz; mevcut planlarda yapılması gereken zorunlu değişiklik ve her türlü imar uygulaması katılınacak belediyenin uygun görüşü alınarak yapılır. Uygun görüş verilmeyen plan değişiklikleri yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Tüzel kişiliği sona erecek belediye ve köylerin taşınmazlarının satılması ile vadesi tüzel kişiliğin sona ereceği tarihi aşan borçlanma yapılması Çevre ve Şehircilik Bakanlığının onayına tabidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Belediye ihbar ve kıdem tazminatlarının ödenmesi konusunda, 68 inci maddenin (d) bendinde öngörülen sınırlamaya bağlı olmaksızın Çevre ve Şehircilik Bakanlığının onayı ile borçlanma yapabilir. Bu amaçla yapılan borçlanmalar ihbar ve kıdem tazminatı dışında hiçbir gider için kullanılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu Kanunda öngörülen nüfus büyüklüğü için Devlet İstatistik Enstitüsü Başkanlığınca bildirilen nüfus esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Mevzuatla orman köyleri ve orman köylüsüne tanınan hak, sorumluluk ve imtiyazlar orman köyü iken mahalleye dönüşen yerler için devam eder.  Bu hüküm, belde iken sakinleri orman köylüsüne tanınan hak, sorumluluk ve imtiyazlardan yararlanan mahalleye dönüştürülen beldeler için de geçerlidir. Bir belediyeye katılarak mahalleye dönüşen köy, köy bağlısı ve belediyelerce kullanılan mera, yaylak, kışlak gibi yerlerden bu mahalle sakinleri ve varsa diğer hak sahipleri 25/2/1998 tarihli ve 4342 sayılı Mera Kanunu hükümleri çerçevesinde yararlanmaya devam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Hemşehri hukuku">
        <mvz-fıkra no="1">
          <template>Herkes ikamet ettiği beldenin hemşehrisidir. Hemşehrilerin, belediye karar ve hizmetlerine katılma, belediye faaliyetleri hakkında bilgilenme ve belediye idaresinin yardımlarından yararlanma hakları vardır. Yardımların insan onurunu zedelemeyecek koşullarda sunulması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediye, hemşehriler arasında sosyal ve kültürel ilişkilerin geliştirilmesi ve kültürel değerlerin korunması konusunda gerekli çalışmaları yapar. Bu çalışmalarda üniversitelerin, kamu kurumu niteliğindeki meslek kuruluşlarının, sendikaların, sivil toplum kuruluşları ve uzman kişilerin katılımını sağlayacak önlemler alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belediye sınırları içinde oturan, bulunan veya ilişiği olan her şahıs, belediyenin kanunlara dayanan kararlarına, emirlerine ve duyurularına uymakla ve belediye vergi, resim, harç, katkı ve katılma paylarını ödemekle yükümlüdür.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Belediyenin Görev, Yetki ve Sorumlulukları">
      <mvz-madde no="14" başlık="Belediyenin görev ve sorumlulukları">
        <mvz-fıkra no="1">
          <template>Belediye, mahallî müşterek nitelikte olmak şartıyla;</template>
          <mvz-bent no="a">
            <template>İmar, su ve kanalizasyon, ulaşım gibi kentsel alt yapı; coğrafî ve kent bilgi sistemleri; çevre ve çevre sağlığı, temizlik ve katı atık; zabıta, itfaiye, acil yardım, kurtarma ve ambulans; şehir içi trafik; defin ve mezarlıklar; ağaçlandırma, park ve yeşil alanlar; konut; kültür ve sanat, turizm ve tanıtım, gençlik ve spor orta ve yüksek öğrenim öğrenci yurtları (Bu Kanunun 75 inci maddesinin son fıkrası, belediyeler, il özel idareleri, bağlı kuruluşları ve bunların üyesi oldukları birlikler ile ortağı oldukları Sayıştay denetimine tabi şirketler tarafından, orta ve yüksek öğrenim öğrenci yurtları ile Devlete ait her derecedeki okul binalarının yapım, bakım ve onarımı ile tefrişinde uygulanmaz.); sosyal hizmet ve yardım, nikâh, meslek ve beceri kazandırma; ekonomi ve ticaretin geliştirilmesi hizmetlerini yapar veya yaptırır.    Büyükşehir belediyeleri ile nüfusu 100.000’in üzerindeki belediyeler, kadınlar ve çocuklar için konukevleri açmak zorundadır. Diğer belediyeler de mali durumları ve hizmet önceliklerini değerlendirerek kadınlar ve çocuklar için konukevleri açabilirler.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Devlete ait her derecedeki okul binalarının inşaatı ile bakım ve onarımını yapabilir veya yaptırabilir, her türlü araç, gereç ve malzeme ihtiyaçlarını karşılayabilir; sağlıkla ilgili her türlü tesisi açabilir ve işletebilir; mabetlerin yapımı, bakımı, onarımını yapabilir; kültür ve tabiat varlıkları ile tarihî dokunun ve kent tarihi bakımından önem taşıyan mekânların ve işlevlerinin korunmasını sağlayabilir; bu amaçla bakım ve onarımını yapabilir, korunması mümkün olmayanları aslına uygun olarak yeniden inşa edebilir; cemevlerinin yapım, bakım ve onarımını yapabilir.  Gerektiğinde, sporu teşvik etmek amacıyla gençlere spor malzemesi verir, amatör spor kulüplerine ayni ve nakdî yardım yapar ve gerekli desteği sağlar, her türlü amatör spor karşılaşmaları düzenler, yurt içi ve yurt dışı müsabakalarda üstün başarı gösteren veya derece alan öğrencilere, sporculara, teknik yöneticilere ve antrenörlere belediye meclisi kararıyla ödül verebilir. Gıda bankacılığı yapabilir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediyelerin birinci fıkranın (b) bendi uyarınca, sporu teşvik etmek amacıyla yapacakları nakdi yardım, bir önceki yıl genel bütçe vergi gelirlerinden belediyeleri için tahakkuk eden miktarın; büyükşehir belediyeleri için binde yedisini, diğer belediyeler için binde on ikisini geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3" durum="iptal">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Hizmetlerin yerine getirilmesinde öncelik sırası, belediyenin malî durumu ve hizmetin ivediliği dikkate alınarak belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Belediye hizmetleri, vatandaşlara en yakın yerlerde ve en uygun yöntemlerle sunulur. Hizmet sunumunda engelli, yaşlı, düşkün ve dar gelirlilerin durumuna uygun yöntemler uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Belediyenin görev, sorumluluk ve yetki alanı belediye sınırlarını kapsar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Belediye meclisinin kararı ile mücavir alanlara da belediye hizmetleri götürülebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>4562 sayılı Organize Sanayi Bölgeleri Kanunu hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Sivil hava ulaşımına açık havaalanları ile bu havaalanları bünyesinde yer alan tüm tesisler bu Kanunun kapsamı dışındadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Belediyenin yetkileri ve imtiyazları">
        <mvz-fıkra no="1">
          <template>Belediyenin yetkileri ve imtiyazları şunlardır:</template>
          <mvz-bent no="a">
            <template>Belde sakinlerinin mahallî müşterek nitelikteki ihtiyaçlarını karşılamak amacıyla her türlü faaliyet ve girişimde bulunmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kanunların belediyeye verdiği yetki çerçevesinde yönetmelik çıkarmak, belediye yasakları koymak ve uygulamak, kanunlarda belirtilen cezaları vermek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Gerçek ve tüzel kişilerin faaliyetleri ile ilgili olarak kanunlarda belirtilen izin veya ruhsatı vermek.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Özel kanunları gereğince belediyeye ait vergi, resim, harç, katkı ve katılma paylarının tarh, tahakkuk ve tahsilini yapmak; vergi, resim ve harç dışındaki özel hukuk hükümlerine göre tahsili gereken doğal gaz, su, atık su ve hizmet karşılığı alacakların tahsilini yapmak veya yaptırmak.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Müktesep haklar saklı kalmak üzere; içme, kullanma ve endüstri suyu sağlamak; atık su ve yağmur suyunun uzaklaştırılmasını sağlamak; bunlar için gerekli tesisleri kurmak, kurdurmak, işletmek ve işlettirmek; kaynak sularını işletmek veya işlettirmek.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Toplu taşıma yapmak; bu amaçla otobüs, deniz ve su ulaşım araçları, tünel, raylı sistem dâhil her türlü toplu taşıma sistemlerini kurmak, kurdurmak, işletmek ve işlettirmek.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Katı atıkların toplanması, taşınması, ayrıştırılması, geri kazanımı, ortadan kaldırılması ve depolanması ile ilgili bütün hizmetleri yapmak ve yaptırmak.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Mahallî müşterek nitelikteki hizmetlerin yerine getirilmesi amacıyla, belediye ve mücavir alan sınırları içerisinde taşınmaz almak, kamulaştırmak, satmak, kiralamak veya kiraya vermek, trampa etmek, tahsis etmek, bunlar üzerinde sınırlı aynî hak tesis etmek.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Borç almak, bağış kabul etmek.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Toptancı ve perakendeci hâlleri, otobüs terminali, fuar alanı, mezbaha, ilgili mevzuata göre yat limanı ve iskele kurmak, kurdurmak, işletmek, işlettirmek veya bu yerlerin gerçek ve tüzel kişilerce açılmasına izin vermek.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Vergi, resim ve harçlar dışında kalan dava konusu uyuşmazlıkların anlaşmayla tasfiyesine karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Gayrisıhhî müesseseler ile umuma açık istirahat ve eğlence yerlerini ruhsatlandırmak ve denetlemek.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Beldede ekonomi ve ticaretin geliştirilmesi ve kayıt altına alınması amacıyla izinsiz satış yapan seyyar satıcıları faaliyetten men etmek, izinsiz satış yapan seyyar satıcıların faaliyetten men edilmesi sonucu, cezası ödenmeyerek iki gün içinde geri alınmayan gıda maddelerini gıda bankalarına, cezası ödenmeyerek otuz gün içinde geri alınmayan gıda dışı malları yoksullara vermek.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Reklam panoları ve tanıtıcı tabelalar konusunda standartlar getirmek.</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Gayrisıhhî işyerlerini, eğlence yerlerini, halk sağlığına ve çevreye etkisi olan diğer işyerlerini kentin belirli yerlerinde toplamak; hafriyat toprağı ve moloz döküm alanlarını; sıvılaştırılmış petrol gazı (LPG) depolama sahalarını; inşaat malzemeleri, odun, kömür ve hurda depolama alanları ve satış yerlerini belirlemek; bu alan ve yerler ile taşımalarda çevre kirliliği oluşmaması için gereken tedbirleri almak.</template>
          </mvz-bent>
          <mvz-bent no="p">
            <template>Kara, deniz, su ve demiryolu üzerinde işletilen her türlü servis ve toplu taşıma araçları ile taksi sayılarını, bilet ücret ve tarifelerini, zaman ve güzergâhlarını belirlemek; durak yerleri ile karayolu, yol, cadde, sokak, meydan ve benzeri yerler üzerinde araç park yerlerini tespit etmek ve işletmek, işlettirmek veya kiraya vermek; kanunların belediyelere verdiği trafik düzenlemesinin gerektirdiği bütün işleri yürütmek.</template>
          </mvz-bent>
          <mvz-bent no="r">
            <template>Belediye mücavir alan sınırları içerisinde 5/11/2008 tarihli ve 5809 sayılı Elektronik Haberleşme Kanunu, 26/9/2011 tarihli ve 655 sayılı Ulaştırma, Denizcilik ve Haberleşme Bakanlığının Teşkilat ve Görevleri Hakkında Kanun Hükmünde Kararname ve ilgili diğer mevzuata göre kuruluş izni verilen alanda tesis edilecek elektronik haberleşme istasyonlarına kent ve yapı estetiği ile elektronik haberleşme hizmetinin gerekleri dikkate alınarak ücret karşılığında yer seçim belgesi vermek,</template>
          </mvz-bent>
          <mvz-bent no="s">
            <template>Belediye sınırları içerisinde, yapı ruhsatı veya yapı kullanma izni hangi idare tarafından verilmiş olursa olsun, hizmete sunulacak olan asansörlerin tescilini yapmak, ilgili teknik mevzuat çerçevesinde yıllık periyodik kontrollerini yapmak ya da yetkilendirilmiş muayene kuruluşları aracılığıyla yaptırmak, gerekli hâllerde asansörleri hizmet dışı bırakmak.</template>
          </mvz-bent>
          <mvz-bent no="ş">
            <template>Bisiklet yollarının ve şeritlerinin, bisiklet ve elektrikli skuter park ve şarj istasyonlarının, yaya yollarının ve gürültü bariyerlerinin planlanması, projelendirilmesi, yapımı, bakımı ve onarımıyla ilgili işleri yürütmek.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>(s) bendi uyarınca asansörlerin yıllık periyodik kontrolünü yapacak belediyeler ile yetkilendirilmiş muayene kuruluşlarının sahip olması gereken şartlar, yıllık periyodik kontrol esasları ile yıllık periyodik kontrol ücretleri Türkiye Belediyeler Birliği, Türk Mühendis ve Mimar Odaları Birliği ve Türk Standardları Enstitüsü temsilcilerinin de yer alacağı bir komisyon tarafından belirlenir. Konuya ilişkin düzenlemeler, komisyon kararları doğrultusunda Bilim, Sanayi ve Teknoloji Bakanlığı tarafından yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>(r) bendine göre verilecek yer seçim belgesi karşılığında alınacak ücret Ulaştırma, Denizcilik ve Haberleşme Bakanlığınca belirlenir. Ücreti yatırılmasına rağmen yirmi gün içerisinde verilmeyen yer seçim belgesi verilmiş sayılır. Büyükşehir sınırları içerisinde yer seçim belgesi vermeye ve ücretini almaya büyükşehir belediyeleri yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>(l) bendinde belirtilen gayrisıhhî müesseselerden birinci sınıf olanların ruhsatlandırılması ve denetlenmesi, büyükşehir ve il merkez belediyeleri dışındaki yerlerde il özel idaresi tarafından yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Belediye, (e), (f) ve (g) bentlerinde belirtilen hizmetleri Danıştayın görüşü ve Çevre ve Şehircilik Bakanlığının kararıyla süresi kırkdokuz yılı geçmemek üzere imtiyaz yoluyla devredebilir; toplu taşıma hizmetlerini imtiyaz veya tekel oluşturmayacak şekilde ruhsat vermek suretiyle yerine getirebileceği gibi toplu taşıma hatlarını kiraya verme veya 67 nci maddedeki esaslara göre hizmet satın alma yoluyla yerine getirebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>İl sınırları içinde büyükşehir belediyeleri, belediye ve mücavir alan sınırları içinde il belediyeleri ile nüfusu 10.000'i geçen belediyeler, meclis kararıyla; turizm, sağlık, sanayi ve ticaret yatırımlarının ve eğitim kurumlarının su, termal su, kanalizasyon, doğal gaz, yol ve aydınlatma gibi alt yapı çalışmalarını faiz almaksızın on yıla kadar geri ödemeli veya ücretsiz olarak yapabilir veya yaptırabilir, bunun karşılığında yapılan tesislere ortak olabilir; sağlık, eğitim, sosyal hizmet ve turizmi geliştirecek projelere Çevre ve Şehircilik Bakanlığının onayı ile ücretsiz veya düşük bir bedelle amacı dışında kullanılmamak kaydıyla taşınmaz tahsis edebilir.  Belediye ve bağlı idareler, meclis kararıyla mabetlere, eğitim kurumlarına, yurtlara, okul pansiyonlarına, hastanelere ve cemevlerine indirimli bedelle ya da ücretsiz olarak içme ve kullanma suyu verebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Belediye, belde sakinlerinin belediye hizmetleriyle ilgili görüş ve düşüncelerini tespit etmek amacıyla kamuoyu yoklaması ve araştırması yapabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Belediye mallarına karşı suç işleyenler Devlet malına karşı suç işlemiş sayılır. 2886 sayılı Devlet İhale Kanununun 75 inci maddesi hükümleri belediye taşınmazları hakkında da uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Belediyenin proje karşılığı borçlanma yoluyla elde ettiği gelirleri, şartlı bağışlar ve kamu hizmetlerinde fiilen kullanılan malları ile belediye tarafından tahsil edilen vergi, resim ve harç gelirleri haczedilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>İcra dairesince haciz kararı alınmadan önce belediyeden borca yeter miktarda haczedilebilecek mal gösterilmesi istenir . On gün içinde yeterli mal beyan edilmemesi durumunda yapılacak haciz işlemi, alacak miktarını aşacak  şekilde yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Belediyeler, kendisinden izin veya ruhsat almak ya da hat kiralamak suretiyle çalışan ve toplu taşıma hizmeti yürüten gerçek ve tüzel kişilere; nüfus, hattın uzunluğu ve hattı kullanan sayısı kriterlerini esas alarak tespit edeceği hatlardaki toplu taşıma hizmetlerinden ücretsiz veya indirimli olarak yararlananlara ilişkin gelir desteği ödemesi yapabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="Belediyeye tanınan muafiyet">
        <mvz-fıkra no="1">
          <template>Belediyenin kamu hizmetine ayrılan veya kamunun yararlanmasına açık, gelir getirmeyen taşınmazları ile bunların inşa ve kullanımları katma değer vergisi ile özel tüketim vergisi hariç her türlü vergi, resim, harç, katılma ve katkı paylarından muaftır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Belediyenin Organları">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Belediye Meclisi">
      <mvz-madde no="17" başlık="Belediye meclisi">
        <mvz-fıkra no="1">
          <template>Belediye meclisi, belediyenin karar organıdır ve ilgili kanunda gösterilen esas ve usûllere göre seçilmiş üyelerden oluşur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Meclisin görev ve yetkileri">
        <mvz-fıkra no="1">
          <template>Belediye meclisinin görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Stratejik plân ile yatırım ve çalışma programlarını, belediye faaliyetlerinin ve personelinin performans ölçütlerini görüşmek ve kabul etmek.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bütçe ve kesinhesabı kabul etmek, bütçede kurumsal kodlama yapılan birimler ile fonksiyonel sınıflandırmanın birinci düzeyleri arasında aktarma yapmak.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Belediyenin imar plânlarını görüşmek ve onaylamak, büyükşehir ve il belediyelerinde il çevre düzeni plânını kabul etmek.  Belediye sınırları il sınırı olan Büyükşehir Belediyelerinde il çevre düzeni planı ilgili Büyükşehir Belediyeleri tarafından yapılır veya yaptırılır ve doğrudan Belediye Meclisi tarafından onaylanır.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Borçlanmaya karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Taşınmaz mal alımına, satımına, takasına, tahsisine, tahsis şeklinin değiştirilmesine veya tahsisli bir taşınmazın kamu hizmetinde ihtiyaç duyulmaması hâlinde tahsisin kaldırılmasına; üç yıldan fazla kiralanmasına ve süresi otuz yılı geçmemek kaydıyla bunlar üzerinde sınırlı aynî hak tesisine karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Kanunlarda vergi, resim, harç ve katılma payı konusu yapılmayan ve ilgililerin isteğine bağlı hizmetler için uygulanacak ücret tarifesini belirlemek.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Şartlı bağışları kabul etmek.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Vergi, resim ve harçlar dışında kalan ve miktarı beşbin YTL'den fazla dava konusu olan belediye uyuşmazlıklarını sulh ile tasfiyeye, kabul ve feragate karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Bütçe içi işletme ile 6762 sayılı Türk Ticaret Kanununa tâbi ortaklıklar kurulmasına veya bu ortaklıklardan ayrılmaya, sermaye artışına ve gayrimenkul yatırım ortaklığı kurulmasına karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Belediye adına imtiyaz verilmesine ve belediye yatırımlarının yap-işlet veya yap-işlet-devret modeli ile yapılmasına; belediyeye ait şirket, işletme ve iştiraklerin özelleştirilmesine karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Meclis başkanlık divanını ve encümen üyeleri ile ihtisas komisyonları üyelerini seçmek.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Norm kadro çerçevesinde belediyenin ve bağlı kuruluşlarının kadrolarının ihdas, iptal ve değiştirilmesine karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Belediye tarafından çıkarılacak yönetmelikleri kabul etmek.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Meydan, cadde, sokak, park, tesis ve benzerlerine ad vermek; mahalle kurulması, kaldırılması, birleştirilmesi, adlarıyla sınırlarının tespiti ve değiştirilmesine karar vermek; beldeyi tanıtıcı amblem, flama ve benzerlerini kabul etmek.</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Diğer mahallî idarelerle birlik kurulmasına, kurulmuş birliklere katılmaya veya ayrılmaya karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="p">
            <template>Yurt içindeki ve Çevre ve Şehircilik Bakanlığının izniyle yurt dışındaki belediyeler ve mahallî idare birlikleriyle karşılıklı iş birliği yapılmasına; kardeş kent ilişkileri kurulmasına; ekonomik ve sosyal ilişkileri geliştirmek amacıyla kültür, sanat ve spor gibi alanlarda faaliyet ve projeler gerçekleştirilmesine; bu çerçevede arsa, bina ve benzeri tesisleri yapma, yaptırma, kiralama veya tahsis etmeye karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="r">
            <template>Fahrî hemşehrilik payesi ve beratı vermek.</template>
          </mvz-bent>
          <mvz-bent no="s">
            <template>Belediye başkanıyla encümen arasındaki anlaşmazlıkları karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="t">
            <template>Mücavir alanlara belediye hizmetlerinin götürülmesine karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="u">
            <template>İmar plânlarına uygun şekilde hazırlanmış belediye imar programlarını görüşerek kabul etmek.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Başkanlık divanı">
        <mvz-fıkra no="1">
          <template>Belediye meclisi, seçim sonuçlarının ilânını takip eden beşinci gün belediye başkanının başkanlığında kendiliğinden toplanır. Meclis bu toplantıda, üyeleri arasından, gizli oyla meclis birinci ve ikinci başkan vekili ile en az iki kâtip üyeyi ilk iki yıl için görev yapmak üzere seçer. İlk iki yıldan sonra seçilecek başkanlık divanı yapılacak ilk mahallî idareler seçimlerine kadar görev yapar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başkanlık divanı seçimi üç gün içinde tamamlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Meclise belediye başkanı, katılamaması durumunda meclis birinci başkan vekili, onun da katılamaması durumunda ikinci başkan vekili başkanlık eder. Ancak yıllık faaliyet raporunun görüşüldüğü meclis toplantısı meclis başkan vekilinin başkanlığında yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Başkanlık divanında boşalma olması durumunda kalan süreyi tamamlamak üzere yenisi seçilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Meclis başkanı, meclis çalışmalarında düzeni sağlamakla yükümlüdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Meclisin çalışması ve katılıma ilişkin esas ve usûller Çevre ve Şehircilik Bakanlığı tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="Meclis toplantısı">
        <mvz-fıkra no="1">
          <template>Belediye meclisi, her ayın ilk haftası, önceden kararlaştırdığı günde toplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Meclis, resmî tatile rastlayan günlerde çalışmasına ara verebilir. Belediye meclisi her yıl bir ay tatil kararı alabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bütçe görüşmesine rastlayan toplantı süresi en çok yirmi gün, diğer toplantıların süresi en çok beş gündür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mutat toplantı yeri dışında toplanılmasının zorunlu olduğu durumda üyelere önceden bilgi vermek kaydıyla meclis başkanının belediye sınırları içerisinde belirlediği yerde toplantı yapılır. Ayrıca, toplantının yeri ve zamanı mutat usûllerle belde halkına duyurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Meclis toplantıları açıktır. Meclis başkanının veya üyelerden herhangi birinin gerekçeli önerisi üzerine, toplantıya katılanların salt çoğunluğuyla kapalı oturum yapılmasına karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Meclis görüşmeleri görevlilerce tutanağa geçirilir, başkan ve kâtip üyeler tarafından imzalanır. Toplantılar, meclisin kararıyla sesli ve görüntülü cihazlarla da kaydedilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Belediye başkanı, acil durumlarda lüzum görmesi halinde belediye meclisini bir yılda üç defadan fazla olmamak ve her toplantı bir birleşimi geçmemek üzere toplantıya çağırır. Olağanüstü toplantı çağrısı ve gündem en az üç gün önceden meclis üyelerine yazılı olarak duyurulur ve ayrıca mutat usûllerle ilan edilir. Olağanüstü toplantılarda çağrıyı gerektiren konuların dışında hiçbir konu görüşülemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="Gündem">
        <mvz-fıkra no="1">
          <template>Her ayın ilk günündeki belediye meclis gündemi belediye başkanı tarafından belirlenerek en az üç gün önceden üyelere bildirilir ve çeşitli yöntemlerle halka duyurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Her ayın ilk toplantısında belediye başkanı ve meclis üyeleri belediyeye ait işlerle ilgili konuların gündeme alınmasını önerebilir. Öneri, toplantıya katılanların salt çoğunluğuyla kabul edildiği takdirde gündeme alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İmar konuları ile yıllık bütçe dışında kalan gündemdeki diğer konular ile üyelerin teklifleri; toplantıya katılanların salt çoğunluğunun kabulü hâlinde komisyonlara havale edilmeksizin belediye meclisince görüşülerek karara bağlanabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Toplantı ve karar yeter sayısı">
        <mvz-fıkra no="1">
          <template>Belediye meclisi, üye tam sayısının salt çoğunluğuyla toplanır ve katılanların salt çoğunluğuyla karar verir. Ancak, karar yeter sayısı, üye tam sayısının dörtte birinden az olamaz. Oylamada eşitlik çıkması durumunda meclis başkanının bulunduğu taraf çoğunluk sayılır. Gizli oylamalarda eşitlik çıkması durumunda oylama tekrarlanır, eşitliğin bozulmaması durumunda meclis başkanı tarafından kur’a çekilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Meclisin toplanmasında, üye tam sayısının salt çoğunluğu sağlanamadığı takdirde başkan, gün ve saatini tespit ederek en geç üç gün içinde toplanmak üzere meclisi tatil eder. Gelecek toplantı, üye tam sayısının dörtte birinden az olmayan üye sayısı ile yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Görüşmeler sırasında başkan veya üyelerden birinin talebi üzerine yapılacak yoklamada karar yeter sayısının bulunmadığı anlaşılırsa, ikinci fıkradaki hükümler uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Üyeler oylarını bizzat kullanır. Gizli oy kullanmaya fizikî bakımdan engelli üyeler, tayin edecekleri kişi eliyle oy kullanabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Oylama gizli, işaretle veya ad okunarak yapılır. Oy verme kabul, ret veya çekimser şeklinde olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kararlar, meclis başkanı ve kâtip üyeler tarafından imzalanır ve bir sonraki toplantıda üyelere dağıtılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Meclis kararlarının kesinleşmesi">
        <mvz-fıkra no="1">
          <template>Belediye başkanı, hukuka aykırı gördüğü meclis kararlarını, gerekçesini de belirterek yeniden görüşülmek üzere beş gün içinde meclise iade edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yeniden görüşülmesi istenilmeyen kararlar ile yeniden görüşülmesi istenip de belediye meclisi üye tam sayısının salt çoğunluğuyla ısrar edilen kararlar kesinleşir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belediye başkanı, meclisin ısrarı ile kesinleşen kararlar aleyhine on gün içinde idarî yargıya başvurabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kararlar kesinleştiği tarihten itibaren en geç yedi gün içinde mahallin en büyük mülkî idare amirine gönderilir. Mülkî idare amirine gönderilmeyen kararlar yürürlüğe girmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5" durum="iptal">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kesinleşen meclis kararlarının özetleri yedi gün içinde uygun araçlarla halka duyurulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="İhtisas komisyonları">
        <mvz-fıkra no="1">
          <template>Belediye meclisi, üyeleri arasından en az üç en fazla beş kişiden oluşan ihtisas komisyonları kurabilir. Komisyonların bir yılı geçmemek üzere ne kadar süre için kurulacağı aynı meclis kararında belirtilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İhtisas komisyonları, her siyasî parti grubunun ve bağımsız üyelerin meclisteki üye sayısının meclis üye tam sayısına oranlanması suretiyle oluşturulur. İl ve ilçe belediyeleri ile nüfusu 10.000'in üzerindeki belediyelerde plân ve bütçe ile imar komisyonlarının kurulması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Meclis toplantısını müteakip imar komisyonu en fazla on iş günü, diğer komisyonlar ise beş iş günü içinde kendilerine havale edilen işleri sonuçlandırır. Komisyonlar kendilerine havale edilen işlerle ilgili raporlarını bu sürenin sonunda meclise sunmadıkları takdirde, konu meclis başkanı tarafından doğrudan gündeme alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İhtisas komisyonlarının görev alanına giren işler bu komisyonlarda görüşüldükten sonra belediye meclisinde karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Mahalle muhtarları ve ildeki kamu kuruluşlarının amirleri ile ildeki kamu kurumu niteliğindeki meslek kuruluşları, üniversiteler, sendikalar ve gündemdeki konularla ilgili sivil toplum örgütlerinin temsilcileri, oy hakkı olmaksızın kendi görev ve faaliyet alanlarına giren konuların görüşüldüğü ihtisas komisyonu toplantılarına katılabilir ve görüş bildirebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Komisyon çalışmalarında uzman kişilerden yararlanılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Komisyon raporları alenîdir, çeşitli yollarla halka duyurulur ve isteyenlere meclis tarafından maliyetlerini aşmamak üzere belirlenecek bedel karşılığında verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="Denetim komisyonu">
        <mvz-fıkra no="1">
          <template>İl ve ilçe belediyeleri ile nüfusu 10.000'in üzerindeki belediyelerde, belediye meclisi, her ocak ayı toplantısında belediyenin bir önceki yıl gelir ve giderleri ile bunlara ilişkin hesap kayıt ve işlemlerinin denetimi için kendi üyeleri arasından gizli oyla ve üye sayısı üçten az beşten çok olmamak üzere bir denetim komisyonu oluşturur. Komisyon, her siyasî parti grubunun ve bağımsız üyelerin meclisteki üye sayısının meclis üye tam sayısına oranlanması suretiyle oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Komisyon, belediye başkanı tarafından belediye binası içinde belirlenen yerde çalışır ve çalışmalarında kamu personelinden ve gerektiğinde diğer uzman kişilerden yararlanabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Denetim komisyonu toplantılarına, belediye ve bağlı kuruluşları dışındaki kamu kurum ve kuruluşlarından görevlendirilenlere (1.000); kamu personeli dışındaki diğer uzman kişilere büyükşehir belediyelerinde (3.000), diğer belediyelerde (2.000) gösterge rakamının Devlet memurlarına uygulanan aylık katsayıyla çarpımı sonucu bulunacak miktarı geçmemek üzere, belediye meclisince belirlenecek miktarda günlük ödeme yapılır. Denetim komisyonunun emrinde görevlendirilecek kişi ve gün sayısı belediye meclisince belirlenir. Uzman kişilerde aranacak nitelikler belediye meclisinin çalışmasına dair yönetmelikte düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Komisyon belediye birimleri ve bağlı kuruluşlarından her türlü bilgi ve belgeyi isteyebilir. Bu istekler gecikmeksizin yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Komisyon, çalışmasını kırkbeş işgünü içinde tamamlar ve buna ilişkin raporunu mart ayının sonuna kadar meclis başkanlığına sunar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Konusu suç teşkil eden hususlarla ilgili olarak meclis başkanlığı tarafından yetkili mercilere suç duyurusunda bulunulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Meclisin bilgi edinme ve denetim yolları">
        <mvz-fıkra no="1">
          <template>Belediye meclisi, bilgi edinme ve denetim yetkisini faaliyet raporunu değerlendirme, denetim komisyonu, soru, genel görüşme ve gensoru yoluyla kullanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Meclis üyeleri, meclis başkanlığına önerge vererek belediye işleriyle ilgili konularda sözlü veya yazılı soru sorabilir. Soru, belediye başkanı veya görevlendireceği kişi tarafından sözlü veya yazılı olarak cevaplandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Meclis üyelerinin en az üçte biri, meclis başkanlığına istekte bulunarak, belediyenin işleriyle ilgili bir konuda genel görüşme açılmasını isteyebilir. Bu istek meclis tarafından kabul edildiği takdirde gündeme alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Belediye başkanınca meclise sunulan bir önceki yıla ait faaliyet raporundaki açıklamalar, meclis üye tam sayısının dörtte üç çoğunluğuyla yeterli görülmezse, yetersizlik kararıyla görüşmeleri kapsayan tutanak, meclis başkan vekili tarafından mahallin mülkî idare amirine gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Vali, dosyayı gerekçeli görüşüyle birlikte Danıştaya gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Yetersizlik kararı, Danıştayca uygun görüldüğü takdirde belediye başkanı, başkanlıktan düşer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Meclis üye tam sayısının en az üçte biri oranındaki üyenin imzasıyla belediye başkanı hakkında gensoru önergesi verilebilir. Gensoru önergesi, meclis üye tam sayısının salt çoğunluğunun oyu ile gündeme alınır ve üç tam gün geçmedikçe görüşülemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Gensoru önergesinin karara bağlanmasında dördüncü fıkraya göre işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Başkan ve meclis üyelerinin görüşmelere katılamayacağı durumlar">
        <mvz-fıkra no="1">
          <template>Belediye başkanı ve meclis üyeleri, münhasıran kendileri, ikinci derece dâhil kan ve kayın hısımları ve evlatlıkları ile ilgili işlerin görüşüldüğü meclis toplantılarına katılamazlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="Başkan ve meclis üyelerinin yükümlülükleri">
        <mvz-fıkra no="1">
          <template>Belediye başkanı görevi süresince ve görevinin sona ermesinden itibaren iki yıl süreyle, meclis üyeleri ise görevleri süresince ve görevlerinin sona ermesinden itibaren bir yıl süreyle, belediye ve bağlı kuruluşlarına karşı doğrudan doğruya veya dolaylı olarak taahhüde giremez, komisyonculuk ve temsilcilik yapamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="Meclis üyeliğinin sona ermesi">
        <mvz-fıkra no="1">
          <template>Meclis üyeliği, ölüm ve istifa durumunda kendiliğinden sona erer. Meclis üyeliğinden istifa dilekçesi belediye başkanlığına verilir ve başkan tarafından meclisin bilgisine sunulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Özürsüz veya izinsiz olarak arka arkaya üç birleşim günü veya bir yıl içinde yapılan toplantıların yarısına katılmayan üyenin üyeliğinin düşmesine, savunması alındıktan sonra üye tam sayısının salt çoğunluğuyla karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belediye meclisi üyeliğine seçilme yeterliğinin kaybedilmesi durumunda, valinin bildirmesi üzerine Danıştay tarafından üyeliğin düşmesine karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="Meclisin feshi">
        <mvz-fıkra no="1">
          <template>Belediye meclisi;</template>
          <mvz-bent no="a">
            <template>Kendisine kanunla verilen görevleri süresi içinde yapmayı ihmal eder ve bu durum belediyeye ait işleri sekteye veya gecikmeye uğratırsa,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Belediyeye verilen görevlerle ilgisi olmayan siyasî konularda karar alırsa,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>İçişleri Bakanlığının bildirimi üzerine Danıştayın kararı ile feshedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İçişleri Bakanlığı gerekli gördüğü takdirde meclisin feshine dair bildirim ile birlikte, karar verilinceye kadar meclis toplantılarının ertelenmesini de ister. Danıştay, bu hususu en geç bir ay içinde karara bağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu şekilde feshedilen meclisin yerine seçilen meclis, kalan süreyi tamamlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="Boşalan meclisin görevinin yerine getirilmesi">
        <mvz-fıkra no="1">
          <template>Belediye meclisinin;</template>
          <mvz-bent no="a">
            <template>Danıştay tarafından feshi veya meclis toplantılarının ertelenmesi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Meclis üye tam sayısının yarıdan fazlasının tutuklanması,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yedek üyelerin getirilmesinden sonra da meclis üye tam sayısının yarısından aşağı düşmesi,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Geçici olarak görevden uzaklaştırılması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Hâllerinde, meclis çalışabilir duruma gelinceye veya yeni meclis seçimi yapılıncaya kadar meclis görevi, belediye encümeninin memur üyeleri tarafından yürütülür.</template>

            <template>İl belediyelerinde ve nüfusu 100.000'in üzerindeki belediyelerde, belediye meclisinin her yıl kendi üyeleri arasından bir yıl için gizli oyla seçeceği üç üye, malî hizmetler birim amiri ve belediye başkanının birim amirleri arasından bir yıl için seçeceği iki üye olmak üzere yedi kişiden,</template>

        <mvz-fıkra no="2">
          <template>Belediye başkanının katılamadığı toplantılarda, belediye başkanının görevlendireceği başkan yardımcısı veya encümen üyesi, encümene başkanlık eder.</template>

      <mvz-madde no="34" başlık="Encümenin görev ve yetkileri">

      <mvz-madde no="35" başlık="Encümen toplantısı">
        <mvz-fıkra no="1">
          <template>Belediye encümeni, haftada birden az olmamak üzere önceden belirlenen gün ve saatte toplanır. Belediye başkanı acil durumlarda encümeni toplantıya çağırabilir.</template>

        <mvz-fıkra no="3">

      <mvz-madde no="36" başlık="Encümen üyelerine verilecek ödenek">
        <mvz-fıkra no="1">
          <template>Belediye encümeni başkan ve üyelerine, nüfusu 10.000'e kadar olan belediyelerde (3.500), nüfusu 10.001-50.000'e kadar olan belediyelerde (4.500), 50.001-200.000'e kadar olan belediyelerde (6.000) ve 200.001'in üzerinde olan belediyelerde ise (7.500) gösterge rakamının Devlet memurları için belirlenen aylık katsayı ile çarpımı sonucu bulunacak tutarda aylık brüt ödenek verilir. Encümenin memur üyelerine bu tutarların yarısı ödenir.</template>

          <template>Belediye başkanı, görevinin devamı süresince siyasî partilerin yönetim ve denetim organlarında görev alamaz; profesyonel spor kulüplerinin başkanlığını yapamaz ve yönetiminde bulunamaz.</template>

      <mvz-madde no="40" başlık="Başkan vekili">

          <template>Belediye başkanı izin, hastalık veya başka bir sebeple görev başında bulunmadığı hâllerde, bu süre içinde kendisine vekâlet etmek üzere, belediye meclisi üyeleri arasından birini başkan vekili olarak görevlendirir.</template>

      <mvz-madde no="41" başlık="Stratejik plân ve performans programı">

        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Stratejik plân, varsa üniversiteler ve meslek odaları ile konuyla ilgili sivil toplum örgütlerinin görüşleri alınarak hazırlanır ve belediye meclisi tarafından kabul edildikten sonra yürürlüğe girer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">

        </mvz-fıkra>

      <mvz-madde no="42" başlık="Yetki devri">
        <mvz-fıkra no="1">
          <template>Belediye başkanı, görev ve yetkilerinden bir kısmını uygun gördüğü takdirde, yöneticilik sıfatı bulunan belediye görevlilerine devredebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="43" başlık="İhtilâf hâli">
        <mvz-fıkra no="1">
          <template>Belediye başkanının kendisinin, birinci ve ikinci derecedeki kan ve kayın hısımlarının ve evlatlıklarının, belediye ile ihtilâflı olduğu durumlarda dava açılması ve bu davada belediyenin temsili, meclis birinci başkan vekili, bulunmadığı takdirde ikinci başkan vekili veya bunların yetkilendireceği kişiler tarafından yerine getirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="44" başlık="Belediye başkanlığının sona ermesi">
        <mvz-fıkra no="1">
          <template>Belediye başkanlığı, ölüm ve istifa hâllerinde kendiliğinden sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediye başkanının;</template>
          <mvz-bent no="a">
            <template>Mazeretsiz ve kesintisiz olarak yirmi günden fazla görevini terk etmesi ve bu durumun mahallin mülkî idare amiri tarafından belirlenmesi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Seçilme yeterliğini kaybetmesi,</template>

          <mvz-bent no="c">

          </mvz-bent>
          <mvz-bent no="d">
            <template>Meclisin feshine neden olan eylem ve işlemlere katılması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Hâllerinden birinin meydana gelmesi durumunda İçişleri Bakanlığının başvurusu üzerine Danıştay kararıyla başkanlık sıfatı sona erer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="45" başlık="Belediye başkanlığının boşalması hâlinde yapılacak işlemler">
        <mvz-fıkra no="1">
          <template>Belediye başkanlığının herhangi bir nedenle boşalması durumunda, vali tarafından belediye meclisinin on gün içinde toplanması sağlanır. Meclis, birinci başkan vekilinin, onun bulunmaması durumunda ikinci başkan vekilinin, onun da bulunmaması durumunda en yaşlı üyenin başkanlığında toplanarak;</template>
          <mvz-bent no="a">
            <template>Belediye başkanlığının boşalması veya seçim dönemini aşacak biçimde kamu hizmetinden yasaklanma cezasının verilmiş olması durumunda bir başkan,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başkanın görevden uzaklaştırılması, tutuklanması veya seçim dönemini aşmayacak biçimde kamu hizmetinden yasaklama cezası alması durumunda bir başkan vekili,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Seçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ancak, belediye başkanı veya başkan vekili ya da meclis üyesinin terör veya terör örgütlerine yardım ve yataklık suçları sebebiyle görevden uzaklaştırılması veya tutuklanması ya da kamu hizmetinden yasaklanması veya başkanlık sıfatı veya meclis üyeliğinin sona ermesi hallerinde 46 ncı maddedeki makamlarca belediye başkanı veya başkan vekili ya da meclis üyesi görevlendirilir. Görevlendirilecek kişinin seçilme yeterliğine sahip olması şarttır. Görevden uzaklaştırılan veya tutuklanan belediye meclisi üyesinin istifa etmesi halinde de bu fıkra hükümleri uygulanır. Bu fıkra gereğince belediye başkanı veya başkan vekili görevlendirilen belediyelerde bütçe ve muhasebe iş ve işlemleri valilik onayı ile defterdarlığa veya mal müdürlüğüne gördürülebilir. Bu belediyelerde belediye meclisi, başkanın çağrısı olmadıkça toplanamaz. Meclisin, encümenin ve komisyonların görev ve yetkileri 31 inci maddede belirtilen encümen üyeleri tarafından yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belediye başkanı veya başkan vekili belediye meclis üyeleri arasından ve gizli oyla seçilir. İlk iki oylamada üye tam sayısının üçte iki ve üçüncü oylamada üye tam sayısının salt çoğunluğu aranır. Üçüncü oylamada salt çoğunluk sağlanamazsa, bu oylamada en çok oy alan iki aday için dördüncü oylama yapılır. Dördüncü oylamada en fazla oy alan üye, belediye başkanı veya başkan vekili seçilmiş olur. Oyların eşitliği durumunda kur'a çekilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Birinci fıkranın (b) bendi uyarınca başkan vekili seçildikten sonra belediye başkanlığının (a) bendinde belirtilen nedenlerle boşalması durumunda bu maddeye göre belediye başkanı seçilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yeni seçilen belediye başkanının görev süresi, yerine seçildiği başkanın görev süresi ile sınırlıdır. Başkan vekili, yeni başkan seçilinceye veya görevden uzaklaştırılmış ya da tutuklanmış olan başkan göreve dönünceye kadar görev yapar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Belediye başkanı veya başkan vekili seçilinceye kadar belediye başkanlığı görevi, meclis birinci başkan vekili, bulunmaması durumunda ikinci başkan vekili, onun da bulunmaması durumunda vali tarafından görevlendirilecek bir kamu görevlisi tarafından yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Belediye başkanı veya başkan vekili seçimi en geç onbeş gün içinde tamamlanmadığı takdirde belediye meclisinin feshine ilişkin hükümler uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="46" başlık="Belediye başkanı görevlendirilmesi">
        <mvz-fıkra no="1">
          <template>Belediye başkanlığının herhangi bir nedenle boşalması ve yeni belediye başkanı veya başkan vekili seçiminin yapılamaması durumunda, seçim yapılıncaya kadar belediye başkanlığına büyükşehir ve il belediyelerinde İçişleri Bakanı, diğer belediyelerde vali tarafından görevlendirme yapılır. Görevlendirilecek kişinin belediye başkanı seçilme yeterliğine sahip olması şarttır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Organlara İlişkin Ortak Hükümler">
      <mvz-madde no="47" başlık="Görevden uzaklaştırma">
        <mvz-fıkra no="1">
          <template>Görevleriyle ilgili bir suç nedeniyle haklarında soruşturma veya kovuşturma açılan belediye organları veya bu organların üyeleri, kesin hükme kadar İçişleri Bakanı tarafından görevden uzaklaştırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Görevden uzaklaştırma kararı iki ayda bir gözden geçirilir. Devamında kamu yararı bulunmayan görevden uzaklaştırma kararı kaldırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Görevden uzaklaştırılanlar hakkında; kovuşturma açılmaması, kamu davasının düşmesi veya beraat kararı verilmesi, davanın genel af ile ortadan kaldırılması veya görevden düşürülmeyi gerektirmeyen bir suçla mahkûm olunması durumunda görevden uzaklaştırma kararı kaldırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Görevden uzaklaştırılan belediye başkanına, görevden uzak kaldığı sürece aylık ödeneğinin üçte ikisi ödenir ve bu süre içinde diğer sosyal hak ve yardımlardan yararlanmaya devam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Belediye Teşkilâtı">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Belediye Teşkilâtı ve Personeli">
      <mvz-madde no="48" başlık="Belediye teşkilâtı">
        <mvz-fıkra no="1">
          <template>Belediye teşkilâtı, norm kadroya uygun olarak yazı işleri, malî hizmetler, fen işleri ve zabıta birimlerinden oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Beldenin nüfusu, fizikî ve coğrafî yapısı, ekonomik, sosyal ve kültürel özellikleri ile gelişme potansiyeli dikkate alınarak, norm kadro ilke ve standartlarına uygun olarak gerektiğinde sağlık, itfaiye, imar, insan kaynakları, hukuk işleri ve ihtiyaca göre diğer birimler oluşturulabilir. Bu birimlerin kurulması, kaldırılması veya birleştirilmesi belediye meclisinin kararıyla olur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="49" başlık="Norm kadro ve personel istihdamı">
        <mvz-fıkra no="1">
          <template>Norm kadro ilke ve standartları Çevre ve Şehircilik Bakanlığı ve Devlet Personel Başkanlığı tarafından müştereken belirlenir. Belediyenin ve bağlı kuruluşlarının norm kadroları, bu ilke ve standartlar çerçevesinde belediye meclisi kararıyla belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediye personeli, belediye başkanı tarafından atanır. Birim müdürlüğü ve üstü yönetici kadrolarına yapılan atamalar ilk toplantıda belediye meclisinin bilgisine sunulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belediye ve bağlı kuruluşlarında, norm kadroya uygun olarak çevre, sağlık, veterinerlik, teknik, hukuk, ekonomi, bilişim ve iletişim, plânlama, araştırma ve geliştirme, eğitim ve danışmanlık alanlarında avukat, mimar, mühendis, şehir ve bölge plâncısı, çözümleyici ve programcı, tabip, uzman tabip, ebe, hemşire, veteriner, kimyager, teknisyen ve tekniker gibi uzman ve teknik personel yıllık sözleşme ile çalıştırılabilir. Sözleşmeli personel eliyle yürütülen hizmetlere ilişkin boş kadrolara ayrıca atama yapılamaz. Bu personelin, yürütecekleri hizmetler için ihdas edilmiş kadro unvanının gerektirdiği nitelikleri taşımaları şarttır. Bu fıkra uyarınca sözleşmeli olarak istihdam edileceklere ödenecek net ücret, söz konusu kadro unvanı için birinci derecenin birinci kademesi esas alınmak suretiyle 657 sayılı Devlet Memurları Kanununa göre tespit edilecek her türlü ödemeler toplamının net tutarının yüzde 25 fazlasını geçmemek üzere belediye meclisi kararıyla belirlenir. Genel hükümlere göre birinci dereceden kadro ihdas edilemeyen kadro unvanları için ise o kadro unvanından ihdası yapılmış en yüksek kadro derecesinin birinci kademesi esas alınır ve yapılacak ödemenin azami tutarı yukarıda belirtilen usûle göre tespit olunur. Bu fıkra hükümlerine göre çalıştırılacak personel için Çevre ve Şehircilik Bakanlığı unvanlar itibarıyla sınırlama getirebilir.  Sözleşmeli personelin işe alınması memur kadrolarına ilk defa alınma usulüne tabidir. Sözleşmeli personelden üç yıllık çalışma süresini tamamlayanlar talepleri hâlinde sözleşmeli personel olarak çalıştırılmalarına esas alınan memur kadrolarına atanır. Bu kapsamda memur kadrolarına atananların bir yıl süreyle diğer kamu kurum ve kuruluşlarına nakli yapılamaz. Bunların sözleşmeli personel pozisyonlarında geçirdikleri hizmet süreleri, öğrenim durumlarına göre yükselebilecekleri dereceleri aşmamak kaydıyla kazanılmış hak aylık derece ve kademelerinin tespiti ile 657 sayılı Kanunun 64 üncü maddesinin dördüncü fıkrası kapsamında değerlendirilir. Bunlar, atandıkları kadronun mali ve sosyal haklarına göreve başladıkları tarihi takip eden aybaşından itibaren hak kazanır ve önceki pozisyonlarında aldıkları mali ve sosyal haklar hakkında herhangi bir mahsuplaşma yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Avukat, mimar, mühendis (inşaat mühendisi ve harita mühendisi olmak kaydıyla) ve veteriner kadrosu bulunmayan veya işlerin azlığı nedeniyle bu unvanlarda kadrolu personel istihdamına ihtiyaç duyulmayan belediyelerde, bu hizmetlerin yürütülmesi amacıyla, haftanın ya da ayın belirli gün veya saatlerinde kısmi zamanlı olarak sözleşme ile personel çalıştırılabilir. Kısmi zamanlı olarak çalıştırılacak personel sayısı yukarıda belirtilen her unvan için birden fazla olamaz ve bunlarla yapılacak sözleşme süresi takvim yılını aşamaz. Bunlara ödenecek net ücret, aynı unvanlı kadroların birinci derecesinin birinci kademesi için yapılması gereken bütün ödemeler toplamının net tutarının yarısını geçmemek ve çalıştırılacak süre ile orantılı olmak üzere belediye meclisi kararı ile tespit edilir. Bu fıkra uyarınca sözleşmeli personel olarak çalıştırılanlar için iş sonu tazminatı ödenmez ve işsizlik sigortası primi yatırılmaz. Bunlardan yaptıkları başka işler sebebiyle herhangi bir sosyal güvenlik kurumuna tâbi olanlar için sosyal sigorta ve genel sağlık sigortası primi yatırılmaz ve aynı kişi birden fazla belediye veya bağlı kuruluşta çalıştırılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Üçüncü ve dördüncü fıkra hükümleri uyarınca çalıştırılacak personele her ne ad altında olursa olsun sözleşme ücreti dışında herhangi bir ödeme yapılmaz ve ücret mahiyetinde aynî ya da nakdî menfaat temin edilmez. Bu personel hakkında bu Kanunla düzenlenmeyen hususlarda vize şartı aranmaksızın 657 sayılı Devlet Memurları Kanununun 4 üncü maddesinin (B) fıkrasına göre istihdam edilenler hakkındaki hükümler uygulanır. Bu personele ait sözleşme örnekleri sözleşmenin imzalanmasını izleyen 30 gün içinde Çevre ve Şehircilik Bakanlığına gönderilir.  Dördüncü fıkrada sayılan unvanlara ilişkin hizmetler dışında kalmak ve o hizmet için ihdas edilmiş kadro bulunmamak kaydıyla, Çevre ve Şehircilik Bakanlığınca üçüncü fıkra çerçevesinde sözleşmeli personel istihdamı uygun görülmüş olan kadro unvanlarına ilişkin görevlerde, 657 sayılı Kanunun 4 üncü maddesinin (B) fıkrasına göre münhasıran kısmi süreli olarak sözleşmeli personel çalıştırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kamu kurum ve kuruluşlarında istihdam edilen memurlar, belediye başkanının talebi, kendilerinin ve kurumlarının muvafakatiyle, belediyelerin birim müdürü ve üstü yönetici kadrolarında geçici olarak görevlendirilebilirler. Bu şekilde görevlendirmelerde 657 sayılı Devlet Memurları Kanununun 68 inci maddesinin (B) fıkrasında öngörülen şartlar dikkate alınır. Belediyelerde bu şekilde istihdam edilen personel kurumlarından izinli sayılırlar. Bu personelin görevlendirildikleri süre zarfındaki, görevlendirildikleri kadroya ait her türlü malî hakları ile kurumları tarafından karşılanması gereken sosyal güvenlik ve benzeri diğer hakları belediye tarafından ödenir. İzinli oldukları müddet, terfi ve emekliliklerinde hesaba katılır ve terfi haklarını kazananlar başkaca bir işleme lüzum kalmaksızın terfi ettirilirler. Bu şekilde görevlendirilenler, görevlendirme süresinin sona ermesinden itibaren onbeş gün içerisinde yazılı olarak kurumlarına başvurmaları hâlinde en geç bir ay içerisinde kadrolarına veya müktesebine uygun başka bir kadroya atanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Norm kadrosunda belediye başkan yardımcısı bulunan belediyelerde norm kadro sayısına bağlı kalınmaksızın; belediye başkanı, zorunlu gördüğü takdirde, nüfusu 50.000'e kadar olan belediyelerde bir, nüfusu 50.001-200.000 arasında olan belediyelerde iki, nüfusu 200.001-500.000 arasında olan belediyelerde üç, nüfusu 500.000 ve fazla olan belediyelerde dört belediye meclis üyesini belediye başkan yardımcısı olarak görevlendirebilir. Bu şekilde görevlendirilen meclis üyelerine belediye başkanına verilen ödeneğin 2/3'ünü aşmamak üzere belediye meclisi tarafından belirlenecek aylık ödenek verilir ve taleplerine göre bir sosyal güvenlik kurumu ile ilişkilendirilir. Bu şekilde görevlendirme, memuriyete geçiş, sözleşmeli veya işçi statüsünde çalışma dâhil ilgililer açısından herhangi bir hak teşkil etmez ve belediye meclisinin görev süresini aşamaz. Sosyal güvenlik prim ve benzeri giderlerden kurum karşılıkları belediye bütçesinden karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Belediyenin yıllık toplam personel giderleri, gerçekleşen en son yıl bütçe gelirlerinin 213 sayılı Vergi Usul Kanununa göre belirlenecek yeniden değerleme katsayısı ile çarpımı sonucu bulunacak miktarın yüzde otuzunu aşamaz. Nüfusu 10.000'in altında olan belediyelerde bu oran yüzde kırk olarak uygulanır. Yıl içerisinde aylık ve ücretlerde beklenmedik bir artışın meydana gelmesi sonucunda personel giderlerinin söz konusu oranları aşması durumunda, cari yıl ve izleyen yıllarda personel giderleri bu oranların altına ininceye kadar yeni personel alımı yapılamaz. Yeni personel alımı nedeniyle bu oranın aşılması sebebiyle oluşacak kamu zararı, zararın oluştuğu tarihten itibaren hesaplanacak kanunî faiziyle birlikte belediye başkanından tahsil edilir. Personelin her türlü alacakları zamanında ve öncelikle ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Sözleşmeli ve işçi statüsünde çalışanlar hariç belediye memurlarına, başarı durumlarına göre toplam memur sayısının yüzde onunu ve Devlet memurlarına uygulanan aylık katsayının (20.000) gösterge rakamı ile çarpımı sonucu bulunacak miktarı geçmemek üzere, hastalık ve yıllık izinleri dâhil olmak üzere, çalıştıkları sürelerle orantılı olarak encümen kararıyla yılda en fazla iki kez ikramiye ödenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="50" başlık="Personel devri">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 8 ve 11 inci maddeleri uyarınca tüzel kişiliği kaldırılan belediyelerin kadroları ve personeli; katılma hâlinde katıldıkları belediyeye, köye dönüştürülme hâlinde ilgili il özel idaresine devredilir. Devredilen personelden kadro ve görev unvanları değişmeyenler, aynı unvanlı kadrolara atanmış sayılırlar. Devredilen personelden durumlarına uygun boş kadro olmayanların veya mevcut kadro unvanı ile atamaları yapılamayanların kadro unvanları üç ay içerisinde ilgili belediye meclisi veya il genel meclisince aynı sınıf içerisinde kalmak kaydıyla değiştirilir. Bu değişiklikten itibaren bir ay içerisinde ilgililerin durumlarına uygun kadrolara atamaları yapılır. Söz konusu personel, atama işlemleri yapılıncaya kadar devredildikleri belediye veya il özel idaresince ihtiyaç duyulan işlerde görevlendirilebilirler. Bunlar yeni bir kadroya atanıncaya kadar eski kadrolarına ait aylık, ücret, ek gösterge, her türlü zam ve tazminatları ile diğer malî haklarını devredildikleri belediye veya il özel idaresinden almaya devam ederler. Devredilen personelden memur statüsünde görev yapanların, atandıkları yeni kadrolarının aylık, ekgösterge, her türlü zam ve tazminatları ile diğer malî hakları toplamının net tutarının, eski kadrolarına bağlı olarak en son ayda almakta oldukları aylık, ek gösterge, her türlü zam ve tazminatları ile diğer malî hakları toplamı net tutarından az olması hâlinde aradaki fark giderilinceye kadar atandıkları kadrolarda kaldıkları sürece herhangi bir kesintiye tâbi olmaksızın tazminat olarak ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tüzel kişiliği kaldırılan belediyelerde 657 sayılı Devlet Memurları Kanununun 4 üncü maddesinin (B) fıkrasına göre istihdam edilen sözleşmeli personelin pozisyonları,  başka bir işleme gerek kalmaksızın devredildikleri belediye veya il özel idaresi adına vize edilmiş sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Belediye Zabıtası, İtfaiye ve Acil Durum Plânlaması">
      <mvz-madde no="51" başlık="Zabıtanın görev ve yetkileri">
        <mvz-fıkra no="1">
          <template>Belediye zabıtası, beldede esenlik, huzur, sağlık ve düzenin sağlanmasıyla görevli olup bu amaçla, belediye meclisi tarafından alınan ve belediye zabıtası tarafından yerine getirilmesi gereken emir ve yasaklarla bunlara uymayanlar hakkında mevzuatta öngörülen ceza ve diğer yaptırımları uygular.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Görevini yaparken zabıtaya karşı gelenler, kolluk kuvvetlerine karşı gelenler gibi cezalandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belediye zabıta teşkilâtının çalışma usûl ve esasları, çalışanların görev ve yetkileri, memurluğa alınması için taşımaları gereken nitelikler, alacakları meslek içi eğitim, görevde yükselme,  giyecekleri kıyafet ve savunma amaçlı olarak kullanacakları aletler ile zabıta teşkilâtında hizmet gereklerine göre oluşturulacak birimler, İçişleri Bakanlığının görüşü alınarak Çevre ve Şehircilik Bakanlığı tarafından çıkarılacak yönetmelikle düzenlenir. Belediye, bu yönetmeliğe aykırı olmamak üzere ek düzenlemeler yapabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Zabıta hizmetleri kesintisiz olarak yürütülür. Zabıta personelinin çalışma süresi ve saatleri 657 sayılı Devlet Memurları Kanununda belirtilen çalışma süre ve saatlerine bağlı olmaksızın, hizmetin aksatılmadan yürütülmesini sağlayacak şekilde düzenlenir. Belediye zabıta ve özel güvenlik hizmetlerinde fiilen çalışanlara, fazla mesai ücreti olarak yılı bütçe kanununda belirlenen üst sınırı aşmamak kaydıyla belediye meclisi kararı ile tespit edilen maktu tutar ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="52" başlık="İtfaiye">
        <mvz-fıkra no="1">
          <template>İtfaiye teşkilâtının çalışma usûl ve esasları, çalışanların görev ve yetkileri, memurluğa alınması için taşımaları gereken nitelikler, alacakları meslek içi eğitim, görevde yükselme, meslekten çıkarılma, giyecekleri kıyafet ve savunma amaçlı olarak kullanacakları aletler ile itfaiye teşkilâtında hizmet gereklerine göre oluşturulacak birimler, İçişleri Bakanlığının görüşü alınarak Çevre ve Şehircilik Bakanlığı tarafından çıkarılacak yönetmelikle düzenlenir. Belediye bu yönetmeliğe aykırı olmamak üzere ek düzenlemeler yapabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İtfaiye hizmetleri kesintisiz olarak yürütülür. İtfaiye personelinin çalışma süresi ve saatleri 657 sayılı Devlet Memurları Kanununda belirtilen çalışma süre ve saatlerine bağlı olmaksızın, hizmetin aksatılmadan yürütülmesini sağlayacak şekilde düzenlenir. Belediye itfaiye teşkilâtında fiilen çalışanlara fazla mesai ücreti olarak yılı bütçe kanununda belirlenen üst sınırı aşmamak kaydıyla belediye meclisi kararı ile tespit edilen maktu tutar ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="53" başlık="Acil durum plânlaması">
        <mvz-fıkra no="1">
