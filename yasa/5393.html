          <template>Belediye; yangın, sanayi kazaları, deprem ve diğer doğal afetlerden korunmak veya bunların zararlarını azaltmak amacıyla beldenin özelliklerini de dikkate alarak gerekli afet ve acil durum plânlarını yapar, ekip ve donanımı hazırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Acil durum plânlarının hazırlanmasında varsa il ölçeğindeki diğer acil durum plânlarıyla da koordinasyon sağlanır ve ilgili bakanlık, kamu kuruluşları, meslek teşekkülleriyle üniversitelerin ve diğer mahallî idarelerin görüşleri alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Plânlar doğrultusunda halkın eğitimi için gerekli önlemler alınarak ikinci fıkrada sayılan idareler, kurumlar ve örgütlerle ortak programlar yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Belediye, belediye sınırları dışında yangın ve doğal afetler meydana gelmesi durumunda, bu bölgelere gerekli yardım ve destek sağlayabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Belediyelerin Denetimi">
    <mvz-madde no="54" başlık="Denetimin amacı">
      <mvz-fıkra no="1">
        <template>Belediyelerin denetimi; faaliyet ve işlemlerde hataların önlenmesine yardımcı olmak, çalışanların ve belediye teşkilâtının gelişmesine, yönetim ve kontrol sistemlerinin geçerli, güvenilir ve tutarlı duruma gelmesine rehberlik etmek amacıyla; hizmetlerin süreç ve sonuçlarını mevzuata, önceden belirlenmiş amaç ve hedeflere, performans ölçütlerine ve kalite standartlarına göre tarafsız olarak analiz etmek, karşılaştırmak ve ölçmek; kanıtlara dayalı olarak değerlendirmek, elde edilen sonuçları rapor hâline getirerek ilgililere duyurmaktır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="55" başlık="Denetimin kapsamı ve türleri">
      <mvz-fıkra no="1">
        <template>Belediyelerde iç ve dış denetim yapılır. Denetim, iş ve işlemlerin hukuka uygunluk, malî ve performans denetimini kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İç ve dış denetim 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu hükümlerine göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ayrıca, belediyenin malî işlemler dışında kalan diğer idarî işlemleri, hukuka uygunluk ve idarenin bütünlüğü açısından İçişleri Bakanlığı tarafından da denetlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Belediyelere bağlı kuruluş ve işletmeler de yukarıdaki esaslara göre denetlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Denetime ilişkin sonuçlar kamuoyuna açıklanır ve meclisin bilgisine sunulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="56" başlık="Faaliyet raporu">
      <mvz-fıkra no="1">
        <template>Belediye başkanı, 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununun 41 inci maddesinin dördüncü fıkrasında belirtilen biçimde; stratejik plân ve performans programına göre yürütülen faaliyetleri, belirlenmiş performans ölçütlerine göre hedef ve gerçekleşme durumu ile meydana gelen sapmaların nedenlerini ve belediye borçlarının durumunu açıklayan faaliyet raporunu hazırlar. Faaliyet raporunda, bağlı kuruluş ve işletmeler ile belediye ortaklıklarına ilişkin söz konusu bilgi ve değerlendirmelere de yer verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Faaliyet raporu nisan ayı toplantısında belediye başkanı tarafından meclise sunulur. Raporun bir örneği Çevre ve Şehircilik Bakanlığına gönderilir ve kamuoyuna da açıklanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="57" başlık="Hizmetlerde aksama">
      <mvz-fıkra no="1">
        <template>Belediye hizmetlerinin ciddi bir biçimde aksatıldığının ve bu durumun halkın sağlık, huzur ve esenliğini hayati derecede olumsuz etkilediğinin İçişleri Bakanlığının talebi üzerine yetkili sulh hukuk hâkimi tarafından belirlenmesi durumunda İçişleri Bakanı, hizmetlerde meydana gelecek aksamanın giderilmesini, hizmetin özelliğine göre makul bir süre vererek belediye başkanından ister.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aksama giderilemezse, söz konusu hizmetin yerine getirilmesini o ilin valisinden ister. Bu durumda vali, aksaklığı öncelikle belediyenin araç, gereç, personel ve diğer kaynaklarıyla giderir. Mümkün olmadığı takdirde diğer kamu kurum ve kuruluşlarının imkânlarını da kullanabilir. Ortaya çıkacak maliyet vali tarafından İller Bankasına bildirilir ve İller Bankasınca o belediyenin müteakip ay genel bütçe vergi gelirleri tahsilâtı toplamı üzerinden belediyeye ayrılan paydan valilik emrine gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İçişleri Bakanlığının talebi üzerine sulh hukuk hâkimi tarafından alınan karara karşı ilgili belediyece asliye hukuk mahkemesine itiraz edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ancak belediye veya bağlı idarelerde; hizmetlerin aksatılmasının terör veya şiddet olaylarıyla mücadeleyi olumsuz etkilediğinin veya etkileyeceğinin valilik tarafından belirlenmesi halinde, valilik söz konusu hizmeti Yatırım İzleme ve Koordinasyon Başkanlığı, il özel idaresi veya kamu kurum ve kuruluşları aracılığıyla yapar veya yaptırır. Valiliğin talebi üzerine, yapılan veya yapılacak harcamalar karşılığı tutarlar, Maliye Bakanlığı veya İller Bankası Anonim Şirketince ilgili idare payından kesilerek ilgili kurum ve kuruluşa gönderilir. Merkezi yönetim bütçesi kapsamındaki kamu idarelerine aktarılan tutarlar bu idarelerin bütçeleriyle ilişkilendirilir. Bu fıkra kapsamındaki ihtiyaçlar; parasal ve bütçe sınırlamasına tabi olmaksızın 4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanununun 22 nci maddesinde belirtilen usule göre temin edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Belediye ve bağlı idare imkânlarının terör veya şiddet olaylarına dolaylı ya da doğrudan destek sağlamak amacıyla kullanıldığının valilik tarafından belirlenmesi durumunda, terör ve şiddet olaylarına destek olmak amacıyla kullanılan belediye veya bağlı idare taşınırlarına mahallin en büyük mülki idare amiri tarafından el konulur. Bu fıkra kapsamında sorumluluğu tespit edilen belediye veya bağlı idare personelinin vali veya kaymakam tarafından görevden uzaklaştırılması halinde göreve iade işlemi ancak uzaklaştırma işlemini yapan makam tarafından yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="58" başlık="Denetimle ilgili diğer hükümler">
      <mvz-fıkra no="1">
        <template>Denetimin yapılması ve faaliyet raporunun hazırlanması hususunda bu Kanunda hüküm bulunmayan durumlarda 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu ile diğer kanunların ilgili hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Malî Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Belediyenin Gelir ve Giderleri">
      <mvz-madde no="59" başlık="Belediyenin gelirleri">
        <mvz-fıkra no="1">
          <template>Belediyenin gelirleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Kanunlarla gösterilen belediye vergi, resim, harç ve katılma payları.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Genel bütçe vergi gelirlerinden ayrılan pay.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Genel ve özel bütçeli idarelerden yapılacak ödemeler.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Taşınır ve taşınmaz malların kira, satış ve başka suretle değerlendirilmesinden elde edilecek gelirler.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Belediye meclisi tarafından belirlenecek tarifelere göre tahsil edilecek hizmet karşılığı ücretler.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Faiz ve ceza gelirleri.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Bağışlar.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Her türlü girişim, iştirak ve faaliyetler karşılığı sağlanacak gelirler.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Diğer gelirler.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Büyükşehir belediyelerinde büyükşehir sınırları ve mücavir alanları içinde belediyelerince tahsil edilen emlak vergisi tutarının tamamı ilgili ilçe ve ilk kademe belediyeleri tarafından alınır. Bunlardan büyükşehir belediyesine veya özel idareye ayrıca pay kesilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="60" başlık="Belediyenin giderleri">
        <mvz-fıkra no="1">
          <template>Belediyenin giderleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Belediye binaları, tesisleri ile araç ve malzemelerinin temini, yapımı, bakımı ve onarımı için yapılan giderler.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Belediyenin personeline ve seçilmiş organlarının üyelerine ödenen maaş, ücret, ödenek, huzur hakkı, yolluklar, hizmete ilişkin eğitim harcamaları ile diğer giderler.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Her türlü alt yapı, yapım, onarım ve bakım giderleri.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Vergi, resim, harç, katılma payı, hizmet karşılığı alınacak ücretler ve diğer gelirlerin takip ve tahsili için yapılacak giderler.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Belediye zabıta ve itfaiye hizmetleri ile diğer görev ve hizmetlerin yürütülmesi için yapılacak giderler.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Belediyenin kuruluşuna katıldığı şirket, kuruluş ve katıldığı birliklerle ilgili ortaklık payı ve üyelik aidatı giderleri.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Mezarlıkların tesisi, korunması ve bakımına ilişkin giderler.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Faiz, borçlanmaya ilişkin diğer ödemeler ile sigorta giderleri.</template>
          </mvz-bent>
          <mvz-bent no="i">
            <template>Dar gelirli, yoksul, muhtaç ve kimsesizler ile engellilere yapılacak sosyal hizmet ve yardımlar.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Dava takip ve icra giderleri.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Temsil, tören, ağırlama ve tanıtım giderleri.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Avukatlık, danışmanlık ve denetim hizmetleri karşılığı yapılacak ödemeler.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Yurt içi ve yurt dışı kamu ve özel kesim ile sivil toplum örgütleriyle birlikte yapılan ortak hizmetler ve proje giderleri.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Sosyo-kültürel, sanatsal ve bilimsel etkinlikler için yapılan giderler.</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Belediye hizmetleriyle ilgili olarak yapılan kamuoyu yoklaması ve araştırması giderleri.</template>
          </mvz-bent>
          <mvz-bent no="p">
            <template>Kanunla verilen görevler ve hizmetlerin yürütülmesi için yapılan diğer giderler.</template>
          </mvz-bent>
          <mvz-bent no="r">
            <template>Şartlı bağışlarla ilgili yapılacak harcamalar.</template>
          </mvz-bent>
          <mvz-bent no="s">
            <template>İmar düzenleme giderleri.</template>
          </mvz-bent>
          <mvz-bent no="t">
            <template>Her türlü proje giderleri.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Belediye Bütçesi">
      <mvz-madde no="61" başlık="Belediye bütçesi">
        <mvz-fıkra no="1">
          <template>Belediyenin stratejik plânına ve performans programına uygun olarak hazırlanan bütçe, belediyenin malî yıl ve izleyen iki yıl içindeki gelir ve gider tahminlerini gösterir, gelirlerin toplanmasına ve harcamaların yapılmasına izin verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bütçeye ayrıntılı harcama programları ile finansman programları eklenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bütçe yılı Devlet malî yılı ile aynıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bütçe dışı harcama yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Belediye başkanı ve harcama yetkisi verilen diğer görevliler, bütçe ödeneklerinin verimli, tutumlu ve yerinde harcanmasından sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="62" başlık="Bütçenin hazırlanması ve kabulü">
        <mvz-fıkra no="1">
          <template>Belediye başkanı tarafından hazırlanan bütçe tasarısı eylül ayının birinci gününden önce encümene sunulur ve Çevre ve Şehircilik Bakanlığına gönderilir. Çevre ve Şehircilik Bakanlığı belediye bütçe tahminlerini konsolide eder ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uyarınca merkezi yönetim bütçe tasarısına eklenmek üzere eylül ayı sonuna kadar Maliye Bakanlığına bildirir. Encümen, bütçeyi inceleyerek görüşüyle birlikte kasım ayının birinci gününden önce belediye meclisine sunar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Meclis bütçe tasarısını yılbaşından önce, aynen veya değiştirerek kabul eder. Ancak, meclis bütçe denkliğini bozacak biçimde gider artırıcı ve gelir azaltıcı değişiklikler yapamaz. Kabul edilen bütçe, malî yılbaşından itibaren yürürlüğe girer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="63" başlık="Harcama yetkilisi">
        <mvz-fıkra no="1">
          <template>Belediye bütçesiyle ödenek tahsis edilen her bir harcama biriminin en üst yöneticisi harcama yetkilisidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="64" başlık="Kesinhesap">
        <mvz-fıkra no="1">
          <template>Her yıl bütçesinin kesinhesabı, belediye başkanı tarafından hesap döneminin bitiminden sonra nisan ayı içinde encümene sunulur. Kesinhesap, belediye meclisinin mayıs ayı toplantısında görüşülerek karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kesinhesabın görüşülmesi ve kesinleşmesinde, bütçeye ilişkin hükümler uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="65" başlık="Bütçe sistemi">
        <mvz-fıkra no="1">
          <template>Belediye bütçesi ile muhasebe işlemlerine ilişkin esas ve usûller Maliye Bakanlığının görüşü alınarak Çevre ve Şehircilik Bakanlığı tarafından çıkarılacak yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="66" başlık="Geçmiş yıl bütçesinin devamı">
        <mvz-fıkra no="1">
          <template>Herhangi bir nedenle yeni yıl bütçesi kesinleşmemiş ise yeni bütçenin kesinleşmesine kadar geçen yıl bütçesi uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bütçenin kabulüne kadar yapılan işlemler yeni yıl bütçesine göre yapılmış sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="67" başlık="Gelecek yıllara yaygın hizmet yüklenmeleri">
        <mvz-fıkra no="1">
          <template>Belediyede belediye meclisinin, belediyeye bağlı kuruluşlarda yetkili organın kararı ile park, bahçe, sera, refüj, kaldırım ve havuz bakımı ve tamiri; araç kiralama, kontrollük, temizlik, güvenlik ve yemek hizmetleri; makine-teçhizat bakım ve onarım işleri; bilgisayar sistem ve santralleri ile elektronik bilgi erişim hizmetleri; sağlıkla ilgili destek hizmetleri; fuar, panayır ve sergi hizmetleri; baraj, arıtma ve katı atık tesislerine ilişkin hizmetler; kanal bakım ve temizleme, alt yapı ve asfalt yapım ve onarımı, trafik sinyalizasyon ve aydınlatma bakımı, sayaç okuma ve sayaç sökme-takma işleri ile ilgili hizmetler; toplu ulaşım ve taşıma hizmetleri; sosyal tesislerin işletilmesi ile ilgili işler, süresi ilk mahallî idareler genel seçimlerini izleyen altıncı ayın sonunu geçmemek üzere ihale yoluyla üçüncü şahıslara gördürülebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Borçlanma ve İktisadî Girişimler">
      <mvz-madde no="68" başlık="Borçlanma">
        <mvz-fıkra no="1">
          <template>Belediye, görev ve hizmetlerinin gerektirdiği giderleri karşılamak amacıyla aşağıda belirtilen usûl ve esaslara göre borçlanma yapabilir ve tahvil ihraç edebilir:</template>
          <mvz-bent no="a">
            <template>Dış borçlanma, 4749 sayılı Kamu Finansmanı ve Borç Yönetiminin Düzenlenmesi Hakkında Kanun hükümleri çerçevesinde sadece belediyenin yatırım programında yer alan projelerinin finansmanı amacıyla yapılabilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İller Bankasından yatırım kredisi ve nakit kredi kullanan belediye, ödeme plânını bu bankaya sunmak zorundadır. İller Bankası hazırlanan geri ödeme plânını yeterli görmediği belediyenin kredi isteklerini reddeder.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Tahvil ihracı, yatırım programında yer alan projelerin finansmanı için ilgili mevzuat hükümleri uyarınca yapılır.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Belediye ve bağlı kuruluşları ile bunların sermayesinin yüzde ellisinden fazlasına sahip oldukları şirketlerin, faiz dâhil iç ve dış borç stok tutarı, en son kesinleşmiş bütçe gelirleri toplamının 213 sayılı Vergi Usul Kanununa göre belirlenecek yeniden değerleme oranıyla artırılan miktarını aşamaz. Bu miktar büyükşehir belediyeleri için bir buçuk kat olarak uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Belediye ve bağlı kuruluşları ile bunların sermayesinin yüzde ellisinden fazlasına sahip oldukları şirketler, en son kesinleşmiş bütçe gelirlerinin, 213 sayılı Vergi Usul Kanununa göre belirlenecek yeniden değerleme oranıyla artırılan miktarının yılı içinde toplam yüzde onunu geçmeyen iç borçlanmayı belediye meclisinin kararı; yüzde onunu geçen iç borçlanma için ise meclis üye tam sayısının salt çoğunluğunun kararı ve Çevre, Şehircilik ve İklim Değişikliği Bakanlığının onayı ile yapabilir.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Belediyelerin ileri teknoloji ve büyük tutarda maddî kaynak gerektiren alt yapı yatırımlarında Cumhurbaşkanınca kabul edilen projeleri için yapılacak borçlanmalar (d) bendindeki miktarın hesaplanmasında dikkate alınmaz. Dış kaynak gerektiren projelerde Hazine ve Maliye Bakanlığının görüşü alınır.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Belediyeler ve bağlı kuruluşları ile bunların sermayesinin yüzde ellisinden fazlasına sahip oldukları şirketler tarafından Avrupa Birliği ile katılım öncesi mali işbirliği çerçevesinde desteklenen projelerin finansmanı için yapılan borçlanmalar, çok taraflı yatırım ve kalkınma bankaları ile yabancı devlet kuruluşlarından doğrudan veya İller Bankası Anonim Şirketi aracılığıyla yapılan borçlanmalar ve Su Kanalizasyon ve Altyapı Projesi (SUKAP) kapsamında yürütülecek işler için İller Bankası Anonim Şirketinden yapılan borçlanmalar (d) bendindeki miktarın hesaplanmasında dikkate alınmaz.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıda belirtilen usûl ve esaslara aykırı olarak borçlanan belediye yetkilileri hakkında, fiilleri daha ağır bir cezayı gerektirmeyen durumlarda 5237 sayılı Türk Ceza Kanununun görevi kötüye kullanmaya ilişkin hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Belediye, varlık ve yükümlülüklerinin ayrıntılı bir şekilde yer aldığı malî tablolarını üçer aylık dönemler hâlinde Çevre, Şehircilik ve İklim Değişikliği Bakanlığı, Hazine ve Maliye Bakanlığı ile Strateji ve Bütçe Başkanlığına gönderir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="69" başlık="Arsa ve konut üretimi">
        <mvz-fıkra no="1">
          <template>Belediye; düzenli kentleşmeyi sağlamak, beldenin konut, sanayi ve ticaret alanı ihtiyacını karşılamak amacıyla belediye ve mücavir alan sınırları içinde, özel kanunlarına göre korunması gerekli yerler ile tarım arazileri hariç imarlı ve alt yapılı arsalar üretmek; konut, toplu konut yapmak, satmak, kiralamak ve bu amaçlarla arazi satın almak, kamulaştırma yapmak, bu arsaları trampa etmek, bu konuda ilgili diğer kamu kurum ve kuruluşları ve bankalarla iş birliği yapmak ve gerektiğinde onlarla ortak projeler gerçekleştirmek yetkisine sahiptir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediye, bu amaçla bütçesinden gerekli parayı ayırmak suretiyle işletme tesis edebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Arsalar hariç üretilen konut ve işyerlerinin satışı 2886 sayılı Devlet İhale Kanunu hükümlerine tâbi değildir. O belediye ve mücavir alan sınırları içinde kendisine, eşine veya onsekiz yaşından küçük çocuklarına ait konutu olmayan dar gelirli kişiler ile afete maruz kalanlara, sanayi bölgelerinden nakledileceklere ve üyelerinin tamamı bu durumda olan kooperatiflere, bedeli 2942 sayılı Kamulaştırma Kanunu hükümlerine göre oluşturulan takdir komisyonu tarafından belirlenecek tutardan aşağı olmamak üzere arsa tahsisi yapılabilir. Durumları 775 sayılı Gecekondu Kanununun 25 inci maddesine uyan kimselere de bu maddeye göre arsa ve konut sağlanabilir. Bu fıkranın uygulama esasları, Çevre ve Şehircilik Bakanlığı tarafından hazırlanacak çerçeve yönetmeliğe uygun olarak belediye meclisleri tarafından çıkarılacak bir yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="70" başlık="Şirket kurulması">
        <mvz-fıkra no="1">
          <template>Belediye kendisine verilen görev ve hizmet alanlarında, ilgili mevzuatta belirtilen usûllere göre şirket kurabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="71" başlık="İşletme tesisi">
        <mvz-fıkra no="1">
          <template>Belediye, özel gelir ve gideri bulunan hizmetlerini Çevre ve Şehircilik Bakanlığının izniyle bütçe içinde işletme kurarak yapabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="72" başlık="Borç ve alacakların takas ve mahsubu" durum="mülga">
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="Çeşitli ve Son Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Çeşitli Hükümler">
      <mvz-madde no="73" başlık="Kentsel dönüşüm ve gelişim alanı">
        <mvz-fıkra no="1">
          <template>Belediye, belediye meclisi kararıyla; konut alanları, sanayi alanları, ticaret alanları, teknoloji parkları, kamu hizmeti alanları, rekreasyon alanları ve her türlü sosyal donatı alanları oluşturmak, eskiyen kent kısımlarını yeniden inşa ve restore etmek, kentin tarihi ve kültürel dokusunu korumak veya deprem riskine karşı tedbirler almak amacıyla kentsel dönüşüm ve gelişim projeleri uygulayabilir. Bir alanın kentsel dönüşüm ve gelişim alanı olarak ilan edilebilmesi için yukarıda sayılan hususlardan birinin veya bir kaçının gerçekleşmesi ve bu alanın belediye veya mücavir alan sınırları içerisinde bulunması şarttır. Ancak, kamunun mülkiyetinde veya kullanımında olan yerlerde kentsel dönüşüm ve gelişim proje alanı ilan edilebilmesi ve uygulama yapılabilmesi için ilgili belediyenin talebi ve Cumhurbaşkanınca bu yönde karar alınması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kentsel dönüşüm ve gelişim proje alanı olarak ilan edilecek alanın; üzerinde yapı olan veya olmayan imarlı veya imarsız alanlar olması, yapı yükseklik ve yoğunluğunun belirlenmesi, alanın büyüklüğünün en az 5 en çok 500 hektar arasında olması, etaplar halinde yapılabilmesi hususlarının takdiri münhasıran belediye meclisinin yetkisindedir. Toplamı 5 hektardan az olmamak kaydı ile proje alanı ile ilişkili birden fazla yer tek bir dönüşüm alanı olarak belirlenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Büyükşehir belediye ve mücavir alan sınırları içinde kentsel dönüşüm ve gelişim projesi alanı ilan etmeye büyükşehir belediyeleri yetkilidir. Büyükşehir belediye meclisince uygun görülmesi halinde ilçe belediyeleri kendi sınırları içinde kentsel dönüşüm ve gelişim projeleri uygulayabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Büyükşehir belediyeleri tarafından yapılacak kentsel dönüşüm ve gelişim projelerine ilişkin her ölçekteki imar planı, parselasyon planı, bina inşaat ruhsatı, yapı kullanma izni ve benzeri tüm imar işlemleri ve 3/5/1985 tarihli ve 3194 sayılı İmar Kanununda belediyelere verilen yetkileri kullanmaya büyükşehir belediyeleri yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kentsel dönüşüm ve gelişim proje alanlarında bulunan yapıların boşaltılması, yıkımı ve kamulaştırılmasında anlaşma yolu esastır. Kentsel dönüşüm ve gelişim projesi kapsamında bulunan gayrimenkul sahipleri ve belediye tarafından açılacak davalar, mahkemelerde öncelikle görüşülür ve karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Kentsel dönüşüm ve gelişim alanları içinde yer alan eğitim ve sağlık alanları hariç kamuya ait gayrimenkuller harca esas değer üzerinden belediyelere devredilir.  Devredilen bu gayrimenkuller için Cumhurbaşkanınca kentsel dönüşüm ve gelişim alanı kararının alındığı tarihten itibaren ecrimisil tahakkuk ettirilmez, tahakkuk ettirilen ecrimisiller terkin edilir, tahsil edilenler ise iade edilir. Kentsel dönüşüm ve gelişim proje alanlarında yıkılarak yeniden yapılacak münferit yapılarda ilgili vergi, resim ve harçların dörtte biri alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kentsel dönüşüm ve gelişim proje alanlarındaki gayrimenkul sahipleri ve 24/2/1984 tarihli ve 2981 sayılı İmar ve Gecekondu Mevzuatına Aykırı Yapılara Uygulanacak Bazı İşlemler ve 6785 Sayılı İmar Kanununun Bir Maddesinin Değiştirilmesi Hakkında Kanuna istinaden, hak sahibi olmuş kimselerle anlaşmaları halinde kentsel dönüşüm ve gelişim proje alanında hakları verilir.  Anlaşma sonucu belediye mülkiyetine geçen gayrimenkuller haczedilemez. 2981 sayılı Kanun kapsamına girmeyen gecekondu sahiplerine enkaz ve ağaç bedelleri verilir veya belediye imkanları ölçüsünde kentsel dönüşüm ve gelişim proje alanı dışında arsa veya konut satışı yapılabilir. Bu kapsamda bulunanlara Toplu Konut İdaresi Başkanlığı ile işbirliği yapılmak suretiyle konut satışı da yapılabilir. Enkaz ve ağaç bedelleri arsa veya konut bedellerinden mahsup edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Kentsel dönüşüm ve gelişim alanı ilan edilen yerlerde belediyelere ait gayrimenkuller ile belediyelerin anlaşma sağladığı veya kamulaştırdıkları gayrimenkuller üzerindeki inşaatların tamamı belediyeler tarafından yapılır veya yaptırılır. Belediye ile anlaşma yapmayan veya belediyece kamulaştırılmasına gerek duyulmayan gayrimenkul sahiplerinden proje alanında kendilerine 3194 sayılı Kanunun 18 inci maddesine göre ayrı ada ve parselde imar hakkı verilmemiş olanlar kamulaştırmasız el atma davası açabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Kentsel dönüşüm ve gelişim proje alanlarında yapılacak alt yapı ve rekreasyon harcamaları, proje ortak gideri sayılır. Belediyelere ait inşaatların proje ortak giderleri belediyeler tarafından karşılanır. Kendilerine ayrı ada veya parsel tahsis edilen gayrimenkul sahipleri ile kamulaştırma dışı kalan gayrimenkul sahipleri, sahip oldukları inşaatın toplam metrekaresi oranında proje ortak giderlerine katılmak zorundadır. Proje ortak gideri ödenmeden inşaat ruhsatı, yapılan binalara yapı kullanma izni verilemez; su, doğalgaz ve elektrik bağlanamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Dönüşüm alanı sınırı kesinleştiği tarihte, bu sınırlar içindeki gayrimenkullerin tapu kütüğünün beyanlar hanesine kaydedilmek üzere tapu sicil müdürlüğüne, paftasında gösterilmek üzere kadastro müdürlüğüne bildirilir. Söz konusu gayrimenkullerin kaydında meydana gelen değişiklikler belediyeye bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Kentsel dönüşüm ve gelişim alanı ilan edilen yerlerde; ifraz, tevhit, sınırlı ayni hak tesisi ve terkini, cins değişikliği ve yapı ruhsatı verilmesine ilişkin işlemler belediyenin izni ile yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>Belediye, kentsel dönüşüm ve gelişim projelerini gerçekleştirmek amacıyla; imar uygulaması yapmaya, imar uygulaması yapılan alanlardaki taşınmazların değerlerini tespit etmeye ve bu değer üzerinden hak sahiplerine dağıtım yapmaya veya hasılat paylaşımını esas alan uygulamalar yapmaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Kentsel dönüşüm ve gelişim projelerinin uygulanması sırasında, tapu kayıtlarında mülkiyet hanesi açık olan veya ayni hakları davalı olan taşınmazlar doğrudan kamulaştırılarak bedelleri mahkemece tayin edilen bankaya belli olacak hak sahipleri adına bloke edilir. Belediye kentsel dönüşüm ve gelişim projelerinin uygulama alanında bulunan taşınmazların kamulaştırılması sırasında veraset ilamı çıkarmaya veya tapudaki kayıt malikine göre işlem yapmaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="14">
          <template>Büyükşehirlerde büyükşehir belediye meclisinin, il ve ilçelerde belediye meclislerinin salt çoğunluk ile alacağı karar ile masrafların tamamı veya bir kısmı belediye bütçesinden karşılanmak kaydıyla kentin uygun görülen alanlarında bina cephelerinde değişiklik ve yenileme ile özel aydınlatma ve çevre tanzimi çalışmaları yapılabilir. Cephe değişikliği yapılacak binalarda telif hakkı sahibi proje müelliflerine talep etmeleri hâlinde, değiştirilecek cephe veya cephelerin beher metrekaresi için bir günlük net asgari ücret tutarını geçmemek üzere telif hakkı ödenir. Büyükşehir belediye meclisince uygun görülmesi hâlinde, büyükşehir belediyesi içindeki ilçe belediyeleri kendi sınırları içinde bu fıkrada belirtilen iş ve işlemleri yapabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="15">
          <template>Bina cephelerinde değişiklik ve yenileme ile özel aydınlatma ve çevre tanzimi çalışmaları için yapılması gereken iş, işlem ve yetkilendirmeler, kat maliklerinin arsa payı çoğunluğu ile verecekleri karara göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="16">
          <template>Büyükşehir belediyelerince, kentsel dönüşüm ve gelişim alanı ilan edilen alanlar ile 5366 sayılı Kanuna göre yenileme alanı ilan edilen alanlarda veya bu Kanunun 75 inci maddesine göre kamu kurum ve kuruluşları ile protokol yapmaları hâlinde, büyükşehir belediye meclisi kararı ile, yıkılan ibadethane ve yurtların yerine veya ihtiyaç duyulan yerlerde ibadethane ve yurt inşa edilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="17">
          <template>Kentsel dönüşüm ve gelişim projesi kapsamındaki işler, kamu idareleriyle 75 inci madde çerçevesinde ortak hizmet projeleri aracılığıyla gerçekleştirilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="18">
          <template>Bu Kanunun konusu ile ilgili hususlarda Başbakanlık Toplu Konut İdaresine 2985 sayılı Kanun ve diğer kanunlarla verilen yetkiler saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="74" başlık="Yurt dışı ilişkileri">
        <mvz-fıkra no="1">
          <template>Belediye, belediye meclisinin kararına bağlı olarak görev alanıyla ilgili konularda faaliyet gösteren uluslararası teşekkül ve organizasyonlara, kurucu üye veya üye olabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediye bu teşekkül, organizasyon ve yabancı mahallî idarelerle ortak faaliyet ve hizmet projeleri gerçekleştirebilir veya kardeş kent ilişkisi kurabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci ve ikinci fıkra gereğince yapılacak faaliyetlerin, dış politikaya ve uluslararası anlaşmalara uygun olarak yürütülmesi ve önceden Çevre ve Şehircilik Bakanlığının izninin alınması zorunludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="75" başlık="Diğer kuruluşlarla ilişkiler">
        <mvz-fıkra no="1">
          <template>Belediye, belediye meclisinin kararı üzerine yapacağı anlaşmaya uygun olarak görev ve sorumluluk alanlarına giren konularda;</template>
          <mvz-bent no="a">
            <template>Mahallî idareler ile diğer kamu kurum ve kuruluşlarına ait yapım, bakım, onarım ve taşıma işlerini bedelli veya bedelsiz üstlenebilir veya bu kuruluşlar ile ortak hizmet projeleri gerçekleştirebilir ve bu amaçla gerekli kaynak aktarımında bulunabilir. Bu takdirde iş, işin yapımını üstlenen kuruluşun tâbi olduğu mevzuat hükümlerine göre sonuçlandırılır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Mahallî idareler ile merkezî idareye ait aslî görev ve hizmetlerin yerine getirilmesi amacıyla gerekli aynî ihtiyaçları karşılayabilir, geçici olarak araç ve personel temin edebilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kamu kurumu niteliğindeki meslek kuruluşları, kamu yararına çalışan dernekler, Cumhurbaşkanınca vergi muafiyeti tanınmış vakıflar ve 7/6/2005 tarihli ve 5362 sayılı Esnaf ve Sanatkârlar Meslek Kuruluşları Kanunu kapsamına giren meslek odaları ile ortak hizmet projeleri gerçekleştirebilir. Diğer dernek ve vakıflar ile gerçekleştirilecek ortak hizmet projeleri için mahallin en büyük mülki idare amirinin izninin alınması gerekir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Kendilerine ait taşınmazları, aslî görev ve hizmetlerinde kullanılmak üzere bedelli veya bedelsiz olarak mahallî idareler ile diğer kamu kurum ve kuruluşlarına devredebilir veya süresi yirmibeş yılı geçmemek üzere tahsis edebilir. Bu taşınmazlar aynı kuruluşlara kiraya da verilebilir. Bu taşınmazların, tahsis amacı dışında kullanılması hâlinde, tahsis işlemi iptal edilir. Tahsis süresi sonunda, aynı esaslara göre yeniden tahsis mümkündür.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu kurum ve kuruluşlarına belediyeler, bağlı kuruluşları ve belediye şirketlerince devir veya tahsis edilen taşınmazlar, kamu konutu ve sosyal tesis olarak kullanılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununun 29 uncu maddesinin birinci fıkrasının ikinci cümlesi ile 5253 sayılı Dernekler Kanununun 10 uncu maddesi; belediyeler, il özel idareleri, bağlı kuruluşları ve bunların üyesi oldukları birlikler ile ortağı oldukları Sayıştay denetimine tabi şirketler için uygulanmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Afet, kitlesel göç ve teröre maruz kalan yerleşim birimlerinin belediyeleri  vali veya belediye başkanı, aksayan belediye hizmetinin başka bir belediye tarafından yerine getirilmesini talep edebilir. Yardım istenilen belediye, meclis kararına gerek olmaksızın İçişleri Bakanının izniyle bu talebi yerine getirebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="76" başlık="Kent konseyi">
        <mvz-fıkra no="1">
          <template>Kent konseyi, kent yaşamında; kent vizyonunun ve hemşehrilik bilincinin geliştirilmesi, kentin hak ve hukukunun korunması, sürdürülebilir kalkınma, çevreye duyarlılık, sosyal yardımlaşma ve dayanışma, saydamlık, hesap sorma ve hesap verme, katılım ve yerinden yönetim ilkelerini hayata geçirmeye çalışır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediyeler kamu kurumu niteliğindeki meslek kuruluşlarının, sendikaların, noterlerin, varsa üniversitelerin, ilgili sivil toplum örgütlerinin, siyasî partilerin, kamu kurum ve kuruluşlarının ve mahalle muhtarlarının temsilcileri ile diğer ilgililerin katılımıyla oluşan kent konseyinin faaliyetlerinin etkili ve verimli yürütülmesi konusunda yardım ve destek sağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kent konseyinde oluşturulan görüşler belediye meclisinin ilk toplantısında gündeme alınarak değerlendirilir. Kent konseyinin çalışma usûl ve esasları Çevre ve Şehircilik Bakanlığınca hazırlanacak yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="77" başlık="Belediye hizmetlerine gönüllü katılım">
        <mvz-fıkra no="1">
          <template>Belediye; sağlık, eğitim, spor, çevre, sosyal hizmet ve yardım, kütüphane, park, trafik ve kültür hizmetleriyle yaşlılara, kadın ve çocuklara, engellilere, yoksul ve düşkünlere yönelik hizmetlerin yapılmasında beldede dayanışma ve katılımı sağlamak, hizmetlerde etkinlik, tasarruf ve verimliliği artırmak amacıyla gönüllü kişilerin katılımına yönelik programlar uygular.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gönüllülerin nitelikleri ve çalıştırılmalarına ilişkin usûl ve esaslar Çevre ve Şehircilik Bakanlığı tarafından çıkarılacak yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="78" başlık="Yazışma">
        <mvz-fıkra no="1">
          <template>Belediye, kamu kurum ve kuruluşlarıyla doğrudan yazışabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="79" başlık="Belediye tasarrufundaki yerler">
        <mvz-fıkra no="1">
          <template>Diğer kanunlarla getirilen hükümler saklı kalmak üzere, mezarlıklar ile belediye sınırları içinde bulunan ve sahipsiz arazi niteliğinde olan seyrangâh, harman yeri, koruluk, dinlenme yerleri, meydanlar, bataklık, çöp döküm sahaları, yıkılmış kale ve kulelerin arsaları ve enkazı ve benzeri yerler belediyenin tasarrufundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediye tarafından deniz, akarsu ve gölden doldurma suretiyle kazanılan alanlar, Kıyı Kanunu ve ilgili mevzuata uygun olarak kullanılmak şartıyla Maliye Bakanlığı tarafından belediyelerin, büyükşehirlerde büyükşehir belediyelerinin tasarrufuna bırakılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="80" başlık="Şehirlerarası özel otobüs terminali işletmesi ve akaryakıt istasyonları">
        <mvz-fıkra no="1">
          <template>Belediye sınırları ve mücavir alanları içinde, kara yolu ile yolcu taşıma hakkına sahip gerçek ve tüzel kişilerin şehirlerarası otobüs terminali kurmalarına ve işletmeleri ile her türlü akaryakıt ile sıvılaştırılmış petrol gazı (LPG) ve sıvılaştırılmış doğal gaz (LNG) istasyonlarına nazım imar ve uygulama imar plânına uygun olmak kaydıyla belediye tarafından izin verilebilir. Akaryakıt istasyonlarına izin verilmesi için nazım imar plânında akaryakıt istasyonu olarak gösterilmesi şarttır. Bu istasyonlara çalışma ruhsatı büyükşehirlerde büyükşehir belediyesi tarafından verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="81" başlık="Ad verme, tanıtıcı amblem ve flama kullanımı">
        <mvz-fıkra no="1">
          <template>Cadde, sokak, meydan, park, tesis ve benzerlerine ad verilmesi ve beldeyi tanıtıcı amblem, flama ve benzerlerinin tespitine ilişkin kararlarda; belediye meclisinin üye tam sayısının salt çoğunluğu, bunların değiştirilmesine ilişkin kararlarda ise meclis üye tam sayısının üçte iki çoğunluğunun kararı aranır. Bu kararlar mülkî idare amirinin onayı ile yürürlüğe girer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="82" başlık="Avukatlık ücretinin dağıtımı">
        <mvz-fıkra no="1">
          <template>Belediye lehine sonuçlanan dava ve icra takipleri nedeniyle hükme bağlanarak karşı taraftan tahsil olunan vekâlet ücretlerinin; avukatlara (49 uncu maddeye göre çalıştırılanlar dâhil) ve hukuk servisinde fiilen görev yapan memurlara dağıtımı hakkında 1389 sayılı Devlet Davalarını İntaç Eden Avukat ve Saireye Verilecek Ücreti Vekâlet Hakkında Kanun hükümleri kıyas yolu ile uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="83" başlık="Yeniden değerleme oranının uygulanması">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 15, 18 ve 34 üncü maddelerinde belirtilen parasal miktarlar, her yıl 213 sayılı Vergi Usul Kanununa göre belirlenecek yeniden değerleme oranına göre artırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="84" başlık="Uygulanmayacak hükümler">
        <mvz-fıkra no="1">
          <template>Bu Kanunla, belediyenin sorumlu ve yetkili kılındığı görev ve hizmetlerle sınırlı olarak; 24.4.1930 tarihli ve 1593 sayılı Umumî Hıfzıssıhha Kanunu, 4.7.1934 tarihli ve 2559 sayılı Polis Vazife ve Selâhiyet Kanunu, 10.6.1949 tarihli ve 5442 sayılı İl İdaresi Kanunu, 12.9.1960 tarihli ve 80 sayılı 1580 Sayılı Belediye Kanununun 15 inci Maddesinin 58 inci Bendine Tevfikan Belediyelerce Kurulan Toptancı Hal’lerinin Sureti İdaresi Hakkında Kanun, 2.7.1964 tarihli ve 492 sayılı Harçlar Kanunu, 13.10.1983 tarihli ve 2918 sayılı Karayolları Trafik Kanunu, 3.5.1985 tarihli ve 3194 sayılı İmar Kanunu, 14.6.1989 tarihli ve 3572 sayılı İşyeri Açma ve Çalışma Ruhsatlarına Dair Kanun Hükmünde Kararnamenin Değiştirilerek Kabulüne Dair Kanun, , 10.7.2003 tarihli ve 4925 sayılı Karayolu Taşıma Kanunu, 1.5.2003 tarihli ve 4856 sayılı Çevre ve Orman Bakanlığı Teşkilat ve Görevleri Hakkında Kanun ile 14.7.1965 tarihli ve 657 sayılı Devlet Memurları Kanununda bu Kanun hükümlerine aykırılık bulunması durumunda bu Kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Değiştirilen, Eklenen ve Yürürlükten Kaldırılan Hükümler">
      <mvz-madde no="85" başlık="">
        <mvz-fıkra no="1">
          <template></template>
          <mvz-bent no="a" durum="işlenmiş">
            <template>(8.6.1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanunu ile ilgili olup yerine işlenmiştir.)</template>
          </mvz-bent>
          <mvz-bent no="b" durum="işlenmiş">
            <template>(5.1.1961 tarihli ve 237 sayılı Taşıt Kanunu ile ilgili olup yerine işlenmiştir.)</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>18.1.1984 tarihli ve 2972 sayılı Mahalli İdareler ile Mahalle Muhtarlıkları ve İhtiyar Heyetleri Seçimi Hakkında Kanunun 29 uncu maddesinin birinci fıkrasının mülga (d) bendi, “d) Belediye kurulması,” şeklinde yeniden düzenlenmiştir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>10.7.2004 tarihli ve 5216 sayılı Büyükşehir Belediyesi Kanununun 7 nci maddesinin birinci fıkrasının (i) bendindeki “ağaçlandırma yapmak;” ibaresinden sonra gelmek üzere “gayrisıhhî işyerlerini, eğlence yerlerini, halk sağlığına ve çevreye etkisi olan diğer işyerlerini kentin belirli yerlerinde toplamak; inşaat malzemeleri, hurda depolama alanları ve satış yerlerini,” ibaresi, aynı maddenin üçüncü fıkrasının (d) bendindeki “belirtilen hizmetlerden” ibaresinden sonra gelmek üzere “775 sayılı Gecekondu Kanununda belediyelere verilen yetkileri kullanmak,” ibaresi eklenmiş; 13 üncü maddesinin birinci fıkrasının sonuna “Meclis kendi belirleyeceği bir ay tatil yapabilir.” Cümlesi ile 22 nci maddesinin üçüncü fıkrasındaki “Büyükşehir belediyesi” ibaresinden sonra gelmek üzere “1.hukuk müşaviri ve” ibaresi eklenmiş; 13 üncü maddesinin birinci fıkrasında geçen “Kasım ayı toplantısı dönem başı toplantısıdır.” Cümlesi ile 14 üncü maddesinin üçüncü fıkrasındaki “on gün içinde” ibaresi ve 15 inci maddesinin birinci fıkrasında geçen “her dönem başı toplantısında,” ile 16 ncı maddesinin birinci fıkrasında geçen “her yılın ilk olağan toplantısında” ibareleri madde metinlerinden çıkarılmıştır.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>22.2.2005 tarihli ve 5302 sayılı İl Özel İdaresi Kanununun 6 ncı maddesinin birinci fıkrasının (a) bendine, “erozyonun önlenmesi,” ibaresinden sonra gelmek üzere “kültür, sanat, turizm,” ibaresi eklenmiş; (b) bendinde yer alan “kültür, turizm, gençlik ve spor” ibaresi madde metninden çıkarılmış ve aynı maddeye birinci fıkrasından sonra gelmek üzere aşağıdaki fıkra eklenmiş; 12 nci maddesinin birinci fıkrasında yer alan “Kasım ayı toplantısı dönem başı toplantısıdır.” Cümlesi ile 15 inci maddesinin üçüncü fıkrasında yer alan “on gün içinde” ibaresi madde metninden çıkarılmış; 16 ncı maddesinin birinci fıkrasının birinci cümlesi “İl genel meclisi, bir yıl görev yapmak üzere üyeleri arasından en az üç, en fazla beş kişiden oluşan ihtisas komisyonları kurabilir.” Şeklinde değiştirilmiş; 24 üncü maddesinin birinci fıkrasına “Meclis” ibaresinden sonra gelmek üzere “ve komisyon” ibaresi eklenmiş ve aynı fıkradaki “2600” ibaresi “6000” olarak değiştirilmiş; 36 ncı maddesinin üçüncü ve dördüncü fıkraları madde metninden çıkarılmış ve “il özel idarelerinde sözleşmeli personel ile kısmi zamanlı sözleşmeli personel çalıştırılması hususunda Belediye Kanununun 49 uncu maddesi hükümleri uygulanır.” Cümlesi aynı maddeye üçüncü fıkra olarak eklenmiştir.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Merkezi idare tarafından yürütülen görev ve hizmetlere ait yatırımlardan ilgili bakanlıkça uygun görülenler, il özel idareleri eliyle de gerçekleştirilebilir. Bu yatırımlara ait ödenekler, ilgili kuruluş tarafından o il özel idaresi bütçesine aktarılır. İl özel idaresi bu yatırımların yüzde yirmibeşine kadar olan kısmı için kendi bütçesinden harcama yapabilir. Merkezi idare, ayrıca, desteklemek ve geliştirmek istediği hizmetleri proje bazında gerekli kaynaklarını ilgili il özel idaresine aktarmak suretiyle onlarla işbirliği içinde yürütebilir. Bu kaynak ve ödenekler özel idare bütçesi ile ilişkilendirilmez ve başka amaçla kullanılamaz.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>7.12.2004 tarihli ve 5272 sayılı Belediye Kanunu yürürlükten kaldırılmıştır.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>29.7.1970 tarihli ve 1319 sayılı Emlak Vergisi Kanununun 38 inci maddesi yürürlükten kaldırılmıştır.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>12.4.2000 tarihli ve 4562 sayılı Organize Sanayi Bölgeleri Kanununun 4 üncü maddesinin altıncı fıkrası aşağıdaki şekilde değiştirilmiştir.</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Yürürlüğe giren mevzii imar plânına göre arazi kullanımı, yapı ve tesislerinin projelendirilmesi, inşası ve kullanımıyla ilgili ruhsat ve izinler ile işyeri açma ve çalışma ruhsatları OSB tarafından verilir ve denetlenir. İşyeri açma ve çalışma ruhsatının verilmesi sırasında işyeri açma ve çalışma ruhsatına ilişkin harçlar, OSB tarafından tahsil edilerek ilgili belediye veya il özel idaresi hesabına yatırılır.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Geçici ve Son Hükümler">
      <mvz-madde no="1" başlık="Asansör yıllık kontrol faaliyetlerine ilişkin sorumluluk" tür="Ek">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 15 inci maddesinin birinci fıkrasının (s) bendinde düzenlenen yetkinin usulüne uygun kullanılmaması sonucu oluşacak yaralanma ve ölüm olaylarından dolayı, ilgili belediye yetkilileri 5237 sayılı Türk Ceza Kanunu hükümlerine göre sorumludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Kamu kurum ve kuruluşlarına uygulanan su ve atık su tarife ücreti tüketim miktarına bakılmaksızın sabit tarife ücreti olarak belirlenir ve konutlar için belirlenen en düşük su ve atık su tarife ücretinin yüzde 50 fazlasını geçemez. Belediyeler temiz şebeke suyu hizmeti vermediği yerleşim yerlerindeki kamu kurumlarından herhangi bir ad altında ücret talep edemez. Kamuya ait eğitim kurumları, yurtlar, okul pansiyonları ve hastanelerden abonelik, açma kapama, bağlantı, teminat, güvence bedeli, katılma payı ve benzeri ad altında herhangi bir ücret talep edilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Aboneliği Kültür ve Turizm Bakanlığı, il kültür ve turizm müdürlükleri veya Bakanlığa bağlı döner sermaye işletmesi merkez müdürlüğüne ait olan müze ve ören yerleri için, belediyeler veya büyükşehir belediyeleri su ve kanalizasyon idareleri tarafından belirlenecek su ve atık su tarifeleri, tüketim miktarına bakılmaksızın kamu kurum ve kuruluşlarına uygulanan su ve atık su tarifesini geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Aboneliği Kültür ve Turizm Bakanlığı, il kültür ve turizm müdürlükleri veya Bakanlığa bağlı döner sermaye işletmesi merkez müdürlüğüne ait olan müze ve ören yerlerinde, 3/6/2007 tarihli ve 5686 sayılı Jeotermal Kaynaklar ve Doğal Mineralli Sular Kanununda yer alan kaynaklardan elde edilen su, gaz, jeotermal akışkan ve buharın müze ve ören yerlerinde elde edilmesi, iletilmesi ve kullanılması için uygulanacak tarife; tüketim miktarına bakılmaksızın büyükşehir belediyeleri, belediyeler veya büyükşehir belediyeleri su ve kanalizasyon idarelerinin aynı dönemdeki su tarifesinde kamu kurum ve kuruluşlarına uygulanan su ve atık su tarifesinin yüzde onunu geçemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Ek">
        <mvz-fıkra no="1">
          <template>Belediyeler, mevzuatla kendilerine verilen görev ve hizmetlerin yürütülmesi ve vatandaşlar tarafından yapılan başvuruların sonuçlandırılması amacıyla her türlü idari iş ve işlemin yürütüldüğü e-Belediye bilgi sistemini kullanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>e-Belediye bilgi sistemini kurmaya, işletmeye, veri saklama, veri iletimi ve veri paylaşımı ile ilgili politikaları tespit etmeye, çalışma usul ve esaslarını belirlemeye ve bu sistem ile ilgili merkezî bir hizmet standardizasyonu oluşturmaya İçişleri ile Çevre ve Şehircilik bakanlıkları müştereken yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yayımı tarihinde personel giderlerine ilişkin olarak 49 uncu maddede belirtilen oranları aşmış olan belediyelerde bu oranların altına inilinceye kadar, boş kadro ve pozisyon bulunması ve bütçe imkânlarının yeterli olması kaydıyla 1.1.2005 tarihinde mevcut memur ve sözleşmeli personel sayısının yüzde onunu geçmemek üzere İçişleri Bakanlığınca zorunlu hâllere münhasır olacak şekilde verilecek izin dışında ilâve personel istihdam edilemez. Geçici iş pozisyonları için önceki yıldan fazla olacak şekilde vize yapılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Norm kadro uygulamasına geçilinceye kadar belediyenin, bağlı kuruluşlarının ve mahallî idare birliklerinin memur kadrolarının ihdas ve iptalleri ile boş kadro değişiklikleri, İçişleri Bakanlığının teklifi, Maliye Bakanlığı ve Devlet Personel Başkanlığının uygun görüşü üzerine Bakanlar Kurulu kararı ile yapılır. Norm kadro uygulamasına geçilinceye kadar, Bakanlar Kurulu tarafından ihdas edilmiş mevcut kadrolar 49 uncu maddenin üçüncü fıkrasının uygulanması açısından norm kadro kabul edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sürekli işçi kadroları ile iş pozisyonları ise norm kadro uygulamasına geçilinceye kadar İçişleri Bakanlığının vizesine tâbidir. İçişleri Bakanlığı vize yetkisini valiliklere devredebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun yayımlandığı tarihte 2000 yılı genel nüfus sayımına göre nüfusu 2.000’in altına düşen belediyelerin tüzel kişiliklerinin kaldırılarak köye dönüştürme işlemi, bu Kanunun 8 inci maddesi uygulamasından faydalanmak isteyen belediyeler için 31.12.2006 tarihine kadar uygulanmaz. Tüzel kişiliğin kaldırılmasında, birleşme veya katılma sonrasında 2000 yılı genel nüfus sayımı sonucuna göre oluşan toplam nüfus esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>5272 sayılı Belediye Kanununun geçici 4 üncü maddesine göre yapılan işlemler bu maddeye göre yapılmış sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>41 inci maddede öngörülen stratejik plân, Kanunun yürürlüğe girmesinden itibaren bir yıl içinde hazırlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Belediyeler ve bağlı kuruluşları ile sermayesinin yüzde ellisinden fazlası belediyelere ait şirketlerin, 31.12.2004 tarihi itibariyle kamu kurum ve kuruluşlarından olan kamu ve özel hukuka tâbi alacakları, bunların diğer kamu kurum ve kuruluşlarına olan borçlarına karşılık olmak üzere 31.12.2005 tarihine kadar takas ve mahsup edilir. Bakanlar Kurulu bu süreyi altı aya kadar uzatmaya yetkilidir. Bu madde kapsamındaki alacak ve borç ifadesi bu alacak ve borçlara ilişkin fer’ileri ve cezaları da kapsar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıdaki fıkra kapsamında yer alan kuruluşların takas ve mahsup işlemine konu olan veya olmayan borçları, genel bütçe vergi gelirlerinden her ay ayrılacak paylarının yüzde kırkını geçmemek üzere kesinti yapılarak tahsil edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu maddeye göre yapılacak takas, mahsup ve kesinti işlemleri yılı bütçe kanunları ile ilişkilendirilmeksizin ilgili kuruluş ile uzlaşma komisyonu tarafından belirlenir; Hazine Müsteşarlığının bağlı olduğu Bakanın önerisi üzerine Bakanlar Kurulu tarafından karara bağlanır.  30/6/2006 tarihi itibarı ile Uzlaşma Komisyonu ile takas, mahsup ve kesinti yapılmasına ilişkin kararları imzalayan ancak Bakanlar Kurulu tarafından söz konusu kararları henüz onaylanmayan ilgili kuruluşların işlemleri 28 Şubat 2007 tarihine kadar karara bağlanır. Bakanlar Kurulu, ilgili kuruluşların borç ödeme kapasitelerini de dikkate alarak ödenecek tutarları taksitlendirmeye, taksitlendirilen kısma Kanunun yayımını izleyen günden itibaren zam ve faiz uygulatmamaya, bu borçların fer’i ve cezalarını geçmemek üzere indirim yapmaya yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu madde uyarınca takas, mahsup ve kesinti işlemine tâbi tutulan borç ve alacaklar için ilgili kanunlarda öngörülen zamanaşımı süreleri işlemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İlgili kuruluşun uzlaşma ve hacizlerin kaldırılmasına dair başvurusunun uzlaşma komisyonunca kabul edilmesini müteakip 31.12.2004 tarihinden önceki borçlar için tatbik edilen hacizler kaldırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Uzlaşma komisyonu Hazine Müsteşarlığının bağlı olduğu Bakan tarafından görevlendirilecek bir başkan ile İçişleri Bakanlığı, Maliye Bakanlığı, Devlet Plânlama Teşkilatı Müsteşarlığı, Hazine Müsteşarlığı, Sayıştay Başkanlığı, Sosyal Sigortalar Kurumu Başkanlığı ve İller Bankası Genel Müdürlüğünden birer temsilciden oluşur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="" tür="Geçici" durum="mülga">
      </mvz-madde>
      <mvz-madde no="7" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 52 nci maddesine göre çıkarılan Yönetmelik çerçevesinde “İtfaiye Eri” kadro unvanına atanmak üzere açılmış olan sınav sonucunda başarılı oldukları ilan edildiği halde herhangi bir sebeple atamaları yapılmamış olanlar, bu işlemler sebebiyle dava açmış olmaları halinde davadan vazgeçmeleri, açmış oldukları dava lehlerine sonuçlananlar ise mahkeme tarafından karara bağlanmış tazminat veya geriye dönük maaş haklarından yazılı olarak feragat etmeleri kaydıyla, bu maddenin yürürlüğe girdiği tarihten itibaren 30 gün içinde atama işlemleri tamamlanarak göreve başlatılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="" tür="Geçici" durum="iptal">
      </mvz-madde>
      <mvz-madde no="9" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Bu maddenin yürürlüğe girdiği tarihten önce terör veya terör örgütlerine yardım ve yataklık suçları kapsamında haklarında yürütülen soruşturma veya kovuşturma nedeniyle görevden uzaklaştırılan belediye başkanı, başkan vekili ve meclis üyelerinin yerine 45 inci maddenin birinci fıkrasının (b) bendine göre işlem yapılmış olsa bile onbeş gün içerisinde 46 ncı maddedeki yetkili makamlarca 45 inci maddenin ikinci fıkrasında belirtilen usule göre görevlendirme yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Belediyeler, e-Belediye bilgi sisteminin kurulduğuna dair bildirimin İçişleri Bakanlığı tarafından yapılmasından itibaren e-Belediye bilgi sistemi ile ilgili çalışmaları bir yıl içinde tamamlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Benzer sistemi kullanan belediyeler, sistemlerinde bulunan ve e-Belediye bilgi sistemi için gerekli olan verileri e-Belediye bilgi sistemini kullanmaya başladıkları tarihten itibaren bir yıl içinde e-Belediye bilgi sistemine aktarır. İçişleri Bakanı, gerektiğinde bu süreyi bir katına kadar uzatabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Konusu suç teşkil etmemek kaydıyla, bu maddenin yürürlük tarihine kadar personelinin çocukları için kreş ve gündüz bakımevi hizmetini bütçesinden hizmet alımı yoluyla karşılamış olan belediyeler, büyükşehir belediyeleri ve bağlı kuruluşlarının yetkili ve görevli personeli hakkında idari veya mali yargılama ve takibat yapılamaz, başlamış olanlar işlemden kaldırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="" tür="Geçici">
        <mvz-fıkra no="1">
          <template>Aboneliği Kültür ve Turizm Bakanlığı, il kültür ve turizm müdürlükleri veya Bakanlığa bağlı döner sermaye işletmesi merkez müdürlüğüne ait olan müze ve ören yerlerinde; su ve atık su bedeli ile 5686 sayılı Kanunda yer alan kaynaklardan elde edilen su, gaz, jeotermal akışkan ve buharın elde edilmesi, iletilmesi ve kullanılması için büyükşehir belediyeleri, belediyeler veya büyükşehir belediyeleri su ve kanalizasyon idarelerince uygulanan ve tarifelerinden kaynaklanan alacak asıllarının yüzde ellisinin peşin ödenmesi kaydıyla; bu maddenin yürürlüğe girdiği tarih itibarıyla su ve atık su, gaz, jeotermal akışkan ve buharın alacak asıllarının tamamı ile bunlara bağlı faiz, gecikme faizi, gecikme zammı gibi fer’iler (sözleşmelerde düzenlenen her türlü zam dâhil) ile bu alacaklara bağlı cezaların ve gecikme faizi, gecikme zammı gibi fer’ilerinin (sözleşmelerde düzenlenen her türlü ceza ve zam dâhil) tahsilinden vazgeçilir; varsa başlatılmış icra takipleri düşer, açılmış davalar hakkında resen karar verilmesine yer olmadığına karar verilir, yargılama gideri ve takip giderleri taraflar üzerinde bırakılır ve vekalet ücretine hükmedilmez. Bu maddenin yürürlüğe girdiği tarihten önce verilen ve infaz edilmeyen mahkeme kararlarına konu alacaklar hakkında da bu madde hükümleri uygulanır ve yargılama gideri ile vekalet ücretinin tahsilinden vazgeçilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="86" başlık="Yürürlük">
        <mvz-fıkra no="1">
          <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="87" başlık="Yürütme">
        <mvz-fıkra no="1">
          <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>

      </mvz-madde>
