  <mvz-künye tür="kanun" no="5543" başlık="İSKÂN KANUNU"
             tarih="19/9/2006" rgazete-tarih="26/9/2006" rgazete-sayı="26301"
             düstur-tertip="5" düstur-cilt="46" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; göçmenlerin, göçebelerin, yerleri kamulaştırılanlar ile millî güvenlik nedeniyle yapılacak iskân çalışmalarını, köylerde fiziksel yerleşimin düzenlenmesine ilişkin uygulamaya esas şartları ve alınacak tedbirleri, iskân edilenlerin hak ve yükümlülüklerini düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun; yurt dışından gelen göçmenlerin, yerleri kamulaştırılanların, göçebelerin ve millî güvenlik nedeniyle yerlerinin değiştirilmesine karar verilenlerin iskânı ile köylerin toplulaştırılmasına ve fiziksel yerleşimin düzenlenmesine ilişkin uygulamaya esas alınacak tedbirlere dair hükümleri kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre;</template>
        <mvz-bent no="a">
          <template>Tarımsal iskân: Bir aileye projesinde öngörülen miktarda tarım arazisi, işletme binası, konut, irat hayvanı, araç, gereç, tezgah ve kredilerden bir veya birkaçının verilmesiyle yapılan iskândır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tarım dışı iskân: Bir aileye projesinde öngörülen miktarda arsa, konut, araç, gereç, tezgah ve kredilerden bir veya birkaçının verilmesiyle yapılan iskândır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Fiziksel yerleşim: Bir aileye, yerleşim yerinin elverişsizliği nedeniyle köylerin nakledilmesi veya dağınık yerleşim birimleri ve afet sonucu parçalanmış köylerin toplulaştırılması amacıyla veya köy gelişme alanından ihtiyaçlılara yapılacak arsa satışından sonra Bakanlıkça belirlenecek kredi miktarı üzerinden verilecek kredi desteğiyle yapılan iskândır.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Göçebe: Yerleşik tarımsal faaliyetler dışında kalmış, sabit ve daimi bir konuta bağlı olmadan geçimlerini göçer hayvancılıkla sağlayan, tabiat ve iklim şartlarına göre yurt içinde yaylak ve kışlaklar arasında göçen, bu hayat tarzını kadimden beri sürdüren, aralarında hısımlık ilişkileri bulunan ve hayvancılık faaliyetlerini bir grup halinde yürüten Türk vatandaşlarıdır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Göçmen: Türk soyundan ve Türk kültürüne bağlı olup, yerleşmek amacıyla tek başına veya toplu halde Türkiye'ye gelip bu Kanun gereğince kabul olunanlardır.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Serbest göçmen: Türk soyundan ve Türk kültürüne bağlı olup, yerleşmek amacıyla tek başına veya toplu halde Türkiye'ye gelip, Devlet eliyle iskân edilmelerini istememek şartıyla yurda kabul edilenlerdir.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İskânlı göçmen: Türk soyundan ve Türk kültürüne bağlı olup, özel kanunlarla yurt dışından getirilen ve bu Kanun hükümlerine göre taşınmaz mal verilerek iskânları sağlananlardır.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Münferit göçmen: Türk soyundan ve Türk kültürüne bağlı olup, yurdumuza yerleşmek amacıyla bir aile olarak gelenlerdir.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Toplu göçmen: Türk soyundan ve Türk kültürüne bağlı olup, iki ülke arasında yapılan anlaşmaya göre yurdumuza yerleşmek amacıyla toplu olarak gelen ailelerdir.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Bakan: Bayındırlık ve İskân Bakanıdır.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Bakanlık: Bayındırlık ve İskân Bakanlığıdır.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Göçmenlerin Kabulü">
    <mvz-madde no="4" başlık="Göçmen olarak kabul edilmeyecekler">
      <mvz-fıkra no="1">
        <template>Türk soyundan ve Türk kültürüne bağlı olmayan yabancılar ile Türk soyundan ve Türk kültürüne bağlı bulunup da sınır dışı edilenler ve güvenlik bakımından Türkiye'ye gelmeleri uygun görülmeyenler göçmen olarak kabul edilmezler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Münferit göçmen kabulü">
      <mvz-fıkra no="1">
        <template>Türkiye'de yerleşmek isteyen Türk soyundan ve Türk kültürüne bağlı bulunan kimselerden, Türk uyruklu ve Türkiye'deki birinci veya ikinci derecede bir yakını tarafından referans verilen veya bulundukları ülkedeki konsolosluk temsilciliklerimize bizzat müracaat eden ve bu Kanun hükümlerine göre Dışişleri ve İçişleri bakanlıklarınca yapılacak incelemelerden sonra uygun görülerek serbest göçmen vizesi alanlar, Hükümetten hiçbir iskân yardımı istememeleri şartıyla İçişleri Bakanlığınca serbest göçmen olarak kabul edilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu yolla geleceklerin pasaportlarına gerekli açıklama yazılır ve haklarında 8 inci madde hükümlerine göre işlem yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Toplu göçmen kabulü">
      <mvz-fıkra no="1">
        <template>Yabancı ülkelerle yapılan anlaşmalar gereğince Türkiye'ye gelmek isteyen Türk soyundan ve Türk kültürüne bağlı kimseler, anlaşma hükümlerine göre ve Cumhurbaşkanınca verilecek karar uyarınca İçişleri Bakanlığınca serbest göçmen olarak kabul olunurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bunlar hakkında 8 inci madde hükümlerine göre işlem yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Türk soyundan olmanın ve Türk kültürüne bağlılığın tayin ve tespiti">
      <mvz-fıkra no="1">
        <template>Göçmen olarak kabul edilecekler bakımından Türk soyundan olmanın ve Türk kültürüne bağlılığın tayin ve tespiti Cumhurbaşkanı kararı ile yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Geçici barındırma, göçmen belgesi verilmesi ve vatandaşlığa kabul">
      <mvz-fıkra no="1">
        <template>5 inci ve 6 ncı maddeler uyarınca yurda toplu olarak kabul olunan göçmenler, sınırlarımızdan girdikten sonra giriş noktalarındaki göçmen kabul merkezlerinde sağlık, gümrük, idari ve nakil işlemleri tamamlanıncaya kadar misafir edilirler. Bu süre içinde bakım, beslenme ve barınma ihtiyaçları Kızılay Derneğinin de yardımlarıyla İçişleri Bakanlığınca karşılıksız sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu giderler için Maliye Bakanlığınca ivedilikle ödenek aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Özel kanunlarla yurdumuza getirilen iskânlı göçmenler, sınırlarımızdan yurda girdikten sonra geçici veya kesin iskânları için belirlenen yerlerin, serbest göçmenler ise yerleştikleri yerlerin en büyük mülki amirine müracaatla kendileri ve aile fertleri için "Vatandaşlığa Girme Beyannamesi"ni imzalayarak "Göçmen Belgesi" almaya mecburdur. Göçmen Belgesi, iki yıl için geçerli olup, geçici kimlik belgesi olarak kullanılır. Bu belgede, göçmenin bu Kanunun hangi maddesi uyarınca yurda kabul edildiği belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Göçmen olarak kabul edilenler, gerekli işlemlerin ilgili kuruluşlarca tamamlanmasından sonra Cumhurbaşkanı kararıyla vatandaşlığa alınırlar. Küçükler; baba ve analarına, baba veya anaları yoksa kan ve kayın hısımlarına bağlı tutulurlar. Kimsesiz gelen küçükler, yaşlarına bakılmaksızın vatandaşlığa alınırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>4 üncü maddede sayılan engellerden herhangi birini taşıdığı yurda girdikten sonra tespit edilen şahısların, göçmenlik işlemleri iptal edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="İskân Esasları">
    <mvz-madde no="9" başlık="İskân yardımları">
      <mvz-fıkra no="1">
        <template>Göçmen, göçebe, yerleri kamulaştırılanlar ve millî güvenlik nedeniyle yerlerinin değiştirilmesine karar verilenlerin iskânı; şehir, kasaba ve köylerde, Bakanlıkça hazırlanacak plan ve projesine uygun olarak;</template>
        <mvz-bent no="a">
          <template>Öncelikle konut ve arsası,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Esnaf, sanatkâr ve tüccarlara, geçimlerini sağlayacak işyeri ve arsası ile işletme kredisi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Çiftçilere tarımsal projesinde öngörülen arazi, gerekli tarımsal girdiler, tarımsal yapılar veya arsası ile aynî ve nakdî işletme ve donatım kredileri,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Hak sahiplerinin talepleri halinde, konut, işyeri ve tarım arazisi kendileri tarafından bulunarak teklif edilmesi ve Bakanlıkça uygun görülmesi halinde toplu veya münferit olarak ailelere iskân kredileri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>verilmek suretiyle bu Kanun hükümlerine göre borçlandırma yoluyla yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tarımsal iskân projesinde öngörülen yıllık işletme ve donatım kredilerini, tarım arazilerinin devrinden sonraki iki yıl içinde istemeyen ailelere bu krediler kullandırılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanun uyarınca yurda kabul edilen göçmenlerin, gümrükten muaf kullanılmış eşyalarıyla birlikte sınırlarımızdan girişlerinden itibaren; yerleri kamulaştırılanlarla, millî güvenlik nedeniyle iskân edilenlere ve göçebelere yeni iskân alanına nakledilmeye başladıkları tarihten itibaren barındırma, yiyecek, yakacak ve tedavi yardımları ile bunlardan muhtaç durumda olanlara bir defaya mahsus olmak üzere giyecek yardımları ve ayrıca yerleri kamulaştırılanlara geçici iskân için karşılıksız yardımlar yönetmelikte belirtilen süre, miktar ve şartlara göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yukarıda sayılanların yeni iskân alanına nakilleri, hazırlanacak nakil projesine göre Devlet tarafından karşılıksız olarak sağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="İskânlı göçmenlerin iskânı">
      <mvz-fıkra no="1">
        <template>Yurda kabul edilen iskânlı göçmenler, şartların elverdiği yerlerde Bakanlıkça bu Kanun hükümlerine göre iskân olunurlar. Ancak, Türkiye'ye geldikleri tarihten itibaren iki yıl içinde iskânını istemeyen göçmenler, Bakanlıkça iskân edilemezler ve yapılmakta olan karşılıksız yardımlar kesilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Göçebelerin iskânı">
      <mvz-fıkra no="1">
        <template>Göçebeler, İçişleri Bakanlığı ile gerektiğinde diğer ilgili kamu kurum ve kuruluşlarının da görüşleri alınmak suretiyle Bakanlıkça uygun görülecek yerlere bu Kanun hükümlerine göre iskân edilirler. Ancak, iskân duyurusu tarihinin bitiminden sonra yüzseksen gün içinde müracaat etmeyen aileler iskân edilemezler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Yerleri kamulaştırılanların iskânı">
      <mvz-fıkra no="1">
        <template>Kamu kurum ve kuruluşlarınca yapılacak baraj, baraj mücavir alanı, koruma alanı, havaalanı, karayolu, demiryolu, fabrika, ekonomi ve savunma ile ilgili diğer tesislerin inşası, tarih ve tabiat kıymetlerinin korunması gibi amaçlar için veya özel kanunların uygulanması sebebiyle;</template>
        <mvz-bent no="a">
          <template>Taşınmaz mallarının kısmen veya tamamen kamulaştırılması sonucu yerlerini terk etmek zorunda kalan aileler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yapılan iskân planlama etütlerinin başladığı takvim yılı başlangıcından en az üç yıl önce kamulaştırma sahasında yerleşmiş olup da taşınmaz malı olmayan aileler,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>talep ettikleri takdirde Bakanlıkça gösterilecek yerlerde bu Kanun hükümlerine göre iskân edilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ancak, iskân planlama etütlerinin başladığı tarihten önce yerini terk etmiş olup kamulaştırılacak taşınmaz malı bulunan aileler iskân edilmezler. Bu tarihten geriye doğru üç yıl içerisinde, taşınmaz mallarını zorunlu hal olmadan ellerinden çıkaran ve yerine eşdeğerde veya daha fazla değerde taşınmaz mal almayan aileler yerlerini terk etmemiş olsalar dahi iskân edilmezler. Zorunlu haller yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kamu kurum ve kuruluşlarınca kamulaştırılan alanlarda yerleşik olan ve kamulaştırmadan etkilenen ailelerden Devlet eliyle başka yerde iskânını istemeyenler, yazılı başvuruları üzerine, ilgili valiliğin teklifi ve İçişleri Bakanlığının olumlu görüşü alınmak şartıyla Bakanlıkça kendi köy hudutları içinde gösterilecek bir yerde iskân edilebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu madde kapsamına giren ve Devlet eliyle iskânlarını isteyen ailelerden; iskân duyurusu tarihinin bitiminden sonra doksan gün içinde müracaat etmeyenler ile aldıkları veya alacakları kamulaştırma bedelinin, Bakanlıkça belirlenen miktarını; kamulaştırma bedelinin Bakanlıkça belirlenen miktardan az olması halinde ise kamulaştırma ve tezyidi bedellerinin tamamını, Bakanlık Merkez Muhasebe Birimi Hesabına yatırmayı taahhüt etmeyenler iskân edilmezler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Millî güvenlik nedeniyle iskân" durum="iptal">
    </mvz-madde>
    <mvz-madde no="14" başlık="Gösterilen yerde iskânı kabul etmeyenler">
      <mvz-fıkra no="1">
        <template>10, 11, 12 ve 13 üncü maddeler kapsamına giren hak sahibi ailelerin, Bakanlığın gösterdiği yerlerde iskân edilmeyi kabul etmemeleri halinde hak sahiplilik durumları Mahalli İskân Komisyonunca iptal edilir. Bu durumdaki aileler ikinci bir iskân talebinde bulunamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="İskân duyurusu">
      <mvz-fıkra no="1">
        <template>11, 12 ve 13 üncü maddeler uyarınca iskân edileceklere, iskân şekli ve şartları bağlı bulundukları köy, kasaba veya ilçe merkezlerinde duyurulur. İskân duyurusu ve bu duyuru üzerine yapılacak müracaatların usûl ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Fiziksel Yerleşim Düzenlenmesi">
    <mvz-madde no="16" başlık="Fiziksel yerleşim">
      <mvz-fıkra no="1">
        <template>Kırsal alanda fiziksel yerleşimin düzenlenmesi amacıyla;</template>
        <mvz-bent no="a">
          <template>Yerleşim yerinin elverişsizliği sebebiyle yerinde kalkındırılmasına imkân olmayan köyler ile altyapı hizmetlerinin pahalıya mal olacağı tespit edilen yerleşim birimlerinin daha elverişli bir yerleşim yerine nakledilmesi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Birden fazla istekli köy veya bir köy hudutları içinde kalan mahalle, kom, mezra ve benzeri dağınık yerleşim ünitelerinin mevcut yerleşim ünitelerinden birinde veya yeni bir yerleşim yerinde toplulaştırılması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Afet nedeniyle parçalanmış köylerde, afete maruz kalmayan ailelerin talepleri halinde yeni yerleşim yerine ekleme yapılması,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Nakli, toplulaştırılması ve fiziksel yerleşim iyileştirilmesi yapılacak köylerin imar planlarının yapılması, onaylanması ve bu planlara uyulmasının sağlanması, ayrıca onaylanmış köy imar planlarına göre ayrılan alanlardan istekli hak sahiplerine arsa satılması,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Çevrenin iklimine, sosyal ve ekonomik şartlarına, yapı malzemesi imkânlarına uygun nitelikte konut, tarımsal işletme binaları ve sosyal tesislerin tiplerinin ve uygun yerleşim modellerinin araştırılması, teknik yardım niteliğindeki tip projelerin hazırlanarak istekli köy veya köylülere verilmesi, gerektiği hallerde köylerde sosyal, kültürel, idari, ekonomik yapı ve tesisler ile köy içi altyapılarının yapılması,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Nakil, toplulaştırma ve fiziksel yerleşim iyileştirilmesi uygulamaları tamamlanan köylerde, daha sonraki yıllarda rezerv arsalardan satın alan ailelere, kendi evini yapana yardım metodu ile kredi açılması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>hizmetleri, imar mevzuatına uyularak hazırlanacak plan ve projelere göre yapılır veya yaptırılır. Gerektiğinde, yönetmelikte belirtilen esas ve usûller dahilinde hak sahibi ailelere borçlanmaya tâbi olmak kaydıyla konut ve işletme binası için nakdi kredi açılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ancak, birinci fıkranın (a) ve (b) bentlerindeki hizmetlerin yapılabilmesi için köy seçmen listesinde kayıtlı olanların yarıdan bir fazlasının, o yerin en büyük mülki amirliğine yazılı müracaatı esastır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="İskânda Aile, İskân Komisyonları ve İskân Tedbirleri">
    <mvz-madde no="17" başlık="İskânda aile kabul edilecekler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında aile bir bütün olarak kabul edilir ve aşağıda sıralananlar aile sayılır.</template>
        <mvz-bent no="a">
          <template>Karı ile koca,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Evlenmemiş çocuklar, ana ve baba ile veya bunlardan sağ olanı ile birlikte,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Evli çocuklar, evli torunlar ile çocuksuz erkek ve kadın dullar başlı başına,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Anasız ve babasız bekâr kardeş çocuklar birlikte ve eşit hisselerle; bekâr kardeşi olmayan ya da tek kalan çocuklar başlı başına,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>bir aile olarak iskân edilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Komisyonlar">
      <mvz-fıkra no="1">
        <template>Bakanlıkça ihtiyaç duyulması halinde, Bakanın veya görevlendireceği kişinin başkanlığında, gerekli görülecek diğer bakanlık ve kuruluşların temsilcilerinden oluşan bir Merkezi İskân Komisyonu kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu komisyon, göçebelerin, göçmenlerin, yerleri kamulaştırılanların ve millî güvenlik nedeniyle iskân edilecek ailelerin ekonomik, sosyal ve sağlık şartlarına göre yerleştirilecekleri yerleri ve iskân programlarını tetkik etmek, iskâna yarayacak taşınmaz malları araştırıp bulmak, iskân ödeneklerini sağlamak ve harcanmasını kararlaştırmak, iskân konusunda görevli bakanlık ve kuruluşlarla işbirliği yapmak gibi görevleri yerine getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanun hükümlerine göre iskân edilecekleri tespite ve taşınmaz mal tahsisine mahallin en büyük mülki amirinin veya görevlendireceği kişinin başkanlığında; bayındırlık ve iskân, tapu, maliye, tarım ve gerektiğinde ihtiyaç duyulacak konularda hizmet veren kamu kurum ve kuruluşlarının görevlilerinden teşekkül edecek Mahalli İskân Komisyonu yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu komisyonlar, eldeki bilgi ve belgelere göre iskân edileceklerin hak sahibi olup olmadıklarına dair karar alırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddede belirtilen komisyonların çalışma usûl ve esasları, Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Temlik ve tescil">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre verilen taşınmaz malların temlikine, vali ve kaymakamlar yetkilidir. Dağıtım defter veya kararlarının vali veya kaymakamlarca onanması, temliktir. Onaylı defter veya kararlardaki miktarlar geçerlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Verilen taşınmaz mallar, temlik tarihinde yaşayan aile fertleri adına eşit hisselerle temlik ve tapuya tescil ettirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Mülkiyete ve bedele ilişkin ihtilaflar">
      <mvz-fıkra no="1">
        <template>Temlik edilmiş olan taşınmaz mallar mülkiyetine ilişkin olarak açılacak davalarda, davalı yeni malik ile birlikte tapudaki tescil durumuna göre Hazinedir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Temlik tarihinden itibaren bir yıl geçtikten sonra malın kendisine ait olduğunu iddia edenler tarafından, el koyma tarihindeki rayiç bedel üzerinden dava açılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Devir, takyit ve geri alma">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre verilen taşınmaz mallar, temlik tarihinden itibaren borcun tamamı ödenmeden önce hiçbir suretle satılamaz, bağışlanamaz, rehin edilemez, tapu kütüğüne satış vaadi şerhi konulamaz ve haczolunamaz. Bu taşınmazların tapu kütüklerinin beyanlar hanesine bu yönde belirtme yapılır. Ancak, temlik tarihinden itibaren beşinci yılın sonunda başlamak üzere, borçlandırma bedelinin tamamını ödeyenlerin tapu kaydına yapılan belirtme kaldırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanuna göre hak sahiplerine verilen taşınmazların takyit süresi içinde belgelendirilmiş olmak koşuluyla ticari faaliyet dahil geçim imkanının temini, eğitim, yurt dışına çıkış, askerlik, tutukluluk, afet ve uzun hastalık gibi geçerli bir özrü olmaksızın kullanılmadığı, bağışlandığı veya satıldığı tespit olunduğunda, Mahalli İskân Komisyonunca hak sahiplilik durumu iptal edilir, iskân amaçlarında kullanılmak üzere tapu kaydının iptali ile Hazine adına tescili mahkemeden istenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Taşınmazların fuzuli işgalden korunması">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanması amacıyla sağlanan veya hak sahiplerine verilecek yapılar, arsa ve araziler; kimin işgali altında olursa olsun o yerin en büyük mülki amirinin yazılı emirleriyle kolluk kuvvetlerince boşaltılır ve kendilerine teslim olunur. Bunlara vuku bulacak tecavüzlerde de o yerin en büyük mülki amirleri kolluk kuvvetlerini kullanarak tahliyeye yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="İskân işlerinin yürütülmesi">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine uygun olarak iskân edilenlerin istihkaklarının eksiksiz olarak vaktinde dağıtılıp teslim olunmasına ve üretici hale getirilmesine ait işler ile diğer iskân işleri Bakanlığın mahalli teşkilatınca yürütülür. Bakanlığa ait personel, araç ve gerecin yetersiz olduğu yerlerdeki vali ve kaymakamlar; kendi il ve ilçelerindeki yargı organları hariç, Devlet memurları, özel idare ve belediye personeli ile araç ve gereçlerden uygun gördüklerini, iskân olunanları yerleştirmek, bunlara verilecek yerleri ölçmek, dağıtmak ve inşaatları kontrol etmek gibi iskân ve nakil işlerinde görevlendirmeye yetkilidir. Görevlendirilen personel öncelikle bu işleri yapmaya zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Zaruri durumlarda Genelkurmay Başkanlığından izin alınmak kaydıyla yukarıda belirtilen hizmetlerde Silahlı Kuvvetler personelinden de yararlanılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Proje kredisi">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre iskân edilenlerin tespit edilecek hayat seviyesine kavuşabilmeleri için geliştirme, yan gelir temini gibi tedbirler, Bakanlık ile diğer ilgili kurum ve kuruluşlarca ortaklaşa hazırlanacak plan ve projelere göre yürütülür. Bu projelerde yer alan tarım araç ve gereçleri, iskânlı ailelerin kooperatif kurmaları şartıyla kullandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hayat seviyesinin tespitinde, kredi verilmesinde ve bu kredilerin yerinde kullanılmaması halinde uygulanacak usûl ve esaslar yönetmelikte belirtilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Malî Hükümler">
    <mvz-madde no="25" başlık="Gelirler">
      <mvz-fıkra no="1">
        <template>İskâna ilişkin olarak;</template>
        <mvz-bent no="a">
          <template>Resmî ve özel, yerli ve yabancı kurumlar ile şahıslar ve milletlerarası göçmen ve mülteci teşkilatları tarafından yapılacak maddi yardımlarla nakde çevrilecek yardımlar,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yabancı devletlerden göçmenler için alınacak tazminatlar,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İskân amaçlı alınmış, tahsis edilmiş veya inşa sonrası elde edilmiş ancak çeşitli nedenlerle hak sahiplerine devredilememiş taşınmaz malların ihale usûllerine göre satışından elde edilen gelirler,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Hak sahiplerine yapılan arsa satışlarından sağlanan gelirler,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kamulaştırma bedelleri ile tezyidi bedel davaları sonucunda alınan paralar,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Geri ödeme tahsilatlarından sağlanan gelirler,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Diğer hibe, yardım ve gelirler,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>genel bütçeye gelir kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Giderler">
      <mvz-fıkra no="1">
        <template>İskâna ilişkin giderler;</template>
        <mvz-bent no="a">
          <template>Arazi ve arsa satın alma veya kamulaştırma bedellerini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Borçlandırmaya tâbi bilumum tesis ve inşaat harcamalarını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kredi ödemelerini,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Barındırma giderlerini,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bu Kanunun 9 uncu maddesine göre yapılacak karşılıksız yardım giderlerini,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İskân hizmetlerinin gerektirdiği taşınır ile taşınmaz mal kiralanması ve satın alınması giderlerini,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İskân hizmetleri için etüt, plan, proje, harita ve araştırma yapma, yaptırma giderlerini,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Bu Kanun kapsamında yapılacak her türlü bina, tesis ve donatıları ile altyapı yapım giderlerini,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Kamulaştırma bedellerinin iadesine ilişkin giderleri,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kırtasiye, yayın, büro malzemeleri, haberleşme, ilan, sigorta, mahkeme, noter giderlerini,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>İskân hizmetlerinin gerektirdiği diğer giderleri,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>İskân hizmetleriyle ilgili olarak kamu kurum ve kuruluşlarına yaptırılacak işlerin bedellerini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İskâna ilişkin giderler Bakanlık bütçesine bu amaçla konulacak ödeneklerle karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Borçlandırma, teminat ve vadesinde ödenmeyen borçlar">
      <mvz-fıkra no="1">
        <template>İskân ve fiziksel yerleşim düzenlemelerinde hak sahipleri; kendilerine verilen taşınmazlardan dolayı, kamulaştırılan ve satın alınan taşınmaz mallar için kamulaştırma veya satın alma bedelleri, yapılar için maliyet bedelleri, Hazine arazileri için rayiç bedelleri üzerinden borçlandırılırlar. Ancak, iskân amacıyla kamulaştırılmış, satın alınmış, inşa edilmiş olup, çeşitli nedenlerle tahsisleri bir yıl içinde yapılmamış taşınmaz mallar yeniden iskân uygulamasına alındığı takdirde, yeni hak sahipleri bu taşınmaz malların rayiç bedelleri üzerinden borçlandırılırlar.  Bu Kanunun 10 uncu, 11 inci ve 12 nci maddeleri kapsamına giren hak sahibi ailelerden sözleşme aşamasında borcunu peşin olarak ödemek isteyenlere borçlandırma bedeli üzerinden yüzde altmış beş oranında indirim yapılır. Ödemesiz süre içerisindeki işlerde ise borçlandırma bedeli üzerinden yapılacak peşin ödeme indirim oranları yönetmelikte belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Borçlandırma muameleleri, aile fertleri veya kendi başlarına iskân edilenlerin adına yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Taşınmaz mallara ait borçlandırma bedelleri faizsiz olarak tahsil olunur. Bu Kanun uyarınca açılacak işletme ve donatım kredileri ile fiziksel yerleşimi düzenleme amacıyla yapılacak taksitli arsa satışları ve aileye verilen konut ve işletme binası kredileri faize tâbidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Taşınmaz malların borçlandırılmasında ödemesiz süre ve vade, açılacak kredilerin ve arsa borçlarının faiz nispeti ve vadeleri ile borçlandırma ve kredilendirmeye ait diğer hususlar yönetmelikte belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5" durum="iptal">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanun hükümlerine göre borçlandırma suretiyle yapılan iskân yardımlarının tamamı için, verilecek taşınmaz mallarda Hazine lehine birinci derecede ve birinci sırada ipotek tesis edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Erteleme sebepleri dışında kalıp da muaccel hale gelen alacaklar, Bakanlıkça millî bir bankayla yapılacak protokol çerçevesinde takip ve tahsil olunur. Erteleme sebepleri yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Borçlunun haczedilebilir taşınır malı bulunmadığı veya borcuna yetmediği takdirde, borcun tamamı muacceliyet kesbeder ve bu Kanuna göre verilen veya kredi açmak suretiyle sağlanan taşınmaz malların tapu kayıtları mahkeme kararıyla Hazine adına tashihen tescil edilir ve bu taşınmaz malların iade işlemleri 29 uncu madde hükümlerine göre yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>İskân edilen ailelere verilen taşınmaz mallar, gerek idarenin ve gerekse iskân edilen ailelerin istek ve rızaları dışında geri alındığı takdirde, geri alınmadan dolayı eksilen istihkaklarının karşılanması maksadı ile yapılacak kamulaştırma ve satın alınmadan doğan ilave bedeller geri verilecek paralar tertibinden karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Borçlandırmadan tenkis edilecek değerler">
      <mvz-fıkra no="1">
        <template>Bakanlık Merkez Muhasebe Birimi Hesabına yatırılmış kamulaştırma bedelleri, borçlandırma bedellerinden düşülür; fazlası iade edilir; eksik kaldığı takdirde bu Kanun hükümlerine göre ilgililer borçlandırılır. Yatırılmış kamulaştırma bedelleri, borçlandırma ve/veya iade tarihi itibariyle güncelleştirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Verilen taşınmaz malların geri alınmasında iade işlemleri">
      <mvz-fıkra no="1">
        <template>Mahkeme kararı ile taşınmaz malların geri alınması halinde, evvelce ödenen taksitler veya zaruri ve faydalı giderler, geri verilecek paralar tertibinden iade edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Borçlandırmasız hizmetler, harcamalar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasına ilişkin olarak yapılacak; karşılıksız iskân yardımları, altyapı tesisleri, sosyal, kültürel, idari, ekonomik ve diğer tesisler, imar planları ve teknik yardım niteliğindeki tip projeler karşılıksız olarak yapılır veya yaptırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Sari taahhüt yetkisi">
      <mvz-fıkra no="1">
        <template>Ödemesi yapılacak proje, inşaat ve benzeri hizmetler için, her yıl ödenecek miktarı yılı ödenek tutarının yüzde ellisini geçmemek şartıyla beş yıla kadar gelecek yıllara sari taahhüde Bakan yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="32" başlık="Kamulaştırma bedelleri">
      <mvz-fıkra no="1">
        <template>12 nci maddede belirtilen nedenlerle veya özel kanunlar gereğince taşınmaz malları kamulaştırılanlardan iskânını isteyenlerin kamulaştırma bedelleri ile tezyidi bedel davası sonucu alacakları paralar, kamulaştırmayı yapan kuruluşça bu taşınmaz mallarla ilgili her türlü vergi, resim ve harçlar kesildikten sonra, Bakanlıkça tespit edilen miktar veya kamulaştırma bedeli ve tezyidi bedel kadar iskân edilecekler adına Bakanlık Merkez Muhasebe Birimi Hesabına yatırılır. Vergi, resim ve harçlar ise kamulaştırmayı yapan ilgili kuruluşlara ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İskân hakkı doğan aynı aile fertlerinin ayrı ayrı kamulaştırma bedeli alacağının olması halinde ve aile fertlerinin tamamı iskân istedikleri takdirde, ilgili kuruluşça bunlara ait kamulaştırma bedelleri toplu halde Bakanlık Merkez Muhasebe Birimi Hesabına yatırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="Kamulaştırmayı yapan kuruluş bütçesine gerekli iskân ödeneğinin konması">
      <mvz-fıkra no="1">
        <template>12 nci madde kapsamına giren ailelerin iskânı için ana projeyi yürüten kuruluşun bütçesinde yeniden yerleşimi de kapsayacak şekilde gerekli ödenekler ile 13 üncü madde uyarınca iskânı yapılacaklar için gerekli iskân ödeneği ve kamulaştırılacak taşınmaz malların kamulaştırma ödenekleri, Bakanlığın görüşü alınmak suretiyle kamulaştırmayı yapacak kuruluşlar tarafından Bakanlık bütçesine transfer edilmek üzere bu kuruluşların kendi bütçelerine konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Muafiyetler">
    <mvz-madde no="34" başlık="Gümrük muafiyetlerinden yararlanma">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre kabul edilen göçmenlerin, bir aile veya aile sayılan kişiler ile bir köy, mahalle veya topluluk olarak yurda getirecekleri kullanılmış zati, mesleki ve ev eşyaları bir defaya mahsus olmak üzere gümrük vergileri ile damga vergisinden ve diğer her türlü resim, vergi ve harçlardan muaftır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Muamelelerle ilgili muafiyetler">
      <mvz-fıkra no="1">
        <template>Göçmenlerin pasaportları üzerinde yapılacak vize muamelesi ile kendilerine verilecek eşya belgeleri her türlü resim ve harçtan muaftır. Göçmen, göçebe, millî güvenlik nedeniyle ve kamulaştırmadan etkilenen ailelerden iskân edilenlere bu Kanun hükümleri gereğince yapılacak iskân yardımı gümrük ve vergi muafiyeti, tabiiyet, nüfusa ve tapuya tescil ve nakil işlemleri dolayısıyla gerek kendileri tarafından verilecek gerekse ilgili dairelerce düzenlenecek her türlü evrak damga vergisi ile sair resim ve harçlardan muaftır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="İskân yoluyla verilen taşınmaz malların vergilerden muafiyeti">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre temlik edilen arsa, arazi ve yapılardan bu temlik dolayısıyla veraset ve intikal vergisi ve ferağ harcı alınmaz; noterlerce yapılacak iskân ile ilgili taahhütname ve borçlanma senetleri ve bu konuda düzenlenen belgeler damga vergisi ve harca tâbi değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanuna göre, gerek borçlandırılarak ve gerekse peşin bedelli olarak verilen bütün arsa, arazi ve yapılar harçsız tapuya tescil edilerek tapu senedi verilir. Temlik, tefviz, borçlandırma ve ipotek işlemleri koyup kaldırma muameleleri, damga vergisi ve harca tâbi tutulmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İskân hizmetlerine ilişkin her türlü tapu ve kadastro işlemlerinden döner sermaye hizmet bedeli alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanun hükümlerine göre yapılacak yapılara ilişkin ruhsat ve izinler, 26/5/1981 tarihli ve 2464 sayılı Belediye Gelirleri Kanununa göre alınan bina inşaat harcı ve imarla ilgili harçlardan müstesnadır. Ayrıca, bu yapılara ilişkin belediyece ve il özel idaresince verilen hizmetlerden ücret alınmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Askerlik muafiyeti">
      <mvz-fıkra no="1">
        <template>Göçmenlerin askerlikle ilgili muafiyetleri ve bu muafiyetlerden yararlanma usûlleri, 21/6/1927 tarihli ve 1111 sayılı Askerlik Kanunundaki esaslara göre yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Çeşitli Hükümler">
    <mvz-madde no="38" başlık="Tahsis, devir ve temlik edilecek arazi ve arsalar">
      <mvz-fıkra no="1">
        <template>Özel kanunlarda yazılı hükümler saklı kalmak kaydıyla bu Kanun uygulamalarında kullanılabilecek arsa ve araziler aşağıda belirtilmiştir:</template>
        <mvz-bent no="a">
          <template>Devletin hüküm ve tasarrufu altında bulunan araziler.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Devletin özel mülkiyetinde bulunup da kamu hizmetlerine tahsis olunmamış ve kullanılmayan arazi ve arsalar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bir veya birkaç köy, kasaba ve şehir orta malı olan ve tahsis amacı değiştirilmek suretiyle Hazine adına tescil ettirilen araziler.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Hazineden bedelsiz olarak belediyelere devredilmiş ve maksada tahsis edilmemiş olup 20/7/1966 tarihli ve 775 sayılı Gecekondu Kanunu amaçları dışında kalan yerler.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İşlenmeye elverişli olmayan tuzlu, alkali, taşlık ve benzeri topraklardan Devletçe ıslah suretiyle elde edilen araziler.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bakanlık tarafından gerçek ve tüzel kişilerden satın alınacak veya kamulaştırılacak arsa ve araziler.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Köy tüzel kişiliğine ait arazi ve arsalar.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(a), (b), (c) ve (d) bentlerinde belirtilen arsa ve araziler Maliye Bakanlığınca bu amaçla kullanılmak üzere tahsis edildikten sonra; (ç), (e), (f) bentlerinde belirtilen arsa ve araziler ise işlemleri sonuçlandıktan sonra iskân hizmetlerinde kullanılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="39" başlık="Köy tüzel kişiliğine ait arsa ve araziler">
      <mvz-fıkra no="1">
        <template>Köy tüzel kişiliğine ait arsa ve araziler, köy ihtiyar heyetince karar verildiği takdirde bu Kanun kapsamında kullanılabilir. Bu tür arsa ve arazilerin kıymet takdiri köy ihtiyar heyetince yapılır, arsa ve arazinin hak sahiplerine satışından elde edilen para köy bütçesine gelir kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="40" başlık="Seçilemeyecek arsa ve araziler">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında kullanılacak arsa ve araziler, özel kanun hükümleri ve millî güvenlik nedeniyle tahsis edilmiş veya 18/12/1981 tarihli ve 2565 sayılı Askeri Yasak Bölgeler ve Güvenlik Bölgeleri Kanunu hükümlerine göre tesis edilecek askeri yasak bölgeler ve güvenlik bölgeleri sınırları kapsamında kalan yerlerden seçilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak zorunlu hallerde söz konusu arsa ve araziler ilgili kurumların uygun görüşü doğrultusunda kullanılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41" başlık="Ortak tesis ve yapıların tescili">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümleri uyarınca karşılıksız yapılan ortak tesis ve yapılar, kullanış amacına göre ilgili tüzel kişilik adına tapuya tescil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu ortak yapı ve tesislerin korunması, bakım ve onarımı ile amacına uygun olarak kullanılmasından, adına tescil işlemi yapılan tüzel kişilik sorumludur. Belirtilen hususların yerine getirilip getirilmediği, mülki amirlerince kontrol edilir ve gerekli tedbirler alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Gönüllü katkı">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulamasına ilişkin hizmetlerin hızlandırılabilmesi için iskâna tâbi kimselerin gönüllü katkılarından yararlanılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="Devir ve intikal eden hükümler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesinden önce iskân uygulamaları tamamlanmış olan aileler ile taahhütname verenlerden işlemleri devam edenlerin hak ve mükellefiyetleri saklı olup bu konuda ortaya çıkacak ihtilaflar, bu Kanundan önceki mevzuata göre çözümlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Tahsil imkânsızlığı sebebiyle terkin">
      <mvz-fıkra no="1">
        <template>Yapılacak takip sonunda tahsili imkânsız veya tahsili için yapılacak giderlerin alacaktan fazla olacağı anlaşılan sözleşmeye bağlanmış alacaklar ile gerçek ve tüzel kişilerden olan alacaklardan 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 106 ncı maddesindeki parasal miktara kadar olanları terkin etmeye Bakan yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="45" başlık="Bütçeye ödenek konulması">
      <mvz-fıkra no="1">
        <template>Bu Kanunda yazılı görevlerin gerektirdiği etüt, araştırma, planlama, projeleme ve uygulama işleri Bakanlıkça yapılır veya yaptırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İskân işleriyle ilgili teknik ve idari personel, hizmet içi eğitim yapılacak kamu yapı ve tesisleri giderleri, Bakanlık bütçesine konulacak ödeneklerden karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="46" başlık="Yeni yerleşim yerinde ilgili kurum ve kuruluşlarca yapılacak hizmetler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 10, 11, 12 ve 13 üncü maddeleri gereğince yapılacak iskânlarda elektrik, okul, sağlık evi ve benzeri tesisler ile altyapı hizmetleri ilgili kurum ve kuruluşların görüşleri doğrultusunda Bakanlıkça yapılır veya yaptırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="47" başlık="Yönetmelik düzenleme yetkisi">
      <mvz-fıkra no="1">
        <template>Bu Kanunla, yönetmelikle düzenlenmesi öngörülen hususlar ile bu Kanunun uygulanmasına ait diğer düzenlemeler, ilgili bakanlık ve kuruluşların da görüşleri alınarak Bakanlıkça düzenlenecek ve altı ay içerisinde çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="48" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>15/5/1959 tarihli ve 7269 sayılı Umumi Hayata Müessir Afetler Dolayısiyle Alınacak Tedbirlerle Yapılacak Yardımlara Dair Kanunun ek 7 nci maddesi ile 14/6/1934 tarihli ve 2510 sayılı İskân Kanunu ek ve değişiklikleri ile birlikte yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="EK">
      <mvz-fıkra no="1">
        <template>Afet riski veya fen, sanat ve sağlık kurallarına aykırılık sebebiyle veya Cumhurbaşkanınca belirlenen özel proje alanlarında gerçekleştirilecek olan yeniden iskân uygulamalarında, buralardaki yerleşim merkezlerinde yaşayan ailelerin daha elverişli yerlerde iskânları ile köye dönüş projeleri çerçevesindeki iskân çalışmaları; ilgili proje için alınan Cumhurbaşkanı kararında belirtilen hak sahipliği ve borçlandırma usul ve esaslarına göre, Cumhurbaşkanınca tespit edilen orman veya mera vasıflı alanlardan ve Hazinenin özel mülkiyetinde veya Devletin hüküm ve tasarrufu altında bulunan taşınmazlardan uygun görülen yeni yerleşim yerlerinde, bu Kanun hükümlerine göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde kapsamındaki uygulamalara ilişkin talebin diğer kamu kurum veya kuruluşlarından gelmesi hâlinde, altyapı hizmetleri de dâhil olmak üzere yeniden yerleşim için gerekli görülen her türlü ödenek, Bakanlığın görüşü alınarak ana projeyi yürüten kuruluşun bütçesine konulur ve ihtiyaç duyulan ödenek, Bakanlık bütçesine ilgili kuruluş tarafından transfer edilir. Afet riski altındaki alanların dönüştürülmesi hizmetleri için kanun ile öngörülen dönüşüm projeleri özel hesabından bu madde kapsamındaki uygulamalarda kullanılmak üzere kaynak aktarılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="EK">
      <mvz-fıkra no="1">
        <template>Devlet Su İşleri Genel Müdürlüğü tarafından yapılmakta ve yapılacak olan baraj ile baraj mücavir alanında kalan taşınmazların kısmen veya tamamen kamulaştırılması sonucunda yerlerini terk etmek zorunda kalanların iskânına ilişkin olarak bu Kanunla ve ilgili diğer mevzuatla Bakanlığa verilen her türlü hak, görev ve yetkiler, Devlet Su İşleri Genel Müdürlüğü tarafından gerçekleştirilir. Bu madde kapsamında yapılacak iskân ile ilgili usul ve esaslar Cumhurbaşkanı kararı ile belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamındaki hak, yetki ve görevlerin Devlet Su İşleri Genel Müdürlüğü tarafından gerçekleştirilebilmesi maksadıyla, bu Kanunun hükümlerine göre kullanılabilecek arazi ve arsalardan gerekli olanlar birinci fıkra kapsamında kalan iskân faaliyetleri maksadıyla kullanılmak üzere tapuda Devlet Su İşleri Genel Müdürlüğü adına tescil edilir. Aynı maksatla kullanılmak üzere ihtiyaç duyulan ve talep edilen Hazinenin özel mülkiyetinde veya Devletin hüküm ve tasarrufu altında bulunan taşınmazlardan Maliye Bakanlığınca uygun görülenler tapuda Devlet Su İşleri Genel Müdürlüğü adına bedelsiz olarak devren tescil edilir, ancak bunlardan iskân faaliyetleri için ihtiyaç duyulmayan veya kullanılmayanlar Maliye Bakanlığının talebi üzerine tapuda yeniden bedelsiz olarak devren Hazine adına tescil edilir. Bu fıkra kapsamında yapılacak her türlü devir, temlik, tevhid, ifraz, tescil, terkin ve sair işlemleri tapu sicilinde yapmaya Devlet Su İşleri Genel Müdürlüğü yetkilidir. Bu madde kapsamında iskân faaliyetinde kullanılmak üzere 19/4/2012 tarihli ve 6292 sayılı Orman Köylülerinin Kalkınmalarının Desteklenmesi ve Hazine Adına Orman Sınırları Dışına Çıkarılan Yerlerin Değerlendirilmesi ile Hazineye Ait Tarım Arazilerinin Satışı Hakkında Kanunun 4 üncü maddesi uyarınca orman sınırları dışına çıkarılacak alanlar tapuda Devlet Su İşleri Genel Müdürlüğü adına resen tescil edilerek devredilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin yürürlük tarihinden önce bu Kanuna göre iskân duyurusu yapılmış projeler Bakanlıkça yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Cumhurbaşkanı, Bulgaristan'dan zorunlu göçe tâbi tutulup, Türkiye'ye gelerek yerleşmek isteyen Türk soylu kişilerle ilgili olarak bu Kanun çerçevesinde yapılacak işlemler ile alınacak kararların genel koordinasyonu ve bu kişiler için yapılan veya yapılacak konutların proje, yapım, kontrol ve hak sahibi seçimi, tahsis ve dağıtımı, kişiler adına temlik ve tapuda tescili ile borçlandırma konularında Toplu Konut İdaresi Başkanını görevlendirebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun uyarınca hak sahibine tahsis edilmiş olan konutun, takyit süresi içerisinde; işyeri, ticarethane ve sair biçimde amacı dışında kullanılması ya da satış vaadi şerhi konulması, devredilmesi, satılması veya terhin edilmesi hallerinden birinin ya da birkaçının valiliklerce tespit edilmesi üzerine ya da konut bedelinin geri ödenmesine ilişkin borçlanma taksitlerinin yatırılmamış olması gibi hallerde, söz konusu taşınmazın, aynı durumdaki göçmenlerin hizmetinde kullanılmak maksadıyla tapu kaydının iptali ile Toplu Konut İdaresi Başkanlığı adına tescili Toplu Konut İdaresi Başkanlığı tarafından mahkemeden istenir. Mahkemece tapu kaydının iptaline ve Toplu Konut İdaresi Başkanlığı adına tesciline karar verilen konutlar, Toplu Konut İdaresi Başkanlığının talebi üzerine, bu Kanun ve 4/12/1984 tarihli ve 3091 sayılı Taşınmaz Mal Zilyedliğine Yapılan Tecavüzlerin Önlenmesi Hakkında Kanun çerçevesinde valiliklerce tahliye edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mahkeme kararı ile taşınmaz malların geri alınması halinde, evvelce ödenen taksitler veya yapılan zaruri ve faydalı giderlerle, taşınmaz maldan elde edilen intifaın bedelleri karşılıklı olarak hesap edilir, değerlerdeki fazlalıklar taraflarca iade edilir. Bu işlemlerden doğan bakiye alacaklar, Toplu Konut İdaresi Başkanlığınca genel hükümlere göre takip ve tahsil olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde kapsamında açılacak dava ve takiplerde Toplu Konut İdaresi Başkanlığı her türlü vergi, resim ve harçtan muaftır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bulgaristan'dan zorunlu göçe tabi tutulup, Türkiye'ye gelerek yerleşmek isteyen Türk soylu kişilere yaptırılan konutlardan almak üzere müracaat ederek para yatıranlardan konut sahibi olamayanların, bu Kanunun yayımı tarihinden itibaren bir yıl içerisinde müracaat etmeleri halinde yatırmış oldukları bedel, yatırıldığı tarihten ödeneceği tarihe kadar Tüketici Fiyat Endeksi esas alınmak suretiyle hesaplanarak Toplu Konut İdaresi Başkanlığı tarafından göçmen konutları hesabından ödenir. Bu durumda olan şahıslar, Toplu Konut İdaresi Başkanlığınca aranılacak başvuru şartlarını taşımaları kaydıyla talepleri halinde, herhangi bir kura şartına tabi olmaksızın yukarıdaki şekilde hesaplanarak kendilerine ödenecek bedelin, konut peşinat ya da anapara ödemesinden mahsup edilmesi suretiyle Toplu Konut İdaresi Başkanlığının alt gelir grubu ile yoksullara yönelik sosyal konut projelerinden yararlandırılırlar. Süresi içerisinde müracaat etmeyen soydaşların yatırmış oldukları bedel, göçmen konutları hesabına gelir kaydedilerek toplanmış bulunan paralar bu şekilde tasfiye edilir. Toplu Konut İdaresi Başkanlığınca göçmen konutları hesabından karşılanamayan tutarlar, Maliye Bakanlığınca bu amaçla Toplu Konut İdaresi Başkanlığına aktarılacak tutarlardan karşılanır. Bu fıkra hükümlerinin uygulanmasına ilişkin gerekli düzenlemeleri yapmaya Toplu Konut İdaresi Başkanlığı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu maddeye göre tahsis edilen ve temlik tarihinden itibaren on yıl geçmeden satılması, bağışlanması, terhin edilmesi, tapu kütüğüne satış vaadi şerhi konulması nedeniyle tahsisi iptal edilen konutlardan, bu fıkranın yürürlüğe girdiği tarih itibarıyla temlik tarihinden itibaren on yıl geçmiş olan konutlarla ilgili yapılacak tasarrufları belirlemeye, Toplu Konut İdaresi Başkanlığının bağlı bulunduğu Bakan yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren 2510 sayılı Kanun ve anılan Kanunun ek ve tadilleri gereğince hak sahibi olup da iskân edilemeyen aileler bu Kanunun yürürlüğe girdiği tarihten başlayarak iki yıl içinde valiliklere ve Bakanlığa yazılı olarak müracaat ettikleri takdirde, bunlara hak sahibi oldukları tarihte yürürlükte olan Kanun hükümleri ve aşağıdaki esaslar dahilinde iskân yardımı yapılır:</template>
        <mvz-bent no="a">
          <template>Bu ailelerin halen muhtaç durumda olması gerekir. Ailelerin muhtaçlık durumlarının tespiti için asgari ücretin yıllık tutarı esas alınır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İlk iskân kararında adı geçen ve halen yaşayan aile fertleri, bir bütün olarak bu yardımdan yararlanırlar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Evlenmek suretiyle aileden ayrılan kadın ve erkekler, müstakil aile olarak bu yolda iskân yardımı isteyemezler.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>İlk iskân kararının veriliş tarihi ile bu Kanunun yürürlüğe girdiği tarih arasında taşınmaz mal edinen aileler, bu taşınmaz malları devir ve temlik etmiş olsalar dahi bu yardımdan yararlanamazlar.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren iki yıl içerisinde müracaat etmeyenlerle Bakanlığın yapacağı iskân yardımını herhangi bir nedenle istemeyenler, gösterilen yeri kabul etmeyenler ve iskân edildikleri yeri terk edenler, ikinci bir iskân talebinde bulunamazlar ve iskân hakları kaybolur.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Verilen taşınmaz mallar aile fertleri adına eşit hisselerle tapuya tescil ettirilir. Taşınmaz mallar on yıl süreyle hiçbir şekilde satılamaz, bağışlanamaz, terhin ve haczedilemez. Tapularına bu yolda kayıt düşülür.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde hükümlerine göre yapılacak harcamalar Bakanlık bütçesinden karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun öngördüğü yönetmelikler yürürlüğe girinceye kadar, mevcut tüzük ve yönetmeliklerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Tarım İşletmeleri Genel Müdürlüğü Ceylanpınar Tarım İşletmesi Müdürlüğüne ait arazi içinde, mahallinde göçer olarak adlandırılan ve nüfus kayıtlarına bağlı kalınarak 31/12/2003 tarihi itibariyle arazi içinde yaşadıkları ve hayvancılık dışında başka bir işle iştigal etmedikleri, Şanlıurfa Valisinin Başkanlığında, Bayındırlık ve İskân İl Müdürü, Tarım İl Müdürü, Nüfus ve Vatandaşlık İl Müdürü, Defterdar, Tarım Reformu Bölge Müdürü, Kadastro İl Müdürü, GAP Bölge Kalkınma İdaresi Başkanlığı Bölge Müdürü, İl Emniyet Müdürü, Bölge Jandarma Komutanı, Ceylanpınar Kaymakamı ve Tarım İşletmeleri Genel Müdürlüğü Temsilcisinden oluşan Komisyon tarafından bireyleriyle birlikte tespit edilen aileler, bu Kanuna göre hak sahibi sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mülkiyeti Tarım İşletmeleri Genel Müdürlüğüne ait olan ve Şanlıurfa İli, Ceylanpınar İlçesi, Merkez ve Gümüşsu mevkiilerinde bulunan, ada ve parsel numaraları ile yüzölçümleri ekli (1) sayılı listede belirtilen toplam 141.793.751 metrekare yüzölçümlü taşınmazlardan hak sahipliği Şanlıurfa Valiliğince geçici 4 üncü maddenin birinci fıkrasına göre 2007 yılında tespit edilmiş göçer ailelerinin iskânı için gerekli olan kısımları ayrılarak bedelsiz olarak hak sahiplerine verilmek üzere tapuda Hazine adına tescil edilir ve bu taşınmazlar bu madde kapsamında değerlendirilmek üzere Maliye Bakanlığınca, Bakanlığa tahsis edilir. Tescil işlemleri ve bunlara bağlı tamamlayıcı nitelikteki tüm işlemler her türlü vergi, resim ve harçtan müstesnadır. Hak sahiplerinin iskânı için belirlenen arazide 3/7/2005 tarihli ve 5403 sayılı Toprak Koruma ve Arazi Kullanımı Kanunu ile getirilen sınırlamalara uymak şartıyla tüm ifraz, tevhid ve bunlara bağlı gerekli her türlü işlemler Tapu ve Kadastro Genel Müdürlüğünce yerine getirilir. Ekli (1) sayılı listede ada ve parselleri belirtilen taşınmazlardan, arazi sınırını belirleyen DSİ Mardin Sulama Kanalının böldüğü parsellere ilişkin ada ve parsel numaraları ile alanlar, ifraz işleminden sonra kesinleşir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu iş için ihtiyaç duyulacak ödenek, yılları Bütçe Kanunları ile gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hak sahibi ailelere iskânen verilecek taşınmazların teslimini takiben üç ay içinde, göçer ailelerin bulundukları eski arazilerin üzerinde bulunan ev, baraka, ahır ve benzeri yapı ve müştemilatı valilikçe yıktırılarak bu araziler Ceylanpınar Tarım İşletmeleri Müdürlüğü yetkililerine teslim edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Kıbrıs’a Anamur  Çayından Boru ile Su Götürme Projesi kapsamındaki Alaköprü Barajı rezervuarı ile inşaat alanında kalan ve bulundukları yerleşim yerlerinden kaldırılmaları zorunlu bulunan orman içi ve kenarı mahalle, köy veya belde halkının iskânlarının temini için, Çevre ve Orman Bakanlığınca bilim ve fen bakımından orman olarak muhafazasında hiçbir yarar görülmeyen ve tarım alanına dönüştürülmesi de mümkün olmayan orman sınırları dışına çıkarılmış ve çıkarılacak alanlar, Cumhurbaşkanınca alınacak kararda belirtilen şekil ve şartlar çerçevesinde Bayındırlık ve İskân Bakanlığına devredilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra hükümlerine göre iskân edilecek ailelerin hak sahipliliği ve borçlandırılmalarına ilişkin usul ve esaslar Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çevre ve Orman Bakanlığınca belirlenen alanlarda, 21/6/1987 tarihli ve 3402 sayılı Kadastro Kanununun 22 nci maddesinin kadastrosu yapılmış olan yerlerin ikinci defa kadastroya tabi tutulamayacağına ilişkin hükmü uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkraya göre Bayındırlık ve İskân Bakanlığına devredilecek alanların tespiti amacıyla Çevre ve Orman Bakanlığınca yeteri kadar orman kadastro komisyonu görevlendirilir ve bu tespit sırasında ilan süresi bir hafta, itiraz süresi bir ay olarak uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>31/8/1956 tarihli ve 6831 sayılı Orman Kanununun 1 inci maddesine göre ilk defa yapılacak orman kadastrosu uygulamasındaki işlemlere ilişkin sürelerde de dördüncü fıkra hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>12/11/2012 tarihli ve 6360 sayılı On Dört İlde Büyükşehir Belediyesi ve Yirmi Yedi İlçe Kurulması ile Bazı Kanun ve Kanun Hükmünde Kararnamelerde Değişiklik Yapılmasına Dair Kanun ile tüzel kişiliği kaldırılarak mahalleye dönüşen köylerde bu Kanunun 16 ncı maddesi uygulamalarına devam edilebilir. Bu yerlerde hak sahipliği, borçlandırma, yer seçimi, yer belirlenmesi, arsa satışı, arsa devri ve imar ile diğer işlere ilişkin tüm uygulamalar Bakanlıkça belirlenen usul ve esaslara göre yürütülür. Bu fıkranın uygulanması sırasında 6360 sayılı Kanun, 10/7/2004 tarihli ve 5216 sayılı Büyükşehir Belediyesi Kanunu ile 3/7/2005 tarihli ve 5393 sayılı Belediye Kanunu ve diğer kanunların bu Kanuna aykırı hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde kapsamındaki taşınmazlardan mera vasfında olanlar, 25/2/1998 tarihli ve 4342 sayılı Mera Kanunu gereğince istenilen ot bedeli alınmaksızın tahsis amacı değiştirilerek tapuda Hazine adına tescil edilir ve bu madde kapsamında değerlendirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Mülga 2510 sayılı Kanun hükümlerine göre Sarıkeçili göçebe grubuna mensup göçebe oldukları gerekçesiyle ve tarım dışı olarak Karaman ilinde iskân edilip, kendilerine taşınmaz verilen ailelerden, evlenmek suretiyle ayrılanlar ile sonradan doğup göçebelik ile ilgili şartları haiz olanlardan, 12/1/2009 tarihinde yapılan iskân duyurusu neticesinde hak sahibi olarak kabul edilen aileler, bu maddenin yürürlüğe girdiği tarihten itibaren altmış gün içinde müracaat etmeleri hâlinde bu Kanun kapsamında hak sahibi olarak kabul edilebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra dışında kalan ve mülga 2510 sayılı Kanun ile bu Kanun hükümlerine göre hak sahibi olarak belirlenmesine rağmen en az on yıl içinde kendilerine taşınmaz verilemeyen ailelerden, evlenmek suretiyle ayrılanlar ile sonradan bu Kanunda belirtilen hak sahipliği şartlarını haiz oldukları anlaşılanlar, bu maddenin yürürlüğe girdiği tarihten itibaren bir yıl içinde müracaat etmeleri hâlinde hak sahibi olarak kabul edilebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mülga 2510 sayılı Kanuna göre hak sahibi olanların hak sahiplikleri herhangi bir koşul aranmaksızın bu Kanuna göre devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Artvin ili Yusufeli ilçe merkezinin, 16/4/2008 tarihli ve 5753 sayılı Artvin İli Yusufeli İlçesinin Merkezinin Değiştirilmesi Hakkında Kanun ile belirlenen alana naklinde, bu alanda iskân edilecek aileler ile Yusufeli Barajı ve Hidroelektrik Santrali yapımından etkilenen köyler için yeniden yapılacak iskân etütleri sonrasında belirlenecek alanlarda iskân edilecek ailelerin hak sahipliği ve borçlandırılmaları Cumhurbaşkanınca belirlenecek usul ve esaslara göre yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Denizli ili Acıpayam ilçesi Dalaman Çayı üzerinde Sami Soydam Barajı ve Hidroelektrik Santrali Projesi kapsamında kalan ve bulundukları yerleşim yerlerinden kaldırılmaları zorunlu bulunan orman içi ve kenarı mahalle, köy veya belde halkının iskânlarının temini, ailelerin hak sahipliği ve borçlandırılmalarına ilişkin usul ve esaslar Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Batman ili Hasankeyf ilçe merkezinde Ilısu HES Projesi yapımından etkilenen ailelerin, Yeni Hasankeyf Yerleşim Alanına nakilleri, hak sahiplikleri ve borçlandırılmalarına ilişkin usul ve esaslar Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Antalya ili Kaş ilçesi Kemer mahallesinde Antalya-Kaş Kasaba Projesi Kıbrıs Barajı yapımından etkilenen ailelerin, iskânlarının temini için yeniden yapılacak iskân etütleri ve devamında iskân edilecek ailelerin yeni yerleşim alanına nakilleri, hak sahipliği duyuruları, hak sahiplikleri ve borçlandırılmalarına ilişkin işlemler bu Kanunun ek 2 nci maddesi kapsamında Cumhurbaşkanınca belirlenecek usul ve esaslar çerçevesinde Devlet Su İşleri Genel Müdürlüğü tarafından yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Konya ili Hadim ilçesi Dedemli mahallesinde Bozkır Barajı yapımından etkilenen ailelerin, belirlenecek yeni yerleşim alanına nakilleri, hak sahipliği duyuruları, hak sahiplikleri ve borçlandırılmalarına ilişkin usul ve esaslar Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Mülga 2510 sayılı Kanun ile bu Kanun kapsamında hak sahibi olan ailelerden kendilerine verilen taşınmazlara ait ödemedikleri anapara taksit borçlarının her biri için, vadesinin bittiği tarihten itibaren ödeme tarihine kadar geçen süre için tüketici fiyat endeksindeki  değişim oranı ile güncellenmiş tutarını bu maddenin yürürlüğe girdiği tarihten itibaren bir yıl içerisinde defaten ödeyenlerden gecikme ve temerrüt faizi alınmaz. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Maliye Bakanlığının görüşü alınarak Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mülga 2510 sayılı Kanun hükümlerine göre Diyarbakır ili Bismil ilçesi Çeltikli’de hak sahibi kabul edilerek kendilerine 2003 ve 2004 yıllarında taşınmaz verilen, ancak konutları ve işletme binalarının zemin hareketlerinden dolayı hasar gördüğü teknik raporlarla tespit edilen hak sahibi ailelerden bu maddenin yürürlüğe girdiği tarihten itibaren altmış gün içerisinde Diyarbakır Valiliğince yaptırılacak teknik tespit raporuna göre hak sahiplerine yapılacak yazılı bildirim tarihini izleyen günden itibaren yüz seksen gün içinde varsa açmış oldukları davadan feragat ederek müracaat edenlerin konut ve işletme binaları yıkılarak yerlerine yenileri yapılır. Bu süre sonrasında yapılan müracaatlar dikkate alınmaz ve herhangi bir hak talebinde bulunulamaz. Bu aileler; yapılan ve yapılacak yapıların bedelleri için mülga 2510 sayılı Kanun hükümlerine göre yeniden borçlandırılır ve varsa önceden ödedikleri bedeller güncellenerek yeni borçlarından mahsup edilir. Konutları yeniden yapılacak hak sahibi ailelere, talep etmeleri halinde konutları teslim edilinceye kadar borçlarına eklenmek kaydıyla kira yardımı yapılabilir. Diğer hususlarda ilgili mevzuat hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
