 <mvz-künye tür="kanun" no="7201" başlık="TEBLİGAT KANUNU"
             tarih="11/2/1959" rgazete-tarih="19/2/1959" rgazete-sayı="10139"
             düstur-tertip="3" düstur-cilt="40" düstur-sayfa="147" />

  <mvz-bap no="1-BİRİNCİ" başlık="Umumi Hükümler">
    <mvz-fasıl no="1-BİRİNCİ" başlık="Kanunun Şümulü">
      <mvz-madde no="1" başlık="Tebligatın yapılması">
        <mvz-fıkra no="1">
          <template>Kazaî merciler, 10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununa ekli (I) sayılı cetvelde yer alan genel bütçe kapsamındaki kamu idareleri, (II) sayılı cetvelde yer alan özel bütçeli idareler, (III) sayılı cetvelde yer alan düzenleyici ve denetleyici kurumlar, (IV) sayılı cetvelde yer alan sosyal güvenlik kurumları ile vakıf yükseköğretim kurumları, il özel idareleri, belediyeler, köy hükmî şahsiyetleri, barolar ve noterler tarafından yapılacak elektronik ortam da dâhil tüm tebligat, bu Kanun hükümlerine göre Posta ve Telgraf Teşkilatı Genel Müdürlüğü veya memur vasıtasıyla yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Tebligatın memur vasıtasiyle yapılması">
        <mvz-fıkra no="1">
          <template>Diğer kanunlarda özel hüküm bulunması halinde veya tehirinde zarar umulan işlerde veya aynı yerde bulunan 1 inci maddede yazılı daire ve müesseseler arasında veya bu daire ve müesseselerde bulunan şahıslara yapılacak tebligat, kendi memurları veya mahalli mülkiye amirinin emriyle zabıta vasıtasıyla yaptırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Zor kullanılmasını gerektiren veya hazırlık tahkikatına taallük eden vazifelerini zabıta tarafından yapılacağına dair olan hükümlerle bu kanunun ikinci babında yazılı hususi hükümler mahfuzdur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="3" başlık="Ücret tarifesi">
        <mvz-fıkra no="1">
          <template>Posta ve Telgraf Teşkilatı Genel Müdürlüğünin bu Kanuna göre yapacağı işlerden dolayı alacağı ücretler, bu işletme tarafından ayrı bir tarife ile tespit ve tayin edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="Memur vasıtasiyle tebliğlerde zaruri masraflar">
        <mvz-fıkra no="1">
          <template>6245 sayılı Harcırah Kanununun 49 uncu maddesine göre tazminat alan memur ve hizmetliler dışındaki memurlar vasıtasıyla, bu Kanun mucibince yaptırılacak tebligatlar için tebligat yapana verilecek zaruri masrafların miktarı</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>kendisine tebliğ yapılacak şahsın bulunduğu yerin mesafesine nazaran her mali yılbaşında il idare heyetleri tarafından o ilin gerek merkez, gerekse bağlı ilçeleri için ayrı ayrı tesbit olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yukarıki fıkraya göre kendilerine zaruri masraf verilen memurlara yaptıkları tebliğ dolayısiyle 6245 sayılı kanun mucibince ayrıca harcırah verilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Ücret ve masrafın peşin ödenmesi">
        <mvz-fıkra no="1">
          <template>Tarifede yazılı PTT ücretlerini veya dördüncü madde mucibince verilecek zaruri masrafları, hilafına bir hüküm bulunmadıkça tebliğin yapılmasını istiyen peşin olarak öder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tebliği çıkaracak merci tarafından tayin olunan mehil içinde gerekli masrafı vermiyen, talebinden sarfınazar etmiş addolunur. Zaruri sebeplerden dolayı bu mehle riayetsizlik halinde yeni bir mehil verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Tebliğ evrakının zıyaı halinde masraflar">
        <mvz-fıkra no="1">
          <template>PTT İşletmesi  mücbir haller dışında her hangi bir sebeple zıyaa uğrıyan tebliğ evrakının yeniden tanzim ve tebliği için gerekli masraflar, Posta Kanununun taahhütlü müraselata mütaallik hükümlerine göre ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Telgraf servisinde zıya veya gecikme vukuunda Telgraf ve Telefon Kanunu hükümleri tatbik olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Uçak, telgraf ve diğer vasıtalarla tebligat ve ücretleri">
        <mvz-fıkra no="1">
          <template>Tebligat uçakla veya postada kullanılan diğer seri veya hususi vasıtalarla veya muhtelif işaretli telgraflarla da yaptırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tebliğin bu vasıtalardan hangisiyle yapılacağı alakalının talebi üzerine veya re'sen mahkeme reisi, hakim veya tebliği yaptıracak diğer merciler tarafından tensip edilir. Bu takdirde bunlara ait ücretler, PTT ücretleri tarifesine göre bu vasıtalarla tebliği istiyenden tebliğ ücretinden ayrı olarak alınır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7/a" başlık="Elektronik tebligat">
        <mvz-fıkra no="1">
          <template>Aşağıda belirtilen gerçek ve tüzel kişilere tebligatın elektronik yolla yapılması zorunludur.</template>
          <mvz-bent no="1.">
            <template>10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununa ekli (I), (II), (III) ve (IV) sayılı cetvellerde yer alan kamu idareleri ile bunlara bağlı döner sermayeli kuruluşlar.</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>5018 sayılı Kanunda tanımlanan mahallî idareler.</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Özel kanunla kurulmuş diğer kamu kurum ve kuruluşları ile kanunla kurulan fonlar ve kefalet sandıkları.</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Kamu iktisadi teşebbüsleri ile bunların bağlı ortaklıkları, müessese ve işletmeleri.</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Sermayesinin yüzde ellisinden fazlası kamuya ait diğer ortaklıklar.</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Kamu kurumu niteliğindeki meslek kuruluşları ve üst kuruluşları.</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>Kanunla kurulanlar da dahil olmak üzere tüm özel hukuk tüzel kişileri.</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>Noterler.</template>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>Baro levhasına yazılı avukatlar.</template>
          </mvz-bent>
          <mvz-bent no="10.">
            <template>Sicile kayıtlı arabulucular ve bilirkişiler.</template>
          </mvz-bent>
          <mvz-bent no="11.">
            <template>İdareleri, kamu iktisadi teşebbüslerini veya sermayesinin yüzde ellisinden fazlası kamuya ait diğer ortaklıkları; adli ve idari yargı mercileri, icra müdürlükleri veya hakemler nezdinde vekil sıfatıyla temsile yetkili olan kişilerin bağlı bulunduğu birim.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci fıkra kapsamı dışında kalan gerçek ve tüzel kişilere, talepleri hâlinde elektronik tebligat adresi verilir. Bu durumda bu kişilere tebligatın elektronik yolla yapılması zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci ve ikinci fıkra hükümlerine göre elektronik yolla tebligatın zorunlu bir sebeple yapılamaması hâlinde bu Kanunda belirtilen diğer usullerle tebligat yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Elektronik yolla tebligat, muhatabın elektronik adresine ulaştığı tarihi izleyen beşinci günün sonunda yapılmış sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu Kanun uyarınca yapılan elektronik tebligat işlemleri, Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından kurulan ve işletilen Ulusal Elektronik Tebligat Sistemi üzerinden yürütülür. Posta ve Telgraf Teşkilatı Anonim Şirketi, sistemin güvenliğini ve bu sistemde kayıtlı verilerin muhafazasını sağlayacak her türlü tedbiri alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="2-İKİNCİ" başlık="Tebligat Esasları">
      <mvz-madde no="8" başlık="Tebliğ evrakının nüshaları ve makbuz verilmesi">
        <mvz-fıkra no="1">
          <template>Tebliğ olunacak her nevi evrak, biri dosyasında konulmak ve diğeri tebliğ edilecek kimselere verilmek üzere lüzumu kadar nüshadan terekküp eder. Bu nüshalarda iş sahibi veya vekilinin imzası bulunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tebliğ olunmak üzere salahiyetli mercilere verilecek evrakın her nüshasına bu mercilerce, verildiği tarih yazılır ve istenirse makbuz verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Her nevi evrakın tebliğine ve davetiyelere ait tebliğ mazbataları dosyasına konur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Davetiyenin ihtiva edeceği kayıtlar">
        <mvz-fıkra no="1">
          <template>Davetiye aşağıdakı kayıtları ihtiva eder:</template>
          <mvz-bent no="1.">
            <template>Tarafların ve varsa kanuni temsilci ve vekillerinin ad ve soyadları ile ikametgah veya mesken yahut iş adreslerini,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Anlaşılacak şekilde kısaca tebliğin mevzuunu,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Davet edilen şahsın hangi mercide ve hangi gün ve saatte hazır bulunması lazımgeldiğini ve bu merciin yerini,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Kanunlarına göre davetiye ve celpnamelere derci icabeden sair hususları,</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Davetiyeyi çıkaran merciin mührünü ve mahkeme başkatibinin ve diğer mercilerde salahiyetli memurun imzasını.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Bilinen adreste tebligat">
        <mvz-fıkra no="1">
          <template>Tebligat, tebliğ yapılacak şahsa bilinen en son adresinde yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bilinen en son adresin tebligata elverişli olmadığının anlaşılması veya tebligat yapılamaması hâlinde, muhatabın adres kayıt sisteminde bulunan yerleşim yeri adresi, bilinen en son adresi olarak kabul edilir ve tebligat buraya yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Şu kadar ki; kendisine tebliğ yapılacak şahsın müracaatı veya kabulü şartiyle her yerde tebligat yapılması caizdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Vekile ve kanuni mümesile tebligat">
        <mvz-fıkra no="1">
          <template>Vekil vasıtasıyla takip edilen işlerde tebligat vekile yapılır. Vekil birden çok ise bunlardan birine tebligat yapılması yeterlidir. Eğer tebligat birden fazla vekile yapılmış ise, bunlardan ilkine yapılan tebliğ tarihi asıl tebliğ tarihi sayılır. Ancak, Ceza Muhakemeleri Usulu Kanununun, kararların sanıklara tebliğ edilmelerine ilişkin hükümleri saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Avukat tarafından takip edilen işlerde, avukatın bürosunda yapılacak tebligatlar, resmî çalışma gün ve saatleri içinde yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kanuni mümessilleri bulunanlara veya bulunması gerekenlere yapılacak tebligat kanunlara göre bizzat kendilerine yapılması icabetmedikçe bu mümessillere yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Hükmi şahıslara ve ticarethanelere tebligat">
        <mvz-fıkra no="1">
          <template>Hükmi şahıslara tebliğ, salahiyetli mümessillerine, bunlar birden ziyade ise, yalnız birine yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bir ticarethanenin muamelelerinden doğan ihtilaflarda, ticari mümessiline yapılan tebliğ muteberdir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Hükmi şahısların memur ve müstahdemlerine tebligat">
        <mvz-fıkra no="1">
          <template>Hükmi şahıslar namına kendilerine tebliğ yapılacak kimseler her hangi bir sebeple mütat iş saatlerinde iş yerinde bulunmadıkları veya o sırada evrakı bizzat alamıyacak bir halde oldukları takdirde tebliğ, orada hazır bulunan memur veya müstahdemlerinden birine yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Askeri şahıslara tebligat">
        <mvz-fıkra no="1">
          <template>Astsubaylar hariç olmak üzere erata yapılacak tebliğler, kıta kumandanı ve müessese amiri gibi en yakın üste yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıki fıkrada yazılı olanların haricindeki askeri şahıslara birlik veya müessesede tebligat yapılması icabeden ahvalde, tebliğin yapılmasını nöbetçi amiri veya subayı temin eder. Bunlar tarafından muhatabın derhal bulundurulması veya tebliğin temini mümkün olmazsa tebliğ kendilerine yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Sefer hali">
        <mvz-fıkra no="1">
          <template>Sefer halinde olan birlik veya müesseseye mensup askeri şahıslara tebligat, bağlı bulundukları Kara, Deniz veya Hava kuvvetleri kumandanlıkları vasıtasiyle yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="16" başlık="Aynı konutta oturan kişilere veya hizmetçiye tebligat">
        <mvz-fıkra no="1">
          <template>Kendisine tebliğ yapılacak şahıs adresinde bulunmazsa tebliğ kendisi ile aynı konutta oturan kişilere veya hizmetçilerinden birine yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="Belli bir yerde veya evde meslek ve sanat icrası">
        <mvz-fıkra no="1">
          <template>Belli bir yerde devamlı olarak meslek veya sanatını icra edenler, o yerde bulunmadıkları takdirde tebliğ aynı yerdeki daimi memur veya müstahdemlerinden birine, meslek veya sanatını evinde icra edenlerin memur ve müstahdemlerinden biri bulunmadığı takdirde aynı konutta oturan kişilere veya hizmetçilerinden birine yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Otel, hastane, fabrika ve mektep gibi yerlerde tebligat">
        <mvz-fıkra no="1">
          <template>Tebliğ yapılacak şahıs otel, hastane, tedavi veya istirahat evi, fabrika, mektep, talebe yurdu gibi içine serbestçe girilemiyen veya arananın kolayca bulunması mümkün olmıyan bir yerde bulunuyorsa, tebliğin yapılmasını o yeri idare eden veya muhatabın bulunduğu kısmın amiri temin eder. Bunlar tarafından muhatabın derhal buldurulması veya tebliğin temini mümkün olmazsa, tebliğ kendilerine yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Mevkuf ve mahkümlara tebligat">
        <mvz-fıkra no="1">
          <template>Mevkuf ve mahkümlara ait tebliğlerin yapılmasını, bunların bulunduğu müessese müdür veya memuru temin eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="20" başlık="Muhatabın muvakkaten başka yere gitmesi">
        <mvz-fıkra no="1">
          <template>13, 14, 16, 17 ve 18 inci maddelerde yazılı şahıslar, kendisine tebliğ yapılacak kimsenin muvakkaten başka yere gittiğini belirtirlerse; keyfiyet ve beyanda bulunanın adı ve soyadı tebliğ mazbatasına yazılarak altı beyan yapan tarafından imzalanır ve tebliğ memuru tebliğ evrakını bu kişilere verir. Bu kişiler tebliğ evrakını kabule mecburdurlar. Kendisine tebliğ yapılacak kimsenin muvakkaten başka bir yere gittiğini belirten kimse, beyanını imzadan imtina ederse, tebliğ eden bu beyanı şerh ve imza eder. Bu durumda ve tebliğ evrakının kabulden çekinme halinde tebligat, 21 inci maddeye göre yapılır.  Bu maddeye göre yapılacak tebligatlarda tebliğ, tebliğ evrakının 13, 14, 16, 17 ve 18 inci maddelerde yazılı kişilere verildiği tarihte veya ihbarname kapıya yapıştırılmışsa bu tarihten itibaren onbeş gün sonra yapılmış sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="Tebliğ imkansızlığı ve tebellüğden imtina">
        <mvz-fıkra no="1">
          <template>Kendisine tebligat yapılacak kimse veya yukarıdaki maddeler mucibince tebligat yapılabilecek kimselerden hiçbiri gösterilen adreste bulunmaz veya tebellüğden imtina ederse, tebliğ memuru tebliğ olunacak evrakı, o yerin muhtar veya ihtiyar heyeti azasından birine veyahut zabıta amir veya memurlarına imza mukabilinde teslim eder ve tesellüm edenin adresini ihtiva eden ihbarnameyi gösterilen adresteki binanın kapısına yapıştırmakla beraber, adreste bulunmama halinde tebliğ olunacak şahsa keyfiyetin haber verilmesini de mümkün oldukça en yakın komşularından birine, varsa yönetici veya kapıcıya da bildirilir. İhbarnamenin kapıya yapıştırıldığı tarih, tebliğ tarihi sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gösterilen adres muhatabın adres kayıt sistemindeki adresi olup, muhatap o adreste hiç oturmamış veya o adresten sürekli olarak ayrılmış olsa dahi, tebliğ memuru tebliğ olunacak evrakı, o yerin muhtar veya ihtiyar heyeti azasından birine veyahut zabıta amir veya memurlarına imza karşılığında teslim eder ve tesellüm edenin adresini ihtiva eden ihbarnameyi gösterilen adresteki binanın kapısına yapıştırır. İhbarnamenin kapıya yapıştırıldığı tarih, tebliğ tarihi sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Muhtar, ihtiyar heyeti azaları, zabıta amir ve memurları yukarıdaki fıkralar uyarınca kendilerine teslim edilen evrakı kabule mecburdurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Yaş ve ehliyet şartı">
        <mvz-fıkra no="1">
          <template>Muhatap yerine kendisine tebliğ yapılacak kimsenin görünüşüne nazaran onsekiz yaşından aşağı olmaması ve bariz bir surette ehliyetsiz bulunmaması lazımdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="23" başlık="Tebliğ mazbatası">
        <mvz-fıkra no="1">
          <template>Tebliğ bir mazbata ile tevsik edilir. Bu mazbatanın:</template>
          <mvz-bent no="1.">
            <template>Tebliği çıkaran merciin adını,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Tebliği istiyen tarafın adını, soyadını ve adresini,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Tebliğ olunacak şahsın adını, soyadını ve adresini,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Tebliğin mevzuunu,</template>
          </mvz-bent>
          <mvz-bent no="5.">
            <template>Tebliğin kime yapıldığını ve tebliğ muhatabından başkasına yapılmış ise o kimsenin adını, soyadını, adresini ve 22 nci madde gereğince tebellüğe ehil olduğunu,</template>
          </mvz-bent>
          <mvz-bent no="6.">
            <template>Tebliğin nerede ve ne zaman yapıldığını,</template>
          </mvz-bent>
          <mvz-bent no="7.">
            <template>21 inci maddedeki durumun tahaddüsü halinde bu hususlara mütaallik muamelenin yapıldığını, adreste bulunmama ve imtina için gösterilen sebebi,</template>
          </mvz-bent>
          <mvz-bent no="8.">
            <template>Tebligatın adres kayıt sistemindeki adrese yapılması durumunda buna ilişkin kaydı,</template>
          </mvz-bent>
          <mvz-bent no="9.">
            <template>Tebliğ evrakı kime verilmiş ise onun imzası ile tebliğ memurunun adı, soyadı ve imzasını,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>İhtiva etmesi lazımdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="İmza edemiyecek durumda olmak">
        <mvz-fıkra no="1">
          <template>Kendisine tebliğ yapılacak kimse imza edecek kadar yazı bilmez veya imza edemiyecek durumda bulunursa, komşularından bir kişi huzurunda sol elinin baş parmağı bastırılmak suretiyle tebliğ yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sol elinin baş parmağı bulunmıyan kimsenin, aynı elinin diğer bir parmağı ve sol eli yoksa sağ elinin baş parmağı ve bu da mevcut değilse diğer parmaklarından biri bastırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tebliğ yapılacak kimsenin iki eli de yoksa tebliğ evrakı kendisine verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yukardaki fıkralarda yazılı hallerde keyfiyet, tebliğ mazbatasında tasrih edilir ve hazır bulunan şahsa da imza ettirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Okur yazar bir komşu bulunmaz veya bulunan komşu imzadan imtina ederse, tebliğ memuru o mahalle veya köyün muhtar veya ihtiyar heyeti azasından birini veyahut bir zabıta memurunu, tebliğ sırasında hazır bulunmak üzere davet eder ve tebligat bunların huzurunda yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="Yabancı memlekette tebligat usulü">
        <mvz-fıkra no="1">
          <template>Yabancı memlekette tebliğ o memleketin salahiyetli makamı vasıtasiyle yapılır. Bunun için anlaşma veya o memleket kanunları müsait ise, o yerdeki Türkiye siyasi memuru veya konsolosu tebligat yapılmasını salahiyetli makamdan ister.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>(Mülga)</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yabancı memleketlerde bulunan kimselere tebliğ olunacak evrak, tebligatı çıkaran merciin bağlı bulunduğu vekalet vasıtasiyle Dışişleri Bakanlığıne, oradan damemuriyet havzası nazarı itibara alınarak ilgili Türkiye Elçiliğine veya Konsolosluğuna gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Şu kadar ki, Dışişleri Bakanlığının aracılığına lüzum görülmeyen hallerde tebligat evrakı, ilgili Bakanlıkça doğrudan doğruya o yerdeki Türkiye Büyükelçiliğine veya Başkonsolosluğuna gönderilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25/a" başlık="Siyasî temsilcilik aracılığıyla yabancı ülkedeki Türk vatandaşlarına tebligat">
        <mvz-fıkra no="1">
          <template>Yabancı ülkede kendisine tebliğ yapılacak kimse Türk vatandaşı olduğu takdirde tebliğ o yerdeki Türkiye Büyükelçiliği veya Konsolosluğu aracılığıyla da yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu hâlde bildirimi Türkiye Büyükelçiliği veya Konsolosluğu veya bunların görevlendireceği bir memur yapar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tebliğin konusu ile hangi merci tarafından çıkarıldığı bilgilerinin yer aldığı ve otuz gün içinde başvurulmadığı takdirde tebliğin yapılmış sayılacağı ihtarını içeren bildirim, muhataba o ülkenin mevzuatının izin verdiği yöntemle gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bildirimin o ülkenin mevzuatına göre muhataba tebliğ edildiği belgelendirildiğinde, tebliğ tarihinden itibaren otuz gün içinde Türkiye Büyükelçiliği veya Konsolosluğuna başvurulmadığı takdirde tebligat otuzuncu günün bitiminde yapılmış sayılır. Muhatap Türkiye Büyükelçiliği veya Konsolosluğuna başvurduğu takdirde tebliğ evrakını almaktan kaçınırsa bu hususta düzenlenecek tutanak tarihinde tebliğ yapılmış sayılır. Evrak bekletilmeksizin merciine iade edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu maddeye göre kazaî merciler tarafından çıkarılacak tebligatta, tebliğ evrakı doğrudan o yerdeki Türkiye Büyükelçiliği veya Konsolosluğuna gönderilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Türkiye'deki elçilik veya konsolosluklardan tevdi olunan tebligat evrakı">
        <mvz-fıkra no="1">
          <template>Anlaşmalar hükümleri ve mütekabiliyet esasları mahfuz kalmak şartiyle, Türkiye'de mukim yerli ve yabancı şahıslara tebliğ edilmek üzere ecnebi bir memleketin elçiliğinden veya havzasında bulunduğu valilik kanalı ile konsolosluğundan Dışişleri Bakanlığına tevdi olunan evrak, ilgili vekalet kanalı ile salahiyetli mercie gönderilir ve tebliğ muamelesinin ifasını mütaakıp tasdikli olarak aynı yollardan iade edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kuzey Kıbrıs Türk Cumhuriyeti’nde konuşlu askeri birlik, karargâh ve kurumlardan Türkiye Cumhuriyeti’nde bulunan kişi veya kurumlara yapılacak tebligat usulü:</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26/A" başlık="">
        <mvz-fıkra no="1">
          <template>Kuzey Kıbrıs Türk Cumhuriyeti’nde konuşlu askeri birlik, karargâh ve kurumlardan Türkiye Cumhuriyeti’nde bulunan kişi veya kurumlara yapılacak tebligatlar, bu Kanun hükümlerine göre Posta ve Telgraf Teşkilatı Anonim Şirketinin istihdam ettiği ya da hizmet alımı suretiyle çalıştırdığı personel veya memur vasıtasıyla yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Yabancı memlekette Türk memurlarına ve askeri şahıslarına tebligat">
        <mvz-fıkra no="1">
          <template>Yabancı bir memlekette resmi bir vazife ile bulunan Türk memurlarına tebligat, Dışişleri Bakanlığı vasıtasiyle yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yabancı memleketlerde bulunan askeri şahıslara yapılacak tebligat bağlı bulundukları Kara, Deniz, Hava Kuvvetleri Kumandanlıkları ile Jandarma Genel Komutanlığı vasıtasiyle yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="İlanen tebligat">
        <mvz-fıkra no="1">
          <template>Adresi meçhul olanlara tebligat ilanen yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıki maddeler mucibince tebligat yapılamıyan ve ikametgahı, meskeni veya iş yeri de bulunamıyan kimsenin adresi meçhul sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Adresin meçhul olması halinde keyfiyet tebliğ memuru tarafından mahalle veya köy muhtarına şerh verdirilmek suretiyle tesbit edilir.  Bununla beraber tebliği çıkaran merci, muhatabın adresini resmî veya hususi müessese ve dairelerden gerekli gördüklerine sorar ve zabıta vasıtasıyla tahkik ve tespit ettirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yabancı memleketlerde oturanlara ilanen tebligat yapılmasını icabettiren ahvalde tebliği çıkaran merci, tebliğ olunacak evrak ile ilan suretlerini yabancı memlekette bulunan kimsenin malüm adresine ayrıca iadeli taahhütlü mektupla gönderir ve posta makbuzunu dosyasına koyar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="İlan şekli">
        <mvz-fıkra no="1">
          <template>İlan suretiyle tebliğ, tebliği çıkartacak merciin mucip sebep beyaniyle vereceği karar üzerine aşağıdaki şekilde yapılır.</template>
          <mvz-bent no="1.">
            <template>İlan alakalının ıttılaına en emin bir şekilde vasıl olacağı umulan ve varsa 10 tebliği çıkaran merciin bulunduğu yerde intişar eden bir gazete ve bir internet haber sitesi ve ayrıca Basın İlân Kurumu İlan Portalında yapılır.</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Tebliğ olunacak evrak ve ilan sureti, tebliği çıkaran merciin herkesin kolayca görebileceği bir yerine de asılır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Merci, icabına göre ikinci defa ilan yapılmasına karar verebilir. İki ilan arasındaki müddet bir haftadan aşağı olamaz. Gerekiyorsa ikinci ilan, yabancı memleket gazeteleriyle de yaptırılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="İlanın ihtiva edeceği kayıtlar">
        <mvz-fıkra no="1">
          <template>İlanda, alakalıların ad ve soyadları, işleri, ikametgah veya mesken yahut iş yerleri, tebliğ olunacak evrak muhteviyatının hulasası, tebliğin anlaşılabilecek şekilde mevzuu, sebebi, ilanın hangi merciden verildiği, ilan daveti tazammun ediyorsa nerede ve ne için, hangi gün ve saatte hazır bulunulacağı yazılmak lazımdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="İlanen tebligatta tebliğ tarihi">
        <mvz-fıkra no="1">
          <template>İlanen tebliğ, son ilan tarihinden itibaren yedi gün sonra yapılmış sayılır.İlanen tebliğe karar veren merci, icabına göre daha uzun bir müddet tayin edebilir. Ancak, bu süre 15 günü geçemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="Usulüne aykırı tebliğin hükmü">
        <mvz-fıkra no="1">
          <template>Tebliğ usulüne aykırı yapılmış olsa bile, muhatabı tebliğe muttali olmuş ise muteber sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Muhatabın beyan ettiği tarih, tebliğ tarihi addolunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="33" başlık="Resmi ve adli tatil günlerinde tebligat">
        <mvz-fıkra no="1">
          <template>Resmi ve adli tatil günlerinde de tebligat caizdir.</template>
        </mvz-fıkra>
      </mvz-madde>

      <mvz-madde no="34" başlık="Şümulü">

        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yukarıdaki fıkra gereğince yapılacak tebligatlara ilişkin giderler 5 inci maddeye göre ödenir. Verilen süreye rağmen ödenmeyen tebligat gideri dava dilekçesinin tebliğine ilişkin ise Hukuk Usulü Muhakemeleri Kanununun 409 uncu maddesi uyarınca işlem yapılır. Diğer hallerde tebligat konusu talepten vazgeçilmiş sayılır.</template>

      <mvz-madde no="35" başlık="Adres değiştirmenin bildirilmesi mecburiyeti">

          <template>Kendisine veya adresine kanunun gösterdiği usullere göre tebliğ yapılmış olan kimse, adresini değiştirirse, yenisini hemen tebliği yaptırmış olan kaza merciine bildirmeye mecburdur. Bu takdirde bundan sonraki tebliğler bildirilen yeni adrese yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Adresini değiştiren kimse yenisini bildirmediği ve adres kayıt sisteminde yerleşim yeri adresi de tespit edilemediği takdirde, tebliğ olunacak evrakın bir nüshası eski adrese ait binanın kapısına asılır ve asılma tarihi tebliğ tarihi sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bundan sonra eski adrese çıkarılan tebliğler muhataba yapılmış sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Daha önce tebligat yapılmamış olsa bile, tüzel kişiler bakımından resmî kayıtlardaki adresleri esas alınır ve bu madde hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Daha önce yurt dışındaki adresine tebligat yapılmış Türk vatandaşı, yurt dışı adresini değiştirir ve bunu tebliğ çıkaran mercie bildirmez, adres kayıt sisteminden de yerleşim yeri adresi tespit edilemezse, bu kişinin yurt dışında daha önce tebligat yapılan adresine Türkiye Büyükelçiliği veya Konsolosluğunca 25/a maddesine göre gönderilen bildirimin adrese ulaştığının belgelendiği tarihten itibaren otuz gün sonra tebligat yapılmış sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="36" başlık="Celse esnasında veya kalemde tebligat">
        <mvz-fıkra no="1">
          <template>Celse esnasında veya kalemde, soruşturmaya, davaya ya da takibe ait evrakın, taraflara, ilgili üçüncü kişilere, katılana veya vekillerine tutanağa geçirilmek suretiyle veya imza karşılığında, tebliğ konusu belirtilerek tevdii, tebliğ hükmündedir. Bu durumda ayrıca tebliğ mazbatası düzenlenmesi gerekmez ve masraf da alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="Avukat katiplerine ve stajyerlerine tebligat">
        <mvz-fıkra no="1">
          <template>Celse esnasında kazai merci tarafından sıfatları tesbit edilen avukat katiplerine ve stajyerlerine mütaakip celse gün ve saatinin bildirilmesi avukata tebliğ hükmündedir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="Vekillerin yekdiğerine tebligat yapması">
        <mvz-fıkra no="1">
          <template>Vekil vasıtasiyle takibedilen davalarda, vekiller makbuz mukabilinde yekdiğerine tebligat yapabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="Tebellüğ edecek şahsın hasım olması">
        <mvz-fıkra no="1">
          <template>Bu kanun hükümlerine göre kendilerine tebliğ yapılması caiz olan kimselerin o davada hasım olarak alakaları varsa muhatap namına kendilerine tebliğ yapılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="40" başlık="Tebligata ait kararların müstaceliyeti">
        <mvz-fıkra no="1">
          <template>Tebligata ait kararlar, muayyen celse beklenmeden verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="41" başlık="Memur vasıtasiyle tebligat">
        <mvz-fıkra no="1">
          <template>Adli ve idari kaza mercileri ile diğer adalet daireleri re'sen veya talep halinde işin mahiyetine göre, dairelerinde çalışan memurlar vasıtasıyla tebligat yapılmasına karar verebilirler.</template>
        </mvz-fıkra>

      <mvz-madde no="43" başlık="Cumhuriyet Başsavcılığına tebligat">

        </mvz-fıkra>
      </mvz-madde>

        </mvz-fıkra>

      <mvz-madde no="47" başlık="Müteaddit şahsın mümessiline tebligat">

          <template>Birden ziyade şahsı temsil eden kimseye tebliğ olunacak evrakın ancak bir nüshası verilir. Şu kadar ki, yalnız evrakı tebellüğ için tevkil olunan kimseyi temsil ettiği şahısların adedi kadar nüsha verilmek lazımdır.</template>

        </mvz-fıkra>

      <mvz-madde no="49" başlık="Tapu idarelerince yapılacak tebligat">
        <mvz-fıkra no="1">
          <template>Tapuda kayıtlı taşınmazların veya miras, istimlak, cebrî icra veya mahkeme ilâmı ile iktisapta bulunan hak sahipleri, adreslerini ve değiştirdikleri takdirde yenisini, bulundukları yerin tapu idaresine bildirmeye mecburdur. Davetiye veya tebliğ evrakı, bu suretle bilinen son adrese gönderilir. Hak sahiplerinin adres bildirmemeleri hâlinde adres kayıt sistemindeki adresleri tebligat adresleri olarak kabul edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
    <mvz-fasıl no="3-ÜÇÜNCÜ" başlık="Mali Tebligat">
      <mvz-madde no="50" başlık="Divanı Muhasebat tarafından yapılacak tebligat">
        <mvz-fıkra no="1">
          <template>Divanı Muhasebatça yapılacak tebligat, tebliğ yapılacak şahıslardan merkez teşkilatında vazifeli bulunanlara, bağlı oldukları daireler, bunların haricinde kalanlara mahalli mülkiye amiri vasıtasıyla yaptırılır</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Adresin tesbit olunamaması veya tebellüğden imtina hallerinde tebligat, bu kanunun umumi hükümleri dairesinde yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="51" başlık="Diğer mali tebligat">
        <mvz-fıkra no="1">
          <template>Mali tebliğler, kendi kanunlarında sarahat bulunmıyan hallerde, bu kanunun umumi hükümlerine tevfikan yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-fasıl>
  </mvz-bap>
  <mvz-bap no="3-ÜÇÜNCÜ" başlık="Cezai Hükümler">
    <mvz-madde no="52" başlık="Kanunu tatbik ile mükellef olanların işliyecekleri suçlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun tatbikinde vazifeli bulunan memur ve hizmetliler ile mahalle, köy muhtar ve ihtiyar heyeti ve meclisi azaları işledikleri suçlar ile kendilerine karşı işlenen suçlardan dolayı, Türk Ceza Kanununun kamu görevlisine ilişkin hükümlerine göre cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukardaki fıkra hükmüne göre yapılacak takibat inzıbati ceza tatbikına mani değildir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="53" başlık="Yanlış adres bildirmek">
      <mvz-fıkra no="1">
        <template>Bu Kanun mucibince tebligat yapılması gereken hallerde bir kimse kendisine veya başkasına ait isim veya adresi yanlış olarak bildirir ise fail hakkında altı aydan iki yıla kadar hapis cezasına hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="54" başlık="Tebliğ evrakının muhatabına verilmemesi ve tebligatı kabulden kaçınma">
      <mvz-fıkra no="1">
        <template>Muhatap namına kendilerine tebligat yapılan kimseler tebliğ evrakını muhataplarına en kısa zamanda vermedikleri ve bundan gecikme veya zarar vukua geldiği takdirde bir yıla kadar hapis cezasıyla cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kendisine yapılması gereken tebligatı almayan muhatap ile muhatap adına tebligatı kabule mecbur olup da tebligatı kabul etmeyenler hakkında da yukarıda belirtilen cezalar uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="55" başlık="Yalan beyan">
      <mvz-fıkra no="1">
        <template>Daha ağır bir cezayı gerektirmediği takdirde;</template>
        <mvz-bent no="a">
          <template>Kendisi hakkında tebliğ memuruna yalan beyanda bulunan muhatap,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Muhatap namına kendisine tebligat yapılabilecek olup da, bu Kanunun tatbiki dolayısıyla tebliğ memuruna muhatap hakkında yalan beyanda bulunan kişi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Muhatap olmadığı veya muhatap namına tebellüğ etmeye yetkisi bulunmadığı halde tebliğ memuruna hüviyet ve sıfatı hakkında yalan beyanda bulunarak tebliğ evrakını alan kimse,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>her bir bentte tanımlanan fiil dolayısıyla bir yıla kadar hapis cezasıyla cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yukarıki bentlerde yazılı hallerde bir gecikme veya umumi veyahut hususi bir zarar husule gelirse fail hakkında ayrıca (a) ve (b) bentlerindeki fiiller için üç aydan bir yıla ve (c) bendindeki fiil için bir yıldan beş yıla kadar hapis cezası hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="56" başlık="Tebliğ evrakının taliki ile ilgili suçlar">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerine göre tebliğ evrakının veya ihbarnamenin talikine karşı koyanlar ile talik edilen bu kabil evrakı bulunduğu yerden koparan, imha eden veya okunamaz hale getirenler hakkında, üç aydan bir yıla kadar hapis ve yirmibeş günden yüzelli güne kadar adlî para cezasına hükmolunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="57" başlık="Tebliğ memurları aleyhine işlenen suçlar">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
  <mvz-bap no="4-DÖRDÜNCÜ" başlık="Müteferrik Hükümler">
    <mvz-madde no="58" başlık="Tebliğin vaktinde yapılmaması">
      <mvz-fıkra no="1">
        <template>Tebliğ vaktinde yapılmaz veya tebliğ mazbatası muayyen zamanda gelmezse alakalı merci keyfiyeti mahalli PTT merkezine bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu merkez şikayet mevzuu olan evrakın, ne muamele gördüğünü tetkik ve icabederse mevrit merkezinden tahkik ve takibeder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bunların neticesi mahalli PTT merkezi ve icabında Umum Müdürlük tarafından mümkün olduğu kadar kısa bir zamanda alakalı mercie bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="59" başlık="Tebliğ mazbatalı kapalı zarf">
      <mvz-fıkra no="1">
        <template>Kanunun 1 İnci maddesinde yazılı mercilerden çıkarılacak tebliğ evrakı, tebliğ mazbatalı kapalı bir zarf içinde gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Davetiye, basit usulü muhakeme davetiyesi, yemin davetiyesi bu zarfın içine konmadan da gönderilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="60" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasına ilişkin usûl ve esaslar İçişleri, Maliye ve Ulaştırma bakanlıklarının görüşü alınmak suretiyle, Adalet Bakanlığı tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="61" başlık="Diğer kanunlardaki atıflar">
      <mvz-fıkra no="1">
        <template>Diğer kanunların tebligat ile ilgili olarak Hukuk Usulü Muhakemeleri Kanununa ve adli evrakın PTT İdaresi vasıtasiyle tebliğine dair kanuna atfettiği yerlerde bu kanun hükümleri tatbik olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="62" başlık="Kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>Bu kanunla:</template>
        <mvz-bent no="1.">
          <template>Adli evrakın PTT İdaresi vasıtasiyle tebliğine dair olan kanun ile bu kanuna ek 4347, 4574, 4856 ve 5045 sayılı kanunlar,</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>1086 sayılı Hukuk Usulü Muhakemeleri Kanununun 81 inci maddesinin ikinci fıkrası ile 10 ncu faslının birinci kısmı,</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Ceza Muhakemeleri Usulü Kanununun 36, 37, 38, 271 ve 274 üncü maddeleri,</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>Askeri Muhakeme Usulü Kanununun 74, 75 ve 76 ncı maddeleri,</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>Noterlik Kanununun 33 üncü maddesinin ikinci fıkrası ile 75 inci maddesi,</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>Harclar Kanununun 33 üncü maddesi,</template>
        </mvz-bent>
        <mvz-bent no="7.">
          <template>Diğer kanunların bu kanuna uymıyan hükümleri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Bağımsız bölüm sahiplerine tebligat" tür="Ek">
      <mvz-fıkra no="1">
        <template>Kat Mülkiyeti Kanununun uygulandığı hallerde, ortak taşınmazda oturmayan her bağımsız bölüm sahibi, apartman yönetimi ve ortak giderler ile ilgili tebligat yönünden geçerli olmak üzere, Türkiye'de bir adresini yöneticiye yazılı olarak bildirmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Apartman yönetimi ve ortak giderler ile ilgili tebligatlar bu adrese yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bağımsız bölüm sahibinin adres bildirmemesi veya yazılı olarak bildirdiği adrese tebligat yapılamaması hallerinde, bundan sonraki bütün tebligatlar, o kişiye ait bağımsız bölümde fiilen oturana yapılır. Tebligatın bir örneği apartman girişinde bulundurulacak ilan tahtasına asılır. Bağımsız bölümde fiilen oturana bu şekilde yapılacak tebligat, bağımsız bölüm sahibine yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bağımsız bölümde fiilen oturan yoksa ilân tahtasına asılan tebligat örneği bağımsız bölüm sahibine yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Elektronik tebligat adresinin oluşturulması" tür="Ek">
      <mvz-fıkra no="1">
        <template>Elektronik tebligat adresi, Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından, 7/a maddesi kapsamında kalan her bir gerçek kişi için kimlik numarası, tüzel kişi için ise tabi oldukları sistem numarası esas alınmak suretiyle sadece bir tane olacak şekilde oluşturulur ve sistemde kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Oluşturulan elektronik tebligat adresleri, adres sahiplerine teslim edilmek üzere, ilgili kurum, kuruluş veya birliğe gönderilir; 7/a maddesinin ikinci fıkrası kapsamında kalan kişilere ise doğrudan teslim edilir. Bu adresler, adres sahibine teslim edildikten sonra 1 inci madde uyarınca tebligat çıkarmaya yetkili makam ve mercilerin kullanımına sunulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurum, kuruluş veya birlikler ile gerçek veya tüzel kişilerin 7/a maddesi uyarınca elektronik tebligat zorunluluğuna tabi olmaları veya bunlar hakkında elektronik tebligat zorunluluğunun ortadan kalkması hâllerinde gerekli bildirimler, ilgili kurum, kuruluş veya birlik tarafından bir ay içinde yapılır ve bildirimi takip eden bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından gerekli işlem yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Posta ve Telgraf Teşkilatı Anonim Şirketi, elektronik tebligat sisteminin yürütülmesi için gerekli bilgi ve belgeleri ilgili kurum, kuruluş veya birliklerden ister. İlgili kurum, kuruluş veya birlikler, talep edilen bilgi ve belgeleri Posta ve Telgraf Teşkilatı Anonim Şirketine göndermek zorundadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Teknik altyapının kurulması, tüzük hükümlerinin uygulanması" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Posta ve Telgraf Teşkilatı Genel Müdürlüğü, elektronik ortamda yapılacak tebligatla ilgili her türlü teknik altyapıyı bu maddenin yürürlüğe girdiği tarihten itibaren en geç bir yıl içinde kurarak faaliyete geçirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>60 ıncı maddede belirtilen yönetmelik, bu maddenin yürürlüğe girdiği tarihi izleyen altı ay içinde hazırlanır. Anılan yönetmelik yürürlüğe girene kadar Tebligat Tüzüğünün bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mevzuatta, Tebligat Tüzüğüne yapılan atıflar 60 ıncı madde hükmü uyarınca çıkarılacak yönetmeliğe yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Elektronik tebligat adreslerinin verilmesi" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten itibaren bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketi, elektronik tebligat adreslerini oluşturmak amacıyla ihtiyaç duyduğu tüm bilgi ve belgeleri;</template>
        <mvz-bent no="1.">
          <template>İlgili kamu kurum veya kuruluşundan,</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Mahallî idareler bakımından Çevre ve Şehircilik Bakanlığından,</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>İlgili kamu iktisadi teşebbüsünden,</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>İlgili kamuya ait ortaklıktan,</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>Şirketler ve kooperatifler bakımından Gümrük ve Ticaret Bakanlığından,</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>İlgili kamu kurumu niteliğindeki meslek kuruluşu veya üst kuruluşundan,</template>
        </mvz-bent>
        <mvz-bent no="7.">
          <template>Türkiye Noterler Birliğinden,</template>
        </mvz-bent>
        <mvz-bent no="8.">
          <template>Türkiye Barolar Birliğinden,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ister.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlgili kurum, kuruluş veya birlik, talep edilen bilgileri bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketine bildirmek zorundadır. Posta ve Telgraf Teşkilatı Anonim Şirketi, elektronik tebligat adreslerini, bu bilgileri esas almak suretiyle üç ay içinde oluşturur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Posta ve Telgraf Teşkilatı Anonim Şirketi oluşturulan elektronik tebligat adreslerini, adres sahiplerine teslim edilmek üzere, ilgili kurum, kuruluş veya birliğe gönderir ve teslim işlemi gerçekleştikten sonra bu adresleri, 1 inci madde uyarınca tebligat çıkarmaya yetkili makam ve mercilerin kullanımına sunar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="63" başlık="Kanunun mer'iyete girmesi">
      <mvz-fıkra no="1">
        <template>Bu kanun neşri tarihinden altı ay sonra mer'iyete girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="64" başlık="Kanunu icra edecek makam">
      <mvz-fıkra no="1">
        <template>Bu kanunun hükümlerini icraya İcra Vekilleri Heyeti memurdur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bap>
