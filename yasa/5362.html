    <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Kurul Toplantıları, Seçimler ve Yasaklar">
      <mvz-madde no="42" başlık="Genel kurul toplantıları ve çağrı">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının olağan genel kurul toplantıları yönetim kurulu tarafından yapılacak çağrı üzerine, dört yılda bir olmak üzere;</template>
          <mvz-bent no="a">
            <template>Oda genel kurulları ocak, şubat ve mart aylarında,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Birlik genel kurulları mayıs ayında,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Federasyon genel kurulları haziran ayında,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Konfederasyon genel kurulu eylül ayında,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kuruluşun merkezinin bulunduğu yerde yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel kurul toplantısını zamanında yapmayan esnaf ve sanatkârlar meslek kuruluşlarının genel kurul işlemleri; odalarda bağlı olduğu birlik, birlik ve federasyonlarda Konfederasyon, Konfederasyonda ise Bakanlık tarafından görevlendirilecek üç kişilik kurul tarafından yürütülür ve görevlendirmeden sonraki iki ay içinde genel kurul yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Genel kurul toplantılarının yeri, tarihi, saati ve gündemi toplantıdan en az onbeş gün önce ilgili esnaf ve sanatkârlar meslek kuruluşunun Bakanlık e-esnaf ve sanatkâr veri tabanındaki sayfasında yayınlanır. Ayrıca, oda ve birliklerce mahalli olarak günlük veya haftalık yayınlanan bir gazetede, gazete çıkmayan yerlerde ise teamüle göre ilan olunur. Federasyon ve Konfederasyon genel kurul toplantıları Türkiye genelinde yayınlanan bir gazetede ilan olunur. Genel kurula sunulacak raporlar toplantıdan onbeş gün önce ilgili esnaf ve sanatkâr meslek kuruluşunun Bakanlık e-esnaf ve sanatkâr veri tabanındaki sayfasından üyelerinin bilgilerine sunulur ve kuruluşun merkezinde ayrıca incelemeye açık tutulur. Genel kurul toplantısından bir üst kuruluş yazılı olarak onbeş gün önce haberdar edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Genel kurul toplantıları, üye sayısına uygun büyüklükte salonda yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Esnaf ve sanatkârlar meslek kuruluşları, kuruluş genel kurullarını kuruluş tarihinden sonraki doksan gün içinde yaparlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="43" başlık="Olağan toplantı gündemi">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının olağan genel kurulu, her kuruluşun ana sözleşmesine uygun olarak düzenlenecek aşağıdaki ve gerek görülmesi halinde ilave edilecek diğer gündem maddeleriyle toplanır. Gündem maddeleri ayrı ayrı görüşülür.</template>
          <mvz-bent no="a">
            <template>Açılış.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başkanlık divanının teşekkülü.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Saygı duruşu ve İstiklal Marşının okunması.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Başkanlık divanına tutanakları imzalama yetkisi verilmesi.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Yönetim kurulu faaliyet raporunun okunması ve müzakeresi.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Denetim kurulu raporunun okunması ve müzakeresi.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Bilanço, gelir ve gider hesaplarının okunması ve müzakeresi.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Bilanço, gelir ve gider hesaplarının kabulü veya reddi.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Yönetim kurulu ve denetim kurulunun ayrı ayrı ibrası.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Yeni dönem çalışma programı ile bu program içinde yer alacak olan eğitim, teorik ve pratik kurs programları ve tahmini bütçenin görüşülmesi, kabulü veya reddi.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Aylık ücretlerin, huzur haklarının, yolluk ve konaklama ücretlerinin tespit edilmesi.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Dilek ve temenniler.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Seçimler.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Kapanış.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gündemde yer almayan konular, toplantıda hazır bulunan genel kurul üyelerinin beşte birinin yazılı isteği ile yapılacak oylama sonucuna göre, Bakanlık tarafından görüşülmesi istenen hususlar ise doğrudan gündeme alınır. Ana sözleşme değişikliği ve fesih hususu, ilan edilen gündemde yer almadıkça genel kurul üyelerinin teklifi olsa dahi görüşülemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="44" başlık="Olağanüstü genel kurul toplantıları">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının genel kurulları;</template>
          <mvz-bent no="a">
            <template>Yönetim kurulu üye tam sayısının çoğunluğunun kararı ile yönetim kurulu tarafından,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Genel kurul üyelerinin  noterce tasdik edilmiş imzası ile düzenlenecek tutanak ve gündemle noter kanalıyla yapılacak başvuru üzerine, alınacak kararla yönetim kurulu tarafından,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Denetim kurulu tarafından,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Haklı ve geçerli sebeplerin varlığı halinde Bakanlık tarafından,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Olağanüstü olarak toplantıya çağırılır. Toplantı, çağrısında belirlenen gündemle yapılır. Olağanüstü toplantılarda belirlenen gündem dışında görüşme yapılamaz. Bakanlık çağrısı hariç, yapılacak olağanüstü genel kurul toplantısı hazırlık çalışmaları yönetim kurulunca yürütülür. Yönetim kurulunun bu görevi yerine getirmemesi halinde ise, olağanüstü genel kurul toplantısı hazırlık çalışmalarının nasıl ve kimler tarafından yürütüleceği Bakanlık tarafından belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="45" başlık="Genel kurul toplantıları ve çoğunluk">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının genel kurul toplantılarının açılabilmesi için genel kurul üyelerinin yarıdan fazlasının toplantıya iştirak etmesi şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birinci toplantıda çoğunluk sağlanamadığı takdirde genel kurul toplantısı bir ayı geçmemek üzere ertelenir. İki toplantı arasındaki süre odalarda beş, diğerlerinde iki günden az olamaz. Bu durum iki genel kurul üyesi ve Bakanlık temsilcisi veya hükümet komiseri tarafından düzenlenecek bir tutanakla tespit olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İlk toplantı ilanında ikinci toplantının yeri, tarih ve saati belirtilmiş ise yeniden ilan yapılmaz. İkinci toplantıya katılanların sayısı odalarda, yönetim kurulu ve denetim kurulu üyelerinin toplamının beş katından az olamaz. Diğer esnaf ve sanatkârlar meslek kuruluşlarında bu maddenin birinci fıkrası hükmü uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Genel kurul toplantılarında kararlar toplantıya katılan üyelerin çoğunluğu ile alınır. Ancak, fesih konusunda karar alınabilmesi için genel kurul üyelerinin üçte ikisinin, ana sözleşme değişikliği için ise genel kurul üyelerinin yarısından fazlasının kararı zorunludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="46" başlık="Genel kurul toplantısına katılacaklar listesi">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının genel kurul toplantılarına katılan genel kurul üyeleri; adı, soyadı, baba adı, doğum yeri ve tarihi, Türkiye Cumhuriyeti kimlik numarası, esnaf ve sanatkârlar sicil numarası ile temsilcisi oldukları meslek kuruluşlarının isimlerini gösterecek şekilde, esnaf ve sanatkârlar meslek kuruluşlarının Bakanlık e-esnaf ve sanatkâr veri tabanından alacakları listedeki yerlerini kimlik göstermek ve imza etmek suretiyle genel kurula katılırlar. Genel kurulda delegeler ve misafirler ayrı yerlerde otururlar. Güvenliğin temini bakımından Bakanlık temsilcisi veya hükümet komiseri tarafından gerek görülürse genel kurul toplantısına misafir alınmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel kurul üyelerinin toplantıya bizzat katılmaları gerekli olup, vekâlet kabul edilmez. Genel kurul üyelerinden birden fazla temsil hakkı olanların, her temsil hakları için ayrı oy hakkı vardır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel kurul toplantısına katılacakların listesi ve diğer genel kurul evrakı, genel kurul divan başkanı ve divan üyeleri ile Bakanlık temsilcisi veya hükümet komiseri tarafından imza olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Meslek kuruluşu üyelerine; sadece kayıtlı olduğu meslek kuruluşu ile sınırlı kalmak kaydıyla Bakanlık e-esnaf ve sanatkâr veri tabanı üzerinden, üyelerin adı soyadı, sicil numarası ile sabit iş yeri olanların iş yeri adresi bilgilerini içeren listeye erişim yetkisi verilir. Elde edilen kişisel veriler, sadece meslek kuruluşu organlarında görev almak isteyen adayların bu kuruluşların üyelerine ulaşabilmeleri amacıyla kullanılabilir. Bu veriler 24/3/2016 tarihli ve 6698 sayılı Kişisel Verilerin Korunması Kanununa aykırı olarak kullanılamaz, aktarılamaz veya başka bir şekilde işlenemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="47" başlık="Bakanlık temsilcisi ve hükümet komiseri">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının genel kurul toplantılarının geçerli olabilmesi için Bakanlık temsilcisinin veya hükümet komiserinin toplantı süresince bulunması ve kapanışa kadar toplantıya nezareti zorunludur. Bakanlık temsilcisi veya hükümet komiseri, toplantının mevzuat, ana sözleşmeleri ve gündem esasları içinde yapılmasını temin ve denetlemekle görevlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Görevlendirilen Bakanlık temsilcisinin veya hükümet komiserlerinin imzasını taşımayan genel kurul toplantısına katılacaklar listesi ile tutanaklar ve dolayısıyla toplantı belgeleri hüküm ifade etmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bakanlık temsilcisi veya hükümet komiseri, Bakanlık veya bu konuda yetkilendirilen mülki idare amiri tarafından görevlendirilir. Toplantıdan en az onbeş gün evvel Bakanlık veya yetkilendirilen mülki idare amirliğine müracaatla toplantı yeri, günü, saati ve gündemi bildirilmek suretiyle Bakanlık temsilcisi veya hükümet komiseri görevlendirilmesinin talep edilmesi lazımdır. Toplantı başlamadan evvel çağrının usûlüne uygun olarak yapıldığı, genel kurul toplantısına katılacaklar listesinin Bakanlık e-esnaf ve sanatkâr veri tabanından alındığı ve çoğunluğun tamam olduğu Bakanlık temsilcisi veya hükümet komiseri tarafından incelenip tespit edilerek görüşmelere başlanmasına izin verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ancak, usulüne uygun olarak yapılan müracaat üzerine görevlendirme yapıldığı halde, Bakanlık temsilcisi veya hükümet komiseri toplantıya katılmaz ise mülki idare amirine durum bildirilir. Bakanlık temsilcisi veya hükümet komiseri yine gelmezse bir saat sonra toplantıya başlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Genel kurul toplantılarında görevlendirilecek Bakanlık temsilcileri veya hükümet komiserlerinin Bakanlık tarafından belirlenecek zaruri masraf ve ücretleri, genel kurulu düzenleyen esnaf ve sanatkârlar meslek kuruluşu tarafından ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="48" başlık="Başkanlık divanı">
        <mvz-fıkra no="1">
          <template>Bakanlık temsilcisinin veya hükümet komiserinin toplantıyı açma iznini vermesini müteakip genel kurul üyeleri tarafından, genel kurul üyeleri veya üst kuruluşlarca görevlendirilmiş temsilciler arasından genel kurulu, belirlenen ve oylanacak gündeme göre sevk ve idare ile görevli bir başkan, bir başkan vekili ve üç kâtip üye açık oyla, ya da toplantıya katılan genel kurul üyelerinin beşte birinin yazılı teklifi halinde, gizli oy açık tasnifle seçilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="49" başlık="Organ ve yönetim kurulu başkanlarının seçimleri">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının organ seçimleri ile yönetim kurulu başkanlarının seçimi tek dereceli olarak, yargı gözetiminde gizli oyla ve açık tasnifle yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Seçim yapılacak genel kurul toplantısından en az yirmi gün önce, genel kurul üyelerini gösteren Bakanlık e-esnaf ve sanatkâr veri tabanından hazırlanmış genel kurul toplantısına katılacaklar listesi, toplantının gündemi, yeri, günü, saati ile çoğunluk sağlanamadığı takdirde yapılacak ikinci toplantıya ilişkin hususları belirleyen bir yazı ile birlikte üç nüsha olarak o yer ilçe seçim kurulu başkanlığına verilir. Birden fazla ilçe seçim kurulu bulunan yerlerde görevli hâkim, Yüksek Seçim Kurulunca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hâkim, gerektiğinde ilgili kayıt ve belgeleri de getirtip inceleme yapmak suretiyle varsa noksanlıkları tamamlattırdıktan sonra seçime katılacak genel kurul üyelerini belirleyen listeyi ve diğer hususları onaylar, onaylanan liste ile toplantıya ilişkin diğer hususlar seçim kurulu ile ilgili esnaf ve sanatkârlar meslek kuruluşunun merkezinde ve genel kurulun yapılacağı yerde asılmak suretiyle, ayrıca Bakanlık e-esnaf ve sanatkâr veri tabanında yedi gün süre ile ilan edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yedi günlük ilan süresi içinde listeye yapılacak itirazlar hâkim tarafından incelenir ve en geç iki gün içerisinde kesin olarak karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu suretle kesinleşen listeler ile toplantıya ilişkin diğer hususlar onaylanarak ilgili esnaf ve sanatkârlar meslek kuruluşuna gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Hâkim, kamu görevlileri veya aday olmayan genel kurul üyeleri arasından bir başkan ile iki üyeden oluşan bir seçim sandık kurulu atar. Aynı şekilde ayrıca üç yedek üye de belirler. Seçim sandık kurulu başkanının yokluğunda kurula en yaşlı üye başkanlık eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Seçim sandık kurulu, seçimlerin Kanunun öngördüğü esaslara göre yürütülmesi, yönetimi ve oyların tasnifi ile görevli olup görevleri, bu işlemler bitinceye kadar aralıksız olarak devam eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Bin kişiden fazla üyesi bulunan genel kurullarda her bin kişi için bir oy sandığı bulunur ve her seçim sandığı için ayrı bir kurul oluşturulur. İkiyüze kadar olan üye fazlalığı sandık sayısında nazara alınmaz. Sandıkların konacağı yerler hâkim tarafından belirlenir. Seçimlerde kullanılacak araç ve gereçler, seçim kurulundan sağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Oy verme işlemi genel kurul görüşmelerinden sonra başlar ve saat 17:00'ye kadar, gizli oy açık tasnif esaslarıyla devam eder. Seçim süresi sona erdiği halde sandık başında oylarını vermek üzere bekleyen üyeler de oylarını kullanırlar. Listede adı yazılı bulunmayan üye oy kullanamaz. Oylar oy verenin kimliğinin resmî bir kuruluşça verilen belge ile kanıtlanmasından ve listedeki isminin karşısındaki yerin imzalanmasından sonra kullanılır. Oylar, asıl ve yedek üyeler belirtilerek her türlü şekilde düzenlenen oy pusulalarının, üzerinde ilçe seçim kurulu mührü bulunan ve oy verme sırasında sandık kurulu başkanı tarafından verilecek zarflara konulmak suretiyle kullanılır. Bunların dışındaki zarflara konulan oylar geçersiz sayılır. Adaylar asıl ve yedek üye olarak liste halinde seçime girerlerse, tasnif sonunda en fazla oy alan listedeki asıl adaylar asıl, yedek adaylar da yedek olarak seçimi kazanmış olurlar. Liste içindeki oylara göre üyeler sıralanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Genel kurullarda oy verme işlemi alt yapı müsait olduğu takdirde elektronik ortamda gerçekleştirilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Seçim süresinin sonunda seçim sonuçları tutanakla tespit edilip sandık kurulu başkan ve üyeleri tarafından imzalanır. Birden fazla sandık bulunması halinde tutanaklar ile elektronik ortamda kullanılan oylar hâkim tarafından birleştirilir. Tutanakların birer örneği seçim yerinde asılmak ve ilgili meslek kuruluşunun Bakanlık e-esnaf ve sanatkâr sayfasında yayınlanmak suretiyle geçici seçim sonuçları ilan edilir. Kullanılan oylar ve diğer belgeler tutanağın bir örneği ile birlikte üç ay süreyle saklanmak üzere ilçe seçim kurulu başkanlığına verilir. Seçimin devamı sırasında yapılan işlemler ile tutanakların düzenlenmesinden itibaren iki gün içinde seçim sonuçlarına yapılacak itirazlar hâkim tarafından aynı gün incelenir ve kesin olarak karara bağlanır. İtiraz süresinin geçmesi ve itirazların karara bağlanmasından hemen sonra hâkim, yukarıdaki hükümlere göre kesin sonuçları ilan eder. Seçim sonuçları üst kuruluşlara ve Bakanlığa bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="12">
          <template>Hâkim, herhangi bir sebeple seçimi durdurduğu veyahut seçim sonuçlarını etkileyecek ölçüde bir usulsüzlük veya kanuna aykırı uygulama nedeniyle seçimlerin iptaline karar verdiği takdirde, ilgililer bu karara, tebliğ tarihinden itibaren üç iş günü içinde il seçim kuruluna itiraz edebilirler. İl seçim kurulu en geç iki iş günü içinde itirazı inceler ve kesin olarak karara bağlar. İptal kararının kesinleşmesi üzerine hâkim, bir aydan az ve iki aydan fazla bir süre içinde olmamak üzere seçimin yenileneceği pazar gününü tespit ederek ilgililere ve Bakanlığa bildirir. Belirlenen günde yalnız seçim yapılır ve seçim işlemleri bu madde ile Kanunun öngördüğü diğer hükümlere uygun olarak yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="13">
          <template>Seçimlerin tamamının iptali halinde seçimler yenileninceye kadar geçen sürede yönetim kurulu görevini yapmak üzere odalara birlik, birlik ve federasyonlara Konfederasyon, Konfederasyona ise Bakanlık tarafından, genel kurul üyeleri arasından üç kişilik bir kurul atanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="14">
          <template>İlçe seçim kurulu başkanı hâkime ve seçim sandık kurulu başkanı ile üyelerine, 298 sayılı Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunda belirtilen esaslara göre tavan gösterge üzerinden ücret ödenir. Bu ve diğer seçim giderleri genel kurulu yapan esnaf ve sanatkârlar meslek kuruluşu tarafından karşılanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="15">
          <template>Seçimler sırasında sandık kurulu başkan ve üyelerine karşı işlenen suçlar, kamu görevlilerine karşı işlenmiş gibi cezalandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="16">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının seçim tarihleri, Cumhurbaşkanı tarafından bir yılı geçmemek üzere ertelenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="50" başlık="Seçilme şartları">
        <mvz-fıkra no="1">
          <template>Genel kurul üyelerinin esnaf ve sanatkârlar meslek kuruluşlarına genel başkan, başkan ve yönetim, denetim, disiplin kurullarına üye olarak seçilebilmeleri için gerekli şartlar şunlardır:</template>
          <mvz-bent no="a">
            <template>Denetim kurulu üyeliği için en az lise, bu şartı taşıyan üye bulunmadığı takdirde sekiz yıllık ilköğretim veya ortaokul mezunu olmak; Konfederasyon denetim kurulu üyeliğine dışarıdan seçilecekler için dört yıllık yüksek okul mezunu ve denetim formasyonunu haiz olmak; disiplin kurulu üyeliği için en az lise mezunu olmak; yönetim kurulu üyeliği için ise en az ilkokul mezunu olmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Konfederasyon denetim kuruluna dışarıdan seçilecekler ve yeni kurulan odalar hariç, en az iki yıldır odaya kayıtlı olmak ve halen çalışıyor bulunmak.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı beş yıl veya daha fazla süreyle ya da devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama, kaçakçılık, vergi kaçakçılığı veya haksız mal edinme suçlarından hapis cezasına mahkûm olmamak.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Seçilme şartlarından bir veya birkaçını taşımadığı sonradan anlaşılanlar ile bu şartlardan en az birini görev süreleri içinde kaybedenlerin üyelikleri kendiliğinden sona erer. Bu durumda üyeliğin düşmesi ve en fazla oy alan yedek üyeden başlamak üzere yeni üyenin üyeliğe davetine ilişkin karar ve işlemler yönetim kurulunca yerine getirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="51" başlık="Organlarda görev alma yasağı">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarında denetim ve disiplin kurulu üyeliği bulunanların, aynı kuruluşun yönetim kurulunda görev almaları yasak olduğu gibi, bu kişilerin eşleri, üstsoy, altsoy ve ikinci derecedeki kan hısımlarının da aynı dönemde, bu kuruluşun yönetim, denetim ve disiplin kurullarında görev almaları yasaktır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Farklı mesleklerde faaliyet göstermelerinden dolayı birden fazla odaya kaydı olan esnaf ve sanatkârlar ancak bir odanın yönetim veya denetim kurulunda görev alabilirler. Bu kişiler, odalarda birden fazla yetkili organ üyeliği görevi alamazlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ayrıca, esnaf ve sanatkârlar meslek kuruluşlarından herhangi birisinde yönetim, denetim veya disiplin kurulu üyeliği bulunanlar, diğer esnaf ve sanatkârlar meslek kuruluşlarının yönetim, denetim veya disiplin kurullarının en fazla ikisinde daha üye olarak yer alabilirler. Bu kişiler uhdelerinde üç görevden ziyade üyelik bulunduramazlar. Aynı kişi birlik ve federasyon başkanı olamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="52" başlık="Amaç dışı faaliyet yasağı">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşları, kuruluş amaçları dışında herhangi bir faaliyette bulunamazlar. Kuruluş amaçları dışında faaliyet gösteren veya bu Kanunda belirtilen asli görevlerini Bakanlığın uyarısına rağmen yerine getirmeyen esnaf ve sanatkârlar meslek kuruluşlarının sorumlu organlarının görevlerine son verilmesine ve yerlerine yenilerinin seçilmesine Bakanlığın veya bu kuruluşların bulundukları yer Cumhuriyet Başsavcılığının istemi üzerine, o yerdeki asliye hukuk mahkemesince karar verilir. Yargılama, basit yargılama usulüne göre yapılır ve en geç iki ay içinde sonuçlandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Görevlerine son verilen organların yerine, bu Kanundaki usul ve esaslara göre, en geç bir ay içinde yapılacak genel kurul ile yenileri seçilir. Yeni seçilenler eskilerin süresini tamamlar. Görevlerine son verilen organ üyelerinin cezai sorumlulukları saklıdır. Bu organların yukarıdaki hükümler gereğince görevlerine son verilmesine neden olan ve mahkeme kararında belirtilen tasarrufları hükümsüzdür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Esnaf ve sanatkârlar meslek kuruluşları, millî güvenliğin, kamu düzeninin, suç işlenmesini veya suçun devamını önlemenin yahut yakalamanın gerektirdiği hallerde gecikmede sakınca varsa, valilik tarafından faaliyetten men edilebilir. Faaliyetten men kararı, yirmidört saat içinde görevli hâkimin onayına sunulur. Hâkim, kararını kırksekiz saat içinde açıklar. Aksi halde bu idari karar kendiliğinden yürürlükten kalkar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Toplantılar, Temsil ve İlzam, Huzur Hakkı ve Aylık Ücretler, Genel Sekreterler">
      <mvz-madde no="53" başlık="Yönetim kurulu toplantıları ve kararları">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının yönetim kurulları en az ayda bir toplanır. Yönetim kurulu, gerek görülmesi halinde başkanın veya üyelerinin çoğunluğunun ya da denetim kurulu çoğunluğunun çağrısıyla her zaman toplanabilir. Yönetim kurulu toplantılarının çağrısı üyelere yazılı olarak yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yönetim kurulu, üye tam sayısının çoğunluğu ile toplanır ve hazır bulunanların çoğunluğu ile karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mazeretsiz olarak üst üste üç toplantıya iştirak etmeyen üyeler yönetim kurulu üyeliğinden çekilmiş sayılır. Yönetim kurulu üyeleri arasında eksilme olduğu takdirde, yedek üyelerden genel kuruldaki seçimde en fazla oy alanlar, oyların eşitliği halinde ise listeye göre sırayla yönetim kuruluna getirilir ve yeni üye ilk toplantıya yazılı olarak çağrılır. Yeni üyenin iştiraki sağlanmadan yönetim kurulu toplantısı yapılamaz. Bu üyenin toplantıya icabet etmemesi halinde sonraki üye çağrılarak yönetim kurulu üye sayısı tamamlandıktan sonra toplantı yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yönetim kurulu üyelerinin toplu olarak görevden ayrılması veya asıl üye sayısının yarıdan aşağıya düşmesi ve yedeklerinin de kalmaması halinde; üç ay içinde yapılacak seçimlere kadar, odalar birlik tarafından, birlikler ve federasyonlar Konfederasyon tarafından, Konfederasyon ise Bakanlık tarafından görevlendirilecek üç kişilik bir kurul tarafından yönetilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="54" başlık="Başkan, temsil ve ilzam">
        <mvz-fıkra no="1">
          <template>Oda, birlik, federasyon başkanı ve Konfederasyon genel başkanı, genel kurul tarafından tek dereceli olarak seçilir; bunlar aynı zamanda ilgili esnaf ve sanatkârlar meslek kuruluşunun yönetim kurulu üyesi ve başkanıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel başkan veya başkanın herhangi bir sebeple görevinden ayrılması durumunda, yönetim kurulu kalan süreyi tamamlamak üzere kendi aralarından birisini başkan olarak seçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının yönetim kurulu üyeleri kendi aralarından, odalarda bir başkan vekili; oda sayısı 50 ve daha az olan birliklerde bir başkan vekili, 51-100 olan birliklerde iki başkan vekili, 101 ve daha fazla olan birliklerde üç başkan vekili; federasyonlarda iki başkan vekili; Konfederasyonda ise dört genel başkan vekili seçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarını temsil ve ilzama başkan yetkilidir. Başkanın bulunmadığı zamanlarda, yönetim kurulunca yetkilendirilmiş olan başkan vekili temsil ve ilzam görevini ifa eder. Esnaf ve sanatkârlar meslek kuruluşlarını, başkan veya başkan vekili ile genel sekreterin müşterek imzaları bağlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="55" başlık="Denetim kurulu toplantıları">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının denetim kurulları kendi üyeleri arasından bir başkan seçer. Denetim kurulları ayda bir toplantı yaparlar. Denetim kurulları yaptıkları denetimlerin sonucunu üç ayda bir yönetim kurullarına, dönem sonunda da genel kurula rapor halinde sunarlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mazeretsiz olarak üst üste üç toplantıya iştirak etmeyen üyeler denetim kurulu üyeliğinden çekilmiş sayılır. Denetim kurulu üyeleri arasında eksilme olduğu takdirde, yedek üyelerden genel kuruldaki seçimde en fazla oy alanlar, oyların eşitliği halinde ise listeye göre sırayla denetim kurulunca yazılı olarak denetim kuruluna çağrılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Denetim kurullarının asıl ve yedek üyelerinin tamamının görevden ayrılmaları ve yedeklerinin de kalmaması halinde ilk seçime kadar odalarda birlik, birlik ve federasyonlarda Konfederasyon, Konfederasyonda ise Bakanlık tarafından bir denetçi atanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="56" başlık="Aylık ücretler ve huzur hakları">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının yönetim kurulu üyelerinin huzur hakları, yönetim kurulu başkanı ve başkan vekilleri ile denetim kurulu ve disiplin kurulu üyelerine verilecek aylık ücretler ile merkez dışından genel kurul, başkanlar kurulu, yönetim kurulu, denetim kurulu ve disiplin kurulu toplantılarına katılacak üyelere ve bunların görevlendirilmelerinde ödenecek yolluk ve konaklama ücretleri, aşağıda belirtilen hadleri aşmamak kaydıyla ilgili esnaf ve sanatkârlar meslek kuruluşlarının genel kurullarınca belirlenir.</template>
          <mvz-bent no="a">
            <template>Yönetim kurulu başkanlarına;</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Odalarda üye sayısı 100-500 olan odalarda asgari ücret, 501-1500 olan odalarda asgari ücretin iki katı, 1501-3000 olan odalarda asgari ücretin üç katı, 3001-10000 olan odalarda asgari ücretin dört katı, 10001 ve daha fazla üyesi olan odalarda asgari ücretin beş katı,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Birliklerde üye oda sayısı 25'e kadar olanlarda asgari ücretin üç katı, 26-50 olanlarda asgari ücretin dört katı, 51-100 olanlarda asgari ücretin beş katı, 101-150 olanlarda asgari ücretin altı katı, 151 ve daha fazla olanlarda asgari ücretin yedi katı,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Federasyonlarda üye oda sayısı 50'ye kadar olanlarda asgari ücretin beş katı, 51-100 olanlarda asgari ücretin altı katı, 101 ve daha fazla olanlarda asgari ücretin yedi katı,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Konfederasyonda Genel başkana asgari ücretin on katı,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yönetim kurulu başkan vekillerine; (a) bendinde belirtilen miktarların 2/4'ü,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Denetim kurulu üyelerine; (a) bendinde belirtilen ücretlerin 1/4'ü,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Disiplin kurulu üyelerine; (a) bendinde belirtilen ücretlerin 1/4'ü,</template>
          </mvz-bent>
          <mvz-bent no="0">
            <template>Aylık ücret,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Aylık ücret almayan yönetim kurulu üyelerine katıldıkları toplantı başına (a) bendinde belirtilen ücretlerin 1/5'i huzur hakkı,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Alırlar. Bu ücretler brüt asgari ücret üzerinden net olarak ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının yetkili organ üyelerinin yurt içi harcırahları, asgari ücretin 1/5'inden, yurt dışı harcırahları ise en yüksek Devlet memuruna ödenen günlük harcırahtan fazla olamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarında birden fazla organda görevli olanlar, bu görevlerine ait ücretlerden yüksek olanı alırlar. Organ üyeleri, meslek kuruluşları iştiraklerinden en fazla birinden ücret alabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Aylık ücret alanlara huzur hakkı ödenmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Esnaf ve sanatkârlar meslek kuruluşları personelinin işe alınmalarına ve ücretlerinin belirlenmesine yönetim kurulu karar verir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="57" başlık="Genel sekreterler">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının işlemlerini, mevzuat, ana sözleşmeleri ve yönetim kurulu kararları doğrultusunda yürütmekle görevli bir genel sekreter bulunur. Genel sekreterler birden fazla esnaf ve sanatkârlar meslek kuruluşunda görev yapamazlar. Genel sekreter yönetim kurulu toplantılarına katılır, ancak oy kullanamaz. İhtiyaç duyulması halinde onbinden fazla üyesi olan odalar ile birlik ve federasyonlarda bir, Konfederasyonda üç genel sekreter yardımcısı çalıştırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Giderler, başkan veya vekili ile genel sekreterin ortak imzasıyla yapılır. Esnaf ve sanatkârlar meslek kuruluşları adına yazılacak yazılar da aynı şekilde imzalanır. Ancak, yönetim kurulu kuruluş içi konularda genel sekretere tek başına imza yetkisi verebilir. Konfederasyon genel sekreteri, yönetim kurulunun izni ile harcama yetkisi dahil, görev ve yetkilerinden bir bölümünü her yıl başında yeniden tespit edilmek kaydıyla yardımcılarına devredebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel sekreterin atanması, terfi, cezalandırılması ve görevine son verilmesi yönetim kurulu kararı ile yapılır. Yönetim ve denetim kurulu üyeleri ve bunların eşleri, çocukları ve çocuklarının eşleri genel sekreter olarak atanamaz. Genel sekreterin tezkiye amiri ise ilgili meslek kuruluşunun başkanıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Genel sekreter, personelin birinci tezkiye amiri olup personelin atanma, terfi, cezalandırma ve işten uzaklaştırma işlemleri teklifi üzerine yönetim kurulunca yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Birlik genel sekreterleri birliğe üye odaların genel sekreterleri ile temmuz ve aralık aylarında, birlik başkanının gözetiminde yılda en az iki defa eğitim ve değerlendirme toplantısı yaparlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Genel sekreter ve genel sekreter yardımcısı olarak atanacakların 657 sayılı Devlet Memurları Kanununun 48 inci maddesindeki genel şartları taşımaları gerekli olup; bu şartları taşımayanlar, genel sekreter ve genel sekreter yardımcısı olarak atanamaz. Bu şartları taşımadıkları sonradan anlaşılanların ise görevlerine son verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Birlik ve federasyon genel sekreter ve yardımcılarının en az iki yıllık yüksek okul mezunu olmaları, oda genel sekreter ve yardımcılarının en az lise ve dengi okul mezunu olması, Konfederasyon genel sekreteri ve yardımcılarının ise, üniversitelerin işletme, iktisat, hukuk, siyasal bilgiler, iktisadi ve idari bilimler fakülteleri mezunu veya muadili bir alanda yüksek tahsil yapmış olması şarttır. Genel sekreterlerin iktisadi ve idari sahada tatbiki bilgi ve tecrübe sahibi olmaları ile yabancı dil bilmeleri tercih sebebidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Denetim, Kullanılacak Defterler, Aidatlar ve Belge Ücretleri, Ücret Tarifeleri">
      <mvz-madde no="58" başlık="Denetim">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşları ile sicil işlemleri Bakanlık gözetim ve denetimine tabidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının ilgili personeli ile organlarında görevli üyeleri, Bakanlık denetim elemanlarının talebi üzerine kuruluşa ait her türlü evrak, defter ve kayıtları göstermeye veya vermeye, para ve diğer varlıkların sayılmasına müsaade etmeye, denetim ve incelemeleri için yardımda bulunmaya ve çalışmalarını yapabilecekleri uygun bir yer tahsis etmeye mecburdurlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu yükümlülükleri yerine getirmeyen veya 59 uncu maddede belirtilen suçlardan dolayı haklarında kovuşturmaya başlanan ve görevi başında kalması denetim ve soruşturmanın yapılması bakımından sakıncalı görülen esnaf ve sanatkârlar meslek kuruluşlarının personeli Bakanlık denetim elemanlarınca doğrudan görevden uzaklaştırılabilir. Organ üyelerinin görevden uzaklaştırılmaları ise denetim elemanlarının teklifi sonucu Bakanlık veya Cumhuriyet Savcılığı tarafından yetkili asliye hukuk mahkemesinde açılan dava üzerine mahkemece bir ay içinde basit usulde yargılama yapılarak karara bağlanır. Mahkeme dava sonucunu Bakanlık, ilgili oda ve üst kuruluşa bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Görevden uzaklaştırılanlar hakkında kovuşturmaya yer olmadığı kararı verildiği ya da mahkumiyet kararı verilmediği takdirde, bu kimseler tekrar görevlerine dönerler ve bunların görevden uzak kaldıkları devreye ait ücretleri yasal faizleri ile birlikte, mensup oldukları kuruluşlarca tam olarak ödenir. Denetim sonucunda düzenlenen evrakın denetim elemanı tarafından o yerin Cumhuriyet Başsavcılığına gönderilmesi üzerine Bakanlık davada müdahil sıfatını kazanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Odaların sadece üye kayıtları ve belgeleri, sigortalılık yönünden gerektiğinde Esnaf ve Sanatkârlar ve Diğer Bağımsız Çalışanlar Sosyal Sigortalar Kurumu denetim elemanları tarafından denetlenebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="59" başlık="Cezai takibat">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının yetkili organlarının üyeleri ve genel sekreterleri ile personeli, görevlerini yerine getirirken görevleriyle ilgili suç teşkil eden fiil ve hareketlerinden ve özellikle bu kuruluşların paraları ile para hükmündeki evrak, senet ve diğer malları aleyhine, bilanço, kesin hesap, rapor, diğer her çeşit evrak ve defterleri üzerinde suç işledikleri takdirde, bu suçlardan dolayı, adli olarak kamu görevlileri gibi ceza görürler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="60" başlık="Kullanılacak beyanname, defter ve makbuzlar">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarında kullanılacak defter, belge, beyanname, makbuz ve fişler şunlardır:</template>
          <mvz-bent no="a">
            <template>Üye kayıt defteri.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Üye kayıt beyannamesi.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Genel kurul karar defteri.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Başkanlar kurulu karar defteri.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Yönetim kurulu karar defteri.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Denetim kurulu karar defteri.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Disiplin kurulu karar defteri.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Gelenek ve teamül defteri.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Demirbaş defteri.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Gelen ve giden evrak kayıt defteri.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Mevzuata uygun muhasebe defterleri.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Kasa defteri.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Gelir ve gider defteri.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Kıymetli evrak defteri.</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Gelir ve gider makbuzu.</template>
          </mvz-bent>
          <mvz-bent no="p">
            <template>Tahsil ve tediye fişi.</template>
          </mvz-bent>
          <mvz-bent no="r">
            <template>Hizmetin gerektirdiği diğer defter ve belgeler.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanuna tabi meslek kuruluşlarında kullanılacak defter, beyanname, makbuz, fiş ve belgeler ile oda üyelerinin mesleklerinin icrası nedeniyle resmî kurum ve kuruluşlara verecekleri belgelerin basım ve dağıtımında Konfederasyon yetkilidir. Bu belgelerden Bakanlık e-esnaf ve sanatkâr veri tabanından elektronik ortamda düzenlenenlerinin bedeli, bunu düzenleyen esnaf ve sanatkârlar meslek kuruluşunca Konfederasyona ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Defter, beyanname, makbuz, fiş ve diğer belgeleri yetkisiz olarak basan, bastıran, dağıtan, değişik yollardan çoğaltan ve kullananlar bu fiillerinden dolayı Konfederasyonun ilgili Cumhuriyet savcılıklarına başvurusu üzerine, genel hükümler çerçevesinde sorumlu olurlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="61" başlık="Kayıt ücreti, aidat, katılma payı, düzenlenecek belge ve hizmet ücretleri">
        <mvz-fıkra no="1">
          <template>Üyelerin odalara, odaların birlik ve federasyonlara, birlik ve federasyonların Konfederasyona ödeyeceği kayıt ücreti, yıllık aidat ve katılma payları ile esnaf ve sanatkârlar meslek kuruluşlarının düzenledikleri belge ve yaptıkları hizmet karşılığı ücretler şunlardır:</template>
          <mvz-bent no="a">
            <template>Üyenin sicile ilk kayıt yapılması sırasında ödeyeceği kayıt ücreti, asgari ücretin onda birinden az, yarısından fazla olamaz. Kayıt ücreti, esnaf ve sanatkârların sicil kaydı esnasında sicil müdürlüğü tarafından tahsil edilir; kayıt ücretinin yarısı sicil ihtiyacında kullanılmak üzere birlik adına açılacak banka hesabına, diğer yarısı ise ilgili odanın banka hesabına aktarılır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Üyenin odaya ödeyeceği yıllık aidat, asgari ücretin onda birinden az, yarısından fazla olamaz. Kayıt ücretinin alındığı yıl için ayrıca yıllık aidat alınmaz.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Odaların birlik ve üyesi oldukları federasyonlara, birlik ve federasyonların Konfederasyona ödeyecekleri kayıt ücreti, asgari ücretin yarısından az, tamamından fazla olamaz.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Odaların birlik ve üyesi oldukları federasyonlara, birlik ve federasyonların Konfederasyona, her yıl ödeyecekleri katılma payı, ödemeyi yapacak esnaf ve sanatkârlar meslek kuruluşunun bir önceki yıl gayri safi gelirlerinin % 3'üdür. Katılma payı hesaplamasında; bu Kanuna göre üst kuruluşlardan satın alınan evrakın maliyet bedeli ile bu Kanun dışındaki diğer kanuni düzenlemeler nedeniyle elde edilen gelirlerin maliyet bedelleri ve bunlar için yapılan giderler gayri safi gelirden mahsup edilir.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Esnaf ve sanatkârlar meslek kuruluşlarının düzenledikleri ve onayladıkları belgeler ile yaptıkları hizmet karşılığında alacakları ücretlerin miktar ve oranı; maktu olanlarda bu fıkranın (a) ve (b) bentleri uyarınca belirlenecek miktarın onda birinden, nispi olanlarda ise belgede geçen değerin binde onundan fazla olamaz.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Esnaf ve sanatkârlar meslek kuruluşları tarafından tahsil edilen her türlü gelir, tahsilatı yapan ilgili meslek kuruluşunun banka hesabına yatırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Esnaf ve sanatkârlar meslek kuruluşları ve sicil müdürlüğü hesabına intikal eden paraların meslek kuruluşlarına aktarılacak miktarları, elektronik ortamda tahsil edildikleri anda ilgili meslek kuruluşunun banka hesabına intikal ettirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kayıt ücreti kayıt esnasında, yıllık aidat nisan ve ekim aylarında iki eşit taksitte ödenir. Oda kaydını sildiren üyelerin aidatı üye kaydının silindiği ay itibarıyla alınır. Süresi içinde ödenmeyen yıllık aidat ve katılma payları için esnaf ve sanatkârlar meslek kuruluşları yönetim kurullarınca verilen kararlar ilam hükmünde olup icra dairelerince yerine getirilir. Gecikme zammı, yıllık aidatın ve katılma payının bir mislini geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Yıllık aidatlarını ödemeyen üyelere, ödeme yapılıncaya kadar odaca yapılacak hizmetler ile düzenlenecek ve onanacak belgeler verilmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="62" başlık="Fiyat tarifelerinin tespit şekli">
        <mvz-fıkra no="1">
          <template>Bu Kanuna tabi esnaf ve sanatkârlarca üretilen mal ve hizmetlerin fiyat tarifeleri, bağlı bulundukları odalarca hazırlanır ve odanın mensubu olduğu birlik yönetim kurulu tarafından fiyat tarifesinin sunulmasından sonra otuz gün içinde onaylanır veya reddedilir. Onaylanan fiyat tarifesi belediye, mülki amirlik ve ilgili odaya yedi gün içerisinde bildirilir ve bu andan itibaren yürürlüğe girer. Fiyat tarifeleri, uygulanacak azami hadleri gösterir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Belediyeler veya o yerin en büyük mülki amiri tespit edilen bu tarifeleri uygun bulmadıkları takdirde esnaf teşekkülü ile anlaşmaya varamazlarsa onbeş gün içinde o yerin mülki amirinin ya da görevlendireceği yardımcısının başkanlığında, ticaret ve sanayi veya ticaret odasından bir temsilci ile esnaf ve sanatkârlar odaları birliği temsilcisinden teşekkül edecek bir komisyonda görüşülüp karar verilmesini isteyebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Komisyon kararları salt çoğunlukla alınır. Komisyon, tarifeleri uygun bulmadığı takdirde tarife yürürlükten kalkar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Komisyon kararına karşı, ilgililer yazılı bildirim tarihinden itibaren on gün içinde ticari davaları görmeye yetkili mahkeme nezdinde itirazda bulunabilirler. Bu mahkemenin kararı kesindir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Esnaf ve Sanatkâr ile Tacir ve Sanayiciyi Belirleme Koordinasyon Kurulu, Mutabakat Komiteleri">
      <mvz-madde no="63" başlık="Esnaf ve Sanatkâr ile Tacir ve Sanayiciyi Belirleme Koordinasyon Kurulu">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkâr meslek kollarını belirlemek ve yıllık gayri safi gelirleri ve bölgelerin özelliklerine göre esnaf ve sanatkârlar ile tacir ve sanayicinin ayrımını yapmak, 6762 sayılı Türk Ticaret Kanununun 1463 üncü maddesinde Bakanlar Kurulunca çıkarılması öngörülen karar taslağını hazırlayarak Bakanlığa sunmak üzere; Bakanlık Müsteşarı veya ilgili müsteşar yardımcısının başkanlığında, Bakanlık, Maliye, Millî Eğitim, Çalışma ve Sosyal Güvenlik bakanlıklarının ilgili genel müdürleri ile Devlet Planlama Teşkilatı Müsteşarlığının bir temsilcisi ile Türkiye Odalar ve Borsalar Birliğini temsilen katılan bir temsilci ve Konfederasyonu temsilen katılan bir temsilciden oluşan Esnaf ve Sanatkâr ile Tacir ve Sanayiciyi Belirleme Koordinasyon Kurulu kurulmuştur. Kurulun sekretarya hizmetleri Genel Müdürlük tarafından yürütülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="64" başlık="Mutabakat komiteleri">
        <mvz-fıkra no="1">
          <template>Bu Kanuna tabi odalar arasında veya bu odalar ile Türkiye Odalar ve Borsalar Birliği bünyesindeki odalar arasında üye kayıt zorunluluğu bakımından çıkacak anlaşmazlıkları çözümlemek üzere il ve ilçelerde mutabakat komiteleri kurulur. Bu komiteler anlaşmazlıkları, Esnaf ve Sanatkâr ile Tacir ve Sanayiciyi Belirleme Koordinasyon Kurulunun belirleyeceği esaslar dahilinde çözüme kavuştururlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mutabakat komiteleri;</template>
          <mvz-bent no="a">
            <template>Bu Kanuna tabi odalar arasında üye kayıt zorunluluğu bakımından çıkacak anlaşmazlıkları çözümlemek üzere, İl ve ilçelerde mülkî amirin başkanlığında ilgili odaların ve birliğin birer temsilcisinden oluşur, oyların eşitliği halinde başkanın oyu iki sayılır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bu Kanuna tabi odalar ile Türkiye Odalar ve Borsalar Birliği bünyesindeki odalar arasında üye kayıt zorunluluğu bakımından çıkacak anlaşmazlıkları çözümlemek üzere, il ve ilçelerde mülki amirin başkanlığında illerde birlik, ilçelerde ilgili oda ile ticaret veya ticaret ve sanayi odalarının birer temsilcisinden oluşur.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Komite kararlarına karşı ilgililer tarafından on gün içinde yetkili Asliye Hukuk Mahkemesine itiraz edilebilir. Mahkemenin kararı kesindir. Kesinleşen mahkeme kararı üzerine ilgili sicil müdürlükleri kayıtlarında gerekli işlemi yapmak zorundadırlar.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Muafiyetler ve Listeler">
      <mvz-madde no="65" başlık="Muafiyetler">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının, kuruluş amaçlarını gerçekleştirmek ve bu amaçlarına uygun olarak kullanılmak üzere iktisap ettikleri ve edecekleri gayrimenkuller ile bu kuruluşların görevleri dolayısıyla elde ettikleri gelirler, katma değer vergisi ve emlak vergisi hariç her türlü vergi, resim ve harçtan müstesnadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="66" başlık="Listeler">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının olağan ve olağanüstü genel kurul toplantılarına katılacak üyeleri belirleyen ve seçim kuruluna verilecek olan genel kurul toplantısına katılacaklar listesi, Maliye Bakanlığı ile Konfederasyonun görüşü alınarak Bakanlıkça belirlenen ücret karşılığında ilgili esnaf ve sanatkâr meslek kuruluşu tarafından Bakanlık e-esnaf ve sanatkâr veri tabanından temin edilir. Tahsil edilen ücret tutarları bütçeye gelir kaydedilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Esnaf ve Sanatkârlar Sicili">
    <mvz-madde no="67" başlık="Sicil teşkilatı ve personeli">
      <mvz-fıkra no="1">
        <template>Esnaf ve sanatkârların sicillerinin, sağlıklı ve güvenli bir şekilde Bakanlık e-esnaf ve sanatkâr veri tabanında tutulması ve yayınlanmasını teminen ticaret davalarına bakan asliye hukuk mahkemeleri gözetiminde ve kurulu bulunduğu il idari sınırları içerisinde çalışmak üzere birlik bünyesinde ayrı bir birim olarak Esnaf ve Sanatkâr Sicil Müdürlüğü kurulur. Sicilin personel ücretleri ve diğer giderleri birlik tarafından karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sicil işlemleri birlik yönetim kurulunun teklif edeceği aday veya adaylar arasından Bakanlık tarafından onaylanacak sicil müdürleri tarafından yürütülür. Sicil müdürlerinin en az ön lisans diplomasına sahip olmaları ve 657 sayılı Devlet Memurları Kanununun 48 inci maddesindeki genel şartları haiz bulunmaları gereklidir. Gerek görülmesi halinde en az lise mezunu olmak kaydı ile sicil müdürüne yardımcı olacak personelin ataması birlik yönetim kurulunca yapılır ve Bakanlığa bilgi verilir. Sicil müdürlerinin ve personelinin görevden alınmaları atanmalarındaki usule tabidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bakanlık, sicil müdürlerinin ve diğer sicil personelinin işlemlerini her zaman denetlemeye ve görevden alınmasını ilgili birlik yönetim kurulundan istemek de dahil olmak üzere gerekli tedbirleri almaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sicil müdürleri, sicil kayıtlarını mevzuata ve gerçeklere uygun olarak tutmak ve izlemekle görevli ve sorumludur. Sicil kayıtları üzerinde suç işledikleri belirlenen sicil teşkilatı personeli hakkında bu suçlarından ve diğer mevzuata aykırı işlemlerinden dolayı kamu görevlileri hakkındaki cezalar uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Türk Ticaret Kanununun, ticaret siciline ilişkin 26 ila 40 ıncı maddelerinin bu Kanuna aykırı olmayan hükümleri Esnaf ve Sanatkâr Sicil Müdürlüğü hakkında da uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="68" başlık="Sicile kayıt mecburiyeti ve sicil işlemleri">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki esnaf ve sanatkârlar, yanlarında çalışanlar hariç, çalışmaya başladıkları tarihten itibaren durumlarını otuz gün içinde bağlı bulundukları sicile tescil ve Sicil Gazetesinde ilan ettirmekle yükümlüdürler. Bu yükümlülüğü yerine getirmediği tespit edilenler birlik tarafından ruhsat vermekle yetkili ilgili kurum ve kuruluşlara bildirilir. İlgili kurum ve kuruluşlar, sicil kaydı yapılana kadar bunların faaliyetlerini durdurur.  Sicil ve oda tarafından, esnaf ve sanatkârlardan kayıt sırasında 5/6/1986 tarihli ve 3308 sayılı Meslekî Eğitim Kanununda öngörülen ustalık belgesi veya muadili belgeler istenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Esnaf ve sanatkârların sicile kayıtlarında, kendilerinin vergi mükellefi ya da vergiden muaf olduklarının belgelenmesi istenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Esnaf ve sanatkârların meslekî faaliyette bulunabilmeleri ve ilgili odaya kaydedilmeleri için sicile kayıtları şarttır ve sicile her bir meslek için ayrı kayıt yapılması gereklidir. Sicile kaydı yapılan esnaf ve sanatkârların ilgili odaya kayıt için bilgilerinin gönderilmesi, sicil tarafından elektronik ortamda Bakanlık e-esnaf ve sanatkâr veri tabanında gerçekleştirilir. Esnaf ve sanatkârlar kayıt beyannamelerindeki hususlarda meydana gelen değişiklikleri en geç otuz gün içinde sicile bildirmek zorundadırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Esnaf ve sanatkâr siciline kayıtlı iken, daha sonraki yıllarda yıllık alış veya satış tutarları ya da gayri safi iş hasılatı, esnaf ve sanatkâr sayılma hadlerini aşanlar kendileri istemedikçe ticaret siciline ve dolayısıyla Türkiye Odalar ve Borsalar Birliği bünyesindeki odalara kayda zorlanamazlar. Ancak, yıllık alış veya satış tutarları ya da gayri safi iş hasılatı, esnaf ve sanatkâr sayılma hadlerinin altı katını aşanların kayıtları, sicil marifetiyle ticaret siciline aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tescili gerektiren olay veya işlemlerin tamamen veya kısmen sona ermesi veya ortadan kalkması halinde sicildeki kayıt ilgilinin talebi üzerine kısmen veya tamamen silinir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Sicil müdürü tarafından öldüğü belirlenen ve varisleri tespit edilemeyen esnaf ve sanatkârların sicil kayıtlarının silinmesi ve bu hususun Sicil Gazetesinde ilanı doğrudan ve ücretsiz olarak yapılır. Bu durumdaki işlemlerden 492 sayılı Harçlar Kanununda belirtilen harçlar tahsil edilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Sicil işlemleri, sicil müdürleri ve personeli tarafından elektronik ortamda Bakanlık e-esnaf ve sanatkâr veri tabanında gerçekleştirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="69" başlık="Kayıt ve tescil harcı">
      <mvz-fıkra no="1">
        <template>Esnaf ve sanatkârların sicile kayıt ve tescil harçlarının tutarı 492 sayılı Harçlar Kanununun Ticaret Sicili Harçları hükümlerine göre hesap edilecek harcın yarısıdır.  Alınan bu harcın red ve iadeler düşüldükten sonra kalan tutarının yüzde 25’i ilgili birliğe gelir kaydedilmek üzere aktarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="70" başlık="Sicil Gazetesi">
      <mvz-fıkra no="1">
        <template>Sicile kayıt edilen ve ilanı gereken hususlar, Bakanlığın gözetim ve denetimi altında Konfederasyon tarafından Bakanlık e-esnaf ve sanatkâr veri tabanı kullanılarak elektronik ortamda Türkiye Esnaf ve Sanatkârlar Sicil Gazetesinde yayınlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sicil Gazetesinin çıkarılmasına ilişkin esasları tespit, yayım işlerini sevk ve idare etmek ve Bakanlık ile Konfederasyon arasındaki çalışmaları koordine etmek üzere; Esnaf, Sanatkârlar ve Kooperatifçilik Genel Müdürü başkanlığında, Esnaf, Sanatkârlar ve Kooperatifçilik Genel Müdürlüğünde görevli en fazla üç genel müdür yardımcısı ile Konfederasyon genel sekreteri, genel sekreter yardımcısı ve Sicil Gazetesi müdüründen oluşan Sicil Gazetesi komitesi kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sicil Gazetesinde yayınlanacak ilan ücretleri Sicil Gazetesi komitesinin teklifi ve Bakanlığın onayı ile yürürlüğe girecek bir tarife ile belirlenir. Sicil Gazetesi ilan ücretleri sicil tarafından elektronik ortamda tahsil edilir ve Sicil Gazetesi hesabına elektronik ortamda aktarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Eğitim">
    <mvz-madde no="71" başlık="Eğitimin kapsamı, pratik meslek eğitimi ve denetimi">
      <mvz-fıkra no="1">
        <template>Bu Kanunun meslekî eğitime ilişkin hükümleri ile 3308 sayılı Meslekî Eğitim Kanununun esnaf ve sanatkâr kesimindeki pratik meslek eğitimini düzenleyen hükümleri Bakanlık, Millî Eğitim Bakanlığı ve Konfederasyonun işbirliği ile bütünlük içinde yürütülür. Esnaf ve sanatkârların meslekî eğitimleri, esnaf ve sanatkârlar meslek kuruluşları ile Millî Eğitim Bakanlığı Çıraklık ve Yaygın Eğitim Genel Müdürlüğü tarafından ortaklaşa planlanır, yürütülür, değerlendirilir ve denetlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="72" başlık="Eğitimin organizasyonu">
      <mvz-fıkra no="1">
        <template>Bu Kanunda ve 3308 sayılı Meslekî Eğitim Kanununda belirlenen amaçlar doğrultusunda esnaf ve sanatkârlar ile yanlarında çalışan çırak ve kalfaların, pratik meslek eğitimini gerçekleştirmek, her kademedeki esnaf ve sanatkârlar meslek kuruluşlarının asli görevidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Esnaf ve sanatkârlar ile yanlarında çalışan çırak ve kalfaların, meslekî eğitimlerini organize etmek için esnaf ve sanatkârlar meslek kuruluşlarının bünyesinde birer meslekî eğitim danışmanlığı birimi kurulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="73" başlık="Meslek Eğitimi Fonu">
      <mvz-fıkra no="1">
        <template>Esnaf ve sanatkârların her türlü meslek eğitimi faaliyetini gerçekleştirmek ve desteklemek amacıyla Konfederasyon bünyesinde Meslek Eğitimi Fonu kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Fonun kaynakları;</template>
        <mvz-bent no="a">
          <template>Konfederasyon bütçesine her yıl bu amaçla konacak ödenekler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Esnaf ve sanatkârlar meslek kuruluşlarının eğitim bütçelerinden ödeyecekleri paylar,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yapılacak bağışlar ve diğer gelirlerden,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Fonda toplanan kaynak, sadece esnaf ve sanatkâr kesimine yönelik yapılacak meslekî eğitim ile bu eğitimin geliştirilmesi ve yaygınlaştırılması amacıyla kullanılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="74" başlık="Meslek eğitiminin finansmanı">
      <mvz-fıkra no="1">
        <template>Esnaf ve sanatkârlar meslek kuruluşları bu Kanunda belirtilen meslek eğitimine ilişkin görevleri yerine getirmek için, katılma paylarının hesaplanmasında kullanılan yöntem esas alınarak, yıllık gayri safi gelirlerinin % 5'ini ayırmak suretiyle eğitim bütçesi yapmak zorundadırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Odalar ayırdıkları bu payın beşte birini birliğe, beşte birini varsa federasyona, beşte birini Konfederasyon bünyesindeki Meslek Eğitimi Fonuna, hesap yılını takip eden mart ayı sonuna kadar öderler. Geri kalan miktarı da kendileri meslekî eğitim için kullanırlar. Birlik ve federasyonlar ayırdıkları bu payın beşte birini Konfederasyon bünyesindeki Meslek Eğitimi Fonuna öderler, geri kalan miktarı da kendileri meslekî eğitim için kullanırlar. Konfederasyon ise ayırdığı payın tamamını Fona aktarır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="6-ALTINCI" başlık="Yönetmelikler, Geçici ve Son Hükümler">
    <mvz-madde no="75" başlık="Yönetmelikler">
      <mvz-fıkra no="1">
        <template>Bu Kanunun;</template>
        <mvz-bent no="a">
          <template>4 üncü maddesindeki karma odalarda kurulacak meslek komitelerinin kuruluşu ile çalışma usul ve esasları Konfederasyon tarafından,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>47 nci maddesindeki, Bakanlık temsilcisinin veya hükümet komiserinin görevlendirilmesi, görev ve yetkileri ile bunlara ödenecek ücretler Bakanlık tarafından,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>49 uncu maddesinde belirtilen genel kurullarda oy verme işleminin elektronik ortamda yapılması ile ilgili usul ve esaslar Bakanlık tarafından,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>60 ıncı maddesindeki, esnaf ve sanatkârlar meslek kuruluşlarınca kullanılacak defter ve makbuzlar ile faaliyet konularına ve mevzuata uygun nitelikte muamelat, muhasebe, personel işlemlerinin usul ve esasları Konfederasyon tarafından,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>61 inci maddesindeki, kayıt ücretleri ve yıllık aidatlar ile esnaf ve sanatkârlar meslek kuruluşlarının düzenleyecekleri belgeler ve yaptıkları hizmet karşılığında anılan maddede belirtilen hadler içinde kalmak kaydıyla iller ve meslek gruplarının özellikleri dikkate alınarak belirlenecek tarifelere göre tahsil edecekleri ücretler Konfederasyon tarafından,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>62 nci maddesindeki, fiyat tarifelerinin düzenleme usul ve esaslarının tayin ve tespiti Konfederasyon tarafından,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>63 üncü maddesindeki, Esnaf ve Sanatkâr ile Tacir ve Sanayiciyi Belirleme Koordinasyon Kurulunun çalışma usul ve esasları Bakanlık tarafından,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>67, 68 ve 69 uncu maddelerinde yer alan, sicil işlemlerinin nasıl yürütüleceği, defter ve kayıtların ne şekilde tutulacağı, hangi hususların tescil ve ilan edileceği; resen kayıt ve terkin işlemleri, sicilin denetimi, sicil memurlarına itiraz yolları, sicil personelinin nitelikleri, sorumluluğu Bakanlık tarafından,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>70 inci maddesindeki, Sicil Gazetesinin çıkarılması ve idare şekli, giderlerinin karşılanması, gelirlerinin tahsili ve sarfı, ilan ve ücret tarifesi, kayıtlarının tutulması, muamelat ve muhasebe işlemlerinin yürütülmesi usul ve esasları ile Sicil Gazetesi komitesi üyelerine Sicil Gazetesi gelirlerinden karşılanmak ve net aylık miktarı asgari ücret tutarını geçmemek üzere ödenecek huzur hakları Bakanlık tarafından,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>71, 72 ve 73 üncü maddelerinde yer alan pratik eğitimin verileceği iş yerleri ve bunların denetimine ilişkin hükümlerinin usul ve esasları ve 3308 sayılı Meslekî Eğitim Kanununun uygulanmasında henüz kapsam içine alınmamış il ve meslek dallarında yapılacak uygulama ve verilecek belgeler ile Meslek Eğitimi Fonunun yönetimi ve fon kaynaklarının kullanımı Konfederasyon tarafından,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Üç ay içerisinde çıkarılacak yönetmeliklerle düzenlenir. Konfederasyon tarafından hazırlanması öngörülen yönetmelikler Bakanlık onayı ile yürürlüğe konulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun 4, 16, 26 ve 34 üncü maddelerinde öngörülen örnek ana sözleşmeler Bakanlıkça altı ay içinde hazırlanır.</template>
      </mvz-fıkra>

    <mvz-madde no="76" başlık="Yürürlükten kaldırılan hükümler ile atıflar">

        <template>17.7.1964 tarihli ve 507 sayılı Esnaf ve Sanatkârlar Kanunu yürürlükten kaldırılmıştır. Diğer kanunlarda, 507 sayılı Esnaf ve Sanatkârlar Kanununa yapılmış olan atıflar bu Kanuna yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>(İptal)</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(İptal)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce kurulmuş bulunan oda, birlik, federasyon ve Konfederasyonun tüzel kişilikleri bu Kanunda öngörülen şartları yerine getirmeleri kaydıyla devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce olağan ve olağanüstü genel kurullarını yapmış ve yapmamış olan esnaf ve sanatkârlar meslek kuruluşları, olağan genel kurul toplantılarını ve seçimlerini 2005 yılında olmak üzere; odalar ekim ayında, birlikler ve federasyonlar kasım ayında, Konfederasyon aralık ayında, bu Kanuna göre yeniden yaparlar. Esnaf ve sanatkârlar meslek kuruluşlarının halen görevde olan yetkili kurulları, bu Kanuna göre 2005 yılında yapılacak olağan genel kurul ve seçimlere kadar olan görev sürelerini mevcut durumları ile tamamlarlar. Bu Kanunun yürürlüğe girmesinden sonra esnaf ve sanatkârlar meslek kuruluşlarının yapılacak olağanüstü genel kurulları ve seçimleri bu Kanuna göre yapılır ve yetkili organlar bu Kanuna göre teşekkül ettirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>15.8.2005 tarihine kadar, mevcut esnaf ve sanatkârlar odalarına kayıtlı üyelerin üyelik nitelikleri bu Kanunun 7 nci maddesinde belirtilen şartlara uygun olarak yönetim kurulu tarafından güncelleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sicile kayıtlı olmayıp odaya kayıtlı üyelerle, odaya kayıtlı olmayıp sicile kayıtlı olan üyelerin eksik işlemleri, sicil tarafından oda ve sicil numaraları ilgili odayla irtibatlı olarak verilerek tamamlanır. Ayrıca, odalar; üyelerine ilişkin bilgilerin Bakanlık e-esnaf ve sanatkâr veri tabanında güncelleştirilmesini 15.8.2005 tarihine kadar, tamamlamak zorundadırlar. Üyeler de bu süre içinde eksik bilgilerini odaya ulaştırmak mecburiyetindedirler. Bu çalışmalar sonucunda vefat ettiği, emekli olarak veya başka bir nedenle mesleğini icra etmekten vazgeçtiği tespit edilen üyelerin bilgilerini havi listeler oda yönetim kurulunca sicile bildirilir ve bu kişilerin sicil ve oda kayıtları silinir. Bu şekilde yapılan terkin işleminden harç alınmaz ve Sicil Gazetesinde yayımı ücretsiz olarak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Oda kayıtları bulunup esnaf ve sanatkâr sicil kayıtları olmayan üyelerin üyeliklerinin bu yasaya uygun olarak güncellenmesini temin için üyelik niteliklerini taşımaları kaydıyla ve bir sefere mahsus olmak üzere 15.8.2005 tarihine kadar esnaf ve sanatkâr siciline yapılacak kayıtlarında tescil harcı ve herhangi bir masraf alınmaz ve bunların Sicil Gazetesinde ilanı ücretsiz olarak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Oda üyeliğine istinaden Esnaf ve Sanatkârlar ve Diğer Bağımsız Çalışanlar Sosyal Sigortalar Kurumu üyesi olan, ancak bu Kanunun yürürlüğe girmesiyle üyelik şartlarını taşımadıkları için oda üyelikleri sona erenlerin bu kuruma olan üyelikleri, yükümlülüklerini yerine getirmeleri kaydıyla devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Güncelleme çalışmaları sırasında Maliye Bakanlığı, Esnaf ve Sanatkârlar ve Diğer Bağımsız Çalışanlar Sosyal Sigortalar Kurumu ve Sosyal Sigortalar Kurumu gibi kamu kurum ve kuruluşlarının veri tabanlarından yararlanılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 16 ncı maddesinin birinci fıkrası, bu Kanunun yürürlüğe girdiği tarihte faaliyette bulunan İstanbul Bilumum Madeni Eşya Sanatkârları Odaları Birliği için uygulanmaz. Bu Birlikte İstanbul Esnaf ve Sanatkâr Sicil Müdürlüğüne bağlı bir sicil müdür yardımcısı görev yapar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren;</template>
        <mvz-bent no="a">
          <template>Yıllık aidatlarını, 31.12.2003 tarihine kadar ödemeyen oda üyelerinin, bu tarihten önceki dönemlere ilişkin yıllık aidat borçları ve gecikme zamları,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Katılma ve eğitim paylarını, 31.12.2003 tarihine kadar ödemeyen oda, birlik ve federasyonların, bu tarihten önceki dönemlere ait katılma ve eğitim payı borçları ve gecikme zamları,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>2004 yılına ait yıllık aidat, katılım payı ve eğitim payları asıllarının üç ay içinde ödenmesi kaydıyla terkin olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>31.12.2003 tarihinden önceki dönemlere ait yıllık aidat ve gecikme zammı borcu olup oda tarafından kanuni yollara başvurulduğu halde adresinde bulunamayan ve gayrifaal olduğu anlaşılan üyeler oda yönetim kurulunca tespit edilerek sicil ve oda üyelik kayıtlarının silinmesi için sicile bildirilir; bu şekilde yapılan terkin işlemlerinin Sicil Gazetesinde yayımı ücretsiz olarak yapılır ve harç alınmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>15.8.2005 tarihine kadar, yapılacak güncelleme çalışmaları sonucunda aktif üye sayıları 100'den az olan odalar, Bakanlık e-esnaf ve sanatkâr veri tabanında Bakanlıkça tespit edilir ve bu odalar mahkeme kararına gerek kalmaksızın kendiliğinden fesih olmuş sayılırlar ve durum Bakanlık tarafından ilgili birliğe bildirilir. Bu odalar hakkında ilgili birlik tarafından bu Kanunun 15 inci maddesinin son fıkrasındaki fesih ile ilgili hüküm uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte bu Kanunla yürürlükten kaldırılan 507 sayılı Kanuna göre tesis edilmiş bulunan ajanlıklar kendiliğinden lâğvolur ve haklarında bu Kanunun 15 inci maddesinin son fıkrasındaki fesih ile ilgili hüküm uygulanır. Ajanlık üyeleri 15.8.2005 tarihine kadar, sicil tarafından bu Kanunun 6 ncı maddesinde belirtilen esaslar dahilinde ilgili odalara devir ve kayıt edilir. Bu işlem için üyelerden herhangi bir ücret alınmaz. Bu ajanlıkların üye kayıt defterleri bağlı olduğu birlik tarafından muhafaza edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte bu Kanunla yürürlükten kaldırılan 507 sayılı Kanuna göre büyükşehir statüsündeki illerin il merkezlerine dahil ilçelerde kurulmuş olan odalar ile daha sonra büyükşehire dahil edilen ilçelerde kurulmuş odalar mevcut üyelerini muhafaza ederler. Ancak, daha sonra yapılacak yeni üyelik kayıtlarında bu odaların çalışma bölgesinde faaliyet gösteren esnaf ve sanatkârlar isteklerine göre bu odalara veya büyükşehir sınırları içinde kurulu bulunan ilgili odaya sicil tarafından kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Sicil Gazetesinin elektronik ortamda yayımlanmaya başlanmasından önce yayınlanmış nüshaları Bakanlık ve Konfederasyonun gözetim ve işbirliğinde elektronik ortama aktarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce genel sekreter, genel sekreter yardımcısı ve sicil memuru olarak atanmış olanlarda bu Kanunda belirtilen nitelikler aranmaz; sicil memurları sicil müdürü olarak atanmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen yönetmelikler çıkarılıncaya kadar mevcut yönetmeliklerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte ilçelerde kurulu bulunan ve üye sayıları 100’den aşağı olan odaların, toplam üye sayıları 100’den aşağı olmaması şartıyla 2005 yılı Ekim ayında yapacakları genel kurulları öncesinde müşterek genel kurullarını yaparak birleşmeleri halinde karma oda olarak devam ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce ödenmesi gerektiği hâlde ödenmemiş olan, bu Kanun hükümlerine göre esnaf ve sanatkârların üyesi oldukları odalara aidat borçları ile odaların birlik ve üyesi oldukları federasyonlara, birlik ve federasyonların Konfederasyona olan katılma payı borçları asıllarının ödenmemiş kısmının tamamı ile bunlara bağlı faiz, gecikme faizi, gecikme zammı gibi ferî alacaklar yerine bu maddenin yürürlüğe girdiği tarihe kadar Yİ-ÜFE aylık değişim oranları esas alınarak hesaplanacak tutarın; birinci taksiti bu maddenin yürürlüğe girdiği tarihi takip eden üçüncü ayın sonuna kadar, kalanı üçer aylık dönemler hâlinde sekiz eşit taksitte ödemeleri hâlinde, bu alacaklara uygulanan faiz, gecikme faizi, gecikme zammı gibi ferî alacakların ve borç asıllarının bu maddenin yürürlüğe girdiği tarihten önce kısmen veya tamamen ödenmiş olması hâlinde ise ödenmiş borç asıllarına isabet eden faiz, gecikme faizi, gecikme zammı gibi ferî alacakların tahsilinden vazgeçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ödenmesi gereken toplam tutarın birinci taksit ödeme süresi içinde ödenmesi hâlinde, ödenmesi gereken tutardan %10 oranında indirim yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde hükmünden yararlanılabilmesi için bu maddenin yürürlüğe girdiği tarihi izleyen ikinci ayın sonuna kadar alacaklı birime başvurulması şarttır. Madde kapsamında ödenmesi gereken tutarların maddede öngörülen süre ve şekilde kısmen veya tamamen ödenmemesi hâlinde, ödenmemiş alacak asılları ile bunlara ilişkin faiz, gecikme faizi, gecikme zammı gibi ferî alacaklar ilgili mevzuat hükümlerine göre tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde hükmünden yararlanmak isteyen borçluların maddede belirtilen şartları yerine getirmelerinin yanı sıra dava açmamaları, açılmış davalardan vazgeçmeleri ve kanun yollarına başvurmamaları şarttır. Bu kapsamda tamamı ödenen alacaklara ilişkin yargılama giderleri ile icra masrafları ve vekâlet ücretleri karşılıklı olarak talep edilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddede geçen, Yİ-ÜFE aylık değişim oranları tabiri, Türkiye İstatistik Kurumunun her ay için belirlediği 31/12/2004 tarihine kadar toptan eşya fiyatları endeksi (TEFE) aylık değişim oranlarını, 1/1/2005 tarihinden itibaren üretici fiyatları endeksi (ÜFE) aylık değişim oranlarını, 1/1/2014 tarihinden itibaren yurt içi üretici fiyat endeksi (Yİ-ÜFE) aylık değişim oranlarını ifade eder. Bu madde hükümlerine göre ödenecek alacaklara bu Kanunun yayımlandığı ay için uygulanması gereken Yİ-ÜFE aylık değişim oranı olarak, bu Kanunun yayımlandığı tarihten bir önceki ay için belirlenen Yİ-ÜFE aylık değişim oranı esas alınır.</template>
      </mvz-fıkra>
