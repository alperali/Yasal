  <mvz-künye tür="kanun" no="5362" başlık="ESNAF VE SANATKARLAR MESLEK KURULUŞLARI KANUNU"
             tarih="7/6/2005" rgazete-tarih="21/6/2005" rgazete-sayı="25852"
             düstur-tertip="5" düstur-cilt="44" />
    
  <mvz-kısım no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; esnaf ve sanatkârlar ile bunların yanlarında çalışanların meslekî ve teknik ihtiyaçlarını karşılamak, meslekî faaliyetlerini kolaylaştırmak, mesleğin genel menfaatlerine uygun olarak gelişmelerini ve meslekî eğitimlerini sağlamak, meslek mensuplarının birbirleriyle ve halk ile olan ilişkilerinde dürüstlüğü ve güveni hâkim kılmak, meslek disiplini ve ahlâkını korumak ve bu maksatla kurulan tüzel kişiliğe sahip kamu kurumu niteliğindeki esnaf ve sanatkârlar odaları ile bu odaların üst kuruluşu olan birlik, federasyon ve Konfederasyonun çalışma usûl ve esaslarını düzenlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, esnaf ve sanatkârlar ile bunların yanlarında çalışanlar ve esnaf ve sanatkârlar tarafından kurulan esnaf ve sanatkârlar odaları ile bu odaların üst kuruluşları olan birlik, federasyon ve Konfederasyon hakkında uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Esnaf ve sanatkâr: İster gezici ister sabit bir mekânda bulunsun, Esnaf ve Sanatkâr ile Tacir ve Sanayiciyi Belirleme Koordinasyon Kurulunca belirlenen esnaf ve sanatkâr meslek kollarına dahil olup, ekonomik faaliyetini sermayesi ile birlikte bedenî çalışmasına dayandıran ve kazancı tacir veya sanayici niteliğini kazandırmayacak miktarda olan, basit usulde vergilendirilenler ve işletme hesabı esasına göre deftere tabi olanlar ile vergiden muaf bulunan meslek ve sanat sahibi kimseleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakanlık: Sanayi ve Ticaret Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Genel Müdürlük: Sanayi ve Ticaret Bakanlığı Esnaf ve Sanatkârlar Genel Müdürlüğünü,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Oda: Esnaf ve sanatkârların kuracakları ihtisas ve karma esnaf ve sanatkârlar odalarını,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İhtisas odası: Aynı meslekte faaliyette bulunan esnaf ve sanatkârların bir araya gelerek il merkezlerinde veya ilçelerde kurmuş oldukları esnaf ve sanatkârlar odalarını,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Karma oda: İhtisas odası kurabilecek sayıya ulaşamayan değişik mesleklerdeki esnaf ve sanatkârların bir araya gelerek kuracakları odaları,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Şube: Birlik tarafından oda kurulamayan ilçelerde açılacak ve buradaki esnaf ve sanatkârların işlemlerini yürütecek hizmet birimlerini,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>İrtibat bürosu: İhtisas odalarının ve ilçelerdeki karma odaların çalışma bölgeleri içerisinde açacakları büroları,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Birlik: Aynı ilde kurulan esnaf ve sanatkârlar odalarının, aralarındaki dayanışmayı temin etmek ve bu odaların il genelinde işbirliği ve ahenk içerisinde çalışmalarını ve gelişmelerini sağlamak ve o ilin esnaf ve sanatkârlarını temsil etmek amacıyla il merkezlerinde kuracakları esnaf ve sanatkârlar odaları birliklerini,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Federasyon: Aynı meslek dalında kurulan esnaf ve sanatkârlar odalarının, üyelerinin meslekî yönden ihtiyaçlarını karşılamak, çalışmalarını ve gelişmelerini ülke genelinde işbirliği ve ahenk içerisinde yapabilmelerini sağlamak amacıyla, kuracakları esnaf ve sanatkârlar federasyonlarını,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Konfederasyon: Esnaf ve sanatkârlar odaları, birlikleri ve federasyonları arasında birliği temin, gelişme ve ilerlemeyi sağlamak ve genel olarak esnaf ve sanatkârların çalışmalarını meslekî yönden ve kamu yararına uygun olacak şekilde düzenlemek ve bu hususta gerekli görülecek her türlü tedbiri almak ve teşebbüste bulunmak, meslekî eğitimlerini geliştirmek, esnaf ve sanatkârları yurt çapında ve uluslararası düzeyde temsil etmek, sorunlarının çözümü için ulusal ve uluslararası kurum ve kuruluşlar nezdinde gerekli girişimlerde bulunmak, ulusal ekonomideki gelişmelere paralel olarak lüzumlu görülecek meslekî tedbirleri almak ve Bakanlık tarafından esnaf ve sanatkârlarla ilgili verilecek görevleri yapmak üzere kurulan Türkiye Esnaf ve Sanatkârları Konfederasyonunu,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Esnaf ve sanatkârlar meslek kuruluşları: Oda, birlik, federasyon ve Konfederasyonu,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Sicil: Bulunduğu il idari sınırları içerisinde çalışmak üzere birlik bünyesinde ayrı bir birim olarak kurulan Esnaf ve Sanatkâr Sicili Müdürlüğünü,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Sicil Gazetesi: Türkiye Esnaf ve Sanatkârlar Sicil Gazetesini,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Asgari ücret: Onaltı yaşından büyük işçiler için uygulanan brüt asgari ücreti,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>Bakanlık e-esnaf ve sanatkâr veri tabanı: Esnaf ve sanatkâr meslek kuruluşlarının işlemlerinin ve verilecek hizmetlerin elektronik ortamda yapılmasını sağlayan sistemi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İfade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Esnaf ve Sanatkârlar Meslek Kuruluşları">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Esnaf ve Sanatkârlar Odası">
      <mvz-madde no="4" başlık="Odaların kuruluşu">
        <mvz-fıkra no="1">
          <template>Odalar, oda kurulmak istenen yerde çalışmakta olan sanat, hizmet ve meslek sahipleri ile esnaftan en az beşyüz kişinin isteği ve Bakanlık izni ile kurulur. Oda unvanında esnaf, sanatkâr veya esnaf ve sanatkâr ibaresi yer alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Oda kuruluşu ile ilgili olarak mülki idare amirliğine verilecek müracaat dilekçesine Bakanlık tarafından Bakanlık e-esnaf ve sanatkâr veri tabanında hazırlanmış örneğine uygun düzenlenen oda kuruluş tutanağı ve oda ana sözleşmesi eklenir. Ayrıca oda kurucu üyelerinin tüm bilgilerinin eksiksiz olarak Bakanlık e-esnaf ve sanatkâr veri tabanına girişi yapılır. Oda kuruluş tutanağı ve ana sözleşmesi, sicil müdürünün gözetiminde tanzim ve imza edilir. Oda kuruluş işlemlerinin gerçeğe uygun olup olmamasından sicil müdürü sorumludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mülki idare amirliği onbeş gün içinde kuruluş talebini inceler ve görüşü ile birlikte kuruluş belgelerini noksansız olarak Bakanlığa gönderir. Bakanlık kuruluş talebi hakkında ilgili birliğin görüşünü alır. Bakanlık bir ay içinde kuruluş için izin verip vermediğini bildirmediği takdirde oda kurulmuş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kurulan odanın üyeleri arasında olup diğer odalardan ayrılmış olanların eski odalarındaki üyeliği sona erer ve dosyası üyesi olduğu yeni kurulan odaya bir ay içinde devredilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Karma odalarda, odanın talebi ve birliğin onayı ile meslek komiteleri kurulabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Odaların çalışma bölgesi">
        <mvz-fıkra no="1">
          <template>Odaların çalışma bölgesi, bulundukları ilçenin idari sınırlarıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Birden fazla ilçe bulunan büyükşehir il merkezlerinde kurulan odaların çalışma bölgesi büyükşehire dahil ilçelerin idari sınırlarıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Aynı çalışma bölgesinde, faaliyet konusu aynı olan birden fazla oda kurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Çalışma bölgesi odaların faaliyet sınırlarını belirler, esnaf ve sanatkârların meslekî faaliyetleri çalışma bölgesi ile sınırlandırılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Odalar, her türlü sorumluluk kendilerine ait olmak kaydıyla çalışma bölgesi içinde birlikten izin alarak irtibat bürosu açabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Odaya kayıt">
        <mvz-fıkra no="1">
          <template>Esnaf ve sanatkârların sicile kayıtları yapılmadıkça, hiçbir şekilde odaya kaydı yapılamaz. Sicile kayıt olan esnaf ve sanatkârlara ait bilgiler sicil tarafından; elektronik ortamda, iş yerlerinin bulunduğu yerdeki, iş yerleri seyyar olanların ikametgâhlarının bulunduğu yerdeki meslek ve sanatları ile ilgili ihtisas odasına; meslek ve sanatları ile ilgili ihtisas odası bulunmayanların bilgileri ise karma odaya kayıt için gönderilir. İlgili oda yönetim kurulu, bu kişilerle ilgili üyelik kararlarını ilk toplantısında alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Oda kuruluş yeter sayısına ulaşılamadığı için oda kurulması mümkün olmayan yerlerdeki esnaf ve sanatkârların kayıtları birlik marifetiyle tutulabilir. Esnaf ve sanatkârlara odalarca verilen hizmetler, ilçelerde şube açmak suretiyle birlik tarafından verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Büyükşehir statüsündeki iller ile diğer illere bağlı ilçelerde kurulu oda bulunmaması durumunda, bu ilçelerdeki esnaf ve sanatkârların kayıt edilecekleri oda ile bu odaların çalışma bölgesi Bakanlık tarafından belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Aynı iş yerinde birden fazla konuda faaliyet gösteren esnaf ve sanatkârlar esas faaliyeti ile ilgili odaya kayıt olurlar. Ancak, üye isterse yükümlülüklerini yerine getirmek kaydıyla diğer faaliyetleriyle ilgili odalara da sicil marifetiyle kayıt yaptırabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Esnaf ve sanatkârlar odasına kayıtlı olanlar, Türkiye Odalar ve Borsalar Birliği bünyesindeki ticaret ve sanayi odasına, ticaret odasına, sanayi odasına, deniz ticaret odasına; bu odalara kayıtlı bulunanlar ise esnaf ve sanatkârlar odasına kaydedilemezler. Sermaye şirketlerinin ortakları, başkaca esnaf ve sanatkârlık faaliyeti olmadıkça, sadece şirket ortaklığı sebebiyle hiçbir şekilde esnaf ve sanatkârlar odalarına üye kaydedilemezler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Üyelik şartları">
        <mvz-fıkra no="1">
          <template>Oda üyeliği için aşağıdaki şartlar aranır:</template>
          <mvz-bent no="a">
            <template>Türkiye Cumhuriyeti vatandaşı olmak veya yabancı devlet tabiiyetinde bulunmakla beraber Türkiye'de sanat ve ticaret yapıyor olmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Medeni hakları kullanma ehliyetine sahip olmak.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Vergi mükellefi olmak ya da vergiden muaf olmak.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Türkiye Odalar ve Borsalar Birliği bünyesindeki odalara kayıtlı olmamak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Üyeliğin son bulması">
        <mvz-fıkra no="1">
          <template>Aşağıda belirtilen durumlarda üyenin oda kaydının silinmesine yönetim kurulu tarafından karar verilir, durum sicile bildirilerek kaydın silinmesi temin edilir ve kaydı silinen üyeye oda tarafından on gün içinde üyenin odaya bildirdiği iş yeri veya ikamet adresine yazılı olarak bildirilir.</template>
          <mvz-bent no="a">
            <template>Daimi olarak odanın çalışma bölgesi dışına çıkanlar.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>7 nci maddede belirtilen şartlardan herhangi birini kaybedenler veya bu şartlardan herhangi birine sahip olmadığı sonradan anlaşılanlar.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Sanat ve mesleğini yapmaktan sürekli olarak men edilenler.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Vergi mükellefiyetini sildirenlerden altı ay içinde tekrar vergi mükellefiyeti tesis ettirmeyenler.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Üyelikleri sicil tarafından silinenlerden, üye niteliğini tekrar kazananların oda üyeliği sicil tarafından tekrar tesis edilir. Bu şekilde üyeliği tekrar tesis edilen üyenin daha önce kazanmış olduğu hakları aynen devam eder. Ancak, esnaf ve sanatkârlar meslek kuruluşlarının yetkili organlarında görevli olup da oda üyeliği yukarıdaki sebeplerden dolayı kesintiye uğrayanların yetkili organlardaki görevleri de kendiliğinden sona erer. Bu kişiler üyeliklerini tekrar kazanmış olsalar dahi o döneme ilişkin yetkili organ üyelikleri devam etmez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Odaların organları">
        <mvz-fıkra no="1">
          <template>Oda organları şunlardır:</template>
          <mvz-bent no="a">
            <template>Genel kurul: Genel kurul toplantı tarihinden en az altı ay önce odaya kaydolmuş ve Bakanlık e-esnaf ve sanatkâr veri tabanından, ilgili esnaf ve sanatkârlar meslek kuruluşu tarafından alınacak, genel kurul toplantısına katılacaklar listesine dahil olan üyelerden oluşur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yönetim kurulu: Başkan dahil olmak üzere, üye sayısı 1000'den az olan odalarda yedi, üye sayısı 1000-2000 olanlarda dokuz, 2000'den fazla olan odalarda onbir kişiden oluşur ve genel kurul üyeleri arasından dört yıl süreyle görev yapmak üzere seçilir. Aynı sayıda yedek üye seçilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Denetim kurulu: Genel kurul üyeleri arasından dört yıl süreyle görev yapmak üzere seçilecek üç kişiden oluşur. Aynı sayıda yedek üye seçilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Oda genel kurulunun görev ve yetkileri">
        <mvz-fıkra no="1">
          <template>Oda genel kurulunun görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Oda başkanını, yönetim kurulu ve denetim kurulu asıl ve yedek üyelerini seçmek.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yönetim kurulu faaliyet raporu, denetim kurulu raporu, bilanço ve gelir ve gider hesaplarını incelemek, kabul veya reddetmek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yönetim kurulu ve denetim kurulunu ibra etmek.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Yeni döneme ait çalışma programı ile bu programda yer alacak olan üyelerin meslekî eğitim, teorik ve pratik kurs programlarını ve tahmini bütçeyi incelemek, aynen veya değiştirerek kabul etmek.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İşlem ve eylemleri nedeniyle hukuki ve cezai sorumluluğu tespit edilen organ üyeleri hakkında dava açılmasına, bunların görevde kalıp kalmamasına karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Bakanlıkça düzenlenen oda ana sözleşmesinde değişiklik yapılması hakkında yönetim kurulunca Bakanlıktan alınacak ön izne dayanarak karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Odanın meslekî faaliyet alanını ilgilendiren konuda kurulabilecek federasyona kurucu olma hususunda alınan yönetim kurulu kararını onaylamak.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Bakanlıktan alınan ön izne dayanarak fesih teklifi hakkında karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>İmkânları nispetinde öncelikle faaliyet alanları ile ilgili branşlarda olmak üzere öğrenci okutulmasına, bir evvelki yıl gayri safi gelirlerinin %10'unu geçmemek kaydıyla kamu yararına faaliyet gösteren kuruluşlara ve belge veya diğer kanıtlara dayandırılmak kaydıyla muhtaç durumdaki oda üyelerine yardımda bulunulmasına karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Bağlı olduğu birliğin muvafakati alınmak şartıyla kuruluş amacını gerçekleştirmeye yönelik gayrimenkul ve her türlü taşıt alım ve satımına, gayrimenkul karşılığında ödünç para alınmasına karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Bağlı olduğu birliğin muvafakati alınmak kaydıyla üyelerinin müşterek ihtiyaçlarını karşılamak, meslekî faaliyetlerini kolaylaştırmak ve mesleğin genel menfaatlere uygun olarak gelişmesini sağlamak amaçlarıyla sınırlı olarak kurulmuş veya kurulacak şirketlere ve kooperatiflere iştirak etmek, amaçlarına uygun olarak eğitim ve öğretim kurumları kurmak üzere vakıf kurmaya karar ve bu konudaki işlemleri yürütmek üzere yönetim kuruluna yetki vermek.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Yönetim kurulu tarafından teklif edilen uyulması zorunlu meslekî kararları kabul ya da reddetmek.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Oda yönetim kurulunun görev ve yetkileri">
        <mvz-fıkra no="1">
          <template>Oda yönetim kurulunun görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Oda işlerini mevzuat ve genel kurul kararlarına uygun olarak yürütmek.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Bakanlığın mevzuat gereği vereceği görevleri yerine getirmek.</template>
          </mvz-bent>
          <mvz-bent no="c">

            <template>Odalarda ve odalar arasında çıkan olumsuzluk ve anlaşmazlıklarla ilgili olarak düzenlenen raporları incelemek ve konuyu çözüme kavuşturmak.</template>

          <mvz-bent no="h">
            <template>Odaların, kuruluş amacını gerçekleştirmeye yönelik gayrimenkul ve her türlü taşıt alım ve satımı ile ödünç para alınması; şirket, vakıf ve kooperatif kurma ve kurulu bulunanlara katılma yönündeki taleplerini incelemek ve karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Resmî ve özel merciler tarafından istenecek temsilciyi atamak ve görevlendirmek.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Genel sekreter ve diğer personelin atama, terfi, cezalandırma ve görevlerine son verilmesine karar vermek ve personele ait bilgileri Bakanlık e-esnaf ve sanatkâr veri tabanında güncelleyerek takip etmek.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Çalışma bölgesi içindeki meslekî teamül, gelenek ve uyulması zorunlu meslekî kararları kendi görüşü ile birlikte Konfederasyona iletmek.</template>
          </mvz-bent>
          <mvz-bent no="l">
            <template>Birlik katılma payının ve kayıt ücretinin üye odalardan elektronik ortamda tahsilini sağlamak.</template>
          </mvz-bent>
          <mvz-bent no="m">
            <template>Esnafın işyeri açması, kapatması veya meslek değiştirmesi ile ilgili işlemlerin Bakanlık e-esnaf ve sanatkâr veri tabanından takibini yaparak sicil işlemlerinin yerine getirilmesini sağlamak.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Odalardan gelen esnaf ve sanatkârlara ait şikâyetleri incelemek ve neticelendirmek ya da gerek görülmesi halinde konuyu Konfederasyona intikal ettirmek.</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>İllerde, esnaf ve sanatkârların müşterileriyle ilişkisinde ortaya çıkan uyuşmazlıklarda, konu hakem heyetlerine intikal ettirilmiş ise bu hakem heyetlerine üye görevlendirmek.</template>
          </mvz-bent>
          <mvz-bent no="p">
            <template>Üyesi olan odalara, bu odaların mevcut üyelerine ve esnaf ve sanatkârlık faaliyetine yeni başlayacak kişilere danışmanlık hizmeti vermek.</template>
          </mvz-bent>
          <mvz-bent no="r">
            <template>Üye odalardan gelen yıl sonu bilanço ile gelir ve gider cetvellerini incelemek, odalara yol gösterici tavsiyelerde bulunmak ve 15 inci maddenin (c) bendine göre değerlendirmek; bilanço ve gelir ve gider hesap cetvelini şubat ayı sonuna kadar, genel kurul evrakını ise genel kurulu takip eden on gün içinde Konfederasyona göndermek.</template>
          </mvz-bent>

      <mvz-madde no="23" başlık="Birlik denetim kurulunun görev ve yetkileri">

          <template>Birlik denetim kurulunun görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Bu Kanunla verilen görevler ile genel kurul kararlarının yönetim kurulu tarafından yerine getirilip getirilmediğini incelemek.</template>

          <mvz-bent no="b">
            <template>Birlik işlemlerinin mevzuat ve birlik ana sözleşmesi çerçevesinde yerine getirilip getirilmediğini incelemek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bakanlık ve Konfederasyon tarafından mevzuat gereği verilen görevlerin yerine getirilip getirilmediğini incelemek.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Birlik kayıt ücreti ve katılma paylarının üye odalardan zamanında tahsil edilip edilmediğini kontrol etmek ve birliğin işlem ve hesapları hakkında genel kurula rapor vermek.</template>
          </mvz-bent>

      <mvz-madde no="24" başlık="Disiplin kurulu ve disiplin cezaları">
        <mvz-fıkra no="1">
          <template>Birlik disiplin kurulu birliğe bağlı oda üyelerinin meslekî faaliyetleri sırasında meslek ahlakı ile bağdaşmayan hareket ve işlemlerini soruşturmaya ve durumun niteliğine ve ağırlık derecesine göre bu maddede belirtilen disiplin cezalarını vermeye yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Disiplin kurulu kendi üyeleri arasından bir başkan seçer. Disiplin kurulunun sekreterlik işleri birlik tarafından yerine getirilir. Disiplin kurulu üyeleri arasında eksilme olduğu takdirde, yedek üyelerden genel kuruldaki seçimde en fazla oy alanlar, oyların eşitliği halinde listeye göre sırayla disiplin kurulunca yazılı olarak disiplin kuruluna çağrılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Üyenin yazılı savunması alınmadan disiplin cezası verilemez. Disiplin kurulunun yedi günden az olmamak üzere verdiği süre içinde savunma yapmayan üye, savunma hakkından vazgeçmiş sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Disiplin kurulu kendilerine intikal eden ihbar ve şikâyetleri en çok bir ay içinde soruşturmaya başlar ve en geç üç ay içinde sonuçlandırır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Disiplin kurulunca verilen cezalar on gün içinde ilgililere yazılı olarak tebliğ edilir. İlgililer bu karara karşı tebellüğ tarihinden itibaren onbeş gün içinde yetkili idare mahkemesine dava açabilirler. Davanın açılmış olması idarece verilen cezanın yerine getirilmesini durdurmaz. Dava, zaruret görülmeyen hallerde, evrak üzerinden inceleme yapılarak en kısa sürede sonuçlandırılır. Yetkili idare mahkemesince verilen kararlara karşı bölge idare mahkemesine başvurulabilir. Bölge idare mahkemesinin verdiği kararlar kesindir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Oda üyelerine birlik disiplin kurulunca verilecek cezalar şunlardır:</template>
          <mvz-bent no="a">
            <template>Uyarma cezası: Meslek şeref ve haysiyetine uygun düşmeyen hareketleri olan, odaya olan üyelik görev ve yükümlülüklerini yerine getirmeyen, üyesi olduğu oda ve diğer esnaf ve sanatkâr meslek kuruluşlarının itibarını zedeleyici fiilde bulunan ve sözler sarf eden, müşteri veya diğer kişilerle olan ilişkilerinde terbiye ve nezakete aykırı davranışlarda bulunan üyenin, meslekî faaliyetinde ve davranışlarında daha dikkatli olması gerektiğinin yazı ile bildirilmesidir. Üye, bir yıl içinde uyarma cezası gerektiren fiili tekrarlaması halinde kınama cezası ile tecziye edilir.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Kınama cezası: Müşterilerine ve diğer kişilere olan taahhütlerini yerine getirmeyen veya bunlara karşı haksız ithamda bulunan, müşterilerini ve diğer kişileri kandıran, nizami ölçü ve tartı aletlerini bilerek kullanmayan üyeye meslekî faaliyetinde ve davranışlarında kusurlu olduğunun yazı ile bildirilmesidir. Üye, bir yıl içinde kınama cezasını gerektiren fiili tekrarlaması halinde para cezası ile tecziye edilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Para cezası: Üyenin, Bakanlık, o yer idare amiri, esnaf ve sanatkârlar meslek kuruluşları tarafından mevzuata uygun olarak alınmış kararlara aykırı hareket etmesi ve mükerrer kınama cezası almasından dolayı, para cezası ile cezalandırılmasıdır. Para cezaları birliğe gelir kaydedilir. Verilecek para cezası 61 inci maddeye göre belirlenen yıllık aidatın iki katıdır. Üyenin para cezası verilmesini gerektiren eylem ve davranışlarının, aynı eylem ve davranış olmasına bakılmaksızın bir yıl içinde tekrarında, verilecek ceza yıllık aidatın beş katı olarak uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Geçici veya uzun süreli oda üyeliğinden çıkarma cezası: Üyenin, esnaf ve sanatkâr sıfatı ile bağdaşmayacak nitelik ve derecede yüz kızartıcı ve utanç verici hareketlerde, huzur, sükûn ve çalışma düzenini bozucu eylem ve davranışlarda bulunması karşısında oda üyeliğinden geçici veya uzun süreli olarak çıkarılması, bu süre içerisinde meslekî faaliyetini yürütememesidir.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Geçici çıkarma cezası bir aydan az, altı aydan fazla; uzun süreli çıkarma cezası altı aydan az, iki yıldan fazla olamaz.</template>
        </mvz-fıkra>
      </mvz-madde>

    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Esnaf ve Sanatkârlar Federasyonu">
      <mvz-madde no="26" başlık="Federasyonun kuruluşu">
        <mvz-fıkra no="1">
          <template>Federasyon kurulabilmesi için ülke genelinde aynı meslek dalında kurulmuş olan odaların %60'ının genel kurullarının federasyon kurulması yönünde karar almaları ve kurucu oda adedinin 40'dan az olmaması şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurucular, Bakanlıkça hazırlanmış örneğe uygun olarak düzenleyecekleri federasyon ana sözleşmesini bir dilekçe ile birlikte Bakanlığa verirler. Federasyon kuruluşlarında Konfederasyonun görüşü alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Federasyon; ana sözleşmesinin Bakanlık tarafından onanmasından sonra kurulmuş olur. Aynı faaliyet konusunda birden fazla federasyon kurulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Federasyonların merkezi Ankara'dadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Federasyona kayıt">
        <mvz-fıkra no="1">
          <template>Federasyon kurulduktan sonra aynı meslek dalında kurulmuş bulunan veya sonradan kurulacak odalar, kuruluş tarihinden itibaren bir ay içinde federasyona kayıt olmak zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kayıt zorunluluğunu yerine getirmeyen odaların kayıtları federasyon tarafından resen yapılır ve ilgili odaya yazılı olarak bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="Federasyonun organları">
        <mvz-fıkra no="1">
          <template>Federasyon organları şunlardır:</template>
          <mvz-bent no="a">
            <template>Genel kurul: Federasyon genel kurul tarihinden en az altı ay önce kurulmuş olan odaların yönetim kurulu başkan ve üyeleri ile federasyonun görevde bulunan başkanı, yönetim ve denetim kurulu üyelerinden oluşur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yönetim kurulu: Başkan dahil olmak üzere, oda sayısı 75 ve daha az olanlarda dokuz, 76-125 olanlarda onbir, 126 ve daha fazla olanlarda onüç kişiden oluşur ve genel kurul üyeleri arasından dört yıl süreyle görev yapmak üzere seçilir. Aynı sayıda yedek üye seçilir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Denetim kurulu: Genel kurul üyeleri arasından dört yıl süreyle görev yapmak üzere seçilecek üç kişiden oluşur. Aynı sayıda yedek üye seçilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="29" başlık="Federasyon genel kurulunun görev ve yetkileri">
        <mvz-fıkra no="1">
          <template>Federasyon genel kurulunun başlıca görev ve yetkileri şunlardır:</template>

            <template>Federasyon başkanını, yönetim kurulu ve denetim kurulu asıl ve yedek üyelerini seçmek.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yönetim kurulu faaliyet raporu, denetim kurulu raporu, bilanço ve gelir ve gider hesaplarını incelemek, kabul veya reddetmek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yönetim kurulu ve denetim kurulunu ibra etmek.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Yeni döneme ait çalışma programı ile bu program içinde yer alan eğitim, teorik ve pratik kurs programlarını ve tahmini bütçeyi incelemek, aynen veya değiştirerek kabul etmek.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İşlem ve eylemleri nedeniyle hukuki ve cezai sorumluluğu tespit edilen organ üyeleri hakkında dava açılmasına, bunların görevde kalıp kalmamasına karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Üye odalarda ve üye odalar arasında meslek ve sanatlarının yürütülmesi yönünden çıkacak olumsuzlukları ve anlaşmazlıkları çözüme kavuşturmak ve üye odaların uyması zorunlu meslekî kararların alınmasını sağlamak üzere Konfederasyona teklifte bulunmak.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Üye odalar ve mensuplarının meslekî gelişme ve ihtiyaçlarının karşılanmasını sağlamak maksadıyla gerekli tedbirleri almaya ve bu konuda gereken kurs, seminer, fuar ve benzeri kültürel ve sosyal faaliyetlerde bulunmaya, tesisler kurmaya, Konfederasyonun uygun görüşü ile Bakanlıktan izin alarak uluslararası kuruluşlara üye olmaya karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>İmkânları ölçüsünde öğrenci okutulmasına, bir evvelki yıl gayri safi gelirinin %10'unu geçmemek şartıyla kamu yararına hizmet eden kuruluşlara sosyal yardım yapılmasına ve bütçe imkânları elverişli olmayan üye odalara durumlarını belgelendirmeleri kaydıyla ayni ve nakdî yardımda bulunulmasına karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Kuruluş amacını gerçekleştirmeye yönelik gayrimenkul ve her türlü taşıt alım satımına, gayrimenkul karşılığında ödünç para alınmasına karar vermek; bütün bu faaliyetlerine ait bilgileri Bakanlık e-esnaf ve sanatkâr veri tabanında güncelleyerek tutmak.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Üye odaların ve üyelerinin müşterek ihtiyaçlarını karşılamak, meslekî faaliyetlerini kolaylaştırmak ve mesleğin genel menfaatlere uygun olarak gelişmesini sağlamak amaçlarıyla sınırlı olarak kurulmuş veya kurulacak şirketlere ve kooperatiflere iştirak etmek, amaçlarına uygun olarak eğitim ve öğretim kurumları kurmak üzere vakıf kurmaya karar vermek ve bu konudaki işlemleri yürütmek üzere yönetim kuruluna yetki vermek.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>

          <mvz-bent no="d">

          </mvz-bent>
          <mvz-bent no="f">
            <template>Üyesi olan odalar ve mensuplarının meslekî bilgi ve eğitim çalışmalarını temin etmek, resmî ve özel merciler nezdinde gerekli girişim ve temaslarda bulunmak, mensuplarının genel meslekî menfaatlerini ilgilendiren konularda adli ve idari yargı mercileri önünde federasyon başkanı marifetiyle federasyonu temsil etmek.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Genel sekreter ve diğer personelin atama, terfi, cezalandırma ve görevlerine son verilmesine karar vermek.</template>

          <mvz-bent no="h">

          <mvz-bent no="j">

          <mvz-bent no="k">

          </mvz-bent>

      <mvz-madde no="31" başlık="Federasyon denetim kurulunun görev ve yetkileri">

          <template>Federasyon denetim kurulunun görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Bu Kanunla verilen görevler ile genel kurulda alınan kararların yönetim kurulu tarafından yerine getirilip getirilmediğini incelemek.</template>

      <mvz-madde no="33" başlık="Fesih ve tasfiye">
        <mvz-fıkra no="1">
          <template>Federasyon, kayıtlı üye odalardan üçte birinin yazılı fesih talebi üzerine bir ay içinde yapacağı genel kurul toplantısında, genel kurul üyelerinin üçte ikisinin kararı ile feshedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Feshedilen federasyon, Konfederasyonca görevlendirilecek üç kişilik bir heyet tarafından, borçları kendi varlığından ödenip, alacakları tahsil edildikten ve tasfiye giderleri de karşılandıktan sonra kalacak meblağ ve ayni haklar Konfederasyona devrolunur. Beş sene içerisinde aynı konuda federasyon kurulduğu takdirde devrolunan meblağ bu kuruluşa verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Türkiye Esnaf ve Sanatkârları Konfederasyonu">
      <mvz-madde no="34" başlık="Konfederasyonun kuruluşu">
        <mvz-fıkra no="1">
          <template>Konfederasyon, Bakanlıkça hazırlanmış örneğine uygun Konfederasyon ana sözleşmesinin Bakanlık tarafından onanmasından sonra kurulmuş olur. Kuruluş merkezi Ankara'dadır. Konfederasyonun kısa adı TESK'tir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35" başlık="Konfederasyona kayıt">
        <mvz-fıkra no="1">
          <template>Bu Kanuna göre kurulmuş veya kurulacak olan birlik ve federasyonlar kuruluş tarihinden itibaren bir ay içinde Konfederasyona kayıt olmak zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kayıt zorunluluğunu yerine getirmeyen birlik ve federasyonların kayıtları Konfederasyonca resen yapılır ve ilgili meslek kuruluşlarına yazılı olarak bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="36" başlık="Konfederasyonun organları">
        <mvz-fıkra no="1">
          <template>Konfederasyonun organları şunlardır:</template>
          <mvz-bent no="a">
            <template>Genel kurul: Birlik ve federasyonların başkan ve yönetim kurulu üyeleri ile Konfederasyonun görevde bulunan genel başkanı, yönetim kurulu ve dışarıdan seçilen üyeler hariç denetim kurulu üyelerinden oluşur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başkanlar kurulu: Konfederasyon genel başkanı ile birlik ve federasyon başkanlarından oluşur.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yönetim kurulu: Genel kurul üyeleri arasından dört yıl süreyle görev yapmak üzere seçilen genel başkan dahil onbeş kişiden oluşur. Aynı sayıda yedek üye seçilir.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Denetim kurulu: Genel kurul üyeleri arasından veya ikisi dışarıdan dört yıl süreyle görev yapmak üzere seçilen beş kişiden oluşur. Aynı sayıda yedek üye seçilir.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="Konfederasyon genel kurulunun görev ve yetkileri">
        <mvz-fıkra no="1">
          <template>Konfederasyon genel kurulunun görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Konfederasyon genel başkanını, yönetim kurulu ve denetim kurulu asıl ve yedek üyelerini seçmek.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yönetim kurulu faaliyet raporu, denetim kurulu raporu, bilanço ve gelir ve gider hesaplarını incelemek, kabul veya reddetmek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Yönetim kurulu ve denetim kurulunu ibra etmek.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Yeni döneme ait çalışma programı ile bu programda yer alan eğitim, teorik ve pratik kurs programlarını ve tahmini bütçeyi incelemek, aynen veya değiştirerek kabul etmek.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İşlem ve eylemleri nedeniyle hukuki ve cezai sorumluluğu tespit edilen organ üyeleri hakkında dava açılmasına, bunların görevde kalıp kalmamasına karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Yönetim kurulunca hazırlanan yönetmelikleri onamak.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Herhangi bir sebeple birlik ve federasyonlarla Konfederasyon yönetim kurulu ve denetim kurulu arasında çıkacak görüş ayrılıklarını çözüme kavuşturmak.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Esnaf ve sanat sahiplerinin meslek ve sanatlarının yürütülmesi için gerekli ve faydalı görülecek tedbir ve teşebbüslerden yönetim kurulu tarafından getirilecek konuları incelemek ve karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Eğitim ve öğretim kurumları açılmasına, öğrenci yurtları tesis edilmesine, burs verilmesine ve öğrenci okutulmasına, bir evvelki yıl gayri safi gelirinin %10'unu geçmemek şartıyla kamu yararına hizmet eden kuruluşlara sosyal yardımlarda bulunulmasına, bütçe imkânları yeterli olmayan birlik ve federasyonlara durumlarını belgelendirmek kaydıyla ayni ve nakdi yardım yapılmasına karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Konfederasyonun kuruluş amacını gerçekleştirmeye yönelik gayrimenkul ve her türlü taşıt alım satımına, gayrimenkul karşılığında ödünç para alınmasına karar vermek, bu faaliyetlerine ait bilgileri Bakanlık e-esnaf ve sanatkâr veri tabanında güncelleyerek tutmak.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Esnaf ve sanatkârlar meslek kuruluşları ve üyelerinin müşterek ihtiyaçlarını karşılamak, meslekî faaliyetlerini kolaylaştırmak ve mesleğin genel menfaatlere uygun olarak gelişmesini sağlamak amaçlarıyla sınırlı olarak kurulmuş veya kurulacak şirketlere ve kooperatiflere iştirak etmek, amaçlarına uygun olarak eğitim ve öğretim kurumları kurmak üzere vakıf kurmaya karar ve bu konuda işlemleri yürütmek üzere yönetim kuruluna yetki vermek.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="Konfederasyon başkanlar kurulu">
        <mvz-fıkra no="1">
          <template>Konfederasyon başkanlar kurulu, yüksek istişare kurulu olarak, ülke genelindeki esnaf ve sanatkârlar meslek kuruluşlarına ilişkin meseleler ile Türk esnaf ve sanatkârlarının ülke içindeki ve uluslararası düzeydeki gelişme ve sorunları hakkında Konfederasyon yönetim kuruluna tavsiyelerde bulunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Konfederasyon genel başkanı, başkanlar kurulunun da başkanıdır. Başkanın bulunmadığı hallerde toplantıya yetki verilen Konfederasyon genel başkan vekili başkanlık eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kurul, üyelerinin çoğunluğu ile yılda bir defa ekim ayında kendiliğinden ve gerektiğinde Konfederasyon genel başkanının veya başkanlar kurulunun çoğunluğunun yazılı çağrısı üzerine her zaman toplanabilir.</template>
        </mvz-fıkra>

      <mvz-madde no="39" başlık="Konfederasyon yönetim kurulunun görev ve yetkileri">

            <template>Yeni dönem çalışma programı ile bu program içinde yer alacak olan eğitim, teorik ve pratik kurs programlarını ve tahmini bütçeyi hazırlamak ve genel kurulun onayına sunmak.</template>

          <mvz-bent no="d">

          </mvz-bent>
          <mvz-bent no="e">
            <template>Üyeleri hakkında gerekli bilgilerin Bakanlık e-esnaf ve sanatkâr veri tabanında düzenli olarak bulunmasını sağlamak, resmî ve özel mercilerce lüzumlu görülecek konularda istenecek bilgi ve mütalaayı vermek, mensuplarının genel meslekî menfaatlerini ilgilendiren konularda, adli ve idari yargı mercileri önünde Konfederasyon genel başkanı marifetiyle Konfederasyonu temsil etmek.</template>

          </mvz-bent>
          <mvz-bent no="g">
            <template>Konfederasyon topluluğu içindeki kuruluş mensuplarının meslek ve sanatlarının yürütülmesi için gerekli ve faydalı görülecek tedbirleri almak ve teşebbüslerde bulunmak.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Konfederasyon personelinin tüm bilgilerini Bakanlık e-esnaf ve sanatkâr veri tabanında takip etmek, genel sekreter ve diğer personelin atanma, terfi, cezalandırılma ve görevlerine son verilmesine karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Esnaf ve sanatkârlar meslek kuruluşlarını ilgilendiren konularda hazırlanacak mevzuat hakkında, gerektiğinde Konfederasyon görüşünü oluşturmak ve ilgili makama sunmak.</template>
          </mvz-bent>
          <mvz-bent no="j">
            <template>Ülke içinde ve dışında sergi ve fuarlar düzenlemek, desteklemek, katılmak ve Bakanlık izni alınmak şartıyla, ülke dışındaki meslekî kuruluşlara üye olma çalışmaları yapmak.</template>
          </mvz-bent>
          <mvz-bent no="k">
            <template>Esnaf ve sanatkârlar ile Konfederasyona bağlı kuruluşların ihtiyacı olan yardım ve kredileri sağlamak için gerekli girişimlerde bulunmak.</template>

          <mvz-bent no="l">
            <template>Esnaf ve sanatkârlar meslek kuruluşlarının muhasebe ve personel ile gereken diğer konularda yönetmeliklerini hazırlamak.</template>

          <mvz-bent no="m">
            <template>Meslek standartlarının belirlenmesi konusunda Milli Eğitim Bakanlığı, Çalışma ve Sosyal Güvenlik Bakanlığı, Türk Standartları Enstitüsü ve Türkiye Odalar ve Borsalar Birliği ile işbirliği yapmak.</template>
          </mvz-bent>
          <mvz-bent no="n">
            <template>Millî Prodüktivite Merkezi, Küçük ve Orta Ölçekli Sanayi Geliştirme ve Destekleme İdaresi Başkanlığı ve benzeri kuruluşların kurullarına katılacak delegeyi tespit etmek.</template>
          </mvz-bent>
          <mvz-bent no="o">
            <template>Türkiye Esnaf ve Sanatkârlar Sicil Gazetesini Bakanlık e-esnaf ve sanatkâr veri ta-banında yayınlamak, meslekî yayında bulunmak.</template>
          </mvz-bent>
          <mvz-bent no="p">
            <template>Birlik ve federasyonlarca gönderilen uyulması zorunlu meslekî kararları Bakanlık onayına sunmak.</template>
          </mvz-bent>
          <mvz-bent no="r">
            <template>Federasyon, birlik ve odalarda Konfederasyon tarafından yapılan denetimler sonucunda organ üyelerinin ve görevli personelin 59 uncu maddeye göre sorumlu görülmesi halinde, sonuç hakkında Bakanlığa bilgi vermek.</template>
          </mvz-bent>
          <mvz-bent no="s">
            <template>Konfederasyon katılma payının ve kayıt ücretinin birlik ve federasyonlardan elektronik ortamda işlem sırasında tahsilini sağlamak.</template>

          <mvz-bent no="t">
            <template>Kaybolmaya yüz tutmuş mesleklerin yaşatılması ve korunması için gerekli tedbirleri almak, konuyla ilgili olarak Bakanlığı bilgilendirmek.</template>
          </mvz-bent>
