  <mvz-künye tür="kanun" no="2429" başlık="ULUSAL BAYRAM VE GENEL TATİLLER HAKKINDA KANUN"
             tarih="17/3/1981" rgazete-tarih="19/3/1981" rgazete-sayı="17284"
             düstur-tertip="5" düstur-cilt="20" düstur-sayfa="227" />
    
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>1923 yılında Cumhuriyetin ilan edildiği 29 Ekim günü Ulusal Bayramdır. Türkiye'nin içinde ve dışında Devlet adına yalnız bugün tören yapılır. Bayram 28 Ekim günü saat 13.00'ten itibaren başlar ve 29 Ekim günü devam eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Aşağıda sayılan resmi ve dini bayram günleri ile yılbaşı günü, 1 Mayıs günü ve 15 Temmuz günü genel tatil günleridir.</template>
      <mvz-bent no="A">
        <template>Resmi bayram günleri şunlardır:</template>
        <mvz-altbent no="1">
          <template>23 Nisan günü Ulusal Egemenlik ve Çocuk Bayramıdır.</template>
        </mvz-altbent>
        <mvz-altbent no="2">
          <template>19 Mayıs günü Atatürk'ü Anma ve Gençlik ve Spor Bayramı günüdür.</template>
        </mvz-altbent>
        <mvz-altbent no="3">
          <template>30 Ağustos günü Zafer Bayramıdır.</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="B">
        <template>Dini bayramlar şunlardır:</template>
        <mvz-altbent no="1">
          <template>Ramazan Bayramı; Arefe günü saat 13.00'ten itibaren 3,5 gündür.</template>
        </mvz-altbent>
        <mvz-altbent no="2">
          <template>Kurban Bayramı; Arefe günü saat 13.00'ten itibaren 4,5 gündür.</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="C">
        <template>1 Ocak günü yılbaşı tatili, 1 Mayıs günü Emek ve Dayanışma Günü ve 15 Temmuz günü Demokrasi ve Milli Birlik Günü tatilidir.</template>
      </mvz-bent>
      <mvz-bent no="D">
        <template>Ulusal, resmi ve dini bayram günleri ile yılbaşı günü, 1 Mayıs günü ve 15 Temmuz günü resmi daire ve kuruluşlar tatil edilir.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunda belirtilen Ulusal Bayram ve genel tatil günleri; Cuma günü akşamı sona erdiğinde müteakip Cumartesi gününün tamamı tatil yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Mahiyetleri itibariyle sürekli görev yapması gereken kuruluşların özel kanunlarındaki hükümler saklıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>29 Ekim günü özel işyerlerinin kapanması zorunludur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template></template>
      <mvz-bent no="A">
        <template>Hafta tatili Pazar günüdür. Bu tatil 35 saatten az olmamak üzere Cumartesi günü en geç saat 13.00'ten itibaren başlar.</template>
      </mvz-bent>
      <mvz-bent no="B">
        <template>394 sayılı Hafta Tatili Kanunu, 657 sayılı Devlet Memurları Kanunu, 926 sayılı Türk Silahlı Kuvvetleri Personel Kanunu, 1475 sayılı İş Kanunu ve diğer kanunlardaki hafta tatili ile ilgili hükümler saklıdır.</template>
      </mvz-bent>
      <mvz-bent no="C">
        <template>Yemek, içmek, giyinmek gibi zaruri ihtiyaçların giderilmesi için alışveriş yapılan dükkan ve mağazalar hakkında Hafta Tatili Kanununun Cumartesi günüyle ilgili hükümleri uygulanmaz.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>Ulusal ve resmi bayramlarda yapılacak törenler Milli Savunma, İçişleri, Dışişleri, Milli Eğitim, Gençlik ve Spor ve Kültür Bakanlıklarınca müştereken hazırlanacak bir yönetmelikle düzenlenir. Bu yönetmelik Kanunun yürürlüğe girdiği tarihten itibaren engeç üç ay içinde yayımlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="">
    <mvz-fıkra no="1">
      <template>27/5/1935 tarihli ve 2739 sayılı Ulusal Bayram ve Genel Tatiller Hakkında Kanun ile bu Kanunda değişiklik yapan kanunlar yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>31 Aralık 1999 tarihi tam gün genel tatildir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Mahiyetleri itibarıyla sürekli görev yapması gereken kuruluşların özel kanunlarındaki hükümler saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
