  <mvz-künye tür="kanun" no="3577" başlık="İTHALATTA HAKSIZ REKABETİN ÖNLENMESİ HAKKINDA KANUN"
             tarih="14/6/1989" rgazete-tarih="1/7/1989" rgazete-sayı="20212"
             düstur-tertip="5" düstur-cilt="28" düstur-sayfa="329" />
    
  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanun, ithalatta haksız rekabet hallerinde dampinge veya sübvansiyona konu olan ithalatın sebep olduğu zarara karşı bir üretim dalının korunması amacıyla yapılacak işlemlere, alınacak önlemlere, gerekli ilke ve uygulama kararlarını verecek bir Kurul oluşturulmasına ve bunun görevlerine ilişkin usul ve esasları kapsar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Tanımlar">
    <mvz-fıkra no="1">
      <template>Bu Kanunda geçen deyimlerden;</template>
      <mvz-bent no="a">
        <template>Damping: Bir malın Türkiye'ye ihraç fiyatının, benzer malın normal değerinin altında olmasını,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Sübvansiyon: Menşe veya ihracatçı ülkenin fayda sağlayan, doğrudan veya dolaylı mali katkısını veya GATT 1994'ün XVI ncı maddesi çerçevesinde herhangi bir gelir veya fiyat desteğini,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>İhraç fiyatı: İhraç amacıyla satılan mal için fiilen ödenmiş olan veya ödenmesi gereken fiyatı,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Benzer Mal: Dampinge veya sübvansiyona konu mal ile aynı özellikleri taşıyan bir malı, böyle bir malın bulunmaması halinde ise benzer özellikleri taşıyan başka bir malı,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Normal Değer:</template>
        <mvz-altbent no="1">
          <template>İhracatçı veya menşe ülkede tüketime konu olan benzer mal için normal ticari işlemler sonucunda fiilen ödenmiş olan veya ödenmesi gereken karşılaştırılabilir fiyatı,</template>
        </mvz-altbent>
        <mvz-altbent no="2">
          <template>İhracatçı ülke veya menşe ülkenin iç piyasasında normal ticari işlemler çerçevesinde benzer malın satışlarının olmaması ya da bu satışların uygun bir karşılaştırma yapılmasına elverişli bulunmaması durumunda, benzer malın üçüncü bir ülkeye ihracatında temsil niteliğini haiz karşılaştırılabilir fiyatı veya menşe ülkedeki maliyetine makul bir kar marjının eklenmesiyle tespit edilen fiyatı,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Yönetmelik: İthalatta Haksız Rekabetin Önlenmesi Hakkında Yönetmeliği,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Damping marjı: Normal değerin ihraç fiyatını aştığı miktarı,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Sübvansiyon Miktarı: Menşe veya ihracatçı ülke tarafından ihraç edilen malın imal, üretim, ihracat veya taşınma aşamasında sağlanan, doğrudan veya dolaylı mali katkı veya GATT 1994'ün XVI ncı maddesi çerçevesinde herhangi bir gelir veya fiyat desteği şeklindeki faydaların tutarını,</template>
      </mvz-bent>
      <mvz-bent no="i">
        <template>Zarar: Bir üretim dalında maddi zararı, maddi zarar tehdidini veya bir üretim dalının kurulmasının fiziki olarak gecikmesini,</template>
      </mvz-bent>
      <mvz-bent no="j">
        <template>Bakanlık: İthalat Genel Müdürlüğünün bağlı olduğu Bakanlığı,</template>
      </mvz-bent>
      <mvz-bent no="k">
        <template>Genel Müdürlük: İthalat Genel Müdürlüğünü,</template>
      </mvz-bent>
      <mvz-bent no="l">
        <template>Kurul:İthalatta Haksız Rekabeti Değerlendirme Kurulunu,</template>
      </mvz-bent>
      <mvz-bent no="m">
        <template>GATT 1994: Gümrük Tarifeleri ve Ticaret Genel Anlaşması 1994'ü,</template>
      </mvz-bent>
      <mvz-bent no="n">
        <template>Sübvansiyonlar ve Telafi Edici Tedbirler Anlaşması: 26.1.1995 tarihli ve 4067 sayılı Kanunla onaylanması uygun bulunan ve 3.2.1995 tarihli ve 95/6525 sayılı Bakanlar Kurulu Kararı ile onaylanan Dünya Ticaret Örgütü Kuruluş Anlaşması Ek 1'de yer alan Anlaşmayı,</template>
      </mvz-bent>
      <mvz-bent no="o">
        <template>GATT 1994'ün VI ncı Maddesinin Uygulanmasına İlişkin Anlaşma: 26.1.1995 tarihli ve 4067 sayılı Kanunla onaylanması uygun bulunan ve 3.2.1995 tarihli ve 95/6525 sayılı Bakanlar Kurulu Kararı ile onaylanan Dünya Ticaret Örgütü Kuruluş Anlaşması Ek 1'de yer alan Anlaşmayı.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İfade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Önlem alınmasını gerektiren haller">
    <mvz-fıkra no="1">
      <template>Önlem alınmasını gerektiren haller; dampinge veya sübvansiyona konu olan ithalatın Türkiye'de bir üretim dalında maddi zarara yol açması veya maddi zarar tehdidi oluşturması veya bir üretim dalının kurulmasını fiziki olarak geciktirmesidir. Ancak, sübvansiyona konu ithalata karşı önlem alınabilmesi için, sübvansiyonun Sübvansiyonlar ve Telafi Edici Tedbirler Anlaşması'nın 2 nci maddesi çerçevesinde bir firma/firma grubu veya bir üretim dalı/üretim dalı grubuna yönelik olduğunun da tespit edilmiş olması gerekir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Şikayet ve inceleme">
    <mvz-fıkra no="1">
      <template>Genel Müdürlük şikayet üzerine veya gerektiğinde re'sen damping veya sübvansiyon incelemesi yapabilir. Dampinge veya sübvansiyona konu olan ithalattan maddi zarar gördüğünü veya maddi zarar tehdidi altında bulunduğunu veya bu tür ithalatın bir üretim dalının kurulmasını fiziki olarak geciktirdiğini iddia eden üreticiler veya üretim dalı adına hareket eden gerçek veya tüzelkişi veya kuruluşlar Genel Müdürlüğe yazılı olarak başvuruda bulunabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>(Mülga)</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Şikayet ve incelemeye ilişkin usul ve esaslar Bakanlıkça çıkarılacak Yönetmelikle tespit edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Genel Müdürlüğün görevleri">
    <mvz-fıkra no="1">
      <template>Genel Müdürlüğün bu Kanunla ilgili görevleri şunlardır:</template>
      <mvz-bent no="a">
        <template>Şikayet üzerine veya gerektiğinde re'sen, verilen bilgi ve belgeler veya mevcut diğer bilgilerin ışığı altında ön incelemeyi yapmak,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Soruşturma açılıp açılmayacağı hususunda Kurula teklif sunmak,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Soruşturma açılması halinde, soruşturmayı yürütmek ve önlemlerle ilgili olarak Kurula teklif sunmak,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Kurulun sekreterlik hizmetlerini yürütmek ve Kurulca verilecek diğer görevleri yapmak.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="İthalatta Haksız Rekabeti Değerlendirme Kurulu ve görevleri">
    <mvz-fıkra no="1">
      <template>(Mülga)</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>(Mülga)</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kurulun görevleri şunlardır:</template>
      <mvz-bent no="a">
        <template>Soruşturma açılıp açılmamasına veya açılmış bir soruşturmanın durdurulmasına karar vermek,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Soruşturma sırasında yeterli delil olması halinde geçici önlem kararını Bakanlığın onayına sunmak,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Soruşturma sonuçlarını değerlendirmek, bunun gerektireceği tedbirleri almak ve kesin önlem kararını Bakanlığın onayına sunmak,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Soruşturma sırasında taahhütte bulunulmasını önermek ve taahhütte bulunulması halinde, taahhüdü kabul edip etmemek hususunda karar vermek ve taahhütlerin yerine getirilmemesi durumunda gerekli önlemleri almak.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kurulun çalışma usul ve esasları Bakanlıkça çıkarılacak Yönetmelikle tespit edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Dampinge karşı vergi ve telafi edici vergi">
    <mvz-fıkra no="1">
      <template>Yapılan soruşturma sonucunda Kurul tarafından belirlenen ve Bakanlıkça onaylanan damping marjı veya sübvansiyon miktarı kadar dampinge konu malın  ithalinde dampinge karşı vergi, sübvansiyona konu malın ithalinde ise telafi edici vergi alınır.Bununla birlikte, dampinge veya sübvansiyona konu ithalat nedeni ile meydana gelen zararın telafisinin, tespit edilen damping marjı veya sübvansiyon miktarından daha az bir miktar veya oranda vergi konulmasıyla mümkün olabileceğinin belirlenmesi halinde bu oran veya miktarda vergi uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu vergilerin, ithali evvelce gerçekleştirilen mallar için, geriye dönük olarak uygulanmasına ilişkin esaslar Cumhurbaşkanı Kararı ile tespit edilir. Ancak, geriye dönük uygulamanın süresi geçici önlemlerin alındığı tarihten itibaren 90 günü geçemez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Mükellef">
    <mvz-fıkra no="1">
      <template>Dampinge karşı vergi veya telafi edici vergi mükellefi; dampinge veya  sübvansiyona konu malı ithal eden gerçek ve tüzelkişilerdir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Tahsil mercii">
    <mvz-fıkra no="1">
      <template>Dampinge karşı vergi veya telafi edici vergi Gümrük İdarelerince, ithalde alınan diğer vergilerden ayrı olarak tahsil olunur veya teminata bağlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Soruşturma">
    <mvz-fıkra no="1">
      <template>Re'sen veya şikayet üzerine yapılan inceleme sonucunda dampingeveya sübvansiyona konu olan ithalatın ve bu ithalattan kaynaklanan zararın varlığı konusunda yeterli delillerin bulunması durumunda soruşturma açılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Soruşturmanın usul ve esasları Bakanlıkça çıkarılacak Yönetmelik ile tespit edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="Taahhütler">
    <mvz-fıkra no="1">
      <template>Soruşturma sırasında menşe ülke, ihracatçı ülke veya ihracatçı, soruşturma konusu dampingli veya sübvansiyonlu ithalattan kaynaklanan zararı ortadan kaldıracak şekilde kendiliğinden veya Kurulun önerisi üzerine taahhütte bulunabilir. Kurulun taahhüdü kabul etmesi halinde soruşturma, geçici veya kesin önlem alınmaksızın durdurulabilir veya sonuçlandırılabilir. Soruşturmanın sonuçlandırılmış olması, taahhüdün yürürlüğe girmesine kadar uygulanmış olan geçici önlemlerin gerekli kıldığı tahsilatı engellemez. Taahhütlerin yerine getirilmemesi halinde, Kurulca mevcut verilere dayalı olarak geçici veya kesin önlem alınabilir. Taahhütler ile ilgili usul ve esaslar Bakanlıkça çıkarılacak yönetmelikte, taahhütlerin geçerlilik süresi ve gözden geçirilme esasları ise Cumhurbaşkanı Kararı ile tespit edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="Geçici önlemler">
    <mvz-fıkra no="1">
      <template>Şikayet konusu ithalata ilişkin soruşturma sırasında, dampingli veya sübvansiyonlu ithalatın varlığı ve bu ithalatın zarara neden olduğu konusunda ön belirlemeler yapılması halinde, soruşturma süresince zararın önlenmesi amacıyla, Kurulca belirlenen damping marjı veya sübvansiyon miktarı kadar veya zararı ortadan kaldırmaya yetecek daha az bir oran veya miktarda teminat şeklinde geçici önlem uygulanması Bakanlık makamının onayı ile kararlaştırılabilir. Bu durum Resmi Gazetede yayımlanmak suretiyle ilgililere duyurulur. Soruşturmanın açılması tarihinden itibaren altmış gün içerisinde geçici önlem uygulanmaz. Geçici önlemlerin geçerlilik süresi dört aydır. Ancak, damping soruşturmasına konu malın Türkiye'ye ihracatının önemli bir kısmını gerçekleştiren ihracatçıların talebi halinde, bu süre, Kurulun kararı üzerine Bakanlık onayı ile altı aya kadar çıkarılabilir. Damping soruşturması sırasında, zararın önlenmesi için damping marjından daha düşük oranda bir kesin önlemin yeterli olup olmadığının incelenmesi amacıyla, bu süreler sırasıyla altı ve dokuz ay olarak belirlenebilir. Geçici önlemlerin uygulama esasları Cumhurbaşkanı Kararı ile tespit edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="Kesin önlemler">
    <mvz-fıkra no="1">
      <template>Soruşturma sonucunda dampingli veya sübvansiyonlu ithalatın varlığı ve bu ithalatın zarara neden olduğu belirlendiğinde, bu zararın önlenmesi amacıyla, Kurulca belirlenen ve Bakanlıkça onaylanarak kesinleşen damping marjı veya sübvansiyon miktarı kadar veya zararı ortadan kaldıracak daha az bir oran veya miktarda dampinge karşı vergi veya telafi edici vergi alınır. Daha önce teminat alınmış olması halinde 14 üncü maddeye göre işlem yapılır. Ancak, kesin önlem kararının maddi zarar tehdidi veya bir üretim dalının kurulmasının fiziki olarak gecikmesine ilişkin olarak alınması durumunda, soruşturma sırasında alınan teminatın tahsil edilebilmesi için Kurulun geçici önlem alınması sebebiyle maddi zarar oluşmadığı hususunda bir belirleme yapması gerekir. Böyle bir belirleme yapılmadığı takdirde, soruşturma sırasında geçici önlem olarak alınan teminat iade edilir. Yürürlüğe konulan dampinge karşı verginin veya telafi edici verginin geçerlilik süresi, uygulanması, askıya alınması, gözden geçirilmesi ve iadesi ile yürürlükte bulunan önlemlerin etkisiz kılınması halinde yapılacak işlemlere ilişkin usul ve esaslar Cumhurbaşkanı Kararı ile tespit edilir. Soruşturmaya konu olan mal için hem damping yapılmış olması hem de sübvansiyon verilmiş olması halinde, aynı durumun telafisi için dampinge karşı vergi ve telafi edici vergi birlikte uygulanamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Dampinge karşı vergi veya telafi edici vergi konulmuş olması, ilgili malın ithalatını engellemez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="Geri ödeme">
    <mvz-fıkra no="1">
      <template>Kesinleşen dampinge karşı vergi veya telafi edici vergi, daha önce alınan teminattan yüksek ise fark tahsil edilmez. Kesinleşen vergi, daha önce alınan teminattan düşük ise fark geri ödenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Soruşturmanın kapatılmasına karar verilmesi halinde geçici önlemler kaldırılır ve alınan teminatlar iade edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Satış akdi hükümlerine aykırı olmasından dolayı iade veya imha edilmek istenen malın evvelce alınmış olan dampinge karşı vergisi veya telafi edici vergisi, gümrük mevzuatının bu konuda gümrük vergisinin geri verilmesine ilişkin hükümleri dahilinde iade edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="Diğer mevzuat">
    <mvz-fıkra no="1">
      <template>Gümrük mevzuatının; gümrük vergisinin tesciline, tahakkukuna, tahsiline, geri verilmesine, takibine ve teminata bağlanmasına ilişkin bu Kanuna aykırı olmayan usul ve şekle müteallik hükümleri, dampinge karşı vergi veya telafi edici verginin tescili, tahakkuku, tahsili, geri verilmesi, takibi ve teminata bağlanması işlemlerinde de uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ödenmeyen dampinge karşı vergi veya telafi edici vergi, 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre gümrük idarelerince kovuşturulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu Kanunda hüküm bulunmayan hallerde, GATT 1994'ün VI ncı Maddesinin Uygulanmasına İlişkin Anlaşma ile Sübvansiyonlar ve Telafi Edici Tedbirler Anlaşması hükümleri dikkate alınır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="Kaldırılan ve uygulanmayacak hükümler">
    <mvz-fıkra no="1">
      <template>1615 sayılı Gümrük Kanununun 21 inci maddesi yürürlükten kaldırılmıştr.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanunun tatbikatında, Gümrük Kanunu ile diğer kanunların bu Kanuna aykırı olan hükümleri uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="Bakanlar Kurulu kararları ve yönetmelikler">
    <mvz-fıkra no="1">
      <template>Bu Kanunun;</template>
      <mvz-bent no="a">
        <template>7, 12 ve 13 üncü maddelerinde öngörülen Bakanlar Kurulu Kararları ile,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>4, 6, 10 ve 11 inci maddelerinde belirtilen Yönetmelikler, Kanunun yayımı tarihinden itibaren 3 ay içinde çıkarılır.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="Soruşturmanın kapatılması ve durdurulması" tür="Ek">
    <mvz-fıkra no="1">
      <template>Soruşturma sonucunda, soruşturma konusu ithalatın dampinge veya sübvansiyona konu olmadığının veya bu ithalattan kaynaklanan zararın bulunmadığının belirlenmesi halinde veya şikayet konusunun ortadan kalkması durumunda Kurulca soruşturma kapatılır. Damping marjının veya sübvansiyon miktarının veya ithalat miktarının ihmal edilebilecek düzeyde olduğununtespiti durumunda da damping veya sübvansiyon soruşturması kapatılır. Damping marjının veya sübvan-siyon miktarının veya ithalat miktarının ihmal edilebilecek düzeylerine ilişkin oranlar yönetmelik ile belirlenir. Şikayetin geri çekilmesi halinde Kurulca soruşturmanın kapatılmasına karar verilebilir. Taahhütlerin kabul edilmesi halinde soruşturma durdurulabilir. Sübvansiyonun uygulamadan kaldırılması halinde de soruşturma durdurulabilir veya kapatılabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Kesin önlemlerin ve taahhütlerin gözden geçirilmesi" tür="Ek">
    <mvz-fıkra no="1">
      <template>Kesin önlemler ve taahhütlerle ilgili kararlar, ilgili taraflardan birinin talebi üzerine veya re'sen gözden geçirilebilir. Kurulca gözden geçirme kararı verilmesi halinde, yeniden soruşturma açılır ve yürütülür. Ancak, yeniden soruşturma açılması, yürürlükte bulunan kesin önlemlerin ve taahhütlerin uygulanmasını engellemez. Soruşturma sonucunda kesin önlem ve taahhüt uygulaması hakkında Kurulca karar verilir. Kesin önlem kararı, soruşturma döneminde soruşturma konusu malı ihraç etmemiş olan üretici veya ihracatçıların talebi üzerine de gözden geçirilebilir. Böyle bir talep üzerine açılacak soruşturma sonucuna ilişkin karar yürürlüğe girene kadar uygulanmakta olan kesin önlem, talepte bulunan üretici veya ihracatçının ihraç ettiği soruşturma konusu mal ithalatı için teminata bağlanır. Soruşturma sonucunda, alınan teminat ile ilgili olarak, 14 üncü maddeye göre işlem yapılır.</template>
