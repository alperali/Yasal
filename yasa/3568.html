  <mvz-künye tür="kanun" no="3568" başlık="SERBEST MUHASEBECİ MALİ MÜŞAVİRLİK VE YEMİNLİ MALİ MÜŞAVİRLİK KANUNU"
             tarih="1.6.1989" rgazete-tarih="13.6.1989" rgazete-sayı="20194"
             düstur-tertip="5" düstur-cilt="28" düstur-sayfa="297" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere,  "Serbest Muhasebeci Mali Müşavirlik" ve "Yeminli Mali Müşavirlik" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun hükümlerine göre meslek icrasına hak kazananlara  "Serbest Muhasebeci Mali Müşavir", "Yeminli Mali Müşavir" denir.  Birliğin kısa adı TÜRMOB’dur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Mesleğin konusu">
      <mvz-fıkra no="A">
        <template>Muhasebecilik ve mali müşavirlik mesleğinin konusu:</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Gerçek ve tüzelkişilere ait teşebbüs ve işletmelerin;</template>
        <mvz-bent no="a">
          <template>Genel kabul görmüş muhasebe prensipleri ve ilgili mevzuat hükümleri gereğince, defterlerini tutmak, bilanço, kar-zarar tablosu ve beyannameleri ile diğer belgelerini düzenlemek ve benzeri işleri yapmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Muhasebe sistemlerini kurmak, geliştirmek, işletmecilik, muhasebe, finans, mali mevzuat ve bunların uygulamaları ile ilgili işlerini düzenlemek veya bu konularda müşavirlik yapmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yukarıdaki bentte yazılı konularda, belgelerine dayanılarak, inceleme, tahlil, denetim yapmak, mali tablo ve beyannamelerle ilgili konularda yazılı görüş vermek, rapor ve benzerlerini düzenlemek, tahkim, bilirkişilik ve benzeri işleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yukarıda sayılan işleri; bir işyerine bağlı olmaksızın yapanlara serbest muhasebeci mali müşavir denir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="B">
        <template>Yeminli mali müşavirlik mesleğinin konusu:</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>(A) fıkrasının (b) ve (c) bentlerinde yazılı işleri yapmanın yanında Kanunun 12 nci maddesine göre çıkartılacak yönetmelik çerçevesinde tasdik işlerini yapmaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yeminli mali müşavirler muhasebe ile ilgili defter tutamazlar, muhasebe bürosu açamazlar ve muhasebe bürolarına ortak olamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Meslek unvanlarının haksız kullanılması">
      <mvz-fıkra no="1">
        <template>Kanunen kullanmaya yetkisi olmayanlar tarafından  , serbest muhasebeci mali müşavir, yeminli mali müşavir unvanlarının veya bu unvan veya kavramlara karışacak veya onlara benzer her türlü unvan, ibare veya remizlerin kullanılması yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Odalar, yukarıdaki fıkraya aykırı davranışları öğrendiklerinde Cumhuriyet Savcılığına bildirmek mecburiyetindedirler. Cumhuriyet Savcılığınca tahkikatın sonucu, odaya ve ilgililere bildirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Genel şartlar">
      <mvz-fıkra no="1">
        <template>Meslek mensubu olabilmenin genel şartları şunlardır:</template>
        <mvz-bent no="a">
          <template>T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır).</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Medeni hakları kullanma ehliyetine sahip bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kamu haklarından mahrum bulunmamak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar,  zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Meslek şeref ve haysiyetine uymayan durumları bulunmamak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Serbest muhasebeci mali müşavir olabilmenin özel şartları">
      <mvz-fıkra no="A">
        <template>Serbest muhasebeci mali müşavir olabilmek için aşağıdaki özel şartlar aranır.</template>
        <mvz-bent no="a">
          <template>Hukuk, iktisat, maliye, işletme, muhasebe, bankacılık, kamu yönetimi ve siyasal bilimler dallarında eğitim veren fakülte ve yüksekokullardan veya denkliği Yükseköğretim Kurumunca tasdik edilmiş yabancı yükseköğretim kurumlarından en az lisans seviyesinde mezun olmak veya diğer öğretim kurumlarından lisans seviyesinde mezun olmakla beraber bu fıkrada belirtilen bilim dallarından lisanüstü seviyesinde diploma almış olmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>En az üç yıl staj yapmış olmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Serbest muhasebeci mali müşavirlik sınavını kazanmış olmak.</template>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Kanunları uyarınca vergi inceleme yetkisini almış ve mesleki yeterlilik sınavında başarılı olduktan sonra yeminli mali müşavirlik sınavını vermiş olanlarda, serbest muhasebeci mali müşavirlik sınavını kazanmış olma şartı aranmaz.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Serbest muhasebeci mali müşavirlik ruhsatını almış olmak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="B" durum="mülga">
        <template></template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Staj ve staj süresinden sayılan hizmetler">
      <mvz-fıkra no="1">
        <template>Serbest muhasebeci mali müşavirlik stajı, bağımsız çalışan serbest muhasebeci mali müşavir veya yeminli mali müşavir yanında veya şirketlerinde yapılır. Staja başlayabilmek için staja giriş sınavını kazanmak ve Birlik tarafından kurulan Temel Eğitim ve Staj Merkezinin eğitim programını tamamlayıp başarılı olmak şarttır. Temel Eğitim ve Staj Merkezinin kurs ve seminerlerinde geçen ve altı ayı aşmayan süreler, staj süresinden sayılır. İkinci fıkranın (a), (b), (c), (d), (e), (f), (g), (h) ve (i) bentlerindeki stajdan sayılan hizmetlerde bulunanlar bu fıkra kapsamı dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aşağıdaki bentlerde sayılan hizmet süreleri staj süresinden sayılır.</template>
        <mvz-bent no="a">
          <template>Kanunları uyarınca vergi incelemesine yetkili olanların, bu yetkiyi aldıktan sonra kamu hizmetinde geçen süreleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>4059 sayılı Hazine Müsteşarlığı ile Dış Ticaret Müsteşarlığı Teşkilat ve Görevleri Hakkında Kanun uyarınca Hazine Müsteşarlığı Hazine Kontrolörleri Kurulunda denetim yetkisine sahip olarak çalışan denetim elemanlarının bu hizmetlerde geçen süreleri ile 5411 sayılı Bankacılık Kanunu uyarınca banka denetimine yetkili olanların bu hizmetlerde geçen süreleri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>2499 sayılı Sermaye Piyasası Kanunu uyarınca Sermaye Piyasası Kurulunda denetime yetkili olarak çalışanların bu hizmetlerde geçen süreleri ile aynı Kanunun ek 1 inci maddesine göre kurulan Türkiye Muhasebe Standartları Kurulu uzmanlarının bu kurulda geçen hizmet süreleri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>3056 sayılı Başbakanlık Teşkilatı Hakkında Kanun Hükmünde Kararnamenin Değiştirilerek Kabulü Hakkında Kanun uyarınca Başbakanlık Teftiş Kurulunda görev yapan denetim yetkisine sahip Başbakanlık müfettişlerinin bu hizmetlerde geçen süreleri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>178 sayılı Maliye Bakanlığının Teşkilat ve Görevleri Hakkında Kanun Hükmünde Kararname uyarınca görev yapan Bütçe Kontrolörleri, Muhasebat Kontrolörleri ve Milli Emlak Kontrolörlerinin bu hizmetlerde geçen süreleri,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>3143 sayılı Sanayi ve Ticaret Bakanlığının Teşkilat ve Görevleri Hakkındaki Kanun ile 6762 sayılı Türk Ticaret Kanunu hükümlerine göre ticaret şirketleri nezdinde denetim yetkisine sahip olan Sanayi ve Ticaret Bakanlığı müfettişleri ve kontrolörlerinin denetim hizmetlerinde geçen süreleri,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Vergi yargısında görev yapan hakimlerin bu görevlerde geçen süreleri,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Türkiye genelinde mali denetim yapan banka müfettişlerinden yarışma sınavı ile mesleğe giren ve yeterlilik sınavında başarılı olanların, bu yetkiyi aldıkları tarihten itibaren bankalarda ve diğer kamu kurum ve kuruluşlarında geçen süreleri,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Kamu kuruluşlarının veya bilanço esasında defter tutan özel kuruluşların muhasebe birimlerinde birinci derece imza yetkisini haiz, muhasebenin fiilen sevk ve idare edilmesinden veya mali denetiminden sorumlu bulunanların bu hizmetlerde geçen süreleri ile bu birimlerde görev yapan serbest muhasebeci mali müşavir veya yeminli mali müşavirlerin gözetim ve denetiminde bunların sayısını geçmemek üzere, oda nezdinde staj dosyası açtırmış ve staja başlama sınavını kazanmış olan aday meslek mensuplarının staja başlama sınavını kazandıkları tarihten itibaren, staj koşullarını yerine getirmeleri halinde bu hizmetlerde geçen süreleri,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Bu Kanunun 5 inci maddesinin (A) fıkrasının (a) bendinde sayılan konularda öğretim üyesi, öğretim görevlisi veya araştırma görevlisi olarak çalışanların bu görevlerde geçen hizmet süreleri.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Serbest muhasebeci mali müşavirlik sınavı">
      <mvz-fıkra no="1">
        <template>Serbest muhasebeci mali müşavirlik sınavı Birlik tarafından yazılı olarak yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sınav Komisyonu 7 üyeden oluşur. Üyelerin 2'si Maliye Bakanlığını temsil eder. Diğer 3 üye Yüksek Öğretim Kurulunca teklif edilecek 5 aday arasından diğer 2 üye ise Birlikçe teklif edilecek 4 üye arasından Maliye Bakanı tarafından seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sınav komisyon üyeliklerine aday gösterileceklerin; hukuk, iktisat, maliye, muhasebe, işletme, bankacılık, idari bilimler dallarından lisans veya lisansüstü seviyesinde mezun olmaları ve bu konularda onbeş yıl çalışmış veya bu kadar süre öğretim üyeliği veya görevliliği yapmış bulunmaları şarttır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Yabancı serbest muhasebeci mali müşavirler">
      <mvz-fıkra no="1">
        <template>Serbest muhasebeci mali müşavirlik mesleğini resmen düzenlemiş olan yabancı bir devletin tabiyetindeki kişilerin, T.C. tabiyetindeki serbest muhasebeci mali müşavirliklerde aranan nitelikleri taşımak şartıyla, kendi memleketlerinde elde etmiş oldukları haklardan 2 nci madde kapsamına giren hizmetleri, karşılıklılık şartı ile serbest muhasebeci mali müşavir unvanı altında Türkiye'de de yapmalarına Cumhurbaşkanının onayı ile izin verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8/A" başlık="Serbest muhasebeci mali müşavirlere rapor düzenlettirme yetkisi ve sorumluluk">
      <mvz-fıkra no="1">
        <template>Maliye Bakanlığı, bu Kanun kapsamında yetki almış serbest muhasebeci mali müşavirlere, beyannamelerini imzaladıkları dönem ve mükelleflerle sınırlı olmak kaydıyla, 25/10/1984 tarihli ve 3065 sayılı Katma Değer Vergisi Kanunu kapsamında yapılacak iadeye dayanak teşkil edecek rapor düzenlettirmeye, bu kapsamda rapor düzenleyecek serbest muhasebeci mali müşavirlerde aranacak nitelik ve şartlar ile rapor düzenlenebilecek iade türlerini ve azami iade tutarlarını tespite, rapor düzenleme yetkisini, belirleyeceği usul ve esaslara göre yapılan eğitimlere katılma ve başarılı olma şartına bağlamaya ve uygulamaya ilişkin diğer usul ve esasları belirlemeye yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Serbest muhasebeci mali müşavirler, iadeye ilişkin düzenledikleri raporların doğru olmasından sorumludurlar. Düzenledikleri raporun doğru olmaması halinde, rapor kapsamı ile sınırlı olmak üzere, ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle birlikte müştereken ve müteselsilen sorumlu olurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Yeminli mali müşavir olabilmenin özel şartları">
      <mvz-fıkra no="1">
        <template>Yeminli mali müşavir olabilmek için:</template>
        <mvz-bent no="a">
          <template>En az 10 yıl serbest muhasebeci mali müşavirlik yapmış olmak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yeminli mali müşavirlik sınavını vermiş olmak,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yeminli mali müşavir ruhsatını almış olmak,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Şartları aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şu kadar ki, kanunları uyarınca vergi inceleme yetkisi almış olanların, bu yetkiyi aldıkları tarihten itibaren kamu kurum ve kuruluşlarında geçen hizmet süreleri ve bunların bilanço esasında defter tutan özel kuruluşların muhasebe birimlerinde birinci derece imza yetkisini haiz, muhasebenin fiilen sevk ve idare edilmesinden veya mali denetiminden sorumlu olarak geçen hizmet süreleri, yeminli mali müşavirlik ve serbest muhasebeci mali müşavirlik şirketlerinde geçen hizmet süreleri; serbest muhasebeci mali müşavirlerden bir işyerine bağlı olarak çalışanların bu işyerlerinde geçen hizmet süreleri ile hukuk, iktisat, maliye, işletme, muhasebe, bankacılık, kamu yönetimi ve siyasal bilimler dallarında öğretim üyeliği veya görevliliği yapmış olanların bu hizmetlerinde geçen süreleri serbest muhasebeci mali müşavirlikte geçmiş süre olarak kabul edilir.  Ancak, kanunları uyarınca vergi inceleme yetkisini almış olanlardan yeterlilik sınavında başarılı olamayanların, sınav tarihinden sonra vergi inceleme yetkisini haiz olmaksızın kamu kurum ve kuruluşlarında geçen hizmet süreleri dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kanunları uyarınca vergi inceleme yetkisini almış ve mesleki yeterlilik sınavını vermiş olanlar, yeterlilik sınavını kazandıkları tarihten itibaren açılacak yeminli mali müşavirlik sınavlarına genel hükümlere göre katılabilirler. Ancak, bunların yeminli mali müşavir ruhsatını alabilmeleri için birinci fıkranın (a) bendindeki süreyi tamamlamaları şarttır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Yeminli mali müşavirlik sınavı">
      <mvz-fıkra no="1">
        <template>Yeminli malî müşavirlik sınavı Birlik tarafından yazılı olarak yapılır. Maliye Bakanlığı bu sınavın adil, tarafsız ve mevzuatına uygun bir şekilde yapılması için gerekli tedbirleri almaya yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sınav komisyonu biri başkan olmak üzere yedi üyeden oluşur. Sınav komisyonu başkan ve üyeleri; dördü Maliye Bakanlığı vergi denetim elemanları arasından, biri Yükseköğretim Kurulunca önerilecek iki aday arasından, ikisi ise Birlikçe önerilecek dört aday arasından Maliye Bakanı tarafından seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sınav komisyonu üyeliklerine aday gösterileceklerin; hukuk, iktisat, maliye, işletme, muhasebe, bankacılık veya idarî bilimler dallarının birinden lisans veya lisansüstü seviyesinde mezun olmaları ve bu konularda en az onbeş yıl çalışmış veya bu kadar süre öğretim üyeliği veya görevliliği yapmış bulunmaları şarttır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Sınav komisyonunun çalışma usulleri, sınav konuları ve sınava ilişkin diğer usul ve esaslar Maliye Bakanlığının uygun görüşü alınmak suretiyle Birlikçe çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Serbest muhasebeci mali müşavirlik ve yeminli mali müşavirlik sınav sonuçlarının yargı mercilerine intikal etmesi ve mahkemece bilirkişi incelemesine gerek görülmesi halinde, sınav komisyonunda görev almamış olmaları kaydıyla, biri Maliye Bakanlığı merkezi vergi denetim elemanı, biri alanında uzman meslek mensubu, biri ise dava edilen sınav konusunda ihtisas sahibi öğretim üyesinden oluşan üç kişilik bir bilirkişi heyeti tayin edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Yemin">
      <mvz-fıkra no="1">
        <template>Yeminli mali müşavirlik mesleğine kabul edilenler, görevlerine fiilen başlamadan önce, Asliye Ticaret Mahkemesinde aşağıda yazılı şekilde yemin ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>"Yeminli mali müşavirlik mesleğinin, bir kamu hizmeti olduğunu bilerek, Türkiye Cumhuriyeti kanunlarına, mesleki kurallara ve meslek ahlakına uyacağıma, mesleğimi tam bir bağımsızlık, tarafsızlık ve dürüstlükle yerine getireceğime, üzerime aldığım işleri dikkat ve özenle yapacağıma, namusum ve şerefim üzerine yemin ederim."</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Tasdik ve tasdikten doğan sorumluluk">
      <mvz-fıkra no="1">
        <template>Yeminli mali müşavirler gerçek ve tüzelkişilerin veya bunların teşebbüs ve işletmelerinin mali tablolarının ve beyannamelerinin mevzuat hükümleri, muhasebe prensipleri ile muhasebe standartlarına uygunluğunu ve hesapların denetim standartlarına göre incelediğini tasdik ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yeminli mali müşavirlerin tasdik edecekleri belgeler, tasdik konuları ile tasdike ilişkin usul ve esaslar; gerçek ve tüzelkişilerin mükellefiyet şekilleri, iş kolları ve ciroları, döviz kazandırıcı işlemleri, ithalat ve ihracatları, yatırımın miktarları ve nevileri ile belgelerin ibraz edileceği merciler esas alınmak suretiyle Maliye Bakanlığınca çıkarılacak yönetmeliklerle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kanunları gereğince, kamu kurum ve kuruluşlarına verilen tasdik edilmiş mali tablolar, kamu idaresinin yetkili memurlarınca, tasdikin kapsamı ölçüsünde incelenmiş bir belge olarak kabul edilir. Ancak, çeşitli kanunlarla kamu idaresine tanınan teftiş ve inceleme yetkilerinin kullanılmasına ve gerektiğinde tekrarına ait hususlar saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yeminli mali müşavirler yaptıkları tasdikin doğruluğundan sorumludurlar. Yaptıkları tasdikin doğru olmaması halinde, tasdikin kapsamı ile sınırlı olmak üzere, ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle birlikte müştereken ve müteselsilen sorumlu olurlar. Yeminli mali müşavirler yaptıkları tasdikin kapsamını düzenleyecekleri raporda açıkca belirtirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları ayrı ayrı müstakil bir rapor ile tespit edilir. Bu kapsamda yeminli mali müşavir hakkında sorumluluk raporu yazılabilmesi için yeminli mali müşavirin yazılı savunması istenir. Savunma isteme yazısının tebliğ tarihinden itibaren otuz gün içinde savunma yapılmaması durumunda ilgili yeminli mali müşavir savunma hakkından vazgeçmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanun hükümlerine göre meslek icra edenlerin vergi kanunları ve diğer kanunlardaki sorumlulukları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Meslekle ilgili konularda çalıştırılmayacak olanlar">
      <mvz-fıkra no="1">
        <template>Meslek mensupları, kişisel veya ortak bürolarında mesleği yapmaları yasaklananları çalıştıramayacakları gibi, bunlarla her ne şekilde olursa olsun meslekleri ile ilgili işbirliği yapamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Serbert Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları">
    <mvz-madde no="14" başlık="Odalar, nitelikleri ve faaliyet sınırı">
      <mvz-fıkra no="1">
        <template>Serbest muhasebeci mali müşavirler ve yeminli mali müşavirlerin odaları ayrı ayrı kurulur. Serbest muhasebeci mali müşavirler ve yeminli mali müşavirler odaları, bu Kanunda yazılı esaslar uyarınca meslek mensuplarının ihtiyaçlarını karşılamak, mesleki faaliyetlerini kolaylaştırmak, bu mesleklerin genel menfaatlere uygun olarak gelişmesini sağlamak, meslek mensuplarının birbirleriyle ve iş sahipleri ile olan ilişkilerinde dürüstlüğü ve güveni hakim kılmak üzere meslek disiplini ve ahlakını korumak maksadıyla kurulan, tüzelkişiliğe sahip, kamu kurumu niteliğinde meslek kuruluşlarıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kanunda kullanılan oda deyimi, ayrı ayrı kurulacak olan serbest muhasebeci mali müşavirler, yeminli mali müşavirler odalarını ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Odalar, kuruluş amaçları dışında faaliyette bulunamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Odaların kuruluşu">
      <mvz-fıkra no="1">
        <template>Bölgesi içinde kendi mesleği konusunda en az 250 meslek mensubu bulunan il merkezlerinde ve bölgesi içinde 250 meslek mensubu bulunan ilçelerde  bir oda kurulur. Ayrı ayrı kurulan serbest muhasebeci mali müşavirler ve yeminli mali müşavirler odaları, bulundukları ilin veya ilçenin adıyla anılır. Ancak, ilçelerde oda kurulabilmesi için o ilçedeki en az 100 meslek mensubunun yazılı başvurusu aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yeterli sayıda meslek mensubu bulunmayan ve oda kurulamayan yerlerin en yakın odaya bağlanmasına veya bölge odaları kurulmasına Birlikçe karar verilir. Bu karar Maliye Bakanlığına bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Odalar, kuruluşlarını Birlik Yönetim Kurulu aracılığıyla Maliye Bakanlığına bildirmekle tüzelkişilik kazanırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Odalara üye olmayan meslek mensupları mesleki faaliyette bulunamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Amaçları dışında faaliyet gösteren odaların sorumlu organlarının görevlerine son verilmesine ve yerlerine yenilerinin seçilmesine, Maliye Bakanlığının veya bulundukları yer Cumhuriyet Başsavcılığının istemi üzerine, o yerdeki asliye hukuk mahkemesince basit usule göre yargılama yapılarak karar verilir ve dava en geç üç ay içinde sonuçlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Mahkemece beşinci fıkrada yazılı organların görevlerine son verilmesi halinde kararda ayrıca, görevlerine son verilen organları bu Kanunda yazılı usullere göre seçecek organları toplamak üzere, Oda Yönetim Kurulu için Oda Genel Kurulu üyeleri arasından, Birlik Yönetim Kurulu için Birlik Genel Kurulu üyeleri arasından beş kişi görevlendirilir. Seçim, görevlendirilen bu beş kişi tarafından bir ay içinde sonuçlandırılır. Görevlendirilen bu beş kişi bu fıkrada yazılı süre içinde görevlerine son verilen organlar gibi görevli ve yetkili olup aynı şekilde sorumludurlar. Bu fıkra hükmüne göre seçilecek yeni organlar eski organların görev sürelerini tamamlarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Maliye Bakanlığının bu Kanun uyarınca Oda organlarının işlemleri hakkında onay mercii olarak verdiği kararları görevli oda organları aynen yerine getirmekle yükümlüdürler. Bakanlık kararını, idari yargı merciinin yürütmenin durdurulmasına veya esasına ait kararı veya kanuni bir sebep olmaksızın yerine getirmeyen veya eski kararda direnme niteliğinde yeni bir karar veren veya kanunun mecburi kıldığı işlemleri Bakanlığın uyarısına rağmen yerine getirmeyen oda organları hakkında da yukarıdaki fıkralar hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Görevlerine son verilen organların yerine en geç bir ay içerisinde yenileri seçilir. Yeni seçilenler eskilerin süresini tamamlarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Görevlerine son verilen organ üyelerinin kanunda yazılı cezai sorumlulukları saklıdır. Bu organların yukarıdaki fıkra gereğince görevlerine son verilmesine sebep olan tasarrufları hükümsüzdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Ancak, milli güvenliğin, kamu düzeninin, suç işlenmesini veya suçun devamını önlemenin yahut yakalamanın gerektirdiği hallerde gecikmede sakınca varsa, odalar, vali tarafından faaliyetten men edilebilir. Faaliyetten men kararı, yirmidört aat içinde görevli hakimin onayına sunulur. Hakim, kararını kırksekiz saat içinde açıklar, aksi halde, bu idari karar kendiliğinden yürürlükten kalkar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Göreve son verme ve görevden uzaklaştırma hükümleri oda genel kurulu hakkında uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Odaların gelirleri">
      <mvz-fıkra no="1">
        <template>Odaların gelirleri aşağıda gösterilmiştir.</template>
        <mvz-bent no="a">
          <template>Odaya giriş ücreti,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yıllık üye aidatları,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yardım ve bağışlar,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Mesleki eğitime yönelik kurs ve staj ücretleri ile diğer çeşitli gelirler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Meslek mensuplarından kamu kurum ve kuruluşlarında çalışanlar ile mesleği fiilen icra etmeyenler, odaya giriş ücreti ve yıllık üye aidatlarını yüzde elli indirimli olarak öderler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Odaların organları">
      <mvz-fıkra no="1">
        <template>Odaların organları aşağıda gösterilmiştir.</template>
        <mvz-bent no="a">
          <template>Genel Kurul,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yönetim Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Disiplin Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Denetleme Kurulu.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Oda Genel Kurulunun teşekkülü">
      <mvz-fıkra no="1">
        <template>Genel Kurul, Odanın en yüksek organı olup odaya kayıtlı bütün meslek mensuplarının katılmasıyla meydana gelir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Oda Genel Kurulunun görevleri">
      <mvz-fıkra no="1">
        <template>Genel Kurulun görevleri aşağıda gösterilmiştir.</template>
        <mvz-bent no="a">
          <template>Odaların amaçlarının gerçekleştirilmesi için gereken karar ve tedbirleri almak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Oda Yönetim Kurulu, Disiplin Kurulu ve Denetleme Kurulu üyeleri ile Birlik temsilcilerini seçmek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Oda için gerekli taşınmazların satın alınması veya mevcut taşınmazların satılması hususunda Yönetim Kuruluna yetki vermek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yönetim Kurulunca yapılacak teklifleri incelemek ve karara bağlamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Meslek mensuplarınca uyulması zorunlu mesleki kararlar alınması konusunda Birliğe tekliflerde bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>bütçeyi ve kesinhesapları tasdik etmek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Yönetim Kurulunu ibra etmek, gerektiğinde sorumlu görülenler hakkında disiplin soruşturmasına karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Odaya yazılacak adayların giriş ücretlerini ve odaya yazılı üyelerin yıllık aidatlarını tespit etmek ve bunların ödeneceği tarihleri belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Oda Yönetim Kurulunun çalışma raporunu incelemek, kabul etmek.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Odanın görevlerine giren diğer işleri gündeme dayanılarak veya üyelerin teklifi üzerine inceleyip karara bağlamak.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Kanunlarla verilmiş diğer görevleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Oda Genel Kurul toplantısı">
      <mvz-fıkra no="1">
        <template>Genel Kurul üç yılda bir Mayıs ayının içinde başkanın daveti üzerine bütçeyi ve gündemdeki diğer maddeleri görüşmek ve gereken seçimleri yapmak üzere toplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Oda Yönetim Kurulu Başkanı, Yönetim veya Denetleme Kurulu gerekli gördüğü hallerde Genel Kurulu toplantıya çağırabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Oda Yönetim Kurulu Başkanı, Odaya kayıtlı üyelerin beşte birinin görüşme konularını belirten yazılı talebi ile en geç 15 gün içinde Genel Kurulu toplantıya çağırmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Oda Genel Kurul toplantısının yeri, günü, saati ve gündemi ile ilk toplantıda yeterli çoğunluk olmadığı takdirde yapılacak ikinci toplantının yeri, günü, saati ve gündemi, ilk toplantı tarihinden en az 10 gün öncesinden Genel Kurul toplantısı tarihine kadar yayımda kalacak şekilde Odanın resmi internet sitesinde ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Oda Genel Kurulu üye tam sayısının salt çoğunluğu ile toplanır. İlk toplantıda yeterli çoğunluk sağlanamazsa ikinci toplantıda çoğunluk aranmaz. Ancak, ikinci toplantıya katılan üye sayısı; Yönetim, Disiplin ve Denetleme Kurulları asıl üyelerinin toplamının iki katından aşağı olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Gerek olağan, gerekse olağanüstü Genel Kurul toplantılarında ilk iş olarak toplantıya bir başkan, bir başkanvekili ile iki katip üyeden kurulu bir başkanlık divanı seçilir. Seçim ayrı ayrı ve Genel Kurulca aksine karar alınmadıkça işari oyla yapılır ve kullanılan oyların en çoğunu alanlar seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Genel Kurul toplantılarında kararlar hazır bulunanların salt çoğunluğu ile alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Oda Yönetim Kurulu Başkanı, yönetim ve denetleme kurulu üyeleri başkanlık divanına seçilemezler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Oda Yönetim Kurulunun teşekkülü">
      <mvz-fıkra no="1">
        <template>Yönetim Kurulu, Genel Kurulca kendi üyeleri arasından üç yıl için seçilen, üye sayısı binin altında olan odalarda beş asıl ve beş yedek, üye sayısı bin ilâ beşbin arasında olan odalarda yedi asıl ve yedi yedek, üye sayısı beşbini aşan odalarda ise dokuz asıl ve dokuz yedek üyeden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yönetim Kurulu kendi üyeleri arasında gizli oyla bir başkan, bir başkan yardımcısı, bir muhasip ile oda sekreterini seçer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Odanın hukuki temsilcisi Yönetim Kurulu Başkanıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yönetim Kurulu asıl üyeleri arasında boşalma olursa yedeklerden sırasıyla en fazla oy alanlar getirilirler. Yeni üye ilk toplantıya çağırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yönetim Kurulunun toplu olarak görevinden ayrılması veya asıl üye sayısının yarıdan aşağıya düşmesi ve yedeklerinin de kalmaması halinde Oda, genel kurulu, oda denetçileri veya Maliye Bakanı tarafından olağanüstü toplantıya çağırılır ve düşen kurulların görev süresini tamamlamak üzere seçimler yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Seçilme yeterliği">
      <mvz-fıkra no="1">
        <template>Yönetim Kurulu üyeleri, kayıtlı olduğu meslek odasında en az üç yıl kıdemli olup serbest veya bir işyerine bağlı olarak bu Kanun hükümlerine göre fiilen mesleki faaliyette bulunanlar arasından seçilir. Üye sayısı yüzden az olan odalarda üç yıllık süre şartı aranmaz. Odalarda üst üste iki seçim döneminde iki defa Yönetim Kurulu başkanlığına seçilmiş olanlar, aradan iki seçim dönemi geçmedikçe Yönetim Kurulu üyeliğine seçilemezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçilme yeterliğini kaybeden Yönetim Kurulu üyelerinin görevi kendiliğinden sona erer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Oda Yönetim Kurulunun görevleri">
      <mvz-fıkra no="1">
        <template>Oda Yönetim Kurulunun görevleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Odanın bütçe teklifini düzenlemek ve bunu Genel Kurulun onayına sunmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Oda Genel Kuruluna çalışmaları hakkında rapor vermek ve Genel Kurul kararlarını yerine getirmek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Oda adına taşınır ve taşınmaz mal almak, satmak, ipotek etmek ve bunlar üzerinde her türlü ayni hak tesis etmek, kaldırmak gibi konularda Yönetim Kurulu Başkanına veya bir Yönetim Kurulu üyesine yetki vermek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Kanunlarla verilmiş diğer işleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Toplantılar">
      <mvz-fıkra no="1">
        <template>Yönetim Kurulu normal olarak ayda bir defa toplanabileceği gibi Oda Yönetim Kurulu Başkanı tarafından, doğrudan doğruya veya üyelerden en az ikisinin görüşme konusunu taşıyan yazılı isteği üzerine toplantıya çağrılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yönetim Kurulu salt çoğunlukla toplanır ve üye tam sayısının salt çoğunluğu ile karar verir. Oylarda eşitlik halinde, Başkanın bulunduğu taraf üstün tutulur. Oda Yönetim Kurulu Başkanı veya Yönetim Kurulu üyeleri, ilgili oldukları işlerin görüşülmesine katılamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yönetim Kurulu kararları hakkında düzenlenen tutanak Başkan ve üyeler tarafından imzalanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">

    <mvz-madde no="25" başlık="Oda Disiplin Kurulu">

    <mvz-madde no="27" başlık="Oda Denetleme Kurulu">

  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliği">
    <mvz-madde no="28" başlık="Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliği">
      <mvz-fıkra no="1">
        <template>Serbest muhasebeci mali müşavirler ve yeminli mali müşavirlere ait bütün Odaların katılacağı Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliği kurulur.</template>

      <mvz-fıkra no="3">
        <template>Birlik, tüzelkişiliğe sahip kamu kurumu niteliğinde meslek kuruluşudur.</template>

      <mvz-fıkra no="4">

      </mvz-fıkra>
      <mvz-fıkra no="5">

      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yukarıdaki fıkrada belirtilen yasaklara uymayan Birlik Sorumlu organları hakkında 15 inci maddenin dördüncü ve müteakip fıkraları hükümleri uygulanır.</template>

    <mvz-madde no="29" başlık="Birliğin görevleri">

        <template>Birliğin görevleri aşağıda gösterilmiştir.</template>

        <mvz-bent no="c">
          <template>Odaları ilgilendiren konularda yetkili mercilere görüş bildirmek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Odalar arasında çıkacak mesleki anlaşmazlıkları kesin olarak çözümlemek, uyulması zorunlu meslek kurallarını belirlemek.</template>

        <mvz-bent no="e">

        </mvz-bent>
        <mvz-bent no="f">

        <mvz-bent no="g">
          <template>Maliye Bakanlığınca verilecek görevleri yerine getirmek.</template>

        <mvz-bent no="h">

    <mvz-madde no="30" başlık="Birliğin gelirleri">

    <mvz-madde no="32" başlık="Birlik Genel Kurulu">
      <mvz-fıkra no="1">
        <template>Birlik Genel Kurulu Odaların üyeleri arasından seçecekleri temsilcilerden meydana gelir.  Her oda, üye sayısına bağlı olmaksızın seçeceği üç temsilciye ilâve olarak, üyelerinin yetmişbeşte biri oranında temsilci ve aynı sayıya kadar yedek temsilci seçer. Bu oranın yarısından az olanlar nazara alınmaz, fazla olanlar ise tüme tamamlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Temsilciler, her odanın olağan genel kurul toplantısında üç yıl için seçilir. Yeniden Seçilmek mümkündür.</template>

      <mvz-fıkra no="3">
        <template>Birlik Genel Kurul toplantısının yeri, günü, saati ve gündemi ile ilk toplantıda yeterli çoğunluk olmadığı takdirde yapılacak ikinci toplantının yeri, günü, saati ve gündemi, ilk toplantı tarihinden en az yirmi gün önce tirajı yüzbinin üzerinde olan bir gazetede ilan edilir ve Genel Kurul toplantısı tarihine kadar yayımda kalacak şekilde Birlik resmi internet sitesinde duyurulur.</template>

      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Genel Kurul toplantıları ilanda belirtilen gün, yer ve saatte yapılır. Temsilciler Birlik Yönetim Kurulunca düzenlenen listedeki adları karşısına imza koyarak toplantı yerine girerler. Toplantı, Birlik Yönetim Kurulu Başkanı veya görevlendireceği bir kurul üyesi tarafından açıldıktan sonra toplantıyı yönetmek üzere bir Divan Başkanı, bir Başkanvekili ve iki katip üye seçilir.</template>

      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçim yapılacak Genel Kurul toplantısından en az 15 gün önce oda ve birlik seçimleri için üyeleri belirleyen liste, toplantının gündemi, yeri, günü, saati ile çoğunluk olmadığı takdirde yapılacak ikinci toplantıya dair hususları belirten bir yazıyla birlikte üç nüsha olarak o yer ilçe seçim kurulu başkanına tevdi edilir. Bir yerde birden fazla ilçe seçim kurulu bulunduğu takdirde görevli ilçe seçim kurulu, Yüksek Seçim Kurulunca belirlenir. Toplantı tarihlerinin, gündemde yer alan diğer konular gözönünde bulundurularak, görüşmelerin, bir cumartesi günü akşamına kadar sonuçlanmasını ve seçimlerin ertesi günü olan pazar gününün dokuz - onyedi saatleri arasında yapılmasını sağlayacak şekilde düzenlenmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hakim, gerektiğinde ilgili kayıt ve belgeleri de getirtip incelemek suretiyle varsa noksanları tamamlattırdıktan sonra seçime katılacak üyeleri belirleyen liste ile yukarıdaki fıkrada belirtilen diğer hususları onaylar. Onaylanan liste ile toplantıya ait diğer hususlar oda ve birlik ilan yerlerinde asılmak suretiyle üç gün süre ile ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İlan süresi içinde listeye yapılacak itirazlar hakim tarafından incelenir ve en geç iki gün içinde kesin karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu suretle kesinleşen listeler ile toplantıya ait diğer hususlar onaylanarak ilgili oda veya birliğe gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Hakim, kamu görevlileri veya aday olmayan üyeler arasından bir başkan ile iki üyeden oluşan bir seçim sandık kurulu tayin eder. Aynı şekilde ayrıca üç yedek üye de belirler. Seçim sandık kurulu başkanının yokluğunda kurula en yaşlı üye başkanlık eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Seçim sandık kurulu, seçimlerin kanunun öngördüğü esaslara göre yürütülmesi, yönetimi ve oyların tasnifi ile görevli olup bu görevleri seçim ve tasnif işleri bitinceye kadar aralıksız olarak devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Dörtyüz kişiden fazla üye bulunması halinde her dörtyüz kişi için bir oy sandığı bulunur ve her seçim sandığı için ayrı bir kurul oluşturulur. Seçimlerde kullanılacak araç ve gereçler ilçe seçim kurulundan sağlanır ve sandıkların konacağı yerler hakim tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Seçimlerde, üyeler bağımsız aday olabilecekleri gibi, aralarında oluşturacakları grupların listelerinden de aday olabilirler. Kurul üyelikleri ve Birlik Genel Kurul temsilcilikleri için ayrı oy pusulaları oluşturulur. Oy pusulalarında, grup listelerinden aday olanlar ilgili grup ismi altında, bağımsız adaylar ise ayrıca listelenir. Oy pusulaları, hangi kurul üyeliği için hangi grup ya da bağımsız adaya oy verileceğini gösterecek şekilde hazırlanır, grup isimlerinin ve bağımsız adayların adları yanına işaret konacak kare şeklinde kutulara yer verilmek suretiyle çoğaltılır, ilçe seçim kurulu mührü ile mühürlendikten sonra kullanılır. Oylar pusulada yer alan grup ya da bağımsız adayların ismi yanındaki kutu işaretlenmek suretiyle kullanılır. Oy verme işlemi, gizli oy açık tasnif esaslarına göre yapılır. Üye listesinde adı yazılı bulunmayan meslek mensubu oy kullanamaz. Oylar, oy verenin kimliğini resmi kuruluşlarca verilen belgeyle ispat etmesinden ve listedeki isminin karşısındaki yeri imzalamasından sonra kullanılır. Oylar, üzerinde ilçe seçim kurulu mührü bulunan ve oy verme sırasında sandık kurulu başkanı tarafından verilecek zarflara konulmak suretiyle kullanılır. Mühürsüz oy pusulası ve zarfla kullanılan oylar geçersiz sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Seçime katılan grupların ve bağımsız adayların adları alt alta ve aldıkları geçerli oy hizalarına yazılır. Grupların oy sayıları, önce bire, sonra ikiye, sonra üçe... şeklinde devam edilmek suretiyle, yedekler dahil o kurulun çıkaracağı üye ve Birlik Genel Kurul temsilcisi sayısına ulaşıncaya kadar bölünür. Elde edilen paylar ile bağımsız adayların aldıkları oylar ayrım yapılmaksızın en büyükten en küçüğe doğru sıralanır. Kurul asil ve yedek üyelikleri ile Birlik Genel Kurul asil ve yedek temsilcilikleri, gruplara ve bağımsız adaylara rakamların büyüklük sırasına göre tahsis olunur. Son kalan üye veya temsilcilik için oyların eşit olması halinde, bunlar arasında ad çekilmek suretiyle tahsis yapılır. Kurul üyeliği ve Birlik Genel Kurulu temsilciliklerinin gruplara tahsisi oy pusulasında yer verilen sıralamaya göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Üyeler, oda veya birlik yönetim, denetleme ve disiplin kurullarından sadece birinde görev alabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Seçim süresinin sonunda seçim sonuçları tutanakla tespit edilip seçim sandık kurulu başkan ve üyeleri tarafından imzalanır. Birden fazla sandık bulunması halinde tutanaklar, hakim tarafından birleştirilir. Tutanakların birer örneği seçim yerinde asılmak suretiyle geçici seçim sonuçları ilan edilir. Kullanılan oylar ve diğer belgeler tutanağın bir örneği ile birlikte üç ay süreyle saklanmak üzere ilçe seçim kurulu başkanlığına tevdi edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Seçimin devamı sırasında yapılan işlemler ile tutunakların düzenlenmesinden itibaren iki gün içinde seçim sonuçlarına yapılacak itirazlar, hakim tarafından aynı gün incelenir ve kesin olarak karara bağlanır. İtiraz süresinin geçmesi ve itirazların karara bağlanmasından hemen sonra hakim yukarıdaki hükümlere göre kesin sonuçları ilan eder ve ilgili oda ile birliğe bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="14" durum="mülga">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="15">
        <template>Hakim, seçim sonuçlarını etkileyecek ölçüde bir usulsüzlük veya kanuna aykırı uygulama sebebiyle seçimlerin iptaline karar verdiği takdirde, süresi bir aydan az ve iki aydan fazla olmamak üzere seçimin yenileneceği pazar gününü tespit ederek oda ve birliğe bildirir. Belirlenen günde yalnız seçim yapılır ve seçim işlemleri bu madde ile kanunun öngördüğü diğer hükümlere uygun olarak yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="16">
        <template>İlçe seçim kurulu başkanı hakime ve seçim sandık kurulu başkanı ile üyelerine, Seçimlerin Temel Hükümleri ve Seçmen Kütükleri Hakkında Kanunda belirtilen esaslara göre ücret ödenir. Bu ücret ve diğer seçim giderleri birlik ve ilgili odaların bütçelerinden karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="17">
        <template>Seçimler sırasında sandık kurulu başkan ve üyelerine karşı işlenen suçlar, kamu görevlilerine karşı işlenmiş gibi cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="18">
        <template>Seçimlerin düzen içerisinde ve sağlıklı biçimde yürütülmesi amacıyla hakimin ve sandık kurulunun aldığı tedbirlere uymayanlara eylemin ağırlığına göre bu Kanunda yazılı disiplin cezaları verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41" başlık="Oda ve birlik organlarının denetimi">
      <mvz-fıkra no="1">
        <template>Maliye Bakanlığı oda ve birlik organlarının görevlerini kanun hükümlerine uygun olarak yapıp yapmadıklarını ve mali işlemlerini hazırlayacağı yönetmelikte belirlenecek esaslara göre denetlemeye yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Odalar, her yıl sonu itibarıyla mevcut üyelerine ilişkin olarak Maliye Bakanlığınca talep edilecek bilgileri, Ocak ayı sonuna kadar bildirmekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Odalar ve Birlik her yılın faaliyet raporlarını ve mali tablolarını izleyen yılın Ocak ayı sonuna kadar internet sitelerinde yıl sonuna kadar kalmak üzere yayımlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Odaların ve birliğin yurt dışında temsili">
      <mvz-fıkra no="1">
        <template>Odaları veya birliği temsil etmek üzere milletlerarası toplantı ve kongrelere katılmak, Maliye Bakanlığının iznine tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="Meslek sırları">
      <mvz-fıkra no="1">
        <template>Meslek mensupları ve bunların yanlarında çalışanlar, işleri dolayısıyla öğrendikleri bilgi ve sırları ifşa edemezler, çeşitli kanunlarla muhbirlere tanınan hak ve menfaatlerden faydalanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, suç teşkil eden hallerin yetkili mercilere duyurulması mecburidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Adli veya idari her türlü inceleme veya soruşturma birinci fıkra hükmünün dışındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tanıklık, sırrın ifşası sayılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yukarıdaki hükümler oda ve birlik personeli hakkında da uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Mesleki geliştirme eğitimi">
      <mvz-fıkra no="1">
        <template>Meslek mensuplarının, mesleki faaliyetlerini fiilen devam ettirmeleri için Birlik ve odalar tarafından düzenlenecek mesleki geliştirme ve eğitim seminerlerine katılmaları zorunludur. Meslek içi eğitimle ilgili konular, eğitim programları ve süreleri ile diğer hususlara ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="45" başlık="Yasaklar">
      <mvz-fıkra no="1">
        <template>Serbest muhasebeci mali müşavirler bu unvanlarla, yeminli mali müşavirler ise bu unvan ve tasdik yetkisiyle; 2 nci maddede yazılı işlerin yürütülmesi amacıyla gerçek ve tüzelkişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar, ticari faaliyette bulunamazlar, meslekle ve meslek onuru ile bağdaşmayan işlerle uğraşamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yeminli mali müşavirler, eşi (boşanmış dahi olsa) usul ve füruundan biri ve 3 üncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının veya bunların ortak oldukları firmaların işlerine bakamazlar, yukarıda sayılan yakınlıktaki akrabaları olan  serbest muhasebeci mali müşavirlerin baktığı işleri tasdik edemezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Hayri ve ilmi kuruluşlar, 233 sayılı Kamu İktisadi Teşebbüsleri Hakkında Kanun Hükmünde Kararname kapsamındaki iktisadi devlet teşekkülleri, kamu iktisadi kuruluşları ve bunların müesseseleri, bağlı ortaklıkları ve iştirakleri, kamu idarelerinin doğrudan ya da dolaylı hissedarı olduğu kurumlar ile Tasarruf Mevduatı Sigorta Fonunun yönetimindeki kurumların bu Kanun kapsamındaki faaliyetlerini yürütmemeleri şartıyla, bu kurum ve kuruluşların yönetim kurulu başkanlığı, üyeliği, denetçiliği görevleri ile bilirkişilik ve tasfiye memurluğu meslekle bağdaşmayan işler sayılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birden çok meslek mensubu çalışmalarını;  serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik ortaklık bürosu veya şirket şeklinde birleştirebilirler. Bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz. Şirket şeklinde çalışılması halinde, yapılan işlerden doğacak cezai sorumluluk işi yapan meslek mensubuna aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Meslek mensupları, iş elde etmek için reklâm sayılabilecek faaliyetlerde bulunamazlar. Tabela veya basılı kağıtlarında ruhsatname ile belirlenen mesleki unvanları dışında başka sıfat kullanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>23/6/1965 tarihli ve 634 sayılı Kat Mülkiyeti Kanununa göre anagayrimenkulün mesken olarak gösterilen bağımsız bölümlerinde kat maliklerinin izni ve benzeri şartlar aranmaksızın serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik faaliyetlerinde bulunulabilir. Bu konuda, yönetim planındaki aksine hükümler uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="46" başlık="Ücret">
      <mvz-fıkra no="1">
        <template>Ücret meslek mensuplarının hizmetlerine karşılık olan meblağı ifade eder. Ücretin asgari miktarı tarife ile belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasak olup, aksine hareket disiplin cezasını gerektirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Her odanın yönetim kurulu, her yıl ocak ayından geçerli olmak üzere  serbest muhasebeci mali müşavirler ve yeminli mali müşavirlerin yapacakları iş ve işlemler karşılığında alacakları ücretleri gösterir birer tarife hazırlayarak Birliğe gönderir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birlik yönetim kurulu, oda yönetim kurullarının tekliflerini de gözönüne almak suretiyle çeşitli odaları içine alacak grupları tespit ve gruplarda uygulanacak tarifeleri hazırlayarak Maliye Bakanlığına gönderir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Maliye Bakanlığı tarifeyi aynen veya gerekli gördüğü değişikliklerle tasdik eder. Tarifeler Resmi Gazete'de yayımlanarak yürürlüğe girer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="47" başlık="Görevle ilgili suçlar">
      <mvz-fıkra no="1">
        <template>Meslek mensupları, görevleri sırasında veya görevleri sebebiyle işledikleri suçlardan dolayı, fiilerinin niteliğine göre Türk Ceza Kanununun kamu görevlilerine ait hükümleri uyarınca cezalandırılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="48" başlık="Disiplin cezaları">
      <mvz-fıkra no="1">
        <template>Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Disiplin cezaları şunlardır:</template>
        <mvz-bent no="a">
          <template>Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali müşavirler hakkında geçici olarak mesleki faaliyetten alıkoyma, bu husus tekerrür edip bunun mahkeme kararıyla kesinleşmesi halinde de yeminli sıfatını kaldırma cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">

      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu fıkranın yürürlüğe girmesini müteakip, Birlik olağan genel kurulu toplanıncaya kadar, Kanunun, Birlik tarafından yönetmelikle düzenlenmesini öngördüğü konularda yönetmelikleri hazırlamaya ya da mevcut yönetmeliklerde değişiklik yapmaya Birlik Yönetim Kurulu yetkili olup, bunlar Maliye Bakanlığının uygun görüşü alınarak Resmi Gazetede yayımlanır. Bu düzenlemelerle ilgili olarak 33 üncü maddenin birinci fıkrasının (b) bendi uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birlik ve odaların 2010 yılı bütçesi, 2009 yılı bütçesi gelir ve giderleriyle birlikte yüzde ona kadar artırılmak suretiyle Birlik ve oda yönetimleri tarafından düzenlenir ve uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>

      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce oda nezdinde staj dosyası açtırmış ve staja başlama sınavını kazanmış olanlar hakkında, 5 inci maddenin (A) fıkrasının (b) bendinin bu Kanunla değişmeden önceki hükmü uygulanır.</template>
