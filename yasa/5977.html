  <mvz-künye tür="kanun" no="5977" başlık="BİYOGÜVENLİK KANUNU"
             tarih="18/3/2010" rgazete-tarih="26/3/2010" rgazete-sayı="27533" 
             düstur-tertip="5" düstur-cilt="49" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; bilimsel ve teknolojik gelişmeler çerçevesinde, modern biyoteknoloji kullanılarak elde edilen genetik yapısı değiştirilmiş organizmalar ve ürünlerinden kaynaklanabilecek riskleri engellemek, insan, hayvan ve bitki sağlığı ile çevrenin ve biyolojik çeşitliliğin korunması, sürdürülebilirliğinin sağlanması amacıyla biyogüvenlik sisteminin kurulması ve uygulanması, bu faaliyetlerin denetlenmesi, düzenlenmesi ve izlenmesi ile ilgili usul ve esasları belirlemektir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun; genetik yapısı değiştirilmiş organizmalar ve ürünleri ile ilgili olarak araştırma, geliştirme, işleme, piyasaya sürme, izleme, kullanma, ithalat, ihracat, nakil, taşıma, saklama, paketleme, etiketleme, depolama ve benzeri faaliyetlere dair hükümleri kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Veteriner tıbbî ürünler ile Sağlık Bakanlığınca ruhsat veya izin verilen beşeri tıbbî ürünler ve kozmetik ürünleri bu Kanun kapsamı dışındadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Ayırt edici kimlik: Her bir GDO için taşıdığı her bir genin kodunu da içeren nümerik ve alfa nümerik bir kodlama sistemini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakan: Tarım ve Köyişleri Bakanını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bakanlık: Tarım ve Köyişleri Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Basitleştirilmiş işlem: GDO ve ürünlerinden kaynaklanabilecek herhangi bir riskin olmadığı; insan, hayvan ve bitki sağlığı ile çevre ve biyolojik çeşitliliğe herhangi bir zararının bulunmadığı yönünde mevcut bilgiye ve daha önce yapılmış olan risk değerlendirmesine dayanan basitleştirilmiş karar alma sürecini,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Biyogüvenlik: İnsan, hayvan ve bitki sağlığı ile çevre ve biyolojik çeşitliliği korumak için GDO ve ürünleri ile ilgili faaliyetlerin güvenli bir şekilde yapılmasını,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Biyogüvenlik bilgi değişim mekanizması: GDO ve ürünleri ile ilgili bilimsel, teknik ve uygulamaya ilişkin bilgi ve belgelerin ulusal ve uluslararası seviyede alışverişinin kolaylaştırılması ile kamuoyunun bilgilendirilmesi ve karar sürecine katılımı amacıyla oluşturulacak bilgi alışverişi sistemini,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Biyogüvenlik sistemi: Biyogüvenliğin sağlanması için yürütülen her türlü faaliyet ile idari, hukuki ve kurumsal yapılanmanın tamamını,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Biyolojik çeşitlilik: Ekosistem de dâhil olmak üzere, türler arası ve tür içi farklılıkları,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Bulaşan: Gıda veya yeme kasten ilave edilmeyen ancak, gıdanın birincil üretim aşaması dâhil üretimi, imalatı, işlenmesi, hazırlanması, işleme tabi tutulması, ambalajlanması, paketlenmesi, nakliyesi veya muhafazası ya da çevresel bulaşma sonucu gıdada bulunan, hayvan tüyü, böcek parçası gibi yabancı maddeler hariç olmak üzere her tür maddeyi,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Canlı organizma: Mikroorganizma, steril organizma, virüs, virion ve viroidler de dahil olmak üzere genetik materyali çoğaltabilen ya da aktarabilen herhangi bir biyolojik varlığı,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Deneysel amaçlı serbest bırakma: GDO ile ilgili deneysel amaçlarla yapılacak faaliyetlerin, harici çevre ile temasını önleyecek şekilde, kontrollü şartlar altında, sınırlandırılmış belirli bir alanda yürütülmesini,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Genetik yapısı değiştirilmiş organizma (GDO): Modern biyoteknolojik yöntemler kullanılmak suretiyle gen aktarılarak elde edilmiş, insan dışındaki canlı organizmayı,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>GDO’lardan elde edilen ürünler: Kısmen veya tamamen GDO’lardan elde edilmekle birlikte GDO içermeyen veya GDO’dan oluşmayan ürünleri,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>GDO ve ürünleri: Kısmen veya tamamen GDO’lardan elde edilen, GDO içeren veya GDO’lardan oluşan ürünleri,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>İlgililer: GDO ve ürünleri ile ilgili olarak araştırma, geliştirme, işleme, piyasaya sürme, izleme, kullanma, ithalat, ihracat, nakil, taşıma, saklama, paketleme, etiketleme, depolama ve benzeri faaliyetlerde bulunanları,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>İşleme: GDO ve ürünlerinin, gıda, yem veya diğer amaçlarla kullanılmasını sağlamak için yapılan ve ürünün ilk halini önemli ölçüde değiştiren herhangi bir faaliyeti,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>İzleme: GDO ve ürünlerinden kaynaklanabilecek herhangi bir riskin olmadığı ve insan, hayvan ve bitki sağlığı ile çevre ve biyolojik çeşitliliğe herhangi bir zararının bulunmadığı tespit edilmiş, piyasaya sürülen bir GDO ve ürününün işleme ve dağıtım zinciri boyunca her aşamada takibi ve her türlü gözlem, kontrol ve denetimi,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Kapalı alanda kullanım: İnsan, hayvan ve bitki sağlığı ile çevre ve biyolojik çeşitlilik üzerinde genetiği değiştirilmiş organizmalardan kaynaklanabilecek olumsuz etkilerin biyolojik, kimyasal ve fiziksel engellerle tamamen önlenerek kontrol edilen laboratuvar ve tesislerdeki işlemlerini,</template>
        </mvz-bent>
        <mvz-bent no="ö">
          <template>Karar: GDO veya ürünlerine ilişkin yapılan bir başvuru hakkında bilimsel esaslara göre yapılan risk değerlendirmesi ve sosyo-ekonomik değerlendirme sonuçlarına göre Biyogüvenlik Kurulu tarafından verilen kararı,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>Komite: Bilimsel değerlendirmeleri yapmak üzere Kurul tarafından oluşturulan komiteleri,</template>
        </mvz-bent>
        <mvz-bent no="r">
          <template>Kurul: Biyogüvenlik Kurulunu,</template>
        </mvz-bent>
        <mvz-bent no="s">
          <template>Modern biyoteknoloji: Geleneksel ıslah ve seleksiyonda kullanılan teknikler dışında, doğal fizyolojik üreme engelini aşarak, rekombinant deoksiribonükleik asidin  ve nükleik asidin hücrelere ya da organallere doğrudan aktarılmasını sağlayan in vitro nükleik asit tekniklerinin ya da taksonomik olarak sınıflandırılmış familyanın dışında, farklı tür ve sınıflar arasında hücre füzyonu tekniklerinin uygulanmasını,</template>
        </mvz-bent>
        <mvz-bent no="ş">
          <template>Muamele: İnsan, hayvan ve bitki sağlığı ile çevre ve biyolojik çeşitliliğin korunması için alınacak tedbirler göz önünde bulundurularak ambalajlama, paketleme, etiketleme, nakil ve depolama gibi GDO üzerinde gerçekleştirilen herhangi bir işlemi,</template>
        </mvz-bent>
        <mvz-bent no="t">
          <template>Piyasaya sürme: Bu Kanun kapsamındaki her türlü ürünün bedelli veya bedelsiz olarak piyasaya arzını,</template>
        </mvz-bent>
        <mvz-bent no="u">
          <template>Protokol: 17/6/2003 tarihli ve 4898 sayılı Kanunla onaylanması uygun bulunan ve 17/7/2003 tarihli ve 2003/5937 sayılı Bakanlar Kurulu Kararıyla onaylanan Biyolojik Çeşitlilik Sözleşmesi’nin Biyogüvenlik Kartagena Protokolünü,</template>
        </mvz-bent>
        <mvz-bent no="ü">
          <template>Risk değerlendirme: GDO ve ürünlerinin, genetik değişiklikten dolayı, insan, hayvan ve bitki sağlığı, biyolojik çeşitlilik ve çevre üzerinde sebep olabileceği risklerin ve risk kaynağının test, analiz, deneme gibi bilimsel yöntemlerle tanımlanması, niteliklerinin belirlenmesi, değerlendirilmesi ve risk unsurlarının belirlenmesini kapsayan dört aşamalı süreci,</template>
        </mvz-bent>
        <mvz-bent no="v">
          <template>Risk iletişimi: Risk analizi sürecinde risk değerlendiricileri, risk yöneticileri ve diğer ilgili tarafların, tehlike, risk, riskle ilgili faktörler ve riskin algılanmasına ilişkin bilgi ve görüşler ile risk değerlendirmesi bulguları ve risk yönetimi kararlarının açıklamalarını da kapsayan bilgi ve düşüncelerin paylaşımını,</template>
        </mvz-bent>
        <mvz-bent no="y">
          <template>Risk yönetimi: GDO ve ürünlerinin, risk değerlendirmesi ve yasal faktörler göz önünde tutularak ilgili taraflarla istişare ile izin verilen amaç ve kurallar dâhilinde kullanılmasını ve muamelesini sağlamak amacıyla alınan önlemleri, uygun olabilecek kontrol önlemlerine ilişkin alternatiflerin değerlendirilmesi, tercih edilmesi ve uygulanması sürecini,</template>
        </mvz-bent>
        <mvz-bent no="z">
          <template>Sosyo-ekonomik değerlendirme: Başvuru hakkında karar verilmeden önce değerlendirilmek üzere, GDO ve ürünlerinin çevreye serbest bırakılması ve kullanılması sürecinde biyolojik çeşitlilik ve kullanıcıları ile çiftçiler üzerindeki etkilerinden kaynaklanacak sosyo-ekonomik bedelleri belirlemek üzere bilimsel esaslara dayanarak yapılan tüm çalışmaları,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Temel Esaslar">
    <mvz-madde no="3" başlık="Başvuru, değerlendirme ve karar verme">
      <mvz-fıkra no="1">
        <template>İnsan, hayvan ve bitki sağlığı ile çevrenin ve biyolojik çeşitliliğin korunması ve sürdürülebilir kullanımı gözönünde bulundurularak GDO veya ürünlerinin ithalatı, ihracatı, deneysel amaçlı serbest bırakılması, piyasaya sürülmesi ile genetiği değiştirilmiş mikroorganizmaların kapalı alanda kullanımına, bilimsel esaslara göre yapılacak risk değerlendirmesine göre karar verilir. Risk değerlendirme sonuçlarına göre risk oluşturmayacağı belirlenen başvurular için verilen kararın geçerlilik süresi on yıldır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Her bir GDO ve ürününün ilk ithalatı için gen sahibi veya ithalatçı, yurt içinde geliştirilen GDO ve ürünü için ise gerçek ve tüzel kişiler tarafından Bakanlığa başvuru yapılır. Başvurularda, başvurunun içeriğine ilişkin bilgiler ile GDO ve ürününün ne amaçla kullanılacağının belirtilmesi zorunludur. GDO ve ürünü için birden fazla amaçla kullanım başvurusu yapılabilir. Birden fazla amaçla kullanım başvurusu yapıldığında, her bir amaç için ayrı başvuru yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yapılan bir başvurunun sonucu başka başvurular için emsal teşkil etmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Alınan başvurular Bakanlık tarafından Kurula iletilir. Kurul doksan gün içerisinde başvurunun kabul edilip edilmediğini ve diğer değerlendirmelerini Bakanlığa gönderir. Bakanlık on beş gün içerisinde başvuru sahibine bildirimde bulunur. Ek bilgi veya belge talebi nedeniyle geçen süre, bu sürenin hesabında dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>GDO ve ürünlerinin;</template>
        <mvz-bent no="a">
          <template>İnsan, hayvan ve bitki sağlığı ile çevre ve biyolojik çeşitliliği tehdit etmesi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Üretici ve tüketicinin tercih hakkının ortadan kaldırılması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Çevrenin ekolojik dengesinin ve ekosistemin bozulmasına neden olması,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>GDO ve ürünlerinin çevreye yayılma riskinin olması,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Biyolojik çeşitliliğin devamlılığını tehlikeye düşürmesi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Başvuru sahibinin biyogüvenliğin sağlanmasına yönelik tedbirleri uygulamak için yeterli teknik donanıma sahip olmadığının anlaşıldığı,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>durumlarda bu başvurular reddedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Karar alma süresi, bu maddenin dördüncü fıkrasına göre alınan kararın Bakanlık tarafından başvuru sahibine bildirilmesinden sonra başlar ve bu süre iki yüz yetmiş günü geçemez. Ek bilgi veya belge talebi nedeniyle geçen süre, karar alma süresinin hesabında dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Başvuru sahibi gizli tutulmasını istediği bilgilere ilişkin talebini yazılı olarak bildirir. Bakanlık bu talebin tamamen veya kısmen karşılanmasına karar vermesi öncesinde başvuru sahibi ile gizlilik talebi hakkında bilgi alışverişinde bulunur. Bakanlık bu görüşmenin ardından taleple ilgili gerekli tedbirleri alır ve başvuru sahibine bildirir. Başvuru sahibinin veya ithalatçının adı ve adresi, GDO ve ürünlerinin kullanım amacı, sahip olduğu özellikler, ayırt edici kimlik bilgileri, bilinen ve bilimsel isimleri, transfer edilen genin alındığı organizma, alıcı ve verici organizmanın orijin ülkesi, transfer yönteminin genel tanımı, acil durumlarda uygulanacak olan yöntem ile planlar ve risk değerlendirmesinin özeti gizli bilgi olarak değerlendirilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Başvurularda, GDO veya ürünlerinin geliştirildiği veya tescil edildiği ülkede çevreye serbest bırakılmasına, tüketim amacıyla piyasaya sürülmesine izin verildiğine, verilen iznin devam ettiğine, üretimine ve tüketimine devam edildiğine ve Bakanlıkça belirlenen süreyle piyasada yer aldığına dair talep edilen belgenin sunulması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Deneysel amaçlı serbest bırakma veya piyasaya sürme amacıyla ilk defa ithal edilecek GDO ve ürünleri için ithalattan önce, yurt içinde geliştirilenler için ise piyasaya sürülmeden önce Bakanlığa ayrı ayrı başvuru yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>GDO ve ürünlerinin transit geçişinde her bir geçiş için Bakanlıktan izin alınması zorunludur. Transit geçişler, Bakanlık tarafından verilen yazılı izinde belirtilen koşullara ve 27/10/1999 tarihli ve 4458 sayılı Gümrük Kanununa uygun olarak gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Araştırma yapmaya yetkili kuruluşlar tarafından bilimsel araştırma amacıyla ithal edilecek GDO ve ürünleri için Bakanlıktan izin alınır. İthalat, yazılı izinle belirlenen koşullara uygun olarak gerçekleştirilir. Araştırma amaçlı olan GDO ve ürünleri ile genetiği değiştirilmiş mikroorganizmaların kapalı alanda kullanımı için, faaliyeti yürüteceklerin kapalı alanda kullanım koşullarını ve standartlarını karşılaması ve kaza ile çevreye yayılması durumunda uygulanabilecek tedbirlerin mevcut olması gerekir. Araştırma amaçlı yapılacak faaliyet ve sonucundan Bakanlığa bilgi verilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>GDO ve ürünleri ile ilgili yapılan başvurular hakkında risk ve sosyo-ekonomik değerlendirmeye ilişkin bilimsel raporlar, Kurul tarafından, biyogüvenlik bilgi değişim mekanizması vasıtasıyla kamuoyuna açıklanır. Kurul, bu görüşleri de dikkate alarak nihai değerlendirme raporu ile olumlu kararını toplantı tarihinden itibaren en geç otuz gün içinde gerekçeleri, varsa karşı oy gerekçeleri ve imzaları ile birlikte tekemmül ettirmek ve Bakanlığa sunmak zorundadır. Kurul kararları Resmî Gazete’de yayımlanarak yürürlüğe girer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Kararın olumsuz olması durumunda; bu karar, Bakanlıkça başvuru sahibine yazılı olarak bildirilir. Başvuru sahibi olumsuz kararın değiştirilmesine sebep olabilecek yeni bilgilere sahip olması halinde, Bakanlığa başvurarak bu olumsuz kararın gözden geçirilmesini isteyebilir. Bu durumda Kurul, sunulan yeni bilgileri dikkate alarak altmış gün içinde kararı gözden geçirir ve sonuçlarını başvuru sahibine bildirilmek üzere Bakanlığa iletir. Verilen nihai karar kamuoyuna duyurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="14">
        <template>Kurul, Komitenin kararına uymaması durumunda bu durumu gerekçeli olarak açıklar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="15">
        <template>Kararda aşağıdaki hususlar yer alır:</template>
        <mvz-bent no="a">
          <template>Geçerlilik süresi.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İthalatta uygulanacak işlemler.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kullanım amacı.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Risk yönetimi ve piyasa denetimi için gerekli veriler.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İzleme koşulları.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Belgeleme ve etiketleme koşulları.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Ambalajlama, taşıma, muhafaza ve nakil kuralları.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>İşleme, atık ve artık arıtım ve imha koşulları.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Güvenlik ve acil durum tedbirleri.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Yıllık raporlamanın nasıl yapılacağı.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="16">
        <template>Başvuru sahibi, geçerlilik süresi dolmadan en az bir yıl önce Bakanlığa müracaat ederek uzatma talep edebilir. Bu talep Kurul tarafından değerlendirilir ve sonucu başvuru sahibine bildirilmek üzere Bakanlığa gönderilir. Sonucun bir yıllık süre içerisinde başvuru sahibine bildirilmemesi durumunda, izin süresi karar verilinceye kadar uzar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="17">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Risk değerlendirme, sosyo-ekonomik değerlendirme ve risk yönetimi">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre yapılan her bir başvuru için bilimsel esaslara göre risk değerlendirmesi ve sosyo-ekonomik değerlendirme ayrı ayrı yapılır. Başvuruda verilen bilgilerin yeterli görülmemesi durumunda başvuru sahibinden yeniden deney, test, analiz ve araştırma yapılması talep edilebilir. Risk değerlendirmesi ve sosyo-ekonomik değerlendirme işlemleri ile ilgili masraflar başvuru sahibi tarafından karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yapılan başvurularda her bir başvuru için ayrı risk değerlendirmesi yapılır. Risk değerlendirmesinde laboratuvar, sera ve tarla testlerini içeren alan denemeleri ile gıda analizleri, toksisite ve alerji testleri yanında gerekli görülen diğer testlerin sonuçlarının başvuru sahibi tarafından verilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Her bir başvuru hakkında karar vermede esas alınmak üzere GDO’ların, biyolojik çeşitliliğin korunması ve sürdürülebilirliğinin sağlanması, tüketici ve kullanıcılar üzerindeki etkilerinin belirlenmesi için sosyo-ekonomik değerlendirme yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Başvurusu yapılan GDO ve ürünleri için risk ve sosyo-ekonomik değerlendirme sonuçlarına dayanarak risk yönetimi esasları belirlenir. Risk yönetimi ile ilgili detaylı bir plan hazırlanır. Risk yönetim planının hazırlanması ve uygulanmasından başvuru sahibi sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Yasaklar">
      <mvz-fıkra no="1">
        <template>GDO ve ürünlerine ilişkin aşağıdaki fiillerin yapılması yasaktır:</template>
        <mvz-bent no="a">
          <template>GDO ve ürünlerinin onay alınmaksızın piyasaya sürülmesi.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>GDO ve ürünlerinin, Kurul kararlarına aykırı olarak kullanılması veya kullandırılması.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Genetiği değiştirilmiş bitki ve hayvanların üretimi.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>GDO ve ürünlerinin Kurul tarafından piyasaya sürme kapsamında belirlenen amaç ve alan dışında kullanımı.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>GDO ve ürünlerinin bebek mamaları ve bebek formülleri, devam mamaları ve devam formülleri ile bebek ve küçük çocuk ek besinlerinde kullanılması.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Basitleştirilmiş işlem">
      <mvz-fıkra no="1">
        <template>GDO ve ürünlerinden kaynaklanabilecek herhangi bir riski olmayan ve insan, hayvan ve bitki sağlığı ile çevre ve biyolojik çeşitliliğe herhangi bir zararının bulunmadığı yönünde mevcut bilgiye ve daha önce yapılmış olan risk değerlendirmesine dayanan başvurular için, sosyo-ekonomik değerlendirme sonuçları da dikkate alınarak basitleştirilmiş işlem uygulanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Basitleştirilmiş işleme müracaat esnasında Bakanlık tarafından belirlenecek diğer hususlar dışında aşağıdaki şartların karşılanması zorunludur:</template>
        <mvz-bent no="a">
          <template>Gen kaynağı ile transfer edilen canlı organizmanın taksonomisi ve biyolojisinin biliniyor olması.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>GDO’nun insan, hayvan, çevre sağlığı ve biyolojik çeşitliliğe olabilecek etkileri hakkında yeterli bilgi bulunması.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>GDO’nun diğer canlı organizmalarla ilişkisi ile ilgili olarak kullanılabilecek daha önce yapılmış risk değerlendirmelerinden elde edilen olumsuz bir etki olmadığına dair bilginin mevcut olması.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Transfer edilen genetik materyalin tanımlanması ve transfer edildiği canlı organizma içinde belirlenmesi için detaylı yöntem ve verilerin bulunması.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Karar sonrası yapılacak işlemler">
      <mvz-fıkra no="1">
        <template>GDO ve ürünlerinin piyasaya sürülmesinden sonra, kararda verilen koşullara uyulup uyulmadığı, insan, hayvan, bitki sağlığı ile çevre ve biyolojik çeşitlilik üzerinde herhangi bir beklenmeyen etkisinin olup olmadığı Bakanlık tarafından kontrol edilir ve denetlenir. Bu amaçla yapılacak analiz işlemleri, Bakanlık tarafından belirlenen laboratuvarlar tarafından gerçekleştirilir. İthalatçı, kontrol ve denetim işlemleriyle ilgili olarak talep edilen hususları yerine getirmekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kararda belirtilen koşulların ihlali veya GDO ve ürünleriyle ilgili olarak herhangi bir riskin ortaya çıkabileceği yönünde yeni bilimsel bilgilerin ortaya çıkması durumunda, karar Kurul tarafından iptal edilebilir. Kararı iptal edilen GDO ve ürünleri toplatılır. İnsan, hayvan, bitki sağlığı ile çevre ve biyolojik çeşitliliğe olumsuz etkisi olduğu tespit edilenler derhal imha edilir; herhangi bir olumsuz etkisi tespit edilmeyenlerin ise mülkiyeti kamuya geçirilir. Bu fıkra uyarınca Bakanlıkça alınacak tedbirlerle ilgili yapılan masraflar ve diğer giderler, kusur ve sorumlulukları dikkate alınarak ilgililerden tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İzlenebilirliğin sağlanması amacıyla, GDO ve ürünlerinin ülkeye girişi ve dolaşımında, Bakanlığa beyanda bulunulması, gerekli kayıtların tutulması, kararın bir örneğinin bulundurulması ve etiketleme kurallarına uyulması zorunludur. Her bir GDO ve ürününe ayırt edici kimlik verilerek kayıt altına alınır. Kayıt altına alınan GDO ve ürünlerine ilişkin belgelerin yirmi yıl süreyle saklanması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Herhangi bir ürünün Bakanlık tarafından belirlenen eşik değerin üzerinde GDO ve ürünlerini içermesi halinde; etikette, GDO içerdiğinin açıkça belirtilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İlgililer, GDO ve ürünleriyle ilgili olarak yeni bir risk ya da risk şüphesini öğrendiği takdirde durumu derhal Bakanlığa bildirmek ve tedbir almakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İlgililer; GDO ve ürünlerinin piyasaya sürülmesi sırasında alıcıları muamele, işleme, taşıma, saklama ve diğer işlemlere ilişkin kararda yer alan güvenlik kuralları ve tedbirleri hakkında bilgilendirmekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Bakanlığın Görev ve Yetkileri ile Kurul ve Komiteler">
    <mvz-madde no="8" başlık="Bakanlığın görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>Bakanlığın görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kurulca talep edilen bilgi ve belgeleri temin etmek, istenen araştırma, deneme, kontrol ve denetlemeleri yaparak veya yaptırarak sonuçlarını Kurula bildirmek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bu Kanunda belirtilen iş ve işlemlerin uygulanması, istenmeyen GDO bulaşıklarının engellenmesi, izlenmesi, kontrolü ve denetimini sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Gerek görülmesi halinde GDO ve ürünleri ile ilgili çalışmalar yapmak için gerçek veya tüzel kişileri yetkilendirmek, yetkilendirilen bu gerçek veya tüzel kişileri denetlemek ve bunlara ilişkin usul ve esasları düzenlemek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Ülkesel biyolojik çeşitlilik ve genetik kaynakların korunması ve sürdürülebilir kullanımı için strateji geliştirmek, uygulamak veya uygulanmasını sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Biyogüvenlik bilgi değişim mekanizması aracılığıyla kamuoyunun GDO ve ürünleri ile ilgili bilgilendirilmesi ve karar alma sürecine katılımının sağlanması için gerekli tedbirleri almak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kurul ve bilimsel komitelerin faaliyetleri ile ilgili usul ve esasları belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>GDO ve ürünlerinin bu Kanunda düzenlenen haller dışındaki dolaşımını ve kullanımını önlemek için, sınır kontrolleri hususunda ilgili kurumlarla iş birliği yapmak.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>İnsan, hayvan ve bitki sağlığı ile çevrenin ve biyolojik çeşitliliğin korunması, sürdürülebilirliğinin sağlanması hususunda öngörülemeyen durumlara yönelik acil durumlarda uygulanacak yöntem ile acil eylem planlarını hazırlamak ve uygulamak.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kurulun görüşleri doğrultusunda GDO ve ürünlerinin özelliklerine göre eşik değerini belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Bu Kanun kapsamındaki ürünler ile GDO’lardan elde edilen ürünlerin etiketlenmesine ilişkin usul ve esasları belirlemek.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık, gerekli hallerde bu Kanunun uygulanması ile ilgili olarak, diğer bakanlıklar ve ilgili kurum ve kuruluşlar ile iş birliği yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>GDO ve ürünleri ile bunlara ilişkin her türlü faaliyet sürecinde meydana gelebilecek kaza durumunda, çevre, biyolojik çeşitlilik, tarımsal üretim ve insan sağlığı üzerinde olabilecek zararların önlenmesine yönelik acil eylem planlarının zamanında hazırlanması ve uygulanmasından Bakanlık sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bakanlık; insan, hayvan, bitki sağlığı ile çevrenin ve biyolojik çeşitliliğin korunması amacıyla bu Kanun kapsamına giren ürünler hakkında tamamen veya kısmen toplatma, mülkiyetin kamuya geçirilmesi, ürünün mahrecine iadesi, faaliyetin geçici olarak durdurulması, ürünün imhası, piyasaya arzı, ticareti ve işlenmesinin yasaklanması gibi ihtiyati tedbirleri almaya ve her türlü düzenlemeyi yapmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Biyogüvenlik Kurulu" durum="mülga">
    </mvz-madde>
    <mvz-madde no="10" başlık="Biyogüvenlik Kurulunun çalışma esasları" durum="mülga">
    </mvz-madde>
    <mvz-madde no="11" başlık="Biyogüvenlik Kurulunun görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>Kurulun görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Uzmanlar listesini oluşturmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Uzmanlar listesindeki kişilerden seçilen bilimsel komiteleri oluşturmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Her bir başvuru için uzmanlar listesinden bilimsel komitelerin üyelerini seçmek.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Risk ve sosyo-ekonomik değerlendirme raporlarını dikkate alarak Kurul kararlarını oluşturmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İzleme raporlarına dayanarak kararın kısmen veya tamamen iptali ile yasaklama, toplatma, imha ve benzeri yaptırımlara ilişkin kararlarını Bakanlığa sunmak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Etik komite oluşturmak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Bilimsel komitelerin oluşumu, görev ve yetkileri">
      <mvz-fıkra no="1">
        <template>Kurul tarafından her bir başvuru için, risk değerlendirme komitesi ve sosyo-ekonomik değerlendirme komitesi ile ihtiyaca göre diğer bilimsel komiteler oluşturulur. Bu komiteler on bir kişiden teşekkül eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Uzmanlar listesi, üniversiteler ve Türkiye Bilimsel ve Teknolojik Araştırma Kurumu ile Kurul tarafından gerekli görülen alanlarda çalışanlar arasından seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Komitelerin görev ve yetkileri şunlardır:</template>
        <mvz-bent no="a">
          <template>Bu Kanun kapsamında yapılan başvurularda risk değerlendirmesi için sağlanan bilgilerin bilimsel yeterliliğini belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Test, deney, deneme, analiz ve diğer işlemleri belirlemek, gerekli hallerde ek bilgi istemek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Risk değerlendirme ve sosyo-ekonomik değerlendirme raporlarını hazırlamak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Karar sonrasında ortaya çıkan veya elde edilen her türlü yeni veri ve bilgiyi değerlendirerek bilimsel görüş oluşturmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bilimsel değerlendirmeler yapmak, Kurula bilgi vermek ve rapor hazırlamak.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Komitelerin hazırladıkları bilimsel değerlendirme raporları hizmete özel olup, bu raporlar Kurul haricinde hiçbir gerçek ve tüzel kişiye, kuruma ve kuruluşa verilemez. Komite üyeleri hukuka aykırı eylemleri dışında hazırladıkları bilimsel değerlendirme raporlarından dolayı sorumlu tutulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Komiteler görevlerini yaparken bağımsızdır. Hiçbir organ, makam, merci ve kişi komitelere emir ve talimat veremez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Komitelerde görev alan üyelere yılda on iki toplantı gününü geçmemek üzere katıldıkları her toplantı günü için uhdesinde kamu görevi bulunanlara (3.000), kamu görevi bulunmayanlara ise (5.000) gösterge rakamının memur aylık kat sayısı ile çarpımı sonucu bulunacak tutarda huzur hakkı ödenir. Bilimsel komitede görev alan üyelere harcırah ödenmesini gerektiren hallerde 6245 sayılı Harcırah Kanunu hükümlerine göre en yüksek Devlet memuruna ödenen harcırah esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Davet edildiği halde, bir başvuru ile ilgili en fazla iki toplantıya mazeretsiz katılmayan üyenin komite üyeliği düşer. Kurul tarafından yeni bir üye belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Yükümlülük">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamındaki Bakanlık personeli, Kurul ve komite üyeleri, görevlerini yerine getirmeleri sırasında edindikleri gizlilik taşıyan her türlü bilgi ve belge ile ticarî sırları, kanunlarla yetkili kılınan mercilerden başkasına açıklayamaz, kendilerinin veya üçüncü şahısların yararına kullanamaz.</template>
      </mvz-fıkra>
    </mvz-madde>

  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Hukuki Sorumluluk, İdari Yaptırımlar ve Ceza Hükümleri">
    <mvz-madde no="14" başlık="Sorumluluğa ilişkin temel ilkeler">
      <mvz-fıkra no="1">
        <template>GDO ve ürünleri ile ilgili faaliyetlerde bulunanlar, bu Kanun kapsamında izin almış olsalar dahi, insan, hayvan ve bitki sağlığı ile çevrenin ve biyolojik çeşitliliğin korunması, sürdürülebilirliğinin sağlanmasına karşı oluşan zararlardan sorumludur. Bu sorumluluk, GDO ve ürünlerinin, başvuru ve kararda yer alan koşulları sağlamadığının anlaşılması durumunda zarar oluşmasa dahi geçerlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>GDO’ların kapalı alanda kullanımı ve gıda, yem, işleme ve tüketim amacıyla piyasaya sürülmesi, ithalatı ve transit geçişi için izin alma zorunluluğu olduğu halde, bu faaliyetleri izinsiz olarak gerçekleştirenler ile GDO’ları çevreye serbest bırakanlar ve üretenler bu faaliyetler sonucunda meydana gelen her türlü zarardan sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ortaya çıkan bir zararın GDO’lardan kaynaklandığının kabul edilebilmesi için, zararın organizmaların sahip olduğu yeni özelliklerden veya organizmaların yeniden üretiminden veya değiştirilmesinden ya da organizmaların değiştirilmiş materyalinin başka organizmalara geçişinden kaynaklanması gerekir. Zararlardan kaynaklanan sorumluluğun tespitinde; zararların tarım, orman, gıda ve yem ürünlerinin içindeki genetik değişiklikten kaynaklanmış olup olmadığı göz önünde tutulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Her ne amaçla olursa olsun piyasaya sürülmüş GDO ve ürünlerini karar koşullarına uygun olmayan bir şekilde muameleye tabi tutmak suretiyle veya başka bir yolla zararın ortaya çıkmasına ya da sonuçlarının ağırlaşmasına sebep olanlarla bunları ticari olarak üretenler, işleyenler, dağıtanlar ve pazarlayanlar bu zararlardan müteselsilen sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>GDO ve ürünlerini piyasaya süren, ticari olarak işleyen, dağıtan ve pazarlayanlar meydana gelebilecek zararlar ve bunlara ilişkin sorumluluklar hakkında birbirlerini bilgilendirmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>GDO’ları muameleye tabi tutanlar, muamele nedeniyle çevrede zararın meydana gelmemesi veya meydana gelen zararın sonuçlarının ağırlaşmaması için risk değerlendirmesine göre belirlenen tedbirlerin masraflarını karşılamakla yükümlüdür. Sorumlular, çevrenin zarar görmüş veya tahrip olmuş unsurlarının eski haline getirilmesi veya aynı değerdeki unsurların yerine konulması için gerekli masrafları da karşılar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>GDO ve ürünlerinin neden olduğu zararların tazmin edilmesini talep hakkı, zarar görenin, zarardan veya zarar vereni öğrenmesinden itibaren iki yıl ve her halükarda zararı doğuran olayın meydana gelmesinden itibaren yirmi yıl sonra düşer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Zararın sel, dolu, heyelan, deprem gibi tabii afetlerden veya zarar görenin ya da üçüncü kişinin ağır kusurundan kaynaklandığının tespit edilmesi halinde sorumluluk hükümleri uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Ceza hükümleri">
      <mvz-fıkra no="1">
        <template>GDO ve ürünlerini bu Kanun hükümlerine aykırı olarak ithal eden, üreten veya çevreye serbest bırakan kişi, beş yıldan on iki yıla kadar hapis ve on bin güne kadar adli para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunda belirlenen esaslar çerçevesinde ithal edilen veya işlenen GDO’ları veya GDO ve ürünlerini, ithal izninde belirlenen amaç ve alan dışında kullanan, satışa arz eden, satan veya devreden ya da bu özelliğini bilerek ve ticari amaçla satın alan, kabul eden, nakleden veya bulunduran kişi, dört yıldan dokuz yıla kadar hapis ve yedi bin güne kadar adli para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda belirlenen esaslar çerçevesinde ithal edilen veya işlenen GDO’lardan elde edilen ürünleri, ithal izninde belirlenen amaç ve alan dışında kullanan, satışa arz eden, satan veya devreden ya da bu özelliğini bilerek ve ticari amaçla satın alan, kabul eden, nakleden veya bulunduran kişi, üç yıldan yedi yıla kadar hapis ve beş bin güne kadar adli para cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yalan beyanda bulunarak bu Kanun hükümlerine göre alınması gereken ithal veya işleme iznini alan kişi, fiili daha ağır cezayı gerektiren başka bir suç oluşturmadığı takdirde, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır. Bu izne dayalı olarak GDO’ların, GDO ve ürünlerinin veya GDO’lardan elde edilen ürünlerin ithal edilmesi, işlenmesi, kullanılması, satışa arz edilmesi, satılması, devredilmesi, kabul edilmesi, nakledilmesi veya bulundurulması halinde, ayrıca yukarıdaki fıkralardaki hükümlere göre cezaya hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu maddede yer alan suçların bir tüzel kişinin faaliyeti çerçevesinde ve yararına olarak işlenmesi halinde, bu tüzel kişiye yüz bin Türk Lirasından iki yüz bin Türk Lirasına kadar idari para cezası verilir ve ayrıca tüzel kişi hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanunun 7 nci maddesinde düzenlenen yükümlülükleri yerine getirmeyen başvuru sahiplerine, fiilleri suç oluşturmadığı takdirde, her bir yükümlülük ihlali dolayısıyla on bin Türk Lirasından otuz bin Türk Lirasına kadar idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>GDO ve ürünlerini bu Kanun hükümlerine aykırı olarak kapalı alanda kullananlara, fiilleri suç oluşturmadığı takdirde, on bin Türk Lirası idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>9 uncu maddenin sekizinci fıkrası hükmüne uymayanlar hakkında 2/10/1981 tarihli ve 2531 sayılı Kamu Görevlerinden Ayrılanların Yapamayacakları İşler Hakkında Kanunun 4 üncü maddesinde belirtilen cezalar uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Beşinci fıkra hükmüne göre idari para cezasına karar vermeye davaya bakan mahkeme, altıncı ve yedinci fıkralar hükümlerine göre idari para cezasına karar vermeye Cumhuriyet savcısı yetkilidir. Bu Kanuna göre verilen idari para cezaları tebliğinden itibaren bir ay içerisinde ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
