  <mvz-künye tür="kanun" no="2985" başlık="TOPLU KONUT KANUNU"
             tarih="2/3/1984" rgazete-tarih="17/3/1984" rgazete-sayı="18344"
             düstur-tertip="5" düstur-cilt="23" düstur-sayfa="53" />
    
  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Konut ihtiyacının karşılanması konut inşaatını yapanların tabi olacağı usul ve esasların düzenlenmesi, memleket şart ve malzemelerine uygun endüstriyel inşaat teknikleri ile araç ve gereçlerin geliştirilmesi ve Devletin yapacağı desteklemeler  bu Kanun hükümlerine tabidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Toplu Konut İdaresinin gelirleri, harcamaları ve denetimi">
    <mvz-fıkra no="1">
      <template>Toplu Konut İdaresinin gelirleri;</template>
      <mvz-bent no="a">
        <template>İdare tarafından satışı yapılacak konut, işyeri, arsa ve arazilerin satış ve kira gelirlerinden,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>İdare tarafından açılacak kredilerin geri ödemelerinden,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Hazine arsaları üzerine yapılan konut ve işyerlerinin arsa maliyet bedellerinin en çok yüzde 25’ine kadar alınacak katılım payından,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Hazine Müsteşarlığının uygun görüşü üzerine yurt dışından sağlanacak kredilerden,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Faiz gelirlerinden,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Bütçe kanunları ile tahsis edilen ödenek ve 29.6.2001 tarihli ve 4705 sayılı Kanunun 1 inci maddesi uyarınca alınan harçlardan,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Ek 1 inci maddenin birinci fıkrasının (m) bendi kapsamında; talep edilen proje ve uygulamaların İdarece yapılması veya yaptırılması için imzalanan protokollerle belirlenen inşaat bedelinin yüzde üçünden az, yüzde onundan fazla olmamak üzere, ilgili kurum ve kuruluşlardan alınacak olan idare hizmet payı tutarlarından,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>İdareye yapılacak bağış ve yardımlardan,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Meydana gelir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Toplu Konut İdaresinin kaynakları aşağıdaki amaçlar için kullanılır:</template>
      <mvz-bent no="a">
        <template>Ferdi ve toplu konut kredisi verilmesi, köy mimarisinin geliştirilmesine, gecekondu alanlarının dönüşümüne, tarihi doku ve yöresel mimarinin korunup, yenilenmesine yönelik projelere kredi verilmesi ve kredilerde faiz sübvansiyonu yapılması.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Toplu konut alanlarına arsa temin edilmesi.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Araştırma, turizm alt yapıları, konut alt yapıları, okul, karakol, ibadethane, sağlık tesisleri, spor tesisleri, postane, çocuk parkları, benzeri tesisler ve konut sektörü sanayiini teşvik için yatırım ve işletme kredisi verilmesi.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>İş ve istihdam yaratmak üzere esnaf ve sanatkarlara ait işyerleri ve küçük sanayi teşebbüslerinin kredi yoluyla desteklenmesi.</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Afet mahallerinde konut yapımının teşvik ve desteklenmesi.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İdare kaynaklarının kullanımına ilişkin usul ve esaslar Cumhurbaşkanınca yürürlüğe konulacak yönetmelikle tespit edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Toplu Konut İdaresinin gelir ve giderleri Yüksek Denetleme Kurulu denetimine tabidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Toplu Konut Fonunun kullanma sahası" durum="mülga">
  </mvz-madde>
  <mvz-madde no="4" başlık="İskan sahalarının tespiti, kamulaştırma ve kadastro">
    <mvz-fıkra no="1">
      <template>Başkanlık, gecekondu dönüşüm projesi uygulayacağı alanlarda veya mülkiyeti kendisine ait arsa ve arazilerde veya valiliklerce toplu konut iskan sahası olarak belirlenen alanlarda çevre ve imar bütünlüğünü bozmayacak şekilde her tür ve ölçekteki planlar ile imar planlarını yapmaya, yaptırmaya ve tadil etmeye yetkilidir. Bu planlar; büyükşehir belediye sınırları içerisinde kalan alanlar için büyükşehir belediye meclisi tarafından, il ve ilçe belediye sınırları ile mücavir alanları içerisinde kalan alanlar için ilgili belediye meclisleri tarafından, beldelerde ve diğer yerlerde ilgili valilik tarafından, planların belediyelere veya valiliğe intikal ettiği tarihten itibaren üç ay içerisinde aynen veya değiştirilerek onaylanır. Belediyeler ve valilik tarafından üç ay içerisinde onaylanmayan planlar Başkanlık tarafından re’sen onaylanır. Belediyeler, valilik veya Başkanlık tarafından onaylanan bu planlar; askı, ilan ve itiraza dair kararlar da dahil olmak üzere 3194 sayılı İmar Kanunu hükümlerine göre belediyeler ve ilgili kamu kurumları tarafından yapılacak tüm işlemler Başkanlık tarafından re’sen yapılmak suretiyle yürürlüğe konur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Başkanlık kanundaki ve Cumhurbaşkanlığı Kararnamelerindeki görevleri çerçevesinde gerçek ve tüzel kişilere ait arazi ve arsaları ve bunların içerisinde veya üzerinde bulunan her türlü eklenti ve yapıları kamulaştırmaya yetkilidir. Başkanlık tarafından yapılacak kamulaştırmalar, 4.11.1983 tarihli ve 2942 sayılı Kamulaştırma Kanununun 3 üncü maddesinin ikinci fıkrasındaki iskân projelerinin gerçekleştirilmesi amaçlı kamulaştırma sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Projelerin teşviki">
    <mvz-fıkra no="1">
      <template>Toplu Konut ve Kamu Ortaklığı Kurulunun tespit edeceği esaslar çerçevesinde teşvik edilen projeler, teşvikle ilgili mevzuat hükümlerine tabidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Uygulanmayacak kanunlar ve sözleşme uygulamaları">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerine göre yapılacak işlemlerde, 70 sayılı Kanun Hükmünde Kararnamenin 38 ve 50 nci maddeleri, 1050 sayılı Muhasabei Umumiye Kanunu, 832 sayılı Sayıştay Kanunu ve 2886 sayılı Devlet İhale Kanunu hükümleri uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Başkanlık tarafından yapılan taşınmaz mülkiyetinin devrini amaçlayan gayrimenkul satış sözleşmeleri ile gayrimenkul satış vaadi sözleşmelerinde resmi şekil şartı aranmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İkinci fıkra kapsamındaki sözleşmeler ile taşınmaz satışlarına yönelik sözleşme ilişkisi kurulmadan önce alıcılar tarafından imzalanması gereken başvuru evrakları, müzakere tutanakları ve buna benzer diğer evraklar; yazılı şekilde veya uzaktan iletişim araçlarının kullanılması suretiyle mesafeli olarak ya da mesafeli olsun olmasın bir bilişim veya elektronik haberleşme cihazı üzerinden gerçekleştirilecek ve karşı taraf kimliğinin doğrulanmasına imkân verecek yöntemler yoluyla düzenlenebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yükümlülüklerini yerine getirmeyen hak sahibinin vefatı neticesinde yasal mirasçılarının mirasçılık sıfatlarını gösteren bir belgeyi sunmaması halinde Başkanlık, adli makamlardan herhangi bir yetki almaksızın mirasçılık belgesi düzenlenmesi için mahkeme veya noterliğe başvurabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Başkanlık, görevleri ile ilgili dava ve icra işlemlerinde teminat yatırmaktan muaftır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Toplu Konut Fonunun denetimi" durum="mülga">
  </mvz-madde>
  <mvz-madde no="8" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Çevre ve Şehircilik Bakanlığına bağlı ve kamu tüzel kişiliğine sahip Toplu Konut İdaresi Başkanlığı kurulmuştur. Toplu Konut İdaresi Başkanlığının görevleri aşağıda belirtilmiştir.</template>
      <mvz-bent no="a">
        <template>Devlet garantili veya garantisiz iç ve dış tahviller ile her türlü menkul kıymetler çıkarmak,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Yurt dışından, görev alanıyla ilgili harcamalarda kullanılmak üzere Hazine Müsteşarlığının uygun görüşü üzerine kredi almaya karar vermek,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Konutların finansmanı için bankaların iştirakini sağlayacak tedbirleri almak, bu amaçla gerektiğinde bankalara kredi vermek, bu hükmün uygulanmasına ilişkin usulleri tesbit etmek,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Konut inşaatı ile ilgili sanayii veya bu alanda çalışanları desteklemek,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Konut sektörüyle ilgili şirketler kurmak veya kurulmuş şirketlere ve finans kurumlarına ortak olmak,</template>
      </mvz-bent>
      <mvz-bent no="f" durum="mülga">
        <template></template>
      </mvz-bent>
      <mvz-bent no="g" durum="mülga">
        <template></template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Gerektiğinde her çeşit araştırma, proje ve taahhüt işlemlerinin sözleşmeyle yaptırılmasını temin etmek,</template>
      </mvz-bent>
      <mvz-bent no="ı">
        <template>Ferdi veya toplu konut kredisi vermek, köy mimarisinin geliştirilmesine, gecekondu alanlarının dönüşümüne, tarihi doku ve yöresel mimarinin korunup yenilenmesine yönelik uygulamalar yapmak ve bu konulardaki projeleri kredilendirmek ve gerektiğinde tüm bu kredilerde faiz sübvansiyonu yapmak,</template>
      </mvz-bent>
      <mvz-bent no="j">
        <template>Yurt içi ve yurt dışında doğrudan veya iştirakleri aracılığıyla proje geliştirmek; konut, alt yapı ve sosyal donatı uygulamaları yapmak veya yaptırmak,</template>
      </mvz-bent>
      <mvz-bent no="k">
        <template>İdareye kaynak sağlanmasını teminen kâr amaçlı projelerle uygulamalar yapmak veya yaptırmak,</template>
      </mvz-bent>
      <mvz-bent no="l">
        <template>Doğal afet meydana gelen bölgelerde gerek görüldüğü takdirde konut ve sosyal donatıları, alt yapıları ile birlikte inşaa etmek, teşvik etmek ve desteklemek,</template>
      </mvz-bent>
      <mvz-bent no="m">
        <template>Bakanlıkların talebi ve bağlı bulunduğu Bakanın onayı halinde talep konusu proje ve uygulamaları yapmak veya yaptırmak,</template>
      </mvz-bent>
      <mvz-bent no="n">
        <template>Kanunlarla ve diğer mevzuatla verilen görevleri yapmak.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>8/6/1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanununun 56 ncı maddesi ile mülga 45 inci ve 64 üncü maddelerine, 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 47 nci maddesine ve 3/11/1980 tarihli ve 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanuna göre veya 2330 sayılı Kanun hükümleri uygulanarak aylık bağlanmasını gerektiren kanunlara göre harp veya vazife malulü olmaları sebebiyle kendilerine aylık bağlananlara bir konut ile sınırlı olmak kaydıyla Toplu Konut İdaresince faizsiz olarak kredi verilir. Aynı kanunlar kapsamına giren sebeplerle hayatını kaybedenlerin dul ve yetimleri ile harp veya vazife malullüğü aylığı almaktayken faizsiz kredi hakkından yararlanmaksızın hayatını kaybedenlerin dul ve yetimleri için ise; bir konut ile sınırlı olmak üzere, öncelikle dul eşine, eşi hayatta değilse veya evlenmişse kredi kullanacak çocuklardan en az birisinin yetim aylığı almakta olması kaydıyla aylık bağlanma koşullarına bakılmaksızın talepte bulunan çocuklarına müştereken, bu kişiler bulunmadığı takdirde de öncelikle anaya olmak üzere ana veya babasına konut sahibi yapmak amacıyla Toplu Konut İdaresince faizsiz olarak kredi verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Birinci fıkrada belirtilen haller kapsamında harp veya vazife malulü sayılanlardan sınıf veya görev değiştirerek çalışmaya devam eden kamu görevlileri ile ilgili mevzuatına göre aylık bağlanan malullerden, 5510 sayılı Kanunun 4 üncü maddesi kapsamında çalışmaya başlamaları nedeniyle ödenmekte olan aylıkları kesilenler de birinci fıkra hükmünden yararlanırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu kredinin tavan tutarı, Yüksek Planlama Kurulunca belirlenir. Kredi için yapılacak başvurulara, kredilerin kullandırılmasına, geri ödeme süre ve yöntemlerine ilişkin usul ve esaslar, Maliye Bakanlığı, Aile ve Sosyal Politikalar Bakanlığı ile Sosyal Güvenlik Kurumunun görüşü alınarak Toplu Konut İdaresince çıkarılan yönetmelik ile belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Toplu Konut İdaresi personeli 657 sayılı Devlet Memurları Kanunu Hükümlerine tabidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Toplu Konut İdaresi Başkanlığında 657 sayılı Devlet Memurları Kanunu ile diğer kanunların sözleşmeli personel çalıştırılmasına dair hükümlerine bağlı kalınmaksızın özel bilgi ve ihtisas gerektiren konularda sözleşmeli personel çalıştırılabilir. Bu fıkra hükmüne göre çalıştırılacak olanlar sosyal güvenlik açısından T.C. Emekli Sandığı  ile ilgilendirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu İdarenin, 657 sayılı Devlet Memurları Kanununun 59 uncu maddesinde belirtilen unvanlarına ait kadroları ile Daire Tabibi Kadrosu karşılık gösterilmek suretiyle sözleşmeli personel çalıştırılabilir. Bunlar istekleri halinde T.C. Emekli Sandığı ile ilgilendirilirler. Bu suretle sözleşmeli çalıştırılacaklardan T.C. Emekli Sandığından aylık alanların bu aylıkları kesilmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Üçüncü ve dördüncü fıkralara göre çalıştırılacakların adedi, ücretlerinin taban ve tavanı ile diğer mali hakları, Cumhurbaşkanınca çıkarılacak hizmet sözleşmesi esaslarına göre tespit edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu İdarede 14 diğer kamu kurum ve kuruluşları personeli maaşsız izinli ve sözleşmeli olarak çalıştırılabilirler. Bu kişilerin memuriyetleri ile buna ait her türlü hak ve mükellefiyetleri saklı tutulur. İzinli oldukları müddet, terfi ve emekliliklerinde fiili hizmet olarak hesaba katıldığı gibi, bunlardan izinli oldukları sırada terfi hakkını kazananlar başkaca hiçbir işleme lüzum kalmaksızın terfi ettirilirler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Ek" durum="mülga">
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bu Kanunla yapılması öngörülen işlerde 2886 sayılı Devlet İhale Kanunu, 1050 sayılı Muhasebei Umumiye Kanunu ve 832 sayılı Sayıştay Kanunu hükümleri uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Toplu Konut İdaresi Başkanlığınca uygulama yapılacak yerlerde ihtiyaç olması halinde Başkanlıkça gerekli birimler kurulabilir. Bu birimlerde Başkanlık teşkilâtı kadrolarındaki personel çalıştırılır; hangi kadroların bu birimlere tahsis edileceği 190 sayılı Kanun Hükmünde Kararnamenin 8 inci maddesinin üçüncü fıkrasındaki usule tâbidir. Gerektiğinde valilik, belediye ve diğer kamu kurumları personelinden ihtiyaç duyulanlar Başkanlığın talebi üzerine kurumları tarafından bu birimlerde geçici olarak görevlendirilirler. Uygulamanın tamamlanmasını müteakip bu birimler kaldırılır ve personeli kurumlarına iade edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Başkanlık gecekondu bölgelerinin tasfiyesine veya iyileştirilerek yeniden kazanımına yönelik olarak gecekondu dönüşüm projeleri geliştirebilir, inşaat uygulamaları ve finansman düzenlemeleri yapabilir. Bu amaçla gecekondu bölgelerinde, gerçek kişilerin ve özel hukuk tüzel kişilerinin mülkiyetinde bulunan gayrimenkuller ile 24.2.1984 tarihli ve 2981 sayılı İmar ve Gecekondu Mevzuatına Aykırı Yapılara Uygulanacak Bazı İşlemler ve 6785 Sayılı İmar Kanununun Bir Maddesinin Değiştirilmesi Hakkında Kanuna göre hak sahibi olan kişilerin haklarına konu gayrimenkullerin değeri Başkanlık tarafından tespit edilir ve Başkanlık bu kişilerle proje çerçevesinde anlaşmalar yapabilir. Bu anlaşmaların usul ve esaslarını belirlemeye Başkanlık yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Gecekondu Dönüşüm Projesi çerçevesinde idare tarafından yapımı gerçekleştirilen konutların bedelleri proje uygulamalarının yapıldığı illerdeki mevcut ekonomik durum, doğal afetler, konut rayiç bedelleri ve gecekondu bölgesindeki kişilerin gelir durumu göz önünde bulundurularak gerekli görüldüğünde kamuoyuna ilân edilerek yapım maliyetlerinin altında tespit edilebilir. Bu madde uyarınca konut bedellerini, ödeme şeklini ve süresini belirlemeye Toplu Konut İdaresi Başkanının önerisi üzerine Başkanlığın bağlı bulunduğu Bakan yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Başkanlık, yukarıda belirtilen hükümler kıyas yoluyla uygulanmak suretiyle depremle ilgili dönüşüm projeleri de gerçekleştirebilir. Bu projelere dair işlemlerin usul ve esaslarını belirlemeye Başkanlık yetkilidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Başkanlık lehine sonuçlanan dava ve icra takipleri nedeniyle hükme bağlanarak karşı taraftan tahsil olunan vekâlet ücretlerinin; hukuk müşavirlerine, avukatlara ve hukuk servislerinde fiilen görev yapan memurlara dağıtımı hakkında 2.2.1929 tarihli ve 1389 sayılı Devlet Davalarını İntaç Eden Avukat Ve Saireye Verilecek Ücreti Vekalet Hakkında Kanun hükümleri kıyas yolu ile uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Toplu Konut İdaresi Başkanlığı tarafından yapılacak veya yaptırılacak yapılara, imar plânlarında o maksada tahsis edilmiş olmak, uygulama imar plânı ve mevzuata aykırı olmamak üzere mimarî, statik, tesisat ve her türlü fennî mesuliyetin Başkanlık tarafından üstlenilmesi ve mülkiyetin belgelenmesi kaydıyla başkaca belge istenmeksizin müracaat tarihinden itibaren onbeş gün içinde avan projeye göre yapı ruhsatı verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Toplu Konut İdaresi Başkanlığı tarafından yapılacak veya yaptırılacak her türlü alt yapı ve üst yapı inşaatlarıyla ilgili olarak, 26/5/1981 tarihli ve 2464 sayılı Belediye Gelirleri Kanununun ek 6 ncı maddesinde yer alan bina inşaat harcı ve 84 üncü maddesinin (1) ve (2) numaralı bentlerinde yer alan çeşitli harçlar, Kanundaki tarifesinde belirtilen en az tutarlar üzerinden alınır. Bu harçların dışında her ne ad altında olursa olsun hizmet karşılığı olsa dahi başkaca bir ücret veya bedel alınamaz. Belediyeler, bu yapılarla ilgili yapı kullanma izin belgesi müracaatları üzerine, Toplu Konut İdaresi Başkanlığı tarafından geçici kabulün yapılmış olması kaydıyla başkaca belge aranmaksızın 15 gün içinde yapı kullanma izin belgesi vermek zorundadır. İstenen diğer belgeler Toplu Konut İdaresi Başkanlığı tarafından daha sonra tamamlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Toplu Konut İdaresi Başkanlığının konut satışından kaynaklanan ipotekli veya ipoteksiz alacakları, ipotek finansmanı kuruluşları tarafından devralınabilir ve devredilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Toplu Konut Fonu tasfiye edilmeden önce Fondan gelir payı alan kurumlar, 9/4/1990 tarihli ve 412 sayılı Kanun Hükmünde Kararnamenin geçici 3 üncü maddesine ve 20/6/2001 tarihli ve 4684 sayılı Kanunun geçici 3 üncü maddesine istinaden Toplu Konut İdaresi gelirlerinden pay talep edemezler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Toplu Konut İdaresi Başkanlığı, 488 sayılı Damga Vergisi Kanunu ve 492 sayılı Harçlar Kanunu uygulaması açısından özel bütçeli idareler kapsamında değerlendirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Ekli (1) sayılı listede yer alan kadrolar ihdas edilerek 13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnamenin eki (III) sayılı cetvelin Toplu Konut İdaresi Başkanlığına ilişkin bölümüne eklenmiştir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>28/3/2001 tarihli ve 2001/2202 sayılı Bakanlar Kurulu Kararı gereğince, Tasfiye Halinde Türkiye Emlak Bankası Anonim Şirketi tarafından Toplu Konut İdaresi Başkanlığına devredilen varlıklardan ve bu varlıklarla ilgili devirden önce yapılmış akitlerden doğan yükümlülükler nedeniyle Toplu Konut İdaresi Başkanlığından ve ortaklıklarından hiçbir hak ve alacak talebinde bulunulamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Ekli listede yer alan kadrolar ihdas edilerek 13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnamenin eki  sayılı cetvelin Toplu Konut İdaresi Başkanlığına ilişkin bölümüne eklenmiştir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Kanunlar ve Cumhurbaşkanlığı Kararnameleri ile verilmiş yetkiler çerçevesinde Başkanlığa devri talep edilen taşınmazların kentsel dönüşüm ve gelişim alanı ilan edilen yerlerde kalması halinde, Başkanlığın devir talebi önceliklidir. Bu yerlerde Başkanlık mülkiyetinde bulunan taşınmazlar ile devri talep edilen taşınmazlara ilişkin olarak Başkanlık, kanunlardan ve Cumhurbaşkanlığı Kararnamelerinden kaynaklanan tüm yetkilerini münhasıran kullanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Yeni yerleşim alanı olarak belirlenen sosyal konut alanı içerisinde bulunan yerlerde, kamu kurum ve kuruluşlarına ait taşınmazlardan uygulamaya dâhil edilecek olanlar ile özel mülkiyete tabi diğer bütün taşınmazlar için Çevre, Şehircilik ve İklim Değişikliği Bakanlığı tarafından ilgisine göre devir veya acele kamulaştırma kararı alınabilir. Kamulaştırma işlemleri 2942 sayılı Kanun hükümleri çerçevesinde Çevre, Şehircilik ve İklim Değişikliği Bakanlığı veya Toplu Konut İdaresi Başkanlığı tarafından yürütülür.</template>
    </mvz-fıkra>
  </mvz-madde>  
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template> </template>
      <mvz-bent no="a">
        <template>2487 sayılı Toplu Konut Kanununa göre kredilendirilmiş projelere, Toplu Konut ve Kamu Ortaklığı Kurulunun tespit edeceği esaslar çerçevesinde 2487 sayılı Kanun hükümleri uygulanır.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>2487 sayılı Toplu Konut Kanununa göre hak kazanmış projeler, Toplu Konut ve Kamu Ortaklığı Kurulunun tespit edeceği esaslar çerçevesinde bu Kanun hükümlerinden yararlanırlar.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Ek 1 inci madde kapsamında kalan ve bu Kanunun yürürlük tarihinden önce şehit olan veya hayatlarını kaybedenlerin hak sahibi yakınlarına bu Kanunun yürürlüğe girdiği tarihten itibaren müracaatları halinde ek 1 inci maddede belirtilen esaslar dahilinde faizsiz konut kredisi verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>3.2.2002 tarihinde Afyon ve civarında meydana gelen deprem sonucunda Bayındırlık ve İskân Bakanlığı fen heyetleri tarafından belediye yerleşim alanlarında belirlenen ağır hasarlı ve yıkık konut sahibi afetzedelerin kuracağı kooperatiflere, kendi arsaları veya toplulaştırma sonucunda elde edilecek arsalar üzerinde yapılacak konutlar için Toplu Konut İdaresi aracılığı ile kredi verilir. En az % 70 seviyesinde tamamlanmış ve depremde yıkılan veya ağır derecede hasar gören konut veya işyeri kooperatiflerine de, her bir üyeleri için en fazla bir konut ve bir işyeri olmak üzere, hasarları oranında Toplu Konut İdaresi aracılığı ile kredi verilir. Söz konusu kredinin kullandırılmasına ilişkin usul ve esaslar Bayındırlık ve İskân Bakanlığı ile Toplu Konut İdaresi Başkanlığı tarafından müştereken belirlenir ve Başbakan onayı ile yürürlüğe girer.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Afetzedelerin konut veya işyeri yapacakları alanlarda arsa ve arazi temininde 15.5.1959 tarihli ve 7269 sayılı Kanunun 21, ek 9 ve ek 10 uncu maddelerindeki hükümler uygulanabilir. Bu şekilde temin ve tahsis edilen arsa ve araziler Arsa Ofisi Genel Müdürlüğüne bedelsiz olarak devredilmiş sayılır. Bu arsa ve araziler Arsa Ofisi Genel Müdürlüğü tarafından birinci fıkra kapsamında kredilendirilecek kooperatiflere maliyet bedeli üzerinden devredilir. Maliyet bedelinin hesaplanmasında harca esas değerin beşte biri taşınmaz malın iktisap bedeli kabul edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Birinci fıkra gereği verilecek konut ve işyeri kredileri için gereken 70 trilyon TL. Toplu Konut İdaresine; alt yapı ve toplulaştırma işlemleri için ihtiyaç duyulan 50 trilyon TL. ise Afet İşleri Genel Müdürlüğü, Karayolları Genel Müdürlüğü ve İller Bankası Genel Müdürlüğü arasında yapılacak protokol çerçevesinde kullandırılmak üzere Bayındırlık ve İskân Bakanlığı bütçesindeki afet tertibine aktarılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Söz konusu tutarların harcanmayan kısmı ile kredi olarak kullandırılan kısmının geri dönüşü Toplu Konut İdaresi Başkanlığı ve Afet İşleri Genel Müdürlüğü tarafından takip edilir ve tahsilini müteakip bir ay içerisinde Bayındırlık ve İskân Bakanlığı bütçesindeki afet tertibine özel ödenek kaydedilmek üzere Bayındırlık ve İskân Bakanlığı Merkez Saymanlık Müdürlüğü hesabına yatırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu madde uyarınca yeniden inşa edilecek veya onarılacak yapılarla ilgili ihale, sözleşme, ruhsatname ve sair işlemler ve bu uygulamadan faydalanacakların verecekleri beyanname, taahhütname ve yapacakları sözleşmeler her türlü vergi, resim ve harçtan muaftır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Tasfiye Halinde Türkiye Emlak Bankası Anonim Şirketi tarafından Toplu Konut İdaresi Başkanlığına devredilen varlıklardan ve bu varlıklarla ilgili devirden önce yapılmış akitlerden doğan yükümlülükler nedeniyle Toplu Konut İdaresi Başkanlığına ve ortaklıklarına karşı yargı mercilerinde açılmış veya husumet yöneltilmiş devam eden davalar ile icra takipleri ek 14 üncü madde hükmü uygulanarak sonuçlandırılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu maddenin yürürlüğe girdiği tarihte, İdarede bu Kanunun ek 3 üncü maddesinin üçüncü fıkrası uyarınca sözleşmeli personel olarak çalışanlardan sosyal güvenlik açısından 506 sayılı Sosyal Sigortalar Kanununa tâbi olanlar, bu maddenin yürürlüğe girdiği tarihten itibaren üç ay içerisinde yazılı olarak İdareye başvurmaları halinde 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanunu ile ilişkilendirilirler. Bu süre içerisinde 5434 sayılı Kanun ile ilişkilendirilme talebinde bulunmayanların 506 sayılı Kanun ile ilişkileri devam eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Geçici 5 inci maddeye göre 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanunu ile ilişkilendirilenlerin İdarede 506 sayılı Sosyal Sigortalar Kanununa tâbi olarak bu Kanunun ek 3 üncü maddesinin üçüncü fıkrası uyarınca sözleşmeli personel statüsünde geçen hizmet süreleri; emekli keseneklerine esas aylık derece ve kademelerinin belirlenmesi ile 5434 sayılı Kanunun ek 48 inci maddesinin (b) fıkrası ve ek 70 inci maddesinin uygulanmasında, öğrenim durumları itibarıyla yükselebilecekleri dereceleri aşmamak ve 2.2.2005 tarihli ve 5289 sayılı Kanun hükümleri dikkate alınmak suretiyle, memuriyette geçmiş gibi değerlendirilir ve değerlendirilen bu sürelerin önceden kıdem tazminatı, toplu ödeme veya emekli ikramiyesi ödenmemiş olan kısmı 5434 sayılı Kanun hükümleri çerçevesinde emekli ikramiyesinin hesabında dikkate alınır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>20/6/2001 tarihli ve 4684 sayılı Kanunla tasfiye edilen Toplu Konut Fonundan gelir payı talebi ile 3/7/2001 tarihinden sonra Toplu Konut İdaresi Başkanlığına karşı yargı mercilerine açılmış ve devam eden davalar ile icra takipleri hakkında ek 11 inci madde hükmü uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Toplu Konut İdaresi Başkanlığının 1/6/2008 tarihi itibarıyla genel bütçe kapsamında yer alan kamu idarelerinden; afetzedelere konut üretilmesi suretiyle oluşan alacakları ile 31/7/2003 tarihli ve 4969 sayılı Bazı Kanun ve Kanun Hükmünde Kararnamelerde Değişiklik Yapılmasına Dair Kanun kapsamında Hazineye ait taşınmazların devri nedeniyle oluşan borçları, merkezi yönetim bütçesinin gelir ve giderleriyle ilişkilendirilmeksizin mahsup edilir. Mahsup işlemleri sonucunda Toplu Konut İdaresi Başkanlığı lehine oluşacak fark 29/6/2001 tarihli ve 4706 sayılı Kanun hükümleri çerçevesinde Hazineye ait taşınmazların anılan İdareye devredilmesi suretiyle kapatılır. Mahsup işlemleri, Maliye Bakanlığı, Bayındırlık ve İskan Bakanlığı ve Toplu Konut İdaresi Başkanlığı arasında düzenlenecek protokol hükümlerine göre uygulanır.</template>
    </mvz-fıkra>
