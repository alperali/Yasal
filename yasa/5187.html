  <mvz-künye tür="kanun" no="5187" başlık="BASIN KANUNU"
             tarih="9/6/2004" rgazete-tarih="26/6/2004" rgazete-sayı="25504"
             düstur-tertip="5" düstur-cilt="43" />

  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, basın özgürlüğü ve bu özgürlüğün kullanımı ile basın kartına ilişkin usul ve esasları belirlemektir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun basılmış eserlerin basımı ve yayımı ile internet haber sitelerini kapsar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Basın kartı düzenlenmesi bakımından basın kartı talep eden medya mensupları ve enformasyon görevlileri bu Kanun kapsamına dâhildir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Tanımlar">
    <mvz-fıkra no="1">
      <template>Bu Kanunun uygulanmasında;</template>
      <mvz-bent no="a">
        <template>Basılmış eser: Yayımlanmak üzere her türlü basım araçları ile basılan veya diğer araçlarla çoğaltılan yazı, resim ve benzeri eserler ile haber ajansı yayınlarını,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Yayım: Basılmış eserin herhangi bir şekilde kamuya sunulmasını,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Süreli yayın: Belli aralıklarla yayımlanan gazete, dergi gibi basılmış eserler ile haber ajansları yayınlarını ve internet haber sitelerini,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Yaygın süreli yayın: Tek bir basın-yayın kuruluşu tarafından aynı isimle basılan ve her coğrafi bölgede en az bir ilde olmak üzere, ülkenin en az yüzde yetmişinde yayımlanan süreli yayın ile haber ajanslarının yayınlarını,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Bölgesel süreli yayın: Tek bir basın-yayın kuruluşu tarafından basılan ve en az üç komşu ilde veya en az bir coğrafi bölgede yayımlanan süreli yayını,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Yerel süreli yayın: Tek bir yerleşim biriminde yayımlanan süreli yayınlar ile haftada bir veya daha uzun aralıklarla yayımlanan yaygın ve bölgesel yayınları,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Yayın türü: Süreli yayınların yaygın, bölgesel ve yerel yayın türlerinden hangisinin kapsamında olduğunu,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Süresiz yayın: Belli aralıklarla yayımlanmayan kitap, armağan gibi basılmış eserleri,</template>
      </mvz-bent>
      <mvz-bent no="ı">
        <template>Eser sahibi: Süreli veya süresiz yayının içeriğini oluşturan yazıyı veya haberi yazanı, çevireni veya resmi ya da karikatürü yapanı, görsel veya işitsel içerikleri kaydeden veya düzenleyeni,</template>
      </mvz-bent>
      <mvz-bent no="j">
        <template>Yayımcı: Bir eseri basılmış eser durumuna getirip yayımlayan gerçek veya tüzel kişiyi,</template>
      </mvz-bent>
      <mvz-bent no="k">
        <template>Basımcı: Bir eseri basım araçları ile basan veya diğer araçlarla çoğaltan gerçek veya tüzel kişiyi,</template>
      </mvz-bent>
      <mvz-bent no="l">
        <template>Tüzel kişi temsilcisi: Yayın sahibi veya yayımcının tüzel kişi olması halinde bu tüzel kişiliğin yetkili organı tarafından, yöneticiler arasından belirlenen gerçek kişiyi veya kamu kurum ve kuruluşlarınca belirlenen gerçek kişiyi,</template>
      </mvz-bent>
      <mvz-bent no="m">
        <template>İnternet haber sitesi: İnternet ortamında, belirli aralıklarla haber veya yorum niteliğinde yazılı, görsel veya işitsel içeriklerin sunumunu yapmak üzere kurulan ve işletilen süreli yayını,</template>
      </mvz-bent>
      <mvz-bent no="n">
        <template>Basın kartı: Bu Kanunda belirtilen kişilere, Başkanlıkça verilen kimlik kartını,</template>
      </mvz-bent>
      <mvz-bent no="o">
        <template>Başkan: İletişim Başkanını,</template>
      </mvz-bent>
      <mvz-bent no="ö">
        <template>Başkanlık: İletişim Başkanlığını,</template>
      </mvz-bent>
      <mvz-bent no="p">
        <template>Komisyon: Basın Kartı Komisyonunu,</template>
      </mvz-bent>
      <mvz-bent no="r">
        <template>Medya mensubu: Radyo, televizyon ve süreli yayınların basın-yayın faaliyeti yürüten çalışanlarını,</template>
      </mvz-bent>
      <mvz-bent no="s">
        <template>Enformasyon görevlisi: Kamu kurum ve kuruluşlarının yürüttükleri Devlet enformasyon hizmetlerinde çalışan kamu personelini,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>ifade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Basın özgürlüğü">
    <mvz-fıkra no="1">
      <template>Basın özgürdür. Bu özgürlük; bilgi edinme, yayma, eleştirme, yorumlama ve eser yaratma haklarını içerir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Basın özgürlüğünün kullanılması ancak demokratik bir toplumun gereklerine uygun olarak; başkalarının şöhret ve haklarının, toplum sağlığının ve ahlâkının, millî güvenlik, kamu düzeni, kamu güvenliği ve toprak bütünlüğünün korunması, Devlet sırlarının açıklanmasının veya suç işlenmesinin önlenmesi, yargı gücünün otorite ve tarafsızlığının sağlanması amacıyla sınırlanabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Zorunlu bilgiler">
    <mvz-fıkra no="1">
      <template>Her basılmış eserde, basıldığı yer ve tarih, basımcının ve varsa yayımcının adları, varsa ticarî unvanları ve işyeri adresleri gösterilir. İlân, tarife, sirküler ve benzerleri hakkında bu hüküm uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Haber ajansı yayınları hariç her türlü süreli yayında, ayrıca yönetim yeri, sahibinin, varsa temsilcisinin, sorumlu müdürün adları ve yayının türü gösterilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İnternet haber sitelerinde ayrıca, faaliyet gösterdiği iş yeri adresi, ticari unvanı, elektronik posta adresi, iletişim telefonu ve elektronik tebligat adresi ile yer sağlayıcısının adı ve adresi kendilerine ait internet ortamında kullanıcıların ana sayfadan doğrudan ulaşabileceği şekilde ve iletişim başlığı altında bulundurulur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>İnternet haber sitelerinde bir içeriğin ilk kez sunulmaya başlandığı tarih ile sonraki güncelleme tarihleri, her erişildiğinde değişmeyecek şekilde içeriğin üzerinde belirtilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Sorumlu müdür">
    <mvz-fıkra no="1">
      <template>Her süreli yayının bir sorumlu müdürü bulunur. Sorumlu müdür, birden fazla ise her birinin sorumlu olduğu bölüm belirtilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Sorumlu müdür olabilmek için;</template>
      <mvz-bent no="a">
        <template>Onsekiz yaşını bitirmiş olmak,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Türkiye'de yerleşim yeri sahibi olmak ve devamlı oturmak,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>En az ortaöğretim veya dengi bir eğitim kurumundan mezun olmak,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Kısıtlı veya kamu hizmetlerinden yasaklı olmamak,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Yüz kızartıcı suçlardan mahkûm olmamak,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>T.C. vatandaşı olmayanlar için karşılıklılık koşulu aramak,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>gerekir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Sorumlu müdürün Türkiye Büyük Millet Meclisi üyesi olması halinde sorumlu müdürlüğü üstlenmek üzere müdür yardımcısı tayin edilir. Sorumlu müdür için bu Kanunda yer alan hükümler, sorumluluğu üstlenen yardımcı için de geçerlidir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Süreli yayın sahibi">
    <mvz-fıkra no="1">
      <template>Gerçek ve tüzel kişiler ile kamu kurum ve kuruluşları süreli yayın sahibi olabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Süreli yayın sahibinin onsekiz yaşından küçük veya kısıtlı olması halinde kanunî temsilcisi, tüzel kişi olması halinde ise tüzel kişi temsilcisi hakkında da 5 inci maddenin ikinci fıkrasında belirtilen şartlar aranır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Beyanname verilmesi">
    <mvz-fıkra no="1">
      <template>Süreli yayınların çıkarılması için, kaydedilmek üzere yönetim yerinin bulunduğu yer Cumhuriyet Başsavcılığına bir beyanname verilmesi yeterlidir. Cumhuriyet Başsavcılığı tarafından düzenlenen kayıtlar alenidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kayıt için verilen ve yayın sahibi, sahibin küçük veya tüzel kişi olması halinde temsilcisi ile sorumlu müdür tarafından imzalanan beyannamede yayının adı ve mahiyeti, hangi aralıklarla yayımlanacağı, yönetim yeri, sahibinin, varsa temsilcisinin, sorumlu müdürün ad ve adresleri ile yayının türü ve elektronik tebligat adresi gösterilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Beyannameye, 5 inci ve 6 ncı maddelerde yazılı şartların varlığını gösteren belgeler ile yayın sahibi tüzel kişi ise tüzüğünün veya ana sözleşmesinin veya vakıf senedinin bir sureti eklenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Cumhuriyet Başsavcılığı tarafından beyanname ve eklerinin teslim edildiğini gösteren bir alındı belgesi verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Beyannamenin incelenmesi">
    <mvz-fıkra no="1">
      <template>Beyannamenin ve eklerinin gerekli veya gerçek bilgileri içermemesi veya yayın sahibinin veya temsilcisinin veya sorumlu müdürün 5 inci ve 6 ncı maddelerde yazılı şartlara sahip olmaması halinde, Cumhuriyet Başsavcılığı beyannamenin verilmesinden itibaren iki hafta içinde eksikliğin giderilmesini veya gerçeğe aykırı bilgilerin düzeltilmesini yayın sahibinden ister. Bu istemin tebliği tarihinden itibaren iki hafta içerisinde yerine getirilmemesi halinde, Cumhuriyet Başsavcılığı yayımın durdurulmasını asliye ceza mahkemesinden talep eder. Mahkeme en geç iki hafta içinde karar verir. Bu karara karşı acele itiraz yoluna başvurulabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Beyanname içeriğinde meydana gelen her değişiklik, iki hafta içinde, gerekli belgelerle birlikte yeni bir beyanname ile aynı makama bildirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Birinci fıkra hükmü, değişikliğe ilişkin beyannameler hakkında da uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Sorumlu müdürün bu görevden ayrılması halinde, yenisi tayin edilinceye kadar sorumluluk yayın sahibine veya temsilcisine aittir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Birinci fıkrada düzenlenen yayım durdurma müeyyidesi internet haber siteleri bakımından uygulanmaz. İnternet haber sitesinin bu madde hükmüne uymaması hâlinde, Cumhuriyet Başsavcılığı iki hafta içinde eksikliğin giderilmesini veya gerçeğe aykırı bilgilerin düzeltilmesini internet haber sitesinden ister. İstemin iki hafta içinde yerine getirilmemesi durumunda, Cumhuriyet Başsavcılığı internet haber sitesi vasfının kazanılmadığının tespiti amacıyla asliye ceza mahkemesine başvurur. Mahkeme en geç iki hafta içinde kararını verir. Bu karara karşı itiraz yoluna başvurulabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Başvurunun kabul edilmesi hâlinde internet haber siteleri için sağlanabilecek resmî ilan ve reklam ile çalışanlarının basın kartına ilişkin hakları ortadan kalkar. İnternet haber sitesi için sağlanan hakların ortadan kaldırılması, bu Kanun ve/veya ilgili mevzuat uyarınca öngörülen yaptırımların uygulanmasına engel değildir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Süreli yayın sahibinin hakkını kaybetmesi">
    <mvz-fıkra no="1">
      <template>Süreli yayın sahibinin beyanname verdiği tarihten itibaren bir sene içinde süreli yayın yayımlanmaz veya yayımlandıktan sonra yayıma üç yıl müddetle ara verilirse beyanname hükümsüz kalır ve sağladığı hak ortadan kalkar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>556 sayılı Markaların Korunması Hakkında Kanun Hükmünde Kararname hükümleri saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Teslim ve muhafaza yükümlülüğü">
    <mvz-fıkra no="1">
      <template>Basımcı, bastığı her türlü yayının imzalı iki nüshasını, dağıtım veya yayımın yapıldığı gün, mahallin Cumhuriyet Başsavcılığına teslim etmekle yükümlüdür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu yükümlülük, basılmış eserin içerik ve biçim yönünden herhangi bir değişikliği içeren daha sonraki basımları ile tıpkı basımları için de geçerlidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Basımcıya bu yükümlülüğünü yerine getirdiğine dair bir alındı belgesi verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>İnternet haber sitesinde yayınlanan içerikler, gerektiğinde talep eden Cumhuriyet Başsavcılığına teslim edilmek üzere doğruluğu ve bütünlüğü sağlanmış şekilde iki yıl süre ile muhafaza edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yargı mercileri tarafından yayının soruşturma ve kovuşturma konusu olduğunun internet haber sitesine yazılı olarak bildirilmesi hâlinde, bu işlemlerin sonuçlandığının bildirilmesine kadar soruşturma ve kovuşturma konusu yayın kaydının saklanması zorunludur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="Cezai sorumluluk">
    <mvz-fıkra no="1">
      <template>Basılmış eserler veya internet haber siteleri yoluyla işlenen suç yayım anında oluşur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Süreli yayınlar ve süresiz yayınlar yoluyla işlenen suçlardan eser sahibi sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Süreli yayınlarda eser sahibinin belli olmaması veya yayım sırasında ceza ehliyetine sahip bulunmaması ya da yurt dışında bulunması nedeniyle Türkiye'de yargılanamaması veya verilecek cezanın eser sahibinin diğer bir suçtan dolayı kesin hükümle mahkûm olduğu cezaya etki etmemesi hallerinde, sorumlu müdür ve yayın yönetmeni, genel yayın yönetmeni, editör, basın danışmanı gibi sorumlu müdürün bağlı olduğu yetkili sorumlu olur. Ancak bu eserin sorumlu müdürün ve sorumlu müdürün bağlı olduğu yetkilinin karşı çıkmasına rağmen yayımlanması halinde, bundan doğan sorumluluk yayımlatana aittir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Süresiz yayınlarda eser sahibinin belli olmaması veya yayım sırasında ceza ehliyetine sahip bulunmaması ya da yurt dışında olması nedeniyle Türkiye'de yargılanamaması veya verilecek cezanın eser sahibinin diğer bir suçtan dolayı kesin hükümle mahkûm olduğu cezaya etki etmemesi hallerinde yayımcı; yayımcının belli olmaması veya basım sırasında ceza ehliyetine sahip bulunmaması ya da yurt dışında olması nedeniyle Türkiye'de yargılanamaması hallerinde ise basımcı sorumlu olur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yukarıdaki hükümler, süreli yayınlar ve süresiz yayınlar için bu Kanunda aranan şartlara uyulmaksızın yapılan yayınlar hakkında da uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="Haber kaynağı">
    <mvz-fıkra no="1">
      <template>Süreli yayın sahibi, sorumlu müdür ve eser sahibi, bilgi ve belge dahil her türlü haber kaynaklarını açıklamaya ve bu konuda tanıklık yapmaya zorlanamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="13" başlık="Hukukî sorumluluk">
    <mvz-fıkra no="1">
      <template>Basılmış eserler veya internet haber siteleri yoluyla işlenen fiillerden doğan maddî ve manevî zararlardan dolayı süreli yayınlarda, eser sahibi ile yayın sahibi ve varsa temsilcisi, süresiz yayınlarda ise eser sahibi ile yayımcı, yayımcının belli olmaması halinde ise basımcı müştereken ve müteselsilen sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu hüküm, süreli veya süreli olmayan yayınlarda yayın sahibi, marka veya lisans sahibi, kiralayan, işleten veya herhangi bir sıfatla yayımlayan, yayımcı gibi hareket eden gerçek veya tüzel kişiler hakkında da uygulanır. Tüzel kişi şirketse, anonim şirketlerde yönetim kurulu başkanı, diğer şirketlerde en üst yönetici, şirket ile birlikte müştereken ve müteselsilen sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Zararı doğuran fiilin işlenmesinden sonra yayının her ne surette olursa olsun devredilmesi, başka bir yayınla birleştirilmesi veya sahibi olan gerçek veya tüzel kişinin herhangi bir surette değişmesi halinde, yayını devir alan, birleşen ve her ne surette olursa olsun yayın sahibi gibi hareket eden gerçek ve tüzel kişiler ve anonim şirketlerde yönetim kurulu başkanı, diğer şirketlerde üst yönetici, bu fiil nedeniyle hükmedilecek tazminattan birinci ve ikinci fıkrada sayılanlarla birlikte müştereken ve müteselsilen sorumludur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="14" başlık="Düzeltme ve cevap">
    <mvz-fıkra no="1">
      <template>Süreli yayınlarda kişilerin şeref ve haysiyetini ihlâl edici veya kişilerle ilgili gerçeğe aykırı yayım yapılması halinde, bundan zarar gören kişinin yayım tarihinden itibaren iki ay içinde göndereceği suç unsuru içermeyen, üçüncü kişilerin hukuken korunan menfaatlerine aykırı olmayan düzeltme ve cevap yazısını; sorumlu müdür hiçbir düzeltme ve ekleme yapmaksızın, günlük süreli yayınlarda yazıyı aldığı tarihten itibaren en geç üç gün içinde, diğer süreli yayınlarda yazıyı aldığı tarihten itibaren üç günden sonraki ilk nüshada, ilgili yayının yer aldığı sayfa ve sütunlarda, aynı puntolarla ve aynı şekilde yayımlamak zorundadır.  İnternet haber sitelerinde ise zarar gören kişinin düzeltme ve cevap yazısını; sorumlu müdür, hiçbir düzeltme ve ekleme yapmaksızın, yazıyı aldığı tarihten itibaren en geç bir gün içinde, ilgili yayının yer aldığı sayfa ve sütunlarda, URL bağlantısı sağlanmak suretiyle, aynı puntolarla ve aynı şekilde yayımlamak zorundadır. Yayın hakkında verilen erişimin engellenmesi ve/veya içeriğin çıkarılması kararının uygulanması ya da internet haber sitesi tarafından içeriğin kendiliğinden çıkarılması durumunda, düzeltme ve cevap metni ilgili yayının yapıldığı internet haber sitesinde ilk yirmi dört saati ana sayfada olmak üzere bir hafta süreyle yayımlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Düzeltme ve cevapta, buna neden olan eser belirtilir. Düzeltme ve cevap, ilgili yazıdan uzun olamaz. Düzeltme ve cevaba neden olan eserin yirmi satırdan az yazı veya resim veya karikatür olması hallerinde düzeltme ve cevap otuz satırı geçemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Süreli yayının birden fazla yerde basılması halinde, düzeltme ve cevap yazısı, düzeltme ve cevap hakkının kullanılmasına sebebiyet veren eserin yayımlandığı bütün baskılarda yayımlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Düzeltme ve cevabın birinci fıkrada belirlenen süreler içinde yayımlanmaması halinde yayım için tanınan sürenin bitiminden itibaren, birinci fıkra hükümlerine aykırı şekilde yayımlanması halinde ise yayım tarihinden itibaren onbeş gün içinde cevap ve düzeltme talep eden kişi, bulunduğu yer sulh ceza hâkiminden yayımın yapılmasına veya bu Kanun hükümlerine uygun olarak yapılmasına karar verilmesini isteyebilir. Sulh ceza hâkimi bu istemi üç gün içerisinde, duruşma yapmaksızın, karara bağlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Sulh ceza hâkiminin kararına karşı acele itiraz yoluna gidilebilir. Yetkili makam üç gün içinde itirazı inceleyerek karar verir. Yetkili makamın kararı kesindir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Düzeltme ve cevabın yayımlanmasına hâkim tarafından karar verilmesi halinde, birinci fıkradaki süreler, sulh ceza hâkiminin kararına itiraz edilmemişse kararın kesinleştiği tarihten, itiraz edilmişse yetkili makamın kararının tebliği tarihinden itibaren başlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Düzeltme ve cevap hakkına sahip olan kişinin ölmesi halinde bu hak, mirasçılardan biri tarafından kullanılabilir. Bu durumda, birinci fıkradaki iki aylık düzeltme ve cevap hakkı süresine bir ay ilave edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="Zorunlu bilgileri göstermeme">
    <mvz-fıkra no="1">
      <template>4 üncü maddeye göre basılmış eserlerde ve internet haber sitelerinde gösterilmesi öngörülen hususların gösterilmemesi veya gerçeğe aykırı olarak gösterilmesi halinde, süreli yayınlarda sorumlu müdür ve sorumlu müdürün bağlı olduğu yetkili, süresiz yayınlarda yayımcı ve adını ve adresini göstermeyen veya yanlış gösteren basımcı beşyüzmilyon liradan yirmimilyar liraya kadar ağır para cezasıyla cezalandırılır. Bu ceza, bölgesel süreli yayınlarda ikimilyar liradan, yaygın süreli yayınlarda beşmilyar liradan az olamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="16" başlık="Durdurulan yayının yayımına devam etme">
    <mvz-fıkra no="1">
      <template>8 inci maddeye göre mahkeme kararıyla durdurulan yayına, usulüne uygun beyanname vermeden veya değişiklikleri bildirmeden devam edilmesi halinde yayın sahibi, sorumlu müdür ve sorumlu müdürün bağlı olduğu yetkili birmilyar liradan onbeş milyar liraya kadar ağır para cezasıyla cezalandırılır. Bu ceza, bölgesel süreli yayınlarda beşmilyar liradan, yaygın süreli yayınlarda onmilyar liradan az olamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="17" başlık="Teslim ve muhafaza yükümlülüğüne uymama">
    <mvz-fıkra no="1">
      <template>10 uncu maddeye göre teslim yükümlülüğünü yerine getirmeyen basımcı ile teslim ve muhafaza yükümlülüğünü yerine getirmeyen internet haber sitesi sorumlu müdürü üçyüzmilyon liradan birmilyar liraya kadar ağır para cezasıyla cezalandırılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="18" başlık="Düzeltme ve cevabın yayımlanmaması">
    <mvz-fıkra no="1">
      <template>Düzeltme ve cevabın yayımlanmasına ilişkin kesinleşmiş hâkim kararlarına uymayan sorumlu müdür ve sorumlu müdürün bağlı olduğu yetkili onmilyar liradan yüzellimilyar liraya kadar ağır para cezasıyla cezalandırılır. Ağır para cezası, bölgesel süreli yayınlarda yirmimilyar liradan, yaygın süreli yayınlarda ellimilyar liradan az olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Sorumlu müdür ve sorumlu müdürün bağlı olduğu yetkili hakkında verilen ağır para cezasının ödenmesinden yayın sahibi, sorumlu müdür ve sorumlu müdürün bağlı olduğu yetkili ile birlikte müteselsilen sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Düzeltme ve cevap yazısının yayımlanmaması veya 14 üncü maddenin birinci fıkrasında belirtilen şartlara uyulmaksızın yayımlanması hallerinde hâkim ayrıca, masraflar yayın sahibi tarafından karşılanmak üzere, bu yazının iki internet haber sitesi ile tirajı yüzbinin üzerinde olan iki gazetede ilân şeklinde yayımlanmasına da karar verir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="19" başlık="Yargıyı etkileme">
    <mvz-fıkra no="1">
      <template>Mülga</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="20" başlık="Cinsel saldırı, cinayet ve intihara özendirme">
    <mvz-fıkra no="1">
      <template>Cinsel saldırı, cinayet ve intihar olayları hakkında, haber vermenin sınırlarını aşan ve okuyucuyu bu tür fiillere özendirebilecek nitelikte olan yazı ve resim yayımlayanlar birmilyar liradan yirmimilyar liraya kadar ağır para cezasıyla cezalandırılır. Bu ceza bölgesel süreli yayınlarda ikimilyar liradan, yaygın süreli yayınlarda ve internet haber sitelerinde onmilyar liradan az olamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="21" başlık="Kimliğin açıklanmaması">
    <mvz-fıkra no="1">
      <template>Süreli yayınlarda;</template>
      <mvz-bent no="a">
        <template>22.11.2001 tarihli ve 4721 sayılı Türk Medeni Kanununa göre evlenmeleri yasaklanmış olan kimseler arasındaki cinsel ilişkiyle ilgili haberlerde bu kişilerin,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>1.3.1926 tarihli ve 765 sayılı Türk Ceza Kanununun 414, 415, 416, 421, 423, 429, 430, 435 ve 436 ncı maddelerinde yazılı cürümlere ilişkin haberlerde mağdurların,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Onsekiz yaşından küçük olan suç faili veya mağdurlarının,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>Kimliklerini açıklayacak ya da tanınmalarına yol açacak şekilde yayın yapanlar birmilyar liradan yirmimilyar liraya kadar ağır para cezasıyla cezalandırılır. Bu ceza bölgesel süreli yayınlarda ikimilyar liradan, yaygın süreli yayınlarda ve internet haber sitelerinde onmilyar liradan az olamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="22" başlık="Basılmış eserleri engelleme, tahrip ve bozma">
    <mvz-fıkra no="1">
      <template>Kanuna uygun olarak basılmış eserleri, bunların yayımını veya dağıtımını veya satışını önlemek amacıyla tahrip eden veya bozan kimse, fiili daha ağır bir suç teşkil etmediği takdirde, bir yıla kadar hapis ve birmilyar liradan beşmilyar liraya kadar ağır para cezasıyla cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kanunun aradığı şartlara uyulmasına rağmen süreli ve süresiz yayınların basılmasını, yayımını, dağıtımını veya satışını şiddet veya tehditle engelleyen kimse, fiili daha ağır bir suç teşkil etmediği takdirde, iki yıla kadar hapis ve ikimilyar liradan onmilyar liraya kadar ağır para cezasıyla cezalandırılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yukarıdaki fıkralarda öngörülen fiiller, umumi mahalde veya matbaanın veya umuma satış yapan veya dağıtım yapan yerlerde birden fazla kişi tarafından işlendiği takdirde verilecek ceza yarıya kadar artırılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="23" başlık="Süreli yayınların dağıtımı">
    <mvz-fıkra no="1">
      <template>Süreli yayınların dağıtımını yapan kişiler, kendilerinden dağıtımı istenen yayınları, dağıtımını yaptıkları diğer yayınlar için aldıkları satış fiyatı, tiraj ve sayfa sayısına göre belirlenen dağıtım ücretini aşmayacak bir bedel karşılığında, dağıtmakla yükümlüdürler. Bu yükümlülüğe aykırı davrananlar, dağıtımından kaçındıkları yayının toplam bedelinin on misli ağır para cezasıyla cezalandırılırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Süreli yayınları perakende olarak satışa sunan gerçek veya tüzel kişiler, aynı anda diledikleri kadar dağıtım şirketiyle anlaşıp diledikleri yayınları satabilirler. Hiç kimse, bu kişilere, rakip yayınları satmama yükümlülüğü getiremez ve bu yayınları satmama koşuluna bağlı olan veya bu sonucu doğuracak edimlerde bulunamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="24" başlık="Yeniden yayım">
    <mvz-fıkra no="1">
      <template>Bir süreli yayında yayımlanmış haber, yazı ve resimleri kaynak göstermeksizin yeniden yayımlayanlar beşmilyar liradan onmilyar liraya kadar ağır para cezasıyla cezalandırılırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu eserleri, yeniden yayım hakkı saklı tutulmuş olmasına rağmen, süreli yayın sahibinin izni olmadan yeniden yayımlayanlar yirmimilyar liradan kırkmilyar liraya kadar ağır para cezasıyla cezalandırılırlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="25" başlık="El koyma, dağıtım ve satış yasağı">
    <mvz-fıkra no="1">
      <template>Soruşturma için sübut vasıtası olarak her türlü basılmış eserin en fazla üç adedine Cumhuriyet savcısı, gecikmesinde sakınca bulunan hallerde de kolluk el koyabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Soruşturma veya kovuşturmanın başlatılmış olması şartıyla 25.7.1951 tarihli ve 5816 sayılı Atatürk Aleyhine İşlenen Suçlar Hakkında Kanunda, Anayasanın 174 üncü maddesinde yer alan inkılap kanunlarında, 765 sayılı Türk Ceza Kanununun 146 ncı maddesinin ikinci fıkrasında, 153 üncü maddesinin birinci ve dördüncü fıkralarında, 155 inci maddesinde, 311 inci maddesinin birinci ve ikinci fıkralarında, 312 nci maddesinin ikinci ve dördüncü fıkralarında, 312/a maddesinde ve 12.4.1991 tarihli ve 3713 sayılı Terörle Mücadele Kanununun 7 nci maddesinin ikinci ve beşinci fıkralarında öngörülen suçlarla ilgili olarak basılmış eserlerin tamamına hâkim kararıyla el konulabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Hangi dilde olursa olsun Türkiye dışında basılan süreli veya süresiz yayın ve gazetelerin ikinci fıkrada belirtilen suçları içerdiklerine dair kuvvetli delil bulunması halinde, bunların Türkiye'de dağıtılması veya satışa sunulması, Cumhuriyet Başsavcılığının talebi üzerine sulh ceza hâkiminin kararı ile yasaklanabilir. Gecikmesinde sakınca bulunan hallerde Cumhuriyet Başsavcılığının kararı yeterlidir. Bu karar en geç yirmidört saat içinde hâkimin onayına sunulur. Kırksekiz saat içinde hâkim tarafından onaylanmaması halinde Cumhuriyet Başsavcılığının kararı hükümsüz kalır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yukarıdaki fıkra uyarınca yasaklanmış yayın veya gazeteleri bilerek dağıtanlar veya satışa sunanlar bu yayınlar yoluyla işlenen suçlardan eser sahibi gibi sorumludurlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="26" başlık="Dava süreleri">
    <mvz-fıkra no="1">
      <template>Basılmış eserler veya internet haber siteleri yoluyla işlenen veya bu Kanunda öngörülen diğer suçlarla ilgili ceza davalarının bir muhakeme şartı olarak, günlük süreli yayınlar ve internet haber siteleri yönünden dört ay, diğer basılmış eserler yönünden altı ay içinde açılması zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu süreler basılmış eserlerin Cumhuriyet Başsavcılığına teslim edildiği tarihten, internet haber siteleri için ise habere ilişkin suç ihbarının yapıldığı tarihten başlar. Basılmış eserlerin Cumhuriyet Başsavcılığına teslim edilmemesi halinde yukarıdaki sürelerin başlama tarihi, suçu oluşturan fiilin Cumhuriyet Başsavcılığı tarafından öğrenildiği tarihtir. Ancak bu süreler, Türk Ceza Kanununun dava zamanaşımına ilişkin maddesinde öngörülen süreleri aşamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Sorumlu müdürün ve sorumlu müdürün bağlı olduğu yetkilinin karşı çıkmasına rağmen yayımlatıldığı iddia edilen eserden dolayı yayımlatan aleyhine açılacak dava yönünden süre, sorumlu müdür ve sorumlu müdürün bağlı olduğu yetkili hakkında verilecek beraat kararının kesinleşmesinden itibaren başlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Sorumlu müdürün yayımlanan eserin sahibini bildirmesi durumunda, eser sahibi aleyhine açılacak davada süre, bildirim tarihinden itibaren başlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Kovuşturulması şikâyete bağlı suçlarda dava açma süreleri, suç için kanunun öngördüğü dava zamanaşımı süresini aşmamak şartıyla, suçun işlendiğinin öğrenildiği tarihten başlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Kamu davasının açılması izin veya karar alınmasına bağlı olan suçlarda, izin veya karar için gerekli başvurunun yapılmasıyla dava açma süresi durur. Durma süresi dört ayı geçemez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="27" başlık="Görevli mahkemeler ve yargılama usulü">
    <mvz-fıkra no="1">
      <template>Basılmış eserler veya internet haber siteleri yoluyla işlenen veya bu Kanunda öngörülen diğer suçlardan dolayı açılan davalardan, ağır ceza işlerinden olanlar ağır ceza mahkemelerinde, diğerleri asliye ceza mahkemelerinde görülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bir yerde ağır ceza veya asliye ceza mahkemesinin birden fazla dairesi bulunması halinde bu davalar iki numaralı mahkemede görülür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Basılmış eserler veya internet haber siteleri yoluyla işlenen veya bu Kanunda öngörülen diğer suçlara ilişkin davalar acele işlerden sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="28" başlık="Hürriyeti bağlayıcı cezaya çevirme yasağı">
    <mvz-fıkra no="1">
      <template>18 inci ve 22 nci maddelerdeki suçlar dışında bu Kanunda öngörülen suçlar için hükmedilen para cezaları, hürriyeti bağlayıcı cezaya çevrilemez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="29" başlık="Tebligat">
    <mvz-fıkra no="1">
      <template>Süreli yayının yönetim yeri, tebligat işlemleri yönünden, yayın sahibinin ve temsilcisinin, görevi devam ettiği sürece sorumlu müdürün yerleşim yeri sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="30" başlık="Yürürlükten kaldırılan hükümler">
    <mvz-fıkra no="1">
      <template>15.7.1950 tarihli ve 5680 sayılı Basın Kanunu yürürlükten kaldırılmıştır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="Basın kartı başvurusu, niteliği ve türleri" tür="Ek">
    <mvz-fıkra no="1">
      <template>Basın kartı başvurusu Başkanlığa yapılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Basın kartı, resmî nitelikte bir kimlik belgesidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Basın kartı türleri aşağıda sayılanlardan ibarettir:</template>
      <mvz-bent no="a">
        <template>Göreve bağlı basın kartı: Bir medya kuruluşuna bağlı olarak çalışan Türk vatandaşı medya mensuplarına ve enformasyon görevlilerine verilen basın kartını,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Süreli basın kartı: Görev alanı Türkiye’yi kapsayan yabancı medya mensuplarına verilen basın kartını,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Geçici basın kartı: Görev alanı Türkiye’yi kapsamamakla beraber geçici bir süreyle Türkiye’ye haber amaçlı gelen yabancı medya mensuplarına verilen basın kartını,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Serbest basın kartı: Geçici bir süreyle çalışmayan veya yurt dışında serbest gazetecilik yapan Türk vatandaşı medya mensuplarına verilen basın kartını,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Sürekli basın kartı: En az on sekiz yıl mesleki hizmeti bulunan medya mensupları ve enformasyon görevlilerine ömür boyu verilen basın kartını,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>ifade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Basın kartı alabilecek kişiler" tür="Ek">
    <mvz-fıkra no="1">
      <template>Basın kartı;</template>
      <mvz-bent no="a">
        <template>Türkiye’de faaliyet gösteren medya kuruluşlarının Türk vatandaşı medya mensuplarına,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Süreli yayınların sahiplerine veya tüzel kişi temsilcileri ile radyo ve televizyonların yönetim kurulu başkanlarına,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Medya kuruluşları adına hareket eden ve görev alanı Türkiye’yi kapsayan yabancı medya mensupları ile görev alanı Türkiye’yi kapsamamakla beraber geçici bir süreyle Türkiye’ye haber amaçlı gelen yabancı medya mensuplarına,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Yurt dışında yayın yapan medya kuruluşlarının, Türk vatandaşı sahiplerine ve çalışanlarına,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Yurt dışında serbest gazetecilik yapan Türk vatandaşı medya mensuplarına,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Medya alanında hizmet veren kamu kurum ve kuruluşlarında ve kamu kurum ve kuruluşlarının yürüttükleri enformasyon hizmetlerinde çalışan kamu personeline,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Medya alanında faaliyet göstermeleri şartıyla, sendikalar ile kamu yararına faaliyette bulunduğu tespit edilen dernek ve vakıfların yöneticilerine,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>verilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Basın kartı alabilecek kişilerde aranan şartlar" tür="Ek">
    <mvz-fıkra no="1">
      <template>Basın kartı talep edenlerin başvuruda bulunabilmeleri için;</template>
      <mvz-bent no="a">
        <template>18 yaşını bitirmiş olması,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>En az lise veya dengi bir eğitim kurumundan mezun olması,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Kısıtlı veya kamu hizmetlerinden yasaklı olmaması,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı beş yıl veya daha fazla süreyle hapis cezasına ya da şantaj, hırsızlık, sahtecilik, dolandırıcılık, güveni kötüye kullanma, yalan tanıklık, yalan yere yemin, iftira, suç uydurma, müstehcenlik, fuhuş, hileli iflas, zimmet, irtikâp, rüşvet, kaçakçılık, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama suçları ile cinsel dokunulmazlığa karşı suçlar, kamu barışına karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk suçlarından hüküm giymemiş olması,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Terörle Mücadele Kanununun 3 üncü maddesinde sayılan terör suçları ile 4 üncü maddesinde sayılan terör amacı ile işlenen suçlardan veya 6 ncı maddede belirtilen suçlar ile 7/2/2013 tarihli ve 6415 sayılı Terörizmin Finansmanının Önlenmesi Hakkında Kanunun 4 üncü maddesi uyarınca hüküm giymemiş olması,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Bu Kanunun 25 inci maddesinin ikinci fıkrasında yer alan suçlardan hüküm giymemiş olması,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>13/6/1952 tarihli ve 5953 sayılı Basın Mesleğinde Çalışanlarla Çalıştıranlar Arasındaki Münasebetlerin Tanzimi Hakkında Kanun hükümlerine uygun sözleşme yapmış olması ve mücbir sebepler dışında işten ayrıldığı tarihten itibaren bir aydan fazla olmamak üzere ara vermeden çalışması,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Medya faaliyeti dışında ticari faaliyette bulunmaması,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>şarttır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Basın kartı talep eden süreli yayın sahipleri veya tüzel kişi temsilcileri ile radyo ve televizyonların yönetim kurulu başkanlarında, kamu kurum ve kuruluşlarında basın kartı alabilecek çalışanlarda ve yabancı basın-yayın kuruluşlarında çalışan Türk vatandaşı medya mensuplarından basın kartı talep edenlerde birinci fıkranın (f) ve (g) bentlerinde belirtilen şartlar aranmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Sürekli ve serbest basın kartı talep edenler ile Türkiye Radyo Televizyon Kurumu aracılığıyla göreve bağlı basın kartı talep edenlerde birinci fıkranın (f) bendinde belirtilen şart aranmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Basın kartı alabilecek yabancı medya mensuplarında aranan şartlar" tür="Ek">
    <mvz-fıkra no="1">
      <template>Basın kartı talep eden yabancı medya mensuplarına;</template>
      <mvz-bent no="a">
        <template>Medya kuruluşu tarafından görevlendirildiklerini belgelendirmeleri,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>28/7/2016 tarihli ve 6735 sayılı Uluslararası İşgücü Kanunu uyarınca çalışma izinlerinin olması,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Bağlı bulundukları kuruluşun idare merkezinin bulunduğu ülkenin Türkiye’deki büyükelçilik, elçilik veya konsolosluklarından aldıkları takdim mektubunu ibraz etmeleri,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>hâlinde, karşılıklılık esası da gözetilerek Başkanlıkça basın kartı verilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında sigortalı olmayan ve geçici basın kartı talep edenler için de 6735 sayılı Kanun uyarınca çalışma izni alınması zorunludur. Bu fıkra kapsamında çalışma izni başvuruları 6735 sayılı Kanunun 16 ncı maddesi çerçevesinde istisnai olarak değerlendirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Basın Kartı Komisyonu" tür="Ek">
    <mvz-fıkra no="1">
      <template>Komisyon;</template>
      <mvz-bent no="a">
        <template>Başkanlığı temsilen üç üye,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Basın-yayın meslek kuruluşlarının birleşerek oluşturdukları üst kuruluşlar hariç olmak üzere; süreli yayın organlarının sahip ve/veya çalışanlarınca kurulan basın-yayın meslek kuruluşlarından basın kartı sahibi en fazla üyesi bulunan meslek kuruluşu tarafından belirlenecek bir üye,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Basın-yayın meslek kuruluşlarının birleşerek oluşturdukları üst kuruluşlar hariç olmak üzere; İstanbul, Ankara ve İzmir illerinde bulunan en fazla basın kartı sahibi üyesi meslek kuruluşu tarafından belirlenecek birer üye ile bu iller dışındaki illerde kurulu basın-yayın meslek kuruluşlarının sahip ve/veya çalışanları tarafından kurulmuş basın-yayın meslek kuruluşlarından en fazla basın kartı sahibi üyesi bulunan meslek kuruluşu tarafından belirlenecek bir üye olmak üzere toplam dört üye,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Sürekli nitelikte basın kartı sahipleri arasından Başkanlıkça belirlenecek dört üye,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Basın-yayın meslek kuruluşlarının birleşerek oluşturdukları üst kuruluşlar hariç olmak üzere, ulusal düzeyde yayın yapan radyo ve/veya televizyonların yönetim kurulu başkanları ve/veya gazeteci çalışanlarınca kurulmuş olan basın-yayın meslek kuruluşlarından en fazla üyesi bulunan meslek kuruluşu tarafından belirlenecek bir üye,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Göreve bağlı basın kartı sahibi gazeteciler arasından Başkanlıkça belirlenecek bir üye,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>İşçi sendikası şeklinde faaliyet gösteren sendikalardan basın kartı sahibi üyesi en fazla olan sendika tarafından belirlenecek iki üye,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>İletişim Fakültesi dekanları veya basın kartı sahibi gazeteciler arasından Başkanlıkça belirlenecek üç üye,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>olmak üzere, toplam on dokuz üyeden oluşur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Üyelerin görev süresi iki yıldır. Süresi dolan üyeler yeniden seçilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Komisyon, başvuru sahibinin niteliklerini, mesleki çalışmalarını, eserlerini, ödüllerini değerlendirerek basın kartı taşıyıp taşımayacağına karar verir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Basın kartının iptal edileceği hâller" tür="Ek">
    <mvz-fıkra no="1">
      <template>Basın kartı sahibinin, ek 3 üncü maddede yer alan niteliklere sahip olmadığının veya bu nitelikleri sonradan kaybettiğinin anlaşılması hâlinde basın kartı Başkanlıkça iptal edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Basın kartı sahibinin, 2/1/1961 tarihli ve 195 sayılı Basın-İlân Kurumu Teşkiline Dair Kanunun 49 uncu maddesine göre belirlenen basın ahlak esaslarına aykırı davranışlarda bulunması hâlinde ihlalin mahiyeti göz önünde bulundurularak, Komisyon tarafından basın kartı sahibi uyarılabileceği gibi basın kartının iptaline de karar verilebilir. Buna ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Basın kartının iptalinin sonuçları" tür="Ek">
    <mvz-fıkra no="1">
      <template>Basın kartının ek 6 ncı maddenin ikinci fıkrası uyarınca iptali hâlinde,  kartın iade edildiği tarihten itibaren bir yıl geçmedikçe yeniden basın kartı verilmez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Ek 3 üncü maddenin birinci fıkrasının (ç), (d) ve (e) bentlerine aykırı duruma düşenlere, 25/5/2005 tarihli ve 5352 sayılı Adlî Sicil Kanununun 12 nci ve/veya 13/A maddeleri uyarınca işlem tesis edildiği belirlenmedikçe yeniden basın kartı verilmez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Yönetmelik" tür="Ek">
    <mvz-fıkra no="1">
      <template>Başkanlıkça düzenlenecek olan basın kartlarının şekli, medya kuruluşlarında aranacak şartlar, kontenjanlar, Komisyonun çalışma ve karar alma usulleri, başvuru türleri ile başvuruda istenilecek belgeler Başkanlık tarafından çıkarılacak yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihten önce yayımlanmakta olan süreli yayınların sahibi, sorumlu müdürü, Kanunun yürürlüğe girdiği tarihten itibaren otuz gün içinde yayınlarının türünü yönetim yerinin bulunduğu yer Cumhuriyet Başsavcılığına bildirmek zorundadır. Bu süre içerisinde bildirim yükümlülüğüne uyulmaması halinde yayın sahibi, sorumlu müdür, beşyüzmilyon liradan yirmimilyar liraya kadar ağır para cezasıyla cezalandırılır. Bu ceza bölgesel süreli yayınlarda ikimilyar liradan, yaygın süreli yayınlarda beşmilyar liradan az olamaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihten önce kamu kurum ve kuruluşlarınca yayımlanmakta olan süreli yayınların temsilcisi ve sorumlu müdürleri, Kanunun yürürlüğe girdiği tarihten itibaren altı ay içerisinde süreli yayının basım ve yayımını bu Kanunda öngörülen hükümlere uygun hale getirirler.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>31/12/2011 tarihine kadar mahkemeler, yetkili mülki idari amirlikleri ve diğer makamlarca basılı yayınlarla ilgili olarak verilmiş toplatma, yasaklama, dağıtım ve satışın engellenmesi kararları, bu Kanunun yayımı tarihinden itibaren altı ay içinde, yetkili ve görevli mahkemeden bu yasaklılığın devamı niteliğinde bir karar alınmamış olması durumunda kendiliğinden hükümsüz hale gelir. Bu tür kararlarla ilgili mevcut bilgi ve deliller kolluk tarafından iki ay içinde yetkili Cumhuriyet başsavcılığına iletilir. Mahkemelerce, bu yönde alınmış olan kararların bir örneği İçişleri Bakanlığına gönderilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu maddenin yürürlüğe girdiği tarihten önce faaliyet gösteren internet haber siteleri, bu maddenin yürürlüğe girdiği tarihten itibaren üç ay içinde bu Kanunda öngörülen yükümlülüklerini yerine getirmek zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu maddenin yürürlüğe girdiği tarihten önce usulünce verilmiş olan basın kartları ek 3 üncü maddede yer alan şartları taşımaları kaydıyla geçerliliğini korumaya devam eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="31" başlık="Yürürlük">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="32" başlık="Yürütme">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
