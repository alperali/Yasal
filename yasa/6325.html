  <mvz-künye tür="kanun" no="6325" başlık="HUKUK UYUŞMAZLIKLARINDA ARABULUCULUK KANUNU"
             tarih="7/6/2012" rgazete-tarih="22/6/2012" rgazete-sayı="28331"
             düstur-tertip="5" düstur-cilt="52" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, hukuk uyuşmazlıklarının arabuluculuk yoluyla çözümlenmesinde uygulanacak usul ve esasları düzenlemektir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun, yabancılık unsuru taşıyanlar da dâhil olmak üzere, ancak tarafların üzerinde serbestçe tasarruf edebilecekleri iş veya işlemlerden doğan özel hukuk uyuşmazlıklarının çözümlenmesinde uygulanır. Şu kadar ki, aile içi şiddet iddiasını içeren uyuşmazlıklar arabuluculuğa elverişli değildir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Arabulucu: Arabuluculuk faaliyetini yürüten ve Bakanlıkça düzenlenen arabulucular siciline kaydedilmiş bulunan gerçek kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Arabuluculuk: Sistematik teknikler uygulayarak, görüşmek ve müzakerelerde bulunmak amacıyla tarafları bir araya getiren, onların birbirlerini anlamalarını ve bu suretle çözümlerini kendilerinin üretmesini sağlamak için aralarında iletişim sürecinin kurulmasını gerçekleştiren, tarafların çözüm üretemediklerinin ortaya çıkması hâlinde çözüm önerisi de getirebilen, uzmanlık eğitimi almış olan tarafsız ve bağımsız bir üçüncü kişinin katılımıyla ve ihtiyarî olarak yürütülen uyuşmazlık çözüm yöntemini,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bakanlık: Adalet Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Daire Başkanlığı: Hukuk İşleri Genel Müdürlüğü bünyesinde oluşturulacak Arabuluculuk Daire Başkanlığını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Genel Müdürlük: Hukuk İşleri Genel Müdürlüğünü,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İdare: 10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununa ekli (I), (II), (III) ve (IV) sayılı cetvellerde yer alan idare ve kurumlar ile 5018 sayılı Kanunda tanımlanan mahalli idareler ve bu idareler tarafından kurulan işletmeleri, özel kanunla kurulmuş diğer kamu kurum, kurul, üst kurul ve kuruluşları, kamu iktisadi teşebbüsleri ile bunların bağlı ortaklıkları, müessese ve işletmelerini, sermayesinin yüzde ellisinden fazlası kamuya ait diğer ortaklıkları,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kurul: Arabuluculuk Kurulunu,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Sicil: Arabulucular sicilini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Arabuluculuğa İlişkin Temel İlkeler">
    <mvz-madde no="3" başlık="İradi olma ve eşitlik">
      <mvz-fıkra no="1">
        <template>Taraflar, arabulucuya başvurmak, süreci devam ettirmek, sonuçlandırmak veya bu süreçten vazgeçmek konusunda serbesttirler.   Şu kadar ki dava şartı olarak arabuluculuğa ilişkin 18/A maddesi hükmü saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflar, gerek arabulucuya başvururken gerekse tüm süreç boyunca eşit haklara sahiptirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Gizlilik">
      <mvz-fıkra no="1">
        <template>Taraflarca aksi kararlaştırılmadıkça arabulucu, arabuluculuk faaliyeti çerçevesinde kendisine sunulan veya diğer bir şekilde elde ettiği bilgi ve belgeler ile diğer kayıtları gizli tutmakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aksi kararlaştırılmadıkça taraflar ve görüşmelere katılan diğer kişiler de bu konudaki gizliliğe uymak zorundadırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Beyan veya belgelerin kullanılamaması">
      <mvz-fıkra no="1">
        <template>Taraflar, arabulucu veya arabuluculuğa katılanlar da dâhil üçüncü bir kişi, uyuşmazlıkla ilgili olarak hukuk davası açıldığında yahut tahkim yoluna başvurulduğunda, aşağıdaki beyan veya belgeleri delil olarak ileri süremez ve bunlar hakkında tanıklık yapamaz:</template>
        <mvz-bent no="a">
          <template>Taraflarca yapılan arabuluculuk daveti veya bir tarafın arabuluculuk faaliyetine katılma isteği.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Uyuşmazlığın arabuluculuk yolu ile sona erdirilmesi için taraflarca ileri sürülen görüşler ve teklifler.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Arabuluculuk faaliyeti esnasında, taraflarca ileri sürülen öneriler veya herhangi bir vakıa veya iddianın kabulü.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Sadece arabuluculuk faaliyeti dolayısıyla hazırlanan belgeler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra hükmü, beyan veya belgenin şekline bakılmaksızın uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada belirtilen bilgilerin açıklanması mahkeme, hakem veya herhangi bir idari makam tarafından istenemez. Bu beyan veya belgeler, birinci fıkrada öngörülenin aksine, delil olarak sunulmuş olsa dahi hükme esas alınamaz. Ancak, söz konusu bilgiler bir kanun hükmü tarafından emredildiği veya arabuluculuk süreci sonunda varılan anlaşmanın uygulanması ve icrası için gerekli olduğu ölçüde açıklanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yukarıdaki fıkralar, arabuluculuğun konusuyla ilgili olup olmadığına bakılmaksızın, hukuk davası ve tahkimde uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Birinci fıkrada belirtilen sınırlamalar saklı kalmak koşuluyla, hukuk davası ve tahkimde ileri sürülebilen deliller, sadece arabuluculukta sunulmaları sebebiyle kabul edilemeyecek deliller haline gelmez.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Arabulucuların Hak ve Yükümlülükleri">
    <mvz-madde no="6" başlık="Unvanın kullanılması">
      <mvz-fıkra no="1">
        <template>Sicile kayıtlı olan arabulucular, arabulucu unvanını ve bu unvanın sağladığı yetkileri kullanma hakkına sahiptirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Arabulucu, arabuluculuk faaliyeti sırasında bu unvanını belirtmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Daire Başkanlığı, arabulucuların uzmanlık alanlarını ve uzmanlığa ilişkin usul ve esasları belirlemeye yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Ücret ve masrafların istenmesi">
      <mvz-fıkra no="1">
        <template>Arabulucu yapmış olduğu faaliyet karşılığı ücret ve masrafları isteme hakkına sahiptir. Arabulucu, ücret ve masraflar için avans da talep edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aksi kararlaştırılmadıkça arabulucunun ücreti, faaliyetin sona erdiği tarihte yürürlükte bulunan Arabulucu Asgari Ücret Tarifesine göre belirlenir ve ücret ile masraf taraflarca eşit olarak karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabulucu, arabuluculuk sürecine ilişkin olarak belirli kişiler için aracılık yapma veya belirli kişileri tavsiye etmenin karşılığı olarak ücret alamaz. Bu yasağa aykırı işlemler batıldır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Taraflarla görüşme ve iletişim kurulması">
      <mvz-fıkra no="1">
        <template>Arabulucu, tarafların her biri ile ayrı ayrı veya birlikte görüşebilir ve iletişim kurabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Görevin özenle ve tarafsız biçimde yerine getirilmesi">
      <mvz-fıkra no="1">
        <template>Arabulucu görevini özenle, tarafsız bir biçimde ve şahsen yerine getirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Arabulucu olarak görevlendirilen kimse, tarafsızlığından şüphe edilmesini gerektirecek önemli hâl ve şartların varlığı hâlinde, bu hususta tarafları bilgilendirmekle yükümlüdür. Bu açıklamaya rağmen taraflar, arabulucudan birlikte talep ederlerse, arabulucu bu görevi üstlenebilir yahut üstlenmiş olduğu görevi sürdürebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabulucu, taraflar arasında eşitliği gözetmekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Arabulucu, bu sıfatla görev yaptığı uyuşmazlıkla ilgili olarak açılan davada, daha sonra taraflardan birinin avukatı olarak görev üstlenemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Reklam yasağı">
      <mvz-fıkra no="1">
        <template>Arabulucuların iş elde etmek için reklam sayılabilecek her türlü teşebbüs ve harekette bulunmaları ve özellikle tabelalarında ve basılı kâğıtlarında arabulucu, avukat ve akademik unvanlarından başka sıfat kullanmaları yasaktır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Tarafların aydınlatılması">
      <mvz-fıkra no="1">
        <template>Arabulucu, arabuluculuk faaliyetinin başında, tarafları arabuluculuğun esasları, süreci ve sonuçları hakkında gerektiği gibi aydınlatmakla yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Aidat ödenmesi">
      <mvz-fıkra no="1">
        <template>Arabuluculardan sicile kayıtlarında giriş aidatı ve her yıl için yıllık aidat alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Giriş aidatı ve yıllık aidatlar genel bütçeye gelir kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Arabuluculuk Faaliyeti">
    <mvz-madde no="13" başlık="Arabulucuya başvuru">
      <mvz-fıkra no="1">
        <template>Taraflar dava açılmadan önce veya davanın görülmesi sırasında arabulucuya başvurma konusunda anlaşabilirler. Mahkeme de tarafları arabulucuya başvurmak konusunda aydınlatıp, teşvik edebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Aksi kararlaştırılmadıkça taraflardan birinin arabulucuya başvuru teklifine otuz gün içinde olumlu cevap verilmez ise bu teklif reddedilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabuluculuk ücretini karşılamak için adli yardıma ihtiyaç duyan taraf, arabuluculuk bürosunun bulunduğu yerdeki sulh hukuk mahkemesinin kararıyla adli yardımdan yararlanabilir. Bu konuda 12/1/2011 tarihli ve 6100 sayılı Hukuk Muhakemeleri Kanununun 334 ila 340 ıncı maddeleri kıyasen uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Arabulucunun seçilmesi">
      <mvz-fıkra no="1">
        <template>Başkaca bir usul kararlaştırılmadıkça arabulucu veya arabulucular taraflarca seçilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Arabuluculuk faaliyetinin yürütülmesi">
      <mvz-fıkra no="1">
        <template>Arabulucu, seçildikten sonra tarafları en kısa sürede ilk toplantıya davet eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflar, emredici hukuk kurallarına aykırı olmamak kaydıyla arabuluculuk usulünü serbestçe kararlaştırabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Taraflarca kararlaştırılmamışsa arabulucu; uyuşmazlığın niteliğini, tarafların isteklerini ve uyuşmazlığın hızlı bir şekilde çözümlenmesi için gereken usul ve esasları göz önüne alarak arabuluculuk faaliyetini yürütür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Niteliği gereği yargısal bir yetkinin kullanımı olarak sadece hâkim tarafından yapılabilecek işlemler arabulucu tarafından yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Dava açıldıktan sonra tarafların birlikte arabulucuya başvuracaklarını beyan etmeleri hâlinde yargılama, mahkemece üç ayı geçmemek üzere ertelenir. Bu süre, tarafların birlikte başvurusu üzerine üç aya kadar uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Arabuluculuk müzakerelerine taraflar bizzat, kanuni temsilcileri veya avukatları aracılığıyla katılabilirler. Uyuşmazlığın çözümüne katkı sağlayabilecek uzman kişiler de müzakerelerde hazır bulundurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Tarafların çözüm üretemediklerinin ortaya çıkması hâlinde arabulucu bir çözüm önerisinde bulunabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Arabuluculuk müzakerelerinde idareyi, üst yönetici tarafından belirlenen iki üye ile hukuk birimi amiri veya onun belirleyeceği bir avukat ya da hukuk müşavirinden oluşan komisyon temsil eder. Komisyon, arabuluculuk müzakereleri sonunda gerekçeli bir rapor düzenler ve beş yıl boyunca saklar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Komisyon üyelerinin arabuluculuk faaliyeti kapsamında yaptıkları işler ve aldıkları kararlar sebebiyle açılacak tazminat davaları, ancak Devlet aleyhine açılabilir. Devlet ödediği tazminattan dolayı görevinin gereklerine aykırı hareket etmek suretiyle görevini kötüye kullanan üyelere ödeme tarihinden itibaren bir yıl içinde rücu eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar Bakanlıkça yürürlüğe konulan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Arabuluculuk sürecinin başlaması ve sürelere etkisi">
      <mvz-fıkra no="1">
        <template>Arabuluculuk süreci, dava açılmadan önce arabulucuya başvuru hâlinde, tarafların ilk toplantıya davet edilmeleri ve taraflarla arabulucu arasında sürecin devam ettirilmesi konusunda anlaşmaya varılıp bu durumun bir tutanakla belgelendirildiği tarihten itibaren işlemeye başlar. Dava açılmasından sonra arabulucuya başvuru hâlinde ise bu süreç, mahkemenin tarafları arabuluculuğa davetinin taraflarca kabul edilmesi veya tarafların arabulucuya başvurma konusunda anlaşmaya vardıklarını duruşma dışında mahkemeye yazılı olarak beyan ettikleri ya da duruşmada bu beyanlarının tutanağa geçirildiği tarihten itibaren işlemeye başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Arabuluculuk sürecinin başlamasından sona ermesine kadar geçirilen süre, zamanaşımı ve hak düşürücü sürelerin hesaplanmasında dikkate alınmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Arabuluculuğun sona ermesi">
      <mvz-fıkra no="1">
        <template>Aşağıda belirtilen hâllerde arabuluculuk faaliyeti sona erer:</template>
        <mvz-bent no="a">
          <template>Tarafların anlaşmaya varması.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Taraflara danışıldıktan sonra arabuluculuk için daha fazla çaba sarf edilmesinin gereksiz olduğunun arabulucu tarafından tespit edilmesi.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Taraflardan birinin karşı tarafa veya arabulucuya, arabuluculuk faaliyetinden çekildiğini bildirmesi.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Tarafların anlaşarak arabuluculuk faaliyetini sona erdirmesi.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Uyuşmazlığın arabuluculuğa elverişli olmadığının tespit edilmesi.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Arabuluculuk faaliyeti sonunda tarafların anlaştıkları, anlaşamadıkları veya arabuluculuk faaliyetinin nasıl sonuçlandığı bir tutanak ile belgelendirilir. Arabulucu tarafından düzenlenecek bu belge, arabulucu, taraflar, kanuni temsilcileri veya avukatlarınca imzalanır. Belge taraflar, kanuni temsilcileri veya avukatlarınca imzalanmazsa, sebebi belirtilmek suretiyle sadece arabulucu tarafından imzalanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabuluculuk faaliyeti sonunda düzenlenen tutanağa, faaliyetin sonuçlanması dışında hangi hususların yazılacağına taraflar karar verir. Arabulucu, bu tutanak ve sonuçları konusunda taraflara gerekli açıklamaları yapar ve taraflar hazır değilse her türlü iletişim vasıtasını kullanarak hazır bulunmayan tarafları bilgilendirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Arabuluculuk faaliyetinin sona ermesi hâlinde, arabulucu, bu faaliyete ilişkin kendisine yapılan bildirimi, tevdi edilen ve elinde bulunan belgeleri, ikinci fıkraya göre düzenlenen tutanağı beş yıl süre ile saklamak zorundadır. Arabulucu, arabuluculuk faaliyeti sonunda düzenlediği son tutanağın bir örneğini arabuluculuk faaliyetinin sona ermesinden itibaren bir ay içinde Genel Müdürlüğe gönderir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17/A" başlık="Milletlerarası sulh anlaşma belgelerinin icrası">
      <mvz-fıkra no="1">
        <template>25/2/2021 tarihli ve 7282 sayılı Arabuluculuk Sonucunda Yapılan Milletlerarası Sulh Anlaşmaları Hakkında Birleşmiş Milletler Konvansiyonunun Onaylanmasının Uygun Bulunduğuna Dair Kanunla kabul edilen Sözleşme kapsamında arabuluculuk sonucu düzenlenen sulh anlaşma belgelerinin yerine getirilmesi için icra edilebilirlik şerhinin asliye ticaret mahkemesinden alınması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İcra edilebilirlik şerhi, tarafların kararlaştırdıkları yer mahkemesinden, kararlaştırdıkları yer yoksa sırasıyla karşı tarafın Türkiye’deki yerleşim yeri mahkemesinden, sakin olduğu yer mahkemesinden, Türkiye’de yerleşim yeri veya sakin olduğu bir yer mevcut değilse Ankara, İstanbul veya İzmir mahkemelerinden birinden istenebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İcra edilebilirlik şerhinin verilmesine ilişkin inceleme dosya üzerinden, Sözleşme hükümleri ile 18 inci madde hükmüne göre yapılır. Mahkeme, gerektiğinde gerekçesini de göstererek duruşma açabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17/B" başlık="Taşınmazın devrine veya taşınmaz üzerinde sınırlı ayni hak kurulmasına ilişkin uyuşmazlıklarda arabuluculuk">
      <mvz-fıkra no="1">
        <template>Taşınmazın devrine veya taşınmaz üzerinde sınırlı ayni hak kurulmasına ilişkin uyuşmazlıklar arabuluculuğa elverişlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra kapsamındaki uyuşmazlıklarda, tarafların yazılı olarak kararlaştırması ve arabulucunun bu kararı tutanak altına alması halinde arabulucunun talebiyle, arabuluculuk süreciyle sınırlı olmak ve konulduğu tarihten itibaren üç ayı geçmemek üzere tasarruf yetkisinin kısıtlandığına dair tapu siciline şerh verilir. Bu şerh, tarafların anlaşamaması veya tarafların şerhin kaldırılması konusunda anlaşması halinde arabulucunun talebiyle, üç aylık sürenin sonunda ise kendiliğinden kalkar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabuluculuk süreci sonunda tarafların anlaşması halinde anlaşma belgesi, taşınmazın devri veya taşınmaz üzerinde sınırlı ayni hak kurulmasıyla ilgili olarak kanunlarda yer alan sınırlamalar ile usul ve esaslar gözetilmek suretiyle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Anlaşma belgesinin icra edilebilirliğine ilişkin şerhin alınması zorunlu olup bu şerh taşınmazın bulunduğu yer sulh hukuk mahkemesinden alınır. Mahkeme yapacağı incelemede anlaşma içeriğini, arabuluculuğa ve cebri icraya elverişli olup olmadığı ve taşınmazın devri veya taşınmaz üzerinde sınırlı ayni hak kurulmasıyla ilgili olarak kanunlarda yer alan sınırlamalar ile usul ve esaslara uyulup uyulmadığı yönünden denetler; bu kapsamda kurum veya kuruluşlardan bilgi veya belge talep edebilir ve gerektiğinde duruşma açabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Anlaşma belgesinin icra edilebilirliğine ilişkin şerhin verilmesiyle ilgili diğer hususlar hakkında 18 inci madde hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Anlaşma belgesinin taraflarından biri, icra edilebilirlik şerhi verilmesinden sonra tapu müdürlüğünden tescil talebinde bulunabilir. Tapu müdürlüğünce taşınmaza ilişkin mevzuatta öngörülen gerekli inceleme ve değerlendirme yapıldıktan sonra resmi senet düzenlenmeksizin tescil talebi yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Tarafların anlaşması">
      <mvz-fıkra no="1">
        <template>Arabuluculuk faaliyeti sonunda varılan anlaşmanın kapsamı taraflarca belirlenir; anlaşma belgesi düzenlenmesi hâlinde bu belge taraflar ve arabulucu tarafından imzalanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflar arabuluculuk faaliyeti sonunda bir anlaşmaya varırlarsa, bu anlaşma belgesinin icra edilebilirliğine ilişkin şerh verilmesini talep edebilirler. Dava açılmadan önce arabuluculuğa başvurulmuşsa, anlaşmanın icra edilebilirliğine ilişkin şerh verilmesi, arabulucunun görev yaptığı yer sulh hukuk mahkemesinden talep edilebilir. Davanın görülmesi sırasında arabuluculuğa başvurulması durumunda ise anlaşmanın icra edilebilirliğine ilişkin şerh verilmesi, davanın görüldüğü mahkemeden talep edilebilir. Bu şerhi içeren anlaşma, ilam niteliğinde belge sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İcra edilebilirlik şerhinin verilmesi, çekişmesiz yargı işidir ve buna ilişkin inceleme dosya üzerinden yapılır. Ancak arabuluculuğa elverişli olan aile hukukuna ilişkin uyuşmazlıklarda inceleme duruşmalı olarak yapılır. Bu incelemenin kapsamı anlaşmanın içeriğinin arabuluculuğa ve cebri icraya elverişli olup olmadığı hususlarıyla sınırlıdır. Anlaşma belgesine icra edilebilirlik şerhi verilmesi için mahkemeye yapılacak olan başvuru ile bunun üzerine verilecek kararlara karşı ilgili tarafından istinaf yoluna gidilmesi hâlinde, maktu harç alınır. Taraflar anlaşma belgesini icra edilebilirlik şerhi verdirmeden başka bir resmî işlemde kullanmak isterlerse, damga vergisi de maktu olarak alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kanunlarda icra edilebilirlik şerhi alınmasının zorunlu kılındığı haller hariç, taraflar ve avukatları ile arabulucunun, ticari uyuşmazlıklar bakımından ise avukatlar ile arabulucunun birlikte imzaladıkları anlaşma belgesi, icra edilebilirlik şerhi aranmaksızın ilam niteliğinde belge sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Arabuluculuk faaliyeti sonunda anlaşmaya varılması hâlinde, üzerinde anlaşılan hususlar hakkında taraflarca dava açılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Dava Şartı Olarak Arabuluculuk">
    <mvz-madde no="18/A" başlık="Dava şartı olarak arabuluculuk">
      <mvz-fıkra no="1">
        <template>İlgili kanunlarda arabulucuya başvurulmuş olması dava şartı olarak kabul edilmiş ise arabuluculuk sürecine aşağıdaki hükümler uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Davacı, arabuluculuk faaliyeti sonunda anlaşmaya varılamadığına ilişkin son tutanağın aslını veya arabulucu tarafından onaylanmış bir örneğini dava dilekçesine eklemek zorundadır. Bu zorunluluğa uyulmaması hâlinde mahkemece davacıya, son tutanağın bir haftalık kesin süre içinde mahkemeye sunulması gerektiği, aksi takdirde davanın usulden reddedileceği ihtarını içeren davetiye gönderilir. İhtarın gereği yerine getirilmez ise dava dilekçesi karşı tarafa tebliğe çıkarılmaksızın davanın usulden reddine karar verilir. Arabulucuya başvurulmadan dava açıldığının anlaşılması hâlinde herhangi bir işlem yapılmaksızın davanın, dava şartı yokluğu sebebiyle usulden reddine karar verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Daire Başkanlığı, sicile kayıtlı arabuluculardan bu madde uyarınca arabuluculuk yapmak isteyenleri, varsa uzmanlık alanlarını da belirterek, görev yapmak istedikleri adli yargı ilk derece mahkemesi adalet komisyonlarına göre listeler ve listeleri ilgili komisyon başkanlıklarına bildirir. Komisyon başkanlıkları, bu listeleri kendi yargı çevrelerindeki arabuluculuk bürolarına, arabuluculuk bürosu kurulmayan yerlerde ise görevlendirecekleri sulh hukuk mahkemesi yazı işleri müdürlüğüne gönderir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Başvuru, uyuşmazlığın konusuna göre yetkili mahkemenin bulunduğu yer arabuluculuk bürosuna, arabuluculuk bürosu kurulmayan yerlerde ise görevlendirilen yazı işleri müdürlüğüne yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Arabulucu, komisyon başkanlıklarına bildirilen listeden büro tarafından belirlenir. Ancak tarafların listede yer alan herhangi bir arabulucu üzerinde anlaşmaları hâlinde bu arabulucu görevlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Başvuran taraf, kendisine ve elinde bulunması hâlinde karşı tarafa ait her türlü iletişim bilgisini arabuluculuk bürosuna verir. Büro, tarafların resmî kayıtlarda yer alan iletişim bilgilerini araştırmaya da yetkilidir. İlgili kurum ve kuruluşlar, büro tarafından talep edilen bilgi ve belgeleri vermekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Taraflara ait iletişim bilgileri, görevlendirilen arabulucuya büro tarafından verilir. Arabulucu bu iletişim bilgilerini esas alır, ihtiyaç duyduğunda kendiliğinden araştırma da yapabilir. Elindeki bilgiler itibarıyla her türlü iletişim vasıtasını kullanarak görevlendirme konusunda tarafları bilgilendirir ve ilk toplantıya davet eder.  Avukatı bulunsa bile asıl tarafı da bilgilendirir. Bilgilendirme ve davete ilişkin işlemlerini belgeye bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Arabulucu, görevlendirmeyi yapan büronun yetkili olup olmadığını kendiliğinden dikkate alamaz. Karşı taraf en geç ilk toplantıda, yetkiye ilişkin belgeleri sunmak suretiyle arabuluculuk bürosunun yetkisine itiraz edebilir. Bu durumda arabulucu, dosyayı derhâl ilgili sulh hukuk mahkemesine gönderilmek üzere büroya teslim eder. Mahkeme, harç alınmaksızın dosya üzerinden yapacağı inceleme sonunda en geç bir hafta içinde yetkili büroyu kesin olarak karara bağlar ve dosyayı büroya iade eder. Mahkeme kararı büro tarafından 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu hükümleri uyarınca taraflara tebliğ edilir. Yetki itirazının reddi durumunda aynı arabulucu yeniden görevlendirilir ve dokuzuncu fıkrada belirtilen süreler yeni görevlendirme tarihinden başlar. Yetki itirazının kabulü durumunda ise kararın tebliğinden itibaren bir hafta içinde yetkili büroya başvurulabilir. Bu takdirde yetkisiz büroya başvurma tarihi yetkili büroya başvurma tarihi olarak kabul edilir. Yetkili büro, beşinci fıkra uyarınca arabulucu görevlendirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Arabulucu, yapılan başvuruyu görevlendirildiği tarihten itibaren üç hafta içinde sonuçlandırır. Bu süre zorunlu hâllerde arabulucu tarafından en fazla bir hafta uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Arabulucu; taraflara ulaşılamaması veya taraflar katılmadığı için görüşme yapılamaması ya da tarafların anlaşması yahut tarafların anlaşamaması hâllerinde arabuluculuk faaliyetini sona erdirir ve son tutanağı düzenleyerek durumu derhâl arabuluculuk bürosuna bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Taraflardan birinin geçerli bir mazeret göstermeksizin ilk toplantıya katılmaması sebebiyle arabuluculuk faaliyetinin sona ermesi durumunda toplantıya katılmayan taraf, son tutanakta belirtilir ve bu taraf davada kısmen veya tamamen haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu tutulur.  Ayrıca bu taraf lehine Avukatlık Asgari Ücret Tarifesine göre belirlenen vekâlet ücretinin yarısına hükmedilir. Her iki tarafın da ilk toplantıya katılmaması sebebiyle sona eren arabuluculuk faaliyeti üzerine açılacak davalarda tarafların yaptıkları yargılama giderleri kendi üzerlerinde bırakılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Tarafların arabuluculuk faaliyeti sonunda anlaşmaları hâlinde, arabuluculuk ücreti, Arabuluculuk Asgari Ücret Tarifesinin eki Arabuluculuk Ücret Tarifesinin İkinci Kısmına göre aksi kararlaştırılmadıkça taraflarca eşit şekilde karşılanır. Bu durumda ücret, Tarifenin Birinci Kısmında belirlenen iki saatlik ücret tutarından az olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Arabuluculuk faaliyeti sonunda taraflara ulaşılamaması, taraflar katılmadığı için görüşme yapılamaması veya iki saatten az süren görüşmeler sonunda tarafların anlaşamamaları hâllerinde, iki saatlik ücret tutarı Tarifenin Birinci Kısmına göre Adalet Bakanlığı bütçesinden ödenir. İki saatten fazla süren görüşmeler sonunda tarafların anlaşamamaları hâlinde ise iki saati aşan kısma ilişkin ücret aksi kararlaştırılmadıkça taraflarca eşit şekilde uyuşmazlığın konusu dikkate alınarak Tarifenin Birinci Kısmına göre karşılanır. Adalet Bakanlığı bütçesinden ödenen ve taraflarca karşılanan arabuluculuk ücreti, yargılama giderlerinden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="14">
        <template>Bu madde uyarınca arabuluculuk bürosu tarafından yapılması gereken zaruri giderler; arabuluculuk faaliyeti sonunda anlaşmaya varılması hâlinde anlaşma uyarınca taraflarca ödenmek, anlaşmaya varılamaması hâlinde ise ileride haksız çıkacak taraftan tahsil olunmak üzere Adalet Bakanlığı bütçesinden karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="15">
        <template>Arabuluculuk bürosuna başvurulmasından son tutanağın düzenlendiği tarihe kadar geçen sürede zamanaşımı durur ve hak düşürücü süre işlemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="16">
        <template>Dava açılmadan önce ihtiyati tedbir kararı verilmesi hâlinde 6100 sayılı Kanunun 397 nci maddesinin birinci fıkrasında, ihtiyati haciz kararı verilmesi hâlinde ise 9/6/1932 tarihli ve 2004 sayılı İcra ve İflas Kanununun 264 üncü maddesinin birinci fıkrasında düzenlenen dava açma süresi, arabuluculuk bürosuna başvurulmasından son tutanağın düzenlendiği tarihe kadar işlemez.  Arabuluculuk bürosuna başvurulmasından sonra, başvuran taraf aleyhine uyuşmazlık konusuyla ilgili olarak icra takibi yapılması durumunda, başvuran tarafın bu takibe karşı son tutanağın düzenlendiği tarihten itibaren iki hafta içinde 2004 sayılı Kanunun 72 nci maddesi uyarınca menfi tespit davası açması ve talep etmesi halinde 2004 sayılı Kanunun 72 nci maddesinin ikinci fıkrası hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="17">
        <template>Arabuluculuk görüşmeleri, taraflarca aksi kararlaştırılmadıkça, arabulucuyu görevlendiren büronun bağlı bulunduğu adli yargı ilk derece mahkemesi adalet komisyonunun yetki alanı içinde yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="18">
        <template>Özel kanunlarda tahkim veya başka bir alternatif uyuşmazlık çözüm yoluna başvurma zorunluluğunun olduğu veya tahkim sözleşmesinin bulunduğu hâllerde, dava şartı olarak arabuluculuğa ilişkin hükümler uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="19">
        <template>İlgili kanunlarda dava şartı olarak arabuluculuğa ilişkin kabul edilen özel hükümler saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="20">
        <template>Bu bölümde hüküm bulunmayan hâllerde niteliğine uygun düştüğü ölçüde bu Kanunun diğer hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18/B" başlık="Bazı uyuşmazlıklarda dava şartı olarak arabuluculuk">
      <mvz-fıkra no="1">
        <template>Aşağıdaki uyuşmazlıklarda, dava açılmadan önce arabulucuya başvurulmuş olması dava şartıdır:</template>

      <mvz-fıkra no="3">
        <template>Bu madde kapsamında düzenlenen anlaşma belgesinin icra edilebilirliğine ilişkin şerhin alınması zorunlu olup bu şerh taşınmazla ilgili anlaşma belgeleri bakımından taşınmazın bulunduğu yer, diğer anlaşma belgeleri bakımından ise arabulucunun görev yaptığı yer sulh hukuk mahkemesinden alınır. Mahkeme taşınmazla ilgili anlaşma belgeleri bakımından yapacağı incelemede anlaşma içeriğini, arabuluculuğa ve cebri icraya elverişli olup olmadığı ve taşınmazla ilgili olarak kanunlarda yer alan sınırlamalar ile usul ve esaslara uyulup uyulmadığı yönünden denetler; bu kapsamda kurum veya kuruluşlardan bilgi veya belge talep edebilir ve gerektiğinde duruşma açabilir.</template>

  <mvz-bölüm no="6-ALTINCI" başlık="Arabulucular Sicili">
    <mvz-madde no="19" başlık="Arabulucular sicilinin tutulması">
      <mvz-fıkra no="1">
        <template>Daire Başkanlığı, özel hukuk uyuşmazlıklarında arabuluculuk yapma yetkisini kazanmış kişilerin sicilini tutar. Bu sicilde yer alan kişilere ilişkin bilgiler, Daire Başkanlığı tarafından elektronik ortamda da duyurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Arabulucular sicilinin tutulmasına ilişkin usul ve esaslar Bakanlıkça hazırlanacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabulucular siciline kayıt şartları</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="">
      <mvz-fıkra no="1">
        <template>Sicile kayıt, ilgilinin Daire Başkanlığına yazılı olarak başvurması üzerine yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Arabulucular siciline kaydedilebilmek için;</template>
        <mvz-bent no="a">
          <template>Türk vatandaşı olmak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Mesleğinde en az beş yıllık kıdeme sahip hukuk fakültesi mezunu olmak,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Tam ehliyetli olmak,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıldan fazla süreyle hapis cezasına ya da affa uğramış olsa bile Devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık, gerçeğe aykırı bilirkişilik yapma, yalan tanıklık ve yalan yere yemin suçlarından mahkûm olmamak,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Terör örgütleriyle iltisaklı veya irtibatlı olmamak,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Arabuluculuk  eğitimini  tamamlamak  ve  mesleğinde yirmi yıl kıdeme sahip olanlar hariç Bakanlıkça  yapılan  yazılı    sınavda  başarılı olmak,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabulucu, sicile kayıt tarihinden itibaren faaliyetine başlayabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Daire Başkanlığı, sicile kayıtlı arabulucuları, görev yapmak istedikleri adli yargı ilk derece mahkemesi adalet komisyonlarına göre listeler ve listeleri ilgili komisyon başkanlıklarına gönderir. Bir arabulucu, en fazla üç komisyon listesine kaydolabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Arabulucular sicilinden silinme">
      <mvz-fıkra no="1">
        <template>Daire Başkanlığı, arabuluculuk için aranan koşulları taşımadığı hâlde sicile kaydedilen veya daha sonra bu koşulları kaybeden arabulucunun kaydını siler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Daire Başkanlığı, bu Kanunun öngördüğü yükümlülükleri yerine getirmediğini tespit ettiği arabulucuyu yazılı olarak uyarır; bu uyarıya uyulmaması hâlinde arabulucunun savunmasını aldıktan sonra, gerekirse adının sicilden silinmesini Kuruldan talep eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabulucu, arabulucular sicilinden kaydının silinmesini her zaman isteyebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Arabuluculuk Eğitimi ve Eğitim Kuruluşları">
    <mvz-madde no="22" başlık="Arabuluculuk eğitimi">
      <mvz-fıkra no="1">
        <template>Arabuluculuk eğitimi, hukuk fakültesinin tamamlanmasından sonra alınan, arabuluculuk faaliyetinin yürütülmesiyle ilgili temel bilgileri, iletişim teknikleri, müzakere ve uyuşmazlık çözüm yöntemleri ve davranış psikolojisi ile yönetmelikte gösterilecek olan diğer teorik ve pratik bilgileri içeren eğitimi ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Eğitim kuruluşlarına izin verilmesi">
      <mvz-fıkra no="1">
        <template>Arabuluculuk eğitimi, bünyesinde hukuk fakültesi bulunan üniversitelerin hukuk fakülteleri, Türkiye Barolar Birliği ve Türkiye Adalet Akademisi tarafından verilir. Bu kuruluşlar Bakanlıktan izin alarak eğitim verebilirler. İzin verilen eğitim kuruluşlarının listesi elektronik ortamda yayımlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İzin için yazılı olarak başvurulur. Bu başvuruda eğitim programı, eğiticilerin sayısı ve uzmanlıkları ile eğitim kuruluşu veya eğitim programının finansman kaynakları hakkında gerekçeli bilgi verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Başvuruda sunulan belgelere dayalı olarak, eğitimin amacına ulaşacağı ve eğitim kuruluşlarında eğitim faaliyetinin devamlılığının sağlanacağı tespit edilirse, ilgili eğitim kuruluşuna en çok üç yıl için geçerli olmak üzere izin verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="İzin süresinin uzatılması">
      <mvz-fıkra no="1">
        <template>Sicile kayıtlı olan bir eğitim kuruluşu kayıt süresinin bitiminden en erken bir yıl ve en geç üç ay önce, sicildeki kaydının geçerlilik süresinin uzatılmasını yazılı olarak talep edebilir. Eğitim kuruluşunun 26 ncı maddeye göre sunduğu raporlardan, arabuluculuk eğitiminin başarılı şekilde devam ettiğinin anlaşıldığı ve 27 nci maddede belirtilen sebeplerin bulunmadığı hâllerde, verilmiş bulunan iznin geçerlilik süresi her defasında üç yıl uzatılabilir. Eğitim kuruluşu, süresi içinde yaptığı başvuru hakkında karar verilinceye kadar listede kayıtlı kalır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Arabuluculuk yetki belgesi">
      <mvz-fıkra no="1">
        <template>Eğitim kuruluşları, eğitimlerini başarıyla tamamlayan kişilere arabuluculuk eğitimini tamamladıklarına dair bir belge verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Daire Başkanlığına bilgi verme yükümlülüğü">
      <mvz-fıkra no="1">
        <template>Eğitim kuruluşları, her yıl ocak ayında bir önceki yıl içinde gerçekleştirdikleri eğitim faaliyetinin kapsamı, içeriği ve başarısı konusunda Daire Başkanlığına bir rapor sunar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Eğitim kuruluşuna verilen iznin iptali">
      <mvz-fıkra no="1">
        <template>Aşağıdaki hâllerde eğitim kuruluşuna verilmiş olan izin, Bakanlığın talebi üzerine Kurul tarafından iptal edilir:</template>
        <mvz-bent no="a">
          <template>İzin verilebilmesi için aranan şartlardan birinin ortadan kalkmış veya mevcut olmadığının tespit edilmiş olması.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Eğitimin yeterli şekilde verilememesi.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Arabuluculuk yetki belgelerinin düzenlenmesinde sahtecilik veya önemli hatalar yapılması.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>26 ncı maddedeki rapor verme yükümlülüğünün yapılan ihtara rağmen yerine getirilmemesi.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Eğitim faaliyetinin devamlılığının sağlanmadığının tespit edilmesi.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Kuruluş ve Görevler">
    <mvz-madde no="28" başlık="Kuruluş ve teşkilat">
      <mvz-fıkra no="1">
        <template>Bu Kanunda belirtilen görevleri yerine getirmek üzere, Genel Müdürlük bünyesinde Daire Başkanlığı kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Arabuluculuk hizmetlerine ilişkin olarak bu Kanunda belirtilen görevleri yerine getirmek üzere, Bakanlık bünyesinde Arabuluculuk Kurulu oluşturulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabuluculuğa başvuranları bilgilendirmek, arabulucuları görevlendirmek ve kanunla verilen diğer görevleri yerine getirmek üzere Bakanlık tarafından uygun görülen adliyelerde arabuluculuk büroları kurulur. Adli yargı ilk derece mahkemesi adalet komisyonu tarafından, münhasıran bu bürolarda çalışmak üzere bir yazı işleri müdürü ile yeteri kadar personel görevlendirilir. Arabuluculuk büroları, Hâkimler ve Savcılar Kurulu tarafından belirlenen sulh hukuk hâkiminin gözetim ve denetimi altında görev yapar. Arabuluculuk bürosu kurulmayan yerlerde bu büroların görevi, adli yargı ilk derece mahkemesi adalet komisyonunca görevlendirilen sulh hukuk mahkemesi yazı işleri müdürlüğü tarafından ilgili hâkimin gözetim ve denetimi altında yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Daire Başkanlığı">
      <mvz-fıkra no="1">
        <template>Daire Başkanlığı, bir daire başkanı, yeteri kadar tetkik hâkimi ve diğer personelden oluşur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Daire Başkanlığının görevleri">
      <mvz-fıkra no="1">
        <template>Daire Başkanlığının görevleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Arabuluculuk hizmetlerinin düzenli ve verimli olarak yürütülmesini sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Arabuluculukla ilgili yayın yapmak, bu konudaki bilimsel çalışmaları teşvik etmek ve desteklemek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kurulun çalışması ile ilgili her türlü karar ve işlemi yürütmek ve görevleri ile ilgili bakanlık, diğer kamu kurum ve kuruluşları, üniversiteler, kamu kurumu niteliğindeki meslek kuruluşları, kamu yararına çalışan vakıf ve dernekler ile uygun görülen gönüllü gerçek ve tüzel kişilerle işbirliği yapmak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Arabuluculuk kurumunun tanıtımını yapmak, bu konuda kamuoyunu bilgilendirmek, ulusal ve uluslararası kongre, sempozyum ve seminer gibi bilimsel organizasyonları düzenlemek veya desteklemek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Ülke genelinde arabuluculuk uygulamalarını izlemek, ilgili istatistikleri tutmak ve yayımlamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Arabuluculuk eğitimi verecek kuruluşlar tarafından bu amaçla yapılan başvuru ile sicildeki kaydın geçerlilik süresinin uzatılması talebinin karara bağlanmasını Bakanlığın onayına sunmak, arabuluculuk eğitimi verecek eğitim kuruluşlarını listelemek ve elektronik ortamda yayımlamak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Arabulucu sicilini tutmak, sicile kayıt taleplerini karara bağlamak, 21 inci maddenin birinci ve üçüncü fıkraları kapsamında arabulucunun sicilden silinmesine karar vermek ve bu sicilde yer alan kişilere ilişkin bilgileri elektronik ortamda duyurmak.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Arabulucular tarafından arabuluculuk faaliyeti sonunda düzenlenen son tutanakların kayıtlarını tutmak ve birer örneklerini saklamak.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Görev alanına giren kanun ve düzenleyici işlemler hakkında inceleme ve araştırma yaparak Genel Müdürlüğe öneride bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Yıllık faaliyet raporunu ve izleyen yıl faaliyet planını hazırlayarak Kurulun bilgisine sunmak.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Yıllık Arabuluculuk Asgari Ücret Tarifesini hazırlamak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Kurul">
      <mvz-fıkra no="1">
        <template>Kurul aşağıdaki üyelerden oluşur:</template>
        <mvz-bent no="a">
          <template>Hukuk İşleri Genel Müdürü.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Daire Başkanı.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Hâkimler ve Savcılar Kurulu tarafından hukuk mahkemelerinde görev yapmakta olan birinci sınıfa ayrılmış hâkimler arasından seçilecek iki hâkim.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Türkiye Barolar Birliğinden üç temsilci.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Türkiye Noterler Birliğinden bir temsilci.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Yükseköğretim Kurulu tarafından seçilen özel hukuk alanından bir öğretim üyesi.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Adalet Bakanı tarafından seçilecek üç arabulucu.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Türkiye Odalar ve Borsalar Birliğinden bir temsilci.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Kendisine mensup işçi sayısı en çok olan üç işçi sendikaları konfederasyonunca seçilecek birer temsilci.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>En çok işveren mensubu olan işveren sendikaları konfederasyonunca seçilecek bir temsilci.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Türkiye Esnaf ve Sanatkarları Konfederasyonundan bir temsilci.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Türkiye Adalet Akademisi Eğitim Merkezi Başkanı.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Başkan ihtiyaca göre Kurul toplantılarına uzman kişileri çağırabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurul başkanı Genel Müdürdür. Genel Müdürün bulunmadığı toplantılarda Başkanlık görevi Daire Başkanı tarafından yerine getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurul, mart ve eylül aylarında olmak üzere yılda en az iki kez toplanır. Ayrıca, Başkanın veya en az beş üyenin talebiyle Kurul her zaman toplantıya çağrılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurul üye tam sayısının salt çoğunluğu ile karar alır. Mazeretsiz olarak art arda iki toplantıya katılmayan üyenin üyeliği düşer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kurulun Bakanlık dışından görevlendirilen üyelerinin görev süresi üç yıldır. Görev süresi dolan üyeler yeniden görevlendirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Başka yerden katılan Kurul üyelerinin gündelik, yol gideri, konaklama ve diğer zorunlu giderleri 10/2/1954 tarihli ve 6245 sayılı Harcırah Kanunu hükümlerine göre Bakanlıkça karşılanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Kurulun çalışma usul ve esasları yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="32" başlık="Kurulun görevleri">
      <mvz-fıkra no="1">
        <template>Kurulun görevleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Arabuluculuk hizmetlerine ilişkin temel ilkeler ile arabuluculuk meslek kurallarını belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Arabuluculuk eğitimine ve bu eğitimin sonunda yapılacak olan sınava ilişkin temel ilke ve standartları tespit etmek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Arabulucuların denetimine ilişkin kuralları belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Bu Kanuna göre çıkarılması gereken ve Genel Müdürlük tarafından hazırlanan yönetmelik taslaklarına, gerekirse değişiklik yaparak son şeklini vermek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Eğitim kuruluşlarının eğitim izinlerini iptal etmek.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>21 inci maddenin ikinci fıkrası kapsamında arabulucunun sicilden silinmesine karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Arabulucuların ödeyecekleri sicile kayıt aidatını ve yıllık aidatları tespit etmek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Arabuluculuk Asgari Ücret Tarifesini gerekiyorsa değişiklik yapmak suretiyle onaylamak.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Daire Başkanlığı tarafından yürütülecek faaliyetlerin etkinliğini artırmak üzere tavsiyelerde bulunmak.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Daire Başkanlığının yıllık faaliyet raporu ve plânı hakkında görüş bildirmek.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Daire Başkanlığının faaliyet planında yer alan konularla ilgili kurum ve kuruluşların uygulamaya sağlayabileceği katkıları belirlemek.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="9-DOKUZUNCU" başlık="Ceza Hükümleri">
    <mvz-madde no="33" başlık="Gizliliğin ihlali">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 4 üncü maddesindeki yükümlülüğe aykırı hareket ederek bir kişinin hukuken korunan menfaatinin zarar görmesine neden olan kişi altı aya kadar hapis cezası ile cezalandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu suçların soruşturulması ve kovuşturulması şikâyete bağlıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="10-ONUNCU" başlık="Son ve Geçici Hükümler">
    <mvz-madde no="34" başlık="Kadrolar">
      <mvz-fıkra no="1">
        <template>Ekli (1) ve (2) sayılı listelerde yer alan kadrolar ihdas edilerek 13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnameye ekli (I) ve (II) sayılı cetvellerin Adalet Bakanlığına ait bölümlerine eklenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Değiştirilen hükümler">
      <mvz-fıkra no="1">
        <template>19/3/1969 tarihli ve 1136 sayılı Avukatlık Kanununun 12 nci maddesinin birinci fıkrasının (d) bendine “Hakemlik” ibaresinden sonra gelmek üzere “arabuluculuk,” ibaresi eklenmiştir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>12/1/2011 tarihli ve 6100 sayılı Hukuk Muhakemeleri Kanununun;</template>
        <mvz-bent no="a">
          <template>137 nci maddesinin birinci fıkrasına “sulhe” ibaresinden sonra gelmek üzere “veya arabuluculuğa” ibaresi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>140 ıncı maddesinin ikinci fıkrasına “sulhe” ibaresinden sonra gelmek üzere “veya arabuluculuğa”, üçüncü fıkrasına “sulh” ibaresinden sonra gelmek üzere “veya arabuluculuk” ibaresi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>320 nci maddesinin ikinci fıkrasına “tarafları sulhe” ibaresinden sonra gelmek üzere “veya arabuluculuğa” ibaresi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>eklenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Yönetmelikler">
      <mvz-fıkra no="1">
        <template>Arabuluculuk eğitimi verecek kuruluşların denetlenmesi ile eğitimin süresi, içeriği ve standartları, yapılacak olan yazılı  sınavın ilke ve kurallarının belirlenmesi, arabulucular sicilinin düzenlenmesi ve arabulucularda aranacak koşullar, arabulucuların denetlenmesi ve izlenmesi ile bu Kanunun uygulanmasını gösteren diğer hususlar, Bakanlıkça çıkarılacak yönetmeliklerle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yayımı tarihinden itibaren iki ay içinde kuruluş ve teşkilatlanma tamamlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun 31 inci maddesinde öngörülen kurum ve kuruluşlar, Kurulda görev yapacak temsilcileri Kanunun yayımı tarihinden itibaren iki ay içinde Genel Müdürlüğe bildirirler. İlk üç yıl için Adalet Bakanı tarafından seçilecek üç arabulucu yerine 31 inci maddenin birinci fıkrasının (ç), (g) ve (ğ) bentlerindeki kurumlar birer fazla temsilci bildirirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Arabulucu yerine ilgili kurumlardan bildirilen temsilcilerin Kuruldaki görev süresi bir yıldır. Adalet Bakanlığı tarafından bu sürenin sonunda seçilecek üç arabulucu ismi Kurula bildirilir. Bu şekilde seçimi yapılan arabulucular yerlerine atandıkları Kurul üyelerinin görev sürelerini tamamlarlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkrada belirtilen kuruluş ve teşkilatlanmanın tamamlanmasından itibaren üç ay içinde Kurul toplanır. Kurulun ilk toplantı tarihi, Kurul üyeleri bakımından üç yıllık görev süresinin başlangıcı olarak kabul edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen yönetmelikler, Kurulun ilk toplantısından itibaren üç ay içinde çıkarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddeyi ihdas eden Kanunla, bu Kanuna eklenen 18/B maddesinin dava şartı olarak arabuluculuğa ilişkin hükümleri, bu maddenin yürürlüğe girdiği tarih itibarıyla ilk derece mahkemeleri ve bölge adliye mahkemeleri ile Yargıtayda görülmekte olan davalar hakkında uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanunun;</template>
        <mvz-bent no="a">
          <template>28 ilâ 32 nci maddeleri ile geçici maddeleri yayımı tarihinde,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Diğer hükümleri ise yayımı tarihinden bir yıl sonra,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="38" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
