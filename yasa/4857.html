        <template>İş sözleşmesi ile çalışan ve bu Kanunun kapsamında olan veya olmayan her türlü işçinin ekonomik ve sosyal durumlarının düzenlenmesi için Çalışma ve Sosyal Güvenlik Bakanlığınca Asgari Ücret Tespit Komisyonu aracılığı ile ücretlerin asgari sınırları en geç iki yılda bir belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Komisyon kararları kesindir. Kararlar Resmi Gazetede yayımlanarak yürürlüğe girer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Komisyonun toplanma ve çalışma şekli, asgari ücretlerin tespiti sırasında uygulanacak esaslar ile başkan, üye ve raportörlere verilecek huzur hakları Maliye Bakanlığı ve Çalışma ve Sosyal Güvenlik Bakanlığının birlikte hazırlayacakları yönetmelikte belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Asgari Ücret Tespit Komisyonunun sekretarya hizmetleri, Çalışma ve Sosyal Güvenlik Bakanlığı tarafından yerine getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="40" başlık="Yarım ücret">
      <mvz-fıkra no="1">
        <template>24 ve 25 inci maddelerin (III) numaralı bentlerinde gösterilen zorlayıcı sebepler dolayısıyla çalışamayan veya çalıştırılmayan işçiye bu bekleme süresi içinde bir haftaya kadar her gün için yarım ücret ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="41" başlık="Fazla çalışma ücreti">
      <mvz-fıkra no="1">
        <template>Ülkenin genel yararları yahut işin niteliği veya üretimin artırılması gibi nedenlerle fazla çalışma yapılabilir. Fazla çalışma, Kanunda yazılı koşullar çerçevesinde, haftalık kırkbeş saati aşan çalışmalardır. 63 üncü madde hükmüne göre denkleştirme esasının uygulandığı hallerde, işçinin haftalık ortalama çalışma süresi, normal haftalık iş süresini aşmamak koşulu ile, bazı haftalarda toplam kırkbeş saati aşsa dahi bu çalışmalar fazla çalışma sayılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Her bir saat fazla çalışma için verilecek ücret normal çalışma ücretinin saat başına düşen miktarının yüzde elli yükseltilmesi suretiyle ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Haftalık çalışma süresinin sözleşmelerle kırkbeş saatin altında belirlendiği durumlarda yukarıda belirtilen esaslar dahilinde uygulanan ortalama haftalık çalışma süresini aşan ve kırkbeş saate kadar yapılan çalışmalar fazla sürelerle çalışmalardır. Fazla sürelerle çalışmalarda, her bir saat fazla çalışma için verilecek ücret normal çalışma ücretinin saat başına düşen miktarının yüzde yirmibeş yükseltilmesiyle ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Fazla çalışma veya fazla sürelerle çalışma yapan işçi isterse, bu çalışmalar karşılığı zamlı ücret yerine, fazla çalıştığı her saat karşılığında bir saat otuz dakikayı, fazla sürelerle çalıştığı her saat karşılığında bir saat onbeş dakikayı serbest zaman olarak kullanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşçi hak ettiği serbest zamanı altı ay zarfında, çalışma süreleri içinde ve ücretinde bir kesinti olmadan kullanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>63 üncü maddenin son fıkrasında yazılı sağlık nedenlerine dayanan kısa veya sınırlı süreli işlerde ve 69 uncu maddede belirtilen gece çalışmasında fazla çalışma yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Fazla saatlerle çalışmak için işçinin onayının alınması gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Fazla çalışma süresinin toplamı bir yılda ikiyüzyetmiş saatten fazla olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu Kanunun 42 nci ve 43 üncü maddelerinde sayılan hâller dışında yer altında maden işlerinde çalışan işçilere fazla çalışma yaptırılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Yer altında maden işlerinde çalışan işçilere, bu Kanunun 42 nci ve 43 üncü maddelerinde sayılan hâllerde haftalık otuz yedi buçuk saati aşan her bir saat fazla çalışma için verilecek ücret, normal çalışma ücretinin saat başına düşen miktarının yüzde yüzden az olmamak üzere arttırılması suretiyle ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Fazla çalışma ve fazla sürelerle çalışmaların ne şekilde uygulanacağı çıkarılacak yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Zorunlu nedenlerle fazla çalışma">
      <mvz-fıkra no="1">
        <template>Gerek bir arıza sırasında, gerek bir arızanın mümkün görülmesi halinde yahut makineler veya araç ve gereç için hemen yapılması gerekli acele işlerde, yahut zorlayıcı sebeplerin ortaya çıkmasında, işyerinin normal çalışmasını sağlayacak dereceyi aşmamak koşulu ile işçilerin hepsi veya bir kısmına fazla çalışma yaptırılabilir. Bu durumda fazla çalışma yapan işçilere uygun bir dinlenme süresi verilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şu kadar ki, zorunlu sebeplerle yapılan fazla çalışmalar için 41 inci maddenin birinci, ikinci ve üçüncü fıkraları hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="43" başlık="Olağanüstü hallerde fazla çalışma">
      <mvz-fıkra no="1">
        <template>Seferberlik sırasında ve bu süreyi aşmamak şartıyla yurt savunmasının gereklerini karşılayan işyerlerinde fazla çalışmaya lüzum görülürse işlerin çeşidine ve ihtiyacın derecesine göre Cumhurbaşkanı günlük çalışma süresini, işçinin en çok çalışma gücüne çıkarabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu suretle fazla çalıştırılan işçiler için verilecek ücret hakkında 41 inci maddenin birinci, ikinci ve üçüncü fıkraları hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="44" başlık="Ulusal bayram ve genel tatil günlerinde çalışma">
      <mvz-fıkra no="1">
        <template>Ulusal bayram ve genel tatil günlerinde işyerlerinde çalışılıp çalışılmayacağı toplu iş sözleşmesi veya iş sözleşmeleri ile kararlaştırılır. Sözleşmelerde hüküm bulunmaması halinde söz konusu günlerde çalışılması için işçinin onayı gereklidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu günlere ait ücretler 47 nci maddeye göre ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="45" başlık="Saklı haklar">
      <mvz-fıkra no="1">
        <template>Toplu iş sözleşmesi veya iş sözleşmelerine hafta tatili, ulusal bayram ve genel tatillerde işçilere tanınan haklara, ücretli izinlere ve yüzde usulü ile çalışan işçilerin bu Kanunla tanınan haklarına aykırı hükümler konulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu hususlarda işçilere daha elverişli hak ve menfaatler sağlayan kanun, toplu iş sözleşmesi, iş sözleşmesi veya gelenekten doğan kazanılmış haklar saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="46" başlık="Hafta tatili ücreti">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren işyerlerinde, işçilere tatil gününden önce 63 üncü maddeye göre belirlenen iş günlerinde çalışmış olmaları koşulu ile yedi günlük bir zaman dilimi içinde kesintisiz en az yirmidört saat dinlenme (hafta tatili) verilir. Ancak Kültür ve Turizm Bakanlığı tarafından turizm işletmesi belgesi verilen konaklama tesislerinde çalışan işçilerin bu fıkra kapsamında hak kazandığı hafta tatili, işçinin yazılı talebi veya onayı ile hak kazandığı günü takip eden dört gün içinde kullandırılabilir. Bu halde işçinin hak kazandığı hafta tatilinde yaptığı çalışmaların günlük normal çalışma süresi kadarlık kısmı fazla çalışmanın hesabında dikkate alınmaz. İşçi verdiği onayı otuz gün önceden işverene yazılı olarak bildirimde bulunmak kaydıyla geri alabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalışılmayan hafta tatili günü için işveren tarafından bir iş karşılığı olmaksızın o günün ücreti tam olarak ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Şu kadar ki;</template>
        <mvz-bent no="a">
          <template>Çalışmadığı halde kanunen çalışma süresinden sayılan zamanlar ile günlük ücret ödenen veya ödenmeyen kanundan veya sözleşmeden doğan tatil günleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ek 2 nci maddede sayılan izin süreleri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bir haftalık süre içinde kalmak üzere işveren tarafından verilen diğer izinlerle hekim raporuyla verilen hastalık ve dinlenme izinleri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Çalışılmış günler gibi hesaba katılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Zorlayıcı ve ekonomik bir sebep olmadan işyerindeki çalışmanın haftanın bir veya birkaç gününde işveren tarafından tatil edilmesi halinde haftanın çalışılmayan günleri ücretli hafta tatiline hak kazanmak için çalışılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bir işyerinde işin bir haftadan fazla bir süre ile tatil edilmesini gerektiren zorlayıcı sebepler ortaya çıktığı zaman, 24 ve 25 inci maddelerin (III) numaralı bentlerinde gösterilen zorlayıcı sebeplerden ötürü çalışılmayan günler için işçilere ödenen yarım ücret hafta tatili günü için de ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yüzde usulünün uygulandığı işyerlerinde hafta tatili ücreti işverence işçiye ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="47" başlık="Genel tatil ücreti">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına giren işyerlerinde çalışan işçilere, kanunlarda ulusal bayram ve genel tatil günü olarak kabul edilen günlerde çalışmazlarsa, bir iş karşılığı olmaksızın o günün ücretleri tam olarak, tatil yapmayarak çalışırlarsa ayrıca çalışılan her gün için bir günlük ücreti ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yüzde usulünün uygulandığı işyerlerinde işçilerin ulusal bayram ve genel tatil ücretleri işverence işçiye ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="48" başlık="Geçici iş göremezlik">
      <mvz-fıkra no="1">
        <template>İşçilere geçici iş göremezlik ödeneği verilmesi gerektiği zamanlarda geçici iş göremezlik süresine rastlayan ulusal bayram, genel tatil ve hafta tatilleri, ödeme yapılan kurum veya sandıklar tarafından geçici iş göremezlik ölçüsü üzerinden ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hastalık nedeni ile çalışılmayan günlerde Sosyal Sigortalar Kurumu tarafından ödenen geçici iş göremezlik ödeneği aylık ücretli işçilerin ücretlerinden mahsup edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="49" başlık="Ücret şekillerine göre tatil ücreti">
      <mvz-fıkra no="1">
        <template>İşçinin tatil günü ücreti çalıştığı günlere göre bir güne düşen ücretidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Parça başına, akort, götürü veya yüzde usulü ile çalışan işçilerin tatil günü ücreti, ödeme döneminde kazandığı ücretin aynı süre içinde çalıştığı günlere bölünmesi suretiyle hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Saat ücreti ile çalışan işçilerin tatil günü ücreti saat ücretinin yedibuçuk katıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hasta, izinli veya sair sebeplerle mazeretli olduğu hallerde dahi aylığı tam olarak ödenen aylık ücretli işçilere 46, 47 ve 48 inci maddenin birinci fıkrası hükümleri uygulanmaz. Ancak bunlardan ulusal bayram ve genel tatil günlerinde çalışanlara ayrıca çalıştığı her gün için bir günlük ücreti ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="50" başlık="Tatil ücretine girmeyen kısımlar">
      <mvz-fıkra no="1">
        <template>Fazla çalışma karşılığı olarak alınan ücretler, primler, işyerinin temelli işçisi olarak normal çalışma saatleri dışında hazırlama, tamamlama, temizleme işlerinde çalışan işçilerin bu işler için aldıkları ücretler ve sosyal yardımlar, ulusal bayram, hafta tatili ve genel tatil günleri için verilen ücretlerin tespitinde hesaba katılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="51" başlık="Yüzdelerin ödenmesi">
      <mvz-fıkra no="1">
        <template>Otel, lokanta, eğlence yerleri ve benzeri yerler ile içki verilen ve hemen orada yenilip içilmesi için çeşitli yiyecek satan yerlerden "yüzde" usulünün uygulandığı müesseselerde işveren tarafından servis karşılığı veya başka isimlerle müşterilerin hesap pusulalarına "yüzde" eklenerek veya ayrı şekillerde alınan paralarla kendi isteği ile müşteri tarafından işverene bırakılan yahut da onun kontrolü altında bir araya toplanan paraları işveren işyerinde çalışan tüm işçilere eksiksiz olarak ödemek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren veya işveren vekili yukarıdaki fıkrada sözü edilen paraların kendisi tarafından alındığında eksiksiz olarak işçilere dağıtıldığını belgelemekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yüzdelerden toplanan paraların o işyerinde çalışan işçiler arasında yapılan işlerin niteliğine göre, hangi esaslar ve oranlar çerçevesinde dağıtılacağı Çalışma ve Sosyal Güvenlik Bakanlığınca hazırlanacak bir yönetmelikle gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="52" başlık="Yüzdelerin belgelenmesi">
      <mvz-fıkra no="1">
        <template>Yüzde usulünün uygulandığı işyerlerinde işveren, her hesap pusulasının genel toplamını gösteren bir belgeyi işçilerin kendi aralarından seçecekleri bir temsilciye vermekle yükümlüdür. Bu belgelerin şekli ve uygulama usulleri iş sözleşmelerinde veya toplu iş sözleşmelerinde gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="53" başlık="Yıllık ücretli izin hakkı ve izin süreleri">
      <mvz-fıkra no="1">
        <template>İşyerinde işe başladığı günden itibaren, deneme süresi de içinde olmak üzere, en az bir yıl çalışmış olan işçilere yıllık ücretli izin verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yıllık ücretli izin hakkından vazgeçilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Niteliklerinden ötürü bir yıldan az süren mevsimlik veya kampanya işlerinde çalışanlara bu Kanunun yıllık ücretli izinlere ilişkin hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşçilere verilecek yıllık ücretli izin süresi, hizmet süresi;</template>
        <mvz-bent no="a">
          <template>Bir yıldan beş yıla kadar (beş yıl dahil) olanlara ondört günden,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Beş yıldan fazla onbeş yıldan az olanlara yirmi günden,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Onbeş yıl (dahil) ve daha fazla olanlara yirmialtı günden,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Az olamaz.  Yer altı işlerinde çalışan işçilerin yıllık ücretli izin süreleri dörder gün arttırılarak uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ancak onsekiz ve daha küçük yaştaki işçilerle elli ve daha yukarı yaştaki işçilere verilecek yıllık ücretli izin süresi yirmi günden az olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yıllık izin süreleri iş sözleşmeleri ve toplu iş sözleşmeleri ile artırılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="54" başlık="Yıllık ücretli izne hak kazanma ve izni kullanma dönemi">
      <mvz-fıkra no="1">
        <template>Yıllık ücretli izine hak kazanmak için gerekli sürenin hesabında işçilerin, aynı işverenin bir veya çeşitli işyerlerinde çalıştıkları süreler birleştirilerek göz önüne alınır. Şu kadar ki, bir işverenin bu Kanun kapsamına giren işyerinde çalışmakta olan işçilerin aynı işverenin işyerlerinde bu Kanun kapsamına girmeksizin geçirmiş bulundukları süreler de hesaba katılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir yıllık süre içinde 55 inci maddede sayılan haller dışındaki sebeplerle işçinin devamının kesilmesi halinde bu boşlukları karşılayacak kadar hizmet süresi eklenir ve bu suretle işçinin izin hakkını elde etmesi için gereken bir yıllık hizmet süresinin bitiş tarihi gelecek hizmet yılına aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşçinin gelecek izin hakları için geçmesi gereken bir yıllık hizmet süresi, bir önceki izin hakkının doğduğu günden başlayarak gelecek hizmet yılına doğru ve yukarıdaki fıkra ve 55 inci madde hükümleri gereğince hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşçi yukarıdaki fıkralar ve 55 inci madde hükümlerine göre hesaplanacak her hizmet yılına karşılık, yıllık iznini gelecek hizmet yılı içinde kullanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Aynı bakanlığa bağlı işyerleri ile aynı bakanlığa bağlı tüzel kişilerin işyerlerinde geçen süreler ve kamu iktisadi teşebbüsleri yahut özel kanuna veya Cumhurbaşkanlığı kararnamesine dayanılarak kurulan banka ve kuruluşlar veya bunlara bağlı işyerlerinde geçen süreler, işçinin yıllık ücretli izin hakkının hesaplanmasında göz önünde bulundurulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="55" başlık="Yıllık izin bakımından çalışılmış gibi sayılan haller">
      <mvz-fıkra no="1">
        <template>Aşağıdaki süreler yıllık ücretli izin hakkının hesabında çalışılmış gibi sayılır:</template>
        <mvz-bent no="a">
          <template>İşçinin uğradığı kaza veya tutulduğu hastalıktan ötürü işine gidemediği günler (Ancak, 25 inci maddenin (I) numaralı bendinin (b) alt bendinde öngörülen süreden fazlası sayılmaz).</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kadın işçilerin 74 üncü madde gereğince doğumdan önce ve sonra çalıştırılmadıkları günler.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İşçinin muvazzaf askerlik hizmeti dışında manevra veya herhangi bir kanundan dolayı ödevlendirilmesi sırasında işine gidemediği günler (Bu sürenin yılda 90 günden fazlası sayılmaz).</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Çalışmakta olduğu işyerinde zorlayıcı sebepler yüzünden işin aralıksız bir haftadan çok tatil edilmesi sonucu olarak işçinin çalışmadan geçirdiği zamanın onbeş günü (işçinin yeniden işe başlaması şartıyla).</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>66 ncı maddede sözü geçen zamanlar.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Hafta tatili, ulusal bayram, genel tatil günleri.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>3153 sayılı Kanuna dayanılarak çıkarılan yönetmeliğe göre röntgen muayenehanelerinde çalışanlara pazardan başka verilmesi gereken yarım günlük izinler.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>İşçilerin arabuluculuk toplantılarına katılmaları, hakem kurullarında bulunmaları, bu kurullarda işçi temsilciliği görevlerini yapmaları, çalışma hayatı ile ilgili mevzuata göre kurulan meclis, kurul, komisyon ve toplantılara yahut işçilik konuları ile ilgili uluslararası kuruluşların konferans, kongre veya kurullarına işçi veya sendika temsilcisi olarak katılması sebebiyle işlerine devam edemedikleri günler.</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Ek 2 nci maddede sayılan izin süreleri,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>İşveren tarafından verilen diğer izinler ile 65 inci maddedeki kısa çalışma süreleri.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Bu Kanunun uygulanması sonucu olarak işçiye verilmiş bulunan yıllık ücretli izin süresi.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="56" başlık="Yıllık ücretli iznin uygulanması">
      <mvz-fıkra no="1">
        <template>Yıllık ücretli izin işveren tarafından bölünemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu iznin 53 üncü maddede gösterilen süreler içinde işveren tarafından sürekli bir şekilde verilmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ancak, 53 üncü maddede öngörülen izin süreleri, tarafların anlaşması ile bir bölümü on günden aşağı olmamak üzere bölümler hâlinde kullanılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşveren tarafından yıl içinde verilmiş bulunan diğer ücretli ve ücretsiz izinler veya dinlenme ve hastalık izinleri yıllık izne mahsup edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yıllık ücretli izin günlerinin hesabında izin süresine rastlayan ulusal bayram, hafta tatili ve genel tatil günleri izin süresinden sayılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yıllık ücretli izinleri işyerinin kurulu bulunduğu yerden başka bir yerde geçirecek olanlara istemde bulunmaları ve bu hususu belgelemeleri koşulu ile gidiş ve dönüşlerinde yolda geçecek süreleri karşılamak üzere işveren toplam dört güne kadar ücretsiz izin vermek zorundadır. İşveren, işyerinde çalışan işçilerin yıllık ücretli izinlerini gösterir izin kayıt belgesi tutmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Alt işveren işçilerinden, alt işvereni değiştiği hâlde aynı işyerinde çalışmaya devam edenlerin yıllık ücretli izin süresi, aynı işyerinde çalıştıkları süreler dikkate alınarak hesaplanır. Asıl işveren, alt işveren tarafından çalıştırılan işçilerin hak kazandıkları yıllık ücretli izin sürelerinin kullanılıp kullanılmadığını kontrol etmek ve ilgili yıl içinde kullanılmasını sağlamakla, alt işveren ise altıncı fıkraya göre tutmak zorunda olduğu izin kayıt belgesinin bir örneğini asıl işverene vermekle yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="57" başlık="Yıllık izin ücreti">
      <mvz-fıkra no="1">
        <template>İşveren, yıllık ücretli iznini kullanan her işçiye, yıllık izin dönemine ilişkin ücretini ilgili işçinin izine başlamasından önce peşin olarak ödemek veya avans olarak vermek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu ücretin hesabında 50 nci madde hükmü uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Günlük, haftalık veya aylık olarak belirli bir ücrete dayanmayıp da akort, komisyon ücreti, kâra katılma ve yüzde usulü ücret gibi belirli olmayan süre ve tutar üzerinden ücret alan işçinin izin süresi için verilecek ücret, son bir yıllık süre içinde kazandığı ücretin fiili olarak çalıştığı günlere bölünmesi suretiyle bulunacak ortalama üzerinden hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ancak, son bir yıl içinde işçi ücretine zam yapıldığı takdirde, izin ücreti işçinin izine çıktığı ayın başı ile zammın yapıldığı tarih arasında alınan ücretin aynı süre içinde çalışılan günlere bölünmesi suretiyle hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yüzde usulünün uygulandığı yerlerde bu ücret, yüzdelerden toplanan para dışında işveren tarafından ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yıllık ücretli izin süresine rastlayan hafta tatili, ulusal bayram ve genel tatil ücretleri ayrıca ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="58" başlık="İzinde çalışma yasağı">
      <mvz-fıkra no="1">
        <template>Yıllık ücretli iznini kullanmakta olan işçinin izin süresi içinde ücret karşılığı bir işte çalıştığı anlaşılırsa, bu izin süresi içinde kendisine ödenen ücret işveren tarafından geri alınabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="59" başlık="Sözleşmenin sona ermesinde izin ücreti">
      <mvz-fıkra no="1">
        <template>İş sözleşmesinin, herhangi bir nedenle sona ermesi halinde işçinin hak kazanıp da kullanmadığı yıllık izin sürelerine ait ücreti, sözleşmenin sona erdiği tarihteki ücreti üzerinden kendisine veya hak sahiplerine ödenir. Bu ücrete ilişkin zamanaşımı iş sözleşmesinin sona erdiği tarihten itibaren başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren tarafından iş sözleşmesinin feshedilmesi halinde 17 nci maddede belirtilen bildirim süresiyle, 27 nci madde gereğince işçiye verilmesi zorunlu yeni iş arama izinleri yıllık ücretli izin süreleri ile iç içe giremez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="60" başlık="İzinlere ilişkin düzenlemeler">
      <mvz-fıkra no="1">
        <template>Yıllık ücretli izinlerin, yürütülen işlerin niteliğine göre yıl boyunca hangi dönemlerde kullanılacağı, izinlerin ne suretle ve kimler tarafından verileceği veya sıraya bağlı tutulacağı, yıllık izninin faydalı olması için işveren tarafından alınması gereken tedbirler ve izinlerin kullanılması konusuna ilişkin usuller ve işverence tutulması zorunlu kayıtların şekli Çalışma ve Sosyal Güvenlik Bakanlığı tarafından hazırlanacak bir yönetmelikle gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="61" başlık="Sigorta primleri">
      <mvz-fıkra no="1">
        <template>Sigortalılara yıllık ücretli izin süresi için ödenecek ücretler üzerinden iş kazaları ile meslek hastalıkları primleri hariç, diğer sigorta primlerinin, 506 sayılı Sosyal Sigortalar Kanunundaki esaslar çerçevesinde işçi ve işverenler yönünden ödenmesine devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="62" başlık="Ücretten indirim yapılamayacak haller">
      <mvz-fıkra no="1">
        <template>Her türlü işte uygulanmakta olan çalışma sürelerinin yasal olarak daha aşağı sınırlara indirilmesi veya işverene düşen yasal bir yükümlülüğün yerine getirilmesi nedeniyle ya da bu Kanun hükümlerinden herhangi birinin uygulanması sonucuna dayanılarak işçi ücretlerinden her ne şekilde olursa olsun eksiltme yapılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="İşin Düzenlenmesi">
    <mvz-madde no="63" başlık="Çalışma süresi">
      <mvz-fıkra no="1">
        <template>Genel bakımdan çalışma süresi haftada en çok kırkbeş saattir. Aksi kararlaştırılmamışsa bu süre, işyerlerinde haftanın çalışılan günlerine eşit ölçüde bölünerek uygulanır.  Yer altı maden işlerinde çalışan işçilerin çalışma süresi; günde en çok yedi buçuk, haftada en çok otuz yedi buçuk saattir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tarafların anlaşması ile haftalık normal çalışma süresi, işyerlerinde haftanın çalışılan günlerine, günde onbir saati aşmamak koşulu ile farklı şekilde dağıtılabilir. Bu halde, iki aylık süre içinde işçinin haftalık ortalama çalışma süresi, normal haftalık çalışma süresini aşamaz. Denkleştirme süresi toplu iş sözleşmeleri ile dört aya kadar artırılabilir.  Turizm sektöründe dört aylık süre içinde işçinin haftalık ortalama çalışma süresi, normal haftalık çalışma süresini aşamaz; denkleştirme süresi toplu iş sözleşmeleri ile altı aya kadar artırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çalışma sürelerinin yukarıdaki esaslar çerçevesinde uygulama şekilleri, Çalışma ve Sosyal Güvenlik Bakanlığı tarafından hazırlanacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="64" başlık="Telafi çalışması">
      <mvz-fıkra no="1">
        <template>Zorunlu nedenlerle işin durması, ulusal bayram ve genel tatillerden önce veya sonra işyerinin tatil edilmesi veya benzer nedenlerle işyerinde normal çalışma sürelerinin önemli ölçüde altında çalışılması veya tamamen tatil edilmesi ya da işçinin talebi ile kendisine izin verilmesi hallerinde, işveren dört ay içinde çalışılmayan süreler için telafi çalışması yaptırabilir.  Cumhurbaşkanı bu süreyi iki katına kadar artırmaya yetkilidir. Bu çalışmalar fazla çalışma veya fazla sürelerle çalışma sayılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Telafi çalışmaları, günlük en çok çalışma süresini aşmamak koşulu ile günde üç saatten fazla olamaz. Tatil günlerinde telafi çalışması yaptırılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="65" başlık="Kısa çalışma ve kısa çalışma ödeneği">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="66" başlık="Çalışma süresinden sayılan haller">
      <mvz-fıkra no="1">
        <template>Aşağıdaki süreler işçinin günlük çalışma sürelerinden sayılır:</template>
        <mvz-bent no="a">
          <template>Madenlerde, taşocaklarında yahut her ne şekilde olursa olsun yeraltında veya su altında çalışılacak işlerde işçilerin kuyulara, dehlizlere veya asıl çalışma yerlerine inmeleri veya girmeleri ve bu yerlerden çıkmaları için gereken süreler.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İşçilerin işveren tarafından işyerlerinden başka bir yerde çalıştırılmak üzere gönderilmeleri halinde yolda geçen süreler.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İşçinin işinde ve her an iş görmeye hazır bir halde bulunmakla beraber çalıştırılmaksızın ve çıkacak işi bekleyerek boş geçirdiği süreler.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İşçinin işveren tarafından başka bir yere gönderilmesi veya işveren evinde veya bürosunda yahut işverenle ilgili herhangi bir yerde meşgul edilmesi suretiyle asıl işini yapmaksızın geçirdiği süreler.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Çocuk emziren kadın işçilerin çocuklarına süt vermeleri için belirtilecek süreler.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Demiryolları, karayolları ve köprülerin yapılması, korunması ya da onarım ve tadili gibi, işçilerin yerleşim yerlerinden uzak bir mesafede bulunan işyerlerine hep birlikte getirilip götürülmeleri gereken her türlü işlerde bunların toplu ve düzenli bir şekilde götürülüp getirilmeleri esnasında geçen süreler.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşin niteliğinden doğmayıp da işveren tarafından sırf sosyal yardım amacıyla işyerine götürülüp getirilme esnasında araçlarda geçen süre çalışma süresinden sayılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="67" başlık="Günlük çalışmanın başlama ve bitiş saatleri">
      <mvz-fıkra no="1">
        <template>Günlük çalışmanın başlama ve bitiş saatleri ile dinlenme saatleri işyerlerinde işçilere duyurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşin niteliğine göre işin başlama ve bitiş saatleri işçiler için farklı şekilde düzenlenebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="68" başlık="Ara dinlenmesi">
      <mvz-fıkra no="1">
        <template>Günlük çalışma süresinin ortalama bir zamanında o yerin gelenekleri ve işin gereğine göre ayarlanmak suretiyle işçilere;</template>
        <mvz-bent no="a">
          <template>Dört saat veya daha kısa süreli işlerde onbeş dakika,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Dört saatten fazla ve yedibuçuk saate kadar  süreli işlerde yarım saat,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yedibuçuk saatten fazla süreli işlerde bir saat,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ara dinlenmesi verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu dinlenme süreleri en az olup aralıksız verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ancak bu süreler, iklim, mevsim, o yerdeki gelenekler ve işin niteliği göz önünde tutularak sözleşmeler ile aralı olarak kullandırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Dinlenmeler bir işyerinde işçilere aynı veya değişik saatlerde kullandırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ara dinlenmeleri çalışma süresinden sayılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="69" başlık="Gece süresi ve gece çalışmaları">
      <mvz-fıkra no="1">
        <template>Çalışma hayatında "gece" en geç saat 20.00'de başlayarak en erken saat 06.00'ya kadar geçen ve her halde en fazla onbir saat süren dönemdir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bazı işlerin niteliğine ve gereğine göre yahut yurdun bazı bölgelerinin özellikleri bakımından, çalışma hayatına ilişkin "gece" başlangıcının daha geriye alınması veya yaz ve kış saatlerinin ayarlanması, yahut gün döneminin başlama ve bitme saatlerinin belirtilmesi suretiyle birinci fıkradaki hükmün uygulama şekillerini tespit etmek yahut bazı gece çalışmalarına herhangi bir oranda fazla ücret ödenmesi usulünü koymak veyahut gece işletilmelerinde ekonomik bir zorunluluk bulunmayan işyerlerinde işçilerin gece çalışmalarını yasak etmek üzere yönetmelikler çıkartılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşçilerin gece çalışmaları yedibuçuk saati geçemez.  Ancak, turizm, özel güvenlik, sağlık hizmeti ve 30/5/2013 tarihli ve 6491 sayılı Türk Petrol Kanunu uyarınca petrol araştırma, arama ve sondaj faaliyetleri kapsamında yürütülen işlerde işçinin yazılı onayının alınması şartıyla yedi buçuk saatin üzerinde gece çalışması yaptırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Gece ve gündüz işletilen ve nöbetleşe işçi postaları kullanılan işlerde, bir çalışma haftası gece çalıştırılan işçilerin, ondan sonra gelen ikinci çalışma haftası gündüz çalıştırılmaları suretiyle postalar sıraya konur. Gece ve gündüz postalarında iki haftalık nöbetleşme esası da uygulanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Postası değiştirilecek işçi kesintisiz en az onbir saat dinlendirilmeden diğer postada çalıştırılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="70" başlık="Hazırlama, tamamlama ve temizleme işleri">
      <mvz-fıkra no="1">
        <template>Genel olarak bir işyerinde belirli çalışma saatlerinden önce veya sonra gerekli olan hazırlama veya tamamlama yahut temizleme işlerinde çalışan işçiler için işin düzenlenmesi ile ilgili hükümlerden hangilerinin uygulanmayacağı yahut ne gibi değişik şartlar ve usullerle uygulanacağı Çalışma ve Sosyal Güvenlik Bakanlığı tarafından hazırlanacak bir yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="71" başlık="Çalıştırma yaşı ve çocukları çalıştırma yasağı">
      <mvz-fıkra no="1">
        <template>On beş yaşını doldurmamış çocukların çalıştırılması yasaktır. Ancak, on dört yaşını doldurmuş ve zorunlu ilköğretim çağını tamamlamış olan çocuklar; bedensel, zihinsel, sosyal ve ahlaki gelişmelerine ve eğitime devam edenlerin okullarına devamına engel olmayacak hafif işlerde çalıştırılabilirler. On dört yaşını doldurmamış çocuklar ise bedensel, zihinsel, sosyal ve ahlaki gelişmelerine ve eğitime devam edenlerin okullarına devamına engel olmayacak sanat, kültür ve reklam faaliyetlerinde yazılı sözleşme yapmak ve her bir faaliyet için ayrı izin almak şartıyla çalıştırılabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çocuk ve genç işçilerin işe yerleştirilmelerinde ve çalıştırılabilecekleri işlerde güvenlik, sağlık, bedensel, zihinsel ve psikolojik gelişmeleri, kişisel yatkınlık ve yetenekleri dikkate alınır. Çocuğun gördüğü iş onun okula gitmesine, mesleki eğitiminin devamına engel olamaz, onun derslerini düzenli bir şekilde izlemesine zarar veremez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Onsekiz yaşını doldurmamış çocuk ve genç işçiler bakımından yasak olan işler ile onbeş yaşını tamamlamış, ancak onsekiz yaşını tamamlamamış genç işçilerin çalışmasına izin verilecek işler, on dört yaşını doldurmuş ve zorunlu ilköğretim çağını tamamlamış çocukların çalıştırılabilecekleri hafif işler, onaltı yaşını doldurmuş fakat onsekiz yaşını bitirmemiş genç işçilerin hangi çeşit işlerde çalıştırılabilecekleri ve çalışma koşulları Çalışma ve Sosyal Güvenlik Bakanlığı tarafından altı ay içinde çıkarılacak bir yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Zorunlu ilköğretim çağını tamamlamış ve örgün eğitime devam etmeyen çocukların çalışma saatleri günde yedi ve haftada otuz beş saatten; sanat, kültür ve reklam faaliyetlerinde çalışanların ise günde beş ve haftada otuz saatten fazla olamaz. Bu süre, on beş yaşını tamamlamış çocuklar için günde sekiz ve haftada kırk saate kadar artırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Okul öncesi çocuklar ile okula devam eden çocukların eğitim dönemindeki çalışma süreleri, eğitim saatleri dışında olmak üzere, en fazla günde iki saat ve haftada on saat olabilir. Okulun kapalı olduğu dönemlerde çalışma süreleri yukarıda dördüncü fıkrada öngörülen süreleri aşamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Sanat, kültür ve reklam faaliyetlerinin kapsamı, bu faaliyetlerde çalışacak çocuklara çalışma izni verilmesi, yaş grupları ve faaliyet türlerine göre çalışma ve dinlenme süreleri ile çalışma ortamı ve şartları, ücretin ödenmesine ilişkin usul ve esaslar ile diğer hususlar Aile ve Sosyal Politikalar Bakanlığı, Kültür ve Turizm Bakanlığı, Sağlık Bakanlığı, Millî Eğitim Bakanlığı ile Radyo ve Televizyon Üst Kurulunun görüşleri alınarak Çalışma ve Sosyal Güvenlik Bakanlığı tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="72" başlık="Yer ve su altında çalıştırma yasağı">
      <mvz-fıkra no="1">
        <template>Maden ocakları ile kablo döşemesi, kanalizasyon ve tünel inşaatı gibi yer altında veya su altında çalışılacak işlerde onsekiz yaşını doldurmamış erkek ve her yaştaki kadınların çalıştırılması yasaktır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="73" başlık="Gece çalıştırma yasağı">
      <mvz-fıkra no="1">
        <template>Sanayie ait işlerde onsekiz yaşını doldurmamış çocuk ve genç işçilerin gece çalıştırılması yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Onsekiz yaşını doldurmuş kadın işçilerin gece postalarında çalıştırılmasına ilişkin usul ve esaslar Sağlık Bakanlığının görüşü alınarak Çalışma ve Sosyal Güvenlik Bakanlığınca hazırlanacak bir yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="74" başlık="Analık halinde çalışma ve süt izni">
      <mvz-fıkra no="1">
        <template>Kadın işçilerin doğumdan önce sekiz ve doğumdan sonra sekiz hafta olmak üzere toplam onaltı haftalık süre için çalıştırılmamaları esastır. Çoğul gebelik halinde doğumdan önce çalıştırılmayacak sekiz haftalık süreye iki hafta süre eklenir. Ancak, sağlık durumu uygun olduğu takdirde, doktorun onayı ile kadın işçi isterse doğumdan önceki üç haftaya kadar işyerinde çalışabilir. Bu durumda, kadın işçinin çalıştığı süreler doğum sonrası sürelere eklenir.  Kadın işçinin erken doğum yapması halinde ise doğumdan önce kullanamadığı çalıştırılmayacak süreler, doğum sonrası sürelere eklenmek suretiyle kullandırılır.  Doğumda veya doğum sonrasında annenin ölümü hâlinde, doğum sonrası kullanılamayan süreler babaya kullandırılır. Üç yaşını doldurmamış çocuğu evlat edinen eşlerden birine veya evlat edinene çocuğun aileye fiilen teslim edildiği tarihten itibaren sekiz hafta analık hâli izni kullandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra uyarınca kullanılan doğum sonrası analık hâli izninin bitiminden itibaren çocuğunun bakımı ve yetiştirilmesi amacıyla ve çocuğun hayatta olması kaydıyla kadın işçi ile üç yaşını doldurmamış çocuğu evlat edinen kadın veya erkek işçilere istekleri hâlinde birinci doğumda altmış gün, ikinci doğumda yüz yirmi gün, sonraki doğumlarda ise yüz seksen gün süreyle haftalık çalışma süresinin yarısı kadar ücretsiz izin verilir. Çoğul doğum hâlinde bu sürelere otuzar gün eklenir. Çocuğun engelli doğması hâlinde bu süre üç yüz altmış gün olarak uygulanır. Bu fıkra hükümlerinden yararlanılan süre içerisinde süt iznine ilişkin hükümler uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıda öngörülen süreler işçinin sağlık durumuna ve işin özelliğine göre doğumdan önce ve sonra gerekirse artırılabilir. Bu süreler hekim raporu ile belirtilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hamilelik süresince kadın işçiye periyodik kontroller için ücretli izin verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Hekim raporu ile gerekli görüldüğü takdirde, hamile kadın işçi sağlığına uygun daha hafif işlerde çalıştırılır. Bu halde işçinin ücretinde bir indirim yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İsteği halinde kadın işçiye, onaltı haftalık sürenin tamamlanmasından veya çoğul gebelik halinde onsekiz haftalık süreden sonra altı aya kadar ücretsiz izin verilir.  Bu izin, üç yaşını doldurmamış çocuğu evlat edinme hâlinde eşlerden birine veya evlat edinene verilir. Bu süre, yıllık ücretli izin hakkının hesabında dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kadın işçilere bir yaşından küçük çocuklarını emzirmeleri için günde toplam birbuçuk saat süt izni verilir. Bu sürenin hangi saatler arasında ve kaça bölünerek kulllanılacağını işçi kendisi belirler. Bu süre günlük çalışma süresinden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu madde hükümleri iş sözleşmesi ile çalışan ve bu Kanunun kapsamında olan veya olmayan her türlü işçi için uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="75" başlık="İşçi özlük dosyası">
      <mvz-fıkra no="1">
        <template>İşveren çalıştırdığı her işçi için bir özlük dosyası düzenler. İşveren bu dosyada, işçinin kimlik bilgilerinin yanında, bu Kanun ve diğer kanunlar uyarınca düzenlemek zorunda olduğu her türlü belge ve kayıtları saklamak ve bunları istendiği zaman yetkili memur ve mercilere göstermek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren, işçi hakkında edindiği bilgileri dürüstlük kuralları ve hukuka uygun olarak kullanmak ve gizli kalmasında işçinin haklı çıkarı bulunan bilgileri açıklamamakla yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="76" başlık="Yönetmelikler">
      <mvz-fıkra no="1">
        <template>Nitelikleri gereği günlük ve haftalık çalışma sürelerinin 63 üncü maddede öngörüldüğü şekilde uygulanması mümkün olmayan iş ve işyerlerinde çalışma sürelerinin günlük yasal çalışma süresini aşmayacak şekilde ve en çok altı aya kadar denkleştirme süresi tanınarak uygulanmasını sağlayacak usuller Çalışma ve Sosyal Güvenlik Bakanlığınca hazırlanacak yönetmeliklerle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">

  <mvz-bölüm no="7-YEDİNCİ" başlık="Çalışma Hayatının Denetimi ve Teftişi">
    <mvz-madde no="91" başlık="Devletin yetkisi">
      <mvz-fıkra no="1">
        <template>Devlet, çalışma hayatı ile ilgili mevzuatın uygulanmasını izler, denetler ve teftiş eder. Bu ödev Çalışma ve Sosyal Güvenlik Bakanlığına bağlı ihtiyaca yetecek sayı ve özellikte teftiş ve denetlemeye yetkili iş müfettişlerince yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşçilerin kanundan, iş ve toplu iş sözleşmesinden doğan bireysel alacaklarına ilişkin başvuruları üzerine, iş sözleşmesinin devam etmesi kaydıyla birinci fıkra hükmü uyarınca işlem yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Askeri işyerleriyle yurt güvenliği için gerekli maddeler üretilen işyerlerinin denetim ve teftişi konusu ve sonuçlarına ait işlemler Milli Savunma Bakanlığı ile Çalışma ve Sosyal Güvenlik Bakanlığınca birlikte hazırlanacak yönetmeliğe göre yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="92" başlık="Yetkili makam ve memurlar">
      <mvz-fıkra no="1">
        <template>91 inci madde hükmünün uygulanması için iş hayatının izlenmesi, denetlenmesi ve teftişiyle ödevli olan iş müfettişleri, işyerlerini ve eklentilerini, işin yürütülmesi tarzını ve ilgili belgeleri, araç ve gereçleri, cihaz ve makineleri, ham ve işlenmiş maddelerle, iş için gerekli olan malzemeyi 93 üncü maddede yazılı esaslara uyarak gerektiği zamanlarda ve işçilerin yaşamına, sağlığına, güvenliğine, eğitimine, dinlenmesine veya oturup yatmasına ilişkin tesis ve tertipleri her zaman görmek, araştırmak ve incelemek ve bu Kanunla suç sayılan eylemlere rastladığı zaman bu hususta Cumhurbaşkanınca çıkarılan yönetmelikte açıklanan şekillerde bu halleri önlemek yetkisine sahiptirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">

      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çalışma hayatını izleme, denetleme ve teftişe yetkili iş müfettişleri 26 tarafından tutulan tutanaklar aksi kanıtlanıncaya kadar geçerlidir. İş müfettişleri tarafından düzenlenen raporların ve tutulan tutanakların işçi alacaklarına ilişkin kısımlarına karşı taraflarca otuz gün içerisinde yetkili iş mahkemesine itiraz edilebilir. İş mahkemesinin kararına karşı taraflarca 5521 sayılı Kanunun 8 inci maddesine göre kanun yoluna başvurulabilir. Kanun yoluna başvurulması iş mahkemesince hüküm altına alınan işçi alacağının tahsiline engel teşkil etmez.</template>

      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İş müfettişlerinin bu Kanundan veya diğer kanunlardan doğan her çeşit teftiş, denetleme yetki ve görevleri gereğince görevlerinin yerine getirilmesi sırasında, görevlerini yapma ve sonuçlandırmaya engel olan kimselere, fiil suç oluşturmadığı takdirde, sekizbin Türk Lirası idarî para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İdari para cezalarının uygulanmasına ilişkin hususlar</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="108" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen idari para cezaları, gerekçesi belirtilmek suretiyle Çalışma ve İş Kurumu il müdürünce verilir. 101 inci ve 106 ncı maddeler uyarınca birden fazla ilde işyeri bulunan işverenlere uygulanacak idari para cezaları işyerlerinin merkezinin bulunduğu yerdeki Çalışma ve İş Kurumu il müdürünce verilir. 101 inci ve 106 ncı maddelere göre verilen idari para cezaları genel hükümlere göre tahsil edilir. 106 ncı maddeye göre verilecek idari para cezası için 25/6/2003 tarihli ve 4904 sayılı Türkiye İş Kurumu ile İlgili Bazı Düzenlemeler Hakkında Kanunun 20 nci maddesindeki tutarlar esas alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="9-DOKUZUNCU" başlık="Çeşitli, Geçici ve Son Hükümler">
    <mvz-madde no="109" başlık="Yazılı veya elektronik bildirim">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen bildirimlerin ilgiliye yazılı olarak ve imza karşılığında veya işçinin yazılı kabulü şartıyla elektronik iletilerin, gönderimi ve teslimatı da dâhil olmak üzere kullanımına ilişkin olarak hukuki delil sağlayan, elektronik postanın nitelikli şekli olan kayıtlı elektronik posta (KEP) hesabı üzerinden gönderilmek suretiyle yapılması gerekir. İş sözleşmesinin feshi sonucunu doğuracak bildirimler her hâlde yazılı yapılır. Yazılı bildirim yapılan kişi bunu imzalamazsa, durum o yerde tutanakla tespit edilir. Ancak, 11/2/1959 tarihli ve 7201 sayılı Tebligat Kanunu kapsamına giren tebligat anılan Kanun hükümlerine göre yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>KEP sisteminin kullanılmasına ilişkin maliyetler işveren tarafından karşılanır. Bu maddede belirtilen elektronik bildirimler KEP sistemi ile ilgili mevzuat hükümleri çerçevesinde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="110" başlık="Konut kapıcılarının özel çalışma koşulları">
      <mvz-fıkra no="1">
        <template>Konut kapıcılarının hizmetlerinin kapsam ve niteliği ile çalışma süreleri, hafta tatili, ulusal bayram ve genel tatil günleri, yıllık ücretli izin hakları ve kapıcı konutları ile ilgili hususların düzenlenmesinde uygulanacak değişik şekil ve esaslar Çalışma ve Sosyal Güvenlik Bakanlığınca hazırlanacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="111" başlık="Sanayi, ticaret, tarım ve orman işleri">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanması bakımından; sanayiden, ticaretten, tarım ve orman işlerinden sayılacak işlerin esasları aşağıda belirtilmiştir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sanayiden sayılacak işlerin esasları şunlardır:</template>
        <mvz-bent no="a">
          <template>Her türlü madenleri arama ve topraktan çıkarma, taş, kum ve kireç ocakları.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ham, yarı ve tam yapılmış maddelerin işlenmesi, temizlenmesi, şeklinin değiştirilmesi, süslenmesi, satış için hazırlanması.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Her türlü kurma, onarma, sökme, dağıtma ve yıkma.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bina yapılması ve onarımı, değiştirilmesi, bozulması, yıkılması ve bunlara yardımcı her türlü sınai yapım.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Yol, demiryolu, tramvay yolu, liman, kanal, baraj, havaalanı, dalgakıran, tünel, köprü, lağım ve kuyuların yapılması ve onarımı, batıkların çıkarılması ve bataklık kurutma.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Elektrik ve her çeşit muharrik kuvvetlerin elde edilmesi, değiştirilmesi, taşınması, kurma ve dağıtma.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Su ve gaz tesisatı kurma ve işletmesi.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Telefon, telgraf, telsiz, radyo ve televizyon kurma.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Gemi ve vapur yapımı, onarımı, değiştirilmesi ve bozup dağıtma.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Eşyanın istasyon, antrepo, iskele, limanlar ve havaalanlarında yükletilmesi, boşaltılması.</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Basımevleri.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ticaretten sayılacak işlerin esasları şunlardır:</template>
        <mvz-bent no="a">
          <template>Ham, yarı ve tam yapılmış her çeşit bitkisel, hayvani veya sınai ürün ve malların alımı ve satımı.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bankacılık ve finans sektörü ile ilgili işlerle, sigortacılık, komisyonculuk, depoculuk, ambarcılık, antrepoculuk.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Su ürünleri alımı ve satımı.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Karada, göl ve akarsularda insan veya eşya ve hayvan taşıma.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tarım ve orman işlerinden sayılacak işlerin esasları şunlardır:</template>
        <mvz-bent no="a">
          <template>Her çeşit meyveli ve meyvesiz bitkiler; çay, pamuk, tütün, elyaflı bitkiler; turunçgiller; pirinç, baklagiller; ağaç, ağaççık, omca, tohum, fide, fidan; sebze ve tarla ürünleri; yem ve süt bitkilerinin yetiştirilmesi, üretimi, ıslahı, araştırılması, bunlarla ilgili her türlü toprak işleri, ekim, dikim, aşı, budama, sulama, gübreleme, hasat, harman, devşirme, temizleme, hazırlama ve ayırma işleri, hastalık ve zararlılarla mücadele, toprak ıslahı, çayır, mera, toprak ve su korunması.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Ormanların korunması, planlanması (amenajman), yetiştirilmesi, işletilmesi, sınırlandırılması çalışmaları, bunlara ait alt yapı çalışmaları ile tohum toplama, fidanlık, ağaçlandırma, erozyon kontrolü, etüt proje ve rehabilitasyonu, ormancılık araştırma ile milli park, orman içi dinlenme yerleri ve kent ormanlarının kurulması, bakım ve geliştirilmesi.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Her türlü iş ve gelir hayvanlarının (arı, ipek böceği ve benzerleri dahil) yetiştirilmesi, üretimi, ıslahı ve bunlarla ilgili bakım, güdüm, terbiye, kırkım, sağım ve ürünlerinin elde edilmesi, toplanması, saklanması ile bu hayvanların hastalık ve asalaklarıyla mücadele.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>854 sayılı Deniz İş Kanununun hükümleri saklı kalmak kaydıyla, kara ve su avcılığı ve üreticiliği ile bu yoldan elde edilen ürünlerin saklanması ve taşınması.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yukarıda sayılan esaslar doğrultusunda bir işin bu Kanunun uygulanması bakımından sanayi, ticaret, tarım ve orman işlerinden hangisinin kapsamında sayılacağı; Sanayi ve Ticaret, Çevre ve Orman ile Tarım ve Köyişleri bakanlıklarının görüşleri alınarak, Çalışma ve Sosyal Güvenlik Bakanlığınca altı ay içinde çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="112" başlık="Bazı kamu kurum ve kuruluşlarında çalışanların kıdem tazminatı">
      <mvz-fıkra no="1">
        <template>Kanuna veya kanunun verdiği yetkiye dayanılarak kurulan kurum ve kuruluşların haklarında bu Kanun ve 854, 5953, 5434 sayılı kanunların hükümleri uygulanmayan personeli ile kamu kuruluşlarında sözleşmeli olarak istihdam edilenlere mevzuat veya sözleşmelerine göre kıdem tazminatı niteliğinde yapılan ödemeler kıdem tazminatı sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanununun 62 nci maddesinin birinci fıkrasının (e) bendi kapsamında alt işverenler tarafından çalıştırılan işçilerin kıdem tazminatları;</template>
        <mvz-bent no="a">
          <template>Alt işverenlerinin değişip değişmediğine bakılmaksızın aralıksız olarak aynı kamu kurum veya kuruluşuna ait işyerlerinde çalışmış olanların bu şekilde çalışmış oldukları sürelere ilişkin kıdem tazminatına esas hizmet süreleri, aynı kamu kurum veya kuruluşuna ait işyerlerinde geçen toplam çalışma süreleri esas alınarak tespit olunur. Bunlardan son alt işverenleri ile yapılmış olan iş sözleşmeleri 1475 sayılı İş Kanununun 14 üncü maddesine göre kıdem tazminatı ödenmesini gerektirecek şekilde sona ermiş olanların kıdem tazminatları ilgili kamu kurum veya kuruluşları tarafından,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Aynı alt işveren tarafından ve aynı iş sözleşmesi çerçevesinde farklı kamu kurum veya kuruluşlarında çalıştırılmış olan işçilerden iş sözleşmeleri 1475 sayılı İş Kanununun 14 üncü maddesine göre kıdem tazminatı ödenmesini gerektirecek şekilde sona ermiş olanlara, 4734 sayılı Kanunun 62 nci maddesinin birinci fıkrasının (e) bendi kapsamında farklı kamu kurum ve kuruluşuna ait işyerlerinde geçen hizmet sürelerinin toplamı esas alınarak çalıştırıldığı son kamu kurum veya kuruluşu tarafından,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>işçinin banka hesabına yatırılmak suretiyle ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Alt işveren ile yapmış olduğu iş sözleşmesi sona ermediği gibi, alt işveren tarafından 4734 sayılı Kanun kapsamında bulunan idarelere ait işyerleri dışında bir işyerinde çalıştırılmaya devam olunan ve bu şekilde çalıştırıldığı sırada iş sözleşmesi kıdem tazminatı ödenmesini gerektirecek şekilde sona eren işçinin kıdem tazminatı, işçinin yazılı talebi hâlinde, kıdem tazminatının söz konusu kamu kurum veya kuruluşlarına ait işyerlerinde geçen süreye ilişkin kısmı, kamu kurum veya kuruluşuna ait çalıştığı son işyerindeki ücretinin yılları itibarıyla asgari ücret artış oranları dikkate alınarak güncellenmiş miktarı üzerinden hesaplanmak suretiyle son kamu kurum veya kuruluşu tarafından işçinin banka hesabına yatırılmak suretiyle ödenir. Bu şekilde hesaplanarak ödenen kıdem tazminatı tutarının, iş sözleşmesinin sona erdiği tarihteki ücreti üzerinden aynı süreler dikkate alınarak hesaplanacak kıdem tazminatı tutarından daha düşük olması hâlinde, işçinin aradaki farkı alt işverenden talep hakkı saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İkinci fıkranın (b) bendi veya üçüncü fıkra uyarınca farklı kamu kurum veya kuruluşlarına ait işyerlerinde geçen hizmet sürelerinin toplamı üzerinden kıdem tazminatı ödenmesi hâlinde, kıdem tazminatı ödemesini gerçekleştiren son kamu kurum veya kuruluşu, ödenen kıdem tazminatı tutarının diğer kamu kurum veya kuruluşlarında geçen hizmet süresine ilişkin kısmını ilgili kamu kurum veya kuruluşundan tahsil eder. Ancak, merkezi yönetim kapsamındaki kamu idareleri arasında bu fıkra hükümlerine göre bir tahsil işlemi yapılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kıdem tazminatı tutarı, 4734 sayılı Kanunun ek 8 inci maddesinin birinci fıkrasının (a) bendi kapsamında belirtilen işyerlerinde kıdem tazminatı ile ilgili açılacak bütçe tertibinden, (b) bendi kapsamında belirtilen işyerlerinde ise hizmet alımı gider kaleminden, ödeneğin yetip yetmediğine bakılmaksızın ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>(İptal)</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu madde kapsamında alt işverenler yanında çalışan işçilerin bu işyerlerinde geçen hizmet süresinin hesabı, alt işverenden ve alt işveren işçisinden istenecek belgeler ve ödeme süreci ile ilgili diğer usul ve esaslar Maliye Bakanlığı ve Kamu İhale Kurumunun görüşleri alınarak Çalışma ve Sosyal Güvenlik Bakanlığınca çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>5/1/2002 tarihli ve 4735 sayılı Kamu İhale Sözleşmeleri Kanunu ile 4/6/1985 tarihli ve 3213 sayılı Maden Kanunu kapsamında rödövans sözleşmeleri çerçevesinde yer altı maden işletmeciliği yapan şirketlere ve ortaklarına ait malların Tasarruf Mevduatı Sigorta Fonu tarafından el koyma veya takip yoluyla satışından elde edilen gelirler, öncelikle bu sözleşmeler kapsamında söz konusu şirketlerde çalışmış olan işçilerden, iş sözleşmeleri kıdem tazminatını hak edecek şekilde sona ermiş olanların kıdem ve ihbar tazminatları ile izin, fazla çalışma ve diğer ücret alacaklarının ödenmesinde kullanılır. Bu ödemeler Tasarruf Mevduatı Sigorta Fonu tarafından ilgililerin hesaplarına yatırılmak suretiyle gerçekleştirilir. Ödemeye esas bilgi ve belgeler, işçinin son çalıştığı işvereni tarafından Tasarruf Mevduatı Sigorta Fonuna teslim edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="113" başlık="Bazı işlerde çalışanların ücretlerinin güvencesi">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 4 üncü maddesinin birinci fıkrasının (b) ve (ı) bentlerinde sayılan işyerlerinde çalışan işçiler hakkında 32, 35, 37, 38 inci madde hükümleri uygulanır. Bu maddelere aykırılık hallerinde ilgililer hakkında ilgili ceza hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="114" başlık="Üçlü Danışma Kurulu">
      <mvz-fıkra no="1">
        <template>Çalışma barışının ve endüstri ilişkilerinin geliştirilmesinde, çalışma hayatıyla ilgili mevzuat çalışmalarının ve uygulamalarının izlenmesi amacıyla; Hükümet ile işveren, kamu görevlileri ve işçi sendikaları konfederasyonları arasında etkin danışmayı sağlamak üzere, üçlü temsile dayalı istişari mahiyette bir danışma kurulu oluşturulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurulun çalışma usul ve esasları çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="115" başlık="Kantin açılması">
      <mvz-fıkra no="1">
        <template>İşyerlerinde, yüzelli ve daha fazla işçi çalıştırılması halinde, işçilerin ve ailelerinin gerekli ihtiyaçlarının karşılanması amacıyla işçiler tarafından kurulacak tüketim kooperatiflerine işverenlerce yer tahsisi yapılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="116" başlık="">
      <mvz-fıkra no="1">
        <template>13.6.1952 tarihli ve 5953 sayılı Basın Mesleğinde Çalışanlarla Çalıştıranlar Arasındaki Münasebetlerin Tanzimi Hakkında Kanun ile ilgili olup yerine işlenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="117" başlık="">
      <mvz-fıkra no="1">
        <template>5.5.1983 tarihli ve 2821 sayılı Sendikalar Kanunu ile ilgili olup yerine işlenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="118" başlık="">
      <mvz-fıkra no="1">
        <template>5.5.1983 tarihli ve 2821 sayılı Sendikalar Kanunu ile ilgili olup yerine işlenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="119" başlık="Yönetmelikler">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen yönetmelikler Kanunun yayımı tarihinden itibaren altı ay içerisinde çıkartılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="120" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>25.8.1971 tarihli ve 1475 sayılı İş Kanununun 14 üncü maddesi hariç diğer maddeleri yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="Korumalı işyerlerinde çalışan engellilerin ücretleri" tür="Ek">
      <mvz-fıkra no="1">
        <template>Korumalı işyerlerinde çalıştırılan ve iş gücü piyasasına kazandırılmaları güç olan zihinsel veya ruhsal engellilere işverenlerince zamanında ödenmiş olan ücretlerinin;</template>
        <mvz-bent no="a">
          <template>Korumalı işyerlerinde çalışan her engelli için 1/7/1976 tarihli ve 2022 sayılı 65 Yaşını Doldurmuş Muhtaç, Güçsüz ve Kimsesiz Türk Vatandaşlarına Aylık Bağlanması Hakkında Kanunun 2 nci maddesinin birinci fıkrasının (a) bendi gereğince ödenen aylık tutarı kadarı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>29/1/2004 tarihli ve 5084 sayılı Yatırımların ve İstihdamın Teşviki ile Bazı Kanunlarda Değişiklik Yapılması Hakkında Kanunun 2 nci maddesi kapsamındaki illerde kurulmuş bulunan korumalı işyerlerinde çalışan her engelli için ilaveten (a) bendi ile belirlenen tutarın yüzde yirmisi,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Korumalı işyeri statüsü almak için ilgili mevzuatla çalıştırılması zorunlu olan sayıdan daha fazla engelli çalıştıran işyerlerinde, zorunlu sayının üstünde çalıştırılan her engelli için ilaveten (a) bendi ile belirlenen tutarın yüzde yirmisi,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>bu ücretlere ilişkin yasal yükümlülüklerin de tam ve zamanında karşılanmış olması kaydıyla, Hazine tarafından işverene ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirlenen ücret kısımlarının ödenmesine ilişkin usul ve esaslar, Maliye Bakanlığı ile Çalışma ve Sosyal Güvenlik Bakanlığı ve Hazine Müsteşarlığının uygun görüşü alınmak suretiyle Aile ve Sosyal Politikalar Bakanlığı tarafından çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Mazeret izni" tür="Ek">
      <mvz-fıkra no="1">
        <template>İşçiye; evlenmesi veya evlat edinmesi ya da ana veya babasının, eşinin, kardeşinin, çocuğunun ölümü hâlinde üç gün, eşinin doğum yapması hâlinde ise beş gün ücretli izin verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşçilerin en az yüzde yetmiş oranında engelli veya süreğen hastalığı olan çocuğunun tedavisinde, hastalık raporuna dayalı olarak ve çalışan ebeveynden sadece biri tarafından kullanılması kaydıyla, bir yıl içinde toptan veya bölümler hâlinde on güne kadar ücretli izin verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Zamanaşımı süresi" tür="Ek">
      <mvz-fıkra no="1">
        <template>İş sözleşmesinden kaynaklanmak kaydıyla hangi kanuna tabi olursa olsun, yıllık izin ücreti ve aşağıda belirtilen tazminatların zamanaşımı süresi beş yıldır.</template>
        <mvz-bent no="a">
          <template>Kıdem tazminatı.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İş sözleşmesinin bildirim şartına uyulmaksızın feshinden kaynaklanan tazminat.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kötüniyet tazminatı.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İş sözleşmesinin eşit davranma ilkesine uyulmaksızın feshinden kaynaklanan tazminat.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Diğer mevzuatta 1475 sayılı İş Kanununa yapılan atıflar bu Kanuna yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun 120 nci maddesi ile yürürlükte bırakılan 1475 sayılı İş Kanununun 14 üncü maddesinin birinci fıkrasının 1 inci ve 2 nci bendi ile onbirinci fıkrasında, anılan Kanunun 16, 17 ve 26 ncı maddelerine yapılan atıflar, bu Kanunun 24, 25 ve 32 nci maddelerine yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>1475 sayılı Kanuna göre alınmış bulunan asgari ücret kararı, bu Kanunun 39 uncu Maddesine göre tespit yapılıncaya kadar yürürlükte kalır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Mülga 3008 sayılı İş Kanununun 13 üncü maddesi hükümleri haklarında uygulanmayanlar için, bu Kanunun geçici 6 ncı maddesinde sözü edilen kıdem tazminatı hakkı 12.8.1967 tarihinden itibaren başlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlk defa bu Kanun kapsamına girenlerin kıdem tazminatı hakları bu Kanunun yürürlüğe girdiği tarihten itibaren başlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>1475 sayılı Kanunun 25 inci maddesi ile 3713 sayılı Kanunun ek 1 inci maddesinin (B) fıkrasında yer alan oranlar, bu Kanunun 30 uncu maddesi uyarınca Bakanlar Kurulu tarafından yeniden belirleninceye kadar geçerlidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Kıdem tazminatı için bir kıdem tazminatı fonu kurulur. Kıdem tazminatı fonuna ilişkin Kanunun yürürlüğe gireceği tarihe kadar işçilerin kıdemleri için 1475 sayılı İş Kanununun 14 üncü maddesi hükümlerine göre kıdem tazminatı hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddeyi ihdas eden Kanunun yayımı tarihinden önce 7 nci maddenin birinci fıkrası uyarınca bir işçinin yapmakta olduğu işe benzer işlerde çalıştırılması koşuluyla başka bir işverene iş görme edimini yerine getirmek üzere geçici olarak devredilmesi suretiyle kurulmuş bulunan geçici iş ilişkileri, sözleşmelerinin süresince devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Ek 3 üncü madde, bu maddenin yürürlüğe girdiği tarihten sonra sona eren iş sözleşmelerinden kaynaklanan yıllık izin ücreti ve tazminatlar hakkında uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ek 3 üncü maddede belirtilen yıllık izin ücreti ve tazminatlar için bu maddenin yürürlüğe girmesinden önce işlemeye başlamış bulunan zamanaşımı süreleri, değişiklikten önceki hükümlere tabi olmaya devam eder. Ancak, zamanaşımı süresinin henüz dolmamış kısmı, ek 3 üncü maddede öngörülen süreden uzun ise, ek 3 üncü maddede öngörülen sürenin geçmesiyle zamanaşımı süresi dolmuş olur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İcra takiplerinde rücu edilmeyecek kısma ilişkin olarak harç alınmaksızın düşme kararı verilir, takip giderleri ile vekâlet ücreti taraflar üzerinde bırakılır. Ancak, bu kapsamda alt işverene rücu edilerek takip ve tahsil edilmiş olan tutarlar, alt işverenler lehine hiçbir şekilde alacak hakkı doğurmaz ve tahsil edilmiş tutarlar iade edilmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun kapsamında olup olmadığına bakılmaksızın her türlü iş veya hizmet sözleşmesi, bu maddenin yürürlüğe girdiği tarihten itibaren üç ay süreyle 25 inci maddenin birinci fıkrasının (II) numaralı bendinde ve diğer kanunların ilgili hükümlerinde yer alan ahlak ve iyi niyet kurallarına uymayan haller ve benzeri sebepler, belirli süreli iş veya hizmet sözleşmelerinde sürenin sona ermesi, işyerinin herhangi bir sebeple kapanması ve faaliyetinin sona ermesi, ilgili mevzuatına göre yapılan her türlü hizmet alımları ile yapım işlerinde işin sona ermesi halleri dışında işveren tarafından feshedilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin yürürlüğe girdiği tarihten itibaren üç aylık süreyi geçmemek üzere işveren işçiyi tamamen veya kısmen ücretsiz izne ayırabilir. Bu madde kapsamında ücretsiz izne ayrılmak, işçiye haklı nedene dayanarak sözleşmeyi fesih hakkı vermez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde hükümlerine aykırı olarak iş sözleşmesini fesheden işveren veya işveren vekiline, sözleşmesi feshedilen her işçi için fiilin işlendiği tarihteki aylık brüt asgari ücret tutarında idari para cezası verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Cumhurbaşkanı birinci ve ikinci fıkrada yer alan üç aylık süreleri her defasında en fazla üçer aylık sürelerle 30/6/2021 tarihine kadar uzatmaya yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Manisa ili Soma ilçesinde Türkiye Kömür İşletmeleri Kurumunun taraf olduğu 3213 sayılı Kanun kapsamında imzalanmış rödovans sözleşmeleri kapsamında yer alan Işıklar, Atabacası ve Geventepe ocaklarında çalışan ve  kıdem tazminatına hak kazanacak şekilde hizmet akdi sona erdirilen işçilerden kıdem tazminatını ve/veya iş sözleşmesinin bildirim şartına uyulmaksızın feshinden kaynaklanan tazminatını alamayanların bu tazminatları, bu maddenin yürürlük tarihinden itibaren iki ay içinde Kuruma müracaat etmeleri halinde müracaat tarihinden itibaren altı ay içinde Kurum tarafından ödenir. Yapılan ödeme nedeniyle Kurum, rödovans sözleşmesinin tarafı olan ilgili şirketler ile bu şirketlerden tahsil edilemeyen veya tahsil edilemeyeceği anlaşılan tutar için kıdem tazminatına hak kazanılacak şekilde iş sözleşmelerinin sona erdiği tarihten bu maddenin yürürlüğe girdiği tarihe kadar görev yapmış yönetim kurulu üyelerine rücu eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="121" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="122" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
