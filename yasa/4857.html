  <mvz-künye tür="kanun" no="4857" başlık="İŞ KANUNU"
             tarih="22/5/2003" rgazete-tarih="10/6/2003 " rgazete-sayı="25134"
             düstur-tertip="5" düstur-cilt="42" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı işverenler ile bir iş sözleşmesine dayanarak çalıştırılan işçilerin çalışma şartları ve çalışma ortamına ilişkin hak ve sorumluluklarını düzenlemektir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun, 4 üncü Maddedeki istisnalar dışında kalan bütün işyerlerine, bu işyerlerinin işverenleri ile işveren vekillerine ve işçilerine faaliyet konularına bakılmaksızın uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşyerleri, işverenler, işveren vekilleri ve işçiler, 3 üncü maddedeki bildirim gününe bakılmaksızın bu Kanun hükümleri ile bağlı olurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bir iş sözleşmesine dayanarak çalışan gerçek kişiye işçi, işçi çalıştıran gerçek veya tüzel kişiye yahut tüzel kişiliği olmayan kurum ve kuruluşlara işveren, işçi ile işveren arasında kurulan ilişkiye iş ilişkisi denir. İşveren tarafından mal veya hizmet üretmek amacıyla maddî olan ve olmayan unsurlar ile işçinin birlikte örgütlendiği birime işyeri denir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşverenin işyerinde ürettiği mal veya hizmet ile nitelik yönünden bağlılığı bulunan ve aynı yönetim altında örgütlenen yerler  ile dinlenme, çocuk emzirme, yemek, uyku, yıkanma, muayene ve bakım, beden ve meslekî eğitim ve avlu gibi diğer eklentiler ve araçlar da işyerinden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşyeri, işyerine bağlı yerler, eklentiler ve araçlar ile oluşturulan iş organizasyonu kapsamında bir bütündür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşveren adına hareket eden ve işin, işyerinin ve işletmenin yönetiminde görev alan kimselere işveren vekili denir. İşveren vekilinin bu sıfatla işçilere karşı işlem ve yükümlülüklerinden doğrudan işveren sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanunda işveren için öngörülen her çeşit sorumluluk ve zorunluluklar işveren vekilleri hakkında da uygulanır. İşveren vekilliği sıfatı, işçilere tanınan hak ve yükümlülükleri ortadan kaldırmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bir işverenden, işyerinde yürüttüğü mal veya hizmet üretimine ilişkin yardımcı işlerinde veya asıl işin bir bölümünde işletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren işlerde iş alan ve bu iş için görevlendirdiği işçilerini sadece bu işyerinde aldığı işte çalıştıran diğer işveren ile iş aldığı işveren arasında kurulan ilişkiye asıl işveren-alt işveren ilişkisi denir. Bu ilişkide asıl işveren, alt işverenin işçilerine karşı o işyeri ile ilgili olarak bu Kanundan, iş sözleşmesinden veya alt işverenin taraf olduğu toplu iş sözleşmesinden doğan yükümlülüklerinden alt işveren ile birlikte sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Asıl işverenin işçilerinin alt işveren tarafından işe alınarak çalıştırılmaya devam ettirilmesi suretiyle hakları kısıtlanamaz veya daha önce o işyerinde çalıştırılan kimse ile alt işveren ilişkisi kurulamaz. Aksi halde ve genel olarak asıl işveren alt işveren ilişkisinin muvazaalı işleme dayandığı kabul edilerek alt işverenin işçileri başlangıçtan itibaren asıl işverenin işçisi sayılarak işlem görürler. İşletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren işler dışında asıl iş bölünerek alt işverenlere verilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Kanuna veya Cumhurbaşkanlığı kararnamesine dayanılarak kurulan kamu kurum ve kuruluşları ile bunların doğrudan veya dolaylı olarak sermayesinin en az yüzde ellisine sahip oldukları ortaklıklarda, 4734 sayılı Kamu İhale Kanunu veya diğer kanun hükümleri çerçevesinde, hizmet alımı amacıyla yapılan sözleşmeler gereğince, yüklenici aracılığıyla çalıştırılanlar, bu şekilde çalışmış olmalarına dayanarak;</template>
        <mvz-bent no="a">
          <template>Bu kurum, kuruluş ve ortaklıklara ait kadro veya pozisyonlara atanmaya,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu kurum, kuruluş ve ortaklıklara ait işyerlerinin kadro veya pozisyonlarında çalışanlar için toplu iş sözleşmesi, personel kanunları veya ilgili diğer mevzuat hükümlerine göre belirlenen her türlü malî haklar ile sosyal yardımlardan yararlanmaya,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>hak kazanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Sekizinci fıkrada belirtilen işyerlerinde yükleniciler dışında kalan işverenler tarafından çalıştırılanlar ile bu işyerlerinin tâbi oldukları ihale mevzuatı çerçevesinde kendi nam ve hesabına sözleşme yaparak üstlendiği ihale konusu işte doğrudan kendileri çalışanlar da aynı hükümlere tâbidir. Sekizinci fıkrada belirtilen kurum, kuruluş veya ortaklıkların sermayesine katıldıkları ortaklıkların kadro veya pozisyonlarında çalışan işçilerin, ortak durumundaki kamu kurum, kuruluş veya ortaklıkların kadro veya pozisyonlarına atanma ya da bu kurum, kuruluş veya ortaklıklarda geçerli olan malî haklar ile sosyal yardımlardan yararlanma talepleri hakkında da sekizinci fıkra hükümleri uygulanır. Hizmet alımına dayanak teşkil edecek sözleşme ve şartnamelere;</template>
        <mvz-bent no="a">
          <template>İşe alınacak kişilerin belirlenmesi ve işten çıkarma yetkisinin kamu kurum, kuruluşları ve ortaklıklarına bırakılması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Hizmet alım sözleşmeleri çerçevesinde ya da geçici işçi olarak aynı iş yerinde daha önce çalışmış olanların çalıştırılmasına devam olunması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yönünde hükümler konulamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="İşyerini bildirme">
      <mvz-fıkra no="1">
        <template>Bu Kanunun kapsamına giren nitelikte bir işyerini kuran, her ne suretle olursa olsun devralan, çalışma konusunu kısmen veya tamamen değiştiren veya herhangi bir sebeple faaliyetine son veren ve işyerini kapatan işveren, işyerinin unvan ve adresini, çalıştırılan işçi sayısını, çalışma konusunu, işin başlama veya bitme gününü, kendi adını ve soyadını yahut unvanını, adresini, varsa işveren vekili veya vekillerinin adı, soyadı ve adreslerini bir ay içinde bölge müdürlüğüne bildirmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun 2 nci maddesinin altıncı fıkrasına göre iş alan alt işveren; kendi işyerinin tescili için asıl işverenden aldığı yazılı alt işverenlik sözleşmesi ve gerekli belgelerle birlikte, birinci fıkra hükmüne göre bildirim yapmakla yükümlüdür. Bölge müdürlüğünce tescili yapılan bu işyerine ait belgeler gerektiğinde iş müfettişlerince incelenir. İnceleme sonucunda muvazaalı işlemin tespiti halinde, bu tespite ilişkin gerekçeli müfettiş raporu işverenlere tebliğ edilir. Bu rapora karşı tebliğ tarihinden itibaren otuz iş günü içinde işverenlerce yetkili iş mahkemesine itiraz edilebilir.  İtiraz üzerine görülecek olan dava basit yargılama usulüne göre dört ay içinde sonuçlandırılır. Mahkemece verilen kararın temyizi hâlinde Yargıtay altı ay içinde kesin olarak karar verir. Kamu idarelerince bu raporlara karşı yetkili iş mahkemelerine itiraz edilmesi ve mahkeme kararlarına karşı diğer kanun yollarına başvurulması zorunludur. Rapora otuz iş günü içinde itiraz edilmemiş veya mahkeme muvazaalı işlemin tespitini onamış ise tescil işlemi iptal edilir ve alt işverenin işçileri başlangıçtan itibaren asıl işverenin işçileri sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ancak, şirketlerin tescil kayıtları ise ticaret sicili memurluklarının gönderdiği belgeler üzerinden yapılır ve bu belgeler ilgili ticaret sicili memurluğunca bir ay içinde Çalışma ve Sosyal Güvenlik Bakanlığı ilgili bölge müdürlüklerine gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Asıl işveren-alt işveren ilişkisinin kurulması, bildirimi ve işyerinin tescili ile yapılacak sözleşmede bulunması gerekli diğer hususlara ilişkin usul ve esaslar, Çalışma ve Sosyal Güvenlik Bakanlığı tarafından çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="İstisnalar">
      <mvz-fıkra no="1">
        <template>Aşağıda belirtilen işlerde ve iş ilişkilerinde bu Kanun hükümleri uygulanmaz;</template>
        <mvz-bent no="a">
          <template>Deniz ve hava taşıma işlerinde,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>50'den az işçi çalıştırılan (50 dahil) tarım ve orman işlerinin yapıldığı işyerlerinde veya işletmelerinde,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Aile ekonomisi sınırları içinde kalan tarımla ilgili her çeşit yapı işleri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bir ailenin üyeleri ve 3 üncü dereceye kadar (3 üncü derece dahil) hısımları arasında dışardan başka biri katılmayarak evlerde ve el sanatlarının yapıldığı işlerde,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Ev hizmetlerinde,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>çıraklar hakkında,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Sporcular hakkında,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Rehabilite edilenler hakkında,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>507 sayılı Esnaf ve Sanatkârlar Kanununun 2 nci maddesinin tarifine uygun üç kişinin çalıştığı işyerlerinde.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Şu kadar ki;</template>
        <mvz-bent no="a">
          <template>Kıyılarda veya liman ve iskelelerde gemilerden karaya ve karadan gemilere yapılan yükleme ve boşaltma işleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Havacılığın bütün yer tesislerinde yürütülen işler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Tarım sanatları ile tarım aletleri, makine ve parçalarının yapıldığı atölye ve fabrikalarda görülen işler,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Tarım işletmelerinde yapılan yapı işleri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Halkın faydalanmasına açık veya işyerinin eklentisi durumunda olan park ve bahçe işleri,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Deniz İş Kanunu kapsamına girmeyen ve tarım işlerinden sayılmayan, denizlerde çalışan su ürünleri üreticileri ile ilgili işler,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Bu Kanun hükümlerine tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Eşit davranma ilkesi">
      <mvz-fıkra no="1">
        <template>İş ilişkisinde dil, ırk, renk, cinsiyet, engellilik, siyasal düşünce, felsefî inanç, din ve mezhep ve benzeri sebeplere dayalı ayrım yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren, esaslı sebepler olmadıkça tam süreli çalışan işçi karşısında kısmî süreli çalışan işçiye, belirsiz süreli çalışan işçi karşısında belirli süreli çalışan işçiye farklı işlem yapamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşveren, biyolojik veya işin niteliğine ilişkin sebepler zorunlu kılmadıkça, bir işçiye, iş sözleşmesinin yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde, cinsiyet veya gebelik nedeniyle doğrudan veya dolaylı farklı işlem yapamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Aynı veya eşit değerde bir iş için cinsiyet nedeniyle daha düşük ücret kararlaştırılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşçinin cinsiyeti nedeniyle özel koruyucu hükümlerin uygulanması, daha düşük bir ücretin uygulanmasını haklı kılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İş ilişkisinde veya sona ermesinde yukarıdaki fıkra hükümlerine aykırı davranıldığında işçi, dört aya kadar ücreti tutarındaki uygun bir tazminattan başka yoksun bırakıldığı haklarını da talep edebilir. 2821 sayılı Sendikalar Kanununun 31 inci maddesi hükümleri saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>20 nci madde hükümleri saklı kalmak üzere işverenin yukarıdaki fıkra hükümlerine aykırı davrandığını işçi ispat etmekle yükümlüdür. Ancak, işçi bir ihlalin varlığı ihtimalini güçlü bir biçimde gösteren bir durumu ortaya koyduğunda, işveren böyle bir ihlalin mevcut olmadığını ispat etmekle yükümlü olur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="İşyerinin veya bir bölümünün devri">
      <mvz-fıkra no="1">
        <template>İşyeri veya işyerinin bir bölümü hukukî bir işleme dayalı olarak başka birine devredildiğinde, devir tarihinde işyerinde veya bir bölümünde mevcut olan iş sözleşmeleri bütün hak ve borçları ile birlikte devralana geçer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Devralan işveren, işçinin hizmet süresinin esas alındığı haklarda, işçinin devreden işveren yanında işe başladığı tarihe göre işlem yapmakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıdaki hükümlere göre devir halinde, devirden önce doğmuş olan ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren birlikte sorumludurlar. Ancak bu yükümlülüklerden devreden işverenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tüzel kişiliğin birleşme veya katılma ya da türünün değişmesiyle sona erme halinde birlikte sorumluluk hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Devreden veya devralan işveren iş sözleşmesini sırf işyerinin veya işyerinin bir bölümünün devrinden dolayı feshedemez ve devir işçi yönünden fesih için haklı sebep oluşturmaz. Devreden veya devralan işverenin ekonomik ve teknolojik sebeplerin yahut iş organizasyonu değişikliğinin gerekli kıldığı fesih hakları veya işçi ve işverenlerin haklı sebeplerden derhal fesih hakları saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yukarıdaki hükümler, iflas dolayısıyla malvarlığının tasfiyesi sonucu işyerinin veya bir bölümünün başkasına devri halinde uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Geçici iş ilişkisi">
      <mvz-fıkra no="1">
        <template>Geçici iş ilişkisi, özel istihdam bürosu aracılığıyla ya da holding bünyesi içinde veya aynı şirketler topluluğuna bağlı başka bir işyerinde görevlendirme yapılmak suretiyle kurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Özel istihdam bürosu aracılığıyla geçici iş ilişkisi, Türkiye İş Kurumunca izin verilen özel istihdam bürosunun bir işverenle geçici işçi sağlama sözleşmesi yaparak bir işçisini geçici olarak bu işverene devri ile;</template>
        <mvz-bent no="a">
          <template>Bu Kanunun 13 üncü maddesinin beşinci fıkrası ile 74 üncü maddesinde belirtilen hâllerde, işçinin askerlik hizmeti hâlinde ve iş sözleşmesinin askıda kaldığı diğer hâllerde,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Mevsimlik tarım işlerinde,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Ev hizmetlerinde,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İşletmenin günlük işlerinden sayılmayan ve aralıklı olarak gördürülen işlerde,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İş sağlığı ve güvenliği bakımından acil olan işlerde veya üretimi önemli ölçüde etkileyen zorlayıcı nedenlerin ortaya çıkması hâlinde,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İşletmenin ortalama mal ve hizmet üretim kapasitesinin geçici iş ilişkisi kurulmasını gerektirecek ölçüde ve öngörülemeyen şekilde artması hâlinde,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Mevsimlik işler hariç dönemsellik arz eden iş artışları hâlinde,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>kurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Geçici işçi sağlama sözleşmesi ikinci fıkranın (a) bendinde sayılan hâllerin devamı süresince, (b) ve (c) bentlerinde sayılan hâllerde süre sınırı olmaksızın, diğer bentlerde sayılan hâllerde ise en fazla dört ay süreyle kurulabilir. Yapılan bu sözleşme ikinci fıkranın (g) bendi hariç toplam sekiz ayı geçmemek üzere en fazla iki defa yenilenebilir. Geçici işçi çalıştıran işveren, belirtilen sürenin sonunda aynı iş için altı ay geçmedikçe yeniden geçici işçi çalıştıramaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun 29 uncu maddesi kapsamında toplu işçi çıkarılan işyerlerinde sekiz ay süresince, kamu kurum ve kuruluşlarında ve yer altında maden çıkarılan işyerlerinde bu maddenin ikinci fıkrası kapsamında geçici iş ilişkisi kurulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Geçici işçi çalıştıran işveren, grev ve lokavtın uygulanması sırasında 18/10/2012 tarihli ve 6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanununun 65 inci maddesi hükümleri saklı kalmak kaydıyla geçici iş ilişkisiyle işçi çalıştıramaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İkinci fıkranın (f) bendi kapsamında geçici iş ilişkisi ile çalıştırılan işçi sayısı, işyerinde çalıştırılan işçi sayısının dörtte birini geçemez. Ancak, on ve daha az işçi çalıştırılan işyerlerinde beş işçiye kadar geçici iş ilişkisi kurulabilir. İşçi sayısının tespitinde, kısmi süreli iş sözleşmesine göre çalışanlar, çalışma süreleri dikkate alınarak tam süreli çalışmaya dönüştürülür. Geçici işçi sağlama sözleşmesi ile çalışan işçi, 30 uncu maddenin uygulanmasında özel istihdam bürosu ve geçici işçi çalıştıran işverenin işçi sayısına dâhil edilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Geçici işçi çalıştıran işveren, iş sözleşmesi feshedilen işçisini fesih tarihinden itibaren altı ay geçmeden geçici iş ilişkisi kapsamında çalıştıramaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Geçici işçi, geçici işçi çalıştıran işverenden özel istihdam bürosunun hizmet bedeline mahsup edilmek üzere avans veya borç alamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Geçici işçi çalıştıran işveren;</template>
        <mvz-bent no="a">
          <template>İşin gereği ve geçici işçi sağlama sözleşmesine uygun olarak geçici işçisine talimat verme yetkisine sahiptir.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İşyerindeki açık iş pozisyonlarını geçici işçisine bildirmek ve Türkiye İş Kurumu tarafından istenecek belgeleri belirlenen sürelerle saklamakla yükümlüdür.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Geçici işçinin iş kazası ve meslek hastalığı hâllerini özel istihdam bürosuna derhâl, 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 13 üncü ve 14 üncü maddelerine göre ilgili mercilere bildirmekle yükümlüdür.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Geçici işçileri çalıştıkları dönemlerde, işyerindeki sosyal hizmetlerden eşit muamele ilkesince yararlandırır. Geçici işçiler, çalışmadıkları dönemlerde ise özel istihdam bürosundaki eğitim ve çocuk bakım hizmetlerinden yararlandırılır.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>İşyerindeki geçici işçilerin istihdam durumuna ilişkin bilgileri varsa işyeri sendika temsilcisine bildirmekle yükümlüdür.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>20/6/2012 tarihli ve 6331 sayılı İş Sağlığı ve Güvenliği Kanununun 17 nci maddesinin altıncı fıkrasında öngörülen eğitimleri vermekle ve iş sağlığı ve güvenliği açısından gereken tedbirleri almakla, geçici işçi de bu eğitimlere katılmakla yükümlüdür.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Geçici işçinin, geçici işçiyi çalıştıran işverenin işyerindeki çalışma süresince temel çalışma koşulları, bu işçilerin aynı işveren tarafından aynı iş için doğrudan istihdamı hâlinde sağlanacak koşulların altında olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Geçici iş ilişkisinde işveren özel istihdam bürosudur. Özel istihdam bürosu aracılığıyla geçici iş ilişkisi, geçici işçi ile iş sözleşmesi, geçici işçi çalıştıran işveren ile geçici işçi sağlama sözleşmesi yapmak suretiyle yazılı olarak kurulur. Özel istihdam bürosu ile geçici işçi çalıştıran işveren arasında yapılacak geçici işçi sağlama sözleşmesinde; sözleşmenin başlangıç ve bitiş tarihi, işin niteliği, özel istihdam bürosunun hizmet bedeli, varsa geçici işçi çalıştıran işverenin ve özel istihdam bürosunun özel yükümlülükleri yer alır. Geçici işçinin, Türkiye İş Kurumundan veya bir başka özel istihdam bürosundan hizmet almasını ya da iş görme edimini yerine getirdikten sonra geçici işçi olarak çalıştığı işveren veya farklı bir işverenin işyerinde çalışmasını engelleyen hükümler konulamaz. Geçici işçi ile yapılacak iş sözleşmesinde, işçinin ne kadar süre içerisinde işe çağrılmazsa haklı nedenle iş sözleşmesini feshedebileceği belirtilir. Bu süre üç ayı geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>İkinci fıkranın (f) bendi kapsamında kurulan geçici iş ilişkisinde, geçici işçi çalıştıran işveren işyerinde bir ayın üzerinde çalışan geçici işçilerin ücretlerinin ödenip ödenmediğini çalıştığı süre boyunca her ay kontrol etmekle, özel istihdam bürosu ise ücretin ödendiğini gösteren belgeleri aylık olarak geçici işçi çalıştıran işverene ibraz etmekle yükümlüdür. Geçici işçi çalıştıran işveren, ödenmeyen ücretler mevcut ise bunlar ödenene kadar özel istihdam bürosunun alacağını ödemeyerek, özel istihdam bürosunun alacağından mahsup etmek kaydıyla geçici işçilerin en çok üç aya kadar olan ücretlerini doğrudan işçilerin banka hesabına yatırır. Ücreti ödenmeyen işçiler ve ödenmeyen ücret tutarları geçici işçi çalıştıran işveren tarafından çalışma ve iş kurumu il müdürlüğüne bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Sözleşmede belirtilen sürenin dolmasına rağmen geçici iş ilişkisinin devam etmesi hâlinde, geçici işçi çalıştıran işveren ile işçi arasında sözleşmenin sona erme tarihinden itibaren belirsiz süreli iş sözleşmesi kurulmuş sayılır. Bu durumda özel istihdam bürosu işçinin geçici iş ilişkisinden kaynaklanan ücretinden, işçiyi gözetme borcundan ve sosyal sigorta primlerinden sözleşme süresiyle sınırlı olmak üzere sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="14">
        <template>Geçici işçi, işyerine ve işe ilişkin olmak kaydıyla kusuru ile neden olduğu zarardan, geçici işçi çalıştıran işverene karşı sorumludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="15">
        <template>İşverenin, devir sırasında yazılı rızasını almak suretiyle bir işçisini, holding bünyesi içinde veya aynı şirketler topluluğuna bağlı başka bir işyerinde iş görme edimini yerine getirmek üzere geçici olarak devretmesi hâlinde de geçici iş ilişkisi kurulmuş olur. Bu fıkra kapsamında geçici iş ilişkisi, yazılı olarak altı ayı geçmemek üzere kurulabilir ve en fazla iki defa yenilenebilir. İşçisini geçici olarak devreden işverenin ücret ödeme yükümlülüğü devam eder. Geçici iş ilişkisi kurulan işveren, işçinin kendisinde çalıştığı sürede ödenmeyen ücretinden, işçiyi gözetme borcundan ve sosyal sigorta primlerinden, devreden işveren ile birlikte sorumludur. Dördüncü, beşinci, onuncu ve on dördüncü fıkralar ve dokuzuncu fıkranın (a) ve (f) bentleri ile (d) bendinin birinci cümlesinde düzenlenen hak ve yükümlülükler bu fıkraya göre kurulan geçici iş ilişkisinde de uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="İş Sözleşmesi, Türleri ve Feshi">
    <mvz-madde no="8" başlık="Tanım ve şekil">
      <mvz-fıkra no="1">
        <template>İş sözleşmesi, bir tarafın (işçi) bağımlı olarak iş görmeyi, diğer tarafın (işveren) da ücret ödemeyi üstlenmesinden oluşan sözleşmedir. İş sözleşmesi, Kanunda aksi belirtilmedikçe, özel bir şekle tâbi değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Süresi bir yıl ve daha fazla olan iş sözleşmelerinin yazılı şekilde yapılması zorunludur. Bu belgeler damga vergisi ve her çeşit resim ve harçtan muaftır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yazılı sözleşme yapılmayan hallerde işveren işçiye en geç iki ay içinde genel ve özel çalışma koşullarını, günlük ya da haftalık çalışma süresini, temel ücreti ve varsa ücret eklerini, ücret ödeme dönemini, süresi belirli ise sözleşmenin süresini, fesih halinde tarafların uymak zorunda oldukları hükümleri gösteren yazılı bir belge vermekle yükümlüdür. Süresi bir ayı geçmeyen belirli süreli iş sözleşmelerinde bu fıkra hükmü uygulanmaz. İş sözleşmesi iki aylık süre dolmadan sona ermiş ise, bu bilgilerin en geç sona erme tarihinde işçiye yazılı olarak verilmesi zorunludur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Türü ve çalışma biçimlerini belirleme serbestisi">
      <mvz-fıkra no="1">
        <template>Taraflar iş sözleşmesini, Kanun hükümleriyle getirilen sınırlamalar saklı kalmak koşuluyla, ihtiyaçlarına uygun türde düzenleyebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İş sözleşmeleri belirli veya belirsiz süreli yapılır. Bu sözleşmeler çalışma biçimleri bakımından tam süreli veya kısmî süreli yahut deneme süreli ya da diğer türde oluşturulabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Sürekli ve süreksiz işlerdeki iş sözleşmeleri">
      <mvz-fıkra no="1">
        <template>Nitelikleri bakımından en çok otuz iş günü süren işlere süreksiz iş, bundan fazla devam edenlere sürekli iş denir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun 3, 8, 12, 13, 14, 15, 17, 23, 24, 25, 26, 27, 28, 29, 30, 31, 34, 53, 54, 55, 56, 57, 58, 59, 75, 80 ve geçici 6 ncı maddeleri süreksiz işlerde yapılan iş sözleşmelerinde uygulanmaz. Süreksiz işlerde, bu maddelerde düzenlenen konularda Borçlar Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Belirli ve belirsiz süreli iş sözleşmesi">
      <mvz-fıkra no="1">
        <template>İş ilişkisinin bir süreye bağlı olarak yapılmadığı halde sözleşme belirsiz süreli sayılır. Belirli süreli işlerde veya belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan iş sözleşmesi belirli süreli iş sözleşmesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Belirli süreli iş sözleşmesi, esaslı bir neden olmadıkça, birden fazla üst üste (zincirleme) yapılamaz. Aksi halde iş sözleşmesi başlangıçtan itibaren belirsiz süreli kabul edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Esaslı nedene dayalı zincirleme iş sözleşmeleri, belirli süreli olma özelliğini korurlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Belirli ve belirsiz süreli iş sözleşmesi ayırımın sınırları">
      <mvz-fıkra no="1">
        <template>Belirli süreli iş sözleşmesi ile çalıştırılan işçi, ayırımı haklı kılan bir neden olmadıkça, salt iş sözleşmesinin süreli olmasından dolayı belirsiz süreli iş sözleşmesiyle çalıştırılan emsal işçiye göre farklı işleme tâbi tutulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Belirli süreli iş sözleşmesi ile çalışan işçiye, belirli bir zaman ölçüt alınarak ödenecek ücret ve paraya ilişkin bölünebilir menfaatler, işçinin çalıştığı süreye orantılı olarak verilir. Herhangi bir çalışma şartından yararlanmak için aynı işyeri veya işletmede geçirilen kıdem arandığında belirli süreli iş sözleşmesine göre çalışan işçi için farklı kıdem uygulanmasını haklı gösteren bir neden olmadıkça, belirsiz süreli iş sözleşmesi ile çalışan emsal işçi hakkında esas alınan kıdem uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Emsal işçi, işyerinde aynı veya benzeri işte belirsiz süreli iş sözleşmesiyle çalıştırılan işçidir. İşyerinde böyle bir işçi bulunmadığı takdirde, o işkolunda şartlara uygun bir işyerinde aynı veya benzer işi üstlenen belirsiz süreli iş sözleşmesiyle çalıştırılan işçi dikkate alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Kısmî süreli ve tam süreli iş sözleşmesi">
      <mvz-fıkra no="1">
        <template>İşçinin normal haftalık çalışma süresinin, tam süreli iş sözleşmesiyle çalışan emsal işçiye göre önemli ölçüde daha az belirlenmesi durumunda sözleşme kısmî süreli iş sözleşmesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kısmî süreli iş sözleşmesi ile çalıştırılan işçi, ayırımı haklı kılan bir neden olmadıkça, salt iş sözleşmesinin kısmî süreli olmasından dolayı tam süreli emsal işçiye göre farklı işleme tâbi tutulamaz. Kısmî süreli çalışan işçinin ücret ve paraya ilişkin bölünebilir menfaatleri, tam süreli emsal işçiye göre çalıştığı süreye orantılı olarak ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Emsal işçi, işyerinde aynı veya benzeri işte tam süreli çalıştırılan işçidir. İşyerinde böyle bir işçi bulunmadığı takdirde, o işkolunda şartlara uygun işyerinde aynı veya benzer işi üstlenen tam süreli iş sözleşmesiyle çalıştırılan işçi esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşyerinde çalışan işçilerin, niteliklerine uygun açık yer bulunduğunda kısmî süreliden tam süreliye veya tam süreliden kısmî süreliye geçirilme istekleri işverence dikkate alınır ve boş yerler zamanında duyurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu kanunun 74 üncü maddesinde öngörülen izinlerin bitiminden sonra mecburi ilköğretim çağının başladığı tarihi takip eden ay başına kadar bu maddeye göre ebeveynlerden biri kısmi süreli çalışma talebinde bulunabilir. Bu talep işveren tarafından karşılanır ve geçerli fesih nedeni sayılmaz. Bu fıkra kapsamında kısmi süreli çalışmaya başlayan işçi, aynı çocuk için bir daha bu haktan faydalanmamak üzere tam zamanlı çalışmaya dönebilir. Kısmi süreli çalışmaya geçen işçinin tam zamanlı çalışmaya başlaması durumunda yerine işe alınan işçinin iş sözleşmesi kendiliğinden sona erer. Bu haktan faydalanmak veya tam zamanlı çalışmaya geri dönmek isteyen işçi işverene bunu en az bir ay önce yazılı olarak bildirir. Ebeveynlerden birinin çalışmaması hâlinde, çalışan eş kısmi süreli çalışma talebinde bulunamaz. Üç yaşını doldurmamış bir çocuğu eşiyle birlikte veya münferiden evlat edinenler de çocuğun fiilen teslim edildiği tarihten itibaren bu haktan faydalanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Beşinci fıkra kapsamında hangi sektör veya işlerde kısmi çalışma yapılabileceği ile uygulamaya ilişkin usul ve esaslar Çalışma ve Sosyal Güvenlik Bakanlığınca çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Çağrı üzerine çalışma ve uzaktan çalışma">
      <mvz-fıkra no="1">
        <template>Yazılı sözleşme ile işçinin yapmayı üstlendiği işle ilgili olarak kendisine ihtiyaç duyulması halinde iş görme ediminin yerine getirileceğinin kararlaştırıldığı iş ilişkisi, çağrı üzerine çalışmaya dayalı kısmi süreli bir iş sözleşmesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hafta, ay veya yıl gibi bir zaman dilimi içinde işçinin ne kadar süreyle çalışacağını taraflar belirlemedikleri takdirde, haftalık çalışma süresi yirmi saat kararlaştırılmış sayılır. Çağrı üzerine çalıştırılmak için belirlenen sürede işçi çalıştırılsın veya çalıştırılmasın ücrete hak kazanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşçiden iş görme borcunu yerine getirmesini çağrı yoluyla talep hakkına sahip olan işveren, bu çağrıyı, aksi kararlaştırılmadıkça, işçinin çalışacağı zamandan en az dört gün önce yapmak zorundadır. Süreye uygun çağrı üzerine işçi iş görme edimini yerine getirmekle yükümlüdür. Sözleşmede günlük çalışma süresi kararlaştırılmamış ise, işveren her çağrıda işçiyi günde en az dört saat üst üste çalıştırmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Uzaktan çalışma; işçinin, işveren tarafından oluşturulan iş organizasyonu kapsamında iş görme edimini evinde ya da teknolojik iletişim araçları ile işyeri dışında yerine getirmesi esasına dayalı ve yazılı olarak kurulan iş ilişkisidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Dördüncü fıkraya göre yapılacak iş sözleşmesinde; işin tanımı, yapılma şekli, işin süresi ve yeri, ücret ve ücretin ödenmesine ilişkin hususlar, işveren tarafından sağlanan ekipman ve bunların korunmasına ilişkin yükümlülükler, işverenin işçiyle iletişim kurması ile genel ve özel çalışma şartlarına ilişkin hükümler yer alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Uzaktan çalışmada işçiler, esaslı neden olmadıkça salt iş sözleşmesinin niteliğinden ötürü emsal işçiye göre farklı işleme tabi tutulamaz. İşveren, uzaktan çalışma ilişkisiyle iş verdiği çalışanın yaptığı işin niteliğini dikkate alarak iş sağlığı ve güvenliği önlemleri hususunda çalışanı bilgilendirmek, gerekli eğitimi vermek, sağlık gözetimini sağlamak ve sağladığı ekipmanla ilgili gerekli iş güvenliği tedbirlerini almakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Uzaktan çalışmanın usul ve esasları, işin niteliği dikkate alınarak hangi işlerde uzaktan çalışmanın yapılamayacağı, verilerin korunması ve paylaşılmasına ilişkin işletme kurallarının uygulanması ile diğer hususlar Çalışma ve Sosyal Güvenlik Bakanlığı tarafından çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Deneme süreli iş sözleşmesi">
      <mvz-fıkra no="1">
        <template>Taraflarca iş sözleşmesine bir deneme kaydı konulduğunda, bunun süresi en çok iki ay olabilir. Ancak deneme süresi toplu iş sözleşmeleriyle dört aya kadar uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Deneme süresi içinde taraflar iş sözleşmesini bildirim süresine gerek olmaksızın ve tazminatsız feshedebilir. İşçinin çalıştığı günler için ücret ve diğer hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Takım sözleşmesi ile oluşturulan iş sözleşmeleri">
      <mvz-fıkra no="1">
        <template>Birden çok işçinin meydana getirdiği bir takımı temsilen bu işçilerden birinin, takım kılavuzu sıfatıyla işverenle yaptığı sözleşmeye takım sözleşmesi denir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Takım sözleşmesinin, oluşturulacak iş sözleşmeleri için hangi süre kararlaştırılmış olursa olsun, yazılı yapılması gerekir. Sözleşmede her işçinin kimliği ve alacağı ücret ayrı ayrı gösterilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Takım sözleşmesinde isimleri yazılı işçilerden her birinin işe başlamasıyla, o işçi ile işveren arasında takım sözleşmesinde belirlenen şartlarla bir iş sözleşmesi yapılmış sayılır. Ancak, takım sözleşmesi hakkında Borçlar Kanununun 110 uncu maddesi hükmü de uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşe başlamasıyla iş sözleşmesi kurulan işçilere ücretlerini işveren veya işveren vekili her birine ayrı ayrı ödemek zorundadır. Takım kılavuzu için, takıma dahil işçilerin ücretlerinden işe aracılık veya benzeri bir nedenle kesinti yapılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Süreli fesih">
      <mvz-fıkra no="1">
        <template>Belirsiz süreli iş sözleşmelerinin feshinden önce durumun diğer tarafa bildirilmesi gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İş sözleşmeleri;</template>
        <mvz-bent no="a">
          <template>İşi altı aydan az sürmüş olan işçi için, bildirimin diğer tarafa yapılmasından başlayarak iki hafta sonra,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İşi altı aydan birbuçuk yıla kadar sürmüş olan işçi için, bildirimin diğer tarafa yapılmasından başlayarak dört hafta sonra,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İşi birbuçuk yıldan üç yıla kadar sürmüş olan işçi için, bildirimin diğer tarafa yapılmasından başlayarak altı hafta sonra,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İşi üç yıldan fazla sürmüş işçi için, bildirim yapılmasından başlayarak sekiz hafta sonra,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>feshedilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu süreler asgari olup sözleşmeler ile artırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bildirim şartına uymayan taraf, bildirim süresine ilişkin ücret tutarında tazminat ödemek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşveren bildirim süresine ait ücreti peşin vermek suretiyle iş sözleşmesini feshedebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İşverenin bildirim şartına uymaması veya bildirim süresine ait ücreti peşin ödeyerek sözleşmeyi feshetmesi, bu Kanunun 18, 19, 20 ve 21 inci maddesi hükümlerinin uygulanmasına engel olmaz. 18 inci maddenin birinci fıkrası uyarınca bu Kanunun 18, 19, 20 ve 21 inci maddelerinin uygulanma alanı dışında kalan işçilerin iş sözleşmesinin, fesih hakkının kötüye kullanılarak sona erdirildiği durumlarda işçiye bildirim süresinin üç katı tutarında tazminat ödenir. Fesih için bildirim şartına da uyulmaması ayrıca dördüncü fıkra uyarınca tazminat ödenmesini gerektirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu maddeye göre ödenecek tazminatlar ile bildirim sürelerine ait peşin ödenecek ücretin hesabında 32 nci maddenin birinci fıkrasında yazılan ücrete ek olarak işçiye sağlanmış para veya para ile ölçülmesi mümkün sözleşme ve Kanundan doğan menfaatler de göz önünde tutulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Feshin geçerli sebebe dayandırılması">
      <mvz-fıkra no="1">
        <template>Otuz veya daha fazla işçi çalıştıran işyerlerinde en az altı aylık kıdemi olan işçinin belirsiz süreli iş sözleşmesini fesheden işveren, işçinin yeterliliğinden veya davranışlarından ya da işletmenin, işyerinin veya işin gereklerinden kaynaklanan geçerli bir sebebe dayanmak zorundadır.  Yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Altı aylık kıdem hesabında bu Kanunun 66 ncı maddesindeki süreler dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Özellikle aşağıdaki hususlar fesih için geçerli bir sebep oluşturmaz:</template>
        <mvz-bent no="a">
          <template>Sendika üyeliği veya çalışma saatleri dışında veya işverenin rızası ile çalışma saatleri içinde sendikal faaliyetlere katılmak.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İşyeri sendika temsilciliği yapmak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Mevzuattan veya sözleşmeden doğan haklarını takip veya yükümlülüklerini yerine getirmek için işveren aleyhine idari veya adli makamlara başvurmak veya bu hususta başlatılmış sürece katılmak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Irk, renk, cinsiyet, medeni hal, aile yükümlülükleri, hamilelik, doğum, din, siyasi görüş ve benzeri nedenler.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>74 üncü maddede öngörülen ve kadın işçilerin çalıştırılmasının yasak olduğu sürelerde işe gelmemek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Hastalık veya kaza nedeniyle 25 inci maddenin (I) numaralı bendinin (b) alt bendinde öngörülen bekleme süresinde işe geçici devamsızlık.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İşçinin altı aylık kıdemi, aynı işverenin bir veya değişik işyerlerinde geçen süreler birleştirilerek hesap edilir. İşverenin aynı işkolunda birden fazla işyerinin bulunması halinde, işyerinde çalışan işçi sayısı, bu işyerlerinde çalışan toplam işçi sayısına göre belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşletmenin bütününü sevk ve idare eden işveren vekili ve yardımcıları ile işyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve işten çıkarma yetkisi bulunan işveren vekilleri hakkında bu madde, 19 ve 21 inci maddeler ile 25 inci maddenin son fıkrası uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Sözleşmenin feshinde usul">
      <mvz-fıkra no="1">
        <template>İşveren fesih bildirimini yazılı olarak yapmak ve fesih sebebini açık ve kesin bir şekilde belirtmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Hakkındaki iddialara karşı savunmasını almadan bir işçinin belirsiz süreli iş sözleşmesi, o işçinin davranışı veya verimi ile ilgili nedenlerle feshedilemez. Ancak, işverenin 25 inci maddenin (II) numaralı bendi şartlarına uygun fesih hakkı saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Fesih bildirimine itiraz ve usulü">
      <mvz-fıkra no="1">
        <template>İş sözleşmesi feshedilen işçi, fesih bildiriminde sebep gösterilmediği veya gösterilen sebebin geçerli bir sebep olmadığı iddiası ile fesih bildiriminin tebliği tarihinden itibaren bir ay içinde işe iade talebiyle, İş Mahkemeleri Kanunu hükümleri uyarınca arabulucuya başvurmak zorundadır. Arabuluculuk faaliyeti sonunda anlaşmaya varılamaması hâlinde, son tutanağın düzenlendiği tarihten itibaren, iki hafta içinde iş mahkemesinde dava açılabilir. Taraflar anlaşırlarsa uyuşmazlık aynı sürede iş mahkemesi yerine özel hakeme de götürülebilir. Arabulucuya başvurmaksızın doğrudan dava açılması sebebiyle davanın usulden reddi hâlinde ret kararı taraflara resen tebliğ edilir. Kesinleşen ret kararının da resen tebliğinden itibaren iki hafta içinde arabulucuya başvurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Feshin geçerli bir sebebe dayandığını ispat yükümlülüğü işverene aittir. İşçi, feshin başka bir sebebe dayandığını iddia ettiği takdirde, bu iddiasını ispatla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dava ivedilikle sonuçlandırılır. Mahkemece verilen karar hakkında istinaf yoluna başvurulması hâlinde, bölge adliye mahkemesi ivedilikle ve kesin olarak karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>(İptal)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Geçersiz sebeple yapılan feshin sonuçları">
      <mvz-fıkra no="1">
        <template>İşverence geçerli sebep gösterilmediği veya gösterilen sebebin geçerli olmadığı mahkemece veya özel hakem tarafından tespit edilerek feshin geçersizliğine karar verildiğinde, işveren, işçiyi bir ay içinde işe başlatmak zorundadır. İşçiyi başvurusu üzerine işveren bir ay içinde işe başlatmaz ise, işçiye en az dört aylık ve en çok sekiz aylık ücreti tutarında tazminat ödemekle yükümlü olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mahkeme veya özel hakem feshin geçersizliğine karar verdiğinde, işçinin işe başlatılmaması halinde ödenecek tazminat miktarını da belirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kararın kesinleşmesine kadar çalıştırılmadığı süre için işçiye en çok dört aya kadar doğmuş bulunan ücret ve diğer hakları ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Mahkeme veya özel hakem, ikinci fıkrada düzenlenen tazminat ile üçüncü fıkrada düzenlenen ücret ve diğer hakları, dava tarihindeki ücreti esas alarak parasal olarak belirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşçi işe başlatılırsa, peşin olarak ödenen bildirim süresine ait ücret ile kıdem tazminatı, yukarıdaki fıkra hükümlerine göre yapılacak ödemeden mahsup edilir. İşe başlatılmayan işçiye bildirim süresi verilmemiş veya bildirim süresine ait ücret peşin ödenmemişse, bu sürelere ait ücret tutarı ayrıca ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İşçi kesinleşen mahkeme veya özel hakem kararının tebliğinden itibaren on işgünü içinde işe başlamak için işverene başvuruda bulunmak zorundadır. İşçi bu süre içinde başvuruda bulunmaz ise, işverence yapılmış olan fesih geçerli bir fesih sayılır ve işveren sadece bunun hukuki sonuçları ile sorumlu olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Arabuluculuk faaliyeti sonunda tarafların, işçinin işe başlatılması konusunda anlaşmaları hâlinde;</template>
        <mvz-bent no="a">
          <template>İşe başlatma tarihini,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Üçüncü fıkrada düzenlenen ücret ve diğer hakların parasal miktarını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İşçinin işe başlatılmaması durumunda ikinci fıkrada düzenlenen tazminatın parasal miktarını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>belirlemeleri zorunludur. Aksi takdirde anlaşma sağlanamamış sayılır ve son tutanak buna göre düzenlenir. İşçinin kararlaştırılan tarihte işe başlamaması hâlinde fesih geçerli hâle gelir ve işveren sadece bunun hukuki sonuçları ile sorumlu olur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu maddenin birinci, ikinci ve üçüncü fıkra hükümleri sözleşmeler ile hiçbir suretle değiştirilemez; aksi yönde sözleşme hükümleri geçersizdir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Çalışma koşullarında değişiklik ve iş sözleşmesinin feshi">
      <mvz-fıkra no="1">
        <template>İşveren, iş sözleşmesiyle veya iş sözleşmesinin eki niteliğindeki personel yönetmeliği ve benzeri kaynaklar ya da işyeri uygulamasıyla oluşan çalışma koşullarında esaslı bir değişikliği ancak durumu işçiye yazılı olarak bildirmek suretiyle yapabilir. Bu şekle uygun olarak yapılmayan ve işçi tarafından altı işgünü içinde yazılı olarak kabul edilmeyen değişiklikler işçiyi bağlamaz. İşçi değişiklik önerisini bu süre içinde kabul etmezse, işveren değişikliğin geçerli bir nedene dayandığını veya fesih için başka bir geçerli nedenin bulunduğunu yazılı olarak açıklamak ve bildirim süresine uymak suretiyle iş sözleşmesini feshedebilir. İşçi bu durumda 17 ila 21 inci madde hükümlerine göre dava açabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Taraflar aralarında anlaşarak çalışma koşullarını her zaman değiştirebilir. Çalışma koşullarında değişiklik geçmişe etkili olarak yürürlüğe konulamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Yeni işverenin sorumluluğu">
      <mvz-fıkra no="1">
        <template>Süresi belirli olan veya olmayan sürekli iş sözleşmesi ile bir işverenin işine girmiş olan işçi, sözleşme süresinin bitmesinden önce yahut bildirim süresine uymaksızın işini bırakıp başka bir işverenin işine girerse sözleşmenin bu suretle feshinden ötürü, işçinin sorumluluğu yanında, ayrıca yeni işveren de aşağıdaki hallerde birlikte sorumludur:</template>
        <mvz-bent no="a">
          <template>İşçinin bu davranışına, yeni işe girdiği işveren sebep olmuşsa.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yeni işveren, işçinin bu davranışını bilerek onu işe almışsa.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yeni işveren işçinin bu davranışını öğrendikten sonra dahi onu çalıştırmaya devam ederse.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="İşçinin haklı nedenle derhal fesih hakkı">
      <mvz-fıkra no="1">
        <template>Süresi belirli olsun veya olmasın işçi, aşağıda yazılı hallerde iş sözleşmesini sürenin bitiminden önce veya bildirim süresini beklemeksizin feshedebilir:</template>
        <mvz-bent no="I.">
          <template>Sağlık sebepleri:</template>
          <mvz-altbent no="a">
            <template>İş sözleşmesinin konusu olan işin yapılması işin niteliğinden doğan bir sebeple işçinin sağlığı veya yaşayışı için tehlikeli olursa.</template>
          </mvz-altbent>
          <mvz-altbent no="b">
            <template>İşçinin sürekli olarak yakından ve doğrudan buluşup görüştüğü işveren yahut başka bir işçi bulaşıcı veya işçinin işi ile bağdaşmayan bir hastalığa tutulursa.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="II.">
          <template>Ahlak ve iyiniyet kurallarına uymayan haller ve benzerleri:</template>
          <mvz-altbent no="a">
            <template>İşveren iş sözleşmesi yapıldığı sırada bu sözleşmenin esaslı noktalarından biri hakkında yanlış vasıflar veya şartlar göstermek yahut gerçeğe uygun olmayan bilgiler vermek veya sözler söylemek suretiyle işçiyi yanıltırsa.</template>
          </mvz-altbent>
          <mvz-altbent no="b">
            <template>İşveren işçinin veya ailesi üyelerinden birinin şeref ve namusuna dokunacak şekilde sözler söyler, davranışlarda bulunursa veya işçiye cinsel tacizde bulunursa.</template>
          </mvz-altbent>
          <mvz-altbent no="c">
            <template>İşveren işçiye veya ailesi üyelerinden birine karşı sataşmada bulunur veya gözdağı verirse, yahut işçiyi veya ailesi üyelerinden birini kanuna karşı davranışa özendirir, kışkırtır, sürükler, yahut işçiye ve ailesi üyelerinden birine karşı hapsi gerektiren bir suç işlerse yahut işçi hakkında şeref ve haysiyet kırıcı asılsız ağır isnad veya ithamlarda bulunursa.</template>
          </mvz-altbent>
          <mvz-altbent no="d">
            <template>İşçinin diğer bir işçi veya üçüncü kişiler tarafından işyerinde cinsel tacize uğraması ve bu durumu işverene bildirmesine rağmen gerekli önlemler alınmazsa.</template>
          </mvz-altbent>
          <mvz-altbent no="e">
            <template>İşveren tarafından işçinin ücreti kanun hükümleri veya sözleşme şartlarına uygun olarak hesap edilmez veya ödenmezse,</template>
          </mvz-altbent>
          <mvz-altbent no="f">
            <template>Ücretin parça başına veya iş tutarı üzerinden ödenmesi kararlaştırılıp da işveren tarafından işçiye yapabileceği sayı ve tutardan az iş verildiği hallerde, aradaki ücret farkı zaman esasına göre ödenerek işçinin eksik aldığı ücret karşılanmazsa, yahut çalışma şartları uygulanmazsa.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="III.">
          <template>Zorlayıcı sebepler:</template>
          <mvz-altbent no="0">
            <template>İşçinin çalıştığı işyerinde bir haftadan fazla süre ile işin durmasını gerektirecek zorlayıcı sebepler ortaya çıkarsa.</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="İşverenin haklı nedenle derhal fesih hakkı">
      <mvz-fıkra no="1">
        <template>Süresi belirli olsun veya olmasın işveren, aşağıda yazılı hallerde iş sözleşmesini sürenin bitiminden önce veya bildirim süresini beklemeksizin feshedebilir:</template>
        <mvz-bent no="I.">
          <template>Sağlık sebepleri:</template>
          <mvz-altbent no="a">
            <template>İşçinin kendi kastından veya derli toplu olmayan yaşayışından yahut içkiye düşkünlüğünden doğacak bir hastalığa yakalanması veya engelli hâle gelmesi durumunda, bu sebeple doğacak devamsızlığın ardı ardına üç iş günü veya bir ayda beş iş gününden fazla sürmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="b">
            <template>İşçinin tutulduğu hastalığın tedavi edilemeyecek nitelikte olduğu ve işyerinde çalışmasında sakınca bulunduğunun Sağlık Kurulunca saptanması durumunda.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>(a) alt bendinde sayılan sebepler dışında işçinin hastalık, kaza, doğum ve gebelik gibi hallerde işveren için iş sözleşmesini bildirimsiz fesih hakkı; belirtilen hallerin işçinin işyerindeki çalışma süresine göre 17 nci maddedeki bildirim sürelerini altı hafta aşmasından sonra doğar. Doğum ve gebelik hallerinde bu süre 74 üncü maddedeki sürenin bitiminde başlar. Ancak işçinin iş sözleşmesinin askıda kalması nedeniyle işine gidemediği süreler için ücret işlemez.</template>
        </mvz-bent>
        <mvz-bent no="II.">
          <template>Ahlak ve iyi niyet kurallarına uymayan haller ve benzerleri:</template>
          <mvz-altbent no="a">
            <template>İş sözleşmesi yapıldığı sırada bu sözleşmenin esaslı noktalarından biri için gerekli vasıflar veya şartlar kendisinde bulunmadığı halde bunların kendisinde bulunduğunu ileri sürerek, yahut gerçeğe uygun olmayan bilgiler veya sözler söyleyerek işçinin işvereni yanıltması.</template>
          </mvz-altbent>
          <mvz-altbent no="b">
            <template>İşçinin, işveren yahut bunların aile üyelerinden birinin şeref ve namusuna dokunacak sözler sarfetmesi veya davranışlarda bulunması, yahut işveren hakkında şeref ve haysiyet kırıcı asılsız ihbar ve isnadlarda bulunması.</template>
          </mvz-altbent>
          <mvz-altbent no="c">
            <template>İşçinin işverenin başka bir işçisine cinsel tacizde bulunması.</template>
          </mvz-altbent>
          <mvz-altbent no="d">
            <template>İşçinin işverene yahut onun ailesi üyelerinden birine yahut işverenin başka işçisine sataşması, işyerine sarhoş yahut uyuşturucu madde almış olarak gelmesi ya da işyerinde bu maddeleri kullanması.</template>
          </mvz-altbent>
          <mvz-altbent no="e">
            <template>İşçinin, işverenin güvenini kötüye kullanmak, hırsızlık yapmak, işverenin meslek sırlarını ortaya atmak gibi doğruluk ve bağlılığa uymayan davranışlarda bulunması.</template>
          </mvz-altbent>
          <mvz-altbent no="f">
            <template>İşçinin, işyerinde, yedi günden fazla hapisle cezalandırılan ve cezası ertelenmeyen bir suç işlemesi.</template>
          </mvz-altbent>
          <mvz-altbent no="g">
            <template>İşçinin işverenden izin almaksızın veya haklı bir sebebe dayanmaksızın ardı ardına iki işgünü veya bir ay içinde iki defa herhangi bir tatil gününden sonraki iş günü, yahut bir ayda üç işgünü işine devam etmemesi.</template>
          </mvz-altbent>
          <mvz-altbent no="h">
            <template>İşçinin yapmakla ödevli bulunduğu görevleri kendisine hatırlatıldığı halde yapmamakta ısrar etmesi.</template>
          </mvz-altbent>
          <mvz-altbent no="ı">
            <template>İşçinin kendi isteği veya savsaması yüzünden işin güvenliğini tehlikeye düşürmesi, işyerinin malı olan veya malı olmayıp da eli altında bulunan makineleri, tesisatı veya başka eşya ve maddeleri otuz günlük ücretinin tutarıyla ödeyemeyecek derecede hasara ve kayba uğratması.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="III.">
          <template>Zorlayıcı sebepler:</template>
          <mvz-altbent no="0">
            <template>İşçiyi işyerinde bir haftadan fazla süre ile çalışmaktan alıkoyan zorlayıcı bir sebebin ortaya çıkması.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="IV.">
          <template>İşçinin gözaltına alınması veya tutuklanması halinde devamsızlığın 17 nci maddedeki bildirim süresini aşması.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">  
        <template>İşçi feshin yukarıdaki bentlerde öngörülen sebeplere uygun olmadığı iddiası ile 18, 20 ve 21 inci madde hükümleri çerçevesinde yargı yoluna başvurabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Derhal fesih hakkını kullanma süresi">
      <mvz-fıkra no="1">
        <template>24 ve 25 inci maddelerde gösterilen ahlak ve iyiniyet kurallarına uymayan hallere dayanarak işçi veya işveren için tanınmış olan sözleşmeyi fesih yetkisi, iki taraftan birinin bu çeşit davranışlarda bulunduğunu diğer tarafın öğrendiği günden başlayarak altı iş günü geçtikten ve her halde fiilin gerçekleşmesinden itibaren bir yıl sonra kullanılamaz. Ancak işçinin olayda maddi çıkar sağlaması halinde bir yıllık süre uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu haller sebebiyle işçi yahut işverenden iş sözleşmesini yukarıdaki fıkrada öngörülen süre içinde feshedenlerin diğer taraftan tazminat hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Yeni iş arama izni">
      <mvz-fıkra no="1">
        <template>Bildirim süreleri içinde işveren, işçiye yeni bir iş bulması için gerekli olan iş arama iznini iş saatleri içinde ve ücret kesintisi yapmadan vermeye mecburdur. İş arama izninin süresi günde iki saatten az olamaz ve işçi isterse iş arama izin saatlerini birleştirerek toplu kullanabilir. Ancak iş arama iznini toplu kullanmak isteyen işçi, bunu işten ayrılacağı günden evvelki günlere rastlatmak ve bu durumu işverene bildirmek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşveren yeni iş arama iznini vermez veya eksik kullandırırsa o süreye ilişkin ücret işçiye ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşveren, iş arama izni esnasında işçiyi çalıştırır ise işçinin izin kullanarak bir çalışma karşılığı olmaksızın alacağı ücrete ilaveten, çalıştırdığı sürenin ücretini yüzde yüz zamlı öder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Çalışma belgesi">
      <mvz-fıkra no="1">
        <template>İşten ayrılan işçiye, işveren tarafından işinin çeşidinin ne olduğunu ve süresini gösteren bir belge verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Belgenin vaktinde verilmemesinden veya belgede doğru olmayan bilgiler bulunmasından zarar gören işçi veyahut işçiyi işine alan yeni işveren eski işverenden tazminat isteyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu belgeler her türlü resim ve harçtan muaftır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Toplu işçi çıkarma">
      <mvz-fıkra no="1">
        <template>İşveren; ekonomik, teknolojik, yapısal ve benzeri işletme, işyeri veya işin gerekleri sonucu toplu işçi çıkarmak istediğinde, bunu en az otuz gün önceden bir yazı ile, işyeri sendika temsilcilerine, ilgili bölge müdürlüğüne ve Türkiye İş Kurumuna bildirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşyerinde çalışan işçi sayısı:</template>
        <mvz-bent no="a">
          <template>20 ile 100 işçi arasında ise, en az 10 işçinin,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>101 ile 300 işçi arasında ise, en az yüzde on oranında işçinin,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>301 ve daha fazla ise, en az 30 işçinin,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İşine 17 nci madde uyarınca ve bir aylık süre içinde aynı tarihte veya farklı tarihlerde son verilmesi toplu işçi çıkarma sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkra uyarınca yapılacak bildirimde işçi çıkarmanın sebepleri, bundan etkilenecek işçi sayısı ve grupları ile işe son verme işlemlerinin hangi zaman diliminde gerçekleşeceğine ilişkin bilgilerin bulunması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bildirimden sonra işyeri sendika temsilcileri ile işveren arasında yapılacak görüşmelerde, toplu işçi çıkarmanın önlenmesi ya da çıkarılacak işçi sayısının azaltılması yahut çıkarmanın işçiler açısından olumsuz etkilerinin en aza indirilmesi konuları ele alınır. Görüşmelerin sonunda, toplantının yapıldığını gösteren bir belge düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Fesih bildirimleri, işverenin toplu işçi çıkarma isteğini bölge müdürlüğüne bildirmesinden otuz gün sonra hüküm doğurur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İşyerinin bütünüyle kapatılarak kesin ve devamlı suretle faaliyete son verilmesi halinde, işveren sadece durumu en az otuz gün önceden ilgili bölge müdürlüğüne ve Türkiye İş Kurumuna bildirmek ve işyerinde ilan etmekle yükümlüdür. İşveren toplu işçi çıkarmanın kesinleşmesinden itibaren altı ay içinde aynı nitelikteki iş için yeniden işçi almak istediği takdirde nitelikleri uygun olanları tercihen işe çağırır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Mevsim ve kampanya işlerinde çalışan işçilerin işten çıkarılmaları hakkında, işten çıkarma bu işlerin niteliğine bağlı olarak yapılıyorsa, toplu işçi çıkarmaya ilişkin hükümler uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>İşveren toplu işçi çıkarılmasına ilişkin hükümleri 18, 19, 20 ve 21 inci madde hükümlerinin uygulanmasını engellemek amacıyla kullanamaz; aksi halde işçi bu maddelere göre dava açabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Engelli ve eski hükümlü çalıştırma zorunluluğu">
      <mvz-fıkra no="1">
        <template>İşverenler, elli veya daha fazla işçi çalıştırdıkları özel sektör işyerlerinde yüzde üç engelli, kamu işyerlerinde ise yüzde dört engelli ve yüzde iki eski hükümlü işçiyi veya 21/6/1927 tarihli ve 1111 sayılı Askerlik Kanunu veya 16/6/1927 tarihli ve 1076 sayılı Yedek Subaylar ve Yedek Askeri Memurlar Kanunu kapsamına giren ve askerlik hizmetini yaparken 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanununun 21 inci maddesinde sayılan terör olaylarının sebep ve tesiri sonucu malul sayılmayacak şekilde yaralananları meslek, beden ve ruhi durumlarına uygun işlerde çalıştırmakla yükümlüdürler. Aynı il sınırları içinde birden fazla işyeri bulunan işverenin bu kapsamda çalıştırmakla yükümlü olduğu işçi sayısı, toplam işçi sayısına göre hesaplanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kapsamda çalıştırılacak işçi sayısının tespitinde belirli ve belirsiz süreli iş sözleşmesine göre çalıştırılan işçiler esas alınır. Kısmi süreli iş sözleşmesine göre çalışanlar, çalışma süreleri dikkate alınarak tam süreli çalışmaya dönüştürülür. Oranın hesaplanmasında yarıma kadar kesirler dikkate alınmaz, yarım ve daha fazla olanlar tama dönüştürülür. İşyerinin işçisi iken engelli hâle gelenlere öncelik tanınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşverenler çalıştırmakla yükümlü oldukları işçileri Türkiye İş Kurumu aracılığı ile sağlarlar. Bu kapsamda çalıştırılacak işçilerin nitelikleri, hangi işlerde çalıştırılabilecekleri, bunların işyerlerinde genel hükümler dışında bağlı olacakları özel çalışma ile mesleğe yöneltilmeleri, mesleki yönden işverence nasıl işe alınacakları, Aile ve Sosyal Politikalar Bakanlığının görüşü alınarak Çalışma ve Sosyal Güvenlik Bakanlığınca çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yer altı ve su altı işlerinde engelli işçi çalıştırılamaz ve yukarıdaki hükümler uyarınca işyerlerindeki işçi sayısının tespitinde yer altı ve su altı işlerinde çalışanlar hesaba katılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bir işyerinden malulen ayrılmak zorunda kalıp da sonradan maluliyeti ortadan kalkan işçiler eski işyerlerinde tekrar işe alınmalarını istedikleri takdirde, işveren bunları eski işleri veya benzeri işlerde boş yer varsa derhal, yoksa boşalacak ilk işe başka isteklilere tercih ederek, o andaki şartlarla işe almak zorundadır. Aranan şartlar bulunduğu halde işveren iş sözleşmesi yapma yükümlülüğünü yerine getirmezse, işe alınma isteğinde bulunan eski işçiye altı aylık ücret tutarında tazminat öder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Özel sektör işverenlerince bu madde kapsamında çalıştırılan 17/7/1964 tarihli ve 506 sayılı Sosyal Sigortalar Kanununa tabi engelli sigortalılar ile 1/7/2005 tarihli ve 5378 sayılı Kanunun 14 üncü maddesinde belirtilen korumalı işyerlerinde çalıştırılan engelli sigortalıların, aynı Kanunun 72 nci ve 73 üncü maddelerinde sayılan ve 78 inci maddesiyle belirlenen prime esas kazanç alt sınırı üzerinden hesaplanan sigorta primine ait işveren hisselerinin tamamı, kontenjan fazlası engelli çalıştıran, yükümlü olmadıkları halde engelli çalıştıran işverenlerin bu şekilde çalıştırdıkları her bir engelli için prime esas kazanç alt sınırı üzerinden hesaplanan sigorta primine ait işveren hisselerinin tamamı Hazinece karşılanır. İşveren hissesine ait primlerin Hazinece karşılanabilmesi için işverenlerin çalıştırdıkları sigortalılarla ilgili olarak 506 sayılı Kanun uyarınca aylık prim ve hizmet belgelerinin yasal süresi içerisinde Sosyal Güvenlik Kurumuna verilmesi ve sigortalıların tamamına ait sigorta primlerinin sigortalı hissesine isabet eden tutarı ile Hazinece karşılanmayan işveren hissesine ait tutarın ödenmiş olması şarttır. Bu fıkraya göre işveren tarafından ödenmesi gereken primlerin geç ödenmesi halinde, Hazinece Sosyal Güvenlik Kurumuna yapılacak ödemenin gecikmesinden kaynaklanan gecikme zammı, işverenden tahsil edilir. Hazinece karşılanan prim tutarları gelir ve kurumlar vergisi uygulamalarında gider veya maliyet unsuru olarak dikkate alınmaz.  Bu fıkrada düzenlenen teşvik, kamu idareleri hariç 506 sayılı Kanun kapsamındaki sigortalılara ilişkin matrah ve oranlar üzerinden olmak üzere, 506 sayılı Kanunun geçici 20 nci maddesi kapsamındaki sandıkların statülerine tabi personeli için de uygulanır. Bu fıkranın uygulanmasına ilişkin usul ve esaslar Maliye Bakanlığı ile Çalışma ve Sosyal Güvenlik Bakanlığı ve Hazine Müsteşarlığı tarafından müştereken belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu maddeye aykırılık hallerinde 101 inci madde uyarınca tahsil edilecek cezalar, engellilerin ve eski hükümlülerin kendi işini kurmaları, engellinin iş bulmasını sağlayacak destek teknolojileri, engellinin işe yerleştirilmesi, işe ve işyerine uyumunun sağlanması ve bu gibi projelerde kullanılır. Tahsil edilen cezaların kullanımına ilişkin hususlar, Türkiye İş Kurumunun koordinatörlüğünde, Çalışma ve Sosyal Güvenlik Bakanlığı Çalışma Genel Müdürlüğü ile İş Sağlığı ve Güvenliği Genel Müdürlüğü, Aile ve Sosyal Politikalar Bakanlığı Engelli ve Yaşlı Hizmetleri Genel Müdürlüğü, Adalet Bakanlığı Ceza ve Tevkif Evleri Genel Müdürlüğü, en çok işçi ve işvereni temsil eden üst kuruluşların ve en çok engelliyi temsil eden üst kuruluşun birer temsilcisinden oluşan komisyon tarafından karara bağlanır. Komisyonun çalışma usul ve esasları Çalışma ve Sosyal Güvenlik Bakanlığınca çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Eski hükümlü çalıştırılmasında, kanunlardaki kamu güvenliği ile ilgili hizmetlere ilişkin özel hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Askerlik ve kanundan doğan çalışma">
      <mvz-fıkra no="1">
        <template>Muvazzaf askerlik ödevi dışında manevra veya herhangi bir sebeple silah altına alınan veyahut herhangi bir kanundan doğan çalışma ödevi yüzünden işinden ayrılan işçinin iş sözleşmesi işinden ayrıldığı günden başlayarak iki ay sonra işverence feshedilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşçinin bu haktan faydalanabilmesi için o işte en az bir yıl çalışmış olması şarttır. Bir yıldan çok çalışmaya karşılık her fazla yıl için, ayrıca iki gün eklenir. Şu kadar ki bu sürenin tamamı doksan günü geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İş sözleşmesinin feshedilmiş sayılabilmesi için beklenilmesi gereken süre içinde işçinin ücreti işlemez. Ancak özel kanunların bu husustaki hükümleri saklıdır. Bu süre içinde iş sözleşmesinin Kanundan doğan başka bir sebebe dayanılarak işveren veya işçi tarafından feshedildiği öteki tarafa bildirilmiş olsa bile, fesih için Kanunun gösterdiği süre bu sürenin bitiminden sonra işlemeye başlar. Ancak iş sözleşmesi belirli süreli olarak yapılmış ve sözleşme yukarıda yazılı süre içinde kendiliğinden sona eriyorsa bu madde hükümleri uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Herhangi bir askeri ve kanuni ödev dolayısıyla işinden ayrılan işçiler bu ödevin sona ermesinden başlayarak iki ay içinde işe girmek istedikleri takdirde işveren bunları eski işleri veya benzeri işlerde boş yer varsa derhal, yoksa boşalacak ilk işe başka isteklilere tercih ederek, o andaki şartlarla işe almak zorundadır. Aranan şartlar bulunduğu halde işveren iş sözleşmesi yapma yükümlülüğünü yerine getirmezse, işe alınma isteğinde bulunan eski işçiye üç aylık ücret tutarında tazminat öder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Ücret">
    <mvz-madde no="32" başlık="Ücret ve ücretin ödenmesi">
      <mvz-fıkra no="1">
        <template>Genel anlamda ücret bir kimseye bir iş karşılığında işveren veya üçüncü kişiler tarafından sağlanan ve para ile ödenen tutardır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkak kural olarak, Türk parası ile işyerinde veya özel olarak açılan bir banka hesabına ödenir. Ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkak, yabancı para olarak kararlaştırılmış ise ödeme günündeki rayice göre Türk parası ile ödeme yapılabilir. Çalıştırılan işçilerin ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakının özel olarak açılan banka hesabına yatırılmak suretiyle ödenmesi hususunda; tabi olduğu vergi mükellefiyeti türü, işletme büyüklüğü, çalıştırdığı işçi sayısı, işyerinin bulunduğu il ve benzeri gibi unsurları dikkate alarak işverenleri veya üçüncü kişileri zorunlu tutmaya, banka hesabına yatırılacak ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakının, brüt ya da kanuni kesintiler düşüldükten sonra kalan net miktar üzerinden olup olmayacağını belirlemeye Çalışma ve Sosyal Güvenlik Bakanlığı, Maliye Bakanlığı ve Hazine Müsteşarlığından sorumlu Devlet Bakanlığı müştereken yetkilidir. Çalıştırdığı işçilerin ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakını özel olarak açılan banka hesapları vasıtasıyla ödeme zorunluluğuna tabi tutulan işverenler veya üçüncü kişiler, işçilerinin ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkaklarını özel olarak açılan banka hesapları dışında ödeyemezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İşçinin ücret, prim, ikramiye ve bu nitelikteki her çeşit istihkakının özel olarak açılan banka hesaplarına yatırılmak suretiyle ödenmesine ilişkin diğer usûl ve esaslar anılan bakanlıklarca müştereken çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Emre muharrer senetle (bono ile), kuponla veya yurtta geçerli parayı temsil ettiği iddia olunan bir senetle veya diğer herhangi bir şekilde ücret ödemesi yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Ücret en geç ayda bir ödenir. İş sözleşmeleri veya toplu iş sözleşmeleri ile ödeme süresi bir haftaya kadar indirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İş sözleşmelerinin sona ermesinde, işçinin ücreti ile sözleşme ve Kanundan doğan para ile ölçülmesi mümkün menfaatlerinin tam olarak ödenmesi zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Meyhane ve benzeri eğlence yerleri ve perakende mal satan dükkan ve mağazalarda, buralarda çalışanlar hariç, ücret ödemesi yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Ücret alacaklarında zamanaşımı süresi beş yıldır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="33" başlık="İşverenin ödeme aczine düşmesi">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="34" başlık="Ücretin gününde ödenmemesi">
      <mvz-fıkra no="1">
        <template>Ücreti ödeme gününden itibaren yirmi gün içinde mücbir bir neden dışında ödenmeyen işçi, iş görme borcunu yerine getirmekten kaçınabilir. Bu nedenle kişisel kararlarına dayanarak iş görme borcunu yerine getirmemeleri sayısal olarak toplu bir nitelik kazansa dahi grev olarak nitelendirilemez. Gününde ödenmeyen ücretler için mevduata uygulanan en yüksek faiz oranı uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu işçilerin bu nedenle iş akitleri çalışmadıkları için feshedilemez ve yerine yeni işçi alınamaz, bu işler başkalarına yaptırılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="35" başlık="Ücretin saklı kısmı">
      <mvz-fıkra no="1">
        <template>İşçilerin aylık ücretlerinin dörtte birinden fazlası haczedilemez veya başkasına devir ve temlik olunamaz. Ancak, işçinin bakmak zorunda olduğu aile üyeleri için hakim tarafından takdir edilecek miktar bu paraya dahil değildir. Nafaka borcu alacaklılarının hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="36" başlık="Kamu makamlarının ve asıl işverenlerin hakedişlerinden ücreti kesme yükümlülüğü">
      <mvz-fıkra no="1">
        <template>Genel ve katma bütçeli dairelerle mahalli idareler veya kamu iktisadi teşebbüsleri yahut özel kanuna veya Cumhurbaşkanlığı kararnamesine dayanılarak kurulan banka ve kuruluşlar; asıl işverenler müteahhide verdikleri her türlü bina, köprü, hat ve yol inşası gibi yapım ve onarım işlerinde çalışan işçilerden müteahhit veya taşeronlarca ücretleri ödenmeyenlerin bulunup bulunmadığının kontrolü, ya da ücreti ödenmeyen işçinin başvurusu üzerine, ücretleri ödenmeyen varsa müteahhitten veya taşeronlardan istenecek bordrolara göre bu ücretleri bunların hakedişlerinden öderler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bunun için hakediş ödeneceği ilgili idare tarafından işyerinde şantiye şefliği işyeri ilân tahtası veya işçilerin toplu bulunduğu yerler gibi işçilerin görebileceği yerlere yazılı ilân asılmak suretiyle duyurulur. Ücret alacağı olan işçilerin her hakediş dönemi için olan ücret alacaklarının üç aylık tutarından fazlası hakkında adı geçen idarelere herhangi bir sorumluluk düşmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Anılan müteahhitlerin bu işverenlerdeki her çeşit teminat ve hakedişleri üzerinde yapılacak her türlü devir ve el değiştirme işlemleri veya haciz ve icra takibi bu işte çalışan işçilerin ücret alacaklarını karşılayacak kısım ayrıldıktan sonra, kalan kısım üzerinde hüküm ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bir işverenin üçüncü kişiye karşı olan borçlarından dolayı işyerinde bulunan tesisat, malzeme, ham, yarı işlenmiş ve tam işlenmiş mallar ve başka kıymetler üzerinde yapılacak haciz ve icra takibi, bu işyerinde çalışan işçilerin icra kararının alındığı tarihten önceki üç aylık dönem içindeki ücret alacaklarını karşılayacak kısım ayrıldıktan sonra, kalan kısım üzerinde hüküm ifade eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İşverenler, alt işverene iş vermeleri hâlinde, bunların işçilerinin ücretlerinin ödenip ödenmediğini işçinin başvurusu üzerine veya aylık olarak resen kontrol etmekle ve varsa ödenmeyen ücretleri hak edişlerinden keserek işçilerin banka hesabına yatırmakla yükümlüdür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Ücret hesap pusulası">
      <mvz-fıkra no="1">
        <template>İşveren işyerinde veya bankaya yaptığı ödemelerde işçiye ücret hesabını gösterir imzalı veya işyerinin özel işaretini taşıyan bir pusula vermek zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu pusulada ödemenin günü ve ilişkin olduğu dönem ile fazla çalışma, hafta tatili, bayram ve genel tatil ücretleri gibi asıl ücrete yapılan her çeşit eklemeler tutarının ve vergi, sigorta primi, avans mahsubu, nafaka ve icra gibi her çeşit kesintilerin ayrı ayrı gösterilmesi gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu işlemler damga vergisi ve her çeşit resim ve harçtan muaftır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="38" başlık="Ücret kesme cezası">
      <mvz-fıkra no="1">
        <template>İşveren toplu sözleşme veya iş sözleşmelerinde gösterilmiş olan sebepler dışında işçiye ücret kesme cezası veremez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşçi ücretlerinden ceza olarak yapılacak kesintilerin işçiye derhal sebepleriyle beraber bildirilmesi gerekir. İşçi ücretlerinden bu yolda yapılacak kesintiler bir ayda iki gündelikten veya parça başına yahut yapılan iş miktarına göre verilen ücretlerde işçinin iki günlük kazancından fazla olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu paralar işçilerin eğitimi ve sosyal hizmetleri için kullanılıp harcanmak üzere Çalışma ve Sosyal Güvenlik Bakanlığı hesabına Bakanlıkça belirtilecek Türkiye'de kurulu bulunan ve mevduat kabul etme yetkisini haiz bankalardan birine, kesildiği tarihten itibaren bir ay içinde yatırılır. Her işveren işyerinde bu paraların ayrı bir hesabını tutmaya mecburdur. Birikmiş bulunan ceza paralarının nerelere ve ne kadar verileceği Çalışma ve Sosyal Güvenlik Bakanının başkanlık edeceği ve işçi temsilcilerinin de katılacağı bir kurul tarafından karara bağlanır. Bu kurulun kimlerden teşekkül edeceği, nasıl ve hangi esaslara göre çalışacağı çıkarılacak bir yönetmelikte gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="39" başlık="Asgari ücret">
      <mvz-fıkra no="1">
