  <mvz-künye tür="kanun" no="4708" başlık="YAPI DENETİMİ HAKKINDA KANUN"
             tarih="29/6/2001" rgazete-tarih="13/7/2001" rgazete-sayı="24461"
             düstur-tertip="5" düstur-cilt="40" />
    
  <mvz-madde no="1" başlık="Amaç, kapsam ve tanımlar">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı; can ve mal güvenliğini teminen, imar plânına, fen, sanat ve sağlık kurallarına, standartlara uygun kaliteli yapı yapılması için proje ve yapı denetimini sağlamak ve yapı denetimine ilişkin usul ve esasları düzenlemektir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun;</template>
      <mvz-bent no="a">
        <template>3/5/1985 tarihli ve 3194 sayılı İmar Kanununun 26 ncı maddesinde belirtilen kamuya ait yapı ve tesisler ile 27 nci maddesinde belirtilen ruhsata tabi olmayan yapılar,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Bodrum katı dışında en çok iki katlı ve yapı inşaat alanı toplam 200 metrekareyi geçmeyen müstakil yapılar,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Entegre tesis niteliğinde olmayan tarım ve hayvancılık amaçlı yapı ve tesisler,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Güneş enerjisi santralleri, rüzgâr enerjisi santralleri,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Köy yerleşik alanlarında, belediye ve mücavir alan sınırları içinde olmayan iskân dışı alanlarda ve nüfusu 5000’in altında olan belediyelerin belediye ve mücavir alan sınırları içinde bodrum katı ve çatı arası dışında en çok iki katlı ve yalnızca bir bodrum katın inşaat alanı hesaba katılmaksızın toplam inşaat alanı 500 metrekareyi geçmeyen konut yapıları ile bunların kömürlük, otopark, depo gibi müştemilatı,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>hariç olmak üzere, belediye ve mücavir alan sınırları içinde ve dışında kalan yerlerde yapılacak yapıların denetimini kapsar. Ruhsata tabi olup, bu Kanun hükümlerine tabi olmayan yapılarda denetime yönelik fennî mesuliyet 3194 sayılı İmar Kanununun 26 ncı ve 28 inci maddelerine göre mimar ve mühendislerce üstlenilir. Birden fazla müstakil yapının bulunduğu parsellerde, bütün yapıların toplam yapı inşaat alanının 200 metrekareyi geçmesi hâlinde de bu Kanun uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu Kanunun uygulanmasında;</template>
      <mvz-bent no="a">
        <template>Bakanlık : Çevre, Şehircilik ve İklim Değişikliği Bakanlığını,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>İlgili idare :Belediye ve mücavir alan sınırları içindeki uygulamalar için büyükşehir belediyeleri ile diğer belediyeleri, bu alanlar dışında kalan alanlarda valilikleri, yapı ruhsatı ve kullanma izin belgesi verme yetkisine sahip diğer idareleri,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Yapı sahibi : Yapı üzerinde mülkiyet hakkına sahip olan gerçek ve tüzel kişileri,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Yapım süresi :Yapı sahibinin, yapı ruhsatını aldığı tarih ile yapı kullanma iznini aldığı tarih arasındaki dönemi,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Yapı inşaat alanı : Işıklıklar hariç, bodrum kat, asma kat ve çatı arasında yer alan mekanlar ve ortak alanlar dahil yapının inşa edilen tüm katlarının alanını,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Hizmet bedeline esas yapı yaklaşık maliyeti: Binalarda, yapı inşaat alanının, Bakanlıkça Yönetmelik ile belirlenen birim maliyeti veya birim maliyetleri ile çarpımından elde edilen bedeli,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Taşıyıcı sistem :Yapıların; temel, betonarme, ahşap, çelik karkas, duvar, döşeme ve çatı gibi yük taşıyan ve aktaran bölümlerini ve istinat yapılarını,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Yapı hasarı : Kullanımdan doğan hasarlar hariç, yapının fen ve sanat kurallarına aykırı, eksik, hatalı ve kusurlu yapılması nedeniyle yapıda meydana gelen ve yapının kullanımını engelleyen veya yapıda değer kaybı oluşturan her türlü hasarı,</template>
      </mvz-bent>
      <mvz-bent no="ı">
        <template>Yapı denetim kuruluşu :Bakanlıktan aldığı izin belgesi ile münhasıran yapı denetimi görevini yapan, ortaklarının tamamı mimar ve mühendislerden oluşan tüzel kişiyi,</template>
      </mvz-bent>
      <mvz-bent no="j">
        <template>Yapı müteahhidi :Yapım işini, yapı sahibine karşı taahhüt eden veya ticarî amaçla ya da kendisi için şahsî finans kaynaklarını kullanarak üstlenen, ilgili meslek odasına kayıtlı, gerçek ve tüzel kişiyi,</template>
      </mvz-bent>
      <mvz-bent no="k">
        <template>Proje müellifi :Mimarlık, mühendislik tasarım hizmetlerini iştigal konusu olarak seçmiş, yapının etüt ve projelerini hazırlayan gerçek ve tüzel kişiyi,</template>
      </mvz-bent>
      <mvz-bent no="l">
        <template>Denetçi mimar ve mühendis :İlgili mühendis ve mimar meslek odalarına üyeliği devam eden ve Bakanlıkça denetçi belgesi verilmiş mühendis ve mimarları,</template>
      </mvz-bent>
      <mvz-bent no="m">
        <template>Laboratuvar : İnşaat, zemin ve yapı malzemeleri ile ilgili ham madde ve mamul madde üzerinde ilgili standartlarına veya teknik şartnamelerine göre ölçüm, muayene, kalibrasyon yapabilen ve diğer özelliklerini tayin eden, Bakanlıktan izin almış tesisi,</template>
      </mvz-bent>
      <mvz-bent no="n">
        <template>Yardımcı kontrol elemanı: Denetçi mimar ve mühendislerin sevk ve idaresi altında görev yapacak olan mimar ve mühendisler ile Bakanlıkça sınırları belirlenen yapı grubu ve inşaat alanına kadar olan yapılarda mimar ve mühendisler yerine yapı denetimi faaliyetlerine katılabilen teknik öğretmen, yüksek tekniker, tekniker ve teknisyenleri,</template>
      </mvz-bent>
      <mvz-bent no="o">
        <template>Bina kimlik sertifikası: Bu Kanun kapsamında denetlenerek tamamlanan yapıların teknik ve genel bilgilerine, Bakanlıkça farklı modüllerde yapılan yetkilendirmelerle, hem yapı sahibi ve ilgili vatandaşlarca hem de kamu görevlileri tarafından ulaşılması amacıyla yapıya asılan sertifikayı,</template>
      </mvz-bent>
      <mvz-bent no="ö">
        <template>Beton üreticisi: Betonun bileşenlerini karıştırarak beton haline getiren ve sevkiyatını sağlayan gerçek veya tüzel kişiyi,</template>
      </mvz-bent>
      <mvz-bent no="p">
        <template>Zemin ve temel etüt kuruluşu: Bakanlıktan aldığı izin belgesiyle zemin ve temel etüdü faaliyetini icra eden ve Bakanlıkça denetlenen, ortaklardan en az birinin jeoloji, jeofizik veya inşaat mühendisi olduğu tüzel kişiyi,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>ifade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Yapı denetim kuruluşları ve görevleri">
    <mvz-fıkra no="1">
      <template>Bu Kanun kapsamına giren her türlü yapı; Bakanlıktan aldığı izin belgesi ile çalışan ve münhasıran yapı denetimi ile uğraşan tüzel kişiliğe sahip yapı denetim kuruluşlarının denetimine tabidir. Yapı denetim hizmeti; yapı denetim kuruluşu ile yapı sahibi veya vekili arasında akdedilen hizmet sözleşmesi hükümlerine göre yürütülür. Yapı sahibi, yapım işi için anlaşma yaptığı yapı müteahhidini vekil tayin edemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yapı denetim kuruluşlarının nama yazılı ödenmiş sermayelerinin tamamının, mimar veya mühendislere ait olması zorunludur. Yapı denetim kuruluşları; denetçi mimar ve mühendisler ile yardımcı kontrol elemanları istihdam eder.  Yetmiş beş yaşını dolduran denetçi mimar ve mühendisler ile yardımcı kontrol elemanları, yapı denetim kuruluşu adına, şantiye mahallinde yapının denetimi görevini yürütemezler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yapı denetim kuruluşları aşağıda belirtilen görevleri yerine getirmekle yükümlüdür:</template>
      <mvz-bent no="a">
        <template>Proje müelliflerince hazırlanan, yapının inşa edileceği arsa veya arazinin zemin ve temel raporları ile uygulama projelerini ilgili mevzuata göre incelemek, proje müelliflerince hazırlanarak doğrudan kendilerine teslim edilen uygulama projesi ve hesaplarını kontrol ederek, ilgili idareler dışında başka bir kurum veya kuruluşun vize veya onayına tabi tutulmadan, ilgili idareye uygunluk görüşünü bildirmek.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Yapı denetimini üstlendiğine dair ilgili idareye taahhütname vermek, bu yapıya ilişkin bilgileri yapı ruhsatı düzenleme tarihinden itibaren yedi gün içinde Bakanlığa bildirmek.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Yapının, ruhsat ve ekleri ile mevzuata uygun olarak yapılmasını denetlemek.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Yapım işlerinde kullanılan malzemeler ile imalatın proje, teknik şartname ve standartlara uygunluğunu kontrol etmek ve sonuçlarını belgelendirmek, malzemeler ve imalatla ilgili deneyleri yaptırmak.</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Yapılan tüm denetim hizmetlerine ilişkin belgelerin bir nüshasını ilgili idareye vermek, denetimleri sırasında yapıda kullanılan malzeme ve imalatın teknik şartname ve standartlara aykırı olduklarını belirledikleri takdirde, durumu bir rapor ile ilgili idareye ve il sanayi ve/veya ticaret müdürlüklerine bildirmek.</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>İşyerinde, çalışmaların, iş sağlığı ve güvenliği mevzuatına göre düzenlenmesi gereken sağlık güvenlik planına uygun olarak yapıldığını kontrol etmek ve gerekli tedbirlerin alınması için yapı müteahhidini yazılı olarak uyarmak, uyarıya uyulmadığı takdirde durumu ilgili Çalışma ve İş Kurumu il müdürlüğüne bildirmek.</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Ruhsat ve eklerine aykırı uygulama yapılması halinde durumu üç iş günü içinde ilgili idareye bildirmek.</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Yapının ruhsat eki projelerine uygun olarak kısmen veya tamamen bitirildiğine dair ilgili idareye rapor vermek.</template>
      </mvz-bent>
      <mvz-bent no="ı">
        <template>Zemin, malzeme ve imalata ilişkin deneyleri, şartname ve standartlara uygun olarak laboratuvarlarda yaptırmak.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Sorumluluklar ve yapılamayacak işler">
    <mvz-fıkra no="1">
      <template>Bu Kanunun uygulanmasında, yapı denetim kuruluşları imar mevzuatı uyarınca öngörülen fennî mesuliyeti ilgili idareye karşı üstlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Yapı denetim kuruluşları öncelikle risk bazlı denetim yapar. Yapı denetim kuruluşları, denetçi mimar ve mühendisler, proje müellifleri, laboratuvar görevlileri ve yapı müteahhidi ile birlikte yapının ruhsat ve eklerine, fen, sanat ve sağlık kurallarına aykırı, eksik, hatalı ve kusurlu yapılmış olması nedeniyle ortaya çıkan yapı hasarından dolayı yapı sahibi ve ilgili idareye karşı, kusurları oranında sorumludurlar. Bu sorumluluğun süresi; yapı kullanma izninin alındığı tarihten itibaren, yapının taşıyıcı sisteminden dolayı on beş yıl, taşıyıcı olmayan diğer kısımlarda ise iki yıldır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Yapıda, yapı kullanma izni alındıktan sonra, ilgili idareden izin alınmadan yapılacak esaslı tadilattan doğacak yapı hasarından, izinsiz tadilat yapan sorumludur. Yapı denetim kuruluşu; yazılı ihtarına rağmen yapı sahibi tarafından önlemi alınmayan, parsel dışında meydana gelen ve yapıda hasar oluşturan yer kayması, çığ düşmesi, kaya düşmesi ve sel baskınından doğan hasarlardan sorumlu değildir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Yapı denetim kuruluşlarının yöneticileri, ortakları, denetçi mimar ve mühendisleri ile proje müellifleri, laboratuvar görevlileri ve yapı müteahhidi; bu Kanunun uygulanmasından dolayı ortaya çıkan yapı hasarından sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yapı denetim kuruluşu denetim faaliyeti dışında başka ticarî faaliyette bulunamaz. Bu kuruluşun denetçi mimar ve mühendislerinin, denetim faaliyeti süresince başkaca meslekî ve inşaat işleri ile ilgili ticarî faaliyette bulunmaları yasaktır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Yapı denetim komisyonları ve görevleri">
    <mvz-fıkra no="1">
      <template>Bu Kanunun uygulanması ile ilgili Bakanlık iş ve işlemlerinin yürütülmesini sağlamak üzere, Bakanlık merkezinde Merkez Yapı Denetim Komisyonu ve illerde İl Yapı Denetim Komisyonları kurulur. İl Yapı Denetim Komisyonları, yapı denetim kuruluşlarına izin belgesi verilmesi hariç Kanunda belirtilen diğer görevleri yapar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Merkez Yapı Denetim Komisyonu, konu ile ilgili Bakanlık personeli arasından, biri başkan olmak üzere Bakanlıkça görevlendirilecek toplam yedi üyeden oluşur ve Bakanlıkça uygun görülen birimin bünyesinde faaliyetlerini yürütür. Bakanlık; gerek görülen konular hakkında çalışmada bulunmak üzere, ilgili kamu kurum ve kuruluşları ile meslek ve sivil toplum kuruluşlarının temsilcilerini Bakanlıkça hazırlanan yönetmelikte belirtilen usul ve esaslar çerçevesinde Komisyonda görevlendirebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İl Yapı Denetim Komisyonu, Çevre ve Şehircilik İl Müdürlüğünün teklifi üzerine, biri başkan olmak üzere Merkez Yapı Denetim Komisyonunca görevlendirilecek toplam beş üyeden oluşur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Yapı denetimi hizmet sözleşmeleri">
    <mvz-fıkra no="1">
      <template>Yapı denetim hizmet sözleşmesi bedeline esas inşaat alanı 500 metrekareye kadar olan yapılarda yapı sahibince belirlenen yapı denetim kuruluşuyla, diğer hizmet sözleşmelerinde ise Bakanlıkça yayımlanacak usul ve esaslara göre o yapı için ilde faaliyet gösteren yapı denetim kuruluşu sayısı da dikkate alınarak elektronik ortamda aynı anda birinci ve ikinci sıralı olarak belirlenen en fazla iki yapı denetim kuruluşundan biriyle, yapı sahibi arasında yapı denetim hizmet sözleşmesi akdedilir. Bu sözleşmenin bir sureti taahhütname ekinde ilgili idareye verilir. Yapı denetim hizmet sözleşmeleri Bakanlıkça belirlenen haller dışında feshedilemez.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu sözleşmede; taahhüt edilen hizmetin konusu, yeri, inşaat alanı, süresi, varsa yapı sahibi ile yapı müteahhidi arasında akdedilen sözleşmede yer alan yapının fizikî özellikleri, yapı denetimi hizmet bedeli, yapı denetiminde görev alacak teknik personel listesi ve diğer yükümlülükler yer alır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İlgili idare; yapı denetimi hizmet sözleşmesinde yer alan hükümlere, yapı sahibinin uymaması halinde yapı tatil tutanağı düzenleyerek inşaatı durdurur, yapı denetim kuruluşunun uymaması halinde ise yapı denetimi komisyonuna bildirimde bulunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Yapı denetimi hizmeti için yapı denetim kuruluşuna ödenecek hizmet bedeli, yapı denetimi hizmet sözleşmesinde belirtilir. Bu bedel, yapı denetim hizmet sözleşmesi bedeline esas yapı inşaat alanı 1.000  metrekareye kadar olan yapılarda hizmet bedeline esas yapı yaklaşık maliyetinin %1,75’i, yapı denetim hizmet sözleşmesi bedeline esas yapı inşaat alanı 1.001 metrekareden 50.000  metrekareye kadar olan yapılarda hizmet bedeline esas yapı yaklaşık maliyetinin %1,5’i, diğer yapılarda hizmet bedeline esas yapı yaklaşık maliyetinin %1,25’i kadardır. Elektronik dağıtıma tabi olmayan işlerde, ikinci cümlede belirtilen oran en fazla %3,50’ye kadar artırılabilir. Hizmet bedeli oranı, yapım süresi bir yılı aşan iş için yıllık %5 artırılır. Güçlendirme işleri için belirlenecek yapı denetim hizmet bedeli yapının tamamı için belirlenecek yapı denetim hizmet bedelinin %25’inden az olamaz. Yapı denetimi hizmet bedeline laboratuvarlara yaptırılacak olan taşıyıcı sisteme ilişkin deneylerden Bakanlıkça belirlenenlerin masrafları dâhil olup katma değer vergisi ile yapı denetim kuruluşu tarafından talep edilen ve taşıyıcı sisteme ilişkin olmayan malzeme ve imalâtlar konusunda yapı müteahhidince yaptırılacak olan laboratuvar deneylerinin masrafları dâhil değildir. Yapı denetim kuruluşu, yapı sahibinden başka bir ad altında, ayrıca hiçbir bedel talebinde bulunamaz. Yapı denetim kuruluşlarına ödenecek hizmet bedeli, Endüstri Bölgeleri, Teknoloji Geliştirme Bölgeleri, Organize Sanayi Bölgeleri, Serbest Bölgeler ve Sanayi Siteleri onaylı sınırı içerisinde yer alan tüm yapılar için %50’yi geçmemek üzere indirimli uygulanır. Bu indirim oranlarına ilişkin usul ve esaslar Ticaret Bakanlığı ile Sanayi ve Teknoloji Bakanlığının görüşü alınarak Bakanlıkça belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Yapı denetim hizmet bedeli, yapı denetim kuruluşlarının hizmet bedellerinin ödenmesinde kullanılmak üzere yapı sahibince il muhasebe birimlerinde açılacak emanet nitelikli hesaba yatırılır. Yatırılan tutarların %3’ü ruhsatı veren idarenin, %3’ü Bakanlık bünyesinde bulunan döner sermaye işletmesinin hesabına aktarılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7" durum="mülga">
      <template></template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Yapı denetim kuruluşu ile mimar ve mühendislerinin yapı ile ilişkisinin kesilmesi">
    <mvz-fıkra no="1">

      <template>Bu Kanun ve ilgili mevzuata göre görevini yerine getirmeyen yapı denetim kuruluşları hakkında bu madde uyarınca idari para cezası uygulanmasını gerektiren fiillerin tespiti halinde ayrıca 3194 sayılı Kanun uyarınca idari para cezası uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="23">
      <template>Bakanlıkça 5 inci madde uyarınca elektronik ortamda görevlendirildiği bir yapıda;</template>
      <mvz-bent no="a">
        <template>Yapı denetim kuruluşunca ilgili denetim personeli Bakanlıkça belirlenen sürede görevlendirilerek yapının denetim sorumluluğunun üstlenilmemesi,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Denetim sorumluluğu üstlenilen ancak yapı denetim kuruluşundan kaynaklanan nedenlerle Bakanlıkça belirlenen sürede yapı denetim hizmet sözleşmesinin imzalanmaması,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Yapı denetim kuruluşunun; izin belgesinin geçici olarak geri alınması, iptal edilmesi, birinci fıkranın (g) bendi uyarınca yeni iş almaktan men cezası alması veya o yapı için Bakanlıkça elektronik ortamda yapılan görevlendirilmesinin kaldırılması durumları hariç olmak üzere yapı denetim hizmet sözleşmesinin yapı denetim kuruluşundan kaynaklı sebeple feshi,</template>

      <mvz-bent no="ç">
        <template>Yapı ruhsatı verildikten sonra, yapı denetim kuruluşunun gerçeğe aykırı beyan veya bilgi/belge vermesi sebebiyle o yapı için hatalı görevlendirme yapıldığının anlaşılması,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>hallerinde yapı denetim kuruluşu, Bakanlıkça elektronik ortamda yapılan sıralamadan her bir fiili için 120 güne kadar çıkarılarak yapı denetim kuruluşunun yeni bir işte denetim görevi üstlenmesine izin verilmez. Bu fıkra uyarınca, elektronik ortamda sıralamadan çıkarılan yapı denetim kuruluşunun yeniden sıralamaya girmesi halinde, sıralamadan çıkarılmasına sebebiyet veren yapıda tekrar Bakanlıkça görevlendirilmesi mümkündür. Bu fıkra uyarınca yürütülecek işlemler için birinci fıkranın (h) bendi, üçüncü fıkra, beşinci fıkra, yedinci fıkra, onbeşinci fıkra, yirmisekizinci fıkra ve 9 uncu maddenin birinci fıkra hükümleri uygulanmaz. Bu fıkra uyarınca uygulanan yeni bir işte denetim görevi üstlenilememesine dair işlem yapı denetim kuruluşuna elektronik sistem üzerinden bildirilir. Bu fıkranın yürütülmesine ilişkin usul ve esaslar Bakanlıkça belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="24">
      <template>Yapı denetim kuruluşunun ek 1 inci madde kapsamında Bakanlıkça belirlenen esaslar çerçevesinde yürüttüğü denetimde, ruhsat eki onaylı statik projesine uygun olan ancak ruhsat eki diğer projelere uygun olmayan aykırılıkları tespit etmemesi halinde, yapı denetim kuruluşuna İl Yapı Denetim Komisyonunun teklifi üzerine Çevre, Şehircilik ve İklim Değişikliği İl Müdürlüğünce o işe ilişkin aldığı hizmet bedelinin %20’si oranında idari para cezası uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="25">
      <template>Yapı denetim kuruluşunun, ek 1 inci maddeye göre Bakanlıkça belirlenen esaslar çerçevesinde yürüttüğü denetim görevinde;</template>

        <template>Bakanlıkça belirlenen sürede denetimi yerine getirmemesi,</template>

    <mvz-fıkra no="0">
      <template>hallerinde Merkez Yapı Denetim Komisyonunun teklifi üzerine Bakanlıkça yapı denetim kuruluşunun bir yıl süre ile ek 1 inci madde kapsamında yeni bir denetim görevi üstlenmesinin engellenmesine yönelik idari müeyyide Merkez Yapı Denetim Komisyonunun teklifi üzerine Bakanlıkça uygulanır. Bu fıkra kapsamındaki idari müeyyideler Resmî Gazete’de ilan edilir. Bu fıkra uyarınca yürütülecek işlemler için birinci fıkranın (h) bendi, yedinci fıkra ve 9 uncu maddenin birinci fıkra hükümleri uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="26">
      <template>Yapı denetim kuruluşuna, farklı teknik inceleme raporlarına istinaden birinci fıkra uyarınca aynı takvim yılı içerisinde, ikinci ve sonraki her yeni iş almaktan men cezasının uygulamaya konulduğu tarih için Bakanlıkça belirlenen teminat bedelinin %10’u kadar idari para cezası İl Yapı Denetim Komisyonunun teklifi üzerine Çevre, Şehircilik ve İklim Değişikliği İl Müdürlüğünce uygulanır. Bu fıkra uyarınca takvim yılı içerisinde uygulanacak idari para cezası, teminat bedelinin %50’sini aşamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="27">
      <template>Yapı denetim kuruluşu, yapı sahibince belirlenen ancak daha sonra herhangi bir nedenle inşaat alanında yapılacak değişiklikle bu alanın Bakanlıkça 5 inci maddenin birinci fıkrası doğrultusunda belirlenen metrekareyi aşması ve yapının artık elektronik dağıtıma konu olması gerektiğinin anlaşılması halinde mevcut yapı denetim kuruluşunca durum ilgili idareye bildirilir ve yapı için 5 inci maddenin birinci fıkrası doğrultusunda elektronik ortamda görevlendirme yapılmadan yapı ruhsatı düzenlenmez ve yapının devamına izin verilmez. Herhangi bir aşamada elektronik dağıtıma konu olması gerekirken elektronik dağıtım yapılmaksızın o yapının denetimine devam ettiği anlaşılan yapı denetim kuruluşunun, İl Yapı Denetim Komisyonunun teklifi üzerine Çevre, Şehircilik ve İklim Değişikliği İl Müdürlüğünce üç ay süreyle yeni iş almasına izin verilmez ve aynı kuruluşa doğru yapı inşaat alanına göre tespit edilen yapı denetimi hizmet bedelinin %50’si oranında idari para cezası uygulanır. Bu fıkra kapsamında yeni iş alınmamasına sebebiyet veren iş için 5 inci maddenin birinci fıkrası doğrultusunda yeni bir yapı denetim kuruluşu görevlendirilmeden yapının devamına izin verilmez. Bu fıkra uyarınca yürütülecek işlemler için birinci fıkranın (h) bendi, üçüncü fıkra, beşinci fıkra, yedinci fıkra, onbeşinci fıkra ve 9 uncu maddenin birinci fıkrası hükümleri uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="28">
      <template>Bu Kanunda öngörülen yapı denetim kuruluşları, beton üreticileri, zemin ve temel etüt kuruluşları ve laboratuvar kuruluşları hakkında, Bakanlıkça uygulanacağı belirlenen idari müeyyideler ilgili genel müdür, Çevre, Şehircilik ve İklim Değişikliği İl Müdürlüğünce uygulanacağı belirlenen idari müeyyideler ise Çevre, Şehircilik ve İklim Değişikliği İl Müdürü tarafından uygulanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="29">
      <template>Laboratuvar kuruluşunda görevli iken çalıştığı laboratuvardaki idari görev dışında başka işte çalışan laboratuvar denetçilerine ve teknik elemanlarına İl Yapı Denetim Komisyonunun teklifi üzerine Çevre, Şehircilik ve İklim Değişikliği İl Müdürlüğünce 50.000 Türk lirası idari para cezası verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="30">
      <template>Beton üreticisine, yapının denetimi için alınan sertleşmiş beton (karot) deney sonuçlarının ilgili standardı sağlamadığının tespiti hallerinde İl Yapı Denetim Komisyonunun teklifi üzerine Çevre, Şehircilik ve İklim Değişikliği İl Müdürlüğünce 500.000 Türk lirası idari para cezası verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="31">
      <template>Beton üreticisine, Bakanlıkça yönetilen izleme sistemi kapsamında dökülen betonlarda, mikser etiketi ve/veya karekodlu irsaliyenin bulunmaması ve/veya mikser etiketi ile karekodlu irsaliyenin uyuşmaması hallerinde İl Yapı Denetim Komisyonunun teklifi üzerine Çevre, Şehircilik ve İklim Değişikliği İl Müdürlüğünce 250.000 Türk lirası idari para cezası verilir.</template>
    </mvz-fıkra>

  <mvz-madde no="9" başlık="Ceza hükümleri">

      <template>Bu Kanun hükümlerinin uygulanması sırasında, yapı denetim veya laboratuvar kuruluşunun icraî veya ihmalî davranışla yeni iş almaktan men cezası uygulanmasını gerektiren veya 8 inci maddenin birinci fıkrasının (h) bendinin (2) numaralı alt bendinde veya 8 inci maddenin onuncu fıkrasının (e) bendinin (2) numaralı alt bendinde yer verilen fiillerine ilişkin görevini kötüye kullanan ortakları, yöneticileri, mimar ve mühendisleri ve diğer teknik personeli, yapı müteahhidi, şantiye şefi, proje müellifi gerçek kişiler ile laboratuvar görevlileri, altı aydan üç yıla kadar hapis cezası ile cezalandırılır.</template>

    <mvz-fıkra no="4">

  <mvz-madde no="12" başlık="Diğer hükümler ve yönetmelikler">

    <mvz-fıkra no="2">
      <template>İlgili idarelerin bu Kanunda belirtilen hususlara ilişkin görevleri ile çalışma usul ve esasları; yapı denetim kuruluşlarının sınıflandırılması, kuruluşlar arasında adaletli iş dağılımını temin etmek üzere bir ilde faaliyet gösterebilecek olan yapı denetim kuruluşu ve laboratuvar kuruluşu sayısının belirlenmesi ile kuruluş safhasında sahip olunması gereken asgarî nitelikler; yapı denetim izin belgesinin geçici olarak geri alınmasına ilişkin şartlar, yapı denetim kuruluşları ve laboratuvarların görevleri ile çalışma usul ve esasları; denetçi belgesi verilmesine ilişkin usul ve esaslar ile yapı denetim ve laboratuvar kuruluşlarında görev alacak personelde aranacak nitelik, tecrübe ve bunların istihdam şartları ile görev ve sorumlulukları; diğer yapı sorumlularının nitelikleri, görevleri ile çalışma usul ve esasları; Merkez ve İl Yapı Denetim Komisyonunun görevleri ile çalışma usul ve esasları; yapı denetimi hizmet sözleşmesine ve feshine ilişkin esaslar; hizmet bedelinin belirlenmesi ve ödenmesi, laboratuvar hizmet sözleşmelerinin usul ve esasları, beton deneyine ilişkin laboratuvarca verilen hizmetlerin asgari ve azami bedeli ve bu bedelin kimin tarafından karşılanacağı, bu Kanun uyarınca denetlenerek inşa edilen yapılara bina kimlik sertifikası verilmesi ve düzenlenecek meslek içi eğitimlere ilişkin usul ve esaslar Bakanlıkça hazırlanan yönetmeliklerle düzenlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">

      <template>Bu Kanun kapsamında denetlenerek bina kimlik sertifikası alan yapılar, sertifikanın asılmasını müteakip beşer yıllık periyotlarla yapı denetim kuruluşlarınca denetlenir. Bu denetimler Bakanlıkça elektronik ortamda belirlenen yapı denetim kuruluşları tarafından yürütülür.</template>

      <template>Bu Kanun kapsamında yapılacak yapıların zemin ve temel etütleri Bakanlıkça izin belgesi verilen zemin ve temel etüt kuruluşları tarafından yapılır.</template>

    <mvz-fıkra no="2">
      <template>Zemin ve temel etüt hizmet sözleşmeleri, zemin ve temel etüt kuruluşları ile proje müellifleri veya yapı sahipleri arasında imzalanır. Bu sözleşmenin usul ve esasları Bakanlıkça belirlenir.</template>

    <mvz-fıkra no="3">
      <template>Zemin ve temel etüt hizmet bedeli, zemin ve temel etüt kuruluşlarının hizmet bedellerinin ödenmesinde kullanılmak üzere hizmet alan proje müellifi veya yapı sahibince il muhasebe birimlerinde açılacak emanet nitelikli hesaba yatırılır. Yatırılan tutarın %2’si ruhsatı veren idarenin, %2’si Bakanlık bünyesinde bulunan döner sermaye işletmesinin, %10’unu geçmeyecek şekilde Bakanlıkça belirlenen oranı ise zemin ve temel etüt altyapısı ve sistemleri hakkında hizmet sağlamak üzere Bakanlıkça belirlenen kurum veya kuruluşun hesabına aktarılır. Bakanlık bu oranları iki katına kadar artırmaya ve yarısına kadar indirmeye yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Zemin ve temel etüt kuruluşlarının sınıflandırılması, bir ilde faaliyet gösterebilecek olan kuruluş sayısının belirlenmesi ile kuruluş safhasında sahip olunması gereken asgarî nitelikler, izin belgesinin geçici olarak geri alınmasına ilişkin şartlar, görevleri ile çalışma usul ve esasları, zemin ve temel etüt kuruluşlarında görev alacak personelde aranacak nitelik, tecrübe ve bunların istihdam şartları ile görev ve sorumlulukları, hizmet bedelinin belirlenmesi ve ödenmesine ilişkin usul ve esaslar Bakanlıkça hazırlanan yönetmeliklerle düzenlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Zemin ve temel etüt kuruluşuna;</template>
      <mvz-bent no="a">
        <template>Zemin ve temel etüdüne esas arazi veya sondaj çalışmaları, numune alınması, saklanması, taşınması, laboratuvara teslimi, raporlanması, izlenmesi ve denetlenmesi süreçlerinde ilgili standartlara ve mevzuata uymadığının tespiti,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Laboratuvar deneylerini Bakanlıktan izin belgeli laboratuvarlara yaptırmadığının tespiti,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>hallerinde İl Yapı Denetim Komisyonunun teklifi üzerine Çevre, Şehircilik ve İklim Değişikliği İl Müdürlüğünce 200.000 Türk lirası idari para cezası verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Zemin ve temel etüt kuruluşunun, gerçeğe aykırı zemin ve temel etüt raporu vermesi halinde veya zemin ve temel etüt raporunun yapının statik hesaplarının hatalı yapılmasına sebebiyet vermesi halinde, izin belgesi Merkez Yapı Denetim Komisyonunun teklifi üzerine Bakanlıkça iptal edilerek faaliyetine son verilir ve teminatı irat kaydolunur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Faaliyete son verme cezası alan zemin ve temel etüt kuruluşunun ortakları üç yıl süreyle herhangi bir zemin ve temel etüt, yapı denetim veya laboratuvar kuruluşunda teknik bir görev alamaz ve başka bir zemin ve temel etüt veya yapı denetim veya laboratuvar kuruluşunun ortağı olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Zemin ve temel etüt kuruluşunun bu maddenin altıncı fıkrası kapsamında izin belgesinin iptaline sebebiyet veren veya zemin ve temel etüt kuruluşuna son beş takvim yılı içerisinde üç ayrı değerlendirme raporu kapsamında üç adet idari para cezası uygulanmasına sebebiyet vererek kayıtları tutulan teknik personel üç yıl süre ile herhangi bir zemin ve temel etüt, yapı denetim veya laboratuvar kuruluşunda teknik bir görev alamaz ve başka bir zemin ve temel etüt veya yapı denetim veya laboratuvar kuruluşunun ortağı olamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Zemin ve temel etüt kuruluşlarının yöneticileri, ortakları ve teknik personeli bu Kanunun uygulanmasından dolayı ortaya çıkan yapı hasarından sorumludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10">
      <template>Bu maddenin uygulanmasına Bakanlıkça belirlenecek pilot ilde başlanır. Pilot uygulamanın genişletilmesi ve daraltılmasına Bakanlık yetkilidir.</template>
    </mvz-fıkra>

  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihten önce Bakanlıkça yapı denetim kuruluşlarına verilmiş olan yapı denetimi izin belgeleri, bu Kanunun yürürlüğe girdiği tarihten itibaren üç ay süreyle geçerlidir. Bu süre içerisinde bu Kanun hükümlerine uygun olarak yenilenmeyen yapı denetim izin belgeleri geçersiz sayılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihten önce 3194 sayılı İmar Kanunu ile 595 sayılı Yapı Denetimi Hakkında Kanun Hükmünde Kararname hükümlerine göre alınan yapı ruhsatları geçerlidir.</template>

  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Geçici">

    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Yapı denetimi hizmet sözleşmesini imzalayacak kuruluşların Bakanlıkça yayımlanacak usul ve esaslara göre belirlenmesine veya atanmasına başlanacağı tarihten önce imzalanan yapı denetim hizmet sözleşmeleri geçerli olup, bu işler için sözleşme hükümlerine göre işlemlere devam edilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="İdari müeyyidelere ilişkin geçiş hükümleri" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu maddenin yürürlüğe girdiği tarihten önce;</template>
      <mvz-bent no="a">
        <template>Bu Kanuna aykırı olarak işlenmiş fiiller nedeniyle uygulanması gereken ancak henüz tesis edilmemiş idari müeyyidelerde lehe olan hükümler uygulanır.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Yapı denetim kuruluşlarına 8 inci maddenin birinci fıkrasının (g) bendi uyarınca yeni iş almaktan men cezası verilmesine sebep olan denetim elemanlarının bu fiilleri aynı maddenin sekizinci fıkrası kapsamında tekerrüre esas alınmaz.</template>

      <mvz-bent no="c">

      <mvz-bent no="d">
        <template>Laboratuvar kuruluşlarına 8 inci maddenin onuncu fıkrasının (e) bendinin (2) numaralı alt bendi uyarınca belge iptali cezası verilmesine sebep olan denetçi mühendisler ve teknik elemanlar hakkında aynı maddenin onüçüncü fıkrası dikkate alınmaz.</template>
