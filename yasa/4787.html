  <mvz-künye tür="kanun" no="4787" başlık="AİLE MAHKEMELERİNİN KURULUŞ, GÖREV VE YARGILAMA USULLERİNE DAİR KANUN"
             tarih="9/1/2003" rgazete-tarih="18/1/2003" rgazete-sayı="24997"
             düstur-tertip=" " düstur-cilt="7" />

  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, aile mahkemelerinin kuruluş, görev ve yargılama usullerini düzenlemektir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun, aile hukukundan doğan dava ve işleri görmek üzere kurulan aile mahkemelerine dair hükümleri kapsar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Aile mahkemelerinin kuruluşu">
    <mvz-fıkra no="1">
      <template>Aile mahkemeleri, Adalet Bakanlığınca Hâkimler ve Savcılar Yüksek Kurulunun olumlu görüşü alınarak her ilde ve merkez nüfusu yüzbinin üzerindeki her ilçede, tek hâkimli ve asliye mahkemesi derecesinde olmak üzere kurulur. Aile mahkemelerinin yargı çevresi, kurulduğu il ve ilçenin mülkî sınırlarıyla belirlenir. Ancak yargı çevresi, Adalet Bakanlığının teklifi üzerine Hâkimler ve Savcılar Yüksek Kurulunca değiştirilebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Gerektiğinde birinci fıkradaki usule göre bir yerdeki aile mahkemesinin birden çok dairesi kurulabilir. Bu durumda daireler numaralandırılır. Aile mahkemesi kurulamayan yerlerde bu Kanun kapsamına giren dava ve işlere, Hâkimler ve Savcılar Yüksek Kurulunca belirlenen Asliye Hukuk Mahkemesince bakılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Aile mahkemelerinde bir yazı işleri müdürü ile yeteri kadar personel bulunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Aile mahkemeleri hâkimlerinin nitelikleri ve atanmaları">
    <mvz-fıkra no="1">
      <template>Aile mahkemelerine, atanacakları bölgeye veya bir alt bölgeye hak kazanmış, adlî yargıda görevli, tercihan evli ve çocuk sahibi, otuz yaşını doldurmuş ve aile hukuku alanında lisansüstü eğitim yapmış olan hâkimler arasından Hâkimler ve Savcılar Yüksek Kurulunca atama yapılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Aile mahkemelerinin görevleri">
    <mvz-fıkra no="1">
      <template>Aile mahkemeleri, aşağıdaki dava ve işleri görürler:</template>
      <mvz-bent no="1.">
        <template>22.11.2001 tarihli ve 4721 sayılı Türk Medenî Kanununun Üçüncü Kısım hariç olmak üzere İkinci Kitabı ile 3.12.2001 tarihli ve 4722 sayılı Türk Medenî Kanununun Yürürlüğü ve Uygulama Şekli Hakkında Kanuna göre aile hukukundan doğan dava ve işler,</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>20.5.1982 tarihli ve 2675 sayılı Milletlerarası Özel Hukuk ve Usul Hukuku Hakkında Kanuna göre aile hukukuna ilişkin yabancı mahkeme kararlarının tanıma ve tenfizi,</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Kanunlarla verilen diğer görevler.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Uzmanlardan yararlanma">
    <mvz-fıkra no="1">
      <template>Aile mahkemeleri,</template>
      <mvz-bent no="1.">
        <template>Davanın esasına girilmeden önce veya davanın görülmesi sırasında, mahkemece istenen konular hakkında taraflar arasındaki uyuşmazlık nedenlerine ilişkin araştırma ve inceleme yapmak ve sonucunu bildirmek,</template>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>Mahkemenin gerekli gördüğü hâllerde duruşmada hazır bulunmak, istenilen konularla ilgili çalışmalar yapmak ve görüş bildirmek,</template>
      </mvz-bent>
      <mvz-bent no="3.">
        <template>Mahkemece verilecek diğer görevleri yapmak,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>üzere tercihen; evli ve çocuk sahibi, otuz yaşını doldurmuş ve aile sorunları alanında lisansüstü eğitim yapmış olanlar arasından Adalet Bakanlığınca adliyelerde görevlendirilen psikolog, pedagog ve sosyal çalışmacılardan yararlanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu görevlilerin bulunmaması, iş durumlarının müsait olmaması veya görevin bunlar tarafından yapılmasında hukukî veya fiilî herhangi bir engel bulunması ya da başka bir uzmanlık dalına ihtiyaç duyulması hallerinde, diğer kamu kurum ve kuruluşlarında çalışanlar veya serbest meslek icra edenlerden yararlanılır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bu uzmanlar, 12/1/2011 tarihli ve 6100 sayılı Hukuk Muhakemeleri Kanununda düzenlenen hâkimin reddi sebeplerine göre reddolunabilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Koruyucu, eğitici ve sosyal önlemler">
    <mvz-fıkra no="1">
      <template>Aile mahkemesi, diğer kanunlardaki hükümler saklı kalmak üzere görev alanına giren konularda:</template>
      <mvz-bent no="1.">
        <template>Yetişkinler hakkında;</template>
        <mvz-altbent no="a">
          <template>Evlilik birliğinden doğan yükümlülükleri konusunda eşleri uyararak, gerektiğinde uzlaştırmaya,</template>
        </mvz-altbent>
        <mvz-altbent no="b">
          <template>Ailenin ekonomik varlığının korunması veya evlilik birliğinden doğan malî yükümlülüklerin yerine getirilmesine ilişkin gerekli önlemleri almaya,</template>
        </mvz-altbent>
        <mvz-altbent no="c">
          <template>Resmî veya özel sağlık veya sosyal hizmet kurumlarına, huzur evlerine veya benzeri yerlere yerleştirmeye,</template>
        </mvz-altbent>
        <mvz-altbent no="d">
          <template>Bir meslek edinme kursuna veya uygun görülecek bir eğitim kurumuna vermeye,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="2.">
        <template>Küçükler hakkında;</template>
        <mvz-altbent no="a">
          <template>Bakım ve gözetime yönelik nafaka yükümlülüğü konusunda gerekli önlemleri almaya,</template>
        </mvz-altbent>
        <mvz-altbent no="b">
          <template>Bedensel ve zihinsel gelişmesi tehlikede bulunan veya manen terk edilmiş halde kalan küçüğü, ana ve babadan alarak bir aile yanına veya resmî ya da özel sağlık kurumuna veya eğitimi güç çocuklara mahsus kuruma yerleştirmeye,</template>
        </mvz-altbent>
        <mvz-altbent no="c">
          <template>Çocuk mallarının yönetimi ve korunmasına ilişkin önlemleri almaya,</template>
        </mvz-altbent>
        <mvz-altbent no="d">
          <template>Genel ve katma bütçeli daireler, mahallî idareler, kamu iktisadî teşebbüsleri ve bankalar tarafından kurulmuş teşekkül, müessese veya işletmelere veya benzeri işyerlerine yahut meslek sahibi birinin yanına yerleştirmeye,</template>
        </mvz-altbent>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>karar verebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Aile mahkemesince verilen bu kararların takibi ve yerine getirilmesinde 5 inci maddeye göre görevlendirilen uzmanlardan yararlanılabilir. Bu kararlara uyulmaması hâlinde Hukuk Muhakemeleri Kanununun 398 inci maddesi uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Usul hükümleri">
    <mvz-fıkra no="1">
      <template>Aile mahkemeleri, önlerine gelen dava ve işlerin özelliklerine göre, esasa girmeden önce, aile içindeki karşılıklı sevgi, saygı ve hoşgörünün korunması bakımından eşlerin ve çocukların karşı karşıya oldukları sorunları tespit ederek bunların sulh yoluyla çözümünü, gerektiğinde uzmanlardan da yararlanarak teşvik eder. Sulh sağlanamadığı takdirde yargılamaya devam olunarak esas hakkında karar verilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Özel kanunlardaki hükümler saklı kalmak kaydıyla, bu Kanunda hüküm bulunmayan konularda Türk Medenî Kanununun aile hukukuna ilişkin usul hükümleri ile Hukuk Usulü Muhakemeleri Kanunu hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Kadrolar">
    <mvz-fıkra no="1">
      <template>Adalet Bakanlığı taşra teşkilâtında kullanılmak üzere ekli (1) ve (2) sayılı listede yer alan kadrolar ihdas edilerek 13.12.1983 tarihli ve 190 sayılı Kanun Hükmünde Kararnameye ekli (I) ve (II) sayılı cetvelin ilgili bölümlerine eklenmiştir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Değiştirilen ve yürürlükten kaldırılan hükümler">
    <mvz-fıkra no="1">
      <template>14.1.1998 tarihli ve 4320 sayılı Ailenin Korunmasına Dair Kanunun 1 inci maddesinin birinci fıkrasındaki “Sulh Hâkimi” ibaresi “Aile Mahkemesi Hâkimi” olarak değiştirilmiştir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>18.6.1927 tarihli ve 1086 sayılı Hukuk Usulü Muhakemeleri Kanununun 8 inci maddesinin II numaralı bendinin (4) numaralı alt bendi aşağıdaki şekilde değiştirilmiş, (5) numaralı alt bendi yürürlükten kaldırılmış ve mevcut (6) numaralı alt bendi (5) numaralı alt bent olarak teselsül ettirilmiştir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>4. Borçlar Kanununun 91,92 nci maddelerinde mahkeme veya hâkime verilen işleri,</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Aile mahkemesi kurulan yerlerde bu mahkemeler faaliyete geçtiğinde, yargı çevresi içerisinde ve görev alanına giren sonuçlanmamış dava ve işler, yetkili ve görevli aile mahkemesine devredilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihte aile mahkemelerinde görülmekte olan ve 4721 sayılı Türk Medenî Kanununun İkinci Kitabının Üçüncü Kısmında yer alan konularla ilgili dava ve işler yetkili ve görevli mahkemesine devredilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Yürürlük">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="Yürütme">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
