  <mvz-künye tür="kanun" no="6216" başlık="ANAYASA MAHKEMESİNİN KURULUŞU VE YARGILAMA USULLERİ HAKKINDA KANUN"
             tarih="30/3/2011" rgazete-tarih="3/4/2011" rgazete-sayı="27894"
             düstur-tertip="5" düstur-cilt="50" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
      <mvz-madde no="1" başlık="Amaç ve kapsam">
        <mvz-fıkra no="1">
          <template>Bu Kanunun amaç ve kapsamı; Anayasa Mahkemesinin yapısı, görevleri, yargılama usulleri, Başkan, başkanvekilleri ve üyelerinin seçimi, disiplin ve özlük işleri ile raportörler, raportör yardımcıları ve personelinin nitelikleri, atanmaları, görev ve sorumlulukları, disiplin ve özlük işlerine ilişkin esasları düzenlemektir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="Tanımlar">
        <mvz-fıkra no="1">
          <template>Bu Kanunun uygulanmasında;</template>
          <mvz-bent no="a">
            <template>Başkan: Anayasa Mahkemesi Başkanını,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başkanlık: Anayasa Mahkemesi Başkanlığını,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Başkanvekili: Bölümlerin başkanlığını yürütmek ve Başkana vekâlet etmek üzere Genel Kurulca dört yıllığına seçilen üyeleri,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Bölüm: Bir başkanvekilinin başkanlığında altı üyeden oluşan ve ilgili başkanvekili başkanlığında dört üyenin katılımıyla toplanıp bireysel başvurular hakkında karar verme yetkisine sahip olan kurulu,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Genel Kurul: Onbeş üyeden oluşan kurulu,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>İçtüzük: Anayasa Mahkemesi İçtüzüğünü,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Kıdem: Anayasa Mahkemesi üyeliğine seçilme tarihinden itibaren geçen süreyi veya aynı tarihte seçilenlerden yaşça büyük olmayı,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Komisyon: Bireysel başvuruların kabul edilebilirlik incelemesini yapmak üzere oluşturulan kurulları,</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Mahkeme: Anayasa Mahkemesini,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Üye: Başkan ve başkanvekilleri de dâhil tüm üyeleri,</template>
          </mvz-bent>
          <mvz-bent no="ı">
            <template>Yüce Divan: Anayasanın 148 inci maddesinin altıncı ve yedinci fıkralarında belirtilen kişilerin, görevleri ile ilgili suçlarından dolayı yargılamasını yapmakla görevli Mahkeme Genel Kurulunu,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Görevler, Yetkiler ve Mahkeme Bütçesi">
      <mvz-madde no="3" başlık="Mahkemenin görev ve yetkileri">
        <mvz-fıkra no="1">
          <template>Mahkemenin görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Kanunların, Cumhurbaşkanlığı kararnamelerinin, Türkiye Büyük Millet Meclisi İçtüzüğünün veya bunların belirli madde veya hükümlerinin şekil ve esas bakımından, Anayasa değişikliklerinin ise sadece şekil açısından Anayasaya aykırılığı iddiasıyla açılan iptal davalarına bakmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Anayasanın 152 nci maddesine göre mahkemelerce itiraz yoluyla kendisine intikal ettirilen işleri karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Anayasanın 148 inci maddesi uyarınca yapılan bireysel başvuruları karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Cumhurbaşkanını, Türkiye Büyük Millet Meclisi Başkanını, Cumhurbaşkanı yardımcılarını, bakanları, Anayasa Mahkemesi, Yargıtay, Danıştay başkan ve üyelerini, başsavcılarını, Cumhuriyet Başsavcıvekilini, Hâkimler ve Savcılar Kurulu ve Sayıştay başkan ve üyelerini, Genelkurmay Başkanı ile Kara, Deniz ve Hava Kuvvetleri komutanlarını görevleriyle ilgili suçlardan dolayı Yüce Divan sıfatıyla yargılamak.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Siyasi partilerin kapatılmasına ve Devlet yardımından yoksun bırakılmasına ilişkin davalar ile ihtar başvuruları ve dağılma durumunun tespiti istemlerini karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Siyasi partilerin mal edinimleri ile gelir ve giderlerinin kanuna uygunluğunun denetimini yapmak veya yaptırmak.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Milletvekillerinin yasama dokunulmazlıklarının kaldırılmasına veya milletvekilliklerinin düşmesine ya da Cumhurbaşkanı yardımcıları ve bakanların dokunulmazlıklarının kaldırılmasına Türkiye Büyük Millet Meclisince karar verilmesi hâllerinde, ilgili milletvekili veya bir diğer milletvekilinin Anayasa, kanun veya Türkiye Büyük Millet Meclisi İçtüzüğü hükümlerine aykırılık iddiasına dayanan iptal istemlerini karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Mahkeme üyeleri arasından Anayasa Mahkemesi Başkanı ve başkanvekilleri ile Uyuşmazlık Mahkemesi Başkanı ve Başkanvekilini seçmek.</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Anayasada kendisine verilen diğer görevleri yerine getirmek.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="4" başlık="Mahkeme bütçesi">
        <mvz-fıkra no="1">
          <template>Mahkeme, merkezi yönetim bütçesi içinde kendi bütçesi ile yönetilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türkiye Büyük Millet Meclisinde bütçe ile ilgili görüşmelerde Mahkeme Genel Sekreteri hazır bulunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="İçtüzük">
        <mvz-fıkra no="1">
          <template>Bu Kanun çerçevesinde;</template>
          <mvz-bent no="a">
            <template>Mahkemenin iç düzeni, işleyişi, teşkilatı, çalışma usulleri, tutulacak defter ve kayıtlar, elektronik ortam da dâhil evrak akış düzeni, arşivlenmesi, Mahkeme kütüphanesi, Genel Sekreterlik ile idari teşkilatı, idari personelin görev ve sorumlulukları,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başkan ve üyeler ile raportörler ve raportör yardımcılarının özlük dosyalarının tutulması, disiplin işleri, izin ve sağlık durumları, giyecekleri kisvelerin şekli ve bunların giyilme zaman ve yerleri,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Mahkemenin çalışma, yargılama usul ve esasları, müzakere ve duruşmaların yönetimi ve kayda alınması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>Genel Kurulca kabul edilecek İçtüzükle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İçtüzük Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Anayasa Mahkemesi Üyeliği">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Üyelerin Nitelikleri, Seçimi ve Atanması">
      <mvz-madde no="6" başlık="Mahkemenin kuruluşu ve üyelerin seçilme yeterliği">
        <mvz-fıkra no="1">
          <template>Mahkeme onbeş üyeden kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme üyeliğine seçilebilmek için aşağıdaki bentlerde sayılan niteliklerden birine sahip olmak gerekir:</template>
          <mvz-bent no="a">
            <template>Yargıtay, Danıştay  veya Sayıştayda başkan ya da üye olmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Mahkemede asgarî beş yıldır raportör olarak görev yapıyor olmak.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kırkbeş yaşını doldurmuş, yükseköğrenim görmüş olması ve hâkimlik mesleğine alınmaya engel bir hâlinin bulunmaması kaydıyla;</template>
            <mvz-altbent no="1">
              <template>Yükseköğretim kurumlarının hukuk, iktisat veya siyasal bilimler dallarında profesör veya doçent unvanını kazanmış olmak,</template>
            </mvz-altbent>
            <mvz-altbent no="2">
              <template>En az yirmi yıl fiilen serbest avukatlık yapmış olmak,</template>
            </mvz-altbent>
            <mvz-altbent no="3">
              <template>En az yirmi yıl kamu hizmetinde fiilen çalışmış üst kademe yöneticileri arasından seçilecek üye için Yükseköğretim Kurulu Başkan veya üyesi ya da bir yükseköğretim kurumunun rektör veya dekanı ya da bakan yardımcısı, müsteşar, müsteşar yardımcısı, büyükelçi veya vali olmak,</template>
            </mvz-altbent>
            <mvz-altbent no="4">
              <template>Birinci sınıf hâkim ve savcılar için adaylık dâhil en az yirmi yıl çalışmış olmak.</template>
            </mvz-altbent>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Üyelerin seçimi">
        <mvz-fıkra no="1">
          <template>Türkiye Büyük Millet Meclisi; iki üyeyi Sayıştay Genel Kurulunun kendi Başkan ve üyeleri arasından, her boş yer için göstereceği üçer aday içinden, bir üyeyi ise baro başkanlarının serbest avukatlar arasından gösterecekleri üç aday içinden yapacağı gizli oylamayla seçer. Türkiye Büyük Millet Meclisinde yapılacak bu seçimde, her boş üyelik için ilk oylamada üye tam sayısının üçte iki ve ikinci oylamada üye tam sayısının salt çoğunluğu aranır. İkinci oylamada salt çoğunluk sağlanamazsa, bu oylamada en çok oy alan iki aday için üçüncü oylama yapılır; üçüncü oylamada en fazla oy alan aday üye seçilmiş olur. İkinci ve üçüncü tur oylamalarda oyları eşit olan adaylar arasında eşitlik bozulana kadar oylama tekrarlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Cumhurbaşkanı; üç üyeyi Yargıtay, iki üyeyi Danıştay  genel kurullarınca kendi başkan ve üyeleri arasından her boş yer için gösterecekleri üçer aday içinden; en az ikisi hukuk bilim dallarından olmak üzere üç üyeyi Yükseköğretim Kurulunun yükseköğretim kurumlarının hukuk, iktisat ve siyasal bilimler dallarında görev yapan ve kendi üyesi olmayan öğretim üyeleri arasından her boş yer için göstereceği üçer aday içinden; dört üyeyi üst kademe yöneticileri, serbest avukatlar, birinci sınıf hâkim ve savcılar ile en az beş yıl raportörlük yapmış Anayasa Mahkemesi raportörleri arasından seçer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yargıtay, Danıştay  ve Sayıştay genel kurulları ile Yükseköğretim Kurulu ve baro başkanlarınca Mahkeme üyeliğine aday göstermek için yapılacak seçimlerde en fazla oy alan üç kişi aday gösterilmiş sayılır. Bu fıkra uyarınca yapılacak seçimler tek turda yapılır ve her bir üye her boş üyelik için bir adaya oy kullanabilir. Oyları eşit olan adaylar arasında eşitlik bozulana kadar oylama tekrarlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Üye seçilenlere tebligat ve seçilenlerin görevi kabul etmemesi">
        <mvz-fıkra no="1">
          <template>Türkiye Büyük Millet Meclisince seçilen üyeler Türkiye Büyük Millet Meclisi Başkanlığınca, Cumhurbaşkanı tarafından seçilen üyeler ise Cumhurbaşkanlığınca, Mahkemeye yazıyla bildirilir. Anayasa Mahkemesi Başkanlığı durumu, seçilenlere yazı ile tebliğ eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Seçilenlerin ad ve soyadları Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme üyeliğine seçilenin görevi kabul etmemesi durumunda, bu husus ilgilinin Türkiye Büyük Millet Meclisince seçilmiş olması hâlinde Türkiye Büyük Millet Meclisi Başkanlığına, Cumhurbaşkanınca seçilmiş olması hâlinde Cumhurbaşkanlığına ve aday gösterilmesi söz konusu ise ilgili kurum ya da kurula Başkan tarafından yazıyla bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bildirimden itibaren 7 nci maddedeki usule göre bir ay içinde yeni üye seçilir. Aday gösterecek kurulların tatilde bulunması hâlinde, bu süre tatilin bitiminden itibaren başlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="And içme">
        <mvz-fıkra no="1">
          <template>Üyeler görevlerine başlamadan önce, Başkanın davet edeceği Cumhurbaşkanı, Türkiye Büyük Millet Meclisi Başkanı,  yüksek yargı organları başkan ve başsavcıları, Adalet Bakanı ve Devlet protokolünde yer alan diğer üst düzey görevliler ile emekli üyelerden katılanların, diğer ilgililerin huzurunda ve Anayasa Mahkemesi Başkan ve üyeleri önünde aşağıdaki andı içerler:</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>“Türkiye Cumhuriyeti Anayasasını ve temel hak ve özgürlükleri koruyacağıma; görevimi doğruluk, dürüstlük, tarafsızlık ve hakka saygı duygusu içinde, her türlü etki ve kaygıdan uzak olarak Anayasanın dayandığı temel ilkelere uygun hukuk anlayışı içinde, sadece vicdanımın emrine uyarak yerine getireceğime büyük Türk Milleti önünde namusum ve şerefim üzerine and içerim.”</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Üyelik süresi ve teminatı">
        <mvz-fıkra no="1">
          <template>Mahkeme üyeleri oniki yıl için seçilirler. Bir kimse iki defa üye seçilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başkan ve üyeler azlolunamaz; kendileri istemedikçe görev süreleri dolmadan veya altmışbeş yaşından önce emekliye sevk edilemezler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Başkan ve üyelerin görevleri yalnızca Anayasada ve bu Kanunda öngörülen hâllerde sona erer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Üyeliğin boşalması ve sona ermesi">
        <mvz-fıkra no="1">
          <template>Başkan, bir üyenin görev süresinin dolacağı tarihten iki ay önce, bunun dışında bir boşalma olduğu takdirde ise derhâl, keyfiyeti üyeyi seçmeye ve aday göstermeye yetkili olanlara yazıyla bildirir ve bu tarihten itibaren iki ay içinde 7 nci maddedeki usule göre boşalan üyelik kaynağından seçim yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başkan ve üyeler, yazılı olarak emekliliklerini isteyebilecekleri gibi, müddet ve kabule bağlı olmaksızın görevlerinden çekilebilirler; seçildikleri tarihten itibaren oniki yılın sonunda görevleri sona erer ve her hâlükârda altmışbeş yaşını doldurunca emekliye ayrılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Zorunlu emeklilik yaşından önce görev süresi dolan Başkan veya üyelerden;</template>
          <mvz-bent no="a">
            <template>Yargıtay, Danıştay ve Sayıştay Başkan ve üyeleri arasından seçilenler herhangi bir işleme gerek olmaksızın ve boş kadro şartı aranmaksızın, kalan görev sürelerini tamamlamak üzere geldikleri üyelik görevine geri dönerler, boşalan ilk üye kadrosu kendilerine tahsis olunur.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yükseköğretim kurumlarından seçilenler, talepleri üzerine Yükseköğretim Kurulu tarafından 4/11/1981 tarihli ve 2547 sayılı Yükseköğretim Kanununun 60 ıncı maddesinin (a) fıkrasında yer alan usul ve esaslara göre ayrıldıkları yükseköğretim kurumuna veya uzmanlık alanlarına göre talep ettikleri üç yükseköğretim kurumundan birine atanırlar.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Üst kademe yöneticileri, serbest avukatlar, birinci sınıf hâkim ve savcılar ile raportörler arasından seçilenler ve bu fıkranın (b) bendi kapsamında olup öğretim üyeliği kadrosuna atanmak istemediğini görev süresi bitmeden bir ay içinde bildirenler, Sayıştay üyeliği kadrosuna atanırlar. Atama işleminin gerçekleşmesi ile birlikte başka bir işleme gerek kalmaksızın söz konusu kadro kendiliğinden ihdas edilmiş ve Sayıştay Başkanlığının ilgili kadro cetveline eklenmiş sayılır. Bu şekilde ihdas edilmiş sayılan kadrolar herhangi bir şekilde boşalmalarını müteakiben başka bir işleme gerek kalmaksızın iptal edilmiş ve ilgili cetvelden çıkarılmış sayılır. Bu fıkra kapsamında ihdas edilmiş sayılan kadrolar 3/12/2010 tarihli ve 6085 sayılı Sayıştay Kanununun 15 inci maddesinin birinci fıkrasında yer alan oranların hesabında dikkate alınmaz.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Görevi sona eren üyelerin yeni görevlerine atamaları gerçekleşinceye kadar, özlük hakları Mahkeme tarafından karşılanmaya devam olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Mahkeme üyelerinin Mahkemede geçirdikleri süreler, yeni görevlerinde tâbi oldukları kanun hükümlerine göre hizmetlerinde değerlendirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu madde Anayasanın geçici 18 inci maddesinin altıncı fıkrası uyarınca yaş haddine kadar görevlerine devam etmeleri öngörülen üyelerden yaş haddini doldurmadan kendi isteğiyle üyelikten çekilenler hakkında da uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Başkanlık ve üyelik; 24/2/1983 tarihli ve 2802 sayılı Hâkimler ve Savcılar Kanununa göre hâkimlik ve savcılık mesleğinden çıkarılmayı gerektiren bir suçtan dolayı kesin hüküm giyilmesi veya Türk vatandaşlığının kaybedilmesi hâlinde kendiliğinden; görevin sağlık bakımından yerine getirilemeyeceğinin sağlık kurulu raporuyla kesin olarak anlaşılması hâlinde Mahkeme üye tam sayısının salt çoğunluğunun kararıyla ya da 19 uncu maddeye göre Genel Kurulun kararıyla üyelikten çekilmeye davet edilme cezası verilen üyenin kendiliğinden çekilmesi veya istifa etmiş sayılması hâllerinde sona erer.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8" durum="mülga">
          <template></template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Başkan, başkanvekilleri ile Uyuşmazlık Mahkemesi Başkanı ve Başkanvekilinin seçimi">
        <mvz-fıkra no="1">
          <template>Başkan ve başkanvekilleri, Uyuşmazlık Mahkemesi Başkan ve Başkanvekili üyeler arasından gizli oyla ve üye tam sayısının salt çoğunluğuyla dört yıl için seçilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Süresi bitenler yeniden seçilebilirler. Seçimler, bu görevlerin sona ereceği tarihten önceki iki ay içerisinde sonuçlandırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Seçimlerle ilgili diğer hususlar İçtüzükle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Başkanın görev ve yetkileri">
        <mvz-fıkra no="1">
          <template>Başkanın görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Genel Kurulun ve gerektiğinde bölümlerin gündemini belirlemek.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Genel Kurula ve Yüce Divana başkanlık etmek; gerekli gördüğü takdirde kendi yerine bu görevleri ifa etmek üzere başkanvekillerinden birini görevlendirmek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Genel Sekreter ve Genel Sekreter yardımcılarını görevlendirmek ve görevden almak.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Mahkemeyi temsil etmek.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Mahkeme yönetmeliklerini onaylamak.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Harcamaların Mahkeme bütçesine uygunluğunu denetlemek.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Bölümlerden birinin fiilî ya da hukuki imkânsızlık nedeniyle toplanamaması hâlinde diğer bölümden üye görevlendirmek.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Mahkeme personelinin atamasını yapmak.</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Mahkemenin verimli ve düzenli çalışmasını sağlamak ve bu amaçla uygun göreceği tedbirleri almak.</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Gerekli gördüğü takdirde basına ve kamuoyuna Mahkemeyle ilgili bilgi ve demeç vermek veya bu maksatla başkanvekili, üye veya raportör görevlendirmek.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Başkanvekillerinin görev ve yetkileri">
        <mvz-fıkra no="1">
          <template>Başkana ait görev ve yetkiler, Başkanlığın boş olması hâlinde kıdemli başkanvekili; Başkanın mazeretli veya izinli olması hâllerinde ise Başkan tarafından belirlenen başkanvekilince yerine getirilir. Başkanvekillerinin de bulunmaması durumunda Mahkemeye en kıdemli üye başkanlık eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başkanvekillerinin görev ve yetkileri şunlardır:</template>
          <mvz-bent no="a">
            <template>Bölümlere ve Başkanın gerekli gördüğü hâllerde Genel Kurul ya da Yüce Divana başkanlık etmek.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başkanı oldukları bölümün gündemini belirlemek.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Bölüm içinden oluşturulacak komisyonlarda üyelerin dönüşümlü olarak görev yapmalarını sağlamak.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Bu Kanunla verilmiş diğer görevler ile Başkan tarafından tevdi edilen işleri yapmak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Üyelerin yükümlülükleri">
        <mvz-fıkra no="1">
          <template>Üyeler;</template>
          <mvz-bent no="a">
            <template>Hâkimlik mesleğinin vakar ve şerefine uygun hareket etmek zorundadırlar; görevleriyle bağdaşmayan herhangi bir faaliyette bulunamazlar,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Geçerli bir mazeretleri olmadıkça oturumlara katılırlar,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Mahkemede görüşülmekte olan konularda görüş ve düşüncelerini açıklayamazlar,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Oturumun ve oylamanın gizliliğini muhafaza ederler,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Oylamalarda çekimser oy kullanamazlar,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Görevleri dışında resmî veya özel hiçbir görev alamazlar; davet olundukları ulusal ve uluslararası kongre, konferans ve benzeri bilimsel toplantılara Başkanın izniyle katılabilirler.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sportif, sosyal ve kültürel amaçlı derneklerde yönetim ve denetim kurullarında görev almamak koşuluyla üyelik hâli görev olarak nitelendirilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Disiplin İşlemleri ile Suç ve Cezalara İlişkin Hükümler">
      <mvz-madde no="16" başlık="Başkan ve üyeler hakkında inceleme ve soruşturma">
        <mvz-fıkra no="1">
          <template>Başkan ve üyelerin görevlerinden doğan veya görevleri sırasında işledikleri iddia edilen suçları, kişisel suçları ve disiplin eylemleri için soruşturma açılması Genel Kurulun kararına bağlıdır. Ancak, ağır ceza mahkemesinin görevine giren suçüstü hâllerinde, soruşturma genel hükümlere göre yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başkan, müstear adla yapılan veya yapıldığı anlaşılan imzasız, adressiz yahut belli bir olayı ve nedeni içermeyen, delilleri ve dayanakları gösterilmeyen ihbar ve şikâyetleri işleme koymaz. Ancak, bu ihbar ve şikâyetlerin somut delillere dayanması durumunda konu hakkında gerekli inceleme ve araştırma yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Başkan gereken hâllerde, işi Genel Kurula götürmeden önce üyelerden birine ön inceleme yaptırabilir. Soruşturma açılmasına yer olup olmadığının belirlenmesi için gerekli incelemeyi yapmak üzere görevlendirilen üye, incelemesini tamamladıktan sonra, durumu bir raporla Başkana bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Konu, Başkan tarafından gündeme alınarak Genel Kurulda görüşülür. Hakkında işlem yapılan üye görüşmeye katılamaz. Genel Kurulca, soruşturma açılmasına yer olmadığına karar verildiği takdirde, karar ilgili üye ile ihbar ve şikâyette bulunanlara tebliğ edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Soruşturma açılmasına karar verildiği takdirde, Genel Kurul, üyeler arasından üç kişiyi Soruşturma Kurulunu oluşturmak üzere seçer. Kıdemli üye Soruşturma Kuruluna başkanlık eder. Soruşturma Kurulu, 4/12/2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun Cumhuriyet savcısına tanıdığı bütün yetkilere sahiptir. Kurulun soruşturma ile ilgili yapılmasını istediği işlemler, mahallinde yetkili adli makamlar tarafından derhâl yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Ön inceleme yaptırılmasına, Soruşturma Kurulu üyelerinin seçilmesine, soruşturmanın yapılmasına ve gereken diğer kararların verilmesine dair esaslar İçtüzükle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Başkanın yukarıda yazılı hâl ve hareketlerinin görülmesi veya öğrenilmesi hâlinde, Başkan tarafından yapılması gereken işlemler kıdemli başkanvekilince yürütülür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="Adli soruşturma ve kovuşturma">
        <mvz-fıkra no="1">
          <template>Ağır ceza mahkemesinin görevine giren kişisel suçlarla ilgili suçüstü hâli istisna olmak üzere, görevlerinden doğan veya görevleri sırasında işledikleri iddia edilen suçları ve kişisel suçları nedeniyle Başkan ve üyeler hakkında koruma tedbirlerine ancak bu madde hükümlerine göre karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ağır ceza mahkemesinin görevine giren kişisel suçlarla ilgili suçüstü hâllerinde soruşturma genel hükümlere göre yürütülür. İddianame hazırlanması hâlinde kovuşturma Yargıtay ilgili ceza dairesince yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ağır ceza mahkemesinin görevine giren kişisel suçlarla ilgili suçüstü hâli dışındaki görevden doğan veya görev sırasında işlendiği iddia edilen suçlar ile kişisel suçlarda Soruşturma Kurulu, soruşturma sırasında 5271 sayılı Kanunda ve diğer kanunlarda yer alan koruma tedbirlerinin alınması talebinde bulunursa, Genel Kurulca bu konuda karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Soruşturma Kurulu soruşturmayı tamamladıktan sonra kamu davasının açılmasına gerek görmezse kovuşturma yapılmasına yer olmadığına karar verir. Kurul, kamu davası açılmasını gerekli görürse düzenleyeceği iddianameyi ve dosyayı görevleriyle ilgili suçlarda Yüce Divan sıfatıyla yargılama yapmak üzere Anayasa Mahkemesine, kişisel suçlarda ise Yargıtay ilgili ceza dairesine tevdi olunmak üzere Başkanlığa gönderir. Soruşturma Kurulunun vereceği kararlar şüpheliye ve varsa şikâyetçiye tebliğ olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Disiplin soruşturması işlemleri">
        <mvz-fıkra no="1">
          <template>Başkan ve üyelerin hâkimlik mesleğinin vakar ve şerefi ile bağdaşmayan veya hizmetin aksamasına yol açan hâl ve hareketlerinden dolayı haklarında 16 ncı maddede belirlenen kurallar çerçevesinde disiplin soruşturması yapılır. Genel Kurul, eldeki bilgi ve deliller ile isnat olunan hâl ve hareketin niteliğine göre disiplin soruşturması yapılmasına yer olup olmadığına karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ceza soruşturma ve kovuşturmaları, disiplin işlemlerinin ayrıca yapılmasına ve uygulanmasına engel olmaz. Disiplin soruşturmasını gerektiren eylemlerin öğrenilmesinden itibaren bir yıl geçmiş olması hâlinde disiplin soruşturması açılamaz. Disiplin cezasını gerektiren eylemin işlendiği tarihten itibaren beş yıl geçmiş olması hâlinde disiplin cezası verilemez. Disiplin cezasını gerektiren eylem, aynı zamanda bir suç teşkil eder, bu suç için kanunda daha uzun bir zamanaşımı süresi öngörülmüş olur ve ceza soruşturması veya kovuşturması da açılır ise, bu fıkrada belirtilen süre yerine zamanaşımı süreleri uygulanır. Genel Kurulca kovuşturma sonucunun beklenmesine karar verilenler hakkında ise, kovuşturmayı yürüten mahkeme kararının kesinleşmesinden itibaren bir yıl geçmekle ceza verme yetkisi zamanaşımına uğrar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel Kurul disiplin soruşturması açılmasına karar verirse Soruşturma Kurulu, konu ile ilgili bilgileri toplar ve sübut delillerini tespit eder, lüzum gördükleri kimseleri yeminle dinler, isnat olunan hâl ve hareketi bildirerek ilgiliyi onbeş günden az olmamak üzere tanınacak süre içinde savunmasını yapmaya davet eder. İlgili, savunmasının istendiği andan itibaren, soruşturma evrakını incelemeye yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kamu idareleri, kamu görevlileri, diğer gerçek ve bankalar dâhil tüzel kişiler, Soruşturma Kurulunun sorularına cevap vermek ve soruşturmayla ilgili taleplerini yerine getirmek zorundadırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Soruşturma Kurulu inceleme neticesinde, elde ettiği bilgi ve delilleri gösteren ve bunlara göre disiplin cezası verilmesine yer olup olmadığı hakkındaki kanaatlerini içeren bir rapor hazırlayarak rapor ve eklerini Genel Kurula iletmek üzere Başkanlığa sunar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Başkan, soruşturma sonucunu ilgiliye yazılı olarak bildirir ve ilgiliyi beş günden az olmamak üzere tayin edeceği süre içinde Genel Kurul huzurunda sözlü ya da yazılı savunmasını vermeye davet eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Genel Kurul, yapılan disiplin soruşturmasının sonucuna göre, gerekirse soruşturmanın genişletilmesine, isnat olunan hâl ve hareketi sabit görmezse dosyanın işlemden kaldırılmasına, sabit görmesi hâlinde ise eylemine uyan disiplin cezasına karar verir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Disiplin cezaları ve yerine getirilmesi">
        <mvz-fıkra no="1">
          <template>Başkan ve üyelerin, asli görevleri dışında resmî veya özel bir görev almaları ya da yaptıkları yeminle veya üyeliğin vakar ve şerefi ile bağdaşmayan, hizmetin aksamasına yol açan hâl ve hareketlerinin sabit görülmesi hâlinde, eylemin niteliğine göre, uyarma, kınama ya da üyelikten çekilmeye davet edilme cezalarından birisine karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Üyelikten çekilmeye davet edilme cezasına karar verilebilmesi için Genel Kurulun üçte iki oy çokluğu aranır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Disiplin cezasına ilişkin Genel Kurul kararına karşı ilgili, kararın kendisine tebliğ tarihinden itibaren on gün içinde Genel Kurula yeniden inceleme başvurusunda bulunabilir. Genel Kurulca yapılacak yeniden inceleme sonucunda verilen karar kesindir. Genel Kurul kararı Başkan tarafından ilgiliye tebliğ edilir ve yerine getirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Hakkında üyelikten çekilmeye davet cezası verilen üye, tebliğ tarihinden itibaren bir ay içinde buna uymazsa istifa etmiş sayılır ve bu süre içinde izinli kabul edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Teşkilat Yapısı">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Mahkeme Teşkilatı">
      <mvz-madde no="20" başlık="Teşkilat">
        <mvz-fıkra no="1">
          <template>Anayasa Mahkemesi teşkilatı; Başkanlık, Genel Kurul, bölümler, komisyonlar, Genel Sekreterlik ve idari birimlerden oluşur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="21" başlık="Genel Kurul">
        <mvz-fıkra no="1">
          <template>Genel Kurul, Mahkemenin onbeş üyesinden oluşur. Genel Kurul, Başkanın veya belirleyeceği başkanvekilinin başkanlığında en az on üye ile toplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel Kurulun görevleri şunlardır:</template>
          <mvz-bent no="a">
            <template>İptal ve itiraz davaları ile Yüce Divan sıfatıyla yürütülecek yargılamalara bakmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Siyasi partilere ilişkin mali denetim yapmak, dava ve başvuruları karara bağlamak.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>İçtüzüğü kabul etmek veya değiştirmek.</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Başkan ve başkanvekilleri ile Uyuşmazlık Mahkemesi Başkanı ve Başkanvekilini seçmek.</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Bölümler arasındaki iş bölümünü yapmak, bölümlerden birinin yıl içinde gelen işleri normal çalışmayla karşılanamayacak şekilde artmış ve bölümler arasında iş bakımından bir dengesizlik meydana gelmişse takvim yılı başında toplanıp bir kısım işleri diğer bölüme vermek.</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Bölümler arasında meydana gelen iş bölümü uyuşmazlıklarını kesin karara bağlamak, fiilî veya hukuki imkânsızlık nedeniyle bir bölümün görevine giren işe bakamaması hâlinde diğer bölümü görevlendirmek.</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Üyeler hakkında disiplin ve ceza soruşturması açılmasına, soruşturma ve kovuşturma tedbirlerine ve gerektiğinde disiplin cezası verilmesine ya da üyeliğin sona erdirilmesine karar vermek.</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>İtirazları incelemek.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Bölümler ve komisyonlar">
        <mvz-fıkra no="1">
          <template>Mahkemede, bireysel başvuruları karara bağlamak üzere bir başkanvekili başkanlığında altışar üyesi olan iki bölüm bulunur. Bölümler, bir başkanvekilinin başkanlığında dört üyenin katılımıyla toplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bölüm ve komisyonların oluşumu ve iş bölümü ile ilgili hususlar İçtüzükle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Genel Sekreterlik, Raportörler ve Raportör Yardımcıları">
      <mvz-madde no="23" başlık="Genel Sekreter ve Genel Sekreter yardımcılarının görevleri">
        <mvz-fıkra no="1">
          <template>Başkanlığa bağlı olarak Genel Sekreterlik birimi kurulur. Genel Sekreterliğe bağlı birimlerin çalışma esasları yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Genel Sekreter, Başkan tarafından raportörler arasından görevlendirilir. Genel Sekreterin görevde olmaması durumunda, yerine Genel Sekreterin belirleyeceği Genel Sekreter yardımcısı vekâlet eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel Sekreter, Başkanın gözetim ve denetimi altında;</template>
          <mvz-bent no="a">
            <template>Başvuruların kayıt ve sevk edilmesi,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Genel Kurul ve bölüm toplantılarıyla ilgili idari işlerin yürütülmesi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Kararların ve raporların otomasyonunun sağlanması ve arşivlenmesi,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Mahkemenin yazışmalarının yapılması,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Mahkeme kararlarının uygulanmasının takip edilmesi ve bu konuda Genel Kurula bilgi verilmesi,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Bütçenin harcanması ve bu konuda Başkana bilgi verilmesi,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Mahkemenin kurumsal, bilimsel, idari, mali ve teknik işlerinin yürütülmesi,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Protokol işlerinin düzenlenmesi,</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Personelin sevk ve idaresinin sağlanması,</template>
          </mvz-bent>
          <mvz-bent no="h">
            <template>Kanun, İçtüzük ve yönetmelik hükümleri çerçevesinde Başkan tarafından verilen diğer işlerin yapılması,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>konularında görevli ve yetkilidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Başkan tarafından raportörler arasından üç Genel Sekreter yardımcısı görevlendirilir. Genel Sekreter yardımcılarının görevleri ve aralarındaki iş bölümü ile ilgili hususlar yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="Raportörler">
        <mvz-fıkra no="1">
          <template>Mahkemede, yargısal ve idari çalışmalara yardımcı olmak üzere yeteri kadar raportör görevlendirilir ya da atanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkemede raportör olabilmek için aşağıdaki şartlardan birini taşımak gerekir:</template>
          <mvz-bent no="a">
            <template>Mesleklerinde en az beş yıl başarıyla çalışmış adli veya idari hâkim ya da savcı veya Sayıştay denetçisi, başdenetçisi ya da uzman denetçisi olmak.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Yükseköğretim kurumlarının hukuk, iktisat veya siyasal bilimler dallarında doçent, yardımcı doçent ya da doktorasını tamamlamış araştırma görevlisi olmak.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Adaylık süresi hariç, en az beş yıl başarıyla çalışmış raportör yardımcısı olmak.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kamu Personeli Yabancı Dil Bilgisi Seviye Tespit Sınavından en az (C) düzeyinde belge almış olmak ve lisansüstü çalışmalar yapmış olmak, raportörlüğe görevlendirmede ve atanmada tercih nedenidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Raportörler, idari yönden Başkana bağlı olup, görevlerini hâkimlik teminatına uygun olarak yerine getirirler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="25" başlık="Raportörlerin görevlendirilmesi, özlük hakları, disiplin ve ceza işleri">
        <mvz-fıkra no="1">
          <template>Raportör olarak çalışmak isteyenler bu konudaki isteklerini yazılı olarak Başkanlığa iletirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Raportörler Başkanın uygun görmesi üzerine bağlı oldukları kurum tarafından görevlendirilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunda hüküm bulunan hâller dışında, görevlendirilen raportörlerin özlük işlerinde, mensup oldukları mesleklere ait hükümler uygulanır ve raportör olarak Mahkemede geçirdikleri süreler mesleklerinde geçmiş sayılır. Yükselme ve kademe ilerlemelerinde Başkan tarafından verilecek yazılı bilgi esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mahkemenin kadrolarına atanan raportörlerin yükselme süreleri iki yıldır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Görevlendirilenler de dâhil raportörlerin aylıkları ve diğer mali hakları Mahkeme bütçesinden ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Görevlendirilen raportörlerin kanunî izin haklarına ve sağlık işlerine ilişkin işlemler Başkanlıkça yürütülür ve özlük dosyalarına işlenmek üzere kurumlarına bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>24 üncü maddenin ikinci fıkrasının (a) ve (b) bentlerine göre görevlendirilen raportörlerin görevlerinden ayrılmalarında, görevlendirmelerinde izlenen yöntem uygulanır. Görevlerinden ayrılmalarından sonra tabi oldukları kanunlara göre yapılacak atamalarda, sahip bulundukları derece ve kıdem, Mahkemedeki çalışmaları ile kendi istekleri dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>24 üncü maddenin ikinci fıkrasının (a) ve (b) bentlerine göre görevlendirilen raportörler, talepte bulunmaları ve Başkanlıkça uygun görülmesi hâlinde Mahkeme raportörü olarak atanırlar. Bu şekilde ataması yapılan raportörlerin önceki kurumlarıyla ilişikleri kesilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Mahkemenin raportörlük kadrolarına atananlar, emeklilik hakları ile teminatları bakımından kıdem, sınıf ve derecelerindeki birinci sınıf, birinci sınıfa ayrılmış, ikinci sınıf ve üçüncü sınıf hâkim ve savcılar hakkındaki hükümlere tabidir. Ek göstergelere ilişkin olarak birinci sınıfa ayrılmış hâkim ve savcılar için aranan “Yargıtay ve Danıştay üyeliklerine seçilme hakkını kaybetmemiş olmak” şartı, atanan raportörler için “birinci sınıfa ayrılma niteliklerini kaybetmemek” şeklinde uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Mahkemeye atanan raportörlerin aylık, ödenek, mali, sosyal ve emeklilik hakları, adli suçlarıyla ilgili soruşturma ve kovuşturma işlemleri ile diğer haklarına ilişkin bu Kanunda hüküm bulunmayan hâllerde, 2802 sayılı Kanunun ilgili hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>24 üncü maddenin ikinci fıkrasının (a) ve (b) bentlerine göre görevlendirilen raportörlerin görevlerinden doğan veya görevleri sırasında işledikleri suçlar ve kişisel suçları ile disiplin eylemlerinden dolayı Başkanın bildirmesi üzerine; bağlı bulundukları kurumlarca kendileriyle ilgili mevzuat hükümleri uyarınca işlem yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="26" başlık="Raportörlerin görevleri">
        <mvz-fıkra no="1">
          <template>Raportörler, Başkan tarafından kendilerine verilen dosyaların ilk ve esas inceleme raporlarını hazırlar ve toplantılara katılırlar; bireysel başvurularla ilgili olarak Kanunda ve İçtüzükte belirtilen görevleri ifa ederler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başkan tarafından gerektiğinde raportörlere tanık veya uzman dinleme ve benzeri görevler verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Raportörler Başkan tarafından komisyonlarda görevlendirilebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Raportörler Başkanın izin vermesi koşuluyla üniversitelerde, Türkiye Adalet Akademisinde ve benzeri kurum ve kuruluşlarda ders, kurs ve konferans verebilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kanun, İçtüzük, yönetmelik ya da Başkan tarafından verilen diğer görevleri yaparlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="27" başlık="Raportör yardımcıları ve adayları">
        <mvz-fıkra no="1">
          <template>Mahkemede, yargısal ve idari çalışmalara yardımcı olmak üzere yeteri kadar raportör yardımcısı atanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hukuk, siyasal bilgiler, iktisat, işletme, iktisadî ve idari bilimler alanlarında en az dört yıllık yükseköğrenim yapmış veya bunlara denkliği kabul edilmiş yabancı öğretim kurumlarından mezun olanlar ya da yabancı bir hukuk fakültesini bitirip de Türkiye’deki hukuk fakülteleri programlarına göre eksik kalan derslerden sınava girip başarı belgesi almış bulunanlar arasından açılacak giriş sınavını kazananlar, Başkan tarafından raportör yardımcılığına aday olarak atanır. Sınava girebilmek için askerlik hizmetini tamamlamış, erteletmiş veya askerlik hizmetinden muaf olmak, giriş sınavının yapıldığı yılın ocak ayının son günü itibarıyla, lisans ve lisansüstü öğrenimini yapmış olanlar için otuz, doktora öğrenimini tamamlamış olanlar için otuzbeş yaşını bitirmemiş olmak, 14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanununun 48 inci maddesinde belirtilen genel nitelikleri taşımak şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Giriş sınavı, yazılı sınav ve mülakattan oluşur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mülakat adayın;</template>
          <mvz-bent no="a">
            <template>Bir konuyu kavrayıp özetleme, ifade yeteneği ve muhakeme gücü,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Liyakati, temsil kabiliyeti, davranış ve tepkilerinin mesleğe uygunluğu,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Özgüveni, ikna kabiliyeti ve inandırıcılığı,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Genel yetenek ve genel kültürü,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Bilimsel ve teknolojik gelişmelere açıklığı,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>yönlerinden değerlendirilerek, ayrı ayrı puan verilmek suretiyle gerçekleştirilir. Adaylar, komisyon tarafından yukarıdaki bentlerde yazılı özelliklerin her biri için yirmişer puan üzerinden değerlendirilir ve verilen puanlar ayrı ayrı tutanağa geçirilir. Bunun dışında mülakat ile ilgili herhangi bir kayıt sistemi kullanılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Raportör yardımcıları ve raportör yardımcı adayları 657 sayılı Kanundaki genel idare hizmetleri sınıfına dâhil olup, raportörlük sınıf ve derecelerine dâhil değildirler. Bunlara 657 sayılı Kanunun bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Raportör yardımcılarının raportörlüğe atanabilmeleri için adaylık süresi hariç olmak üzere bu görevde fiilen en az beş yıl çalışmış olmaları, hazırlayacakları meslekî nitelikteki tezin kabul edilmesi şarttır. Bu koşulları taşıyanlar, kadro durumu da gözetilerek Genel Sekreterin teklifi ve Başkanın onayı ile raportörlüğe atanabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Raportör yardımcılığı adaylığına giriş sınavı usul ve esasları, adaylık eğitiminin şekli ve şartları, adaylık süresi sonunda yapılacak sınavın usul ve esasları, raportör yardımcılarının hazırlayacakları tezlerin şekil ve kapsamı ile diğer hususlar yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="28" başlık="Yüksek Disiplin Kurulu">
        <mvz-fıkra no="1">
          <template>Başkan, başkanvekilleri, üyeler ve 24 üncü maddenin ikinci fıkrasının (a) ve (b) bentlerinde sayılanlar hariç olmak üzere, Mahkemede istihdam edilen personelin disiplin işleri Yüksek Disiplin Kurulu tarafından yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kurul, Genel Sekreterin önerisi ve Başkanın onayı ile belirlenen üç raportörden oluşur. Bunlardan kıdemli olan raportör Kurula başkanlık eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Disiplin cezasını gerektiren hâller ve verilecek cezalar konusunda 657 sayılı Kanunun bu Kanuna aykırı olmayan hükümleri uygulanır. Kurulun çalışma usul ve esasları ile sair hususlar yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Hizmet Birimleri">
      <mvz-madde no="29" başlık="Hizmet birimleri">
        <mvz-fıkra no="1">
          <template>Mahkemenin hizmet birimleri şunlardır:</template>
          <mvz-bent no="a">
            <template>Yazı İşleri Müdürlüğü</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>İdarî ve Mali İşler Müdürlüğü</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Personel Müdürlüğü</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Yayın ve Halkla İlişkiler Müdürlüğü</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Dış İlişkiler Müdürlüğü</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Strateji Geliştirme Müdürlüğü</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>Teknik Hizmetler Müdürlüğü</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>Özel Kalem Müdürlüğü</template>
          </mvz-bent>
          <mvz-bent no="ğ">
            <template>Basın Müşavirliği</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İhtiyaç hâlinde Başkanın önerisi, Genel Kurulun kararı ile yeni birimler oluşturulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Hizmet birimlerinin görev ve sorumlulukları yönetmelikte gösterilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="30" başlık="Mahkeme personeli ve atanması">
        <mvz-fıkra no="1">
          <template>Mahkeme görevlerini yerine getirirken hukuki, idari ve mali alanlarda çalışmak üzere yeterli sayıda personel istihdam eder. Bu personel hakkında 657 sayılı Kanunun bu Kanuna aykırı olmayan hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Personelin ataması Genel Sekreterin önerisi üzerine Başkan tarafından yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="31" başlık="Geçici görevlendirme">
        <mvz-fıkra no="1">
          <template>Mahkemenin Anayasa ve bu Kanunda verilen görevlerini yerine getirirken ihtiyaç görülmesi hâlinde; hâkim, savcı ve Sayıştay denetçileri ile kamu kurum ve kuruluşlarında çalışanlardan memur ve diğer kamu görevlisi statüsünde olanlar aylık, ödenek, her türlü zam, tazminatlar ile diğer mali ve sosyal hak ve yardımlar kurumlarınca ödenmek kaydıyla Mahkemede geçici olarak görevlendirilebilir. Bu hüküm çerçevesince yapılacak görevlendirmelerde kamu görevlisinin muvafakati aranır. Bu şekilde yapılan görevlendirmenin süresi bir yılı geçemez. Ancak ihtiyaç hâlinde bu süre altı aylık dönemler hâlinde uzatılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Başkanın bu kapsamdaki görevlendirme talebi ilgili kurum ve kurullarca on gün içinde kanuni bir engeli olmaması hâlinde yerine getirilir. Geçici görev süresi ilgililerin terfi ve emekliliklerinde kurumlarınca hesaba katılarak özlük hakları devam ettirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Geçici görev süresince yükselme ve kademe ilerlemelerine esas olmak üzere Başkan, ilgili kurum ve kurullara yazılı bilgi verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Geçici olarak görevlendirilenlerin kendi kurumlarında aldıkları net aylıkları ile hâkim, savcı ve Sayıştay meslek mensupları arasından görevlendirilenler için raportörlerin; memurlar ve diğer kamu görevlileri için Mahkemede görev yapmakta olan emsali memurların almakta oldukları aylıklar ve diğer ödemeler arasındaki fark ayrıca ödenir. Bu fıkraya göre yapılacak ödemeler hakkında aylıklara ilişkin hükümler uygulanır ve damga vergisi hariç herhangi bir vergiye tabi tutulmaz, her ne şekilde olursa olsun başka bir ödemenin hesaplanmasında dikkate alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="32" başlık="Sözleşmeli personel">
        <mvz-fıkra no="1">
          <template>Mahkeme Başkanlığında; 657 sayılı Kanun ve diğer kanunların sözleşmeli personel çalıştırılması hakkındaki hükümlerine bağlı olmaksızın, kadroları karşılık gösterilmek suretiyle, sözleşmeli olarak basın müşaviri ve mütercim çalıştırılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu suretle çalıştırılacakların sözleşme usul ve esasları ile ödenecek brüt sözleşme ücreti, birinci derecedeki raportör yardımcısı için belirlenen brüt ortalama aylıkları geçmemek üzere Başkanlıkça tespit edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="33" başlık="Hizmet satın alma">
        <mvz-fıkra no="1">
          <template>Başkan, Mahkemenin ihtiyaç duyduğu alanlarda projelerin hazırlanması, gerçekleştirilmesi, işletilmesi ve işlerliği için şart olan zaruri ve istisnai hâllere münhasır olmak üzere özel bir meslek bilgisi ve ihtisasını gerektiren işlerde hizmet alımı yoluyla yerli ve yabancı uzman çalıştırmaya yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="34" başlık="İdarî personelin Adalet Bakanlığı kadrolarına atanması">
        <mvz-fıkra no="1">
          <template>27 nci maddenin birinci fıkrasına göre atananlar hariç, Mahkemenin hizmet birimlerinde çalışan 657 sayılı Kanuna tabi personel, Genel Sekreterin teklifi ve Başkanın uygun görmesi üzerine, mükteseplerine uygun olarak Adalet Bakanlığınca Bakanlık merkez ve taşra teşkilatı kadrolarına atanabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="4-DÖRDÜNCÜ" başlık="İnceleme ve Yargılama Usulleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="İptal Davası">
      <mvz-madde no="35" başlık="İptal davası açmaya yetkili olanlar">
        <mvz-fıkra no="1">
          <template>Kanunların, Cumhurbaşkanlığı kararnamelerinin, Türkiye Büyük Millet Meclisi İçtüzüğünün veya bunların belirli madde ya da hükümlerinin Anayasaya aykırılığı iddiasıyla doğrudan doğruya iptal davası açmaya yetkili olanlar şunlardır:</template>
          <mvz-bent no="a">
            <template>Cumhurbaşkanı</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Türkiye Büyük Millet Meclisinde en fazla üyeye sahip iki siyasi parti grubundan her biri</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Türkiye Büyük Millet Meclisi üye tamsayısının en az beşte biri oranındaki üyeleri</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türkiye Büyük Millet Meclisindeki üye sayılarında eşitlik bulunması halinde, iptal davası açabilecek siyasi parti grupları, son milletvekili genel seçiminde alınan geçerli oy sayısına göre belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Anayasa değişikliklerinin ve kanunların şekil bakımından Anayasaya aykırılığı iddiasıyla iptal davası açmaya Cumhurbaşkanı veya Türkiye Büyük Millet Meclisi üye tam sayısının en az beşte biri oranındaki milletvekilleri yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="36" başlık="Şekil bakımından iptal davası ve sınırı">
        <mvz-fıkra no="1">
          <template>Şekil bakımından denetim; Anayasa değişikliklerinde teklif çoğunluğuna, oylama çoğunluğuna ve ivedilikle görüşülemeyeceği şartına uyulup uyulmadığı; kanunların ve Türkiye Büyük Millet Meclisi İçtüzüğünün son oylamasının öngörülen çoğunlukla yapılıp yapılmadığı;  hususlarıyla sınırlıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Anayasa değişikliklerine karşı iptal davaları yalnız şekil bakımından aykırılık iddiası ile açılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Şekil bozukluğuna dayanan iptal davaları Mahkeme tarafından öncelikle incelenerek karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Şekil bozukluğuna dayanan Anayasaya aykırılık iddiası mahkemeler tarafından ileri sürülemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="37" başlık="İptal davası açma süresi">
        <mvz-fıkra no="1">
          <template>Anayasa değişiklikleri ile kanunların şekil yönünden Anayasaya aykırılıkları iddiası ile doğrudan doğruya iptal davası açma hakkı, bunların Resmî Gazetede yayımlanmalarından başlayarak on gün; Cumhurbaşkanlığı kararnameleri ile Türkiye Büyük Millet Meclisi İçtüzüğünün veya bunların belli madde ve hükümlerinin şekil ve esas, kanunların ise sadece esas yönlerinden Anayasaya aykırılıkları iddiasıyla doğrudan doğruya iptal davası açma hakkı, bunların Resmî Gazetede yayımlanmalarından başlayarak altmış gün sonra düşer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="38" başlık="İptal davası açılmasında temsil ve uyulması gereken esaslar">
        <mvz-fıkra no="1">
          <template>Kanunların, Cumhurbaşkanlığı kararnamelerinin ve Türkiye Büyük Millet Meclisi İçtüzüğünün veya bunların belirli madde ya da hükümlerinin Anayasaya aykırılığı iddiasıyla açılacak iptal davası, 35 inci maddenin birinci fıkrasının (b) bendinde yazılı siyasi parti gruplarının genel kurullarının, üye tam sayısının salt çoğunluğu ile alacakları karar üzerine açılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Dava, 35 inci maddenin birinci fıkrasının (c) bendinde yazılı Türkiye Büyük Millet Meclisi üyeleri tarafından açıldığı takdirde dilekçede, kendilerine Mahkemece tebligat yapılmak üzere, iki üyenin adının gösterilmesi gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>İptal davası, Anayasa değişiklikleri ile kanunların, Cumhurbaşkanlığı kararnamelerinin ve Türkiye Büyük Millet Meclisi İçtüzüğünün veya bunların belirli madde ya da hükümlerinin Anayasaya aykırılığı iddiası ile iptalini ihtiva eden dava dilekçesinin Genel Sekreterlikçe, Yazı İşleri Müdürlüğüne havale edildiği tarihte açılmış sayılır. Davayı açanlara Genel Sekreterlikçe başvurunun kayda alındığına dair bir belge verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Dava, Türkiye Büyük Millet Meclisinin üye tam sayısının en az beşte biri oranındaki milletvekilleri tarafından açılmakta ise dava dilekçesi ile birlikte davayı açanların sıra numarasıyla ad ve soyadlarının, seçildikleri bölgelerinin ve imzalarının yer alması ve bu dilekçenin imzaları içeren her bir sayfasının o sayfada ad ve soyadları ile imzaları bulunanların milletvekili ve imzalarının da kendilerine ait olduğunun ayrı ayrı Türkiye Büyük Millet Meclisi Başkanı veya belirleyeceği görevli tarafından imza ve mühür konulmak suretiyle onaylanmış olarak Genel Sekreterliğe verilmesi zorunludur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Siyasi parti grupları tarafından açılan davalarda ise grup genel kurulu kararının onaylı örnekleri ile dava dilekçesinde imzası olanların, grup başkanı veya vekili olduklarını belirleyen onaylı belge örneklerinin dava dilekçesi ile birlikte Genel Sekreterliğe verilmesi gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>İptal davalarında, Anayasaya aykırılıkları ileri sürülen hükümlerin Anayasanın hangi maddelerine aykırı olduğunun ve gerekçelerinin belirtilmiş olması zorunludur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="39" başlık="Eksikliklerin tamamlattırılması ve görüş bildirme">
        <mvz-fıkra no="1">
          <template>Mahkemece, dava dilekçesinin, 38 inci maddede gösterilen şartları taşıyıp taşımadığı, kayıt tarihinden itibaren on gün içinde incelenir. Başvuru dilekçesinde eksiklikler varsa kararla saptanarak onbeş günden az olmamak üzere verilecek süre içinde tamamlanması ilgililere tebliğ olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Dava, Türkiye Büyük Millet Meclisinin üye tam sayısının en az beşte biri oranındaki milletvekilleri tarafından açılmışsa, eksikliklerin tamamlanmasına ilişkin tebligat, başvuru dilekçesinde tebligatların yapılacağı belirtilen milletvekillerine, dilekçede bu husus belirtilmemişse dilekçenin en başında ad ve soyadları yazılı olan iki üyeye yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci fıkrada belirtilen süre içinde eksikliklerin tamamlanmaması hâlinde Genel Kurulca iptal davasının açılmamış sayılmasına karar verilir. Bu karar, ilgililere tebliğ olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İptal davalarında Mahkemece esasın incelenmesine karar verilmesi hâlinde, dava dilekçesi ile ekleri Türkiye Büyük Millet Meclisi Başkanlığı, Cumhurbaşkanlığı ile iptal davası açmaya yetkili siyasi parti gruplarına gönderilir. Bu makamlar, iptal davasıyla ilgili yazılı görüşlerini değerlendirilmek üzere Mahkemeye bildirebilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="İtiraz Yolu">
      <mvz-madde no="40" başlık="Anayasaya aykırılığın mahkemelerce ileri sürülmesi">
        <mvz-fıkra no="1">
          <template>Bir davaya bakmakta olan mahkeme, bu davada uygulanacak bir kanun veya Cumhurbaşkanlığı kararnamesinin hükümlerini Anayasaya aykırı görürse veya taraflardan birinin ileri sürdüğü aykırılık iddiasının ciddi olduğu kanısına varırsa;</template>
          <mvz-bent no="a">
            <template>İptali istenen kuralların Anayasanın hangi maddelerine aykırı olduklarını açıklayan gerekçeli başvuru kararının aslını,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Başvuru kararına ilişkin tutanağın onaylı örneğini,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Dava dilekçesi, iddianame veya davayı açan belgeler ile dosyanın ilgili bölümlerinin onaylı örneklerini,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>dizi listesine bağlayarak Anayasa Mahkemesine gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Taraflarca ileri sürülen Anayasaya aykırılık iddiası davaya bakan mahkemece ciddi görülmezse bu konudaki talep, gerekçeleri de gösterilmek suretiyle reddedilir. Bu husus esas hükümle birlikte temyiz konusu yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Genel Sekreterlik gelen evrakı kaleme havale eder ve keyfiyeti başvuran mahkemeye bir yazı ile bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Evrakın kayda girişinden itibaren on gün içinde başvurunun yöntemine uygun olup olmadığı incelenir. Açık bir şekilde dayanaktan yoksun veya yöntemine uygun olmayan itiraz başvuruları, Mahkeme tarafından esas incelemeye geçilmeksizin gerekçeleriyle reddedilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Anayasa Mahkemesi, işin kendisine noksansız olarak gelişinden başlamak üzere beş ay içinde kararını verir ve açıklar. Bu süre içinde karar verilmezse ilgili mahkeme davayı yürürlükteki hükümlere göre sonuçlandırır. Ancak, Anayasa Mahkemesinin kararı, esas hakkındaki karar kesinleşinceye kadar gelirse mahkeme buna uymak zorundadır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="41" başlık="Başvuruya engel durumlar">
        <mvz-fıkra no="1">
          <template>Mahkemenin işin esasına girerek verdiği ret kararının Resmî Gazetede yayımlanmasından itibaren on yıl geçmedikçe aynı kanun hükmünün Anayasaya aykırılığı iddiasıyla itiraz başvurusu yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İtiraz yoluna başvuran mahkemede itiraz konusu kuralın uygulanacağı başka dava dosyalarının bulunması hâlinde, yapılmış olan itiraz başvurusu bu dosyalar için de bekletici mesele sayılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="İptal ve İtiraz Davalarına İlişkin Ortak Hükümler">
      <mvz-madde no="42" başlık="Anayasaya aykırılığı ileri sürülemeyecek düzenlemeler">
        <mvz-fıkra no="1">
          <template>Usulüne göre yürürlüğe konulmuş milletlerarası andlaşmalar aleyhine şekil ve esas bakımından iptal davası açılamaz ve mahkemeler tarafından Anayasaya aykırılık iddiası ileri sürülemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ayrıca;</template>
          <mvz-bent no="a">
            <template>3 Mart 1340 tarihli ve 430 sayılı Tevhidi Tedrisat Kanununun,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>25 Teşrinisani 1341 tarihli ve 671 sayılı Şapka İktisası Hakkında Kanunun,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>30 Teşrinisani 1341 tarihli ve 677 sayılı Tekke ve Zaviyelerle Türbelerin Seddine ve Türbedarlıklar ile Birtakım Unvanların Men ve İlgasına Dair Kanunun,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>17 Şubat 1926 tarihli ve 743 sayılı Türk Kanunu Medenisiyle kabul edilen, evlenme aktinin evlendirme memuru önünde yapılacağına dair medeni nikâh esası ile aynı Kanunun 110 uncu maddesi hükmünün,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>20 Mayıs 1928 tarihli ve 1288 sayılı Beynelmilel Erkamın Kabulü Hakkında Kanunun,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>1 Teşrinisani 1928 tarihli ve 1353 sayılı Türk Harflerinin Kabul ve Tatbiki Hakkında Kanunun,</template>
          </mvz-bent>
          <mvz-bent no="f">
            <template>26 Teşrinisani 1934 tarihli ve 2590 sayılı Efendi, Bey, Paşa gibi Lâkap ve Unvanların Kaldırıldığına Dair Kanunun,</template>
          </mvz-bent>
          <mvz-bent no="g">
            <template>3 Kânunuevvel 1934 tarihli ve 2596 sayılı Bazı Kisvelerin Giyilemeyeceğine Dair Kanunun,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>7 Kasım 1982 gününde yürürlükte bulunan hükümlerinin Anayasaya aykırı olduğu iddia edilemez.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="43" başlık="Dosya üzerinden inceleme ve gerekçeyle bağlı olmama">
        <mvz-fıkra no="1">
          <template>İptal davaları ve itiraz başvurularında dosya üzerinden inceleme yapılır. Mahkeme ayrıca gerekli gördüğü hâllerde, sözlü açıklamalarda bulunmak üzere ilgilileri ve konu hakkında bilgisi olanları çağırabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Cumhurbaşkanı adına Cumhurbaşkanının tensip edeceği görevli sözlü açıklamada bulunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkemenin, kanunların, Cumhurbaşkanlığı kararnamelerinin ve Türkiye Büyük Millet Meclisi İçtüzüğünün Anayasaya aykırılığı hususunda ileri sürülen gerekçelere dayanma zorunluluğu yoktur. Mahkeme, taleple bağlı kalmak şartıyla başka gerekçeyle de Anayasaya aykırılık kararı verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Başvuru, kanunun, Cumhurbaşkanlığı kararnamesinin veya Türkiye Büyük Millet Meclisi İçtüzüğünün sadece belirli madde veya hükümleri aleyhine yapılmış olup da, bu madde veya hükümlerin iptali kanunun, Cumhurbaşkanlığı kararnamesinin veya Türkiye Büyük Millet Meclisi İçtüzüğünün diğer bazı hükümlerinin veya tamamının uygulanamaması sonucunu doğuruyorsa, keyfiyeti gerekçesinde belirtmek şartıyla Mahkeme, uygulama kabiliyeti kalmayan kanunun, Cumhurbaşkanlığı kararnamesinin veya Türkiye Büyük Millet Meclisi İçtüzüğünün bahis konusu öteki hükümlerinin veya tümünün iptaline karar verebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="44" başlık="Gündeme alınan dosyaların görüşülmesi">
        <mvz-fıkra no="1">
          <template>Mahkemenin müzakereleri gizli olup, Başkanın uygun göreceği teknik araçlarla kaydı yapılır. Bu kayıtların muhafazası ve kullanımına ilişkin esaslar yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Müzakerelerin düzeni ve yönetimi Başkan veya kendisinin toplantıya katılmaması hâlinde görevlendireceği başkanvekili tarafından sağlanır. Üyelere talep sırasına göre söz verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Bireysel Başvuru">
      <mvz-madde no="45" başlık="Bireysel başvuru hakkı">
        <mvz-fıkra no="1">
          <template>Herkes, Anayasada güvence altına alınmış temel hak ve özgürlüklerinden, Avrupa İnsan Hakları Sözleşmesi ve buna ek Türkiye’nin taraf olduğu protokoller kapsamındaki herhangi birinin kamu gücü tarafından, ihlal edildiği iddiasıyla Anayasa Mahkemesine başvurabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İhlale neden olduğu ileri sürülen işlem, eylem ya da ihmal için kanunda öngörülmüş idari ve yargısal başvuru yollarının tamamının bireysel başvuru yapılmadan önce tüketilmiş olması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yasama işlemleri ile düzenleyici idari işlemler aleyhine doğrudan bireysel başvuru yapılamayacağı gibi Anayasa Mahkemesi kararları ile Anayasanın yargı denetimi dışında bıraktığı işlemler de bireysel başvurunun konusu olamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="46" başlık="Bireysel başvuru hakkına sahip olanlar">
        <mvz-fıkra no="1">
          <template>Bireysel başvuru ancak ihlale yol açtığı ileri sürülen işlem, eylem ya da ihmal nedeniyle güncel ve kişisel bir hakkı doğrudan etkilenenler tarafından yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kamu tüzel kişileri bireysel başvuru yapamaz. Özel hukuk tüzel kişileri sadece tüzel kişiliğe ait haklarının ihlal edildiği gerekçesiyle bireysel başvuruda bulunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yalnızca Türk vatandaşlarına tanınan haklarla ilgili olarak yabancılar bireysel başvuru yapamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="47" başlık="Bireysel başvuru usulü">
        <mvz-fıkra no="1">
          <template>Bireysel başvurular, bu Kanunda ve İçtüzükte belirtilen şartlara uygun olarak doğrudan ya da mahkemeler veya yurt dışı temsilcilikler vasıtasıyla yapılabilir. Başvurunun diğer yollarla kabulüne ilişkin usul ve esaslar İçtüzükle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bireysel başvurular harca tabidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Başvuru dilekçesinde başvurucunun ve varsa temsilcisinin kimlik ve adres bilgilerinin, işlem, eylem ya da ihmal nedeniyle ihlal edildiği ileri sürülen hak ve özgürlüğün ve dayanılan Anayasa hükümlerinin, ihlal gerekçelerinin, başvuru yollarının tüketilmesine ilişkin aşamaların, başvuru yollarının tüketildiği, başvuru yolu öngörülmemişse ihlalin öğrenildiği tarih ile varsa uğranılan zararın belirtilmesi gerekir. Başvuru dilekçesine, dayanılan deliller ile ihlale neden olduğu ileri sürülen işlem veya kararların aslı ya da örneğinin ve harcın ödendiğine dair belgenin eklenmesi şarttır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Başvurucu bir avukat tarafından temsil ediliyorsa, vekâletnamenin sunulması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bireysel başvurunun, başvuru yollarının tüketildiği tarihten; başvuru yolu öngörülmemişse ihlalin öğrenildiği tarihten itibaren otuz gün içinde yapılması gerekir. Haklı bir mazereti nedeniyle süresi içinde başvuramayanlar, mazeretin kalktığı tarihten itibaren onbeş gün içinde ve mazeretlerini belgeleyen delillerle birlikte başvurabilirler. Mahkeme, öncelikle başvurucunun mazeretinin geçerli görülüp görülmediğini inceleyerek talebi kabul veya reddeder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Başvuru evrakında herhangi bir eksiklik bulunması hâlinde, Mahkeme yazı işleri tarafından eksikliğin giderilmesi için başvurucu veya varsa vekiline onbeş günü geçmemek üzere bir süre verilir ve geçerli bir mazereti olmaksızın bu sürede eksikliğin tamamlanmaması durumunda başvurunun reddine karar verileceği bildirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="48" başlık="Bireysel başvuruların kabul edilebilirlik şartları ve incelenmesi">
        <mvz-fıkra no="1">
          <template>Bireysel başvuru hakkında kabul edilebilirlik kararı verilebilmesi için 45 ila 47 nci maddelerde öngörülen şartların taşınması gerekir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkeme, Anayasanın uygulanması ve yorumlanması veya temel hakların kapsamının ve sınırlarının belirlenmesi açısından önem taşımayan ve başvurucunun önemli bir zarara uğramadığı başvurular ile açıkça dayanaktan yoksun başvuruların kabul edilemezliğine karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kabul edilebilirlik incelemesi komisyonlarca yapılır. Kabul edilebilirlik şartlarını taşımadığına oy birliği ile karar verilen başvurular hakkında, kabul edilemezlik kararı verilir. Oy birliği sağlanamayan dosyalar bölümlere havale edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kabul edilemezlik kararları kesindir ve ilgililere tebliğ edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Kabul edilebilirlik şartları ve incelemesinin usul ve esasları ile ilgili diğer hususlar İçtüzükle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="49" başlık="Esas hakkındaki inceleme">
        <mvz-fıkra no="1">
          <template>Kabul edilebilirliğine karar verilen bireysel başvuruların esas incelemesi bölümler tarafından yapılır. Başkan iş yükünün bölümler arasında dengeli bir şekilde dağıtılması için gerekli önlemleri alır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bireysel başvurunun kabul edilebilirliğine karar verilmesi hâlinde, başvurunun bir örneği bilgi için Adalet Bakanlığına gönderilir. Adalet Bakanlığı gerekli gördüğü hâllerde görüşünü yazılı olarak Mahkemeye bildirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Komisyonlar ve bölümler bireysel başvuruları incelerken bir temel hakkın ihlal edilip edilmediğine yönelik her türlü araştırma ve incelemeyi yapabilir. Başvuruyla ilgili gerekli görülen bilgi, belge ve deliller ilgililerden istenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mahkeme, incelemesini dosya üzerinden yapmakla birlikte, gerekli görürse duruşma yapılmasına da karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bölümler, esas inceleme aşamasında, başvurucunun temel haklarının korunması için zorunlu gördükleri tedbirlere resen veya başvurucunun talebi üzerine karar verebilir. Tedbire karar verilmesi hâlinde, esas hakkındaki kararın en geç altı ay içinde verilmesi gerekir. Aksi takdirde tedbir kararı kendiliğinden kalkar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bölümlerin, bir mahkeme kararına karşı yapılan bireysel başvurulara ilişkin incelemeleri, bir temel hakkın ihlal edilip edilmediği ve bu ihlalin nasıl ortadan kaldırılacağının belirlenmesi ile sınırlıdır. Bölümlerce kanun yolunda gözetilmesi gereken hususlarda inceleme yapılamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bireysel başvuruların incelenmesinde, bu Kanun ve İçtüzükte hüküm bulunmayan hâllerde ilgili usul kanunlarının bireysel başvurunun niteliğine uygun hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Esas hakkında incelemenin usul ve esasları ile ilgili diğer hususlar İçtüzükle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="50" başlık="Kararlar">
        <mvz-fıkra no="1">
          <template>Esas inceleme sonunda, başvurucunun hakkının ihlal edildiğine ya da edilmediğine karar verilir. İhlal kararı verilmesi hâlinde ihlalin ve sonuçlarının ortadan kaldırılması için yapılması gerekenlere hükmedilir. Ancak yerindelik denetimi yapılamaz, idari eylem ve işlem niteliğinde karar verilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Tespit edilen ihlal bir mahkeme kararından kaynaklanmışsa, ihlali ve sonuçlarını ortadan kaldırmak için yeniden yargılama yapmak üzere dosya ilgili mahkemeye gönderilir. Yeniden yargılama yapılmasında hukuki yarar bulunmayan hâllerde başvurucu lehine tazminata hükmedilebilir veya genel mahkemelerde dava açılması yolu gösterilebilir. Yeniden yargılama yapmakla yükümlü mahkeme, Anayasa Mahkemesinin ihlal kararında açıkladığı ihlali ve sonuçlarını ortadan kaldıracak şekilde mümkünse dosya üzerinden karar verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bölümlerin esas hakkındaki kararları gerekçeleriyle birlikte ilgililere ve Adalet Bakanlığına tebliğ edilir ve Mahkemenin internet sayfasında yayımlanır. Bu kararlardan hangilerinin Resmî Gazetede yayımlanacağına ilişkin hususlar İçtüzükte gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Komisyonlar arasındaki içtihat farklılıkları, bağlı oldukları bölümler; bölümler arasındaki içtihat farklılıkları ise Genel Kurul tarafından karara bağlanır. Buna ilişkin diğer hususlar İçtüzükle düzenlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Davadan feragat hâlinde, düşme kararı verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="51" başlık="Başvuru hakkının kötüye kullanılması">
        <mvz-fıkra no="1">
          <template>Bireysel başvuru hakkını açıkça kötüye kullandığı tespit edilen başvurucular aleyhine, yargılama giderlerinin dışında, ayrıca ikibin Türk Lirasından fazla olmamak üzere disiplin para cezasına hükmedilebilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Siyasi Parti Kapatma ve Dokunulmazlığın Kaldırılması Davaları">
      <mvz-madde no="52" başlık="Siyasi parti kapatma davaları">
        <mvz-fıkra no="1">
