          <template>Yargıtay Cumhuriyet Başsavcısı tarafından açılan dava üzerine Mahkeme, bir siyasi partinin Anayasanın 69 uncu maddesinde sayılan hâllerden ötürü kapatılmasına veya dava konusu fiillerin ağırlığına göre Devlet yardımından kısmen ya da tamamen yoksun bırakılmasına, toplantıya katılan üyelerin üçte iki oy çokluğuyla karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Siyasi partilerin kapatılmasına ilişkin davalar, 5271 sayılı Kanunun davanın mahiyetine uygun hükümleri uygulanmak suretiyle dosya üzerinden Genel Kurulca incelenir ve kesin karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Başkanın görevlendirdiği raportör ilk inceleme raporunu hazırlayarak Başkanlığa sunar. Yapılacak ilk inceleme sonrasında iddianamenin kabulüne karar verilmesi hâlinde, iddianame ve ekleri ilgili siyasi partiye gönderilerek usul ve esasa ilişkin savunmaları alınır. Davalı partinin yazılı savunma vermesi hâlinde, bu savunma Yargıtay Cumhuriyet Başsavcılığına gönderilir. Ayrıca Yargıtay Cumhuriyet Başsavcısından sonra kapatılması istenen siyasi partinin genel başkanlığının veya tayin edeceği bir vekilin sözlü savunması dinlenir. Hakkında siyasi yasaklılık istenenler iddialarla ilgili savunmalarını yazılı olarak sunabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Genel Kurul, gerekli gördüğü hâllerde sözlü açıklamalarını dinlemek için ilgilileri ve konu hakkında bilgisi olanları çağırabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Siyasi parti kapatma davası sonucunda verilen karar, Yargıtay Cumhuriyet Başsavcısı ile ilgili siyasi partiye tebliğ edilir ve Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="53" başlık="Siyasi partilere ihtar verilmesi">
        <mvz-fıkra no="1">
          <template>Yargıtay Cumhuriyet Başsavcısı, bir siyasi partinin 22/4/1983 tarihli ve 2820 sayılı Siyasi Partiler Kanununun 101 inci maddesi dışında kalan emredici hükümleriyle diğer kanunların siyasi partilerle ilgili emredici hükümlerine aykırı hareket ettiği iddiasıyla, o parti aleyhine ihtar kararı verilmesi istemiyle Mahkemeye başvurabilir. Mahkemece verilecek süre içinde siyasi partinin savunması alındıktan sonra, aykırılık tespit edilirse aykırılığın giderilmesi için ilgili siyasi parti hakkında ihtar kararı verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu karar, Yargıtay Cumhuriyet Başsavcısı ile ilgili siyasi partiye tebliğ edilir ve Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="54" başlık="Dokunulmazlığın kaldırılması veya milletvekilliğinin düşmesi durumlarında iptal talebi">
        <mvz-fıkra no="1">
          <template>Yasama dokunulmazlığının kaldırılmasına veya milletvekilliğinin düşmesine ilişkin Türkiye Büyük Millet Meclisi kararlarına karşı, ilgili milletvekili, Cumhurbaşkanı yardımcısı veya bakan ya da bir diğer milletvekili, kararın alındığı günden başlayarak yedi gün içinde kararın Anayasaya, kanuna veya Türkiye Büyük Millet Meclisi İçtüzüğüne aykırılığı iddiasıyla iptali için Mahkemeye başvurabilir. Bu talep onbeş gün içinde kesin olarak karara bağlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İptal taleplerinde Mahkeme, ilgilinin ibraz etmesini beklemeksizin gerekli evrakı doğrudan getirtir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="6-ALTINCI" başlık="Siyasi Partilerin Mali Denetimi">
      <mvz-madde no="55" başlık="Siyasi partilerin mali denetimi">
        <mvz-fıkra no="1">
          <template>Mahkeme siyasi partilerin mal edinimleri ile gelir ve giderlerinin kanuna uygunluğunun denetimi için Sayıştaydan yardım sağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Siyasi partiler, karara bağlanarak birleştirilmiş bulunan kesin hesap ile parti merkez ve bağlı ilçeleri de kapsayan iller teşkilatının kesin hesaplarının onaylı birer örneğini haziran ayı sonuna kadar 2820 sayılı Kanuna uygun olarak, Anayasa Mahkemesi Başkanlığına gönderirler. Mahkeme kendisine gönderilmiş olan bu belgeleri incelenmek üzere Sayıştay Başkanlığına gönderir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sayıştayca düzenlenen incelemeye ilişkin raporlar karara bağlanmak üzere Mahkemeye gönderilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="56" başlık="Mali denetimde ilk ve esas inceleme">
        <mvz-fıkra no="1">
          <template>Siyasi partilerin kesin hesapları üzerindeki inceleme 2820 sayılı Kanun hükümlerine göre yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yapılan incelemeye ilişkin raporlar ilgili siyasi partiye gönderilerek en geç iki ay içinde görüşünü bildirmesi istenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme mali denetim sırasında siyasi partilerin incelemeye ilişkin raporlar hakkındaki görüşlerini de değerlendirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mahkemenin mali denetime ilişkin kararlarının birer örneği ilgili siyasi partiye ve siyasi partinin sicil dosyasına konulmak üzere Yargıtay Cumhuriyet Başsavcılığına gönderilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Mali denetim sonucunda verilen kararlar Resmî Gazetede yayımlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="7-YEDİNCİ" başlık="Yüce Divan Yargılaması">
      <mvz-madde no="57" başlık="Duruşma">
        <mvz-fıkra no="1">
          <template>Genel Kurul, Yüce Divan sıfatıyla çalışırken yürürlükteki kanunlara göre duruşma yapar ve hüküm verir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Cumhurbaşkanı, Cumhurbaşkanı yardımcıları ve bakanlar hakkındaki Yüce Divan yargılamaları üç ay içinde tamamlanır. Yargılama bu süre içinde tamamlanamadığı takdirde, ilave üç aylık süre içinde kesin olarak tamamlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yüce Divan, 5271 sayılı Kanundaki iddianamenin iadesi sebeplerinden başka esaslı hukuka aykırı hâllerin bulunması hâlinde de iddianamenin veya iddianame yerine geçen belgelerin iadesine karar verebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Yüce Divanda sorgusu yapılmış olan sanığın, sonraki oturumlara gelmemesi ve Yüce Divan tarafından da duruşmada hazır bulunmasına gerek görülmemesi hâllerinde, duruşmadan vâreste tutulma talebi olmasa dahi yokluğunda duruşmaya devam edilerek kamu davası sonuçlandırılabilir. Müdafi her zaman duruşmada hazır bulunabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Duruşma sırasında Başkanın uygun göreceği teknik araçlarla kayıt yapılır. Bu kayda dayanılarak düzenlenen duruşma tutanaklarının her sayfası Başkan ile tutanağı düzenleyenler tarafından imzalanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Yüce Divanda savcılık görevini, Yargıtay Cumhuriyet Başsavcısı veya Yargıtay Cumhuriyet Başsavcıvekili yapar. Yargıtay Cumhuriyet savcılarından görevlendirilenler de Yargıtay Cumhuriyet Başsavcısı veya Yargıtay Cumhuriyet Başsavcıvekiliyle birlikte duruşmaya katılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="58" başlık="Yeniden inceleme">
        <mvz-fıkra no="1">
          <template>Yüce Divan tarafından verilen hükme karşı yeniden inceleme başvurusu, Yargıtay Cumhuriyet Başsavcısı veya Yargıtay Cumhuriyet Başsavcıvekili, sanık, müdafi, katılan veya vekili tarafından yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Yeniden inceleme başvurusu hükmün açıklanmasından itibaren onbeş gün içinde Yüce Divana bir dilekçe verilmesi suretiyle yapılır. Hüküm, yeniden incelemeye başvurma hakkı olanların yokluğunda açıklanmışsa, süre tebliğ tarihinden başlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Yüce Divan yeniden incelemeyi dosya üzerinden yapar. Yargıtay Cumhuriyet Başsavcısının veya Yargıtay Cumhuriyet Başsavcıvekilinin, sanığın veya katılanın istemi üzerine ya da resen incelemenin duruşma açılarak yapılmasına da karar verilebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>İncelemenin duruşma açılarak yapılmasına karar verilmesi hâlinde Yargıtay Cumhuriyet Başsavcısına veya Yargıtay Cumhuriyet Başsavcıvekiline, sanığa, katılana, müdafi ve vekile duruşma günü tebliğ edilir. Sanık, duruşmada hazır bulunabileceği gibi, kendisini bir müdafi ile de temsil ettirebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Duruşmada Yargıtay Cumhuriyet Başsavcısı veya Yargıtay Cumhuriyet Başsavcıvekili, hazır bulunması hâlinde sanık, müdafi, katılan ve vekili iddia ve savunmalarını açıklar; yeniden inceleme başvurusunda bulunan tarafa önce söz verilir. Her hâlde son söz sanığındır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Yeniden inceleme, yalnızca başvuruda belirtilen hususlarla sınırlı olarak yapılır. Başvurunun yerinde görülmesi hâlinde aynı zamanda başvuru konusu hakkında da karar verilir. Yeniden inceleme başvurusu üzerine verilen kararlar kesindir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="8-SEKİZİNCİ" başlık="Yargılamaya İlişkin Diğer Hususlar">
      <mvz-madde no="59" başlık="Dava ve işlere katılmaya engel durumlar">
        <mvz-fıkra no="1">
          <template>Başkan ve üyeler;</template>
          <mvz-bent no="a">
            <template>Kendilerine ait olan veya kendilerini ilgilendiren dava ve işlere,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Aralarında evlilik bağı kalkmış olsa bile eşinin, kan veya akrabalık yönünden üstsoy ve altsoyunun, dördüncü dereceye kadar  kan yönünden ve akrabalığı doğuran evlilik bağı kalkmış olsa bile üçüncü dereceye kadar  akrabalık yönünden civar hısımlarının veya aralarında evlatlık bağı bulunan kimselerin dava ve işlerine,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Dava ve iş sahiplerinin vekili, vasisi veya kayyımı sıfatıyla hareket ettiği dava ve işlere,</template>
          </mvz-bent>
          <mvz-bent no="ç">
            <template>Hâkim, savcı, hakem sıfatıyla bakmış veya tanık ya da bilirkişi olarak beyanda bulunmuş olduğu dava ve işlere,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>İstişarî görüş ve düşüncesini ifade etmiş olduğu dava ve işlere,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>bakamazlar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="60" başlık="Başkan ve üyelerin reddi">
        <mvz-fıkra no="1">
          <template>Başkan ve üyeler tarafsız hareket edemeyecekleri kanısını haklı kılan hâllerin olduğu iddiası ile reddolunabilirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu takdirde, Genel Kurul ya da bölümlerde ilgili üye katılmaksızın ret konusu hakkında kesin karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ret şahsidir. Genel Kurul ya da bölümlerin toplanmasına mani olacak sayıda üyenin reddine ilişkin talepler dinlenmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Ret dilekçesinde, ret sebeplerinin açıkça gösterilmesi ve delillerin birlikte bildirilmesi gereklidir. Bu şartları taşımayan dilekçeler reddolunur. Yemin delil teşkil etmez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Ret talebinin kötü niyetle yapıldığının anlaşılması ve esas yönünden kabul edilmemesi hâlinde, talepte bulunanların her birine Mahkemece beşyüz Türk Lirasından beşbin Türk Lirasına kadar disiplin para cezası verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Bu Kanun anlamında disiplin para cezasından maksat, bireysel başvuru hakkını veya ret talebini açıkça kötüye kullandığı tespit edilen başvurucular aleyhine verilen, verildiği anda kesin olan ve derhâl infazı gereken para cezasıdır. Bu ceza, seçenek yaptırımlara çevrilemez ve adli sicil kayıtlarında yer almaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Disiplin para cezası, 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre tahsil edilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="61" başlık="Çekinme">
        <mvz-fıkra no="1">
          <template>Başkan ve üyelerin 59 uncu ve 60 ıncı maddelerde yazılı sebeplere dayanarak davaya veya işe bakmaktan çekinmeleri hâlinde, Genel Kurul çekinme talebinde bulunan Başkan veya üyenin de iştirakiyle konu hakkında kesin kararını verir. Ancak, çekinme talebinde bulunan üye oylamaya katılamaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="62" başlık="Bilgi ve belge verme yükümlülüğü ile Devlet sırrı niteliğindeki bilgiler">
        <mvz-fıkra no="1">
          <template>Mahkeme, kendisine verilen görevlerin yerine getirilmesi sırasında yasama, yürütme, yargı organları, kamu idareleri, kamu görevlileri, bankalar ile diğer gerçek ve tüzel kişilerle doğrudan yazışmaya, bilgi ve belge istemeye, gerekli gördüğü her türlü belge, kayıt ve işlemi incelemeye, bilgi almak üzere her derece ve sınıftan kamu görevlileri ile ilgilileri çağırmaya, idare ve diğer tüzel kişilerden temsilci istemeye yetkilidir. Mahkemenin bu taleplerini belirtilen süre içinde yerine getirmeyenler hakkında genel hükümlere göre doğrudan soruşturma yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Mahkemenin bakmakla görevli olduğu dava ve işlerle ilgili bilgiler, Devlet sırrı olduğu gerekçesiyle Mahkemeye karşı gizli tutulamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Tanıklık konusu bilgilerin Devlet sırrı niteliğini taşıması hâlinde tanık, Mahkeme tarafından stenograf ve zabıt kâtibi dahi olmaksızın dinlenir. Başkan daha sonra bu tanık açıklamalarından sadece bakılmakta olan davanın esasına etkili olan hususları tutanağa geçirir. Açıklanması, Devletin dış ilişkilerine, millî savunmasına ve millî güvenliğine zarar verebilecek, anayasal düzen ve dış ilişkilerde tehlike yaratabilecek nitelikteki bilgiler Devlet sırrı sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu hükümler sözlü açıklamasına başvurulanlar ile bilirkişilere de uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="63" başlık="Araç, gereç ve personelden yararlanma">
        <mvz-fıkra no="1">
          <template>Başkan, Yüce Divan, siyasi parti kapatma davaları ve sözlü açıklamalarda duruşmanın gerekli kıldığı durumlarda, Devlet kurum ve kuruluşlarına ait araç, gereç, stenograf ve teknik personelden yararlanmak için istemde bulunabilir. Bu istemler, ilgili makamlarca derhâl yerine getirilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="64" başlık="Harç istisnası">
        <mvz-fıkra no="1">
          <template>Mahkemeye yapılacak bireysel başvurular dışındaki başvurular, alınacak kararlar ve bunlarla ilgili yapılacak işlemler harca tabi değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="9-DOKUZUNCU" başlık="Kararlar">
      <mvz-madde no="65" başlık="Oylama şekli ve karar nisabı">
        <mvz-fıkra no="1">
          <template>Genel Kurul ve bölümler kararlarını katılanların salt çoğunluğuyla alır. Oyların eşitliği hâlinde başkanın bulunduğu tarafın görüşü doğrultusunda karar verilmiş olur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Anayasa değişikliklerinde iptale, siyasi partilerin kapatılmasına ya da Devlet yardımından yoksun bırakılmasına karar verilebilmesi için toplantıya katılan üyelerin üçte iki oy çokluğu aranır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Oylamaya en kıdemsiz üyeden başlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="66" başlık="Mahkeme kararları">
        <mvz-fıkra no="1">
          <template>Mahkeme kararları kesindir. Mahkeme kararları Devletin yasama, yürütme ve yargı organlarını, idare makamlarını, gerçek ve tüzel kişileri bağlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İptal kararları geriye yürümez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkemece iptaline karar verilen kanun, Cumhurbaşkanlığı kararnamesi veya Türkiye Büyük Millet Meclisi İçtüzüğü veya bunların belirli madde veya hükümleri, iptal kararının Resmî Gazetede yayımlandığı tarihte yürürlükten kalkar. Mahkeme gerekli gördüğü hâllerde, Resmî Gazetede yayımlandığı günden başlayarak iptal kararının yürürlüğe gireceği tarihi bir yılı geçmemek üzere ayrıca kararlaştırabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mahkeme, bir kanun, Cumhurbaşkanlığı kararnamesi veya Türkiye Büyük Millet Meclisi İçtüzüğünün tamamını veya bir hükmünü iptal ederken, kanun koyucu gibi hareketle, yeni bir uygulamaya yol açacak biçimde hüküm tesis edemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Mahkeme kararları gerekçeli olarak yazılır. İptal kararları gerekçesi yazılmadan açıklanamaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Karar taslaklarının hazırlanması ve görüşülmesine ilişkin esaslar İçtüzükte gösterilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Kararlar, inceleme veya yargılamaya katılan başkan ve üyeler tarafından imzalanır. Muhalif kalanlar, kararda muhalefet nedenlerini İçtüzükte belirtilecek süre içinde yazılı olarak teslim ederler. Kararlar ilgililere bu şekliyle tebliğ olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>İptal ve itiraz başvuruları sonucu verilen gerekçeli kararlar Resmî Gazetede hemen yayımlanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="67" başlık="Yargılamanın yenilenmesi">
        <mvz-fıkra no="1">
          <template>Mahkemenin siyasi parti kapatma davalarında veya Yüce Divan sıfatıyla verdiği kararlara karşı yargılamanın yenilenmesi 5271 sayılı Kanun hükümlerine göre istenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Avrupa İnsan Hakları Mahkemesinin, Anayasa Mahkemesinin siyasi parti kapatma veya Yüce Divan sıfatıyla verdiği bir kararının Avrupa İnsan Hakları Sözleşmesi ve eki protokollerin ihlali suretiyle verildiğine hükmetmesi hâlinde, Avrupa İnsan Hakları Mahkemesi kararının kesinleştiği tarihten itibaren bir yıl içinde Anayasa Mahkemesinden yargılamanın yenilenmesi talebinde bulunulabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Mahkeme, yargılamanın yenilenmesi istemini esaslı ve kabule değer bulursa, yargılamanın yenilenmesine karar verir. İstem genel hükümlere göre sonuçlandırılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
  </mvz-kısım>
  <mvz-kısım no="5-BEŞİNCİ" başlık="Mali Hükümler, Personel ve Özlük İşleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Mali, Sosyal ve Diğer Haklar">
      <mvz-madde no="68" başlık="Mali haklar">
        <mvz-fıkra no="1">
          <template>Anayasa Mahkemesi Başkanı, başkanvekilleri, üyeleri, Anayasa Mahkemesi raportörleri, raportör yardımcıları ve raportör yardımcısı adaylarının aylık ve ödenekleriyle diğer mali, sosyal hak ve yardımları bu Kanun hükümlerine tabidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="69" başlık="Aylık tablosu">

            <template>Sekizinci derecede bulunan raportör yardımcılarına % 44’ü,</template>
          </mvz-bent>

            <template>Raportör yardımcısı adaylarına % 37’si,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>oranında aylık ödeme yapılır. Bu madde kapsamındaki ödeme unsurları arasında yer alan ikramiyenin hesabında, kıstas aylık içindeki ikramiyenin bir mali yıldaki toplam tutarının onikide biri dikkate alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Dereceleri yükselen Anayasa Mahkemesi raportörleri ve raportör yardımcıları yeni derecelerine ilişkin aylığa, söz konusu yükselmelerinin geçerlilik tarihlerini takip eden ayın onbeşinden itibaren hak kazanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci sınıf raportörlerin almakta oldukları aylık oranlarına, ödemeye esas olacak olan oran % 83’ü geçmemek üzere, birinci sınıfa ayrılma niteliklerini kaybetmemeleri koşuluyla her üç yılda bir, iki puan ilave edilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Kıstas aylığı oluşturan ödeme unsurlarından vergiye tabi olmayanlar, bu maddeye göre yapılacak ödemelerde de aynı şekilde vergiye tabi olmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Birinci fıkrada unvanları belirtilenlerden Anayasa Mahkemesi Başkanı, başkanvekilleri, üyeleri ile raportörlere aynı maddeye göre ödenmekte olan brüt aylıklarının % 10’u oranında yargı ödeneği verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Yükseköğretim kurumlarından veya Sayıştaydan gelen raportörlere, aynı derece, kademe ve kıdemdeki hâkim ve savcı raportörlere ödenen aylık ve ödenekler esas alınarak ödeme yapılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu maddeye göre ödeme yapılanlara; 27/6/1989 tarihli ve 375 sayılı Kanun Hükmünde Kararname kapsamında yapılan ödemeler  ile temsil, makam ve yüksek hâkimlik tazminatları ödenmez ve 657 sayılı Kanunun 152 nci maddesi uyarınca ödeme yapılmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Anayasa Mahkemesi Başkan ve üyelerinin ek göstergeleri sırasıyla (9.000) ve (8.000), yüksek hâkimlik tazminat göstergeleri ise (17.000)’dir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="9">
          <template>Başkan, başkanvekilleri ve üyelere (40.000) gösterge rakamının memur aylıklarına uygulanan katsayı ile çarpımı sonucu bulunacak tutarda, raportörlere ise (10.000) gösterge rakamının memur aylıklarına uygulanan katsayı ile çarpımı sonucu bulunacak tutarda aylık ek ödenek verilir. Bu ödeneğe hak kazanılmasında ve ödenmesinde 2802 sayılı Kanunun aylıklara ilişkin hükmü uygulanır ve bu ödenek, damga vergisi hariç, herhangi bir vergi ve kesintiye tabi tutulmaz.</template>
        </mvz-fıkra>
        <mvz-fıkra no="10">
          <template>Bu maddeye göre ödeme yapılanların aylıklarının ödenme zamanı, hangi hâllerde geri alınacağı, sosyal hak ve yardımları ile yardımcılıktan ve açıktan atanmada aylık ve ödeneğe hak kazanmada, bu Kanunda hüküm bulunmayan hâllerde, ilgisine göre 2802 sayılı Kanun ile 657 sayılı Kanun hükümleri uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="11">
          <template>Mahkemede görevli 657 sayılı Kanuna tabi personele her ay, (5.000) gösterge rakamının memur aylıklarına uygulanan aylık katsayısı ile çarpımı sonucunda bulunan aylık tutarda ek ödeme yapılır. Ek ödeme tutarı, damga vergisi hariç, herhangi bir vergi ve kesintiye tabi tutulamaz. Ek ödeme, her ne şekilde olursa olsun başka bir ödemenin hesaplanmasında dikkate alınmaz.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="70" başlık="İzin">
        <mvz-fıkra no="1">
          <template>Başkan ve üyelerin, Yüce Divan sıfatıyla bakılan veya Anayasaya göre süreye tabi olan işlerin engellenmemesi kaydıyla kırk günlük yıllık izin hakları vardır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hastalık ve mazeret izinleri genel hükümlere tabidir. Yıllık ve mazeret izinleri Başkan tarafından verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="71" başlık="Sağlık işleri ve tedavi">
        <mvz-fıkra no="1">
          <template>Başkan ve üyeler ile bunların emeklileri ve bakmakla yükümlü oldukları aile fertlerinin sağlık giderleri, Türkiye Büyük Millet Meclisi üyelerinin tabi olduğu hükümler ve esaslar çerçevesinde Mahkeme bütçesinden ödenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="72" başlık="Kuruluş günü ve onur belgesi verilmesi">
        <mvz-fıkra no="1">
          <template>Her yılın nisan ayının 25 inci günü Mahkemenin kuruluş günüdür. Kuruluş günü törenlerle kutlanır; seminer, konferans ve benzeri etkinlikler tertiplenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Emekliye ayrılmış olan başkanlar, başkanvekilleri ve üyelere onur belgeleri ve geçmiş hizmetlerinin anısını simgeleyen birer armağan verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu amaçla yapılacak tören ve armağanların giderini karşılamak üzere her yıl Mahkeme bütçesine yeterli ödenek konulur. Bu amaçla yapılacak harcamalar 4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanununa tabi değildir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="73" başlık="Yabancı ülkelere gönderilme">
        <mvz-fıkra no="1">
          <template>Raportörler ve raportör yardımcıları bilgi ve görgülerini artırma, lisansüstü eğitim, bilimsel araştırma ya da karşılıklı iş birliği çerçevesinde yabancı ülke mahkemeleri, üniversiteler veya uluslararası kuruluşlarda çalışmak veya öğrenim görmek üzere Başkanlıkça iki yıla kadar yurt dışında görevlendirilebilirler. Başkanlıkça gerekli görüldüğü takdirde bu süreler bir katına kadar uzatılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu kapsamda yurt dışında görevlendirilenlerin; mali hakları, yükümlülükleri, mecburî hizmetleri, giderlerinin karşılanması, aylık ve ödeneklerinin transferi konularında Devlet memurlarına ilişkin hükümler uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanun hükümlerine göre yabancı ülkelere gönderilenlerin derece yükselmeleri, kademe ilerlemeleri, emeklilik, aylık, ödenek ve diğer bütün özlük hakları ile yükümlülükleri devam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="73/A" başlık="Mahkemede staj">
        <mvz-fıkra no="1">
          <template>Hâkim ve savcı yardımcıları ile avukat stajyerleri, Mahkemede staj yapabilir. Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="74" başlık="Kadrolar">
        <mvz-fıkra no="1">
          <template>Mahkemeye ait kadroların tespiti, ihdası, kullanımı ve iptali ile kadrolara ilişkin diğer hususlar 13/12/1983 tarihli ve 190 sayılı Kanun Hükmünde Kararname hükümlerine göre düzenlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="EK">
        <mvz-fıkra no="1">
          <template>Anayasa Mahkemesi üye, raportör ve iç denetçi kadroları bu Kanuna ekli (I) sayılı Kadro Cetvelinde düzenlenmiştir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="Geçiş hükümleri" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Anayasa Mahkemesi Başkanlığında; Genel Sekreter Yardımcısı, Yazı İşleri Müdürü, Basın ve Halkla İlişkiler Müdürü, Kararlar Müdürü, Özel Kalem Müdürü, Arşiv Müdürü, Mali İşler Müdürü, Bilgi İşlem Müdürü, İkmal Müdürü, Personel ve Eğitim Müdürü, Yayın İşleri Müdürü, Kütüphane Müdürü, İdarî İşler Müdürü, Müdür, Ayniyat Saymanı ve Sivil Savunma Uzmanı kadro unvanlı görevlerde bulunanların görevleri, bu Kanunun yayımı tarihinde sona erer. Bunlar en geç altı ay içinde Mahkemede ya da Adalet Bakanlığı teşkilatında derece ve kademelerine uygun kadrolara atanırlar. Atama işlemi yapılıncaya kadar Başkanlıkça durumlarına uygun işlerde görevlendirilebilirler. Bunlar, yeni bir kadroya atanıncaya kadar, eski kadrolarına ait aylık, ek gösterge ve her türlü zam ve tazminatlar ile diğer mali haklarını almaya devam ederler. Söz konusu personelin, atandıkları yeni kadroların aylık, ek gösterge, her türlü zam ve tazminatları ile diğer mali haklar toplamı, eski kadrolarına ait aylık, ek gösterge ve her türlü zam ve tazminatlar ile diğer mali hakları net tutarından az olması hâlinde, aradaki fark, farklılık giderilinceye kadar, atandıkları kadrolarda kaldıkları sürece herhangi bir kesintiye tabi tutulmaksızın tazminat olarak ödenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu Kanunun yayımı tarihinde Başkanlığa ait kadrolarda bulunanlardan, birinci fıkrada sayılanlar hariç kadro ve görev unvanı değişmeyenler Başkanlığa ait aynı unvanlı kadrolara atanmış sayılırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanuna göre yeniden düzenleme ve atamalar yapılıncaya kadar Mahkemenin değişen veya yeniden kurulan birimlerine verilen görevler daha önce bu görevleri yapmakta olan birimler tarafından yapılmaya devam edilir. Başkanlık, teşkilatını ve kadrolarını en geç altı ay içinde bu Kanuna uygun hâle getirir. Bu çerçevede kadro değişiklikleri 190 sayılı Kanun Hükmünde Kararnamenin 9 uncu maddesinin son fıkrası hükmü uygulanmaksızın anılan Kanun Hükmünde Kararnamenin hükümlerine göre yürütülür.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Bu Kanunun yürürlüğe girdiği tarihte görevde bulunan Başkan ve Başkanvekili, seçildikleri tarihte geçerli olan süreyi tamamlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bu Kanunda öngörülen İçtüzük ve yönetmelik Başkanlıkça en geç altı ay içerisinde hazırlanarak yürürlüğe konulur. İçtüzük ve yönetmelik yürürlüğe girinceye kadar, mevcut İçtüzük ve yönetmeliğin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Mevzuatta 10/11/1983 tarihli ve 2949 sayılı Anayasa Mahkemesinin Kuruluşu ve Yargılama Usulleri Hakkında Kanuna yapılmış olan atıflar, bu Kanuna aykırı hükümleri hariç, bu Kanuna yapılmış sayılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Bu Kanunun yürürlüğe girdiği tarihten önce gerçekleştirilen tedavi giderleri hakkında bu Kanunla yürürlükten kaldırılan 2949 sayılı Kanunun 14 üncü maddesi hükümleri esas alınır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Mahkeme, 23/9/2012 tarihinden sonra kesinleşen nihai işlem ve kararlar aleyhine yapılacak bireysel başvuruları inceler.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>9/7/2018 tarihinden önce görev yapmış Bakanlar Kurulu üyeleri, görevleriyle ilgili suçlardan dolayı Yüce Divanda yargılanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Kaldırılan Askerî Yargıtay ve Askerî Yüksek İdare Mahkemesi başkan ve üyeleri, başsavcıları ile Jandarma Genel Komutanı, 27/4/2017 tarihinden önce görevleriyle ilgili işledikleri suçlardan dolayı Yüce Divanda yargılanırlar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kaldırılan Askerî Yargıtay ve Askerî Yüksek İdare Mahkemesinden Anayasa Mahkemesi üyeliğine seçilmiş üyelerin herhangi bir sebeple görevleri sona erene kadar üyelikleri devam eder.   Bu üyelerin, ordu mensubu olmaktan doğan emeklilikle ilgili bütün hakları saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Mahkemenin kanun hükmünde kararnamelere ilişkin görev ve yetkileri devam eder.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="75" başlık="Değiştirilen ve yürürlükten kaldırılan hükümler">
        <mvz-fıkra no="1">
          <template>10/11/1983 tarihli ve 2949 sayılı Anayasa Mahkemesinin Kuruluşu ve Yargılama Usulleri Hakkında Kanun yürürlükten kaldırılmıştır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="işlenmiş">

        <mvz-fıkra no="3" durum="işlenmiş">

        </mvz-fıkra>
        <mvz-fıkra no="4" durum="işlenmiş">
          <template>(23/1/1987 tarihli ve 270 sayılı Yüksek Hâkimlik Tazminatı Hakkında Kanun Hükmünde Kararname ile ilgili olup yerine işlenmiştir.)</template>
        </mvz-fıkra>
        <mvz-fıkra no="5" durum="işlenmiş">
          <template>(14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanunu ile ilgili olup yerine işlenmiştir.)</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnamenin eki (I) sayılı cetvelin Anayasa Mahkemesi Başkanlığı bölümünde yer alan kadrolar iptal edilerek ilgili cetvelden çıkarılmıştır. Bu Kanuna ekli (l) sayılı listede yer alan kadrolar ihdas edilerek 190 sayılı Kanun Hükmünde Kararnamenin eki (II) sayılı cetvelin, (2) sayılı listede yer alan kadrolar ihdas edilerek (I) sayılı cetvelin Anayasa Mahkemesi Başkanlığı bölümüne eklenmiş, (5) sayılı listede yer alan kadrolar iptal edilerek 190 sayılı Kanun Hükmünde Kararnamenin eki (II) sayılı cetvelin Anayasa Mahkemesi Başkanlığı bölümünden çıkarılmıştır. Ekli (3) sayılı listede yer alan kadrolar ihdas edilerek 190 sayılı Kanun Hükmünde Kararnamenin eki (II) sayılı cetvelin Adalet Bakanlığı, (4) sayılı listede yer alan kadrolar ihdas edilerek (II) sayılı cetvelin Sayıştay Başkanlığı bölümüne eklenmiştir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7" durum="işlenmiş">

        <mvz-fıkra no="8" durum="işlenmiş">

        </mvz-fıkra>
