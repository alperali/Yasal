          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="159" başlık="Daha az cezayı gerektiren hal">
          <mvz-fıkra no="1">
            <template>Dolandırıcılığın, bir hukuki ilişkiye dayanan alacağı tahsil amacıyla işlenmesi halinde, şikayet üzerine, altı aydan bir yıla kadar hapis veya adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="160" başlık="Kaybolmuş veya hata sonucu ele geçmiş eşya üzerinde tasarruf">
          <mvz-fıkra no="1">
            <template>Kaybedilmiş olması nedeniyle malikinin zilyedliğinden çıkmış olan ya da hata sonucu ele geçirilen eşya üzerinde, iade etmeksizin veya yetkili mercileri durumdan haberdar etmeksizin, malik gibi tasarrufta bulunan kişi, şikayet üzerine, bir yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="161" başlık="Hileli iflâs">
          <mvz-fıkra no="1">
            <template>Malvarlığını eksiltmeye yönelik hileli tasarruflarda bulunan kişi, bu hileli tasarruflardan önce veya sonra iflasa karar verilmiş olması halinde, üç yıldan sekiz yıla kadar hapis cezası ile cezalandırılır. Hileli iflasın varlığı için;</template>
            <mvz-bent no="a">
              <template>Alacaklıların alacaklarının teminatı mahiyetinde olan malların kaçırılması, gizlenmesi veya değerinin azalmasına neden olunması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Malvarlığını kaçırmaya yönelik tasarruflarının ortaya çıkmasını önlemek için ticari defter, kayıt veya belgelerin gizlenmesi veya yok edilmesi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Gerçekte bir alacak ve borç ilişkisi olmadığı halde, sanki böyle bir ilişki mevcutmuş gibi, borçların artmasına neden olacak şekilde belge düzenlenmesi,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Gerçeğe aykırı muhasebe kayıtlarıyla veya sahte bilanço tanzimiyle aktifin olduğundan az gösterilmesi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>gerekir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="162" başlık="Taksirli iflas">
          <mvz-fıkra no="1">
            <template>Tacir olmanın gerekli kıldığı dikkat ve özenin gösterilmemesi dolayısıyla iflasa sebebiyet veren kişi, iflasa karar verilmiş olması halinde, iki aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="163" başlık="Karşılıksız yararlanma">
          <mvz-fıkra no="1">
            <template>Otomatlar aracılığı ile sunulan ve bedeli ödendiği takdirde yararlanılabilen bir hizmetten ödeme yapmadan yararlanan kişi, iki aydan altı aya kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Telefon hatları ile frekanslarından veya elektromanyetik dalgalarla yapılan şifreli veya şifresiz yayınlardan sahibinin veya zilyedinin rızası olmadan yararlanan kişi, altı aydan iki yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Abonelik esasına göre yararlanılabilen elektrik enerjisinin, suyun veya doğal gazın sahibinin rızası olmaksızın ve tüketim miktarının belirlenmesini engelleyecek şekilde tüketilmesi halinde kişi hakkında bir yıldan üç yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="164" başlık="Şirket veya kooperatifler hakkında yanlış bilgi">
          <mvz-fıkra no="1">
            <template>Bir şirket veya kooperatifin kurucu, ortak, idareci, müdür veya temsilcileri veya yönetim veya denetim kurulu üyeleri veya tasfiye memuru sıfatını taşıyanlar, kamuya yaptıkları beyanlarda veya genel kurula sundukları raporlarda veya önerilerde ilgililerin zarara uğramasına neden olabilecek nitelikte gerçeğe aykırı önemli bilgiler verecek veya verdirtecek olurlarsa altı aydan üç yıla kadar hapis veya bin güne kadar adlî para cezası ile cezalandırılırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="165" başlık="Suç eşyasının satın alınması veya kabul edilmesi">
          <mvz-fıkra no="1">
            <template>Bir suçun işlenmesiyle elde edilen eşyayı veya diğer malvarlığı değerini, bu suçun işlenmesine iştirak etmeksizin, satan, devreden, satın alan veya kabul eden kişi, altı aydan üç yıla kadar hapis ve onbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="166" başlık="Bilgi vermeme">
          <mvz-fıkra no="1">
            <template>Bir hukuki ilişkiye dayalı olarak elde ettiği eşyanın, esasında suç işlemek suretiyle veya suç işlemek dolayısıyla elde edildiğini öğrenmesine rağmen, suçu takibe yetkili makamlara vakit geçirmeksizin bildirimde bulunmayan kişi, altı aya kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="167" başlık="Şahsi cezasızlık sebebi veya cezada indirim yapılmasını gerektiren şahsi sebep">
          <mvz-fıkra no="1">
            <template>Yağma ve nitelikli yağma hariç, bu bölümde yer alan suçların;</template>
            <mvz-bent no="a">
              <template>Haklarında ayrılık kararı verilmemiş eşlerden birinin,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Üstsoy veya altsoyunun veya bu derecede kayın hısımlarından birinin veya evlat edinen veya evlatlığın,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Aynı konutta beraber yaşayan kardeşlerden birinin,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Zararına olarak işlenmesi halinde, ilgili akraba hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçların, haklarında ayrılık kararı verilmiş olan eşlerden birinin, aynı konutta beraber yaşamayan kardeşlerden birinin, aynı konutta beraber yaşamakta olan amca, dayı, hala, teyze, yeğen veya ikinci derecede kayın hısımlarının zararına olarak işlenmesi halinde; ilgili akraba hakkında şikayet üzerine verilecek ceza, yarısı oranında indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="168" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>Hırsızlık, mala zarar verme, güveni kötüye kullanma, dolandırıcılık, hileli iflâs, taksirli iflâs  suçları tamamlandıktan sonra ve fakat bu nedenle hakkında kovuşturma başlamadan önce, failin, azmettirenin veya yardım edenin bizzat pişmanlık göstererek mağdurun uğradığı zararı aynen geri verme veya tazmin suretiyle tamamen gidermesi halinde, verilecek cezanın üçte ikisine kadarı indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Etkin pişmanlığın kovuşturma başladıktan sonra ve fakat hüküm verilmezden önce gösterilmesi halinde, verilecek cezanın yarısına kadarı indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yağma suçundan dolayı etkin pişmanlık gösteren kişiye verilecek cezanın, birinci fıkraya giren hallerde yarısına, ikinci fıkraya giren hallerde üçte birine kadarı indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kısmen geri verme veya tazmin halinde etkin pişmanlık hükümlerinin uygulanabilmesi için, ayrıca mağdurun rızası aranır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Karşılıksız yararlanma suçunda, fail, azmettiren veya yardım edenin pişmanlık göstererek mağdurun, kamunun veya özel hukuk tüzel kişisinin uğradığı zararı, soruşturma tamamlanmadan önce tamamen tazmin etmesi halinde kamu davası açılmaz; zararın hüküm verilinceye kadar tamamen tazmin edilmesi halinde ise, verilecek ceza üçte birine kadar indirilir. Ancak kişi, bu fıkra hükmünden iki defadan fazla yararlanamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="169" başlık="Tüzel kişiler hakkında güvenlik tedbiri uygulanması">
          <mvz-fıkra no="1">
            <template>Hırsızlık, güveni kötüye kullanma ve dolandırıcılık suçlarının işlenmesi suretiyle yararına haksız menfaat sağlanan tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Topluma Karşı Suçlar">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Tehlike Yaratan Suçlar">
        <mvz-madde no="170" başlık="Genel güvenliğin kasten tehlikeye sokulması">
          <mvz-fıkra no="1">
            <template>Kişilerin hayatı, sağlığı veya malvarlığı bakımından tehlikeli olacak biçimde ya da kişilerde korku, kaygı veya panik yaratabilecek tarzda;</template>
            <mvz-bent no="a">
              <template>Yangın çıkaran,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bina çökmesine, toprak kaymasına, çığ düşmesine, sel veya taşkına neden olan,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Silahla ateş eden veya patlayıcı madde kullanan,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>kişi, bir yıldan beş yıla kadar hapis cezası ile cezalandırılır. Suçun ses ve gaz fişeği atabilen silahla ateş etmek suretiyle işlenmesi halinde kişi, altı aydan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada tanımlanan suçun kişilerin toplu olarak bulundukları yerlerde işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yangın, bina çökmesi, toprak kayması, çığ düşmesi, sel veya taşkın tehlikesine neden olan kişi, üç aydan bir yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="171" başlık="Genel güvenliğin taksirle tehlikeye sokulması">
          <mvz-fıkra no="1">
            <template>Taksirle;</template>
            <mvz-bent no="a">
              <template>Yangına,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bina çökmesine, toprak kaymasına, çığ düşmesine, sel veya taşkına,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Neden olan kişi, fiilin başkalarının hayatı, sağlığı veya malvarlığı bakımından tehlikeli olması halinde, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="172" başlık="Radyasyon yayma">
          <mvz-fıkra no="1">
            <template>Bir başkasını, sağlığını bozmak amacıyla ve bu amacı gerçekleştirmeye elverişli olacak surette, radyasyona tabi tutan kişi, üç yıldan onbeş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkradaki fiilin belirsiz sayıda kişilere karşı işlenmiş olması halinde, beş yıldan az olmamak üzere hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bir başkasının hayatı, sağlığı veya malvarlığına önemli ölçüde zarar vermeye elverişli olacak biçimde radyasyon yayan veya atom çekirdeklerinin parçalanması sürecine etkide bulunan kişi, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Radyasyon yayılmasına veya atom çekirdeklerinin parçalanması sürecine, bir laboratuvar veya tesisin işletilmesi sırasında gerekli dikkat ve özen yükümlülüğüne aykırı olarak neden olan kişi, fiilin bir başkasının hayatı, sağlığı veya malvarlığına önemli ölçüde zarar vermeye elverişli olması halinde, altı aydan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="173" başlık="Atom enerjisi ile patlamaya sebebiyet verme">
          <mvz-fıkra no="1">
            <template>Atom enerjisini serbest bırakarak bir patlamaya ve bu suretle bir başkasının hayatı, sağlığı veya malvarlığı hakkında önemli ölçüde tehlikeye sebebiyet veren kişi, beş yıldan az olmamak üzere hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıdaki fıkrada tanımlanan fiilin taksirle işlenmesi halinde, iki yıldan beş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="174" başlık="Tehlikeli maddelerin izinsiz olarak bulundurulması veya el değiştirmesi">
          <mvz-fıkra no="1">
            <template>Yetkili makamlardan gerekli izni almaksızın, patlayıcı, yakıcı, aşındırıcı, yaralayıcı, boğucu, zehirleyici, sürekli hastalığa yol açıcı nükleer, radyoaktif, kimyasal, biyolojik maddeyi imal, ithal veya ihraç eden, ülke içinde bir yerden diğer bir yere nakleden, muhafaza eden, satan, satın alan veya işleyen kişi, dört yıldan sekiz yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır. Yetkili makamların izni olmaksızın, bu fıkra kapsamına giren maddeleri imal etmek, işlemek veya kullanmak amacıyla, gerekli olan malzeme ve teçhizatı ithal eden, ihraç eden, satışa arz eden, başkalarına veren, nakleden, depolayan, satın alan, kabul eden veya bulunduran kişi de aynı ceza ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu fiillerin suç işlemek için teşkil edilmiş bir örgütün faaliyeti çerçevesinde işlenmesi halinde, verilecek ceza bir kat artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Önemsiz tür ve miktarda patlayıcı maddeyi satın alan, kabul eden veya bulunduran kişi hakkında, kullanılış amacı gözetilerek, bir yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="175" başlık="Akıl hastası üzerindeki bakım ve gözetim yükümlülüğünün ihlali">
          <mvz-fıkra no="1">
            <template>Akıl hastası üzerindeki bakım ve gözetim yükümlülüğünü, başkalarının hayatı, sağlığı veya malvarlığı bakımından tehlikeli olabilecek şekilde ihmal eden kişi, altı aya kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="176" başlık="İnşaat veya yıkımla ilgili emniyet kurallarına uymama">
          <mvz-fıkra no="1">
            <template>İnşaat veya yıkım faaliyeti sırasında, insan hayatı veya beden bütünlüğü açısından gerekli olan tedbirleri almayan kişi, üç aydan bir yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="177" başlık="Hayvanın tehlike yaratabilecek şekilde serbest bırakılması">
          <mvz-fıkra no="1">
            <template>Gözetimi altında bulunan hayvanı başkalarının hayatı veya sağlığı bakımından tehlikeli olabilecek şekilde serbest bırakan veya bunların kontrol altına alınmasında ihmal gösteren kişi, altı aya kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="178" başlık="İşaret ve engel koymama">
          <mvz-fıkra no="1">
            <template>Herkesin gelip geçtiği yerlerde yapılmakta olan işlerden veya bırakılan eşyadan doğan tehlikeyi önlemek için gerekli işaret veya engelleri koymayan, konulmuş olan işaret veya engelleri kaldıran ya da bunların yerini değiştiren kişi, iki aydan altı aya kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="179" başlık="Trafik güvenliğini tehlikeye sokma">
          <mvz-fıkra no="1">
            <template>Kara, deniz, hava veya demiryolu ulaşımının güven içinde akışını sağlamak için konulmuş her türlü işareti değiştirerek, kullanılamaz hale getirerek, konuldukları yerden kaldırarak, yanlış işaretler vererek, geçiş, varış, kalkış veya iniş yolları üzerine bir şey koyarak ya da teknik işletim sistemine müdahale ederek, başkalarının hayatı, sağlığı veya malvarlığı bakımından bir tehlikeye neden olan kişiye bir yıldan altı yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kara, deniz, hava veya demiryolu ulaşım araçlarını kişilerin hayat, sağlık veya malvarlığı açısından tehlikeli olabilecek şekilde sevk ve idare eden kişi, dört aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Alkol veya uyuşturucu madde etkisiyle ya da başka bir nedenle emniyetli bir şekilde araç sevk ve idare edemeyecek halde olmasına rağmen araç kullanan kişi altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="180" başlık="Trafik güvenliğini taksirle tehlikeye sokma">
          <mvz-fıkra no="1">
            <template>Deniz, hava veya demiryolu ulaşımında, kişilerin hayatı, sağlığı veya malvarlığı bakımından bir tehlikeye taksirle neden olan kimseye üç aydan üç yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Çevreye Karşı Suçlar">
        <mvz-madde no="181" başlık="Çevrenin kasten kirletilmesi">
          <mvz-fıkra no="1">
            <template>İlgili kanunlarla belirlenen teknik usullere aykırı olarak ve çevreye zarar verecek şekilde, atık veya artıkları toprağa, suya veya havaya kasten veren kişi, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Atık veya artıkları izinsiz olarak ülkeye sokan kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Atık veya artıkların toprakta, suda veya havada kalıcı özellik göstermesi halinde, yukarıdaki fıkralara göre verilecek ceza iki katı kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bir ve ikinci fıkralarda tanımlanan fiillerin, insan veya hayvanlar açısından tedavisi zor hastalıkların ortaya çıkmasına, üreme yeteneğinin körelmesine, hayvanların veya bitkilerin doğal özelliklerini değiştirmeye neden olabilecek niteliklere sahip olan atık veya artıklarla ilgili olarak işlenmesi halinde, beş yıldan az olmamak üzere hapis cezasına ve bin güne kadar adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu maddenin iki, üç ve dördüncü fıkrasındaki fiillerden dolayı tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="182" başlık="Çevrenin taksirle kirletilmesi">
          <mvz-fıkra no="1">
            <template>Çevreye zarar verecek şekilde, atık veya artıkların toprağa, suya veya havaya verilmesine taksirle neden olan kişi, adlî para cezası ile cezalandırılır. Bu atık veya artıkların, toprakta, suda veya havada kalıcı etki bırakması halinde, iki aydan bir yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İnsan veya hayvanlar açısından tedavisi zor hastalıkların ortaya çıkmasına, üreme yeteneğinin körelmesine, hayvanların veya bitkilerin doğal özelliklerini değiştirmeye neden olabilecek niteliklere sahip olan atık veya artıkların toprağa, suya veya havaya taksirle verilmesine neden olan kişi, bir yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="183" başlık="Gürültüye neden olma">
          <mvz-fıkra no="1">
            <template>İlgili kanunlarla belirlenen yükümlülüklere aykırı olarak, başka bir kimsenin sağlığının zarar görmesine elverişli bir şekilde gürültüye neden olan kişi, iki aydan iki yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="184" başlık="İmar kirliliğine neden olma">
          <mvz-fıkra no="1">
            <template>Yapı ruhsatiyesi alınmadan veya ruhsata aykırı olarak bina yapan veya yaptıran kişi, bir yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yapı ruhsatiyesi olmadan başlatılan inşaatlar dolayısıyla kurulan şantiyelere elektrik, su veya telefon bağlantısı yapılmasına müsaade eden kişi, yukarıdaki fıkra hükmüne göre cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yapı kullanma izni alınmamış binalarda herhangi bir sınai faaliyetin icrasına müsaade eden kişi iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Üçüncü fıkra hariç, bu madde hükümleri ancak belediye sınırları içinde veya özel imar rejimine tabi yerlerde uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kişinin, ruhsatsız ya da ruhsata aykırı olarak yaptığı veya yaptırdığı binayı imar planına ve ruhsatına uygun hale getirmesi halinde, bir ve ikinci fıkra hükümleri gereğince kamu davası açılmaz, açılmış olan kamu davası düşer, mahkum olunan ceza bütün sonuçlarıyla ortadan kalkar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İkinci ve üçüncü fıkra hükümleri, 12 Ekim 2004 tarihinden önce yapılmış yapılarla ilgili olarak uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Kamunun Sağlığına Karşı Suçlar">
        <mvz-madde no="185" başlık="Zehirli madde katma">
          <mvz-fıkra no="1">
            <template>İçilecek sulara veya yenilecek veya içilecek veya kullanılacak veya tüketilecek her çeşit besin veya şeylere zehir katarak veya başka suretlerle bunları bozarak kişilerin hayatını ve sağlığını tehlikeye düşüren kimseye iki yıldan onbeş yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıdaki fıkrada belirtilen fiillerin dikkat ve özen yükümlülüğüne aykırı olarak işlenmesi halinde, üç aydan bir yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="186" başlık="Bozulmuş veya değiştirilmiş gıda veya ilaçların ticareti">
          <mvz-fıkra no="1">
            <template>Kişilerin hayatını ve sağlığını tehlikeye sokacak biçimde bozulmuş, değiştirilmiş her tür yenilecek veya içilecek şeyleri veya ilaçları satan, tedarik eden, bulunduran kimseye bir yıldan beş yıla kadar hapis ve binbeşyüz güne kadar adlî para cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun, resmi izne dayalı olarak yürütülen bir meslek ve sanatın icrası kapsamında işlenmesi halinde, verilecek ceza üçte bir oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="187" başlık="Kişilerin hayatını ve sağlığını tehlikeye sokacak biçimde ilaç yapma veya satma">
          <mvz-fıkra no="1">
            <template>Kişilerin hayatını ve sağlığını tehlikeye sokacak biçimde ilaç üreten veya satan kimseye bir yıldan beş yıla kadar hapis ve adlî para cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun tabip veya eczacı tarafından ya da resmi izne dayalı olarak yürütülen bir meslek ve sanatın icrası kapsamında işlenmesi halinde, verilecek ceza üçte bir oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="188" başlık="Uyuşturucu veya uyarıcı madde imal ve ticareti">
          <mvz-fıkra no="1">
            <template>Uyuşturucu veya uyarıcı maddeleri ruhsatsız veya ruhsata aykırı olarak imal, ithal veya ihraç eden kişi, yirmi yıldan otuz yıla kadar hapis ve ikibin günden yirmibin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Uyuşturucu veya uyarıcı madde ihracı fiilinin diğer ülke açısından ithal olarak nitelendirilmesi dolayısıyla bu ülkede yapılan yargılama sonucunda hükmolunan cezanın infaz edilen kısmı, Türkiye'de uyuşturucu veya uyarıcı madde ihracı dolayısıyla yapılacak yargılama sonucunda hükmolunan cezadan mahsup edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Uyuşturucu veya uyarıcı maddeleri ruhsatsız veya ruhsata aykırı olarak ülke içinde satan, satışa arz eden, başkalarına veren, sevk eden, nakleden, depolayan, satın alan, kabul eden, bulunduran kişi, on yıldan az olmamak üzere hapis ve bin günden yirmibin güne kadar adlî para cezası ile cezalandırılır.  Ancak, uyuşturucu veya uyarıcı madde verilen veya satılan kişinin çocuk olması hâlinde, veren veya satan kişiye verilecek hapis cezası on beş yıldan az olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template></template>
            <mvz-bent no="a">
              <template>Yukarıdaki fıkralarda belirtilen uyuşturucu veya uyarıcı maddelerin eroin, kokain, morfin, bazmorfin, sentetik kannabinoid ve türevleri, sentetik katinon ve türevleri, sentetik opioid ve türevleri veya amfetamin ve türevleri olması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Üçüncü fıkradaki fiillerin; okul, yurt, hastane, kışla veya ibadethane gibi tedavi, eğitim, askerî ve sosyal amaçla toplu bulunulan bina ve tesisler ile bunların varsa çevre duvarı, tel örgü veya benzeri engel veya işaretlerle belirlenen sınırlarına iki yüz metreden yakın mesafe içindeki umumi veya umuma açık yerlerde işlenmesi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>hâlinde verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yukarıdaki fıkralarda gösterilen suçların, üç veya daha fazla kişi tarafından birlikte işlenmesi hâlinde verilecek ceza yarı oranında, suç işlemek için teşkil edilmiş bir örgütün faaliyeti çerçevesinde işlenmesi hâlinde, verilecek ceza bir kat artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Üretimi resmi makamların iznine veya satışı yetkili tabip tarafından düzenlenen reçeteye bağlı olan ve uyuşturucu veya uyarıcı madde etkisi doğuran her türlü madde açısından da yukarıdaki fıkralar hükümleri uygulanır.  Ancak, verilecek ceza yarısına kadar indirilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Uyuşturucu veya uyarıcı etki doğurmamakla birlikte, uyuşturucu veya uyarıcı madde üretiminde kullanılan ve ithal veya imali resmi makamların iznine bağlı olan maddeyi ülkeye ithal eden, imal eden, satan, satın alan, sevk eden, nakleden, depolayan veya ihraç eden kişi, sekiz yıldan az olmamak üzere hapis ve bin günden yirmibin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Bu maddede tanımlanan suçların tabip, diş tabibi, eczacı, kimyager, veteriner, sağlık memuru, laborant, ebe, hemşire, diş teknisyeni, hastabakıcı, sağlık hizmeti veren, kimyacılıkla veya ecza ticareti ile iştigal eden kişi tarafından işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="189" başlık="Tüzel kişiler hakkında güvenlik tedbiri uygulanması">
          <mvz-fıkra no="1">
            <template>Uyuşturucu veya uyarıcı madde imal ve ticareti suçlarının bir tüzel kişinin faaliyeti çerçevesinde işlenmesi halinde, tüzel kişi hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="190" başlık="Uyuşturucu veya uyarıcı madde kullanılmasını kolaylaştırma">
          <mvz-fıkra no="1">
            <template>Uyuşturucu veya uyarıcı madde kullanılmasını kolaylaştırmak için;</template>
            <mvz-bent no="a">
              <template>Özel yer, donanım veya malzeme sağlayan,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kullananların yakalanmalarını zorlaştıracak önlemler alan,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kullanma yöntemleri konusunda başkalarına bilgi veren,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Kişi, beş yıldan on yıla kadar hapis ve bin günden onbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Uyuşturucu veya uyarıcı madde kullanılmasını alenen özendiren veya bu nitelikte yayın yapan kişi, beş yıldan on yıla kadar hapis ve bin günden onbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddede tanımlanan suçların tabip, diş tabibi, eczacı, kimyager, veteriner, sağlık memuru, laborant, ebe, hemşire, diş teknisyeni, hastabakıcı, sağlık hizmeti veren, kimyacılıkla veya ecza ticareti ile iştigal eden kişi tarafından işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="191" başlık="Kullanmak için uyuşturucu veya uyarıcı madde satın almak, kabul etmek veya bulundurmak ya da uyuşturucu veya uyarıcı madde kullanmak">
          <mvz-fıkra no="1">
            <template>Kullanmak için uyuşturucu veya uyarıcı madde satın alan, kabul eden veya bulunduran ya da uyuşturucu veya uyarıcı madde kullanan kişi, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçtan dolayı başlatılan soruşturmada şüpheli hakkında 4/12/2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun 171 inci maddesindeki şartlar aranmaksızın, beş yıl süreyle kamu davasının açılmasının ertelenmesine karar verilir. Cumhuriyet savcısı, bu durumda şüpheliyi, erteleme süresi zarfında kendisine yüklenen yükümlülüklere uygun davranmadığı veya yasakları ihlal ettiği takdirde kendisi bakımından ortaya çıkabilecek sonuçlar konusunda uyarır.  Erteleme kararı kolluk birimlerine de bildirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Erteleme süresi zarfında şüpheli hakkında asgari bir yıl süreyle denetimli serbestlik tedbiri uygulanır. Bu süre denetimli serbestlik müdürlüğünün teklifi üzerine veya resen Cumhuriyet savcısının kararı ile altışar aylık sürelerle en fazla iki yıl daha uzatılabilir. Hakkında denetimli serbestlik tedbiri verilen kişi, gerek görülmesi hâlinde denetimli serbestlik süresi içinde tedaviye tabi tutulabilir. Cumhuriyet savcısı, erteleme süresi zarfında uyuşturucu veya uyarıcı madde kullanıp kullanmadığını tespit etmek için yılda en az iki defa şüphelinin ilgili kuruma sevkine karar verir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kişinin, erteleme süresi zarfında;</template>
            <mvz-bent no="a">
              <template>Kendisine yüklenen yükümlülüklere veya uygulanan tedavinin gereklerine uygun davranmamakta ısrar etmesi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Tekrar kullanmak için uyuşturucu veya uyarıcı madde satın alması, kabul etmesi veya bulundurması,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Uyuşturucu veya uyarıcı madde kullanması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>hâlinde, hakkında kamu davası açılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Erteleme süresi zarfında kişinin kullanmak için tekrar uyuşturucu veya uyarıcı madde satın alması, kabul etmesi veya bulundurması ya da uyuşturucu veya uyarıcı madde kullanması, dördüncü fıkra uyarınca ihlal nedeni sayılır ve ayrı bir soruşturma ve kovuşturma konusu yapılmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Dördüncü fıkraya göre kamu davasının açılmasından sonra, birinci fıkrada tanımlanan suçun tekrar işlendiği iddiasıyla açılan soruşturmalarda ikinci fıkra uyarınca kamu davasının açılmasının ertelenmesi kararı verilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Şüpheli erteleme süresi zarfında dördüncü fıkrada belirtilen yükümlülüklere aykırı davranmadığı ve yasakları ihlal etmediği takdirde, hakkında kovuşturmaya yer olmadığı kararı verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Bu Kanunun;</template>
            <mvz-bent no="a">
              <template>188 inci maddesinde tanımlanan uyuşturucu veya uyarıcı madde imal ve ticareti,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>190 ıncı maddesinde tanımlanan uyuşturucu veya uyarıcı madde kullanılmasını kolaylaştırma,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>suçundan dolayı yapılan kovuşturma evresinde, suçun münhasıran bu madde kapsamına girdiğinin anlaşılması hâlinde, sanık hakkında bu madde hükümleri çerçevesinde hükmün açıklanmasının geri bırakılması kararı verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Bu maddede aksine düzenleme bulunmayan hâllerde, Ceza Muhakemesi Kanununun kamu davasının açılmasının ertelenmesine ilişkin 171 inci maddesi veya hükmün açıklanmasının geri bırakılmasına ilişkin 231 inci maddesi hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Birinci fıkradaki fiillerin; okul, yurt, hastane, kışla veya ibadethane gibi tedavi, eğitim, askerî ve sosyal amaçla toplu bulunulan bina ve tesisler ile bunların varsa çevre duvarı, tel örgü veya benzeri engel veya işaretlerle belirlenen sınırlarına iki yüz metreden yakın mesafe içindeki umumi veya umuma açık yerlerde işlenmesi hâlinde verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="192" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>Uyuşturucu veya uyarıcı madde imal ve ticareti suçlarına iştirak etmiş olan kişi, resmi makamlar tarafından haber alınmadan önce, diğer suç ortaklarını ve uyuşturucu veya uyarıcı maddelerin saklandığı veya imal edildiği yerleri merciine haber verirse, verilen bilginin suç ortaklarının yakalanmasını veya uyuşturucu veya uyarıcı maddenin ele geçirilmesini sağlaması halinde, hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kullanmak için uyuşturucu veya uyarıcı madde satın alan, kabul eden veya bulunduran kişi, resmi makamlar tarafından haber alınmadan önce, bu maddeyi kimden, nerede ve ne zaman temin ettiğini merciine haber vererek suçluların yakalanmalarını veya uyuşturucu veya uyarıcı maddenin ele geçirilmesini kolaylaştırırsa, hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçlar haber alındıktan sonra gönüllü olarak, suçun meydana çıkmasına ve fail veya diğer suç ortaklarının yakalanmasına hizmet ve yardım eden kişi hakkında verilecek ceza, yardımın niteliğine göre dörtte birden yarısına kadarı indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Uyuşturucu veya uyarıcı madde kullanan kişi, hakkında kullanmak için uyuşturucu veya uyarıcı madde satın almak, kabul etmek veya bulundurmaktan dolayı soruşturma başlatılmadan önce resmi makamlara veya sağlık kuruluşlarına başvurarak tedavi ettirilmesini isterse, cezaya hükmolunmaz.  Bu durumda kamu görevlileri ile sağlık mesleği mensuplarının 279 uncu ve 280 inci maddeler uyarınca suçu bildirme yükümlülüğü doğmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="193" başlık="Zehirli madde imal ve ticareti">
          <mvz-fıkra no="1">
            <template>İçeriğinde zehir bulunan ve üretilmesi, bulundurulması veya satılması izne bağlı olan maddeyi izinsiz olarak üreten, bulunduran, satan veya nakleden kişi, iki aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="194" başlık="Sağlık için tehlikeli madde temini">
          <mvz-fıkra no="1">
            <template>Sağlık için tehlike oluşturabilecek maddeleri çocuklara, akıl hastalarına veya uçucu madde kullananlara veren veya tüketimine sunan kişi, altı aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="195" başlık="Bulaşıcı hastalıklara ilişkin tedbirlere aykırı davranma">
          <mvz-fıkra no="1">
            <template>Bulaşıcı hastalıklardan birine yakalanmış veya bu hastalıklardan ölmüş kimsenin bulunduğu yerin karantina altına alınmasına dair yetkili makamlarca alınan tedbirlere uymayan kişi, iki aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="196" başlık="Usulsüz ölü gömülmesi">
          <mvz-fıkra no="1">
            <template>Ölü gömülmesine ayrılan yerlerden başka yerlere ölü gömen veya gömdüren kişi, altı aya kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Kamu Güvenine Karşı Suçlar">
        <mvz-madde no="197" başlık="Parada sahtecilik">
          <mvz-fıkra no="1">
            <template>Memlekette veya yabancı ülkelerde kanunen tedavülde bulunan parayı, sahte olarak üreten, ülkeye sokan, nakleden, muhafaza eden veya tedavüle koyan kişi, iki yıldan oniki yıla kadar hapis ve onbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sahte parayı bilerek kabul eden kişi, bir yıldan üç yıla kadar hapis ve adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sahteliğini bilmeden kabul ettiği parayı bu niteliğini bilerek tedavüle koyan kişi, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="198" başlık="Paraya eşit sayılan değerler">
          <mvz-fıkra no="1">
            <template>Devlet tarafından ihraç edilip de hamiline yazılı bonolar, hisse senetleri, tahviller ve kuponlar, yetkili kurumlar tarafından çıkarılmış olup da kanunen tedavül eden senetler, tahviller ve evrak ile milli ziynet altınları, para hükmündedir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="199" başlık="Kıymetli damgada sahtecilik">
          <mvz-fıkra no="1">
            <template>Kıymetli damgayı sahte olarak üreten, ülkeye sokan, nakleden, muhafaza eden veya tedavüle koyan kişi, bir yıldan beş yıla kadar hapis ve adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sahte olarak üretilmiş kıymetli damgayı bilerek kabul eden kişi, üç aydan bir yıla kadar hapis ve adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sahteliğini bilmeden kabul ettiği kıymetli damgayı bu niteliğini bilerek tedavüle koyan kişi, bir aydan altı aya kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Damgalı kağıtlar, damga ve posta pulları ve muayyen bir miktar vergi veya harcın ödendiğini belgelemek amacıyla kullanılan pullar, kıymetli damga sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="200" başlık="Para ve kıymetli damgaları yapmaya yarayan araçlar">
          <mvz-fıkra no="1">
            <template>Paralarla kıymetli damgaların üretiminde kullanılan alet veya malzemeyi izinsiz olarak üreten, ülkeye sokan, satan, devreden, satın alan, kabul eden veya muhafaza eden kişi, bir yıldan dört yıla kadar hapis ve adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="201" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>Sahte olarak para veya kıymetli damga üreten, ülkeye sokan, nakleden, muhafaza eden veya kabul eden kişi, bu para veya kıymetli damgaları tedavüle koymadan ve resmi makamlar tarafından haber alınmadan önce, diğer suç ortaklarını ve sahte olarak üretilen para veya kıymetli damgaların üretildiği veya saklandığı yerleri merciine haber verirse, verilen bilginin suç ortaklarının yakalanmasını ve sahte olarak üretilen para veya kıymetli damgaların ele geçirilmesini sağlaması halinde, hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sahte para veya kıymetli damga üretiminde kullanılan alet ve malzemeyi izinsiz olarak üreten, ülkeye sokan, satan, devreden, satın alan, kabul eden veya muhafaza eden kişi, resmi makamlar tarafından haber alınmadan önce, diğer suç ortaklarını ve bu malzemenin üretildiği veya saklandığı yerleri ilgili makama haber verirse, verilen bilginin suç ortaklarının yakalanmasını ve bu malzemenin ele geçirilmesini sağlaması halinde, hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="202" başlık="Mühürde sahtecilik">
          <mvz-fıkra no="1">
            <template>Cumhurbaşkanlığı, Türkiye Büyük Millet Meclisi Başkanlığı ve Başbakanlık tarafından kullanılan mührü sahte olarak üreten veya kullanan kişi, iki yıldan sekiz yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kamu kurum ve kuruluşlarınca veya kamu kurumu niteliğindeki meslek kuruluşlarınca kullanılan onaylayıcı veya belgeleyici mührü sahte olarak üreten veya kullanan kişi, bir yıldan altı yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="203" başlık="Mühür bozma">
          <mvz-fıkra no="1">
            <template>Kanun veya yetkili makamların emri uyarınca bir şeyin saklanmasını veya varlığının aynen korunmasını sağlamak için konulan mührü kaldıran veya konuluş amacına aykırı hareket eden kişi, altı aydan üç yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="204" başlık="Resmi belgede sahtecilik">
          <mvz-fıkra no="1">
            <template>Bir resmi belgeyi sahte olarak düzenleyen, gerçek bir resmi belgeyi başkalarını aldatacak şekilde değiştiren veya sahte resmi belgeyi kullanan kişi, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Görevi gereği düzenlemeye yetkili olduğu resmi bir belgeyi sahte olarak düzenleyen, gerçek bir belgeyi başkalarını aldatacak şekilde değiştiren, gerçeğe aykırı olarak belge düzenleyen veya sahte resmi belgeyi kullanan kamu görevlisi üç yıldan sekiz yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Resmi belgenin, kanun hükmü gereği sahteliği sabit oluncaya kadar geçerli olan belge niteliğinde olması halinde, verilecek ceza yarısı oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="205" başlık="Resmî belgeyi bozmak, yok etmek veya gizlemek">
          <mvz-fıkra no="1">
            <template>Gerçek bir resmi belgeyi bozan, yok eden veya gizleyen kişi, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır. Suçun kamu görevlisi tarafından işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="206" başlık="Resmi belgenin düzenlenmesinde yalan beyan">
          <mvz-fıkra no="1">
            <template>Bir resmi belgeyi düzenlemek yetkisine sahip olan kamu görevlisine yalan beyanda bulunan kişi, üç aydan iki yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="207" başlık="Özel belgede sahtecilik">
          <mvz-fıkra no="1">
            <template>Bir özel belgeyi sahte olarak düzenleyen veya gerçek bir özel belgeyi başkalarını aldatacak şekilde değiştiren ve kullanan kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir sahte özel belgeyi bu özelliğini bilerek kullanan kişi de yukarıdaki fıkra hükmüne göre cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="208" başlık="Özel belgeyi bozmak, yok etmek veya gizlemek">
          <mvz-fıkra no="1">
            <template>Gerçek bir özel belgeyi bozan, yok eden veya gizleyen kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="209" başlık="Açığa imzanın kötüye kullanılması">
          <mvz-fıkra no="1">
            <template>Belirli bir tarzda doldurulup kullanılmak üzere kendisine teslim olunan imzalı ve kısmen veya tamamen boş bir kağıdı, verilme nedeninden farklı bir şekilde dolduran kişi, şikayet üzerine, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İmzalı ve kısmen veya tamamen boş bir kağıdı hukuka aykırı olarak ele geçirip veya elde bulundurup da hukuki sonuç doğuracak şekilde dolduran kişi, belgede sahtecilik hükümlerine göre cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="210" başlık="Resmi belge hükmünde belgeler">
          <mvz-fıkra no="1">
            <template>Özel belgede sahtecilik suçunun konusunun, emre veya hamile yazılı kambiyo senedi, emtiayı temsil eden belge, hisse senedi, tahvil veya vasiyetname olması halinde, resmi belgede sahtecilik suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gerçeğe aykırı belge düzenleyen tabip, diş tabibi, eczacı, ebe, hemşire veya diğer sağlık mesleği mensubu, üç aydan bir yıla kadar hapis cezası ile cezalandırılır. Düzenlenen belgenin kişiye haksız bir menfaat sağlaması ya da kamunun veya kişilerin zararına bir sonuç doğurucu nitelik taşıması halinde, resmi belgede sahtecilik hükümlerine göre cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="211" başlık="Daha az cezayı gerektiren hal">
          <mvz-fıkra no="1">
            <template>Bir hukuki ilişkiye dayanan alacağın ispatı veya gerçek bir durumun belgelenmesi amacıyla belgede sahtecilik suçunun işlenmesi halinde, verilecek ceza, yarısı oranında indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="212" başlık="İçtima">
          <mvz-fıkra no="1">
            <template>Sahte resmi veya özel belgenin bir başka suçun işlenmesi sırasında kullanılması halinde, hem sahtecilik hem de ilgili suçtan dolayı ayrı ayrı cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="5-BEŞİNCİ" başlık="Kamu Barışına Karşı Suçlar">
        <mvz-madde no="213" başlık="Halk arasında korku ve panik yaratmak amacıyla tehdit">
          <mvz-fıkra no="1">
            <template>Halk arasında endişe, korku ve panik yaratmak amacıyla hayat, sağlık, vücut veya cinsel dokunulmazlık ya da malvarlığı bakımından alenen tehditte bulunan kişi, iki yıldan dört yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun silahla işlenmesi halinde, verilecek ceza, kullanılan silahın niteliğine göre yarı oranına kadar artırılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="214" başlık="Suç işlemeye tahrik">
          <mvz-fıkra no="1">
            <template>Suç işlemek için alenen tahrikte bulunan kişi, altı aydan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Halkın bir kısmını diğer bir kısmına karşı silahlandırarak, birbirini öldürmeye tahrik eden kişi, onbeş yıldan yirmidört yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tahrik konusu suçların işlenmesi halinde, tahrik eden kişi, bu suçlara azmettiren sıfatıyla cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="215" başlık="Suçu ve suçluyu övme">
          <mvz-fıkra no="1">
            <template>İşlenmiş olan bir suçu veya işlemiş olduğu suçtan dolayı bir kişiyi alenen öven kimse, bu nedenle kamu düzeni açısından açık ve yakın bir tehlikenin ortaya çıkması hâlinde, iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="216" başlık="Halkı kin ve düşmanlığa tahrik veya aşağılama">
          <mvz-fıkra no="1">
            <template>Halkın sosyal sınıf, ırk, din, mezhep veya bölge bakımından farklı özelliklere sahip bir kesimini, diğer bir kesimi aleyhine kin ve düşmanlığa alenen tahrik eden kimse, bu nedenle kamu güvenliği açısından açık ve yakın bir tehlikenin ortaya çıkması halinde, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Halkın bir kesimini, sosyal sınıf, ırk, din, mezhep, cinsiyet veya bölge farklılığına dayanarak alenen aşağılayan kişi, altı aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Halkın bir kesiminin benimsediği dini değerleri alenen aşağılayan kişi, fiilin kamu barışını bozmaya elverişli olması halinde, altı aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="217" başlık="Kanunlara uymamaya tahrik">
          <mvz-fıkra no="1">
            <template>Halkı kanunlara uymamaya alenen tahrik eden kişi, tahrikin kamu barışını bozmaya elverişli olması halinde, altı aydan iki yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="217/A" başlık="Halkı yanıltıcı bilgiyi alenen yayma">
          <mvz-fıkra no="1">
            <template>Sırf halk arasında endişe, korku veya panik yaratmak saikiyle, ülkenin iç ve dış güvenliği, kamu düzeni ve genel sağlığı ile ilgili gerçeğe aykırı bir bilgiyi, kamu barışını bozmaya elverişli şekilde alenen yayan kimse, bir yıldan üç yıla kadar hapis cezasıyla cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fail, suçu gerçek kimliğini gizleyerek veya bir örgütün faaliyeti çerçevesinde işlemesi hâlinde, birinci fıkraya göre verilen ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="218" başlık="Ortak hüküm">
          <mvz-fıkra no="1">
            <template>Yukarıdaki maddelerde tanımlanan suçların basın ve yayın yoluyla işlenmesi hâlinde, verilecek ceza yarı oranına kadar artırılır. Ancak, haber verme sınırlarını aşmayan ve eleştiri amacıyla yapılan düşünce açıklamaları suç oluşturmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="219" başlık="Görev sırasında din hizmetlerini kötüye kullanma">
          <mvz-fıkra no="1">
            <template>İmam, hatip, vaiz, rahip, haham gibi dini reislerden biri vazifesini ifa sırasında alenen hükümet idaresini ve Devlet kanunlarını ve hükümet icraatını takbih ve tezyif ederse bir aydan bir seneye kadar hapis ve adlî para cezası ile cezalandırılır veya bunlardan birine hükmolunabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıdaki fıkrada gösterilen kimselerden biri işbu sıfattan bilistifade hükümetin idaresini ve kanun ve nizam ve emirleri ve dairelerden birine ait olan vazife ve salahiyeti takbih ve tezyife veya halkı kanunlara yahut hükümet emirlerini icraya veya memuru memuriyetinin vazifesi icabına karşı itaatsizliğe tahrik ve teşvik edecek olursa üç aydan iki seneye kadar hapse ve adlî para cezası ve müebbeden veya muvakkaten bilfiil o vazifeyi icradan ve onun menfaat ve aidatını almaktan memnuiyetine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kendi sıfatlarından istifade ederek kanuna göre kazanılmış olan haklara muhalif iş ve sözlerde bulunmaya, bir kimseyi icbar ve ikna eden din reis ve memurları hakkında dahi baladaki fıkrada yazılı ceza tertip olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bunlardan biri dini sıfatından istifade ederek, birinci fıkrada yazılı fiillerden başka bir cürüm işlerse altıda bir miktarı çoğaltılmak şartıyla o cürüm için kanunda yazılı olan ceza ile mahkûm olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Şu kadar ki kanun işbu sıfatı esasen nazarıitibara almış ise cezayı çoğaltmaya mahal yoktur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="220" başlık="Suç işlemek amacıyla örgüt kurma">
          <mvz-fıkra no="1">
            <template>Kanunun suç saydığı fiilleri işlemek amacıyla örgüt kuranlar veya yönetenler, örgütün yapısı, sahip bulunduğu üye sayısı ile araç ve gereç bakımından amaç suçları işlemeye elverişli olması halinde, beş yıldan on yıla kadar hapis cezası ile cezalandırılır. Ancak, örgütün varlığı için üye sayısının en az üç kişi olması gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suç işlemek amacıyla kurulmuş olan örgüte üye olanlar, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Örgütün silahlı olması halinde, yukarıdaki fıkralara göre verilecek ceza yarısı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Örgütün faaliyeti çerçevesinde suç işlenmesi halinde, ayrıca bu suçlardan dolayı da cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Örgütün faaliyeti çerçevesinde işlenen suçlarda çocukların araç olarak kullanılması halinde, örgüt yöneticilerine yukarıdaki fıkralara göre verilecek ceza yarısından bir katına kadar artırılır. Örgüt yöneticileri, örgütün faaliyeti çerçevesinde işlenen bütün suçlardan dolayı ayrıca fail olarak cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6" durum="iptal">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Örgüt içindeki hiyerarşik yapıya dahil olmamakla birlikte, örgüte bilerek ve isteyerek yardım eden kişi, örgüt üyesi olarak cezalandırılır. Örgüt üyeliğinden dolayı verilecek ceza, yapılan yardımın niteliğine göre üçte birine kadar indirilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Örgütün cebir, şiddet veya tehdit içeren yöntemlerini meşru gösterecek veya övecek ya da bu yöntemlere başvurmayı teşvik edecek şekilde propagandasını yapan kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır. Bu suçun basın ve yayın yolu ile işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="221" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>Suç işlemek amacıyla örgüt kurma suçu nedeniyle soruşturmaya başlanmadan ve örgütün amacı doğrultusunda suç işlenmeden önce, örgütü dağıtan veya verdiği bilgilerle örgütün dağılmasını sağlayan kurucu veya yöneticiler hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Örgüt üyesinin, örgütün faaliyeti çerçevesinde herhangi bir suçun işlenişine iştirak etmeksizin, gönüllü olarak örgütten ayrıldığını ilgili makamlara bildirmesi halinde, hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Örgütün faaliyeti çerçevesinde herhangi bir suçun işlenişine iştirak etmeden yakalanan örgüt üyesinin, pişmanlık duyarak örgütün dağılmasını veya mensuplarının yakalanmasını sağlamaya elverişli bilgi vermesi halinde, hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Suç işlemek amacıyla örgüt kuran, yöneten veya örgüte üye olan ya da üye olmamakla birlikte örgüt adına suç işleyen veya örgüte bilerek ve isteyerek yardım eden kişinin, gönüllü olarak teslim olup, örgütün yapısı ve faaliyeti çerçevesinde işlenen suçlarla ilgili bilgi vermesi halinde, hakkında örgüt kurmak, yönetmek veya örgüte üye olmak suçundan dolayı cezaya hükmolunmaz. Kişinin bu bilgileri yakalandıktan sonra vermesi halinde, hakkında bu suçtan dolayı verilecek cezada üçte birden dörtte üçe kadar indirim yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Etkin pişmanlıktan yararlanan kişiler hakkında bir yıl süreyle denetimli serbestlik tedbirine hükmolunur. Denetimli serbestlik tedbirinin süresi üç yıla kadar uzatılabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Kişi hakkında, bu maddedeki etkin pişmanlık hükümleri birden fazla uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>

      <mvz-bölüm no="6-ALTINCI" başlık="Ulaşım Araçlarına veya Sabit Platformlara Karşı Suçlar">
        <mvz-madde no="223" başlık="Ulaşım araçlarının hareketinin engellenmesi, kaçırılması veya alıkonulması">
          <mvz-fıkra no="1">
            <template>Hukuka aykırı bir davranışla kara ulaşım aracının hareket etmesini engelleyen veya bu aracı hareket halinde iken durduran kişi, bir yıldan üç yıla kadar, bu aracı gitmekte olduğu yerden başka yere götüren kişi, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun konusunun deniz veya demiryolu ulaşım aracı olması halinde, üç yıldan yedi yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hukuka aykırı bir davranışla hava ulaşım aracının hareket etmesini engelleyen kişi, beş yıldan on yıla kadar, bu aracı gitmekte olduğu yerden başka yere götüren kişi, yedi yıldan oniki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yukarıdaki fıkralarda tanımlanan suçların işlenmesi amacıyla veya sırasında başka bir suçun işlenmesi halinde ayrıca bu suçtan dolayı ceza verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Kanunda öngörülen şekil, şart ve usullere uygun olarak düzenlenen toplantı ve gösteri yürüyüşleri esnasında birinci ve ikinci fıkrada belirtilen fillerin işlenmesi halinde bu fıkralardaki suç oluşmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="224" başlık="Kıt'a sahanlığında veya münhasır ekonomik bölgedeki sabit platformların işgali">
          <mvz-fıkra no="1">
            <template>Kıt'a sahanlığında veya münhasır ekonomik bölgede kurulmuş sabit bir platformu cebir veya tehdit kullanarak ya da hukuka aykırı başka bir davranışla ele geçiren, zapteden veya kontrolü altına alan kişi, beş yıldan onbeş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun işlenmesi sırasında kişilerin hürriyetinin tahdit edilmesi dolayısıyla ayrıca cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçun işlenmesi sırasında kasten yaralama suçunun neticesi sebebiyle ağırlaşmış hallerinin gerçekleşmesi durumunda, ayrıca kasten yaralama suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="7-YEDİNCİ" başlık="Genel Ahlaka Karşı Suçlar">
        <mvz-madde no="225" başlık="Hayasızca hareketler">
          <mvz-fıkra no="1">
            <template>Alenen cinsel ilişkide bulunan veya teşhircilik yapan kişi, altı aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="226" başlık="Müstehcenlik">
          <mvz-fıkra no="1">
            <template></template>
            <mvz-bent no="a">
              <template>Bir çocuğa müstehcen görüntü, yazı veya sözleri içeren ürünleri veren ya da bunların içeriğini gösteren, okuyan, okutan veya dinleten,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bunların içeriklerini çocukların girebileceği veya görebileceği yerlerde ya da alenen gösteren, görülebilecek şekilde sergileyen, okuyan, okutan, söyleyen, söyleten,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Bu ürünleri, içeriğine vakıf olunabilecek şekilde satışa veya kiraya arz eden,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Bu ürünleri, bunların satışına mahsus alışveriş yerleri dışında, satışa arz eden, satan veya kiraya veren,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Bu ürünleri, sair mal veya hizmet satışları yanında veya dolayısıyla bedelsiz olarak veren veya dağıtan,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Bu ürünlerin reklamını yapan,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Kişi, altı aydan iki yıla kadar hapis ve adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Müstehcen görüntü, yazı veya sözleri basın ve yayın yolu ile yayınlayan veya yayınlanmasına aracılık eden kişi altı aydan üç yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Müstehcen görüntü, yazı veya sözleri içeren ürünlerin üretiminde çocukları, temsili çocuk görüntülerini veya çocuk gibi görünen kişileri kullanan kişi, beş yıldan on yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır. Bu ürünleri ülkeye sokan, çoğaltan, satışa arz eden, satan, nakleden, depolayan, ihraç eden, bulunduran ya da başkalarının kullanımına sunan kişi, iki yıldan beş yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Şiddet kullanılarak, hayvanlarla, ölmüş insan bedeni üzerinde veya doğal olmayan yoldan yapılan cinsel davranışlara ilişkin yazı, ses veya görüntüleri içeren ürünleri üreten, ülkeye sokan, satışa arz eden, satan, nakleden, depolayan, başkalarının kullanımına sunan veya bulunduran kişi, bir yıldan dört yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Üç ve dördüncü fıkralardaki ürünlerin içeriğini basın ve yayın yolu ile yayınlayan veya yayınlanmasına aracılık eden ya da çocukların görmesini, dinlemesini veya okumasını sağlayan kişi, altı yıldan on yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu suçlardan dolayı, tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu madde hükümleri, bilimsel eserlerle; üçüncü fıkra hariç olmak ve çocuklara ulaşması engellenmek koşuluyla, sanatsal ve edebi değeri olan eserler hakkında uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="227" başlık="Fuhuş">
          <mvz-fıkra no="1">
            <template>Çocuğu fuhşa teşvik eden, bunun yolunu kolaylaştıran, bu maksatla tedarik eden veya barındıran ya da çocuğun fuhşuna aracılık eden kişi, dört yıldan on yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır. Bu suçun işlenişine yönelik hazırlık hareketleri de tamamlanmış suç gibi cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir kimseyi fuhşa teşvik eden, bunun yolunu kolaylaştıran ya da fuhuş için aracılık eden veya yer temin eden kişi, iki yıldan dört yıla kadar hapis ve üçbin güne kadar adlî para cezası ile cezalandırılır. Fuhşa sürüklenen kişinin kazancından yararlanılarak kısmen veya tamamen geçimin sağlanması, fuhşa teşvik sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Fuhşu kolaylaştırmak veya fuhşa aracılık etmek amacıyla hazırlanmış görüntü, yazı ve sözleri içeren ürünleri veren, dağıtan veya yayan kişi bir yıldan üç yıla kadar hapis ve iki yüz günden iki bin güne kadar adli para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cebir veya tehdit kullanarak, hile ile ya da çaresizliğinden yararlanarak bir kimseyi fuhşa sevk eden veya fuhuş yapmasını sağlayan kişi hakkında yukarıdaki fıkralara göre verilecek ceza yarısından iki katına kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yukarıdaki fıkralarda tanımlanan suçların eş, üstsoy, kayın üstsoy, kardeş, evlat edinen, vasi, eğitici, öğretici, bakıcı, koruma ve gözetim yükümlülüğü bulunan diğer kişiler tarafından ya da kamu görevi veya hizmet ilişkisinin sağladığı nüfuz kötüye kullanılmak suretiyle işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu suçların, suç işlemek amacıyla teşkil edilmiş örgüt faaliyeti çerçevesinde işlenmesi halinde, yukarıdaki fıkralara göre verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu suçlardan dolayı, tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Fuhşa sürüklenen kişi, tedaviye veya psikolojik terapiye tâbi tutulabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="228" başlık="Kumar oynanması için yer ve imkan sağlama">
          <mvz-fıkra no="1">
            <template>Kumar oynanması için yer ve imkan sağlayan kişi, bir yıldan üç yıla kadar hapis ve iki yüz günden aşağı olmamak üzere adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Çocukların kumar oynaması için yer ve imkan sağlanması halinde, verilecek ceza bir katı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suçun bilişim sistemlerinin kullanılması suretiyle işlenmesi halinde üç yıldan beş yıla kadar hapis ve bin günden onbin güne kadar adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Suçun bir örgütün faaliyeti çerçevesinde işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu suçtan dolayı, tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Ceza Kanununun uygulanmasında kumar, kazanç amacıyla icra edilen ve kar ve zararın talihe bağlı olduğu oyunlardır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="229" başlık="Dilencilik">
          <mvz-fıkra no="1">
            <template>Çocukları, beden veya ruh bakımından kendini idare edemeyecek durumda bulunan kimseleri dilencilikte araç olarak kullanan kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun üçüncü derece dahil kan veya kayın hısımları ya da eş tarafından işlenmesi halinde verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçun örgüt faaliyeti çerçevesinde işlenmiş olması halinde, verilecek ceza bir kat artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
