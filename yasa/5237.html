            <template>Kovuşturma yapılabilmesi şikayete bağlı suçlarda kanunda aksi yazılı olmadıkça suçtan zarar gören kişinin vazgeçmesi davayı düşürür ve hükmün kesinleşmesinden sonraki vazgeçme cezanın infazına engel olmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>İştirak halinde suç işlemiş sanıklardan biri hakkındaki şikayetten vazgeçme, diğerlerini de kapsar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Kanunda aksi yazılı olmadıkça, vazgeçme onu kabul etmeyen sanığı etkilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Kamu davasının düşmesi, suçtan zarar gören kişinin şikayetten vazgeçmiş olmasından ileri gelmiş ve vazgeçtiği sırada şahsi haklarından da vazgeçtiğini ayrıca açıklamış ise artık hukuk mahkemesinde de dava açamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="74" başlık="Dava veya cezanın düşmesinin etkisi">
          <mvz-fıkra no="1">
            <template>Genel af, özel af ve şikayetten vazgeçme, müsadere olunan şeylerin veya ödenen adlî para cezasının geri alınmasını gerektirmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kamu davasının düşmesi, malların geri alınması ve uğranılan zararın tazmini için açılan şahsi hak davasını etkilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cezanın düşmesi şahsi haklar, tazminat ve yargılama giderlerine ilişkin hükümleri etkilemez. Ancak, genel af halinde yargılama giderleri de istenemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="75" başlık="Önödeme">
          <mvz-fıkra no="1">
            <template>Uzlaşma kapsamındaki suçlar hariç olmak üzere, yalnız adlî para cezasını gerektiren veya kanun maddesinde öngörülen hapis cezasının yukarı sınırı altı ayı aşmayan suçların faili;</template>
            <mvz-bent no="a">
              <template>Adlî para cezası maktu ise bu miktarı, değilse aşağı sınırını,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Hapis cezasının aşağı sınırının karşılığı olarak her gün için yüz Türk Lirası üzerinden bulunacak miktarı,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Hapis cezası ile birlikte adlî para cezası da öngörülmüş ise, hapis cezası için bu fıkranın (b) bendine göre belirlenecek miktar ile adlî para cezasının aşağı sınırını,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Soruşturma giderleri ile birlikte, Cumhuriyet savcılığınca yapılacak tebliğ üzerine on gün içinde ödediği takdirde hakkında kamu davası açılmaz.  Failin on gün içinde talep etmesi koşuluyla bu miktarın birer ay ara ile üç eşit taksit hâlinde ödenmesine Cumhuriyet savcısı tarafından karar verilir. Taksitlerin süresinde ödenmemesi hâlinde önödeme hükümsüz kalır ve soruşturmaya devam edilir.  Taksirli suçlar hariç olmak üzere, önödemeye bağlı olarak kovuşturmaya yer olmadığına veya kamu davasının düşmesine karar verildiği tarihten itibaren beş yıl içinde önödemeye tabi bir suçu işleyen faile bu fıkra uyarınca teklif edilecek önödeme miktarı yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Özel kanun hükümleri gereğince işin doğrudan mahkemeye intikal etmesi halinde de fail, hakim tarafından yapılacak bildirim üzerine birinci fıkra hükümlerine göre saptanacak miktardaki parayı yargılama giderleriyle birlikte ödediğinde kamu davası düşer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cumhuriyet savcılığınca madde kapsamına giren suç nedeniyle önödeme işlemi yapılmadan dava açılması veya dava konusu fiilin niteliğinin değişmesi suretiyle madde kapsamına giren bir suça dönüşmesi halinde de yukarıdaki fıkra uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Suçla ilgili kanun maddesinde yukarı sınırı altı ayı aşmayan hapis cezası veya adlî para cezasından yalnız birinin uygulanabileceği hallerde ödenmesi gereken miktar, yukarıdaki fıkralara göre adlî para cezası esas alınarak belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu madde gereğince kamu davasının açılmaması veya ortadan kaldırılması, kişisel hakkın istenmesine, malın geri alınmasına ve müsadereye ilişkin hükümleri etkilemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu madde hükümleri;</template>
            <mvz-bent no="a">
              <template>Bu Kanunda yer alan;</template>
              <mvz-altbent no="1">
                <template>Yardım veya bildirim yükümlülüğünün yerine getirilmemesi ,</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Hakaret (üçüncü fıkranın (a) bendi hariç, madde 125),</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Genel güvenliğin taksirle tehlikeye sokulması ,</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Çevrenin taksirle kirletilmesi ,</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Özel işaret ve kıyafetleri usulsüz kullanma ,</template>
              </mvz-altbent>
              <mvz-altbent no="6">
                <template>Suçu bildirmeme ,</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="0">
              <template>suçları,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>31/8/1956 tarihli ve 6831 sayılı Orman Kanununun 108 inci maddesinin birinci fıkrasında yer alan suç,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>21/7/1983 tarihli ve 2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanununun 74 üncü maddesinin ikinci fıkrasının birinci cümlesinde yer alan suç,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>4/11/2004 tarihli ve 5253 sayılı Dernekler Kanununun 32 nci maddesinin birinci fıkrasının (d) bendinde yer alan suç,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>bakımından da uygulanır. Bu fıkra kapsamındaki suçların beş yıl içinde tekrar işlenmesi hâlinde fail hakkında aynı suçtan dolayı önödeme hükümleri uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Ödemede bulunulması üzerine verilen kovuşturmaya yer olmadığına dair kararlar ile düşme kararları, bunlara mahsus bir sisteme kaydedilir. Bu kayıtlar, ancak bir soruşturma veya kovuşturmayla bağlantılı olarak Cumhuriyet savcısı, hâkim veya mahkeme tarafından istenmesi hâlinde, bu maddede belirtilen amaç için kullanılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
  </mvz-kitap>
  <mvz-kitap no="2-İKİNCİ" başlık="Özel Hükümler">
    <mvz-kısım no="1-BİRİNCİ" başlık="Uluslararası Suçlar">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Soykırım ve İnsanlığa Karşı Suçlar">
        <mvz-madde no="76" başlık="Soykırım">
          <mvz-fıkra no="1">
            <template>Bir planın icrası suretiyle, milli, etnik, ırki veya dini bir grubun tamamen veya kısmen yokedilmesi maksadıyla, bu grupların üyelerine karşı aşağıdaki fiillerden birinin işlenmesi, soykırım suçunu oluşturur:</template>
            <mvz-bent no="a">
              <template>Kasten öldürme.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kişilerin bedensel veya ruhsal bütünlüklerine ağır zarar verme.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Grubun, tamamen veya kısmen yokedilmesi sonucunu doğuracak koşullarda yaşamaya zorlanması.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Grup içinde doğumlara engel olmaya yönelik tedbirlerin alınması.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Gruba ait çocukların bir başka gruba zorla nakledilmesi.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soykırım suçu failine ağırlaştırılmış müebbet hapis cezası verilir. Ancak, soykırım kapsamında işlenen kasten öldürme ve kasten yaralama suçları açısından, belirlenen mağdur sayısınca gerçek içtima hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçlardan dolayı tüzel kişiler hakkında da güvenlik tedbirine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçlardan dolayı zamanaşımı işlemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="77" başlık="İnsanlığa karşı suçlar">
          <mvz-fıkra no="1">
            <template>Aşağıdaki fiillerin, siyasal, felsefi, ırki veya dini saiklerle toplumun bir kesimine karşı bir plan doğrultusunda sistemli olarak işlenmesi, insanlığa karşı suç oluşturur:</template>
            <mvz-bent no="a">
              <template>Kasten öldürme.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kasten yaralama.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İşkence, eziyet veya köleleştirme.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kişi hürriyetinden yoksun kılma.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Bilimsel deneylere tabi kılma.</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Cinsel saldırıda bulunma, çocukların cinsel istismarı.</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Zorla hamile bırakma.</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>Zorla fuhşa sevketme.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkranın (a) bendindeki fiilin işlenmesi halinde, fail hakkında ağırlaştırılmış müebbet hapis cezasına; diğer bentlerde tanımlanan fiillerin işlenmesi halinde ise, sekiz yıldan az olmamak üzere hapis cezasına hükmolunur. Ancak, birinci fıkranın (a) ve (b) bentleri kapsamında işlenen kasten öldürme ve kasten yaralama suçları açısından, belirlenen mağdur sayısınca gerçek içtima hükümleri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçlardan dolayı tüzel kişiler hakkında da güvenlik tedbirine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçlardan dolayı zamanaşımı işlemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="78" başlık="Örgüt">
          <mvz-fıkra no="1">
            <template>Yukarıdaki maddelerde yazılı suçları işlemek maksadıyla örgüt kuran veya yöneten kişi, on yıldan onbeş yıla kadar hapis cezası ile cezalandırılır. Bu örgütlere üye olanlara beş yıldan on yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçlardan dolayı tüzel kişiler hakkında da güvenlik tedbirine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçlardan dolayı zamanaşımı işlemez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Göçmen Kaçakçılığı ve İnsan Ticareti">
        <mvz-madde no="79" başlık="Göçmen kaçakçılığı">
          <mvz-fıkra no="1">
            <template>Doğrudan doğruya veya dolaylı olarak maddi menfaat elde etmek maksadıyla, yasal olmayan yollardan;</template>
            <mvz-bent no="a">
              <template>Bir yabancıyı ülkeye sokan veya ülkede kalmasına imkan sağlayan,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Türk vatandaşı veya yabancının yurt dışına çıkmasına imkan sağlayan,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Kişi, beş yıldan sekiz yıla kadar hapis ve bin günden onbin güne kadar adlî para cezası ile cezalandırılır.  Suç, teşebbüs aşamasında kalmış olsa dahi, tamamlanmış gibi cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun, mağdurların;</template>
            <mvz-bent no="a">
              <template>Hayatı bakımından bir tehlike oluşturması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Onur kırıcı bir muameleye maruz bırakılarak işlenmesi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>hâlinde, verilecek ceza yarısından üçte ikisine kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçun; birden fazla kişi tarafından birlikte işlenmesi halinde verilecek ceza yarısına kadar, bir örgütün faaliyeti çerçevesinde işlenmesi halinde verilecek ceza yarısından bir katına kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçun bir tüzel kişinin faaliyeti çerçevesinde işlenmesi halinde, tüzel kişi hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="80" başlık="İnsan ticareti">
          <mvz-fıkra no="1">
            <template>Zorla çalıştırmak, hizmet ettirmek, fuhuş yaptırmak veya esarete tâbi kılmak ya da vücut organlarının verilmesini sağlamak maksadıyla tehdit, baskı, cebir veya şiddet uygulamak, nüfuzu kötüye kullanmak, kandırmak veya kişiler üzerindeki denetim olanaklarından veya çaresizliklerinden yararlanarak rızalarını elde etmek suretiyle kişileri ülkeye sokan, ülke dışına çıkaran, tedarik eden, kaçıran, bir yerden başka bir yere götüren veya sevk eden ya da barındıran kimseye sekiz yıldan oniki yıla kadar hapis ve onbin güne kadar adlî para cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada belirtilen amaçlarla girişilen ve suçu oluşturan fiiller var olduğu takdirde, mağdurun rızası geçersizdir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Onsekiz yaşını doldurmamış olanların birinci fıkrada belirtilen maksatlarla tedarik edilmeleri, kaçırılmaları, bir yerden diğer bir yere götürülmeleri veya sevk edilmeleri veya barındırılmaları hallerinde suça ait araç fiillerden hiçbirine başvurulmuş olmasa da faile birinci fıkrada belirtilen cezalar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçlardan dolayı tüzel kişiler hakkında da güvenlik tedbirine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>

    <mvz-kısım no="2-İKİNCİ" başlık="Kişilere Karşı Suçlar">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Hayata Karşı Suçlar">
        <mvz-madde no="81" başlık="Kasten öldürme">
          <mvz-fıkra no="1">
            <template>Bir insanı kasten öldüren kişi, müebbet hapis cezası ile cezalandırılır.</template>

        <mvz-madde no="82" başlık="Nitelikli haller">

            <template>Kasten öldürme suçunun;</template>
            <mvz-bent no="a">
              <template>Tasarlayarak,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Canavarca hisle veya eziyet çektirerek,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Yangın, su baskını, tahrip, batırma veya bombalama ya da nükleer, biyolojik veya kimyasal silah kullanmak suretiyle,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Üstsoy veya altsoydan birine ya da eş, boşandığı eş veya kardeşe karşı,</template>

            <mvz-bent no="e">
              <template>Çocuğa ya da beden veya ruh bakımından kendisini savunamayacak durumda bulunan kişiye karşı,</template>

            <mvz-bent no="g">

        <mvz-madde no="83" başlık="Kasten öldürmenin ihmali davranışla işlenmesi">

            <template>Kişinin yükümlü olduğu belli bir icrai davranışı gerçekleştirmemesi dolayısıyla meydana gelen ölüm neticesinden sorumlu tutulabilmesi için, bu neticenin oluşumuna sebebiyet veren yükümlülük ihmalinin icrai davranışa eşdeğer olması gerekir.</template>

          <mvz-fıkra no="2">
            <template>İhmali ve icrai davranışın eşdeğer kabul edilebilmesi için, kişinin;</template>
            <mvz-bent no="a">
              <template>Belli bir icrai davranışta bulunmak hususunda kanuni düzenlemelerden veya sözleşmeden kaynaklanan bir yükümlülüğünün bulunması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Önceden gerçekleştirdiği davranışın başkalarının hayatı ile ilgili olarak tehlikeli bir durum oluşturması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Belli bir yükümlülüğün ihmali ile ölüme neden olan kişi hakkında, temel ceza olarak, ağırlaştırılmış müebbet hapis cezası yerine yirmi yıldan yirmibeş yıla kadar, müebbet hapis cezası yerine onbeş yıldan yirmi yıla kadar, diğer hallerde ise on yıldan onbeş yıla kadar hapis cezasına hükmolunabileceği gibi, cezada indirim de yapılmayabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="84" başlık="İntihara yönlendirme">
          <mvz-fıkra no="1">
            <template>Başkasını intihara azmettiren, teşvik eden, başkasının intihar kararını kuvvetlendiren ya da başkasının intiharına herhangi bir şekilde yardım eden kişi, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İntiharın gerçekleşmesi durumunda, kişi dört yıldan on yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Başkalarını intihara alenen teşvik eden kişi, üç yıldan sekiz yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İşlediği fiilin anlam ve sonuçlarını algılama yeteneği gelişmemiş olan veya ortadan kaldırılan kişileri intihara sevk edenlerle cebir veya tehdit kullanmak suretiyle kişileri intihara mecbur edenler, kasten öldürme suçundan sorumlu tutulurlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="85" başlık="Taksirle öldürme">
          <mvz-fıkra no="1">
            <template>Taksirle bir insanın ölümüne neden olan kişi, iki yıldan altı yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiil, birden fazla insanın ölümüne ya da bir veya birden fazla kişinin ölümü ile birlikte bir veya birden fazla kişinin yaralanmasına neden olmuş ise, kişi iki yıldan onbeş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>

      <mvz-bölüm no="2-İKİNCİ" başlık="Vücut Dokunulmazlığına Karşı Suçlar">

          <mvz-fıkra no="2">
            <template>Kasten yaralama fiilinin kişi üzerindeki etkisinin basit bir tıbbî müdahaleyle giderilebilecek ölçüde hafif olması hâlinde, mağdurun şikâyeti üzerine, altı aydan bir yıl altı aya kadar hapis veya adlî para cezasına hükmolunur.  Suçun kadına karşı işlenmesi hâlinde cezanın alt sınırı dokuz aydan az olamaz.</template>

          <mvz-fıkra no="2">
            <template>Kasten yaralama fiili, mağdurun;</template>
            <mvz-bent no="a">

            <mvz-bent no="b">
              <template>Duyularından veya organlarından birinin işlevinin yitirilmesine,</template>

            <mvz-bent no="c">

            <mvz-bent no="e">

          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Neden olmuşsa, yukarıdaki maddeye göre belirlenen ceza, iki kat artırılır. Ancak, verilecek ceza, birinci fıkraya giren hallerde altı yıldan, üçüncü fıkraya giren hallerde dokuz yıldan az olamaz.</template>

        <mvz-madde no="90" başlık="İnsan üzerinde deney">
          <mvz-fıkra no="1">
            <template>İnsan üzerinde bilimsel bir deney yapan kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">

            <mvz-bent no="d">

            <mvz-bent no="f">

            </mvz-bent>
            <mvz-bent no="g">
              <template>Deneyin mahiyet ve sonuçları hakkında yeterli bilgilendirmeye dayalı olarak açıklanan rızanın yazılı olması ve herhangi bir menfaat teminine bağlı bulunmaması,</template>

          <mvz-fıkra no="0">
            <template>gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hasta olan insan üzerinde rıza olmaksızın tedavi amaçlı denemede bulunan kişi, bir yıla kadar hapis cezası ile cezalandırılır. Ancak, bilinen tıbbi müdahale yöntemlerinin uygulanmasının sonuç vermeyeceğinin anlaşılması üzerine, kişi üzerinde yapılan rızaya dayalı bilimsel yöntemlere uygun tedavi amaçlı deneme, ceza sorumluluğunu gerektirmez. Açıklanan rızanın, denemenin mahiyet ve sonuçları hakkında yeterli bilgilendirmeye dayalı olarak yazılı olması ve tedavinin uzman hekim tarafından bir hastane ortamında yapılması gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Birinci fıkrada tanımlanan suçun işlenmesi sonucunda mağdurun yaralanması veya ölmesi halinde, kasten yaralama veya kasten öldürme suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu maddede tanımlanan suçların bir tüzel kişinin faaliyeti çerçevesinde işlenmesi halinde, tüzel kişi hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="91" başlık="Organ veya doku ticareti">
          <mvz-fıkra no="1">
            <template>Hukuken geçerli rızaya dayalı olmaksızın, kişiden organ alan kimse, beş yıldan dokuz yıla kadar hapis cezası ile cezalandırılır. Suçun konusunun doku olması halinde, iki yıldan beş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hukuka aykırı olarak, ölüden organ veya doku alan kimse, bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Organ veya doku satın alan, satan, satılmasına aracılık eden kişi hakkında, birinci fıkrada belirtilen cezalara hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bir ve üçüncü fıkralarda tanımlanan suçların bir örgütün faaliyeti çerçevesinde işlenmesi halinde, sekiz yıldan onbeş yıla kadar hapis ve onbin güne kadar adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Hukuka aykırı yollarla elde edilmiş olan organ veya dokuyu saklayan, nakleden veya aşılayan kişi, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Belli bir çıkar karşılığında organ veya doku teminine yönelik olarak ilan veya reklam veren veya yayınlayan kişi, bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu maddede tanımlanan suçların bir tüzel kişinin faaliyeti çerçevesinde işlenmesi halinde, tüzel kişi hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Birinci fıkrada tanımlanan suçun işlenmesi sonucunda mağdurun ölmesi halinde, kasten öldürme suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="92" başlık="Zorunluluk hali">
          <mvz-fıkra no="1">
            <template>Organ veya dokularını satan kişinin içinde bulunduğu sosyal ve ekonomik koşullar göz önünde bulundurularak, hakkında verilecek cezada indirim yapılabileceği gibi, ceza vermekten de vazgeçilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="93" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>Organ veya dokularını satan kişi, resmi makamlar tarafından haber alınmadan önce durumu merciine haber vererek suçluların yakalanmalarını kolaylaştırırsa, hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suç haber alındıktan sonra, organ veya dokularını satan kişi, gönüllü olarak, suçun meydana çıkmasına ve diğer suçluların yakalanmasına hizmet ve yardım ederse; hakkında verilecek cezanın, yardımın niteliğine göre, dörtte birden yarısına kadarı indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="İşkence ve Eziyet">
        <mvz-madde no="94" başlık="İşkence">
          <mvz-fıkra no="1">
            <template>Bir kişiye karşı insan onuruyla bağdaşmayan ve bedensel veya ruhsal yönden acı çekmesine, algılama veya irade yeteneğinin etkilenmesine, aşağılanmasına yol açacak davranışları gerçekleştiren kamu görevlisi hakkında üç yıldan oniki yıla kadar hapis cezasına hükmolunur.  Suçun kadına karşı işlenmesi hâlinde cezanın alt sınırı beş yıldan az olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun;</template>
            <mvz-bent no="a">
              <template>Çocuğa, beden veya ruh bakımından kendisini savunamayacak durumda bulunan kişiye ya da gebe kadına karşı,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Avukata veya diğer kamu görevlisine karşı görevi dolayısıyla,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İşlenmesi halinde, sekiz yıldan onbeş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Fiilin cinsel yönden taciz şeklinde gerçekleşmesi halinde, on yıldan onbeş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçun işlenişine iştirak eden diğer kişiler de kamu görevlisi gibi cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu suçun ihmali davranışla işlenmesi halinde, verilecek cezada bu nedenle indirim yapılmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu suçtan dolayı zamanaşımı işlemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="95" başlık="Neticesi sebebiyle ağırlaşmış işkence">
          <mvz-fıkra no="1">
            <template>İşkence fiilleri, mağdurun;</template>
            <mvz-bent no="a">
              <template>Duyularından veya organlarından birinin işlevinin sürekli zayıflamasına,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Konuşmasında sürekli zorluğa,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Yüzünde sabit ize,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Yaşamını tehlikeye sokan bir duruma,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Gebe bir kadına karşı işlenip de çocuğunun vaktinden önce doğmasına,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Neden olmuşsa, yukarıdaki maddeye göre belirlenen ceza, yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İşkence fiilleri, mağdurun;</template>
            <mvz-bent no="a">
              <template>İyileşmesi olanağı bulunmayan bir hastalığa veya bitkisel hayata girmesine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Duyularından veya organlarından birinin işlevinin yitirilmesine,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Konuşma ya da çocuk yapma yeteneklerinin kaybolmasına,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Yüzünün sürekli değişikliğine,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Gebe bir kadına karşı işlenip de çocuğunun düşmesine,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Neden olmuşsa, yukarıdaki maddeye göre belirlenen ceza, bir kat artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İşkence fiillerinin vücutta kemik kırılmasına neden olması halinde, kırığın hayat fonksiyonlarındaki etkisine göre sekiz yıldan onbeş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İşkence sonucunda ölüm meydana gelmişse, ağırlaştırılmış müebbet hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="96" başlık="Eziyet">
          <mvz-fıkra no="1">
            <template>Bir kimsenin eziyet çekmesine yol açacak davranışları gerçekleştiren kişi hakkında iki yıldan beş yıla kadar hapis cezasına hükmolunur.  Suçun kadına karşı işlenmesi hâlinde cezanın alt sınırı iki yıl altı aydan az olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıdaki fıkra kapsamına giren fiillerin;</template>
            <mvz-bent no="a">
              <template>Çocuğa, beden veya ruh bakımından kendisini savunamayacak durumda bulunan kişiye ya da gebe kadına karşı,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Üstsoy veya altsoya, babalık veya analığa ya da eşe veya boşandığı eşe karşı,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İşlenmesi halinde, kişi hakkında üç yıldan sekiz yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Koruma, Gözetim, Yardım veya Bildirim Yükümlülüğünün İhlâli">
        <mvz-madde no="97" başlık="Terk">
          <mvz-fıkra no="1">
            <template>Yaşı veya hastalığı dolayısıyla kendini idare edemeyecek durumda olan ve bu nedenle koruma ve gözetim yükümlülüğü altında bulunan bir kimseyi kendi haline terk eden kişi, üç aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Terk dolayısıyla mağdur bir hastalığa yakalanmış, yaralanmış veya ölmüşse, neticesi sebebiyle ağırlaşmış suç hükümlerine göre cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="98" başlık="Yardım veya bildirim yükümlülüğünün yerine getirilmemesi">
          <mvz-fıkra no="1">
            <template>Yaşı, hastalığı veya yaralanması dolayısıyla ya da başka herhangi bir nedenle kendini idare edemeyecek durumda olan kimseye hal ve koşulların elverdiği ölçüde yardım etmeyen ya da durumu derhal ilgili makamlara bildirmeyen kişi, bir yıla kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yardım veya bildirim yükümlülüğünün yerine getirilmemesi dolayısıyla kişinin ölmesi durumunda, bir yıldan üç yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="5-BEŞİNCİ" başlık="Çocuk Düşürtme, Düşürme veya Kısırlaştırma">
        <mvz-madde no="99" başlık="Çocuk düşürtme">
          <mvz-fıkra no="1">
            <template>Rızası olmaksızın bir kadının çocuğunu düşürten kişi, beş yıldan on yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tıbbi zorunluluk bulunmadığı halde, rızaya dayalı olsa bile, gebelik süresi on haftadan fazla olan bir kadının çocuğunu düşürten kişi, iki yıldan dört yıla kadar hapis cezası ile cezalandırılır. Bu durumda, çocuğunun düşürtülmesine rıza gösteren kadın hakkında bir yıla kadar hapis veya adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci fıkrada yazılı fiil kadının beden veya ruh sağlığı bakımından bir zarara uğramasına neden olmuşsa, kişi altı yıldan oniki yıla kadar hapis cezası ile cezalandırılır; fiilin kadının ölümüne neden olması halinde, onbeş yıldan yirmi yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İkinci fıkrada yazılı fiil kadının beden veya ruh sağlığı bakımından bir zarara uğramasına neden olmuşsa, kişi üç yıldan altı yıla kadar hapis cezası ile cezalandırılır; fiilin kadının ölümüne neden olması halinde, dört yıldan sekiz yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Rızaya dayalı olsa bile, gebelik süresi on haftayı doldurmamış olan bir kadının çocuğunun yetkili olmayan bir kişi tarafından düşürtülmesi halinde; iki yıldan dört yıla kadar hapis cezasına hükmolunur. Yukarıdaki fıkralarda tanımlanan diğer fiiller yetkili olmayan bir kişi tarafından işlendiği takdirde, bu fıkralara göre verilecek ceza, yarı oranında artırılarak hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Kadının mağduru olduğu bir suç sonucu gebe kalması halinde, süresi yirmi haftadan fazla olmamak ve kadının rızası olmak koşuluyla, gebeliği sona erdirene ceza verilmez. Ancak, bunun için gebeliğin uzman hekimler tarafından hastane ortamında sona erdirilmesi gerekir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="100" başlık="Çocuk düşürme">
          <mvz-fıkra no="1">
            <template>Gebelik süresi on haftadan fazla olan kadının çocuğunu isteyerek düşürmesi halinde, bir yıla kadar hapis veya adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="101" başlık="Kısırlaştırma">
          <mvz-fıkra no="1">
            <template>Bir erkek veya kadını rızası olmaksızın kısırlaştıran kimse, üç yıldan altı yıla kadar hapis cezası ile cezalandırılır. Fiil, kısırlaştırma işlemi yapma yetkisi olmayan bir kimse tarafından yapılırsa, ceza üçte bir oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Rızaya dayalı olsa bile, kısırlaştırma fiilinin yetkili olmayan bir kişi tarafından işlenmesi halinde, bir yıldan üç yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="6-ALTINCI" başlık="Cinsel Dokunulmazlığa Karşı Suçlar">
        <mvz-madde no="102" başlık="Cinsel saldırı">
          <mvz-fıkra no="1">
            <template>Cinsel davranışlarla bir kimsenin vücut dokunulmazlığını ihlâl eden kişi, mağdurun şikâyeti üzerine, beş yıldan on yıla kadar hapis cezası ile cezalandırılır. Cinsel davranışın sarkıntılık düzeyinde kalması hâlinde iki yıldan beş yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiilin vücuda organ veya sair bir cisim sokulması suretiyle gerçekleştirilmesi durumunda, on iki yıldan az olmamak üzere hapis cezasına hükmolunur. Bu fiilin eşe karşı işlenmesi hâlinde, soruşturma ve kovuşturmanın yapılması mağdurun şikâyetine bağlıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suçun;</template>
            <mvz-bent no="a">
              <template>Beden veya ruh bakımından kendisini savunamayacak durumda bulunan kişiye karşı,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kamu görevinin, vesayet veya hizmet ilişkisinin sağladığı nüfuz kötüye kullanılmak suretiyle,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Üçüncü derece dâhil kan veya kayın hısımlığı ilişkisi içinde bulunan bir kişiye karşı ya da üvey baba, üvey ana, üvey kardeş, evlat edinen veya evlatlık tarafından,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Silahla veya birden fazla kişi tarafından birlikte,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>İnsanların toplu olarak bir arada yaşama zorunluluğunda bulunduğu ortamların sağladığı kolaylıktan faydalanmak suretiyle,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>işlenmesi hâlinde, yukarıdaki fıkralara göre verilen cezalar yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cinsel saldırı için başvurulan cebir ve şiddetin kasten yaralama suçunun ağır neticelerine neden olması hâlinde, ayrıca kasten yaralama suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Suç sonucu mağdurun bitkisel hayata girmesi veya ölümü hâlinde, ağırlaştırılmış müebbet hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="103" başlık="Çocukların cinsel istismarı">
          <mvz-fıkra no="1">
            <template>Çocuğu cinsel yönden istismar eden kişi, sekiz yıldan on beş yıla kadar hapis cezası ile cezalandırılır. Cinsel istismarın sarkıntılık düzeyinde kalması hâlinde üç yıldan sekiz yıla kadar hapis cezasına hükmolunur.  Mağdurun on iki yaşını tamamlamamış olması hâlinde verilecek ceza, istismar durumunda on yıldan, sarkıntılık durumunda beş yıldan az olamaz. Sarkıntılık düzeyinde kalmış suçun failinin çocuk olması hâlinde soruşturma ve kovuşturma yapılması mağdurun, velisinin veya vasisinin şikâyetine bağlıdır. Cinsel istismar deyiminden;</template>
            <mvz-bent no="a">
              <template>On beş yaşını tamamlamamış veya tamamlamış olmakla birlikte fiilin hukuki anlam ve sonuçlarını algılama yeteneği gelişmemiş olan çocuklara karşı gerçekleştirilen her türlü cinsel davranış,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Diğer çocuklara karşı sadece cebir, tehdit, hile veya iradeyi etkileyen başka bir nedene dayalı olarak gerçekleştirilen cinsel davranışlar,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>anlaşılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cinsel istismarın vücuda organ veya sair bir cisim sokulması suretiyle gerçekleştirilmesi durumunda, on altı yıldan aşağı olmamak üzere hapis cezasına hükmolunur. Mağdurun on iki yaşını tamamlamamış olması hâlinde verilecek ceza on sekiz yıldan az olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suçun;</template>
            <mvz-bent no="a">
              <template>Birden fazla kişi tarafından birlikte,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>İnsanların toplu olarak bir arada yaşama zorunluluğunda bulunduğu ortamların sağladığı kolaylıktan faydalanmak suretiyle,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Üçüncü derece dâhil kan veya kayın hısımlığı ilişkisi içinde bulunan bir kişiye karşı ya da üvey baba, üvey ana, üvey kardeş veya evlat edinen tarafından,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Vasi, eğitici, öğretici, bakıcı, koruyucu aile veya sağlık hizmeti veren ya da koruma, bakım veya gözetim yükümlülüğü bulunan kişiler tarafından,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kamu görevinin veya hizmet ilişkisinin sağladığı nüfuz kötüye kullanılmak suretiyle,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>işlenmesi hâlinde, yukarıdaki fıkralara göre verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cinsel istismarın, birinci fıkranın (a) bendindeki çocuklara karşı cebir veya tehditle ya da (b) bendindeki çocuklara karşı silah kullanmak suretiyle gerçekleştirilmesi hâlinde, yukarıdaki fıkralara göre verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Cinsel istismar için başvurulan cebir ve şiddetin kasten yaralama suçunun ağır neticelerine neden olması hâlinde, ayrıca kasten yaralama suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Suç sonucu mağdurun bitkisel hayata girmesi veya ölümü hâlinde, ağırlaştırılmış müebbet hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="104" başlık="Reşit olmayanla cinsel ilişki">
          <mvz-fıkra no="1">
            <template>Cebir, tehdit ve hile olmaksızın, onbeş yaşını bitirmiş olan çocukla cinsel ilişkide bulunan kişi, şikayet üzerine, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun mağdur ile arasında evlenme yasağı bulunan kişi tarafından işlenmesi hâlinde, şikâyet aranmaksızın, on yıldan on beş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suçun, evlat edineceği çocuğun evlat edinme öncesi bakımını üstlenen veya koruyucu aile ilişkisi çerçevesinde koruma, bakım ve gözetim yükümlülüğü bulunan kişi tarafından işlenmesi hâlinde, şikâyet aranmaksızın ikinci fıkraya göre cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="105" başlık="Cinsel taciz">
          <mvz-fıkra no="1">
            <template>Bir kimseyi cinsel amaçlı olarak taciz eden kişi hakkında, mağdurun şikayeti üzerine, üç aydan iki yıla kadar hapis cezasına veya adlî para cezasına fiilin çocuğa karşı işlenmesi hâlinde altı aydan üç yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun;</template>
            <mvz-bent no="a">
              <template>Kamu görevinin veya hizmet ilişkisinin ya da aile içi ilişkinin sağladığı kolaylıktan faydalanmak suretiyle,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Vasi, eğitici, öğretici, bakıcı, koruyucu aile veya sağlık hizmeti veren ya da koruma, bakım veya gözetim yükümlülüğü bulunan kişiler tarafından,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Aynı işyerinde çalışmanın sağladığı kolaylıktan faydalanmak suretiyle,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Posta veya elektronik haberleşme araçlarının sağladığı kolaylıktan faydalanmak suretiyle,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Teşhir suretiyle,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>işlenmesi hâlinde yukarıdaki fıkraya göre verilecek ceza yarı oranında artırılır. Bu fiil nedeniyle mağdur; işi bırakmak, okuldan veya ailesinden ayrılmak zorunda kalmış ise verilecek ceza bir yıldan az olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="7-YEDİNCİ" başlık="Hürriyete Karşı Suçlar">
        <mvz-madde no="106" başlık="Tehdit">
          <mvz-fıkra no="1">
            <template>Bir başkasını, kendisinin veya yakınının hayatına, vücut veya cinsel dokunulmazlığına yönelik bir saldırı gerçekleştireceğinden bahisle tehdit eden kişi, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.  Bu suçun kadına karşı işlenmesi hâlinde cezanın alt sınırı dokuz aydan az olamaz. Malvarlığı itibarıyla büyük bir zarara uğratacağından veya sair bir kötülük edeceğinden bahisle tehditte ise, mağdurun şikayeti üzerine, iki aydan altı aya kadar hapis veya adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tehdidin;</template>
            <mvz-bent no="a">
              <template>Silahla,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kişinin kendisini tanınmayacak bir hale koyması suretiyle, imzasız mektupla veya özel işaretlerle,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Birden fazla kişi tarafından birlikte,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Var olan veya var sayılan suç örgütlerinin oluşturdukları korkutucu güçten yararlanılarak,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İşlenmesi halinde, fail hakkında iki yıldan yedi yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tehdit amacıyla kasten öldürme, kasten yaralama veya malvarlığına zarar verme suçunun işlenmesi halinde, ayrıca bu suçlardan dolayı ceza verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="107" başlık="Şantaj">
          <mvz-fıkra no="1">
            <template>Hakkı olan veya yükümlü olduğu bir şeyi yapacağından veya yapmayacağından bahisle, bir kimseyi kanuna aykırı veya yükümlü olmadığı bir şeyi yapmaya veya yapmamaya ya da haksız çıkar sağlamaya zorlayan kişi, bir yıldan üç yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kendisine veya başkasına yarar sağlamak maksadıyla bir kişinin şeref veya saygınlığına zarar verecek nitelikteki hususların açıklanacağı veya isnat edileceği tehdidinde bulunulması halinde de birinci fıkraya göre cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="108" başlık="Cebir">
          <mvz-fıkra no="1">
            <template>Bir şeyi yapması veya yapmaması ya da kendisinin yapmasına müsaade etmesi için bir kişiye karşı cebir kullanılması halinde, kasten yaralama suçundan verilecek ceza üçte birinden yarısına kadar artırılarak hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="109" başlık="Kişiyi hürriyetinden yoksun kılma">
          <mvz-fıkra no="1">
            <template>Bir kimseyi hukuka aykırı olarak bir yere gitmek veya bir yerde kalmak hürriyetinden yoksun bırakan kişiye, bir yıldan beş yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kişi, fiili işlemek için veya işlediği sırada cebir, tehdit veya hile kullanırsa, iki yıldan yedi yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçun;</template>
            <mvz-bent no="a">
              <template>Silahla,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Birden fazla kişi tarafından birlikte,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kişinin yerine getirdiği kamu görevi nedeniyle,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kamu görevinin sağladığı nüfuz kötüye kullanılmak suretiyle,</template>

            <mvz-bent no="e">
              <template>Üstsoy, altsoy veya eşe ya da boşandığı eşe karşı,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Çocuğa ya da beden veya ruh bakımından kendini savunamayacak durumda bulunan kişiye karşı,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İşlenmesi halinde, yukarıdaki fıkralara göre verilecek ceza bir kat artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçun mağdurun ekonomik bakımdan önemli bir kaybına neden olması halinde, ayrıca bin güne kadar adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Suçun cinsel amaçla işlenmesi halinde, yukarıdaki fıkralara göre verilecek cezalar yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu suçun işlenmesi amacıyla veya sırasında kasten yaralama suçunun neticesi sebebiyle ağırlaşmış hallerinin gerçekleşmesi durumunda, ayrıca kasten yaralama suçuna ilişkin hükümler uygulanır.</template>

        <mvz-madde no="110" başlık="Etkin pişmanlık">

        <mvz-madde no="111" başlık="Tüzel kişiler hakkında güvenlik tedbiri uygulanması">

        <mvz-madde no="112" başlık="Eğitim ve öğretim hakkının engellenmesi">

            <mvz-bent no="a">
              <template>Devletçe kurulan veya kamu makamlarının verdiği izne dayalı olarak yürütülen her türlü eğitim ve öğretim faaliyetlerine,</template>

            <mvz-bent no="b">
              <template>Kişinin eğitim ve öğretim hakkını kullanmasına,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Öğrencilerin toplu olarak oturdukları binalara veya bunların eklentilerine girilmesine veya orada kalınmasına,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>engel olunması hâlinde, fail hakkında iki yıldan beş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="113" başlık="Kamu hizmetlerinden yararlanma hakkının engellenmesi">
          <mvz-fıkra no="1">
            <template>Cebir veya tehdit kullanılarak ya da hukuka aykırı başka bir davranışla;</template>
            <mvz-bent no="a">
              <template>Bir kamu faaliyetinin yürütülmesine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kamu kurumlarında veya kamu kurumu niteliğindeki meslek kuruluşlarında verilen ya da kamu makamlarının verdiği izne dayalı olarak sunulan hizmetlerden yararlanılmasına,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>engel olunması hâlinde, fail hakkında iki yıldan beş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun konusunun sağlık hizmeti olması hâlinde, verilecek ceza altıda biri oranına kadar artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="114" başlık="Siyasi hakların kullanılmasının engellenmesi">
          <mvz-fıkra no="1">
            <template>Bir kimseye karşı;</template>
            <mvz-bent no="a">
              <template>Bir siyasi partiye üye olmaya veya olmamaya, siyasi partinin faaliyetlerine katılmaya veya katılmamaya, siyasi partiden veya siyasi parti yönetimindeki görevinden ayrılmaya,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Seçim yoluyla gelinen bir kamu görevine aday olmamaya veya seçildiği görevden ayrılmaya,</template>

          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Zorlamak amacıyla, cebir veya tehdit kullanan kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cebir veya tehdit kullanılarak ya da hukuka aykırı başka bir davranışla bir siyasi partinin faaliyetlerinin engellenmesi halinde, iki yıldan beş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>

        <mvz-madde no="115" başlık="İnanç, düşünce ve kanaat hürriyetinin kullanılmasını engelleme">
          <mvz-fıkra no="1">
            <template>Cebir veya tehdit kullanarak, bir kimseyi dini, siyasi, sosyal, felsefi inanç, düşünce ve kanaatlerini açıklamaya veya değiştirmeye zorlayan ya da bunları açıklamaktan, yaymaktan meneden kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dini inancın gereğinin yerine getirilmesinin veya dini ibadet veya ayinlerin bireysel ya da toplu olarak yapılmasının, cebir veya tehdit kullanılarak ya da hukuka aykırı başka bir davranışla engellenmesi hâlinde, fail hakkında birinci fıkraya göre cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cebir veya tehdit kullanarak ya da hukuka aykırı başka bir davranışla bir kimsenin inanç, düşünce veya kanaatlerinden kaynaklanan yaşam tarzına ilişkin tercihlerine müdahale eden veya bunları değiştirmeye zorlayan kişiye birinci fıkra hükmüne göre ceza verilir.</template>

        <mvz-madde no="116" başlık="Konut dokunulmazlığının ihlali">

            <template>Bir kimsenin konutuna, konutunun eklentilerine rızasına aykırı olarak giren veya rıza ile girdikten sonra buradan çıkmayan kişi, mağdurun şikayeti üzerine, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra kapsamına giren fiillerin, açık bir rızaya gerek duyulmaksızın girilmesi mutat olan yerler dışında kalan işyerleri ve eklentileri hakkında işlenmesi hâlinde, mağdurun şikâyeti üzerine altı aydan bir yıla kadar hapis veya adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Evlilik birliğinde aile bireylerinden ya da konutun veya işyerinin birden fazla kişi tarafından ortak kullanılması durumunda, bu kişilerden birinin rızası varsa, yukarıdaki fıkralar hükümleri uygulanmaz. Ancak bunun için rıza açıklamasının meşru bir amaca yönelik olması gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Fiilin, cebir veya tehdit kullanılmak suretiyle ya da gece vakti işlenmesi halinde, bir yıldan üç yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="117" başlık="İş ve çalışma hürriyetinin ihlali">
          <mvz-fıkra no="1">
            <template>Cebir veya tehdit kullanarak ya da hukuka aykırı başka bir davranışla, iş ve çalışma hürriyetini ihlal eden kişiye, mağdurun şikayeti halinde, altı aydan iki yıla kadar hapis veya adlî para cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Çaresizliğini, kimsesizliğini ve bağlılığını sömürmek suretiyle kişi veya kişileri ücretsiz olarak veya sağladığı hizmet ile açık bir şekilde orantısız düşük bir ücretle çalıştıran veya bu durumda bulunan kişiyi, insan onuru ile bağdaşmayacak çalışma ve konaklama koşullarına tabi kılan kimseye altı aydan üç yıla kadar hapis veya yüz günden az olmamak üzere adlî para cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıdaki fıkrada belirtilen durumlara düşürmek üzere bir kimseyi tedarik veya sevk veya bir yerden diğer bir yere nakleden kişiye de aynı ceza verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">

          </mvz-fıkra>

        <mvz-madde no="118" başlık="Sendikal hakların kullanılmasının engellenmesi">

            <template>Bir kimseye karşı bir sendikaya üye olmaya veya olmamaya, sendikanın faaliyetlerine katılmaya veya katılmamaya, sendikadan veya sendika yönetimindeki görevinden ayrılmaya zorlamak amacıyla, cebir veya tehdit kullanan kişi, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>

          <mvz-fıkra no="2">

            </mvz-bent>
            <mvz-bent no="d">

          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçların işlenmesi sırasında kasten yaralama suçunun neticesi sebebiyle ağırlaşmış hallerinin gerçekleşmesi durumunda, ayrıca kasten yaralama suçuna ilişkin hükümler uygulanır.</template>

        <mvz-madde no="120" başlık="Haksız arama">

            <template>Hukuka aykırı olarak bir kimsenin üstünü veya eşyasını arayan kamu görevlisine üç aydan bir yıla kadar hapis cezası verilir.</template>

        <mvz-madde no="122" başlık="Nefret ve ayırımcılık">

        <mvz-madde no="123" başlık="Kişilerin huzur ve sükununu bozma">

            <template>Sırf huzur ve sükûnunu bozmak maksadıyla bir kimseye ısrarla; telefon edilmesi, gürültü yapılması ya da aynı maksatla hukuka aykırı başka bir davranışta bulunulması halinde, mağdurun şikayeti üzerine faile üç aydan bir yıla kadar hapis cezası verilir.</template>

        <mvz-madde no="123/A" başlık="Israrlı takip">

            <mvz-bent no="c">

        <mvz-madde no="124" başlık="Haberleşmenin engellenmesi">

      <mvz-bölüm no="8-SEKİZİNCİ" başlık="Şerefe Karşı Suçlar">

          <mvz-fıkra no="1">
            <template>Bir kimseye onur, şeref ve saygınlığını rencide edebilecek nitelikte somut bir fiil veya olgu isnat eden  veya sövmek suretiyle bir kimsenin onur, şeref ve saygınlığına saldıran kişi, üç aydan iki yıla kadar hapis veya adlî para cezası ile cezalandırılır. Mağdurun gıyabında hakaretin cezalandırılabilmesi için fiilin en az üç kişiyle ihtilat ederek işlenmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiilin, mağduru muhatap alan sesli, yazılı veya görüntülü bir iletiyle işlenmesi halinde, yukarıdaki fıkrada belirtilen cezaya hükmolunur.</template>

          <mvz-fıkra no="3">

            <mvz-bent no="a">

            <mvz-bent no="b">
              <template>Dini, siyasi, sosyal, felsefi inanç, düşünce ve kanaatlerini açıklamasından, değiştirmesinden, yaymaya çalışmasından, mensup olduğu dinin emir ve yasaklarına uygun davranmasından dolayı,</template>

            <mvz-bent no="c">

          <mvz-fıkra no="5">

        <mvz-madde no="126" başlık="Mağdurun belirlenmesi">

        </mvz-madde>
        <mvz-madde no="127" başlık="İsnadın ispatı">

          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İspat edilmiş fiilinden söz edilerek kişiye hakaret edilmesi halinde, cezaya hükmedilir.</template>

        <mvz-madde no="129" başlık="Haksız fiil nedeniyle veya karşılıklı hakaret">

          </mvz-fıkra>
          <mvz-fıkra no="2">

          <mvz-fıkra no="3">

        <mvz-madde no="130" başlık="Kişinin hatırasına hakaret">

          <mvz-fıkra no="2">

          </mvz-fıkra>

        <mvz-madde no="131" başlık="Soruşturma ve kovuşturma koşulu">

          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mağdur, şikayet etmeden önce ölürse, veya suç ölmüş olan kişinin hatırasına karşı işlenmiş ise; ölenin ikinci dereceye kadar üstsoy ve altsoyu, eş veya kardeşleri tarafından şikayette bulunulabilir.</template>
          </mvz-fıkra>
