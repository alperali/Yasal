      <mvz-bölüm no="8-SEKİZİNCİ" başlık="Aile Düzenine Karşı Suçlar">
        <mvz-madde no="230" başlık="Birden çok evlilik, hileli evlenme, dinsel tören">
          <mvz-fıkra no="1">
            <template>Evli olmasına rağmen, başkasıyla evlenme işlemi yaptıran kişi, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kendisi evli olmamakla birlikte, evli olduğunu bildiği bir kimse ile evlilik işlemi yaptıran kişi de yukarıdaki fıkra hükmüne göre cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Gerçek kimliğini saklamak suretiyle bir başkasıyla evlenme işlemi yaptıran kişi, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yukarıdaki fıkralarda tanımlanan suçlardan dolayı zamanaşımı, evlenmenin iptali kararının kesinleştiği tarihten itibaren işlemeye başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5" durum="iptal">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="6" durum="iptal">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="231" başlık="Çocuğun soybağını değiştirme">
          <mvz-fıkra no="1">
            <template>Bir çocuğun soybağını değiştiren veya gizleyen kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Özen yükümlülüğüne aykırı davranarak, sağlık kurumundaki bir çocuğun başka bir çocukla karışmasına neden olan kişi, bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="232" başlık="Kötü muamele">
          <mvz-fıkra no="1">
            <template>Aynı konutta birlikte yaşadığı kişilerden birine karşı kötü muamelede bulunan kimse, iki aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İdaresi altında bulunan veya büyütmek, okutmak, bakmak, muhafaza etmek veya bir meslek veya sanat öğretmekle yükümlü olduğu kişi üzerinde, sahibi bulunduğu terbiye hakkından doğan disiplin yetkisini kötüye kullanan kişiye, bir yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="233" başlık="Aile hukukundan kaynaklanan yükümlülüğün ihlali">
          <mvz-fıkra no="1">
            <template>Aile hukukundan doğan bakım, eğitim veya destek olma yükümlülüğünü yerine getirmeyen kişi, şikayet üzerine, üç aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hamile olduğunu bildiği eşini veya sürekli birlikte yaşadığı ve kendisinden gebe kalmış bulunduğunu bildiği evli olmayan bir kadını çaresiz durumda terk eden kimseye, altı aydan iki yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Velayet hakları kaldırılmış olsa da, itiyadi sarhoşluk, uyuşturucu veya uyarıcı maddelerin kullanılması ya da onur kırıcı tavır ve hareketlerin sonucu maddi ve manevi özen noksanlığı nedeniyle çocuklarının ahlak, güvenlik ve sağlığını ağır şekilde tehlikeye sokan ana veya baba, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birinci ve üçüncü fıkralarda tanımlanan fiiller nedeniyle çocuğun kasten öldürme (madde 81, 82) ve neticesi sebebiyle ağırlaşmış yaralama (madde 87, fıkra 2 ve 4) suçunu işlemesi halinde şikayet aranmaksızın, faile bu madde uyarınca verilecek ceza yarısından iki katına kadar artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="234" başlık="Çocuğun kaçırılması ve alıkonulması">
          <mvz-fıkra no="1">
            <template>Velayet yetkisi elinden alınmış olan ana veya babanın ya da üçüncü derece dahil kan hısmının, onaltı yaşını bitirmemiş bir çocuğu veli, vasi veya bakım ve gözetimi altında bulunan kimsenin yanından cebir veya tehdit kullanmaksızın kaçırması veya alıkoyması halinde, üç aydan bir yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiil cebir veya tehdit kullanılarak işlenmiş ya da çocuk henüz oniki yaşını bitirmemiş ise ceza bir katı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kanunî temsilcisinin bilgisi veya rızası dışında evi terk eden çocuğu, rızasıyla da olsa, ailesini veya yetkili makamları durumdan haberdar etmeksizin yanında tutan kişi, şikâyet üzerine, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="9-DOKUZUNCU" başlık="Ekonomi, Sanayi ve Ticarete İlişkin Suçlar">
        <mvz-madde no="235" başlık="İhaleye fesat karıştırma">
          <mvz-fıkra no="1">
            <template>Kamu kurumu veya kuruluşları adına yapılan mal veya hizmet alım veya satımlarına ya da kiralamalara ilişkin ihaleler ile yapım ihalelerine fesat karıştıran kişi, üç yıldan yedi yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aşağıdaki hallerde ihaleye fesat karıştırılmış sayılır:</template>
            <mvz-bent no="a">
              <template>Hileli davranışlarla;</template>
              <mvz-altbent no="1">
                <template>İhaleye katılma yeterliğine veya koşullarına sahip olan kişilerin ihaleye veya ihale sürecindeki işlemlere katılmalarını engellemek,</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>İhaleye katılma yeterliğine veya koşullarına sahip olmayan kişilerin ihaleye katılmasını sağlamak,</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Teklif edilen malları, şartnamesinde belirtilen niteliklere sahip olduğu halde, sahip olmadığından bahisle değerlendirme dışı bırakmak,</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Teklif edilen malları, şartnamesinde belirtilen niteliklere sahip olmadığı halde, sahip olduğundan bahisle değerlendirmeye almak.</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Tekliflerle ilgili olup da ihale mevzuatına veya şartnamelere göre gizli tutulması gereken bilgilere başkalarının ulaşmasını sağlamak.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Cebir veya tehdit kullanmak suretiyle ya da hukuka aykırı diğer davranışlarla, ihaleye katılma yeterliğine veya koşullarına sahip olan kişilerin ihaleye, ihale sürecindeki işlemlere katılmalarını engellemek.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>İhaleye katılmak isteyen veya katılan kişilerin ihale şartlarını ve özellikle fiyatı etkilemek için aralarında açık veya gizli anlaşma yapmaları.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İhaleye fesat karıştırma suçunun;</template>
            <mvz-bent no="a">
              <template>Cebir veya tehdit kullanmak suretiyle işlenmesi hâlinde temel cezanın alt sınırı beş yıldan az olamaz. Ancak, kasten yaralama veya tehdit suçunun daha ağır cezayı gerektiren nitelikli hâllerinin gerçekleşmesi durumunda, ayrıca bu suçlar dolayısıyla cezaya hükmolunur.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>İşlenmesi sonucunda ilgili kamu kurumu veya kuruluşu açısından bir zarar meydana gelmemiş ise, bu fıkranın (a) bendinde belirtilen hâller hariç olmak üzere, fail hakkında bir yıldan üç yıla kadar hapis cezasına hükmolunur.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İhaleye fesat karıştırma dolayısıyla menfaat temin eden görevli kişiler, ayrıca bu nedenle ilgili suç hükmüne göre cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yukarıdaki fıkralar hükümleri, kamu kurum veya kuruluşları aracılığı ile yapılan artırma veya eksiltmeler ile kamu kurumu niteliğindeki meslek kuruluşları, kamu kurum veya kuruluşlarının ya da kamu kurumu niteliğindeki meslek kuruluşlarının iştirakiyle kurulmuş şirketler, bunların bünyesinde faaliyet icra eden vakıflar, kamu yararına çalışan dernekler veya kooperatifler adına yapılan mal veya hizmet alım veya satımlarına ya da kiralamalara fesat karıştırılması halinde de uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="236" başlık="Edimin ifasına fesat karıştırma">
          <mvz-fıkra no="1">
            <template>Kamu kurum veya kuruluşları, kamu kurumu niteliğindeki meslek kuruluşları, bunların iştirakiyle kurulmuş şirketler, bunların bünyesinde faaliyet icra eden vakıflar, kamu yararına çalışan dernekler ya da kooperatiflere karşı taahhüt altına girilen edimin ifasına fesat karıştıran kişi, üç yıldan yedi yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aşağıdaki fiillerin hileli olarak yapılması halinde, edimin ifasına fesat karıştırılmış sayılır:</template>
            <mvz-bent no="a">
              <template>İhale kararında veya sözleşmede evsafı belirtilen maldan başka bir malın teslim veya kabul edilmesi.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>İhale kararında veya sözleşmede belirtilen miktardan eksik malın teslim veya kabul edilmesi.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Edimin ihale kararında veya sözleşmede belirtilen sürede ifa edilmemesine rağmen, süresinde ifa edilmiş gibi kabul edilmesi.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Yapım ihalelerinde eserin veya kullanılan malzemenin şartname veya sözleşmesinde belirlenen şartlara, miktar veya niteliklere uygun olmamasına rağmen kabul edilmesi.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Hizmet niteliğindeki edimin, ihale kararında veya sözleşmede belirtilen şartlara göre verilmemesine veya eksik verilmesine rağmen verilmiş gibi kabul edilmesi.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Edimin ifasına fesat karıştırma dolayısıyla menfaat temin eden görevli kişiler, ayrıca bu nedenle ilgili suç hükmüne göre cezalandırılırlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="237" başlık="Fiyatları etkileme">
          <mvz-fıkra no="1">
            <template>İşçi ücretlerinin veya besin veya malların değerlerinin artıp eksilmesi sonucunu doğurabilecek bir şekilde ve bu maksatla yalan haber veya havadis yayan veya sair hileli yollara başvuran kimseye bir yıldan üç yıla kadar hapis ve adlî para cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiil sonucu besin veya malların değerleri veya işçi ücretleri artıp eksildiği takdirde ceza yarısı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Fail, ruhsatlı simsar veya borsa tellalı ise ceza ayrıca yarısı oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="238" başlık="Kamuya gerekli şeylerin yokluğuna neden olma">
          <mvz-fıkra no="1">
            <template>Taahhüt ettiği işi yerine getirmeyerek, kamu kurum ve kuruluşları veya kamu hizmeti veya genel bir felaketin önlenmesi için zorunlu eşya veya besinlerin ortadan kalkmasına veya önemli ölçüde azalmasına neden olan kimseye bir yıldan üç yıla kadar hapis ve bin güne kadar adlî para cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="239" başlık="Ticarî sır, bankacılık sırrı veya müşteri sırrı niteliğindeki bilgi veya belgelerin açıklanması">
          <mvz-fıkra no="1">
            <template>Sıfat veya görevi, meslek veya sanatı gereği vakıf olduğu ticari sır, bankacılık sırrı veya müşteri sırrı niteliğindeki bilgi veya belgeleri yetkisiz kişilere veren veya ifşa eden kişi, şikayet üzerine, bir yıldan üç yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır. Bu bilgi veya belgelerin, hukuka aykırı yolla elde eden kişiler tarafından yetkisiz kişilere verilmesi veya ifşa edilmesi halinde de bu fıkraya göre cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra hükümleri, fenni keşif ve buluşları veya sınai uygulamaya ilişkin bilgiler hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu sırlar, Türkiye'de oturmayan bir yabancıya veya onun memurlarına açıklandığı takdirde, faile verilecek ceza üçte biri oranında artırılır. Bu halde şikayet koşulu aranmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Cebir veya tehdit kullanarak bir kimseyi bu madde kapsamına giren bilgi veya belgeleri açıklamaya mecbur kılan kişi, üç yıldan yedi yıla kadar hapis cezasıyla cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="240" başlık="Mal veya hizmet satımından kaçınma">
          <mvz-fıkra no="1">
            <template>Belli bir mal veya hizmeti satmaktan kaçınarak kamu için acil bir ihtiyacın ortaya çıkmasına neden olan kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="241" başlık="Tefecilik">
          <mvz-fıkra no="1">
            <template>Kazanç elde etmek amacıyla başkasına ödünç para veren kişi, iki yıldan altı yıla kadar hapis ve beşyüz günden beşbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun bir örgütün faaliyeti çerçevesinde işlenmesi hâlinde verilecek ceza bir kat artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="242" başlık="Tüzel kişiler hakkında güvenlik tedbiri uygulanması">
          <mvz-fıkra no="1">
            <template>Bu bölümde yer alan suçların işlenmesi suretiyle yararına haksız menfaat sağlanan tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="10-ONUNCU" başlık="Bilişim Alanında Suçlar">
        <mvz-madde no="243" başlık="Bilişim sistemine girme">
          <mvz-fıkra no="1">
            <template>Bir bilişim sisteminin bütününe veya bir kısmına, hukuka aykırı olarak giren veya orada kalmaya devam eden kimseye bir yıla kadar hapis veya adlî para cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıdaki fıkrada tanımlanan fiillerin bedeli karşılığı yararlanılabilen sistemler hakkında işlenmesi halinde, verilecek ceza yarı oranına kadar indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu fiil nedeniyle sistemin içerdiği veriler yok olur veya değişirse, altı aydan iki yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bir bilişim sisteminin kendi içinde veya bilişim sistemleri arasında gerçekleşen veri nakillerini, sisteme girmeksizin teknik araçlarla hukuka aykırı olarak izleyen kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="244" başlık="Sistemi engelleme, bozma, verileri yok etme veya değiştirme">
          <mvz-fıkra no="1">
            <template>Bir bilişim sisteminin işleyişini engelleyen veya bozan kişi, bir yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir bilişim sistemindeki verileri bozan, yok eden, değiştiren veya erişilmez kılan, sisteme veri yerleştiren, var olan verileri başka bir yere gönderen kişi, altı aydan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu fiillerin bir banka veya kredi kurumuna ya da bir kamu kurum veya kuruluşuna ait bilişim sistemi üzerinde işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yukarıdaki fıkralarda tanımlanan fiillerin işlenmesi suretiyle kişinin kendisinin veya başkasının yararına haksız bir çıkar sağlamasının başka bir suç oluşturmaması halinde, iki yıldan altı yıla kadar hapis ve beşbin güne kadar adlî para cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="245" başlık="Banka veya kredi kartlarının kötüye kullanılması">
          <mvz-fıkra no="1">
            <template>Başkasına ait bir banka veya kredi kartını, her ne suretle olursa olsun ele geçiren veya elinde bulunduran kimse, kart sahibinin veya kartın kendisine verilmesi gereken kişinin rızası olmaksızın bunu kullanarak veya kullandırtarak kendisine veya başkasına yarar sağlarsa, üç yıldan altı yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Başkalarına ait banka hesaplarıyla ilişkilendirilerek sahte banka veya kredi kartı üreten, satan, devreden, satın alan veya kabul eden kişi üç yıldan yedi yıla kadar hapis ve onbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sahte oluşturulan veya üzerinde sahtecilik yapılan bir banka veya kredi kartını kullanmak suretiyle kendisine veya başkasına yarar sağlayan kişi, fiil daha ağır cezayı gerektiren başka bir suç oluşturmadığı takdirde, dört yıldan sekiz yıla kadar hapis ve beşbin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birinci fıkrada yer alan suçun;</template>
            <mvz-bent no="a">
              <template>Haklarında ayrılık kararı verilmemiş eşlerden birinin,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Üstsoy veya altsoyunun veya bu derecede kayın hısımlarından birinin veya evlat edinen veya evlâtlığın,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Aynı konutta beraber yaşayan kardeşlerden birinin,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>zararına olarak işlenmesi hâlinde, ilgili akraba hakkında cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Birinci fıkra kapsamına giren fiillerle ilgili olarak bu Kanunun malvarlığına karşı suçlara ilişkin etkin pişmanlık hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="245/A" başlık="Yasak cihaz veya programlar">
          <mvz-fıkra no="1">
            <template>Bir cihazın, bilgisayar programının, şifrenin veya sair güvenlik kodunun; münhasıran bu Bölümde yer alan suçlar ile bilişim sistemlerinin araç olarak kullanılması suretiyle işlenebilen diğer suçların işlenmesi için yapılması veya oluşturulması durumunda, bunları imal eden, ithal eden, sevk eden, nakleden, depolayan, kabul eden, satan, satışa arz eden, satın alan, başkalarına veren veya bulunduran kişi, bir yıldan üç yıla kadar hapis ve beşbin güne kadar adli para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="246" başlık="Tüzel kişiler hakkında güvenlik tedbiri uygulanması">
          <mvz-fıkra no="1">
            <template>Bu bölümde yer alan suçların işlenmesi suretiyle yararına haksız menfaat sağlanan tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="4-DÖRDÜNCÜ" başlık="Millete ve Devlete Karşı Suçlar ve Son Hükümler">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Kamu İdaresinin Güvenilirliğine ve İşleyişine Karşı Suçlar">
        <mvz-madde no="247" başlık="Zimmet">
          <mvz-fıkra no="1">
            <template>Görevi nedeniyle zilyedliği kendisine devredilmiş olan veya koruma ve gözetimiyle yükümlü olduğu malı kendisinin veya başkasının zimmetine geçiren kamu görevlisi, beş yıldan oniki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun, zimmetin açığa çıkmamasını sağlamaya yönelik hileli davranışlarla işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Zimmet suçunun, malın geçici bir süre kullanıldıktan sonra iade edilmek üzere işlenmesi halinde, verilecek ceza yarı oranına kadar indirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="248" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>Soruşturma başlamadan önce, zimmete geçirilen malın aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi halinde, verilecek cezanın üçte ikisi indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kovuşturma başlamadan önce, gönüllü olarak, zimmete geçirilen malın aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi halinde, verilecek cezanın yarısı indirilir. Etkin pişmanlığın hükümden önce gerçekleşmesi halinde, verilecek cezanın üçte biri indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="249" başlık="Daha az cezayı gerektiren hal">
          <mvz-fıkra no="1">
            <template>Zimmet suçunun konusunu oluşturan malın değerinin azlığı nedeniyle, verilecek ceza üçte birden yarıya kadar indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="250" başlık="İrtikap">
          <mvz-fıkra no="1">
            <template>Görevinin sağladığı nüfuzu kötüye kullanmak suretiyle kendisine veya başkasına yarar sağlanmasına veya bu yolda vaatte bulunulmasına bir kimseyi icbar eden kamu görevlisi, beş yıldan on yıla kadar hapis cezası ile cezalandırılır. Kamu görevlisinin haksız tutum ve davranışları karşısında, kişinin haklı bir işinin gereği gibi, hiç veya en azından vaktinde görülmeyeceği endişesiyle, kendisini mecbur hissederek, kamu görevlisine veya yönlendireceği kişiye menfaat temin etmiş olması halinde, icbarın varlığı kabul edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Görevinin sağladığı güveni kötüye kullanmak suretiyle gerçekleştirdiği hileli davranışlarla, kendisine veya başkasına yarar sağlanmasına veya bu yolda vaatte bulunulmasına bir kimseyi ikna eden kamu görevlisi, üç yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İkinci fıkrada tanımlanan suçun kişinin hatasından yararlanarak işlenmiş olması halinde, bir yıldan üç yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İrtikap edilen menfaatin değeri ve mağdurun ekonomik durumu göz önünde bulundurularak, yukarıdaki fıkralara göre verilecek ceza yarısına kadar indirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="251" başlık="Denetim görevinin ihmali">
          <mvz-fıkra no="1">
            <template>Zimmet veya irtikap suçunun işlenmesine kasten göz yuman denetimle yükümlü kamu görevlisi, işlenen suçun müşterek faili olarak sorumlu tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Denetim görevini ihmal ederek, zimmet veya irtikap suçunun işlenmesine imkan sağlayan kamu görevlisi, üç aydan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="252" başlık="Rüşvet">
          <mvz-fıkra no="1">
            <template>Görevinin ifasıyla ilgili bir işi yapması veya yapmaması için, doğrudan veya aracılar vasıtasıyla, bir kamu görevlisine veya göstereceği bir başka kişiye menfaat sağlayan kişi, dört yıldan oniki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Görevinin ifasıyla ilgili bir işi yapması veya yapmaması için, doğrudan veya aracılar vasıtasıyla, kendisine veya göstereceği bir başka kişiye menfaat sağlayan kamu görevlisi de birinci fıkrada belirtilen ceza ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Rüşvet konusunda anlaşmaya varılması halinde, suç tamamlanmış gibi cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kamu görevlisinin rüşvet talebinde bulunması ve fakat bunun kişi tarafından kabul edilmemesi ya da kişinin kamu görevlisine menfaat temini konusunda teklif veya vaatte bulunması ve fakat bunun kamu görevlisi tarafından kabul edilmemesi hâllerinde fail hakkında, birinci ve ikinci fıkra hükümlerine göre verilecek ceza yarı oranında indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Rüşvet teklif veya talebinin karşı tarafa iletilmesi, rüşvet anlaşmasının sağlanması veya rüşvetin temini hususlarında aracılık eden kişi, kamu görevlisi sıfatını taşıyıp taşımadığına bakılmaksızın, müşterek fail olarak cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Rüşvet ilişkisinde dolaylı olarak kendisine menfaat sağlanan üçüncü kişi veya tüzel kişinin menfaati kabul eden yetkilisi, kamu görevlisi sıfatını taşıyıp taşımadığına bakılmaksızın, müşterek fail olarak cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Rüşvet alan veya talebinde bulunan ya da bu konuda anlaşmaya varan kişinin; yargı görevi yapan, hakem, bilirkişi, noter veya yeminli mali müşavir olması halinde, verilecek ceza üçte birden yarısına kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Bu madde hükümleri;</template>
            <mvz-bent no="a">
              <template>Kamu kurumu niteliğindeki meslek kuruluşları,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Kamu kurum veya kuruluşlarının ya da kamu kurumu niteliğindeki meslek kuruluşlarının iştirakiyle kurulmuş şirketler,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kamu kurum veya kuruluşlarının ya da kamu kurumu niteliğindeki meslek kuruluşlarının bünyesinde faaliyet icra eden vakıflar,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kamu yararına çalışan dernekler,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Kooperatifler,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Halka açık anonim şirketler,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>adına hareket eden kişilere, kamu görevlisi sıfatını taşıyıp taşımadıklarına bakılmaksızın, görevlerinin ifasıyla ilgili bir işin yapılması veya yapılmaması amacıyla doğrudan veya aracılar vasıtasıyla, menfaat temin, teklif veya vaat edilmesi; bu kişiler tarafından talep veya kabul edilmesi; bunlara aracılık edilmesi; bu ilişki dolayısıyla bir başkasına menfaat temin edilmesi halinde de uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Bu madde hükümleri;</template>
            <mvz-bent no="a">
              <template>Yabancı bir devlette seçilmiş veya atanmış olan kamu görevlilerine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Uluslararası veya uluslarüstü mahkemelerde ya da yabancı devlet mahkemelerinde görev yapan hâkimlere, jüri üyelerine veya diğer görevlilere,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Uluslararası veya uluslarüstü parlamento üyelerine,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kamu kurumu ya da kamu işletmeleri de dahil olmak üzere, yabancı bir ülke için kamusal bir faaliyet yürüten kişilere,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Bir hukuki uyuşmazlığın çözümü amacıyla başvurulan tahkim usulü çerçevesinde görevlendirilen vatandaş veya yabancı hakemlere,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Uluslararası bir anlaşmaya dayalı olarak kurulan uluslararası veya uluslarüstüörgütlerin görevlilerine veya temsilcilerine,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>görevlerinin ifasıyla ilgili bir işin yapılması veya yapılmaması ya da uluslararası ticari işlemler nedeniyle bir işin veya haksız bir yararın elde edilmesi yahut muhafazası amacıyla; doğrudan veya aracılar vasıtasıyla, menfaat temin, teklif veya vaat edilmesi ya da bunlar tarafından talep veya kabul edilmesi halinde de uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Dokuzuncu fıkra kapsamına giren rüşvet suçunun yurt dışında yabancı tarafından işlenmekle birlikte;</template>
            <mvz-bent no="a">
              <template>Türkiye’nin,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Türkiye’deki bir kamu kurumunun,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Türk kanunlarına göre kurulmuş bir özel hukuk tüzel kişisinin,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Türk vatandaşının,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>tarafı olduğu bir uyuşmazlık ya da bu kurum veya kişilerle ilgili bir işlemin yapılması veya yapılmaması için işlenmesi halinde, rüşvet veren, teklif veya vaat eden; rüşvet alan, talep eden, teklif veya vaadini kabul eden; bunlara aracılık eden; rüşvet ilişkisi dolayısıyla kendisine menfaat temin edilen kişiler hakkında, Türkiye’de bulundukları takdirde, resen soruşturma ve kovuşturma yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="253" başlık="Tüzel kişiler hakkında güvenlik tedbiri uygulanması">
          <mvz-fıkra no="1">
            <template>Rüşvet suçunun işlenmesi suretiyle yararına haksız menfaat sağlanan tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="254" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>Rüşvet alan kişinin, durum resmi makamlarca öğrenilmeden önce, rüşvet konusu şeyi soruşturmaya yetkili makamlara aynen teslim etmesi halinde, hakkında rüşvet suçundan dolayı cezaya hükmolunmaz. Rüşvet alma konusunda başkasıyla anlaşan kamu görevlisinin durum resmi makamlarca öğrenilmeden önce durumu yetkili makamlara haber vermesi halinde de hakkında bu suçtan dolayı cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Rüşvet veren veya bu konuda kamu görevlisiyle anlaşmaya varan kişinin, durum resmi makamlarca öğrenilmeden önce, pişmanlık duyarak durumdan yetkili makamları haberdar etmesi halinde, hakkında rüşvet suçundan dolayı cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Rüşvet suçuna iştirak eden diğer kişilerin, durum resmi makamlarca öğrenilmeden önce, pişmanlık duyarak durumdan yetkili makamları haberdar etmesi halinde, hakkında bu suçtan dolayı cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu madde hükümleri, yabancı kamu görevlilerine rüşvet veren kişilere uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="255" başlık="Nüfuz ticareti">
          <mvz-fıkra no="1">
            <template>Kamu görevlisi üzerinde nüfuz sahibi olduğundan bahisle, haksız bir işin gördürülmesi amacıyla girişimde bulunması için, doğrudan veya aracılar vasıtasıyla, kendisine veya bir başkasına menfaat temin eden kişi, iki yıldan beş yıla kadar hapis ve beşbin güne kadar adli para cezası ile cezalandırılır. Kişinin kamu görevlisi olması halinde, verilecek hapis cezası yarı oranında artırılır. İşinin gördürülmesi karşılığında veya gördürüleceği beklentisiyle menfaat sağlayan kişi ise, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Menfaat temini konusunda anlaşmaya varılması halinde dahi, suç tamamlanmış gibi cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci fıkrada belirtilen amaç doğrultusunda menfaat talebinde bulunulması ve fakat bunun kabul edilmemesi ya da menfaat teklif veya vaadinde bulunulması ve fakat bunun kabul edilmemesi hallerinde, birinci fıkra hükmüne göre verilecek ceza yarı oranında indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Nüfuz ticareti suçuna aracılık eden kişi, müşterek fail olarak, birinci fıkrada belirtilen ceza ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Nüfuz ticareti ilişkisinde dolaylı olarak kendisine menfaat sağlanan üçüncü gerçek kişi veya tüzel kişinin menfaati kabul eden yetkilileri, müşterek fail olarak, birinci fıkrada belirtilen ceza ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>İşin gördürülmesi amacıyla girişimde bulunmanın müstakil bir suç oluşturduğu hallerde kişiler ayrıca bu suç nedeniyle cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu madde hükümleri, 252 nci maddenin dokuzuncu fıkrasında sayılan kişiler üzerinde nüfuz ticareti yapılması halinde de uygulanır. Bu kişiler hakkında, Türkiye’de bulunmaları halinde, vatandaş veya yabancı olduklarına bakılmaksızın, resen soruşturma ve kovuşturma yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="256" başlık="Zor kullanma yetkisine ilişkin sınırın aşılması">
          <mvz-fıkra no="1">
            <template>Zor kullanma yetkisine sahip kamu görevlisinin, görevini yaptığı sırada, kişilere karşı görevinin gerektirdiği ölçünün dışında kuvvet kullanması halinde, kasten yaralama suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="257" başlık="Görevi kötüye kullanma">
          <mvz-fıkra no="1">
            <template>Kanunda ayrıca suç olarak tanımlanan haller dışında, görevinin gereklerine aykırı hareket etmek suretiyle, kişilerin mağduriyetine veya kamunun zararına neden olan ya da kişilere haksız bir menfaat sağlayan kamu görevlisi, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kanunda ayrıca suç olarak tanımlanan haller dışında, görevinin gereklerini yapmakta ihmal veya gecikme göstererek, kişilerin mağduriyetine veya kamunun zararına neden olan ya da kişilere haksız bir menfaat sağlayan kamu görevlisi, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="258" başlık="Göreve ilişkin sırrın açıklanması">
          <mvz-fıkra no="1">
            <template>Görevi nedeniyle kendisine verilen veya aynı nedenle bilgi edindiği ve gizli kalması gereken belgeleri, kararları ve emirleri ve diğer tebligatı açıklayan veya yayınlayan veya ne suretle olursa olsun başkalarının bilgi edinmesini kolaylaştıran kamu görevlisine, bir yıldan dört yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kamu görevlisi sıfatı sona erdikten sonra, birinci fıkrada yazılı fiilleri işleyen kimseye de aynı ceza verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="259" başlık="Kamu görevlisinin ticareti">
          <mvz-fıkra no="1">
            <template>Yürüttüğü görevin sağladığı nüfuzdan yararlanarak, bir başkasına mal veya hizmet satmaya çalışan kamu görevlisi, altı aya kadar hapis veya adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="260" başlık="Kamu görevinin terki veya yapılmaması">
          <mvz-fıkra no="1">
            <template>Hukuka aykırı olarak ve toplu biçimde, görevlerini terk eden, görevlerine gelmeyen, görevlerini geçici de olsa kısmen veya tamamen yapmayan veya yavaşlatan kamu görevlilerinin her biri hakkında üç aydan bir yıla kadar hapis cezası verilir. Kamu görevlisi sayısının üçten fazla olmaması halinde cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kamu görevlilerinin mesleki ve sosyal hakları ile ilgili olarak, hizmeti aksatmayacak biçimde, geçici ve kısa süreli iş bırakmaları veya yavaşlatmaları halinde, verilecek cezada indirim yapılabileceği gibi, ceza da verilmeyebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="261" başlık="Kişilerin malları üzerinde usulsüz tasarruf">
          <mvz-fıkra no="1">
            <template>İlgili kanunlarda belirlenen koşullara aykırı olduğunu bilerek, kişilerin taşınır veya taşınmaz malları üzerinde, karşılık ödenmek suretiyle de olsa, zorla tasarrufta bulunan kamu görevlisi, fiil daha ağır cezayı gerektiren bir suç oluşturmadığı takdirde, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="262" başlık="Kamu görevinin usulsüz olarak üstlenilmesi">
          <mvz-fıkra no="1">
            <template>Bir kamu görevini, kanun ve nizamlara aykırı olarak yerine getirmeye teşebbüs eden veya terk emri kendisine bildirilmiş olduğu halde görevi sürdüren kimseye üç aydan iki yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="263" başlık="Kanuna aykırı eğitim kurumu" durum="mülga">
        </mvz-madde>
        <mvz-madde no="264" başlık="Özel işaret ve kıyafetleri usulsüz kullanma">
          <mvz-fıkra no="1">
            <template>Bir rütbe veya kamu görevinin veya mesleğin, resmi elbisesini yetkisi olmaksızın alenen ve başkalarını yanıltacak şekilde giyen veya hakkı olmayan nişan veya madalyaları takan kimseye üç aydan bir yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Elbisenin sağlayacağı kolaylık ve olanaklardan yararlanarak bir suç işlenirse, yalnız bu fiilden ötürü yukarıdaki fıkrada belirtilen cezalar üçte biri oranında artırılarak hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="265" başlık="Görevi yaptırmamak için direnme">
          <mvz-fıkra no="1">
            <template>Kamu görevlisine karşı görevini yapmasını engellemek amacıyla, cebir veya tehdit kullanan kişi, altı aydan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun yargı görevi yapan kişilere karşı işlenmesi halinde, iki yıldan dört yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suçun, kişinin kendisini tanınmayacak bir hale koyması suretiyle veya birden fazla kişi tarafından birlikte işlenmesi halinde, verilecek ceza üçte biri oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Suçun, silahla ya da var olan veya var sayılan suç örgütlerinin oluşturdukları korkutucu güçten yararlanılarak işlenmesi halinde, yukarıdaki fıkralara göre verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu suçun işlenmesi sırasında kasten yaralama suçunun neticesi sebebiyle ağırlaşmış hallerinin gerçekleşmesi durumunda, ayrıca kasten yaralama suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="266" başlık="Kamu görevine ait araç ve gereçleri suçta kullanma">
          <mvz-fıkra no="1">
            <template>Görevi gereği olarak elinde bulundurduğu araç ve gereçleri bir suçun işlenmesi sırasında kullanan kamu görevlisi hakkında, ilgili suçun tanımında kamu görevlisi sıfatı esasen göz önünde bulundurulmamış ise, verilecek ceza üçte biri oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Adliyeye Karşı Suçlar">
        <mvz-madde no="267" başlık="İftira">
          <mvz-fıkra no="1">
            <template>Yetkili makamlara ihbar veya şikayette bulunarak ya da basın ve yayın yoluyla, işlemediğini bildiği halde, hakkında soruşturma ve kovuşturma başlatılmasını ya da idari bir yaptırım uygulanmasını sağlamak için bir kimseye hukuka aykırı bir fiil isnat eden kişi, bir yıldan dört yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiilin maddî eser ve delillerini uydurarak iftirada bulunulması halinde, ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yüklenen fiili işlemediğinden dolayı hakkında beraat kararı veya kovuşturmaya yer olmadığına dair karar verilmiş mağdurun aleyhine olarak bu fiil nedeniyle gözaltına alma ve tutuklama dışında başka bir koruma tedbiri uygulanmışsa, yukarıdaki fıkralara göre verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yüklenen fiili işlemediğinden dolayı hakkında beraat kararı veya kovuşturmaya yer olmadığına dair karar verilmiş olan mağdurun bu fiil nedeniyle gözaltına alınması veya tutuklanması halinde; iftira eden, ayrıca kişiyi hürriyetinden yoksun kılma suçuna ilişkin hükümlere göre dolaylı fail olarak sorumlu tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Mağdurun ağırlaştırılmış müebbet hapis veya müebbet hapis cezasına mahkûmiyeti halinde, yirmi yıldan otuz yıla kadar hapis cezasına;  hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Mağdurun mahkûm olduğu hapis cezasının infazına başlanmış ise, beşinci fıkraya göre verilecek ceza yarısı kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7" durum="iptal">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>İftira suçundan dolayı dava zamanaşımı, mağdurun fiili işlemediğinin sabit olduğu tarihten başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Basın ve yayın yoluyla işlenen iftira suçundan dolayı verilen mahkûmiyet kararı, aynı veya eşdeğerde basın ve yayın organıyla ilan olunur. İlan masrafı, hükümlüden tahsil edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="268" başlık="Başkasına ait kimlik veya kimlik bilgilerinin kullanılması">
          <mvz-fıkra no="1">
            <template>İşlediği suç nedeniyle kendisi hakkında soruşturma ve kovuşturma yapılmasını engellemek amacıyla, başkasına ait kimliği veya kimlik bilgilerini kullanan kimse, iftira suçuna ilişkin hükümlere göre cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="269" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>İftira edenin, mağdur hakkında adlî veya idari soruşturma başlamadan önce, iftirasından dönmesi halinde, hakkında iftira suçundan dolayı verilecek cezanın beşte dördü indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mağdur hakkında kovuşturma başlamadan önce iftiradan dönme halinde, iftira suçundan dolayı verilecek cezanın dörtte üçü indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Etkin pişmanlığın;</template>
            <mvz-bent no="a">
              <template>Mağdur hakkında hükümden önce gerçekleşmesi halinde, verilecek cezanın üçte ikisi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Mağdurun mahkûmiyetinden sonra gerçekleşmesi halinde, verilecek cezanın yarısı,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Hükmolunan cezanın infazına başlanması halinde, verilecek cezanın üçte biri,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İndirilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İftiranın konusunu oluşturan münhasıran idari yaptırım uygulanmasını gerektiren fiil dolayısıyla;</template>
            <mvz-bent no="a">
              <template>İdari yaptırıma karar verilmeden önce etkin pişmanlıkta bulunulması halinde, verilecek cezanın yarısı,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>İdari yaptırım uygulandıktan sonra etkin pişmanlıkta bulunulması halinde, verilecek cezanın üçte biri,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>indirilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Basın ve yayın yoluyla yapılan iftiradan dolayı etkin pişmanlık hükümlerinden yararlanılabilmesi için, bunun aynı yöntemle yayınlanması gerekir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="270" başlık="Suç üstlenme">
          <mvz-fıkra no="1">
            <template>Yetkili makamlara, gerçeğe aykırı olarak, suçu işlediğini veya suça katıldığını bildiren kimseye iki yıla kadar hapis cezası verilir. Bu suçun üstsoy, altsoy, eş veya kardeşi cezadan kurtarmak amacıyla işlenmesi halinde; verilecek cezanın dörtte üçü indirilebileceği gibi tamamen de kaldırılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="271" başlık="Suç uydurma">
          <mvz-fıkra no="1">
            <template>İşlenmediğini bildiği bir suçu, yetkili makamlara işlenmiş gibi ihbar eden ya da işlenmeyen bir suçun delil veya emarelerini soruşturma yapılmasını sağlayacak biçimde uyduran kimseye üç yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="272" başlık="Yalan tanıklık">
          <mvz-fıkra no="1">
            <template>Hukuka aykırı bir fiil nedeniyle başlatılan bir soruşturma kapsamında tanık dinlemeye yetkili kişi veya kurul önünde gerçeğe aykırı olarak tanıklık yapan kimseye, dört aydan bir yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Mahkeme huzurunda ya da yemin ettirerek tanık dinlemeye kanunen yetkili kişi veya kurul önünde gerçeğe aykırı olarak tanıklık yapan kimseye bir yıldan üç yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Üç yıldan fazla hapis cezasını gerektiren bir suçun soruşturma veya kovuşturması kapsamında yalan tanıklık yapan kişi hakkında iki yıldan dört yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Aleyhine tanıklıkta bulunulan kişi ile ilgili olarak gözaltına alma ve tutuklama dışında başka bir koruma tedbiri uygulanmışsa, yüklenen fiili işlemediğinden dolayı hakkında beraat kararı veya kovuşturmaya yer olmadığına dair karar verilmiş olması koşuluyla, yukarıdaki fıkralara göre verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Aleyhine tanıklıkta bulunulan kişinin gözaltına alınması veya tutuklanması halinde; yüklenen fiili işlemediğinden dolayı hakkında beraat kararı veya kovuşturmaya yer olmadığına dair karar verilmiş olması koşuluyla; yalan tanıklık yapan kişi, ayrıca kişiyi hürriyetinden yoksun kılma suçuna ilişkin hükümlere göre dolaylı fail olarak sorumlu tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Aleyhine tanıklıkta bulunulan kimsenin ağırlaştırılmış müebbet hapis veya müebbet hapis cezasına mahkûmiyeti halinde, yirmi yıldan otuz yıla kadar hapis cezasına;  hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Aleyhine tanıklıkta bulunulan kimsenin mahkûm olduğu hapis cezasının infazına başlanmış ise, altıncı fıkraya göre verilecek ceza yarısı kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Aleyhine tanıklıkta bulunulan kişi hakkında hapis cezası dışında adlî veya idari bir yaptırım uygulanmışsa; yalan tanıklıkta bulunan kişi, üç yıldan yedi yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="273" başlık="Şahsi cezasızlık veya cezanın azaltılmasını gerektiren sebepler">
          <mvz-fıkra no="1">
            <template>Kişinin;</template>
            <mvz-bent no="a">
              <template>Kendisinin, üstsoy, altsoy, eş veya kardeşinin soruşturma ve kovuşturmaya uğramasına neden olabilecek bir hususla ilgili olarak yalan tanıklıkta bulunması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Tanıklıktan çekinme hakkı olmasına rağmen, bu hakkı kendisine hatırlatılmadan gerçeğe aykırı olarak tanıklık yapması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Halinde, verilecek cezada indirim yapılabileceği gibi, ceza vermekten de vazgeçilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra hükmü, özel hukuk uyuşmazlıkları kapsamında yapılan yalan tanıklık hallerinde uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="274" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>Aleyhine tanıklık yapılan kişi hakkında bir hak kısıtlamasını veya yoksunluğunu sonuçlayacak nitelikte karar verilmeden veya hükümden önce gerçeğin söylenmesi halinde, cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aleyhine tanıklık yapılan kişi hakkında bir hak kısıtlamasını veya yoksunluğunu sonuçlayacak nitelikte karar verildikten sonra ve fakat hükümden önce gerçeğin söylenmesi halinde, verilecek cezanın üçte ikisinden yarısına kadarı indirilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Aleyhine tanıklık yapılan kişi hakkında verilen mahkûmiyet kararı kesinleşmeden önce gerçeğin söylenmesi halinde, verilecek cezanın yarısından üçte birine kadarı indirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="275" başlık="Yalan yere yemin">
          <mvz-fıkra no="1">
            <template>Hukuk davalarında yalan yere yemin eden davacı veya davalıya bir yıldan beş yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dava hakkında hüküm verilmeden önce gerçeğin söylenmesi halinde, cezaya hükmolunmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hükmün icraya konulmasından veya kesinleşmesinden önce gerçeğin söylenmesi halinde, verilecek cezanın yarısı indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="276" başlık="Gerçeğe aykırı bilirkişilik veya tercümanlık">
          <mvz-fıkra no="1">
            <template>Yargı mercileri veya suçtan dolayı kanunen soruşturma yapmak veya yemin altında tanık dinlemek yetkisine sahip bulunan kişi veya kurul tarafından görevlendirilen bilirkişinin gerçeğe aykırı mütalaada bulunması halinde, üç yıldan yedi yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada belirtilen kişi veya kurullar tarafından görevlendirilen tercümanın ifade veya belgeleri gerçeğe aykırı olarak tercüme etmesi halinde, birinci fıkra hükmü uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="277" başlık="Yargı görevi yapanı, bilirkişiyi veya tanığı etkilemeye teşebbüs">
          <mvz-fıkra no="1">
            <template>Görülmekte olan bir davada  gerçeğin ortaya çıkmasını engellemek veya bir haksızlık oluşturmak amacıyla, davanın taraflarından birinin,  sanığın, katılanın veya mağdurun lehine veya aleyhine sonuç doğuracak bir karar vermesi veya bir işlem tesis etmesi ya da beyanda bulunması için, yargı görevi yapanı, bilirkişiyi veya tanığı hukuka aykırı olarak etkilemeye teşebbüs eden kişi, iki yıldan dört yıla kadar hapis cezası ile cezalandırılır.  Teşebbüs iltimas derecesini geçmediği takdirde verilecek ceza altı aydan iki yıla kadardır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkradaki suçu oluşturan fiilin başka bir suçu da oluşturması halinde, fikri içtima hükümlerine göre verilecek ceza yarısına kadar artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="278" başlık="Suçu bildirmeme">
          <mvz-fıkra no="1">
            <template>İşlenmekte olan bir suçu yetkili makamlara bildirmeyen kişi, bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İşlenmiş olmakla birlikte, sebebiyet verdiği neticelerin sınırlandırılması halen mümkün bulunan bir suçu yetkili makamlara bildirmeyen kişi, yukarıdaki fıkra hükmüne göre cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mağdurun onbeşyaşını bitirmemiş bir çocuk, bedensel veya ruhsal bakımdan engelli olan ya da hamileliği nedeniyle kendisini savunamayacak durumda bulunan kimse olması halinde, yukarıdaki fıkralara göre verilecek ceza, yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Tanıklıktan çekinebilecek olan kişiler bakımından cezaya hükmolunmaz. Ancak, suçu önleme yükümlülüğünün varlığı dolayısıyla ceza sorumluluğuna ilişkin hükümler saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="279" başlık="Kamu görevlisinin suçu bildirmemesi">
          <mvz-fıkra no="1">
            <template>Kamu adına soruşturma ve kovuşturmayı gerektiren bir suçun işlendiğini göreviyle bağlantılı olarak öğrenip de yetkili makamlara bildirimde bulunmayı ihmal eden veya bu hususta gecikme gösteren kamu görevlisi, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun, adlî kolluk görevini yapan kişi tarafından işlenmesi halinde, yukarıdaki fıkraya göre verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="280" başlık="Sağlık mesleği mensuplarının suçu bildirmemesi">
          <mvz-fıkra no="1">
            <template>Görevini yaptığı sırada bir suçun işlendiği yönünde bir belirti ile karşılaşmasına rağmen, durumu yetkili makamlara bildirmeyen veya bu hususta gecikme gösteren sağlık mesleği mensubu, bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Sağlık mesleği mensubu deyiminden tabip, diş tabibi, eczacı, ebe, hemşire ve sağlık hizmeti veren diğer kişiler anlaşılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="281" başlık="Suç delillerini yok etme, gizleme veya değiştirme">
          <mvz-fıkra no="1">
            <template>Gerçeğin meydana çıkmasını engellemek amacıyla, bir suçun delillerini yok eden, silen, gizleyen, değiştiren veya bozan kişi, altı aydan beş yıla kadar hapis cezası ile cezalandırılır. Kendi işlediği veya işlenişine iştirak ettiği suçla ilgili olarak kişiye bu fıkra hükmüne göre ceza verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun kamu görevlisi tarafından göreviyle bağlantılı olarak işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>İlişkin olduğu suç nedeniyle hüküm verilmeden önce gizlenen delilleri mahkemeye teslim eden kişi hakkında bu maddede tanımlanan suç nedeniyle verilecek cezanın beşte dördü indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="282" başlık="Suçtan kaynaklanan malvarlığı değerlerini aklama">
          <mvz-fıkra no="1">
            <template>Alt sınırı altı ay veya daha fazla hapis cezasını gerektiren bir suçtan kaynaklanan malvarlığı değerlerini, yurt dışına çıkaran veya bunların gayrimeşru kaynağını gizlemek veya meşru bir yolla elde edildiği konusunda kanaat uyandırmak maksadıyla, çeşitli işlemlere tâbi tutan kişi, üç yıldan yedi yıla kadar hapis ve yirmibin güne kadar adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkradaki suçun işlenmesine iştirak etmeksizin, bu suçun konusunu oluşturan malvarlığı değerini, bu özelliğini bilerek satın alan, kabul eden, bulunduran veya kullanan kişi iki yıldan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçun, kamu görevlisi tarafından veya belli bir meslek sahibi kişi tarafından bu mesleğin icrası sırasında işlenmesi halinde, verilecek hapis cezası yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçun, suç işlemek için teşkil edilmiş bir örgütün faaliyeti çerçevesinde işlenmesi halinde, verilecek ceza bir kat artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu suçun işlenmesi dolayısıyla tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu suç nedeniyle kovuşturma başlamadan önce suç konusu malvarlığı değerlerinin ele geçirilmesini sağlayan veya bulunduğu yeri yetkili makamlara haber vererek ele geçirilmesini kolaylaştıran kişi hakkında bu maddede tanımlanan suç nedeniyle cezaya hükmolunmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="283" başlık="Suçluyu kayırma">
          <mvz-fıkra no="1">
            <template>Suç işleyen bir kişiye araştırma, yakalanma, tutuklanma veya hükmün infazından kurtulması için imkan sağlayan kimse, altı aydan beş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun kamu görevlisi tarafından göreviyle bağlantılı olarak işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçun üstsoy, altsoy, eş, kardeş veya diğer suç ortağı tarafından işlenmesi halinde, cezaya hükmolunmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="284" başlık="Tutuklu, hükümlü veya suç delillerini bildirmeme">
          <mvz-fıkra no="1">
            <template>Hakkında tutuklama kararı verilmiş olan veya hükümlü bir kişinin bulunduğu yeri bildiği halde yetkili makamlara bildirmeyen kimse, bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İşlenmiş olan bir suça ilişkin delil ve eserlerin başkaları tarafından saklandığı yeri bildiği halde yetkili makamlara bildirmeyen kimse, yukarıdaki fıkra hükmüne göre cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçların kamu görevlisi tarafından göreviyle bağlantılı olarak işlenmesi halinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçların üstsoy, altsoy, eş veya kardeş tarafından işlenmesi halinde, cezaya hükmolunmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="285" başlık="Gizliliğin ihlali">
          <mvz-fıkra no="1">
            <template>Soruşturmanın gizliliğini alenen ihlal eden kişi, bir yıldan üç yıla kadar hapis veya adli para cezası ile cezalandırılır. Bu suçun oluşabilmesi için;</template>
            <mvz-bent no="a">
              <template>Soruşturma evresinde yapılan işlemin içeriğinin açıklanması suretiyle, suçlu sayılmama karinesinden yararlanma hakkının veya haberleşmenin gizliliğinin ya da özel hayatın gizliliğinin ihlal edilmesi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Soruşturma evresinde yapılan işlemin içeriğine ilişkin olarak yapılan açıklamanın maddi gerçeğin ortaya çıkmasını engellemeye elverişli olması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Soruşturma evresinde alınan ve soruşturmanın tarafı olan kişilere karşı gizli tutulması gereken kararların ve bunların gereği olarak yapılan işlemlerin gizliliğini ihlal eden kişi, bir yıldan üç yıla kadar hapis veya adli para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kanuna göre kapalı yapılması gereken veya kapalı yapılmasına karar verilen duruşmadaki açıklama veya görüntülerin gizliliğini alenen ihlal eden kişi, birinci fıkra hükmüne göre cezalandırılır. Ancak, bu suçun oluşması için, tanığın korunmasına ilişkin olarak alınan gizlilik kararına aykırılık açısından aleniyetin gerçekleşmesi aranmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yukarıdaki fıkralarda tanımlanan suçların kamu görevlisi tarafından görevinin sağladığı kolaylıktan yararlanılarak işlenmesi halinde, ceza yarısına kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Soruşturma ve kovuşturma evresinde kişilerin suçlu olarak algılanmalarına yol açacak şekilde görüntülerinin yayınlanması halinde, altı aydan iki yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Soruşturma ve kovuşturma işlemlerinin haber verme sınırları aşılmaksızın haber konusu yapılması suç oluşturmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="286" başlık="Ses veya görüntülerin kayda alınması">
          <mvz-fıkra no="1">
            <template>Soruşturma ve kovuşturma işlemleri sırasındaki ses veya görüntüleri yetkisiz olarak kayda alan veya nakleden kişi, altı aya kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="287" başlık="Genital muayene">
          <mvz-fıkra no="1">
            <template>Yetkili hakim ve savcı kararı olmaksızın, kişiyi genital muayeneye gönderen veya bu muayeneyi yapan fail hakkında üç aydan bir yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bulaşıcı hastalıklar dolayısıyla kamu sağlığını korumak amacıyla kanun ve yönetmeliklerde öngörülen hükümlere uygun olarak yapılan muayeneler açısından yukarıdaki fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="288" başlık="Adil yargılamayı etkilemeye teşebbüs">
          <mvz-fıkra no="1">
            <template>Görülmekte olan bir davada veya yapılmakta olan bir soruşturmada, hukuka aykırı bir karar vermesi veya bir işlem tesis etmesi ya da gerçeğe aykırı beyanda bulunması için, yargı görevi yapanı, bilirkişiyi veya tanığı hukuka aykırı olarak etkilemek amacıyla alenen sözlü veya yazılı beyanda bulunan kişi, elli günden az olmamak üzere adli para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="289" başlık="Muhafaza görevini kötüye kullanma">
          <mvz-fıkra no="1">
            <template>Muhafaza edilmek üzere kendisine resmen teslim olunan rehinli veya hacizli veya herhangi bir nedenle elkonulmuş olan mal üzerinde teslim amacı dışında tasarrufta bulunan kişi, üç aydan iki yıla kadar hapis ve üç bin güne kadar adlî para cezası ile cezalandırılır. Kişinin bu malın sahibi olması halinde, verilecek ceza yarı oranında indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada tanımlanan suçun konusunu oluşturan eşyayı kovuşturma başlamadan önce geri veren veya bunun mümkün olmaması halinde bedelini ödeyen kişi hakkında verilecek cezaların beşte dördü indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Muhafaza edilmek üzere kendisine resmen teslim olunan rehinli veya hacizli veya herhangi bir nedenle elkonulmuş olan malın dikkat ve özen yükümlülüğüne aykırı davranması nedeniyle kaybolmasına veya bozulmasına neden olan kişi, adlî para cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bir suça ilişkin soruşturma veya kovuşturma kapsamında elkonulan eşyayı amacı dışında kullanan kimse, bir yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="290" başlık="Resmen teslim olunan mala elkonulması ve bozulması">
          <mvz-fıkra no="1">
            <template>Hükmen hak sahiplerine teslim edilen taşınmaz mallara tekrar elkoyan kimseye üç aydan bir yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Muhafaza edilmek üzere başkasına resmen teslim olunan rehinli veya hacizli veya herhangi bir nedenle elkonulmuş olan taşınır malın bu kişinin elinden rızası dışında alınması halinde hırsızlık, cebren alınması halinde yağma, hileyle alınması halinde dolandırıcılık, tahrip edilmesi halinde mala zarar verme suçuna ilişkin hükümler uygulanır. Kişinin bu malın sahibi olması halinde, verilecek cezanın yarısından dörtte üçüne kadarı indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="291" başlık="Başkası yerine ceza infaz kurumuna veya tutukevine girme">
          <mvz-fıkra no="1">
            <template>Kendisini, bir hükümlünün veya tutuklunun yerine koyarak ceza infaz kurumuna veya tutukevine giren kimseye altı aydan iki yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="292" başlık="Hükümlü veya tutuklunun kaçması">
          <mvz-fıkra no="1">
            <template>Tutukevinden, ceza infaz kurumundan veya gözetimi altında bulunduğu görevlilerin elinden kaçan tutuklu veya hükümlü hakkında altı aydan bir yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun, cebir veya tehdit kullanılarak işlenmesi halinde, bir yıldan üç yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçun, silahlı olarak ya da birden çok tutuklu veya hükümlü tarafından birlikte işlenmesi halinde, yukarıdaki fıkralara göre verilecek ceza bir katına kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçun işlenmesi sırasında kasten yaralama suçunun neticesi sebebiyle ağırlaşmış hallerinin veya kasten öldürme suçunun gerçekleşmesi ya da eşyaya zarar verilmesi durumunda, ayrıca bu suçlara ilişkin hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu maddede yazılı hükümler, ceza infaz kurumu dışında çalıştırılan hükümlüler ile hapis cezası adlî para cezasından çevrilmiş olanlar hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="293" başlık="Etkin pişmanlık">
          <mvz-fıkra no="1">
            <template>tutuklu veya hükümlünün, kaçtıktan sonra etkin pişmanlık göstererek kendiliğinden teslim olması halinde, kaçtığı günden itibaren teslimin gerçekleştiği güne kadar geçen süre dikkate alınarak, verilecek cezanın altıda beşinden altıda birine kadarı indirilir. Ancak, kaçma süresinin altı ayı geçmesi halinde cezada indirim yapılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="294" başlık="Kaçmaya imkan sağlama">
          <mvz-fıkra no="1">
            <template>Gözaltına alınanın veya tutuklunun kaçmasını sağlayan kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlünün kaçmasını sağlayan kişi, çekilecek olan hapis cezasının süresine göre iki yıldan beş yıla kadar hapis cezası ile cezalandırılır. Ancak, hükümlünün cezası;</template>
            <mvz-bent no="a">
              <template>Müebbet hapis cezası ise, beş yıldan sekiz yıla,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Ağırlaştırılmış müebbet hapis cezası ise, sekiz yıldan oniki yıla,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçların, cebir veya tehdit kullanılarak işlenmesi halinde, verilecek ceza üçte biri oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kaçması sağlanan kişi sayısının birden fazla olması halinde, bu sayı göz önünde bulundurularak, verilecek ceza üçte birden bir katına kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu suçların gözaltına alınan, tutuklu veya hükümlünün muhafaza veya nakli ile görevli kişiler tarafından işlenmesi halinde, verilecek ceza, üçte biri oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu suçların üstsoy, altsoy, eş veya kardeş tarafından işlenmesi halinde, verilecek ceza üçte biri oranında indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu suçların işlenmesi sırasında kasten yaralama suçunun neticesi sebebiyle ağırlaşmış hallerinin veya kasten öldürme suçunun gerçekleşmesi ya da eşyaya zarar verilmesi durumunda, ayrıca bu suçlara ilişkin hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Gözaltına alınan, tutuklu veya hükümlünün, muhafaza veya nakli ile görevli kişinin dikkat ve özen yükümlülüğüne aykırı davranmasından yararlanarak kaçması halinde, altı aydan üç yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="295" başlık="Muhafızın görevini kötüye kullanması">
          <mvz-fıkra no="1">
            <template>Gözaltına alınan, tutuklu veya hükümlünün muhafaza veya nakli ile görevli kişilerin, görevlerinin gereklerine aykırı hareket etmeleri halinde, görevi kötüye kullanma suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Muhafaza veya nakli ile görevli olan kimse, görevinin gereklerine aykırı olarak gözaltına alınan, tutuklu veya hükümlünün bulunduğu yerden geçici bir süreyle uzaklaşmasına izin verirse; altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Gözaltına alınan, tutuklu veya hükümlünün bu fırsattan yararlanarak kaçması halinde, kaçmaya kasten imkan sağlama suçuna ilişkin hükümler uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="296" başlık="Hükümlü veya tutukluların ayaklanması">
          <mvz-fıkra no="1">
            <template>Hükümlü veya tutukluların toplu olarak ayaklanması halinde, her biri hakkında altı aydan üç yıla kadar hapis cezasına hükmolunur. Hükümlü veya tutuklu sayısının üçten fazla olmaması halinde, bu suçtan dolayı cezaya hükmedilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ayaklanma sırasında başka suçların işlenmesi halinde, ayrıca bu suçlara ilişkin hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="297" başlık="İnfaz kurumuna veya tutukevine yasak eşya sokmak">
          <mvz-fıkra no="1">
            <template>İnfaz kurumuna veya tutukevine silah, uyuşturucu veya uyarıcı madde veya elektronik haberleşme aracı sokan veya bulunduran kişi, iki yıldan beş yıla kadar hapis cezası ile cezalandırılır. Bu suçun konusunu oluşturan eşyanın, temin edilmesi veya bulundurulması ayrı bir suç oluşturduğu takdirde; fikri içtima hükümlerine göre belirlenecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra kapsamı dışında kalan;</template>
            <mvz-bent no="a">
              <template>Firarı kolaylaştırıcı her türlü alet ve malzemeyi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Her türlü saldırı ve savunma araçları ile yangın çıkarmaya yarayan malzemeyi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Alkol içeren her türlü içeceği,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Kumar oynanmasına olanak sağlayan eşya ve malzemeyi,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>188 inci maddede tanımlanan suçlar saklı kalmak üzere, yeşil reçeteye tabi ilaçları,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Kurum idaresince incelenmek üzere alınanlar hariç, mahkemelerce yasaklanmış veya suç örgütlerini temsil eden yayın, afiş, pankart, resim, sembol, işaret, doküman ve benzeri malzemeler ile örgütsel haberleşme araçlarını,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Yetkili makamlarca izin verilenler hariç, ses ve görüntü almaya yarayan araçları,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>ceza infaz kurumuna veya tutukevine sokan, buralarda bulunduran veya kullanan kişi bir yıldan üç yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bir ve ikinci fıkralarda tanımlanan suçların hükümlü veya tutukluların muhafazasıyla görevli kişiler tarafından işlenmesi halinde, verilecek ceza bir kat artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bir ve ikinci fıkralarda tanımlanan suçların konusunu oluşturan eşyayı yanında bulunduran veya kullanan hükümlü veya tutuklu, bunu kimden ve ne suretle elde ettiği hususunda bilgi verirse, verilecek ceza yarı oranında indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="298" başlık="Hak kullanımını ve beslenmeyi engelleme">
          <mvz-fıkra no="1">
            <template>Ceza infaz kurumları ve tutukevlerinde bulunan hükümlü ve tutukluların haberleşmelerini, ziyaretçileriyle görüşmelerini, iyileştirme ve eğitim programları çerçevesinde eğitim ve spor, meslek kazandırma ve işyurdu çalışmaları ile diğer sosyal ve kültürel faaliyetlere katılmalarını, kurum tabibince muayene ve tedavi edilmelerini, müdafi veya avukat tayin etmelerini, bunlarla görüşmelerini, mahkemelere veya Cumhuriyet başsavcılıklarına gitmelerini, kurum görevlileri ile görüşmelerini, salıverilenlerin kurum dışına çıkmalarını her ne suretle olursa olsun engelleyenler, hükümlü ve tutukluları bu fiillere teşvik edenler, bu yolda talimat verenler, mevzuatın hükümlü ve tutuklulara tanıdığı sair her türlü görüşme ve temas olanağını engelleyenler, bir yıldan üç yıla kadar hapis cezasıyla cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlü ve tutukluların beslenmesini engelleyenler hakkında iki yıldan dört yıla kadar hapis cezası verilir. Hükümlü ve tutukluların açlık grevine veya ölüm orucuna teşvik veya ikna edilmeleri ya da bu yolda kendilerine talimat verilmesi de beslenmenin engellenmesi sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Beslenmenin engellenmesi nedeniyle kasten yaralama suçunun neticesi sebebiyle ağırlaşmış hallerinden biri veya ölüm meydana gelmiş ise, ayrıca kasten yaralama veya kasten öldürme suçlarına ilişkin hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
