  <mvz-künye tür="kanun" no="5237" başlık="TÜRK CEZA KANUNU"
             tarih="26/9/2004" rgazete-tarih="12/10/2004" rgazete-sayı="25611"
             düstur-tertip="5" düstur-cilt="43" />

  <mvz-kitap no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-kısım no="1-BİRİNCİ" başlık="Temel İlkeler, Tanımlar ve Uygulama Alanı">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Temel İlkeler ve Tanımlar">
        <mvz-madde no="1" başlık="Ceza Kanununun amacı">
          <mvz-fıkra no="1">
            <template>Ceza Kanununun amacı; kişi hak ve özgürlüklerini, kamu düzen ve güvenliğini, hukuk devletini, kamu sağlığını ve çevreyi, toplum barışını korumak, suç işlenmesini önlemektir. Kanunda, bu amacın gerçekleştirilmesi için ceza sorumluluğunun temel esasları ile suçlar, ceza ve güvenlik tedbirlerinin türleri düzenlenmiştir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="2" başlık="Suçta ve cezada kanunîlik ilkesi">
          <mvz-fıkra no="1">
            <template>Kanunun açıkça suç saymadığı bir fiil için kimseye ceza verilemez ve güvenlik tedbiri uygulanamaz. Kanunda yazılı cezalardan ve güvenlik tedbirlerinden başka bir ceza ve güvenlik tedbirine hükmolunamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İdarenin düzenleyici işlemleriyle suç ve ceza konulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kanunların suç ve ceza içeren hükümlerinin uygulanmasında kıyas yapılamaz. Suç ve ceza içeren hükümler, kıyasa yol açacak biçimde geniş yorumlanamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="3" başlık="Adalet ve kanun önünde eşitlik ilkesi">
          <mvz-fıkra no="1">
            <template>Suç işleyen kişi hakkında işlenen fiilin ağırlığıyla orantılı ceza ve güvenlik tedbirine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ceza Kanununun uygulamasında kişiler arasında ırk, dil, din, mezhep, milliyet, renk, cinsiyet, siyasal veya diğer fikir yahut düşünceleri, felsefi inanç, milli veya sosyal köken, doğum, ekonomik ve diğer toplumsal konumları yönünden ayrım yapılamaz ve hiçbir kimseye ayrıcalık tanınamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="4" başlık="Kanunun bağlayıcılığı">
          <mvz-fıkra no="1">
            <template>Ceza kanunlarını bilmemek mazeret sayılmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2" durum="mülga">
            <template></template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="5" başlık="Özel kanunlarla ilişki">
          <mvz-fıkra no="1">
            <template>Bu Kanunun genel hükümleri, özel ceza kanunları ve ceza içeren kanunlardaki suçlar hakkında da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="6" başlık="Tanımlar">
          <mvz-fıkra no="1">
            <template>Ceza kanunlarının uygulanmasında;</template>
            <mvz-bent no="a">
              <template>Vatandaş deyiminden; fiili işlediği sırada Türk vatandaşı olan kişi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Çocuk deyiminden; henüz onsekiz yaşını doldurmamış kişi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Kamu görevlisi deyiminden; kamusal faaliyetin yürütülmesine atama veya seçilme yoluyla ya da herhangi bir surette sürekli, süreli veya geçici olarak katılan kişi,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Yargı görevi yapan deyiminden; yüksek mahkemeler, adlî ve idarî mahkemeler üye ve hakimleri ile Cumhuriyet savcısı ve avukatlar,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Gece vakti deyiminden; güneşin batmasından bir saat sonra başlayan ve doğmasından bir saat evvele kadar devam eden zaman süresi,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Silah deyiminden;</template>
              <mvz-altbent no="1">
                <template>Ateşli silahlar,</template>
              </mvz-altbent>
              <mvz-altbent no="2">
                <template>Patlayıcı maddeler,</template>
              </mvz-altbent>
              <mvz-altbent no="3">
                <template>Saldırı ve savunmada kullanılmak üzere yapılmış her türlü kesici, delici veya bereleyici alet,</template>
              </mvz-altbent>
              <mvz-altbent no="4">
                <template>Saldırı ve savunma amacıyla yapılmış olmasa bile fiilen saldırı ve savunmada kullanılmaya elverişli diğer şeyler,</template>
              </mvz-altbent>
              <mvz-altbent no="5">
                <template>Yakıcı, aşındırıcı, yaralayıcı, boğucu, zehirleyici, sürekli hastalığa yol açıcı nükleer, radyoaktif, kimyasal, biyolojik maddeler,</template>
              </mvz-altbent>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Basın ve yayın yolu ile deyiminden; her türlü yazılı, görsel, işitsel ve elektronik kitle iletişim aracıyla yapılan yayınlar,</template>
            </mvz-bent>
            <mvz-bent no="h">
              <template>İtiyadi suçlu deyiminden; kasıtlı bir suçun temel şeklini ya da daha ağır veya daha az cezayı gerektiren nitelikli şekillerini bir yıl içinde ve farklı zamanlarda ikiden fazla işleyen kişi,</template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Suçu meslek edinen kişi deyiminden; kısmen de olsa geçimini suçtan elde ettiği kazançla sağlamaya alışmış kişi,</template>
            </mvz-bent>
            <mvz-bent no="j">
              <template>Örgüt mensubu suçlu deyiminden; bir suç örgütünü kuran, yöneten, örgüte katılan veya örgüt adına diğerleriyle birlikte veya tek başına suç işleyen kişi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>anlaşılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Kanunun Uygulama Alanı">
        <mvz-madde no="7" başlık="Zaman bakımından uygulama">
          <mvz-fıkra no="1">
            <template>İşlendiği zaman yürürlükte bulunan kanuna göre suç sayılmayan bir fiilden dolayı kimseye ceza verilemez ve güvenlik tedbiri uygulanamaz. İşlendikten sonra yürürlüğe giren kanuna göre suç sayılmayan bir fiilden dolayı da kimse cezalandırılamaz ve hakkında güvenlik tedbiri uygulanamaz. Böyle bir ceza veya güvenlik tedbiri hükmolunmuşsa infazı ve kanuni neticeleri kendiliğinden kalkar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun işlendiği zaman yürürlükte bulunan kanun ile sonradan yürürlüğe giren kanunların hükümleri farklı ise, failin lehine olan kanun uygulanır ve infaz olunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Hapis cezasının ertelenmesi, koşullu salıverilme ve tekerrürle ilgili olanlar hariç; infaz rejimine ilişkin hükümler, derhal uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Geçici veya süreli kanunların, yürürlükte bulundukları süre içinde işlenmiş olan suçlar hakkında uygulanmasına devam edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="8" başlık="Yer bakımından uygulama">
          <mvz-fıkra no="1">
            <template>Türkiye'de işlenen suçlar hakkında Türk kanunları uygulanır. Fiilin kısmen veya tamamen Türkiye'de işlenmesi veya neticenin Türkiye'de gerçekleşmesi halinde suç, Türkiye'de işlenmiş sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suç;</template>
            <mvz-bent no="a">
              <template>Türk kara ve hava sahaları ile Türk karasularında,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Açık denizde ve bunun üzerindeki hava sahasında, Türk deniz ve hava araçlarında veya bu araçlarla,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Türk deniz ve hava savaş araçlarında veya bu araçlarla,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Türkiye'nin kıt'a sahanlığında veya münhasır ekonomik bölgesinde tesis edilmiş sabit platformlarda veya bunlara karşı,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>işlendiğinde Türkiye'de işlenmiş sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="9" başlık="Yabancı ülkede hüküm verilmesi">
          <mvz-fıkra no="1">
            <template>Türkiye'de işlediği suçtan dolayı yabancı ülkede hakkında hüküm verilmiş olan kimse, Türkiye'de yeniden yargılanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="10" başlık="Görev suçları">
          <mvz-fıkra no="1">
            <template>Yabancı ülkede Türkiye namına memuriyet veya görev üstlenmiş olup da bundan dolayı bir suç işleyen kimse, bu fiile ilişkin olarak yabancı ülkede hakkında mahkûmiyet hükmü verilmiş bulunsa bile, Türkiye'de yeniden yargılanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="11" başlık="Vatandaş tarafından işlenen suç">
          <mvz-fıkra no="1">
            <template>Bir Türk vatandaşı, 13 üncü maddede yazılı suçlar dışında, Türk kanunlarına göre aşağı sınırı bir yıldan az olmayan hapis cezasını gerektiren bir suçu yabancı ülkede işlediği ve kendisi Türkiye'de bulunduğu takdirde, bu suçtan dolayı yabancı ülkede hüküm verilmemiş olması ve Türkiye'de kovuşturulabilirliğin bulunması koşulu ile Türk kanunlarına göre cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suç, aşağı sınırı bir yıldan az hapis cezasını gerektirdiğinde yargılama yapılması zarar görenin veya yabancı hükûmetin şikayetine bağlıdır. Bu durumda şikayet, vatandaşın Türkiye'ye girdiği tarihten itibaren altı ay içinde yapılmalıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="12" başlık="Yabancı tarafından işlenen suç">
          <mvz-fıkra no="1">
            <template>Bir yabancı, 13 üncü maddede yazılı suçlar dışında, Türk kanunlarına göre aşağı sınırı en az bir yıl hapis cezasını gerektiren bir suçu yabancı ülkede Türkiye'nin zararına işlediği ve kendisi Türkiye'de bulunduğu takdirde, Türk kanunlarına göre cezalandırılır. Yargılama yapılması Adalet Bakanının istemine bağlıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yukarıdaki fıkrada belirtilen suçun bir Türk vatandaşının veya Türk kanunlarına göre kurulmuş özel hukuk tüzel kişisinin zararına işlenmesi ve failin Türkiye'de bulunması halinde, bu suçtan dolayı yabancı ülkede hüküm verilmemiş olması koşulu ile suçtan zarar görenin şikayeti üzerine fail, Türk kanunlarına göre cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mağdur yabancı ise, aşağıdaki koşulların varlığı halinde fail, Adalet Bakanının istemi ile yargılanır:</template>
            <mvz-bent no="a">
              <template>Suçun, Türk kanunlarına göre aşağı sınırı üç yıldan az olmayan hapis cezasını gerektirmesi.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Suçluların geri verilmesi anlaşmasının bulunmaması veya geri verilme isteminin suçun işlendiği ülkenin veya failin uyruğunda bulunduğu devletin hükûmeti tarafından kabul edilmemiş olması.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Birinci fıkra kapsamına giren suçtan dolayı yabancı mahkemece mahkûm edilen veya herhangi bir nedenle davası veya cezası düşen veya beraat eden yahut suçu kovuşturulabilir olmaktan çıkan yabancı hakkında Adalet Bakanının istemi üzerine Türkiye'de yeniden yargılama yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Birinci fıkra kapsamına giren hâllerde rüşvet ve nüfuz ticareti suçlarından dolayı yargılama yapılması Adalet Bakanının istemine bağlı değildir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="13" başlık="Diğer suçlar">
          <mvz-fıkra no="1">
            <template>Aşağıdaki suçların, vatandaş veya yabancı tarafından, yabancı ülkede işlenmesi halinde, Türk kanunları uygulanır:</template>
            <mvz-bent no="a">
              <template>İkinci Kitap, Birinci Kısım altında yer alan suçlar.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>İkinci Kitap, Dördüncü Kısım altındaki Üçüncü, Dördüncü, Beşinci, Altıncı, Yedinci ve Sekizinci Bölümlerde yer alan suçlar.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>İşkence (madde 94, 95).</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Çevrenin kasten kirletilmesi (madde 181).</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Uyuşturucu veya uyarıcı madde imal ve ticareti (madde 188), uyuşturucu veya uyarıcı madde kullanılmasını kolaylaştırma (madde 190).</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Parada sahtecilik (madde 197), para ve kıymetli damgaları imale yarayan araçların üretimi ve ticareti (madde 200), mühürde sahtecilik (madde 202).</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Fuhuş (madde 227).</template>
            </mvz-bent>
            <mvz-bent no="h" durum="mülga">
              <template></template>
            </mvz-bent>
            <mvz-bent no="i">
              <template>Deniz, demiryolu veya havayolu ulaşım araçlarının kaçırılması veya alıkonulması (madde 223, fıkra 2, 3) ya da bu araçlara karşı işlenen zarar verme (madde 152) suçları.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İkinci Kitap, Dördüncü Kısım altındaki Üçüncü, Dördüncü, Beşinci, Altıncı ve Yedinci Bölümlerde yer alanlar hariç; birinci fıkra kapsamına giren suçlardan dolayı Türkiye'de yargılama yapılması, Adalet Bakanının talebine bağlıdır</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci fıkranın (a) ve (b) bentlerinde yazılı suçlar dolayısıyla yabancı bir ülkede mahkûmiyet veya beraat kararı verilmiş olsa bile, Adalet Bakanının talebi üzerine Türkiye'de yargılama yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="14" başlık="Seçimlik cezalarda soruşturma">
          <mvz-fıkra no="1">
            <template>11 ve 12 nci maddelerde belirtilen hallerde, soruşturma konusu suçun yer aldığı kanun maddesinde hapis cezası ile adli para cezasından birinin uygulanması seçimlik sayılmış ise soruşturma veya kovuşturma açılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="15" başlık="Soruşturma koşulu olan cezanın hesaplanması">
          <mvz-fıkra no="1">
            <template>Miktarının soruşturma koşulu oluşturduğu hallerde ceza, soruşturma evresinde ileri sürülen kanuni ağırlaştırıcı nedenlerin aşağı sınırı ve kanuni hafifletici nedenlerin yukarı sınırı göz önünde bulundurularak hesaplanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="16" başlık="Cezadan mahsup">
          <mvz-fıkra no="1">
            <template>Nerede işlenmiş olursa olsun bir suçtan dolayı, yabancı ülkede gözaltında, gözlem altında, tutuklulukta veya hükümlülükte geçen süre, aynı suçtan dolayı Türkiye'de verilecek cezadan mahsup edilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="17" başlık="Hak yoksunlukları">
          <mvz-fıkra no="1">
            <template>Yukarıdaki maddelerde açıklanan hallerde mahkeme, yabancı mahkemelerden verilen ve Türk hukuk düzenine aykırı düşmeyen hükmün, Türk kanunlarına göre bir haktan yoksunluğu gerektirmesi halinde, Cumhuriyet savcısının istemi üzerine Türk kanunlarındaki sonuçlarının geçerli olmasına karar verir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="18" başlık="Geri verme" durum="mülga">
        </mvz-madde>
        <mvz-madde no="19" başlık="Yabancı kanunun göz önünde bulundurulması">
          <mvz-fıkra no="1">
            <template>Türkiye'nin egemenlik alanı dışında işlenen suçlar dolayısıyla Türkiye'de yargılama yapılırken, Türk kanununa göre verilecek olan ceza, suçun işlendiği ülke kanununda öngörülen cezanın üst sınırından fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Ancak suçun;</template>
            <mvz-bent no="a">
              <template>Türkiye'nin güvenliğine karşı veya zararına olarak,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Türk vatandaşına karşı ya da Türk kanunlarına göre kurulmuş özel hukuk tüzel kişisi zararına olarak,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>İşlenmesi durumunda, yukarıdaki fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="2-İKİNCİ" başlık="Ceza Sorumluluğunun Esasları">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Ceza Sorumluluğunun Şahsiliği, Kast ve Taksir">
        <mvz-madde no="20" başlık="Ceza sorumluluğunun şahsiliği">
          <mvz-fıkra no="1">
            <template>Ceza sorumluluğu şahsidir. Kimse başkasının fiilinden dolayı sorumlu tutulamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tüzel kişiler hakkında ceza yaptırımı uygulanamaz. Ancak, suç dolayısıyla kanunda öngörülen güvenlik tedbiri niteliğindeki yaptırımlar saklıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="21" başlık="Kast">
          <mvz-fıkra no="1">
            <template>Suçun oluşması kastın varlığına bağlıdır. Kast, suçun kanuni tanımındaki unsurların bilerek ve istenerek gerçekleştirilmesidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kişinin, suçun kanuni tanımındaki unsurların gerçekleşebileceğini öngörmesine rağmen, fiili işlemesi halinde olası kast vardır. Bu halde, ağırlaştırılmış müebbet hapis cezasını gerektiren suçlarda müebbet hapis cezasına, müebbet hapis cezasını gerektiren suçlarda yirmi yıldan yirmibeş yıla kadar hapis cezasına hükmolunur; diğer suçlarda ise temel ceza üçte birden yarısına kadar indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="22" başlık="Taksir">
          <mvz-fıkra no="1">
            <template>Taksirle işlenen fiiller, kanunun açıkça belirttiği hallerde cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Taksir, dikkat ve özen yükümlülüğüne aykırılık dolayısıyla, bir davranışın suçun kanuni tanımında belirtilen neticesi öngörülmeyerek gerçekleştirilmesidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kişinin öngördüğü neticeyi istememesine karşın, neticenin meydana gelmesi halinde bilinçli taksir vardır; bu halde taksirli suça ilişkin ceza üçte birden yarısına kadar artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Taksirle işlenen suçtan dolayı verilecek olan ceza failin kusuruna göre belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Birden fazla kişinin taksirle işlediği suçlarda, herkes kendi kusurundan dolayı sorumlu olur. Her failin cezası kusuruna göre ayrı ayrı belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Taksirli hareket sonucu neden olunan netice, münhasıran failin kişisel ve ailevi durumu bakımından, artık bir cezanın hükmedilmesini gereksiz kılacak derecede mağdur olmasına yol açmışsa ceza verilmez; bilinçli taksir halinde verilecek ceza yarıdan altıda bire kadar indirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="23" başlık="Netice sebebiyle ağırlaşmış suç">
          <mvz-fıkra no="1">
            <template>Bir fiilin, kastedilenden daha ağır veya başka bir neticenin oluşumuna sebebiyet vermesi halinde, kişinin bundan dolayı sorumlu tutulabilmesi için bu netice bakımından en azından taksirle hareket etmesi gerekir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Ceza Sorumluluğunu Kaldıran veya Azaltan Nedenler">
        <mvz-madde no="24" başlık="Kanunun hükmü ve amirin emri">
          <mvz-fıkra no="1">
            <template>Kanunun hükmünü yerine getiren kimseye ceza verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Yetkili bir merciden verilip, yerine getirilmesi görev gereği zorunlu olan bir emri uygulayan sorumlu olmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Konusu suç teşkil eden emir hiçbir surette yerine getirilemez. Aksi takdirde yerine getiren ile emri veren sorumlu olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Emrin, hukuka uygunluğunun denetlenmesinin kanun tarafından engellendiği hallerde, yerine getirilmesinden emri veren sorumlu olur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="25" başlık="Meşru savunma ve zorunluluk hali">
          <mvz-fıkra no="1">
            <template>Gerek kendisine ve gerek başkasına ait bir hakka yönelmiş, gerçekleşen, gerçekleşmesi veya tekrarı muhakkak olan haksız bir saldırıyı o anda hal ve koşullara göre saldırı ile orantılı biçimde defetmek zorunluluğu ile işlenen fiillerden dolayı faile ceza verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Gerek kendisine gerek başkasına ait bir hakka yönelik olup, bilerek neden olmadığı ve başka suretle korunmak olanağı bulunmayan ağır ve muhakkak bir tehlikeden kurtulmak veya başkasını kurtarmak zorunluluğu ile ve tehlikenin ağırlığı ile konu ve kullanılan vasıta arasında orantı bulunmak koşulu ile işlenen fiillerden dolayı faile ceza verilmez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="26" başlık="Hakkın kullanılması ve ilgilinin rızası">
          <mvz-fıkra no="1">
            <template>Hakkını kullanan kimseye ceza verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kişinin üzerinde mutlak surette tasarruf edebileceği bir hakkına ilişkin olmak üzere, açıkladığı rızası çerçevesinde işlenen fiilden dolayı kimseye ceza verilmez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="27" başlık="Sınırın aşılması">
          <mvz-fıkra no="1">
            <template>Ceza sorumluluğunu kaldıran nedenlerde sınırın kast olmaksızın aşılması halinde, fiil taksirle işlendiğinde de cezalandırılıyorsa, taksirli suç için kanunda yazılı cezanın altıda birinden üçte birine kadarı indirilerek hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Meşru savunmada sınırın aşılması mazur görülebilecek bir heyecan, korku veya telaştan ileri gelmiş ise faile ceza verilmez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="28" başlık="Cebir ve şiddet, korkutma ve tehdit">
          <mvz-fıkra no="1">
            <template>Karşı koyamayacağı veya kurtulamayacağı cebir ve şiddet veya muhakkak ve ağır bir korkutma veya tehdit sonucu suç işleyen kimseye ceza verilmez. Bu gibi hallerde cebir ve şiddet, korkutma ve tehdidi kullanan kişi suçun faili sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="29" başlık="Haksız tahrik">
          <mvz-fıkra no="1">
            <template>Haksız bir fiilin meydana getirdiği hiddet veya şiddetli elemin etkisi altında suç işleyen kimseye, ağırlaştırılmış müebbet hapis cezası yerine onsekiz yıldan yirmidört yıla ve müebbet hapis cezası yerine oniki yıldan onsekiz yıla kadar hapis cezası verilir. Diğer hallerde verilecek cezanın dörtte birinden dörtte üçüne kadarı indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="30" başlık="Hata">
          <mvz-fıkra no="1">
            <template>Fiilin icrası sırasında suçun kanuni tanımındaki maddi unsurları bilmeyen bir kimse, kasten hareket etmiş olmaz. Bu hata dolayısıyla taksirli sorumluluk hali saklıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir suçun daha ağır veya daha az cezayı gerektiren nitelikli hallerinin gerçekleştiği hususunda hataya düşen kişi, bu hatasından yararlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Ceza sorumluluğunu kaldıran veya azaltan nedenlere ait koşulların gerçekleştiği hususunda kaçınılmaz bir hataya düşen kişi, bu hatasından yararlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>İşlediği fiilin haksızlık oluşturduğu hususunda kaçınılmaz bir hataya düşen kişi, cezalandırılmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="31" başlık="Yaş küçüklüğü">
          <mvz-fıkra no="1">
            <template>Fiili işlediği sırada oniki yaşını doldurmamış olan çocukların ceza sorumluluğu yoktur. Bu kişiler hakkında, ceza kovuşturması yapılamaz; ancak, çocuklara özgü güvenlik tedbirleri uygulanabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiili işlediği sırada oniki yaşını doldurmuş olup da onbeş yaşını doldurmamış olanların işlediği fiilin hukukî anlam ve sonuçlarını algılayamaması veya davranışlarını yönlendirme yeteneğinin yeterince gelişmemiş olması hâlinde ceza sorumluluğu yoktur. Ancak bu kişiler hakkında çocuklara özgü güvenlik tedbirlerine hükmolunur. İşlediği fiilin hukukî anlam ve sonuçlarını algılama ve bu fiille ilgili olarak davranışlarını yönlendirme yeteneğinin varlığı hâlinde, bu kişiler hakkında suç, ağırlaştırılmış müebbet hapis cezasını gerektirdiği takdirde onüç yıldan onsekiz yıla; müebbet hapis cezasını gerektirdiği takdirde on yıldan oniki yıla kadar hapis cezasına hükmolunur. Diğer cezaların yarısı indirilir ve bu hâlde her fiil için verilecek hapis cezası dokuz yıldan fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Fiili işlediği sırada onbeş yaşını doldurmuş olup da onsekiz yaşını doldurmamış olan kişiler hakkında suç, ağırlaştırılmış müebbet hapis cezasını gerektirdiği takdirde ondokuz yıldan yirmiyedi yıla; müebbet hapis cezasını gerektirdiği takdirde onbeş yıldan onsekiz yıla kadar hapis cezasına hükmolunur. Diğer cezaların üçte biri indirilir ve bu hâlde her fiil için verilecek hapis cezası onbeş yıldan fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Somut olayda;</template>
            <mvz-bent no="a">
              <template>Kasta dayalı kusurun ağırlığı,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Güdülen amaç ve saik,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Suçun işleniş şekli,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Daha önceden kasıtlı bir suçtan dolayı hapis cezasına mahkûm edilmiş olma,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>hususlarından biri ya da birkaçı göz önünde bulundurularak kasten öldürme (madde 81, 82) ve neticesi sebebiyle ağırlaşmış yaralama (madde 87, fıkra 2 ve 4) suçlarını işleyen onbeş yaşını doldurmuş olup da onsekiz yaşını doldurmamış olan kişiler hakkında üçüncü fıkra hükümleri uygulanmayabilir. Fiili işlediği sırada oniki yaşını doldurmuş olup da onbeş yaşını doldurmamış ceza sorumluluğu bulunan kişiler hakkında ise ikinci fıkra hükümleri yerine üçüncü fıkra hükümleri uygulanabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="32" başlık="Akıl hastalığı">
          <mvz-fıkra no="1">
            <template>Akıl hastalığı nedeniyle, işlediği fiilin hukuki anlam ve sonuçlarını algılayamayan veya bu fiille ilgili olarak davranışlarını yönlendirme yeteneği önemli derecede azalmış olan kişiye ceza verilmez. Ancak, bu kişiler hakkında güvenlik tedbirine hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada yazılı derecede olmamakla birlikte işlediği fiille ilgili olarak davranışlarını yönlendirme yeteneği azalmış olan kişiye, ağırlaştırılmış müebbet hapis cezası yerine yirmibeş yıl, müebbet hapis cezası yerine yirmi yıl hapis cezası verilir. Diğer hallerde verilecek ceza, altıda birden fazla olmamak üzere indirilebilir. Kişi hakkında ayrıca akıl hastalarına özgü güvenlik tedbirine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="33" başlık="Sağır ve dilsizlik">
          <mvz-fıkra no="1">
            <template>Bu Kanunun, fiili işlediği sırada oniki yaşını doldurmamış olan çocuklara ilişkin hükümleri, onbeş yaşını doldurmamış olan sağır ve dilsizler hakkında; oniki yaşını doldurmuş olup da onbeş yaşını doldurmamış olanlara ilişkin hükümleri, onbeş yaşını doldurmuş olup da onsekiz yaşını doldurmamış olan sağır ve dilsizler hakkında; onbeş yaşını doldurmuş olup da onsekiz yaşını doldurmamış olanlara ilişkin hükümleri, onsekiz yaşını doldurmuş olup da yirmibir yaşını doldurmamış olan sağır ve dilsizler hakkında da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="34" başlık="Geçici nedenler, alkol veya uyuşturucu madde etkisinde olma">
          <mvz-fıkra no="1">
            <template>Geçici bir nedenle ya da irade dışı alınan alkol veya uyuşturucu madde etkisiyle, işlediği fiilin hukuki anlam ve sonuçlarını algılayamayan veya bu fiille ilgili olarak davranışlarını yönlendirme yeteneği önemli derecede azalmış olan kişiye ceza verilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İradi olarak alınan alkol veya uyuşturucu madde etkisinde suç işleyen kişi hakkında birinci fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Suça Teşebbüs">
        <mvz-madde no="35" başlık="Suça teşebbüs">
          <mvz-fıkra no="1">
            <template>Kişi, işlemeyi kastettiği bir suçu elverişli hareketlerle doğrudan doğruya icraya başlayıp da elinde olmayan nedenlerle tamamlayamaz ise teşebbüsten dolayı sorumlu tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suça teşebbüs halinde fail, meydana gelen zarar veya tehlikenin ağırlığına göre, ağırlaştırılmış müebbet hapis cezası yerine ondört yıldan yirmibir yıla kadar, müebbet hapis cezası yerine on yıldan onsekiz yıla kadar hapis cezası ile cezalandırılır. Diğer hallerde verilecek cezanın dörtte birinden dörtte üçüne kadarı indirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="36" başlık="Gönüllü vazgeçme">
          <mvz-fıkra no="1">
            <template>Fail, suçun icra hareketlerinden gönüllü vazgeçer veya kendi çabalarıyla suçun tamamlanmasını veya neticenin gerçekleşmesini önlerse, teşebbüsten dolayı cezalandırılmaz; fakat tamam olan kısım esasen bir suç oluşturduğu takdirde, sadece o suça ait ceza ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Suça İştirak">
        <mvz-madde no="37" başlık="Faillik">
          <mvz-fıkra no="1">
            <template>Suçun kanuni tanımında yer alan fiili birlikte gerçekleştiren kişilerden her biri, fail olarak sorumlu olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun işlenmesinde bir başkasını araç olarak kullanan kişi de fail olarak sorumlu tutulur. Kusur yeteneği olmayanları suçun işlenmesinde araç olarak kullanan kişinin cezası, üçte birden yarısına kadar artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="38" başlık="Azmettirme">
          <mvz-fıkra no="1">
            <template>Başkasını suç işlemeye azmettiren kişi, işlenen suçun cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Üstsoy ve altsoy ilişkisinden doğan nüfuz kullanılmak suretiyle suça azmettirme halinde, azmettirenin cezası üçte birden yarısına kadar artırılır. Çocukların suça azmettirilmesi halinde, bu fıkra hükmüne göre cezanın artırılabilmesi için üstsoy ve altsoy ilişkisinin varlığı aranmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Azmettirenin belli olmaması halinde, kim olduğunun ortaya çıkmasını sağlayan fail veya diğer suç ortağı hakkında ağırlaştırılmış müebbet hapis cezası yerine yirmi yıldan yirmibeş yıla kadar, müebbet hapis cezası yerine onbeş yıldan yirmi yıla kadar hapis cezasına hükmolunabilir. Diğer hallerde verilecek cezada, üçte bir oranında indirim yapılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="39" başlık="Yardım etme">
          <mvz-fıkra no="1">
            <template>Suçun işlenmesine yardım eden kişiye, işlenen suçun ağırlaştırılmış müebbet hapis cezasını gerektirmesi halinde, onbeş yıldan yirmi yıla; müebbet hapis cezasını gerektirmesi halinde, on yıldan onbeş yıla kadar hapis cezası verilir. Diğer hallerde cezanın yarısı indirilir. Ancak, bu durumda verilecek ceza sekiz yılı geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aşağıdaki hallerde kişi işlenen suçtan dolayı yardım eden sıfatıyla sorumlu olur:</template>
            <mvz-bent no="a">
              <template>Suç işlemeye teşvik etmek veya suç işleme kararını kuvvetlendirmek veya fiilin işlenmesinden sonra yardımda bulunacağını vaat etmek.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Suçun nasıl işleneceği hususunda yol göstermek veya fiilin işlenmesinde kullanılan araçları sağlamak.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Suçun işlenmesinden önce veya işlenmesi sırasında yardımda bulunarak icrasını kolaylaştırmak.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="40" başlık="Bağlılık kuralı">
          <mvz-fıkra no="1">
            <template>Suça iştirak için kasten ve hukuka aykırı işlenmiş bir fiilin varlığı yeterlidir. Suçun işlenişine iştirak eden her kişi, diğerinin cezalandırılmasını önleyen kişisel nedenler göz önünde bulundurulmaksızın kendi kusurlu fiiline göre cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Özgü suçlarda, ancak özel faillik niteliğini taşıyan kişi fail olabilir. Bu suçların işlenişine iştirak eden diğer kişiler ise azmettiren veya yardım eden olarak sorumlu tutulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suça iştirakten dolayı sorumlu tutulabilmek için ilgili suçun en azından teşebbüs aşamasına varmış olması gerekir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="41" başlık="İştirak hâlinde işlenen suçlarda gönüllü vazgeçme">
          <mvz-fıkra no="1">
            <template>İştirak halinde işlenen suçlarda, sadece gönüllü vazgeçen suç ortağı, gönüllü vazgeçme hükümlerinden yararlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun;</template>
            <mvz-bent no="a">
              <template>Gönüllü vazgeçenin gösterdiği gayreti dışında başka bir sebeple işlenmemiş olması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Gönüllü vazgeçenin bütün gayretine rağmen işlenmiş olması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Hallerinde de gönüllü vazgeçme hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="5-BEŞİNCİ" başlık="Suçların İçtimaı">
        <mvz-madde no="42" başlık="Bileşik suç">
          <mvz-fıkra no="1">
            <template>Biri diğerinin unsurunu veya ağırlaştırıcı nedenini oluşturması dolayısıyla tek fiil sayılan suça bileşik suç denir. Bu tür suçlarda içtima hükümleri uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="43" başlık="Zincirleme suç">
          <mvz-fıkra no="1">
            <template>Bir suç işleme kararının icrası kapsamında, değişik zamanlarda bir kişiye karşı aynı suçun birden fazla işlenmesi durumunda, bir cezaya hükmedilir. Ancak bu ceza, dörtte birinden dörtte üçüne kadar artırılır. Bir suçun temel şekli ile daha ağır veya daha az cezayı gerektiren nitelikli şekilleri, aynı suç sayılır.  Mağduru belli bir kişi olmayan suçlarda da bu fıkra hükmü uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Aynı suçun birden fazla kişiye karşı tek bir fiille işlenmesi durumunda da, birinci fıkra hükmü uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kasten öldürme, kasten yaralama, işkence ve yağma suçlarında bu madde hükümleri uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="44" başlık="Fikri içtima">
          <mvz-fıkra no="1">
            <template>İşlediği bir fiil ile birden fazla farklı suçun oluşmasına sebebiyet veren kişi, bunlardan en ağır cezayı gerektiren suçtan dolayı cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
    </mvz-kısım>
    <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Yaptırımlar">
      <mvz-bölüm no="1-BİRİNCİ" başlık="Cezalar">
        <mvz-madde no="45" başlık="Cezalar">
          <mvz-fıkra no="1">
            <template>Suç karşılığında uygulanan yaptırım olarak cezalar, hapis ve adlî para cezalarıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="46" başlık="Hapis cezaları">
          <mvz-fıkra no="1">
            <template>Hapis cezaları şunlardır:</template>
            <mvz-bent no="a">
              <template>Ağırlaştırılmış müebbet hapis cezası.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Müebbet hapis cezası.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Süreli hapis cezası.</template>
            </mvz-bent>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="47" başlık="Ağırlaştırılmış müebbet hapis cezası">
          <mvz-fıkra no="1">
            <template>Ağırlaştırılmış müebbet hapis cezası hükümlünün hayatı boyunca devam eder, kanun ve Cumhurbaşkanınca çıkarılan yönetmelikte belirtilen sıkı güvenlik rejimine göre çektirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="48" başlık="Müebbet hapis cezası">
          <mvz-fıkra no="1">
            <template>Müebbet hapis cezası, hükümlünün hayatı boyunca devam eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="49" başlık="Süreli hapis cezası">
          <mvz-fıkra no="1">
            <template>Süreli hapis cezası, kanunda aksi belirtilmeyen hallerde bir aydan az, yirmi yıldan fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükmedilen bir yıl veya daha az süreli hapis cezası, kısa süreli hapis cezasıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="50" başlık="Kısa süreli hapis cezasına seçenek yaptırımlar">
          <mvz-fıkra no="1">
            <template>Kısa süreli hapis cezası, suçlunun kişiliğine, sosyal ve ekonomik durumuna, yargılama sürecinde duyduğu pişmanlığa ve suçun işlenmesindeki özelliklere göre;</template>
            <mvz-bent no="a">
              <template>Adlî para cezasına,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Mağdurun veya kamunun uğradığı zararın aynen iade, suçtan önceki hale getirme veya tazmin suretiyle, tamamen giderilmesine,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>En az iki yıl süreyle, bir meslek veya sanat edinmeyi sağlamak amacıyla, gerektiğinde barınma imkanı da bulunan bir eğitim kurumuna devam etmeye,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Mahkûm olunan cezanın yarısından bir katına kadar süreyle, belirli yerlere gitmekten veya belirli etkinlikleri yapmaktan yasaklanmaya,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Sağladığı hak ve yetkiler kötüye kullanılmak suretiyle veya gerektirdiği dikkat ve özen yükümlülüğüne aykırı davranılarak suç işlenmiş olması durumunda; mahkûm olunan cezanın yarısından bir katına kadar süreyle, ilgili ehliyet ve ruhsat belgelerinin geri alınmasına, belli bir meslek ve sanatı yapmaktan yasaklanmaya,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Mahkûm olunan cezanın yarısından bir katına kadar süreyle ve gönüllü olmak koşuluyla kamuya yararlı bir işte çalıştırılmaya,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>çevrilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suç tanımında hapis cezası ile adlî para cezasının seçenek olarak öngörüldüğü hallerde, hapis cezasına hükmedilmişse; bu ceza artık adlî para cezasına çevrilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Daha önce hapis cezasına mahkûm edilmemiş olmak koşuluyla, mahkûm olunan otuz gün ve daha az süreli hapis cezası ile fiili işlediği tarihte onsekiz yaşını doldurmamış veya altmışbeş yaşını bitirmiş bulunanların mahkûm edildiği bir yıl veya daha az süreli hapis cezası, birinci fıkrada yazılı seçenek yaptırımlardan birine çevrilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Taksirli suçlardan dolayı hükmolunan hapis cezası uzun süreli de olsa; bu ceza, diğer koşulların varlığı halinde, birinci fıkranın (a) bendine göre adlî para cezasına çevrilebilir. Ancak, bu hüküm, bilinçli taksir halinde uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Uygulamada asıl mahkûmiyet, bu madde hükümlerine göre çevrilen adlî para cezası veya tedbirdir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Hüküm kesinleştikten sonra Cumhuriyet savcılığınca yapılan tebligata rağmen otuz gün içinde seçenek tedbirin gereklerinin yerine getirilmesine başlanmaması veya başlanıp da devam edilmemesi halinde, infaz hâkimliği kısa süreli hapis cezasının tamamen veya kısmen infazına karar verir ve bu karar derhal infaz edilir. Bu durumda, beşinci fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Hükmedilen seçenek tedbirin hükümlünün elinde olmayan nedenlerle yerine getirilememesi durumunda, infaz hâkimliğince tedbir değiştirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="51" başlık="Hapis cezasının ertelenmesi">
          <mvz-fıkra no="1">
            <template>İşlediği suçtan dolayı iki yıl veya daha az süreyle hapis cezasına mahkûm edilen kişinin cezası ertelenebilir. Bu sürenin üst sınırı, fiili işlediği sırada onsekiz yaşını doldurmamış veya altmışbeş yaşını bitirmiş olan kişiler bakımından üç yıldır. Ancak, erteleme kararının verilebilmesi için kişinin;</template>
            <mvz-bent no="a">
              <template>Daha önce kasıtlı bir suçtan dolayı üç aydan fazla hapis cezasına mahkûm edilmemiş olması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Suçu işledikten sonra yargılama sürecinde gösterdiği pişmanlık dolayısıyla tekrar suç işlemeyeceği konusunda mahkemede bir kanaatin oluşması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cezanın ertelenmesi, mağdurun veya kamunun uğradığı zararın aynen iade, suçtan önceki hale getirme veya tazmin suretiyle tamamen giderilmesi koşuluna bağlı tutulabilir. Bu durumda, koşul gerçekleşinceye kadar cezanın infaz kurumunda çektirilmesine devam edilir. Koşulun yerine getirilmesi halinde, infaz hâkimi kararıyla hükümlü infaz kurumundan derhal salıverilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cezası ertelenen hükümlü hakkında, bir yıldan az, üç yıldan fazla olmamak üzere, bir denetim süresi belirlenir. Bu sürenin alt sınırı, mahkûm olunan ceza süresinden az olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Denetim süresi içinde;</template>
            <mvz-bent no="a">
              <template>Bir meslek veya sanat sahibi olmayan hükümlünün, bu amaçla bir eğitim programına devam etmesine,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Bir meslek veya sanat sahibi hükümlünün, bir kamu kurumunda veya özel olarak aynı meslek veya sanatı icra eden bir başkasının gözetimi altında ücret karşılığında çalıştırılmasına,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Onsekiz yaşından küçük olan hükümlülerin, bir meslek veya sanat edinmelerini sağlamak amacıyla, gerektiğinde barınma imkanı da bulunan bir eğitim kurumuna devam etmesine,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>mahkemece karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Mahkeme, denetim süresi içinde hükümlüye rehberlik edecek bir uzman kişiyi görevlendirebilir. Bu kişi, kötü alışkanlıklardan kurtulmasını ve sorumluluk bilinciyle iyi bir hayat sürmesini temin hususunda hükümlüye öğütte bulunur; eğitim gördüğü kurum yetkilileri veya nezdinde çalıştığı kişilerle görüşerek, istişarelerde bulunur; hükümlünün davranışları, sosyal uyumu ve sorumluluk bilincindeki gelişme hakkında üçer aylık sürelerle rapor düzenleyerek infaz hâkimine verir.8</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Mahkeme, hükümlünün kişiliğini ve sosyal durumunu göz önünde bulundurarak, denetim süresinin herhangi bir yükümlülük belirlemeden veya uzman kişi görevlendirmeden geçirilmesine de karar verebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Hükümlünün denetim süresi içinde kasıtlı bir suç işlemesi veya kendisine yüklenen yükümlülüklere, infaz hâkiminin uyarısına rağmen, uymamakta ısrar etmesi halinde; ertelenen cezanın kısmen veya tamamen infaz kurumunda çektirilmesine infaz hâkimliğince karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Denetim süresi yükümlülüklere uygun veya iyi halli olarak geçirildiği takdirde, ceza infaz edilmiş sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="52" başlık="Adlî para cezası">
          <mvz-fıkra no="1">
            <template>Adlî para cezası, beş günden az ve kanunda aksine hüküm bulunmayan hallerde yediyüzotuz günden fazla olmamak üzere belirlenen tam gün sayısının, bir gün karşılığı olarak takdir edilen miktar ile çarpılması suretiyle hesaplanan meblağın hükümlü tarafından Devlet Hazinesine ödenmesinden ibarettir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>En az yüz ve en fazla beşyüz Türk Lirası olan bir gün karşılığı adlî para cezasının miktarı, kişinin ekonomik ve diğer şahsi halleri göz önünde bulundurularak takdir edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Kararda, adlî para cezasının belirlenmesinde esas alınan tam gün sayısı ile bir gün karşılığı olarak takdir edilen miktar ayrı ayrı gösterilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Hakim, ekonomik ve şahsi hallerini göz önünde bulundurarak, kişiye adlî para cezasını ödemesi için hükmün kesinleşme tarihinden itibaren bir yıldan fazla olmamak üzere mehil verebileceği gibi, bu cezanın belirli taksitler halinde ödenmesine de karar verebilir. Taksit süresi iki yılı geçemez ve taksit miktarı dörtten az olamaz. Kararda, taksitlerden birinin zamanında ödenmemesi halinde geri kalan kısmın tamamının tahsil edileceği ve ödenmeyen adlî para cezasının hapse çevrileceği belirtilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="2-İKİNCİ" başlık="Güvenlik Tedbirleri">
        <mvz-madde no="53" başlık="Belli hakları kullanmaktan yoksun bırakılma">
          <mvz-fıkra no="1">
            <template>Kişi, kasten işlemiş olduğu suçtan dolayı hapis cezasına mahkûmiyetin kanuni sonucu olarak;</template>
            <mvz-bent no="a">
              <template>Sürekli, süreli veya geçici bir kamu görevinin üstlenilmesinden; bu kapsamda, Türkiye Büyük Millet Meclisi üyeliğinden veya Devlet, il, belediye, köy veya bunların denetim ve gözetimi altında bulunan kurum ve kuruluşlarca verilen, atamaya veya seçime tabi bütün memuriyet ve hizmetlerde istihdam edilmekten,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Seçme ve seçilme ehliyetinden,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Velayet hakkından; vesayet veya kayyımlığa ait bir hizmette bulunmaktan,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Vakıf, dernek, sendika, şirket, kooperatif ve siyasi parti tüzel kişiliklerinin yöneticisi veya denetçisi olmaktan,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Bir kamu kurumunun veya kamu kurumu niteliğindeki meslek kuruluşunun iznine tabi bir meslek veya sanatı, kendi sorumluluğu altında serbest meslek erbabı veya tacir olarak icra etmekten,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>yoksun bırakılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Kişi, işlemiş bulunduğu suç dolayısıyla mahkûm olduğu hapis cezasının infazı tamamlanıncaya kadar bu hakları kullanamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Mahkûm olduğu hapis cezası ertelenen veya denetimli serbestlik tedbiri uygulanarak cezası infaz edilen ya da koşullu salıverilen hükümlünün kendi altsoyu üzerindeki velayet, vesayet ve kayyımlık yetkileri açısından yukarıdaki fıkralar hükümleri uygulanmaz. Mahkûm olduğu hapis cezası ertelenen veya denetimli serbestlik tedbiri uygulanarak cezası infaz edilen ya da koşullu salıverilen hükümlü hakkında birinci fıkranın (e) bendinde söz konusu edilen hak yoksunluğunun uygulanmamasına karar verilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kısa süreli hapis cezası ertelenmiş veya fiili işlediği sırada onsekiz yaşını doldurmamış olan kişiler hakkında birinci fıkra hükmü uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Birinci fıkrada sayılan hak ve yetkilerden birinin kötüye kullanılması suretiyle işlenen suçlar dolayısıyla hapis cezasına mahkûmiyet halinde, ayrıca, cezanın infazından sonra işlemek üzere, hükmolunan cezanın yarısından bir katına kadar bu hak ve yetkinin kullanılmasının yasaklanmasına karar verilir. Bu hak ve yetkilerden birinin kötüye kullanılması suretiyle işlenen suçlar dolayısıyla sadece adlî para cezasına mahkûmiyet halinde, hükümde belirtilen gün sayısının yarısından bir katına kadar bu hak ve yetkinin kullanılmasının yasaklanmasına karar verilir. Hükmün kesinleşmesiyle icraya konan yasaklama ile ilgili süre, adlî para cezasının tamamen infazından itibaren işlemeye başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Belli bir meslek veya sanatın ya da trafik düzeninin gerektirdiği dikkat ve özen yükümlülüğüne aykırılık dolayısıyla işlenen taksirli suçtan mahkûmiyet halinde, üç aydan az ve üç yıldan fazla olmamak üzere, bu meslek veya sanatın icrasının yasaklanmasına ya da sürücü belgesinin geri alınmasına karar verilebilir. Yasaklama ve geri alma hükmün kesinleşmesiyle yürürlüğe girer ve süre, cezanın tümüyle infazından itibaren işlemeye başlar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="54" başlık="Eşya müsaderesi">
          <mvz-fıkra no="1">
            <template>İyiniyetli üçüncü kişilere ait olmamak koşuluyla, kasıtlı bir suçun işlenmesinde kullanılan veya suçun işlenmesine tahsis edilen ya da suçtan meydana gelen eşyanın müsaderesine hükmolunur. Suçun işlenmesinde kullanılmak üzere hazırlanan eşya, kamu güvenliği, kamu sağlığı veya genel ahlak açısından tehlikeli olması durumunda müsadere edilir.  Eşyanın üzerinde iyiniyetli üçüncü kişiler lehine tesis edilmiş sınırlı ayni hakkın bulunması hâlinde müsadere kararı, bu hak saklı kalmak şartıyla verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkra kapsamına giren eşyanın, ortadan kaldırılması, elden çıkarılması, tüketilmesi veya müsaderesinin başka bir surette imkansız kılınması halinde; bu eşyanın değeri kadar para tutarının müsaderesine karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suçta kullanılan eşyanın müsadere edilmesinin işlenen suça nazaran daha ağır sonuçlar doğuracağı ve bu nedenle hakkaniyete aykırı olacağı anlaşıldığında, müsaderesine hükmedilmeyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Üretimi, bulundurulması, kullanılması, taşınması, alım ve satımı suç oluşturan eşya, müsadere edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bir şeyin sadece bazı kısımlarının müsaderesi gerektiğinde, tümüne zarar verilmeksizin bu kısmı ayırmak olanaklı ise, sadece bu kısmın müsaderesine karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Birden fazla kişinin paydaş olduğu eşya ile ilgili olarak, sadece suça iştirak eden kişinin payının müsaderesine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="55" başlık="Kazanç müsaderesi">
          <mvz-fıkra no="1">
            <template>Suçun işlenmesi ile elde edilen veya suçun konusunu oluşturan ya da suçun işlenmesi için sağlanan maddi menfaatler ile bunların değerlendirilmesi veya dönüştürülmesi sonucu ortaya çıkan ekonomik kazançların müsaderesine karar verilir. Bu fıkra hükmüne göre müsadere kararı verilebilmesi için maddi menfaatin suçun mağduruna iade edilememesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Müsadere konusu eşya veya maddi menfaatlere elkonulamadığı veya bunların merciine teslim edilmediği hallerde, bunların karşılığını oluşturan değerlerin müsaderesine hükmedilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu madde kapsamına giren eşyanın müsadere edilebilmesi için, eşyayı sonradan iktisap eden kişinin 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanununun iyiniyetin korunmasına ilişkin hükümlerinden yararlanamıyor olması gerekir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="56" başlık="Çocuklara özgü güvenlik tedbirleri">
          <mvz-fıkra no="1">
            <template>Çocuklara özgü güvenlik tedbirlerinin neler olduğu ve ne suretle uygulanacakları ilgili kanunda gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="57" başlık="Akıl hastalarına özgü güvenlik tedbirleri">
          <mvz-fıkra no="1">
            <template>Fiili işlediği sırada akıl hastası olan kişi hakkında, koruma ve tedavi amaçlı olarak güvenlik tedbirine hükmedilir. Hakkında güvenlik tedbirine hükmedilen akıl hastaları, yüksek güvenlikli sağlık kurumlarında koruma ve tedavi altına alınırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hakkında güvenlik tedbirine hükmedilmiş olan akıl hastası, yerleştirildiği kurumun sağlık kurulunca düzenlenen raporda toplum açısından tehlikeliliğinin ortadan kalktığının veya önemli ölçüde azaldığının belirtilmesi üzerine infaz hâkimi kararıyla serbest bırakılabilir. Ancak, hakkında 32 nci maddenin birinci fıkrası uyarınca güvenlik tedbirine hükmedilen akıl hastaları için kurumda geçirilecek süre, ağırlaştırılmış müebbet hapis ve müebbet hapis cezasını gerektiren suçlarda bir yıldan, üst sınırı on yıldan fazla hapis cezasını gerektiren suçlarda ise altı aydan az olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Sağlık kurulu raporunda, akıl hastalığının ve işlenen fiilin niteliğine göre, güvenlik bakımından kişinin tıbbi kontrol ve takibinin gerekip gerekmediği, gerekiyor ise, bunun süre ve aralıkları belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Tıbbi kontrol ve takip, raporda gösterilen süre ve aralıklarla, Cumhuriyet savcılığınca bu kişilerin teknik donanımı ve yetkili uzmanı olan sağlık kuruluşuna gönderilmeleri ile sağlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Tıbbi kontrol ve takipte, kişinin akıl hastalığı itibarıyla toplum açısından tehlikeliliğinin arttığı anlaşıldığında, hazırlanan rapora dayanılarak, infaz hâkimliğince yeniden koruma ve tedavi amaçlı olarak güvenlik tedbirine hükmedilir. Bu durumda, bir ve devamı fıkralarda belirlenen işlemler tekrarlanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6" durum="mülga">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Suç işleyen alkol ya da uyuşturucu veya uyarıcı madde bağımlısı kişilerin, güvenlik tedbiri olarak, alkol ya da uyuşturucu veya uyarıcı madde bağımlılarına özgü sağlık kuruluşunda tedavi altına alınmasına karar verilir. Bu kişilerin tedavisi, alkol ya da uyuşturucu veya uyarıcı madde bağımlılığından kurtulmalarına kadar devam eder. Bu kişiler, yerleştirildiği kurumun sağlık kurulunca bu yönde düzenlenecek rapor üzerine infaz hâkimi kararıyla serbest bırakılabilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="58" başlık="Suçta tekerrür ve özel tehlikeli suçlular">
          <mvz-fıkra no="1">
            <template>Önceden işlenen suçtan dolayı verilen hüküm kesinleştikten sonra yeni bir suçun işlenmesi halinde, tekerrür hükümleri uygulanır. Bunun için cezanın infaz edilmiş olması gerekmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Tekerrür hükümleri, önceden işlenen suçtan dolayı;</template>
            <mvz-bent no="a">
              <template>Beş yıldan fazla süreyle hapis cezasına mahkûmiyet halinde, bu cezanın infaz edildiği tarihten itibaren beş yıl,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Beş yıl veya daha az süreli hapis ya da adlî para cezasına mahkûmiyet halinde, bu cezanın infaz edildiği tarihten itibaren üç yıl,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>geçtikten sonra işlenen suçlar dolayısıyla uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tekerrür halinde, sonraki suça ilişkin kanun maddesinde seçimlik olarak hapis cezası ile adlî para cezası öngörülmüşse, hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kasıtlı suçlarla taksirli suçlar ve sırf askerî suçlarla diğer suçlar arasında tekerrür hükümleri uygulanmaz. Kasten öldürme, kasten yaralama, yağma, dolandırıcılık, uyuşturucu veya uyarıcı madde imal ve ticareti ile parada veya kıymetli damgada sahtecilik suçları hariç olmak üzere; yabancı ülke mahkemelerinden verilen hükümler tekerrüre esas olmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Fiili işlediği sırada onsekiz yaşını doldurmamış olan kişilerin işlediği suçlar dolayısıyla tekerrür hükümleri uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Tekerrür halinde hükmolunan ceza, mükerrirlere özgü infaz rejimine göre çektirilir. Ayrıca, mükerrir hakkında cezanın infazından sonra denetimli serbestlik tedbiri uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Mahkûmiyet kararında, hükümlü hakkında mükerrirlere özgü infaz rejiminin ve cezanın infazından sonra denetimli serbestlik tedbirinin uygulanacağı belirtilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Mükerrirlerin mahkûm olduğu cezanın infazı ile denetimli serbestlik tedbirinin uygulanması, kanunda gösterilen şekilde yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Mükerrirlere özgü infaz rejiminin ve cezanın infazından sonra denetimli serbestlik tedbirinin, itiyadi suçlu, suçu meslek edinen kişi veya örgüt mensubu suçlu hakkında da uygulanmasına hükmedilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="59" başlık="Sınır dışı edilme">
          <mvz-fıkra no="1">
            <template>İşlediği suç nedeniyle hapis cezasına mahkûm edilen yabancı, denetimli serbestlik tedbiri uygulanarak cezasının infazına veya koşullu salıverilmesine karar verildikten ve her halde cezasının infazı tamamlandıktan sonra, durumu, sınır dışı işlemleriyle ilgili olarak değerlendirilmek üzere derhal İçişleri Bakanlığına bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="60" başlık="Tüzel kişiler hakkında güvenlik tedbirleri">
          <mvz-fıkra no="1">
            <template>Bir kamu kurumunun verdiği izne dayalı olarak faaliyette bulunan özel hukuk tüzel kişisinin organ veya temsilcilerinin iştirakiyle ve bu iznin verdiği yetkinin kötüye kullanılması suretiyle tüzel kişi yararına işlenen kasıtlı suçlardan mahkûmiyet halinde, iznin iptaline karar verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Müsadere hükümleri, yararına işlenen suçlarda özel hukuk tüzel kişileri hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yukarıdaki fıkralar hükümlerinin uygulanmasının işlenen fiile nazaran daha ağır sonuçlar ortaya çıkarabileceği durumlarda, hakim bu tedbirlere hükmetmeyebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu madde hükümleri kanunun ayrıca belirttiği hallerde uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Cezanın Belirlenmesi ve Bireyselleştirilmesi">
        <mvz-madde no="61" başlık="Cezanın belirlenmesi">
          <mvz-fıkra no="1">
            <template>Hakim, somut olayda;</template>
            <mvz-bent no="a">
              <template>Suçun işleniş biçimini,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Suçun işlenmesinde kullanılan araçları,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Suçun işlendiği zaman ve yeri,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Suçun konusunun önem ve değerini,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Meydana gelen zarar veya tehlikenin ağırlığını,</template>
            </mvz-bent>
            <mvz-bent no="f">
              <template>Failin kast veya taksire dayalı kusurunun ağırlığını,</template>
            </mvz-bent>
            <mvz-bent no="g">
              <template>Failin güttüğü amaç ve saiki,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>Göz önünde bulundurarak, işlenen suçun kanuni tanımında öngörülen cezanın alt ve üst sınırı arasında temel cezayı belirler.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun olası kastla ya da bilinçli taksirle işlenmesi nedeniyle indirim veya artırım, birinci fıkra hükmüne göre belirlenen ceza üzerinden yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Birinci fıkrada belirtilen hususların suçun unsurunu oluşturduğu hallerde, bunlar temel cezanın belirlenmesinde ayrıca göz önünde bulundurulmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bir suçun temel şekline nazaran daha ağır veya daha az cezayı gerektiren birden fazla nitelikli hallerin gerçekleşmesi durumunda; temel cezada önce artırma sonra indirme yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Yukarıdaki fıkralara göre belirlenen ceza üzerinden sırasıyla teşebbüs, iştirak, zincirleme suç, haksız tahrik, yaş küçüklüğü, akıl hastalığı ve cezada indirim yapılmasını gerektiren şahsi sebeplere ilişkin hükümler ile takdiri indirim nedenleri uygulanarak sonuç ceza belirlenir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Hapis cezasının süresi gün, ay ve yıl hesabıyla belirlenir. Bir gün, yirmidört saat; bir ay, otuz gündür. Yıl, resmi takvime göre hesap edilir. Hapis cezası için bir günün, adlî para cezası için bir Türk Lirasının artakalanı hesaba katılmaz ve bu cezalar infaz edilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Süreli hapis cezasını gerektiren bir suçtan dolayı bu madde hükümlerine göre belirlenen sonuç ceza, otuz yıldan fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="8">
            <template>Adlî para cezası hesaplanırken, bu madde hükmüne göre cezanın belirlenmesi ve bireyselleştirilmesine yönelik artırma ve indirimler, gün üzerinden yapılır. Adlî para cezası, belirlenen sonuç gün ile kişinin bir gün karşılığı ödeyebileceği miktarın çarpılması suretiyle bulunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="9">
            <template>Adlî para cezasının seçimlik ceza olarak öngörüldüğü suçlarda bu cezaya ilişkin gün biriminin alt sınırı, o suç tanımındaki hapis cezasının alt sınırından az; üst sınırı da, hapis cezasının üst sınırından fazla olamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="10">
            <template>Kanunda açıkça yazılmış olmadıkça cezalar ne artırılabilir, ne eksiltilebilir, ne de değiştirilebilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="62" başlık="Takdiri indirim nedenleri">
          <mvz-fıkra no="1">
            <template>Fail yararına cezayı hafifletecek takdiri nedenlerin varlığı halinde, ağırlaştırılmış müebbet hapis cezası yerine, müebbet hapis; müebbet hapis cezası yerine, yirmibeş yıl hapis cezası verilir. Diğer cezaların altıda birine kadarı indirilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Takdiri indirim nedeni olarak, failin geçmişi, sosyal ilişkileri, fiilden sonraki ve yargılama sürecindeki pişmanlığını gösteren davranışları veya cezanın failin geleceği üzerindeki olası etkileri  göz önünde bulundurulabilir.  Ancak failin duruşmadaki mahkemeyi etkilemeye yönelik şeklî tutum ve davranışları, takdiri indirim nedeni olarak dikkate alınmaz. Takdiri indirim nedenleri kararda gerekçeleriyle gösterilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="63" başlık="Mahsup">
          <mvz-fıkra no="1">
            <template>Hüküm kesinleşmeden önce gerçekleşen ve şahsi hürriyeti sınırlama sonucunu doğuran bütün haller nedeniyle geçirilmiş süreler, hükmolunan hapis cezasından indirilir. Adlî para cezasına hükmedilmesi durumunda, bir gün beşyüz Türk Lirası sayılmak üzere, bu cezadan indirim yapılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Dava ve Cezanın Düşürülmesi">
        <mvz-madde no="64" başlık="Sanığın veya hükümlünün ölümü">
          <mvz-fıkra no="1">
            <template>Sanığın ölümü halinde kamu davasının düşürülmesine karar verilir. Ancak, niteliği itibarıyla müsadereye tabi eşya ve maddi menfaatler hakkında davaya devam olunarak bunların müsaderesine hükmolunabilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Hükümlünün ölümü, hapis ve henüz infaz edilmemiş adlî para cezalarını ortadan kaldırır. Ancak, müsadereye ve yargılama giderlerine ilişkin olup ölümden önce kesinleşmiş bulunan hüküm, infaz olunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="65" başlık="Af">
          <mvz-fıkra no="1">
            <template>Genel af halinde, kamu davası düşer, hükmolunan cezalar bütün neticeleri ile birlikte ortadan kalkar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Özel af ile hapis cezasının infaz kurumunda çektirilmesine son verilebilir veya infaz kurumunda çektirilecek süresi kısaltılabilir ya da adlî para cezasına çevrilebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Cezaya bağlı olan veya hükümde belirtilen hak yoksunlukları, özel affa rağmen etkisini devam ettirir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="66" başlık="Dava zamanaşımı">
          <mvz-fıkra no="1">
            <template>Kanunda başka türlü yazılmış olan haller dışında kamu davası;</template>
            <mvz-bent no="a">
              <template>Ağırlaştırılmış müebbet hapis cezasını gerektiren suçlarda otuz yıl,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Müebbet hapis cezasını gerektiren suçlarda yirmibeş yıl,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Yirmi yıldan aşağı olmamak üzere hapis cezasını gerektiren suçlarda yirmi yıl,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Beş yıldan fazla ve yirmi yıldan az hapis cezasını gerektiren suçlarda onbeş yıl,</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Beş yıldan fazla olmamak üzere hapis veya adlî para cezasını gerektiren suçlarda sekiz yıl,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>geçmesiyle düşer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiili işlediği sırada oniki yaşını doldurmuş olup da onbeş yaşını doldurmamış olanlar hakkında, bu sürelerin yarısının; onbeş yaşını doldurmuş olup da onsekiz yaşını doldurmamış olan kişiler hakkında ise, üçte ikisinin geçmesiyle kamu davası düşer.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Dava zamanaşımı süresinin belirlenmesinde dosyadaki mevcut deliller itibarıyla suçun daha ağır cezayı gerektiren nitelikli halleri de göz önünde bulundurulur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yukarıdaki fıkralarda yer alan sürelerin belirlenmesinde suçun kanunda yer alan cezasının yukarı sınırı göz önünde bulundurulur; seçimlik cezaları gerektiren suçlarda zamanaşımı bakımından hapis cezası esas alınır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Aynı fiilden dolayı tekrar yargılamayı gerektiren hallerde, mahkemece bu husustaki talebin kabul edildiği tarihten itibaren fiile ilişkin zamanaşımı süresi yeni baştan işlemeye başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Zamanaşımı, tamamlanmış suçlarda suçun işlendiği günden, teşebbüs halinde kalan suçlarda son hareketin yapıldığı günden, kesintisiz suçlarda kesintinin gerçekleştiği ve zincirleme suçlarda son suçun işlendiği günden, çocuklara karşı üstsoy veya bunlar üzerinde hüküm ve nüfuzu olan kimseler tarafından işlenen suçlarda çocuğun onsekiz yaşını bitirdiği günden itibaren işlemeye başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Bu Kanunun İkinci Kitabının Dördüncü Kısmında yazılı ağırlaştırılmış müebbet veya müebbet veya on yıldan fazla hapis cezalarını gerektiren suçların yurt dışında işlenmesi halinde dava zamanaşımı uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="67" başlık="Dava zamanaşımı süresinin durması veya kesilmesi">
          <mvz-fıkra no="1">
            <template>Soruşturma ve kovuşturma yapılmasının, izin veya karar alınması veya diğer bir mercide çözülmesi gereken bir meselenin sonucuna bağlı bulunduğu hallerde; izin veya kararın alınmasına veya meselenin çözümüne veya kanun gereğince hakkında kaçak olduğu hususunda karar verilmiş olan suç faili hakkında bu karar kaldırılıncaya kadar dava zamanaşımı durur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir suçla ilgili olarak;</template>
            <mvz-bent no="a">
              <template>Şüpheli veya sanıklardan birinin savcı huzurunda ifadesinin alınması veya sorguya çekilmesi,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Şüpheli veya sanıklardan biri hakkında tutuklama kararının verilmesi,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Suçla ilgili olarak iddianame düzenlenmesi,</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Sanıklardan bir kısmı hakkında da olsa, mahkûmiyet kararı verilmesi,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>halinde, dava zamanaşımı kesilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Dava zamanaşımı kesildiğinde, zamanaşımı süresi yeniden işlemeye başlar. Dava zamanaşımını kesen birden fazla nedenin bulunması halinde, zamanaşımı süresi son kesme nedeninin gerçekleştiği tarihten itibaren yeniden işlemeye başlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Kesilme halinde, zamanaşımı süresi ilgili suça ilişkin olarak Kanunda belirlenen sürenin en fazla yarısına kadar uzar.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="68" başlık="Ceza zamanaşımı">
          <mvz-fıkra no="1">
            <template>Bu maddede yazılı cezalar aşağıdaki sürelerin geçmesiyle infaz edilmez:</template>
            <mvz-bent no="a">
              <template>Ağırlaştırılmış müebbet hapis cezalarında kırk yıl.</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Müebbet hapis cezalarında otuz yıl.</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Yirmi yıl ve daha fazla süreli hapis cezalarında yirmidört yıl.</template>
            </mvz-bent>
            <mvz-bent no="d">
              <template>Beş yıldan fazla hapis cezalarında yirmi yıl.</template>
            </mvz-bent>
            <mvz-bent no="e">
              <template>Beş yıla kadar hapis ve adlî para cezalarında on yıl.</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiili işlediği sırada oniki yaşını doldurmuş olup da onbeş yaşını doldurmamış olanlar hakkında, bu sürelerin yarısının; onbeş yaşını doldurmuş olup da onsekiz yaşını doldurmamış olan kişiler hakkında ise, üçte ikisinin geçmesiyle ceza infaz edilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu Kanunun İkinci Kitabının Dördüncü Kısmında yazılı yurt dışında işlenmiş suçlar dolayısıyla verilmiş ağırlaştırılmış müebbet hapis veya müebbet hapis veya on yıldan fazla hapis cezalarında zamanaşımı uygulanmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Türleri başka başka cezaları içeren hükümler, en ağır ceza için konulan sürenin geçmesiyle infaz edilmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Ceza zamanaşımı, hükmün kesinleştiği veya infazın herhangi bir suretle kesintiye uğradığı günden itibaren işlemeye başlar ve kalan ceza miktarı esas alınarak süre hesaplanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="69" başlık="Ceza zamanaşımı ve hak yoksunlukları">
          <mvz-fıkra no="1">
            <template>Cezaya bağlı olan veya hükümde belirtilen hak yoksunluklarının süresi ceza zamanaşımı doluncaya kadar devam eder.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="70" başlık="Müsaderede zamanaşımı">
          <mvz-fıkra no="1">
            <template>Müsadereye ilişkin hüküm, kesinleşmeden itibaren yirmi yıl geçtikten sonra infaz edilmez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="71" başlık="Ceza zamanaşımının kesilmesi">
          <mvz-fıkra no="1">
            <template>Mahkûmiyet hükmünün infazı için yetkili merci tarafından hükümlüye kanuna göre yapılan tebligat veya bu maksatla hükümlünün yakalanması ceza zamanaşımını keser.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir suçtan dolayı mahkûm olan kimse üst sınırı iki yıldan fazla hapis cezasını gerektiren kasıtlı bir suç işlediği takdirde, ceza zamanaşımı kesilir.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="72" başlık="Zamanaşımının hesabı ve uygulanması">
          <mvz-fıkra no="1">
            <template>Dava ve ceza zamanaşımı süreleri gün, ay ve yıl hesabıyla belirlenir. Bir gün, yirmidört saat; bir ay, otuz gündür. Yıl, resmi takvime göre hesap edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Dava ve ceza zamanaşımı re'sen uygulanır ve bundan şüpheli, sanık ve hükümlü vazgeçemezler.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="73" başlık="Soruşturulması ve kovuşturulması şikayete bağlı suçlar">
          <mvz-fıkra no="1">
            <template>Soruşturulması ve kovuşturulması şikayete bağlı olan suç hakkında yetkili kimse altı ay içinde şikayette bulunmadığı takdirde soruşturma ve kovuşturma yapılamaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Zamanaşımı süresini geçmemek koşuluyla bu süre, şikayet hakkı olan kişinin fiili ve failin kim olduğunu bildiği veya öğrendiği günden başlar.  Ancak, soruşturulması ve kovuşturulması şikâyete bağlı olan hakaret suçu bakımından şikâyet süresi, her ne suretle olursa olsun fiilin gerçekleştiği tarihten itibaren iki yılı geçemez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Şikayet hakkı olan birkaç kişiden birisi altı aylık süreyi geçirirse bundan dolayı diğerlerinin hakları düşmez.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
