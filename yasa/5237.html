      <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Devletin Egemenlik Alametlerine ve Organlarının Saygınlığına Karşı Suçlar">
        <mvz-madde no="299" başlık="Cumhurbaşkanına hakaret">
          <mvz-fıkra no="1">
            <template>Cumhurbaşkanına hakaret eden kişi, bir yıldan dört yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun alenen işlenmesi hâlinde, verilecek ceza altıda biri oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu suçtan dolayı kovuşturma yapılması, Adalet Bakanının iznine bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="300" başlık="Devletin egemenlik alametlerini aşağılama">
          <mvz-fıkra no="1">
            <template>Türk Bayrağını yırtarak, yakarak veya sair surette ve alenen aşağılayan kişi, bir yıldan üç yıla kadar hapis cezası ile cezalandırılır. Bu hüküm, Anayasada belirlenen beyaz ay yıldızlı al bayrak özelliklerini taşıyan ve Türkiye Cumhuriyeti Devletinin egemenlik alameti olarak kullanılan her türlü işaret hakkında uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İstiklal Marşını alenen aşağılayan kişi, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddede tanımlanan suçların yabancı bir ülkede bir Türk vatandaşı tarafından işlenmesi halinde, verilecek ceza üçte bir oranında artırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="301" başlık="Türk Milletini, Türkiye Cumhuriyeti Devletini, Devletin kurum ve organlarını aşağılama">
          <mvz-fıkra no="1">
            <template>Türk Milletini, Türkiye Cumhuriyeti Devletini, Türkiye Büyük Millet Meclisini, Türkiye Cumhuriyeti Hükümetini ve Devletin yargı organlarını alenen aşağılayan kişi, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Devletin askerî veya emniyet teşkilatını alenen aşağılayan kişi, birinci fıkra hükmüne göre cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Eleştiri amacıyla yapılan düşünce açıklamaları suç oluşturmaz.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bu suçtan dolayı soruşturma yapılması, Adalet Bakanının iznine bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Devletin Güvenliğine Karşı Suçlar">
        <mvz-madde no="302" başlık="Devletin birliğini ve ülke bütünlüğünü bozmak">
          <mvz-fıkra no="1">
            <template>Devlet topraklarının tamamını veya bir kısmını yabancı bir devletin egemenliği altına koymaya veya Devletin bağımsızlığını zayıflatmaya veya birliğini bozmaya veya Devletin egemenliği altında bulunan topraklardan bir kısmını Devlet idaresinden ayırmaya yönelik bir fiil işleyen kimse, ağırlaştırılmış müebbet hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun işlenmesi sırasında başka suçların işlenmesi halinde, ayrıca bu suçlardan dolayı ilgili hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddede tanımlanan suçların işlenmesi dolayısıyla tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="303" başlık="Düşmanla işbirliği yapmak">
          <mvz-fıkra no="1">
            <template>Türkiye Cumhuriyeti Devleti ile savaş halinde olan devletin ordusunda hizmet kabul eden, düşman devletin yanında Türkiye Cumhuriyeti Devletine karşı silahlı mücadeleye giren vatandaş, müebbet hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Düşman devlet ordusunda herhangi bir komuta görevi üstlenen vatandaş, ağırlaştırılmış müebbet hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bir ve ikinci fıkralarda tanımlanan suçların işlenmesi sırasında başka suçların işlenmesi halinde, ayrıca bu suçlardan dolayı ilgili hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Savaş zamanında düşman devlet toprağında bulunup da bu devlet ordusunda hizmete alınmak mecburiyetinde kalan vatandaş hakkında, bu nedenle cezaya hükmolunmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="304" başlık="Devlete karşı savaşa tahrik">
          <mvz-fıkra no="1">
            <template>Türkiye Cumhuriyeti Devletine karşı savaş açması veya hasmane hareketlerde bulunması için yabancı devlet yetkililerini tahrik eden veya bu amaca yönelik olarak yabancı devlet yetkilileri ile işbirliği yapan kişi, on yıldan yirmi yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu madde uygulamasında, Türkiye Cumhuriyeti Devletinin güvenliğine karşı suç işlemek üzere oluşturulmuş örgütlerin doğrudan veya dolaylı olarak desteklenmesi, hasmane hareket olarak kabul edilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddede tanımlanan suçun işlenmesi dolayısıyla tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="305" başlık="Temel millî yararlara karşı faaliyette bulunmak için yarar sağlama">
          <mvz-fıkra no="1">
            <template>Temel millî yararlara karşı fiillerde bulunmak maksadıyla veya bu nedenle, yabancı kişi veya kuruluşlardan doğrudan doğruya veya dolaylı olarak kendisi veya başkası için maddi yarar sağlayan vatandaşa ya da Türkiye'de bulunan yabancıya, üç yıldan on yıla kadar hapis ve onbin güne kadar adlî para cezası verilir. Yarar sağlayan veya vaat eden kişi hakkında da aynı cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiilin savaş sırasında işlenmiş olması hâlinde, verilecek ceza yarı oranında artırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Suç savaş hali dışında işlendiği takdirde, bu nedenle kovuşturma yapılması Adalet Bakanının iznine bağlıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Temel milli yararlar deyiminden; bağımsızlık, toprak bütünlüğü, milli güvenlik ve Cumhuriyetin Anayasada belirtilen temel nitelikleri anlaşılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="306" başlık="Yabancı devlet aleyhine asker toplama">
          <mvz-fıkra no="1">
            <template>Türkiye Devletini savaş tehlikesi ile karşı karşıya bırakacak şekilde, yetkisiz olarak, yabancı bir devlete karşı asker toplayan veya diğer hasmane hareketlerde bulunan kimseye beş yıldan oniki yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Fiil sonucu savaş meydana gelirse faile müebbet hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Fiil, sadece yabancı devletle siyasal ilişkileri bozacak veya Türkiye Devleti veya Türk vatandaşlarını misilleme tehlikesi ile karşı karşıya bırakacak nitelikte ise faile iki yıldan sekiz yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Siyasal ilişki kesilir veya misilleme meydana gelirse üç yıldan on yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Bu maddede yer alan suçun kovuşturulması Adalet Bakanının iznine bağlıdır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Bu madde hükümleri, fiili savaş halinde ülke topraklarının tamamını veya bir kısmını işgal eden yabancı devlet kuvvetlerine karşı meşru müdafaa amaçlı direniş hareketleri hakkında uygulanmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="307" başlık="Askerî tesisleri tahrip ve düşman askerî hareketleri yararına anlaşma">
          <mvz-fıkra no="1">
            <template>Devletin silahlı kuvvetlerine ait olan veya hizmetine verilmiş bulunan kara, deniz ve hava ulaşım araçlarını, yolları, müesseseleri, depoları ve diğer askerî tesisleri, bunlar henüz tamamlanmamış bulunsalar bile, kısmen veya tamamen tahrip eden veya geçici bir süre için olsa bile kullanılmayacak hale getiren kişiye, altı yıldan oniki yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Suçun;</template>
            <mvz-bent no="a">
              <template>Türkiye ile savaş halinde bulunan bir devletin çıkarı için işlenmiş olması,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Devletin savaş hazırlıklarını veya savaş kudret ve yeteneğini veya askerî hareketlerini tehlikeye koymuş olması,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>halinde, ağırlaştırılmış müebbet hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Tahrip veya kullanılamaz hale gelme, birinci fıkrada belirtilen bina, tesis veya eşyayı elinde bulunduran veya korumak ve gözetlemekle yükümlü olan kimsenin taksiri sonucunda meydana gelmiş veya bu nedenle suçun işlenmesi kolaylaşmış ise, bu kişi hakkında bir yıldan beş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Savaş zamanında Türkiye Devleti zararına olmak üzere, düşman askerî hareketlerini kolaylaştırmak veya Türkiye Devletinin askerî hareketlerine zarar vermek maksadıyla yabancıyla anlaşan veya anlaşma olmasa da aynı sonuçları meydana getirmeye yönelik fiilleri işleyen kişiye on yıldan onbeş yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="5">
            <template>Dördüncü fıkrada tanımlanan fiil sonucunda, düşman askerî hareketleri fiilen kolaylaşmış veya Türk Devletinin askerî hareketleri zarar görmüş ise faile ağırlaştırılmış müebbet hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="6">
            <template>Dört ve beşinci fıkralarda yazılı suçları işleyen kimse ile anlaşan yabancıya da aynı ceza verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="7">
            <template>Yukarıdaki fıkralarda yazılı fiillerin Türkiye Devleti ile aralarında savaş için ittifak veya iştirak olan devlet zararına olarak Türkiye'de işlenmesi halinde de bu madde hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="308" başlık="Düşman devlete maddi ve mali yardım">
          <mvz-fıkra no="1">
            <template>Türkiye Cumhuriyeti Devletinin savaş halinde olduğu devlete, savaşta Türkiye Cumhuriyeti Devletinin aleyhine kullanılabilecek her türlü eşyayı karşılıklı veya karşılıksız, doğrudan veya dolaylı olarak veren vatandaş, beş yıldan onbeş yıla kadar hapis cezası ile cezalandırılır. Bu hüküm, Türkiye'de oturan yabancı hakkında da uygulanır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Savaş zamanında, düşman devlet yararına yapılan borçlanmalara veya her ne nedenle olursa olsun ödemelere katılan veya bunlara ilişkin işlemleri kolaylaştıran vatandaşa veya Türkiye'de oturan yabancıya aynı ceza verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Savaştan evvel başlamış olsa bile, birinci fıkrada yazılı haller dışında, nerede bulunursa bulunsun düşman devlet vatandaşıyla veya düşman devlet topraklarında oturan diğer kimselerle Türkiye Devleti zararına veya düşman devletin savaş gücüne olumlu etki yapacak nitelikte doğrudan doğruya veya dolaylı olarak ticaret yapan vatandaşa veya Türkiye'de oturan yabancıya iki yıldan beş yıla kadar hapis ve onbin güne kadar adlî para cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Yukarıdaki fıkralarda yazılı fiillerin düşman devletle aralarında savaş için ittifak veya iştirak olan devlet yararına işlenmesi halinde de bu madde hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="5-BEŞİNCİ" başlık="Anayasal Düzene ve Bu Düzenin İşleyişine Karşı Suçlar">
        <mvz-madde no="309" başlık="Anayasayı ihlal">
          <mvz-fıkra no="1">
            <template>Cebir ve şiddet kullanarak, Türkiye Cumhuriyeti Anayasasının öngördüğü düzeni ortadan kaldırmaya veya bu düzen yerine başka bir düzen getirmeye veya bu düzenin fiilen uygulanmasını önlemeye teşebbüs edenler ağırlaştırılmış müebbet hapis cezası ile cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun işlenmesi sırasında başka suçların işlenmesi halinde, ayrıca bu suçlardan dolayı ilgili hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bu maddede tanımlanan suçların işlenmesi dolayısıyla tüzel kişiler hakkında bunlara özgü güvenlik tedbirlerine hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="310" başlık="Cumhurbaşkanına suikast ve fiilî saldırı">
          <mvz-fıkra no="1">
            <template>Cumhurbaşkanına suikastte bulunan kişi, ağırlaştırılmış müebbet hapis cezası ile cezalandırılır. Bu fiile teşebbüs edilmesi halinde de suç tamamlanmış gibi cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Cumhurbaşkanına karşı diğer fiili saldırılarda bulunan kimse hakkında, ilgili suça ilişkin ceza yarı oranında artırılarak hükmolunur. Ancak, bu suretle verilecek ceza beş yıldan az olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="311" başlık="Yasama organına karşı suç">
          <mvz-fıkra no="1">
            <template>Cebir ve şiddet kullanarak Türkiye Büyük Millet Meclisini ortadan kaldırmaya veya Türkiye Büyük Millet Meclisinin görevlerini kısmen veya tamamen yapmasını engellemeye teşebbüs edenler ağırlaştırılmış müebbet hapis cezasıyla cezalandırılırlar.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun işlenmesi sırasında başka suçların işlenmesi halinde, ayrıca bu suçlardan dolayı ilgili hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="312" başlık="Hükûmete karşı suç">
          <mvz-fıkra no="1">
            <template>Cebir ve şiddet kullanarak Türkiye Cumhuriyeti Hükûmetini ortadan kaldırmaya veya görevlerini yapmasını kısmen veya tamamen engellemeye teşebbüs eden kimseye ağırlaştırılmış müebbet hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçun işlenmesi sırasında başka suçların işlenmesi halinde, ayrıca bu suçlardan dolayı ilgili hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="313" başlık="Türkiye Cumhuriyeti Hükûmetine karşı silâhlı isyan">
          <mvz-fıkra no="1">
            <template>Halkı, Türkiye Cumhuriyeti Hükûmetine karşı silahlı bir isyana tahrik eden kimseye onbeş yıldan yirmi yıla kadar hapis cezası verilir. İsyan gerçekleştiğinde, tahrik eden kişi hakkında yirmi yıldan yirmibeş yıla kadar hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Türkiye Cumhuriyeti Hükûmetine karşı silahlı isyanı idare eden kişi, ağırlaştırılmış müebbet hapis cezası ile cezalandırılır. İsyana katılan diğer kişilere altı yıldan on yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Bir ve ikinci fıkrada tanımlanan suçların, Devletin savaş halinde olmasının sağladığı kolaylıktan yararlanmak suretiyle işlenmesi halinde, ağırlaştırılmış müebbet hapis cezasına hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Bir ve ikinci fıkrada tanımlanan suçların işlenmesi sırasında başka suçların işlenmesi halinde, ayrıca bu suçlardan dolayı ilgili hükümlere göre cezaya hükmolunur.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="314" başlık="Silâhlı örgüt">
          <mvz-fıkra no="1">
            <template>Bu kısmın dördüncü ve beşinci bölümlerinde yer alan suçları işlemek amacıyla, silahlı örgüt kuran veya yöneten kişi, on yıldan onbeş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkrada tanımlanan örgüte üye olanlara, beş yıldan on yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3" durum="iptal">
            <template></template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>Suç işlemek amacıyla örgüt kurma suçuna ilişkin diğer hükümler, bu suç açısından aynen uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="315" başlık="Silâh sağlama">
          <mvz-fıkra no="1">
            <template>Yukarıdaki maddede tanımlanan örgütlerin faaliyetlerinde kullanılmak maksadıyla bunların amaçlarını bilerek, bu örgütlere üretmek, satın almak veya ülkeye sokmak suretiyle silah temin eden, nakleden veya depolayan kişi, on yıldan onbeş yıla kadar hapis cezası ile cezalandırılır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="316" başlık="Suç için anlaşma">
          <mvz-fıkra no="1">
            <template>Bu kısmın dördüncü ve beşinci bölümlerinde yer alan suçlardan herhangi birini elverişli vasıtalarla işlemek üzere iki veya daha fazla kişi, maddi olgularla belirlenen bir biçimde anlaşırlarsa, suçların ağırlık derecesine göre üç yıldan oniki yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Amaçlanan suç işlenmeden veya anlaşma dolayısıyla soruşturmaya başlanmadan önce bu ittifaktan çekilenlere ceza verilmez.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="6-ALTINCI" başlık="Milli Savunmaya Karşı Suçlar">
        <mvz-madde no="317" başlık="Askerî komutanlıkların gasbı">
          <mvz-fıkra no="1">
            <template>Kanunen yetkili olmadıkları veya Devlet tarafından memur edilmedikleri halde, bir asker kıtasının veya donanmasının veya savaş gemisinin veya savaş hava filosunun veya bir kale veya müstahkem mevkiin veya bir askerî üssün veya tesisin, bir liman veya şehrin komutasını alanlara müebbet hapis cezası verilir.</template>

        <mvz-madde no="341" başlık="Yabancı devlet bayrağına karşı hakaret">
          <mvz-fıkra no="1">
            <template>Resmen çekilmiş olan yabancı devlet bayrağını veya diğer egemenlik alametlerini alenen tahkir eden kimseye üç aydan bir yıla kadar hapis cezası verilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu suçtan dolayı soruşturma ve kovuşturma yapılması, ilgili devletin şikayetine bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="342" başlık="Yabancı devlet temsilcilerine karşı suç">
          <mvz-fıkra no="1">
            <template>Türkiye Cumhuriyetinde sürekli veya geçici olarak görevlendirilmiş yabancı devlet temsilcileri ile bunların diplomasi memurları veya uluslararası kuruluşların temsilcileri ile bunların diplomatik ayrıcalık ve bağışıklık tanınan memurları, kendilerine karşı görevlerinden dolayı işlenen suçlar bakımından, kamu görevlisi kabul edilerek; suç işleyen kişiler hakkında, bu Kanunun ilgili hükümlerine göre cezaya hükmolunur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>İşlenen suç hakaret ise, soruşturma ve kovuşturma yapılması, mağdurun şikayetine bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="343" başlık="Karşılıklılık koşulu">
          <mvz-fıkra no="1">
            <template>Bu bölümde yazılı hükümlerin uygulanması, karşılıklılık koşuluna bağlıdır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
      <mvz-bölüm no="9-DOKUZUNCU" başlık="Son Hükümler">
        <mvz-madde no="1" başlık="" tür="Geçici">
          <mvz-fıkra no="1">
            <template>Bu maddeyi ihdas eden Kanunla, bu Kanunun 235 inci maddesinde yapılan değişiklik sebebiyle görülmekte olan davalarda görevsizlik kararı verilemez.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="344" başlık="Yürürlük">
          <mvz-fıkra no="1">
            <template>Bu Kanunun;</template>
            <mvz-bent no="a">
              <template>“İmar kirliliğine neden olma” başlıklı 184 üncü maddesi yayımı tarihinde,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>“Çevrenin kasten kirletilmesi” başlıklı 181 inci maddesinin birinci fıkrası ile “Çevrenin taksirle kirletilmesi” başlıklı 182 nci maddesinin birinci fıkrası yayımı tarihinden itibaren iki yıl sonra,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Diğer hükümleri 1 Haziran 2005 tarihinde,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>yürürlüğe girer.</template>
          </mvz-fıkra>
        </mvz-madde>
        <mvz-madde no="345" başlık="Yürütme">
          <mvz-fıkra no="1">
            <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-bölüm>
