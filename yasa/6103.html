  <mvz-künye tür="kanun" no="6103" başlık="TÜRK TİCARET KANUNUNUN YÜRÜRLÜĞÜ VE UYGULAMA ŞEKLİ HAKKINDA KANUN"
             tarih="14/1/2011" rgazete-tarih="14/2/2011" rgazete-sayı="27846"
             düstur-tertip="5" düstur-cilt="50" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-b1 no="A" başlık="Amaç">
      <mvz-madde no="1" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanunun amacı, yeni Türk Ticaret Kanunu hükümlerinin yürürlüğe konulmasına ve uygulanmasına ilişkin usul ve esasları belirlemektir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Eski hukukun ve Türk Ticaret Kanununun uygulanacağı hâller">
      <mvz-madde no="2" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanunda aksi öngörülmemiş veya farklı bir şekilde düzenlenmemişse:</template>
          <mvz-bent no="a">
            <template>Türk Ticaret Kanununun yürürlüğe girdiği tarihten önce meydana gelen olayların hukukî sonuçlarına, bu olaylar hangi kanun yürürlükte iken gerçekleşmişlerse, o kanun hükümleri uygulanır.</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Türk Ticaret Kanununun yürürlüğe girdiği tarihten önce gerçekleşmiş hukukî fiiller, bağlayıcılıkları ve hukukî sonuçları itibarıyla, bu tarihten sonra dahi, gerçekleştikleri tarihte yürürlükte bulunan kanuna tâbidir.</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Türk Ticaret Kanununun yürürlüğe girdiği tarihten sonra meydana gelen olaylara Türk Ticaret Kanunu hükümleri uygulanır.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Türk Ticaret Kanununun yürürlüğe girmesinden sonra açılmış olan davalarda, mahkeme herhangi bir sebeple 29/6/1956 tarihli ve 6762 sayılı Türk Ticaret Kanununu uygulamışsa, kararında bunu ve gerekçesini açıkça belirtir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bu Kanunda kullanılan “eski hukuk” terimi, 6762 sayılı Kanunu ve bu Kanun ile ilgili diğer mevzuatı ifade eder.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Türk Ticaret Kanununun yürürlüğe girmesinden önceki olaylara uygulanması">
      <mvz-b2 no="I" başlık="Kanunla düzenlenen ilişkiler">
        <mvz-madde no="3" başlık="">
          <mvz-fıkra no="1">
            <template>Tarafların iradelerinden bağımsız olarak, kanunla düzenlenen hukukî ilişkilere, bunlar Türk Ticaret Kanununun yürürlüğe girmesinden önce kurulmuş olsalar bile, Türk Ticaret Kanunu hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Beklenen haklar">
        <mvz-madde no="4" başlık="">
          <mvz-fıkra no="1">
            <template>Eski hukuk yürürlükte iken gerçekleşmiş olup da Türk Ticaret Kanununun yürürlüğe girdiği tarihte henüz herhangi bir hak doğurmamış olaylara Türk Ticaret Kanunu hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="D" başlık="Kazanılmış haklar">
      <mvz-madde no="5" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanunda kazanılmış haklar korunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="E" başlık="Zamanaşımı süreleri ve hak düşürücü süreler">
      <mvz-madde no="6" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Ticaret Kanununun yürürlüğe girmesinden önce işlemeye başlamış bulunan zamanaşımı süreleri ile hak düşürücü süreler eski hukuka tâbidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Zamanaşımı ile hak düşürücü sürelere ilişkin diğer hususlar, yürürlüğe girdiği tarihten itibaren Türk Ticaret Kanununa tâbidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="F" başlık="Yollamalar">
      <mvz-madde no="7" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanunun ve Türk Ticaret Kanununun yürürlüğe girmesiyle, 6762 sayılı Kanunun yürürlükten kaldırılan veya değiştirilen maddelerine diğer mevzuat tarafından yapılmış bulunan yollamalar, Türk Ticaret Kanununda o maddeleri karşılayan hükümler varsa onlara yapılmış sayılır. Aksi hâlde, hâkim 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanununun 1 inci maddesini uygular. Birinci cümle hükmü, esas sözleşmeler dahil, her çeşit sözleşme, taahhütname, beyan ve benzeri metinlerdeki eski hukuka yapılmış olan yollamalar için de geçerlidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Özel Hükümler">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Başlangıç">
      <mvz-b1 no="A" başlık="Deniz ticaretine ve deniz sigortalarına ilişkin hukuk davaları">
        <mvz-madde no="8" başlık="">
          <mvz-fıkra no="1">
            <template>6762 sayılı Kanunun 4 üncü maddesinin üçüncü fıkrası uyarınca kurulmuş bulunan denizcilik ihtisas mahkemesinin görmekte olduğu davalar, Türk Ticaret Kanununun 5 inci maddesinin ikinci fıkrasının ikinci cümlesi gereğince, Türk Ticaret Kanununun yürürlüğe girmesinden itibaren bir ay içinde, Hâkimler ve Savcılar Yüksek Kurulu tarafından, Türk Ticaret Kanunu ile diğer kanunlardan doğan deniz ticaretine ve deniz sigortalarına ilişkin hukuk davalarına bakmakla görevli kılınacak asliye ticaret mahkemesine devredilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Türk Ticaret Kanununun yürürlüğe girmesinden önce açılmış olan deniz ticaretine ve deniz sigortasına ilişkin hukuk davalarını görmekte olan mahkemeler, yargı çevreleri içinde ve görev alanlarına giren sonuçlanmamış davaları ve işleri devredemezler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Bileşik faiz">
        <mvz-madde no="9" başlık="">
          <mvz-fıkra no="1">
            <template>6762 sayılı Kanunun 8 inci maddesinin ikinci fıkrası uyarınca, faizin ana paraya eklenerek birlikte tekrar faiz yürütülmesini öngörmüş bulunan ve her iki tarafı da tacir olmayan cari hesap sözleşmeleri, bu Kanunun yürürlüğe girdiği tarihten itibaren üç ay içinde değiştirilir ve faize faiz yürütülmesine ilişkin hükümler ile bu sonucu doğuran düzenlemeler sözleşmeden çıkarılır; aksi hâlde anılan sürenin sonunda söz konusu hükümler yazılmamış sayılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bileşik faize ilişkin düzenleme sözleşmeden çıkarılıncaya kadar, çıkarılmamışsa birinci fıkrada belirtilen üç aylık sürede işlemiş bulunan bileşik faiz borçludan istenebilir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Yalnız bu maddede öngörülmüş bulunan değişikliklerin yapılması damga resmi doğurmaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Ticari İşletme">
      <mvz-b1 no="A" başlık="Ticari işletme">
        <mvz-madde no="10" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanununun 11 inci maddesinin ikinci fıkrasında öngörülen Bakanlar Kurulu kararı çıkarılıncaya kadar yürürlükte bulunan düzenlemeler uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Ticaret unvanı">
        <mvz-madde no="11" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanununun yürürlüğe girdiği tarihten itibaren anılan Kanunun ticaret unvanına ilişkin hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Merkezleri Türkiye içinde ve dışında bulunan ticarî işletmelerin Türkiye şubelerinin tescili ve Türkiye’deki bir şirketin merkezinin yurt dışına taşınması">
        <mvz-madde no="12" başlık="">
          <mvz-fıkra no="1">
            <template>Merkezleri Türkiye dışında bulunan bir ticarî işletmenin veya ticaret şirketinin şubesinin Türkiye’de tescil edilebilmesi için, merkez işletmenin bulunduğu kaynak ülke hukukunun, işletmeler ile ticaret şirketlerinin türlerine göre şubelerinin tescilinde aradığı şartların gerçekleşmiş olması gerekir. Ayrıca, kaynak ülkede tescil için ibrazı gerekli tüm belgeler ile şirketin sözleşmesinin, anonim şirketlerde esas sözleşmenin onaylı suretleri, Türkiye’de tescili yapacak ticaret sicili müdürlüğüne verilir. Bundan başka, şube unvanı, adresi, şubeye ayrılmış sermaye tutarı, şubeyi mahkemeler dahil, özel kuruluşlar ve kamu kuruluşları nezdinde tam yetkili olarak temsil edecek kişi veya kişilerin adları, merkez işletmenin türü, işletme konusu, sermayesinin türü ve tutarı, sicil numarası, internet sitesi, tâbi olduğu hukuk, Avrupa Birliği üyesi olup olmadığı bilgileri ilgili ticaret sicili müdürlüğüne bir beyanname ile bildirilir ve gerekli belgeler eklenir. Tescil edilecek hususlarla şubenin tesciline ilişkin ayrıntılı düzenleme Türk Ticaret Kanununun 26 ncı maddesine göre çıkarılacak yönetmelikte yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bir Türk şirketi, tasfiye edilmeksizin ve hedef ülkede yeniden kurulmaksızın yabancı bir ülkeye taşınabilir. Bunun için;</template>
            <mvz-bent no="a">
              <template>Türk hukukunun aradığı şartların yerine getirilmiş olduğu,</template>
            </mvz-bent>
            <mvz-bent no="b">
              <template>Şirketin taşındığı ülke hukukuna göre, o ülkede faaliyetine devam edebileceği,</template>
            </mvz-bent>
            <mvz-bent no="c">
              <template>Şirketin, konumunda meydana gelecek değişiklikten alacaklıların, ilân yoluyla haberdar edildikleri, alacaklarını bildirmeye davet olundukları ve alacakların ödendiği veya teminat altına alındığı,</template>
            </mvz-bent>
          </mvz-fıkra>
          <mvz-fıkra no="0">
            <template>ispat edilmelidir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="3">
            <template>Merkezini yurt dışına taşıyan şirketin unvanı, alacaklıların tümü tam olarak tatmin edilmeden ticaret sicilinden silinemez. Merkezin taşınmasına ilişkin ayrıntılı düzenlemeler Türk Ticaret Kanununun 26 ncı maddesine göre çıkarılacak yönetmelikte yapılır.</template>
          </mvz-fıkra>
          <mvz-fıkra no="4">
            <template>(Mülga)</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="D" başlık="Ticari defterlerle ispat">
        <mvz-madde no="13" başlık="">
          <mvz-fıkra no="1">
            <template>Mülga</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="E" başlık="Acenteye ilişkin rekabet yasağı anlaşması">
        <mvz-madde no="14" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanununun 123 üncü maddesi, anılan Kanunun yürürlüğe girmesinden önce yapılmış olup da devam etmekte olan acentelik sözleşmelerine de uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Ticaret Şirketlerine İlişkin Genel Hükümler">
      <mvz-b1 no="A" başlık="Ticaret şirketlerinin hak ehliyeti">
        <mvz-madde no="15" başlık="">
          <mvz-fıkra no="1">
            <template>Şirket sözleşmelerinde veya esas sözleşmelerinde 6762 sayılı Kanunun 137 nci maddesine uygun olarak, şirketin hak ehliyetinin şirket sözleşmesinde veya esas sözleşmesinde yazılı işletme konusu ile sınırlı olduğunu belirten hükümler bulunması hâlinde, bu hükümler Türk Ticaret Kanununun yürürlüğe girdiği tarihten itibaren yazılmamış sayılır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Sermaye koyma">
        <mvz-madde no="16" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanununun yürürlüğe girdiği tarihten önce bazı taşınmazlar bir şirkete sermaye olarak konulmuş, ancak bunların tapu sicilinde tescillerinin şirket adına yapılmamış olması hâlinde, şirket alacaklıları, ortakları veya pay sahipleri tescil isteminde bulunabilecekleri gibi, tescilin, ticaret sicili müdürlerince yaptırılması talimatını Gümrük ve Ticaret Bakanlığı da verebilir. Tescil harcı ile diğer harç ve masraflar, 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümleri çerçevesinde şirketten alınır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Birleşme, bölünme, tür değiştirme ve şirketler topluluğu">
        <mvz-b2 no="I" başlık="Tebliğler ve düzeltmeler">
          <mvz-madde no="17" başlık="">
            <mvz-fıkra no="1">
              <template>Birleşme, bölünme ve tür değiştirme gibi yapı değişiklikleriyle ilgili olarak tapu ve gemi sicili ile fikrî mülkiyete ilişkin sicillerde ve benzeri sicil ve kayıt belgelerinde yapılması gerekli işlemlerin usul ve esasları ile başvuruda bulunacak kişiler ve ibrazı gerekli belgeler, Türk Ticaret Kanununun yayımı tarihini izleyen altı ay içinde, Kültür ve Turizm Bakanlığı, Ulaştırma, Denizcilik ve Haberleşme Bakanlığı, Tapu ve Kadastro Genel Müdürlüğü ve Türk Patent Enstitüsünün görüşü alınarak, Gümrük ve Ticaret Bakanlığı tarafından hazırlanacak bir tebliğle düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Birleşme, bölünme ve tür değiştirmeyle ilgili şeffaflığı ve hakların kullanılmasını sağlayıcı uygulama hükümleri Türk Ticaret Kanununun 26 ncı maddesine göre çıkarılacak yönetmelikte düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Hâkimiyetin kötüye kullanılması">
          <mvz-madde no="18" başlık="">
            <mvz-fıkra no="1">
              <template>Bir bağlı şirketin, Türk Ticaret Kanununun yürürlüğe girdiği tarihte, anılan Kanunun 202 nci maddesinin birinci fıkrası kapsamına giren kaybı veya kayıpları varsa bunlar, bu Kanunun yürürlüğe girdiği tarihten itibaren iki yıl içinde denkleştirilir veya ilgili şirkete kaybı veya kayıpları denkleştirecek istem hakları tanınır. Aksi hâlde, Türk Ticaret Kanununun 202 nci maddesinin birinci fıkrasının (b) bendinde öngörülen dava hakları söz konusu sürenin bitmesiyle hemen kullanılabilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Türk Ticaret Kanununun 196 ncı maddesindeki pay ve oy oranlarının hesaplanması ile aynı Kanunun 198 inci maddesindeki bildirim, tescil ve ilân yükümlülüklerine ilişkin usul ve esaslar Türk Ticaret Kanununun 26 ncı maddesine göre çıkarılacak yönetmelikte düzenlenir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Bağlı şirketin hâkim şirketin paylarına sahip olması">
          <mvz-madde no="19" başlık="">
            <mvz-fıkra no="1">
              <template>Türk Ticaret Kanununun 201 inci maddesinin birinci fıkrasında öngörülmüş bulunan oy haklarının kullanılmasına ilişkin sınırlamaya dair hüküm, anılan Kanunun yayımı tarihinden itibaren iki yıl sonra yürürlüğe girer. Diğer haklarla ilgili sınırlamalar Türk Ticaret Kanununun yürürlüğe girmesiyle birlikte uygulanmaya başlar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Anonim Şirket ve Limited Şirketler">
      <mvz-b1 no="A" başlık="Genel hükümler, kuruluş ve temel ilkeler">
        <mvz-b2 no="I" başlık="Asgarî sermaye">
          <mvz-madde no="20" başlık="">
            <mvz-fıkra no="1">
              <template>Anonim ve limited şirketler, Türk Ticaret Kanununun yayımı tarihinden itibaren üç yıl içinde sermayelerini, anılan Kanunun 332 ve 580 inci maddelerinde öngörülen tutarlara yükseltirler; aksi hâlde mezkûr sürenin sonunda infisah etmiş sayılırlar.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Sermayenin Türk Ticaret Kanununda öngörülen tutara yükseltilmesi için yapılacak genel kurullarda toplantı nisabı aranmaz, kararlar toplantıda mevcut oyların çoğunluğu ile alınır ve şartları bulunsa bile 6762 sayılı Kanunun 389 uncu ve Türk Ticaret Kanununun 454 üncü maddeleri uygulanmaz. Bu fıkra hükümleri, bu Kanunun 26 ve 28 inci maddeleri uyarınca yapılacak esas sözleşme değişiklikleri için toplanacak genel kurullara da uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Halka açık olmayan anonim şirketlerin kayıtlı sermaye sistemini kabul etmelerine, daha sonra bu sisteme geçmelerine, sermayelerini artırmalarına, kayıtlı sermaye tavanını yükseltmelerine, sistemden çıkmalarına ve çıkarılmalarına, yönetim kurulunun imtiyazlı ve primli paylar ihracına, rüçhan haklarını kanun çerçevesinde sınırlamasına ve diğer hususlara ilişkin usul ve esaslar Gümrük ve Ticaret Bakanlığı tarafından hazırlanacak tebliğle; tescil ve ilâna dair hususlar ise Türk Ticaret Kanununun 26 ncı maddesine göre çıkarılacak yönetmelikte düzenlenir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Gümrük ve Ticaret Bakanlığı birinci fıkrada yazılı süreyi birer yıl olarak en çok iki defa uzatabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="II" başlık="Kuruluş">
          <mvz-madde no="21" başlık="">
            <mvz-fıkra no="1">
              <template>Türk Ticaret Kanununun anonim ve limited şirketlerin kuruluşuna ilişkin hükümleri, anılan Kanunun yürürlüğe girdiği tarihten itibaren hemen uygulanır. Ancak, Türk Ticaret Kanununun yürürlüğe girdiği tarihte, kuruluş hâlinde bulunan anonim şirketlerde esas sözleşme, limited şirketlerde şirket sözleşmesi yapılmış ve kurucuların imzaları noter tarafından onaylanmışsa, bu onay tarihinden itibaren bir ay içinde şirketin tescili için ticaret siciline başvurulduğu takdirde, kuruluşa 6762 sayılı Kanun hükümleri uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="III" başlık="Esas sözleşme">
          <mvz-madde no="22" başlık="">
            <mvz-fıkra no="1">
              <template>Anonim şirketler esas sözleşmelerini ve limited şirketler şirket sözleşmelerini, yürürlük tarihinden itibaren oniki ay içinde Türk Ticaret Kanunuyla uyumlu hâle getirirler. Bu süre içinde gerekli değişikliklerin yapılmaması hâlinde, esas sözleşmedeki ve şirket sözleşmesindeki düzenleme yerine Türk Ticaret Kanununun ilgili hükümleri uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Esas sözleşme ve limited şirket sözleşmesini birinci fıkra uyarınca uyumlu hâle getirmek için yapılacak genel kurullara bu Kanunun 20 nci maddesinin ikinci fıkrası uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Gümrük ve Ticaret Bakanlığı bu maddede öngörülen süreyi ancak bir yıla kadar uzatabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IV" başlık="Tek pay sahipli anonim şirketler ile tek ortaklı limited şirketler">
          <mvz-madde no="23" başlık="">
            <mvz-fıkra no="1">
              <template>Herhangi bir sebeple bir anonim şirketin tek pay sahibi ve bir limited şirketin tek ortağı olan gerçek veya tüzel kişi, bu Kanunun yürürlüğe girmesinden itibaren onbeş gün içinde, bu sıfatını, adını, adresini, vatandaşlığını, anonim şirketlerde yönetim kuruluna, limited şirketlerde müdüre veya müdürlere noter aracılığıyla bildirir. Bildirimin muhatapları, tebliğ tarihinden itibaren yedi gün içinde, Türk Ticaret Kanununun 338 ve 574 üncü maddelerinde öngörülen hususları tescil ve ilân ettirirler; aksi hâlde anılan maddelerde öngörülen hukukî sonuçlar doğar.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="V" başlık="Pay sahiplerinin ve limited şirket ortaklarının şirkete borçlanma yasağı">
          <mvz-madde no="24" başlık="">
            <mvz-fıkra no="1">
              <template>Mülga</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="VI" başlık="Yönetim kurulu">
          <mvz-madde no="25" başlık="">
            <mvz-fıkra no="1">
              <template>Türk Ticaret Kanununun yürürlüğe girdiği tarihte görevde bulunan anonim şirket yönetim kurulları ile limited şirket müdürleri, görevden alınmaları veya yönetim kurulu üyeliğinin başka bir sebeple boşalması hâli hariç, sürelerinin sonuna kadar görevlerine devam ederler. Ancak, tüzel kişinin temsilcisi olarak üye seçilmiş bulunan gerçek kişinin, Türk Ticaret Kanununun yürürlüğe girdiği tarihten itibaren üç ay içinde istifa etmesi, onun yerine tüzel kişinin ya da başkasının seçilmesi gerekir. Tüm ortakların hep birlikte müdür sıfatıyla şirket işlerini idare ve şirketi temsil ettiği limited şirketlerde de aynı üç aylık süre içinde Türk Ticaret Kanununun 623 üncü maddesi hükmünün gereği yerine getirilir. Anonim şirketlerde Türk Ticaret Kanununun 363 üncü maddesinin birinci fıkrası uyarınca seçim yapılan durumlarda, anılan Kanunun 359 uncu maddesindeki şartları taşıyan yönetim kurulu üyelerinin seçilmeleri şarttır. Görevdeki yönetim kurulunun görevinin sona ermesinden sonra seçilecek üyelerin, anılan 359 uncu maddedeki şartları taşımaları zorunludur.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Yönetim kurulu üyelerinin özen ve bağlılık borcuna ilişkin hüküm, Türk Ticaret Kanununun yürürlüğe girdiği tarihte görülmekte olan davalarda uygulanmaz. Bu davalarda özen ve bağlılık borcu 6762 sayılı Kanuna göre değerlendirilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="VII" başlık="Esas sözleşme değişikliklerinde toplantı ve karar nisapları">
          <mvz-madde no="26" başlık="">
            <mvz-fıkra no="1">
              <template>Bir anonim şirketin esas sözleşmesinde veya bir limited şirketin şirket sözleşmesinde genel kurulun toplantı ve karar nisaplarına, madde numarası belirtilerek veya belirtilmeksizin 6762 sayılı Kanun hükümlerinin uygulanacağı öngörülmüşse, bu şirketler Türk Ticaret Kanununun yürürlüğe girmesinden itibaren oniki ay içinde anonim şirketlerde esas sözleşmelerini ve limited şirketlerde şirket sözleşmesini değiştirerek, anılan Kanuna uygun düzenleme yaparlar. Aksi hâlde, bu sürenin geçmesiyle Türk Ticaret Kanununun genel kurulun toplantı ve karar nisaplarına ilişkin hükümleri uygulanır. Sadece bu oniki ay içinde yapılan genel kurullarda 6762 sayılı Kanunun genel kurulların toplantı ve karar nisapları hakkındaki hükümleri uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>Herhangi bir sözleşmede, taahhütnamede, temliknamede veya diğer bir belgede 6762 sayılı Kanunun 388 inci maddesine madde numarası verilerek veya bu maddenin içeriğine yapılan yollamalar, Türk Ticaret Kanununun 421 inci maddesine yapılmış sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Bir esas sözleşmede esas sözleşme değişikliklerine ilişkin olarak 6762 sayılı Kanunun 388 inci maddesindekinden daha ağır nisaplar öngörülmüş olup da bunlar Türk Ticaret Kanununun 421 inci maddesinin birinci fıkrasında öngörülen nisaplardan ağırsa, bunların uygulanmasına devam olunabilir. Ağırlaştırılmış nisaplara dair esas sözleşmedeki veya herhangi bir sözleşme veya hukukî metindeki özel düzenleme Türk Ticaret Kanununun 421 inci maddesine göre daha hafifse 421 inci madde uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Bu maddenin ikinci ve üçüncü fıkraları hükümleri uyarlanarak limited şirketlere de uygulanır.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="VIII" başlık="Özel denetçi">
          <mvz-madde no="27" başlık="">
            <mvz-fıkra no="1">
              <template>Türk Ticaret Kanununun yürürlüğe girmesinden önce atanmış bulunan özel denetçi, anılan Kanunun yürürlüğe girdiği tarihte henüz raporunu vermemişse, görevini Türk Ticaret Kanunu hükümlerine göre yerine getirir. Ancak, bu hâlde özel denetçi isterse, tazminat ödemeksizin veya herhangi bir yaptırıma uğramaksızın, görevinden ayrılabilir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
        <mvz-b2 no="IX" başlık="Oy hakkı ve oyda imtiyazlı paylar ile nama yazılı payların devredilmelerinin sınırlanması">
          <mvz-madde no="28" başlık="">
            <mvz-fıkra no="1">
              <template>Türk Ticaret Kanununun 434 ve 435 inci maddeleri, anılan Kanunun yürürlük tarihinden itibaren oniki ay sonra yürürlüğe girer.</template>
            </mvz-fıkra>
            <mvz-fıkra no="2">
              <template>6762 sayılı eski Kanun zamanında ve Türk Ticaret Kanununun kabul edilmesinden en az bir yıl önce esas sözleşme hükmü ile bazı pay gruplarına tanınmış olan yönetim kurulu üyeliği için aday gösterme hakkı, Türk Ticaret Kanununun 360 ıncı maddesinin birinci fıkrasındaki sınırı aşsa bile müktesep hak sayılır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="3">
              <template>Türk Ticaret Kanununun 479 uncu maddesinin birinci fıkrasına aykırı esas sözleşmeler, anılan Kanunun yayımı tarihinden itibaren üç yıl içinde, anılan fıkra hükmüne uygun hâle getirilir.</template>
            </mvz-fıkra>
            <mvz-fıkra no="4">
              <template>Türk Ticaret Kanununun 479 uncu maddesinin ikinci fıkrasında belirtilen sınırı aşan sayıda oyda imtiyaz öngören esas sözleşme hükümleri, Türk Ticaret Kanununun yayımı tarihinden itibaren üç yıl içinde, anılan fıkraya uyarlanır veya mahkemeden anılan fıkrada öngörülen karar alınır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="5">
              <template>Türk Ticaret Kanununun 479 uncu maddesinin üçüncü fıkrasının (c) bendi, anılan Kanunun yürürlüğe girdiği tarihten itibaren bir yıl sonra uygulanır.</template>
            </mvz-fıkra>
            <mvz-fıkra no="6">
              <template>Bu maddenin birinci ve üçüncü fıkralarında yapılması şart koşulan sürede gerekli esas sözleşme değişikliklerinin ve uyarlamaların gerçekleştirilmemesi hâlinde, oyda imtiyazı düzenleyen esas sözleşme hükümleri, birinci ve üçüncü fıkralarda belirtilen sürenin dolduğu tarihte kendiliğinden geçersiz hâle gelir ve esas sözleşmede öngörülen oya ilişkin imtiyazların tümü kanunen sona erer.</template>
            </mvz-fıkra>
            <mvz-fıkra no="7">
              <template>Nama yazılı payların devrini, red sebeplerini göstererek veya göstermeyerek sınırlandırmış bulunan anonim şirketler, Türk Ticaret Kanununun yürürlüğe girdiği tarihten itibaren bir yıl içinde, esas sözleşmelerini değiştirerek, Türk Ticaret Kanununun 492 ilâ 498 inci maddelerine uyarlamak zorundadır; aksi hâlde, bu sürenin dolmasıyla tüm sınırlamalar geçersiz hâle gelir.</template>
            </mvz-fıkra>
          </mvz-madde>
        </mvz-b2>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="5-BEŞİNCİ" başlık="Taşıma İşleri">
      <mvz-b1 no="A" başlık="Taşıma sözleşmesi">
        <mvz-madde no="29" başlık="">
          <mvz-fıkra no="1">
            <template>6762 sayılı Kanun yürürlükte iken yapılmış olan taşıma sözleşmeleri, taşıma senedine ilişkin hükümler dahil, anılan Kanuna tâbidir. Ancak, Türk Ticaret Kanununun yürürlüğe girmesinden sonra gerçekleşen, taşıma hukukuna özgü, zıya, hasar ve gecikmeden dolayı, sorumluluk hâlleri ile taşıyıcının sorumluluk sınırları hakkında Türk Ticaret Kanunu hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>

    <mvz-bölüm no="6-ALTINCI" başlık="Deniz Ticareti">
      <mvz-b1 no="A" başlık="Türk Bayrağını çekme hakkının ve değişikliklerin tescili">
        <mvz-madde no="30" başlık="">
          <mvz-fıkra no="1">
            <template>Gemilere Türk Bayrağı çekme hakkı, yürürlüğe girmesinden itibaren Türk Ticaret Kanununa tâbi olur. Türk Bayrağı çekme hakkını elde etmiş olan tescili zorunlu gemilerin bu Kanunun yürürlüğe girdiği tarihten itibaren iki ay içinde Türk Gemi Siciline tescil ettirilmesi gerekir.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren, daha önce gemi siciline tescil edilmiş olan hususlarda meydana gelecek bütün değişiklikler, gecikmeksizin sicil müdürlüğüne bildirilir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Gemi vasfını kazanan araçların tescili">
        <mvz-madde no="31" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanunuyla gemi olma vasfını kazanan suda yüzme özelliği bulunan araçların malikleri, tescili zorunlu gemilerini, anılan Kanunun yürürlüğe girmesinden itibaren iki ay içinde aynı Kanunun 955 inci maddesi uyarınca yetkili Gemi Sicil Müdürlüğüne tescil ettirmekle yükümlüdürler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="C" başlık="Gemi mülkiyetinin devren iktisabı">
        <mvz-madde no="32" başlık="">
          <mvz-fıkra no="1">
            <template>Bir gemi veya gemi payının temlikinde, gemi üzerindeki mülkiyeti 6762 sayılı Kanuna göre sadece sözleşmeyle iktisap etmiş olan kimseler, bu Kanunun yürürlüğe girmesinden itibaren bir ay içinde kendilerini gemi veya gemi payı maliki olarak gemi siciline tescil ettirmekle yükümlüdürler.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="D" başlık="İpoteğin terkinini talep hakkı">
        <mvz-madde no="33" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanununun yürürlüğe girdiği tarihte bir gemi üzerinde ipotek hakkına sahip olan alacaklı, kendinden önce gelen veya aynı derecede bulunan diğer bir gemi ipoteğinin düşmesi hâlinde bunun terkinini istemek hakkını haizdir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="E" başlık="Şahsî ve aynî teminatların hapis hakkına dönüşmesi">
        <mvz-madde no="34" başlık="">
          <mvz-fıkra no="1">
            <template>Navlun sözleşmelerinde alacaklarının temini için 6762 sayılı Kanunda taşıyana tanınmış olan bütün teminatlar, Türk Ticaret Kanununun yürürlüğe girdiği tarihte ifa edilmeye başlanmış olan sözleşmelerden doğan alacaklar için, alacaklısı lehine hapis hakkına dönüşür.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="F" başlık="Müşterek avarya">
        <mvz-madde no="35" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanununun müşterek avarya ile ilgili hükümleri ancak geminin anılan Kanunun yürürlüğe girmesinden sonra başladığı yolculuktan doğan olaylara uygulanır. Daha önce başlamış olan yolculuklar, 6762 sayılı Kanuna tâbi olmaya devam eder.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="G" başlık="Gemi alacaklısı hakkının devamı">
        <mvz-madde no="36" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanununun yürürlüğe girdiği tarihten önce, 6762 sayılı Kanun hükümlerine göre doğmuş olup da Türk Ticaret Kanunu uyarınca gemi alacaklısı hakkı bahşetmeyen alacaklar, 6762 sayılı Kanuna tâbi olmaya devam eder.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="H" başlık="1976 ve 1992 tarihli Sözleşmeler">
        <mvz-madde no="37" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanununun 1328 ilâ 1349 uncu maddeleri, bu Kanunun yürürlüğe girdiği tarihten itibaren uygulanır. Şu kadar ki, 4/6/1980 tarihli ve 17007 sayılı Resmî Gazetede yayımlanan 19/11/1976 tarihli Deniz Alacaklarına Karşı Mesuliyetin Sınırlanması Hakkında Milletlerarası Sözleşmenin Türkiye bakımından yürürlüğe girdiği 1/7/1998 tarihinden başlayarak, 24/7/2001 tarihli ve 24472 sayılı Resmî Gazetede yayımlanan 1992 Petrol Kirliliğinden Doğan Zararın Hukuki Sorumluluğu ile İlgili Uluslararası Sözleşmenin ve 18/7/2001 tarihli ve 24466 sayılı Resmî Gazetede yayımlanan 1992 Petrol Kirliliği Zararının Tazmini İçin Bir Uluslararası Fonun Kurulması ile İlgili Uluslararası Sözleşmenin Türkiye bakımından yürürlüğe girdiği 17/8/2002 tarihinden başlayarak uygulanması bundan müstesnadır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="İ" başlık="Cebrî icra">
        <mvz-madde no="38" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Ticaret Kanununun yürürlüğe girmesinden önce bir geminin paraya çevrilmesi yolu ile yapılan icra takibi kesinleşmiş olur veya yapı hâlindeki bir gemiye kesin haciz konulmuş bulunursa, paraya çevirmede Türk Ticaret Kanununun yürürlüğe girmesinden önceki hükümler uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>
    <mvz-bölüm no="7-YEDİNCİ" başlık="Sigorta Hukuku">
      <mvz-b1 no="A" başlık="Sigorta sözleşmesi">
        <mvz-madde no="39" başlık="">
          <mvz-fıkra no="1">
            <template>6762 sayılı Kanun yürürlükte iken yapılmış ve hüküm ifade etmeye başlamış sigorta sözleşmelerine, Türk Ticaret Kanununun yürürlüğe girmesinden itibaren bir yıl süreyle 6762 sayılı Kanun hükümleri uygulanır. Ancak, bu bir yıllık süre içinde sigorta ettireni, sigortalıyı ve lehdarı koruyan hükümler bakımından, 1517 nci maddesi müstesna, Türk Ticaret Kanunu hükümleri geçerli olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Birinci fıkranın birinci cümlesindeki bir yıllık süre içinde sona eren 6762 sayılı Kanuna tâbi sigorta sözleşmelerinin uzatılması ya da yenilenmesi hâlinde Türk Ticaret Kanunu hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
      <mvz-b1 no="B" başlık="Koruyucu hükümler">
        <mvz-madde no="40" başlık="">
          <mvz-fıkra no="1">
            <template>6762 sayılı Kanun yürürlükte iken yapılmış olup da Türk Ticaret Kanununun 1452, 1486, 1488 ve 1520 nci maddelerine aykırı bulunan sigorta sözleşmeleri de bu Kanunun 39 uncu maddesi hükmüne tâbidir.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b1>
    </mvz-bölüm>

  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Diğer Kanunların Değiştirilen ve Yürürlükten Kaldırılan Hükümleri ve Son Hükümler">
    <mvz-madde no="41" başlık="Değiştirilen ve yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>30 Teşrinisani 1330 tarihli Ecnebi Anonim ve Sermayesi Eshama Münkasim Şirketlerle Ecnebi Sigorta Şirketleri Hakkında Kanunu Muvakkat yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(9/6/1932 tarihli ve 2004 sayılı İcra ve İflâs Kanunu ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>29/6/1956 tarihli ve 6763 sayılı Türk Ticaret Kanununun Mer’iyet ve Tatbik Şekli Hakkında Kanun yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="42" başlık="Tüzük ve yönetmelikler">
      <mvz-fıkra no="1">
        <template>Türk Ticaret Kanunu veya bu Kanun uyarınca hazırlanacak tüzük ve yönetmelikler, Türk Ticaret Kanununun yürürlüğü tarihinden itibaren altı ay içinde yürürlüğe konulur.</template>
