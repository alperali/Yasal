  <mvz-künye tür="kanun" no="5580" başlık="ÖZEL ÖĞRETİM KURUMLARI KANUNU"
             tarih="8/2/2007" rgazete-tarih="14/2/2007" rgazete-sayı="26434"
             düstur-tertip="5" düstur-cilt="46" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, Türkiye Cumhuriyeti uyruklu gerçek kişiler, özel hukuk tüzel kişileri veya özel hukuk hükümlerine göre yönetilen tüzel kişiler tarafından açılacak özel öğretim kurumlarına kurum açma izni verilmesi, kurumun nakli, devri, personel çalıştırılması, kurumlara yapılacak malî destek ve bu kurumların eğitim-öğretim, yönetim, denetim ve gözetimi ile yabancılar tarafından açılmış bulunan özel öğretim kurumlarının; eğitim-öğretim, yönetim, denetim, gözetim ve personel çalıştırılmasına ilişkin usûl ve esasları düzenlemektir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun, Türkiye Cumhuriyeti uyruklu gerçek kişiler, özel hukuk tüzel kişileri veya özel hukuk hükümlerine göre yönetilen tüzel kişilerce açılan özel öğretim kurumları ile yabancılar tarafından açılmış bulunan özel öğretim kurumlarını kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen;</template>
        <mvz-bent no="a">
          <template>Bakanlık: Millî Eğitim Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kurum: Okul öncesi eğitim, ilköğretim, ortaöğretim, özel eğitim okulları ile çeşitli kursları, özel öğretim kurslarını, uzaktan öğretim yapan kuruluşları,  motorlu taşıt sürücüleri kursları, hizmet içi eğitim merkezleri,  özel eğitim ve rehabilitasyon merkezleri, sosyal etkinlik merkezleri, mesleki eğitim merkezleri ile benzeri özel öğretim kurumlarını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Okul: Özel eğitim, okul öncesi, ilkokul, ortaokul ve ortaöğretim ile Bakanlıkça dönüşüm programına alınan kurumlardan 2018-2019 eğitim-öğretim yılının sonuna kadar faaliyetleri devam eden ortaöğretim özel okulları,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Yabancı okullar: Yabancılar tarafından açılmış özel okulları,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Azınlık okulları: Rum, Ermeni ve Musevî azınlıklar tarafından kurulmuş, Lozan Antlaşması ile güvence altına alınmış ve kendi azınlığına mensup Türkiye Cumhuriyeti uyruklu öğrencilerin devam ettiği okul öncesi eğitim, ilköğretim ve ortaöğretim özel okullarını,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Çeşitli kurslar:  kişilerin sosyal, sanatsal, sportif, kültürel ve mesleki alanlarda bilgi, beceri, dil, yetenek ve deneyimlerini geliştirmek, isteklerine göre serbest zamanlarını değerlendirmek amacıyla faaliyet gösteren özel öğretim kurumlarını,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Özel eğitim okulu: Özel eğitim gerektiren bireylere hizmet veren, özel olarak yetiştirilmiş personelin bulunduğu, geliştirilmiş eğitim programlarının uygulandığı özel öğretim kurumunu,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Motorlu taşıt sürücüleri kursu: Motorlu taşıt sürücüsü yetiştirerek sınav sonucu sertifika veren ve trafikle ilgili eğitim-öğretim yaptıran özel öğretim kurumlarını,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Özel eğitim ve rehabilitasyon merkezi: Özel eğitim gerektiren bireylerin konuşma ve dil gelişim güçlüğü, ses bozuklukları, zihinsel, fiziksel, duyusal, sosyal, duygusal veya davranış problemlerini ortadan kaldırmak ya da etkilerini en az seviyeye indirmek, yeteneklerini yeniden en üst seviyeye çıkarmak, temel öz bakım becerilerini ve bağımsız yaşam becerilerini geliştirmek ve topluma uyumlarını sağlamak amacıyla faaliyet gösteren özel öğretim kurumlarını,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Milletlerarası özel öğretim kurumları: Yalnız yabancı uyruklu öğrencilerin devam edebilecekleri özel öğretim kurumlarını,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Kurucu: Kurumun sahibi olan ve adına kurum açma izin belgesi düzenlenen gerçek veya tüzel kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Kurucu temsilcisi: Özel hukuk tüzel kişileri veya özel hukuk hükümlerine göre yönetilen tüzel kişiler adına seçilen kişiyi,</template>
        </mvz-bent>
        <mvz-bent no="o">
          <template>Uzaktan öğretim kurumu: Çeşitli nedenlerle öğrenimlerini sürdüremeyenlere her türlü iletişim araçları ile eğitim-öğretim yapan kurumları,</template>
        </mvz-bent>
        <mvz-bent no="ö">
          <template>Özel öğretim kursu: Kişilerin, Bakanlıkça belirlenmiş bilim gruplarına uygun eğitim ortamlarında, öğrenim seviyelerine, ilgi ve isteklerine uygun öğretim programları doğrultusunda, bilgi, beceri, yetenek ve deneyimlerini geliştirdiği, serbest zamanlarını değerlendirdiği bir bilim grubunda eğitim veren kurumları,</template>
        </mvz-bent>
        <mvz-bent no="p">
          <template>Sosyal etkinlik merkezi: İl millî eğitim müdürlükleri ile belediyeler arasında yapılan ve Bakanlıkça onaylanan ortak işbirliği protokolleri çerçevesinde, Bakanlığın verdiği işyeri açma ve çalışma ruhsatı ile belediyelerce açılan ve işletilen, ilköğretim ve/veya ortaöğretim öğrencilerinin ödev ve projelerine ilişkin araştırmalar yaptığı, öğrencilerin ilgi, istek ve yetenekleri doğrultusunda sosyal, kültürel, sanatsal ve sportif faaliyetlerin yürütüldüğü özel öğretim kurumlarını,</template>
        </mvz-bent>
        <mvz-bent no="r">
          <template>Mesleki eğitim merkezi: Çıraklık, kalfalık ve ustalık eğitimi ile mesleki ve teknik kurs programlarının uygulandığı özel öğretim kurumunu,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Kurum Açma, Kurucu, Kurum Binaları, Milletlerarası Özel Öğretim Kurumları, Yabancı Okullar ve Azınlık Okulları">
    <mvz-madde no="3" başlık="Kurum açma izni">
      <mvz-fıkra no="1">
        <template>Bir kurumda öğretime başlayabilmek için kurum açma izni alınması zorunludur. İzin başvuruları ilgili millî eğitim müdürlüğüne yapılır. Valilikçe yapılan inceleme sonucunda açılması uygun görülen okullar dışındaki kurumlara kurum açma izni verilir. Valilikçe açılması uygun görülen okullara ilişkin başvurular ise kurum açma izni verilmek üzere Bakanlığa gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurum açma izni talebinin valilikçe reddedilmesi hâlinde, kurucu veya kurucu temsilcisi tarafından taleplerinin reddine ilişkin işlemin tebliğinden itibaren onbeş iş günü içinde Bakanlığa itirazda bulunulabilir. İtiraz, Bakanlıkça onbeş iş günü içinde karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurum açma izni alınmadıkça, kuruma öğrenci kaydı yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurum açma izni verilmesi, binanın kullanılış amaçlarına ve Bakanlıkça belirlenen standartlara uygun ve yeterli bulunmasıyla birlikte aşağıdaki şartların yerine getirilmesine bağlıdır:</template>
        <mvz-bent no="a">
          <template>Ders araç-gerecinin kurumun amaç ve ihtiyaçları için yeterli olduğunun bir rapor ile tespit edilmesi.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kurumun; yönetici, öğretmen ve diğer personelinin sayı ve nitelikleri yönünden uygun bulunması ve bu kurumda çalışacaklarının belgelendirilmesi.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kurumun yönetmelikleriyle öğretim programının Bakanlıkça incelenip onanmış olması.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Milletlerarası özel öğretim kurumları hariç bu Kanun kapsamındaki ilkokul, ortaokul, lise ve özel eğitim okulları için 1 Eylül tarihinden sonra verilen kurum açma izinleri, ertesi eğitim-öğretim yılından itibaren geçerlidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Kurumlara ad verilmesine ilişkin esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Gerçek ve tüzel kişiler tarafından; hizmet içi eğitim kapsamına giren faaliyetler dışında Kanun kapsamında belirtilen faaliyetler, bu Kanuna göre yetkili makamlardan kurum açma izni alınmadan yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Askerî okullar, emniyet teşkilâtına bağlı okullar ve din eğitimi-öğretimi yapan kurumların aynı veya benzeri özel öğretim kurumları açılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>10/7/2004 tarihli ve 5216 sayılı Büyükşehir Belediyesi Kanununun 7 nci maddesinin birinci fıkrasının (d) bendi, 3/7/2005 tarihli ve 5393 sayılı Belediye Kanununun 15 inci maddesinin birinci fıkrasının (c) bendi ile 22/2/2005 tarihli ve 5302 sayılı İl Özel İdaresi Kanununun 7 nci maddesinin birinci fıkrasının (a) bendinde belirtilen izin veya ruhsatlar, bu Kanun kapsamındaki özel öğretim kurumlarını kapsamaz. Özel öğretim kurumları mevzuatına uygun olmak kaydıyla işyeri açma ve çalışma ruhsatı Bakanlıkça verilir. Bakanlık bu yetkisini valiliklere devredebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Her ne ad altında olursa olsun, eğitim ve öğretim sunmak amacıyla yürütülen faaliyetler Bakanlığın izin ve denetimine tabidir. Bu faaliyetleri yürütenler, özel öğretim kurumları için bu Kanunda öngörülen kurallara uymakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Bu Kanun kapsamındaki eğitim-öğretim faaliyetlerini yapan ancak bu Kanuna uygun olarak kurum açma izni ile iş yeri açma ve çalışma ruhsatı düzenlenmeyen yerleri kuran veya işletenlere brüt asgari ücretin 20 katı idari para cezası uygulanır ve bu yerler valiliklerce kapatılır. Bu fıkranın uygulanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Bu Kanunun 1 inci maddesinde belirtilen şartları taşıyıp özel hukuk tüzel kişileri veya özel hukuk hükümlerine göre yönetilen tüzel kişiler tarafından açılan özel öğretim kurumlarının kurucularında yabancı uyruklu gerçek veya tüzel kişilerin ortaklığının tespit edilmesi hâlinde söz konusu kurumlara brüt asgari ücretin 20 katı idari para cezası uygulanır ve bu kurumlara yabancı uyruklu gerçek veya tüzel kişilerin ortaklığının sona erdirilmesine ilişkin 30 iş günü süre verilir. Söz konusu süreye rağmen yabancı uyruklu gerçek veya tüzel kişilerin ortaklığının sona erdirilmemesi veya aynı kurumda ikinci kez yabancı uyruklu gerçek veya tüzel kişilerin ortaklığının tespiti hâlinde söz konusu kurumun kurum açma izni ile işyeri açma ve çalışma ruhsatı iptal edilir. Bu fıkranın uygulanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Kurucu/kurucu temsilcisinin nitelikleri ve kurum binaları">
      <mvz-fıkra no="1">
        <template>Özel öğretim kurumlarının gerçek kişi kurucularında, tüzel kişi kurucularının yönetim organlarında, kurucu temsilcilerinde ve personelinde; 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezası ya da affa uğramış olsa bile Devletin egemenlik alametlerine ve organlarının saygınlığına karşı suçlar, Devletin güvenliğine karşı suçlar, anayasal düzene ve bu düzenin işleyişine karşı suçlar, millî savunmaya karşı suçlar, Devlet sırlarına karşı suçlar ve casusluk, zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama, kaçakçılık suçları, cinsel dokunulmazlığa karşı suçlar ve 11/10/2006 tarihli ve 5549 sayılı Suç Gelirlerinin Aklanmasının Önlenmesi Hakkında Kanun kapsamında işlenen suçlardan ceza almamış olması veya haklarında bu suçlardan dolayı kovuşturma bulunmaması, terör örgütlerine ya da Millî Güvenlik Kurulunca Devletin millî güvenliğine karşı faaliyette bulunduğuna karar verilen yapı, oluşum veya gruplara üyeliği, mensubiyeti ya da iltisakı yahut bunlarla irtibatı olmaması şartı aranır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurum binalarının nitelikleri, bu binalarda açılabilecek kurumlar ile her tür tesis ve donanıma ilişkin standartlar Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Meyhane, kahvehane, kıraathane, bar, elektronik oyun merkezleri gibi umuma açık yerler ile açık alkollü içki satılan yerlerin, okul binalarından kapıdan kapıya en az yüz metre uzaklıkta bulunması zorunludur. Özel eğitime muhtaç bireylerin devam ettikleri öğretim kurumları ile okullar dışındaki diğer özel öğretim kurumlarında bu zorunluluk aranmaz. Ancak, söz konusu özel öğretim kurumlarıyla yukarıda belirtilen türdeki iş yerleri aynı binada bulunamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Turizmin yoğun olduğu yörelerde bulunan okulların tatil olduğu dönemlerde, yukarıda belirtilen iş yerleri ile okullar arasında yüz metre uzaklık şartı aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Uzaklıkla ilgili esaslar İçişleri, Çevre ve Şehircilik, Millî Eğitim, Sağlık, Kültür ve Turizm bakanlıklarının müştereken hazırlayacakları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Milletlerarası özel öğretim kurumları, yabancı okullar ve azınlık okulları">
      <mvz-fıkra no="1">
        <template>Milletlerarası özel öğretim kurumları, yabancı okullar ve azınlık okullarına ilişkin esaslar aşağıda belirtilmiştir.</template>
        <mvz-bent no="a">
          <template>Milletlerarası özel öğretim kurumları:</template>
          <mvz-altbent no="1">
            <template>Yalnız yabancı uyruklu öğrencilerin devam edebilecekleri yüksek öğretim dışındaki milletlerarası özel öğretim kurumu; yabancı uyruklu gerçek ve tüzel kişiler tarafından veya Türk vatandaşlarıyla ortaklık yolu ile 4875 sayılı Doğrudan Yabancı Yatırımlar Kanunu çerçevesinde Cumhurbaşkanının izniyle açılabilir. Türkiye Cumhuriyeti uyruklu gerçek kişiler, özel hukuk tüzel kişileri veya özel hukuk hükümlerine göre yönetilen tüzel kişiler de kendi adlarına aynı amaçla milletlerarası mahiyette özel öğretim kurumu açabilir.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Bu öğretim kurumlarında; Türk Devletinin ülkesi ve milletiyle bölünmez bütünlüğüne, güvenliğine ve menfaatlerine aykırı, Türk Milletinin millî, ahlâkî, insanî, manevî ve kültürel değerleri aleyhinde eğitim-öğretim yapılamaz.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Bu kurumlarda öğretim programları, eğitim-öğretim faaliyetleri ve diğer hususlarla ilgili işlemler, kurum yönetimince hazırlanan ve Bakanlıkça onaylanan esaslara göre yürütülür.  Bu kurumlara devam ederken Türk vatandaşlığını kazananlar, bulunduğu öğretim kademesinin sonuna kadar aynı kurumda veya aynı programı uygulayan başka bir milletlerarası özel öğretim kurumunda öğrenimlerine devam edebilirler.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Bu konularda Bakanlığın denetim hakkı saklıdır.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yabancı okullar:</template>
          <mvz-altbent no="1">
            <template>Cumhurbaşkanının izni ile yeni arazi edinebilir ve kapasitelerini en fazla beş misline kadar artırabilir.</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Üzerinde kuruldukları araziler genişletilmemek şartı ve Bakanlığın izni ile mevcut arazi üzerindeki bina, öğrenci ve donanım kapasitelerini en çok bir mislini geçmemek üzere artırabilir veya yenileyebilir.</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Mevcut binalarında ihtiyaç halinde valiliğin izni ile tadilat yapabilir.</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Bu bentte belirtilenler dışında, yabancı okulların; binaları genişletilemez, şubeleri açılamaz, mevcut binalarının yerine kaim olmak üzere yeniden binalar inşa edilemez. Bu amaçla herhangi bir mülk edinilemez veya kiralanamaz.</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>Yabancı okulların taşınmaz malları, kurucularının veya yetkililerinin önerisi ile Bakanlığa ya da kuruluş amaçları eğitim vermek olan 4721 sayılı Türk Medenî Kanununa göre kurulan vakıflara Cumhurbaşkanının izni ile devredilebilir. Devredilen bu kurumların yönetim, eğitim-öğretim özellikleri dikkate alınarak korunması yararlı görülenler Bakanlıkça tespit edilir.</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Azınlık okulları:</template>
          <mvz-altbent no="1">
            <template>23/8/1923 tarihli ve 340 sayılı Kanuna bağlı Antlaşmanın 40 ve 41 inci maddeleriyle ilgisi bulunan okulların özellik göstermesi gereken hususları yönetmelikle tespit edilir. Bu yönetmelik, ilgili ülkelerin bu konulardaki mütekabil mevzuat ve uygulamaları dikkate alınmak suretiyle hazırlanır. Yönetmelikte belirtilmeyen hususlarda resmî okullar mevzuatı uygulanır. Bu okullarda yalnız kendi azınlığına mensup Türkiye Cumhuriyeti vatandaşlarının çocukları okuyabilir.</template>
          </mvz-altbent>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Eğitim-Öğretim, Yönetim, Kurumun Kapatılması ve Personel İşlemleri">
    <mvz-madde no="6" başlık="Eğitim-öğretim ve kurumların yönetimi">
      <mvz-fıkra no="1">
        <template>Kurumlarda eğitim-öğretim ve yönetim, 1739 sayılı Milli Eğitim Temel Kanununda ifade edilen Türk Millî Eğitiminin genel amaç ve temel ilkelerine uygun olarak yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurumlarda uygulanacak öğretim programı ve haftalık ders çizelgesi, resmî kurumlarda uygulanan usûl ve esaslar çerçevesinde belirlenir. Bakanlıkça uygun bulunması durumunda farklı öğretim programları ve haftalık ders çizelgesi de uygulanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurumun veya yönetimleri birleştirilen kurumların bir müdür tarafından yönetilmesi esastır. Yönetimleri birleştirilecek kurumlarla ilgili usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bir kimse birden fazla kurumun kurucusu olabilir. Gerekli nitelikleri taşıyan kurucu/kurucu temsilcisi, kurumun müdürü de olabilir. Üzerinde müdürlük görevi bulunmayan kurucu/kurucu temsilcisi, kurumun eğitim-öğretimine ve bunlarla ilgili yönetim işlerine karışamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bünyesinde birden fazla kurum bulunduran kurumlara genel müdür ve genel müdür yardımcısı atanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanun kapsamında faaliyet gösteren kurumlarda, Mesleki Yeterlilik Kurumunca mesleki yeterlilik belgesi verilen meslekler hariç olmak üzere, Bakanlıkça belirlenen programları başarıyla tamamlayanlar aldıkları kurs bitirme belgeleriyle tamamladıkları programlara ilişkin iş yerlerinde çalışabilir ve iş yeri açabilirler. Bu durumda olan kişiler için başkaca bir meslek belgesi aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Uygulanan program doğrultusunda yapılacak kurs bitirme, seviye tespit ve seviye tamamlama sınavları ile programın gerektirdiği diğer sınavlar için sınava girenlerden alınacak sınav ücretleri, bu ücretlerden bu sınavlarda görevlendirilenlere ödenecek ücretler ve sınav giderleri ile sınavların usul ve esasları Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Kurum açma izninin iptali, kurumun kapatılması, devri ve nakli">
      <mvz-fıkra no="1">
        <template>Kurum açma izni verilen kurumlardan iki yıl içerisinde faaliyete başlamayan, faaliyete başladıktan sonra yönetmelikte belirtilen süreden daha fazla izinsiz ara veren veya söz konusu izni amacı dışında kullandığı tespit edilen kurumların kurum açma izni ve iş yeri açma ve çalışma ruhsatı iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Özel öğretim kurumunun;</template>
        <mvz-bent no="a">
          <template>Bakanlıkça onaylı yerleşim planında izinsiz değişiklik yapması,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Gerçeğe aykırı veya yanıltıcı reklam ya da ilan vermesi, reklam veya ilanlarda öğrenci resim ya da bilgilerini kullanması,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Haftalık ders çizelgesi ve programları Bakanlık izni olmadan kurumda uygulaması,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Bu Kanun ve bu Kanuna dayanılarak yürürlüğe konulan yönetmelik ve yönergelerde belirtilen hükümlere aykırı fiillerde bulunması,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Mevzuatta belirtilen sayıda personel çalıştırmaması veya mevzuata aykırı personel çalıştırması,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>14/6/1973 tarihli ve 1739 sayılı Millî Eğitim Temel Kanununun genel ve özel amaçları ile temel ilkelerine uymaması,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kurum açma şartlarından herhangi birini kaybetmesi,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Mevzuata uygun olarak kapatılmaması,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>hâllerinde; (a), (b), (c) ve (d) bentlerindeki fiiller için brüt asgari ücretin beş katı; (e) ve (f) bentlerindeki fiiller için brüt asgari ücretin on katı ve (g) bendindeki fiil için brüt asgari ücretin yirmi katı idari para cezası uygulanır. Bu fıkranın (a), (b), (c), (d), (e), (f) ve (g) bentlerindeki fiillerin tekrarı hâlinde idari para cezası miktarı beş kat artırılarak uygulanır ve bu bentlerdeki fiillerin üçüncü kez tekrarlanması hâlinde ise kurum açma izni ile iş yeri açma ve çalışma ruhsatı iptal edilir, (h) bendindeki fiilin işlenmesi hâlinde brüt asgari ücretin yirmi katı idari para cezası verilir ve kurum açma izni ile iş yeri açma ve çalışma ruhsatı iptal edilir. İdari para cezası, kurum açma iznini vermeye yetkili makam tarafından verilir. Bu fıkranın uygulanmasına ilişkin usul ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Okul kurucusu/kurucu temsilcisi; Bakanlığa, yönetici, öğretmen, uzman öğretici, usta öğretici ve öğrenci/kursiyerlere en az üç ay önce yazılı olarak bildirmek şartıyla ve gerekçesi Bakanlıkça uygun bulunduğu takdirde öğretim yılı sonunda okulunu kapatabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Okullar dışındaki diğer kurumların kurucusu/kurucu temsilcisi valiliğe, yönetici, öğretmen, uzman öğretici, usta öğretici ve öğrenci/kursiyerlere en az üç ay önce yazılı olarak bildirmek şartıyla ve gerekçesi valilikçe uygun bulunduğu takdirde dönem sonunda kurumunu kapatabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kapanan veya kapatılan kurum; mühürlerini, yönetici, öğretmen ve öğrencilerle ilgili bütün defterlerini, dosyalarını ve diğer evrakını ilgili valiliğe devir ve teslim etmeye mecburdur.  Devir ve teslimden kaçınan veya bu görevi savsaklayan kurucu hakkında brüt asgari ücretin yirmi katı idari para cezası uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanunda belirtilen şartlara uymadan kurumunu kapatanlar ile soruşturma sonucu kurum açma izni ile işyeri açma ve çalışma ruhsatı iptal edilen kurucuya beş yıl geçmeden tekrar kurum açma izni veya bir kurumu devralma ya da bir kuruma ortak olma izni verilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kapatılan kurumlarla ilgili olarak öğrenci/kursiyer veya velilerinin, kurucular aleyhine genel hükümlere göre dava açma hakları saklıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Kurumların devri ve nakline ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Kurumlarda çalıştırılacak personel</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="">
      <mvz-fıkra no="1">
        <template>Kurumların eğitim-öğretim ve yönetim hizmetlerinin, asıl görevi bu kurumlarda olan yönetici ve eğitim-öğretim elemanları ile yürütülmesi esastır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bir kurumun öğretime başladığı tarihten itibaren mevcut ders saati sayısının, kuruluş sırasında üçte birinin, kuruluşundan üç yıl sonra da en az üçte ikisinin asıl görevi bu kurumlarda olan öğretmen, uzman öğretici veya usta öğreticiler tarafından okutulması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurumların yöneticilik ve eğitim-öğretim hizmetlerinde, en az dengi resmî öğretim kurumlarına atanabilmek için gerekli nitelik ve şartları taşıyanlar, resmî dengi bulunmayan kurumların yöneticilik ve eğitim-öğretim hizmetlerinde ise yönetmelikle belirtilen nitelik ve şartları taşıyanlar görevlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İhtiyaç halinde, resmî okullarda görevli öğretmenlere asıl görevlerini aksatmamak ve aylık karşılığı okutmakla yükümlü bulunduğu haftalık ders saati sayısını doldurmaları kaydı ve çalıştıkları kurumların izni ile sadece okullarda, aylık karşılığı okutmakla yükümlü bulunduğu haftalık ders saati sayısının yarısı kadar ücretli ders verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Uzman öğretici, usta öğretici ve öğretmenlik yapma nitelik ve şartlarını taşıyan diğer Devlet memurlarına, ilgili birimlerin izniyle haftada on saati geçmemek üzere ücretli ders görevi verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Ders saati ücretli olarak görevlendirileceklerle ilgili diğer hususlar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Kurumların müdürleri, kurucu/kurucu temsilcisi tarafından; diğer yönetici ve öğretmen, uzman öğretici ve usta öğreticileri ise müdürlerince seçilir ve çalışma izinleri valiliğin iznine sunulur. Valiliğin izni alınmadan müdür ile diğer yönetici, öğretmen, uzman öğretici ve usta öğreticiler işe başlatılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Gerekli şartları taşıyan yönetici, öğretmen, uzman öğretici ve usta öğreticiler için valilikçe çalışma izni düzenlenir. Çalışma izninin iptali yine valilikçe yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu Kanun kapsamında çalışacak yabancılar, 4817 sayılı Yabancıların Çalışma İzinleri Hakkında Kanun hükümleri doğrultusunda görevlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Türkçe'den başka dille öğretim yapan ve yabancılar tarafından açılmış bulunan okulların kurucuları ile müdürleri, Türkiye Cumhuriyeti uyruklu, Türkçe veya Türkçe kültür dersleri öğretmenliği yapma niteliğini taşıyan ve öğretim dilini bilenlerden birini, Türk müdür başyardımcısı olarak çalışma izni düzenlenmek üzere valiliğe önerir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Öğretim dilini bilen Türkçe veya Türkçe kültür dersleri öğretmeni bulunmaması hâlinde, okulun öğretim dilinde özel alan eğitimi görmüş, Türkiye Cumhuriyeti uyruklu öğretmenlere de bu görev verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Bu öneriyi, uyarıya rağmen bir ay içinde yapmayan okulların Türk müdür başyardımcılarını, yukarıdaki şartları taşıyan öğretmenler arasından valilik seçer ve işe başlatır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Özlük hakları ve sorumluluklar">
      <mvz-fıkra no="1">
        <template>Kurumlarda çalışan yönetici, öğretmen, uzman öğretici ve usta öğreticiler ile kurucu veya kurucu temsilcisi arasında yapılacak iş sözleşmesi, en az bir takvim yılı süreli olmak üzere yönetmelikle belirtilen esaslara göre yazılı olarak yapılır. Mazeretleri nedeniyle kurumdan ayrılan öğretmen ve öğreticilerin yerine alınacak olanlar ile devredilen kurumların yönetici, öğretmen ve öğreticileri ile bir yıldan daha az bir süre için de iş sözleşmesi yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Sosyal yardım kapsamındaki ek ödemeler, bütçe kanunlarıyla resmî okul öğretmen ve personeline sağlanan haklara denk olarak okul öğretmenlerine ve personeline de ödenir. Sosyal yardım kapsamındaki ek ödemelerden gelir vergisi kesilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurumlardaki ek ders ücreti miktarı, resmî okullar için tespit edilen miktardan az olamaz. Ancak, 8 inci madde uyarınca resmî okul ve kurumlardan ücretli olarak görevlendirilenlere verilecek ek ders ücreti miktarı, resmî okullar için tespit edilen ek ders ücretinin iki katını geçemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurumlarda görev yapan yönetici, öğretmen, uzman öğretici ve usta öğreticiler, bu Kanun hükümleri saklı kalmak üzere;</template>
        <mvz-bent no="a">
          <template>Sosyal güvenlik ve özlük hakları yönünden; 506 sayılı Sosyal Sigortalar Kanunu ile 4857 sayılı İş Kanunu,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yetki, sorumluluk, ödül ve cezalar ile bunların uygulanması bakımından; 657 sayılı Devlet Memurları Kanunu, 1702 sayılı İlk ve Orta Tedrisat Muallimlerinin Terfi ve Tecziyeleri Hakkında Kanun, 4357 sayılı Hususi İdarelerden Maaş Alan İlkokul Öğretmenlerinin Kadrolarına Terfi, Taltif ve Cezalandırılmalarına ve Bu Öğretmenler İçin Teşkil Edilecek Sağlık ve İçtimaî Yardım Sandığı ile Yapı Sandığına ve Öğretmenlerin Alacaklarına Dair Kanun ile 4483 sayılı Memurlar ve Diğer Kamu Görevlilerinin Yargılanması Hakkında Kanun,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>hükümlerine tâbidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Ancak, 657 sayılı Devlet Memurları Kanununa göre kademe ilerlemesinin durdurulması cezasını gerektiren fiillerin işlenmesi halinde bu kişilere kademe ilerlemesinin durdurulması cezası yerine brüt aylığından 1/4'ü ile 1/2'si arasında maaş kesim cezası, çalışma izni veren makam tarafından verilir. Tekrarı hâlinde ise göreve son verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>1702 sayılı Kanuna göre meslekten çıkarılma veya 657 sayılı Devlet Memurları Kanununa göre Devlet memurluğundan çıkarma cezasını gerektiren fiil ve hâllerin işlenmesi hâlinde, Bakanlığın görüşü alınmak suretiyle personelin görevine, izni veren makam tarafından son verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Yetki, sorumluluk, ödül, sicil, disiplin ve cezaların uygulanmasına ilişkin diğer esas ve usûller çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Kurumlarda görev yapan yönetici, öğretmen, uzman öğretici ve usta öğreticiler, görevleri sırasında suç işlemeleri veya görevleri nedeniyle kendilerine karşı işlenen suçlardan dolayı 5237 sayılı Türk Ceza Kanununun uygulanması ve ceza kovuşturması bakımından kamu görevlisi sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Çalışma izninin iptali ve geçici görevlendirme">
      <mvz-fıkra no="1">
        <template>İki defa teftiş raporuyla başarısızlığı tespit edilen yönetici, öğretmen, uzman öğretici ve usta öğreticilerin çalışma izni, izni veren makam tarafından iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(İptal)</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu durum, ilgiliye tebliğ edilmek üzere kuruma bildirilir. Tebliğ, sözleşmenin feshine ve ilgilinin kurumla ilişiğinin kesilmesine yeter sebep teşkil eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurumların teftiş ve denetlenmesi sırasında valilik, lüzum görülen durumlarda kurumun yönetici, öğretmen, uzman öğretici ve usta öğreticilerini görevden uzaklaştırabilir. Bu takdirde valilikçe, geçici görevlendirme yapılarak gerekli tedbirler alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Denetim, Reklâm, Malî Hükümler ve Ücretler">
    <mvz-madde no="11" başlık="Denetim, reklâm ve ilânlar">
      <mvz-fıkra no="1">
        <template>Kurumlar ve bu kurumlarda görevli personel, Bakanlığın denetimi ve gözetimi altındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Eğitim-öğretim ve yönetim bakımından yapılan denetimlerde, kurumun özel yönetmeliği de dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurumlar, ancak amaçlarına uygun tanıtıcı mahiyette reklâm ve ilân verebilirler. Bu kurumlar reklâm ve ilânlarında gerçeğe aykırı beyanlarda bulunamazlar ve televizyonda reklâm ve ilân yapamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Malî hükümler">
      <mvz-fıkra no="1">
        <template>Kurumlar, faaliyetlerini sadece kazanç sağlamak için düzenleyemezler. Ancak, Türk Millî Eğitiminin amaçları doğrultusunda eğitimin kalitesini yükseltmek, gelişmelerine fırsat ve imkân verecek yatırımlar ve hizmetler yapmak üzere gelir sağlayabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Okulların su, doğal gaz ve elektrik ücretlendirilmesi, resmî okullara uygulanan tarife üzerinden uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanun kapsamında organize sanayi bölgelerinde açılan mesleki ve teknik eğitim okullarında öğrenim gören Türkiye Cumhuriyeti vatandaşı her bir öğrenci için, 2012-2013 eğitim ve öğretim yılından başlamak üzere, resmî okullarda öğrenim gören bir öğrencinin okul türüne göre Devlete maliyetinin bir buçuk katını geçmemek üzere, her eğitim öğretim yılı itibarıyla Maliye Bakanlığı ile Bakanlık tarafından müştereken belirlenen tutarda, Bakanlık bütçesine bu amaçla konulan ödenekten eğitim ve öğretim desteği yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Cumhurbaşkanı kararıyla, bu Kanun kapsamında organize sanayi bölgeleri dışında açılan mesleki ve teknik eğitim okullarında öğrenim gören Türkiye Cumhuriyeti vatandaşı öğrenciler için de altıncı fıkradaki usul ve esaslar çerçevesinde eğitim ve öğretim desteği yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Söz konusu eğitim öğretim hizmetini sunan veya yararlananların, gerçek dışı beyanda bulunmak suretiyle fazladan ödemeye sebebiyet vermeleri durumunda bu tutarların, ödemenin yapıldığı tarihten itibaren 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 51 inci maddesine göre hesaplanacak gecikme zammı ile birlikte bir ay içinde ödenmesi, yapılacak tebligatla sebebiyet verenlerden istenir. Bu süre içinde ödenmemesi hâlinde bu tutarlar, anılan Kanun hükümlerine göre Maliye Bakanlığına bağlı vergi daireleri tarafından takip ve tahsil edilir. Bu fiillerin tekrarı hâlinde, ayrıca kurum açma izinleri iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu konu ile ilgili öğrenci başarı durumu da dahil olmak üzere destek verilme kriterleri, hangi eğitim ve öğretim alanlarına destek verileceğine dair kurallar ile diğer usul ve esaslar Maliye Bakanlığı ve Bakanlıkça müştereken hazırlanan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu Kanun kapsamında açılan mesleki ve teknik anadolu liselerinde verilen mesleki eğitimin kalitesini, öğretmen ve öğrencilerin mesleki bilgi ve becerilerini geliştirmek amacıyla alan ve dalların özelliklerine göre Bakanlıkça belirlenen standartlara ve donanıma sahip atölye ve laboratuvarlarda üretim yapılabilir ve üretilen malların satışından elde edilen gelir okulun eğitim, öğretim ve yönetim hizmetlerinde kullanılır. Üretimde görev alan öğrenci ve personele ödenen pay ile üretim şartlarına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu Kanun kapsamında faaliyet gösteren çeşitli kurslar, kurumlarında öğretim faaliyetlerinin yanında, programlarının içeriğine uygun, eğitim personeli ve kursiyerlerin katılımıyla bedeli karşılığı mal ve hizmet üretiminde bulunabilir. Mal ve hizmet üretiminin yapılacağı programlar, üretim faaliyetine katılanlara ödenecek ücretlerin belirlenmesi ile bu fıkranın uygulanmasına ilişkin diğer usul ve esaslar Bakanlıkça belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Öğrenim ücreti ve diğer ücretler, ücretsiz öğrenim ve yabancı uyruklu öğrenciler">
      <mvz-fıkra no="1">
        <template>Öğrenim ücreti ve diğer ücretler, kurumlarca her yıl tespit edilerek ocak ayından itibaren en geç mayıs ayında ilân edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ücretlerin hangi esaslara göre tespit, tayin, ilân ve tahsil edileceği yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurumlar, öğrenim gören öğrenci sayısının yüzde üçünden az olmamak üzere ücretsiz öğrenci okutmakla yükümlüdür. Bakanlıkça bu oran yüzde ona kadar artırılabilir.  Ücretsiz okutmada; 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanunu, 3/11/1980 tarihli ve 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanun veya 2330 sayılı Kanun hükümleri uygulanarak aylık bağlanmasını gerektiren kanunlar, 8/6/1949 tarihli ve 5434 sayılı Türkiye Cumhuriyeti Emekli Sandığı Kanununun 56 ncı, mülga 45 inci ve 64 üncü maddeleri ile 31/5/2006 tarihli ve 5510 sayılı Kanunun 47 nci maddesi kapsamında harp veya vazife malulü sayılanların ilk ve orta öğretim çağındaki çocukları ile haklarında korunma, bakım veya barınma kararı verilen çocuklara öncelik verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Ücretsiz okutulacak öğrencilerin yüzdesi, seçimi ve kurumlara kabul şartlarına ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurumlar ayrıca, öğrenim bursu verebilirler. Öğrenim bursu verilmesine ilişkin usûl ve esaslar yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bir okula alınabilecek yabancı uyruklu öğrenci sayısı, o okulda okuyan Türkiye Cumhuriyeti uyruklu öğrenci sayısının yüzde otuzunu aşamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Geçici ve Son Hükümler">
    <mvz-madde no="14" başlık="Yürürlükten kaldırılan kanun, yönetmelikler ve hüküm bulunmayan haller">
      <mvz-fıkra no="1">
        <template>8/6/1965 tarihli ve 625 sayılı Özel Öğretim Kurumları Kanunu yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunda belirtilmiş olan yönetmelikler, Kanunun yürürlüğe girdiği tarihten itibaren bir yıl içinde yürürlüğe konulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunda hüküm bulunmayan hususlarda, resmî öğretim kurumlarında uygulanan mevzuat hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="EK">
      <mvz-fıkra no="1">
        <template>(İptal)</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanun kapsamında örgün eğitim yapan özel ilkokul, özel ortaokul ve özel liselerde öğrenim gören Türkiye Cumhuriyeti vatandaşı öğrenciler için, resmî okullarda öğrenim gören bir öğrencinin okul türüne göre her kademede okulun öğrenim süresini aşmamak üzere, eğitim ve öğretim desteği verilebilir. Bu fıkra kapsamındaki eğitim ve öğretim desteğinden özel okul öncesi eğitim kurumlarından eğitim alanlar da, 48-66 ay arasında olmak şartıyla en fazla bir eğitim-öğretim yılı süresince yararlandırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Eğitim ve öğretim desteği, Bakanlıkça eğitim kademelerine göre her bir derslik için belirlenen asgari öğrenci sayısının üzerinde ve her hâlükârda derslik başına belirlenen azami öğrenci sayısını geçmemek üzere verilebilir. Eğitim ve öğretim desteği verilecek toplam öğrenci sayısı her yıl Maliye Bakanlığı ve Bakanlıkça müştereken belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Eğitim ve öğretim desteği; yörenin kalkınmada öncelik derecesi ve gelişmişlik durumu, öğrencinin ailesinin gelir düzeyi, eğitim bölgesinin öğrenci sayısı, desteklenen öğrenci ve öğrencinin gideceği okulun başarı seviyeleri ile öncelikli öğrenciler gibi ölçütler ayrı ayrı veya birlikte dikkate alınarak verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Söz konusu eğitim öğretim hizmetini sunan veya yararlananların, gerçek dışı beyanda bulunmak suretiyle fazladan ödemeye sebebiyet vermeleri durumunda bu tutarların, ödemenin yapıldığı tarihten itibaren 6183 sayılı Kanunun 51 inci maddesine göre hesaplanacak gecikme zammı ile birlikte bir ay içinde ödenmesi, yapılacak tebligatla sebebiyet verenlerden istenir. Bu süre içinde ödenmemesi hâlinde bu tutarlar, anılan Kanun hükümlerine göre Maliye Bakanlığına bağlı vergi daireleri tarafından takip ve tahsil edilir. Bu fiillerin tekrarı hâlinde, ayrıca kurum açma izinleri iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Dönüşüm programı kapsamındaki kurumları, aynı amaç ve niteliklerinin korunması şartıyla devralanlar, bu madde hükümlerinden Bakanlığın izni ile yararlandırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Dönüşüm sürecinin bitiminde dönüşme talebinde bulundukları örgün eğitim kurumunun haiz olması gereken şartları karşılayamayanların kurum açma izinleri iptal edilerek faaliyetlerine son verilir. Bu durumdaki kurumlardan, teşvik uygulamaları kapsamında yararlandıkları istisna, muafiyet ve haklar ile diğer teşviklerin parasal tutarının, ilgili teşvikten yararlandırılma tarihinden itibaren 6183 sayılı Kanunun 51 inci maddesine göre hesaplanacak gecikme zammı ile birlikte bir ay içinde ödenmesi yapılacak tebligatla ilgililerden istenir. Bu süre içinde ödenmemesi hâlinde bu tutarlar anılan Kanun hükümlerine göre Maliye Bakanlığına bağlı vergi daireleri tarafından takip ve tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu madde kapsamında Bakanlıkta istihdam edileceklerde aranacak şartlar, eğitim ve öğretim desteğinin verilmesine ilişkin ölçütler, desteğin verileceği eğitim kurumu türleri, eğitim kademeleri ve kurumlar itibarıyla verilecek destek tutarları, eğitim ve öğretim desteğinin kontrol ve denetimi ile bu maddenin uygulanmasına ilişkin diğer usul ve esaslar Maliye Bakanlığı ve Bakanlıkça müştereken hazırlanan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="EK">
      <mvz-fıkra no="1">
        <template>Okullar ile özel öğretim kursları hariç olmak üzere başka adlarla da olsa ilköğretim ve ortaöğretim örgün eğitim programlarının aynısı veya bir kısmını uygulayan ya da bu programlara yönelik deneme, seviye tespit sınavı gibi adlarla toplu sınav organizasyonları yapmak üzere faaliyet göstermek için yüz yüze veya uzaktan öğretim yöntemi ile özel öğretim kurumları veya yerler açılamaz, işletilemez, öğretim programları oluşturulamaz. Sivil toplum kuruluşları ile yükseköğretim kurumlarının sürekli eğitim merkezleri gibi birimlerinde de bu faaliyetler yürütülemez. Belediyeler ise il millî eğitim müdürlükleri ile yapılan ve Bakanlıkça onaylanan ortak işbirliği protokolleri çerçevesinde, örgün eğitim programlarına destek mahiyetinde ücretsiz kurslar açabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen yönetmelikler yürürlüğe girinceye kadar, mevcut yönetmeliklerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanun yürürlüğe girmeden önce, resmî okullarda görevli olup kurumlarda ücretli ders veren öğretmenler, çalışma izni sürelerinin bitimi tarihine kadar kurumlardaki görevlerine devam edebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 12 nci maddesi 2006-2007 öğretim yılından itibaren uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>2828 sayılı Sosyal Hizmetler ve Çocuk Esirgeme Kurumu Kanunu hükümleri gereği izin almış olan özel eğitim ve rehabilitasyon merkezleri 31/12/2007 tarihine kadar Millî Eğitim Bakanlığınca belirlenen şartlara uygun olarak açılış izinlerini yenilerler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>(İptal)</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık, bunlardan 1/9/2015 tarihine kadar başvuranları, belirlenecek esaslara göre uygun görülmesi hâlinde öğretim kurumlarına dönüşüm programına alır. Dönüşüm programına alınan kurumların, 2018-2019 eğitim öğretim yılının bitimine kadar mevzuatta öngörülen şartları karşılamaları kaydıyla dönüşebilecekleri okul ve diğer kurum türleri ile dönüşüm esas ve usulleri Bakanlıkça çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dönüşüm programına alınan öğretim kurumlarının faaliyetlerini sürdürebilmelerine ilişkin olarak 4 üncü maddenin üçüncü fıkrasının birinci cümlesi ile 8/6/1942 tarihli ve 4250 sayılı İspirto ve İspirtolu İçkiler İnhisarı Kanununun 9 uncu maddesinin ikinci fıkrası hükümleri 2018-2019 eğitim-öğretim yılının bitimine kadar uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu fıkranın yayımı tarihinde faaliyet gösterenlerden dönüşüm programına alınan öğrenci etüt eğitim merkezleri hariç olmak üzere, halen faaliyette olan öğrenci etüt eğitim merkezleri, faaliyetlerine 1/7/2017 tarihine kadar devam edebilirler. En geç 29/7/2017 tarihine kadar bu Kanunun 2 nci maddesinin birinci fıkrasının (c), (g), (h), (i), (k), (o) ve (ö) bentlerinde tanımlanan özel öğretim kurumlarından birinin gerektirdiği şartlara uygun hale getirilmeyen ve kurum açma izni buna göre düzenlenmeyen öğrenci etüt eğitim merkezleri hakkında sürekli kapatma işlemi uygulanır. Bu fıkranın uygulanmasına ilişkin hususlar Bakanlıkça çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddenin yayımı tarihinde faaliyet gösteren özel öğretim kursları, eğitim ve öğretim faaliyetlerine 1/8/2017 tarihinden itibaren bir bilim grubunda devam edebilirler. Kurum açma izinleri de buna uygun olarak düzenlenir ve en geç 4/8/2017 tarihi itibarıyla bir bilim grubunda faaliyet göstermek üzere kurum açma izinleri düzenlenmeyen özel öğretim kursları hakkında sürekli kapatma işlemi uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin uygulanmasına ilişkin hususlar ile bilim grubu tanımı Millî Eğitim Bakanlığınca çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu maddeyi ihdas eden Kanunla değiştirilen 6 ncı maddenin altıncı fıkrası uyarınca Bakanlıkça belirlenen programları bu maddenin yürürlüğe girdiği tarihe kadar başarıyla tamamlayarak kurs bitirme belgesi alanların kazanılmış hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
