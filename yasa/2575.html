    <mvz-madde no="62" başlık="Tetkik Hakimlerinin görevleri">
      <mvz-fıkra no="1">
        <template>Tetkik hakimleri Danıştay Başkanının, daire ve kurul başkanlarının kendilerine havale ettikleri işleri inceleyerek daire veya görevli kurula gerekli açıklamaları yaparlar. Kendi düşünce ve görüşlerini sözlü ve yazılı olarak bildirirler, karar taslaklarını yazarlar, gerekli tutanakları düzenler ve Danıştay Başkanı, kurul başkanı ve daire başkanının verecekleri diğer görevleri yerine getirirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Her daire ve kurulda, o daire veya kurul başkanınca birinci sınıfa ayrılmış bir tetkik hakimi, memurların görevlerine devamlarını, yetişmelerini ve verimli bir biçimde çalışmalarını, idare, dosya ve diğer yazı işleri ile tebligat işlerinin gecikmeden ve düzenli olarak yürütülmesini, Danıştay Başkanının, daire ve kurul başkanının vereceği diğer işleri yapmakla görevlendirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="63" başlık="Görevlerin uygulanma şekli">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensuplarının ve tetkik hakimleri ile savcıların yukarıdaki maddelerde yazılı görevlerinin uygulanmasına idari daire ve kurulların çalışma usullerinin düzenlenmesine ve 7 nci maddede yazılı müdürlükler, bürolar ve kalemlerin görevlerinin ifasına ve işlerin belirli sürelerde sonuçlandırılmasına ilişkin hükümler Danıştay İçtüzüğünde gösterilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="64" başlık="Başkan, Başsavcı ve üyelerin aylıkları ve ödenekleri ile diğer mali hakları">
      <mvz-fıkra no="1">
        <template>Danıştay Başkanı, Danıştay Başsavcısı, Başkanvekilleri, daire başkanları ve üyelerine aylık, ödenek, mali, sosyal ve diğer özlük hakları bakımından sırasıyla Yargıtay Birinci Başkanı, Cumhuriyet Başsavcısı, birinci başkanvekilleri, daire başkanları ve üyeleri hakkındaki kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay Başkanı, Danıştay Başsavcısı, Başkanvekilleri, daire başkanları ve üyeleri ile bunların emeklileri ve bakmakla yükümlü oldukları aile fertlerinin sağlık giderleri, Türkiye Büyük Millet Meclisi üyelerinin tabi oldukları hükümler ve esaslar çerçevesinde Danıştay bütçesinden ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="65" başlık="Yurt dışına gönderilme">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensupları, idare ve vergi hukuku alanında bilimsel araştırmalar yapmak ve mesleki incelemelerde bulunmak amacıyla aylık ve ödenekleri, hakiki yol masrafları ve gündelikleri verilmek ve bir yılı geçmemek şartıyla idari yargı sisteminin uygulandığı yabancı memleketlere Başkanlık Kurulunun kararı ile gönderilebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yurt dışına gönderilecek Danıştay Başkanı, Başsavcısı, başkanvekilleri, daire başkanları ve üyelerin seçimleri ile diğer esaslar hazırlanacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="66" başlık="Başka iş ve görev kabul etme">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensupları, ilmi araştırma ve yayınlarda bulunabilirler; Danıştay Başkanının izni ile kurumlarından yolluk almaksızın davet edildikleri yurt içi ve yurt dışı kongre, konferans, seminer ve benzeri bilimsel toplantılarla, bilim ve meslekleri ile ilgili diğer toplantılara katılabilirler. Onbeş güne kadar olan izinler Danıştay Başkanınca, onbeş günü aşan izinler Başkanlık Kurulunca verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay meslek mensupları birinci fıkradaki hallerde Başkanlık Kurulu kararıyla görevli olarak gönderilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yukarıdaki fıkrada yazılı olan Danıştay meslek mensupları esas görevleri yanında Başkanlık Kurulunun kararıyla yükseköğretim kurumlarında ders ve konferans verebilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="6-ALTINCI" başlık="Disiplin Kovuşturması">
    <mvz-madde no="67" başlık="Disiplin kovuşturması">
      <mvz-fıkra no="1">
        <template>Danıştay Başkanı, Başsavcısı, başkanvekilleri, daire başkanları ve üyelerin, yüksek hakimlik vakar ve şerefi ile bağdaşmayan veya hizmetin aksamasına yol açan hal ve hareketleri görülür veya öğrenilirse haklarında bu Kanun hükümleri uyarınca disiplin kovuşturması yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="68" başlık="Konunun yüksek disiplin kuruluna intikal ettirilmesi">
      <mvz-fıkra no="1">
        <template>Danıştay Başkanı, Başsavcı, başkanvekilleri, daire başkanları ve üyelerin yukarıdaki maddede yazılı hal ve hareketlerinin görülmesi veya öğrenilmesi halinde konunun Yüksek Disiplin Kuruluna intikal ettirilmesi Başkanlık Kurulu tarafından duruma göre takdir edilir ve karara bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="69" başlık="Disiplin kovuşturması kararı">
      <mvz-fıkra no="1">
        <template>Yüksek Disiplin Kurulu, eldeki bilgi ve delillere ve isnat olunan hal ve hareketin niteliğine göre disiplin kovuşturması yapılmasına yer olup olmadığına karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurul, disiplin kovuşturmasına karar verirse, Kurul dışındaki daire başkanları ve üyeler arasından seçeceği üç kişiyi soruşturma yapmakla görevlendirir. Haklarında isnatta bulunulanlar, Yüksek Disiplin Kurulu üyesi ise, Kurulun bu husustaki toplantılarına katılamazlar. Bunların yerleri 20 nci maddedeki usule göre doldurulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="70" başlık="Soruşturmanın şekli">
      <mvz-fıkra no="1">
        <template>Soruşturma yapmakla görevlendirilenler, ilgiliye isnat olunan hal ve hareketi bildirerek savunmasını alırlar, lüzum gördükleri kimseleri yeminle dinler, konu ile ilgili bilgileri toplar ve sübut delillerini tespit ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bütün daire, kurum ve kuruluşlar ile gerçek ve tüzelkişiler, sorulan hususlara cevap vermek ve diğer istekleri yerine getirmek zorundadırlar. Ancak 49 uncu madde hükmü saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="71" başlık="Rapor verilmesi">
      <mvz-fıkra no="1">
        <template>Soruşturmayı yapanlar yaptıkları soruşturmaları ve elde ettikleri bilgi ve delilleri gösteren ve bunlara göre disiplin cezası verilmesine yer olup olmadığı hakkındaki kanaatlerini belirten bir rapor hazırlarlar ve belgeleri bu rapora bağlarlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="72" başlık="Rapor üzerine yapılacak işlem">
      <mvz-fıkra no="1">
        <template>Yukarıdaki madde gereğince hazırlanan rapor, Yüksek Disiplin Kuruluna verilir. Bu Kurula, soruşturmayı yapmış olanlar katılamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurul Başkanı, soruşturma sonucunu ilgiliye yazılı olarak bildirir ve beş günden az olmamak üzere tayin edeceği süre içinde yazılı savunmasını vermeye davet eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurul Başkanı, soruşturma dosyasını üyelerin birine havale eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurul, işi evrak üzerinde inceler ve gerekirse soruşturmanın genişletilmesine veya derinleştirilmesine karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İlgili, bu dosyayı raportör üyenin huzurunda inceleyebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="73" başlık="Disiplin cezaları">
      <mvz-fıkra no="1">
        <template>Yüksek Disiplin Kurulu isnat olunan hal ve hareketi sabit görmezse dosyanın işlemden kaldırılmasına karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurul, bu hal ve hareketleri sabit gördüğü takdirde bunların mahiyetine ve ağırlığına göre, ilgilinin uyarılmasını veya hizmet süresine göre istifa etmeye veya emekliliğini istemeye davet edilmesini karar altına alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurul kararı Danıştay Başkanı hakkında ise, vekili, diğerleri hakkında ise Danıştay Başkanı tarafından ilgiliye tebliğ edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="74" başlık="Kararların yerine getirilmesi">
      <mvz-fıkra no="1">
        <template>İlgili, emekliliğini istemeye veya istifa etmeye dair olan karara, tebliğ tarihinden itibaren bir ay içinde uymazsa istifa etmiş sayılır. Bir aylık süre içinde ilgili izinli sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="75" başlık="Disiplin kararı aleyhine dava açılması">
      <mvz-fıkra no="1">
        <template>İlgili, Yüksek Disiplin Kurulu kararının kendisine tebliğ tarihinden itibaren onbeş gün içinde bu karara karşı dava açabilir. Bu davalar, savunmaların alındığı veya cevap sürelerinin geçtiği tarihten itibaren üç ay içinde karara bağlanır. Çalışmaya ara verme süresi hesaba katılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dava sonuçlanıncaya kadar ilgililerden boşalan yerler doldurulmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yüksek Disiplin Kurulunda karar vermiş veya soruşturmayı yapmış olanlar, disiplin cezalarına ilişkin davaların görüşülmesine katılamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="7-YEDİNCİ" başlık="Ceza Kovuşturması">
    <mvz-madde no="76" başlık="Soruşturma">
      <mvz-fıkra no="1">
        <template>Danıştay Başkanı, Başsavcı, başkanvekilleri, daire başkanları ve üyelerin görevlerinden doğan veya görevleri sırasında işlemiş bulundukları suçlardan dolayı, Danıştay Başkanının seçeceği bir daire başkanı ile iki üyeden oluşan bir kurul tarafından ilk soruşturma yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay Başkanı hakkında soruşturma, kendisinin katılmayacağı Başkanlık Kurulunca seçilecek bir daire başkanı ile iki üyeden oluşan bir kurul tarafından yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurul, soruşturma sonunda düzenleyeceği fezlekeyi ve buna ilişkin evrakı Danıştay Başkanına, soruşturma Danıştay Başkanı hakkında ise fezlekeyi ve evrakı başkanvekiline verir. Bu husustaki dosya Danıştay Başkanı veya vekili tarafından gerekli karar verilmek üzere İdari İşler Kurulu Başkanlığına tevdi edilir. Bu Kurulun vereceği kararlar sanığa ve varsa şikayetçiye tebliğ olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yargılamanın men'i kararı kendiliğinden ve son soruşturmanın açılmasına dair kararlar itiraz üzerine İdari İşler Kurulu Başkan ve üyelerinin katılmayacağı Danıştay Genel Kurulunda incelenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Danıştay Genel Kurulunun bu toplantılarında yeter sayı en az otuzbirdir. Toplantıda hazır bulunanlar çift sayıda ise en kıdemsiz üye toplantıya katılmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="77" başlık="İtiraz süresi">
      <mvz-fıkra no="1">
        <template>76 ncı madde hükümlerine göre birinci derecede verilen kararlara itiraz süresi bu kararın sanığa veya şikayetçiye tebliğ tarihinden itibaren on gündür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="78" başlık="Görevli kurullarda inceleme">
      <mvz-fıkra no="1">
        <template>Yukarıdaki maddelerde yazılı kurullarda inceleme evrak üzerinde yapılır. Sanıklar, soruşturma dosyalarını son soruşturmanın açılmasına dair kararın tebliği üzerine, kararı veren kurulun tetkik hakiminin gözetimi altında inceleyebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kararlar, kurulun tetkik hakimi tarafından Tebligat Kanunu hükümlerine göre ilgililere tebliğ edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="79" başlık="Soruşturma dosyasının yargı yerlerine gönderilmesi">
      <mvz-fıkra no="1">
        <template>76 ncı madde gereğince verilen son soruşturmanın açılmasına dair kararlar üst kurulca onanmak veya itiraz olunmamak suretiyle kesinleştikten sonra, soruşturma dosyası, gereği yapılmak üzere Danıştay Başkanı veya vekili tarafından Cumhuriyet Başsavcısına gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="80" başlık="Karara katılamayacak olanlar">
      <mvz-fıkra no="1">
        <template>Soruşturma yapanlar, soruşturmalar üzerine karar verecek olan kurulların toplantılarına katılamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="81" başlık="Ceza Muhakemeleri Usulü Kanununun uygulanacağı haller">
      <mvz-fıkra no="1">
        <template>Yukardaki maddeler hükümlerine göre yapılacak soruşturmalar ile verilecek kararlarda, bu Kanunda hüküm bulunmayan hallerde, Ceza Muhakemeleri Usulü Kanununun soruşturmaya ilişkin hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Soruşturma kurulları sorgu hakiminin yetkilerini haizdir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="82" başlık="Şahsi suçların kovuşturma usulü">
      <mvz-fıkra no="1">
        <template>Danıştay Başkanı, Başsavcı, başkanvekilleri, daire başkanları ve üyelerin şahsi suçlarının takibinde Yargıtay Başkanı, Cumhuriyet Başsavcısı ve üyelerinin şahsi suçlarının takibi ile ilgili hükümler uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>1402 sayılı Sıkıyönetim Kanunu gereğince, Danıştay Başkanı, başkanvekilleri, Danıştay Başsavcısı ve daire başkanları ile üyeler hakkında kovuşturma yapılması Başkanlık Kurulunun iznine tabidir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="8-SEKİZİNCİ" başlık="Görevin Sona Ermesi">
    <mvz-madde no="83" başlık="Hüküm giyme hali">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensuplarından birinin ağır hapis, kasıtlı bir suçtan dolayı altı ay veya daha fazla hapis cezası ile kesin olarak hüküm giymesi halinde, görevi kendiliğinden sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kasıtlı bir suçtan dolayı altı aydan aşağı hapis cezası ile hüküm giyme halinde bu suç, mesleğin vakar ve şerefini bozan veya mesleğe karşı genel saygı ve güveni gideren nitelikte görülürse, ilgilinin meslekten çıkarılması gerekip gerekmediğine Yüksek Disiplin Kurulu tarafından karar verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="84" başlık="Sağlık bakımından görevin yerine getirilememesi">
      <mvz-fıkra no="1">
        <template>Görevini sağlık bakımından yerine getiremeyeceği tam teşekküllü resmî sağlık kurulu raporuyla kesin olarak anlaşılan Danıştay meslek mensuplarının görevine son verilmesine Başkanlar Kurulunca karar verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="85" başlık="Dava hakkı">
      <mvz-fıkra no="1">
        <template>83 üncü maddenin ikinci fıkrası ile 84 üncü maddeye göre görevlerine son verilen ilgililerin bu kararlara karşı açacakları davalarda 75 inci madde hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="9-DOKUZUNCU" başlık="Çeşitli Hükümler">
    <mvz-madde no="86" başlık="Çalışmaya ara verme">
      <mvz-fıkra no="1">
        <template>Danıştay daireleri her yıl bir eylülde başlamak üzere, yirmi temmuzdan otuz bir ağustosa kadar çalışmaya ara verirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ara verme süresi içinde çalışmak üzere; bir daire başkanı ile dört üyeden ve bir yedek üyeden oluşan bir nöbetçi daire kurulur. Yedek üye aynı zamanda Genel Sekreterlik görevini yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu dairenin başkanı ile üyeleri, Danıştay dairelerinin başkan ve üyeleri arasından karma olarak Başkanlar Kurulu tarafından seçilir. Ayrıca lüzumu kadar savcı ve tetkik hâkimi görevlerine devam ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Çalışmaya ara verme süresi içinde görevli olarak kalanlar hariç olmak üzere Danıştay Başkanı, Başsavcı, başkanvekilleri, daire başkanları ve üyeler ile savcılar ve tetkik hakimleri çalışmaya ara verirler. Bu süre içinde Danıştay Başkanına, nöbetçi daire başkanı vekalet eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Danıştay'da çalışan diğer memurlar çalışmaya devam ederler. Ancak, çalışmaya ara verme süresi içinde işin icaplarına göre görevde kalmaları lüzumlu görülmeyen memurlar kanuni izinlerini kullanırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Çalışmaya ara verme süresi içinde görevleri başında kalan Danıştay üyeleri yılın diğer dönemlerinde yol süresi dâhil çalışmaya ara verme süresi kadar izin kullanabilirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="87" başlık="Nöbetçi dairenin göreceği işler">
      <mvz-fıkra no="1">
        <template>Nöbetçi daire, çalışmaya ara verme süresi içinde aşağıda yazılı işleri görür:</template>
        <mvz-bent no="a">
          <template>kanunen belli süre içinde karara bağlanması gereken işler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Yürütmenin durdurulmasına veya delillerin tespitine ait işler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Tutuklu memurlar hakkında Memurin Muhakematı Hakkında Kanunu Muvakkatı hükümlerine göre Danıştaya gelen işler.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="88" başlık="Tasnif ve yayın bürosu">
      <mvz-fıkra no="1">
        <template>Danıştay daireleri ve kurulları tarafından verilen kararların ve mevzuatın tertip ve tasnifini yapmak, kitaplığın düzenlenmesini sağlamak, Danıştay Dergisinin yayımlanması işini yürütmek ve kamu hukuku ile ilgili bilimsel yayınları takip etmek üzere, bir büro kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu büronun kuruluş ve görevleri bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="89" başlık="Gizli bilgileri açıklama">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensupları ile Danıştay tetkik hakimleri ve savcıları kamu hizmetleriyle ilgili gizli bilgileri, görevlerinden ayrılmış olsalar bile açıklayamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="90" başlık="İsnat ve iftiralara karşı korunma">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensupları hakkında ihbar ve şikayetlerin inceleme, soruşturma veya yargılama sonunda sabit olmadığı ve bir isnadın gareze binaen veya hakaret kasdıyla yapıldığı veya uydurma bir isnat mahiyetinde olduğu anlaşıldığı takdirde, Danıştay Başkanı isnatta bulunanlar hakkında kamu davası açılmasını Cumhuriyet Savcılığından ister.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="91" başlık="Çalışma saatleri ve izinler">
      <mvz-fıkra no="1">
        <template>Danıştayda haftalık çalışma süresi ve Danıştay meslek mensuplarının mazeret, hastalık ve aylıksız izinleri yönünden Devlet Memurları Kanunu hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="92" başlık="Dosyaların ve diğer evrakın saklanması">
      <mvz-fıkra no="1">
        <template>Dava dosyalarıyla diğer evrakın Danıştayda saklanma süreleri, yok edilme usulleri ve Danıştay Arşivine ilişkin diğer hususlar çıkarılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="93" başlık="Bütçe">
      <mvz-fıkra no="1">
        <template>Danıştay genel bütçe içinde kendi bütçesiyle yönetilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bütçenin ita amiri Danıştay Başkanıdır. Muhasebe işleri Danıştay nezdinde kurulacak muhasebe teşkilatı tarafından yürütülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yasama meclislerindeki bütçe görüşmelerinde Danıştayı Başkan veya görevlendireceği kimse temsil eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="94" başlık="Kıyafet">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensupları ile Danıştay tetkik hakimleri ve Danıştay savcılarının resmi kıyafetlerinin şekli ve bunların giyilme zaman ve yerleri bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="95" başlık="Basına bilgi verme">
      <mvz-fıkra no="1">
        <template>Basına, haber ajanslarına, radyo ve televizyona Danıştayla ilgili bilgi ve demeçler, Danıştay Başkanı veya yetkili kılacağı bir görevli tarafından verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="95/A" başlık="Bilgi İşlem Merkezi Müdürlüğü ve görevleri">
      <mvz-fıkra no="1">
        <template>Bilgi İşlem Merkezi, Danıştay Başkanlığına bağlı olarak görev yapar ve bir müdür yönetiminde yeteri kadar şef, mühendis, programcı, çözümleyici, bilgisayar işletmeni, veri hazırlama ve kontrol işletmeni ile teknisyenden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bilgi İşlem Merkezi Müdürlüğünün görevleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Danıştay Başkanlığında bilgi işlem sistemini ilk derece ve bölge idare mahkemeleri bilişim sistemiyle koordineli olarak kurmak, işletmek, bakım ve onarımlarını yapmak veya yaptırmak, bilgi işlem sistemleri ile ilgili teknolojileri ve gelişmeleri takip ederek ihtiyaçlara göre gerekli güncellemeleri yapmak, Danıştay Başkanlığının ihtiyaçlarına göre projeler üreterek yazılım geliştirmek ve güncellemek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Gerektiğinde, diğer kamu kurum ve kuruluşlarının geliştirmiş olduğu yazılımlarla uyumu sağlamak, uluslararası kapsamda, sistemler arası çevrim içi ve çevrim dışı veri akışını ve koordinasyonu sağlamak, bilişim teknolojileri ile ilgili ulusal ve uluslararası faaliyetlerde Danıştay Başkanlığınca verilen görevleri yerine getirmek.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Danıştayın faaliyet alanına ilişkin olarak hazırlanan karar, mevzuat, genelge, görüş, metin ve belgelerin, Türkiye’nin üyesi olduğu ve yargı yetkisi tanınan uluslararası mahkeme kararlarının, kullanıcıların hizmetine sunulması için gerekli desteği sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Danıştay Başkanlığı bilgi sistemlerinde güvenlik politikalarının usul ve esaslarının belirlenmesi, uygulanması ve güncellenerek denetlenmesini sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Bilgisayar ve bilgi sistemlerinin kullanılmasında Danıştay Başkanlığınca çıkartılacak esasları hazırlamak, Danıştayın tüm birimlerinde görev yapan bilgisayar kullanıcılarının talepleri de dikkate alınarak gerekli eğitimlerini sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Danıştay Başkanlığı tarafından verilen benzeri görevleri yapmak.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="10-ONUNCU" başlık="Son Hükümler">
    <mvz-madde no="96" başlık="Kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>521 sayılı Danıştay Kanunu ile bunun ek ve tadilleri yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>İki dava dairesinin görevine ilişkin davalar, ilgili dava dairesinin isteği üzerine o dava dairelerinin birlikte yapacakları toplantıda karara bağlanır. Bu toplantıya daire başkanlarından kıdemlisi başkanlık eder. Toplanma ve görüşme yeter sayısı dokuzdur. Kararlar oy çokluğuyla verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu davalar, davanın açıldığı dairenin esas ve karar numaralarını alır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Ekli (2) sayılı listede yer alan kadrolar ihdas edilerek 13/12/1983 tarihli ve 190 sayılı Genel Kadro ve Usulü Hakkında Kanun Hükmünde Kararnamenin eki (II) sayılı cetvelin Danıştay Başkanlığına ait bölümüne eklenmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensupları ile savcı, tetkik hâkimi ve iç denetçi kadroları bu Kanuna ekli (I) sayılı Kadro Cetvelinde düzenlenmiştir. Geçici 27 nci madde hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte Danıştayda görevli ve 657 sayılı Devlet Memurları Kanununa tabi memurlardan ihtiyaç fazlası olanlar, bölge idare mahkemeleri, idare mahkemeleri ve vergi mahkemelerinde görevlendirilmek üzere Adalet Bakanlığı emrine verilirler. Bunlara ait kadrolar Adalet Bakanlığı taşra teşkilatı mahkemeler bölümüne eklenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte Danıştayda görevli bulunan başkatiplerin unvanı "yazı işleri müdürü" olarak değiştirilmiştir. Bu değişiklik sebebi ile yeniden atanmaları gerekmez. Yeni unvanları, yan ödeme kararnamesinde yer alıncaya kadar eski unvanları üzerinden yan ödeme almaya devam ederler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yürürlükten kaldırılan 521 sayılı Danıştay Kanunu ile ek ve değişikliklerine göre çıkarılmış bulunan tüzük ve yönetmeliklerin bu Kanuna aykırı olmayan hükümleri çıkarılacak tüzük, içtüzük ve yönetmelikler yürürlüğe girinceye kadar uygulanmaya devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesinden önce başlayan müracaat ve dava süreleri hakkında 521 sayılı Danıştay Kanununun ilgili hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce Danıştaya açılmış bulunan davalar Danıştay'da bakılarak sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Daha önce Danıştayın görev alanında olup Bölge İdare Mahkemeleri, İdare Mahkemeleri ve Vergi Mahkemelerinin Kuruluşu ve Görevleri Hakkında Kanun ile bu mahkemelerin görevine giren konularla ilgili davalar, bu mahkemeler göreve başlayıncaya kadar Danıştayda açılmaya devam olunur. Bu davalar Danıştayca sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte Birinci Mürettep Daire, Yedinci Daire ve Onuncu Dairede mevcut bulunan memur hukuku ile ilgili dosyalar Üçüncü Daireye devredilir ve bu Dairece sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Yürürlükten kaldırılan 521 sayılı Danıştay Kanunu ile ek ve değişiklikleri gereğince kurulmuş bulunan daire ve kurullarda mevcut işlerin bu Kanuna göre görevlendirilen daire ve kurullara dağıtımı, ayrıca karar verilmesine yer kalmaksızın, daire kurullarının oluşmasından itibaren onbeş gün içinde tamamlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İdari İşler, Başkanlık Kurulu, Yüksek Disiplin ve Disiplin Kurullarının seçimleri daire kurullarının oluşmasından itibaren onbeş gün içinde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Çeşitli kanunlarda Danıştay Genel Kurulunda görüşülerek karara bağlanacağı yazılı işler, bu Kanunun yürürlüğe girdiği tarihten sonra Danıştay İdari İşler Kurulunca görüşülerek karara bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Hakimler Kanununda idari yargı hakim ve savcıları ile ilgili düzenlemeler yapılıncaya kadar bu Kanunda sözü geçen birinci sınıfa ayrılmış idari yargı hakim ve savcıları ibaresi birinci derece kadroyu almış idari yargı hakim ve savcıları anlamına gelir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Anayasa Mahkemesi ve Sayıştay kanunlarında gerekli düzenlemeler yapılıncaya kadar 1903 sayılı Kanunun geçici 1 ve 2 nci maddelerine göre yargı ödeneğinin verilmesine devam olunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte, Danıştay Başkanı, Başsavcısı ve daire başkanlarının başkanlık sıfatları sona erer. Ancak; geçici 14 ncü madde gereğince atamalar yapılıncaya kadar başkanlık görevleri devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren otuz gün içinde, Danıştayda mevcut boş üyelik kadroları bir defaya mahsus olmak üzere, bu Kanunun 8 nci maddesinde belirtilen niteliklere sahip olanlar arasından, en az dörtte üçü idari yargı hakim ve savcılarından olmak üzere Hakimler ve Savcılar Yüksek Kurulunun boş üyelikler için göstereceği iki kat aday arasından Cumhurbaşkanı tarafından seçim yapılmak suretiyle doldurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkradaki seçimi izleyen onbeş gün içinde Danıştay Başkanı, Başsavcısı, başkanvekilleri ve daire başkanları Hakimler ve Savcılar Yüksek Kurulunun Danıştay üyelerinden göstereceği ikişer aday arasından bir defaya mahsus olmak üzere Cumhurbaşkanınca seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Danıştay üyelerinin dairelere dağılımı, ikinci fıkradaki süre içinde Hakimler ve Savcılar Yüksek Kurulunun önerisi üzerine bir defaya mahsus olarak Cumhurbaşkanınca yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Cumhurbaşkanı, Hakimler ve Savcılar Yüksek Kurulunun önerisi üzerine, kuruluş halinde bulunan bölge idare mahkemeleri başkanlıklarına bir defaya mahsus olmak üzere Danıştay üyeleri arasından atama yapabilir. Bu suretle bölge idare mahkemeleri başkanlıklarına atananlar, bu görevlerde dört yıl süre ile hizmet görürler. Bu süre, ilgilinin isteği üzerine uzatılabilir. Bu fıkraya göre atananlar, Danıştay üyeliği sıfatını, kadrosunu, aylık ve ödeneği ile her türlü özlük haklarını muhafaza ederler. Bunların aylık ve ödenekleri ile diğer her türlü mali ve sosyal haklarının Danıştay bütçesinden ödenmesine devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yukarıdaki fıkraya göre bölge idare mahkemeleri başkanlıklarına atananların, her ne suretle olursa olsun bu görevlerinden ayrıldıkları tarihte Danıştay kadro cetvelindeki kadroları iptal edilmiş sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Vergiler Temyiz Komisyonu Başkanlığı, daire başkanlığı veya üyeliği yapmış olanların 521 sayılı Danıştay Kanununun 1740 sayılı Kanunla değiştirilen 8 nci maddesiyle tanınan Danıştay üyeliğine seçilme hakları saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren beş yıl süre ile, Danıştay tetkik hakimliğine ve Danıştay savcılığına yapılacak atamalarda, Kanunun 11 nci maddesinin birinci fıkrasındaki beş yıllık hizmet süresi aranmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında, 27/10/1980 tarih ve 2324 sayılı Anayasa Düzeni Hakkında Kanun hükümleri saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>İdari İşler Kurulunda bulunan tüzük tasarılarıyla ilgili dosyalar, Danıştay Başkanlığınca derhal Başbakanlığa gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren üç yıl süre ile Danıştay tetkik hakimliğine yapılacak atamalarda, 11 inci maddenin (1) numaralı fıkrasındaki beş yıllık hizmet süresi iki yıl olarak uygulanır. Bu atamalarda Başkanlık Kurulunun olumlu görüşü alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunla yapılan değişiklikler nedeniyle Danıştay İkinci Dairesinde bulunan dosyalar Birinci Daireye, Onuncu Dairenin görev alanından çıkarılan dava ve işlere ilişkin dosyalar Onüçüncü Daireye, ayrıca bir karar verilmesine gerek olmaksızın devredilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren dört yıl süre ile Danıştay tetkik hakimliğine yapılacak atamalarda, 2575 sayılı Kanunun 11 inci maddesinin (1) numaralı fıkrasındaki beş yıllık hizmet süresi aranmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce ilk derece mahkemesi olarak Danıştayda açılmış bulunan ve bu Kanunla idare mahkemeleri görevleri kapsamına alınan davalar Danıştayda sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten itibaren on yıl süre ile Danıştay tetkik hâkimliğine yapılacak atamalarda, 11 inci maddenin birinci fıkrasındaki beş yıllık hizmet süresi aranmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>31/12/2026 tarihine kadar Danıştay İdari Dava Daireleri Kurulunun oluşumu ve çalışma usulü hakkında aşağıdaki hükümler uygulanır.</template>
        <mvz-bent no="a">
          <template>İdari Dava Daireleri Kurulu, her idari dava dairesinden en az bir üye olmak kaydıyla Başkanlık Kurulu tarafından görevlendirilen on dört üyeden oluşur. Kurula, Danıştay Başkanı veya vekillerinden biri, bunların bulunmaması halinde Kurulun en kıdemli üyesi başkanlık eder.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu üyeler İdari Dava Daireleri Kurulunda sürekli olarak görev yaparlar. Ancak, iş durumu göz önüne alınmak suretiyle üyelerin daire çalışmalarına katılmalarına Genel Kurul tarafından karar verilebilir.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Toplantı ve görüşme yeter sayısı on birdir. Kararlar, toplantıya katılanların oy çokluğu ile alınır.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yayımı tarihinden önce ilk derece mahkemesi sıfatıyla Danıştayda açılmış bulunan ve bu Kanunla idare ve vergi mahkemelerinin görevleri kapsamına alınan davaların, Danıştayda görülmesine devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Düşünce alınmak üzere Danıştay Başsavcılığına gönderilmekle birlikte, bu Kanunun yayımı tarihinden önce görüş bildirilmemiş yürütmenin durdurulması istemli dosyalar ile temyiz ve karar düzeltme dosyaları, herhangi bir görüş bildirilmeksizin, ilgili daire veya kurullara geri gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten itibaren on beş gün içinde bu Kanuna göre oluşturulan Danıştay üyeliği kadroları için seçim yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Seçimin tamamlanmasından itibaren beş gün içinde bu Kanunla ihdas edilen daire başkanlığı kadroları için seçim yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Başkanlık Kurulu, iş durumunu dikkate alarak daireler arasındaki iş bölümünü yeniden belirler ve buna ilişkin karar derhâl Resmî Gazete’de yayımlanır. Bu karar, yayım tarihinden itibaren on gün sonra uygulanmaya başlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Başkanlık Kurulu, iş bölümüne ilişkin kararın Resmî Gazete’de yayımlanmasından itibaren on gün içinde, kurulların ve dairelerin iş durumunu ve ihtiyaçlarını göz önünde bulundurarak Danıştay daire başkanları, kurullarda ve dairelerde görev yapan Danıştay üyeleri ve tetkik hâkimlerinin hangi kurul ve dairelerde görev yapacağını yeniden belirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Başkanlık Kurulunun iş bölümünün belirlenmesine ilişkin kararı uygulanmaya başlayıncaya kadar bu Kanunla yapılan değişiklikten önceki iş bölümüne ilişkin hükümler uygulanmaya devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yeni iş bölümüyle dairesi değiştirilen dava dosyaları, iş bölümüne ilişkin kararın Resmî Gazete’de yayımlanmasından itibaren on gün içinde ayrıca bir karar verilmesine yer olmaksızın listeye bağlanmak suretiyle mevcut hâlleriyle ilgili daireye devredilir. İş bölümü kararı sonrası Danıştaya gelecek olanlar  ile kanun yollarına konu edilerek bozulan dava dosyaları iş bölümü kararıyla görevleri belirlenen dairelerce sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte Danıştay üyelerinin üyelikleri sona erer. Ancak vekalet edenler hariç olmak üzere bu tarih itibarıyla Danıştay Başkanı, Başsavcısı, başkanvekili ve daire başkanı olarak görev yapanların Danıştay üyelikleri devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra uyarınca üyelikleri sona erenlerden;</template>
        <mvz-bent no="a">
          <template>Hâkimler ve Savcılar Yüksek Kurulu tarafından seçilenler arasından Hâkimler ve Savcılar Yüksek Kurulunca,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Cumhurbaşkanı tarafından seçilenler arasından Cumhurbaşkanınca,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>bu Kanunun yürürlüğe girdiği tarihten itibaren beş gün içinde, bu maddenin üçüncü fıkrasındaki kadro sayısı dikkate alınmak suretiyle Danıştay üyesi seçimi yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla Danıştay meslek mensuplarının kadro sayısı yüz on altıdır. Birinci fıkranın ikinci cümlesi uyarınca üyelikleri devam edenler, kadro sayısında dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla üçüncü fıkrada belirtilen kadro sayısını aşan üye kadroları herhangi bir işleme gerek kalmaksızın iptal edilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>İkinci fıkranın (a) bendi hükmü kapsamında olup Danıştay üyeliğine seçilmeyenler, Hâkimler ve Savcılar Yüksek Kurulu ilgili dairesi tarafından, bu Kanunun yürürlüğe girdiği tarihten itibaren on gün içinde idari yargıda sınıf ve derecelerine uygun bir göreve atanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İkinci fıkranın (b) bendi hükmü kapsamında olup Danıştay üyeliğine seçilmeyenlerden, ikinci fıkra uyarınca yapılan seçim tarihinden itibaren beş gün içinde idari yargıda bir göreve atanmak için talepte bulunanlar, Hâkimler ve Savcılar Yüksek Kurulu ilgili dairesi tarafından takip eden beş gün içinde idari yargıda sınıf ve derecelerine uygun bir göreve atanır. Talepte bulunmayanlar ise başka bir göreve atanmak üzere Başbakanlığa bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Altıncı fıkranın son cümlesi uyarınca atananlar, Danıştay üyelerine sağlanan her türlü aylık, ödenek, zam ve tazminatlar ile diğer mali ve sosyal hakları almaya devam ederler. Üyelikleri sona erenlerin, seçim veya atamaları yapılıncaya kadar, özlük hakları Danıştay tarafından karşılanmaya devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Yeniden seçilenler, Hâkimler ve Savcılar Yüksek Kurulu üyeliğinin sona ermesinden itibaren on iki yıl görev yaparlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Birinci fıkranın ikinci cümlesi uyarınca üyelikleri devam eden üyeler ile ikinci fıkra uyarınca seçilen üyeler, bu Kanunun yürürlüğe girdiği tarihten itibaren on iki yıl görev yaparlar. Bu üyelerin atama veya seçim nedeniyle yürüttükleri görevleri, bu görevlerinin süresi bitene kadar devam eder. Ancak, İdari Dava Daireleri Kurulunda görevi devam eden üye sayısının on dörtten fazla olması hâlinde, üyelerden hangilerinin görevlerine devam edeceği Başkanlık Kurulunca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Seçilmeyen üyelerin atama veya seçim nedeniyle yürüttükleri görevler de bu Kanunun yürürlüğe girdiği tarih itibarıyla sona erer. Bu görevler için ikinci fıkra uyarınca yapılan seçimlerin tamamlanmasından itibaren on gün içinde atama veya seçim yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Birinci fıkranın ikinci cümlesi uyarınca üyelikleri devam eden üyeler ile ikinci fıkra uyarınca seçilen üyelerin daha önce Danıştay üyesi olarak çalıştıkları süreler üyelik kıdeminde dikkate alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Başkanlık Kurulu, ikinci fıkra uyarınca yapılan seçimlerin tamamlanmasından itibaren on gün içinde, dairelerin iş durumunu ve ihtiyaçlarını dikkate alarak Danıştay üyelerinin hangi dairelerde görev yapacağını yeniden belirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Başkanlık Kurulu, iş durumunu ve ihtiyaçları dikkate alarak bu Kanunun yürürlüğe girdiği tarihten itibaren en geç on yıl içinde daire sayısını 13 üncü maddede öngörülen daire sayısına indirir. Ancak bu daireler, Başkanlık Kurulunca kapatılıncaya kadar görevlerine devam ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="14">
        <template>Başkanlık Kurulu, on üçüncü fıkra uyarınca yapılan her daire kapatma işleminden sonra iş durumunu ve ihtiyaçları dikkate alarak daireler arasındaki iş bölümünü yeniden belirler. Buna ilişkin karar derhâl Resmî Gazete’de yayımlanır ve yayımı tarihinden itibaren on gün sonra uygulanmaya başlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="15">
        <template>Başkanlık Kurulu, iş bölümüne ilişkin kararın Resmî Gazete’de yayımlanmasından itibaren on gün içinde, dairelerin iş durumunu ve ihtiyaçlarını dikkate alarak kapatılan dairelerde görev yapan daire başkanı, üye ve tetkik hâkimlerinin hangi dairelerde görev yapacağını belirler. Dairelerde görev verilmeyen daire başkanları, başkanlık süresinin bitimine kadar Danıştay Başkanlığı nezdinde görev yapar. Başkanlık görev süresi Danıştay Başkanlığı nezdinde sona erenlerin veya başka bir daireye başkan olarak görevlendirilenlerin daire başkanlığı kadroları, başka bir işleme gerek kalmaksızın üye kadrosuna dönüşür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="16">
        <template>İş bölümüne ilişkin kararın Resmî Gazete’de yayımlanmasından itibaren on gün içinde, dava dosyaları ayrıca bir karar verilmesine yer olmaksızın listeye bağlanmak suretiyle mevcut hâlleriyle ilgili daireye devredilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="17">
        <template>Danıştay meslek mensupları kadro sayısı doksana düşünceye kadar, boşalan her iki üyelik için bir üye seçimi yapılır. Seçim yapılmayan üye kadroları başka bir işleme gerek kalmaksızın iptal edilmiş sayılır. Kadro sayısı doksana düşünceye kadar 9 uncu maddeye göre yapılacak duyuru, sekizinci üyeliğin boşaldığı tarihten itibaren en geç üç gün içinde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihte yeni ihdas edilen onaltı Danıştay üyeliği kadrosunun tamamı için bu maddenin yürürlük tarihinden itibaren en geç altı ay içinde seçim yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay Genel Kurulu üye tamsayısının hesabında, birinci fıkra uyarınca üye seçimi yapılıncaya kadar yeni ihdas edilen kadrolar dikkate alınmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bakmakla yükümlü oldukları aile fertleri dâhil olmak üzere; kapatılan Askeri Yüksek İdare Mahkemesinin askeri hâkim sınıfından Başkan, Başsavcı, Daire Başkanı ve üyelerinden emekliye ayrılmış olanlar ile geçici 27 nci maddenin yedinci fıkrası kapsamına girenler ve bunların emeklilerinin 64 üncü maddenin ikinci fıkrası kapsamındaki sağlık giderleri anılan fıkra hükümleri çerçevesinde Danıştay bütçesinden karşılanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Danıştayın ilk derece mahkemesi olarak Bakanlar Kurulu kararları, Bakanlar Kurulu kararıyla yürürlüğe konulan düzenleyici işlemler ile Başbakanlık, bakanlıklar ve diğer kamu kurum ve kuruluşlarının müsteşarlarıyla ilgili müşterek kararnamelerine ilişkin görev ve yetkileri devam eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddenin yürürlüğe girdiği tarihten önce birinci fıkrada belirtilen işlemlere ilişkin ilk derece mahkemesi olarak Danıştayda açılmış bulunan davalar Danıştayda bakılarak sonuçlandırılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu maddenin yürürlüğe girdiği tarihten itibaren üç yıl süreyle Danıştay tetkik hâkimliğine yapılacak atamalarda, 11 inci maddenin birinci fıkrasındaki beş yıllık hizmet süresi aranmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="97" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="98" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
