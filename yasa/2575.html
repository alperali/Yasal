  <mvz-künye tür="kanun" no="2575" başlık="DANIŞTAY KANUNU"
             tarih="6/1/1982" rgazete-tarih="20/1/1982" rgazete-sayı="17580"
             düstur-tertip="5" düstur-cilt="21" düstur-sayfa="119" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Kuruluş">
    <mvz-madde no="1" başlık="Danıştay">
      <mvz-fıkra no="1">
        <template>Danıştay, Türkiye Cumhuriyeti Anayasası ile görevlendirilmiş Yüksek İdare Mahkemesi, danışma ve inceleme merciidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Bağımsızlık ve yönetim">
      <mvz-fıkra no="1">
        <template>Danıştay bağımsızdır. Yönetimi ve temsili Danıştay Başkanına aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay'ın yürütmeyle ilgili işleri Cumhurbaşkanlığı aracılığı ile yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Danıştay meslek mensupları">
      <mvz-fıkra no="1">
        <template>Danıştay meslek mensupları Danıştay Başkanı, Danıştay Başsavcısı, Danıştay başkanvekili, daire başkanları ile üyelerdir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Teminat">
      <mvz-fıkra no="1">
        <template>Danıştay Başkanı, Başsavcı, başkanvekilleri, daire başkanları ve üyeler yüksek mahkeme hakimleri olarak Türkiye Cumhuriyeti Anayasası ve kanunların kendilerine sağladığı teminat altında görev yaparlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Karar organları">
      <mvz-fıkra no="1">
        <template>Danıştayın karar organları şunlardır:</template>
        <mvz-bent no="a">
          <template>Daireler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Danıştay Genel Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>İdari İşler Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İdari Dava Daireleri Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Vergi Dava Daireleri Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>İçtihatları Birleştirme Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Başkanlar Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Başkanlık Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Yüksek Disiplin Kurulu,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Disiplin Kurulu,</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Genel sekreterlik">
      <mvz-fıkra no="1">
        <template>Danıştay Başkanının seçeceği bir üye Danıştay Genel Sekreterliği görevini yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci sınıfa ayrılmış Danıştay tetkik hakimlerinden veya savcılarından en çok ikisi genel sekreter yardımcısı olarak görevlendirilebilir. Genel Sekreterlik hizmetleri için yeteri kadar savcı, tetkik hakimi ve memur verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="İdari hizmetler">
      <mvz-fıkra no="1">
        <template>Danıştayda Özlük İşleri, Evrak, Levazım, Kitaplık ve Yayın, Tasnif, Arşiv, Sosyal ve İdari İşler, Özel Kalem müdürlükleriyle bu Kanunda yazılı ve ihtiyaca göre kurulacak bürolar ve kalemler bulunur.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Nitelik, Seçim ve Atanma">
    <mvz-madde no="8" başlık="Danıştay üyelerinin nitelikleri">
      <mvz-fıkra no="1">
        <template>Danıştay üyeleri:</template>
        <mvz-bent no="a">
          <template>İdari yargı hakim ve savcılığı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakanlık, Cumhurbaşkanı yardımcılığı, bakan yardımcılığı, müsteşarlık, müsteşar yardımcılığı, elçilik, valilik,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Generallik, amirallik,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Cumhurbaşkanlığı Genel Sekreterliği, Cumhurbaşkanlığı İdari İşler Başkanlığı, Türkiye Büyük Millet Meclisi Genel Sekreterliği,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Hâkimler ve Savcılar Yüksek Kurulu Genel Sekreterliği,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Genel ve katma bütçeli dairelerde veya kamu kuruluşlarında genel müdürlük veya en az bu derecedeki tetkik ve teftiş kurul başkanlıkları, ile düzenleyici ve denetleyici kurumların başkanlıkları,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Yükseköğrenim kurumlarında hukuk, iktisat, maliye, kamu yönetimi profesörlüğü,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Kamu kurum ve kuruluşlarının başhukuk müşavirliği, birinci hukuk müşavirliği, hukuk hizmetleri başkanlığı ve hukuk işleri müdürlüğü,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Görevlerini yapanlar arasından seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İdari yargı hakim ve savcılarının Danıştay üyeliğine seçilebilmeleri için birinci sınıfa ayrıldıktan sonra en az üç yıl bu görevlerde başarı ile çalışmış olmaları ve birinci sınıfa ayrılma niteliğini kaybetmemeleri gereklidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>İdari görevlerden Danıştay üyeliğine seçileceklerin yükseköğrenimlerini tamamladıktan sonra Devlet hizmetlerinde onbeş yıl  çalışmış bulunmaları, birinci derece aylığını kazanılmış hak olarak almaları ve hakimliğin gerektirdiği ahlak ve seciyeye sahip olmaları şarttır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Üye seçimi">
      <mvz-fıkra no="1">
        <template>Danıştayda boşalan üyeliklerin dörtte üçü idari yargı hakim ve savcılığından, dörtte biri ise diğer görevliler arasından seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İdari yargı hakim ve savcıları, Hakimler ve Savcılar Yüksek Kurulunca; diğer görevlerde bulunanlar ise, Cumhurbaşkanınca Danıştay üyeliğine seçilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Danıştay üyeleri on iki yıl için seçilir. Bir kimse iki defa Danıştay üyesi seçilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Hâkimler ve Savcılar Yüksek Kurulu tarafından Danıştay üyeliğine seçilip görev süresi sona erenler, Hâkimler ve Savcılar Yüksek Kurulu ilgili dairesi tarafından, idari yargıda sınıf ve derecelerine uygun bir göreve atanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Cumhurbaşkanı tarafından Danıştay üyeliğine seçilip idari yargıda bir göreve atanmak isteyenler, görev sürelerinin bitiminden bir ay öncesine kadar, idari yargıda bir göreve atanmak için talepte bulunur. Talepte bulunanlar Hâkimler ve Savcılar Yüksek Kurulu ilgili dairesi tarafından idari yargıda sınıf ve derecelerine uygun bir göreve atanır. Talepte bulunmayanlar, başka bir göreve atanmak üzere Danıştay Başkanlığı tarafından Cumhurbaşkanlığına bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Görevi sona eren üyelerin Danıştay ile ilişkileri kesilir; ancak atamaları gerçekleşinceye kadar, özlük hakları Danıştay tarafından karşılanmaya devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Danıştayda boşalan üye sayısı dördü bulunca, dördüncü üyeliğin boşaldığı tarihten itibaren en geç üç gün içinde durum Danıştay Başkanlığınca, boşalan üyeliklerin idare veya vergi dairesi üyeliği olduğu da belirtilmek suretiyle, Cumhurbaşkanlığına ve Adalet Bakanlığına duyurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Cumhurbaşkanı ve Hakimler ve Savcılar Yüksek Kurulunca bu duyurudan sonra en geç iki ay içinde seçim yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Danıştay Başkanı, Başsavcısı, Başkanvekilleri ve Daire Başkanlarının nitelikleri, seçimleri ve görev süreleri">
      <mvz-fıkra no="1">
        <template>Danıştay Başkanı, Başsavcısı, başkanvekilleri ve daire başkanları kendi üyeleri arasından Danıştay Genel Kurulunca üye tam sayısının salt çoğunluğu ile seçilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay Başkanı ve Başsavcısı seçilebilmek için altı yıl, başkanvekili ve daire başkanı seçilebilmek için üç yıl süre ile Danıştay üyeliği yapmış olmak zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Danıştay Başkanı, Başsavcısı, başkanvekilleri ve daire başkanlarının görev süreleri dört yıldır. Süresi bitenler yeniden seçilebilirler, yeniden seçilemeyenler ile seçime girmeyenler veya süreleri dolmadan bu görevlerden çekilenler Danıştay üyeliği görevlerine devam ederler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Seçim, görev sürelerinin biteceği tarihten onbeş gün önce veya diğer sebeplerle boşalma tarihinden itibaren onbeş gün içinde yapılır. Çalışmaya ara verme süresi bu sürenin hesabında nazara alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Seçime katılmak isteyenler seçim gününden önce Danıştay Başkanlığına yazı ile başvurabilecekleri gibi, toplantıda oylamaya başlanmadan önce sözlü olarak da istekte bulunabilirler veya teklif edilebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Seçim gizli oyla yapılır. İlk üç oylamada sonuç alınamazsa, seçim üçüncü oylamada en çok oy alan iki aday arasında yapılır. Dördüncü oylamada bu çoğunluk sağlanamazsa seçim, yeniden aday gösterilerek tekrarlanır. Şu kadar ki, bundan sonraki üç oylamada sonuç alınamazsa dördüncü oylamada en çok oy alan seçilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>(Mülga)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Danıştay Tetkik Hakimi ve Savcılarının atanmaları ve dairelere verilmeleri">
      <mvz-fıkra no="1">
        <template>Danıştay tetkik hakimleri ile savcıları, beş yıl meslekte hizmet etmiş ve olumlu sicil almış idari yargı hakimleri arasından Hakimler ve Savcılar Yüksek Kurulunca atanırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay tetkik hakimlerinin görev yerleri, Başkanlık Kurulu tarafından belirlenir. Görev yerleri, aynı usulle değiştirilir. İdari bakımdan zaruret olmadıkça bir sicil devresi geçmeden görev yerleri değiştirilemez. Sicil devresi en az altı aydır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tetkik hakimlerinin görev yaptıkları kurul ve daireler, yönetmelikte belirlenecek esas ve sürelere göre değiştirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Memurların nitelikleri, atanmaları, istihdamı, nakilleri ve görevlendirilmeleri">
      <mvz-fıkra no="1">
        <template>Genel Sekreterliğe bağlı olarak faaliyet gösteren idarî hizmet birimleri ile Daireler, Kurullar ve Başsavcılığa bağlı olarak faaliyet gösteren ve kalem hizmetlerini yürüten birimlerde çalışacak memurların, 657 sayılı Devlet Memurları Kanununda belirtilen nitelikleri haiz olmaları gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada belirtilen memurlar naklen veya açıktan atama yoluyla atanır. Açıktan ilk defa Devlet memurluğuna atanacaklar, Devlet memurluğuna giriş için yapılan merkezi sınava girmiş olanlar arasından, Genel Sekreterin görevlendireceği genel sekreter yardımcısının başkanlığında, iki tetkik hâkiminden oluşturulan üç kişilik komisyon tarafından düzenlenecek sözlü ve gerektiğinde uygulamalı sınav sonucuna göre Genel Sekreterin teklifi üzerine Danıştay Başkanınca atanırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Danıştayda çalışan Devlet Memurları Kanununa tabi personel, Genel Sekreterin teklifi ve Başkanın uygun görmesi üzerine, Adalet Bakanlığınca mükteseplerine uygun olarak, açıktan atama iznine tabi olmaksızın, Bakanlığın taşra kadrolarına atanabilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Daire ve Kurullar">
    <mvz-madde no="13" başlık="Daireler">
      <mvz-fıkra no="1">
        <template>Danıştay; dokuzu dava, biri idari daire olmak üzere on daireden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Her dairede bir başkan ile yeteri kadar üye bulunur. Heyetler bir başkan ve dört üyenin katılmasıyla toplanır, salt çoğunluk ile karar verir. Üye sayısının yeterli olması halinde birden fazla heyet oluşturulabilir. Bu durumda, oluşturulan diğer heyetlere, heyette yer alan en kıdemli üye başkanlık eder. Müzakereler gizli yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Dairelerde yeteri kadar tetkik hakimi bulunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Her dairede, ayrıca bir yazı işleri müdürünün yönetimi altında bir kalem bulunur. Kalem, yazı ve tebliğ işlerini yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Başkan ve üyelerin dairelere ayrılmaları">
      <mvz-fıkra no="1">
        <template>Daire başkanları belirli bir dairenin başkanı olarak seçilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üyeler, Başkanlık Kurulunun kararı ile dairelere ayrılırlar ve hizmetin icaplarına göre, daireleri aynı usulle değiştirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>(Mülga)</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Dairelerde vukubulacak noksanlıklar, diğer dairelerden üye alınmak suretiyle tamamlanır. Bu üyeler Başkanlık Kurulunun kararı ile önceden tespit edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Danıştay genel kurulu">
      <mvz-fıkra no="1">
        <template>Danıştay Genel Kurulu, Danıştay Başkanı, Başsavcı, başkanvekilleri, daire başkanları ve üyeler ile Genel Sekreterden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel Kurulun toplanma ve görüşme yeter sayısı Başkan ve üyeler tam sayısının yarısından fazlasıdır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kararlar çoğunlukla verilir. Oylarda eşitlik halinde, Başkanın bulunduğu taraf çoğunluğu sağlanmış sayılır. Genel Kurulun toplantı yeter sayısına ilişkin özel hükümler saklıdır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="İdari işler kurulu">
      <mvz-fıkra no="1">
        <template>İdari İşler Kurulu, idari daire başkanı ile her takvim yılı başında Başkanlık Kurulunca idari daireden seçilecek iki üye ve her dava dairesi başkan veya üyeleri arasından seçilecek bir üyeden oluşur. Kurulun seçimle belirlenen üyeliklerinde boşalma olması hâlinde Başkanlık Kurulunca otuz gün içinde seçim yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kurula Danıştay Başkanı veya başkanvekillerinden biri başkanlık eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Toplanma ve görüşme yeter sayısı dokuzdur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Memurların yargılanması ile ilgili işlerin görüşülmesinde, incelenmekte olan kararı veren daire başkan ve üyeleri toplantıya katılamazlar.    Bu toplantılarda toplanma ve görüşme yeter sayısı yedidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kararlar oyçokluğu ile verilir. Oylarda eşitlik halinde Başkanın bulunduğu taraf çoğunluğu sağlamış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İdari İşler Kuruluna yeteri kadar tetkik hakimi ve memur verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="İdari ve vergi dava daireleri kurulları">
      <mvz-fıkra no="1">
        <template>İdari Dava Daireleri Kurulu, idari dava dairelerinin başkanları ile her idari dava dairesinden iki yıl için Başkanlık Kurulu tarafından görevlendirilen iki asıl ve iki yedek üyeden; Vergi Dava Daireleri Kurulu ise vergi dava dairelerinin başkanları ile her vergi dava dairesinden iki yıl için Başkanlık Kurulu tarafından görevlendirilen üç asıl ve üç yedek üyeden oluşur. İki yıllık süre sonunda Başkanlık Kurulunca, her iki kuruldaki üyelerin yarısı iki yıl süreyle yeniden görevlendirilirken, diğer yarısı kurullarda daha önce görevlendirilmeyen üyeler arasından yenilenir. Kurullarda görevlendirilen asıl üyeler, üst üste en fazla iki dönem görevlendirilebilir. Asıl üyenin görevini geçici olarak yerine getirememesi durumunda ilgili daireden, zorunlu hallerde diğer dairelerden görevlendirilen yedek üye kurul toplantılarına katılır. Kurulların asıl veya yedek üyeliklerinde boşalma olması hâlinde Başkanlık Kurulu tarafından yedi gün içinde, kalan süreyi tamamlamak üzere yeni üye görevlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dava daireleri kurullarına Danıştay Başkanı veya vekillerinden biri; bunların yokluğunda daire başkanlarından en kıdemlisi başkanlık eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Toplantı ve görüşme yeter sayısı İdari Dava Daireleri Kurulu için on beş, Vergi Dava Daireleri Kurulu için ise on birdir. İdari dava daireleri ile vergi dava dairelerinin ilk derece mahkemesi olarak verdikleri kararların temyiz veya itiraz yoluyla incelenmesinde ve iki dava dairesinin birlikte yapacağı toplantıda verilen kararların incelenmesinde, bu dairelerde karara katılmış olanlar idari ve vergi dava daireleri kurullarında bulunamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu toplantılarda hazır bulunanlar çift sayıda olursa en kıdemsiz üye kurula katılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu kurullarda kararlar oyçokluğu ile verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Her kurula yeteri kadar tetkik hakimi verilir. Ayrıca bir yazı işleri müdürlüğü bulunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="İçtihadları birleştirme kurulu">
      <mvz-fıkra no="1">
        <template>İçtihatları Birleştirme Kurulu, Danıştay Başkanı, Başsavcı, başkanvekilleri, dava daireleri başkanları ve üyelerinden kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Toplanma ve görüşme yetersayısı en az otuzbirdir. Toplantıda hazır bulunanlar çift sayıda olursa en kıdemsiz üye Kurula katılmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Esas hakkındaki kararlar, birinci toplantıda Kurul üye tamsayısının salt çoğunluğu ile, bu toplantıda karar yetersayısı sağlanamaz ise ikinci toplantıda mevcudun salt çoğunluğu ile verilir. Kurulun diğer kararları oyçokluğu ile verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İçtihatları Birleştirme Kuruluna yeteri kadar tetkik hakimi ve memur verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Başkanlar Kurulu">
      <mvz-fıkra no="1">
        <template>Başkanlar Kurulu, Danıştay Başkanının başkanlığında Başsavcı, başkanvekilleri ve daire başkanlarından oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Daire başkanının mazereti halinde, Kurula, dairenin en kıdemli üyesi katılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kararlar oy çokluğu ile verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Oylarda eşitlik halinde Başkanın bulunduğu taraf çoğunluğu sağlamış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19/A" başlık="Başkanlık Kurulu">
      <mvz-fıkra no="1">
        <template>Başkanlık Kurulu; Danıştay Başkanının başkanlığında, üçü daire başkanı üçü Danıştay üyesi olmak üzere altı asıl ve ikisi daire başkanı ikisi Danıştay üyesi olmak üzere dört yedek üyeden oluşur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19/B" başlık="Başkanlık Kurulu üyelerinin seçimleri">
      <mvz-fıkra no="1">
        <template>Başkanlık Kuruluna seçilecek asıl ve yedek üyeler Danıştay Genel Kurulunca seçilir. Başkanlık Kurulu üyeliğine aynı daireden birden fazla kimse seçilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Başkanlık Kurulu, üye tamsayısı ile toplanır. Asıl üyelerden birinin Kurula katılamaması hâlinde, noksanlık yedeği ile tamamlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Başkanlık Kurulu üyeleri kendileri ile ilgili konularda Kurul toplantılarına katılamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Başkanlık Kuruluna seçilecek olanların tamamının bir oy pusulasında gösterilmesi suretiyle oy kullanılması da mümkündür. Aday çıkmadığı veya yeter sayıda başvuru olmadığı takdirde Başkanlar Kurulu tarafından gizli oyla ve oy çokluğu ile adaylar dışından seçilebileceklerin üç katı aday gösterilir. Seçimler 10 uncu madde hükümleri gereğince yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Başkanlık Kuruluna seçilenlerin görev süresi iki yıl olup bir seçim dönemi geçmeden yeniden seçilemezler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Başkanlık Kurulu üyeliğine seçilen daire başkan ve üyelerinin seçim süresi dolmadan bu sıfatları değiştiğinde Kurul üyeliğinden ayrılmış sayılırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Başkanlık Kurulu üyeliğinin herhangi bir nedenle boşalması hâlinde on beş gün içinde boşalan üyelik için seçim yapılır ve seçilen üye, yerine seçildiği üyenin süresini tamamlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="Yüksek disiplin kurulu">
      <mvz-fıkra no="1">
        <template>Yüksek Disiplin Kurulu, Danıştay Başkanının Başkanlığında her takvim yılı başında, Danıştay Genel Kurulunca her daireden seçilecek birer üye ile ikisi dava daireleri ve biri de idari daireler başkanları arasından seçilecek üç daire başkanından kurulur. Danıştay Başsavcısı Kurulun tabii üyesidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurula iki daire başkanı ve beş üye yedek olarak seçilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurul üye tam sayısı ile toplanır ve üçte iki oyçokluğu ile karar verir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurul üyeliklerinde boşalma halinde, boşalan yer için en çok on gün içinde Genel Kurulca birinci fıkradaki esaslara göre yeniden seçim yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurulun yazı işlerini Genel Sekreter yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="21" başlık="Disiplin kurulu">
      <mvz-fıkra no="1">
        <template>Disiplin Kurulu, Genel Kurulun her takvim yılı başında seçeceği bir daire başkanıyla bir üyeden ve birinci sınıfa ayrılmış bir tetkik hakimi ile bir Danıştay savcısından oluşur. Aynı şekilde birer yedek seçilir. Genel Sekreter Kurulun tabii üyesidir. Daire Başkanı Kurula Başkanlık eder. Kurul oyçokluğu ile karar verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Başkanlara ve Başsavcıya vekalet">
      <mvz-fıkra no="1">
        <template>Danıştay Başkanlığının boşalması, Danıştay Başkanının izinli veya özürlü olması hallerinde başkanvekillerinden en kıdemlisi Danıştay Başkanına vekalet eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Dairelerde en kıdemli üye başkana vekalet eder. Başsavcıya Danıştay Başkanının seçeceği ve Başsavcılığa seçilme niteliğine sahip bir Danıştay üyesi vekalet eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Danıştay'ın, Daire ve Kurulların Görevleri">
    <mvz-madde no="23" başlık="Danıştayın görevleri">
      <mvz-fıkra no="1">
        <template>Danıştay:</template>
        <mvz-bent no="a">
          <template>İdare Mahkemeleri ile vergi mahkemelerinden verilen kararlar ve ilk derece mahkemesi olarak Danıştayda görülen davalarla ilgili kararlara karşı temyiz istemlerini inceler ve karara bağlar.  Danıştayın temyiz mercii olarak görevi, bir hukuk kuralının uygulanmaması veya yanlış uygulanması şeklinde ortaya çıkan hukuka aykırılıkların denetimini yapmakla sınırlıdır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu Kanunda yazılı idari davaları ilk ve son derece mahkemesi olarak karara bağlar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>kamu hizmetleri ile ilgili imtiyaz şartlaşma ve sözleşmeleri hakkında düşüncesini bildirir</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>(Mülga)</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Bu Kanunla ve diğer kanunlarla verilen görevleri yapar.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="İlk derece mahkemesi olarak Danıştay'da görülecek davalar">
      <mvz-fıkra no="1">
        <template>Danıştay ilk derece mahkemesi olarak:</template>
        <mvz-bent no="a">
          <template>Cumhurbaşkanı kararlarına,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Cumhurbaşkanınca çıkarılan Cumhurbaşkanlığı kararnameleri dışındaki düzenleyici işlemlere,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Bakanlıklar ile kamu kuruluşları veya kamu kurumu niteliğindeki meslek kuruluşlarınca çıkarılan ve ülke çapında uygulanacak düzenleyici işlemlere,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Danıştay İdari Dairesince veya İdari İşler Kurulunca verilen kararlar üzerine uygulanan eylem ve işlemlere,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Birden çok idare veya vergi mahkemesinin yetki alanına giren işlere,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Danıştay Yüksek Disiplin Kurulu kararları ile bu Kurulun görev alanı ile ilgili Danıştay Başkanlığı işlemlerine,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Karşı açılacak iptal ve tam yargı davaları ile tahkim yolu öngörülmeyen kamu hizmetleri ile ilgili imtiyaz şartlaşma ve sözleşmelerinden doğan idari davaları karara bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Danıştay, belediyeler ile il özel idarelerinin seçimle gelen organlarının organlık sıfatlarını kaybetmeleri hakkındaki istemleri inceler ve karara bağlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="Temyiz yoluyla Danıştay'da görülecek davalar">
      <mvz-fıkra no="1">
        <template>İdare mahkemeleri ile vergi mahkemelerince verilen nihai kararlar ve ilk derece mahkemesi olarak Danıştayda görülen davalarla ilgili nihai kararlar Danıştayda temyiz yoluyla incelenir ve karara bağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="İdari uyuşmazlık ve davalarda görev">
      <mvz-fıkra no="1">
        <template>İdari uyuşmazlıklar ve davalar; İkinci, Üçüncü, Dördüncü, Beşinci, Altıncı, Yedinci, Sekizinci, Dokuzuncu ve Onuncu daireler ile idari ve vergi dava daireleri kurullarında incelenir ve karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Başkanlık Kurulu, iş yükü bakımından zorunluluk doğması hâlinde vergi dava daireleri, idari dava daireleri veya idari dairelerden birinin veya birkaçının görev alanını değiştirerek bu daireleri; vergi dava dairesi, idari dava dairesi veya idari daire olarak görevlendirebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Görevlendirilen dairedeki dosyaların vergi ve idari uyuşmazlıklara ilişkin görev ayrımı gözetilerek hangi daireye ve nasıl devredileceği, görevlendirilen daireye görevlendirildiği alan içinde hangi daire işlerinin verileceği hususları Başkanlık Kurulu kararıyla belirlenir. Bu kararlar Resmî Gazete’de yayımlanır ve yayımını izleyen ay başından itibaren uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Daire Başkanı ve üyeleri, dairenin görevlendirildiği işlere bakan dava dairesi genel kuruluna katılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26/A" başlık="İkinci dairenin görevleri">
      <mvz-fıkra no="1">
        <template>Mülga</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Dava dairelerinin görevleri">
      <mvz-fıkra no="1">
        <template>Dava dairelerinden Üçüncü, Dördüncü, Yedinci ve Dokuzuncu daireler vergi dava dairesi; diğer dava daireleri ise idari dava dairesi olarak görev yapar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>İdari dava daireleri ile vergi dava daireleri kendi aralarında işbölümü esasına göre çalışır.  Özel kanunlarda başkaca hüküm bulunmadığı takdirde dava daireleri arasındaki iş bölümü aşağıdaki esaslar uyarınca Başkanlık Kurulu tarafından belirlenir.</template>
      </mvz-fıkra>
        <mvz-bent no="1.">
          <template>İptal davaları ve idari sözleşmelerden doğan davalar yönünden, daireler arasındaki işbölümünün belirlenmesinde uyuşmazlığın kaynaklandığı mevzuat esas alınır.</template>
        </mvz-bent>
        <mvz-bent no="2.">
          <template>Tam yargı davaları yönünden işbölümü;</template>
          <mvz-altbent no="a">
            <template>Zarara neden olan idari işlemden doğan uyuşmazlığı çözmekle görevli daireye göre,</template>
          </mvz-altbent>
          <mvz-altbent no="b">
            <template>Zarar idari eylemden kaynaklanmışsa hizmetin niteliğine göre,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>belirlenir.</template>
        </mvz-bent>
        <mvz-bent no="3.">
          <template>Vergi, resim, harç ve benzeri malî yükümlere ilişkin davalarda vergi dava daireleri arasındaki işbölümünün belirlenmesinde uyuşmazlığın kaynaklandığı mevzuat esas alınır.</template>
        </mvz-bent>
        <mvz-bent no="4.">
          <template>Temyiz incelemesi yapmakla görevli daire, aynı konuda ilk derece mahkemesi olarak Danıştayda görülecek davalara bakmak ve olağanüstü kanun yolları incelemelerini de yapmakla görevlidir.</template>
        </mvz-bent>
        <mvz-bent no="5.">
          <template>İdare mahkemeleri arasında görev ve yetkiye ilişkin uyuşmazlıklarda ve bağlantılı davalarda merci tayini, uyuşmazlığın esasını çözümlemekle görevli idari dava dairesince yapılır.</template>
        </mvz-bent>
        <mvz-bent no="6.">
          <template>Vergi mahkemeleri arasında görev ve yetkiye ilişkin uyuşmazlıklarda ve bağlantılı davalarda merci tayini, uyuşmazlığın esasını çözümlemekle görevli vergi dava dairesince yapılır.</template>
        </mvz-bent>
        <mvz-bent no="7.">
          <template>İşbölümünde idari ve vergi dava dairelerinden herhangi birinin görevinde olduğu belirlenmemiş davalara bakmak üzere birer idari ve vergi dava dairesi görevlendirilir.</template>
        </mvz-bent>
        <mvz-bent no="8.">
          <template>İşbölümünde aynı mevzuattan kaynaklanan uyuşmazlıkların birden fazla dairede çözümlenmesi konusunda farklı esaslar belirlenebilir.</template>
        </mvz-bent>
      <mvz-fıkra no="0">
        <template>Dairelerden birinin yıl içinde gelen işleri normal çalışma ile karşılanamayacak oranda artmış ve daireler arasında iş bakımından bir dengesizlik meydana gelmiş ise takvim yılı başında ikinci fıkrada belirlenen usule göre bir kısım işler başka daireye verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Bu madde uyarınca alınan kararlar Resmî Gazetede yayımlanır ve yayımı izleyen ay başından itibaren uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>

    <mvz-madde no="36" başlık="Yeni vergilerle ilgili uyuşmazlıkların çözümü">
      <mvz-fıkra no="1">
        <template>Bir vergiyi kaldıran ve yerine aynı veya benzeri nitelikte yeni bir vergi koyan kanunlardan doğan uyuşmazlıklar, önceki vergiden doğan uyuşmazlıkları çözümlemekle görevli dairece çözümlenir.</template>
      </mvz-fıkra>

    <mvz-madde no="38" başlık="İdari ve vergi dava daireleri kurullarının görevleri">
      <mvz-fıkra no="1">
        <template>İdari Dava Daireleri Kurulu;</template>
        <mvz-bent no="a">
          <template>İdare mahkemelerinden verilen ısrar kararlarını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İdari dava dairelerinden ilk derece mahkemesi olarak verilen kararları,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Temyizen inceler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Vergi Dava Daireleri Kurulu;</template>
        <mvz-bent no="a">
          <template>Vergi mahkemelerinden verilen ısrar kararlarını,</template>

      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Daire başkanları her takvim yılı sonunda, dairelerindeki işlerin durumu ve bunların yürütülmesinde aksaklık varsa sebepleri hakkında Danıştay Başkanlığına bir rapor verirler ve alınmasını lüzumlu gördükleri tedbirleri bildirirler.</template>

      <mvz-fıkra no="1">
        <template>Üyeler, bulundukları dairelerde başkanlar veya dahil bulundukları kurullarda kurul başkanları tarafından kendilerine verilen dosyaları geciktirmeden inceleyerek görevli daire veya kurullara gerekli açıklamaları yaparlar, kararları yazarlar, dairelerin ve üyesi bulundukları kurulların toplantılarına katılırlar, düşünce ve görüşlerini bildirirler, oylarını verirler ve daire ile ilgili olmak üzere verilen diğer işleri görürler.</template>
