  <mvz-künye tür="kanun" no="5235" başlık="ADLÎ YARGI İLK DERECE MAHKEMELERİ İLE BÖLGE ADLİYE MAHKEMELERİNİN KURULUŞ, GÖREV VE YETKİLERİ HAKKINDA KANUN"
             tarih="26/9/2004" rgazete-tarih="7/10/2004" rgazete-sayı="25606"
             düstur-tertip="5" düstur-cilt="43" />

  <mvz-kısım no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, adlî yargı ilk derece mahkemeleri ile bölge adliye mahkemelerinin kuruluş, görev ve yetkilerini düzenler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="İlk derece mahkemeleri">
      <mvz-fıkra no="1">
        <template>Adlî yargı ilk derece mahkemeleri, hukuk ve ceza mahkemeleridir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Bölge adliye mahkemeleri">
      <mvz-fıkra no="1">
        <template>Adlî yargı ikinci derece mahkemeleri, bölge adliye mahkemeleridir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-kısım>
  <mvz-kısım no="2-İKİNCİ" başlık="Adlî Yargı İlk Derece Mahkemeleri">
    <mvz-bölüm no="1-BİRİNCİ" başlık="Hukuk Mahkemeleri">
      <mvz-madde no="4" başlık="Hukuk mahkemeleri">
        <mvz-fıkra no="1">
          <template>Hukuk mahkemeleri, sulh hukuk ve asliye hukuk mahkemeleri ile özel kanunlarla kurulan diğer hukuk mahkemeleridir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="5" başlık="Hukuk mahkemelerinin kuruluşu">
        <mvz-fıkra no="1">
          <template>Hukuk mahkemeleri, her il merkezi ile bölgelerin coğrafî durumları ve iş yoğunluğu göz önünde tutularak belirlenen ilçelerde Hâkimler ve Savcılar Yüksek Kurulunun olumlu görüşü alınarak Adalet Bakanlığınca kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sulh hukuk ve asliye hukuk mahkemeleri tek hâkimlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Asliye ticaret mahkemesi kurulan yerlerde bu mahkemelerde bir başkan ile yeteri kadar üye bulunur. Konusu parayla ölçülebilen uyuşmazlıklarda dava değeri bir milyon Türk lirasının üzerinde olan dava ve işler ile dava değerine bakılmaksızın;</template>
          <mvz-bent no="1.">
            <template>İflas,  iflasın kaldırılması, iflasın kapatılması, konkordato ve yeniden yapılandırmadan kaynaklanan iş ve davalara,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>13/1/2011 tarihli ve 6102 sayılı Türk Ticaret Kanununda hâkimin kesin olarak karara bağlayacağı işler ile davalara,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Şirketler ve kooperatifler hukukundan kaynaklanan genel kurul kararlarının iptali ve butlanına ilişkin davalara, yönetim organları ve denetim organları aleyhine açılacak sorumluluk davalarına, organların azline ve geçici organ atanmasına ilişkin davalara, fesih, infisah ve tasfiyeye yönelik davalara,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>12/1/2011 tarihli ve 6100 sayılı Hukuk Muhakemeleri Kanununa ve 21/6/2001 tarihli ve 4686 sayılı Milletlerarası Tahkim Kanununa göre yapılan tahkim yargılamasında; tahkim şartına ilişkin itirazlara,  hakemlerin seçimi ve reddine yönelik davalar ile yabancı hakem kararlarının tanıma ve tenfizine yönelik davalara,</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="0">
          <template>ilişkin tüm yargılama safhaları, bir başkan ve iki üye ile toplanacak heyetçe yürütülür ve sonuçlandırılır.  Bu iş ve davalarda mahkeme başkanı, belirli bazı tahkikat işlemlerini yapmak üzere üyelerden birini naip hâkim olarak görevlendirebilir. Heyet hâlinde bakılacak davalarla ilgili olmak üzere, dava açılmadan önce veya açıldıktan sonra talep edilen ihtiyati haciz ve ihtiyati tedbirler de heyet tarafından incelenir ve karara bağlanır. Bu fıkrada belirtilen dava ve işler dışında kalan uyuşmazlıklar mahkeme hâkimlerinden biri tarafından görülür ve karara bağlanır. Başkan ve üye hâkimler arasında dağılıma ilişkin esaslar, işlerde denge sağlanacak biçimde mahkeme başkanı tarafından önceden tespit edilir.  Bu fıkrada belirtilen parasal sınır, 6100 sayılı Kanunun ek 1 inci maddesinin birinci fıkrasına göre artırılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Özel kanunlarla kurulan diğer hukuk mahkemelerinin kuruluşuna ilişkin hükümler saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İş durumunun gerekli kıldığı yerlerde hukuk mahkemelerinin birden fazla dairesi oluşturulabilir. Bu daireler numaralandırılır. Özel kanunlarda başkaca hüküm bulunmadığı takdirde, ihtisaslaşmanın sağlanması amacıyla, gelen işlerin yoğunluğu ve niteliği dikkate alınarak, daireler arasındaki iş dağılımı Hâkimler ve Savcılar Yüksek Kurulu tarafından belirlenebilir. Bu kararlar Resmî Gazete’de yayımlanır. Daireler, tevzi edilen davalara bakmak zorundadır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Hukuk mahkemeleri bulundukları il veya ilçenin adı ile anılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="6" başlık="Hukuk mahkemelerinin görevleri">
        <mvz-fıkra no="1">
          <template>Sulh hukuk mahkemeleri, 18.6.1927 tarihli ve 1086 sayılı Hukuk Usulü Muhakemeleri Kanunu ile diğer kanunlarda belirtilen görevleri yerine getirir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Asliye hukuk mahkemeleri, sulh hukuk mahkemelerinin görevleri dışında kalan ve özel hukuk ilişkilerinden doğan her türlü dava ve işler ile kanunların verdiği diğer dava ve işlere bakar.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Özel kanunlarla kurulan hukuk mahkemelerinin görevleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="7" başlık="Hukuk mahkemelerinin yargı çevresi">
        <mvz-fıkra no="1">
          <template>Hukuk mahkemelerinin yargı çevresi, bulundukları il merkezi ve ilçeler ile bunlara adlî yönden bağlanan ilçelerin idarî sınırlarıdır.  Ancak özel kanunlarla kurulanlar da dâhil olmak üzere, hukuk mahkemelerinin yargı çevresi, il ve ilçe sınırlarına bakılmaksızın Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Kurulunca belirlenebilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2" durum="mülga">
          <template></template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Coğrafî durum ve iş yoğunluğu göz önünde tutularak bir hukuk mahkemesinin kaldırılmasına veya yargı çevresinin değiştirilmesine, özel kanunlarında yargı çevresi belirtilmemiş olan hukuk mahkemelerinin yargı çevresinin belirlenmesine, Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Yüksek Kurulunca karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="2-İKİNCİ" başlık="Ceza Mahkemeleri">
      <mvz-madde no="8" başlık="Ceza mahkemeleri">
        <mvz-fıkra no="1">
          <template>Ceza mahkemeleri,  asliye ceza ve ağır ceza mahkemeleri ile özel kanunlarla kurulan diğer ceza mahkemeleridir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="9" başlık="Ceza mahkemelerinin kuruluşu">
        <mvz-fıkra no="1">
          <template>Ceza mahkemeleri, her il merkezi ile bölgelerin coğrafî durumları ve iş yoğunluğu göz önünde tutularak belirlenen ilçelerde Hâkimler ve Savcılar Yüksek Kurulunun olumlu görüşü alınarak Adalet Bakanlığınca kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Asliye ceza mahkemeleri tek hâkimlidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Ağır ceza mahkemesinde bir başkan ile yeteri kadar üye bulunur. Bu mahkeme bir başkan ve iki üye ile toplanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Özel kanunlarla kurulan diğer ceza mahkemelerinin kuruluşuna ilişkin hükümler saklıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>İş durumunun gerekli kıldığı yerlerde ceza mahkemelerinin birden fazla dairesi oluşturulabilir. Bu daireler numaralandırılır.  Özel kanunlarda başkaca hüküm bulunmadığı takdirde ihtisaslaşmanın sağlanması amacıyla, gelen işlerin yoğunluğu ve niteliği dikkate alınarak daireler arasındaki iş dağılımı, Hâkimler ve Savcılar Yüksek Kurulu tarafından belirlenebilir. Bu kararlar, Resmî Gazete’de yayımlanır. Daireler, tevzi edilen davalara bakmakla yükümlüdür. Hâkimler ve Savcılar Yüksek Kurulunca iş dağılımının yapıldığı tarih itibarıyla görülmekte olan davalarda daireler, iş bölümü gerekçesiyle dosyaları diğer bir daireye gönderemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Ceza mahkemeleri bulundukları il veya ilçenin adı ile anılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Sulh ceza hâkimliği">
        <mvz-fıkra no="1">
          <template>Kanunların ayrıca görevli kıldığı hâller saklı kalmak üzere, yürütülen soruşturmalarda hâkim tarafından verilmesi gerekli kararları almak, işleri yapmak ve bunlara karşı yapılan itirazları incelemek amacıyla sulh ceza hâkimliği kurulmuştur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İş durumunun gerekli kıldığı yerlerde birden fazla sulh ceza hâkimliği kurulabilir. Bu durumda sulh ceza hâkimlikleri numaralandırılır. Müstakilen sulh ceza hâkimliğinde görevlendirilen hâkimler, adli yargı adalet komisyonlarınca başka mahkemelerde veya işlerde görevlendirilemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Sulh ceza hâkimliğinde bir yazı işleri müdürü ile yeteri kadar personel bulunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Sulh ceza hâkimliği, her il merkezi ile bölgelerin coğrafi durumları ve iş yoğunluğu göz önünde tutularak belirlenen ilçelerde Hâkimler ve Savcılar Yüksek Kurulunun olumlu görüşü alınarak Adalet Bakanlığınca kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Sulh ceza hâkimliği bulundukları il veya ilçenin adı ile anılır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="6">
          <template>Sulh ceza hâkimliğinin yargı çevresi, bulundukları il merkezi ve ilçeler ile bunlara adli yönden bağlanan ilçelerin idari sınırlarıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="7">
          <template>Ağır ceza mahkemeleri ile büyükşehir belediyesi bulunan illerde, büyükşehir belediyesi sınırları içerisindeki il ve ilçenin adı ile anılan sulh ceza hâkimliğinin yargı çevresi, il veya ilçe sınırlarına bakılmaksızın Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Yüksek Kurulunca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="8">
          <template>Coğrafi durum ve iş yoğunluğu göz önünde tutularak bir sulh ceza hâkimliğinin kaldırılmasına veya yargı çevresinin değiştirilmesine, Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Yüksek Kurulunca karar verilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Asliye ceza mahkemesinin görevi">
        <mvz-fıkra no="1">
          <template>Kanunların ayrıca görevli kıldığı hâller saklı kalmak üzere, sulh ceza hâkimliği ve ağır ceza mahkemelerinin görevleri dışında kalan dava ve işlere asliye ceza mahkemelerince bakılır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Ağır ceza mahkemesinin görevi">
        <mvz-fıkra no="1">
          <template>Kanunların ayrıca görevli kıldığı hâller saklı kalmak üzere, Türk Ceza Kanununda yer alan yağma (m. 148), irtikâp (m. 250/1 ve 2), resmî belgede sahtecilik (m. 204/2), nitelikli dolandırıcılık (m. 158), hileli iflâs (m. 161) suçları, Türk Ceza Kanununun İkinci Kitap Dördüncü Kısmının Dört, Beş, Altı ve Yedinci Bölümünde tanımlanan suçlar (318, 319, 324, 325 ve 332 nci maddeler hariç) ve 12/4/1991 tarihli ve 3713 sayılı Terörle Mücadele Kanununun kapsamına giren suçlar dolayısıyla açılan davalar ile ağırlaştırılmış müebbet hapis, müebbet hapis ve on yıldan fazla hapis cezalarını gerektiren suçlarla ilgili dava ve işlere bakmakla ağır ceza mahkemeleri görevlidir. Anayasa Mahkemesi ve Yargıtayın yargılayacağı kişilere ilişkin hükümler, askerî mahkemelerin görevlerine ilişkin hükümler ile çocuklara özgü kovuşturma hükümleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="13" başlık="Diğer ceza mahkemelerinin görevleri">
        <mvz-fıkra no="1">
          <template>Diğer ceza mahkemeleri, özel kanunlarla belirlenen dava ve işleri görür.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="14" başlık="Mahkemenin görevinin belirlenmesi">
        <mvz-fıkra no="1">
          <template>Mahkemelerin görevlerinin belirlenmesinde ağırlaştırıcı veya hafifletici nedenler gözetilmeksizin kanunda yer alan suçun cezasının üst sınırı göz önünde bulundurulur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="15" başlık="Ceza mahkemelerinin yargı çevresi">
        <mvz-fıkra no="1">
          <template>Ceza mahkemelerinin yargı çevresi, bulundukları il merkezi ve ilçeler ile bunlara adlî yönden bağlanan ilçelerin idarî sınırlarıdır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ağır ceza mahkemeleri ile büyükşehir belediyesi bulunan illerde, büyükşehir belediyesi sınırları içerisindeki il ve ilçenin adı ile anılan sulh veya asliye ceza mahkemelerinin yargı çevresi, il veya ilçe sınırlarına bakılmaksızın Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Yüksek Kurulunca belirlenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Coğrafî durum ve iş yoğunluğu göz önünde tutularak bir ceza mahkemesinin kaldırılmasına veya yargı çevresinin değiştirilmesine, özel kanunlarında yargı çevresi belirtilmemiş olan diğer ceza mahkemelerinin yargı çevresinin belirlenmesine, Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Yüksek Kurulunca karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Türk Ceza Kanununun İkinci Kitap Dördüncü Kısmının Dördüncü, Beşinci, Altıncı ve Yedinci Bölümlerinde tanımlanan suçlar  ile 3713 sayılı Kanunun kapsamına giren suçlar sebebiyle açılan davalar, suçun işlendiği yerin bağlı olduğu ilin adıyla anılan ağır ceza mahkemesinde görülür.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Cumhuriyet Başsavcılığı">
      <mvz-madde no="16" başlık="Cumhuriyet başsavcılığının kuruluşu">
        <mvz-fıkra no="1">
          <template>Mahkeme kuruluşu bulunan her il merkezi ve ilçede o il veya ilçenin adı ile anılan bir Cumhuriyet başsavcılığı kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Cumhuriyet başsavcılığında, bir Cumhuriyet başsavcısı ve yeteri kadar Cumhuriyet savcısı bulunur. Gerekli görülen yerlerde Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Yüksek Kurulunun kararıyla bir veya birden fazla Cumhuriyet başsavcıvekili atanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="17" başlık="Cumhuriyet başsavcılığının görevleri">
        <mvz-fıkra no="1">
          <template>Cumhuriyet başsavcılığının görevleri şunlardır:</template>
          <mvz-bent no="1.">
            <template>Kamu davasının açılmasına yer olup olmadığına karar vermek üzere soruşturma yapmak veya yaptırmak,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Kanun hükümlerine göre, yargılama faaliyetlerini kamu adına izlemek, bunlara katılmak ve gerektiğinde kanun yollarına başvurmak,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Kesinleşen mahkeme kararlarının yerine getirilmesi ile ilgili işlemleri yapmak ve izlemek,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Kanunlarla verilen diğer görevleri yapmak.</template>
          </mvz-bent>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="18" başlık="Cumhuriyet başsavcısının görevleri">
        <mvz-fıkra no="1">
          <template>Cumhuriyet başsavcısının görevleri şunlardır:</template>
          <mvz-bent no="1.">
            <template>Cumhuriyet başsavcılığını temsil etmek,</template>
          </mvz-bent>
          <mvz-bent no="2.">
            <template>Başsavcılığın verimli, uyumlu ve düzenli bir şekilde çalışmasını sağlamak, iş bölümünü yapmak,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Gerektiğinde adlî göreve ilişkin işlemleri yapmak, duruşmalara katılmak ve kanun yollarına başvurmak,</template>
          </mvz-bent>
          <mvz-bent no="4.">
            <template>Kanunlarla verilen diğer görevleri yapmak.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ağır ceza mahkemesi Cumhuriyet başsavcısının; ağır ceza mahkemesinin yargı çevresinde görevli Cumhuriyet başsavcıları, Cumhuriyet başsavcıvekilleri, Cumhuriyet savcıları ile bağlı birimler üzerinde gözetim ve denetim yetkisi vardır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Asliye ceza mahkemesi Cumhuriyet başsavcısının o yer yargı çevresinde görevli Cumhuriyet savcıları ile bağlı birimler üzerinde gözetim ve denetim yetkisi vardır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Cumhuriyet başsavcısı, Cumhuriyet savcılarının soruşturmayı sonlandıran kararları arasında oluşabilecek farklılıkların giderilmesi ile bu kararların kanuna uygunluğunun denetlenmesi hususlarında görevli ve yetkilidir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="19" başlık="Cumhuriyet başsavcıvekilinin görevleri">
        <mvz-fıkra no="1">
          <template>Cumhuriyet başsavcıvekilinin görevleri şunlardır:</template>
          <mvz-bent no="1.">

            <template>Cumhuriyet savcılarının adlî ve idarî görevlerine ilişkin işlemlerini inceleyip Cumhuriyet başsavcısına bilgi vermek,</template>
          </mvz-bent>
          <mvz-bent no="3.">
            <template>Gerektiğinde adlî göreve ilişkin işlemleri yapmak, duruşmalara katılmak ve kanun yollarına başvurmak,</template>

            <template>Cumhuriyet başsavcısının yokluğunda ona vekâlet etmek.</template>

        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Aynı yerde görev yapan birden çok Cumhuriyet başsavcıvekili bulunduğunda, Cumhuriyet başsavcısına vekâlet edecek olanı Cumhuriyet başsavcısı belirler.</template>
        </mvz-fıkra>

      <mvz-madde no="20" başlık="Cumhuriyet savcısının görevleri">
        <mvz-fıkra no="1">
          <template>Cumhuriyet savcısının görevleri şunlardır:</template>
          <mvz-bent no="1.">
            <template>Adlî göreve ilişkin işlemleri yapmak, duruşmalara katılmak ve kanun yollarına başvurmak,</template>
          </mvz-bent>

            <template>Cumhuriyet başsavcısı tarafından verilen adlî ve idarî görevleri yerine getirmek,</template>

          <mvz-bent no="3.">
            <template>Gerektiğinde Cumhuriyet başsavcısına vekâlet etmek,</template>

        <mvz-fıkra no="2">
          <template>Aynı yerde görev yapan Cumhuriyet başsavcıvekili bulunmadığında, Cumhuriyet başsavcısına vekâlet edecek olanı Cumhuriyet başsavcısı belirler.</template>

      <mvz-madde no="21" başlık="Cumhuriyet savcılarının yetkisi">
        <mvz-fıkra no="1">
          <template>Cumhuriyet savcıları, bulundukları il merkezi veya ilçenin idarî sınırları ile bunlara adlî yönden bağlanan ilçelerin idarî sınırları içerisinde yetkilidirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Ağır ceza mahkemesi ile özel kanunlarla kurulan diğer ceza mahkemelerinin yargı çevresinde yer alan Cumhuriyet başsavcılıkları, yetki alanları içerisinde yürüttükleri bu mahkemelerin görevine giren suçlarla ilgili soruşturmaları yapar ve ivedi, zorunlu işlerin tamamlanmasından sonra düşünce yazısına soruşturma evrakını ekleyip ağır ceza mahkemesi veya özel kanunlarla kurulan diğer ceza mahkemelerinin Cumhuriyet başsavcılığına gönderirler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Büyükşehir belediye sınırları içerisinde bulunan Cumhuriyet başsavcıları, bu yer ceza mahkemelerinin yargı çevresinde yetkilidir. Ancak, büyükşehir belediye sınırları içerisinde yer alan ağır ceza mahkemeleri ile özel kanunlarla kurulan diğer ceza mahkemelerinin görevine giren işlerde yukarıdaki fıkra hükmü uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Türk Ceza Kanununun İkinci Kitap Dördüncü Kısmının Dördüncü, Beşinci, Altıncı ve Yedinci Bölümlerinde tanımlanan suçlar (318 inci, 319 uncu, 324 üncü, 325 inci ve 332 nci maddeler hariç) ile 3713 sayılı Kanunun kapsamına giren suçlar sebebiyle açılan soruşturmalar suçun işlendiği yerin bağlı olduğu ilin adıyla anılan Cumhuriyet başsavcılığınca yürütülür. İl Cumhuriyet savcısı, suçun işlendiği yer Cumhuriyet savcısından soruşturmanın kısmen veya tamamen yapılmasını isteyebilir. Gecikmesinde sakınca bulunan hâllerde suçun işlendiği yer Cumhuriyet savcısı zorunlu olan delilleri toplar ve gerekmesi hâlinde alınacak kararlar bakımından bulunduğu yer sulh ceza hâkimliğinden talepte bulunur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Diğer kanunların Cumhuriyet savcılarının yetkisine ilişkin hükümleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="22" başlık="Duruşmalarda Cumhuriyet başsavcılığını temsil">
        <mvz-fıkra no="1">
          <template>Kanunlarda Cumhuriyet savcılığının görev yapacağı belirtilen mahkemelerdeki duruşmalara, Cumhuriyet başsavcısı, görevlendireceği Cumhuriyet başsavcıvekili veya Cumhuriyet savcısı katılır. Gerektiğinde duruşmalara birden çok Cumhuriyet savcısı katılabilir.</template>
        </mvz-fıkra>
      </mvz-madde>

    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Ortak Hükümler">
      <mvz-madde no="23" başlık="Adlî yargı ilk derece mahkemesi adalet komisyonu">
        <mvz-fıkra no="1">
          <template>Ağır ceza mahkemelerinin bulunduğu yargı çevresinde görev yapmak üzere bir adlî yargı ilk derece mahkemesi adalet komisyonu kurulur. Bu komisyonun kuruluş şekli, görev ve yetkileri hakkında 24.2.1983 tarihli ve 2802 sayılı Hâkimler ve Savcılar Kanununun 113 ilâ 115 inci maddeleri uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="24" başlık="Müdürlükler">
        <mvz-fıkra no="1">
          <template>Her mahkemede bir yazı işleri müdürlüğü kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Her Cumhuriyet başsavcılığında, yazı işleri müdürlüğü ile Adalet Bakanlığınca gerekli görülen yerlerde ayrıca idarî, malî ve teknik işlerle ilgili müdürlükler kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Her müdürlükte bir müdür ile yeterli sayıda memur bulunur.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>

  <mvz-kısım no="3-ÜÇÜNCÜ" başlık="Bölge Adliye Mahkemeleri">

      <mvz-madde no="25" başlık="Kuruluş">
        <mvz-fıkra no="1">
          <template>Bölge adliye mahkemeleri, bölgelerin coğrafi durumları ve iş yoğunluğu göz önünde tutularak belirlenen yerlerde, Hâkimler ve Savcılar Yüksek Kurulunun olumlu görüşü alınarak Adalet Bakanlığınca kurulur.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bölge adliye mahkemelerinin yargı çevrelerinin belirlenmesine, değiştirilmesine veya bu mahkemelerin kaldırılmasına Adalet Bakanlığının önerisi üzerine Hâkimler ve Savcılar Yüksek Kurulunca karar verilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Birinci ve ikinci fıkra gereğince alınacak kararlar, Resmî Gazetede yayımlanır.</template>

      <mvz-madde no="26" başlık="Bölge adliye mahkemelerinin oluşumu">

          <template>Bölge adliye mahkemeleri, başkanlık, ceza daireleri başkanlar kurulu, hukuk daireleri başkanlar kurulu, daireler, bölge adliye mahkemesi Cumhuriyet başsavcılığı, bölge adliye mahkemesi adalet komisyonu ve müdürlüklerden oluşur.</template>

          <template>Bölge adliye mahkemesi ceza daireleri başkanlar kurulu ve hukuk daireleri başkanlar kurulu, bölge adliye mahkemesi başkanı ve ilgili dairelerin başkanlarından oluşur.</template>

      <mvz-madde no="30" başlık="Bölge adliye mahkemesi Cumhuriyet başsavcılığı">

          <template>Her bölge adliye mahkemesinde bir Cumhuriyet başsavcılığı bulunur. Bölge adliye mahkemesi Cumhuriyet başsavcılığı, Cumhuriyet başsavcısı, Cumhuriyet başsavcıvekili ve yeteri kadar Cumhuriyet savcısından oluşur.  İş durumunun gerekli kıldığı yerlere birden fazla Cumhuriyet başsavcıvekili atanabilir.</template>

        <mvz-fıkra no="2">

      <mvz-madde no="31" başlık="Bölge adliye mahkemesi adalet komisyonu">

        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Müdürlüklerde çalışanların atama, disiplin ve diğer özlük işlerinde adlî yargı ilk derece mahkemelerinde görevli personelin tâbi oldukları hükümler uygulanır.</template>

          <mvz-bent no="4.">
            <template>Hukukî veya fiilî nedenlerle bir dairenin kendi üyeleri ile toplanamadığı hâllerde ilgisine göre diğer dairelerden kıdem ve sıraya göre üye görevlendirmek,</template>

            <template>Hükme bağlanan işlerde adlî yargı ilk derece mahkeme hâkim ve savcılarına verilen not fişlerini mercilerine göndermek,</template>

          </mvz-bent>
          <mvz-bent no="3.">
            <template>Re'sen veya bölge adliye mahkemesinin ilgili hukuk veya ceza dairesinin ya da Cumhuriyet başsavcısının, Hukuk Muhakemeleri Kanunu veya Ceza Muhakemesi Kanununa göre istinaf yoluna başvurma hakkı bulunanların, benzer olaylarda bölge adliye mahkemesi hukuk veya ceza dairelerince verilen kesin nitelikteki kararlar arasında ya da bu mahkeme ile başka bir bölge adliye mahkemesi hukuk veya ceza dairelerince verilen kesin nitelikteki kararlar arasında uyuşmazlık bulunması hâlinde bu uyuşmazlığın giderilmesini gerekçeli olarak istemeleri üzerine, kendi görüşlerini de ekleyerek Yargıtaydan bu konuda bir karar verilmesini istemek,</template>

        </mvz-fıkra>
        <mvz-fıkra no="3">

        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Gelen işlerin yoğunluğu ve niteliği dikkate alınarak bölge adliye mahkemeleri ceza ve hukuk daireleri arasındaki iş bölümü, Hâkimler ve Savcılar Kurulu tarafından belirlenir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="35/A" başlık="Hukuk daireleri iş bölümü incelemesi">
        <mvz-fıkra no="1">

        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Gönderme kararı üzerine dosya kendisine gelen hukuk dairesi, iki hafta içinde yapacağı ön inceleme sonucunda görevli olmadığı kanaatine varırsa, varsa geçici hukuki koruma tedbirlerine dair talepler hakkında da karar vermek suretiyle dosyayı hukuk daireleri başkanlar kuruluna gönderir. İki haftalık sürenin bitiminden sonra gönderme kararı verilemez. Kurul tarafından yapılan ön inceleme sonunda verilen iş bölümüne ilişkin karar kesindir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="36" başlık="Hukuk dairelerinin görevleri">

          </mvz-bent>
          <mvz-bent no="3.">
            <template>Yargı çevresi içerisinde bulunan adlî yargı ilk derece hukuk mahkemeleri arasındaki yetki ve görev uyuşmazlıklarını çözmek,</template>
          </mvz-bent>
          <mvz-bent no="4.">

          </mvz-bent>
          <mvz-bent no="5.">
            <template>Kanunlarla verilen diğer görevleri yapmak.</template>

    <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Nitelik ve Atama">
      <mvz-madde no="43" başlık="Bölge adliye mahkemesi başkanı, daire başkanları ve üyelerin nitelikleri ve atanmaları">
        <mvz-fıkra no="1">
          <template>Bölge adliye mahkemesi başkanı ve daire başkanları birinci sınıf olup, birinci sınıfa ayrılmayı gerektiren nitelikleri yitirmemiş; daire üyeleri ise en az birinci sınıfa ayrılmış olup, birinci sınıfa ayrılmayı gerektiren nitelikleri yitirmemiş adli yargı hâkim ve savcıları arasından Hâkimler ve Savcılar Yüksek Kurulunca atanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="44" başlık="Cumhuriyet başsavcısı, başsavcıvekili ve savcılarının nitelikleri ve atanmaları">
        <mvz-fıkra no="1">
          <template>Bölge adliye mahkemesi Cumhuriyet başsavcıları ve Cumhuriyet başsavcıvekilleri birinci sınıf olup, birinci sınıfa ayrılmayı gerektiren nitelikleri yitirmemiş; Cumhuriyet savcıları ise hâkimlik ve savcılık mesleğinde fiilen en az sekiz yıl görev yapmış ve üstün başarısı ile bölge adliye mahkemesinde yararlı olacağı anlaşılmış bulunan adli yargı hâkim ve savcıları arasından Hâkimler ve Savcılar Yüksek Kurulunca atanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="45" başlık="İstek üzerine atama">
        <mvz-fıkra no="1">
          <template>Yargıtay daire başkanı ve üyeleri, istekleri üzerine Hâkimler ve Savcılar Yüksek Kurulunca bölge adliye mahkemesi başkanlığına, daire başkanlıklarına veya Cumhuriyet başsavcılığına dört yıllığına atanabilirler. Başka bir bölge adliye mahkemesine yapılacak atamalarda da aynı usul uygulanır. Bu şekilde atananların; Yargıtay üyeliği sıfatı, kadrosu, aylık ve ödeneği ile her türlü özlük hakları korunur; aylık ve ödenekleri ile her türlü mali ve sosyal haklarının Yargıtay bütçesinden ödenmesine devam olunur; disiplin ve ceza soruşturma ve kovuşturmaları Yargıtay üyeleri hakkındaki hükümlere tabidir; bu görevde geçirdikleri süre Yargıtay üyeliğinde geçmiş sayılır. Bu kişiler; Yargıtay üyeleri tarafından Yargıtayda yapılan iş ve işlemlere katılamazlar; Hâkimler ve Savcılar Yüksek Kurulu üyeliği seçimleri hariç Yargıtaydaki seçimlerde aday olamaz ve oy kullanamazlar; istekleri üzerine Yargıtaydaki görevlerine geri dönerler.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Adlî yargı hâkim sınıfından olan Adalet Bakanlığı yüksek müşavirleri, müsteşar yardımcıları, Teftiş Kurulu Başkanı ve genel müdürleri, bağımsız daire başkanları istekleri üzerine Hâkimler ve Savcılar Yüksek Kurulunca bölge adliye mahkemesi başkanlığına, daire başkanlıklarına veya Cumhuriyet başsavcılığına atanabilirler.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>
    <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Ortak Hükümler">
      <mvz-madde no="46" başlık="Toplantı ve karar">
        <mvz-fıkra no="1">
          <template>Her daire, bir başkan ve iki üyenin katılmasıyla toplanır. Görüşmeler gizli yapılır, kararlar çoğunlukla verilir.  İş yoğunluğu dikkate alınarak, üye sayısının yeterli olması hâlinde dairelerde birden fazla heyet oluşturulabilir. Oluşturulan diğer heyetlere, Hâkimler ve Savcılar Kurulunun belirleyeceği üye başkanlık eder.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Hukukî veya fiilî nedenlerle bir daire toplanamazsa, bölge adliye mahkemesi başkanının kararıyla diğer dairelerden, bu da mümkün olmazsa, Hâkimler ve Savcılar Yüksek Kurulunca diğer bölge adliye mahkemelerinden yetkili olarak görevlendirilen üyelerle eksiklik tamamlanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Daire başkanının hukukî veya fiilî nedenlerle bulunamaması halinde dairenin en kıdemli üyesi daireye başkanlık yapar.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="47" başlık="Soruşturma ve kovuşturma usulü">
        <mvz-fıkra no="1">
          <template>Bölge adliye mahkemesi başkanı, daire başkanları, üyeleri, Cumhuriyet başsavcısı ve Cumhuriyet savcılarının görevden doğan veya görev sırasında işlenen suçları ile şahsî suçlarından, sıfat ve görevleri gereklerine uymayan tutum ve davranışlarından dolayı haklarında yapılacak soruşturma ve kovuşturmalarda özel kanunlarında yazılı hükümler uygulanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Şu kadar ki, bunların görevden doğan veya görev sırasında işledikleri suçlar nedeniyle soruşturma ve kovuşturma mercii olarak kanunda yazılı ağır ceza mahkemesi ile bu mahkeme nezdindeki Cumhuriyet başsavcısına verilen görevler, en yakın bölge adliye mahkemesi ceza dairesinin suç türüne göre görevli ceza dairesi ile bu mahkeme nezdindeki Cumhuriyet başsavcısı tarafından yerine getirilir. Kovuşturma mercii Yargıtayın görevli ceza dairesidir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Bölge adliye mahkemesi başkanı, daire başkanları, üyeleri, Cumhuriyet başsavcısı ve Cumhuriyet savcılarının şahsî suçları hakkında genel hükümlere göre yapılacak soruşturma ve kovuşturma görevi, en yakın bölge adliye mahkemesi Cumhuriyet başsavcısı ile bu bölge adliye mahkemesi ceza dairesinin suç türüne göre görevli ceza dairesine aittir.  Daire kararlarına karşı 4/12/2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanununun 272 nci maddesinde yer alan hükümler çerçevesinde temyiz başvurusu yapılabilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="4">
          <template>Soruşturma aşamasında hâkim kararı gerektiren işlemlere dair Cumhuriyet başsavcılığının talepleri ile kovuşturmaya yer olmadığına dair kararlara yapılan itirazlar hakkında, soruşturma konusu suçların en ağırına bakmakla görevli bölge adliye mahkemesi ceza dairesini numara itibarıyla izleyen ceza dairesi başkanı tarafından karar verilir. Suçun son numaralı ceza dairesinin görevine girmesi halinde talebi inceleme yetkisi birinci ceza dairesi başkanına aittir. Hâkim kararı gerektiren işlemlerde başkanın verdiği kararlara karşı yapılan itirazı, numara itibarıyla izleyen ceza dairesi başkanı inceler. Son numaralı daire başkanının kararı, birinci ceza dairesi başkanı tarafından incelenir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="5">
          <template>Bölge adliye mahkemesi Cumhuriyet savcıları ile ceza dairelerinin idarî yaptırım kararı verme yetkisi bakımından 30/3/2005 tarihli ve 5326 sayılı Kabahatler Kanununun 22 ila 31 inci maddeleri uygulanır. Cumhuriyet savcısının verdiği idarî yaptırım kararlarına karşı bölge adliye mahkemesi ceza dairesine başvurulabilir.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="48" başlık="Denetleme">
        <mvz-fıkra no="1">
          <template>Bölge adliye mahkemeleri ve bölge adliye mahkemeleri Cumhuriyet başsavcılıkları ile bölge adliye mahkemeleri adalet komisyonlarının denetimleri, ilgisine göre Hâkimler ve Savcılar Yüksek Kurulu başmüfettişleri veya adalet başmüfettişlerince yapılır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-bölüm>

    <mvz-madde no="53" başlık="">

    <mvz-madde no="54" başlık="Kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>8.4.1924 tarihli ve 469 sayılı Mehakimi Şer'iyenin İlgasına ve Mehakimin Teşkilatına Ait Ahkâmı Muaddil Kanun, 11 Nisan 1329 tarihli Sulh Hâkimleri Hakkında Kanunu Muvakkat, 26.4.1926 tarihli ve 825 sayılı Ceza Kanununun Mevkii Mer'iyete Vaz'ına Müteallik Kanunun 25, 26, 27, 28 ve 29 uncu maddeleri yürürlükten kaldırılmıştır.</template>

    </mvz-madde>
    <mvz-madde no="1" başlık="Yargı çevresinin değişmesi" tür="Ek">
      <mvz-fıkra no="1">
        <template>Bölge adliye mahkemelerinin yargı çevresinin 25 inci madde uyarınca değişmesi halinde, bu değişikliğin uygulanması için Resmî Gazetede belirlenen tarihten önce ilk derece mahkemelerince verilen kararların istinaf incelemesinde, karar tarihi itibarıyla yetkili bölge adliye mahkemelerince yargı çevresinin değiştiği gerekçesiyle yetkisizlik kararı verilemez. Yargı çevresinin değiştirilmesinden önce istinaf incelemesinden geçen dosyalar, yeniden istinaf incelemesine konu edilmesi halinde de ilk incelemeyi yapan bölge adliye mahkemesince sonuçlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bölge adliye mahkemelerinin yargı çevresinin 25 inci madde uyarınca değişmesi halinde, bu değişikliğin uygulanması için Resmî Gazetede belirlenen tarihten önce bölge adliye mahkemeleri Cumhuriyet başsavcılığınca açılan soruşturmalar ile bölge adliye mahkemelerinde yürütülmekte olan kovuşturmalarda yargı çevresinin değiştiği gerekçesiyle yetkisizlik kararı verilemez. Soruşturma neticesinde açılacak kamu davaları da aynı yer bölge adliye mahkemesinde görülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihte görüşülmekte olan dava ve işlerde mahkemelerin görevinde bir değişikliğin söz konusu olduğu hallerde, üst görevli mahkemeler yargılamaya devam ederler, alt görevli mahkemeler görevsizlik kararı vererek dosyayı üst görevli mahkemeye gönderirler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Adalet Bakanlığı, bu Kanunun yürürlüğe girdiği tarihten itibaren en geç iki yıl içinde 25 inci maddede öngörülen bölge adliye mahkemelerini kurar. Bölge adliye mahkemelerinin kuruluşları, yargı çevreleri ve tüm yurtta göreve başlayacakları tarih, Resmî Gazetede ilân edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bölge adliye mahkemeleri göreve başlamadan önce Hâkimler ve Savcılar Yüksek Kurulunca bu mahkemelerin başkanları, daire başkanları ve üyeleri ile Cumhuriyet başsavcısı ve savcılarının atamaları yapılır. Bölge adliye mahkemelerinde görev yapacak diğer personelin atamaları da aynı süre içinde yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarihten başlayarak en geç iki yıl içinde bölge adliye mahkemeleri için ihtiyaç duyulan bina, araç ve gereçler, yapım, satın alma veya kiralama yoluyla sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurulacak mahkemelerin ihtiyaçlarını karşılamak amacı ile, Adalet Bakanlığı bütçesi içinde mevcut veya yeniden açılacak tertiplere Maliye Bakanlığı bütçesinin ilgili tertiplerinden aktarma ve bununla ilgili diğer işlemleri yapmaya Maliye Bakanlığı yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
