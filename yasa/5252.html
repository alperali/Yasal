  <mvz-künye tür="kanun" no="5252" başlık="TÜRK CEZA KANUNUNUN YÜRÜRLÜK VE UYGULAMA ŞEKLİ HAKKINDA KANUN"
             tarih="4/11/2004" rgazete-tarih="13/11/2004" rgazete-sayı="25642"
             düstur-tertip="5" düstur-cilt="44" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, 26.9.2004 tarihli ve 5237 sayılı Türk Ceza Kanununun yürürlüğe konulmasına ilişkin usul ve esasları belirlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, diğer kanunlarda, yürürlükten kaldırılan 1.3.1926 tarihli ve 765 sayılı Türk Ceza Kanununa yapılan yollamaları, 5237 sayılı Türk Ceza Kanununun yürürlüğe girmesiyle yürürlükten kaldırılan hükümleri ve 5237 sayılı Türk Ceza Kanununun uygulanması için diğer kanunlarda yapılan değişiklikleri, yürürlüğe girmesinden önce işlenmiş suçlar hakkında ne suretle hüküm kurulacağına ve kesinleşmiş cezaların nasıl infaz edileceğine ilişkin hükümleri kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Uyum Hükümleri">
    <mvz-madde no="3" başlık="Yollamalar">
      <mvz-fıkra no="1">
        <template>Mevzuatta, yürürlükten kaldırılan Türk Ceza Kanununa yapılan yollamalar, 5237 sayılı Türk Ceza Kanununda bu hükümlerin karşılığını oluşturan maddelere yapılmış sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mevzuatta, yürürlükten kaldırılmış Türk Ceza Kanununun kitap, bab ve fasıllarına yapılmış olan yollamalar, o kitap, bab ve fasıl içinde yer almış hükümlerin karşılığını oluşturan 5237 sayılı Türk Ceza Kanununun maddelerine yapılmış sayılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Diğer kanunlardaki para cezalarının artırılması ve usulü">
      <mvz-fıkra no="1">
        <template>5237 sayılı Türk Ceza Kanununun dışındaki kanunlarda yer alan para cezalarından nispî nitelikteki vergi ve resim cezaları, nispî para cezaları ve tazminat kabilinden değişen orana bağlı bulunan para cezaları hariç olmak üzere, kanun ve yönetmeliklerde  gösterilmiş bulunan para cezalarından (idarî ve disiplin para cezaları dahil);</template>
        <mvz-bent no="a">
          <template>Türkiye Büyük Millet Meclisinin ilk kurulduğu tarihten önce yürürlüğe girmiş bulunan bütün kanun ve tüzüklerde yazılı olup da, daha sonraki tarihlerde Türkiye Büyük Millet Meclisince miktarına dokunulmamış para cezaları yüzkırkikibinsekizyüzaltmış katına,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Türkiye Büyük Millet Meclisi tarafından kabul olunup da;</template>
          <mvz-altbent no="1">
            <template>31.12.1939 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları seksenbeşbinyediyüzonbeş katına,</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>1.1.1940 tarihinden 31.12.1945 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları elliyedibinyüzkırkbeş katına,</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>1.1.1946 tarihinden 31.12.1959 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları yirmisekizbinbeşyüzyetmiş katına,</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>1.1.1960 tarihinden 31.12.1970 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları ondörtbinikiyüzseksenbeş katına,</template>
          </mvz-altbent>
          <mvz-altbent no="5">
            <template>1.1.1971 tarihinden 31.12.1977 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları sekizbinbeşyüzyetmiş katına,</template>
          </mvz-altbent>
          <mvz-altbent no="6">
            <template>1.1.1978 tarihinden 31.12.1980 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları ikibinsekizyüzaltmış katına,</template>
          </mvz-altbent>
          <mvz-altbent no="7">
            <template>1.1.1981 tarihinden 31.12.1987 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları bindörtyüzotuz katına,</template>
          </mvz-altbent>
          <mvz-altbent no="8">
            <template>1.1.1988 tarihinden 31.12.1993 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları kırkdört katına,</template>
          </mvz-altbent>
          <mvz-altbent no="9">
            <template>17.10.1996 tarihli ve 4199 sayılı, 21.5.1997 tarihli ve 4262 sayılı kanunlarla değişik 2918 sayılı Karayolları Trafik Kanunu istisna olmak üzere, 1.1.1994 tarihinden 31.12.1998 tarihine kadar yürürlüğe girmiş kanunlardaki para cezaları yirmidokuz katına,</template>
          </mvz-altbent>
          <mvz-altbent no="10">
            <template>1.1.1999 tarihinden 31.12.1999 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları beş katına,</template>
          </mvz-altbent>
          <mvz-altbent no="11">
            <template>1.1.2000 tarihinden 31.12.2000 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları dört katına,</template>
          </mvz-altbent>
          <mvz-altbent no="12">
            <template>1.1.2001 tarihinden 31.12.2001 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları üç katına,</template>
          </mvz-altbent>
          <mvz-altbent no="13">
            <template>1.1.2002 tarihinden 31.12.2002 tarihine kadar yürürlüğe girmiş bulunan kanunlardaki para cezaları iki katına,</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="0">
          <template>Çıkarılmıştır.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Ağır para cezasının dönüştürülmesi">
      <mvz-fıkra no="1">
        <template>kanunlarda öngörülen "ağır para" cezaları, "adli para" cezasına dönüştürülmüştür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu kanunlarda Türk Ceza Kanununda belirlenen cezalar sistemine uygun değişiklik yapılıncaya kadar,  alt veya üst sınırlar arasında uygulama yapılmasını gerektirir nitelikteki adli para cezalarında cezanın alt sınırı ikibinbeşyüz, üst sınırı beşyüzbin Türk Lirası olarak uygulanır. Bu fıkra hükümleri, nispî nitelikteki adli para cezaları hakkında uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Ağır para cezasından dönüştürülen adlî para cezasının ödenmemesi halinde, 13.12.2004 tarihli ve 5275 sayılı Ceza ve Güvenlik Tedbirlerinin İnfazı Hakkında Kanunun 106 ncı maddesi hükümlerine göre hapis süresinin belirlenmesinde bir gün karşılığı olarak beşyüz Türk Lirası esas alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Ağır hapis cezasının dönüştürülmesi">
      <mvz-fıkra no="1">
        <template>Kanunlarda öngörülen "ağır hapis" cezaları, "hapis" cezasına dönüştürülmüştür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>1 Haziran 2005 tarihinden önce yürürlüğe girmiş kanunlarda;</template>
        <mvz-bent no="a">
          <template>Ağır hapis iken, birinci fıkra uyarınca hapse dönüştürülen cezalar, kanunlarında aksine bir hüküm yoksa alt sınır bir yıl, üst sınır yirmidört yıl olarak,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Hapis cezalarında kanunlarında aksine bir hüküm yoksa alt sınır bir ay, üst sınır beş yıl olarak,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Hafif hapis ve hafif para cezalarının idari para cezasına dönüştürülmesi">
      <mvz-fıkra no="1">
        <template>Kanunlarda, "hafif hapis" veya "hafif para" cezası olarak öngörülen yaptırımlar, idari para cezasına dönüştürülmüştür. İdari para cezasının hesaplanmasında 5237 sayılı Türk Ceza Kanununun 52 nci maddesi hükümleri uygulanır. İlgili kanunda "hafif hapis" cezasının üst sınırının belirtilmediği hallerde, idari para cezasının hesaplanmasında esas alınacak gün sayısının üst sınırı, yediyüzotuzdur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kanunlarda, "hafif hapis cezası" ile "hafif para cezası"nın seçimlik olarak veya birlikte öngörüldüğü hallerde, idari para cezası yaptırımının belirlenmesinde "hafif hapis cezası" esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kanunlarda, sadece "hafif para cezası"nın öngörüldüğü ve cezanın alt veya üst sınırının belirtilmediği hallerde, idari para cezası, yüzyirmimilyon Türk Lirasından az, onsekizmilyar Türk Lirasından fazla olamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu madde hükmüne göre idari para cezasına karar vermeye mülki amir yetkilidir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Yeni Türk Lirasının kullanılması">
      <mvz-fıkra no="1">
        <template>Türk Ceza Kanununda geçen "Türk Lirası" ibaresi karşılığında, uygulamada, 28.1.2004 tarihli ve 5083 sayılı Türkiye Cumhuriyeti Devletinin Para Birimi Hakkında Kanun hükümlerine göre ülkede tedavülde bulunan para "Yeni Türk Lirası" olarak adlandırıldığı sürece, bu ibare kullanılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Lehe olan hükümlerin uygulanmasında usul">
      <mvz-fıkra no="1">
        <template>1 Haziran 2005 tarihinden önce kesinleşmiş hükümlerle ilgili olarak, Türk Ceza Kanununun lehe olan hükümlerinin derhal uygulanabileceği hallerde, duruşma yapılmaksızın da karar verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkra hükmü, 1 Haziran 2005 tarihinden önce verilip de Yargıtay tarafından lehe olan hükümlerin uygulanması hususunda değerlendirme yapılması gerektiği gerekçesiyle bozularak mahkemesine gönderilen hükümler hakkında da uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Lehe olan hüküm, önceki ve sonraki kanunların ilgili bütün hükümleri olaya uygulanarak, ortaya çıkan sonuçların birbirleriyle karşılaştırılması suretiyle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kesin hükümle sonuçlanmış olan davalarda, sonradan yürürlüğe giren bir kanunla ilgili olarak lehe hükmün belirlenmesi ve uygulanması amacıyla yapılan yargılama bakımından dava zamanaşımına ilişkin hükümler uygulanmaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="İnfazın ertelenmesi veya durdurulması">
      <mvz-fıkra no="1">
        <template>1 Haziran 2005 tarihinden önce kesinleşmiş olan mahkûmiyet kararları hakkında bu Kanunun lehe olan hükümleri öncelikle dikkate alınarak, 4.4.1929 tarihli ve 1412 sayılı Ceza Muhakemeleri Usulü Kanununun 402 nci maddesi uyarınca infazın ertelenmesine veya durdurulmasına karar verilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Değiştirilen ve Yürürlükten Kaldırılan Hükümler">
    <mvz-madde no="11" başlık="">
      <mvz-fıkra no="1">
        <template>7.11.1979 tarihli ve 2253 sayılı Çocuk Mahkemelerinin Kuruluşu, Görev ve Yargılama Usulleri Hakkında Kanunun çeşitli maddelerinde geçen "11 yaş" deyimi "12 yaş" olarak değiştirilmiştir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girdiği tarih itibarıyla,</template>
        <mvz-bent no="a">
          <template>26.4.1926 tarihli ve 825 sayılı Ceza Kanununun Mevkii Mer'iyete Vaz'ına Müteallik Kanun,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>1.3.1926 tarihli ve 765 sayılı Türk Ceza Kanunu bütün ek ve değişiklikleri ile birlikte,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Diğer kanunların, 5237 sayılı Türk Ceza Kanununun Birinci Kitabında yer alan düzenlemelere aykırı hükümleri, ilgili kanunlarda gerekli değişiklikler yapılıncaya ve en geç 31 Aralık 2008 tarihine kadar uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanunun,</template>
        <mvz-bent no="a">
          <template>"İnfazın ertelenmesi veya durdurulması" başlıklı 10 uncu maddesi hükmü yayımı tarihinde,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Diğer hükümleri 1 Haziran 2005 tarihinde,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
