  <mvz-künye tür="kanun" no="2923" başlık="YABANCI DİL EĞİTİMİ VE ÖĞRETİMİ İLE TÜRK VATANDAŞLARININ FARKLI DİL VE LEHÇELERİNİN ÖĞRENİLMESİ HAKKINDA KANUN"
             tarih="14/10/1983" rgazete-tarih="19/10/1983" rgazete-sayı="18196"
             düstur-tertip="5" düstur-cilt="22" düstur-sayfa="758" />

  <mvz-madde no="1" başlık="Amaç">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, eğitim ve öğretim kurumlarında okutulacak yabancı diller, yabancı dille eğitim ve öğretim yapan okullar ile Türk vatandaşlarının günlük yaşamlarında geleneksel olarak kullandıkları farklı dil ve lehçelerin öğreniminin tâbi olacağı esasları düzenlemektir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Esaslar">
    <mvz-fıkra no="1">
      <template>Milletlerarası andlaşma hükümleri saklı olmak üzere, resmi ve özel her derece ve türdeki örgün ve yaygın eğitim kurumlarında okutulacak yabancı dillerin ve yabancı dille eğitim ve öğretim yapan okulların tabi olacağı esaslar şunlardır:</template>
      <mvz-bent no="a">
        <template>Eğitim ve öğretim kurumlarında, Türk vatandaşlarına Türkçeden başka hiçbir dil, ana dilleri olarak okutulamaz ve öğretilemez. Ancak, Türk vatandaşlarının günlük yaşamlarında geleneksel olarak kullandıkları farklı dil ve lehçelerin öğrenilmesi için,  Özel Öğretim Kurumları Kanunu hükümlerine tâbi olmak üzere özel kurslar açılabilir; bu kurslarda ve diğer dil kurslarında aynı maksatla dil dersleri oluşturulabilir. Bu kurslar ve derslerde, Cumhuriyetin Anayasada belirtilen temel niteliklerine, Devletin ülkesi ve milletiyle bölünmez bütünlüğüne aykırı öğretim yapılamaz. Bu kursların ve derslerin açılmasına ve denetimine ilişkin esas ve usuller, Millî Eğitim Bakanlığınca çıkarılacak yönetmelikle düzenlenir.  Ayrıca, Özel Öğretim Kurumları Kanunu hükümlerine tabi olmak üzere, Türk vatandaşlarının günlük yaşamlarında geleneksel olarak kullandıkları farklı dil ve lehçelerle eğitim ve öğretim yapmak amacıyla, özel okul açılabilir. Bu kurumlarda eğitimi ve öğretimi yapılacak dil ve lehçeler Cumhurbaşkanı kararıyla tespit edilir. Bu kurumların açılmasına ve denetimine ilişkin esas ve usuller, Millî Eğitim Bakanlığınca çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>İlköğretim, ortaöğretim ve yaygın eğitim kurumlarında, Atatürkçü düşünce, Atatürk ilke ve inkılaplarını konu olarak alan Türkiye Cumhuriyeti İnkılap Tarihi ve Atatürkçülük, Türk Dili ve Edebiyatı, Tarih, Coğrafya, Sosyal Bilgiler, Din Kültürü ve Ahlak Bilgisi dersleri ve Türk Kültürüyle ilgili diğer dersler; yabancı dille okutulamaz ve öğretilemez. Öğrencilere, eğitim ve öğretimleri süresince bu derslerle ilgili araştırma görevleri ve ödevler, Türkçeden başka hiçbir dille yaptırılamaz.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Türkiye'de eğitimi ve öğretimi yapılacak yabancı diller, Cumhurbaşkanı kararıyla tespit edilir.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>İlköğretim, ortöğretim ve yaygın eğitim kurumlarında yabancı dille eğitim ve öğretimi yapılacak dersler ile okullar Milli Eğitim Bakanlığınca; yükseköğretim kurumlarında yabancı dille eğitimi ve öğretim yapılacak dersler ile yabancı dille eğitim ve öğretim yapacak yükseköğretim kurumları Yükseköğretim Kurulunca belirlenir.</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Yabancı dilde okutulacak derslerin eğitim ve öğretim programlarının tabi olacağı esaslar; ilköğretim, ortaöğretim ve yaygın eğitim kurumları, için Milli Eğitim Bakanlığınca, yükseköğretim kurumları için Yükseköğretim Kurulunca tespit edilir.</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Yabancı dil eğitim ve öğretimiyle ilgili uygulamaların Türk Milli eğitiminin amaçlarına, temel ve ana ilkelerine ve bu Kanundaki esaslara uygunluğu; ilköğretim, ortaöğretim ve yaygın eğitim kurumlarında Milli Eğitim Bakanlığınca; yükseköğretim kurumlarında Yükseköğretim Kurulunca denetlenir.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Yönetmelik">
    <mvz-fıkra no="1">
      <template>Yabancı dil eğitimi ve öğretiminin amaç, program, yöntem ve uygulamalarıyla, yabancı dille eğitim öğretim yapan kurumların tabi olacağı esasları kapsayan; ilkoğretim, ortaöğretim ve yaygın eğitim kurumlarıyla ilgili yönetmelik, Milli Eğitim Bakanlığınca; yükseköğretim kurumlarıyla ilgili yönetmelik, Yükseköğretim Kurulunca, bu Kanunun yürürlüğe girdiği tarihten itibaren altı ay içerisinde çıkartılır ve Resmi Gazetede yayımlanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Yürürlük">
    <mvz-fıkra no="1">
      <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Yürütme">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
