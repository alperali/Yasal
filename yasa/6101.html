<mvz-künye tür="kanun" no="6101" başlık="TÜRK BORÇLAR KANUNUNUN YÜRÜRLÜĞÜ VE UYGULAMA ŞEKLİ HAKKINDA KANUN"
             tarih="12/1/2011" rgazete-tarih="4/2/2011" rgazete-sayı="27836"
             düstur-tertip="5" düstur-cilt="50" />

  <mvz-bölüm no="1-BİRİNCİ" başlık="Genel Hükümler">
    <mvz-b1 no="A" başlık="Geçmişe etkili olmama kuralı">
      <mvz-madde no="1" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Borçlar Kanununun yürürlüğe girdiği tarihten önceki fiil ve işlemlere, bunların hukuken bağlayıcı olup olmadıklarına ve sonuçlarına, bu fiil ve işlemler hangi kanun yürürlükte iken gerçekleşmişse, kural olarak o kanun hükümleri uygulanır. Ancak, Türk Borçlar Kanununun yürürlüğe girmesinden sonra bu fiil ve işlemlere ilişkin olarak gerçekleşecek temerrüt, sona erme ve tasfiye, Türk Borçlar Kanunu hükümlerine tabidir.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Geçmişe etkili olma">
      <mvz-b2 no="I" başlık="Kamu düzeni ve genel ahlâk">
        <mvz-madde no="2" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Borçlar Kanununun kamu düzenine ve genel ahlâka ilişkin kuralları, gerçekleştikleri tarihe bakılmaksızın, bütün fiil ve işlemlere uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="İçeriği kanunla belirlenen işlem ve ilişkiler">
        <mvz-madde no="3" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Borçlar Kanunu hükümleri, yürürlüğe girdiği tarihten başlayarak, daha önce gerçekleşmiş olsalar bile, içerikleri tarafların iradeleri gözetilmeksizin doğrudan doğruya kanunla belirlenmiş işlem ve ilişkilere uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="III" başlık="Kazanılmamış haklar">
        <mvz-madde no="4" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Borçlar Kanununun yürürlüğe girmesinden önce gerçekleşmiş olup da, Türk Borçlar Kanununun yürürlüğe girdiği sırada henüz herhangi bir hak doğurmamış fiil ve işlemlere, Türk Borçlar Kanunu hükümleri uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Süreler">
      <mvz-b2 no="I" başlık="Hak düşürücü süreler ve zamanaşımı süreleri">
        <mvz-madde no="5" başlık="">
          <mvz-fıkra no="1">
            <template>Türk Borçlar Kanununun yürürlüğe girmesinden önce işlemeye başlamış bulunan hak düşürücü süreler ile zamanaşımı süreleri, eski kanun hükümlerine tabi olmaya devam eder. Ancak, bu sürelerin henüz dolmamış kısmı, Türk Borçlar Kanununda öngörülen süreden uzun ise, yürürlüğünden başlayarak Türk Borçlar Kanununda öngörülen sürenin geçmesiyle, hak düşürücü süre veya zamanaşımı süresi dolmuş olur.</template>
          </mvz-fıkra>
          <mvz-fıkra no="2">
            <template>Türk Borçlar Kanunu ile hak düşürücü süre veya özel bir zamanaşımı süresi ilk defa öngörülmüş olup da başlangıç tarihi itibarıyla bu süre dolmuşsa, hak sahipleri Türk Borçlar Kanununun yürürlüğe girdiği tarihten başlayarak bir yıllık ek süreden yararlanırlar. Ancak, bu ek süre, Türk Borçlar Kanununda öngörülen süreden daha uzun olamaz.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
      <mvz-b2 no="II" başlık="Diğer süreler">
        <mvz-madde no="6" başlık="">
          <mvz-fıkra no="1">
            <template>Bu Kanunun 5 inci maddesi, uygun düştüğü ölçüde, Türk Borçlar Kanununda öngörülen diğer süreler hakkında da uygulanır.</template>
          </mvz-fıkra>
        </mvz-madde>
      </mvz-b2>
    </mvz-b1>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Diğer Hükümler">
    <mvz-b1 no="A" başlık="Görülmekte olan davalara ilişkin uygulama">
      <mvz-madde no="7" başlık="">
        <mvz-fıkra no="1">
          <template>Türk Borçlar Kanununun kamu düzenine ve genel ahlâka ilişkin kuralları ile geçici ödemelere ilişkin 76 ncı, faize ilişkin 88 inci, temerrüt faizine ilişkin 120 nci ve aşırı ifa güçlüğüne ilişkin 138 inci maddesi, görülmekte olan davalarda da uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="B" başlık="Yollamalar">
      <mvz-madde no="8" başlık="">
        <mvz-fıkra no="1">
          <template>Diğer mevzuatta, bu Kanun veya Türk Borçlar Kanunuyla yürürlükten kaldırılmış ya da değiştirilmiş bulunan kanunların maddelerine yapılan yollamalar, o maddeleri karşılayan yeni hükümlere yapılmış sayılır. Bununla birlikte, bu Kanunun 1 inci maddesinin hükümleri saklıdır.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
    <mvz-b1 no="C" başlık="Genel nitelikli hükümler">
      <mvz-madde no="9" başlık="">
        <mvz-fıkra no="1">
          <template>Bu Kanunda hüküm bulunmayan hâllerde, 3/12/2001 tarihli ve 4722 sayılı Türk Medenî Kanununun Yürürlüğü ve Uygulama Şekli Hakkında Kanun hükümleri, uygun düştüğü ölçüde uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="Yürürlükten kaldırılan kanun">
        <mvz-fıkra no="1">
          <template>18/5/1955 tarihli ve 6570 sayılı Gayrimenkul Kiraları Hakkında Kanun yürürlükten kaldırılmıştır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="1" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Bu Kanunla yürürlükten kaldırılan 6570 sayılı Kanunun 12 nci maddesinin üçüncü fıkrası uyarınca açılmış ve henüz karara bağlanmamış olan davaların, sulh hukuk mahkemelerinde; bunlardan temyiz aşamasında bulunanların ise, Yargıtayın ilgili dairesinde, ayrıca bir işlem yapılmasına ve karar verilmesine gerek olmaksızın görülmelerine devam olunur.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="2" başlık="" tür="GEÇİCİ">
        <mvz-fıkra no="1">
          <template>Bu Kanunun 1 inci maddesinin son cümlesi hükmü bir defaya mahsus olmak üzere, bu Kanunun yürürlüğe girmesinden önce Türk Borçlar Kanununun 347 nci maddesinin birinci fıkrasının son cümlesinde öngörülen kira sözleşmelerinden on yıllık uzama süresi dolmamış olmakla birlikte geri kalan süre beş yıldan daha kısa olanlar hakkında, yürürlüğe girdiği tarihten itibaren beş yıl; on yıllık uzama süresi dolmuş olanlar hakkında da yürürlüğe girdiği tarihten itibaren iki yıl sonra uygulanır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="11" başlık="Yürürlük">
        <mvz-fıkra no="1">
          <template>Bu Kanun 1/7/2012 tarihinde yürürlüğe girer.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="12" başlık="Yürütme">
        <mvz-fıkra no="1">
          <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
        </mvz-fıkra>
      </mvz-madde>
    </mvz-b1>
  </mvz-bölüm>
