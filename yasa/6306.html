  <mvz-künye tür="kanun" no="6306" başlık="AFET RİSKİ ALTINDAKİ ALANLARIN DÖNÜŞTÜRÜLMESİ HAKKINDA KANUN"
             tarih="16/5/2012" rgazete-tarih="31/5/2012" rgazete-sayı="28309"

  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; afet riski altındaki alanlar ile bu alanlar dışındaki riskli yapıların bulunduğu arsa ve arazilerde, fen ve sanat norm ve standartlarına uygun, sağlıklı ve güvenli yaşama çevrelerini teşkil etmek üzere iyileştirme, tasfiye ve yenilemelere dair usul ve esasları belirlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Bakanlık: Çevre, Şehircilik ve İklim Değişikliği Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>İdare: Belediye ve mücavir alan sınırları içinde belediyeleri, bu sınırlar dışında il özel idarelerini, büyükşehirlerde büyükşehir belediyelerini ve Bakanlık tarafından yetkilendirilmesi hâlinde büyükşehir belediyesi sınırları içindeki ilçe belediyelerini,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Rezerv yapı alanı: Bu Kanun uyarınca gerçekleştirilecek uygulamalarda  kullanılmak üzere, TOKİ’nin veya İdarenin talebine bağlı olarak veya resen Bakanlıkça belirlenen alanları,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Riskli alan: Zemin yapısı veya üzerindeki yapılaşma sebebiyle can ve mal kaybına yol açma riski taşıyan, Cumhurbaşkanınca kararlaştırılan alanı,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Riskli yapı: Riskli alan içinde veya dışında olup ekonomik ömrünü tamamlamış olan ya da yıkılma veya ağır hasar görme riski taşıdığı ilmî ve teknik verilere dayanılarak tespit edilen yapıyı,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>TOKİ: Toplu Konut İdaresi Başkanlığını,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Başkanlık: Kentsel Dönüşüm Başkanlığını,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Uygulama">
    <mvz-madde no="3" başlık="Tespit, taşınmaz devri ve tescil">
      <mvz-fıkra no="1">
        <template>Riskli yapıların tespiti, Başkanlıkça hazırlanacak yönetmelikte belirlenen usul ve esaslar çerçevesinde masrafları kendilerine ait olmak üzere, öncelikle yapı malikleri veya kanuni temsilcileri tarafından, Başkanlıkça lisanslandırılan kurum ve kuruluşlara yaptırılır ve sonuç Başkanlığa veya İdareye bildirilir. Başkanlık/İdare riskli yapıların tespitini resen yapabileceği gibi süre vererek maliklerden veya kanuni temsilcilerinden de isteyebilir. Verilen süre içinde maliklerce tespit yaptırılmadığı takdirde, tespitler Başkanlıkça veya İdarece yapılır veya yaptırılır. Başkanlık, belirlediği alanlardaki riskli yapıların tespitini süre vererek İdareden de isteyebilir. Riskli yapı tespiti yapılmasının engellenmesi durumunda; Başkanlıkça/İdarece talep edilmesi halinde, mülki idare amiri tarafından verilecek yazılı izine istinaden yeterli kolluk kuvveti marifetiyle kapalı kapıları/alanları açmak veya açtırmak suretiyle resen tespit yapılır/yaptırılır. Riskli yapı tespitlerine karşı maliklerce veya kanuni temsilcilerince on beş gün içinde itiraz edilebilir. Bu itirazlar, Başkanlığın talebi üzerine, üniversitelerce ilgili meslek disiplini öğretim üyeleri arasından görevlendirilecek dört ve Bakanlıkta/Başkanlıkta görevli üç kişinin iştiraki ile teşkil edilen teknik heyetler tarafından incelenip karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Riskli yapılar, tapu kütüğünün beyanlar hanesinde belirtilmek üzere, tespit tarihinden itibaren en geç on iş günü içinde Başkanlık veya İdare tarafından ilgili tapu müdürlüğüne bildirilir ve ayni ve şahsi hak sahiplerine tebliğ yerine kaim olmak üzere, tespite ilişkin bilgileri ihtiva eden tutanak yapıya asılır, maliklere e-Devlet Kapısı üzerinden bildirilir ve ilgili muhtarlıkta on beş gün süre ile ilan edilir. Riskli yapı tespit işlemi, muhtarlıkta yapılan ilanın son günü ayni ve şahsi hak sahiplerine tebliğ edilmiş sayılır. Riskli yapılar, ayrıca Başkanlığın internet sayfasında on beş gün süre ile ilan edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Başkanlığın talebi üzerine; 28/12/1960 tarihli ve 189 sayılı Millî Savunma Bakanlığı İskân İhtiyaçları İçin Sarfiyat İcrası ve Bu Bakanlıkça Kullanılan Gayrimenkullerden Lüzumu Kalmıyanların Satılmasına Salâhiyet Verilmesi Hakkında Kanun ve 18/12/1981 tarihli ve 2565 sayılı Askeri Yasak Bölgeler ve Güvenlik Bölgeleri Kanunu kapsamında bulunan yerler de dâhil olmak üzere, riskli alanlarda ve rezerv yapı alanlarında olup Hazinenin özel mülkiyetinde bulunan taşınmazlardan;</template>
        <mvz-bent no="a">
          <template>Kamu idarelerine tahsisli olanlar Cumhurbaşkanı kararıyla,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kamu idarelerine tahsisli olmayanlar, ilgili kamu idaresinin görüşü alınarak,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Başkanlığa devredilir veya Başkanlığın talebi üzerine TOKİ’ye ve İdareye bedelsiz olarak devredilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu Kanuna göre uygulamada bulunulan alanlarda yer alan veya Başkanlıkça bu Kanun kapsamında kullanılmak üzere belirlenen tescil dışı alanlar, tapuda Hazine adına tescil edildikten sonra Başkanlığa devredilir veya Başkanlığın talebi üzerine TOKİ’ye ve İdareye bedelsiz olarak devredilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Tahsis ve devir tarihinden itibaren üç yıl içinde ve gerekli görülen hâllerde uzatılan süre içinde maksadına uygun olarak kullanılmadığı Başkanlıkça tespit edilen taşınmazlar, bedelsiz olarak ve resen tapuda Hazine adına tescil edilir veya önceki maliki olan kamu idaresine devredilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>25/2/1998 tarihli ve 4342 sayılı Mera Kanunu kapsamında olup riskli alanlarda ve riskli yapılarda yaşayanların nakledilmesi için Başkanlıkça ihtiyaç duyulan taşınmazlar, 4342 sayılı Kanunun 14 üncü maddesinin birinci fıkrasının (g) bendindeki alanlardan sayılarak, tahsis amaçları aynı maddeye göre değiştirilip tapuda Hazine adına tescil edilir; bu taşınmazlar hakkında bu Kanuna göre uygulamada bulunulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Gerçek veya özel hukuk tüzel kişilerince mülkiyetlerindeki taşınmazların rezerv yapı alanı olarak belirlenmesi talebinde bulunulabilmesi için; bu taşınmazların yapılaşmaya esas arsa metrekaresinin yüzde otuzunun mülkiyetinin devrine muvafakat edilmesi veya aynı miktarın değerinin dönüşüm projeleri özel hesabına gelir olarak kaydedilmek üzere Başkanlığa verilmesi gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Başkanlık, riskli yapı tespiti için lisanslandırılan kurum ve kuruluşların faaliyetlerini denetleyebilir. Mevzuatta öngörülen esaslara uygun olarak görevini yerine getirmeyen lisanslı kurum veya kuruluşlara, işlenen fiil ve hâllerin durumuna göre aşağıdaki idari yaptırımlar uygulanır.</template>
        <mvz-bent no="a">
          <template>Yazılı uyarı cezası verilecek fiiller:</template>
          <mvz-altbent no="1">
            <template>Riskli yapı tespit raporunda teknik yönden tespit edilen eksikliklerin verilen süre içerisinde düzeltilmemesi</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Yapı maliki olmayan birinin talebine istinaden riskli yapı tespiti yapılması</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Daha önce riskli yapı tespitine konu edilmiş bir yapı hakkında ikinci kez riskli yapı tespiti yapılması</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="b">
          <template>15.000 Türk lirası idari para cezası verilecek fiiller:</template>
          <mvz-altbent no="1">
            <template>İki kere yazılı olarak uyarı cezası alınmasından sonra, uyarı cezasını gerektiren başka bir fiilin tespit edilmesi</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Riskli yapı tespitinde yapıya ilişkin verilerin eksik veya yanlış alınarak hesap yapılması neticesinde riskli bir yapının risksiz veya risksiz bir yapının riskli olarak tespit edilmiş olması</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Yapıda teknik inceleme yapılmadan riskli yapı tespit raporu hazırlanması</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Lisans iptali cezası verilecek fiiller:</template>
          <mvz-altbent no="1">
            <template>Lisanslandırma şartlarının kaybedilmesi üzerine verilen süre içerisinde şartların sağlanmaması</template>
          </mvz-altbent>
          <mvz-altbent no="2">
            <template>Lisans başvurusunda gerçeğe aykırı bilgi ve belge sunulduğunun tespit edilmesi</template>
          </mvz-altbent>
          <mvz-altbent no="3">
            <template>Mevcut olmayan bir yapı hakkında riskli yapı tespit raporu hazırlanması</template>
          </mvz-altbent>
          <mvz-altbent no="4">
            <template>Daha önce üç defa idari para cezası alınmış olması</template>
          </mvz-altbent>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Riskli yapı tespiti yapmak üzere lisanslandırılmış olan 29/6/2001 tarihli ve 4708 sayılı Yapı Denetimi Hakkında Kanuna göre Bakanlıktan izin belgesi almış yapı denetim kuruluşları ile laboratuvar kuruluşları, 4708 sayılı Kanuna göre belirli bir süre ile yeni iş almaktan men cezası almaları durumunda aynı süre içerisinde riskli yapı tespiti faaliyetinde de bulunamazlar. Yapı denetim kuruluşları ile laboratuvar kuruluşlarının 4708 sayılı Kanuna göre izin belgelerinin iptal edilerek faaliyetlerine son verilmesi durumunda riskli yapı tespiti lisansları da iptal edilir.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Sekizinci fıkrada öngörülen cezalar, ilgili lisanslı kurum veya kuruluşun savunması alınarak verilir ve yazılı olarak tebliğ edilir. İdari para cezaları, tebliğinden itibaren bir ay içinde ödenir. Süresinde ödenmeyen idari para cezaları, 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre vergi dairelerince takip ve tahsil edilir. İdari para cezasına karşı otuz gün içinde yetkili idare mahkemesine itiraz edilebilir. İtirazlar, zaruret olmayan hâllerde evrak üzerinden incelenerek en kısa süre içinde karara bağlanır. İtiraz üzerine verilen mahkeme kararları kesindir. İdari para cezası her takvim yılı başından geçerli olmak üzere o yıl için 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanununun mükerrer 298 inci maddesi hükümleri uyarınca tespit ve ilân edilen yeniden değerleme oranında artırılarak uygulanır. Bu suretle idari para cezasının hesabında bir Türk lirasının küsuru dikkate alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Lisansı iptal edilen kurum ve kuruluşlar, yeni riskli yapı tespiti işi almamak kaydıyla, daha önce hazırladıkları raporlarda tespit edilen eksiklikleri tamamlayıncaya kadar faaliyetlerine devam edebilirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Lisansı iptal edilen kuruluşun ortakları, bu kuruluştaki hisselerini devretseler dahi beş yıl süre ile başka bir lisanslı kuruluşa ortak olamazlar, bunların kurdukları kuruluşlara lisans verilmez ve riskli yapı tespitinde görev alamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Lisanslı kuruluşlara iki kez sekizinci fıkranın (b) bendinin (2) ve (3) numaralı alt bentleri uyarınca para cezası verilmesine sebep olan mühendisler ile mevcut olmayan bir yapı hakkında riskli yapı tespit raporu hazırlayan mühendisler, üç yıl süre ile başka bir lisanslı kurum ve kuruluşta görev alamaz, başka bir lisanslı kuruluşa ortak olamaz ve bunların kurdukları kuruluşlara lisans verilmez. Bu mühendislerin durumu ilgili meslek odasına bildirilir. Meslek odası, bu mühendisler hakkında kendi mevzuatına göre işlem yaparak neticesini Başkanlığa bildirir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Tasarrufların kısıtlanması">
      <mvz-fıkra no="1">
        <template>Başkanlık veya uygulamayı yürütmesi hâlinde TOKİ veya İdare, riskli alanlarda ve rezerv yapı alanlarında her türlü imar ve yapılaşma işlemlerini iki yıl süre ile geçici olarak durdurabilir. Uygulamanın gerektirmesi hâlinde imar ve yapılaşma işlemlerinin geçici olarak durdurulması bir yıl daha uzatılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>3 üncü maddenin üçüncü fıkrasında belirtilen taşınmazlar,  devir işlemleri sonuçlandırılıncaya kadar satılamaz, kiraya verilemez, tahsis edilemez, ön izne veya irtifak hakkına konu edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Uygulama sırasında Başkanlık, TOKİ veya İdare tarafından talep edilmesi hâlinde, hak sahiplerinin de görüşü alınarak, bu Kanun kapsamında bulunan alanlardaki yapılar ile riskli yapılara elektrik, su ve doğal gaz verilmez ve verilen hizmetler kurum ve kuruluşlar tarafından durdurulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Tahliye ve yıktırma">
      <mvz-fıkra no="1">
        <template>Riskli yapıların yıktırılmasında ve bunların bulunduğu alanlar ile riskli alanlar ve rezerv yapı alanlarındaki uygulamalarda, öncelikli olarak malikler ile anlaşma yoluna gidilmesi esastır.  Anlaşma ile tahliye edilen yapıların maliklerine, kiracılarına ve yapıda ikamet etmek şartıyla sınırlı ayni hak sahiplerine geçici konut veya işyeri tahsisi ya da kira yardımı ve yapım için yardım yapılabilir.  Yapım için yapılacak yardımın usul ve esasları Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Uygulamanın gerektirmesi hâlinde, birinci fıkrada belirtilenler dışında olup Kanun kapsamındaki yapıları kullanmakta olan kişilere de geçici konut veya işyeri tahsisi ya da kira yardımı ve yapım için yardım yapılabilir. Bu kişiler ile yapılacak olan anlaşmanın, bunlara yardım yapılmasının, enkaz bedeli ödenmesinin ve bankalardan kullanacakları kredilere dönüşüm projeleri özel hesabından karşılanmak üzere faiz desteği verilmesinin usul ve esasları Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Riskli yapıların yıktırılması için, bu yapıların maliklerine doksan günden fazla olmamak üzere süre verilir. Bu süre içinde yapı, malik tarafından yıktırılmadığı takdirde, yapının idari makamlarca yıktırılacağı bildirilir. Verilen bu süre içinde de maliklerince yıktırma yoluna gidilmediği takdirde, bu yapıların insandan ve eşyadan tahliyesi ve yıktırma işlemleri, yıktırma masrafı ile gereken diğer yardım ve krediler öncelikle dönüşüm projeleri özel hesabından karşılanmak üzere, mahallî idarelerin de iştiraki ile mülki amirler tarafından yapılır veya yaptırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Üçüncü fıkrada belirtilen usule göre süresinde yıktırılmadığı tespit edilen riskli yapıların yıktırılması, Başkanlıkça yazılı olarak İdareye bildirilir ve bu yapılar, İdarece yıkılır/yıktırılır. Uygulamanın gerektirmesi hâlinde Başkanlık, yukarıdaki fıkralarda belirtilen tespit, tahliye ve yıktırma iş ve işlemlerini bizzat da yapabilir. Kanun kapsamındaki yapıların tahliyesinin engellenmesi durumunda; Başkanlıkça/İdarece talep edilmesi hâlinde, mülki idare amiri tarafından verilecek yazılı izne istinaden yeterli kolluk kuvveti marifetiyle kapalı kapıları/alanları açmak veya açtırmak suretiyle tahliye yapılır/yaptırılır. Başkanlık veya İdare tarafından yapılan veya yaptırılan riskli yapı tespit, tahliye ve yıktırma masrafları, hisseleri oranında maliklerden 6183 sayılı Kanuna göre tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kanun kapsamındaki yapıların tahliyesine ve yıktırılmasına ilişkin olarak ayni ve şahsi hak sahiplerine yapılacak tebligat, tahliye ve yıktırmaya ilişkin tutanağın yapıya asılması, maliklere e-Devlet Kapısı üzerinden bildirilmesi ve ilgili muhtarlıkta on beş gün süre ile ilan edilmesi suretiyle yapılır. Tahliye ve yıktırmaya ilişkin işlem, muhtarlıkta yapılan ilanın son günü ayni ve şahsi hak sahiplerine tebliğ edilmiş sayılır. Tahliyesi istenilen yapılar, ayrıca Başkanlığın internet sayfasında on beş gün süre ile ilan edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Uygulama işlemleri">
      <mvz-fıkra no="1">
        <template>Üzerindeki bina yıkılarak arsa hâline gelen taşınmazlarda daha önce kurulmuş olan kat irtifakı veya kat mülkiyeti, ilgililerin muvafakatleri aranmaksızın Başkanlığın talebi üzerine ilgili tapu müdürlüğünce resen terkin edilerek, önceki vasfı ile değerlemede bulunularak veya malik ile yapılan anlaşmanın şartları tapu kütüğünde belirtilerek malikleri adına payları oranında tescil edilir. Taşınmazların niteliği resen mevcut duruma göre tescil edilir. Bu taşınmazların sicilinde bulunan ayni ve şahsi haklar ile temlik hakkını kısıtlayan veya yasaklayan her türlü şerh, hisseler üzerinde devam eder.  Belirtilen haklar ve şerhler, tapuda; tevhit, ifraz, alan düzeltme, taksim, ihdas, terk, tescil, kat irtifakı ve kat mülkiyeti tesisine ilişkin işlemlerin yapılmasına engel teşkil etmez ve bu işlemlerde maliklerin ve ilgililerin muvafakati aranmaz.  Yeni yapılar için kat irtifakı ve kat mülkiyeti tesisi safhasında belirtilen haklar ve şerhler, muvafakat aranmaksızın sadece söz konusu haklar ve şerhlerden yükümlü olan malike düşecek bağımsız bölümler üzerinde devam ettirilir.  Uygulama alanında cins değişikliği, tevhit, ifraz, alan düzeltme, taksim, ihdas, terk ve tescil işlemleri muvafakat aranmaksızın Başkanlık, TOKİ veya İdare tarafından resen yapılır veya yaptırılır. Bu parsellerin malikleri tarafından değerlendirilmesi esastır. Bu çerçevede riskli alanlar ve rezerv yapı alanlarında uygulama yapılan etap veya adada, riskli yapılarda ise bu yapıların bulunduğu parsellerde, yapılar yıktırılmadan önce, parsellerin tevhit edilmesine, münferit veya birleştirilerek veya imar adası bazında uygulama yapılmasına, ifraz, terk, ihdas ve tapuya tescil işlemlerine, yeniden bina yaptırılmasına, payların satışına, kat karşılığı veya hasılat paylaşımı ve diğer usuller ile yeniden değerlendirilmesine, yapının paydaşı olup olmadıkları gözetilmeksizin sahip oldukları hisseleri oranında paydaşların salt çoğunluğu ile karar verilir.  Yapılacak yeni uygulamaların gerektirdiği; tevhit, ifraz, alan düzeltme, taksim, ihdas, terk, tescil ve benzeri işlemler, yıkım ve yapıma ilişkin her türlü izin ve ruhsat iş ve işlemleri ile diğer idareler/kurum ve kuruluşlar nezdinde, maliklerin tamamının ve ilgililerinin muvafakatiyle yürütülmesi gereken tüm iş ve işlemler hisseleri oranında paydaşların salt çoğunluğu ile aldıkları karara istinaden yapılır. İdareye paydaşların salt çoğunluğu ile alınan karara ilişkin olarak, anlaşan maliklerce imzalı karar tutanağı veya anlaşan maliklere ait vekâletname/sözleşme örnekleri sunulabilir.  Hisseleri oranında paydaşların salt çoğunluğu ile alınan karara katılmayanların arsa payları, Başkanlıkça rayiç değeri tespit ettirilerek ve bu değerden az olmamak üzere anlaşma sağlayan diğer paydaşlara açık artırma usulü ile satılır. Bu suretle paydaşlara satış gerçekleştirilemediği takdirde bu paylar, riskli alanlar ve rezerv yapı alanlarında tespit edilen rayiç bedeli dönüşüm projesini gerçekleştirecek olan Başkanlık, İdare veya TOKİ tarafından ödenmek suretiyle satın alınır.  Riskli yapılarda ise anlaşma sağlayan diğer paydaşlara veya anlaşma sağlayan paydaşların kararı ile yapılan anlaşmaya uyularak işlem yapılmasını kabul etmek şartıyla üçüncü şahıslara satış yapılıncaya kadar satış işlemi tekrarlanır.  Hisseleri oranında paydaşların salt çoğunluğu ile alınan karara katılmayan maliklerin arsalarının veya arsa paylarının Kanun uyarınca satış yapılıncaya kadar, anlaşma sağlayan paydaşlar dışındaki üçüncü kişilere satılması durumunda, tapuda tescil işlemi yapılabilmesi için satın alanın elektronik tebligat adresini tapu müdürlüğüne bildirmesi zorunludur.  Hisseleri oranında salt çoğunluk ile karar alan malikler tarafından, alınan karar ve anlaşma şartlarını ihtiva eden teklif veya teklifin görülüp incelenebileceği yer, salt çoğunlukla alınan karara katılmayan maliklere, noter vasıtasıyla veya ilgili muhtarlıkta on beş gün süre ile ilan edilmek suretiyle bildirilir. İlgili muhtarlıkta ilan suretiyle yapılan bildirimde, muhtarlıkta yapılan ilanın son günü bildirim yapılmış sayılır. Yapılan bu bildirimde ayrıca, bildirimin yapıldığı/yapılmış sayıldığı tarihten itibaren on beş gün içinde teklifin incelenmemesi veya aynı süre içinde teklifin kabul edilmemesi halinde arsa paylarının bu Kanun kapsamında satılacağı hususu bildirilir. Arsa payı satış işlemi sürecinde Başkanlıkça/İdarece yapılacak tebligatlar, tebliğ olunacak evrakın e-Devlet Kapısı üzerinden bildirilmesi ve ilgili muhtarlıkta on beş gün süre ile ilan edilmesi suretiyle yapılır ve muhtarlıkta yapılan ilanın son günü tebligat yapılmış sayılır. Tapuya elektronik tebligat adreslerini bildiren maliklere elektronik tebligat adresi üzerinden tebligat yapılır.  Açık artırma ile satışı yapılacak payların üzerindeki ve Kanun kapsamındaki alanlarda ve parsellerde anlaşma yolu ile Başkanlığa, TOKİ’ye veya İdareye bedeli karşılığında devredilen taşınmazların sicilindeki ipotek, ihtiyati haciz, haciz ve intifa hakkı gibi haklar, satış sonrasında satış bedeli üzerinde devam eder. Satış işlemi sonrasında tapu kaydındaki haklar ve şerhler Başkanlığın talebi üzerine tapu müdürlüğünce resen terkin edilir.  Satış işleminin, satış bedelinin eksik hesaplandığı gerekçesi ile iptal edilmesi durumu hariç olmak üzere, yargı kararı ile iptal edilmesi halinde, Başkanlığın durumu ilgili tapu müdürlüğüne bildirmesi üzerine, satışı yapılan arsa veya arsa payı, satış işleminden sonra üçüncü bir kişiye devredilmemiş veya satıştan önceki malik adına doğrudan tescilini hukuken ve/veya fiilen imkânsız hale getiren bir uygulamaya tabi tutulmamış ise resen eski maliki adına tescil edilir ve satış bedelinin iadesi sağlanıncaya kadar satış bedeli tutarında alıcı lehine kanuni ipotek tesis ve tescil edilir.  Satış işleminin, satış bedelinin eksik hesaplandığı gerekçesi ile iptal edilmesi durumunda, yargı kararı, satış bedeli ile yargı kararında belirtilen şekilde hesaplanacak bedel arasındaki farkın hisseyi satın alan malik tarafından hissesi satılan eski malike ödenmesi suretiyle uygulanır. Yargı kararı ile satış bedelinin eksik hesaplandığı gerekçesi ile hissesi satılan malikin zararının tazmin edilmesi yönünde Başkanlık/İdare aleyhine karar verilmesi durumunda, ödenmesine hükmedilen bedel, Başkanlığın/İdarenin bu konuda kendisine yapacağı bildirim tarihinden itibaren en geç 15 gün içinde, hisseyi satın alan malik tarafından hissesi satılan eski malike ödenir. Verilen süre içerisinde ödemenin yapılmaması sebebiyle bedelin Başkanlıkça/İdarece ödenmesi halinde, ödenen bedel hisseyi satın alan malikten genel hükümlere göre tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Üzerindeki bina yıkılmış olan arsanın maliklerine yapılan tebligatı takip eden otuz gün içinde salt çoğunluk ile anlaşma sağlanamaması hâlinde, gerçek kişilerin veya özel hukuk tüzel kişilerinin mülkiyetindeki taşınmazlar için Başkanlık, TOKİ veya İdare tarafından acele kamulaştırma yoluna da gidilebilir. Bu Kanun uyarınca yapılacak olan kamulaştırmalar, 4/11/1983 tarihli ve 2942 sayılı Kamulaştırma Kanununun 3 üncü maddesinin ikinci fıkrasındaki iskân projelerinin gerçekleştirilmesi amaçlı kamulaştırma sayılır ve ilk taksit ödemesi, mezkûr fıkraya göre belirlenen tutarların beşte biri oranında yapılır. Tapuda mülkiyet hanesi açık olan taşınmazlar ile mirasçısı belirli olmayan, kayyım tayin edilmiş, ihtilaflı veya üzerinde sınırlı ayni hak tesis edilmiş olan taşınmazların kamulaştırma işlemleri aynı madde hükümlerine tabidir. Başkanlık, TOKİ veya İdare; kamulaştırma işlemlerinin yürütülmesi ve bu Kanun uyarınca yapılacak diğer işlemler  için mirasçılık belgesi çıkartmaya, kayyım tayin ettirmeye veya tapuda kayıtlı son malike göre işlem yapmaya yetkilidir. Tapuda kayıtlı malikin ölmüş olması hâlinde Başkanlık, TOKİ veya İdare, kamulaştırma işlemi için mirasçılık belgesi çıkartabileceği gibi, gerekiyorsa tapu sicilinde idari müracaat veya dava yolu ile kayıt düzeltme de isteyebilir. Kamulaştırma için anlaşma sağlanması hâlinde, Başkanlık, TOKİ veya İdare ile ilgililer arasında taşınmazın tescil veya terkinine ilişkin ferağ ve muvafakati de ihtiva eden sözleşme ve uzlaşma tutanağı tanzim edilir ve ilgili tapu müdürlüğüne gönderilerek kamulaştırmanın resen tapu siciline işlenmesi sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Anlaşma ile tahliye edilen, yıktırılan veya kamulaştırılan yapıların maliklerine ve malik olmasalar bile bu yapılarda kiracı veya sınırlı ayni hak sahibi olarak en az bir yıldır ikamet ettiği veya bunlarda işyeri bulunduğu tespit edilenlere konut, işyeri, arsa veya dönüşüm projeleri özel hesabından kredi veya mülkiyet ya da sınırlı ayni hak sağlayan ve usul ve esasları Başkanlıkça belirlenen konut sertifikası verilebilir. Bunlardan konutunu ve işyerini kendi imkânları ile yapmak veya edinmek isteyenlere de kredi verilebilir. 20/7/1966 tarihli ve 775 sayılı Gecekondu Kanununa göre yoksul veya dar gelirli olarak kabul edilenlere ve diğer hak sahiplerine verilecek olan konut veya işyerleri; Başkanlık, TOKİ veya İdare tarafından, 15/5/1959 tarihli ve 7269 sayılı Umumi Hayata Müessir Afetler Dolayısiyle Alınacak Tedbirlerle Yapılacak Yardımlara Dair Kanunda belirtilen usul ve esaslar uyarınca borçlandırma suretiyle de verilebilir.  Başkanlıkça yürütülen uygulamalarda; 775 sayılı Kanuna göre yoksul veya dar gelirli olarak kabul edilenlere verilecek bağımsız bölümlerin paylı mülkiyet esaslarına göre Başkanlık ile hisseli olması durumunda, hak sahibinin dönüşümden önceki taşınmazının tapu kaydında yer alan ipotek, ihtiyati haciz, haciz ve intifa hakkı gibi haklar ve şerhler tapuda sadece hak sahibinin hissesi üzerinde devam ettirilir ve hak sahibinin üzerine kayıtlı ikamet edebileceği konut nitelikli başka bir gayrimenkulu yok ise, hak sahibine, hak sahibi evli ise hak sahibi ve eşine bu bağımsız bölüm üzerinde 4721 sayılı Kanun hükümlerine göre oturma hakkı tanınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Riskli alanlarda, rezerv yapı alanlarında ve riskli yapıların bulunduğu taşınmazlar üzerinde yapımı gerçekleştirilen bağımsız bölümlerin bedelleri, gerekli görüldüğünde, proje uygulamalarının yapıldığı illerdeki mevcut ekonomik durum, tabii afetin ortaya çıkardığı durumlar, konut rayiç ve enkaz bedelleri ile uygulama alanındaki kişilerin mal varlığı ve geliri göz önünde bulundurularak Cumhurbaşkanı kararı ile yapım maliyetlerinin/rayiç değerinin altında tespit edilebilir ve sosyal donatı ve altyapı harcamaları uygulama maliyetine dâhil edilmeyebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Başkanlık;</template>
        <mvz-bent no="a">
          <template>Riskli alanlara, rezerv yapı alanlarına ve riskli yapıların bulunduğu taşınmazlara ilişkin her tür harita, plan, proje, arazi ve arsa düzenleme işlemleri ile toplulaştırma yapmaya,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu alanlarda bulunan taşınmazları satın almaya, ön alım hakkını kullanmaya, bağımsız bölümler de dâhil olmak üzere taşınmazları trampaya, taşınmaz mülkiyetini veya imar haklarını başka bir alana aktarmaya,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Aynı alanlara ilişkin taşınmaz mülkiyetini anlaşma sağlanmak kaydı ile menkul değere dönüştürmeye,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Kamu ve özel sektör işbirliğine dayanan usuller uygulamaya, kat veya hasılat karşılığı usulleri de dâhil olmak üzere inşaat yapmaya veya yaptırmaya, arsa paylarını belirlemeye,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>23/6/1965 tarihli ve 634 sayılı Kat Mülkiyeti Kanunundaki esaslara göre paylaştırmaya, payları ayırmaya veya birleştirmeye, 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanunu uyarınca sınırlı ayni hak tesis etmeye,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Hazine mülkiyetinde olup bu Kanun kapsamında Başkanlığa devredilen taşınmazları; Kanun kapsamında Başkanlıkça kamulaştırılan taşınmazları ve yürütülen uygulamalar neticesinde Başkanlık payına düşen taşınmazları, dönüşüm projeleri özel hesabına gelir elde etmek amacıyla kiralamaya ve satmaya,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Bu Kanun kapsamında kullanılmak üzere hazır konut ve işyeri satın almaya ve bunları devretmeye,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Rezerv yapı alanlarında gelir ve hasılat getirecek her türlü uygulama yapmaya,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Parselasyon planlarında, gerekli görülmesi hâlinde varsa ilk uygulamadaki düzenleme ortaklık payı oranını tamamlamak üzere düzenleme ortaklık payı kesintisi yapmaya,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>yetkilidir.  (ç) bendinde belirtilen uygulamalar, Bakanlığın bağlı, ilgili ve ilişkili kurum, kuruluş ve bunların iştirakleriyle ve 4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanununa tabi idareler ile iş birliği içinde veya gerçek kişiler ve özel hukuk tüzel kişileri ile özel hukuka tabi anlaşmalar çerçevesinde de yapılabilir.  Kanun kapsamında Başkanlığın tasarrufuna geçen taşınmazlardan hak sahiplerine verilecek olanlar dışındaki taşınmazların kiralanması ve satışı 8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanunu hükümlerinden istisnadır. Başkanlık, kiralama ve satış işlemlerine ilişkin usul ve esasları belirlemeye yetkilidir.  Bu Kanun kapsamında Başkanlığa devredilen Hazine taşınmazları; Bakanlığın bağlı, ilgili ve ilişkili kurum ve kuruluşları ile bunların iştiraklerine, belediyelere ve bunların şirketlerine, kamu kurum ve kuruluşları ile kamu kurumu niteliğindeki meslek kuruluşlarına, belediye ve mücavir alan sınırları içinde olup, 30/3/2014 tarihinden önce üzerinde yapılanma olan taşınmazların öncelikle yapı sahipleri ile bunların kanunî veya akdi haleflerine, 4706 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (b), (c), (d) ve (e) bentlerinde sayılanlara rayiç bedel üzerinden; küçük sanayi sitesi yapılmak üzere bu amaçla kurulmuş kooperatiflere ve belediyelere ise, rayiç bedelin yüzde ellisinden az olmaması kaydıyla Başkanlıkça belirlenecek bedel üzerinden, doğrudan satılabilir veya Başkanlıkça belirlenecek bedel üzerinden doğrudan kiralanabilir.  (b) bendi uyarınca yapılacak satın alma ve trampada; Başkanlıkça yapılan satın alma/trampa teklifinin malikçe kabul edilmesi durumunda yapılan anlaşmaya ilişkin bir tutanak düzenlenir ve taraflarca imzalanır. Anlaşmaya konu taşınmaz malın tüm hukuki ve fiili vasıfları ile satın alma bedelini, malikin kimlik bilgilerini ve taşınmazların tapuda tesciline veya terkinine dair kabul beyanlarını da ihtiva eden bu tutanak malikin ferağ beyanı ve tapuda Başkanlık adına yapılacak tescilin hukuki sebebi sayılır. Taşınmazın Başkanlık adına tescili veya terkini bu tutanağa istinaden tapu müdürlüğünce resen yapılır.  (b) bendinde belirtilen Başkanlığın ön alım hakkı, Başkanlığın/Hazinenin bu Kanun kapsamındaki taşınmazlarda paydaş olup olmadığı ile bu taşınmazlarda paylı veya müstakil mülkiyet olup olmadığına bakılmaksızın, bu taşınmazların tamamen veya kısmen alanda veya parselde malik olanlar dışındaki üçüncü kişilere satışı durumunda kullanılır. Ön alım hakkının kullanılmasına ilişkin usul ve esaslar Başkanlıkça belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bakanlık, riskli alanlar, rezerv yapı alanları ve riskli yapıların bulunduğu parsellerdeki uygulamalarda faydalanılmak üzere; özel kanunlar ile öngörülen alanlara ilişkin olanlar da dâhil, her tür ve ölçekteki planlama işlemlerine esas teşkil edecek standartları belirlemeye ve gerek görülmesi hâlinde bu standartları plan kararları ile tayin etmeye veya özel standartlar ihtiva eden planlar ve kentsel tasarım projeleri yapmaya, yaptırmaya ve onaylamaya yetkilidir.  Bu Kanun kapsamındaki alanlar ve parsellere ilişkin olarak onaylanan imar ve parselasyon planları, ilgili çevre, şehircilik ve iklim değişikliği il müdürlüğünde on beş gün süreyle ilan edilir. Bu planlara itiraz, ilan süresi içinde ilgili çevre, şehircilik ve iklim değişikliği il müdürlüğüne yapılır ve itirazlar Bakanlıkça beş gün içerisinde değerlendirilir. İtirazların reddedilmesi hâlinde, planlar başkaca bir onay işlemine gerek kalmaksızın red kararı tarihinde kesinleşir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bu Kanun çerçevesinde dönüştürmeye tabi tutulan taşınmazların, üzerindeki köhnemiş yapılar da dâhil olmak üzere, muhdesatı ile birlikte değer tespiti işlemleri ve dönüşüm ile oluşacak taşınmazların değerlemeleri Başkanlık, TOKİ veya İdarece yapılır veya yaptırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Riskli alan ve rezerv yapı alanı dışında olup da bu Kanunun öngördüğü amaçlar bakımından güçlendirilebileceği teknik olarak tespit edilen yapılar için, Cumhurbaşkanınca belirlenen usul ve esaslar çerçevesinde Başkanlıkça dönüşüm projeleri özel hesabından güçlendirme kredisi verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu Kanun uyarınca tesis edilen idari işlemlere karşı tebliğ tarihinden itibaren otuz gün içinde 6/1/1982 tarihli ve 2577 sayılı İdari Yargılama Usulü Kanunu uyarınca dava açılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Bu Kanun uyarınca gerçekleştirilecek dönüşüm uygulamalarındaki taşınmazlar, gayrimenkul satış vaadi sözleşmesi veya arsa payı karşılığı inşaat sözleşmesine istinaden yapım işini üstlenen müteahhide devredilmiş ise, malikler adına kat irtifakı kuruluncaya kadar, o yapım işine ait malzeme ve işçilik alacakları hariç olmak üzere, müteahhidin üçüncü kişilere olan borçlarından dolayı bu taşınmazlar hakkında haciz ve tedbir uygulanamaz. Yapım işine başlanmasından itibaren altı ay içerisinde kat irtifakının kurulmaması durumunda, bu taşınmazlar hakkında haciz ve tedbirler uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Bu Kanun hükümlerine göre Başkanlığa devredilen veya Başkanlığın talebi üzerine TOKİ’ye veya İdareye devredilen taşınmazlar üzerinde bu Kanun kapsamındaki uygulamalara bağlı olarak meydana gelen yeni taşınmazlar Başkanlığın, TOKİ’nin veya İdarenin isteği üzerine, kendileri ile anlaşma sağlanan gerçek kişiler veya mirasçıları ile tüzel kişiler adına tapuya tescil olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Bakanlık, bu Kanunda belirtilen iş ve işlemlere ilişkin olarak TOKİ’ye veya İdareye yetki devrine ve bu iş ve işlemlerden hangilerinin TOKİ veya İdare tarafından yapılacağını belirlemeye yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Bu Kanun kapsamındaki alanlarda ve parsellerde gerçek kişiler ve özel hukuk tüzel kişilerince uygulamada bulunulması durumunda yapım işini üstlenen müteahhitlerin payına düşen bağımsız birimlerin satışı, inşaatın ilerleme seviyesine göre ve İdarenin iznine istinaden yapılabilir. Müteahhit, kendi payına düşen bağımsız birimlerin satışına izin verilmesi için İdareye müracaat eder. İdare, yerinde tespit yaparak veya yapı denetimi sisteminden kontrol ederek inşaatın tamamlanma oranını belirler ve bu oranın yüzde on altındaki oranda müteahhitpayına düşen bağımsız birimlerin satışının yapılabileceğini ilgili tapu müdürlüğüne bildirir. Müteahhit payına düşen bağımsız birimlerin, inşaatın tamamlanma oranında veya bu oranın üstündeki bir oranda satışı için bütün maliklerin muvafakati gerekir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="14">
        <template>Bu Kanun kapsamındaki alanlarda ve parsellerde; oy birliği ile anlaşma sağlanmasından veya hisseleri oranında paydaşların salt çoğunluğu ile karar alınmasından sonra müteahhitten kaynaklanan sebeplerle, bir yıl içinde yeni yapının yapım işine başlanmamış veya yapım işi belirli bir seviyede durdurulmuş ve en az altı aydır projenin bitirilmesini gerektirecek seviyede ekip ve ekipmanla inşai faaliyete devam edilmiyor ise, yapılan sözleşmelerin feshi için hisseleri oranında maliklerin salt çoğunluğu ile karar alınabilir. Bu karar ile birlikte Başkanlığa başvurularak yeni yapının yapım işine başlanıp başlanmadığının veya yapım işinin projenin bitirilmesini gerektirecek seviyedeki ekip ve ekipmanla devam edip etmediğinin tespiti istenir. Başkanlıkça; belirtilen durumların tespit edilmesi hâlinde, müteahhide otuz gün süre verilerek işe başlaması veya devam etmesi gerektiği, aksi takdirde bu sürenin bitim tarihi itibarıyla sözleşmelerin resen feshedileceği ihtar edilir. Bu ihtara rağmen işe başlanmaması veya devam edilmemesi durumunda, ayrıca ihtar çekmeye gerek kalmaksızın otuz günlük sürenin bittiği tarih itibarıyla hak sahipleri ile müteahhit arasında imzalanmış olan inşaat yapımına ilişkin sözleşmeler ilgililerinin muvafakati aranmaksızın resen feshedilmiş sayılır. Fesih sonrasında, taşınmazların siciline şerh edilmiş olan inşaat yapımına ilişkin sözleşmeler maliklerin veya Başkanlığın talebi üzerine terkin edilir. Fesih tarihine kadar yapılmış olan işler, devrolunan hisseler, yapılan ödemeler ve diğer hususlarda genel hukuk hükümleri uygulanır. Fesih tarihine kadar müteahhit tarafından hak sahiplerine yapılan kira yardımı ödemeleri hak sahiplerinden geri talep edilemez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="15">
        <template>Bu Kanun kapsamındaki uygulamalar ile bu uygulamalar için karar alınması ve uygulamaların yürütülmesi konularında Başkanlıkça lisanslandırılacak kuruluşlar faaliyet gösterebilir. Lisanslandırılacak kuruluşlarda, inşaat mühendisi, harita mühendisi, mimar, şehir plancısı, değerleme uzmanı ve hukukçu istihdam edilmesi mecburidir. Lisanslandırılacak kuruluşların haiz olması gereken şartlar, bu kuruluşlarda görev alacak personelin sayısı, niteliği, çalışma usul ve esasları ve diğer hususlar Başkanlıkça hazırlanacak yönetmelik ile belirlenir. Başkanlık bu kuruluşların faaliyetlerini denetlemeye yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="16">
        <template>Bu Kanun kapsamındaki yapıların yıktırılmasından sonra arsa haline gelen taşınmazda ortaklığın giderilmesi için 4721 sayılı Kanun hükümlerine göre dava açılabilir. Ancak, ortaklığın giderilmesi için dava açılmış olması, bu Kanun kapsamında hisseleri oranında paydaşların salt çoğunluğu ile karar alınmasına ve bu karara göre işlem yapılmasına engel teşkil etmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6/A" başlık="Uygulamaların resen yapılması">
      <mvz-fıkra no="1">
        <template>Yıkılacak derecede riskli olan yapıların bulunduğu alanlar ile kendiliğinden çöken veya zeminin kayması, heyelan, su baskını, kaya düşmesi, yangın, patlama gibi sebeplerle ağır hasar gören veya ağır hasar görme riski bulunan yapıların bulunduğu alanlarda dönüşüm uygulamaları maliklerin ve ilgililerin muvafakati aranmaksızın Başkanlıkça resen yapılabilir veya yaptırılabilir. Uygulama yapılacak alanın sınırları uygulama bütünlüğü gözetilerek belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde kapsamında riskli yapı tespiti, masrafları Dönüşüm Projeleri Özel Hesabından karşılanmak ve Başkanlıkça talep edilmesi halinde, mülki idare amiri tarafından verilecek yazılı izine istinaden yeterli kolluk kuvveti marifetiyle kapalı kapıları/alanları açmak veya açtırmak suretiyle Başkanlıkça resen yapılır.  Başkanlık veya idare tarafından, binanın bulunduğu arsanın tehlikeli durumu veya binadaki hasar ve tahribat bakımından acilen boşaltılması ve yıktırılması gerektiği belirlenen binalar riskli yapı olarak kabul edilir. Riskli olarak tespit/kabul edilen yapıların listesi tebliğ yerine kaim olmak üzere, bu yapıların kapısına asılır ve ilgili muhtarlıkta iki gün süre ile ilan edilir. Riskli yapı tespiti işlemi bu ilan ile maliklere şahsen tebliğ edilmiş sayılır. Riskli yapı tespitlerine karşı maliklerce veya kanuni temsilcilerince iki gün içinde itiraz edilebilir ve itirazlar üç gün içerisinde teknik heyetler tarafından incelenip karara bağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yapıların tahliyesinin Başkanlıkça verilen süre içerisinde yapılması mecburidir.  Tahliyeye ilişkin tebligat ikinci fıkrada belirtilen şekilde yapılır. Bu madde uyarınca yapılacak uygulamalarda maliklere, kiracılara ve yapıda ikamet etmek şartıyla sınırlı ayni hak sahiplerine taşınma yardımı yapılabilir.  Verilen sürede yapıların tahliye edilmemesi durumunda, Başkanlıkça talep edilmesi halinde, mülki idare amiri tarafından verilecek yazılı izine istinaden yeterli kolluk kuvveti marifetiyle kapalı kapıları/alanları açmak veya açtırmak suretiyle tahliye ve yıktırmaya yönelik iş ve işlemler, Başkanlıkça yapılabilir veya yaptırılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Tapuda yapılacak satış, devir, ipotek tesisi işlemleri ile tapu kaydındaki hakların ve şerhlerin terkini işlemleri de dâhil olmak üzere bütün tapu ve kadastro işlemleri, yıkım ve yapıma ilişkin her türlü izin ve ruhsat iş ve işlemleri, diğer idareler nezdinde yürütülecek iş ve işlemler, maliklerin ve ilgililerin muvafakati aranmaksızın Başkanlığın talebine istinaden yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Uygulama yapılacak alanda bulunan kamu kurum ve kuruluşlarına ait taşınmazlardan dönüşüm uygulamasına dâhil edilecek olanlar ile özel mülkiyete tabi diğer bütün taşınmazlar, Başkanlığın talebine istinaden Hazine adına tescil olunur. Yapılacak yeni yapılar için inşaat ruhsatı Hazine adına düzenlenir ve hak sahiplerine haklarına karşılık gelecek bağımsız bölümlerin devri yapılıncaya kadar kat irtifakı ile kat mülkiyeti Hazine adına kurulur.  Bu madde kapsamında yürütülen uygulamalarda uygulama projesi aranmaksızın ihaleye çıkılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Uygulama yapılacak alan sınırları içerisinde bulunan taşınmazlarla ilgili daha önce imzalanmış olan inşaat yapımına ilişkin sözleşmeler, bu sözleşmelerin taraflarının ve diğer ilgililerin muvafakati aranmaksızın, uygulamaların Başkanlıkça yürütülmesinin uygun görüldüğü tarih itibarıyla feshedilmiş sayılır. Taşınmazların siciline şerh edilmiş olan inşaat yapımına ilişkin sözleşmeler Başkanlığın talebi üzerine terkin edilir. Feshedilmiş sayılan sözleşmelere istinaden herhangi bir iş ve uygulama yapılmış ise, bu iş ve uygulamaları yapan müteahhit ile Başkanlık arasında mahsuplaşma yapılır. Kira yardımı ödemeleri hariç olmak üzere, sözleşmenin taraflarından biri tarafından, diğer tarafa herhangi bir ödeme yapılmış ise, taraflar yapılan ödemeleri genel hükümler çerçevesinde karşılıklı olarak birbirlerinden talep etme hakkına sahiptir.  Uygulama yapılacak alandaki taşınmazlar, feshedilmiş sayılan sözleşmelere istinaden tapuda müteahhide devredilmiş ise, uygulama neticesinde meydana gelen yeni taşınmazlar hak sahipliği çalışmaları gözetilerek müteahhide devir yapan eski malikleri adına resen tescil olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Yapılacak konut ve işyerlerinin niteliği ve büyüklüğü Başkanlıkça belirlenir.  Hak sahipliği çalışmaları, hak sahibinin mevcut taşınmazının değeri ile yeni yapıda hak sahibine verilecek konut veya işyerinin değeri gözetilerek veya Başkanlıkça karar alınması halinde kat karşılığı, hasılat paylaşımı ve benzeri usullerle yürütülür.  Hak sahibinin borçlanmasının gerekmesi durumunda, borçlanma bedeli üzerinden hak sahibi ile sözleşme yapılır ve borçlanma bedelinin tamamı ödenmeden tapuda ferağı verilmez. Hak sahibine düşecek bağımsız bölümün/bölümlerin Başkanlıkça belirlenen süreler içerisinde teslim alınmaması durumunda, hak sahibinin bu bağımsız bölüm/bölümler üzerindeki hakkı sona erer; dönüşümden önceki taşınmazının değeri güncellenerek hak sahibi adına açılacak vadeli bir hesaba yatırılır; hak sahibinin dönüşümden önceki taşınmazının tapu kaydında yer alan ipotek, ihtiyati haciz, haciz ve intifa hakkı gibi haklar ve şerhler hak sahibi adına yatırılan taşınmazın bedeli üzerinde devam ettirilir; tapu kaydındaki haklar ve şerhler Başkanlığın talebi üzerine tapu müdürlüğünce resen terkin edilir ve durum hak sahibine bildirilir.  Hazine adına kayıtlı bu bağımsız bölüm/bölümler Başkanlığa devredilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Dönüşüm Gelirleri ve Diğer Hükümler">
    <mvz-madde no="7" başlık="Dönüşüm gelirleri">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen amaçlar için kullanılmak üzere ilgili yıl genel bütçesinin (B) işaretli cetvelinde yer alan aşağıda sayılı gelirler karşılığı Başkanlık bütçesine ödenek öngörülür:</template>
        <mvz-bent no="a">
          <template>9/8/1983 tarihli ve 2872 sayılı Çevre Kanunu gereğince, çevre katkı payı ve idari para cezası olarak tahsil edilerek genel bütçeye gelir kaydedilecek tutarın yüzde ellisi.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>31/8/1956 tarihli ve 6831 sayılı Orman Kanununun 2 nci maddesinin birinci fıkrasının (B) bendine göre Hazine adına orman dışına çıkarılan yerlerin satışından elde edilen gelirlerin yüzde doksanını geçmemek üzere Cumhurbaşkanı kararı ile belirlenen orana tekabül eden tutar.</template>
        </mvz-bent>
        <mvz-bent no="c" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="ç" durum="mülga">
          <template></template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Başkanlık bütçesinde öngörülen ödenek tutarını aşan birinci fıkranın (a) ve (b) bentlerinde yer alan yıl içi gelir gerçekleşmeleri karşılığı Başkanlık bütçesinin ilgili tertiplerine Hazine yardımları ile ilişkilendirmek suretiyle ödenek eklemeye Cumhurbaşkanı yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Gerektiğinde dönüşüm faaliyetlerinde kullanılmak üzere Başkanlık bütçesinde ödenek öngörülebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddenin birinci, ikinci ve üçüncü fıkraları kapsamındaki ödenekler, Başkanlığın muhasebe birimi adına açılacak dönüşüm projeleri özel hesabına aktarılmak suretiyle kullanılır. Başkanlığın dönüşüm faaliyetlerine ilişkin giderleri, 14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanunu ile diğer kanunların sözleşmeli personel çalıştırılmasına dair hükümlerine bağlı kalınmaksızın çalıştırılacak sözleşmeli personel giderleri de dâhil olmak üzere, dönüşüm projeleri özel hesabından karşılanır. Bu madde kapsamındaki ödenekler ile dönüşüm projeleri özel hesabından yapılacak kullanımlar yılı yatırım programı ile ilişkilendirilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanunda öngörülen amaçlar için kullanılmak üzere;</template>
        <mvz-bent no="a">
          <template>Bu Kanunda öngörülen uygulamalar sonucunda elde edilecek her türlü gelir ve hasılat,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Hazineye veya üçüncü kişilere ait olup Başkanlığa devredilen taşınmazlardan imar uygulamasına tabi tutulması sonucunda tapuda Başkanlık adına tescil edilen taşınmazlar ile Başkanlığın mülkiyetinde olan diğer taşınmazların satışından, kiraya verilmesinden, irtifak hakkı tesis edilmesinden ve bu taşınmazların işletilmelerinden elde edilecek gelirler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Dönüşüm projelerine ilişkin kullandırılan krediler kapsamında ilgili kişi veya kuruluşlarca yapılan geri ödemeler ile bu kapsamda tahsil edilen gecikme zamları,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Her türlü şartlı veya şartsız bağış ve yardımlar ile sair gelirler,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>İller Bankası Anonim Şirketinin Hazine gelirleri ve faiz gelirleri dışındaki banka faaliyetleri ile 26/1/2011 tarihli ve 6107 sayılı İller Bankası Anonim Şirketi Hakkında Kanunun 3 üncü maddesinin birinci fıkrası uyarınca yapacağı faaliyetlerden elde edeceği kârın yüzde ellisi,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Tapu ve Kadastro Genel Müdürlüğü Döner Sermaye İşletmesi gelirinin yüzde onu,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Bakanlık Döner Sermaye İşletmesi gelirinin yüzde otuzunu aşmamak üzere Bakanlıkça belirlenecek miktar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>dönüşüm projeleri özel hesabına gelir olarak kaydedilir. (d) bendinde belirtilen tutar, hesap dönemini takip eden yılın mayıs ayı sonuna kadar Başkanlığın muhasebe birimine aktarılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanun kapsamında sağlanması öngörülen krediler ile dönüşüm faaliyetleri kapsamında yapılacak veya edinilecek konut ve işyerlerine ilişkin olarak, hak sahiplerince bankalardan kullanılacak krediler ile Kanun kapsamındaki uygulamalarda kullanılmak üzere İdarece İller Bankası Anonim Şirketinden veya bankalardan kullanılacak kredilere, dönüşüm projeleri özel hesabından karşılanmak üzere faiz desteği verilebilir. Bu işlemlere ve verilecek desteğe ilişkin usul ve esaslar Cumhurbaşkanınca belirlenir. Bu fıkra uyarınca hak sahiplerince bankalardan kullanılacak krediler, 6/12/2012 tarihli ve 6362 sayılı Sermaye Piyasası Kanununun 57 nci maddesi ile 7/11/2013 tarihli ve 6502 sayılı Tüketicinin Korunması Hakkında Kanunun 32 nci maddesinde belirtilen konut finansmanı amaçlı kredilerden sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Başkanlık, dönüşüm projeleri özel hesabı gelirlerinin elde edilmesi, tahsili ve takibi ile bu hesaba bütçeden aktarılan tutarların dönüşüm faaliyetleri kapsamında yürütülecek hibe veya borç verme programlarında kullanımı, her türlü yapım, mal ve hizmet alımına ilişkin taahhütlere girişilmesi, giderleştirilmesi, muhasebeleştirilmesi, denetimi ve özel hesabın işleyişine ilişkin diğer usul ve esasları, Strateji ve Bütçe Başkanlığı ile Hazine ve Maliye Bakanlığının uygun görüşünü alarak belirlemeye yetkilidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu Kanun kapsamında uygulamada bulunacak olan belediyeler, yatırıma ilişkin yıllık bütçelerinin yüzde beşi ile 26/5/1981 tarihli ve 2464 sayılı Belediye Gelirleri Kanununun 80 inci maddesi uyarınca tahsil edilen harç gelirlerinin yüzde ellisini, bu Kanunda öngörülen uygulamalara ayırmak zorundadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Bu Kanun uyarınca yapılacak olan ve Bakanlık, Başkanlık, TOKİ, İller Bankası Anonim Şirketi, İdare ve dönüşüme konu yapıların inşası işini yüklenen müteahhit ile malik ve en az bir yıldır kiracı veya sınırlı ayni hak sahibi olarak riskli yapıyı kullanan gerçek kişiler veya özel hukuk tüzel kişilerinden birinin taraf olduğu;</template>
        <mvz-bent no="a">
          <template>Bu Kanun kapsamındaki taşınmazların dönüşüme tabi tutulmadan önce ilk satışı, devri, tescili ve ipotek tesis edilmesi işlemleri ile bu Kanun kapsamında yapılacak uygulamalar neticesinde meydana gelen yeni yapıların malik, işi yüklenen müteahhit ve en az bir yıldır kiracı veya sınırlı ayni hak sahibi olarak riskli yapıyı kullanan gerçek kişiler veya özel hukuk tüzel kişilerine ilk satışı, devri, tescili ve ipotek tesis edilmesi işlemleri,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu Kanun kapsamındaki bir yapıdan dolayı, bu Kanun kapsamındaki parsellerde veya alanlarda veya söz konusu parsel ve alanların dışındaki parsellerde yeni bir yapı yapılması ya da mevcut bir yapının satın alınması veya ipotek tesis edilmesi işlemleri,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kanun kapsamında yapılacak uygulamalar neticesinde meydana gelen yeni yapıların işi yüklenen müteahhit, Bakanlık, Başkanlık, TOKİ, İller Bankası Anonim Şirketi, İdare ve bunların iştirakleri ile Gayrimenkul Yatırım Ortaklıkları (GYO) tarafından gerçekleştirilecek ilk satışı, devri, tescili ve ipotek tesis edilmesi işlemleri,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ile bu bentlerde belirtilen yapıların dönüşümüne ilişkin olarak Kanun uyarınca yapılacak diğer işlemler noter harcı, tapu harcı, belediyelerce alınan ücret ve harçlardan, veraset ve intikal vergisi, döner sermaye ücreti ve diğer ücretlerden, bu işlemler nedeniyle düzenlenecek kâğıtlar, resmî dairelerin mal ve hizmet alımlarına ilişkin ödemeler sebebiyle düzenlenen kâğıtlar da dahil olmak üzere damga vergisinden, bu Kanun kapsamındaki yapıların maliklerine ve malik olmasalar bile bu yapılarda kiracı veya sınırlı ayni hak sahibi olarak en az bir yıldır ikamet ettiği veya bunlarda işyeri bulunduğu tespit edilenlere bu amaçlarla kullandırılan krediler dolayısıyla lehe alınacak paralar, banka ve sigorta muameleleri vergisinden istisnadır. Bu Kanun kapsamındaki iş, işlem ve uygulamalar, Bakanlık, Başkanlık, TOKİ, İller Bankası Anonim Şirketi ve İdarenin, sermayesinin yarısından fazlasına sahip oldukları şirketleri tarafından yürütülüyor ise, bu şirketlerce yapılan iş, işlem ve uygulamalarda da bu fıkrada belirtilen vergi, harç ve ücret muafiyetleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="10">
        <template>Riskli alanlarda, rezerv yapı alanlarında ve riskli yapıların bulunduğu parsellerde, gerçek kişilerce ve özel hukuk tüzel kişilerince uygulamada bulunulması halinde, fonksiyon değişikliğine bakılmaksızın, mevcut inşaat alanının bir buçuk katına kadar olan yeni inşaat alanı için belediyelerce harç ve ücret alınmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="11">
        <template>Bu Kanunda belirtilen iş, işlem ve hizmetlere tahsis edilmiş olan taşınır ve taşınmazlar ile her türlü hak ve alacaklar, para ve para hükmündeki kıymetli evrak, kamu yararı amacına tahsis edilmiş sayılır, bunlar ve bu Kanun kapsamında alınacak teminatlar hakkında her ne suretle olursa olsun haciz ve tedbir uygulanamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="12">
        <template>Bakanlık, bu Kanun kapsamındaki uygulamalarda kullanılmak üzere dönüşüm projeleri özel hesabından TOKİ, İdare ve İller Bankası Anonim Şirketine kaynak aktarabilir. İller Bankası Anonim Şirketine aktarılan kaynak, Bankanın gelir ve gider hesapları ile ilişkilendirilmeksizin Dönüşüm Projeleri Özel Hesabının işleyişine ilişkin usul ve esaslar çerçevesinde kullanılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="13">
        <template>Bu maddede öngörülen gelirler, bu Kanunun amaçları dışında kullanılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Çeşitli hükümler">
      <mvz-fıkra no="1" durum="iptal">
        <template></template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bakanlık, Başkanlık, TOKİ, İller Bankası Anonim Şirketi ve İdare; danışmanlık, yazılım, araştırma, her tür ve ölçekte harita, etüt, proje, kadastro, kamulaştırma, mikro bölgeleme, risk yönetimi ve sakınım planı çalışmalarını, her tür ve ölçekte plan yapımı ve imar uygulaması işlerini ve dönüşüm uygulamalarını Bakanlığın bağlı, ilgili ve ilişkili kurum, kuruluş ve bunların iştirakleriyle ve 4734 sayılı Kanun kapsamındaki idareler ile akdedecekleri protokoller çerçevesinde 2886 sayılı Kanuna ve 4734 sayılı Kanuna tabi olmaksızın ortak hizmet uygulamaları suretiyle de gerçekleştirebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Riskli yapıların tespiti, tahliyesi ve yıktırma iş ve işlemleri ile değerleme işlemlerini engelleyenler hakkında, işlenen fiil ve hâlin durumuna göre 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun ilgili hükümleri uyarınca Cumhuriyet başsavcılığına suç duyurusunda bulunulur. Riskli yapıların tespiti, bu yapıların tahliyesi ve yıktırılması iş ve işlemlerine dair görevlerinin gereklerini yerine getirmeyen kamu görevlileri hakkında, tabi oldukları ceza ve disiplin hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bakanlık, Başkanlık, TOKİ ve İdare; bu Kanun kapsamındaki uygulamalarda, uygulama süresini aşmamak kaydı ile 657 sayılı Kanun ile diğer kanunların sözleşmeli personel çalıştırılmasına dair hükümlerine bağlı kalmaksızın, özel bilgi ve ihtisas gerektiren konularda sözleşmeli personel çalıştırabilir. Bu suretle çalıştırılacakların unvanı, sayısı, ücretleri ile diğer hususlar Cumhurbaşkanınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanun kapsamındaki işler ile ilgili olarak valilikler, belediyeler ve diğer kamu kurumları personelinden Başkanlık emrinde geçici olarak görevlendirilenler hakkında 657 sayılı Kanunun ek 8 inci maddesinin birinci fıkrasının (d) bendinde yer alan süre sınırlaması uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanun uyarınca yapılacak anlaşmaların usul ve esasları ile riskli alanlarda ve rezerv yapı alanlarında yürütülecek projelerin yapım işini üstlenecek yapı müteahhitlerinin sahip olmaları gereken asgari iş tecrübesi, teknik donanımı ve mali durumu Başkanlıkça belirlenir. Bu Kanun kapsamındaki alanlarda ve parsellerde yürütülecek projeler için yapım işini üstlenen yapı müteahhidinin yapı ruhsatı alınmadan önce; kapsamı, koşulları ve uygulama esasları Hazine ve Maliye Bakanlığınca belirlenen bina tamamlama sigortası yaptırması veya Başkanlıkça belirlenen diğer teminat ve şartları sağlaması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Riskli yapıların tespit edilmesine veya ettirilmesine dair usul ve esaslar, risklilik kriterleri, riskli yapıların tespitinde ve itirazların değerlendirilmesinde görev alacak teknik heyet ve diğer komisyonlar ile bu Kanunun uygulanmasına dair diğer usul ve esaslar, Başkanlıkça hazırlanacak yönetmelikler ile düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Riskli yapı tespitlerine karşı yapılacak itirazları inceleyip karara bağlayacak teknik heyetlerde üniversiteler tarafından görevlendirileceklere, fiilen görev yaptıkları her gün için, (4.000) gösterge rakamının memur aylık katsayısı ile çarpımı sonucunda bulunacak tutarda huzur hakkı ödenir. Bir ayda fiilen görev yapılan gün sayısının beşi aşması hâlinde, aşan günler için huzur hakkı ödenmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="9">
        <template>Türkiye Radyo-Televizyon Kurumu ile ulusal, bölgesel ve yerel yayın yapan özel televizyon kuruluşları ve radyolar, ayda en az doksan dakika afet, afet risklerinin azaltılması ve kentsel dönüşüm konularında uyarıcı ve eğitici mahiyette yayınlar yapmak zorundadır. Bu yayınlar, asgari otuz dakikası 17:00-22:00 saatleri arasında olmak üzere, 08:00-22:00 saatleri arasında yapılır ve yayınların kopyaları her ay düzenli olarak Radyo ve Televizyon Üst Kuruluna teslim edilir. Bu saatler dışında yapılan yayınlar, aylık doksan dakikalık süreye dâhil edilmez. Bu programlar, Başkanlık, Radyo ve Televizyon Üst Kurulu ile ilgili diğer kamu kurum ve kuruluşları ile bilimsel kuruluşlar, kamu kurumu niteliğindeki meslek kuruluşları veya sivil toplum kuruluşları tarafından hazırlanır veya hazırlatılır. Hazırlanan programların, Başkanlığın olumlu görüşü alındıktan sonra Radyo ve Televizyon Üst Kurulu tarafından radyo ve televizyonlarda yayınlanması sağlanır. Bu fıkra kapsamında yapılan yayınlar için herhangi bir bedel ödenmez. Bu yayınların ve sürelerinin denetimi Radyo ve Televizyon Üst Kurulunca yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>

    <mvz-madde no="4" başlık="" tür="EK">

        <template>Bu Kanun kapsamında açılan dönüşüm projeleri özel hesabı 31/12/2025 tarihi itibarıyla kapatılır. Bu tarih itibarıyla söz konusu hesapta bulunan nakit tutarları bir yandan Başkanlık bütçesine öz gelir, diğer yandan mevcut veya yeni açılacak bütçe tertiplerine Başkanlıkça ödenek kaydedilir. Özel hesaba ilişkin hak ve yükümlülükler Başkanlığa devredilir.</template>

    <mvz-madde no="1" başlık="Devir ve tahsislerin iptali" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>775, 5366 ve 5393 sayılı kanunlar ile 29/6/2001 tarihli ve 4706 sayılı Hazineye Ait Taşınmaz Malların Değerlendirilmesi ve Katma Değer Vergisi Kanununda Değişiklik Yapılması Hakkında Kanun ve diğer kanunlar kapsamındaki dönüşüm ve iyileştirme uygulamaları için TOKİ’ye, İdareye ve diğer kamu idarelerine tahsis ve devredilmiş olup da tahsisin yapıldığı veya mülkiyetin devredildiği tarihten itibaren iki yıl içinde dönüşüm ve iyileştirme uygulaması başlatılmayan taşınmazların tahsisleri resen kaldırılır ve devir işlemi de iptal edilmiş sayılarak, tapuda resen Hazine adına tescil ve Başkanlığın talebi üzerine bu Kanunun öngördüğü amaçlar için kullanılmak üzere Başkanlığa devredilir.</template>
      </mvz-fıkra>
