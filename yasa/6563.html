  <mvz-künye tür="kanun" no="6563" başlık="ELEKTRONİK TİCARETİN DÜZENLENMESİ HAKKINDA KANUN"
             tarih="23/10/2014" rgazete-tarih="5/11/2014" rgazete-sayı="29166"
             düstur-tertip="5" düstur-cilt="55" />  
  
  <mvz-madde no="1" başlık="Amaç ve kapsam">
    <mvz-fıkra no="1">
      <template>Bu Kanunun amacı, elektronik ticarete ilişkin esas ve usulleri düzenlemektir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu Kanun, ticari iletişimi, hizmet sağlayıcı ve aracı hizmet sağlayıcıların sorumluluklarını, elektronik iletişim araçlarıyla yapılan sözleşmeler ile elektronik ticarete ilişkin bilgi verme yükümlülüklerini ve uygulanacak yaptırımları kapsar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>14/9/1972 tarihli ve 1618 sayılı Seyahat Acentaları ve Seyahat Acentaları Birliği Kanunu, 14/10/1983 tarihli ve 2920 sayılı Türk Sivil Havacılık Kanunu, 28/3/2001 tarihli ve 4632 sayılı Bireysel Emeklilik Tasarruf ve Yatırım Sistemi Kanunu, 19/10/2005 tarihli ve 5411 sayılı Bankacılık Kanunu, 3/6/2007 tarihli ve 5684 sayılı Sigortacılık Kanunu, 21/11/2012 tarihli ve 6361 sayılı Finansal Kiralama, Faktoring, Finansman ve Tasarruf Finansman Şirketleri Kanunu, 6/12/2012 tarihli ve 6362 sayılı Sermaye Piyasası Kanunu, 20/6/2013 tarihli ve 6493 sayılı Ödeme ve Menkul Kıymet Mutabakat Sistemleri, Ödeme Hizmetleri ve Elektronik Para Kuruluşları Hakkında Kanun ve 5/11/2018 tarihli ve 5809 sayılı Elektronik Haberleşme Kanunuyla kuruluş ve faaliyetleri düzenlenen ve bu kanunlara göre yetkilendirilerek münhasıran yetkilendirildikleri konularda faaliyet gösterenler ile 14/3/2007 tarihli ve 5602 sayılı Şans Oyunları Hasılatından Alınan Vergi, Fon ve Payların Düzenlenmesi Hakkında Kanunun 3 üncü maddesinin birinci fıkrasının (ç) bendinde tanımlananlar ile bunların verdiği yetki dâhilinde münhasıran şans ve bahis oyunları alanında faaliyet gösterenler bu Kanunun uygulanmasında elektronik ticaret aracı hizmet sağlayıcı veya elektronik ticaret hizmet sağlayıcı kabul edilmez.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="Tanımlar">
    <mvz-fıkra no="1">
      <template>Bu Kanunun uygulanmasında;</template>
      <mvz-bent no="a">
        <template>Elektronik ticaret: Fiziki olarak karşı karşıya gelmeksizin, elektronik ortamda gerçekleştirilen çevrim içi iktisadi ve ticari her türlü faaliyeti,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Ticari iletişim: Alan adları ve elektronik posta adresi dışında, mesleki veya ticari faaliyet kapsamında kazanç sağlamaya yönelik olarak elektronik ticarete ilişkin her türlü iletişimi,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Ticari elektronik ileti: Telefon, çağrı merkezleri, faks, otomatik arama makineleri, akıllı ses kaydedici sistemler, elektronik posta, kısa mesaj hizmeti gibi vasıtalar kullanılarak elektronik ortamda gerçekleştirilen ve ticari amaçlarla gönderilen veri, ses ve görüntü içerikli iletileri,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Hizmet sağlayıcı: Elektronik ticaret faaliyetinde bulunan gerçek ya da tüzel kişileri,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Aracı hizmet sağlayıcı: Başkalarına ait iktisadi ve ticari faaliyetlerin yapılmasına elektronik ticaret ortamını sağlayan gerçek ve tüzel kişileri,</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Bakanlık: Ticaret Bakanlığını,</template>
      </mvz-bent>
      <mvz-bent no="f">
        <template>Elektronik ticaret aracı hizmet sağlayıcı: Elektronik ticaret pazar yerinde elektronik ticaret hizmet sağlayıcıların mal veya hizmetlerinin teminine yönelik sözleşme yapılmasına ya da sipariş verilmesine imkân sağlayan aracı hizmet sağlayıcıyı,</template>
      </mvz-bent>
      <mvz-bent no="g">
        <template>Elektronik ticaret hizmet sağlayıcı: Elektronik ticaret pazar yerinde ya da kendine ait elektronik ticaret ortamında mal veya hizmetlerinin teminine yönelik sözleşme yapan ya da sipariş alan hizmet sağlayıcıyı,</template>
      </mvz-bent>
      <mvz-bent no="ğ">
        <template>Elektronik ticaret ortamı: Elektronik ticaret faaliyetinde bulunulan internet sitesi, mobil site veya mobil uygulama gibi platformları,</template>
      </mvz-bent>
      <mvz-bent no="h">
        <template>Elektronik ticaret pazar yeri: Elektronik ticaret aracı hizmet sağlayıcının aracılık hizmetlerini sunduğu elektronik ticaret ortamını,</template>
      </mvz-bent>
      <mvz-bent no="ı">
        <template>Elektronik Ticaret Bilgi Sistemi (ETBİS): Elektronik ticaret hizmet sağlayıcı ve elektronik ticaret aracı hizmet sağlayıcıların kayıt altına alınması, elektronik ticaret verilerinin toplanması, bu verilerin işlenerek istatistiki bilgilerin üretilmesi amacıyla Bakanlık tarafından oluşturulan ve bu Kanun kapsamında kayıt ve bildirim yapılabilmesine imkân sağlayan bilgi sistemini,</template>
      </mvz-bent>
      <mvz-bent no="i">
        <template>Net işlem hacmi: İptal ve iadeler hariç olmak üzere, elektronik ticaret aracı hizmet sağlayıcı için aracılık hizmeti sunduğu elektronik ticaret pazar yerleri, elektronik ticaret hizmet sağlayıcı için ise elektronik ticaret pazar yeri niteliğini haiz olmayan kendine ait elektronik ticaret ortamları üzerinden belirli bir dönemde yapılan sözleşme ve verilen siparişler için düzenlenmesi gereken nihai fatura veya fatura yerine geçen belge değerleri toplamını,</template>
      </mvz-bent>
      <mvz-bent no="j">
        <template>Ekonomik bütünlük: Bir kişinin, bir ticaret şirketinin doğrudan veya dolaylı olarak paylarının en az yüzde yirmi beşine ya da oy haklarının çoğunluğuna veya onu yönetebilecek kararları alabilecek payına sahip olmasını, şirket sözleşmesi uyarınca yönetim organında karar alabilecek çoğunluğu oluşturan sayıda üyeyi seçme hakkını haiz olmasını, kendi oy haklarının yanında bir sözleşmeye dayanarak tek başına veya diğer pay sahipleriyle birlikte oy haklarının çoğunluğunu oluşturmasını, bir ticaret şirketini sözleşmeye bağlı olarak hâkimiyeti altında bulundurmasını veya bu hâllere bağlı olarak bu kişiyle bağlantılı tüm ticaret şirketleri ve bu kişiye ait işletmeler arasındaki ilişkiyi ya da pay sahibi olup olmadıklarına bakılmaksızın birden fazla ticaret şirketinin aynı kişi veya kişiler tarafından yönetilmesini,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>ifade eder.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="Bilgi verme yükümlülüğü">
    <mvz-fıkra no="1">
      <template>Hizmet sağlayıcı, elektronik iletişim araçlarıyla bir sözleşmenin yapılmasından önce;</template>
      <mvz-bent no="a">
        <template>Alıcıların kolayca ulaşabileceği şekilde ve güncel olarak tanıtıcı bilgilerini,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Sözleşmenin kurulabilmesi için izlenecek teknik adımlara ilişkin bilgileri,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Sözleşme metninin sözleşmenin kurulmasından sonra, hizmet sağlayıcı tarafından saklanıp saklanmayacağı ile bu sözleşmeye alıcının daha sonra erişiminin mümkün olup olmayacağı ve bu erişimin ne kadar süreyle sağlanacağına ilişkin bilgileri,</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Veri girişindeki hataların açık ve anlaşılır bir şekilde belirlenmesine ve düzeltilmesine ilişkin teknik araçlara ilişkin bilgileri,</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Uygulanan gizlilik kuralları ve varsa alternatif uyuşmazlık çözüm mekanizmalarına ilişkin bilgileri,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>sunar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hizmet sağlayıcı, varsa mensubu olduğu meslek odası ile meslekle ilgili davranış kurallarını ve bunlara elektronik olarak ne şekilde ulaşılabileceğini belirtir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Tarafların tüketici olmadığı hâllerde taraflar, birinci ve ikinci fıkralardaki düzenlemelerin aksini kararlaştırabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Hizmet sağlayıcı, sözleşme hükümlerinin ve genel işlem şartlarının alıcı tarafından saklanmasına imkan sağlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Birinci ve ikinci fıkralar, münhasıran elektronik posta yoluyla veya benzeri bireysel iletişim araçlarıyla yapılan sözleşmelere uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="Sipariş">
    <mvz-fıkra no="1">
      <template>Elektronik iletişim araçlarıyla verilen siparişlerde aşağıdaki esaslar geçerlidir:</template>
      <mvz-bent no="a">
        <template>Hizmet sağlayıcı, siparişin onaylanması aşamasında ve ödeme bilgilerinin girilmesinden önce, ödeyeceği toplam bedel de dâhil olmak üzere, sözleşmenin şartlarının alıcı tarafından açıkça görülmesini sağlar.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Hizmet sağlayıcı, alıcının siparişini aldığını gecikmeksizin elektronik iletişim araçlarıyla teyit eder.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Sipariş ve siparişin alındığının teyidi, tarafların söz konusu beyanlara erişiminin mümkün olduğu anda gerçekleşmiş sayılır.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hizmet sağlayıcı, sipariş verilmeden önce alıcıya, veri giriş hatalarını belirleyebilmesi ve düzeltebilmesi için uygun, etkili ve erişilebilir teknik araçları sunar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Tarafların tüketici olmadığı hâllerde taraflar, birinci ve ikinci fıkralardaki düzenlemelerin aksini kararlaştırabilirler.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Birinci fıkranın (a) ve (b) bentleri ile ikinci fıkra, münhasıran elektronik posta yoluyla veya benzeri bireysel iletişim araçlarıyla yapılan sözleşmelere uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="Ticari iletişime ilişkin esaslar">
    <mvz-fıkra no="1">
      <template>Ticari iletişimde:</template>
      <mvz-bent no="a">
        <template>Ticari iletişimin ve bu iletişimin adına yapıldığı gerçek ya da tüzel kişinin açıkça belirlenebilir olmasını sağlayan bilgiler sunulmalıdır.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>İndirim ve hediye gibi promosyonlar ile promosyon amaçlı yarışma veya oyunların bu niteliği açıkça belirlenebilmeli, bunlara katılımın ve bunlardan faydalanmanın şartlarına kolayca ulaşılabilmeli ve bu şartlar açık ve şüpheye yer bırakmayacak şekilde anlaşılır olmalıdır.</template>
      </mvz-bent>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="6" başlık="Ticari elektronik ileti gönderme şartı">
    <mvz-fıkra no="1">
      <template>Ticari elektronik iletiler, alıcılara ancak önceden onayları alınmak kaydıyla gönderilebilir. Bu onay, yazılı olarak veya her türlü elektronik iletişim araçlarıyla alınabilir. Kendisiyle iletişime geçilmesi amacıyla alıcının iletişim bilgilerini vermesi hâlinde, temin edilen mal veya hizmetlere ilişkin değişiklik, kullanım ve bakıma yönelik ticari elektronik iletiler için ayrıca onay alınmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Esnaf ve tacirlere önceden onay alınmaksızın ticari elektronik iletiler gönderilebilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="Ticari elektronik iletinin içeriği">
    <mvz-fıkra no="1">
      <template>Ticari elektronik iletinin içeriği, alıcıdan alınan onaya uygun olmalıdır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>İletide, hizmet sağlayıcının tanınmasını sağlayan bilgiler ile haberleşmenin türüne bağlı olarak telefon numarası, faks numarası, kısa mesaj numarası ve elektronik posta adresi gibi erişilebilir durumdaki iletişim bilgileri yer alır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İletide, haberleşmenin türüne bağlı olarak, iletinin konusu, amacı ve başkası adına yapılması hâlinde kimin adına yapıldığına ilişkin bilgilere de yer verilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="Alıcının ticari elektronik iletiyi reddetme hakkı">
    <mvz-fıkra no="1">
      <template>Alıcılar diledikleri zaman, hiçbir gerekçe belirtmeksizin ticari elektronik iletileri almayı reddedebilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Hizmet sağlayıcı ret bildiriminin, elektronik iletişim araçlarıyla kolay ve ücretsiz olarak iletilmesini sağlamakla ve gönderdiği iletide buna ilişkin gerekli bilgileri sunmakla yükümlüdür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Talebin ulaşmasını müteakip hizmet sağlayıcı üç iş günü içinde alıcıya elektronik ileti göndermeyi durdurur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="Hukuka aykırı içerik">
    <mvz-fıkra no="1">
      <template>Diğer kanunlarda aksine hüküm bulunmadıkça, aracı hizmet sağlayıcı, hizmet sağlayıcı tarafından sunulan içerik ve içeriğe konu mal veya hizmetle ilgili hukuka aykırı hususlardan sorumlu değildir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Elektronik ticaret aracı hizmet sağlayıcı, elektronik ticaret hizmet sağlayıcı tarafından sunulan içeriğin hukuka aykırı olduğundan haberdar olması hâlinde, bu içeriği gecikmeksizin yayımdan kaldırarak hukuka aykırı hususu ilgili kamu kurum ve kuruluşlarına bildirir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Elektronik ticaret aracı hizmet sağlayıcı, hak sahibinin, fikri ve sınai mülkiyet hakkı ihlaline dair bilgi ve belgeye dayanan şikâyeti üzerine, elektronik ticaret hizmet sağlayıcının şikâyete konu ürününü yayımdan kaldırarak durumu kendisine ve hak sahibine bildirir. Elektronik ticaret hizmet sağlayıcının, şikâyetin aksini gösteren bilgi ve belgeye dayanan itirazını elektronik ticaret aracı hizmet sağlayıcıya sunması üzerine şikâyete konu ürünü yeniden yayımlar. Şikâyet ve itirazda; ilgililerin açık kimlik ve adres bilgileri, ihtilafa konu ürün hakkındaki bilgiler, ürünün yayımdan kaldırılması veya yayımlanmasının gerekliliğine dair gerekçeler ile yönetmelikle belirlenen diğer hususlar yer alır. İlgililerin genel hükümlere göre adli ve idari mercilere başvurma hakları saklıdır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="10" başlık="Kişisel verilerin korunması" durum="mülga">
  </mvz-madde>
  <mvz-madde no="11" başlık="Bakanlık yetkisi">
    <mvz-fıkra no="1">
      <template>Bakanlık, bu Kanunun uygulanmasını ve elektronik ticaretin gelişimini sağlamaya, etkin ve adil rekabet ortamını korumaya, hizmet sağlayıcı ve aracı hizmet sağlayıcının faaliyetlerine yönelik düzenleme yapmaya ve aracılık sözleşmesinde yer verilmesi zorunlu unsurları belirlemeye yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bakanlık, bu Kanunun uygulanmasını sağlamak amacıyla denetim yapmaya ve denetim sonuçlarını açıklamaya, denetim sırasında özel uzmanlık veya teknik bilgi gerektiren durumlarda bilirkişi görevlendirmeye, bilirkişinin hak ve yükümlülükleri ile görevlendirilmesine ilişkin usul ve esasları yönetmelikle belirlemeye yetkilidir. Bilirkişiye verilecek ücretin tutarı Bakanlık ile Hazine ve Maliye Bakanlığınca birlikte tespit olunur ve bu ücret Bakanlık bütçesine konulacak ödenekten karşılanır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Bakanlıkça denetimle görevlendirilen personel, bu Kanun kapsamında Bakanlık yetkisine giren hususlarla ilgili olarak elektronik ortamda tutulanlar dâhil olmak üzere her türlü bilgi, belge ve defterleri istemeye, bunları incelemeye ve örneklerini almaya, ilgililerden yazılı ve sözlü bilgi almaya yetkili olup ilgililer istenilen bilgi, belge ve defterler ile elektronik kayıtlarını, bunların örneklerini noksansız ve gerçeğe uygun olarak vermek, yazılı ve sözlü bilgi taleplerini karşılamak ve her türlü yardım ve kolaylığı göstermekle yükümlüdür.  Aracı hizmet sağlayıcı ve hizmet sağlayıcı, bu Kanun kapsamındaki iş ve işlemlerine ilişkin bilgi, belge, defter ve elektronik kayıtlarını, iş veya işlemin gerçekleştiği tarihten itibaren on yıl süreyle saklamakla yükümlüdür.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kamu kurum ve kuruluşları, kamu kurumu niteliğindeki meslek kuruluşları ve diğer gerçek veya tüzel kişiler, elektronik ticaretin gelişiminin izlenebilmesi ve değerlendirilebilmesi amacıyla Bakanlık tarafından istenilen bilgileri Bakanlıkça oluşturulan sisteme bildirir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bakanlık, ticari elektronik ileti onaylarının alınmasına ve reddetme hakkının kullanılmasına imkân tanıyan bir elektronik sistem kurmaya veya kurdurmaya yetkilidir. Bu Kanun çerçevesinde alınan onaylar Bakanlıkça belirlenen süre içinde sisteme aktarılır. Sisteme aktarılmayan onaylar geçersiz kabul edilir. Alıcılar, sisteme kaydedilen onayları Bakanlıkça belirlenen süre içinde kontrol eder. Bu sürenin bitiminden sonra gönderilen ticari elektronik iletiler onaylı kabul edilir. Alıcılar tarafından reddetme hakkı bu sistem üzerinden kullanılır. Sistemin kurulması, onayların sisteme aktarılması, saklanması, reddetme hakkının sistem üzerinden kullanılması ve sistemin işleyişine ilişkin diğer usul ve esaslar yönetmelikle belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bakanlık, 3 üncü, 4 üncü, 5 inci, 6 ncı, 7 nci ve 8 inci maddelerde düzenlenen yükümlülüklerin aracı hizmet sağlayıcılara uygulanmasına ilişkin usul ve esasları belirlemeye yetkilidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">

    <mvz-fıkra no="3">

  <mvz-madde no="1" başlık="Elektronik ticarette haksız ticari uygulamalar" tür="EK">
    <mvz-fıkra no="1">
      <template>Elektronik ticarette haksız ticari uygulamada bulunulamaz. Elektronik ticaret aracı hizmet sağlayıcının, aracılık hizmeti sunduğu elektronik ticaret hizmet sağlayıcının ticari faaliyetlerini önemli ölçüde bozan, makul karar verme yeteneğini azaltan veya belirli bir kararı almaya zorlayarak normal şartlarda taraf olmayacağı bir ticari ilişkinin tarafı olmasına sebep olan uygulamalarının haksız olduğu kabul edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Aşağıdaki uygulamalar her durumda haksız ticari uygulama sayılır:</template>
      <mvz-bent no="a">
        <template>Mal veya hizmet satışı karşılığında elektronik ticaret hizmet sağlayıcıya yapılması gereken ödemenin, en geç satış bedelinin elektronik ticaret aracı hizmet sağlayıcının tasarrufuna girdiği ve siparişin alıcıya ulaştığı tarihten itibaren beş iş günü içinde eksiksiz yapılmaması.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Elektronik ticaret aracı hizmet sağlayıcı tarafından satış fiyatında tek taraflı değişiklik yapılması dâhil olmak üzere, elektronik ticaret hizmet sağlayıcının kampanyalı mal veya hizmet satışına zorlanması.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Elektronik ticaret hizmet sağlayıcıyla olan ticari ilişkinin koşullarının, yazılı şekilde veya elektronik ortamda yapılan aracılık sözleşmesiyle belirlenmemesi ya da bu sözleşmenin açık, anlaşılır ve elektronik ticaret hizmet sağlayıcı tarafından kolay erişilebilir olmasının sağlanmaması.</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Elektronik ticaret hizmet sağlayıcının aleyhine olacak şekilde aracılık sözleşmesi hükümlerinde geçmişe yönelik veya tek taraflı değişiklik yapılması ya da buna imkân sağlayan herhangi bir hükme aracılık sözleşmesinde yer verilmesi.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Herhangi bir hizmet verilmediği veya verilen hizmetin türü ve hizmet bedelinin tutar ya da oranı aracılık sözleşmesinde belirtilmediği hâlde elektronik ticaret hizmet sağlayıcıdan bedel alınması.</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Aracılık sözleşmesinde herhangi bir nesnel ölçüte yer verilmediği hâlde ya da kamu kurumlarına veya adli mercilere başvuruda bulunulduğu gerekçesiyle elektronik ticaret hizmet sağlayıcının sıralama ya da tavsiye sisteminde geriye düşürülmesi, elektronik ticaret hizmet sağlayıcıya sunulan hizmetin kısıtlanması, askıya alınması veya sonlandırılması.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>İkinci fıkranın (a) bendinin uygulanmasında, elektronik ticaret aracı hizmet sağlayıcının ekonomik bütünlük içinde bulunduğu ödeme hizmeti sağlayıcısına yapılan ödemeler, elektronik ticaret aracı hizmet sağlayıcıya yapılmış kabul edilir.</template>
    </mvz-fıkra>

  <mvz-madde no="2" başlık="Elektronik ticaret aracı hizmet sağlayıcının yükümlülükleri" tür="EK">
    <mvz-fıkra no="1">
      <template>Elektronik ticaret aracı hizmet sağlayıcı aşağıdaki hususlara uymakla yükümlüdür:</template>
      <mvz-bent no="a">
        <template>Aracılık hizmeti sunduğu elektronik ticaret pazar yerlerinde kendisinin veya ekonomik bütünlük içinde bulunduğu kişilerin markasını taşıyan ya da marka kullanım hakkını haiz olduğu malları satışa sunamaz veya bu malların satışına aracılık edemez. Bu malların, farklı elektronik ticaret ortamında satışa sunulması hâlinde bu ortamlar arasında erişim imkânı sunamaz ve birbirinin tanıtımını yapamaz. Bu hüküm, toplam satış hasılatının yarısından fazlasını elektronik ticaret dışındaki satışlardan elde eden kişilerin markasını taşıyan veya marka kullanım hakkını haiz olduğu mallar hakkında uygulanmaz.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Elektronik ticaret hizmet sağlayıcının 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanunu kapsamında düzenlemesi gereken belgelerdeki bilgilere, satışın yapıldığı elektronik ticaret pazar yerinde yer verebilmesine imkân sağlar.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Elektronik ticaret aracı hizmet sağlayıcı veya elektronik ticaret hizmet sağlayıcının yazılı şekilde ya da elektronik ortamda önceden olumlu irade beyanını almadan bunların ETBİS’e kayıtlı alan adlarının ana unsurunu oluşturan tescilli markalarını kullanarak çevrim içi arama motorlarında pazarlama ve tanıtım faaliyetinde bulunamaz.</template>
      </mvz-bent>
      <mvz-bent no="ç">
        <template>Elektronik ticaret aracı hizmet sağlayıcı, elektronik ticaret hizmet sağlayıcının tanıtıcı bilgilerini, kendisinden temin ettiği belgeler üzerinden veya ilgili kurumların erişime açık elektronik sistemlerinden doğrular.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bir takvim yılındaki net işlem hacmi on milyar Türk lirasının üzerinde olan elektronik ticaret aracı hizmet sağlayıcı, birinci fıkrada belirtilen yükümlülüklere ilave olarak aşağıdaki hususlara uymakla yükümlüdür:</template>
      <mvz-bent no="a">
        <template>Elektronik ticaret hizmet sağlayıcı ve alıcıdan elde ettiği verileri, yalnızca aracılık hizmetlerinin sunulması amacıyla kullanır ve aracılık hizmeti sunduğu elektronik ticaret pazar yerleri veya diğer elektronik ticaret ortamlarında elektronik ticaret hizmet sağlayıcılarla rekabet ederken kullanamaz.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Elektronik ticaret hizmet sağlayıcının satışları dolayısıyla elde ettiği verileri bedelsiz taşımasına ve bu veriler ile bunlardan elde ettiği işlenmiş verilere bedelsiz ve etkin şekilde erişim sağlamasına teknik imkân sunar.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Net işlem hacmine dâhil edilen elektronik ticaret ortamları hariç olmak üzere, kendine ait elektronik ticaret ortamları arasında erişim imkânı sunamaz ve bu ortamlarda birbirinin tanıtımını yapamaz.</template>

    <mvz-fıkra no="5">
      <template>Lisans ücreti Bakanlıkça peşin olarak tahsil edilir. Tahsil edilen tutarlar genel bütçeye gelir kaydedilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Bu maddede belirtilen parasal eşikler her yıl ETBİS verileri kullanılarak hesaplanan elektronik ticaret hacminin yıllık değişim oranına göre artırılır. Artırımın yapıldığı tarihten önceki takvim yılına ilişkin net işlem hacmine uygulanacak bu eşikler ile elektronik ticaret hacminin yıllık değişim oranı en geç şubat ayı içinde Bakanlığın internet sitesinde ilan edilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Lisans ücretinin hesaplanmasında;</template>
      <mvz-bent no="a">
        <template>Elektronik ticaret aracı hizmet sağlayıcı ve ekonomik bütünlük içinde bulunduğu elektronik ticaret aracı hizmet sağlayıcıların elektronik ticaret pazar yerleri üzerinden yurt dışına yapılan satışlar hesaba dâhil edilmez.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Elektronik ticaret aracı hizmet sağlayıcının net işlem hacminin, ETBİS verileri kullanılarak hesaplanan elektronik ticaret aracı hizmet sağlayıcı ve elektronik ticaret hizmet sağlayıcıların net işlem hacimleri toplamının yüzde yirmisinden fazla olmaması şartıyla, izleyen takvim yılında gerçekleştirilen;</template>
        <mvz-altbent no="1">
          <template>(a) bendinde belirtilen satış tutarının,</template>
        </mvz-altbent>
        <mvz-altbent no="2">
          <template>Yatırımların proje bazında desteklenmesine dair mevzuat uyarınca Sanayi ve Teknoloji Bakanlığından yatırım teşvik belgesi alınarak gerçekleştirilen yatırım harcaması tutarının,</template>
        </mvz-altbent>
      </mvz-bent>
      <mvz-bent no="0">
        <template>iki katı o takvim yılına ilişkin net işlem hacminden indirilir.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>(b) bendinde belirtilen haddin aşılıp aşılmadığının tespitinde yüzde on beşin altındaki had aşımları dikkate alınmaz.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Lisansın verilmesi ve yenilenmesi, lisans ücretinin ödenmesi ve elektronik ticaret hacminin yıllık değişim oranının belirlenmesi ile bu maddenin uygulanmasına ilişkin usul ve esaslar bu Kanun hükümlerine göre çıkarılan yönetmelikle düzenlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Bu madde, münhasıran elektronik ticaret aracı hizmet sağlayıcının markasını taşıyan ürünlerin bayilik ve acentelik gibi sözleşmeler kapsamında satışa sunulduğu elektronik ticaret pazar yerleri hakkında uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="Onay alınarak oluşturulan veri tabanları" tür="GEÇİCİ">
    <mvz-fıkra no="1">
      <template>Bu Kanunun yürürlüğe girdiği tarihten önce, ticari elektronik ileti gönderilmesi amacıyla onay alınarak oluşturulmuş olan veri tabanları hakkında 6 ncı maddenin birinci fıkrası uygulanmaz.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="İntibak süreci" tür="GEÇİCİ">
    <mvz-fıkra no="1">
      <template>Bu maddeyi ihdas eden Kanunun yayımlandığı tarih itibarıyla;</template>
      <mvz-bent no="a">
        <template>Aracılık hizmeti sunduğu elektronik ticaret pazar yerlerinde kendisinin veya ekonomik bütünlük içinde bulunduğu kişilerin markasını taşıyan veya kullanım hakkını haiz olduğu malları satışa sunan veya satışına aracılık eden elektronik ticaret aracı hizmet sağlayıcılar, ek 2 nci maddenin birinci fıkrasının (a) bendinde,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>5411 sayılı Kanun kapsamında banka veya 6493 sayılı Kanun kapsamında elektronik para kuruluşu olarak yetkilendirilen işletmelerin ekonomik bütünlük içinde bulunduğu elektronik ticaret aracı hizmet sağlayıcılar, ek 2 nci maddenin dördüncü fıkrasının (a) ve (b) bentlerinde,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>4925 sayılı Kanun kapsamında eşya taşımacılığı faaliyetinde bulunan işletmeler, 655 sayılı Kanun Hükmünde Kararname kapsamında taşıma işleri organizatörü veya 6475 sayılı Kanun kapsamında posta hizmet sağlayıcı olarak yetkilendirilen işletmelerin ekonomik bütünlük içinde bulunduğu elektronik ticaret aracı hizmet sağlayıcılar, ek 2 nci maddenin dördüncü fıkrasının (c) bendinde,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>yer alan yükümlülüklere 1/1/2024 tarihine kadar uyum sağlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu maddeyi ihdas eden Kanunun yürürlüğe girdiği tarihten önce yapılan ve aynı tarihten itibaren altı ay içinde bu Kanuna uygun hâle getirilmeyen aracılık sözleşmelerinin ilgili hükümleri geçersizdir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Elektronik ticaret hizmet sağlayıcının ek 3 üncü, elektronik ticaret aracı hizmet sağlayıcının ek 4 üncü madde kapsamındaki lisans alma yükümlülüğü 1/1/2025 tarihinden itibaren yerine getirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Ek 2 nci, ek 3 üncü ve ek 4 üncü maddelerde belirtilen eşikler, 2023 yılının Şubat ayı içinde Cumhurbaşkanı tarafından yarısına kadar artırılabilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>2024 yılına ilişkin lisans ücretinin hesaplanmasında, ek 4 üncü maddenin yedinci fıkrasının (b) bendinin alt bentlerinde belirtilen tutarların dört katı elektronik ticaret aracı hizmet sağlayıcının net işlem hacminden indirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>2025 yılına ilişkin lisans ücretinin hesaplanmasında, ek 4 üncü maddenin yedinci fıkrasının (b) bendinin alt bentlerinde belirtilen tutarların üç katı elektronik ticaret aracı hizmet sağlayıcının net işlem hacminden indirilir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="15" başlık="Yürürlük">

      <template>Bu Kanun 1/5/2015 tarihinde yürürlüğe girer.</template>
