  <mvz-künye tür="kanun" no="5378" başlık="ENGELLİLER HAKKINDA KANUN"
             tarih="1/7/2005" rgazete-tarih="7/7/2005" rgazete-sayı="25868"
             düstur-tertip="5" düstur-cilt="44" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam, Tanımlar ve Genel Esaslar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; engellilerin temel hak ve özgürlüklerden faydalanmasını teşvik ve temin ederek ve doğuştan sahip oldukları onura saygıyı güçlendirerek toplumsal hayata diğer bireylerle eşit koşullarda tam ve etkin katılımlarının sağlanması ve engelliliği önleyici tedbirlerin alınması için gerekli düzenlemelerin yapılmasını sağlamaktır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun engellileri, ailelerini, engellilere yönelik hizmet veren kurum ve kuruluşlar ile diğer ilgilileri kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanmasında;</template>
        <mvz-bent no="a">
          <template>Doğrudan ayrımcılık: Engelliliğe dayalı ayrımcılık temeline dayanan ve engellinin hak ve özgürlüklerden karşılaştırılabilir durumdakilere kıyasla eşit şekilde yararlanmasını engelleyen, kısıtlayan veya zorlaştıran her türlü farklı muameleyi,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Dolaylı ayrımcılık: Görünüşte ayrımcı olmayan her türlü eylem, işlem ve uygulamalar sonucunda engelliliğe dayalı ayrımcılık temeliyle bağlantılı olarak, engellinin hak ve özgürlüklerden yararlanması bakımından nesnel olarak haklılaştırılamayan dezavantajlı bir konuma sokulmasını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Engelli: Fiziksel, zihinsel, ruhsal ve duyusal yetilerinde çeşitli düzeyde kayıplarından dolayı topluma diğer bireyler ile birlikte eşit koşullarda tam ve etkin katılımını kısıtlayan tutum ve çevre koşullarından etkilenen bireyi,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Engelliliğe dayalı ayrımcılık: Siyasi, ekonomik, sosyal, kültürel, medeni veya başka herhangi bir alanda insan hak ve temel özgürlüklerinin tam ve diğerleri ile eşit koşullar altında kullanılması veya bunlardan yararlanılması önünde engelliliğe dayalı olarak gerçekleştirilen her türlü ayrım, dışlama veya kısıtlamayı,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Engellilik durumu: Bireyin engelliliğini ve engellilikten kaynaklanan özel gereksinimlerini, uluslararası yöntemleri temel alarak belirleyen derecelendirmeler, sınıflandırmalar ve tanılamaları,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Erişilebilirlik: Binaların, açık alanların, ulaşım ve bilgilendirme hizmetleri ile bilgi ve iletişim teknolojisinin, engelliler tarafından güvenli ve bağımsız olarak ulaşılabilir ve kullanılabilir olmasını,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Erişilebilirlik standartları: Türk Standardları Enstitüsünün erişilebilirlikle ilgili yayımladığı standartları,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Habilitasyon: Engellinin bireysel ve toplumsal ihtiyaçlarını karşılayabilmesini ve yaşamını bağımsız bir şekilde sürdürebilmesini sağlamayı amaçlayan fiziksel, sosyal, zihinsel ve mesleki beceriler kazandırmaya yönelik hizmetleri,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Korumalı işyeri: İş gücü piyasasına kazandırılmaları güç olan zihinsel veya ruhsal engellilere mesleki rehabilitasyon sağlamak ve istihdam oluşturmak amacıyla Devlet tarafından teknik ve mali yönden desteklenen ve çalışma ortamı özel olarak düzenlenen işyerini,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Makul düzenleme: Engellilerin insan haklarını ve temel özgürlüklerini tam ve diğer bireylerle eşit şekilde kullanmasını veya bunlardan yararlanmasını sağlamak üzere belirli bir durumda ihtiyaç duyulan, ölçüsüz veya aşırı bir yük getirmeyen, gerekli ve uygun değişiklik ve tedbirleri,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Rehabilitasyon: Herhangi bir nedenle oluşan engelin etkilerini mümkün olan en az düzeye indirmeyi ve engellinin hayatını bağımsız bir şekilde sürdürebilmesini sağlamayı amaçlayan fiziksel, sosyal, zihinsel ve mesleki beceriler geliştirmeye yönelik hizmetleri,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Umuma açık hizmet veren yapı: Kamu hizmeti için kullanılan resmî binalar, ibadet yerleri, özel eğitim ve özel sağlık tesisleri; sinema, tiyatro, opera, müze, kütüphane, konferans salonu gibi kültürel binalar ile gazino, düğün salonu gibi eğlence yapıları; otel, özel yurt, iş hanı, büro, pasaj, çarşı gibi ticari yapılar; spor tesisleri, genel otopark ve buna benzer umuma ait binaları,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Genel esaslar">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamında bulunan hizmetlerin yerine getirilmesinde;</template>
        <mvz-bent no="a">
          <template>Engellilerin insan onur ve haysiyetinin dokunulmazlığı temelinde, kendi seçimlerini yapma özgürlüğünü ve bağımsızlığını kapsayacak şekilde bireysel özerkliğine saygı gösterilmesi esastır.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Engelliliğe dayalı ayrımcılık yapılamaz, ayrımcılıkla mücadele engellilere yönelik politikaların temel esasıdır.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Engellilerin tüm hak ve hizmetlerden yararlanması için fırsat eşitliğinin sağlanması esastır.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Engellilerin bağımsız yaşayabilmeleri ve topluma tam ve etkin katılımları için erişilebilirliğin sağlanması esastır.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Engellilerin ve engelliliğin her tür istismarının önlenmesi esastır.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Engellilere yönelik hizmetlerin sunumunda aile bütünlüğünün korunması esastır.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Engeli olan çocuklara yönelik hizmetlerde çocuğun üstün yararının gözetilmesi esastır.</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Engeli olan kadın ve kız çocuklarının çok yönlü ayrımcılığa maruz kalmaları önlenerek hak ve özgürlüklerden yararlanmalarının sağlanması esastır.</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Engellilere yönelik politika oluşturma, karar alma ve hizmet sunumu süreçlerinde engellilerin, ailelerinin ve engellileri temsil eden sivil toplum kuruluşlarının katılımının sağlanması esastır.</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Engellilere yönelik mevzuat düzenlemelerinde Aile ve Sosyal Politikalar Bakanlığının görüşü alınır.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4/A" başlık="Ayrımcılık">
      <mvz-fıkra no="1">
        <template>Doğrudan ve dolaylı ayrımcılık dâhil olmak üzere engelliliğe dayalı her türlü ayrımcılık yasaktır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Eşitliği sağlamak ve ayrımcılığı ortadan kaldırmak üzere engellilere yönelik makul düzenlemelerin yapılması için gerekli tedbirler alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Engellilerin hak ve özgürlüklerden tam ve eşit olarak yararlanmasını sağlamaya yönelik alınacak özel tedbirler ayrımcılık olarak değerlendirilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4/B" başlık="Topluma dâhil olma">
      <mvz-fıkra no="1">
        <template>Engellilerin toplumdan tecrit edilmeleri ve ayrı tutulmaları önlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Engellilerin diğer bireylerle eşit koşullarda bağımsız olarak toplum içinde yaşamaları esas olup, özel bir yaşama düzenine zorlanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Engellilerin topluma dâhil olmaları ve toplum içinde yaşamaları amacıyla bireysel destek hizmetleri de dâhil olmak üzere ihtiyaç duydukları toplum temelli destek hizmetlerine erişimleri sağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Engellilik Durumu, Destek ve Bakım, Habilitasyon ve Rehabilitasyon, İstihdam, Eğitim ve Öğretim, Erişilebilirlik">
    <mvz-madde no="5" başlık="Engellilik durumu">
      <mvz-fıkra no="1">
        <template>Bireyin engelliliğini ve engellilikten kaynaklanan özel ihtiyaçlarını belirleyen derecelendirmeler, sınıflandırmalar ve tanılamalarda uluslararası temel yöntemler esas alınır. Engellilik durumunun tespit ve uygulama esasları, Çalışma ve Sosyal Güvenlik Bakanlığı ve Millî Eğitim Bakanlığının görüşleri alınarak Aile ve Sosyal Politikalar Bakanlığı, Maliye Bakanlığı ve Sağlık Bakanlığınca müştereken çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Destek ve bakım">
      <mvz-fıkra no="1">
        <template>Engellilerin öncelikle bulundukları ortamda bağımsız yaşayabilmeleri için durumlarına uygun olarak gerekli psikososyal destek ve bakım hizmetleri sunulur. Destek ve bakım hizmetlerinin sunumunda kişinin biyolojik, fiziksel, psikolojik, sosyal, kültürel ve manevi ihtiyaçları ailesi de gözetilerek dikkate alınır. Destek ve bakım hizmetlerinin standardizasyonu, geliştirilmesi ve yaygınlaştırılması için gerekli olan çalışmalar Aile ve Sosyal Politikalar Bakanlığınca yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Erişilebilirlik">
      <mvz-fıkra no="1">
        <template>Yapılı çevrede engellilerin erişebilirliğinin sağlanması için planlama, tasarım, inşaat, imalat, ruhsatlandırma ve denetleme süreçlerinde erişilebilirlik standartlarına uygunluk sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Özel ve kamu toplu taşıma sistemleri ile sürücü koltuğu hariç dokuz veya daha fazla koltuğu bulunan özel ve kamu toplu taşıma araçlarının engellilerin erişebilirliğine uygun olması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bilgilendirme hizmetleri ile bilgi ve iletişim teknolojisinin engelliler için erişilebilir olması sağlanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Hizmet sunumu" durum="mülga">
    </mvz-madde>
    <mvz-madde no="9" başlık="Bakım çeşitleri" durum="mülga">
    </mvz-madde>
    <mvz-madde no="10" başlık="Habilitasyon ve rehabilitasyon">
      <mvz-fıkra no="1">
        <template>Toplumsal hayata katılım ve eşitlik temelinde engellilere habilitasyon ve rehabilitasyon hizmetleri verilir. Habilitasyon ve rehabilitasyon kararının alınması, planlanması, yürütülmesi ve sonlandırılması dâhil her aşamasında engelli ve ailesinin aktif ve etkin katılımı sağlanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Habilitasyon ve rehabilitasyon hizmetlerinin mümkün olan en erken evrede başlaması ve engellinin yerleşim yerine en yakın yerde verilmesi esastır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Habilitasyon ve rehabilitasyon hizmetlerinde ihtiyaç duyulan personelin yetiştirilmesine yönelik eğitim programları geliştirilir. Habilitasyon ve rehabilitasyonda kullanılan yardımcı araç gereçlere, destek teknolojilerine ve bunlara ilişkin bilgiye erişebilirliğin sağlanması için gerekli tedbirler alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Erken tanı ve koruyucu hizmetler">
      <mvz-fıkra no="1">
        <template>Yeni doğan, erken çocukluk ve çocukluğun her dönemi fiziksel, işitsel, duyusal, sosyal, ruhsal ve zihinsel gelişimlerinin izlenmesi, genetik geçişli ve engelliliğe neden olabilecek hastalıkların erken teşhis edilmesinin sağlanması, engelliliğin önlenmesi, var olan engelliliğin şiddetinin olabilecek en düşük seviyeye çekilmesi ve ilerlemesinin durdurulmasına ilişkin çalışmalar Sağlık Bakanlığınca planlanır ve yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="İş ve meslek analizi" durum="mülga">
    </mvz-madde>
    <mvz-madde no="13" başlık="Meslekî habilitasyon ve rehabilitasyon">
      <mvz-fıkra no="1">
        <template>Engellilerin meslek seçebilmesi ve bu alanda eğitim alabilmesi için gerekli tedbirler alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Çalışma ve Sosyal Güvenlik Bakanlığınca yapılan iş ve meslek analizleri doğrultusunda engelliler için Millî Eğitim Bakanlığı ve Çalışma ve Sosyal Güvenlik Bakanlığınca mesleki habilitasyon, rehabilitasyon ve eğitim programları geliştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Engellilerin mesleki habilitasyon ve rehabilitasyon hizmetleri, kamu kurum ve kuruluşları ile belediyeler ve diğer gerçek veya tüzel kişiler tarafından da gerçekleştirilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu maddeye ilişkin usul ve esaslar, Aile ve Sosyal Politikalar Bakanlığı, Millî Eğitim Bakanlığı ve Çalışma ve Sosyal Güvenlik Bakanlığınca müştereken çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="14" başlık="İstihdam">
      <mvz-fıkra no="1">
        <template>Engellilerin iş gücü piyasası ve çalışma ortamında sürdürülebilir istihdamı için kendi işini kurmaya rehberlik ve mesleki danışmanlık hizmetlerinin geliştirilmesi de dâhil olmak üzere gerekli tedbirler alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İşe başvuru, alım, önerilen çalışma süreleri ve şartları ile istihdamın sürekliliği, kariyer gelişimi, sağlıklı ve güvenli çalışma koşulları dâhil olmak üzere istihdama ilişkin hiçbir hususta engelliliğe dayalı ayrımcı uygulamalarda bulunulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Çalışan engellilerin aleyhinde sonuç doğuracak şekilde, engelinden dolayı diğer kişilerden farklı muamelede bulunulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Çalışan veya iş başvurusunda bulunan engellilerin karşılaşabileceği engel ve güçlükleri ortadan kaldırmaya yönelik istihdam süreçlerindeki önlemlerin alınması ve engellilerin çalıştığı iş yerlerinde makul düzenlemelerin, bu konuda görev, yetki ve sorumluluğu bulunan kurum ve kuruluşlar ile işverenler tarafından yapılması zorunludur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Engellilik durumları sebebiyle iş gücü piyasasına kazandırılmaları güç olan engellilerin istihdam edildiği korumalı işyerlerinin statüsü ve bu işyerleriyle ilgili usul ve esaslar Çalışma ve Sosyal Güvenlik Bakanlığı, Maliye Bakanlığı ve Aile ve Sosyal Politikalar Bakanlığınca müştereken çıkarılan yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Eğitim ve öğretim">
      <mvz-fıkra no="1">
        <template>Hiçbir gerekçeyle engellilerin eğitim alması engellenemez. Engelliler, özel durumları ve farklılıkları dikkate alınarak, yaşadıkları çevrede bütünleştirilmiş ortamlarda, eşitlik temelinde, hayat boyu eğitim imkânından ayrımcılık yapılmaksızın yararlandırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Genel eğitim sistemi içinde engellilerin her seviyede eğitim almasını sağlayacak bütünleştirici planlamalara yer verilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Örgün eğitim programlarına farklı nedenlerle geç başlamış engellilerin bu eğitime dâhil edilmesi için gerekli tedbirler alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Üniversite öğrencilerinden engelli olanların öğrenime etkin katılımlarını sağlamak amacıyla Yükseköğretim Kurulu koordinasyonunda, yükseköğretim kurumları bünyesinde, engellilere uygun araç-gereç ve ders materyallerinin, uygun eğitim, araştırma ve barınma ortamlarının temini ile eğitim süreçlerinde yaşadıkları sorunların çözümü gibi konularda çalışma yapmak üzere Engelliler Danışma ve Koordinasyon Merkezleri kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Engelliler Danışma ve Koordinasyon Merkezinin çalışma usul ve esasları Aile ve Sosyal Politikalar Bakanlığı, Millî Eğitim Bakanlığı ve Yükseköğretim Kurulunca müştereken çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>İşitme engellilerin eğitim ve iletişimlerinin sağlanması amacıyla Türk işaret dili sistemi oluşturulur. Bu sistemin oluşturulmasına, geliştirilmesine ve uygulanmasına yönelik çalışmaların esas ve usulleri Aile ve Sosyal Politikalar Bakanlığının koordinatörlüğünde, Millî Eğitim Bakanlığı ve Türk Dil Kurumu Başkanlığınca müştereken çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Engellilerin her türlü eğitim, sosyal ve kültürel ihtiyaçlarını karşılamak üzere kabartma yazılı, sesli, elektronik kitap; alt yazılı, işaret dili tercümeli ve sesli betimlemeli film ve benzeri materyal temin edilmesine ilişkin gerekli işlemler Millî Eğitim Bakanlığı ile Kültür ve Turizm Bakanlığınca yürütülür.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Eğitsel değerlendirme">
      <mvz-fıkra no="1">
        <template>Bireylerin eğitsel değerlendirme, tanılama ve yönlendirilmesi ile ilgili iş ve işlemler rehberlik ve araştırma merkezi bünyesinde oluşturulan Özel Eğitim Değerlendirme Kurulu tarafından yapılır. Bu sürecin her aşamasında aile bilgilendirilerek görüşü alınır ve sürece katılımı sağlanır. Eğitsel değerlendirme ve tanılama sonucunda özel eğitime ihtiyacı olduğu belirlenen bireyler için Özel Eğitim Değerlendirme Kurulunca rapor hazırlanır ve eğitim planı geliştirilir. Bu planlama her yıl revize edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Özel Eğitim Değerlendirme Kurulu, özel eğitime ihtiyacı olan bireyleri ilgi, istek, gelişim özellikleri, akademik disiplin alanlarındaki yeterlilikleri ile eğitim ihtiyaçları doğrultusunda örgün ve yaygın eğitim kurumlarına yönlendirir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurulun teşkili ile çalışma usul ve esasları Aile ve Sosyal Politikalar Bakanlığı ile Millî Eğitim Bakanlığınca müştereken çıkarılan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>

    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunda öngörülen yönetmelikler Kanunun yayımı tarihinden itibaren bir yıl içerisinde yürürlüğe konulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Kamu kurum ve kuruluşlarına ait mevcut resmî yapılar, mevcut tüm yol, kaldırım, yaya geçidi, açık ve yeşil alanlar, spor alanları ve benzeri sosyal ve kültürel alt yapı alanları ile gerçek ve tüzel kişiler tarafından yapılmış ve umuma açık hizmet veren her türlü yapılar bu Kanunun yürürlüğe girdiği tarihten itibaren sekiz yıl içinde engellilerin erişebilirliğine uygun duruma getirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Büyükşehir belediyeleri ve belediyeler, şehir içinde kendilerince sunulan ya da denetimlerinde olan sürücü koltuğu hariç dokuz veya daha fazla koltuğu bulunan araçlarla sağlanan toplu taşıma hizmetlerinin engellilerin erişilebilirliğine uygun olması için gereken tedbirleri alır. Mevcut özel ve kamu toplu taşıma araçları, bu Kanunun yürürlüğe girdiği tarihten itibaren sekiz yıl içinde, sürücü koltuğu hariç dokuz ila on altı oturma yeri olan araçlarla verilen toplu taşıma hizmetleri, turizm taşımacılığı yapılan araçlarla sağlanan taşıma hizmetleri ve özel ve kamu şehirler arası toplu taşıma hizmetleri ile yolcu gemileri 7/7/2018 tarihine kadar engelliler için erişilebilir duruma getirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>7/7/2018 tarihine kadar, karayolu ile turizm taşımacılığı yapan veya şehirler arası toplu taşıma hizmeti veren gerçek ve tüzel kişiler, engelli bireyin erişilebilir toplu taşıma hizmeti sağlanmasına ilişkin talebini azami yetmiş iki saat içinde karşılamakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>7/7/2018 tarihine kadar, servis taşımacılığı yapan gerçek ve tüzel kişiler, engelli personel veya öğrenciye talep hâlinde erişilebilir taşıma hizmetini sağlamakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu fıkranın yürürlüğe girdiği tarihten sonra üretilen şehirler arası ve uluslararası yolcu taşımacılığı ile servis ve turizm taşımacılığı yapan araçlar dışında şehir içi yolcu taşıma hizmeti yapan araçlardan erişilebilir olmayanlara yolcu taşıma hizmeti için yetki belgesi, izin ve çalışma ruhsatı verilmez.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Şehirler arası yolcu taşıma hizmeti ile şehir içi servis ve turizm taşımacılığı hizmetinin erişilebilir hâle getirilmesi için usul ve esaslar Bilim, Sanayi ve Teknoloji Bakanlığı ile Ulaştırma, Denizcilik ve Haberleşme Bakanlığının görüşleri alınmak suretiyle Aile ve Sosyal Politikalar Bakanlığınca bu fıkranın yürürlük tarihinden itibaren bir yıl içinde çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Bu Kanunun geçici 2 nci maddesi ile bu maddede belirtilen erişilebilirlik standartlarının ve yükümlülüklerinin uygulanmasının izlenmesi ve denetimi her ilde Aile ve Sosyal Politikalar, Bilim, Sanayi ve Teknoloji, İçişleri, Çevre ve Şehircilik, Ulaştırma, Denizcilik ve Haberleşme Bakanlıkları ile engelliler ile ilgili konfederasyonların temsilcilerinden oluşan komisyon tarafından yapılır. İhtiyaç halinde birden fazla komisyon kurulabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Sürenin bitiminden itibaren öngörülen yükümlülüklerini yerine getirmediği denetim komisyonlarınca tespit edilen umuma açık hizmet veren her türlü yapılar ve açık alanlar ile toplu taşıma araçlarının sahibi olan gerçek ve özel hukuk tüzel kişileri ve ikinci, üçüncü fıkralar ile beşinci fıkra kapsamında yürürlüğe konulan yönetmelikle öngörülen yükümlülüklerini yerine getirmediği denetim komisyonlarınca tespit edilen gerçek ve özel hukuk tüzel kişilerine Aile ve Sosyal Politikalar Bakanlığı tarafından her bir tespit için bin Türk Lirasından beş bin Türk Lirasına kadar idari para cezası uygulanır. Bu şekilde bir yıl içinde uygulanacak idari para cezasının tutarı ellibin lirayı geçemez. İkinci ve üçüncü fıkrada öngörülen yükümlülüklerini veya geçici 2 ve 3 üncü maddelerde belirtilen sürelerin bitiminden itibaren öngörülen yükümlülüklerini yerine getirmediği denetim komisyonlarınca tespit edilen büyükşehir belediyeleri, belediyeler ve diğer kamu kurum ve kuruluşlarına Aile ve Sosyal Politikalar Bakanlığı tarafından her bir tespit için beşbin Türk Lirasından yirmibeşbin Türk Lirasına kadar idari para cezası uygulanır. Bu şekilde bir yıl içinde uygulanacak idari para cezasının tutarı beşyüz bin lirayı geçemez. Bu maddeye göre verilen idari para cezaları tebliğinden itibaren bir ay içerisinde ödenir. Genel bütçeye gelir kaydedilen idari para cezası tutarları dikkate alınarak erişilebilirlik konusundaki projelerde kullanılmak üzere Aile ve Sosyal Politikalar Bakanlığı bütçesinde ödenek öngörülür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu maddenin uygulanmasına ilişkin usul ve esaslar; Bilim, Sanayi ve Teknoloji, İçişleri, Maliye, Çevre ve Şehircilik, Ulaştırma, Denizcilik ve Haberleşme Bakanlıklarının ve engelliler ile ilgili konfederasyonların görüşleri alınmak sureti ile Aile ve Sosyal Politikalar Bakanlığınca bir yıl içerisinde çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunla Özürlüler İdaresi Başkanlığı ile Sosyal Hizmetler ve Çocuk Esirgeme Kurumu Genel Müdürlüğü teşkilat kanunlarında yapılan yeni düzenleme sebebiyle kadro ve görev unvanları değişenler veya kaldırılanlar bu Kanunun yürürlüğe girdiği tarihten itibaren bir yıl içinde boş bulunan durumlarına uygun kadrolara atanırlar. Bunlar yeni bir kadroya atanıncaya kadar her türlü malî haklarını eski kadrolarına göre almaya devam ederler. Söz konusu personelin atandıkları yeni kadroların aylık, ek gösterge, her türlü zam ve tazminatları ile diğer malî hakları toplamının net tutarı, eski kadrosunda en son ayda almakta oldukları aylık, ek gösterge, her türlü zam ve tazminatları ile diğer malî hakları toplamı net tutarından az olması halinde aradaki fark giderilinceye kadar atandıkları kadroda kaldıkları sürece hiçbir vergi ve kesintiye tâbi tutulmaksızın tazminat olarak ödenir. Kadro ve görev unvanı değişmeyenler ise aynı kadro ve görev unvanlarına atanmış sayılırlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Mevcut belgelerin geçerliliği" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Engelli bireylerin bu maddenin yürürlüğe girdiği tarihten önce ilgili mevzuatına göre almış oldukları sağlık kurulu raporlarına istinaden hâlen yararlanmakta oldukları hak ve menfaatlerin, sağlık kurulu raporu dışındaki diğer şartların muhafaza edilmesi ve ilgili mevzuatına göre bu hak ve menfaatlerin devamının mümkün olması kaydıyla, önceki raporların geçerlilik süresi içinde aynı şekilde uygulanmasına devam olunur. Ayrıca, engelli bireylerin ilgili mevzuatına uygun olarak daha önceden almış oldukları sağlık kurulu raporlarına istinaden engellilik durumlarının tespitine veya engellilikleri dolayısıyla kendilerine veya yakınlarına kolaylıklar ya da haklar teminine yönelik olarak bu maddenin yayımı tarihine kadar verilmiş olan özürlü, sakat, çürük veya zihinsel ya da bedensel engelleri niteleyen benzeri ibareleri içeren belge, kimlik, kart ve benzeri belgelerin, geçerli oldukları süreler dâhilinde yenilenmeleri gerekmez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="51" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanunun 35 inci maddesi ile 50 nci maddesinin (a) bendi 1.6.2006 tarihinde, diğer maddeleri yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
