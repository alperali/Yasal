  <mvz-künye tür="kanun" no="4342" başlık="MERA KANUNU"
             tarih="25/2/1998" rgazete-tarih="28/2/1998" rgazete-sayı="23272"
             düstur-tertip="5" düstur-cilt="38" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı; daha önce çeşitli kanunlarla tahsis edilmiş veya kadimden beri kullanılmakta olan mera, yaylak, kışlak ve kamuya ait otlak ve çayırların tespiti, tahdidi ile köy veya belediye tüzel kişilikleri adına tahsislerinin yapılmasını, belirlenecek kurallara uygun bir şekilde kullandırılmasını, bakım ve ıslahının yapılarak verimliliklerinin artırılmasını ve sürdürülmesini, kullanımlarının sürekli olarak denetlenmesini, korunmasını ve gerektiğinde kullanım amacının değiştirilmesini sağlamaktır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanun, mera, yaylak ve kışlak alanları ile umuma ait çayır ve otlak alanları kapsar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen;</template>
        <mvz-bent no="a">
          <template>Mera Vasıf ve Kapasitesi: Meraların verimliliklerine göre sınıflandırılmasını,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bakanlık: Tarım ve Köyişleri Bakanlığını,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Çayır: Taban suyunun yüksek bulunduğu veya sulanabilen yerlerde biçilmeye elverişli, yem üretilen ve genellikle kuru ot üretimi için kullanılan yeri,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Mera: Hayvanların otlatılması ve otundan yararlanılması için tahsis edilen veya kadimden beri bu amaçla kullanılan yeri,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Yaylak: Çiftçilerin hayvanları ile birlikte yaz mevsimini geçirmeleri, hayvanlarını otlatmaları ve otundan yararlanmaları için tahsis edilen veya kadimden beri bu amaçla kullanılan yeri,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kışlak: Hayvanların kış mevsiminde barındırılması ve otundan yararlanılması için tahsis edilen veya kadimden beri bu amaçla kullanılan yeri,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Otlatma Hakkı: Bir veya birden fazla köy veya belediyeye tahsis edilmiş olan mera, yaylak ve kışlaklarda, çiftçilerin her birinin müşterek otlatabileceği büyükbaş hayvan birimi sayısını,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Otlatma Kapasitesi: Belli bir alanda ve eşit zaman aralıkları ile uzun yıllar bitki örtüsüne, toprak, su ve diğer tabii kaynaklara zarar vermeden otlatılabilecek büyükbaş hayvan birimi miktarını,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Tahsis: Çayır, mera, yaylak ve kışlakların kullanımlarının verimlilik ve sosyal adalet ilkelerine uygun şekilde düzenlenerek, münferiden ya da müştereken yararlanılmak üzere bir veya birkaç köy ya da belediyeye bırakılmasını,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>Tahdit: Çayır, mera, yaylak ve kışlak arazisi olduğuna karar verilen yerlerin sınırlarının usulüne uygun olarak ülke nirengi sistemine dayalı 1/5000 ölçekli haritalar üzerinde belirtilmesini ve bu sınırların arazi üzerinde kalıcı işaretlerle işaretlenmesini,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>Tespit: Bir yerin mera, yaylak ve kışlak arazisi olup olmadığının resmi evrakla ve bilirkişi ifadeleri ile belgelendirilmesini,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>Komisyon: Mera komisyonunu,</template>
        </mvz-bent>
        <mvz-bent no="l">
          <template>Teknik Ekip: Komisyona bağlı olarak görev yapacak ekipleri,</template>
        </mvz-bent>
        <mvz-bent no="m">
          <template>Otlak: Mera ile aynı niteliklere sahip yeri,</template>
        </mvz-bent>
        <mvz-bent no="n">
          <template>Büyükbaş Hayvan Birimi: Hayvan sayısının, bir büyükbaş hayvan birimi olan 500 kg canlı ağırlığa çevrilerek ifade edilen şeklini,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Uygulama">
    <mvz-madde no="4" başlık="Mera, Yaylak ve Kışlakların Hukuki Durumu">
      <mvz-fıkra no="1">
        <template>Mera, yaylak ve kışlakların kullanma hakkı bir veya birden çok köy veya belediyeye aittir. Bu yerler Devletin hüküm ve tasarrufu altındadır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Komisyonun henüz görevine başlamadığı yerlerde, evvelce çeşitli kanunlar uyarınca yapılmış olan tahsislere ve teessüs etmiş teamüllere göre; mera, yaylak ve kışlakların köy veya belediye halkı tarafından kullanılmasına devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mera, yaylak ve kışlaklar; özel mülkiyete geçirilemez, amacı dışında kullanılamaz, zaman aşımı uygulanamaz, sınırları daraltılamaz. Ancak, kullanım hakkı kiralanabilir. Kiralama ilkeleri yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Amaç dışı kullanılmak suretiyle vasıfları bozulan mera, yaylak ve kışlakları tekrar eski konumuna getirmek amacı ile yapılan veya yapılacak olan masraflar sebebiyet verenlerden tahsil edilir. Yapılan masraflar karşılığı tahsil edilen tutarlar genel bütçeye, yapılacak olan masraflar karşılığı tahsil edilen tutarlar ise il müdürlüklerince hazırlanan ıslah projelerine uygun olarak o yerin ıslah çalışmalarında kullanılmak üzere köy sandığında veya belediye bütçesinde açılacak hesaba gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Umuma ait çayır ve otlak yerlerinin kullanılmasında ve bunlardan faydanılmasında mera yaylak ve kışlaklara ilişkin hükümler uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Mera, Yaylak ve Kışlak Olarak Tahsis Edilecek Yerler">
      <mvz-fıkra no="1">
        <template>Komisyonca tespit edilecek ihtiyaca göre aşağıda belirtilen yerler mera, yaylak ve kışlak olarak, köylere veya belediyelere tahsis edilir.</template>
        <mvz-bent no="a">
          <template>Kadimden beri mera, yaylak ve kışlak olarak kullanılan yerler ile aynı amaçla kullanılmak üzere köy veya belediyelere tahsis ya da terk edilen yerler,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Devletin hüküm ve tasarrufunda veya Hazinenin mülkiyetinde bulunan arazilerden etüt sonucu mera, yaylak ve kışlak olarak yararlanılabileceği anlaşılan yerler,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Mera, yaylak ve kışlak olarak kullanılmak amacıyla kamulaştırılacak yerler,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Tapu kayıtlarında mera, yaylak ve kışlak olarak görülen ve halen işgal edilen yerler.</template>
        </mvz-bent>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Komisyon ve Teknik Ekipler">
      <mvz-fıkra no="1">
        <template>Mera, yaylak ve kışlakların tespit, tahdit ve tahsisi Gıda, Tarım ve Hayvancılık Bakanlığınca yapılır. Bu amaçla valinin görevlendireceği bir vali yardımcısı başkanlığında; Bakanlık il müdürü, Bakanlık il müdürlüğünden konu uzmanı bir ziraat mühendisi, Devlet Su İşleri Genel Müdürlüğü yetkili temsilcisi, Orman Genel Müdürlüğü yetkili temsilcisi, ilgili köy veya mahalle muhtarı, defterdarlıktan veya bulunamaması halinde vali tarafından görevlendirilecek bir hukukçu, Milli Emlak Müdürlüğünden bir temsilci, Kadastro Müdürlüğünden bir teknik eleman, Ziraat Odası Başkanlığından bir temsilci ve ilgisine göre genel kolluk biriminde görevli bir temsilci olmak üzere on bir kişiden oluşan bir komisyon kurulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Komisyonlar valilik onayı ile oluşturulur. Vali yardımcısının bulunmadığı durumlarda komisyona Bakanlık il müdürü veya görevlendireceği konu uzmanı bir ziraat mühendisi başkanlık eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Mera, yaylak ve kışlak varlığı ile hayvancılık potansiyeli dikkate alınarak ihtiyaç duyulan il merkezi ve ilçelerde komisyona bağlı olarak çalışacak ve tespit, ölçme, harita yapma ve yer gösterme çalışmalarını yapmak üzere "Teknik Ekipler" oluşturulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu ekipler; Bakanlık il veya ilçe müdürlüğünden bir ziraat mühendisi, Köy Hizmetleri İl Müdürlüğünden bir ziraat mühendisi veya teknik eleman, Kadastro Müdürlüğünden bir teknik eleman, Millî Emlak Müdürlüğünden bir temsilci, orman içi, orman kenarı ve orman üst sınırı meraları ile ilgili olarak bir orman mühendisi, 22.11.1984 tarihli ve 3083 sayılı Sulama Alanlarında Arazi Düzenlemesine Dair Tarım Reformu Kanununun uygulama alanlarında Tarım Reformu Teşkilatından bir ziraat mühendisi ile meradan yararlanan köy ise köyün muhtarı, belediye ise belediye temsilcisi ile komisyonun teklifi ve valinin onayı ile seçilen iki mahallî bilirkişiden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Teknik ekipler ilçelerde kaymakamın, illerde komisyonun teklifi ve valinin onayı ile oluşturulur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Komisyon ve teknik ekiplerin çalışma usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Duyuru">
      <mvz-fıkra no="1">
        <template>Komisyon çalışma alanına giren köy ve belediyeler ile inceleme gün ve yerini, 9 uncu maddeye göre yapılacak tespit çalışmalarından en az otuz gün önce bu köy ve belediyelerde, ayrıca bunların bağlı oldukları ilçelerde, alışılmış araçlarla duyurulur. Ayrıca, durum ilgili orman teşkilatı müdürlüklerine, köy muhtarlıklarına ve belediye başkanlıklarına tebliğ edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>3402 sayılı Kadastro Kanunu uyarınca programa alınan yerler, çalışmaların başlamasından en az 4 ay önce, Tapu ve Kadastro Genel Müdürlüğünce, Bakanlığa bildirilir. Bu süre içinde ilgili komisyonlar tarafından mera, yaylak ve kışlakların tespit ve tahdidi yapılarak, durum Tapu ve Kadastro Genel Müdürlüğüne intikal ettirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Komisyonlar, yukarıda belirlenen süre içinde mera tespit ve tahdit işlemlerini yapmadığı takdirde, bu işlemler, 3402 sayılı Kadastro Kanunu hükümlerine göre kadastro komisyonlarınca gerçekleştirilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Tespit ve Tahsisten Önce Yapılacak İşler">
      <mvz-fıkra no="1">
        <template>İlgili köylerin muhtarları veya belediyelerin başkanları, yapılan tebliğden itibaren otuz gün içinde mera, yaylak ve kışlakların tamamen veya kısmen kendi köy veya belediyelerine ait olduğunu ispata yarayan bütün bilgileri ve varsa belge örneklerini komisyona vermeye mecburdurlar. Muhtarlar veya belediye başkanları, köy veya belediye sınırları içindeki ailelerin sayısını ve bunlara ait hayvanların cins ve miktarları ile mera, yaylak ve kışlaklardan kimlerin ne şekilde ve ne miktarda yararlandıklarını da, aynı süre içinde yazılı olarak komisyona bildirmekle yükümlüdürler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>İlgili orman teşkilatı müdürlükleri, yapılan tebliğden itibaren otuz gün içinde kendi bölgelerinde orman sınırları içinde bulunan mera, yaylak ve kışlaklarla ilgili bilgileri ve belgeleri komisyona vermekle yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Tapu sicil müdürlüğü ve ilgili diğer kuruluşlar mera, yaylak ve kışlak olarak tespit edilecek yerlerin 5 inci maddede belirtilen şartları taşıdığını gösteren bilgi ve belge örneklerini, en kısa sürede komisyona vermekle yükümlüdürler.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Tespit ve Tahdit Çalışmaları">
      <mvz-fıkra no="1">
        <template>Komisyonca görevlendirilen teknik ekipler mevcut mera, yaylak ve kışlaklar ile bu Kanun gereğince mera, yaylak ve kışlak kapsamına alınacak alanları tespit ederek bu alanların sınırlarının belirlenmesi ve işaret konulması işlemlerini yapar, 1/5000 ölçekli haritalarını tanzim ederek bu yerleri sınırlandırır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mera, yaylak ve kışlak olarak tespit edilen yerlerin, bu Kanunda gösterildiği şekilde sınırlandırılmasına esas olmak üzere, yapılması gereken arazide sınır belirlemesi ve işaret konulması işlemleri, ilgili köy muhtarları ile belediye başkanlarının veya görevlendirecekleri temsilcilerinin de hazır bulunması kaydıyla gerçekleştirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Teknik ekiplerce, bu Kanunun uygulandığı köy veya belediyelerin ekolojik, tarımsal ve ekonomik özellikleriyle mevcut hayvan varlıkları ve bunların gelecekteki muhtemel gelişmeleri dikkate alınarak, Bakanlıkça çıkarılacak yönetmelikteki normlara göre mera, yaylak ve kışlak ihtiyaçları tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Bu işlemlerin sonunda bir tutanak düzenlenir ve hazır bulunanlarca imzalanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Çalışma alanları içinde orman tahdidi yapılmamış orman içi mera, yaylak ve kışlaklar, Çevre ve Orman Bakanlığınca illerde görevlendirilen iki üyeden oluşan komisyonun görüşü alınarak tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Mahkeme kararı ile kesin hükme bağlanan, orman tahdidi kesinleşen ve kadastrosu yapılan yerlerde mera, yaylak ve kışlakların kesinleşmiş sınırları esas alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Belediye ve mücavir alan sınırları içerisinde bulunan, Devletin hüküm ve tasarrufu altında veya Hazinenin özel mülkiyetindeki arazilerin mera, yaylak ve kışlak olarak tespit ve tahdit çalışmalarından önce Maliye Bakanlığından izin alınır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Bu Kanun uygulamalarında kullanılacak haritalar, Bakanlıkça gerektiğinde gerçek veya tüzel kişilere ihale yolu ile yaptırılabilir.  Bakanlık bu ihaleler ile bu Kanun kapsamında uygulamaya konulan projelerde gelecek yıllara yaygın yüklenmeye girişebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="10" başlık="Özel Sicile Kayıt">
      <mvz-fıkra no="1">
        <template>Mera, yaylak ve kışlak olarak tespit ve tahdit edilen yerlerin haritalarının birer örneği, ilgili Tapu Sicil Müdürlüğüne gönderilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kadastro gören yerler, 3402 sayılı Kadastro Kanununun 16 ncı maddesinin (B) bendine göre düzenlenen özel siciline kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birden fazla il veya ilçenin sınırları içinde kalan mera, yaylak ve kışlaklar, idari sınırlar içerisinde kaldığı yerin Tapu Sicil Müdürlüğündeki özel sicile kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Komisyonlarca, kadastro görmeyen yerlerde tespit, tahdit ve tahsisi yapılan mera, yaylak ve kışlaklar Tapu ve Kadastro Genel Müdürlüğünce özel sicile kaydedilmek üzere Tapu Sicil Müdürlüklerine bildirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Komisyon ve Kadastroca tespit, tahdit ve tahsisi yapılan mera, yaylak ve kışlakların ayrıca Bakanlık il müdürlüğünce envanteri tutulur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Tahsis İçin İhtiyaç Tespiti">
      <mvz-fıkra no="1">
        <template>Komisyon; bölgenin ekonomik durumunu, iklim özelliklerini, toprak işleme esaslarını, arazi kullanma şekillerini ve kullanma kabiliyet sınıflarını dikkate alarak mevcut mera, yaylak ve kışlaklar ile bu amaçla kullanılabilecek diğer alanları, sulama ve geçit yerlerini tespit eder ve haritaları üzerinde belirler.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Köy veya belediyenin münferiden veya müştereken yararlanacağı mera, yaylak ve kışlak ihtiyacının belirlenmesinde, bu alanların karakter ve otlatma kapasitesi, bitkisel ve hayvansal gelişme ve otlatılacak hayvan miktarı dikkate alınır. Hesaplamada, bir büyükbaş hayvan birimi için verilmesi gerekli olan mera, yaylak ve kışlak alanı üzerinden o yerlerdeki çiftçi ailelerinin otlatma hakkı bulunur.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Tahsis Kararı">
      <mvz-fıkra no="1">
        <template>Komisyon, 11 inci maddeye göre belirlenen ihtiyacı karşılayacak miktarda mera, yaylak ve kışlaklar ile bunlarla ilgili sulama ve geçit yeri olarak tespit edilen alanları halkın ortak olarak yararlanmaları amacıyla, o köy veya belediye tüzel kişiliğine tahsis eder ve tahsis kararı valiliğin onayına sunulur. Bu kararda, tahsis edilen yerin niteliği, miktarı, sınırları, hayvan sulama ve geçit yerleri, tahsis amacı, otlatma kapasitesi, aile işletmelerinin büyükbaş hayvan birimi üzerinden otlatma hakkı ve otlatabilecekleri hayvan sayısı da belirtilir. İhtiyaçtan fazla çıkan kısım ise, ihtiyaç içinde bulunan çevre köy veya belediyelerle hayvancılık yapan özel veya tüzel kişilere kiralanabilir. Ancak kiralama durumu tahsis edilen köy ve belediyelerin hayvan sayısına göre her 5 yılda yeniden değerlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ayrıca bu Kanun kapsamına alınmakla birlikte, ancak ıslah edilmek suretiyle mera olarak kullanılabilecek alanlar, gerekli ıslah işlemlerini taahhüt eden özel ve tüzel kişilere kiralanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kiralama usul ve esasları yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kiralanacak alanda hayvancılık için gerekli bakım, barınma ve su ihtiyaçlarını karşılayacak zorunlu hayvancılık tesisleri kurulabilir. Bu tesislerin taban alanı, kiralanacak alanın yüzölçümünün yüzde birini geçemez. Bu oranı bir katına kadar artırmaya Cumhurbaşkanı yetkilidir. Bu tesislerin yapılması ve kullanılması ile ilgili usul ve esaslar Bakanlıkça çıkarılacak yönetmelikle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Tahsis Kararının Tebliği, İlanı, İtirazı ve Kütüğe Kayıt">
      <mvz-fıkra no="1">
        <template>Teknik ekiplerce yapılan çalışmaların sonuçları komisyonca ilgili köy ve belediyelerin ilan yerlerinde 30 gün süre ile askıda kalır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Teknik ekiplerin tespit ve tahdit sonuçlarına karşı askı ilanı süresi içinde komisyona itiraz edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Komisyon yapılan itirazları 60 gün içinde karara bağlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Komisyonun itirazları inceleyerek aldığı kararlar ile tahsis kararları, o yerin köy muhtarlığı ile belediye başkanlığına, defterdarlık veya mal müdürlüğüne, ilgili orman müdürlüğüne ve Tarım Reformu Teşkilatına tebliğ edilir. Ayrıca köy ve belediyelerde ve bunların bağlı olduğu ilçelerde alışılmış araçlarla ilan edilir ve bu konuda tutanaklar ve haritalar eklenecek 30 gün süre ile askıya çıkartılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Komisyon kararlarına karşı 30 günlük askı ilan süresi ve tebligatı gerektiren hallerde tebliğden itibaren 30 günlük süre içinde asliye hukuk mahkemesine, kadastro yapılan yerlerde ise kadastro mahkemesine dava açılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Dava konusu mera, yaylak ve kışlakların kadastro çalışma alanı dışında kalması halinde kadastro mahkemelerinin yetkisi bu alanlarla ilgili davaları da kapsar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>30 günlük ilan süresi içinde haklarında dava açılmayan kararlar kesinleşir ve tapu sicil müdürlüğüne gönderilerek özel sicile kaydedilir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Tahsis Amacının Değiştirilmesi">
    <mvz-madde no="14" başlık="Tahsis Amacının Değiştirilmesi">
      <mvz-fıkra no="1">
        <template>Tahsis amacı değiştirilmedikçe mera, yaylak ve kışlaktan bu Kanunda gösterilenden başka şekilde yararlanılamaz. Ancak, bu Kanuna veya daha önceki kanunlara göre mera, yaylak ve kışlak olarak tahsis edilmiş olan veya kadimden beri bu amaçla kullanılan arazilerden;</template>
        <mvz-bent no="a">
          <template>Enerji ve Tabiî Kaynaklar Bakanlığının talebi üzerine, 3213 sayılı Maden Kanunu ve 6326 sayılı Petrol Kanunu ile 3/6/2007 tarihli ve 5686 sayılı Jeotermal Kaynaklar ve Doğal Mineralli Sular Kanunu hükümlerine göre, arama faaliyetleri sonunda rezervi belirlenen maden ve petrol faaliyeti ile jeotermal kaynak ve doğal mineralli sular için zaruri olan,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kültür ve Turizm Bakanlığının talebi üzerine, turizm yatırımları için zaruri olan,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kamu yatırımları yapılması için gerekli bulunan,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Köy yerleşim yeri ile uygulama imar plânı veya uygulama plânlarına ilave imar plânlarının hazırlanması, toprak muhafazası, gen kaynaklarının korunması, millî park ve muhafaza ormanı kurulması, doğal, tarihî ve kültürel varlıkların korunması, sel kontrolü, akarsular ve kaynakların düzenlenmesi, bu kaynaklarda yapılması gereken su ürünleri üretimi ve termale dayalı tarımsal üretim faaliyetleri için ihtiyaç duyulan,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>442 sayılı Köy Kanununun 13 ve 14 üncü maddeleri kapsamında kullanılmak üzere ihtiyaç duyulan,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Ülke güvenliği ve olağanüstü hal durumlarında ihtiyaç duyulan,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Doğal afet bölgelerinde yerleşim yeri için ihtiyaç duyulan,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Enerji Piyasası Düzenleme Kurumunun talebi üzerine, 4628 sayılı Elektrik Piyasası Kanunu, 4646 sayılı Doğal Gaz Piyasası Kanunu ve 5015 sayılı Petrol Piyasası Kanunu hükümlerine göre, petrol iletim faaliyetleri ile elektrik ve doğal gaz piyasası faaliyetleri için gerekli bulunan,</template>
        </mvz-bent>
        <mvz-bent no="h">
          <template>Jeotermal kaynaklı teknolojik seralar için ihtiyaç duyulan,</template>
        </mvz-bent>
        <mvz-bent no="ı">
          <template>Cumhurbaşkanınca kentsel dönüşüm ve gelişim proje alanı olarak ilan edilen,</template>
        </mvz-bent>
        <mvz-bent no="i">
          <template>9/1/2002 tarihli ve 4737 sayılı Endüstri Bölgeleri Kanunu kapsamında ilan edilen endüstri bölgeleri, 26/6/2001 tarihli ve 4691 sayılı Teknoloji Geliştirme Bölgeleri Kanunu kapsamında ilan edilen teknoloji geliştirme bölgeleri, 12/4/2000 tarihli ve 4562 sayılı Organize Sanayi Bölgeleri Kanunu kapsamında kurulan organize sanayi bölgeleri ve 6/6/1985 tarihli ve 3218 sayılı Serbest Bölgeler Kanunu kapsamında kurulan serbest bölgeler için kuruluş ve genişleme aşamalarında ihtiyaç duyulan,</template>
        </mvz-bent>
        <mvz-bent no="j">
          <template>16/6/2005 tarihli ve 5369 sayılı Evrensel Hizmet Kanunu kapsamında Ulaştırma, Denizcilik ve Haberleşme Bakanlığınca kurdurulacak veya 5/11/2008 tarihli ve 5809 sayılı Elektronik Haberleşme Kanunu kapsamında yetkilendirilmiş işletmeciler tarafından kurulacak veya kurdurulacak elektronik haberleşme altyapıları için ihtiyaç duyulan,</template>
        </mvz-bent>
        <mvz-bent no="k">
          <template>10/5/2005 tarihli ve 5346 sayılı Yenilenebilir Enerji Kaynaklarının Elektrik Enerjisi Üretimi Amaçlı Kullanımına İlişkin Kanun kapsamında ilan edilen yenilenebilir enerji kaynak alanları için ihtiyaç duyulan,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Yerlerin, ilgili müdürlüğün talebi, komisyonun ve defterdarlığın uygun görüşü üzerine, valilikçe tahsis amacı değiştirilebilir ve söz konusu yerlerin tescilleri Hazine adına, vakıf meralarının tescilleri ise vakıf adına yaptırılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu madde kapsamında başvuruda bulunan kamu kurumları ile işletmeciler, faaliyetlerini çevreye ve kalan mera alanlarına zarar vermeyecek şekilde yürütmek ve kendilerine tahsis edilen yerleri tahsis süresi bitiminde eski vasfına getirmekle yükümlüdürler. Bu yerler, tahsis süresi bitiminde özel sicile kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Komisyon gerektiğinde; 3083 sayılı Sulama Alanlarında Arazi Düzenlemesine Dair Tarım Reformu Kanununun uygulanmasını Bakanlıktan talep edebilir ve köy veya belediyelerde toplulaştırma projeleri uygulatabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Durumu ve sınıfı çok iyi veya iyi olan mera, yaylak ve kışlaklarda birinci fıkranın (a), (f), (g), (ğ), (h) ve (k) bentleri hariç, tahsis amacı değişikliği yapılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Bu Kanun kapsamında, 3213 sayılı Maden Kanunu ve 6326 sayılı Petrol Kanunu hükümlerine göre arama ve işletme faaliyetlerinin yürütülmesi ile ilgili usul ve esaslar Bakanlıkça çıkartılacak bir yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Harman yeri, panayır, sıvat ve eyrek yerleri gibi kamu orta mallarının tahsis amacı değişikliğinde bu madde hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Bakanlık tarafından uygulanacak mera veya arazi toplulaştırma projeleri kapsamında; arazinin niteliği ve kullanım bütünlüğü dikkate alınarak işlenen tarım arazilerinden mera kullanımına mera olarak kullanılan alanlardan arazi plânlaması yapılabilir. Tarımsal kullanım veya mera bütünlüğü sağlamak için, nitelikleri itibarıyla değişim yapılacak arazi bulunamaması durumunda bu fıkra hükümlerine göre değerlendirmek, değiştirmek veya satın almak sureti ile kamulaştırma yapılabilir. Kamulaştırılan bu araziler değişim veya doğrudan satış ile değerlendirilir. Yapılan kamulaştırma ve değişim ile ilgili işlemler ve düzenlenen kâğıtlar Katma Değer Vergisi hariç her türlü vergi, resim, harç ve katkı payından müstesnadır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="15" başlık="Tahsis Kararında Değişiklik">
      <mvz-fıkra no="1">
        <template>Köy veya belediyelerin mera, yaylak ve kışlak ihtiyaçlarındaki değişme ve gelişmeler göz önünde tutularak, tahsis kararının değiştirilmesi komisyonun teklifi üzerine valiliğin onayı ile yapılır. Ancak bu değişikliğin yapılabilmesi için, son tahsis kararından itibaren beş yıl geçmiş olması gerekir. Bu süre, 14 üncü maddede öngörülen tahsis amacının değiştirilmesi bakımından uygulanmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tahsis kararındaki değişiklikler mera, yaylak ve kışlaklarla ilgili özel sicile işlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="Zilyedlik Yoluyla Yapılmış Olan Tesciller">
      <mvz-fıkra no="1">
        <template>Komisyonlar, köy ve belediyelere tahsisli veya kadimden beri bu amaçla kullanılan mera, yaylak ve kışlaklar üzerinde zilyedlik yoluyla hasım gösterilmeksizin yapılmış bulunan tescillerin iptalini sağlamak üzere, durumu Hazineye ihbar etmekle yükümlüdürler.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Mera, Yaylak ve Kışlakların Korunma, Bakım ve Islahı">
    <mvz-madde no="17" başlık="Sınırların İşaretlenmesi">
      <mvz-fıkra no="1">
        <template>Tespit, tahdit ve tahsis edilen mera, yaylak ve kışlakların çevreleri, teknik esaslara uygun olarak sınır işaretleriyle belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Mera Araştırma Bölümlerinin Kurulması">
      <mvz-fıkra no="1">
        <template>Mera, yaylak ve kışlakların bakım, ıslah, koruma, kontrol ve uygun kullanımını sağlamak için, araştırma, planlama, ıslah projeleri, otlatma zamanı, kullanma sistemi, koruma ve kontrol tedbirlerini tespit etmek üzere; Bakanlıkça uygun görülen yerlerde, mevcut zirai araştırma enstitüleri ve üniversiteler bünyesinde mevzuat çerçevesinde mera araştırma bölümleri kurulur ve mevcut bulunanlar yukarıdaki amaca hizmet edebilecek şekilde yeniden düzenlenebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="19" başlık="Mera, Yaylak ve Kışlakların Korunması">
      <mvz-fıkra no="1">
        <template>Muhtarlar ve belediye başkanları; mera, yaylak ve kışlakların ve sınır işaretlerinin korunmasından ve ayrıca tahsis amacına göre en iyi şekilde kullanılmasının sağlanmasından sorumludur. Muhtarlar ve belediye başkanları ayrıca, geliştirme projelerinde öngörülen hususların yerine getirilmesinde, kamu görevlilerine yardımcı olmakla görevli ve sorumludurlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu amaçla ilgili köy ve belediyelerde "Mera Yönetim Birlikleri" kurulur. Mera Yönetim Birliklerinin kuruluş ve çalışma esas ve usulleri yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Muhtarlar ve belediye başkanları, mera, yaylak ve kışlaklara tecavüz olduğu takdirde durumu derhal Bakanlık il veya ilçe müdürlüğüne, il ve ilçe müdürlükleri de valilik veya kaymakamlığa bildirmekle yükümlüdürler. Bu makamlarca 3091 sayılı Taşınmaz Mal Zilyedliğine Yapılan Tecavüzlerin Önlenmesi Hakkında Kanun veya 2886 sayılı Devlet İhale Kanununun 75 inci maddesi uyarınca gerekli işlemler yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="20" başlık="İnşaat Yasağı">
      <mvz-fıkra no="1">
        <template>Yaylak ve kışlaklarda, 442 sayılı Köy Kanununda öngörülen inşaatlar ile valiliklerden izin alınmak suretiyle imar mevzuatına göre yapılacak kullanma amacına uygun mandıra, suluk, sundurma ve süreklilik göstermeyen barınak ve ağıllar ile Turizm Bakanlığının talebi üzerine turizme açılması uygun görülen bölgelerde ahşap yapılar dışında, ev, ahır ve benzeri inşaatlar yapılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="5-BEŞİNCİ" başlık="Çeşitli Hükümler">
    <mvz-madde no="21" başlık="Mera, Yaylak ve Kışlak İddiasının İspatı">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre tahsis yapılmış olan köy veya belediyelerde, mera, yaylak ve kışlak alanları ile ilgili iddialar, ilgili tapu sicil müdürlüğünde tutulan özel sicillerin tanziminden sonra, ancak bu sicildeki kayda dayanılarak ispat edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tahsis kararlarında belirtilen haklara tahsislerin kesinleştiği tarihten itibaren 5 yıl geçtikten sonra tespitlerden önceki hukuki sebeplere dayanılarak itiraz edilemez ve bunlara karşı dava açılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="22" başlık="Yararlanma Hakkı ve Kapsamı">
      <mvz-fıkra no="1">
        <template>Çiftçi ailelerinin bir mera, yaylak ve kışlaktan yararlanabilmeleri için, bu yerin bulunduğu köy veya belediye sınırları içinde, tahsisin yapıldığı tarihte en az altı aydan beri ikamet ediyor olmaları gerekir. Ancak, Devletçe naklen yerleştirilenler için bu şart aranmaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Köy ve belediye sınırları içinde arazisi olmakla birlikte tahsis kararı kapsamına girmeyen çiftçi aileleri, o köy veya belediyeye tahsis edilen mera, yaylak ve kışlaktan yararlanamazlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Başka yere yerleşme amacı ile bulundukları yeri terkeden çiftçi aileleri, yararlanma hakkını kaybeder. Ancak, bunların sürekli ikamet amacıyla geri dönmeleri halinde, bu hak komisyon kararı ile tanınabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Göçerlerin mera, yaylak ve kışlaklardan yararlandırılmalarında bu Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Göçerlerle ilgili uygulama usul ve esasları yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="23" başlık="Aşırı Otlatmanın Önlenmesi">
      <mvz-fıkra no="1">
        <template>Mera, yaylak ve kışlağa, komisyonun tahsis kararında belirtilen miktardan fazla hayvan sokulamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Ancak, daha sonra bakım, koruma ve ıslah sonucu mera, yaylak ve kışlağın otlatma ve barındırma kapasitesinde bir artışın olması halinde, köy veya belediyelerin teklifi üzerine veya doğrudan doğruya komisyonca yeniden tespit yapılarak otlatılacak hayvan miktarı artırılabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="24" başlık="Sonradan Yerleşenlerle Yeni Ailelerin Yararlanma Hakkı">
      <mvz-fıkra no="1">
        <template>Köy veya belediye sınırları içinde çiftçilikle geçinmek üzere yerleşenlerle bu yerleşim yerinde oturup yeni aile kuranlara; mera, yaylak ve kışlağın o tarihteki yeterlilik durumu dikkate alınarak, komisyon tarafından yararlanma hakkı tanınabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="25" başlık="İhtiyaç Fazlası Ürünlerin Satılması">
      <mvz-fıkra no="1">
        <template>Mera, yaylak ve kışlaklardan elde edilen ürünlerin ihtiyaç fazlası, Mera Yönetim Birlikleri kararı ile satılabilir. Bu satıştan elde edilen gelir, mera alanlarının geliştirilmesi amacı ile köy sandığına veya belediye bütçesinde ayrı bir hesaba gelir kaydedilir ve amacı dışında kullanılamaz.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="26" başlık="Mera, Yaylak ve Kışlaklardan Yararlananların Yükümlülükleri">
      <mvz-fıkra no="1">
        <template>Mera, yaylak ve kışlaklardan yararlanan çiftçi aileleri, yapılacak bakım ve ıslah çalışmalarına ait giderlere, komisyonca gerekli görülmesi halinde, valiliğin onayı ile belirlenecek süre ve miktarlarda katılmakla yükümlüdürler. Bu katılma şekli nakdi olabileceği gibi, işçilik, araç, makina veya bunların işletme giderleri şeklinde de olabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Mera, yaylak ve kışlaklardan komisyonca tespit edilecek otlatma haklarına göre yararlanacak hak sahipleri bölgenin ekonomik durumu, otlatma kapasitesi ve otlatma süresi dikkate alınarak, komisyonca her yıl tespit edilecek belli bir ücreti ödemekle yükümlüdürler. Bu alanlarda otlatma hakkının üstünde hayvan otlatılamaz, otlatma haklarından fazla hayvan otlatanlardan bu ücret, fazla her hayvan sayısı için üç katı olarak tahsil edilir. Muhtarlık veya belediyeler tarafından bu amaçla yapılacak tahsilat, o yerin mera alanlarının ıslah ve geliştirilmesi amacı ile köy sandığına veya belediye bütçesinde ayrı bir hesaba gelir kaydedilir ve amacı dışında kullanılamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Komisyonca tespit edilen ücret ve para cezalarının takip ve tahsilinde 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="27" başlık="Yükümlülükleri Yerine Getirmeyenler">
      <mvz-fıkra no="1">
        <template>26 ncı maddede öngörülen hususlara riayet etmeyen ve yükümlülüklerini yerine getirmeyenlerin mera, yaylak ve kışlaklardan yararlanma hakları, Bakanlık taşra teşkilatının teklifi ve valilik onayı ile en az 7 gün, en çok 30 gün süre ile geçici olarak, aynı fiilin tekrarı halinde ise yararlanma hakkı bir otlatma dönemi için iptal edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yasaklanmış yerlerde hayvanlarını otlatmaya devam edenlerle mera, yaylak ve kışlak arazisini sürmek sureti ile tahrip edenler ve izinsiz inşaat yapanlar hakkında, valilik tarafından 3091 sayılı Taşınmaz Mal Zilyedliğine Yapılan Tecavüzlerin Önlenmesi Hakkında Kanun ile Türk Ceza Kanununun 513 üncü ve devamı maddelerine göre gerekli kanuni işlem yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci ve ikinci fıkralarda belirtilen fiilleri işleyenleri zamanında duyurmayan muhtar, belediye başkanı gibi bu Kanunun uygulanmasında görev ve sorumluluk verilen kişiler hakkında, genel hükümlere göre işlem yapılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="28" başlık="Orman Bölgelerinden Yararlanma">
      <mvz-fıkra no="1">
        <template>Orman bölgelerindeki köy ve belediyelere tahsis edilen mera, yaylak ve kışlaklardan o köy veya belediye halkı, bu Kanun ve 6831 sayılı Orman Kanunu gereğince konulan kayıtlara uymak şartı ile yararlanırlar.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Orman Bakanlığı, orman içi, orman kenarı ve orman üst sınırı mera, yaylak, kışlak ve otlakların koruma, bakım ve ıslahı konusunda kanunlar ile verilen görevi yapmaya devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="29" başlık="Sınır Değişikliği">
      <mvz-fıkra no="1">
        <template>Özel kanunları gereğince köy ve belediye veya diğer mülki idare sınırlarında yapılacak değişiklikler, mera, yaylak ve kışlaklara ilişkin tahsis kararlarını etkilemez.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="30" başlık="Mali Hükümler">
      <mvz-fıkra no="1">
        <template></template>
        <mvz-bent no="a" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Bu Kanuna göre otlatma amacıyla kiraya verilen mera, yaylak ve kışlaklardan yönetmelikte belirtilen usule göre alınacak ücretler,</template>
        </mvz-bent>
        <mvz-bent no="c" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="d" durum="mülga">
          <template></template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Tahsis amacı değişikliği talebinde bulunan gerçek ve tüzel kişilerden, 14 üncü maddenin birinci fıkrasının (e), (f), (g) ve (i) bentleri ve vakıf meraları ile toprak muhafaza, sel ve taşkın kontrolü amacıyla yapılacak her türlü ağaçlandırma ve erozyon kontrolü çalışmaları ilgili tahsis amacı değişiklikleri hariç, tahsis amacı değiştirilen mera, yaylak ve kışlaklardan elde olunacak yirmi yıllık ot geliri esas alınarak, komisyonca tespit edilerek alınacak ücret,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Yayla turizmi amacıyla 20 nci madde çerçevesinde verilecek yapı izinlerinden valiliklerce tespit edilecek miktarda alınan yapı ruhsat ücretleri ile bu yerlerin yıllık kira bedelleri,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Her türlü bağış ve yardımlar,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Tarım ve Köyişleri Bakanlığı Merkez Saymanlık Müdürlüğü hesabına yatırılır. Yatırılan bu tutarlar bütçeye gelir kaydedilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu maddede belirtilen gelirler, tahsilatın yapıldığı tarihi takip eden ayın 15’ine kadar saymanlık hesabına yatırılır ve gelirlerin tahsilatında 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümleri uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Bu madde uyarınca yapılacak tahsilata ilişkin usul ve esaslar ile ödenecek huzur hakları Maliye Bakanlığının uygun görüşü üzerine Bakanlık tarafından çıkarılacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="31" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulanması ile ilgili hususlar; ilgili bakanlıklar ve kuruluşların da görüşleri alınarak Bakanlıkça hazırlanacak yönetmelikle düzenlenir.</template>
      </mvz-fıkra>
    </mvz-madde>

  <mvz-bölüm no="7-YEDİNCİ" başlık="Geçici ve Son Hükümler">
    <mvz-madde no="1" başlık="" tür="Ek">
      <mvz-fıkra no="1">
        <template>30/4/2014 tarihli ve 28987 sayılı Resmî Gazete’de yayımlanan 24/2/2014 tarihli ve 2014/6028 sayılı Bakanlar Kurulu Kararında belirtilen; İstanbul İli Avrupa Yakası Proje Alanı içerisinde yer alan mera, yaylak ve kışlak gibi orta mallarının vasıfları, Ulaştırma, Denizcilik ve Haberleşme Bakanlığınca bu Kanun hükümlerine bağlı kalınmaksızın resen kaldırılır ve bu taşınmazlar Hazine adına tescil edilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanunun yürürlüğe girmesinden önce mera, yaylak ve kışlaklarla ilgili olarak adli yargıda görülmekte olan davalara devam olunur. Komisyonlar, bu davaların sonuçlanmasını bekler</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>1998 Mali Yılına münhasır ve 30 uncu maddenin birinci fıkrasının (a) bendinin 1 numaralı alt bendindeki gelire karşılık olmak üzere, bütçe kapsamındaki fonlara ait ödeneklerin yüzde biri tutarındaki miktar, 1998 yılı için bütçe kapsamına alınan Mera Fonuna aktarılır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="3" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Belediye ve mücavir alan sınırları içerisinde kalan ve 1.1.2003 tarihinden önce kesinleşen imar plânları içerisinde yerleşim yeri olarak işgal edilerek mera, yaylak ve kışlak olarak kullanımı teknik açıdan mümkün olmayan yerlerin ot bedeli alınmaksızın tahsis amacı değiştirilerek Hazine adına tescilleri yapılır. Ancak, bu nitelikteki taşınmazlardan ilgili belediye veya kamu kurum ve kuruluşları adına tescil edilmiş olanların tescilleri bedel talep edilmeksizin aynen devam eder. Bunlar hakkında Hazinece dava açılmaz, açılmış davalardan vazgeçilir. Hazinece bu nitelikteki taşınmazlar hakkında ilgili belediye veya kamu kurum ve kuruluşları aleyhine açılan davalar sonucunda Hazine adına tesciline veya mera, yaylak ve kışlak olarak sınırlandırılmasına ve özel siciline yazılmasına karar verilen, kesinleşen ve henüz tapuda işlemleri yapılmamış olan taşınmazlar hakkında da aynı hüküm uygulanır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Birinci fıkrada nitelikleri belirtilen taşınmazlardan Hazine adına tescil edilmesi gerekirken gerçek ya da özel hukuk tüzel kişileri adına tescil edilmiş taşınmazlara ilişkin Hazinece açılan davalardan, taşınmazların emlak ve rayiç bedellerinin toplamının yarısı üzerinden hesaplanacak bedelin ilgililerce Hazineye ödenmesi kaydıyla vazgeçilir. Bu hüküm, henüz dava açılmamış taşınmazlar hakkında da uygulanır. Evvelce açılan davalarda Hazine adına tesciline veya mera, yaylak ve kışlak olarak sınırlandırılmasına ve özel siciline yazılmasına karar verilen ve kesinleşen kararlara konu olan bu nitelikteki taşınmazların tapuları da talep etmeleri halinde aynı esaslara göre önceki kayıt maliklerine veya kanuni mirasçılarına devredilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada nitelikleri belirtilen taşınmazlardan Hazine adına tescil edilmesi gerekirken belediyeler adına tescil edilen ve belediyelerce konut veya iş yeri yapılmak üzere bedelsiz olarak veya bedeli karşılığında gerçek veya özel hukuk tüzel kişilerine tahsis edilen ancak, Hazinece ilgili belediye aleyhine açılan davalar sonucunda mera olarak sınırlandırılmasına ve özel siciline yazılmasına karar verilmesi üzerine mera özel siciline yazılan fakat daha sonra bu Kanun hükümlerine göre meralık vasfı değiştirilerek Hazine adına tescil edilen taşınmazlar ile doğrudan Hazine adına tesciline karar verilen taşınmazlardan; herhangi bir kamu hizmeti için gerekli olmayan, Hazinece herhangi bir tasarrufa konu edilmeyen ve hâlen tapuda Hazine adına kayıtlı olan taşınmazlar, tahsis tarihindeki arsa değerine devir tarihine kadar geçen süre için yasal faiz eklenerek belirlenecek bedelin ilgililerce Hazineye ödenmesi kaydıyla adlarına tahsis yapılanlara veya bunların haleflerine devredilir. Bu fıkranın uygulanmasına ilişkin usul ve esaslar, Bakanlığın görüşü alınarak Maliye Bakanlığınca belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Birinci fıkrada nitelikleri belirtilen taşınmazları belediyeler, il özel idareleri veya diğer kamu kurum ve kuruluşlarından bedeli karşılığında satın alan gerçek ve özel hukuk tüzel kişileri ile bunların kanuni ve akdi haleflerinden bedel istenilmez, bu taşınmazlar hakkında dava açılmaz, açılan davalardan vazgeçilir. Açılan davalar sonucunda Hazine adına tesciline veya mera, yaylak ve kışlak olarak sınırlandırılmasına ve özel siciline yazılmasına karar verilen, kesinleşen ve henüz tapuda infaz edilmeyen kararlar tapuda infaz edilmez. Kesinleşen kararlar gereğince doğrudan tapuda Hazine adına tescil edilen veya mera özel siciline yazılan fakat daha sonra bu Kanun hükümlerine göre meralık vasfı değiştirilerek Hazine adına tescil edilen taşınmazlardan herhangi bir kamu hizmeti için gerekli olmayan, Hazinece herhangi bir tasarrufa konu edilmeyen ve hâlen tapuda Hazine adına kayıtlı olanların tapuları da talep etmeleri hâlinde bedelsiz olarak önceki kayıt maliklerine veya kanuni mirasçılarına devredilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Aydın ili Çine ilçesine bağlı Kahraman, Yolboyu, Evciler, Karakollar, Çaltı, Kuruköy ve Yağcılar köy yerleşik alanlarında ve civarında yıllardan beri var olan köy yapıları nedeniyle mera, yaylak veya kışlak olarak kullanımının teknik açıdan mümkün olmadığı mera komisyonu tarafından tespit edilecek taşınmazlardan belediye, il özel idaresi veya kamu kurum ve kuruluşları adına tescil edilmiş olanlar ile il özel idaresince 24/2/1984 tarihli ve 2981 sayılı İmar ve Gecekondu Mevzuatına Aykırı Yapılara Uygulanacak Bazı İşlemler Ve 6785 Sayılı İmar Kanununun Bir Maddesinin Değiştirilmesi Hakkında Kanun hükümlerine göre hak sahiplerine tahsis edilen veya aynı Kanuna ve diğer mevzuata göre satılan taşınmazların tescilleri ot bedeli dahil herhangi bir bedel talep edilmeksizin aynen devam eder. Bu taşınmazlar hakkında Hazinece dava açılmaz, açılmış olan davalardan vazgeçilir. Hazinece bu taşınmazlar hakkında belediye, il özel idaresi, hak sahibi olanlar veya kamu kurum ve kuruluşları aleyhine açılan davalar sonucunda Hazine adına tesciline veya mera, yaylak ve kışlak olarak sınıflandırılmasına ve özel siciline yazılmasına karar verilen, kesinleşen ve henüz tapuda işlemleri yapılmamış olan taşınmazlar hakkında da aynı hüküm uygulanır. Kararları infaz edilenler ise önceki kayıt maliklerine veya kanuni mirasçılarına bedelsiz olarak devredilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="37" başlık="Yürürlük">
      <mvz-fıkra no="1">
        <template>Bu Kanun yayımı tarihinde yürürlüğe girer.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="38" başlık="Yürütme">
      <mvz-fıkra no="1">
        <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
      </mvz-fıkra>
    </mvz-madde>
