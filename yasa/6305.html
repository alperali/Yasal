  <mvz-künye tür="kanun" no="6305" başlık="AFET SİGORTALARI KANUNU"
             tarih="9/5/2012" rgazete-tarih="18/5/2012" rgazete-sayı="28296"
             düstur-tertip="5" düstur-cilt="52" />
    
  <mvz-bölüm no="1-BİRİNCİ" başlık="Amaç, Kapsam ve Tanımlar">
    <mvz-madde no="1" başlık="Amaç ve kapsam">
      <mvz-fıkra no="1">
        <template>Bu Kanunun amacı, binalarda deprem sonucu meydana gelebilecek maddi zararların karşılanmasını teminen yaptırılacak zorunlu deprem sigortası ile sigorta şirketlerince teminat verilemeyen veya teminat verilmesinde güçlükler bulunan çeşitli afetler ve riskler sonucu meydana gelebilecek maddi ve bedeni zararların karşılanabilmesini teminen sunulacak sigorta ve reasürans teminatlarına ilişkin usul ve esasları belirlemektir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="Tanımlar">
      <mvz-fıkra no="1">
        <template>Bu Kanunda geçen;</template>
        <mvz-bent no="a">
          <template>Bakan veya Bakanlık: Hazine Müsteşarlığının bağlı bulunduğu Bakanı veya Bakanlığı,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Birlik: Türkiye Sigorta ve Reasürans Şirketleri Birliğini,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Kurum: Doğal Afet Sigortaları Kurumunu,</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Müsteşarlık: Hazine Müsteşarlığını,</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Reasürans şirketi: 3/6/2007 tarihli ve 5684 sayılı Sigortacılık Kanununa göre Türkiye’de kurulmuş reasüransşirketi ile yurt dışında kurulmuş reasürans şirketinin Türkiye’deki teşkilatını,</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Sigorta şirketi: 5684 sayılı Kanuna göre Türkiye’de kurulmuş sigorta şirketi ile yurt dışında kurulmuş sigorta şirketinin Türkiye’deki teşkilatını,</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Teknik işletici: Kurumun teknik işleri ile işletmeye ilişkin iş ve işlemlerini yürüten şirketi,</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Yönetim Kurulu: Doğal Afet Sigortaları Kurumu Yönetim Kurulunu,</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Zorunlu deprem sigortası: Binalarda depremin doğrudan neden olduğu maddi zararlar ile deprem nedeniyle ortaya çıkan yangın, infilak, dev dalga (tsunami) ve yer kayması sonucu oluşan maddi zararları teminat altına alan zorunlu sigortayı,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>ifade eder.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="2-İKİNCİ" başlık="Doğal Afet Sigortaları Kurumu">
    <mvz-madde no="3" başlık="Doğal Afet Sigortaları Kurumu">
      <mvz-fıkra no="1">
        <template>Bu Kanuna göre sunulacak sigorta ve reasürans teminatları, Bakanlık nezdinde kurulan kamu tüzel kişiliğini haiz Doğal Afet Sigortaları Kurumu tarafından verilir. Kurumun merkezi, teknik işleticinin idare merkezinin bulunduğu yerdir. Kurumun tescilli isim hakkı Müsteşarlığa aittir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurum ve gelirleri her türlü vergi, resim ve harçtan muaftır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurum ile bu Kanun kapsamında gerçekleştirilen iş ve işlemler, 2/4/1987 tarihli ve 3346 sayılı Kamu İktisadi Teşebbüsleri ile Fonların Türkiye Büyük Millet Meclisince Denetlenmesinin Düzenlenmesi Hakkında Kanun, 3/12/2010 tarihli ve 6085 sayılı Sayıştay Kanunu, 10/2/1954 tarihli ve 6245 sayılı Harcırah Kanunu, 10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu ile 4/1/2002 tarihli ve 4734 sayılı Kamu İhale Kanununa tabi değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurumun taşınır ve taşınmaz varlıkları ile diğer hak, gelir ve alacakları haczedilemez, Kurum iflas yoluyla takip edilemez. Kurumun süresinde ödenmeyen sigorta primi alacakları, 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre tahsil edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurumun yıllık hesap, iş ve işlemleri ile harcamaları Müsteşarlık tarafından denetlenir. Müsteşarlık, Kurumun faaliyetlerine ve denetim sonuçlarına ilişkin olarak her yıl Türkiye Büyük Millet Meclisi Plan ve Bütçe Komisyonuna bilgi verir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="4" başlık="Doğal Afet Sigortaları Kurumu Yönetim Kurulu">
      <mvz-fıkra no="1">
        <template>Kurum, Doğal Afet Sigortaları Kurumu Yönetim Kurulu tarafından yönetilir. Yönetim Kurulu, Müsteşarlıktan, Çevre ve Şehircilik Bakanlığından, Afet ve Acil Durum Yönetimi Başkanlığından ve Sermaye Piyasası Kurulundan en az genel müdür yardımcısı düzeyinde birer üye, Birlik ve Yükseköğretim Kurulu tarafından önerilecek üçer aday arasından belirlenecek birer üye ile teknik işleticinin temsilcisi bir üyeden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yönetim Kurulu üyelerinin, 14/7/1965 tarihli ve 657 sayılı Devlet Memurları Kanununun 48 inci maddesinin (A) bendinin (1), (4), (5), (6) ve (7) numaralı alt bentlerinde belirtilen şartları taşımaları, temsil ettikleri kuruluşların görev alanına giren sigortacılık, acil durum yönetimi, doğal afetler, sermaye piyasaları ve benzeri konulardan birinde, görevlerini yürütebilmeleri için gerekli bilgiye ve en az on yıllık deneyime sahip olmaları gereklidir. Yükseköğretim Kurulu tarafından önerilecek adayların, inşaat, jeofizik, jeoloji mühendisliği veya dengi bölümlerinden mezun ve deprem konusunda en az yedi yıl deneyimli olmaları gereklidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Yönetim Kurulu üyeleri, ilgili kurumların önerisi ve Müsteşarlığın teklifi üzerine Bakan tarafından atanır. Yönetim Kuruluna Müsteşarlık temsilcisi başkanlık eder.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Yönetim Kurulu üyeliğine atanan kimseler dört yıl için görev yapar ve en fazla iki defa atanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Yönetim Kuruluna atanan üyeler temsil ettikleri kuruluşlardan ayrıldıkları takdirde Yönetim Kurulu üyelikleri sona erer. Yönetim Kurulu üyelerinin bu nedenle veya görev sürelerinin sona ermesi hâli hariç olmak üzere diğer herhangi bir nedenle üyeliklerinin sona ermesi durumunda yerlerine ilgili kuruluş tarafından birinci fıkrada belirtilen usule göre aday gösterilir ve bu üyelerin üçüncü fıkrada belirtilen usule göre atamaları yapılır. Bu üyeler, yerine atandıkları üyelerin sürelerini tamamlar ve her hâlde en fazla iki defa atanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="6">
        <template>Yönetim Kurulu en az beş üyenin katılımıyla toplanır ve kararlarını en az dört üyenin aynı yöndeki oyuyla alır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="7">
        <template>Yönetim Kurulunun temsili başkan tarafından, Yönetim Kurulunca alınan kararların yürütülmesi teknik işletici tarafından yapılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="8">
        <template>Yönetim Kurulu başkan ve üyelerine, kamu iktisadi teşebbüslerinde yönetim kurulu başkan ve üyelerine ödenen aylık ücret ve diğer ödemeler tutarında ücret ödenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="5" başlık="Yönetim Kurulunun görevleri">
      <mvz-fıkra no="1">
        <template>Yönetim Kurulunun görevleri şunlardır:</template>
        <mvz-bent no="a">
          <template>Kurumun iş ve işlemlerine ilişkin çalışma planını düzenlemek.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Tazminat ödemelerine ilişkin usul ve esasların belirlenmesi ile tazminat ödemelerinin en kısa sürede yapılmasını sağlamak.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Risk paylaşımı, reasürans ve retrosesyon planını onaylamak.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Kurum varlıklarının yatırıma yönlendirilmesine ilişkin usul ve esasları belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Halkla ilişkiler, tanıtım ve eğitim kampanyaları yapılmasına karar vermek.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Pazarlamaya ilişkin usul ve esasları belirlemek.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Kurumun faaliyetleri hakkında Bakana ve Müsteşarlığa bilgi vermek.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Bu Kanunla, Cumhurbaşkanlığı kararnameleriyle ve bunlara göre çıkarılan yönetmeliklerle verilen diğer görevleri yerine getirmek.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Yönetim Kurulu üyeleri bu sıfatları dolayısıyla öğrenmiş oldukları bilgileri üyelik sıfatını kaybetmiş olsalar dahi Yönetim Kurulunun izni veya onayı olmaksızın açıklayamazlar.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="6" başlık="Kurumun işlerinin yürütülmesi">
      <mvz-fıkra no="1">
        <template>Kurumun teknik işleri ile işletmeye ilişkin iş ve işlemleri, yangın ve doğal afetler branşında ruhsatı bulunan sigorta veya reasüransşirketleri arasından Müsteşarlıkça belirlenecek bir şirket tarafından teknik işletici sıfatıyla yürütülür. Teknik işleticinin belirlenmesinde; şirketin mali bünyesinin sağlamlığı, sigortacılık alanında ve uluslararası reasürans işlemleri ile afet risklerinin yönetimindeki deneyimi, teknik ve insan kaynakları altyapısı ve benzeri hususlar dikkate alınır.  Bakan, Kurumun teknik işleri ile işletmeye ilişkin iş ve işlemlerinin Kurum tarafından kurulan ve münhasıran bu amaçla faaliyet gösterecek bir anonim şirket tarafından yürütülmesine karar verebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Müsteşarlık, Kurum iş ve işlemlerinin yürütülmesi amacıyla teknik işleticiyle sözleşme yapar. Sözleşme en fazla beş yıllık süre için yapılır ve aynı usule göre yenilenebilir. Teknik işleticiye ödenecek işletme ücreti sözleşmede tespit edilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurumun çalışma usul ve esasları ile teknik işleticinin yetki ve sorumlulukları Müsteşarlık tarafından hazırlanan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurum, Bakanın uygun gördüğü uluslararası kuruluşlara üye olabilir ve bu kuruluşlar ile diğer ülkelerin benzeri kuruluşlarıyla kendi çalışma konularına ilişkin olarak işbirliği yapabilir, yurt içinde ve yurt dışında bir ücret karşılığı veya ücret alınmaksızın danışmanlık hizmeti sağlayabilir. Bu kapsamda yasal hakları Kuruma ait bulunan yazılım, lisans ve benzeri varlıklar, Kurum tarafından ücreti karşılığı kullandırılabilir, satılabilir veya hibe edilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurum, uluslararası anlaşmalar kapsamında, Bakanın uygun gördüğü uluslararası sigorta veya reasürans şirketlerine ortak olabilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="7" başlık="Kurum tarafından verilecek teminatlar">
      <mvz-fıkra no="1">
        <template>Zorunlu deprem sigortası teminatı münhasıran Kurum tarafından verilir. Bu teminat, risk yönetimi açısından şartların gerekli kılması durumunda ve Bakan tarafından uygun görülmesi hâlinde sigorta şirketleri ile müştereken de verilebilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Sigorta şirketlerince teminat verilememesi durumunda deprem, sel, yer kayması, fırtına, dolu, don, çığ düşmesi ve benzeri doğal afetler ile diğer özellik arz eden riskler için kamu yararı açısından gerek görülmesi hâlinde sigortacılık ilkeleri gözetilerek Kurum tarafından sigorta veya reasürans teminatı verilebilir. Kurum tarafından bu teminatların hangilerinin verileceği hususu Cumhurbaşkanınca belirlenir. Kurum tarafından bu fıkraya göre verilen teminatlara ilişkin limitler, sigorta genel şartları ile tarifelerin nasıl tespit edileceği hususu Müsteşarlık tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurum tarafından verilen teminatlara ilişkin hesaplar, kayıtlar ve hesaplar arası aktarıma ilişkin esaslar Müsteşarlık tarafından hazırlanan yönetmelikle belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurum tarafından verilen teminatların uygulama usul ve esasları ile sigorta şirketleriyle müşterek sigorta yapılmasına ilişkin esaslar Kurumun ve Birliğin görüşü alınarak sigortacılık ilkeleri çerçevesinde Müsteşarlık tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="8" başlık="Hasar fazlası desteği">
      <mvz-fıkra no="1">
        <template>Kurum tarafından üstlenilen riskler için ulusal ve uluslararası piyasalardan uygun koşullarda yeterli koruma sağlanamaması hâlinde, Cumhurbaşkanınca belirlenecek kısmının uygun bir bedel karşılığında Devlet tarafından taahhüt edilmesine karar verilebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="9" başlık="Kurumun gelirleri ve kullanılabileceği yerler">
      <mvz-fıkra no="1">
        <template>Kurumun gelirleri; sigorta ve reasürans primlerinden, reasürans ve retrosesyon işlemlerinden elde edilen komisyonlardan, Kurum varlıklarından sağlanan gelirlerden ve sair gelirlerden oluşur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Kurum, tazminatların ödenmesi için gerekli görülen durumlarda yıllık prim gelirlerinin toplam tutarını geçmemek üzere Bakanın uygun görüşü ile borçlanabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Kurumun gelirleri, Kurum tarafından ve sadece aşağıdaki amaçlar doğrultusunda kullanılabilir:</template>
        <mvz-bent no="a">
          <template>Kurum tarafından verilen sigorta ve reasürans teminatlarına ilişkin tazminat ödemeleri, hasar tespit işlemlerine ilişkin ödemeler ve mahkeme masrafları.</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Kurumun yönetimi ve işleyişi için gerekli masraflar.</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Yurt içi ve yurt dışı piyasalardan sağlanan reasürans ve benzeri koruma teminatlarına ilişkin ödemeler.</template>
        </mvz-bent>
        <mvz-bent no="ç">
          <template>Kurumun görev alanına giren konularda yaptıracağı çalışma ve araştırmalara ilişkin ödemeler.</template>
        </mvz-bent>
        <mvz-bent no="d">
          <template>Danışmanlık hizmetleri ve yatırım yönetimi gibi dışarıdan sağlanan hizmetlere ilişkin ödemeler.</template>
        </mvz-bent>
        <mvz-bent no="e">
          <template>Halkla ilişkiler, tanıtım ve eğitim kampanyalarına ilişkin ödemeler.</template>
        </mvz-bent>
        <mvz-bent no="f">
          <template>Sigorta şirketlerine ve diğer aracı kuruluşlara ödenen komisyonlar.</template>
        </mvz-bent>
        <mvz-bent no="g">
          <template>Kurumun aldığı borçların geri ödenmesine ilişkin faiz ve anapara ödemeleri.</template>
        </mvz-bent>
        <mvz-bent no="ğ">
          <template>Retrosesyon ve reasürans primleri ile reasürans komisyonları.</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurum varlıklarının yatırıma yönlendirilmesinde, yatırım araçları bakımından çeşitlendirme yapılır ve öncelikli olarak; varlıkların likit olması, anapara kaybı riskinin en düşük olması ve getiri oranının yüksek olması ilkeleri esas alınır.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="3-ÜÇÜNCÜ" başlık="Zorunlu Deprem Sigortası">
    <mvz-madde no="10" başlık="Kapsam ve sigorta yapma zorunluluğu">
      <mvz-fıkra no="1">
        <template>23/6/1965 tarihli ve 634 sayılı Kat Mülkiyeti Kanunu kapsamındaki bağımsız bölümler, tapuya kayıtlı ve özel mülkiyete tâbi taşınmazlar üzerinde mesken olarak inşa edilmiş binalar, bu binaların içinde yer alan ve ticarethane, büro ve benzeri amaçlarla kullanılan bağımsız bölümler ile doğal afetler nedeniyle Devlet tarafından yaptırılan veya sağlanan kredi ile yapılan meskenler zorunlu deprem sigortasına tâbidir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>9/11/1983 tarihli ve 2946 sayılı Kamu Konutları Kanununa tâbi olan veya kamu hizmet binası olarak kullanılan binalar ve bağımsız bölümler, köy nüfusuna kayıtlı ve köyde sürekli oturanlarca köy yerleşik alanları ve civarında ve mezralarda yapılan binalar ile 634 sayılı Kanun kapsamında olsalar dahi tamamı ikamet dışı amaçlarla kullanılan binalar zorunlu deprem sigortasına tâbi değildir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Birinci fıkrada belirtilen binalar ve bağımsız bölümler için malikler veya intifa hakkı sahipleri tarafından zorunlu deprem sigortası yaptırılır ve bu sigorta her yıl yenilenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>Kurum, ilgili mevzuata ve projeye aykırı olarak inşa edilen binaları sigortalamama hakkına sahiptir. Kurum, taşıyıcı sistemi olumsuz yönde etkileyecek şekilde tadil edildiği veya zayıflatıldığı tespit edilen binaları sigortalamaz. Bu tespitin yapıldığı binaların listesi Kurum tarafından ilgili idareye gönderilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="11" başlık="Yükümlülerin saptanması ve sigortanın kontrolü">
      <mvz-fıkra no="1">
        <template>Zorunlu deprem sigortasını yaptırmakla yükümlü olanlar, 10 uncu madde hükümleri çerçevesinde Kurum tarafından tespit edilir. Mahallî idareler dâhil kamu kurum ve kuruluşları ile gerçek ve tüzel kişiler, sigorta yükümlülerinin saptanmasına ve izlenmesine yönelik olarak Kurum tarafından kendilerinden istenecek bilgileri belirli aralıklarla ve düzenli olarak vermek zorundadır. Bu konudaki bilgi paylaşımı, gerektiği hâlde, elektronik ortamda yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Tapu müdürlükleri, maliklerin veya intifa hakkı sahiplerinin taleplerine bağlı olarak tapu kütüğünde bu sigortaya tâbi bağımsız bölümler ve binalarla ilgili tescil işlemlerini veya tapuya kayıtlı taşınmazın kayda tâbi olmayan bir taşınmaza dönüşmesi hâli hariç olmak üzere terkin işlemlerini zorunlu deprem sigortasının yaptırıldığı ve işlem tarihi itibarıyla geçerli olduğu belgelenmedikçe yapamaz.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Zorunlu deprem sigortasının kapsamına giren binalar ve bağımsız bölümlerle ilgili olarak yaptırılan su ve elektrik abonelik işlemlerinde, zorunlu deprem sigortasının varlığı ilgili kuruluşça kontrol edilir. Bu kontrol, gerektiği hâlde, Kurum tarafından elektronik ortamda sağlanan bilgi ve olanaklar ile yapılabilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="4">
        <template>İkinci ve üçüncü fıkra hükümlerinin uygulanmasına ilişkin usul ve esaslar, ilgili kurumların görüşü alınarak Müsteşarlık tarafından belirlenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="5">
        <template>Kurum, sigortanın yapılması ve düzenli olarak yenilenmesi için zorunlu deprem sigortasının kapsamına giren bina ve sitelerin yönetimleri ile kontrol uygulamaları geliştirebilir.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="12" başlık="Sigortalının sorumluluğu">
      <mvz-fıkra no="1">
        <template>Malik veya intifa hakkı sahibi, binanın ve her bir bağımsız bölümün projeye aykırı olarak ve taşıyıcı sistemi olumsuz yönde etkileyecek şekilde tadil edilmesine veya zayıflatılmasına karşı gerekli tedbirleri almakla yükümlüdür.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Malik veya intifa hakkı sahibi, hasarın projeye aykırı olarak ve taşıyıcı sistemi olumsuz yönde etkileyecek tadilat nedeniyle ortaya çıktığının tespit edilmesi durumunda, sigortadan tazminat alma hakkını kaybeder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="13" başlık="Tarife ve talimatlar ile uygulama esasları ve genel şartlar">
      <mvz-fıkra no="1">
        <template>Zorunlu deprem sigortasına ilişkin tarife ve talimatlar ile azami teminat tutarı her yıl Bakan tarafından belirlenir ve Resmî Gazetede yayımlanır. Sigorta primlerinin tespitinde; binanın yüzölçümü, inşaat türü ve kalitesi, binanın üzerinde bulunduğu arazinin zemin özellikleri, deprem riski ve benzeri unsurlar değerlendirilir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Zorunlu deprem sigortası bulunan ve deprem nedeniyle hasar gören binalara ilişkin tazminat, gerekli bilgi ve belgeler ile hasar tespitinin tamamlanmasını müteakip en geç otuz gün içinde ödenir.</template>
      </mvz-fıkra>
      <mvz-fıkra no="3">
        <template>Zorunlu deprem sigortasına ilişkin uygulama usul ve esasları ile sigorta genel şartları Müsteşarlık tarafından belirlenir.</template>
      </mvz-fıkra>
    </mvz-madde>
  </mvz-bölüm>
  <mvz-bölüm no="4-DÖRDÜNCÜ" başlık="Diğer Hükümler">
    <mvz-madde no="14" başlık="Yönetmelik">
      <mvz-fıkra no="1">
        <template>Bu Kanunun uygulamasına ilişkin yönetmelikler bu Kanunun yayımı tarihinden itibaren bir yıl içinde yürürlüğe konulur.</template>
      </mvz-fıkra>

    <mvz-madde no="15" başlık="Yürürlükten kaldırılan hükümler">
      <mvz-fıkra no="1">
        <template>25/11/1999 tarihli ve 587 sayılı Zorunlu Deprem Sigortasına Dair Kanun Hükmünde Kararname yürürlükten kaldırılmıştır.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="16" başlık="" durum="işlenmiş">
      <mvz-fıkra no="1">
        <template>(15/5/1959 tarihli ve 7269 sayılı Umumi Hayata Müessir Afetler Dolayısiyle Alınacak Tedbirlerle Yapılacak Yardımlara Dair Kanun ile ilgili olup yerine işlenmiştir.)</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunla mülga 587 sayılı Kanun Hükmünde Kararname ile kurulan Doğal Afet Sigortaları Kurumunun aktif ve pasifleri ile her türlü hak ve yükümlülükleri, hiçbir işleme gerek kalmaksızın, bu Kanunla kurulan Doğal Afet Sigortaları Kurumuna devredilmiş sayılır.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunla mülga 587 sayılı Kanun Hükmünde Kararnamenin 7 nci maddesine göre Yönetim Kuruluna atanan üyelerden, aynı maddenin (a) bendine göre atanan hariç diğer üyeler görev sürelerinin sonuna kadar görevlerine devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="2" başlık="" tür="GEÇİCİ">
      <mvz-fıkra no="1">
        <template>Bu Kanunda belirtilen yönetmelik ve diğer düzenlemeler yürürlüğe girinceye kadar, bunların düzenleyeceği konulara ilişkin mevcut düzenlemelerin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam olunur.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>Bu Kanunun yürürlüğe girdiği tarihten önce Müsteşarlık ile teknik işletici arasında yapılan sözleşme, süresi sonuna kadar devam eder.</template>
      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="17" başlık="Yürürlük">

      </mvz-fıkra>
    </mvz-madde>
    <mvz-madde no="18" başlık="Yürütme">
