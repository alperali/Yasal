  <mvz-künye tür="kanun" no="1117" başlık="KÜÇÜKLERİ MUZIR NEŞRİYATTAN KORUMA KANUNU"
             tarih="21/6/1927" rgazete-tarih="7/7/1927" rgazete-sayı="627"
             düstur-tertip="3" düstur-cilt="8" düstur-sayfa="899" />
    
  <mvz-madde no="1" başlık="">
    <mvz-fıkra no="1">
      <template>18 yaşından küçüklerin maneviyatı üzerinde muzır tesir yapacağı anlaşılan mevkute ve mevkute tanımına girmeyen diğer basılmış eserler aşağıdaki maddelerde gösterilen sınırlamalara tabi tutulur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="">
    <mvz-fıkra no="1">
      <template>Mevkute veya mevkute tanımına girmeyen diğer basılmış eserlerin 1 inci maddede belirtilen sınırlamaya tabi tutulabilmesi için Çalışma, Sosyal Hizmetler ve Aile Bakanlığı bünyesinde oluşturulan yetkili kurulun, söz konusu eserlerin 18 yaşından küçükler için muzır olduğu hakkında bir karar vermesi gereklidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Kurul, basılmış eserlerin küçükler için muzır olup olmadığı hususunda yapacağı incelemede, 1739 sayılı Milli Eğitim Temel Kanunundaki genel amaç ve temel ilkeleri gözönünde bulundurmak zorundadır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>Kurul, bu Kanunla kendisine verilen görevlere ilaveten, Türk Ceza Kanununun 426, 427 ve 428 inci maddelerinde tanımlanan suçlarla ilgili olarak yargı organlarına resmi bilirkişilik yapmakla görevlidir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Kurul; Çalışma, Sosyal Hizmetler ve Aile Bakanının belirleyeceği biri başkan olmak üzere Bakanlığın beş birim amirinden teşekkül eder.</template>
    </mvz-fıkra>
    <mvz-fıkra no="5" durum="mülga">
      <template></template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Kurul salt çoğunlukla karar alır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Kurulun sekretarya hizmetleri Çalışma, Sosyal Hizmetler ve Aile Bakanı tarafından belirlenen Bakanlık ana hizmet birimince yerine getirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Kurulun çalışma usul ve esasları ile sekreterya hizmetlerinin ne suretle yerine getirileceği Çalışma, Sosyal Hizmetler ve Aile Bakanlığı tarafından çıkarılacak yönetmelikte belirlenir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="9">
      <template>Kurul tarafından gerekli görülen hallerde sürekli veya geçici olarak görev yapmak üzere özel ihtisas komisyonları kurulabilir. Kurulun, bu komisyonlarda görev yapmasını uygun göreceği kamu personeli ilgili kamu kurumunun muvafakati alınarak Çalışma, Sosyal Hizmetler ve Aile Bakanlığınca görevlendirilir.</template>
    </mvz-fıkra>
    <mvz-fıkra no="10" durum="mülga">
      <template></template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="">
    <mvz-fıkra no="1">
      <template>Kurul, 1 inci maddede gösterilen eserleri re'sen inceleyebileceği gibi, resmi makamlar ile gayeleri içinde çocuk ve gençlerin korunmasına yer veren derneklerin, kadın ve basın dernek ve kuruluşlarının başvurularını da inceleyerek karara bağlar.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="4" başlık="">
    <mvz-fıkra no="1">
      <template>Bir aydan az süreli mevkuteler ile sinema ve her türlü film afişleri, ilanlar, fotoğraflar, kabartma ve her türlü posterler, kartpostallar, takvimler hariç olmak üzere kurulca tetkik edilerek küçükler için muzır olduğuna karar verilmiş basılmış eserlerin sahiplerine, sorumlu müdürlerine ve telif hakkı sahiplerine, basılmış eserlerin küçüklerin maneviyatına muzır olduğu kurulca tebliğ edilir. Tebligat, Tebligat Kanunu hükümlerine göre yapılır. Kurul bu kararı ilgililere derhal duyurmak için gerekli tedbirleri alır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Tebligat üzerine eser sahipleri, telif hakkı sahipleri ve sorumlu müdürler, ellerinde mevcut eserlerin ön kapaklarına "Küçüklere zararlıdır" damga veya işaretini basmak zorundadırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="3">
      <template>"Küçüklere zararlıdır" ibaresinin herkesin kolayca görüp okuyabileceği şekil ve büyüklükte yazılması zorunludur.</template>
    </mvz-fıkra>
    <mvz-fıkra no="4">
      <template>Bu suretle damgalanan eserler;</template>
      <mvz-bent no="a">
        <template>Açık sergilerde ve seyyar müvezziler tarafından satılamaz.</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Dükkanlarda, cemakanlarda ve benzeri yerlerde teşhir edilemez.</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Bir yerden bir yere teşhir maksadıyla açık bir surette nakledilemez ve müvezziler tarafından bunlar için sipariş kabul olunamaz.</template>
      </mvz-bent>
      <mvz-bent no="d">
        <template>Gazeteler, mecmualar, duvar ve el ilanları, radyo ve TV ile veya diğer suretlerle ilan edilemez, satışı için reklam ve propaganda yapılamaz.</template>
      </mvz-bent>
      <mvz-bent no="e">
        <template>Para mukabili veya parasız küçüklere gösterilemez, verilemez ve hiçbir suretle okul ve benzeri yerlere sokulamaz.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="5">
      <template>Bu tür eserler, ancak 18 yaşından büyük olanlara içi görülmeyen zarf veya poşet içinde satılabilir. Bu zarf ve poşetlerin üzerinde eserin ismi ile "Küçüklere zararlıdır" ibaresinden başka hiç bir yazı ve resim bulunamaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="6">
      <template>Kurul kararının tebliğinden önce dağıtımı yapılmış olan bu kabil basılmış eserleri satış için ellerinde bulunduranlar da, Kurul kararlarının ilgililere duyurulma tarihinden itibaren, bu maddedeki sınırlamalara uymak zorundadırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="7">
      <template>Kurulca haklarında küçükler için muzır olduğuna üç defa karar verilen basılmış periyodik eserlerin sonraki sayıları ile diğer basılmış eserlerin sonraki basıları da, yeniden bir karar verilmesine gerek kalmaksızın bu maddede belirtilen sınırlamalara tabidir. Ancak bu gibi eserlerin sahipleri, eserlerinin müteakip sayı ve basılarının küçükler için muzır nitelikte olmadığı iddiasıyla kurula başvurarak incelenmesini isteyebilirler. Kurul, başvuruyu haklı bulursa, bu maddedeki sınırlamalar sonraki sayı ve basılar için uygulanmaz.</template>
    </mvz-fıkra>
    <mvz-fıkra no="8">
      <template>Haklarında Kurulun her hangi bir kararı bulunmadığı halde, basılmış eserlerinin konusu veya ihtiva ettiği yazı ve resimler sebebiyle küçüklerin maneviyatı üzerinde muzır tesir yapacağı kanaatinde olan eser sahipleri kendiliklerinden, eserin üzerine "Küçüklere zararlıdır" damga veya işaretini basarak içi görünmeyen zarf veya poşet içinde satışa arz edilebilirler. Bu takdirde, bu basılmış eserler hakkında da bu maddenin ilgili fıkraları hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="5" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="6" başlık="">
    <mvz-fıkra no="1">
      <template>Fikri, içtimai, ilmi ve bedii kıymeti haiz olan eserler bu kanunun şumulünden hariçtir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="7" başlık="">
    <mvz-fıkra no="1">
      <template>Kanunun 4 üncü maddesinin;</template>
      <mvz-bent no="a">
        <template>Birinci ve ikinci fıkrasına göre; kendilerine tebligat yapıldığı halde eserlerini damgasız olarak yayımlayan eserin sahipleri, sorumlu müdürleri ve telif hakkı sahipleri,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Dördüncü fıkrasına aykırı olarak, sınırlamaya tabi olan damgalı veya damgasız basılmış eserleri, fıkranın bentlerinde belirtilen şekillerde satan, teşhir eden, nakleden, sipariş kabul eden, ilan eden, gösteren, veren ve okullara sokanlar,</template>
      </mvz-bent>
      <mvz-bent no="c">
        <template>Beşinci ve sekizinci fıkralarına aykırı şekilde, zarf veya poşete koymadan veya beşinci fıkrada zikredilen evsafa aykırı zarf veya poşet içinde satanlar.</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İki milyon liradan on milyon liraya kadar ağır para cezası ile cezalandırılırlar. Suçun tekerrürü halinde cezanın azami haddi uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="8" başlık="">
    <mvz-fıkra no="1">
      <template>Basılmış eserler ile mevkutenin her nüshasından ikişer adedi, neşri takip eden çalışma gününde bir alındı belgesi karşılığında Kurul Başkanlığına gönderilir. Ankara dışında basılan eserlerin postaya verildiği tarih esas alınır.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu madde hükmünü yerine getirmeyenler hakkında 5680 sayılı Basın Kanununun 24 üncü maddesinde belirtilen ceza hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="9" başlık="" durum="mülga">
  </mvz-madde>
  <mvz-madde no="10" başlık="">
    <mvz-fıkra no="1">
      <template>Birinci maddede zikredilen eserlerden her hangi birinin tetkik edilmekte olduğuna ve tahdit edileceğine dair yevmi gazete ve mecmualarla neşriyatta bulunulamaz. Bu nevi haberleri neşreden gazete ve mecmua müdiri mesulleri sekizinci madde mucibince cezalandırılır. İşbu kanunda yazılı ceza sulh mahkemelerince hükmolunur.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bir aydan az süreli mevkuteler ile sinema ve her türlü film afişleri, ilanlar, fotoğraflar, kabartma ve her türlü posterler, kartpostallar, takvimler hariç, 4 üncü maddede belirtilen şekilde sınırlamaya tabi tutulacak basılmış eserlerin sahiplerinden,</template>
      <mvz-bent no="a">
        <template>Haklarında Kurulun herhangi bir kararı bulunmadığı halde basılmış eserlerini kendiliklerinden küçüklere muzır nitelikte görerek zarf veya poşet içinde satışa arz etmek isteyenler, bu eserlerin Katma Değer Vergisi dahil toplam satış bedeli üzerinden % 25 oranında bir meblağı, piyasaya sürdükleri tarihten,</template>
      </mvz-bent>
      <mvz-bent no="b">
        <template>Basılmış eserlerinin, Kurul tarafından küçükler için muzır nitelikte olduğuna karar verilenler, bu eserin basım adedinin Katma Değer Vergisi dahil toplam satış bedeli üzerinde % 40 oranında bir meblağı, Kurul kararının tebliği tarihinden,</template>
      </mvz-bent>
    </mvz-fıkra>
    <mvz-fıkra no="0">
      <template>İtibaren, bir ay içinde, Toplu Konut Fonuna aktarılmak üzere Maliyeye yatırmak zorundadırlar.</template>
    </mvz-fıkra>
    <mvz-fıkra no="2">
      <template>Bu meblağları belirtilen süre içinde yatırmayanlar hakkında, 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="2" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bir aydan az süreli mevkuteler ile eklerinde, sinema ve her türlü film afişlerinde, ilanlarda, fotoğraflarda, kabartma ve her türlü posterlerde, kartpostallarda ve takvimlerde 18 yaşından küçüklerin maneviyatı üzerinde muzır tesir yapacak nitelikte yayın yapılamaz. Aksine davranan mevkute sahipleri ve bunların sorumlu müdürleri hakkında Türk Ceza Kanununun 426 ncı maddesinin ikinci fıkrasındaki; sinema ve her türlü film afişlerini, ilanları, fotoğrafları, kabartma ve her türlü posterleri, kartpostalları, takvimleri basan, çoğaltan, satan ve alenen kullananlar hakkında Türk Ceza Kanununun 426 ncı maddesinin birinci fıkrasındaki ceza hükümleri uygulanır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="3" başlık="" tür="Ek">
    <mvz-fıkra no="1">
      <template>Bu Kanunda yazılı suçlardan doğan davalar en geç iki ay içinde sonuçlandırılır.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="1" başlık="" tür="Geçici">
    <mvz-fıkra no="1">
      <template>Bu maddenin yürürlüğe girdiği tarihte, mevcut Kurul üyelerinin üyelikleri sona erer.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="11" başlık="">
    <mvz-fıkra no="1">
      <template>Bu kanun neşri tarihinden muteberdir.</template>
    </mvz-fıkra>
  </mvz-madde>
  <mvz-madde no="12" başlık="">
    <mvz-fıkra no="1">
      <template>Bu Kanun hükümlerini Bakanlar Kurulu yürütür.</template>
    </mvz-fıkra>
  </mvz-madde>
