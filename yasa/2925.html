    <mvz-madde no="6" başlık="Sigortalılığın sona ermesi ve kesintiye uğraması">

        <mvz-bent no="a">
          <template>Primlerini gecikme cezası ve gecikme zammı ile birlikte ait olduğu yılı takip eden yılın Şubat ayı sonuna kadar ödemeyenlerin o yılın 1 Ocak gününden itibaren,</template>
        </mvz-bent>
        <mvz-bent no="b">
          <template>Sigortalılıklarına devam etmek istemediklerini Kuruma yazılı olarak bildirenlerin, bu bildiriminin Kurum kayıtlarına intikal ettiği tarihi izleyen yılbaşından itibaren,</template>
        </mvz-bent>
        <mvz-bent no="c">
          <template>Sosyal güvenlik kuruluşlarına tabi olarak çalışmaya başlamaları nedeniyle prim veya kesenek kesilmeye başladığı tarihten itibaren,</template>
        </mvz-bent>
      </mvz-fıkra>
      <mvz-fıkra no="0">
        <template>Sigortalılıkları sona erer.</template>
      </mvz-fıkra>
      <mvz-fıkra no="2">
        <template>(c) bendi uyarınca sigortalılıkları sona erip de sosyal güvenlik kuruluşları ile ilgilerinin kesilmesi nedeniyle prim veya kesenek ödenmesine son verilenlerin sigortalılıkları, prim veya kesenek ödenmesine son verildiği tarihi izleyen aybaşından itibaren kendiliğinden başlar.</template>
      </mvz-fıkra>
    </mvz-madde>

  <mvz-kısım no="2-İKİNCİ" başlık="Sigorta Yardımları">

      <mvz-madde no="7" başlık="Sağlanan yardımlar">

          <template>İş kazaları ile meslek hastalıkları halinde sağlanan yardımlar şunlardır:</template>
          <mvz-bent no="a">
            <template>Sağlık yardımı yapılması,</template>
          </mvz-bent>
          <mvz-bent no="b">
            <template>Sürekli işgöremezlik hallerinde gelir verilmesi,</template>
          </mvz-bent>
          <mvz-bent no="c">
            <template>Protez araç ve gereçlerinin sağlanması, takılması, onarılması ve yenilenmesi,</template>
          </mvz-bent>
          <mvz-bent no="d">
            <template>Cenaze masrafı karşılığı verilmesi,</template>
          </mvz-bent>
          <mvz-bent no="e">
            <template>Sigortalının ölümünde hak sahiplerine gelir bağlanması.</template>
          </mvz-bent>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Bu yardımlardan yararlanılabilmesi için işkazasının olduğu tarihten en az üç ay önce sigortalının tescil edilmiş olması ve sigortalılığın sona ermemiş bulunması şarttır.</template>
        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="8" başlık="Sürekli işgöremezlik gelirine hak kazanma">
        <mvz-fıkra no="1">
          <template>İş kazası veya meslek hastalığı sonucu meslekte kazanma gücünün en az % 10 azalmış bulunduğu Kurumca tespit edilen sigortalı, sürekli işgöremezlik gelirine hak kazanır.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>Sürekli işgöremezlik geliri almakta olan veya bu geliri sermayeye çevrilerek ödenmiş bulunan sigortalının yeniden tedavi ettirilmesi halinde meslekte kazanma gücünü ne oranda yitirdiği Kuruma ait veya Kurumun sevk edeceği sağlık tesisleri sağlık kurullarından alınacak raporlara göre yeniden tespit olunur.</template>
        </mvz-fıkra>
      </mvz-madde>

        <mvz-fıkra no="1">

        </mvz-fıkra>
      </mvz-madde>
      <mvz-madde no="10" başlık="İş kazasını bildirme ve hekim tavsiyesine uymazlık">
        <mvz-fıkra no="1">
          <template>İş kazası engeç kazadan sonraki iki gün içinde işverene veya Kuruma bildirilir.</template>
        </mvz-fıkra>
        <mvz-fıkra no="2">
          <template>İş kazası veya meslek hastalığı dolayısıyla hekimin bildirdiği tedbir ve tavsiyelere uymaması yüzünden malul kalmasına veya malullük derecesinin artmasına sebep olan sigortalının sürekli işgöremezlik gelirinin kendisine yüklenebilecek kusurun raporda belirtilen oranındaki kısmı Kurum tarafından düşürülebilir. Şu kadar ki, bu düşürme % 50'yi geçemez.</template>
        </mvz-fıkra>
        <mvz-fıkra no="3">
          <template>Kurumun yazılı bildirisine rağmen teklif edilen tedaviyi kabul etmeyen sigortalıya, tedavi için Kuruma başvuracağı tarihe kadar sağlık yardımı yapılmayacağı gibi sürekli işgöremezlik geliri de verilmez.</template>

        </mvz-fıkra>

      <mvz-madde no="23" başlık="Aylığın kesilmesi ve yeniden bağlanması">

          <template>Yaşlılık aylığı almakta iken sosyal güvenlik kuruluşlarına tabi bir işte sigortalı olarak çalışmaya başlayanların yaşlılık aylıkları çalışmaya başladıkları tarihte kesilir.</template>

        <mvz-fıkra no="2">
          <template>Yukarıdaki fıkraya göre yaşlılık aylığı kesilen sigortalılardan işten ayrılarak yaşlılık aylığı verilmesi için yazılı istekte bulunan sigortalıya, eski aylığın kesildiği tarihten sonra aylıklara yapılan artışlar uygulanarak bulunan aylık tutarına, yazılı istek tarihindeki emeklilik öncesi ve sonrası prim ödeme gün sayısı toplamı üzerinden, 21 inci maddeye göre hesaplanan aylığın emeklilik sonrası prim ödeme gün sayısına orantılı bölümü eklenmek suretiyle istek tarihini takip eden ödeme dönemi başından itibaren ödenir.</template>

        <template>Bu Kanunu, 17/7/1964 tarihli ve 506 sayılı Sosyal Sigortalar Kanunu ile değişik 9/7/1945 tarih ve 4792 sayılı Kanunla kurulmuş bulunan Sosyal Sigortalar Kurumu uygular.</template>

    </mvz-madde>
    <mvz-madde no="1" başlık="" tür="Geçici">
      <mvz-fıkra no="1">
        <template>Bu Kanun kapsamına girenlerden 1984 yılı içerisinde yazılı istekte bulunanlar, istek tarihini takip eden aybaşından itibaren sigortalı sayılırlar.</template>

          <template>13 yıl ve daha fazla sigortalı bulunanlar en az 15 yıllık sigortalılık süresini doldurmuş ve en az 3600 gün prim ödemiş bulunmaları şartı ile yaşlılık aylığından yararlanabilirler.</template>

        <mvz-bent no="B">
          <template>23.5.2002 tarihinde;</template>
        </mvz-bent>
        <mvz-altbent no="a">

        </mvz-altbent>
        <mvz-altbent no="b">
          <template>Sigortalılık süresi 12 yıl 3 ay (dahil) dan fazla, 13 yıldan az olanlar kadın ise 41, erkek ise 45 yaşını doldurmuş olmaları,</template>
        </mvz-altbent>
        <mvz-altbent no="c">
          <template>Sigortalılık süresi 11 yıl 6 (dahil) aydan fazla, 12 yıl 3 aydan az olanlar kadın ise 42, erkek ise 46 yaşını doldurmuş olmaları,</template>
        </mvz-altbent>
        <mvz-altbent no="d">
          <template>Sigortalılık süresi 10 yıl 9 (dahil) aydan fazla, 11 yıl 6 aydan az olanlar kadın ise 43, erkek ise 47 yaşını doldurmuş olmaları,</template>
        </mvz-altbent>
        <mvz-altbent no="e">
          <template>Sigortalılık süresi 10 (dahil) yıldan fazla, 10 yıl 9 aydan az olanlar kadın ise 44, erkek ise 48 yaşını doldurmuş olmaları,</template>
